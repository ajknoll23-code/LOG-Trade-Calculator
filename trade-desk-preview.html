<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Desk Redesign Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091b2c;font-family:Inter,system-ui,sans-serif}
#previewNotice{height:34px;display:flex;align-items:center;justify-content:center;background:#e8b84b;color:#0b1925;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 18px rgba(0,0,0,.22);position:relative;z-index:5}
#liveFrame{display:block;border:0;width:100%;height:calc(100vh - 34px);background:#0e2841}
@media(max-width:640px){#previewNotice{height:30px;font-size:8px;padding:0 8px;text-align:center}#liveFrame{height:calc(100vh - 30px)}}
</style>
</head>
<body>
<div id="previewNotice">Design preview only · production index.html is unchanged</div>
<iframe id="liveFrame" src="./index.html?redesign-preview=1" title="Live Trade Desk redesign preview"></iframe>

<script>
(function(){
  const frame=document.getElementById('liveFrame');
  const POS=['QB','RB','WR','TE','DL','LB','DB','K'];
  const posClass={QB:'qb',RB:'rb',WR:'wr',TE:'te',DL:'dl',LB:'lb',DB:'db',K:'k'};

  function injectPreview(){
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d||!d.body) return;
    if(d.body.dataset.logRedesignPreview==='1') return;
    d.body.dataset.logRedesignPreview='1';
    d.title='Trade Desk · Redesign Preview';

    const style=d.createElement('style');
    style.id='log-redesign-preview-styles';
    style.textContent=`
      :root{
        --preview-deep:#091B2C;
        --preview-shadow:0 18px 48px rgba(2,10,18,.26);
      }
      html{scroll-behavior:smooth}
      body{
        background:radial-gradient(circle at 50% -8%,rgba(235,98,97,.08),transparent 34rem),var(--bg)!important;
      }
      .wrap{max-width:1180px!important;padding:0 20px 76px!important}

      .preview-appbar{
        position:sticky;top:0;z-index:40;height:58px;margin:0 -20px 18px;padding:0 20px;
        display:flex;align-items:center;gap:18px;background:rgba(9,27,44,.93);
        border-bottom:1px solid var(--line);backdrop-filter:blur(14px);
        box-shadow:0 8px 24px rgba(0,0,0,.12)
      }
      .preview-brand{display:flex;align-items:center;gap:10px;min-width:0}
      .preview-brand-mark{
        width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
        background:var(--panel);border:1px solid rgba(235,98,97,.28);
        color:var(--gold);font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.2)
      }
      .preview-brand-text{
        font-family:'Anton',sans-serif;font-size:16px;text-transform:uppercase;
        letter-spacing:.04em;white-space:nowrap
      }
      .preview-nav{display:flex;align-items:center;gap:4px;overflow:auto}
      .preview-nav button,.preview-nav a{
        border:0;background:transparent;color:var(--text-muted);text-decoration:none;
        font-family:'Inter',sans-serif;font-size:12px;font-weight:700;
        padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap
      }
      .preview-nav .active{
        color:var(--gold);background:rgba(235,98,97,.10);
        box-shadow:inset 0 0 0 1px rgba(235,98,97,.16)
      }
      .preview-nav button:hover,.preview-nav a:hover{
        background:rgba(255,255,255,.045);color:var(--text)
      }
      .preview-app-spacer{flex:1}
      .preview-app-live{
        display:flex;align-items:center;gap:7px;color:var(--text-dim);
        font-family:'IBM Plex Mono',monospace;font-size:9.5px;white-space:nowrap
      }
      .preview-app-live i{
        width:7px;height:7px;border-radius:50%;display:block;background:var(--green);
        box-shadow:0 0 9px rgba(63,203,124,.65)
      }

      header{
        display:grid!important;grid-template-columns:auto minmax(0,1fr)!important;
        grid-template-areas:'logo eyebrow' 'logo title' 'logo desc' 'logo live'!important;
        column-gap:17px!important;align-items:start!important;
        padding:8px 4px 22px!important;margin-bottom:18px!important
      }
      .league-logo{
        grid-area:logo!important;width:58px!important;margin:0!important;
        filter:drop-shadow(0 4px 12px rgba(235,98,97,.2))!important
      }
      header .eyebrow{grid-area:eyebrow!important;margin:2px 0 5px!important}
      header h1{
        grid-area:title!important;font-size:31px!important;text-shadow:none!important;
        margin-bottom:5px!important
      }
      header p{
        grid-area:desc!important;max-width:68ch!important;font-size:12.5px!important;
        line-height:1.45!important
      }
      header .live-status{grid-area:live!important;margin-top:8px!important}

      .section-label{
        font-family:'Inter',sans-serif!important;font-size:11px!important;font-weight:800!important;
        letter-spacing:.08em!important;color:var(--text-muted)!important;margin-top:22px!important
      }
      .section-label::after{
        background:linear-gradient(90deg,var(--line-strong),transparent)!important
      }

      .paired-action-btn{
        font-family:'Inter',sans-serif!important;font-size:10px!important;
        border-radius:9px!important;padding:8px 13px!important;transition:.16s ease!important
      }
      .paired-action-btn:hover{
        transform:translateY(-1px);border-color:rgba(255,255,255,.32)!important;
        background:var(--panel)!important
      }

      .preview-trade-grid{
        display:grid;grid-template-columns:minmax(0,1fr) 290px minmax(0,1fr);
        gap:16px;align-items:start;margin-top:2px
      }
      #sidesWrap{display:contents!important}
      #sidesWrap .side-a{grid-column:1;grid-row:1}
      #sidesWrap .side-b{grid-column:3;grid-row:1}
      .preview-trade-grid>.meter-wrap{
        grid-column:2;grid-row:1;margin:0!important;position:sticky;top:76px
      }

      .side{
        border-radius:15px!important;box-shadow:var(--preview-shadow)!important;
        background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 100px),var(--panel)!important
      }
      .side::before,.side::after{display:none!important}
      .side-head{
        padding:15px 16px 12px!important;border-bottom:1px solid var(--line)!important;
        align-items:center!important
      }
      .side-name{
        font-family:'Inter',sans-serif!important;font-size:14px!important;
        font-weight:800!important;letter-spacing:.02em!important
      }
      .side-total{font-size:22px!important}
      .side-total-label{font-size:8px!important}

      .asset-list{padding:12px!important;gap:8px!important}
      .asset-row{
        position:relative!important;display:grid!important;
        grid-template-columns:auto minmax(0,1fr) auto!important;align-items:center!important;
        gap:10px!important;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent),var(--panel-alt)!important;
        border-radius:11px!important;padding:10px!important;
        transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease!important
      }
      .asset-row:hover{
        transform:translateY(-1px);border-color:rgba(201,206,210,.30)!important;
        background:#224568!important;box-shadow:0 8px 22px rgba(0,0,0,.14)
      }
      .preview-pos-pill{
        min-width:34px;height:34px;padding:0 6px;display:grid;place-items:center;
        border-radius:9px;background:rgba(255,255,255,.045);
        border:1px solid rgba(255,255,255,.10);
        font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700
      }
      .preview-pos-pill.qb{color:#69B5FF}
      .preview-pos-pill.rb{color:#77E0A0}
      .preview-pos-pill.wr{color:#C79AFF}
      .preview-pos-pill.te{color:#F0C56A}
      .preview-pos-pill.dl{color:#FFAA7E}
      .preview-pos-pill.lb{color:#70E8E2}
      .preview-pos-pill.db{color:#F78FA8}
      .preview-pos-pill.k{color:#C9CED2}
      .asset-title{font-size:13px!important;font-weight:800!important}
      .asset-meta{
        font-size:9.5px!important;color:var(--text-muted)!important;margin-top:3px!important
      }
      .asset-right{gap:7px!important}
      .asset-value{font-size:15px!important;font-weight:700!important}
      .asset-range,.asset-market{
        display:inline-block!important;padding:2px 4px!important;border-radius:4px!important;
        background:rgba(255,255,255,.04)!important;font-size:8.5px!important
      }
      .remove-btn{transition:.15s ease!important}
      .remove-btn:hover{
        background:rgba(255,138,76,.12)!important;color:var(--red)!important;
        border-color:rgba(255,138,76,.35)!important
      }

      .add-controls{
        padding:11px 12px 14px!important;background:rgba(4,14,24,.10)!important
      }
      .tab-btn{
        font-family:'Inter',sans-serif!important;font-size:10px!important;
        font-weight:700!important;border-radius:8px!important
      }
      .add-btn{
        font-family:'Inter',sans-serif!important;font-size:12px!important;
        font-weight:800!important;border-radius:8px!important;transition:.15s ease!important
      }
      .add-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
      .chip{transition:.15s ease!important}
      .chip:hover{
        border-style:solid!important;border-color:var(--text-muted)!important;
        color:var(--text)!important;background:rgba(255,255,255,.035)!important
      }
      .suggest-item:hover{background:var(--bg)!important}

      .meter-wrap{
        padding:18px!important;border:1px solid var(--line)!important;
        border-radius:15px!important;
        background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--panel)!important;
        box-shadow:var(--preview-shadow)!important;text-align:center!important
      }
      .meter-wrap::before{
        content:'TRADE ANALYSIS';display:block;margin-bottom:7px;color:var(--text-dim);
        font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:.13em
      }
      .meter-verdict{font-size:29px!important;margin-bottom:7px!important}
      .meter-sub{
        font-size:10.5px!important;line-height:1.45!important;margin-bottom:16px!important
      }
      .meter{
        height:23px!important;border-radius:999px!important;background:var(--preview-deep)!important
      }
      .meter-labels{font-size:9.5px!important;margin-top:9px!important}

      .needs-grid{gap:8px!important}
      .need-cell{
        padding:10px 7px!important;border-radius:10px!important;
        background:var(--panel-alt)!important;box-shadow:inset 0 1px rgba(255,255,255,.02)!important
      }
      .need-pos{font-size:9px!important}
      .need-count{
        font-family:'Inter',sans-serif!important;font-size:15px!important;font-weight:800!important
      }
      .need-tier{font-size:8.5px!important}
      .roster-row{border-radius:10px!important;transition:.15s ease!important}
      .roster-row:hover{
        transform:translateY(-1px);border-color:rgba(201,206,210,.3)!important;
        background:#224568!important
      }
      .trade-impact{
        border-radius:12px!important;box-shadow:var(--preview-shadow)!important
      }

      details{
        border-radius:13px!important;box-shadow:0 12px 34px rgba(0,0,0,.12)!important
      }
      summary{
        font-family:'Inter',sans-serif!important;font-size:10px!important;font-weight:700!important
      }

      .preview-mobile-summary{
        display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;
        padding:10px 12px;border:1px solid rgba(255,255,255,.15);border-radius:13px;
        background:rgba(9,27,44,.94);backdrop-filter:blur(12px);
        box-shadow:0 14px 36px rgba(0,0,0,.36);
        grid-template-columns:1fr auto 1fr;gap:8px;align-items:center
      }
      .preview-mobile-summary>div:first-child{text-align:left;color:var(--gold)}
      .preview-mobile-summary>div:last-child{text-align:right;color:var(--violet)}
      .preview-mobile-summary strong{
        display:block;font-family:'IBM Plex Mono',monospace;font-size:11px
      }
      .preview-mobile-summary small{
        display:block;color:var(--text-dim);font-size:7.5px;margin-top:3px;text-transform:uppercase
      }
      .preview-mobile-summary .preview-mobile-verdict{
        text-align:center!important;color:var(--green)!important;
        font-family:'Anton',sans-serif;font-size:14px;text-transform:uppercase
      }

      @media(max-width:960px){
        .wrap{max-width:760px!important}
        .preview-trade-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
        #sidesWrap .side-a{grid-column:1;grid-row:1}
        #sidesWrap .side-b{grid-column:2;grid-row:1}
        .preview-trade-grid>.meter-wrap{
          grid-column:1/-1;grid-row:2;position:relative;top:auto
        }
      }
      @media(max-width:680px){
        .wrap{padding:0 12px 88px!important}
        .preview-appbar{
          height:52px;margin:0 -12px 14px;padding:0 12px;gap:8px
        }
        .preview-brand-text{font-size:14px}
        .preview-brand-mark{width:31px;height:31px}
        .preview-nav{gap:1px}
        .preview-nav button,.preview-nav a{font-size:9.5px;padding:7px 7px}
        .preview-app-live{display:none}
        header{
          grid-template-columns:48px minmax(0,1fr)!important;
          column-gap:12px!important;padding-bottom:17px!important
        }
        .league-logo{width:48px!important}
        header h1{font-size:25px!important}
        header p{font-size:11px!important}
        .preview-trade-grid{
          display:flex;flex-direction:column;gap:12px
        }
        #sidesWrap{display:contents!important}
        #sidesWrap .side-a,#sidesWrap .side-b,.preview-trade-grid>.meter-wrap{
          width:100%;grid-column:auto;grid-row:auto
        }
        .preview-trade-grid>.meter-wrap{order:0}
        .side-a{order:1}.side-b{order:2}
        .needs-grid{grid-template-columns:repeat(2,1fr)!important}
        .preview-mobile-summary{display:grid}
      }
    `;
    d.head.appendChild(style);

    const wrap=d.querySelector('.wrap');
    if(wrap){
      const appbar=d.createElement('div');
      appbar.className='preview-appbar';
      appbar.innerHTML=
        '<div class="preview-brand">'+
          '<div class="preview-brand-mark">★</div>'+
          '<div class="preview-brand-text">Trade Desk</div>'+
        '</div>'+
        '<nav class="preview-nav">'+
          '<button class="active" type="button">Trade Desk</button>'+
          '<button id="previewMyTeam" type="button">My Team</button>'+
          '<a href="./free-agent-board.html" target="_top">Free Agents</a>'+
        '</nav>'+
        '<div class="preview-app-spacer"></div>'+
        '<div class="preview-app-live"><i></i>LIVE MODEL</div>';
      wrap.prepend(appbar);

      const myTeam=appbar.querySelector('#previewMyTeam');
      if(myTeam){
        myTeam.addEventListener('click',()=>{
          if(typeof w.toggleMyTeam==='function') w.toggleMyTeam();
          else d.getElementById('myTeamToggle')?.click();
        });
      }
    }

    const sides=d.getElementById('sidesWrap');
    const meter=d.querySelector('.meter-wrap');
    if(sides && meter && !d.querySelector('.preview-trade-grid')){
      const grid=d.createElement('div');
      grid.className='preview-trade-grid';
      sides.parentNode.insertBefore(grid,sides);
      grid.appendChild(sides);
      grid.appendChild(meter);
    }

    const mobile=d.createElement('div');
    mobile.className='preview-mobile-summary';
    mobile.innerHTML=
      '<div><strong id="previewMobileA">0</strong><small>Side A</small></div>'+
      '<div class="preview-mobile-verdict" id="previewMobileVerdict">Build Trade</div>'+
      '<div><strong id="previewMobileB">0</strong><small>Side B</small></div>';
    d.body.appendChild(mobile);

    function decorateAssets(){
      d.querySelectorAll('.asset-row').forEach(row=>{
        if(row.querySelector('.preview-pos-pill')) return;

        const meta=(row.querySelector('.asset-meta')?.textContent||'').toUpperCase();
        const title=(row.querySelector('.asset-title')?.textContent||'').toUpperCase();

        const match=POS.find(p=>new RegExp('\\b'+p+'\\b').test(meta));
        let label=match||'';

        if(!label && (title.includes('PICK')||title.includes('ROUND'))) label='PICK';
        if(!label) return;

        const pill=d.createElement('span');
        pill.className='preview-pos-pill '+(posClass[label]||'');
        pill.textContent=label;
        row.insertBefore(pill,row.firstChild);
      });
    }

    function syncMobile(){
      const a=d.getElementById('labelA')?.textContent||'SIDE A — 0';
      const b=d.getElementById('labelB')?.textContent||'SIDE B — 0';
      const v=d.getElementById('verdictText')?.textContent||'Build Trade';

      const ma=d.getElementById('previewMobileA');
      const mb=d.getElementById('previewMobileB');
      const mv=d.getElementById('previewMobileVerdict');

      if(ma) ma.textContent=a.replace(/^SIDE A\s*[—-]?\s*/i,'')||'0';
      if(mb) mb.textContent=b.replace(/^SIDE B\s*[—-]?\s*/i,'')||'0';
      if(mv) mv.textContent=v;
    }

    decorateAssets();
    syncMobile();

    const observer=new MutationObserver(()=>{
      decorateAssets();
      syncMobile();
    });
    observer.observe(d.body,{subtree:true,childList:true,characterData:true});
  }

  frame.addEventListener('load',()=>{
    try{injectPreview();}
    catch(err){console.error('Trade Desk preview skin failed',err);}
  });
})();
</script>
</body>
</html>
