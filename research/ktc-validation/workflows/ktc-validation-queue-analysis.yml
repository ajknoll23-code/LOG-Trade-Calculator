name: KTC Validation Queue Analysis

# Runs ktc_validation_queue_analysis.py, which fetches votes live from the
# same Google Sheet ktc_pipeline.py uses -- no manual export/upload needed.
# Separate from the "KTC Vote Aggregation" workflow on purpose: that one
# updates ktc_ratings.json (Bradley-Terry player ratings / POSITION_WEIGHT
# tracking); this one answers the ratio-vs-differential scarcity question
# specifically. Run both after a batch of new votes -- this one doesn't
# replace the aggregator, it's an addition alongside it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Self-test before trusting real output
        run: python3 scripts/ktc_validation_queue_analysis.py --selftest

      - name: Run the analysis (fetches votes live from the Sheet)
        run: python3 scripts/ktc_validation_queue_analysis.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ktc_validation_analysis_report.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run KTC validation queue analysis"
          git push
