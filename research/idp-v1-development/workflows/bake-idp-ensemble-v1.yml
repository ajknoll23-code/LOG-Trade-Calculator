name: Validate Deployed IDP V1

# POST-DEPLOYMENT SAFETY WORKFLOW (2026-08-28)
# V1 is now baked into index.html using the approved model-delta transport.
# This workflow is read-only. It regenerates the canonical history/candidate
# lineage, validates the immutable pre-V1 -> deployed delta, and never edits or
# pushes index.html.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-deployed-idp-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install requests

      - name: Canonical history and V1 self-tests
        run: |
          python3 scripts/production_history_component.py --selftest
          python3 scripts/idp_v1_projection.py
          python3 scripts/idp_v1_model_delta_transport_candidate.py --selftest

      - name: Regenerate reproducible V1 lineage diagnostics
        run: |
          python3 scripts/production_history_component.py
          python3 scripts/idp_v1_production_candidate.py
          python3 scripts/idp_v1_isolated_projection_candidate.py
          python3 scripts/idp_v1_projection_only_candidate.py
          python3 scripts/idp_v1_model_delta_transport_candidate.py
          python3 scripts/validate_idp_v1_candidates.py

      - name: Validate actual deployed production table
        run: python3 scripts/validate_idp_v1_final_deployment.py

      - name: Prepare derived player-position compatibility map
        run: python3 scripts/generate_player_positions.py

      - name: Repository regression checks
        run: python3 scripts/repo_regression_checks.py

      - name: Confirm validation never edited production
        run: git diff --exit-code -- index.html
