name: Lineup History Availability Check

# Manual-trigger-only workflow -- this is a one-time feasibility check, not
# a recurring job. Go to the Actions tab in GitHub, select "Lineup History
# Availability Check" in the left sidebar, click "Run workflow", then
# confirm. Should take well under a minute -- it walks the
# previous_league_id chain to find reachable past seasons, then pulls one
# sample week's matchups per season to confirm the data is real and
# well-formed.
#
# Unlike PPG Validation, this workflow does NOT write anything back to the
# repo. It's read-only: the full report (which seasons are reachable,
# whether roster_positions is consistent across them, whether each
# season's sample week returned real starters/players/points) prints
# directly to the Action's log. There's no ppg_results.json-style output
# file -- read the log itself for the answer.

on:
  workflow_dispatch:

# No write permissions needed -- this workflow never commits anything back
# to the repo, unlike PPG Validation/Durability Validation/etc.
permissions:
  contents: read

jobs:
  check-lineup-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run lineup history availability check
        run: python3 scripts/check_lineup_history_availability.py
