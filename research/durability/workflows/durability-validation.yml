name: Durability Validation (Multi-Season Games-Played R^2)

# Manual-trigger-only, same as PPG Validation -- this is a data-generation
# run, not a recurring job. Go to the Actions tab, select "Durability
# Validation (Multi-Season Games-Played R^2)" in the left sidebar, click
# "Run workflow", then confirm.
#
# Takes noticeably longer than PPG Validation -- it fetches six full
# seasons of weekly stats (2019-2024) instead of one, so expect several
# minutes rather than 1-2.
#
# Output: scripts/durability_results.json, committed back to the repo
# automatically. Real year-over-year games-played R^2 per position (DL,
# LB, DB, QB, RB, WR, TE) -- this is the number needed to replace the
# current flat 65/35 durability blend (index.html's productionMultiplier
# methodology) with a per-position, data-derived ratio instead of one
# judgment-call number applied to every position identically.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-durability-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run durability pipeline
        run: python3 scripts/durability_pipeline.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/durability_results.json
          git diff --staged --quiet || git commit -m "Add multi-season durability R^2 results"
          git push
