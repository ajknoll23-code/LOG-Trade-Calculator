name: Legacy Prod Mult Reconstruction (Diagnostic)

# SAFETY STATUS 2026-08-28:
# This is NOT the canonical production bake path. The lineage audit proved that
# prod_mult_pipeline.py does not reproduce the actual historical live table and
# its projection side still uses the retired manual-FP/Sleeper final-points
# blend. Keep it available for diagnostics/history only. It never pushes.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: legacy-prod-mult-diagnostic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight -- confirm legacy diagnostic inputs exist
        run: |
          missing=0
          for f in scripts/prod_mult_pipeline.py scripts/production_history_component.py \
                   scripts/ppg_results.json scripts/sleeper_2026_projections.json \
                   scripts/fantasypros_2026_projections.json scripts/durability_results.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required input not found: $f"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Run legacy reconstruction
        run: python3 scripts/prod_mult_pipeline.py

      - name: Self-test validator
        run: python3 scripts/validate_prod_mult_output.py --selftest --selftest-only

      - name: Validate generated diagnostic output
        run: python3 scripts/validate_prod_mult_output.py

      - name: Audit against immutable true-live pre-V1 baseline
        run: python3 scripts/audit_prod_mult_lineage.py

      - name: Upload diagnostic artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: legacy-prod-mult-diagnostic
          path: |
            scripts/prod_mult_pipeline_output.json
            scripts/prod_mult_diff_summary.md
            scripts/prod_mult_lineage_audit.md
            scripts/prod_mult_lineage_audit.json
