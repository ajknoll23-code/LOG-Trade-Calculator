      - name: Re-run production and repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit frozen Phase 4 development fits
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during run; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v5/fit_r1_r2_development_candidates_v5.py \
            research/draft-pick-fv-v5/r1_r2_development_candidate_fit_v5.json \
            research/draft-pick-fv-v5/r1_r2_development_candidate_fit_v5.md \
            research/draft-pick-fv-v5/r1_r2_development_candidate_fit_manifest_v5.json

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Freeze Draft Pick FV V5 Phase 4 development fits"
          git push origin HEAD:main
