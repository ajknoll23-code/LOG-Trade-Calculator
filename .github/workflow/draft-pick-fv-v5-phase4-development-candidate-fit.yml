          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_historical_outcome_manifest_v5_1.json)" = \
            "172d8bfdbe59ffd0cd52d395342fc1a26eac30d8"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_historical_outcome_summary_v5_1.json)" = \
