name: A-QA22 - Six Player Independent Role and Market Review (Read Only)
run-name: A-QA22 Roschon Jake Roman Treylon Zonovan Elijah independent valuation checks NO RELEASE
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: a-qa22-six-player-independent-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA22_SRC: ${{ runner.temp }}/qa22-qa15
      QA22_OUT: ${{ runner.temp }}/qa22-output
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout read-only
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Download pinned QA15 opportunity internal audit
      uses: actions/download-artifact@v4
      with:
        name: A-QA15-Opportunity-Aware-Peer-Shadow
        run-id: '41099108472'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: ${{ env.QA22_SRC }}
    - name: Crosscheck six players vs current roster, Sleeper season context, private FP/DLF ranks
      shell: bash
      env:
        CAL26_DLF_SF_CSV_B64: ${{ secrets.CAL26_DLF_SF_CSV_B64 }}
        FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      run: "set -euo pipefail\nmkdir -p \"$QA22_OUT\"\npython3 - <<'PY_SOURCE'\nimport json,os,pathlib\np=pathlib.Path(os.environ['QA22_SRC']);m=json.loads((p/'QA15_Manifest.json').read_text())\n\
        assert m['cohort']==72 and m['candidate_reviews']==16 and not m['independent_market_validated']\nassert m['read_only']\
        \ and not m['release_approved']\nPY_SOURCE\ncat > \"$RUNNER_TEMP/qa22_engine.py\" <<'PY_ENGINE'\n#!/usr/bin/env python3\n\
        import base64,collections,csv,datetime,hashlib,io,json,math,os,pathlib,re,urllib.parse,urllib.request,urllib.error\n\
        ROOT=pathlib.Path('.');SRC=pathlib.Path(os.environ['QA22_SRC']);OUT=pathlib.Path(os.environ['QA22_OUT']);OUT.mkdir(exist_ok=True,parents=True)\n\
        TARGETS={'10235':('Roschon Johnson','RB',4618),'8349':('Jake Hansen','LB',4004),'11630':('Roman Wilson','WR',3575),'8135':('Treylon\
        \ Burks','WR',3575),'8122':('Zonovan Knight','RB',2391),'7561':('Elijah Mitchell','RB',2336)}\ndef fail(s):raise AssertionError('QA22_SOURCE_INTEGRITY_'+str(s))\n\
        def norm(s):\n s=str(s or '').lower().replace('\u2019',\"'\")\n s=re.sub(r\"[.\\-']\",'',s);s=re.sub(r'\\b(jr|sr|ii|iii|iv)\\\
        b','',s)\n return ' '.join(s.split())\ndef qile(value,values,descending=False):\n if value is None or not values:return\
        \ 'MISSING_OR_UNRANKED'\n percentile=100*(sum(x>value for x in values)+.5*sum(x==value for x in values))/len(values)\
        \ if descending else 100*(sum(x<value for x in values)+.5*sum(x==value for x in values))/len(values)\n return 'TOP_QUARTILE'\
        \ if percentile>=75 else 'UPPER_MIDDLE' if percentile>=50 else 'LOWER_MIDDLE' if percentile>=25 else 'BOTTOM_QUARTILE'\n\
        def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()\ndef load(p):return json.loads(pathlib.Path(p).read_text())\n\
        m=load(SRC/'QA15_Manifest.json')\nassert m['cohort']==72 and m['candidate_reviews']==16 and m['read_only'] and not\
        \ m['release_approved']\nassert not m['independent_market_validated'] and not m['recommended_fv_count']\nassert all(m[k]==0\
        \ for k in ['fv_changes','fv_plus_changes','mv_changes','repo_mutations'])\nraw=list(csv.DictReader((SRC/'QA15_All72_Opportunity_Ranges.csv').open(newline='',encoding='utf8')))\n\
        cases={r['sleeper_id']:r for r in raw}\nassert len(raw)==72 and len(cases)==72\nfor sid,(name,pos,fv) in TARGETS.items():\n\
        \ r=cases[sid]\n assert (r['player'],r['position'],int(r['current_fv_UNCHANGED']))==(name,pos,fv)\n assert r['review_status']=='OPPORTUNITY_CHECKED_INTERNAL_RANGE_FOR_REVIEW'\
        \ and not r['new_fv_recommended']\nros=load('data/league_rosters.json');fa=load('data/free_agents.json')\nassert len(ros['rosters'])==12\
        \ and ros['league_id']==fa['league_id']\nroster={}\nfor t in ros['rosters']:\n for slot in ('starters','bench','taxi','reserve_ir'):\n\
        \  for p in t.get(slot,[]):\n   sid=str(p.get('player_id') or '')\n   if sid in TARGETS:\n    if sid in roster:fail('DUPLICATE_SLEEPA_ID_'+sid)\n\
        \    roster[sid]={'sleeper_owner':t['team_name'],'fantasy_slot':slot,'nfl_team':p.get('team'),'nfl_depth_order':p.get('depth_chart_order'),'injury':p.get('injury_status'),'status':p.get('status')}\n\
        free={str(x['player_id']):x for x in fa['free_agents'] if str(x['player_id']) in TARGETS}\nfor sid in TARGETS:\n if\
        \ (sid in free)==(sid in roster):fail('ROSTER_OR_FA_EXCLUSIVITY_'+sid)\nprojs={str(p['sleeper_id']):p for p in load('scripts/sleeper_2026_projections.json')\
        \ if str(p.get('sleeper_id')) in TARGETS}\nppg={str(p['sleeper_id']):p for p in load('scripts/ppg_results.json') if\
        \ str(p.get('sleeper_id')) in TARGETS}\n# Parse private DLF offensive dynasty values entirely in job memory. Only\
        \ relative bands published.\ndlf_status='HOLD_NO_SECRET';dlf=collections.defaultdict(dict);dlf_vals=collections.defaultdict(list)\n\
        secret=os.environ.get('CAL26_DLF_SF_CSV_B64','').strip()\nif secret:\n try:\n  src=csv.DictReader(io.StringIO(base64.b64decode(secret,validate=True).decode('utf8-sig')))\n\
        \  if src.fieldnames!=['name','position','team','value']:raise ValueError('PRIVATE_DLF_SCHEMA_CHANGED')\n  for row\
        \ in src:\n   pos=row['position'].strip().upper()\n   if pos not in ('RB','WR'):continue\n   name=norm(row['name']);v=float(row['value']);assert\
        \ math.isfinite(v) and v>0\n   assert name not in dlf[pos],('duplicate DLF',pos,name)\n   dlf[pos][name]=v;dlf_vals[pos].append(v)\n\
        \  dlf_status='PASS_PRIVATE_DLF_OFFENSE_ORDINAL' if min(len(dlf['RB']),len(dlf['WR']))>=15 else 'HOLD_TOO_FEW_DLF_ROWS'\n\
        \ except Exception:dlf_status='HOLD_INVALID_PRIVATE_DLF_INPUT';dlf={};dlf_vals={}\nif not dlf_status.startswith('PASS_'):dlf={};dlf_vals={}\n\
        # Fetch FantasyPros dynasty positional QB-independent consensus. Only quartile bands exported.\nfp_status={};fp={};fp_vals={}\n\
        key=os.environ.get('FANTASYPROS_API_KEY','').strip()\nfor pos in ('RB','WR'):\n if not key:fp_status[pos]='HOLD_NO_API_KEY';continue\n\
        \ url='https://api.fantasypros.com/public/v2/json/nfl/2026/consensus-rankings?'+urllib.parse.urlencode({'position':pos,'type':'DYNASTY','scoring':'PPR'})\n\
        \ req=urllib.request.Request(url,headers={'x-api-key':key,'Accept':'application/json','User-Agent':'LOG-QA22-NoRelease','Cache-Control':'no-cache'})\n\
        \ try:\n  with urllib.request.urlopen(req,timeout=25) as response:raw=response.read(12_000_001)\n  if len(raw)>12_000_000:raise\
        \ ValueError('API_TOO_LARGE')\n  doc=json.loads(raw)\n  if doc.get('ranking_type_name')!='dynasty' or not isinstance(doc.get('players'),list):raise\
        \ ValueError('BAD_API_RANKING_SCHEMA')\n  vals={}\n  for v in doc['players']:\n   if not isinstance(v,dict):continue\n\
        \   if str(v.get('player_position_id') or v.get('position_id') or v.get('position') or '').upper()!=pos:continue\n\
        \   n=norm(v.get('player_name') or v.get('name'))\n   try:q=float(v['rank_ecr'])\n   except (TypeError,ValueError,KeyError):continue\n\
        \   if not n or not math.isfinite(q) or q<=0:continue\n   if n in vals:raise ValueError('DUPLICATE_PLAYER_MATCH')\n\
        \   vals[n]=q\n  fp_status[pos]='PASS_DYNASTY_RANKINGS' if len(vals)>=20 else 'HOLD_INSUFFICIENT_RANKS'\n  if fp_status[pos].startswith('PASS_'):fp[pos]=vals;fp_vals[pos]=list(vals.values())\n\
        \ except Exception as e:fp_status[pos]='HOLD_API_ERROR_'+type(e).__name__\nrecords=[]\nfor sid,(name,pos,fv) in TARGETS.items():\n\
        \ r=cases[sid];keyname=norm(name);own=roster.get(sid);f=free.get(sid)\n a=projs.get(sid,{})\n if not a or a.get('pos')!=pos:fail('BAD_SLEEPA_PROJECTION_ID_'+sid)\n\
        \ dlfv=dlf.get(pos,{}).get(keyname)\n fpv=fp.get(pos,{}).get(keyname)\n rp=ppg.get(sid)\n low=int(r['new_range_low_CONTEXT_ONLY']);mid=int(r['new_range_median_CONTEXT_ONLY']);high=int(r['new_range_high_CONTEXT_ONLY'])\n\
        \ row={'sleeper_id':sid,'player':name,'position':pos,'current_FV_UNCHANGED':fv,'QA15_internal_low_CONTEXT_ONLY':low,'QA15_internal_median_CONTEXT_ONLY':mid,'QA15_internal_high_CONTEXT_ONLY':high,'internal_FV_to_median_ratio':round(fv/mid,2),'QA15_LOO_p75_error_percent':float(r['opportunity_loo_p75_error_pct']),\n\
        \  'Sleeper_2026_full_season_projected_points_HISTORICAL_CONTEXT':a['sleeper_2026_proj_total'],\n  'Sleeper_history_games_observed':int(r['historical_games_observed'])\
        \ if r['historical_games_observed'] else None,\n  'Season_PPG_history_observed':rp['true_ppg'] if rp else None,\n\
        \  'NFL_team':(own or f).get('nfl_team') if own else f.get('team'),\n  'NFL_depth_chart_order':(own or f).get('nfl_depth_order')\
        \ if own else f.get('depth_chart_order'),\n  'league_status':'ROSTERED' if own else 'FREE_AGENT','fantasy_slot':own['fantasy_slot']\
        \ if own else None,\n  'injury_status':(own or f).get('injury') if own else f.get('injury_status'),\n  'DLF_position_quartile_only':qile(dlfv,dlf_vals.get(pos,[]))\
        \ if pos!='LB' else 'NO_IDP_DLF_SOURCE',\n  'FantasyPros_dynasty_position_quartile_only':qile(-fpv,[-v for v in fp_vals.get(pos,[])])\
        \ if fpv is not None else ('NO_VALID_LB_SOURCE' if pos=='LB' else 'MISSING_OR_UNRANKED'),\n  'independent_source_comparison':('NO_CURRENT_INDEPENDENT_IDP_ANCHOR'\
        \ if pos=='LB' else 'ORDINAL_ONLY_NO_CARDINAL_PRICE'),\n  'source_asof_verified':'NO','proposed_new_FV':'','FV_changed':'NO'}\n\
        \ records.append(row)\nrecords.sort(key=lambda r:-r['current_FV_UNCHANGED'])\nwith (OUT/'QA22_Six_Player_Independent_Evidence.csv').open('w',newline='',encoding='utf8')\
        \ as file:\n w=csv.DictWriter(file,fieldnames=list(records[0]));w.writeheader();w.writerows(records)\nsource={'qa15_green_run':41099108472,'qa15_manifest_sha256':sha(SRC/'QA15_Manifest.json'),'sleeper_roster_last_sync_unix':ros['synced_at'],'sleeper_FA_last_sync_unix':fa['synced_at'],'DLF_source_status':dlf_status,'FantasyPros_status':fp_status,'freshness_verified':False,'current_ROS_projections_verified':False,'league_roster_player_ids_unique':True,'targets':6,'new_fv_proposals':0,'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repository_mutations':0,'read_only':True,'release_authorized':False}\n\
        (OUT/'QA22_Manifest.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\\n')\nlines=['# A-QA22 \u2014 Next\
        \ Six Fallback FV Investigation','', '**READ ONLY: Source ordering, roster status, opportunity, and internal consistency\
        \ \u2014 not new FV proposals.**','',\n f\"- DLF: **{dlf_status}**; FantasyPros RB: **{fp_status.get('RB','UNAVAILABLE')}**;\
        \ WR: **{fp_status.get('WR','UNAVAILABLE')}**.\",\n f\"- League snapshot: **{datetime.datetime.fromtimestamp(ros['synced_at'],datetime.timezone.utc).isoformat()}**;\
        \ role and injury status may have changed since that time.\",\n '- Sleeper 2026 projection values are season-total\
        \ context, not validated current ROS forecast.','- Source vintages, IDP dynasty market values, and external cardinal\
        \ FV mapping remain unverified.',\n '- LB Jake Hansen is intentionally held for a dedicated IDP opportunity / snap-share\
        \ source; offensive DLF/FP data cannot validate his LB price.','',\n '| Player | Current FV | Internal QA15 median\
        \ | FP dynasty band | DLF band | Roster |', '|---|---:|---:|---|---|---|']\nfor x in records:lines.append(f\"| {x['player']}\
        \ | {x['current_FV_UNCHANGED']:,} | {x['QA15_internal_median_CONTEXT_ONLY']:,} | {x['FantasyPros_dynasty_position_quartile_only']}\
        \ | {x['DLF_position_quartile_only']} | {x['league_status']} |\")\nlines += ['','**Next decision:** compare ordinal\
        \ source agreement and current depth/opportunity, then establish numerical validation on same-position peer cohorts;\
        \ do not auto-apply internal medians.','No code or production prices modified.']\n(OUT/'QA22_Report.md').write_text('\\\
        n'.join(lines)+'\\n')\nprint(json.dumps({'status':'QA22_READ_ONLY_SIX_PLAYER_EVIDENCE','players':len(records),'sources':source,'production_changes':0}))\n\
        \nPY_ENGINE\npython3 -m py_compile \"$RUNNER_TEMP/qa22_engine.py\"\npython3 \"$RUNNER_TEMP/qa22_engine.py\"\n"
    - name: Protect release and no code mutations
      shell: bash
      run: 'set -euo pipefail

        git diff --exit-code

        test -z "$(git status --porcelain --untracked-files=all)"

        python3 - <<''PY_CHECK''

        import json,os,pathlib,csv

        p=pathlib.Path(os.environ[''QA22_OUT'']);m=json.loads((p/''QA22_Manifest.json'').read_text())

        r=list(csv.DictReader((p/''QA22_Six_Player_Independent_Evidence.csv'').open()))

        assert len(r)==6 and len({x[''sleeper_id''] for x in r})==6

        assert all(not x[''proposed_new_FV''] and x[''FV_changed'']==''NO'' for x in r)

        assert all(m[x]==0 for x in (''new_fv_proposals'',''fv_changes'',''fv_plus_changes'',''mv_changes'',''repository_mutations''))

        assert m[''read_only''] and not m[''release_authorized'']

        PY_CHECK'
    - name: Upload A-QA22 research evidence
      uses: actions/upload-artifact@v4
      with:
        name: A-QA22-Six-Player-Independent-Research
        path: ${{ env.QA22_OUT }}/
        retention-days: 30
        if-no-files-found: error
    - name: Mobile review
      if: always()
      shell: bash
      run: if test -f "$QA22_OUT/QA22_Report.md"; then cat "$QA22_OUT/QA22_Report.md" >> "$GITHUB_STEP_SUMMARY"; else echo
        'QA22 held before final report; no prices changed.' >> "$GITHUB_STEP_SUMMARY"; fi
