# OPS2 ONE-TIME QF1-QF10 CLEANUP (MAIN DIRECT COMMIT)
# Manual run ONCE. No PR. No separate preview. Archives itself on success.
# 18 obsolete QF audit/review versions + OPS1 + OPS2 = 20 byte-identical moves.
# Preserves 10 latest production-promotion gates and 7 YAML dependencies they require.
# Does not modify index.html, scripts/, research/, data/, model/, or any frozen values.
name: OPS2 - One-Time QF Cleanup Direct to Main

'on':
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  archive-once:
    if: github.repository == 'ajknoll23-code/LOG-Trade-Calculator' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact archive candidates and stage 20 identical renames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_OPS2'
          from pathlib import Path
          import re
          import subprocess
          
          ROOT = Path('.github/workflows')
          ARCHIVE = Path('.github/workflow-archive/completed-research')
          EXPECTED_BLOBS = {'QF1-v2.yml': 'a363c60aee1f8eb0c4339b5dc79c9d2c22ccd47b', 'QF10-v1.yml': '5222db108e7675664c749c9e9483a56a21ed6955', 'QF10-v2.yml': '374ddaf8565f8afeb414e74d97a94927a0a45c63', 'QF10-v3.yml': '6e68533a251b8d220eb1d2b21c0fddc154b85ab5', 'QF10-v4.yml': 'a8518a3d7b53c494c76fb97520888f6c7134fbb4', 'QF10-v4r1.yml': '587c70b2fe4c747cfa1e26307a2ab2be16aa1769', 'QF10-v5.yml': '132caddd57270326e735f8dd77ca63cb11c9d627', 'QF10-v6.yml': '3267256ce6c9a5ab8f11db8180b9aa817e12f0cc', 'QF10-v7.yml': '66dc479c3872add80ab76cb1acd53bd2b1c97c32', 'QF10-v8.yml': '1bda426f73d09c15a1aff9878d22fbea5093c4bb', 'QF2-v1r3.yml': 'fb0f919efbce750c12786e1e6a1dfee97930eae2', 'QF3-v1.yml': '479e651b41d95803815795eece66729588d2008e', 'QF5-v1r2.yml': '1ae3cb242f54da995d12c8dc7a0899cc2a0ef15f', 'QF6-v1.yml': '8b0794e592d4b01645d19f15bfea5e6e937d2305', 'QF6-v2.yml': 'cc6bd369e4e0ba9ff599a9bb744dc20c6241238b', 'QF7-v1.yml': '4c987f8a2012b1cc5300a7ba03ac8884772f9865', 'QF8-v1.yml': '5adcaf99fc23a576b257811b7fcae70207cc3183', 'QF8-v2.yml': '9fa7aa2b0a4dbda7959bed05a1883eb1341d80b0'}
          PROTECTED_GATES = set(['QF1-v3.yml', 'QF2-v2.yml', 'QF3-v2.yml', 'QF4-v2.yml', 'QF5-v3.yml', 'QF6-v3.yml', 'QF7-v3.yml', 'QF8-v3.yml', 'QF9-v3r1.yml', 'QF10-v9.yml'])
          REQUIRED_QA_DEPENDENCIES = set(['QF4-v1r1.yml', 'QF5-v2r1.yml', 'QF6-v2r1.yml', 'QF7-v2.yml', 'QF8-v2r1.yml', 'QF9-v1.yml', 'QF9-v2.yml'])
          OPS1 = 'OPS1-workflow-cleanup-qf11-archive.yml'
          OPS2 = 'OPS2-one-shot-qf-cleanup.yml'
          OPS1_BLOB = '81d348faa80145c49d6122eb531d993840f062da'
          
          
          def check(ok, why):
              if not ok:
                  raise SystemExit('STOP: ' + why)
          
          
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          
          check(git('branch', '--show-current') == 'main', 'not on main')
          check(git('status', '--porcelain', '--untracked-files=all') == '', 'dirty initial checkout')
          check(git('rev-parse', 'HEAD') == git('ls-remote', 'origin', 'refs/heads/main').split()[0],
                'main advanced since checkout; rerun only after inspecting changes')
          
          check(ROOT.is_dir() and ARCHIVE.is_dir(), 'missing workflows or archive directory')
          check(len(list(ARCHIVE.glob('QF11-v*.yml'))) == 51, 'OPS1 QF11 archive not present in expected state')
          check(not list(ROOT.glob('QF11-v*.yml')), 'QF11 was restored to active folder')
          
          actual_qf = {f.name for f in ROOT.glob('QF*-v*.yml') if f.is_file()}
          expected_qf = set(EXPECTED_BLOBS) | PROTECTED_GATES | REQUIRED_QA_DEPENDENCIES
          check(len(EXPECTED_BLOBS) == 18 and len(PROTECTED_GATES) == 10 and
                len(REQUIRED_QA_DEPENDENCIES) == 7 and len(expected_qf) == 35,
                'inconsistent frozen allowlists')
          check(actual_qf == expected_qf,
                'active QF set changed; missing=' + str(sorted(expected_qf - actual_qf)) +
                ' extra=' + str(sorted(actual_qf - expected_qf)))
          
          for name, blob in EXPECTED_BLOBS.items():
              src = ROOT / name
              check(src.is_file() and not src.is_symlink(), 'bad candidate file ' + name)
              check(git('hash-object', str(src)) == blob, 'candidate changed since review: ' + name)
          for name in PROTECTED_GATES | REQUIRED_QA_DEPENDENCIES:
              check((ROOT / name).is_file(), 'protected workflow missing ' + name)
          check(git('hash-object', str(ROOT / OPS1)) == OPS1_BLOB,
                'original OPS1 changed; manual review needed')
          check((ROOT / OPS2).is_file(), 'OPS2 not registered in active workflow directory')
          
          moving = set(EXPECTED_BLOBS) | {OPS1, OPS2}
          check(len(moving) == 20, 'incorrect move count')
          for name in moving:
              check(not (ARCHIVE / name).exists(), 'archive destination already exists: ' + name)
          
          # Protect active callers: no preserved workflow may import/read one of the
          # retired paths. The dependent 7 QA YAMLs stay active for this reason.
          for workflow in list(ROOT.glob('*.yml')) + list(ROOT.glob('*.yaml')):
              if workflow.name in moving:
                  continue
              data = workflow.read_text(encoding='utf-8')
              for name in moving:
                  check(('.github/workflows/' + name) not in data,
                        f'{workflow.name} refers to active path for {name}')
          
          # Preserve the one-time cleanup's original content. Nothing in scripts,
          # research, production HTML or generated data is edited.
          for name in sorted(moving):
              subprocess.run(['git', 'mv', '--', str(ROOT / name), str(ARCHIVE / name)], check=True)
          
          changes = git('diff', '--cached', '--name-status', '-M').splitlines()
          check(len(changes) == 20, 'expected exactly 20 staged renames')
          for entry in changes:
              parts = entry.split('\t')
              check(len(parts) == 3 and parts[0] == 'R100', 'non-identical file move: ' + entry)
              src, dst = parts[1:]
              check(src.startswith('.github/workflows/') and
                    dst == '.github/workflow-archive/completed-research/' + Path(src).name and
                    Path(src).name in moving, 'out-of-scope staged change: ' + entry)
          for name, blob in EXPECTED_BLOBS.items():
              check(git('hash-object', str(ARCHIVE / name)) == blob, 'archive hash changed: ' + name)
          
          print('GREEN: 18 obsolete QF workflows, OPS1, and OPS2 staged as 20 identical archive renames.')
          print('GREEN: ten promotion gates and their seven QA dependencies remain runnable.')
          print('GREEN: all 51 previously archived QF11 files preserved.')
          PY_OPS2

      - name: Commit archive directly to main (no pull request)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'OPS2: archive obsolete QF workflows and retire cleanup utilities'
          git push origin HEAD:refs/heads/main
          echo 'GREEN: OPS2 complete. 18 QF audit versions + OPS1 + OPS2 archived.'
          echo 'GREEN: OPS2 removes itself from Actions; do not rerun.'
