        check research/ktc-v2-isolated/V32_BRIDGE_OPERATIONS.md bd495f8859b51bb4e2b0447cd65a84360968b79f

        [[ ! -e research/ktc-v2-isolated/frame-host.gs ]] || { echo STOP_PREEXISTING_frame-host.gs; exit 1; }

        [[ ! -e research/ktc-v2-isolated/pilot-frame.html ]] || { echo STOP_PREEXISTING_pilot-frame.html; exit 1; }

        [[ ! -e research/ktc-v2-isolated/frame-host.test.js ]] || { echo STOP_PREEXISTING_frame-host.test.js; exit 1; }

        [[ ! -e research/ktc-v2-isolated/V33_IFRAME_TRANSPORT_OPERATIONS.md ]] || { echo STOP_PREEXISTING_V33_IFRAME_TRANSPORT_OPERATIONS.md;
        exit 1; }

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        echo QF11_V33_FROZEN_AND_V32_PINS_GREEN

        '
