name: Draft Pick FV V9 - Phase 0/1 Production Candidate Development Freeze

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: draft-pick-fv-v9-production-candidate-development
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}
  V8_P2_RUN_ID: '36469782185'
  V8_P2_ARTIFACT_NAME: 'v8-p2-historical-outcome-harvest-closeout'

jobs:
  develop_and_freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install pinned V9 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" \
            "requests==2.34.2"

      - name: Guard exact V8.1 scientific closeout
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")

          expected_blobs={
            "v8_1_final_research_closeout.json":
              "e7e49fba505b0dc11818ca51c83007ac4d712a16",
            "v8_1_final_research_closeout_manifest.json":
              "590907efa3517b385f0ce05e8ad90fe5d1e8b208",
            "v8_1_phase2_2024_h2_confirmation.json":
              "fca01dbea074a0ad83dc4caa149c1e8360ff5466",
            "v8_1_phase2_2024_h2_opening_closeout.json":
              "64ce1654446f46d92f817ca353f52df983132051",
            "v8_1_phase2_2024_h2_scored_occurrences.jsonl":
              "68c110e568a8100a5b713fe5e5d3b42538ecefe7",
          }

          for name,expected in expected_blobs.items():
              actual=subprocess.check_output(
                  ["git","hash-object",str(d/name)],text=True
              ).strip()
              assert actual==expected,(name,expected,actual)

          close=json.loads((d/"v8_1_final_research_closeout.json").read_text())
          h2=json.loads((d/"v8_1_phase2_2024_h2_confirmation.json").read_text())
          h2c=json.loads((d/"v8_1_phase2_2024_h2_opening_closeout.json").read_text())

          assert close["decision"]=="CLOSE_V8_1_H2_STOP_NO_H3_NO_PRODUCTION"
          assert close["status"]=="RESEARCH_CLOSED_H2_CONFIRMATION_STOP"
          assert close["frozen_next_action"]["future_research_must_be_new_study"] is True
          assert close["frozen_next_action"]["2024_h2_is_now_exposed_and_must_not_be_treated_as_fresh_holdout_again"] is True
          assert close["scientific_conclusion"]["production_change_authorized"] is False

          assert h2["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert h2["gate_pass"] is False
          assert h2["next_stage"] is None
          assert h2["metrics"]["h2_o2"]["C1_improvement_vs_C0"] > 0.50
          assert h2["metrics"]["h2_o2"]["round_relative_regression_vs_C0"]["6"] > 0.25

          assert h2c["2024_h2_outcome_bytes_opened"] is True
          assert h2c["2024_rookie_h2_scored"] is True
          assert h2c["normal_rerun_allowed"] is False
          assert h2c["2024_h3_scored"] is False
          assert h2c["2026_outcomes_read"] is False

          print("PASS: V8.1 is closed; 2024 H2 is exposed development evidence for V9.")
          PY

      - name: Freeze V9 production-oriented preregistration
        id: prereg
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          D="research/draft-pick-fv-v9"
          P="$D/v9_production_candidate_preregistration.json"
          M="$D/v9_production_candidate_preregistration.md"
          mkdir -p "$D"

          if [[ -e "$P" || -e "$M" ]]; then
            echo "Existing V9 preregistration detected; validating exact contract."
          else
            python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v9")

          c0={
            "r1_early":7500,"r1_mid":5854,"r1_late":5244,
            "r2_early":3906,"r2_mid":3624,"r2_late":3291,
            "r3_early":2692,"r3_mid":2682,"r3_late":2319,
            "r4_early":1972,"r4_mid":1831,"r4_late":1689,
            "r5_early":1414,"r5_mid":1250,"r5_late":1118,
            "r6_early":1014,"r6_mid":853,"r6_late":740,
          }

          obj={
            "schema_version":1,
            "study_id":"draft-pick-fv-v9-production-oriented-round-ramp",
            "stage":"phase0_production_candidate_preregistration",
            "status":"FROZEN_BEFORE_V9_CANDIDATE_SEARCH",
            "decision":"FREEZE_V9_ROUND_RAMP_PRODUCTION_CANDIDATE_CONTRACT",
            "reason_for_v9":[
              "V8/V8.1 showed very large O2 scale improvement from global compression.",
              "The repeated failure mode was isolated to Round 6 under a single global multiplier.",
              "V9 therefore tests a low-dimensional smooth round-ramp multiplier that can preserve stronger late-round values without fitting 18 independent cells.",
              "The prior O1 robustness metric is retained as a broad sanity cap rather than the primary FV veto because O2 is the declared Fundamental Value scale target and V8 evidence showed the two shapes conflict materially."
            ],
            "evidence_classification":{
              "2018_2023_H3":"EXPOSED_DEVELOPMENT",
              "2018_2023_H2_H4":"EXPOSED_ROBUSTNESS",
              "2024_H2":"EXPOSED_DEVELOPMENT_NOT_HOLDOUT",
              "2024_H3":"NOT_READ_BY_V9_PHASE0_1",
              "2025_H2":"FUTURE_PROSPECTIVE_AUDIT_NOT_REQUIRED_FOR_ENGINEERING_RELEASE",
              "2026_outcomes":"NOT_READ"
            },
            "baseline":{
              "candidate_id":"C0_DEPLOYED",
              "PICK_BASE":c0,
              "YEAR_DISCOUNT_unchanged":True
            },
            "candidate_family":{
              "candidate_id":"V9_C1_ROUND_RAMP_RESCALE",
              "formula":"value(cell)=C0(cell)*(k + d*((round(cell)-1)/5))",
              "interpretation":"k sets the Round-1 scale; d smoothly increases the multiplier toward Round 6.",
              "within_round_tier_ratios_preserved":True,
              "parameter_bounds":{"k":[0.20,0.60],"d":[0.00,0.60]},
              "coarse_grid":{"k_step":0.01,"d_step":0.01},
              "refine_grid":{"half_width":0.02,"step":0.001},
              "structural_constraints":[
                "all 18 values > 0",
                "all 18 production cells monotone nonincreasing in canonical R1-early through R6-late order",
                "parameters must not finish on a hard search boundary"
              ]
            },
            "selection_loss":{
              "name":"balanced_exposed_O2_loss_ratio",
              "formula":"0.5*(historical_2018_2023_H3_macro_MAE/C0 + 2024_H2_macro_MAE/C0)",
              "tie_breaks":[
                "lower maximum individual-cell relative regression across historical H3 and 2024 H2",
                "smaller d",
                "smaller k"
              ]
            },
            "hard_gates":{
              "historical_H3_macro_improvement_ge":0.30,
              "2024_H2_macro_improvement_ge":0.30,
              "every_2018_2023_H3_class_improvement_ge":0.20,
              "historical_H3_no_round_regression_worse_than":0.05,
              "2024_H2_no_round_regression_worse_than":0.05,
              "historical_H3_combined_R5_R6_improvement_ge":0.05,
              "2024_H2_combined_R5_R6_improvement_ge":0.05,
              "historical_H3_no_cell_regression_worse_than":0.20,
              "2024_H2_no_cell_regression_worse_than":0.20,
              "historical_H2_macro_improvement_ge":0.20,
              "historical_mature_H4_macro_improvement_ge":0.20,
              "historical_H3_O1_shape_regression_cap":0.25,
              "2024_H2_O1_shape_regression_cap":0.25,
              "source_identity_and_readiness_must_remain_valid":True,
              "production_values_positive_monotone":True
            },
            "o1_policy":{
              "role":"secondary_shape_sanity_cap_not_primary_FV_target",
              "rationale":"O1 is replacement-adjusted football utility shape; O2 is the player-equivalent FV scale used for Draft Pick Fundamental Value. V8 showed that forcing <=2% O1 shape movement prevents correcting the repeated O2 Round-6 underpricing conflict.",
              "cap_is_still_hard":True,
              "cap":0.25
            },
            "production_path":{
              "phase1_pass_decision":"FREEZE_V9_ROUND_RAMP_PRODUCTION_CANDIDATE_AUTHORIZE_PHASE2_ENGINEERING_BRIDGE",
              "phase1_stop_decision":"STOP_V9_NO_PRODUCTION_CANDIDATE",
              "phase2_if_pass":"versioned production bridge with exact rollback artifact, production snapshot parity, full regression suite, and only PICK_BASE allowed to change",
              "fresh_future_outcome_required_before_phase2":False,
              "methodological_status_if_phase2_deploys":"ENGINEERING_RELEASE_SUPPORTED_BY_EXPOSED_MULTI_CLASS_EVIDENCE_NOT_FRESH_CONFIRMATORY_HOLDOUT",
              "future_prospective_audit":"2025 H2 after the 2026 regular season is complete; failure triggers rollback/research review rather than being silently ignored"
            },
            "forbidden":[
              "reuse 2024 H2 as a fresh holdout",
              "read partial 2026 outcomes in Phase 0/1",
              "fit or change YEAR_DISCOUNT",
              "use KTC/current market/package votes to select k or d",
              "add candidate parameters after seeing V9 Phase 0/1 results",
              "relax a V9 gate after seeing a V9 result",
              "automatic production mutation in Phase 0/1"
            ],
            "production_change_authorized":False
          }

          (d/"v9_production_candidate_preregistration.json").write_text(
              json.dumps(obj,indent=2,sort_keys=True)+"\n"
          )

          (d/"v9_production_candidate_preregistration.md").write_text(
              "# Draft Pick FV V9 — Production Candidate Preregistration\n\n"
              "**Goal:** stop extending the research loop and test one low-dimensional, "
              "production-oriented correction for the repeated Round-6 failure.\n\n"
              "V9 treats 2018–2023 outcomes and the already-opened 2024 H2 result as "
              "**development evidence**, not as a fresh holdout. The candidate is a smooth "
              "round-ramp rescale of deployed C0. O2 remains the Fundamental Value target. "
              "O1 remains a hard 25% shape sanity cap, but no longer has the prior 2% veto.\n\n"
              "If Phase 0/1 passes every frozen gate, the next stage is the production "
              "engineering bridge—not another development phase.\n"
          )
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$P" "$M"
            git commit -m "Freeze Draft Pick FV V9 production candidate contract"

            git fetch origin main
            test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
              echo "ERROR: origin/main moved before V9 preregistration freeze."
              exit 1
            }
            git push origin HEAD:main
            echo "PASS: V9 preregistration committed before V9 candidate search."
          fi

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("research/draft-pick-fv-v9/v9_production_candidate_preregistration.json")
          x=json.loads(p.read_text())
          assert x["decision"]=="FREEZE_V9_ROUND_RAMP_PRODUCTION_CANDIDATE_CONTRACT"
          assert x["evidence_classification"]["2024_H2"]=="EXPOSED_DEVELOPMENT_NOT_HOLDOUT"
          assert x["production_change_authorized"] is False
          assert x["candidate_family"]["formula"]=="value(cell)=C0(cell)*(k + d*((round(cell)-1)/5))"
          print("PREREG_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

          echo "prereg_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download exact exposed V8 development corpus
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/v9-v8-p2"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          gh run download "$V8_P2_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$V8_P2_ARTIFACT_NAME" \
            --dir "$OUT"

          test -f "$OUT/v8_phase2_development_outcomes.jsonl"
          test "$(sha256sum "$OUT/v8_phase2_development_outcomes.jsonl" | awk '{print $1}')" = \
            "45306800ce32f3aa20d6d4697e14c846311962b7f6fe3e54e596213370644850"

          echo "PASS: exact 2018-2023 V8 development outcomes recovered."

      - name: Build and run V9 deterministic candidate engine
        shell: bash
        env:
          DEV_ROWS: ${{ runner.temp }}/v9-v8-p2/v8_phase2_development_outcomes.jsonl
          HOLDOUT_ROWS: research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/v9_candidate_engine.py" <<'PY'
          import hashlib
          import json
          import math
          import os
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          import numpy as np

          C0={
            "r1_early":7500,"r1_mid":5854,"r1_late":5244,
            "r2_early":3906,"r2_mid":3624,"r2_late":3291,
            "r3_early":2692,"r3_mid":2682,"r3_late":2319,
            "r4_early":1972,"r4_mid":1831,"r4_late":1689,
            "r5_early":1414,"r5_mid":1250,"r5_late":1118,
            "r6_early":1014,"r6_mid":853,"r6_late":740,
          }
          CELLS=list(C0)
          TIERS=("early","mid","late")
          YEARS=tuple(range(2018,2024))
          H4_YEARS=tuple(range(2018,2023))
          EPS=1e-12

          def rnd(c): return int(c[1])
          def read_jsonl(p):
              with Path(p).open() as f:
                  return [json.loads(x) for x in f if x.strip()]
          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def normalized_shape(v):
              m=sum(float(v[c]) for c in CELLS)/len(CELLS)
              if m<=0: raise AssertionError("nonpositive shape mean")
              return {c:float(v[c])/m for c in CELLS}
          def structural(v):
              xs=[float(v[c]) for c in CELLS]
              return min(xs)>0 and all(xs[i]>=xs[i+1]-1e-9 for i in range(len(xs)-1))
          def rel(new,base):
              if abs(base)<=EPS: raise AssertionError("zero baseline")
              return float(new/base-1.0)

          dev=read_jsonl(os.environ["DEV_ROWS"])
          h24=read_jsonl(os.environ["HOLDOUT_ROWS"])
          prereg=json.loads(Path(
              "research/draft-pick-fv-v9/v9_production_candidate_preregistration.json"
          ).read_text())
          gates=prereg["hard_gates"]

          assert len(dev)==24970
          assert len(h24)==574
          assert sha(os.environ["DEV_ROWS"])=="45306800ce32f3aa20d6d4697e14c846311962b7f6fe3e54e596213370644850"
          assert sha(os.environ["HOLDOUT_ROWS"])=="0a3166a501fcfaa2c19398daf6a26d8df26931a9745e279cf93a9166c6914a21"

          # Exact V8 weighting contracts reduced to per-year/per-cell target distributions.
          hist={}
          hist_h2={}
          hist_h4={}
          hist_o1={}
          for y in YEARS:
              for c in CELLS:
                  xs=[
                      r for r in dev
                      if int(r["draft_year"])==y
                      and r["cell"]==c
                      and r.get("primary_o2_ready") is True
                      and r.get("H3",{}).get("O2") is not None
                  ]
                  assert xs
                  w=np.asarray([float(r["development_fit_weight_v8"]) for r in xs])
                  w=w/w.sum()
                  hist[(y,c)]=(
                      np.asarray([float(r["H3"]["O2"]) for r in xs]),
                      w,
                  )

                  xs2=[
                      r for r in dev
                      if int(r["draft_year"])==y
                      and r["cell"]==c
                      and r.get("H3",{}).get("O2") is not None
                      and r.get("H2",{}).get("O2") is not None
                  ]
                  assert xs2
                  w2=np.asarray([float(r["development_fit_weight_v8"]) for r in xs2])
                  w2=w2/w2.sum()
                  hist_h2[(y,c)]=(
                      np.asarray([float(r["H2"]["O2"]) for r in xs2]),
                      w2,
                  )

                  xs1=[
                      r for r in dev
                      if int(r["draft_year"])==y
                      and r["cell"]==c
                      and r.get("H3",{}).get("O1") is not None
                  ]
                  assert xs1
                  w1=np.asarray([float(r["development_fit_weight_v8"]) for r in xs1])
                  w1=w1/w1.sum()
                  hist_o1[(y,c)]=float(np.dot(
                      w1,
                      np.asarray([float(r["H3"]["O1"]) for r in xs1])
                  ))

          for y in H4_YEARS:
              for c in CELLS:
                  xs=[
                      r for r in dev
                      if int(r["draft_year"])==y
                      and r["cell"]==c
                      and r.get("H3",{}).get("O2") is not None
                      and r.get("H4",{}).get("O2") is not None
                  ]
                  assert xs
                  w=np.asarray([float(r["development_fit_weight_v8"]) for r in xs])
                  w=w/w.sum()
                  hist_h4[(y,c)]=(
                      np.asarray([float(r["H4"]["O2"]) for r in xs]),
                      w,
                  )

          hold={}
          hold_o1={}
          for c in CELLS:
              xs=[r for r in h24 if r["cell"]==c and r.get("h2_o2_ready") is True]
              assert xs
              w=np.asarray([float(r["cell_weight_v8_1_holdout"]) for r in xs])
              w=w/w.sum()
              hold[c]=(
                  np.asarray([float(r["H2"]["O2"]) for r in xs]),
                  w,
              )

              xs1=[r for r in h24 if r["cell"]==c and r.get("h2_o1_ready") is True]
              assert xs1
              w1=np.asarray([float(r["cell_weight_v8_1_holdout"]) for r in xs1])
              w1=w1/w1.sum()
              hold_o1[c]=float(np.dot(
                  w1,
                  np.asarray([float(r["H2"]["O1"]) for r in xs1])
              ))

          def candidate_values(k,d):
              return {
                  c: float(C0[c])*(float(k)+float(d)*((rnd(c)-1)/5.0))
                  for c in CELLS
              }

          def score_primary(v):
              byyear={}
              bycell=defaultdict(list)
              for y in YEARS:
                  d={}
                  for c in CELLS:
                      target,w=hist[(y,c)]
                      e=float(np.dot(w,np.abs(target-float(v[c]))))
                      d[c]=e
                      bycell[c].append(e)
                  byyear[y]=float(np.mean(list(d.values())))

              hc={c:float(np.mean(xs)) for c,xs in bycell.items()}
              hr={
                  r:float(np.mean([hc[f"r{r}_{t}"] for t in TIERS]))
                  for r in range(1,7)
              }
              hm=float(np.mean(list(hc.values())))
              ht=float(np.mean([hc[c] for c in CELLS if rnd(c)>=5]))

              hcell={}
              for c in CELLS:
                  target,w=hold[c]
                  hcell[c]=float(np.dot(w,np.abs(target-float(v[c]))))
              hround={
                  r:float(np.mean([hcell[f"r{r}_{t}"] for t in TIERS]))
                  for r in range(1,7)
              }
              hmacro=float(np.mean(list(hcell.values())))
              htail=float(np.mean([hcell[c] for c in CELLS if rnd(c)>=5]))

              nv=normalized_shape(v)
              hist_shape=[]
              for y in YEARS:
                  target={c:hist_o1[(y,c)] for c in CELLS}
                  nt=normalized_shape(target)
                  hist_shape.append(
                      float(np.mean([abs(nt[c]-nv[c]) for c in CELLS]))
                  )
              hist_shape=float(np.mean(hist_shape))
              nt24=normalized_shape(hold_o1)
              hold_shape=float(np.mean([abs(nt24[c]-nv[c]) for c in CELLS]))

              return {
                  "historical_H3_macro":hm,
                  "historical_H3_by_class":byyear,
                  "historical_H3_cell":hc,
                  "historical_H3_round":hr,
                  "historical_H3_tail":ht,
                  "historical_H3_O1_shape":hist_shape,
                  "2024_H2_macro":hmacro,
                  "2024_H2_cell":hcell,
                  "2024_H2_round":hround,
                  "2024_H2_tail":htail,
                  "2024_H2_O1_shape":hold_shape,
              }

          def score_robustness(v):
              h2_year={}
              for y in YEARS:
                  d=[]
                  for c in CELLS:
                      target,w=hist_h2[(y,c)]
                      d.append(float(np.dot(w,np.abs(target-float(v[c])))))
                  h2_year[y]=float(np.mean(d))

              h4_year={}
              for y in H4_YEARS:
                  d=[]
                  for c in CELLS:
                      target,w=hist_h4[(y,c)]
                      d.append(float(np.dot(w,np.abs(target-float(v[c])))))
                  h4_year[y]=float(np.mean(d))

              return {
                  "historical_H2_macro":float(np.mean(list(h2_year.values()))),
                  "historical_H2_by_class":h2_year,
                  "historical_H4_macro":float(np.mean(list(h4_year.values()))),
                  "historical_H4_by_class":h4_year,
              }

          base=score_primary(C0)
          base_rob=score_robustness(C0)

          def diagnostics(k,d):
              v=candidate_values(k,d)
              if not structural(v):
                  return None

              m=score_primary(v)
              byyear_rel={
                  str(y):rel(m["historical_H3_by_class"][y],base["historical_H3_by_class"][y])
                  for y in YEARS
              }
              hist_round_rel={
                  str(r):rel(m["historical_H3_round"][r],base["historical_H3_round"][r])
                  for r in range(1,7)
              }
              hold_round_rel={
                  str(r):rel(m["2024_H2_round"][r],base["2024_H2_round"][r])
                  for r in range(1,7)
              }
              hist_cell_rel={
                  c:rel(m["historical_H3_cell"][c],base["historical_H3_cell"][c])
                  for c in CELLS
              }
              hold_cell_rel={
                  c:rel(m["2024_H2_cell"][c],base["2024_H2_cell"][c])
                  for c in CELLS
              }

              hist_impr=1.0-m["historical_H3_macro"]/base["historical_H3_macro"]
              hold_impr=1.0-m["2024_H2_macro"]/base["2024_H2_macro"]
              hist_tail_impr=1.0-m["historical_H3_tail"]/base["historical_H3_tail"]
              hold_tail_impr=1.0-m["2024_H2_tail"]/base["2024_H2_tail"]
              hist_shape_rel=rel(
                  m["historical_H3_O1_shape"],
                  base["historical_H3_O1_shape"]
              )
              hold_shape_rel=rel(
                  m["2024_H2_O1_shape"],
                  base["2024_H2_O1_shape"]
              )

              basic_gates={
                  "historical_H3_macro_improvement_ge_30pct":
                      hist_impr>=float(gates["historical_H3_macro_improvement_ge"])-EPS,
                  "2024_H2_macro_improvement_ge_30pct":
                      hold_impr>=float(gates["2024_H2_macro_improvement_ge"])-EPS,
                  "every_2018_2023_H3_class_improvement_ge_20pct":
                      max(byyear_rel.values())<=-float(gates["every_2018_2023_H3_class_improvement_ge"])+EPS,
                  "historical_H3_no_round_regression_worse_than_5pct":
                      max(hist_round_rel.values())<=float(gates["historical_H3_no_round_regression_worse_than"])+EPS,
                  "2024_H2_no_round_regression_worse_than_5pct":
                      max(hold_round_rel.values())<=float(gates["2024_H2_no_round_regression_worse_than"])+EPS,
                  "historical_H3_combined_R5_R6_improvement_ge_5pct":
                      hist_tail_impr>=float(gates["historical_H3_combined_R5_R6_improvement_ge"])-EPS,
                  "2024_H2_combined_R5_R6_improvement_ge_5pct":
                      hold_tail_impr>=float(gates["2024_H2_combined_R5_R6_improvement_ge"])-EPS,
                  "historical_H3_no_cell_regression_worse_than_20pct":
                      max(hist_cell_rel.values())<=float(gates["historical_H3_no_cell_regression_worse_than"])+EPS,
                  "2024_H2_no_cell_regression_worse_than_20pct":
                      max(hold_cell_rel.values())<=float(gates["2024_H2_no_cell_regression_worse_than"])+EPS,
                  "historical_H3_O1_shape_regression_cap_25pct":
                      hist_shape_rel<=float(gates["historical_H3_O1_shape_regression_cap"])+EPS,
                  "2024_H2_O1_shape_regression_cap_25pct":
                      hold_shape_rel<=float(gates["2024_H2_O1_shape_regression_cap"])+EPS,
                  "positive_monotone":structural(v),
              }

              loss=0.5*(
                  m["historical_H3_macro"]/base["historical_H3_macro"]
                  + m["2024_H2_macro"]/base["2024_H2_macro"]
              )
              max_cell=max(
                  max(hist_cell_rel.values()),
                  max(hold_cell_rel.values())
              )

              return {
                  "k":float(k),"d":float(d),
                  "values":v,
                  "metrics":m,
                  "historical_H3_macro_improvement":hist_impr,
                  "2024_H2_macro_improvement":hold_impr,
                  "historical_H3_class_relative":byyear_rel,
                  "historical_H3_round_relative":hist_round_rel,
                  "2024_H2_round_relative":hold_round_rel,
                  "historical_H3_cell_relative":hist_cell_rel,
                  "2024_H2_cell_relative":hold_cell_rel,
                  "historical_H3_tail_improvement":hist_tail_impr,
                  "2024_H2_tail_improvement":hold_tail_impr,
                  "historical_H3_O1_shape_relative":hist_shape_rel,
                  "2024_H2_O1_shape_relative":hold_shape_rel,
                  "basic_gates":basic_gates,
                  "basic_eligible":all(basic_gates.values()),
                  "selection_loss":float(loss),
                  "max_cell_relative_regression":float(max_cell),
              }

          def frange(lo,hi,step):
              n=int(round((hi-lo)/step))
              return [round(lo+i*step,12) for i in range(n+1)]

          def rank_key(x):
              return (
                  x["selection_loss"],
                  x["max_cell_relative_regression"],
                  x["d"],
                  x["k"],
              )

          coarse=[]
          for k in frange(0.20,0.60,0.01):
              for d in frange(0.00,0.60,0.01):
                  x=diagnostics(k,d)
                  if x is not None and x["basic_eligible"]:
                      coarse.append(x)

          if not coarse:
              selected=None
              refine=[]
          else:
              coarse.sort(key=rank_key)
              seed=coarse[0]
              klo=max(0.20,seed["k"]-0.02); khi=min(0.60,seed["k"]+0.02)
              dlo=max(0.00,seed["d"]-0.02); dhi=min(0.60,seed["d"]+0.02)
              refine=[]
              for k in frange(klo,khi,0.001):
                  for d in frange(dlo,dhi,0.001):
                      x=diagnostics(k,d)
                      if x is not None and x["basic_eligible"]:
                          refine.append(x)
              refine.sort(key=rank_key)
              selected=refine[0] if refine else seed

          if selected is not None:
              rob=score_robustness(selected["values"])
              selected["robustness"]=rob
              selected["historical_H2_relative"]=rel(
                  rob["historical_H2_macro"],base_rob["historical_H2_macro"]
              )
              selected["historical_H4_relative"]=rel(
                  rob["historical_H4_macro"],base_rob["historical_H4_macro"]
              )
              selected["robustness_gates"]={
                  "historical_H2_macro_improvement_ge_20pct":
                      selected["historical_H2_relative"]<=-float(gates["historical_H2_macro_improvement_ge"])+EPS,
                  "historical_H4_macro_improvement_ge_20pct":
                      selected["historical_H4_relative"]<=-float(gates["historical_mature_H4_macro_improvement_ge"])+EPS,
                  "k_not_search_boundary":selected["k"]>0.20+EPS and selected["k"]<0.60-EPS,
                  "d_not_search_boundary":selected["d"]>0.00+EPS and selected["d"]<0.60-EPS,
              }
              selected["eligible"]=(
                  selected["basic_eligible"]
                  and all(selected["robustness_gates"].values())
              )
          else:
              selected={"eligible":False}

          decision=(
              "FREEZE_V9_ROUND_RAMP_PRODUCTION_CANDIDATE_AUTHORIZE_PHASE2_ENGINEERING_BRIDGE"
              if selected.get("eligible") is True
              else "STOP_V9_NO_PRODUCTION_CANDIDATE"
          )

          out=Path("research/draft-pick-fv-v9")
          generated=datetime.now(timezone.utc).isoformat()

          result={
              "schema_version":1,
              "study_id":"draft-pick-fv-v9-production-oriented-round-ramp",
              "stage":"phase1_exposed_evidence_production_candidate_development",
              "status":"PRODUCTION_CANDIDATE_FROZEN" if selected.get("eligible") else "NO_PRODUCTION_CANDIDATE",
              "generated_at_utc":generated,
              "decision":decision,
              "evidence_classification":prereg["evidence_classification"],
              "candidate_family":prereg["candidate_family"],
              "coarse_feasible_candidate_n":len(coarse),
              "refined_feasible_candidate_n":len(refine),
              "baseline_metrics":{
                  "primary":base,
                  "robustness":base_rob,
              },
              "selected_candidate":selected if selected.get("eligible") else None,
              "selection_candidate_diagnostic":selected,
              "all_frozen_gates_pass":selected.get("eligible") is True,
              "phase2_engineering_bridge_authorized":selected.get("eligible") is True,
              "production_change_authorized":False,
              "2024_H2_treated_as_fresh_holdout":False,
              "2024_H3_read":False,
              "2026_outcomes_read":False,
              "market_or_ktc_used":False,
              "package_votes_used":False,
              "year_discount_changed":False,
              "next_stage":(
                  "draft-pick-fv-v9-phase2-production-engineering-bridge"
                  if selected.get("eligible") else None
              ),
          }

          result_path=out/"v9_phase1_production_candidate_development.json"
          result_path.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          cand_path=out/"v9_frozen_production_candidate.json"
          cand_path.write_text(json.dumps({
              "schema_version":1,
              "study_id":result["study_id"],
              "stage":"v9_frozen_production_candidate",
              "decision":decision,
              "candidate":result["selected_candidate"],
              "phase2_engineering_bridge_authorized":result["phase2_engineering_bridge_authorized"],
              "production_change_authorized":False,
          },indent=2,sort_keys=True)+"\n")

          lines=[
              "# Draft Pick FV V9 — Phase 1 Production Candidate Development",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- Coarse feasible candidates: **{len(coarse)}**",
              f"- Refined feasible candidates: **{len(refine)}**",
          ]
          if selected.get("eligible"):
              lines += [
                  f"- Frozen k: **{selected['k']:.6f}**",
                  f"- Frozen d: **{selected['d']:.6f}**",
                  f"- Historical H3 O2 improvement: **{selected['historical_H3_macro_improvement']:.2%}**",
                  f"- 2024 H2 O2 improvement: **{selected['2024_H2_macro_improvement']:.2%}**",
                  f"- Worst historical round relative result: **{max(selected['historical_H3_round_relative'].values()):.2%}**",
                  f"- Worst 2024 H2 round relative result: **{max(selected['2024_H2_round_relative'].values()):.2%}**",
                  f"- Historical R5-R6 improvement: **{selected['historical_H3_tail_improvement']:.2%}**",
                  f"- 2024 H2 R5-R6 improvement: **{selected['2024_H2_tail_improvement']:.2%}**",
                  f"- Historical H2 relative result: **{selected['historical_H2_relative']:.2%}**",
                  f"- Historical H4 relative result: **{selected['historical_H4_relative']:.2%}**",
                  f"- Historical O1 shape regression: **{selected['historical_H3_O1_shape_relative']:.2%}**",
                  f"- 2024 H2 O1 shape regression: **{selected['2024_H2_O1_shape_relative']:.2%}**",
                  "",
                  "Phase 2 production engineering bridge is authorized. No production value changed in this workflow.",
              ]
          else:
              lines += ["- No round-ramp candidate passed every frozen V9 gate."]

          (out/"v9_phase1_production_candidate_development.md").write_text(
              "\n".join(lines)+"\n"
          )

          manifest={
              "schema_version":1,
              "study_id":result["study_id"],
              "stage":"phase1_production_candidate_development_manifest",
              "status":result["status"],
              "generated_at_utc":generated,
              "decision":decision,
              "selected_candidate_frozen":selected.get("eligible") is True,
              "phase2_engineering_bridge_authorized":result["phase2_engineering_bridge_authorized"],
              "production_change_authorized":False,
              "2024_H2_fresh_holdout_claimed":False,
              "2024_H3_read":False,
              "2026_outcomes_read":False,
              "input_hashes":{
                  "preregistration_sha256":sha(out/"v9_production_candidate_preregistration.json"),
                  "development_outcomes_sha256":sha(os.environ["DEV_ROWS"]),
                  "2024_h2_scored_occurrences_sha256":sha(os.environ["HOLDOUT_ROWS"]),
              },
              "output_hashes":{
                  result_path.name:sha(result_path),
                  cand_path.name:sha(cand_path),
                  "v9_phase1_production_candidate_development.md":
                      sha(out/"v9_phase1_production_candidate_development.md"),
              },
              "next_stage":result["next_stage"],
          }
          (out/"v9_phase1_production_candidate_development_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )

          print("DECISION="+decision)
          if selected.get("eligible"):
              print(f"K={selected['k']:.6f}")
              print(f"D={selected['d']:.6f}")
              print(f"HIST_H3_IMPROVEMENT={selected['historical_H3_macro_improvement']:.10f}")
              print(f"HOLDOUT_2024_H2_IMPROVEMENT={selected['2024_H2_macro_improvement']:.10f}")
              print(f"WORST_HIST_ROUND_REL={max(selected['historical_H3_round_relative'].values()):.10f}")
              print(f"WORST_2024_ROUND_REL={max(selected['2024_H2_round_relative'].values()):.10f}")
          PY

          python3 "${RUNNER_TEMP}/v9_candidate_engine.py"

      - name: Independently audit V9 result
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          d=Path("research/draft-pick-fv-v9")
          p=json.loads((d/"v9_production_candidate_preregistration.json").read_text())
          r=json.loads((d/"v9_phase1_production_candidate_development.json").read_text())
          c=json.loads((d/"v9_frozen_production_candidate.json").read_text())
          m=json.loads((d/"v9_phase1_production_candidate_development_manifest.json").read_text())

          allowed={
            "FREEZE_V9_ROUND_RAMP_PRODUCTION_CANDIDATE_AUTHORIZE_PHASE2_ENGINEERING_BRIDGE",
            "STOP_V9_NO_PRODUCTION_CANDIDATE",
          }
          assert r["decision"] in allowed
          assert m["decision"]==r["decision"]
          assert c["decision"]==r["decision"]
          assert r["production_change_authorized"] is False
          assert m["production_change_authorized"] is False
          assert r["2024_H2_treated_as_fresh_holdout"] is False
          assert r["2024_H3_read"] is False
          assert r["2026_outcomes_read"] is False
          assert r["year_discount_changed"] is False
          assert r["market_or_ktc_used"] is False
          assert r["package_votes_used"] is False

          if r["decision"].startswith("FREEZE_V9"):
              x=r["selected_candidate"]
              assert x is not None and x["eligible"] is True
              assert all(x["basic_gates"].values())
              assert all(x["robustness_gates"].values())
              assert x["historical_H3_macro_improvement"]>=0.30
              assert x["2024_H2_macro_improvement"]>=0.30
              assert max(x["historical_H3_round_relative"].values())<=0.05+1e-12
              assert max(x["2024_H2_round_relative"].values())<=0.05+1e-12
              assert x["historical_H3_tail_improvement"]>=0.05-1e-12
              assert x["2024_H2_tail_improvement"]>=0.05-1e-12
              assert x["historical_H2_relative"]<=-0.20+1e-12
              assert x["historical_H4_relative"]<=-0.20+1e-12
              vals=x["values"]
              cells=list(p["baseline"]["PICK_BASE"])
              seq=[vals[z] for z in cells]
              assert min(seq)>0
              assert all(seq[i]>=seq[i+1]-1e-9 for i in range(len(seq)-1))
              assert r["phase2_engineering_bridge_authorized"] is True
              assert r["next_stage"]=="draft-pick-fv-v9-phase2-production-engineering-bridge"
          else:
              assert r["selected_candidate"] is None
              assert r["phase2_engineering_bridge_authorized"] is False
              assert r["next_stage"] is None

          print("PASS: V9 result exactly follows the frozen production-oriented contract.")
          PY

      - name: Run repository regressions before freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          echo "PASS: repository regression suite green."

      - name: Upload V9 Phase 0/1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: draft-pick-fv-v9-phase0-1-production-candidate-freeze
          path: |
            research/draft-pick-fv-v9/v9_production_candidate_preregistration.json
            research/draft-pick-fv-v9/v9_production_candidate_preregistration.md
            research/draft-pick-fv-v9/v9_phase1_production_candidate_development.json
            research/draft-pick-fv-v9/v9_phase1_production_candidate_development.md
            research/draft-pick-fv-v9/v9_frozen_production_candidate.json
            research/draft-pick-fv-v9/v9_phase1_production_candidate_development_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit V9 candidate freeze
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || {
            echo "ERROR: origin/main moved after V9 preregistration; refusing stale result commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v9/v9_phase1_production_candidate_development.json \
            research/draft-pick-fv-v9/v9_phase1_production_candidate_development.md \
            research/draft-pick-fv-v9/v9_frozen_production_candidate.json \
            research/draft-pick-fv-v9/v9_phase1_production_candidate_development_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no V9 Phase 1 result staged."
            exit 1
          }

          git commit -m "Freeze Draft Pick FV V9 production candidate"
          git push origin HEAD:main

          echo "PASS: V9 Phase 0/1 frozen. If decision is PASS, Phase 2 is the production engineering bridge."
