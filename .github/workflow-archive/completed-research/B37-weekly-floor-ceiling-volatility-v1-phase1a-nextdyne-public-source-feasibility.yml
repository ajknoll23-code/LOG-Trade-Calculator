        from pathlib import Path

        d = json.loads(
            Path(
                "research/weekly-floor-ceiling-volatility-v1/"
                "weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json"
            ).read_text(encoding="utf-8")
        )

        print("=== B37 COMPLETE ===")
        print("Decision:", d["status"])
        print("Snapshot:", d.get("snapshot_metadata"))
        print("Coverage:", d.get("coverage"))
        print(
            "Historical archive proven:",
            d["historical_archive"]["reproducible_full_historical_snapshot_archive_proven"],
        )
        print("Retrospective phase authorized: NO")
        print("Outcome association opened: NO")
        print("Production authorized: NO")
        PY
