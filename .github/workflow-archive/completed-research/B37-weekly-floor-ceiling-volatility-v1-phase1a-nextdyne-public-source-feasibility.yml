name: B37 Weekly Floor Ceiling Volatility V1 - Phase 1A NextDyne Public Source Feasibility
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SELF_WORKFLOW: B37-weekly-floor-ceiling-volatility-v1-phase1a-nextdyne-public-source-feasibility.yml
  OBSOLETE_B37_WORKFLOW: B37-weekly-floor-ceiling-volatility-v1-phase1a-private-yahoo-schema-feasibility.yml
  EXPECTED_B35_PREREG_BLOB_SHA: 7aae19e621fb991d74fef5d3ef64f491ca2ed931
  EXPECTED_B36_PREFLIGHT_BLOB_SHA: eabe6f477b551b89191fd1010f7eb234f37427ff
  AUDIT_SCRIPT_SHA256: bbb0f71e89503aa4d45c2997d8edef425252234c73d398a1f9885d15ddca9833
  NEXTDYNE_URL: https://www.nextdyne.io/tools/dynasty-weekly-projections
jobs:
  source_feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install source-feasibility dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir   "requests>=2.32,<3"   "beautifulsoup4>=4.12,<5"
    - name: Verify exact B35-B36 predecessor state
      shell: bash
      run: |
        set -euo pipefail

        test "$(git hash-object research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase0_prereg.json)"   = "$EXPECTED_B35_PREREG_BLOB_SHA"
        test "$(git hash-object research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase1a_public_semantics_preflight.json)"   = "$EXPECTED_B36_PREFLIGHT_BLOB_SHA"

        python3 - <<'PY'
        import json
        from pathlib import Path

        base = Path("research/weekly-floor-ceiling-volatility-v1")
        b35 = json.loads(
            (base / "weekly_floor_ceiling_volatility_v1_phase0_prereg.json")
            .read_text(encoding="utf-8")
        )
        b36 = json.loads(
            (base / "weekly_floor_ceiling_volatility_v1_phase1a_public_semantics_preflight.json")
            .read_text(encoding="utf-8")
        )

        assert b35["status"] == "PREREGISTERED_SOURCE_CONTRACT_ONLY"
        assert b35["outcome_association_opened"] is False
        assert b35["frozen_display_constructs"]["overall_score"]["authorized"] is False

        assert b36["status"] == (
            "CONTINUE_TO_PRIVATE_SCHEMA_AND_SCORING_EQUIVALENCE_CHECK_YAHOO_CANDIDATE"
        )
        assert b36["outcome_data_read"] is False
        assert b36["production_change_authorized"] is False

        pivot = base / "weekly_floor_ceiling_volatility_v1_phase1a_source_pivot_amendment.json"
        result = base / "weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json"
        assert not pivot.exists()
        assert not result.exists()

        print("PASS: exact predecessor state and unopened pivot verified.")
        PY
    - name: Snapshot production surfaces
      shell: bash
      run: |
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Freeze source-pivot amendment before inspecting NextDyne rows
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from __future__ import annotations

        from datetime import datetime, timezone
        import json
        from pathlib import Path

        OUT = Path("research/weekly-floor-ceiling-volatility-v1")
        OUT.mkdir(parents=True, exist_ok=True)

        doc = {
            "schema_version": 1,
            "study_id": "weekly-floor-ceiling-volatility-v1",
            "phase": "1A-source-pivot-amendment",
            "status": "FROZEN_SOURCE_PIVOT_4FOR4_PAID_PATH_TO_NEXTDYNE_PUBLIC_FEASIBILITY",
            "frozen_at_utc": datetime.now(timezone.utc).isoformat(),
            "reason": (
                "The 4for4 Yahoo Floor/Ceiling export required by the original Phase 1A "
                "private-source path is not available under the user's existing subscription. "
                "No substitute 4for4 export will be treated as equivalent."
            ),
            "new_candidate": {
                "provider": "NextDyne",
                "url": "https://www.nextdyne.io/tools/dynasty-weekly-projections",
                "selection_basis_allowed": [
                    "public no-account access",
                    "explicit weekly QB/RB/WR/TE floor-projection-ceiling table",
                    "logged-out Half-PPR scoring documented by provider",
                    "snapshot/model-version metadata displayed",
                ],
                "selection_basis_prohibited": [
                    "provider self-reported historical accuracy",
                    "realized player outcomes",
                    "fit versus LOG Fundamental Value",
                    "fit versus market value",
                ],
            },
            "scientific_firewall": {
                "b35_constructs_changed": False,
                "floor_strength_definition_changed": False,
                "ceiling_strength_definition_changed": False,
                "volatility_width_definition_changed": False,
                "outcome_association_opened": False,
                "production_change_authorized": False,
                "retrospective_phase_authorized_for_nextdyne": False,
                "prospective_only_amendment_authorized_by_this_file": False,
            },
            "decision_rule": {
                "if_current_snapshot_feasibility_passes": (
                    "Advance only to a separate prospective-only architecture amendment/"
                    "preregistration. Do not open realized outcomes yet."
                ),
                "if_current_snapshot_feasibility_fails": (
                    "Stop NextDyne source path before outcomes."
                ),
            },
        }

        (OUT / "weekly_floor_ceiling_volatility_v1_phase1a_source_pivot_amendment.json").write_text(
            json.dumps(doc, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        print(json.dumps({
            "status": doc["status"],
            "new_candidate": doc["new_candidate"]["provider"],
            "outcome_association_opened": False,
            "production_authorized": False,
        }, indent=2))
        PY

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase1a_source_pivot_amendment.json
        git diff --cached --check
        git commit -m "Freeze Weekly Floor Ceiling V1 public source pivot"
        git push origin HEAD:main
        echo "PASS: NextDyne feasibility source pivot frozen before row inspection."
    - name: Install and self-test frozen NextDyne feasibility auditor
      shell: bash
      run: |
        set -euo pipefail

        cat > research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py <<'PYFILE'
        #!/usr/bin/env python3
        from __future__ import annotations

        import argparse
        from collections import Counter
        from datetime import datetime, timezone
        import hashlib
        import json
        import math
        from pathlib import Path
        import re

        import requests
        from bs4 import BeautifulSoup


        POSITIONS = ("QB", "RB", "WR", "TE")
        MIN_ROWS = {"QB": 20, "RB": 40, "WR": 60, "TE": 30}
        MIN_TOTAL = 150

        EXPECTED_HEADERS = {
            "player": {"player"},
            "pos": {"pos", "position"},
            "team": {"team"},
            "floor": {"floor"},
            "proj": {"proj", "projection", "projected"},
            "ceiling": {"ceiling"},
        }


        def norm(value):
            return re.sub(r"\s+", " ", str(value or "").strip())


        def norm_head(value):
            return re.sub(r"[^a-z0-9]+", " ", norm(value).lower()).strip()


        def sha256_bytes(data: bytes) -> str:
            return hashlib.sha256(data).hexdigest()


        def safe_float(value):
            s = norm(value).replace(",", "")
            if not s:
                return None
            m = re.search(r"-?\d+(?:\.\d+)?", s)
            if not m:
                return None
            try:
                x = float(m.group(0))
            except ValueError:
                return None
            return x if math.isfinite(x) else None


        def resolve_headers(headers):
            out = {}
            nh = {norm_head(h): i for i, h in enumerate(headers)}
            for semantic, aliases in EXPECTED_HEADERS.items():
                idx = None
                for alias in aliases:
                    if alias in nh:
                        idx = nh[alias]
                        break
                out[semantic] = idx
            return out


        def extract_table(soup):
            candidates = []
            for table in soup.find_all("table"):
                trs = table.find_all("tr")
                if not trs:
                    continue
                first = trs[0]
                headers = [
                    norm(x.get_text(" ", strip=True))
                    for x in first.find_all(["th", "td"])
                ]
                if not headers:
                    continue
                resolved = resolve_headers(headers)
                score = sum(v is not None for v in resolved.values())
                candidates.append((score, headers, resolved, trs[1:]))

            if not candidates:
                return None

            candidates.sort(key=lambda x: x[0], reverse=True)
            best = candidates[0]
            if best[0] < 6:
                return None
            return best


        def extract_snapshot(text):
            # Flexible around separators and date rendering.
            patterns = [
                re.compile(
                    r"Week\s+(\d+)\s*[·|\-]\s*(20\d{2})\s*[·|\-]\s*"
                    r"([A-Za-z0-9_.\-]+)\s*[·|\-]\s*snapshot\s+"
                    r"([A-Z][a-z]{2}\s+\d{1,2},\s+\d{1,2}:\d{2}\s+[AP]M)",
                    re.I,
                ),
                re.compile(
                    r"Week\s+(\d+).{0,80}?snapshot\s+"
                    r"([A-Z][a-z]{2}\s+\d{1,2},\s+\d{1,2}:\d{2}\s+[AP]M)",
                    re.I,
                ),
            ]
            for i, pat in enumerate(patterns):
                m = pat.search(text)
                if not m:
                    continue
                if i == 0:
                    return {
                        "week": int(m.group(1)),
                        "season": int(m.group(2)),
                        "model_version": m.group(3),
                        "snapshot_display": m.group(4),
                        "full_pattern": True,
                    }
                return {
                    "week": int(m.group(1)),
                    "season": None,
                    "model_version": None,
                    "snapshot_display": m.group(2),
                    "full_pattern": False,
                }
            return None


        def inspect(url):
            session = requests.Session()
            session.headers.update({
                "User-Agent": (
                    "Mozilla/5.0 (compatible; LOG-Trade-Calculator-Research/1.0; "
                    "+weekly-floor-ceiling-source-feasibility)"
                )
            })
            r = session.get(url, timeout=45, allow_redirects=True)
            r.raise_for_status()
            raw = r.content
            soup = BeautifulSoup(raw, "html.parser")
            text = norm(soup.get_text(" ", strip=True))
            lower = text.lower()

            faq_checks = {
                "explicit_floor_projection_ceiling_weekly_scope": all(
                    x in lower
                    for x in (
                        "every qb, rb, wr, and te",
                        "floor",
                        "projected",
                        "ceiling",
                        "this week",
                    )
                ),
                "same_model_low_high_band_documented": (
                    "floor and ceiling are the same model" in lower
                    and "low and high bands" in lower
                ),
                "logged_out_half_ppr_documented": (
                    "logged-out mode uses half-ppr" in lower
                ),
                "no_account_required_documented": (
                    "do i need an account?" in lower
                    and "no." in lower
                ),
                "scoring_format_switch_documented": (
                    "switch scoring format" in lower
                    or "change how the same raw weekly line is scored" in lower
                ),
            }

            snapshot = extract_snapshot(text)
            table = extract_table(soup)

            result = {
                "schema_version": 1,
                "study_id": "weekly-floor-ceiling-volatility-v1",
                "phase": "1A-nextdyne-public-source-feasibility",
                "executed_at_utc": datetime.now(timezone.utc).isoformat(),
                "source": {
                    "provider_candidate": "NextDyne",
                    "url": url,
                    "final_url": r.url,
                    "http_status": r.status_code,
                    "response_sha256": sha256_bytes(raw),
                    "response_bytes": len(raw),
                    "account_required_for_default_half_ppr": False,
                },
                "faq_checks": faq_checks,
                "snapshot_metadata": snapshot,
                "table_parser": {
                    "semantic_table_found": table is not None,
                },
                "governance": {
                    "provider_self_reported_accuracy_metrics_used_in_decision": False,
                    "provider_self_reported_accuracy_metrics_persisted": False,
                    "realized_player_outcome_rows_ingested": False,
                    "realized_player_outcome_association_opened": False,
                    "production_change_authorized": False,
                    "user_facing_display_authorized": False,
                    "fundamental_value_effect_authorized": False,
                    "package_adjustment_effect_authorized": False,
                    "team_utility_effect_authorized": False,
                    "trade_value_effect_authorized": False,
                },
            }

            if table is None:
                result.update({
                    "status": "BLOCKED_PUBLIC_HTML_TABLE_PARSER_NO_SOURCE_DECISION",
                    "coverage": None,
                    "band_integrity": None,
                    "historical_archive": {
                        "reproducible_full_historical_snapshot_archive_proven": False,
                        "retrospective_phase_authorized": False,
                    },
                    "next": (
                        "Inspect public page transport/parser only; do not open outcomes "
                        "or alter study architecture."
                    ),
                })
                return result

            _, headers, resolved, trs = table
            rows_by_pos = Counter()
            valid_by_pos = Counter()
            invalid_numeric = 0
            ceiling_below_floor = 0
            projection_outside_band = 0
            positive_width = 0
            zero_width = 0
            parsed_rows = 0

            for tr in trs:
                cells = [
                    norm(x.get_text(" ", strip=True))
                    for x in tr.find_all(["th", "td"])
                ]
                if not cells or len(cells) < len(headers):
                    continue

                def cell(key):
                    idx = resolved[key]
                    return cells[idx] if idx is not None and idx < len(cells) else None

                pos = norm(cell("pos")).upper()
                if pos not in POSITIONS:
                    continue

                parsed_rows += 1
                rows_by_pos[pos] += 1
                floor = safe_float(cell("floor"))
                proj = safe_float(cell("proj"))
                ceiling = safe_float(cell("ceiling"))

                if floor is None or proj is None or ceiling is None:
                    invalid_numeric += 1
                    continue

                if ceiling < floor:
                    ceiling_below_floor += 1
                    continue

                if proj < floor or proj > ceiling:
                    projection_outside_band += 1

                width = ceiling - floor
                if width > 0:
                    positive_width += 1
                else:
                    zero_width += 1

                valid_by_pos[pos] += 1

            valid_total = sum(valid_by_pos.values())
            positive_width_rate = positive_width / valid_total if valid_total else 0.0

            coverage_gates = {
                p: valid_by_pos[p] >= MIN_ROWS[p]
                for p in POSITIONS
            }

            hard_gates = {
                "faq_source_semantics_verified": all(faq_checks.values()),
                "snapshot_metadata_present": snapshot is not None,
                "semantic_table_found": True,
                "all_required_table_columns_resolved": all(
                    resolved[x] is not None
                    for x in ("player", "pos", "team", "floor", "proj", "ceiling")
                ),
                "qb_coverage_minimum": coverage_gates["QB"],
                "rb_coverage_minimum": coverage_gates["RB"],
                "wr_coverage_minimum": coverage_gates["WR"],
                "te_coverage_minimum": coverage_gates["TE"],
                "total_valid_rows_at_least_150": valid_total >= MIN_TOTAL,
                "no_ceiling_below_floor_rows": ceiling_below_floor == 0,
                "projection_inside_band_rate_at_least_99pct": (
                    (1.0 - projection_outside_band / valid_total) >= 0.99
                    if valid_total
                    else False
                ),
                "positive_width_rate_at_least_95pct": positive_width_rate >= 0.95,
                "logged_out_half_ppr": faq_checks["logged_out_half_ppr_documented"],
                "no_account_required": faq_checks["no_account_required_documented"],
            }

            passed = all(hard_gates.values())

            # This phase proves only the current public snapshot path.
            # It intentionally does NOT claim a historical full-universe archive.
            status = (
                "PASS_NEXTDYNE_CURRENT_SNAPSHOT_FEASIBILITY_PROSPECTIVE_ONLY_DESIGN_REVIEW_REQUIRED"
                if passed
                else "STOP_NEXTDYNE_CURRENT_SNAPSHOT_SOURCE_FEASIBILITY_BEFORE_OUTCOMES"
            )

            result.update({
                "status": status,
                "table_parser": {
                    "semantic_table_found": True,
                    "headers": headers,
                    "resolved_columns": resolved,
                },
                "coverage": {
                    "parsed_target_position_rows": parsed_rows,
                    "valid_band_rows": valid_total,
                    "rows_by_position": dict(sorted(rows_by_pos.items())),
                    "valid_band_rows_by_position": dict(sorted(valid_by_pos.items())),
                    "minimum_rows_by_position": MIN_ROWS,
                    "minimum_total": MIN_TOTAL,
                },
                "band_integrity": {
                    "invalid_numeric_rows": invalid_numeric,
                    "ceiling_below_floor_rows": ceiling_below_floor,
                    "projection_outside_band_rows": projection_outside_band,
                    "positive_width_rows": positive_width,
                    "zero_width_rows": zero_width,
                    "positive_width_rate": round(positive_width_rate, 9),
                },
                "hard_gates": hard_gates,
                "historical_archive": {
                    "reproducible_full_historical_snapshot_archive_proven": False,
                    "retrospective_phase_authorized": False,
                    "reason": (
                        "Phase 1A tested the live public weekly board only. Search-visible "
                        "historical articles/player pages are not accepted as a frozen "
                        "full-universe pre-kickoff archive."
                    ),
                },
                "next": (
                    "If pass: preregister a prospective-only architecture amendment and "
                    "snapshot freezer before any realized target association. If stop: "
                    "close/redesign source path before outcomes."
                ),
            })
            return result


        def selftest():
            html = """
            <html><body>
            <p>Every QB, RB, WR, and TE with a floor, projected, and ceiling number for this week.</p>
            <p>Floor and ceiling are the same model's low and high bands.</p>
            <p>Do I need an account? No. Logged-out mode uses Half-PPR unless you pick another format.</p>
            <p>Switch scoring format.</p>
            <p>Week 4 · 2026 · v1.0 · snapshot Oct 2, 1:00 PM</p>
            <table>
              <tr><th>Player</th><th>Pos</th><th>Team</th><th>Floor</th><th>Proj</th><th>Ceiling</th></tr>
              <tr><td>A</td><td>QB</td><td>ARI</td><td>10</td><td>20</td><td>30</td></tr>
            </table>
            </body></html>
            """
            soup = BeautifulSoup(html, "html.parser")
            text = norm(soup.get_text(" ", strip=True))
            snap = extract_snapshot(text)
            assert snap["week"] == 4
            table = extract_table(soup)
            assert table is not None
            _, headers, resolved, rows = table
            assert resolved["floor"] == 3
            assert resolved["ceiling"] == 5
            assert len(rows) == 1
            print("PASS: NextDyne source feasibility parser synthetic selftest")


        def main():
            ap = argparse.ArgumentParser()
            ap.add_argument("--selftest", action="store_true")
            ap.add_argument("--url")
            ap.add_argument("--out")
            args = ap.parse_args()

            if args.selftest:
                selftest()
                return

            if not args.url or not args.out:
                ap.error("--url and --out required")

            result = inspect(args.url)
            Path(args.out).write_text(
                json.dumps(result, indent=2, sort_keys=True) + "\n",
                encoding="utf-8",
            )

            print(json.dumps({
                "status": result["status"],
                "snapshot_metadata": result.get("snapshot_metadata"),
                "coverage": result.get("coverage"),
                "hard_gates": result.get("hard_gates"),
                "historical_archive_proven": result["historical_archive"][
                    "reproducible_full_historical_snapshot_archive_proven"
                ],
                "outcome_association_opened": False,
                "production_authorized": False,
            }, indent=2))


        if __name__ == "__main__":
            main()
        PYFILE

        python3 -m py_compile research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py
        test "$(sha256sum research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py | awk '{print $1}')" = "$AUDIT_SCRIPT_SHA256"
        python3 research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py --selftest
    - name: Run current public snapshot feasibility audit
      shell: bash
      run: |
        set -euo pipefail

        python3   research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py   --url "$NEXTDYNE_URL"   --out research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json
    - name: Validate scientific firewall and decision scope
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        from pathlib import Path

        base = Path("research/weekly-floor-ceiling-volatility-v1")
        p = base / "weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json"
        d = json.loads(p.read_text(encoding="utf-8"))

        assert d["status"] in {
            "PASS_NEXTDYNE_CURRENT_SNAPSHOT_FEASIBILITY_PROSPECTIVE_ONLY_DESIGN_REVIEW_REQUIRED",
            "STOP_NEXTDYNE_CURRENT_SNAPSHOT_SOURCE_FEASIBILITY_BEFORE_OUTCOMES",
            "BLOCKED_PUBLIC_HTML_TABLE_PARSER_NO_SOURCE_DECISION",
        }

        g = d["governance"]
        assert g["provider_self_reported_accuracy_metrics_used_in_decision"] is False
        assert g["provider_self_reported_accuracy_metrics_persisted"] is False
        assert g["realized_player_outcome_rows_ingested"] is False
        assert g["realized_player_outcome_association_opened"] is False
        assert g["production_change_authorized"] is False
        assert g["user_facing_display_authorized"] is False
        assert g["fundamental_value_effect_authorized"] is False
        assert g["package_adjustment_effect_authorized"] is False
        assert g["team_utility_effect_authorized"] is False
        assert g["trade_value_effect_authorized"] is False

        h = d["historical_archive"]
        assert h["reproducible_full_historical_snapshot_archive_proven"] is False
        assert h["retrospective_phase_authorized"] is False

        if d["status"].startswith("PASS_"):
            assert all(d["hard_gates"].values())
            assert d["faq_checks"]["logged_out_half_ppr_documented"] is True
            assert d["faq_checks"]["same_model_low_high_band_documented"] is True
            assert d["coverage"]["valid_band_rows"] >= 150

        print("PASS: B37 source result is current-snapshot feasibility only.")
        print("Historical retrospective authorization: NO")
        print("Outcome association opened: NO")
        print("Production authorized: NO")
        PY

        test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
        test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
    - name: Run repository regression checks
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/repo_regression_checks.py
    - name: Commit B37 aggregate/public feasibility artifacts
      shell: bash
      run: |
        set -euo pipefail

        git add   research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py   research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json

        git diff --cached --check
        git commit -m "Audit NextDyne Weekly Floor Ceiling source feasibility"
        git pull --rebase origin main
        git push origin main
    - name: Archive replacement and obsolete unrun B37 workflow
      shell: bash
      run: |
        set -euo pipefail

        archive_one() {
          local src="$1"
          local dst=".github/workflow-archive/completed-research/$(basename "$src")"
          if [ ! -f "$src" ]; then
            return 0
          fi
          mkdir -p "$(dirname "$dst")"
          if [ -e "$dst" ]; then
            if [ "$(sha256sum "$src" | awk '{print $1}')" = "$(sha256sum "$dst" | awk '{print $1}')" ]; then
              rm "$src"
            else
              echo "ERROR: archive collision with different bytes: $dst" >&2
              exit 1
            fi
          else
            mv "$src" "$dst"
          fi
        }

        archive_one ".github/workflows/$SELF_WORKFLOW"
        archive_one ".github/workflows/$OBSOLETE_B37_WORKFLOW"

        git add .github/workflows .github/workflow-archive/completed-research
        if git diff --cached --quiet; then
          echo "No workflow archive changes."
        else
          git diff --cached --check
          git commit -m "Archive B37 source feasibility workflows"
          git pull --rebase origin main
          git push origin main
        fi
    - name: Closeout
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
