          JSONFILE

          cat > research/schedule-utility-v1/schedule_utility_v1_phase1a_source_feasibility.md <<'MDFILE'
          # Schedule Utility V1 — Phase 1A Private Source Ingestion Feasibility

          **Decision:** `PASS_PRIVATE_SOURCE_INGESTION_FEASIBILITY`

          Phase 1A validated the user-supplied private 4for4 aFPA / Hot Spots source bundle without reading fantasy outcomes and without persisting proprietary row-level provider data.

          ## Source coverage

          - One Half-PPR aFPA master table: 32 NFL teams.
          - Seven Hot Spots tables: QB Half-PPR, RB Half-PPR, WR Half-PPR, TE Half-PPR, RB PPR, WR PPR, TE PPR.
          - Each Hot Spots table: 32 teams, 18 weekly columns, exactly one bye per team.
          - 544 non-bye weekly matchup cells per Hot Spots table.
          - 3,808 total non-bye weekly matchup cells across the seven Hot Spots tables.

          ## Structural validation

          - All four Half-PPR position tables reproduce the opponent aFPA master value exactly across 2,176 checks.
          - All seven Hot Spots tables encode the same NFL schedule.
          - Schedule reciprocity is exact.
          - PPR and Half-PPR schedules match exactly for RB, WR, and TE.
          - `PO2` is consistent with Weeks 16–17 and `PO3` with Weeks 15–17 within display-rounding tolerance.

          ## V1 window policy

          Provider `ROS`, `PO2`, and `PO3` summary columns are retained only as audit evidence. Schedule Utility V1 will derive its own:
          - next-3-games window,
          - rest-of-fantasy-regular-season window,
          - configured league-playoff window

          from the weekly matchup cells.

          ## Required metadata guard

          The CSV exports do not embed capture timestamp or as-of week. Future ingestion must receive both externally and fail closed if either is missing.

          ## Production

          No Fundamental Value, draft-pick value, Package Adjustment, Team Utility, Market Value, Trade Verdict, or UI production code is changed or authorized by Phase 1A.
          MDFILE

      - name: Validate research helper and safe aggregate artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            research/schedule-utility-v1/schedule_utility_v1_private_ingest.py
          python3 \
            research/schedule-utility-v1/schedule_utility_v1_private_ingest.py \
            --selftest

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "research/schedule-utility-v1/"
              "schedule_utility_v1_phase1a_source_feasibility.json"
          )
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["study_id"] == "schedule-utility-v1"
          assert d["phase"] == "1A"
          assert d["status"] == "PASS_PRIVATE_SOURCE_INGESTION_FEASIBILITY"
          assert d["outcome_data_read"] is False
          assert d["production_change_authorized"] is False
          assert d["source_file_count"] == 8

          cov = d["coverage"]
          assert cov["team_count"] == 32
          assert cov["hot_spots_table_count"] == 7
          assert cov["hot_spots_nonbye_weekly_cells_per_table"] == 544
          assert cov["hot_spots_total_nonbye_weekly_cells"] == 3808

          v = d["validation"]
          assert v["half_ppr_afpa_exact_checks"] == 2176
          assert v["half_ppr_afpa_value_mismatches"] == 0
          assert v["schedule_identity_mismatches"] == 0
          assert v["schedule_reciprocity_mismatches"] == 0
          assert v["ppr_vs_half_schedule_mismatches"] == 0
          assert v["po2_consistent_with_weeks_16_17_with_display_rounding"] is True
          assert v["po3_consistent_with_weeks_15_17_with_display_rounding"] is True

          meta = d["metadata_contract"]
          assert meta["capture_timestamp_must_be_supplied_externally"] is True
          assert meta["as_of_week_must_be_supplied_externally"] is True
          assert meta["fail_closed_if_missing"] is True

          lic = d["licensing_guard"]
          assert lic["private_source_files_committed"] is False
          assert lic["raw_provider_rows_persisted_publicly"] is False
          assert lic["row_level_provider_output_persisted_publicly"] is False

          print("PASS: Phase 1A safe aggregate artifact validated.")
          PY

      - name: Scan Phase 1A public artifacts for accidental raw provider leakage
        shell: bash
        run: |
          set -euo pipefail

          # The public summary may contain hashes/counts/schema facts only.
          # It must not contain any weekly opponent-value cells such as 10.9@LAC.
          if grep -R -n -E '[0-9]+\.[0-9]+@?[A-Z]{2,3}' \
            research/schedule-utility-v1/schedule_utility_v1_phase1a_source_feasibility.*; then
            echo "Possible row-level provider value leakage detected."
            exit 1
          fi

          echo "PASS: no row-level matchup-value pattern found in Phase 1A public artifacts."

      - name: Prove zero production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"

          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          git diff --check
          echo "PASS: Phase 1A touched research/schedule-utility-v1 only."

      - name: Commit frozen Phase 1A artifacts
        shell: bash
        run: |
          set -euo pipefail

          git add \
            research/schedule-utility-v1/schedule_utility_v1_private_ingest.py \
            research/schedule-utility-v1/schedule_utility_v1_phase1a_source_feasibility.json \
            research/schedule-utility-v1/schedule_utility_v1_phase1a_source_feasibility.md

          if git diff --cached --quiet; then
            echo "Phase 1A artifacts already frozen; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Schedule Utility V1 Phase 1A source feasibility"
          git push origin HEAD:main

      - name: Closeout summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## B22 Schedule Utility V1 — Phase 1A"
            echo
            echo "- Decision: **PASS_PRIVATE_SOURCE_INGESTION_FEASIBILITY**"
            echo "- Private source files analyzed: **8**"
            echo "- NFL teams: **32**"
            echo "- Hot Spots tables: **7**"
            echo "- Non-bye weekly matchup cells: **3,808**"
            echo "- Half-PPR aFPA exact checks: **2,176 / 2,176**"
            echo "- Schedule mismatches: **0**"
            echo "- Schedule reciprocity mismatches: **0**"
            echo "- PPR vs Half-PPR schedule mismatches: **0**"
            echo "- Outcome data opened: **NO**"
            echo "- Production change: **NONE**"
            echo "- Raw 4for4 rows committed: **NO**"
            echo "- Next phase: **1B coverage, freshness, and source-disagreement audit**"
          } >> "$GITHUB_STEP_SUMMARY"
