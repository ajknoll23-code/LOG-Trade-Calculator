              },
              "wr_ppr": {
                "columns": 22,
                "rows": 32,
                "sha256": "ef323c774adcc680944ee2db8414f598eb96b714d09ec44263ba3a49309c8d4d"
              }
            },
            "status": "PASS_PRIVATE_SOURCE_INGESTION_FEASIBILITY",
            "study_id": "schedule-utility-v1",
            "validation": {
              "half_ppr_afpa_exact_checks": 2176,
              "half_ppr_afpa_value_mismatches": 0,
              "po2_consistent_with_weeks_16_17_with_display_rounding": true,
              "po2_max_abs_display_rounding_error": 0.05,
              "po3_consistent_with_weeks_15_17_with_display_rounding": true,
              "po3_max_abs_display_rounding_error": 0.066666667,
              "ppr_vs_half_schedule_mismatches": 0,
