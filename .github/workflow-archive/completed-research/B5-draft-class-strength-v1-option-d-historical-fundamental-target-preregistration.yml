name: B5 Draft Class Strength V1 - Option D Historical Fundamental Target Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B5 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard B3 B4 and H3 O2 lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D = Path("research/draft-class-strength-v1")
          B3 = D / "phase0b_v0_signal_reliability.json"
          B3M = D / "phase0a_manifest_v2.json"
          B4 = D / "b4_historical_target_expansion_source_feasibility.json"

          V6P = Path(
              "research/draft-pick-fv-v6/"
              "structural_continuity_preregistration_v6.json"
          )
          V10P = Path(
              "research/draft-pick-fv-v10/"
              "v10_phase0_expected_value_preregistration.json"
          )
          V10P1 = Path(
              "research/draft-pick-fv-v10/"
              "v10_phase1_market_bridge_tail_evaluation.json"
          )
          RELEASE = Path("model/releases/draft-pick-fv-v10/manifest.json")

          for p in (B3, B3M, B4, V6P, V10P, V10P1, RELEASE):
              assert p.exists(), p

          b3 = json.loads(B3.read_text())
          b3m = json.loads(B3M.read_text())
          b4 = json.loads(B4.read_text())
          v6p = json.loads(V6P.read_text())
          v10p = json.loads(V10P.read_text())
          v10p1 = json.loads(V10P1.read_text())
          rel = json.loads(RELEASE.read_text())

          assert b3["decision"] == (
              "STOP_EXPAND_HISTORICAL_TARGET_PANEL_BEFORE_INTERPRETING_V0"
          )
          assert b3["diagnostic_only"] is True
          assert b3["class_count"] == 6
          assert b3["minimum_classes_for_interpretable_V0"] == 8
          assert b3["minimum_classes_before_predictor_fit"] == 10
          assert b3["predictor_features_read"] is False
          assert b3["predictor_fit_performed"] is False
          assert b3["2027_features_read"] is False
          assert b3["2027_class_scored"] is False
          assert b3["production_change_authorized"] is False
          assert b3m["V0_diagnostic_only"] is True

          assert b4["decision"] == (
              "STOP_B4_MFL_OLDER_CLASS_SOURCE_NOT_FEASIBLE_USE_ALTERNATE_SOURCE_DESIGN"
          )
          assert b4["passing_year_n"] == 0
          assert b4["passing_years"] == []
          assert b4["historical_player_outcomes_read"] is False
          assert b4["predictor_fit_performed"] is False
          assert b4["2027_class_scored"] is False
          assert b4["production_change_authorized"] is False

          hist = v6p["historical_outcome_contract"]
          assert hist["provider"] == "Sleeper historical weekly NFL stats"
          assert hist["weeks"] == list(range(1, 19))
          assert hist["O2_scale"] == {
              "age_as_of": "September 1 of evaluated season",
              "aggregation": "arithmetic mean of annual equivalents",
              "base_scale": 5500,
              "name": "three_year_player_equivalent_fv",
              "realized_prod_mult": (
                  "0 if zero games; otherwise clamp(-0.10 + 0.75 * "
                  "(season_total/(replacement_ppg*scheduled_games)), 0.15, 1.55)"
              ),
              "role": "Starter",
          }
          assert hist["frozen_position_weights"] == {
              "DB": 0.87,
              "DL": 0.93,
              "LB": 1.12,
              "QB": 1.3,
              "RB": 0.89,
              "TE": 0.82,
              "WR": 1,
          }
          assert hist["frozen_replacement_ranks"] == {
              "DB": 22,
              "DL": 16,
              "LB": 28,
              "QB": 29,
              "RB": 25,
              "TE": 11,
              "WR": 28,
          }
          assert hist["scheduled_games"] == {
              "2021_and_later": 17,
              "through_2020": 16,
          }

          dev = v10p["source_contract"]["development"]
          assert dev["horizon"] == "H3"
          assert dev["target"] == "O2"
          assert dev["years"] == [2018, 2019, 2020, 2021, 2022, 2023]
          assert (
              "fit, rescale, tune, or select the FV estimator using KTC values"
              in v10p["forbidden"]
          )
          assert v10p1["phase0_fundamental_core_unchanged"] is True
          assert v10p1["market_bridge"][
              "ktc_used_to_refit_fundamental_core"
          ] is False

          assert rel["release_id"] == "draft-pick-fv-v10-production-release-v2"
          assert rel["production_change_authorized"] is True

          print("PASS: B3 exploratory exposure acknowledged.")
          print("PASS: B4 older-MFL primary path is stopped.")
          print("PASS: H3.O2 fundamental-value lineage is pinned.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: repository regression baseline."

      - name: Freeze Option D architecture before extended target construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          D = ROOT / "research/draft-class-strength-v1"
          D.mkdir(parents=True, exist_ok=True)

          b3 = json.loads(
              (D / "phase0b_v0_signal_reliability.json").read_text()
          )
          b4 = json.loads(
              (D / "b4_historical_target_expansion_source_feasibility.json").read_text()
          )
          v6p_path = (
              ROOT
              / "research/draft-pick-fv-v6"
              / "structural_continuity_preregistration_v6.json"
          )
          v6p = json.loads(v6p_path.read_text())
          hist = v6p["historical_outcome_contract"]

          option_d = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b5_option_d_historical_fundamental_target_preregistration",
              "status": "FROZEN_BEFORE_OPTION_D_EXTENDED_OUTCOME_CONSTRUCTION",
              "decision": "FREEZE_OPTION_D_FUNDAMENTAL_CLASS_TALENT_ARCHITECTURE",
              "architecture_pivot": {
                  "old_primary_target": (
                      "Historical H3.O2 values grouped by observed Superflex rookie-"
                      "draft R1-R4 early/mid/late cells."
                  ),
                  "problem_with_old_target": (
                      "The H3.O2 values themselves are market-free, but the fantasy "
                      "rookie-draft ordering that assigns players to cells is a market "
                      "ordering. That mixes fundamental player outcomes, market ordering, "
                      "and Superflex format in one target."
                  ),
                  "new_primary_target": (
                      "Historical fundamental class talent from player-level H3.O2 "
                      "outcomes, indexed without fantasy rookie ADP."
                  ),
                  "sf_translation_separate": True,
                  "mfl_older_class_expansion_primary_path_retired": True,
                  "mfl_transport_retry_role": (
                      "Optional diagnostic only. It cannot restore the old target as "
                      "primary or change the Option D architecture."
                  ),
                  "one_qb_historical_adp_role": (
                      "Quarantined sensitivity analysis only after the primary model "
                      "is frozen. It cannot raise confidence, tune features, select "
                      "models, or construct synthetic historical SF rankings."
                  ),
              },
              "exposure_and_second_look_disclosure": {
                  "b3_six_class_v0_already_seen": True,
                  "b3_class_count": b3["class_count"],
                  "b3_permutation_p_value": b3["permutation_p_value"],
                  "b3_provisional_reliability": b3["provisional_reliability"],
                  "b3_signal_gate_was_provisional": True,
                  "b4_mfl_feasibility_already_seen": True,
                  "v10_2018_2023_h3o2_cell_outcomes_already_exposed": True,
                  "option_d_2010_2023_target_not_yet_constructed": True,
                  "formal_test_policy": (
                      "The first extended Option D V0 executed after this B5 freeze is "
                      "the formal target-level signal test. The six-class B3 result is "
                      "exploratory and may not be pooled with or used to tune B6."
                  ),
              },
              "historical_range_contract": {
                  "candidate_years": list(range(2010, 2024)),
                  "minimum_complete_classes_for_formal_v0": 10,
                  "target_complete_classes": 14,
                  "class_exclusion_rule": (
                      "A class is excluded only for preregistered source/identity/"
                      "H3-completeness failure, never because its strength result is "
                      "surprising or hurts significance."
                  ),
                  "2024_or_later_primary_target": False,
              },
              "player_scope_contract": {
                  "positions_primary": ["QB", "RB", "WR", "TE"],
                  "idp_in_v1_primary_target": False,
                  "idp_policy": (
                      "DL/LB/DB class-strength modeling requires a separately "
                      "preregistered successor; it is not silently mixed into V1."
                  ),
                  "population_branch_must_be_chosen_before_h3o2_outcomes_are_read": True,
                  "population_branch_decision_rule": {
                      "branch_A": {
                          "name": "DRAFTED_PLUS_UDFA",
                          "use_if": (
                              "A reproducible UDFA registry/source can be built for every "
                              "candidate year before outcome access, with >=95% stable-ID "
                              "resolution overall, no year below 90%, and no inclusion "
                              "criterion based on games, fantasy points, career success, "
                              "or later market value."
                          ),
                      },
                      "branch_B": {
                          "name": "DRAFTED_ONLY_PRIMARY_UDFA_SENSITIVITY",
                          "use_if": (
                              "Branch A's source/identity gate fails before outcomes."
                          ),
                      },
                      "no_post_outcome_branch_switch": True,
                  },
                  "stable_identity_required": True,
                  "eventual_fantasy_rookie_adp_required": False,
                  "eventual_superflex_slot_required": False,
              },
              "h3o2_value_contract": {
                  "source_lineage_file": str(v6p_path.relative_to(ROOT)),
                  "provider": hist["provider"],
                  "weeks": hist["weeks"],
                  "scheduled_games": hist["scheduled_games"],
                  "o2_scale": hist["O2_scale"],
                  "position_weights_primary_subset": {
                      k: hist["frozen_position_weights"][k]
                      for k in ("QB", "RB", "WR", "TE")
                  },
                  "replacement_ranks_primary_subset": {
                      k: hist["frozen_replacement_ranks"][k]
                      for k in ("QB", "RB", "WR", "TE")
                  },
                  "replacement_pool_position_lineage_hardening": hist[
                      "replacement_pool_position_lineage_hardening"
                  ],
                  "change_from_v10_value_function_authorized": False,
                  "market_or_ktc_in_player_value": False,
              },
              "outcome_sorted_target_contract": {
                  "sorting_key": "H3.O2 descending",
                  "ties": (
                      "Break exact H3.O2 ties by stable player ID ascending solely for "
                      "deterministic ordering."
                  ),
                  "required_top_n": 48,
                  "bucket_boundaries_frozen": [
                      {"id": "top6", "ranks": [1, 6]},
                      {"id": "seven_to_12", "ranks": [7, 12]},
                      {"id": "thirteen_to_24", "ranks": [13, 24]},
                      {"id": "twentyfive_to_48", "ranks": [25, 48]},
                  ],
                  "bucket_statistic": "arithmetic mean H3.O2",
                  "primary_overall_statistic": (
                      "sum of H3.O2 for ranks 1-48"
                  ),
                  "leave_one_class_out_baseline": (
                      "For each scored class, compute expected top-48 total and bucket "
                      "means from all other eligible historical classes only."
                  ),
                  "class_log_strength": (
                      "log(class top-48 H3.O2 total / leave-one-class-out mean top-48 total)"
                  ),
                  "class_multiplier": "exp(class_log_strength)",
                  "bucket_log_strengths_secondary": True,
                  "no_fantasy_adp_in_primary_target": True,
                  "nfl_draft_slot_secondary_curve": (
                      "Allowed as a separately reported diagnostic only."
                  ),
                  "sensitivity_boundaries_allowed": [
                      "top12 total",
                      "top24 total",
                      "top36 total",
                      "top60 total if all classes have >=60 eligible H3.O2-ready players",
                  ],
                  "sensitivity_results_cannot_redefine_primary_after_results": True,
              },
              "qb_dominance_diagnostics": {
                  "required": True,
                  "report": [
                      "QB-only share of class top-48 H3.O2 total",
                      "non-QB share of class top-48 H3.O2 total",
                      "class strength recomputed excluding QBs",
                      "top-48 QB count",
                      "largest single-player share of class top-48 total",
                  ],
                  "winsorization": (
                      "Primary remains the frozen H3.O2 value function. Report a "
                      "99th-percentile pooled-player winsorized sensitivity only."
                  ),
              },
              "formal_v0_next_stage": {
                  "first_formal_option_d_test": True,
                  "minimum_classes": 10,
                  "permutations": 50000,
                  "seed": 20260930,
                  "primary_null": (
                      "Pool eligible player H3.O2 outcomes across included classes; "
                      "randomly reassign players to class labels while preserving each "
                      "class's eligible-player count, then sort within each permuted "
                      "class and recompute top-48 class strength."
                  ),
                  "secondary_position_preserving_null": (
                      "Permute within position while preserving each class's observed "
                      "QB/RB/WR/TE counts."
                  ),
                  "observed_statistic": "sample variance of class_log_strength",
                  "reliability": (
                      "max(0, 1 - mean(primary-null class-score variance) / "
                      "observed class-score variance)"
                  ),
                  "reliability_bootstrap": {
                      "replicates": 10000,
                      "seed": 20261001,
                      "unit": (
                          "resample eligible players with replacement within each class, "
                          "preserving each class's observed player count"
                      ),
                      "report_intervals": [0.80, 0.95],
                  },
                  "pass_gate": {
                      "permutation_p_lt": 0.10,
                      "reliability_ge": 0.30,
                      "reliability_80pct_lower_bound_gt": 0.0,
                  },
                  "fail_action": (
                      "STOP Draft Class Strength V1 predictive modeling and retain "
                      "neutral class factor 1.00."
                  ),
                  "no_threshold_change_after_b6": True,
              },
              "bridge_contract_2018_2023": {
                  "purpose": (
                      "Test whether the new fundamental class-talent score remains "
                      "meaningfully related to the already-exposed SF-cell class score "
                      "without fitting free class-level loadings."
                  ),
                  "years": [2018, 2019, 2020, 2021, 2022, 2023],
                  "new_option_d_scores_must_be_recomputed_under_new_rule": True,
                  "do_not_splice_old_cell_scores_into_new_target": True,
                  "metrics": [
                      "Spearman rank correlation",
                      "Pearson correlation",
                      "above/below-neutral sign agreement",
                      "drop-one-year influence",
                  ],
                  "interpretation_gates": {
                      "supportive": {
                          "spearman_ge": 0.60,
                          "pearson_ge": 0.50,
                          "sign_agreement_ge_fraction": 0.6666666666666666,
                      },
                      "clear_bridge_failure": {"spearman_lt": 0.30},
                      "middle_zone": (
                          "Research-only/shadow. Do not fit a production class multiplier "
                          "from six class-level points."
                      ),
                  },
                  "free_class_level_slope_fit_allowed": False,
                  "bridge_is_not_production_authorization": True,
              },
              "future_sf_translation_contract": {
                  "separate_stage_required": True,
                  "player_level_mapping_preferred": True,
                  "training_years_initial": [2018, 2019, 2020, 2021, 2022, 2023],
                  "candidate_inputs": [
                      "NFL draft capital or point-in-time projected draft capital appropriate to application date",
                      "position",
                      "other prospect attributes frozen before the mapping study",
                  ],
                  "target": "observed SF rookie-draft ordering/slot where trustworthy",
                  "validation": "leave-one-draft-class-out",
                  "free_class_level_loading_fit_forbidden_with_only_six_classes": True,
                  "if_mapping_needs_free_class_parameters": "FAIL",
                  "application_note": (
                      "Actual NFL draft capital cannot be used to price a future class "
                      "before that capital exists."
                  ),
              },
              "predictor_stage_after_v0": {
                  "player_level_primary": True,
                  "anchor_window": "September 15 through October 15 of year before NFL Draft",
                  "formal_predictor_years_candidate": list(range(2010, 2024)),
                  "verified_anchor_date_inputs_required": True,
                  "minimum_classes_with_verified_predictors": 8,
                  "minimum_classes_before_predictor_fit": 10,
                  "walk_forward_required": True,
                  "loco_secondary": True,
                  "neutral_M0_required": True,
                  "naive_fixed_index_required": True,
                  "nested_feature_and_hyperparameter_selection_required": True,
                  "class_clustered_inference_required": True,
                  "2027_blinded_until_method_frozen": True,
              },
              "later_pricing_value_stop_rule": {
                  "trigger": (
                      "If a validated class model's plausible production multiplier "
                      "range is approximately within +/-3% of 1.00, or smaller than "
                      "V10's own relevant pick-value uncertainty/error."
                  ),
                  "action": "Do not deploy a class-strength pricing adjustment.",
              },
              "forbidden": [
                  "continue forcing old MFL SF ordering into the primary historical target",
                  "manufacture historical SF rankings by mathematically adjusting 1QB ADP",
                  "hybridize 1QB RB/WR/TE ordering with synthetic QB placement for the primary target",
                  "use KTC or other market prices to construct or fit fundamental class talent",
                  "use fantasy rookie ADP in the primary Option D historical target",
                  "choose UDFA population branch after seeing H3.O2 outcomes",
                  "change H3.O2 value-function constants after seeing extended class results",
                  "change top-6/7-12/13-24/25-48 primary buckets after seeing results",
                  "change formal V0 thresholds after B6",
                  "pool the exploratory six-class B3 p-value with the formal Option D p-value",
                  "score 2027 before historical target and predictor method are frozen",
                  "read partial 2026 rookie outcomes",
                  "change production PICK_BASE",
                  "change production YEAR_DISCOUNT",
                  "change player Fundamental Value",
                  "change Package Adjustment",
                  "change Team Utility",
                  "change Market Value",
              ],
              "next_stage": (
                  "B6 Option D historical target construction for 2010-2023."
              ),
              "predictor_fit_performed": False,
              "option_d_extended_outcomes_read": False,
              "2027_features_read": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }

          source_gate = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b5_option_d_population_source_gate",
              "decision": "FREEZE_PRE_OUTCOME_POPULATION_BRANCH_RULE",
              "candidate_years": list(range(2010, 2024)),
              "primary_positions": ["QB", "RB", "WR", "TE"],
              "udfa_branch_A_source_gate": {
                  "must_cover_every_candidate_year": True,
                  "overall_stable_id_resolution_ge": 0.95,
                  "each_year_stable_id_resolution_ge": 0.90,
                  "outcome_based_inclusion_forbidden": [
                      "games played",
                      "fantasy points",
                      "career length",
                      "market value",
                  ],
                  "source_audit_must_complete_before_h3o2_read": True,
              },
              "branch_if_udfa_gate_passes": "DRAFTED_PLUS_UDFA",
              "branch_if_udfa_gate_fails": "DRAFTED_ONLY_PRIMARY_UDFA_SENSITIVITY",
              "branch_switch_after_outcomes_forbidden": True,
              "minimum_h3o2_ready_players_per_class": 48,
              "minimum_complete_classes": 10,
              "target_complete_classes": 14,
              "predictor_data_read": False,
              "h3o2_extended_outcomes_read": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }

          b6_contract = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b5_b6_execution_contract",
              "decision": "B6_AUTHORIZED_ONLY_UNDER_FROZEN_OPTION_D_CONTRACT",
              "ordered_steps": [
                  "1. Guard B5 artifacts and hashes.",
                  "2. Audit drafted-player and UDFA source/identity coverage without reading H3.O2 outcomes.",
                  "3. Freeze population Branch A or Branch B from the B5 rule.",
                  "4. Harvest/recompute H3.O2 using the pinned historical value function.",
                  "5. Enforce >=48 H3.O2-ready primary-position players per included class.",
                  "6. Construct outcome-sorted top-48 target and leave-one-class-out baselines.",
                  "7. Run formal 50,000-permutation V0 and 10,000-replicate reliability bootstrap.",
                  "8. Run position-preserving null and QB/non-QB diagnostics.",
                  "9. Recompute 2018-2023 under Option D and run the frozen bridge.",
                  "10. Stop or authorize predictor-source feasibility under frozen gates.",
              ],
              "hard_stop_before_predictors_if": [
                  "fewer than 10 complete Option D classes",
                  "formal V0 permutation p-value >= 0.10",
                  "formal reliability < 0.30",
                  "80% bootstrap lower bound for reliability <= 0",
              ],
              "bridge_clear_failure_if": "Spearman < 0.30 on 2018-2023",
              "if_v0_passes": (
                  "Authorize predictor SOURCE FEASIBILITY only, not predictor fitting "
                  "unless >=10 classes also have verified anchor-date predictor inputs."
              ),
              "2027_must_remain_blind": True,
              "production_change_authorized": False,
          }

          report = "\n".join([
              "# Draft Class Strength V1 — B5 Option D Preregistration",
              "",
              "**Decision:** `FREEZE_OPTION_D_FUNDAMENTAL_CLASS_TALENT_ARCHITECTURE`",
              "",
              "The primary historical target is no longer defined by historical fantasy rookie-draft",
              "cells. H3.O2 player values remain frozen, but class talent is measured directly from",
              "an outcome-sorted player curve. Superflex rookie-pick ordering becomes a separate",
              "translation problem.",
              "",
              "Candidate classes: **2010–2023**.",
              "Primary positions: **QB/RB/WR/TE**.",
              "Primary outcome curve: ranks **1–6, 7–12, 13–24, 25–48**.",
              "",
              "The first 2010–2023 Option D V0 is the formal signal test. The already-seen six-class",
              "B3 result remains exploratory. No 2027 data or production values may be touched.",
              "",
          ])

          artifacts = {
              "b5_option_d_historical_fundamental_target_preregistration.json": option_d,
              "b5_option_d_population_source_gate.json": source_gate,
              "b5_b6_execution_contract.json": b6_contract,
          }
          for name, obj in artifacts.items():
              (D / name).write_text(
                  json.dumps(obj, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          md = D / "b5_option_d_historical_fundamental_target_preregistration.md"
          md.write_text(report, encoding="utf-8")

          outputs = [D / name for name in artifacts] + [md]
          manifest = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b5_manifest",
              "decision": "PASS_B5_OPTION_D_PREREGISTRATION_FROZEN_B6_NEXT",
              "output_hashes": {
                  p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in outputs
              },
              "mfl_old_primary_path_retired": True,
              "formal_option_d_v0_not_yet_run": True,
              "predictor_fit_performed": False,
              "option_d_extended_outcomes_read": False,
              "2027_features_read": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
              "next_stage": "B6 Option D Historical Target Construction and Formal V0",
          }
          (D / "b5_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "decision": manifest["decision"],
              "candidate_years": option_d["historical_range_contract"]["candidate_years"],
              "formal_v0_permutations": option_d["formal_v0_next_stage"]["permutations"],
              "reliability_bootstrap_replicates": option_d[
                  "formal_v0_next_stage"
              ]["reliability_bootstrap"]["replicates"],
              "option_d_extended_outcomes_read": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }, indent=2))
          PY

      - name: Validate B5 frozen contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          D = Path("research/draft-class-strength-v1")
          p = json.loads(
              (D / "b5_option_d_historical_fundamental_target_preregistration.json").read_text()
          )
          s = json.loads(
              (D / "b5_option_d_population_source_gate.json").read_text()
          )
          b6 = json.loads((D / "b5_b6_execution_contract.json").read_text())
          m = json.loads((D / "b5_manifest.json").read_text())

          assert p["decision"] == "FREEZE_OPTION_D_FUNDAMENTAL_CLASS_TALENT_ARCHITECTURE"
          assert p["status"] == "FROZEN_BEFORE_OPTION_D_EXTENDED_OUTCOME_CONSTRUCTION"
          assert p["architecture_pivot"]["mfl_older_class_expansion_primary_path_retired"] is True
          assert p["architecture_pivot"]["sf_translation_separate"] is True
          assert p["exposure_and_second_look_disclosure"]["b3_six_class_v0_already_seen"] is True
          assert p["exposure_and_second_look_disclosure"]["option_d_2010_2023_target_not_yet_constructed"] is True

          assert p["historical_range_contract"]["candidate_years"] == list(range(2010, 2024))
          assert p["historical_range_contract"]["minimum_complete_classes_for_formal_v0"] == 10
          assert p["player_scope_contract"]["positions_primary"] == ["QB", "RB", "WR", "TE"]
          assert p["player_scope_contract"]["idp_in_v1_primary_target"] is False

          t = p["outcome_sorted_target_contract"]
          assert t["required_top_n"] == 48
          assert t["bucket_boundaries_frozen"] == [
              {"id": "top6", "ranks": [1, 6]},
              {"id": "seven_to_12", "ranks": [7, 12]},
              {"id": "thirteen_to_24", "ranks": [13, 24]},
              {"id": "twentyfive_to_48", "ranks": [25, 48]},
          ]
          assert t["no_fantasy_adp_in_primary_target"] is True

          v0 = p["formal_v0_next_stage"]
          assert v0["first_formal_option_d_test"] is True
          assert v0["permutations"] == 50000
          assert v0["reliability_bootstrap"]["replicates"] == 10000
          assert v0["pass_gate"] == {
              "permutation_p_lt": 0.10,
              "reliability_ge": 0.30,
              "reliability_80pct_lower_bound_gt": 0.0,
          }

          bridge = p["bridge_contract_2018_2023"]
          assert bridge["years"] == [2018,2019,2020,2021,2022,2023]
          assert bridge["free_class_level_slope_fit_allowed"] is False
          assert bridge["new_option_d_scores_must_be_recomputed_under_new_rule"] is True
          assert bridge["do_not_splice_old_cell_scores_into_new_target"] is True

          assert s["branch_switch_after_outcomes_forbidden"] is True
          assert s["minimum_h3o2_ready_players_per_class"] == 48
          assert s["minimum_complete_classes"] == 10
          assert s["h3o2_extended_outcomes_read"] is False

          assert b6["2027_must_remain_blind"] is True
          assert b6["production_change_authorized"] is False

          assert m["decision"] == "PASS_B5_OPTION_D_PREREGISTRATION_FROZEN_B6_NEXT"
          assert m["formal_option_d_v0_not_yet_run"] is True
          assert m["predictor_fit_performed"] is False
          assert m["option_d_extended_outcomes_read"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          for name, expected in m["output_hashes"].items():
              got = hashlib.sha256((D / name).read_bytes()).hexdigest()
              assert got == expected, (name, expected, got)

          all_text = "\n".join(
              x.read_text(encoding="utf-8")
              for x in D.glob("b5_*")
              if x.is_file()
          ).lower()
          assert '"production_change_authorized": true' not in all_text
          assert '"predictor_fit_performed": true' not in all_text
          assert '"2027_class_scored": true' not in all_text
          assert '"option_d_extended_outcomes_read": true' not in all_text

          print("PASS: B5 Option D contract frozen and fail-closed.")
          PY

      - name: Prove B5 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = [line[3:] for line in raw.splitlines() if line.strip()]
          assert touched, "Expected B5 research artifacts."
          assert all(
              p.startswith("research/draft-class-strength-v1/b5_")
              for p in touched
          ), touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          assert not any(p.startswith("scripts/") for p in touched)
          assert not any(p.startswith("data/") for p in touched)
          assert not any(p.startswith("model/") for p in touched)

          print("PASS: B5 mutation scope is research-only.")
          PY

      - name: Commit frozen B5 preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B5 preregistration."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-class-strength-v1/b5_option_d_historical_fundamental_target_preregistration.json \
            research/draft-class-strength-v1/b5_option_d_population_source_gate.json \
            research/draft-class-strength-v1/b5_b6_execution_contract.json \
            research/draft-class-strength-v1/b5_option_d_historical_fundamental_target_preregistration.md \
            research/draft-class-strength-v1/b5_manifest.json

          if git diff --cached --quiet; then
            echo "PASS: B5 preregistration already matches; no commit required."
            exit 0
          fi

          git commit -m "Freeze Draft Class Strength V1 Option D preregistration"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B5 Option D preregistration frozen on main."
