name: Package Adjustment V6P1 Production Review

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen V6P1 result and current production
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          LIVE="research/package-adjustment-production-candidate-v1/live_deployment.json"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/development_candidate_v1.json")" = \
            "446a176757919be3deef0659ac01e05884be4007"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/generate_prospective_catalog_v1.py")" = \
            "0688a462b8d06b57b6b5cdf3eb191dfae8eceb2e"
          test "$(git hash-object "$D/prospective_exact_1800_frozen_v1.json")" = \
            "a9d78303aaa659aed9864e8090f53d9c2e36bd9b"
          test "$(git hash-object "$D/prospective_evaluation_v1.json")" = \
            "7fd2a07f3bd9b9214e1293d50b867c7f023ab2d1"
          test "$(git hash-object "$D/prospective_evaluation_v1.md")" = \
            "25d04d09be043c452085318d7efd6ca20786b115"
          test "$(git hash-object "$D/prospective_evaluation_manifest_v1.json")" = \
            "2a390a0d082c2514ea248c776b0f357adc949172"
          test "$(git hash-object "$LIVE")" = \
            "504ed7b67aec06d44d9e3512905c82ae6ca76fa4"
          test "$(git hash-object "scripts/validation/check_package_adjustment_live.py")" = \
            "86695c8e0ce2c1f40101ed108cdf5f213b714fe9"

          for p in \
            "$D/production_review_v1.json" \
            "$D/production_review_v1.md" \
            "$D/production_review_manifest_v1.json"
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          result = json.loads((d / "prospective_evaluation_v1.json").read_text())
          manifest = json.loads((d / "prospective_evaluation_manifest_v1.json").read_text())
          live = json.loads(
              Path(
                  "research/package-adjustment-production-candidate-v1/"
                  "live_deployment.json"
              ).read_text()
          )

          assert result["primary_confirmation"]["primary_pass"] is True
          assert result["production_change_authorized"] is False
          assert result["automatic_production_promotion_allowed"] is False
          assert result["model_selection_performed"] is False
          assert result["fitting_performed"] is False
          assert result["refitting_performed"] is False
          assert result["candidate_or_baseline_parameters_changed"] is False

          assert manifest["result"]["primary_pass"] is True
          assert manifest["evaluation_contract"][
              "primary_gate_is_only_confirmatory_performance_gate"
          ] is True
          assert manifest["evaluation_contract"][
              "safety_profiles_are_descriptive_not_individual_gates"
          ] is True

          assert live["production_revision"] == (
              "v1.6-v5-size2-composition-overlay"
          )
          assert live["production_formula_enabled"] is True

          print(
              "PASS: V6P1 prospective primary confirmation passed, "
              "but production remains V1.6 pending separate human review."
          )
          PY

      - name: Verify production remains V1.6 before review
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Build V6P1 production review
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import random
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          D = Path("research/package-adjustment-v6")
          LIVE_PATH = Path(
              "research/package-adjustment-production-candidate-v1/"
              "live_deployment.json"
          )

          RESULT_PATH = D / "prospective_evaluation_v1.json"
          CATALOG_PATH = D / "package_vote_challenges_v6_prospective_v1.json"
          GENERATOR_PATH = D / "generate_prospective_catalog_v1.py"
          DEV_CANDIDATE_PATH = D / "development_candidate_v1.json"
          FREEZE_PATH = D / "prospective_exact_1800_frozen_v1.json"

          OUT_JSON = D / "production_review_v1.json"
          OUT_MD = D / "production_review_v1.md"
          OUT_MANIFEST = D / "production_review_manifest_v1.json"

          result = json.loads(RESULT_PATH.read_text())
          catalog = json.loads(CATALOG_PATH.read_text())
          dev_candidate = json.loads(DEV_CANDIDATE_PATH.read_text())
          frozen = json.loads(FREEZE_PATH.read_text())
          live = json.loads(LIVE_PATH.read_text())

          assert result["primary_confirmation"]["primary_pass"] is True
          assert live["production_revision"] == (
              "v1.6-v5-size2-composition-overlay"
          )

          q = float(result["frozen_models"]["C2"]["q"])
          assert q == 2.9897594788655337
          assert dev_candidate["frozen_parameters"]["structural_parameters"] == [q]

          PROFILES = {
              "45/33/22": (0.45, 0.33, 0.22),
              "50/30/20": (0.50, 0.30, 0.20),
              "50/25/25": (0.50, 0.25, 0.25),
              "55/30/15": (0.55, 0.30, 0.15),
              "60/25/15": (0.60, 0.25, 0.15),
              "60/20/20": (0.60, 0.20, 0.20),
          }
          APEX_LEVELS = (0.70, 0.80, 0.90, 0.97)
          MAX_RATIO_ERROR = 0.035
          MAX_PACKAGE_SHARE_ERROR = 0.040

          generator_text = GENERATOR_PATH.read_text(encoding="utf-8")
          assert "MAX_RATIO_ERROR = 0.035" in generator_text
          assert "MAX_PACKAGE_SHARE_ERROR = 0.040" in generator_text

          def challenge_geometry(challenge):
              vals = sorted(
                  [float(x["fv"]) for x in challenge["package"]],
                  reverse=True,
              )
              assert len(vals) == 3
              total = sum(vals)
              target = float(challenge["target_fv"])
              shares = tuple(v / total for v in vals)
              apex_ratio = vals[0] / target
              score = sum(v ** q for v in vals) ** (1.0 / q)
              multiplier = total / score
              return {
                  "values": vals,
                  "total": total,
                  "target": target,
                  "shares": shares,
                  "apex_ratio": apex_ratio,
                  "score": score,
                  "multiplier": multiplier,
              }

          def within_frozen_catalog_scope(shares, apex_ratio):
              profile_matches = []
              for label, intended in PROFILES.items():
                  err = max(
                      abs(shares[i] - intended[i])
                      for i in range(3)
                  )
                  if err <= MAX_PACKAGE_SHARE_ERROR + 1e-12:
                      profile_matches.append(label)

              apex_matches = [
                  level for level in APEX_LEVELS
                  if abs(apex_ratio - level) <= MAX_RATIO_ERROR + 1e-12
              ]

              return {
                  "supported": bool(profile_matches and apex_matches),
                  "profile_matches": profile_matches,
                  "apex_matches": apex_matches,
              }

          current_env = result["frozen_models"]["C1"][
              "size3_composition_envelope"
          ]

          def current_v16_size3_supported(shares):
              return (
                  shares[0] >= current_env["largestMin"] - 1e-12
                  and shares[0] <= current_env["largestMax"] + 1e-12
                  and shares[1] >= current_env["middleMin"] - 1e-12
                  and shares[1] <= current_env["middleMax"] + 1e-12
                  and shares[2] >= current_env["smallestMin"] - 1e-12
                  and shares[2] <= current_env["smallestMax"] + 1e-12
              )

          challenge_rows = []
          equivalence_error = 0.0

          for challenge in catalog["challenges"]:
              g = challenge_geometry(challenge)
              scope = within_frozen_catalog_scope(
                  g["shares"],
                  g["apex_ratio"],
              )
              assert scope["supported"] is True

              # Exact production translation:
              # raw package S versus adjusted target T*(S/C2score)
              # has the same equality boundary as C2score versus T.
              translated_target = g["target"] * g["multiplier"]
              left = g["total"] - translated_target
              right = (
                  g["multiplier"]
                  * (g["score"] - g["target"])
              )
              equivalence_error = max(
                  equivalence_error,
                  abs(left - right),
              )

              challenge_rows.append({
                  "profile": challenge["component_profile"]["label"],
                  "apex_level": float(
                      challenge["apex_piece_to_target_target"]
                  ),
                  "shares": g["shares"],
                  "apex_ratio": g["apex_ratio"],
                  "candidate_multiplier": g["multiplier"],
                  "current_v16_supported": current_v16_size3_supported(
                      g["shares"]
                  ),
              })

          assert len(challenge_rows) == 504
          assert equivalence_error < 1e-8

          current_supported = sum(
              1 for r in challenge_rows
              if r["current_v16_supported"]
          )

          profile_catalog_stats = {}
          for label in PROFILES:
              rows = [r for r in challenge_rows if r["profile"] == label]
              assert len(rows) == 84
              profile_catalog_stats[label] = {
                  "challenge_count": 84,
                  "candidate_multiplier_min": min(
                      r["candidate_multiplier"] for r in rows
                  ),
                  "candidate_multiplier_max": max(
                      r["candidate_multiplier"] for r in rows
                  ),
                  "actual_largest_share_min": min(
                      r["shares"][0] for r in rows
                  ),
                  "actual_largest_share_max": max(
                      r["shares"][0] for r in rows
                  ),
                  "actual_middle_share_min": min(
                      r["shares"][1] for r in rows
                  ),
                  "actual_middle_share_max": max(
                      r["shares"][1] for r in rows
                  ),
                  "actual_smallest_share_min": min(
                      r["shares"][2] for r in rows
                  ),
                  "actual_smallest_share_max": max(
                      r["shares"][2] for r in rows
                  ),
                  "current_v16_supported_count": sum(
                      r["current_v16_supported"] for r in rows
                  ),
              }

          primary = result["primary_confirmation"]
          cell_diag = result["cell_diagnostics"]
          safety = result["safety_profile_diagnostics"]

          cells_better = sum(
              1 for x in cell_diag.values()
              if x["paired_C2_minus_C1_point_difference"] < 0
          )
          cells_worse = 24 - cells_better

          profile_point_better = sum(
              1 for x in safety.values()
              if x["paired_C2_minus_C1_point_difference"] < 0
          )
          profile_ucb_below_zero = sum(
              1 for x in safety.values()
              if x["one_sided_95_percent_upper_bound"] < 0
          )

          apex_summary = {}
          for apex in APEX_LEVELS:
              suffix = f"apex_{apex:.2f}"
              vals = [
                  x["paired_C2_minus_C1_point_difference"]
                  for cell, x in cell_diag.items()
                  if cell.endswith(suffix)
              ]
              assert len(vals) == 6
              apex_summary[f"{apex:.2f}"] = {
                  "cell_count": 6,
                  "mean_C2_minus_C1": sum(vals) / 6.0,
                  "cells_with_C2_better": sum(v < 0 for v in vals),
              }

          relative_log_loss_reduction = (
              primary["C1_equal_cell_macro_mean_log_loss"]
              - primary["C2_equal_cell_macro_mean_log_loss"]
          ) / primary["C1_equal_cell_macro_mean_log_loss"]

          # Independent property test of the production translation.
          # Random vectors are generated inside the frozen pre-outcome
          # catalog geometry, not chosen using performance outcomes.
          rng = random.Random(20260922)
          random_cases = 250_000
          max_identity_error = 0.0
          multiplier_min = float("inf")
          multiplier_max = 0.0

          profile_items = list(PROFILES.items())
          for _ in range(random_cases):
              _, nominal = profile_items[rng.randrange(len(profile_items))]
              raw = [
                  max(0.001, nominal[i] + rng.uniform(-0.035, 0.035))
                  for i in range(3)
              ]
              raw.sort(reverse=True)
              ssum = sum(raw)
              shares = tuple(x / ssum for x in raw)

              # Reject anything not actually in the frozen catalog geometry.
              apex_level = APEX_LEVELS[rng.randrange(len(APEX_LEVELS))]
              apex_ratio = apex_level + rng.uniform(-0.034, 0.034)
              scope = within_frozen_catalog_scope(shares, apex_ratio)
              if not scope["supported"]:
                  continue

              target = rng.uniform(750.0, 9000.0)
              total = (apex_ratio * target) / shares[0]
              vals = [total * s for s in shares]

              score = sum(v ** q for v in vals) ** (1.0 / q)
              mult = total / score
              translated_target = target * mult

              lhs = total - translated_target
              rhs = mult * (score - target)
              max_identity_error = max(
                  max_identity_error,
                  abs(lhs - rhs),
              )
              assert (lhs > 0) == (score > target) or abs(lhs) < 1e-10
              assert mult > 1.0

              multiplier_min = min(multiplier_min, mult)
              multiplier_max = max(multiplier_max, mult)

          assert max_identity_error < 1e-8

          generated_at = datetime.now(timezone.utc).isoformat()

          review = {
              "schema_version": 1,
              "status": "v6p1_production_review_ready_human_decision_required",
              "generated_at_utc": generated_at,
              "research_only": True,
              "production_changed": False,
              "production_change_authorized": False,
              "human_approval_required_before_deployment": True,
              "current_production_revision": (
                  "v1.6-v5-size2-composition-overlay"
              ),
              "candidate": {
                  "model": "C2",
                  "q": q,
                  "score_package": "(sum(v_i**q))**(1/q)",
                  "score_target": "target_fv",
                  "production_translation": {
                      "raw_package_sum": "S = sum(v_i)",
                      "candidate_score": "P = (sum(v_i**q))**(1/q)",
                      "target_multiplier": "M = S / P",
                      "trade_equivalent_target_fv": "target_fv * M",
                      "equivalence_identity": (
                          "S - target_fv*(S/P) "
                          "= (S/P)*(P - target_fv)"
                      ),
                      "catalog_max_numeric_identity_error": (
                          equivalence_error
                      ),
                  },
              },
              "prospective_confirmation": {
                  "effective_votes": 1800,
                  "voter_clusters": 45,
                  "distinct_challenges": 494,
                  "primary_pass": True,
                  "C1_equal_cell_macro_log_loss": primary[
                      "C1_equal_cell_macro_mean_log_loss"
                  ],
                  "C2_equal_cell_macro_log_loss": primary[
                      "C2_equal_cell_macro_mean_log_loss"
                  ],
                  "D_C2_minus_C1": primary["D_overall_C2_minus_C1"],
                  "relative_log_loss_reduction": relative_log_loss_reduction,
                  "one_sided_95_percent_upper_bound": primary[
                      "uncertainty_gate"
                  ]["upper_bound"],
                  "bootstrap_fraction_C2_better": primary[
                      "crossed_cluster_uncertainty"
                  ]["fraction_C2_better"],
              },
              "breadth_diagnostics": {
                  "composition_profiles_with_favorable_point_estimate": (
                      profile_point_better
                  ),
                  "composition_profile_count": 6,
                  "composition_profiles_with_95pct_ucb_below_zero": (
                      profile_ucb_below_zero
                  ),
                  "cells_with_favorable_C2_point_estimate": cells_better,
                  "cells_with_unfavorable_C2_point_estimate": cells_worse,
                  "cell_count": 24,
                  "apex_level_diagnostics": apex_summary,
                  "important_interpretation": (
                      "The six profile intervals are mandatory descriptive "
                      "safety diagnostics, not separately powered pass/fail "
                      "tests. Four profiles remain individually inconclusive "
                      "even though all six point estimates favor C2."
                  ),
              },
              "catalog_scope_review": {
                  "prospective_catalog_challenges": 504,
                  "current_v16_size3_supported_challenges": current_supported,
                  "candidate_scope_would_cover_all_frozen_catalog_challenges": True,
                  "candidate_multiplier_min_across_catalog": min(
                      r["candidate_multiplier"] for r in challenge_rows
                  ),
                  "candidate_multiplier_max_across_catalog": max(
                      r["candidate_multiplier"] for r in challenge_rows
                  ),
                  "profile_stats": profile_catalog_stats,
              },
              "proposed_conservative_production_scope": {
                  "purpose": (
                      "Mirror the frozen pre-outcome prospective catalog "
                      "geometry and fail closed outside it."
                  ),
                  "trade_topology": (
                      "exactly one target player versus exactly three "
                      "package players"
                  ),
                  "player_only": True,
                  "draft_picks_allowed": False,
                  "multi_vs_multi_allowed": False,
                  "supported_positions": [
                      "QB", "RB", "WR", "TE", "DL", "LB", "DB"
                  ],
                  "every_package_player_must_be_below_target_fv": True,
                  "composition_gate": {
                      "nominal_profiles": {
                          k: list(v) for k, v in PROFILES.items()
                      },
                      "rule": (
                          "sorted package FV shares must be within 0.040 "
                          "absolute share on every component of at least one "
                          "frozen nominal profile"
                      ),
                      "max_abs_share_error": MAX_PACKAGE_SHARE_ERROR,
                      "source": (
                          "frozen prospective catalog generator, defined "
                          "before outcomes"
                      ),
                  },
                  "apex_gate": {
                      "nominal_largest_piece_to_target_levels": list(
                          APEX_LEVELS
                      ),
                      "rule": (
                          "largest package player FV / target FV must be "
                          "within 0.035 of at least one frozen apex level"
                      ),
                      "max_abs_ratio_error": MAX_RATIO_ERROR,
                      "source": (
                          "frozen prospective catalog generator, defined "
                          "before outcomes"
                      ),
                  },
                  "outside_scope_behavior": "fail_closed_no_V6_adjustment",
                  "size2_behavior": "retain_existing_V3_V5_unchanged",
                  "fundamental_value_changed": False,
                  "market_value_changed": False,
                  "team_utility_changed": False,
                  "draft_pick_values_changed": False,
              },
              "production_translation_property_test": {
                  "random_cases_requested": random_cases,
                  "max_numeric_identity_error": max_identity_error,
                  "observed_multiplier_min": multiplier_min,
                  "observed_multiplier_max": multiplier_max,
                  "comparison_boundary_equivalence_pass": True,
                  "positive_multiplier_pass": True,
              },
              "review_conclusion": {
                  "primary_confirmation_passed": True,
                  "all_six_profile_point_estimates_favor_C2": (
                      profile_point_better == 6
                  ),
                  "22_of_24_cells_favor_C2": cells_better == 22,
                  "all_four_apex_macro_differences_favor_C2": all(
                      x["mean_C2_minus_C1"] < 0
                      for x in apex_summary.values()
                  ),
                  "uncertainty_caution": (
                      "Only 2 of 6 profile-specific one-sided 95% upper "
                      "bounds are below zero; the other 4 are individually "
                      "inconclusive. This does not fail the preregistered "
                      "primary confirmation, but it should remain visible "
                      "during the human production decision."
                  ),
                  "deployment_status": (
                      "eligible_for_explicit_human_approval_under_strict_scope"
                  ),
              },
              "next_action": (
                  "Human owner reviews this artifact. If explicitly approved, "
                  "build a separate V6 deployment workflow that changes only "
                  "1-vs-3 player-only size3 behavior inside the frozen catalog "
                  "geometry, retains size2 V3/V5 unchanged, updates exact-live "
                  "monitoring and permanent regression checks, and fails closed "
                  "outside the approved scope."
              ),
          }

          OUT_JSON.write_text(
              json.dumps(review, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          safety_lines = []
          for profile in [
              "45/33/22",
              "50/30/20",
              "50/25/25",
              "55/30/15",
              "60/25/15",
              "60/20/20",
          ]:
              x = result["safety_profile_diagnostics"][profile]
              safety_lines.append(
                  f"| {profile} | "
                  f"{x['paired_C2_minus_C1_point_difference']:+.6f} | "
                  f"{x['one_sided_95_percent_upper_bound']:+.6f} | "
                  f"{x['effective_vote_count']:.0f} | "
                  f"{x['distinct_voter_count']} |"
              )

          md = "\n".join([
              "# Package Adjustment V6P1 Production Review",
              "",
              "**Status:** `HUMAN_DECISION_REQUIRED`",
              "",
              "The frozen C2 candidate passed its one-time preregistered "
              "prospective primary confirmation. This review does not change "
              "production.",
              "",
              "## Confirmation strength",
              "",
              f"- C1 log loss: **{primary['C1_equal_cell_macro_mean_log_loss']:.6f}**",
              f"- C2 log loss: **{primary['C2_equal_cell_macro_mean_log_loss']:.6f}**",
              f"- D = C2 - C1: **{primary['D_overall_C2_minus_C1']:+.6f}**",
              f"- Relative log-loss reduction: **{relative_log_loss_reduction * 100:.2f}%**",
              f"- One-sided 95% UCB: **{primary['uncertainty_gate']['upper_bound']:+.6f}**",
              f"- Bootstrap draws favoring C2: **{primary['crossed_cluster_uncertainty']['fraction_C2_better'] * 100:.2f}%**",
              f"- Cells favoring C2: **{cells_better}/24**",
              f"- Composition-profile point estimates favoring C2: **{profile_point_better}/6**",
              f"- Apex-level macro averages favoring C2: **{sum(x['mean_C2_minus_C1'] < 0 for x in apex_summary.values())}/4**",
              "",
              "## Mandatory safety diagnostics",
              "",
              "| Profile | D C2-C1 | 95% UCB | Eff votes | Voters |",
              "|---|---:|---:|---:|---:|",
              *safety_lines,
              "",
              "All six point estimates favor C2. Two profile-specific UCBs "
              "are below zero; four are individually inconclusive. The frozen "
              "contract explicitly treats these as descriptive diagnostics, "
              "not six additional confirmation gates.",
              "",
              "## Conservative production scope proposed for human review",
              "",
              "- Exact **1 player vs 3 players** only.",
              "- Player-only; no draft picks and no multi-vs-multi.",
              "- Same supported positions: QB/RB/WR/TE/DL/LB/DB.",
              "- Every package player must remain individually below the target FV.",
              "- Composition must remain within **0.040 absolute share** on every "
              "component of at least one frozen profile: 45/33/22, 50/30/20, "
              "50/25/25, 55/30/15, 60/25/15, 60/20/20.",
              "- Largest package piece / target FV must be within **0.035** of "
              "one of the frozen apex levels: 0.70, 0.80, 0.90, 0.97.",
              "- Anything outside that geometry fails closed with no V6 adjustment.",
              "- Existing size-2 V3/V5 behavior stays unchanged.",
              "",
              "## Production translation",
              "",
              "For three package values, let `S = sum(v)` and "
              "`P = (sum(v^q))^(1/q)` with "
              f"`q = {q}`. Use target multiplier `M = S/P`. Then the "
              "trade-verdict comparison `S` versus `target FV * M` is "
              "algebraically identical to the frozen C2 comparison `P` versus "
              "target FV.",
              "",
              f"- Frozen 504-challenge candidate multiplier range: "
              f"**{min(r['candidate_multiplier'] for r in challenge_rows):.4f}-"
              f"{max(r['candidate_multiplier'] for r in challenge_rows):.4f}**",
              f"- Current V1.6 size-3 envelope covers only **{current_supported}/504** "
              "of the frozen prospective challenges.",
              "- Translation property test: **PASS**.",
              "",
              "## Decision",
              "",
              "The candidate is eligible for explicit human production approval "
              "under the strict evidence-bounded scope above. No deployment has "
              "occurred.",
              "",
          ])
          OUT_MD.write_text(md, encoding="utf-8")

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "schema_version": 1,
              "status": "v6p1_production_review_manifest",
              "generated_at_utc": generated_at,
              "production_changed": False,
              "human_approval_required": True,
              "github_source_commit": os.environ.get("GITHUB_SHA"),
              "inputs": {
                  "development_candidate": {
                      "path": str(DEV_CANDIDATE_PATH),
                      "git_blob_sha": (
                          "446a176757919be3deef0659ac01e05884be4007"
                      ),
                      "sha256": sha256(DEV_CANDIDATE_PATH),
                  },
                  "prospective_evaluation": {
                      "path": str(RESULT_PATH),
                      "git_blob_sha": (
                          "7fd2a07f3bd9b9214e1293d50b867c7f023ab2d1"
                      ),
                      "sha256": sha256(RESULT_PATH),
                  },
                  "prospective_catalog": {
                      "path": str(CATALOG_PATH),
                      "git_blob_sha": (
                          "dd12608b1b5fee03da5965458d6e59284657dce3"
                      ),
                      "sha256": sha256(CATALOG_PATH),
                  },
                  "catalog_generator": {
                      "path": str(GENERATOR_PATH),
                      "git_blob_sha": (
                          "0688a462b8d06b57b6b5cdf3eb191dfae8eceb2e"
                      ),
                      "sha256": sha256(GENERATOR_PATH),
                  },
                  "frozen_exact_1800": {
                      "path": str(FREEZE_PATH),
                      "git_blob_sha": (
                          "a9d78303aaa659aed9864e8090f53d9c2e36bd9b"
                      ),
                      "sha256": sha256(FREEZE_PATH),
                  },
                  "current_live_deployment": {
                      "path": str(LIVE_PATH),
                      "git_blob_sha": (
                          "504ed7b67aec06d44d9e3512905c82ae6ca76fa4"
                      ),
                      "sha256": sha256(LIVE_PATH),
                  },
              },
              "outputs": {
                  "review_json": {
                      "path": str(OUT_JSON),
                      "sha256": sha256(OUT_JSON),
                  },
                  "review_markdown": {
                      "path": str(OUT_MD),
                      "sha256": sha256(OUT_MD),
                  },
              },
              "current_production_revision": (
                  "v1.6-v5-size2-composition-overlay"
              ),
              "next_action": review["next_action"],
          }

          OUT_MANIFEST.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(md)

          print(md)
          PY

      - name: Verify production review did not authorize or deploy
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "research/package-adjustment-v6/production_review_v1.json"
          )
          review = json.loads(p.read_text())

          assert review["status"] == (
              "v6p1_production_review_ready_human_decision_required"
          )
          assert review["production_changed"] is False
          assert review["production_change_authorized"] is False
          assert review["human_approval_required_before_deployment"] is True
          assert review["prospective_confirmation"]["primary_pass"] is True

          breadth = review["breadth_diagnostics"]
          assert breadth[
              "composition_profiles_with_favorable_point_estimate"
          ] == 6
          assert breadth["cells_with_favorable_C2_point_estimate"] == 22
          assert breadth["cell_count"] == 24
          assert all(
              x["mean_C2_minus_C1"] < 0
              for x in breadth["apex_level_diagnostics"].values()
          )

          scope = review["proposed_conservative_production_scope"]
          assert scope["player_only"] is True
          assert scope["draft_picks_allowed"] is False
          assert scope["multi_vs_multi_allowed"] is False
          assert scope["outside_scope_behavior"] == (
              "fail_closed_no_V6_adjustment"
          )
          assert scope["size2_behavior"] == (
              "retain_existing_V3_V5_unchanged"
          )

          translation = review[
              "production_translation_property_test"
          ]
          assert translation[
              "comparison_boundary_equivalence_pass"
          ] is True
          assert translation["positive_multiplier_pass"] is True

          print(
              "PASS: production review is evidence-bounded, "
              "non-deploying, and requires explicit human approval."
          )
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Verify production still remains V1.6 after review
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove exactly three intended review files changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v6/production_review_v1.json",
              "research/package-adjustment-v6/production_review_v1.md",
              "research/package-adjustment-v6/production_review_manifest_v1.json",
          }

          lines = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          ).splitlines()

          actual = {line[3:] for line in lines if line.strip()}
          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )

          print(
              "PASS: only the three intended V6P1 production-review "
              "files changed."
          )
          PY

      - name: Upload V6P1 production review artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v6p1-production-review
          path: |
            research/package-adjustment-v6/production_review_v1.json
            research/package-adjustment-v6/production_review_v1.md
            research/package-adjustment-v6/production_review_manifest_v1.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit V6P1 production review to main
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          REVIEW="$D/production_review_v1.json"
          SUMMARY="$D/production_review_v1.md"
          MANIFEST="$D/production_review_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$REVIEW" "$SUMMARY" "$MANIFEST"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=("$REVIEW" "$SUMMARY" "$MANIFEST")
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          test "${#STAGED[@]}" -eq 3
          test "$(printf '%s\n' "${STAGED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m \
            "Review Package Adjustment V6P1 for production"

          git pull --rebase origin main

          test "$(git hash-object "$D/development_candidate_v1.json")" = \
            "446a176757919be3deef0659ac01e05884be4007"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/prospective_exact_1800_frozen_v1.json")" = \
            "a9d78303aaa659aed9864e8090f53d9c2e36bd9b"
          test "$(git hash-object "$D/prospective_evaluation_v1.json")" = \
            "7fd2a07f3bd9b9214e1293d50b867c7f023ab2d1"

          mapfile -t COMMITTED < <(
            git diff-tree --no-commit-id --name-only -r HEAD | sort
          )

          test "${#COMMITTED[@]}" -eq 3
          test "$(printf '%s\n' "${COMMITTED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git push origin main

          echo \
            "PASS: V6P1 production review committed; production unchanged."
