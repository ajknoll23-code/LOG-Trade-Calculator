      - name: Prove B15 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b15_")
              or p.startswith("research/draft-capital-outlook-v1/archive/2027/2026-anchor/")
              for p in touched
          ),touched
          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B15 mutation scope is research-only.")
          PY

      - name: Commit B15 archive and source-feasibility result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B15."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b15_2027_source_catalog_frozen.json \
            research/draft-capital-outlook-v1/b15_2027_anchor_capture_ledger.json \
            research/draft-capital-outlook-v1/b15_2027_anchor_capture_summary.json \
            research/draft-capital-outlook-v1/b15_2027_anchor_capture_report.md \
            research/draft-capital-outlook-v1/b15_manifest.json \
            research/draft-capital-outlook-v1/archive/2027/2026-anchor/

          git commit -m "Capture 2027 Draft Capital Outlook anchor archive"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B15 archive committed."
