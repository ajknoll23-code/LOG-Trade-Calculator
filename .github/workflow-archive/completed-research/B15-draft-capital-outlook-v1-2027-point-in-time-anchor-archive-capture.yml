name: B15 Draft Capital Outlook V1 - 2027 Point-in-Time Anchor Archive Capture

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  capture:
    name: B15 capture frozen 2027 anchor source catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B15 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install capture dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact B14 V2 archive authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          R=Path("research/draft-class-strength-v2")
          A=Path("research/draft-capital-outlook-v1")

          rm=json.loads((R/"b14_v2_manifest.json").read_text())
          am=json.loads((A/"b14_v2_manifest.json").read_text())
          ap=json.loads((A/"b14_v2_2027_anchor_archive_preregistration.json").read_text())
          ledger=json.loads((A/"b14_v2_2027_anchor_archive_ledger_template.json").read_text())

          assert rm["decision"]=="CLOSE_B13_RESIDUAL_CHANNEL_AT_NEUTRAL_1_00_NO_REDESIGN_ON_2014_2023"
          assert rm["residual_channel_neutral_multiplier"]==1.0
          assert rm["draft_capital_outlook_v1_may_preregister_archive"] is True
          assert rm["predictor_fit_performed"] is False
          assert rm["2027_class_scored"] is False
          assert rm["production_change_authorized"] is False

          assert am["decision"]=="PASS_B14_V2_2027_ARCHIVE_PREREGISTRATION_FROZEN_B15_CAPTURE_NEXT"
          assert am["b15_capture_authorized"] is True
          assert am["c1_model_preregistration_authorized"] is False
          assert am["predictor_fit_performed"] is False
          assert am["2027_class_scored"] is False
          assert am["production_change_authorized"] is False

          expected_rm={
              "b14_v2_residual_channel_closeout.json":"bb8e488ebf4ccfd87e797f9429e4de1f9bb78ec1f56897d939400ae648d8cf2c",
              "b14_v2_residual_channel_closeout_report.md":"079d4da3afec793915ee0de43626f7a0dae1acb3a90be0754eb87035784ae6a6",
          }
          expected_am={
              "b14_v2_2027_anchor_archive_ledger_template.json":"6040d551b32869fe49aa60848c345ab240addff8c3f9f027228f22a0d5986a8a",
              "b14_v2_2027_anchor_archive_preregistration.json":"99c99d2f2c215649248c4e013f9b11e7ebfdca07f9572692dd910f8b0f8eca8a",
              "b14_v2_2027_anchor_archive_preregistration_report.md":"db8bfd44a40d7c4859cba851bbf8fe2af2a52a70dee76dc93f530ea73e11f147",
          }
          assert rm["output_hashes"]==expected_rm
          assert am["output_hashes"]==expected_am
          for name,expected in expected_rm.items():
              assert hashlib.sha256((R/name).read_bytes()).hexdigest()==expected
          for name,expected in expected_am.items():
              assert hashlib.sha256((A/name).read_bytes()).hexdigest()==expected

          assert ap["anchor_window"]["class_year"]==2027
          assert ap["anchor_window"]["window_start"]=="2026-09-15T00:00:00Z"
          assert ap["anchor_window"]["window_end"]=="2026-10-16T06:59:59Z"
          assert ap["anchor_window"]["capture_timestamp_required"] is True
          assert ap["anchor_window"]["raw_content_hash_required"] is True
          assert ap["b15_capture_protocol"]["authorized"] is True
          assert ap["b15_capture_protocol"]["raw_before_parse"] is True
          assert ap["b15_capture_protocol"]["no_future_accuracy_filter"] is True
          assert ap["b15_capture_protocol"]["no_outcome_reading"] is True
          assert ap["b15_capture_protocol"]["no_model_fit"] is True
          assert ap["b15_capture_protocol"]["no_2027_score"] is True
          assert ap["b15_capture_protocol"]["no_production_change"] is True
          assert ap["future_c1_boundary"]["c1_not_preregistered_by_b14_v2"] is True
          assert ap["future_c1_boundary"]["future_power_gate_required_before_any_confirmatory_execution"] is True

          assert ledger["sources"]==[]
          assert ledger["archive_complete"] is False
          assert ledger["b15_capture_required"] is True

          print("PASS: exact B14 V2 archive-only authority guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B15 source catalog and technical gate before network access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b15-freeze
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b15_pre_network_source_catalog_freeze",
              "frozen_before_network_access":True,
              "anchor_class_year":2027,
              "anchor_window_start":"2026-09-15T00:00:00Z",
              "anchor_window_end":"2026-10-16T06:59:59Z",

              "request_contract":{
                  "timeout_seconds":60,
                  "max_attempts":3,
                  "backoff_seconds":[0,3,9],
                  "allow_redirects":True,
                  "user_agent":"LOG-Draft-Capital-Outlook-B15/1.0 (+research archive; GitHub Actions)",
                  "accept":"text/html,application/json;q=0.9,*/*;q=0.5",
                  "accept_language":"en-US,en;q=0.9",
                  "minimum_raw_bytes_for_capture":500,
                  "raw_must_be_written_before_parse":True
              },

              "timestamp_evidence_contract":{
                  "source_marker_required":True,
                  "anchor_date_evidence_required_for_CAPTURED_status":True,
                  "accepted_anchor_date_regexes":[
                      r"2026-09-(?:1[5-9]|2[0-9]|30)",
                      r"(?:Sep|Sept|September)\.?\s+(?:1[5-9]|2[0-9]|30),?\s*2026",
                      r"9/(?:1[5-9]|2[0-9]|30)/26"
                  ],
