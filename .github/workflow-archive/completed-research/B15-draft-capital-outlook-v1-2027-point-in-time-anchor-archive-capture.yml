                  "minimum_distinct_domains_captured":4,
                  "required_category_coverage":[
                      "consensus_or_public_big_board",
                      "mock_draft_or_mock_consensus"
                  ],
                  "minimum_captured_consensus_or_big_board":2,
                  "minimum_captured_mock_draft_or_mock_consensus":2,
                  "community_devy_capture_required":False,
                  "failure_does_not_delete_archive":True,
                  "failure_decision":"STOP_B15_2027_ARCHIVE_COVERAGE_INSUFFICIENT_REVIEW_SOURCES",
                  "pass_decision":"PASS_B15_2027_ANCHOR_ARCHIVE_AUTHORIZE_B16_HISTORICAL_SNAPSHOT_FEASIBILITY_ONLY"
              },

              "sources":[
                  {
                      "source_id":"ultimate_big_board_2027",
                      "source_name":"Ultimate Big Board 2027 NFL Consensus Big Board",
                      "source_category":"consensus_or_public_big_board",
                      "retrieval_url":"https://ultimatebigboard.com/nfl/2027/big-board/",
                      "domain":"ultimatebigboard.com",
                      "required_markers":["2027 NFL Consensus Big Board"],
                      "notes":"Live consensus board. Capture as point-in-time snapshot only."
                  },
                  {
                      "source_id":"ultimate_mock_consensus_2027",
                      "source_name":"Ultimate Big Board 2027 NFL Mock Draft Consensus",
                      "source_category":"mock_draft_or_mock_consensus",
                      "retrieval_url":"https://ultimatebigboard.com/nfl/2027/",
                      "domain":"ultimatebigboard.com",
                      "required_markers":["2027 NFL Mock Draft Consensus"],
                      "notes":"Live mock-draft consensus. Separate page from the consensus big board."
                  },
                  {
                      "source_id":"mockpro_consensus_big_board_2027",
                      "source_name":"MockPro 2027 NFL Draft Consensus Big Board",
                      "source_category":"consensus_or_public_big_board",
                      "retrieval_url":"https://getmockpro.com/big-board",
                      "domain":"getmockpro.com",
                      "required_markers":["2027 NFL Draft Consensus Big Board"],
                      "notes":"Consensus board with dated update evidence."
                  },
                  {
                      "source_id":"scoutinggrade_big_board_2027",
                      "source_name":"Scouting Grade 2027 NFL Draft Big Board",
                      "source_category":"consensus_or_public_big_board",
                      "retrieval_url":"https://scoutinggrade.com/2027-nfl-draft-big-board",
                      "domain":"scoutinggrade.com",
                      "required_markers":["2027 NFL Draft","Big Board"],
                      "notes":"Independent big board with update-date evidence."
                  },
                  {
                      "source_id":"walterfootball_big_board_2027",
                      "source_name":"WalterFootball 2027 NFL Draft Big Board",
                      "source_category":"consensus_or_public_big_board",
                      "retrieval_url":"https://walterfootball.com/nfldraftbigboard2027.php",
                      "domain":"walterfootball.com",
                      "required_markers":["2027 NFL Draft Big Board"],
                      "notes":"Independent board with explicit updated date."
                  },
                  {
                      "source_id":"cbs_mock_hub_2027",
                      "source_name":"CBS Sports 2027 NFL Mock Draft",
                      "source_category":"mock_draft_or_mock_consensus",
                      "retrieval_url":"https://www.cbssports.com/nfl/draft/mock-draft/",
                      "domain":"cbssports.com",
                      "required_markers":["2027 NFL Mock Draft"],
                      "notes":"Current CBS mock-draft page with dated update evidence."
                  },
                  {
                      "source_id":"si_mock_2_0_2027",
                      "source_name":"Sports Illustrated 2027 NFL Mock Draft 2.0",
                      "source_category":"mock_draft_or_mock_consensus",
                      "retrieval_url":"https://www.si.com/nfl/2027-nfl-mock-draft-includes-seven-qbs-first-round-arch-manning",
                      "domain":"si.com",
                      "required_markers":["2027 NFL Mock Draft"],
                      "notes":"Published inside anchor window."
                  },
                  {
                      "source_id":"dynastyff_sf_mock_sep15_2027",
                      "source_name":"Fantasy for Real / DynastyFF 2027 SF Mock Draft Sep 15",
                      "source_category":"devy_or_dynasty_prospect_ranking",
                      "retrieval_url":"https://www.reddit.com/r/DynastyFF/comments/1wgz86k/2027_sf_mock_draft_2_its_time_to_start_2round/.json",
                      "domain":"reddit.com",
                      "required_markers":["2027 SF Mock Draft"],
                      "reddit_json":True,
                      "notes":"Timestamped community dynasty mock; archive only, no quality claim."
                  },
                  {
                      "source_id":"dynastyff_1qb_mock_sep23_2027",
                      "source_name":"Fantasy for Real / DynastyFF 2027 1QB Mock Draft Sep 23",
                      "source_category":"devy_or_dynasty_prospect_ranking",
                      "retrieval_url":"https://www.reddit.com/r/DynastyFF/comments/1wo4ttc/how_is_the_2027_rb_class_shaping_up_tooearly/.json",
                      "domain":"reddit.com",
                      "required_markers":["2027"],
                      "reddit_json":True,
                      "notes":"Timestamped community dynasty mock; archive only, no quality claim."
                  }
              ],

              "selection_firewall":{
                  "catalog_n":9,
                  "all_cataloged_sources_attempted":True,
                  "no_source_may_be_removed_after_capture_based_on_content":True,
                  "no_source_weighting":True,
                  "no_future_accuracy_filter":True,
                  "no_outcome_filter":True,
                  "no_2027_score_filter":True,
                  "no_model_fit":True,
                  "no_production_change":True
              }
          }

          p=Path("/tmp/b15-freeze/b15_source_catalog_frozen.json")
          p.write_text(json.dumps(catalog,indent=2,sort_keys=True)+"\n")
          assert len(catalog["sources"])==catalog["selection_firewall"]["catalog_n"]==9
          print("PASS: B15 catalog of 9 sources frozen before network access.")
          PY

      - name: Verify capture occurs inside frozen anchor window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          cat=json.loads(Path("/tmp/b15-freeze/b15_source_catalog_frozen.json").read_text())
          now=datetime.now(timezone.utc)
          lo=datetime.fromisoformat(cat["anchor_window_start"].replace("Z","+00:00"))
          hi=datetime.fromisoformat(cat["anchor_window_end"].replace("Z","+00:00"))
          assert lo<=now<=hi,(now.isoformat(),lo.isoformat(),hi.isoformat())
          Path("/tmp/b15-freeze/capture_clock.json").write_text(
              json.dumps({
                  "capture_clock_utc":now.isoformat(),
                  "inside_anchor_window":True,
                  "window_start":cat["anchor_window_start"],
                  "window_end":cat["anchor_window_end"]
              },indent=2,sort_keys=True)+"\n"
          )
          print("PASS: runner clock is inside the preregistered 2027 anchor window.")
          PY

      - name: Capture every frozen source raw response before parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          import requests

          ROOT=Path("research/draft-capital-outlook-v1")
          ARCH=ROOT/"archive/2027/2026-anchor"
          RAW=ARCH/"raw"
          PARSED=ARCH/"parsed"
          META=ARCH/"metadata"
          for p in (RAW,PARSED,META):
              p.mkdir(parents=True,exist_ok=True)

          cat=json.loads(Path("/tmp/b15-freeze/b15_source_catalog_frozen.json").read_text())
          req=cat["request_contract"]
          date_regexes=[re.compile(x,re.I) for x in cat["timestamp_evidence_contract"]["accepted_anchor_date_regexes"]]

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip=0
                  self.parts=[]
                  self.title_parts=[]
                  self.in_title=False
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower()
                  if tag in {"script","style","noscript","svg"}:
                      self.skip+=1
                  if tag=="title":
                      self.in_title=True
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if tag in {"script","style","noscript","svg"} and self.skip:
                      self.skip-=1
                  if tag=="title":
                      self.in_title=False
              def handle_data(self,data):
                  if self.skip:
                      return
                  s=" ".join(str(data).split())
                  if not s:
                      return
                  self.parts.append(s)
                  if self.in_title:
                      self.title_parts.append(s)

          def sha_bytes(b:bytes)->str:
              return hashlib.sha256(b).hexdigest()

          def safe_text(raw:bytes,encoding:str|None)->str:
              enc=encoding or "utf-8"
              try:
                  return raw.decode(enc,errors="replace")
              except LookupError:
                  return raw.decode("utf-8",errors="replace")

          def extract_html(text:str):
              h=VisibleText()
              try:
                  h.feed(text)
              except Exception:
                  pass
              visible="\n".join(h.parts)
              title=" ".join(h.title_parts)[:500] or None
              return title,visible

          def extract_reddit(obj):
              title=None
              body_parts=[]
              created=None
              try:
                  post=obj[0]["data"]["children"][0]["data"]
                  title=str(post.get("title") or "")
                  body_parts=[title,str(post.get("selftext") or "")]
                  created=float(post.get("created_utc")) if post.get("created_utc") is not None else None
              except Exception:
                  body_parts=[json.dumps(obj,ensure_ascii=False)]
              return title,"\n".join(body_parts),created

          def publication_evidence(text,created_utc=None):
              evidence=[]
              if created_utc is not None:
                  dt=datetime.fromtimestamp(created_utc,tz=timezone.utc)
                  if datetime(2026,9,15,tzinfo=timezone.utc)<=dt<=datetime(2026,10,16,6,59,59,tzinfo=timezone.utc):
                      evidence.append({
                          "type":"reddit_created_utc",
                          "value":created_utc,
                          "iso_utc":dt.isoformat()
                      })
              for rx in date_regexes:
                  m=rx.search(text)
                  if m:
                      evidence.append({"type":"page_text_date","value":m.group(0)})
              # Also inspect common JSON-LD/meta forms with ISO timestamps.
              for m in re.finditer(r'20(?:26)-09-(?:1[5-9]|2[0-9]|30)T[0-9:.\-+Z]+',text,re.I):
                  evidence.append({"type":"embedded_iso_datetime","value":m.group(0)[:80]})
                  if len(evidence)>=10:
                      break
              return evidence[:10]

          def candidate_fragments(visible):
              frags=[]
              seen=set()
              for rawline in visible.splitlines():
                  line=" ".join(rawline.split())
                  if not line or len(line)<4:
                      continue
                  if re.search(r"\b(QB|RB|WR|TE)\b",line,re.I) and (
                      re.search(r"\b(?:[1-9]|[1-9][0-9]|1[0-9]{2})\b",line)
                      or re.search(r"\b(?:1\.\d{2}|2\.\d{2}|Round\s+[1-7]|Pick)\b",line,re.I)
                  ):
                      line=line[:700]
                      if line not in seen:
                          seen.add(line);frags.append(line)
                  if len(frags)>=250:
                      break
              return frags

          session=requests.Session()
          session.headers.update({
              "User-Agent":req["user_agent"],
              "Accept":req["accept"],
              "Accept-Language":req["accept_language"],
              "Accept-Encoding":"identity"
          })

          ledger=[]
          capture_started=datetime.now(timezone.utc).isoformat()

          for src in cat["sources"]:
              sid=src["source_id"]
              url=src["retrieval_url"]
              attempts=[]
              response=None
              error=None

              for attempt in range(int(req["max_attempts"])):
                  delay=req["backoff_seconds"][attempt]
                  if delay:
                      time.sleep(delay)
                  try:
                      t0=time.time()
                      response=session.get(
                          url,
                          timeout=float(req["timeout_seconds"]),
                          allow_redirects=bool(req["allow_redirects"])
                      )
                      attempts.append({
                          "attempt":attempt+1,
                          "status_code":response.status_code,
                          "elapsed_seconds":round(time.time()-t0,3),
                          "final_url":response.url
                      })
                      if response.status_code not in {429,500,502,503,504}:
                          break
                  except Exception as e:
                      error=f"{type(e).__name__}: {e}"
                      attempts.append({"attempt":attempt+1,"error":error})

              captured_at=datetime.now(timezone.utc).isoformat()
              raw=b""
              status="UNAVAILABLE"
              http_status=None
              final_url=None
              headers={}
              raw_path=None
              raw_sha=None
              parsed_path=None
              parsed_sha=None
              publication=[]
              marker_hits=[]
              title=None
              fragments=[]
              content_type=None
              parser_version="b15_visible_text_fragments_v1"

              if response is not None:
                  http_status=int(response.status_code)
                  final_url=response.url
                  content_type=response.headers.get("content-type")
                  headers={
                      k:v for k,v in response.headers.items()
                      if k.lower() in {
                          "content-type","content-length","last-modified","etag",
                          "date","cache-control","location"
                      }
                  }
                  raw=response.content or b""

                  suffix=".json" if src.get("reddit_json") else ".html"
                  raw_file=RAW/f"{sid}{suffix}"
                  # REQUIRED ORDER: durable raw write happens before any parse.
                  raw_file.write_bytes(raw)
                  raw_path=str(raw_file)
                  raw_sha=sha_bytes(raw)

                  text=safe_text(raw,response.encoding)
                  visible=text
                  reddit_created=None

                  if src.get("reddit_json"):
                      try:
                          obj=json.loads(text)
                          title,visible,reddit_created=extract_reddit(obj)
                      except Exception:
                          title=None
                          visible=text
                  else:
                      title,visible=extract_html(text)

                  marker_hits=[
                      marker for marker in src["required_markers"]
                      if marker.lower() in visible.lower() or marker.lower() in text.lower()
                  ]
                  publication=publication_evidence(text+"\n"+visible,reddit_created)
                  fragments=candidate_fragments(visible)

                  parsed={
                      "schema_version":1,
                      "study_id":"draft-capital-outlook-v1",
                      "stage":"b15_source_parse",
                      "source_id":sid,
                      "source_name":src["source_name"],
                      "source_category":src["source_category"],
                      "capture_timestamp_utc":captured_at,
                      "retrieval_url":url,
                      "final_url":final_url,
                      "http_status":http_status,
                      "title":title,
                      "required_markers":src["required_markers"],
                      "marker_hits":marker_hits,
                      "publication_evidence":publication,
                      "candidate_fragments":fragments,
                      "candidate_fragment_n":len(fragments),
                      "parser_version":parser_version,
                      "raw_sha256":raw_sha,
                      "predictor_fit_performed":False,
                      "2027_class_scored":False,
                      "production_change_authorized":False
                  }
                  parsed_file=PARSED/f"{sid}.json"
                  parsed_file.write_text(json.dumps(parsed,indent=2,sort_keys=True)+"\n")
                  parsed_path=str(parsed_file)
                  parsed_sha=hashlib.sha256(parsed_file.read_bytes()).hexdigest()

                  enough_bytes=len(raw)>=int(req["minimum_raw_bytes_for_capture"])
                  markers_ok=len(marker_hits)==len(src["required_markers"])
                  timestamp_ok=bool(publication)

                  if http_status in {401,403,429}:
                      status="BLOCKED"
                  elif 200<=http_status<300 and enough_bytes and markers_ok and timestamp_ok:
                      status="CAPTURED"
                  elif 200<=http_status<300 and enough_bytes and markers_ok and not timestamp_ok:
                      status="NO_TIMESTAMP_EVIDENCE"
                  elif 200<=http_status<300 and enough_bytes and not markers_ok:
                      status="NOT_REPRODUCIBLE"
                  else:
                      status="UNAVAILABLE"

              meta={
                  "schema_version":1,
                  "source_id":sid,
                  "capture_timestamp_utc":captured_at,
                  "attempts":attempts,
                  "http_status":http_status,
                  "final_url":final_url,
                  "response_headers_subset":headers,
                  "content_type":content_type,
                  "raw_bytes":len(raw),
                  "error":error
              }
              meta_file=META/f"{sid}.json"
              meta_file.write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")

              ledger.append({
                  "source_id":sid,
                  "source_name":src["source_name"],
                  "source_category":src["source_category"],
                  "domain":src["domain"],
                  "retrieval_url":url,
                  "capture_timestamp_utc":captured_at,
                  "publication_timestamp_or_date":publication,
                  "raw_file_path":raw_path,
                  "raw_sha256":raw_sha,
                  "parser_version":parser_version if parsed_path else None,
                  "parsed_file_path":parsed_path,
                  "parsed_sha256":parsed_sha,
                  "capture_status":status,
                  "drop_reason_if_any":None if status=="CAPTURED" else (
                      error or f"http={http_status}; markers={len(marker_hits)}/{len(src['required_markers'])}; timestamp_evidence={bool(publication)}; bytes={len(raw)}"
                  ),
                  "http_status":http_status,
                  "final_url":final_url,
                  "marker_hits":marker_hits,
                  "candidate_fragment_n":len(fragments),
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              })

          # Every frozen source MUST appear exactly once even when blocked.
          assert len(ledger)==len(cat["sources"])==9
          assert {x["source_id"] for x in ledger}=={x["source_id"] for x in cat["sources"]}

          # Copy the pre-network catalog and clock into the archive.
          (ARCH/"b15_source_catalog_frozen.json").write_bytes(
              Path("/tmp/b15-freeze/b15_source_catalog_frozen.json").read_bytes()
          )
          (ARCH/"b15_capture_clock.json").write_bytes(
              Path("/tmp/b15-freeze/capture_clock.json").read_bytes()
          )

          out={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b15_2027_anchor_capture_ledger",
              "anchor_class_year":2027,
              "anchor_window_start":cat["anchor_window_start"],
              "anchor_window_end":cat["anchor_window_end"],
              "capture_started_utc":capture_started,
              "capture_finished_utc":datetime.now(timezone.utc).isoformat(),
              "catalog_n":len(cat["sources"]),
              "all_cataloged_sources_attempted":True,
              "sources":ledger,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          Path("/tmp/b15_capture_ledger.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "catalog_n":len(ledger),
              "captured_n":sum(x["capture_status"]=="CAPTURED" for x in ledger),
              "statuses":{s:sum(x["capture_status"]==s for x in ledger) for s in sorted({x["capture_status"] for x in ledger})}
          },indent=2))
          PY

      - name: Apply frozen B15 technical archive gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path

          cat=json.loads(Path("/tmp/b15-freeze/b15_source_catalog_frozen.json").read_text())
          led=json.loads(Path("/tmp/b15_capture_ledger.json").read_text())
          gate=cat["technical_gate"]

          captured=[x for x in led["sources"] if x["capture_status"]=="CAPTURED"]
          bycat=Counter(x["source_category"] for x in captured)
          domains=sorted({x["domain"] for x in captured})

          components={
              "minimum_captured_sources":len(captured)>=int(gate["minimum_captured_sources"]),
              "minimum_distinct_domains_captured":len(domains)>=int(gate["minimum_distinct_domains_captured"]),
              "required_category_coverage":all(bycat[c]>=1 for c in gate["required_category_coverage"]),
              "minimum_captured_consensus_or_big_board":bycat["consensus_or_public_big_board"]>=int(gate["minimum_captured_consensus_or_big_board"]),
              "minimum_captured_mock_draft_or_mock_consensus":bycat["mock_draft_or_mock_consensus"]>=int(gate["minimum_captured_mock_draft_or_mock_consensus"]),
          }
          passed=all(components.values())
          decision=gate["pass_decision"] if passed else gate["failure_decision"]

          summary={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b15_2027_anchor_capture_summary",
              "decision":decision,
              "technical_gate_pass":passed,
              "gate_components":components,
              "catalog_n":led["catalog_n"],
              "captured_n":len(captured),
              "captured_source_ids":[x["source_id"] for x in captured],
              "captured_distinct_domains":domains,
              "captured_distinct_domain_n":len(domains),
              "captured_by_category":dict(sorted(bycat.items())),
              "status_counts":dict(sorted(Counter(x["capture_status"] for x in led["sources"]).items())),
              "b16_historical_snapshot_feasibility_authorized":passed,
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "scientific_note":"Passing B15 proves only that the 2027 anchor snapshot was preserved with adequate source diversity. It does not validate a forecast model or a production multiplier."
          }

          D=Path("research/draft-capital-outlook-v1")
          (D/"b15_2027_anchor_capture_ledger.json").write_bytes(
              Path("/tmp/b15_capture_ledger.json").read_bytes()
          )
          (D/"b15_2027_anchor_capture_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          (D/"b15_2027_source_catalog_frozen.json").write_bytes(
              Path("/tmp/b15-freeze/b15_source_catalog_frozen.json").read_bytes()
          )

          print(json.dumps(summary,indent=2))
          PY

      - name: Validate B15 raw-before-parse archive integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          A=D/"archive/2027/2026-anchor"
          cat=json.loads((D/"b15_2027_source_catalog_frozen.json").read_text())
          led=json.loads((D/"b15_2027_anchor_capture_ledger.json").read_text())
          summ=json.loads((D/"b15_2027_anchor_capture_summary.json").read_text())

          assert cat["frozen_before_network_access"] is True
          assert cat["selection_firewall"]["catalog_n"]==9
          assert led["catalog_n"]==9
          assert led["all_cataloged_sources_attempted"] is True
          assert len(led["sources"])==9
          assert len({x["source_id"] for x in led["sources"]})==9

          for x in led["sources"]:
              assert x["predictor_fit_performed"] is False
              assert x["2027_class_scored"] is False
              assert x["production_change_authorized"] is False

              if x["raw_file_path"]:
                  p=Path(x["raw_file_path"])
                  assert p.is_file(),p
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==x["raw_sha256"],x["source_id"]
              if x["parsed_file_path"]:
                  p=Path(x["parsed_file_path"])
                  assert p.is_file(),p
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==x["parsed_sha256"],x["source_id"]
                  pj=json.loads(p.read_text())
                  assert pj["raw_sha256"]==x["raw_sha256"]
                  assert pj["capture_timestamp_utc"]==x["capture_timestamp_utc"]

              assert x["capture_status"] in {
                  "CAPTURED","UNAVAILABLE","BLOCKED","NO_TIMESTAMP_EVIDENCE",
                  "OUTSIDE_ANCHOR_WINDOW","NOT_REPRODUCIBLE"
              }

          # Scientific boundary remains fixed regardless of technical PASS/STOP.
          assert summ["c1_model_preregistration_authorized"] is False
          assert summ["predictor_fit_performed"] is False
          assert summ["2027_class_scored"] is False
          assert summ["production_change_authorized"] is False

          if summ["technical_gate_pass"]:
              assert summ["decision"]=="PASS_B15_2027_ANCHOR_ARCHIVE_AUTHORIZE_B16_HISTORICAL_SNAPSHOT_FEASIBILITY_ONLY"
              assert summ["b16_historical_snapshot_feasibility_authorized"] is True
          else:
              assert summ["decision"]=="STOP_B15_2027_ARCHIVE_COVERAGE_INSUFFICIENT_REVIEW_SOURCES"
              assert summ["b16_historical_snapshot_feasibility_authorized"] is False

          print("PASS: B15 archive hashes, parse lineage, and authority boundaries validated.")
          PY

      - name: Freeze B15 manifest and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          s=json.loads((D/"b15_2027_anchor_capture_summary.json").read_text())

          report=[
              "# Draft Capital Outlook V1 — B15 2027 Anchor Archive Capture",
              "",
              "## Decision",
              "",
              s["decision"],
              "",
              f'- Cataloged sources: {s["catalog_n"]}',
              f'- Captured sources: {s["captured_n"]}',
              f'- Distinct captured domains: {s["captured_distinct_domain_n"]}',
              f'- Captured by category: {s["captured_by_category"]}',
              f'- Status counts: {s["status_counts"]}',
              "",
              "## Authority",
              "",
              f'- B16 historical snapshot feasibility authorized: {s["b16_historical_snapshot_feasibility_authorized"]}',
              "- C1 model preregistration authorized: false",
              "- Predictor fitting performed: false",
              "- 2027 class scored: false",
              "- Production change authorized: false",
              "",
              "B15 is a data-preservation and source-feasibility stage only.",
              ""
          ]
          (D/"b15_2027_anchor_capture_report.md").write_text("\n".join(report))

          outputs=[
              "b15_2027_source_catalog_frozen.json",
              "b15_2027_anchor_capture_ledger.json",
              "b15_2027_anchor_capture_summary.json",
              "b15_2027_anchor_capture_report.md",
          ]

          # Include every archived raw/parsed/metadata file in the manifest hash map.
          archive_files=sorted(
              p for p in (D/"archive/2027/2026-anchor").rglob("*")
              if p.is_file()
          )
          hashes={n:hashlib.sha256((D/n).read_bytes()).hexdigest() for n in outputs}
          hashes.update({
              str(p.relative_to(D)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in archive_files
          })

          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b15_manifest",
              "decision":s["decision"],
              "technical_gate_pass":s["technical_gate_pass"],
              "output_hashes":hashes,
              "captured_n":s["captured_n"],
              "b16_historical_snapshot_feasibility_authorized":s["b16_historical_snapshot_feasibility_authorized"],
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b15_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("PASS: B15 manifest frozen.")
          PY

      - name: Run post-B15 repository regression
