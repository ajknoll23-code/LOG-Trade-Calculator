name: QF11 V18 - Seven Identity Evidence and Ballot Realism Owner Gate (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V18_ROOT: .
  QF11_V18_INPUT: /tmp/qf11-v18-input
  QF11_V18_OUTPUT: /tmp/qf11-v18-output
jobs:
  research:
    name: Review independently pinned seven identities and tentative KTC ballot realism without activation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin frozen valuation model crosswalk and market source (mutable Sleeper cache observed only)
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_WRONG_COMMIT; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        # data/players_cache.json is updated independently by scheduled Sleeper refresh.
        # V18 does NOT consume that mutable cache for identity adjudication; record its
        # checked-out blob SHA for reproducibility but never interpret drift as clearance.
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_ABSENT; exit 1; }
        printf 'QF11_V18_DYNAMIC_CACHE_OBSERVED %s\n' "$(git hash-object data/players_cache.json)"
        echo QF11_V18_FROZEN_SOURCE_PINS_GREEN
    - name: Download original V14 Green exact global options
      uses: actions/download-artifact@v4
      with:
        name: QF11-v14-RESEARCH-ONLY-conditional-global-options
        run-id: 38310177563
        github-token: ${{ github.token }}
        path: /tmp/qf11-v18-input/v14
    - name: Download original V16 Green seven identity evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v16-RESEARCH-ONLY-owner-identity-and-TE-choice
        run-id: 38313026848
        github-token: ${{ github.token }}
        path: /tmp/qf11-v18-input/v16
    - name: Download V17 owner-selected tentative trio evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v17-RESEARCH-ONLY-owner-tentative-TE-selection
        run-id: 38315206531
        github-token: ${{ github.token }}
        path: /tmp/qf11-v18-input/v17
    - name: Verify pinned archive and exact model positions and write seven-ID and realism decision packet
      shell: bash
      run: |
        set -euo pipefail
        cat > /tmp/qf11-v18-owner-gates.py <<'PY_V18_MAIN'
        #!/usr/bin/env python3
        """QF11 V18 evidence-only seven-identity and KTC realism owner gate.
        Nothing in this program approves release, changes sources, or creates voter links.
        """
        import collections
        import hashlib
        import json
        import os
        import re
        import sys
        from pathlib import Path

        FIXTURE = '--fixture' in sys.argv
        HERE = Path(os.environ.get('QF11_V18_INPUT', '/tmp/qf11-v18-input'))
        OUT = Path(os.environ.get('QF11_V18_OUTPUT', '/tmp/qf11-v18-output'))
        ROOT = Path(os.environ.get('QF11_V18_ROOT', '.'))
        OUT.mkdir(parents=True, exist_ok=True)

        PINS = {
            'v17_selection': ('v17/RESEARCH_ONLY_v17_tentative_owner_selection.json', '046a752fd319dd942af1593631aaddd998c5f9f242a4536adfc3237e4ba69465'),
            'v16_seven': ('v16/RESEARCH_ONLY_v16_seven_identity_review.json', '9e39c89b670b39e3283f38f469cdceed86b96e78980edac47e177a894ea2aa63'),
            'v16_summary': ('v16/RESEARCH_ONLY_v16_owner_gate_summary.json', '18deae02052106440c9e4f8475693379ce77c281120d00189e8f5cd7ace8d09d'),
            'v14_choice': ('v14/RESEARCH_ONLY_v14_owner_choice_matrix.json', '903cac50818e9e9b8255b4d9b00de014b01a772dfe654ea431de704d732dec0f'),
        }
        archive = {}
        for key, (relative, expected) in PINS.items():
            p = HERE / relative
            assert p.is_file(), 'STOP_MISSING_ARCHIVED_EVIDENCE_' + key
            actual = hashlib.sha256(p.read_bytes()).hexdigest()
            assert actual == expected, 'STOP_ARCHIVE_DRIFT_' + key
            archive[key] = json.loads(p.read_text())

        v17 = archive['v17_selection']
        v16 = archive['v16_seven']
        v16sum = archive['v16_summary']
        v14 = archive['v14_choice']
        TRIO = ['brock bowers', 'tyler warren', 'treveyon henderson']
        assert v17['selected_player_keys'] == TRIO
        assert v17['status'] == 'OWNER_TENTATIVE_RESEARCH_CANDIDATE_RECORDED_NOT_VOTE_APPROVAL'
        assert v17['owner_tentative_research_selection_approved'] is True
        assert v17['fv_ratio_descriptive'] == 1.182106
        assert v17['with_research_slot11_conditional_slots'] == 26
        assert v17['identity_holds_cleared'] == 0
        assert v17['unresolved_original_slots'] == [5, 21]
        for key in ('ballot_activated', 'voting_activated', 'production_change_authorized',
                    'owner_identity_clearance_approved', 'owner_voter_issuance_approved',
                    'owner_market_value_promotion_approved', 'independent_voter_assignment_completed',
                    'preregistered_stability_and_recruitment_approved'):
            assert v17[key] is False, 'STOP_PREVIOUS_GATE_NOT_FROZEN_' + key
        assert v16sum['seven_identity_holds'] == 7 and v16sum['distinct_te_pairs'] == 3
        assert v16sum['identity_auto_cleared'] is False and v16sum['voting_activated'] is False
        cases = v16['identity_cases']
        if not FIXTURE:
            from scripts.validation.snapshot_values import extract_object_body
            html = (ROOT / 'index.html').read_text()
            body = extract_object_body(html, 'PLAYER_DB')
            model_rows = {name:{'pos':pos, 'team':team}
                          for name, pos, team in re.findall(
                          r"'([^']+)':\{pos:'([A-Z]+)',age:\d+,role:'[^']+',team:'([^']+)'", body)}
            assert len(model_rows) >= 500, 'STOP_MODEL_EXTRACTION_CHANGED'
            for record in cases:
                expected = {'pos':record['model_pos'], 'team':record['model_team']}
                assert model_rows.get(record['player']) == expected, 'STOP_FROZEN_MODEL_ROLE_TEAM_DRIFT_' + record['player']
        expected_players = set(v17['seven_identity_holds'])
        assert len(cases) == 7 and set(x['player'] for x in cases) == expected_players
        assert len(v14['all_global_26_candidates_no_owner_approval']) == 191
        choices = [x for x in v14['all_global_26_candidates_no_owner_approval'] if x['players'] == TRIO]
        assert len(choices) == 1, 'STOP_OWNER_CANDIDATE_NOT_UNIQUE_IN_FROZEN_V14'
        chosen = choices[0]
        assert chosen['candidate_26_slot_globally_consistent'] is True
        assert chosen['theoretical_28_slot_if_individual_identity_holds_cleared'] is True
        assert chosen['third_position'] == 'RB'
        assert chosen['fv_ratio'] == 1.182106
        assert [v17['direct_ballots_descriptive_not_new_votes'][k] for k in
                ('pair1_direct_ballots', 'pair2_direct_ballots', 'third_direct_ballots')] == [7, 4, 9]

        # Crosswalk is evidence, not truth or an authority for league-specific position.
        # The same archived V16 categories must still hold; changes require a NEW study.
        if FIXTURE:
            crosswalk = []
            for c in cases:
                for obs in c['exact_name_source_observations']:
                    crosswalk.append({
                        'name': obs['source_name'],
                        'fantasypros_id': 999999,
                        'sleeper_id': 'fixture-id' if obs['sleeper_id_present'] else None,
                        'fp_position': obs['source_fp_position'],
                        'sleeper_pos': obs['source_sleeper_position'],
                        'fp_team': obs['source_fp_team'],
                        'sleeper_team': obs['source_sleeper_team'],
                    })
            crosswalk += [
                {'name':'James Cook III','fantasypros_id':999998,'sleeper_id':None,'fp_position':'RB','sleeper_pos':None,'fp_team':'BUF','sleeper_team':None},
                {'name':'Will Anderson Jr.','fantasypros_id':999997,'sleeper_id':None,'fp_position':'DL','sleeper_pos':None,'fp_team':'HOU','sleeper_team':None},
            ]
        else:
            crosswalk = json.loads((ROOT / 'scripts/identity_crosswalk.json').read_text())
            assert isinstance(crosswalk, list) and len(crosswalk) > 150

        def normalize(name):
            return re.sub(r'\s+', ' ', str(name or '').strip().lower())

        def summary(row):
            return {k: row.get(k) for k in ('name','fantasypros_id','sleeper_id','fp_position','sleeper_pos','fp_team','sleeper_team')}

        identity_rows = []
        for c in cases:
            key = c['player']
            exact = [x for x in crosswalk if normalize(x.get('name')) == key]
            assert len(exact) == c['strict_name_matches_in_current_pinned_crosswalk'], 'STOP_EXACT_CROSSWALK_COUNT_CHANGED_' + key
            observed = sorted([{
                'source_name': r.get('name'),
                'source_fp_position': r.get('fp_position'),
                'source_sleeper_position': r.get('sleeper_pos'),
                'source_fp_team': r.get('fp_team'),
                'source_sleeper_team': r.get('sleeper_team'),
                'sleeper_id_present': bool(r.get('sleeper_id')),
            } for r in exact], key=lambda r: str(r['source_name']))
            assert observed == sorted(c['exact_name_source_observations'], key=lambda r: str(r['source_name'])), 'STOP_CROSSWALK_SOURCE_OBSERVATION_DRIFT_' + key
            suggestions = []
            # Only known name variants from frozen V11; no fuzzy search or auto alias registration.
            for name in c['archived_v11_source_names']:
                for row in crosswalk:
                    if normalize(row.get('name')) == normalize(name) and normalize(name) != key:
                        suggestions.append(summary(row))
            exact_evidence = [summary(r) for r in exact]
            identity_rows.append({
                'player': key, 'model_pos': c['model_pos'], 'model_team': c['model_team'],
                'hold_class': c['category'], 'exact_crosswalk_evidence': exact_evidence,
                'archived_name_variant_evidence': suggestions,
                'archived_v11_resolution': c['archived_v11_resolution'],
                'owner_action': c['owner_review_action'],
                'stable_id_in_current_exact_crosswalk': [str(x['sleeper_id']) for x in exact_evidence if x['sleeper_id']],
                'evidence_not_identity_signoff': True, 'identity_cleared': False,
                'cannot_use_for_voter_release': True,
            })
        assert collections.Counter(x['hold_class'] for x in identity_rows) == {
            'NO_EXACT_CROSSWALK_NAME':3, 'POSITION_TAXONOMY_CONFLICT':3, 'TEAM_OR_TEAM_CODE_CONFLICT':1
        }

        # Distinguish reproducibility of value ratio from human respondent realism.
        third_pos_counts = dict(sorted(collections.Counter(x['third_position'] for x in v14['all_global_26_candidates_no_owner_approval'] if x['players'][:2] == TRIO[:2]).items()))
        choice_review = {
            'status': 'OWNER_RESEARCH_SELECTION_RETAINED_REALISM_NOT_APPROVED',
            'trio': TRIO,
            'ratio': chosen['fv_ratio'], 'three_way_comparison': {'te_pair_same_position':True, 'third_player_different_position':'RB'},
            'direct_historical_ballots_descriptive_only': v17['direct_ballots_descriptive_not_new_votes'],
            'same_te_pair_third_position_variation_counts': third_pos_counts,
            'respondent_comprehension_review_completed': False,
            'actual_voter_sample_size_planned_and_approved': False,
            'question_order_randomization_preregistered': False,
            'voter_coverage_independence_preregistered': False,
            'exposure_cap_and_per_player_balance_preregistered': False,
            'prospective_holdout_and_stopping_rules_preregistered': False,
            'final_28_ballot_catalog_approved': False,
            'source_linkage_to_oct_07_market_values_proven': False,
            'voter_issuance_approved': False, 'voting_activated': False,
            'no_new_votes': True, 'no_model_or_market_changes': True,
            'owner_followup': 'Decide whether this particular KTC keep-trade-cut trio is realistic for respondents, with a written scientific plan before any actual ballots.',
        }
        identity_packet = {
            'status': 'SEVEN_IDENTITY_HOLDS_STILL_NEED_INDEPENDENT_OWNER_AND_SOURCE_ADJUDICATION',
            'source_fixture': FIXTURE, 'seven_cases': identity_rows,
            'original_slots_held': [5,21], 'existing_conditional_priority_slots':[1,8,12,15],
            'cleared_count': 0, 'identity_reclassification_authorized': False,
            'owner_identity_signoff': False, 'voting_activated': False, 'no_repo_mutation': True,
            'source_sha256': {k:v[1] for k,v in PINS.items()},
        }
        (OUT/'RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json').write_text(json.dumps(identity_packet,indent=2,sort_keys=True)+'\n')
        (OUT/'RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json').write_text(json.dumps(choice_review,indent=2,sort_keys=True)+'\n')
        lines = [
            '# QF11 V18 — Evidence-separated identity adjudication and selected-ballot realism',
            '', '**RESEARCH ONLY: stop before any voter links, ballot allocations, market repricing or production updates.**',
            '', '## Tentative slot 11',
            '- **Brock Bowers / Tyler Warren / TreVeyon Henderson** remains the owner-selected research-only candidate.',
            f"- Archived FV comparability ratio: **{chosen['fv_ratio']}**; descriptive historical direct ballot counts: **7 / 4 / 9**.",
            '- Mechanics do not establish respondent realism. No independent pilot comprehension or prospective voter review has been done.',
            '- **26 conditional slots** only; 28 remains blocked by original held slots 5 and 21.',
            '', '## Frozen identity holds (zero cleared)',
            '| Model player | Position / team | Case | Stable ID in exact crosswalk | Required decision |',
            '|---|---|---|---|---|',
        ]
        for row in identity_rows:
            stable = ', '.join(row['stable_id_in_current_exact_crosswalk']) or 'Missing on exact model name'
            lines.append(f"| {row['player']} | {row['model_pos']} / {row['model_team']} | {row['hold_class']} | {stable} | {row['owner_action']} |")
        lines += [
            '', '## Required next decisions before ballot release',
            '1. Verify exact player identity and stable ID from an independent league/source reference for all seven held names; do not accept suffix stripping as a proof.',
            '2. Resolve league-specific DL/LB/DB eligibility for Byron Young, Jaylon Carlies, and Micah Parsons, and the dated Malik Willis team conflict, without rewriting frozen model values.',
            '3. Review whether Bowers/Warren/Henderson is a realistic, clear Keep/Trade/Cut ballot rather than merely close on FV.',
            '4. Preregister voter independence, randomized display order, exposure caps, slot coverage, sample size, stopping rules and prospective holdout before creating any link.',
            '5. Recompute all 28 slots after actual identity decisions; do not treat conditional compatibility as approval.',
            '', '## Explicit safeguards',
            '- No automatic identity clearance. No live votes collected. No Market Value backfill. No production/model edits.',
            '- V17 owner approval is only of a **tentative research candidate**.',
            '- The A0–A8 audit remains **13/20** closed. The seven remaining findings do not close from this Green.',
        ]
        (OUT/'RESEARCH_ONLY_v18_owner_readiness.md').write_text('\n'.join(lines)+'\n')
        assert {p.name for p in OUT.iterdir()} == {
            'RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json',
            'RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json',
            'RESEARCH_ONLY_v18_owner_readiness.md'
        }
        print('QF11_V18_OWNER_GATE_RESEARCH_GREEN '+json.dumps({
            'tentative_triplet':TRIO,'identity_holds':len(identity_rows),
            'automatic_clears':0,'archived_conditional_slots':26,
            'respondent_realism_approved':False,'voter_release_approved':False,
            'source_fixture':FIXTURE
        },sort_keys=True))

        PY_V18_MAIN
        python3 -m py_compile /tmp/qf11-v18-owner-gates.py
        python3 /tmp/qf11-v18-owner-gates.py
    - name: Run all 14 frozen regression groups and existing FA PA production selftests
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V18_FROZEN_14_REGRESSIONS_GREEN
    - name: Prove frozen evidence gates no voter links and clean read-only repo
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'V18_POST'
        from pathlib import Path
        import json
        p=Path('/tmp/qf11-v18-output')
        assert {x.name for x in p.iterdir()} == {
            'RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json',
            'RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json',
            'RESEARCH_ONLY_v18_owner_readiness.md'}
        a=json.loads((p/'RESEARCH_ONLY_v18_seven_identity_adjudication_evidence.json').read_text())
        b=json.loads((p/'RESEARCH_ONLY_v18_ballot_realism_and_voter_design.json').read_text())
        assert len(a['seven_cases']) == 7 and a['cleared_count'] == 0 and a['source_fixture'] is False
        assert a['original_slots_held'] == [5, 21]
        assert b['trio'] == ['brock bowers','tyler warren','treveyon henderson']
        assert b['ratio'] == 1.182106
        assert all(b[k] is False for k in (
            'respondent_comprehension_review_completed',
            'actual_voter_sample_size_planned_and_approved',
            'question_order_randomization_preregistered',
            'voter_coverage_independence_preregistered',
            'exposure_cap_and_per_player_balance_preregistered',
            'prospective_holdout_and_stopping_rules_preregistered',
            'final_28_ballot_catalog_approved',
            'source_linkage_to_oct_07_market_values_proven',
            'voter_issuance_approved','voting_activated'))
        assert b['no_new_votes'] and b['no_model_or_market_changes']
        assert a['owner_identity_signoff'] is False and a['voting_activated'] is False
        print('QF11_V18_RESEARCH_ONLY_HOLDS_AND_REALISM_GATE_GREEN')
        V18_POST
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_REPOSITORY_WRITES; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        echo QF11_V18_ZERO_WRITE_NO_VOTING_NO_PRODUCTION_GREEN
    - name: Archive V18 research only identity and realism owner pack (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v18-RESEARCH-ONLY-identity-evidence-and-ballot-realism
        path: /tmp/qf11-v18-output/
        retention-days: 7
        if-no-files-found: error
