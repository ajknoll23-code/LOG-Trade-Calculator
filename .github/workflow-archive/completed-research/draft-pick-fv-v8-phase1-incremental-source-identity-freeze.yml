name: Draft Pick FV V8 - Phase 1 Incremental Source Identity Freeze

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/draft-pick-fv-v8-phase1-incremental-source-identity-freeze.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase1-incremental-source-identity-freeze
  cancel-in-progress: false

jobs:
  freeze:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download and verify exact Phase 0J amendment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p0j" "${RUNNER_TEMP}/out"

          RUN_ID="36462306378"
          ARTIFACT_ID="10987178511"
          EXPECTED_DIGEST="sha256:22bbdbcf2894dfa21b3d9df30277ca5e9ab2e09d78c99645babf93609e203d95"

          ACTUAL_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest // ""')"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0j-source-availability-amendment" \
            -D "${RUNNER_TEMP}/p0j"

      - name: Build exact V8 source identity freeze
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT=Path(os.environ["RUNNER_TEMP"])
          P0J=ROOT/"p0j"
          OUT=ROOT/"out"

          YEARS=tuple(range(2018,2024))
          TIERS=("early","mid","late")
          CELLS=tuple(
              f"r{rnd}_{tier}"
              for rnd in range(1,7)
              for tier in TIERS
          )
          EXCEPTION_KEYS=(
              "2018:r6_early",
              "2018:r6_mid",
              "2018:r6_late",
          )

          EXPECTED_SOURCE_FREEZE_SHA="c143fdb512ba711ed5d78e33539034c9761c98db535d82c8b9ea0272353b5b5f"
          EXPECTED_GROUP_N=6247
          EXPECTED_OCCURRENCE_N=24988
          EXPECTED_UNIQUE_LEAGUE_YEAR_N=539
          EXPECTED_UNIQUE_LEAGUE_YEAR_BY_YEAR={
              2018:48,
              2019:69,
              2020:86,
              2021:97,
              2022:119,
              2023:120,
          }

          def load(path: Path):
              return json.loads(path.read_text())

          def canonical_sha(obj):
              return hashlib.sha256(
                  json.dumps(
                      obj,
                      sort_keys=True,
                      separators=(",",":"),
                      ensure_ascii=False,
                  ).encode()
              ).hexdigest()

          def file_sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def expected_slots(cell: str):
              rnd=int(cell[1])
              tier=cell.split("_",1)[1]
              if tier=="early":
                  within=range(1,5)
              elif tier=="mid":
                  within=range(5,9)
              elif tier=="late":
                  within=range(9,13)
              else:
                  raise AssertionError(cell)
              return [
                  (rnd-1)*12+w
                  for w in within
              ]

          amendment=load(P0J/"v8_phase0j_source_availability_amendment.json")
          p0j_manifest=load(P0J/"v8_phase0j_source_availability_amendment_manifest.json")

          DECISION="PASS_V8_PHASE0J_PREOUTCOME_SOURCE_AVAILABILITY_AMENDMENT_FREEZE_2018_R6_AT_6"
          assert amendment["decision"]==DECISION
          assert p0j_manifest["decision"]==DECISION
          assert amendment["status"]=="FROZEN_PRE_OUTCOME"
          assert amendment["historical_outcome_ingestion_authorized"] is False
          assert amendment["next_stage"]=="draft-pick-fv-v8-phase1-incremental-source-identity-freeze"
          assert amendment["amended_source_gate"]["year_cells_passing"]==108
          assert amendment["amended_source_gate"]["all_year_cells_pass"] is True
          assert amendment["amended_source_gate"]["default_minimum_fully_usable_leagues_per_year_cell"]==12
          assert amendment["amended_source_gate"]["exception"]["minimum_fully_usable_leagues_each"]==6
          assert amendment["amended_source_gate"]["exception"]["membership_change_allowed"] is False
          assert amendment["amended_source_gate"]["exception"]["exact_existing_membership_frozen"] is True
          assert all(v is False for v in amendment["firewalls"].values())

          freeze=amendment["exact_source_freeze"]
          assert freeze["canonical_sha256"]==EXPECTED_SOURCE_FREEZE_SHA
          assert p0j_manifest["source_freeze_sha256"]==EXPECTED_SOURCE_FREEZE_SHA

          memberships={
              k:list(v)
              for k,v in freeze["cell_membership_league_ids"].items()
          }
          provenance={
              k:dict(v)
              for k,v in freeze["cell_membership_provenance"].items()
          }
          occurrences={
              k:list(v)
              for k,v in freeze["occurrences"].items()
          }

          assert canonical_sha({
              "cell_membership_league_ids":memberships,
              "cell_membership_provenance":provenance,
              "occurrences":occurrences,
          })==EXPECTED_SOURCE_FREEZE_SHA

          expected_cell_keys={
              f"{year}:{cell}"
              for year in YEARS
              for cell in CELLS
          }
          assert set(memberships)==expected_cell_keys
          assert set(provenance)==expected_cell_keys
          assert len(memberships)==108

          # The source-membership gate is already frozen by Phase 0J.
          for key in sorted(expected_cell_keys):
              minimum=6 if key in EXCEPTION_KEYS else 12
              assert len(memberships[key])>=minimum,(key,len(memberships[key]),minimum)
              if key in EXCEPTION_KEYS:
                  assert len(memberships[key])==6,key

          # Freeze every retained source occurrence and prove exact identity readiness.
          frozen_rows=[]
          unique_league_year=set()
          identity_methods=Counter()
          rows_by_year=Counter()
          rows_by_year_cell=Counter()
          league_cells_by_year=Counter()
          sparse_occurrence_n=0

          for year in YEARS:
              for cell in CELLS:
                  key=f"{year}:{cell}"
                  lids=memberships[key]
                  league_n=len(lids)
                  minimum=6 if key in EXCEPTION_KEYS else 12
                  sparse=key in EXCEPTION_KEYS
                  target_slots=expected_slots(cell)

                  assert len(set(str(x) for x in lids))==len(lids),key
                  assert set(provenance[key])==set(str(x) for x in lids),key

                  # Frozen V7 weighting contract:
                  # 18 equal cell macro weights x 6 equal draft classes;
                  # within year-cell, equal league weight; within league-cell,
                  # four retained occurrences divide that league-cell weight equally.
                  cell_macro_weight=1.0/18.0
                  draft_class_weight=1.0/6.0
                  year_cell_weight=cell_macro_weight*draft_class_weight
                  league_cell_weight=year_cell_weight/league_n
                  occurrence_weight=league_cell_weight/4.0

                  for membership_index,lid_raw in enumerate(lids,1):
                      lid=str(lid_raw)
                      occurrence_key=f"{key}:{lid}"
                      assert occurrence_key in occurrences,occurrence_key
                      group=sorted(
                          occurrences[occurrence_key],
                          key=lambda r:int(r["overall_slot"]),
                      )
                      assert len(group)==4,occurrence_key
                      assert [int(r["overall_slot"]) for r in group]==target_slots,(
                          occurrence_key,
                          [r["overall_slot"] for r in group],
                          target_slots,
                      )
                      assert len({str(r["stable_player_key"]) for r in group})==4
                      assert len({str(r["sleeper_id"]) for r in group})==4

                      unique_league_year.add((year,lid))
                      league_cells_by_year[year]+=1

                      for occurrence_index,row in enumerate(group,1):
                          assert int(row["draft_year"])==year
                          assert row["cell"]==cell
                          assert str(row["league_id"])==lid
                          assert bool(row["identity_resolved"]) is True
                          assert bool(row["outcome_ready_sleeper_id"]) is True
                          assert int(row["identity_draft_class"])==year
                          assert row.get("sleeper_id")
                          assert row.get("stable_player_key")==f"sleeper:{row['sleeper_id']}"
                          assert row.get("draft_position")
                          assert row.get("identity_method")

                          out_row=dict(row)
                          out_row.update({
                              "source_provider":"MyFantasyLeague",
                              "source_provenance":provenance[key][lid],
                              "source_league_key":f"mfl:{year}:{lid}",
                              "source_membership_index":membership_index,
                              "source_occurrence_index":occurrence_index,
                              "source_sparse_2018_r6":sparse,
                              "source_minimum_fully_usable_leagues":minimum,
                              "source_league_n_year_cell":league_n,
                              "cell_macro_weight_target_v8":cell_macro_weight,
                              "draft_class_weight_target_v8":draft_class_weight,
                              "year_cell_weight_target_v8":year_cell_weight,
                              "league_cell_weight_v8":league_cell_weight,
                              "development_fit_weight_v8":occurrence_weight,
                          })
                          frozen_rows.append(out_row)
                          identity_methods[str(row["identity_method"])]+=1
                          rows_by_year[year]+=1
                          rows_by_year_cell[key]+=1
                          if sparse:
                              sparse_occurrence_n+=1

          assert len(occurrences)==EXPECTED_GROUP_N
          assert sum(len(v) for v in occurrences.values())==EXPECTED_OCCURRENCE_N
          assert len(frozen_rows)==EXPECTED_OCCURRENCE_N
          assert len(unique_league_year)==EXPECTED_UNIQUE_LEAGUE_YEAR_N

          unique_league_year_by_year=Counter(y for y,_ in unique_league_year)
          assert dict(sorted(unique_league_year_by_year.items()))==EXPECTED_UNIQUE_LEAGUE_YEAR_BY_YEAR

          # Exact weighting invariants.
          total_weight=sum(float(r["development_fit_weight_v8"]) for r in frozen_rows)
          assert math.isclose(total_weight,1.0,rel_tol=0.0,abs_tol=1e-12),total_weight

          year_weight=defaultdict(float)
          cell_weight=defaultdict(float)
          year_cell_weight=defaultdict(float)
          league_cell_weight=defaultdict(float)

          for r in frozen_rows:
              w=float(r["development_fit_weight_v8"])
              year=int(r["draft_year"])
              cell=str(r["cell"])
              lid=str(r["league_id"])
              year_weight[year]+=w
              cell_weight[cell]+=w
              year_cell_weight[(year,cell)]+=w
              league_cell_weight[(year,cell,lid)]+=w

          for year in YEARS:
              assert math.isclose(
                  year_weight[year],
                  1.0/6.0,
                  rel_tol=0.0,
                  abs_tol=1e-12,
              ),(year,year_weight[year])

          for cell in CELLS:
              assert math.isclose(
                  cell_weight[cell],
                  1.0/18.0,
                  rel_tol=0.0,
                  abs_tol=1e-12,
              ),(cell,cell_weight[cell])

          for year in YEARS:
              for cell in CELLS:
                  assert math.isclose(
                      year_cell_weight[(year,cell)],
                      1.0/108.0,
                      rel_tol=0.0,
                      abs_tol=1e-12,
                  ),(year,cell,year_cell_weight[(year,cell)])

                  n=len(memberships[f"{year}:{cell}"])
                  expected_league_weight=(1.0/108.0)/n
                  for lid in memberships[f"{year}:{cell}"]:
                      assert math.isclose(
                          league_cell_weight[(year,cell,str(lid))],
                          expected_league_weight,
                          rel_tol=0.0,
                          abs_tol=1e-12,
                      ),(year,cell,lid)

          # Sparse source flag is exactly 3 cells x 6 leagues x 4 occurrences.
          assert sparse_occurrence_n==72
          assert sum(
              rows_by_year_cell[k]
              for k in EXCEPTION_KEYS
          )==72
          assert all(rows_by_year_cell[k]==24 for k in EXCEPTION_KEYS)

          # Persist deterministic JSONL in frozen year/cell/membership/slot order.
          jsonl=OUT/"v8_phase1_incremental_source_identity_occurrences.jsonl"
          with jsonl.open("w",encoding="utf-8") as f:
              for row in frozen_rows:
                  f.write(
                      json.dumps(
                          row,
                          sort_keys=True,
                          separators=(",",":"),
                          ensure_ascii=False,
                      )+"\n"
                  )

          identity_coverage=sum(bool(r["identity_resolved"]) for r in frozen_rows)/len(frozen_rows)
          sleeper_coverage=sum(bool(r["outcome_ready_sleeper_id"]) for r in frozen_rows)/len(frozen_rows)

          summary={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase1_incremental_source_identity_freeze",
              "decision":"PROCEED_TO_V8_PHASE2_HISTORICAL_OUTCOME_HARVEST",
              "status":"FROZEN_PRE_HISTORICAL_OUTCOME_ACCESS",
              "input_phase0j":{
                  "run_id":36462306378,
                  "artifact_id":10987178511,
                  "artifact_digest":
                      "sha256:22bbdbcf2894dfa21b3d9df30277ca5e9ab2e09d78c99645babf93609e203d95",
                  "source_freeze_sha256":EXPECTED_SOURCE_FREEZE_SHA,
              },
              "source_frame":{
                  "year_n":6,
                  "cell_n":18,
                  "year_cell_n":108,
                  "source_membership_group_n":EXPECTED_GROUP_N,
                  "retained_occurrence_n":EXPECTED_OCCURRENCE_N,
                  "unique_league_year_n":EXPECTED_UNIQUE_LEAGUE_YEAR_N,
                  "unique_league_year_by_year":{
                      str(k):v
                      for k,v in sorted(EXPECTED_UNIQUE_LEAGUE_YEAR_BY_YEAR.items())
                  },
                  "default_minimum_fully_usable_leagues":12,
                  "source_availability_exception_keys":list(EXCEPTION_KEYS),
                  "source_availability_exception_minimum":6,
                  "source_availability_exception_current_n_each":6,
                  "source_membership_frozen":True,
                  "future_source_additions_allowed":False,
                  "future_source_removals_allowed":False,
              },
              "identity":{
                  "identity_resolved_n":EXPECTED_OCCURRENCE_N,
                  "identity_coverage":identity_coverage,
                  "outcome_ready_sleeper_id_n":EXPECTED_OCCURRENCE_N,
                  "sleeper_ready_coverage":sleeper_coverage,
                  "identity_method_counts":dict(sorted(identity_methods.items())),
                  "all_stable_player_keys_present":True,
                  "all_identity_draft_classes_equal_source_year":True,
                  "manual_post_outcome_identity_adjudication_allowed":False,
              },
              "weighting_contract":{
                  "cell_macro_weight":"1/18",
                  "draft_class_weight":"1/6",
                  "year_cell_weight":"1/108",
                  "league_weight_rule":"equal within frozen year-cell membership",
                  "occurrence_weight_rule":"four retained occurrences divide league-cell weight equally",
                  "grand_weight_sum":total_weight,
                  "all_year_weights_equal_one_sixth":True,
                  "all_cell_weights_equal_one_eighteenth":True,
                  "all_year_cell_weights_equal_one_108th":True,
              },
              "sparse_cell_controls":amendment["mandatory_sparse_cell_controls"],
              "sparse_2018_r6_occurrence_n":sparse_occurrence_n,
              "occurrence_jsonl":{
                  "file":"v8_phase1_incremental_source_identity_occurrences.jsonl",
                  "sha256":file_sha(jsonl),
                  "row_n":EXPECTED_OCCURRENCE_N,
              },
              "historical_outcome_ingestion_authorized":True,
              "holdout_2024_outcomes_read":False,
              "holdout_2024_search_performed":False,
              "market_or_ktc_values_read":False,
              "package_vote_data_read":False,
              "candidate_fit_performed":False,
              "candidate_scores_computed":False,
              "production_change_authorized":False,
              "next_stage":"draft-pick-fv-v8-phase2-historical-outcome-harvest",
          }

          manifest={
              "schema_version":1,
              "study_id":summary["study_id"],
              "stage":"phase1_incremental_source_identity_freeze_manifest",
              "decision":summary["decision"],
              "status":summary["status"],
              "source_freeze_sha256":EXPECTED_SOURCE_FREEZE_SHA,
              "occurrence_jsonl_sha256":summary["occurrence_jsonl"]["sha256"],
              "occurrence_n":EXPECTED_OCCURRENCE_N,
              "source_membership_group_n":EXPECTED_GROUP_N,
              "unique_league_year_n":EXPECTED_UNIQUE_LEAGUE_YEAR_N,
              "identity_coverage":identity_coverage,
              "sleeper_ready_coverage":sleeper_coverage,
              "sparse_2018_r6_occurrence_n":sparse_occurrence_n,
              "historical_outcome_ingestion_authorized":True,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
              "next_stage":summary["next_stage"],
          }

          (OUT/"v8_phase1_incremental_source_identity_freeze.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          (OUT/"v8_phase1_incremental_source_identity_freeze_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 1 Incremental Source Identity Freeze",
              "",
              f"**Decision:** `{summary['decision']}`",
              "",
              f"- Frozen year-cells: **108 / 108**",
              f"- Frozen league-cell source groups: **{EXPECTED_GROUP_N:,}**",
              f"- Frozen retained occurrences: **{EXPECTED_OCCURRENCE_N:,}**",
              f"- Unique league-years: **{EXPECTED_UNIQUE_LEAGUE_YEAR_N}**",
              f"- Identity coverage: **{identity_coverage:.2%}**",
              f"- Sleeper-ready coverage: **{sleeper_coverage:.2%}**",
              f"- Source-sparse 2018 R6 occurrences: **{sparse_occurrence_n}**",
              "",
              "## Weighting freeze",
              "",
              "- 18 R1-R6 cells receive equal macro weight.",
              "- Six 2018-2023 draft classes receive equal total weight.",
              "- Frozen leagues receive equal weight within each year-cell.",
              "- Four retained picks divide each league-cell weight equally.",
              "- Total development fit weight sums exactly to 1.0.",
              "",
              "## Outcome firewall",
              "",
              "Phase 1 reads no player outcomes. Historical 2018-2023 outcome harvesting is now authorized for Phase 2.",
              "The 2024 holdout remains sealed. Market/KTC values, package votes, candidate fitting, candidate scoring, and production changes remain forbidden.",
              "",
              "Next: `draft-pick-fv-v8-phase2-historical-outcome-harvest`.",
          ]
          (OUT/"v8_phase1_incremental_source_identity_freeze.md").write_text(
              "\n".join(lines)+"\n"
          )

          print("\n".join(lines))
          PY

      - name: Validate Phase 1 freeze
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"out"
          s=json.loads((out/"v8_phase1_incremental_source_identity_freeze.json").read_text())
          m=json.loads((out/"v8_phase1_incremental_source_identity_freeze_manifest.json").read_text())

          assert s["decision"]=="PROCEED_TO_V8_PHASE2_HISTORICAL_OUTCOME_HARVEST"
          assert s["status"]=="FROZEN_PRE_HISTORICAL_OUTCOME_ACCESS"
          assert s["input_phase0j"]["source_freeze_sha256"]=="c143fdb512ba711ed5d78e33539034c9761c98db535d82c8b9ea0272353b5b5f"

          sf=s["source_frame"]
          assert sf["year_n"]==6
          assert sf["cell_n"]==18
          assert sf["year_cell_n"]==108
          assert sf["source_membership_group_n"]==6247
          assert sf["retained_occurrence_n"]==24988
          assert sf["unique_league_year_n"]==539
          assert sf["unique_league_year_by_year"]=={
              "2018":48,
              "2019":69,
              "2020":86,
              "2021":97,
              "2022":119,
              "2023":120,
          }
          assert sf["source_availability_exception_keys"]==[
              "2018:r6_early",
              "2018:r6_mid",
              "2018:r6_late",
          ]
          assert sf["source_availability_exception_minimum"]==6
          assert sf["source_availability_exception_current_n_each"]==6
          assert sf["source_membership_frozen"] is True
          assert sf["future_source_additions_allowed"] is False
          assert sf["future_source_removals_allowed"] is False

          ident=s["identity"]
          assert ident["identity_resolved_n"]==24988
          assert ident["identity_coverage"]==1.0
          assert ident["outcome_ready_sleeper_id_n"]==24988
          assert ident["sleeper_ready_coverage"]==1.0
          assert ident["all_stable_player_keys_present"] is True
          assert ident["all_identity_draft_classes_equal_source_year"] is True
          assert ident["manual_post_outcome_identity_adjudication_allowed"] is False

          w=s["weighting_contract"]
          assert math.isclose(w["grand_weight_sum"],1.0,rel_tol=0.0,abs_tol=1e-12)
          assert w["all_year_weights_equal_one_sixth"] is True
          assert w["all_cell_weights_equal_one_eighteenth"] is True
          assert w["all_year_cell_weights_equal_one_108th"] is True

          assert s["sparse_2018_r6_occurrence_n"]==72
          assert s["sparse_cell_controls"]["preproduction_sensitivity_required"] is True
          assert s["historical_outcome_ingestion_authorized"] is True
          assert s["holdout_2024_outcomes_read"] is False
          assert s["holdout_2024_search_performed"] is False
          assert s["market_or_ktc_values_read"] is False
          assert s["package_vote_data_read"] is False
          assert s["candidate_fit_performed"] is False
          assert s["candidate_scores_computed"] is False
          assert s["production_change_authorized"] is False
          assert s["next_stage"]=="draft-pick-fv-v8-phase2-historical-outcome-harvest"

          assert m["decision"]==s["decision"]
          assert m["status"]==s["status"]
          assert m["source_freeze_sha256"]==s["input_phase0j"]["source_freeze_sha256"]
          assert m["occurrence_jsonl_sha256"]==s["occurrence_jsonl"]["sha256"]
          assert m["occurrence_n"]==24988
          assert m["identity_coverage"]==1.0
          assert m["sleeper_ready_coverage"]==1.0
          assert m["historical_outcome_ingestion_authorized"] is True
          assert m["holdout_2024_outcomes_read"] is False
          assert m["candidate_fit_performed"] is False
          assert m["production_change_authorized"] is False

          jsonl=out/"v8_phase1_incremental_source_identity_occurrences.jsonl"
          with jsonl.open() as f:
              line_n=sum(1 for line in f if line.strip())
          assert line_n==24988

          print("PASS: Phase 1 exact source/identity freeze is 108/108, fully identity-ready, weight-normalized, and 2024/fit/production sealed.")
          PY

      - name: Upload Phase 1 freeze
        uses: actions/upload-artifact@v4
        with:
          name: v8-p1-incremental-source-identity-freeze
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
