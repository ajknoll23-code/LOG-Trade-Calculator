name: A18 RB Structural Integrity Audit V1

# Read-only positional audit. No fitting. No production mutation.
"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  rb-structural-integrity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard Identity V2 closure and A17 handoff
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/qb-structural-integrity-audit-v1/manifest.json"]="21a54bb71c915dc6cb8d7f2e814a3974871aa952"
            ["research/qb-structural-integrity-audit-v1/audit_result.json"]="04175451231b06b5954357edc4203e09257c1cc8"
            ["research/identity-v2/identity_v2_phase22_closure_freeze.json"]="3584e0e83f4a65a21730c745cd843c3011bfccc6"
            ["index.html"]="21af37c43ff6ede4b346a530ea65f0ca91d605bb"
            ["scripts/validation/snapshot_values.py"]="1efca4c35e910a95974c1bec0b06a106196618b3"
            ["research/production-v2/production_v2_phase1_audit.json"]="bdd4657ff45e0c64f1406f27c1ffe6ad2e597d31"
            ["research/legacy-prod-mult/prod_mult_lineage_audit.json"]="5be77a42610708464ea31508dd31daa0f4739b74"
            ["research/age-curve-v2/age_curve_v2_phase5_evaluation.json"]="e0de6d0c63f30f58bb8e889847b1f7c71c5eae44"
            ["research/position-weight-v2/position_weight_v2_phase5_evaluation.json"]="74b6b19147f49245001392d461f3a01b1c05d87a"
          )

          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: A18 frozen input drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          close=json.loads(
              Path("research/identity-v2/identity_v2_phase22_closure_freeze.json").read_text()
          )
          assert close["decision"]=="PASS_IDENTITY_V2_CLOSE_AND_FREEZE_WITH_JONAH_ELLISS_HOLD"
          assert close["identity_v2_closed"] is True
          assert close["deployable_identity_work_complete"] is True
          assert close["remaining_manual_review_fpids"]==["26157"]

          a17=json.loads(
              Path("research/qb-structural-integrity-audit-v1/audit_result.json").read_text()
          )
          assert a17["decision"]=="PASS_QB_STRUCTURAL_AUDIT_FREEZE_REVIEW_REQUIRED_BEFORE_ANY_MODEL_CHANGE"
          assert a17["production_changed"] is False
          assert a17["production_change_authorized"] is False
          assert all(a17["hard_integrity_gates"].values())

          print("PASS: Identity V2 closed and A17 QB handoff is exact.")
          PY

      - name: Prove current production math and repository baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/snapshot_values.py --selftest
          python3 scripts/validation/repo_regression_checks.py

          sha256sum \
            index.html \
            scripts/validation/snapshot_values.py \
            research/production-v2/production_v2_phase1_audit.json \
            research/legacy-prod-mult/prod_mult_lineage_audit.json \
            research/age-curve-v2/age_curve_v2_phase5_evaluation.json \
            research/position-weight-v2/position_weight_v2_phase5_evaluation.json \
            research/qb-structural-integrity-audit-v1/manifest.json \
            > "${RUNNER_TEMP}/a18-immutable-production-and-inputs.sha256"

      - name: Freeze RB audit protocol before scoring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/rb-structural-integrity-audit-v1

          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/rb-structural-integrity-audit-v1")
          outputs=[
              D/"audit_protocol.json",
              D/"audit_result.json",
              D/"audit_report.md",
              D/"manifest.json",
          ]
          for p in outputs:
              assert not p.exists(),f"refusing to overwrite prior A18 output: {p}"

          protocol={
              "schema_version":1,
              "study_id":"rb-structural-integrity-audit-v1",
              "status":"FROZEN_BEFORE_AUDIT_SCORING",
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "scope":"All current PLAYER_DB running backs in the deployed calculator.",
              "research_only":True,
              "production_change_authorized":False,
              "production_mutation_allowed":False,
              "fitting_allowed":False,
              "named_player_targeting_allowed":False,
              "primary_questions":[
                  "Does the live RB board reproduce the exact deployed formula with no hidden RB-only mutation?",
                  "How much of within-RB value spacing comes from production multiplier versus effective age multiplier?",
                  "What is the mechanical impact of the RB-specific elite-youth bonus and fractional birth-date age interpolation?",
                  "Do role floors, elite floors, no-history rescue, production clamps, or the age floor create discontinuities?",
                  "Does the transparent Production V2 benchmark materially reorder the RB cohort or mostly preserve current ordering?",
                  "Does legacy production-multiplier lineage show unusual RB drift relative to the overall player pool?",
                  "What do the already-frozen Weeks 1-3 prospective diagnostics say about RB ordering, while respecting that they are collection-only?",
                  "Does the current RB position weight show cross-position tension in existing frozen pairwise diagnostics?"
              ],
              "hard_integrity_gates":{
                  "minimum_live_rb_count":80,
                  "all_live_rb_values_positive":True,
                  "unique_live_rb_keys":True,
                  "minimum_phase1_rb_candidate_coverage_share":0.90,
                  "minimum_phase1_current_vs_candidate_spearman":0.95,
                  "minimum_phase1_top_n_overlap_share":0.90,
                  "age_v2_must_not_authorize_deployment":True,
                  "position_weight_v2_must_not_authorize_deployment":True
              },
              "interpretation_rules":[
                  "Position weight is a common multiplicative factor within RB and cannot by itself explain RB1-versus-RB24 spacing.",
                  "The RB-specific youth bonus and fractional-age interpolation are audited as mechanisms, not assumed to be correct or incorrect.",
                  "A structural audit may identify compression, discontinuities, lineage drift, or counterfactual sensitivity but cannot select a new RB scale or curve.",
                  "Weeks 1-3 realized outcomes are early descriptive evidence only and cannot authorize a model change.",
                  "Production V2 Phase 1 is an uncalibrated transparent benchmark, not a validated replacement.",
                  "No named RB may be manually raised or lowered from this audit.",
                  "Any follow-up model change requires a separately preregistered calibration/validation study."
              ],
              "decision_rule":{
                  "if_any_hard_integrity_gate_fails":
                      "STOP_RB_AUDIT_DATA_OR_LINEAGE_INTEGRITY_FAILURE",
                  "otherwise":
                      "PASS_RB_STRUCTURAL_AUDIT_FREEZE_REVIEW_REQUIRED_BEFORE_ANY_MODEL_CHANGE"
              }
          }
          (D/"audit_protocol.json").write_text(
              json.dumps(protocol,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A18 RB audit protocol frozen before scoring.")
          PY

      - name: Run comprehensive RB structural audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import math
          import statistics
          import subprocess
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path

          ROOT=Path(".")
          D=ROOT/"research/rb-structural-integrity-audit-v1"
          protocol=json.loads((D/"audit_protocol.json").read_text())

          def load_module(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          sv=load_module(
              ROOT/"scripts/validation/snapshot_values.py",
              "a18_snapshot_values"
          )
          cfg=sv.load_from_html(ROOT/"index.html")
          live_values=sv.compute_all_values(cfg)

          phase1=json.loads(
              (ROOT/"research/production-v2/production_v2_phase1_audit.json").read_text()
          )
          legacy=json.loads(
              (ROOT/"research/legacy-prod-mult/prod_mult_lineage_audit.json").read_text()
          )
          age_eval=json.loads(
              (ROOT/"research/age-curve-v2/age_curve_v2_phase5_evaluation.json").read_text()
          )
          pw_eval=json.loads(
              (ROOT/"research/position-weight-v2/position_weight_v2_phase5_evaluation.json").read_text()
          )

          def js_round(x):
              return math.floor(x+0.5)

          def qtile(values,q):
              vals=sorted(float(x) for x in values)
              if not vals:
                  return None
              if len(vals)==1:
                  return vals[0]
              pos=(len(vals)-1)*q
              lo=math.floor(pos)
              hi=math.ceil(pos)
              if lo==hi:
                  return vals[lo]
              t=pos-lo
              return vals[lo]*(1-t)+vals[hi]*t

          def summary(values):
              vals=[float(x) for x in values if x is not None]
              if not vals:
                  return {"n":0}
              return {
                  "n":len(vals),
                  "min":min(vals),
                  "p10":qtile(vals,0.10),
                  "p25":qtile(vals,0.25),
                  "median":statistics.median(vals),
                  "mean":statistics.mean(vals),
                  "p75":qtile(vals,0.75),
                  "p90":qtile(vals,0.90),
                  "max":max(vals),
              }

          def cv(values):
              vals=[float(x) for x in values]
              if len(vals)<2:
                  return 0.0
              mean=statistics.mean(vals)
              if mean==0:
                  return None
              return statistics.pstdev(vals)/abs(mean)

          def rankdata(values):
              indexed=sorted(enumerate(values),key=lambda z:z[1])
              ranks=[0.0]*len(values)
              i=0
              while i<len(indexed):
                  j=i+1
                  while j<len(indexed) and indexed[j][1]==indexed[i][1]:
                      j+=1
                  avg=(i+1+j)/2.0
                  for k in range(i,j):
                      ranks[indexed[k][0]]=avg
                  i=j
              return ranks

          def pearson(x,y):
              if len(x)!=len(y) or len(x)<2:
                  return None
              mx=statistics.mean(x); my=statistics.mean(y)
              num=sum((a-mx)*(b-my) for a,b in zip(x,y))
              dx=sum((a-mx)**2 for a in x)
              dy=sum((b-my)**2 for b in y)
              if dx<=0 or dy<=0:
                  return None
              return num/math.sqrt(dx*dy)

          def spearman(x,y):
              return pearson(rankdata(x),rankdata(y))

          def standard_rb_age_anchor(age,role,real_production,raw_production):
              c=cfg["age_curve"]["RB"]
              if age<=c["peakEnd"]:
                  if isinstance(real_production,(int,float)):
                      lo,hi=0.15,1.55
                      ratio=max(0.0,min(1.0,(real_production-lo)/(hi-lo)))
                      pre_floor=0.55+ratio*(0.98-0.55)
                  else:
                      pre_floor=0.725 if role=="Elite" else 0.55
                  denom=c["peakStart"]-21
                  t=max(0.0,(age-21)/denom) if denom else 0.0
                  pre_floor_base=pre_floor+t*(1.0-pre_floor)
                  return pre_floor_base if age<=c["peakStart"] else 1.0
              decline_span=c["floor"]-c["peakEnd"]
              t=max(0.0,min(1.0,(age-c["peakEnd"])/decline_span)) if decline_span else 1.0
              return max(0.62,1.0-t*0.38)

          def standard_rb_continuous_age_multiplier(
              fractional_age,role,real_production,raw_production
          ):
              if not isinstance(fractional_age,(int,float)) or not math.isfinite(fractional_age):
                  return standard_rb_age_anchor(
                      fractional_age,role,real_production,raw_production
                  )
              lo=math.floor(fractional_age)
              hi=math.ceil(fractional_age)
              if lo==hi:
                  return standard_rb_age_anchor(
                      lo,role,real_production,raw_production
                  )
              a0=standard_rb_age_anchor(
                  lo,role,real_production,raw_production
              )
              a1=standard_rb_age_anchor(
                  hi,role,real_production,raw_production
              )
              t=fractional_age-lo
              return a0+t*(a1-a0)

          pw=float(cfg["position_weight"]["RB"])
          age_curve=dict(cfg["age_curve"]["RB"])

          rbs=[]
          for key,info in cfg["player_db"].items():
              if info["pos"]!="RB":
                  continue

              role=info["role"]
              age=int(info["age"])
              rm,raw_rm=sv.production_multiplier(
                  key,role,cfg["prod_mult"],cfg["no_real_history"],cfg["role_mult"]
              )
              am=sv.effective_age_multiplier(
                  "RB",age,role,key,rm,raw_rm,cfg
              )
              exact=js_round(100*pw*am*rm*55)
              live=live_values[key]
              assert exact==live["value"],(key,exact,live["value"])

              norm_key=sv.normalize_lookup_name(key)
              birth_date=cfg["rb_birth_date_data"].get(norm_key)
              fractional_age=sv.fractional_age_from_birth_date(
                  birth_date,age
              ) if birth_date else float(age)

              standard_am=standard_rb_continuous_age_multiplier(
                  fractional_age,role,rm,raw_rm
              )
              no_youth_bonus_fv=js_round(100*pw*standard_am*rm*55)
              youth_uplift_fv=exact-no_youth_bonus_fv

              qualifies_elite_youth=(
                  role=="Elite"
                  and age<=25
                  and isinstance(raw_rm,(int,float))
                  and raw_rm>=0.65
              )

              integer_am=sv.age_multiplier(
                  "RB",age,role,rm,raw_rm,cfg
              )
              integer_age_fv=js_round(100*pw*integer_am*rm*55)

              role_estimate=float(cfg["role_mult"].get(role,1.0))
              elite_floor=(
                  role=="Elite"
                  and isinstance(raw_rm,(int,float))
                  and raw_rm<0.65
                  and abs(rm-0.65)<1e-12
              )
              no_history_rescue=(
                  key in cfg["no_real_history"]
                  and isinstance(raw_rm,(int,float))
                  and raw_rm<=0.15
                  and role_estimate>raw_rm
                  and abs(rm-role_estimate)<1e-12
              )
              raw_floor=(
                  isinstance(raw_rm,(int,float))
                  and raw_rm<=0.15+1e-12
              )
              raw_ceiling=(
                  isinstance(raw_rm,(int,float))
                  and raw_rm>=1.55-1e-12
              )
              age_floor=am<=0.6200001

              rbs.append({
                  "key":key,
                  "age":age,
                  "fractional_age":float(fractional_age),
                  "birth_date_available":bool(birth_date),
                  "role":role,
                  "fv":exact,
                  "prod_mult":float(rm),
                  "raw_prod_mult":(
                      float(raw_rm) if isinstance(raw_rm,(int,float)) else None
                  ),
                  "age_mult":float(am),
                  "integer_age_mult":float(integer_am),
                  "integer_age_fv":integer_age_fv,
                  "fractional_age_fv_delta":exact-integer_age_fv,
                  "elite_youth_qualifies":qualifies_elite_youth,
                  "no_youth_bonus_age_mult":float(standard_am),
                  "no_youth_bonus_fv":no_youth_bonus_fv,
                  "elite_youth_bonus_fv_uplift":youth_uplift_fv,
                  "elite_youth_bonus_pct_uplift":(
                      youth_uplift_fv/no_youth_bonus_fv
                      if no_youth_bonus_fv else None
                  ),
                  "has_real_prod_data":raw_rm is not None,
                  "no_real_production_history":key in cfg["no_real_history"],
                  "elite_floor_applied":elite_floor,
                  "no_history_role_rescue_applied":no_history_rescue,
                  "raw_at_floor":raw_floor,
                  "raw_at_ceiling":raw_ceiling,
                  "age_floor_applied":age_floor,
              })

          rbs.sort(key=lambda r:(-r["fv"],r["key"]))
          assert len({r["key"] for r in rbs})==len(rbs)
          for i,r in enumerate(rbs,1):
              r["live_rank"]=i

          rb1=rbs[0]
          top12=rbs[:12]
          top24=rbs[:24]
          top32=rbs[:32]

          rank_bands={}
          for lo,hi in ((1,3),(1,6),(1,12),(1,24),(13,24),(25,32),(25,36),(37,48)):
              rows=rbs[lo-1:min(hi,len(rbs))]
              if not rows:
                  continue
              rank_bands[f"RB{lo}-RB{hi}"]={
                  "n":len(rows),
                  "fv":summary([r["fv"] for r in rows]),
                  "prod_mult":summary([r["prod_mult"] for r in rows]),
                  "age_mult":summary([r["age_mult"] for r in rows]),
                  "ages":summary([r["fractional_age"] for r in rows]),
                  "roles":dict(Counter(r["role"] for r in rows)),
                  "elite_youth_qualifier_count":sum(
                      r["elite_youth_qualifies"] for r in rows
                  ),
                  "elite_floor_count":sum(
                      r["elite_floor_applied"] for r in rows
                  ),
                  "no_history_rescue_count":sum(
                      r["no_history_role_rescue_applied"] for r in rows
                  ),
              }

          reference_ranks={}
          for rank in (2,3,6,12,18,24,32,36,48):
              if len(rbs)>=rank:
                  row=rbs[rank-1]
                  reference_ranks[str(rank)]={
                      "player":row["key"],
                      "fv":row["fv"],
                      "rb1_to_rank_fv_ratio":(
                          rb1["fv"]/row["fv"] if row["fv"] else None
                      ),
                      "absolute_gap_from_rb1":rb1["fv"]-row["fv"],
                      "pct_below_rb1":(
                          (rb1["fv"]-row["fv"])/rb1["fv"]
                          if rb1["fv"] else None
                      ),
                  }

          within_rb1={}
          for pct in (0.02,0.05,0.10,0.15,0.20,0.25,0.30,0.40,0.50):
              within_rb1[str(int(pct*100))]=sum(
                  r["fv"]>=rb1["fv"]*(1-pct) for r in rbs
              )

          decomposition={
              "position_weight":pw,
              "position_weight_is_constant_within_rb":True,
              "global_value_scale":55,
              "top12_fv_cv":cv([r["fv"] for r in top12]),
              "top12_prod_mult_cv":cv([r["prod_mult"] for r in top12]),
              "top12_age_mult_cv":cv([r["age_mult"] for r in top12]),
              "top24_fv_vs_prod_mult_spearman":spearman(
                  [r["fv"] for r in top24],
                  [r["prod_mult"] for r in top24],
              ),
              "top24_fv_vs_age_mult_spearman":spearman(
                  [r["fv"] for r in top24],
                  [r["age_mult"] for r in top24],
              ),
              "all_rb_fv_vs_prod_mult_spearman":spearman(
                  [r["fv"] for r in rbs],
                  [r["prod_mult"] for r in rbs],
              ),
              "all_rb_fv_vs_age_mult_spearman":spearman(
                  [r["fv"] for r in rbs],
                  [r["age_mult"] for r in rbs],
              ),
          }

          youth_rows=[r for r in rbs if r["elite_youth_qualifies"]]
          birth_rows=[r for r in rbs if r["birth_date_available"]]
          fractional_age_diag={
              "birth_date_available_count":len(birth_rows),
              "birth_date_coverage_share":len(birth_rows)/len(rbs),
              "fv_delta_vs_integer_age":summary(
                  [r["fractional_age_fv_delta"] for r in birth_rows]
              ),
              "abs_fv_delta_vs_integer_age":summary(
                  [abs(r["fractional_age_fv_delta"]) for r in birth_rows]
              ),
              "largest_abs_fractional_age_effects":sorted(
                  [
                      {
                          "player":r["key"],
                          "rank":r["live_rank"],
                          "age":r["age"],
                          "fractional_age":r["fractional_age"],
                          "live_fv":r["fv"],
                          "integer_age_fv":r["integer_age_fv"],
                          "fv_delta":r["fractional_age_fv_delta"],
                      }
                      for r in birth_rows
                  ],
                  key=lambda x:abs(x["fv_delta"]),
                  reverse=True
              )[:15],
          }

          youth_bonus_diag={
              "qualifier_count":len(youth_rows),
              "top12_qualifier_count":sum(
                  r["elite_youth_qualifies"] for r in top12
              ),
              "top24_qualifier_count":sum(
                  r["elite_youth_qualifies"] for r in top24
              ),
              "fv_uplift":summary(
                  [r["elite_youth_bonus_fv_uplift"] for r in youth_rows]
              ),
              "pct_uplift":summary(
                  [r["elite_youth_bonus_pct_uplift"] for r in youth_rows]
              ),
              "qualifiers":[
                  {
                      "player":r["key"],
                      "rank":r["live_rank"],
                      "age":r["age"],
                      "fractional_age":r["fractional_age"],
                      "role":r["role"],
                      "raw_prod_mult":r["raw_prod_mult"],
                      "live_fv":r["fv"],
                      "no_youth_bonus_fv":r["no_youth_bonus_fv"],
                      "fv_uplift":r["elite_youth_bonus_fv_uplift"],
                      "pct_uplift":r["elite_youth_bonus_pct_uplift"],
                  }
                  for r in youth_rows
              ],
          }

          live_semantics={
              "rb_count":len(rbs),
              "has_real_prod_data_count":sum(r["has_real_prod_data"] for r in rbs),
              "no_real_production_history_count":sum(
                  r["no_real_production_history"] for r in rbs
              ),
              "elite_floor_applied_count":sum(
                  r["elite_floor_applied"] for r in rbs
              ),
              "no_history_role_rescue_applied_count":sum(
                  r["no_history_role_rescue_applied"] for r in rbs
              ),
              "raw_at_floor_count":sum(r["raw_at_floor"] for r in rbs),
              "raw_at_ceiling_count":sum(r["raw_at_ceiling"] for r in rbs),
              "age_floor_applied_count":sum(r["age_floor_applied"] for r in rbs),
              "top24_elite_floor_count":sum(
                  r["elite_floor_applied"] for r in top24
              ),
              "top24_no_history_role_rescue_count":sum(
                  r["no_history_role_rescue_applied"] for r in top24
              ),
              "top24_age_floor_count":sum(
                  r["age_floor_applied"] for r in top24
              ),
              "position_weight":pw,
              "age_curve":age_curve,
          }

          phase1_rbs=[
              rec for rec in phase1["players"].values()
              if rec.get("pos")=="RB"
          ]
          phase1_candidates=[
              rec for rec in phase1_rbs
              if rec.get("candidate") is not None
          ]
          phase1_coverage=len(phase1_candidates)/len(phase1_rbs)
          p1_rank=phase1["rank_stability_by_position"]["RB"]
          p1_coverage=phase1["coverage_by_position"]["RB"]
          p1_move=phase1["movement_summary_by_position"]["RB"]

          phase1_movers=[]
          for rec in phase1_candidates:
              comp=rec.get("comparison") or {}
              phase1_movers.append({
                  "player":rec["key"],
                  "role":rec.get("role"),
                  "current_value":rec["current"]["fundamental_value"],
                  "candidate_value":rec["candidate"]["value"],
                  "fv_change":comp.get("fundamental_value_change"),
                  "fv_change_pct":comp.get("fundamental_value_change_pct"),
                  "rank_change":comp.get("rank_change"),
                  "current_pm":rec["current"]["effective_prod_mult"],
                  "candidate_pm":rec["candidate"]["effective_prod_mult"],
                  "pm_change":comp.get("effective_prod_mult_change"),
                  "forward_source":rec.get("forward",{}).get("source"),
              })
          phase1_movers.sort(
              key=lambda r:abs(r["fv_change_pct"] or 0),
              reverse=True
          )

          phase1_diag={
              "rb_count":len(phase1_rbs),
              "candidate_count":len(phase1_candidates),
              "candidate_coverage_share":phase1_coverage,
              "reported_coverage":p1_coverage,
              "rank_stability":p1_rank,
              "movement_summary":p1_move,
              "top_20_absolute_fv_pct_movers":phase1_movers[:20],
              "benchmark_transform":phase1["benchmark_assumptions"]["prod_mult_transform"],
              "benchmark_offense_forward":phase1["benchmark_assumptions"]["offense_forward"],
          }

          legacy_rb=legacy["by_position_abs_diff"]["RB"]
          legacy_diag={
              "rb_live_vs_generated_abs_diff":legacy_rb,
              "overall_live_vs_generated_abs_diff":legacy["overall_abs_diff"],
              "rb_median_abs_diff_vs_overall_ratio":(
                  legacy_rb["median"]/legacy["overall_abs_diff"]["median"]
                  if legacy["overall_abs_diff"]["median"] else None
              ),
              "rb_median_drift_above_overall":(
                  legacy_rb["median"]>legacy["overall_abs_diff"]["median"]
              ),
              "interpretation":"Legacy lineage is diagnostic only; a larger RB residual than the overall pool is a follow-up signal, not deployment authority."
          }

          age_rb=age_eval["metrics"]["deployed_control"]["by_position"]["RB"]
          rb_pair_metrics={
              k:v for k,v in
              pw_eval["variant_scores"]["deployed_control"][
                  "cross_position_pairwise"
              ]["by_position_pair"].items()
              if "RB" in k
          }
          prospective_diag={
              "completed_outcome_weeks_age_v2":age_eval["completed_outcome_weeks"],
              "completed_outcome_weeks_position_weight_v2":
                  pw_eval["completed_outcome_weeks"],
              "age_v2_deployed_control_rb_metrics":age_rb,
              "position_weight_v2_deployed_control_rb_cross_position_pairs":
                  rb_pair_metrics,
              "age_curve_change_authorized":
                  age_eval.get("age_curve_change_authorized"),
              "age_v2_deployment_authorized":
                  age_eval.get("deployment_authorized"),
              "position_weight_change_authorized":
                  pw_eval.get("position_weight_change_authorized"),
              "position_weight_v2_deployment_authorized":
                  pw_eval.get("deployment_authorized"),
              "interpretation":"Weeks 1-3 are collection-only/early descriptive evidence under frozen upstream studies and cannot authorize an RB model change."
          }

          gates={
              "minimum_live_rb_count":
                  len(rbs)>=protocol["hard_integrity_gates"]["minimum_live_rb_count"],
              "all_live_rb_values_positive":
                  all(r["fv"]>0 for r in rbs),
              "unique_live_rb_keys":
                  len({r["key"] for r in rbs})==len(rbs),
              "minimum_phase1_rb_candidate_coverage_share":
                  phase1_coverage>=protocol["hard_integrity_gates"][
                      "minimum_phase1_rb_candidate_coverage_share"
                  ],
              "minimum_phase1_current_vs_candidate_spearman":
                  p1_rank["spearman_current_vs_phase1"]>=protocol[
                      "hard_integrity_gates"
                  ]["minimum_phase1_current_vs_candidate_spearman"],
              "minimum_phase1_top_n_overlap_share":
                  p1_rank["top_n_overlap_share"]>=protocol[
                      "hard_integrity_gates"
                  ]["minimum_phase1_top_n_overlap_share"],
              "age_v2_must_not_authorize_deployment":
                  age_eval.get("deployment_authorized") is False
                  and age_eval.get("age_curve_change_authorized") is False,
              "position_weight_v2_must_not_authorize_deployment":
                  pw_eval.get("deployment_authorized") is False
                  and pw_eval.get("position_weight_change_authorized") is False,
          }

          decision=(
              protocol["decision_rule"]["otherwise"]
              if all(gates.values())
              else protocol["decision_rule"]["if_any_hard_integrity_gate_fails"]
          )

          result={
              "schema_version":1,
              "study_id":"rb-structural-integrity-audit-v1",
              "status":"AUDIT_COMPLETE",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "production_changed":False,
              "fitting_performed":False,
              "named_player_adjustment_performed":False,
              "hard_integrity_gates":gates,
              "deployed_formula":{
                  "formula":"FV = JS-round(5500 * POSITION_WEIGHT[RB] * effective_age_multiplier * effective_production_multiplier)",
                  "rb_position_weight":pw,
                  "rb_age_curve":age_curve,
                  "global_scale":55,
                  "rb_elite_youth_bonus_rule":"Elite RB, integer age <=25, raw production >=0.65; 0.384*sqrt(years_of_upside), capped through deployed age function.",
                  "rb_fractional_age_rule":"When birth-date data exists, interpolate monotone integer-age anchors using fractional age."
              },
              "structural_findings":{
                  "within_rb_position_weight_cancels":True,
                  "rb1":rb1,
                  "reference_ranks":reference_ranks,
                  "counts_within_percent_of_rb1":within_rb1,
                  "rank_bands":rank_bands,
                  "decomposition":decomposition,
                  "live_semantics":live_semantics,
                  "fractional_age_diagnostic":fractional_age_diag,
                  "elite_youth_bonus_diagnostic":youth_bonus_diag,
                  "phase1_rank_order_is_highly_stable":(
                      p1_rank["spearman_current_vs_phase1"]>=0.95
                  ),
                  "phase1_top_n_membership_overlap_share":
                      p1_rank["top_n_overlap_share"],
                  "legacy_rb_lineage_drift_above_overall_median":
                      legacy_diag["rb_median_drift_above_overall"],
                  "weeks_1_3_are_not_model_selection_evidence":True,
              },
              "top_40_live_rbs":rbs[:40],
              "all_live_rbs":rbs,
              "production_v2_phase1_diagnostic":phase1_diag,
              "legacy_production_lineage_diagnostic":legacy_diag,
              "existing_prospective_evidence":prospective_diag,
              "scientific_limits":[
                  "This audit can identify mechanical compression, discontinuities, age/youth-bonus sensitivity, coverage gaps, and lineage instability.",
                  "It cannot establish the true market price of RB scarcity.",
                  "It cannot infer that a specific named RB is too high or too low.",
                  "The no-youth-bonus counterfactual isolates the deployed mechanism; it is not a proposed production model.",
                  "Production V2 Phase 1 is transparent but uncalibrated.",
                  "Weeks 1-3 realized outcomes are too early under frozen prospective protocols to select or deploy an RB model change.",
                  "No new RB weight, age curve, production transform, youth premium, or player-specific adjustment is fit here."
              ],
              "next_step_if_green":"Review A18 findings. If no material RB calibration concern is established, freeze no-change and continue to A19 WR Structural Integrity Audit V1. If a material concern remains, preregister a broad-cohort RB calibration study before fitting or validation."
          }

          (D/"audit_result.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# RB Structural Integrity Audit V1",
              "",
              f"**Decision:** `{decision}`",
              "",
              "## Scope",
              "",
              f"- Live RB count: **{len(rbs)}**",
              f"- Production V2 Phase 1 RB benchmark coverage: **{len(phase1_candidates)}/{len(phase1_rbs)} ({phase1_coverage:.1%})**",
              f"- Live RB position weight: **{pw:.6f}**",
              f"- RB age curve: **{age_curve}**",
              f"- Birth-date coverage: **{len(birth_rows)}/{len(rbs)} ({len(birth_rows)/len(rbs):.1%})**",
              "- Production changes: **None**",
              "- Fitting: **None**",
              "",
              "## Hard integrity gates",
              "",
          ]
          for k,v in gates.items():
              lines.append(f"- {k}: **{'PASS' if v else 'FAIL'}**")

          lines += [
              "",
              "## Mechanical interpretation",
              "",
              "Within RB, position weight is constant. RB-vs-RB spacing therefore comes from production and age mechanics, including the RB-specific youth rule and fractional-age interpolation.",
              "",
              f"- Current RB1: **{rb1['key']} — {rb1['fv']} FV**",
          ]
          for rank,rec in reference_ranks.items():
              lines.append(
                  f"- RB1 / RB{rank} FV ratio: **{rec['rb1_to_rank_fv_ratio']:.3f}** "
                  f"(RB{rank}: {rec['player']} — {rec['fv']})"
              )

          lines += [
              "",
              "## Upper-RB decomposition",
              "",
              f"- Top-12 FV coefficient of variation: **{decomposition['top12_fv_cv']:.4f}**",
              f"- Top-12 production-multiplier coefficient of variation: **{decomposition['top12_prod_mult_cv']:.4f}**",
              f"- Top-12 age-multiplier coefficient of variation: **{decomposition['top12_age_mult_cv']:.4f}**",
              f"- Top-24 FV vs production-multiplier Spearman: **{decomposition['top24_fv_vs_prod_mult_spearman']:.4f}**",
              f"- Top-24 FV vs age-multiplier Spearman: **{decomposition['top24_fv_vs_age_mult_spearman']:.4f}**",
              "",
              "## RB-specific age mechanics",
              "",
              f"- Elite-youth qualifiers: **{len(youth_rows)}**",
              f"- Elite-youth qualifiers in top 12: **{youth_bonus_diag['top12_qualifier_count']}**",
              f"- Median FV uplift vs no-youth-bonus counterfactual: **{youth_bonus_diag['fv_uplift'].get('median',0):.1f}**",
              f"- Max FV uplift vs no-youth-bonus counterfactual: **{youth_bonus_diag['fv_uplift'].get('max',0):.1f}**",
              f"- Median absolute fractional-age FV effect where birth date exists: **{fractional_age_diag['abs_fv_delta_vs_integer_age'].get('median',0):.1f}**",
              f"- Max absolute fractional-age FV effect: **{fractional_age_diag['abs_fv_delta_vs_integer_age'].get('max',0):.1f}**",
              "",
              "## Live fallback / floor semantics",
              "",
              f"- Elite production floor applied: **{live_semantics['elite_floor_applied_count']} RBs**",
              f"- No-history role rescue applied: **{live_semantics['no_history_role_rescue_applied_count']} RBs**",
              f"- Raw production at floor: **{live_semantics['raw_at_floor_count']} RBs**",
              f"- Raw production at ceiling: **{live_semantics['raw_at_ceiling_count']} RBs**",
              f"- Age multiplier at 0.62 floor: **{live_semantics['age_floor_applied_count']} RBs**",
              "",
              "## Production lineage",
              "",
              f"- Phase 1 current-vs-transparent-candidate Spearman: **{p1_rank['spearman_current_vs_phase1']:.6f}**",
              f"- Phase 1 top-{p1_rank['top_n']} overlap: **{p1_rank['top_n_overlap_count']}/{p1_rank['top_n']} ({p1_rank['top_n_overlap_share']:.1%})**",
              f"- Legacy RB live-vs-generated median absolute PM drift: **{legacy_rb['median']:.4f}**",
              f"- Legacy overall median absolute PM drift: **{legacy['overall_abs_diff']['median']:.4f}**",
              f"- RB / overall median drift ratio: **{legacy_diag['rb_median_abs_diff_vs_overall_ratio']:.3f}x**",
              "",
              "## Existing prospective evidence",
              "",
              f"- Completed outcome weeks available: **{age_eval['completed_outcome_weeks']}**",
              f"- RB FV vs active PPG Spearman: **{age_rb['value_vs_active_ppg']['spearman']:.4f}**",
              f"- RB FV vs total points Spearman: **{age_rb['value_vs_total_points']['spearman']:.4f}**",
              "- These Weeks 1-3 results are descriptive only under frozen upstream protocols.",
              "",
              "## Top 40 live RBs",
              "",
              "| Rank | RB | Age | Frac age | Role | FV | Prod mult | Age mult | Youth qual | Youth uplift |",
              "|---:|---|---:|---:|---|---:|---:|---:|:---:|---:|",
          ]
          for r in rbs[:40]:
              lines.append(
                  f"| {r['live_rank']} | {r['key']} | {r['age']} | {r['fractional_age']:.2f} | "
                  f"{r['role']} | {r['fv']} | {r['prod_mult']:.4f} | {r['age_mult']:.4f} | "
                  f"{'Y' if r['elite_youth_qualifies'] else 'N'} | {r['elite_youth_bonus_fv_uplift']} |"
              )

          lines += [
              "",
              "## Scientific limit / next step",
              "",
              "This audit does not decide that the RB scale, age curve, or youth premium is correct merely because the deployed mechanics are internally consistent. Any material calibration concern must be preregistered at the broad-cohort level before fitting or validation.",
          ]

          (D/"audit_report.md").write_text(
              "\n".join(lines).rstrip()+"\n"
          )

          print(json.dumps({
              "decision":decision,
              "live_rb_count":len(rbs),
              "phase1_candidate_coverage_share":phase1_coverage,
              "phase1_spearman":p1_rank["spearman_current_vs_phase1"],
              "phase1_top_n_overlap_share":p1_rank["top_n_overlap_share"],
              "rb1":{"player":rb1["key"],"fv":rb1["fv"]},
              "rb1_to_rb24_ratio":reference_ranks["24"]["rb1_to_rank_fv_ratio"],
              "elite_youth_qualifier_count":len(youth_rows),
              "legacy_rb_median_abs_pm_drift":legacy_rb["median"],
              "legacy_overall_median_abs_pm_drift":legacy["overall_abs_diff"]["median"],
              "all_hard_gates_pass":all(gates.values()),
          },indent=2))
          PY

      - name: Validate audit result and write manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/rb-structural-integrity-audit-v1")
          protocol=json.loads((D/"audit_protocol.json").read_text())
          result=json.loads((D/"audit_result.json").read_text())

          assert result["status"]=="AUDIT_COMPLETE"
          assert result["research_only"] is True
          assert result["production_change_authorized"] is False
          assert result["production_changed"] is False
          assert result["fitting_performed"] is False
          assert result["named_player_adjustment_performed"] is False
          assert result["decision"] in set(protocol["decision_rule"].values())
          assert len(result["all_live_rbs"])>=80
          assert len(result["top_40_live_rbs"])==40
          assert result["deployed_formula"]["rb_position_weight"]==0.89
          assert result["deployed_formula"]["rb_age_curve"]=={
              "peakStart":23,"peakEnd":25,"floor":30
          }

          if all(result["hard_integrity_gates"].values()):
              assert result["decision"]==(
                  "PASS_RB_STRUCTURAL_AUDIT_FREEZE_REVIEW_REQUIRED_BEFORE_ANY_MODEL_CHANGE"
              )
          else:
              assert result["decision"]==(
                  "STOP_RB_AUDIT_DATA_OR_LINEAGE_INTEGRITY_FAILURE"
              )

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          manifest={
              "schema_version":1,
              "study_id":"rb-structural-integrity-audit-v1",
              "decision":result["decision"],
              "research_only":True,
              "production_change_authorized":False,
              "production_changed":False,
              "files":{
                  "audit_protocol.json":sha(D/"audit_protocol.json"),
                  "audit_result.json":sha(D/"audit_result.json"),
                  "audit_report.md":sha(D/"audit_report.md"),
              },
              "frozen_inputs":{
                  "index.html":sha(Path("index.html")),
                  "snapshot_values.py":sha(
                      Path("scripts/validation/snapshot_values.py")
                  ),
                  "production_v2_phase1_audit.json":sha(
                      Path("research/production-v2/production_v2_phase1_audit.json")
                  ),
                  "prod_mult_lineage_audit.json":sha(
                      Path("research/legacy-prod-mult/prod_mult_lineage_audit.json")
                  ),
                  "age_curve_v2_phase5_evaluation.json":sha(
                      Path("research/age-curve-v2/age_curve_v2_phase5_evaluation.json")
                  ),
                  "position_weight_v2_phase5_evaluation.json":sha(
                      Path("research/position-weight-v2/position_weight_v2_phase5_evaluation.json")
                  ),
                  "a17_qb_audit_manifest.json":sha(
                      Path("research/qb-structural-integrity-audit-v1/manifest.json")
                  ),
              }
          }
          (D/"manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A18 RB audit manifest frozen.")
          PY

      - name: Prove production and audit inputs remained immutable
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/a18-immutable-production-and-inputs.sha256"

          python3 scripts/validation/snapshot_values.py --selftest
          python3 scripts/validation/repo_regression_checks.py

          echo "PASS: A18 made no production or upstream research changes."

      - name: Prove exact A18 research-only scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          allowed={
              "research/rb-structural-integrity-audit-v1/audit_protocol.json",
              "research/rb-structural-integrity-audit-v1/audit_result.json",
              "research/rb-structural-integrity-audit-v1/audit_report.md",
              "research/rb-structural-integrity-audit-v1/manifest.json",
          }

          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}

          unexpected=touched-allowed
          missing=allowed-touched
          if unexpected:
              raise SystemExit(
                  "Unexpected A18 file changes: "
                  + ", ".join(sorted(unexpected))
              )
          if missing:
              raise SystemExit(
                  "Missing A18 research files: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: A18 touched exactly four RB research files.")
          PY

          git diff --check

      - name: Commit A18 RB audit freeze
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A18."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/rb-structural-integrity-audit-v1/

          git diff --cached --check
          git commit -m "Freeze RB structural integrity audit V1"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A18 RB structural integrity audit committed cleanly."
