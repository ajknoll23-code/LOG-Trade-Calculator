name: B41B Player Role Engine V2 - Rectangular Schema Recovery and Leakage Audit
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  build_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      shell: bash
      run: "set -euo pipefail\npython3 -m pip install --disable-pip-version-check --no-cache-dir \\\n  \"requests>=2.32,<3\"\n"
    - name: Verify B41A scientific gate and snapshot production
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\nPREREG=\"$BASE/player_role_v2_b41a_scientific_preregistration.json\"\nFEAS=\"$BASE/player_role_v2_b41a_source_feasibility.json\"\n\ntest -f \"$PREREG\"\ntest -f \"$FEAS\"\n\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\nbase = Path(\"research/player-role-v2\")\np = json.loads(\n    (base / \"player_role_v2_b41a_scientific_preregistration.json\")\n    .read_text(encoding=\"utf-8\")\n)\nf = json.loads(\n    (base / \"player_role_v2_b41a_source_feasibility.json\")\n    .read_text(encoding=\"utf-8\")\n)\n\nassert p[\"status\"] == \"PREREGISTERED_BEFORE_ANY_MODEL_FIT_OR_TARGET_ASSOCIATION\"\nassert p[\"population\"][\"development_seasons\"] == [2019, 2020, 2021, 2022, 2023, 2024]\nassert p[\"population\"][\"untouched_holdout_season\"] == 2025\nassert p[\"model_development_plan\"][\"no_2025_holdout_access_during_selection\"] is True\nassert p[\"tier_derivation_plan\"][\"thresholds_hand_assigned\"] is False\n\nassert\
        \ f[\"decision\"][\"objective_historical_development_path_feasible\"] is True\nassert f[\"decision\"][\"historical_projection_features_admitted\"] is False\nassert f[\"model_fit_performed\"] is False\nassert f[\"predictor_target_association_computed\"] is False\nassert f[\"decision\"][\"production_change_authorized\"] is False\n\nprint(\"PASS: B41A scientific gate verified.\")\nprint(\"PASS: projection features remain blocked.\")\nprint(\"PASS: 2025 remains the untouched holdout.\")\nPY\n\necho \"INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')\" >> \"$GITHUB_ENV\"\necho \"FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')\" >> \"$GITHUB_ENV\"\n"
    - name: Apply preregistered rectangular-schema recovery to frozen B41B builder
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ngit reset --hard origin/main\n\nBASE=\"research/player-role-v2\"\nBUILDER=\"$BASE/player_role_v2_b41b_cohort_builder.py\"\nAMENDMENT=\"$BASE/player_role_v2_b41b_rectangular_schema_recovery_amendment.json\"\n\ntest -f \"$BUILDER\"\n\npython3 - <<'PY'\nfrom datetime import datetime, timezone\nimport json\nfrom pathlib import Path\nimport subprocess\n\nbase = Path(\"research/player-role-v2\")\nbuilder = base / \"player_role_v2_b41b_cohort_builder.py\"\namendment_path = base / \"player_role_v2_b41b_rectangular_schema_recovery_amendment.json\"\n\ntext = builder.read_text(encoding=\"utf-8\")\n\nold = '''def opportunity_features(history, pos):\n    fields = OPPORTUNITY_BY_POSITION[pos]\n    out = {}\n    for field in fields:\n        vals = [\n            finite_float(r.get(\"stats\", {}).get(field), 0.0)\n            for r in history\n        ]\n        out[f\"{field}__last3_active_mean\"] = mean_or_none(vals[-3:])\n        out[f\"{field}__season_to_date_active_mean\"\
        ] = mean_or_none(vals)\n        out[f\"{field}__last3_minus_prior3\"] = trend_or_none(vals)\n    return out\n'''\n\nnew = '''ALL_OPPORTUNITY_FIELDS = tuple(sorted({\n    field\n    for fields in OPPORTUNITY_BY_POSITION.values()\n    for field in fields\n}))\nOPPORTUNITY_FEATURE_SUFFIXES = (\n    \"last3_active_mean\",\n    \"season_to_date_active_mean\",\n    \"last3_minus_prior3\",\n)\n\ndef opportunity_features(history, pos):\n    # Every cohort row must have one identical rectangular schema.\n    # Signals irrelevant to a position are NULL, never zero.\n    # Relevant fields retain the exact original B41B computation.\n    out = {\n        f\"{field}__{suffix}\": None\n        for field in ALL_OPPORTUNITY_FIELDS\n        for suffix in OPPORTUNITY_FEATURE_SUFFIXES\n    }\n\n    for field in OPPORTUNITY_BY_POSITION[pos]:\n        vals = [\n            finite_float(r.get(\"stats\", {}).get(field), 0.0)\n            for r in history\n        ]\n        out[f\"{field}__last3_active_mean\"\
        ] = mean_or_none(vals[-3:])\n        out[f\"{field}__season_to_date_active_mean\"] = mean_or_none(vals)\n        out[f\"{field}__last3_minus_prior3\"] = trend_or_none(vals)\n    return out\n'''\n\nalready_patched = \"ALL_OPPORTUNITY_FIELDS = tuple(sorted({\" in text\n\nif already_patched:\n    assert old not in text\n    assert new in text\n    print(\"PASS: rectangular-schema recovery already present.\")\nelse:\n    assert text.count(old) == 1, \"Expected exact failing opportunity_features block once.\"\n    original_blob = subprocess.check_output(\n        [\"git\", \"rev-parse\", f\"HEAD:{builder.as_posix()}\"],\n        text=True,\n    ).strip()\n\n    text = text.replace(old, new, 1)\n    builder.write_text(text, encoding=\"utf-8\")\n\n    amendment = {\n        \"schema_version\": 1,\n        \"study_id\": \"player-role-v2\",\n        \"phase\": \"B41B-operational-recovery\",\n        \"status\": \"PREREGISTERED_IMPLEMENTATION_RECOVERY_BEFORE_SUCCESSFUL_COHORT_CONSTRUCTION\"\
        ,\n        \"created_at_utc\": datetime.now(timezone.utc).isoformat(),\n        \"failed_run\": {\n            \"run_id\": 37080984487,\n            \"job_id\": 111081231528,\n            \"failure\": \"RuntimeError: inconsistent cohort schema\",\n            \"failure_stage\": \"CSV serialization after cohort construction\",\n        },\n        \"original_builder_git_blob_sha\": original_blob,\n        \"root_cause\": (\n            \"Position-specific opportunity features produced different dictionary \"\n            \"key sets by position, while the CSV writer required all rows to have \"\n            \"an identical ordered schema.\"\n        ),\n        \"recovery\": {\n            \"change\": (\n                \"Materialize the union of all preregistered opportunity-feature \"\n                \"columns on every row. Non-applicable position signals are null. \"\n                \"Applicable position signals retain their original computation.\"\n            ),\n           \
        \ \"new_predictor_family_added\": False,\n            \"predictor_value_formula_changed_for_applicable_fields\": False,\n            \"target_definition_changed\": False,\n            \"development_seasons_changed\": False,\n            \"holdout_season_changed\": False,\n            \"cohort_origin_weeks_changed\": False,\n            \"minimum_future_active_games_changed\": False,\n            \"source_data_changed\": False,\n            \"projection_features_admitted\": False,\n        },\n        \"information_state_at_amendment\": {\n            \"2025_holdout_opened\": False,\n            \"model_fit_performed\": False,\n            \"predictor_target_association_computed\": False,\n            \"role_weights_derived\": False,\n            \"role_thresholds_derived\": False,\n            \"target_league_score_computed\": False,\n            \"production_change_authorized\": False,\n        },\n    }\n    amendment_path.write_text(\n        json.dumps(amendment, indent=2, sort_keys=True)\
        \ + \"\\n\",\n        encoding=\"utf-8\",\n    )\n    print(\"PASS: wrote transparent B41B implementation-recovery amendment.\")\nPY\n\npython3 -m py_compile \"$BUILDER\"\n\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\nbase = Path(\"research/player-role-v2\")\nbuilder = (base / \"player_role_v2_b41b_cohort_builder.py\").read_text(encoding=\"utf-8\")\namendment = json.loads(\n    (base / \"player_role_v2_b41b_rectangular_schema_recovery_amendment.json\")\n    .read_text(encoding=\"utf-8\")\n)\n\nassert \"ALL_OPPORTUNITY_FIELDS = tuple(sorted({\" in builder\nassert \"OPPORTUNITY_FEATURE_SUFFIXES\" in builder\nassert \"for field in ALL_OPPORTUNITY_FIELDS\" in builder\nassert \"for field in OPPORTUNITY_BY_POSITION[pos]\" in builder\n\nassert amendment[\"status\"] == (\n    \"PREREGISTERED_IMPLEMENTATION_RECOVERY_BEFORE_SUCCESSFUL_COHORT_CONSTRUCTION\"\n)\nassert amendment[\"recovery\"][\"new_predictor_family_added\"] is False\nassert amendment[\"recovery\"][\"predictor_value_formula_changed_for_applicable_fields\"\
        ] is False\nassert amendment[\"recovery\"][\"target_definition_changed\"] is False\nassert amendment[\"information_state_at_amendment\"][\"2025_holdout_opened\"] is False\nassert amendment[\"information_state_at_amendment\"][\"model_fit_performed\"] is False\nassert amendment[\"information_state_at_amendment\"][\"predictor_target_association_computed\"] is False\nassert amendment[\"information_state_at_amendment\"][\"role_weights_derived\"] is False\nassert amendment[\"information_state_at_amendment\"][\"role_thresholds_derived\"] is False\nassert amendment[\"information_state_at_amendment\"][\"production_change_authorized\"] is False\n\nprint(\"PASS: recovery changes serialization shape only, not scientific definitions.\")\nPY\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\ngit add \"$BUILDER\" \"$AMENDMENT\"\ngit diff --cached --check\n\nif git diff --cached --quiet; then\n  echo \"B41B rectangular-schema\
        \ recovery already frozen.\"\nelse\n  git commit -m \"Recover Player Role V2 rectangular cohort schema\"\n  git push origin HEAD:main\nfi\n"
    - name: Download exact B41A-pinned development sources only
      shell: bash
      run: "set -euo pipefail\n\ngit fetch origin main\ngit rebase origin/main\n\nSRC=\"/tmp/player-role-v2-b41b\"\nmkdir -p \"$SRC\"\n\npython3 - <<'PY'\nimport hashlib\nimport json\nfrom pathlib import Path\nimport requests\n\nbase = Path(\"research/player-role-v2\")\nfeas = json.loads(\n    (base / \"player_role_v2_b41a_source_feasibility.json\")\n    .read_text(encoding=\"utf-8\")\n)\nout = Path(\"/tmp/player-role-v2-b41b\")\nua = {\"User-Agent\": \"LOG-Trade-Calculator-player-role-v2-b41b\"}\n\ndef download_and_pin(url, path, expected_sha):\n    r = requests.get(url, timeout=180, headers=ua)\n    r.raise_for_status()\n    actual = hashlib.sha256(r.content).hexdigest()\n    if actual != expected_sha:\n        raise RuntimeError(\n            f\"source drift for {path.name}: expected={expected_sha} actual={actual}\"\n        )\n    path.write_bytes(r.content)\n    print(path.name, actual)\n\nfor season in range(2019, 2025):\n    sm = feas[\"sources\"][\"nflverse_weekly_player_stats\"\
        ][\"seasons\"][str(season)]\n    download_and_pin(\n        sm[\"url\"],\n        out / f\"stats_player_week_{season}.csv\",\n        sm[\"sha256\"],\n    )\n\n    sn = feas[\"sources\"][\"nflverse_snap_counts\"][\"seasons\"][str(season)]\n    download_and_pin(\n        sn[\"url\"],\n        out / f\"snap_counts_{season}.csv\",\n        sn[\"sha256\"],\n    )\n\n# Identity-only crosswalk. Current corrections to player IDs are allowed:\n# this file is used only to join GSIS and PFR identifiers, never as a\n# performance or target feature.\nplayers_url = (\n    \"https://github.com/nflverse/nflverse-data/releases/download/\"\n    \"players/players.csv\"\n)\nr = requests.get(players_url, timeout=180, headers=ua)\nr.raise_for_status()\n(out / \"players.csv\").write_bytes(r.content)\nprint(\n    \"players.csv\",\n    hashlib.sha256(r.content).hexdigest(),\n    \"identity-only crosswalk\",\n)\nPY\n\n# Explicitly prove no 2025 development files were downloaded.\ntest ! -e \"$SRC/stats_player_week_2025.csv\"\
        \ntest ! -e \"$SRC/snap_counts_2025.csv\"\n"
    - name: Construct development cohort and run leakage audit
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\nSRC=\"/tmp/player-role-v2-b41b\"\n\npython3 \"$BASE/player_role_v2_b41b_cohort_builder.py\" \\\n  --source-dir \"$SRC\" \\\n  --players \"$SRC/players.csv\" \\\n  --out-cohort \"$SRC/player_role_v2_development_cohort.csv.gz\" \\\n  --out-audit \"$SRC/player_role_v2_b41b_cohort_audit.json\" \\\n  --out-manifest \"$SRC/player_role_v2_b41b_cohort_manifest.json\"\n\npython3 - <<'PY'\nimport csv\nimport gzip\nimport json\nfrom pathlib import Path\n\nsrc = Path(\"/tmp/player-role-v2-b41b\")\naudit = json.loads(\n    (src / \"player_role_v2_b41b_cohort_audit.json\")\n    .read_text(encoding=\"utf-8\")\n)\nmanifest = json.loads(\n    (src / \"player_role_v2_b41b_cohort_manifest.json\")\n    .read_text(encoding=\"utf-8\")\n)\n\nassert audit[\"development_seasons\"] == [2019, 2020, 2021, 2022, 2023, 2024]\nassert audit[\"untouched_holdout_season\"] == 2025\nassert audit[\"holdout_rows_read\"] == 0\nassert audit[\"historical_projection_features_used\"\
        ] is False\nassert audit[\"model_fit_performed\"] is False\nassert audit[\"predictor_target_association_computed\"] is False\nassert audit[\"role_weights_derived\"] is False\nassert audit[\"role_thresholds_derived\"] is False\nassert audit[\"production_change_authorized\"] is False\nassert all(audit[\"leakage_checks\"].values())\nassert audit[\"target_status\"][\"future_league_scored_target_computed\"] is False\n\nassert manifest[\"holdout_opened\"] is False\nassert manifest[\"model_fit_performed\"] is False\nassert manifest[\"production_change_authorized\"] is False\nassert manifest[\"cohort_row_count\"] == audit[\"cohort_row_count\"]\n\nwith gzip.open(\n    src / \"player_role_v2_development_cohort.csv.gz\",\n    \"rt\",\n    encoding=\"utf-8\",\n    newline=\"\",\n) as f:\n    reader = csv.DictReader(f)\n    forbidden = {\n        \"owner_id\", \"roster_id\", \"dynasty_team\", \"username\",\n        \"projection\", \"fantasypros\",\n    }\n    headers = [h.lower() for h in (reader.fieldnames\
        \ or [])]\n    assert not any(\n        token in h\n        for h in headers\n        for token in forbidden\n    )\n    checked = 0\n    for row in reader:\n        assert int(row[\"season\"]) <= 2024\n        assert int(row[\"feature_max_week\"]) <= int(row[\"origin_week\"])\n        assert int(row[\"target_min_week\"]) > int(row[\"origin_week\"])\n        checked += 1\n        if checked >= 5000:\n            break\n    assert checked > 0\n\nprint(\"PASS: row-level leakage audit sampled 5,000 development rows.\")\nprint(\"PASS: 2025 holdout remains unopened.\")\nprint(\"PASS: no projections, owners, model fit, weights or tier thresholds.\")\nPY\n"
    - name: Commit B41B reproducibility manifest and audit only
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\nSRC=\"/tmp/player-role-v2-b41b\"\n\ngit fetch origin main\ngit rebase origin/main\n\ncp \"$SRC/player_role_v2_b41b_cohort_audit.json\" \\\n  \"$BASE/player_role_v2_b41b_cohort_audit.json\"\ncp \"$SRC/player_role_v2_b41b_cohort_manifest.json\" \\\n  \"$BASE/player_role_v2_b41b_cohort_manifest.json\"\n\npython3 - <<'PY'\nimport json\nfrom pathlib import Path\n\nbase = Path(\"research/player-role-v2\")\naudit = json.loads(\n    (base / \"player_role_v2_b41b_cohort_audit.json\").read_text()\n)\nmanifest = json.loads(\n    (base / \"player_role_v2_b41b_cohort_manifest.json\").read_text()\n)\n\nreport = [\n    \"# Player Role V2 \u2014 B41B Historical Cohort / Leakage Audit\",\n    \"\",\n    f\"- Development cohort rows: **{audit['cohort_row_count']:,}**\",\n    \"- Development seasons: **2019\u20132024**\",\n    \"- 2025 holdout opened: **No**\",\n    \"- Historical projection features used: **No**\",\n    \"- Model fit performed:\
        \ **No**\",\n    \"- Predictor-target association computed: **No**\",\n    \"- Role weights derived: **No**\",\n    \"- Role thresholds derived: **No**\",\n    \"- Production change authorized: **No**\",\n    \"\",\n    \"## Row counts by position\",\n    \"\",\n]\nfor pos, n in audit[\"row_counts_by_position\"].items():\n    report.append(f\"- {pos}: {n:,}\")\n\nreport += [\n    \"\",\n    \"## Leakage firewall\",\n    \"\",\n    \"- Every feature window ends at or before its origin week.\",\n    \"- Every target window begins strictly after its origin week.\",\n    \"- No fantasy owner, roster ID, dynasty team, or username is present.\",\n    \"- The 2025 holdout is not downloaded or read by B41B.\",\n    \"- Historical Sleeper/FantasyPros projections remain excluded.\",\n    \"\",\n    \"## Target handling\",\n    \"\",\n    (\n        \"B41B stores raw future game components only. It deliberately does \"\n        \"**not** convert those outcomes into the league-scored target\
        \ yet. \"\n        \"The exact scorer must be frozen before any model fitting.\"\n    ),\n    \"\",\n    f\"Development cohort SHA256: `{manifest['cohort_sha256']}`\",\n    f\"Builder SHA256: `{manifest['builder_sha256']}`\",\n    \"\",\n]\n\n(base / \"player_role_v2_b41b_cohort_audit.md\").write_text(\n    \"\\n\".join(report),\n    encoding=\"utf-8\",\n)\nPY\n\ntest \"$(sha256sum index.html | awk '{print $1}')\" = \"$INDEX_SHA_BEFORE\"\ntest \"$(sha256sum free-agent-board.html | awk '{print $1}')\" = \"$FA_SHA_BEFORE\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\ngit add \\\n  \"$BASE/player_role_v2_b41b_cohort_audit.json\" \\\n  \"$BASE/player_role_v2_b41b_cohort_manifest.json\" \\\n  \"$BASE/player_role_v2_b41b_cohort_audit.md\"\n\ngit diff --cached --check\n\nCHANGED=\"$(git diff --cached --name-only | sort)\"\nEXPECTED=\"$(printf '%s\\n%s\\n%s\\n' \\\n  \"$BASE/player_role_v2_b41b_cohort_audit.json\"\
        \ \\\n  \"$BASE/player_role_v2_b41b_cohort_audit.md\" \\\n  \"$BASE/player_role_v2_b41b_cohort_manifest.json\" | sort)\"\ntest \"$CHANGED\" = \"$EXPECTED\"\n\ngit commit -m \"Record Player Role V2 development cohort leakage audit\"\ngit push origin HEAD:main\n"
    - name: Closeout
      shell: bash
      run: 'set -euo pipefail

        echo "B41B V2 CLOSEOUT: PASS_RECTANGULAR_COHORT_AND_LEAKAGE_AUDIT"

        echo "DEVELOPMENT SEASONS: 2019-2024"

        echo "2025 HOLDOUT OPENED: false"

        echo "HISTORICAL PROJECTION FEATURES USED: false"

        echo "MODEL FIT PERFORMED: false"

        echo "PREDICTOR-TARGET ASSOCIATION COMPUTED: false"

        echo "ROLE WEIGHTS DERIVED: false"

        echo "ROLE THRESHOLDS DERIVED: false"

        echo "PRODUCTION CHANGE AUTHORIZED: false"

        echo "NEXT: B41C FREEZE EXACT TARGET SCORER + DEVELOPMENT MODEL PREREGISTRATION"

        '
