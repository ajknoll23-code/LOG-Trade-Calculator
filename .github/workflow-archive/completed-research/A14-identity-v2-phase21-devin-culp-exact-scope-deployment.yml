name: A14 Identity V2 Phase 21 Devin Culp Exact-Scope Deployment

# PATCH_VERSION: FINAL_PAIR_DEVIN_ONLY_DEPLOYMENT_V1

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase21-devin-culp:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact A13 research anchor and post-A12 production baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          result_path=D/"identity_v2_phase20_final_pair_adjudication.json"
          manifest_path=D/"identity_v2_phase20_final_pair_manifest.json"
          candidate_path=D/"identity_v2_phase20_final_pair_direct_candidate_crosswalk.json"

          result=json.loads(result_path.read_text())
          manifest=json.loads(manifest_path.read_text())

          assert result["decision"]==(
              "PASS_IDENTITY_V2_PHASE20_FINAL_PAIR_SHADOW_"
              "AUTHORIZE_A14_EXACT_SCOPE_PASSING_SUBSET_ONLY"
          )
          assert result["status"]=="FINAL_PAIR_SHADOW_COMPLETE"
          assert result["passing_fpids"]==["26440"]
          assert result["held_fpids"]==["26157"]
          assert result["manual_review_count_before"]==2
          assert result["manual_review_count_if_deployed"]==1
          assert result["production_change_authorized"] is False
          assert result["deployment_authorized"] is False
          assert result["research_only"] is True
          assert result["successor_changed_fpids"]==["26440"]
          assert all(result["direct_shadow_gates"].values())
          assert all(result["successor_shadow_gates"].values())

          devin=result["per_player"]["26440"]
          assert devin["name"]=="Devin Culp"
          assert devin["candidate_sleeper_id"]=="11820"
          assert devin["classification"]=="PASS_STABLE_ID_CORROBORATION"
          assert devin["stable_identity_passed"] is True
          assert devin["context_passed"] is True
          assert devin["passed"] is True
          assert all(devin["stable_identity_gates"].values())
          assert all(devin["context_gates"].values())
          assert devin["second_source_row"]["fantasypros_id"]=="26440"
          assert devin["second_source_row"]["sleeper_id"]=="11820"
          assert devin["second_source_row"]["gsis_id"]=="00-0039754"
          assert devin["second_source_row"]["pfr_id"]=="CulpDe00"
          assert devin["second_source_row"]["name"]=="Devin Culp"
          assert devin["second_source_row"]["position"]=="TE"

          jonah=result["per_player"]["26157"]
          assert jonah["name"]=="Jonah Elliss"
          assert jonah["candidate_sleeper_id"]=="11714"
          assert jonah["classification"]==(
              "HOLD_JONAH_ELLISS_IDENTITY_OR_TAXONOMY_EVIDENCE_INCOMPLETE"
          )
          assert jonah["stable_identity_passed"] is False
          assert jonah["context_passed"] is True
          assert jonah["passed"] is False
          assert jonah["second_source_row"] is None

          assert manifest["decision"]==result["decision"]
          assert manifest["passing_fpids"]==["26440"]
          assert manifest["held_fpids"]==["26157"]
          assert manifest["manual_review_count_if_deployed"]==1
          assert manifest["production_change_authorized"] is False
          assert manifest["research_only"] is True

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          for filename,expected in manifest["files"].items():
              path=D/filename
              assert path.exists(),path
              actual=sha(path)
              assert actual==expected,(filename,expected,actual)

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          by={
              str(r["fantasypros_id"]):r
              for r in rows if r.get("fantasypros_id") not in (None,"")
          }
          manual={
              fpid:r for fpid,r in by.items()
              if r.get("requires_manual_review") is True
          }
          assert set(manual)=={"26157","26440"},sorted(manual)

          d=manual["26440"]
          assert d["name"]=="Devin Culp"
          assert d["fp_position"]=="TE"
          assert d["sleeper_id"] is None
          assert str(d["candidate_sleeper_id"])=="11820"
          assert d["sleeper_pos"]=="TE"

          j=manual["26157"]
          assert j["name"]=="Jonah Elliss"
          assert j["fp_position"]=="LB"
          assert j["fp_team"]=="DEN"
          assert j["sleeper_id"] is None
          assert j["candidate_sleeper_id"] is None
          assert j["match_method"]=="name_found_position_incompatible"

          candidate=json.loads(candidate_path.read_text())

          def index(data,label):
              out={}
              for row in data:
                  fpid=row.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  assert fpid not in out,(label,fpid)
                  out[fpid]=row
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          c=index(candidate,"candidate")
          assert set(c)==set(by)
          changed=sorted(
              fpid for fpid in by
              if canon(by[fpid])!=canon(c[fpid])
          )
          assert changed==["26440"],changed

          after=c["26440"]
          assert after["name"]=="Devin Culp"
          assert after["fp_position"]=="TE"
          assert str(after["sleeper_id"])=="11820"
          assert str(after["candidate_sleeper_id"])=="11820"
          assert after["requires_manual_review"] is False
          assert after["match_confidence"]=="high"
          assert after["match_method"]=="phase20_final_pair_stable_id_corroboration"

          assert canon(by["26157"])==canon(c["26157"])
          assert c["26157"]["requires_manual_review"] is True
          assert sum(bool(r.get("requires_manual_review")) for r in candidate)==1

          deployed={
              "26313":"11760","27959":"13457","28290":"13482","26964":"12412",
              "15697":"3369","18557":"6111","20080":"8159",
              "16427":"4040","25668":"11210","26397":"11821",
              "18168":"5781","22887":"12532","23957":"11921",
              "16787":"4435","24181":"8500","26411":"11802"
          }
          for fpid,sid in deployed.items():
              assert str(by[fpid].get("sleeper_id"))==sid,(fpid,by[fpid])
              assert by[fpid].get("requires_manual_review") is False

          print("PASS: exact A13 one-player passing subset and post-A12 baseline guarded.")
          PY

          cp scripts/identity_crosswalk.json \
            "${RUNNER_TEMP}/identity_crosswalk.predeploy.json"

          sha256sum \
            index.html \
            scripts/projections/resolve_fantasypros_sleeper_identity.py \
            research/identity-v2/identity_v2_phase20_final_pair_preregistration.json \
            research/identity-v2/identity_v2_phase20_final_pair_context_snapshot.json \
            research/identity-v2/identity_v2_phase20_final_pair_second_source_snapshot.json \
            research/identity-v2/identity_v2_phase20_final_pair_direct_candidate_crosswalk.json \
            research/identity-v2/identity_v2_phase20_final_pair_control_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase20_final_pair_seeded_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase20_final_pair_adjudication.json \
            research/identity-v2/identity_v2_phase20_final_pair_adjudication.md \
            research/identity-v2/identity_v2_phase20_final_pair_manifest.json \
            > "${RUNNER_TEMP}/immutable.sha256"

          if test -f free-agent-board.html; then
            sha256sum free-agent-board.html >> "${RUNNER_TEMP}/immutable.sha256"
          fi

      - name: Preflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Apply exact Devin Culp passing subset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,shutil
          from collections import defaultdict
          from pathlib import Path

          current_path=Path("scripts/identity_crosswalk.json")
          candidate_path=Path(
              "research/identity-v2/"
              "identity_v2_phase20_final_pair_direct_candidate_crosswalk.json"
          )

          current=json.loads(current_path.read_text())
          candidate=json.loads(candidate_path.read_text())

          def index(rows,label):
              out={}
              for row in rows:
                  fpid=row.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  if fpid in out:
                      raise SystemExit(f"{label}: duplicate FPID {fpid}")
                  out[fpid]=row
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          a=index(current,"current")
          b=index(candidate,"candidate")
          if set(a)!=set(b):
              raise SystemExit("candidate/current FPID universe differs")

          changed=sorted(
              fpid for fpid in a if canon(a[fpid])!=canon(b[fpid])
          )
          if changed!=["26440"]:
              raise SystemExit(
                  f"A14 candidate scope mismatch: expected=['26440'] actual={changed}"
              )

          before=a["26440"]
          after=b["26440"]

          if before.get("name")!="Devin Culp":
              raise SystemExit("Devin Culp baseline name mismatch")
          if before.get("fp_position")!="TE":
              raise SystemExit("Devin Culp baseline position mismatch")
          if before.get("requires_manual_review") is not True:
              raise SystemExit("Devin Culp is not held in production baseline")
          if before.get("sleeper_id") not in (None,""):
              raise SystemExit("Devin Culp unexpectedly authoritative before deployment")
          if str(before.get("candidate_sleeper_id") or "")!="11820":
              raise SystemExit("Devin Culp candidate Sleeper ID drift")

          if after.get("name")!="Devin Culp":
              raise SystemExit("Devin Culp candidate name mismatch")
          if after.get("fp_position")!="TE":
              raise SystemExit("Devin Culp candidate position mismatch")
          if str(after.get("sleeper_id") or "")!="11820":
              raise SystemExit("Devin Culp Sleeper ID mismatch")
          if str(after.get("candidate_sleeper_id") or "")!="11820":
              raise SystemExit("Devin Culp candidate SID mismatch")
          if after.get("requires_manual_review") is not False:
              raise SystemExit("Devin Culp remains manual in candidate")
          if after.get("match_confidence")!="high":
              raise SystemExit("Devin Culp confidence is not high")
          if after.get("match_method")!="phase20_final_pair_stable_id_corroboration":
              raise SystemExit("Devin Culp match method mismatch")

          # Jonah Elliss is the scientifically unresolved persistent hold.
          if canon(a["26157"])!=canon(b["26157"]):
              raise SystemExit("Jonah Elliss row changed in A14 candidate")
          if b["26157"].get("requires_manual_review") is not True:
              raise SystemExit("Jonah Elliss hold was lost")
          if b["26157"].get("sleeper_id") not in (None,""):
              raise SystemExit("Jonah Elliss became authoritative unexpectedly")
          if b["26157"].get("candidate_sleeper_id") not in (None,""):
              raise SystemExit("Jonah Elliss candidate ID changed unexpectedly")

          # No other FPID is permitted to change.
          for fpid in a:
              if fpid=="26440":
                  continue
              if canon(a[fpid])!=canon(b[fpid]):
                  raise SystemExit(f"non-target row changed: {fpid}")

          before_manual=sum(bool(r.get("requires_manual_review")) for r in current)
          after_manual=sum(bool(r.get("requires_manual_review")) for r in candidate)
          if (before_manual,after_manual)!=(2,1):
              raise SystemExit(
                  f"manual-review count mismatch: {before_manual}->{after_manual}"
              )

          by_sid=defaultdict(list)
          for row in candidate:
              sid=row.get("sleeper_id")
              fpid=row.get("fantasypros_id")
              if sid in (None,"") or fpid in (None,"") or row.get("requires_manual_review"):
                  continue
              by_sid[str(sid)].append(str(fpid))
          collisions={
              sid:fpids for sid,fpids in by_sid.items()
              if len(fpids)>1
          }
          if collisions:
              raise SystemExit(f"authoritative SID collision(s): {collisions}")

          shutil.copyfile(candidate_path,current_path)
          print("PASS: installed exact Devin Culp mapping FPID 26440 -> Sleeper 11820.")
          PY

      - name: Regenerate identity-dependent artifacts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path

          root=Path(".")
          resolver_path=root/"scripts/projections/resolve_fantasypros_sleeper_identity.py"
          spec=importlib.util.spec_from_file_location(
              "identity_prod_resolver",resolver_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load production identity resolver")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          rows=json.loads((root/"scripts/identity_crosswalk.json").read_text())
          report=mod.build_production_report(rows)
          report_path=root/"scripts/artifacts/reports/identity_collision_report.md"
          report_path.write_text(report)
          print("PASS: regenerated identity collision report.")
          PY

          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Prove successor resolver preserves Devin and isolates Jonah hold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os
          from collections import defaultdict
          from pathlib import Path

          root=Path(".")
          resolver_path=root/"scripts/projections/resolve_fantasypros_sleeper_identity.py"
          spec=importlib.util.spec_from_file_location(
              "identity_prod_resolver",resolver_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load production identity resolver")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          baseline=json.loads(
              (Path(os.environ["RUNNER_TEMP"])/"identity_crosswalk.predeploy.json").read_text()
          )
          deployed=json.loads((root/"scripts/identity_crosswalk.json").read_text())

          fp_doc=mod.read_json(mod.FP_PATH)
          totals=mod.read_json(mod.SLEEPER_TOTAL_PATH)
          raw=mod.read_json(mod.SLEEPER_RAW_PATH)
          teams=mod.read_json(mod.TEAM_REFRESH_PATH)

          control=mod.build_production_crosswalk(
              fp_doc,totals,raw,teams,baseline
          )
          seeded=mod.build_production_crosswalk(
              fp_doc,totals,raw,teams,deployed
          )

          def index(rows,label):
              out={}
              for row in rows:
                  fpid=row.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  if fpid in out:
                      raise SystemExit(f"{label}: duplicate FPID {fpid}")
                  out[fpid]=row
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          c=index(control,"control")
          s=index(seeded,"seeded")
          if set(c)!=set(s):
              raise SystemExit("successor control/seeded universes differ")

          changed=sorted(
              fpid for fpid in c if canon(c[fpid])!=canon(s[fpid])
          )
          if changed!=["26440"]:
              raise SystemExit(
                  f"successor exact-scope mismatch: expected=['26440'] actual={changed}"
              )

          devin=s["26440"]
          if str(devin.get("sleeper_id") or "")!="11820":
              raise SystemExit("successor lost Devin Culp 26440->11820")
          if devin.get("requires_manual_review") is not False:
              raise SystemExit("successor returned Devin Culp to manual review")
          if devin.get("match_method") not in {
              "previous_authoritative_stable_id_preserved",
              "name_position_team_confirmed",
              "unique_name_position_team_unavailable",
          }:
              # The expected path is stable-ID preservation; retain a narrow
              # allowance for a fresh exact resolver match if current source
              # data becomes even stronger before this workflow runs.
              raise SystemExit(
                  f"unexpected Devin successor match method: {devin.get('match_method')}"
              )

          if s["26157"].get("requires_manual_review") is not True:
              raise SystemExit("Jonah Elliss no longer held")
          if s["26157"].get("sleeper_id") not in (None,""):
              raise SystemExit("Jonah Elliss became authoritative")
          if canon(c["26157"])!=canon(s["26157"]):
              raise SystemExit("Jonah Elliss differs between causal arms")

          prior={
              "26313":"11760","27959":"13457","28290":"13482","26964":"12412",
              "15697":"3369","18557":"6111","20080":"8159",
              "16427":"4040","25668":"11210","26397":"11821",
              "18168":"5781","22887":"12532","23957":"11921",
              "16787":"4435","24181":"8500","26411":"11802",
              "26440":"11820",
          }
          for fpid,sid in prior.items():
              row=s[fpid]
              if str(row.get("sleeper_id") or "")!=sid:
                  raise SystemExit(
                      f"evidence-backed mapping lost in successor: {fpid}->{sid}"
                  )
              if row.get("requires_manual_review") is not False:
                  raise SystemExit(
                      f"evidence-backed mapping returned to manual: {fpid}"
                  )

          by_sid=defaultdict(list)
          for row in seeded:
              sid=row.get("sleeper_id")
              fpid=row.get("fantasypros_id")
              if sid in (None,"") or fpid in (None,"") or row.get("requires_manual_review"):
                  continue
              by_sid[str(sid)].append(str(fpid))
          collisions={
              sid:fpids for sid,fpids in by_sid.items()
              if len(fpids)>1
          }
          if collisions:
              raise SystemExit(f"successor authoritative SID collision(s): {collisions}")

          print("PASS: successor preserves Devin exact pair, all prior mappings, and Jonah hold.")
          PY

      - name: Full post-deployment repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Write Phase 21 Devin Culp deployment confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path

          root=Path(".")
          D=root/"research/identity-v2"
          pre_path=Path(os.environ["RUNNER_TEMP"])/"identity_crosswalk.predeploy.json"
          post_path=root/"scripts/identity_crosswalk.json"

          pre=json.loads(pre_path.read_text())
          post=json.loads(post_path.read_text())

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          def index(rows):
              return {
                  str(r["fantasypros_id"]):r
                  for r in rows if r.get("fantasypros_id") not in (None,"")
              }

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          a=index(pre)
          b=index(post)
          changed=sorted(
              fpid for fpid in a if canon(a[fpid])!=canon(b[fpid])
          )
          if changed!=["26440"]:
              raise SystemExit(
                  f"deployment confirmation scope mismatch: {changed}"
              )

          before_manual=sum(bool(r.get("requires_manual_review")) for r in pre)
          after_manual=sum(bool(r.get("requires_manual_review")) for r in post)
          if (before_manual,after_manual)!=(2,1):
              raise SystemExit(
                  f"manual count mismatch {before_manual}->{after_manual}"
              )

          d=b["26440"]
          if str(d.get("sleeper_id") or "")!="11820":
              raise SystemExit("Devin Culp mapping absent after deployment")
          if d.get("requires_manual_review") is not False:
              raise SystemExit("Devin Culp remains manual after deployment")

          if canon(a["26157"])!=canon(b["26157"]):
              raise SystemExit("Jonah Elliss changed during Devin deployment")
          if b["26157"].get("requires_manual_review") is not True:
              raise SystemExit("Jonah Elliss hold was lost")

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase21-devin-culp-exact-scope-deployment",
              "status":"DEPLOYED_VALIDATED",
              "decision":(
                  "PASS_IDENTITY_V2_PHASE21_DEVIN_CULP_DEPLOYED_"
                  "ONE_TAXONOMY_HOLD_REMAINS"
              ),
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha_before_deployment":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "production_change_applied":True,
              "deployed_mapping_count":1,
              "deployed_mappings":{
                  "26440":{"name":"Devin Culp","sleeper_id":"11820"}
              },
              "changed_fpids":changed,
              "manual_review_count_before":2,
              "manual_review_count_after":1,
              "remaining_manual_review_fpids":["26157"],
              "remaining_hold":{
                  "fantasypros_id":"26157",
                  "name":"Jonah Elliss",
                  "reason":"Stable FPID-to-Sleeper-ID corroboration absent; current evidence remains a cross-provider LB/DE/OLB taxonomy conflict."
              },
              "jonah_elliss_row_byte_identical":True,
              "prior_identity_mappings_preserved":True,
              "production_resolver_source_changed":False,
              "global_position_compatibility_changed":False,
              "predeploy_crosswalk_sha256":sha(pre_path),
              "postdeploy_crosswalk_sha256":sha(post_path),
              "identity_report_sha256":sha(
                  root/"scripts/artifacts/reports/identity_collision_report.md"
              ),
              "team_utility_projection_sha256":sha(
                  root/"scripts/artifacts/generated/team_utility_lineup_projections.json"
              ),
              "team_utility_report_sha256":sha(
                  root/"scripts/artifacts/reports/team_utility_lineup_projection_report.md"
              ),
              "phase20_final_pair_manifest_sha256":sha(
                  D/"identity_v2_phase20_final_pair_manifest.json"
              ),
              "full_repo_regression_passed":True,
              "successor_resolver_exact_scope_passed":True,
              "closure_recommendation":"Freeze Identity V2 with Jonah Elliss as the single explicit unresolved taxonomy hold unless materially new stable-ID evidence appears."
          }

          out_json=D/"identity_v2_phase21_devinculp_deployment_confirmation.json"
          out_md=D/"identity_v2_phase21_devinculp_deployment_confirmation.md"
          manifest=D/"identity_v2_phase21_devinculp_manifest.json"

          out_json.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 21 — Devin Culp Exact-Scope Deployment",
              "",
              f"**Decision:** `{result['decision']}`",
              "",
              "- Devin Culp: FPID `26440` → Sleeper `11820`",
              "- Exact production crosswalk diff: **1 FPID**",
              "- Manual-review count: **2 → 1**",
              "- Jonah Elliss remains held and byte-identical: **Yes**",
              "- Global LB/DL compatibility changed: **No**",
              "- All previously deployed Identity V2 mappings preserved: **Yes**",
              "- Successor exact-scope check: **PASS**",
              "- Team Utility dependent artifacts regenerated: **PASS**",
              "- Full repository regression suite: **PASS**",
              "",
              "The remaining manual row is Jonah Elliss (FPID `26157`). "
              "Phase 20 found matching contextual evidence but no independent "
              "FantasyPros-ID ↔ Sleeper-ID stable bridge, so the scientifically "
              "correct state is to keep that row held."
          ]
          out_md.write_text("\n".join(lines).rstrip()+"\n")

          m={
              "schema_version":1,
              "study_id":result["study_id"],
              "decision":result["decision"],
              "production_change_applied":True,
              "deployed_mapping_count":1,
              "remaining_manual_review_count":1,
              "remaining_manual_review_fpids":["26157"],
              "predeploy_crosswalk_sha256":result["predeploy_crosswalk_sha256"],
              "postdeploy_crosswalk_sha256":result["postdeploy_crosswalk_sha256"],
              "phase20_final_pair_manifest_sha256":result["phase20_final_pair_manifest_sha256"],
              "deployment_confirmation_json_sha256":sha(out_json),
              "deployment_confirmation_md_sha256":sha(out_md),
              "identity_report_sha256":result["identity_report_sha256"],
              "team_utility_projection_sha256":result["team_utility_projection_sha256"],
              "team_utility_report_sha256":result["team_utility_report_sha256"]
          }
          manifest.write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")

          print(json.dumps({
              "decision":result["decision"],
              "changed_fpids":changed,
              "manual_review_count_after":after_manual,
              "remaining_manual_review_fpids":["26157"]
          },indent=2))
          PY

      - name: Prove exact deployment file scope
        shell: bash
