          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/immutable.sha256"

          python3 - <<'PY'
          import subprocess

          allowed={
              "scripts/identity_crosswalk.json",
              "scripts/artifacts/reports/identity_collision_report.md",
              "scripts/artifacts/generated/team_utility_lineup_projections.json",
