              "research/identity-v2/identity_v2_phase21_devinculp_manifest.json"
          }

          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}

          unexpected=touched-allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected A14 deployment file changes: "
                  + ", ".join(sorted(unexpected))
              )

          required={
              "scripts/identity_crosswalk.json",
              "research/identity-v2/identity_v2_phase21_devinculp_deployment_confirmation.json",
              "research/identity-v2/identity_v2_phase21_devinculp_deployment_confirmation.md",
              "research/identity-v2/identity_v2_phase21_devinculp_manifest.json"
          }
          missing=required-touched
          if missing:
              raise SystemExit(
                  "Required A14 deployment files did not change: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: A14 changed only approved production/derived/release files.")
          PY

          git diff --check

      - name: Final regression proof before commit
