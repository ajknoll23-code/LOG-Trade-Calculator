# QF10 — THREE P2 DECISION GATES: no model changes, no market recomputation, no production write.
# QF9 production+Pages green: runs 38177812395 and 38177862776; 13/20 original tickets closed.
name: QF10 Phase 0 - Three P2 Policy and Temporal Coherence Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false

jobs:
  triage:
    name: A1 youth role fallback, A3 package boundary, A6 RB market drift
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout dispatched main without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repo validation HTTP dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
      - name: Verify production QF9 and scientific boundary hashes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'STOP non-main dispatch'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP moved dispatch checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git merge-base --is-ancestor d8a2be0bf1edb8d19e94e2edc5157062f95096f3 HEAD || { echo 'STOP QF9 production ancestry missing'; exit 1; }
          pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP inspected source drift $1"; exit 1; }; }
          pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
          pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
          pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2
          pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
          pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
          pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
          echo 'PASS QF10 exact QF9 production source and protected artifact lineage verified'
      - name: Test actual policy branches against independently defined read-only counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qf10-phase0.js <<'QF10_JS'
          "use strict";
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const market=JSON.parse(fs.readFileSync('scripts/artifacts/generated/market_values.json','utf8'));
          const uncertainty=JSON.parse(fs.readFileSync('scripts/artifacts/generated/value_uncertainty.json','utf8'));
          function section(begin,end){
            const i=html.indexOf(begin);
            assert(i>=0,`MISSING SOURCE ANCHOR ${begin}`);
            assert.equal(html.indexOf(begin,i+begin.length),-1,`AMBIGUOUS SOURCE ANCHOR ${begin}`);
            const j=html.indexOf(end,i+begin.length);
            assert(j>i,`MISSING SOURCE END ${end}`);
            return html.slice(i,j);
          }
          const prod=section('function productionMultiplier(name, role){','function injuryMultiplier(');
          const age=section('function ageMultiplier(pos, age, role, realProduction, rawProduction){','function playerValue(pos, age, role, name){');
          const pv=section('function playerValue(pos, age, role, name){','/* QF2_AGE_DISPLAY_ONLY');
          assert(prod.includes('const roleEstimate = ROLE_MULT[role] ?? 1.0;'),'A1 role estimate fallback changed');
          assert(prod.includes('PROD_MULT.hasOwnProperty(key)'),'A1 genuine observed production test changed');
          assert(pv.includes('const rawRm = PROD_MULT.hasOwnProperty(normKey) ? PROD_MULT[normKey] : null;'),'A1 raw evidence lineage changed');
          assert(pv.includes('effectiveAgeMultiplier(pos, age, role, name, rm, rawRm)'),'A1 age/value input changed');
          const floorStart=age.indexOf('let preFloor;');
          const floorEnd=age.indexOf('const t =',floorStart);
          assert(floorStart>=0 && floorEnd>floorStart,'A1 numeric-vs-missing age floor fragment missing');
          const source=age.slice(floorStart,floorEnd);
          const floor=new Function('realProduction','role',source+'\nreturn preFloor;');
          const roleEstimatedNumeric=floor(1.0,'Starter');
          const actualMissing=floor(null,'Starter');
          assert(Number.isFinite(roleEstimatedNumeric) && Number.isFinite(actualMissing),'A1 floor eval invalid');
          assert(roleEstimatedNumeric>actualMissing,'A1 original age floor semantic gap unexpectedly resolved');
          console.log(`QF10 A1-F01 READ-ONLY: verified actual age branch. Synthetic Starter, roleEstimate=1.0: numeric-path floor=${roleEstimatedNumeric.toFixed(6)} vs missing-real-data floor=${actualMissing.toFixed(6)}. These are age-branch factors, NOT full player FV differences; owner must decide intended policy.`);
          
          const pkgSrc=section('function packageAdjustmentAssessment(){','function packageAdjustmentForTrade(){');
          assert(pkgSrc.includes('packageAssets.length === 3 && packageValues.length === 3'),'A3 V6 exact-three source routing changed');
          assert(pkgSrc.includes('const meaningful = packageValues.filter(v => v >= meaningfulCutoff)'),'A3 meaningful piece definition changed');
          assert(pkgSrc.includes("size3Source = 'V6'"),'A3 V6 provenance not found');
          assert(pkgSrc.includes("size3Source = 'V4'"),'A3 V4 fallback provenance not found');
          // Only exercise ACTUAL PRODUCTION decision function with controlled policy/function stubs.
          // Stubbed multipliers are deliberately not approved scientific magnitudes.
          const context=vm.createContext({
            state:{A:[{type:'player',pos:'RB',value:8295,name:'Target'}],B:[]},
            PACKAGE_ADJUSTMENT_PRODUCTION_V1:{
              enabled:true,supportedPlayerPositions:['QB','RB','WR','TE','DL','LB','DB'],
              meaningfulPieceMinTargetShare:.06,
              size3CompositionEnvelope:{largestMin:0,largestMax:1,middleMin:0,middleMax:1,smallestMin:0,smallestMax:1},
              size3Multiplier:2.0,
            },
            packageAdjustmentSize2Multiplier:()=>1.2,
            packageAdjustmentSize3V6Assessment:()=>({supported:true,multiplier:1.8,compositionProfile:'synthetic',apexLevel:null,apexRatio:null,packageScore:null}),
          });
          vm.runInContext(pkgSrc,context,{timeout:3000});
          const assess=(v)=>{
            context.state.B=v.map((value,i)=>({type:'player',pos:'DL',name:`Fixture${i}`,value}));
            return vm.runInContext('packageAdjustmentAssessment()',context,{timeout:3000});
          };
          const first=assess([5770,4231,2819]);
          const extra=assess([5770,4231,2819,486]);
          assert.equal(first.status,'applied','A3 size-three fixture not applied');
          assert.equal(extra.status,'applied','A3 tiny-fourth fixture not applied');
          assert.equal(first.packageAdjustment.meaningfulCount,3);
          assert.equal(extra.packageAdjustment.meaningfulCount,3);
          assert.equal(first.packageAdjustment.size3Source,'V6');
          assert.equal(extra.packageAdjustment.size3Source,'V4');
          console.log('QF10 A3-F02 READ-ONLY: actual production router chooses V6 for 3 raw meaningful pieces, V4 for same 3 meaningful pieces + tiny fourth. Synthetic multipliers test routing ONLY, not real pricing or approval to extend V6.');
          
          assert(market.scale_semantics==='league_rank_quantile_mapped_to_trade_desk_points_v1','unexpected market schema');
          assert(uncertainty.range_semantics==='sensitivity_envelope_v1_not_probability_interval','unexpected uncertainty schema');
          assert(typeof market.generated_at_utc==='string' && typeof uncertainty.generated_at_utc==='string','A6 dated artifacts missing');
          const marketFn=section('function marketValueForPlayer(name, fundamentalValue){','function marketValueHTML(');
          const uncertaintyFn=section('function valueUncertaintyForPlayer(name, centerValue){','function valueUncertaintyRangeHTML(');
          assert(marketFn.includes('storedFundamental !== Number(fundamentalValue)'),'A6 market FV equality guard changed');
          assert(uncertaintyFn.includes('artifactCenter !== Number(centerValue)'),'A6 uncertainty FV equality guard changed');
          const mr=Object.entries(market.players||{}).filter(([,row])=>row.pos==='RB');
          const ur=Object.entries(uncertainty.players||{}).filter(([,row])=>row.pos==='RB');
          const paired=mr.filter(([key])=>uncertainty.players?.[key]?.pos==='RB');
          const diff=paired.filter(([key,row])=>Number(row.fundamental_value)!==Number(uncertainty.players[key].center_value));
          assert(mr.length>=20 && ur.length>=20 && paired.length>=20,'A6 RB coverage insufficient');
          assert(diff.length>0,'A6 previous cross-artifact dated RB mismatch no longer present; redesign audit');
          console.log(`QF10 A6-F01 READ-ONLY: Market ${market.generated_at_utc}, uncertainty ${uncertainty.generated_at_utc}; RB market=${mr.length}, uncertainty=${ur.length}, paired=${paired.length}, differing dated centers=${diff.length}. This is cross-artifact temporal disagreement, NOT a freshly recomputed live FV delta.`);
          console.log('QF10_PHASE0_GREEN: A1 age-value policy, A3 Package Adjustment raw-shape policy, and A6 RB dated-market consistency independently triaged. NO FV, package geometry, voter evidence, age center, or frozen release changes authorized.');
          QF10_JS
          node --check /tmp/qf10-phase0.js
          node /tmp/qf10-phase0.js
      - name: Preserve frozen valuation and package runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          echo 'PASS existing production regressions, unchanged scientific state'
      - name: Verify exact zero-write read-only outcome
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP changed sources'; exit 1; }
          [[ "$(git hash-object index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
          echo 'QF10 READ_ONLY_GREEN: diagnosis only, no branch, commit, push, deployment or model updates'
