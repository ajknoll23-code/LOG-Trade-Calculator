# QF11 V43 — implementation-ready, review-only disabled source kit.
# No source/production commits, Google calls, participants, redeployments or grants.
name: QF11 V43 - KTC V2 Single Code GS Candidate and Independent Review Kit (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v43-single-code-candidate-read-only
  cancel-in-progress: false
jobs:
  review_kit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Checkout exact commit read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install source-validation dependencies
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests PyYAML
    - name: Pin predecessor, isolated source and production outputs
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_SHA_DRIFT; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_WORKTREE_DIRTY; exit 1; }
        check(){ [[ -f "$1" && "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PIN_DRIFT:$1"; exit 1; }; }
        check .github/workflows/QF11-v40r1.yml a0b103bf7a80c7c33a990fe2962f0b6404ddef27
        check .github/workflows/QF11-v42r1.yml 3eebea3d585908a52b1a78211c2b20b8aa8aa7a9
        check research/ktc-v2-isolated/collector.gs ced5f95d3e34023d37b95cf7029c94ccdcdca483
        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d
        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7
        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a
        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860
        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167
        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        [[ -f data/players_cache.json ]] || { echo STOP_PRODUCTION_CACHE_MISSING; exit 1; }
        echo QF11_V43_EXACT_FROZEN_SOURCE_GREEN
    - name: Run existing isolated synthetic and calculator regressions
      run: |
        set -euo pipefail
        node research/ktc-v2-isolated/collector.test.js
        node research/ktc-v2-isolated/client-bridge.test.js
        node research/ktc-v2-isolated/frame-host.test.js
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V43_FROZEN_REGRESSIONS_GREEN
    - name: Build complete V43 Code.gs review-only from exact V40 components
      run: |
        set -euo pipefail
        mkdir -p /tmp/qf11-v43
        cat > /tmp/qf11-v43/build.py <<'QF11V43BUILD'
        from pathlib import Path
        import hashlib, json, re, subprocess, yaml
        out=Path('/tmp/qf11-v43');out.mkdir(parents=True,exist_ok=True)
        root=Path('research/ktc-v2-isolated')
        collector=(root/'collector.gs').read_text()
        host=(root/'frame-host.gs').read_text()
        frame=(root/'pilot-frame.html').read_text()
        anchor='var start=new Date(now);var expires=new Date(now+30*24*3600*1000);'
        replacement='var start=new Date(now);var expires=new Date(now+28*24*3600*1000);'
        assert collector.count(anchor)==1, 'STOP_UNEXPECTED_RETENTION_SOURCE'
        assert replacement not in collector, 'STOP_ALREADY_PATCHED'
        assert collector.count('function purgeExpiredQF11V2Rows(')==1
        assert 'V39: halt BEFORE attempting any deletion' in collector
        assert 'V39: fail closed if the purge trigger failed' in collector
        assert host.count('function doGet(')==1
        assert host.count('function qf11v33Submit(')==1
        assert host.count('HtmlService.XFrameOptionsMode.ALLOWALL')==1
        assert frame.count('document.referrer')==1
        v40=yaml.safe_load(Path('.github/workflows/QF11-v40r1.yml').read_text())
        steps=v40['jobs']['batch_review']['steps']
        matching=[x['run'] for x in steps if x.get('name')=='Generate single combined Code.gs for existing private Apps Script only']
        assert len(matching)==1, 'STOP_CANNOT_RECOVER_V40_HELPER_SOURCE'
        blob=matching[0]
        start="cat > /tmp/qf11-v40/v40_helpers.gs <<'QF11V40HELPER'\n"
        assert blob.count(start)==1 and blob.count('\nQF11V40HELPER\n')==1, 'STOP_HELPER_ANCHOR_CHANGED'
        helpers=blob.split(start,1)[1].split('\nQF11V40HELPER\n',1)[0]
        assert helpers.count('function qf11v2VerifyDisabledSetup(')==1
        assert helpers.count('function qf11v2VerifyLockedInterface(')==1
        assert helpers.count('function qf11v2InspectDeletionTrigger(')==1
        modified=collector.replace(anchor,replacement)
        assert modified.replace(replacement,anchor)==collector, 'STOP_MULTI_CHANGE'
        code=('/* QF11 V43 REVIEW-ONLY CANDIDATE FOR EXISTING PRIVATE Code.gs\n'
         ' * NEVER deploy automatically. Existing Google project and spreadsheet ONLY.\n'
         ' * Requires independent reviewer acceptance and explicit owner approval.\n'
         ' * Keep all nine QF11_V2_* disabled-state properties literal false.\n'
         ' * This candidate changes V40 collector retention from 30 to 28 days only.\n'
         ' * A 28-day due date plus daily trigger is not proof of strict 30-day deletion.\n'
         ' */\n\n'+modified.rstrip()+'\n\n'+host.rstrip()+'\n\n'+helpers.rstrip()+'\n')
        for name in ['doGet','doPost','purgeExpiredQF11V2Rows','qf11v33Bootstrap','qf11v33Submit','qf11v2VerifyDisabledSetup','qf11v2VerifyLockedInterface','qf11v2InspectDeletionTrigger']:
         assert code.count('function '+name+'(')==1, 'STOP_DUPLICATE_'+name
        assert code.count(replacement)==1 and anchor not in code
        assert 'ScriptApp.newTrigger(' not in code
        assert 'https://script.google.com/macros/s/AKfy' not in code
        (out/'QF11-V43-REVIEW-ONLY-Code.gs.txt').write_text(code)
        (out/'V43-source-manifest.json').write_text(json.dumps({
         'schema':'QF11_V43_REVIEW_ONLY_FULL_CODE_GS',
         'status':'REVIEW_REQUIRED__NO_GOOGLE_CHANGES__PILOT_DISABLED',
         'repository_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
         'candidate_sha256':hashlib.sha256(code.encode()).hexdigest(),
         'source_retention_before_days':30,'candidate_retention_days':28,
         'collector_git_blob':subprocess.check_output(['git','hash-object',str(root/'collector.gs')],text=True).strip(),
         'host_git_blob':subprocess.check_output(['git','hash-object',str(root/'frame-host.gs')],text=True).strip(),
         'source_only_change':'28-day retention timestamp; frame host, handlers and 3 V40 verification helpers retained',
         'owner_existing_project_must_remain_disabled':True,'actual_trigger_execution_verified':False,
         'strict_30_day_deletion_proven':False,'real_rpc_and_origin_verified':False,
         'consent_q4_approved':False,'live_pilot_authorized':False,
         'live_google_calls':0,'live_votes':0,'production_changes':0
        },indent=2,sort_keys=True)+'\n')
        print('QF11_V43_CANDIDATE_READY',len(code.splitlines()),'LINES',hashlib.sha256(code.encode()).hexdigest())
        QF11V43BUILD
        python3 -m py_compile /tmp/qf11-v43/build.py
        python3 /tmp/qf11-v43/build.py
    - name: Check combined Code.gs Node 22 syntax
      run: |
        set -euo pipefail
        node --check < /tmp/qf11-v43/QF11-V43-REVIEW-ONLY-Code.gs.txt
    - name: Run 16 fully synthetic Code.gs owner-only checks
      run: |
        set -euo pipefail
        mkdir -p /tmp/qf11-v43
        cat > /tmp/qf11-v43/smoke.js <<'QF11V43SMOKE'
        "use strict";
        // QF11 V43: synthetic in-memory mock only; zero actual Google calls or participants.
        const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),crypto=require('node:crypto');
        const file='/tmp/qf11-v43/QF11-V43-REVIEW-ONLY-Code.gs.txt';
        const code=fs.readFileSync(file,'utf8');
        new vm.Script(code);
        const FLAGS=['QF11_V2_ENABLED','QF11_V2_HALTED','QF11_V2_CLOSED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'];
        const approvals=FLAGS.filter(x=>!['QF11_V2_HALTED','QF11_V2_CLOSED'].includes(x));
        const H=['received_utc','delete_due_utc','schema','slot','display_order','token_hmac','keep','trade','cut','q1','q2','q3','review_status'];
        const token='QF11_V43_SYNTHETIC_TOKEN_000000000000000000',secret='QF11_V43_SYNTHETIC_SECRET_0000000000000000';
        const digest=crypto.createHmac('sha256',secret).update(token).digest('base64url');
        const NOW=Date.parse('2026-10-13T12:00:00Z'),DAY=86400000;
        let count=0;const cases=[];
        function test(title,fn){fn();count++;cases.push(title);console.log('PASS '+title);}
        function mock(enabled=false){
         const state={rows:[H.slice()],now:NOW,logs:[],locked:false,failDelete:false,mutations:[],triggers:1};
         const p=Object.fromEntries(FLAGS.map(x=>[x,'false']));
         Object.assign(p,{QF11_V2_SHEET_ID:'SYNTHETIC_V2_ONLY',QF11_V1_SHEET_ID:'SYNTHETIC_V1_ONLY',QF11_V2_SEPARATE_SHEET_VERIFIED:'YES',QF11_V2_HMAC_SECRET:secret,QF11_V2_INVITES_JSON:JSON.stringify({[digest]:{slot:1,display_order:0}}),QF11_V2_PLAYER_KEYS_JSON:JSON.stringify(['test_a','test_b','test_c']),QF11_V2_PLAYER_LABELS_JSON:JSON.stringify(['Test A','Test B','Test C'])});
         if(enabled)for(const x of approvals)p[x]='true';
         const properties={getProperty:x=>Object.hasOwn(p,x)?p[x]:null,setProperty:(k,v)=>{p[k]=String(v);state.mutations.push('prop:'+k+':'+v)}};
         const sheet={getLastRow:()=>state.rows.length,getRange:(r,c,n)=>({getValues:()=>state.rows.slice(r-1,r-1+n).map(x=>x.slice(c-1,c-1+H.length))}),getDataRange:()=>({getValues:()=>state.rows.map(x=>x.slice())}),appendRow:x=>{state.mutations.push('append');state.rows.push(x.slice());},deleteRow:i=>{state.mutations.push('delete:'+i);if(state.failDelete)throw Error('SYNTHETIC_DELETE_FAIL');state.rows.splice(i-1,1)}};
         class Clock extends Date{static now(){return state.now;}}
         const env={
          PropertiesService:{getScriptProperties:()=>properties},
          SpreadsheetApp:{openById:id=>{assert.equal(id,'SYNTHETIC_V2_ONLY');return {getSheetByName:n=>n==='Responses'?sheet:null}}},
          ScriptApp:{getProjectTriggers:()=>Array.from({length:state.triggers},()=>({getHandlerFunction:()=> 'purgeExpiredQF11V2Rows'}))},
          LockService:{getScriptLock:()=>({tryLock:()=>{if(state.locked)return false;state.locked=true;return true},releaseLock:()=>{state.locked=false}})},
          Utilities:{computeHmacSha256Signature:(x,s)=>Array.from(crypto.createHmac('sha256',s).update(x).digest()),base64EncodeWebSafe:b=>Buffer.from(b).toString('base64url')},
          ContentService:{MimeType:{JSON:'application/json'},createTextOutput:s=>({getContent:()=>s,setMimeType(){return this}})},
          HtmlService:{createHtmlOutput:s=>({getContent:()=>s}),createHtmlOutputFromFile:s=>({getContent:()=>s,setXFrameOptionsMode(){return this}})},
          Logger:{log:x=>state.logs.push(String(x))},Date:Clock,JSON,Object,Array,String,Number,Set,Error,Math};
         vm.createContext(env);vm.runInContext(code,env,{timeout:4000});
         const payload={schema:'QF11_KTC_V2_PILOT_RESPONSE_V1',participant_token:token,display_order:0,consent:true,adult:true,sf_idp_experience:true,keep:'test_a',trade:'test_b',cut:'test_c',mc:[1,1,0]};
         const post=()=>JSON.parse(env.doPost({postData:{contents:JSON.stringify(payload)}}).getContent()).status;
         return {p,env,state,post,payload};
        }
        test('all nine flags false; existing disabled verifier passes',()=>{const f=mock();assert.equal(f.env.qf11v2VerifyDisabledSetup(),true);assert.equal(f.state.rows.length,1)});
        test('existing interface, bootstrap, RPC, direct POST all disabled',()=>{const f=mock();assert.equal(f.env.qf11v2VerifyLockedInterface(),true);assert.equal(f.state.rows.length,1)});
        test('one expected trigger recognized by existing inspector',()=>{const f=mock();assert.equal(f.env.qf11v2InspectDeletionTrigger(),true);assert(f.state.logs.some(x=>x.includes('One deletion trigger')))});
        test('no trigger recognized as blocker',()=>{const f=mock();f.state.triggers=0;assert.equal(f.env.qf11v2InspectDeletionTrigger(),false)});
        test('disabled manual purge keeps empty sheet empty',()=>{const f=mock();assert.equal(f.env.purgeExpiredQF11V2Rows(),0);assert.equal(f.state.rows.length,1)});
        test('disabled owner checks make no writes',()=>{const f=mock();f.env.qf11v2VerifyDisabledSetup();f.env.qf11v2VerifyLockedInterface();f.env.qf11v2InspectDeletionTrigger();assert.deepEqual(f.state.mutations,[])});
        test('each individual gate cannot authorize alone',()=>{for(const x of approvals){const f=mock();f.p[x]='true';assert.equal(f.post(),'DISABLED',x);assert.equal(f.state.rows.length,1)}});
        test('enabled alone cannot authorize intake',()=>{const f=mock();f.p.QF11_V2_ENABLED='true';assert.equal(f.post(),'DISABLED')});
        test('synthetic authorized receipt expires exactly 28 days after submission',()=>{const f=mock(true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');assert.equal(f.state.rows.length,2);assert.equal(Date.parse(f.state.rows[1][1])-Date.parse(f.state.rows[1][0]),28*DAY)});
        test('synthetic expired 28-day row purges and halts first',()=>{const f=mock(true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now+=28*DAY;assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert.equal(f.state.rows.length,1);assert.equal(f.p.QF11_V2_HALTED,'true');assert(f.state.mutations.indexOf('prop:QF11_V2_HALTED:true')<f.state.mutations.indexOf('delete:2'))});
        test('synthetic unexpired row remains, manual purge 0',()=>{const f=mock(true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now+=27*DAY;assert.equal(f.env.purgeExpiredQF11V2Rows(),0);assert.equal(f.state.rows.length,2)});
        test('synthetic storage deletion failure halts future submissions',()=>{const f=mock(true);f.post();f.state.now+=28*DAY;f.state.failDelete=true;assert.throws(()=>f.env.purgeExpiredQF11V2Rows(),/SYNTHETIC_DELETE_FAIL/);assert.equal(f.p.QF11_V2_HALTED,'true')});
        test('all owner verification helpers remain exactly once',()=>{for(const f of ['qf11v2VerifyDisabledSetup','qf11v2VerifyLockedInterface','qf11v2InspectDeletionTrigger'])assert.equal(code.split('function '+f+'(').length-1,1)});
        test('code contains no trigger installer or real Google URL',()=>{assert(!code.includes('ScriptApp.newTrigger('));assert(!code.includes('script.google.com/macros/s/AKfy'))});
        test('original iframe host text and ALLOWALL stay as before',()=>{const host=fs.readFileSync('research/ktc-v2-isolated/frame-host.gs','utf8');assert(code.includes(host.trim()));assert(host.includes('HtmlService.XFrameOptionsMode.ALLOWALL'));});
        test('full kit has one GET, POST and purge',()=>{for(const n of ['doGet','doPost','purgeExpiredQF11V2Rows'])assert.equal(code.split('function '+n+'(').length-1,1)});
        fs.writeFileSync('/tmp/qf11-v43/synthetic-full-code-tests.json',JSON.stringify({schema:'QF11_V43_FULL_CODE_MOCK_V1',passed:count,cases,actual_google_calls:0,live_votes:0,production_changes:0},null,2)+'\n');
        console.log('QF11_V43_'+count+'_FULL_CODE_SYNTHETIC_TESTS_PASS__NO_GOOGLE_CALLS');
        QF11V43SMOKE
        node --check /tmp/qf11-v43/smoke.js
        node /tmp/qf11-v43/smoke.js
    - name: Publish privacy review request and rollout/rollback instructions
      run: |
        set -euo pipefail
        mkdir -p /tmp/qf11-v43
        cat > /tmp/qf11-v43/report.py <<'QF11V43REPORT'
        from pathlib import Path
        import hashlib, json, subprocess
        out=Path('/tmp/qf11-v43')
        manifest=json.loads((out/'V43-source-manifest.json').read_text())
        test=json.loads((out/'synthetic-full-code-tests.json').read_text())
        assert test['passed']==16
        assert not manifest['live_pilot_authorized'] and not manifest['strict_30_day_deletion_proven']
        (out/'OWNER-ROLLOUT-AND-ROLLBACK.md').write_text('''# QF11 V43 — Owner plan (not authorization)

        **Decision: REVIEW-ONLY; do not install or activate from this workflow.**

        ## What changes if subsequently approved
        - One fully combined **Code.gs** for the **existing** KTC V2 private Apps Script project.
        - Only the response expiry literal changes from 30 days to 28 days; the V39 fail-closed deletion routine, V33 iframe/RPC host and three V40 owner verification helpers remain.
        - Do **not** replace `pilot-frame.html`, change spreadsheet IDs, grant new access, enable triggers, or set any of the nine safety flags to true.
        - The installed daily trigger still needs its **automatic** execution verified separately in Apps Script Executions.

        ## Nonnegotiable blockers before any production/pilot use
        1. Obtain independent written approval of retention design. A 28-day internal deadline creates conditional schedule slack but **does not guarantee** strict deletion at or before day 30 if the trigger fails, logs/exports remain, or other copies exist.
        2. Obtain independent iframe / Google RPC / parent-origin security review. Client `document.referrer` checks plus `ALLOWALL` do **not** authenticate the parent.
        3. Independently approve consent wording, Q1–Q4 review rubric, moderation and comprehensive data-copy deletion SOP.
        4. Verify **one** scheduled purge trigger executed automatically in the actual existing Google project; empty-sheet manual execution is insufficient proof of deletion performance.
        5. Record affirmative owner authorization separately. Do not enable voting, recruit participants, submit ballots or recalibrate Market Value from this workflow.

        ## Only after independent review authorizes a disabled-only source installation
        1. Record/secure the current working `Code.gs` text for rollback in your own private project. Do not publish private tokens or project IDs.
        2. Replace `Code.gs` **in the existing project** with the entire V43 candidate; do not append it to the old file. Leave the current HTML and project/sheet intact.
        3. Save. With all nine gate properties literal `false`, run `qf11v2VerifyDisabledSetup` and `qf11v2VerifyLockedInterface`; both must pass. Confirm the response sheet still has only the header.
        4. Run `qf11v2InspectDeletionTrigger`; it should log exactly one present trigger, but automated execution is still separate.
        5. Verify the locked page remains locked using the **existing** private deployment only if an updated deployment is explicitly approved. No live votes.
        6. If any check fails, restore the previously saved Code.gs, keep flags false, and cease testing until the failure is reviewed. Reverting source does not automatically revert an already updated web app deployment.

        This package does not access Google, modify production values, install triggers, or establish live readiness.
        ''')
        (out/'CLAUDE-REVIEW-PROMPT.md').write_text('''# Independent review request — QF11 V43

        You are asked to perform **independent security, privacy, and code review**, not grant automatic launch authorization.

        ## Files to review
        - `QF11-V43-REVIEW-ONLY-Code.gs.txt` — entire proposed Apps Script for existing private project
        - `V43-source-manifest.json` — source hashes, constraints and explicit unresolved findings
        - `synthetic-full-code-tests.json` — synthetic outcomes only
        - `OWNER-ROLLOUT-AND-ROLLBACK.md` — disabled-only owner deployment and rollback plan
        - Repo `.github/workflows/QF11-v42r1.yml` — predecessor design and 23-source-test green evidence

        ## Questions
        1. Is the candidate a single-line **retention-only** semantic change compared with V40, with no accidental changes to existing RPC/GET/POST/deletion/verification functions?
        2. Does a 28-day due-date plus the installed once-daily Apps Script trigger establish a strict 30-day limit? If not, specify implementable monitoring, failure escalation, and treatment of Q4 notes, logs, backups, exports and raw invitation tokens.
        3. Are the V39 intake/retention failure states safe and fail-closed under lock contention, corrupt dates, partial deletes, misconfigured permissions and script exceptions?
        4. Is `HtmlService.XFrameOptionsMode.ALLOWALL` safe with client-only `document.referrer` screening? Define minimum stronger parent authorization and a nonparticipant real-environment RPC validation plan.
        5. Is the separate moderated Q4 and consent/instrument sufficiently specified to ethically run a 12-user pilot? Identify missing consent and deletion SOP language.
        6. Can the candidate be approved **solely for disabled-only installation** in the *same* existing Google project (not pilot activation), or should source changes be held pending further design?

        ## Decision
        Return exactly one: `APPROVE_DISABLED_ONLY_CODE_SYNC` or `REJECT_WITH_BLOCKERS`.
        Provide specific line-level issues and smallest safe corrections. Do not recommend setting any of the nine flags true, submitting real ballots, creating a second Google project, or changing production valuation.
        ''')
        summary={
         'schema':'QF11_V43_OWNER_REVIEW_READY',
         'decision':'REVIEW_PACKAGE_PASS__HUMAN_APPROVAL_REQUIRED__PILOT_DISABLED',
         'candidate_sha256':manifest['candidate_sha256'],
         'synthetic_test_count':test['passed'],
         'actual_google_calls':0,'production_changes':0,'collector_code_installed':False,
         'reviewer_approved':False,'scheduled_trigger_verified':False,
         'strict_retention_guaranteed':False,'live_pilot_authorized':False,
         'next':'Send candidate plus review prompt for independent review; inspect automatic trigger execution separately.'
        }
        (out/'review-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
        print('QF11_V43_REVIEW_PACKET_READY__PILOT_DISABLED')
        QF11V43REPORT
        python3 -m py_compile /tmp/qf11-v43/report.py
        python3 /tmp/qf11-v43/report.py
    - name: Ensure no repository data or production changes
      run: |
        set -euo pipefail
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_REPO_MUTATED; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_COMMIT_DRIFT; exit 1; }
        echo QF11_V43_REVIEW_ONLY_GREEN__GOOGLE_PILOT_DISABLED
    - name: Upload independent-review artifacts only
      uses: actions/upload-artifact@v4
      with:
        name: QF11-V43-EXISTING-PROJECT-DISABLED-ONLY-REVIEW-KIT
        path: |
          /tmp/qf11-v43/QF11-V43-REVIEW-ONLY-Code.gs.txt
          /tmp/qf11-v43/V43-source-manifest.json
          /tmp/qf11-v43/synthetic-full-code-tests.json
          /tmp/qf11-v43/OWNER-ROLLOUT-AND-ROLLBACK.md
