      - name: Prove B17A research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b17a_v3_")
              or p.startswith("research/draft-capital-outlook-v1/archive/b17a-v3-snapshot-family-integrity/")
              for p in touched
          ),touched
          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B17A V3 mutation scope is research-only.")
          PY

      - name: Commit B17A V3 integrity audit
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17A."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b17a_v3_snapshot_family_integrity_protocol.json \
            research/draft-capital-outlook-v1/b17a_v3_snapshot_family_integrity_result.json \
            research/draft-capital-outlook-v1/b17a_v3_snapshot_family_integrity_summary.json \
            research/draft-capital-outlook-v1/b17a_v3_snapshot_family_integrity_report.md \
            research/draft-capital-outlook-v1/b17a_v3_manifest.json \
            research/draft-capital-outlook-v1/archive/b17a-v3-snapshot-family-integrity/

          git commit -m "Correct Draft Capital Outlook forfeited-pick family audit"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17A V3 integrity audit committed."
