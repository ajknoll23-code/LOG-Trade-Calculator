name: B17A V3 Draft Capital Outlook V1 - Historical Snapshot Family Integrity Audit Forfeiture Fix

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  snapshot_family_integrity_v3:
    name: B17A V3 replay same-date top-60 families with original B17 selection-count semantics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B17A base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" \
            "beautifulsoup4==4.14.2"

      - name: Guard exact B17 scientific stop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b17_manifest.json").read_text())
          s=json.loads((D/"b17_historical_parse_and_target_feasibility_summary.json").read_text())
          p=json.loads((D/"b17_protocol_frozen.json").read_text())

          assert m["decision"]=="STOP_B17_HISTORICAL_PARSE_OR_TARGET_FEASIBILITY_INSUFFICIENT"
          assert m["joint_feasibility_pass"] is False
          assert m["joint_feasible_class_n"]==3
          assert m["b18_target_function_and_power_preregistration_authorized"] is False
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_target_correlation_computed"] is False
          assert m["scalar_target_function_computed"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["joint_feasible_class_years"]==[2017,2018,2023]
          assert s["minimum_joint_feasible_classes_required"]==10
          assert s["b18_target_function_and_power_preregistration_authorized"] is False
          assert s["scientific_firewall"]["predictor_target_correlation_computed"] is False
          assert s["scientific_firewall"]["scalar_target_function_computed"] is False
          assert s["scientific_firewall"]["draft_capital_weight_function_defined"] is False
          assert s["scientific_firewall"]["model_selection_performed"] is False

          assert p["class_years"]==list(range(2014,2026))
          assert p["predictor_contract"]["top_slot_cutoff"]==60
          assert p["feasibility_gate"]["minimum_joint_feasible_classes"]==10
          assert p["strict_non_authority"]["no_predictor_target_correlation"] is True
          assert p["strict_non_authority"]["no_model_fit"] is True

          for name in [
              "b17_protocol_frozen.json",
              "b17_companion_capture.json",
              "b17_projected_parse_summary.json",
              "b17_actual_target_summary.json",
              "b17_historical_parse_and_target_feasibility_summary.json",
              "b17_historical_parse_and_target_feasibility_report.md",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          print("PASS: B17 scientific stop and original 10-class/top-60 gate guarded.")
          PY

      - name: Guard exact B17A V2 structural-count stop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b17a_v2_manifest.json").read_text())
          s=json.loads((D/"b17a_v2_snapshot_family_integrity_summary.json").read_text())

          assert m["decision"]=="STOP_B17A_V2_TOP60_SOURCE_FAMILY_INSUFFICIENT_DO_NOT_RESCUE_B17_WITH_POSTHOC_CUTOFF"
          assert m["integrity_gate_pass"] is False
          assert m["coherent_top60_family_n"]==8
          assert m["b17_v2_implementation_replay_authorized"] is False
          assert m["b18_target_function_and_power_preregistration_authorized"] is False
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_target_correlation_computed"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["coherent_top60_family_n"]==8
          assert s["coherent_class_years"]==[2014,2015,2017,2018,2019,2020,2021,2022]
          assert s["incoherent_class_years"]==[2016,2023,2024,2025]
          assert s["minimum_coherent_top60_families_required"]==10

          for name in [
              "b17a_v2_snapshot_family_integrity_protocol.json",
              "b17a_v2_snapshot_family_integrity_result.json",
              "b17a_v2_snapshot_family_integrity_summary.json",
              "b17a_v2_snapshot_family_integrity_report.md",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          print("PASS: B17A V2 STOP preserved; V3 may correct forfeited-pick page-count semantics only.")
          PY

      - name: Guard exact B17A V1 parser-defect stop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b17a_manifest.json").read_text())
          s=json.loads((D/"b17a_snapshot_family_integrity_summary.json").read_text())

          assert m["decision"]=="STOP_B17A_TOP60_SOURCE_FAMILY_INSUFFICIENT_DO_NOT_RESCUE_B17_WITH_POSTHOC_CUTOFF"
          assert m["integrity_gate_pass"] is False
          assert m["coherent_top60_family_n"]==0
          assert m["b17_v2_implementation_replay_authorized"] is False
          assert m["b18_target_function_and_power_preregistration_authorized"] is False
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_target_correlation_computed"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["decision"]=="STOP_B17A_TOP60_SOURCE_FAMILY_INSUFFICIENT_DO_NOT_RESCUE_B17_WITH_POSTHOC_CUTOFF"
          assert s["coherent_top60_family_n"]==0
          assert s["coherent_class_years"]==[]
          assert s["minimum_coherent_top60_families_required"]==10

          # V1 files remain immutable.
          for name in [
              "b17a_snapshot_family_integrity_protocol.json",
              "b17a_snapshot_family_integrity_result.json",
              "b17a_snapshot_family_integrity_summary.json",
              "b17a_snapshot_family_integrity_report.md",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          print("PASS: B17A V1 STOP preserved; V2 may correct timestamp parsing only.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B17A integrity protocol before network access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b17av3
          python3 - <<'PY'
          import json
          from pathlib import Path

          protocol={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17a_v3_snapshot_family_integrity_protocol",
              "frozen_before_network_access":True,

              "purpose":"Replay B17A after correcting two audit-only implementation defects: the V1 dotted-month timestamp parser and the V2 assumption that every first round contains 32 selections.",

              "implementation_replay_only":True,
              "timestamp_parser_defect":{
                  "v1_behavior":"Regex captured Last update text only until the first period; Sept. therefore truncated the date before day/year parsing.",
                  "v2_correction_retained":"Parse the month/day/year directly from Last update text and allow dotted month abbreviations.",
                  "scientific_rule_changed":False
              },
              "forfeited_pick_audit_defect":{
                  "v2_behavior":"Required at least 16 parsed entries on the Picks 17-32 companion page for every class.",
                  "why_incorrect":"The original B17 protocol required top-60 sequential overall selections and allowed structural missing/forfeited selections; it did not require 32 first-round selections in every class.",
                  "v3_correction":"Permit exactly 15 entries on the Round-1 remainder page only for class years with a pre-anchor, independently documented forfeited first-round selection; require at least 60 combined sequential mock entries across the three same-date pages.",
                  "scientific_rule_changed":False
              },
              "pre_anchor_first_round_forfeiture_exceptions":{
                  "2016":{
                      "team":"New England Patriots",
                      "announced_before_anchor":True,
                      "authority":"NFL.com",
                      "authority_url":"https://www.nfl.com/news/nfl-releases-statement-on-patriots-violations-0ap3000000492190"
                  },
                  "2023":{
                      "team":"Miami Dolphins",
                      "announced_before_anchor":True,
                      "authority":"NFL.com",
                      "authority_url":"https://www.nfl.com/news/dolphins-lose-2023-first-round-draft-pick-owner-stephen-ross-suspended-following"
                  }
              },
              "scientific_design_changes_authorized":False,
              "class_years":list(range(2014,2026)),
              "class_n":12,
              "source_family":"WalterFootball Walt historical mock archive",
              "anchor_window":{
                  "calendar_year":"class_year_minus_1",
                  "start_month_day":"09-15",
                  "end_month_day":"10-15",
                  "target_month_day":"09-30"
              },

              "family_definition":{
                  "required_roles":["base_1_16","round1_17_32","round2_33_plus"],
                  "base_url_patterns":[
                      "https://walterfootball.com/draft{class_year}archiveMMDD.php",
                      "https://walterfootball.com/draft{class_year}archive_MMDD.php"
                  ],
                  "companion_derivation":{
                      "base_1_16":"base URL",
                      "round1_17_32":"insert _1 before .php",
                      "round2_33_plus":"insert _2 before .php"
                  },
                  "all_three_http_2xx_required":True,
                  "all_three_class_year_markers_required":True,
                  "all_three_last_update_dates_required":True,
                  "all_three_last_update_dates_must_match_exactly":True,
                  "shared_last_update_must_be_inside_anchor_window":True,
                  "url_filename_date_is_not_timestamp_evidence":True,
                  "minimum_raw_bytes_each":1000,
                  "base_minimum_entries":16,
                  "round1_remainder_default_minimum_entries":16,
                  "round1_remainder_forfeiture_exception_entries":15,
                  "forfeiture_exception_allowed_class_years":[2016,2023],
                  "minimum_combined_sequential_entries_to_reach_pick60":60,
                  "entry_parser":"All bold labels in document order matching Team: Player, POS, School. Do not rely on malformed OL/LI nesting.",
                  "pick_numbering_semantics":"Sequential overall selections. Concatenate base, Round-1 remainder, then Round 2 in page order; a forfeited first-round slot does not consume an overall selection number.",
                  "top60_cutoff_unchanged":60
              },

              "candidate_discovery":{
                  "archive_index_url_template":"https://walterfootball.com/draft{class_year}archive.php",
                  "extract_both_filename_conventions":True,
                  "evaluate_unique_base_stems_only":True,
                  "deterministic_daily_fallback_if_no_coherent_family_from_index":True,
                  "daily_fallback_dates":"Sep 15 through Oct 15",
                  "selection_rule":"Among coherent full top-60 families, choose the family whose shared Last update date is closest to Sep 30. Tie-break earlier date, then lexicographic base URL.",
                  "selection_uses_outcomes":False,
                  "selection_uses_actual_draft_results":False,
                  "selection_uses_b17_target":False
              },

              "integrity_gate":{
                  "minimum_coherent_top60_families":10,
                  "denominator_classes":12,
                  "pass_decision":"PASS_B17A_V3_SNAPSHOT_FAMILY_INTEGRITY_AUTHORIZE_B17_V2_IMPLEMENTATION_REPLAY_ONLY",
                  "fail_decision":"STOP_B17A_V3_TOP60_SOURCE_FAMILY_INSUFFICIENT_DO_NOT_RESCUE_B17_WITH_POSTHOC_CUTOFF",
                  "b17_v2_authorized_on_pass":True,
                  "b18_authorized_on_pass":False,
                  "c1_authorized_on_pass":False
              },

              "strict_firewall":{
                  "no_change_to_top60_cutoff":True,
                  "no_change_to_10_class_gate":True,
                  "no_second_source":True,
                  "no_predictor_target_correlation":True,
                  "no_scalar_target":True,
                  "no_target_weight_function":True,
                  "no_model_fit":True,
                  "no_model_selection":True,
                  "no_2027_score":True,
                  "no_production_change":True
              },

              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }

          Path("/tmp/b17av3/protocol.json").write_text(
              json.dumps(protocol,indent=2,sort_keys=True)+"\n"
          )
          assert protocol["integrity_gate"]["minimum_coherent_top60_families"]==10
          assert protocol["family_definition"]["top60_cutoff_unchanged"]==60
          assert protocol["family_definition"]["minimum_combined_sequential_entries_to_reach_pick60"]==60
          assert protocol["family_definition"]["forfeiture_exception_allowed_class_years"]==[2016,2023]
          assert protocol["pre_anchor_first_round_forfeiture_exceptions"]["2016"]["announced_before_anchor"] is True
          assert protocol["pre_anchor_first_round_forfeiture_exceptions"]["2023"]["announced_before_anchor"] is True
          print("PASS: B17A V3 source-integrity protocol frozen before network access.")
          PY

      - name: Audit same-date top-60 snapshot families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/archive/b17a-v3-snapshot-family-integrity
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,re,time
          from datetime import date,timedelta,datetime,timezone
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          A=D/"archive/b17a-v3-snapshot-family-integrity"
          RAW=A/"selected"
          META=A/"metadata"
          IDX=A/"indexes"
          for p in (RAW,META,IDX):
              p.mkdir(parents=True,exist_ok=True)

          P=json.loads(Path("/tmp/b17av3/protocol.json").read_text())

          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B17A/1.0 (+snapshot family integrity audit)",
              "Accept":"text/html,*/*;q=0.5",
              "Accept-Language":"en-US,en;q=0.9",
              "Accept-Encoding":"identity"
          })

          MONTHS={
              "jan":1,"january":1,"feb":2,"february":2,"mar":3,"march":3,
              "apr":4,"april":4,"may":5,"jun":6,"june":6,"jul":7,"july":7,
              "aug":8,"august":8,"sep":9,"sept":9,"september":9,
              "oct":10,"october":10,"nov":11,"november":11,"dec":12,"december":12
          }

          label_rx=re.compile(
              r"^\s*(?P<team>[^:]{2,100}):\s*(?P<player>.+?),\s*(?P<pos>[A-Za-z0-9/-]{1,15}),\s*(?P<school>.+?)\s*$"
          )

          def get(url):
              attempts=[]
              resp=None
              error=None
              for i,delay in enumerate([0,2,6],start=1):
                  if delay: time.sleep(delay)
                  try:
                      t0=time.time()
                      resp=session.get(url,timeout=45,allow_redirects=True)
                      attempts.append({
                          "attempt":i,
                          "status_code":int(resp.status_code),
                          "elapsed_seconds":round(time.time()-t0,3),
                          "final_url":resp.url
                      })
                      if resp.status_code not in {429,500,502,503,504}:
                          break
                  except Exception as e:
                      error=f"{type(e).__name__}: {e}"
                      attempts.append({"attempt":i,"error":error})
              return resp,attempts,error

          def decode(resp):
              enc=resp.encoding or "utf-8"
              try:
                  return resp.content.decode(enc,errors="replace")
              except LookupError:
                  return resp.content.decode("utf-8",errors="replace")

          def parse_month_date(text):
              rx=re.compile(
                  r"\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
                  r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                  r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)(20\d{2})\b",
                  re.I
              )
              m=rx.search(text)
              if not m:
                  return None
              key=m.group(1).lower().rstrip(".")
              try:
                  return date(int(m.group(3)),MONTHS[key],int(m.group(2)))
              except ValueError:
                  return None

          def last_update_date(html):
              soup=BeautifulSoup(html,"html.parser")
              candidates=[]
              meta=soup.find("meta",attrs={"name":"description"})
              if meta and meta.get("content"):
                  candidates.append(str(meta["content"]))
              og=soup.find("meta",attrs={"property":"og:description"})
              if og and og.get("content"):
                  candidates.append(str(og["content"]))
              twitter=soup.find("meta",attrs={"name":"twitter:description"})
              if twitter and twitter.get("content"):
                  candidates.append(str(twitter["content"]))
              candidates.append(" ".join(soup.get_text(" ",strip=True).split())[:15000])

              # V2 fix: parse the date itself rather than truncating at the first
              # period. This correctly handles dotted abbreviations such as Sept.
              rx=re.compile(
                  r"Last\s+update\s*:\s*"
                  r"(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)?"
                  r"\s*,?\s*"
                  r"(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
                  r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                  r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)(20\d{2})\b",
                  re.I
              )
              for text in candidates:
                  m=rx.search(text)
                  if not m:
                      continue
                  key=m.group(1).lower().rstrip(".")
                  try:
                      return date(int(m.group(3)),MONTHS[key],int(m.group(2)))
                  except ValueError:
                      continue
              return None

          def parse_entries(html):
              soup=BeautifulSoup(html,"html.parser")
              rows=[]
              seen_labels=set()
              for b in soup.find_all("b"):
                  txt=" ".join(b.get_text(" ",strip=True).replace("\xa0"," ").split())
                  m=label_rx.match(txt)
                  if not m:
                      continue
                  key=(m.group("team"),m.group("player"),m.group("pos"),m.group("school"))
                  if key in seen_labels:
                      continue
                  seen_labels.add(key)
                  rows.append({
                      "team":" ".join(m.group("team").split()),
                      "player":" ".join(m.group("player").split()),
                      "position_raw":" ".join(m.group("pos").split()).upper(),
                      "school":" ".join(m.group("school").split())
                  })
              return rows

          def derive_urls(base):
              assert base.lower().endswith(".php")
              stem=base[:-4]
              return {
                  "base_1_16":base,
                  "round1_17_32":stem+"_1.php",
                  "round2_33_plus":stem+"_2.php"
              }

          def inspect_page(url,year):
              resp,attempts,error=get(url)
              out={
                  "url":url,
                  "attempts":attempts,
                  "error":error,
                  "http_status":int(resp.status_code) if resp is not None else None,
                  "final_url":resp.url if resp is not None else None,
                  "raw_bytes":len(resp.content) if resp is not None else 0,
                  "last_update_date":None,
                  "class_year_marker":False,
                  "entry_n":0,
                  "raw":None
              }
              if resp is None or not (200<=resp.status_code<300) or len(resp.content)<1000:
                  return out
              html=decode(resp)
              txt=" ".join(BeautifulSoup(html,"html.parser").get_text(" ",strip=True).split())
              out["last_update_date"]=(
                  last_update_date(html).isoformat()
                  if last_update_date(html) else None
              )
              out["class_year_marker"]=f"{year} NFL Mock Draft".lower() in txt.lower()
              out["entry_n"]=len(parse_entries(html))
              out["raw"]=resp.content
              return out

          def evaluate_family(base,year,ws,we):
              urls=derive_urls(base)
              pages={role:inspect_page(url,year) for role,url in urls.items()}
              dates=[
                  date.fromisoformat(v["last_update_date"])
                  for v in pages.values()
                  if v["last_update_date"]
              ]
              all_dates_present=len(dates)==3
              same_date=all_dates_present and len(set(dates))==1
              shared=dates[0] if same_date else None

              base_n=pages["base_1_16"]["entry_n"]
              r1_n=pages["round1_17_32"]["entry_n"]
              r2_n=pages["round2_33_plus"]["entry_n"]
              forfeiture_exception_used=(
                  year in {2016,2023}
                  and r1_n==15
              )
              round1_structure_valid=(
                  r1_n>=16
                  or forfeiture_exception_used
              )
              combined_sequential_entry_n=base_n+r1_n+r2_n

              coherent=(
                  all(v["http_status"] is not None and 200<=v["http_status"]<300 for v in pages.values())
                  and all(v["raw_bytes"]>=1000 for v in pages.values())
                  and all(v["class_year_marker"] for v in pages.values())
                  and same_date
                  and ws<=shared<=we
                  and base_n>=16
                  and round1_structure_valid
                  and combined_sequential_entry_n>=60
              )
              return {
                  "base_url":base,
                  "forfeiture_exception_used":forfeiture_exception_used,
                  "combined_sequential_entry_n":combined_sequential_entry_n,
                  "pages":{
                      k:{kk:vv for kk,vv in v.items() if kk!="raw"}
                      for k,v in pages.items()
                  },
                  "shared_last_update_date":shared.isoformat() if shared else None,
                  "coherent_top60_family":coherent,
                  "_raw_pages":{k:v["raw"] for k,v in pages.items()}
              }

          # Regression tests for the exact V1 defect and normal month spellings.
          assert last_update_date('<meta name="description" content="Last update: Thursday, Sept. 29, 2016. Major changes.">').isoformat()=="2016-09-29"
          assert last_update_date('<meta property="og:description" content="Last update: Wednesday, Oct. 2, 2013. Major changes.">').isoformat()=="2013-10-02"
          assert last_update_date('<meta name="twitter:description" content="Last update: Wednesday, September 30, 2015.">').isoformat()=="2015-09-30"

          all_results=[]
          started=datetime.now(timezone.utc).isoformat()

          for year in P["class_years"]:
              anchor_year=year-1
              ws=date(anchor_year,9,15)
              we=date(anchor_year,10,15)
              target=date(anchor_year,9,30)

              index_url=P["candidate_discovery"]["archive_index_url_template"].format(class_year=year)
              idx_resp,idx_attempts,idx_error=get(index_url)
              idx_raw=idx_resp.content if idx_resp is not None else b""
              idx_path=IDX/f"{year}.html"
              if idx_resp is not None:
                  idx_path.write_bytes(idx_raw)

              bases=[]
              if idx_resp is not None and 200<=idx_resp.status_code<300:
                  html=decode(idx_resp)
                  patterns=[
                      re.compile(rf'href=["\']([^"\']*draft{year}archive\d{{4}}\.php)["\']',re.I),
                      re.compile(rf'href=["\']([^"\']*draft{year}archive_\d{{4}}\.php)["\']',re.I)
                  ]
                  for pat in patterns:
                      for href in pat.findall(html):
                          u=urljoin(idx_resp.url,href)
                          if u not in bases:
                              bases.append(u)

              families=[]
              evaluated=set()
              for base in bases:
                  if base in evaluated: continue
                  evaluated.add(base)
                  families.append(evaluate_family(base,year,ws,we))

              coherent=[f for f in families if f["coherent_top60_family"]]
              fallback_used=False

              if not coherent:
                  fallback_used=True
                  d=ws
                  while d<=we:
                      mmdd=d.strftime("%m%d")
                      for base in [
                          f"https://walterfootball.com/draft{year}archive{mmdd}.php",
                          f"https://walterfootball.com/draft{year}archive_{mmdd}.php",
                      ]:
                          if base in evaluated:
                              continue
                          evaluated.add(base)
                          fam=evaluate_family(base,year,ws,we)
                          families.append(fam)
                          if fam["coherent_top60_family"]:
                              coherent.append(fam)
                      d+=timedelta(days=1)

              selected=None
              if coherent:
                  selected=min(
                      coherent,
                      key=lambda f:(
                          abs((date.fromisoformat(f["shared_last_update_date"])-target).days),
                          date.fromisoformat(f["shared_last_update_date"]),
                          f["base_url"]
                      )
                  )

              selected_files={}
              if selected:
                  shared=selected["shared_last_update_date"].replace("-","")
                  for role,raw in selected["_raw_pages"].items():
                      assert raw is not None
                      p=RAW/f"{year}_{shared}_{role}.html"
                      p.write_bytes(raw)
                      selected_files[role]={
                          "path":str(p),
                          "sha256":hashlib.sha256(raw).hexdigest(),
                          "bytes":len(raw)
                      }

              # Strip transient raw bytes before metadata persistence.
              public_families=[]
              for fam in families:
                  fam=dict(fam)
                  fam.pop("_raw_pages",None)
                  public_families.append(fam)

              out={
                  "schema_version":1,
                  "class_year":year,
                  "anchor_window_start":ws.isoformat(),
                  "anchor_window_end":we.isoformat(),
                  "target_date":target.isoformat(),
                  "archive_index_url":index_url,
                  "archive_index_http_status":int(idx_resp.status_code) if idx_resp is not None else None,
                  "archive_index_final_url":idx_resp.url if idx_resp is not None else None,
                  "archive_index_attempts":idx_attempts,
                  "archive_index_error":idx_error,
                  "archive_index_path":str(idx_path) if idx_resp is not None else None,
                  "archive_index_sha256":hashlib.sha256(idx_raw).hexdigest() if idx_raw else None,
                  "index_candidate_base_n":len(bases),
                  "fallback_used":fallback_used,
                  "evaluated_family_n":len(families),
                  "coherent_family_n":len(coherent),
                  "selected_base_url":selected["base_url"] if selected else None,
                  "selected_shared_last_update_date":selected["shared_last_update_date"] if selected else None,
                  "selected_distance_days":(
                      abs((date.fromisoformat(selected["shared_last_update_date"])-target).days)
                      if selected else None
                  ),
                  "selected_files":selected_files,
                  "coherent_top60_family_available":selected is not None,
                  "family_diagnostics":public_families,
                  "predictor_target_correlation_computed":False,
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }
              (META/f"{year}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
              all_results.append(out)

          result={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17a_v3_snapshot_family_integrity_result",
              "started_utc":started,
              "finished_utc":datetime.now(timezone.utc).isoformat(),
              "classes":all_results,
              "predictor_target_correlation_computed":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          Path("/tmp/b17av3/result.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "coherent_n":sum(x["coherent_top60_family_available"] for x in all_results),
              "coherent_years":[x["class_year"] for x in all_results if x["coherent_top60_family_available"]]
          },indent=2))
          PY

      - name: Apply unchanged 10-class integrity threshold
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,statistics
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads(Path("/tmp/b17av3/protocol.json").read_text())
          R=json.loads(Path("/tmp/b17av3/result.json").read_text())

          good=[x for x in R["classes"] if x["coherent_top60_family_available"]]
          n=len(good)
          required=P["integrity_gate"]["minimum_coherent_top60_families"]
          passed=n>=required
          decision=(
              P["integrity_gate"]["pass_decision"]
              if passed else P["integrity_gate"]["fail_decision"]
          )
          distances=[x["selected_distance_days"] for x in good]

          summary={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17a_v3_snapshot_family_integrity_summary",
              "decision":decision,
              "integrity_gate_pass":passed,
              "candidate_class_n":12,
              "minimum_coherent_top60_families_required":10,
              "coherent_top60_family_n":n,
              "coherent_class_years":[x["class_year"] for x in good],
              "incoherent_class_years":[x["class_year"] for x in R["classes"] if not x["coherent_top60_family_available"]],
              "median_selected_distance_days":statistics.median(distances) if distances else None,
              "max_selected_distance_days":max(distances) if distances else None,
              "selected_families":{
                  str(x["class_year"]):{
                      "base_url":x["selected_base_url"],
                      "shared_last_update_date":x["selected_shared_last_update_date"],
                      "distance_days":x["selected_distance_days"],
                      "selected_files":x["selected_files"]
                  } for x in good
              },
              "b17_v2_implementation_replay_authorized":passed,
              "b18_target_function_and_power_preregistration_authorized":False,
              "c1_model_preregistration_authorized":False,
              "predictor_target_correlation_computed":False,
              "scalar_target_function_computed":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "scientific_note":"B17A audits timestamp coherence and top-60 source coverage only. It does not alter B17's failed result unless the unchanged 10-class source-integrity threshold is independently satisfied."
          }

          (D/"b17a_v3_snapshot_family_integrity_protocol.json").write_bytes(
              Path("/tmp/b17av3/protocol.json").read_bytes()
          )
          (D/"b17a_v3_snapshot_family_integrity_result.json").write_bytes(
              Path("/tmp/b17av3/result.json").read_bytes()
          )
          (D/"b17a_v3_snapshot_family_integrity_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(summary,indent=2))
          PY

      - name: Validate B17A firewall and selected raw hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads((D/"b17a_v3_snapshot_family_integrity_protocol.json").read_text())
          R=json.loads((D/"b17a_v3_snapshot_family_integrity_result.json").read_text())
          S=json.loads((D/"b17a_v3_snapshot_family_integrity_summary.json").read_text())

          assert P["frozen_before_network_access"] is True
          assert P["scientific_design_changes_authorized"] is False
          assert P["class_years"]==list(range(2014,2026))
          assert P["integrity_gate"]["minimum_coherent_top60_families"]==10
          assert P["family_definition"]["top60_cutoff_unchanged"]==60
          assert P["family_definition"]["minimum_combined_sequential_entries_to_reach_pick60"]==60
          assert P["family_definition"]["forfeiture_exception_allowed_class_years"]==[2016,2023]
          assert P["strict_firewall"]["no_change_to_top60_cutoff"] is True
          assert P["strict_firewall"]["no_change_to_10_class_gate"] is True
          assert P["strict_firewall"]["no_second_source"] is True
          assert P["strict_firewall"]["no_predictor_target_correlation"] is True
          assert P["strict_firewall"]["no_model_fit"] is True

          assert len(R["classes"])==12
          assert len({x["class_year"] for x in R["classes"]})==12

          for x in R["classes"]:
              assert x["predictor_target_correlation_computed"] is False
              assert x["predictor_fit_performed"] is False
              assert x["2027_class_scored"] is False
              assert x["production_change_authorized"] is False
              if x["coherent_top60_family_available"]:
                  assert len(x["selected_files"])==3
                  for role,v in x["selected_files"].items():
                      p=Path(v["path"])
                      assert p.is_file(),p
                      assert hashlib.sha256(p.read_bytes()).hexdigest()==v["sha256"]

          assert S["b18_target_function_and_power_preregistration_authorized"] is False
          assert S["c1_model_preregistration_authorized"] is False
          assert S["predictor_target_correlation_computed"] is False
          assert S["scalar_target_function_computed"] is False
          assert S["predictor_fit_performed"] is False
          assert S["2027_class_scored"] is False
          assert S["production_change_authorized"] is False

          if S["integrity_gate_pass"]:
              assert S["coherent_top60_family_n"]>=10
              assert S["decision"]=="PASS_B17A_V3_SNAPSHOT_FAMILY_INTEGRITY_AUTHORIZE_B17_V2_IMPLEMENTATION_REPLAY_ONLY"
              assert S["b17_v2_implementation_replay_authorized"] is True
          else:
              assert S["coherent_top60_family_n"]<10
              assert S["decision"]=="STOP_B17A_V3_TOP60_SOURCE_FAMILY_INSUFFICIENT_DO_NOT_RESCUE_B17_WITH_POSTHOC_CUTOFF"
              assert S["b17_v2_implementation_replay_authorized"] is False

          print("PASS: B17A V3 source-integrity evidence and authority firewall validated.")
          PY

