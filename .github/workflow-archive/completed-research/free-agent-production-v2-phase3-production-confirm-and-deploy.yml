name: Free Agent Production V2 Phase 3 Confirm and Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  confirm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"
          python3 - <<'PY'
          import requests
          print("requests import PASS:", requests.__version__)
          PY

      - name: Guard frozen research and clean repository
        shell: bash
        run: |
          set -euo pipefail

          required=(
            research/free-agent-production-v2/free_agent_production_v2_phase1.json
            research/free-agent-production-v2/free_agent_production_v2_phase1.py
            research/free-agent-production-v2/phase1_manifest.json
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.json
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.py
            research/free-agent-production-v2/phase2_manifest.json
            free-agent-board.html
            index.html
            data/free_agents.json
            data/league_rosters.json
            scripts/sync/sync_free_agent_valuation.py
            scripts/validation/validate_free_agent_valuation_parity.py
            scripts/validation/repo_regression_checks.py
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required input: $f"; exit 1; }
          done

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"

          new_files=(
            model/releases/free-agent-production-v2/release.json
            scripts/model/apply_free_agent_production_v2_release.py
            research/free-agent-production-v2/phase3_production_confirmation.json
            research/free-agent-production-v2/phase3_production_confirmation.md
            research/free-agent-production-v2/phase3_manifest.json
          )
          for f in "${new_files[@]}"; do
            test ! -e "$f" || {
              echo "Refusing to overwrite existing Phase 3/release artifact: $f"
              exit 1
            }
          done

          if grep -q "FREE_AGENT_PRODUCTION_V2_RELEASE_START" free-agent-board.html; then
            echo "Free-Agent Production V2 release block is already present; refusing duplicate deployment."
            exit 1
          fi

          git rev-parse HEAD | tee "${RUNNER_TEMP}/starting_sha.txt"

          sha256sum \
            index.html \
            data/free_agents.json \
            data/league_rosters.json \
            > "${RUNNER_TEMP}/phase3-immutable-production-inputs.sha256"

      - name: Preflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Verify Phase 1 and Phase 2 frozen lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          research = root / "research" / "free-agent-production-v2"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p1 = json.loads((research / "free_agent_production_v2_phase1.json").read_text())
          m1 = json.loads((research / "phase1_manifest.json").read_text())
          p2 = json.loads((research / "free_agent_production_v2_phase2_shadow.json").read_text())
          m2 = json.loads((research / "phase2_manifest.json").read_text())

          assert p1["decision"] == "PASS_FA_PROD_V2_PHASE1_LINEAGE_AND_FREEZE"
          assert p2["decision"] == "PASS_FA_PROD_V2_PHASE2_SHADOW_VALIDATION"
          assert p1["production_change_authorized"] is False
          assert p2["production_change_authorized"] is False

          for rel, expected in m1["output_sha256"].items():
              path = root / rel
              assert path.exists(), rel
              assert sha(path) == expected, f"Phase 1 frozen output drift: {rel}"

          for rel, expected in m2["output_sha256"].items():
              path = root / rel
              assert path.exists(), rel
              assert sha(path) == expected, f"Phase 2 frozen output drift: {rel}"

          # The valuation engine and historical FA production table must remain
          # the exact frozen Phase-1 bytes. data/free_agents.json is intentionally
          # NOT frozen here: it is a live Sleeper snapshot and may refresh between
          # research freeze and deployment. A dedicated current-snapshot transport
          # validation below proves the frozen candidate is still safe on today's
          # rendered population.
          for rel in ("free-agent-board.html", "index.html"):
              expected = p1["input_sha256"][rel]
              actual = sha(root / rel)
              assert actual == expected, (
                  f"Frozen valuation/input drift since Phase 1: {rel}: "
                  f"{actual} != {expected}"
              )

          current_fa_sha = sha(root / "data/free_agents.json")
          frozen_fa_sha = p1["input_sha256"]["data/free_agents.json"]
          print("Frozen free_agents.json SHA:", frozen_fa_sha)
          print("Current free_agents.json SHA:", current_fa_sha)
          print("Live Sleeper snapshot drift allowed; transport validation required.")

          assert p1["counts"]["active_non_k_deployed_entries"] == 364
          assert p1["counts"]["reproducible_candidates"] == 333
          assert p2["phase1"]["active_count"] == 364
          assert p2["phase1"]["candidate_count"] == 333
          assert p2["phase1"]["unresolved_held_count"] == 31

          print("PASS: frozen Phase 1/2 lineage and production inputs are intact.")
          PY

      - name: Revalidate frozen V2 candidate on current Sleeper snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(".")
          scripts = root / "scripts"
          validation = scripts / "validation"
          if str(scripts) not in sys.path:
              sys.path.insert(0, str(scripts))
          if str(validation) not in sys.path:
              sys.path.insert(0, str(validation))

          import validate_free_agent_valuation_parity as fa_validator
          from sync import sync_free_agent_valuation as sync_mod

          research = root / "research" / "free-agent-production-v2"
          phase1 = json.loads(
              (research / "free_agent_production_v2_phase1.json").read_text()
          )
          phase2 = json.loads(
              (research / "free_agent_production_v2_phase2_shadow.json").read_text()
          )
          free_doc = json.loads((root / "data/free_agents.json").read_text())
          board_text = (root / "free-agent-board.html").read_text()

          # Load the frozen Phase-2 helpers. Do not modify the frozen evaluator.
          phase2_script = research / "free_agent_production_v2_phase2_shadow.py"
          spec = importlib.util.spec_from_file_location(
              "fa_v2_phase2_transport", phase2_script
          )
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          frozen_rows = list(phase1["rows"])
          frozen_active_ids = {str(r["sleeper_id"]) for r in frozen_rows}
          candidates = [
              r for r in frozen_rows if r.get("candidate_prod") is not None
          ]
          candidate_ids = {str(r["sleeper_id"]) for r in candidates}
          frozen_held_ids = frozen_active_ids - candidate_ids

          assert len(frozen_active_ids) == 364
          assert len(candidate_ids) == 333
          assert len(frozen_held_ids) == 31

          # Current board/parity must be healthy before transport.
          parity = fa_validator.validate()
          assert parity["status"] == "PASS"
          assert int(parity["roster_overlap"]) == 0

          current_runtime = fa_validator._board_runtime_rows(board_text, free_doc)
          current_by_id = mod.attach_sleeper_ids(
              current_runtime["rows"], free_doc, fa_validator
          )

          # Apply the exact frozen candidate in memory to today's board + today's
          # free-agent population. The underlying FA table/engine is still frozen.
          shadow_board = mod.inject_shadow_overrides(
              board_text, candidates, sync_mod
          )
          shadow_runtime = fa_validator._board_runtime_rows(shadow_board, free_doc)
          shadow_by_id = mod.attach_sleeper_ids(
              shadow_runtime["rows"], free_doc, fa_validator
          )

          current_sources = {
              str(k): str(v)
              for k, v in current_runtime["production_source_by_id"].items()
          }
          shadow_sources = {
              str(k): str(v)
              for k, v in shadow_runtime["production_source_by_id"].items()
          }
          assert current_sources == shadow_sources, (
              "Current-snapshot shadow changed production-source classification"
          )

          tracked = {"QB", "RB", "WR", "TE", "DL", "LB", "DB"}
          current_active_fa_specific = {
              sid
              for sid, source in current_sources.items()
              if source == "fa_specific_prod"
              and current_by_id.get(sid, {}).get("pos") in tracked
          }

          removed_from_current_active = sorted(
              frozen_active_ids - current_active_fa_specific
          )
          added_to_current_active = sorted(
              current_active_fa_specific - frozen_active_ids
          )

          # Only currently-rendered frozen candidates can affect today's board.
          rendered_candidate_ids = candidate_ids & set(current_by_id)
          rendered_held_ids = frozen_held_ids & set(current_by_id)

          candidate_by_id = {
              str(r["sleeper_id"]): r for r in candidates
          }

          metadata_fields = ("name", "pos", "team", "age", "role", "hasRealData")
          metadata_violations = []
          monotonicity_violations = []
          invalid_values = []
          noncandidate_changed = []

          for sid in sorted(current_by_id):
              old = current_by_id[sid]
              new = shadow_by_id[sid]

              if sid not in rendered_candidate_ids:
                  if int(old["val"]) != int(new["val"]):
                      noncandidate_changed.append({
                          "sleeper_id": sid,
                          "name": old["name"],
                          "pos": old["pos"],
                          "current_fv": int(old["val"]),
                          "shadow_fv": int(new["val"]),
                      })
                  continue

              changed_meta = [
                  field for field in metadata_fields
                  if old.get(field) != new.get(field)
              ]
              if changed_meta:
                  metadata_violations.append({
                      "sleeper_id": sid,
                      "fields": changed_meta,
                  })

              if not isinstance(new.get("val"), int) or int(new["val"]) <= 0:
                  invalid_values.append(sid)

              frozen = candidate_by_id[sid]
              prod_delta = (
                  float(frozen["candidate_prod"])
                  - float(frozen["deployed_prod"])
              )
              fv_delta = int(new["val"]) - int(old["val"])
              eps = 1e-12
              if (
                  (prod_delta > eps and fv_delta < 0)
                  or (prod_delta < -eps and fv_delta > 0)
              ):
                  monotonicity_violations.append({
                      "sleeper_id": sid,
                      "prod_delta": prod_delta,
                      "fv_delta": fv_delta,
                  })

          assert not noncandidate_changed, (
              "Frozen candidate caused current-snapshot spillover to non-candidates: "
              + json.dumps(noncandidate_changed[:20], indent=2)
          )
          assert not metadata_violations, (
              "Current-snapshot shadow changed candidate metadata: "
              + json.dumps(metadata_violations[:20], indent=2)
          )
          assert not invalid_values, (
              "Current-snapshot shadow produced invalid FVs: "
              + json.dumps(invalid_values[:20], indent=2)
          )
          assert not monotonicity_violations, (
              "Current-snapshot shadow violated production/FV monotonicity: "
              + json.dumps(monotonicity_violations[:20], indent=2)
          )

          # Frozen held rows that are still rendered must remain exactly unchanged.
          held_changed = [
              sid for sid in rendered_held_ids
              if int(current_by_id[sid]["val"]) != int(shadow_by_id[sid]["val"])
          ]
          assert not held_changed, (
              "Frozen unresolved/held rows changed in current shadow: "
              + json.dumps(held_changed[:20])
          )

          # Save the complete expected CURRENT shadow runtime. After deployment,
          # every currently rendered row must reproduce this exactly.
          expected_rows = {
              sid: {
                  "val": int(row["val"]),
                  "name": row["name"],
                  "pos": row["pos"],
                  "team": row.get("team"),
                  "age": row.get("age"),
                  "role": row.get("role"),
                  "hasRealData": row.get("hasRealData"),
              }
              for sid, row in shadow_by_id.items()
          }

          transport = {
              "frozen_active_count": len(frozen_active_ids),
              "frozen_candidate_count": len(candidate_ids),
              "frozen_held_count": len(frozen_held_ids),
              "current_rendered_count": len(current_by_id),
              "current_active_fa_specific_count": len(current_active_fa_specific),
              "rendered_frozen_candidate_count": len(rendered_candidate_ids),
              "rendered_frozen_held_count": len(rendered_held_ids),
              "removed_from_frozen_active_ids": removed_from_current_active,
              "added_current_active_ids": added_to_current_active,
              "current_production_source_counts": current_runtime[
                  "production_source_counts"
              ],
              "expected_shadow_rows": expected_rows,
          }

          out = Path(os.environ["RUNNER_TEMP"]) / "fa-v2-current-transport.json"
          out.write_text(json.dumps(transport, indent=2, sort_keys=True) + "\n")

          print("PASS: frozen V2 candidate transported safely to current Sleeper snapshot.")
          print("Current rendered rows:", len(current_by_id))
          print("Current active FA-specific rows:", len(current_active_fa_specific))
          print("Frozen candidates currently rendered:", len(rendered_candidate_ids))
          print("Frozen held rows currently rendered:", len(rendered_held_ids))
          print("Frozen active IDs no longer active:", len(removed_from_current_active))
          print("New active FA-specific IDs since freeze:", len(added_to_current_active))
          PY

      - name: Write approved Free-Agent Production V2 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model/releases/free-agent-production-v2
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          research = root / "research" / "free-agent-production-v2"
          out = root / "model" / "releases" / "free-agent-production-v2" / "release.json"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p1 = json.loads((research / "free_agent_production_v2_phase1.json").read_text())
          p2 = json.loads((research / "free_agent_production_v2_phase2_shadow.json").read_text())

          p2_by_id = {
              str(r["sleeper_id"]): r
              for r in p2["candidate_rows"]
          }

          candidates = []
          held = []
          for r in p1["rows"]:
              sid = str(r["sleeper_id"])
              base = {
                  "sleeper_id": sid,
                  "key": r["name"],
                  "pos": r["pos"],
                  "deployed_prod": float(r["deployed_prod"]),
              }
              if r.get("candidate_prod") is None:
                  held.append(base)
              else:
                  shadow = p2_by_id[sid]
                  candidates.append({
                      **base,
                      "candidate_prod": float(r["candidate_prod"]),
                      "phase2_shadow_fv": int(shadow["shadow_fv"]),
                      "phase2_current_fv": int(shadow["current_fv"]),
                  })

          candidates.sort(key=lambda r: (r["key"], r["pos"], r["sleeper_id"]))
          held.sort(key=lambda r: (r["key"], r["pos"], r["sleeper_id"]))

          assert len(candidates) == 333
          assert len(held) == 31
          assert len({r["sleeper_id"] for r in candidates + held}) == 364

          release = {
              "release_id": "free-agent-production-v2",
              "status": "APPROVED_BY_PHASE2_PENDING_PHASE3_DEPLOYMENT",
              "method": "frozen_phase1_candidate_exactly_validated_by_phase2_shadow",
              "candidate_count": len(candidates),
              "held_active_count": len(held),
              "kickers": "out_of_scope_unchanged",
              "candidate_overrides": candidates,
              "held_active_legacy": held,
              "phase1_result_sha256": sha(
                  research / "free_agent_production_v2_phase1.json"
              ),
              "phase1_manifest_sha256": sha(research / "phase1_manifest.json"),
              "phase2_result_sha256": sha(
                  research / "free_agent_production_v2_phase2_shadow.json"
              ),
              "phase2_manifest_sha256": sha(research / "phase2_manifest.json"),
              "deployment_policy": {
                  "only_prod_changes": True,
                  "role_age_team_identity_unchanged": True,
                  "unresolved_rows_hold_deployed_value": True,
                  "canonical_prod_mult_data_unchanged": True,
              },
          }
          out.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          print("Wrote", out, "with", len(candidates), "candidate overrides and", len(held), "held rows.")
          PY

      - name: Write deterministic release applicator
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/model/apply_free_agent_production_v2_release.py <<'PY'
          #!/usr/bin/env python3
          """Apply/check the approved Free-Agent Production V2 release.

          The historical FA_PROD_MULT_DATA object is intentionally preserved.
          A generated release block immediately after it overrides `prod` for
          exactly the approved V2 candidate cohort. Held/unresolved rows and
          kickers remain on the historical table.
          """

          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path
          import subprocess
          import sys

          SCRIPT = Path(__file__).resolve()
          ROOT = SCRIPT.parents[2]
          BOARD = ROOT / "free-agent-board.html"
          RELEASE = ROOT / "model" / "releases" / "free-agent-production-v2" / "release.json"

          START = "/* FREE_AGENT_PRODUCTION_V2_RELEASE_START */"
          END = "/* FREE_AGENT_PRODUCTION_V2_RELEASE_END */"

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def load_sync():
              scripts = ROOT / "scripts"
              if str(scripts) not in sys.path:
                  sys.path.insert(0, str(scripts))
              from sync import sync_free_agent_valuation
              return sync_free_agent_valuation

          def eval_base_table(board_text, sync_mod):
              const_source = sync_mod._extract_const_object(
                  board_text, "FA_PROD_MULT_DATA"
              )[2]
              js = const_source + "\nprocess.stdout.write(JSON.stringify(FA_PROD_MULT_DATA));\n"
              proc = subprocess.run(
                  ["node", "-e", js],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if proc.returncode != 0:
                  raise RuntimeError(proc.stderr.strip())
              return json.loads(proc.stdout)

          def exact_entry(table, key, pos):
              raw = table.get(key)
              vals = raw if isinstance(raw, list) else [raw]
              matches = [
                  v for v in vals
                  if isinstance(v, dict) and str(v.get("pos") or "") == pos
              ]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected exactly one FA table entry for {key!r} {pos}; "
                      f"found {len(matches)}"
                  )
              return matches[0]

          def validate_release_against_base(board_text, release, sync_mod):
              table = eval_base_table(board_text, sync_mod)
              seen = set()
              for group_name in ("candidate_overrides", "held_active_legacy"):
                  for row in release[group_name]:
                      ident = (row["key"], row["pos"], row["sleeper_id"])
                      if ident in seen:
                          raise RuntimeError(f"Duplicate release identity: {ident}")
                      seen.add(ident)
                      entry = exact_entry(table, row["key"], row["pos"])
                      actual = float(entry["prod"])
                      expected = float(row["deployed_prod"])
                      if abs(actual - expected) > 1e-12:
                          raise RuntimeError(
                              f"Historical FA base drift for {ident}: "
                              f"{actual} != {expected}"
                          )
              if len(release["candidate_overrides"]) != 333:
                  raise RuntimeError("Release candidate count is not 333")
              if len(release["held_active_legacy"]) != 31:
                  raise RuntimeError("Release held count is not 31")

          def release_block(release):
              rows = [
                  {
                      "key": r["key"],
                      "pos": r["pos"],
                      "prod": float(r["candidate_prod"]),
                      "sleeper_id": r["sleeper_id"],
                  }
                  for r in release["candidate_overrides"]
              ]
              payload = json.dumps(rows, separators=(",", ":"))
              return (
                  START + "\n"
                  "const FA_PROD_MULT_V2_RELEASE = " + payload + ";\n"
                  "for (const __v2 of FA_PROD_MULT_V2_RELEASE) {\n"
                  "  const __raw = FA_PROD_MULT_DATA[__v2.key];\n"
                  "  const __vals = Array.isArray(__raw) ? __raw : [__raw];\n"
                  "  let __matched = 0;\n"
                  "  for (const __entry of __vals) {\n"
                  "    if (__entry && __entry.pos === __v2.pos) {\n"
                  "      __entry.prod = __v2.prod;\n"
                  "      __matched += 1;\n"
                  "    }\n"
                  "  }\n"
                  "  if (__matched !== 1) {\n"
                  "    throw new Error('FA Production V2 release match failure for ' + "
                  "__v2.sleeper_id + ' ' + __v2.key + ' ' + __v2.pos + ': ' + __matched);\n"
                  "  }\n"
                  "}\n"
                  + END
              )

          def render(board_text, release, sync_mod):
              validate_release_against_base(board_text, release, sync_mod)
              block = release_block(release)
              if START in board_text or END in board_text:
                  if START not in board_text or END not in board_text:
                      raise RuntimeError("Partial FA Production V2 release markers found")
                  s = board_text.index(START)
                  e = board_text.index(END, s) + len(END)
                  return board_text[:s] + block + board_text[e:]

              _, const_end, _ = sync_mod._extract_const_object(
                  board_text, "FA_PROD_MULT_DATA"
              )
              return board_text[:const_end] + "\n\n" + block + board_text[const_end:]

          def main():
              ap = argparse.ArgumentParser()
              mode = ap.add_mutually_exclusive_group(required=True)
              mode.add_argument("--write", action="store_true")
              mode.add_argument("--check", action="store_true")
              mode.add_argument("--selftest", action="store_true")
              args = ap.parse_args()

              sync_mod = load_sync()

              if args.selftest:
                  sample = "const FA_PROD_MULT_DATA = {'x':{pos:'WR',prod:0.15}};\n"
                  release = {
                      "candidate_overrides": [{
                          "key": "x",
                          "pos": "WR",
                          "sleeper_id": "1",
                          "deployed_prod": 0.15,
                          "candidate_prod": 0.25,
                      }],
                      "held_active_legacy": [],
                  }
                  # Test block construction separately; production count guards
                  # intentionally require the real 333/31 release.
                  block = release_block(release)
                  assert START in block and END in block
                  assert '"prod":0.25' in block
                  print("Free-Agent Production V2 release applicator self-test PASS")
                  return

              board = BOARD.read_text(encoding="utf-8")
              release = read_json(RELEASE)
              expected = render(board, release, sync_mod)

              if args.check:
                  if START not in board:
                      raise SystemExit("FA Production V2 release block is absent")
                  # render() replaces an existing block deterministically.
                  if expected != board:
                      raise SystemExit("FA Production V2 release block is stale")
                  print("PASS: Free-Agent Production V2 release block is current")
                  return

              BOARD.write_text(expected, encoding="utf-8")
              print("Wrote", BOARD, "with approved Free-Agent Production V2 release")

          if __name__ == "__main__":
              main()
          PY
          chmod +x scripts/model/apply_free_agent_production_v2_release.py

      - name: Compile and self-test release applicator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/model/apply_free_agent_production_v2_release.py")
          compile(p.read_text(encoding="utf-8"), str(p), "exec")
          print("Release applicator compile PASS")
          PY
          python3 scripts/model/apply_free_agent_production_v2_release.py --selftest

      - name: Apply approved V2 release to free-agent board
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/model/apply_free_agent_production_v2_release.py --write
