      - name: Confirm deployed board exactly reproduces current transport shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(".")
          scripts = root / "scripts"
          validation = scripts / "validation"
          if str(scripts) not in sys.path:
              sys.path.insert(0, str(scripts))
          if str(validation) not in sys.path:
              sys.path.insert(0, str(validation))

          import validate_free_agent_valuation_parity as fa_validator

          research = root / "research" / "free-agent-production-v2"
          release = json.loads(
              (
                  root
                  / "model"
                  / "releases"
                  / "free-agent-production-v2"
                  / "release.json"
              ).read_text()
          )
          free_doc = json.loads((root / "data/free_agents.json").read_text())
          board_text = (root / "free-agent-board.html").read_text()
          transport = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "fa-v2-current-transport.json"
              ).read_text()
          )

          p2_script = (
              research / "free_agent_production_v2_phase2_shadow.py"
          )
          spec = importlib.util.spec_from_file_location(
              "fa_v2_phase2_frozen_confirm", p2_script
          )
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          runtime = fa_validator._board_runtime_rows(board_text, free_doc)
          actual_by_id = mod.attach_sleeper_ids(
              runtime["rows"], free_doc, fa_validator
          )
          expected = transport["expected_shadow_rows"]

          assert set(actual_by_id) == set(expected), (
              "Rendered Sleeper-ID population changed during Phase 3"
          )

          mismatches = []
          fields = ("val", "name", "pos", "team", "age", "role", "hasRealData")
          for sid in sorted(expected):
              actual = actual_by_id[sid]
              exp = expected[sid]
              changed = {
                  field: {"expected": exp.get(field), "actual": actual.get(field)}
                  for field in fields
                  if actual.get(field) != exp.get(field)
              }
              if changed:
                  mismatches.append({
                      "sleeper_id": sid,
                      "changes": changed,
                  })

          if mismatches:
              raise SystemExit(
                  "Deployed board does not exactly reproduce current transport shadow: "
                  + json.dumps(mismatches[:20], indent=2)
              )

          candidate_ids = {
              str(r["sleeper_id"])
              for r in release["candidate_overrides"]
          }
          held_ids = {
              str(r["sleeper_id"])
              for r in release["held_active_legacy"]
          }
          assert len(candidate_ids) == 333
          assert len(held_ids) == 31
          assert not (candidate_ids & held_ids)

          print(
              "PASS: deployed board exactly reproduces the pre-deploy "
              "current-snapshot shadow for all",
              len(expected),
              "rendered rows.",
          )
          print(
              "Frozen release remains exactly 333 candidate overrides + "
              "31 held active legacy rows."
          )
          PY

