      - name: Prove immutable production inputs and exact deployment diff
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          sha256sum -c "${RUNNER_TEMP}/phase3-immutable-production-inputs.sha256"

          python3 - <<'PY'
          import subprocess

          expected = {
              "free-agent-board.html",
              "model/releases/free-agent-production-v2/release.json",
              "scripts/model/apply_free_agent_production_v2_release.py",
              "research/free-agent-production-v2/phase3_production_confirmation.json",
              "research/free-agent-production-v2/phase3_production_confirmation.md",
              "research/free-agent-production-v2/phase3_manifest.json",
          }

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          actual = set()
          for line in raw.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  "Phase 3 deployment diff mismatch.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(actual)}"
              )
          print("PASS: exact six-file Phase 3 deployment diff.")
          PY

