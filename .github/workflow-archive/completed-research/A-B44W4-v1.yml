name: B44W4 - Week 4 DOB_POSITION Remediation Re-Audit V1

on:
  workflow_dispatch:
    inputs:
      independent_review_and_no_rostered_coverage_peek_attestation:
        description: Exact B44 V1 independent-review / no-peek attestation
        required: true
        type: string

permissions:
  contents: write

jobs:
  b44w4-v1-week4-remediation-reaudit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE: research/player-role-v2
      OUT: /tmp/player-role-v2-b44w4-v1
    steps:
      - name: Check out current durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen evaluator runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'requests==2.34.2' 'numpy==2.5.3' 'pandas==2.3.3' 'scipy==1.18.1'
          python3 - <<'PYRUNTIME'
          import importlib.metadata as md
          expected={'requests':'2.34.2','numpy':'2.5.3','pandas':'2.3.3','scipy':'1.18.1'}
          for pkg,ver in expected.items():
              assert md.version(pkg)==ver,(pkg,md.version(pkg),ver)
          print('PASS: B44W4 V1 scientific runtime pinned.')
          PYRUNTIME

      - name: Preflight adoption lineage and capture Week-4 raw inputs without roster parsing
        shell: bash
        env:
          OWNER_ATTEST: ${{ inputs.independent_review_and_no_rostered_coverage_peek_attestation }}
        run: |
          set -euo pipefail
          test "$OWNER_ATTEST" = 'I_CONFIRM_B44W4_V1_USES_B42_WEEK4_AND_IS_ENGINEERING_REMEDIATION_VALIDATION_NOT_INDEPENDENT_CONFIRMATION'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$OUT/source-preflight"
          echo "MAIN_AT_START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

          test -f "$BASE/player_role_v2_b43_v1r1_rule_adoption_decision.json"
          test "$(sha256sum "$BASE/player_role_v2_b43_v1r1_rule_adoption_decision.json" | awk '{print $1}')" = '4f62fe0416626a780538288bcedd36cf0ef95b73d3a2802340fbfc31a38ca095'

          if find "$BASE" -maxdepth 1 -type f -name 'player_role_v2_b44_v1_*' -print -quit | grep -q .; then
            echo 'B44_V1_BLOCKED_CANDIDATE_NAMESPACE_PRESENT'
            find "$BASE" -maxdepth 1 -type f -name 'player_role_v2_b44_v1_*' -print
            exit 1
          fi

          if find "$BASE" -maxdepth 1 -type f -name 'player_role_v2_b44w4_v1_*' -print -quit | grep -q .; then
            echo 'B44_V1R1_NAMESPACE_ALREADY_CONSUMED'
            find "$BASE" -maxdepth 1 -type f -name 'player_role_v2_b44w4_v1_*' -print
            exit 1
          fi

          # Raw roster bytes may be copied and hashed, but MUST NOT be parsed here.
          test -f data/league_rosters.json
          cp data/league_rosters.json "$OUT/source-preflight/league_rosters_snapshot.json"
          echo "ROSTER_SNAPSHOT_SHA256=$(sha256sum "$OUT/source-preflight/league_rosters_snapshot.json" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ROSTER_SNAPSHOT_GIT_BLOB=$(git hash-object "$OUT/source-preflight/league_rosters_snapshot.json")" >> "$GITHUB_ENV"

          python3 - <<'PYPREFLIGHT'
          import hashlib, importlib.util, json, os, subprocess
          from pathlib import Path
          import requests

          base=Path('research/player-role-v2')
          out=Path('/tmp/player-role-v2-b44w4-v1/source-preflight')

          # Exact parent/adoption hashes only; no roster semantic parse.
          expected={
            'player_role_v2_b42_v4_owner_blind_parity_evaluator.py':'418e0807471cdf644afeaf2c5a3ee0211068667fce057317ec29a3962a836396',
            'player_role_v2_b42_v4_shadow_refresh_witness.json':'8801001087a5714aafcc21f82ee1d3ee4c1690b7c4168daf3812d0b215b87db0',
            'player_role_v2_b42_v4_owner_blind_evidence.json':'b11ae8cfe10d6ab0691bea6a3304f0475a7094ff7eb370ee74a134511a2a55db',
            'player_role_v2_b42_v4_scientific_decision.json':'47059d9f0431eadb9725a66a6891b13e73af4b44f62bd2a12df0dd95ded4d2d6',
            'player_role_v2_b43_v1_identity_bridge_evaluator.py':'44e2585dbb84a7c62b274b5ed0bc63d1881b4e48e940e65ad04a5c8905475bab',
            'player_role_v2_b43_v1_preregistration.json':'cd5c70d6fd8fb46b302855039c2161e14bb4491dc367e04ba9d641c665adeecd',
            'player_role_v2_b43_v1_identity_bridge.csv':'3fdc85e18a4e705d15afcf8d93b742343c57aaa2c909f3e8fd40faf2ebbf8fcc',
            'player_role_v2_b43_v1_evidence.json':'adfcd3593a01961c1624148ef8ca2cb8d10c6e000ca05fa19a4baa208ba3102a',
            'player_role_v2_b43_v1_scientific_decision.json':'fa50ef0b58145da5edbf7805a8f4cfd7c54b464754ee04e59c5822072f6eb3f9',
            'player_role_v2_b43_v1r1_rule_adoption_decision.json':'4f62fe0416626a780538288bcedd36cf0ef95b73d3a2802340fbfc31a38ca095',
            'player_role_v2_b43_v4r2_preregistration.json':'e224b7a4d7c8566bd8ca0e3b9eebad67debae26706ca4ee610e8dd779f028738',
            'player_role_v2_b43_v4r2_scientific_decision.json':'e9968c9acade8ab484c8c6ff6317b6aca351f1dade0f4b46c70b68d7e98fb9c7',
          }
          for rel,sha in expected.items():
              p=base/rel
              assert p.exists(),rel
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==sha,(rel,actual,sha)

          adoption=json.loads((base/'player_role_v2_b43_v1r1_rule_adoption_decision.json').read_text())
          assert adoption['status']=='ENGINEERING_ADOPTION_DECISION_NOT_A_B43_PASS'
          assert adoption['B43_V1R1_scientific_stop_preserved'] is True
          assert adoption['adopted_rule']=='DOB_POSITION'
          assert adoption['production_change_authorized'] is False

          b42w=json.loads((base/'player_role_v2_b42_v4_shadow_refresh_witness.json').read_text())
          b42e=json.loads((base/'player_role_v2_b42_v4_owner_blind_evidence.json').read_text())
          b42_week=int(b42w['latest_completed_week'])
          b42_roster_sha=str(b42e['roster_snapshot_sha256'])

          # Load the hash-verified B42 evaluator solely to reuse its exact current-source
          # currency check before the B44 namespace is committed.
          b42_path=base/'player_role_v2_b42_v4_owner_blind_parity_evaluator.py'
          spec=importlib.util.spec_from_file_location('b44_preflight_b42',b42_path)
          if spec is None or spec.loader is None:
              raise RuntimeError('B44_V1R1_B42_MODULE_LOAD_FAILED')
          b42=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(b42)

          s=requests.Session()
          s.headers.update({'User-Agent':'LOG-Trade-Calculator-player-role-v2-b44w4-v1-preflight'})
          state=s.get('https://api.sleeper.app/v1/state/nfl',timeout=90)
          state.raise_for_status()
          st=state.json()
          assert str(st.get('season') or '')=='2026',st
          season_type=str(st.get('season_type') or '').lower()
          assert not season_type or season_type=='regular',st
          progress=max(int(st.get('week') or 0),int(st.get('leg') or 0))
          sleeper_latest_completed=progress-1
          analysis_week=b42_week
          if sleeper_latest_completed < analysis_week:
              raise RuntimeError(
                  f'B44W4_REQUIRES_B42_WEEK4_AVAILABLE current={sleeper_latest_completed} required={analysis_week}'
              )

          r=s.get('https://api.sleeper.app/v1/players/nfl',timeout=120)
          r.raise_for_status()
          sleeper_bytes=r.content
          (out/'sleeper_players.json').write_bytes(sleeper_bytes)
          raw=json.loads(sleeper_bytes)
          if not isinstance(raw,dict) or not raw:
              raise RuntimeError('B44_SLEEPER_PLAYER_MAP_NOT_OBJECT')
          dict_records=[v for v in raw.values() if isinstance(v,dict)]
          if not dict_records:
              raise RuntimeError('B44_SLEEPER_PLAYER_MAP_NO_RECORDS')
          schema_counts={
              key:sum(1 for rec in dict_records if key in rec)
              for key in ('player_id','full_name','first_name','last_name','birth_date','position','team')
          }
          if schema_counts['position']==0 or (schema_counts['full_name']==0 and schema_counts['first_name']==0):
              raise RuntimeError(f'B44_SLEEPER_SCHEMA_MISSING {schema_counts}')

          # Week-4 source freeze: prove BOTH nflverse sources contain the fixed B42 analysis week
          # BEFORE any B44W4 namespace commit.
          stats_resp=s.get(b42.CURRENT_STATS_URL,timeout=120)
          stats_resp.raise_for_status()
          stats_bytes=stats_resp.content
          snaps_resp=s.get(b42.CURRENT_SNAPS_URL,timeout=120)
          snaps_resp.raise_for_status()
          snaps_bytes=snaps_resp.content
          (out/'stats_player_week_2026.csv').write_bytes(stats_bytes)
          (out/'snap_counts_2026.csv').write_bytes(snaps_bytes)
          stats_meta=b42.filter_csv_to_completed_weeks(
              stats_bytes,season_col='season',week_col='week',type_col='season_type',
              type_value='REG',latest_completed_week=analysis_week,
              out_path=out/'_preflight_stats_player_week_2026_completed.csv'
          )
          snaps_meta=b42.filter_csv_to_completed_weeks(
              snaps_bytes,season_col='season',week_col='week',type_col='game_type',
              type_value='REG',latest_completed_week=analysis_week,
              out_path=out/'_preflight_snap_counts_2026_completed.csv'
          )
          (out/'_preflight_stats_player_week_2026_completed.csv').unlink()
          (out/'_preflight_snap_counts_2026_completed.csv').unlink()

          roster=out/'league_rosters_snapshot.json'
          # Deliberately hash bytes only. DO NOT json.loads roster here.
          roster_sha=hashlib.sha256(roster.read_bytes()).hexdigest()
          roster_blob=subprocess.check_output(['git','hash-object',str(roster)],text=True).strip()

          pre={
              'schema_version':1,
              'phase':'B44W4-v1-source-schema-and-current-source-currency-preflight-before-protocol-freeze',
              'main_at_start':os.environ['MAIN_AT_START'],
              'roster_snapshot_sha256':roster_sha,
              'roster_snapshot_git_blob':roster_blob,
              'roster_snapshot_semantically_parsed':False,
              'B42_roster_snapshot_sha256':b42_roster_sha,
              'roster_snapshot_identical_to_B42':roster_sha==b42_roster_sha,
              'roster_freshness_disclosed_not_gated':True,
              'sleeper_player_map_sha256':hashlib.sha256(sleeper_bytes).hexdigest(),
              'sleeper_player_map_raw_object_count':len(raw),
              'sleeper_schema_counts':schema_counts,
              'sleeper_population_join_performed':False,
              'nflverse_weekly_stats_raw_sha256':hashlib.sha256(stats_bytes).hexdigest(),
              'nflverse_snap_counts_raw_sha256':hashlib.sha256(snaps_bytes).hexdigest(),
              'nflverse_weekly_stats_max_available_week':int(stats_meta['max_available_week']),
              'nflverse_snap_counts_max_available_week':int(snaps_meta['max_available_week']),
              'nflverse_sources_currency_verified_before_namespace_commit':True,
              'B42_latest_completed_week':b42_week,
              'latest_completed_week':analysis_week,
              'B44W4_analysis_week_equals_B42_week':analysis_week==b42_week,
              'latest_completed_week_strictly_later_than_B42':False,
              'sleeper_latest_completed_week_observed':sleeper_latest_completed,
              'week_selection_policy':'FIXED_TO_B42_COMPLETED_WEEK_FOR_SAME_WEEK_REMEDIATION_VALIDATION',
              'sleeper_state':{'season':st.get('season'),'season_type':st.get('season_type'),'week':st.get('week'),'leg':st.get('leg')},
              'rostered_coverage_tally_computed':False,
              'team_partition_metric_computed':False,
          }
          (out/'source_preflight.json').write_text(json.dumps(pre,indent=2,sort_keys=True)+'\n')
          print('PASS: B44W4 V1 Week-4 sources cached; currency verified before commit; roster bytes remain unopened.')
          PYPREFLIGHT

      - name: Materialize B44 evaluator and protocol before any roster semantic parse
        shell: bash
        run: |
          set -euo pipefail
          EVALUATOR="$BASE/player_role_v2_b44w4_v1_evaluator.py"
          PROTOCOL="$BASE/player_role_v2_b44w4_v1_protocol_freeze.json"
          SOURCE_PREFLIGHT="$BASE/player_role_v2_b44w4_v1_source_preflight.json"

          cat > "$EVALUATOR" <<'PYB44'
          #!/usr/bin/env python3
          import argparse
          import ast
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          import secrets
          import subprocess
          from collections import Counter, defaultdict
          from pathlib import Path
          
          import pandas as pd
          import requests
          
          STUDY_ID = "player-role-v2"
          PHASE = "B44W4-v1-week4-dob-position-remediation-reaudit"
          BASE_REL = Path("research/player-role-v2")
          
          B42_EVALUATOR_REL = BASE_REL / "player_role_v2_b42_v4_owner_blind_parity_evaluator.py"
          B42_EVALUATOR_SHA256 = "418e0807471cdf644afeaf2c5a3ee0211068667fce057317ec29a3962a836396"
          B42_WITNESS_REL = BASE_REL / "player_role_v2_b42_v4_shadow_refresh_witness.json"
          B42_WITNESS_SHA256 = "8801001087a5714aafcc21f82ee1d3ee4c1690b7c4168daf3812d0b215b87db0"
          B42_DECISION_REL = BASE_REL / "player_role_v2_b42_v4_scientific_decision.json"
          B42_DECISION_SHA256 = "47059d9f0431eadb9725a66a6891b13e73af4b44f62bd2a12df0dd95ded4d2d6"
          
          V1_EVALUATOR_REL = BASE_REL / "player_role_v2_b43_v1_identity_bridge_evaluator.py"
          V1_EVALUATOR_SHA256 = "44e2585dbb84a7c62b274b5ed0bc63d1881b4e48e940e65ad04a5c8905475bab"
          V1_PREREG_REL = BASE_REL / "player_role_v2_b43_v1_preregistration.json"
          V1_PREREG_SHA256 = "cd5c70d6fd8fb46b302855039c2161e14bb4491dc367e04ba9d641c665adeecd"
          V1_BRIDGE_REL = BASE_REL / "player_role_v2_b43_v1_identity_bridge.csv"
          V1_BRIDGE_SHA256 = "3fdc85e18a4e705d15afcf8d93b742343c57aaa2c909f3e8fd40faf2ebbf8fcc"
          V1_EVIDENCE_REL = BASE_REL / "player_role_v2_b43_v1_evidence.json"
          V1_EVIDENCE_SHA256 = "adfcd3593a01961c1624148ef8ca2cb8d10c6e000ca05fa19a4baa208ba3102a"
          V1_DECISION_REL = BASE_REL / "player_role_v2_b43_v1_scientific_decision.json"
          V1_DECISION_SHA256 = "fa50ef0b58145da5edbf7805a8f4cfd7c54b464754ee04e59c5822072f6eb3f9"
          
          ADOPTION_REL = BASE_REL / "player_role_v2_b43_v1r1_rule_adoption_decision.json"
          ADOPTION_SHA256 = "4f62fe0416626a780538288bcedd36cf0ef95b73d3a2802340fbfc31a38ca095"
          
          V4R2_PREREG_REL = BASE_REL / "player_role_v2_b43_v4r2_preregistration.json"
          V4R2_PREREG_SHA256 = "e224b7a4d7c8566bd8ca0e3b9eebad67debae26706ca4ee610e8dd779f028738"
          V4R2_DECISION_REL = BASE_REL / "player_role_v2_b43_v4r2_scientific_decision.json"
          V4R2_DECISION_SHA256 = "e9968c9acade8ab484c8c6ff6317b6aca351f1dade0f4b46c70b68d7e98fb9c7"
          
          B41I_PLAYERS_REL = BASE_REL / "frozen_inputs/players_b41i_snapshot.csv"
          B41I_PLAYERS_SHA256 = "d531dcff2d3ff681f02210d314f6e9f16c671c0beefa85fd311a55363675d4cc"
          
          REQUIRED_TEAM_COUNT = 12
          MIN_TEAM_ROLE_COVERAGE = 0.98
          MAX_TEAM_COVERAGE_RANGE = 0.02
          MIN_DOB_REFERENCE_COMPARISONS = 500
          DOB_REFERENCE_CONFLICTS_ALLOWED = 0
          
          PASS_RESULT = "PASS_B44W4_V1_WEEK4_DOB_POSITION_REMEDIATION_REAUDIT"
          PARITY_STOP_RESULT = "SCIENTIFIC_STOP_B44W4_V1_OWNER_BLIND_ROLE_PARITY_FAILED"
          IDENTITY_STOP_RESULT = "SCIENTIFIC_STOP_B44W4_V1_IDENTITY_PRECISION"
          DATA_STOP_RESULT = "SCIENTIFIC_STOP_B44W4_V1_DATA_INTEGRITY"
          
          SUPPORTED_MODEL_POSITIONS = ("QB","RB","WR","TE","DL","LB","DB","K")
          ROLE_ORDER = ("ELITE", "CORE", "FLEX", "DEPTH", "FRINGE")
          KNOWN_CLUBS = {
              "ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE","DAL","DEN","DET","GB",
              "HOU","IND","JAX","KC","LV","LAC","LAR","MIA","MIN","NE","NO","NYG",
              "NYJ","PHI","PIT","SEA","SF","TB","TEN","WAS"
          }
          
          
          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()
          
          
          def sha256_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())
          
          
          def git_blob_sha(path: Path) -> str:
              return subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          
          
          def load_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))
          
          
          def write_json(path: Path, payload) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          
          
          def load_module(path: Path, name: str):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"B44_MODULE_LOAD_FAILED {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          
          
          def assert_sha(repo: Path, rel: Path, expected: str, label: str) -> Path:
              path = repo / rel
              if not path.exists():
                  raise RuntimeError(f"B44_PARENT_MISSING {label} path={rel}")
              actual = sha256_file(path)
              if actual != expected:
                  raise RuntimeError(f"B44_PARENT_SHA_DRIFT {label} expected={expected} actual={actual}")
              return path
          
          
          def load_verified_parents(repo: Path):
              b42_path = assert_sha(repo, B42_EVALUATOR_REL, B42_EVALUATOR_SHA256, "B42_EVALUATOR")
              assert_sha(repo, B42_WITNESS_REL, B42_WITNESS_SHA256, "B42_WITNESS")
              assert_sha(repo, B42_DECISION_REL, B42_DECISION_SHA256, "B42_DECISION")
              v1_path = assert_sha(repo, V1_EVALUATOR_REL, V1_EVALUATOR_SHA256, "V1_EVALUATOR")
              assert_sha(repo, V1_PREREG_REL, V1_PREREG_SHA256, "V1_PREREG")
              assert_sha(repo, V1_BRIDGE_REL, V1_BRIDGE_SHA256, "V1_BRIDGE")
              assert_sha(repo, V1_EVIDENCE_REL, V1_EVIDENCE_SHA256, "V1_EVIDENCE")
              assert_sha(repo, V1_DECISION_REL, V1_DECISION_SHA256, "V1_DECISION")
              assert_sha(repo, ADOPTION_REL, ADOPTION_SHA256, "ADOPTION_DECISION")
              assert_sha(repo, V4R2_PREREG_REL, V4R2_PREREG_SHA256, "V4R2_PREREG")
              assert_sha(repo, V4R2_DECISION_REL, V4R2_DECISION_SHA256, "V4R2_DECISION")
              assert_sha(repo, B41I_PLAYERS_REL, B41I_PLAYERS_SHA256, "B41I_PLAYERS")
          
              b42 = load_module(b42_path, "b44_parent_b42")
              v1 = load_module(v1_path, "b44_parent_v1")
              lineage = b42.load_and_verify_frozen_lineage(repo)
          
              b42_decision = load_json(repo / B42_DECISION_REL)
              if b42_decision["result"] != "SCIENTIFIC_STOP_B42_V4_OWNER_BLIND_ROLE_PARITY_FAILED":
                  raise RuntimeError("B44_PARENT_B42_NOT_EXPECTED_STOP")
              if b42_decision["production_change_authorized"] is not False:
                  raise RuntimeError("B44_PARENT_B42_PRODUCTION_AUTH_DRIFT")
          
              v1_evidence = load_json(repo / V1_EVIDENCE_REL)
              v1_decision = load_json(repo / V1_DECISION_REL)
              if v1_decision["result"] != "SCIENTIFIC_STOP_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FAILED":
                  raise RuntimeError("B44_V1R1_STOP_NOT_PRESERVED")
              rs = v1_evidence["reference_validation"]["rule_stats"]["DOB_POSITION"]
              if (rs["comparisons"], rs["correct"], rs["conflicts"]) != (1243,1243,0):
                  raise RuntimeError("B44_V1R1_DOB_EVIDENCE_DRIFT")
              if v1_evidence["current_owner_blind_population"]["supplemental_collision_count"] != 2:
                  raise RuntimeError("B44_V1R1_COLLISION_COUNT_DRIFT")
          
              adoption = load_json(repo / ADOPTION_REL)
              if adoption["status"] != "ENGINEERING_ADOPTION_DECISION_NOT_A_B43_PASS":
                  raise RuntimeError("B44_ADOPTION_STATUS_DRIFT")
              if adoption["B43_V1R1_scientific_stop_preserved"] is not True:
                  raise RuntimeError("B44_ADOPTION_REINTERPRETS_V1R1")
              if adoption["adopted_rule"] != "DOB_POSITION":
                  raise RuntimeError("B44_ADOPTED_RULE_DRIFT")
              if adoption["rules_not_adopted"] != ["NFL_TEAM_POSITION", "UNIQUE_NAME_POSITION"]:
                  raise RuntimeError("B44_UNVALIDATED_RULE_ADOPTION_DRIFT")
              if adoption["production_change_authorized"] is not False:
                  raise RuntimeError("B44_ADOPTION_PRODUCTION_AUTH_DRIFT")
          
              v4p = load_json(repo / V4R2_PREREG_REL)
              v4d = load_json(repo / V4R2_DECISION_REL)
              if v4p["objective_respecification"]["population_coverage_gate_removed"] is not True:
                  raise RuntimeError("B44_OWNER_OBJECTIVE_LINEAGE_DRIFT")
              if v4p["objective_respecification"]["B44_gates_unchanged"] is not True:
                  raise RuntimeError("B44_GATE_LINEAGE_DRIFT")
              if v4d["result"] != "SCIENTIFIC_STOP_B43_V4R2_DIRECT_SLEEPER_GSIS_BRIDGE_FAILED":
                  raise RuntimeError("B44_V4R2_DECISION_DRIFT")
          
              return b42, v1, lineage, adoption, v1_evidence
          
          
          def b44_pre_roster_static_source_firewall(evaluator_path: Path) -> dict:
              source=evaluator_path.read_text(encoding="utf-8")
              tree=ast.parse(source)
              protected={
                  "make_current_identity_rows",
                  "eligible_base_from_rows",
                  "compute_overlay",
                  "augmented_attach_factory",
                  "build_shadow",
              }
              forbidden_tokens={
                  "owner_id","owner_username","roster_id","dynasty_team",
                  "fantasy_roster_slot","team_name","starters","bench","taxi",
                  "reserve_ir","league_rosters",
              }
              found={}
              class Visitor(ast.NodeVisitor):
                  def __init__(self): self.hits=set()
                  def hit(self,value):
                      low=str(value or "").lower()
                      for tok in forbidden_tokens:
                          if tok in low: self.hits.add(tok)
                  def visit_Name(self,node): self.hit(node.id); self.generic_visit(node)
                  def visit_Attribute(self,node): self.hit(node.attr); self.generic_visit(node)
                  def visit_arg(self,node): self.hit(node.arg); self.generic_visit(node)
                  def visit_keyword(self,node):
                      if node.arg: self.hit(node.arg)
                      self.generic_visit(node)
                  def visit_Subscript(self,node):
                      sl=node.slice
                      if isinstance(sl,ast.Constant) and isinstance(sl.value,str): self.hit(sl.value)
                      self.generic_visit(node)
              for node in tree.body:
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in protected:
                      v=Visitor(); v.visit(node); found[node.name]=sorted(v.hits)
              missing=sorted(protected-set(found))
              bad={k:v for k,v in found.items() if v}
              return {
                  "protected_functions":sorted(protected),
                  "forbidden_tokens":sorted(forbidden_tokens),
                  "hits":found,
                  "missing_functions":missing,
                  "pass":not bad and not missing,
              }


