          PY

      - name: Post-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove cleanup-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith(".github/workflows/")
              or p.startswith(".github/workflow-archive/completed-research/")
              for p in touched
          ),touched
          assert not any(
              p=="index.html"
              or p=="free-agent-board.html"
              or p.startswith(("data/","model/","scripts/","research/"))
              for p in touched
          ),touched

          print("PASS: mutation scope is workflow cleanup/archive only.")
          PY

      - name: Commit workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17C cleanup."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive/completed-research
          git diff --cached --check
          git commit -m "Archive completed workflows after B17A V3"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17C workflow cleanup committed."
