          current={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }
          expected=set(archive_targets)|protected|{this_cleanup}

          if current != expected:
              raise SystemExit(
                  "Active workflow inventory differs from frozen B17C plan.\n"
                  f"Missing: {sorted(expected-current)}\n"
                  f"Unexpected: {sorted(current-expected)}"
              )

          assert len(current)==69
          assert len(archive_targets)==47
          assert len(protected)==21
          assert this_cleanup in current
          assert "B17V2-FIXED.yml" in protected
          assert "B17-V2.yml" in archive_targets
          assert "B17A-V3.yml" in archive_targets
          assert "B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml" in protected
