name: B19 Package Adjustment V1.7 - UI Clarity Deployment V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b19-package-adjustment-v1-7-ui-clarity-deploy.yml'

permissions:
  contents: write

concurrency:
  group: b19-package-adjustment-v1-7-ui-clarity
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply V1.7 clarity-only UI patch
        shell: bash
        run: |
          if grep -q 'PACKAGE_ADJUSTMENT_V1_7_UI_CLARITY' index.html; then
            echo 'V1.7 is already deployed; switching to verification-only mode.'
            exit 0
          fi
          echo '' | base64 -d > /tmp/b19_patch.py
          python /tmp/b19_patch.py

      - name: Validate no unintended source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo '--- V1.7 UI state ---'
          if git diff --quiet -- index.html; then
            echo 'No index.html diff: validating already-deployed V1.7.'
          else
            echo 'Fresh V1.7 deployment diff:'
            git diff --stat -- index.html
          fi
          grep -n "PACKAGE_ADJUSTMENT_V1_7_UI_CLARITY" index.html
          grep -n "Package Adjustment unavailable for this trade shape" index.html
          grep -n "side-total-breakdown" index.html | head
          grep -n "Why +" index.html | head
          grep -n '<strong>Fair Value (FV)</strong>' index.html | head
          grep -n '<strong>Raw FV</strong>' index.html | head
          grep -n '<strong>Trade Value</strong>' index.html | head
          grep -n 'Required premium for receiving' index.html | head
          if grep -q '<strong>V3 —\|<strong>V5 —' index.html; then
            echo 'ERROR: implementation-history jargon remains user-facing'
            exit 1
          fi
          if grep -q 'package-adjustment-live">LIVE' index.html; then
            echo 'ERROR: LIVE badge remains rendered'
            exit 1
          fi

      - name: Commit production UI V1.7
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'V1.7 already deployed and validated. No commit required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Package Adjustment V1.7 UI clarity pass"
          git push
