name: Draft Pick FV V7 - Phase 1 R1-R6 Full Scale Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "requests==2.34.2"

      - name: Guard cleaned repo and frozen V6 evidence
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            [".github/workflow-archive/completed-research/archive_manifest.json"]="f6681e5a6f112efcb239c942218b6e89a3b66d60"
            [".github/workflows/workflow-folder-cleanup.yml"]="a31be3efcbebf66a3ed0961e3e237097794d856e"
            ["research/draft-pick-fv-v6/r1_r4_v6_research_closeout.json"]="21dbe195c5111f465ee1d23a40d6b2d5719a2193"
            ["research/draft-pick-fv-v6/r1_r4_v6_research_closeout_manifest.json"]="f6a68c30cc5fac49041b8c8830039cfd2d98636d"
            ["research/draft-pick-fv-v6/structural_continuity_preregistration_v6.json"]="87c25b5390f75707934deb6d28b5513e6c93cf25"
            ["research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json"]="e15e6d776f12784fa74c603f016e8ff7dd805311"
            ["research/draft-pick-fv-v6/r1_r4_source_identity_summary_v6_1.json"]="4aa321454edf6dcbceff65a76198f2fe98eb8df3"
            ["index.html"]="ab60f7008a3e8dbc1a2e1eeb6904c9ccf0eb6d41"
          )

          for path in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$path")"
            test "$actual" = "${EXPECTED[$path]}" || {
              echo "ERROR: frozen V7 predecessor drift: $path"
              echo "expected=${EXPECTED[$path]} actual=$actual"
              exit 1
            }
          done

          for p in             research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json             research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.md             research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_manifest_v7.json
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path(".")
          archive=json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text()
          )
          close=json.loads(
              Path(
                  "research/draft-pick-fv-v6/"
                  "r1_r4_v6_research_closeout.json"
              ).read_text()
          )
          cm=json.loads(
              Path(
                  "research/draft-pick-fv-v6/"
                  "r1_r4_v6_research_closeout_manifest.json"
              ).read_text()
          )
          source=json.loads(
              Path(
                  "research/draft-pick-fv-v6/"
                  "r1_r4_source_catalog_v6_1.json"
              ).read_text()
          )

          assert archive["schema_version"]==6
          assert archive["last_cleanup_batch"] ==               "2026-09-23-post-draft-pick-fv-v6"
          assert archive["archive_workflow_n"]==120
          assert archive["protected_active_workflow_n"]==19

          assert close["status"] ==               "V6_RESEARCH_CLOSED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE"
          assert close["final_decision"] ==               "STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
          assert close["research_complete"] is True
          assert close["eligible_candidate_n"]==0
          assert close["selected_candidate"] is None
          assert close["production_change_authorized"] is False
          assert close["holdout_2024"]["H2_outcomes_opened_by_V6"] is False
          assert close["holdout_2024"]["H3_outcomes_opened_by_V6"] is False
          assert close["successor_research_constraints"][
              "new_study_required"
          ] is True
          assert cm["successor_requires_new_preregistration"] is True

          def max_pick_n(league):
              return max(
                  [int(x.get("pick_n") or 0)
                   for x in league.get("unit_summary", [])]
                  or [0]
              )

          deep={str(y):0 for y in range(2018,2024)}
          for league in source["development"]["leagues"]:
              y=int(league["draft_year"])
              if max_pick_n(league)>=72:
                  deep[str(y)]+=1
          assert deep=={
              "2018":4,"2019":11,"2020":12,
              "2021":8,"2022":17,"2023":12
          }
          hold=sum(
              1 for x in source["temporal_holdout_2024"]["leagues"]
              if max_pick_n(x)>=72
          )
          assert hold==10

          active={
              p.name for p in Path(".github/workflows").iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }
          protected=set(archive["protected_active_workflows"])
          this_workflow=(
              "draft-pick-fv-v7-phase1-r1-r6-full-scale-preregistration.yml"
          )
          assert active == protected | {this_workflow}, (
              sorted(active-protected-{this_workflow}),
              sorted(protected-active),
          )

          archived={
              Path(row["archive_path"]).name
              for row in archive["archive_entries"]
          }
          expected_v6={
              "draft-pick-fv-v6-phase1-structural-continuity-preregistration.yml",
              "draft-pick-fv-v6-phase1-1-clean-source-amendment.yml",
              "draft-pick-fv-v6-phase2-r1-r4-source-identity-freeze.yml",
              "draft-pick-fv-v6-phase3-r1-r4-historical-outcome-harvest.yml",
              "draft-pick-fv-v6-phase3-1-dob-lineage-repair.yml",
              "draft-pick-fv-v6-phase4-loyo-development-selection.yml",
              "draft-pick-fv-v6-phase4-research-closeout.yml",
          }
          assert expected_v6 <= archived
          assert not (expected_v6 & active)

          print("PASS: cleaned repo/V6 closeout/source-depth state frozen.")
          print("PASS: 19 protected workflows + this V7 Phase 1 workflow active.")
          print("PASS: V6 workflow set archived.")
          PY

      - name: Write exact V7 preregistration builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/build_v7_phase1_preregistration.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          V6 = ROOT / "research" / "draft-pick-fv-v6"
          V7 = ROOT / "research" / "draft-pick-fv-v7"

          CLOSE = V6 / "r1_r4_v6_research_closeout.json"
          CLOSE_MAN = V6 / "r1_r4_v6_research_closeout_manifest.json"
          V6_PRE = V6 / "structural_continuity_preregistration_v6.json"
          SOURCE = V6 / "r1_r4_source_catalog_v6_1.json"
          SOURCE_SUM = V6 / "r1_r4_source_identity_summary_v6_1.json"
          ARCHIVE = ROOT / ".github/workflow-archive/completed-research/archive_manifest.json"

          OUT = V7 / "r1_r6_full_scale_preregistration_v7.json"
          OUT_MD = V7 / "r1_r6_full_scale_preregistration_v7.md"
          OUT_MAN = V7 / "r1_r6_full_scale_preregistration_manifest_v7.json"

          SEARCH_TERMS = [
              "dynasty",
              "superflex",
              "super flex",
              "2qb",
              "2 qb",
              "rookie",
              "idp",
              "devy",
              "empire",
              "contract",
              "salary",
              "taxi",
              "fantasy",
              "football",
              "league",
          ]
          DEV_YEARS = [2018, 2019, 2020, 2021, 2022, 2023]
          TIERS = ["early", "mid", "late"]
          CELLS = [f"r{r}_{t}" for r in range(1, 7) for t in TIERS]

          def load(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canon(obj):
              raw = json.dumps(
                  obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def max_pick_n(league):
              return max(
                  [int(x.get("pick_n") or 0) for x in league.get("unit_summary", [])]
                  or [0]
              )

          def deep_counts(source):
              counts = {str(y): 0 for y in DEV_YEARS}
              for league in source["development"]["leagues"]:
                  y = int(league["draft_year"])
                  if y in DEV_YEARS and max_pick_n(league) >= 72:
                      counts[str(y)] += 1
              holdout_deep = sum(
                  1 for league in source["temporal_holdout_2024"]["leagues"]
                  if max_pick_n(league) >= 72
              )
              return counts, holdout_deep

          def main():
              close = load(CLOSE)
              close_man = load(CLOSE_MAN)
              v6 = load(V6_PRE)
              source = load(SOURCE)
              source_sum = load(SOURCE_SUM)
              archive = load(ARCHIVE)

              assert close["status"] == \
                  "V6_RESEARCH_CLOSED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE"
              assert close["final_decision"] == \
                  "STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
              assert close["research_complete"] is True
              assert close["eligible_candidate_n"] == 0
              assert close["selected_candidate"] is None
              assert close["production_change_authorized"] is False
              assert close["holdout_2024"]["H2_outcomes_opened_by_V6"] is False
              assert close["holdout_2024"]["H3_outcomes_opened_by_V6"] is False
              assert close["holdout_2024"][
                  "remains_available_for_future_separately_preregistered_use"
              ] is True
              assert close["successor_research_constraints"]["new_study_required"] is True
              assert close["successor_research_constraints"]["do_not_repair_or_reopen_V6"] \
                  is True

              assert close_man["research_complete"] is True
              assert close_man["successor_requires_new_preregistration"] is True
              assert close_man["2024_H2_outcomes_opened"] is False
              assert close_man["2024_H3_outcomes_opened"] is False

              assert source["status"] == "FROZEN_SOURCE_IDENTITY_PASS"
              assert source["development"]["clean_league_n"] == 378
              assert source["development"]["counts_by_year"] == {
                  "2018": 31,
                  "2019": 50,
                  "2020": 59,
                  "2021": 64,
                  "2022": 90,
                  "2023": 84,
              }
              assert source["temporal_holdout_2024"]["clean_league_n"] == 41
              assert source["holdout_2024_outcomes_read"] is False

              deep_seed, holdout_deep = deep_counts(source)
              assert deep_seed == {
                  "2018": 4,
                  "2019": 11,
                  "2020": 12,
                  "2021": 8,
                  "2022": 17,
                  "2023": 12,
              }
              assert holdout_deep == 10

              assert archive["schema_version"] == 6
              assert archive["last_cleanup_batch"] == \
                  "2026-09-23-post-draft-pick-fv-v6"
              assert archive["archive_workflow_n"] == 120
              assert archive["protected_active_workflow_n"] == 19

              base = v6["frozen_deployed_baseline"]["pick_base_2027"]
              assert base == {
                  "1": {"early": 7500.0, "mid": 5854.0, "late": 5244.0},
                  "2": {"early": 3906.0, "mid": 3624.0, "late": 3291.0},
                  "3": {"early": 2692.0, "mid": 2682.0, "late": 2319.0},
                  "4": {"early": 1972.0, "mid": 1831.0, "late": 1689.0},
                  "5": {"early": 1414.0, "mid": 1250.0, "late": 1118.0},
                  "6": {"early": 1014.0, "mid": 853.0, "late": 740.0},
              }

              generated = datetime.now(timezone.utc).isoformat()
              decision = "FREEZE_V7_R1_R6_FULL_SCALE_PREREGISTRATION_SOURCE_FREEZE_NEXT"

              prereg = {
                  "schema_version": 1,
                  "study_id": "draft-pick-fv-v7-r1-r6-full-scale-tail-continuity",
                  "stage": "phase1_preregistration",
                  "status": "FROZEN_PRE_V7_SOURCE_EXPANSION_PRE_OUTCOME",
                  "generated_at_utc": generated,
                  "decision": decision,
                  "research_only": True,
                  "production_change_authorized": False,
                  "question": (
                      "Can a jointly fitted R1-R6 Draft Pick Fundamental Value curve "
                      "preserve historical O1 shape while retaining the large O2 "
                      "accuracy gains observed in V6 and eliminating the R4-to-R5 "
                      "structural discontinuity exposed by the V6 D1 diagnostic?"
                  ),
                  "reason_for_v7": {
                      "V6_closed_without_eligible_candidate": True,
                      "V6_results_are_exposed_development_evidence": True,
                      "V6_D1_diagnostic_only": True,
                      "V6_D1_loyo_H3_O2_improvement_vs_C0":
                          close["d1_boundary_free_diagnostic"][
                              "loyo_h3_o2_improvement_vs_C0"
                          ],
                      "V6_D1_H3_O1_relative_change_vs_C0":
                          close["d1_boundary_free_diagnostic"][
                              "h3_o1_relative_change_vs_C0"
                          ],
                      "V6_D1_unconstrained_r4_late":
                          close["d1_boundary_free_diagnostic"]["unconstrained_r4_late"],
                      "V6_frozen_r5_early":
                          close["d1_boundary_free_diagnostic"]["frozen_r5_early"],
                      "V6_r4_to_r5_upward_jump":
                          close["d1_boundary_free_diagnostic"][
                              "r4_late_to_r5_early_upward_jump"
                          ],
                      "V6_r4_to_r5_upward_jump_relative":
                          close["d1_boundary_free_diagnostic"][
                              "r4_late_to_r5_early_upward_jump_relative_to_r4_late"
                          ],
                      "interpretation": (
                          "V6 development evidence motivates testing the whole R1-R6 "
                          "absolute scale. It does not authorize promoting D1, changing "
                          "V6, or treating any 2018-2023 result as fresh validation."
                      ),
                  },
                  "evidence_status": {
                      "2018_2023_outcomes_are_exposed_development_only": True,
                      "no_claim_2018_2023_are_fresh_holdout": True,
                      "candidate_families_are_preregistered_after_V6_development_results":
                          True,
                      "2024_H2_outcomes_opened_pre_V7": False,
                      "2024_H3_outcomes_opened_pre_V7": False,
                      "2024_primary_H3_remains_unspent": True,
                      "V7_preregistration_reads_new_NFL_outcomes": False,
                      "V7_preregistration_reads_2024_NFL_outcomes": False,
                  },
                  "frozen_deployed_baseline": {
                      "candidate_id": "C0_DEPLOYED",
                      "pick_base_2027": base,
                      "year_discount_context_only": {
                          "2027": 1.0,
                          "2028": 0.85,
                          "2029": 0.72,
                      },
                      "YEAR_DISCOUNT_fit_or_change_allowed": False,
                  },
                  "cell_definition": {
                      "rounds": [1, 2, 3, 4, 5, 6],
                      "tiers": {
                          "early": "within-round picks 1-4",
                          "mid": "within-round picks 5-8",
                          "late": "within-round picks 9-12",
                      },
                      "production_cell_n": 18,
                      "cell_order": CELLS,
                      "required_pick_slots": "overall slots 1-72 inclusive",
                  },
                  "source_population": {
                      "provider": "MyFantasyLeague",
                      "format": "12-team Superflex/2QB dynasty rookie drafts",
                      "development_years": DEV_YEARS,
                      "development_seed": {
                          "source": "V6.1 frozen clean R1-R4 catalog",
                          "clean_league_n": 378,
                          "counts_by_year": source["development"]["counts_by_year"],
                          "known_full_72_pick_seed_counts_by_year": deep_seed,
                          "outcomes_used_to_compute_depth_counts": False,
                      },
                      "development_expansion": {
                          "required": True,
                          "reason": (
                              "The frozen V6 clean source has only 4/11/12/8/17/12 "
