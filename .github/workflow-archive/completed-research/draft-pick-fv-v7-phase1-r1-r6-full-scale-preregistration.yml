                      "minimum_year_cell_retention": 0.95,
                      "minimum_year_cell_identity_coverage": 0.95,
                      "minimum_holdout_cell_retention": 0.95,
                      "minimum_holdout_cell_identity_coverage": 0.95,
                      "operational_identity_denominator": "retained pick occurrences",
                      "stable_identity_priority": [
