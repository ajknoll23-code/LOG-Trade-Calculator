                      },
                      "C3_SMOOTH_ADDITIVE_R1_R6": {
                          "eligible": True,
                          "effective_parameters": 5,
                          "parameters": [
                              "A",
                              "s12",
                              "s234",
                              "s56",
                              "tier_step",
                          ],
                          "bounds": {
