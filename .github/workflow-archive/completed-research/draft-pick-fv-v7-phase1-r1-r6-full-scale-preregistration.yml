                          "search_allowed": True,
                          "search_must_finish_before_any_V7_candidate_fit": True,
                          "search_must_not_read_player_outcomes": True,
                          "years": DEV_YEARS,
                          "search_terms": SEARCH_TERMS,
                          "max_results_per_term_per_year": 100,
                          "union_rule": (
                              "Probe the complete deterministic capped union for every "
