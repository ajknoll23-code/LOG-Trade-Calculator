name: B28 Schedule Utility V1 - Phase 2A Retrospective Predictive Validation Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: b28-schedule-utility-v1-phase2a
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PHASE1E_B_COMMIT: "0beb34b7419b0a19bca6a31b37a2819782804670"
  FROZEN_LOG_SAPA_SHA256: "9ab4ec5b21ef9ef57e476e861a7293dbc886b9bc9d7cc5f0bd5cc982cc729ee6"
  PHASE2A_ANALYSIS_SHA256: "355d353dd88627d9ed573db875608230a32182f8741aca75fc2ee792c40e25ba"

jobs:
  phase2a:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Phase 1E-B prerequisite and outcome firewall
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$PHASE1E_B_COMMIT" HEAD

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          bridge = json.loads(
              (root / "schedule_utility_v1_phase1e_b_private_bridge.json")
              .read_text(encoding="utf-8")
          )
          prereg1d = json.loads(
              (root / "schedule_utility_v1_phase1d_log_sapa_prereg.json")
              .read_text(encoding="utf-8")
          )

          observed_sha = hashlib.sha256(
              (root / "log_sapa_v1.py").read_bytes()
          ).hexdigest()

          assert bridge["study_id"] == "schedule-utility-v1"
          assert bridge["phase"] == "1E-B"
          assert bridge["status"] == "PASS_PRIVATE_SOURCE_BRIDGE"
          assert bridge["summary"]["pass"] is True
          assert bridge["summary"]["cells_at_or_above_0_50"] == 7
          assert bridge["outcome_firewall"]["historical_eval_stat_rows_2015_2025_read"] is False
          assert bridge["outcome_firewall"]["historical_target_outcomes_2015_2025_opened"] is False
          assert bridge["outcome_firewall"]["phase2_outcome_test_authorized"] is False
          assert bridge["outcome_firewall"]["phase2_preregistration_authorized"] is True
          assert bridge["production_change_authorized"] is False

          assert observed_sha == bridge["frozen_log_sapa_sha256"]
          assert observed_sha == prereg1d["implementation"]["sha256"]
          assert observed_sha == (
              "9ab4ec5b21ef9ef57e476e861a7293dbc886b9bc9d7cc5f0bd5cc982cc729ee6"
          )

          assert bridge["next_phase"]["phase"] == "2A"
          assert bridge["next_phase"]["outcomes_may_be_opened_before_phase2a_freeze"] is False

          print("PASS: Phase 1E-B bridge prerequisite verified; outcomes still sealed.")
          PY

      - name: Snapshot production before Phase 2A freeze
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Freeze exact Phase 2A analysis implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/schedule-utility-v1

          cat > research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py <<'PYFILE'
          #!/usr/bin/env python3
          """
          Schedule Utility V1 — Phase 2A frozen retrospective validation analysis.

          This module contains pure analysis functions only. It performs no network I/O,
          no source download, and no target-outcome loading by itself.

          Primary question:
          Does the already-frozen LOG-SAPA defense adjustment improve next-game
          team-position fantasy-point forecasts over offense form alone?
          """

          from __future__ import annotations

          from collections import defaultdict
          import itertools
          import math
          import statistics
          from typing import Iterable, Mapping

          SEASONS = tuple(range(2015, 2026))
          CELLS = (
              "QB_HALF", "RB_HALF", "WR_HALF", "TE_HALF",
              "RB_PPR", "WR_PPR", "TE_PPR",
          )
          TARGET_WEEK_MIN = 4
          TARGET_WEEK_MAX = 17
          EXPECTED_DIRECTIONAL_MATCHUPS_PER_SEASON = 416
          MIN_COVERAGE_FRACTION_PER_SEASON_CELL = 0.95

          PRIMARY_MIN_MEAN_RELATIVE_MAE_IMPROVEMENT = 0.01
          PRIMARY_MAX_ONE_SIDED_SIGNFLIP_P = 0.05
          PRIMARY_MIN_POSITIVE_CELLS = 5
          PRIMARY_MIN_WORST_CELL_RELATIVE_MAE_IMPROVEMENT = -0.02


          def _finite(x) -> float:
              v = float(x)
              if not math.isfinite(v):
                  raise ValueError(f"non-finite value: {x!r}")
              return v


          def mae(errors: Iterable[float]) -> float:
              vals = [abs(_finite(x)) for x in errors]
              if not vals:
                  raise ValueError("MAE requires at least one error")
              return statistics.fmean(vals)


          def rmse(errors: Iterable[float]) -> float:
              vals = [_finite(x) for x in errors]
              if not vals:
                  raise ValueError("RMSE requires at least one error")
              return math.sqrt(statistics.fmean(x * x for x in vals))


          def relative_improvement(baseline_metric: float, adjusted_metric: float) -> float:
              baseline_metric = _finite(baseline_metric)
              adjusted_metric = _finite(adjusted_metric)
              if baseline_metric <= 0:
                  raise ValueError("baseline metric must be > 0")
              return (baseline_metric - adjusted_metric) / baseline_metric


          def exact_one_sided_signflip_p(values: Iterable[float]) -> float:
              """
              Exact one-sided sign-flip test on season-level effects.

              H1: mean effect > 0.

              Every one of the 2^n sign assignments is enumerated. The exact p-value is
              the fraction whose mean is >= the observed all-positive-sign mean.
              No Monte Carlo approximation and no +1 correction are used.
              """
              vals = tuple(_finite(v) for v in values)
              if not vals:
                  raise ValueError("sign-flip test requires values")
              observed = statistics.fmean(vals)
              extreme = 0
              total = 0
              for signs in itertools.product((-1.0, 1.0), repeat=len(vals)):
                  perm_mean = statistics.fmean(s * v for s, v in zip(signs, vals))
                  total += 1
                  if perm_mean >= observed - 1e-15:
                      extreme += 1
              return extreme / total


          def _validate_row(row: Mapping[str, object]) -> dict:
              required = {
                  "season", "week", "cell", "actual",
                  "baseline_forecast", "adjusted_forecast", "defense_effect",
              }
              missing = required - set(row)
              if missing:
                  raise KeyError(f"evaluation row missing fields: {sorted(missing)}")

              season = int(row["season"])
              week = int(row["week"])
              cell = str(row["cell"])

              if season not in SEASONS:
                  raise ValueError(f"season outside frozen evaluation set: {season}")
              if not (TARGET_WEEK_MIN <= week <= TARGET_WEEK_MAX):
                  raise ValueError(f"week outside frozen target range: {week}")
              if cell not in CELLS:
                  raise ValueError(f"unknown cell: {cell}")

              actual = _finite(row["actual"])
              baseline = _finite(row["baseline_forecast"])
              adjusted = _finite(row["adjusted_forecast"])
              defense_effect = _finite(row["defense_effect"])

              # Frozen identity: adjusted forecast must be baseline + defense effect.
              if abs(adjusted - (baseline + defense_effect)) > 1e-9:
                  raise ValueError("adjusted forecast identity violated")

              return {
                  "season": season,
                  "week": week,
                  "cell": cell,
                  "actual": actual,
                  "baseline_forecast": baseline,
                  "adjusted_forecast": adjusted,
                  "defense_effect": defense_effect,
              }


          def evaluate(rows: Iterable[Mapping[str, object]]) -> dict:
              clean = [_validate_row(row) for row in rows]
              if not clean:
                  raise ValueError("no evaluation rows")

              grouped: dict[tuple[int, str], list[dict]] = defaultdict(list)
              for row in clean:
                  grouped[(row["season"], row["cell"])].append(row)

              expected_groups = {(s, c) for s in SEASONS for c in CELLS}
              if set(grouped) != expected_groups:
                  missing = sorted(expected_groups - set(grouped))
                  extra = sorted(set(grouped) - expected_groups)
                  raise ValueError(f"season-cell group mismatch; missing={missing}, extra={extra}")

              min_required = math.ceil(
                  EXPECTED_DIRECTIONAL_MATCHUPS_PER_SEASON
                  * MIN_COVERAGE_FRACTION_PER_SEASON_CELL
              )

              season_cell = {}
              for season in SEASONS:
                  for cell in CELLS:
                      g = grouped[(season, cell)]
                      n = len(g)
                      if n < min_required:
                          raise ValueError(
                              f"coverage gate failed for {season} {cell}: "
                              f"{n} < {min_required}"
                          )
                      if n > EXPECTED_DIRECTIONAL_MATCHUPS_PER_SEASON:
                          raise ValueError(
                              f"too many directional matchups for {season} {cell}: {n}"
                          )

                      base_err = [r["baseline_forecast"] - r["actual"] for r in g]
                      adj_err = [r["adjusted_forecast"] - r["actual"] for r in g]

                      base_mae = mae(base_err)
                      adj_mae = mae(adj_err)
                      base_rmse = rmse(base_err)
                      adj_rmse = rmse(adj_err)

                      season_cell[(season, cell)] = {
                          "n": n,
                          "coverage_fraction": n / EXPECTED_DIRECTIONAL_MATCHUPS_PER_SEASON,
                          "baseline_mae": base_mae,
                          "adjusted_mae": adj_mae,
                          "relative_mae_improvement": relative_improvement(base_mae, adj_mae),
                          "baseline_rmse": base_rmse,
                          "adjusted_rmse": adj_rmse,
                          "relative_rmse_improvement": relative_improvement(base_rmse, adj_rmse),
                      }

              # Equal-weight cells within each season, then equal-weight seasons.
              season_effects = {}
              for season in SEASONS:
                  season_effects[season] = statistics.fmean(
                      season_cell[(season, cell)]["relative_mae_improvement"]
                      for cell in CELLS
                  )

              cell_effects = {}
              for cell in CELLS:
                  effects = [
                      season_cell[(season, cell)]["relative_mae_improvement"]
                      for season in SEASONS
                  ]
                  cell_effects[cell] = {
                      "mean_relative_mae_improvement": statistics.fmean(effects),
                      "median_relative_mae_improvement": statistics.median(effects),
                      "positive_seasons": sum(v > 0 for v in effects),
                      "exact_one_sided_signflip_p": exact_one_sided_signflip_p(effects),
                      "mean_relative_rmse_improvement": statistics.fmean(
                          season_cell[(season, cell)]["relative_rmse_improvement"]
                          for season in SEASONS
                      ),
                  }

              primary_effect = statistics.fmean(season_effects.values())
              primary_p = exact_one_sided_signflip_p(season_effects.values())
              positive_cells = sum(
                  payload["mean_relative_mae_improvement"] > 0
                  for payload in cell_effects.values()
              )
              worst_cell = min(
                  payload["mean_relative_mae_improvement"]
                  for payload in cell_effects.values()
              )

              primary_gate = {
                  "mean_relative_mae_improvement_at_least_0_01":
                      primary_effect >= PRIMARY_MIN_MEAN_RELATIVE_MAE_IMPROVEMENT,
                  "one_sided_signflip_p_at_most_0_05":
                      primary_p <= PRIMARY_MAX_ONE_SIDED_SIGNFLIP_P,
                  "positive_cells_at_least_5":
                      positive_cells >= PRIMARY_MIN_POSITIVE_CELLS,
                  "worst_cell_not_below_minus_0_02":
                      worst_cell >= PRIMARY_MIN_WORST_CELL_RELATIVE_MAE_IMPROVEMENT,
              }
              passed = all(primary_gate.values())

              return {
                  "primary": {
                      "equal_season_equal_cell_mean_relative_mae_improvement": primary_effect,
                      "exact_one_sided_season_signflip_p": primary_p,
                      "positive_cells": positive_cells,
                      "worst_cell_mean_relative_mae_improvement": worst_cell,
                      "gate_components": primary_gate,
                      "pass": passed,
                      "decision": (
                          "PASS_RETROSPECTIVE_PREDICTIVE_VALIDATION"
                          if passed
                          else "STOP_RETROSPECTIVE_PREDICTIVE_VALIDATION"
                      ),
                  },
                  "season_effects": season_effects,
                  "cell_effects": cell_effects,
                  "coverage": {
                      "expected_directional_matchups_per_season_cell":
                          EXPECTED_DIRECTIONAL_MATCHUPS_PER_SEASON,
                      "minimum_fraction_per_season_cell":
                          MIN_COVERAGE_FRACTION_PER_SEASON_CELL,
                      "minimum_rows_per_season_cell": min_required,
                      "observed_total_rows": len(clean),
                  },
              }


          def selftest() -> None:
              # Exact sign-flip: all 11 equal positive effects -> 1 / 2^11.
              p = exact_one_sided_signflip_p([0.02] * 11)
              assert abs(p - (1 / 2048)) < 1e-15

              # One positive effect -> exact p = 1/2.
              p1 = exact_one_sided_signflip_p([0.02])
              assert abs(p1 - 0.5) < 1e-15

              assert abs(relative_improvement(10.0, 9.0) - 0.1) < 1e-15
              assert abs(mae([-2, 1, 3]) - 2.0) < 1e-15
              assert abs(rmse([3, 4]) - math.sqrt(12.5)) < 1e-15

              # Identity guard.
              good = {
                  "season": 2015, "week": 4, "cell": "QB_HALF",
                  "actual": 20.0, "baseline_forecast": 18.0,
                  "defense_effect": 1.5, "adjusted_forecast": 19.5,
              }
              assert _validate_row(good)["adjusted_forecast"] == 19.5

              bad = dict(good, adjusted_forecast=99.0)
              try:
                  _validate_row(bad)
              except ValueError as exc:
                  assert "identity" in str(exc)
              else:
                  raise AssertionError("adjusted forecast identity guard failed")

              print("PASS: Phase 2A frozen analysis synthetic selftest")


          if __name__ == "__main__":
              selftest()
          PYFILE

          chmod +x research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py
          python3 -m py_compile \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py

          test "$(sha256sum research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py | awk '{print $1}')" \
            = "$PHASE2A_ANALYSIS_SHA256"

          python3 research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py

      - name: Freeze Phase 2A preregistration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          prereg = {'schema_version': 1, 'study_id': 'schedule-utility-v1', 'phase': '2A', 'status': 'PREREGISTERED_RETROSPECTIVE_PREDICTIVE_VALIDATION', 'prerequisite': {'phase1e_b_freeze_commit': '0beb34b7419b0a19bca6a31b37a2819782804670', 'phase1e_b_status': 'PASS_PRIVATE_SOURCE_BRIDGE', 'source_bridge_passed': True, 'frozen_log_sapa_sha256': '9ab4ec5b21ef9ef57e476e861a7293dbc886b9bc9d7cc5f0bd5cc982cc729ee6'}, 'outcome_firewall': {'historical_eval_stat_rows_2015_2025_read_in_phase2a': False, 'historical_target_outcomes_2015_2025_opened_in_phase2a': False, 'outcomes_may_be_opened_only_after_phase2a_freeze': True, 'analysis_threshold_tuning_after_outcomes_authorized': False, 'predictor_parameter_tuning_after_outcomes_authorized': False}, 'evaluation_population': {'seasons': [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], 'target_weeks_inclusive': [4, 17], 'season_type': 'regular season only', 'cells': ['QB_HALF', 'RB_HALF', 'WR_HALF', 'TE_HALF', 'RB_PPR', 'WR_PPR', 'TE_PPR'], 'unit': 'season-week-offense-defense-position-scoring_mode directional matchup', 'expected_directional_matchups_per_season_cell': 416, 'minimum_coverage_fraction_per_season_cell': 0.95, 'missing_predictor_or_outcome': 'EXCLUDE_ROW_AND_COUNT_AGAINST_COVERAGE_GATE', 'cross_season_pooling_for_predictor': False}, 'source_and_identity_contract': {'player_stats_source': 'nflverse weekly player stats', 'schedule_source': 'nflverse schedules', 'source_assets_sha256_must_be_frozen_at_first_ingest': True, 'team_aliases': {'ARZ': 'ARI', 'BLT': 'BAL', 'CLV': 'CLE', 'HST': 'HOU', 'JAC': 'JAX', 'LA': 'LAR', 'LAR': 'LAR', 'OAK': 'LV', 'SD': 'LAC', 'STL': 'LAR', 'WSH': 'WAS'}, 'team_field_adapter': 'use recent_team when present; else team; if both present they must canonicalize identically', 'position_contract': 'same frozen LOG-SAPA QB/RB/WR/TE canonicalization', 'zero_stat_position_rule': 'for a scheduled team-game-position with no qualifying player-stat row, construct a zero team-position total only when schedule participation is unambiguous; this is source completion, not imputation of a missing game', 'conflicting_identity_or_schedule_join': 'FAIL_CLOSED'}, 'predictor_construction': {'log_sapa_implementation_sha256': '9ab4ec5b21ef9ef57e476e861a7293dbc886b9bc9d7cc5f0bd5cc982cc729ee6', 'lookahead_rule': 'target week W may use only same-season information from weeks < W', 'lookback': 'frozen LOG-SAPA prior 10 NFL weeks', 'baseline_forecast': 'unweighted mean fantasy points scored by the target offense-position in the same pre-target LOG-SAPA lookback window', 'minimum_offense_baseline_games': 2, 'defense_effect': 'frozen LOG-SAPA defense_effect for target defense, position, scoring mode', 'adjusted_forecast': 'baseline_forecast + defense_effect', 'fitted_coefficients': False, 'forecast_clamping': False, 'recency_weighting': False, 'cross_season_carryover': False}, 'target': {'outcome': 'target-week fantasy points scored by offense team-position versus target defense', 'same_scoring_formula_as_predictor': True, 'target_week_rows_never_enter_predictor': True, 'special_teams_td_included': False}, 'primary_estimand': {'season_cell_metric': 'relative MAE improvement = (baseline_MAE - adjusted_MAE) / baseline_MAE', 'season_aggregate': 'equal-weight mean of 7 cell relative MAE improvements', 'overall_effect': 'equal-weight mean of 11 season aggregates', 'inference': 'exact one-sided sign-flip test over the 11 season aggregates', 'null_direction': 'no positive mean improvement', 'permutation_count': 2048, 'monte_carlo': False, 'row_level_independence_assumed': False}, 'primary_gate': {'overall_mean_relative_mae_improvement_at_least': 0.01, 'exact_one_sided_season_signflip_p_at_most': 0.05, 'cells_with_positive_mean_relative_mae_improvement_at_least': 5, 'worst_cell_mean_relative_mae_improvement_at_least': -0.02, 'coverage_gate_must_pass': True, 'all_components_required': True}, 'secondary_diagnostics_not_gate_inputs': {'relative_rmse_improvement': True, 'per_cell_mean_and_median_relative_mae_improvement': True, 'per_cell_exact_season_signflip_p': True, 'positive_seasons_per_cell': True, 'defense_effect_vs_realized_offense_residual_association': 'report Spearman if implemented exactly before outcome read; not a gate', 'easiest_vs_hardest_quartile_realized_residual_spread': 'descriptive only; not a gate'}, 'decision_rule': {'pass': 'PASS_RETROSPECTIVE_PREDICTIVE_VALIDATION only if every primary gate component passes', 'fail': 'STOP_RETROSPECTIVE_PREDICTIVE_VALIDATION otherwise', 'post_outcome_threshold_loosening_authorized': False, 'post_outcome_cell_cherry_picking_authorized': False, 'phase3_authorized_on_pass_only': True, 'production_change_authorized_on_pass': False}, 'implementation': {'analysis_path': 'research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py', 'analysis_sha256': '355d353dd88627d9ed573db875608230a32182f8741aca75fc2ee792c40e25ba', 'synthetic_selftest_only_in_phase2a': True}, 'next_phase': {'phase': '2B', 'name': 'historical data harvest and preregistered retrospective predictive validation', 'may_open_2015_2025_target_outcomes': True, 'may_change_frozen_predictor_or_gate': False}, 'production_change_authorized': False, 'phase3_shadow_authorized': False}

          observed = hashlib.sha256(
              (root / "schedule_utility_v1_phase2a_analysis.py").read_bytes()
          ).hexdigest()
          assert observed == prereg["implementation"]["analysis_sha256"]

          (root / "schedule_utility_v1_phase2a_prereg.json").write_text(
              json.dumps(prereg, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Schedule Utility V1 — Phase 2A Retrospective Predictive Validation Preregistration",
              "",
              "**Decision:** `PREREGISTERED_RETROSPECTIVE_PREDICTIVE_VALIDATION`",
              "",
              "No 2015-2025 target outcomes were opened in this phase.",
              "",
              "## Frozen test",
              "",
              "- Seasons: **2015-2025**",
              "- Target weeks: **4-17**",
              "- Cells: **7** (QB Half; RB/WR/TE Half and PPR)",
              "- Unit: directional offense-vs-defense position/scoring matchup",
              "- Baseline forecast: trailing offense-position mean in the same pre-target window",
              "- LOG-SAPA forecast: baseline + frozen defense effect",
              "- Fitted coefficients: **NONE**",
              "- Target-week information in predictor: **PROHIBITED**",
              "",
              "## Primary inference",
              "",
              "- Metric: relative MAE improvement versus baseline",
              "- Weighting: equal cells within season, then equal seasons",
              "- Inference: exact one-sided sign-flip across 11 season effects",
              "- Exact sign assignments: **2,048**",
              "- Row-level independence is **not** assumed",
              "",
              "## Frozen pass gate",
              "",
              "- Mean relative MAE improvement >= **1.0%**",
              "- Exact one-sided season sign-flip p <= **0.05**",
              "- At least **5/7** cells have positive mean MAE improvement",
              "- Worst cell mean relative MAE improvement >= **-2.0%**",
              "- Every season-cell coverage >= **95%**",
              "- **All** components must pass",
              "",
              "Failure means `STOP_RETROSPECTIVE_PREDICTIVE_VALIDATION`. "
              "Threshold loosening or post-outcome cell cherry-picking is prohibited.",
              "",
              "## Production impact",
              "",
              "None. A Phase 2 pass authorizes only consideration of Phase 3 prospective shadow.",
              "",
              "Next: **Phase 2B — historical data harvest and preregistered retrospective validation**.",
              "",
          ]
          (root / "schedule_utility_v1_phase2a_prereg.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY

      - name: Validate frozen preregistration and no outcome access
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          d = json.loads(
              (root / "schedule_utility_v1_phase2a_prereg.json")
              .read_text(encoding="utf-8")
          )

          assert d["study_id"] == "schedule-utility-v1"
          assert d["phase"] == "2A"
          assert d["status"] == "PREREGISTERED_RETROSPECTIVE_PREDICTIVE_VALIDATION"

          fw = d["outcome_firewall"]
          assert fw["historical_eval_stat_rows_2015_2025_read_in_phase2a"] is False
          assert fw["historical_target_outcomes_2015_2025_opened_in_phase2a"] is False
          assert fw["outcomes_may_be_opened_only_after_phase2a_freeze"] is True
          assert fw["analysis_threshold_tuning_after_outcomes_authorized"] is False
          assert fw["predictor_parameter_tuning_after_outcomes_authorized"] is False

          pop = d["evaluation_population"]
          assert pop["seasons"] == list(range(2015, 2026))
          assert pop["target_weeks_inclusive"] == [4, 17]
          assert len(pop["cells"]) == 7
          assert pop["expected_directional_matchups_per_season_cell"] == 416
          assert pop["minimum_coverage_fraction_per_season_cell"] == 0.95

          pred = d["predictor_construction"]
          assert pred["fitted_coefficients"] is False
          assert pred["forecast_clamping"] is False
          assert pred["recency_weighting"] is False
          assert pred["cross_season_carryover"] is False
          assert pred["adjusted_forecast"] == "baseline_forecast + defense_effect"

          primary = d["primary_estimand"]
          assert primary["permutation_count"] == 2048
          assert primary["monte_carlo"] is False
          assert primary["row_level_independence_assumed"] is False

          gate = d["primary_gate"]
          assert gate["overall_mean_relative_mae_improvement_at_least"] == 0.01
          assert gate["exact_one_sided_season_signflip_p_at_most"] == 0.05
          assert gate["cells_with_positive_mean_relative_mae_improvement_at_least"] == 5
          assert gate["worst_cell_mean_relative_mae_improvement_at_least"] == -0.02
          assert gate["coverage_gate_must_pass"] is True
          assert gate["all_components_required"] is True

          decision = d["decision_rule"]
          assert decision["post_outcome_threshold_loosening_authorized"] is False
          assert decision["post_outcome_cell_cherry_picking_authorized"] is False
          assert decision["phase3_authorized_on_pass_only"] is True
          assert decision["production_change_authorized_on_pass"] is False

          observed = hashlib.sha256(
              (root / "schedule_utility_v1_phase2a_analysis.py").read_bytes()
          ).hexdigest()
          assert observed == d["implementation"]["analysis_sha256"]
          assert observed == "355d353dd88627d9ed573db875608230a32182f8741aca75fc2ee792c40e25ba"

          assert d["production_change_authorized"] is False
          assert d["phase3_shadow_authorized"] is False
          assert d["next_phase"]["phase"] == "2B"
          assert d["next_phase"]["may_open_2015_2025_target_outcomes"] is True
          assert d["next_phase"]["may_change_frozen_predictor_or_gate"] is False

          print("PASS: Phase 2A prereg, exact analysis SHA, gates, and firewall validated.")
          PY

          # Phase 2A must contain no historical data files and no data-download code.
          if find research/schedule-utility-v1 -maxdepth 1 -type f \
            \( -name '*2015*.csv' -o -name '*2016*.csv' -o -name '*2017*.csv' \
               -o -name '*2018*.csv' -o -name '*2019*.csv' -o -name '*2020*.csv' \
               -o -name '*2021*.csv' -o -name '*2022*.csv' -o -name '*2023*.csv' \
               -o -name '*2024*.csv' -o -name '*2025*.csv' \) \
            -print -quit | grep -q .; then
            echo "Unexpected historical data file found in research path."
            exit 1
          fi

          if grep -n -E '\bcurl\b|\bwget\b|urlopen\(|requests\.|read_csv\(|read_parquet\(' \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py; then
            echo "Phase 2A analysis unexpectedly contains source-access code."
            exit 1
          fi

          echo "PASS: Phase 2A opened no historical outcomes."

      - name: Prove zero production mutation
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"

          git diff --check

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "PASS: zero production mutation."

      - name: Commit frozen Phase 2A preregistration
        shell: bash
        run: |
          set -euo pipefail

          git add \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis.py \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_prereg.json \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_prereg.md

          if git diff --cached --quiet; then
            echo "Phase 2A preregistration already frozen; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Schedule Utility V1 Phase 2A predictive validation preregistration"
          git push origin HEAD:main

      - name: Closeout
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## B28 Schedule Utility V1 — Phase 2A"
            echo
            echo "- Decision: **PREREGISTERED_RETROSPECTIVE_PREDICTIVE_VALIDATION**"
            echo "- Historical target outcomes opened: **NO**"
            echo "- Seasons: **2015-2025**"
            echo "- Target weeks: **4-17**"
            echo "- Baseline: **trailing offense-position form**"
            echo "- Adjusted forecast: **baseline + frozen LOG-SAPA defense effect**"
            echo "- Fitted coefficients: **NONE**"
            echo "- Primary metric: **relative MAE improvement**"
            echo "- Inference: **exact season-level sign-flip (2,048 assignments)**"
            echo "- Practical threshold: **>= 1.0% mean MAE improvement**"
            echo "- Positive-cell guard: **>= 5/7**"
            echo "- Worst-cell guard: **>= -2.0%**"
            echo "- Coverage: **>= 95% per season-cell**"
            echo "- Threshold loosening after outcomes: **PROHIBITED**"
            echo "- Phase 3 authorized now: **NO**"
            echo "- Production change: **NONE**"
            echo "- Next: **Phase 2B historical outcome validation**"
          } >> "$GITHUB_STEP_SUMMARY"
