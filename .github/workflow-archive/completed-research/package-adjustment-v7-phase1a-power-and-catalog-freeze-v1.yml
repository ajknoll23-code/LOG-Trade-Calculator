# PREFLIGHTED: PACKAGE_ADJUSTMENT_V7_PHASE1A_POWER_AND_CATALOG_FREEZE_V1
name: Package Adjustment V7 - Phase 1A Power and Catalog Freeze
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture Phase 1A base
      id: base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install regression dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen lineage and player-value source
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        declare -A EXPECTED=(
          ["research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json"]="07063ddc8842ec01f876efe5dcab548f9c223a60"
          ["research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_manifest_v1.json"]="db2fd37255fde7d5c6ccbabe39240930fd94300f"
          ["research/package-adjustment-v6/development_candidate_v1.json"]="446a176757919be3deef0659ac01e05884be4007"
          ["research/package-adjustment-v6/prospective_evaluation_v1.json"]="7fd2a07f3bd9b9214e1293d50b867c7f023ab2d1"
          ["research/package-adjustment-v6/production_candidate_v1.json"]="9abaf2c01890da3abb0d13ae4d57cb37b91a08e2"
          ["research/package-adjustment-production-candidate-v1/live_deployment.json"]="fb192d6d52ca302f9694adc3ae39c7f1047f6140"
          ["scripts/validation/check_package_adjustment_live.py"]="3c924d762f93fd93b9943afe090deda6a2b7d8a0"
          ["scripts/validation/snapshot_values.py"]="1efca4c35e910a95974c1bec0b06a106196618b3"
        )
        for p in "${!EXPECTED[@]}"; do
          a="$(git hash-object "$p")"
          test "$a" = "${EXPECTED[$p]}" || { echo "ERROR predecessor drift: $p expected=${EXPECTED[$p]} actual=$a"; exit 1; }
        done
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/snapshot_values.py --selftest
        echo 'PASS: frozen V7 Phase 1/V6 lineage and player-value source are valid.'
    - name: Write frozen Phase 1A generator
      shell: bash
      run: "set -euo pipefail\ncat > research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py <<'PY'\n#!/usr/bin/env\
        \ python3\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport importlib.util\nimport json\n\
        import math\nimport re\nfrom collections import Counter, defaultdict\nfrom datetime import datetime, timezone\nfrom\
        \ pathlib import Path\nfrom statistics import NormalDist\n\nROOT = Path(__file__).resolve().parents[2]\nD = ROOT /\
        \ \"research\" / \"package-adjustment-v7\"\n\nPHASE1 = D / \"phase1_multi_vs_multi_preregistration_v1.json\"\nPHASE1_MAN\
        \ = D / \"phase1_multi_vs_multi_preregistration_manifest_v1.json\"\nV6_DEV = ROOT / \"research/package-adjustment-v6/development_candidate_v1.json\"\
        \nV6_PROS = ROOT / \"research/package-adjustment-v6/prospective_evaluation_v1.json\"\nVALUES = ROOT / \"scripts/artifacts/generated/value_uncertainty.json\"\
        \nROSTERS = ROOT / \"data/league_rosters.json\"\nINDEX = ROOT / \"index.html\"\nSNAPSHOT_VALUES = ROOT / \"scripts/validation/snapshot_values.py\"\
        \n\nOUT_SNAPSHOT = D / \"phase1a_player_fv_snapshot_v1.json\"\nOUT_POWER = D / \"phase1a_power_analysis_v1.json\"\n\
        OUT_CATALOG = D / \"package_vote_challenges_v7_development_v1.json\"\nOUT_SUMMARY = D / \"phase1a_power_and_catalog_v1.md\"\
        \nOUT_MANIFEST = D / \"phase1a_power_and_catalog_manifest_v1.json\"\n\nSCHEMA = 1\nSTUDY_ID = \"package-adjustment-v7-multi-v-multi\"\
        \nSTATUS = \"FROZEN_PRE_VOTE_POWER_AND_CATALOG\"\nDECISION = \"FREEZE_V7_PHASE1A_AT_40_VOTER_FIRST_CHECKPOINT\"\n\n\
        POSITIONS = (\"QB\",\"RB\",\"WR\",\"TE\",\"DL\",\"LB\",\"DB\")\nPOS_MAP = {\n    \"QB\":\"QB\",\"RB\":\"RB\",\"WR\"\
        :\"WR\",\"TE\":\"TE\",\n    \"DL\":\"DL\",\"DE\":\"DL\",\"DT\":\"DL\",\n    \"LB\":\"LB\",\"OLB\":\"LB\",\"ILB\":\"\
        LB\",\n    \"DB\":\"DB\",\"CB\":\"DB\",\"S\":\"DB\",\"SS\":\"DB\",\"FS\":\"DB\",\n}\nPROFILES = {\n    2: ((0.50,0.50),(0.60,0.40),(0.70,0.30),(0.80,0.20)),\n\
        \    3: ((0.34,0.33,0.33),(0.45,0.33,0.22),(0.55,0.30,0.15),(0.65,0.20,0.15)),\n    4: ((0.25,0.25,0.25,0.25),(0.35,0.28,0.22,0.15),(0.45,0.25,0.18,0.12),(0.55,0.18,0.15,0.12)),\n\
        }\nDESIGN = {\n    \"2v2\": (\"A_low\",\"B_low\",\"A_moderate\",\"B_moderate\",\"A_high\",\"B_high\"),\n    \"2v3\"\
        : (\"A_high\",\"A_high\",\"B_high\",\"A_moderate\",\"B_moderate\",\"A_low\",\"B_low\",\"B_low\"),\n    \"2v4\": (\"\
        A_high\",\"A_high\",\"A_moderate\",\"B_moderate\",\"A_low\",\"B_low\"),\n    \"3v3\": (\"A_low\",\"B_low\",\"A_moderate\"\
        ,\"B_moderate\",\"A_high\",\"B_high\"),\n    \"3v4\": (\"A_high\",\"B_high\",\"B_high\",\"A_moderate\",\"B_moderate\"\
        ,\"A_low\",\"B_low\",\"B_low\"),\n    \"4v4\": (\"A_low\",\"B_low\",\"A_moderate\",\"B_moderate\",\"A_high\",\"B_high\"\
        ),\n}\nBAND_TARGET = {\"low\":0.035,\"moderate\":0.085,\"high\":0.16}\nBAND_RANGE = {\"low\":(0.012,0.060),\"moderate\"\
        :(0.050,0.120),\"high\":(0.100,0.300)}\n\nMOTIVATING_PLAYERS = frozenset({\n    \"jacob rodriguez\",\"abdul carter\"\
        ,\"sam darnold\",\n    \"kyler murray\",\"jamien sherwood\",\"marvin harrison\",\n})\n\ndef sha256(path: Path) ->\
        \ str:\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\ndef canonical_sha(obj) -> str:\n    return hashlib.sha256(\n\
        \        json.dumps(obj, sort_keys=True, separators=(\",\",\":\"), ensure_ascii=False).encode()\n    ).hexdigest()\n\
        \ndef read_json(path: Path):\n    return json.loads(path.read_text(encoding=\"utf-8\"))\n\ndef norm(value) -> str:\n\
        \    s = str(value or \"\").strip().lower()\n    s = re.sub(r\"[.'\u2019\\-]\", \"\", s)\n    return re.sub(r\"\\\
        s+\", \" \", s).strip()\n\ndef finite(v):\n    try:\n        x = float(v)\n    except (TypeError, ValueError):\n \
        \       return None\n    return x if math.isfinite(x) else None\n\ndef load_snapshot_module():\n    spec = importlib.util.spec_from_file_location(\"\
        snapshot_values_v7\", SNAPSHOT_VALUES)\n    mod = importlib.util.module_from_spec(spec)\n    assert spec.loader is\
        \ not None\n    spec.loader.exec_module(mod)\n    return mod\n\ndef player_universe():\n    snapmod = load_snapshot_module()\n\
        \    cfg = snapmod.load_from_html(INDEX)\n    live = snapmod.compute_all_values(cfg)\n    vu = read_json(VALUES)\n\
        \    roster = read_json(ROSTERS)\n\n    vu_idx = {}\n    for raw_name, row in (vu.get(\"players\") or {}).items():\n\
        \        key = norm(raw_name)\n        val = finite(row.get(\"center_value\"))\n        pos = POS_MAP.get(str(row.get(\"\
        pos\") or \"\").upper())\n        if val is not None and val > 0 and pos in POSITIONS:\n            vu_idx[key] =\
        \ {\"fv\": int(round(val)), \"pos\": pos}\n\n    players = {}\n    mismatches = []\n    for team in roster.get(\"\
        rosters\") or []:\n        for slot in (\"starters\",\"bench\",\"taxi\",\"reserve_ir\"):\n            for raw in team.get(slot)\
        \ or []:\n                key = norm(raw.get(\"name\"))\n                if key not in live or key not in vu_idx:\n\
        \                    continue\n                live_val = int(live[key][\"value\"])\n                vu_val = int(vu_idx[key][\"\
        fv\"])\n                if live_val != vu_val:\n                    mismatches.append((key, live_val, vu_val))\n \
        \                   continue\n                pos = POS_MAP.get(str(live[key][\"pos\"]).upper())\n               \
        \ if pos not in POSITIONS:\n                    continue\n                players[key] = {\n                    \"\
        key\": key,\n                    \"name\": str(raw.get(\"name\") or key),\n                    \"pos\": pos,\n   \
        \                 \"fv\": live_val,\n                    \"team\": raw.get(\"team\"),\n                    \"age\"\
        : raw.get(\"age\"),\n                }\n    if mismatches:\n        raise RuntimeError(f\"value_uncertainty/live FV\
        \ mismatch examples={mismatches[:10]}\")\n    out = sorted(players.values(), key=lambda p: (-p[\"fv\"], p[\"key\"\
        ]))\n    if len(out) < 350:\n        raise RuntimeError(f\"too few frozen rostered players: {len(out)}\")\n    counts\
        \ = Counter(p[\"pos\"] for p in out)\n    if any(counts[p] < 20 for p in POSITIONS):\n        raise RuntimeError(f\"\
        insufficient position coverage: {dict(counts)}\")\n    return out, dict(sorted(counts.items()))\n\ndef nearest_players(players_asc,\
        \ desired, used, limit=10):\n    # deterministic O(n) ranking over only 472-ish players; simple and auditable\n  \
        \  pool = [p for p in players_asc if p[\"key\"] not in used]\n    pool.sort(key=lambda p: (abs(float(p[\"fv\"]) -\
        \ desired), p[\"key\"]))\n    return pool[:limit]\n\ndef side_key(players):\n    return \"|\".join(sorted(p[\"key\"\
        ] for p in players))\n\ndef build_side_pool(players, size):\n    players_asc = sorted(players, key=lambda p: (p[\"\
        fv\"], p[\"key\"]))\n    out = {}\n    for anchor in players_asc:\n        for profile in PROFILES[size]:\n      \
        \      total_goal = float(anchor[\"fv\"]) / float(profile[0])\n            for variant in range(4):\n            \
        \    chosen = [anchor]\n                used = {anchor[\"key\"]}\n                ok = True\n                for i\
        \ in range(1, size):\n                    pool = nearest_players(\n                        players_asc, total_goal\
        \ * float(profile[i]), used, limit=10\n                    )\n                    if not pool:\n                 \
        \       ok = False\n                        break\n                    pick = pool[(variant + i * 2) % len(pool)]\n\
        \                    chosen.append(pick)\n                    used.add(pick[\"key\"])\n                if not ok or\
        \ len(chosen) != size:\n                    continue\n                total = sum(float(p[\"fv\"]) for p in chosen)\n\
        \                shares = sorted((float(p[\"fv\"]) / total for p in chosen), reverse=True)\n                if min(shares)\
        \ < 0.10 - 1e-12:\n                    continue\n                key = side_key(chosen)\n                if key in\
        \ out:\n                    continue\n                out[key] = {\n                    \"players\": chosen,\n   \
        \                 \"sum\": total,\n                    \"top_share\": shares[0],\n                    \"hhi\": sum(s*s\
        \ for s in shares),\n                    \"key\": key,\n                }\n    rows = list(out.values())\n    rows.sort(key=lambda\
        \ s: (s[\"sum\"], s[\"key\"]))\n    if len(rows) < 500:\n        raise RuntimeError(f\"side pool too small for size\
        \ {size}: {len(rows)}\")\n    return rows\n\ndef lower_bound_sum(rows, target):\n    lo, hi = 0, len(rows)\n    while\
        \ lo < hi:\n        mid = (lo + hi) // 2\n        if rows[mid][\"sum\"] < target:\n            lo = mid + 1\n    \
        \    else:\n            hi = mid\n    return lo\n\ndef overlaps(a, b):\n    aa = {p[\"key\"] for p in a[\"players\"\
        ]}\n    return any(p[\"key\"] in aa for p in b[\"players\"])\n\ndef in_band(diff, band):\n    lo, hi = BAND_RANGE[band]\n\
        \    x = abs(float(diff))\n    return x >= lo - 1e-12 and x <= hi + 1e-12\n\ndef slot_plan():\n    slots = []\n  \
        \  idx = 0\n    for topology, cells in DESIGN.items():\n        a_size, b_size = [int(x) for x in topology.split(\"\
        v\")]\n        for cell in cells:\n            direction, band = cell.split(\"_\", 1)\n            slots.append({\n\
        \                \"design_index\": idx,\n                \"topology\": topology,\n                \"a_size\": a_size,\n\
        \                \"b_size\": b_size,\n                \"direction\": direction,\n                \"band\": band,\n\
        \            })\n            idx += 1\n    assert len(slots) == 40\n    # Rare 2v4 B-moderate first; preserve original\
        \ design_index for output ordering.\n    return sorted(\n        slots,\n        key=lambda s: (\n            0 if\
        \ (s[\"topology\"]==\"2v4\" and s[\"direction\"]==\"B\" and s[\"band\"]==\"moderate\") else\n            1 if (s[\"\
        topology\"]==\"2v4\" and s[\"direction\"]==\"B\") else\n            2,\n            s[\"design_index\"],\n       \
        \ )\n    )\n\ndef choose_catalog(players):\n    side_pools = {n: build_side_pool(players, n) for n in (2,3,4)}\n \
        \   appearance = Counter()\n    pos_coverage = Counter()\n    used_pairs = set()\n    selected = []\n\n    for slot\
        \ in slot_plan():\n        A_pool = side_pools[slot[\"a_size\"]]\n        B_pool = side_pools[slot[\"b_size\"]]\n\
        \        best = None\n\n        for A in A_pool:\n            if any(appearance[p[\"key\"]] >= 4 for p in A[\"players\"\
        ]):\n                continue\n            center = lower_bound_sum(B_pool, A[\"sum\"])\n            lo = max(0, center\
        \ - 150)\n            hi = min(len(B_pool), center + 151)\n\n            for B in B_pool[lo:hi]:\n               \
        \ if any(appearance[p[\"key\"]] >= 4 for p in B[\"players\"]):\n                    continue\n                if overlaps(A,\
        \ B):\n                    continue\n                pair_key = A[\"key\"] + \"||\" + B[\"key\"]\n               \
        \ if pair_key in used_pairs:\n                    continue\n\n                raw_ratio = min(A[\"sum\"], B[\"sum\"\
        ]) / max(A[\"sum\"], B[\"sum\"])\n                if raw_ratio < 0.92 - 1e-12:\n                    continue\n\n \
        \               diff = A[\"top_share\"] - B[\"top_share\"]\n                if slot[\"direction\"] == \"A\" and diff\
        \ <= 0:\n                    continue\n                if slot[\"direction\"] == \"B\" and diff >= 0:\n          \
        \          continue\n                if not in_band(diff, slot[\"band\"]):\n                    continue\n\n     \
        \           all_players = A[\"players\"] + B[\"players\"]\n                poses = {p[\"pos\"] for p in all_players}\n\
        \                deficit_cover = sum(1 for p in poses if pos_coverage[p] < 6)\n                max_app = max(appearance[p[\"\
        key\"]] for p in all_players)\n                reuse = sum(appearance[p[\"key\"]] for p in all_players)\n\n      \
        \          score = (\n                    -deficit_cover,\n                    max_app,\n                    reuse,\n\
        \                    abs(abs(diff) - BAND_TARGET[slot[\"band\"]]),\n                    abs(raw_ratio - 0.97),\n \
        \                   pair_key,\n                )\n                if best is None or score < best[0]:\n          \
        \          best = (score, A, B, raw_ratio, diff, pair_key)\n\n        if best is None:\n            raise RuntimeError(f\"\
        could not construct frozen design slot: {slot}\")\n\n        _, A, B, raw_ratio, diff, pair_key = best\n        used_pairs.add(pair_key)\n\
        \        for p in A[\"players\"] + B[\"players\"]:\n            appearance[p[\"key\"]] += 1\n        for p in {x[\"\
        pos\"] for x in A[\"players\"] + B[\"players\"]}:\n            pos_coverage[p] += 1\n\n        selected.append({\n\
        \            **slot,\n            \"A\": A,\n            \"B\": B,\n            \"raw_ratio\": raw_ratio,\n      \
        \      \"top_share_diff_A_minus_B\": diff,\n        })\n\n    selected.sort(key=lambda x: x[\"design_index\"])\n \
        \   return selected, side_pools, appearance, pos_coverage\n\ndef asset_record(p):\n    return {\n        \"key\":\
        \ p[\"key\"], \"name\": p[\"name\"], \"pos\": p[\"pos\"],\n        \"team\": p.get(\"team\"), \"age\": p.get(\"age\"\
        ), \"fv\": int(p[\"fv\"]),\n    }\n\ndef challenge_record(i, row):\n    A, B = row[\"A\"], row[\"B\"]\n    all_names\
        \ = {p[\"key\"] for p in A[\"players\"] + B[\"players\"]}\n    if all_names == MOTIVATING_PLAYERS:\n        raise\
        \ RuntimeError(\"motivating trade player-only shadow leaked into development catalog\")\n    cid = f\"pkgv7dev_{i:03d}\"\
        \n    def side(s):\n        total = float(s[\"sum\"])\n        return {\n            \"assets\": [asset_record(p)\
        \ for p in s[\"players\"]],\n            \"asset_count\": len(s[\"players\"]),\n            \"raw_fv\": int(round(total)),\n\
        \            \"top_asset_share\": round(float(s[\"top_share\"]), 9),\n            \"hhi\": round(float(s[\"hhi\"]),\
        \ 9),\n            \"minimum_asset_share\": round(min(float(p[\"fv\"])/total for p in s[\"players\"]), 9),\n     \
        \   }\n    return {\n        \"id\": cid,\n        \"schema_version\": 1,\n        \"experiment\": \"package_adjustment_v7_multi_vs_multi_development\"\
        ,\n        \"topology\": row[\"topology\"],\n        \"primary_contrast_band\": row[\"band\"],\n        \"primary_concentration_direction_by_top_share\"\
        : row[\"direction\"],\n        \"raw_sum_ratio_min_over_max\": round(float(row[\"raw_ratio\"]), 9),\n        \"top_asset_share_difference_A_minus_B\"\
        : round(float(row[\"top_share_diff_A_minus_B\"]), 9),\n        \"side_A\": side(A),\n        \"side_B\": side(B),\n\
        \        \"fv_visible_to_voter\": False,\n        \"candidate_prediction_used_for_selection\": False,\n    }\n\ndef\
        \ validate_catalog(challenges, prereg):\n    if len(challenges) != 40:\n        raise RuntimeError(f\"expected 40\
        \ challenges, got {len(challenges)}\")\n    ids = [c[\"id\"] for c in challenges]\n    if len(ids) != len(set(ids)):\n\
        \        raise RuntimeError(\"duplicate challenge ids\")\n\n    expected_topology = prereg[\"development_catalog_preregistration\"\
        ][\"topology_counts\"]\n    got_topology = Counter(c[\"topology\"] for c in challenges)\n    if dict(got_topology)\
        \ != dict(expected_topology):\n        raise RuntimeError(f\"topology count mismatch {got_topology} vs {expected_topology}\"\
        )\n\n    dirs = Counter(c[\"primary_concentration_direction_by_top_share\"] for c in challenges)\n    if dirs != Counter({\"\
        A\":20,\"B\":20}):\n        raise RuntimeError(f\"direction balance mismatch: {dirs}\")\n\n    bands = Counter(c[\"\
        primary_contrast_band\"] for c in challenges)\n    if set(bands) != {\"low\",\"moderate\",\"high\"}:\n        raise\
        \ RuntimeError(f\"missing contrast band: {bands}\")\n\n    appearance = Counter()\n    position_challenges = Counter()\n\
        \    signatures = set()\n\n    for c in challenges:\n        if c[\"fv_visible_to_voter\"] is not False:\n       \
        \     raise RuntimeError(f\"{c['id']}: FV visibility leak\")\n        if c[\"candidate_prediction_used_for_selection\"\
        ] is not False:\n            raise RuntimeError(f\"{c['id']}: candidate-selection leak\")\n\n        sides = [c[\"\
        side_A\"], c[\"side_B\"]]\n        side_keys = []\n        for side in sides:\n            if side[\"asset_count\"\
        ] not in (2,3,4):\n                raise RuntimeError(f\"{c['id']}: bad side size\")\n            keys = [a[\"key\"\
        ] for a in side[\"assets\"]]\n            if len(keys) != len(set(keys)):\n                raise RuntimeError(f\"\
        {c['id']}: duplicate within side\")\n            if min(float(a[\"fv\"]) / float(side[\"raw_fv\"]) for a in side[\"\
        assets\"]) < 0.10 - 0.002:\n                raise RuntimeError(f\"{c['id']}: primary tiny-piece rule failed\")\n \
        \           side_keys.append(set(keys))\n            for a in side[\"assets\"]:\n                appearance[a[\"key\"\
        ]] += 1\n                if a[\"pos\"] not in POSITIONS:\n                    raise RuntimeError(f\"{c['id']}: unsupported\
        \ position {a['pos']}\")\n        if side_keys[0] & side_keys[1]:\n            raise RuntimeError(f\"{c['id']}: same\
        \ player on both sides\")\n\n        ratio = min(c[\"side_A\"][\"raw_fv\"], c[\"side_B\"][\"raw_fv\"]) / max(\n  \
        \          c[\"side_A\"][\"raw_fv\"], c[\"side_B\"][\"raw_fv\"]\n        )\n        if ratio < 0.92 - 0.002:\n   \
        \         raise RuntimeError(f\"{c['id']}: raw sum ratio below design floor\")\n\n        for pos in set(a[\"pos\"\
        ] for s in sides for a in s[\"assets\"]):\n            position_challenges[pos] += 1\n\n        sig = (\n        \
        \    tuple(sorted(a[\"key\"] for a in c[\"side_A\"][\"assets\"])),\n            tuple(sorted(a[\"key\"] for a in c[\"\
        side_B\"][\"assets\"])),\n        )\n        if sig in signatures:\n            raise RuntimeError(f\"{c['id']}: duplicate\
        \ trade signature\")\n        signatures.add(sig)\n\n    if max(appearance.values()) > 4:\n        raise RuntimeError(f\"\
        player appearance cap exceeded: {max(appearance.values())}\")\n    if any(position_challenges[p] < 6 for p in POSITIONS):\n\
        \        raise RuntimeError(f\"position challenge coverage failed: {dict(position_challenges)}\")\n    return {\n\
        \        \"topology_counts\": dict(sorted(got_topology.items())),\n        \"direction_counts\": dict(sorted(dirs.items())),\n\
        \        \"contrast_band_counts\": dict(sorted(bands.items())),\n        \"max_player_appearances\": max(appearance.values()),\n\
        \        \"unique_players\": len(appearance),\n        \"position_challenge_counts\": dict(sorted(position_challenges.items())),\n\
        \    }\n\ndef normal_power(true_d, se, practical=0.005, z=1.6448536269514722):\n    # pass requires point D <= -practical\
        \ AND one-sided 95% UCB < 0\n    threshold = min(-practical, -z * se)\n    return NormalDist().cdf((threshold - true_d)\
        \ / se), threshold\n\ndef build_power():\n    prereg = read_json(PHASE1)\n    dev = read_json(V6_DEV)\n    pros =\
        \ read_json(V6_PROS)\n    checkpoints = prereg[\"mock_vote_transport\"][\"candidate_checkpoint_voter_counts\"]\n \
        \   target = float(prereg[\"mock_vote_transport\"][\"power_target\"])\n    practical = float(\n        prereg[\"mock_vote_transport\"\
        ][\"minimum_worthwhile_equal_topology_macro_log_loss_improvement\"]\n    )\n\n    sources = [\n        {\n       \
        \     \"name\":\"v6_development_crossed_bootstrap\",\n            \"voters\": int(dev[\"development_evidence\"][\"\
