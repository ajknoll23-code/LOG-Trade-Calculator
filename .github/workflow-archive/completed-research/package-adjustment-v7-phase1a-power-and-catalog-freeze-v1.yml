    - name: Freeze power analysis, FV snapshot, and exact 40-trade catalog
      shell: bash
      run: |
        set -euo pipefail
        python3 research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py --write
        python3 research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py --check
    - name: Prove exact research-only mutation scope
      shell: bash
      run: |-
        set -euo pipefail
        mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
        expected=(
          research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py
          research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json
          research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json
          research/package-adjustment-v7/phase1a_power_analysis_v1.json
          research/package-adjustment-v7/phase1a_power_and_catalog_manifest_v1.json
          research/package-adjustment-v7/phase1a_power_and_catalog_v1.md
        )
        diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
        echo 'PASS: exact Phase 1A research-only mutation scope.'
    - name: Run production and repository regressions
      shell: bash
      run: |-
        set -euo pipefail
        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
        restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
        trap restore_tu EXIT
        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/repo_regression_checks.py
        restore_tu
        trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"
        echo 'PASS: production unchanged and repository regressions green.'
    - name: Commit Phase 1A freeze
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |-
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add \
          research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py \
          research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json \
          research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json \
          research/package-adjustment-v7/phase1a_power_analysis_v1.json \
          research/package-adjustment-v7/phase1a_power_and_catalog_manifest_v1.json \
          research/package-adjustment-v7/phase1a_power_and_catalog_v1.md

        git diff --cached --quiet && { echo 'ERROR: no Phase 1A artifacts staged'; exit 1; }
        git commit -m "Freeze Package Adjustment V7 Phase 1A power and catalog"

        git fetch origin main

        critical=(
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_manifest_v1.json
          research/package-adjustment-v6/development_candidate_v1.json
          research/package-adjustment-v6/prospective_evaluation_v1.json
          research/package-adjustment-v6/production_candidate_v1.json
          research/package-adjustment-production-candidate-v1/live_deployment.json
          scripts/validation/check_package_adjustment_live.py
          scripts/validation/snapshot_values.py
          index.html
          scripts/artifacts/generated/value_uncertainty.json
          data/league_rosters.json
        )
        for p in "${critical[@]}"; do
          test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
            echo "ERROR: Phase 1A source changed during run: $p"
            exit 1
          }
        done

        for p in \
          research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py \
          research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json \
          research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json \
          research/package-adjustment-v7/phase1a_power_analysis_v1.json \
          research/package-adjustment-v7/phase1a_power_and_catalog_manifest_v1.json \
          research/package-adjustment-v7/phase1a_power_and_catalog_v1.md
        do
          if git cat-file -e "origin/main:$p" 2>/dev/null; then
            echo "ERROR: Phase 1A output appeared on main during this run: $p"
            exit 1
          fi
        done

        git rebase origin/main
        python3 research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py --check
        python3 scripts/validation/check_package_adjustment_live.py
        git push origin HEAD:main
        echo 'PASS: V7 Phase 1A frozen. Voting remains inactive.'
