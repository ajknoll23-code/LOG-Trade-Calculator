name: QF11 V21 - Owner Approved Research Scope and Pilot Preregistration (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V21_INPUT: /tmp/qf11-v21-input
  QF11_V21_OUTPUT: /tmp/qf11-v21-output
jobs:
  prereg:
    name: Freeze approved 22 research candidates and draft 12-person comprehension design only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: |-
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin frozen production and crosswalk; record mutable cache without gating
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        # The refreshable Sleeper cache is observed, NEVER used for owner identity clearance.
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }
        printf 'QF11_V21_MUTABLE_CACHE_OBSERVED %s\n' "$(git hash-object data/players_cache.json)"
        echo QF11_V21_PROTECTED_SOURCE_PINS_GREEN
    - name: Download exact V20 Green owner review and pilot protocol source
      uses: actions/download-artifact@v4
      with:
        name: QF11-v20-RESEARCH-ONLY-22-scope-and-pilot-protocol
        run-id: 38322028028
        github-token: ${{ github.token }}
        path: /tmp/qf11-v21-input
    - name: Verify V20 evidence digests and preregister owner-approved research-only decisions
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'QF11_V21_PY'
        #!/usr/bin/env python3
        """Freeze user-approved V20 research scope / draft pilot as a V21 preregistration only.

        This script CANNOT recruit users, distribute surveys, clear identities, or update valuation.
        It handles immutable archived research JSON, not live incoming votes.
        """
        from __future__ import annotations
        import collections
        import hashlib
        import itertools
        import json
        import os
        from pathlib import Path

        HERE=Path(os.environ.get('QF11_V21_INPUT','/tmp/qf11-v21-input'))
        OUT=Path(os.environ.get('QF11_V21_OUTPUT','/tmp/qf11-v21-output'))
        OUT.mkdir(parents=True,exist_ok=True)
        SOURCE={
         'scope': ('RESEARCH_ONLY_v20_22_slot_owner_scope.json','5ca88db7fbc347503444f58166608dfbd0cd98b03fc997f54f00307184dc0507'),
         'pilot': ('RESEARCH_ONLY_v20_pilot_prereg_DRAFT.json','90115f23abbb54e800b74ed9267a94a830a88970f1aa41c74b4d50073636a23a'),
         'review': ('RESEARCH_ONLY_v20_owner_decisions.md','294637f5f110183356360bffbf6a92ce5c82ace8e455fea905995619ad15b5dd'),
        }
        archives={}
        for key,(name,sha) in SOURCE.items():
         p=HERE/name
         assert p.is_file(),f'STOP_V20_ARCHIVE_MISSING_{key}'
         assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,f'STOP_V20_ARCHIVE_DRIFT_{key}'
         if key!='review':archives[key]=json.loads(p.read_text())
        a,b=archives['scope'],archives['pilot']
        TRIO=['brock bowers','tyler warren','treveyon henderson']
        HOLDS={'byron young','james cook','jaylon carlies','jaylon jones','malik willis','micah parsons','will anderson'}
        EXCLUDED={1,5,8,12,15,21}
        ALLOWED={'SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED','OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY','OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN'}
        assert a['status']=='22_SLOT_REVIEW_CANDIDATE_SCOPE_NOT_RELEASE_APPROVAL'
        assert a['candidate_review_slots']==22 and a['source_screened_prior_candidates']==21
        assert a['original_catalog_slots']==28 and a['excluded_original_slots']==sorted(EXCLUDED)
        assert a['excluded_identity_held_existing_slots']==[1,8,12,15]
        assert a['excluded_already_unresolved_slots']==[5,21]
        assert set(a['seven_identity_holds'])==HOLDS
        assert a['owner_catalog_approval'] is False and a['owner_pilot_approval'] is False
        assert a['eligible_for_voter_distribution'] is False and a['voting_activated'] is False
        assert a['production_authorized'] is False and a['market_value_or_model_changed'] is False
        assert a['new_ballots_issued'] is False and a['ballot_realism_approved'] is False
        rows=a['candidate_review_slate']
        assert len(rows)==22 and len({r['slot'] for r in rows})==22
        assert {r['slot'] for r in rows}==set(range(1,29))-EXCLUDED
        assert all(len(r['players'])==3 and len(set(r['players']))==3 for r in rows)
        assert all(len(r['same_position_pair'])==2 and set(r['same_position_pair'])<=set(r['players']) for r in rows)
        assert all(r['source_status'] in ALLOWED for r in rows)
        assert all(not HOLDS.intersection(r['players']) for r in rows)
        assert len([r for r in rows if r['slot']==11 and r['players']==TRIO and r['source_status']=='OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN'])==1
        assert all(r['source_status']!='OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN' for r in rows if r['slot']!=11)
        assert sum(r['source_status']!='OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN' for r in rows)==21
        pairs=[tuple(sorted(r['same_position_pair'])) for r in rows]
        counts=collections.Counter(p for r in rows for p in r['players'])
        assert len(set(pairs))==22 and max(counts.values())==2
        assert a['unique_same_position_pairs']==22 and a['max_player_appearances']==2
        assert max(r['fv_ratio'] for r in rows)<=1.30 and max(r['fv_ratio'] for r in rows)==a['max_fv_ratio_descriptive']
        assert b['status']=='OWNER_REVIEW_DRAFT_NOT_PREREGISTERED_NOT_APPROVED'
        assert b['draft_target_n_independent_people']==12 and b['draft_allocation'].startswith('6 presentation orders x 2')
        assert b['scope']=='Human comprehension/usability pilot only; no valuation training or new market votes'
        assert b['pilot_sample_approved'] is False and b['randomization_approved'] is False and b['thresholds_approved'] is False
        assert b['market_repricing_allowed'] is False and b['actual_respondent_study_started'] is False
        assert b['voter_links_created'] is False and b['voting_activated'] is False
        assert len(b['draft_questions'])==3
        assert len(b['exact_six_order_candidates'])==6
        assert {tuple(p) for p in b['exact_six_order_candidates']}==set(itertools.permutations(['Brock Bowers','Tyler Warren','TreVeyon Henderson']))
        assert '>=10/12' in b['draft_provisional_pass_rule'] and 'zero unresolved' in b['draft_provisional_pass_rule']

        # Explicit owner approval communicated in current chat on 2026-10-12; this file
        # records a governance assertion, not a cryptographically authenticated signature.
        provenance={'recorded_from':'explicit owner affirmative response to V20 Decisions A and B in ChatGPT conversation on 2026-10-12',
                    'signature_independently_verified':False,
                    'catalog_scope_preregistration_only':True,
                    'pilot_protocol_preregistration_only':True,
                    'voter_or_real_pilot_activation_approved':False,
                    'valuation_promotion_approved':False}
        scope={
         'status':'OWNER_APPROVED_22_SLOT_RESEARCH_PREREG_ONLY_NOT_VOTER_AUTHORIZED',
         'source_workflow':'QF11 V20 (GitHub Green, run 38322028028)',
         'source_archive_sha256':{k:v[1] for k,v in SOURCE.items()},
         'owner_approval_provenance':provenance,
         'approved_scope':'REVIEW_AND_DESIGN_ONLY',
         'proposed_catalog_for_review':rows, # SOURCE statuses carried without modification
         'candidate_review_count':22,'source_screened_prior_count':21,'tentative_slot11_count':1,
         'excluded_held_slots':sorted(EXCLUDED),'identity_hold_names':sorted(HOLDS),
         'identity_holds_cleared':0,'optional_substitutions_owner_certified':False,
         'catalog_final_for_issuance':False,'voter_link_creation_permitted':False,
         'respondent_recruitment_permitted':False,'ballot_issuance_permitted':False,
         'ktc_vote_ingestion_permitted':False,'market_value_training_permitted':False,
         'market_value_backfill_permitted':False,'production_change_permitted':False,
         'audit_findings_closed':13,'audit_findings_total':20,
        }
        protocol={
         'status':'OWNER_APPROVED_DESIGN_PREREG_NOT_PILOT_ACTIVATION',
         'approved_protocol_development_only':True,
         'pilot_activation_approved':False,
         'sample_n_for_preregistered_design':12,
         'independent_participants_per_order_design':2,
         'six_order_design':b['exact_six_order_candidates'],
         'assigned_recruits':[],
         'consented_participants':[],
         'randomization_algorithm_deployment_approved':False,
         'screening_criteria_from_v20_draft':b['draft_screen'],
         'study_context_from_v20_draft':b['draft_study_context'],
         'comprehension_questions_from_v20_draft':b['draft_questions'],
         'critical_failure_from_v20_draft':b['draft_critical_failure'],
         'design_feedback_threshold_from_v20_draft':b['draft_provisional_pass_rule'],
         'pilot_stop_rule_from_v20_draft':b['draft_stop'],
         'one_exposure_per_person_from_v20_draft':b['draft_exposure_cap'],
         'data_retention_from_v20_draft':b['draft_retention'],
         'historical_vote_warning':b['historical_votes'],
         'limitations':b['limitations'],
         'still_requires_before_any_invitation':[
          'independent ballot wording and cross-position TE/TE/RB clarity review',
          'documented recruitment/consent, deduplication and privacy retention plan',
          'independent randomized assignment implementation and audit',
          'explicit independent approval of sampling, threshold applicability and stop/pause triggers',
          'owner authorization of actual participant recruitment and voter link issuance in a separate future gate',
         ],
         'sample_or_result_count':0,'preexisting_votes_ingested':0,'new_votes_ingested':0,
         'no_live_comprehension_observations':True,
         'calibration_evidence_sufficient':False,
         'voter_links_created':False,'ballots_issued':False,
         'market_values_changed':False,'fv_or_package_adjustment_changed':False,
        }
        review=['# QF11 V21 — Owner-approved design preregistration, no pilot activation','',
         '**Scope:** explicit owner approval of V20 Decisions A and B on October 12, 2026 for research-only review and protocol preregistration. This is not a signature audit.','',
         '## Approved research scope',
         '- **22 original-slot-numbered research candidates**, 21 previously source-screened + 1 owner-tentative slot 11; retain original source-status labels.',
         '- Exclude original slots **1, 5, 8, 12, 15, 21**; **seven named identity holds remain unadjudicated**.',
         '- Tentative pilot trio: **Brock Bowers / Tyler Warren / TreVeyon Henderson**. Not owner approved for real respondent display or issuance.','',
         '## Preregistered proposal only',
         '- **12 unique dynasty-SF/IDP-literate participants**, **6 orders × 2 per order**. Proposed randomization and recruitment not deployed.',
         '- Design-feedback criterion: **>=10/12** identify RB, **>=10/12** understand equal horizon and KTC context, and **zero unresolved critical wording issues**; not a statistical Market Value validation.',
         '- No external respondents or votes; human screening, consent, privacy and randomization safeguards need independent approval before participant contact.','',
         '## Boundaries and next gate',
         '- Catalog contents are **not certified for distribution**; V20 optional shadow substitutions remain optional.',
         '- No actual comprehension study, voter links, ballots, valuation ingestion, KTC Market Value refresh, Fundamental Value changes, or Package Adjustment changes.',
         '- Next step: **independent protocol and catalog quality review**, then separate owner authorization of an actual human comprehension pilot; pilot vote responses are never Market Value training data.',
         '- Original audit remains **13/20 closed (65%)**; V21 does not close audit findings.',
         '']
        (OUT/'RESEARCH_ONLY_v21_scope_prereg.json').write_text(json.dumps(scope,sort_keys=True,indent=2)+'\n')
        (OUT/'RESEARCH_ONLY_v21_protocol_prereg.json').write_text(json.dumps(protocol,sort_keys=True,indent=2)+'\n')
        (OUT/'RESEARCH_ONLY_v21_owner_gate.md').write_text('\n'.join(review))
        assert {p.name for p in OUT.iterdir()}=={'RESEARCH_ONLY_v21_scope_prereg.json','RESEARCH_ONLY_v21_protocol_prereg.json','RESEARCH_ONLY_v21_owner_gate.md'}
        assert all(p.stat().st_size>500 for p in OUT.iterdir())
        print('QF11_V21_OWNER_PREREG_GREEN '+json.dumps({'research_candidates':22,'holds':7,'excluded_slots':6,'orders':6,'planned_n':12,'participants_contacted':0,'votes_issued':0,'production_changes':0,'recruitment_approved':False},sort_keys=True))
        QF11_V21_PY
    - name: Run all 14 frozen regressions and FA PA release selftests
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V21_FROZEN_14_REGRESSIONS_GREEN
    - name: Verify owner scope no pilot activation and no participant data
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_POST'
        import json
        from pathlib import Path
        p=Path('/tmp/qf11-v21-output')
        assert {x.name for x in p.iterdir()}=={'RESEARCH_ONLY_v21_scope_prereg.json','RESEARCH_ONLY_v21_protocol_prereg.json','RESEARCH_ONLY_v21_owner_gate.md'}
        a=json.loads((p/'RESEARCH_ONLY_v21_scope_prereg.json').read_text())
        b=json.loads((p/'RESEARCH_ONLY_v21_protocol_prereg.json').read_text())
        assert a['candidate_review_count']==22 and len(a['proposed_catalog_for_review'])==22
        assert a['identity_holds_cleared']==0 and len(a['identity_hold_names'])==7
        assert a['excluded_held_slots']==[1,5,8,12,15,21]
        assert not any(a[x] for x in ['catalog_final_for_issuance','voter_link_creation_permitted','respondent_recruitment_permitted','ballot_issuance_permitted','ktc_vote_ingestion_permitted','market_value_training_permitted','production_change_permitted'])
        assert b['approved_protocol_development_only'] and not b['pilot_activation_approved']
        assert b['sample_n_for_preregistered_design']==12 and len(b['six_order_design'])==6
        assert b['sample_or_result_count']==b['new_votes_ingested']==b['preexisting_votes_ingested']==0
        assert b['no_live_comprehension_observations'] and not b['calibration_evidence_sufficient']
        assert not b['voter_links_created'] and not b['ballots_issued'] and not b['market_values_changed']
        print('QF11_V21_NO_VOTING_NO_RECRUITMENT_NO_PRODUCTION_GREEN')
        PY_POST
    - name: Recheck protected sources and zero repository writes
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        # The refreshable Sleeper cache is observed, NEVER used for owner identity clearance.
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }
        printf 'QF11_V21_MUTABLE_CACHE_OBSERVED %s\n' "$(git hash-object data/players_cache.json)"
        echo QF11_V21_PROTECTED_SOURCE_PINS_GREEN
        echo QF11_V21_ZERO_WRITE_GREEN
    - name: Archive research-only V21 owner-preregistered scope and protocol (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v21-RESEARCH-ONLY-owner-prereg-and-pilot-design
        path: /tmp/qf11-v21-output/RESEARCH_ONLY_v21_*
        retention-days: 7
        if-no-files-found: error
