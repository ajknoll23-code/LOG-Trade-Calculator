name: QF11 V22 - Independent Catalog and Pilot Safeguard Review (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V22_INPUT: /tmp/qf11-v22-input
  QF11_V22_OUTPUT: /tmp/qf11-v22-output
jobs:
  review:
    name: Independently inspect V21 catalog statuses and protocol contradictions without voting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Verify protected source blobs, observe mutable Sleeper cache
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }
        printf 'QF11_V22_MUTABLE_CACHE_OBSERVED %s\n' "$(git hash-object data/players_cache.json)"
        echo QF11_V22_PROTECTED_SOURCE_PINS_GREEN
    - name: Download immutable V21 preregistration artifact
      uses: actions/download-artifact@v4
      with:
        name: QF11-v21-RESEARCH-ONLY-owner-prereg-and-pilot-design
        run-id: 38324067358
        github-token: ${{ github.token }}
        path: /tmp/qf11-v22-input
    - name: Verify independent catalog, sample and stop-rule review
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'QF11_V22_PY'
        #!/usr/bin/env python3
        """QF11 V22 independent protocol and catalog review, no recruitment, survey or mutation."""
        import collections
        import hashlib
        import itertools
        import json
        import os
        from pathlib import Path
        IN=Path(os.getenv('QF11_V22_INPUT','/tmp/qf11-v22-input'))
        OUT=Path(os.getenv('QF11_V22_OUTPUT','/tmp/qf11-v22-output'))
        OUT.mkdir(parents=True,exist_ok=True)
        EXPECTED={
        'SCOPE_SHA': '305696d7839401b854c65042e9d32d2687021b14bc9de7cafae03ad9346734b3',
        'PROTOCOL_SHA':'5de62a4172d9c258fa3083ba43c7e23490e1c364fa6403b9ca0b7eb59d424109',
        'GATE_SHA':'69a25bac8d53680902f8af68d4196e51e4d782bc131fd26f8896d38dc55a0f7a',
        }
        files={'SCOPE_SHA':'RESEARCH_ONLY_v21_scope_prereg.json',
               'PROTOCOL_SHA':'RESEARCH_ONLY_v21_protocol_prereg.json',
               'GATE_SHA':'RESEARCH_ONLY_v21_owner_gate.md'}
        for key,path in files.items():
         p=IN/path
         assert p.is_file(),f'STOP_V21_ARCHIVE_MISSING_{key}'
         assert hashlib.sha256(p.read_bytes()).hexdigest()==EXPECTED[key],f'STOP_V21_ARCHIVE_DRIFT_{key}'
        scope=json.loads((IN/files['SCOPE_SHA']).read_text())
        pilot=json.loads((IN/files['PROTOCOL_SHA']).read_text())
        assert scope['status']=='OWNER_APPROVED_22_SLOT_RESEARCH_PREREG_ONLY_NOT_VOTER_AUTHORIZED'
        assert scope['approved_scope']=='REVIEW_AND_DESIGN_ONLY'
        assert pilot['status']=='OWNER_APPROVED_DESIGN_PREREG_NOT_PILOT_ACTIVATION'
        assert pilot['approved_protocol_development_only'] is True
        assert scope['owner_approval_provenance']['catalog_scope_preregistration_only'] is True
        assert scope['owner_approval_provenance']['voter_or_real_pilot_activation_approved'] is False
        assert scope['candidate_review_count']==22 and scope['source_screened_prior_count']==21
        assert scope['tentative_slot11_count']==1 and scope['excluded_held_slots']==[1,5,8,12,15,21]
        assert scope['identity_holds_cleared']==0 and len(scope['identity_hold_names'])==7
        for key in ('catalog_final_for_issuance','optional_substitutions_owner_certified','ballot_issuance_permitted',
                    'voter_link_creation_permitted','respondent_recruitment_permitted',
                    'ktc_vote_ingestion_permitted','market_value_training_permitted',
                    'market_value_backfill_permitted','production_change_permitted'):
         assert scope[key] is False, f'STOP_SCOPE_UNAUTHORIZED_{key}'
        rows=scope['proposed_catalog_for_review']
        assert len(rows)==22 and len({r['slot'] for r in rows})==22
        assert {r['slot'] for r in rows}==set(range(1,29))-{1,5,8,12,15,21}
        assert all(len(r['players'])==3 and len(set(r['players']))==3 for r in rows)
        assert all(len(r['same_position_pair'])==2 and set(r['same_position_pair'])<=set(r['players']) for r in rows)
        assert all(r['fv_ratio']>=1 and r['fv_ratio']<=1.30 for r in rows)
        assert not any(set(r['players']).intersection(scope['identity_hold_names']) for r in rows)
        counts=collections.Counter(r['source_status'] for r in rows)
        UNCH='SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED'
        SHADOW='OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY'
        TENT='OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN'
        assert counts=={UNCH:12,SHADOW:9,TENT:1},f'STOP_STATUS_DRIFT_{counts}'
        assert [r['slot'] for r in rows if r['source_status']==TENT]==[11]
        assert next(r for r in rows if r['slot']==11)['players']==['brock bowers','tyler warren','treveyon henderson']
        assert len({tuple(sorted(r['same_position_pair'])) for r in rows})==22
        appear=collections.Counter(p for r in rows for p in r['players'])
        assert max(appear.values())<=2
        assert pilot['sample_n_for_preregistered_design']==12
        assert pilot['independent_participants_per_order_design']==2
        assert len(pilot['six_order_design'])==6
        assert {tuple(r) for r in pilot['six_order_design']}==set(itertools.permutations(['Brock Bowers','Tyler Warren','TreVeyon Henderson']))
        assert pilot['assigned_recruits']==pilot['consented_participants']==[]
        assert pilot['sample_or_result_count']==pilot['new_votes_ingested']==pilot['preexisting_votes_ingested']==0
        assert pilot['no_live_comprehension_observations'] and not pilot['calibration_evidence_sufficient']
        for key in ('pilot_activation_approved','randomization_algorithm_deployment_approved',
                    'voter_links_created','ballots_issued','market_values_changed','fv_or_package_adjustment_changed'):
         assert pilot[key] is False,f'STOP_UNAPPROVED_ACTIVATION_{key}'
        assert '>=10/12' in pilot['design_feedback_threshold_from_v20_draft']
        assert 'misidentifies the RB' in pilot['critical_failure_from_v20_draft']
        assert 'serious comprehension issue' in pilot['pilot_stop_rule_from_v20_draft']
        # Distinguish research design adequacy from executable human-pilot authorization.
        risks=[
         {'id':'CATALOG_OPTIONAL_CERTIFICATION','severity':'BLOCKING_BEFORE_BALLOT_ISSUANCE',
          'evidence':'9 optional shadow triplets remain individually uncertified',
          'decision':'Review and explicitly certify or remove each shadow triplet; no auto-issuance'},
         {'id':'PILOT_TRIO_DISPLAY_CONSENT','severity':'BLOCKING_BEFORE_HUMAN_DISPLAY',
          'evidence':'Owner approval covers tentative research selection only',
          'decision':'Separately approve exact displayed text, roles, KTC horizon and response semantics'},
         {'id':'CRITICAL_STOP_VS_AGGREGATE_THRESHOLD','severity':'PROTOCOL_CLARIFICATION_REQUIRED',
          'evidence':'Draft treats RB misidentification as critical, but aggregate feedback threshold accepts 10/12',
          'decision':'Explicitly distinguish any-participant pause triggers from overall threshold; do not silently rewrite the preregistration'},
         {'id':'SAMPLE_AND_ORDER_INFERENCE','severity':'DESIGN_LIMITATION',
          'evidence':'2 people per one of six orders only tests basic usability; cannot estimate order effects robustly',
          'decision':'Require larger separately powered study before claiming order independence or market calibration'},
         {'id':'RECRUITMENT_AND_PRIVACY_IMPLEMENTATION','severity':'BLOCKING_BEFORE_RECRUITMENT',
          'evidence':'No independent consent, privacy-retention period, unique-person dedupe or assignment implementation approved',
          'decision':'Specify consent, pseudonymization, retention/deletion, de-duplication, eligibility, pause handling and audit logging'},
         {'id':'IDENTITY_SOURCE_HOLDS','severity':'HOLD_REMAINS',
          'evidence':'Original 6 slots excluded and 7 player identity cases unadjudicated',
          'decision':'Retain seven holds and excluded slots; no backfill from unreviewed sources'},
        ]
        review={
         'status':'SCIENTIFIC_REVIEW_FINDINGS_OPEN_NOT_PILOT_AUTHORIZED',
         'source':'V21 GitHub run 38324067358; original owner scope/prereg only',
         'exact_v21_input_sha256':{name:EXPECTED[key] for key,name in files.items()},
         'review_candidates':22,
         'catalog_status_counts':{'unchanged_source_screened':counts[UNCH],
            'optional_shadow_unapproved':counts[SHADOW],
            'owner_tentative_undisplayed':counts[TENT]},
         'original_excluded_slots':scope['excluded_held_slots'],
         'unresolved_identities':scope['identity_hold_names'],
         'six_orders':6,'design_sample_size':12,'actual_participants':0,
         'critical_stop_rule_reconciliation_required':True,
         'independent_protocol_review_completed':False,
         'owner_pilot_activation_approved':False,
         'recruitment_or_issuance_permitted':False,
         'market_value_ingestion_or_promotion_permitted':False,
         'production_changed':False,
         'risks':risks,
         'next_gate':'Owner review of study wording and all blocking risks; real pilot requires separate explicit authorization after independent QC',
        }
        (OUT/'RESEARCH_ONLY_v22_independent_readiness_matrix.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\n')
        lines=['# QF11 V22 — Independent protocol and catalog readiness review','',
         '**RESEARCH ONLY — V21 preregistration verified; real pilot remains unauthorized.**','',
         '## Verified unchanged scope',
         '- 22 candidate triplets: **12 unchanged source-screened**, **9 uncertified optional shadow**, **1 tentative owner research choice**.',
         '- Excluded original slots: **1, 5, 8, 12, 15, 21**. Seven identity holds are unchanged.',
         '- Selected trio is still **Brock Bowers / Tyler Warren / TreVeyon Henderson** for research only.',
         '- 12-person draft (6 presentation orders, 2 independent people per order) is preregistered as a design only.',
         '- **No recruitment, links, votes, Market Value training, or production changes.**','',
         '## Matters requiring explicit resolution before a human pilot','',
         '| Gate | Severity | Evidence / next decision |','|---|---|---|']
        for r in risks:lines.append('| '+r['id']+' | '+r['severity']+' | '+r['evidence']+'; '+r['decision']+' |')
        lines+=['','## Methodological clarification',
         'The 10/12 aggregate comprehension threshold is **not** permission to ignore an individual critical misunderstanding. The current V21 preregistration contains both an aggregate threshold and a serious-failure pause rule. Define precedence explicitly in an amended protocol, with an owner decision, before participant contact.',
         '', 'Two people per display order is inadequate for estimating an order effect and the 12-person usability pilot must not be treated as market-vote evidence.',
         '', '## Decision boundary',
         'The workflow Green means the evidence was checked and risks identified, **not** that scientific review or participant safeguards are complete. Owner approval from V20 is limited to preregistration. Further approval is required for recruitment/issuance; all voter/production gates stay closed.',
         '','Original full-model audit: **13/20 closed (65%)**; no audit finding is closed by V22.','']
        (OUT/'RESEARCH_ONLY_v22_owner_quality_gate.md').write_text('\n'.join(lines))
        assert {p.name for p in OUT.iterdir()}=={'RESEARCH_ONLY_v22_independent_readiness_matrix.json','RESEARCH_ONLY_v22_owner_quality_gate.md'}
        print('QF11_V22_SCIENTIFIC_REVIEW_REPORT_GREEN '+json.dumps({
         'candidate_rows':22,'unchanged':12,'optional_uncertified':9,'tentative':1,'excluded_slots':6,
         'unresolved_identities':7,'blocking_or_clarification_items':len(risks),
         'participants':0,'voting':False,'market_change':False},sort_keys=True))

        QF11_V22_PY
    - name: Run all 14 repo frozen valuation and release regression groups
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V22_FROZEN_14_REGRESSIONS_GREEN
    - name: Prove V22 critical gates remain unresolved
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        p=Path('/tmp/qf11-v22-output')
        assert {f.name for f in p.iterdir()}=={'RESEARCH_ONLY_v22_independent_readiness_matrix.json','RESEARCH_ONLY_v22_owner_quality_gate.md'}
        j=json.loads((p/'RESEARCH_ONLY_v22_independent_readiness_matrix.json').read_text())
        assert j['status']=='SCIENTIFIC_REVIEW_FINDINGS_OPEN_NOT_PILOT_AUTHORIZED'
        assert j['review_candidates']==22 and j['catalog_status_counts']['optional_shadow_unapproved']==9
        assert j['critical_stop_rule_reconciliation_required']
        assert not j['owner_pilot_activation_approved'] and not j['recruitment_or_issuance_permitted']
        assert not j['market_value_ingestion_or_promotion_permitted'] and not j['production_changed']
        assert j['actual_participants']==0 and len(j['risks'])==6
        print('QF11_V22_FAIL_CLOSED_NO_RECRUITMENT_VOTING_OR_PRODUCTION_GREEN')
        PY
    - name: Recheck exact protected blobs and no repository writes
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }
        printf 'QF11_V22_MUTABLE_CACHE_OBSERVED %s\n' "$(git hash-object data/players_cache.json)"
        echo QF11_V22_PROTECTED_SOURCE_PINS_GREEN
        echo QF11_V22_ZERO_WRITE_GREEN
    - name: Archive V22 research-only independent review 7 days
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v22-RESEARCH-ONLY-independent-quality-gate
        path: /tmp/qf11-v22-output/RESEARCH_ONLY_v22_*
        retention-days: 7
        if-no-files-found: error
