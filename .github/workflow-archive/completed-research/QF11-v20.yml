name: QF11 V20 - 22 Slot Owner Scope and Pilot Protocol Decision (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V20_INPUT: /tmp/qf11-v20-input
  QF11_V20_OUTPUT: /tmp/qf11-v20-output
jobs:
  research:
    name: Freeze evidence-backed 22 review slots and draft non-voting comprehension protocol
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin protected production and crosswalk while observing mutable Sleeper cache only
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_WRONG_COMMIT; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        # data/players_cache.json is updated independently by scheduled Sleeper refresh.
        # V18 does NOT consume that mutable cache for identity adjudication; record its
        # checked-out blob SHA for reproducibility but never interpret drift as clearance.
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_ABSENT; exit 1; }
        printf 'QF11_V20_DYNAMIC_CACHE_OBSERVED %s\n' "$(git hash-object data/players_cache.json)"
        echo QF11_V20_FROZEN_SOURCE_PINS_GREEN
    - name: Download exact QF11 V12 conditional priority slate
      uses: actions/download-artifact@v4
      with:
        name: QF11-v12-RESEARCH-ONLY-conditional-priority-preservation
        run-id: 38299942270
        github-token: ${{ github.token }}
        path: /tmp/qf11-v20-input/v12
    - name: Download exact QF11 V17 tentative owner trio
      uses: actions/download-artifact@v4
      with:
        name: QF11-v17-RESEARCH-ONLY-owner-tentative-TE-selection
        run-id: 38315206531
        github-token: ${{ github.token }}
        path: /tmp/qf11-v20-input/v17
    - name: Download exact QF11 V19 Green Sleeper evidence and pilot draft
      uses: actions/download-artifact@v4
      with:
        name: QF11-v19-RESEARCH-ONLY-sleeper-identity-and-pilot-design
        run-id: 38319424567
        github-token: ${{ github.token }}
        path: /tmp/qf11-v20-input/v19
    - name: Recompute 22-slot candidate review scope and unapproved 12-person pilot proposal
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'QF11_V20_PY'
        #!/usr/bin/env python3
        """QF11 V20: research-only, frozen-evidence 22-slot scope and draft human-comprehension prereg.

        Safe without network. Never edits repository, activates ballots, contacts voters, or clears identities.
        """
        from __future__ import annotations
        import collections
        import hashlib
        import itertools
        import json
        import os
        from pathlib import Path

        IN = Path(os.getenv('QF11_V20_INPUT', '/tmp/qf11-v20-input'))
        OUT = Path(os.getenv('QF11_V20_OUTPUT', '/tmp/qf11-v20-output'))
        OUT.mkdir(parents=True, exist_ok=True)
        SOURCES={
         'v12':('v12/RESEARCH_ONLY_v12_conditional_priority_slate.json','c30a9e9b5c0d8c44ac969d5f1b6e00d18b0a641be1873161b43cb79a2d52cd7c'),
         'v17':('v17/RESEARCH_ONLY_v17_tentative_owner_selection.json','046a752fd319dd942af1593631aaddd998c5f9f242a4536adfc3237e4ba69465'),
         'v19_identity':('v19/RESEARCH_ONLY_v19_sleeper_identity_evidence.json','abc7f4671c414f768984a5532029da1cabb9bab4462cc335c9ae3edaabf19ac8'),
         'v19_pilot':('v19/RESEARCH_ONLY_v19_voter_pilot_design_DRAFT.json','75692b5447fbed8a90cdc3cfd538a89fbfe357bf1f7bad87250f83e5f3996312'),
        }
        archive={}
        for key,(name,digest) in SOURCES.items():
         path=IN/name
         assert path.is_file(), 'STOP_MISSING_PINNED_ARCHIVE_'+key
         assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,'STOP_ARCHIVE_SHA_MISMATCH_'+key
         archive[key]=json.loads(path.read_text())
        v12,v17,v19,pilot=(archive[x] for x in ['v12','v17','v19_identity','v19_pilot'])
        TRIO=['brock bowers','tyler warren','treveyon henderson']
        HOLDS={'byron young','james cook','jaylon carlies','jaylon jones','malik willis','micah parsons','will anderson'}
        FOUR={1:'will anderson',8:'byron young',12:'micah parsons',15:'malik willis'}
        assert v12['summary']['v12_conditional_priority_preserving_slots']==25
        assert v12['summary']['v12_conditional_slots_without_identity_clearance']==[1,8,12,15]
        assert v12['summary']['original_unresolved_slots']==[5,11,21]
        assert v17['status']=='OWNER_TENTATIVE_RESEARCH_CANDIDATE_RECORDED_NOT_VOTE_APPROVAL'
        assert v17['selected_player_keys']==TRIO and v17['with_research_slot11_conditional_slots']==26
        assert v17['owner_tentative_research_selection_approved'] is True
        assert v17['owner_voter_issuance_approved'] is False and v17['production_change_authorized'] is False
        assert v17['seven_identity_holds'] and set(v17['seven_identity_holds'])==HOLDS
        assert v19['identity_clears']==0 and len(v19['cases'])==7
        assert all(x['identity_cleared'] is False for x in v19['cases'])
        assert {x['model_player'] for x in v19['cases']}==HOLDS
        assert v19['voting_activated'] is False and v19['owner_signoff'] is False
        assert pilot['status']=='PAPER_ONLY_DESIGN_PROPOSAL_NOT_PREREGISTERED_NOT_APPROVED'
        assert pilot['ballot_realism_approved'] is False and pilot['voting_activated'] is False
        assert pilot['owner_selected_trio']==TRIO
        assert pilot['unique_display_orders']==6
        assert set(map(tuple,pilot['permuted_order_design']))==set(itertools.permutations(['Brock Bowers','Tyler Warren','TreVeyon Henderson']))

        original=v12['slots']
        assert len(original)==25 and len({x['slot'] for x in original})==25
        assert len([x for x in original if x['source_status']=='CONDITIONAL_OWNER_REVIEW_NOT_SOURCE_CLEARED'])==4
        assert {x['slot'] for x in original if x['source_status']=='CONDITIONAL_OWNER_REVIEW_NOT_SOURCE_CLEARED'}==set(FOUR)
        for x in original:
         if x['slot'] in FOUR:
          assert FOUR[x['slot']] in x['players']
         else:
          assert not(set(x['players'])&HOLDS),'STOP_HIDDEN_HELD_IDENTITY_SLOT_'+str(x['slot'])
          assert x['source_status'] in {'SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED','OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY'}
        assert set(range(1,29))-({x['slot'] for x in original})=={5,11,21}
        retained=[{'slot':r['slot'],'players':r['players'],'source_status':r['source_status'],
                   'same_position_pair':r['same_position_pair'],'fv_ratio':r['fv_ratio']} for r in original if r['slot'] not in FOUR]
        assert len(retained)==21
        retained.append({'slot':11,'players':TRIO,'source_status':'OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN',
                         'same_position_pair':TRIO[:2],'fv_ratio':1.182106})
        retained.sort(key=lambda x:x['slot'])
        counts=collections.Counter(name for row in retained for name in row['players'])
        pairs=[tuple(sorted(row['same_position_pair'])) for row in retained]
        assert len(retained)==22 and len(set(pairs))==22 and max(counts.values())<=2
        assert max(row['fv_ratio'] for row in retained)<=1.30
        assert all(not(set(row['players'])&HOLDS) for row in retained)
        assert set(x['slot'] for x in retained)==set(range(1,29))-{1,5,8,12,15,21}
        assert len([x for x in retained if x['slot']==11])==1

        scope={
         'status':'22_SLOT_REVIEW_CANDIDATE_SCOPE_NOT_RELEASE_APPROVAL',
         'source_sha256':{k:hashval for k,(_,hashval) in SOURCES.items()},
         'original_catalog_slots':28,'previous_conditional_slots':26,'source_screened_prior_candidates':21,
         'tentative_cross_position_pilot_slot':11,'candidate_review_slots':22,
         'excluded_original_slots':[1,5,8,12,15,21],
         'excluded_identity_held_existing_slots':sorted(FOUR),
         'excluded_already_unresolved_slots':[5,21],
         'seven_identity_holds':sorted(HOLDS),
         'eligible_for_voter_distribution':False,'owner_catalog_approval':False,
         'owner_pilot_approval':False,'ballot_realism_approved':False,
         'voting_activated':False,'new_ballots_issued':False,
         'market_value_or_model_changed':False,'production_authorized':False,
         'unique_same_position_pairs':len(set(pairs)),'max_player_appearances':max(counts.values()),
         'max_fv_ratio_descriptive':round(max(x['fv_ratio'] for x in retained),6),
         'candidate_review_slate':retained,
         'note':'21 source-screened research candidates + 1 tentative cross-position trio. No selection is certified for issue.'
        }

        protocol={
         'status':'OWNER_REVIEW_DRAFT_NOT_PREREGISTERED_NOT_APPROVED',
         'scope':'Human comprehension/usability pilot only; no valuation training or new market votes',
         'preconditions':['owner accepts 22-slot REVIEW scope and excludes original slots 1,5,8,12,15,21',
                          'independent signoff on stable player identities and league-specific IDP eligibility before any held ballot could return',
                          'owner reviews cross-position TE/TE/RB instructions and pilot consent wording',
                          'independent voter assignment, source provenance, screening, sample size, and stopping rule explicitly approved before external invitations'],
         'draft_study_context':'12-team dynasty Superflex with IDP; KEEP / TRADE / CUT refers to three asset priorities, not mandatory transactions',
         'draft_target_n_independent_people':12,
         'draft_allocation':'6 presentation orders x 2 unique participants; randomized per participant, independently audited',
         'draft_screen':'Familiar with dynasty SF/IDP roster formats; do not recruit bots, duplicated accounts, or prior pilot replicates',
         'draft_questions':pilot['suggested_comprehension_prompts'],
         'draft_critical_failure':'Participant misidentifies the RB, misinterprets the context, or treats choices as forced real-world trades',
         'draft_provisional_pass_rule':'For design feedback only: >=10/12 identify the RB; >=10/12 understand equal time horizon and Keep/Trade/Cut; zero unresolved critical UI wording problems. Small n not evidence of vote calibration.',
         'draft_stop':'Once 12 consented independent responses meet six-order assignment plan; pause for manual safety review on any serious comprehension issue',
         'draft_exposure_cap':'At most one display of the tentative trio per participant, 0 ingestion into Market Value, 0 FV changes',
         'draft_retention':'Store only consented study findings and pseudonymous order/comprehension results according to an owner-approved retention policy',
         'historical_votes':'Existing 7 / 4 / 9 direct ballots are descriptive and NOT independent new evidence',
         'pilot_sample_approved':False,'randomization_approved':False,'thresholds_approved':False,
         'actual_respondent_study_started':False,'voter_links_created':False,'voting_activated':False,
         'market_repricing_allowed':False,
         'exact_six_order_candidates':pilot['permuted_order_design'],
         'limitations':'Two participants per order cannot support reliable order-bias estimation; prospective larger study requires a new gate'
        }

        review=['# QF11 V20 — Consolidated owner scope and comprehension pilot decision gate','',
         '**RESEARCH ONLY. No voter links, ballots, Market Value updates, production changes, or identity clearances.**','',
         '## Frozen evidence findings',
         '- GitHub-confirmed V19 examined 12,229 Sleeper records, but **zero of seven identity holds cleared**.',
         '- V17 established **26 mechanically feasible** ballots including four priority-held slots.',
         '- Excluding held slots **1, 8, 12, 15** plus unresolved **5, 21** yields **21 source-screened research candidates and one tentative slot 11**: 22 review candidates.',
         '- The retained 22 maintain distinct same-position pairs, <=2 player appearances and <=1.30 FV ratio.',
         '- The tentative **Bowers / Warren / TreVeyon Henderson** cross-position TE/TE/RB trio is *not comprehension-validated*.','',
         '## Decisions for owner review (NOT assumed approved)',
         '1. **Scope**: review the 22-slot candidate slate; keep 6 held slots excluded rather than auto-adjudicate names/positions.',
         '2. **Pilot**: review the 12-person, 6-order paper protocol as a proposal only, not a real user survey.',
         '3. **Exit criteria**: require explicit owner signoff and a separately verified pilot before issuing any ballot.',
         '4. **Market use**: no KTC/Market Value repricing from pilot responses. Future independent votes need a separate preregistration.',
         '','## Held-slot provenance','| Original slot | Exclusion reason |','|---:|---|',
         '| 1 | Will Anderson identity suffix |', '| 5 | Byron Young / Will Anderson / James Cook unresolved original |',
         '| 8 | Byron Young league-specific IDP position |','| 12 | Micah Parsons IDP position |',
         '| 15 | Malik Willis model/Sleeper team conflict |','| 21 | Jaylon Carlies / Jaylon Jones unresolved original |',
         '','## Governance','- Seven cases still held. 14 repo regression groups must pass. Audit remains 13/20.',
         '- No owner/catalog/realism/voter-release approval is inferred from a Green workflow.',
         '- The six ordering patterns are structural possibilities, not respondent evidence.']

        (OUT/'RESEARCH_ONLY_v20_22_slot_owner_scope.json').write_text(json.dumps(scope,sort_keys=True,indent=2)+'\n')
        (OUT/'RESEARCH_ONLY_v20_pilot_prereg_DRAFT.json').write_text(json.dumps(protocol,sort_keys=True,indent=2)+'\n')
        (OUT/'RESEARCH_ONLY_v20_owner_decisions.md').write_text('\n'.join(review)+'\n')
        assert len(list(OUT.iterdir()))==3
        assert all(p.stat().st_size>500 for p in OUT.iterdir())
        print('QF11_V20_22_SLOT_SCOPE_RESEARCH_GREEN '+json.dumps({'screened_prior':21,'tentative_slot11':1,'held_excluded':6,'candidate_review_slots':22,'max_appearances':max(counts.values()),'independent_pairs':len(set(pairs)),'pilot_approved':False,'voting_activated':False},sort_keys=True))

        QF11_V20_PY
    - name: Run frozen 14 regression groups and FA and PA release selftests
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V20_FROZEN_14_REGRESSIONS_GREEN
    - name: Fail closed on unapproved voter use, changed protected blobs or dirty checkout
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_REPOSITORY_WRITES; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_DRIFT_$1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        python3 - <<'PY_POST'
        from pathlib import Path
        import json
        p=Path('/tmp/qf11-v20-output')
        assert {x.name for x in p.iterdir()}=={'RESEARCH_ONLY_v20_22_slot_owner_scope.json','RESEARCH_ONLY_v20_pilot_prereg_DRAFT.json','RESEARCH_ONLY_v20_owner_decisions.md'}
        a=json.loads((p/'RESEARCH_ONLY_v20_22_slot_owner_scope.json').read_text())
        b=json.loads((p/'RESEARCH_ONLY_v20_pilot_prereg_DRAFT.json').read_text())
        assert a['candidate_review_slots']==22 and a['source_screened_prior_candidates']==21
        assert a['excluded_original_slots']==[1,5,8,12,15,21]
        assert len(a['candidate_review_slate'])==22 and a['max_player_appearances']<=2
        assert a['owner_catalog_approval'] is False and a['voting_activated'] is False
        assert a['eligible_for_voter_distribution'] is False and a['production_authorized'] is False
        assert b['status']=='OWNER_REVIEW_DRAFT_NOT_PREREGISTERED_NOT_APPROVED'
        assert b['actual_respondent_study_started'] is False and b['voter_links_created'] is False
        assert b['pilot_sample_approved'] is False and b['market_repricing_allowed'] is False
        print('QF11_V20_NO_OWNER_APPROVAL_NO_VOTING_ZERO_WRITE_GREEN')
        PY_POST
    - name: Archive research-only 22-slot owner choice and pilot design (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v20-RESEARCH-ONLY-22-scope-and-pilot-protocol
        path: /tmp/qf11-v20-output/RESEARCH_ONLY_v20_*
        retention-days: 7
        if-no-files-found: error
