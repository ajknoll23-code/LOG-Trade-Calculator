# QF11 V3 — single source-cohort research artifact. No old-market metadata graft, no model changes.
# Derived-only artifact excludes individual voter identifiers and raw ballots.
name: QF11 V3 - Source-Aligned Market Provenance Candidate (Research Only)
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  study:
    name: Freeze one current ballot cohort into synchronized derived market and voting evidence; no writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout pinned main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing HTTP regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin published market and approved valuation source lineage
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP dispatched source moved'; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
        git merge-base --is-ancestor 590afe6046aabe3937a4c360c9c1e93a9cf1e08d HEAD || { echo 'STOP QF10 uncertainty production ancestor missing'; exit 1; }
        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }
        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        pin scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        pin scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        pin scripts/validation/evaluate_market_history.py 121fc506d5a5b3c949a1a3951cd92b3bcbb23a58
        pin research/idp-dl-lb-residual-reconciliation-v1/phase2_evaluation.json 01ae185b325c37727dfea1582da12aa0167df3a4
        echo 'QF11_V3_EXACT_SOURCE_GUARDS_GREEN old published market and frozen model preserved'
    - name: Check canonical market valuation and live model selftests
      shell: bash
      run: |-
        set -euo pipefail
        python3 scripts/market/build_market_value.py --selftest
        python3 scripts/validation/snapshot_values.py --selftest
    - name: Build source-aligned anonymous aggregate evidence and prospective Market candidate outside repo
      shell: bash
      run: |-
        set -euo pipefail
        cat > /tmp/qf11-v3-source-aligned.py <<'QF11_V3_PY'
        #!/usr/bin/env python3
        """QF11 V3: same-source, per-player market provenance research only.
        Single live ballot ingestion; no repo outputs; sanitized ephemeral Actions artifact.
        """
        from __future__ import annotations
        import hashlib
        import json
        import math
        import sys
        from collections import Counter, defaultdict
        from datetime import datetime, timezone
        from pathlib import Path

        ROOT = Path.cwd()
        assert (ROOT / 'index.html').is_file(), 'STOP must run at repo root'
        for rel in ('scripts/market', 'scripts/validation'):
            sys.path.insert(0, str(ROOT / rel))
        sys.path.insert(0, str(ROOT))
        import build_market_value as market
        import ktc_pipeline
        import snapshot_values
        from evaluate_market_history import build_alias_index, normalize_name

        published = json.loads((ROOT/'scripts/artifacts/generated/market_values.json').read_text())
        cfg = snapshot_values.load_from_html(ROOT / 'index.html')
        model = snapshot_values.compute_all_values(cfg)
        assert len(model) == 565, 'STOP model count drift'
        assert len(published['players']) == 504, 'STOP published market coverage drift'
        assert published['policy_sha256'] == market.POLICY_SHA256, 'STOP policy mismatch'
        assert published['method_version'] == market.METHOD_VERSION, 'STOP market method mismatch'
        assert published['scale_semantics'] == market.SCALE_SEMANTICS, 'STOP scale mismatch'

        # Exactly ONE canonical market ingest and filtered daily-capped row cohort. Never
        # fetch a second copy for the evidence (could be a different sheet snapshot).
        rows, src = market.load_vote_rows()
        assert src.get('mode') == 'live_sheet', 'STOP non-live input'
        assert 400 <= len(rows) <= 100000, 'STOP suspicious vote row count'
        assert all(all(row.get(k) for k in ('keep','trade','cut')) for row in rows), 'STOP incomplete kept vote row'
        source_bytes = json.dumps(rows, sort_keys=True, separators=(',',':'), ensure_ascii=True).encode()
        source_digest = hashlib.sha256(source_bytes).hexdigest()
        voters = market.build_voter_weights(rows)
        pairs = market.build_weighted_pairs(rows, voters)
        assert len(pairs) == 3*len(rows), 'STOP canonical decomposition drift'
        assert all(math.isfinite(float(row['ballot_weight'])) and row['ballot_weight']>0 for row in voters.values())
        raw_scores = ktc_pipeline.weighted_bradley_terry(pairs)
        ratings, identity_audit = market.resolve_league_ratings(model, raw_scores)
        calibration = market.quantile_calibrate(model, ratings)
        assert len(calibration) == 504, 'STOP market cohort changed from published; comparison not equivalent'
        assert set(calibration) == set(published['players']), 'STOP player universe changed; no candidate'
        market.validate_payload({'schema_version':1,'method_version':market.METHOD_VERSION,'scale_semantics':market.SCALE_SEMANTICS,'players':calibration})

        # Per-player evidence can be computed only after resolving names to an exact model
        # key, or to a unique best-priority audited alias. No fuzzy or unreviewed join.
        alias_index = build_alias_index(list(model))
        lookup_cache = {}
        status = Counter()
        def resolve(name):
            name = normalize_name(str(name or ''))
            if name not in lookup_cache:
                opts = {tuple(v) for v in alias_index.get(name,())}
                if not opts:
                    lookup_cache[name] = (None,'unmatched')
                else:
                    p = min(v[1] for v in opts)
                    winners = {v[0] for v in opts if v[1] == p}
                    lookup_cache[name] = (next(iter(winners)), 'resolved') if len(winners)==1 else (None,'ambiguous')
            return lookup_cache[name]

        def blank():
            return {'ballots':0, 'directVoters':set(),
                    'samePairs':0,'crossPairs':0,'sameWeight':0.0,'crossWeight':0.0,
                    'sameVoterMass':defaultdict(float), 'allVoterMass':defaultdict(float)}
        stats = defaultdict(blank)
        pair_counts = Counter()
        for ballot in rows:
            uid = str(ballot.get('voter_roster_id') or 'unknown')
            w = float(voters[uid]['ballot_weight'])
            vals=[resolve(ballot[k]) for k in ('keep','trade','cut')]
            for key,st in vals:
                status[st]+=1
                if key in calibration:
                    stats[key]['ballots']+=1
                    stats[key]['directVoters'].add(uid)
            for ia,ib in ((0,1),(0,2),(1,2)):
                a,sa=vals[ia];b,sb=vals[ib]
                if not a or not b or a==b:
                    pair_counts['unresolved_or_duplicate'] += 1
                    continue
                kind='same' if model[a]['pos']==model[b]['pos'] else 'cross'
                pair_counts[kind] += 1
                for key in (a,b):
                    if key not in calibration: continue
                    z=stats[key]
                    z[kind+'Pairs']+=1
                    z[kind+'Weight']+=w
                    z['allVoterMass'][uid]+=w
                    if kind=='same': z['sameVoterMass'][uid]+=w
        assert sum(pair_counts.values()) == len(pairs), 'STOP pair accounting does not reconcile'

        # Candidate only — no overlay onto existing published market artifact, and no
        # declaration of an empirically justified enough-data threshold.
        prospective={}
        counts=Counter();positions=defaultdict(Counter)
        changed_values=[]
        for key,entry in calibration.items():
            st=stats[key]
            mass=sum(st['sameVoterMass'].values())
            fullmass=sum(st['allVoterMass'].values())
            def pct(x,y): return round(100*x/y,3) if y>0 else None
            evidence={
                'same_position_pairwise_observations':int(st['samePairs']),
                'same_position_effective_pairwise_weight':round(st['sameWeight'],6),
                'same_position_distinct_voters':len(st['sameVoterMass']),
                'same_position_dominant_voter_share_pct':pct(max(st['sameVoterMass'].values(),default=0.0),mass),
                'cross_position_pairwise_observations':int(st['crossPairs']),
                'cross_position_effective_pairwise_weight':round(st['crossWeight'],6),
                'all_pairwise_dominant_voter_share_pct':pct(max(st['allVoterMass'].values(),default=0.0),fullmass),
                'direct_ballots':int(st['ballots']),
                'direct_distinct_voters':len(st['directVoters']),
                'same_position_enough_data':None,
                'evidence_status':'NO_SAME_POSITION_PAIRS' if st['samePairs']==0 else 'OBSERVED_NO_POLICY_CUTOFF',
            }
            prospective[key] = {**entry,'evidence':evidence}
            obs=st['samePairs']
            bucket='zero' if obs==0 else ('1-2' if obs<3 else ('3-9' if obs<10 else '10+'))
            counts[bucket]+=1
            positions[entry['pos']]['players']+=1
            positions[entry['pos']][bucket]+=1
            if st['crossPairs']>0 and obs==0: positions[entry['pos']]['cross_only']+=1
            if obs>0 and evidence['same_position_dominant_voter_share_pct'] >= 50:positions[entry['pos']]['same_voter_share_ge_50']+=1
            diff = abs(entry['market_value']-published['players'][key]['market_value'])
            changed_values.append(diff)
        assert sum(counts.values())==504,'STOP player evidence coverage does not reconcile'
        assert all(v['fundamental_value']==model[k]['value'] for k,v in prospective.items()),'STOP FV center mismatch'
        assert sorted(int(v['market_value']) for v in prospective.values())==sorted(int(v['fundamental_value']) for v in prospective.values()),'STOP market quantile value distribution'

        # Merely describe alternative disclosure sample sizes — never approve a numeric
        # enough-data threshold or attach these to the Oct 7 historical market output.
        descriptive_grid={}
        for min_obs in (1,3,5,10):
            for min_voters in (1,2,3):
                label=f'observations>={min_obs}_unique_same_position_voters>={min_voters}'
                descriptive_grid[label]=sum(1 for p in prospective.values() if
                    p['evidence']['same_position_pairwise_observations']>=min_obs and
                    p['evidence']['same_position_distinct_voters']>=min_voters)

        candidate={
            'schema_version':1,
            'research_only':True,
            'deployment_authorized':False,
            'description':'New prospective source-aligned vote candidate; NOT the published Market Value artifact',
            'generated_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'method_version':market.METHOD_VERSION,
            'scale_semantics':market.SCALE_SEMANTICS,
            'policy_sha256':market.POLICY_SHA256,
            'source':{'mode':'one_live_sheet_fetch','source_after_daily_cap_sha256':source_digest,
                'raw_sheet_rows':src.get('raw_sheet_row_count'),'eligible_rows':len(rows),
                'effective_votes':round(sum(v['effective_votes'] for v in voters.values()),4),
                'distinct_voters':len(voters)},
            'published_reference':{'generated_at_utc':published['generated_at_utc'],
                'source_not_equivalent':True,'published_market_artifact_must_not_be_overwritten':True},
            'players':prospective,
        }
        summary={
            'status':'RESEARCH_ONLY_SOURCE_ALIGNED_CANDIDATE',
            'source_after_daily_cap_sha256':source_digest,
            'eligible_rows':len(rows),
            'raw_sheet_rows':src.get('raw_sheet_row_count'),
            'covered_players':len(prospective),
            'counts':dict(counts),
            'by_position':{k:dict(v) for k,v in sorted(positions.items())},
            'pairs':dict(pair_counts),
            'resolution':dict(status),
            'market_drift_max_abs':max(changed_values),
            'market_drift_any':sum(x>0 for x in changed_values),
            'descriptive_support_grid_NOT_THRESHOLDS':descriptive_grid,
            'will_anderson': prospective['will anderson']['evidence'],
            'source_agrees_with_market_model':True,
            'same_position_enough_data_approved':False,
            'published_snapshot_matched':False,
            'reprice_or_deploy_authorized':False,
            'voter_privacy':'No voter IDs or ballot-level data saved in artifact, reports, or logs',
        }
        OUT=Path('/tmp/qf11-v3-review')
        OUT.mkdir(parents=True,exist_ok=True)
        (OUT/'PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json').write_text(json.dumps(candidate,indent=2,sort_keys=True)+'\n')
        (OUT/'PROSPECTIVE_NOT_FOR_PUBLICATION_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
        report=['# QF11 V3 — Source-aligned prospective Market provenance (research only)','',
        '**NO DEPLOYMENT AUTHORIZED.** Source is a new live ballot cohort, not the Oct 7 published market snapshot.',
        'No per-voter identifiers, ballots, or raw source records are included in the output.','',
        '## Aggregate support',
        '']
        for k in ('zero','1-2','3-9','10+'):
            report.append(f'- Same-position observations {k}: {counts[k]} players')
        report+=['','## Scientific restrictions','',
        '- Existing published market source is dated; these values and evidence must never be joined to it.',
        '- Same-position and cross-position pairwise evidence are separate; missing same-position pairs does NOT mean zero market observations.',
        '- No threshold for `same_position_enough_data` is scientifically authorized.',
        '- Vote support summaries are descriptive. A complete market stability protocol remains necessary.',
        '- No production, FV, IDP, PA, Team Utility, or voting-policy changes were made.',
        '','## Source binding','',
        '- Counted-row canonical SHA256: `'+source_digest+'`',
        '- Eligible ballots: '+str(len(rows)),
        '- Distinct voters: '+str(len(voters)),
        '- Market-covered players: '+str(len(prospective)),
        ]
        (OUT/'PROSPECTIVE_NOT_FOR_PUBLICATION_README.md').write_text('\n'.join(report)+'\n')
        for fn in OUT.iterdir():
            text=fn.read_text()
            assert all(bad not in text for bad in ('voter_roster_id','sheet_url','raw_ballots','ballot_weight')), 'STOP potential source leakage'
        print('QF11_V3_SOURCE_ALIGNED_RESEARCH '+json.dumps(summary,sort_keys=True))
        print('QF11_V3_OUTPUT_HASHES '+json.dumps({f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in OUT.iterdir()},sort_keys=True))
        print('QF11_V3_RESEARCH_GREEN: single cohort, paired market and per-player provenance; no production change or approved threshold')
        QF11_V3_PY
        python3 -m py_compile /tmp/qf11-v3-source-aligned.py
        python3 /tmp/qf11-v3-source-aligned.py
    - name: Re-run frozen regression suite and free agent package gates
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo 'QF11_V3_14_REGRESSION_GROUPS_GREEN'
    - name: Prove zero tracked and untracked repo writes
      shell: bash
      run: |
        set -euo pipefail
        [[ -z "$(git status --porcelain)" ]] || { echo 'STOP repo modified'; exit 1; }
        [[ "$(git hash-object index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || exit 1
        [[ -f /tmp/qf11-v3-review/PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json ]] || { echo 'STOP candidate not built'; exit 1; }
        [[ "$(find /tmp/qf11-v3-review -maxdepth 1 -type f | wc -l)" -eq 3 ]] || { echo 'STOP unexpected report files'; exit 1; }
        echo 'QF11_V3_ZERO_WRITE_GREEN all output is research only, stored outside repo'
    - name: Archive derived research ONLY; never archive raw ballots or voter identifiers
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        path: /tmp/qf11-v3-review/*
        if-no-files-found: error
        retention-days: 7
