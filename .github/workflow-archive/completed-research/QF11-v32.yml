name: QF11 V32 - Isolated KTC V2 Browser Collector Bridge and Acknowledgment Tests (Disabled)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: qf11-ktc-v2-client-bridge-source-only
  cancel-in-progress: false
jobs:
  source_only:
    name: Add disabled V2 browser-to-collector bridge with explicit acknowledgment safety
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin V31 collector and frozen production sources
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo STOP_NOT_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_HEAD_DRIFT; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_TREE; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_DRIFT $1"; exit 1; }; }
        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        check research/ktc-v2-isolated/README.md 8dce132bfd2fa9584636b072fff4fde4cecf9436
        check research/ktc-v2-isolated/collector.gs 878b66a7ebb94e5aa1e91b3b8d68722fbf3f1c02
        check research/ktc-v2-isolated/collector.test.js fe5457ad31414ae6ec0612668b68bc0ca6a0bd4f
        check research/ktc-v2-isolated/contract.json e285365b5630d6e2459f7e08fbe9d72d6d2aad81
        for p in research/ktc-v2-isolated/client-bridge.js research/ktc-v2-isolated/client-bridge.test.js research/ktc-v2-isolated/V32_BRIDGE_OPERATIONS.md; do
          [[ ! -e "$p" ]] || { echo "STOP_ALREADY_PRESENT $p"; exit 1; }
        done
        [[ -f data/players_cache.json ]] || { echo STOP_MISSING_MUTABLE_CACHE; exit 1; }
        echo QF11_V32_FROZEN_SOURCE_AND_V31_COLLECTOR_PINS_GREEN
    - name: Create exactly three disabled V2 browser bridge source files
      run: |
        set -euo pipefail
        cat > research/ktc-v2-isolated/client-bridge.js <<'QF11_V32_1_SOURCE'
        /* QF11 V32: isolated KTC V2 browser submission contract. NOT wired to index.html.
         * Deliberately disabled without six explicit, independently verified launch gates.
         * No V1 collection, no local storage, no retry, no log/analytics, no PII fields.
         */
        (function(root,factory){
          'use strict';
          const exported=factory();
          if(typeof module==='object' && module.exports) module.exports=exported;
          else root.QF11KtcV2ClientBridge=exported;
        })(typeof globalThis!=='undefined'?globalThis:this,function(){
          'use strict';
          const SCHEMA='QF11_KTC_V2_PILOT_RESPONSE_V1';
          const KEYS=['schema','participant_token','display_order','consent','adult','sf_idp_experience','keep','trade','cut','mc'];
          const ALLOWED_ACK=new Set([
            'PENDING_HUMAN_Q4_REVIEW','CRITICAL_STOP_QUARANTINED',
            'DISABLED','HALTED','CLOSED','BUSY_NO_SUBMISSION',
            'REJECTED_SCHEMA','REJECTED_EXTRA_FIELDS','REJECTED_TOKEN_FORMAT',
            'REJECTED_CONSENT_OR_ELIGIBILITY','REJECTED_UNASSIGNED_TOKEN',
            'REJECTED_ORDER','REJECTED_RANKING','REJECTED_COMPREHENSION_FORMAT',
            'DUPLICATE_OR_SLOT_USED','REJECTED_PAYLOAD','REJECTED_JSON',
            'HALTED_CONFIGURATION_OR_STORAGE_ERROR'
          ]);
          function isGoogleScriptExec(url){
            if(typeof url!=='string' || !url || url.trim()!==url)return false;
            try{
              const parsed=new URL(url);
              return parsed.protocol==='https:' && parsed.hostname==='script.google.com' &&
                /^\/macros\/s\/[A-Za-z0-9_-]{16,}\/exec$/.test(parsed.pathname) &&
                !parsed.search && !parsed.hash && !parsed.username && !parsed.password;
            }catch(e){return false;}
          }
          function validPayload(payload,players){
            if(!payload || typeof payload!=='object' || Array.isArray(payload))return false;
            if(!Array.isArray(players) || players.length!==3 || new Set(players).size!==3 ||
               players.some(k=>typeof k!=='string' || !/^[A-Za-z0-9:_-]{2,80}$/.test(k)))return false;
            if(Object.keys(payload).length!==KEYS.length || KEYS.some(k=>!Object.prototype.hasOwnProperty.call(payload,k)))return false;
            if(payload.schema!==SCHEMA || typeof payload.participant_token!=='string' ||
               !/^[A-Za-z0-9_-]{32,128}$/.test(payload.participant_token))return false;
            if(!Number.isInteger(payload.display_order) || payload.display_order<0 || payload.display_order>5)return false;
            if(payload.consent!==true || payload.adult!==true || payload.sf_idp_experience!==true)return false;
            const ranks=[payload.keep,payload.trade,payload.cut];
            if(new Set(ranks).size!==3 || ranks.some(k=>!players.includes(k)))return false;
            if(!Array.isArray(payload.mc) || payload.mc.length!==3 ||
               payload.mc.some(n=>!Number.isInteger(n)||n<0||n>2))return false;
            return true;
          }
          function createBridge(options){
            const opts=options||{};
            let attempted=false;
            let inFlight=false;
            function ready(){
              return opts.independentInstrumentQcApproved===true &&
                opts.ownerRealPilotActivationApproved===true &&
                opts.dedicatedCollectorDeploymentVerified===true &&
                opts.privacyAndDeletionVerified===true &&
                opts.moderatorAndCriticalStopSopVerified===true &&
                opts.independentCollectorIsolationVerified===true &&
                isGoogleScriptExec(opts.endpoint) && isGoogleScriptExec(opts.legacyV1Endpoint) &&
                opts.endpoint!==opts.legacyV1Endpoint &&
                typeof opts.fetchImpl==='function';
            }
            async function submit(payload){
              if(!ready())return {state:'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'};
              if(inFlight || attempted)return {state:'LOCKED_NO_RETRY'};
              if(!validPayload(payload,opts.approvedPlayerKeys))return {state:'REJECTED_CLIENT_VALIDATION'};
              attempted=true;inFlight=true;
              try{
                const res=await opts.fetchImpl(opts.endpoint,{
                  method:'POST',mode:'cors',credentials:'omit',redirect:'follow',
                  referrerPolicy:'no-referrer',cache:'no-store',
                  headers:{'Content-Type':'text/plain;charset=utf-8'},
                  body:JSON.stringify(payload)
                });
                if(!res || res.ok!==true || res.type==='opaque' || typeof res.json!=='function')
                  return {state:'UNCERTAIN_DO_NOT_RETRY'};
                if(!res.headers || typeof res.headers.get!=='function' ||
                   !/application\/json/i.test(String(res.headers.get('content-type')||'')))
                  return {state:'UNCERTAIN_DO_NOT_RETRY'};
                const ack=await res.json();
                if(!ack || typeof ack!=='object' || Array.isArray(ack) ||
                   ack.schema!==SCHEMA || typeof ack.status!=='string' || !ALLOWED_ACK.has(ack.status) ||
                   Object.keys(ack).some(k=>k!=='schema'&&k!=='status'))
                  return {state:'UNCERTAIN_DO_NOT_RETRY'};
                if(ack.status==='PENDING_HUMAN_Q4_REVIEW')return {state:'AWAITING_MODERATOR_Q4_REVIEW'};
                if(ack.status==='CRITICAL_STOP_QUARANTINED')return {state:'CRITICAL_STOP_QUARANTINED'};
                return {state:'STOPPED_OR_NOT_ACCEPTED'};
              }catch(_){return {state:'UNCERTAIN_DO_NOT_RETRY'};}
              finally{inFlight=false;}
            }
            return Object.freeze({ready,submit,hasAttempted:()=>attempted});
          }
          return Object.freeze({SCHEMA,KEYS:Object.freeze(KEYS.slice()),validPayload,isGoogleScriptExec,createBridge});
        });
        QF11_V32_1_SOURCE
        cat > research/ktc-v2-isolated/client-bridge.test.js <<'QF11_V32_2_SOURCE'
        'use strict';
        const assert=require('assert');
        const fs=require('fs');
        const bridge=require('./client-bridge.js');
        const SCHEMA=bridge.SCHEMA;
        const V1='https://script.google.com/macros/s/AKfycbExistingCollectorV1ident0123456789/exec';
        const V2='https://script.google.com/macros/s/AKfycbDedicatedCollectorV2ident0123456789/exec';
        const players=['sample_a','sample_b','sample_c'];
        const token='QF11_V32_SYNTHETIC_INVITATION_TOKEN_0000000000';
        const payload=()=>({schema:SCHEMA,participant_token:token,display_order:0,consent:true,adult:true,sf_idp_experience:true,keep:'sample_a',trade:'sample_b',cut:'sample_c',mc:[1,1,0]});
        const opts=({fetchImpl, ...rest}={})=>Object.assign({independentInstrumentQcApproved:true,ownerRealPilotActivationApproved:true,dedicatedCollectorDeploymentVerified:true,privacyAndDeletionVerified:true,moderatorAndCriticalStopSopVerified:true,independentCollectorIsolationVerified:true,endpoint:V2,legacyV1Endpoint:V1,approvedPlayerKeys:players,fetchImpl:fetchImpl||(()=>Promise.resolve(okAck('PENDING_HUMAN_Q4_REVIEW')))},rest);
        const okAck=status=>({ok:true,type:'cors',headers:{get:k=>k==='content-type'?'application/json; charset=utf-8':''},json:async()=>({schema:SCHEMA,status})});
        let count=0;async function test(name,fn){await fn();count++;console.log('PASS '+name)}
        async function run(){
          await test('schema and exact client payload pass',()=>assert(bridge.validPayload(payload(),players)));
          await test('unsolicited identity/free-text fields rejected',()=>assert(!bridge.validPayload({...payload(),q4:'name'},players)));
          await test('false consent rejected',()=>assert(!bridge.validPayload({...payload(),consent:false},players)));
          await test('false adult rejected',()=>assert(!bridge.validPayload({...payload(),adult:false},players)));
          await test('false SF/IDP experience rejected',()=>assert(!bridge.validPayload({...payload(),sf_idp_experience:false},players)));
          await test('invalid token rejected',()=>assert(!bridge.validPayload({...payload(),participant_token:'roster-123'},players)));
          await test('duplicate ranking rejected',()=>assert(!bridge.validPayload({...payload(),trade:'sample_a'},players)));
          await test('unknown player rejected',()=>assert(!bridge.validPayload({...payload(),keep:'some_real_player'},players)));
          await test('invalid display order rejected',()=>assert(!bridge.validPayload({...payload(),display_order:6},players)));
          await test('invalid multiple choice rejected',()=>assert(!bridge.validPayload({...payload(),mc:[1,1,4]},players)));
          await test('endpoint must be Google Script exec without query',()=>{assert(bridge.isGoogleScriptExec(V2));assert(!bridge.isGoogleScriptExec('https://example.com/macros/s/AAAAAAAAAAAAAAAA/exec'));assert(!bridge.isGoogleScriptExec(V2+'?participant_token=xyz'));});
          let attempted=0;
          await test('default bridge refuses collection',async()=>assert.deepStrictEqual(await bridge.createBridge({fetchImpl:()=>{attempted++;}}).submit(payload()),{state:'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'}));
          await test('owner authorization false blocks before fetch',async()=>assert.equal((await bridge.createBridge(opts({ownerRealPilotActivationApproved:false,fetchImpl:()=>{attempted++;}})).submit(payload())).state,'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'));
          await test('instrument QC false blocks',async()=>assert.equal((await bridge.createBridge(opts({independentInstrumentQcApproved:false,fetchImpl:()=>{attempted++;}})).submit(payload())).state,'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'));
          await test('privacy deletion false blocks',async()=>assert.equal((await bridge.createBridge(opts({privacyAndDeletionVerified:false,fetchImpl:()=>{attempted++;}})).submit(payload())).state,'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'));
          await test('missing separation proof blocks',async()=>assert.equal((await bridge.createBridge(opts({independentCollectorIsolationVerified:false,fetchImpl:()=>{attempted++;}})).submit(payload())).state,'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'));
          await test('V1 collector URL reuse blocks',async()=>assert.equal((await bridge.createBridge(opts({endpoint:V1,fetchImpl:()=>{attempted++;}})).submit(payload())).state,'BLOCKED_NOT_AUTHORIZED_OR_CONFIGURED'));
          await test('never sends malformed payload',async()=>assert.equal((await bridge.createBridge(opts({fetchImpl:()=>{attempted++;}})).submit({...payload(),q4:'text'})).state,'REJECTED_CLIENT_VALIDATION'));
          await test('no unapproved fetch has occurred',()=>assert.equal(attempted,0));
          await test('valid test ack requires manual Q4 review and privacy fetch config',async()=>{
            let got;let countCalls=0;const b=bridge.createBridge(opts({fetchImpl:async(url,init)=>{got={url,init};countCalls++;return okAck('PENDING_HUMAN_Q4_REVIEW')}}));
            assert.equal((await b.submit(payload())).state,'AWAITING_MODERATOR_Q4_REVIEW');
            assert.equal(countCalls,1);assert.equal(got.url,V2);assert.equal(got.init.mode,'cors');assert.equal(got.init.credentials,'omit');assert.equal(got.init.referrerPolicy,'no-referrer');assert.equal(got.init.cache,'no-store');assert.equal(got.init.method,'POST');assert.deepStrictEqual(JSON.parse(got.init.body),payload());
            assert.equal((await b.submit(payload())).state,'LOCKED_NO_RETRY');assert.equal(countCalls,1);
          });
          await test('critical stop acknowledgment stays a stop',async()=>assert.equal((await bridge.createBridge(opts({fetchImpl:async()=>okAck('CRITICAL_STOP_QUARANTINED')})).submit(payload())).state,'CRITICAL_STOP_QUARANTINED'));
          await test('collector rejection never shown as accepted',async()=>assert.equal((await bridge.createBridge(opts({fetchImpl:async()=>okAck('DUPLICATE_OR_SLOT_USED')})).submit(payload())).state,'STOPPED_OR_NOT_ACCEPTED'));
          await test('opaque responses yield uncertain no retry',async()=>{let n=0;const b=bridge.createBridge(opts({fetchImpl:async()=>{n++;return {ok:true,type:'opaque',json:async()=>({schema:SCHEMA,status:'PENDING_HUMAN_Q4_REVIEW'})}}}));assert.equal((await b.submit(payload())).state,'UNCERTAIN_DO_NOT_RETRY');assert.equal((await b.submit(payload())).state,'LOCKED_NO_RETRY');assert.equal(n,1)});
          await test('CORS rejection yields uncertain no retry',async()=>{let n=0;const b=bridge.createBridge(opts({fetchImpl:async()=>{n++;throw new Error('CORS BLOCKED')}}));assert.equal((await b.submit(payload())).state,'UNCERTAIN_DO_NOT_RETRY');assert.equal((await b.submit(payload())).state,'LOCKED_NO_RETRY');assert.equal(n,1)});
          await test('missing JSON content type uncertain',async()=>{const b=bridge.createBridge(opts({fetchImpl:async()=>({...okAck('PENDING_HUMAN_Q4_REVIEW'),headers:{get:()=> 'text/html'}})}));assert.equal((await b.submit(payload())).state,'UNCERTAIN_DO_NOT_RETRY')});
          await test('wrong response schema uncertain',async()=>{const b=bridge.createBridge(opts({fetchImpl:async()=>({...okAck('PENDING_HUMAN_Q4_REVIEW'),json:async()=>({schema:'V1',status:'PENDING_HUMAN_Q4_REVIEW'})})}));assert.equal((await b.submit(payload())).state,'UNCERTAIN_DO_NOT_RETRY')});
          await test('in-flight duplicate blocked',async()=>{let resolve,n=0;const pending=new Promise(r=>resolve=r);const b=bridge.createBridge(opts({fetchImpl:()=>{n++;return pending}}));const first=b.submit(payload());assert.equal((await b.submit(payload())).state,'LOCKED_NO_RETRY');resolve(okAck('PENDING_HUMAN_Q4_REVIEW'));assert.equal((await first).state,'AWAITING_MODERATOR_Q4_REVIEW');assert.equal(n,1)});
          await test('no persistent storage/console/auto retry in client source',()=>{const s=fs.readFileSync(__dirname+'/client-bridge.js','utf8');for(const prohibited of [/localStorage\b/,/sessionStorage\b/,/console\.log\b/,/navigator\.sendBeacon\b/,/mode:'no-cors'/,/\.retry\b/])assert(!prohibited.test(s),String(prohibited))});
          await test('V31 collector contract retained in sibling source',()=>{const s=fs.readFileSync(__dirname+'/collector.gs','utf8');assert(s.includes("var QF11_V2_SCHEMA = 'QF11_KTC_V2_PILOT_RESPONSE_V1'"));assert(s.includes('qf11v2Handle_'));assert(s.includes('QF11_V2_SHEET_ID'));assert(!s.includes('https://script.google.com'))});
          assert.equal(count,29);console.log('QF11_V32_BROWSER_COLLECTOR_BRIDGE_TESTS_GREEN '+JSON.stringify({tests:count,real_participants:0,live_network_requests:0,real_votes:0}));
        }
        run().catch(e=>{console.error(e.stack);process.exit(1)});
        QF11_V32_2_SOURCE
        cat > research/ktc-v2-isolated/V32_BRIDGE_OPERATIONS.md <<'QF11_V32_3_SOURCE'
        # QF11 V32 — KTC V2 browser-to-collector bridge (disabled development source)

        **Deployment state:** Source files only, in `research/ktc-v2-isolated/`. Nothing from this package is loaded by `index.html`, no Google Apps Script is deployed, and no real participant has been invited. The KTC V2 section in Market Research remains a fictional interactive demo. This work neither changes KTC V1 nor the Market Value aggregation workflow.

        ## Purpose

        V31 committed the server-side Apps Script collector (`collector.gs`) with strict schema and participant eligibility. V32 adds `client-bridge.js`, a narrowly scoped browser submission transport adapter, and `client-bridge.test.js` with 29 network-free cases. This closes a source-code gap but is **not** proof that Google Apps Script can reliably return a browser-readable CORS acknowledgment.

        The adapter starts completely disabled. It cannot send anything until **all six flags** are explicitly true: independent wording/instrument QC, separate owner real-pilot authorization, verified dedicated collector deployment, verified privacy/deletion, moderator/critical-stop procedures, and independent endpoint isolation. It also requires valid distinct Google Apps Script URLs for the V1 legacy endpoint and V2 dedicated endpoint. No URL, secret, invitation, real player trio or private token is committed to this repository.

        ## Safety and response semantics

        - Exact request contract is QF11 V31 schema `QF11_KTC_V2_PILOT_RESPONSE_V1` with `schema`, opaque `participant_token`, display order, consent/adult/SF-IDP attestations, KEEP/TRADE/CUT keys and 3 comprehension selections. No Q4 free text, name, email or roster ID is allowed.
        - A browser may make **one attempt per bridge instance**. While the first is in flight or after it settles, repeats return `LOCKED_NO_RETRY`. This avoids unintentionally double-posting when network status is unknown. Server-side V31 dedup remains authoritative.
        - Only a verified JSON response with matching schema and exact recognized status can confirm outcome. The only positive output is `AWAITING_MODERATOR_Q4_REVIEW`, **not** scientific approval. Critical misunderstanding is a STOP. Other server statuses mean STOP/NOT ACCEPTED.
        - Network exception, CORS failure, opaque/no-cors response, non-JSON response or unknown status returns `UNCERTAIN_DO_NOT_RETRY`. An HTTP 200 / resolved `fetch()` without readable JSON is **not** acceptance.
        - `fetch()` uses `mode: 'cors'`, `credentials: 'omit'`, `referrerPolicy: 'no-referrer'`, `cache: 'no-store'`; the adapter does not use localStorage, sessionStorage, console logs, analytics, automatic retries or actual pilot identities.

        ## Deployment blockers after V32

        1. **Independent human QC and owner authorization** of exact V2 wording, Q1–Q4 moderation scoring, real participant procedure and research ethics. Existing technical tests alone are not human QC.
        2. Deploy a **dedicated new** Google Apps Script project and separate spreadsheet. V31 uses two distinct sheet IDs and a private invite HMAC allowlist; no production KTC V1 sheet/URL may be reused. Running GitHub Actions does not provision them.
        3. Establish secure invitation/identity dedup/consent/retention SOP, train moderator, and prove deletion in the deployed account including exports and backups. The V31 daily purge function is not a verified 30-day lifecycle by itself.
        4. **Empirically prove readable acknowledgments** from the Google Apps Script ContentService redirect in actual browsers across the calculator hosting origin. A browser CORS failure or opaque response is not a successful vote; do not silently change the bridge to `no-cors` to bypass it. If browser-readable acknowledgment is infeasible, choose a new validated isolated transport architecture before any real use.
        5. Conduct dummy-token end-to-end cross-browser tests and approve a controlled integration of this adapter into the calculator's V2 section. No participant invitation or V2 vote collection until those gates and an **additional explicit owner launch authorization**.
        6. Pilot scope remains **12-person comprehension/usability only**. Do not promote pilot responses into Market Value, FV or Package Adjustment without new preregistration, sufficient data and scientific review.

        V32 scope is intentionally narrow: three new source/doc files, zero production changes, 24 unchanged V31 server tests plus 29 new client-bridge tests, all existing 14 repository regression groups. The review of CORS/ack integrity is a genuine unresolved blocker, not a claim of operational readiness.
        QF11_V32_3_SOURCE
        echo QF11_V32_EXACT_THREE_BRIDGE_FILES_CREATED_GREEN
    - name: Run 24 existing collector tests and 29 fail-closed browser bridge tests
      run: |
        set -euo pipefail
        node --check research/ktc-v2-isolated/client-bridge.js
        node --check research/ktc-v2-isolated/client-bridge.test.js
        node research/ktc-v2-isolated/collector.test.js | tee /tmp/qf11-v32-existing-collector-tests.txt
        node research/ktc-v2-isolated/client-bridge.test.js | tee /tmp/qf11-v32-new-bridge-tests.txt
        grep -F '"tests":24' /tmp/qf11-v32-existing-collector-tests.txt
        grep -F '"tests":29' /tmp/qf11-v32-new-bridge-tests.txt
        python3 - <<'PY_INNER'
        from pathlib import Path
        p=Path('research/ktc-v2-isolated/client-bridge.js').read_text()
        assert 'https://script.google.com/macros/s/' not in p, 'STOP_BAKED_ENDPOINT'
        assert 'Brock Bowers' not in p and 'Tyler Warren' not in p and 'TreVeyon Henderson' not in p, 'STOP_REAL_PILOT_TRIO_LEAK'
        assert "mode:'cors'" in p and 'UNCERTAIN_DO_NOT_RETRY' in p
        assert all(x in p for x in ['independentInstrumentQcApproved','ownerRealPilotActivationApproved','privacyAndDeletionVerified','dedicatedCollectorDeploymentVerified'])
        assert all(x not in p for x in ['localStorage','sessionStorage','console.log','no-cors'])
        print('QF11_V32_NO_SECRET_NO_LIVE_NETWORK_NO_V1_TRANSPORT_BRIDGE_GREEN')
        PY_INNER
    - name: Run all frozen production and release regression groups
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V32_FROZEN_14_REGRESSIONS_GREEN
    - name: Prove zero existing file mutations and archive bridge deployment blockers
      run: |
        set -euo pipefail
        [[ -z "$(git diff --name-only)" ]] || { echo STOP_TRACKED_FILE_MODIFICATION; exit 1; }
        python3 - <<'PY_INNER'
        import subprocess,hashlib,json
        from pathlib import Path
        allowed={'research/ktc-v2-isolated/client-bridge.js','research/ktc-v2-isolated/client-bridge.test.js','research/ktc-v2-isolated/V32_BRIDGE_OPERATIONS.md'}
