name: CAL25 V1R1 - 565-Player Synchronized FV Votes MV Candidate Shadow READ ONLY

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  cal25_research:
    name: Frozen-Clock 565-Player FV+Votes/MV Shadow (No Production Writes)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout deployed post-CAL22 baseline without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12 for fixed-Lambda8 voter replay
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen research model dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check numpy scipy requests
      - name: Retrieve exact green CAL24 research evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cal25-cal24"
          gh run download 39544494023 --repo "$GITHUB_REPOSITORY" --name cal24-v1r1-post-cal22-565-player-valuation-research-READ-ONLY --dir "${RUNNER_TEMP}/cal25-cal24"
          test -s "${RUNNER_TEMP}/cal25-cal24/CAL24_Manifest.json"
          test -s "${RUNNER_TEMP}/cal25-cal24/CAL24_565_Full_Pool_Post_CAL22_Shadow_READ_ONLY.csv"
          test -s "${RUNNER_TEMP}/cal25-cal24/CAL24_Rookie_30pct_Bounded_Review_READ_ONLY.csv"
          test -s "${RUNNER_TEMP}/cal25-cal24/CAL24_Rescue_and_Disagreement_Queue_READ_ONLY.csv"
      - name: Write and syntax-check isolated CAL25 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/cal25_shadow.py" <<'PY_CAL25'
          #!/usr/bin/env python3
          """CAL25 V1R1: frozen Oct21 565-player synchronized FV/FV+Votes/MV research candidate.
          No repo writes and no authorization to price, trade, publish or deploy.
          """
          import argparse,csv,datetime,hashlib,json,math,re,sys,collections,copy,subprocess
          from pathlib import Path

          def digest(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def read_csv(path):
           with Path(path).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def save_csv(path,rows):
           with Path(path).open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          def out_json(path,obj):Path(path).write_text(json.dumps(obj,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          def require(v,msg):
           if not v:raise AssertionError(msg)

          def main(repo,source,out):
           repo,source,out=Path(repo),Path(source),Path(out)
           out.mkdir(parents=True,exist_ok=True)
           sys.path[:0]=[str(repo/'scripts/validation'),str(repo/'scripts/market'),str(repo/'scripts/sync')]
           import snapshot_values as sv
           import build_market_value as market
           import sync_free_agent_valuation as fas
           import numpy as np
           from scipy.optimize import minimize
           from scipy.special import expit
           from evaluate_market_history import build_alias_index,normalize_name

           original_age=sv.fractional_age_from_birth_date
           pinned_day=datetime.date(2026,10,21)
           def pinned_age(birth_date,fallback_age,as_of=None):
            return original_age(birth_date,fallback_age,as_of=pinned_day if as_of is None else as_of)
           sv.fractional_age_from_birth_date=pinned_age

           manifest=json.loads((source/'CAL24_Manifest.json').read_text())
           require(manifest['status']=='CAL24_V1R1_READ_ONLY_POST_CAL22_FULL_POOL_SHADOW','CAL24 status')
           require(manifest['production_files_mutated']==0 and manifest['pricing_changes_applied']==0,'CAL24 altered production')
           require(manifest['cal22_guard_key_count']==48 and manifest['players_covered']==565,'CAL24 scope')
           require(manifest['live_index_sha256']==digest(repo/'index.html'),'CAL24 candidate baseline index moved')
           require(manifest['generated_utc'].startswith('2026-10-21'),'CAL24 clock epoch moved')
           cal24=read_csv(source/'CAL24_565_Full_Pool_Post_CAL22_Shadow_READ_ONLY.csv')
           assert len(cal24)==565 and len(set(r['player'] for r in cal24))==565
           prior={r['player']:r for r in cal24}
           changed=read_csv(source/'CAL24_Rookie_30pct_Bounded_Review_READ_ONLY.csv')
           require(len(changed)==9 and all(r['cal24_review_action']=='REVIEW_BOUNDED_ROOKIE_PRIOR' for r in changed),'9 cases not frozen')
           rescue=read_csv(source/'CAL24_Rescue_and_Disagreement_Queue_READ_ONLY.csv')
           require(len(rescue)==97,'CAL24 queue has changed')
           live_cfg=sv.load_from_html(repo/'index.html')
           require(len(live_cfg['player_db'])==565 and len(live_cfg['cal22_keys'])==48,'Live model scope')
           live=sv.compute_all_values(live_cfg)
           require(set(live)==set(prior),'565 identity mismatch')
           errors=[(k,live[k]['value'],prior[k]['live_cal22_fv']) for k in live if live[k]['value']!=int(prior[k]['live_cal22_fv'])]
           require(not errors, 'Clock-pinned deployed CAL22 no longer exactly CAL24: '+repr(errors[:5]))

           cfg=copy.deepcopy(live_cfg)
           applied=[]
           # Bound raw inputs to exactly the owner-unapproved research scenario, rather than
           # accidentally applying unbounded prior raw increases as prices.
           for row in sorted(changed,key=lambda x:x['player']):
            key=row['player'];before=float(cfg['prod_mult'][key]);full=float(row['cal24_raw_sensitivity']);f=int(live[key]['value']);target=int(row['cal24_bounded_shadow_fv'])
            require(target>=f and full>=before and target<=int(row['cal24_unbounded_shadow_fv']),'invalid monotone proposal '+key)
            require(row['owner_feedback'] not in {'about_right','slightly_high','too_high'},'owner protected '+key)
            # Solver runs solely against the currently deployed, post-CAL22 Python FV implementation.
            lo,hi=before,full
            for iteration in range(36):
             mid=(lo+hi)/2
             cfg['prod_mult'][key]=mid
             val=int(sv.compute_all_values(cfg)[key]['value'])
             if val<=target:lo=mid
             else:hi=mid
            cfg['prod_mult'][key]=lo
            accepted=int(sv.compute_all_values(cfg)[key]['value'])
            require(f<=accepted<=target and target-accepted<=2,f'Exact bound unavailable for {key}: {accepted} vs {target}')
            applied.append({'player':key,'pos':live[key]['pos'],'owner_feedback':row['owner_feedback'],'old_raw':before,'new_raw':lo,'old_fv':f,'candidate_fv':accepted,'delta':accepted-f,'proposed_bound':target,'full_unbounded_shadow':row['cal24_unbounded_shadow_fv'],'not_approved':True})
           shadow=sv.compute_all_values(cfg)
           changed_ids={k for k in shadow if shadow[k]['value']!=live[k]['value']}
           require(changed_ids=={a['player'] for a in applied},f'Unexpected changed players {changed_ids.symmetric_difference({a["player"] for a in applied})}')
           require(sum(shadow[k]['value']-live[k]['value'] for k in shadow)<=1395,'Unexpected candidate delta')

           src=(repo/'index.html').read_text(encoding='utf-8')
           start=src.index('const PROD_MULT_DATA = {');end=src.index('};',start)
           block=src[start:end]
           for a in applied:
            pattern=re.compile(r"(?m)^([ ]*['\"]"+re.escape(a['player'])+r"['\"]\s*:\s*)([-+\d.eE]+)(,?)$")
            def replace(match):
             require(abs(float(match.group(2))-a['old_raw'])<=1e-10,'Raw literal baseline drift '+a['player'])
             return match.group(1)+format(a['new_raw'],'.12f')+match.group(3)
            block,n=pattern.subn(replace,block)
            require(n==1,'Live raw index literal must be unique '+a['player'])
           updated=src[:start]+block+src[end:]
           old_quote='fv_informed_estimate_cal15.json'
           require(updated.count(old_quote)==1,'Existing single quote file URL required')
           updated=updated.replace(old_quote,'fv_informed_estimate_cal25_shadow.json')
           cand=out/'candidate';cand.mkdir(exist_ok=True)
           (cand/'index.html').write_text(updated,encoding='utf-8')
           cfg2=sv.load_from_html(cand/'index.html')
           recalculated=sv.compute_all_values(cfg2)
           require(all(shadow[k]['value']==recalculated[k]['value'] for k in live),'Serialized FV parity not exact')
           board=fas.render_synced(updated,(repo/'free-agent-board.html').read_text(encoding='utf-8'))
           require(all(fas.parity_regions(updated,board).values()),'Free-agent board parity')
           (cand/'free-agent-board.html').write_text(board,encoding='utf-8')

           keys=sorted(shadow)
           aliases=build_alias_index(keys)
           def resolve(label):
            choices=aliases.get(normalize_name(str(label)),[])
            if not choices:return None
            best=min(v[1] for v in choices)
            opts={v[0] for v in choices if v[1]==best}
            return next(iter(opts)) if len(opts)==1 else None
           vote_rows,source_vote=market.load_vote_rows()
           ballots=[];skipped=collections.Counter()
           for row in vote_rows:
            tri=[resolve(row.get(f,'')) for f in ('keep','trade','cut')]
            if any(v is None for v in tri):skipped['unresolved']+=1;continue
            if len(set(tri))!=3:skipped['duplicate']+=1;continue
            ballots.append((str(row.get('voter_roster_id') or 'unknown'),*tri))
           voters=sorted({v for v,*_ in ballots})
           require(len(ballots)>=700 and len(voters)>=25,'Insufficient independent voter panel')
           voter_counts=collections.Counter(b[0] for b in ballots)
           def fit_ballots(fit_ballots):
            count=collections.Counter(b[0] for b in fit_ballots)
            idx={k:i for i,k in enumerate(keys)}
            wins=[];loss=[];wt=[]
            for voter,k,t,c in fit_ballots:
             w=min(1.,30./count[voter])*(1. if market.ktc_pipeline.is_league_voter(voter) else .5)
             for a,b in ((k,t),(k,c),(t,c)):
              wins.append(idx[a]);loss.append(idx[b]);wt.append(w)
            wins=np.asarray(wins,np.int64);loss=np.asarray(loss,np.int64);wt=np.asarray(wt)
            mu=np.log(np.asarray([max(1,int(shadow[k]['value'])) for k in keys],float))
            def fn(x):
             d=x[loss]-x[wins];e=expit(d)*wt;dev=x-mu
             val=float(np.dot(wt,np.logaddexp(0,d))+4*np.dot(dev,dev))
             grad=np.bincount(loss,weights=e,minlength=len(keys))-np.bincount(wins,weights=e,minlength=len(keys))+8*dev
             return val,grad
            res=minimize(fn,mu.copy(),jac=True,method='L-BFGS-B',options={'maxiter':350,'ftol':1e-12,'gtol':1e-8})
            require(res.success or np.max(np.abs(res.jac))<.002,'Bradley-Terry fit failed: '+str(res.message))
            require(np.isfinite(res.x).all(),'Nonfinite posterior')
            return np.floor(np.exp(res.x)+.5).astype(np.int64)
           fitted=fit_ballots(ballots)
           loo=np.stack([fit_ballots([b for b in ballots if b[0]!=v]) for v in voters])
           maxdiff=np.max(np.abs(loo-fitted[None,:]),axis=0)
           support=collections.defaultdict(list)
           for voter,k,t,c in ballots:
            for a in (k,t,c):support[a].append(voter)
           players={}
           for i,k in enumerate(keys):
            n=len(support[k]);nu=len(set(support[k]));fv=int(shadow[k]['value']);posterior=int(fitted[i])
            band='zero' if n==0 else 'thin_1_3' if n<=3 else 'developing_4_9' if n<=9 else '10_plus'
            if n==0:require(posterior==fv,'Zero vote anchor drift '+k)
            players[k]={'pos':shadow[k]['pos'],'fundamental_value':fv,'fv_informed_estimate':posterior,'ballot_appearances':n,'distinct_voters':nu,'evidence_band':band,'loo_max_abs_pct':round(100*int(maxdiff[i])/max(1,posterior),2)}
           vote_digest=hashlib.sha256(json.dumps(ballots,separators=(',',':')).encode()).hexdigest()
           old_quote=json.loads((repo/'scripts/artifacts/generated/fv_informed_estimate_cal15.json').read_text())
           quote_doc={'schema_version':1,'semantics':'fv_informed_preference_estimate_not_independent_market_price','display_only':True,'no_trading_math_changes':True,'fit_lambda':8,'method':'CAL25_shadow_exact_lambda8_FV_informed_BT_refit','pricing_accuracy_validated':False,'input_vote_sha256':vote_digest,'source_vote_sha_matches_cal15':vote_digest==old_quote['input_vote_sha256'],'as_of_date_utc':pinned_day.isoformat(),'counts':{'player_count':565,'voters':len(voters),'usable_ballots':len(ballots)},'players':players,'production_authorized':False}
           target_quote=cand/'scripts/artifacts/generated/fv_informed_estimate_cal25_shadow.json';target_quote.parent.mkdir(parents=True,exist_ok=True)
           out_json(target_quote,quote_doc)

           market.INDEX_PATH=cand/'index.html'
           new_mv=market.build_payload()
           market.validate_payload(new_mv)
           require(len(new_mv['players'])>=450,'Market source coverage lost')
           for k,m in new_mv['players'].items():
            require(int(m['fundamental_value'])==int(shadow[k]['value']),'Market anchor disagrees with shadow '+k)
           market_target=cand/'scripts/artifacts/generated/market_values.json';out_json(market_target,new_mv)
           old_mv=json.loads((repo/'scripts/artifacts/generated/market_values.json').read_text())

           joined=[];peer=[];owners={'fernando mendoza','sonny styles','kc concepcion','kenyon sadiq','bijan robinson','malik davis','ashton jeanty','ty simpson','dj giddens','malik willis'}
           for k in keys:
            c=prior[k];v=shadow[k]['value'];p=players[k];m=new_mv['players'].get(k);old=old_mv['players'].get(k)
            row={'player':k,'position':shadow[k]['pos'],'role':shadow[k]['role'],'live_fv_pinned':live[k]['value'],'candidate_fv':v,'fv_change':v-live[k]['value'],
             'stored_votes':int(old_quote['players'][k]['fv_informed_estimate']),'new_refitted_votes':p['fv_informed_estimate'],'new_votes_minus_stored':p['fv_informed_estimate']-int(old_quote['players'][k]['fv_informed_estimate']),
             'vote_unique':p['distinct_voters'],'vote_band':p['evidence_band'],'stored_mv':old.get('market_value') if old else '',
             'candidate_market_value':m['market_value'] if m else '',
             'candidate_market_fv_anchor':m['fundamental_value'] if m else '',
             'owner_feedback':c['owner_feedback'],'cal24_research_action':c['cal24_review_action'],
             'in_97_person_disagreement_queue':k in {q['player'] for q in rescue},
             'retired_exclude_trade':k=='joe mixon',
             'review_not_authorized':True}
            joined.append(row)
            if shadow[k]['pos']=='LB':peer.append(row)
           save_csv(out/'CAL25_All_565_Synchronized_Research_Shadow.csv',joined)
           save_csv(out/'CAL25_Elite_LB_Peer_Context.csv',sorted(peer,key=lambda r:-r['candidate_fv']))
           save_csv(out/'CAL25_Nine_Bounded_Prospect_Scenario.csv',applied)
           save_csv(out/'CAL25_97_Disagreement_Queue_With_Rebuilt_Companions.csv',[r for r in joined if r['in_97_person_disagreement_queue']])

           files={'candidate/index.html':digest(cand/'index.html'),'candidate/free-agent-board.html':digest(cand/'free-agent-board.html'),'candidate/scripts/artifacts/generated/fv_informed_estimate_cal25_shadow.json':digest(target_quote),'candidate/scripts/artifacts/generated/market_values.json':digest(market_target)}
           result={'status':'PASS_CAL25_FROZEN_DATE_FULL_POOL_RESEARCH_ONLY','production_authorized':False,'deployment_authorized':False,'source_cal24_green_run':39544494023,'source_cal24_zip_not_required':True,'source_manifest_sha256':digest(source/'CAL24_Manifest.json'),'source_cal24_live_index_sha256':manifest['live_index_sha256'],'as_of_date_utc':pinned_day.isoformat(),
           'player_count':len(joined),'fv_changed_count':len(changed_ids),'nine_provisional_total_fv_delta':sum(a['delta'] for a in applied),
           'quote_player_count':len(players),'market_player_count':len(new_mv['players']), 'vote_voters':len(voters),'vote_usable_ballots':len(ballots),
           'vote_digest':vote_digest,'vote_source_matches_cal15':quote_doc['source_vote_sha_matches_cal15'],'prior_50_rb_quote_mismatch':manifest['live_fv_vs_quote_embedded_fundamental_differences'],
           'current_stored_mv_anchor_disagreements':sum(1 for k,r in old_mv['players'].items() if k in shadow and r['fundamental_value']!=shadow[k]['value']),
           'new_quote_fv_anchor_disagreements':sum(1 for k in keys if players[k]['fundamental_value']!=shadow[k]['value']),
           'new_mv_fv_anchor_disagreements':sum(1 for k in new_mv['players'] if new_mv['players'][k]['fundamental_value']!=shadow[k]['value']),
           'candidate_files_sha256':files,'cal24_disagreement_queue_count':len(rescue),'owner_labels_are_diagnostics_not_target':True,
           'market_value_independent_not_price_target':True,'unseen_week7_validation_completed':False,'run_result_cannot_be_applied':True,
           'frozen_asof_date_must_be_enforced_in_live_runtime_before_release':True,
           'model_note':'Nine candidate FV increases are CAL24 sensitivity caps, not proven economically optimal. Refit quotes use current voter panel; MV uses existing separate build policy. No price publish/approval.'}
           require(result['new_quote_fv_anchor_disagreements']==0 and result['new_mv_fv_anchor_disagreements']==0,'Internal companion mismatch')
           out_json(out/'CAL25_Manifest.json',result)
           lines=['# CAL25 V1R1 — Exact full-pool synchronized companion research','',
           '**READ ONLY. All prices here are candidate diagnostics, never a deployment approval.**','',
           f'- 565 player valuations replayed against CAL22 at frozen **{pinned_day}** source clock.',
           f'- Exactly {len(changed_ids)} bounded prospect scenarios with +{result["nine_provisional_total_fv_delta"]} total FV (unapproved).',
           f'- FV+Votes recalculated for all 565 with λ=8 from {len(ballots)} ballots, {len(voters)} unique voters, full leave-one-voter-out refits.',
           f'- Market Value separately rebuilt for {len(new_mv["players"])} from its existing policy, not calibrated to FV.',
           '- All new quote/MV fundamental anchors match candidate FV; original quote RB time drift remains documented.',
           '- Retired Joe Mixon remains audit-only and excluded from trade suggestions.','',
           '## Owner anchors','',
           '| Player | Live FV | Shadow FV | New FV+Votes | New MV | Owner feedback |','|---|---:|---:|---:|---:|---|']
           for row in joined:
            if row['player'] in owners:
             lines.append(f"| {row['player'].title()} | {row['live_fv_pinned']:,} | {row['candidate_fv']:,} | {row['new_refitted_votes']:,} | {row['candidate_market_value']} | {row['owner_feedback']} |")
           lines+=['','## Promotion rule','',
           'No auto-apply. This only demonstrates a mechanically coherent hypothetical price set. Resolve the 7 drift cases, elite-LB comparables, and missing cross-position pricing evidence before proposing a production candidate. A new owner-reviewed release needs a stable FV clock, refreshed independent quotes and MV, and repository regression verification.','']
           (out/'CAL25_Review.md').write_text('\n'.join(lines),encoding='utf-8')
           print(json.dumps({k:result[k] for k in ('status','player_count','fv_changed_count','nine_provisional_total_fv_delta','quote_player_count','market_player_count','vote_voters','vote_usable_ballots','new_quote_fv_anchor_disagreements','new_mv_fv_anchor_disagreements')},indent=2))

          if __name__=='__main__':
           a=argparse.ArgumentParser();a.add_argument('--repo',required=True);a.add_argument('--source',required=True);a.add_argument('--out',required=True);z=a.parse_args();main(z.repo,z.source,z.out)
          PY_CAL25
          python3 -m py_compile "${RUNNER_TEMP}/cal25_shadow.py"
      - name: Build complete research-only 565-player companion candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/snapshot_values.py --selftest
          python3 "${RUNNER_TEMP}/cal25_shadow.py" --repo . --source "${RUNNER_TEMP}/cal25-cal24" --out "${RUNNER_TEMP}/cal25-research"
      - name: Independently verify all research outputs and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAL25_AUDIT'
          import csv,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'cal25-research'
          c=json.loads((root/'CAL25_Manifest.json').read_text())
          assert c['status']=='PASS_CAL25_FROZEN_DATE_FULL_POOL_RESEARCH_ONLY'
          assert c['production_authorized'] is False and c['deployment_authorized'] is False
          assert c['player_count']==565 and c['quote_player_count']==565
          assert c['fv_changed_count']==9 and c['nine_provisional_total_fv_delta']<=1395
          assert c['new_quote_fv_anchor_disagreements']==0 and c['new_mv_fv_anchor_disagreements']==0
          assert c['cal24_disagreement_queue_count']==97
          for rel,want in c['candidate_files_sha256'].items():
              got=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert got==want,(rel,'candidate artifact SHA drift')
          q=json.loads((root/'candidate/scripts/artifacts/generated/fv_informed_estimate_cal25_shadow.json').read_text())
          m=json.loads((root/'candidate/scripts/artifacts/generated/market_values.json').read_text())
          with (root/'CAL25_All_565_Synchronized_Research_Shadow.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==565
          assert len({x['player'] for x in rows})==565
          assert len(q['players'])==565 and len(m['players'])==c['market_player_count']
          assert all(q['players'][r['player']]['fundamental_value']==int(r['candidate_fv']) for r in rows)
          assert all(m['players'][k]['fundamental_value']==q['players'][k]['fundamental_value'] for k in m['players'])
          assert len([r for r in rows if int(r['fv_change'])!=0])==9
          assert all(r['candidate_fv']==r['live_fv_pinned'] for r in rows if r['owner_feedback'] in ('about_right','slightly_high','too_high'))
          assert all(r['retired_exclude_trade']=='True' for r in rows if r['player']=='joe mixon')
          print('CAL25 independently verified 565/565 synchronized FV+Votes and MV anchors; 9 diagnostic changes; zero release authority.')
          PY_CAL25_AUDIT
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'CAL25 READ-ONLY PASS: working tree untouched and no production changes' >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/cal25-research/CAL25_Review.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish independent research artifact (even on failed tests)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cal25-v1r1-565-fv-votes-mv-refit-research-READ-ONLY
          path: ${{ runner.temp }}/cal25-research/
          if-no-files-found: warn
          retention-days: 30
