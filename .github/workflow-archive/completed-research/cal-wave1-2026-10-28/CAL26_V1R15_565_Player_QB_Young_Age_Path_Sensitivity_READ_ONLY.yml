name: CAL26 V1R15 - 565 Player QB Young Age Path Mechanism Sensitivity READ ONLY
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cal26-v1r15-qb-age-readonly-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  qb_youth_age_readonly:
    name: Independent post-V1R14 565-player parity, 64 QBs, 15 approved anchors and 18 accepted controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout current main without write credentials
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
        fetch-depth: 1
    - name: Install canonical Python standard-library evaluator
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Sanity check live price evaluator and free-agent sync
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py index.html --selftest

        python3 scripts/sync/sync_free_agent_valuation.py --check

        '
    - name: Materialize isolated 565-player QB diagnostic engine
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/cal26_v1r15_engine.py\" <<'PY_CAL26_V1R15'\n#!/usr/bin/env python3\n\"\"\"CAL26 V1R15: production-parity young QB age-path diagnostic, READ ONLY.\n\nThis is NOT an authorization to change FV, rerun a frozen calibration or infer fair\nprices from qualitative owner ratings. Uses live canonical price evaluator.\n\"\"\"\nfrom __future__ import annotations\nimport argparse,csv,datetime,hashlib,json,math,sys\nfrom collections import Counter\nfrom pathlib import Path\n\nEXPECTED_15 = {\n  'breece hall':5336,'brian branch':3436,'derrick henry':4112,\n  'fred warner':5071,'jahmyr gibbs':9497,'jaxson dart':5091,\n  'jeremiyah love':5015,'jonathan taylor':6025,'marvin harrison':4207,\n  'nik bonitto':4919,'patrick mahomes':5756,'roquan smith':5188,\n  'tetairoa mcmillan':5252,'trevor lawrence':6509,'trey mcbride':5823,\n}\nACCEPTED_18 = {\n  'daniel jones','devin lloyd','dj giddens','george karlaftis',\n  'jack campbell','jake ferguson','jamien sherwood','kenny\
        \ gainwell',\n  'luther burden','malik davis','malik willis','puka nacua',\n  'quay walker','quentin lake','tj watt','trevon moehrig',\n  'tuli tuipulotu','zack baun'\n}\nRATINGS={\n 'brock purdy':(4902,5736,'Too Low'),\n 'caleb williams':(5021,5875,'Too Low'),\n 'drake maye':(4933,5771,'Too Low'),\n 'josh allen':(6578,7697,'Too Low'),\n 'lamar jackson':(5240,6131,'Too Low'),\n 'jaxson dart':(4351,5091,'Correct'),\n 'trevor lawrence':(5563,6509,'Correct'),\n 'bo nix':(5341,6249,'Too High'),\n 'dak prescott':(5489,6422,'Too High'),\n 'jalen hurts':(5637,6596,'Too High'),\n 'jared goff':(5071,5932,'Too High'),\n 'justin herbert':(5296,6197,'Too High'),\n}\n# Scenario values are *research sensitivities*; no coefficient is being fitted.\nAGE_FLOORS=(1.00,1.05,1.10,1.15)\n\n\ndef ensure(c,msg):\n if not c:raise AssertionError('CAL26_V1R15_'+msg)\ndef sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()\ndef write_csv(path,rows,fields):\n with Path(path).open('w',encoding='utf-8',newline='')\
        \ as f:\n  w=csv.DictWriter(f,fieldnames=fields,extrasaction='raise');w.writeheader();w.writerows(rows)\ndef eligible(r):\n return (r['pos']=='QB' and r['age']<=25 and r['prod_mult']>=0.60\n    and r['has_real_prod_data'] and not r['no_real_production_history'])\ndef money(v):return f'{v:,}'\n\n\ndef run(repo,out,snapshot_override=None):\n repo=Path(repo);out=Path(out);out.mkdir(parents=True,exist_ok=True)\n index=repo/'index.html';board=repo/'free-agent-board.html'\n sys.path.insert(0,str(repo/'scripts'/'validation'))\n sys.path.insert(0,str(repo/'scripts'/'sync'))\n if snapshot_override:sys.path.insert(0,str(Path(snapshot_override).parent))\n import snapshot_values as sv\n # Sync source check is run on live repo; small test fixture may not have it.\n try:\n  import sync_free_agent_valuation as sync\n except ImportError:\n  sync=None\n conf=sv.load_from_html(index);live=sv.compute_all_values(conf)\n ensure(len(live)==565 and len(set(live))==565,'565_UNIQUE_REQUIRED')\n ensure(sum(r['pos']=='QB'\
        \ for r in live.values())==64,'64_QBS_REQUIRED')\n ensure(len(conf['cal26_fv_owner_anchors'])==15,'15_OWNER_FV_ANCHORS_REQUIRED')\n ensure({k:int(v) for k,v in conf['cal26_fv_owner_anchors'].items()}==EXPECTED_15,'OWNER_ANCHOR_DRIFT')\n ensure(all(k in live for k in ACCEPTED_18),'18_ACCEPTED_CONTROLS_MISSING')\n ensure(set(RATINGS)<=set(live),'12_QB_OWNER_FEEDBACK_MISSING')\n for k, (old,test,label) in RATINGS.items():\n  ensure(live[k]['pos']=='QB','QB_FEEDBACK_CHANGED_POSITION_'+k)\n  if label=='Correct':ensure(live[k]['value']==test,'CORRECT_QB_ANCHOR_NOT_LIVE_'+k)\n  else:ensure(live[k]['value']==old,'OWNER_QB_SOURCE_LIVE_VALUE_DRIFT_'+k)\n ensure(live['jaxson dart']['value']==5091 and live['trevor lawrence']['value']==6509,'TWO_APPROVED_QB_PRICES_DRIFT')\n if sync:\n  idx=index.read_text(encoding='utf-8');brd=board.read_text(encoding='utf-8')\n  ensure(sync.render_synced(idx,brd)==brd and all(sync.parity_regions(idx,brd).values()),'CANONICAL_FV_FREE_AGENT_PARITY')\n \n # Only\
        \ for context, never a price target: older MV snapshots often have stale FV references.\n mv_path=repo/'scripts/artifacts/generated/market_values.json'\n market=json.loads(mv_path.read_text(encoding='utf-8')) if mv_path.exists() else {}\n mplayers=market.get('players',{})\n current={k:v['value'] for k,v in live.items()}\n price_rows=[{\n  'player':k,'position':v['pos'],'age':v['age'],'role':v['role'],\n  'current_fv':v['value'],'approved_exact_anchor':str(k in EXPECTED_15),\n  'accepted_owner_control':str(k in ACCEPTED_18),\n } for k,v in sorted(live.items())]\n write_csv(out/'CAL26_V1R15_All_565_Production_Baseline.csv',price_rows,list(price_rows[0]))\n \n qb_rows=[]\n for k,v in sorted(live.items()):\n  if v['pos']!='QB':continue\n  mr=mplayers.get(k,{})\n  old,test,label=RATINGS.get(k,('','','Not Reviewed'))\n  qb_rows.append({\n   'player':k,'age':v['age'],'role':v['role'],'fv':v['value'],\n   'production_multiplier':v['prod_mult'],'age_multiplier':v['age_mult'],\n   'has_real_production':str(v['has_real_prod_data']),\n\
        \   'no_history_flag':str(v['no_real_production_history']),\n   'age_path_candidate':str(eligible(v)),\n   'existing_fv_anchor':str(k in EXPECTED_15),\n   'owner_17pct_test':test,'owner_test_rating':label,\n   'market_rank_diagnostic_only':mr.get('market_rank',''),\n   'market_value_diagnostic_only':mr.get('market_value',''),\n   'market_stored_fv_stale':str(mr.get('fundamental_value')!=v['value']) if mr else '',\n  })\n write_csv(out/'CAL26_V1R15_All_64_QB_Mechanism_Diagnostics.csv',qb_rows,list(qb_rows[0]))\n \n # Test age factor *only* for proven under-26 QBs with substantial production,\n # preserving fixed owner prices. The original FV formula remains untouched.\n experiments=[];stage_rows=[]\n for flo in AGE_FLOORS:\n  vals=dict(current); moved=[]\n  for k,v in live.items():\n   if not eligible(v) or k in EXPECTED_15:continue\n   proposed_age=max(float(v['age_mult']),flo)\n   val=math.floor(100*conf['position_weight']['QB']*proposed_age*v['prod_mult']*55+0.5)\n   if val!=current[k]:\n\
        \    vals[k]=val;moved.append(k)\n  ensure(all(vals[k]==current[k] for k in (set(EXPECTED_15)|ACCEPTED_18)),'OWNER_CONTROL_MOVED')\n  ensure(all(vals[k]==current[k] for k,v in live.items() if v['pos']!='QB'),'NON_QB_PRICE_MOVED')\n  ensure(all(vals[k]==current[k] for k,v in live.items() if not eligible(v)),'INELIGIBLE_QB_MOVED')\n  low_met=sum(vals[k]>test for k,(old,test,label) in RATINGS.items() if label=='Too Low')\n  high_raised=sum(vals[k]!=current[k] for k,(old,test,label) in RATINGS.items() if label=='Too High')\n  correct_changed=sum(vals[k]!=current[k] for k,(old,test,label) in RATINGS.items() if label=='Correct')\n  low_still_short=[k for k,(old,test,label) in RATINGS.items() if label=='Too Low' and vals[k]<=test]\n  experiments.append({\n   'mechanism':'QB_PROVEN_UNDER26_AGE_FLOOR_SENSITIVITY','hypothetical_age_floor':flo,\n   'modified_player_count':len(moved),'aggregate_fv_delta':sum(vals[k]-current[k] for k in vals),\n   'v1r13_too_low_test_bounds_crossed_of_5':low_met,\n\
        \   'v1r13_too_high_rated_players_moved_of_5':high_raised,\n   'v1r13_correct_rated_players_moved_of_2':correct_changed,\n   'unreviewed_QBs_moved':sum(k not in RATINGS for k in moved),\n   'unreviewed_QBs_moved_names':';'.join(k for k in moved if k not in RATINGS),\n   'owner_approved_15_changed':0,'owner_accepted_18_changed':0,\n   'all_other_565_prices_preserved_except_selected_QBs':True,\n   'production_change_authorized':False,\n  })\n  for k,v in sorted(live.items()):\n   if v['pos']!='QB':continue\n   old,test,label=RATINGS.get(k,('','','Not Reviewed'))\n   stage_rows.append({\n    'hypothetical_age_floor':flo,'player':k,'age':v['age'],'role':v['role'],\n    'production_multiplier':v['prod_mult'],'original_age_multiplier':v['age_mult'],\n    'current_fv':v['value'],'hypothetical_fv':vals[k],\n    'hypothetical_delta':vals[k]-current[k],\n    'owner_17pct_test':test,'owner_17pct_rating':label,\n    'v1r13_low_test_exceeded':str(vals[k]>test) if label=='Too Low' else '',\n \
        \   'explicit_owner_price_anchor':str(k in EXPECTED_15),'production_authorized':False\n   })\n write_csv(out/'CAL26_V1R15_Young_QB_Age_Path_Sensitivity.csv',stage_rows,list(stage_rows[0]))\n write_csv(out/'CAL26_V1R15_Young_QB_Exposure_Summary.csv',experiments,list(experiments[0]))\n \n holds=[]\n for k,(old,test,label) in RATINGS.items():\n  if label=='Correct':continue\n  vals={str(flo):next(x['hypothetical_fv'] for x in stage_rows if x['player']==k and x['hypothetical_age_floor']==flo) for flo in AGE_FLOORS}\n  holds.append({'player':k,'current_fv':current[k], 'prior_17pct_test_fv':test,'owner_rating':label,\n   'owner_constraint':'fair value greater than test price' if label=='Too Low' else 'fair value lower than test price',\n   'hypothetical_youth_age_floor_1_10':vals['1.1'],\n   'scenario_change_would_require_owner_approval':True})\n write_csv(out/'CAL26_V1R15_Remaining_10_QB_Feedback_Holds.csv',holds,list(holds[0]))\n \n stat={\n  'status':'PASS_CAL26_V1R15_YOUNG_QB_AGE_PATH_DIAGNOSTIC_READ_ONLY',\n\
        \  'method':'synthetic_early_QB_age_floor_sensitivity_not_optimized_to_owner_labels',\n  'production_source_index_sha256':sha(index),'production_source_board_sha256':sha(board),\n  'canonical_python_evaluator_sha256':sha(Path(sv.__file__)),\n  'run_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),\n  'live_player_count':565,'live_qb_count':64,'approved_exact_price_count':15,'accepted_original_price_controls':18,\n  'owner_feedback_count':12,'owner_feedback_counts':dict(Counter(x[2] for x in RATINGS.values())),\n  'existing_owner_approved_15_unchanged':True,'existing_accepted_18_unchanged':True,\n  'market_evidence_timestamp':market.get('generated_at_utc'),\n  'market_evidence_is_diagnostic_only':True,\n  'model_coefficients_modified':False,'production_files_written':0,'production_authorized':False,\n  'scenario_summary':experiments,\n  'limitations':['Qualitative feedback bounds do not identify fair target prices.',\n    'The 12 feedback players are not a random or independent\
        \ calibration sample.',\n    'The hypothesized proven-QB eligibility threshold and age floors are exploratory.',\n    'Old market ratings may be vote-biased or FV-stale and were not used to fit parameters.',\n    'Age-path correction does not address Josh Allen, Lamar Jackson or Brock Purdy.'],\n }\n (out/'CAL26_V1R15_Manifest.json').write_text(json.dumps(stat,indent=2,sort_keys=True)+'\\n',encoding='utf-8')\n lines=[\n  '# CAL26 V1R15 \u2014 QB price mechanism diagnosis (read-only)','',\n  '**No production FV or model changes.** Evaluated the 2026 live post-V1R14 565-player universe and 64 quarterbacks.','',\n  '## What actually drives the youngest reviewed QB FV', '',\n  '| Player | Current FV | Age | Effective age factor | Production factor | Owner-rated 17% test | Rating |',\n  '|---|---:|---:|---:|---:|---:|---|',\n ]\n for k in ['caleb williams','drake maye','jaxson dart','brock purdy','josh allen','lamar jackson','jalen hurts','bo nix']:\n  v=live[k];old,t,label=RATINGS[k]\n\
        \  lines.append(f\"| {k.title()} | {money(v['value'])} | {v['age']} | {v['age_mult']:.3f} | {v['prod_mult']:.3f} | {money(t)} | {label} |\")\n lines+=['','## Experimental under-26 age-path pricing scenarios','',\n '| Age floor | QBs moved | Total hypothetical FV increase | Low 17% test bounds exceeded | Unreviewed QBs moved | Correct/Too High QBs moved |',\n '|---:|---:|---:|---:|---:|---:|']\n for x in experiments:\n  lines.append(f\"| {x['hypothetical_age_floor']:.2f} | {x['modified_player_count']} | +{money(x['aggregate_fv_delta'])} | {x['v1r13_too_low_test_bounds_crossed_of_5']}/5 | {x['unreviewed_QBs_moved']} | {x['v1r13_correct_rated_players_moved_of_2']+x['v1r13_too_high_rated_players_moved_of_5']} |\")\n lines += [\n  '', 'Eligible cohort is **QB age 25 or younger with real production and effective production multiplier >=0.60**, excluding all existing owner-approved exact prices. This is a *hypothesis*, not a validated new rule. Changes to other eligible QBs beyond the user-rated\
        \ cohort remain subject to review.',\n  '', '## Decision', '',\n  '1. Age ramp provides one mechanically credible reason Caleb Williams and Drake Maye trail the owner-rejected test prices. It does not identify their exact fair prices.',\n  '2. Josh Allen, Lamar Jackson and Brock Purdy are not in the age-25-and-under cohort; the other three Low ratings remain unresolved by this mechanism.',\n  '3. Bo Nix, Dak Prescott, Jalen Hurts, Jared Goff and Justin Herbert were previously rated Too High at a **+17% test price**, not necessarily at their current live FV.',\n  '4. Preserve the 15 approved FV prices and 18 accepted owner controls. No general QB premium or automatic production promotion.',\n  '5. Next research should evaluate multi-year projection and independent dynasty ranking evidence for veteran and established QBs, not fit five arbitrary named-player exceptions.',\n  '', 'Historical market evidence is included only as a diagnostic; stored source FV may lag current approved exact\
        \ prices. It is **not** used as a training target.',\n ]\n (out/'CAL26_V1R15_Review.md').write_text('\\n'.join(lines)+'\\n',encoding='utf-8')\n print(json.dumps({'status':stat['status'],'players':565,'qbs':64,\n  'scenario_summaries':experiments},sort_keys=True))\n return stat\n\nif __name__=='__main__':\n p=argparse.ArgumentParser();p.add_argument('--repo',default='.');p.add_argument('--out',required=True);p.add_argument('--snapshot-override')\n a=p.parse_args();run(a.repo,a.out,a.snapshot_override)\nPY_CAL26_V1R15\npython3 - <<'PY_AST'\nimport ast,os,pathlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'cal26_v1r15_engine.py'\nast.parse(p.read_text())\nprint('PASS isolated CAL26 V1R15 engine syntax')\nPY_AST\n"
    - name: Produce all 64-QB mechanism diagnostics and 565-player parity receipt
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/cal26_v1r15_engine.py" --repo . --out "$RUNNER_TEMP/cal26-v1r15-output"

        '
    - name: Independently verify candidate impact, 12 feedback bounds, and no production writes
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_INDEPENDENT'\nimport csv,json,os,hashlib,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'cal26-v1r15-output'\nget=lambda name:list(csv.DictReader((root/name).open(newline='',encoding='utf-8')))\nm=json.loads((root/'CAL26_V1R15_Manifest.json').read_text())\nassert m['status']=='PASS_CAL26_V1R15_YOUNG_QB_AGE_PATH_DIAGNOSTIC_READ_ONLY'\nassert (m['live_player_count'],m['live_qb_count'],m['approved_exact_price_count'],m['accepted_original_price_controls'])==(565,64,15,18)\nassert m['owner_feedback_counts']=={'Correct':2,'Too High':5,'Too Low':5}\nassert m['model_coefficients_modified'] is False and m['production_files_written']==0 and m['production_authorized'] is False\nbase=get('CAL26_V1R15_All_565_Production_Baseline.csv')\nqb=get('CAL26_V1R15_All_64_QB_Mechanism_Diagnostics.csv')\nshadow=get('CAL26_V1R15_Young_QB_Age_Path_Sensitivity.csv')\nex=get('CAL26_V1R15_Young_QB_Exposure_Summary.csv')\nheld=get('CAL26_V1R15_Remaining_10_QB_Feedback_Holds.csv')\n\
        assert len(base)==565 and len({x['player'] for x in base})==565\nassert len(qb)==64 and len({x['player'] for x in qb})==64\nassert len(shadow)==64*4 and len(ex)==4 and len(held)==10\nassert sum(x['approved_exact_anchor']=='True' for x in base)==15\nassert sum(x['accepted_owner_control']=='True' for x in base)==18\nassert {x['hypothetical_age_floor'] for x in ex}=={'1.0','1.05','1.1','1.15'}\nfor e in ex:\n assert e['owner_approved_15_changed']=='0' and e['owner_accepted_18_changed']=='0'\n assert e['v1r13_too_high_rated_players_moved_of_5']=='0'\n assert e['v1r13_correct_rated_players_moved_of_2']=='0'\n assert e['production_change_authorized']=='False'\n assert int(e['modified_player_count'])==4\nbefore={x['player']:int(x['current_fv']) for x in base}\nfor x in shadow:\n assert before[x['player']]==int(x['current_fv'])\n if x['explicit_owner_price_anchor']=='True':assert int(x['hypothetical_delta'])==0\nassert m['production_source_index_sha256']==hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest()\n\
        assert m['production_source_board_sha256']==hashlib.sha256(pathlib.Path('free-agent-board.html').read_bytes()).hexdigest()\nprint('PASS 565/64/12/15/18 complete, 4 price-neutral-protected experimental cohorts, no released changes')\nPY_INDEPENDENT\n\ntest -z \"$(git status --porcelain --untracked-files=all)\"\ncat \"$RUNNER_TEMP/cal26-v1r15-output/CAL26_V1R15_Review.md\" >> \"$GITHUB_STEP_SUMMARY\"\necho 'Research only: no price deployment or model calibration approved.' >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload full-price baseline, QB exposures, held ratings and manifest
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: CAL26-V1R15-565-Young-QB-Age-Mechanism-Diagnostics-READ-ONLY
        path: ${{ runner.temp }}/cal26-v1r15-output/
        if-no-files-found: warn
        retention-days: 30
