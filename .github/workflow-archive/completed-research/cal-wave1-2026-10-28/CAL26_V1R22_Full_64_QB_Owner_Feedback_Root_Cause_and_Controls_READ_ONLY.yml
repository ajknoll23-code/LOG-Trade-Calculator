          #!/usr/bin/env python3
          """CAL26 V1R22: reproducible 64-QB owner-feedback descriptive driver audit.
          
          No fitting, repricing, production deployment, or new model selection.
          """
          import argparse,csv,hashlib,io,json,statistics
          from collections import Counter,defaultdict
          from pathlib import Path
          
          EXPECTED_FROZEN_INDEX_SHA='6ff8fcef45c1bb7f688ae6be52ec1a0d620d33706b4acbc7ece1bc13874ac6e9'
          SOURCE_RUN_20=39828172108
          SOURCE_RUN_21=39829914089
          NEEDED=['player','age','role','baseline_fv','effective_production_mult','age_multiplier','production_provenance','age_penalty_points_without_anchor','is_owner_protected','half_relief_delta']
          VALID={'Too low','Correct','Too high'}
          
          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def require(flag,code):
              if not flag:raise AssertionError(code)
          def readcsv(path):
              with Path(path).open(newline='',encoding='utf-8-sig') as f:return list(csv.DictReader(f))
          def writecsv(path,rows):
              require(len(rows)>0,'EMPTY_CSV_'+str(path))
              with Path(path).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          def key(name):return ''.join(ch for ch in str(name).lower() if ch.isalnum())
          def readsrc(source,name):
              files=list(Path(source).rglob(name));require(len(files)==1,'SOURCE_FILE_NOT_UNIQUE_'+name)
              return files[0]
          def pct(v,others):
              if not others:return None
              return round(sum(x<v for x in others)/len(others)*100,1)
          def fmt(x,n=4):return '' if x is None else round(x,n)
          def label_signal(r):
              # Hypothesis flags, not judgments that an owner label is correct.
              reasons=[]
              if r['owner_rating']=='Too low' and r['age_mult']<0.995:reasons.append('YOUNG_OR_OLD_AGE_DISCOUNT_REVIEW')
              if r['owner_rating']=='Too high' and r['no_history_flag']:reasons.append('ROLE_PRIOR_WITH_NO_REAL_HISTORY_REVIEW')
              if r['owner_rating']=='Too low' and r['no_history_flag']:reasons.append('PROSPECT_PRIOR_OR_OPPORTUNITY_MISSING_REVIEW')
              if r['owner_rating']=='Too high' and r['age_mult']>=0.995:reasons.append('NOT_EXPLAINED_BY_AGE_DISCOUNT')
              if r['ppg_rank_gap'] is not None and r['ppg_games']>=3:
                  if r['owner_rating']=='Too low' and r['ppg_rank_gap']>=15:reasons.append('SIX_WEEK_PPG_SUPPORTS_REVIEW_DIRECTION_DESCRIPTIVE')
                  if r['owner_rating']=='Too high' and r['ppg_rank_gap']<=-15:reasons.append('SIX_WEEK_PPG_SUPPORTS_REVIEW_DIRECTION_DESCRIPTIVE')
                  if r['owner_rating']=='Correct' and abs(r['ppg_rank_gap'])>=25:reasons.append('CONTROL_CURRENT_FORM_DISAGREEMENT_DESCRIPTIVE')
              if r['market_parity']!='MATCH':reasons.append('MARKET_QUOTE_MISSING_OR_STALE')
              if r['ballots']<=3:reasons.append('VOTES_TOO_THIN_FOR_PRICING')
              return ';'.join(reasons) or 'NO_CLEAR_SINGLE_DRIVER'
          
          def main(repo,src20,src21,feedback,out):
              repo,src20,src21,feedback,out=map(Path,(repo,src20,src21,feedback,out));out.mkdir(parents=True,exist_ok=True)
              owners=readcsv(feedback)
              require(len(owners)==64,'FEEDBACK_NOT_64')
              require(len({key(x['player']) for x in owners})==64,'FEEDBACK_DUPLICATES')
              counts=Counter(x['owner_rating'] for x in owners)
              require(counts=={'Too low':22,'Correct':24,'Too high':18},'OWNER_FEEDBACK_COUNTS_CHANGED')
              require(all(x['owner_rating'] in VALID for x in owners),'UNRECOGNIZED_OWNER_RATING')
              p20=readsrc(src20,'CAL26_V1R20_64_QB_Component_Attribution_and_Scenarios.csv')
              p20m=readsrc(src20,'CAL26_V1R20_Manifest.json')
              m20=json.loads(p20m.read_text());require(m20['players']==565 and m20['qbs']==64,'V1R20_WRONG_UNIVERSE')
              require(m20['baseline_price_parity_players']==565 and m20['owner_anchors_protected']==15 and m20['accepted_controls_protected']==18,'V1R20_PROTECTION_DRIFT')
              require(m20['canonical_index_sha256']==EXPECTED_FROZEN_INDEX_SHA,'V1R20_INDEX_PIN_DRIFT')
              require(m20['status']=='PASS_CAL26_V1R20_READ_ONLY_QB_DRIVER_DIAGNOSTIC','V1R20_SOURCE_NOT_GREEN')
              require(m20['files'][p20.name]==sha(p20),'V1R20_PINNED_SOURCE_DIGEST_MISMATCH')
              p21=readsrc(src21,'CAL26_V1R21_64_QB_Evidence_Review_READ_ONLY.csv')
              p21m=readsrc(src21,'CAL26_V1R21_Manifest.json')
              m21=json.loads(p21m.read_text());require(m21['source_run']==SOURCE_RUN_20,'V1R21_WRONG_PARENT')
              require(m21['baseline_index_sha256']==EXPECTED_FROZEN_INDEX_SHA,'V1R21_INDEX_PIN_DRIFT')
              require(m21['files'][p21.name]==sha(p21),'V1R21_PINNED_SOURCE_DIGEST_MISMATCH')
              old={key(x['player']):x for x in readcsv(p20)}
              market={key(x['player']):x for x in readcsv(p21)}
              require(set(old)=={key(x['player']) for x in owners}==set(market),'SOURCE_IDENTITY_MISMATCH')
              # Frozen, descriptive realized Weeks 1-6 outcomes; never post-hoc retune an existing candidate.
              refs={
                'opportunity':repo/'research/opportunity-v2/opportunity_v2_phase5_evaluation.json',
                'no_history':repo/'research/no-history-v2/no_history_v2_phase3_evaluation.json',
                'production':repo/'research/production-v2/production_v2_phase9_evaluation.json',
                'index':repo/'index.html',
              }
              for p in refs.values():require(p.is_file(),'MISSING_RESEARCH_SOURCE_'+str(p))
              opportunity=json.loads(refs['opportunity'].read_text());nohist=json.loads(refs['no_history'].read_text());prod=json.loads(refs['production'].read_text())
              for obj,description in [(opportunity,'OPPORTUNITY'),(nohist,'NO_HISTORY'),(prod,'PRODUCTION')]:
                  weeks=obj.get('completed_consecutive_weeks_used',obj.get('completed_prefix_weeks'))
                  require(weeks==[1,2,3,4,5,6],'WRONG_OUTCOME_WEEKS_'+description)
                  require(obj.get('deployment_authorized') is False,'NONFROZEN_RESEARCH_DEPLOYMENT_'+description)
              outcomes={key(n):d for n,d in opportunity['realized_player_outcomes'].items()}
              prospect_outcomes={key(n):d for n,d in nohist['realized_player_outcomes'].items()}
              prices={key(x['player']):int(x['current_fv']) for x in owners}
              require(sum(x['protected_control']=='True' for x in owners)>=1,'MISSING_PROTECTED_QB_CONTROL')
              live_index_sha=sha(refs['index']);drift=(live_index_sha!=EXPECTED_FROZEN_INDEX_SHA)
              rows=[]
              lock_mismatches=[]
              for own in owners:
                  k=key(own['player']);x=old[k];y=market[k]
                  for col in NEEDED: require(col in x,'MISSING_V1R20_COLUMN_'+col)
                  fv=int(own['current_fv']);require(fv==int(x['baseline_fv'])==int(y['baseline_fv']),'OWNER_OR_SOURCE_FV_DRIFT_'+k)
                  require(int(own['age'])==int(x['age']) and own['role']==x['role'],'OWNER_ROLE_AGE_DRIFT_'+k)
                  if own['protected_control']!=x['is_owner_protected']:
                      lock_mismatches.append({'player':own['player'],'workbook_flag':own['protected_control'],'canonical_protected_flag':x['is_owner_protected']})
                  require(abs(float(own['production_multiplier'])-float(x['effective_production_mult']))<0.00001,'OWNER_PROD_MULT_DRIFT_'+k)
                  require(abs(float(own['age_multiplier'])-float(x['age_multiplier']))<0.00001,'OWNER_AGE_MULT_DRIFT_'+k)
                  if y['feedback']!='Unrated': require(y['feedback'].lower()==own['owner_rating'].lower(),'PRIOR_14_FEEDBACK_CHANGED_'+k)
                  a=outcomes.get(k,{});b=prospect_outcomes.get(k,{})
                  games=int(a.get('active_games',0) or 0)
                  active_ppg=a.get('active_ppg')
                  proven=x['production_provenance']=='REAL_PRODUCTION_DATA'
                  row={'player':own['player'],'owner_rating':own['owner_rating'],'baseline_fv':fv,'age':int(own['age']),'role':x['role'],
                       'protected':x['is_owner_protected']=='True','feedback_workbook_lock_mismatch':own['protected_control']!=x['is_owner_protected'],'production_mult':float(x['effective_production_mult']),
                       'role_prior_mult':float(x['role_prior_mult']), 'production_provenance':x['production_provenance'],
                       'age_mult':float(x['age_multiplier']),'age_penalty_points':int(x['age_penalty_points_without_anchor']),
                       'no_history_flag':not proven,'owner_override_delta':int(float(x['owner_anchor_delta_vs_formula'])),
                       'half_youth_relief_delta':int(x['half_relief_delta']),
                       'ppg_games':games,'ppg_actual':None if active_ppg is None else float(active_ppg),
                       'no_history_cohort_coverage':k in prospect_outcomes,
                       'market_parity':'MATCH' if y['market_fundamental_matches_current']=='True' else ('STALE' if y['market_quote_exists']=='True' else 'MISSING'),
                       'market_quote':int(y['market_value']) if y['market_quote_exists']=='True' and y['market_fundamental_matches_current']=='True' else None,
                       'ballots':int(y['fv_informed_ballot_appearances'] or 0),
                       'distinct_voters':int(y['fv_informed_distinct_voters'] or 0),
                       'ppg_rank_gap':None,'fv_percentile_active_cohort':None,'ppg_percentile_active_cohort':None,
                       'flags':''}
                  rows.append(row)
              active=[x for x in rows if x['ppg_games']>=3 and x['ppg_actual'] is not None]
              cohort_fv=[x['baseline_fv'] for x in active];cohort_ppg=[x['ppg_actual'] for x in active]
              for row in rows:
                  if row in active:
                      row['fv_percentile_active_cohort']=pct(row['baseline_fv'],cohort_fv)
                      row['ppg_percentile_active_cohort']=pct(row['ppg_actual'],cohort_ppg)
                      row['ppg_rank_gap']=round(row['ppg_percentile_active_cohort']-row['fv_percentile_active_cohort'],1)
                  row['flags']=label_signal(row)
              # Complete readable output, stable schema and no hidden changes.
              full=[]
              for x in sorted(rows,key=lambda q:-q['baseline_fv']):
                  full.append({
                    'player':x['player'],'feedback':x['owner_rating'],'current_fv_frozen':x['baseline_fv'],
                    'age':x['age'],'role':x['role'],'is_protected':x['protected'],'feedback_workbook_protection_flag_mismatch':x['feedback_workbook_lock_mismatch'],
                    'effective_production_multiplier':fmt(x['production_mult'],6),'role_prior_multiplier':fmt(x['role_prior_mult'],6),
                    'production_evidence_type':x['production_provenance'],
                    'age_multiplier':fmt(x['age_mult'],6),'age_penalty_points':x['age_penalty_points'],
                    'owner_override_delta':x['owner_override_delta'],'hypothetical_youth_age_relief_delta':x['half_youth_relief_delta'],
                    'games_with_2026_points_weeks1_6':x['ppg_games'],'actual_2026_ppg_weeks1_6':fmt(x['ppg_actual'],3),
                    'qb_fv_percentile_active3plus':fmt(x['fv_percentile_active_cohort'],1),
                    'qb_ppg_percentile_active3plus':fmt(x['ppg_percentile_active_cohort'],1),
                    'six_week_ppg_minus_fv_rank_percentile_points':fmt(x['ppg_rank_gap'],1),
                    'in_no_history_prospect_candidate_cohort':x['no_history_cohort_coverage'],
                    'market_reference_parity':x['market_parity'],'eligible_market_value_if_parity':x['market_quote'] or '',
                    'market_ballot_appearances':x['ballots'],'distinct_market_voters':x['distinct_voters'],
                    'descriptive_investigation_flags':x['flags'],
                    'production_change_authorized':'False'})
              outcsv=out/'CAL26_V1R22_64_QB_Full_Feedback_Independent_Driver_Audit_READ_ONLY.csv';writecsv(outcsv,full)
              # Comparison of owner feedback grouped by a priori features; no optimization/fit/price targets.
              groupings=[('all','All',lambda x:True)]
              for attr in ('role',):
                  for v in sorted({r[attr] for r in rows}):groupings.append((attr,v,lambda x,v=v:x[attr]==v))
              groupings += [('age','Age <=25',lambda x:x['age']<=25),('age','Age 26-32',lambda x:26<=x['age']<=32),('age','Age 33+',lambda x:x['age']>=33),
                            ('age_effect','Age discount < 1',lambda x:x['age_mult']<0.995),('age_effect','Age neutral >= 1',lambda x:x['age_mult']>=0.995),
                            ('production_source','Real production',lambda x: not x['no_history_flag']),('production_source','Prior/no-history',lambda x:x['no_history_flag']),
                            ('2026_sample','3+ scored games',lambda x:x['ppg_games']>=3),('2026_sample','0-2 scored games',lambda x:x['ppg_games']<3),
                            ('owner_controls','Owner-approved Correct',lambda x:x['owner_rating']=='Correct')]
              cross=[]
              for attr,label,p in groupings:
                  group=[r for r in rows if p(r)];q=Counter(r['owner_rating'] for r in group)
                  cross.append({'axis':attr,'category':label,'n':len(group),'too_low':q['Too low'],'correct':q['Correct'],'too_high':q['Too high'],
                                'age_discount_n':sum(r['age_mult']<0.995 for r in group),
                                'no_real_production_n':sum(r['no_history_flag'] for r in group),
                                'three_plus_scored_games_n':sum(r['ppg_games']>=3 for r in group),
                                'market_parity_n':sum(r['market_parity']=='MATCH' for r in group),
                                'mean_premult':fmt(statistics.mean(r['production_mult'] for r in group) if group else None,5),
                                'authorizes_formula_change':False})
              outfile=out/'CAL26_V1R22_Feedback_by_Role_Age_Source_and_Opportunity.csv';writecsv(outfile,cross)
              # Freeze evidence / controls: hypotheses under review, not fitted prescriptions.
              qbrated=Counter(x['owner_rating'] for x in rows)
              high_age0=sum(x['owner_rating']=='Too high' and x['age_mult']>=0.995 for x in rows)
              low_age0=sum(x['owner_rating']=='Too low' and x['age_mult']>=0.995 for x in rows)
              u25=sum(x['owner_rating']=='Too low' and x['age']<=25 and x['age_mult']<0.995 for x in rows)
              ctrl_bad=sum(x['owner_rating']=='Correct' and x['ppg_rank_gap'] is not None and abs(x['ppg_rank_gap'])>=25 for x in rows)
              report=['# CAL26 V1R22 — Full 64-QB Owner Feedback / Independent Driver Audit','',
                      '**Decision: READ ONLY / no age, role, production, opportunity, or market price calibration authorized.**','',
                      '## Scope and timing','',
                      f'- Owner feedback: **64/64**; Too low **{qbrated["Too low"]}**, Correct **{qbrated["Correct"]}**, Too high **{qbrated["Too high"]}**.',
                      f'- Source: V1R20 green run **{SOURCE_RUN_20}**, V1R21 green run **{SOURCE_RUN_21}**; frozen source index SHA: `{EXPECTED_FROZEN_INDEX_SHA}`.',
                      f'- Current checkout index SHA: `{live_index_sha}`; frozen price parity: **{"same checkout" if not drift else "SOURCE HAS CHANGED — evidence remains pinned to older snapshot"}**.',
                      '- 565-player canonical price parity and all 33 owner-protected valuations are inherited from verified V1R20. No current price changes are computed.',
                      '- Independent outcome evidence includes Weeks 1–6 only and is *descriptive*, not independent validation of a dynasty pricing model.',
                      '', '## Practical diagnostic findings','',
                      f'- **{high_age0}** Too-high ratings currently have no age discount. Lowering the age penalty cannot explain them.',
                      f'- **{low_age0}** Too-low ratings have no age discount. Young-QB age relief alone cannot solve those cases.',
                      f'- **{u25}** Too-low ratings have an age discount at age 25 or younger; this is a candidate mechanism to investigate, not a recommended coefficient.',
                      f'- **{len(active)}** QBs have at least 3 scored games in Weeks 1–6; **{len(rows)-len(active)}** lack a stable-enough 3-game descriptive comparison.',
                      f'- **{ctrl_bad}** owner-Correct QBs have an absolute six-week FV-versus-PPG rank gap of at least 25 percentile points. These controls must remain visible when evaluating any future model.',
                      f'- **{sum(x["no_history_flag"] for x in rows)}** QBs use a non-real-production evidence path according to the pinned V1R20 engine.',
                      f'- **{len(lock_mismatches)}** workbook protection flags disagree with the pinned V1R20 price locks. Trust the V1R20 source, not the workbook: {", ".join(x["player"] for x in lock_mismatches) or "none"}.',
                      '- Market rank/values are correlated with FV by design, and sparse voter counts do not constitute an independent pricing target.',
                      '', '## Recommended next action','',
                      '1. Freeze this complete, owner-labeled evaluation cohort; do not fit candidate parameters to it and then call its score out-of-sample.',
                      '2. Review a small set of feature-specific failures (age, no-history role fallback, active QB under/over-performance) while preserving 24 Correct-rated control prices.',
                      '3. If a general formula change is justified, define an independent holdout or future-week evaluation before committing a parameter. Do not auto-deploy.',
                      '', '## Research boundaries','',
                      '- Raw production multipliers are prior/legacy inputs; do not conflate with Weeks 1–6 realized outcomes.',
                      '- Active-game PPG measures present-season output only; it does not directly represent dynasty trade value or multi-year retention.',
                      '- Phase-9 Production, Phase-5 Opportunity, and Phase-3 No-History are not production-authorized and have only six completed weeks.',
                      '- Qualitative high/low/Correct feedback has no numeric target FV; no optimization objective is valid from directional labels alone.',
                      '- No trade desk data files, frozen research files, or owner valuations were altered.','']
              report_path=out/'CAL26_V1R22_Owner_Evidence_and_Driver_Decision_Report.md';report_path.write_text('\n'.join(report)+'\n')
              files={p.name:sha(p) for p in (outcsv,outfile,report_path)}
              manifest={'status':'PASS_CAL26_V1R22_READ_ONLY_64_QB_EVIDENCE','schema':1,'feedback_n':64,'feedback_counts':dict(qbrated),'source_v1r20_run':SOURCE_RUN_20,'source_v1r21_run':SOURCE_RUN_21,
                        'source_index_sha256':EXPECTED_FROZEN_INDEX_SHA,'current_index_sha256':live_index_sha,'current_index_matches_pinned_baseline':not drift,
                        'protected_global_prices':33,'v1r20_canonical_parity':565,'weeks_observed':[1,2,3,4,5,6],
                        'production_change_authorized':False,'production_files_mutated':0,
                        'source_files_sha256':{str(v.relative_to(repo)):sha(v) for v in refs.values()},
                        'workbook_protection_flag_mismatches':lock_mismatches,'feedback_sha256':sha(feedback),'frozen_v1r20_manifest_sha256':sha(p20m),'frozen_v1r21_manifest_sha256':sha(p21m),
                        'files':files}
              (out/'CAL26_V1R22_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              print(json.dumps({'status':manifest['status'],'counts':manifest['feedback_counts'],'active3plus':len(active),'no_production':True,'index_matches_pinned':not drift,'out':str(out)},sort_keys=True))
              return manifest
          
          if __name__=='__main__':
              a=argparse.ArgumentParser();a.add_argument('--repo',required=True);a.add_argument('--source20',required=True);a.add_argument('--source21',required=True);a.add_argument('--feedback',required=True);a.add_argument('--out',required=True)
              args=a.parse_args();main(args.repo,args.source20,args.source21,args.feedback,args.out)
          PY_CAL26_V1R22
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r22_engine.py"
          echo 'PASS 64-owner-rating input digest + Python compile'
      - name: Run complete 64-QB root-cause and control audit read only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r22_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source20 "$RUNNER_TEMP/cal26-v1r22-source20" \
            --source21 "$RUNNER_TEMP/cal26-v1r22-source21" \
            --feedback "$RUNNER_TEMP/cal26_v1r22_feedback.csv" \
            --out "$RUNNER_TEMP/CAL26_V1R22_Evidence"
      - name: Independently check row counts controls digests and zero writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V1R22_CHECK'
          import csv,hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R22_Evidence'
          m=json.loads((out/'CAL26_V1R22_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R22_READ_ONLY_64_QB_EVIDENCE'
          assert m['feedback_n']==64 and m['feedback_counts']=={'Too low':22,'Too high':18,'Correct':24}
          assert m['v1r20_canonical_parity']==565 and m['protected_global_prices']==33
          assert m['production_change_authorized'] is False and m['production_files_mutated']==0
          assert m['source_v1r20_run']==39828172108 and m['source_v1r21_run']==39829914089
          assert m['weeks_observed']==[1,2,3,4,5,6]
          for name,digest in m['files'].items():
              assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest,name
          with (out/'CAL26_V1R22_64_QB_Full_Feedback_Independent_Driver_Audit_READ_ONLY.csv').open() as f: rows=list(csv.DictReader(f))
          assert len(rows)==64 and len(set(r['player'] for r in rows))==64
          assert sum(r['feedback']=='Correct' for r in rows)==24
          assert all(r['production_change_authorized']=='False' for r in rows)
          with (out/'CAL26_V1R22_Feedback_by_Role_Age_Source_and_Opportunity.csv').open() as f: groups=list(csv.DictReader(f))
          assert groups and int(groups[0]['n'])==64
          print('PASS independent CAL26 V1R22: 64 QB feedback / 24 controls / 33 protected / 565 baseline / no writes')
          PY_V1R22_CHECK
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS checkout untouched'
