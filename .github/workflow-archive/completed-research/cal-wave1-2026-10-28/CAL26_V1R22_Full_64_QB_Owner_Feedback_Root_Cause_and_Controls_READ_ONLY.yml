# CAL26 V1R22 | 64/64 owner QB feedback, frozen cohort. Research/diagnostics only.
# No fitted coefficients, no production pricing changes, no auto-release.
name: CAL26 V1R22 - Full 64 QB Feedback Driver Audit READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r22-64-qb-readonly
  cancel-in-progress: false
jobs:
  qb_feedback_root_cause:
    name: Frozen 64-QB feedback and independent driver evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main with no persisted write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Verify main and read-only evidence sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s index.html
          test -s research/opportunity-v2/opportunity_v2_phase5_evaluation.json
          test -s research/no-history-v2/no_history_v2_phase3_evaluation.json
          test -s research/production-v2/production_v2_phase9_evaluation.json
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download two pinned green canonical QB artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r22-source20" "$RUNNER_TEMP/cal26-v1r22-source21"
          gh run download 39828172108 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R20-QB-FV-Drivers-565-Read-Only \
            --dir "$RUNNER_TEMP/cal26-v1r22-source20"
          gh run download 39829914089 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R21-QB-Market-Owner-Crosscheck-Read-Only \
            --dir "$RUNNER_TEMP/cal26-v1r22-source21"
          test -s "$RUNNER_TEMP/cal26-v1r22-source20/CAL26_V1R20_Manifest.json"
          test -s "$RUNNER_TEMP/cal26-v1r22-source21/CAL26_V1R21_Manifest.json"
      - name: Freeze all 64 exact owner ratings and isolate validated engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r22_feedback.csv" <<'CAL26_V1R22_FEEDBACK'
