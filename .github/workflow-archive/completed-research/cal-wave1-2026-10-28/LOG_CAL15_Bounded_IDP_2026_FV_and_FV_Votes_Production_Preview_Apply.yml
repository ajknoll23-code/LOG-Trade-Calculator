      - name: Commit only exact explicitly approved production files
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_ID" =~ ^[0-9]{8,15}$ ]] || { echo 'Apply needs green approved CAL15 preview run ID'; exit 1; }
          test "$(gh run view "$PREVIEW_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          mkdir -p /tmp/cal15-approved
          gh run download "$PREVIEW_ID" --repo "$GITHUB_REPOSITORY" --name log-cal15-exact-preview --dir /tmp/cal15-approved
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,subprocess,shutil
          r=Path('/tmp/cal15-approved');c=json.loads((r/'review_contract.json').read_text())
          assert c['release_id']=='cal15-idp-2026-horizon-bounded-v1'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert c['base_commit']==head, 'Main has advanced: generate a new CAL15 preview'
          assert c['cal14_run']=='39301009907' and c['changed_players']>=100
          assert not Path('scripts/artifacts/generated/fv_informed_estimate_cal15.json').exists(),'Already deployed'
          for name,wanted in c['files_sha256'].items():
              src=r/'candidate'/name
              assert src.is_file() and hashlib.sha256(src.read_bytes()).hexdigest()==wanted,(name,'stale artifact')
              dest=Path(name);dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dest)
              assert hashlib.sha256(dest.read_bytes()).hexdigest()==wanted,(name,'copy/hash mismatch')
          print('CAL15 apply approved exact-hash files:',list(c['files_sha256']))
          PYCODE
          python3 scripts/validation/snapshot_values.py --selftest
