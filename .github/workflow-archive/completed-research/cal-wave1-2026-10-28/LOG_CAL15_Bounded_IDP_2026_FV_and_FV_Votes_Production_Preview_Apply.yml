          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/artifacts/generated/fv_informed_estimate_cal15.json model/releases/cal15-idp-2026-horizon-bounded-v1/release.json scripts/validation/validate_cal15_successor.py scripts/validation/repo_regression_checks.py
          git diff --cached --check
