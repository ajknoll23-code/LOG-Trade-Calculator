name: CAL26 V1R2 - Owner Feedback Position Diagnostic Read Only

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cal26-v1r2-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner_feedback_diagnostic:
    name: Validate feedback, protect accepted FVs, stress-test positions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run embedded read-only CAL26 feedback diagnostics
        shell: bash
        env:
          CAL26_OUTPUT_DIR: cal26-v1r2-output
        run: |
          set -euo pipefail
          python - <<'PY_CAL26_V1R2'
          #!/usr/bin/env python3
          """CAL26 V1R2 feedback-only diagnostic; emits artifacts, never writes production."""
          import base64
          import csv
          import gzip
          import hashlib
          import io
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          CSV_GZIP_B64 = ''
          EXPECTED_CSV_SHA256 = '58f95a38b7ea0900d9655a88eedb59c0e1b39cd075e3a43c58d61ac3cbd46dde'
          EXPECTED_WORKBOOK_SHA256 = '206deab2ee3fccde7dd6cb4c203cfa98cac3bd294e1c692aa42645fe68318f2b'
          PCTS = (5, 10, 20, 35)
          POSITIONS = ('QB', 'RB', 'WR', 'TE', 'DL', 'LB', 'DB')
          REQUIRED = ('player', 'position', 'role', 'draft_pick_2026', 'current_fv',
                      'cal26_proposed_fv', 'cal26_delta', 'cal26_rating', 'fv_plus_votes',
                      'fv_plus_votes_rating', 'market_value', 'market_rating',
                      'ballot_voters', 'cal26_model_signal', 'proposal_direction',
                      'owner_lower_strict_gt', 'owner_upper_strict_lt',
                      'owner_correct_companion_refs', 'bound_conflict',
                      'feedback_source_sha256')


          def verify(ok, message):
              if not ok:
                  raise AssertionError('CAL26_V1R2_VALIDATION_FAILED: ' + message)


          def as_int(row, field, optional=False):
              x = row[field].strip()
              if not x:
                  if optional:
                      return None
                  raise AssertionError(f'Missing {field}: {row["player"]}')
              n = float(x)
              verify(math.isfinite(n) and n.is_integer() and n >= 0,
                     f'invalid {field} for {row["player"]}: {x}')
              return int(n)


          def write_csv(path, rows, fields):
              with open(path, 'w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, extrasaction='ignore')
                  writer.writeheader()
                  writer.writerows(rows)


          def fmt(n):
              return f'{n:,}' if isinstance(n, int) else str(n)


          def metric_table(rows, key):
              groups = defaultdict(list)
              for r in rows:
                  groups[key(r)].append(r)
              out = []
              for name, subset in sorted(groups.items(), key=lambda x: str(x[0])):
                  counts = Counter(r['cal26_rating'] for r in subset)
                  directions = Counter((r['proposal_direction'], r['cal26_rating']) for r in subset)
                  out.append({'segment': str(name), 'players': len(subset),
                              'low': counts['Low'], 'correct': counts['Correct'],
                              'high': counts['High'],
                              'bad_decreases': directions['Decrease', 'Low'],
                              'missed_holds': directions['Unchanged', 'Low'],
                              'too_small_increases': directions['Increase', 'Low']})
              return out


          def main():
              output_dir = Path(os.environ.get('CAL26_OUTPUT_DIR', 'cal26-v1r2-output'))
              output_dir.mkdir(exist_ok=True, parents=True)
              raw = gzip.decompress(base64.b64decode(CSV_GZIP_B64))
              digest = hashlib.sha256(raw).hexdigest()
              verify(digest == EXPECTED_CSV_SHA256, 'embedded feedback fingerprint mismatch')
              rows = list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
              verify(len(rows) == 80, f'expected 80 players, got {len(rows)}')
              verify(set(REQUIRED).issubset(rows[0].keys()), 'CSV required columns missing')
              ids = [(r['player'].lower().strip(), r['position'].upper()) for r in rows]
              verify(len(set(ids)) == 80, 'duplicate player-position rows')
              verify(all(r['feedback_source_sha256'] == EXPECTED_WORKBOOK_SHA256 for r in rows),
                     'feedback workbook source drift')
              positions = set(POSITIONS)
              cohort_summary = Counter()
              correct = []
              diagnostics = []
              stress = []
              flags = []
              two_sided = []
              for r in rows:
                  player, position = r['player'], r['position']
                  verify(position in positions, 'unexpected position: ' + position)
                  prev, price, delta = as_int(r, 'current_fv'), as_int(r, 'cal26_proposed_fv'), int(r['cal26_delta'])
                  verify(price - prev == delta, f'delta mismatch: {player}')
                  direction = 'Increase' if delta > 0 else 'Decrease' if delta < 0 else 'Unchanged'
                  verify(r['proposal_direction'] == direction, f'direction mismatch: {player}')
                  ratings = [r[c] for c in ('cal26_rating', 'fv_plus_votes_rating', 'market_rating')]
                  verify(all(x in ('Low', 'Correct', 'High', 'Unsure') for x in ratings), f'bad rating: {player}')
                  verify(r['cal26_rating'] != 'Unsure', 'CAL26 cannot be Unsure')
                  price_values = [price, as_int(r, 'fv_plus_votes'), as_int(r, 'market_value', optional=True)]
                  low_values = [v for v, rating in zip(price_values, ratings) if v is not None and rating == 'Low']
                  high_values = [v for v, rating in zip(price_values, ratings) if v is not None and rating == 'High']
                  lower = max(low_values) if low_values else None
                  upper = min(high_values) if high_values else None
                  supplied_lower = as_int(r, 'owner_lower_strict_gt', optional=True)
                  supplied_upper = as_int(r, 'owner_upper_strict_lt', optional=True)
                  verify(lower == supplied_lower and upper == supplied_upper,
                         f'ordinal bounds mismatch: {player}')
                  conflict = lower is not None and upper is not None and lower >= upper - 1
                  verify(not conflict and r['bound_conflict'] == 'NO',
                         f'ordinal conflict or marker mismatch: {player}')
                  anchor_notes = r['owner_correct_companion_refs'].strip()
                  correct_candidates = [(src, val) for src, val, rating in zip(('fv', 'fv_votes', 'mv'), price_values, ratings) if val is not None and rating == 'Correct']
                  verify(all((lower is None or v > lower) and (upper is None or v < upper) for _, v in correct_candidates),
                         f'Correct value outside directional bounds: {player}')
                  if r['cal26_rating'] == 'Correct':
                      correct.append({'player': player, 'position': position, 'protected_fv': price,
                                      'current_fv': prev, 'allowed_v1r2_change': 0,
                                      'owner_rating': 'Correct'})
                  cohort = '2026_draft_selection' if r['draft_pick_2026'].strip() else 'non_2026_selection'
                  cohort_summary[cohort] += 1
                  min_price = lower + 1 if lower is not None else None
                  max_price = upper - 1 if upper is not None else None
                  if lower is not None and upper is not None:
                      two_sided.append(player)
                  if r['cal26_rating'] == 'Low':
                      anchor_crossing_price = max(price, min_price) if min_price is not None else None
                  elif r['cal26_rating'] == 'High':
                      anchor_crossing_price = min(price, max_price) if max_price is not None else None
                  else:
                      anchor_crossing_price = price
                  needs_independent = r['cal26_rating'] != 'Correct'
                  diagnostics.append({
                      'player': player, 'position': position, 'role': r['role'], 'cohort': cohort,
                      'draft_pick_2026': r['draft_pick_2026'], 'current_fv': prev,
                      'cal26_proposed_fv': price, 'cal26_delta': delta,
                      'cal26_rating': r['cal26_rating'], 'proposal_direction': direction,
                      'fv_votes_price': price_values[1], 'fv_votes_rating': ratings[1],
                      'market_price': price_values[2] if price_values[2] is not None else '',
                      'market_rating': ratings[2], 'owner_lower_strict_gt': lower if lower is not None else '',
                      'owner_upper_strict_lt': upper if upper is not None else '',
                      'correct_companion_refs': anchor_notes,
                      'constraint_crossing_probe_price_not_recommendation': anchor_crossing_price,
                      'probe_delta_from_cal26': anchor_crossing_price - price if anchor_crossing_price is not None else '',
                      'owner_direction_signal': 'UP' if ratings[0] == 'Low' else 'DOWN' if ratings[0] == 'High' else 'ACCEPT',
                      'independent_support': 'NOT_SUPPLIED',
                      'production_eligible': 'NO',
                      'next_action': 'PROTECT_EXACT' if not needs_independent else (
                          'AUDIT_DECREASE_SIGN_AND_LINEAGE' if direction == 'Decrease' and ratings[0] == 'Low' else
                          'INVESTIGATE_UPWARD_EVIDENCE' if ratings[0] == 'Low' else
                          'INVESTIGATE_OVERPRICING')
                  })
                  for pct in PCTS:
                      if ratings[0] == 'Correct':
                          scenario = price
                      elif ratings[0] == 'Low':
                          scenario = math.ceil(price * (100 + pct) / 100)
                      else:
                          scenario = math.floor(price * (100 - pct) / 100)
                      clears_low = lower is None or scenario > lower
                      clears_high = upper is None or scenario < upper
                      stress.append({
                          'player': player, 'position': position, 'cal26_rating': ratings[0],
                          'scenario_pct_abs': pct, 'baseline_fv': price,
                          'shadow_fv_not_recommendation': scenario,
                          'shadow_delta': scenario - price, 'passes_all_low_labels': clears_low,
                          'passes_all_high_labels': clears_high,
                          'passes_all_directional_constraints': clears_low and clears_high,
                          'exact_protected_control': ratings[0] == 'Correct' and scenario == price,
                          'independent_support': 'NOT_SUPPLIED',
                          'eligible_for_production': 'NO'})
                  if direction == 'Decrease' and ratings[0] == 'Low':
                      flags.append({'player': player, 'position': position,
                                    'flag': 'PROPOSED_DECREASE_BUT_OWNER_LOW',
                                    'detail': f'{prev} -> {price}; audit upstream features and penalties'})
                  if r['role'] in ('Rotational', 'Understudy', 'Speculative') and ratings[0] == 'Low' and not r['draft_pick_2026'].strip():
                      flags.append({'player': player, 'position': position,
                                    'flag': 'ROLE_LINEAGE_REVIEW',
                                    'detail': f'{r["role"]} role, low price; verify source season, snap share and role identity'})
                  if ratings[0] == 'High':
                      flags.append({'player': player, 'position': position, 'flag': 'HIGH_PRICE_CONTROL',
                                    'detail': 'Investigate baseline; no automatic negative correction'})
                  if ratings[0] == 'Correct':
                      flags.append({'player': player, 'position': position, 'flag': 'PROTECT_ACCEPTED_PRICE',
                                    'detail': f'freeze exact CAL26 FV {price}'})
              counts = Counter(r['cal26_rating'] for r in rows)
              verify(counts == {'Low': 60, 'Correct': 18, 'High': 2}, 'unexpected feedback totals')
              verify(len(correct) == 18, 'expected 18 immutable controls')
              verify(len(two_sided) == 16, f'expected 16 two-sided ordinal brackets; got {len(two_sided)}')
              bad_decreases = [r for r in rows if r['proposal_direction'] == 'Decrease' and r['cal26_rating'] == 'Low']
              verify(len(bad_decreases) == 10, 'expected 10 wrong-direction decreases')
              verify(cohort_summary == {'2026_draft_selection': 15, 'non_2026_selection': 65}, 'draft cohort mismatch')
              verify(all(r['cal26_rating'] == 'Low' for r in rows if r['draft_pick_2026']), 'draft cohort unexpectedly not all Low')
              verify(all(s['shadow_fv_not_recommendation'] == int(next(r['cal26_proposed_fv'] for r in rows if r['player'] == s['player'] and r['position'] == s['position'])) for s in stress if s['cal26_rating'] == 'Correct'), 'protected anchor drift')

              by_position = metric_table(rows, lambda r: r['position'])
              by_role = metric_table(rows, lambda r: r['role'])
              by_cohort = metric_table(rows, lambda r: '2026 draftee' if r['draft_pick_2026'].strip() else 'non-2026')
              by_direction = metric_table(rows, lambda r: r['proposal_direction'])
              stress_summary = []
              for pos in POSITIONS:
                  for pct in PCTS:
                      relevant = [s for s in stress if s['position'] == pos and s['scenario_pct_abs'] == pct and s['cal26_rating'] != 'Correct']
                      stress_summary.append({'position': pos, 'percent': pct, 'directional_players': len(relevant),
                                             'constraint_pass': sum(s['passes_all_directional_constraints'] for s in relevant),
                                             'constraint_fail': sum(not s['passes_all_directional_constraints'] for s in relevant),
                                             'evidence_backed_count': 0})
              report = {
                  'workflow': 'CAL26 V1R2 - Owner Feedback Position Diagnostic Read Only',
                  'status': 'PASS_FEEDBACK_ONLY_READ_ONLY_NOT_PRODUCTION',
                  'input_csv_sha256': digest,
                  'source_workbook_sha256': EXPECTED_WORKBOOK_SHA256,
                  'owner_feedback_rows': len(rows),
                  'owner_selected_sample_random_holdout': False,
                  'unreviewed_roster_rows_not_accessed': 485,
                  'production_changes_authorized': False,
                  'fair_value_model_refitted': False,
                  'independent_production_draft_peer_evidence_available': False,
                  'numeric_stress_scenarios_are_prices_to_test_not_calibrated_targets': True,
                  'accepted_controls_protected': len(correct),
                  'two_sided_brackets_checked': len(two_sided),
                  'wrong_direction_decrease_count': len(bad_decreases),
                  'label_totals': dict(counts), 'position': by_position,
                  'role': by_role, 'cohort': by_cohort,
                  'proposal_direction': by_direction, 'stress_summary': stress_summary,
                  'next_gate': 'PIN_LIVE_565_PLAYER_QUOTES_AND_INDEPENDENT_EVIDENCE_THEN_FIT_ON_DESIGNATED_DEV_AND_TEST_WITH_SEPARATE_UNSEEN_PLAYERS',
                  'created_at_utc': datetime.now(timezone.utc).isoformat()}
              (output_dir / 'CAL26_V1R2_readonly_report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              write_csv(output_dir / 'CAL26_V1R2_80_player_diagnostics.csv', diagnostics, list(diagnostics[0]))
              write_csv(output_dir / 'CAL26_V1R2_18_accepted_controls.csv', correct, list(correct[0]))
              write_csv(output_dir / 'CAL26_V1R2_shadow_stress_test.csv', stress, list(stress[0]))
              write_csv(output_dir / 'CAL26_V1R2_flagged_reviews.csv', flags, list(flags[0]))
              write_csv(output_dir / 'CAL26_V1R2_position_stress_summary.csv', stress_summary, list(stress_summary[0]))
              md = ['# CAL26 V1R2 — Read-only position-specific calibration diagnostics', '',
                    '**Result: PASS_FEEDBACK_ONLY_READ_ONLY_NOT_PRODUCTION**', '',
                    '- 80 owner-picked ratings; 60 Low, 18 Correct, 2 High. Not an unbiased holdout.',
                    '- 18 owner-accepted proposals are immutable in every shadow scenario.',
                    '- 10 owner-Low proposed decreases flagged for individual lineage review.',
                    '- 485 unreviewed player values are NOT loaded or evaluated; no production writes.',
                    '- 16 two-sided ordinal brackets verified; bounds are not owner target prices.',
                    '- Sensitivity tests are arbitrary 5/10/20/35% *stress probes*, not fitted pricing rules.',
                    '- No independent source evidence attached; cannot approve priced changes.', '',
                    '## Breakdown by position', '',
                    '| Position | N | Low | Correct | High | Low despite decrease | Low despite hold | Low despite increase |',
                    '|---|---:|---:|---:|---:|---:|---:|---:|']
              for m in by_position:
                  md.append(f'| {m["segment"]} | {m["players"]} | {m["low"]} | {m["correct"]} | {m["high"]} | {m["bad_decreases"]} | {m["missed_holds"]} | {m["too_small_increases"]} |')
              md += ['', '## Directional stress test: players passing all owner ordinal inequalities', '',
                     '| Position | +/− 5% | +/− 10% | +/− 20% | +/− 35% | Eligible for production |',
                     '|---|---:|---:|---:|---:|---|']
              for pos in POSITIONS:
                  group = [s for s in stress_summary if s['position'] == pos]
                  md.append('| ' + pos + ' | ' + ' | '.join(f'{s["constraint_pass"]}/{s["directional_players"]}' for s in group) + ' | None |')
              md += ['', '## Research-only rule directions', '',
                     '1. Diagnose the 2026 draft cohort separately; all 15 owner-reviewed draftees rated Low. Do not extrapolate to unreviewed draftees.',
                     '2. Reconsider the 10 negative CAL26 deltas rated Low; freeze the 9 negative deltas rated Correct.',
                     '3. Audit position-specific baseline, role lineage, age and actual production for QB/WR/TE/IDP; test differentiated corrections, not uniform uplift.',
                     '4. Use high/low companion comparisons only as strict ordinal inequality checks; a passing price is not necessarily Correct.',
                     '5. Do not retune 18 Correct anchors or ingest companion MV as a universal target.',
                     '6. Capture immutable dated independent features, role snapshots and lineage for all 565, then partition development and unseen evaluation before numerical refitting.', '',
                     '## Production gate', '',
                     '**CLOSED.** No production changes, no shadow scenario authorized as model output.']
              (output_dir / 'CAL26_V1R2_readonly_report.md').write_text('\n'.join(md) + '\n', encoding='utf-8')
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_file:
                  with open(summary_file, 'a', encoding='utf-8') as f:
                      f.write('\n'.join(md) + '\n')
              print(json.dumps({k: report[k] for k in ('status', 'owner_feedback_rows', 'accepted_controls_protected', 'two_sided_brackets_checked', 'wrong_direction_decrease_count', 'production_changes_authorized')}, indent=2))


          if __name__ == '__main__':
              main()
          PY_CAL26_V1R2

      - name: Upload CAL26 V1R2 read-only diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R2-ReadOnly-Diagnostics
          path: cal26-v1r2-output/
          if-no-files-found: warn
          retention-days: 30
