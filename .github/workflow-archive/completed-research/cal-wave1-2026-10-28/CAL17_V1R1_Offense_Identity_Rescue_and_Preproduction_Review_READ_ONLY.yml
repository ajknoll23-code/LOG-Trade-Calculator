name: CAL17 V1R3 - Offense Identity Rescue and Preproduction Review (Read Only)

# Self-contained frozen input snapshot from the confirmed CAL16 V2R1 green files.
# No source run ID is required; no repository or production file is modified.
on:
  workflow_dispatch:
    inputs:
      fetch_sleeper_directory_once:
        description: "Optional Sleeper directory lookup for unverified name/position matches"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cal17_read_only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAL17_FETCH_SLEEPER: ${{ inputs.fetch_sleeper_directory_once }}
