          from pathlib import Path
          import hashlib, json
          root=Path('cal17_inputs')
          expected={
              "CAL16_V2R1_Full_565_Offense_FV_Shadow_READ_ONLY.csv": "d7a3ced66bbb7be332e47befbfbb964214698521a70028f278ef9f9121322465",
