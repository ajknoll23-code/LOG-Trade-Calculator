name: CAL21 V1R2 - Owner-Guided Valuation and Elite LB Peer Diagnostics READ ONLY
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cal21-v1r2-owner-guided-readonly
  cancel-in-progress: false
jobs:
  cal21_shadow:
    name: CAL21 owner-graded model audit and linebacker peer validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '39463394968'
      SOURCE_ARTIFACT: cal20-v1r3-core173-exact-OWNER-REVIEW-PREVIEW
    steps:
      - name: Checkout current repo without modifying production
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact GREEN CAL20 evidence from GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/cal21-frozen-green-source
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/cal21-frozen-green-source
          test -s /tmp/cal21-frozen-green-source/review_contract.json
          test -s /tmp/cal21-frozen-green-source/candidate/index.html
          test -s /tmp/cal21-frozen-green-source/candidate/scripts/validation/snapshot_values.py
          test "$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
      - name: Create embedded, versioned CAL21 shadow engine
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cal21_owner_guided_shadow.py <<'PYCAL21'
          #!/usr/bin/env python3
          """CAL21 V1R1: source-pinned owner-directional valuation diagnostics, no production writes.
          
          Takes an extracted *GREEN* CAL20 V1R3 artifact path and output directory.
          Reads the archived candidate only. No repo production prices are modified.
          """
          from __future__ import annotations
          import argparse
          import copy
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          import re
          from collections import Counter
          from pathlib import Path
          
          RUN = 39463394968
          ARTIFACT = 'cal20-v1r3-core173-exact-OWNER-REVIEW-PREVIEW'
          # These are the owner's *ordinal* assessments, not invented target prices.
          OWNER = {
           'fernando mendoza':('too_low','slightly_low','way_high'),
           'sonny styles':('too_low','about_right','too_high'),
           'kc concepcion':('too_low','slightly_low','too_high'),
           'bijan robinson':('slightly_low','slightly_low','way_low'),
           'malik davis':('about_right','slightly_high','way_high'),
           'kenyon sadiq':('too_low','too_low','slightly_high'),
           'ashton jeanty':('slightly_high','slightly_high','way_low'),
           'ty simpson':('too_low','too_low','too_high'),
           'malik willis':('about_right','too_high','way_high'),
           'dj giddens':('about_right','about_right_tentative','way_high'),
          }
          
          
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def load(path):return json.loads(Path(path).read_text(encoding='utf8'))
          def write_csv(path, rows, headers=None):
              if not rows and not headers:raise ValueError('empty CSV')
              with path.open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=headers or list(rows[0]),extrasaction='ignore')
                  w.writeheader();w.writerows(rows)
          
          def read_model(source):
              spec=importlib.util.spec_from_file_location('cal21_frozen_snapshot_values',source)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              return mod
          
          def player_fields(html,sv):
              body=sv.extract_object_body(html,'PLAYER_DB')
              fields={}
              for key,blob in re.findall(r"'([^']+)':\{([^{}]*)\}",body):
                  m2026=re.search(r'\bproj2026:\s*([-\d.]+)',blob)
                  m2025=re.search(r'\bpts2025:\s*([-\d.]+)',blob)
                  mt=re.search(r"\bteam:'([^']*)'",blob)
                  fields[key]={'proj2026':float(m2026.group(1)) if m2026 else None,
                      'pts2025':float(m2025.group(1)) if m2025 else None,
                      'team':mt.group(1) if mt else ''}
              return fields
          
          def shrink_market(fv,mv,vote_appearances,pseudo_ballots):
              # Arithmetic in log-space avoids zero/negative value and extreme ratios.
              # Vote support is from CAL18 lambda8 snapshot, NOT claim of MV model effective weights.
              n=max(0,int(vote_appearances))
              w=n/(n+pseudo_ballots)
              return int(math.floor(fv*math.exp(w*math.log(mv/fv))+.5))
          
          def cap_signal(v):
              if v is None:return 'not_market_covered'
              a=float(v)
              if a>=2:return 'market_at_least_double_fv'
              if a<=.5:return 'market_at_most_half_fv'
              if a>=1.5:return 'market_over_50pct_higher'
              if a<=.667:return 'market_over_33pct_lower'
              return 'within_broad_range'
          
          def build(src:Path,out:Path):
              out.mkdir(parents=True,exist_ok=True)
              required=['review_contract.json','candidate/index.html','candidate/free-agent-board.html',
                'candidate/scripts/validation/snapshot_values.py',
                'candidate/scripts/artifacts/generated/fv_informed_estimate_cal18.json',
                'candidate/scripts/artifacts/generated/market_values.json',
                'candidate/model/releases/cal20-offense-core173-2026-10-20-v1/release.json']
              for f in required: assert (src/f).is_file(),f'Missing pinned CAL20 file: {f}'
              contract=load(src/'review_contract.json')
              release=load(src/'candidate/model/releases/cal20-offense-core173-2026-10-20-v1/release.json')
              assert release['release_id']=='cal20-offense-core173-2026-10-20-v1'
              assert release['base_git_commit']=='5b7f5c3429d3224d3090100e2a9d2b97462eecbf'
              assert release['source_cal18_green_run']==39452726097 and release['source_cal19_green_run']==39456911324
              assert release['changed_player_count']==contract['changed_players']==173
              assert release['production_apply_authorized'] is False
              assert len(contract['files_sha256'])==8
              for f,digest in contract['files_sha256'].items():
                  assert sha(src/'candidate'/f)==digest,(f,'review SHA mismatch')
              html=(src/'candidate/index.html').read_text(encoding='utf8')
              assert "const CAL20_FV_SNAPSHOT_AS_OF_DATE = '2026-10-20';" in html
              sv=read_model(src/'candidate/scripts/validation/snapshot_values.py')
              cfg=sv.load_from_html(src/'candidate/index.html')
              prices=sv.compute_all_values(cfg)
              assert len(prices)==565
              q=load(src/'candidate/scripts/artifacts/generated/fv_informed_estimate_cal18.json')
              mv=load(src/'candidate/scripts/artifacts/generated/market_values.json')
              assert len(q['players'])==565 and len(mv['players'])==504
              assert q['semantics']=='fv_informed_preference_estimate_not_independent_market_price' and q['display_only'] is True
              assert mv['scale_semantics']=='league_rank_quantile_mapped_to_trade_desk_points_v1'
              assert all(int(q['players'][k]['fundamental_value'])==prices[k]['value'] for k in prices)
              assert all(int(x['fundamental_value'])==prices[k]['value'] for k,x in mv['players'].items())
              assert set(OWNER)<=set(prices)
              meta=player_fields(html,sv)
              assert len(meta)==565,(len(meta),'Cannot parse complete PLAYER_DB metadata')
              originals={}
              full=[]
              changed={x['player'] for x in release['changed_players']}
              assert len(changed)==173
              for key in sorted(prices):
                  v=prices[key];f=int(v['value']);quote=q['players'][key];mr=mv['players'].get(key)
                  n=int(quote['ballot_appearances']);voters=int(quote['distinct_voters'])
                  m=(int(mr['market_value']) if mr else None)
                  raw=cfg['prod_mult'].get(key)
                  role=cfg['player_db'][key]['role'];pos=v['pos'];age=v['age'];p=meta[key]
                  prod,under=sv.production_multiplier(key,role,cfg['prod_mult'],cfg['no_real_history'],cfg['role_mult'])
                  prev=(p['pts2025'] is not None)
                  row={
                    'player':key,'pos':pos,'age':age,'role':role,'team':p['team'],
                    'proj2026':p['proj2026'] if p['proj2026'] is not None else '',
                    'recorded_2025_points':p['pts2025'] if prev else '',
                    'no_recorded_2025_points':str(not prev).upper(),
                    'raw_production_multiplier':raw if raw is not None else '',
                    'effective_production_multiplier':prod,
                    'floor_or_role_rescue_active':str(raw is not None and abs(prod-raw)>1e-9).upper(),
                    'cal20_fv':f,'fv_plus_votes':int(quote['fv_informed_estimate']),
                    'market_value':m if m is not None else '',
                    'market_to_fv_ratio':round(m/f,4) if m is not None else '',
                    'market_rank':mr['market_rank'] if mr else '',
                    'voting_appearances_quote_snapshot':n,'distinct_voters_quote_snapshot':voters,
                    'quote_evidence_band':quote['evidence_band'],
                    'mv_signal_band':cap_signal(m/f if m is not None else None),
                    'mv_shrink_prior12':shrink_market(f,m,n,12) if m is not None else '',
                    'mv_shrink_prior25':shrink_market(f,m,n,25) if m is not None else '',
                    'cal20_changed_fv':str(key in changed).upper(),
                    'owner_feedback_case':str(key in OWNER).upper(),
                  }
                  originals[key]=row;full.append(row)
              write_csv(out/'CAL21_All_565_Valuation_And_Source_Diagnostics_READ_ONLY.csv',full)
              anchor_rows=[];sensitivity=[];cohort_peers=[]
              for key,grades in OWNER.items():
                  row=originals[key];fv=row['cal20_fv'];mvval=int(row['market_value']);vote=row['fv_plus_votes']
                  direction=('reduce' if grades[2] in ('way_high','too_high','slightly_high') else 'increase')
                  a={**row,'owner_fv_label':grades[0],'owner_fv_votes_label':grades[1],'owner_mv_label':grades[2],
                     'market_move_expected_by_owner':direction,
                     'prior12_moved_correct_direction':str(int(row['mv_shrink_prior12'])<mvval if direction=='reduce' else int(row['mv_shrink_prior12'])>mvval).upper(),
                     'prior25_moved_correct_direction':str(int(row['mv_shrink_prior25'])<mvval if direction=='reduce' else int(row['mv_shrink_prior25'])>mvval).upper(),
                     'can_derive_numerical_target_from_owner_grade':'FALSE'}
                  anchor_rows.append(a)
                  # Read-only mechanism sensitivity, not an approved FV correction or price target.
                  for pct in [-.10,-.05,.05,.10,.20]:
                      temp=copy.deepcopy(cfg)
                      old=temp['prod_mult'].get(key)
                      if old is None:continue
                      new=max(0.15,min(1.55,old*(1+pct)))
                      temp['prod_mult'][key]=new
                      price=sv.compute_all_values(temp)[key]['value']
                      sensitivity.append({'player':key,'pos':row['pos'],'role':row['role'],
                        'mechanism':'change_existing_raw_PROD_MULT_only',
                        'raw_shift_pct':int(pct*100),'raw_before':old,'raw_hypothetical':round(new,12),
                        'cal20_fv':fv,'fv_sensitivity_only':price,'fv_delta':price-fv,
                        'not_an_owner_target':'TRUE','not_a_production_adjustment':'TRUE'})
                  def cohort(p):return p['pos']==row['pos'] and abs(p['age']-row['age'])<=3 and p['player']!=key
                  peers=[r for r in full if cohort(r)]
                  def dist(r):
                      dproj=abs(float(r['proj2026'])-float(row['proj2026']))/max(50.,float(row['proj2026'])) if r['proj2026']!='' and row['proj2026']!='' else 2.
                      return (dproj+(.4 if r['no_recorded_2025_points']!=row['no_recorded_2025_points'] else 0)
                              +.15*abs(r['age']-row['age'])+(.2 if r['role']!=row['role'] else 0))
                  for peer in sorted(peers,key=lambda p:(dist(p),p['player']))[:5]:
                      cohort_peers.append({'anchor':key,'peer':peer['player'],'pos':row['pos'],
                        'anchor_fv':fv,'peer_fv':peer['cal20_fv'],
                        'anchor_raw':row['raw_production_multiplier'],'peer_raw':peer['raw_production_multiplier'],
                        'anchor_proj2026':row['proj2026'],'peer_proj2026':peer['proj2026'],
                        'anchor_2025_recorded':str(row['no_recorded_2025_points']=='FALSE'),
                        'peer_2025_recorded':str(peer['no_recorded_2025_points']=='FALSE'),
                        'anchor_role':row['role'],'peer_role':peer['role'],
                        'proximity_score':round(dist(peer),3),
                        'peer_not_evidence_of_true_market_price':'TRUE'})
              assert len(anchor_rows)==10 and len(sensitivity)==50 and len(cohort_peers)==50
              # Full-pool monotonicity counterfactual: positive raw production should not
              # reduce a player's FV, yet the existing floor/role rescue sometimes does.
              # This is a read-only reproducible diagnostic, NEVER a rule relaxation.
              def one_price(key,raw):
                  info=cfg['player_db'][key];pos=info['pos'];age=info['age'];role=info['role']
                  eff,under=sv.production_multiplier(key,role,{key:raw},cfg['no_real_history'],cfg['role_mult'])
                  am=sv.effective_age_multiplier(pos,age,role,key,eff,under,cfg)
                  return math.floor(100*cfg['position_weight'].get(pos,1)*am*eff*55+.5),eff
              monotone_rows=[]
              for row in full:
                  key=row['player'];old=cfg['prod_mult'].get(key)
                  if old is None: continue
                  fv=row['cal20_fv']
                  baseline_calc,eff=one_price(key,old)
                  assert baseline_calc==fv,(key,baseline_calc,fv)
                  n001=min(1.55,old+.001)
                  n1=min(1.55,old*1.01)
                  n5=min(1.55,old*1.05)
                  v001,e001=one_price(key,n001)
                  v1,e1=one_price(key,n1)
                  v5,e5=one_price(key,n5)
                  bad=any(v<fv for v,new in [(v001,n001),(v1,n1),(v5,n5)] if new>old+1e-12)
                  monotone_rows.append({'player':key,'pos':row['pos'],'role':row['role'],
                       'old_raw':old,'old_effective':eff,'fv_before':fv,
                       'raw_plus_0_001':round(n001,12),'fv_plus_0_001':v001,'delta_plus_0_001':v001-fv,
                       'raw_plus_1pct':round(n1,12),'fv_plus_1pct':v1,'delta_plus_1pct':v1-fv,
                       'raw_plus_5pct':round(n5,12),'fv_plus_5pct':v5,'delta_plus_5pct':v5-fv,
                       'nonmonotone_at_tested_steps':str(bad).upper(),
                       '2025_recorded_points_present':str(row['no_recorded_2025_points']=='FALSE').upper(),
                       'in_owner_ten':str(key in OWNER).upper()})
              anomalous=[r for r in monotone_rows if r['nonmonotone_at_tested_steps']=='TRUE']
              write_csv(out/'CAL21_AllPlayers_Positive_Production_FV_Monotonicity_Audit.csv',monotone_rows)
              write_csv(out/'CAL21_Nonmonotonicity_Exceptions.csv',anomalous,headers=list(monotone_rows[0]))
              # Narrow identity-frozen continuity repair thought experiment: preserve
              # role-floor rescue *only for the exact 0.15 cohort already receiving it*.
              # This changes ZERO current prices, while avoiding the upcoming downward
              # cliff when a future fresh projection nudges their raw above 0.15.
              guard_keys={r['player'] for r in anomalous}
              assert len(guard_keys)==48
              assert all(cfg['prod_mult'][key]==.15 and cfg['player_db'][key]['role']=='Speculative' for key in guard_keys)
              guard_rows=[];guard_sim=[]
              for key in sorted(guard_keys):
                  current=originals[key]
                  guard_rows.append({'player':key,'pos':current['pos'],'role':current['role'],
                    'frozen_raw_at_release':cfg['prod_mult'][key],
                    'frozen_effective_role_floor':cfg['role_mult'][current['role']],
                    'baseline_fv_unchanged':current['cal20_fv'],
                    'rule':'for_legacy_0p15_nohistory_key_only__max(raw,role_floor)',
                    'existing_production_fv_changed':'FALSE','not_deployed':'TRUE'})
              for row in monotone_rows:
                  key=row['player'];old=cfg['prod_mult'].get(key)
                  if old is None:continue
                  pos=row['pos'];role=row['role'];info=cfg['player_db'][key]
                  def future(raw):
                      eff,under=sv.production_multiplier(key,role,{key:raw},cfg['no_real_history'],cfg['role_mult'])
                      if key in guard_keys:
                          eff=max(raw,cfg['role_mult'].get(role,1.0))
                      am=sv.effective_age_multiplier(pos,info['age'],role,key,eff,under,cfg)
                      return math.floor(100*cfg['position_weight'].get(pos,1)*am*eff*55+.5)
                  now=future(old)
                  assert now==originals[key]['cal20_fv'],('Frozen legacy repair changed current FV',key)
                  plus001=future(min(1.55,old+.001));plus1=future(min(1.55,old*1.01));plus5=future(min(1.55,old*1.05))
                  bad=any(v<now for v in [plus001,plus1,plus5])
                  guard_sim.append({'player':key,'pos':pos,'role':role,
                    'in_frozen_0p15_rescue_cohort':str(key in guard_keys).upper(),
                    'current_fv_under_narrow_guard':now,
                    'fv_plus_raw_0p001':plus001,'fv_plus_raw_1pct':plus1,'fv_plus_raw_5pct':plus5,
                    'positive_raw_fv_decrease_after_guard':str(bad).upper(),
                    'not_deployed':'TRUE'})
              assert len(guard_sim)==len(monotone_rows)
              residual=sum(r['positive_raw_fv_decrease_after_guard']=='TRUE' for r in guard_sim)
              assert residual==0,('Frozen guard failed to fix all production monotonicity exceptions',residual)
              write_csv(out/'CAL21_48_Identity_Frozen_0p15_Monotonic_Guard_Proposal.csv',guard_rows)
              write_csv(out/'CAL21_536_Narrow_Guard_Monotonicity_Replay_Shadow.csv',guard_sim)
          
              # A mathematically continuous role floor eliminates the raw=0.15 cliff,
              # but affects other no-history prospects. Evaluate this alternative on ALL
              # 565 before anyone considers a production change: not a release proposal.
              role_rows=[]
              for row in full:
                  key=row['player'];old=cfg['prod_mult'].get(key);role=row['role']
                  current_eff=row['effective_production_multiplier']
                  proposed_eff=(max(old,cfg['role_mult'].get(role,1.0)) if
                      old is not None and key in cfg['no_real_history'] else current_eff)
                  if abs(proposed_eff-current_eff)>1e-11:
                      info=cfg['player_db'][key]
                      proposed_am=sv.effective_age_multiplier(info['pos'],info['age'],info['role'],key,
                        proposed_eff,old,cfg)
                      new_fv=math.floor(100*cfg['position_weight'].get(row['pos'],1)*proposed_am*proposed_eff*55+.5)
                  else:
                      new_fv=row['cal20_fv']
                  role_rows.append({'player':key,'pos':row['pos'],'role':role,'age':row['age'],
                    'baseline_fv':row['cal20_fv'],'full_role_floor_hypothetical_fv':new_fv,
                    'fv_delta':new_fv-row['cal20_fv'],
                    'applies_to_no_history':str(key in cfg['no_real_history']).upper(),
                    'old_raw':old if old is not None else '',
                    'old_effective':current_eff,'proposed_effective':proposed_eff,
                    'owner_feedback_case':str(key in OWNER).upper(),
                    'shadow_only_not_validated':'TRUE'})
              assert len(role_rows)==565
              role_changes=[r for r in role_rows if r['fv_delta']!=0]
              write_csv(out/'CAL21_Full_Role_Floor_Continuity_Alternative_565_Shadow.csv',role_rows)
              assert len(role_changes)==45,('Unexpected full-floor broad effect',len(role_changes))
          
              # The known 0.15 floor cliff (Ty Simpson) must be captured; otherwise
              # the diagnostic changed its semantics or the source candidate changed.
              ty=next(r for r in monotone_rows if r['player']=='ty simpson')
              assert ty['nonmonotone_at_tested_steps']=='TRUE' and ty['delta_plus_5pct']<0,ty
          
              write_csv(out/'CAL21_10_Owner_Directional_Anchors_READ_ONLY.csv',anchor_rows)
              write_csv(out/'CAL21_10_FV_Raw_Production_Sensitivity_NOT_PRICES.csv',sensitivity)
              write_csv(out/'CAL21_10_Nearest_Same_Position_Young_Peers.csv',cohort_peers)
              covered=[r for r in full if r['market_value']!='']
              assert len(covered)==504
              sparse=sum(int(r['voting_appearances_quote_snapshot'])<=3 for r in covered)
              huge=sum(float(r['market_to_fv_ratio'])>=2 or float(r['market_to_fv_ratio'])<=.5 for r in covered)
              sh12=sum(int(r['mv_shrink_prior12']) >= 2*int(r['cal20_fv']) or int(r['mv_shrink_prior12']) <=.5*int(r['cal20_fv']) for r in covered)
              sh25=sum(int(r['mv_shrink_prior25']) >= 2*int(r['cal20_fv']) or int(r['mv_shrink_prior25']) <=.5*int(r['cal20_fv']) for r in covered)
              groups=[]
              for pos in sorted(set(r['pos'] for r in full)):
                  this=[r for r in full if r['pos']==pos]
                  those=[r for r in this if r['market_value']!='']
                  groups.append({'position':pos,'pool_count':len(this),'market_coverage':len(those),
                     'low_voting_appearances_0_to_3':sum(int(r['voting_appearances_quote_snapshot'])<=3 for r in those),
                     'market_factor_ge_2_or_le_half':sum(float(r['market_to_fv_ratio'])>=2 or float(r['market_to_fv_ratio'])<=.5 for r in those),
                     'shrink25_extreme_factor_count':sum(int(r['mv_shrink_prior25']) >= 2*int(r['cal20_fv']) or int(r['mv_shrink_prior25']) <=.5*int(r['cal20_fv']) for r in those)})
              write_csv(out/'CAL21_FullPool_Position_Risk_And_Shrinkage_Audit.csv',groups)
              measures={'status':'PASS_READ_ONLY_OWNER_DIAGNOSTIC','source_green_run':RUN,'source_artifact':ARTIFACT,
                'source_manifest_sha256':sha(src/'candidate/model/releases/cal20-offense-core173-2026-10-20-v1/release.json'),
                'source_contract_sha256':sha(src/'review_contract.json'),
                'source_cal20_baseline_commit':release['base_git_commit'],
                'source_fv_as_of_date':release['as_of_fv_price_date'],
                'source_candidate_files_exact_hash_verified':8,
                'players':565,'cal20_offense_changed':173,'market_covered':504,
                'owner_anchor_count':10,'owner_labels_are_ordinal_not_numeric_targets':True,
                'n_voting_appearances_median_anchor':sorted(int(r['voting_appearances_quote_snapshot']) for r in anchor_rows)[4:6],
                'covered_players_with_0_to_3_quote_votes':sparse,
                'market_ratio_at_least_2x_or_at_most_half_fv':huge,
                'mv_shrinkage_prior12_remaining_extreme_ratios':sh12,
                'mv_shrinkage_prior25_remaining_extreme_ratios':sh25,
                'fv_sensitivity_rows_not_authorized':len(sensitivity),
                'players_tested_for_raw_monotonicity':len(monotone_rows),
                'nonmonotone_model_exceptions':len(anomalous),
                'owner_anchor_nonmonotone':sorted(set(OWNER)&{r['player'] for r in anomalous}),
                'narrow_identity_guard_player_count':len(guard_keys),
                'narrow_guard_current_price_changed_count':0,
                'narrow_guard_post_positive_raw_monotonicity_errors':residual,
                'naive_full_role_floor_additional_fv_changes':len(role_changes),
                'naive_full_role_floor_sonny_styles_fv':next(r['full_role_floor_hypothetical_fv'] for r in role_rows if r['player']=='sonny styles'),
                'vote_support_is_cal18_quote_proxy_not_cal19_marginal_market_effective_votes':True,
                'no_calibrated_objective_market_targets':True,
                'release_approved':False,'production_write_authorized':False,
                'market_scenarios_are_shadow_only':True,
