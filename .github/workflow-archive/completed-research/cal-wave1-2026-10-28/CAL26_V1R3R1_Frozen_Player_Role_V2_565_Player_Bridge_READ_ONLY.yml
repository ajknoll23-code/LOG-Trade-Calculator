name: CAL26 V1R3R1 - Frozen Player Role V2 565 Player Bridge READ ONLY

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r3r1-role-v2-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  role_v2_cal26_565_bridge:
    name: Pinned CAL25 565 baseline to frozen B42 role V2; 80 CAL26 FV controls; no writes
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout frozen B41F and B42 files read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact green CAL25 565-player source (no missing CAL26 V1R1 dependency)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal25-v1r1-source"
          gh run download 39599729663 \
            --repo "$GITHUB_REPOSITORY" \
            --name cal25-v1r1-565-fv-votes-mv-refit-research-READ-ONLY \
            --dir "$RUNNER_TEMP/cal25-v1r1-source"
          test -s "$RUNNER_TEMP/cal25-v1r1-source/CAL25_Manifest.json"
          test -s "$RUNNER_TEMP/cal25-v1r1-source/CAL25_All_565_Synchronized_Research_Shadow.csv"

      - name: Materialize frozen-model bridge and audited CAL26 feedback
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r3r1_role_bridge.py" <<'PY_CAL26_V1R3R1'
          #!/usr/bin/env python3
          """CAL26 V1R3R1 -- read-only application of frozen Player Role V2 B42 2026 shadow.

          Never changes the pricing engine, B41F, B42, or production assets. CAL26's 565
          unmatched/misidentified players retain their original role; only exact, unique,
          position-concordant identity joins receive a separately named candidate role.
          """
          from __future__ import annotations
          import argparse, base64, csv, gzip, hashlib, io, json, re, unicodedata
          from collections import Counter, defaultdict
          from pathlib import Path
          from bisect import bisect_right

          ROLE_ORDER = ('Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite')
          POSITIONS = ('QB','RB','WR','TE','DL','LB','DB','K')
          B42_BASE = Path('research/player-role-v2')
          B42_FILES = {
           'model': 'player_role_v2_b41f_final_model_snapshot.json',
           'decision': 'player_role_v2_b42_v4_scientific_decision.json',
           'witness': 'player_role_v2_b42_v4_shadow_refresh_witness.json',
           'parity': 'player_role_v2_b42_v4_implementation_parity.json',
           'shadow': 'player_role_v2_b42_v4_shadow_refresh.csv',
           'identity': 'player_role_v2_b42_v4_role_eligibility.csv',
          }
          SOURCE_CSV = 'CAL26_V1R3R1_565_Role_Source.csv'
          SOURCE_MANIFEST = 'CAL26_V1R3R1_Role_Source_Manifest.json'
          # Filled by generator with content of the already green V1R2 80-player owner audit.
          OWNER_GZ_B64 = ''
          OWNER_SHA = '58f95a38b7ea0900d9655a88eedb59c0e1b39cd075e3a43c58d61ac3cbd46dde'
          CAL25_RUN_ID = 39599729663
          CAL25_EXPECTED_SHA = {'CAL25_Manifest.json':'6f8f51801b3e0b5e74847a111cbba041d941f88f6264acfc3ec59b42017c5890', 'CAL25_All_565_Synchronized_Research_Shadow.csv':'81b4ce7ffca1a216c3ce22b81197b0aaa1e0b42aa9150694528206f8b8562eb6'}


          def require(check, message):
           if not check: raise AssertionError('CAL26_V1R3_DATA_INTEGRITY: ' + str(message))


          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()


          def load_json(path): return json.loads(Path(path).read_text(encoding='utf-8'))


          def load_csv(path):
           with Path(path).open(newline='', encoding='utf-8') as f: return list(csv.DictReader(f))


          def write_csv(path, rows, fields):
           with Path(path).open('w', newline='', encoding='utf-8') as f:
            w=csv.DictWriter(f, fieldnames=fields, extrasaction='ignore');w.writeheader();w.writerows(rows)


          def identity_key(s):
           """General punctuation/initials normalization, never a handpicked name alias."""
           s=''.join(x for x in unicodedata.normalize('NFKD',str(s or '')) if not unicodedata.combining(x)).casefold()
           tokens=re.findall(r'[a-z0-9]+',s)
           while tokens and tokens[-1] in ('jr','sr','ii','iii','iv','v'): tokens.pop()
           i=0;out=[]
           while i<len(tokens):
            if len(tokens[i])==1 and tokens[i].isalpha():
             j=i
             while j<len(tokens) and len(tokens[j])==1 and tokens[j].isalpha():j+=1
             if j-i>=2: out.append(''.join(tokens[i:j]));i=j;continue
            out.append(tokens[i]);i+=1
           return ' '.join(out)


          def owner_feedback():
           blob=gzip.decompress(base64.b64decode(OWNER_GZ_B64))
           require(hashlib.sha256(blob).hexdigest()==OWNER_SHA,'owner feedback SHA changed')
           rows=list(csv.DictReader(io.StringIO(blob.decode('utf-8'))))
           require(len(rows)==80,'80 owner feedback rows required')
           require(len({(identity_key(r['player']),r['position']) for r in rows})==80,'owner identities not unique')
           ratings=Counter(r['cal26_rating'] for r in rows)
           require(ratings=={'Low':60,'Correct':18,'High':2},f'owner ratings changed: {ratings}')
           return {(identity_key(r['player']),r['position']):r for r in rows}




          def build_source_cal25(cal25, out):
           """Use the existing green 565-player model inputs; do not invent CAL26 V1R1 proposal FVs."""
           cal25,out=Path(cal25),Path(out)
           out.mkdir(parents=True,exist_ok=True)
           for name,digest in CAL25_EXPECTED_SHA.items():
            f=cal25/name
            require(f.is_file(), 'missing pinned CAL25 source '+name)
            require(sha(f)==digest, 'pinned CAL25 source SHA differs '+name)
           man=load_json(cal25/'CAL25_Manifest.json')
           require(man['status']=='PASS_CAL25_FROZEN_DATE_FULL_POOL_RESEARCH_ONLY','CAL25 source no longer green research')
           require(man['player_count']==565 and man['deployment_authorized'] is False,'CAL25 population or production state drift')
           require(man['as_of_date_utc']=='2026-10-21','CAL25 source date drift')
           rows=load_csv(cal25/'CAL25_All_565_Synchronized_Research_Shadow.csv')
           owner=owner_feedback()
           require(len(rows)==565 and len({(identity_key(r['player']),r['position']) for r in rows})==565,'CAL25 565 identity drift')
           mapped=[];n=0
           for x in rows:
            player,pos=x['player'],x['position']
            require(pos in POSITIONS and x['role'] in ROLE_ORDER,'CAL25 unknown position or role '+player)
            fv=int(x['live_fv_pinned'])
            o=owner.get((identity_key(player),pos))
            if o:
             require(fv==int(o['current_fv']),'Owner vs green CAL25 base FV drift '+player)
             proposed=int(o['cal26_proposed_fv']);n+=1
            else: proposed=''
            mapped.append({'player':player,'position':pos,'role':x['role'],'current_fv':fv,
                           'cal26_proposed_fv':proposed,'cal26_price_source':('CAL26_OWNER_REVIEWED_80' if o else 'NO_CAL26_PROPOSAL_AVAILABLE'),
                           'role_source':'CAL25_GREEN_565_SOURCE'})
           require(n==80,'Expected 80 reviewed owner prices in CAL25 player pool')
           write_csv(out/SOURCE_CSV,mapped,list(mapped[0]))
           roleman={'status':'CAL26_V1R3R1_PINNED_CAL25_ROLE_INPUT_READ_ONLY','player_count':565,
                    'asof_date':'2026-10-21','deployment_authorized':False,'production_files_mutated':0,
                    'source_cal25_green_run_id':CAL25_RUN_ID,
                    'source_cal25_manifest_sha256':CAL25_EXPECTED_SHA['CAL25_Manifest.json'],
                    'source_cal25_csv_sha256':CAL25_EXPECTED_SHA['CAL25_All_565_Synchronized_Research_Shadow.csv'],
                    'owner_reviewed_prices_preserved':80,'owner_accepted_prices_preserved':18,
                    'nonreviewed_cal26_proposal_available':False,
                    'price_policy':'Preserve 565 CAL25 baseline FVs; CAL26 V1R1 proposal absent, show proposed FV only for 80 owner-reviewed records',
                    'source_output_sha256':sha(out/SOURCE_CSV)}
           (out/SOURCE_MANIFEST).write_text(json.dumps(roleman,sort_keys=True,indent=2)+'\n')
           print('CAL26 V1R3R1 role source PASS: 565 CAL25 role inputs, 80 reviewed FV proposals, 485 proposal-unavailable')

          def tier_validate(shadow, model):
           require(model['status']=='FINAL_2019_2024_MODEL_WEIGHTS_FROZEN_BEFORE_WEEK4_AND_2025_HOLDOUT','B41F frozen status drift')
           require(model['production_change_authorized'] is False,'B41F model unexpectedly authorized')
           for r in shadow:
            pos=r['position'];require(pos in model['position_models'],f'unknown modeled position {pos}')
            m=model['position_models'][pos]
            thresholds=[float(x) for x in m['frozen_tier_thresholds']]
            require(len(thresholds)==6 and thresholds==sorted(thresholds),'invalid frozen thresholds '+pos)
            require(m['role_order']==list(ROLE_ORDER),'model role order drift')
            score=float(r['model_score'])
            require(0<=score<=1,'score outside [0,1]')
            idx=bisect_right(thresholds,score)
            require(idx==int(r['tier_index']) and ROLE_ORDER[idx]==r['role_tier'],f'frozen score/tier mismatch {r["gsis_id"]}')


          def main(source, repo, out):
           out=Path(out);out.mkdir(parents=True,exist_ok=True); repo=Path(repo);source=Path(source)
           base=repo/B42_BASE; files={k:base/v for k,v in B42_FILES.items()}
           for k,p in files.items():require(p.is_file(),f'missing frozen repository input {k}: {p}')
           for name in (SOURCE_CSV,SOURCE_MANIFEST):require((source/name).is_file(),'missing CAL26 V1R1 artifact '+name)
           model=load_json(files['model']);witness=load_json(files['witness']);parity=load_json(files['parity']);decision=load_json(files['decision']);cal_manifest=load_json(source/SOURCE_MANIFEST)
           require(decision['result']=='SCIENTIFIC_STOP_B42_V4_OWNER_BLIND_ROLE_PARITY_FAILED','B42 original result unexpectedly changed')
           require(parity['exact_parity']['pass'] is True,'B42 B41J exact implementation oracle did not pass')
           require(parity['exact_parity']['tier_index_mismatches']==0 and parity['exact_parity']['role_tier_mismatches']==0,'B42 oracle tier mismatch')
           require(witness['implementation_parity_exact_pass'] is True,'B42 shadow not oracle verified')
           require(witness['model_or_tier_retuning_performed'] is False,'B42 retuned model unexpectedly')
           require(witness['role_inference_used_owner_identity'] is False,'B42 owner identity used')
           require(witness['role_inference_used_dynasty_team'] is False,'B42 team role assignment used')
           require(witness['role_inference_used_fantasy_roster_slot'] is False,'B42 fantasy slot affected role')
           require(witness['future_target_used'] is False,'B42 used future target')
           require(witness['shadow_refresh_sha256']==sha(files['shadow']),'B42 shadow SHA mismatch')
           require(witness['role_eligibility_sha256']==sha(files['identity']),'B42 identity SHA mismatch')
           require(cal_manifest['status']=='CAL26_V1R3R1_PINNED_CAL25_ROLE_INPUT_READ_ONLY','CAL26 role input manifest status mismatch')
           require(cal_manifest['player_count']==565,'CAL26 manifest player count mismatch')
           require(cal_manifest['deployment_authorized'] is False and cal_manifest['production_files_mutated']==0,'CAL26 V1R1 not read-only')
           require(cal_manifest['asof_date']=='2026-10-21','CAL25-derived role input unexpected source date')
           require(cal_manifest['source_output_sha256']==sha(source/SOURCE_CSV),'source-role SHA changed')
           require(cal_manifest['owner_reviewed_prices_preserved']==80 and cal_manifest['nonreviewed_cal26_proposal_available'] is False,'CAL26 source scope was misrepresented')
           shadow=load_csv(files['shadow']);eligible=load_csv(files['identity']);quotes=load_csv(source/SOURCE_CSV);owners=owner_feedback()
           require(len(quotes)==565 and len({(identity_key(r['player']),r['position']) for r in quotes})==565,'CAL26 565 key drift')
           require(len(shadow)==witness['shadow_refresh_rows'],'B42 shadow count witness drift')
           require(len({r['sleeper_id'] for r in shadow})==len(shadow),'B42 shadow Sleeper ID duplicates')
           require(len({r['gsis_id'] for r in shadow})==len(shadow),'B42 shadow GSIS ID duplicates')
           require(len({r['gsis_id'] for r in eligible})==len(eligible),'B42 eligible GSIS duplicates')
           require(all(int(r['origin_week'])==int(witness['latest_completed_week']) for r in shadow),'B42 role snapshot origin week mismatch')
           tier_validate(shadow,model)
           by_gsis={r['gsis_id']:r for r in eligible}
           name_candidates=defaultdict(list)
           for s in shadow:
            e=by_gsis.get(s['gsis_id'])
            require(e is not None, 'scored GSIS missing eligibility metadata')
            require(str(e['sleeper_id'])==str(s['sleeper_id']),'scored role mismatches eligible stable identity')
            require(e['position']==s['position'],'position drift B42 shadow/eligibility')
            require(str(e['identity_mapped']).lower() in ('true','1'),'shadow identity not mapped')
            key=(identity_key(e['player_name']),e['position'])
            require(bool(key[0]),'B42 blank named scored player')
            name_candidates[key].append((s,e))
           # Uniqueness must be tested across ALL eligible GSIS rows, not just scored rows.
           entire_eligible=Counter((identity_key(r['player_name']),r['position']) for r in eligible)
           cal26_key_counts=Counter((identity_key(r['player']),r['position']) for r in quotes)
           results=[];change_details=[];controls=[]
           statuses=Counter();positions=defaultdict(Counter)
           for q in quotes:
            player,pos=q['player'],q['position']; key=(identity_key(player),pos);existing=q['role']
            require(pos in POSITIONS,f'CAL26 unknown position: {pos}')
            require(existing in ROLE_ORDER,f'CAL26 invalid old role: {player}={existing}')
            matches=name_candidates.get(key,[])
            # Match name+model position only if globally unambiguous within source and target.
            if len(matches)==1 and entire_eligible[key]==1 and cal26_key_counts[key]==1:
             s,e=matches[0]
             new=s['role_tier'];status='MATCH_UNIQUE_CANONICAL_NAME_POSITION_WITH_VERIFIED_GSIS_SLEEPER'
             sleeper=s['sleeper_id'];gsis=s['gsis_id'];week=s['origin_week'];score=s['model_score']
             active=s['prior_active_games'];missing=s['frozen_feature_missing_count_before_imputation'];features=s['frozen_feature_count']
            elif len(matches)>1 or entire_eligible[key]>1 or cal26_key_counts[key]>1:
             new=existing;status='HOLD_IDENTITY_AMBIGUOUS';sleeper=gsis=week=score=active=missing=features=''
            else:
             new=existing;status='HOLD_NO_FROZEN_2026_MODEL_ROLE';sleeper=gsis=week=score=active=missing=features=''
            owner=owners.get(key)
            if owner:
             require(int(q['cal26_proposed_fv'])==int(owner['cal26_proposed_fv']),f'CAL26 vs V1R2 proposed FV changed {player}')
             require(int(q['current_fv'])==int(owner['current_fv']),f'CAL26 vs V1R2 current FV changed {player}')
            label=owner['cal26_rating'] if owner else 'Not reviewed'
            unchanged_value=int(q['cal26_proposed_fv']) if q['cal26_proposed_fv']!='' else None;original_value=int(q['current_fv'])
            require(bool(owner)==(unchanged_value is not None),f'CAL26 reviewed FV coverage ambiguous {player}')
            rank_diff=ROLE_ORDER.index(new)-ROLE_ORDER.index(existing)
            r={'player':player,'position':pos,'cal26_role_original':existing,
               'v2_candidate_role':new,'matched_frozen_model_role':(new if status.startswith('MATCH_') else ''),
               'role_tier_shift':rank_diff if status.startswith('MATCH_') else 0,
               'role_changed_in_shadow':str(new!=existing),
               'join_status':status,'b42_snapshot_origin_week':week,'b42_model_score':score,
               'b42_prior_active_games':active,'b42_missing_feature_count':missing,'b42_feature_count':features,
               'sleeper_id':sleeper,'gsis_id':gsis,'owner_rating_cal26_fv':label,
               'protect_accepted_fv':str(label=='Correct'),
               'current_fv_unchanged':original_value,'cal26_proposed_fv_unchanged':unchanged_value if unchanged_value is not None else '',
               'cal26_proposal_available':str(unchanged_value is not None),
               'role_research_only':True,'production_changed':False}
            results.append(r);statuses[status]+=1;positions[pos][status]+=1
            if new!=existing:change_details.append(r)
            if label=='Correct':
             require(unchanged_value==int(owner['cal26_proposed_fv']),'accepted control changed')
             controls.append(r)
           require(len(controls)==18,'exact 18 accepted controls must remain')
           require(all((str(r['cal26_proposed_fv_unchanged'])==next(str(q['cal26_proposed_fv']) for q in quotes if (identity_key(q['player']),q['position'])==(identity_key(r['player']),r['position']))) for r in results),'reviewed proposal FV drift')
           require(sum(r['cal26_proposal_available']=='True' for r in results)==80,'owner reviewed 80 FV proposals were not maintained')
           require(sum(statuses.values())==565,'CAL26 role coverage arithmetic drift')
           require(all(r['v2_candidate_role']==r['cal26_role_original'] for r in results if r['join_status'].startswith('HOLD_')),'unmatched fallback changed')
           require(all(r['role_tier_shift']==0 for r in results if not r['role_changed_in_shadow']=='True'),'unchanged shift not zero')
           write_csv(out/'CAL26_V1R3_565_Player_Role_V2_Bridge.csv',results,list(results[0]))
           write_csv(out/'CAL26_V1R3_Role_Changes_Only.csv',change_details,list(results[0]))
           write_csv(out/'CAL26_V1R3_18_Protected_FV_Controls.csv',controls,list(results[0]))
           write_csv(out/'CAL26_V1R3_Unmatched_And_Ambiguous.csv',[r for r in results if r['join_status'].startswith('HOLD_')],list(results[0]))
           anchors=['justin jefferson','cj stroud','marvin harrison','brian branch','matthew golden','george kittle']
           anchors_report={k:[{z:r[z] for z in ('player','position','cal26_role_original','v2_candidate_role','join_status','role_tier_shift','b42_snapshot_origin_week','owner_rating_cal26_fv')} for r in results if identity_key(r['player'])==k] for k in anchors}
           manifest={'stage':'CAL26_V1R3_FROZEN_ROLE_V2_SHADOW_BRIDGE_READ_ONLY',
            'result':'PASS_READ_ONLY_ROLE_INTEGRATION_DIAGNOSTIC',
            'total_cal26_players':565,'model_shadow_covered':sum(c for s,c in statuses.items() if s.startswith('MATCH_')),
            'model_shadow_uncovered':sum(c for s,c in statuses.items() if s.startswith('HOLD_')),
            'model_shadow_coverage_pct':round(100*sum(c for s,c in statuses.items() if s.startswith('MATCH_'))/565,2),
            'role_shadow_changes':len(change_details),'upgraded_role_candidates':sum(r['role_tier_shift']>0 for r in change_details),
            'downgraded_role_candidates':sum(r['role_tier_shift']<0 for r in change_details),
            'by_join_status':dict(statuses),'by_position':{p:dict(c) for p,c in sorted(positions.items())},
            'b42_role_snapshot_week':int(witness['latest_completed_week']),
            'b42_scientific_parity_B42_v4_original': 'STOP; read-only model-score evidence reused, B42 deployment gates not waived',
            'b42_shadow_snapshot_sha256':sha(files['shadow']),
            'b42_eligibility_snapshot_sha256':sha(files['identity']),
            'b41f_snapshot_sha256':sha(files['model']),
            'source_cal26_v1r1_manifest_sha256':sha(source/SOURCE_MANIFEST),
            'source_cal26_v1r1_csv_sha256':sha(source/SOURCE_CSV),
            'owner_feedback_sha256':OWNER_SHA,
             'cal26_proposal_coverage':80, 'cal26_unreviewed_proposals_unavailable':485,
             'role_input_mode':'CAL25_GREEN_BASELINE_AND_80_OWNER_ANNOTATED_CAL26_PROPOSALS',
            'role_v2_matched_coverage_is_not_role_correctness_estimate':True,
            'unmatched_kept_prior_role':True,'no_auto_fill_using_market_valuation':True,
            'frozen_model_refit':False,'fv_repricing_performed':False,'production_change_authorized':False,
            'production_files_changed':0,'owner_correct_fv_controls_preserved':18,
            'owner_feedback_used_for_role_assignment':False,
            'research_only_shadow_role_not_promoted_to_production':True,
            'priority_anchor_diagnostics':anchors_report}
           (out/'CAL26_V1R3_Role_Bridge_Manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
           lines=['# CAL26 V1R3 — Frozen Role V2 → CAL26 565-player bridge (read-only)','',
            '> B42 V4 had a scientific parity STOP. A verified shadow prediction can be used in a separate read-only CAL26 study; this run does not reverse B42 or authorize deployment.','',
            f'- **CAL26 coverage:** {manifest["model_shadow_covered"]}/565 ({manifest["model_shadow_coverage_pct"]}%) of the 565 pricing players, independently measured (NOT the earlier 467/484 roster rate).',
            f'- **Changed shadow roles:** {len(change_details)}; upgrades {manifest["upgraded_role_candidates"]}; downgrades {manifest["downgraded_role_candidates"]}.',
            f'- **Unmatched:** {manifest["model_shadow_uncovered"]}, all retain existing roles.',
            f'- **Frozen role snapshot:** 2026 Week {witness["latest_completed_week"]}; no claim to have refreshed through 2026 Week 6.',
            '- 18 accepted CAL26 FV proposals remain exact and unchanged; the 565 existing CAL25 baseline FVs are retained.',
             '- Only the 80 owner-reviewed CAL26 proposed prices are available; 485 unreviewed CAL26 proposed prices are deliberately blank, not fabricated.',
            '- Model identity joins require globally unique normalized names plus exact model position, verified GSIS→Sleeper mapping, frozen B41F tier recomputation, B42 shadow SHA and parity witness.',
            '- Low owner valuations do not mechanically lift model role. This study tests old/new roles independently of owner labels.',
            '', '## High-priority role lineage checks','',
            '| Player | CAL26 old role | Frozen Role V2 shadow | Join status |', '|---|---|---|---|']
           for anchor in anchors:
            for a in anchors_report[anchor]:lines.append(f'| {a["player"]} | {a["cal26_role_original"]} | {a["v2_candidate_role"]} | {a["join_status"]} |')
           lines +=['','## Release boundary','',
            'No production prices or role assignment changed. Source is the pinned CAL25 565 green run because CAL26 V1R1 has not run; only 80 owner-reviewed CAL26 proposal FVs are included, and other proposals are blank. B42 parity remains failed. Role coverage is not role accuracy.','']
           (out/'CAL26_V1R3_Role_Bridge_Review.md').write_text('\n'.join(lines),encoding='utf-8')
           print(json.dumps({'result':manifest['result'],'players':565,'covered':manifest['model_shadow_covered'],'changed':len(change_details),'uncovered':manifest['model_shadow_uncovered'],'accepted_controls':len(controls),'anchors':anchors_report},indent=2))


          if __name__=='__main__':
           p=argparse.ArgumentParser();p.add_argument('--source');p.add_argument('--repo');p.add_argument('--out',required=True);p.add_argument('--build-source-cal25');a=p.parse_args()
           if a.build_source_cal25: build_source_cal25(a.build_source_cal25,a.out)
           else:
            require(a.source and a.repo,'source and repo required to compute role bridge')
            main(a.source,a.repo,a.out)
          PY_CAL26_V1R3R1
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r3r1_role_bridge.py"

      - name: Build 565 role source from SHA-pinned CAL25 and preserve 80 reviewed CAL26 FVs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r3r1_role_bridge.py" \
            --build-source-cal25 "$RUNNER_TEMP/cal25-v1r1-source" \
            --out "$RUNNER_TEMP/cal26-v1r3r1-source"

      - name: Apply 2026 B42 frozen role shadow to all 565 baseline players
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r3r1_role_bridge.py" \
            --source "$RUNNER_TEMP/cal26-v1r3r1-source" \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/cal26-v1r3r1-output"
          cp "$RUNNER_TEMP/cal26-v1r3r1-source/CAL26_V1R3R1_Role_Source_Manifest.json" \
             "$RUNNER_TEMP/cal26-v1r3r1-output/"

      - name: Verify all 565 roles, retain 80 reviewed CAL26 FVs, protect 18 accepted prices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY_ROLE'
          import csv,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'cal26-v1r3r1-output'
          m=json.loads((out/'CAL26_V1R3_Role_Bridge_Manifest.json').read_text())
          rows=list(csv.DictReader((out/'CAL26_V1R3_565_Player_Role_V2_Bridge.csv').open(newline='')))
          protected=list(csv.DictReader((out/'CAL26_V1R3_18_Protected_FV_Controls.csv').open(newline='')))
          assert m['result']=='PASS_READ_ONLY_ROLE_INTEGRATION_DIAGNOSTIC'
          assert len(rows)==565 and m['model_shadow_covered']+m['model_shadow_uncovered']==565
          assert len(protected)==18 and m['owner_correct_fv_controls_preserved']==18
          assert sum(r['cal26_proposal_available']=='True' for r in rows)==80
          assert all(r['cal26_proposed_fv_unchanged']=='' for r in rows if r['cal26_proposal_available']=='False')
          assert all(r['v2_candidate_role']==r['cal26_role_original'] for r in rows if r['join_status'].startswith('HOLD_'))
          assert all(r['production_changed']=='False' for r in rows)
          assert m['production_files_changed']==0 and m['production_change_authorized'] is False
          print('PASS CAL26 V1R3R1:',m['model_shadow_covered'],'matched roles,',m['role_shadow_changes'],'role proposals,',m['model_shadow_uncovered'],'unmatched')
          PY_VERIFY_ROLE
          test -z "$(git status --porcelain --untracked-files=all)"
          cat "$RUNNER_TEMP/cal26-v1r3r1-output/CAL26_V1R3_Role_Bridge_Review.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'CAL26 V1R3R1 read-only: 565 baseline FVs unchanged; 80 owner-reviewed FV proposals preserved; 485 other proposals intentionally blank.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload role candidates and identity holds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R3R1-Frozen-Role-V2-565-Bridge-READ-ONLY
          path: ${{ runner.temp }}/cal26-v1r3r1-output/
          if-no-files-found: warn
          retention-days: 30
