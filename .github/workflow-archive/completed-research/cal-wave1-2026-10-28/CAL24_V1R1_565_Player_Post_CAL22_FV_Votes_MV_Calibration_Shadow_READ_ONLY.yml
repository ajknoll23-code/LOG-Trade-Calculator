name: CAL24 V1R1 - 565-Player Post-CAL22 FV Votes MV Calibration Shadow READ ONLY
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cal24-v1r1-readonly
  cancel-in-progress: false
jobs:
  cal24:
    name: Analyze deployed FV against CAL23 frozen research (no production changes)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout current main without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm clean deployed CAL22 source and nonmutating Python snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f model/releases/cal22-legacy-048-raw-floor-continuity-v1/release.json
          test -f scripts/artifacts/generated/fv_informed_estimate_cal15.json
          test -f scripts/artifacts/generated/market_values.json
          python3 scripts/validation/snapshot_values.py --selftest
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retrieve immutable green CAL23 V1R2 read-only evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cal24-cal23"
          gh run download 39521084465 --repo "$GITHUB_REPOSITORY" \
            --name cal23-v1r2-week6-rookie-replacement-565-player-READ-ONLY \
            --dir "${RUNNER_TEMP}/cal24-cal23"
          test -s "${RUNNER_TEMP}/cal24-cal23/CAL23_Manifest.json"
      - name: Materialize pinned full-pool analysis engine
        shell: bash
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/cal24_shadow.py" <<'PY_CAL24_ANALYZER'
          #!/usr/bin/env python3
          """CAL24 V1R1: full-565 post-CAL22 FV, FV+Votes and Market Value diagnostic only.
          No production writes, refitting, releases, or market-derived pricing.
          """
          import argparse
          import collections
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          from pathlib import Path
          from datetime import datetime, timezone

          SOURCE_HASHES={
           'CAL23_Manifest.json':'a3abda6da7f2aae2c9130e19e7fdd7df8b15ff905d4f2b59a1a5f6680c55a886',
           'CAL23_Full_565_Study_Coverage_READ_ONLY.csv':'8695837d0be049d5e08cb2d47e15c2c7e5746d3e6a76a284cfa330afee053d96',
           'CAL23_All_Rookie_FrozenPrior_Transfers_READ_ONLY.csv':'022434067637759f197a839533db9802b2990246f5f0666219f1e3e8b6cbc16f',
           'CAL23_Ten_Owner_Players_FV_Shadow_READ_ONLY.csv':'d528293a80eff9d7037ec85c44502bdcd5d8cf0f6d82e06006a091c4304496d6',
           'CAL23_Replacement_Position_Control_Comparison.csv':'eb653adf38a8f9d2d98b5af1ee9b718db71c913806bff66f2c2f5f6c4e7c155d',
          }
          SRC_RUN=39521084465
          EXCLUSIONS={'joe mixon'}  # Retired; preserve audit identity, exclude trade suggestions.


          def digest(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def read_csv(path):
           with Path(path).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))

          def write_csv(path,rows,columns):
           with Path(path).open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=columns,extrasaction='ignore');w.writeheader();w.writerows(rows)

          def number(x):
           return int(x) if x is not None and str(x).strip()!='' else None

          def money(x):
           if x is None:return None
           try:return int(round(float(x)))
           except (ValueError,TypeError):return None

          def main(repo,source,out):
           repo,source,out=Path(repo),Path(source),Path(out);out.mkdir(parents=True,exist_ok=True)
           for fname,expected in SOURCE_HASHES.items():
            assert digest(source/fname)==expected,('CAL23 pinned source hash drift',fname)
           manifest=json.loads((source/'CAL23_Manifest.json').read_text());assert manifest['status']=='READ_ONLY_WEEK6_SHADOW_AND_MODEL_COMPARISON' and manifest['cal20_player_count']==565
           release_path=repo/'model/releases/cal22-legacy-048-raw-floor-continuity-v1/release.json'
           release=json.loads(release_path.read_text())
           assert release['guard_key_count']==48 and release['no_current_price_changes'] and release['cal20_release_approved'] is False
           snap_path=repo/'scripts/validation/snapshot_values.py'
           spec=importlib.util.spec_from_file_location('cal24_live_snap',snap_path)
           sv=importlib.util.module_from_spec(spec);spec.loader.exec_module(sv)
           cfg=sv.load_from_html(repo/'index.html')
           assert len(cfg['cal22_keys'])==48 and sorted(cfg['cal22_keys'])==sorted(release['frozen_keys'])
           assert len(cfg['player_db'])==565
           baseline=sv.compute_all_values(cfg)
           assert len(baseline)==565
           changed_since_guard=digest(repo/'index.html')!=release['candidate_index_sha256']
           historical=read_csv(source/'CAL23_Full_565_Study_Coverage_READ_ONLY.csv')
           assert len(historical)==565 and {r['player'] for r in historical}==set(baseline)
           frozen_by_player={r['player']:r for r in historical}
           rookie=read_csv(source/'CAL23_All_Rookie_FrozenPrior_Transfers_READ_ONLY.csv')
           assert len(rookie)==285
           rookie_30=[r for r in rookie if r['weight']=='0.30'];assert len(rookie_30)==95
           by_rookie={r['player']:r for r in rookie_30}
           anchors=read_csv(source/'CAL23_Ten_Owner_Players_FV_Shadow_READ_ONLY.csv')
           assert len(anchors)==10
           owner={r['player']:r['owner_fv_assessment'] for r in anchors}
           replacement=read_csv(source/'CAL23_Replacement_Position_Control_Comparison.csv')
           assert len(replacement)==21
           replace_index={(r['position'],r['variant']):r for r in replacement}
           quote=json.loads((repo/'scripts/artifacts/generated/fv_informed_estimate_cal15.json').read_text())
           market=json.loads((repo/'scripts/artifacts/generated/market_values.json').read_text())
           assert len(quote['players'])==565 and len(market['players'])>=450
           assert set(quote['players'])==set(baseline)

           full=[];uplift=[];rescue=[]
           for key in sorted(baseline):
            x=baseline[key];prior=frozen_by_player[key];r=by_rookie.get(key)
            q=quote['players'][key];m=market['players'].get(key,{})
            f=int(x['value']);quote_fv=int(q['fundamental_value']);qt=int(q['fv_informed_estimate'])
            mv=money(m.get('market_value'))
            previous=int(prior['cal20_green_fv_not_deployed'])
            primary='OUTSIDE_FROZEN_ROOKIE95'
            raw_shadow=None;unbounded=None;bounded=None;delta=None
            if r:
             primary=r['decision']
             if primary in {'INVESTIGATE_FV_UPLIFT','HOLD_MONOTONICITY_CLIFF'}:
              # This is an additive *frozen preseason prior sensitivity*, not a validated update.
              raw_delta=r['frozen_raw_delta'];current=cfg['prod_mult'].get(key)
              cal23_current=r['current_cal20_raw']
              if not raw_delta or current is None or not cal23_current:
               primary='HOLD_MISSING_SCENARIO_INPUT'
              else:
               source_drift=abs(current-float(cal23_current))>1e-7
               raw_shadow=min(1.55,max(0.15,current+float(raw_delta)))
               proxy=dict(cfg);proxy['prod_mult']=dict(cfg['prod_mult']);proxy['prod_mult'][key]=raw_shadow
               # Uses live *deployed* CAL22 guard and age logic, not pre-CAL22 CAL20 estimates.
               result=sv.compute_all_values(proxy)[key]
               unbounded=result['value']
               if source_drift:primary='HOLD_CURRENT_RAW_SOURCE_DRIFT'
               elif unbounded<f:primary='HOLD_MONOTONICITY_UNEXPECTED'
               elif unbounded==f:primary='NO_POST_CAL22_FV_GAIN'
               else:
                # Caps are an intentionally conservative REVIEW SCENARIO, not a validated market target.
                bounded=min(unbounded,math.floor(f*1.25+0.5),f+1000)
                if owner.get(key) in {'about_right','slightly_high','too_high'}:
                 primary='HOLD_OWNER_PRICE_PROTECTION'
                 bounded=f
                else:primary='REVIEW_BOUNDED_ROOKIE_PRIOR'
                delta=bounded-f
            rr=replace_index.get((x['pos'],'full_phase2_leaders'))
            replace_primary=rr['primary_relative_production_mae_delta_vs_control'] if rr else None
            replace_secondary=rr['secondary_relative_total_points_mae_delta_vs_control'] if rr else None
            row={
             'player':key,'position':x['pos'],'role':x['role'],'age':x['age'],
             'live_cal22_fv':f,'cal23_cal20_preview_fv':previous,
             'live_minus_cal20_preview_fv':f-previous,
             'current_fv_votes_display_only':qt,
             'fv_votes_frozen_fundamental':quote_fv,
             'fv_votes_base_diff_from_live':quote_fv-f,
             'fv_votes_ballot_appearances':q.get('ballot_appearances'),
             'fv_votes_evidence_band':q.get('evidence_band'),
             'market_value_display_only':mv,
             'market_rating_evidence_present':mv is not None,
             'market_minus_live_fv':mv-f if mv is not None else None,
             'market_minus_fv_votes':mv-qt if mv is not None else None,
             'in_frozen_rookie_95':key in by_rookie,
             'in_frozen_replacement_518':prior['in_frozen_replacement518']=='TRUE',
             'replacement_real_history_eligible':prior['replacement_primary_real_history_eligible']=='TRUE',
             'replacement_primary_mae_delta':replace_primary,
             'replacement_secondary_mae_delta':replace_secondary,
             'owner_feedback':owner.get(key,'not_reviewed'),
             'cal24_review_action':primary,
             'frozen_w30_raw_delta':r['frozen_raw_delta'] if r else None,
             'cal24_raw_sensitivity':round(raw_shadow,9) if raw_shadow is not None else None,
             'cal24_unbounded_shadow_fv':unbounded,
             'cal24_bounded_shadow_fv':bounded,
             'cal24_bounded_delta':delta,
             'trade_suggestion_eligible':key not in EXCLUSIONS,
             'source_lineage_warning':'CAL23 CAL20 preview FV is not the deployed baseline' if f!=previous else '',
            }
            full.append(row)
            if primary=='REVIEW_BOUNDED_ROOKIE_PRIOR':uplift.append(row)
            if primary.startswith('HOLD_') or (abs(row['market_minus_live_fv'] or 0)>=3000):rescue.append(row)
           assert len(full)==565
           assert sum(r['in_frozen_rookie_95'] for r in full)==95
           assert sum(r['in_frozen_replacement_518'] for r in full)==518
           assert all(r['cal24_bounded_delta'] is None or r['cal24_bounded_delta']>=0 for r in full)
           assert all(r['cal24_bounded_shadow_fv'] is None or r['cal24_bounded_shadow_fv']<=r['cal24_unbounded_shadow_fv'] for r in full)
           assert all(r['cal24_bounded_shadow_fv'] is None or r['cal24_bounded_shadow_fv']-r['live_cal22_fv']<=1000 for r in full)
           assert all(r['cal24_bounded_shadow_fv'] is None or r['cal24_bounded_shadow_fv']<=math.floor(r['live_cal22_fv']*1.25+0.5) for r in full)
           assert all(r['cal24_review_action']!='REVIEW_BOUNDED_ROOKIE_PRIOR' for r in full if r['owner_feedback'] in {'about_right','slightly_high','too_high'})
           fields=list(full[0]);write_csv(out/'CAL24_565_Full_Pool_Post_CAL22_Shadow_READ_ONLY.csv',full,fields)
           write_csv(out/'CAL24_Rookie_30pct_Bounded_Review_READ_ONLY.csv',sorted(uplift,key=lambda x:-(x['cal24_bounded_delta'] or 0)),fields)
           write_csv(out/'CAL24_Rescue_and_Disagreement_Queue_READ_ONLY.csv',sorted(rescue,key=lambda x:-abs(x['market_minus_live_fv'] or 0)),fields)
           positive_diff=sum(r['fv_votes_base_diff_from_live']!=0 for r in full)
           model_diff=sum(r['live_minus_cal20_preview_fv']!=0 for r in full)
           counts=dict(collections.Counter(r['cal24_review_action'] for r in full))
           market_n=sum(r['market_rating_evidence_present'] for r in full)
           md={
            'status':'CAL24_V1R1_READ_ONLY_POST_CAL22_FULL_POOL_SHADOW',
            'approved_for_production':False,'production_files_mutated':0,'pricing_changes_applied':0,
            'repository_head_recorded_at_run':True,'generated_utc':datetime.now(timezone.utc).isoformat(),
            'source_cal23_green_run':SRC_RUN,'source_cal23_pinned_sha256':SOURCE_HASHES,
            'cal22_release_id':release['release_id'],'cal22_guard_key_count':len(cfg['cal22_keys']),
            'live_index_sha256':digest(repo/'index.html'),'cal22_release_index_sha256':release['candidate_index_sha256'],
            'live_index_drift_since_cal22_release':changed_since_guard,
            'players_covered':len(full),'rookies_compared':len(rookie_30),
            'replacement_research_players':sum(r['in_frozen_replacement_518'] for r in full),
            'fv_votes_rows':len(quote['players']),'market_value_rows':market_n,
            'fv_vs_cal20_preview_player_differences':model_diff,
            'live_fv_vs_quote_embedded_fundamental_differences':positive_diff,
            'actions':counts,'provisional_bounded_uplift_review_count':len(uplift),
            'provisional_total_fv_delta_not_deployed':sum(r['cal24_bounded_delta'] or 0 for r in uplift),
            'owner_anchors':{key:{'feedback':owner[key],'live_fv':next(r for r in full if r['player']==key)['live_cal22_fv'],
                                  'review_action':next(r for r in full if r['player']==key)['cal24_review_action']} for key in owner},
            'governance':{'market_value_not_a_target':True,'fv_votes_not_refitted':True,
             'no_2026_outcome_refitting':True,'replacement_ratios_not_translated_to_fv':True,
             'caps_are_sensitivity_not_prevalidated':True,
             'market_value_and_votes_output_are_current_existing_stored_artifacts_not_new_prices':True,
             'cal20_preview_baseline_not_assumed_to_be_live':True},
           }
           (out/'CAL24_Manifest.json').write_text(json.dumps(md,indent=2,sort_keys=True)+'\n')
           summary=[
           '# CAL24 V1R1 — Full 565-player post-CAL22 valuation research preview','',
           '**Research only: production remains unchanged.**','',
           f'- Deployed CAL22 guard: {len(cfg["cal22_keys"])} fixed keys. Live model players: {len(full)}.',
           f'- CAL23 comparison is a NOT-DEPLOYED CAL20 preview; {model_diff} player FVs differ from present live calculation.',
           f"- Current quote's embedded fundamental differs from live formula for {positive_diff} players; do not infer FV+Votes is auto-synchronized.",
           f'- Existing market values populated for {market_n} player identities; use only as independent diagnostics, not objective labels.',
           f'- 30% frozen rookie-prior cohort: 95; eligible bounded review ideas: {len(uplift)}; sum of unapproved hypothetical increases: {md["provisional_total_fv_delta_not_deployed"]}.',
           f'- Research-only actions: {json.dumps(counts,sort_keys=True)}.',
           '- **Bounded review scenario:** frozen 30% prior delta applied to the current CAL22 raw production input, with a +25%/+1000 maximum, and an owner-protected hold. Those limits are *not* statistically established.',
           '- 21 replacement variant/position comparisons are retained but **not** multiplied into per-player FV. The study is future-production calibration, not a transferable price-ratio model.',
           '- Frozen Week 1–6 evaluations are research data, not unseen Week 7 outcomes. This is a calibration preview, not a holdout-validated production release.',
           '- A historical owner label is not considered approval to change live player FV. Existing stored FV+Votes estimates and market ratings are displayed unchanged.',
           '- Retired Joe Mixon remains visible for audit continuity but is excluded from trade suggestions.','',
           '## Highest review-priority bounded FV scenarios','',
           '| Player | Live FV | Bounded diagnostic | Increase | Owner feedback |','|---|---:|---:|---:|---|']
           for row in sorted(uplift,key=lambda r:-(r['cal24_bounded_delta'] or 0))[:20]:
            summary.append(f"| {row['player'].title()} | {row['live_cal22_fv']:,} | {row['cal24_bounded_shadow_fv']:,} | +{row['cal24_bounded_delta']:,} | {row['owner_feedback']} |")
           summary+=['','## Next release decision','',
           'Use CAL24 to select a **proper new FV candidate** with an independent post-freeze evaluation, peer-relative owner checks, explicit vote-refit methodology and refreshed MV source policy. Do not push shadow figures automatically.',
           'The historical CAL20 FV+Votes file and MV file are included as diagnostic columns, not updated or synchronized by this workflow. A downstream release requires recomputing them and testing full quote/market parity.',
           ]
           (out/'CAL24_Summary.md').write_text('\n'.join(summary)+'\n')
           print(json.dumps({'status':md['status'],'players':len(full),'review_candidates':len(uplift),'model_differences_vs_cal20_preview':model_diff,'quote_embedded_drift':positive_diff,'actions':counts},indent=2))

          if __name__=='__main__':
           p=argparse.ArgumentParser()
           p.add_argument('--repo',required=True);p.add_argument('--source',required=True);p.add_argument('--out',required=True)
           a=p.parse_args();main(a.repo,a.source,a.out)
          PY_CAL24_ANALYZER
          python3 -m py_compile "${RUNNER_TEMP}/cal24_shadow.py"
      - name: Analyze all players and independently validate non-release artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/cal24_shadow.py" \
            --repo . \
            --source "${RUNNER_TEMP}/cal24-cal23" \
            --out "${RUNNER_TEMP}/cal24-results"
          python3 - <<'PY_CAL24_REPLAY_CHECK'
          import csv,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'cal24-results'
          m=json.loads((p/'CAL24_Manifest.json').read_text())
          assert m['status']=='CAL24_V1R1_READ_ONLY_POST_CAL22_FULL_POOL_SHADOW'
          assert m['approved_for_production'] is False
          assert m['production_files_mutated']==0 and m['pricing_changes_applied']==0
          assert m['players_covered']==565 and m['rookies_compared']==95
          assert m['cal22_guard_key_count']==48 and m['replacement_research_players']==518
          with (p/'CAL24_565_Full_Pool_Post_CAL22_Shadow_READ_ONLY.csv').open(newline='') as f:
            full=list(csv.DictReader(f))
          assert len(full)==565 and len({r['player'] for r in full})==565
          assert sum(r['cal24_review_action']=='REVIEW_BOUNDED_ROOKIE_PRIOR' for r in full)==m['provisional_bounded_uplift_review_count']
          assert all(r['trade_suggestion_eligible']=='False' for r in full if r['player']=='joe mixon')
          assert all(r['current_fv_votes_display_only'] and r['live_cal22_fv'] for r in full)
          print('CAL24 independently replay-checked 565 rows and read-only invariants')
          PY_CAL24_REPLAY_CHECK
          test -z "$(git status --porcelain --untracked-files=all)" || { echo 'ERROR: repository mutated by read-only analysis'; exit 1; }
          cat "${RUNNER_TEMP}/cal24-results/CAL24_Summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'CAL24 PREVIEW PASS: no writes or pricing changes; historical FV+Votes and market values are display-only'
      - name: Upload complete read-only full-pool evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cal24-v1r1-post-cal22-565-player-valuation-research-READ-ONLY
          path: ${{ runner.temp }}/cal24-results/
          retention-days: 30
          if-no-files-found: warn
