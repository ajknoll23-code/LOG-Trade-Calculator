# PREFLIGHTED: B17D_SOURCE_ONLY_EXPANSION_REGIME_FIREWALL_2027_CAPTURE
name: B17D Draft Capital Outlook V1 - Source-Only Expansion Regime and Firewall Audit

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "15 13 7 10 *"
    - cron: "15 13 15 10 *"

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source_only_year_audit:
    if: github.event_name == 'workflow_dispatch'
    name: Source-only class ${{ matrix.class_year }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        class_year: [2008, 2009, 2010, 2011, 2012, 2013, 2026]

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install source-audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" \
            "beautifulsoup4==4.14.2"

      - name: Freeze source-only transport protocol before network access
        shell: bash
        env:
          CLASS_YEAR: ${{ matrix.class_year }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/b17d-artifact/${CLASS_YEAR}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          y=int(os.environ["CLASS_YEAR"])
          protocol={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17d_source_only_expansion_protocol",
              "frozen_before_network_access":True,

              "purpose":"Measure whether additional WalterFootball Walt preseason mock snapshots can be reconstructed without reading fantasy composition, actual NFL draft outcomes, capital values, or predictor-target association.",

              "candidate_class_years":[2008,2009,2010,2011,2012,2013,2026],
              "existing_accepted_years":list(range(2014,2024)),
              "existing_excluded_years":[2024,2025],
              "existing_year_status_may_not_be_changed_here":True,

              "anchor_rule":{
                  "calendar_year":"class_year_minus_1",
                  "window_start_month_day":"09-15",
                  "window_end_month_day":"10-15",
                  "target_month_day":"09-30",
                  "selection_rule":"Choose a source-coherent family with embedded Last update date closest to Sep 30; ties earlier date, then lexicographic URL.",
                  "selection_uses_outcomes":False,
                  "selection_uses_actual_nfl_draft_results":False,
                  "selection_uses_fantasy_positions":False,
                  "selection_uses_capital_values":False
              },

              "source_family":{
                  "publisher":"WalterFootball",
                  "author_intent":"Walt only",
                  "hosts":[
                      "https://walterfootball.com",
                      "https://debacled.walterfootball.com"
                  ]
              },

              "strict_v3_transport":{
                  "applies_to":[2026],
                  "roles":["base","round1_remainder","round2"],
                  "base_patterns":[
                      "draft{class_year}archiveMMDD.php",
                      "draft{class_year}archive_MMDD.php"
                  ],
                  "companion_rule":"Insert _1 and _2 before .php.",
                  "all_pages_http_2xx":True,
                  "all_pages_class_year_marker":True,
                  "all_pages_last_update_required":True,
                  "all_pages_last_update_must_match":True,
                  "base_min_entries":16,
                  "round1_remainder_min_entries":15,
                  "combined_min_entries":60
              },

              "legacy_transport":{
                  "applies_to":[2008,2009,2010,2011,2012,2013],
                  "reason":"Older WalterFootball layout/hosting conventions predate the split-page implementation used by B17A V3.",
                  "allowed_modes":[
                      "STRICT_SPLIT3",
                      "LEGACY_SINGLE_DOCUMENT"
                  ],
                  "STRICT_SPLIT3":"Same requirements as strict_v3_transport.",
                  "LEGACY_SINGLE_DOCUMENT":{
                      "only_considered_if_no_strict_split3_family_is_found":True,
                      "http_2xx":True,
                      "class_year_marker":True,
                      "last_update_required":True,
                      "last_update_inside_anchor_window":True,
                      "minimum_sequential_mock_entries":60
                  },
                  "legacy_single_document_is_transport_feasibility_only":True,
                  "legacy_single_document_does_not_auto_admit_class_to_c1":True
              },

              "parser":{
                  "entry_count_only":True,
                  "store_player_names":False,
                  "store_position_labels":False,
                  "store_team_names":False,
                  "entry_detection":"Count unique bold/strong labels matching Team: Player, POS, School in document order.",
                  "hybrid_position_values_are_not_interpreted":True
              },

              "firewall":{
                  "no_actual_draft_source_access":True,
                  "no_fantasy_position_counts":True,
                  "no_capital_values":True,
                  "no_predictor_target_correlation":True,
                  "no_model_fit":True,
                  "no_2027_score":True,
                  "no_production_change":True
              }
          }

          assert y in protocol["candidate_class_years"]
          p=Path(f"/tmp/b17d-artifact/{y}/protocol.json")
          p.write_text(json.dumps(protocol,indent=2,sort_keys=True)+"\n")
          print(f"PASS: B17D source-only protocol frozen for {y}.")
          PY

      - name: Audit candidate snapshot family without composition
        shell: bash
        env:
          CLASS_YEAR: ${{ matrix.class_year }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,os,re,time
          from datetime import date,timedelta,datetime,timezone
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin,urlparse

          import requests
          from bs4 import BeautifulSoup

          year=int(os.environ["CLASS_YEAR"])
          ROOT=Path(f"/tmp/b17d-artifact/{year}")
          RAW=ROOT/"raw"
          RAW.mkdir(parents=True,exist_ok=True)
          protocol=json.loads((ROOT/"protocol.json").read_text())

          anchor_year=year-1
          ws=date(anchor_year,9,15)
          we=date(anchor_year,10,15)
          target=date(anchor_year,9,30)
          is_legacy=year<=2013

          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B17D/1.0 (+source-only archive audit)",
              "Accept":"text/html,*/*;q=0.5",
              "Accept-Language":"en-US,en;q=0.9",
              "Accept-Encoding":"identity",
          })

          MONTHS={
              "jan":1,"january":1,"feb":2,"february":2,"mar":3,"march":3,
              "apr":4,"april":4,"may":5,"jun":6,"june":6,"jul":7,"july":7,
              "aug":8,"august":8,"sep":9,"sept":9,"september":9,
              "oct":10,"october":10,"nov":11,"november":11,
              "dec":12,"december":12
          }

          def get(url):
              attempts=[]
              last_error=None
              for i,delay in enumerate([0,1,3],1):
                  if delay: time.sleep(delay)
                  try:
                      t0=time.time()
                      r=session.get(url,timeout=25,allow_redirects=True)
                      attempts.append({
                          "attempt":i,
                          "status_code":int(r.status_code),
                          "elapsed_seconds":round(time.time()-t0,3),
                          "final_url":r.url
                      })
                      if r.status_code not in {429,500,502,503,504}:
                          return r,attempts,None
                  except Exception as e:
                      last_error=f"{type(e).__name__}: {e}"
                      attempts.append({"attempt":i,"error":last_error})
              return None,attempts,last_error

          def decode(r):
              enc=r.encoding or "utf-8"
              try:return r.content.decode(enc,errors="replace")
              except LookupError:return r.content.decode("utf-8",errors="replace")

          def visible(html):
              soup=BeautifulSoup(html,"html.parser")
              return " ".join(soup.get_text(" ",strip=True).split())

          def last_update(html):
              candidates=[html]
              soup=BeautifulSoup(html,"html.parser")
              for tag in soup.find_all("meta"):
                  if str(tag.get("name","")).lower() in {"description","twitter:description"} or str(tag.get("property","")).lower() in {"og:description"}:
                      if tag.get("content"): candidates.append(str(tag.get("content")))
              candidates.append(visible(html))
              rx=re.compile(
                  r"Last\s+update\s*:\s*(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)?"
                  r"\s*,?\s*(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
                  r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                  r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)(20\d{2})",
                  re.I
              )
              for text in candidates:
                  m=rx.search(text)
                  if m:
                      key=m.group(1).lower().rstrip(".")
                      try:return date(int(m.group(3)),MONTHS[key],int(m.group(2)))
                      except ValueError:pass
              return None

          label_rx=re.compile(
              r"^\s*(?P<team>[^:]{2,100}):\s*(?P<player>.+?),\s*"
              r"(?P<pos>[A-Za-z0-9/-]{1,20}),\s*(?P<school>.+?)\s*$"
          )

          def entry_count(html):
              soup=BeautifulSoup(html,"html.parser")
              seen=set()
              n=0
              for b in soup.find_all(["b","strong"]):
                  txt=" ".join(b.get_text(" ",strip=True).replace("\xa0"," ").split())
                  m=label_rx.match(txt)
                  if not m: continue
                  # hash exact label but never persist label text
                  key=hashlib.sha256(txt.encode()).hexdigest()
                  if key in seen: continue
                  seen.add(key); n+=1
              return n

          def class_marker(html):
              t=visible(html).lower()
              return f"{year} nfl mock draft".lower() in t

          cache={}
          def inspect(url):
              if url in cache:return cache[url]
              r,attempts,error=get(url)
              rec={"url":url,"attempts":attempts,"error":error,"valid_http":False}
              if r is None or not (200<=r.status_code<300):
                  cache[url]=(rec,None)
                  return cache[url]
              raw=r.content or b""
              html=decode(r)
              rec.update({
                  "valid_http":True,
                  "status_code":int(r.status_code),
                  "final_url":r.url,
                  "raw_bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
                  "last_update_date":last_update(html).isoformat() if last_update(html) else None,
                  "class_year_marker":class_marker(html),
                  "entry_n":entry_count(html)
              })
              cache[url]=(rec,raw)
              return cache[url]

          def companions(base):
              assert base.lower().endswith(".php")
              stem=base[:-4]
              return {
                  "base":base,
                  "round1_remainder":stem+"_1.php",
                  "round2":stem+"_2.php"
              }

          def eval_split(base):
              roles=companions(base)
              pages={}
              raws={}
              for role,url in roles.items():
                  rec,raw=inspect(url)
                  pages[role]=rec
                  raws[role]=raw

              dates=[pages[r].get("last_update_date") for r in roles]
              same_date=all(dates) and len(set(dates))==1
              shared=date.fromisoformat(dates[0]) if same_date else None
              combined=sum(int(pages[r].get("entry_n") or 0) for r in roles)
              coherent=bool(
                  all(pages[r].get("valid_http") for r in roles)
                  and all((pages[r].get("raw_bytes") or 0)>=1000 for r in roles)
                  and all(pages[r].get("class_year_marker") for r in roles)
                  and same_date
                  and ws<=shared<=we
                  and (pages["base"].get("entry_n") or 0)>=16
                  and (pages["round1_remainder"].get("entry_n") or 0)>=15
                  and combined>=60
              )
              return {
                  "mode":"STRICT_SPLIT3",
                  "base_url":base,
                  "coherent":coherent,
                  "shared_last_update_date":shared.isoformat() if shared else None,
                  "distance_days":abs((shared-target).days) if shared else None,
                  "combined_entry_n":combined,
                  "pages":pages
              },raws

          def eval_single(base):
              rec,raw=inspect(base)
              d=date.fromisoformat(rec["last_update_date"]) if rec.get("last_update_date") else None
              coherent=bool(
                  rec.get("valid_http")
                  and (rec.get("raw_bytes") or 0)>=1000
                  and rec.get("class_year_marker")
                  and d is not None and ws<=d<=we
                  and (rec.get("entry_n") or 0)>=60
              )
              return {
                  "mode":"LEGACY_SINGLE_DOCUMENT",
                  "base_url":base,
                  "coherent":coherent,
                  "shared_last_update_date":d.isoformat() if d else None,
                  "distance_days":abs((d-target).days) if d else None,
                  "combined_entry_n":int(rec.get("entry_n") or 0),
                  "pages":{"base":rec}
              },{"base":raw}

          hosts=protocol["source_family"]["hosts"]
          index_records=[]
          discovered=set()

          # Index discovery first.
          for host in hosts:
              index_url=f"{host}/draft{year}archive.php"
              r,attempts,error=get(index_url)
              idx={
                  "url":index_url,
                  "attempts":attempts,
                  "error":error,
                  "status_code":int(r.status_code) if r is not None else None,
                  "discovered_base_n":0
              }
              if r is not None and 200<=r.status_code<300:
                  html=decode(r)
                  soup=BeautifulSoup(html,"html.parser")
                  for a in soup.find_all("a",href=True):
                      href=str(a.get("href"))
                      u=urljoin(r.url,href)
                      path=urlparse(u).path
                      if re.search(rf"/draft{year}archive_?\d{{4}}\.php$",path,re.I):
                          discovered.add(u)
                  idx["discovered_base_n"]=len(discovered)
              index_records.append(idx)

          # Evaluate discovered candidates, then deterministic daily fallback if none work.
          split_candidates=[]
          single_candidates=[]
          checked_bases=set()

          def evaluate_base(base):
              if base in checked_bases:return
              checked_bases.add(base)
              s,_=eval_split(base)
              split_candidates.append(s)
              if is_legacy:
                  one,_=eval_single(base)
                  single_candidates.append(one)

          for base in sorted(discovered):
              evaluate_base(base)

          coherent_split=[x for x in split_candidates if x["coherent"]]

          if not coherent_split:
              days=[]
              d=ws
              while d<=we:
                  days.append(d); d+=timedelta(days=1)
              days=sorted(days,key=lambda x:(abs((x-target).days),x))
              for d in days:
                  mmdd=d.strftime("%m%d")
                  bases=[]
                  for host in hosts:
                      bases.extend([
                          f"{host}/draft{year}archive{mmdd}.php",
                          f"{host}/draft{year}archive_{mmdd}.php"
                      ])
                  for base in sorted(set(bases)):
                      evaluate_base(base)
                  if any(x["coherent"] and x["shared_last_update_date"]==d.isoformat() for x in split_candidates):
                      break

          coherent_split=[x for x in split_candidates if x["coherent"]]
          selected=None
          selected_raws=None

          if coherent_split:
              selected=min(coherent_split,key=lambda x:(x["distance_days"],x["shared_last_update_date"],x["base_url"]))
              _,selected_raws=eval_split(selected["base_url"])
          elif is_legacy:
              # If strict split3 failed, finish the date sweep for legacy single-doc mode.
              days=[]
              d=ws
              while d<=we:
                  days.append(d); d+=timedelta(days=1)
              days=sorted(days,key=lambda x:(abs((x-target).days),x))
              for d in days:
                  mmdd=d.strftime("%m%d")
                  for host in hosts:
                      for base in sorted({
                          f"{host}/draft{year}archive{mmdd}.php",
                          f"{host}/draft{year}archive_{mmdd}.php"
                      }):
                          if base not in checked_bases:
                              checked_bases.add(base)
                              one,_=eval_single(base)
                              single_candidates.append(one)
                  if any(x["coherent"] and x["shared_last_update_date"]==d.isoformat() for x in single_candidates):
                      break
              coherent_single=[x for x in single_candidates if x["coherent"]]
              if coherent_single:
                  selected=min(coherent_single,key=lambda x:(x["distance_days"],x["shared_last_update_date"],x["base_url"]))
                  _,selected_raws=eval_single(selected["base_url"])

          selected_files={}
          if selected is not None and selected_raws:
              for role,raw in selected_raws.items():
                  if raw is None: continue
                  p=RAW/f"{role}.html"
                  p.write_bytes(raw)
                  selected_files[role]={
                      "path":str(p),
                      "sha256":hashlib.sha256(raw).hexdigest(),
                      "bytes":len(raw)
                  }

          result={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17d_source_only_year_result",
              "class_year":year,
              "anchor_year":anchor_year,
              "legacy_transport_allowed":is_legacy,
              "strict_split3_feasible":bool(coherent_split),
              "transport_feasible":selected is not None,
              "selected_mode":selected["mode"] if selected else None,
              "selected_base_url":selected["base_url"] if selected else None,
              "selected_shared_last_update_date":selected["shared_last_update_date"] if selected else None,
              "selected_distance_days":selected["distance_days"] if selected else None,
              "selected_combined_entry_n":selected["combined_entry_n"] if selected else 0,
              "selected_files":selected_files,
              "index_records":index_records,
              "bases_checked_n":len(checked_bases),
              "coherent_split3_n":len(coherent_split),
              "coherent_single_document_n":sum(x["coherent"] for x in single_candidates),
              "composition_values_stored":False,
              "fantasy_position_counts_computed":False,
              "actual_draft_source_accessed":False,
              "capital_values_computed":False,
              "predictor_target_association_opened":False,
              "model_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "retrieved_utc":datetime.now(timezone.utc).isoformat()
          }

          (ROOT/"result.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "class_year":year,
              "transport_feasible":result["transport_feasible"],
              "selected_mode":result["selected_mode"],
              "selected_date":result["selected_shared_last_update_date"],
              "distance_days":result["selected_distance_days"],
              "bases_checked_n":result["bases_checked_n"]
          },indent=2))
          PY

      - name: Upload source-only year evidence
        uses: actions/upload-artifact@v4
        with:
          name: b17d-year-${{ matrix.class_year }}
          path: /tmp/b17d-artifact
          if-no-files-found: error
          retention-days: 14

  reduce_audit_and_capture:
    if: github.event_name == 'workflow_dispatch'
    name: Reduce source expansion audit, ledger exposure, and capture 2027
    needs: source_only_year_audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install reducer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" \
            "beautifulsoup4==4.14.2"

      - name: Download all year evidence
        uses: actions/download-artifact@v4
        with:
          pattern: b17d-year-*
          path: /tmp/b17d-results
          merge-multiple: true

      - name: Guard B17 V2 pass and unopened association
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          s=json.loads((D/"b17_v2_historical_parse_and_target_feasibility_summary.json").read_text())
          m=json.loads((D/"b17_v2_manifest.json").read_text())

          assert s["decision"]=="PASS_B17_V2_HISTORICAL_PARSE_AND_TARGET_FEASIBILITY_AUTHORIZE_B18_TARGET_FUNCTION_AND_POWER_PREREGISTRATION_ONLY"
          assert s["joint_feasibility_pass"] is True
          assert s["joint_feasible_class_n"]==10
          assert s["joint_feasible_class_years"]==list(range(2014,2024))
          assert s["b18_target_function_and_power_preregistration_authorized"] is True

          assert m["predictor_target_correlation_computed"] is False
          assert m["scalar_target_function_computed"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          # Earlier B18 workflow was intentionally not executed.
          assert not (D/"b18").exists(), "B18 artifacts already exist; stop and audit before B17D."

          print("PASS: B17 V2 lineage guarded; real capital association remains unopened.")
          PY

      - name: Run repository regression before source-only reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Reduce source-only expansion and source-regime audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,re,shutil
          from collections import Counter
          from pathlib import Path

          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          OUT=D/"b17d"
          EXP=OUT/"source-expansion"
          OUT.mkdir(parents=True,exist_ok=True)
          EXP.mkdir(parents=True,exist_ok=True)

          root=Path("/tmp/b17d-results")
          years=[2008,2009,2010,2011,2012,2013,2026]
          results=[]

          # All matrix jobs must have run the exact same preregistration.
          protocol_hashes=set()
          for y in years:
              src=root/str(y)
              assert src.is_dir(),src
              p=src/"protocol.json"
              r=src/"result.json"
              assert p.is_file() and r.is_file()
              protocol_hashes.add(hashlib.sha256(p.read_bytes()).hexdigest())
              data=json.loads(r.read_text())
              assert data["class_year"]==y
              assert data["actual_draft_source_accessed"] is False
              assert data["fantasy_position_counts_computed"] is False
              assert data["capital_values_computed"] is False
              assert data["predictor_target_association_opened"] is False
              results.append(data)

              dst=EXP/str(y)
              if dst.exists(): shutil.rmtree(dst)
              shutil.copytree(src,dst)

          assert len(protocol_hashes)==1,protocol_hashes
          protocol=json.loads((root/"2008/protocol.json").read_text())
          (OUT/"b17d_source_only_protocol.json").write_text(
              json.dumps(protocol,indent=2,sort_keys=True)+"\n"
          )

          b17a=json.loads((D/"b17a_v3_snapshot_family_integrity_summary.json").read_text())
          assert b17a["coherent_class_years"]==list(range(2014,2024))

          def visible_from_path(path):
              html=Path(path).read_text(encoding="utf-8",errors="replace")
              soup=BeautifulSoup(html,"html.parser")
              return " ".join(soup.get_text(" ",strip=True).split())

          def classify(text):
              low=text.lower()
              author=(
                  "WALT_EXPLICIT"
                  if re.search(r"\b(?:by\s+)?walt\b",low)
                  else "WALTER_SOURCE_AUTHOR_UNCLEAR"
              )
              if "power rankings" in low:
                  method="POWER_RANKINGS"
              elif "official" in low and "draft order" in low:
                  method="OFFICIAL_DRAFT_ORDER"
              elif "draft order" in low:
                  method="OTHER_DRAFT_ORDER"
              elif "standings" in low:
                  method="STANDINGS"
              else:
                  method="UNKNOWN"
              return author,method

          regime=[]
          for year in range(2014,2024):
              fam=b17a["selected_families"][str(year)]
              path=fam["selected_files"]["base_1_16"]["path"]
              text=visible_from_path(path)
              author,method=classify(text)
              regime.append({
                  "class_year":year,
                  "status":"EXISTING_ACCEPTED",
                  "source_mode":"STRICT_SPLIT3",
                  "author_class":author,
                  "order_method_class":method,
                  "anchor_date":fam["shared_last_update_date"],
                  "distance_days":fam["distance_days"],
                  "composition_inspected":False
              })

          existing_method_mode=Counter(x["order_method_class"] for x in regime).most_common(1)[0][0]
          existing_author_mode=Counter(x["author_class"] for x in regime).most_common(1)[0][0]

          for r in results:
              year=r["class_year"]
              if not r["transport_feasible"]:
                  regime.append({
                      "class_year":year,
                      "status":"SOURCE_INFEASIBLE",
                      "source_mode":None,
                      "author_class":None,
                      "order_method_class":None,
                      "anchor_date":None,
                      "distance_days":None,
                      "regime_match_existing_modal":False,
                      "composition_inspected":False
                  })
                  continue

              copied=EXP/str(year)
              role="base"
              path=copied/"raw"/f"{role}.html"
              assert path.is_file(),path
              text=visible_from_path(path)
              author,method=classify(text)
              regime.append({
                  "class_year":year,
                  "status":"SOURCE_FEASIBLE_TRANSPORT_ONLY",
                  "source_mode":r["selected_mode"],
                  "author_class":author,
                  "order_method_class":method,
                  "anchor_date":r["selected_shared_last_update_date"],
                  "distance_days":r["selected_distance_days"],
                  "regime_match_existing_modal":bool(
                      author==existing_author_mode and method==existing_method_mode
                  ),
                  "composition_inspected":False
              })

          regime_summary={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17d_source_regime_audit",
              "existing_2014_2023_modal_author_class":existing_author_mode,
              "existing_2014_2023_modal_order_method_class":existing_method_mode,
              "classes":regime,
              "existing_acceptance_changed":False,
              "new_class_auto_admission_authorized":False,
              "composition_inspected":False,
              "actual_outcomes_inspected_for_selection":False,
              "c1_authorized":False,
              "production_change_authorized":False
          }
          (OUT/"b17d_source_regime_audit.json").write_text(
              json.dumps(regime_summary,indent=2,sort_keys=True)+"\n"
          )

          transport_feasible=[r["class_year"] for r in results if r["transport_feasible"]]
          strict_feasible=[r["class_year"] for r in results if r["strict_split3_feasible"]]
          legacy_single=[
              r["class_year"] for r in results
              if r["transport_feasible"] and r["selected_mode"]=="LEGACY_SINGLE_DOCUMENT"
          ]

          expansion={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17d_source_only_expansion_summary",
              "existing_accepted_class_years":list(range(2014,2024)),
              "existing_accepted_n":10,
              "candidate_years":years,
              "transport_feasible_years":transport_feasible,
              "transport_feasible_n":len(transport_feasible),
              "strict_v3_split3_feasible_years":strict_feasible,
              "legacy_single_document_transport_years":legacy_single,
              "maximum_source_reachable_n_before_regime_review":10+len(transport_feasible),
              "new_classes_auto_admitted":False,
              "regime_review_required_before_any_new_class_enters_power_n":True,
              "no_2024_2025_rescue_attempted":True,
              "predictor_target_association_opened":False,
              "capital_values_computed":False,
              "c1_authorized":False,
              "production_change_authorized":False
          }
          (OUT/"b17d_source_only_expansion_summary.json").write_text(
              json.dumps(expansion,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps(expansion,indent=2))
          PY

      - name: Write firewall and selection-index ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
