          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17D."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b17d/ \
            research/draft-capital-outlook-v1/archive/b17d-2027-anchor-captures/

          git diff --cached --check
          git commit -m "Audit Draft Capital Outlook legacy sources and capture 2027"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17D source-only audit committed."

  scheduled_2027_capture:
    if: github.event_name == 'schedule'
    name: Scheduled 2027 Walt anchor capture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" \
            "beautifulsoup4==4.14.2"

      - name: Capture only on frozen 2026 dates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from datetime import datetime,timezone,date
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          now=datetime.now(timezone.utc)
          allowed={(2026,10,7),(2026,10,15)}
          key=(now.year,now.month,now.day)
          if key not in allowed:
              print(f"NOOP: {key} is not a frozen B17D capture date.")
              Path("/tmp/b17d_noop").write_text("1\n")
              raise SystemExit(0)

          D=Path("research/draft-capital-outlook-v1")
          root=D/"archive/b17d-2027-anchor-captures"
          stamp=now.strftime("%Y-%m-%dT%H%M%SZ")
          out=root/stamp
          out.mkdir(parents=True,exist_ok=True)

          urls={
              "base_1_16":"https://walterfootball.com/draft2027.php",
              "round1_17_32":"https://walterfootball.com/draft2027_1.php",
              "round2_33_plus":"https://walterfootball.com/draft2027_2.php",
          }
          s=requests.Session()
          s.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B17D/1.0 (+scheduled 2027 archival capture)",
              "Accept":"text/html,*/*;q=0.5",
              "Accept-Encoding":"identity"
          })
          pages={}
          for role,url in urls.items():
              r=s.get(url,timeout=35,allow_redirects=True)
              r.raise_for_status()
              raw=r.content
              p=out/f"{role}.html"
              p.write_bytes(raw)
              pages[role]={
                  "url":url,
                  "final_url":r.url,
                  "status_code":r.status_code,
                  "bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
                  "raw_path":str(p)
              }

          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17d_2027_scheduled_raw_capture",
              "retrieved_utc":now.isoformat(),
              "pages":pages,
              "selection_rule_not_yet_applied":True,
              "fantasy_position_counts_computed":False,
              "capital_values_computed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (out/"capture_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print(f"PASS: scheduled 2027 raw capture written to {out}")
          PY

      - name: Commit scheduled capture if present
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -f /tmp/b17d_noop ]; then
            echo "NOOP: no scheduled capture commit."
            exit 0
          fi

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during scheduled B17D capture."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/draft-capital-outlook-v1/archive/b17d-2027-anchor-captures/
          git diff --cached --check
          git commit -m "Capture scheduled 2027 Walt anchor snapshot"
          git push origin HEAD:main
