                  "predictor_target_association_remains_unopened":True,
                  "rich_hill_capital_values_not_known_to_have_been_computed_in_frozen_lineage":len(suspicious)==0,
                  "historical_2014_2023_is_not_pristine_under_strict_marginal_blinding":True
              },
              "count_artifacts_read_only":[
                  "b17_v2_projected_parse_summary.json",
