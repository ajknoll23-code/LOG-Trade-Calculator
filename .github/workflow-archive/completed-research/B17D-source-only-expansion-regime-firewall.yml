              "",
              "The historical 2014-2023 cohort is explicitly treated as non-pristine under strict marginal blinding because projected and actual marginal fantasy-position counts were previously committed. The capital association remains unopened."
          ]
          (O/"b17d_report.md").write_text("\n".join(report)+"\n")

          files=[
              "b17d_source_only_protocol.json",
              "b17d_source_only_expansion_summary.json",
              "b17d_source_regime_audit.json",
              "b17d_firewall_and_exposure_ledger.json",
              "b17d_summary.json",
              "b17d_report.md",
          ]
          hashes={name:hashlib.sha256((O/name).read_bytes()).hexdigest() for name in files}
          manifest={
              "schema_version":1,
