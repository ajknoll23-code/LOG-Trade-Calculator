          )
          print("PASS: firewall exposure and selection-order ledger frozen.")
          PY

      - name: Capture exact current 2027 Walt family without scoring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,re,time
          from datetime import datetime,timezone,date
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          root=D/"archive/b17d-2027-anchor-captures"
          stamp=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H%M%SZ")
          out=root/stamp
          out.mkdir(parents=True,exist_ok=True)

          urls={
              "base_1_16":"https://walterfootball.com/draft2027.php",
              "round1_17_32":"https://walterfootball.com/draft2027_1.php",
              "round2_33_plus":"https://walterfootball.com/draft2027_2.php",
          }

          s=requests.Session()
          s.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B17D/1.0 (+2027 archival capture)",
              "Accept":"text/html,*/*;q=0.5",
              "Accept-Encoding":"identity"
          })

          rx=re.compile(
              r"(?:Last\s+update\s*:|Updated\s+)"
              r"\s*(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)?"
              r"\s*,?\s*(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
              r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
              r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)?(20\d{2})?",
              re.I
          )
          months={"jan":1,"january":1,"feb":2,"february":2,"mar":3,"march":3,"apr":4,"april":4,"may":5,
                  "jun":6,"june":6,"jul":7,"july":7,"aug":8,"august":8,"sep":9,"sept":9,"september":9,
                  "oct":10,"october":10,"nov":11,"november":11,"dec":12,"december":12}

          label_rx=re.compile(
              r"^\s*[^:]{2,100}:\s*.+?,\s*[A-Za-z0-9/-]{1,20},\s*.+?\s*$"
          )

          meta={}
          for role,url in urls.items():
              r=s.get(url,timeout=35,allow_redirects=True)
              r.raise_for_status()
              raw=r.content
              p=out/f"{role}.html"
              p.write_bytes(raw)
              html=raw.decode(r.encoding or "utf-8",errors="replace")
              soup=BeautifulSoup(html,"html.parser")
              vis=" ".join(soup.get_text(" ",strip=True).split())
              m=rx.search(vis)
              update=None
              if m:
                  key=m.group(1).lower().rstrip(".")
                  y=int(m.group(3)) if m.group(3) else 2026
                  update=date(y,months[key],int(m.group(2))).isoformat()

              seen=set()
              entry_n=0
              for b in soup.find_all(["b","strong"]):
                  t=" ".join(b.get_text(" ",strip=True).replace("\xa0"," ").split())
                  if label_rx.match(t):
                      h=hashlib.sha256(t.encode()).hexdigest()
                      if h not in seen:
                          seen.add(h); entry_n+=1

              meta[role]={
                  "url":url,
                  "final_url":r.url,
                  "status_code":r.status_code,
                  "bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
                  "parsed_update_date":update,
                  "entry_n":entry_n,
                  "raw_path":str(p)
              }

          dates=[x["parsed_update_date"] for x in meta.values()]
          capture={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17d_2027_walt_family_capture",
              "retrieved_utc":datetime.now(timezone.utc).isoformat(),
              "pages":meta,
              "all_three_update_dates_match":bool(all(dates) and len(set(dates))==1),
              "shared_update_date":dates[0] if all(dates) and len(set(dates))==1 else None,
              "selection_rule_not_yet_applied":True,
              "reason":"Anchor window remains open through 2026-10-15; final family must be selected mechanically after window close.",
              "fantasy_position_counts_computed":False,
              "capital_values_computed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (out/"capture_manifest.json").write_text(
              json.dumps(capture,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "capture_dir":str(out),
              "shared_update_date":capture["shared_update_date"],
              "all_three_update_dates_match":capture["all_three_update_dates_match"]
          },indent=2))
          PY

