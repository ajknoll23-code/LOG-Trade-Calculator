              "research/market-value-v2/market_value_v2_phase4_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          unexpected = actual - allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected deployment files: "
                  + ", ".join(sorted(unexpected))
              )

          required = set(allowed)
          missing = required - actual
          if missing:
              raise SystemExit(
                  "Expected deployment files did not change: "
                  + ", ".join(sorted(missing))
              )

