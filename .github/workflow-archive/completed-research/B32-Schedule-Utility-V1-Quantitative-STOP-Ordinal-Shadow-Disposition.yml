name: B32 Schedule Utility V1 - Quantitative STOP and Ordinal Shadow Disposition
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: b32-schedule-utility-v1-quantitative-stop-ordinal-shadow-disposition
  cancel-in-progress: false
env:
  B29_FREEZE_COMMIT: 46e0da275b797e4d7140cc33c2a452c2906d4408
  B31_EVALUATION_COMMIT: e7ea182495214a1e29adf8da01b62be4893922c9
  B32A_AUDIT_COMMIT: dc09ff08c2f6977714762c32e506ff5986952518
jobs:
  disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Verify frozen scientific state
      shell: bash
      run: |-
        set -euo pipefail

        git merge-base --is-ancestor "$B29_FREEZE_COMMIT" HEAD
        git merge-base --is-ancestor "$B31_EVALUATION_COMMIT" HEAD
        git merge-base --is-ancestor "$B32A_AUDIT_COMMIT" HEAD

        python3 - <<'PY'
        import json
        from pathlib import Path

        root = Path("research/schedule-utility-v1")
        assert not (root / "schedule_utility_v1_phase2_disposition.json").exists()

        b29 = json.loads(
            (root / "schedule_utility_v1_phase2a_amendment_1.json").read_text(encoding="utf-8")
        )
        b31 = json.loads(
            (root / "schedule_utility_v1_phase2b_evaluation.json").read_text(encoding="utf-8")
        )
        b32a = json.loads(
            (root / "schedule_utility_v1_phase2b_zero_fill_validity_audit.json").read_text(encoding="utf-8")
        )

        assert b29["amd_5_claim_scope"]["stop_does_not_establish_no_schedule_signal"] is True
        assert b29["amd_8_governance"][
            "threshold_or_predictor_retuning_after_outcomes_authorized"
        ] is False

        assert b31["status"] == "STOP_RETROSPECTIVE_PREDICTIVE_VALIDATION"
        assert b31["target_outcomes_opened"] is True
        assert b31["target_outcome_evaluation_performed"] is True
        assert b31["retuning_after_outcomes_authorized"] is False
        assert b31["phase3_shadow_authorized"] is False
        assert b31["production_change_authorized"] is False

        # Supportive only; does not alter B31.
        assert b32a["conclusion"]["original_b31_stop_remains_binding"] is True
        assert b32a["production_change_authorized"] is False
        assert b32a["phase3_shadow_authorized"] is False
        assert b32a["v1_stop_can_be_reclassified_as_pass"] is False

        print("PASS: frozen Phase 2 scientific state verified.")
        PY
    - name: Snapshot production
      shell: bash
      run: |-
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Freeze revised V1 disposition
      shell: bash
      run: |-
        set -euo pipefail

        python3 - <<'PY'
        import json
        from pathlib import Path

        root = Path("research/schedule-utility-v1")
        b31 = json.loads(
            (root / "schedule_utility_v1_phase2b_evaluation.json").read_text(encoding="utf-8")
        )
        b32a = json.loads(
            (root / "schedule_utility_v1_phase2b_zero_fill_validity_audit.json").read_text(encoding="utf-8")
        )

        disposition = {
            "schema_version": 1,
            "study_id": "schedule-utility-v1",
            "phase": "2-disposition",
            "status": "QUANTITATIVE_V1_STOP_ORDINAL_V1_SHADOW_PATH_PRESERVED",
            "frozen_evidence": {
                "b31_commit": "e7ea182495214a1e29adf8da01b62be4893922c9",
                "b31_decision": b31["status"],
                "b32a_commit": "dc09ff08c2f6977714762c32e506ff5986952518",
                "b32a_role": "supportive_non_gating_postrun_validity_audit",
                "b32a_status": b32a["status"],
            },
            "quantitative_v1_disposition": {
                "construction": "baseline + 1.0 * frozen LOG-SAPA defense_effect",
                "confirmatory_population": "2015-2025 NFL seasons, Weeks 4-17",
                "status": "PERMANENT_STOP_FOR_THIS_FROZEN_V1_CONSTRUCTION",
                "primary_claim": (
                    "direct unit-weight point adjustment improves next-game prediction"
                ),
                "claim_supported": False,
                "may_reclassify_as_pass": False,
                "may_retune_v1_on_2015_2025": False,
                "may_loosen_v1_thresholds": False,
                "does_not_mean": [
                    "all schedule information is useless",
                    "all future calibrated point-adjustment models are prohibited",
                    "a separately preregistered quantitative V2 cannot be developed",
                ],
            },
            "ordinal_v1_disposition": {
                "claim": (
                    "LOG-SAPA can provide relative easier/harder schedule context "
                    "without point or value magnitude claims"
                ),
                "status": "AUTHORIZED_FOR_PROSPECTIVE_SHADOW_ONLY",
                "user_facing_production_authorized_now": False,
                "production_requires_new_prospective_ordinal_pass": True,
                "allowed_shadow_forms": [
                    "Easy / Neutral / Hard",
                    "coarse ordinal matchup bands",
                    "Next-3 ordinal schedule context",
                    "ROS ordinal schedule context",
                    "Fantasy Playoff ordinal schedule context",
                ],
                "prohibited_claims": [
                    "raw LOG-SAPA as expected points",
                    "fantasy-point adjustment",
                    "projection boost",
                    "validated predictive edge",
                    "FV change",
                    "Package Adjustment change",
                    "Team Utility change",
                    "Trade Verdict change",
                ],
            },
            "historical_data_governance": {
                "2015_2025_confirmatory_status": "CONSUMED",
                "may_be_used_for_development_only": True,
                "may_be_reused_as_independent_confirmation": False,
                "historical_ordinal_diagnostics_role": "development_only_nonconfirmatory",
            },
            "prospective_shadow_governance": {
                "next_required_stage": (
                    "B32C historical ordinal development diagnostic, then B33 preregistration"
                ),
                "sequential_horizon_testing_required": True,
                "planned_sequence": [
                    "h=1",
                    "h=2-3 only if h=1 passes",
                    "h>=4 only if h=2-3 passes",
                ],
                "familywise_false_pass_target": 0.05,
                "minimum_evaluated_weeks_planned": 10,
                "no_backfill_after_first_week_kickoff": True,
                "2026_week_4_eligible": False,
                "2026_week_4_ineligible_reason": (
                    "first game kicked off 2026-10-01 before this prospective path"
                ),
                "earliest_possible_2026_week": 5,
                "week_5_freeze_deadline": (
                    "before the first Week 5 kickoff; currently scheduled "
                    "2026-10-08 20:15 ET"
                ),
            },
            "fantasy_playoff_scope_for_b33": {
                "planned_supported_weeks": [15, 16, 17],
                "week_18": "UNSUPPORTED_IN_ORDINAL_V1",
                "reason": (
                    "V1 historical target universe stopped at Week 17; Week 18 "
                    "must not be silently added without separate preregistration"
                ),
            },
            "future_quantitative_v2": {
                "authorized_for_development": True,
                "v1_stop_is_not_a_permanent_ban_on_calibrated_point_adjustments": True,
                "2015_2025_role": "development_only",
                "preferred_primary_architecture": (
                    "hierarchical_empirical_bayes_shrinkage_of_defense_effects"
                ),
                "preferred_backup_architecture": "single_global_lambda",
                "preferred_independent_confirmatory_holdout": "full_2027_season",
                "production_before_independent_confirmation": False,
            },
            "production": {
                "ordinal_display_authorized_now": False,
                "point_adjustment_authorized": False,
                "projection_change_authorized": False,
                "fv_change_authorized": False,
                "package_adjustment_change_authorized": False,
                "team_utility_change_authorized": False,
                "trade_verdict_change_authorized": False,
            },
        }

        (root / "schedule_utility_v1_phase2_disposition.json").write_text(
            json.dumps(disposition, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        report = """# Schedule Utility V1 — Revised Phase 2 Disposition

        **Status:** `QUANTITATIVE_V1_STOP_ORDINAL_V1_SHADOW_PATH_PRESERVED`

        ## Quantitative V1

        The frozen construction `baseline + 1.0 × LOG-SAPA defense_effect` remains a
        permanent scientific STOP **for that V1 construction on the consumed
        2015–2025 confirmatory data**.

        This is not a permanent ban on separately designed/calibrated V2 point
        adjustments.

        ## Ordinal V1

        The original display-only easier/harder schedule concept is preserved for
        **prospective shadow only**. It is not authorized for user-facing production yet.

        No raw LOG-SAPA points, projection adjustment, FV, Package Adjustment, Team
        Utility, or Trade Verdict effect is authorized.

        ## Data governance

        2015–2025 are consumed as V1 confirmatory data and may now be used only for
        development/exploration. They cannot confirm V2.

        ## Prospective timing

        2026 Week 4 is ineligible because its first game kicked off before this
        prospective path was frozen. The earliest possible shadow week is Week 5, only
        if B33 is frozen before the first Week 5 kickoff. No backfill.

        ## Playoff scope

        Ordinal V1 playoff evaluation is planned for NFL Weeks 15–17. Week 18 is
        unsupported in V1 and will not be silently included.

        ## Next

        Run B32C historical ordinal development diagnostics. If the historical
        development signal is directionally positive, freeze B33 before the next
        eligible week's first kickoff.
        """
        (root / "schedule_utility_v1_phase2_disposition.md").write_text(
            report, encoding="utf-8"
        )
        PY
    - name: Validate disposition and production guard
      shell: bash
      run: |-
        set -euo pipefail

        python3 - <<'PY'
        import json
        from pathlib import Path

        p = Path(
            "research/schedule-utility-v1/"
            "schedule_utility_v1_phase2_disposition.json"
        )
        d = json.loads(p.read_text(encoding="utf-8"))

        assert d["status"] == (
            "QUANTITATIVE_V1_STOP_ORDINAL_V1_SHADOW_PATH_PRESERVED"
        )
        q = d["quantitative_v1_disposition"]
        assert q["status"] == "PERMANENT_STOP_FOR_THIS_FROZEN_V1_CONSTRUCTION"
        assert q["claim_supported"] is False
        assert q["may_reclassify_as_pass"] is False
        assert q["may_retune_v1_on_2015_2025"] is False

        o = d["ordinal_v1_disposition"]
        assert o["status"] == "AUTHORIZED_FOR_PROSPECTIVE_SHADOW_ONLY"
        assert o["user_facing_production_authorized_now"] is False
        assert o["production_requires_new_prospective_ordinal_pass"] is True

        g = d["prospective_shadow_governance"]
        assert g["planned_sequence"] == [
            "h=1",
            "h=2-3 only if h=1 passes",
            "h>=4 only if h=2-3 passes",
        ]
        assert g["minimum_evaluated_weeks_planned"] == 10
        assert g["2026_week_4_eligible"] is False
        assert g["earliest_possible_2026_week"] == 5

        assert d["fantasy_playoff_scope_for_b33"]["planned_supported_weeks"] == [15, 16, 17]
        assert d["fantasy_playoff_scope_for_b33"]["week_18"] == "UNSUPPORTED_IN_ORDINAL_V1"

        prod = d["production"]
        assert all(value is False for value in prod.values())

        print("PASS: revised V1 disposition is internally consistent.")
        PY

        test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
        test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
        test -z "$(git diff --name-only -- index.html free-agent-board.html)"
    - name: Commit revised disposition
      shell: bash
      run: |-
        set -euo pipefail

        git add \
          research/schedule-utility-v1/schedule_utility_v1_phase2_disposition.json \
          research/schedule-utility-v1/schedule_utility_v1_phase2_disposition.md

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Freeze Schedule Utility V1 revised Phase 2 disposition"
        git push origin HEAD:main
    - name: Closeout
      shell: bash
      run: |-
        set -euo pipefail
        echo "Quantitative V1 1.0x construction: PERMANENT STOP"
        echo "Ordinal V1: PROSPECTIVE SHADOW ONLY"
        echo "User-facing production: NOT AUTHORIZED"
        echo "Earliest possible 2026 shadow week: Week 5"
