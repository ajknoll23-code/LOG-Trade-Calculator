name: B17 V2 Draft Capital Outlook V1 - Historical Parse and Target Feasibility Replay

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b17_v2_replay:
    name: B17 V2 replay frozen top-60 parsing and joint feasibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B17 V2 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install parser dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "beautifulsoup4==4.14.2"

      - name: Guard original B17 protocol and STOP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          p=json.loads((D/"b17_protocol_frozen.json").read_text())
          m=json.loads((D/"b17_manifest.json").read_text())
          s=json.loads((D/"b17_historical_parse_and_target_feasibility_summary.json").read_text())

          assert p["class_years"]==list(range(2014,2026))
          assert p["class_n"]==12
          assert p["predictor_contract"]["top_slot_cutoff"]==60
          assert p["actual_target_contract"]["top_slot_cutoff"]==60
          assert p["feasibility_gate"]["minimum_joint_feasible_classes"]==10
          assert p["feasibility_gate"]["predictor_minimum_unique_slots_through_60"]==58
          assert p["feasibility_gate"]["predictor_must_reach_slot_60"] is True
          assert p["feasibility_gate"]["target_minimum_observed_selections_at_or_below_60"]==58
          assert p["strict_non_authority"]["no_predictor_target_correlation"] is True
          assert p["strict_non_authority"]["no_model_fit"] is True
          assert p["strict_non_authority"]["no_model_selection"] is True
          assert p["strict_non_authority"]["no_class_strength_scalar"] is True
          assert p["strict_non_authority"]["no_target_weight_tuning"] is True
          assert p["strict_non_authority"]["no_2027_score"] is True
          assert p["strict_non_authority"]["no_production_change"] is True

          assert m["decision"]=="STOP_B17_HISTORICAL_PARSE_OR_TARGET_FEASIBILITY_INSUFFICIENT"
          assert m["joint_feasibility_pass"] is False
          assert m["joint_feasible_class_n"]==3
          assert m["b18_target_function_and_power_preregistration_authorized"] is False
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_target_correlation_computed"] is False
          assert m["scalar_target_function_computed"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["joint_feasible_class_years"]==[2017,2018,2023]
          assert s["minimum_joint_feasible_classes_required"]==10

          for name in [
              "b17_protocol_frozen.json",
              "b17_actual_target_summary.json",
              "b17_historical_parse_and_target_feasibility_summary.json",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          print("PASS: original B17 protocol and failed result preserved.")
          PY

      - name: Guard B17A V3 authorization and selected source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b17a_v3_manifest.json").read_text())
          s=json.loads((D/"b17a_v3_snapshot_family_integrity_summary.json").read_text())

          assert m["decision"]=="PASS_B17A_V3_SNAPSHOT_FAMILY_INTEGRITY_AUTHORIZE_B17_V2_IMPLEMENTATION_REPLAY_ONLY"
          assert m["integrity_gate_pass"] is True
          assert m["coherent_top60_family_n"]==10
          assert m["b17_v2_implementation_replay_authorized"] is True
          assert m["b18_target_function_and_power_preregistration_authorized"] is False
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_target_correlation_computed"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["coherent_top60_family_n"]==10
          assert s["coherent_class_years"]==list(range(2014,2024))
          assert s["incoherent_class_years"]==[2024,2025]
          assert s["minimum_coherent_top60_families_required"]==10
          assert s["b17_v2_implementation_replay_authorized"] is True
          assert s["b18_target_function_and_power_preregistration_authorized"] is False

          for year_s,fam in s["selected_families"].items():
              year=int(year_s)
              assert 2014<=year<=2023
              assert fam["shared_last_update_date"]
              assert set(fam["selected_files"])=={
                  "base_1_16","round1_17_32","round2_33_plus"
              }
              for role,meta in fam["selected_files"].items():
                  p=Path(meta["path"])
                  assert p.is_file(),p
                  rel=str(p.relative_to(D))
                  expected=m["output_hashes"][rel]
                  got=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert got==expected==meta["sha256"],(year,role,expected,got)

          print("PASS: B17A V3 authorized replay and all selected raw files match frozen hashes.")
          PY

      - name: Guard frozen B17 actual-target artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b17_manifest.json").read_text())
          y=json.loads((D/"b17_actual_target_summary.json").read_text())
          by_year={int(x["class_year"]):x for x in y["classes"]}

          assert sorted(by_year)==list(range(2014,2026))
          for year in range(2014,2026):
              p=D/f"archive/historical-anchor-parsing/target/{year}_actual_top60.json"
              assert p.is_file(),p
              rel=str(p.relative_to(D))
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m["output_hashes"][rel]

          # Frozen actual side is usable for every B17A-V3 coherent class.
          for year in range(2014,2024):
              assert by_year[year]["target_parse_feasible"] is True
              assert by_year[year]["observed_selection_n_at_or_below_60"]>=58

          print("PASS: B17 frozen actual-target side is intact and feasible for 2014-2023.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B17 V2 implementation replay contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b17v2
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17_v2_implementation_replay_contract",
              "frozen_before_replay":True,

              "authorization_source":"B17A V3",
              "authorization_decision":"PASS_B17A_V3_SNAPSHOT_FAMILY_INTEGRITY_AUTHORIZE_B17_V2_IMPLEMENTATION_REPLAY_ONLY",

              "scientific_design_changed":False,
              "top_slot_cutoff_changed":False,
              "joint_gate_changed":False,
              "target_source_changed":False,
              "predictor_source_family_changed":False,
              "class_population_changed":False,

              "unchanged_b17_contract":{
                  "class_years":list(range(2014,2026)),
                  "candidate_class_n":12,
                  "top_slot_cutoff":60,
                  "minimum_joint_feasible_classes":10,
                  "predictor_minimum_unique_slots_through_60":58,
                  "predictor_must_reach_slot_60":True,
                  "target_minimum_observed_selections_at_or_below_60":58,
                  "fantasy_primary_positions":["QB","RB","FB","WR","TE"],
                  "position_mapping":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"}
              },

              "implementation_corrections":{
                  "source_selection":"Use only B17A V3 timestamp-coherent selected three-page families for 2014-2023. 2024-2025 remain predictor-infeasible.",
                  "html_parser":"Parse all bold Team: Player, POS, School labels in document order rather than relying on malformed OL/LI nesting.",
                  "pick_numbering":"Concatenate base, Round-1 remainder, and Round-2 entries in frozen page order, then assign sequential overall selection numbers starting at 1.",
                  "forfeited_first_rounds":"2016 and 2023 legitimately contain 31 Round-1 selections; overall selection numbering remains sequential and is not padded with a synthetic player.",
                  "target_reuse":"Reuse B17's already-frozen actual top-60 target artifacts exactly; do not redownload or reparse the target."
              },

              "scientific_firewall":{
                  "predictor_target_correlation_computed":False,
                  "scalar_target_function_computed":False,
                  "draft_capital_weight_function_defined":False,
                  "predictor_fit_performed":False,
                  "model_selection_performed":False,
                  "target_weight_tuning_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              },

              "decisions":{
                  "pass":"PASS_B17_V2_HISTORICAL_PARSE_AND_TARGET_FEASIBILITY_AUTHORIZE_B18_TARGET_FUNCTION_AND_POWER_PREREGISTRATION_ONLY",
                  "fail":"STOP_B17_V2_HISTORICAL_PARSE_OR_TARGET_FEASIBILITY_INSUFFICIENT",
                  "b18_authorized_only_on_pass":True,
                  "c1_authorized":False
              }
          }

          Path("/tmp/b17v2/contract.json").write_text(
              json.dumps(contract,indent=2,sort_keys=True)+"\n"
          )

          assert contract["unchanged_b17_contract"]["top_slot_cutoff"]==60
          assert contract["unchanged_b17_contract"]["minimum_joint_feasible_classes"]==10
          assert contract["scientific_design_changed"] is False
          print("PASS: B17 V2 implementation-only replay contract frozen.")
          PY

      - name: Replay projected top-60 parser from B17A V3 frozen families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/archive/historical-anchor-parsing-v2/parsed
          python3 - <<'PY'
          from __future__ import annotations

          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          OUT=D/"archive/historical-anchor-parsing-v2/parsed"
          P=json.loads(Path("/tmp/b17v2/contract.json").read_text())
          A=json.loads((D/"b17a_v3_snapshot_family_integrity_summary.json").read_text())

          mapping=P["unchanged_b17_contract"]["position_mapping"]
          fantasy=set(P["unchanged_b17_contract"]["fantasy_primary_positions"])
          cutoff=P["unchanged_b17_contract"]["top_slot_cutoff"]

          label_rx=re.compile(
              r"^\s*(?P<team>[^:]{2,100}):\s*(?P<player>.+?),\s*"
              r"(?P<pos>[A-Za-z0-9/-]{1,15}),\s*(?P<school>.+?)\s*$"
          )

          def norm(s):
              return " ".join(str(s).replace("\xa0"," ").split())

          def parse_labels(path,role):
              soup=BeautifulSoup(Path(path).read_bytes(),"html.parser")
              rows=[]
              seen=set()
              for b in soup.find_all("b"):
                  txt=norm(b.get_text(" ",strip=True))
                  m=label_rx.match(txt)
                  if not m:
                      continue
                  row={
                      "team":norm(m.group("team")),
                      "player":norm(m.group("player")),
                      "position_raw":norm(m.group("pos")).upper(),
                      "school":norm(m.group("school")),
                      "source_page_role":role
                  }
                  # Exact duplicate labels can occur in malformed legacy markup.
                  key=(row["team"],row["player"],row["position_raw"],row["school"])
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append(row)
              return rows

          selected=A["selected_families"]
          outputs=[]

          for year in range(2014,2026):
              if str(year) not in selected:
                  out={
                      "schema_version":2,
                      "study_id":"draft-capital-outlook-v1",
                      "stage":"b17_v2_projected_top60_parse",
                      "class_year":year,
                      "source_integrity_available":False,
                      "top60_rows":[],
                      "unique_slot_n_through_60":0,
                      "reaches_slot_60":False,
                      "fantasy_rows":[],
                      "fantasy_row_n":0,
                      "fantasy_counts":{"QB":0,"RB":0,"WR":0,"TE":0},
                      "parse_feasible":False,
                      "predictor_fit_performed":False,
                      "2027_class_scored":False,
                      "production_change_authorized":False
                  }
                  (OUT/f"{year}_projected_top60.json").write_text(
                      json.dumps(out,indent=2,sort_keys=True)+"\n"
                  )
                  outputs.append(out)
                  continue

              fam=selected[str(year)]
              roles=["base_1_16","round1_17_32","round2_33_plus"]
              rows=[]
              page_counts={}
              for role in roles:
                  path=fam["selected_files"][role]["path"]
                  parsed=parse_labels(path,role)
                  page_counts[role]=len(parsed)
                  rows.extend(parsed)

              # Frozen B17A V3 integrity rule already requires enough sequential
              # selections to cover top 60. Number them in true selection order.
              numbered=[]
              for i,row in enumerate(rows,start=1):
                  x=dict(row)
                  x["pick"]=i
                  primary=x["position_raw"].split("/")[0].strip().upper()
                  x["primary_position"]=primary
                  x["fantasy_position"]=mapping.get(primary) if primary in fantasy else None
                  numbered.append(x)

              top60=numbered[:cutoff]
              picks=[x["pick"] for x in top60]
              fantasy_rows=[x for x in top60 if x["fantasy_position"] is not None]

              out={
                  "schema_version":2,
                  "study_id":"draft-capital-outlook-v1",
                  "stage":"b17_v2_projected_top60_parse",
                  "class_year":year,
                  "anchor_date":fam["shared_last_update_date"],
                  "source_integrity_available":True,
                  "selected_base_url":fam["base_url"],
                  "page_entry_counts":page_counts,
                  "combined_sequential_entry_n":len(numbered),
                  "top60_rows":top60,
                  "unique_slot_n_through_60":len(set(picks)),
                  "reaches_slot_60":60 in picks,
                  "fantasy_rows":fantasy_rows,
                  "fantasy_row_n":len(fantasy_rows),
                  "fantasy_counts":{
                      pos:sum(x["fantasy_position"]==pos for x in fantasy_rows)
                      for pos in ["QB","RB","WR","TE"]
                  },
                  "parse_feasible":(
                      len(set(picks))>=P["unchanged_b17_contract"]["predictor_minimum_unique_slots_through_60"]
                      and 60 in picks
                  ),
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }

              assert len(top60)==60,(year,len(top60),page_counts)
              assert out["unique_slot_n_through_60"]==60
              assert out["reaches_slot_60"] is True

              (OUT/f"{year}_projected_top60.json").write_text(
                  json.dumps(out,indent=2,sort_keys=True)+"\n"
              )
              outputs.append(out)

          summary={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17_v2_projected_parse_summary",
              "classes":[{
                  "class_year":x["class_year"],
                  "source_integrity_available":x["source_integrity_available"],
                  "parse_feasible":x["parse_feasible"],
                  "unique_slot_n_through_60":x["unique_slot_n_through_60"],
                  "reaches_slot_60":x["reaches_slot_60"],
                  "fantasy_row_n":x["fantasy_row_n"],
                  "fantasy_counts":x["fantasy_counts"],
                  "page_entry_counts":x.get("page_entry_counts")
              } for x in outputs],
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          Path("/tmp/b17v2/projected_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              "parse_feasible_n":sum(x["parse_feasible"] for x in outputs),
              "parse_feasible_years":[x["class_year"] for x in outputs if x["parse_feasible"]]
          },indent=2))
          PY

      - name: Apply original B17 joint feasibility gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads(Path("/tmp/b17v2/contract.json").read_text())
          X=json.loads(Path("/tmp/b17v2/projected_summary.json").read_text())
          Y=json.loads((D/"b17_actual_target_summary.json").read_text())

          x={int(r["class_year"]):r for r in X["classes"]}
          y={int(r["class_year"]):r for r in Y["classes"]}
          assert sorted(x)==sorted(y)==list(range(2014,2026))

          per_class=[]
          for year in range(2014,2026):
              joint=bool(x[year]["parse_feasible"] and y[year]["target_parse_feasible"])
              per_class.append({
                  "class_year":year,
                  "predictor_source_integrity_available":x[year]["source_integrity_available"],
                  "predictor_parse_feasible":x[year]["parse_feasible"],
                  "predictor_unique_slot_n_through_60":x[year]["unique_slot_n_through_60"],
                  "predictor_reaches_slot_60":x[year]["reaches_slot_60"],
                  "target_parse_feasible":y[year]["target_parse_feasible"],
                  "target_observed_selection_n_at_or_below_60":y[year]["observed_selection_n_at_or_below_60"],
                  "joint_feasible":joint
              })

          joint=[r for r in per_class if r["joint_feasible"]]
          n=len(joint)
          required=P["unchanged_b17_contract"]["minimum_joint_feasible_classes"]
          passed=n>=required
          decision=P["decisions"]["pass"] if passed else P["decisions"]["fail"]

          summary={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17_v2_historical_parse_and_target_feasibility_summary",
              "decision":decision,
              "implementation_replay_only":True,
              "scientific_design_changed":False,
              "joint_feasibility_pass":passed,
              "candidate_class_n":12,
              "minimum_joint_feasible_classes_required":required,
              "joint_feasible_class_n":n,
              "joint_feasible_class_years":[r["class_year"] for r in joint],
              "joint_infeasible_class_years":[r["class_year"] for r in per_class if not r["joint_feasible"]],
              "per_class":per_class,

              "scientific_firewall":{
                  "predictor_target_correlation_computed":False,
                  "scalar_target_function_computed":False,
                  "draft_capital_weight_function_defined":False,
                  "predictor_fit_performed":False,
                  "model_selection_performed":False,
                  "target_weight_tuning_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              },

              "b18_target_function_and_power_preregistration_authorized":passed,
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,

              "scientific_note":"B17 V2 replays only historical data-structure feasibility after independently validated parser/source-integrity corrections. No predictor-target association or class-strength scalar is computed."
          }

          (D/"b17_v2_implementation_replay_contract.json").write_bytes(
              Path("/tmp/b17v2/contract.json").read_bytes()
          )
          (D/"b17_v2_projected_parse_summary.json").write_bytes(
              Path("/tmp/b17v2/projected_summary.json").read_bytes()
          )
          (D/"b17_v2_historical_parse_and_target_feasibility_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps(summary,indent=2))
          PY

      - name: Validate B17 V2 result and scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          C=json.loads((D/"b17_v2_implementation_replay_contract.json").read_text())
          X=json.loads((D/"b17_v2_projected_parse_summary.json").read_text())
          S=json.loads((D/"b17_v2_historical_parse_and_target_feasibility_summary.json").read_text())

          assert C["frozen_before_replay"] is True
          assert C["scientific_design_changed"] is False
          assert C["top_slot_cutoff_changed"] is False
          assert C["joint_gate_changed"] is False
          assert C["target_source_changed"] is False
          assert C["predictor_source_family_changed"] is False
          assert C["class_population_changed"] is False
          assert C["unchanged_b17_contract"]["top_slot_cutoff"]==60
          assert C["unchanged_b17_contract"]["minimum_joint_feasible_classes"]==10

          by_year={int(x["class_year"]):x for x in X["classes"]}
          assert sorted(by_year)==list(range(2014,2026))
          for year in range(2014,2024):
              assert by_year[year]["source_integrity_available"] is True
              assert by_year[year]["parse_feasible"] is True
              assert by_year[year]["unique_slot_n_through_60"]==60
              assert by_year[year]["reaches_slot_60"] is True
              p=D/f"archive/historical-anchor-parsing-v2/parsed/{year}_projected_top60.json"
              assert p.is_file()
          for year in [2024,2025]:
              assert by_year[year]["source_integrity_available"] is False
              assert by_year[year]["parse_feasible"] is False

          assert S["scientific_design_changed"] is False
          assert S["scientific_firewall"]=={
              "2027_class_scored":False,
              "draft_capital_weight_function_defined":False,
              "model_selection_performed":False,
              "predictor_fit_performed":False,
              "predictor_target_correlation_computed":False,
              "production_change_authorized":False,
              "scalar_target_function_computed":False,
              "target_weight_tuning_performed":False
          }
          assert S["c1_model_preregistration_authorized"] is False
          assert S["predictor_fit_performed"] is False
          assert S["2027_class_scored"] is False
          assert S["production_change_authorized"] is False

          if S["joint_feasibility_pass"]:
              assert S["joint_feasible_class_n"]>=10
              assert S["decision"]=="PASS_B17_V2_HISTORICAL_PARSE_AND_TARGET_FEASIBILITY_AUTHORIZE_B18_TARGET_FUNCTION_AND_POWER_PREREGISTRATION_ONLY"
              assert S["b18_target_function_and_power_preregistration_authorized"] is True
          else:
              assert S["joint_feasible_class_n"]<10
              assert S["decision"]=="STOP_B17_V2_HISTORICAL_PARSE_OR_TARGET_FEASIBILITY_INSUFFICIENT"
              assert S["b18_target_function_and_power_preregistration_authorized"] is False

          print("PASS: B17 V2 replay obeyed original scientific gate and firewall.")
          PY

      - name: Freeze B17 V2 report and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          S=json.loads((D/"b17_v2_historical_parse_and_target_feasibility_summary.json").read_text())

          report=[
              "# Draft Capital Outlook V1 — B17 V2 Historical Parse and Target Feasibility Replay",
              "",
              "## Decision",
              "",
              S["decision"],
              "",
              f'- Candidate classes: {S["candidate_class_n"]}',
              f'- Required jointly feasible classes: {S["minimum_joint_feasible_classes_required"]}',
              f'- Jointly feasible classes: {S["joint_feasible_class_n"]}',
              f'- Jointly feasible years: {S["joint_feasible_class_years"]}',
              f'- Jointly infeasible years: {S["joint_infeasible_class_years"]}',
              "",
              "## Scientific status",
              "",
              "- Implementation replay only: true",
              "- Scientific design changed: false",
              "- Predictor-target correlation computed: false",
              "- Scalar target function computed: false",
              "- Draft-capital weight function defined: false",
              "- Predictor fit performed: false",
              "- Model selection performed: false",
              "- 2027 class scored: false",
              "- Production change authorized: false",
              "",
              f'- B18 target-function/power preregistration authorized: {S["b18_target_function_and_power_preregistration_authorized"]}',
              "- C1 model preregistration authorized: false",
              ""
          ]
          (D/"b17_v2_historical_parse_and_target_feasibility_report.md").write_text(
              "\n".join(report)
          )

          core=[
              "b17_v2_implementation_replay_contract.json",
              "b17_v2_projected_parse_summary.json",
              "b17_v2_historical_parse_and_target_feasibility_summary.json",
              "b17_v2_historical_parse_and_target_feasibility_report.md",
          ]
          parsed=sorted(
              p for p in (D/"archive/historical-anchor-parsing-v2/parsed").rglob("*")
              if p.is_file()
          )
          hashes={n:hashlib.sha256((D/n).read_bytes()).hexdigest() for n in core}
          hashes.update({
              str(p.relative_to(D)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in parsed
          })

          manifest={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17_v2_manifest",
              "decision":S["decision"],
              "implementation_replay_only":True,
              "scientific_design_changed":False,
              "joint_feasibility_pass":S["joint_feasibility_pass"],
              "joint_feasible_class_n":S["joint_feasible_class_n"],
              "output_hashes":hashes,
              "b18_target_function_and_power_preregistration_authorized":S["b18_target_function_and_power_preregistration_authorized"],
              "c1_model_preregistration_authorized":False,
              "predictor_target_correlation_computed":False,
              "scalar_target_function_computed":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b17_v2_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: B17 V2 report and manifest frozen.")
          PY

      - name: Run post-B17 V2 repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove B17 V2 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b17_v2_")
              or p.startswith("research/draft-capital-outlook-v1/archive/historical-anchor-parsing-v2/")
              for p in touched
          ),touched
          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B17 V2 mutation scope is research-only.")
          PY

      - name: Commit B17 V2 feasibility replay
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17 V2."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b17_v2_implementation_replay_contract.json \
            research/draft-capital-outlook-v1/b17_v2_projected_parse_summary.json \
            research/draft-capital-outlook-v1/b17_v2_historical_parse_and_target_feasibility_summary.json \
            research/draft-capital-outlook-v1/b17_v2_historical_parse_and_target_feasibility_report.md \
            research/draft-capital-outlook-v1/b17_v2_manifest.json \
            research/draft-capital-outlook-v1/archive/historical-anchor-parsing-v2/

          git commit -m "Replay Draft Capital Outlook historical parse feasibility"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17 V2 feasibility replay committed."
