name: QF11 V31 - Isolated KTC V2 Collector Source and Security Selftests (Disabled)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: qf11-ktc-v2-isolated-source-only
  cancel-in-progress: false
jobs:
  source_only:
    name: Add dedicated disabled V2 collector source without altering calculator voting or market model
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing model regression dependency
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Prove post-V30 UI and frozen valuation code unchanged
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_HEAD_MISMATCH; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_FROZEN_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        [[ -f data/players_cache.json ]] || { echo STOP_MUTABLE_CACHE_MISSING; exit 1; }
        [[ ! -e research/ktc-v2-isolated ]] || { echo STOP_V2_PATH_ALREADY_EXISTS; exit 1; }
        echo QF11_V31_PROTECTED_FROZEN_SOURCE_PINS_GREEN
    - name: Write exact dedicated disabled V2 collector and test source
      run: |
        set -euo pipefail
        python3 - <<'QF11_V31_FILES'
        from pathlib import Path
        import base64, hashlib, json, zlib
        data={
            'research/ktc-v2-isolated/collector.gs':'',
            'research/ktc-v2-isolated/collector.test.js':'',
            'research/ktc-v2-isolated/contract.json':'',
            'research/ktc-v2-isolated/README.md':'',
        }
        expected={'research/ktc-v2-isolated/collector.gs': 'f2430aa2513d9b8dee7fd659b7148f4919bb43ff588c0343e34912187f673a6b', 'research/ktc-v2-isolated/collector.test.js': '6301ea2de4ca0991f0ca777aefde0cb81ada8e1b6b3742978cfd5e1aa032d79a', 'research/ktc-v2-isolated/contract.json': '5ac022826cb73e90901842e0f7318560821384e72731af5c48135ecd773464f6', 'research/ktc-v2-isolated/README.md': '78ea7b34bf5caea917983f158fec861a57729976301f9781703bbf3f18dd8eb8'}
        for name, encoded in data.items():
            p=Path(name)
            assert not p.exists(),"STOP_V31_TARGET_ALREADY_EXISTS_"+name
            p.parent.mkdir(parents=True,exist_ok=True)
            raw=zlib.decompress(base64.b64decode(encoded,validate=True))
            assert hashlib.sha256(raw).hexdigest()==expected[name],"STOP_V31_EMBEDDED_SOURCE_TAMPERED_"+name
            p.write_bytes(raw)
            assert hashlib.sha256(p.read_bytes()).hexdigest()==expected[name]
        c=json.loads(Path("research/ktc-v2-isolated/contract.json").read_text())
        assert c["implementation_status"]=="SOURCE_ONLY_NOT_DEPLOYED" and not c["participants_authorized"] and not c["voting_authorized"] and not c["market_value_ingestion_authorized"]
        assert c["pilot_limit"]==12 and c["display_orders"]==6 and c["real_human_participants"]==0
        print("QF11_V31_EXACT_ISOLATED_COLLECTOR_SOURCES_CREATED_GREEN")
        QF11_V31_FILES
    - name: Execute isolated collector 24-case synthetic suite and security guard
      run: |
        set -euo pipefail
        cp research/ktc-v2-isolated/collector.gs /tmp/qf11-v31-collector.syntax.js
        node --check /tmp/qf11-v31-collector.syntax.js
        node --check research/ktc-v2-isolated/collector.test.js
        node research/ktc-v2-isolated/collector.test.js | tee /tmp/qf11-v31-tests.log
        python3 - <<'PYTEST'
        from pathlib import Path
        import json,hashlib
        root=Path('research/ktc-v2-isolated')
        source=(root/'collector.gs').read_text()
        contract=json.loads((root/'contract.json').read_text())
        checks={
         'independent_app_script_collector':'function doPost(e)' in source and 'qf11v2Sheet_' in source,
         'disabled_by_default':"if(props.getProperty('QF11_V2_ENABLED')!=='true')" in source,
         'new_separate_sheet':'SAME_AS_PRODUCTION_KTC_V1_SHEET' in source,
         'no_v1_submit_url_reference': 'https://script.google.com/macros/' not in source,
         'no_v1_pipeline_import':'scripts/market/ktc_pipeline.py' not in source,
         'no_frontend_mutation':'index.html' not in source,
         'moderator_q4_not_collected':"'q4'" not in source,
         'critical_pause':"props.setProperty('QF11_V2_HALTED','true')" in source,
         'purge_function':'function purgeExpiredQF11V2Rows()' in source,
         'no_real_people':contract['real_human_participants']==0 and contract['live_v2_votes']==0,
         'no_production_permission':not contract['market_value_ingestion_authorized'],
         'no_pilot_activation':not contract['participants_authorized'] and not contract['voting_authorized']
        }
        assert all(checks.values()),'STOP_V31_SECURITY_CONTRACT_'+repr(checks)
        assert '"tests":24' in Path('/tmp/qf11-v31-tests.log').read_text(),'STOP_NOT_ALL_24_TESTS'
        print('QF11_V31_ISOLATION_AND_24_SYNTHETIC_TESTS_GREEN')
        PYTEST
    - name: Run existing 14 repo regressions and release selftests
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V31_FROZEN_14_REGRESSIONS_GREEN
    - name: Prove four-new-file exact source-only scope and prepare archived manifest
      run: |
        set -euo pipefail
        [[ -z "$(git diff --name-only)" ]] || { echo STOP_MODIFIED_EXISTING_FILE; exit 1; }
        [[ -z "$(git diff --cached --name-only)" ]] || { echo STOP_UNAPPROVED_STAGING; exit 1; }
        python3 - <<'PY'
        import subprocess, hashlib, json
        from pathlib import Path
        allow=set(['research/ktc-v2-isolated/collector.gs', 'research/ktc-v2-isolated/collector.test.js', 'research/ktc-v2-isolated/contract.json', 'research/ktc-v2-isolated/README.md'])
        actual=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
        assert actual==allow, f'STOP_UNEXPECTED_NEW_FILES_{sorted(actual^allow)}'
        assert 'index.html' not in actual
        assert 'https://script.google.com' not in Path('research/ktc-v2-isolated/collector.gs').read_text()
        manifest={
         'schema':'QF11_V31_DEDICATED_COLLECTOR_SOURCE_ONLY',
         'source_paths':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(actual)},
         'repo_existing_sources_modified':[],
         'collector_deployed':False,'collector_configured':False,'source_only':True,
         'v2_collector_enabled':False,'participant_contact':0,'participant_votes':0,
         'market_value_change':False,'fv_change':False,
         'synthetic_tests_passed':24,
         'pending_human_instrument_qc':True,'pending_owner_activation':True,
         'next_steps':'Independent security/privacy/instrument review, provision dedicated endpoint, dummy end-to-end isolated transport, new explicit owner approval before live pilot'
        }
        Path('/tmp/qf11-v31-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
        print('QF11_V31_ONLY_FOUR_NEW_RESEARCH_SOURCE_FILES_GREEN')
        PY
    - name: Archive disabled source implementation evidence
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v31-DISABLED-ISOLATED-KTC-V2-COLLECTOR-SOURCE
        path: '/tmp/qf11-v31-manifest.json

          /tmp/qf11-v31-tests.log'
        retention-days: 7
    - name: Commit only the four new disabled research source files
      run: |
        set -euo pipefail
        [[ -z "$(git diff --name-only)" ]] || { echo STOP_EXISTING_FILES_CHANGED; exit 1; }
        git fetch origin main
        [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo STOP_MAIN_ADVANCED_REVIEW_FIRST; exit 1; }
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- research/ktc-v2-isolated/README.md research/ktc-v2-isolated/collector.gs research/ktc-v2-isolated/collector.test.js research/ktc-v2-isolated/contract.json
        python3 - <<'PY'
        import subprocess
        allow={'research/ktc-v2-isolated/README.md','research/ktc-v2-isolated/collector.gs','research/ktc-v2-isolated/collector.test.js','research/ktc-v2-isolated/contract.json'}
        a=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
        assert a==allow, f'STOP_STAGED_SCOPE_{sorted(a)}'
        PY
        git diff --cached --check
        git commit -m 'QF11 V31: add disabled isolated KTC V2 collector source and tests'
        git push origin HEAD:refs/heads/main
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_AFTER_COMMIT; exit 1; }
        echo "QF11_V31_DISABLED_COLLECTOR_SOURCE_COMMITTED_GREEN $(git rev-parse HEAD)"
