      - name: Execute frozen sparse-tail sensitivity
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/out"
          mkdir -p "$OUT"

          python3 "${RUNNER_TEMP}/v8_1_sparse_tail_sensitivity.py"             --fit             --prereg "research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.json"             --phase2-dir "${RUNNER_TEMP}/p2"             --out-dir "$OUT"

