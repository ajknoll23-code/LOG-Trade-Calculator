      - name: Independent closeout audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"out"
          r=json.loads((out/"v8_1_phase1_sparse_tail_sensitivity.json").read_text())
          m=json.loads((out/"v8_1_phase1_sparse_tail_sensitivity_manifest.json").read_text())

          allowed={
              "PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE",
              "STOP_V8_1_SPARSE_TAIL_SENSITIVITY",
          }
          assert r["decision"] in allowed
          assert m["decision"]==r["decision"]
          assert r["variant_n"]==7
          assert len(r["variants"])==7

          assert r["frozen_primary"]["k"]==0.3557942893
          assert abs(r["frozen_primary"]["full_corpus_reproduction_refit_k"]-0.3557942893)<=1e-7
          assert r["frozen_primary"]["candidate_parameter_changed"] is False

          assert r["selection_or_tuning_performed"] is False
          assert r["primary_candidate_refit_or_changed"] is False
          assert r["2024_holdout_pick_identity_file_read"] is False
          assert r["2024_holdout_rookie_outcomes_read"] is False
          assert r["2024_holdout_outcomes_remain_sealed"] is True
          assert r["market_or_ktc_values_read"] is False
          assert r["package_vote_data_read"] is False
          assert r["production_change_authorized"] is False

          passed=all(v["pass"] for v in r["variants"])
          assert passed==r["sparse_sensitivity_gate_pass"]
          assert passed==r["2024_H2_outcome_open_authorized_next_stage"]
          assert passed==m["sparse_sensitivity_gate_pass"]

          for v in r["variants"]:
              assert abs(v["diagnostic_refit_k_relative_to_frozen_primary"])<=0.10+1e-12
              assert v["diagnostic_refit_boundary"]["at_hard_bound"] is False
              assert v["fixed_primary_evaluation"]["h3_o2_improvement_vs_C0"]>=0.05-1e-12
              assert v["diagnostic_refit_evaluation"]["h3_o2_improvement_vs_C0"]>=0.05-1e-12
              assert v["fixed_primary_evaluation"]["r5_r6_h3_o2_improvement_vs_C0"]>=0.05-1e-12
              assert v["diagnostic_refit_evaluation"]["r5_r6_h3_o2_improvement_vs_C0"]>=0.05-1e-12
              assert v["fixed_primary_evaluation"]["structural"]["structural_gate_pass"] is True
              assert v["diagnostic_refit_evaluation"]["structural"]["structural_gate_pass"] is True

          def walk(x):
              if isinstance(x,float):
                  assert math.isfinite(x)
              elif isinstance(x,dict):
                  for value in x.values(): walk(value)
              elif isinstance(x,list):
                  for value in x: walk(value)
          walk(r)

          print("PASS: Phase 1 sensitivity closeout is internally consistent.")
          print("DECISION =",r["decision"])
          print("VARIANTS_PASS =",sum(v["pass"] for v in r["variants"]),"/ 7")
          print("2024_H2_AUTHORIZED =",r["2024_H2_outcome_open_authorized_next_stage"])
          PY

