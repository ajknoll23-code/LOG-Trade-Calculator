      - name: Prove research-only commit scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/draft-pick-fv-v10/v10_phase2_5_enhancement_contract.json",
              "research/draft-pick-fv-v10/v10_phase2_5_ktc_2027_2029_screenshot_freeze.json",
              "research/draft-pick-fv-v10/v10_phase2_5_enhancement_result.json",
              "research/draft-pick-fv-v10/v10_phase2_5_frozen_production_candidate.json",
              "research/draft-pick-fv-v10/v10_phase2_5_runtime_snapshot.json",
              "research/draft-pick-fv-v10/v10_phase2_5_manifest.json",
              "research/draft-pick-fv-v10/v10_todo.json",
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          assert "trade-desk-preview.html" not in touched
          print("PASS: Phase 2.5 commit scope is research-only.")
          PY

      - name: Commit frozen Phase 2.5 enhancements
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during Phase 2.5."
