          git diff --cached --quiet && { echo "ERROR: no Phase 2.5 artifacts staged."; exit 1; }
          git commit -m "Complete Draft Pick FV V10 Phase 2.5 enhancements"
          git push origin HEAD:main
          test "$(git status --porcelain)" = ""
          echo "PASS: Phase 2.5 enhancements committed; production remains unchanged."
