          assert result["decision"]=="PASS_V10_PHASE2_5_AUTHORIZE_UPDATED_PHASE3_ENGINEERING_DEPLOYMENT"
          assert result["year_discount_v2"]["all_gates_pass"] is True
          assert c["production_change_authorized"] is False

          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files=[
              "v10_phase2_5_enhancement_contract.json",
              "v10_phase2_5_ktc_2027_2029_screenshot_freeze.json",
