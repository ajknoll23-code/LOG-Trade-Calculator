name: Draft Pick FV V10 - Phase 2.5 Tail + Year Discount + Uncertainty

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: draft-pick-fv-v10-phase2-5-enhancements
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture audit base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact green V10 Phase 2 and current production baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          expected={
              D/"v10_phase0_expected_value_construct_audit.json":
                  "d4b4bfcc8446a4f612e6a6f39a73242498b292ad71dece073639c4ed7a0f138e",
              D/"v10_phase1_frozen_production_candidate.json":
                  "261989459b788ff8f05e5c66607791fcbcabe2ec31c3c08be27b8e4b51bf54c9",
              D/"v10_phase2_production_candidate_audit.json":
                  "568b4defec4fe947b41e91b27258ba4bb18972f56ed1f0715e2365aeb0019d90",
              D/"v10_phase2_deployment_blueprint.json":
                  "6a23641d4a707dd77296e88fb85a26f1bc7382b8b7e5806069380ce68780bf00",
          }
          for p,want in expected.items():
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want,(str(p),want,got)

          p2=json.loads((D/"v10_phase2_production_candidate_audit.json").read_text())
          assert p2["decision"]=="PASS_V10_PHASE2_AUTHORIZE_PHASE3_PRODUCTION_DEPLOYMENT"
          assert p2["runtime_pick_outputs_checked"]==72
          assert p2["runtime_pick_parity_pass"] is True
          assert p2["package_adjustment_regression_pass"] is True
          assert p2["free_agent_valuation_parity_pass"] is True
          assert p2["team_utility_regression_pass"] is True
          assert p2["full_repository_regression_pass"] is True
          assert p2["shadow_production_restored_byte_for_byte"] is True

          c0=[
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          for name in ("index.html","free-agent-board.html"):
              t=Path(name).read_text(encoding="utf-8")
              m=pat.search(t); assert m,name
              vals=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",m.group(0))))
              assert vals==list(map(float,c0)),(name,vals)
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in t
              assert "const disc = YEAR_DISCOUNT[year] ?? 0.6;" in t
              assert "return Math.round(base * disc);" in t

          print("PASS: green Phase 2 exact; production remains pre-V10 C0.")
          PY

      - name: Freeze Phase 2.5 contract and screenshot market table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")

          contract={
            "schema_version":1,
            "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
            "stage":"phase2_5_tail_year_discount_uncertainty",
            "status":"FROZEN_BEFORE_ENHANCEMENT_CALCULATION",
            "objectives":[
              "Refine low-value R5-R6 extrapolation without making tail research a production blocker.",
              "Replace extrapolated YEAR_DISCOUNT 2028/2029 factors with direct screenshot-backed KTC market factors.",
              "Propagate historical-outcome uncertainty separately from KTC market-source sensitivity.",
              "Queue exact rookie-slot modeling for later work."
            ],
            "tail_policy":{
              "candidate":"V10_MT2_LATE_ROUND_LOG_LINEAR",
              "formula":"geometric mean of all six 2027 combined-market late-round transition ratios: R2->R3 and R3->R4 across early/mid/late",
              "promotion_requires":[
                "0 < decay < 1",
                "combined decay lies between tradesourced and crowdsourced late-round decay",
                "all R5-R6 candidate cells remain positive and globally monotone",
                "maximum absolute change from existing V10 R5-R6 cells <= 10%"
              ],
              "non_blocking_fallback":"If any tail promotion gate fails, retain the already-green V10 MT1 R5-R6 tail."
            },
            "year_discount_policy":{
              "candidate":"V10_YD2_DIRECT_MARKET_GEOMEAN",
              "reference_year":2027,
              "formula":"For each future year Y in {2028,2029}, exp(mean across 12 R1-R4 cells of log(KTC_combined_Y / KTC_combined_2027)))",
              "cell_specific_discounts_forbidden":True,
              "round_specific_discounts_forbidden":True,
              "tier_specific_discounts_forbidden":True,
              "required_checks":[
                "2029 factor <= 2028 factor <= 1",
                "each combined factor lies between tradesourced and crowdsourced factors",
                "LOCO median absolute log error <= 0.06 for each year",
                "LOCO maximum absolute log error <= 0.18 for each year"
              ],
              "2026_fallback_discount_changed":False
            },
            "uncertainty_policy":{
              "historical_outcome_interval":"Propagate frozen Phase 0 joint-bootstrap 95% intervals through the fixed combined-market scaling layer.",
              "market_source_sensitivity":"Report tradesourced-only versus crowdsourced-only market-scale/tail values as a separate sensitivity range.",
              "combine_market_spread_with_bootstrap_into_fake_probability_interval":False,
              "point_estimate_changed_by_uncertainty_layer":False
            },
            "automatic_production_mutation":False,
            "next_stage_if_green":"Draft Pick FV V10 - Phase 3 Production Deployment V2",
          }
          (D/"v10_phase2_5_enhancement_contract.json").write_text(
              json.dumps(contract,indent=2,sort_keys=True)+"\n"
          )

          market={
            "schema_version":1,
            "source":"user-provided KeepTradeCut screenshots re-sent 2026-09-28; Superflex ON; TE Premium NONE",
            "settings":{"superflex":True,"tight_end_premium":False},
            "2027":{
              "tradesourced":{
                "r1_early":5724,"r1_mid":4710,"r1_late":4114,
                "r2_early":3366,"r2_mid":3047,"r2_late":2835,
                "r3_early":2276,"r3_mid":2168,"r3_late":2014,
                "r4_early":1855,"r4_mid":1726,"r4_late":1619
              },
              "crowdsourced":{
                "r1_early":7037,"r1_mid":5791,"r1_late":5058,
                "r2_early":3880,"r2_mid":3512,"r2_late":3268,
                "r3_early":2648,"r3_mid":2521,"r3_late":2342,
                "r4_early":2000,"r4_mid":1861,"r4_late":1745
              },
              "combined":{
                "r1_early":6381,"r1_mid":5250,"r1_late":4586,
                "r2_early":3623,"r2_mid":3279,"r2_late":3051,
                "r3_early":2462,"r3_mid":2344,"r3_late":2178,
                "r4_early":1927,"r4_mid":1794,"r4_late":1682
              }
            },
            "2028":{
              "tradesourced":{
                "r1_early":4826,"r1_mid":4136,"r1_late":3683,
                "r2_early":2769,"r2_mid":2663,"r2_late":2475,
                "r3_early":2042,"r3_mid":2009,"r3_late":1888,
                "r4_early":1885,"r4_mid":1671,"r4_late":1516
              },
              "crowdsourced":{
                "r1_early":5483,"r1_mid":4700,"r1_late":4185,
                "r2_early":3274,"r2_mid":3148,"r2_late":2927,
                "r3_early":2360,"r3_mid":2321,"r3_late":2182,
                "r4_early":1792,"r4_mid":1588,"r4_late":1441
              },
              "combined":{
                "r1_early":5154,"r1_mid":4418,"r1_late":3934,
                "r2_early":3022,"r2_mid":2906,"r2_late":2701,
                "r3_early":2201,"r3_mid":2165,"r3_late":2035,
                "r4_early":1839,"r4_mid":1629,"r4_late":1479
              }
            },
            "2029":{
              "tradesourced":{
                "r1_early":4183,"r1_mid":3713,"r1_late":3431,
                "r2_early":2764,"r2_mid":2506,"r2_late":2373,
                "r3_early":2155,"r3_mid":1914,"r3_late":1882,
                "r4_early":1813,"r4_mid":1561,"r4_late":1394
              },
              "crowdsourced":{
                "r1_early":4585,"r1_mid":4069,"r1_late":3760,
                "r2_early":3033,"r2_mid":2750,"r2_late":2605,
                "r3_early":2256,"r3_mid":2003,"r3_late":1971,
                "r4_early":1571,"r4_mid":1352,"r4_late":1208
              },
              "combined":{
                "r1_early":4384,"r1_mid":3891,"r1_late":3595,
                "r2_early":2898,"r2_mid":2628,"r2_late":2489,
                "r3_early":2205,"r3_mid":1959,"r3_late":1927,
                "r4_early":1692,"r4_mid":1456,"r4_late":1301
              }
            }
          }
          (D/"v10_phase2_5_ktc_2027_2029_screenshot_freeze.json").write_text(
              json.dumps(market,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Phase 2.5 contract and 2027-2029 screenshot market table frozen.")
          PY

      - name: Compute tail V2, YEAR_DISCOUNT V2, and uncertainty
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,statistics
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          p0=json.loads((D/"v10_phase0_expected_value_construct_audit.json").read_text())
          p1=json.loads((D/"v10_phase1_market_bridge_tail_evaluation.json").read_text())
          old_candidate=json.loads((D/"v10_phase1_frozen_production_candidate.json").read_text())
          market=json.loads((D/"v10_phase2_5_ktc_2027_2029_screenshot_freeze.json").read_text())

          tiers=("early","mid","late")
          core_cells=[f"r{r}_{t}" for r in range(1,5) for t in tiers]

          def gm(xs):
              xs=[float(x) for x in xs]
              assert xs and min(xs)>0
              return math.exp(sum(math.log(x) for x in xs)/len(xs))

          def late_decay(series):
              ratios=[]
              for t in tiers:
                  ratios.append(series[f"r3_{t}"]/series[f"r2_{t}"])
                  ratios.append(series[f"r4_{t}"]/series[f"r3_{t}"])
              return gm(ratios)

          k27=market["2027"]
          d_comb=late_decay(k27["combined"])
          d_trade=late_decay(k27["tradesourced"])
          d_crowd=late_decay(k27["crowdsourced"])

          # Non-blocking tail promotion candidate.
          oldv={k:float(v) for k,v in old_candidate["values"].items()}
          candidate={k:oldv[k] for k in oldv if k.startswith(("r1_","r2_","r3_","r4_"))}
          for t in tiers:
              candidate[f"r5_{t}"]=candidate[f"r4_{t}"]*d_comb
              candidate[f"r6_{t}"]=candidate[f"r5_{t}"]*d_comb

          old_tail={k:oldv[k] for k in oldv if k.startswith(("r5_","r6_"))}
          tail_changes={k:candidate[k]/old_tail[k]-1.0 for k in old_tail}
          canonical=[f"r{r}_{t}" for r in range(1,7) for t in tiers]
          xv=[candidate[k] for k in canonical]

          tail_gates={
              "decay_between_zero_and_one":0<d_comb<1,
              "combined_decay_between_trade_and_crowd":
                  min(d_trade,d_crowd)<=d_comb<=max(d_trade,d_crowd),
              "all_positive":min(xv)>0,
              "globally_monotone":all(xv[i]>=xv[i+1]-1e-9 for i in range(len(xv)-1)),
              "max_tail_change_le_10pct":
                  max(abs(x) for x in tail_changes.values())<=0.10,
          }
          tail_promoted=all(tail_gates.values())
          if not tail_promoted:
              for k,v in old_tail.items():
                  candidate[k]=v

          def year_factor(series_y,series_27):
              return gm([series_y[c]/series_27[c] for c in core_cells])

          year_results={}
          for year in ("2028","2029"):
              comb=year_factor(market[year]["combined"],market["2027"]["combined"])
              tr=year_factor(market[year]["tradesourced"],market["2027"]["tradesourced"])
              cr=year_factor(market[year]["crowdsourced"],market["2027"]["crowdsourced"])

              loco=[]
              for held in core_cells:
                  others=[c for c in core_cells if c!=held]
                  mh=gm([
                      market[year]["combined"][c]/market["2027"]["combined"][c]
                      for c in others
                  ])
                  pred=market["2027"]["combined"][held]*mh
                  actual=market[year]["combined"][held]
                  loco.append({
                      "held_out_cell":held,
                      "factor":mh,
                      "prediction":pred,
                      "actual":actual,
                      "abs_log_error":abs(math.log(pred/actual)),
                  })

              year_results[year]={
                  "combined_factor":comb,
                  "tradesourced_factor":tr,
                  "crowdsourced_factor":cr,
                  "combined_between_trade_and_crowd":
                      min(tr,cr)<=comb<=max(tr,cr),
                  "loco_median_abs_log_error":
                      statistics.median(x["abs_log_error"] for x in loco),
                  "loco_max_abs_log_error":
                      max(x["abs_log_error"] for x in loco),
                  "leave_one_cell_out":loco,
              }

          yd={
              "2027":1.0,
              "2028":year_results["2028"]["combined_factor"],
              "2029":year_results["2029"]["combined_factor"],
          }
          year_gates={
              "ordered_2029_le_2028_le_1":
                  0<yd["2029"]<=yd["2028"]<=1,
              "2028_combined_between_trade_and_crowd":
                  year_results["2028"]["combined_between_trade_and_crowd"],
              "2029_combined_between_trade_and_crowd":
                  year_results["2029"]["combined_between_trade_and_crowd"],
              "2028_loco_median_le_0_06":
                  year_results["2028"]["loco_median_abs_log_error"]<=0.06,
              "2029_loco_median_le_0_06":
                  year_results["2029"]["loco_median_abs_log_error"]<=0.06,
              "2028_loco_max_le_0_18":
                  year_results["2028"]["loco_max_abs_log_error"]<=0.18,
              "2029_loco_max_le_0_18":
                  year_results["2029"]["loco_max_abs_log_error"]<=0.18,
          }
          assert all(year_gates.values()),year_gates

          # Uncertainty: keep historical bootstrap and market-source disagreement separate.
          combined_m=float(p1["market_bridge"]["combined_multiplier"])
          trade_m=float(p1["market_bridge"]["tradesourced_multiplier"])
          crowd_m=float(p1["market_bridge"]["crowdsourced_multiplier"])

          uncertainty={}
          for r in range(1,5):
              for t in tiers:
                  cell=f"r{r}_{t}"
                  u=p0["core_uncertainty"][cell]
                  point=float(p0["core_raw_expected_value"][cell])
                  uncertainty[cell]={
                      "point_estimate":candidate[cell],
                      "historical_outcome_95":{
                          "lower":float(u["p025"])*combined_m,
                          "upper":float(u["p975"])*combined_m,
                          "relative_halfwidth":float(u["relative_95_halfwidth"]),
                      },
                      "market_source_sensitivity":{
                          "tradesourced_scale":point*trade_m,
                          "crowdsourced_scale":point*crowd_m,
                          "lower":min(point*trade_m,point*crowd_m),
                          "upper":max(point*trade_m,point*crowd_m),
                      },
                      "interpretation":"Historical interval is bootstrap uncertainty; market-source range is sensitivity, not a probability interval."
                  }

          # Tail uncertainty inherits its matching R4 historical interval and source-specific
          # market scaling/late-round decay. This remains descriptive, not a new fitted tail.
          for t in tiers:
              r4=f"r4_{t}"
              r4u=uncertainty[r4]
              fundamental_r4=float(p0["core_raw_expected_value"][r4])
              for rnd,power in ((5,1),(6,2)):
                  cell=f"r{rnd}_{t}"
                  hist_lo=r4u["historical_outcome_95"]["lower"]*(d_comb**power)
                  hist_hi=r4u["historical_outcome_95"]["upper"]*(d_comb**power)
                  trade_val=fundamental_r4*trade_m*(d_trade**power)
                  crowd_val=fundamental_r4*crowd_m*(d_crowd**power)
                  uncertainty[cell]={
                      "point_estimate":candidate[cell],
                      "historical_outcome_95":{
                          "lower":hist_lo,
                          "upper":hist_hi,
                          "relative_halfwidth":
                              r4u["historical_outcome_95"]["relative_halfwidth"],
                      },
                      "market_source_sensitivity":{
                          "tradesourced_scale_and_tail":trade_val,
                          "crowdsourced_scale_and_tail":crowd_val,
                          "lower":min(trade_val,crowd_val),
                          "upper":max(trade_val,crowd_val),
                      },
                      "interpretation":"Tail interval propagates matching R4 historical uncertainty through fixed tail decay; market-source range is sensitivity only."
                  }

          # Year-discount market-source sensitivity, also not a probability interval.
          year_discount_sensitivity={
              year:{
                  "point_combined":year_results[year]["combined_factor"],
                  "tradesourced":year_results[year]["tradesourced_factor"],
                  "crowdsourced":year_results[year]["crowdsourced_factor"],
                  "lower":min(
                      year_results[year]["tradesourced_factor"],
                      year_results[year]["crowdsourced_factor"]
                  ),
                  "upper":max(
                      year_results[year]["tradesourced_factor"],
                      year_results[year]["crowdsourced_factor"]
                  ),
              }
              for year in ("2028","2029")
          }

          result={
              "schema_version":1,
              "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
              "stage":"phase2_5_tail_year_discount_uncertainty",
              "tail_v2":{
                  "candidate_id":"V10_MT2_LATE_ROUND_LOG_LINEAR",
                  "combined_decay":d_comb,
                  "tradesourced_decay":d_trade,
                  "crowdsourced_decay":d_crowd,
                  "changes_vs_v10_mt1":tail_changes,
                  "gates":tail_gates,
                  "promoted":tail_promoted,
                  "fallback_if_not_promoted":"V10_MT1_R3_R4_MARKET_DECAY_EXTRAPOLATION",
              },
              "year_discount_v2":{
                  "candidate_id":"V10_YD2_DIRECT_MARKET_GEOMEAN",
                  "factors":yd,
                  "2026_fallback_unchanged":0.6,
                  "year_results":year_results,
                  "gates":year_gates,
                  "all_gates_pass":all(year_gates.values()),
              },
              "enhanced_pick_base_values":candidate,
              "uncertainty":uncertainty,
              "year_discount_market_source_sensitivity":year_discount_sensitivity,
              "production_change_authorized":False,
              "decision":"PASS_V10_PHASE2_5_AUTHORIZE_UPDATED_PHASE3_ENGINEERING_DEPLOYMENT",
              "next_stage":"Draft Pick FV V10 - Phase 3 Production Deployment V2",
          }

          (D/"v10_phase2_5_enhancement_result.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          # Compact production candidate artifact.
          candidate_artifact={
              "schema_version":1,
              "candidate_id":"V10_C1_PLUS_M1_PLUS_MT2_PLUS_YD2"
                  if tail_promoted else "V10_C1_PLUS_M1_PLUS_MT1_PLUS_YD2",
              "tail_v2_promoted":tail_promoted,
              "pick_base_values":candidate,
              "year_discount":yd,
              "fallback_discount":0.6,
              "uncertainty_artifact":"v10_phase2_5_enhancement_result.json",
              "production_change_authorized":False,
          }
          (D/"v10_phase2_5_frozen_production_candidate.json").write_text(
              json.dumps(candidate_artifact,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              "tail_promoted":tail_promoted,
              "tail_decay":d_comb,
              "tail_max_abs_change":max(abs(x) for x in tail_changes.values()),
              "year_discount":yd,
              "year_gates":year_gates,
          },indent=2))
          PY

      - name: Freeze exact-slot to-do item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          todo={
              "schema_version":1,
              "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
              "items":[
                  {
                      "id":"exact-rookie-slot-curve-v1",
                      "status":"TODO_POST_V10",
                      "priority":"medium",
                      "description":"When exact rookie draft order/slot is known, replace broad early/mid/late bucketing with a monotone slot-level value curve (for example 1.01, 1.02, ...), while retaining early/mid/late for genuinely unknown future picks.",
                      "constraints":[
                          "derive from historical rookie outcomes before consulting market residuals",
                          "enforce monotonicity across exact slots",
                          "do not infer an exact slot for future picks whose order is unknown",
                          "validate against independent market/trade evidence before production"
                      ]
                  }
              ]
          }
          (D/"v10_todo.json").write_text(json.dumps(todo,indent=2,sort_keys=True)+"\n")
          print("PASS: exact rookie-slot model added to V10 to-do list.")
          PY

      - name: Build enhanced shadow production constants
        shell: bash
        run: |
          set -euo pipefail
          cp index.html "${RUNNER_TEMP}/v10-25-index-before.html"
          cp free-agent-board.html "${RUNNER_TEMP}/v10-25-fab-before.html"
          cp trade-desk-preview.html "${RUNNER_TEMP}/v10-25-preview-before.html"

          python3 - <<'PY'
          import json,re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          c=json.loads((D/"v10_phase2_5_frozen_production_candidate.json").read_text())
          v=c["pick_base_values"]
          yd=c["year_discount"]

          def fmt(x):
              s=f"{float(x):.10f}".rstrip("0").rstrip(".")
              return s if "." in s else s+".0"

          new_pick="\n".join([
              "const PICK_BASE = {",
              f"  1: {{early:{fmt(v['r1_early'])}, mid:{fmt(v['r1_mid'])}, late:{fmt(v['r1_late'])}}},",
              f"  2: {{early:{fmt(v['r2_early'])}, mid:{fmt(v['r2_mid'])}, late:{fmt(v['r2_late'])}}},",
              f"  3: {{early:{fmt(v['r3_early'])}, mid:{fmt(v['r3_mid'])}, late:{fmt(v['r3_late'])}}},",
              f"  4: {{early:{fmt(v['r4_early'])}, mid:{fmt(v['r4_mid'])}, late:{fmt(v['r4_late'])}}},",
              f"  5: {{early:{fmt(v['r5_early'])}, mid:{fmt(v['r5_mid'])}, late:{fmt(v['r5_late'])}}},",
              f"  6: {{early:{fmt(v['r6_early'])}, mid:{fmt(v['r6_mid'])}, late:{fmt(v['r6_late'])}}},",
              "};",
          ])
          new_yd=(
              "const YEAR_DISCOUNT = { "
              f"'2027':1.0, '2028':{fmt(yd['2028'])}, '2029':{fmt(yd['2029'])} "
              "};"
          )

          pick_pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          yd_pat=re.compile(r"const YEAR_DISCOUNT = \{[^\n]+\};")

          for name in ("index.html","free-agent-board.html"):
              p=Path(name)
              t=p.read_text(encoding="utf-8")
              pm=list(pick_pat.finditer(t)); ym=list(yd_pat.finditer(t))
              assert len(pm)==1,(name,"pick",len(pm))
              assert len(ym)==1,(name,"yd",len(ym))
              t=t[:pm[0].start()]+new_pick+t[pm[0].end():]
              # Re-find YEAR_DISCOUNT after PICK_BASE length changed.
              ym=list(yd_pat.finditer(t)); assert len(ym)==1
              t=t[:ym[0].start()]+new_yd+t[ym[0].end():]
              p.write_text(t,encoding="utf-8")

          print("PASS: enhanced PICK_BASE + YEAR_DISCOUNT applied to shadow surfaces.")
          PY

      - name: Validate enhanced runtime outputs and mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,os,re
          from pathlib import Path

          tmp=Path(os.environ["RUNNER_TEMP"])
          D=Path("research/draft-pick-fv-v10")
          c=json.loads((D/"v10_phase2_5_frozen_production_candidate.json").read_text())
          v=c["pick_base_values"]
          yd=c["year_discount"]

          pick_pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          yd_pat=re.compile(r"const YEAR_DISCOUNT = \{[^\n]+\};")

          def strip_allowed(text):
              text=pick_pat.sub("<<PICK_BASE>>",text,count=1)
              text=yd_pat.sub("<<YEAR_DISCOUNT>>",text,count=1)
              return text

          for before,current in (
              (tmp/"v10-25-index-before.html","index.html"),
              (tmp/"v10-25-fab-before.html","free-agent-board.html"),
          ):
              b=before.read_text(encoding="utf-8")
              now=Path(current).read_text(encoding="utf-8")
              assert strip_allowed(b)==strip_allowed(now),f"non-constant drift: {current}"
              assert "const disc = YEAR_DISCOUNT[year] ?? 0.6;" in now
              assert "return Math.round(base * disc);" in now

          assert Path("trade-desk-preview.html").read_bytes()==(tmp/"v10-25-preview-before.html").read_bytes()

          def js_round(x): return math.floor(float(x)+0.5)
          expected={}
          factors={"2026":0.6,"2027":1.0,"2028":yd["2028"],"2029":yd["2029"]}
          for year,disc in factors.items():
              expected[year]={}
              for r in range(1,7):
                  expected[year][str(r)]={
                      t:js_round(v[f"r{r}_{t}"]*disc) for t in ("early","mid","late")
                  }

          def snapshot(name):
              t=Path(name).read_text(encoding="utf-8")
              pm=pick_pat.search(t); assert pm
              nums=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",pm.group(0))))
              assert len(nums)==18
              out={}
              for year,disc in factors.items():
                  out[year]={}
                  for r in range(1,7):
                      i=(r-1)*3
                      out[year][str(r)]={
                          "early":js_round(nums[i]*disc),
                          "mid":js_round(nums[i+1]*disc),
                          "late":js_round(nums[i+2]*disc),
                      }
              return out

          a=snapshot("index.html")
          b=snapshot("free-agent-board.html")
          assert a==b==expected
          assert sum(len(x) for rounds in expected.values() for x in rounds.values())==72

          (D/"v10_phase2_5_runtime_snapshot.json").write_text(
              json.dumps(expected,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: exact mutation scope and all 72 enhanced runtime outputs validated.")
          PY

