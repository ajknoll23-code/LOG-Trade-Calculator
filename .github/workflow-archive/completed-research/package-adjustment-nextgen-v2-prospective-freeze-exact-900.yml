      - name: Prove exactly two intended research files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/prospective_exact_900_frozen_v1.json",
              "research/package-adjustment-nextgen-v2/prospective_exact_900_freeze_manifest_v1.json",
          }
          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          actual = {line[3:] for line in lines if line.strip()}
          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )
          print("PASS: only the two intended frozen research files changed.")
          PY

      - name: Upload exact-900 freeze proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgnv2-prospective-exact-900-freeze-proof
          path: |
            research/package-adjustment-nextgen-v2/prospective_exact_900_frozen_v1.json
            research/package-adjustment-nextgen-v2/prospective_exact_900_freeze_manifest_v1.json
            /tmp/prospective_exact_900_freeze_report.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact-900 freeze to main
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          DATA="$D/prospective_exact_900_frozen_v1.json"
          MANIFEST="$D/prospective_exact_900_freeze_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$DATA" "$MANIFEST"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=(
            "$DATA"
            "$MANIFEST"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#STAGED[@]}" -eq 2
          test "$(printf '%s\n' "${STAGED[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m "Freeze NextGen V2 prospective evidence at exact 900"
          git pull --rebase origin main

          # Re-check frozen inputs after rebasing before publishing the freeze.
          test "$(git hash-object "$D/prospective_time_holdout_preregistration_v1.json")" = \
            "f37b18ec24ae9fa73872069963be7d13f620e80a"
          test "$(git hash-object "$D/package_vote_challenges_prospective_v1.json")" = \
            "b338b18291c5058c5a2b941e1293322e2e70ea8c"
          test "$(git hash-object "$D/prospective_voting_restart_30_daily_v1.json")" = \
            "2b8fbc79d0c0c7da31aa0a2ce2d2c4b44c554e2b"
          test "$(git hash-object "$D/research_candidate_m2b_v1.json")" = \
            "1560124540e1104fdc4f4e9f367d984b46921cb9"

          # The rebased freeze commit itself must still touch exactly two paths.
          mapfile -t COMMITTED < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "${#COMMITTED[@]}" -eq 2
          test "$(printf '%s\n' "${COMMITTED[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git push origin main
          echo "PASS: exact-900 prospective evidence frozen and committed to main."
