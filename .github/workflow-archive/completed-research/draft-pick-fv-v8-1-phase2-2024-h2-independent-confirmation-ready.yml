            --repo "$GITHUB_WORKSPACE" \
            --prereg "research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.json" \
            --phase1 "research/draft-pick-fv-v8-1/v8_1_phase1_sparse_tail_sensitivity.json" \
            --holdout "research/draft-pick-fv-v8-1/v8_1_phase1_6_holdout_source_identity.json" \
            --p2-dir "${RUNNER_TEMP}/p2" \
            --season-2024 "${RUNNER_TEMP}/s24/season_2024.json" \
            --season-2025 "${RUNNER_TEMP}/s25/season_2025.json" \
            --p2-engine "${RUNNER_TEMP}/p2engine/v8_phase2_outcomes.py" \
            --players "${RUNNER_TEMP}/v7assets/nflverse_players.csv" \
            --out-dir "$OUT"
          python3 research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_frozen.py \
            --check --out-dir "$OUT"

      - name: Preserve one-shot recovery evidence after durable lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-p2-2024-h2-one-shot-recovery-${{ github.run_id }}
          path: |
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_lock.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_frozen.py
            ${{ runner.temp }}/out/**
          if-no-files-found: warn
          retention-days: 30

      - name: Independently audit frozen H2 pass or stop decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib,json,math,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"out"
          d=Path("research/draft-pick-fv-v8-1")
          r=json.loads((out/"v8_1_phase2_2024_h2_confirmation.json").read_text())
          m=json.loads((out/"v8_1_phase2_2024_h2_confirmation_manifest.json").read_text())
          lock=json.loads((d/"v8_1_phase2_2024_h2_opening_lock.json").read_text())
          allowed={"PASS_V8_1_2024_H2_CONTINUE_TO_FUTURE_H3","STOP_V8_1_2024_H2_CONFIRMATION"}
          assert r["decision"] in allowed and m["decision"]==r["decision"]
          assert len(r["gates"])==6
          assert r["gate_pass"]==all(r["gates"].values())
          assert (r["decision"]=="PASS_V8_1_2024_H2_CONTINUE_TO_FUTURE_H3")==r["gate_pass"]
          assert r["frozen_primary"]["k"]==0.3557942893
          assert r["frozen_primary"]["candidate_refit_performed"] is False
          assert r["source_holdout"]["league_ids"]==["10302","21269","23907","64635","65168","68399","70523","74598"]
          assert r["source_holdout"]["excluded_preoutcome_devy_league_ids"]==["48514","65200"]
          assert r["source_holdout"]["first48_replay"]["exact_match"] is True
          assert r["target_lineage"]["source_occurrence_n"]==574
          assert r["target_lineage"]["supported_model_position_occurrence_n"]==571
          assert r["target_lineage"]["unsupported_model_position_occurrence_n"]==3
          assert r["holdout_opening"]["2024_rookie_H2_outcomes_scored"] is True
          assert r["holdout_opening"]["2024_H3_confirmation_scored"] is False
          assert r["holdout_opening"]["2026_outcomes_read"] is False
          assert r["firewalls"]["candidate_refit_performed"] is False
          assert r["firewalls"]["candidate_selection_or_tuning_performed"] is False
          assert r["firewalls"]["YEAR_DISCOUNT_fit_or_changed"] is False
          assert r["firewalls"]["production_change_authorized"] is False
          assert lock["scorer_sha256"]==hashlib.sha256((d/"v8_1_phase2_2024_h2_confirmation_frozen.py").read_bytes()).hexdigest()
          o2=r["metrics"]["h2_o2"]; sh=r["metrics"]["h2_o1_shape"]
          nums=[o2["C0_equal_cell_macro_mae"],o2["C1_equal_cell_macro_mae"],o2["C1_improvement_vs_C0"],o2["combined_r5_r6_relative_regression_vs_C0"],sh["C0_normalized_18_cell_shape_error"],sh["C1_normalized_18_cell_shape_error"],sh["C1_relative_regression_vs_C0"]]
          nums+=list(o2["round_relative_regression_vs_C0"].values())
          assert all(math.isfinite(float(x)) for x in nums)
          print("PASS: exact six-gate H2 decision validated; no H3/2026/production action occurred.")
          print("DECISION=",r["decision"],sep="")
          print("H2_O2_IMPROVEMENT=",o2["C1_improvement_vs_C0"],sep="")
          print("WORST_ROUND_REL=",max(o2["round_relative_regression_vs_C0"].values()),sep="")
          print("R5_R6_REL=",o2["combined_r5_r6_relative_regression_vs_C0"],sep="")
          print("O1_SHAPE_REL=",sh["C1_relative_regression_vs_C0"],sep="")
          PY2

      - name: Stage immutable H2 result and one-shot closeout
        shell: bash
        env:
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v8-1"; OUT="${RUNNER_TEMP}/out"
          cp "$OUT/v8_1_phase2_2024_h2_scored_occurrences.jsonl" "$D/"
          cp "$OUT/v8_1_phase2_2024_h2_confirmation.json" "$D/"
          cp "$OUT/v8_1_phase2_2024_h2_confirmation.md" "$D/"
          cp "$OUT/v8_1_phase2_2024_h2_confirmation_manifest.json" "$D/"

          python3 - <<'PY2'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          d=Path("research/draft-pick-fv-v8-1")
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          r=json.loads((d/"v8_1_phase2_2024_h2_confirmation.json").read_text())
          lock=d/"v8_1_phase2_2024_h2_opening_lock.json"
          close={
            "schema_version":1,
            "study_id":r["study_id"],
            "stage":"phase2_2024_h2_one_shot_opening_closeout",
            "generated_at_utc":datetime.now(timezone.utc).isoformat(),
            "opening_lock_commit_sha":os.environ["LOCK_SHA"],
            "opening_lock_sha256":sha(lock),
            "scorer_sha256":sha(d/"v8_1_phase2_2024_h2_confirmation_frozen.py"),
            "result_sha256":sha(d/"v8_1_phase2_2024_h2_confirmation.json"),
            "result_manifest_sha256":sha(d/"v8_1_phase2_2024_h2_confirmation_manifest.json"),
            "scored_occurrences_sha256":sha(d/"v8_1_phase2_2024_h2_scored_occurrences.jsonl"),
            "decision":r["decision"],
            "gate_pass":r["gate_pass"],
            "2024_h2_outcome_bytes_opened":True,
            "2024_rookie_h2_scored":True,
            "2024_h3_scored":False,
            "2026_outcomes_read":False,
            "normal_rerun_allowed":False,
            "production_change_authorized":False,
          }
          (d/"v8_1_phase2_2024_h2_opening_closeout.json").write_text(json.dumps(close,indent=2,sort_keys=True)+"\n")
          PY2

          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json"
            "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md"
            "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json"
            "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_closeout.json"
            "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          test -z "$(git diff --name-only -- index.html scripts/)"
          echo "PASS: post-open mutation scope is exactly five research result files."

      - name: Upload one-shot H2 evidence immediately
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-p2-2024-h2-one-shot-confirmation
          path: |
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_lock.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_frozen.py
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_closeout.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit final one-shot H2 result
        shell: bash
        env:
          LOCK_SHA: ${{ steps.lock.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$LOCK_SHA" || {
            echo "ERROR: origin/main moved after H2 opening. The result artifact is preserved; do NOT rerun the normal workflow."
            exit 1
          }
          git add \
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl \
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json \
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md \
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json \
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_closeout.json
          git commit -m "Freeze Draft Pick FV V8.1 2024 H2 one-shot confirmation"
          git push origin HEAD:main
          echo "PASS: one-shot H2 result frozen to main. This workflow is permanently non-rerunnable by lock."
