# PREFLIGHTED: B17C_V2_WORKFLOW_FOLDER_CLEANUP_FILENAME_GUARD_FIX
name: B17C V3 Workflow Folder Cleanup - Dependency Fix

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SELF_WORKFLOW: "B17C-V3-workflow-cleanup.yml"
  ARCHIVE_TARGETS_JSON: '["A16-workflow-folder-cleanup-post-identity-v2.yml","A17-qb-structural-integrity-audit-v1.yml","A18-rb-structural-integrity-audit-v1.yml","A19-wr-structural-integrity-audit-v1.yml","A20-te-structural-integrity-audit-v1.yml","B1-db-structural-integrity-audit-v1.yml","B10-draft-class-strength-v1-historical-identity-recovery.yml","B10-v2-draft-class-strength-v1-historical-identity-recovery.yml","B11-draft-class-strength-v1-top60-priority-identity-recovery.yml","B11-v2-draft-class-strength-v1-top60-priority-identity-recovery.yml","B12-draft-class-strength-v2-top60-stable-era-preregistration.yml","B13-draft-class-strength-v2-top60-formal-target-execution.yml","B14-v2-draft-class-strength-residual-closeout-2027-anchor-archive-preregistration.yml","B15-draft-capital-outlook-v1-2027-point-in-time-anchor-archive-capture.yml","B16-draft-capital-outlook-v1-historical-anchor-snapshot-feasibility.yml","B16-v2-draft-capital-outlook-v1-historical-anchor-snapshot-feasibility-discovery-fix.yml","B17-V2.yml","B17.yml","B17A-V2.yml","B17A-V3.yml","B17A.yml","B3-draft-class-strength-v1-phase0a-target-reliability-v2.yml","B4-draft-class-strength-v1-historical-target-expansion-source-feasibility.yml","B5-draft-class-strength-v1-option-d-historical-fundamental-target-preregistration.yml","B6-draft-class-strength-v1-option-d-historical-target-formal-v0-v2.yml","B6-draft-class-strength-v1-option-d-historical-target-formal-v0-v3.yml","B6-draft-class-strength-v1-option-d-historical-target-formal-v0.yml","B7-draft-class-strength-v1-stage-a-null-autopsy-defect-confirmation.yml","B8-draft-class-strength-v1-stage-b-fixed-cohort-preregistration.yml","B9-draft-class-strength-v1-stage-b-fixed-cohort-formal-execution.yml","draft-pick-fv-v10-phase0-expected-value-prereg-and-construct-audit.yml","draft-pick-fv-v10-phase1-market-bridge-tail-freeze.yml","draft-pick-fv-v10-phase2-5-tail-year-discount-uncertainty.yml","draft-pick-fv-v10-phase2-production-candidate-audit-v2.yml","draft-pick-fv-v10-phase2-production-candidate-audit.yml","draft-pick-fv-v10-phase3-production-deployment-v2.yml","draft-pick-fv-v9-phase0-1-production-candidate-development-freeze-FIXED.yml","draft-pick-fv-v9-phase0-1-production-candidate-development-freeze.yml","draft-pick-fv-v9-phase2-production-engineering-bridge.yml","draft-pick-fv-v9-production-rollback.yml","package-adjustment-v8-development-voting-activation-v1.yml","package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml","package-adjustment-v8-phase1c-development-catalog-and-audit-v1.yml","package-adjustment-v8-phase1d-fixed50-protocol-amendment-v1.yml","package-adjustment-v8-phase1e-evaluation-engine-freeze-v2.yml","package-adjustment-v8-phase1f-pre-vote-operational-hardening-v2.yml","package-adjustment-v8-phase1f-pre-vote-operational-hardening-v3.yml","B17C-workflow-cleanup.yml","B17C-V2-workflow-cleanup.yml"]'
  PROTECTED_WORKFLOWS_JSON: '["B17V2-FIXED.yml","B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml","age-curve-v2-phase5.yml","cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml","durability-v2-phase5.yml","fantasypros-api-pipeline.yml","free-agent-utility-v1-refresh.yml","idp-dl-lb-phase2.yml","ktc-vote-aggregation.yml","ktc_voter_balance_prospective.yml","market-edge-v1-prospective-study.yml","no-history-rookie-v2-phase3.yml","opportunity-v2-phase5.yml","package-adjustment-audit-step4-exact-live-oos.yml","position-weight-v2-phase5.yml","prospective-trade-evidence-capture.yml","replacement-level-v2-phase5.yml","repo-regression-checks.yml","research-program-status-v1-current-state-audit.yml","scheduled-data-refresh.yml","sync-sleeper.yml"]'

jobs:
  cleanup:
    name: Archive completed workflows and preserve active surface
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install cleanup and regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Smoke-test regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests
          print("PASS: requests import available for repository regression checks.")
          PY

      - name: Guard exact active inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          workflow_dir=Path(".github/workflows")
          archive_targets=set(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
          protected=set(json.loads(os.environ["PROTECTED_WORKFLOWS_JSON"]))
          this_cleanup=os.environ["SELF_WORKFLOW"]

          current={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }
          expected=archive_targets|protected|{this_cleanup}

          if current != expected:
              raise SystemExit(
                  "Active workflow inventory differs from B17C V2 frozen plan.\n"
                  f"Missing: {sorted(expected-current)}\n"
                  f"Unexpected: {sorted(current-expected)}"
              )

          assert len(archive_targets)==49, len(archive_targets)
          assert len(protected)==21, len(protected)
          assert len(current)==71, len(current)
          assert "B17C-workflow-cleanup.yml" in archive_targets
          assert "B17C-V2-workflow-cleanup.yml" in archive_targets
          assert this_cleanup in current
          assert "B17V2-FIXED.yml" in protected
          assert "B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml" in protected

          cleanup_named=sorted(n for n in current if "cleanup" in n.lower())
          assert cleanup_named==sorted([
              "A16-workflow-folder-cleanup-post-identity-v2.yml",
              "B17C-workflow-cleanup.yml",
              "B17C-V2-workflow-cleanup.yml",
              this_cleanup,
          ]), cleanup_named

          print("PASS: exact pre-cleanup workflow inventory = 71.")
          print("PASS: 49 archive targets identified, including failed B17C V1 and V2.")
          print("PASS: 21 protected active workflows preserved.")
          PY

      - name: Guard current scientific handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          a=json.loads((D/"b17a_v3_snapshot_family_integrity_summary.json").read_text())
          am=json.loads((D/"b17a_v3_manifest.json").read_text())

          assert a["decision"]=="PASS_B17A_V3_SNAPSHOT_FAMILY_INTEGRITY_AUTHORIZE_B17_V2_IMPLEMENTATION_REPLAY_ONLY"
          assert a["integrity_gate_pass"] is True
          assert a["coherent_top60_family_n"]==10
          assert a["b17_v2_implementation_replay_authorized"] is True
          assert am["decision"]==a["decision"]
          assert am["production_change_authorized"] is False

          assert Path(".github/workflows/B17V2-FIXED.yml").is_file()
          assert Path(".github/workflows/B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml").is_file()

          print("PASS: Draft Capital scientific lineage preserved.")
          print("PASS: Package Adjustment V8 maturity monitor V2 preserved.")
          PY

      - name: Pre-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Archive exact completed and superseded workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from datetime import datetime, timezone
          from pathlib import Path

          workflow_dir=Path(".github/workflows")
          archive_dir=Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True,exist_ok=True)
          targets=sorted(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
          moved=[]

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for name in targets:
              src=workflow_dir/name
              dst=archive_dir/name
              if not src.is_file():
                  raise SystemExit(f"Archive target missing: {src}")

              before=sha256(src)
              if dst.exists():
                  after=sha256(dst)
                  if after != before:
                      raise SystemExit(
                          f"Archive collision with different bytes: {dst} "
                          f"source_sha256={before} existing_sha256={after}"
                      )
                  src.unlink()
                  action="source_removed_existing_identical_archive"
              else:
                  shutil.move(str(src),str(dst))
                  after=sha256(dst)
                  if after != before:
                      raise SystemExit(
                          f"Byte identity failure moving {name}: {before} != {after}"
                      )
                  action="moved_to_archive"

              moved.append({
                  "filename":name,
                  "sha256":before,
                  "action":action,
                  "archive_path":str(dst),
              })

          batch={
              "schema_version":2,
              "batch_id":"2026-09-30-b17c-v3-dependency-fix",
              "created_utc":datetime.now(timezone.utc).isoformat(),
              "archive_count":len(moved),
              "active_count_after_cleanup":22,
              "current_active_research_workflow":"B17V2-FIXED.yml",
              "package_adjustment_monitor":"B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml",
              "failed_cleanup_workflows_archived":["B17C-workflow-cleanup.yml","B17C-V2-workflow-cleanup.yml"],
              "reason":"Correct B17C V1 filename self-reference and B17C V2 missing-requests regression dependency; archive the same completed/superseded workflow set without changing research or production artifacts.",
              "entries":moved,
          }
          manifest=archive_dir/"cleanup_batch_2026-09-30_b17c_v3.json"
          manifest.write_text(json.dumps(batch,indent=2,sort_keys=True)+"\n")

          assert len(moved)==49
          print("PASS: archived 49 byte-identical workflow files.")
          print(f"PASS: cleanup batch manifest written: {manifest}")
          PY

      - name: Validate post-cleanup active workflow surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          workflow_dir=Path(".github/workflows")
          archive_dir=Path(".github/workflow-archive/completed-research")
          this_cleanup=os.environ["SELF_WORKFLOW"]
          protected=set(json.loads(os.environ["PROTECTED_WORKFLOWS_JSON"]))
          expected=protected|{this_cleanup}

          active={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }
          assert active==expected,(sorted(active-expected),sorted(expected-active))
          assert len(active)==22

          cleanup_named=sorted(n for n in active if "cleanup" in n.lower())
          assert cleanup_named==[this_cleanup],cleanup_named

          for name in sorted(active):
              p=workflow_dir/name
              doc=yaml.safe_load(p.read_text())
              assert isinstance(doc,dict),name
              assert "jobs" in doc and isinstance(doc["jobs"],dict) and doc["jobs"],name

          assert (archive_dir/"A16-workflow-folder-cleanup-post-identity-v2.yml").is_file()
          assert (archive_dir/"B17A-V3.yml").is_file()
          assert (archive_dir/"B17-V2.yml").is_file()
          assert (archive_dir/"B17C-workflow-cleanup.yml").is_file()
          assert (archive_dir/"B17C-V2-workflow-cleanup.yml").is_file()
          assert (workflow_dir/"B17V2-FIXED.yml").is_file()
          assert (workflow_dir/this_cleanup).is_file()

          print("PASS: post-cleanup active workflow inventory = 22.")
          print("PASS: B17C V3 is the sole active cleanup workflow.")
          print("PASS: all active workflow YAML files parse and contain jobs.")
          PY

      - name: Post-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove cleanup-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith(".github/workflows/")
              or p.startswith(".github/workflow-archive/completed-research/")
              for p in touched
          ),touched
          assert not any(
              p=="index.html"
              or p=="free-agent-board.html"
              or p.startswith(("data/","model/","scripts/","research/"))
              for p in touched
          ),touched

          print("PASS: mutation scope is workflow cleanup/archive only.")
          PY

      - name: Commit workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17C V3 cleanup."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive/completed-research
          git diff --cached --check
          git commit -m "Archive completed workflows with B17C V3 dependency fix"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17C V3 workflow cleanup committed."
