name: Draft Pick FV V10 - Phase 2 Production Candidate Audit V2

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: draft-pick-fv-v10-phase2-production-candidate-audit-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture audit base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact frozen Phase 1 candidate and current production baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          prereg=D/"v10_phase1_market_bridge_tail_preregistration.json"
          evaluation=D/"v10_phase1_market_bridge_tail_evaluation.json"
          candidate=D/"v10_phase1_frozen_production_candidate.json"
          manifest=D/"v10_phase1_market_bridge_tail_manifest.json"

          expected_sha256={
              prereg:"5186676e33fdc9bd586938c1f2e67b073c30bbe77562130d2958c5267dddb5e1",
              evaluation:"e0c3a1d018d64aa32e45a9c1a437fa1e37a5e33b07f574d0d0b4d776a25cc006",
              candidate:"261989459b788ff8f05e5c66607791fcbcabe2ec31c3c08be27b8e4b51bf54c9",
          }
          for p,want in expected_sha256.items():
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want,(str(p),want,got)

          p=json.loads(prereg.read_text())
          e=json.loads(evaluation.read_text())
          c=json.loads(candidate.read_text())
          m=json.loads(manifest.read_text())

          decision="FREEZE_V10_PHASE1_MARKET_TRANSLATED_PICK_CURVE_AUTHORIZE_PHASE2_AUDIT"
          assert p["decision"]=="FREEZE_V10_PHASE1_SEPARATE_FUNDAMENTAL_AND_MARKET_TRANSLATION_LAYERS"
          assert e["decision"]==decision
          assert c["decision"]==decision
          assert m["decision"]==decision
          assert e["all_phase1_gates_pass"] is True
          assert all(e["gates"].values())
          assert c["all_phase1_gates_pass"] is True
          assert e["phase0_fundamental_core_unchanged"] is True
          assert e["production_change_authorized"] is False
          assert c["production_change_authorized"] is False
          assert m["production_change_authorized"] is False
          assert e["year_discount_changed"] is False
          assert c["year_discount_changed"] is False
          assert m["year_discount_changed"] is False

          vals=c["values"]
          canonical=[
              "r1_early","r1_mid","r1_late",
              "r2_early","r2_mid","r2_late",
              "r3_early","r3_mid","r3_late",
              "r4_early","r4_mid","r4_late",
              "r5_early","r5_mid","r5_late",
              "r6_early","r6_mid","r6_late",
          ]
          x=[float(vals[k]) for k in canonical]
          assert len(vals)==18 and set(vals)==set(canonical)
          assert min(x)>0
          assert all(x[i]>=x[i+1]-1e-9 for i in range(17))
          assert abs(float(c["global_market_multiplier"])-2.24417411952795)<1e-12
          assert abs(float(c["market_tail_decay"])-0.7734083759824667)<1e-12

          c0=[
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          for name in ("index.html","free-agent-board.html"):
              t=Path(name).read_text(encoding="utf-8")
              mm=pat.search(t); assert mm,name
              nums=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",mm.group(0))))
              assert nums==list(map(float,c0)),(name,nums)
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in t
              assert "return Math.round(base * disc);" in t

          print("PASS: exact Phase 1 candidate frozen; production still exact rolled-back C0.")
          PY

      - name: Freeze Phase 2 engineering audit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          obj={
            "schema_version":1,
            "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
            "stage":"phase2_production_candidate_engineering_audit",
            "status":"FROZEN_PRE_SHADOW_MUTATION",
            "decision":"FREEZE_V10_PHASE2_ENGINEERING_AUDIT_CONTRACT",
            "input_candidate":"v10_phase1_frozen_production_candidate.json",
            "candidate_may_be_refit":False,
            "scientific_model_change_allowed":False,
            "production_mutation_allowed":False,
            "shadow_mutation_files":["index.html","free-agent-board.html"],
            "required_gates":[
              "exact Phase 1 candidate integrity",
              "exact current C0 production baseline before shadow mutation",
              "candidate positive and globally monotone across all 18 cells",
              "only PICK_BASE bytes differ on each shadow production surface",
              "YEAR_DISCOUNT and pickValue runtime logic unchanged",
              "index/free-agent-board shadow PICK_BASE parity",
              "all 72 runtime pick outputs for 2026-2029 deterministic and parity-matched",
              "Package Adjustment controlled-live regression passes under shadow pick curve",
              "free-agent valuation parity passes under shadow pick curve",
              "Team Utility projection/runtime regression passes under shadow pick curve",
              "full repository regression suite passes under shadow pick curve",
              "shadow production files restored byte-for-byte before research artifacts are committed"
            ],
            "deployment_scope_if_green":{
              "future_change":["PICK_BASE in index.html","PICK_BASE in free-agent-board.html","associated PICK_BASE provenance comment"],
              "must_remain_unchanged":[
                "YEAR_DISCOUNT",
                "pickValue rounding logic",
                "player valuation",
                "Package Adjustment",
                "Team Utility",
                "trade-desk-preview.html"
              ]
            },
            "next_stage_if_green":"Draft Pick FV V10 - Phase 3 Production Deployment",
          }
          (D/"v10_phase2_production_candidate_audit_contract.json").write_text(
              json.dumps(obj,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Phase 2 audit contract written before shadow mutation.")
          PY

      - name: Build exact shadow PICK_BASE and audit blueprint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          c=json.loads((D/"v10_phase1_frozen_production_candidate.json").read_text())
          v=c["values"]

          canonical=[
              "r1_early","r1_mid","r1_late",
              "r2_early","r2_mid","r2_late",
              "r3_early","r3_mid","r3_late",
              "r4_early","r4_mid","r4_late",
              "r5_early","r5_mid","r5_late",
              "r6_early","r6_mid","r6_late",
          ]
          old=dict(zip(canonical,[
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]))

          def fmt(x):
              s=f"{float(x):.10f}".rstrip("0").rstrip(".")
              return s if "." in s else s+".0"

          block="\n".join([
              "const PICK_BASE = {",
              f"  1: {{early:{fmt(v['r1_early'])}, mid:{fmt(v['r1_mid'])}, late:{fmt(v['r1_late'])}}},",
              f"  2: {{early:{fmt(v['r2_early'])}, mid:{fmt(v['r2_mid'])}, late:{fmt(v['r2_late'])}}},",
              f"  3: {{early:{fmt(v['r3_early'])}, mid:{fmt(v['r3_mid'])}, late:{fmt(v['r3_late'])}}},",
              f"  4: {{early:{fmt(v['r4_early'])}, mid:{fmt(v['r4_mid'])}, late:{fmt(v['r4_late'])}}},",
              f"  5: {{early:{fmt(v['r5_early'])}, mid:{fmt(v['r5_mid'])}, late:{fmt(v['r5_late'])}}},",
              f"  6: {{early:{fmt(v['r6_early'])}, mid:{fmt(v['r6_mid'])}, late:{fmt(v['r6_late'])}}},",
              "};",
          ])

          provenance=(
              "/* Draft Pick FV V10: R1-R4 preserve the frozen class-balanced ex-ante "
              "expected-value shape, translated to the 2027 KTC combined market scale "
              "with one global multiplier only. KTC Tradesourced/Crowdsourced remain "
              "external disagreement checks, not separate fit targets. R5-R6 are explicit "
              "tail extrapolations using the observed 2027 KTC combined R3→R4 decay; KTC "
              "does not publish R5-R6. YEAR_DISCOUNT is a separate frozen mechanism and "
              "is unchanged by V10. */"
          )

          years={"2026":0.6,"2027":1.0,"2028":0.85,"2029":0.72}
          def js_round(x): return math.floor(float(x)+0.5)
          runtime={}
          for year,disc in years.items():
              runtime[year]={}
              for rnd in range(1,7):
                  runtime[year][str(rnd)]={}
                  for tier in ("early","mid","late"):
                      runtime[year][str(rnd)][tier]=js_round(
                          float(v[f"r{rnd}_{tier}"])*disc
                      )

          deltas={
              k:{
                  "old":float(old[k]),
                  "candidate":float(v[k]),
                  "absolute":float(v[k])-float(old[k]),
                  "relative":float(v[k])/float(old[k])-1.0,
              }
              for k in canonical
          }

          blueprint={
              "schema_version":1,
              "candidate_id":c["candidate_id"],
              "exact_pick_base_block":block,
              "provenance_comment_for_future_deployment":provenance,
              "year_discount_unchanged":{"2027":1.0,"2028":0.85,"2029":0.72},
              "fallback_discount_unchanged":0.6,
              "runtime_pick_values_after_js_round":runtime,
              "cell_deltas_vs_current_production":deltas,
              "largest_absolute_relative_change_cell":max(
                  canonical,key=lambda k:abs(deltas[k]["relative"])
              ),
              "largest_absolute_relative_change":max(
                  abs(deltas[k]["relative"]) for k in canonical
              ),
              "production_change_authorized":False,
          }
          (D/"v10_phase2_deployment_blueprint.json").write_text(
              json.dumps(blueprint,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: exact shadow block and deployment blueprint frozen.")
          PY

      - name: Apply candidate to shadow production surfaces only
        shell: bash
        run: |
          set -euo pipefail
          cp index.html "${RUNNER_TEMP}/v10-index-before.html"
          cp free-agent-board.html "${RUNNER_TEMP}/v10-fab-before.html"
          cp trade-desk-preview.html "${RUNNER_TEMP}/v10-preview-before.html"

          python3 - <<'PY'
          import json,re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          b=json.loads((D/"v10_phase2_deployment_blueprint.json").read_text())
          new=b["exact_pick_base_block"]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)

          blocks=[]
          for name in ("index.html","free-agent-board.html"):
              p=Path(name)
              t=p.read_text(encoding="utf-8")
              ms=list(pat.finditer(t))
              assert len(ms)==1,(name,len(ms))
              p.write_text(t[:ms[0].start()]+new+t[ms[0].end():],encoding="utf-8")
              now=p.read_text(encoding="utf-8")
              mm=pat.search(now); assert mm
              blocks.append(mm.group(0))
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in now
              assert "return Math.round(base * disc);" in now
          assert blocks[0]==blocks[1]==new
          print("PASS: exact Phase 1 candidate applied to both shadow surfaces.")
          PY

      - name: Prove shadow diff is PICK_BASE only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path

          tmp=Path(os.environ["RUNNER_TEMP"])
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          pairs=[
              (tmp/"v10-index-before.html","index.html"),
              (tmp/"v10-fab-before.html","free-agent-board.html"),
          ]
          for before,current in pairs:
              b=before.read_text(encoding="utf-8")
              c=Path(current).read_text(encoding="utf-8")
              bm=pat.search(b); cm=pat.search(c)
              assert bm and cm
              reconstructed=c[:cm.start()]+bm.group(0)+c[cm.end():]
              assert reconstructed==b,f"non-PICK_BASE shadow drift: {current}"
          assert Path("trade-desk-preview.html").read_bytes()==(tmp/"v10-preview-before.html").read_bytes()
          print("PASS: shadow mutation is exactly PICK_BASE only.")
          PY

      - name: Validate all 72 shadow runtime pick outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          b=json.loads((D/"v10_phase2_deployment_blueprint.json").read_text())
          expected=b["runtime_pick_values_after_js_round"]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)

          def snapshot(name):
              t=Path(name).read_text(encoding="utf-8")
              m=pat.search(t); assert m
              nums=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",m.group(0))))
              assert len(nums)==18
              out={}
              for year,disc in {"2026":0.6,"2027":1.0,"2028":0.85,"2029":0.72}.items():
                  out[year]={}
                  for rnd in range(1,7):
                      i=(rnd-1)*3
                      out[year][str(rnd)]={
                          "early":math.floor(nums[i]*disc+0.5),
                          "mid":math.floor(nums[i+1]*disc+0.5),
                          "late":math.floor(nums[i+2]*disc+0.5),
                      }
              return out

          a=snapshot("index.html")
          f=snapshot("free-agent-board.html")
          assert a==f==expected
          assert sum(len(tiers) for rounds in a.values() for tiers in rounds.values())==72
          print("PASS: all 72 runtime pick outputs match exact blueprint on both shadow surfaces.")
          PY

      - name: Run controlled-live Package Adjustment regression under shadow curve
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: Package Adjustment regression green under V10 shadow PICK_BASE."

      - name: Run free-agent valuation parity under shadow curve
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          echo "PASS: free-agent valuation parity green under V10 shadow PICK_BASE."

      - name: Run full repository regression suite under shadow curve
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"
          echo "PASS: full repository regression suite green under V10 shadow PICK_BASE."

      - name: Restore production surfaces byte-for-byte
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/v10-index-before.html" index.html
          cp "${RUNNER_TEMP}/v10-fab-before.html" free-agent-board.html
          cmp -s "${RUNNER_TEMP}/v10-index-before.html" index.html
          cmp -s "${RUNNER_TEMP}/v10-fab-before.html" free-agent-board.html
          cmp -s "${RUNNER_TEMP}/v10-preview-before.html" trade-desk-preview.html
          echo "PASS: all production surfaces restored byte-for-byte."

      - name: Freeze Phase 2 PASS result and manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          blueprint=json.loads((D/"v10_phase2_deployment_blueprint.json").read_text())

          result={
              "schema_version":1,
              "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
              "stage":"phase2_production_candidate_engineering_audit",
              "decision":"PASS_V10_PHASE2_AUTHORIZE_PHASE3_PRODUCTION_DEPLOYMENT",
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "candidate_id":"V10_C1_PLUS_M1_PLUS_MT1",
              "candidate_refit_performed":False,
              "scientific_model_changed":False,
              "shadow_pick_base_only_diff_pass":True,
              "runtime_pick_outputs_checked":72,
              "runtime_pick_parity_pass":True,
              "package_adjustment_regression_pass":True,
              "free_agent_valuation_parity_pass":True,
              "team_utility_regression_pass":True,
              "full_repository_regression_pass":True,
              "shadow_production_restored_byte_for_byte":True,
              "year_discount_changed":False,
              "pick_value_runtime_logic_changed":False,
              "player_valuation_changed":False,
              "package_adjustment_changed":False,
              "team_utility_changed":False,
              "trade_desk_preview_changed":False,
              "largest_absolute_relative_pick_base_change":
                  blueprint["largest_absolute_relative_change"],
              "largest_absolute_relative_pick_base_change_cell":
                  blueprint["largest_absolute_relative_change_cell"],
              "production_change_authorized":False,
              "next_stage":"Draft Pick FV V10 - Phase 3 Production Deployment",
          }
          (D/"v10_phase2_production_candidate_audit.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          md=[
              "# Draft Pick FV V10 — Phase 2 Production Candidate Audit",
              "",
              f"**Decision:** `{result['decision']}`",
              "",
              "The frozen Phase-1 candidate was substituted into both production surfaces in the Actions worktree only, then fully restored before commit.",
              "",
              "- Candidate refit: **No**",
              "- Scientific model change: **No**",
              "- Shadow diff restricted to PICK_BASE: **PASS**",
              "- Runtime pick outputs checked: **72**",
              "- Index ↔ free-agent-board runtime parity: **PASS**",
              "- Package Adjustment regression: **PASS**",
              "- Free-agent valuation parity: **PASS**",
              "- Team Utility / full repository regression: **PASS**",
              "- YEAR_DISCOUNT changed: **No**",
              "- Production files committed by Phase 2: **No**",
              "",
              f"Largest absolute PICK_BASE percentage change versus current production: **{100*result['largest_absolute_relative_pick_base_change']:.1f}%** ({result['largest_absolute_relative_pick_base_change_cell']}).",
              "",
              "Phase 3 may deploy only the exact frozen PICK_BASE plus its provenance comment. YEAR_DISCOUNT, pickValue logic, player valuation, Package Adjustment, Team Utility, and trade-desk-preview remain out of scope.",
          ]
          (D/"v10_phase2_production_candidate_audit.md").write_text("\n".join(md)+"\n")

          files=[
              "v10_phase2_production_candidate_audit_contract.json",
              "v10_phase2_deployment_blueprint.json",
              "v10_phase2_production_candidate_audit.json",
              "v10_phase2_production_candidate_audit.md",
          ]
          manifest={
              "schema_version":1,
              "decision":"PASS_V10_PHASE2_AUTHORIZE_PHASE3_PRODUCTION_DEPLOYMENT",
              "files":{name:sha(D/name) for name in files},
              "production_change_authorized":False,
              "year_discount_changed":False,
              "full_repository_regression_pass":True,
          }
          (D/"v10_phase2_production_candidate_audit_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Phase 2 result and manifest frozen.")
          PY

      - name: Prove Phase 2 commit scope is research only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/draft-pick-fv-v10/v10_phase2_production_candidate_audit_contract.json",
              "research/draft-pick-fv-v10/v10_phase2_deployment_blueprint.json",
              "research/draft-pick-fv-v10/v10_phase2_production_candidate_audit.json",
              "research/draft-pick-fv-v10/v10_phase2_production_candidate_audit.md",
              "research/draft-pick-fv-v10/v10_phase2_production_candidate_audit_manifest.json",
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          assert "trade-desk-preview.html" not in touched
          print("PASS: Phase 2 commit scope is research-only; production is untouched.")
          PY

      - name: Commit frozen Phase 2 audit
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during Phase 2 audit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/draft-pick-fv-v10/v10_phase2_production_candidate_audit_contract.json \
            research/draft-pick-fv-v10/v10_phase2_deployment_blueprint.json \
            research/draft-pick-fv-v10/v10_phase2_production_candidate_audit.json \
            research/draft-pick-fv-v10/v10_phase2_production_candidate_audit.md \
            research/draft-pick-fv-v10/v10_phase2_production_candidate_audit_manifest.json

          git diff --cached --quiet && { echo "ERROR: no Phase 2 artifacts staged."; exit 1; }
          git commit -m "Complete Draft Pick FV V10 Phase 2 production candidate audit"
          git push origin HEAD:main
          test "$(git status --porcelain)" = ""
          echo "PASS: Phase 2 engineering audit committed; production remains unchanged."
