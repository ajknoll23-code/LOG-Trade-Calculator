      - name: Guard against raw historical data persistence and production mutation
        shell: bash
        run: |
          set -euo pipefail

          # Raw historical CSVs must remain under /tmp only.
          if find research/schedule-utility-v1 -maxdepth 1 -type f \
            \( -name '*.csv' -o -name '*.csv.gz' -o -name '*.parquet' \
               -o -name '*.rds' -o -name '*.qs' \) \
            -print -quit | grep -q .; then
            echo "Raw historical source leakage into repository detected."
            exit 1
          fi

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"

          git diff --check

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "PASS: raw sources stayed temporary and production is unchanged."

