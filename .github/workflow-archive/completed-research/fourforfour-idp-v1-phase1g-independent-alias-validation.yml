name: 4for4 IDP V1 - Phase 1G Independent Alias Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-alias-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Decode private 4for4 inputs outside repository
        shell: bash
        run: |
          set -euo pipefail

          for var in FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret ${var} is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-fourforfour-idp-v1/input
          install -d -m 700 /tmp/log-fourforfour-idp-v1/output

          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/db.csv

          chmod 600 /tmp/log-fourforfour-idp-v1/input/*.csv

      - name: Run current 4for4 pipeline on private real data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/fourforfour_projection_pipeline.py \
            --dl /tmp/log-fourforfour-idp-v1/input/dl.csv \
            --lb /tmp/log-fourforfour-idp-v1/input/lb.csv \
            --db /tmp/log-fourforfour-idp-v1/input/db.csv \
            --output-dir /tmp/log-fourforfour-idp-v1/output/private \
            --public-summary /tmp/log-fourforfour-idp-v1/output/aggregate-summary.json \
            > /tmp/log-fourforfour-idp-v1/output/pipeline.stdout.txt

      - name: Independently validate Phase 1F alias candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import math
          import re
          from collections import Counter, defaultdict
          from difflib import SequenceMatcher
          from pathlib import Path

          import requests

          EXPECTED_PHASE1E_FINGERPRINT = (
              'a3ed571084339bb938c5288a8a959145702a13d7c876f957ea2541197f0cbc6a'
          )
          EXPECTED_PHASE1F_CANDIDATE_FINGERPRINT = (
              '860f93be86c9a1b5c5a8bfe8ed4af6a01b49187e04a5e0a0769ce95a0d3458ee'
          )

          root = Path('/tmp/log-fourforfour-idp-v1/output')
          private = root / 'private'

          normalized = json.loads(
              (private / 'fourforfour_2026_idp_normalized_private.json')
              .read_text(encoding='utf-8')
          )
          rows = (
              normalized.get('rows')
              or normalized.get('players')
              or normalized.get('data')
              if isinstance(normalized, dict)
              else normalized
          )
          if not isinstance(rows, list) or len(rows) != 648:
              raise RuntimeError('unexpected normalized-private JSON shape/count')

          summary = json.loads(
              (root / 'aggregate-summary.json').read_text(encoding='utf-8')
          )
          identity = summary.get('identity') or {}
          if identity.get('resolved_rows') != 595 or identity.get('unresolved_rows') != 53:
              raise RuntimeError('Phase 1B baseline changed')

          def norm_team(value):
              if value in (None, '', 'FA'):
                  return None
              t = str(value).strip().upper()
              return {
                  'JAC': 'JAX',
                  'WSH': 'WAS',
                  'OAK': 'LV',
                  'SD': 'LAC',
                  'STL': 'LAR',
                  'LA': 'LAR',
              }.get(t, t)

          def norm_name(value):
              s = str(value or '').strip().lower()
              s = re.sub(r"[.'’\-]", '', s)
              return re.sub(r'\s+', ' ', s).strip()

          suffixes = {'jr', 'sr', 'ii', 'iii', 'iv', 'v'}

          def tokens_without_suffix(value):
              parts = norm_name(value).split()
              if parts and parts[-1] in suffixes:
                  parts = parts[:-1]
              return parts

          def norm_name_no_suffix(value):
              return ' '.join(tokens_without_suffix(value))

          def first_token(value):
              parts = tokens_without_suffix(value)
              return parts[0] if parts else ''

          def surname(value):
              parts = tokens_without_suffix(value)
              return parts[-1] if parts else ''

          def sleeper_buckets(player):
              labels = set()
              raw = list(player.get('fantasy_positions') or [])
              if player.get('position'):
                  raw.append(player.get('position'))

              for x in raw:
                  p = str(x or '').strip().upper()
                  if p in {'DL', 'DE', 'DT', 'NT'}:
                      labels.add('DL')
                  elif p in {'LB', 'ILB', 'MLB', 'OLB'}:
                      labels.add('LB')
                  elif p in {'DB', 'CB', 'S', 'SS', 'FS', 'SAF'}:
                      labels.add('DB')
                  elif p == 'EDGE':
                      labels.update({'DL', 'LB'})
              return labels

          def nflverse_bucket(position):
              p = str(position or '').strip().upper()
              if p in {'DL', 'DE', 'DT', 'NT'}:
                  return {'DL'}
              if p in {'LB', 'ILB', 'MLB', 'OLB'}:
                  return {'LB'}
              if p in {'DB', 'CB', 'S', 'SS', 'FS', 'SAF'}:
                  return {'DB'}
              if p == 'EDGE':
                  return {'DL', 'LB'}
              return set()

          # Fetch full Sleeper universe.
          sleeper_response = requests.get(
              'https://api.sleeper.app/v1/players/nfl',
              timeout=60,
          )
          sleeper_response.raise_for_status()
          universe = sleeper_response.json()
          if not isinstance(universe, dict) or len(universe) < 1000:
              raise RuntimeError('Sleeper full-player response unexpectedly small')

          full_index = defaultdict(list)
          suffixless_index = defaultdict(list)
          team_bucket_candidates = defaultdict(list)
          sleeper_by_sid = {}

          for sid, player in universe.items():
              if not isinstance(player, dict):
                  continue

              full_name = (
                  player.get('full_name')
                  or ' '.join(
                      x for x in [player.get('first_name'), player.get('last_name')] if x
                  ).strip()
              )
              if not full_name:
                  continue

              team = norm_team(player.get('team'))
              buckets = sleeper_buckets(player)

              candidate = {
                  'sid': str(sid),
                  'name': full_name,
                  'team': team,
                  'buckets': buckets,
                  'gsis_id': str(player.get('gsis_id') or '').strip() or None,
              }
              sleeper_by_sid[str(sid)] = candidate

              if not buckets:
                  continue

              full_index[norm_name(full_name)].append(candidate)
              suffixless_index[norm_name_no_suffix(full_name)].append(candidate)
              for bucket in buckets:
                  if team:
                      team_bucket_candidates[(team, bucket)].append(candidate)

          unresolved = [r for r in rows if not (r.get('identity') or {}).get('resolved')]
          resolved = [r for r in rows if (r.get('identity') or {}).get('resolved')]
          if len(unresolved) != 53 or len(resolved) != 595:
              raise RuntimeError('baseline row partition changed')

          baseline_sids = {
              str((r.get('identity') or {}).get('sleeper_id'))
              for r in resolved
              if (r.get('identity') or {}).get('sleeper_id') not in (None, '')
          }
          if len(baseline_sids) != 595:
              raise RuntimeError('baseline Sleeper IDs not one-to-one')

          # Reconstruct Phase 1E recoveries exactly.
          phase1e = []
          for row in unresolved:
              name = row.get('source_player_name')
              team = norm_team(row.get('source_team'))
              bucket = row.get('source_bucket')

              def eligible(cands):
                  matched = {}
                  for c in cands:
                      if bucket not in c['buckets']:
                          continue
                      if not team or not c['team'] or c['team'] != team:
                          continue
                      matched[c['sid']] = c
                  return matched

              exact = eligible(full_index.get(norm_name(name), []))
              suffixless = eligible(
                  suffixless_index.get(norm_name_no_suffix(name), [])
              )

              sid = None
              if len(exact) == 1:
                  sid = next(iter(exact))
              elif len(exact) == 0 and len(suffixless) == 1:
                  sid = next(iter(suffixless))

              if sid is not None:
                  phase1e.append({
                      'source_row_sha256': row['source_row_sha256'],
                      'sleeper_id': str(sid),
                  })

          if len(phase1e) != 27:
              raise RuntimeError(f'expected 27 Phase 1E recoveries, got {len(phase1e)}')

          phase1e_payload = [
              [r['source_row_sha256'], r['sleeper_id']]
              for r in sorted(phase1e, key=lambda x: x['source_row_sha256'])
          ]
          phase1e_fingerprint = hashlib.sha256(
              json.dumps(
                  phase1e_payload,
                  separators=(',', ':'),
                  ensure_ascii=False,
              ).encode('utf-8')
          ).hexdigest()

          if phase1e_fingerprint != EXPECTED_PHASE1E_FINGERPRINT:
              raise RuntimeError('Phase 1E recovery fingerprint drifted')

          phase1e_hashes = {r['source_row_sha256'] for r in phase1e}
          phase1e_sids = {r['sleeper_id'] for r in phase1e}
          remaining = [
              r for r in unresolved
              if r['source_row_sha256'] not in phase1e_hashes
          ]
          if len(remaining) != 26:
              raise RuntimeError(f'expected 26 remaining rows, got {len(remaining)}')

          # Reconstruct the exact Phase 1F 14-candidate cohort.
          phase1f_candidates = []
          for row in remaining:
              name = row.get('source_player_name')
              team = norm_team(row.get('source_team'))
              bucket = row.get('source_bucket')

              src_first = first_token(name)
              src_surname = surname(name)

              candidates = []
              for c in team_bucket_candidates.get((team, bucket), []):
                  if surname(c['name']) != src_surname:
                      continue

                  cand_first = first_token(c['name'])
                  full_similarity = SequenceMatcher(
                      None,
                      norm_name_no_suffix(name),
                      norm_name_no_suffix(c['name']),
                  ).ratio()
                  first_similarity = SequenceMatcher(
                      None,
                      src_first,
                      cand_first,
                  ).ratio() if src_first and cand_first else 0.0
                  same_initial = bool(
                      src_first and cand_first and src_first[0] == cand_first[0]
                  )

                  candidates.append({
                      'sid': c['sid'],
                      'full_similarity': full_similarity,
                      'first_similarity': first_similarity,
                      'same_initial': same_initial,
                  })

              unique_by_sid = {c['sid']: c for c in candidates}
              candidates = list(unique_by_sid.values())

              chosen_sid = None
              if len(candidates) > 1:
                  strong = [
                      c for c in candidates
                      if c['same_initial'] and c['full_similarity'] >= 0.72
                  ]
                  if len(strong) == 1:
                      chosen_sid = strong[0]['sid']
              elif len(candidates) == 1:
                  c = candidates[0]
                  if c['same_initial'] and (
                      c['full_similarity'] >= 0.72
                      or c['first_similarity'] >= 0.60
                  ):
                      chosen_sid = c['sid']
                  elif c['full_similarity'] >= 0.84:
                      chosen_sid = c['sid']

              if chosen_sid is not None:
                  phase1f_candidates.append({
                      'source_row_sha256': row['source_row_sha256'],
                      'sleeper_id': str(chosen_sid),
                      '_private_source_name': name,
                      '_private_source_team': team,
                      '_private_source_bucket': bucket,
                  })

          if len(phase1f_candidates) != 14:
              raise RuntimeError(
                  f'expected 14 Phase 1F candidates, got {len(phase1f_candidates)}'
              )

          phase1f_payload = sorted(
              [
                  [r['source_row_sha256'], r['sleeper_id']]
                  for r in phase1f_candidates
              ]
          )
          phase1f_fingerprint = hashlib.sha256(
              json.dumps(
                  phase1f_payload,
                  separators=(',', ':'),
              ).encode('utf-8')
          ).hexdigest()

          if phase1f_fingerprint != EXPECTED_PHASE1F_CANDIDATE_FINGERPRINT:
              raise RuntimeError(
                  'Phase 1F candidate fingerprint drifted: '
                  f'{phase1f_fingerprint}'
              )

          candidate_sids = {r['sleeper_id'] for r in phase1f_candidates}
          if candidate_sids & baseline_sids:
              raise RuntimeError('Phase 1F candidates overlap baseline identities')
          if candidate_sids & phase1e_sids:
              raise RuntimeError('Phase 1F candidates overlap Phase 1E identities')
          if len(candidate_sids) != 14:
              raise RuntimeError('Phase 1F candidate Sleeper IDs are not one-to-one')

          # Fetch independent nflverse player registry.
          nflverse_url = (
              'https://github.com/nflverse/nflverse-data/'
              'releases/download/players/players.csv'
          )
          nflverse_response = requests.get(nflverse_url, timeout=60)
          nflverse_response.raise_for_status()

          nflverse_sha256 = hashlib.sha256(nflverse_response.content).hexdigest()
          reader = csv.DictReader(io.StringIO(nflverse_response.text))
          nflverse_rows = list(reader)

          required_columns = {
              'gsis_id',
              'display_name',
              'position',
              'latest_team',
          }
          missing_columns = required_columns - set(reader.fieldnames or [])
          if missing_columns:
              raise RuntimeError(
                  f'nflverse players.csv missing columns: {sorted(missing_columns)}'
              )

          nflverse_by_gsis = defaultdict(list)
          for row in nflverse_rows:
              gsis = str(row.get('gsis_id') or '').strip()
              if gsis:
                  nflverse_by_gsis[gsis].append(row)

          outcomes = Counter()
          outcomes_by_bucket = defaultdict(Counter)
          confirmed_pairs = []

          for rec in phase1f_candidates:
              sid = rec['sleeper_id']
              sleeper = sleeper_by_sid.get(sid)
              source_name = rec['_private_source_name']
              source_team = rec['_private_source_team']
              source_bucket = rec['_private_source_bucket']

              if not sleeper:
                  outcome = 'fail_missing_sleeper_candidate'
              elif not sleeper.get('gsis_id'):
                  outcome = 'fail_missing_sleeper_gsis_id'
              else:
                  gsis_rows = nflverse_by_gsis.get(sleeper['gsis_id'], [])
                  if len(gsis_rows) != 1:
                      outcome = (
                          'fail_nflverse_gsis_missing'
                          if len(gsis_rows) == 0
                          else 'fail_nflverse_gsis_not_unique'
                      )
                  else:
                      nv = gsis_rows[0]
                      nv_name = nv.get('display_name')
                      nv_team = norm_team(nv.get('latest_team'))
                      nv_buckets = nflverse_bucket(nv.get('position'))

                      sleeper_name = sleeper.get('name')
                      sleeper_nv_name_similarity = SequenceMatcher(
                          None,
                          norm_name_no_suffix(sleeper_name),
                          norm_name_no_suffix(nv_name),
                      ).ratio()

                      source_nv_name_similarity = SequenceMatcher(
                          None,
                          norm_name_no_suffix(source_name),
                          norm_name_no_suffix(nv_name),
                      ).ratio()

                      src_first = first_token(source_name)
                      nv_first = first_token(nv_name)
                      same_first_initial = bool(
                          src_first and nv_first and src_first[0] == nv_first[0]
                      )

                      name_ok = (
                          surname(source_name) == surname(nv_name)
                          and (
                              (
                                  same_first_initial
                                  and source_nv_name_similarity >= 0.72
                              )
                              or source_nv_name_similarity >= 0.84
                          )
                      )
                      sleeper_nv_name_ok = sleeper_nv_name_similarity >= 0.90
                      team_ok = (
                          source_team is not None
                          and nv_team is not None
                          and source_team == nv_team
                      )
                      position_ok = source_bucket in nv_buckets

                      if not sleeper_nv_name_ok:
                          outcome = 'fail_sleeper_nflverse_name_disagreement'
                      elif not name_ok:
                          outcome = 'fail_source_nflverse_name_corroboration'
                      elif not team_ok:
                          outcome = 'fail_nflverse_team_corroboration'
                      elif not position_ok:
                          outcome = 'fail_nflverse_position_corroboration'
                      else:
                          outcome = 'independently_confirmed'
                          confirmed_pairs.append(
                              [rec['source_row_sha256'], sid]
                          )

              outcomes[outcome] += 1
              outcomes_by_bucket[source_bucket][outcome] += 1

          confirmed_pairs = sorted(confirmed_pairs)
          confirmed_fingerprint = hashlib.sha256(
              json.dumps(
                  confirmed_pairs,
                  separators=(',', ':'),
              ).encode('utf-8')
          ).hexdigest()

          confirmed_rows = outcomes['independently_confirmed']
          projected_resolved_rows = 622 + confirmed_rows

          result = {
              'schema_version': 1,
              'study': 'fourforfour-idp-v1-phase1g-independent-alias-validation',
              'research_only': True,
              'production_changes': False,
              'phase1e_recovery_fingerprint_verified': True,
              'phase1f_candidate_fingerprint_verified': True,
              'phase1f_candidate_rows': 14,
              'independent_registry': {
                  'source': 'nflverse players.csv',
                  'primary_key': 'gsis_id',
                  'registry_row_count': len(nflverse_rows),
                  'registry_sha256': nflverse_sha256,
              },
              'validation_requirements': {
                  'sleeper_gsis_id_required': True,
                  'unique_nflverse_gsis_match_required': True,
                  'nflverse_current_team_match_required': True,
                  'nflverse_position_compatibility_required': True,
                  'source_to_nflverse_name_corroboration_required': True,
                  'sleeper_to_nflverse_name_agreement_required': True,
                  'automatic_adoption_authorized': False,
              },
              'outcomes': dict(sorted(outcomes.items())),
              'outcomes_by_bucket': {
                  k: dict(sorted(v.items()))
                  for k, v in sorted(outcomes_by_bucket.items())
              },
              'independently_confirmed_rows': confirmed_rows,
              'independently_confirmed_fingerprint_sha256':
                  confirmed_fingerprint,
              'projected_resolved_rows_if_confirmed_rows_adopted':
                  projected_resolved_rows,
              'projected_resolved_rate_if_confirmed_rows_adopted':
                  round(projected_resolved_rows / 648, 6),
              'projected_remaining_unresolved_rows':
                  648 - projected_resolved_rows,
              'private_mapping_persisted': False,
          }

          forbidden_keys = {
              'source_player_name',
              'source_team',
              'sleeper_id',
              'gsis_id',
              'source_row_number',
              'raw_category_season_totals',
              'provider_ff_pts_reference_only',
          }

          def assert_no_forbidden_keys(value, path='$'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden_keys:
                          raise RuntimeError(
                              f'aggregate Phase 1G output leaked forbidden key: {path}.{key}'
                          )
                      assert_no_forbidden_keys(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for i, child in enumerate(value):
                      assert_no_forbidden_keys(child, f'{path}[{i}]')

          assert_no_forbidden_keys(result)

          print('PASS: Phase 1G independent alias validation complete.')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove validation made no repository changes
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .; then
            echo 'ERROR: Phase 1G modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi

          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: Phase 1G staged repository changes.' >&2
            git diff --cached -- .
            exit 1
          fi

          echo 'PASS: Phase 1G and regressions left the repository unchanged.'

      - name: Destroy private 4for4 inputs and row-level outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-idp-v1
          echo 'PASS: private provider inputs and row-level outputs removed from runner.'
