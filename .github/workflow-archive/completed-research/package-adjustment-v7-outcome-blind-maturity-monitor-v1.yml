        \ row in enumerate(eligible):\n    voters_running.add(row[\"voter\"])\n    per_running[row[\"challenge_id\"]].add(row[\"\
        voter\"])\n    if len(voters_running) >= FIRST and all(len(per_running[cid]) >= MIN_PER for cid in challenges):\n\
        \        qualification = {\n            \"eligible_ballot_prefix_length\": idx + 1,\n            \"qualified_at_utc\"\
