        ] == topo)\n        counts = [len(per[cid]) for cid in ids]\n        topology_rows[topo] = {\n            \"challenge_count\"\
        : len(ids),\n            \"minimum_distinct_voters\": min(counts),\n            \"maximum_distinct_voters\": max(counts),\n\
        \            \"challenges_passing_coverage\": sum(n >= MIN_PER for n in counts),\n        }\n\n    return {\n    \
        \    \"accepted_ballots\": len(rows),\n        \"distinct_voters\": len(voter_set),\n        \"distinct_challenges_observed\"\
        : sum(bool(per[cid]) for cid in challenges),\n        \"minimum_challenge_distinct_voters\": min(len(per[cid]) for\
        \ cid in challenges),\n        \"maximum_challenge_distinct_voters\": max(len(per[cid]) for cid in challenges),\n\
        \        \"challenges_passing_coverage\": sum(len(per[cid]) >= MIN_PER for cid in challenges),\n        \"all_challenges_pass_coverage\"\
        : all(len(per[cid]) >= MIN_PER for cid in challenges),\n        \"challenges\": challenge_rows,\n        \"topologies\"\
        : topology_rows,\n    }\n\ncurrent = snapshot(eligible)\n\n# Reconstruct the earliest exact outcome-blind maturity\
