        \ == \"__pkgv7dev__|\"\nassert META_PREFIX == \"__pkgv7dev_meta__|\"\nassert SCHEMA_MARKER == \"__pkgv7dev_schema__|1\"\
        \n\nFIRST = int(act[\"maturity_contract\"][\"first_checkpoint_distinct_voters\"])\nMIN_PER = int(act[\"maturity_contract\"\
        ][\"minimum_distinct_voters_per_challenge\"])\nHARD = int(act[\"maturity_contract\"][\"hard_cap_distinct_voters\"\
