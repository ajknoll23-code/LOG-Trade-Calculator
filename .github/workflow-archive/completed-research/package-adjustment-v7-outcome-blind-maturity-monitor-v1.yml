# PREFLIGHTED: PACKAGE_ADJUSTMENT_V7_OUTCOME_BLIND_MATURITY_MONITOR_V1
name: Package Adjustment V7 - Outcome-Blind Maturity Monitor
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: package-adjustment-v7-development-maturity-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install monitor dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen V7 activation contract
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"

        declare -A EXPECTED=(
          ["research/package-adjustment-v7/development_voting_activation_manifest_v1.json"]="90f78e63f8a019ac47d78cee9151548a1afd6b89"
          ["research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json"]="01823ce0f146fd09693b4585bf4948c3076bd9d3"
          ["research/package-adjustment-v7/phase1a_power_analysis_v1.json"]="7f908d437d8cea1b0c4561d114118b8fe94d8fa7"
        )

        for p in "${!EXPECTED[@]}"; do
          a="$(git hash-object "$p")"
          test "$a" = "${EXPECTED[$p]}" || {
            echo "ERROR: frozen V7 maturity predecessor drift: $p expected=${EXPECTED[$p]} actual=$a"
            exit 1
          }
        done

        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path

        d=Path("research/package-adjustment-v7")
        act=json.loads((d/"development_voting_activation_manifest_v1.json").read_text())
        cat=d/"package_vote_challenges_v7_development_v1.json"
        power=json.loads((d/"phase1a_power_analysis_v1.json").read_text())

        assert act["status"]=="V7_DEVELOPMENT_VOTING_ACTIVATED"
        assert act["catalog"]["sha256"]==hashlib.sha256(cat.read_bytes()).hexdigest()
        assert act["catalog"]["challenge_count"]==40
        assert act["maturity_contract"]["first_checkpoint_distinct_voters"]==40
        assert act["maturity_contract"]["minimum_distinct_voters_per_challenge"]==32
        assert act["maturity_contract"]["hard_cap_distinct_voters"]==50
        assert act["maturity_contract"]["stopping_may_use_vote_direction"] is False
        assert act["maturity_contract"]["stopping_may_use_candidate_performance"] is False
        assert power["selected_first_checkpoint_distinct_voters"]==40
        assert power["hard_cap_distinct_voters"]==50

        html=Path("index.html").read_text(encoding="utf-8")
        assert "Package Adjustment V7 Development Voting." in html
        assert "__pkgv7dev__|" in html
        assert "const PACKAGE_VOTE_TOTAL_CHALLENGES = 40;" in html

        ktc=Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
        assert '"__pkgv7dev__|"' in ktc

        reg=Path("scripts/validation/repo_regression_checks.py").read_text(encoding="utf-8")
        assert '"__pkgv7dev__|"' in reg
        assert "PASS V7 frozen 40-challenge sampling contract:" in reg
        assert 'assert "const byCell = new Map();" in block' not in reg[
            reg.index("def check_package_sampling_contract():"):
            reg.index("\ndef check_index_js_syntax():")
        ]
        print("PASS: frozen V7 activation and permanent sampling contract verified.")
        PY

        python3 scripts/validation/check_package_adjustment_live.py
    - name: Self-test outcome-blind maturity arithmetic
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from collections import defaultdict

        FIRST=40
        MIN_PER=32
        HARD=50
        CHALLENGES=[f"c{i:02d}" for i in range(40)]

        def decision(rows):
            seen=set()
            dedup=[]
            for voter,cid in rows:
                key=(voter,cid)
                if key in seen:
                    continue
                seen.add(key)
                dedup.append((voter,cid))
            first=[]
            firstset=set()
            for voter,_ in dedup:
                if voter not in firstset:
                    firstset.add(voter)
                    first.append(voter)
            accepted=set(first[:HARD])
            rows=[r for r in dedup if r[0] in accepted]

            voters=set()
            per={cid:set() for cid in CHALLENGES}
            qualified=None
            for i,(voter,cid) in enumerate(rows):
                voters.add(voter)
                per[cid].add(voter)
                if len(voters)>=FIRST and all(len(per[c])>=MIN_PER for c in CHALLENGES):
                    qualified=(i+1,len(voters),min(len(per[c]) for c in CHALLENGES))
                    break
            if qualified:
                return "STOP", qualified, len(accepted), min(len(per[c]) for c in CHALLENGES)
            current_voters=len({v for v,_ in rows})
            current_per={cid:set() for cid in CHALLENGES}
            for v,c in rows:
                current_per[c].add(v)
            minimum=min(len(current_per[c]) for c in CHALLENGES)
            if current_voters<FIRST:
                return "LT40",None,current_voters,minimum
            if current_voters<HARD:
                return "CONTINUE",None,current_voters,minimum
            return "HARD",None,current_voters,minimum

        rows=[]
        for v in range(39):
            for c in CHALLENGES:
                rows.append((f"v{v}",c))
        assert decision(rows)[0]=="LT40"

        rows2=list(rows)
        rows2.append(("v39","c00"))
        assert decision(rows2)[0]=="STOP"
        assert decision(rows2)[1][1]==40
        assert decision(rows2)[1][2]>=32

        rows3=[]
        for v in range(40):
            for c in CHALLENGES[:-1]:
                rows3.append((f"v{v}",c))
        for v in range(20):
            rows3.append((f"v{v}",CHALLENGES[-1]))
        assert decision(rows3)[0]=="CONTINUE"

        rows4=list(rows3)
        for v in range(40,50):
            for c in CHALLENGES[:-1]:
                rows4.append((f"v{v}",c))
        assert decision(rows4)[0]=="HARD"

        # Voter 51+ must not expand accepted cohort.
        rows5=list(rows4)+[("v50",c) for c in CHALLENGES]
        assert decision(rows5)[2]==50

        # Duplicate voter/challenge rows cannot inflate coverage.
        dup=[("v0","c00"),("v0","c00")]
        d=decision(dup)
        assert d[2]==1 and d[3]==0

        print("PASS: V7 outcome-blind 40/32/50 maturity arithmetic.")
        PY
    - name: Build outcome-blind maturity report
      shell: bash
      run: "set -euo pipefail\nrm -rf /tmp/package-adjustment-v7-development-maturity\nmkdir -p /tmp/package-adjustment-v7-development-maturity\n\
        python3 - <<'PY'\nfrom __future__ import annotations\n\nimport csv\nimport hashlib\nimport io\nimport json\nfrom collections\
