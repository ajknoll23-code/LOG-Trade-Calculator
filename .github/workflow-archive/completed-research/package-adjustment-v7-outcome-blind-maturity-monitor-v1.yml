        timestamp\"], r[\"source_index\"]))\n\n# Exact analysis rule: first valid post-activation vote per voter/challenge.\n\
        seen_voter_challenge = set()\ndeduped = []\nfor row in structural:\n    key = (row[\"voter\"], row[\"challenge_id\"\
        ])\n    if key in seen_voter_challenge:\n        excluded[\"duplicate_voter_challenge_after_first\"] += 1\n      \
