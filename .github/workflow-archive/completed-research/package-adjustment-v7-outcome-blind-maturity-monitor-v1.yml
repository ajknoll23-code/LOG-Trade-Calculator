    - name: Prove report contains no outcome fields
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path

        p=Path("/tmp/package-adjustment-v7-development-maturity/maturity.json")
        d=json.loads(p.read_text())

        assert d["outcome_blind"] is True
        assert d["vote_direction_read"] is False
        assert d["display_side_payload_read"] is False
        assert d["candidate_scores_read"] is False
        assert d["candidate_fit_performed"] is False
        assert d["production_change_authorized"] is False

        serialized=json.dumps(d,sort_keys=True).lower()
        for forbidden in (
            "choice_pct","side_a_votes","side_b_votes","candidate_log_loss",
            "candidate_minus","winner_model","selected_candidate","fit_parameter",
        ):
            assert forbidden not in serialized, forbidden

        assert d["contract"]=={
            "first_checkpoint_distinct_voters":40,
            "minimum_distinct_voters_per_challenge":32,
            "hard_cap_distinct_voters":50,
            "one_vote_per_voter_per_challenge":"first valid post-activation row only",
        }
        print("PASS: output artifact is coverage-only and outcome-blind.")
        PY
    - name: Upload maturity report
      uses: actions/upload-artifact@v4
      with:
        name: package-adjustment-v7-development-maturity
        path: /tmp/package-adjustment-v7-development-maturity
        if-no-files-found: error
        retention-days: 30
