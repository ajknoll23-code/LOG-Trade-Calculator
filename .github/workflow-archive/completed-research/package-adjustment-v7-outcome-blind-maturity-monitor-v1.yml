        act = load(ACT)\ncat = load(CAT)\npower = load(POWER)\n\nassert act[\"status\"] == \"V7_DEVELOPMENT_VOTING_ACTIVATED\"\
        \nassert act[\"research_only\"] is True\nassert act[\"candidate_fit_performed\"] is False\nassert act[\"candidate_scores_read\"\
        ] is False\nassert act[\"v7_vote_outcomes_read_at_activation\"] is False\nassert act[\"production_change_authorized\"\
        ] is False\nassert act[\"maturity_contract\"][\"first_checkpoint_distinct_voters\"] == 40\nassert act[\"maturity_contract\"\
