        eligible = [r for r in deduped if r[\"voter\"] in accepted_voters]\n\ndef snapshot(rows):\n    voter_set = {r[\"voter\"\
        ] for r in rows}\n    per = {cid: set() for cid in challenges}\n    per_topology = defaultdict(lambda: {\"challenge_ids\"\
