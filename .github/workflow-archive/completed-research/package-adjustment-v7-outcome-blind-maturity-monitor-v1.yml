        \ = KTC.read_text(encoding=\"utf-8\")\nassert f'SHEET_CSV_URL = \"{SHEET_URL}\"' in ktc_text\nassert '\"__pkgv7dev__|\"\
        ' in ktc_text\n\ngenerated_at = datetime.now(timezone.utc)\nresp = requests.get(SHEET_URL, timeout=30)\nresp.raise_for_status()\n\
        sheet_sha256 = hashlib.sha256(resp.content).hexdigest()\nsource_rows = list(csv.DictReader(io.StringIO(resp.text)))\n\
        \nexcluded = Counter()\nraw_namespace_rows = 0\nstructural = []\n\nfor source_index, row in enumerate(source_rows):\n\
        \    keep = str(row.get(\"keep\") or \"\")\n    if not keep.startswith(VOTE_PREFIX):\n        continue\n    raw_namespace_rows\
        \ += 1\n\n    ts = parse_utc(row.get(\"timestamp\"))\n    if ts is None:\n        excluded[\"invalid_timestamp\"]\
        \ += 1\n        continue\n    if ts <= cutoff:\n        excluded[\"pre_activation_or_at_cutoff\"] += 1\n        continue\n\
        \    if ts > generated_at:\n        excluded[\"future_timestamp\"] += 1\n        continue\n\n    voter = str(row.get(\"\
        voter_roster_id\") or \"\").strip()\n    if not voter:\n        excluded[\"missing_voter_id\"] += 1\n        continue\n\
        \n    # OUTCOME-BLIND BY CONSTRUCTION:\n    # Read only the challenge id before the first post-prefix delimiter.\n\
        \    # The response token after that delimiter is never parsed or stored.\n    payload = keep[len(VOTE_PREFIX):]\n\
        \    if \"|\" not in payload:\n        excluded[\"malformed_vote_transport\"] += 1\n        continue\n    challenge_id\
        \ = payload.split(\"|\", 1)[0].strip()\n    if challenge_id not in challenges:\n        excluded[\"unknown_challenge_id\"\
        ] += 1\n        continue\n\n    # Namespace check only; never inspect the A/B randomized-left payload.\n    meta =\
        \ str(row.get(\"trade\") or \"\")\n    if not meta.startswith(META_PREFIX):\n        excluded[\"invalid_meta_namespace\"\
        ] += 1\n        continue\n\n    if str(row.get(\"cut\") or \"\") != SCHEMA_MARKER:\n        excluded[\"invalid_schema_marker\"\
        ] += 1\n        continue\n\n    structural.append({\n        \"timestamp\": ts,\n        \"source_index\": source_index,\n\
