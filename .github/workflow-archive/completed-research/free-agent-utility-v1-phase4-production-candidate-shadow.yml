name: Free Agent Utility V1 - Phase 4 Production Candidate Shadow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  exact-production-candidate-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Pin exact Phase 4 lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = "1bb87f685c00e51a488a0c21510ccdca452e6b72"
          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase3.py)" = "31ce597539037fcbc4eba1dccd7eaca95d00487a"
          test "$(git hash-object research/free-agent-utility-v1/phase3_preregistration.json)" = "fc1308576ba7287a446a2c471eeeadf7c253e06f"
          test "$(git hash-object research/free-agent-utility-v1/phase3_bounded_candidate_summary.json)" = "31aade287a777608226fc6e03bdb33ae8e823c58"
          test "$(git hash-object free-agent-board.html)" = "a442ee5dfab51b0214977a7b64e91203bdce3a36"
          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase4.py)" = "a78ecc377e1e3c933325d286a5cce768089c48c4"
          test "$(git hash-object research/free-agent-utility-v1/phase4_preregistration.json)" = "5a33099335c8b9524ed4b83d44f6043aeed9f39b"
          test ! -e research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.json
          test ! -e research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.md
          test ! -e data/free_agent_utility_v1.json

      - name: Self-test Phase 4
        shell: bash
        run: |
          set -euo pipefail
          python3 research/free-agent-utility-v1/free_agent_utility_v1_phase4.py --selftest

      - name: Decode private 4for4 sources outside repository
        shell: bash
        run: |
          set -euo pipefail
          for var in \
            FOURFORFOUR_OFFENSE_GZ_B64_PART1 \
            FOURFORFOUR_OFFENSE_GZ_B64_PART2 \
            FOURFORFOUR_OFFENSE_GZ_B64_PART3 \
            FOURFORFOUR_DL_GZ_B64 \
            FOURFORFOUR_LB_GZ_B64 \
            FOURFORFOUR_DB_GZ_B64
          do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret $var is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-free-agent-utility-v1-phase4/input
          install -d -m 700 /tmp/log-free-agent-utility-v1-phase4/output

          printf '%s%s%s' \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1-phase4/input/offense.csv

          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1-phase4/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1-phase4/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1-phase4/input/db.csv

          chmod 600 /tmp/log-free-agent-utility-v1-phase4/input/*.csv

      - name: Build exact temporary production artifact and shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 research/free-agent-utility-v1/free_agent_utility_v1_phase4.py \
            --offense /tmp/log-free-agent-utility-v1-phase4/input/offense.csv \
            --dl /tmp/log-free-agent-utility-v1-phase4/input/dl.csv \
            --lb /tmp/log-free-agent-utility-v1-phase4/input/lb.csv \
            --db /tmp/log-free-agent-utility-v1-phase4/input/db.csv \
            --artifact-out /tmp/log-free-agent-utility-v1-phase4/output/free_agent_utility_v1.json \
            --write

      - name: Validate temporary production artifact schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/log-free-agent-utility-v1-phase4/output/free_agent_utility_v1.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema_version"] == 1
          assert d["policy_id"] == "phase3-selected-15pct-cap040"
          assert d["all_section_policy"] == "existing_log_value_order_unchanged"
          assert d["position_section_policy"] == "priority_rank_ascending"
          assert len(d["players"]) == 408

          forbidden = (
              "fourforfour", "projection", "points", "percentile",
              "delta", "score", "matched", "provider",
          )
          for row in d["players"]:
              assert set(row) == {"player_id", "pos", "priority_rank"}
              assert not any(
                  frag in key.lower()
                  for key in row
                  for frag in forbidden
              )
          print("PASS: temporary candidate artifact is minimal and provider-blind.")
          PY

      - name: Validate aggregate Phase 4 output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.json")
              .read_text(encoding="utf-8")
          )
          assert d["status"] == "PASS_PHASE4_EXACT_PRODUCTION_CANDIDATE_SHADOW"
          assert d["research_only"] is True
          assert d["production_changes"] is False
          assert d["production_authorized"] is False
          assert d["private_row_level_4for4_output_persisted"] is False
          assert d["player_level_candidate_artifact_persisted"] is False
          assert d["candidate_artifact_contract"]["row_count"] == 408
          assert d["diagnostics"]["matched_n"] == 304
          assert d["diagnostics"]["matched_move_ge_3_count"] == 72
          assert d["diagnostics"]["matched_move_ge_5_count"] == 11
          print("PASS: exact green Phase 3 candidate reproduced.")
          PY

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html free-agent-board.html data
          git diff --exit-code -- scripts/model scripts/sync scripts/validation
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          test ! -e data/free_agent_utility_v1.json

      - name: Guard exact Phase 4 write scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              "research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.json",
              "research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.md",
          }
          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = {line[3:] for line in out.splitlines() if line.strip()}
          if touched != allowed:
              raise SystemExit(
                  f"Expected exactly Phase 4 aggregate outputs; got {sorted(touched)}"
              )
          print("PASS: exact Phase 4 write scope.")
          PY

      - name: Commit aggregate Phase 4 shadow only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.json \
            research/free-agent-utility-v1/phase4_production_candidate_shadow_summary.md

          git pull --rebase --autostash origin main
          python3 scripts/validation/repo_regression_checks.py
          git diff --cached --exit-code -- index.html free-agent-board.html data

          git commit -m "Freeze Free Agent Utility V1 Phase 4 production shadow"
          git push origin HEAD:main

      - name: Destroy private and temporary player-level artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-free-agent-utility-v1-phase4
          echo "PASS: private provider inputs and temporary player-level candidate destroyed."
