name: Trade Result UI Polish V1 - Regenerated Artifact Guard Fix V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  trade-result-ui-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard deployed Trade Robustness V1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          confirmation = json.loads(
              Path("research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.json")
              .read_text(encoding="utf-8")
          )
          assert confirmation["decision"] == "PASS_TRADE_ROBUSTNESS_V1_PHASE2_UI_SHADOW_DEPLOYED"
          assert confirmation["display_only"] is True
          assert confirmation["trade_verdict_changed"] is False

          text = Path("index.html").read_text(encoding="utf-8")
          assert "function tradeRobustnessAssessment(){" in text
          assert "function renderTradeRobustness(){" in text
          assert "renderTradeRobustness();" in text

          def block(marker):
              start = text.find(marker)
              assert start >= 0, marker
              open_idx = text.find("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_idx
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i+1 < len(text) else ""
                  if line_comment:
                      if ch == "\n": line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == quote: quote = None
                      i += 1
                      continue
                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      i += 1
                      continue
                  if ch == "{": depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise AssertionError(marker)

          protected = {
              "playerValue": block("function playerValue("),
              "packageAdjustmentAssessment": block("function packageAdjustmentAssessment("),
              "tradeVerdictTotals": block("function tradeVerdictTotals("),
              "tradeRobustnessVerdictClass": block("function tradeRobustnessVerdictClass("),
              "tradeRobustnessAssessment": block("function tradeRobustnessAssessment("),
          }
          hashes = {k: hashlib.sha256(v.encode()).hexdigest() for k,v in protected.items()}
          Path(os.environ["RUNNER_TEMP"], "protected.json").write_text(
              json.dumps(hashes, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS: production and Trade Robustness calculation functions fingerprinted.")
          PY

          sha256sum scripts/artifacts/generated/value_uncertainty.json research/trade-robustness-v1/trade_robustness_v1_phase1b_live_verdict_alignment.json research/trade-robustness-v1/trade_robustness_v1_phase1b_manifest.json > "${RUNNER_TEMP}/immutable.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Apply Trade Result UI polish
        shell: bash
        env:
          STYLE_B64: ""
          RENDER_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          assert 'id="trade-result-polish-v1-styles"' not in text
          style = base64.b64decode(os.environ["STYLE_B64"]).decode("utf-8")
          render = base64.b64decode(os.environ["RENDER_B64"]).decode("utf-8")

          assert "</head>" in text
          text = text.replace("</head>", style + "\n</head>", 1)

          start = text.find("function renderTradeRobustness(){")
          end_marker = "function syncValueUncertaintyFromGitHub(){"
          end = text.find(end_marker, start)
          assert start >= 0 and end > start

          text = text[:start] + render + "\n" + text[end:]
          path.write_text(text, encoding="utf-8")

          print("PASS: Trade Result presentation polish applied.")
          PY

      - name: Verify calculation logic unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")

          def block(marker):
              start = text.find(marker)
              assert start >= 0, marker
              open_idx = text.find("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_idx
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i+1 < len(text) else ""
                  if line_comment:
                      if ch == "\n": line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == quote: quote = None
                      i += 1
                      continue
                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      i += 1
                      continue
                  if ch == "{": depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise AssertionError(marker)

          actual = {
              "playerValue": block("function playerValue("),
              "packageAdjustmentAssessment": block("function packageAdjustmentAssessment("),
              "tradeVerdictTotals": block("function tradeVerdictTotals("),
              "tradeRobustnessVerdictClass": block("function tradeRobustnessVerdictClass("),
              "tradeRobustnessAssessment": block("function tradeRobustnessAssessment("),
          }
          actual = {k: hashlib.sha256(v.encode()).hexdigest() for k,v in actual.items()}
          expected = json.loads(
              Path(os.environ["RUNNER_TEMP"], "protected.json").read_text(encoding="utf-8")
          )
          assert actual == expected, "A protected calculation function changed"
          print("PASS: all protected calculation functions remain byte-identical.")
          PY

      - name: Validate polished UI and existing robustness behavior
        shell: bash
        run: |
          set -euo pipefail

          python3 research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_validator.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          text = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="trade-result-polish-v1-styles"',
              ".trade-robustness-card",
              ".trade-robustness-badge",
              ".trade-robustness-copy-main",
              ".trade-robustness-copy-values",
              "Sensitivity Robust",
              "Sensitivity Fragile",
              "Adverse case favors Side",
              "Adverse case becomes Fair Trade",
          ]
          missing = [x for x in required if x not in text]
          assert not missing, f"Missing UI polish markers: {missing}"

          result = {
              "schema_version": 1,
              "study_id": "trade-result-ui-polish-v1",
              "decision": "PASS_TRADE_RESULT_UI_POLISH_V1_DEPLOYED",
              "generated_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "presentation_only": True,
              "fundamental_value_changed": False,
              "market_value_changed": False,
              "package_adjustment_changed": False,
              "team_utility_changed": False,
              "trade_verdict_changed": False,
              "trade_robustness_calculation_changed": False,
              "changes": [
                  "premium Trade Result card styling",
                  "pill treatment for displayed gap",
                  "two-column robustness badge/detail component",
                  "polished balance meter and side labels",
                  "responsive mobile layout",
              ],
          }

          out = Path("research/trade-robustness-v1/trade_result_ui_polish_v1_confirmation.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          md = Path("research/trade-robustness-v1/trade_result_ui_polish_v1_confirmation.md")
          md.write_text(
              "# Trade Result UI Polish V1\n\n"
              "**Decision:** `PASS_TRADE_RESULT_UI_POLISH_V1_DEPLOYED`\n\n"
              "Presentation-only deployment. No valuation, package-adjustment, "
              "trade-verdict, Team Utility, Market Value, or Trade Robustness "
              "calculation changed.\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify immutable inputs and exact change scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/immutable.sha256"

          python3 - <<'PY'
          import subprocess

          allowed = {
              "index.html",
              "research/trade-robustness-v1/trade_result_ui_polish_v1_confirmation.json",
              "research/trade-robustness-v1/trade_result_ui_polish_v1_confirmation.md",
              # Existing Phase 2 validator rewrites its confirmation/manifest each run.
              "research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.json",
              "research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.md",
              "research/trade-robustness-v1/trade_robustness_v1_phase2_manifest.json",
          }

          actual = {
              line[3:] for line in subprocess.check_output(
                  ["git","status","--porcelain","--untracked-files=all"],
                  text=True,
              ).splitlines() if line.strip()
          }

          unexpected = actual - allowed
          assert not unexpected, f"Unexpected changes: {sorted(unexpected)}"
          print("PASS: UI polish changed only approved presentation/revalidation artifacts.")
          PY

          git diff --check

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Commit Trade Result UI polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             index.html             research/trade-robustness-v1/trade_result_ui_polish_v1_confirmation.json             research/trade-robustness-v1/trade_result_ui_polish_v1_confirmation.md             research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.json             research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.md             research/trade-robustness-v1/trade_robustness_v1_phase2_manifest.json

          git diff --cached --check
          git commit -m "Polish Trade Result robustness presentation"
          git pull --rebase origin main
          git push origin main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PASS: Trade Result UI Polish V1 deployed cleanly."
