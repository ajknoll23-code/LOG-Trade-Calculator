name: B2C Package Adjustment V8 - Outcome-Blind Maturity Monitor V5 Slot 44 Reset

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-adjustment-v8-development-maturity-monitor-v5-slot44-reset
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RESET16_SLOT: "16"
  RESET16_CUTOFF_UTC: "2026-10-03T20:20:10.208764+00:00"
  RESET16_SOURCE_RUN_ID: "37151151504"
  RESET16_SOURCE_ARTIFACT_SHA256: "6a04295d5a4fb2ca9c4bd560132cebdae274be7261e2b5befb0c65771aae7e94"
  RESET35_SLOT: "35"
  RESET35_CUTOFF_UTC: "2026-10-04T14:08:53.081814+00:00"
  RESET35_SOURCE_RUN_ID: "37208161419"
  RESET35_SOURCE_ARTIFACT_SHA256: "b1c61f07ede63759ec75316f8642d16d4f7aa848103e1f58ef464664d9a63cfa"
  RESET44_SLOT: "44"
  RESET44_CUTOFF_UTC: "2026-10-04T15:38:35.088288+00:00"
  RESET44_SOURCE_RUN_ID: "37213751763"
  RESET44_SOURCE_ARTIFACT_SHA256: "f990d15c6249ba514ccd3a48cc22e10bb1bf4de6019b74f3c7312ce377f5fbee"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install monitor dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V8 voting contract and reset provenance
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/package-adjustment-v8/development_voting_activation_manifest_v1.json"]="938bf754c90adeda8f3a5f863acfda8967c3818d"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/voting_randomization_schedule_v1.json"]="c499d85b8473798294eccfe9310ec9644c1db3fc"
            ["research/package-adjustment-v8/voting_integrity_contract_v1.json"]="203fd97e27e31413b5c18e3f8c7ecd6fd06cfeb8"
            ["research/package-adjustment-v8/validate_voting_dataset_v1.py"]="aaab7e8e4f8eb66a9a57503d8185c0bf77acba71"
          )
          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: frozen V8 contract drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          act=json.loads((d/"development_voting_activation_manifest_v1.json").read_text())
          cat=json.loads((d/"package_vote_challenges_v8_development_v1.json").read_text())
          sched=json.loads((d/"voting_randomization_schedule_v1.json").read_text())
          integrity=json.loads((d/"voting_integrity_contract_v1.json").read_text())

          assert act["status"]=="V8_DEVELOPMENT_VOTING_ACTIVATED"
          assert act["research_only"] is True
          assert act["candidate_fit_performed"] is False
          assert act["candidate_scores_read"] is False
          assert act["v8_vote_outcomes_read_at_activation"] is False
          assert act["production_change_authorized"] is False
          assert act["accepted_complete_voters_exactly"]==50
          assert act["accepted_ballots_exactly"]==2000
          assert act["challenges_per_voter"]==40
          assert act["accepted_voter_slots_exactly_1_to_50"] is True
          assert act["early_stop_before_50"] is False
          assert act["left_right_balance_each_challenge"]=="25/25"

          assert act["catalog_sha256"]==hashlib.sha256(
              (d/"package_vote_challenges_v8_development_v1.json").read_bytes()
          ).hexdigest()
          assert act["schedule_sha256"]==hashlib.sha256(
              (d/"voting_randomization_schedule_v1.json").read_bytes()
          ).hexdigest()

          assert cat["status"]=="FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED"
          assert cat["voting_activated"] is False
          assert cat["challenge_count"]==40
          assert sched["status"]=="FROZEN_PRE_VOTE"
          assert sched["accepted_voter_slots"]==50
          assert sched["challenges"]==40
          assert sched["left_right_balance_per_challenge"]=={"A_left":25,"B_left":25}
          assert sched["v8_votes_read"] is False
          assert integrity["status"]=="FROZEN_PRE_VOTE"
          assert integrity["accepted_voters"]==50
          assert integrity["accepted_ballots"]==2000
          assert integrity["challenges_per_voter"]==40
          assert integrity["complete_session_required"] is True
          assert integrity["incomplete_sessions_count_toward_maturity"] is False
          assert integrity["duplicate_ballots_allowed"] is False
          assert integrity["early_stop_before_50"] is False
          assert integrity["maturity_monitor_outcome_blind"] is True

          reset16_slot=int(os.environ["RESET16_SLOT"])
          reset16_cutoff=datetime.fromisoformat(os.environ["RESET16_CUTOFF_UTC"])
          assert reset16_cutoff.tzinfo is not None
          assert reset16_cutoff.astimezone(timezone.utc).isoformat()==os.environ["RESET16_CUTOFF_UTC"]
          assert reset16_slot==16
          assert os.environ["RESET16_SOURCE_RUN_ID"]=="37151151504"
          assert os.environ["RESET16_SOURCE_ARTIFACT_SHA256"]==(
              "6a04295d5a4fb2ca9c4bd560132cebdae274be7261e2b5befb0c65771aae7e94"
          )

          reset35_slot=int(os.environ["RESET35_SLOT"])
          reset35_cutoff=datetime.fromisoformat(os.environ["RESET35_CUTOFF_UTC"])
          assert reset35_cutoff.tzinfo is not None
          assert reset35_cutoff.astimezone(timezone.utc).isoformat()==os.environ["RESET35_CUTOFF_UTC"]
          assert reset35_slot==35
          assert reset35_cutoff>reset16_cutoff
          assert os.environ["RESET35_SOURCE_RUN_ID"]=="37208161419"
          assert os.environ["RESET35_SOURCE_ARTIFACT_SHA256"]==(
              "b1c61f07ede63759ec75316f8642d16d4f7aa848103e1f58ef464664d9a63cfa"
          )

          reset44_slot=int(os.environ["RESET44_SLOT"])
          reset44_cutoff=datetime.fromisoformat(os.environ["RESET44_CUTOFF_UTC"])
          assert reset44_cutoff.tzinfo is not None
          assert reset44_cutoff.astimezone(timezone.utc).isoformat()==os.environ["RESET44_CUTOFF_UTC"]
          assert reset44_slot==44
          assert reset44_cutoff>reset35_cutoff
          assert os.environ["RESET44_SOURCE_RUN_ID"]=="37213751763"
          assert os.environ["RESET44_SOURCE_ARTIFACT_SHA256"]==(
              "f990d15c6249ba514ccd3a48cc22e10bb1bf4de6019b74f3c7312ce377f5fbee"
          )

          html=Path("index.html").read_text(encoding="utf-8")
          for token in (
              "Package Adjustment V8 Development Voting.",
              "__pkgv8dev__|",
              "__pkgv8dev_meta__|",
              "__pkgv8dev_schema__|1",
              "const PACKAGE_VOTE_TOTAL_SLOTS = 50;",
              "pkgv8slot",
          ):
              assert token in html,token

          ktc=Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          assert '"__pkgv8dev__|"' in ktc
          reg=Path("scripts/validation/repo_regression_checks.py").read_text(encoding="utf-8")
          assert '"__pkgv8dev__|"' in reg
          assert "PASS V8 frozen 50-slot package sampling contract:" in reg
          print("PASS: frozen V8 contract exact; Slot 16, Slot 35, and Slot 44 reset provenance frozen before re-vote.")
          PY

          python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test triple reset and fixed-50 maturity arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter,defaultdict

          IDS=[f"c{i:02d}" for i in range(40)]

          def assess(rows):
              by_voter=defaultdict(list); pair_counts=Counter()
              for r in rows:
                  by_voter[r["voter"]].append(r)
                  pair_counts[(r["voter"],r["cid"])]+=1
              complete=[]; invalid=[]
              for voter,vr in by_voter.items():
                  slots={r["slot"] for r in vr}; reasons=[]
                  if len(slots)!=1: reasons.append("multiple_slots")
                  if any(pair_counts[(voter,cid)]>1 for cid in IDS): reasons.append("duplicate_voter_challenge")
                  if len(vr)!=40: reasons.append("not_exactly_40_rows")
                  if {r["cid"] for r in vr}!=set(IDS): reasons.append("challenge_set_mismatch")
                  if reasons:
                      invalid.append((voter,reasons)); continue
                  complete.append((voter,next(iter(slots))))
              slot_to_voters=defaultdict(list)
              for voter,slot in complete: slot_to_voters[slot].append(voter)
              collisions={slot:voters for slot,voters in slot_to_voters.items() if len(voters)>1}
              accepted={slot for slot,voters in slot_to_voters.items() if len(voters)==1}
              return accepted,collisions,invalid

          rows=[]
          # Accepted Slots 1-15.
          for slot in range(1,16):
              for order,cid in enumerate(IDS):
                  rows.append({"voter":f"v{slot}","slot":slot,"cid":cid,"order":order,"reset16":False,"reset35":False,"reset44":False})
          # Historical Slot 16 collision: both sessions must be structurally excluded.
          for voter in ("old16a","old16b"):
              for order,cid in enumerate(IDS):
                  rows.append({"voter":voter,"slot":16,"cid":cid,"order":order,"reset16":True,"reset35":False,"reset44":False})
          # Valid current Slots 16-34.
          for slot in range(16,35):
              for order,cid in enumerate(IDS):
                  rows.append({"voter":f"v{slot}","slot":slot,"cid":cid,"order":order,"reset16":False,"reset35":False,"reset44":False})
          # Frozen malformed Slot 35 session: 42 rows, 40 unique challenges, two duplicated challenges.
          for order,cid in enumerate(IDS):
              rows.append({"voter":"old35","slot":35,"cid":cid,"order":order,"reset16":False,"reset35":True,"reset44":False})
          for order,cid in enumerate(IDS[:2]):
              rows.append({"voter":"old35","slot":35,"cid":cid,"order":order,"reset16":False,"reset35":True,"reset44":False})
          # Fresh replacement on Slot 35 and valid Slots 36-43.
          for order,cid in enumerate(IDS):
              rows.append({"voter":"redo35","slot":35,"cid":cid,"order":order,"reset16":False,"reset35":False,"reset44":False})
          for slot in range(36,44):
              for order,cid in enumerate(IDS):
                  rows.append({"voter":f"v{slot}","slot":slot,"cid":cid,"order":order,"reset16":False,"reset35":False,"reset44":False})
          # Frozen malformed Slot 44 session: 41 rows, 40 unique challenges, one duplicated challenge.
          for order,cid in enumerate(IDS):
              rows.append({"voter":"old44","slot":44,"cid":cid,"order":order,"reset16":False,"reset35":False,"reset44":True})
          rows.append({"voter":"old44","slot":44,"cid":IDS[0],"order":0,"reset16":False,"reset35":False,"reset44":True})
          # Fresh replacement on Slot 44.
          for order,cid in enumerate(IDS):
              rows.append({"voter":"redo44","slot":44,"cid":cid,"order":order,"reset16":False,"reset35":False,"reset44":False})

          before44=[r for r in rows if not r["reset16"] and not r["reset35"]]
          _,_,invalid=assess(before44)
          assert len(invalid)==1 and invalid[0][0]=="old44"

          filtered=[r for r in rows if not r["reset16"] and not r["reset35"] and not r["reset44"]]
          accepted,collisions,invalid=assess(filtered)
          assert accepted==set(range(1,45))
          assert not collisions and not invalid
          print("PASS: frozen Slot 16, Slot 35, and Slot 44 bad sessions are excluded; fresh Slot 35 and Slot 44 replacements are accepted.")
          PY

      - name: Build outcome-blind maturity report with frozen Slot 16, Slot 35, and Slot 44 resets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v8-development-maturity-v5
          mkdir -p /tmp/package-adjustment-v8-development-maturity-v5

          python3 - <<'PY'
          from __future__ import annotations
          import csv,hashlib,io,json,os,re
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path
          import requests

          ROOT=Path.cwd(); D=ROOT/"research/package-adjustment-v8"
          OUT=Path("/tmp/package-adjustment-v8-development-maturity-v5")
          SHEET_URL=(
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          def load(path): return json.loads(path.read_text(encoding="utf-8"))
          def parse_utc(value):
              s=str(value or "").strip()
              if not s: return None
              if s.endswith("Z"): s=s[:-1]+"+00:00"
              try: dt=datetime.fromisoformat(s)
              except ValueError: return None
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          act=load(D/"development_voting_activation_manifest_v1.json")
          cat=load(D/"package_vote_challenges_v8_development_v1.json")
          sched=load(D/"voting_randomization_schedule_v1.json")
          assert act["status"]=="V8_DEVELOPMENT_VOTING_ACTIVATED"
          assert act["v8_vote_outcomes_read_at_activation"] is False
          assert act["candidate_fit_performed"] is False
          assert act["candidate_scores_read"] is False
          assert act["production_change_authorized"] is False
          assert act["accepted_complete_voters_exactly"]==50
          assert act["accepted_ballots_exactly"]==2000
          assert act["early_stop_before_50"] is False

          VOTE_PREFIX="__pkgv8dev__|"; SCHEMA_MARKER="__pkgv8dev_schema__|1"
          activation_cutoff=parse_utc(act["valid_ballot_start_utc"]); assert activation_cutoff
          reset16_slot=int(os.environ["RESET16_SLOT"])
          reset16_cutoff=parse_utc(os.environ["RESET16_CUTOFF_UTC"]); assert reset16_cutoff
          reset35_slot=int(os.environ["RESET35_SLOT"])
          reset35_cutoff=parse_utc(os.environ["RESET35_CUTOFF_UTC"]); assert reset35_cutoff
          reset44_slot=int(os.environ["RESET44_SLOT"])
          reset44_cutoff=parse_utc(os.environ["RESET44_CUTOFF_UTC"]); assert reset44_cutoff
          challenges={str(c["id"]):c for c in cat["challenges"]}; assert len(challenges)==40
          challenge_ids=set(challenges); expected_slots=set(range(1,51))

          ktc_text=(ROOT/"scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          assert f'SHEET_CSV_URL = "{SHEET_URL}"' in ktc_text
          assert '"__pkgv8dev__|"' in ktc_text

          generated_at=datetime.now(timezone.utc)
          resp=requests.get(SHEET_URL,timeout=30); resp.raise_for_status()
          source_bytes=resp.content
          source_rows=list(csv.DictReader(io.StringIO(resp.text)))
          sheet_sha256=hashlib.sha256(source_bytes).hexdigest()
          meta_re=re.compile(
              r"^__pkgv8dev_meta__\|[AB]\|([1-9]|[1-4][0-9]|50)\|([0-9]|[1-2][0-9]|3[0-9])$"
          )

          excluded=Counter(); structural=[]; reset16_rows=[]; reset35_rows=[]; reset44_rows=[]; raw_namespace_rows=0
          for source_index,row in enumerate(source_rows):
              keep=str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX): continue
              raw_namespace_rows+=1
              ts=parse_utc(row.get("timestamp"))
              if ts is None: excluded["invalid_timestamp"]+=1; continue
              if ts<=activation_cutoff: excluded["pre_activation_or_at_cutoff"]+=1; continue
              if ts>generated_at: excluded["future_timestamp"]+=1; continue
              voter=str(row.get("voter_roster_id") or "").strip()
              if not voter: excluded["missing_voter_id"]+=1; continue

              # OUTCOME-BLIND: only challenge id is read; A/B choice payload is discarded unopened.
              payload=keep[len(VOTE_PREFIX):]
              challenge_id,sep,_ignored_choice_payload=payload.partition("|")
              if not sep: excluded["malformed_vote_transport"]+=1; continue
              challenge_id=challenge_id.strip()
              if challenge_id not in challenges: excluded["unknown_challenge_id"]+=1; continue
              meta=str(row.get("trade") or ""); mm=meta_re.fullmatch(meta)
              if not mm: excluded["invalid_meta_transport"]+=1; continue
              slot=int(mm.group(1)); display_order=int(mm.group(2))
              if str(row.get("cut") or "")!=SCHEMA_MARKER: excluded["invalid_schema_marker"]+=1; continue
              spec=sched["slots"][str(slot)]
              if challenge_id not in spec["challenge_order"]: excluded["challenge_not_in_slot_schedule"]+=1; continue
              expected_order=spec["challenge_order"].index(challenge_id)
              if display_order!=expected_order: excluded["display_order_schedule_mismatch"]+=1; continue

              item={"timestamp":ts,"source_index":source_index,"voter":voter,
                    "challenge_id":challenge_id,"slot":slot,"display_order":display_order}
              if slot==reset16_slot and ts<=reset16_cutoff:
                  reset16_rows.append(item)
                  excluded["slot16_collision_reset_pre_cutoff"]+=1
                  continue
              if slot==reset35_slot and ts<=reset35_cutoff:
                  reset35_rows.append(item)
                  excluded["slot35_invalid_session_reset_pre_cutoff"]+=1
                  continue
              if slot==reset44_slot and ts<=reset44_cutoff:
                  reset44_rows.append(item)
                  excluded["slot44_invalid_session_reset_pre_cutoff"]+=1
                  continue
              structural.append(item)

          # Fail closed unless the historical Slot 16 reset remains exactly the two complete sessions seen in B2 #9.
          assert len(reset16_rows)==80,("reset16_row_count",len(reset16_rows))
          reset16_by_voter=defaultdict(list)
          for r in reset16_rows: reset16_by_voter[r["voter"]].append(r)
          assert len(reset16_by_voter)==2,("reset16_voter_count",len(reset16_by_voter))
          for voter,rows in reset16_by_voter.items():
              assert len(rows)==40,(voter,len(rows))
              assert {r["slot"] for r in rows}=={16}
              assert {r["challenge_id"] for r in rows}==challenge_ids
              by_order=sorted(rows,key=lambda r:r["display_order"])
              assert [r["display_order"] for r in by_order]==list(range(40))
              assert [r["challenge_id"] for r in by_order]==sched["slots"]["16"]["challenge_order"]

          # Fail closed unless the new frozen cutoff isolates exactly the malformed Slot 35 session from B2A run #7.
          assert len(reset35_rows)==42,("reset35_row_count",len(reset35_rows))
          reset35_by_voter=defaultdict(list)
          for r in reset35_rows: reset35_by_voter[r["voter"]].append(r)
          assert len(reset35_by_voter)==1,("reset35_voter_count",len(reset35_by_voter))
          reset35_only=next(iter(reset35_by_voter.values()))
          assert {r["slot"] for r in reset35_only}=={35}
          assert {r["challenge_id"] for r in reset35_only}==challenge_ids
          challenge_counts=Counter(r["challenge_id"] for r in reset35_only)
          assert sorted(challenge_counts.values())==([1]*38+[2]*2),challenge_counts
          order_counts=Counter(r["display_order"] for r in reset35_only)
          assert set(order_counts)==set(range(40)),order_counts
          assert sorted(order_counts.values())==([1]*38+[2]*2),order_counts
          assert sum(n-1 for n in challenge_counts.values())==2

          # Fail closed unless the newest frozen cutoff isolates exactly the malformed Slot 44 session from B2B run #3.
          assert len(reset44_rows)==41,("reset44_row_count",len(reset44_rows))
          reset44_by_voter=defaultdict(list)
          for r in reset44_rows: reset44_by_voter[r["voter"]].append(r)
          assert len(reset44_by_voter)==1,("reset44_voter_count",len(reset44_by_voter))
          reset44_only=next(iter(reset44_by_voter.values()))
          assert {r["slot"] for r in reset44_only}=={44}
          assert {r["challenge_id"] for r in reset44_only}==challenge_ids
          challenge_counts44=Counter(r["challenge_id"] for r in reset44_only)
          assert sorted(challenge_counts44.values())==([1]*39+[2]),challenge_counts44
          order_counts44=Counter(r["display_order"] for r in reset44_only)
          assert set(order_counts44)==set(range(40)),order_counts44
          assert sorted(order_counts44.values())==([1]*39+[2]),order_counts44
          assert sum(n-1 for n in challenge_counts44.values())==1

          structural.sort(key=lambda r:(r["timestamp"],r["source_index"]))
          by_voter=defaultdict(list); pair_counts=Counter()
          for r in structural:
              by_voter[r["voter"]].append(r); pair_counts[(r["voter"],r["challenge_id"])]+=1

          session_rows=[]; complete_sessions=[]; incomplete_sessions=[]; invalid_sessions=[]
          for voter,rows in by_voter.items():
              reasons=[]; slots={r["slot"] for r in rows}
              if len(slots)!=1: reasons.append("multiple_slots")
              duplicate_n=sum(1 for cid in challenge_ids if pair_counts[(voter,cid)]>1)
              if duplicate_n: reasons.append("duplicate_voter_challenge")
              if len(rows)!=40: reasons.append("not_exactly_40_structural_rows")
              observed={r["challenge_id"] for r in rows}
              if observed!=challenge_ids: reasons.append("challenge_set_mismatch")
              slot=next(iter(slots)) if len(slots)==1 else None
              if slot is not None:
                  spec=sched["slots"][str(slot)]; by_order=sorted(rows,key=lambda r:r["display_order"])
                  if [r["display_order"] for r in by_order]!=list(range(40)):
                      reasons.append("display_order_not_exactly_0_to_39")
                  elif [r["challenge_id"] for r in by_order]!=spec["challenge_order"]:
                      reasons.append("challenge_order_schedule_mismatch")
              voter_hash=hashlib.sha256(("v8-maturity-voter|"+voter).encode()).hexdigest()[:16]
              record={"voter_hash":voter_hash,"slot":slot,"structural_row_count":len(rows),
                      "unique_challenge_count":len(observed),"duplicate_challenge_count":duplicate_n,
                      "complete":not reasons,"invalid_reasons":reasons}
              session_rows.append(record)
              if not reasons: complete_sessions.append((voter,slot))
              elif any(x in reasons for x in (
                  "multiple_slots","duplicate_voter_challenge","display_order_not_exactly_0_to_39",
                  "challenge_order_schedule_mismatch")):
                  invalid_sessions.append(record)
              else: incomplete_sessions.append(record)

          slot_to_voters=defaultdict(list)
          for voter,slot in complete_sessions: slot_to_voters[slot].append(voter)
          slot_collisions={str(s):len(v) for s,v in sorted(slot_to_voters.items()) if len(v)>1}
          accepted_slots={s for s,v in slot_to_voters.items() if len(v)==1}
          accepted_complete_voters=len(accepted_slots); accepted_ballots=accepted_complete_voters*40
          missing_slots=sorted(expected_slots-accepted_slots)

          if invalid_sessions: decision="HOLD_INVALID_SESSION_STRUCTURE"
          elif slot_collisions: decision="HOLD_SLOT_COLLISION"
          elif accepted_slots==expected_slots and len(complete_sessions)==50:
              decision="STOP_AND_FREEZE_EXACT_50_COMPLETE_VOTERS"
          else: decision="CONTINUE_TO_EXACT_50_COMPLETE_VOTERS"

          report={
              "schema_version":5,"study_id":act["study_id"],
              "stage":"development_outcome_blind_maturity_monitor_v5_slot16_slot35_slot44_resets",
              "status":decision,"decision":decision,"generated_at_utc":generated_at.isoformat(),
              "outcome_blind":True,"human_choice_payload_read":False,"human_choice_payload_stored":False,
              "human_choice_payload_counted":False,"candidate_scores_read":False,"candidate_fit_performed":False,
              "production_change_authorized":False,"display_side_value_retained":False,
              "resets":{
                  "slot16":{
                      "reason":"two structurally complete voters collided on frozen slot 16 in B2 monitor run #9",
                      "slot":reset16_slot,"cutoff_utc":reset16_cutoff.isoformat(),
                      "source_run_id":int(os.environ["RESET16_SOURCE_RUN_ID"]),
                      "source_artifact_sha256":os.environ["RESET16_SOURCE_ARTIFACT_SHA256"],
                      "pre_cutoff_rows_excluded":len(reset16_rows),
                      "pre_cutoff_sessions_excluded":len(reset16_by_voter),
                      "raw_source_rows_deleted":False,"excluded_from_analysis":True,
                      "human_choice_payload_read_for_reset":False
                  },
                  "slot35":{
                      "reason":"one structurally invalid Slot 35 session in B2A monitor run #7: 42 rows, 40 unique challenges, 2 duplicated challenges",
                      "slot":reset35_slot,"cutoff_utc":reset35_cutoff.isoformat(),
                      "source_run_id":int(os.environ["RESET35_SOURCE_RUN_ID"]),
                      "source_artifact_sha256":os.environ["RESET35_SOURCE_ARTIFACT_SHA256"],
                      "pre_cutoff_rows_excluded":len(reset35_rows),
                      "pre_cutoff_sessions_excluded":len(reset35_by_voter),
                      "expected_structural_shape":{"rows":42,"unique_challenges":40,"duplicated_challenges":2},
                      "raw_source_rows_deleted":False,"excluded_from_analysis":True,
                      "human_choice_payload_read_for_reset":False,
                      "redo_rule":"one fresh complete voter may be assigned to Slot 35 after the frozen reset cutoff"
                  },
                  "slot44":{
                      "reason":"one structurally invalid Slot 44 session in B2B monitor run #3: 41 rows, 40 unique challenges, 1 duplicated challenge",
                      "slot":reset44_slot,"cutoff_utc":reset44_cutoff.isoformat(),
                      "source_run_id":int(os.environ["RESET44_SOURCE_RUN_ID"]),
                      "source_artifact_sha256":os.environ["RESET44_SOURCE_ARTIFACT_SHA256"],
                      "pre_cutoff_rows_excluded":len(reset44_rows),
                      "pre_cutoff_sessions_excluded":len(reset44_by_voter),
                      "expected_structural_shape":{"rows":41,"unique_challenges":40,"duplicated_challenges":1},
                      "raw_source_rows_deleted":False,"excluded_from_analysis":True,
                      "human_choice_payload_read_for_reset":False,
                      "redo_rule":"one fresh complete voter may be assigned to Slot 44 after the frozen reset cutoff"
                  }
              },
              "contract":{"accepted_complete_voters_exactly":50,"accepted_ballots_exactly":2000,
                  "challenges_per_voter":40,"accepted_voter_slots_exactly_1_to_50":True,
                  "complete_session_required":True,"incomplete_sessions_count_toward_maturity":False,
                  "duplicate_ballots_allowed":False,"early_stop_before_50":False,"left_right_balance_each_challenge":"25/25"},
              "source":{"sheet_sha256":sheet_sha256,"source_csv_row_count":len(source_rows),
                  "raw_v8_namespace_rows":raw_namespace_rows,"structurally_valid_rows_after_resets":len(structural),
                  "activation_cutoff_utc":activation_cutoff.isoformat()},
              "exclusions":dict(sorted(excluded.items())),
              "current":{"distinct_structural_voters":len(by_voter),
                  "complete_session_voters_before_slot_collision_filter":len(complete_sessions),
                  "accepted_complete_voters":accepted_complete_voters,"accepted_ballots":accepted_ballots,
                  "completed_unique_slots":len(accepted_slots),"missing_slot_count":len(missing_slots),
                  "missing_slots":missing_slots,"incomplete_session_count":len(incomplete_sessions),
                  "invalid_session_count":len(invalid_sessions),"slot_collision_count":len(slot_collisions),
                  "slot_collisions":slot_collisions},
              "sessions":sorted(session_rows,key=lambda r:(r["slot"] if r["slot"] is not None else 999,r["voter_hash"]))
          }

          serialized=json.dumps(report,sort_keys=True).lower()
          for forbidden in ("human_choice_left","canonical_choice","side_a_votes","side_b_votes","choice_pct",
                            "winner_model","candidate_log_loss","candidate_minus","selected_candidate","fit_parameter"):
              assert forbidden not in serialized,forbidden

          (OUT/"maturity.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          lines=["# Package Adjustment V8 — Outcome-Blind Development Maturity V5 Slot 44 Reset","",
              f"**Decision:** `{decision}`","",
              "**Historical Slot 16 collision rows and the frozen malformed Slot 35 and Slot 44 sessions are excluded structurally; all A/B choices remain unopened.**","",
              f"- Slot 16 reset rows excluded: **{len(reset16_rows)}**",
              f"- Slot 16 reset sessions excluded: **{len(reset16_by_voter)}**",
              f"- Slot 35 reset rows excluded: **{len(reset35_rows)}**",
              f"- Slot 35 reset sessions excluded: **{len(reset35_by_voter)}**",
              f"- Slot 44 reset rows excluded: **{len(reset44_rows)}**",
              f"- Slot 44 reset sessions excluded: **{len(reset44_by_voter)}**",
              f"- Accepted complete voters: **{accepted_complete_voters} / 50**",
              f"- Accepted ballots: **{accepted_ballots} / 2000**",
              f"- Completed unique voter slots: **{len(accepted_slots)} / 50**",
              f"- Missing slots: **{len(missing_slots)}**",
              f"- Incomplete sessions: **{len(incomplete_sessions)}**",
              f"- Invalid sessions: **{len(invalid_sessions)}**",
              f"- Slot collisions: **{len(slot_collisions)}**","",
              "Redo instruction: Slot 44 is reset to empty; assign Slot 44 to one fresh voter after the frozen cutoff.",""]
          if missing_slots: lines += ["Missing slot numbers: "+", ".join(map(str,missing_slots)),""]
          if slot_collisions: lines += ["Collided slots: "+", ".join(f"{slot} ({n})" for slot,n in slot_collisions.items()),""]
          lines += ["## Isolation","","- Raw source rows are preserved for auditability but reset rows are excluded from analysis.",
              "- Human A/B choice payload is never parsed, stored, counted, compared, or serialized.",
              "- Slot 16 reset remains frozen to the exact B2 #9 outcome-blind snapshot.",
              "- Slot 35 reset is frozen to the exact B2A #7 outcome-blind snapshot.",
              "- Slot 35 reset fails closed unless it finds exactly 42 rows, one voter, 40 unique challenges, and exactly two duplicated challenges/orders.",
              "- Slot 44 reset is frozen to the exact B2B #3 outcome-blind snapshot.",
              "- Slot 44 reset fails closed unless it finds exactly 41 rows, one voter, 40 unique challenges, and exactly one duplicated challenge/order.",
              "- No evaluator, candidate score, model fit, or production result is opened.",
              "- Maturity still requires exactly one complete accepted voter on every frozen slot 1–50.",""]
          (OUT/"maturity.md").write_text("\n".join(lines),encoding="utf-8")
          print(json.dumps({"decision":decision,
              "reset16_rows_excluded":len(reset16_rows),"reset16_sessions_excluded":len(reset16_by_voter),
              "reset35_rows_excluded":len(reset35_rows),"reset35_sessions_excluded":len(reset35_by_voter),
              "reset44_rows_excluded":len(reset44_rows),"reset44_sessions_excluded":len(reset44_by_voter),
              "accepted_complete_voters":accepted_complete_voters,
              "accepted_ballots":accepted_ballots,"completed_unique_slots":len(accepted_slots),
              "missing_slot_count":len(missing_slots),"incomplete_session_count":len(incomplete_sessions),
              "invalid_session_count":len(invalid_sessions),"slot_collision_count":len(slot_collisions),
              "human_choice_payload_read":False,"candidate_scores_read":False},indent=2))
          PY

      - name: Prove reset report is outcome-blind and fixed-50 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("/tmp/package-adjustment-v8-development-maturity-v5/maturity.json").read_text())
          assert d["outcome_blind"] is True
          assert d["human_choice_payload_read"] is False
          assert d["human_choice_payload_stored"] is False
          assert d["human_choice_payload_counted"] is False
          assert d["candidate_scores_read"] is False
          assert d["candidate_fit_performed"] is False
          assert d["production_change_authorized"] is False
          assert d["display_side_value_retained"] is False
          r16=d["resets"]["slot16"]
          assert r16["slot"]==16
          assert r16["cutoff_utc"]==os.environ["RESET16_CUTOFF_UTC"]
          assert r16["pre_cutoff_rows_excluded"]==80
          assert r16["pre_cutoff_sessions_excluded"]==2
          assert r16["raw_source_rows_deleted"] is False
          assert r16["excluded_from_analysis"] is True
          assert r16["human_choice_payload_read_for_reset"] is False

          r35=d["resets"]["slot35"]
          assert r35["slot"]==35
          assert r35["cutoff_utc"]==os.environ["RESET35_CUTOFF_UTC"]
          assert r35["pre_cutoff_rows_excluded"]==42
          assert r35["pre_cutoff_sessions_excluded"]==1
          assert r35["expected_structural_shape"]=={"rows":42,"unique_challenges":40,"duplicated_challenges":2}
          assert r35["raw_source_rows_deleted"] is False
          assert r35["excluded_from_analysis"] is True
          assert r35["human_choice_payload_read_for_reset"] is False

          r44=d["resets"]["slot44"]
          assert r44["slot"]==44
          assert r44["cutoff_utc"]==os.environ["RESET44_CUTOFF_UTC"]
          assert r44["pre_cutoff_rows_excluded"]==41
          assert r44["pre_cutoff_sessions_excluded"]==1
          assert r44["expected_structural_shape"]=={"rows":41,"unique_challenges":40,"duplicated_challenges":1}
          assert r44["raw_source_rows_deleted"] is False
          assert r44["excluded_from_analysis"] is True
          assert r44["human_choice_payload_read_for_reset"] is False
          assert d["contract"]=={
              "accepted_complete_voters_exactly":50,"accepted_ballots_exactly":2000,"challenges_per_voter":40,
              "accepted_voter_slots_exactly_1_to_50":True,"complete_session_required":True,
              "incomplete_sessions_count_toward_maturity":False,"duplicate_ballots_allowed":False,
              "early_stop_before_50":False,"left_right_balance_each_challenge":"25/25"}
          if d["decision"]=="STOP_AND_FREEZE_EXACT_50_COMPLETE_VOTERS":
              c=d["current"]
              assert c["accepted_complete_voters"]==50 and c["accepted_ballots"]==2000
              assert c["completed_unique_slots"]==50 and c["missing_slot_count"]==0
              assert c["incomplete_session_count"]==0 and c["invalid_session_count"]==0
              assert c["slot_collision_count"]==0
          print("PASS: V5 triple reset is outcome-blind, auditable, and cannot stop before exact 50 complete slots.")
          PY

