name: DLF Prospect FV V1 - Phase 1B4 Temporal and Implementation Freeze
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v1-phase1b4-temporal-implementation-freeze
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE1B3_RUN_ID: '36086876333'
  PHASE1B3_ARTIFACT_ID: '10843788309'
  PHASE1B3_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1b3-preregistration-correction
  PHASE1B3_JSON_SHA256: 5c5fe30633f72fffd07c37cada8a42e09b44bffce93c3b47058a75e96d171f76
  IDENTITY_SHA256: e8d79738530a73f15de0c52990e8f7fbf1e8d4f699448add0f5add11eaa093fb
  CORRECTED_FEATURE_SHA256: afad7d90c7dfed050186c78c270f66b89d70749e627c458575fcfffdc25543b4
  DLF_SEMANTIC_SHA256: 4dd07ea9180c11f7f3c80657dfe7274245a683fbb3b3eca2edb92c903c562414
  DLF_STRUCTURE_SHA256: 01e780ede9a21806e7f838ad735ee1c73f2f970766651b276aed9f6215769c10
jobs:
  freeze-temporal-and-implementation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download exact Phase 1B3 artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1B3_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1b3
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1B3_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Freeze temporally clean Phase 1C implementation
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"${RUNNER_TEMP}/dlf-phase1b4\"\npython3 - <<'PY'\nfrom __future__ import annotations\n\
        \nimport hashlib\nimport json\nimport os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nroot\
        \ = Path(os.environ[\"RUNNER_TEMP\"])\nsrc = root / \"phase1b3\" / \"dlf_prospect_fv_v1_phase1b3_preregistration_correction.json\"\
        \nout_dir = root / \"dlf-phase1b4\"\nout_dir.mkdir(parents=True, exist_ok=True)\n\nEXPECTED_JSON_SHA = os.environ[\"\
        PHASE1B3_JSON_SHA256\"]\nEXPECTED_IDENTITY_SHA = os.environ[\"IDENTITY_SHA256\"]\nEXPECTED_FEATURE_SHA = os.environ[\"\
        CORRECTED_FEATURE_SHA256\"]\nEXPECTED_SEMANTIC_SHA = os.environ[\"DLF_SEMANTIC_SHA256\"]\nEXPECTED_STRUCTURE_SHA =\
        \ os.environ[\"DLF_STRUCTURE_SHA256\"]\n\ndef sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\
        \nraw = src.read_bytes()\nactual = sha256_bytes(raw)\nif actual != EXPECTED_JSON_SHA:\n    raise RuntimeError(\n \
        \       f\"Phase 1B3 artifact SHA mismatch: expected={EXPECTED_JSON_SHA} actual={actual}\"\n    )\n\nd = json.loads(raw)\n\
        \nassert d[\"decision\"] == \"FREEZE_CORRECTED_PREREGISTRATION_NO_OUTCOMES_READ\"\nassert d[\"lineage\"][\"dlf_semantic_sha256\"\
        ] == EXPECTED_SEMANTIC_SHA\nassert d[\"lineage\"][\"dlf_structure_sha256\"] == EXPECTED_STRUCTURE_SHA\nassert d[\"\
        identity_reused_without_change\"][\"mapped_identity_sha256\"] == EXPECTED_IDENTITY_SHA\nassert d[\"corrected_feature_freeze\"\
        ][\"sha256\"] == EXPECTED_FEATURE_SHA\nassert d[\"firewalls\"][\"nfl_outcomes_read\"] is False\nassert d[\"firewalls\"\
        ][\"model_fit_performed\"] is False\nassert d[\"firewalls\"][\"outcome_based_feature_selection_performed\"] is False\n\
        assert d[\"firewalls\"][\"production_change_authorized\"] is False\n\nold = d[\"preregistration\"]\nassert old[\"\
        development_years\"] == [2018, 2019, 2020, 2021, 2022, 2023, 2024]\nassert old[\"sealed_outcome_years\"] == [2025,\
        \ 2026]\n\ncorrected = {\n    \"development_draft_years\": [2018, 2019, 2020, 2021, 2022, 2023],\n    \"development_required_stat_seasons\"\
        : [2018, 2019, 2020, 2021, 2022, 2023, 2024],\n    \"development_outer_validation\": \"leave one entire development\
        \ draft year out; 6 folds\",\n    \"sealed_temporal_confirmation\": {\n        \"draft_year\": 2024,\n        \"required_stat_seasons\"\
        : [2024, 2025],\n        \"rule\": (\n            \"2025 weekly outcome data must not be downloaded or opened unless\
        \ all \"\n            \"development gates have already passed. The 2024 cohort cannot select, \"\n            \"tune,\
        \ add, drop, or modify any feature, alpha, preprocessing rule, metric, \"\n            \"or threshold.\"\n       \
        \ ),\n        \"confirmation_gate\": \"2024 paired holdout pooled MAE must be lower than baseline pooled MAE\",\n\
        \    },\n    \"prospective_classes_not_evaluated_in_v1\": [2025, 2026],\n    \"positions\": old[\"positions\"],\n\
        \    \"primary_target\": old[\"primary_target\"],\n    \"primary_candidate_by_position\": old[\"primary_candidate_by_position\"\
        ],\n    \"candidate_implementation\": {\n        \"baseline\": (\n            \"Fit the exact frozen No-History/Rookie\
        \ V2 position baseline on all \"\n            \"canonical nflverse players of that position in the training draft\
        \ years.\"\n        ),\n        \"incremental_test\": (\n            \"DLF features may only model residual error\
        \ left by the frozen baseline. \"\n            \"They may not replace, reweight, or recalibrate the baseline.\"\n\
        \        ),\n        \"residual_target\": \"actual points_per_team_game minus baseline_prediction\",\n        \"ridge\"\
        : {\n            \"alpha\": 10.0,\n            \"fit_intercept\": False,\n            \"baseline_prediction_is_not_a_ridge_feature\"\
        : True,\n            \"candidate_prediction\": \"max(0, baseline_prediction + dlf_residual_correction)\",\n      \
        \  },\n        \"dlf_feature_preprocessing_training_fold_only\": [\n            \"for each frozen primary DLF feature,\
        \ compute missingness from the raw source value\",\n            \"median-impute numeric feature values using training\
        \ rows only\",\n            \"z-score imputed feature values using training-row mean and standard deviation\",\n \
        \           \"z-score each missingness indicator using training-row mean and standard deviation\",\n            \"\
        drop a transformed value or missingness column only when its training standard deviation is <= 1e-12\",\n        \
        \    \"apply the frozen training medians/means/standard deviations unchanged to held-out rows\",\n        ],\n   \
        \     \"ridge_solver\": (\n            \"beta = solve(X.T @ X + alpha * I, X.T @ residual); \"\n            \"if solve\
        \ is singular use Moore-Penrose pseudoinverse of the same penalized matrix\"\n        ),\n    },\n    \"metrics\"\
        : old[\"metrics\"],\n    \"paired_uncertainty\": old[\"paired_uncertainty\"],\n    \"development_success_gate_all_required\"\
        : [\n        \"development pooled MAE relative improvement >= 2.0%\",\n        \"development 95% paired-bootstrap\
        \ CI upper bound for candidate-minus-baseline absolute error < 0\",\n        \"candidate MAE lower than baseline in\
        \ at least 4 of 6 development held-out draft-year folds\",\n        \"no position development MAE worsens by more\
        \ than 5.0% relative\",\n        \"at least 2 of 4 positions improve development MAE\",\n    ],\n    \"final_v1_success_rule\"\
        : (\n        \"All development gates must pass first. Only then may the 2025 weekly stats \"\n        \"source be\
        \ opened to complete the sealed 2024 two-season outcome. Final V1 \"\n        \"historical confirmation additionally\
        \ requires 2024 pooled MAE lower than \"\n        \"the baseline pooled MAE.\"\n    ),\n    \"secondary_metrics_cannot_rescue_primary_failure\"\
        : True,\n    \"advanced_secondary_cannot_select_or_rescue_v1\": True,\n    \"selection_firewall\": old[\"selection_firewall\"\
        ],\n    \"deployment_rule\": old[\"deployment_rule\"],\n}\n\nresult = {\n    \"schema_version\": 1,\n    \"study_id\"\
        : \"dlf-prospect-fv-v1\",\n    \"phase\": \"1B4_temporal_leakage_and_implementation_freeze\",\n    \"decision\": \"\
        FREEZE_TEMPORALLY_CLEAN_PHASE1C_IMPLEMENTATION_NO_OUTCOMES_READ\",\n    \"generated_at_utc\": datetime.now(timezone.utc).isoformat(),\n\
        \    \"reason\": (\n        \"The prior preregistration simultaneously treated 2024 as a development \"\n        \"\
        draft class and sealed 2025 NFL outcomes, but a complete two-season 2024 \"\n        \"rookie target requires 2025\
        \ outcomes. This pre-outcome correction moves \"\n        \"2024 to a sealed temporal confirmation cohort and fixes\
        \ the exact additive \"\n        \"DLF residual-ridge implementation.\"\n    ),\n    \"lineage\": {\n        \"phase1b3_run_id\"\
        : int(os.environ[\"PHASE1B3_RUN_ID\"]),\n        \"phase1b3_artifact_id\": int(os.environ[\"PHASE1B3_ARTIFACT_ID\"\
        ]),\n        \"phase1b3_json_sha256\": EXPECTED_JSON_SHA,\n        \"dlf_semantic_sha256\": EXPECTED_SEMANTIC_SHA,\n\
        \        \"dlf_structure_sha256\": EXPECTED_STRUCTURE_SHA,\n        \"mapped_identity_sha256\": EXPECTED_IDENTITY_SHA,\n\
        \        \"corrected_feature_freeze_sha256\": EXPECTED_FEATURE_SHA,\n    },\n    \"identity_and_features_reused_without_change\"\
        : {\n        \"identity\": d[\"identity_reused_without_change\"],\n        \"corrected_feature_freeze\": d[\"corrected_feature_freeze\"\
        ],\n    },\n    \"corrected_preregistration\": corrected,\n    \"firewalls\": {\n        \"nfl_outcomes_read\": False,\n\
        \        \"nfl_2025_outcomes_read\": False,\n        \"model_fit_performed\": False,\n        \"outcome_based_feature_selection_performed\"\
        : False,\n        \"current_fv_read_for_selection\": False,\n        \"ktc_read\": False,\n        \"dlf_market_data_read\"\
        : False,\n        \"production_change_authorized\": False,\n    },\n}\n\nout_json = out_dir / \"dlf_prospect_fv_v1_phase1b4_temporal_implementation_freeze.json\"\
        \nout_md = out_dir / \"dlf_prospect_fv_v1_phase1b4_temporal_implementation_freeze.md\"\n\nout_json.write_text(json.dumps(result,\
        \ indent=2, sort_keys=True) + \"\\n\")\n\nmd = [\n    \"# DLF Prospect FV V1 \u2014 Phase 1B4 Temporal + Implementation\
        \ Freeze\",\n    \"\",\n    \"**Decision:** `FREEZE_TEMPORALLY_CLEAN_PHASE1C_IMPLEMENTATION_NO_OUTCOMES_READ`\",\n\
        \    \"\",\n    \"## Leakage correction\",\n    \"\",\n    \"- Development draft classes: **2018\u20132023**\",\n\
        \    \"- Development LOYO folds: **6**\",\n    \"- Sealed temporal confirmation draft class: **2024**\",\n    \"-\
        \ 2025 weekly outcomes stay unopened unless every development gate passes.\",\n    \"- 2025 and 2026 draft classes\
        \ are not evaluated in V1.\",\n    \"\",\n    \"This fixes a genuine contradiction in the prior preregistration: a\
        \ complete \"\n    \"two-season outcome for the 2024 rookie class requires 2025 NFL outcomes.\",\n    \"\",\n    \"\
        ## Candidate implementation\",\n    \"\",\n    \"The canonical No-History/Rookie V2 baseline is fit first. DLF features\
        \ are \"\n    \"then allowed only to predict the baseline residual. Ridge alpha is fixed at \"\n    \"**10**, there\
        \ is **no correction intercept**, and the baseline prediction \"\n    \"cannot be reweighted or recalibrated.\",\n\
        \    \"\",\n    \"Every DLF numeric feature and its missingness indicator is transformed using \"\n    \"training-fold\
        \ statistics only.\",\n    \"\",\n    \"## Development gates\",\n    \"\",\n]\nfor gate in corrected[\"development_success_gate_all_required\"\
        ]:\n    md.append(f\"- {gate}\")\n\nmd.extend([\n    \"\",\n    \"## Sealed 2024 confirmation\",\n    \"\",\n    \"\
        Only after all development gates pass may Phase 1C download 2025 weekly \"\n    \"outcomes. Final V1 historical confirmation\
        \ additionally requires the frozen \"\n    \"candidate to beat the baseline on pooled 2024-class MAE.\",\n    \"\"\
        ,\n    \"## Firewall\",\n    \"\",\n    \"No NFL outcomes or models were opened or fit in this correction. Identity\
        \ and \"\n    \"feature fingerprints are unchanged.\",\n])\n\nout_md.write_text(\"\\n\".join(md) + \"\\n\")\n\nprint(json.dumps({\n\
        \    \"decision\": result[\"decision\"],\n    \"development_draft_years\": corrected[\"development_draft_years\"],\n\
        \    \"development_folds\": 6,\n    \"sealed_confirmation_draft_year\": 2024,\n    \"prospective_classes\": corrected[\"\
        prospective_classes_not_evaluated_in_v1\"],\n    \"mapped_identity_sha256\": EXPECTED_IDENTITY_SHA,\n    \"feature_freeze_sha256\"\
        : EXPECTED_FEATURE_SHA,\n    \"outcomes_read\": False,\n    \"model_fit_performed\": False,\n}, indent=2))\nPY"
    - name: Prove no repository changes
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: Phase 1B4 is outcome-blind and repo-clean.'
    - name: Upload Phase 1B4 freeze
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1b4-temporal-implementation-freeze
        path: ${{ runner.temp }}/dlf-phase1b4/
        if-no-files-found: error
        retention-days: 14
