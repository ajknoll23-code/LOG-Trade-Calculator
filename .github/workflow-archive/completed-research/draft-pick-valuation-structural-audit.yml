name: Draft Pick Valuation Structural Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard clean repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f index.html
          test -f scripts/validation/repo_regression_checks.py

      - name: Build read-only draft-pick valuation audit
        shell: bash
        run: |
          set -euo pipefail

          OUT="/tmp/draft-pick-valuation-structural-audit"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          OUT = Path("/tmp/draft-pick-valuation-structural-audit")
          INDEX = ROOT / "index.html"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_head() -> str:
              return subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip()

          html = INDEX.read_text(encoding="utf-8")
          script_parts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )
          if not script_parts:
              raise RuntimeError("No inline JavaScript found in index.html")
          js = "\n".join(script_parts)

          # ------------------------------------------------------------
          # Source extraction helpers.
          #
          # V1 of this workflow incorrectly assumed obsolete helper names
          # (pickRoundBaseValue / futurePickYearDiscount).  The deployed
          # source now uses PICK_BASE, YEAR_DISCOUNT and pickValue().
          # This version extracts the exact current deployed declarations
          # and functions instead of reimplementing their values.
          # ------------------------------------------------------------
          def scan_balanced(text: str, open_idx: int, open_ch: str, close_ch: str) -> int:
              if open_idx < 0 or text[open_idx] != open_ch:
                  raise ValueError("scan_balanced start mismatch")

              depth = 0
              i = open_idx
              quote = None
              escaped = False
              line_comment = False
              block_comment = False

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      i += 1
                      continue

                  if ch == open_ch:
                      depth += 1
                  elif ch == close_ch:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1

              raise RuntimeError(
                  f"Unbalanced JavaScript {open_ch}{close_ch} from offset {open_idx}"
              )

          def extract_var_decl(text: str, name: str) -> str | None:
              m = re.search(
                  rf"\b(?:const|let|var)\s+{re.escape(name)}\s*=",
                  text,
              )
              if not m:
                  return None

              i = m.end()
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              p = b = c = 0

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                  elif ch == "(":
                      p += 1
                  elif ch == ")":
                      p -= 1
                  elif ch == "[":
                      b += 1
                  elif ch == "]":
                      b -= 1
                  elif ch == "{":
                      c += 1
                  elif ch == "}":
                      c -= 1
                  elif ch == ";" and p == 0 and b == 0 and c == 0:
                      return text[m.start():i + 1].strip()
                  i += 1

              return None

          def extract_function(text: str, name: str) -> str | None:
              m = re.search(
                  rf"\bfunction\s+{re.escape(name)}\s*\([^)]*\)\s*\{{",
                  text,
              )
              if not m:
                  return None
              brace = text.find("{", m.start())
              end = scan_balanced(text, brace, "{", "}")
              return text[m.start():end + 1].strip()

          required_vars = (
              "PICK_BASE",
              "YEAR_DISCOUNT",
              "PICK_ROUNDS",
              "PICK_SEASONS",
              "DRAFT_SLOT_APPLIES_TO_SEASON",
              "DRAFT_SLOT_LAST_UPDATED",
              "DRAFT_SLOT_PROJECTION",
          )
          required_functions = (
              "pickValue",
              "tierForPick",
              "pickSlotForSeason",
          )

          var_sources = {
              name: extract_var_decl(js, name)
              for name in required_vars
          }
          fn_sources = {
              name: extract_function(js, name)
              for name in required_functions
          }

          missing = [
              name for name, src in {**var_sources, **fn_sources}.items()
              if src is None
          ]
          if missing:
              raise RuntimeError(
                  "Could not extract current deployed draft-pick source element(s): "
                  + ", ".join(missing)
                  + ". This is an extractor/source-shape failure, not a scientific result."
              )

          # Preserve deployed source order in the Node harness.
          all_sources = list(var_sources.items()) + list(fn_sources.items())
          source_items = []
          for name, src in all_sources:
              pos = js.find(src)
              if pos < 0:
                  raise RuntimeError(f"Internal extractor drift locating {name}")
              source_items.append((pos, name, src))
          source_items.sort()

          harness = "\n\n".join(src for _, _, src in source_items)
          harness += r'''

          function auditSafe(fn) {
            try {
              const value = fn();
              if (typeof value === "number" && !Number.isFinite(value)) {
                return {__error: "non-finite"};
              }
              return value;
            } catch (e) {
              return {__error: String(e && e.message ? e.message : e)};
            }
          }

          const slots = ["early", "mid", "late"];
          const explicitRounds = Object.keys(PICK_BASE)
            .map(Number)
            .sort((a,b) => a-b);
          const explicitYears = Object.keys(YEAR_DISCOUNT)
            .map(String)
            .sort();

          const valueGrid = [];
          for (const year of explicitYears) {
            for (const round of explicitRounds) {
              for (const slot of slots) {
                valueGrid.push({
                  year,
                  round,
                  slot,
                  value: auditSafe(() => pickValue(round, slot, year)),
                  base: PICK_BASE[round][slot],
                  discount: YEAR_DISCOUNT[year],
                });
              }
            }
          }

          const currentAssignmentGrid = [];
          for (const season of PICK_SEASONS) {
            for (let rosterId = 1; rosterId <= 12; rosterId++) {
              const slot = auditSafe(
                () => pickSlotForSeason(rosterId, String(season))
              );
              currentAssignmentGrid.push({
                season: String(season),
                rosterId,
                slot,
                round1Value: (
                  typeof slot === "string"
                    ? auditSafe(() => pickValue(1, slot, String(season)))
                    : null
                ),
              });
            }
          }

          const directProjection = {};
          for (const [k,v] of Object.entries(DRAFT_SLOT_PROJECTION)) {
            directProjection[String(k)] = v;
          }

          const auditOutput = {
            PICK_BASE,
            YEAR_DISCOUNT,
            PICK_ROUNDS,
            PICK_SEASONS,
            DRAFT_SLOT_APPLIES_TO_SEASON,
            DRAFT_SLOT_LAST_UPDATED,
            DRAFT_SLOT_PROJECTION: directProjection,
            valueGrid,
            currentAssignmentGrid,
            fallbackChecks: {
              unknownRound: auditSafe(
                () => pickValue(999, "late", explicitYears[0])
              ),
              unknownSlot: auditSafe(
                () => pickValue(explicitRounds[0], "unknown-slot", explicitYears[0])
              ),
              unknownYear: auditSafe(
                () => pickValue(explicitRounds[0], "mid", "9999")
              ),
              unknownRosterCurrentSeason: auditSafe(
                () => pickSlotForSeason(9999, String(DRAFT_SLOT_APPLIES_TO_SEASON))
              ),
              farFutureSeason: auditSafe(
                () => pickSlotForSeason(1, "9999")
              ),
            },
          };

          process.stdout.write(JSON.stringify(auditOutput));
          '''

          harness_path = OUT / "deployed_pick_source_harness.js"
          harness_path.write_text(harness + "\n", encoding="utf-8")

          node = subprocess.run(
              ["node", str(harness_path)],
              text=True,
              capture_output=True,
          )
          if node.returncode != 0:
              raise RuntimeError(
                  "Exact deployed draft-pick source evaluation failed.\n"
                  f"STDOUT:\n{node.stdout}\nSTDERR:\n{node.stderr}"
              )

          try:
              e = json.loads(node.stdout)
          except json.JSONDecodeError as exc:
              raise RuntimeError(
                  "Node harness returned non-JSON output:\n"
                  + node.stdout[:2000]
              ) from exc

          # ---------- Contract/type validation ----------
          pick_base = e["PICK_BASE"]
          year_discount = e["YEAR_DISCOUNT"]
          pick_rounds = [int(x) for x in e["PICK_ROUNDS"]]
          pick_seasons = [str(x) for x in e["PICK_SEASONS"]]
          slot_projection = {
              str(k): str(v)
              for k, v in e["DRAFT_SLOT_PROJECTION"].items()
          }

          expected_slots = ("early", "mid", "late")
          explicit_rounds = sorted(int(k) for k in pick_base.keys())
          explicit_years = sorted(str(k) for k in year_discount.keys())

          if sorted(pick_rounds) != explicit_rounds:
              raise RuntimeError(
                  f"PICK_ROUNDS {pick_rounds} does not match explicit PICK_BASE "
                  f"rounds {explicit_rounds}"
              )

          for rnd in explicit_rounds:
              row = pick_base[str(rnd)]
              if not all(slot in row for slot in expected_slots):
                  raise RuntimeError(
                      f"PICK_BASE round {rnd} is missing early/mid/late"
                  )

          # ---------- Structural analysis ----------
          value_grid = e["valueGrid"]

          # Verify exact deployed Math.round result against extracted constants.
          reproduction_failures = []
          for row in value_grid:
              expected = math.floor(
                  float(row["base"]) * float(row["discount"]) + 0.5
              )
              if int(row["value"]) != expected:
                  reproduction_failures.append({
                      "row": row,
                      "python_positive_round": expected,
                  })

          # Slot ordering should not perversely improve as projected slot worsens.
          slot_monotonicity_violations = []
          for year in explicit_years:
              for rnd in explicit_rounds:
                  rows = [
                      r for r in value_grid
                      if r["year"] == year and int(r["round"]) == rnd
                  ]
                  by_slot = {r["slot"]: int(r["value"]) for r in rows}
                  if not (
                      by_slot["early"] >= by_slot["mid"] >= by_slot["late"]
                  ):
                      slot_monotonicity_violations.append({
                          "year": year,
                          "round": rnd,
                          "values": by_slot,
                      })

          # Round ordering within a fixed year/slot.
          round_monotonicity_violations = []
          for year in explicit_years:
              for slot in expected_slots:
                  vals = [
                      (
                          rnd,
                          next(
                              int(r["value"])
                              for r in value_grid
                              if r["year"] == year
                              and int(r["round"]) == rnd
                              and r["slot"] == slot
                          ),
                      )
                      for rnd in explicit_rounds
                  ]
                  for (r1, v1), (r2, v2) in zip(vals, vals[1:]):
                      if v2 > v1:
                          round_monotonicity_violations.append({
                              "year": year,
                              "slot": slot,
                              "earlier_round": r1,
                              "earlier_value": v1,
                              "later_round": r2,
                              "later_value": v2,
                          })

          # Year ordering within a fixed round/slot, based on explicit
          # YEAR_DISCOUNT insertion-independent sorted labels.
          year_order = sorted(
              explicit_years,
              key=lambda y: (-float(year_discount[y]), y),
          )
          year_monotonicity_violations = []
          for rnd in explicit_rounds:
              for slot in expected_slots:
                  vals = [
                      (
                          year,
                          next(
                              int(r["value"])
                              for r in value_grid
                              if r["year"] == year
                              and int(r["round"]) == rnd
                              and r["slot"] == slot
                          ),
                      )
                      for year in year_order
                  ]
                  for (y1, v1), (y2, v2) in zip(vals, vals[1:]):
                      if v2 > v1:
                          year_monotonicity_violations.append({
                              "nearer_or_higher_discount_year": y1,
                              "value_1": v1,
                              "farther_or_lower_discount_year": y2,
                              "value_2": v2,
                              "round": rnd,
                              "slot": slot,
                          })

          # Slot gradients and early/late spreads.
          slot_spreads = []
          for year in explicit_years:
              for rnd in explicit_rounds:
                  by_slot = {
                      r["slot"]: int(r["value"])
                      for r in value_grid
                      if r["year"] == year and int(r["round"]) == rnd
                  }
                  early = by_slot["early"]
                  mid = by_slot["mid"]
                  late = by_slot["late"]
                  slot_spreads.append({
                      "year": year,
                      "round": rnd,
                      "early": early,
                      "mid": mid,
                      "late": late,
                      "early_minus_mid": early - mid,
                      "mid_minus_late": mid - late,
                      "early_minus_late": early - late,
                      "early_over_mid": early / mid if mid else None,
                      "mid_over_late": mid / late if late else None,
                      "early_over_late": early / late if late else None,
                  })

          # Current slot-projection bake state.
          projection_values = list(slot_projection.values())
          projection_unique_tiers = sorted(set(projection_values))
          projection_all_mid = (
              bool(projection_values)
              and all(v == "mid" for v in projection_values)
          )
          projection_roster_count = len(slot_projection)
          current_assignments = e["currentAssignmentGrid"]

          assignment_tiers_by_season = {}
          for season in pick_seasons:
              tiers = sorted({
                  str(r["slot"])
                  for r in current_assignments
                  if str(r["season"]) == season
              })
              assignment_tiers_by_season[season] = tiers

          # Find raw-value collisions over explicitly modeled round/slot/year grid.
          collisions = {}
          for row in value_grid:
              collisions.setdefault(int(row["value"]), []).append({
                  "year": row["year"],
                  "round": int(row["round"]),
                  "slot": row["slot"],
              })
          collision_groups = [
              {
                  "value": value,
                  "combinations": combos,
                  "combination_count": len(combos),
              }
              for value, combos in sorted(collisions.items(), reverse=True)
              if len(combos) > 1
          ]

          # Adjacent slot equality flags where early=mid or mid=late.
          slot_equalities = []
          for s in slot_spreads:
              if s["early"] == s["mid"]:
                  slot_equalities.append({
                      "year": s["year"],
                      "round": s["round"],
                      "slots": "early=mid",
                      "value": s["early"],
                  })
              if s["mid"] == s["late"]:
                  slot_equalities.append({
                      "year": s["year"],
                      "round": s["round"],
                      "slots": "mid=late",
                      "value": s["mid"],
                  })

          # Search comments near deployed constants only to document lineage
          # claims already present in production source. We do not query KTC.
          pick_base_pos = js.find(var_sources["PICK_BASE"])
          year_discount_pos = js.find(var_sources["YEAR_DISCOUNT"])
          lineage_context = js[
              max(0, min(pick_base_pos, year_discount_pos) - 2200):
              min(len(js), max(pick_base_pos, year_discount_pos) + 1800)
          ]
          deployed_source_mentions_ktc_lineage = (
              "KTC" in lineage_context or "KeepTradeCut" in lineage_context
          )
          deployed_source_marks_extrapolation = (
              "extrapolat" in lineage_context.lower()
          )

          findings = {
              "formula_supports_slot_specific_values": any(
                  (
                      s["early"] != s["mid"]
                      or s["mid"] != s["late"]
                  )
                  for s in slot_spreads
              ),
              "current_projection_all_mid": projection_all_mid,
              "current_projection_roster_count": projection_roster_count,
              "current_projection_unique_tiers": projection_unique_tiers,
              "draft_slot_last_updated": e["DRAFT_SLOT_LAST_UPDATED"],
              "draft_slot_applies_to_season": str(
                  e["DRAFT_SLOT_APPLIES_TO_SEASON"]
              ),
              "assignment_tiers_by_tradeable_season": assignment_tiers_by_season,
              "current_live_assignments_effectively_use_one_slot_tier": all(
                  len(v) == 1
                  for v in assignment_tiers_by_season.values()
              ),
              "explicit_round_count": len(explicit_rounds),
              "explicit_year_discount_count": len(explicit_years),
              "slot_monotonicity_pass": not slot_monotonicity_violations,
              "round_monotonicity_pass": not round_monotonicity_violations,
              "year_monotonicity_pass": not year_monotonicity_violations,
              "exact_formula_reproduction_pass": not reproduction_failures,
              "deployed_source_mentions_ktc_lineage": deployed_source_mentions_ktc_lineage,
              "deployed_source_marks_some_values_extrapolated": deployed_source_marks_extrapolation,
          }

          report = {
              "schema_version": 2,
              "study_id": "draft-pick-valuation-structural-audit-v2",
              "status": "read_only_deployed_draft_pick_architecture_audit",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "git_sha": git_head(),
              "research_only": True,
              "read_only": True,
              "fresh_external_ktc_data_queried": False,
              "market_value_pipeline_read": False,
              "package_vote_data_read": False,
              "production_v2_phase9_read": False,
              "2026_realized_rookie_outcomes_read": False,
              "candidate_fit_performed": False,
              "candidate_selected": False,
              "draft_pick_formula_changed": False,
              "production_change_authorized": False,
              "source_sha256": {
                  "index_html": sha256(INDEX),
              },
              "deployed_source_lineage_note": (
                  "No external KTC data were queried by this audit. "
                  "The deployed index.html comments themselves describe KTC "
                  "lineage for portions of PICK_BASE/YEAR_DISCOUNT and mark "
                  "some farther-round/year values as extrapolated."
                  if deployed_source_mentions_ktc_lineage
                  else
                  "No external KTC data were queried by this audit."
              ),
              "exact_deployed_sources": {
                  **{
                      name: {
                          "sha256": hashlib.sha256(
                              src.encode("utf-8")
                          ).hexdigest(),
                          "source": src,
                      }
                      for name, src in var_sources.items()
                  },
                  **{
                      name: {
                          "sha256": hashlib.sha256(
                              src.encode("utf-8")
                          ).hexdigest(),
                          "source": src,
                      }
                      for name, src in fn_sources.items()
                  },
              },
              "deployed_lineage_context": lineage_context,
              "constants": {
                  "PICK_BASE": pick_base,
                  "YEAR_DISCOUNT": year_discount,
                  "PICK_ROUNDS": pick_rounds,
                  "PICK_SEASONS": pick_seasons,
                  "DRAFT_SLOT_APPLIES_TO_SEASON": str(
                      e["DRAFT_SLOT_APPLIES_TO_SEASON"]
                  ),
                  "DRAFT_SLOT_LAST_UPDATED": e["DRAFT_SLOT_LAST_UPDATED"],
                  "DRAFT_SLOT_PROJECTION": slot_projection,
              },
              "value_grid": value_grid,
              "slot_spreads": slot_spreads,
              "current_assignment_grid": current_assignments,
              "fallback_checks": e["fallbackChecks"],
              "collision_groups": collision_groups,
              "slot_equalities": slot_equalities,
              "violations": {
                  "formula_reproduction": reproduction_failures,
                  "slot_monotonicity": slot_monotonicity_violations,
                  "round_monotonicity": round_monotonicity_violations,
                  "year_monotonicity": year_monotonicity_violations,
              },
              "findings": findings,
              "interpretation_guardrail": (
                  "This is a structural audit of the deployed implementation. "
                  "It does not establish that any slot gradient, round curve, "
                  "future-year discount, or extrapolated value is empirically "
                  "optimal. No candidate was fit or selected."
              ),
              "next_research_if_warranted": (
                  "If a material architecture issue remains after inspecting "
                  "these results, freeze a separate historical rookie-outcome "
                  "preregistration before estimating any replacement slot, "
                  "round, or future-year curve."
              ),
          }

          json_path = OUT / "draft_pick_valuation_structural_audit_v2.json"
          json_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          def fmt(v, digits=4):
              if v is None:
                  return "null"
              if isinstance(v, bool):
                  return "yes" if v else "no"
              if isinstance(v, int):
                  return str(v)
              if isinstance(v, float):
                  return f"{v:.{digits}f}"
              return str(v)

          lines = [
              "# Draft Pick Valuation Structural Audit V2",
              "",
              "**Status:** read-only deployed-architecture audit",
              "",
              "This run uses the exact current `PICK_BASE`, `YEAR_DISCOUNT`, "
              "`pickValue()`, and draft-slot assignment helpers extracted from "
              "`index.html`. It does not query fresh KTC data, read package "
              "votes, read Production V2 Phase 9, read 2026 realized rookie "
              "outcomes, fit a candidate, or authorize a production change.",
              "",
              "## Exact deployed formula",
              "",
              "```javascript",
              fn_sources["pickValue"],
              "```",
              "",
              "## Deployed round/slot base values",
              "",
              "| Round | Early | Mid | Late |",
              "|---:|---:|---:|---:|",
          ]

          for rnd in explicit_rounds:
              row = pick_base[str(rnd)]
              lines.append(
                  f"| {rnd} | {fmt(float(row['early']), 0)} | "
                  f"{fmt(float(row['mid']), 0)} | "
                  f"{fmt(float(row['late']), 0)} |"
              )

          lines += [
              "",
              "## Future-year discounts",
              "",
              "| Year | Discount |",
              "|---:|---:|",
          ]
          for year in explicit_years:
              lines.append(
                  f"| {year} | {fmt(float(year_discount[year]), 4)} |"
              )

          lines += [
              "",
              "## Current slot-projection state",
              "",
              f"- Slot-sensitive numeric formula exists: "
              f"**{'YES' if findings['formula_supports_slot_specific_values'] else 'NO'}**.",
              f"- `DRAFT_SLOT_APPLIES_TO_SEASON`: "
              f"**{findings['draft_slot_applies_to_season']}**.",
              f"- `DRAFT_SLOT_LAST_UPDATED`: "
              f"**{fmt(findings['draft_slot_last_updated'])}**.",
              f"- Rosters in `DRAFT_SLOT_PROJECTION`: "
              f"**{findings['current_projection_roster_count']}**.",
              f"- Unique baked projection tiers: "
              f"**{', '.join(findings['current_projection_unique_tiers']) or 'none'}**.",
              f"- Every baked projection currently `mid`: "
              f"**{'YES' if findings['current_projection_all_mid'] else 'NO'}**.",
              "",
              "Tradeable-season assignment tiers actually returned by "
              "`pickSlotForSeason()`:",
              "",
              "| Season | Returned tiers across roster IDs 1-12 |",
              "|---:|---|",
          ]

          for season in pick_seasons:
              tiers = findings["assignment_tiers_by_tradeable_season"][season]
              lines.append(f"| {season} | {', '.join(tiers)} |")

          lines += [
              "",
              "## Structural invariant checks",
              "",
              f"- Exact `Math.round(base × discount)` reproduction: "
              f"**{'PASS' if findings['exact_formula_reproduction_pass'] else 'FAIL'}**.",
              f"- Early ≥ mid ≥ late in every explicit round/year cell: "
              f"**{'PASS' if findings['slot_monotonicity_pass'] else 'FAIL'}**.",
              f"- Earlier round ≥ later round for fixed slot/year: "
              f"**{'PASS' if findings['round_monotonicity_pass'] else 'FAIL'}**.",
              f"- Higher-discount year ≥ lower-discount year for fixed round/slot: "
              f"**{'PASS' if findings['year_monotonicity_pass'] else 'FAIL'}**.",
              "",
              "## Slot spreads at the undiscounted explicit year",
              "",
          ]

          undiscounted_year = max(
              explicit_years,
              key=lambda y: float(year_discount[y]),
          )
          lines += [
              f"Using **{undiscounted_year}** because it has the highest "
              "explicit year multiplier:",
              "",
              "| Round | Early | Mid | Late | Early/Mid | Early/Late |",
              "|---:|---:|---:|---:|---:|---:|",
          ]
          for s in slot_spreads:
              if s["year"] != undiscounted_year:
                  continue
              lines.append(
                  f"| {s['round']} | {s['early']} | {s['mid']} | {s['late']} | "
                  f"{fmt(s['early_over_mid'], 4)} | "
                  f"{fmt(s['early_over_late'], 4)} |"
              )

          lines += [
              "",
              "## Source-lineage warning",
              "",
              (
                  "The deployed source comments themselves describe KTC lineage "
                  "for part of the draft-pick constants. This audit does **not** "
                  "query KTC or treat it as an outcome target; it is reporting "
                  "the provenance already embedded in production."
                  if deployed_source_mentions_ktc_lineage
                  else
                  "No fresh external market source was queried by this audit."
              ),
              "",
              (
                  "The deployed source also marks at least some draft-pick "
                  "constants as extrapolated rather than directly benchmarked."
                  if deployed_source_marks_extrapolation
                  else
                  ""
              ),
              "",
              "## Guardrail",
              "",
              "These results describe the deployed architecture only. They do "
              "not justify changing pick values. Any replacement slot curve, "
              "round curve, class-strength factor, or future-year discount must "
              "be studied separately under a frozen design.",
              "",
          ]

          md = "\n".join(lines)
          md_path = OUT / "draft_pick_valuation_structural_audit_v2.md"
          md_path.write_text(md + "\n", encoding="utf-8")

          summary_path = Path(
              os.environ.get(
                  "GITHUB_STEP_SUMMARY",
                  "/tmp/draft-pick-audit-summary.md",
              )
          )
          with summary_path.open("a", encoding="utf-8") as f:
              f.write(md + "\n")

          print(md)
          PY

      - name: Validate scientific and architecture contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "/tmp/draft-pick-valuation-structural-audit/"
              "draft_pick_valuation_structural_audit_v2.json"
          )
          r = json.loads(p.read_text())

          assert r["schema_version"] == 2
          assert r["status"] == "read_only_deployed_draft_pick_architecture_audit"
          assert r["research_only"] is True
          assert r["read_only"] is True
          assert r["fresh_external_ktc_data_queried"] is False
          assert r["market_value_pipeline_read"] is False
          assert r["package_vote_data_read"] is False
          assert r["production_v2_phase9_read"] is False
          assert r["2026_realized_rookie_outcomes_read"] is False
          assert r["candidate_fit_performed"] is False
          assert r["candidate_selected"] is False
          assert r["draft_pick_formula_changed"] is False
          assert r["production_change_authorized"] is False

          src = r["exact_deployed_sources"]
          for name in (
              "PICK_BASE",
              "YEAR_DISCOUNT",
              "PICK_ROUNDS",
              "PICK_SEASONS",
              "DRAFT_SLOT_APPLIES_TO_SEASON",
              "DRAFT_SLOT_LAST_UPDATED",
              "DRAFT_SLOT_PROJECTION",
              "pickValue",
              "tierForPick",
              "pickSlotForSeason",
          ):
              assert name in src
              assert src[name]["source"]
              assert len(src[name]["sha256"]) == 64

          f = r["findings"]
          assert f["exact_formula_reproduction_pass"] is True
          assert f["slot_monotonicity_pass"] is True
          assert f["round_monotonicity_pass"] is True
          assert f["year_monotonicity_pass"] is True

          assert r["constants"]["PICK_ROUNDS"]
          assert r["constants"]["PICK_SEASONS"]
          assert r["value_grid"]

          print(
              "PASS: exact deployed draft-pick implementation was extracted, "
              "evaluated, and audited without fitting or production mutation."
          )
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests
          python3 scripts/validation/repo_regression_checks.py

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-pick-valuation-structural-audit-v2
          path: /tmp/draft-pick-valuation-structural-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Prove repository stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: draft-pick valuation audit made no repository changes."
