name: Identity V2 Phase 3 Independent Corroboration Freeze - Scope Fix V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  identity-v2-phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard clean tree and freeze production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"

          sha256sum index.html > "${RUNNER_TEMP}/production.sha256"
          sha256sum scripts/identity_crosswalk.json > "${RUNNER_TEMP}/crosswalk.sha256"
          if test -f free-agent-board.html; then
            sha256sum free-agent-board.html >> "${RUNNER_TEMP}/production.sha256"
          fi

          sha256sum \
            research/identity-v2/identity_v2_phase2_manual_adjudication.json \
            research/identity-v2/identity_v2_phase2_manual_adjudication.md \
            research/identity-v2/identity_v2_phase2_manifest.json \
            > "${RUNNER_TEMP}/phase2.sha256"

      - name: Preflight repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Freeze independent corroboration evidence
        shell: bash
        run: |
          set -euo pipefail

          cat > research/identity-v2/identity_v2_phase3_external_evidence.json <<'JSON'
