# PREFLIGHTED: B29_V3_RECOVERY_FROM_NEAR_COMPLETE_SHARDED_RUN_NO_SCIENCE_CHANGE
name: B29 Draft Capital Outlook V3 - Recovery Finalize Historical Enumeration

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B29_SOURCE_RUN_ID: "36817635473"
  B29_SOURCE_HEAD_SHA: "9f453035124a48f94c7c5cc6671379281db59e35"

jobs:
  inspect_recovery_checkpoint:
    name: Identify only missing B29 evaluation buckets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.inspect.outputs.matrix }}
      missing_count: ${{ steps.inspect.outputs.missing_count }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Guard B28 authority and absence of committed B29
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          b28=json.loads(Path("research/draft-capital-outlook-v3/b28/b28_manifest.json").read_text())
          assert b28["decision"]=="PASS_B28_INSTRUMENT_VALIDATION_AUTHORIZE_B29_HISTORICAL_SOURCE_AUDIT"
          assert b28["b29_historical_source_audit_authorized"] is True
          assert b28["historical_candidate_enumeration_authorized"] is True
          assert b28["2027_candidate_enumeration_authorized"] is False
          assert b28["historical_actual_capital_open_authorized"] is False
          assert b28["predictor_target_association_authorized"] is False
          assert not Path("research/draft-capital-outlook-v3/b29").exists(), "B29 already committed; recovery must not overwrite it."
          print("PASS: B29 recovery is authorized and no committed B29 exists.")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: b29-contract-v2
          path: /tmp/contract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          pattern: b29-candidates-*
          path: /tmp/candidates
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          pattern: b29-eval-*
          path: /tmp/evals
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - name: Verify checkpoint and emit missing matrix
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          C=Path("/tmp/contract/b29_execution_contract.json")
          S=Path("/tmp/contract/b29_scanner.py")
          H=Path("/tmp/contract/b29_execution_contract.sha256")
          assert C.is_file() and S.is_file() and H.is_file()

          expected_hash=H.read_text().split()[0]
          actual_hash=hashlib.sha256(C.read_bytes()).hexdigest()
          assert actual_hash==expected_hash,(actual_hash,expected_hash)

          c=json.loads(C.read_text())
          assert c["historical_years"]==list(range(2013,2027))
          assert c["operational_sharding"]["evaluation_bucket_count"]==32
          assert c["operational_sharding"]["scientific_semantics_changed"] is False
          assert c["2027_enumeration_authorized"] is False
          assert c["historical_actual_capital_open_authorized"] is False
          assert c["predictor_target_association_authorized"] is False

          candidate_files=sorted(Path("/tmp/candidates").glob("candidates_*.json"))
          assert len(candidate_files)==14,len(candidate_files)
          candidate_years=sorted(int(p.stem.split("_")[1]) for p in candidate_files)
          assert candidate_years==list(range(2013,2027)),candidate_years

          present={p.name for p in Path("/tmp/evals").glob("eval_*.json")}
          expected=[f"eval_{y}_{b}.json" for y in range(2013,2027) for b in range(32)]
          missing=[x for x in expected if x not in present]

          # The near-complete source run should contain 445/448 evaluation artifacts.
          assert len(present)==445,len(present)
          assert len(missing)==3,missing

          include=[]
          for name in missing:
              _,year,bucket=name[:-5].split("_")
              include.append({"year":int(year),"bucket":int(bucket)})

          matrix={"include":include}
          out=Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write("matrix="+json.dumps(matrix,separators=(",",":"))+"\n")
              f.write("missing_count="+str(len(include))+"\n")

          print(json.dumps({
              "source_run_id":36817635473,
              "source_head_sha":"9f453035124a48f94c7c5cc6671379281db59e35",
              "candidate_manifests":len(candidate_files),
              "completed_eval_artifacts":len(present),
              "missing":include,
              "contract_sha256":actual_hash,
              "scanner_sha256":hashlib.sha256(S.read_bytes()).hexdigest(),
          },indent=2))
          PY

  recover_missing_evaluations:
    name: Recover B29 Y${{ matrix.year }} B${{ matrix.bucket }}
    needs: inspect_recovery_checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inspect_recovery_checkpoint.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - uses: actions/download-artifact@v4
        with:
          name: b29-contract-v2
          path: /tmp/contract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          name: b29-candidates-${{ matrix.year }}
          path: /tmp/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - name: Re-run exactly one missing deterministic bucket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery
          python3 /tmp/contract/b29_scanner.py             --phase evaluate             --year "${{ matrix.year }}"             --bucket "${{ matrix.bucket }}"             --bucket-count 32             --candidate-manifest "/tmp/candidate/candidates_${{ matrix.year }}.json"             --contract /tmp/contract/b29_execution_contract.json             --output "/tmp/recovery/eval_${{ matrix.year }}_${{ matrix.bucket }}.json"

      - name: Validate recovery bucket firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          y=int(os.environ["YEAR"]); b=int(os.environ["BUCKET"])
          p=Path(f"/tmp/recovery/eval_{y}_{b}.json")
          assert p.is_file(),p
          j=json.loads(p.read_text())
          assert j["class_year"]==y
          assert j["bucket"]==b
          assert j["bucket_count"]==32
          assert j["2027_source_enumerated"] is False
          assert j["player_names_extracted"] is False
          assert j["player_positions_extracted"] is False
          assert j["historical_actual_capital_loaded"] is False
          assert j["predictor_target_association_computed"] is False
          assert j["production_change_authorized"] is False
          print({"year":y,"bucket":b,"rows":len(j["page_rows"])})
          PY
        env:
          YEAR: "${{ matrix.year }}"
          BUCKET: "${{ matrix.bucket }}"

      - uses: actions/upload-artifact@v4
        with:
          name: b29-recovery-eval-${{ matrix.year }}-${{ matrix.bucket }}
          path: /tmp/recovery/
          if-no-files-found: error
          retention-days: 7

  finalize_recovered_b29:
    name: Reconstruct all years, reduce K-N, and commit B29
    needs: [inspect_recovery_checkpoint, recover_missing_evaluations]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - uses: actions/download-artifact@v4
        with:
          name: b29-contract-v2
          path: /tmp/contract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          pattern: b29-candidates-*
          path: /tmp/candidates
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          pattern: b29-eval-*
          path: /tmp/evals
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          pattern: b29-recovery-eval-*
          path: /tmp/evals
          merge-multiple: true

      - name: Reconstruct exact 14 historical year results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/year-results
          python3 - <<'PY'
          import datetime as dt,hashlib,json
          from collections import defaultdict
          from pathlib import Path

          C=Path("/tmp/contract/b29_execution_contract.json")
          contract=json.loads(C.read_text())
          contract_sha=hashlib.sha256(C.read_bytes()).hexdigest()
          expected_sha=Path("/tmp/contract/b29_execution_contract.sha256").read_text().split()[0]
          assert contract_sha==expected_sha
          assert contract["operational_sharding"]["scientific_semantics_changed"] is False
          assert contract["2027_enumeration_authorized"] is False

          all_eval=list(Path("/tmp/evals").glob("eval_*.json"))
          names=[p.name for p in all_eval]
          assert len(names)==len(set(names))==448,(len(names),len(set(names)))

          def max_independent(rows,k,anchor):
              qual=[r for r in rows if r.get(f"qualifies_K{k}") and r.get("author") and r.get("canonical_domain")]
              best={}
              for r in qual:
                  key=(r["canonical_domain"].lower(),r["author"].strip().casefold())
                  sk=(abs((dt.date.fromisoformat(r["publication_date"])-anchor).days),r["publication_date"],key[0],key[1],r["url"])
                  if key not in best or sk<best[key][0]:
                      best[key]=(sk,r)
              by=defaultdict(list)
              for _,r in sorted(best.values(),key=lambda x:x[0]):
                  by[r["canonical_domain"].lower()].append(r)
              for d in by:
                  by[d].sort(key=lambda r:(abs((dt.date.fromisoformat(r["publication_date"])-anchor).days),r["publication_date"],r["author"].casefold(),r["url"]))
              ma={}
              def dfs(d,seen):
                  for r in by.get(d,[]):
                      a=r["author"].strip().casefold()
                      if a in seen:
                          continue
                      seen.add(a)
                      if a not in ma or dfs(ma[a]["canonical_domain"].lower(),seen):
                          ma[a]=r
                          return True
                  return False
              for d in sorted(by):
                  dfs(d,set())
              return sorted(ma.values(),key=lambda r:(abs((dt.date.fromisoformat(r["publication_date"])-anchor).days),r["publication_date"],r["canonical_domain"].lower(),r["author"].casefold(),r["url"]))

          for year in contract["historical_years"]:
              anchor=dt.date(year-1,9,30)
              mp=Path(f"/tmp/candidates/candidates_{year}.json")
              assert mp.is_file(),mp
              manifest=json.loads(mp.read_text())
              assert manifest["class_year"]==year
              assert manifest["evaluation_bucket_count"]==32

              files=sorted(Path("/tmp/evals").glob(f"eval_{year}_*.json"),key=lambda p:int(p.stem.rsplit("_",1)[1]))
              assert len(files)==32,(year,len(files))
              assert [int(p.stem.rsplit("_",1)[1]) for p in files]==list(range(32))

              rows=[]; covered=[]
              for p in files:
                  j=json.loads(p.read_text())
                  assert j["class_year"]==year
                  assert j["bucket_count"]==32
                  assert j["2027_source_enumerated"] is False
                  assert j["historical_actual_capital_loaded"] is False
                  assert j["predictor_target_association_computed"] is False
                  rows.extend(j["page_rows"])
                  covered.extend(j["assigned_indices"])

              expected=list(range(len(manifest["candidates"])))
              assert sorted(covered)==expected,(year,len(covered),len(expected))
              rows.sort(key=lambda r:r["global_index"])
              assert [r["global_index"] for r in rows]==expected

              sel32=max_independent(rows,32,anchor)
              sel60=max_independent(rows,60,anchor)
              unresolved=(
                  any(r.get("unmeasurable") for r in rows)
                  or manifest["candidate_cap_truncated"]
                  or any(x["truncated"] for x in manifest["channel_status"])
              )

              out={
                "schema_version":2,
                "study_id":"draft-capital-outlook-v3",
                "stage":"b29_year_source_only_enumeration",
                "class_year":year,
                "anchor_date":anchor.isoformat(),
                "candidate_url_count_total":manifest["candidate_url_count_total"],
                "candidate_url_count_evaluated":len(manifest["candidates"]),
                "candidate_cap_truncated":manifest["candidate_cap_truncated"],
                "channel_status":manifest["channel_status"],
                "transport_warning_count":sum(len(x["errors"]) for x in manifest["channel_status"]),
                "page_rows":rows,
                "independent_qualifying_count_K32":len(sel32),
                "independent_qualifying_count_K60":len(sel60),
                "selected_independent_K32":[{k:r[k] for k in ("url","canonical_domain","author","publication_date")} for r in sel32],
                "selected_independent_K60":[{k:r[k] for k in ("url","canonical_domain","author","publication_date")} for r in sel60],
                "unresolved_measurement_or_truncation":unresolved,
                "player_names_extracted":False,
                "player_positions_extracted":False,
                "historical_actual_capital_loaded":False,
                "predictor_target_association_computed":False,
                "2027_source_enumerated":False,
                "2027_class_scored":False,
                "production_change_authorized":False
              }
              Path(f"/tmp/year-results/b29_{year}.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
              print({"year":year,"K60":len(sel60),"K32":len(sel32),"unresolved":unresolved})

          print("PASS: reconstructed all 14 historical years from exactly 448 deterministic evaluation buckets.")
          PY

      - name: Apply frozen availability-only K-N reducer
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v3/b29
          mkdir -p research/draft-capital-outlook-v3/b29/years

          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v3/b29")
          C=Path("/tmp/contract/b29_execution_contract.json")
          contract=json.loads(C.read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          years=[]
          for y in contract["historical_years"]:
              p=Path(f"/tmp/year-results/b29_{y}.json")
              assert p.is_file(),p
              j=json.loads(p.read_text())
              assert j["class_year"]==y
              assert j["2027_source_enumerated"] is False
              assert j["historical_actual_capital_loaded"] is False
              assert j["predictor_target_association_computed"] is False
              years.append(j)
              shutil.copy2(p,O/"years"/p.name)

          shutil.copy2(C,O/"b29_execution_contract.json")
          shutil.copy2("/tmp/contract/b29_execution_contract.sha256",O/"b29_execution_contract.sha256")

          minc=int(contract["minimum_historical_classes_required"])
          counts={32:{},60:{}}
          unresolved={32:[],60:[]}
          for k in (60,32):
              for j in years:
                  c=int(j[f"independent_qualifying_count_K{k}"])
                  counts[k][j["class_year"]]=c
                  if j["unresolved_measurement_or_truncation"] and c<5:
                      unresolved[k].append(j["class_year"])

          support=lambda k,n: sorted(y for y,c in counts[k].items() if c>=n)

          selected_k=None
          selected_n=None
          k_status={}
          n_status={}
          decision=None

          for k in contract["candidate_K"]:
              confirmed=support(k,3)
              possible=sorted(y for y in unresolved[k] if y not in confirmed)
              if len(confirmed)>=minc:
                  k_status[k]={"status":"SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":possible}
                  selected_k=k
                  break
              if len(confirmed)+len(possible)>=minc:
                  k_status[k]={"status":"INCONCLUSIVE","confirmed_classes":confirmed,"unresolved_possible_classes":possible}
                  break
              k_status[k]={"status":"NOT_SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":possible}

          if selected_k is None:
              decision=(
                  "INCONCLUSIVE_B29_HISTORICAL_ENUMERATION_REQUIRES_TRANSPORT_OR_TEMPLATE_COMPLETION"
                  if any(v["status"]=="INCONCLUSIVE" for v in k_status.values())
                  else "STOP_V3_B29_INSUFFICIENT_HISTORICAL_SOURCE_AVAILABILITY_KEEP_NEUTRAL_1_00"
              )
          else:
              for n in contract["candidate_N"]:
                  confirmed=support(selected_k,n)
                  possible=sorted(y for y in unresolved[selected_k] if y not in confirmed)
                  if len(confirmed)>=minc:
                      n_status[n]={"status":"SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":possible}
                      selected_n=n
                      decision="PASS_B29_HISTORICAL_AVAILABILITY_SELECT_K_N_AUTHORIZE_B30_2027_SOURCE_FEASIBILITY"
                      break
                  if len(confirmed)+len(possible)>=minc:
                      n_status[n]={"status":"INCONCLUSIVE","confirmed_classes":confirmed,"unresolved_possible_classes":possible}
                      decision="INCONCLUSIVE_B29_HISTORICAL_ENUMERATION_REQUIRES_TRANSPORT_OR_TEMPLATE_COMPLETION"
                      break
                  n_status[n]={"status":"NOT_SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":possible}
              if selected_n is None and decision is None:
                  decision="STOP_V3_B29_INSUFFICIENT_HISTORICAL_SOURCE_AVAILABILITY_KEEP_NEUTRAL_1_00"

          result={
            "schema_version":2,
            "study_id":"draft-capital-outlook-v3",
            "stage":"b29_historical_source_only_reducer",
            "decision":decision,
            "selected_K":selected_k,
            "selected_N":selected_n,
            "minimum_historical_classes_required":minc,
            "K_status":k_status,
            "N_status":n_status,
            "per_year_summary":[{
                "class_year":j["class_year"],
                "K60":j["independent_qualifying_count_K60"],
                "K32":j["independent_qualifying_count_K32"],
                "unresolved":j["unresolved_measurement_or_truncation"],
                "candidate_count":j["candidate_url_count_evaluated"],
                "transport_warning_count":j["transport_warning_count"]
            } for j in years],
            "source_recovery_run_id":36817635473,
            "source_recovery_head_sha":"9f453035124a48f94c7c5cc6671379281db59e35",
            "completed_eval_buckets_reused":445,
            "eval_buckets_recovered":3,
            "total_eval_buckets":448,
            "2027_candidate_enumerated":False,
            "player_identity_opened":False,
            "player_positions_opened":False,
            "historical_actual_capital_opened":False,
            "predictor_target_association_computed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0
          }
          rp=O/"b29_result.json"
          rp.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          b30=decision=="PASS_B29_HISTORICAL_AVAILABILITY_SELECT_K_N_AUTHORIZE_B30_2027_SOURCE_FEASIBILITY"
          manifest={
            "schema_version":2,
            "study_id":"draft-capital-outlook-v3",
            "stage":"b29_manifest",
            "b29_executed":True,
            "b29_execution_count_committed":1,
            "execution_revision":"V3_RECOVERY_FROM_NEAR_COMPLETE_V2_SHARDED_RUN",
            "source_recovery_run_id":36817635473,
            "source_recovery_head_sha":"9f453035124a48f94c7c5cc6671379281db59e35",
            "completed_eval_buckets_reused":445,
            "eval_buckets_recovered":3,
            "total_eval_buckets":448,
            "scientific_semantics_changed":False,
            "decision":decision,
            "selected_K":selected_k,
            "selected_N":selected_n,
            "b30_2027_source_feasibility_authorized":b30,
            "b29_completion_only_followup_authorized":decision.startswith("INCONCLUSIVE_"),
            "v3_stopped_for_historical_availability":decision.startswith("STOP_V3_"),
            "2027_candidate_enumeration_authorized":b30,
            "player_identity_open_authorized":False,
            "predictor_construction_authorized":False,
            "historical_actual_capital_open_authorized":False,
            "predictor_target_association_authorized":False,
            "2027_class_scoring_authorized":False,
            "production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0,
            "output_hashes":{
              "b29_execution_contract.json":sha(O/"b29_execution_contract.json"),
              "b29_result.json":sha(rp)
            }
          }
          mp=O/"b29_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          report=[
            "# Draft Capital Outlook V3 — B29 Historical Source-Only Enumeration Recovery",
            "",
            f"Decision: **{decision}**",
            "",
            f"- Selected K: **{selected_k if selected_k is not None else 'NONE'}**",
            f"- Selected N: **{selected_n if selected_n is not None else 'NONE'}**",
            f"- Reused evaluation buckets from source run: **445 / 448**",
            f"- Recovered missing evaluation buckets: **3 / 448**",
            "",
            "Per-year lower-bound counts:"
          ]
          for j in years:
              report.append(
                  f"- {j['class_year']}: K60={j['independent_qualifying_count_K60']}, "
                  f"K32={j['independent_qualifying_count_K32']}, "
                  f"unresolved={j['unresolved_measurement_or_truncation']}"
              )
          report += [
            "",
            "Operational note: source run 36817635473 completed discovery, all 14 candidate manifests, and 445/448 evaluation buckets before workflow-level cancellation. This recovery reran only the three missing deterministic buckets and then applied the unchanged reducers.",
            "",
            "No 2027 enumeration, player identity/position extraction, historical actual-capital outcome, association test, multiplier, or production change occurred in B29."
          ]
          (O/"b29_report.md").write_text("\n".join(report)+"\n")

          files=[O/"b29_execution_contract.json",rp,mp,O/"b29_report.md"]
          (O/"b29_hashes.sha256").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))

          print(json.dumps(manifest,indent=2))
          PY

      - name: Run repository regression preserving B29 artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/draft-capital-outlook-v3/b29"
          P="$(mktemp -d)"
          A="$P/b29.tar"
          tar -C "$ROOT" -cf "$A" .
          restore() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$A"
            rm -rf "$P"
          }
          trap restore EXIT
          python3 scripts/validation/repo_regression_checks.py
          restore
          trap - EXIT

      - name: Commit recovered B29 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v3/b29
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No B29 changes to commit."
            exit 1
          fi
          git commit -m "B29 finalize recovered historical source enumeration"
          git pull --rebase origin main
