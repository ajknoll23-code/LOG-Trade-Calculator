          assert "lex_fix_abs_tol = 5e-7" in t
          assert "r1_r4_phase4_solver_erratum_v6_1.json" in t
          print("PASS: Phase 4 engine reads development only; solver erratum frozen; 2024 holdout/market/vote paths absent.")
          PY

      - name: Execute LOYO candidate selection
        shell: bash
        run: |
          set -euo pipefail
          python3             research/draft-pick-fv-v6/fit_r1_r4_loyo_candidates_v6_1.py             --fit
          python3             research/draft-pick-fv-v6/fit_r1_r4_loyo_candidates_v6_1.py             --check

      - name: Prove exact Phase 4 research-only change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v6/fit_r1_r4_loyo_candidates_v6_1.py"
            "research/draft-pick-fv-v6/r1_r4_frozen_development_candidate_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_loyo_bootstrap_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_loyo_development_selection_manifest_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_loyo_development_selection_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_loyo_development_selection_v6_1.md"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: exactly six intended Phase 4 research files changed."

      - name: Run production and repository regression
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu() { git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Re-prove deployed Draft Pick contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path("index.html").read_text()
          expected=[
            "  1: {early:7500, mid:5854, late:5244},",
            "  2: {early:3906, mid:3624, late:3291},",
            "  3: {early:2692, mid:2682, late:2319},",
            "  4: {early:1972, mid:1831, late:1689},",
            "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
            "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
            "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for x in expected:
            assert x in text, f"deployed pick contract drift: {x}"
          print("PASS: deployed PICK_BASE/YEAR_DISCOUNT unchanged.")
          PY

      - name: Commit frozen Phase 4 selection
        shell: bash
        env:
          CONTRACT_SHA: ${{ needs.freeze_implementation_contract.outputs.contract_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CONTRACT_SHA" || {
            echo "ERROR: origin/main moved after Phase 4 contract freeze."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/draft-pick-fv-v6/fit_r1_r4_loyo_candidates_v6_1.py             research/draft-pick-fv-v6/r1_r4_loyo_development_selection_v6_1.json             research/draft-pick-fv-v6/r1_r4_loyo_bootstrap_v6_1.json             research/draft-pick-fv-v6/r1_r4_frozen_development_candidate_v6_1.json             research/draft-pick-fv-v6/r1_r4_loyo_development_selection_v6_1.md             research/draft-pick-fv-v6/r1_r4_loyo_development_selection_manifest_v6_1.json
          git diff --cached --quiet && {
            echo "ERROR: no Phase 4 artifacts staged."
            exit 1
          }
          git commit -m "Freeze Draft Pick FV V6.1 Phase 4 LOYO selection"
          git push origin HEAD:main
          echo "PASS: Phase 4 LOYO selection frozen."
