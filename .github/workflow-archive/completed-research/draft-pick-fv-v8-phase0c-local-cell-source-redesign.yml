name: Draft Pick FV V8 - Phase 0C Local Cell Source Redesign

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0c-local-cell-source-redesign
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download and verify frozen Phase 0A and Phase 0B evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prep/p0a" "${RUNNER_TEMP}/prep/p0b"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10894002488" --jq '.digest')" = \
            "sha256:bb24b4ea7378936ea1f8b9504e631f566218a3bdf20297d19d5fe7657de32d5d"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10925470604" --jq '.digest')" = \
            "sha256:189d986491c4dc5bfa78cc76fc738aba3b96b638004ff17baa6402218e9aaa7c"

          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-prep" \
            -D "${RUNNER_TEMP}/prep/p0a"

          gh run download 36268881894 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0b-qualified-depth-feasibility-closeout" \
            -D "${RUNNER_TEMP}/prep/p0b"

          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = \
            "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/identity_crosswalk.json" | awk '{print $1}')" = \
            "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          p0b=json.loads(
              (root/"p0b"/"v8_phase0b_qualified_depth_feasibility.json").read_text()
          )
          evidence=json.loads(
              (root/"p0b"/"v8_phase0b_qualified_depth_exact_evidence.json").read_text()
          )

          assert p0b["decision"]=="STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES"
          assert p0b["candidate_universe_total_n"]==6203
          assert p0b["exact_candidate_coverage"] is True
          assert p0b["year_cells_passing_all_gates"]==64
          assert len(p0b["year_cell"])==108
          assert p0b["historical_outcome_ingestion_authorized"] is False
          assert p0b["holdout_2024_outcomes_read"] is False
          assert p0b["production_change_authorized"] is False
          assert all(v is False for v in p0b["firewalls"].values())

          assert len(evidence["candidate_dispositions"])==6203
          assert evidence["historical_player_outcomes_read"] is False
          assert evidence["holdout_2024_outcomes_read"] is False
          assert evidence["candidate_fit_performed"] is False
          assert evidence["production_change_authorized"] is False

          print("PASS: Phase 0B stop decision is verified and outcome-sealed.")
          PY

      - name: Freeze Phase 0C source redesign contract
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/prep/v8_phase0c_local_cell_source_contract.json" <<'JSON'
          {
            "schema_version": 1,
            "study_id": "draft-pick-fv-v8-depth-specific-source-cohorts",
            "stage": "phase0c_local_cell_source_redesign_preregistration",
            "status": "FROZEN_PRE_PHASE0C_EXECUTION_PRE_OUTCOME",
            "reason_for_redesign": {
              "phase0b_decision": "STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES",
              "phase0b_year_cells_passing": 64,
              "phase0b_year_cell_n": 108,
              "phase0b_weakest_qualified_league_n": 5,
              "phase0b_weakest_retention_fraction": 0.4166666666666667,
              "observed_architecture_issue": "Phase 0B required complete unique slots 1..E for a cell at endpoint E. That makes a deep cell ineligible because of any earlier gap or duplicate even when the four picks in the target cell itself are complete and usable.",
              "historical_outcomes_used_to_choose_redesign": false
            },
            "candidate_universe": {
              "source": "exact frozen Phase 0A discovery universe",
              "total_n": 6203,
              "candidate_membership_changed": false,
              "candidate_order_changed": false,
              "new_league_search_allowed": false,
              "replacement_candidate_allowed": false,
              "source_substitution_allowed": false
            },
            "cell_windows": {
              "4": "r1_early",
              "8": "r1_mid",
              "12": "r1_late",
              "16": "r2_early",
              "20": "r2_mid",
              "24": "r2_late",
              "28": "r3_early",
              "32": "r3_mid",
              "36": "r3_late",
              "40": "r4_early",
              "44": "r4_mid",
              "48": "r4_late",
              "52": "r5_early",
              "56": "r5_mid",
              "60": "r5_late",
              "64": "r6_early",
              "68": "r6_mid",
              "72": "r6_late"
            },
            "local_cell_source_rule": {
              "window_for_endpoint_E": "exact overall slots E-3..E only",
              "earlier_slot_completeness_required": false,
              "later_slot_completeness_required": false,
              "selected_draft_unit": "reuse the exact frozen V7/V8 deterministic extract_units + choose_unit implementation",
              "structural_requirement": "all four target slots exist exactly once in the selected draft unit",
              "player_requirement": "all four rows have non-null MFL player IDs and the four MFL player IDs are distinct",
              "league_format_requirement": "reuse frozen V7 12-team, dynasty/proxy, Superflex/2QB, rookie-pool qualifier",
              "mock_requirement": "reuse frozen obvious-mock-name rejection",
              "contamination_scope": "only the exact four target-cell picks",
              "positive_contamination_rejects_cell": true,
              "identity_requirement": "all four cell players must resolve under the byte-identical frozen V7 identity bundle",
              "sleeper_requirement": "all four cell players must have outcome-ready Sleeper identity",
              "usable_membership": "a league counts for a year-cell only after every structural, format, contamination, identity, and Sleeper requirement passes"
            },
            "quality_interpretation": {
              "occurrence_retention_for_usable_source": 1.0,
              "represented_league_fraction_for_usable_source": 1.0,
              "identity_coverage_for_usable_source": 1.0,
              "sleeper_ready_coverage_for_usable_source": 1.0,
              "quality_gates_lowered_from_phase0b": false,
              "explanation": "Phase 0C moves the old occurrence/identity/Sleeper requirements into source membership. A counted source league contributes exactly four retained, identity-resolved, Sleeper-ready occurrences."
            },
            "source_gate": {
              "minimum_usable_leagues_per_year_cell": 12,
              "every_2018_2023_year_cell_must_pass": true,
              "year_cell_n": 108
            },
            "transport": {
              "mfl_endpoints_allowed": [
                "draftResults",
                "league",
                "players"
              ],
              "draftResults_refetch_allowed": true,
              "draftResults_refetch_scope": "exact frozen 6203 candidates only",
              "leagueSearch_allowed": false,
              "candidate_level_transport_isolation": true,
              "maximum_transport_unresolved_fraction_of_candidate_universe": 0.01,
              "transport_unresolved_is_not_source_rejection": true,
              "replacement_candidate_allowed": false
            },
            "firewalls": {
              "historical_player_outcomes_read": false,
              "holdout_2024_outcomes_read": false,
              "holdout_2024_search_performed": false,
              "market_or_ktc_values_read": false,
              "package_vote_data_read": false,
              "candidate_fit_performed": false,
              "candidate_scores_computed": false,
              "candidate_selection_performed": false,
              "production_change_authorized": false
            },
            "pass_decision": "PROCEED_TO_V8_PHASE1_LOCAL_CELL_SOURCE_IDENTITY_FREEZE",
            "fail_decision": "STOP_AND_PREREGISTER_V8_PHASE0D_TARGETED_SOURCE_EXPANSION_BEFORE_OUTCOMES",
            "next_if_pass": "Freeze the exact Phase 0C usable local-cell cohorts and identity evidence before opening any historical NFL outcomes.",
            "next_if_fail": "Keep all outcome firewalls closed and preregister a targeted source expansion only for deficient year-cells."
          }
          JSON

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"prep"/"v8_phase0c_local_cell_source_contract.json"
          d=json.loads(p.read_text())
          assert d["candidate_universe"]["total_n"]==6203
          assert d["candidate_universe"]["candidate_membership_changed"] is False
          assert d["candidate_universe"]["new_league_search_allowed"] is False
          assert d["local_cell_source_rule"]["earlier_slot_completeness_required"] is False
          assert d["local_cell_source_rule"]["identity_requirement"].startswith("all four")
          assert d["source_gate"]["minimum_usable_leagues_per_year_cell"]==12
          assert d["source_gate"]["year_cell_n"]==108
          assert d["transport"]["draftResults_refetch_allowed"] is True
          assert d["transport"]["leagueSearch_allowed"] is False
          assert d["transport"]["maximum_transport_unresolved_fraction_of_candidate_universe"]==0.01
          assert all(v is False for v in d["firewalls"].values())
          print("PASS: Phase 0C local-cell source redesign contract frozen before execution.")
          PY

      - name: Write Phase 0C local-cell probe
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/prep/local_cell_probe_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          from collections import Counter
          from pathlib import Path

          import requests

          ENDPOINTS={
              4:"r1_early",8:"r1_mid",12:"r1_late",
              16:"r2_early",20:"r2_mid",24:"r2_late",
              28:"r3_early",32:"r3_mid",36:"r3_late",
              40:"r4_early",44:"r4_mid",48:"r4_late",
              52:"r5_early",56:"r5_mid",60:"r5_late",
              64:"r6_early",68:"r6_mid",72:"r6_late",
          }
          BATCH_SIZE=25

          def sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def sha_text(values):
              return hashlib.sha256("\n".join(values).encode()).hexdigest()

          def load_engine(path: Path):
              spec=importlib.util.spec_from_file_location("v7_frozen_engine",path)
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot import frozen V7 engine")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def parse_selected_unit(E, unit):
              raw=[
                  x for x in E.V.as_list(unit.get("draftPick"))
                  if isinstance(x,dict)
              ]
              by_slot={}
              for i,p in enumerate(raw):
                  r=E.V.safe_int(p.get("round"))
                  w=E.V.safe_int(p.get("pick"))
                  if (
                      r is None or w is None
                      or r<1 or r>6 or w<1 or w>12
                  ):
                      continue
                  s=(r-1)*12+w
                  by_slot.setdefault(s,[]).append({
                      "overall_slot":s,
                      "round":r,
                      "within_round_pick":w,
                      "mfl_player_id":
                          E.V.stable_id(p.get("player")),
                      "franchise_id":E.V.stable_id(
                          p.get("franchise")
                          or p.get("franchise_id")
                          or p.get("franchiseId")
                      ),
                      "raw_row_index":i,
                  })
              return by_slot

          def local_windows(by_slot):
              out={}
              reasons={}
              for endpoint,cell in ENDPOINTS.items():
                  slots=range(endpoint-3,endpoint+1)
                  rows=[]
                  bad=None
                  for s in slots:
                      xs=by_slot.get(s,[])
                      if len(xs)==0:
                          bad="missing_slot"
                          break
                      if len(xs)!=1:
                          bad="duplicate_slot"
                          break
                      rows.append(dict(xs[0]))
                  if bad is not None:
                      reasons[cell]=bad
                      continue

                  pids=[x.get("mfl_player_id") for x in rows]
                  if any(not x for x in pids):
                      reasons[cell]="missing_player_id"
                      continue
                  if len(set(pids))!=4:
                      reasons[cell]="duplicate_player_id"
                      continue

                  out[cell]=rows
                  reasons[cell]="structurally_complete"
              return out,reasons

          def selftest():
              class V:
                  @staticmethod
                  def as_list(x):
                      if x is None:
                          return []
                      return x if isinstance(x,list) else [x]
                  @staticmethod
                  def safe_int(x):
                      try:
                          return int(x)
                      except Exception:
                          return None
                  @staticmethod
                  def stable_id(x):
                      if x is None:
                          return None
                      s=str(x).strip()
                      return s or None
              class E: pass
              E.V=V

              # Earlier gaps must NOT invalidate a complete later cell.
              picks=[
                  {"round":1,"pick":1,"player":"101"},
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":3,"player":"603"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              by=parse_selected_unit(E,{"draftPick":picks})
              windows,reasons=local_windows(by)
              assert "r1_early" not in windows
              assert reasons["r1_early"]=="missing_slot"
              assert [x["mfl_player_id"] for x in windows["r6_early"]]==[
                  "601","602","603","604"
              ]

              dup=[
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":2,"player":"999"},
                  {"round":6,"pick":3,"player":"603"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              w2,r2=local_windows(
                  parse_selected_unit(E,{"draftPick":dup})
              )
              assert "r6_early" not in w2
              assert r2["r6_early"]=="duplicate_slot"

              repeated_player=[
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":3,"player":"601"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              w3,r3=local_windows(
                  parse_selected_unit(
                      E,{"draftPick":repeated_player}
                  )
              )
              assert "r6_early" not in w3
              assert r3["r6_early"]=="duplicate_player_id"
              print("PASS: Phase 0C local-cell helper self-test")

          def run(args):
              prep=Path(args.prep)
              out=Path(args.out)
              E=load_engine(
                  prep/"p0a"/"engine"/"build_r1_r6_source_identity_v7.py"
              )

              frozen_fp=prep/"p0a"/"engine"/"identity_crosswalk.json"
              expected_fp=(
                  "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442"
                  "b256d5a9445ff132"
              )
              if sha(frozen_fp)!=expected_fp:
                  raise RuntimeError(
                      "frozen FantasyPros/Sleeper crosswalk hash mismatch"
                  )
              E.FP_XWALK=frozen_fp
              idx,asset=E.load_indexes(
                  prep/"p0a"/"engine"/"db_playerids.csv",
                  prep/"p0a"/"engine"/"nflverse_players.csv",
                  prep/"p0a"/"engine"/"r1_r6_identity_asset_manifest_v7.json",
              )
              if asset["fantasypros_sleeper_crosswalk"]["sha256"]!=expected_fp:
                  raise RuntimeError(
                      "identity manifest crosswalk hash mismatch"
                  )

              disc=json.loads(
                  (
                      prep/"p0a"/"discoveries"/
                      f"discovery_{args.year}.json"
                  ).read_text()
              )
              ids=[str(x) for x in disc["candidate_ids"]]
              assert sha_text(ids)==disc["candidate_ids_sha256"]

              batch_count=(len(ids)+BATCH_SIZE-1)//BATCH_SIZE
              if (
                  args.batch_start<0
                  or args.batch_end>=batch_count
                  or args.batch_start>args.batch_end
              ):
                  raise RuntimeError(
                      f"invalid batch range "
                      f"{args.batch_start}..{args.batch_end} / "
                      f"{batch_count}"
                  )

              lo=args.batch_start*BATCH_SIZE
              hi=min(
                  len(ids),
                  (args.batch_end+1)*BATCH_SIZE,
              )
              batch_ids=ids[lo:hi]

              ses=requests.Session()
              ses.headers["User-Agent"]=(
                  f"LOG-Draft-Pick-FV-V8-P0C-{args.year}-"
                  f"B{args.batch_start:03d}-{args.batch_end:03d}/1.0"
              )

              dispositions=[]
              memberships=[]
              occurrences=[]
              transport=[]
              cell_counts={
                  cell:Counter() for cell in ENDPOINTS.values()
              }

              for pos,lid in enumerate(batch_ids,1):
                  for cell in ENDPOINTS.values():
                      cell_counts[cell]["candidate_seen"]+=1

                  stage="draftResults"
                  try:
                      units=E.V.extract_units(
                          E.V.get_json(
                              ses,
                              E.V.api_url(
                                  args.year,
                                  "draftResults",
                                  L=lid,
                              ),
                          )
                      )
                      chosen,reason,unit_summary=E.V.choose_unit(units)
                      if chosen is None:
                          dispositions.append({
                              "draft_year":args.year,
                              "league_id":lid,
                              "status":"draft_unit_reject",
                              "reason":str(reason),
                              "unit_summary":unit_summary,
                          })
                          for cell in ENDPOINTS.values():
                              cell_counts[cell]["draft_unit_reject"]+=1
                          continue

                      by_slot=parse_selected_unit(E,chosen)
                      windows,window_reasons=local_windows(by_slot)
                      for cell in ENDPOINTS.values():
                          r=window_reasons[cell]
                          cell_counts[cell][r]+=1

                      if not windows:
                          dispositions.append({
                              "draft_year":args.year,
                              "league_id":lid,
                              "status":"no_structurally_complete_local_cell",
                              "unit_selection_reason":str(reason),
                          })
                          continue

                      stage="league"
                      lg=E.V.league_obj(
                          E.V.get_json(
                              ses,
                              E.V.api_url(
                                  args.year,
                                  "league",
                                  L=lid,
                              ),
                          )
                      )
                      if lg is None:
                          dispositions.append({
                              "draft_year":args.year,
                              "league_id":lid,
                              "status":"league_missing",
                          })
                          for cell in windows:
                              cell_counts[cell]["league_missing"]+=1
                          continue

                      ok,q=E.V.qualifier(lg)
                      if not ok:
                          dispositions.append({
                              "draft_year":args.year,
                              "league_id":lid,
                              "status":"qualifier_reject",
                              "reason":str(q),
                          })
                          for cell in windows:
                              cell_counts[cell][
                                  f"qualifier_reject:{q}"
                              ]+=1
                          continue

                      if E.V.obvious_mock_name(lg.get("name")):
                          dispositions.append({
                              "draft_year":args.year,
                              "league_id":lid,
                              "status":"obvious_mock_reject",
                          })
                          for cell in windows:
                              cell_counts[cell][
                                  "obvious_mock_reject"
                              ]+=1
                          continue

                      for cell in windows:
                          cell_counts[cell]["format_qualified"]+=1

                      pids=sorted({
                          str(x["mfl_player_id"])
                          for rows in windows.values()
                          for x in rows
                      })
                      stage="players"
                      meta=E.V.league_scoped_players(
                          ses,args.year,lid,pids
                      )

                      usable_cells=[]
                      cell_status={}
                      for endpoint,cell in ENDPOINTS.items():
                          rows=windows.get(cell)
                          if rows is None:
                              continue

                          cr=[
                              {
                                  "overall_slot":
                                      int(x["overall_slot"]),
                                  "mfl_player_id":
                                      str(x["mfl_player_id"]),
                              }
                              for x in rows
                          ]
                          contam=E.V.classify_contamination(
                              args.year,cr,meta,idx
                          )
                          if contam["positive_contamination"]:
                              cell_counts[cell][
                                  "positive_contamination_reject"
                              ]+=1
                              cell_status[cell]=(
                                  "positive_contamination_reject"
                              )
                              memberships.append({
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "cell_endpoint_slot":endpoint,
                                  "status":
                                      "positive_contamination_reject",
                                  "positive_evidence_n":
                                      contam["positive_evidence_n"],
                                  "diagnostic_unknown_n":
                                      contam["diagnostic_unknown_n"],
                              })
                              continue

                          cell_counts[cell][
                              "contamination_clean"
                          ]+=1

                          resolved_rows=[]
                          for rec in rows:
                              pid=str(rec["mfl_player_id"])
                              ident=E.V.resolve_identity(
                                  args.year,
                                  pid,
                                  meta.get(pid),
                                  idx,
                              )
                              row={
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "cell_endpoint_slot":endpoint,
                                  "overall_slot":
                                      int(rec["overall_slot"]),
                                  "round":int(rec["round"]),
                                  "within_round_pick":
                                      int(rec["within_round_pick"]),
                                  "mfl_player_id":pid,
                                  "franchise_id":
                                      rec.get("franchise_id"),
                              }
                              row.update(ident)
                              row["stable_player_key"] = (
                                  E.V.stable_player_key(ident)
                              )
                              resolved_rows.append(row)

                          occurrences.extend(resolved_rows)

                          if not all(
                              bool(x["identity_resolved"])
                              for x in resolved_rows
                          ):
                              cell_counts[cell][
                                  "identity_incomplete_reject"
                              ]+=1
                              cell_status[cell]=(
                                  "identity_incomplete_reject"
                              )
                              memberships.append({
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "cell_endpoint_slot":endpoint,
                                  "status":
                                      "identity_incomplete_reject",
                                  "identity_resolved_n":sum(
                                      bool(x["identity_resolved"])
                                      for x in resolved_rows
                                  ),
                                  "diagnostic_unknown_n":
                                      contam["diagnostic_unknown_n"],
                              })
                              continue

                          cell_counts[cell][
                              "identity_complete"
                          ]+=1

                          if not all(
                              bool(x["outcome_ready_sleeper_id"])
                              for x in resolved_rows
                          ):
                              cell_counts[cell][
                                  "sleeper_incomplete_reject"
                              ]+=1
                              cell_status[cell]=(
                                  "sleeper_incomplete_reject"
                              )
                              memberships.append({
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "cell_endpoint_slot":endpoint,
                                  "status":
                                      "sleeper_incomplete_reject",
                                  "sleeper_ready_n":sum(
                                      bool(
                                          x[
                                              "outcome_ready_sleeper_id"
                                          ]
                                      )
                                      for x in resolved_rows
                                  ),
                              })
                              continue

                          cell_counts[cell]["usable"]+=1
                          cell_status[cell]="usable"
                          usable_cells.append(cell)
                          memberships.append({
                              "draft_year":args.year,
                              "league_id":lid,
                              "cell":cell,
                              "cell_endpoint_slot":endpoint,
                              "status":"usable",
                              "league_name":lg.get("name"),
                              "league_idp":bool(E.V.is_idp(lg)),
                              "qualifier_kind":str(q),
                              "keeper_state":E.V.keeper_state(lg),
                              "qb_limit":E.V.qb_limit(lg),
                              "draft_player_pool":
                                  lg.get("draftPlayerPool"),
                              "occurrence_n":4,
                              "identity_resolved_n":4,
                              "sleeper_ready_n":4,
                          })

                      dispositions.append({
                          "draft_year":args.year,
                          "league_id":lid,
                          "status":"evaluated",
                          "unit_selection_reason":str(reason),
                          "structurally_complete_cell_n":
                              len(windows),
                          "usable_cell_n":len(usable_cells),
                          "usable_cells":sorted(usable_cells),
                          "cell_status":cell_status,
                      })

                  except E.GateError as exc:
                      if not E._v4_transport_exhaustion(exc):
                          raise
                      u={
                          "draft_year":args.year,
                          "league_id":lid,
                          "status":"transport_unresolved",
                          "stage":stage,
                          "failure_class":
                              E._v4_transport_class(str(exc)),
                          "error_fingerprint_sha256":
                              hashlib.sha256(
                                  str(exc).encode()
                              ).hexdigest(),
                      }
                      dispositions.append(u)
                      transport.append(u)

                  if pos%25==0 or pos==len(batch_ids):
                      print(
                          f"{args.year} "
                          f"{args.batch_start}-{args.batch_end}: "
                          f"{pos}/{len(batch_ids)}",
                          flush=True,
                      )

              if [x["league_id"] for x in dispositions]!=batch_ids:
                  raise RuntimeError(
                      "candidate order/coverage mismatch"
                  )
              if (
                  len(dispositions)!=len(batch_ids)
                  or len({
                      x["league_id"] for x in dispositions
                  })!=len(batch_ids)
              ):
                  raise RuntimeError(
                      "candidate exact-once violation"
                  )

              payload={
                  "schema_version":1,
                  "study_id":
                      "draft-pick-fv-v8-depth-specific-source-cohorts",
                  "stage":"phase0c_local_cell_probe_chunk",
                  "draft_year":args.year,
                  "batch_start":args.batch_start,
                  "batch_end":args.batch_end,
                  "candidate_start_index":lo,
                  "candidate_end_index_exclusive":hi,
                  "candidate_ids":batch_ids,
                  "candidate_ids_sha256":
                      sha_text(batch_ids),
                  "candidate_dispositions":dispositions,
                  "cell_memberships":memberships,
                  "occurrences":occurrences,
                  "transport_unresolved":transport,
                  "cell_status_counts":{
                      cell:dict(sorted(c.items()))
                      for cell,c in sorted(
                          cell_counts.items()
                      )
                  },
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
              }
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(
                  json.dumps(
                      payload,indent=2,sort_keys=True
                  )+"\n"
              )

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--self-test",action="store_true")
              ap.add_argument("--year",type=int)
              ap.add_argument("--batch-start",type=int)
              ap.add_argument("--batch-end",type=int)
              ap.add_argument("--prep")
              ap.add_argument("--out")
              args=ap.parse_args()

              if args.self_test:
                  selftest()
                  return

              required=(
                  args.year,args.batch_start,args.batch_end,
                  args.prep,args.out,
              )
              if any(x is None for x in required):
                  ap.error(
                      "probe mode requires year, batch range, "
                      "prep, and out"
                  )
              run(args)

          if __name__=="__main__":
              main()
          PY

          chmod +x "${RUNNER_TEMP}/prep/local_cell_probe_v8.py"
          python3 "${RUNNER_TEMP}/prep/local_cell_probe_v8.py" --self-test

      - name: Validate frozen Phase 0C prep firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          c=json.loads(
              (root/"v8_phase0c_local_cell_source_contract.json").read_text()
          )
          assert c["status"]=="FROZEN_PRE_PHASE0C_EXECUTION_PRE_OUTCOME"
          assert c["candidate_universe"]["total_n"]==6203
          assert c["candidate_universe"]["new_league_search_allowed"] is False
          assert c["local_cell_source_rule"]["earlier_slot_completeness_required"] is False
          assert c["local_cell_source_rule"]["positive_contamination_rejects_cell"] is True
          assert c["source_gate"]["minimum_usable_leagues_per_year_cell"]==12
          assert c["source_gate"]["year_cell_n"]==108
          assert c["transport"]["leagueSearch_allowed"] is False
          assert all(v is False for v in c["firewalls"].values())
          print("PASS: Phase 0C prep is outcome-blind and frozen.")
          PY

      - name: Upload frozen Phase 0C prep
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-local-cell-source-prep
          path: ${{ runner.temp }}/prep/
          if-no-files-found: error
          retention-days: 30

  local_cell_probe:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {year: 2018, start: 0, end: 9, slot: 0}
          - {year: 2018, start: 10, end: 19, slot: 1}
          - {year: 2018, start: 20, end: 29, slot: 2}
          - {year: 2018, start: 30, end: 39, slot: 0}
          - {year: 2018, start: 40, end: 42, slot: 1}
          - {year: 2019, start: 0, end: 9, slot: 2}
          - {year: 2019, start: 10, end: 19, slot: 0}
          - {year: 2019, start: 20, end: 29, slot: 1}
          - {year: 2019, start: 30, end: 39, slot: 2}
          - {year: 2019, start: 40, end: 40, slot: 0}
          - {year: 2020, start: 0, end: 9, slot: 1}
          - {year: 2020, start: 10, end: 19, slot: 2}
          - {year: 2020, start: 20, end: 29, slot: 0}
          - {year: 2020, start: 30, end: 39, slot: 1}
          - {year: 2020, start: 40, end: 40, slot: 2}
          - {year: 2021, start: 0, end: 9, slot: 0}
          - {year: 2021, start: 10, end: 19, slot: 1}
          - {year: 2021, start: 20, end: 29, slot: 2}
          - {year: 2021, start: 30, end: 39, slot: 0}
          - {year: 2021, start: 40, end: 41, slot: 1}
          - {year: 2022, start: 0, end: 9, slot: 2}
          - {year: 2022, start: 10, end: 19, slot: 0}
          - {year: 2022, start: 20, end: 29, slot: 1}
          - {year: 2022, start: 30, end: 39, slot: 2}
          - {year: 2022, start: 40, end: 41, slot: 0}
          - {year: 2023, start: 0, end: 9, slot: 1}
          - {year: 2023, start: 10, end: 19, slot: 2}
          - {year: 2023, start: 20, end: 29, slot: 0}
          - {year: 2023, start: 30, end: 39, slot: 1}
          - {year: 2023, start: 40, end: 41, slot: 2}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      YEAR: ${{ matrix.year }}
      BATCH_START: ${{ matrix.start }}
      BATCH_END: ${{ matrix.end }}
      SLOT: ${{ matrix.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0C prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0c-local-cell-source-prep
          path: ${{ runner.temp }}/prep

      - name: Probe exact candidate universe under local-cell architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/diag"
          export MFL_TRANSPORT_DIAGNOSTIC_PATH="${RUNNER_TEMP}/diag/transport.jsonl"
          sleep "$(( SLOT * 10 ))"

          python3 "${RUNNER_TEMP}/prep/local_cell_probe_v8.py" \
            --year "$YEAR" \
            --batch-start "$BATCH_START" \
            --batch-end "$BATCH_END" \
            --prep "${RUNNER_TEMP}/prep" \
            --out "${RUNNER_TEMP}/out/chunk_${YEAR}_${BATCH_START}_${BATCH_END}.json"

      - name: Upload Phase 0C chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-local-cell-${{ matrix.year }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Phase 0C transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-local-cell-diag-${{ matrix.year }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/diag/transport.jsonl
          if-no-files-found: ignore
          retention-days: 30

  assemble:
    needs: local_cell_probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Download frozen Phase 0C prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0c-local-cell-source-prep
          path: ${{ runner.temp }}/prep

      - name: Download all Phase 0C chunks
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p0c-local-cell-20*
          path: ${{ runner.temp }}/chunks
          merge-multiple: true

      - name: Assemble and gate all 108 local-cell cohorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assembled"

          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          prep=root/"prep"
          chunks=root/"chunks"
          out=root/"assembled"

          contract=json.loads(
              (prep/"v8_phase0c_local_cell_source_contract.json").read_text()
          )

          expected_year_n={
              2018:1059,
              2019:1014,
              2020:1024,
              2021:1029,
              2022:1040,
              2023:1037,
          }
          cells=[
              "r1_early","r1_mid","r1_late",
              "r2_early","r2_mid","r2_late",
              "r3_early","r3_mid","r3_late",
              "r4_early","r4_mid","r4_late",
              "r5_early","r5_mid","r5_late",
              "r6_early","r6_mid","r6_late",
          ]
          MIN_N=12
          MAX_TRANSPORT=.01

          docs=[]
          for p in sorted(chunks.glob("chunk_*.json")):
              d=json.loads(p.read_text())
              for k in (
                  "historical_player_outcomes_read",
                  "holdout_2024_outcomes_read",
                  "holdout_2024_search_performed",
                  "market_or_ktc_values_read",
                  "package_vote_data_read",
                  "candidate_fit_performed",
                  "candidate_scores_computed",
                  "candidate_selection_performed",
                  "production_change_authorized",
              ):
                  assert d[k] is False,(p.name,k)
              docs.append(d)
          assert len(docs)==30,len(docs)

          by_year=defaultdict(list)
          all_dispositions=[]
          all_memberships=[]
          all_occurrences=[]
          all_transport=[]
          attrition=defaultdict(Counter)

          for d in docs:
              y=int(d["draft_year"])
              by_year[y].append(d)
              all_dispositions.extend(d["candidate_dispositions"])
              all_memberships.extend(d["cell_memberships"])
              all_occurrences.extend(d["occurrences"])
              all_transport.extend(d["transport_unresolved"])
              for cell,counts in d["cell_status_counts"].items():
                  attrition[(y,cell)].update(counts)

          discoveries=prep/"p0a"/"discoveries"
          for y in range(2018,2024):
              ds=sorted(
                  by_year[y],
                  key=lambda d:int(d["batch_start"]),
              )
              assert len(ds)==5,(y,len(ds))
              got=[
                  lid
                  for d in ds
                  for lid in d["candidate_ids"]
              ]
              frozen=json.loads(
                  (discoveries/f"discovery_{y}.json").read_text()
              )
              expected=[str(x) for x in frozen["candidate_ids"]]
              assert got==expected,(y,len(got),len(expected))
              assert len(got)==expected_year_n[y]
              assert hashlib.sha256(
                  "\n".join(got).encode()
              ).hexdigest()==frozen["candidate_ids_sha256"]

          assert len(all_dispositions)==6203
          assert len({
              (int(x["draft_year"]),str(x["league_id"]))
              for x in all_dispositions
          })==6203

          transport_keys={
              (int(x["draft_year"]),str(x["league_id"]))
              for x in all_transport
          }
          transport_n=len(transport_keys)
          transport_fraction=transport_n/6203
          transport_gate=(
              transport_fraction<=MAX_TRANSPORT+1e-15
          )

          mem_by=defaultdict(list)
          occ_by=defaultdict(list)
          for x in all_memberships:
              mem_by[
                  (int(x["draft_year"]),x["cell"])
              ].append(x)
          for x in all_occurrences:
              occ_by[
                  (int(x["draft_year"]),x["cell"])
              ].append(x)

          metrics={}
          all_cells_pass=True
          weakest_usable=None

          for y in range(2018,2024):
              for cell in cells:
                  usable=[
                      x for x in mem_by[(y,cell)]
                      if x["status"]=="usable"
                  ]
                  qids={
                      str(x["league_id"]) for x in usable
                  }
                  qn=len(qids)

                  usable_occ=[
                      x for x in occ_by[(y,cell)]
                      if str(x["league_id"]) in qids
                  ]

                  assert len(usable_occ)==qn*4,(
                      y,cell,qn,len(usable_occ)
                  )
                  assert len({
                      (
                          str(x["league_id"]),
                          int(x["overall_slot"]),
                      )
                      for x in usable_occ
                  })==qn*4
                  assert all(
                      bool(x["identity_resolved"])
                      for x in usable_occ
                  )
                  assert all(
                      bool(x["outcome_ready_sleeper_id"])
                      for x in usable_occ
                  )

                  source_pass=qn>=MIN_N
                  all_cells_pass=all_cells_pass and source_pass
                  weakest_usable=(
                      qn if weakest_usable is None
                      else min(weakest_usable,qn)
                  )

                  a=attrition[(y,cell)]
                  metrics[f"{y}:{cell}"]={
                      "draft_year":y,
                      "cell":cell,
                      "candidate_seen_n":
                          int(a["candidate_seen"]),
                      "structurally_complete_local_window_n":
                          int(a["structurally_complete"]),
                      "format_qualified_local_window_n":
                          int(a["format_qualified"]),
                      "contamination_clean_local_window_n":
                          int(a["contamination_clean"]),
                      "identity_complete_local_window_n":
                          int(a["identity_complete"]),
                      "usable_league_n":qn,
                      "minimum_usable_league_n":MIN_N,
                      "usable_occurrence_n":len(usable_occ),
                      "usable_occurrence_retention_fraction":(
                          1.0 if qn else 0.0
                      ),
                      "usable_represented_league_fraction":(
                          1.0 if qn else 0.0
                      ),
                      "usable_identity_coverage":(
                          1.0 if qn else 0.0
                      ),
                      "usable_sleeper_ready_coverage":(
                          1.0 if qn else 0.0
                      ),
                      "source_count_gate_pass":source_pass,
                      "attrition_counts":
                          dict(sorted(a.items())),
                  }

          passed_cells=sum(
              x["source_count_gate_pass"]
              for x in metrics.values()
          )
          source_gate_pass=all_cells_pass and transport_gate

          decision=(
              contract["pass_decision"]
              if source_gate_pass
              else contract["fail_decision"]
          )

          deficient=[
              {
                  "draft_year":x["draft_year"],
                  "cell":x["cell"],
                  "usable_league_n":
                      x["usable_league_n"],
                  "shortfall":
                      max(
                          0,
                          MIN_N-x["usable_league_n"],
                      ),
              }
              for x in metrics.values()
              if not x["source_count_gate_pass"]
          ]

          summary={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":
                  "phase0c_local_cell_source_redesign_closeout",
              "decision":decision,
              "candidate_universe_total_n":6203,
              "exact_candidate_coverage":True,
              "year_cell_n":108,
              "year_cells_passing_source_gate":
                  passed_cells,
              "all_year_cells_pass":all_cells_pass,
              "weakest_usable_league_n":
                  weakest_usable,
              "minimum_usable_league_n":MIN_N,
              "deficient_year_cells":deficient,
              "transport":{
                  "transport_unresolved_candidate_n":
                      transport_n,
                  "transport_unresolved_fraction":
                      transport_fraction,
                  "maximum_allowed_fraction":
                      MAX_TRANSPORT,
                  "gate_pass":transport_gate,
              },
              "year_cell":metrics,
              "architecture":{
                  "cell_local_four_pick_windows":True,
                  "complete_prefix_required":False,
                  "four_distinct_player_ids_required":True,
                  "local_contamination_screen":True,
                  "four_of_four_identity_required":True,
                  "four_of_four_sleeper_ready_required":True,
              },
              "firewalls":contract["firewalls"],
              "historical_outcome_ingestion_authorized":False,
              "holdout_2024_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":(
                  "draft-pick-fv-v8-phase1-local-cell-source-identity-freeze"
                  if source_gate_pass
                  else "draft-pick-fv-v8-phase0d-targeted-source-expansion-preregistration"
              ),
          }

          (out/"v8_phase0c_local_cell_source_redesign.json").write_text(
              json.dumps(
                  summary,indent=2,sort_keys=True
              )+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0C Local Cell Source Redesign",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Candidate universe: **6203 / 6203 exact frozen candidates**",
              f"- Year-cells passing: **{passed_cells} / 108**",
              f"- Weakest fully usable cell cohort: **{weakest_usable} leagues**; minimum **12**",
              f"- Transport unresolved: **{transport_n} / 6203 ({transport_fraction:.3%})**; cap **1.000%**",
              "",
              "Every counted source league contributes exactly four retained, identity-resolved, Sleeper-ready player occurrences.",
              "",
              "## Fully usable league counts",
              "",
              "| Year | R1 early | R1 mid | R1 late | R2 early | R2 mid | R2 late | R3 early | R3 mid | R3 late | R4 early | R4 mid | R4 late | R5 early | R5 mid | R5 late | R6 early | R6 mid | R6 late |",
              "|---:|" + "---:|"*18,
          ]
          for y in range(2018,2024):
              vals=[
                  metrics[f"{y}:{cell}"][
                      "usable_league_n"
                  ]
                  for cell in cells
              ]
              lines.append(
                  f"| {y} | "
                  + " | ".join(map(str,vals))
                  + " |"
              )

          if deficient:
              lines += [
                  "",
                  "## Deficient cells",
                  "",
                  "| Year | Cell | Usable | Shortfall |",
                  "|---:|---|---:|---:|",
              ]
              for x in deficient:
                  lines.append(
                      f"| {x['draft_year']} | {x['cell']} | "
                      f"{x['usable_league_n']} | "
                      f"{x['shortfall']} |"
                  )

          lines += [
              "",
              "No historical NFL outcomes, 2024 outcomes, market/KTC values, package votes, candidate fits, or production values were read.",
              "",
              (
                  "Phase 1 may freeze these exact local-cell source and identity cohorts before outcome harvest."
                  if source_gate_pass
                  else "Outcome ingestion remains prohibited. The next step is a preregistered targeted source expansion only for the deficient year-cells."
              ),
          ]
          (out/"v8_phase0c_local_cell_source_redesign.md").write_text(
              "\n".join(lines)+"\n"
          )

          exact={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":
                  "phase0c_local_cell_exact_source_identity_evidence",
              "decision":decision,
              "candidate_dispositions":
                  all_dispositions,
              "cell_memberships":
                  all_memberships,
              "occurrences":
                  all_occurrences,
              "transport_unresolved":
                  all_transport,
              "cell_attrition_counts":{
                  f"{y}:{cell}":
                      dict(sorted(c.items()))
                  for (y,cell),c in sorted(
                      attrition.items()
                  )
              },
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }
          (out/"v8_phase0c_local_cell_exact_evidence.json").write_text(
              json.dumps(
                  exact,indent=2,sort_keys=True
              )+"\n"
          )

          print("\n".join(lines))
          PY

      - name: Validate Phase 0C closeout and outcome firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"assembled"
          s=json.loads(
              (out/"v8_phase0c_local_cell_source_redesign.json").read_text()
          )
          e=json.loads(
              (out/"v8_phase0c_local_cell_exact_evidence.json").read_text()
          )

          assert s["candidate_universe_total_n"]==6203
          assert s["exact_candidate_coverage"] is True
          assert s["year_cell_n"]==108
          assert len(s["year_cell"])==108
          assert s["minimum_usable_league_n"]==12
          assert s["architecture"][
              "cell_local_four_pick_windows"
          ] is True
          assert s["architecture"][
              "complete_prefix_required"
          ] is False
          assert s["architecture"][
              "four_of_four_identity_required"
          ] is True
          assert s["architecture"][
              "four_of_four_sleeper_ready_required"
          ] is True
          assert s[
              "historical_outcome_ingestion_authorized"
          ] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert all(
              v is False
              for v in s["firewalls"].values()
          )

          assert len(e["candidate_dispositions"])==6203
          assert len({
              (
                  int(x["draft_year"]),
                  str(x["league_id"]),
              )
              for x in e["candidate_dispositions"]
          })==6203
          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False

          for x in e["cell_memberships"]:
              if x["status"]=="usable":
                  assert x["occurrence_n"]==4
                  assert x["identity_resolved_n"]==4
                  assert x["sleeper_ready_n"]==4

          allowed={
              "PROCEED_TO_V8_PHASE1_LOCAL_CELL_SOURCE_IDENTITY_FREEZE",
              "STOP_AND_PREREGISTER_V8_PHASE0D_TARGETED_SOURCE_EXPANSION_BEFORE_OUTCOMES",
          }
          assert s["decision"] in allowed

          print(
              "PASS: Phase 0C closeout is exact, "
              "local-cell, identity-complete, and outcome-sealed."
          )
          PY

      - name: Upload Phase 0C closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-local-cell-source-redesign-closeout
          path: ${{ runner.temp }}/assembled/
          if-no-files-found: error
          retention-days: 30
