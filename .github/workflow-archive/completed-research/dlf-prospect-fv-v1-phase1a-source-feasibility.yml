name: DLF Prospect FV V1 - Phase 1A Source Feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlf-prospect-fv-v1-phase1a-source-feasibility
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DLF_SOURCE_PAGE: 'https://dynastyleaguefootball.com/prospect-analytics-app/'
  DLF_WORKBOOK_URL: 'https://docs.google.com/spreadsheets/d/1fwDTd1WnlvPEPGVW8N3Z4zuA0Bft8whkMZTRbMvGDmM/export?format=xlsx'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'openpyxl==3.1.5' \
            'requests==2.34.2'

      - name: Guard frozen no-history prospect-prior baseline
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: baseline drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
            echo "PASS baseline $path $actual"
          }

          check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
            research/no-history-v2/no_history_v2_phase2_prospect_prior.py
          check_blob a46607b42ad954d00e89b4eb08d9b7bb91c6be0a \
            research/no-history-v2/no_history_v2_phase2_prospect_prior.md
          check_blob 5452d9bcd1d4b23a2f2953601344cae882860bd6 \
            research/no-history-v2/no_history_v2_phase2_prospect_prior.json

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'PASS: current prospect-prior research baseline is exact and repo is clean.'

      - name: Download exact current DLF prospect workbook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import time
          from pathlib import Path

          import requests

          url = os.environ["DLF_WORKBOOK_URL"]
          out = Path(os.environ["RUNNER_TEMP"]) / "dlf_prospect_workbook.xlsx"

          last = None
          for attempt in range(1, 7):
              try:
                  r = requests.get(
                      url,
                      timeout=(20, 120),
                      allow_redirects=True,
                      headers={
                          "User-Agent": "LOG-Trade-Calculator research audit/1.0",
                          "Accept": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*",
                      },
                  )
                  r.raise_for_status()
                  data = r.content
                  if len(data) < 10_000:
                      raise RuntimeError(f"DLF workbook unexpectedly small: {len(data)} bytes")
                  if not data.startswith(b"PK"):
                      raise RuntimeError(
                          f"DLF workbook is not an XLSX/ZIP payload; content-type={r.headers.get('content-type')!r}"
                      )
                  out.write_bytes(data)
                  sha = hashlib.sha256(data).hexdigest()
                  print(f"PASS: downloaded DLF workbook bytes={len(data)} sha256={sha}")
                  break
              except Exception as exc:
                  last = exc
                  if attempt == 6:
                      raise
                  wait = min(30, 5 * attempt)
                  print(f"DLF download attempt {attempt}/6 failed: {type(exc).__name__}: {exc}; sleeping {wait}s")
                  time.sleep(wait)
          else:
              raise RuntimeError(f"DLF workbook download failed: {last}")
          PY

      - name: Audit workbook schema and FV-eligible feature families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dlf-audit"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import re
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import openpyxl

          root = Path(os.environ["RUNNER_TEMP"])
          workbook_path = root / "dlf_prospect_workbook.xlsx"
          out_dir = root / "dlf-audit"
          raw = workbook_path.read_bytes()
          source_sha = hashlib.sha256(raw).hexdigest()

          wb = openpyxl.load_workbook(workbook_path, read_only=True, data_only=True)

          def clean(v):
              if v is None:
                  return ""
              return str(v).strip()

          def norm_header(v):
              return re.sub(r"\s+", " ", clean(v))

          def finite_num(v):
              if v is None or v == "":
                  return None
              if isinstance(v, (int, float)):
                  return float(v) if math.isfinite(float(v)) else None
              s = str(v).strip().replace(",", "").replace("%", "")
              try:
                  x = float(s)
              except ValueError:
                  return None
              return x if math.isfinite(x) else None

          identity_fields = {
              "Year", "Position", "Player", "College", "Conference",
              "DOB", "Age", "Round", "Overall",
          }
          dlf_composites = {
              "Markers", "Final.Grade", "Athleticism%", "Production%", "Advanced.Markers",
          }
          combine_fields = {
              "Weight", "Height", "BMI", "Bench", "40-Dash", "3-Cone",
              "Shuttle", "Vertical", "Broad", "WaSS", "Burst Score",
          }
          forbidden_market_tokens = (
              "adp", "rank", "trade value", "tradevalue", "ktc",
              "market value", "marketvalue", "dynasty value",
          )

          sheet_reports = []
          relevant_sheet_count = 0
          total_rows = 0
          all_positions = Counter()
          all_years = Counter()
          all_headers = set()

          for ws in wb.worksheets:
              preview = []
              for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row or 15, 15), values_only=True):
                  preview.append([norm_header(v) for v in row])

              header_idx = None
              header = None
              for i, row in enumerate(preview):
                  vals = set(x for x in row if x)
                  if {"Year", "Position", "Player"}.issubset(vals):
                      header_idx = i + 1
                      header = row
                      break

              if header_idx is None:
                  sheet_reports.append({
                      "sheet": ws.title,
                      "relevant": False,
                      "reason": "no Year/Position/Player header found in first 15 rows",
                      "max_row": ws.max_row,
                      "max_column": ws.max_column,
                  })
                  continue

              relevant_sheet_count += 1
              header = [h if h else f"__blank_col_{i+1}" for i, h in enumerate(header)]
              index = {}
              for i, h in enumerate(header):
                  if h.startswith("__blank_col_"):
                      continue
                  if h not in index:
                      index[h] = i

              missing_identity = sorted(identity_fields - set(index))
              if missing_identity:
                  raise RuntimeError(
                      f"{ws.title}: missing required identity/baseline columns {missing_identity}"
                  )

              rows = []
              pos_counts = Counter()
              year_counts = Counter()
              duplicate_keys = Counter()
              nonempty = Counter()

              for values in ws.iter_rows(min_row=header_idx + 1, values_only=True):
                  vals = list(values)
                  if len(vals) < len(header):
                      vals += [None] * (len(header) - len(vals))

                  player = clean(vals[index["Player"]])
                  position = clean(vals[index["Position"]]).upper()
                  y = finite_num(vals[index["Year"]])
                  if not player or y is None:
                      continue

                  year = int(y)
                  rows.append((year, position, player, vals))
                  pos_counts[position] += 1
                  year_counts[year] += 1
                  duplicate_keys[(year, position, player.casefold())] += 1

                  for h, i in index.items():
                      if i < len(vals) and clean(vals[i]) != "":
                          nonempty[h] += 1

              if not rows:
                  raise RuntimeError(f"{ws.title}: detected prospect header but found zero data rows")

              dupes = [
                  {"year": k[0], "position": k[1], "player": k[2], "count": n}
                  for k, n in duplicate_keys.items() if n > 1
              ]

              headers = [h for h in index]
              market_like = sorted(
                  h for h in headers
                  if any(tok in h.casefold() for tok in forbidden_market_tokens)
              )
              if market_like:
                  raise RuntimeError(
                      f"{ws.title}: market/sentiment-like columns detected in FV source audit: {market_like}"
                  )

              raw_college = sorted(
                  h for h in headers
                  if h.startswith("Career.") or h.startswith("Best.")
                  or h in {"First.PPG", "Last.PPG", "Best.PPG", "Years", "Games", "Missing"}
              )
              advanced = sorted(
                  h for h in headers
                  if h in {
                      "Career.Acc%", "Career.BTT", "Career.BTT%", "Min:Max.ADOT",
                      "Career.TWP%", "Career.Sack%", "Best.Acc%", "Best.BTT",
                      "Best.BTT%", "Best.TWP%", "Best.Sack%",
                  }
              )
              combine = sorted(h for h in headers if h in combine_fields)
              composites = sorted(h for h in headers if h in dlf_composites)

              n = len(rows)
              coverage = {
                  h: {
                      "nonempty_n": nonempty[h],
                      "coverage_pct": round(100.0 * nonempty[h] / n, 2),
                  }
                  for h in headers
                  if not h.startswith("__blank_col_")
              }

              report = {
                  "sheet": ws.title,
                  "relevant": True,
                  "header_row": header_idx,
                  "row_count": n,
                  "year_min": min(year_counts),
                  "year_max": max(year_counts),
                  "year_counts": dict(sorted(year_counts.items())),
                  "position_counts": dict(sorted(pos_counts.items())),
                  "column_count": len(headers),
                  "columns": headers,
                  "duplicate_identity_keys_n": len(dupes),
                  "duplicate_identity_examples": dupes[:20],
                  "feature_families": {
                      "identity_and_draft_baseline": sorted(identity_fields & set(headers)),
                      "raw_college_performance": raw_college,
                      "advanced_performance": advanced,
                      "combine_athletic": combine,
                      "dlf_composites_quarantined": composites,
                  },
                  "coverage": coverage,
                  "market_like_columns": market_like,
              }
              sheet_reports.append(report)
              total_rows += n
              all_positions.update(pos_counts)
              all_years.update(year_counts)
              all_headers.update(headers)

          if relevant_sheet_count == 0:
              raise RuntimeError("No prospect-data worksheet was discovered in the DLF workbook")
          if total_rows < 50:
              raise RuntimeError(f"DLF workbook prospect row count unexpectedly small: {total_rows}")
          if not (set(all_positions) & {"QB", "RB", "WR", "TE"}):
              raise RuntimeError(f"No offensive skill positions found: {dict(all_positions)}")

          # Critical firewall: DLF proprietary composite scores are inventoried but not
          # approved for FV use in Phase 1A. Only source feasibility is being established.
          decision = "PASS_SOURCE_FEASIBILITY_ONLY_NO_FV_CHANGE"

          result = {
              "schema_version": 1,
              "study_id": "dlf-prospect-fv-v1",
              "phase": "1A_source_feasibility",
              "decision": decision,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": {
                  "provider": "Dynasty League Football",
                  "source_page": os.environ["DLF_SOURCE_PAGE"],
                  "workbook_url": os.environ["DLF_WORKBOOK_URL"],
                  "workbook_sha256": source_sha,
                  "workbook_bytes": len(raw),
                  "raw_workbook_persisted": False,
              },
              "firewalls": {
                  "fundamental_value_changed": False,
                  "production_value_changed": False,
                  "market_value_read": False,
                  "ktc_read": False,
                  "dlf_rankings_read": False,
                  "dlf_adp_read": False,
                  "dlf_trade_values_read": False,
                  "dlf_composites_authorized_for_fv": False,
                  "outcomes_read": False,
                  "model_fit_performed": False,
              },
              "workbook": {
                  "worksheet_names": wb.sheetnames,
                  "relevant_sheet_count": relevant_sheet_count,
                  "prospect_row_count_across_relevant_sheets": total_rows,
                  "position_counts_across_relevant_sheets": dict(sorted(all_positions.items())),
                  "year_min": min(all_years),
                  "year_max": max(all_years),
                  "distinct_column_names": sorted(all_headers),
              },
              "sheets": sheet_reports,
              "next_phase_contract": {
                  "phase": "1B_identity_and_incremental-signal_design",
                  "baseline": "existing No-History/Rookie V2 draft-capital + draft-age prospect prior",
                  "candidate_feature_families": [
                      "raw college production",
                      "advanced prospect performance metrics",
                      "combine/athletic measurements",
                  ],
                  "quarantined_until_provenance_understood": [
                      "Markers", "Final.Grade", "Athleticism%", "Production%", "Advanced.Markers"
                  ],
                  "required_validation": (
                      "No feature may affect FV unless it adds out-of-sample historical signal "
                      "over the frozen draft-capital + draft-age baseline under the same outcome target."
                  ),
              },
          }

          out_json = out_dir / "dlf_prospect_fv_v1_phase1a_audit.json"
          out_md = out_dir / "dlf_prospect_fv_v1_phase1a_audit.md"
          out_json.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")

          md = []
          md.append("# DLF Prospect FV V1 — Phase 1A Source Feasibility")
          md.append("")
          md.append(f"**Decision:** `{decision}`")
          md.append("")
          md.append(f"- Workbook SHA-256: `{source_sha}`")
          md.append(f"- Relevant prospect worksheets: **{relevant_sheet_count}**")
          md.append(f"- Prospect rows across relevant worksheets: **{total_rows}**")
          md.append(f"- Year span observed: **{min(all_years)}–{max(all_years)}**")
          md.append(f"- Position counts: **{dict(sorted(all_positions.items()))}**")
          md.append("")
          md.append("## FV firewall")
          md.append("")
          md.append("- No current FV, KTC, ADP, rankings, trade values, or outcome data were read.")
          md.append("- No model was fit.")
          md.append("- No production value or repository file was changed.")
          md.append("- DLF composite fields are quarantined until their construction/provenance is understood.")
          md.append("")
          md.append("## Candidate feature families for Phase 1B+")
          md.append("")
          md.append("1. Raw college performance")
          md.append("2. Advanced prospect performance")
          md.append("3. Combine / athletic measurements")
          md.append("4. DLF composite scores: inventory only, not FV-authorized")
          md.append("")
          md.append("## Worksheet inventory")
          md.append("")
          for s in sheet_reports:
              if not s.get("relevant"):
                  md.append(f"- `{s['sheet']}` — ignored ({s['reason']})")
                  continue
              md.append(
                  f"- `{s['sheet']}` — {s['row_count']} rows, "
                  f"{s['year_min']}–{s['year_max']}, positions={s['position_counts']}, "
                  f"{s['column_count']} named columns"
              )
          md.append("")
          md.append("## Next gate")
          md.append("")
          md.append(
              "Build Phase 1B identity coverage and preregister the incremental-signal test "
              "against the existing No-History/Rookie V2 draft-capital + draft-age baseline."
          )
          out_md.write_text("\n".join(md) + "\n")

          print(json.dumps({
              "decision": decision,
              "source_sha256": source_sha,
              "worksheet_names": wb.sheetnames,
              "relevant_sheet_count": relevant_sheet_count,
              "prospect_rows": total_rows,
              "year_min": min(all_years),
              "year_max": max(all_years),
              "position_counts": dict(sorted(all_positions.items())),
          }, indent=2))
          PY

      - name: Prove Phase 1A is research-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'PASS: DLF Phase 1A made no tracked or untracked repository changes.'

      - name: Remove raw DLF workbook before artifact upload
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/dlf_prospect_workbook.xlsx"

      - name: Upload DLF Phase 1A audit only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dlf-prospect-fv-v1-phase1a-audit
          path: ${{ runner.temp }}/dlf-audit/
          if-no-files-found: error
          retention-days: 14
