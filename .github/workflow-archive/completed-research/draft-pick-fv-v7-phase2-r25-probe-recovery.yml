            --out "${RUNNER_TEMP}/holdout/holdout_2024.json"

      - name: Validate frozen 2024 firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'holdout/holdout_2024.json').read_text())
          assert d['draft_year']==2024
          assert d['holdout_2024_search_performed'] is False
          assert d['holdout_2024_replacement_or_substitution_used'] is False
          assert d['holdout_2024_contamination_reclassification_used'] is False
          assert d['frozen_V6_full72_league_n']==10
          assert d['clean_full72_league_n']==10
          for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
              assert d[k] is False
          print(f"PASS: exact ten frozen 2024 leagues rebuilt; identity_gate={d['source_identity_gate_pass']}")
          PY2

      - name: Upload 2024 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v7-p2-r25-holdout-2024
          path: ${{ runner.temp }}/holdout/holdout_2024.json
          if-no-files-found: error
          retention-days: 14

  aggregate_and_freeze:
    needs: [prepare, year_aggregate, holdout_2024]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact R25 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download patched R25 engine and identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets

      - name: Download all frozen historical years
        uses: actions/download-artifact@v4
        with:
          pattern: v7-p2-r25-year-*
          path: ${{ runner.temp }}/years
          merge-multiple: true

      - name: Download frozen 2024 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v7-p2-r25-holdout-2024
          path: ${{ runner.temp }}/holdout

      - name: Aggregate and freeze Phase 2
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
            research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py
          cp "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" \
            research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json
          chmod +x research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py

          python3 research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py \
            --aggregate \
            --partial-dir "${RUNNER_TEMP}/years" \
            --holdout-path "${RUNNER_TEMP}/holdout/holdout_2024.json" \
            --asset-manifest research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json

          python3 research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py --check

      - name: Prove final summary contains R25 recovery lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json
          from pathlib import Path
          d=Path('research/draft-pick-fv-v7')
          s=json.loads((d/'r1_r6_source_identity_summary_v7.json').read_text())
          m=json.loads((d/'r1_r6_source_identity_manifest_v7.json').read_text())
          name='r1_r6_phase2_probe_repartition_recovery_v7.json'
          man='r1_r6_phase2_probe_repartition_recovery_manifest_v7.json'
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert s['input_hashes'][name]==sha(d/name)
          assert s['input_hashes'][man]==sha(d/man)
          assert m['input_hashes'][name]==s['input_hashes'][name]
          assert m['input_hashes'][man]==s['input_hashes'][man]
          print('PASS: final freeze cryptographically includes R25 recovery lineage.')
          PY2

      - name: Prove exact research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py"
            "research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json"
            "research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl"
            "research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl"
            "research/draft-pick-fv-v7/r1_r6_source_catalog_v7.json"
            "research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json"
            "research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json"
            "research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.md"
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

      - name: Run production and repository regression
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu() { git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Re-prove deployed Draft Pick contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          t=Path('index.html').read_text()
          expected=[
            "  1: {early:7500, mid:5854, late:5244},",
            "  2: {early:3906, mid:3624, late:3291},",
            "  3: {early:2692, mid:2682, late:2319},",
            "  4: {early:1972, mid:1831, late:1689},",
            "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
            "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
            "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for x in expected: assert x in t,x
          print('PASS: deployed PICK_BASE/YEAR_DISCOUNT unchanged.')
          PY2

      - name: Commit frozen V7 Phase 2 artifacts
        shell: bash
        env:
          STUDY_SHA: ${{ needs.prepare.outputs.study_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STUDY_SHA" || {
            echo 'ERROR: origin/main moved during R25 Phase 2.'
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py \
            research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json \
            research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_source_catalog_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.md
          git diff --cached --quiet && {
            echo 'ERROR: no Phase 2 artifacts staged.'
            exit 1
          }
          git commit -m "Freeze Draft Pick FV V7 Phase 2 source identity"
          git push origin HEAD:main
          echo 'PASS: V7 Phase 2 R25 source/identity freeze committed.'
