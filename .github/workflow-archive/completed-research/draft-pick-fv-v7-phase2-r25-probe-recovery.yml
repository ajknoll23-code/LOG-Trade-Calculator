# PREFLIGHTED: DRAFT_PICK_FV_V7_PHASE2_R25_PROBE_RECOVERY_V1
name: Draft Pick FV V7 - Phase 2 R25 Probe Recovery

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PRIOR_RUN_ID: '36036888017'
  PROBE_BATCH_SIZE: '25'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      study_sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install prepare dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen scientific, transport, and checkpoint lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json"]="42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"
            ["research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_manifest_v7.json"]="d021a9573c1166618b0ded676effb96b0e0d6aca"
            ["research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json"]="80a28c10ca3fb416631ec7352a3dc6d466f5c66d"
            ["research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_manifest_v7.json"]="f1b85a261e44a4db1b2da7df0c2f93e52d6c5343"
            ["research/draft-pick-fv-v7/r1_r6_phase2_transport_recovery_v7.json"]="4da07647e4e6bc8e1e662cac76be366600d6f0d2"
            ["research/draft-pick-fv-v7/r1_r6_phase2_transport_recovery_manifest_v7.json"]="47daaefd366418f0c38873a174ab47de4ff82455"
            ["research/draft-pick-fv-v7/r1_r6_phase2_checkpoint_recovery_v7.json"]="42931654193e6241ac979f74439337e94ed34351"
            ["research/draft-pick-fv-v7/r1_r6_phase2_checkpoint_recovery_manifest_v7.json"]="06cc5b793f3ee6d8cb27a49ad3fe0c5a97a240dd"
            ["research/draft-pick-fv-v7/r1_r6_phase2_checkpoint_recovery_v7.md"]="079475a1b6dcc674ac9d7c89950a0228781ff09b"
            ["research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json"]="e15e6d776f12784fa74c603f016e8ff7dd805311"
            ["research/draft-pick-fv-v6/r1_r4_source_identity_manifest_v6_1.json"]="256554007679f728b2e8483d16941fbb977e766d"
            ["research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py"]="a11215dcce9fccfa49b2b11095906a63b0843443"
            ["scripts/identity_crosswalk.json"]="ed34038ee0c711861616ed01219e458520c11867"
            ["index.html"]="ab60f7008a3e8dbc1a2e1eeb6904c9ccf0eb6d41"
          )
          for path in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$path")"
            test "$actual" = "${EXPECTED[$path]}" || {
              echo "ERROR: frozen predecessor drift: $path"
              echo "expected=${EXPECTED[$path]} actual=$actual"
              exit 1
            }
          done

          for p in \
            research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py \
            research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json \
            research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_source_catalog_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.md \
            research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json
          do
            test ! -e "$p" || {
              echo "ERROR: Phase 2 final output already exists: $p"
              exit 1
            }
          done

          python3 - <<'PY2'
          import json
          from pathlib import Path
          d=Path('research/draft-pick-fv-v7')
          src=json.loads((d/'r1_r6_phase2_source_implementation_contract_v7.json').read_text())
          rec=json.loads((d/'r1_r6_phase2_transport_recovery_v7.json').read_text())
          chk=json.loads((d/'r1_r6_phase2_checkpoint_recovery_v7.json').read_text())
          assert src['decision']=='FREEZE_V7_PHASE2_SOURCE_IMPLEMENTATION_CONTRACT_EXECUTION_AUTHORIZED'
          assert src['scientific_contract_changed'] is False
          assert rec['decision']=='FREEZE_V7_PHASE2_TRANSPORT_RECOVERY_RERUN_AUTHORIZED'
          assert rec['scientific_contract_changed'] is False
          assert rec['source_selection_contract_changed'] is False
          assert rec['transport']['minimum_inter_request_seconds']==5.0
          assert rec['transport']['request_attempts']==12
          assert rec['transport']['draft_results_before_league_metadata'] is True
          assert chk['decision']=='FREEZE_V7_PHASE2_CHECKPOINT_RECOVERY_RERUN_AUTHORIZED'
          assert chk['batch_size']==40
          assert chk['candidate_order_changed'] is False
          assert chk['candidate_membership_changed'] is False
          assert chk['exactly_once_probe_partition_required'] is True
          print('PASS: pre-R25 scientific/source/transport/checkpoint lineage is exact.')
          PY2

      - name: Download exact cancelled-run engine and identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-checkpoint-engine-assets
          path: ${{ runner.temp }}/prior-engine-assets
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36036888017

      - name: Download exact six green discovery checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: v7-p2-discovery-*
          path: ${{ runner.temp }}/prior-discoveries
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36036888017

      - name: Validate exact cancelled-run checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from pathlib import Path

          root=Path(os.environ['RUNNER_TEMP'])
          eng=root/'prior-engine-assets'
          disc=root/'prior-discoveries'

          expected_assets={
            'build_r1_r6_source_identity_v7.py':'bb07a6b992d673129b9963fd54766e3dd4b60076d2a92ce2a1df53bf92308583',
            'db_playerids.csv':'0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73',
            'nflverse_players.csv':'4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee',
            'r1_r6_identity_asset_manifest_v7.json':'e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e',
          }
          expected_discovery={
            2018:{'file_sha256':'f23f32862b25c02a6e61a9613d3cf5eb5c603f6d9173a2937064d423542414d3','candidate_n':1059,'candidate_ids_sha256':'b76206baf78400aac3fb49f8cb53fb35b610eeffb60898678222efc8554b1b59','old_batch_count':27,'new_batch_count':43},
            2019:{'file_sha256':'35f4299f8da6a4ba46d6167b820d411aa112741141f419e9f97fe840aea3092c','candidate_n':1014,'candidate_ids_sha256':'6ab6d87a4c2ab67bb115f1a4f066fb3921140523a3cfce1d5ba331cf9821822b','old_batch_count':26,'new_batch_count':41},
            2020:{'file_sha256':'2f86ce2fb4599b2096de9418afbab7c7ea95a7aa07d0aa1551c7ca3a2b8e3f2c','candidate_n':1024,'candidate_ids_sha256':'4f5c881533b6a0a786c79558104c8a6bf957e4533e78b4263aa6ac2ce55cd8d2','old_batch_count':26,'new_batch_count':41},
            2021:{'file_sha256':'7bbe19aea0edca5939cbfb03b8e5c016c5f9fd302b723e04a0d5e1dbd30c9df4','candidate_n':1029,'candidate_ids_sha256':'d0d996e15a09ba9dd389571dd6f48dafd5a7c1ed4dc2d8ed48ad662eb6a1d16d','old_batch_count':26,'new_batch_count':42},
            2022:{'file_sha256':'ce483998393fd9e2c602bf2797401b68dc0eef220fe4a8335e808f057457b898','candidate_n':1040,'candidate_ids_sha256':'64645a07539b59649ecafecae808835b1f7affc9e97a7e957851ba7774a25794','old_batch_count':26,'new_batch_count':42},
            2023:{'file_sha256':'2df0827bf2266c613d7784c6ed97ad225a0777fec668e265b9110a8ac2901cd4','candidate_n':1037,'candidate_ids_sha256':'c58285f524db4fa17cedb77bc2fe2bce581af2d1e64117bacb6ffede4c072537','old_batch_count':26,'new_batch_count':42},
          }

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()

          assert {p.name for p in eng.iterdir() if p.is_file()}==set(expected_assets)
          for name,h in expected_assets.items():
              assert sha(eng/name)==h,(name,sha(eng/name),h)

          found={p.name for p in disc.glob('discovery_*.json')}
          assert found=={f'discovery_{y}.json' for y in expected_discovery},found

          total=0; total_batches=0
          for y,e in expected_discovery.items():
              p=disc/f'discovery_{y}.json'
              assert sha(p)==e['file_sha256']
              d=json.loads(p.read_text())
              ids=list(d['candidate_ids'])
              assert d['stage']=='phase2_historical_discovery_checkpoint'
              assert d['draft_year']==y
              assert d['candidate_n']==len(ids)==e['candidate_n']
              assert hashlib.sha256('\n'.join(ids).encode()).hexdigest()==d['candidate_ids_sha256']==e['candidate_ids_sha256']
              assert d['batch_size']==40 and d['batch_count']==e['old_batch_count']
              assert math.ceil(len(ids)/25)==e['new_batch_count']
              assert d['discovery']['all_bounded_union_candidates_discovered'] is True
              assert d['discovery']['all_bounded_union_candidates_probed'] is False
              assert d['discovery']['early_stopping_used'] is False
              assert d['discovery']['search_errors']=={}
              assert d['historical_source_search_performed'] is True
              for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
                  assert d[k] is False,(y,k)
              total+=len(ids); total_batches+=e['new_batch_count']
          assert total==6203
          assert total_batches==251
          assert total_batches<=256
          print('PASS: six exact green discoveries recovered: candidates=6203 R25_batches=251.')
          PY2

      - name: Freeze or reuse R25 probe-repartition recovery contract
        id: recovery25
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v7"
          J="$D/r1_r6_phase2_probe_repartition_recovery_v7.json"
          M="$D/r1_r6_phase2_probe_repartition_recovery_v7.md"
          X="$D/r1_r6_phase2_probe_repartition_recovery_manifest_v7.json"
          present=0
          for p in "$J" "$M" "$X"; do [ -e "$p" ] && present=$((present+1)); done

          if [ "$present" -eq 3 ]; then
            python3 - <<'PY2'
          import json
          from pathlib import Path
          d=Path('research/draft-pick-fv-v7')
          j=json.loads((d/'r1_r6_phase2_probe_repartition_recovery_v7.json').read_text())
          m=json.loads((d/'r1_r6_phase2_probe_repartition_recovery_manifest_v7.json').read_text())
          dec='FREEZE_V7_PHASE2_PROBE_REPARTITION_RECOVERY_RERUN_AUTHORIZED'
          assert j['decision']==dec and m['decision']==dec
          assert j['prior_run_id']==36036888017
          assert j['candidate_universe_total_n']==6203
          assert j['old_batch_size']==40 and j['new_batch_size']==25
          assert j['new_probe_batch_count']==251
          assert j['max_parallel']==2
          assert j['new_league_search_allowed'] is False
          assert j['candidate_order_changed'] is False
          assert j['candidate_membership_changed'] is False
          assert j['scientific_contract_changed'] is False
          assert j['source_selection_contract_changed'] is False
          assert j['transport_contract_changed'] is False
          assert j['identity_snapshot_changed'] is False
          assert j['exactly_once_probe_partition_required'] is True
          print('PASS: existing R25 probe-repartition recovery contract reusable.')
          PY2
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$present" -eq 0 || {
            echo 'ERROR: partial R25 probe-repartition recovery contract exists.'
            exit 1
          }

          python3 - <<'PY2'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          d=Path('research/draft-pick-fv-v7')
          disc=Path(__import__('os').environ['RUNNER_TEMP'])/'prior-discoveries'
          eng=Path(__import__('os').environ['RUNNER_TEMP'])/'prior-engine-assets'
          chk=d/'r1_r6_phase2_checkpoint_recovery_v7.json'
          chkm=d/'r1_r6_phase2_checkpoint_recovery_manifest_v7.json'
          rec=d/'r1_r6_phase2_transport_recovery_v7.json'
          recm=d/'r1_r6_phase2_transport_recovery_manifest_v7.json'

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def canon(o):
              return hashlib.sha256(json.dumps(o,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          discovery_artifacts={
            '2018':{'artifact_id':10824968411,'artifact_digest':'sha256:37e6b8ee3c68a87eab70033a69d32cbc9ee935bf5cb5e7c08a6580592cf70365','file_sha256':'f23f32862b25c02a6e61a9613d3cf5eb5c603f6d9173a2937064d423542414d3','candidate_n':1059,'candidate_ids_sha256':'b76206baf78400aac3fb49f8cb53fb35b610eeffb60898678222efc8554b1b59','r25_batch_n':43},
            '2019':{'artifact_id':10825188338,'artifact_digest':'sha256:d5c1746e1264c8f8a76fee9b8f65a703eceeedcffcadfd92207c62a51b5d4e2b','file_sha256':'35f4299f8da6a4ba46d6167b820d411aa112741141f419e9f97fe840aea3092c','candidate_n':1014,'candidate_ids_sha256':'6ab6d87a4c2ab67bb115f1a4f066fb3921140523a3cfce1d5ba331cf9821822b','r25_batch_n':41},
            '2020':{'artifact_id':10825228948,'artifact_digest':'sha256:c02a4e1b14709a213e262b1b9ae2f19b232b3f8e3069a6ed1517297da351d2f5','file_sha256':'2f86ce2fb4599b2096de9418afbab7c7ea95a7aa07d0aa1551c7ca3a2b8e3f2c','candidate_n':1024,'candidate_ids_sha256':'4f5c881533b6a0a786c79558104c8a6bf957e4533e78b4263aa6ac2ce55cd8d2','r25_batch_n':41},
            '2021':{'artifact_id':10825039504,'artifact_digest':'sha256:41c0875478c194135a19fb8134750cc5d116f702171d4bc277ba6d5229dbf697','file_sha256':'7bbe19aea0edca5939cbfb03b8e5c016c5f9fd302b723e04a0d5e1dbd30c9df4','candidate_n':1029,'candidate_ids_sha256':'d0d996e15a09ba9dd389571dd6f48dafd5a7c1ed4dc2d8ed48ad662eb6a1d16d','r25_batch_n':42},
            '2022':{'artifact_id':10824099959,'artifact_digest':'sha256:df6a96a0bc92bed02057f1c1cb565c4a5c06cabe564f022b0597716de6928261','file_sha256':'ce483998393fd9e2c602bf2797401b68dc0eef220fe4a8335e808f057457b898','candidate_n':1040,'candidate_ids_sha256':'64645a07539b59649ecafecae808835b1f7affc9e97a7e957851ba7774a25794','r25_batch_n':42},
            '2023':{'artifact_id':10825451902,'artifact_digest':'sha256:46493b1731e2e2765408cb3d09d4448fe956e0d158db267cf7ec6415008f2776','file_sha256':'2df0827bf2266c613d7784c6ed97ad225a0777fec668e265b9110a8ac2901cd4','candidate_n':1037,'candidate_ids_sha256':'c58285f524db4fa17cedb77bc2fe2bce581af2d1e64117bacb6ffede4c072537','r25_batch_n':42},
          }
          for y,x in discovery_artifacts.items():
              assert sha(disc/f'discovery_{y}.json')==x['file_sha256']

          generated=datetime.now(timezone.utc).isoformat()
          dec='FREEZE_V7_PHASE2_PROBE_REPARTITION_RECOVERY_RERUN_AUTHORIZED'
          obj={
            'schema_version':1,
            'study_id':'draft-pick-fv-v7-r1-r6-full-scale-tail-continuity',
            'stage':'phase2_probe_repartition_recovery',
            'status':'FROZEN_AFTER_CANCELLED_CHECKPOINTED_PROBE_BEFORE_SUCCESSFUL_SOURCE_FREEZE',
            'generated_at_utc':generated,
            'decision':dec,
            'scientific_contract_changed':False,
            'source_selection_contract_changed':False,
            'candidate_contract_changed':False,
            'candidate_membership_changed':False,
            'candidate_order_changed':False,
            'transport_contract_changed':False,
            'identity_snapshot_changed':False,
            'holdout_2024_policy_changed':False,
            'outcome_firewall_changed':False,
            'prior_run_id':36036888017,
            'prior_run_conclusion':'cancelled_after_all_six_discovery_checkpoints_green_during_probe_stage',
            'prior_run_head_sha':'9af362fe166cb1645966bfe39d13eec8d7b7dc51',
            'prior_probe_checkpoint_artifact_n':0,
            'new_league_search_allowed':False,
            'reuse_exact_prior_discovery_artifacts':True,
            'candidate_universe_total_n':6203,
            'old_batch_size':40,
            'new_batch_size':25,
            'new_probe_batch_count':251,
            'max_parallel':2,
            'exactly_once_probe_partition_required':True,
            'probe_partition_rule':'partition each exact frozen discovery candidate order into consecutive non-overlapping 25-candidate slices; final slice may be smaller',
            'aggregation_equivalence_rule':'before year aggregation, prove every frozen candidate ID appears exactly once, concatenated batch candidate IDs equal the frozen discovery order exactly, and no batch is missing, duplicated, substituted, or added',
            'transport_contract_reused_unchanged':True,
            'identity_snapshot_reused_unchanged':True,
            'prior_engine_artifact':{
              'artifact_id':10825202636,
              'artifact_digest':'sha256:73bf9224361a9919069609e37910b4cdaa5136bb51fa58bca24c66c03bea262f',
              'engine_sha256':'bb07a6b992d673129b9963fd54766e3dd4b60076d2a92ce2a1df53bf92308583',
              'dynastyprocess_sha256':'0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73',
              'nflverse_players_sha256':'4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee',
              'identity_asset_manifest_sha256':'e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e',
            },
            'prior_discovery_artifacts':discovery_artifacts,
            'input_hashes':{
              chk.name:sha(chk),chkm.name:sha(chkm),rec.name:sha(rec),recm.name:sha(recm),
              'prior_engine_file_sha256':sha(eng/'build_r1_r6_source_identity_v7.py'),
              **{f'discovery_{y}.json':sha(disc/f'discovery_{y}.json') for y in discovery_artifacts},
            },
          }
          jp=d/'r1_r6_phase2_probe_repartition_recovery_v7.json'
          jp.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          mp=d/'r1_r6_phase2_probe_repartition_recovery_v7.md'
          mp.write_text('\n'.join([
            '# Draft Pick FV V7 - Phase 2 R25 Probe Repartition Recovery','',
            f'**Decision:** `{dec}`','',
            'Execution-only recovery after the checkpointed run completed all six discovery checkpoints but was cancelled during probing.','',
            '- Reuse the six discovery JSON files from run `36036888017` byte-for-byte; do not call `leagueSearch` again.',
            '- Candidate membership and deterministic order remain unchanged: 6,203 total candidates.',
            '- Repartition only the probe execution from 40 candidates per batch to 25.',
            '- Run at most two probe jobs concurrently.',
            '- Preserve the existing 5-second MFL throttle, redirect handling, retry schedule, and 429 cooldowns unchanged.',
            '- Prove exact-once coverage against each frozen discovery order before any year aggregation.',
            '- Preserve the exact prior identity snapshot and all pre-outcome firewalls.',
            '- No 2024 search, outcome ingestion, candidate fitting, market/vote data, or production change is authorized.',
          ])+'\n')
          man={
            'schema_version':1,'study_id':obj['study_id'],'stage':obj['stage'],'status':obj['status'],
            'generated_at_utc':generated,'decision':dec,
            'scientific_contract_changed':False,'source_selection_contract_changed':False,
            'candidate_membership_changed':False,'candidate_order_changed':False,
            'transport_contract_changed':False,'identity_snapshot_changed':False,
            'new_league_search_allowed':False,'candidate_universe_total_n':6203,
            'old_batch_size':40,'new_batch_size':25,'new_probe_batch_count':251,'max_parallel':2,
            'source_freeze_completed':False,'holdout_2024_outcomes_read':False,
            'candidate_fit_performed':False,'production_change_authorized':False,
            'recovery_sha256':sha(jp),'recovery_markdown_sha256':sha(mp),
            'canonical_recovery_sha256':canon(obj),
          }
          (d/'r1_r6_phase2_probe_repartition_recovery_manifest_v7.json').write_text(
              json.dumps(man,indent=2,sort_keys=True)+'\n'
          )
          print('PASS: R25 execution-only recovery frozen before any new probing.')
          PY2
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Prove R25 recovery-contract-only mutation scope
        if: steps.recovery25.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_manifest_v7.json"
            "research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.json"
            "research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.md"
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

      - name: Run repository regression before R25 recovery freeze
        if: steps.recovery25.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu() { git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Commit R25 recovery contract before probe execution
        if: steps.recovery25.outputs.created == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo 'ERROR: origin/main moved before R25 recovery freeze.'
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.json \
            research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.md \
            research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_manifest_v7.json
          git commit -m "Freeze Draft Pick FV V7 R25 probe recovery"
          git push origin HEAD:main

      - name: Resolve exact R25 Phase 2 study base
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "STUDY_SHA=$(git rev-parse HEAD)"

      - name: Patch exact prior engine for R25 execution only
        shell: bash
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/prior-engine-assets/build_r1_r6_source_identity_v7.py"
          OUTDIR="${RUNNER_TEMP}/v7-phase2-r25-assets"
          DST="$OUTDIR/build_r1_r6_source_identity_v7.py"
          mkdir -p "$OUTDIR"
          cp "$SRC" "$DST"
          cp "${RUNNER_TEMP}/prior-engine-assets/db_playerids.csv" "$OUTDIR/db_playerids.csv"
          cp "${RUNNER_TEMP}/prior-engine-assets/nflverse_players.csv" "$OUTDIR/nflverse_players.csv"
          cp "${RUNNER_TEMP}/prior-engine-assets/r1_r6_identity_asset_manifest_v7.json" "$OUTDIR/r1_r6_identity_asset_manifest_v7.json"

          SRC_PATH="$SRC" DST_PATH="$DST" python3 - <<'PY2'
          import ast, hashlib, os
          from pathlib import Path

          srcp=Path(os.environ['SRC_PATH']); dstp=Path(os.environ['DST_PATH'])
          original=srcp.read_text()
          t=original

          replacements=[
            (
              "CHECKPOINT_MAN=V7/'r1_r6_phase2_checkpoint_recovery_manifest_v7.json'\nV6_SOURCE=",
              "CHECKPOINT_MAN=V7/'r1_r6_phase2_checkpoint_recovery_manifest_v7.json'\nREPARTITION=V7/'r1_r6_phase2_probe_repartition_recovery_v7.json'\nREPARTITION_MAN=V7/'r1_r6_phase2_probe_repartition_recovery_manifest_v7.json'\nV6_SOURCE="
            ),
            (
              "MAX_PER_TERM=100; BATCH_SIZE=40; CELLS=",
              "MAX_PER_TERM=100; BATCH_SIZE=25; CELLS="
            ),
            (
              "pre=load(PRE); pm=load(PRE_MAN); c=load(CONTRACT); cm=load(CONTRACT_MAN); rec=load(RECOVERY); rm=load(RECOVERY_MAN); chk=load(CHECKPOINT); chm=load(CHECKPOINT_MAN); src=load(V6_SOURCE); sm=load(V6_SOURCE_MAN)",
              "pre=load(PRE); pm=load(PRE_MAN); c=load(CONTRACT); cm=load(CONTRACT_MAN); rec=load(RECOVERY); rm=load(RECOVERY_MAN); chk=load(CHECKPOINT); chm=load(CHECKPOINT_MAN); rep=load(REPARTITION); repm=load(REPARTITION_MAN); src=load(V6_SOURCE); sm=load(V6_SOURCE_MAN)"
            ),
            (
              "    assert chk['batch_size']==BATCH_SIZE\n",
              "    assert chk['batch_size']==40\n"
              "    pdec='FREEZE_V7_PHASE2_PROBE_REPARTITION_RECOVERY_RERUN_AUTHORIZED'\n"
              "    assert rep['decision']==pdec and repm['decision']==pdec\n"
              "    assert rep['prior_run_id']==36036888017\n"
              "    assert rep['candidate_universe_total_n']==6203\n"
              "    assert rep['old_batch_size']==40 and rep['new_batch_size']==BATCH_SIZE\n"
              "    assert rep['new_probe_batch_count']==251 and rep['max_parallel']==2\n"
              "    assert rep['new_league_search_allowed'] is False\n"
              "    assert rep['candidate_order_changed'] is False and rep['candidate_membership_changed'] is False\n"
              "    assert rep['scientific_contract_changed'] is False and rep['source_selection_contract_changed'] is False\n"
              "    assert rep['transport_contract_changed'] is False and rep['identity_snapshot_changed'] is False\n"
              "    assert rep['exactly_once_probe_partition_required'] is True\n"
            ),
            (
              "assert MFL_MIN_INTERVAL>=5.0 and MFL_MAX_REDIRECTS<=4 and MFL_RETRIES>=12 and BATCH_SIZE==40",
              "assert MFL_MIN_INTERVAL>=5.0 and MFL_MAX_REDIRECTS<=4 and MFL_RETRIES>=12 and BATCH_SIZE==25"
            ),
            (
              "CHECKPOINT.name:sha(CHECKPOINT),CHECKPOINT_MAN.name:sha(CHECKPOINT_MAN),V6_SOURCE.name:sha(V6_SOURCE)",
              "CHECKPOINT.name:sha(CHECKPOINT),CHECKPOINT_MAN.name:sha(CHECKPOINT_MAN),REPARTITION.name:sha(REPARTITION),REPARTITION_MAN.name:sha(REPARTITION_MAN),V6_SOURCE.name:sha(V6_SOURCE)"
            ),
          ]

          for old,new in replacements:
              n=t.count(old)
              assert n==1,(old[:80],n)
              t=t.replace(old,new,1)

          dstp.write_text(t)
          compile(t,str(dstp),'exec')

          def function_hash(text,name):
              tree=ast.parse(text)
              node=next(x for x in tree.body if isinstance(x,(ast.FunctionDef,ast.AsyncFunctionDef)) and x.name==name)
              seg=ast.get_source_segment(text,node)
              return hashlib.sha256(seg.encode()).hexdigest()

          for fn in ('_throttle','_request_once','mfl_get_json','probe_batch','aggregate_year','holdout'):
              if fn in ('probe_batch','aggregate_year'):
                  continue
              assert function_hash(original,fn)==function_hash(t,fn),fn

          assert "BATCH_SIZE=25" in t
          assert "BATCH_SIZE=40" not in t
          assert "--discover-year" in t
          assert "REPARTITION_MAN" in t
          print('PASS: exact prior engine patched only for R25 lineage/batch execution; transport functions unchanged.')
          PY2
          chmod +x "$DST"

      - name: Preflight patched R25 engine against frozen repo contract
        shell: bash
        run: |
          set -euo pipefail
          E="${RUNNER_TEMP}/v7-phase2-r25-assets/build_r1_r6_source_identity_v7.py"
          python3 "$E" --selftest
          python3 "$E" --guard
          python3 - <<'PY2'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v7-phase2-r25-assets/build_r1_r6_source_identity_v7.py'
          t=p.read_text().lower()
          forbidden=['api.sleeper.app/v1/stats','/stats/nfl/','r1_r4_development_outcomes_dob_repaired','r1_r4_historical_scored_universe','prospective_trade_evidence']
          for token in forbidden: assert token not in t,token
          assert 'batch_size=25' in t
          assert 'mfl_min_interval=5.0' in t
          assert 'mfl_retries=12' in t
          print('PASS: R25 engine remains pre-outcome and preserves recovered transport.')
          PY2

      - name: Copy exact frozen discoveries into current-run bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v7-phase2-r25-discoveries"
          cp "${RUNNER_TEMP}/prior-discoveries"/discovery_*.json "${RUNNER_TEMP}/v7-phase2-r25-discoveries/"
          test "$(find "${RUNNER_TEMP}/v7-phase2-r25-discoveries" -maxdepth 1 -type f -name 'discovery_*.json' | wc -l)" -eq 6

      - name: Upload patched engine and exact identity assets
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-r25-engine-assets
          path: |
            ${{ runner.temp }}/v7-phase2-r25-assets/build_r1_r6_source_identity_v7.py
            ${{ runner.temp }}/v7-phase2-r25-assets/db_playerids.csv
            ${{ runner.temp }}/v7-phase2-r25-assets/nflverse_players.csv
            ${{ runner.temp }}/v7-phase2-r25-assets/r1_r6_identity_asset_manifest_v7.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact six frozen discovery checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/v7-phase2-r25-discoveries/discovery_*.json
          if-no-files-found: error
          retention-days: 14

  plan_batches:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Download exact frozen discovery bundle
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/discoveries

      - name: Build exact R25 probe matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'discoveries'
          expected_n={2018:1059,2019:1014,2020:1024,2021:1029,2022:1040,2023:1037}
          expected_sha={
            2018:'b76206baf78400aac3fb49f8cb53fb35b610eeffb60898678222efc8554b1b59',
            2019:'6ab6d87a4c2ab67bb115f1a4f066fb3921140523a3cfce1d5ba331cf9821822b',
            2020:'4f5c881533b6a0a786c79558104c8a6bf957e4533e78b4263aa6ac2ce55cd8d2',
            2021:'d0d996e15a09ba9dd389571dd6f48dafd5a7c1ed4dc2d8ed48ad662eb6a1d16d',
            2022:'64645a07539b59649ecafecae808835b1f7affc9e97a7e957851ba7774a25794',
            2023:'c58285f524db4fa17cedb77bc2fe2bce581af2d1e64117bacb6ffede4c072537',
          }
          include=[]; total=0
          for y in range(2018,2024):
              d=json.loads((root/f'discovery_{y}.json').read_text())
              ids=list(d['candidate_ids'])
              assert len(ids)==d['candidate_n']==expected_n[y]
              assert hashlib.sha256('\n'.join(ids).encode()).hexdigest()==d['candidate_ids_sha256']==expected_sha[y]
              batch_n=math.ceil(len(ids)/25)
              for b in range(batch_n): include.append({'year':y,'batch':b})
              total+=len(ids)
          assert total==6203
          assert len(include)==251
          assert len(include)<=256
          matrix=json.dumps({'include':include},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix='+matrix+'\n')
          print('PASS: exact R25 matrix planned: 6203 candidates / 251 batches.')
          PY2

  probe:
    needs: [prepare, plan_batches]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan_batches.outputs.matrix) }}

    steps:
      - name: Check out exact R25 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download patched R25 engine and identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets

      - name: Download exact frozen discovery bundle
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/discoveries

      - name: Preflight exact candidate slice
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from pathlib import Path
          y=int(os.environ['YEAR']); b=int(os.environ['BATCH'])
          p=Path(os.environ['RUNNER_TEMP'])/'discoveries'/f'discovery_{y}.json'
          d=json.loads(p.read_text()); ids=list(d['candidate_ids'])
          assert hashlib.sha256('\n'.join(ids).encode()).hexdigest()==d['candidate_ids_sha256']
          n=math.ceil(len(ids)/25)
          assert 0<=b<n
          xs=ids[b*25:min(len(ids),(b+1)*25)]
          assert 1<=len(xs)<=25
          print(f'PASS: {y} R25 batch {b+1}/{n} preflight candidates={len(xs)}.')
          PY2

      - name: Probe exact frozen candidate batch
        shell: bash
        run: |
          set -euo pipefail
          Y="${{ matrix.year }}"
          B="${{ matrix.batch }}"
          PAD="$(printf '%03d' "$B")"
          mkdir -p "${RUNNER_TEMP}/probe"
          # Two workers are allowed. Offset odd batches slightly so their first MFL request is not synchronized.
          sleep "$(( (B % 2) * 10 ))"
          python3 "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
            --probe-year "$Y" \
            --batch-index "$B" \
            --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json" \
            --dp "${RUNNER_TEMP}/v7-phase2-assets/db_playerids.csv" \
            --nflverse "${RUNNER_TEMP}/v7-phase2-assets/nflverse_players.csv" \
            --asset-manifest "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" \
            --out "${RUNNER_TEMP}/probe/batch_$PAD.json"

      - name: Validate R25 batch checkpoint
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from pathlib import Path
          y=int(os.environ['YEAR']); b=int(os.environ['BATCH'])
          root=Path(os.environ['RUNNER_TEMP'])
          d=json.loads((root/'probe'/f'batch_{b:03d}.json').read_text())
          frozen=json.loads((root/'discoveries'/f'discovery_{y}.json').read_text())
          ids=list(frozen['candidate_ids']); n=math.ceil(len(ids)/25)
          expected=ids[b*25:min(len(ids),(b+1)*25)]
          assert d['draft_year']==y and d['batch_index']==b and d['batch_count']==n
          assert d['batch_size']==25
          assert d['candidate_start_index']==b*25
          assert d['candidate_end_index_exclusive']==min(len(ids),(b+1)*25)
          assert d['candidate_ids']==expected
          assert hashlib.sha256('\n'.join(expected).encode()).hexdigest()==d['candidate_ids_sha256']
          assert d['historical_source_search_performed'] is False
          assert d['transport_recovery_applied'] is True
          assert d['checkpoint_recovery_applied'] is True
          for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
              assert d[k] is False
          assert d['identity_sources']['dynastyprocess_sha256']=='0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73'
          assert d['identity_sources']['nflverse_players_sha256']=='4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee'
          assert d['identity_sources']['identity_asset_manifest_sha256']=='e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e'
          print(f"PASS: {y} R25 batch={b} candidates={len(expected)} clean={d['probe_counts'].get('clean_full72',0)}")
          PY2

      - name: Upload R25 probe checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v7-p2-r25-probe-${{ matrix.year }}-${{ matrix.batch }}
          path: ${{ runner.temp }}/probe/batch_*.json
          if-no-files-found: error
          retention-days: 14

  year_aggregate:
    needs: [prepare, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023]

    steps:
      - name: Check out exact R25 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install engine dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download patched R25 engine and identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets

      - name: Download exact frozen discovery bundle
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/discoveries

      - name: Download all R25 probe checkpoints for year
        uses: actions/download-artifact@v4
        with:
          pattern: v7-p2-r25-probe-${{ matrix.year }}-*
          path: ${{ runner.temp }}/batches
          merge-multiple: true

      - name: Prove exact-once frozen candidate coverage
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from collections import Counter
          from pathlib import Path
          y=int(os.environ['YEAR']); root=Path(os.environ['RUNNER_TEMP'])
          frozen=json.loads((root/'discoveries'/f'discovery_{y}.json').read_text())
          ids=list(frozen['candidate_ids'])
          assert hashlib.sha256('\n'.join(ids).encode()).hexdigest()==frozen['candidate_ids_sha256']
          n=math.ceil(len(ids)/25)
          batch_dir=root/'batches'
          files=sorted(batch_dir.glob('batch_*.json'))
          assert len(files)==n,(y,len(files),n)
          expected_names={f'batch_{b:03d}.json' for b in range(n)}
          assert {p.name for p in files}==expected_names
          concatenated=[]
          for b in range(n):
              p=batch_dir/f'batch_{b:03d}.json'; d=json.loads(p.read_text())
              expected=ids[b*25:min(len(ids),(b+1)*25)]
              assert d['draft_year']==y and d['batch_index']==b and d['batch_count']==n and d['batch_size']==25
              assert d['candidate_ids']==expected
              assert hashlib.sha256('\n'.join(expected).encode()).hexdigest()==d['candidate_ids_sha256']
              concatenated.extend(d['candidate_ids'])
          counts=Counter(concatenated)
          assert concatenated==ids
          assert len(concatenated)==len(ids)
          assert set(counts)==set(ids)
          assert all(v==1 for v in counts.values())
          print(f'PASS: {y} exact-once coverage proved: {len(ids)} candidates across {n} R25 batches.')
          PY2

      - name: Aggregate frozen year after exact-once proof
        shell: bash
        run: |
          set -euo pipefail
          Y="${{ matrix.year }}"
          mkdir -p "${RUNNER_TEMP}/year"
          python3 "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
            --aggregate-year "$Y" \
            --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json" \
            --batch-dir "${RUNNER_TEMP}/batches" \
            --out "${RUNNER_TEMP}/year/year_$Y.json"

      - name: Validate frozen year checkpoint
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          y=int(os.environ['YEAR'])
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'year'/f'year_{y}.json').read_text())
          assert d['draft_year']==y
          assert d['checkpoint_recovery_applied'] is True
          assert d['transport_recovery_applied'] is True
          assert d['discovery']['all_bounded_union_candidates_probed'] is True
          assert d['discovery']['early_stopping_used'] is False
          assert d['discovery']['search_errors']=={}
          for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
              assert d[k] is False
          print(f"PASS: {y} frozen clean_full72={d['clean_full72_league_n']} source_gate={d['source_count_gate_pass']} identity_gate={d['source_identity_gate_pass']}")
          PY2

      - name: Upload frozen historical year checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v7-p2-r25-year-${{ matrix.year }}
          path: ${{ runner.temp }}/year/year_${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 14

  holdout_2024:
    needs: [prepare, year_aggregate]
    runs-on: ubuntu-latest
