# PREFLIGHTED: DRAFT_PICK_FV_V7_PHASE2_TARGETED_R25_RECOVERY_V1
name: Draft Pick FV V7 - Phase 2 Targeted R25 Recovery
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: draft-pick-fv-v7-phase2-targeted-r25-recovery
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
      study_sha: ${{ steps.resolve.outputs.sha }}
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture recovery base
      id: base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install transport and regression dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen scientific lineage
      shell: bash
      run: "set -euo pipefail\ntest -z \"$(git status --porcelain=v1 --untracked-files=all)\"\ndeclare -A EXPECTED=(\n  [\"\
        research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json\"]=\"42e4fa45d3a0715be281dd3cdf90ba13d1b418ff\"\
        \n  [\"research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json\"]=\"80a28c10ca3fb416631ec7352a3dc6d466f5c66d\"\
        \n  [\"research/draft-pick-fv-v7/r1_r6_phase2_transport_recovery_v7.json\"]=\"4da07647e4e6bc8e1e662cac76be366600d6f0d2\"\
        \n  [\"research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.json\"]=\"0b85dde3cc086bee0540aed6e1b15aee35349e5e\"\
        \n  [\"research/draft-pick-fv-v7/r1_r6_phase2_accelerated_probe_resume_v7.json\"]=\"a51043e009c7d10c37f13ee02e11d63504480213\"\
        \n  [\"research/draft-pick-fv-v7/r1_r6_phase2_accelerated_probe_resume_manifest_v7.json\"]=\"8f2f108ee1cd7d8fb9b689db021942765f4277c6\"\
        \n  [\".github/workflows/draft-pick-fv-v7-phase2-accelerated-probe-shard.yml\"]=\"de4565f1ab9f3e15fbf42f7ca7e6b10ddf4520e7\"\
        \n  [\"index.html\"]=\"ab60f7008a3e8dbc1a2e1eeb6904c9ccf0eb6d41\"\n)\nfor path in \"${!EXPECTED[@]}\"; do actual=\"\
        $(git hash-object \"$path\")\"; test \"$actual\" = \"${EXPECTED[$path]}\" || { echo \"ERROR predecessor drift $path\
        \ expected=${EXPECTED[$path]} actual=$actual\"; exit 1; }; done\nfor p in research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py\
        \ research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json;\
        \ do test ! -e \"$p\" || { echo \"ERROR Phase 2 final output already exists: $p\"; exit 1; }; done\necho 'PASS: scientific/source\
        \ lineage unchanged and final Phase 2 freeze not yet present.' "
    - name: Download exact accelerated engine from completed shard A
      uses: actions/download-artifact@v4
      with:
        name: v7-phase2-accelerated-engine-assets
        path: ${{ runner.temp }}/engine
        repository: ${{ github.repository }}
        run-id: '36060826299'
        github-token: ${{ github.token }}
    - name: Download exact frozen discoveries from completed shard A
      uses: actions/download-artifact@v4
      with:
        name: v7-phase2-r25-frozen-discoveries
        path: ${{ runner.temp }}/discoveries
        repository: ${{ github.repository }}
        run-id: '36060826299'
        github-token: ${{ github.token }}
    - name: Verify exact accelerated engine and frozen discovery bundle
      shell: bash
      run: "set -euo pipefail\nsha() { sha256sum \"$1\" | awk '{print $1}'; }\ntest \"$(sha \"${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py\"\
        )\" = \"264cf774aa064521921fdab827dfa3b11c778e9612049a20177491faca2274d0\"\ntest \"$(sha \"${RUNNER_TEMP}/engine/db_playerids.csv\"\
        )\" = \"0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73\"\ntest \"$(sha \"${RUNNER_TEMP}/engine/nflverse_players.csv\"\
        )\" = \"4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee\"\ntest \"$(sha \"${RUNNER_TEMP}/engine/r1_r6_identity_asset_manifest_v7.json\"\
        )\" = \"e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e\"\npython3 -m py_compile \"${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py\"\
        \npython3 \"${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py\" --selftest\npython3 \"${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py\"\
        \ --guard\necho 'PASS: exact accelerated engine/identity snapshot verified.' "
    - name: Download all prior shard checkpoints and three slow-run greens
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/prior/A" "${RUNNER_TEMP}/prior/B" "${RUNNER_TEMP}/prior/C" "${RUNNER_TEMP}/prior/slow"
        gh run download 36060826299 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-A-probe-*' -D "${RUNNER_TEMP}/prior/A"
        gh run download 36061005645 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-B-probe-*' -D "${RUNNER_TEMP}/prior/B"
        gh run download 36060855053 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-C-probe-*' -D "${RUNNER_TEMP}/prior/C"
        for N in 1 2 4; do mkdir -p "${RUNNER_TEMP}/prior/slow/$N"; gh run download 36052205794 --repo "$GITHUB_REPOSITORY" -n "v7-p2-r25-probe-2018-$N" -D "${RUNNER_TEMP}/prior/slow/$N"; done
        find "${RUNNER_TEMP}/prior" -type f -name 'batch_*.json' | wc -l
    - name: Derive exact pre-recovery coverage from checkpoint evidence
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json, math, os
        from pathlib import Path

        root=Path(os.environ["RUNNER_TEMP"])
        disc=root/"discoveries"
        prior=root/"prior"
        out=root/"coverage"
        out.mkdir(parents=True,exist_ok=True)
        expected_counts={2018: 43, 2019: 41, 2020: 41, 2021: 42, 2022: 42, 2023: 42}
        expected_missing={2018: [0, 3, 5, 6, 7, 13, 14, 15, 16, 17, 24, 25, 26, 27, 31, 32, 33, 34, 35, 36, 37, 39, 40, 41, 42], 2019: [0, 1, 2, 3, 4, 15, 16, 17, 18, 19, 24, 25, 26, 27, 28, 29, 37, 38, 39], 2020: [12, 13, 14, 34, 39], 2021: [28, 29, 34], 2022: [], 2023: []}
        disc_sha={2018: 'f23f32862b25c02a6e61a9613d3cf5eb5c603f6d9173a2937064d423542414d3', 2019: '35f4299f8da6a4ba46d6167b820d411aa112741141f419e9f97fe840aea3092c', 2020: '2f86ce2fb4599b2096de9418afbab7c7ea95a7aa07d0aa1551c7ca3a2b8e3f2c', 2021: '7bbe19aea0edca5939cbfb03b8e5c016c5f9fd302b723e04a0d5e1dbd30c9df4', 2022: 'ce483998393fd9e2c602bf2797401b68dc0eef220fe4a8335e808f057457b898', 2023: '2df0827bf2266c613d7784c6ed97ad225a0777fec668e265b9110a8ac2901cd4'}
        disc_ids_sha={2018: 'b76206baf78400aac3fb49f8cb53fb35b610eeffb60898678222efc8554b1b59', 2019: '6ab6d87a4c2ab67bb115f1a4f066fb3921140523a3cfce1d5ba331cf9821822b', 2020: '4f5c881533b6a0a786c79558104c8a6bf957e4533e78b4263aa6ac2ce55cd8d2', 2021: 'd0d996e15a09ba9dd389571dd6f48dafd5a7c1ed4dc2d8ed48ad662eb6a1d16d', 2022: '64645a07539b59649ecafecae808835b1f7affc9e97a7e957851ba7774a25794', 2023: 'c58285f524db4fa17cedb77bc2fe2bce581af2d1e64117bacb6ffede4c072537'}
        frozen={}
        for y,n in expected_counts.items():
            p=disc/f"discovery_{y}.json"
            assert hashlib.sha256(p.read_bytes()).hexdigest()==disc_sha[y]
            d=json.loads(p.read_text()); ids=list(d["candidate_ids"])
            assert hashlib.sha256("\n".join(ids).encode()).hexdigest()==disc_ids_sha[y]
            assert math.ceil(len(ids)/25)==n
            frozen[y]=ids

        seen={y:{} for y in expected_counts}
        for p in sorted(prior.rglob("batch_*.json")):
            raw=p.read_bytes(); d=json.loads(raw)
            y=int(d["draft_year"]); b=int(d["batch_index"]); ids=frozen[y]
            exp=ids[b*25:min(len(ids),(b+1)*25)]
            assert d["batch_size"]==25 and d["candidate_ids"]==exp
            assert hashlib.sha256("\n".join(exp).encode()).hexdigest()==d["candidate_ids_sha256"]
            assert d["historical_source_search_performed"] is False
            for k in ("historical_player_outcomes_read","holdout_2024_outcomes_read","candidate_fit_performed","candidate_scores_computed","candidate_selection_performed","production_change_authorized"):
                assert d[k] is False,(p,k)
            h=hashlib.sha256(raw).hexdigest()
            if b in seen[y]: assert seen[y][b]==h,(y,b)
            seen[y][b]=h
        missing={y:sorted(set(range(n))-set(seen[y])) for y,n in expected_counts.items()}
        assert missing==expected_missing,(missing,expected_missing)
        assert sum(len(v) for v in seen.values())==199
        assert sum(len(v) for v in missing.values())==52
        rows=[f"{y}/{b}:{seen[y][b]}" for y in sorted(seen) for b in sorted(seen[y])]
        fingerprint=hashlib.sha256("\n".join(rows).encode()).hexdigest()
        obj={
          "schema_version":1,"study_id":"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity",
          "stage":"phase2_targeted_recovery_preflight","candidate_universe_total_n":6203,
          "r25_batch_total_n":251,"validated_prior_batch_n":199,"missing_batch_n":52,
          "missing_batches_by_year":{str(y):missing[y] for y in sorted(missing)},
          "validated_prior_checkpoint_fingerprint_sha256":fingerprint,
          "prior_run_ids":{"slow_r25":36052205794,"shard_A":36060826299,"shard_B":36061005645,"shard_C":36060855053},
          "firewalls":{"historical_player_outcomes_read":False,"holdout_2024_outcomes_read":False,"candidate_fit_performed":False,"production_change_authorized":False}
        }
        (out/"pre_recovery_coverage.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
        print(json.dumps(obj,indent=2))
        PY
    - name: Freeze exact 52-batch targeted recovery contract
      id: freeze
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib, json, os\nfrom datetime import datetime, timezone\nfrom pathlib\
        \ import Path\n\nroot=Path(os.environ[\"RUNNER_TEMP\"]); repo=Path.cwd(); d=repo/\"research/draft-pick-fv-v7\"\ncoverage=json.loads((root/\"\
        coverage/pre_recovery_coverage.json\").read_text())\nexpected={2018: [0, 3, 5, 6, 7, 13, 14, 15, 16, 17, 24, 25, 26,\
        \ 27, 31, 32, 33, 34, 35, 36, 37, 39, 40, 41, 42], 2019: [0, 1, 2, 3, 4, 15, 16, 17, 18, 19, 24, 25, 26, 27, 28, 29,\
        \ 37, 38, 39], 2020: [12, 13, 14, 34, 39], 2021: [28, 29, 34], 2022: [], 2023: []}\nassert coverage[\"missing_batches_by_year\"\
        ]=={str(k):v for k,v in expected.items()}\nassert coverage[\"validated_prior_batch_n\"]==199 and coverage[\"missing_batch_n\"\
        ]==52\nacc=json.loads((d/\"r1_r6_phase2_accelerated_probe_resume_v7.json\").read_text())\nassert acc[\"decision\"\
        ]==\"FREEZE_V7_PHASE2_ACCELERATED_PROBE_RESUME_AUTHORIZED\"\nassert acc[\"candidate_universe_total_n\"]==6203 and\
        \ acc[\"batch_size\"]==25 and acc[\"max_parallel\"]==3\nassert acc[\"minimum_inter_request_seconds\"]==5.0 and acc[\"\
        request_spacing_clock\"]==\"request_start_to_request_start\"\nassert acc[\"scientific_contract_changed\"] is False\
        \ and acc[\"source_selection_contract_changed\"] is False\nnow=datetime.now(timezone.utc).isoformat(); dec=\"FREEZE_V7_PHASE2_TARGETED_R25_RECOVERY_AUTHORIZED\"\
        \nflat=[{\"year\":y,\"batch\":b} for y in sorted(expected) for b in expected[y]]\nobj={\n \"schema_version\":1,\"\
        study_id\":\"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity\",\n \"stage\":\"phase2_targeted_r25_recovery\",\"\
        status\":\"FROZEN_AFTER_SHARD_COMPLETION_BEFORE_TARGETED_RECOVERY\",\n \"generated_at_utc\":now,\"decision\":dec,\"\
        scientific_contract_changed\":False,\"source_selection_contract_changed\":False,\n \"candidate_contract_changed\"\
        :False,\"candidate_membership_changed\":False,\"candidate_order_changed\":False,\n \"transport_safety_floor_changed\"\
        :False,\"retry_redirect_cooldown_contract_changed\":False,\"identity_snapshot_changed\":False,\n \"holdout_2024_policy_changed\"\
        :False,\"outcome_firewall_changed\":False,\"new_league_search_allowed\":False,\n \"candidate_universe_total_n\":6203,\"\
        r25_batch_total_n\":251,\"validated_prior_batch_n\":199,\"targeted_recovery_batch_n\":52,\n \"targeted_recovery_batches_by_year\"\
        :{str(y):expected[y] for y in sorted(expected)},\"targeted_recovery_matrix\":flat,\n \"execution\":{\"one_r25_batch_per_job\"\
        :True,\"max_parallel\":3,\"batch_size\":25,\"minimum_inter_request_seconds\":5.0,\n              \"request_spacing_clock\"\
        :\"request_start_to_request_start\",\"request_attempts\":12,\n              \"transport_failure_semantics\":\"fatal\
        \ for that isolated batch; never reinterpret failure as empty/ineligible\",\n              \"successful_batch_artifacts_reusable_individually\"\
        :True},\n \"evidence\":coverage,\n \"engine\":{\"sha256\":\"264cf774aa064521921fdab827dfa3b11c778e9612049a20177491faca2274d0\"\
        ,\"identity_asset_manifest_sha256\":\"e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e\",\"dynastyprocess_sha256\"\
        :\"0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73\",\"nflverse_players_sha256\":\"4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee\"\
        },\n \"next_if_complete\":\"assemble exact 251/251 checkpoints into six frozen historical year outputs; then run Phase\
        \ 2 final source/identity freeze\",\n \"firewalls\":{\"historical_player_outcomes_read\":False,\"holdout_2024_outcomes_read\"\
        :False,\"candidate_fit_performed\":False,\"candidate_scores_computed\":False,\"candidate_selection_performed\":False,\"\
        production_change_authorized\":False}\n}\nsha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()\ncanon=lambda\
        \ o:hashlib.sha256(json.dumps(o,sort_keys=True,separators=(\",\",\":\")).encode()).hexdigest()\nj=d/\"r1_r6_phase2_targeted_recovery_v7.json\"\
        ; m=d/\"r1_r6_phase2_targeted_recovery_v7.md\"; x=d/\"r1_r6_phase2_targeted_recovery_manifest_v7.json\"\nfor p in\
        \ (j,m,x): assert not p.exists(),p\nj.write_text(json.dumps(obj,indent=2,sort_keys=True)+\"\\n\")\nm.write_text(\"\
        \\n\".join([\"# Draft Pick FV V7 \u2014 Phase 2 Targeted R25 Recovery\",\"\",f\"**Decision:** `{dec}`\",\"\",\n \"\
        Execution-only recovery after harvesting every completed shard checkpoint.\",\"\",\n \"- 6,203 frozen candidates /\
        \ 251 frozen R25 batches.\",\"- 199 batches already validated and will not be rerun.\",\"- Exactly 52 missing batches\
        \ are authorized for recovery.\",\"- One R25 batch per matrix job; maximum three concurrent jobs.\",\"- No source\
        \ search, substitution, outcome access, fit/scoring, market/vote read, or production change.\",\"\",\n \"Missing by\
        \ year:\",*[f\"- {y}: {', '.join(map(str,expected[y])) if expected[y] else 'none'}\" for y in sorted(expected)],\"\
        \"])+\"\\n\")\nman={\"schema_version\":1,\"study_id\":obj[\"study_id\"],\"stage\":obj[\"stage\"],\"status\":obj[\"\
        status\"],\"generated_at_utc\":now,\"decision\":dec,\n \"scientific_contract_changed\":False,\"source_selection_contract_changed\"\
        :False,\"candidate_membership_changed\":False,\"candidate_order_changed\":False,\n \"targeted_recovery_batch_n\":52,\"\
        validated_prior_batch_n\":199,\"candidate_universe_total_n\":6203,\"historical_player_outcomes_read\":False,\n \"\
        holdout_2024_outcomes_read\":False,\"candidate_fit_performed\":False,\"production_change_authorized\":False,\n \"\
        recovery_sha256\":sha(j),\"recovery_markdown_sha256\":sha(m),\"canonical_recovery_sha256\":canon(obj)}\nx.write_text(json.dumps(man,indent=2,sort_keys=True)+\"\
        \\n\")\nprint(\"PASS: exact 52-batch targeted recovery contract frozen.\")\nmatrix={\"include\":[{\"year\":y,\"batch\"\
        :b,\"slot\":i%3} for i,(y,b) in enumerate(( (y,b) for y in sorted(expected) for b in expected[y] ))]}\nwith open(os.environ[\"\
        GITHUB_OUTPUT\"],\"a\") as f: f.write(\"matrix=\"+json.dumps(matrix,separators=(\",\",\":\"))+\"\\n\")\nPY"
    - name: Prove targeted-recovery-contract-only mutation scope
      shell: bash
      run: |-
        set -euo pipefail
        mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
        expected=(
         research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_manifest_v7.json
         research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json
         research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.md
        )
        diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
    - name: Run full repository regression before recovery freeze
      shell: bash
      run: |-
        set -euo pipefail
        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"; TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
        restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }; trap restore_tu EXIT
        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/repo_regression_checks.py
        restore_tu; trap - EXIT; git diff --exit-code -- "$TU_JSON" "$TU_MD"
    - name: Commit targeted recovery contract before execution
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |-
        set -euo pipefail
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo 'ERROR: main moved before targeted recovery freeze'; exit 1; }
        git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.md research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_manifest_v7.json
        git commit -m "Freeze Draft Pick FV V7 targeted R25 recovery"
        git push origin HEAD:main
    - name: Resolve exact recovery study SHA
      id: resolve
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Upload exact recovery engine bundle
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-targeted-recovery-engine
        path: ${{ runner.temp }}/engine/
        if-no-files-found: error
        retention-days: 14
    - name: Upload exact frozen discovery bundle
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-targeted-recovery-discoveries
        path: ${{ runner.temp }}/discoveries/discovery_*.json
        if-no-files-found: error
        retention-days: 14
    - name: Upload pre-recovery coverage proof
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-targeted-recovery-preflight
        path: ${{ runner.temp }}/coverage/pre_recovery_coverage.json
        if-no-files-found: error
        retention-days: 14
  recover:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
    - name: Check out exact targeted-recovery study base
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install transport dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download exact targeted-recovery engine
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-targeted-recovery-engine
        path: ${{ runner.temp }}/engine
    - name: Download exact frozen discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-targeted-recovery-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Preflight exact authorized R25 batch
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path
        y=int(os.environ["YEAR"]); b=int(os.environ["BATCH"]); root=Path(os.environ["RUNNER_TEMP"])
        contract=json.loads(Path("research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json").read_text())
        assert b in contract["targeted_recovery_batches_by_year"][str(y)]
        d=json.loads((root/"discoveries"/f"discovery_{y}.json").read_text()); ids=list(d["candidate_ids"]); n=math.ceil(len(ids)/25)
        assert 0<=b<n; exp=ids[b*25:min(len(ids),(b+1)*25)]; assert exp
        assert hashlib.sha256("\n".join(ids).encode()).hexdigest()==d["candidate_ids_sha256"]
        print(f"PASS: authorized isolated recovery {y}/{b} candidates={len(exp)}")
        PY
    - name: Probe one exact missing R25 batch
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
        SLOT: ${{ matrix.slot }}
      run: |-
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/probe"
        sleep "$(( SLOT * 2 ))"
        PAD="$(printf '%03d' "$BATCH")"
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" \
          --probe-year "$YEAR" \
          --batch-index "$BATCH" \
          --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$YEAR.json" \
          --dp "${RUNNER_TEMP}/engine/db_playerids.csv" \
          --nflverse "${RUNNER_TEMP}/engine/nflverse_players.csv" \
          --asset-manifest "${RUNNER_TEMP}/engine/r1_r6_identity_asset_manifest_v7.json" \
          --out "${RUNNER_TEMP}/probe/batch_$PAD.json"
    - name: Validate recovered checkpoint
      if: success()
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path
        y=int(os.environ["YEAR"]); b=int(os.environ["BATCH"]); root=Path(os.environ["RUNNER_TEMP"])
        frozen=json.loads((root/"discoveries"/f"discovery_{y}.json").read_text()); ids=list(frozen["candidate_ids"]); n=math.ceil(len(ids)/25)
        p=root/"probe"/f"batch_{b:03d}.json"; d=json.loads(p.read_text()); exp=ids[b*25:min(len(ids),(b+1)*25)]
        assert d["draft_year"]==y and d["batch_index"]==b and d["batch_count"]==n and d["batch_size"]==25
        assert d["candidate_ids"]==exp and hashlib.sha256("\n".join(exp).encode()).hexdigest()==d["candidate_ids_sha256"]
        assert d["historical_source_search_performed"] is False
        for k in ("historical_player_outcomes_read","holdout_2024_outcomes_read","candidate_fit_performed","candidate_scores_computed","candidate_selection_performed","production_change_authorized"): assert d[k] is False
        print(f"PASS: recovered checkpoint validated {y}/{b}")
        PY
    - name: Upload isolated recovery checkpoint
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-targeted-recovery-${{ matrix.year }}-${{ matrix.batch }}
        path: ${{ runner.temp }}/probe/batch_*.json
        if-no-files-found: warn
        retention-days: 14
  audit_recovery:
    needs:
    - prepare
    - recover
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      complete: ${{ steps.audit.outputs.complete }}
    steps:
    - name: Check out exact recovery study base
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Download all current-run recovery checkpoints
      uses: actions/download-artifact@v4
      with:
        pattern: v7-p2-targeted-recovery-20*
        path: ${{ runner.temp }}/recovered
        merge-multiple: false
    - name: Audit targeted recovery completion
      id: audit
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os
        from pathlib import Path
        expected={2018: [0, 3, 5, 6, 7, 13, 14, 15, 16, 17, 24, 25, 26, 27, 31, 32, 33, 34, 35, 36, 37, 39, 40, 41, 42], 2019: [0, 1, 2, 3, 4, 15, 16, 17, 18, 19, 24, 25, 26, 27, 28, 29, 37, 38, 39], 2020: [12, 13, 14, 34, 39], 2021: [28, 29, 34], 2022: [], 2023: []}; root=Path(os.environ["RUNNER_TEMP"]); rec=root/"recovered"; out=root/"recovery-audit"; out.mkdir(parents=True,exist_ok=True)
        found={y:{} for y in expected}
        if rec.exists():
          for p in sorted(rec.rglob("batch_*.json")):
            d=json.loads(p.read_text()); y=int(d["draft_year"]); b=int(d["batch_index"]); key=(y,b)
            assert b in expected[y],key
            h=hashlib.sha256(p.read_bytes()).hexdigest()
            if b in found[y]: assert found[y][b]==h,key
            found[y][b]=h
        missing={y:[b for b in expected[y] if b not in found[y]] for y in expected}
        recovered_n=sum(len(x) for x in found.values()); missing_n=sum(len(x) for x in missing.values()); complete=missing_n==0
        obj={"schema_version":1,"study_id":"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity","stage":"phase2_targeted_r25_recovery_audit",
         "expected_recovery_batch_n":52,"recovered_valid_artifact_n":recovered_n,"missing_recovery_batch_n":missing_n,"missing_batches_by_year":{str(y):missing[y] for y in sorted(missing)},
         "complete":complete,"historical_player_outcomes_read":False,"holdout_2024_outcomes_read":False,"candidate_fit_performed":False,"production_change_authorized":False}
        (out/"targeted_recovery_audit.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
        print(json.dumps(obj,indent=2))
        with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("complete="+("true" if complete else "false")+"\n")
        PY
    - name: Upload targeted recovery audit
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-targeted-recovery-audit
        path: ${{ runner.temp }}/recovery-audit/targeted_recovery_audit.json
        if-no-files-found: error
        retention-days: 14
  assemble_six_years:
    needs:
    - prepare
    - audit_recovery
    if: ${{ needs.audit_recovery.outputs.complete == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out exact recovery study base
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install engine dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download exact recovery engine
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-targeted-recovery-engine
        path: ${{ runner.temp }}/engine
    - name: Download exact frozen discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-targeted-recovery-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Download all recovered checkpoints
      uses: actions/download-artifact@v4
      with:
        pattern: v7-p2-targeted-recovery-20*
        path: ${{ runner.temp }}/recovered
        merge-multiple: false
    - name: Download all prior validated shard checkpoints
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/prior-all/A" "${RUNNER_TEMP}/prior-all/B" "${RUNNER_TEMP}/prior-all/C" "${RUNNER_TEMP}/prior-all/slow"
        gh run download 36060826299 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-A-probe-*' -D "${RUNNER_TEMP}/prior-all/A"
        gh run download 36061005645 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-B-probe-*' -D "${RUNNER_TEMP}/prior-all/B"
        gh run download 36060855053 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-C-probe-*' -D "${RUNNER_TEMP}/prior-all/C"
        for N in 1 2 4; do mkdir -p "${RUNNER_TEMP}/prior-all/slow/$N"; gh run download 36052205794 --repo "$GITHUB_REPOSITORY" -n "v7-p2-r25-probe-2018-$N" -D "${RUNNER_TEMP}/prior-all/slow/$N"; done
    - name: Prove 251 of 251 exact-once checkpoint coverage
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,math,os,shutil
        from pathlib import Path
        root=Path(os.environ["RUNNER_TEMP"]); discroot=root/"discoveries"; sources=[root/"prior-all",root/"recovered"]
        out=root/"assembled"; out.mkdir(parents=True,exist_ok=True)
        expected_counts={2018:43,2019:41,2020:41,2021:42,2022:42,2023:42}
        for y,n in expected_counts.items():
            disc=json.loads((discroot/f"discovery_{y}.json").read_text()); ids=list(disc["candidate_ids"]); assert math.ceil(len(ids)/25)==n
            seen={}
            for base in sources:
                if not base.exists(): continue
                for p in base.rglob("batch_*.json"):
                    d=json.loads(p.read_text()); yy=int(d["draft_year"]); b=int(d["batch_index"]);
                    if yy!=y: continue
                    exp=ids[b*25:min(len(ids),(b+1)*25)]; assert d["candidate_ids"]==exp and d["batch_size"]==25
                    h=hashlib.sha256(p.read_bytes()).hexdigest()
                    if b in seen: assert seen[b][0]==h,(y,b)
                    else: seen[b]=(h,p)
            missing=sorted(set(range(n))-set(seen)); extra=sorted(set(seen)-set(range(n))); assert not missing and not extra,(y,missing,extra)
            yd=out/str(y); yd.mkdir(exist_ok=True)
            flat=[]
            for b in range(n):
                p=seen[b][1]; shutil.copy2(p,yd/f"batch_{b:03d}.json"); flat.extend(json.loads(p.read_text())["candidate_ids"])
            assert flat==ids and len(flat)==len(set(flat))
            print(f"PASS: {y} exact-once {len(ids)} candidates / {n} R25 batches")
        PY
    - name: Aggregate six historical years
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/years"
        for Y in 2018 2019 2020 2021 2022 2023; do
         python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --aggregate-year "$Y" --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json" --batch-dir "${RUNNER_TEMP}/assembled/$Y" --out "${RUNNER_TEMP}/years/year_$Y.json"
        done
        mkdir -p "${RUNNER_TEMP}/years/engine"
        cp "${RUNNER_TEMP}/engine"/* "${RUNNER_TEMP}/years/engine/"
    - name: Validate six-year assembly and write manifest
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os
        from datetime import datetime,timezone
        from pathlib import Path
        root=Path(os.environ["RUNNER_TEMP"]); years=root/"years"; eng=root/"engine"
        sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
        for y in range(2018,2024):
         d=json.loads((years/f"year_{y}.json").read_text()); assert d["draft_year"]==y and d["discovery"]["all_bounded_union_candidates_probed"] is True and d["discovery"]["early_stopping_used"] is False and d["discovery"]["search_errors"]=={}
         for k in ("historical_player_outcomes_read","holdout_2024_outcomes_read","candidate_fit_performed","candidate_scores_computed","candidate_selection_performed","production_change_authorized"): assert d[k] is False
        man={"schema_version":1,"study_id":"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity","stage":"phase2_targeted_recovery_six_year_assembly","generated_at_utc":datetime.now(timezone.utc).isoformat(),
         "candidate_universe_total_n":6203,"r25_batch_total_n":251,"exact_once_coverage":True,"year_output_sha256":{str(y):sha(years/f"year_{y}.json") for y in range(2018,2024)},
         "engine_sha256":sha(eng/"build_r1_r6_source_identity_v7.py"),"identity_asset_manifest_sha256":sha(eng/"r1_r6_identity_asset_manifest_v7.json"),
         "historical_player_outcomes_read":False,"holdout_2024_outcomes_read":False,"candidate_fit_performed":False,"production_change_authorized":False}
        (years/"targeted_recovery_six_years_manifest.json").write_text(json.dumps(man,indent=2,sort_keys=True)+"\n"); print(json.dumps(man,indent=2))
        PY
    - name: Upload complete six-year recovery assembly
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-targeted-recovery-six-years
        path: ${{ runner.temp }}/years/
        if-no-files-found: error
        retention-days: 14
