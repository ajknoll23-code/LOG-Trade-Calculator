name: B25 Schedule Utility V1 - Phase 1D LOG-SAPA Method Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: b25-schedule-utility-v1-phase1d
  cancel-in-progress: false

jobs:
  phase1d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Phase 1C prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/schedule-utility-v1/schedule_utility_v1_phase1c_source_feasibility.json").read_text())
          assert d["status"]=="PASS_PUBLIC_RECONSTRUCTION_FEASIBILITY_EXACT_PROVIDER_ARCHIVE_UNPROVEN"
          assert d["historical_stat_rows_read"] is False
          assert d["historical_outcome_rows_read"] is False
          assert d["phase2_outcome_test_authorized"] is False
          years=d["public_source_catalog"]["historical_weekly_player_stat_years_pre_2026"]
          assert all(y in years for y in range(2015,2026))
          print("PASS: Phase 1C prerequisite verified.")
          PY

      - name: Snapshot production
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Freeze exact LOG-SAPA implementation and preregistration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/schedule-utility-v1
          echo '' | base64 -d > research/schedule-utility-v1/log_sapa_v1.py
          echo '' | base64 -d > research/schedule-utility-v1/schedule_utility_v1_phase1d_log_sapa_prereg.json
          echo '' | base64 -d > research/schedule-utility-v1/schedule_utility_v1_phase1d_log_sapa_prereg.md
          chmod +x research/schedule-utility-v1/log_sapa_v1.py

      - name: Validate exact frozen implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/schedule-utility-v1/log_sapa_v1.py
          python3 research/schedule-utility-v1/log_sapa_v1.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/schedule-utility-v1")
          d=json.loads((root/"schedule_utility_v1_phase1d_log_sapa_prereg.json").read_text())
          sha=hashlib.sha256((root/"log_sapa_v1.py").read_bytes()).hexdigest()
          assert sha==d["implementation"]["sha256"]
          assert d["status"]=="PREREGISTERED_LOG_SAPA_V1_METHOD"
          assert d["historical_stat_rows_read"] is False
          assert d["historical_outcome_rows_read"] is False
          assert d["phase2_outcome_test_authorized"] is False
          assert d["metric"]["is_4for4_afpa"] is False
          f=d["predictor_formula"]
          assert f["rolling_lookback_nfl_weeks"]==10
          assert f["min_opponent_comparison_games"]==2
          assert f["min_defense_adjusted_games"]==3
          g=d["source_bridge_gate_before_historical_outcomes"]
          assert g["pass_rule"]["median_spearman_at_least"]==0.60
          assert g["pass_rule"]["cells_at_or_above_0_50_at_least"]==6
          assert g["pass_rule"]["no_cell_below"]==0.30
          assert g["threshold_tuning_after_observation_authorized"] is False
          print("PASS: exact method, SHA, bridge gate, and firewall validated.")
          PY

      - name: Guard against historical-data access
        shell: bash
        run: |
          set -euo pipefail
          if find research/schedule-utility-v1 -maxdepth 1 -type f \( -name '*.csv' -o -name '*.csv.gz' -o -name '*.parquet' -o -name '*.rds' -o -name '*.qs' \) -print -quit | grep -q .; then
            echo "Unexpected historical data artifact."
            exit 1
          fi
          if grep -n -E '\bcurl\b|\bwget\b|read_csv\(|read_parquet\(|urlopen\(' research/schedule-utility-v1/log_sapa_v1.py; then
            echo "Frozen algorithm contains data-access code."
            exit 1
          fi
          echo "PASS: no historical data access."

      - name: Prove zero production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
          git diff --check
          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi
          echo "PASS: zero production mutation."

      - name: Commit frozen Phase 1D artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add research/schedule-utility-v1/log_sapa_v1.py             research/schedule-utility-v1/schedule_utility_v1_phase1d_log_sapa_prereg.json             research/schedule-utility-v1/schedule_utility_v1_phase1d_log_sapa_prereg.md
          if git diff --cached --quiet; then
            echo "Phase 1D already frozen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Schedule Utility V1 Phase 1D LOG-SAPA method"
          git push origin HEAD:main

      - name: Closeout
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## B25 Schedule Utility V1 - Phase 1D"
            echo "- Decision: **PREREGISTERED_LOG_SAPA_V1_METHOD**"
            echo "- Historical stat rows read: **NO**"
            echo "- Historical target outcomes read: **NO**"
            echo "- Source bridge gate frozen: **YES**"
            echo "- Retuning after bridge: **PROHIBITED**"
            echo "- Phase 2 authorized: **NO**"
            echo "- Production change: **NONE**"
            echo "- Next: **Phase 1E LOG-SAPA source bridge and implementation audit**"
          } >> "$GITHUB_STEP_SUMMARY"
