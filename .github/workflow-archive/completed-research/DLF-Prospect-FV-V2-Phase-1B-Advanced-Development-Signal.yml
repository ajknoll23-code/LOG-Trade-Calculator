  NFLVERSE_PLAYERS_URL: https://github.com/nflverse/nflverse-data/releases/download/players/players.csv
  NFLVERSE_WEEKLY_TEMPLATE: https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_{season}.csv
  V2_ENGINE_SHA256: 8417a9517d9c1095716a6bd3efda0e627b4c0c753a6d25ae7ffc56057d92eedf
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      development_pass: ${{ steps.gate.outputs.development_pass }}
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install frozen research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.3.3' 'openpyxl==3.1.5' 'requests==2.34.2'
    - name: Guard V2 preregistration and canonical outcome implementation
      shell: bash
      run: |
        set -euo pipefail
        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: frozen lineage drift for $path" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "PASS lineage $path $actual"
        }
        check_blob e4bb025b48c7b2d91a7a32af443d16e561520cab \
          .github/workflows/DLF-Prospect-FV-V2-Phase-1A-Advanced-Preregistration.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: V2 preregistration and canonical rookie baseline lineage are exact.'
    - name: Download exact V2 Phase 1A preregistration
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.V2_PHASE1A_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/v2-phase1a
        repository: ${{ github.repository }}
        run-id: ${{ env.V2_PHASE1A_RUN_ID }}
        github-token: ${{ github.token }}
