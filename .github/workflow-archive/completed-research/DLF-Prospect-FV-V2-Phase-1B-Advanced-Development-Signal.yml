    - name: Run V2 2018-2023 development LOYO only
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/v2-development"
        python3 "${RUNNER_TEMP}/dlf_v2_phase1b_core.py" \
          --mode development \
          --repo-root "${GITHUB_WORKSPACE}" \
          --v2 "${RUNNER_TEMP}/v2-phase1a/dlf_prospect_fv_v2_phase1a_preregistration.json" \
          --out-dir "${RUNNER_TEMP}/v2-development"
    - name: Expose sealed V2 confirmation unlock
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        RESULT="${RUNNER_TEMP}/v2-development/dlf_prospect_fv_v2_phase1b_development.json"
        test -f "$RESULT"
        PASS="$(python3 - "$RESULT" <<'PY'
        import json, sys
        d=json.load(open(sys.argv[1]))
        print("true" if d["confirmation_unlock"] is True else "false")
        PY
        )"
        echo "development_pass=${PASS}" >> "$GITHUB_OUTPUT"
        echo "development_pass=${PASS}"
    - name: Prove V2 development made no repository changes
      if: always()
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: V2 development is research-only and repo-clean.'
    - name: Stage exact V2 engine with development result
      if: always()
      shell: bash
      run: |-
        set -euo pipefail
        if [ -f "${RUNNER_TEMP}/dlf_v2_phase1b_core.py" ]; then
          mkdir -p "${RUNNER_TEMP}/v2-development"
          cp "${RUNNER_TEMP}/dlf_v2_phase1b_core.py" "${RUNNER_TEMP}/v2-development/dlf_v2_phase1b_core.py"
        fi
    - name: Upload V2 development result and exact engine
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v2-phase1b-development
        path: ${{ runner.temp }}/v2-development/
        if-no-files-found: warn
        retention-days: 30
  sealed-2024-confirmation:
    needs: development
    if: ${{ needs.development.outputs.development_pass == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install frozen research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.3.3' 'openpyxl==3.1.5' 'requests==2.34.2'
    - name: Guard V2 preregistration and canonical outcome implementation
      shell: bash
      run: |
        set -euo pipefail
        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: frozen lineage drift for $path" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "PASS lineage $path $actual"
        }
        check_blob e4bb025b48c7b2d91a7a32af443d16e561520cab \
          .github/workflows/DLF-Prospect-FV-V2-Phase-1A-Advanced-Preregistration.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: V2 preregistration and canonical rookie baseline lineage are exact.'
    - name: Download exact V2 Phase 1A preregistration
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.V2_PHASE1A_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/v2-phase1a
        repository: ${{ github.repository }}
        run-id: ${{ env.V2_PHASE1A_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Download passing V2 development artifact
      uses: actions/download-artifact@v4
      with:
        name: dlf-prospect-fv-v2-phase1b-development
        path: ${{ runner.temp }}/v2-dev-artifact
    - name: Verify exact V2 engine and stage development result
      shell: bash
      run: |-
        set -euo pipefail
        test -f "${RUNNER_TEMP}/v2-dev-artifact/dlf_v2_phase1b_core.py"
        test -f "${RUNNER_TEMP}/v2-dev-artifact/dlf_prospect_fv_v2_phase1b_development.json"
        printf '%s  %s\n' "$V2_ENGINE_SHA256" "${RUNNER_TEMP}/v2-dev-artifact/dlf_v2_phase1b_core.py" | sha256sum --check --strict
        cp "${RUNNER_TEMP}/v2-dev-artifact/dlf_v2_phase1b_core.py" "${RUNNER_TEMP}/dlf_v2_phase1b_core.py"
        mkdir -p "${RUNNER_TEMP}/v2-development"
        cp "${RUNNER_TEMP}/v2-dev-artifact/dlf_prospect_fv_v2_phase1b_development.json" "${RUNNER_TEMP}/v2-development/dlf_prospect_fv_v2_phase1b_development.json"
        python3 -m py_compile "${RUNNER_TEMP}/dlf_v2_phase1b_core.py"
    - name: Open 2025 outcomes only after V2 development unlock and test 2024
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/v2-confirmation"
        python3 "${RUNNER_TEMP}/dlf_v2_phase1b_core.py" \
          --mode confirmation \
          --repo-root "${GITHUB_WORKSPACE}" \
          --v2 "${RUNNER_TEMP}/v2-phase1a/dlf_prospect_fv_v2_phase1a_preregistration.json" \
          --development "${RUNNER_TEMP}/v2-development/dlf_prospect_fv_v2_phase1b_development.json" \
          --out-dir "${RUNNER_TEMP}/v2-confirmation"
    - name: Prove V2 confirmation made no repository changes
      if: always()
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: V2 sealed confirmation is research-only and repo-clean.'
    - name: Upload sealed V2 2024 confirmation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v2-phase1b-2024-confirmation
        path: ${{ runner.temp }}/v2-confirmation/
        if-no-files-found: warn
        retention-days: 30
