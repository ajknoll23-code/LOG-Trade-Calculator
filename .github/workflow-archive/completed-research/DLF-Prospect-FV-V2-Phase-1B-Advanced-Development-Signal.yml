name: DLF Prospect FV V2 - Phase 1B Advanced Development Signal
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v2-phase1b-advanced-development-signal
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  V2_PHASE1A_RUN_ID: '36089731176'
  V2_PHASE1A_ARTIFACT_ID: '10844863740'
