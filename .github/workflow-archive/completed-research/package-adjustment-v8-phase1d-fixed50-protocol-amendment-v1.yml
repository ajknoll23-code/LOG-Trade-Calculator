name: Package Adjustment V8 - Phase 1D Fixed 50 Protocol Amendment V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-v8-research-writes
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard clean pre-vote state
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-v8"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$D/topology_split_preregistration_v1.json")" = \
            "0861346a483ed9938246fd04173408c47c012ee9"
          test "$(git hash-object "$D/topology_split_power_analysis_v1.json")" = \
            "6d4aae4126443c9550efa0a82586d2f5ccda03c3"
          test "$(git hash-object "$D/catalog_design_contract_v1.json")" = \
            "9f75e427c8d182b8e1ac2bf0ef5759a80d7e2b0c"
          test "$(git hash-object "$D/catalog_design_feasibility_v1.json")" = \
            "f2e6d72d58acea23700807af991f3c0a1103bd05"

          test ! -e "$D/development_catalog_v1.json"
          test ! -e "$D/fixed50_protocol_amendment_v1.json"
          test ! -e "$D/fixed50_protocol_amendment_manifest_v1.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          p=json.loads((d/"topology_split_preregistration_v1.json").read_text())
          power=json.loads((d/"topology_split_power_analysis_v1.json").read_text())
          design=json.loads((d/"catalog_design_contract_v1.json").read_text())

          assert p["status"]=="FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE"
          assert p["power_and_maturity"]["maximum_unique_voters"]==50
          assert p["power_and_maturity"]["vote_direction_may_not_be_read_for_maturity_stopping"] is True
          assert power["selected_first_checkpoint_distinct_voters"]==44
          assert power["coverage_gate_at_or_after_first_checkpoint"]["hard_cap_distinct_voters"]==50
          assert power["v8_vote_outcomes_used_for_power"] is False
          assert design["firewalls"]["v8_votes_read"] is False
          assert design["firewalls"]["development_catalog_generated"] is False
          print("PASS: fixed-50 amendment occurs before catalog generation and before V8 voting.")
          PY

      - name: Freeze exact 50 voter development maturity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          prereg=d/"topology_split_preregistration_v1.json"
          power_path=d/"topology_split_power_analysis_v1.json"
          design=d/"catalog_design_contract_v1.json"
          out=d/"fixed50_protocol_amendment_v1.json"
          man=d/"fixed50_protocol_amendment_manifest_v1.json"
          md=d/"fixed50_protocol_amendment_v1.md"

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()

          p=json.loads(prereg.read_text())
          power=json.loads(power_path.read_text())
          rows={x["distinct_voter_checkpoint"]:x for x in power["checkpoints"]}
          p44=float(rows[44]["conservative_power"])
          p50=float(rows[50]["conservative_power"])
          assert rows[44]["passes_target"] is True
          assert rows[50]["passes_target"] is True
          assert p50>p44
          assert power["v7_vote_outcomes_used_for_power"] is False
          assert power["v8_vote_outcomes_used_for_power"] is False

          now=datetime.now(timezone.utc).isoformat()
          amendment={
            "schema_version":1,
            "study_id":p["study_id"],
            "stage":"phase1d_fixed50_prevote_protocol_amendment",
            "status":"FROZEN_PRE_CATALOG_PRE_VOTE_FIXED_50",
            "generated_at_utc":now,
            "reason":{
              "primary":"Increase development-study power and reduce false-negative risk while still strictly inside the preregistered 50-voter ceiling.",
              "timing":"Frozen before V8 catalog generation and before any V8 votes.",
              "independent_power_source_only":True,
              "v7_vote_outcomes_used":False,
              "v8_vote_outcomes_used":False
            },
            "original_power_plan":{
              "first_qualified_checkpoint":44,
              "conservative_power_at_44":p44,
              "hard_cap":50,
              "conservative_power_at_50":p50
            },
            "amended_development_maturity":{
              "required_accepted_complete_voters":50,
              "required_distinct_voters_per_challenge":50,
              "required_challenges_per_accepted_voter":40,
              "required_accepted_ballots":2000,
              "early_stop_before_50_allowed":False,
              "all_40_answers_required_before_session_acceptance":True,
              "duplicate_voter_challenge_ballot_allowed":False,
              "accepted_voter_may_contribute_more_than_one_ballot_per_challenge":False,
              "incomplete_sessions_count_toward_maturity":False,
              "outcome_blind_maturity_monitor_required":True,
              "vote_direction_may_be_read_for_maturity":False,
              "candidate_predictions_may_be_read_for_maturity":False,
              "candidate_scores_may_be_read_for_maturity":False,
              "freeze_rule":"Freeze the first prefix containing exactly 50 accepted complete voter sessions, each with one valid response to every one of the 40 frozen challenges."
            },
            "unchanged_contract":{
              "candidate_family":True,
              "catalog_topology_counts":True,
              "trade_realism_contract":True,
              "catalog_concentration_metric":True,
              "evaluation_metric":True,
              "evaluation_gates":True,
              "bootstrap_method":True,
              "production_firewall":True,
              "draft_picks_excluded":True
            },
            "activation_requirement":"All subsequent V8 catalog, evaluation, maturity, and voting-activation artifacts must cite this amendment and use fixed-50 maturity.",
            "production_change_authorized":False
          }
          out.write_text(json.dumps(amendment,indent=2,sort_keys=True)+"\n")

          manifest={
            "schema_version":1,
            "study_id":p["study_id"],
            "stage":"phase1d_fixed50_protocol_amendment_manifest",
            "status":amendment["status"],
            "generated_at_utc":now,
            "inputs":{
              "preregistration_sha256":sha(prereg),
              "power_analysis_sha256":sha(power_path),
              "catalog_design_contract_sha256":sha(design)
            },
            "output_sha256":sha(out),
            "catalog_generated":False,
            "v8_votes_read":False,
            "production_change_authorized":False
          }
          man.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          md.write_text(
            "# Package Adjustment V8 — Fixed 50 Pre-Vote Amendment\n\n"
            f"- Conservative power at 44 voters: **{p44:.4f}**\n"
            f"- Conservative power at 50 voters: **{p50:.4f}**\n"
            "- Development maturity is now **exactly 50 complete voters × 40 challenges = 2,000 accepted ballots**.\n"
            "- No early stop at 44.\n"
            "- Incomplete sessions do not count.\n"
            "- Maturity remains strictly outcome-blind.\n"
            "- Candidate, catalog geometry, evaluation gates, and production remain unchanged.\n",
            encoding="utf-8"
          )
          print(json.dumps({
            "decision":"FREEZE_FIXED_50_PREVOTE_AMENDMENT",
            "power_at_44":p44,
            "power_at_50":p50,
            "accepted_complete_voters":50,
            "accepted_ballots":2000,
            "production_change_authorized":False
          },indent=2))
          PY

      - name: Validate amendment and production firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("research/package-adjustment-v8")
          a=json.loads((d/"fixed50_protocol_amendment_v1.json").read_text())
          m=json.loads((d/"fixed50_protocol_amendment_manifest_v1.json").read_text())
          x=a["amended_development_maturity"]
          assert a["status"]=="FROZEN_PRE_CATALOG_PRE_VOTE_FIXED_50"
          assert x["required_accepted_complete_voters"]==50
          assert x["required_distinct_voters_per_challenge"]==50
          assert x["required_challenges_per_accepted_voter"]==40
          assert x["required_accepted_ballots"]==2000
          assert x["early_stop_before_50_allowed"] is False
          assert x["vote_direction_may_be_read_for_maturity"] is False
          assert a["unchanged_contract"]["evaluation_gates"] is True
          assert a["production_change_authorized"] is False
          assert m["output_sha256"]==hashlib.sha256((d/"fixed50_protocol_amendment_v1.json").read_bytes()).hexdigest()
          assert m["catalog_generated"] is False
          assert m["v8_votes_read"] is False
          print("PASS: fixed-50 amendment is frozen before catalog/votes and changes no scientific gate.")
          PY
          python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove exact research-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            research/package-adjustment-v8/fixed50_protocol_amendment_manifest_v1.json
            research/package-adjustment-v8/fixed50_protocol_amendment_v1.json
            research/package-adjustment-v8/fixed50_protocol_amendment_v1.md
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
                  <(printf '%s\n' "${changed[@]}" | sort)

      - name: Commit fixed 50 amendment
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/package-adjustment-v8/fixed50_protocol_amendment_v1.json \
            research/package-adjustment-v8/fixed50_protocol_amendment_manifest_v1.json \
            research/package-adjustment-v8/fixed50_protocol_amendment_v1.md
          git commit -m "Freeze Package Adjustment V8 fixed-50 protocol"
          git fetch origin main
          critical=(
            research/package-adjustment-v8/topology_split_preregistration_v1.json
            research/package-adjustment-v8/topology_split_power_analysis_v1.json
            research/package-adjustment-v8/catalog_design_contract_v1.json
            research/package-adjustment-v8/catalog_design_feasibility_v1.json
          )
          for p in "${critical[@]}"; do
            test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
              echo "ERROR: frozen prerequisite changed during amendment: $p"
              exit 1
            }
          done
          git rebase origin/main
          python3 scripts/validation/check_package_adjustment_live.py
          git push origin HEAD:main
