      - name: Apply candidate to disposable checkout - index.html only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$QF8_TMP/patch.py"
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP QF8 changed outside index.html'; exit 1; }
          git diff --check
