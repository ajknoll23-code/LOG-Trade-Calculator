# QF11 Phase 0 — batch three unresolved evidence tickets; no production or scientific changes.
# Prerequisite: QF10 V9 promoted to main commit 590afe6046aabe3937a4c360c9c1e93a9cf1e08d.
name: QF11 Phase 0 - Three Open Evidence Gates A7 F03 A6 F02 A7 F01 (Read Only)
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  triage:
    name: Reconcile Aaron Donald lineage, voter provenance schema, and DL holdout maturity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact dispatched main without write permissions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing repository regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
      - name: Verify QF10 V9 production lineage and evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP dispatch moved'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty source'; exit 1; }
          git merge-base --is-ancestor 590afe6046aabe3937a4c360c9c1e93a9cf1e08d HEAD || { echo 'STOP QF10 production ancestor missing'; exit 1; }
          pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP source drift: $1"; exit 1; }; }
          pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
          pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
          pin scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
          pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
          pin research/idp-dl-lb-residual-reconciliation-v1/phase2_evaluation.json 01ae185b325c37727dfea1582da12aa0167df3a4
          pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
          echo 'QF11_SOURCE_GATES_GREEN frozen QF10 production and three source contracts match'
      - name: Measure source evidence and approval gates for three audit findings
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qf11-batch-evidence.py <<'QF11_PY'
          from __future__ import annotations
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          root=Path.cwd()
          sys.path.insert(0,str(root/'scripts'/'validation'))
          import snapshot_values

          cfg=snapshot_values.load_from_html(root/'index.html')
          fv=snapshot_values.compute_all_values(cfg)
          market=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())
          uncertainty=json.loads((root/'scripts/artifacts/generated/value_uncertainty.json').read_text())
          assert len(fv)==565, 'STOP unexpected model population'
          assert len(market['players'])==504, 'STOP unexpected market universe'
          assert len(uncertainty['players'])==565, 'STOP missing uncertainty rows'
          assert all(uncertainty['players'][k]['center_value']==v['value'] for k,v in fv.items()), 'STOP stale deployed uncertainty center'
          html=(root/'index.html').read_text()
          assert 'function qf9StatusConflictFlag(' in html, 'STOP QF9 status disclosure absent'
          assert 'function qf9MarketProvenance(' in html, 'STOP QF9 market evidence disclosure absent'

          # A7-F03: examine canonical model and local identity sources; no inference
          # that a Sleeper Active flag proves game participation or a valid multiplier.
          ad=cfg['player_db'].get('aaron donald')
          assert ad and ad['pos']=='DL' and ad['role']=='Speculative', 'STOP unexpected canonical Aaron Donald identity'
          assert cfg['prod_mult'].get('aaron donald')==0.15, 'STOP protected production value moved'
          assert 'aaron donald' in cfg['no_real_history'], 'STOP raw historical lineage changed'
          assert "'aaron donald':{pos:'DL',age:35,role:'Speculative',team:'FA'}" in html, 'STOP static model team changed'
          source_rows=[]
          cache_path=root/'data/players_cache.json'
          if cache_path.exists():
              cache=json.loads(cache_path.read_text())
              # Bound recursion and output; read only publicly safe source-status fields.
              pending=[((),cache)]
              inspected=0
              while pending and inspected<100000:
                  path,node=pending.pop()
                  inspected+=1
                  if isinstance(node,dict):
                      pid=str(node.get('player_id') or node.get('sleeper_id') or node.get('id') or '')
                      nm=str(node.get('full_name') or node.get('name') or '').lower().strip()
                      if (pid=='2227' or nm=='aaron donald') and len(source_rows)<10:
                          source_rows.append({
                              'source':'data/players_cache.json',
                              'matchedStableId':pid=='2227',
                              'status':str(node.get('status') or '')[:40],
                              'team':str(node.get('team') or '')[:15],
                              'position':str(node.get('position') or node.get('pos') or '')[:15],
                          })
                      for k,v in node.items():
                          if isinstance(v,(dict,list)):
                              pending.append((path+(str(k),),v))
                  elif isinstance(node,list):
                      for i,v in enumerate(node):
                          if isinstance(v,(dict,list)):
                              pending.append((path+(str(i),),v))
          out_a7={'modelPos':ad['pos'],'modelAge':ad['age'],'modelRole':ad['role'],
                  'modelTeam':'FA','modelRawProdMultiplier':cfg['prod_mult']['aaron donald'],
                  'modelNoRealHistoryFlag':True,'currentModelFV':fv['aaron donald']['value'],
                  'cacheMatches':source_rows,
                  'ownerDecision':'SOURCE_RECONCILIATION_ONLY_NOT_PRODUCTION_REPRICING',
                  'warning':'Sleeper roster status, active game history, and validated projection are different signals.'}
          print('QF11_A7_F03_MODEL_IDENTITY_GATE '+json.dumps(out_a7,sort_keys=True))

          # A6-F02: contrast player-specific evidence required by the UI with
          # fields actually shipped; global concentration is not individual support.
          fields=('same_position_pairwise_observations','same_position_enough_data','dominant_voter_share_pct')
          present={f:sum(f in (row.get('evidence') or {}) for row in market['players'].values()) for f in fields}
          missing_all=sum(all(f not in (row.get('evidence') or {}) for f in fields) for row in market['players'].values())
          assert missing_all==504 and all(n==0 for n in present.values()), 'STOP per-player provenance schema already populated; re-review'
          assert market.get('market_quality',{}).get('largest_effective_voter_share_pct') is not None, 'STOP global voter diagnostics missing'
          rb=[k for k,v in fv.items() if v['pos']=='RB']
          valid_market=sum(market['players'].get(k,{}).get('fundamental_value')==fv[k]['value'] for k in rb)
          assert (len(rb),valid_market)==(97,33), 'STOP RB Market Value state changed; re-review'
          out_a6={'coveredMarketPlayers':len(market['players']),
                  'allThreeRequiredDirectEvidenceFieldsAbsentForPlayers':missing_all,
                  'eachFieldPresentCounts':present,
                  'globalTopVoterShareNotPlayerSpecific':True,
                  'currentRbMarketVisible':valid_market,'currentRbUncertaintyVisible':len(rb),
                  'decision':'DIRECT_PAIRWISE_PROVENANCE_REQUIRES_A_SOURCE_LINKED_INDEPENDENT_DERIVATION',
                  'notApproved':'no vote weights changed, no market recalibration, no per-player data invented'}
          print('QF11_A6_F02_MARKET_PROVENANCE_GATE '+json.dumps(out_a6,sort_keys=True))

          # A7-F01: honor existing prospectively frozen scientific gate, not a
          # readiness decision based on a wall-clock date or diagnostic sample.
          p=json.loads((root/'research/idp-dl-lb-residual-reconciliation-v1/phase2_evaluation.json').read_text())
          assert p['status']=='COLLECTION_ONLY', 'STOP reconciliation gate changed; inspect new decision'
          assert p['completed_consecutive_eligible_prefix']==[4], 'STOP new eligible data detected; re-review'
          assert p['first_eligible_future_week']==4, 'STOP first eligible week changed'
          assert p['pre_discovery_weeks_permanently_excluded']==[1,2,3], 'STOP pre-discovery holdout changed'
          for f in ('calibration_claim_authorized','deployment_authorized','production_change_authorized','sensitivity_selection_authorized','stability_claim_authorized'):
              assert p[f] is False, f'STOP altered eligibility: {f}'
          out_a7f01={'candidate':p['candidate_id'],'control':p['control_id'],
                     'completedEligibleWeeks':p['completed_consecutive_eligible_prefix'],
                     'frozenResultStatus':p['status'],'frozenEvaluatedAtUtc':p['evaluated_at_utc'],
                     'deployedValueChangesAuthorized':False,
                     'next': 'future eligible-week outcome capture then preregistered evaluation; no calibration yet'}
          print('QF11_A7_F01_RESIDUAL_HOLDOUT_GATE '+json.dumps(out_a7f01,sort_keys=True))
          print('QF11_PHASE0_GREEN: 3 original tickets triaged; no original ticket closed and no model/market/data change authorized')
          QF11_PY
          python3 -m py_compile /tmp/qf11-batch-evidence.py
          python3 /tmp/qf11-batch-evidence.py
      - name: Protect deployed formulas and frozen-science regression groups
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/snapshot_values.py --selftest
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          echo 'QF11_EXISTING_14_REGRESSIONS_GREEN'
      - name: Verify zero repository writes and protected production hashes
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP this was not read only'; exit 1; }
          [[ "$(git hash-object index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
          [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || exit 1
          [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || exit 1
          echo 'QF11_ZERO_WRITE_GREEN original seven ticket statuses unchanged; production preserved'
