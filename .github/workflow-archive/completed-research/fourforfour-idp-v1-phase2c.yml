      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove Phase 2C made no repository changes
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .; then
            echo 'ERROR: Phase 2C modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi

          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: Phase 2C staged repository changes.' >&2
            git diff --cached -- .
            exit 1
          fi

          echo 'PASS: Phase 2C and regressions left the repository unchanged.'

      - name: Destroy private inputs and row-level outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-idp-v1
          rm -f /tmp/fourforfour-phase2c.py /tmp/fourforfour-phase2c.py.b64
          echo 'PASS: private provider inputs and row-level outputs removed from runner.'
