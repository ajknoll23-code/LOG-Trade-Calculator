# PREFLIGHTED: B17E_2013_JOINT_FEASIBILITY_ADMISSION
name: B17E Draft Capital Outlook V1 - 2013 Joint Feasibility Admission

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b17e:
    name: Admit 2013 only if projected and actual top-60 feasibility both pass
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "beautifulsoup4==4.14.2" \
            "requests==2.34.2"

      - name: Guard B17D source-only result and firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          s=json.loads((D/"b17d/b17d_summary.json").read_text())
          e=json.loads((D/"b17d/b17d_source_only_expansion_summary.json").read_text())
          f=json.loads((D/"b17d/b17d_firewall_and_exposure_ledger.json").read_text())
          y=json.loads((D/"b17d/source-expansion/2013/result.json").read_text())

          assert s["decision"]=="COMPLETE_B17D_SOURCE_ONLY_AUDIT_NO_C1_AUTHORITY"
          assert s["existing_accepted_n"]==10
          assert s["transport_feasible_candidate_years"]==[2013]
          assert s["regime_modal_match_candidate_years"]==[2013]
          assert s["provisional_max_regime_matching_n"]==11
          assert s["exploratory_b18_redesign_authorized"] is True
          assert s["confirmatory_c1_authorized"] is False
          assert s["capital_values_computed"] is False
          assert s["predictor_target_association_opened"] is False
          assert s["production_change_authorized"] is False

          assert e["strict_v3_split3_feasible_years"]==[2013]
          assert e["transport_feasible_years"]==[2013]
          assert e["new_classes_auto_admitted"] is False

          assert y["class_year"]==2013
          assert y["strict_split3_feasible"] is True
          assert y["selected_mode"]=="STRICT_SPLIT3"
          assert y["selected_shared_last_update_date"]=="2012-10-02"
          assert y["selected_distance_days"]==2
          assert y["selected_combined_entry_n"]>=60
          assert y["fantasy_position_counts_computed"] is False
          assert y["capital_values_computed"] is False
          assert y["predictor_target_association_opened"] is False

          expected={
              "base":"3fc8782a5ec188c5d6aac3c05c1ea8efd3d7ef7420e917baa5cefc9c6371e009",
              "round1_remainder":"a27cd03795fc0105d8a5199da349b2300e9dd81fbfba4977e5277a49698108d4",
              "round2":"7917aaa315009e36504b22c8d8ac8dcc4019798b1c7f83bc12a3e2374b983800",
          }
          for role,sha in expected.items():
              p=D/f"b17d/source-expansion/2013/raw/{role}.html"
              assert p.is_file(),p
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==sha,(role,sha,got)

          assert f["disclosure"]["predictor_target_association_remains_unopened"] is True
          assert f["disclosure"]["historical_2014_2023_is_not_pristine_under_strict_marginal_blinding"] is True

          print("PASS: B17D permits 2013 joint-feasibility admission audit only.")
          print("PASS: real capital association remains unopened.")
          PY

      - name: Guard original B17 target and predictor contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          p=json.loads((D/"b17_protocol_frozen.json").read_text())

          assert p["predictor_contract"]["top_slot_cutoff"]==60
          assert p["predictor_contract"]["fantasy_primary_positions"]==["QB","RB","FB","WR","TE"]
          assert p["predictor_contract"]["position_mapping"]=={
              "QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"
          }
          assert p["predictor_contract"]["position_interpretation"].startswith("Use the first listed position token only")

          a=p["actual_target_contract"]
          assert a["source_name"]=="nflverse nfldata draft_picks.csv"
          assert a["source_url"]=="https://raw.githubusercontent.com/nflverse/nfldata/master/data/draft_picks.csv"
          assert a["top_slot_cutoff"]==60
          assert a["required_columns"]==["season","round","pick","pfr_name","position"]
          assert a["fantasy_primary_positions"]==["QB","RB","FB","WR","TE"]
          assert a["position_mapping"]=={
              "QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"
          }

          g=p["feasibility_gate"]
          assert g["predictor_minimum_unique_slots_through_60"]==58
          assert g["predictor_must_reach_slot_60"] is True
          assert g["target_minimum_observed_selections_at_or_below_60"]==58
          assert g["target_must_contain_or_span_through_pick_60"] is True

          print("PASS: B17 scientific parsing/feasibility contracts reused unchanged.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B17E admission protocol before target download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b17e
          python3 - <<'PY'
          import json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b17e")
          protocol={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17e_2013_joint_feasibility_admission_protocol",
              "frozen_before_target_download":True,
              "class_year":2013,
              "purpose":"Decide only whether 2013 may join the exploratory Draft Capital historical sample as the 11th class.",

              "source_authority":{
                  "predictor":"B17D selected strict split3 family dated 2012-10-02",
                  "actual":"Same nflverse nfldata draft_picks.csv source URL used by frozen B17"
              },

              "projected_contract":{
                  "top_slot_cutoff":60,
                  "parser":"B17 V2 bold Team: Player, POS, School parser in page order",
                  "page_order":["base","round1_remainder","round2"],
                  "overall_selection_definition":"Sequential selection order 1..60 after concatenating the frozen source pages.",
                  "minimum_unique_slots_through_60":58,
                  "must_reach_slot_60":True,
                  "fantasy_primary_positions":["QB","RB","FB","WR","TE"],
                  "position_mapping":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
                  "position_interpretation":"First listed position token only."
              },

              "actual_contract":{
                  "source_url":"https://raw.githubusercontent.com/nflverse/nfldata/master/data/draft_picks.csv",
                  "required_columns":["season","round","pick","pfr_name","position"],
                  "top_slot_cutoff":60,
                  "minimum_observed_selections_at_or_below_60":58,
                  "must_reach_pick_60":True,
                  "fantasy_primary_positions":["QB","RB","FB","WR","TE"],
                  "position_mapping":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
                  "source_drift_guard":"Current nflverse pick+position sequence for every 2014-2023 top-60 selection must exactly match the already-frozen B17 actual artifacts before 2013 can be admitted."
              },

              "joint_pass_rule":"2013 projected feasible AND 2013 actual feasible AND 2014-2023 actual-source parity guard passes.",

              "decisions":{
                  "pass":"PASS_B17E_2013_JOINT_FEASIBILITY_ADMIT_2013_AUTHORIZE_B18_EXPLORATORY_POWER_PREREGISTRATION_N11",
                  "fail":"STOP_B17E_2013_JOINT_FEASIBILITY_NOT_ESTABLISHED"
              },

              "non_authority":{
                  "capital_values_computed":False,
                  "predictor_target_correlation_computed":False,
                  "model_fit_performed":False,
                  "c1_executed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }
          }
          (O/"b17e_protocol.json").write_text(json.dumps(protocol,indent=2,sort_keys=True)+"\n")
          print("PASS: B17E admission protocol frozen before nflverse target download.")
          PY

      - name: Parse frozen 2013 projected top-60
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b17e"
          P=json.loads((O/"b17e_protocol.json").read_text())

          label_rx=re.compile(
              r"^\s*(?P<team>[^:]{2,100}):\s*(?P<player>.+?),\s*"
              r"(?P<pos>[A-Za-z0-9/-]{1,20}),\s*(?P<school>.+?)\s*$"
          )

          def norm(s):
              return " ".join(str(s).replace("\xa0"," ").split())

          def parse(path,role):
              soup=BeautifulSoup(Path(path).read_bytes(),"html.parser")
              rows=[]
              seen=set()
              for b in soup.find_all(["b","strong"]):
                  txt=norm(b.get_text(" ",strip=True))
                  m=label_rx.match(txt)
                  if not m:
                      continue
                  row={
                      "team":norm(m.group("team")),
                      "player":norm(m.group("player")),
                      "position_raw":norm(m.group("pos")).upper(),
                      "school":norm(m.group("school")),
                      "source_page_role":role
                  }
                  key=(row["team"],row["player"],row["position_raw"],row["school"])
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append(row)
              return rows

          roles=["base","round1_remainder","round2"]
          rows=[]
          page_counts={}
          for role in roles:
              path=D/f"b17d/source-expansion/2013/raw/{role}.html"
              parsed=parse(path,role)
              page_counts[role]=len(parsed)
              rows.extend(parsed)

          for i,row in enumerate(rows,1):
              row["pick"]=i

          top=rows[:60]
          fantasy=set(P["projected_contract"]["fantasy_primary_positions"])
          mapping=P["projected_contract"]["position_mapping"]
          frows=[]
          counts={"QB":0,"RB":0,"WR":0,"TE":0}
          for r in top:
              primary=r["position_raw"].split("/")[0].strip().upper()
              r["primary_position"]=primary
              fp=mapping.get(primary) if primary in fantasy else None
              r["fantasy_position"]=fp
              if fp:
                  frows.append({
                      "pick":r["pick"],
                      "player":r["player"],
                      "position_raw":r["position_raw"],
                      "primary_position":primary,
                      "fantasy_position":fp
                  })
                  counts[fp]+=1

          unique_slots=len({r["pick"] for r in top if 1<=r["pick"]<=60})
          reaches=bool(top and top[-1]["pick"]>=60)
          feasible=bool(
              unique_slots>=P["projected_contract"]["minimum_unique_slots_through_60"]
              and reaches
          )

          out={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17e_2013_projected_top60",
              "class_year":2013,
              "source_date":"2012-10-02",
              "page_counts":page_counts,
              "combined_parsed_n":len(rows),
              "top60_rows":top,
              "unique_slot_n_through_60":unique_slots,
              "reaches_slot_60":reaches,
              "fantasy_rows":frows,
              "fantasy_row_n":len(frows),
              "fantasy_counts":counts,
              "parse_feasible":feasible,
              "capital_values_computed":False,
              "predictor_target_correlation_computed":False,
              "model_fit_performed":False,
              "production_change_authorized":False
          }
          (O/"2013_projected_top60.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")

          assert out["combined_parsed_n"]>=60
          assert out["unique_slot_n_through_60"]==60
          assert out["reaches_slot_60"] is True
          assert out["parse_feasible"] is True
          print(f"PASS: 2013 projected top-60 feasible; fantasy rows={out['fantasy_row_n']}.")
          PY

      - name: Download same B17 nflverse source and prove 2014-2023 parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,io,json
          from pathlib import Path
          import requests

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b17e"
          P=json.loads((O/"b17e_protocol.json").read_text())
          url=P["actual_contract"]["source_url"]

          r=requests.get(url,timeout=45)
          r.raise_for_status()
          raw=r.content
          source_sha=hashlib.sha256(raw).hexdigest()
          rows=list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))

          required=set(P["actual_contract"]["required_columns"])
          assert rows, "empty nflverse draft source"
          assert required.issubset(rows[0].keys()),(required,rows[0].keys())

          def yr_rows(year):
              xs=[]
              for row in rows:
                  try:
                      season=int(row["season"])
                      pick=int(row["pick"])
                  except (TypeError,ValueError):
                      continue
                  if season!=year or not (1<=pick<=60):
                      continue
                  xs.append({
                      "pick":pick,
                      "round":int(row["round"]),
                      "player":str(row["pfr_name"]).strip(),
                      "position_raw":str(row["position"]).strip().upper()
                  })
              xs.sort(key=lambda x:x["pick"])
              return xs

          parity={}
          for year in range(2014,2024):
              cur=yr_rows(year)
              frozen=json.loads(
                  (D/f"archive/historical-anchor-parsing/target/{year}_actual_top60.json").read_text()
              )["top60_slots"]

              cur_sig=[(x["pick"],x["position_raw"]) for x in cur]
              frozen_sig=[(int(x["pick"]),str(x["position_raw"]).strip().upper()) for x in frozen if x["selection_present"]]
              ok=(cur_sig==frozen_sig)
              parity[str(year)]={
                  "current_observed_n":len(cur),
                  "frozen_observed_n":len(frozen_sig),
                  "pick_position_sequence_exact_match":ok
              }
              assert ok,(year,cur_sig[:10],frozen_sig[:10])

          out={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17e_nflverse_source_parity",
              "source_url":url,
              "retrieved_sha256":source_sha,
              "retrieved_bytes":len(raw),
              "parity_2014_2023":parity,
              "all_2014_2023_pick_position_sequences_match":all(
                  x["pick_position_sequence_exact_match"] for x in parity.values()
              ),
              "capital_values_computed":False,
              "predictor_target_correlation_computed":False,
              "production_change_authorized":False
          }
          (O/"b17e_nflverse_source_parity.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          Path("/tmp/b17e_draft_picks.csv").write_bytes(raw)

          assert out["all_2014_2023_pick_position_sequences_match"] is True
          print("PASS: current nflverse pick+position sequence exactly matches frozen B17 actual artifacts for 2014-2023.")
          PY

      - name: Build 2013 actual top-60 feasibility artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b17e"
          P=json.loads((O/"b17e_protocol.json").read_text())

          rows=list(csv.DictReader(Path("/tmp/b17e_draft_picks.csv").read_text(encoding="utf-8-sig").splitlines()))
          xs=[]
          for row in rows:
              try:
                  season=int(row["season"])
                  pick=int(row["pick"])
                  rnd=int(row["round"])
              except (TypeError,ValueError):
                  continue
              if season!=2013 or not (1<=pick<=60):
                  continue
              xs.append({
                  "pick":pick,
                  "round":rnd,
                  "player":str(row["pfr_name"]).strip(),
                  "position_raw":str(row["position"]).strip().upper()
              })

          xs.sort(key=lambda x:x["pick"])
          dup=[p for p,n in Counter(x["pick"] for x in xs).items() if n>1]
          assert not dup,dup

          fantasy=set(P["actual_contract"]["fantasy_primary_positions"])
          mapping=P["actual_contract"]["position_mapping"]
          for x in xs:
              primary=x["position_raw"].split("/")[0].strip().upper()
              x["primary_position"]=primary
              x["fantasy_position"]=mapping.get(primary) if primary in fantasy else None
              x["selection_present"]=True

          frows=[x.copy() for x in xs if x["fantasy_position"]]
          counts={"QB":0,"RB":0,"WR":0,"TE":0}
          for x in frows:
              counts[x["fantasy_position"]]+=1

          observed=len(xs)
          reaches=bool(xs and max(x["pick"] for x in xs)>=60)
          feasible=bool(
              observed>=P["actual_contract"]["minimum_observed_selections_at_or_below_60"]
              and reaches
          )

          out={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17e_2013_actual_top60",
              "class_year":2013,
              "top60_slots":xs,
              "observed_selection_n_at_or_below_60":observed,
              "reaches_pick_60":reaches,
              "duplicate_pick_n":0,
              "duplicate_picks":[],
              "fantasy_rows":frows,
              "fantasy_row_n":len(frows),
              "fantasy_counts":counts,
              "target_parse_feasible":feasible,
              "capital_values_computed":False,
              "predictor_target_correlation_computed":False,
              "model_fit_performed":False,
              "production_change_authorized":False
          }
          (O/"2013_actual_top60.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")

          assert observed==60,observed
          assert reaches is True
          assert feasible is True
          print(f"PASS: 2013 actual top-60 feasible; fantasy rows={out['fantasy_row_n']}.")
          PY

      - name: Freeze B17E decision and n=11 admission manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b17e")
          P=json.loads((O/"b17e_protocol.json").read_text())
          X=json.loads((O/"2013_projected_top60.json").read_text())
          A=json.loads((O/"2013_actual_top60.json").read_text())
          S=json.loads((O/"b17e_nflverse_source_parity.json").read_text())

          passed=bool(
              X["parse_feasible"]
              and A["target_parse_feasible"]
              and S["all_2014_2023_pick_position_sequences_match"]
          )
          decision=P["decisions"]["pass"] if passed else P["decisions"]["fail"]

          summary={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17e_summary",
              "decision":decision,
              "joint_feasibility_pass":passed,
              "newly_admitted_class_years":[2013] if passed else [],
              "exploratory_historical_class_years":list(range(2013,2024)) if passed else list(range(2014,2024)),
              "exploratory_historical_class_n":11 if passed else 10,
              "b18_exploratory_power_preregistration_authorized":passed,
              "confirmatory_c1_authorized":False,
              "capital_values_computed":False,
              "predictor_target_correlation_computed":False,
              "model_fit_performed":False,
              "c1_executed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (O/"b17e_summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")

          files=[
              "b17e_protocol.json",
              "2013_projected_top60.json",
              "b17e_nflverse_source_parity.json",
              "2013_actual_top60.json",
              "b17e_summary.json"
          ]
          hashes={name:hashlib.sha256((O/name).read_bytes()).hexdigest() for name in files}
          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17e_manifest",
              "decision":decision,
              "joint_feasibility_pass":passed,
              "exploratory_historical_class_n":summary["exploratory_historical_class_n"],
              "output_hashes":hashes,
              "b18_exploratory_power_preregistration_authorized":passed,
              "confirmatory_c1_authorized":False,
              "capital_values_computed":False,
              "predictor_target_correlation_computed":False,
              "production_change_authorized":False
          }
          (O/"b17e_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          print(json.dumps(summary,indent=2))
          PY

      - name: Post-B17E repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove B17E research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b17e/")
              for p in touched
          ),touched
          assert not any(
              p=="index.html"
              or p=="free-agent-board.html"
              or p.startswith(("data/","model/","scripts/"))
              for p in touched
          ),touched
          print("PASS: B17E mutations are research-only.")
          PY

      - name: Commit B17E admission result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17E."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/draft-capital-outlook-v1/b17e/
          git diff --cached --check
          git commit -m "Audit 2013 Draft Capital joint feasibility"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17E admission result committed."
