              .read_text(encoding="utf-8")
          )
          prereg = json.loads(
              (base / "player_role_v2_b41c_model_development_preregistration.json")
              .read_text(encoding="utf-8")
          )

          assert scorer["model_fit_performed"] is False
          assert scorer["predictor_target_association_computed"] is False
          assert scorer["holdout_2025_opened"] is False
          assert scorer["production_change_authorized"] is False

          assert hist["holdout_2025_requested"] is False
          assert hist["model_fit_performed"] is False
          assert hist["predictor_target_association_computed"] is False
          assert hist["production_change_authorized"] is False

          ready = bool(scorer["pass"] and hist["pass"])
          decision = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C-scientific-decision",
              "scorer_validation_pass": scorer["pass"],
              "historical_target_source_feasibility_pass": hist["pass"],
              "ready_for_B41D_development_model_fitting": ready,
              "result": (
                  "PASS_READY_FOR_B41D"
                  if ready
                  else "STOP_BEFORE_MODEL_FIT"
              ),
              "league_scoring_settings_frozen": True,
              "roster_positions_frozen": league["roster_positions"],
              "frozen_scorer_sha256": prereg["frozen_scorer_sha256"],
