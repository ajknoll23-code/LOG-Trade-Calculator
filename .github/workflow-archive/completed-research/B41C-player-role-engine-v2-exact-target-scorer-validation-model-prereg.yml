            "$BASE/player_role_v2_b41c_scorer_validation.json" \
            "$BASE/player_role_v2_b41c_historical_target_source_feasibility.json" \
            "$BASE/player_role_v2_b41c_scientific_decision.json" \
            "$BASE/player_role_v2_b41c_report.md"

