              "role_weights_derived": False,
              "role_thresholds_derived": False,
              "production_change_authorized": False,
          }

          (base / "player_role_v2_b41c_scientific_decision.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          report = [
              "# Player Role V2 — B41C Target Scorer Validation",
              "",
              f"- Scientific result: **{decision['result']}**",
              f"- Compared player-weeks: **{scorer['compared_player_weeks']:,}**",
              (
                  "- Fraction matching Sleeper within tolerance: "
                  f"**{scorer['within_tolerance_fraction']:.4%}**"
              ),
              f"- Mean absolute scoring error: **{scorer['mean_absolute_error']:.6f}**",
              f"- Maximum absolute scoring error: **{scorer['max_absolute_error']:.6f}**",
              f"- Frozen scorer validation passed: **{scorer['pass']}**",
              (
                  "- Historical Sleeper target-source feasibility passed: "
                  f"**{hist['pass']}**"
              ),
              "- 2025 holdout opened: **No**",
              "- Model fit performed: **No**",
              "- Predictor-target association computed: **No**",
              "- Role weights derived: **No**",
              "- Role thresholds derived: **No**",
              "- Production change authorized: **No**",
              "",
              "## Current Sleeper scoring contract",
              "",
              f"- League season: **{league['season']}**",
              f"- Roster positions: `{league['roster_positions']}`",
              f"- Frozen scorer SHA256: `{decision['frozen_scorer_sha256']}`",
              "",
          ]

          if scorer["largest_mismatches"]:
              report += ["## Largest scorer mismatches", ""]
              for row in scorer["largest_mismatches"][:10]:
                  report.append(
                      f"- W{row['week']} player {row['player_id']}: "
                      f"Sleeper={row['sleeper_custom_points']:.3f}, "
                      f"frozen={row['frozen_scorer_points']:.3f}, "
                      f"abs error={row['abs_error']:.3f}"
                  )
              report.append("")

          (base / "player_role_v2_b41c_report.md").write_text(
              "\n".join(report),
              encoding="utf-8",
          )

          print(json.dumps(decision, indent=2))
          PY

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA_BEFORE"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA_BEFORE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

