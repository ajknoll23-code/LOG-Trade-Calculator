name: B41C Player Role Engine V2 - Exact League Target Scorer Validation and Model Preregistration

'on':
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  freeze_and_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests>=2.32,<3"

      - name: Verify B41A and B41B scientific firewall
        shell: bash
        run: |
          set -euo pipefail

          BASE="research/player-role-v2"
          test -f "$BASE/player_role_v2_b41a_scientific_preregistration.json"
          test -f "$BASE/player_role_v2_b41a_source_feasibility.json"
          test -f "$BASE/player_role_v2_b41b_cohort_audit.json"
          test -f "$BASE/player_role_v2_b41b_cohort_manifest.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          p = json.loads(
              (base / "player_role_v2_b41a_scientific_preregistration.json")
              .read_text(encoding="utf-8")
          )
          f = json.loads(
              (base / "player_role_v2_b41a_source_feasibility.json")
              .read_text(encoding="utf-8")
          )
          a = json.loads(
              (base / "player_role_v2_b41b_cohort_audit.json")
              .read_text(encoding="utf-8")
          )
          m = json.loads(
              (base / "player_role_v2_b41b_cohort_manifest.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "PREREGISTERED_BEFORE_ANY_MODEL_FIT_OR_TARGET_ASSOCIATION"
          assert p["population"]["development_seasons"] == [2019, 2020, 2021, 2022, 2023, 2024]
          assert p["population"]["untouched_holdout_season"] == 2025
          assert f["decision"]["historical_projection_features_admitted"] is False

          assert a["cohort_row_count"] == 85740
          assert a["holdout_rows_read"] == 0
          assert a["historical_projection_features_used"] is False
          assert a["model_fit_performed"] is False
          assert a["predictor_target_association_computed"] is False
          assert a["role_weights_derived"] is False
          assert a["role_thresholds_derived"] is False
          assert a["production_change_authorized"] is False
          assert all(a["leakage_checks"].values())

          assert m["cohort_row_count"] == 85740
          assert m["holdout_opened"] is False
          assert m["model_fit_performed"] is False
          assert m["production_change_authorized"] is False

          print("PASS: B41A/B41B scientific firewall verified.")
          print("Development cohort rows:", a["cohort_row_count"])
          print("2025 holdout opened: false")
          print("Model fit performed: false")
          PY

          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Freeze target scorer and model-development contract before validation data
        shell: bash
        run: |
          set -euo pipefail

          BASE="research/player-role-v2"
          SCORER="$BASE/player_role_v2_b41c_target_scorer.py"
          PREREG="$BASE/player_role_v2_b41c_model_development_preregistration.json"

          cat > "$SCORER" <<'PYFILE'
          #!/usr/bin/env python3
          """
          Player Role V2 target scorer.

          Frozen before B41C reads 2026 Sleeper matchup points.
          """

          from __future__ import annotations
          import math

          SCORER_VERSION = "player-role-v2-b41c-v1"

          def n(stats, key):
              value = stats.get(key, 0)
              try:
                  x = float(value or 0)
              except (TypeError, ValueError):
                  return 0.0
              return x if math.isfinite(x) else 0.0

          def score_week(stats):
              pts = 0.0

              pass_yd = n(stats, "pass_yd")
              pts += pass_yd * 0.04
              pts += n(stats, "pass_td") * 4.0
              pts += n(stats, "pass_2pt") * 2.0
              pts += n(stats, "pass_int") * -2.0
              if pass_yd >= 400:
                  pts += 3.0
              elif pass_yd >= 300:
                  pts += 2.0

              rush_yd = n(stats, "rush_yd")
              pts += n(stats, "rush_att") * 0.2
              pts += rush_yd * 0.1
              pts += n(stats, "rush_td") * 6.0
              pts += n(stats, "rush_2pt") * 2.0
              if rush_yd >= 200:
                  pts += 3.0
              elif rush_yd >= 100:
                  pts += 2.0

              rec_yd = n(stats, "rec_yd")
              pts += n(stats, "rec") * 0.5
              pts += rec_yd * 0.1
              pts += n(stats, "rec_td") * 6.0
              pts += n(stats, "rec_2pt") * 2.0
              if rec_yd >= 200:
                  pts += 3.0
              elif rec_yd >= 100:
                  pts += 2.0

              pts += n(stats, "fum_lost") * -2.0
              pts += n(stats, "fum_rec_td") * 6.0

              solo = n(stats, "idp_tkl_solo")
              ast = n(stats, "idp_tkl_ast")
              pts += solo * 1.5
              pts += ast * 0.75
              pts += n(stats, "idp_tkl_loss") * 2.0

              sacks = n(stats, "idp_sack")
              if sacks == 0:
                  sacks = n(stats, "sack")
              pts += sacks * 3.0
              pts += n(stats, "idp_qb_hit") * 2.0

              ints = n(stats, "idp_int")
              if ints == 0:
                  ints = n(stats, "int")
              pts += ints * 6.0
              pts += n(stats, "idp_fum_rec") * 4.0
              pts += n(stats, "idp_ff") * 3.0
              pts += n(stats, "idp_safety") * 3.0
              pts += n(stats, "blk_kick") * 6.0
              pts += n(stats, "idp_td") * 6.0

              pd = n(stats, "idp_pass_def")
              pts += pd * 3.0

              if (solo + ast) >= 10:
                  pts += 2.0
              if sacks >= 2:
                  pts += 2.0
              if pd >= 3:
                  pts += 2.0

              pts += n(stats, "st_td") * 6.0
              pts += n(stats, "st_ff") * 3.0
              pts += n(stats, "st_fum_rec") * 3.0

              return round(pts, 6)

          def selftest():
              assert score_week({}) == 0.0
              assert score_week({"pass_yd": 299}) == round(299 * 0.04, 6)
              assert score_week({"pass_yd": 300}) == 14.0
              assert score_week({"pass_yd": 400}) == 19.0
              assert score_week({"rush_yd": 100}) == 12.0
              assert score_week({"rush_yd": 200}) == 23.0
              assert score_week({"rec_yd": 100}) == 12.0
              assert score_week({"rec_yd": 200}) == 23.0
              assert score_week({"idp_tkl_solo": 10}) == 17.0
              assert score_week({"idp_sack": 2}) == 8.0
              assert score_week({"idp_pass_def": 3}) == 11.0
              assert score_week({"st_td": 1, "st_ff": 1, "st_fum_rec": 1}) == 12.0
              print("SELFTEST PASS")

          if __name__ == "__main__":
              selftest()
          PYFILE

          python3 -m py_compile "$SCORER"
          python3 "$SCORER"

          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          scorer = base / "player_role_v2_b41c_target_scorer.py"

          contract = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C-target-scorer-and-development-preregistration",
              "status": "PREREGISTERED_BEFORE_SCORER_VALIDATION_OR_MODEL_FIT",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),

              "frozen_target": {
                  "primary_target": (
                      "mean frozen-league-scored fantasy points per active game "
                      "over the next four active games, transformed to an "
                      "origin-week within-position midrank percentile"
                  ),
                  "primary_horizon_active_games": 4,
                  "minimum_future_active_games": 2,
                  "two_game_and_six_game_horizons": "sensitivity_only",
                  "injury_absence_scored_as_zero": False,
                  "target_source_if_validation_passes": (
                      "Sleeper historical weekly raw stats scored by the frozen B41C scorer"
                  ),
                  "b41b_nflverse_future_components_use": (
                      "leakage/audit witness only; not substituted for exact custom scoring"
                  ),
              },

              "scorer_validation": {
                  "validation_season": 2026,
                  "validation_weeks": [1, 2, 3],
                  "validation_truth": (
                      "Sleeper league matchup players_points under current custom scoring"
                  ),
                  "validation_input": "Sleeper weekly raw player stats",
                  "absolute_tolerance_points": 0.011,
                  "required_compared_player_weeks": 500,
                  "required_fraction_within_tolerance": 0.995,
                  "required_max_abs_error_if_any_nonzero_error": 0.051,
                  "scorer_may_be_changed_after_validation": False,
                  "failure_action": (
                      "scientific STOP; a new versioned scorer must be preregistered "
                      "before any model fitting"
                  ),
              },

              "historical_target_source_feasibility": {
                  "development_seasons": [2019, 2020, 2021, 2022, 2023, 2024],
                  "sample_weeks_per_season": [4, 8, 12, 16],
                  "holdout_season_2025_probed": False,
                  "minimum_players_per_sample_week": 100,
                  "full_historical_download_deferred_until_scorer_pass": True,
              },

              "development_feature_policy": {
                  "historical_projection_features_used": False,
                  "candidate_predictors": (
                      "Only B41A-preregistered objective usage, snap-share and "
                      "historical production signals from frozen B41B cohort"
                  ),
                  "continuous_feature_normalization": (
                      "within-position, origin-week midrank percentile"
                  ),
                  "owner_identity_used": False,
                  "dynasty_team_used": False,
              },

              "model_family_preregistration": {
                  "fit_separately_by_position": True,
                  "development_seasons": [2019, 2020, 2021, 2022, 2023, 2024],
                  "outer_validation": (
                      "leave-one-season-out cross-validation; each season held out once"
                  ),
                  "candidate_1": {
                      "name": "best_single_signal_baseline",
                      "selection": (
                          "single eligible normalized signal with lowest outer-CV MAE"
                      ),
                  },
                  "candidate_2": {
                      "name": "nonnegative_ridge_linear",
                      "fit": (
                          "nonnegative coefficients; intercept allowed; squared-error "
                          "objective with L2 regularization"
                      ),
                      "alpha_grid": [0.0, 0.01, 0.1, 1.0, 10.0],
                      "hyperparameter_selection": (
                          "nested leave-one-training-season-out CV inside each outer fold"
                      ),
                  },
                  "candidate_3": {
                      "name": "monotonic_hist_gradient_boosting",
                      "fit": (
                          "HistGradientBoostingRegressor with nondecreasing monotonic "
                          "constraints on every admitted signal"
                      ),
                      "learning_rate_grid": [0.03, 0.07],
                      "max_leaf_nodes_grid": [7, 15],
                      "min_samples_leaf_grid": [40, 100],
                      "l2_regularization_grid": [0.0, 1.0],
                      "max_iter": 300,
                      "hyperparameter_selection": (
                          "nested leave-one-training-season-out CV inside each outer fold"
                      ),
                  },
              },

              "model_selection": {
                  "primary_metric": "outer-CV mean absolute error",
                  "secondary_metric": "outer-CV Spearman rank correlation",
                  "complexity_rule": (
                      "one-standard-error rule on outer-fold MAE; choose simplest model "
                      "statistically indistinguishable from the lowest-MAE model"
                  ),
                  "simplicity_order": [
                      "best_single_signal_baseline",
                      "nonnegative_ridge_linear",
                      "monotonic_hist_gradient_boosting",
                  ],
                  "position_may_select_different_candidate_family": True,
                  "no_2025_access_during_selection": True,
              },

              "tier_policy": {
                  "role_labels": [
                      "Speculative",
                      "Depth",
                      "Understudy",
                      "Rotational",
                      "Starter",
                      "Every-Down",
                      "Elite",
                  ],
                  "thresholds_hand_assigned": False,
                  "derive_only_after_model_family_is_frozen": True,
                  "derive_from_development_out_of_fold_predictions_only": True,
                  "minimum_development_share_per_tier": 0.05,
                  "must_be_monotonic_in_future_target": True,
                  "holdout_2025_used_to_set_tiers": False,
              },

              "holdout_policy": {
                  "season": 2025,
                  "opened_in_b41c": False,
                  "weight_retuning_after_open": False,
                  "threshold_retuning_after_open": False,
              },

              "production_policy": {
                  "weekly_tuesday_refresh_enabled_now": False,
                  "weekly_refresh_retrains_model": False,
                  "production_role_change_authorized": False,
                  "fundamental_value_change_authorized": False,
                  "league_asset_ranking_change_authorized": False,
              },
          }

          contract["frozen_scorer_sha256"] = hashlib.sha256(
              scorer.read_bytes()
          ).hexdigest()

          out = base / "player_role_v2_b41c_model_development_preregistration.json"
          out.write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("Frozen scorer SHA256:", contract["frozen_scorer_sha256"])
          print("Model fit performed: false")
          print("2025 holdout opened: false")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$SCORER" "$PREREG"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "B41C scorer/prereg already frozen."
          else
            git commit -m "Preregister Player Role V2 exact target scorer and model development"
            git push origin HEAD:main
          fi

      - name: Capture current Sleeper scoring contract and validate frozen scorer
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main
          mkdir -p /tmp/player-role-v2-b41c

          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import requests

          ROOT = Path(".")
          BASE = ROOT / "research/player-role-v2"
          OUT = Path("/tmp/player-role-v2-b41c")

          config = json.loads((ROOT / "config.json").read_text(encoding="utf-8"))
          league_id = str(config["league_id"])

          prereg = json.loads(
              (BASE / "player_role_v2_b41c_model_development_preregistration.json")
              .read_text(encoding="utf-8")
          )
          scorer_path = BASE / "player_role_v2_b41c_target_scorer.py"

          actual_scorer_sha = hashlib.sha256(scorer_path.read_bytes()).hexdigest()
          assert actual_scorer_sha == prereg["frozen_scorer_sha256"]

          spec = importlib.util.spec_from_file_location("b41c_scorer", scorer_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "LOG-Trade-Calculator-player-role-v2-b41c"
          })

          def get_json(url, timeout=90):
              r = session.get(url, timeout=timeout)
              r.raise_for_status()
              return r.json(), r.content

          league_url = f"https://api.sleeper.app/v1/league/{league_id}"
          league, league_bytes = get_json(league_url)

          assert str(league.get("league_id")) == league_id
          assert str(league.get("season")) == "2026"
          scoring_settings = league.get("scoring_settings") or {}
          roster_positions = league.get("roster_positions") or []
          assert scoring_settings
          assert roster_positions

          league_snapshot = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C-current-league-scoring-snapshot",
              "league_id": league_id,
              "season": league.get("season"),
              "league_name": league.get("name"),
              "scoring_settings": scoring_settings,
              "roster_positions": roster_positions,
              "sleeper_league_response_sha256": hashlib.sha256(
                  league_bytes
              ).hexdigest(),
          }
          (OUT / "player_role_v2_b41c_league_scoring_snapshot.json").write_text(
              json.dumps(league_snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          tol = float(prereg["scorer_validation"]["absolute_tolerance_points"])
          rows = []
          missing_raw_nonzero = 0

          for week in prereg["scorer_validation"]["validation_weeks"]:
              matchup_url = (
                  f"https://api.sleeper.app/v1/league/{league_id}/matchups/{week}"
              )
              matchup_rows, _ = get_json(matchup_url)

              truth = {}
              for matchup in matchup_rows:
                  pp = matchup.get("players_points") or {}
                  for pid, points in pp.items():
                      try:
                          truth[str(pid)] = float(points)
                      except (TypeError, ValueError):
                          continue

              stats_url = (
                  "https://api.sleeper.app/v1/stats/nfl/regular/"
                  f"2026/{week}"
              )
              stats, _ = get_json(stats_url)
              assert isinstance(stats, dict)

              for pid, actual in sorted(truth.items()):
                  if not pid.isdigit():
                      continue

                  raw = stats.get(pid) or {}
                  pred = float(mod.score_week(raw))
                  err = pred - actual

                  if not raw and abs(actual) > tol:
                      missing_raw_nonzero += 1

                  rows.append({
                      "week": week,
                      "player_id": pid,
                      "sleeper_custom_points": actual,
                      "frozen_scorer_points": pred,
                      "error": round(err, 6),
                      "abs_error": round(abs(err), 6),
                      "raw_stats_present": bool(raw),
                  })

          assert rows, "No player-week scoring comparisons produced."

          within = sum(r["abs_error"] <= tol for r in rows)
          frac = within / len(rows)
          max_abs = max(r["abs_error"] for r in rows)
          mae = sum(r["abs_error"] for r in rows) / len(rows)
          mismatches = sorted(
              [r for r in rows if r["abs_error"] > tol],
              key=lambda r: (-r["abs_error"], r["week"], r["player_id"]),
          )

          required_n = int(
              prereg["scorer_validation"]["required_compared_player_weeks"]
          )
          required_frac = float(
              prereg["scorer_validation"]["required_fraction_within_tolerance"]
          )
          max_allowed = float(
              prereg["scorer_validation"][
                  "required_max_abs_error_if_any_nonzero_error"
              ]
          )

          scorer_pass = (
              len(rows) >= required_n
              and frac >= required_frac
              and max_abs <= max_allowed
              and missing_raw_nonzero == 0
          )

          validation = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C-frozen-scorer-empirical-validation",
              "frozen_scorer_sha256": actual_scorer_sha,
              "validation_season": 2026,
              "validation_weeks": prereg["scorer_validation"]["validation_weeks"],
              "compared_player_weeks": len(rows),
              "within_tolerance_count": within,
              "within_tolerance_fraction": frac,
              "mean_absolute_error": mae,
              "max_absolute_error": max_abs,
              "missing_raw_stats_with_nonzero_truth": missing_raw_nonzero,
              "tolerance_points": tol,
              "required_compared_player_weeks": required_n,
              "required_fraction_within_tolerance": required_frac,
              "required_max_abs_error": max_allowed,
              "pass": scorer_pass,
              "largest_mismatches": mismatches[:50],
              "model_fit_performed": False,
              "predictor_target_association_computed": False,
              "holdout_2025_opened": False,
              "production_change_authorized": False,
          }

          (OUT / "player_role_v2_b41c_scorer_validation.json").write_text(
              json.dumps(validation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "compared_player_weeks": len(rows),
              "within_tolerance_fraction": frac,
              "mean_absolute_error": mae,
              "max_absolute_error": max_abs,
              "missing_raw_nonzero": missing_raw_nonzero,
              "scorer_pass": scorer_pass,
          }, indent=2))
          PY

      - name: Probe historical Sleeper target-source availability without opening 2025
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import requests

          BASE = Path("research/player-role-v2")
          OUT = Path("/tmp/player-role-v2-b41c")

          prereg = json.loads(
              (BASE / "player_role_v2_b41c_model_development_preregistration.json")
              .read_text(encoding="utf-8")
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": "LOG-Trade-Calculator-player-role-v2-b41c"
          })

          samples = {}
          all_pass = True
          min_players = int(
              prereg["historical_target_source_feasibility"][
                  "minimum_players_per_sample_week"
              ]
          )

          for season in prereg["historical_target_source_feasibility"][
              "development_seasons"
          ]:
              season_result = {}
              for week in prereg["historical_target_source_feasibility"][
                  "sample_weeks_per_season"
              ]:
                  url = (
                      "https://api.sleeper.app/v1/stats/nfl/regular/"
                      f"{season}/{week}"
                  )
                  r = session.get(url, timeout=90)

                  usable = False
                  count = 0
                  response_sha = None

                  if r.status_code == 200:
                      try:
                          data = r.json()
                      except Exception:
                          data = None
                      if isinstance(data, dict):
                          count = len(data)
                          usable = count >= min_players
                          response_sha = hashlib.sha256(r.content).hexdigest()

                  season_result[str(week)] = {
                      "http_status": r.status_code,
                      "player_count": count,
                      "usable": usable,
                      "response_sha256": response_sha,
                  }
                  all_pass = all_pass and usable

              samples[str(season)] = season_result

          assert "2025" not in samples

          feasibility = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C-historical-Sleeper-target-source-feasibility",
              "development_seasons": [2019, 2020, 2021, 2022, 2023, 2024],
              "sample_weeks": [4, 8, 12, 16],
              "holdout_2025_requested": False,
              "minimum_players_per_sample_week": min_players,
              "samples": samples,
              "pass": all_pass,
              "model_fit_performed": False,
              "predictor_target_association_computed": False,
              "production_change_authorized": False,
          }

          (OUT / "player_role_v2_b41c_historical_target_source_feasibility.json").write_text(
              json.dumps(feasibility, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("Historical target-source feasibility:", all_pass)
          print("2025 requested: false")
          PY

      - name: Derive B41C scientific decision and commit evidence
        shell: bash
        run: |
          set -euo pipefail

          BASE="research/player-role-v2"
          OUT="/tmp/player-role-v2-b41c"

          git fetch origin main
          git rebase origin/main

          cp "$OUT/player_role_v2_b41c_league_scoring_snapshot.json" \
            "$BASE/player_role_v2_b41c_league_scoring_snapshot.json"
          cp "$OUT/player_role_v2_b41c_scorer_validation.json" \
            "$BASE/player_role_v2_b41c_scorer_validation.json"
          cp "$OUT/player_role_v2_b41c_historical_target_source_feasibility.json" \
