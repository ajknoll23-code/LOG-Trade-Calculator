name: Package Adjustment V6 Prospective Feasibility Amendment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install frozen amendment dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            "numpy==2.3.3" \
            "requests==2.34.2"

      - name: Guard pre-activation frozen V6P1 lineage
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/development_candidate_v1.json")" = \
            "446a176757919be3deef0659ac01e05884be4007"
          test "$(git hash-object "$D/prospective_power_analysis_v1.json")" = \
            "c6348c91ecebf02112c7cc61320e065e68471735"
          test "$(git hash-object "$D/prospective_preregistration_v1.json")" = \
            "d0000c9f42c7be11a8d49d0029993a28fabebc73"
          test "$(git hash-object "$D/prospective_preregistration_manifest_v1.json")" = \
            "b1f27d6ed4e2d77ebf39253626636618558b2582"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/prospective_catalog_freeze_manifest_v1.json")" = \
            "a9ee2075775a693098a7ca4162889e4af70e056a"

          # The key scientific guard: no prospective activation or V6P1 evidence
          # may exist before this feasibility amendment is frozen.
          test ! -e "$D/prospective_voting_activation_manifest_v1.json"
          test ! -e "$D/prospective_feasibility_amendment_v1.json"
          test ! -e "$D/prospective_feasibility_amendment_v1.md"
          test ! -e "$D/prospective_feasibility_amendment_manifest_v1.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          old = json.loads((d / "prospective_preregistration_v1.json").read_text())
          cat = json.loads((d / "package_vote_challenges_v6_prospective_v1.json").read_text())
          cm = json.loads((d / "prospective_catalog_freeze_manifest_v1.json").read_text())

          assert old["status"] == "frozen_v6_prospective_preregistration"
          assert old["preregistered_before_prospective_outcomes_exist"] is True
          assert old["preregistered_before_prospective_voting_activation"] is True
          assert old["candidate"]["selected_model_class"] == "C2"
          assert old["prospective_evidence_maturity_and_stopping"]["first_checkpoint_effective_votes"] == 13200

          assert cat["status"] == "frozen_v6p1_prospective_catalog"
          assert cat["released"] is False
          assert cat["voting_activated"] is False
          assert cat["development_vote_outcomes_read"] is False
          assert cat["prospective_vote_outcomes_read"] is False
          assert len(cat["challenges"]) == 504

          assert cm["voting_activated"] is False
          assert cm["prospective_votes_collected"] is False
          assert cm["prospective_vote_outcomes_read"] is False

          print("PASS: no V6P1 prospective exposure exists; feasibility amendment is clean.")
          PY

      - name: Verify production remains V1.6 before amendment
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze realistic 45 to 50 voter prospective amendment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np

          D = Path("research/package-adjustment-v6")

          OLD_PATH = D / "prospective_preregistration_v1.json"
          OLD_MANIFEST_PATH = D / "prospective_preregistration_manifest_v1.json"
          POWER_PATH = D / "prospective_power_analysis_v1.json"
          CANDIDATE_PATH = D / "development_candidate_v1.json"
          CATALOG_PATH = D / "package_vote_challenges_v6_prospective_v1.json"
          CATALOG_MANIFEST_PATH = D / "prospective_catalog_freeze_manifest_v1.json"

          OUT = D / "prospective_feasibility_amendment_v1.json"
          OUT_MD = D / "prospective_feasibility_amendment_v1.md"
          OUT_MANIFEST = D / "prospective_feasibility_amendment_manifest_v1.json"

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          old = json.loads(OLD_PATH.read_text())
          power = json.loads(POWER_PATH.read_text())
          candidate = json.loads(CANDIDATE_PATH.read_text())
          catalog = json.loads(CATALOG_PATH.read_text())

          # ------------------------------------------------------------------
          # FROZEN FEASIBILITY FACTS
          # ------------------------------------------------------------------
          # These are fixed before any prospective activation/outcomes.
          MAX_UNIQUE_VOTERS_RECRUITABLE = 50
          MIN_UNIQUE_VOTERS_FOR_EVALUATION = 45
          DAILY_VALID_BALLOT_CAP = 40
          EFFECTIVE_LIFETIME_CAP = 40.0

          FIRST_CHECKPOINT = 1800
          HARD_CAP = 2000
          EXACT_CHECKPOINTS = [FIRST_CHECKPOINT, HARD_CAP]

          assert MIN_UNIQUE_VOTERS_FOR_EVALUATION * EFFECTIVE_LIFETIME_CAP == FIRST_CHECKPOINT
          assert MAX_UNIQUE_VOTERS_RECRUITABLE * EFFECTIVE_LIFETIME_CAP == HARD_CAP

          # Primary confirmation rules remain scientifically strict.
          PRIMARY_MIN_IMPROVEMENT = 0.005
          ONE_SIDED_CONFIDENCE = 0.95
          Z95 = 1.6448536269514722

          # Safety families remain mandatory REPORTING diagnostics, but are no
          # longer six separately-powered pass/fail noninferiority hypotheses.
          # This is the precise part of V1 that made 13,200 votes infeasible.
          SAFETY_PROFILES = [
              "45/33/22",
              "50/30/20",
              "50/25/25",
              "55/30/15",
              "60/25/15",
              "60/20/20",
          ]

          # ------------------------------------------------------------------
          # OUTCOME-BLIND COVERAGE SIMULATION
          # ------------------------------------------------------------------
          # Precommitted rule: use the 1st-percentile lower-tail gates from an
          # exact 45-voter x 40-ballot uniform-24-cell simulation, rounded down
          # to observed integer quantiles. This makes 45 voters the conservative
          # design case; 46-50 voters only improve coverage.
          COVERAGE_SEED = 20260925
          COVERAGE_TRIALS = 100_000
          CELLS = 24
          VOTERS = MIN_UNIQUE_VOTERS_FOR_EVALUATION
          BALLOTS = int(EFFECTIVE_LIFETIME_CAP)

          rng = np.random.default_rng(COVERAGE_SEED)
          min_cell_ballots = np.empty(COVERAGE_TRIALS, dtype=np.int16)
          min_cell_voters = np.empty(COVERAGE_TRIALS, dtype=np.int16)

          batch = 2500
          for start in range(0, COVERAGE_TRIALS, batch):
              n = min(batch, COVERAGE_TRIALS - start)
              draws = rng.integers(
                  0, CELLS, size=(n, VOTERS, BALLOTS), dtype=np.int16
              )

              mb = np.full(n, 32767, dtype=np.int16)
              mv = np.full(n, 32767, dtype=np.int16)

              for cell in range(CELLS):
                  hit = draws == cell
                  ballot_count = hit.sum(axis=(1, 2))
                  voter_count = hit.any(axis=2).sum(axis=1)
                  mb = np.minimum(mb, ballot_count)
                  mv = np.minimum(mv, voter_count)

              min_cell_ballots[start:start+n] = mb
              min_cell_voters[start:start+n] = mv

          min_effective_per_cell = int(
              np.quantile(min_cell_ballots, 0.01, method="lower")
          )
          min_voters_per_cell = int(
              np.quantile(min_cell_voters, 0.01, method="lower")
          )

          # These values are expected under the frozen simulation and are hard
          # asserted so a library/version drift cannot silently change the plan.
          assert min_effective_per_cell == 48, min_effective_per_cell
          assert min_voters_per_cell == 27, min_voters_per_cell

          coverage_joint_probability = float(np.mean(
              (min_cell_ballots >= min_effective_per_cell)
              & (min_cell_voters >= min_voters_per_cell)
          ))

          # ------------------------------------------------------------------
          # CAPACITY-AWARE PRIMARY POWER DIAGNOSTIC
          # ------------------------------------------------------------------
          # We report two planning scenarios:
          # 1) observed development effect (optimistic if it replicates);
          # 2) exact minimum worthwhile effect -0.005 (conservative reality check).
          #
          # This diagnostic does NOT alter the precommitted checkpoints.
          dev_D = float(
              power["development_paired_loss_difference"][
                  "point_estimates"
              ]["overall"]
          )
          sd_700 = float(
              power["development_paired_loss_difference"][
                  "crossed_bootstrap_sd"
              ]["overall"]
          )

          POWER_SEED = 20260926
          POWER_TRIALS = 200_000
          rng_power = np.random.default_rng(POWER_SEED)
          z = rng_power.standard_normal(POWER_TRIALS)

          def primary_power(n, true_D):
              se = sd_700 * math.sqrt(700.0 / float(n))
              simulated = true_D + se * z
              passed = (
                  (simulated <= -PRIMARY_MIN_IMPROVEMENT)
                  & ((simulated + Z95 * se) < 0.0)
              )
              return {
                  "effective_votes": int(n),
                  "planning_true_D": float(true_D),
                  "scaled_se": float(se),
                  "estimated_power": float(np.mean(passed)),
              }

          power_diag = {
              "observed_development_effect": [
                  primary_power(FIRST_CHECKPOINT, dev_D),
                  primary_power(HARD_CAP, dev_D),
              ],
              "minimum_worthwhile_effect": [
                  primary_power(FIRST_CHECKPOINT, -PRIMARY_MIN_IMPROVEMENT),
                  primary_power(HARD_CAP, -PRIMARY_MIN_IMPROVEMENT),
              ],
          }

          generated = datetime.now(timezone.utc).isoformat()

          amendment = {
              "schema_version": 1,
              "amendment_id": "package-adjustment-v6-prospective-feasibility-v1",
              "status": "frozen_v6p1_pre_activation_feasibility_amendment",
              "frozen": True,
              "generated_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "production_revision_must_remain": (
                  "v1.6-v5-size2-composition-overlay"
              ),

              "timing_and_reason": {
                  "amendment_frozen_before_prospective_voting_activation": True,
                  "amendment_frozen_before_any_prospective_vote_outcome_exists": True,
                  "reason_category": "operational_recruitment_feasibility",
                  "reason": (
                      "The previously frozen 13,200-effective-vote confirmation "
                      "required approximately 440 unique voters under its 30-vote "
                      "effective cap. Before any prospective activation, the realistic "
                      "recruitment ceiling was established as 50 unique voters, and "
                      "voters are expected to prefer completing their ballots in one "
                      "session. The confirmation design is therefore capacity-capped "
                      "before outcomes rather than abandoned or tuned after evidence."
                  ),
                  "prospective_outcomes_used_to_make_amendment": False,
                  "candidate_performance_on_prospective_data_used": False,
              },

              "supersession": {
                  "supersedes_only_these_v1_sections": [
                      "prospective_evidence_maturity_and_stopping",
                      "prospective_evaluation_contract.safety_families_as_individual_pass_fail_gates",
                  ],
                  "v1_plan_remains_immutable_historical_record": True,
                  "v1_plan_git_blob_sha": (
                      "d0000c9f42c7be11a8d49d0029993a28fabebc73"
                  ),
                  "v1_plan_sha256": sha256(OLD_PATH),
                  "original_13200_checkpoint_is_superseded": True,
              },

              "unchanged_frozen_scientific_components": {
                  "candidate_class": "C2",
                  "candidate_q": float(candidate["frozen_parameters"]["structural_parameters"][0]),
                  "candidate_parameters_unchanged": True,
                  "baseline_C1_parameters_unchanged": True,
                  "prospective_catalog_unchanged": True,
                  "prospective_catalog_sha256": sha256(CATALOG_PATH),
                  "prospective_catalog_git_blob_sha": (
                      "dd12608b1b5fee03da5965458d6e59284657dce3"
                  ),
                  "prospective_catalog_challenge_count": 504,
                  "prospective_catalog_target_count": 21,
                  "prospective_catalog_cell_count": 24,
                  "catalog_selection_contract_unchanged": True,
                  "challenge_selection_not_reopened": True,
                  "no_refitting": True,
                  "no_recalibration": True,
                  "no_parameter_tuning": True,
                  "no_model_selection": True,
              },

              "feasible_recruitment_contract": {
                  "target_unique_voters": MAX_UNIQUE_VOTERS_RECRUITABLE,
                  "minimum_unique_voters_for_evaluation": (
                      MIN_UNIQUE_VOTERS_FOR_EVALUATION
                  ),
                  "maximum_unique_voters_planned": MAX_UNIQUE_VOTERS_RECRUITABLE,
                  "daily_valid_ballot_cap_per_voter": DAILY_VALID_BALLOT_CAP,
                  "effective_lifetime_cap_per_voter": EFFECTIVE_LIFETIME_CAP,
                  "one_session_completion_allowed": True,
                  "ballots_41_plus_from_same_voter_have_zero_additional_effective_weight": True,
                  "ballot_weight": (
                      "first 40 valid V6P1 ballots per voter each carry weight 1.0; "
                      "later V6P1 ballots from that voter carry zero additional "
                      "effective weight"
                  ),
              },

              "prospective_evidence_maturity_and_stopping_v2": {
                  "monitor_must_be_outcome_blind": True,
                  "exact_checkpoints_effective_votes": EXACT_CHECKPOINTS,
                  "first_checkpoint_effective_votes": FIRST_CHECKPOINT,
                  "hard_cap_effective_votes": HARD_CAP,
                  "stop_at_first_checkpoint_where_all_coverage_gates_pass": True,
                  "if_1800_fails_coverage": (
                      "continue outcome-blind collection to exact 2000 hard cap"
                  ),
                  "if_2000_fails_coverage": (
                      "prospective_evidence_unresolved_no_production_candidacy"
                  ),
                  "minimum_distinct_voters": MIN_UNIQUE_VOTERS_FOR_EVALUATION,
                  "minimum_effective_votes_per_cell": float(min_effective_per_cell),
                  "minimum_distinct_voters_per_cell": min_voters_per_cell,
                  "required_cell_count": 24,
                  "continuation_or_stopping_may_use_only": [
                      "total_effective_vote_count",
                      "distinct_voter_count",
                      "per_cell_effective_vote_count",
                      "per_cell_distinct_voter_count",
                  ],
                  "continuation_or_stopping_may_not_use": [
                      "vote_choice_direction",
                      "C2_performance",
                      "C1_performance",
                      "C2_minus_C1_improvement",
                      "bootstrap_results",
                      "confidence_bounds",
                      "statistical_significance",
                      "model_agreement",
                  ],
              },

              "coverage_simulation": {
                  "method": (
                      "numpy_default_rng_uniform_24_cell_sampling_"
                      "45_voters_x_40_ballots"
                  ),
                  "numpy_version": np.__version__,
                  "seed": COVERAGE_SEED,
                  "trials": COVERAGE_TRIALS,
                  "voters_per_trial": VOTERS,
                  "ballots_per_voter": BALLOTS,
                  "effective_votes_per_trial": VOTERS * BALLOTS,
                  "cell_count": CELLS,
                  "gate_quantile_rule": (
                      "1st-percentile lower-tail integer quantiles from the "
                      "conservative 45-voter design"
                  ),
                  "minimum_effective_votes_per_cell_gate": (
                      min_effective_per_cell
                  ),
                  "minimum_distinct_voters_per_cell_gate": (
                      min_voters_per_cell
                  ),
                  "probability_both_coverage_gates_at_1800": (
                      coverage_joint_probability
                  ),
                  "outcomes_or_model_scores_used": False,
              },

              "prospective_evaluation_contract_v2": {
                  "evaluation_occurs_once_after_exact_maturity_freeze": True,
                  "primary_metric": (
                      "equal_cell_macro_mean_log_loss_across_all_24 "
                      "prospective cells"
                  ),
                  "primary_difference_definition": (
                      "D_overall = LL_C2 - LL_C1; lower is better"
                  ),
                  "primary_minimum_practical_improvement": (
                      PRIMARY_MIN_IMPROVEMENT
                  ),
                  "primary_point_gate": "D_overall <= -0.005",
                  "primary_uncertainty_gate": (
                      "one-sided 95% upper confidence bound for D_overall < 0"
                  ),
                  "primary_gate_is_only_confirmatory_performance_gate": True,
                  "safety_profile_role": (
                      "mandatory descriptive diagnostics and human production-review "
                      "evidence; not six individually powered pass/fail hypotheses"
                  ),
                  "safety_profiles_must_all_be_reported": SAFETY_PROFILES,
                  "safety_profile_outputs_required": [
                      "paired_C2_minus_C1_point_difference",
                      "crossed_cluster_uncertainty_interval",
                      "one_sided_95_percent_upper_bound",
                      "effective_vote_count",
                      "distinct_voter_count",
                  ],
                  "safety_profiles_may_not_be_hidden_or_dropped_after_results": True,
                  "no_cross_validation": True,
                  "no_fitting": True,
                  "no_refitting": True,
                  "no_recalibration": True,
                  "no_parameter_tuning": True,
                  "no_model_selection": True,
                  "uncertainty_method": old[
                      "prospective_evaluation_contract"
                  ]["uncertainty_method"],
                  "all_primary_conditions_required": True,
                  "pass_status": (
                      "v6p1_feasible_prospective_primary_confirmation_passed_"
                      "eligible_for_separate_human_review_with_all_safety_"
                      "diagnostics_visible"
                  ),
                  "fail_status": (
                      "v6p1_feasible_prospective_primary_confirmation_failed_"
                      "research_only"
                  ),
                  "unresolved_status": (
                      "v6p1_feasible_prospective_confirmation_unresolved_"
                      "research_only"
                  ),
              },

              "capacity_aware_power_diagnostic": {
                  "purpose": (
                      "planning transparency only; checkpoint sizes are fixed by "
                      "operational capacity and are not selected from these results"
                  ),
                  "seed": POWER_SEED,
                  "trials": POWER_TRIALS,
                  "development_crossed_bootstrap_sd_at_700": sd_700,
                  "variance_scaling": "sd_N = sd_700 * sqrt(700/N)",
                  "observed_development_D": dev_D,
                  "minimum_worthwhile_D": -PRIMARY_MIN_IMPROVEMENT,
                  "results": power_diag,
                  "important_interpretation": (
                      "With 45-50 voters, the study is highly powered only if a "
                      "substantial fraction of the large development effect replicates. "
                      "It is not highly powered to prove an effect whose true magnitude "
                      "is merely the minimum worthwhile 0.005."
                  ),
              },

              "governance": {
                  "prospective_pass_does_not_automatically_promote_candidate": True,
                  "prospective_pass_does_not_modify_production": True,
                  "all_safety_profile_diagnostics_required_for_human_review": True,
                  "separate_human_approved_production_decision_required": True,
                  "candidate_parameters_may_not_change": True,
                  "baseline_parameters_may_not_change": True,
                  "frozen_catalog_may_not_change": True,
                  "another_design_change_after_activation_requires_new_fresh_evidence": True,
              },

              "required_sequence_after_this_amendment": [
                  "replace_not_run_old_activation_workflow_with_v2_activation",
                  "activate_existing_frozen_V6P1_catalog_under_40_vote_transport",
                  "collect_future_votes_under_outcome_blind_1800_then_2000_stopping",
                  "freeze_exact_first_coverage_qualified_checkpoint",
                  "evaluate_frozen_C2_vs_frozen_C1_once_under_v2_primary_contract",
                  "report_all_six_safety_profile_diagnostics",
                  "if_primary_passes_require_separate_human_production_review",
              ],
          }

          OUT.write_text(
              json.dumps(amendment, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          obs1800 = power_diag["observed_development_effect"][0]["estimated_power"]
          obs2000 = power_diag["observed_development_effect"][1]["estimated_power"]
          min1800 = power_diag["minimum_worthwhile_effect"][0]["estimated_power"]
          min2000 = power_diag["minimum_worthwhile_effect"][1]["estimated_power"]

          md = "\n".join([
              "# Package Adjustment V6P1 Pre-Activation Feasibility Amendment",
              "",
              "**Status:** `frozen_v6p1_pre_activation_feasibility_amendment`",
              "",
              "This amendment is frozen before any V6P1 prospective voting activation "
              "or prospective outcome exists.",
              "",
              "## Realistic collection plan",
              "",
              "- Target unique voters: **50**",
              "- Minimum unique voters for evaluation: **45**",
              "- Valid ballots allowed per voter in one day/session: **40**",
              "- Effective lifetime cap per voter: **40**",
              "- First outcome-blind checkpoint: **1,800 effective votes**",
              "- Hard cap if coverage is short: **2,000 effective votes**",
              "- Required research cells: **24 / 24**",
              f"- Minimum effective votes per cell: **{min_effective_per_cell}**",
              f"- Minimum distinct voters per cell: **{min_voters_per_cell}**",
              f"- Simulated chance the 45x40 design clears both cell gates: "
              f"**{coverage_joint_probability:.1%}**",
              "",
              "## Confirmation rule",
              "",
              "- C2 and C1 remain completely frozen.",
              "- The 504-trade prospective catalog remains completely frozen.",
              "- Primary pass requires at least **0.005** overall equal-cell macro "
              "log-loss improvement for C2 versus C1.",
              "- The one-sided **95% upper confidence bound** for overall "
              "C2-minus-C1 loss must also be below zero.",
              "- All six composition profiles remain mandatory reported safety "
              "diagnostics, but they are no longer six separately powered pass/fail "
              "noninferiority tests.",
              "",
              "## Power reality check",
              "",
              f"- At 1,800 votes, estimated primary power if the development effect "
              f"fully replicated: **{obs1800:.1%}**",
              f"- At 2,000 votes, same assumption: **{obs2000:.1%}**",
              f"- At 1,800 votes, estimated power if the true effect were only "
              f"0.005: **{min1800:.1%}**",
              f"- At 2,000 votes, if true effect were only 0.005: **{min2000:.1%}**",
              "",
              "That distinction is intentional: this feasible study can strongly "
              "confirm a material replication of the large development result, but "
              "cannot provide high power for an effect that is truly only 0.005.",
              "",
              "## Next action",
              "",
              "Replace the unrun 13,200-vote activation workflow with a new V6P1 "
              "activation that enforces the frozen 40-vote session/lifetime cap and "
              "the 1,800 / 2,000 outcome-blind maturity checkpoints.",
              "",
          ])
          OUT_MD.write_text(md, encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "status": "v6p1_feasibility_amendment_manifest",
              "generated_at_utc": generated,
              "frozen": True,
              "research_only": True,
              "production_change_authorized": False,
              "prospective_voting_activated": False,
              "prospective_outcomes_read": False,
              "superseded_first_checkpoint": 13200,
              "new_first_checkpoint": FIRST_CHECKPOINT,
              "new_hard_cap": HARD_CAP,
              "target_unique_voters": MAX_UNIQUE_VOTERS_RECRUITABLE,
              "minimum_unique_voters": MIN_UNIQUE_VOTERS_FOR_EVALUATION,
              "daily_valid_ballot_cap": DAILY_VALID_BALLOT_CAP,
              "effective_lifetime_cap": EFFECTIVE_LIFETIME_CAP,
              "frozen_catalog_sha256": sha256(CATALOG_PATH),
              "source_artifacts": {
                  "old_preregistration": {
                      "path": str(OLD_PATH),
                      "git_blob_sha": (
                          "d0000c9f42c7be11a8d49d0029993a28fabebc73"
                      ),
                      "sha256": sha256(OLD_PATH),
                  },
                  "old_preregistration_manifest": {
                      "path": str(OLD_MANIFEST_PATH),
                      "git_blob_sha": (
                          "b1f27d6ed4e2d77ebf39253626636618558b2582"
                      ),
