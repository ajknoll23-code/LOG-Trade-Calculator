      - name: Commit frozen V6P1 feasibility amendment
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          A="$D/prospective_feasibility_amendment_v1.json"
          MD="$D/prospective_feasibility_amendment_v1.md"
          MAN="$D/prospective_feasibility_amendment_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$A" "$MD" "$MAN"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=("$A" "$MD" "$MAN")
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          test "${#STAGED[@]}" -eq 3
          test "$(printf '%s\n' "${STAGED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m "Freeze Package Adjustment V6 prospective feasibility amendment"
