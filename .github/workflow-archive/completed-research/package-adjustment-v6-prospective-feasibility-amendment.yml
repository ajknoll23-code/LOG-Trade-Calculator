          import subprocess

          expected = {
              "research/package-adjustment-v6/prospective_feasibility_amendment_v1.json",
              "research/package-adjustment-v6/prospective_feasibility_amendment_v1.md",
              "research/package-adjustment-v6/prospective_feasibility_amendment_manifest_v1.json",
          }

          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
