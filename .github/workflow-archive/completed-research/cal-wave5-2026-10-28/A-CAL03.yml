name: A - CAL03 Wave3 R60-R86 Workflow Archive Audit (Guarded)
run-name: A-CAL03 ${{ inputs.mode }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW first; APPLY only after reviewing exact held and eligible list'
        required: true
        type: choice
        default: PREVIEW
        options:
          - PREVIEW
          - APPLY
      preview_run_id:
        description: 'Required for APPLY: numerical GitHub run ID of the green PREVIEW'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  audit-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAL_ARCHIVE_MODE: ${{ inputs.mode }}
      CAL_PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
      CAL_ARCHIVE_OUTPUT: /tmp/cal-wave3-audit
    steps:
      - name: Checkout current main without persisted write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned audit parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Materialize archived-candidate engine
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/a_cal03.py" <<'PY_CAL_ARCHIVE_ENGINE'
          #!/usr/bin/env python3
          """CAL workflow archive Wave 3: conservative, reversible, pinned preview/apply.
          Only archives exact audited R60-R86 historical CAL26 research YAMLs.
          Preserve chronology, production calibration, frozen holdouts, and reusable study sources.
          """
          from __future__ import annotations
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          import yaml
          
          WORKFLOW_DIR = Path('.github/workflows')
          ARCHIVE_DIR = Path('.github/workflow-archive/completed-research/cal-wave3-2026-10-28')
          MANIFEST_DIR = Path('.github/workflow-archive/cleanup-manifests')
          OUT_DIR = Path(os.environ.get('CAL_ARCHIVE_OUTPUT', '/tmp/cal-wave3-preview'))
          SELF = 'A-CAL03.yml'
          HOLD = {
              'CAL20_V1R1_CORE173_Synchronized_FV_Votes_MV_Production_Release.yml',
              'CAL22_V1R5_Pinned_Green_Apply.yml',
              'LOG_CAL02_Migrated_DL_Residual_Correction_Preview_Apply.yml',
              'LOG_CAL15_V1R2_Bounded_IDP_FV_FV_Votes_Free_Agent_Parity_Preview_Apply.yml',
              'CAL26_V1R8_Owner_Approved_98_Price_Neutral_Role_Deployment.yml',
              'CAL26_V1R11_Owner_Selected_13_FV_Prices_Approval_and_Production_Release.yml',
              'CAL26_V1R14_Dart_Lawrence_Exact_QB_FV_Preview_Approved_Release.yml',
              'CAL26_V1R26_Preseason_QB_Prospective_Evidence_Benchmark_READ_ONLY.yml',
              'CAL26_V1R27_Frozen_QB_Prospective_Projection_Weight_Grid_Weeks8_12_READ_ONLY.yml',
          }
          TEXT_EXTENSIONS = {'.json','.jsonl','.yml','.yaml','.py','.js','.mjs','.cjs','.ts','.tsx','.html','.md','.txt','.csv','.sh','.bash','.toml','.ini','.cfg','.xml','.sql','.rst'}
          
          
          def sh(*args: str) -> str:
              return subprocess.check_output(args, encoding='utf8').strip()
          
          
          def sha256(blob: bytes) -> str:
              return hashlib.sha256(blob).hexdigest()
          
          
          def jbytes(item: dict) -> bytes:
              return (json.dumps(item,sort_keys=True,ensure_ascii=False,separators=(',', ':'))+'\n').encode('utf-8')
          
          
          # Preserve prospective/chronological evidence, owner calibrations,
          # late-stage validations and all newest R83-R86 utility companions.
          # These are hard holds even if static references are absent.
          RESEARCH_LOCKED_STEPS = {60,61,62,63,69,72,74,75,76,77,78,79,80,82,83,84,85,86}

          def candidate_step(name: str):
              m = re.match(r'^CAL26_R(\d+)(?:R\d+)?(?:_|\.)', name)
              if m: return int(m.group(1))
              if name in {'CAL26_V1R61.yml','CAL26_V1R62_fresh.yml'}:
                  m = re.match(r'^CAL26_V1R(\d+)',name)
                  return int(m.group(1))
              return None

          def matches_wave3(name: str) -> bool:
              n = candidate_step(name)
              return bool(name.endswith(('.yml','.yaml')) and n is not None and 60 <= n <= 86)


          def static_artifact_names(a: dict) -> list:
              out=[]
              for job in (a.get('jobs') or {}).values():
                  if not isinstance(job,dict):continue
                  for step in (job.get('steps') or []):
                      if not isinstance(step,dict) or 'upload-artifact' not in str(step.get('uses','')):continue
                      v=step.get('with') or {}
                      name=v.get('name','') if isinstance(v,dict) else ''
                      if isinstance(name,str) and len(name)>=14 and (chr(36) + '{{') not in name:
                          out.append(name)
              return sorted(set(out))


          def read_meta(p: Path) -> dict:
              try:
                  raw=p.read_bytes().decode('utf8')
                  a=yaml.load(raw,Loader=yaml.BaseLoader)
                  if not isinstance(a,dict):return {'error':'invalid YAML root','events':['INVALID'],'name':None,'artifacts':[], 'write_possible':True}
                  e=a.get('on')
                  if isinstance(e,dict):events=sorted(e)
                  elif isinstance(e,list):events=sorted(e)
                  elif isinstance(e,str):events=[e]
                  else:events=['UNKNOWN']
                  # Fail closed on workflow permission or executable APPLY releases.
                  writable = bool(re.search(r'(?im)^\s*contents:\s*write\s*$',raw) or
                                  re.search(r'(?im)^\s*permissions:\s*write-all\s*$',raw) or
                                  re.search(r'(?im)^\s*(?:git push|git\s+push|gh release create)\b',raw) or
                                  re.search(r'(?im)^\s*(?:-\s*)?APPLY\s*$',raw))
                  return {'events':events,'name':a.get('name'),'error':None,
                          'artifacts':static_artifact_names(a),'write_possible':writable}
              except Exception as exc:
                  return {'events':['INVALID'],'name':None,'error':str(exc)[:180],
                          'artifacts':[],'write_possible':True}


          def verify_repository():
              assert WORKFLOW_DIR.is_dir(), 'No workflow directory found'
              assert sh('git','rev-parse','--abbrev-ref','HEAD')=='main', 'Main branch only'
              assert not sh('git','status','--porcelain','--untracked-files=all'), 'Dirty repository before audit'
              assert (WORKFLOW_DIR/SELF).is_file(), 'Missing A-CAL03 workflow; do not run off another tree'
              assert (WORKFLOW_DIR/'CAL26_WR01_Weekly_Frozen_Role_V2_FV_Neutral_Auto_Update.yml').is_file(), 'Weekly Role V2 must remain active'
              assert (WORKFLOW_DIR/'scheduled-data-refresh.yml').is_file(), 'Scheduled refresh must remain active'
              assert (WORKFLOW_DIR/'repo-regression-checks.yml').is_file(), 'Regression check must remain active'
              assert Path('.github/workflow-archive/cleanup-manifests/cal-wave1-2026-10-28.json').is_file(), 'Missing Wave1 receipt; stop'
              assert Path('.github/workflow-archive/cleanup-manifests/cal-wave2-2026-10-28.json').is_file(), 'Missing Wave2 receipt; stop'
              for n in ('CAL26_R84.yml','CAL26_R85.yml','CAL26_R86R2.yml',
                        'A11-Week9-Evaluation.yml','A12-Forward-Outcome.yml',
                        'A13-Board-Usage.yml','B51-v1r1-schedule-utility-v1-reusable-weekly-prospective-snapshot-freezer.yml'):
                  assert (WORKFLOW_DIR/n).is_file(), 'Protected live study/weekly workflow missing: '+n
          
          
          def inventory() -> dict:
              verify_repository()
              current=sorted(WORKFLOW_DIR.glob('*.yml'))+sorted(WORKFLOW_DIR.glob('*.yaml'))
              current=sorted(set(current))
              cand=[p for p in current if matches_wave3(p.name)]
              expected_names={
                  'CAL26_R60_Research.yml',
                  'CAL26_R63_REDOWNLOAD.yml','CAL26_R64_FRESH.yml',
                  'CAL26_R65_FRESH.yml','CAL26_R66_FRESH.yml','CAL26_R67.yml',
                  'CAL26_R68.yml','CAL26_R69.yml','CAL26_R70_FRESH.yml',
                  'CAL26_R71_FRESH.yml','CAL26_R72_FRESH.yml','CAL26_R73.yml',
                  'CAL26_R74_FRESH.yml','CAL26_R75_FRESH.yml',
                  'CAL26_R76_FRESH.yml','CAL26_R77.yml','CAL26_R78_FRESH.yml',
                  'CAL26_R78R1.yml','CAL26_R79.yml','CAL26_R80.yml',
                  'CAL26_R82.yml','CAL26_R83.yml','CAL26_R84.yml',
                  'CAL26_R85.yml','CAL26_R86R2.yml',
                  'CAL26_V1R61.yml','CAL26_V1R62_fresh.yml'
              }
              assert {p.name for p in cand} == expected_names, 'Wave3 inventory changed; stop rather than broaden archival scope'
              assert 24 <= len(cand) <= 30, f'Expected Wave3 R60-R86 inventory (24-30); found {len(cand)}; stop'
              assert 130 <= len(current) <= 180, 'Unexpected workflow population; stop'
              elsewhere={p for p in current if p not in cand}
              metadata={p:read_meta(p) for p in current}
              # A static name dependency in a still-active workflow is a hard hold.
              active_names=set()
              for p in elsewhere:
                  m=metadata[p]
                  if m['name']:active_names.add(m['name'])
              tracked=sh('git','ls-files','-z').split('\x00')
              blobs=[]
              for name in tracked:
                  if not name or name.startswith('.github/workflow-archive/'):continue
                  path=Path(name)
                  if path in cand or path == WORKFLOW_DIR/SELF:continue
                  if path.suffix.lower() not in TEXT_EXTENSIONS:continue
                  try:blob=path.read_bytes()
                  except (OSError,UnicodeError) as exc:
                      raise RuntimeError(f'INCOMPLETE REFERENCE SCAN {name}: {exc}')
                  blobs.append((name,blob))
              results=[]
              for p in cand:
                  m=metadata[p]
                  reasons=[]
                  if m['events']!=['workflow_dispatch']:
                      reasons.append('not_manual_dispatch_only:'+','.join(m['events']))
                  if p.name in HOLD or candidate_step(p.name) in RESEARCH_LOCKED_STEPS:
                      reasons.append('protected_preholdout_or_longitudinal_evidence')
                  if m['write_possible']:
                      reasons.append('write_or_release_capability_requires_manual_review')
                  if m['error']:
                      reasons.append('invalid_yaml:'+m['error'])
                  archive=ARCHIVE_DIR/p.name
                  if archive.exists():
                      reasons.append('archive_destination_already_exists')
                  needle=p.name.encode('utf-8')
                  full=str(p).encode('utf-8')
                  linked=[name for name,blob in blobs if needle in blob or full in blob]
                  if linked:
                      reasons.append('referenced_in_remaining_source')
                  artifact_users=[]
                  for artifact in m['artifacts']:
                      artifact_users += [str(other) for other in elsewhere if artifact.encode('utf8') in other.read_bytes()]
                  if artifact_users:
                      reasons.append('artifact_referenced_by_remaining_workflow')
                  # Name-based workflow_run dependencies cannot be found from filenames alone.
                  matching=[]
                  if m['name']:
                      for other in elsewhere:
                          om=metadata[other]
                          if om['error']:continue
                          b=other.read_text(encoding='utf8')
                          if 'workflow_run' in b and m['name'] in b:
                              matching.append(str(other))
                  if matching:reasons.append('workflow_run_name_dependency')
                  results.append({'source':str(p),'destination':str(archive),'git_blob_sha':sh('git','hash-object',str(p)),'sha256':sha256(p.read_bytes()),'workflow_name':m['name'],'events':m['events'],'archive_eligible':not reasons,'hold_reasons':reasons,'source_references':linked[:30], 'workflow_run_references':matching, 'artifact_references':sorted(set(artifact_users))[:30], 'artifact_names':m['artifacts']})
              # A candidate held for safety stays active. Recheck references from every
              # held candidate before moving any other candidate. Repeat to closure.
              # Otherwise an archived target could be needed by a newly held workflow.
              changed=True
              while changed:
                  changed=False
                  held=[r for r in results if not r['archive_eligible']]
                  for row in results:
                      if not row['archive_eligible']:continue
                      fname=Path(row['source']).name
                      target_name=row['workflow_name']
                      dependencies=[]
                      for active in held:
                          b=Path(active['source']).read_bytes()
                          if fname.encode() in b or row['source'].encode() in b:
                              dependencies.append(active['source'])
                              continue
                          if target_name and b'workflow_run' in b and target_name.encode() in b:
                              dependencies.append(active['source'])
                          else:
                              for artifact in row['artifact_names']:
                                  if artifact.encode('utf8') in b:
                                      dependencies.append(active['source']);break
                      if dependencies:
                          row['archive_eligible']=False
                          row['hold_reasons'].append('dependency_from_held_candidate')
                          row['source_references'].extend(dependencies[:30])
                          changed=True
              safe=[x for x in results if x['archive_eligible']]
              # NO automatic broadening into newly added workflow families.
              assert len(safe)<=len(cand)
              return {'schema':1,'mode':'PREVIEW','head_sha':sh('git','rev-parse','HEAD'),'active_workflow_count':len(current),'historical_wave3_reviewed_count':len(cand),'archive_eligible_count':len(safe),'held_for_safety_count':len(cand)-len(safe),'all_reviewed':results,'archive_candidates':safe,'scope':'Only considers named CAL26 R60-R86 historical YAMLs; frozen, owner calibration, scoring source, weekly, production and recent R83+ studies held; no changes to code, FV, FV+, or MV.'}
          
          
          def prepare():
              doc=inventory()
              OUT_DIR.mkdir(parents=True,exist_ok=True)
              raw=jbytes(doc)
              (OUT_DIR/'CAL_Wave3_Audit.json').write_bytes(raw)
              lines=['# A-CAL03 | CAL workflow cleanup Wave 3','',f'- Evaluated git commit: `{doc["head_sha"]}`',f'- Active workflows: **{doc["active_workflow_count"]}**',f'- CAL26 R60-R86 workflows audited in Wave 3: **{doc["historical_wave3_reviewed_count"]}**',f'- Eligible for owner review AFTER safety holds: **{doc["archive_eligible_count"]}**',f'- Held back due to references/safety: **{doc["held_for_safety_count"]}**','', '**PREVIEW ONLY. No files moved or committed. Eligibility does not imply completion or release authorization.**','', '## Exact archive candidates','']
              lines += [f'- `{x["source"]}` -> `{x["destination"]}` (blob `{x["git_blob_sha"]}`)' for x in doc['archive_candidates']]
              lines+=['','## Held from Wave 3','']
              lines += [f'- `{x["source"]}` — {"; ".join(x["hold_reasons"])}'+(f' [{"; ".join(x["source_references"][:4])}]' if x['source_references'] else '') for x in doc['all_reviewed'] if not x['archive_eligible']]
              lines+=['','## Always protected','', 'All production and release workflows, live weekly data, WR01, B weekly, free-agent board, regressions, and frozen studies are outside the candidate set. R60/R61/R62/R63/R69/R72/R74-R80/R82-R86 are locked explicitly. A green preview does NOT establish study completion; owner must review the exact candidate list before APPLY.','', '## Applying safely','', 'Requires the green PREVIEW run ID, same main SHA, exact revalidated candidate manifest, and secret `WFC01_PUSH_TOKEN` with Workflows+Contents write. Archives are git renames to `.github/workflow-archive/` and can be restored by reverting the archive commit.','']
              (OUT_DIR/'CAL_Wave3_Audit.md').write_text('\n'.join(lines), encoding='utf8')
              print(json.dumps({'status':'AUDIT_PASS_READ_ONLY','head':doc['head_sha'],'proposed':len(doc['all_reviewed']),'safe':len(doc['archive_candidates']),'held':doc['held_for_safety_count'],'sha256':sha256(raw)},sort_keys=True))
          
          
          def apply():
              assert os.environ.get('CAL_ARCHIVE_MODE')=='APPLY'
              prior=OUT_DIR/'CAL_Wave3_Audit.json'
              assert prior.is_file(), 'Missing approved preview artifact'
              saved=json.loads(prior.read_text())
              assert saved['mode']=='PREVIEW'
              now=inventory()
              assert now==saved, 'Preview differs from current main or live references. Run PREVIEW again; fail closed.'
              assert now['archive_eligible_count']>0, 'No archival targets remain; stop'
              manifest={'archive_id':'CAL-wave3-2026-10-28','preview_run_id':os.environ.get('CAL_PREVIEW_RUN_ID'),'source_commit':now['head_sha'],'archived_count':now['archive_eligible_count'],'move_records':[{'from':x['source'],'to':x['destination'],'blob_sha':x['git_blob_sha'],'sha256':x['sha256']} for x in now['archive_candidates']],'production_math_changed':False,'production_prices_changed':False,'frozen_research_changed':False,'restoration':'git revert <archive commit SHA>'}
              ARCHIVE_DIR.mkdir(parents=True,exist_ok=True)
              for x in now['archive_candidates']:
                  src=Path(x['source']);dst=Path(x['destination'])
                  assert src.is_file() and not dst.exists()
                  sh('git','mv',str(src),str(dst))
                  assert sh('git','hash-object',str(dst)) == x['git_blob_sha'], x['source']
              MANIFEST_DIR.mkdir(parents=True,exist_ok=True)
              mpath=MANIFEST_DIR/'cal-wave3-2026-10-28.json'
              assert not mpath.exists(), 'Archive receipt exists; do not overwrite'
              mpath.write_bytes(jbytes(manifest))
              sh('git','add','--',str(mpath))
              changed=sh('git','diff','--cached','--no-renames','--name-only','-z').split('\x00')
              expected={x['source'] for x in now['archive_candidates']} | {x['destination'] for x in now['archive_candidates']} | {str(mpath)}
              assert set(filter(None,changed))==expected, f'Unexpected staged paths {set(changed)^expected}'
              assert not sh('git','diff','--name-only'), 'Unexpected unstaged changes'
              sh('git','diff','--cached','--check')
              sh('git','config','user.name','github-actions[bot]')
              sh('git','config','user.email','github-actions[bot]@users.noreply.github.com')
              sh('git','commit','-m',f'A-CAL03: archive {now["archive_eligible_count"]} guarded CAL research workflows without pricing changes')
              token=os.environ.get('WFC01_PUSH_TOKEN','')
              assert token, 'Missing WFC01_PUSH_TOKEN (Workflows + Contents write)'
              remote='https://x-access-token:'+token+'@github.com/'+os.environ['GITHUB_REPOSITORY']+'.git'
              subprocess.run(['git','push',remote,'HEAD:main'],check=True)
              print(json.dumps({'status':'ARCHIVE_PUSHED','archived_count':now['archive_eligible_count'],'commit':sh('git','rev-parse','HEAD'),'receipt':str(mpath)}))
          
          
          if __name__=='__main__':
              assert len(sys.argv)==2 and sys.argv[1] in ('PREVIEW','APPLY')
              if sys.argv[1]=='PREVIEW':prepare()
              else:apply()
          PY_CAL_ARCHIVE_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/a_cal03.py"
      - name: PREVIEW exact archive candidates and dependency holds
        if: inputs.mode == 'PREVIEW'
        shell: bash
        run: python3 "$RUNNER_TEMP/a_cal03.py" PREVIEW
      - name: Upload PREVIEW report and strict archive manifest
        if: inputs.mode == 'PREVIEW'
        uses: actions/upload-artifact@v4
        with:
          name: A-CAL03-Wave3-Review
          path: /tmp/cal-wave3-audit/
          retention-days: 30
      - name: APPLY preflight requires reviewed successful PREVIEW and scoped credential
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CAL_PREVIEW_RUN_ID" =~ ^[0-9]{7,15}$ ]] || { echo '::error::Supply green PREVIEW run ID'; exit 1; }
          test -n "$WFC01_PUSH_TOKEN" || { echo '::error::Set WFC01_PUSH_TOKEN with Contents + Workflows write'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAL_PREVIEW_RUN_ID" --jq '[.conclusion,.event,.path,.head_sha,.display_title]|@tsv' > "$RUNNER_TEMP/preview_meta.tsv"
          IFS=$'\t' read -r result event path sha title < "$RUNNER_TEMP/preview_meta.tsv"
          test "$result" = success && test "$event" = workflow_dispatch && test "$path" = .github/workflows/A-CAL03.yml && test "$sha" = "$(git rev-parse HEAD)" && test "$title" = 'A-CAL03 PREVIEW' || { echo '::error::Preview was not the same successful audited workflow and commit'; exit 1; }
      - name: Download and pin successful PREVIEW audit artifact
        if: inputs.mode == 'APPLY'
        uses: actions/download-artifact@v4
        with:
          name: A-CAL03-Wave3-Review
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/cal-wave3-audit
      - name: APPLY reviewed exact moves using workflow-scoped credential
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
        run: python3 "$RUNNER_TEMP/a_cal03.py" APPLY
      - name: Report archived workflows and preserved science
        if: always()
        shell: bash
        run: |
          if test -e "$CAL_ARCHIVE_OUTPUT/CAL_Wave3_Audit.md"; then
            cat "$CAL_ARCHIVE_OUTPUT/CAL_Wave3_Audit.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No audit report generated; see job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
