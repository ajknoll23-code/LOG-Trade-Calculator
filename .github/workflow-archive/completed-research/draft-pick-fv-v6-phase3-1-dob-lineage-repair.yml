# PREFLIGHTED: V6_PHASE3_1_DOB_LINEAGE_REPAIR_V1
name: Draft Pick FV V6 - Phase 3.1 DOB Lineage Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  freeze_protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      protocol_sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard frozen Phase 3 STOP and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/draft-pick-fv-v6/r1_r4_development_outcomes_v6_1.jsonl"]="89e7348cd6ef9ad73cac051aa9c2007cb5fbeb05"
            ["research/draft-pick-fv-v6/r1_r4_historical_outcome_manifest_v6_1.json"]="f49ac28c4a70b8cfb03afdc047eb3641c7839b1b"
            ["research/draft-pick-fv-v6/r1_r4_historical_outcome_summary_v6_1.json"]="6c88462b73b83f04b51736ebf751a2de8f5a9c04"
            ["research/draft-pick-fv-v6/r1_r4_historical_outcome_summary_v6_1.md"]="c4ec2276479d1c371e40bd9089091f011325561f"
            ["research/draft-pick-fv-v6/r1_r4_historical_position_dob_lineage_v6_1.jsonl"]="e4a99f4eb0e749c83f98a533a760282647992d14"
            ["research/draft-pick-fv-v6/r1_r4_historical_scored_universe_v6_1.jsonl"]="14068374b181ac15e1a6a2de972d6334a5c4d35e"
            ["research/draft-pick-fv-v6/r1_r4_historical_source_manifest_v6_1.json"]="50f06bfffd0a162d2e09bc8b8b8036fcfdce010f"
            ["research/draft-pick-fv-v6/build_r1_r4_historical_outcomes_v6_1.py"]="16eb96daf4bae33ed9858086d87288d732ee54d5"
            ["research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json"]="b52aca0a7a0313c35065850273f80e9df684fe2d"
            ["scripts/validation/snapshot_values.py"]="1efca4c35e910a95974c1bec0b06a106196618b3"
            ["research/package-adjustment-production-candidate-v1/live_deployment.json"]="fb192d6d52ca302f9694adc3ae39c7f1047f6140"
          )
          for path in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$path")"
            test "$actual" = "${EXPECTED[$path]}" || {
              echo "ERROR: frozen input drift $path"
              echo "expected=${EXPECTED[$path]} actual=$actual"
              exit 1
            }
          done

          # Never overwrite an executed repair.
          for p in             research/draft-pick-fv-v6/apply_r1_r4_dob_repair_v6_1.py             research/draft-pick-fv-v6/r1_r4_dob_repair_supplement_v6_1.jsonl             research/draft-pick-fv-v6/r1_r4_development_outcomes_dob_repaired_v6_1.jsonl             research/draft-pick-fv-v6/r1_r4_dob_repair_summary_v6_1.json             research/draft-pick-fv-v6/r1_r4_dob_repair_summary_v6_1.md             research/draft-pick-fv-v6/r1_r4_dob_repair_manifest_v6_1.json
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path("research/draft-pick-fv-v6")
          s=json.loads((d/"r1_r4_historical_outcome_summary_v6_1.json").read_text())
          m=json.loads((d/"r1_r4_historical_outcome_manifest_v6_1.json").read_text())
          assert s["decision"]=="STOP_V6_1_PHASE3_OUTCOME_AVAILABILITY_OR_COMPLETENESS_GATE"
          assert m["outcome_readiness_gate_pass"] is False
          assert m["development_selection_authorized_next_stage"] is False
          assert m["holdout_2024_pick_identity_file_read"] is False
          assert m["holdout_2024_rookie_outcomes_scored"] is False
          assert m["holdout_2024_pick_outcomes_remain_sealed"] is True
          bad={k:v for k,v in s["outcome_readiness_gate"]["by_year_cell"].items() if not v["pass"]}
          assert set(bad)=={"2021:r4_late"}
          f=bad["2021:r4_late"]
          assert (f["retained_occurrence_n"],f["sleeper_identity_ready_n"],f["primary_o1_ready_n"],f["primary_o2_ready_n"])==(248,248,248,233)
          print("PASS: exact Phase 3 STOP mechanism frozen.")
          PY

      - name: Freeze or reuse universal DOB-repair protocol
        id: protocol
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v6"
          J="$D/r1_r4_dob_repair_protocol_v6_1.json"
          M="$D/r1_r4_dob_repair_protocol_v6_1.md"
          X="$D/r1_r4_dob_repair_protocol_manifest_v6_1.json"

          present=0
          for p in "$J" "$M" "$X"; do
            [ -e "$p" ] && present=$((present+1))
          done

          if [ "$present" -eq 3 ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path("research/draft-pick-fv-v6")
          p=json.loads((d/"r1_r4_dob_repair_protocol_v6_1.json").read_text())
          m=json.loads((d/"r1_r4_dob_repair_protocol_manifest_v6_1.json").read_text())
          assert p["status"]=="FROZEN_POSTHARVEST_PRE_FIT_METADATA_REPAIR"
          assert p["decision"]=="FREEZE_V6_1_PHASE3_1_DOB_REPAIR_PROTOCOL_EXECUTION_AUTHORIZED"
          assert m["decision"]==p["decision"]
          r=p["repair_rule"]
          assert r["scope"]=="all_missing_DOB_targets_in_2018_2023_development_corpus"
          assert r["supplement_source"]=="https://api.sleeper.app/v1/players/nfl"
          assert r["join_key"]=="exact_frozen_sleeper_id_only"
          assert r["overwrite_existing_DOB"] is False
          assert r["manual_matching_allowed"] is False
          assert r["alternate_source_chasing_allowed"] is False
          assert r["failed_cell_specific_targeting_allowed"] is False
          assert r["candidate_fit_or_scoring_allowed"] is False
          assert r["same_readiness_threshold"]==0.95
          print("PASS: existing DOB repair protocol is valid and reusable.")
          PY
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$present" -eq 0 || {
            echo "ERROR: partial DOB repair protocol exists."
            exit 1
          }

          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          d=Path("research/draft-pick-fv-v6")
          summary_path=d/"r1_r4_historical_outcome_summary_v6_1.json"
          manifest_path=d/"r1_r4_historical_outcome_manifest_v6_1.json"
          outcomes_path=d/"r1_r4_development_outcomes_v6_1.jsonl"
          s=json.loads(summary_path.read_text())
          m=json.loads(manifest_path.read_text())

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def canon(o): return hashlib.sha256(json.dumps(o,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          bad={k:v for k,v in s["outcome_readiness_gate"]["by_year_cell"].items() if not v["pass"]}
          assert set(bad)=={"2021:r4_late"}
          f=bad["2021:r4_late"]
          assert f["sleeper_identity_ready_n"]==248
          assert f["primary_o1_ready_n"]==248
          assert f["primary_o2_ready_n"]==233

          generated=datetime.now(timezone.utc).isoformat()
          decision="FREEZE_V6_1_PHASE3_1_DOB_REPAIR_PROTOCOL_EXECUTION_AUTHORIZED"
          p={
            "schema_version":1,
            "study_id":"draft-pick-fv-v6-r1-r4-structural-continuity",
            "stage":"phase3_1_dob_lineage_repair_protocol",
            "status":"FROZEN_POSTHARVEST_PRE_FIT_METADATA_REPAIR",
            "generated_at_utc":generated,
            "decision":decision,
            "research_only":True,
            "disclosure":{
              "repair_is_post_outcome_harvest":True,
              "candidate_fit_has_not_occurred":True,
              "repair_trigger":"mechanical O2 readiness failure caused after identity/O1 readiness, before any candidate fitting or scoring",
              "observed_phase3_failure_cells":["2021:r4_late"],
              "player_outcome_magnitudes_used_to_choose_repair_source_or_targets":False,
              "candidate_results_used":False
            },
            "repair_rule":{
              "scope":"all_missing_DOB_targets_in_2018_2023_development_corpus",
              "supplement_source":"https://api.sleeper.app/v1/players/nfl",
              "source_field":["birth_date","birthdate"],
              "join_key":"exact_frozen_sleeper_id_only",
              "overwrite_existing_DOB":False,
              "manual_matching_allowed":False,
              "name_matching_allowed":False,
              "position_matching_allowed":False,
              "sleeper_current_position_allowed":False,
              "alternate_source_chasing_allowed":False,
              "failed_cell_specific_targeting_allowed":False,
              "candidate_fit_or_scoring_allowed":False,
              "same_readiness_threshold":0.95,
              "recompute_rule":"recompute only age-dependent O2 fields using frozen realized_prod_mult, position, V5 age curve, base scale, and position weight; preserve O1 and all football production/replacement data",
              "if_still_below_gate":"STOP_NO_FIT"
            },
            "frozen_phase3_failure":{
              "decision":s["decision"],
              "overall_H3_O2_ready_coverage":s["outcome_readiness_gate"]["overall_primary_o2_ready_coverage"],
              "failed_cell":"2021:r4_late",
              "retained_occurrence_n":248,
              "sleeper_identity_ready_n":248,
              "primary_o1_ready_n":248,
              "primary_o2_ready_n":233,
              "primary_o2_ready_coverage":f["primary_o2_ready_coverage"],
              "minimum_required":0.95
            },
            "firewalls":{
              "holdout_2024_pick_outcomes_remain_sealed":True,
              "market_or_ktc_values_read":False,
              "package_vote_data_read":False,
              "candidate_fit_performed":False,
              "candidate_scores_computed":False,
              "candidate_selection_performed":False,
              "production_change_authorized":False
            },
            "input_hashes":{
              summary_path.name:sha(summary_path),
              manifest_path.name:sha(manifest_path),
              outcomes_path.name:sha(outcomes_path)
            }
          }
          jp=d/"r1_r4_dob_repair_protocol_v6_1.json"
          jp.write_text(json.dumps(p,indent=2,sort_keys=True)+"\n")
          md=[
            "# Draft Pick FV V6.1 — Phase 3.1 DOB Repair Protocol","",
            f"**Decision:** `{decision}`","",
            "This is a post-harvest, pre-fit metadata repair. The rule is frozen before the new Sleeper DOB source is queried.","",
            "- Apply to every missing-DOB target in the complete 2018–2023 development corpus.",
            "- Join only by the already-frozen Sleeper ID.",
            "- Never overwrite an existing DOB.",
            "- No manual, name, or position matching.",
            "- No alternate-source chasing.",
            "- Keep the original 95% readiness threshold.",
            "- Recompute only age-dependent O2 fields; preserve O1 and football-production data.",
            "- If the same gate still fails, stop before fitting.",""
          ]
          mp=d/"r1_r4_dob_repair_protocol_v6_1.md"
          mp.write_text("\n".join(md))
          man={
            "schema_version":1,"stage":p["stage"],"status":p["status"],
            "generated_at_utc":generated,"decision":decision,
            "sleeper_DOB_source_queried":False,
            "candidate_fit_performed":False,
            "production_change_authorized":False,
            "protocol_sha256":sha(jp),
            "protocol_markdown_sha256":sha(mp),
            "canonical_protocol_sha256":canon(p)
          }
          (d/"r1_r4_dob_repair_protocol_manifest_v6_1.json").write_text(
            json.dumps(man,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: universal DOB-repair protocol frozen locally; Sleeper source not queried.")
          PY

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Prove protocol-only change scope
        if: steps.protocol.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v6/r1_r4_dob_repair_protocol_manifest_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_dob_repair_protocol_v6_1.json"
            "research/draft-pick-fv-v6/r1_r4_dob_repair_protocol_v6_1.md"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: exactly three repair-protocol files changed."

      - name: Run repository regression before protocol freeze
        if: steps.protocol.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu() { git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Commit repair protocol before querying Sleeper
        if: steps.protocol.outputs.created == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved before repair-protocol freeze."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/draft-pick-fv-v6/r1_r4_dob_repair_protocol_v6_1.json             research/draft-pick-fv-v6/r1_r4_dob_repair_protocol_v6_1.md             research/draft-pick-fv-v6/r1_r4_dob_repair_protocol_manifest_v6_1.json
          git commit -m "Freeze Draft Pick FV V6.1 DOB repair protocol"
          git push origin HEAD:main

      - name: Resolve frozen protocol commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "PROTOCOL_SHA=$(git rev-parse HEAD)"

  execute_repair:
    needs: freeze_protocol
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact frozen repair-protocol commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze_protocol.outputs.protocol_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "requests==2.34.2"

      - name: Write exact DOB-repair engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/apply_r1_r4_dob_repair_v6_1.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, copy, hashlib, importlib.util, json, math, re, time
          from collections import Counter, defaultdict
          from datetime import date, datetime, timezone
          from pathlib import Path
          from typing import Any
          import requests

          ROOT=Path.cwd(); V5=ROOT/"research/draft-pick-fv-v5"; V6=ROOT/"research/draft-pick-fv-v6"
          PROTOCOL=V6/"r1_r4_dob_repair_protocol_v6_1.json"
          PROTOCOL_MAN=V6/"r1_r4_dob_repair_protocol_manifest_v6_1.json"
          IN_OUTCOMES=V6/"r1_r4_development_outcomes_v6_1.jsonl"
          IN_SUMMARY=V6/"r1_r4_historical_outcome_summary_v6_1.json"
          IN_MAN=V6/"r1_r4_historical_outcome_manifest_v6_1.json"
          V5_PRE=V5/"r1_r2_bridge_preregistration_v5.json"
          AGE_PATH=ROOT/"scripts/validation/snapshot_values.py"
          OUT_SCRIPT=V6/"apply_r1_r4_dob_repair_v6_1.py"
          OUT_SUPPLEMENT=V6/"r1_r4_dob_repair_supplement_v6_1.jsonl"
          OUT_OUTCOMES=V6/"r1_r4_development_outcomes_dob_repaired_v6_1.jsonl"
          OUT_SUMMARY=V6/"r1_r4_dob_repair_summary_v6_1.json"
          OUT_MD=V6/"r1_r4_dob_repair_summary_v6_1.md"
          OUT_MAN=V6/"r1_r4_dob_repair_manifest_v6_1.json"
          SLEEPER_URL="https://api.sleeper.app/v1/players/nfl"
          MIN_READY=.95
          YEARS=(2018,2019,2020,2021,2022,2023)
          CELLS=tuple(f"r{r}_{t}" for r in range(1,5) for t in ("early","mid","late"))
          ROOT_ALLOWED={"birth_date","birth_date_source","status_flags","primary_o2_ready","H2","H3","H4","annual"}
          ANNUAL_ALLOWED={"age_on_sep1","age_multiplier","annual_player_equivalent_fv"}

          class GateError(RuntimeError): pass
          def now(): return datetime.now(timezone.utc).isoformat()
          def load(p): return json.loads(Path(p).read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def writej(p,o): Path(p).write_text(json.dumps(o,indent=2,sort_keys=True)+"\n")
          def readjl(p):
              out=[]
              for n,line in enumerate(Path(p).read_text().splitlines(),1):
                  if line.strip():
                      try: x=json.loads(line)
                      except json.JSONDecodeError as e: raise GateError(f"{p}:{n}: bad JSONL") from e
                      if not isinstance(x,dict): raise GateError(f"{p}:{n}: row not object")
                      out.append(x)
              return out
          def writejl(p,rows):
              with Path(p).open("w") as f:
                  for x in rows: f.write(json.dumps(x,sort_keys=True,separators=(",",":"))+"\n")
          def import_file(p,name):
              s=importlib.util.spec_from_file_location(name,p)
              if s is None or s.loader is None: raise GateError(f"cannot import {p}")
              m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          def stable(v):
              s=str(v or "").strip(); return s or None
          def dob(v):
              s=str(v or "").strip()
              if not s: return None
              try: d=date.fromisoformat(s[:10])
              except ValueError: return None
              return d.isoformat() if 1940<=d.year<=2010 else None
          def age(b,season):
              d=date.fromisoformat(b); a=date(season,9,1)
              x=a.year-d.year-((a.month,a.day)<(d.month,d.day))
              if not 18<=x<=50: raise GateError(f"implausible age {x}: {b} {season}")
              return x
          def canon(o): return hashlib.sha256(json.dumps(o,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          def guard():
              p=load(PROTOCOL); pm=load(PROTOCOL_MAN); s=load(IN_SUMMARY); m=load(IN_MAN); v5=load(V5_PRE)
              assert p["status"]=="FROZEN_POSTHARVEST_PRE_FIT_METADATA_REPAIR"
              assert p["decision"]=="FREEZE_V6_1_PHASE3_1_DOB_REPAIR_PROTOCOL_EXECUTION_AUTHORIZED"
              assert pm["decision"]==p["decision"]
              r=p["repair_rule"]
              assert r["scope"]=="all_missing_DOB_targets_in_2018_2023_development_corpus"
              assert r["supplement_source"]==SLEEPER_URL
              assert r["join_key"]=="exact_frozen_sleeper_id_only"
              assert r["overwrite_existing_DOB"] is False
              assert r["manual_matching_allowed"] is False
              assert r["alternate_source_chasing_allowed"] is False
              assert r["failed_cell_specific_targeting_allowed"] is False
              assert r["candidate_fit_or_scoring_allowed"] is False
              assert float(r["same_readiness_threshold"])==MIN_READY
              assert s["decision"]=="STOP_V6_1_PHASE3_OUTCOME_AVAILABILITY_OR_COMPLETENESS_GATE"
              assert m["outcome_readiness_gate_pass"] is False
              assert m["development_selection_authorized_next_stage"] is False
              assert m["holdout_2024_pick_identity_file_read"] is False
              assert m["holdout_2024_rookie_outcomes_scored"] is False
              assert m["holdout_2024_pick_outcomes_remain_sealed"] is True
              bad=[(k,v) for k,v in s["outcome_readiness_gate"]["by_year_cell"].items() if not v["pass"]]
              assert len(bad)==1 and bad[0][0]=="2021:r4_late"
              f=bad[0][1]
              assert (f["retained_occurrence_n"],f["sleeper_identity_ready_n"],f["primary_o1_ready_n"],f["primary_o2_ready_n"])==(248,248,248,233)
              assert m["output_hashes"][IN_OUTCOMES.name]==sha(IN_OUTCOMES)
              assert v5["status"]=="FROZEN_PRE_OUTCOME"
              return {"p":p,"s":s,"m":m,"v5":v5}

          def fetch_players():
              ses=requests.Session(); ses.headers["User-Agent"]="LOG-Draft-Pick-FV-V6-Phase3.1-DOB/1.0"
              waits=(2,4,8,15,30,45,60); last=None
              for i,w in enumerate(waits):
                  try:
                      r=ses.get(SLEEPER_URL,timeout=90)
                      if r.status_code==429:
                          last=GateError("429")
                          if i+1<len(waits): time.sleep(w); continue
                      r.raise_for_status(); raw=r.content; o=json.loads(raw.decode())
                      if not isinstance(o,dict): raise GateError("player index not object")
                      return o,{"url":SLEEPER_URL,"status":r.status_code,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"top_level_player_n":len(o),"fetched_at_utc":now()}
                  except (requests.RequestException,UnicodeDecodeError,json.JSONDecodeError,GateError) as e:
                      last=e
                      if i+1<len(waits): time.sleep(w)
              raise GateError(f"Sleeper transport failed: {last}")

          def key(row):
              sid=stable(row.get("sleeper_id"))
              return (int(row["draft_year"]),sid) if sid else None

          def missing_targets(rows):
              out={}
              for r in rows:
                  k=key(r)
                  if not k or dob(r.get("birth_date")): continue
                  c={"draft_year":k[0],"sleeper_id":k[1],"gsis_id":r.get("gsis_id"),"name":r.get("name"),"position":r.get("position")}
                  if k in out:
                      for f in ("gsis_id","position"):
                          if out[k].get(f) and c.get(f) and out[k][f]!=c[f]: raise GateError(f"target conflict {k} {f}")
                  else: out[k]=c
              return out

          def supplement(targets,players):
              resolved={}; rows=[]
              for k,meta in sorted(targets.items()):
                  y,sid=k; x=players.get(sid); raw=None
                  if isinstance(x,dict): raw=x.get("birth_date") or x.get("birthdate")
                  b=dob(raw)
                  if b:
                      for season in range(y,min(y+4,2026)): age(b,season)
                      resolved[k]=b
                  rows.append({**meta,"prior_birth_date":None,"supplement_birth_date":b,"supplement_source":"Sleeper /players/nfl exact frozen sleeper_id" if b else None,"status":"resolved_exact_sleeper_id_dob" if b else "unresolved"})
              return resolved,rows

          def crosscheck(rows,players):
              seen={}; c=Counter()
              for r in rows:
                  k=key(r)
                  if not k or k in seen: continue
