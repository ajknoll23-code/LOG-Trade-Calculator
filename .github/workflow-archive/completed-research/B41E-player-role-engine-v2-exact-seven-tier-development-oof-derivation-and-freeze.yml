name: B41E Player Role Engine V2 - Exact Seven-Tier Development OOF Derivation and Freeze

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  freeze_tier_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Freeze exact B41E tier-derivation implementation before any boundary computation
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          a_path = base / "player_role_v2_b41a_scientific_preregistration.json"
          c_path = base / "player_role_v2_b41c_model_development_preregistration.json"
          d_path = base / "player_role_v2_b41d_scientific_decision.json"
          oof_path = base / "player_role_v2_b41d_oof_predictions.csv.gz"
          contract_path = base / "player_role_v2_b41e_tier_derivation_contract.json"
          thresholds_path = base / "player_role_v2_b41e_tier_thresholds.json"

          for p in [a_path, c_path, d_path, oof_path]:
              if not p.exists():
                  raise RuntimeError(f"B41E_REQUIRED_FROZEN_INPUT_MISSING {p}")

          if thresholds_path.exists():
              raise RuntimeError(
                  "B41E_BOUNDARIES_ALREADY_EXIST_REFUSING_TO_REPREREGISTER"
              )

          a = json.loads(a_path.read_text())
          c = json.loads(c_path.read_text())
          d = json.loads(d_path.read_text())

          assert a["status"] == "PREREGISTERED_BEFORE_ANY_MODEL_FIT_OR_TARGET_ASSOCIATION"
          assert c["status"] == "PREREGISTERED_BEFORE_SCORER_VALIDATION_OR_MODEL_FIT"
          assert d["status"] == "DEVELOPMENT_MODEL_FAMILIES_SELECTED_BEFORE_TIER_DERIVATION"
          assert d["2025_holdout_opened"] is False
          assert d["week4_2026_opened"] is False
          assert d["role_tier_thresholds_derived"] is False
          assert d["production_model_fitted"] is False
          assert d["production_change_authorized"] is False

          expected_roles = [
              "Speculative",
              "Depth",
              "Understudy",
              "Rotational",
              "Starter",
              "Every-Down",
              "Elite",
          ]
          assert a["tier_derivation_plan"]["role_order"] == expected_roles
          assert a["tier_derivation_plan"]["minimum_development_share_per_tier"] == 0.05
          assert a["tier_derivation_plan"]["thresholds_frozen_before_2025_holdout"] is True
          assert a["tier_derivation_plan"]["thresholds_hand_assigned"] is False
          assert c["tier_policy"]["role_labels"] == expected_roles
          assert c["tier_policy"]["minimum_development_share_per_tier"] == 0.05
          assert c["tier_policy"]["must_be_monotonic_in_future_target"] is True
          assert c["tier_policy"]["derive_from_development_out_of_fold_predictions_only"] is True
          assert c["tier_policy"]["derive_only_after_model_family_is_frozen"] is True
          assert c["tier_policy"]["holdout_2025_used_to_set_tiers"] is False
          assert c["tier_policy"]["thresholds_hand_assigned"] is False

          expected_oof_sha = d["oof_predictions_sha256"]
          actual_oof_sha = hashlib.sha256(oof_path.read_bytes()).hexdigest()
          if actual_oof_sha != expected_oof_sha:
              raise RuntimeError(
                  f"B41E_OOF_SHA_MISMATCH expected={expected_oof_sha} actual={actual_oof_sha}"
              )
          assert d["oof_row_count"] == 85648

          selected = d["selected_family_by_position"]
          expected_positions = ["QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"]
          assert set(selected) == set(expected_positions)
          assert set(selected.values()) == {"nonnegative_ridge_linear"}

          contract = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41E-exact-tier-derivation-implementation-contract",
              "status": "FROZEN_BEFORE_ANY_B41E_TIER_BOUNDARY_COMPUTATION",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "scientific_parent": {
                  "b41a_tier_plan": (
                      "exactly seven ordered contiguous score intervals; "
                      "algorithmically maximize separation in primary future target; "
                      "minimum cell size and monotonicity constraints"
                  ),
                  "b41c_tier_policy": (
                      "development OOF only; after model family frozen; "
                      "minimum 5% development share per tier; monotonic future target; "
                      "no hand-assigned thresholds"
                  ),
              },
              "frozen_input": {
                  "source": "player_role_v2_b41d_oof_predictions.csv.gz",
                  "sha256": expected_oof_sha,
                  "row_count": 85648,
                  "development_seasons": [2019, 2020, 2021, 2022, 2023, 2024],
                  "score_column": "selected_oof_prediction",
                  "target_column": "target_percentile",
                  "selected_family_all_positions": "nonnegative_ridge_linear",
              },
              "interpretation_resolution": {
                  "threshold_scope": "separate deterministic threshold set for each position",
                  "reason": (
                      "B41D fits a distinct model by position and the frozen target is a "
                      "within-position percentile; therefore the seven contiguous role "
                      "intervals are derived within the same position-specific score space."
                  ),
                  "minimum_share_scope": "within each position's development OOF rows",
              },
              "exact_algorithm": {
                  "estimator": "sklearn.tree.DecisionTreeRegressor",
                  "estimator_purpose": (
                      "one-dimensional monotone CART segmentation of the frozen OOF role "
                      "score; squared-error split gain operationalizes algorithmic separation "
                      "in the primary future target"
                  ),
                  "x": "selected_oof_prediction",
                  "y": "target_percentile",
                  "criterion": "squared_error",
                  "splitter": "best",
                  "max_leaf_nodes": 7,
                  "min_samples_leaf_rule": "ceil(0.05 * n_position_rows)",
                  "monotonic_cst": [1],
                  "random_state": 20261003,
                  "min_impurity_decrease": 0.0,
                  "ccp_alpha": 0.0,
                  "required_leaf_count": 7,
                  "required_split_threshold_count": 6,
                  "tier_assignment": (
                      "sort the six learned score thresholds ascending; assign each score "
                      "to the number of thresholds it strictly exceeds, using numpy.searchsorted "
                      "with side='right', producing tier indexes 0..6"
                  ),
                  "target_monotonicity_gate": (
                      "mean target_percentile must be non-decreasing from tier 0 through tier 6"
                  ),
                  "minimum_share_gate": "every tier share within position must be >= 0.05",
                  "tie_and_reproducibility_rule": (
                      "use the deterministic scikit-learn best-split implementation under the "
                      "pinned package versions; no manual threshold movement or alternate seed"
                  ),
              },
              "pinned_runtime": {
                  "python": "3.13",
                  "numpy": "2.5.3",
                  "pandas": "2.3.3",
                  "scikit_learn": "1.9.1",
              },
              "role_order": expected_roles,
              "failure_policy": {
                  "fewer_than_seven_valid_leaves": "SCIENTIFIC_STOP_NO_RELAXATION",
                  "minimum_share_failure": "SCIENTIFIC_STOP_NO_RELAXATION",
                  "nonmonotonic_target_failure": "SCIENTIFIC_STOP_NO_RELAXATION",
                  "no_post_result_algorithm_change_in_v2": True,
                  "failed_position_blocks_complete_B41E_freeze": True,
              },
              "firewalls": {
                  "2025_holdout_may_be_opened": False,
                  "2026_week4_may_be_opened": False,
                  "production_model_may_be_fitted": False,
                  "production_roles_may_change": False,
                  "fundamental_values_may_change": False,
                  "league_rankings_may_change": False,
              },
              "production_change_authorized": False,
          }

          if contract_path.exists():
              existing = json.loads(contract_path.read_text())
              comparable_existing = dict(existing)
              comparable_new = dict(contract)
              comparable_existing.pop("created_at_utc", None)
              comparable_new.pop("created_at_utc", None)
              if comparable_existing != comparable_new:
                  raise RuntimeError("B41E_EXISTING_CONTRACT_DIFFERS_REFUSING_OVERWRITE")
              print("B41E exact tier contract already frozen identically")
          else:
              contract_path.write_text(
                  json.dumps(contract, indent=2, sort_keys=True) + "\n"
              )

          print(json.dumps({
              "status": contract["status"],
              "oof_sha256": expected_oof_sha,
              "positions": expected_positions,
              "algorithm": "monotone 1D CART / exactly 7 leaves / >=5% per position",
              "2025_holdout_opened": False,
              "production_authorized": False,
          }, indent=2))
          PY

      - name: Commit exact B41E tier contract before derivation
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          FILE="$BASE/player_role_v2_b41e_tier_derivation_contract.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Exact B41E contract already committed"
            exit 0
          fi

          git diff --cached --check
          git commit -m "Freeze Player Role V2 B41E exact tier derivation contract"
          git push origin HEAD:main

  derive_and_freeze_tiers:
    needs: freeze_tier_contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest frozen contract
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned tier-derivation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.5.3" \
            "pandas==2.3.3" \
            "scikit-learn==1.9.1"

      - name: Derive exactly seven monotone ordered role tiers from development OOF only
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import sklearn
          from sklearn.tree import DecisionTreeRegressor

          base = Path("research/player-role-v2")
          contract_path = base / "player_role_v2_b41e_tier_derivation_contract.json"
          decision_path = base / "player_role_v2_b41d_scientific_decision.json"
          oof_path = base / "player_role_v2_b41d_oof_predictions.csv.gz"
          out_path = base / "player_role_v2_b41e_tier_thresholds.json"
          report_path = base / "player_role_v2_b41e_report.md"

          if out_path.exists() or report_path.exists():
              raise RuntimeError("B41E_OUTPUT_ALREADY_EXISTS_REFUSING_REDERIVATION")

          contract = json.loads(contract_path.read_text())
          decision = json.loads(decision_path.read_text())

          assert contract["status"] == "FROZEN_BEFORE_ANY_B41E_TIER_BOUNDARY_COMPUTATION"
          assert contract["firewalls"]["2025_holdout_may_be_opened"] is False
          assert contract["firewalls"]["2026_week4_may_be_opened"] is False
          assert contract["production_change_authorized"] is False
          assert decision["2025_holdout_opened"] is False
          assert decision["week4_2026_opened"] is False
          assert decision["production_change_authorized"] is False

          expected_sha = contract["frozen_input"]["sha256"]
          actual_sha = hashlib.sha256(oof_path.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(
                  f"B41E_OOF_SHA_MISMATCH expected={expected_sha} actual={actual_sha}"
              )

          if sklearn.__version__ != "1.9.1":
              raise RuntimeError(
                  f"B41E_SKLEARN_VERSION_MISMATCH expected=1.9.1 actual={sklearn.__version__}"
              )
          if np.__version__ != "2.5.3":
              raise RuntimeError(
                  f"B41E_NUMPY_VERSION_MISMATCH expected=2.5.3 actual={np.__version__}"
              )
          if pd.__version__ != "2.3.3":
              raise RuntimeError(
                  f"B41E_PANDAS_VERSION_MISMATCH expected=2.3.3 actual={pd.__version__}"
              )

          df = pd.read_csv(oof_path, compression="gzip")
          required = {
              "row_id", "season", "position", "target_percentile",
              "selected_family", "selected_oof_prediction"
          }
          missing = required - set(df.columns)
          if missing:
              raise RuntimeError(f"B41E_OOF_MISSING_COLUMNS {sorted(missing)}")

          if len(df) != contract["frozen_input"]["row_count"]:
              raise RuntimeError(
                  f"B41E_OOF_ROW_COUNT_MISMATCH expected="
                  f"{contract['frozen_input']['row_count']} actual={len(df)}"
              )

          seasons = sorted(int(x) for x in df["season"].unique())
          if seasons != [2019, 2020, 2021, 2022, 2023, 2024]:
              raise RuntimeError(f"B41E_UNEXPECTED_SEASONS {seasons}")

          if df["row_id"].duplicated().any():
              raise RuntimeError("B41E_DUPLICATE_ROW_ID")
          if df["selected_oof_prediction"].isna().any():
              raise RuntimeError("B41E_NAN_SELECTED_OOF_SCORE")
          if df["target_percentile"].isna().any():
              raise RuntimeError("B41E_NAN_PRIMARY_TARGET")
          if set(df["selected_family"].dropna().unique()) != {"nonnegative_ridge_linear"}:
              raise RuntimeError(
                  "B41E_SELECTED_FAMILY_DRIFT "
                  f"{sorted(df['selected_family'].dropna().unique())}"
              )

          positions = ["QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"]
          role_order = contract["role_order"]
          results = {}

          for pos in positions:
              sub = df[df["position"] == pos].copy()
              n = len(sub)
              if n == 0:
                  raise RuntimeError(f"B41E_NO_ROWS_FOR_POSITION {pos}")

              x = pd.to_numeric(
                  sub["selected_oof_prediction"], errors="raise"
              ).to_numpy(dtype=float)
              y = pd.to_numeric(
                  sub["target_percentile"], errors="raise"
              ).to_numpy(dtype=float)

              if not np.isfinite(x).all() or not np.isfinite(y).all():
                  raise RuntimeError(f"B41E_NONFINITE_INPUT {pos}")
              if (x < -1e-12).any() or (x > 1 + 1e-12).any():
                  raise RuntimeError(f"B41E_SCORE_OUT_OF_RANGE {pos}")
              if (y < -1e-12).any() or (y > 1 + 1e-12).any():
                  raise RuntimeError(f"B41E_TARGET_OUT_OF_RANGE {pos}")

              min_leaf = math.ceil(0.05 * n)

              model = DecisionTreeRegressor(
                  criterion="squared_error",
                  splitter="best",
                  max_leaf_nodes=7,
                  min_samples_leaf=min_leaf,
                  min_impurity_decrease=0.0,
                  random_state=20261003,
                  ccp_alpha=0.0,
                  monotonic_cst=[1],
              )
              model.fit(x.reshape(-1, 1), y)

              leaves = int(model.get_n_leaves())
              thresholds = sorted(
                  float(t)
                  for feature, t in zip(
                      model.tree_.feature, model.tree_.threshold
                  )
                  if int(feature) >= 0
              )

              # In one-dimensional CART, six unique internal split thresholds define
              # the seven contiguous intervals.
              thresholds = sorted(set(thresholds))
              if leaves != 7 or len(thresholds) != 6:
                  raise RuntimeError(
                      f"B41E_SCIENTIFIC_STOP_NOT_EXACTLY_SEVEN_TIERS "
                      f"position={pos} leaves={leaves} thresholds={len(thresholds)}"
                  )

              tier_idx = np.searchsorted(
                  np.asarray(thresholds, dtype=float), x, side="right"
              )

              if tier_idx.min() != 0 or tier_idx.max() != 6:
                  raise RuntimeError(f"B41E_TIER_INDEX_RANGE_FAILURE {pos}")

              tier_rows = []
              target_means = []
              for idx, label in enumerate(role_order):
                  mask = tier_idx == idx
                  count = int(mask.sum())
                  share = count / n
                  if count == 0:
                      raise RuntimeError(
                          f"B41E_SCIENTIFIC_STOP_EMPTY_TIER {pos} {label}"
                      )
                  if share + 1e-12 < 0.05:
                      raise RuntimeError(
                          f"B41E_SCIENTIFIC_STOP_MIN_SHARE "
                          f"{pos} {label} share={share:.12f}"
                      )

                  mean_target = float(np.mean(y[mask]))
                  target_means.append(mean_target)

                  lower = None if idx == 0 else thresholds[idx - 1]
                  upper = None if idx == 6 else thresholds[idx]

                  tier_rows.append({
                      "tier_index": idx,
                      "role": label,
                      "lower_score_exclusive": lower,
                      "upper_score_inclusive": upper,
                      "n": count,
                      "share": share,
                      "mean_oof_score": float(np.mean(x[mask])),
                      "mean_target_percentile": mean_target,
                      "median_target_percentile": float(np.median(y[mask])),
                  })

              for i in range(6):
                  if target_means[i] > target_means[i + 1] + 1e-12:
                      raise RuntimeError(
                          f"B41E_SCIENTIFIC_STOP_NONMONOTONIC_TARGET "
                          f"{pos} tier={i}->{i+1} "
                          f"{target_means[i]:.12f}>{target_means[i+1]:.12f}"
                      )

              grand = float(np.mean(y))
              between_ss = 0.0
              within_ss = 0.0
              for idx in range(7):
                  mask = tier_idx == idx
                  mu = float(np.mean(y[mask]))
                  between_ss += int(mask.sum()) * (mu - grand) ** 2
                  within_ss += float(np.sum((y[mask] - mu) ** 2))

              results[pos] = {
                  "n_development_oof_rows": n,
                  "min_samples_leaf": min_leaf,
                  "thresholds_ascending": thresholds,
                  "tree_leaf_count": leaves,
                  "target_means_monotone_non_decreasing": True,
                  "minimum_tier_share_at_least_0_05": True,
                  "between_tier_sum_squares": between_ss,
                  "within_tier_sum_squares": within_ss,
                  "tiers": tier_rows,
              }

          payload = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41E-seven-tier-development-OOF-derivation",
              "status": "DEVELOPMENT_OOF_SEVEN_TIER_THRESHOLDS_FROZEN_BEFORE_2025_HOLDOUT",
              "contract_file": contract_path.name,
              "contract_status": contract["status"],
              "input_oof_file": oof_path.name,
              "input_oof_sha256": expected_sha,
              "input_oof_row_count": len(df),
              "development_seasons": [2019, 2020, 2021, 2022, 2023, 2024],
              "threshold_scope": "position_specific",
              "role_order": role_order,
              "position_results": results,
              "2025_holdout_opened": False,
              "week4_2026_opened": False,
              "production_model_fitted": False,
              "production_change_authorized": False,
              "next_stage": (
                  "Freeze the final full-development nonnegative-ridge model fitting "
                  "procedure/weights without opening 2025; then validate the complete "
                  "frozen Role V2 score+tier system on untouched 2025. B41C3 remains "
                  "mandatory before any production deployment."
              ),
          }

          out_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")

          lines = [
              "# Player Role V2 — B41E Seven-Tier Development OOF Freeze",
              "",
              "- Source: **B41D development out-of-fold predictions only**",
              "- Development seasons: **2019–2024 only**",
              "- 2025 holdout opened: **No**",
              "- 2026 Week 4 opened: **No**",
              "- Production model fitted: **No**",
              "- Production change authorized: **No**",
              "",
              "## Frozen tier thresholds",
              "",
              "| Position | Spec/Depth | Depth/Understudy | Understudy/Rotational | Rotational/Starter | Starter/Every-Down | Every-Down/Elite |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for pos in positions:
              t = results[pos]["thresholds_ascending"]
              lines.append(
                  f"| {pos} | " + " | ".join(f"{v:.6f}" for v in t) + " |"
              )

          lines += [
              "",
              "Every tier contains at least 5% of that position's development OOF rows.",
              "Development mean future-target percentile is non-decreasing across all seven tiers for every position.",
              "",
              "The 2025 holdout remains untouched. No thresholds may be retuned after it is opened.",
              "",
          ]
          report_path.write_text("\n".join(lines))

          print(json.dumps({
              "status": payload["status"],
              "positions": positions,
              "2025_holdout_opened": False,
              "week4_2026_opened": False,
              "production_model_fitted": False,
              "production_authorized": False,
          }, indent=2))
          PY

      - name: Commit frozen B41E seven-tier thresholds
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          git fetch origin main
          git rebase origin/main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$BASE/player_role_v2_b41e_tier_thresholds.json" \
            "$BASE/player_role_v2_b41e_report.md"

          git diff --cached --check
          git commit -m "Freeze Player Role V2 B41E seven-tier development OOF thresholds"
          git push origin HEAD:main

      - name: B41E closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "research/player-role-v2/"
              "player_role_v2_b41e_tier_thresholds.json"
          )
          d = json.loads(p.read_text())

          assert d["status"] == (
              "DEVELOPMENT_OOF_SEVEN_TIER_THRESHOLDS_FROZEN_BEFORE_2025_HOLDOUT"
          )
          assert d["2025_holdout_opened"] is False
          assert d["week4_2026_opened"] is False
          assert d["production_model_fitted"] is False
          assert d["production_change_authorized"] is False
          assert set(d["position_results"]) == {
              "QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"
          }

          for pos, r in d["position_results"].items():
              assert r["tree_leaf_count"] == 7
              assert len(r["thresholds_ascending"]) == 6
              assert r["target_means_monotone_non_decreasing"] is True
              assert r["minimum_tier_share_at_least_0_05"] is True
              assert len(r["tiers"]) == 7

          print("B41E CLOSEOUT: PASS_SEVEN_TIER_DEVELOPMENT_OOF_FREEZE")
          print("2025 HOLDOUT OPENED: false")
          print("2026 WEEK 4 OPENED: false")
          print("PRODUCTION MODEL FITTED: false")
          print("PRODUCTION CHANGE AUTHORIZED: false")
          print("NEXT: freeze final full-development model, then untouched 2025 validation")
          PY
