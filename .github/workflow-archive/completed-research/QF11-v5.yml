# QF11 V5 — Research ONLY; no release, no new quality threshold and no raw voter identity disclosure.
name: QF11 V5 - Full Voter Leave-One-Out Market Stability Research (Read Only)
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  research:
    name: Rebuild one live cohort, exclude every voter in turn, and report anonymous per-player rank stability
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install unchanged repository regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin QF10 production and QF11 research model inputs
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP: non-main dispatch''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP: checkout changed''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP: repository dirty''; exit 1; }

        git merge-base --is-ancestor f31f267c6b766aeb3679b255355d8d681d963058 HEAD || { echo ''STOP: QF11 V3 source-aligned
        lineage missing''; exit 1; }

        git merge-base --is-ancestor 590afe6046aabe3937a4c360c9c1e93a9cf1e08d HEAD || { echo ''STOP: uncertainty
        production deployment missing''; exit 1; }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP: protected source changed: $1"; exit 1; };
        }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        pin scripts/validation/evaluate_market_history.py 121fc506d5a5b3c949a1a3951cd92b3bcbb23a58

        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo ''QF11_V5_PINNED_MODEL_GREEN: immutable market/valuation sources and V3 lineage confirmed''

        '
    - name: Run canonical model self-tests before collecting votes
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/market/build_market_value.py --selftest

        python3 scripts/validation/snapshot_values.py --selftest

        '
    - name: Research full voter-history leave-one-out for the 504 covered players
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf11-v5.py <<'QF11_V5_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V5: prospective\
        \ full-voter LOO; no historical causal inference or publishing.\nUses one ingest, identical canonical weighting\
        \ and quantile calibration in each case.\nNever writes row-level ballots, voter IDs, or voter-level reports.\n\
        \"\"\"\nfrom __future__ import annotations\nimport hashlib, json, math, statistics, sys\nfrom collections\
        \ import Counter, defaultdict\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nROOT=Path.cwd()\n\
        assert (ROOT/'index.html').is_file(), 'STOP not repository root'\nfor item in ('scripts/market','scripts/validation'):\n\
        \    sys.path.insert(0,str(ROOT/item))\nsys.path.insert(0,str(ROOT))\nimport build_market_value as mv\n\
        import ktc_pipeline as ktc\nimport snapshot_values as snap\nfrom evaluate_market_history import build_alias_index,normalize_name\n\
        \nmodel=snap.compute_all_values(snap.load_from_html(ROOT/'index.html'))\npublished=json.loads((ROOT/'scripts/artifacts/generated/market_values.json').read_text())\n\
        assert len(model)==565 and len(published['players'])==504,'STOP model/published universe drift'\nassert\
        \ published['policy_sha256']==mv.POLICY_SHA256 and published['method_version']==mv.METHOD_VERSION\nassert\
        \ published['scale_semantics']==mv.SCALE_SEMANTICS\nrows,source=mv.load_vote_rows()\nassert source.get('mode')=='live_sheet'\
        \ and 400<=len(rows)<=100000,'STOP live ballot source missing'\nassert all(all(x.get(field) for field in\
        \ ('keep','trade','cut')) for x in rows),'STOP malformed ballot row'\nsrc_hash=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()).hexdigest()\n\
        \n# Canonical model is rebuilt from ONE immutable in-memory row cohort.\ndef build(selected):\n    weights=mv.build_voter_weights(selected)\n\
        \    pairs=mv.build_weighted_pairs(selected,weights)\n    assert len(pairs)==3*len(selected),'STOP canonical\
        \ pair count mismatch'\n    scores=ktc.weighted_bradley_terry(pairs)\n    ratings,audit=mv.resolve_league_ratings(model,scores)\n\
        \    calibrated=mv.quantile_calibrate(model,ratings)\n    return weights,calibrated\nweights,baseline=build(rows)\n\
        assert len(baseline)==504 and set(baseline)==set(published['players']),'STOP prospective player universe\
        \ drift'\nassert all(r['fundamental_value']==model[k]['value'] for k,r in baseline.items()),'STOP prospective\
        \ FV mismatch'\nassert sorted(p['market_value'] for p in baseline.values())==sorted(p['fundamental_value']\
        \ for p in baseline.values()),'STOP quantile value pool mismatch'\n\n# Independently check six-step reconstruction\
        \ at baseline as scientific anchor.\nagain_weights,again=build(rows)\nassert weights==again_weights and\
        \ again==baseline,'STOP non-reproducible same-cohort baseline'\n\n# Same-source provenance: count direct\
        \ voters without retaining identifiers.\nlookup=build_alias_index(list(model))\nresolver_cache={}\ndef resolve(n):\n\
        \    nn=normalize_name(str(n or ''))\n    if nn not in resolver_cache:\n        opts={tuple(x) for x in\
        \ lookup.get(nn,())}\n        if not opts:resolver_cache[nn]=None\n        else:\n            strength=min(x[1]\
        \ for x in opts)\n            choices={x[0] for x in opts if x[1]==strength}\n            resolver_cache[nn]=next(iter(choices))\
        \ if len(choices)==1 else None\n    return resolver_cache[nn]\nrepresented=defaultdict(set)\nfor vote in\
        \ rows:\n    uid=str(vote.get('voter_roster_id') or 'unknown')\n    for fld in ('keep','trade','cut'):\n\
        \        name=resolve(vote[fld])\n        if name in baseline: represented[name].add(uid)\n\n# Exhaustively\
        \ remove each distinct voter history IN-MEMORY. Reapply cap/weighting\n# on the remaining already eligible\
        \ rows. This is the same estimand on a deleted\n# eligible-ballot graph, NOT a historical published snapshot\
        \ reconstruction.\nids=tuple(sorted(weights))\nassert 5<=len(ids)<=100, 'STOP unexpected voter universe;\
        \ capacity review needed'\ninfluences={key:[] for key in baseline}\nuniverse_removed=Counter()\nsubsample_sizes=[]\n\
        for uid in ids:\n    selected=[r for r in rows if str(r.get('voter_roster_id') or 'unknown')!=uid]\n   \
        \ sub_weights,candidate=build(selected)\n    assert len(selected)<len(rows),'STOP voter deletion had no\
        \ effect'\n    assert len(candidate)>=400,'STOP voter deletion drastically changed universe'\n    assert\
        \ all(x['fundamental_value']==model[k]['value'] for k,x in candidate.items()),'STOP scenario FV changed'\n\
        \    assert all(isinstance(x['market_value'],int) and 0<=x['market_value']<=max(v['value'] for v in model.values())\
        \ and 1<=x['market_rank']<=len(candidate) for x in candidate.values()), 'STOP LOO quantile rank/point bound\
        \ drift'\n    subsample_sizes.append(len(candidate))\n    for key,ref in baseline.items():\n        if key\
        \ not in candidate:\n            universe_removed[key]+=1\n            continue\n        other=candidate[key]\n\
        \        influences[key].append({\n            'abs_points':abs(int(other['market_value'])-int(ref['market_value'])),\n\
        \            'abs_ranks':abs(float(other['market_rank'])-float(ref['market_rank'])),\n            'direct':uid\
        \ in represented[key],\n            'fixed_universe':len(candidate)==len(baseline),\n        })\n\n# Descriptive\
        \ reporting cutoffs are NOT scientific safety thresholds.\npoint_cutoffs=(100,500,1000)\nrank_cutoffs=(5,10)\n\
        def cohort(keys):\n    data={\n        'players':len(keys),'players_removed_in_any_LOO':sum(universe_removed[k]>0\
        \ for k in keys),\n        'players_any_abs_500_or_more':sum(any(v['abs_points']>=500 for v in influences[k])\
        \ for k in keys),\n        'players_any_abs_rank_5_or_more':sum(any(v['abs_ranks']>=5 for v in influences[k])\
        \ for k in keys),\n        'players_any_fixed_universe_abs_500_or_more':sum(any(v['fixed_universe'] and\
        \ v['abs_points']>=500 for v in influences[k]) for k in keys),\n        'players_with_direct_voter_LOO_abs_500_or_more':sum(any(v['direct']\
        \ and v['abs_points']>=500 for v in influences[k]) for k in keys),\n    }\n    return data\nordered=sorted(baseline,key=lambda\
        \ k:(-baseline[k]['market_value'],k))\ncohorts={f'top{n}':cohort(ordered[:n]) for n in (10,25,50,100,504)}\n\
        by_position={pos:cohort([k for k in baseline if baseline[k]['pos']==pos]) for pos in sorted({r['pos'] for\
        \ r in baseline.values()})}\nresults={}\nfor key,ref in sorted(baseline.items()):\n    dd=influences[key]\n\
        \    assert len(dd)+universe_removed[key]==len(ids),'STOP incomplete leave-one-out coverage'\n    def maximum(field,where=None):\n\
        \        values=[v[field] for v in dd if where is None or where(v)]\n        return max(values) if values\
        \ else None\n    results[key]={\n        'position':ref['pos'],'prospective_market_value':int(ref['market_value']),\n\
        \        'prospective_market_rank':float(ref['market_rank']),\n        'prospective_fv_center':int(ref['fundamental_value']),\n\
        \        'published_market_value_for_historical_reference_only':int(published['players'][key]['market_value']),\n\
        \        'direct_distinct_voters':len(represented[key]),\n        'voters_removed_in_which_player_disappears':universe_removed[key],\n\
        \        'scenario_count_player_retained':len(dd),\n        'worst_abs_point_movement_all_scenarios':maximum('abs_points'),\n\
        \        'worst_abs_point_movement_same_universe_only':maximum('abs_points',lambda v:v['fixed_universe']),\n\
        \        'worst_abs_point_movement_direct_voter_only':maximum('abs_points',lambda v:v['direct']),\n    \
        \    'worst_abs_rank_movement_all_scenarios':maximum('abs_ranks'),\n        'descriptive_point_exceedance_counts':{str(t):sum(v['abs_points']>=t\
        \ for v in dd) for t in point_cutoffs},\n        'descriptive_rank_exceedance_counts':{str(t):sum(v['abs_ranks']>=t\
        \ for v in dd) for t in rank_cutoffs},\n    }\nassert len(results)==504 and all(x['scenario_count_player_retained']+x['voters_removed_in_which_player_disappears']==len(ids)\
        \ for x in results.values())\nmax_move=max((v['worst_abs_point_movement_all_scenarios'] or 0) for v in results.values())\n\
        most=[{'player':key,'pos':v['position'],'max_abs_point_move':v['worst_abs_point_movement_all_scenarios'],\
        \ 'max_abs_rank_move':v['worst_abs_rank_movement_all_scenarios'],'player_removed_in_scenarios':v['voters_removed_in_which_player_disappears'],'direct_voters':v['direct_distinct_voters']}\
        \ for key,v in results.items()]\nmost.sort(key=lambda x:(-(x['max_abs_point_move'] or 0),x['player']))\n\
        # Critical interpretation: unlike previous published market, LOO scenarios share\n# the same source cohort,\
        \ but player disappearance changes the quantile universe.\nsummary={\n  'status':'RESEARCH_ONLY_FULL_VOTER_LEAVE_ONE_OUT',\n\
        \  'publication_authorized':False,\n  'threshold_selected':False,\n  'policy':'Unaltered canonical same-cohort\
        \ weighted Bradley-Terry + quantile calibration; full voter history deleted one at a time',\n  'source_after_daily_cap_sha256':src_hash,\n\
        \  'source_mode':'ONE_NEW_LIVE_SHEET_COHORT_NOT_PUBLISHED_OCT_7_COHORT',\n  'eligible_ballots':len(rows),\n\
        \  'distinct_voters':len(ids),\n  'voters_evaluated':len(ids),\n  'prospective_covered_players':len(baseline),\n\
        \  'leave_one_out_market_universe_sizes':dict(Counter(subsample_sizes)),\n  'max_observed_abs_point_movement':max_move,\n\
        \  'position_cohorts':by_position,\n  'market_rank_cohorts':cohorts,\n  'largest_sensitivity_players':most[:20],\n\
        \  'will_anderson':results['will anderson'],\n  'published_market_not_reproduced':True,\n  'stability_gate_preregistered':False,\n\
        \  'provenance_publishing_authorized':False,\n  'privacy':'No voter identifiers or ballots are stored in\
        \ artifacts or logs',\n}\nout=Path('/tmp/qf11-v5-output');out.mkdir(parents=True,exist_ok=True)\n(out/'RESEARCH_ONLY_full_voter_LOO_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\\\
        n')\n(out/'RESEARCH_ONLY_per_player_anonymous_influence.json').write_text(json.dumps({\n 'status':'RESEARCH_ONLY_NOT_FOR_MARKET_PUBLICATION',\n\
        \ 'source_after_daily_cap_sha256':src_hash,\n 'distinct_voters_deletion_scenarios':len(ids),\n 'players':results,\n\
        },indent=2,sort_keys=True)+'\\n')\nreadme=\"\"\"# QF11 V5 — exhaustive voter-history leave-one-out (research\
        \ only)\n\nNo Market Value refresh, Fundamental Value repricing, or per-player provenance publication is\
        \ authorized.\n\nAll leave-one-voter-out scenarios operate on one newly fetched canonical live ballot cohort;\
        \ the historical published vote cohort remains unavailable. This is a model stability description, not a\
        \ causal history reconstruction.\n\nWhen excluding a voter removes a player from the model, the absence\
        \ is counted and no comparable value is fabricated. When a scenario changes the model's player universe,\
        \ its calibrated price is not equivalent to a fixed-universe perturbation; those are counted separately.\n\
        \nThe 100/500/1000-point and 5/10-rank counts are descriptive reporting bins, never approved market quality\
        \ thresholds. No individual voter identifiers, raw ballots, or per-voter outputs are retained. Same-position\
        \ and cross-position evidence are not conflated.\n\"\"\"\n(out/'RESEARCH_ONLY_methodology.md').write_text(readme)\n\
        for fn in out.iterdir():\n    txt=fn.read_text()\n    for bad in ('voter_roster_id','sheet_url','raw_ballots','ballot_weight','voter_id'):\n\
        \        assert bad not in txt, 'STOP possible voter or raw source leakage: '+fn.name\nprint('QF11_V5_SOURCE_ALIGNED_EXHAUSTIVE_LOO\
        \ '+json.dumps({k:v for k,v in summary.items() if k not in ('position_cohorts','largest_sensitivity_players')},sort_keys=True))\n\
        print('QF11_V5_RANK_COHORT_INFLUENCE '+json.dumps(cohorts,sort_keys=True))\nprint('QF11_V5_TOP_INFLUENCE\
        \ '+json.dumps(most[:12],sort_keys=True))\nprint('QF11_V5_OUTPUT_HASHES '+json.dumps({f.name:hashlib.sha256(f.read_bytes()).hexdigest()\
        \ for f in out.iterdir()},sort_keys=True))\nprint('QF11_V5_RESEARCH_GREEN: full voter exclusion research\
        \ only; no published market/provenance change; no thresholds')\n\nQF11_V5_PY\npython3 -m py_compile /tmp/qf11-v5.py\n\
        python3 /tmp/qf11-v5.py\n"
    - name: Run all 14 frozen repository regressions and release guards
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''QF11_V5_14_REGRESSION_GROUPS_GREEN: frozen FV, market, PA, IDP, FA and Team Utility preserved''

        '
    - name: Prove zero writes to repository and protected model artifacts
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo ''STOP repo changed''; exit 1; }

        [[ "$(git hash-object index.html)" == c83e3f68d11853c072017e6bd83bb1ad085f4a3e ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == 829445174a77ceb4bb19dfd97a725e371d18efe8
        ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        ]] || exit 1

        echo ''QF11_V5_ZERO_WRITE_GREEN: research files only in /tmp, no pushes, model, artifacts or trade values
        changed''

        '
    - name: Archive anonymized aggregate research for 7 days only
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v5-RESEARCH-ONLY-full-voter-LOO
        path: /tmp/qf11-v5-output/
        retention-days: 7
        if-no-files-found: error
