              ),
          }

          RESULTS_PATH.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          def signed(x):
              return f"{x:+.6f}"

          safety_lines = []
          for profile in PROFILES:
              x = profile_results[profile]
              u = x["crossed_cluster_uncertainty"]
              safety_lines.append(
                  f"| {profile} | {int(x['effective_vote_count'])} | "
                  f"{x['distinct_voter_count']} | "
