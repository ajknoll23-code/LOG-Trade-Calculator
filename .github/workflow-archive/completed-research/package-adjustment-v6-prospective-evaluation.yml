      - name: Prove exactly three intended research files changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v6/prospective_evaluation_v1.json",
              "research/package-adjustment-v6/prospective_evaluation_v1.md",
              "research/package-adjustment-v6/prospective_evaluation_manifest_v1.json",
          }

          lines = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          ).splitlines()

          actual = {line[3:] for line in lines if line.strip()}
          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )

          print(
              "PASS: only the three intended V6P1 prospective evaluation "
              "files changed."
          )
          PY

      - name: Upload V6P1 prospective evaluation proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v6p1-prospective-evaluation
          path: |
            research/package-adjustment-v6/prospective_evaluation_v1.json
            research/package-adjustment-v6/prospective_evaluation_v1.md
            research/package-adjustment-v6/prospective_evaluation_manifest_v1.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit V6P1 prospective evaluation to main
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          RESULTS="$D/prospective_evaluation_v1.json"
          SUMMARY="$D/prospective_evaluation_v1.md"
          MANIFEST="$D/prospective_evaluation_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$RESULTS" "$SUMMARY" "$MANIFEST"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=("$RESULTS" "$SUMMARY" "$MANIFEST")
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          test "${#STAGED[@]}" -eq 3
          test "$(printf '%s\n' "${STAGED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m \
            "Evaluate Package Adjustment V6P1 prospective confirmation"

          git pull --rebase origin main

          test "$(git hash-object "$D/prospective_preregistration_v1.json")" = \
            "d0000c9f42c7be11a8d49d0029993a28fabebc73"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/prospective_feasibility_amendment_v1.json")" = \
            "48cafa8ca85c9488f864e8eca6a8882f3e09b3ed"
          test "$(git hash-object "$D/prospective_exact_1800_frozen_v1.json")" = \
            "a9d78303aaa659aed9864e8090f53d9c2e36bd9b"
          test "$(git hash-object "$D/prospective_exact_1800_freeze_manifest_v1.json")" = \
            "d684bc7d8cff32351f1b8ff409137ca02eab379b"

          mapfile -t COMMITTED < <(
            git diff-tree --no-commit-id --name-only -r HEAD | sort
          )

          test "${#COMMITTED[@]}" -eq 3
          test "$(printf '%s\n' "${COMMITTED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git push origin main

          echo \
            "PASS: one-time V6P1 prospective evaluation committed; production unchanged."
