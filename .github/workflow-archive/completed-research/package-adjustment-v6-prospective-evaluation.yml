      - name: Verify evaluation contract and outputs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          result_path = d / "prospective_evaluation_v1.json"
          summary_path = d / "prospective_evaluation_v1.md"
          manifest_path = d / "prospective_evaluation_manifest_v1.json"

          result = json.loads(result_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          assert result["research_only"] is True
          assert result["production_change_authorized"] is False
          assert result["automatic_production_promotion_allowed"] is False
          assert result["evaluation_is_one_time_confirmatory"] is True
          assert result["evaluation_used_only_frozen_exact_1800_evidence"] is True

          assert result["fitting_performed"] is False
          assert result["refitting_performed"] is False
          assert result["recalibration_performed"] is False
          assert result["parameter_tuning_performed"] is False
          assert result["model_selection_performed"] is False
          assert result["candidate_or_baseline_parameters_changed"] is False

          primary = result["primary_confirmation"]
          assert primary["difference_definition"] == (
              "D_overall = LL_C2 - LL_C1; lower is better"
          )
          assert primary["minimum_practical_improvement"] == 0.005
          assert primary["point_gate"]["rule"] == "D_overall <= -0.005"
          assert primary["uncertainty_gate"]["rule"] == (
              "one-sided 95% upper confidence bound for D_overall < 0"
          )
          assert primary["all_primary_conditions_required"] is True
          assert primary["primary_pass"] == (
              primary["point_gate"]["pass"]
              and primary["uncertainty_gate"]["pass"]
          )

          bootstrap = primary["crossed_cluster_uncertainty"]
          assert bootstrap["valid_draws"] == 5000
          assert bootstrap["valid_draw_attempts"] <= 50000
          assert bootstrap["seed"] == 20260924
          assert bootstrap["lifetime_cap_reapplied_inside_draw"] is False
          assert bootstrap[
              "draw_invalid_if_any_required_prospective_cell_missing"
          ] is True

          required_profiles = {
              "45/33/22",
              "50/30/20",
              "50/25/25",
              "55/30/15",
              "60/25/15",
              "60/20/20",
          }
          assert set(result["safety_profile_diagnostics"]) == required_profiles
          assert result["safety_profile_interpretation"][
              "individual_pass_fail_gates_applied"
          ] is False
          assert result["safety_profile_interpretation"][
              "all_six_reported"
          ] is True

          for profile, diagnostic in result[
              "safety_profile_diagnostics"
          ].items():
              assert diagnostic["cell_count"] == 4
              assert diagnostic["effective_vote_count"] > 0
              assert diagnostic["distinct_voter_count"] > 0
              assert len(
                  diagnostic["crossed_cluster_uncertainty_interval"]
              ) == 2
              assert (
                  diagnostic["one_sided_95_percent_upper_bound"]
                  == diagnostic["crossed_cluster_uncertainty"][
                      "one_sided_95_percent_upper_bound"
                  ]
              )
              u = diagnostic["crossed_cluster_uncertainty"]
              assert u["valid_draws"] == 5000
              assert len(u["ci_90_percentile"]) == 2
              assert len(u["ci_95_percentile"]) == 2

          assert len(result["cell_diagnostics"]) == 24
          assert manifest["status"] == "v6p1_prospective_evaluation_manifest"
          assert manifest["result"]["primary_pass"] == primary["primary_pass"]
          assert manifest["result"][
              "all_six_safety_profiles_reported"
          ] is True

          assert manifest["outputs"]["results"]["sha256"] == hashlib.sha256(
              result_path.read_bytes()
          ).hexdigest()
          assert manifest["outputs"]["summary"]["sha256"] == hashlib.sha256(
              summary_path.read_bytes()
          ).hexdigest()

          expected_statuses = {
              "v6p1_feasible_prospective_primary_confirmation_failed_research_only",
              "v6p1_feasible_prospective_primary_confirmation_passed_eligible_for_separate_human_review_with_all_safety_diagnostics_visible",
          }
          assert result["status"] in expected_statuses

          print(
              "PASS: one-time V6P1 prospective evaluation obeyed the frozen "
              "primary gate, uncertainty contract, and six-profile diagnostic contract."
          )
          PY

