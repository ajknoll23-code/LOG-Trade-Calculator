name: Package Adjustment V6P1 Prospective Evaluation

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install frozen evaluation dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install \
            "numpy==2.3.3" \
            "requests==2.34.2"

      - name: Guard frozen V6P1 confirmation contract
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/prospective_preregistration_v1.json")" = \
            "d0000c9f42c7be11a8d49d0029993a28fabebc73"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/prospective_feasibility_amendment_v1.json")" = \
            "48cafa8ca85c9488f864e8eca6a8882f3e09b3ed"
          test "$(git hash-object "$D/prospective_feasibility_amendment_manifest_v1.json")" = \
            "6fb69d64b31c104b43666734b46599f9ed49abcd"
          test "$(git hash-object "$D/prospective_voting_activation_manifest_v1.json")" = \
            "faf5a5153d2bf2e7bd867aec5d4a96ec227ac679"
          test "$(git hash-object "$D/prospective_exact_1800_frozen_v1.json")" = \
            "a9d78303aaa659aed9864e8090f53d9c2e36bd9b"
          test "$(git hash-object "$D/prospective_exact_1800_freeze_manifest_v1.json")" = \
            "d684bc7d8cff32351f1b8ff409137ca02eab379b"

          test "$(sha256sum "$D/prospective_exact_1800_frozen_v1.json" | awk '{print $1}')" = \
            "63e8869abad40243a1c9261f308543b31bfe5660ff0392d548eebf098525e151"
          test "$(sha256sum "$D/package_vote_challenges_v6_prospective_v1.json" | awk '{print $1}')" = \
            "2739a0f0728b422cce632fec2381c5a4d35a572dbfabc46c97c0591bb2f5a3fc"

          for p in \
            "$D/prospective_evaluation_v1.json" \
            "$D/prospective_evaluation_v1.md" \
            "$D/prospective_evaluation_manifest_v1.json"
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          prereg = json.loads((d / "prospective_preregistration_v1.json").read_text())
          amendment = json.loads((d / "prospective_feasibility_amendment_v1.json").read_text())
          frozen = json.loads((d / "prospective_exact_1800_frozen_v1.json").read_text())
          manifest = json.loads((d / "prospective_exact_1800_freeze_manifest_v1.json").read_text())
          catalog = json.loads((d / "package_vote_challenges_v6_prospective_v1.json").read_text())

          assert prereg["status"] == "frozen_v6_prospective_preregistration"
          assert prereg["frozen"] is True
          assert prereg["production_change_authorized"] is False

          baseline = prereg["baseline"]
          candidate = prereg["candidate"]

          assert baseline["model_id"] == "C1"
          assert baseline["log_beta"] == -8.0
          assert math.isclose(
              baseline["beta"],
              math.exp(baseline["log_beta"]),
              rel_tol=0.0,
              abs_tol=1e-15,
          )
          assert baseline["delta_left"] == -0.7047591064574323
          assert baseline["v_ref"] == 5401.0
          assert baseline["size3_multiplier"] == 2.0512371846911357
          assert baseline["parameter_tuning_allowed"] is False
          assert baseline["recalibration_allowed"] is False
          assert baseline["refitting_allowed"] is False

          assert candidate["selected_model_class"] == "C2"
          assert candidate["q"] == 2.9897594788655337
          assert candidate["log_beta"] == 1.9976423224804345
          assert math.isclose(
              candidate["beta"],
              math.exp(candidate["log_beta"]),
              rel_tol=0.0,
              abs_tol=1e-14,
          )
          assert candidate["delta_left"] == -0.10215583668554708
          assert candidate["v_ref"] == 5401.0
          assert candidate["parameter_tuning_allowed"] is False
          assert candidate["recalibration_allowed"] is False
          assert candidate["refitting_allowed"] is False

          assert amendment["status"] == "frozen_v6p1_pre_activation_feasibility_amendment"
          evaluation = amendment["prospective_evaluation_contract_v2"]
          assert evaluation["evaluation_occurs_once_after_exact_maturity_freeze"] is True
          assert evaluation["primary_metric"] == (
              "equal_cell_macro_mean_log_loss_across_all_24 prospective cells"
          )
          assert evaluation["primary_minimum_practical_improvement"] == 0.005
          assert evaluation["primary_point_gate"] == "D_overall <= -0.005"
          assert evaluation["primary_uncertainty_gate"] == (
              "one-sided 95% upper confidence bound for D_overall < 0"
          )
          assert evaluation["primary_gate_is_only_confirmatory_performance_gate"] is True
          assert evaluation["no_cross_validation"] is True
          assert evaluation["no_fitting"] is True
          assert evaluation["no_model_selection"] is True
          assert evaluation["no_parameter_tuning"] is True
          assert evaluation["no_recalibration"] is True
          assert evaluation["no_refitting"] is True

          required_profiles = [
              "45/33/22",
              "50/30/20",
              "50/25/25",
              "55/30/15",
              "60/25/15",
              "60/20/20",
          ]
          assert evaluation["safety_profiles_must_all_be_reported"] == required_profiles
          assert evaluation["safety_profiles_may_not_be_hidden_or_dropped_after_results"] is True
          assert evaluation["safety_profile_role"].startswith(
              "mandatory descriptive diagnostics"
          )

          u = evaluation["uncertainty_method"]
          assert u["method"].startswith(
              "crossed/two-way voter-and-challenge cluster resampling"
          )
          assert u["cluster_multiplicity_scales_frozen_original_ballot_weight"] is True
          assert u["lifetime_cap_reapplied_inside_draw"] is False
          assert u["draw_invalid_if_any_required_prospective_cell_missing"] is True
          assert u["valid_draws"] == 5000
          assert u["max_attempts"] == 50000
          assert u["seed"] == 20260924

          assert frozen["status"] == "frozen_exact_1800_v6p1_prospective_evidence"
          assert frozen["frozen"] is True
          assert frozen["checkpoint_selection_outcome_blind"] is True
          assert frozen["model_evaluation_performed"] is False
          assert frozen["frozen_effective_votes"] == 1800.0
          assert frozen["raw_checkpoint_ballot_count"] == 1800
          assert frozen["distinct_voter_clusters"] == 45
          assert len(frozen["ballots"]) == 1800

          assert manifest["status"] == (
              "frozen_exact_1800_v6p1_prospective_evidence_manifest"
          )
          assert manifest["maturity_anchor"]["status"] == "STOP_AND_FREEZE_AT_1800"
          assert manifest["checkpoint_1800"]["coverage_gates_pass"] is True
          assert manifest["checkpoint_1800"]["cells_passing_both_gates"] == 24
          assert manifest["dataset"]["sha256"] == (
              "63e8869abad40243a1c9261f308543b31bfe5660ff0392d548eebf098525e151"
          )

          assert catalog["status"] == "frozen_v6p1_prospective_catalog"
          assert len(catalog["challenges"]) == 504
          assert len({c["research_cell"] for c in catalog["challenges"]}) == 24

          print(
              "PASS: frozen exact-1800 V6P1 evidence and one-time "
              "confirmatory C2-vs-C1 contract are unchanged."
          )
          PY

      - name: Verify production remains V1.6 before evaluation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test fixed prediction and crossed-bootstrap primitives
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import math
          import numpy as np

          def sigmoid(x):
              if x >= 0:
                  return 1.0 / (1.0 + math.exp(-x))
              ex = math.exp(x)
              return ex / (1.0 + ex)

          def log_loss_from_eta(eta, y):
              return float(np.logaddexp(0.0, eta) - y * eta)

          assert math.isclose(sigmoid(0.0), 0.5)
          assert math.isclose(
              log_loss_from_eta(0.0, 0.0),
              math.log(2.0),
              rel_tol=0.0,
              abs_tol=1e-14,
          )
          assert math.isclose(
              log_loss_from_eta(0.0, 1.0),
              math.log(2.0),
              rel_tol=0.0,
              abs_tol=1e-14,
          )

          v = np.array([3000.0, 2000.0, 1000.0])
          q = 2.9897594788655337
          c2 = float(np.power(np.sum(np.power(v, q)), 1.0 / q))
          assert max(v) < c2 < sum(v)

          rng = np.random.default_rng(20260924)
          vm = rng.multinomial(45, [1.0 / 45.0] * 45)
          cm = rng.multinomial(494, [1.0 / 494.0] * 494)
          assert int(vm.sum()) == 45
          assert int(cm.sum()) == 494

          print(
              "PASS: fixed prediction/log-loss math and frozen crossed-cluster "
              "resampling primitives behave as expected."
          )
          PY

      - name: Run one-time preregistered V6P1 prospective evaluation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np

          D = Path("research/package-adjustment-v6")

          PREREG_PATH = D / "prospective_preregistration_v1.json"
          AMENDMENT_PATH = D / "prospective_feasibility_amendment_v1.json"
          CATALOG_PATH = D / "package_vote_challenges_v6_prospective_v1.json"
          DATA_PATH = D / "prospective_exact_1800_frozen_v1.json"
          FREEZE_MANIFEST_PATH = D / "prospective_exact_1800_freeze_manifest_v1.json"

          RESULTS_PATH = D / "prospective_evaluation_v1.json"
          SUMMARY_PATH = D / "prospective_evaluation_v1.md"
          MANIFEST_PATH = D / "prospective_evaluation_manifest_v1.json"

          prereg = json.loads(PREREG_PATH.read_text())
          amendment = json.loads(AMENDMENT_PATH.read_text())
          catalog_doc = json.loads(CATALOG_PATH.read_text())
          frozen = json.loads(DATA_PATH.read_text())
          freeze_manifest = json.loads(FREEZE_MANIFEST_PATH.read_text())

          baseline = prereg["baseline"]
          candidate = prereg["candidate"]
          contract = amendment["prospective_evaluation_contract_v2"]
          uncertainty_contract = contract["uncertainty_method"]

          PROFILES = [
              "45/33/22",
              "50/30/20",
              "50/25/25",
              "55/30/15",
              "60/25/15",
              "60/20/20",
          ]

          assert contract["safety_profiles_must_all_be_reported"] == PROFILES

          V_REF = 5401.0
          SIZE3_MULT = 2.0512371846911357
          Q = 2.9897594788655337

          BETA_C1 = float(baseline["beta"])
          DELTA_C1 = float(baseline["delta_left"])
          BETA_C2 = float(candidate["beta"])
          DELTA_C2 = float(candidate["delta_left"])

          assert float(baseline["v_ref"]) == V_REF
          assert float(candidate["v_ref"]) == V_REF
          assert float(baseline["size3_multiplier"]) == SIZE3_MULT
          assert float(candidate["q"]) == Q

          ENV = baseline["size3_composition_envelope"]
          EXPECTED_ENV = {
              "largestMin": 0.41991319353657897,
              "largestMax": 0.4696171986399035,
              "middleMin": 0.30827026434134036,
              "middleMax": 0.36725409193118236,
              "smallestMin": 0.2120186203977994,
              "smallestMax": 0.2247276896617619,
          }
          assert ENV == EXPECTED_ENV

          ballots = list(frozen["ballots"])
          challenges = {c["id"]: c for c in catalog_doc["challenges"]}

          assert len(ballots) == 1800
          assert len(challenges) == 504
          assert len({b["voter_cluster"] for b in ballots}) == 45
          assert len({b["challenge_id"] for b in ballots}) == 494
          assert len({b["research_cell"] for b in ballots}) == 24
          assert abs(
              sum(float(b["frozen_ballot_weight"]) for b in ballots) - 1800.0
          ) < 1e-12

          cluster_counts = Counter(b["voter_cluster"] for b in ballots)
          assert len(cluster_counts) == 45
          assert set(cluster_counts.values()) == {40}

          def challenge_values(challenge):
              values = np.array(
                  [float(x["fv"]) for x in challenge["package"]],
                  dtype=float,
              )
              assert len(values) == 3
              assert np.all(values > 0)
              target = float(challenge["target_fv"])
              assert target > 0
              return values, target

          def c1_supported(values):
              ordered = np.sort(values)[::-1]
              shares = ordered / float(np.sum(ordered))
              return (
                  shares[0] >= ENV["largestMin"] - 1e-12
                  and shares[0] <= ENV["largestMax"] + 1e-12
                  and shares[1] >= ENV["middleMin"] - 1e-12
                  and shares[1] <= ENV["middleMax"] + 1e-12
                  and shares[2] >= ENV["smallestMin"] - 1e-12
                  and shares[2] <= ENV["smallestMax"] + 1e-12
              )

          def stable_sigmoid(eta):
              if eta >= 0:
                  return 1.0 / (1.0 + math.exp(-eta))
              ex = math.exp(eta)
              return ex / (1.0 + ex)

          def model_eta(challenge, model, package_left):
              values, target = challenge_values(challenge)

              if model == "C1":
                  score_package = float(np.sum(values))
                  score_target = (
                      target * SIZE3_MULT
                      if c1_supported(values)
                      else target
                  )
                  beta = BETA_C1
                  delta_left = DELTA_C1
              elif model == "C2":
                  score_package = float(
                      np.power(
                          np.sum(np.power(values, Q)),
                          1.0 / Q,
                      )
                  )
                  score_target = target
                  beta = BETA_C2
                  delta_left = DELTA_C2
              else:
                  raise KeyError(model)

              eta = (
                  beta * ((score_package - score_target) / V_REF)
                  + delta_left * (1.0 if package_left else 0.0)
              )
              return float(eta), score_package, score_target

          def ballot_prediction_loss(ballot, model):
              challenge = challenges[ballot["challenge_id"]]
              y = 1.0 if bool(ballot["package_preferred"]) else 0.0
              package_left = bool(ballot["package_displayed_left"])
              eta, score_package, score_target = model_eta(
                  challenge,
                  model,
                  package_left,
              )
              p = stable_sigmoid(eta)
              loss = float(np.logaddexp(0.0, eta) - y * eta)
              return {
                  "eta": eta,
                  "prediction": p,
                  "loss": loss,
                  "score_package": score_package,
                  "score_target": score_target,
              }

          rows = []
          for ballot in ballots:
              cid = ballot["challenge_id"]
              challenge = challenges[cid]

              assert ballot["research_cell"] == challenge["research_cell"]
              assert ballot["composition_profile"] == (
                  challenge["component_profile"]["label"]
              )

              c1 = ballot_prediction_loss(ballot, "C1")
              c2 = ballot_prediction_loss(ballot, "C2")

              rows.append({
                  "ordinal": int(ballot["ordinal"]),
                  "voter_cluster": str(ballot["voter_cluster"]),
                  "challenge_id": cid,
                  "cell": str(ballot["research_cell"]),
                  "profile": str(ballot["composition_profile"]),
                  "weight": float(ballot["frozen_ballot_weight"]),
                  "y": 1.0 if bool(ballot["package_preferred"]) else 0.0,
                  "package_left": (
                      1.0 if bool(ballot["package_displayed_left"]) else 0.0
                  ),
                  "c1_prediction": c1["prediction"],
                  "c2_prediction": c2["prediction"],
                  "c1_loss": c1["loss"],
                  "c2_loss": c2["loss"],
                  "paired_loss_difference_c2_minus_c1": (
                      c2["loss"] - c1["loss"]
                  ),
              })

          assert len(rows) == 1800
          assert sorted(r["ordinal"] for r in rows) == list(range(1, 1801))

          by_cell = defaultdict(list)
          for row in rows:
              by_cell[row["cell"]].append(row)

          assert len(by_cell) == 24

          cell_results = {}
          for cell in sorted(by_cell):
              rr = by_cell[cell]
              denominator = sum(r["weight"] for r in rr)
              assert denominator > 0

              c1_loss = sum(
                  r["weight"] * r["c1_loss"] for r in rr
              ) / denominator
              c2_loss = sum(
                  r["weight"] * r["c2_loss"] for r in rr
              ) / denominator
              diff = c2_loss - c1_loss
              profile = rr[0]["profile"]

              assert all(r["profile"] == profile for r in rr)

              cell_results[cell] = {
                  "composition_profile": profile,
                  "effective_vote_count": float(denominator),
                  "distinct_voter_count": len(
                      {r["voter_cluster"] for r in rr}
                  ),
                  "distinct_challenge_count": len(
                      {r["challenge_id"] for r in rr}
                  ),
                  "C1_mean_log_loss": float(c1_loss),
                  "C2_mean_log_loss": float(c2_loss),
                  "paired_C2_minus_C1_point_difference": float(diff),
              }

          c1_overall = float(
              np.mean([x["C1_mean_log_loss"] for x in cell_results.values()])
          )
          c2_overall = float(
              np.mean([x["C2_mean_log_loss"] for x in cell_results.values()])
          )
          d_overall = c2_overall - c1_overall

          profile_results = {}
          for profile in PROFILES:
              cells = [
                  (cell, result)
                  for cell, result in cell_results.items()
                  if result["composition_profile"] == profile
              ]
              assert len(cells) == 4

              profile_rows = [
                  r for r in rows if r["profile"] == profile
              ]

              profile_results[profile] = {
                  "cell_count": 4,
                  "effective_vote_count": float(
                      sum(r["weight"] for r in profile_rows)
                  ),
                  "distinct_voter_count": len(
                      {r["voter_cluster"] for r in profile_rows}
                  ),
                  "distinct_challenge_count": len(
                      {r["challenge_id"] for r in profile_rows}
                  ),
                  "C1_equal_cell_macro_mean_log_loss": float(
                      np.mean([x["C1_mean_log_loss"] for _, x in cells])
                  ),
                  "C2_equal_cell_macro_mean_log_loss": float(
                      np.mean([x["C2_mean_log_loss"] for _, x in cells])
                  ),
                  "paired_C2_minus_C1_point_difference": float(
                      np.mean([
                          x["paired_C2_minus_C1_point_difference"]
                          for _, x in cells
                      ])
                  ),
              }

          # Frozen crossed/two-way cluster uncertainty.
          voters = sorted({r["voter_cluster"] for r in rows})
          challenge_ids = sorted({r["challenge_id"] for r in rows})
          cells = sorted(by_cell)
          profiles = PROFILES

          assert len(voters) == 45
          assert len(challenge_ids) == 494
          assert len(cells) == 24

          voter_index = {v: i for i, v in enumerate(voters)}
          challenge_index = {
              c: i for i, c in enumerate(challenge_ids)
          }
          cell_index = {c: i for i, c in enumerate(cells)}
          profile_index = {p: i for i, p in enumerate(profiles)}

          voter_idx = np.array(
              [voter_index[r["voter_cluster"]] for r in rows],
              dtype=int,
          )
          challenge_idx = np.array(
              [challenge_index[r["challenge_id"]] for r in rows],
              dtype=int,
          )
          cell_idx = np.array(
              [cell_index[r["cell"]] for r in rows],
              dtype=int,
          )
          weight = np.array(
              [r["weight"] for r in rows],
              dtype=float,
          )
          paired_diff = np.array(
              [r["paired_loss_difference_c2_minus_c1"] for r in rows],
              dtype=float,
          )

          cell_profile_idx = np.array(
              [
                  profile_index[
                      cell_results[cell]["composition_profile"]
                  ]
                  for cell in cells
              ],
              dtype=int,
          )

          VALID_DRAWS = int(uncertainty_contract["valid_draws"])
          MAX_ATTEMPTS = int(uncertainty_contract["max_attempts"])
          SEED = int(uncertainty_contract["seed"])

          assert VALID_DRAWS == 5000
          assert MAX_ATTEMPTS == 50000
          assert SEED == 20260924

          rng = np.random.default_rng(SEED)

          overall_draws = []
          profile_draws = {p: [] for p in profiles}
          attempts = 0

          while len(overall_draws) < VALID_DRAWS:
              attempts += 1
              if attempts > MAX_ATTEMPTS:
                  raise RuntimeError(
                      "crossed bootstrap exhausted max_attempts before "
                      "reaching 5,000 valid draws"
                  )

              voter_mult = rng.multinomial(
                  len(voters),
                  [1.0 / len(voters)] * len(voters),
              )
              challenge_mult = rng.multinomial(
                  len(challenge_ids),
                  [1.0 / len(challenge_ids)] * len(challenge_ids),
              )

              draw_weight = (
                  weight
                  * voter_mult[voter_idx]
                  * challenge_mult[challenge_idx]
              )

              cell_den = np.bincount(
                  cell_idx,
                  weights=draw_weight,
                  minlength=24,
              )

              # Frozen contract: a draw is invalid if any prospective cell
              # disappears under crossed cluster resampling.
              if np.any(cell_den <= 0):
                  continue

              cell_num = np.bincount(
                  cell_idx,
                  weights=draw_weight * paired_diff,
                  minlength=24,
              )
              cell_draw_diff = cell_num / cell_den

              overall_draws.append(float(np.mean(cell_draw_diff)))

              for profile in profiles:
                  pi = profile_index[profile]
                  values = cell_draw_diff[cell_profile_idx == pi]
                  assert len(values) == 4
                  profile_draws[profile].append(float(np.mean(values)))

          def summarize_draws(values):
              arr = np.asarray(values, dtype=float)
              assert len(arr) == VALID_DRAWS
              return {
                  "valid_draws": VALID_DRAWS,
                  "valid_draw_attempts": attempts,
                  "bootstrap_mean": float(np.mean(arr)),
                  "bootstrap_sd": float(np.std(arr, ddof=1)),
                  "ci_90_percentile": [
                      float(np.quantile(arr, 0.05)),
                      float(np.quantile(arr, 0.95)),
                  ],
                  "ci_95_percentile": [
                      float(np.quantile(arr, 0.025)),
                      float(np.quantile(arr, 0.975)),
                  ],
                  "one_sided_95_percent_upper_bound": float(
                      np.quantile(arr, 0.95)
                  ),
                  "fraction_C2_better": float(np.mean(arr < 0.0)),
              }

          overall_uncertainty = summarize_draws(overall_draws)

          for profile in profiles:
              profile_uncertainty = summarize_draws(profile_draws[profile])
              profile_results[profile]["crossed_cluster_uncertainty_interval"] = (
                  profile_uncertainty["ci_95_percentile"]
              )
              profile_results[profile]["one_sided_95_percent_upper_bound"] = (
                  profile_uncertainty["one_sided_95_percent_upper_bound"]
              )
              profile_results[profile]["crossed_cluster_uncertainty"] = (
                  profile_uncertainty
              )

          point_gate = d_overall <= -0.005 + 1e-15
          uncertainty_gate = (
              overall_uncertainty[
                  "one_sided_95_percent_upper_bound"
              ] < 0.0
          )
          primary_pass = bool(point_gate and uncertainty_gate)

          status = (
