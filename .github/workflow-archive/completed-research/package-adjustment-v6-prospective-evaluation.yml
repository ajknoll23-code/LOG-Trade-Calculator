                          "d684bc7d8cff32351f1b8ff409137ca02eab379b"
                      ),
                      "sha256": sha256(FREEZE_MANIFEST_PATH),
                  },
              },
              "evaluation_contract": {
                  "fixed_models_only": ["C1", "C2"],
                  "primary_metric": contract["primary_metric"],
                  "primary_point_gate": contract["primary_point_gate"],
                  "primary_uncertainty_gate": (
                      contract["primary_uncertainty_gate"]
                  ),
                  "primary_gate_is_only_confirmatory_performance_gate": True,
                  "safety_profiles_are_descriptive_not_individual_gates": True,
