name: QF11 V30 - In Calculator KTC V2 Interactive Demo UI Deployment (No Votes)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: trade-desk-ktc-v2-ui-staging-deploy
  cancel-in-progress: false
jobs:
  deploy_demo:
    name: Append an isolated sample-only interactive KTC V2 preview under package voting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main with UI deployment permission
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install frozen regression dependencies
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin V29 deployed UI and all protected production sources
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html aee08a1e834c49cdc4aec1797a2789db7241f005
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        [[ -f data/players_cache.json ]] || { echo STOP_MUTABLE_CACHE_MISSING; exit 1; }
        echo QF11_V30_FROZEN_SOURCE_PINS_GREEN
    - name: Add sample-only KTC V2 interactive demo within the existing Market Research section
      run: "set -euo pipefail\npython3 - <<'QF11_V30_PATCH'\nimport hashlib, json\nfrom pathlib import Path\np=Path('index.html');\
        \ before=p.read_text(encoding='utf-8')\nblock='<!-- QF11_V30_KTC_V2_INTERACTIVE_DEMO_START -->\\n<style\
        \ id=\"qf11-v30-demo-style\">\\n#qf11V2Demo { margin-top:14px; padding:14px; border:1px solid var(--line,rgba(255,255,255,.16));\
        \ border-radius:10px; background:rgba(255,255,255,.02); }\\n#qf11V2Demo .qf11-demo-eyebrow { font-family:\\\
        'IBM Plex Mono\\',monospace; font-size:10px; letter-spacing:.05em; color:var(--gold,#e8bd73); font-weight:700;\
        \ margin-bottom:6px; }\\n#qf11V2Demo .qf11-demo-copy { color:var(--text-dim,#aab); font-size:12px; line-height:1.45;\
        \ margin-bottom:12px; }\\n#qf11V2Demo .qf11-demo-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));\
        \ gap:9px; }\\n#qf11V2Demo .qf11-demo-card { min-width:0; border:1px solid var(--line,rgba(255,255,255,.16));\
        \ border-radius:9px; padding:10px; }\\n#qf11V2Demo .qf11-demo-name { font-weight:700; font-size:13px; margin-bottom:4px;\
        \ }\\n#qf11V2Demo .qf11-demo-sub { font-size:10px; color:var(--text-dim,#aab); margin-bottom:9px; }\\n#qf11V2Demo\
        \ .qf11-demo-roles { display:flex; gap:4px; }\\n#qf11V2Demo button[data-qf11-v2-role] { flex:1; min-width:0;\
        \ padding:8px 2px; border-radius:6px; font-size:9px; font-weight:700; border:1px solid var(--line,rgba(255,255,255,.16));\
        \ background:transparent; color:var(--text,#fff); cursor:pointer; }\\n#qf11V2Demo button[data-qf11-v2-role][aria-pressed=\"\
        true\"] { border-color:var(--gold,#e8bd73); background:var(--gold,#e8bd73); color:var(--bg,#091827); }\\\
        n#qf11V2Demo button:focus-visible { outline:2px solid var(--gold,#e8bd73); outline-offset:2px; }\\n#qf11V2Demo\
        \ .qf11-demo-status { margin-top:12px; padding:10px 11px; min-height:34px; border:1px solid var(--line,rgba(255,255,255,.16));\
        \ border-radius:8px; font-size:12px; line-height:1.4; }\\n#qf11V2Demo .qf11-demo-tools { margin-top:10px;\
        \ display:flex; gap:8px; flex-wrap:wrap; }\\n#qf11V2Demo .qf11-demo-tools button { padding:9px 12px; border:1px\
        \ solid var(--line,rgba(255,255,255,.16)); border-radius:7px; color:var(--text,#fff); background:transparent;\
        \ cursor:pointer; font-size:11px; }\\n#qf11V2Demo .qf11-demo-warning { margin-top:10px; font-size:10.5px;\
        \ line-height:1.45; color:var(--text-dim,#aab); }\\n@media(max-width:640px){#qf11V2Demo .qf11-demo-grid{grid-template-columns:1fr;}#qf11V2Demo\
        \ button[data-qf11-v2-role]{padding:10px 4px;font-size:11px;}}\\n</style>\\n<script id=\"qf11-v30-demo-runtime\"\
        >\\n/* QF11 V30: visible synthetic demo ONLY. Never connect to production KTC or record participant responses.\
        \ */\\n(function () {\\n  \\'use strict\\';\\n  const EXAMPLES = Object.freeze([\\'Sample Player A\\',\\\
        'Sample Player B\\',\\'Sample Player C\\']);\\n  const ORDERS = Object.freeze([[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]);\\\
        n  const ROLES = Object.freeze([\\'KEEP\\',\\'TRADE\\',\\'CUT\\']);\\n  const selection = Object.create(null);\\\
        n  let orderIndex = 0;\\n  function clearSelection(){ for(const key of Object.keys(selection)) delete selection[key];\
        \ }\\n  function assign(index, role){\\n    if(!Number.isInteger(index) || index<0 || index>2 || !ROLES.includes(role))\
        \ return;\\n    for(const key of Object.keys(selection)) if(selection[key]===role) delete selection[key];\\\
        n    selection[index] = role;\\n  }\\n  function isComplete(){\\n    return Object.keys(selection).length===3\
        \ && new Set(Object.values(selection)).size===3 && ROLES.every(role=>Object.values(selection).includes(role));\\\
        n  }\\n  function install(){\\n    const section=document.getElementById(\\'qf11KtcV2Section\\');\\n   \
        \ if(!section || document.getElementById(\\'qf11V2Demo\\')) return;\\n    const demo=document.createElement(\\\
        'div\\');\\n    demo.id=\\'qf11V2Demo\\';\\n    demo.setAttribute(\\'aria-label\\',\\'KTC V2 practice demo;\
        \ responses are not recorded\\');\\n    demo.innerHTML=`\\n      <div class=\"qf11-demo-eyebrow\">INTERACTIVE\
        \ PRACTICE \xB7 NO REAL PLAYERS</div>\\n      <div class=\"qf11-demo-copy\">Try ranking three <strong>fictional\
        \ examples</strong> from your most preferred dynasty player to your least preferred. Choose each role once.\
        \ Nothing here is submitted or saved.</div>\\n      <div class=\"qf11-demo-grid\" id=\"qf11V2DemoCards\"\
        ></div>\\n      <div class=\"qf11-demo-status\" id=\"qf11V2DemoStatus\" role=\"status\" aria-live=\"polite\"\
        ></div>\\n      <div class=\"qf11-demo-tools\">\\n        <button type=\"button\" data-qf11-v2-command=\"\
        reset\">Clear selections</button>\\n        <button type=\"button\" data-qf11-v2-command=\"reorder\">Try\
        \ another display order</button>\\n      </div>\\n      <div class=\"qf11-demo-warning\"><strong>Demo only.</strong>\
        \ There is no Submit button, no participant questionnaire, no network request, and no vote storage. KTC\
        \ V1 and trade-package voting remain independent and unchanged. Real KTC V2 voting is not yet open.</div>`;\\\
        n    section.appendChild(demo);\\n    function render(){\\n      const cards=document.getElementById(\\\
        'qf11V2DemoCards\\');\\n      const status=document.getElementById(\\'qf11V2DemoStatus\\');\\n      if(!cards\
        \ || !status) return;\\n      cards.innerHTML=ORDERS[orderIndex].map(index=>{\\n        const name=EXAMPLES[index];\\\
        n        const controls=ROLES.map(role=>`<button type=\"button\" data-qf11-v2-index=\"${index}\" data-qf11-v2-role=\"\
        ${role}\" aria-pressed=\"${selection[index]===role?\\'true\\':\\'false\\'}\">${role}</button>`).join(\\\
        '\\');\\n        return `<div class=\"qf11-demo-card\"><div class=\"qf11-demo-name\">${name}</div><div class=\"\
        qf11-demo-sub\">FICTIONAL EXAMPLE \xB7 NO PLAYER DATA</div><div class=\"qf11-demo-roles\">${controls}</div></div>`;\\\
        n      }).join(\\'\\');\\n      const count=Object.keys(selection).length;\\n      if(isComplete()){\\n\
        \        const byRole=role=>EXAMPLES[Number(Object.keys(selection).find(key=>selection[key]===role))];\\\
        n        status.textContent=\\'Practice ranking complete: KEEP \\'+byRole(\\'KEEP\\')+\\' > TRADE \\'+byRole(\\\
        'TRADE\\')+\\' > CUT \\'+byRole(\\'CUT\\')+\\'. Nothing was submitted.\\';\\n      } else {\\n        status.textContent=\\\
        'Practice: \\'+count+\\' of 3 sample players ranked. Choose one KEEP, one TRADE, and one CUT.\\';\\n   \
        \   }\\n    }\\n    demo.addEventListener(\\'click\\',function(event){\\n      const button=event.target.closest(\\\
        'button\\');\\n      if(!button || !demo.contains(button))return;\\n      const command=button.getAttribute(\\\
        'data-qf11-v2-command\\');\\n      if(command===\\'reset\\'){clearSelection();render();return;}\\n     \
        \ if(command===\\'reorder\\'){orderIndex=(orderIndex+1)%ORDERS.length;clearSelection();render();return;}\\\
        n      const role=button.getAttribute(\\'data-qf11-v2-role\\');\\n      const raw=button.getAttribute(\\\
        'data-qf11-v2-index\\');\\n      if(role && raw!==null){assign(Number(raw),role);render();}\\n    });\\\
        n    render();\\n  }\\n  if(document.readyState===\\'loading\\')document.addEventListener(\\'DOMContentLoaded\\\
        ',install,{once:true});\\n  else install();\\n})();\\n</script>\\n<!-- QF11_V30_KTC_V2_INTERACTIVE_DEMO_END\
        \ -->'\nassert before.count('<!-- QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_START')==1,'STOP_V29_STAGE_MISSING'\n\
        assert before.count('<!-- QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_END -->')==1,'STOP_V29_STAGE_END_MISSING'\n\
        assert before.count('KTC V1 \u2014 Keep / Trade / Cut')==1,'STOP_KTC_V1_MISSING'\nassert before.count('KTC\
        \ V2 \u2014 Keep / Trade / Cut')==1,'STOP_KTC_V2_MISSING'\nassert 'QF11_V30_KTC_V2_INTERACTIVE_DEMO_START'\
        \ not in before,'STOP_PREEXISTING_V30'\nassert before.count('</body>')==1,'STOP_MULTIPLE_BODY'\nassert before.count(\"\
        moveVoteSection(marketPane, 'ktcWrap');\")==1,'STOP_V1_NAV_DRIFT'\nassert before.count(\"moveVoteSection(marketPane,\
        \ 'packageVoteWrap');\")==1,'STOP_PACKAGE_NAV_DRIFT'\nassert 'fetch(KTC_SUBMIT_URL' in before,'STOP_EXISTING_KTC_V1_SUBMISSION_MISSING'\n\
        assert 'packageVoting.insertAdjacentElement(\\'afterend\\', section)' in before,'STOP_V29_PLACEMENT_DRIFT'\n\
        changed=before.replace('</body>',block+'\\n</body>',1)\nassert changed.replace(block+'\\n','',1)==before,'STOP_NONSCOPED_MODIFICATION'\n\
        p.write_text(changed,encoding='utf-8')\nPath('/tmp/qf11-v30-demo-runtime.js').write_text(block.split('<script\
        \ id=\"qf11-v30-demo-runtime\">',1)[1].split('</script>',1)[0],encoding='utf-8')\nmanifest={'schema':'QF11_V30_INTEGRATED_INTERACTIVE_KTC_V2_DEMO_UI_ONLY',\
        \ 'base_sha256':hashlib.sha256(before.encode()).hexdigest(),'modified_sha256':hashlib.sha256(changed.encode()).hexdigest(),\
        \ 'base_index_git_blob':'aee08a1e834c49cdc4aec1797a2789db7241f005','market_tab_location':'AFTER_EXISTING_PACKAGE_VOTING',\
        \ 'sample_players_only':True, 'actual_pilot_trio_exposed':False,'six_synthetic_display_orders':True, 'participant_recruitment':False,'live_v2_ballot':False,'vote_submission':False,'local_or_remote_vote_storage':False,'market_or_fv_change':False,'production_v1_or_package_unchanged':True,'pilot_approval_claimed':False}\n\
        Path('/tmp/qf11-v30-deployment-manifest.json').write_text(json.dumps(manifest,indent=2)+'\\n')\nprint('QF11_V30_SCOPED_UI_PATCH_GREEN\
        \ '+json.dumps(manifest,sort_keys=True))\n\nQF11_V30_PATCH\n"
    - name: Reject transport, persistent storage and actual pilot trio leakage
      run: "set -euo pipefail\nnode --check /tmp/qf11-v30-demo-runtime.js\npython3 - <<'PY'\nimport json,subprocess\n\
        from pathlib import Path\njs=Path('/tmp/qf11-v30-demo-runtime.js').read_text()\nraw=Path('index.html').read_text()\n\
        m=json.loads(Path('/tmp/qf11-v30-deployment-manifest.json').read_text())\nfor t in ('fetch(', 'XMLHttpRequest',\
        \ 'WebSocket', 'sendBeacon', 'localStorage', 'sessionStorage', 'document.cookie', 'KTC_SUBMIT_URL', 'navigator.',\
        \ 'FormData(', 'postMessage('):\n assert t not in js,'STOP_DEMO_STORAGE_OR_TRANSPORT_'+t\nassert 'Brock\
        \ Bowers' not in js and 'Tyler Warren' not in js and 'TreVeyon Henderson' not in js,'STOP_PILOT_TRIO_LEAK'\n\
        assert all(x in js for x in ('Sample Player A','Sample Player B','Sample Player C','QF11 V30','data-qf11-v2-role',\
        \ 'aria-pressed','Nothing was submitted'))\nassert raw.count('QF11_V30_KTC_V2_INTERACTIVE_DEMO_START')==1\n\
        assert raw.count('KTC V1 \u2014 Keep / Trade / Cut')==1 and raw.count('KTC V2 \u2014 Keep / Trade / Cut')==1\n\
        assert m['vote_submission'] is False and m['local_or_remote_vote_storage'] is False\nprint('QF11_V30_ZERO_TRANSPORT_ZERO_STORAGE_NO_REAL_BALLOTS_GREEN')\n\
        PY\n"
    - name: Exercise the real demo JavaScript via synthetic DOM click tests
      run: |
        set -euo pipefail
        node <<'QF11_V30_DOM'
        const fs=require('fs'),vm=require('vm');
        const js=fs.readFileSync('/tmp/qf11-v30-demo-runtime.js','utf8');
        const section={children:[],appendChild(el){this.children.push(el)}};
        const nodes={qf11KtcV2Section:section};
        let cardHtml='',status='';
        const cards={set innerHTML(v){cardHtml=v},get innerHTML(){return cardHtml}};
        const label={set textContent(v){status=v},get textContent(){return status}};
        const fakeDocument={readyState:'complete',getElementById(id){return ({...nodes,qf11V2Demo:section.children[0],qf11V2DemoCards:cards,qf11V2DemoStatus:label})[id]||null},createElement(tag){if(tag!=='div')throw Error('unexpected root');return {id:'',attributes:{},innerHTML:'',listeners:{},setAttribute(k,v){this.attributes[k]=v},addEventListener(k,fn){this.listeners[k]=fn},contains(v){return v!==null}}}};
        vm.runInNewContext(js,{document:fakeDocument});
        if(section.children.length!==1)throw Error('demo missing or duplicated');
        const demo=section.children[0];if(demo.id!=='qf11V2Demo'||!demo.innerHTML.includes('NO REAL PLAYERS'))throw Error('incorrect stage');
        if(!cardHtml.includes('Sample Player A')||!cardHtml.includes('Sample Player B')||!cardHtml.includes('Sample Player C'))throw Error('sample trio missing');
        if(!status.includes('0 of 3'))throw Error('init status');
        function tap(attributes){const button={getAttribute(k){return attributes[k]??null}};demo.listeners.click({target:{closest(){return button}}});}
        function choose(i,r){tap({'data-qf11-v2-index':String(i),'data-qf11-v2-role':r});}
        choose(0,'KEEP');choose(1,'TRADE');choose(2,'CUT');
        if(!status.includes('Practice ranking complete')||!status.includes('Nothing was submitted'))throw Error('completion message');
        choose(2,'KEEP');if(!status.includes('2 of 3')||status.includes('ranking complete'))throw Error('duplicate role not evicted');
        tap({'data-qf11-v2-command':'reset'});if(!status.includes('0 of 3'))throw Error('reset failed');
        const pre=cardHtml;tap({'data-qf11-v2-command':'reorder'});if(!status.includes('0 of 3')||pre===cardHtml)throw Error('reorder failed');
        for(let i=0;i<5;i++)tap({'data-qf11-v2-command':'reorder'});
        if(pre!==cardHtml)throw Error('six order cycle failed');
        vm.runInNewContext(js,{document:fakeDocument});if(section.children.length!==1)throw Error('duplicate install');
        console.log('QF11_V30_INTEGRATED_DEMO_INTERACTION_SIX_ORDER_ROLE_UNIQUENESS_GREEN');
        QF11_V30_DOM
    - name: Run all 14 frozen regression groups and release selftests
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V30_FROZEN_14_REGRESSIONS_GREEN
    - name: Prove index diff only adds the scoped V2 demo and model remains frozen
      run: |
        set -euo pipefail
        [[ "$(git diff --name-only)" == 'index.html' ]] || { echo STOP_EXTRA_MODIFIED_PATHS; exit 1; }
        git diff --check
        python3 - <<'PY'
        from pathlib import Path
        import subprocess
        old=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
        new=Path('index.html').read_text()
        mark1='<!-- QF11_V30_KTC_V2_INTERACTIVE_DEMO_START -->'
        mark2='<!-- QF11_V30_KTC_V2_INTERACTIVE_DEMO_END -->'
        assert new.count(mark1)==1 and new.count(mark2)==1,'STOP_V30_MARKER_COUNT'
        block=new.split(mark1,1)[1].split(mark2,1)[0]
        assert new.replace(mark1+block+mark2+'\n','',1)==old,'STOP_UNAUTHORIZED_INDEX_DELTA'
        assert 'fetch(KTC_SUBMIT_URL' in old and new.count('fetch(KTC_SUBMIT_URL')==old.count('fetch(KTC_SUBMIT_URL'),'STOP_V1_PATH_DRIFT'
        assert new.count('function ktcSubmit()')==old.count('function ktcSubmit()')==1
        assert new.count('function renderPackageVote()')==old.count('function renderPackageVote()')==1
        assert new.count("moveVoteSection(marketPane, 'ktcWrap');")==1
        assert new.count("moveVoteSection(marketPane, 'packageVoteWrap');")==1
        print('QF11_V30_EXACT_APPEND_ONLY_UI_DIFF_GREEN')
        PY
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_UNAUTHORIZED_FROZEN_MODIFICATION: $1"; exit 1; }; }
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        echo QF11_V30_NO_PRODUCTION_MODEL_CHANGE_GREEN
    - name: Archive deployed demo status and safeguarding manifest (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v30-UI-ONLY-ktc-v2-interactive-demonstration
        path: /tmp/qf11-v30-deployment-manifest.json
        retention-days: 7
        if-no-files-found: error
    - name: Commit and deploy KTC V2 interactive demo without real votes
      run: |
        set -euo pipefail
        [[ "$(git diff --name-only)" == 'index.html' ]] || { echo STOP_SCOPE_DRIFT; exit 1; }
        git fetch origin main --quiet
        [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo STOP_MAIN_MOVED_RETRY; exit 1; }
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- index.html
        [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo STOP_STAGED_SCOPE_DRIFT; exit 1; }
        git commit -m 'Market Research: add KTC V2 practice demo with no vote collection'
        git push origin HEAD:refs/heads/main
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_AFTER_DEPLOY_DIRTY; exit 1; }
        echo "QF11_V30_INTERACTIVE_DEMO_DEPLOYED_GREEN $(git rev-parse HEAD)"
