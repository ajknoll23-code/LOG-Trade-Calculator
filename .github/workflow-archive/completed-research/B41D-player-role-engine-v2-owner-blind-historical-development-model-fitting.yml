name: B41D-R2 Player Role Engine V2 - Frozen Fitter Contract-Path Recovery and Development Model Fitting
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Freeze B41D-R1 cohort reproducibility recovery before modeling
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\n\npython3 - <<'PYREC'\nfrom datetime import datetime, timezone\nimport base64\nimport hashlib\nimport json\nfrom pathlib import Path\n\nbase = Path(\"research/player-role-v2\")\ngate_path = base / \"player_role_v2_b41d_development_gate_amendment.json\"\ncontract_path = base / \"player_role_v2_b41d_development_contract.json\"\nprep_path = base / \"player_role_v2_b41d_prepare_modeling_data.py\"\n\nfor p in [gate_path, contract_path, prep_path, base / \"player_role_v2_b41d_model_fitter.py\"]:\n    if not p.exists():\n        raise RuntimeError(f\"B41D_R1_REQUIRED_FROZEN_ARTIFACT_MISSING {p}\")\n\ngate = json.loads(gate_path.read_text())\ncontract = json.loads(contract_path.read_text())\nassert gate[\"status\"] == \"POST_B41C2_GOVERNANCE_AMENDMENT_BEFORE_ANY_B41D_TARGET_ASSOCIATION\"\nassert gate[\"development_authorization\"][\"B41D_2019_2024_model_fitting_authorized\"] is True\nassert gate[\"development_authorization\"][\"B41D_may_open_2025\"\
        ] is False\nassert gate[\"development_authorization\"][\"B41D_may_open_2026_week4\"] is False\nassert contract[\"status\"] == \"FROZEN_BEFORE_ANY_B41D_PREDICTOR_TARGET_ASSOCIATION\"\nassert contract[\"holdout_2025_opened\"] is False\nassert contract[\"week4_2026_opened\"] is False\n\n# The failed run stopped in preparation before historical target scoring/modeling.\nfor forbidden in [\n    base / \"player_role_v2_b41d_scientific_decision.json\",\n    base / \"player_role_v2_b41d_oof_predictions.csv.gz\",\n    base / \"player_role_v2_b41d_report.md\",\n]:\n    if forbidden.exists():\n        raise RuntimeError(f\"B41D_R1_RECOVERY_NOT_PERMITTED_AFTER_RESULTS {forbidden}\")\n\nold_expected = \"f0096e7a0315fb179abccb6c8c7d1c1507384dc517037371212d4e5505ca9284\"\nnew_expected = \"3bf05dbe3a1f2fc02ee86771550d93cca44a8927bd1af80b82526cab88b35b5b\"\ncurrent_sha = hashlib.sha256(prep_path.read_bytes()).hexdigest()\nif current_sha not in {old_expected, new_expected}:\n    raise RuntimeError(\n\
        \        \"B41D_R1_UNEXPECTED_PREP_SCRIPT_SHA \"\n        f\"expected_old={old_expected} expected_new={new_expected} actual={current_sha}\"\n    )\n\nrecovery_path = base / \"player_role_v2_b41d_r1_cohort_reproducibility_recovery_amendment.json\"\nif recovery_path.exists():\n    recovery = json.loads(recovery_path.read_text())\n    assert recovery[\"replacement_prepare_script_sha256\"] == new_expected\nelse:\n    recovery = {\n        \"schema_version\": 1,\n        \"study_id\": \"player-role-v2\",\n        \"phase\": \"B41D-R1-cohort-reproducibility-recovery\",\n        \"status\": \"RECOVERY_FROZEN_BEFORE_ANY_B41D_PREDICTOR_TARGET_ASSOCIATION\",\n        \"created_at_utc\": datetime.now(timezone.utc).isoformat(),\n        \"failed_run\": {\n            \"github_actions_run_id\": 37091583291,\n            \"failed_job\": \"prepare\",\n            \"failed_step\": \"Reconstruct frozen cohort and build exact historical modeling data\",\n            \"error\": \"B41D_COHORT_REPRODUCTION_MISMATCH\"\
        ,\n            \"legacy_expected_gzip_sha256\": \"057454b904093b5f9e4a571d8a1e6c489289829ed07427dc79fcbe4ee4e424f4\",\n            \"reconstructed_gzip_sha256\": \"f8e26f61875635f9bd2cbe3a1515cb751cca2820bdb958644d61d958fab5359b\",\n            \"reconstructed_row_count\": 85740\n        },\n        \"diagnosis\": {\n            \"scientific_data_drift_observed\": False,\n            \"root_cause\": (\n                \"B41B's builder writes the cohort with gzip.open(..., 'wt') \"\n                \"without freezing gzip header metadata. B41B's manifest froze \"\n                \"the resulting compressed-container SHA. Rebuilding the same \"\n                \"logical CSV therefore need not reproduce that container SHA.\"\n            ),\n            \"failure_occurred_before_stable_id_bridge\": True,\n            \"failure_occurred_before_historical_sleeper_target_download\": True,\n            \"failure_occurred_before_predictor_target_association\": True,\n            \"failure_occurred_before_model_fit\"\
        : True,\n            \"holdout_2025_opened\": False,\n            \"week4_2026_opened\": False\n        },\n        \"retired_gate\": \"exact SHA256 equality of the gzip container bytes\",\n        \"replacement_gate\": {\n            \"frozen_b41b_builder_sha256_must_match_manifest\": True,\n            \"every_b41a_source_sha256_must_match\": True,\n            \"players_source_sha256_must_match_b41b_manifest\": True,\n            \"cohort_row_count_must_equal\": 85740,\n            \"cohort_columns_must_exactly_match_b41b_manifest\": True,\n            \"development_seasons_must_equal\": [2019, 2020, 2021, 2022, 2023, 2024],\n            \"two_independent_rebuilds_required\": True,\n            \"decompressed_csv_sha256_must_match_between_rebuilds\": True\n        },\n        \"science_changed\": False,\n        \"target_definition_changed\": False,\n        \"feature_set_changed\": False,\n        \"model_family_changed\": False,\n        \"selection_rule_changed\": False,\n\
        \        \"threshold_changed\": False,\n        \"production_change_authorized\": False,\n        \"original_prepare_script_sha256\": old_expected,\n        \"replacement_prepare_script_sha256\": new_expected\n    }\n    recovery_path.write_text(json.dumps(recovery, indent=2, sort_keys=True) + \"\\n\")\n\nprep_path.write_bytes(base64.b64decode(\"\"\
        ))\nactual_new = hashlib.sha256(prep_path.read_bytes()).hexdigest()\nif actual_new != new_expected:\n    raise RuntimeError(f\"B41D_R1_PATCH_WRITE_SHA_MISMATCH {actual_new}\")\n\nprint(\"PASS: B41D-R1 recovery amendment frozen before any predictor-target association.\")\nprint(\"OLD PREP SHA256:\", current_sha)\nprint(\"NEW PREP SHA256:\", actual_new)\nPYREC\n\npython3 -m py_compile \"$BASE/player_role_v2_b41d_prepare_modeling_data.py\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add   \"$BASE/player_role_v2_b41d_r1_cohort_reproducibility_recovery_amendment.json\"   \"$BASE/player_role_v2_b41d_prepare_modeling_data.py\"\ngit diff --cached --check\n\nif git diff --cached --quiet; then\n  echo \"B41D-R1 recovery already frozen.\"\nelse\n  git commit -m \"Repair Player Role V2 B41D cohort reproducibility gate\"\n  git push origin HEAD:main\nfi\n"
    - name: Freeze B41D-R2 model-fitter contract-path recovery before rerun
      shell: bash
      run: |
        set -euo pipefail
        BASE="research/player-role-v2"

        python3 - <<'PYR2'
        from datetime import datetime, timezone
        import hashlib
        import json
        from pathlib import Path
        import subprocess

        base = Path("research/player-role-v2")
        fitter_path = base / "player_role_v2_b41d_model_fitter.py"
        contract_path = base / "player_role_v2_b41d_development_contract.json"
        audit_path = base / "player_role_v2_b41d_modeling_data_audit.json"
        recovery_path = base / "player_role_v2_b41d_r2_fitter_contract_path_recovery_amendment.json"

        for p in [fitter_path, contract_path, audit_path]:
            if not p.exists():
                raise RuntimeError(f"B41D_R2_REQUIRED_ARTIFACT_MISSING {p}")

        contract = json.loads(contract_path.read_text())
        audit = json.loads(audit_path.read_text())

        # Preserve every scientific boundary already frozen for B41D.
        assert contract["status"] == "FROZEN_BEFORE_ANY_B41D_PREDICTOR_TARGET_ASSOCIATION"
        assert contract["development_seasons"] == [2019, 2020, 2021, 2022, 2023, 2024]
        assert contract["holdout_2025_opened"] is False
        assert contract["week4_2026_opened"] is False
        assert contract["production_change_authorized"] is False
        assert contract["historical_projection_features_used"] is False
        assert audit["development_seasons"] == [2019, 2020, 2021, 2022, 2023, 2024]
        assert audit["holdout_2025_opened"] is False
        assert audit["week4_2026_opened"] is False
        assert audit["predictor_target_association_computed"] is False
        assert audit["model_fit_performed"] is False
        assert audit["production_change_authorized"] is False

        # The contract already contains the frozen settings. R2 is forbidden from
        # inventing or changing any of them; it only repairs the fitter's JSON path.
        families = contract["candidate_families"]
        assert "model_family_preregistration" not in contract
        assert families["candidate_1"] == {
            "name": "best_single_signal_baseline",
            "selection": "single eligible normalized signal with lowest outer-CV MAE",
        }
        assert families["candidate_2"]["name"] == "nonnegative_ridge_linear"
        assert families["candidate_2"]["alpha_grid"] == [0.0, 0.01, 0.1, 1.0, 10.0]
        assert families["candidate_3"]["name"] == "monotonic_hist_gradient_boosting"
        assert families["candidate_3"]["learning_rate_grid"] == [0.03, 0.07]
        assert families["candidate_3"]["max_leaf_nodes_grid"] == [7, 15]
        assert families["candidate_3"]["min_samples_leaf_grid"] == [40, 100]
        assert families["candidate_3"]["l2_regularization_grid"] == [0.0, 1.0]
        assert families["candidate_3"]["max_iter"] == 300
        assert contract["selection"]["simplicity_order"] == [
            "best_single_signal_baseline",
            "nonnegative_ridge_linear",
            "monotonic_hist_gradient_boosting",
        ]

        # R1 failed before any result artifact was written. Fail closed if a result
        # has appeared since then; this recovery is authorized only for that state.
        forbidden = [
            base / "player_role_v2_b41d_scientific_decision.json",
            base / "player_role_v2_b41d_oof_predictions.csv.gz",
            base / "player_role_v2_b41d_report.md",
        ]
        forbidden += list(base.glob("player_role_v2_b41d_*_result.json"))
        existing_forbidden = sorted(str(p) for p in forbidden if p.exists())
        if existing_forbidden:
            raise RuntimeError(
                "B41D_R2_RECOVERY_NOT_PERMITTED_AFTER_SAVED_RESULTS "
                + json.dumps(existing_forbidden)
            )

        old_token = 'contract["model_family_preregistration"]'
        new_token = 'contract["candidate_families"]'
        expected_original_git_blob = "e60f8cc4831dd82297acb1140f34017130d31fcf"

        source = fitter_path.read_text()
        original_sha256 = hashlib.sha256(fitter_path.read_bytes()).hexdigest()
        current_git_blob = subprocess.check_output(
            ["git", "hash-object", str(fitter_path)], text=True
        ).strip()

        if source.count(old_token) == 2 and source.count(new_token) == 0:
            if current_git_blob != expected_original_git_blob:
                raise RuntimeError(
                    "B41D_R2_UNEXPECTED_ORIGINAL_FITTER_BLOB "
                    f"expected={expected_original_git_blob} actual={current_git_blob}"
                )
            patched = source.replace(old_token, new_token)
            if patched.count(old_token) != 0 or patched.count(new_token) != 2:
                raise RuntimeError("B41D_R2_EXACT_TWO_PATH_REPLACEMENTS_FAILED")
            fitter_path.write_text(patched)
            replacement_sha256 = hashlib.sha256(fitter_path.read_bytes()).hexdigest()
            replacement_git_blob = subprocess.check_output(
                ["git", "hash-object", str(fitter_path)], text=True
            ).strip()

            amendment = {
                "schema_version": 1,
                "study_id": "player-role-v2",
                "phase": "B41D-R2-model-fitter-contract-path-recovery",
                "status": "MECHANICAL_RECOVERY_FROZEN_AFTER_FAILED_DEVELOPMENT_TARGET_ACCESS_BEFORE_ANY_SAVED_MODEL_RESULTS",
                "created_at_utc": datetime.now(timezone.utc).isoformat(),
                "failed_run": {
                    "github_actions_run_id": 37092557537,
                    "failed_positions": ["QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"],
                    "failed_step": "Fit <position> with frozen nested season CV",
                    "exception": "KeyError: 'model_family_preregistration'",
                    "failure_location": "fit_outer_family candidate_2 contract lookup",
                },
                "execution_exposure_before_failure": {
                    "development_target_accessed": True,
                    "candidate_1_nested_cv_began_internally": True,
                    "candidate_2_fit_began": False,
                    "candidate_3_fit_began": False,
                    "human_visible_model_performance_emitted": False,
                    "saved_position_result_artifacts": False,
                    "holdout_2025_opened": False,
                    "week4_2026_opened": False,
                },
                "diagnosis": {
                    "root_cause": (
                        "The fitter referenced contract['model_family_preregistration'] in two places, "
                        "while the already-frozen B41D development contract stores those exact candidate "
                        "settings under contract['candidate_families']."
                    ),
                    "contract_missing_scientific_settings": False,
                    "implementation_path_mismatch": True,
                },
                "repair": {
                    "type": "exact source-path substitution only",
                    "from": old_token,
                    "to": new_token,
                    "occurrence_count": 2,
                    "expected_original_fitter_git_blob": expected_original_git_blob,
                    "original_fitter_sha256": original_sha256,
                    "replacement_fitter_sha256": replacement_sha256,
                    "replacement_fitter_git_blob": replacement_git_blob,
                },
                "frozen_science": {
                    "feature_set_changed": False,
                    "target_definition_changed": False,
                    "candidate_families_changed": False,
                    "hyperparameter_grids_changed": False,
                    "nested_cv_changed": False,
                    "outer_cv_changed": False,
                    "selection_rule_changed": False,
                    "tie_breaks_changed": False,
                    "threshold_changed": False,
                    "position_scope_changed": False,
                },
                "production_change_authorized": False,
            }
            recovery_path.write_text(
                json.dumps(amendment, indent=2, sort_keys=True) + "\n"
            )
        elif source.count(old_token) == 0 and source.count(new_token) == 2:
            if not recovery_path.exists():
                raise RuntimeError("B41D_R2_PATCH_PRESENT_WITHOUT_FROZEN_AMENDMENT")
            amendment = json.loads(recovery_path.read_text())
            replacement_sha256 = hashlib.sha256(fitter_path.read_bytes()).hexdigest()
            replacement_git_blob = subprocess.check_output(
                ["git", "hash-object", str(fitter_path)], text=True
            ).strip()
            assert amendment["repair"]["replacement_fitter_sha256"] == replacement_sha256
            assert amendment["repair"]["replacement_fitter_git_blob"] == replacement_git_blob
            assert amendment["production_change_authorized"] is False
        else:
            raise RuntimeError(
                "B41D_R2_UNEXPECTED_FITTER_PATH_STATE "
                f"old_count={source.count(old_token)} new_count={source.count(new_token)}"
            )

        # Mechanical smoke test against the frozen contract. This does not import
        # model libraries, load modeling data, or compute a predictor-target association.
        compile(fitter_path.read_text(), str(fitter_path), "exec")
        hgb = contract["candidate_families"]["candidate_3"]
        grid_size = (
            len(hgb["learning_rate_grid"])
            * len(hgb["max_leaf_nodes_grid"])
            * len(hgb["min_samples_leaf_grid"])
            * len(hgb["l2_regularization_grid"])
        )
        assert grid_size == 16
        assert contract["candidate_families"]["candidate_2"]["alpha_grid"] == [
            0.0, 0.01, 0.1, 1.0, 10.0
        ]

        print("PASS: B41D-R2 exact contract-path recovery frozen.")
        print("FITTER GIT BLOB:", subprocess.check_output(
            ["git", "hash-object", str(fitter_path)], text=True
        ).strip())
        print("HGB FROZEN GRID SIZE:", grid_size)
        PYR2

        python3 -m py_compile "$BASE/player_role_v2_b41d_model_fitter.py"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add \
          "$BASE/player_role_v2_b41d_r2_fitter_contract_path_recovery_amendment.json" \
          "$BASE/player_role_v2_b41d_model_fitter.py"
        git diff --cached --check

        if git diff --cached --quiet; then
          echo "B41D-R2 fitter recovery already frozen."
        else
          git commit -m "Repair Player Role V2 B41D fitter contract path"
          git push origin HEAD:main
        fi
  prepare:
    needs: freeze_contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out latest main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install preparation dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3" "numpy>=2,<3" "pandas>=2.2,<3"

        '
    - name: Reconstruct frozen cohort and build exact historical modeling data
      shell: bash
      run: 'set -euo pipefail

        mkdir -p /tmp/b41d-prep


        python3 research/player-role-v2/player_role_v2_b41d_prepare_modeling_data.py   --repo .   --out-dir /tmp/b41d-prep


        python3 - <<''PY''

        import json

        from pathlib import Path

        out = Path("/tmp/b41d-prep")

        identity = json.loads((out / "player_role_v2_b41d_identity_audit.json").read_text())

        audit = json.loads((out / "player_role_v2_b41d_modeling_data_audit.json").read_text())

        assert identity["pass"] is True

        assert identity["fuzzy_name_join_used"] is False

        assert audit["cohort_reproduced_exactly"] is True

        assert audit["legacy_gzip_container_sha_gate_retired"] is True

        assert audit["b41b_builder_sha256_matches"] is True

        assert audit["canonical_decompressed_csv_repeat_match"] is True

        assert audit["development_seasons"] == [2019, 2020, 2021, 2022, 2023, 2024]

        assert audit["holdout_2025_opened"] is False

        assert audit["week4_2026_opened"] is False

        assert audit["historical_projection_features_used"] is False

        assert audit["predictor_target_association_computed"] is False

        assert audit["model_fit_performed"] is False

        assert audit["production_change_authorized"] is False

        print("PASS: B41D preparation firewall.")

        print("Stable-ID coverage:", identity["overall_mapping_coverage"])

        print("Modeling rows:", audit["modeling_rows"])

        PY

        '
    - name: Commit identity and modeling-data audit before model fitting
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\ngit fetch origin main\ngit rebase origin/main\n\ncp /tmp/b41d-prep/player_role_v2_b41d_identity_audit.json   \"$BASE/player_role_v2_b41d_identity_audit.json\"\ncp /tmp/b41d-prep/player_role_v2_b41d_modeling_data_audit.json   \"$BASE/player_role_v2_b41d_modeling_data_audit.json\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add   \"$BASE/player_role_v2_b41d_identity_audit.json\"   \"$BASE/player_role_v2_b41d_modeling_data_audit.json\"\ngit diff --cached --check\n\nif git diff --cached --quiet; then\n  echo \"B41D prep audit already committed.\"\nelse\n  git commit -m \"Record Player Role V2 B41D modeling data audit\"\n  git push origin HEAD:main\nfi\n"
    - name: Upload frozen B41D modeling dataset
      uses: actions/upload-artifact@v4
      with:
        name: b41d-modeling-data
        path: /tmp/b41d-prep/player_role_v2_b41d_modeling_data.csv.gz
        if-no-files-found: error
        retention-days: 7
  fit:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        position:
        - QB
        - RB
        - WR
        - TE
        - K
        - DL
        - LB
        - DB
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check out latest frozen implementation
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install model dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir "numpy>=2,<3" "pandas>=2.2,<3" "scipy>=1.14,<2" "scikit-learn>=1.6,<2"

        '
    - name: Download frozen modeling data
      uses: actions/download-artifact@v4
      with:
        name: b41d-modeling-data
        path: /tmp/b41d-data
    - name: Fit ${{ matrix.position }} with frozen nested season CV
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "/tmp/b41d-fit-${{ matrix.position }}"


        python3 research/player-role-v2/player_role_v2_b41d_model_fitter.py   --data /tmp/b41d-data/player_role_v2_b41d_modeling_data.csv.gz   --contract research/player-role-v2/player_role_v2_b41d_development_contract.json   --position "${{ matrix.position }}"   --out-dir "/tmp/b41d-fit-${{ matrix.position }}"

        '
    - name: Upload ${{ matrix.position }} development results
      uses: actions/upload-artifact@v4
      with:
        name: b41d-fit-${{ matrix.position }}
        path: /tmp/b41d-fit-${{ matrix.position }}
        if-no-files-found: error
        retention-days: 7
  finalize:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out latest main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install finalization dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir "numpy>=2,<3" "pandas>=2.2,<3"

        '
    - name: Download all position results
      uses: actions/download-artifact@v4
      with:
        pattern: b41d-fit-*
        path: /tmp/b41d-results
        merge-multiple: true
    - name: Consolidate scientific development result
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/b41d-final\n\npython3 - <<'PY'\nimport hashlib\nimport json\nfrom pathlib import Path\nimport pandas as pd\n\nsrc = Path(\"/tmp/b41d-results\")\nout = Path(\"/tmp/b41d-final\")\npositions = [\"QB\", \"RB\", \"WR\", \"TE\", \"K\", \"DL\", \"LB\", \"DB\"]\n\nresults = {}\noofs = []\nfor pos in positions:\n    rp = src / f\"player_role_v2_b41d_{pos}_result.json\"\n    op = src / f\"player_role_v2_b41d_{pos}_oof.csv.gz\"\n    if not rp.exists() or not op.exists():\n        raise RuntimeError(f\"B41D_MISSING_POSITION_RESULT {pos}\")\n    result = json.loads(rp.read_text())\n    assert result[\"position\"] == pos\n    assert result[\"2025_holdout_opened\"] is False\n    assert result[\"week4_2026_opened\"] is False\n    assert result[\"production_change_authorized\"] is False\n    results[pos] = result\n    oofs.append(pd.read_csv(op, compression=\"gzip\"))\n\ncombined = pd.concat(oofs, ignore_index=True)\nif combined[\"row_id\"].duplicated().any():\n\
        \    raise RuntimeError(\"B41D_DUPLICATE_OOF_ROW_ID\")\nif combined[\"selected_oof_prediction\"].isna().any():\n    raise RuntimeError(\"B41D_SELECTED_OOF_PREDICTION_NAN\")\n\ncombined_path = out / \"player_role_v2_b41d_oof_predictions.csv.gz\"\ncombined.to_csv(combined_path, index=False, compression=\"gzip\")\n\ndef sha(path):\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\ndecision = {\n    \"schema_version\": 1,\n    \"study_id\": \"player-role-v2\",\n    \"phase\": \"B41D-development-model-selection\",\n    \"status\": \"DEVELOPMENT_MODEL_FAMILIES_SELECTED_BEFORE_TIER_DERIVATION\",\n    \"development_seasons\": [2019, 2020, 2021, 2022, 2023, 2024],\n    \"position_results\": results,\n    \"selected_family_by_position\": {\n        p: results[p][\"selected_family_by_one_se_rule\"] for p in positions\n    },\n    \"oof_row_count\": int(len(combined)),\n    \"oof_predictions_sha256\": sha(combined_path),\n    \"week4_2026_opened\": False,\n    \"B41C3_required_before_production\"\
        : True,\n    \"2025_holdout_opened\": False,\n    \"2025_holdout_required_before_production\": True,\n    \"role_tier_thresholds_derived\": False,\n    \"production_model_fitted\": False,\n    \"production_change_authorized\": False,\n    \"next_stage\": (\n        \"B41E derive seven ordered role tiers from development OOF predictions \"\n        \"only, freeze model/tier architecture, then validate the complete frozen \"\n        \"Role V2 system on untouched 2025.\"\n    )\n}\n(out / \"player_role_v2_b41d_scientific_decision.json\").write_text(\n    json.dumps(decision, indent=2, sort_keys=True) + \"\\n\"\n)\n\nreport = [\n    \"# Player Role V2 \u2014 B41D Development Model Selection\",\n    \"\",\n    \"- Development seasons: **2019\u20132024 only**\",\n    \"- 2026 Week 4 opened: **No**\",\n    \"- 2025 holdout opened: **No**\",\n    \"- Historical projection features: **Excluded**\",\n    \"- Owner/team identity used: **No**\",\n    \"- Role tier thresholds derived: **No**\"\
        ,\n    \"- Production change authorized: **No**\",\n    \"\",\n    \"## Position model selection\",\n    \"\",\n    \"| Position | Selected family | OOF MAE | OOF Spearman |\",\n    \"|---|---|---:|---:|\",\n]\nfor pos in positions:\n    r = results[pos]\n    report.append(\n        f\"| {pos} | {r['selected_family_by_one_se_rule']} | \"\n        f\"{r['selected_family_oof_mae']:.4f} | \"\n        f\"{r['selected_family_oof_spearman']:.4f} |\"\n    )\nreport += [\n    \"\",\n    \"B41C3 remains mandatory before production deployment.\",\n    \"The untouched 2025 Role V2 holdout remains mandatory before production deployment.\",\n    \"\",\n]\n(out / \"player_role_v2_b41d_report.md\").write_text(\"\\n\".join(report))\n\nprint(json.dumps({\n    \"selected_family_by_position\": decision[\"selected_family_by_position\"],\n    \"oof_rows\": len(combined),\n    \"2025_holdout_opened\": False,\n    \"week4_2026_opened\": False,\n    \"production_authorized\": False,\n}, indent=2))\nPY\n"
