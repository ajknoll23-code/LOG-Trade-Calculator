name: Elite Surplus V1 Development Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard reviewed evidence and clean state
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          # Reviewed historical machinery and evidence used to motivate this study.
          test "$(git hash-object .github/workflows/elite-surplus-positional-scarcity-audit.yml)" = \
            "b6467134e4c2e7c9d5b1843ad3bf8c14f9832ad0"
          test "$(git hash-object research/baseline-backtester/baseline_backtester.py)" = \
            "74133bc92e1bcb9167d5709c8d0226b83dbae1fc"
          test "$(git hash-object research/roster-economics/weekly_points_by_season.json)" = \
            "ad8c2275042fba93cbbae20d6a0b8c27b4bcaf84"
          test "$(git hash-object research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.json)" = \
            "7cb8fb396366082ecde580fd8a20f2d16a0fecc0"
          test "$(git hash-object research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.md)" = \
            "b361ea299365bce037dddb95515af2492fbbda6f"
          test "$(git hash-object scripts/validation/snapshot_values.py)" = \
            "1efca4c35e910a95974c1bec0b06a106196618b3"

          test ! -e research/elite-surplus-v1/development_preregistration_v1.json
          test ! -e research/elite-surplus-v1/development_preregistration_v1.md
          test ! -e research/elite-surplus-v1/development_preregistration_v1_manifest.json

      - name: Validate deployed FV port and reviewed backtester
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("research/baseline-backtester/baseline_backtester.py")
          spec = importlib.util.spec_from_file_location(
              "elite_surplus_v1_backtester_selftest",
              path,
          )
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not import baseline_backtester.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.run_selftest()
          PY

          python3 scripts/validation/snapshot_values.py --selftest

      - name: Freeze Elite Surplus V1 development design
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          D = ROOT / "research/elite-surplus-v1"
          D.mkdir(parents=True, exist_ok=False)

          CFG = D / "development_preregistration_v1.json"
          MD = D / "development_preregistration_v1.md"
          MAN = D / "development_preregistration_v1_manifest.json"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_paths = [
              ".github/workflows/elite-surplus-positional-scarcity-audit.yml",
              "research/baseline-backtester/baseline_backtester.py",
              "research/roster-economics/weekly_points_by_season.json",
              "research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.json",
              "research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.md",
              "scripts/validation/snapshot_values.py",
              "index.html",
          ]
          provenance = {
              p: {"sha256": sha256(ROOT / p)}
              for p in source_paths
          }

          generated = datetime.now(timezone.utc).isoformat()

          # Frozen normalization anchors. QB29 is the reviewed Phase-2 primary
          # historical leader; QB18 is the documented/deployed legacy sensitivity.
          primary_anchor_rank = 29
          legacy_anchor_rank = 18

          # These values were observed before this preregistration in the green,
          # read-only Elite Surplus / Positional Scarcity Audit. They are design
          # evidence only and may not be reused as prospective confirmation.
          observed_design_evidence = {
              "source_run_class": "spent_pre_preregistration_historical_diagnostic",
              "seasons": [2024, 2025],
              "primary_forward_window_weeks": 4,
              "qb": {
                  "replacement_rank": 29,
                  "folds": 15,
                  "rank1_over_replacement": 2.612,
                  "rank5_over_replacement": 2.089,
                  "rank12_over_replacement": 1.613,
                  "rank1_to_rank5_future_ppg": 1.300,
                  "rank1_to_rank12_future_ppg": 1.635,
                  "top1_share_of_top12_positive_surplus": 0.140,
                  "training_top1_to_future_top5_rate": 0.667,
                  "training_top5_same_tier_retention_rate": 0.347,
                  "current_fv_rank1_to_rank5": 1.232,
                  "current_fv_rank1_to_rank12": 1.336,
                  "descriptive_spacing_index_rank1_to_rank5": 0.948,
                  "descriptive_spacing_index_rank1_to_rank12": 0.817,
              },
              "restriction": (
                  "These already-seen historical summaries motivated the candidate "
                  "families and therefore cannot count as confirmation."
              ),
          }

          cfg = {
              "schema_version": 1,
              "plan_id": "elite-surplus-v1-development-prereg-v1",
              "status": "frozen_elite_surplus_v1_development_preregistration",
              "frozen": True,
              "generated_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "candidate_fit_performed": False,
              "candidate_selected": False,
              "fresh_prospective_confirmation_started": False,
              "research_question": (
                  "After holding the existing underlying Fundamental Value model "
                  "fixed, does a monotone post-FV QB surplus transform anchored to "
                  "a frozen QB replacement-rank reference improve the calibration "
                  "of elite QB spacing to future realized relative production, "
                  "without tuning to any named player pair?"
              ),
              "scope": {
                  "position": "QB_only",
                  "other_positions": "exact_identity_no_change",
                  "layer": "post_FV_dimensionless_surplus_utility_research_layer",
                  "intrinsic_deployed_fv_is_not_changed_during_research": True,
                  "package_adjustment_is_out_of_scope": True,
                  "market_value_is_out_of_scope": True,
                  "team_utility_is_out_of_scope": True,
                  "draft_pick_values_are_out_of_scope": True,
                  "named_player_fit_targets_forbidden": [
                      "Josh Allen",
                      "Dak Prescott",
                  ],
                  "named_player_examples_may_be_scored_only_after_candidate_freeze": True,
              },
              "dependency_isolation": {
                  "production_v2_frozen_study_untouched": True,
                  "age_curve_v2_frozen_study_untouched": True,
                  "replacement_level_v2_frozen_study_untouched": True,
                  "position_weight_v2_frozen_study_untouched": True,
                  "no_history_v2_frozen_study_untouched": True,
                  "opportunity_v2_frozen_study_untouched": True,
                  "durability_v2_frozen_study_untouched": True,
                  "production_promotion_blocked_until_relevant_underlying_FV_dependencies_are_reviewed": True,
                  "note": (
                      "Elite Surplus V1 studies only an additional QB spacing layer. "
                      "It may not retrofit or rewrite any currently frozen component "
                      "candidate or use their 2026 outcomes for development."
                  ),
              },
              "pre_preregistration_design_evidence": observed_design_evidence,
              "historical_development_data": {
                  "allowed_seasons": [2024, 2025],
                  "weekly_points_path": "research/roster-economics/weekly_points_by_season.json",
                  "fold_builder": "research/baseline-backtester/baseline_backtester.py::build_folds",
                  "minimum_trailing_games": 3,
                  "primary_forward_window_weeks": 4,
                  "robustness_forward_windows_weeks": [2, 6],
                  "rolling_fold_overlap_warning": (
                      "Weekly rolling folds overlap heavily and are not independent trials."
                  ),
                  "2024_role": "parameter_fit_development",
                  "2025_role": "historical_validation_development",
                  "cross_season_fold_role": "robustness_only_not_primary_selection",
                  "2026_data_allowed_for_development": False,
              },
              "normalization": {
                  "primary_research_anchor": {
                      "position": "QB",
                      "rank": primary_anchor_rank,
                      "source": "Replacement Level V2 Phase-2 primary historical leader",
                  },
                  "legacy_sensitivity_anchor": {
                      "position": "QB",
                      "rank": legacy_anchor_rank,
                      "source": "documented/deployed legacy replacement rank",
                  },
                  "training_ratio": (
                      "x_i = training_PPG_i / training_PPG_at_frozen_anchor_rank"
                  ),
                  "future_ratio": (
                      "y_i = future_PPG_i / future_PPG_at_same_frozen_anchor_rank"
                  ),
                  "current_prospective_ratio": (
                      "x_i = frozen_current_FV_i / frozen_current_FV_at_same_anchor_rank"
                  ),
                  "important_translation_guardrail": (
                      "Historical fitting operates on dimensionless production ratios; "
                      "prospective confirmation operates on the identical dimensionless "
                      "transform applied to frozen FV ratios. Historical fit is therefore "
                      "development evidence for transform shape, not proof of dynasty value."
                  ),
              },
              "eligible_historical_cohorts": {
                  "primary": "training_time_top_12_QBs_by_training_PPG",
                  "elite_secondary": "training_time_top_5_QBs_by_training_PPG",
                  "broad_safety": (
                      "training_time_QBs_ranked_1_through_primary_anchor_rank"
                  ),
                  "all_cohort_members_must_have_future_outcome_in_fold": True,
              },
              "candidate_functions": {
                  "E0": {
                      "name": "identity_linear_control",
                      "role": "baseline",
                      "definition": "g(x)=x",
                      "free_parameters": 0,
                  },
                  "E1": {
                      "name": "linear_surplus_stretch",
                      "role": "one_parameter_noncurved_challenger",
                      "definition": (
                          "g_c(x)=x for x<=1; "
                          "g_c(x)=1+c*(x-1) for x>1"
                      ),
                      "c_bounds": [0.75, 1.75],
                      "null_value": 1.0,
                      "free_parameters": 1,
                      "interpretation": (
                          "Tests whether spacing needs a simple surplus rescale "
                          "without increasing marginal curvature."
                      ),
                  },
                  "E2": {
                      "name": "power_above_replacement",
                      "role": "smooth_convex_or_concave_challenger",
                      "definition": (
                          "g_gamma(x)=x for x<=1; "
                          "g_gamma(x)=x**gamma for x>1"
                      ),
                      "gamma_bounds": [0.75, 2.0],
                      "null_value": 1.0,
                      "free_parameters": 1,
                      "interpretation": (
                          "gamma>1 is convex elite expansion; gamma<1 is compression. "
                          "The data are permitted to reject the motivating direction."
                      ),
                  },
                  "E3": {
                      "name": "quadratic_surplus_hinge",
                      "role": "convex_curvature_challenger",
                      "definition": (
                          "g_alpha(x)=x for x<=1; "
                          "g_alpha(x)=x+alpha*(x-1)**2 for x>1"
                      ),
                      "alpha_bounds": [0.0, 0.5],
                      "null_value": 0.0,
                      "free_parameters": 1,
                      "interpretation": (
                          "Tests explicit increasing marginal elite surplus while "
                          "remaining continuous and monotone."
                      ),
                  },
              },
              "mathematical_invariants": {
                  "all_candidates": [
                      "g(x)>0 for x>0",
                      "g(1)=1",
                      "continuity_at_x=1",
                      "strict_monotonicity_for_x>0_over_preregistered_parameter_bounds",
                      "no_player_name_feature",
                      "no_player_id_feature",
                      "no_age_feature",
                      "no_market_value_feature",
                      "no_package_vote_feature",
                      "all_non_QB_positions_are_exact_identity",
                  ],
                  "E1": [
                      "positive_slope_above_replacement_because_c>=0.75",
                      "null_c=1_exactly_recovers_E0",
                  ],
                  "E2": [
                      "positive_derivative_for_gamma>0",
                      "null_gamma=1_exactly_recovers_E0",
                  ],
                  "E3": [
                      "derivative=1+2*alpha*(x-1)>=1_for_x>=1",
                      "null_alpha=0_exactly_recovers_E0",
                  ],
                  "property_test_requirement": (
                      "Before accepting any fit, test at least 1,000,000 deterministic "
                      "x values spanning [0.05, 5.0] across parameter bounds and verify "
                      "positivity, continuity, monotonicity, null recovery, and finite output."
                  ),
              },
              "parameter_fit": {
                  "fit_data": "2024 rolling folds only",
                  "primary_window_weeks": 4,
                  "objective": (
                      "equal_fold_mean_MAE_between_g(x_i)_and_future_ratio_y_i "
                      "for_training_time_top12_QBs"
                  ),
                  "secondary_fit_diagnostic": "equal_fold_mean_RMSE",
                  "optimization": (
                      "deterministic bounded one-dimensional optimization with a "
                      "dense reproducible grid plus local refinement; no stochastic optimizer"
                  ),
                  "candidate_parameter_may_not_use_2025_or_2026_outcomes": True,
                  "named_pair_may_not_influence_parameter": True,
              },
              "historical_validation_and_selection": {
                  "validation_data": "2025 rolling folds only",
                  "primary_window_weeks": 4,
                  "baseline": "E0",
                  "primary_metric": "equal_fold_mean_MAE_top12",
                  "eligibility_gates": {
                      "minimum_relative_MAE_improvement_vs_E0_top12": 0.03,
                      "minimum_2025_folds_with_lower_top12_MAE": 5,
                      "required_2025_fold_count_for_primary": 7,
                      "top5_MAE_must_not_regress_relative_to_E0": True,
                      "broad_rank1_to_primary_anchor_MAE_max_relative_regression": 0.01,
                      "RMSE_top12_max_relative_regression": 0.01,
                      "robustness_2_week_MAE_max_relative_regression": 0.01,
                      "robustness_6_week_MAE_max_relative_regression": 0.01,
                      "legacy_QB18_anchor_MAE_max_relative_regression": 0.02,
                  },
                  "boundary_rule": (
                      "A non-null optimum at a non-null parameter bound is ineligible "
                      "because the preferred curvature remains unresolved. Exact null "
                      "collapse is allowed and means the challenger did not beat E0."
                  ),
                  "selection_rule": (
                      "Among eligible candidates choose the lowest 2025 primary top12 MAE. "
                      "If two eligible candidates are within 0.005 absolute MAE, select the "
                      "candidate with the smaller maximum absolute distortion |g(x)-x| over "
                      "x in [1,3]. If still tied, select the lower candidate label."
                  ),
                  "if_no_candidate_qualifies": (
                      "Stop Elite Surplus V1. No FV or trade-utility change. "
                      "Do not create a rescue formula."
                  ),
                  "cross_season_fold": (
                      "Reported as robustness only and cannot rescue a candidate "
                      "that fails the frozen 2025 primary gates."
                  ),
              },
              "candidate_freeze_after_historical_selection": {
                  "allowed_only_if_one_candidate_qualifies": True,
                  "refit_parameter_on_all_2024_and_2025_rolling_folds_after_selection": True,
                  "same_primary_4_week_objective": True,
                  "candidate_class_cannot_change_after_2025_validation": True,
                  "all_parameters_and_source_hashes_must_be_committed_before_prospective_scoring": True,
                  "josh_allen_dak_prescott_may_be_scored_only_after_this_freeze": True,
              },
              "fresh_2026_prospective_confirmation": {
                  "required_before_any_production_eligibility": True,
                  "week1_is_spent_and_ineligible": True,
                  "reason_week1_ineligible": (
                      "The candidate family was not frozen before 2026 Week 1 outcomes "
                      "were observed in other model work."
                  ),
                  "intended_fixed_outcome_window": "2026_weeks_2_through_8_inclusive",
                  "candidate_must_be_frozen_before_first_eligible_week_kickoff": True,
                  "prediction_snapshot": (
                      "one frozen pre-Week-2 production snapshot; no weekly refit "
                      "and no weekly candidate parameter updates"
                  ),
                  "primary_cohort": "frozen_snapshot_top12_QBs_by_baseline_FV",
                  "elite_secondary_cohort": "frozen_snapshot_top5_QBs_by_baseline_FV",
                  "broad_safety_cohort": (
                      "frozen_snapshot_QBs_ranked_1_through_primary_anchor_rank"
                  ),
                  "minimum_games_in_outcome_window_per_QB": 3,
                  "future_ratio_denominator": (
                      "realized Weeks2-8 PPG at frozen primary anchor rank among "
                      "eligible QBs in the outcome window"
                  ),
                  "primary_metric": "MAE_candidate_vs_realized_relative_ratio_top12",
                  "gates": {
                      "minimum_relative_MAE_improvement_vs_E0_top12": 0.05,
                      "top5_MAE_must_not_regress_relative_to_E0": True,
                      "broad_rank1_to_primary_anchor_MAE_max_relative_regression": 0.02,
                      "RMSE_top12_max_relative_regression": 0.02,
                  },
                  "no_effect_based_early_stopping": True,
                  "no_significance_based_early_stopping": True,
                  "evaluate_once_after_fixed_window": True,
                  "no_refit_on_2026_outcomes": True,
                  "prospective_pass_is_not_automatic_deployment": True,
              },
              "dependency_gate_before_any_production_decision": {
                  "required": True,
                  "rule": (
                      "Even if Elite Surplus V1 passes its prospective test, no "
                      "production integration may occur until the relevant frozen "
                      "Production V2, Age Curve V2, Replacement Level V2, and "
                      "Position Weight V2 evidence has been reviewed. If those "
                      "studies materially change the underlying FV construction or "
                      "the QB anchor semantics, Elite Surplus V1 must be revalidated "
                      "against the new frozen base rather than silently transplanted."
                  ),
              },
              "explicit_non_goals": [
                  "Do not tune Josh Allen upward or Dak Prescott downward.",
                  "Do not use KTC as a fit or selection target.",
                  "Do not change package-adjustment V1.6 or V6 research.",
                  "Do not alter non-QB FV in this study.",
                  "Do not use 2026 Week 1 as confirmation.",
                  "Do not treat Spearman improvement as evidence for a monotone transform; monotone transforms preserve rank ordering.",
                  "Do not claim historical future-PPG calibration alone proves dynasty trade utility.",
                  "Do not auto-deploy after a prospective pass.",
              ],
              "required_sequence_after_this_freeze": [
                  "implement_historical_development_evaluator_from_this_preregistration",
                  "fit_E1_E2_E3_on_2024_only_and_validate_once_on_2025_under_frozen_gates",
                  "if_none_qualifies_stop_without_change",
                  "if_one_qualifies_refit_only_that_class_on_all_2024_2025_development_folds",
                  "freeze_selected_class_parameter_source_hashes_and_pre_week2_prediction_snapshot",
                  "only_after_candidate_freeze_score_named_examples_for_diagnostics",
                  "collect_2026_weeks2_8_outcomes_without_refitting_or_peeking_for_stopping",
                  "evaluate_frozen_candidate_once_after_week8",
                  "if_all_gates_pass_wait_for_underlying_frozen_component_reviews",
                  "require_separate_human_approved_production_decision",
              ],
              "source_provenance": provenance,
          }

          CFG.write_text(
              json.dumps(cfg, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Elite Surplus V1 — Development Preregistration",
              "",
              "**Status: FROZEN DEVELOPMENT PLAN — research only. No production change is authorized.**",
              "",
              "## Question",
              "",
              "Does the current QB FV curve understate elite surplus strongly enough "
              "that a monotone post-FV QB spacing layer improves future relative-"
              "production calibration, without fitting to Josh Allen, Dak Prescott, "
              "KTC, package votes, or 2026 outcomes?",
              "",
              "## Why this study exists",
              "",
              "The prior read-only audit found that over the primary 4-week historical "
              "window QB1 produced about 2.612× the QB29 replacement denominator, QB5 "
              "2.089×, and QB12 1.613×. Historical QB1/QB12 production spacing was "
              "1.635× while the current deployed FV QB1/QB12 spacing was 1.336×. "
              "Those already-seen numbers are **design evidence only**, not confirmation.",
              "",
              "## Frozen candidate set",
              "",
              "- **E0 — identity:** `g(x)=x`.",
              "- **E1 — linear surplus stretch:** above replacement, "
              "`g(x)=1+c(x-1)`, `c∈[0.75,1.75]`.",
              "- **E2 — power:** above replacement, `g(x)=x^gamma`, "
              "`gamma∈[0.75,2.0]`.",
              "- **E3 — quadratic hinge:** above replacement, "
              "`g(x)=x+alpha(x-1)^2`, `alpha∈[0,0.5]`.",
              "",
              "All candidates are identity at and below replacement, positive, "
              "continuous, monotone, QB-only, and forbidden from using player names.",
              "",
              "## Historical development",
              "",
              "- Fit candidate parameters on **2024 rolling folds only**.",
              "- Primary target: future relative-production magnitude for the "
              "training-time top 12 QBs.",
              "- Primary window: **4 weeks**; 2- and 6-week windows are robustness checks.",
              "- Validate once on **2025 rolling folds**.",
              "- A candidate needs at least **3% relative MAE improvement** over E0 "
              "on the 2025 top-12 primary metric and must pass all frozen safety gates.",
              "- If none qualifies, stop. No rescue formula.",
              "",
              "## Fresh confirmation",
              "",
              "2026 Week 1 is already spent and cannot confirm this study. If one "
              "historical candidate qualifies, its class and parameter are frozen "
              "before prospective scoring. The intended fresh window is **2026 Weeks "
              "2–8 inclusive**, evaluated once after Week 8 with no refit and no "
              "effect-based early stopping.",
              "",
              "A prospective pass still cannot deploy anything automatically. The "
              "underlying Production V2, Age Curve V2, Replacement Level V2, and "
              "Position Weight V2 studies must be reviewed first.",
              "",
          ]
          MD.write_text("\n".join(lines) + "\n", encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "plan_id": cfg["plan_id"],
              "status": "frozen_elite_surplus_v1_development_preregistration_manifest",
              "generated_at_utc": generated,
              "frozen": True,
              "research_only": True,
              "development_preregistration_sha256": sha256(CFG),
              "development_summary_sha256": sha256(MD),
              "historical_fit_performed": False,
              "candidate_selected": False,
              "candidate_frozen": False,
              "2026_week1_eligible_for_confirmation": False,
              "fresh_prospective_confirmation_started": False,
              "production_change_authorized": False,
          }
          MAN.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          # Internal plan checks.
          loaded = json.loads(CFG.read_text())
          assert loaded["status"] == "frozen_elite_surplus_v1_development_preregistration"
          assert loaded["scope"]["position"] == "QB_only"
          assert loaded["historical_development_data"]["allowed_seasons"] == [2024, 2025]
          assert loaded["fresh_2026_prospective_confirmation"]["week1_is_spent_and_ineligible"] is True
          assert loaded["fresh_2026_prospective_confirmation"]["intended_fixed_outcome_window"] == "2026_weeks_2_through_8_inclusive"
          assert set(loaded["candidate_functions"]) == {"E0", "E1", "E2", "E3"}
          assert loaded["candidate_functions"]["E1"]["null_value"] == 1.0
          assert loaded["candidate_functions"]["E2"]["null_value"] == 1.0
          assert loaded["candidate_functions"]["E3"]["null_value"] == 0.0
          assert loaded["historical_validation_and_selection"]["eligibility_gates"]["minimum_relative_MAE_improvement_vs_E0_top12"] == 0.03
          assert loaded["fresh_2026_prospective_confirmation"]["gates"]["minimum_relative_MAE_improvement_vs_E0_top12"] == 0.05
          assert loaded["production_change_authorized"] is False
          assert manifest["historical_fit_performed"] is False
          assert manifest["candidate_selected"] is False

          print("PASS: Elite Surplus V1 development plan frozen before fitting.")
          print("CFG SHA256:", manifest["development_preregistration_sha256"])
          print("MD SHA256:", manifest["development_summary_sha256"])
          PY

      - name: Validate candidate mathematics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          import random
          from pathlib import Path

          cfg = json.loads(
              Path(
                  "research/elite-surplus-v1/development_preregistration_v1.json"
              ).read_text()
          )

          e1 = cfg["candidate_functions"]["E1"]
          e2 = cfg["candidate_functions"]["E2"]
          e3 = cfg["candidate_functions"]["E3"]

          def g1(x, c):
              return x if x <= 1 else 1 + c * (x - 1)

          def g2(x, gamma):
              return x if x <= 1 else x ** gamma

          def g3(x, alpha):
              return x if x <= 1 else x + alpha * (x - 1) ** 2

          # Null recovery.
          for x in [0.05, 0.5, 1.0, 1.1, 2.0, 5.0]:
              assert abs(g1(x, 1.0) - x) < 1e-12
              assert abs(g2(x, 1.0) - x) < 1e-12
              assert abs(g3(x, 0.0) - x) < 1e-12

          rng = random.Random(20260915)
          last = None
          for _ in range(1_000_000):
              x = 0.05 + (5.0 - 0.05) * rng.random()
              c = rng.uniform(*e1["c_bounds"])
              gamma = rng.uniform(*e2["gamma_bounds"])
              alpha = rng.uniform(*e3["alpha_bounds"])

              for y in (g1(x, c), g2(x, gamma), g3(x, alpha)):
                  assert math.isfinite(y)
                  assert y > 0

              # Deterministic local monotonicity check.
              x2 = min(5.0, x + 1e-6)
              assert g1(x2, c) + 1e-12 >= g1(x, c)
              assert g2(x2, gamma) + 1e-12 >= g2(x, gamma)
              assert g3(x2, alpha) + 1e-12 >= g3(x, alpha)

          # Continuity at the anchor.
          for c in e1["c_bounds"]:
              assert abs(g1(1.0, c) - 1.0) < 1e-12
          for gamma in e2["gamma_bounds"]:
              assert abs(g2(1.0, gamma) - 1.0) < 1e-12
          for alpha in e3["alpha_bounds"]:
              assert abs(g3(1.0, alpha) - 1.0) < 1e-12

          print("PASS: 1,000,000 randomized candidate-math checks.")
          PY

