            "research/draft-pick-fv-v5/score_r1_r2_locked_validation_v5.py"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: only five intended Phase-5 files changed."

