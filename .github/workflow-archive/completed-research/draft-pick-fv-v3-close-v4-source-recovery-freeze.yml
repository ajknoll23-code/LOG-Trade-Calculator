name: Draft Pick FV V3 Closure and V4 Source Recovery Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  close-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard final V3 pre-outcome state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          v3 = Path("research/draft-pick-fv-v3")
          required = [
              "preregistration_v3.json",
              "preregistration_manifest_v3.json",
              "historical_draft_source_catalog_v3.json",
              "mfl_pooled_design_v1.json",
              "historical_draft_pick_contract_repair_manifest_v3.json",
              "custom_player_identity_namespace_audit_v3.json",
              "custom_player_identity_namespace_audit_manifest_v3.json",
              "rookie_scope_contamination_audit_v3.json",
              "rookie_scope_contamination_audit_v3.md",
              "rookie_scope_contamination_audit_manifest_v3.json",
          ]
          for name in required:
              assert (v3 / name).exists(), name

          load = lambda n: json.loads((v3 / n).read_text())
          pm = load("preregistration_manifest_v3.json")
          pooled = load("mfl_pooled_design_v1.json")
          contract = load("historical_draft_pick_contract_repair_manifest_v3.json")
          ns = load("custom_player_identity_namespace_audit_v3.json")
          nsm = load("custom_player_identity_namespace_audit_manifest_v3.json")
          contam = load("rookie_scope_contamination_audit_v3.json")
          contamm = load("rookie_scope_contamination_audit_manifest_v3.json")

          assert pm["status"] == "FROZEN_PRE_OUTCOME"
          assert pooled["result"]["decision"] == "ACCEPT_MFL_YEAR_BALANCED_POOLED_R1_R6_DESIGN"
          assert contract["decision"] == "STOP_PRE_OUTCOME_CONTRACT_REPAIR_IDENTITY_GATE"
          assert ns["decision"] == "IDENTITY_NAMESPACE_COLLISION_CONFIRMED_PROTOCOL_CLARIFICATION_REQUIRED"
          assert nsm["decision"] == ns["decision"]
          expected = "ROOKIE_SCOPE_CONTAMINATION_CONFIRMED_CLEAN_SUBSET_FAILS_FROZEN_POOLED_GATES"
          assert contam["decision"] == expected
          assert contamm["decision"] == expected
          assert contam["clean_subset_frozen_pooled_gate_recheck"]["pass"] is False
          assert contamm["clean_subset_pooled_gate_pass"] is False
          assert contamm["contaminated_league_n"] == 41

          # Exact scientific result that closes V3.
          gates = contam["clean_subset_frozen_pooled_gate_recheck"]["gates"]
          expected_gate_values = {
              "r1_r4_nonmock_total": (172, 180.0, False),
              "r5_nonidp_nonmock_total": (52, 60.0, False),
              "r6_nonidp_nonmock_total": (21, 36.0, False),
              "r6_nonidp_min_per_year": (2, 3.0, False),
              "r6_nonidp_hhi_effective_years": (5.313253012048193, 4.5, True),
              "r6_nonidp_max_year_share": (0.23809523809523808, 0.3, True),
              "idp_r6_nonmock_total": (16, 20.0, False),
              "idp_r6_years_represented": (6, 5.0, True),
          }
          for key, (value, threshold, passed) in expected_gate_values.items():
              g = gates[key]
              assert abs(float(g["value"]) - float(value)) < 1e-12, (key, g)
              assert abs(float(g["threshold"]) - float(threshold)) < 1e-12, (key, g)
              assert bool(g["pass"]) is passed, (key, g)

          # V3 must still be completely pre-outcome/pre-fit.
          for obj in (pm, contract, ns, nsm, contam, contamm):
              assert obj["historical_player_outcomes_read"] is False
              assert obj["candidate_fit_performed"] is False
              assert obj["validation_scored"] is False
              assert obj["production_change_authorized"] is False

          for name in (
              "v3_closure.json",
              "v3_closure.md",
              "v3_closure_manifest.json",
          ):
              assert not (v3 / name).exists(), name

          v4 = Path("research/draft-pick-fv-v4")
          for name in (
              "source_recovery_preregistration_v4.json",
              "source_recovery_preregistration_v4.md",
              "source_recovery_manifest_v4.json",
          ):
              assert not (v4 / name).exists(), name

          print("PASS: V3 final scientific stop is intact and no outcomes were read.")
          PY

      - name: Write formal V3 closure and freeze V4 source recovery design
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-pick-fv-v4

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          v3 = root / "research" / "draft-pick-fv-v3"
          v4 = root / "research" / "draft-pick-fv-v4"

          def load(path):
              return json.loads(path.read_text())

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def dump(path, obj):
              path.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n")

          generated = datetime.now(timezone.utc).isoformat()

          contam_path = v3 / "rookie_scope_contamination_audit_v3.json"
          contam_man_path = v3 / "rookie_scope_contamination_audit_manifest_v3.json"
          prereg_path = v3 / "preregistration_v3.json"
          prereg_man_path = v3 / "preregistration_manifest_v3.json"
          pooled_path = v3 / "mfl_pooled_design_v1.json"

          contam = load(contam_path)
          contam_man = load(contam_man_path)
          prereg = load(prereg_path)
          pooled = load(pooled_path)

          v3_closure = {
              "schema_version": 1,
              "study_id": "draft-pick-fv-v3-real-sf-rookie-drafts",
              "status": "CLOSED_PRE_OUTCOME",
              "decision": "STOP_V3_SOURCE_SCOPE_CONTAMINATION_CLEAN_SUBSET_INSUFFICIENT",
              "generated_at_utc": generated,
              "reason": (
                  "Positive rookie-scope contamination was confirmed in the frozen V3 source catalog, "
                  "and removal of positively contaminated leagues caused the clean subset to fail the "
                  "frozen pooled source-sufficiency gates."
              ),
              "contaminated_league_n": contam["audit_counts"]["positive_contaminated_league_n"],
              "clean_league_n": contam["audit_counts"]["clean_league_n"],
              "frozen_catalog_league_n": contam["audit_counts"]["frozen_catalog_league_n"],
              "clean_subset_gate_recheck": contam["clean_subset_frozen_pooled_gate_recheck"],
              "scientific_scope": "STOP_NO_OUTCOME_INGESTION",
              "historical_player_outcomes_read": False,
              "candidate_fit_performed": False,
              "candidate_scores_computed": False,
              "validation_scored": False,
              "production_change_authorized": False,
              "source_catalog_amendment_authorized": False,
              "v3_rules_rewritten": False,
              "v3_thresholds_lowered": False,
              "v3_outcome_stage_authorized": False,
              "next_study": "draft-pick-fv-v4-clean-source-recovery",
              "interpretation": (
                  "V3 does not test whether draft-pick FV candidates beat the deployed baseline. "
                  "It terminates before outcomes because the frozen historical source cohort was not "
                  "sufficiently clean under its own preregistered source requirements."
              ),
          }

          v3_json = v3 / "v3_closure.json"
          v3_md = v3 / "v3_closure.md"
          v3_man = v3 / "v3_closure_manifest.json"
          dump(v3_json, v3_closure)

          gates = v3_closure["clean_subset_gate_recheck"]["gates"]
          md = f"""# Draft Pick FV V3 — Formal Closure

          **Status:** `CLOSED_PRE_OUTCOME`  
          **Decision:** `STOP_V3_SOURCE_SCOPE_CONTAMINATION_CLEAN_SUBSET_INSUFFICIENT`

          V3 is closed before historical player-outcome ingestion, candidate fitting, validation scoring,
          or any production change.

          ## Why V3 stopped

          The frozen source catalog contained **{v3_closure['contaminated_league_n']}** leagues with positive
          evidence of rookie-scope contamination. Removing those leagues left **{v3_closure['clean_league_n']}**
          clean leagues from the original **{v3_closure['frozen_catalog_league_n']}**.

          The clean subset failed the original frozen pooled gates:

          | Gate | Clean value | Frozen requirement | Result |
          |---|---:|---:|---|
          | R1–R4 nonmock total | {gates['r1_r4_nonmock_total']['value']} | ≥ {int(gates['r1_r4_nonmock_total']['threshold'])} | FAIL |
          | R5 non-IDP total | {gates['r5_nonidp_nonmock_total']['value']} | ≥ {int(gates['r5_nonidp_nonmock_total']['threshold'])} | FAIL |
          | R6 non-IDP total | {gates['r6_nonidp_nonmock_total']['value']} | ≥ {int(gates['r6_nonidp_nonmock_total']['threshold'])} | FAIL |
          | R6 minimum per year | {gates['r6_nonidp_min_per_year']['value']} | ≥ {int(gates['r6_nonidp_min_per_year']['threshold'])} | FAIL |
          | R6 effective years | {gates['r6_nonidp_hhi_effective_years']['value']:.4f} | ≥ {gates['r6_nonidp_hhi_effective_years']['threshold']} | PASS |
          | R6 max year share | {gates['r6_nonidp_max_year_share']['value']:.4f} | ≤ {gates['r6_nonidp_max_year_share']['threshold']:.2f} | PASS |
          | IDP R6 total | {gates['idp_r6_nonmock_total']['value']} | ≥ {int(gates['idp_r6_nonmock_total']['threshold'])} | FAIL |
          | IDP R6 years represented | {gates['idp_r6_years_represented']['value']} | ≥ {int(gates['idp_r6_years_represented']['threshold'])} | PASS |

          ## Scientific meaning

          This is a **source-feasibility stop**, not evidence that a new draft-pick valuation curve would
          succeed or fail. V3 never read historical player outcomes and never scored the candidate models.

          No V3 threshold is lowered, no contaminated league is retained to rescue a gate, and the frozen V3
          catalog is not rewritten after the result.
          """
          v3_md.write_text("\n".join(line.strip() for line in md.splitlines()) + "\n")

          v3_manifest = {
              "schema_version": 1,
              "study_id": v3_closure["study_id"],
              "status": v3_closure["status"],
              "decision": v3_closure["decision"],
              "generated_at_utc": generated,
              "historical_player_outcomes_read": False,
              "candidate_fit_performed": False,
              "validation_scored": False,
              "production_change_authorized": False,
              "source_hashes": {
                  prereg_path.name: sha(prereg_path),
                  prereg_man_path.name: sha(prereg_man_path),
                  pooled_path.name: sha(pooled_path),
                  contam_path.name: sha(contam_path),
                  contam_man_path.name: sha(contam_man_path),
              },
              "output_hashes": {
                  v3_json.name: sha(v3_json),
                  v3_md.name: sha(v3_md),
              },
          }
          dump(v3_man, v3_manifest)

          # V4 SOURCE RECOVERY DESIGN.
          # This stage is deliberately source-only. Passing it does NOT authorize outcomes;
          # a new V4 catalog/preregistration freeze must occur first.
          criteria = pooled["new_design_sufficiency_criteria"]
          expected = {
              "r1_r4_nonmock_total_min": 180,
              "r5_nonidp_nonmock_total_min": 60,
              "r6_nonidp_nonmock_total_min": 36,
              "r6_nonidp_nonmock_min_each_year": 3,
              "r6_nonidp_effective_years_min": 4.5,
              "r6_nonidp_nonmock_max_year_share": 0.30,
              "r6_idp_nonmock_total_min_for_sensitivity_only": 20,
              "r6_idp_nonmock_min_years_represented": 5,
          }
          for key, value in expected.items():
              assert float(criteria[key]) == float(value), (key, criteria[key], value)

          v4_prereg = {
              "schema_version": 1,
              "study_id": "draft-pick-fv-v4-clean-source-recovery",
              "status": "FROZEN_PRE_SEARCH_PRE_OUTCOME",
              "generated_at_utc": generated,
              "objective": (
                  "Determine whether a contamination-aware, reproducibly expanded historical MFL search "
                  "can produce a sufficient 2018-2023 cohort of genuine 12-team SF/2QB rookie drafts "
                  "without reading player outcomes or changing the inherited V3 source-sufficiency bars."
              ),
              "years": [2018, 2019, 2020, 2021, 2022, 2023],
              "provider": "MyFantasyLeague",
              "base_eligibility": {
                  "teams": 12,
                  "qb_format": ["1-2", "2"],
                  "draft_player_pool": "Rookie-only",
                  "dynasty_evidence": (
                      "Explicit dynasty keeperType OR the already validated missing-keeperType historical proxy; "
                      "observed keeper/redraft/other formats rejected."
                  ),
                  "mock_drafts": "excluded",
                  "actual_draft_slot_required": True,
              },
              "contamination_screen": {
                  "unit": "league draft",
                  "positive_contamination_evidence": [
                      "Any resolved standard-player identity in the audited draft scope whose NFL draft class is earlier than the league draft year.",
                      "Any resolved standard-player identity in the audited draft scope whose NFL draft class is later than the league draft year.",
                      "Any league-scoped custom-player identity that unambiguously maps to an earlier or later NFL draft class.",
                      "Any league-scoped custom-player metadata explicitly identifying a Devy player/placeholder.",
                  ],
                  "league_rule": (
                      "A league with any positive contamination evidence is excluded from every V4 primary/source-sufficiency scope. "
                      "Diagnostic unknown identities are reported but are not silently converted into same-year identities."
                  ),
                  "identity_namespace_rule": (
                      "MFL custom player IDs are league-scoped and must never be treated as globally unique. "
                      "Custom identities may be matched only with league-scoped metadata plus unambiguous normalized name+position+NFL draft class."
                  ),
                  "no_manual_rescue_after_results": True,
              },
              "search_universe": {
                  "purpose": "source recovery only",
                  "existing_clean_seed": (
                      "The positively uncontaminated V3 catalog subset may be carried forward only as source evidence, "
                      "with V3's stop preserved. It is not a V4 frozen catalog until a later catalog freeze."
                  ),
                  "search_terms": [
                      "dynasty",
                      "superflex",
                      "super flex",
                      "2qb",
                      "2 qb",
                      "rookie",
                      "rookie draft",
                      "superflex dynasty",
                      "sf dynasty",
                      "2qb dynasty",
                      "idp",
                      "empire",
                      "contract",
                      "salary",
                      "taxi",
                      "fantasy",
                      "football",
                      "league",
                  ],
                  "ordering": "Deterministic SHA-256 ordering by year, search term, and league id.",
                  "max_results_per_term": 250,
                  "max_unique_candidates_per_year": 1200,
                  "candidate_deduplication": "year + league_id",
                  "new_candidate_priority": (
                      "Known V3 frozen-catalog league IDs remain auditable seeds; previously unseen IDs from the expanded "
                      "bounded union are probed next in deterministic order."
                  ),
                  "transport_retries": 4,
                  "request_sleep_seconds": 1.02,
                  "post_result_search_expansion": "forbidden",
              },
              "depth_scopes": {
                  "primary_r1_r4": "clean, nonmock eligible leagues complete through Round 4",
                  "primary_r5": "clean, nonmock, non-IDP eligible leagues complete through Round 5",
                  "primary_r6": "clean, nonmock, non-IDP eligible leagues complete through Round 6",
                  "idp_r6_sensitivity": "clean, nonmock IDP eligible leagues complete through Round 6; sensitivity only",
              },
              "source_sufficiency_gates": expected,
              "year_balance": {
                  "r5_weighting": "equal year total",
                  "r6_weighting": "equal year total with pooled hierarchical/smoothed exact-slot estimator",
                  "r6_hhi_effective_years_min": 4.5,
                  "r6_max_year_share": 0.30,
              },
              "decision_rule": {
                  "pass": "PASS_V4_CLEAN_SOURCE_RECOVERY_GATES",
                  "fail": "STOP_V4_CLEAN_SOURCE_RECOVERY_INSUFFICIENT",
                  "all_primary_gates_must_pass": True,
                  "idp_gate_is_sensitivity_only": True,
                  "pass_does_not_authorize_outcomes": True,
                  "next_if_pass": (
                      "Freeze a new V4 clean source catalog and full V4 preregistration, then independently rerun harvest/identity gates before any outcomes."
                  ),
                  "next_if_fail": (
                      "Close the MFL historical-draft source-recovery path unless a materially different pre-outcome source design is preregistered."
                  ),
              },
              "forbidden_before_recovery_decision": [
                  "Sleeper historical weekly player outcomes",
                  "any 2026 realized player outcome",
                  "candidate model fitting",
                  "candidate MAE or validation scoring",
                  "current KTC or other current market values as fit targets",
                  "package-vote evidence",
                  "lowering or rewriting inherited source-sufficiency thresholds",
                  "adding search terms/caps after observing recovery counts",
                  "manual league inclusion to cross a gate",
                  "production changes",
              ],
              "historical_player_outcomes_read": False,
              "candidate_fit_performed": False,
              "candidate_scores_computed": False,
              "validation_scored": False,
              "production_change_authorized": False,
              "authorizes_outcome_ingestion": False,
              "authorizes_source_catalog_freeze": False,
          }

          v4_json = v4 / "source_recovery_preregistration_v4.json"
          v4_md = v4 / "source_recovery_preregistration_v4.md"
          v4_man = v4 / "source_recovery_manifest_v4.json"
          dump(v4_json, v4_prereg)

          md4 = f"""# Draft Pick FV V4 — Clean Source Recovery Preregistration

          **Status:** `FROZEN_PRE_SEARCH_PRE_OUTCOME`

          V4 asks one question first: can we build a sufficiently large cohort of **genuine** historical
          12-team SF/2QB rookie drafts after screening source contamination correctly?

          ## What V4 inherits without modification

          The source-sufficiency bars are **not lowered** from V3:

          - R1–R4 clean nonmock total: **≥ 180**
          - R5 clean non-IDP total: **≥ 60**
          - R6 clean non-IDP total: **≥ 36**
          - R6 clean non-IDP minimum in every year: **≥ 3**
          - R6 effective years: **≥ 4.5**
          - R6 maximum single-year share: **≤ 30%**
          - IDP R6 sensitivity total: **≥ 20**
          - IDP R6 sensitivity represented years: **≥ 5**

          ## Contamination rule

          A league is excluded from V4 primary/source-sufficiency scopes if its audited draft contains
          positive evidence of an earlier NFL class, a later NFL class, or an explicit Devy custom player.
          MFL custom-player IDs are treated as **league-scoped**, never globally unique.

          Unknown identities are reported; they are not manually relabeled after the recovery counts are known.

          ## Frozen expanded search

          The search remains MFL 2018–2023. The bounded search union uses the preregistered term list,
          deterministic SHA-256 ordering, up to **250 results per term**, and up to **1,200 unique candidates
          per year**. Search expansion after seeing recovery counts is forbidden.

          ## Firewall

          This stage reads source metadata and draft identities only. It does **not** read historical player
          outcomes, fit candidate FV curves, score validation, use KTC/package votes as targets, or authorize
          a production change.

          Passing source recovery does not itself authorize outcomes. A new V4 catalog/preregistration must
          be frozen first.
          """
          v4_md.write_text("\n".join(line.strip() for line in md4.splitlines()) + "\n")

          v4_manifest = {
              "schema_version": 1,
              "study_id": v4_prereg["study_id"],
              "status": v4_prereg["status"],
              "generated_at_utc": generated,
              "historical_player_outcomes_read": False,
              "candidate_fit_performed": False,
              "validation_scored": False,
              "production_change_authorized": False,
              "authorizes_outcome_ingestion": False,
              "source_hashes": {
                  "v3_closure.json": sha(v3_json),
                  "v3_closure_manifest.json": sha(v3_man),
                  "rookie_scope_contamination_audit_v3.json": sha(contam_path),
                  "mfl_pooled_design_v1.json": sha(pooled_path),
                  "preregistration_v3.json": sha(prereg_path),
              },
              "output_hashes": {
                  v4_json.name: sha(v4_json),
                  v4_md.name: sha(v4_md),
              },
          }
          dump(v4_man, v4_manifest)

          print("WROTE V3 formal closure")
          print("FROZE V4 clean source-recovery design")
          print("NO outcomes read; NO fit; NO validation scoring; NO production authorization")
          PY

      - name: Validate closure and V4 freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          v3 = Path("research/draft-pick-fv-v3")
          v4 = Path("research/draft-pick-fv-v4")
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          load = lambda p: json.loads(p.read_text())

          c = load(v3 / "v3_closure.json")
          cm = load(v3 / "v3_closure_manifest.json")
          p = load(v4 / "source_recovery_preregistration_v4.json")
          pm = load(v4 / "source_recovery_manifest_v4.json")

          assert c["status"] == "CLOSED_PRE_OUTCOME"
          assert c["decision"] == "STOP_V3_SOURCE_SCOPE_CONTAMINATION_CLEAN_SUBSET_INSUFFICIENT"
          assert c["scientific_scope"] == "STOP_NO_OUTCOME_INGESTION"
          assert c["v3_thresholds_lowered"] is False
          assert c["v3_outcome_stage_authorized"] is False

          assert p["status"] == "FROZEN_PRE_SEARCH_PRE_OUTCOME"
          assert p["source_sufficiency_gates"]["r1_r4_nonmock_total_min"] == 180
          assert p["source_sufficiency_gates"]["r5_nonidp_nonmock_total_min"] == 60
          assert p["source_sufficiency_gates"]["r6_nonidp_nonmock_total_min"] == 36
          assert p["source_sufficiency_gates"]["r6_nonidp_nonmock_min_each_year"] == 3
          assert p["source_sufficiency_gates"]["r6_nonidp_effective_years_min"] == 4.5
          assert p["source_sufficiency_gates"]["r6_nonidp_nonmock_max_year_share"] == 0.30
          assert p["search_universe"]["max_results_per_term"] == 250
          assert p["search_universe"]["max_unique_candidates_per_year"] == 1200
          assert p["decision_rule"]["pass_does_not_authorize_outcomes"] is True

          for obj in (c, cm, p, pm):
              assert obj["historical_player_outcomes_read"] is False
              assert obj["candidate_fit_performed"] is False
              assert obj["validation_scored"] is False
              assert obj["production_change_authorized"] is False

          assert cm["output_hashes"]["v3_closure.json"] == sha(v3 / "v3_closure.json")
          assert cm["output_hashes"]["v3_closure.md"] == sha(v3 / "v3_closure.md")
          assert pm["output_hashes"]["source_recovery_preregistration_v4.json"] == sha(v4 / "source_recovery_preregistration_v4.json")
          assert pm["output_hashes"]["source_recovery_preregistration_v4.md"] == sha(v4 / "source_recovery_preregistration_v4.md")

          print("PASS: V3 closed exactly at source stop.")
          print("PASS: V4 source recovery design frozen pre-search/pre-outcome.")
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove exact intended files changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)

          expected=(
            "research/draft-pick-fv-v3/v3_closure.json"
            "research/draft-pick-fv-v3/v3_closure.md"
            "research/draft-pick-fv-v3/v3_closure_manifest.json"
            "research/draft-pick-fv-v4/source_recovery_manifest_v4.json"
            "research/draft-pick-fv-v4/source_recovery_preregistration_v4.json"
            "research/draft-pick-fv-v4/source_recovery_preregistration_v4.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"

          test "${#changed[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

          # Explicitly prove no production or historical outcome file changed.
          ! printf '%s\n' "${changed[@]}" | grep -Eq '(^|/)(app|src|public|data|values|production)/'
          ! printf '%s\n' "${changed[@]}" | grep -Eq 'outcome|weekly|stats'

          echo "PASS: exactly six closure/design files changed."

      - name: Commit exact closure and V4 freeze files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v3/v3_closure.json \
            research/draft-pick-fv-v3/v3_closure.md \
            research/draft-pick-fv-v3/v3_closure_manifest.json \
            research/draft-pick-fv-v4/source_recovery_preregistration_v4.json \
            research/draft-pick-fv-v4/source_recovery_preregistration_v4.md \
            research/draft-pick-fv-v4/source_recovery_manifest_v4.json

          git diff --cached --quiet && {
            echo "ERROR: nothing staged"
            exit 1
          }

          git commit -m "Close Draft Pick FV V3 and freeze V4 source recovery"
          git pull --rebase origin main
          git push origin HEAD:main
