name: QF11 V37r1 - KTC V2 Synthetic Ballot Chromium Pin Repair (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v37r1-ktc-v2-synthetic-browser-read-only
  cancel-in-progress: false
jobs:
  synthetic_browser_audit:
    name: Real Chromium rendering; simulated RPC; no Google calls or writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout frozen source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install test and regression dependencies only
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests playwright==1.57.0
    - name: Fail closed on any drift in KTC V2 and production model sources
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_RUN_SHA_DRIFT; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_WORKTREE_DIRTY; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_DRIFT_$1"; exit 1; }; }
        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28
        check research/ktc-v2-isolated/collector.gs b4ce85ea8bf72ef5399d5ffc898b3b571fbcad89
        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a
        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d
        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7
        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860
        check research/ktc-v2-isolated/client-bridge.js a7dd731fd013c0ce7e547eb05ae8c825e85ccd9b
        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        [[ -f data/players_cache.json ]] || { echo STOP_PRODUCTION_CACHE_MISSING; exit 1; }
        echo QF11_V37_FROZEN_INPUTS_GREEN
    - name: Create synthetic Chromium test harness in temporary directory
      run: |
        set -euo pipefail
        mkdir -p /tmp/qf11-v37
        cat > /tmp/qf11-v37/browser_smoke.py <<'PYV37'
        """QF11 V37: synthetic-only, no network or live Google service browser test.
        Tests actual V33 pilot-frame HTML with simulated google.script.run in Chromium.
        This does not validate Google HtmlService sandbox or a real Google RPC deployment.
        """
        import json
        import html as html_escape
        import re
        import sys
        from pathlib import Path
        from playwright.sync_api import sync_playwright

        source = Path(sys.argv[1]) if len(sys.argv)>1 else Path('research/ktc-v2-isolated/pilot-frame.html')
        html = source.read_text(encoding='utf-8')
        assert '<!doctype html>' in html.lower()
        assert 'google.script.run.withSuccessHandler' in html
        assert 'script.google.com/macros/s/' not in html

        TOKEN = 'QF11_V37_SYNTHETIC_PARTICIPANT_TOKEN_000001'
        SITE = 'https://ajknoll23-code.github.io'
        MOCK = 'https://script.googleusercontent.com'
        RPC_JS = r"""
        if(window.self !== window.top) {
          Object.defineProperty(document,'referrer',{configurable:true,get(){return '__SYNTHETIC_REFERRER__';}});
          window.__v37 = {
            bootstrapCalls: [], submitCalls: [],
            bootstrapAck: {status:'READY',display_order:0,players:[
              {key:'sample_a',label:'Sample A'},
              {key:'sample_b',label:'Sample B'},
              {key:'sample_c',label:'Sample C'}]},
            submitAck: {schema:'QF11_KTC_V2_PILOT_RESPONSE_V1',status:'PENDING_HUMAN_Q4_REVIEW'},
            bootstrapFail:false,submitFail:false
          };
          const rpc = {
            withSuccessHandler(fn){this.ok=fn;return this;},
            withFailureHandler(fn){this.fail=fn;return this;},
            qf11v33Bootstrap(token){
              window.__v37.bootstrapCalls.push(token);
              const ok=this.ok, fail=this.fail;
              queueMicrotask(() => window.__v37.bootstrapFail ? fail(new Error('fixture failure')) : ok(window.__v37.bootstrapAck));
            },
            qf11v33Submit(payload){
              window.__v37.submitCalls.push(JSON.parse(JSON.stringify(payload)));
              const ok=this.ok, fail=this.fail;
              queueMicrotask(() => window.__v37.submitFail ? fail(new Error('fixture failure')) : ok(window.__v37.submitAck));
            }
          };
          window.google = {script:{run:rpc}};
        }
        """
        views=[('mobile',390,844),('desktop',1280,850)]
        results=[]

        def check(name,fn):
            fn()
            results.append(name)
            print('PASS '+name,flush=True)

        with sync_playwright() as p:
            import os
            path=(os.environ.get('QF11_V37_BROWSER') or '').strip()
            if not path:
                for candidate in ('/usr/bin/chromium','/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/opt/google/chrome/chrome'):
                    if Path(candidate).exists():path=candidate;break
            if not path:raise RuntimeError('STOP_NO_INSTALLED_CHROMIUM_OR_CHROME')
            browser=p.chromium.launch(headless=True,executable_path=path,args=['--no-sandbox','--disable-dev-shm-usage'])

            def make_page(w=390,h=844,origin=SITE,embedded=True):
                context=browser.new_context(viewport={'width':w,'height':h},service_workers='block')
                referrer=(SITE if origin==SITE else 'https://wrong-v37.example')+'/test-parent'
                context.add_init_script(RPC_JS.replace('__SYNTHETIC_REFERRER__',referrer))
                outgoing=[]
                # No route to outside hosts is allowed, and neither Google nor GitHub is contacted.
                context.route('**/*',lambda route:(outgoing.append(route.request.url),route.abort()))
                page=context.new_page()
                if not embedded:
                    page.set_content(html,wait_until='load')
                    frame=page.main_frame
                else:
                    parent='<html><body><iframe id="pilot" srcdoc="'+html_escape.escape(html,quote=True)+'"></iframe></body></html>'
                    page.set_content(parent,wait_until='load')
                    frame=page.frames[-1]
                    assert frame is not None and frame!=page.main_frame,'FRAME_NOT_FOUND'
                frame.locator('#status').wait_for()
                return context,frame,outgoing

            def begin(frame):
                frame.locator('#token').fill(TOKEN)
                frame.locator('#begin').click()
                frame.locator('#form').wait_for(state='visible')

            def rankings(frame):
                cards=frame.locator('.card')
                assert cards.count()==3
                cards.nth(0).get_by_role('button',name='KEEP').click()
                cards.nth(1).get_by_role('button',name='TRADE').click()
                cards.nth(2).get_by_role('button',name='CUT').click()
                frame.locator('#q1').select_option('1')
                frame.locator('#q2').select_option('1')
                frame.locator('#q3').select_option('0')
                for k in ('consent','adult','expert'):frame.locator('#'+k).check()

            for label,w,h in views:
                for order in range(6):
                    context,frame,outgoing=make_page(w,h)
                    try:
                        shuffled=[['sample_a','sample_b','sample_c'][i] for i in ([0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0])[order]]
                        frame.evaluate('([order,keys])=>{window.__v37.bootstrapAck.display_order=order;window.__v37.bootstrapAck.players=keys.map(k=>({key:k,label:k}))}',[order,shuffled])
                        begin(frame)
                        rankings(frame)
                        frame.locator('#submit').click()
                        frame.get_by_text('The response was received for moderator review.',exact=False).wait_for()
                        calls=frame.evaluate('window.__v37.submitCalls')
                        assert len(calls)==1,(label,order,'EXPECTED_ONE_CALL')
                        payload=calls[0]
                        assert payload['schema']=='QF11_KTC_V2_PILOT_RESPONSE_V1'
                        assert payload['keep']==shuffled[0] and payload['trade']==shuffled[1] and payload['cut']==shuffled[2]
                        assert payload['mc']==[1,1,0] and payload['display_order']==order
                        assert payload['consent'] is True and payload['adult'] is True and payload['sf_idp_experience'] is True
                        assert set(payload)=={'schema','participant_token','display_order','consent','adult','sf_idp_experience','keep','trade','cut','mc'}
                        assert frame.locator('#submit').is_disabled()
                        frame.locator('#submit').evaluate('(el)=>el.click()')
                        assert len(frame.evaluate('window.__v37.submitCalls'))==1
                        assert not outgoing,('OUTBOUND_NETWORK',outgoing)
                        check(label+' display-order-'+str(order)+' single synthetic acknowledgment',lambda:None)
                    finally:context.close()

            def test_wrong_origin():
                context,frame,outgoing=make_page(origin='other')
                try:
                    assert 'only be used inside' in frame.locator('#status').inner_text()
                    assert frame.locator('#access').is_hidden()
                    assert frame.evaluate('window.__v37.bootstrapCalls')==[]
                    assert not outgoing
                finally:context.close()
            check('wrong embedding origin blocked',test_wrong_origin)

            def test_top_level():
                context,frame,outgoing=make_page(embedded=False)
                try:
                    assert 'only be used inside' in frame.locator('#status').inner_text()
                    assert frame.locator('#access').is_hidden()
                    assert frame.evaluate('window.__v37===undefined') is True
                    assert not outgoing
                finally:context.close()
            check('top-level launch blocked',test_top_level)

            def test_no_consent():
                context,frame,outgoing=make_page()
                try:
                    begin(frame)
                    frame.locator('.card').nth(0).get_by_role('button',name='KEEP').click()
                    frame.locator('.card').nth(1).get_by_role('button',name='TRADE').click()
                    frame.locator('.card').nth(2).get_by_role('button',name='CUT').click()
                    frame.locator('#q1').select_option('1')
                    frame.locator('#q2').select_option('1')
                    frame.locator('#q3').select_option('0')
                    frame.locator('#submit').click()
                    assert 'consent and eligibility' in frame.locator('#status').inner_text()
                    assert frame.evaluate('window.__v37.submitCalls')==[]
                    assert not outgoing
                finally:context.close()
            check('no consent or eligibility means no submission',test_no_consent)

            def test_missing_answers():
                context,frame,outgoing=make_page()
                try:
                    begin(frame)
                    frame.locator('#submit').click()
                    assert 'Complete three distinct rankings' in frame.locator('#status').inner_text()
                    assert frame.evaluate('window.__v37.submitCalls')==[]
                    assert not outgoing
                finally:context.close()
            check('incomplete ranking and comprehension blocked',test_missing_answers)

            def test_transport_error():
                context,frame,outgoing=make_page()
                try:
                    begin(frame)
                    rankings(frame)
                    frame.evaluate('window.__v37.submitFail=true')
                    frame.locator('#submit').click()
                    frame.get_by_text('Could not confirm the response.',exact=False).wait_for()
                    assert len(frame.evaluate('window.__v37.submitCalls'))==1
                    assert frame.locator('#submit').is_disabled()
                    assert not outgoing
                finally:context.close()
            check('RPC failure prevents retry and does not claim receipt',test_transport_error)

            def test_injection_safety():
                context,frame,outgoing=make_page()
                try:
                    label='<img src="https://evil-v37.example/track" onerror="alert(1)">'
                    frame.evaluate('(label)=>window.__v37.bootstrapAck.players[0].label=label',label)
                    begin(frame)
                    assert frame.locator('.card strong').first.inner_text()==label
                    assert frame.locator('.card img').count()==0
                    assert not outgoing
                finally:context.close()
            check('untrusted player label uses text not HTML',test_injection_safety)

            def test_invalid_invitation():
                context,frame,outgoing=make_page()
                try:
                    frame.locator('#token').fill('bad')
                    frame.locator('#begin').click()
                    assert 'Invalid invitation code format' in frame.locator('#status').inner_text()
                    assert frame.evaluate('window.__v37.bootstrapCalls')==[]
                    assert not outgoing
                finally:context.close()
            check('invalid invitation blocked before simulated RPC',test_invalid_invitation)

            browser.close()

        expected=len(views)*6+7
        assert len(results)==expected,(len(results),expected)
        report={'schema':'QF11_V37_SYNTHETIC_BROWSER_BALLOT_V1','passed':len(results),'checks':results,'devices':['mobile 390x844','desktop 1280x850'],'display_orders_tested':6,'real_google_calls':0,'real_votes_written':0,'real_browser_rpc_verified':False,'production_or_google_modified':False,'test_browser':'Chromium','transport':'intercepted fixture google.script.run'}
        print('QF11_V37_SYNTHETIC_BROWSER_GREEN '+json.dumps({'tests':len(results),'external_calls':0,'live_google_calls':0,'live_votes':0}),flush=True)
        Path('/tmp/qf11-v37-browser-report.json').write_text(json.dumps(report,indent=2)+'\n')
        PYV37
        python3 -m py_compile /tmp/qf11-v37/browser_smoke.py
    - name: Run 19 Chromium UI tests in mobile and desktop viewports
      run: |
        set -euo pipefail
        if command -v google-chrome >/dev/null 2>&1; then BROWSER="$(command -v google-chrome)";
        elif command -v google-chrome-stable >/dev/null 2>&1; then BROWSER="$(command -v google-chrome-stable)";
        elif command -v chromium >/dev/null 2>&1; then BROWSER="$(command -v chromium)";
        else echo STOP_NO_PREINSTALLED_CHROME_CHROMIUM; exit 1; fi
        printf 'BROWSER_PATH=%s\n' "$BROWSER"
        QF11_V37_BROWSER="$BROWSER" python3 /tmp/qf11-v37/browser_smoke.py research/ktc-v2-isolated/pilot-frame.html
    - name: Repeat all 75 KTC V2 synthetic checks and frozen valuation regressions
      run: |
        set -euo pipefail
        node research/ktc-v2-isolated/collector.test.js
        node research/ktc-v2-isolated/client-bridge.test.js
        node research/ktc-v2-isolated/frame-host.test.js
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V37_75_SYNTHETIC_AND_FROZEN_MODEL_REGRESSIONS_GREEN
    - name: Confirm absolutely no repository changes; finalize limitations
      run: |
        set -euo pipefail
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_REPO_CHANGED; git status --short; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_COMMIT_CHANGED; exit 1; }
        python3 - <<'PYEND'
        import json
        from pathlib import Path
        p=Path('/tmp/qf11-v37-browser-report.json')
        obj=json.loads(p.read_text())
        assert obj['passed']==19
        assert obj['real_google_calls']==0 and obj['real_votes_written']==0
        assert obj['real_browser_rpc_verified'] is False
        obj['owner_only_google_deployment_untouched']=True
        obj['new_apps_script_project_created']=False
        obj['next_blockers']=['Real Google HtmlService iframe referrer and clickjacking behavior unverified','Live browser Google RPC acknowledgment unverified','Human wording and privacy reviews pending','Deletion trigger must be verified before any real study','Explicit owner approval required before any real pilot']
        p.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
        print('QF11_V37_READ_ONLY_SYNTHETIC_CHROMIUM_GREEN')
        PYEND
    - name: Upload synthetic Chromium test report
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v37-synthetic-Chromium-mobile-desktop-audit
        path: /tmp/qf11-v37-browser-report.json
        retention-days: 7
        if-no-files-found: error
