    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      YEAR: ${{ matrix.year }}
      BATCH_START: ${{ matrix.start }}
      BATCH_END: ${{ matrix.end }}
      SLOT: ${{ matrix.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0B prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0b-qualified-depth-prep
          path: ${{ runner.temp }}/prep

      - name: Download exact Phase 0A raw-depth chunk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/raw"
          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-${YEAR}-${BATCH_START}-${BATCH_END}" \
            -D "${RUNNER_TEMP}/raw"

      - name: Probe real qualification and identity readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/diag"
          export MFL_TRANSPORT_DIAGNOSTIC_PATH="${RUNNER_TEMP}/diag/transport.jsonl"
          sleep "$(( SLOT * 10 ))"
          python3 "${RUNNER_TEMP}/prep/qualified_depth_probe_v8.py" \
            --year "$YEAR" \
            --batch-start "$BATCH_START" \
            --batch-end "$BATCH_END" \
            --prep "${RUNNER_TEMP}/prep" \
            --raw-dir "${RUNNER_TEMP}/raw" \
            --out "${RUNNER_TEMP}/out/chunk_${YEAR}_${BATCH_START}_${BATCH_END}.json"

      - name: Upload qualified-depth chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0b-qualified-depth-${{ matrix.year }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0b-qualified-depth-diag-${{ matrix.year }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/diag/transport.jsonl
          if-no-files-found: ignore
          retention-days: 30

  assemble:
    needs: qualified_depth
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Download frozen prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0b-qualified-depth-prep
          path: ${{ runner.temp }}/prep

      - name: Download all Phase 0B chunks
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p0b-qualified-depth-20*
          path: ${{ runner.temp }}/chunks
          merge-multiple: true

      - name: Assemble and gate all 108 year-cells
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assembled"

          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          prep=root/"prep"
          chunks=root/"chunks"
          out=root/"assembled"

          contract=json.loads((prep/"v8_phase0b_qualified_depth_contract.json").read_text())
          p0a=json.loads((prep/"closeout"/"v8_phase0a_raw_depth_feasibility.json").read_text())

          expected_year_n={2018:1059,2019:1014,2020:1024,2021:1029,2022:1040,2023:1037}
          endpoints={
              4:"r1_early",8:"r1_mid",12:"r1_late",
              16:"r2_early",20:"r2_mid",24:"r2_late",
              28:"r3_early",32:"r3_mid",36:"r3_late",
              40:"r4_early",44:"r4_mid",48:"r4_late",
              52:"r5_early",56:"r5_mid",60:"r5_late",
              64:"r6_early",68:"r6_mid",72:"r6_late",
          }
          cells=list(endpoints.values())
          MIN_N=12
          MIN_COV=.95
          MAX_TRANSPORT=.01

          docs=[]
          for p in sorted(chunks.glob("chunk_*.json")):
              d=json.loads(p.read_text())
              for k in (
                  "historical_player_outcomes_read","holdout_2024_outcomes_read",
                  "holdout_2024_search_performed","market_or_ktc_values_read",
                  "package_vote_data_read","candidate_fit_performed",
                  "candidate_scores_computed","candidate_selection_performed",
                  "production_change_authorized"
              ):
                  assert d[k] is False, (p.name,k)
              docs.append(d)

          assert len(docs)==30, len(docs)

          by_year=defaultdict(list)
          all_dispositions=[]
          all_memberships=[]
          all_occurrences=[]
          all_transport=[]
          for d in docs:
              y=int(d["draft_year"])
              by_year[y].append(d)
              all_dispositions.extend(
                  [{"draft_year":y,**x} for x in d["candidate_dispositions"]]
              )
              all_memberships.extend(d["cell_memberships"])
              all_occurrences.extend(d["occurrences"])
              all_transport.extend(
                  [{"draft_year":y,**x} for x in d["transport_unresolved"]]
              )

          prep_disc=prep/"p0a"/"discoveries"
          for y in range(2018,2024):
              ds=sorted(by_year[y],key=lambda d:int(d["batch_start"]))
              assert len(ds)==5
              got=[lid for d in ds for lid in d["candidate_ids"]]
              frozen=json.loads((prep_disc/f"discovery_{y}.json").read_text())
              exp=[str(x) for x in frozen["candidate_ids"]]
              assert got==exp, (y,len(got),len(exp))
              assert len(got)==expected_year_n[y]
              assert hashlib.sha256("\n".join(got).encode()).hexdigest()==frozen["candidate_ids_sha256"]

          assert len(all_dispositions)==6203
          assert len({(x["draft_year"],x["league_id"]) for x in all_dispositions})==6203

          transport_keys={(x["draft_year"],x["league_id"]) for x in all_transport}
          transport_n=len(transport_keys)
          transport_fraction=transport_n/6203
          transport_gate=transport_fraction<=MAX_TRANSPORT+1e-15

          mem_by=defaultdict(list)
          occ_by=defaultdict(list)
          for x in all_memberships:
              mem_by[(int(x["draft_year"]),x["cell"])].append(x)
          for x in all_occurrences:
              occ_by[(int(x["draft_year"]),x["cell"])].append(x)

          raw_years={int(x["draft_year"]):x for x in p0a["years"]}
          metrics={}
          all_cells_pass=True
          weakest={
              "qualified_league_n":None,
              "retention_fraction":None,
              "identity_coverage":None,
              "sleeper_ready_coverage":None,
          }

          for y in range(2018,2024):
              for cell in cells:
                  qualified=[
                      x for x in mem_by[(y,cell)]
                      if x["status"]=="qualified"
                  ]
                  qids={str(x["league_id"]) for x in qualified}
                  qn=len(qids)
                  occ=[x for x in occ_by[(y,cell)] if str(x["league_id"]) in qids]
                  retained=len(occ)
                  expected=qn*4
                  represented=len({str(x["league_id"]) for x in occ})
                  ident=sum(bool(x["identity_resolved"]) for x in occ)
                  sleeper=sum(bool(x["outcome_ready_sleeper_id"]) for x in occ)

                  retention=retained/expected if expected else 0.0
                  represented_fraction=represented/qn if qn else 0.0
                  identity_cov=ident/retained if retained else 0.0
                  sleeper_cov=sleeper/retained if retained else 0.0

                  raw=raw_years[y]["cell_raw_depth_feasibility"][cell]["raw_depth_supported_league_n"]
                  source_pass=qn>=MIN_N
                  retention_pass=retention>=MIN_COV and represented_fraction>=MIN_COV
                  identity_pass=identity_cov>=MIN_COV
                  sleeper_pass=sleeper_cov>=MIN_COV
                  cell_pass=source_pass and retention_pass and identity_pass and sleeper_pass
                  all_cells_pass=all_cells_pass and cell_pass

                  key=f"{y}:{cell}"
                  metrics[key]={
                      "draft_year":y,
                      "cell":cell,
                      "raw_depth_supported_league_n":raw,
                      "qualified_league_n":qn,
                      "qualification_yield_fraction":qn/raw if raw else 0.0,
                      "minimum_qualified_league_n":MIN_N,
                      "expected_occurrence_n":expected,
                      "retained_occurrence_n":retained,
                      "retention_fraction":retention,
                      "represented_league_n":represented,
                      "represented_league_fraction":represented_fraction,
                      "identity_resolved_n":ident,
                      "identity_coverage":identity_cov,
                      "sleeper_ready_n":sleeper,
                      "sleeper_ready_coverage":sleeper_cov,
                      "source_count_gate_pass":source_pass,
                      "retention_gate_pass":retention_pass,
                      "identity_gate_pass":identity_pass,
                      "sleeper_ready_gate_pass":sleeper_pass,
                      "all_gates_pass":cell_pass,
                  }

                  weakest["qualified_league_n"] = qn if weakest["qualified_league_n"] is None else min(weakest["qualified_league_n"],qn)
                  weakest["retention_fraction"] = retention if weakest["retention_fraction"] is None else min(weakest["retention_fraction"],retention)
                  weakest["identity_coverage"] = identity_cov if weakest["identity_coverage"] is None else min(weakest["identity_coverage"],identity_cov)
                  weakest["sleeper_ready_coverage"] = sleeper_cov if weakest["sleeper_ready_coverage"] is None else min(weakest["sleeper_ready_coverage"],sleeper_cov)

          passed_cells=sum(x["all_gates_pass"] for x in metrics.values())
          source_gate_pass=all_cells_pass and transport_gate
          decision=(
              contract["pass_decision"]
              if source_gate_pass
              else contract["fail_decision"]
          )

          summary={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0b_qualified_depth_feasibility_closeout",
              "decision":decision,
              "candidate_universe_total_n":6203,
              "exact_candidate_coverage":True,
              "year_cell_n":108,
              "year_cells_passing_all_gates":passed_cells,
              "all_year_cells_pass":all_cells_pass,
              "transport":{
                  "transport_unresolved_candidate_n":transport_n,
                  "transport_unresolved_fraction":transport_fraction,
                  "maximum_allowed_fraction":MAX_TRANSPORT,
                  "gate_pass":transport_gate,
              },
              "weakest_observed":weakest,
              "year_cell":metrics,
              "firewalls":contract["firewalls"],
              "historical_outcome_ingestion_authorized":False,
              "holdout_2024_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":(
                  "draft-pick-fv-v8-phase1-source-identity-freeze"
                  if source_gate_pass else None
              ),
          }
          (out/"v8_phase0b_qualified_depth_feasibility.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0B Qualified Depth Feasibility",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- Exact candidate coverage: **6203 / 6203**",
              f"- Year-cells passing all gates: **{passed_cells} / 108**",
              f"- Transport unresolved: **{transport_n} / 6203 ({transport_fraction:.3%})**; cap **1.000%**",
              f"- Weakest qualified cell cohort: **{weakest['qualified_league_n']} leagues**; minimum **12**",
              f"- Weakest occurrence retention: **{weakest['retention_fraction']:.2%}**",
              f"- Weakest identity coverage: **{weakest['identity_coverage']:.2%}**",
              f"- Weakest Sleeper-ready coverage: **{weakest['sleeper_ready_coverage']:.2%}**",
              "",
              "## Late-cell qualified cohort counts",
              "",
              "| Year | R1 late | R2 late | R3 late | R4 late | R5 late | R6 late |",
              "|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for y in range(2018,2024):
              vals=[metrics[f"{y}:r{r}_late"]["qualified_league_n"] for r in range(1,7)]
              lines.append(f"| {y} | " + " | ".join(map(str,vals)) + " |")
          lines += [
              "",
              "No historical NFL outcomes, 2024 outcomes, market/KTC values, package votes, or candidate fits were read.",
              "",
              (
                  "Phase 1 may freeze these exact source/identity results before outcome harvest."
                  if source_gate_pass
                  else "Stop before outcome ingestion and redesign the source architecture."
              ),
          ]
          (out/"v8_phase0b_qualified_depth_feasibility.md").write_text("\n".join(lines)+"\n")

          # Compact exact evidence needed for the next freeze; still research-only.
          evidence={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0b_qualified_depth_exact_evidence",
              "decision":decision,
              "candidate_dispositions":all_dispositions,
              "cell_memberships":all_memberships,
              "occurrences":all_occurrences,
              "transport_unresolved":all_transport,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }
          (out/"v8_phase0b_qualified_depth_exact_evidence.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True)+"\n"
          )

          print("\n".join(lines))
          PY

      - name: Validate Phase 0B closeout firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"assembled"
          s=json.loads((out/"v8_phase0b_qualified_depth_feasibility.json").read_text())
          e=json.loads((out/"v8_phase0b_qualified_depth_exact_evidence.json").read_text())

          assert s["candidate_universe_total_n"]==6203
          assert s["exact_candidate_coverage"] is True
          assert s["year_cell_n"]==108
          assert len(s["year_cell"])==108
          assert s["historical_outcome_ingestion_authorized"] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert all(v is False for v in s["firewalls"].values())

          assert len(e["candidate_dispositions"])==6203
          assert len({(x["draft_year"],x["league_id"]) for x in e["candidate_dispositions"]})==6203
          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False

          allowed={
              "PROCEED_TO_V8_PHASE1_SOURCE_IDENTITY_FREEZE",
              "STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES",
          }
          assert s["decision"] in allowed
          print("PASS: Phase 0B closeout is complete and outcome-sealed.")
          PY

      - name: Upload Phase 0B closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0b-qualified-depth-feasibility-closeout
          path: ${{ runner.temp }}/assembled/
          if-no-files-found: error
          retention-days: 30
