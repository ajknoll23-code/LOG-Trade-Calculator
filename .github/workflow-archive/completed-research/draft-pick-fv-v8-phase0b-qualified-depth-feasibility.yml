name: Draft Pick FV V8 - Phase 0B Qualified Depth Feasibility

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0b-qualified-depth-feasibility
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download and verify frozen Phase 0A evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prep/p0a" "${RUNNER_TEMP}/prep/closeout"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10894002488" --jq '.digest')" = \
            "sha256:bb24b4ea7378936ea1f8b9504e631f566218a3bdf20297d19d5fe7657de32d5d"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10907818160" --jq '.digest')" = \
            "sha256:25238262fa4b092a7f322201d7c16c126b76971a799d9d62242087ab9bd0583f"

          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-prep" \
            -D "${RUNNER_TEMP}/prep/p0a"
          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-feasibility-closeout" \
            -D "${RUNNER_TEMP}/prep/closeout"

          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = \
            "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/identity_crosswalk.json" | awk '{print $1}')" = \
            "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"prep"/"closeout"/"v8_phase0a_raw_depth_feasibility.json"
          d=json.loads(p.read_text())
          assert d["decision"]=="PROCEED_TO_V8_PHASE0B_QUALIFIED_DEPTH_FEASIBILITY"
          assert d["candidate_universe_total_n"]==6203
          assert d["exact_candidate_coverage"] is True
          assert d["raw_depth_impossibility_screen_pass"] is True
          assert d["minimum_raw_depth_leagues_per_year_cell"]==12
          assert [x["draft_year"] for x in d["years"]]==list(range(2018,2024))
          assert all(
              c["raw_impossibility_gate_pass"]
              for y in d["years"]
              for c in y["cell_raw_depth_feasibility"].values()
          )
          print("PASS: Phase 0A closeout authorizes Phase 0B.")
          PY

      - name: Freeze Phase 0B contract and implementation
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/prep/v8_phase0b_qualified_depth_contract.json" <<'JSON'
          {
            "schema_version": 1,
            "study_id": "draft-pick-fv-v8-depth-specific-source-cohorts",
            "stage": "phase0b_qualified_depth_feasibility_preregistration",
            "status": "FROZEN_PRE_PHASE0B_EXECUTION_PRE_OUTCOME",
            "question": "After real dynasty/SF/rookie qualification, prefix-specific contamination screening, occurrence retention, identity resolution, and Sleeper-readiness, does every 2018-2023 R1-R6 cell retain a viable depth-specific source cohort?",
            "candidate_universe": {
              "source": "exact Phase 0A frozen 6203-candidate universe",
              "total_n": 6203,
              "candidate_membership_changed": false,
              "candidate_order_changed": false,
              "new_league_search_allowed": false,
              "source_substitution_allowed": false
            },
            "depth_specific_source_rule": {
              "cell_endpoints": {
                "4":"r1_early","8":"r1_mid","12":"r1_late",
                "16":"r2_early","20":"r2_mid","24":"r2_late",
                "28":"r3_early","32":"r3_mid","36":"r3_late",
                "40":"r4_early","44":"r4_mid","48":"r4_late",
                "52":"r5_early","56":"r5_mid","60":"r5_late",
                "64":"r6_early","68":"r6_mid","72":"r6_late"
              },
              "raw_depth_source": "Phase 0A selected draft unit and prefix slots; draftResults is not re-fetched in Phase 0B",
              "membership": "For cell endpoint E, source membership requires Phase 0A complete unique slots 1..E, the frozen V7 league-format qualifier, non-mock league name, and no positive contamination within slots 1..E.",
              "later_depth_failure_does_not_reject_earlier_cell": true,
              "later_contamination_does_not_reject_earlier_cell": true,
              "positive_contamination_scope": "prefix 1..E only for the cell being evaluated",
              "diagnostic_identity_unknown_does_not_reject_source_membership": true
            },
            "league_qualification": {
              "team_count": 12,
              "quarterback_format": "Superflex/2QB; QB roster limit 1-2",
              "rookie_only": true,
              "dynasty_or_validated_missing_keeper_proxy": true,
              "explicit_keeper_redraft_non_dynasty_rejected": true,
              "obvious_mock_drafts_rejected": true,
              "manual_rescue_allowed": false,
              "implementation": "reuse frozen V7 qualifier and obvious-mock-name logic"
            },
            "occurrence_and_identity": {
              "duplicate_player_same_league_rule": "retain first occurrence, omit later duplicate occurrence; do not remove otherwise qualified source membership",
              "missing_or_nonplayer_occurrence_rule": "omit occurrence and count against retention; do not remove otherwise qualified source membership",
              "identity_priority": [
                "exact DynastyProcess MFL crosswalk",
                "FantasyPros-to-Sleeper crosswalk with unique nflverse class corroboration",
                "nflverse stable identity by normalized name+draft-era position+class",
                "unambiguous DynastyProcess name+position+class"
              ],
              "identity_assets": "byte-identical frozen V7 Phase 2 identity asset bundle",
              "operational_identity_denominator": "retained occurrences",
              "minimum_cell_occurrence_retention": 0.95,
              "minimum_cell_represented_league_fraction": 0.95,
              "minimum_cell_identity_coverage": 0.95,
              "minimum_cell_sleeper_ready_coverage": 0.95
            },
            "source_gate": {
              "minimum_qualified_leagues_per_year_cell": 12,
              "every_2018_2023_year_cell_must_pass": true,
              "year_cell_n": 108
            },
            "transport": {
              "mfl_endpoints_allowed": ["league","players"],
              "draftResults_refetch_allowed": false,
              "candidate_level_transport_isolation": true,
              "maximum_transport_unresolved_fraction_of_candidate_universe": 0.01,
              "transport_unresolved_is_not_source_rejection": true,
              "replacement_candidate_allowed": false,
              "frozen_residual_router_reused": true
            },
            "firewalls": {
              "historical_player_outcomes_read": false,
              "holdout_2024_outcomes_read": false,
              "holdout_2024_search_performed": false,
              "market_or_ktc_values_read": false,
              "package_vote_data_read": false,
              "candidate_fit_performed": false,
              "candidate_scores_computed": false,
              "candidate_selection_performed": false,
              "production_change_authorized": false
            },
            "pass_decision": "PROCEED_TO_V8_PHASE1_SOURCE_IDENTITY_FREEZE",
            "fail_decision": "STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES",
            "next_if_pass": "Freeze the exact Phase 0B source/identity evidence and preregister the V8 historical outcome/model stage before opening any NFL outcomes."
          }
          JSON

          cat > "${RUNNER_TEMP}/prep/qualified_depth_probe_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          from collections import Counter
          from pathlib import Path

          import requests

          ENDPOINTS={
              4:"r1_early",8:"r1_mid",12:"r1_late",
              16:"r2_early",20:"r2_mid",24:"r2_late",
              28:"r3_early",32:"r3_mid",36:"r3_late",
              40:"r4_early",44:"r4_mid",48:"r4_late",
              52:"r5_early",56:"r5_mid",60:"r5_late",
              64:"r6_early",68:"r6_mid",72:"r6_late",
          }

          def load_engine(path: Path):
              spec=importlib.util.spec_from_file_location("v7_frozen_engine",path)
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot import frozen V7 engine")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def suppress_later_duplicate_players(prefix_slots):
              slots={}
              seen={}
              dup=[]
              for raw in sorted(prefix_slots,key=lambda x:int(x["overall_slot"])):
                  x=dict(raw)
                  s=int(x["overall_slot"])
                  pid=x.get("mfl_player_id")
                  if pid:
                      pid=str(pid)
                      if pid in seen:
                          dup.append({"mfl_player_id":pid,"first_slot":seen[pid],"removed_slot":s})
                          x["mfl_player_id"]=None
                      else:
                          seen[pid]=s
                  slots[s]=x
              return slots,dup

          def p0a_rows(raw_dir: Path, start: int, end: int):
              out=[]
              files={}
              for b in range(start,end+1):
                  p=raw_dir/f"batch_{b:03d}.json"
                  if not p.exists():
                      raise RuntimeError(f"missing Phase 0A batch file {p.name}")
                  d=json.loads(p.read_text())
                  assert int(d["batch_index"])==b
                  assert d["historical_player_outcomes_read"] is False
                  assert d["holdout_2024_outcomes_read"] is False
                  assert d["identity_resolution_performed"] is False
                  assert d["candidate_fit_performed"] is False
                  out.extend(d["candidate_results"])
                  files[p.name]=sha(p)
              return out,files

          def selftest():
              sample=[
                  {"overall_slot":1,"mfl_player_id":"A"},
                  {"overall_slot":2,"mfl_player_id":"B"},
                  {"overall_slot":3,"mfl_player_id":"A"},
                  {"overall_slot":4,"mfl_player_id":None},
              ]
              slots,dup=suppress_later_duplicate_players(sample)
              assert slots[1]["mfl_player_id"]=="A"
              assert slots[3]["mfl_player_id"] is None
              assert dup==[{"mfl_player_id":"A","first_slot":1,"removed_slot":3}]
              assert ENDPOINTS[4]=="r1_early" and ENDPOINTS[72]=="r6_late"
              print("PASS: Phase 0B local helper self-test")

          def run(args):
              prep=Path(args.prep)
              raw_dir=Path(args.raw_dir)
              out=Path(args.out)
              E=load_engine(prep/"p0a"/"engine"/"build_r1_r6_source_identity_v7.py")

              idx,asset=E.load_indexes(
                  prep/"p0a"/"engine"/"db_playerids.csv",
                  prep/"p0a"/"engine"/"nflverse_players.csv",
                  prep/"p0a"/"engine"/"r1_r6_identity_asset_manifest_v7.json",
              )
              rows,input_hashes=p0a_rows(raw_dir,args.batch_start,args.batch_end)
              expected_ids=[str(x["league_id"]) for x in rows]
              if len(expected_ids)!=len(set(expected_ids)):
                  raise RuntimeError("duplicate candidate inside Phase 0A chunk")

              ses=requests.Session()
              ses.headers["User-Agent"]=(
                  f"LOG-Draft-Pick-FV-V8-P0B-{args.year}-"
                  f"B{args.batch_start:03d}-{args.batch_end:03d}/1.0"
              )

              dispositions=[]
              memberships=[]
              occurrences=[]
              transport=[]
              counts=Counter()

              for n,p0 in enumerate(rows,1):
                  lid=str(p0["league_id"])
                  if int(p0["draft_year"])!=args.year:
                      raise RuntimeError("Phase 0A year mismatch")

                  if p0["status"]=="transport_unresolved":
                      u={
                          "league_id":lid,"status":"transport_unresolved",
                          "stage":"draftResults",
                          "failure_class":p0.get("failure_class"),
                          "evidence_source":"phase0a_frozen_transport_unresolved",
                      }
                      dispositions.append(u); transport.append(u)
                      counts["transport_unresolved"]+=1
                      continue

                  if p0["status"]!="depth_observed":
                      dispositions.append({
                          "league_id":lid,
                          "status":"not_raw_depth_supported_r1",
                          "phase0a_status":p0["status"],
                      })
                      counts[f"phase0a_{p0['status']}"]+=1
                      continue

                  endpoints=[
                      int(e) for e in p0.get("complete_cell_endpoints",[])
                      if int(e) in ENDPOINTS
                  ]
                  endpoints=sorted(set(endpoints))
                  if not endpoints:
                      dispositions.append({
                          "league_id":lid,"status":"not_raw_depth_supported_r1",
                          "phase0a_status":"depth_observed",
                          "max_complete_prefix_slot":int(p0.get("max_complete_prefix_slot",0)),
                      })
                      counts["no_complete_cell_endpoint"]+=1
                      continue

                  prefix_slots=[
                      dict(x) for x in p0.get("prefix_slots",[])
                      if int(x["overall_slot"])<=max(endpoints)
                  ]
                  by_slot={int(x["overall_slot"]):x for x in prefix_slots}
                  if any(s not in by_slot for s in range(1,max(endpoints)+1)):
                      raise RuntimeError(f"Phase 0A prefix-slot gap for {args.year}/{lid}")

                  stage="league"
                  try:
                      lg=E.V.league_obj(E.V.get_json(ses,E.V.api_url(args.year,"league",L=lid)))
                      if lg is None:
                          dispositions.append({"league_id":lid,"status":"league_missing"})
                          counts["league_missing"]+=1
                          continue

                      ok,q=E.V.qualifier(lg)
                      if not ok:
                          dispositions.append({
                              "league_id":lid,"status":"qualifier_reject","reason":str(q)
                          })
                          counts[f"qualifier_reject:{q}"]+=1
                          continue

                      if E.V.obvious_mock_name(lg.get("name")):
                          dispositions.append({"league_id":lid,"status":"obvious_mock_reject"})
                          counts["obvious_mock_reject"]+=1
                          continue

                      pids=[
                          str(x["mfl_player_id"])
                          for x in prefix_slots if x.get("mfl_player_id")
                      ]
                      stage="players"
                      meta=E.V.league_scoped_players(ses,args.year,lid,pids)
                      deduped,dup_players=suppress_later_duplicate_players(prefix_slots)

                      qcells=0
                      contamination_cells=0
                      for endpoint in endpoints:
                          cell=ENDPOINTS[endpoint]
                          cr=[
                              {
                                  "overall_slot":s,
                                  "mfl_player_id":str(by_slot[s]["mfl_player_id"]),
                              }
                              for s in range(1,endpoint+1)
                              if by_slot[s].get("mfl_player_id")
                          ]
                          contam=E.V.classify_contamination(args.year,cr,meta,idx)
                          if contam["positive_contamination"]:
                              memberships.append({
                                  "draft_year":args.year,"league_id":lid,"cell":cell,
                                  "cell_endpoint_slot":endpoint,
                                  "status":"positive_contamination_reject",
                                  "positive_evidence_n":contam["positive_evidence_n"],
                                  "diagnostic_unknown_n":contam["diagnostic_unknown_n"],
                              })
                              contamination_cells+=1
                              continue

                          memberships.append({
                              "draft_year":args.year,"league_id":lid,"cell":cell,
                              "cell_endpoint_slot":endpoint,
                              "status":"qualified",
                              "league_name":lg.get("name"),
                              "league_idp":bool(E.V.is_idp(lg)),
                              "qualifier_kind":str(q),
                              "keeper_state":E.V.keeper_state(lg),
                              "qb_limit":E.V.qb_limit(lg),
                              "draft_player_pool":lg.get("draftPlayerPool"),
                              "diagnostic_unknown_n":contam["diagnostic_unknown_n"],
                          })
                          qcells+=1

                          for s in range(endpoint-3,endpoint+1):
                              rec=deduped.get(s)
                              if rec is None or not rec.get("mfl_player_id"):
                                  continue
                              pid=str(rec["mfl_player_id"])
                              ident=E.V.resolve_identity(args.year,pid,meta.get(pid),idx)
                              occurrences.append({
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "cell_endpoint_slot":endpoint,
                                  "overall_slot":s,
                                  "round":int(rec["round"]),
                                  "within_round_pick":int(rec["within_round_pick"]),
                                  "mfl_player_id":pid,
                                  "franchise_id":rec.get("franchise_id"),
                                  "identity_resolved":bool(ident["identity_resolved"]),
                                  "outcome_ready_sleeper_id":bool(ident["outcome_ready_sleeper_id"]),
                                  "identity_method":ident["identity_method"],
                                  "gsis_id":ident.get("gsis_id"),
                                  "sleeper_id":ident.get("sleeper_id"),
                                  "name":ident.get("name"),
                                  "draft_position":ident.get("draft_position"),
                                  "identity_draft_class":ident.get("identity_draft_class"),
                                  "stable_player_key":E.V.stable_player_key(ident),
                              })

                      dispositions.append({
                          "league_id":lid,
                          "status":"evaluated",
                          "max_complete_prefix_slot":int(p0["max_complete_prefix_slot"]),
                          "complete_cell_n":len(endpoints),
                          "qualified_cell_n":qcells,
                          "positive_contamination_cell_n":contamination_cells,
                          "duplicate_player_occurrence_n":len(dup_players),
                      })
                      counts["evaluated"]+=1
                      counts["qualified_any_cell"]+=int(qcells>0)

                  except E.GateError as exc:
                      if not E._v4_transport_exhaustion(exc):
                          raise
                      u={
                          "league_id":lid,"status":"transport_unresolved",
                          "stage":stage,
                          "failure_class":E._v4_transport_class(str(exc)),
                          "evidence_source":"phase0b_exhausted_frozen_router",
                          "error_fingerprint_sha256":hashlib.sha256(str(exc).encode()).hexdigest(),
                      }
                      dispositions.append(u); transport.append(u)
                      counts["transport_unresolved"]+=1

                  if n%25==0 or n==len(rows):
                      print(
                          f"{args.year} {args.batch_start}-{args.batch_end}: "
                          f"{n}/{len(rows)} candidates evaluated={counts['evaluated']} "
                          f"transport={counts['transport_unresolved']}",
                          flush=True,
                      )

              if [x["league_id"] for x in dispositions]!=expected_ids:
                  raise RuntimeError("candidate disposition order/coverage mismatch")

              payload={
                  "schema_version":1,
                  "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
                  "stage":"phase0b_qualified_depth_probe_chunk",
                  "draft_year":args.year,
                  "batch_start":args.batch_start,
                  "batch_end":args.batch_end,
                  "candidate_n":len(expected_ids),
                  "candidate_ids":expected_ids,
                  "candidate_ids_sha256":hashlib.sha256("\n".join(expected_ids).encode()).hexdigest(),
                  "phase0a_batch_sha256":input_hashes,
                  "candidate_dispositions":dispositions,
                  "cell_memberships":memberships,
                  "occurrences":occurrences,
                  "transport_unresolved":transport,
                  "probe_counts":dict(counts),
                  "identity_sources":{
                      "dynastyprocess_sha256":asset["dynastyprocess"]["sha256"],
                      "nflverse_players_sha256":asset["nflverse_players"]["sha256"],
                      "fantasypros_sleeper_crosswalk_sha256":asset["fantasypros_sleeper_crosswalk"]["sha256"],
                      "identity_asset_manifest_sha256":sha(
                          prep/"p0a"/"engine"/"r1_r6_identity_asset_manifest_v7.json"
                      ),
                  },
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
              }
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--self-test",action="store_true")
              ap.add_argument("--year",type=int)
              ap.add_argument("--batch-start",type=int)
              ap.add_argument("--batch-end",type=int)
              ap.add_argument("--prep")
              ap.add_argument("--raw-dir")
              ap.add_argument("--out")
              a=ap.parse_args()
              if a.self_test:
                  selftest(); return
              if None in (a.year,a.batch_start,a.batch_end,a.prep,a.raw_dir,a.out):
                  ap.error("probe mode requires all arguments")
              run(a)

          if __name__=="__main__":
              main()
          PY

          python3 "${RUNNER_TEMP}/prep/qualified_depth_probe_v8.py" --self-test
          python3 -m py_compile "${RUNNER_TEMP}/prep/qualified_depth_probe_v8.py"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"prep"/"v8_phase0b_qualified_depth_contract.json"
          d=json.loads(p.read_text())
          assert d["candidate_universe"]["total_n"]==6203
          assert d["candidate_universe"]["new_league_search_allowed"] is False
          assert d["depth_specific_source_rule"]["later_depth_failure_does_not_reject_earlier_cell"] is True
          assert d["depth_specific_source_rule"]["later_contamination_does_not_reject_earlier_cell"] is True
          assert d["source_gate"]["minimum_qualified_leagues_per_year_cell"]==12
          assert d["source_gate"]["year_cell_n"]==108
          assert d["occurrence_and_identity"]["minimum_cell_occurrence_retention"]==0.95
          assert d["occurrence_and_identity"]["minimum_cell_identity_coverage"]==0.95
          assert d["occurrence_and_identity"]["minimum_cell_sleeper_ready_coverage"]==0.95
          assert d["transport"]["draftResults_refetch_allowed"] is False
          assert d["transport"]["maximum_transport_unresolved_fraction_of_candidate_universe"]==0.01
          assert all(v is False for v in d["firewalls"].values())
          print("PASS: Phase 0B scientific contract frozen before probes.")
          PY

      - name: Upload frozen Phase 0B prep
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0b-qualified-depth-prep
          path: ${{ runner.temp }}/prep/
          if-no-files-found: error
          retention-days: 30

  qualified_depth:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - year: 2018
            start: 0
            end: 9
            slot: 0
          - year: 2018
            start: 10
            end: 19
            slot: 1
          - year: 2018
            start: 20
            end: 29
            slot: 2
          - year: 2018
            start: 30
            end: 39
            slot: 0
          - year: 2018
            start: 40
            end: 42
            slot: 1
          - year: 2019
            start: 0
            end: 9
            slot: 2
          - year: 2019
            start: 10
            end: 19
            slot: 0
          - year: 2019
            start: 20
            end: 29
            slot: 1
          - year: 2019
            start: 30
            end: 39
            slot: 2
          - year: 2019
            start: 40
            end: 40
            slot: 0
          - year: 2020
            start: 0
            end: 9
            slot: 1
          - year: 2020
            start: 10
            end: 19
            slot: 2
          - year: 2020
            start: 20
