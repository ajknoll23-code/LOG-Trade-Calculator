# PREFLIGHTED: B22_2027_SOURCE_COMPARABILITY_PREREGISTRATION
name: B22 Draft Capital Outlook V1 - 2027 Source Comparability Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b22_2027_source_comparability_preregistration:
    name: Freeze 2027 source identity and comparability rules before scoring
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard exact B21 PASS authority and immutable upstream inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          b20=D/"b20/b20_layer_d_preregistration.json"
          b21=D/"b21/b21_historical_calibration.json"
          b21m=D/"b21/b21_manifest.json"
          b15m=D/"b15_manifest.json"
          b15s=D/"b15_2027_anchor_capture_summary.json"
          b15c=D/"b15_2027_source_catalog_frozen.json"
          b15l=D/"b15_2027_anchor_capture_ledger.json"
          for p in (b20,b21,b21m,b15m,b15s,b15c,b15l):
              assert p.is_file(),p

          assert sha(b20)=="aaf76bedd505295286de31a26260928288ee3ca2dbea48df6a22dd770f8b6fa7"
          assert sha(b21)=="97e9b0615e27e0bfdfccbab8b2c58e98bc214523b5e4ad04252d881c5e291dbf"
          assert sha(b15s)=="b9ff4a8dd5ccb768d9da2b7131f8a488e8bd931cd062bb56bbfe7b5575b2654f"
          assert sha(b15c)=="d0ebea75a1c168dbe200f4a20223480f0aef6d977503918ad061d041b87e99f3"
          assert sha(b15l)=="236d8c78761dbca4423448e47d64ddc7fd347ff93748b6552b087590bffadc43"

          R=json.loads(b21.read_text())
          M=json.loads(b21m.read_text())
          S=json.loads(b15s.read_text())
          assert R["decision"]=="PASS_LAYER_D_HISTORICAL_CALIBRATION_AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY"
          assert R["joint_pass"] is True
          for k in ("D1_numerical_monotonicity","D2_loo_direction","D3_loo_rank","D4_single_class_mapping_stability","D5_historical_saturation"):
              assert R[k]["pass"] is True,k
          assert R["2027_source_content_read"] is False
          assert R["2027_class_scored"] is False
          assert R["production_change_authorized"] is False
          assert M["b21_executed"] is True
          assert M["b21_execution_count_committed"]==1
          assert M["joint_pass"] is True
          assert M["production_change_authorized"] is False
          assert S["captured_n"]==7
          assert S["2027_class_scored"] is False
          assert S["production_change_authorized"] is False
          assert not (D/"b22").exists(), "B22 already committed; preregistration is immutable"
          print("PASS: exact B21 PASS authority and B15 point-in-time archive verified.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B22 2027 source identity and comparability protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b22
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b22"

          candidates=[
            {
              "source_id":"ultimate_mock_consensus_2027",
              "source_name":"Ultimate Big Board 2027 NFL Mock Draft Consensus",
              "source_kind":"mock_consensus",
              "publication_anchor_date":"2026-09-28",
              "distance_from_september_30_days":2,
              "raw_path":"research/draft-capital-outlook-v1/archive/2027/2026-anchor/raw/ultimate_mock_consensus_2027.html",
              "raw_sha256":"3d4b2e3a08c37d005772160d94a045f2ba0b2ee05424ca7b5171a269092f2d3f",
              "b15_parsed_path":"research/draft-capital-outlook-v1/archive/2027/2026-anchor/parsed/ultimate_mock_consensus_2027.json",
              "b15_parsed_sha256":"9b760132f08eb97bfd272b8cb8c9d72627b381fc4e50e3e5b4a3439956a99613"
            },
            {
              "source_id":"cbs_mock_hub_2027",
              "source_name":"CBS Sports 2027 NFL Mock Draft",
              "source_kind":"single_mock_draft",
              "publication_anchor_date":"2026-09-28",
              "distance_from_september_30_days":2,
              "raw_path":"research/draft-capital-outlook-v1/archive/2027/2026-anchor/raw/cbs_mock_hub_2027.html",
              "raw_sha256":"c6a2fc79863b480a617c8edd6e93867ca48ae765415de5472eb77ce98df31b95",
              "b15_parsed_path":"research/draft-capital-outlook-v1/archive/2027/2026-anchor/parsed/cbs_mock_hub_2027.json",
              "b15_parsed_sha256":"b4bde89b467b423b4df766d28af3d1f322d98807f325c14b8e03cc3c89165cfb"
            },
            {
              "source_id":"si_mock_2_0_2027",
              "source_name":"Sports Illustrated 2027 NFL Mock Draft 2.0",
              "source_kind":"single_mock_draft",
              "publication_anchor_date":"2026-09-23",
              "distance_from_september_30_days":7,
              "raw_path":"research/draft-capital-outlook-v1/archive/2027/2026-anchor/raw/si_mock_2_0_2027.html",
              "raw_sha256":"1609c93189383f85160a46522c0dccc462bacdb141a2f5109db13ef077797d47",
              "b15_parsed_path":"research/draft-capital-outlook-v1/archive/2027/2026-anchor/parsed/si_mock_2_0_2027.json",
              "b15_parsed_sha256":"b1df6a89c3723c4786143f848b12f5b2e87ccdf287ee04c06f17870af4afbbea"
            }
          ]

          protocol={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b22_2027_source_comparability_preregistration",
            "decision":"PREREGISTER_2027_SOURCE_COMPARABILITY_AUTHORIZE_B23_FEASIBILITY_ONLY_NO_SCORING",
            "authority_source":{
              "b21_decision":"PASS_LAYER_D_HISTORICAL_CALIBRATION_AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY",
              "b21_joint_pass":True,
              "b21_result_sha256":"97e9b0615e27e0bfdfccbab8b2c58e98bc214523b5e4ad04252d881c5e291dbf",
              "b20_protocol_sha256":"aaf76bedd505295286de31a26260928288ee3ca2dbea48df6a22dd770f8b6fa7"
            },
            "historical_predictor_contract":{
              "source_form":"single mock-draft selection-order snapshot",
              "top_slot_cutoff":60,
              "minimum_unique_slots_through_60":58,
              "must_reach_slot_60":True,
              "position_set":["QB","RB","FB","WR","TE"],
              "position_map":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
              "selection_order_not_rank_order":True,
              "phantom_or_inferred_pick_insertion_allowed":False,
              "reference":"B17/B17A V3/B17 V2 historical predictor lineage"
            },
            "candidate_pool":{
              "frozen_from_b15_captured_mock_category_only":True,
              "candidate_count":3,
              "candidates":candidates,
              "big_boards_excluded_from_primary_2027_predictor":True,
              "big_board_exclusion_reason":"Historical x was built from mock-draft selection order. Big-board rank is a different construct and cannot replace selection order after B21 passed.",
              "community_dynasty_sources_excluded":True,
              "community_exclusion_reason":"Historical predictor was NFL mock-draft selection order, not dynasty rookie rank order.",
              "new_network_retrieval_allowed":False,
              "post_b15_source_addition_allowed":False
            },
            "b23_parser_and_feasibility_rules":{
              "raw_archived_bytes_are_authoritative":True,
              "b15_visible_text_parser_output_is_not_sufficient_by_itself":True,
              "parser_may_extract_only_explicit_source-presented_pick_number_player_position_fields":True,
              "parser_may_use_embedded_structured_data_present_in_frozen_raw_bytes":True,
              "parser_may_not_use_external_player_rankings_or_later_web_content":True,
              "parser_may_not_infer_missing_pick_numbers":True,
              "parser_may_not_fill_missing slots":True,
              "parser_may_not_promote_big_board_rank_to_mock_pick":True,
              "fantasy_position_normalization":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
              "non_fantasy_positions_retained_for_slot_count_but_weight_zero":True,
              "source_feasible_if":"at least 58 unique explicit overall pick slots among 1..60 AND explicit slot 60 is present",
              "exact_top60_preferred":True,
              "duplicate_pick_number_is_fatal_for_that_source":True,
              "ambiguous_player_position_is_fatal_for_affected_fantasy row":True,
              "2027_capital_scalar_may_be_computed":False,
              "2027_shadow_multiplier_may_be_computed":False
            },
            "deterministic_source_selection_if_multiple_feasible":{
              "rule_order":[
                "prefer source_kind=single_mock_draft over mock_consensus because historical predictor used a single mock-draft source family",
                "then smaller absolute publication-date distance from September 30",
                "then lexicographically smaller source_id"
              ],
              "selection_may_not_use_number_of_fantasy_players":True,
              "selection_may_not_use_resulting_2027_capital":True,
              "selection_may_not_use_resulting_shadow_multiplier":True,
              "selection_may_not_use_subjective_prospect_quality":True
            },
            "b23_decisions":{
              "one_or_more_feasible":"SELECT_DETERMINISTIC_2027_COMPARABLE_SOURCE_AUTHORIZE_SEPARATE_B24_ONE_SHOT_SHADOW_SCORING_PREREGISTRATION_ONLY",
              "none_feasible":"STOP_2027_DRAFT_CAPITAL_OUTLOOK_SOURCE_PATH_KEEP_NEUTRAL_1_00",
              "invalid":"B23_INVALID_INTEGRITY_HASH_PROTOCOL_OR_PARSER_FAILURE"
            },
            "downstream_boundary":{
              "b23_may_score_2027":False,
              "b23_may_compute_2027_capital_scalar":False,
              "b23_may_authorize_production":False,
              "b23_pass_may_authorize_only":"separate B24 preregistration for one research-only 2027 shadow score using the selected exact source",
              "maximum_future_shadow_multiplier_deviation":0.03,
              "production_change_authorized":False
            },
            "scientific_firewall":{
              "2027_source_comparability_metrics_computed_in_b22":False,
              "2027_capital_scalar_computed_in_b22":False,
              "2027_shadow_multiplier_computed_in_b22":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "production_file_modified":False,
              "gate_or_source_selection_rule_tuning_after_b23_allowed":False
            }
          }

          p=O/"b22_2027_source_comparability_preregistration.json"
          p.write_text(json.dumps(protocol,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b22_2027_source_comparability_preregistration.sha256").write_text(h+"  b22_2027_source_comparability_preregistration.json\n")
          print(json.dumps({"decision":protocol["decision"],"protocol_sha256":h},indent=2))
          PY

      - name: Audit frozen B22 protocol invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          O=Path("research/draft-capital-outlook-v1/b22")
          p=O/"b22_2027_source_comparability_preregistration.json"
          P=json.loads(p.read_text())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          recorded=(O/"b22_2027_source_comparability_preregistration.sha256").read_text().split()[0]
          assert got==recorded
          assert P["decision"]=="PREREGISTER_2027_SOURCE_COMPARABILITY_AUTHORIZE_B23_FEASIBILITY_ONLY_NO_SCORING"
          H=P["historical_predictor_contract"]
          assert H["top_slot_cutoff"]==60
          assert H["minimum_unique_slots_through_60"]==58
          assert H["must_reach_slot_60"] is True
          assert H["selection_order_not_rank_order"] is True
          C=P["candidate_pool"]
          assert C["candidate_count"]==3
          assert C["big_boards_excluded_from_primary_2027_predictor"] is True
          assert C["new_network_retrieval_allowed"] is False
          assert C["post_b15_source_addition_allowed"] is False
          ids=[x["source_id"] for x in C["candidates"]]
          assert ids==["ultimate_mock_consensus_2027","cbs_mock_hub_2027","si_mock_2_0_2027"]
          R=P["b23_parser_and_feasibility_rules"]
          assert R["2027_capital_scalar_may_be_computed"] is False
          assert R["2027_shadow_multiplier_may_be_computed"] is False
          assert R["parser_may_not_infer_missing_pick_numbers"] is True
          assert R["parser_may_not_promote_big_board_rank_to_mock_pick"] is True
          S=P["deterministic_source_selection_if_multiple_feasible"]
          assert S["selection_may_not_use_resulting_2027_capital"] is True
          assert S["selection_may_not_use_resulting_shadow_multiplier"] is True
          F=P["scientific_firewall"]
          assert F["2027_class_scored"] is False
          assert F["2027_capital_scalar_computed_in_b22"] is False
          assert F["2027_shadow_multiplier_computed_in_b22"] is False
          assert F["production_change_authorized"] is False
          assert F["gate_or_source_selection_rule_tuning_after_b23_allowed"] is False
          print("PASS: B22 source/comparability rules frozen before B23 feasibility execution.")
          PY

      - name: Build B22 manifest and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          O=Path("research/draft-capital-outlook-v1/b22")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          p=O/"b22_2027_source_comparability_preregistration.json"
          s=O/"b22_2027_source_comparability_preregistration.sha256"
          manifest={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b22_manifest",
            "decision":"PREREGISTER_2027_SOURCE_COMPARABILITY_AUTHORIZE_B23_FEASIBILITY_ONLY_NO_SCORING",
            "b23_source_comparability_feasibility_authorized":True,
            "b23_may_score_2027":False,
            "2027_capital_scalar_computed":False,
            "2027_shadow_multiplier_computed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "protocol_sha256":sha(p),
            "output_hashes":{
              p.name:sha(p),
              s.name:sha(s)
            }
          }
          report=(
            "# Draft Capital Outlook V1 — B22 2027 Source Comparability Preregistration\n\n"
            "Decision: **PREREGISTER_2027_SOURCE_COMPARABILITY_AUTHORIZE_B23_FEASIBILITY_ONLY_NO_SCORING**\n\n"
            "- Candidate pool frozen to 3 B15-captured mock/mock-consensus sources.\n"
            "- Big-board rank cannot substitute for historical mock-draft selection order.\n"
            "- B23 must require >=58 unique explicit slots through 60 and explicit slot 60.\n"
            "- No new network retrieval or post-B15 source additions.\n"
            "- If multiple sources pass, deterministic structural/date/source-id tie-breaks are frozen.\n"
            "- 2027 capital scalar computed: **NO**\n"
            "- 2027 shadow multiplier computed: **NO**\n"
            "- 2027 class scored: **NO**\n"
            "- Production change authorized: **NO**\n"
          )
          rp=O/"b22_report.md"
          rp.write_text(report)
          manifest["output_hashes"][rp.name]=sha(rp)
          mp=O/"b22_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

      - name: Verify research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed="research/draft-capital-outlook-v1/b22/"
          paths=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True).splitlines()
          bad=[]
          for line in paths:
              p=line[3:]
              if " -> " in p: p=p.split(" -> ",1)[1]
              if not p.startswith(allowed): bad.append(p)
          assert not bad,bad
          print("PASS: only B22 research artifacts changed.")
          PY
          git diff --check

      - name: Run repository regression after B22 without losing research outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b22-preserve
          cp -a research/draft-capital-outlook-v1/b22 /tmp/b22-preserve
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          cp -a /tmp/b22-preserve research/draft-capital-outlook-v1/b22
          test -d research/draft-capital-outlook-v1/b22

      - name: Final scientific firewall and reproducibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          O=Path("research/draft-capital-outlook-v1/b22")
          p=O/"b22_2027_source_comparability_preregistration.json"
          m=O/"b22_manifest.json"
          P=json.loads(p.read_text()); M=json.loads(m.read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==M["protocol_sha256"]
          assert M["b23_source_comparability_feasibility_authorized"] is True
          assert M["b23_may_score_2027"] is False
          assert M["2027_capital_scalar_computed"] is False
          assert M["2027_shadow_multiplier_computed"] is False
          assert M["2027_class_scored"] is False
          assert M["production_change_authorized"] is False
          assert P["scientific_firewall"]["gate_or_source_selection_rule_tuning_after_b23_allowed"] is False
          print("PASS: B22 is preregistration-only; no 2027 score or production authority exists.")
          PY
          git diff --check

      - name: Commit B22 preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo "main moved during B22; refusing stale commit"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v1/b22
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          assert files and all(x.startswith("research/draft-capital-outlook-v1/b22/") for x in files),files
          PY
          git commit -m "B22: preregister 2027 source comparability"
          git push origin HEAD:main
