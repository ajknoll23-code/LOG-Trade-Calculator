    - name: Run full repository regression before freeze
      shell: bash
      run: |
        set -euo pipefail
        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
        restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
        trap restore_tu EXIT
        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/repo_regression_checks.py
        restore_tu
        trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"
        echo "PASS: full repository regression suite before residual freeze."
    - name: Commit residual router contract before execution
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add \
          research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.json \
          research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.md \
          research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_manifest_v7.json

        git diff --cached --quiet && { echo "ERROR: no residual recovery contract staged"; exit 1; }
        git commit -m "Freeze Draft Pick FV V7 residual router recovery"

        git fetch origin main

        # Unrelated main movement is allowed, but every protected Draft Pick input
        # must still be byte-identical to the base used to freeze this recovery.
        protected=(
          research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json
          research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json
          research/draft-pick-fv-v7/r1_r6_phase2_transport_recovery_v7.json
          research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.json
          research/draft-pick-fv-v7/r1_r6_phase2_accelerated_probe_resume_v7.json
          research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json
          research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_manifest_v7.json
        )
        for p in "${protected[@]}"; do
          test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
            echo "ERROR: protected Draft Pick input moved while freezing residual recovery: $p"
            exit 1
          }
        done

        git rebase origin/main

        # Re-run the entire repo regression after rebasing onto any unrelated main changes.
        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
        restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
        trap restore_tu EXIT
        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/repo_regression_checks.py
        restore_tu
        trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"

        git push origin HEAD:main
        echo "PASS: residual-router recovery contract committed before execution."
    - name: Resolve exact residual recovery study SHA
      id: resolve
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Upload patched residual-router engine
