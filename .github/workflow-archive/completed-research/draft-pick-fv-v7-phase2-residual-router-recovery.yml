  recover:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
    - name: Check out exact residual-recovery study base
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install transport dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download patched residual-router engine
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-engine
        path: ${{ runner.temp }}/engine
    - name: Download exact frozen discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Verify patched engine and authorized batch
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
      run: |
        set -euo pipefail
        test "$(sha256sum "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = "acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6"
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path

        y=int(os.environ["YEAR"]); b=int(os.environ["BATCH"])
        root=Path(os.environ["RUNNER_TEMP"])
        contract=json.loads(Path("research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.json").read_text())
        assert b in contract["residual_batches_by_year"][str(y)]
        assert contract["new_league_search_allowed"] is False
        assert contract["source_substitution_allowed"] is False

        d=json.loads((root/"discoveries"/f"discovery_{y}.json").read_text())
        ids=list(d["candidate_ids"])
        n=math.ceil(len(ids)/25)
        assert 0<=b<n
        exp=ids[b*25:min(len(ids),(b+1)*25)]
        assert exp
        assert hashlib.sha256("\n".join(ids).encode()).hexdigest()==d["candidate_ids_sha256"]
        print(f"PASS: exact frozen residual batch authorized {y}/{b}; candidates={len(exp)}")

        PY
    - name: Probe one exact residual R25 batch
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
        SLOT: ${{ matrix.slot }}
        MFL_TRANSPORT_DIAGNOSTIC_PATH: ${{ runner.temp }}/diag/transport.jsonl
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/probe" "${RUNNER_TEMP}/diag"
        sleep "$(( SLOT * 10 ))"
        PAD="$(printf '%03d' "$BATCH")"

        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" \
          --probe-year "$YEAR" \
          --batch-index "$BATCH" \
          --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$YEAR.json" \
          --dp "${RUNNER_TEMP}/engine/db_playerids.csv" \
          --nflverse "${RUNNER_TEMP}/engine/nflverse_players.csv" \
          --asset-manifest "${RUNNER_TEMP}/engine/r1_r6_identity_asset_manifest_v7.json" \
          --out "${RUNNER_TEMP}/probe/batch_$PAD.json"
    - name: Validate recovered residual checkpoint
      if: success()
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path
        y=int(os.environ["YEAR"]); b=int(os.environ["BATCH"])
        root=Path(os.environ["RUNNER_TEMP"])
        frozen=json.loads((root/"discoveries"/f"discovery_{y}.json").read_text())
        ids=list(frozen["candidate_ids"])
        n=math.ceil(len(ids)/25)
        p=root/"probe"/f"batch_{b:03d}.json"
        d=json.loads(p.read_text())
        exp=ids[b*25:min(len(ids),(b+1)*25)]
        assert d["draft_year"]==y
        assert d["batch_index"]==b
        assert d["batch_count"]==n
        assert d["batch_size"]==25
        assert d["candidate_ids"]==exp
        assert hashlib.sha256("\n".join(exp).encode()).hexdigest()==d["candidate_ids_sha256"]
        assert d["historical_source_search_performed"] is False
        for k in (
            "historical_player_outcomes_read","holdout_2024_outcomes_read",
            "candidate_fit_performed","candidate_scores_computed",
            "candidate_selection_performed","production_change_authorized"
        ):
            assert d[k] is False,(k,d.get(k))
        print(f"PASS: residual checkpoint validated {y}/{b}")

        PY
    - name: Upload isolated residual checkpoint
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-residual-router-${{ matrix.year }}-${{ matrix.batch }}
        path: ${{ runner.temp }}/probe/batch_*.json
        if-no-files-found: error
        retention-days: 30
    - name: Upload residual transport diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-residual-router-diag-${{ matrix.year }}-${{ matrix.batch }}
        path: ${{ runner.temp }}/diag/transport.jsonl
        if-no-files-found: warn
        retention-days: 30
  audit_residual:
    needs:
    - prepare
    - recover
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      complete: ${{ steps.audit.outputs.complete }}
    steps:
    - name: Check out exact residual-recovery study base
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Download exact frozen discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Download any successful residual checkpoints
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/residual-current"
        gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --pattern 'v7-p2-residual-router-20*' \
          -D "${RUNNER_TEMP}/residual-current" \
          || echo "INFO: no residual checkpoint artifacts were available."
    - name: Audit exact residual completion
      id: audit
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os
        from pathlib import Path

        expected={2018: [0, 3, 5, 13, 24, 31, 33, 35, 36, 39, 41], 2019: [0, 15, 24, 25, 29, 37], 2020: [12, 34, 39], 2021: [28, 34], 2022: [], 2023: []}
        root=Path(os.environ["RUNNER_TEMP"])
        rec=root/"residual-current"
        disc=root/"discoveries"
        out=root/"residual-audit"
        out.mkdir(parents=True,exist_ok=True)

        found={y:{} for y in expected}
        if rec.exists():
            for p in sorted(rec.rglob("batch_*.json")):
                d=json.loads(p.read_text())
                y=int(d["draft_year"]); b=int(d["batch_index"])
                assert b in expected[y],(y,b)
                frozen=json.loads((disc/f"discovery_{y}.json").read_text())
                ids=list(frozen["candidate_ids"])
                exp=ids[b*25:min(len(ids),(b+1)*25)]
                assert d["candidate_ids"]==exp
                h=hashlib.sha256(p.read_bytes()).hexdigest()
                if b in found[y]: assert found[y][b]==h,(y,b)
                found[y][b]=h

        missing={y:[b for b in expected[y] if b not in found[y]] for y in expected}
        recovered_n=sum(len(x) for x in found.values())
        missing_n=sum(len(x) for x in missing.values())
        complete=missing_n==0
        obj={
          "schema_version":1,
          "study_id":"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity",
          "stage":"phase2_residual_router_recovery_audit",
          "expected_residual_batch_n":22,
          "recovered_valid_artifact_n":recovered_n,
          "missing_residual_batch_n":missing_n,
          "missing_batches_by_year":{str(y):missing[y] for y in sorted(missing)},
          "complete":complete,
          "historical_player_outcomes_read":False,
          "holdout_2024_outcomes_read":False,
          "candidate_fit_performed":False,
          "production_change_authorized":False
        }
        (out/"residual_router_recovery_audit.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
        print(json.dumps(obj,indent=2))
        with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("complete="+("true" if complete else "false")+"\n")

        PY
    - name: Upload residual recovery audit
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-residual-router-audit
        path: ${{ runner.temp }}/residual-audit/residual_router_recovery_audit.json
        if-no-files-found: error
        retention-days: 30
  assemble_six_years:
    needs:
    - prepare
    - audit_residual
    if: ${{ needs.audit_residual.outputs.complete == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out exact residual-recovery study base
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install engine dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download patched engine
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-engine
        path: ${{ runner.temp }}/engine
    - name: Download exact frozen discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Download prior 199, targeted 30, and current 22 checkpoints
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p \
          "${RUNNER_TEMP}/prior-all/A" \
          "${RUNNER_TEMP}/prior-all/B" \
          "${RUNNER_TEMP}/prior-all/C" \
          "${RUNNER_TEMP}/prior-all/slow" \
          "${RUNNER_TEMP}/targeted-success" \
          "${RUNNER_TEMP}/residual-current"

        gh run download 36060826299 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-A-probe-*' -D "${RUNNER_TEMP}/prior-all/A"
        gh run download 36061005645 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-B-probe-*' -D "${RUNNER_TEMP}/prior-all/B"
        gh run download 36060855053 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-C-probe-*' -D "${RUNNER_TEMP}/prior-all/C"

        for N in 1 2 4; do
          mkdir -p "${RUNNER_TEMP}/prior-all/slow/$N"
          gh run download 36052205794 --repo "$GITHUB_REPOSITORY" \
            -n "v7-p2-r25-probe-2018-$N" \
            -D "${RUNNER_TEMP}/prior-all/slow/$N"
        done

        gh run download 36120014342 --repo "$GITHUB_REPOSITORY" \
          --pattern 'v7-p2-targeted-recovery-20*' \
          -D "${RUNNER_TEMP}/targeted-success"

        gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --pattern 'v7-p2-residual-router-20*' \
          -D "${RUNNER_TEMP}/residual-current"
    - name: Prove 251 of 251 exact-once checkpoint coverage
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,math,os,shutil
        from pathlib import Path

        root=Path(os.environ["RUNNER_TEMP"])
        discroot=root/"discoveries"
        sources=[
            root/"prior-all",
            root/"targeted-success",
            root/"residual-current",
        ]
        out=root/"assembled"
        out.mkdir(parents=True,exist_ok=True)
        expected_counts={2018:43,2019:41,2020:41,2021:42,2022:42,2023:42}

        grand_batch_n=0
        grand_candidate_n=0
        for y,n in expected_counts.items():
            disc=json.loads((discroot/f"discovery_{y}.json").read_text())
            ids=list(disc["candidate_ids"])
            assert math.ceil(len(ids)/25)==n
            seen={}
            for base in sources:
                if not base.exists(): continue
                for p in base.rglob("batch_*.json"):
                    d=json.loads(p.read_text())
                    yy=int(d["draft_year"]); b=int(d["batch_index"])
                    if yy!=y: continue
                    exp=ids[b*25:min(len(ids),(b+1)*25)]
                    assert d["candidate_ids"]==exp
                    assert d["batch_size"]==25
                    assert hashlib.sha256("\n".join(exp).encode()).hexdigest()==d["candidate_ids_sha256"]
                    for k in (
                        "historical_player_outcomes_read","holdout_2024_outcomes_read",
                        "candidate_fit_performed","candidate_scores_computed",
                        "candidate_selection_performed","production_change_authorized"
                    ):
                        assert d[k] is False,(p,k)
                    h=hashlib.sha256(p.read_bytes()).hexdigest()
                    if b in seen:
                        assert seen[b][0]==h,(y,b,"non-identical duplicate")
                    else:
                        seen[b]=(h,p)

            missing=sorted(set(range(n))-set(seen))
            extra=sorted(set(seen)-set(range(n)))
            assert not missing and not extra,(y,missing,extra)

            yd=out/str(y); yd.mkdir(exist_ok=True)
            flat=[]
            for b in range(n):
                p=seen[b][1]
                shutil.copy2(p,yd/f"batch_{b:03d}.json")
                flat.extend(json.loads(p.read_text())["candidate_ids"])
            assert flat==ids
            assert len(flat)==len(set(flat))
            grand_batch_n += n
            grand_candidate_n += len(ids)
            print(f"PASS: {y} exact-once {len(ids)} candidates / {n} R25 batches")

        assert grand_batch_n==251
        assert grand_candidate_n==6203
        print("PASS: exact 251/251 R25 checkpoint coverage and 6203/6203 frozen candidate order.")

        PY
    - name: Aggregate six historical years
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/years"
        for Y in 2018 2019 2020 2021 2022 2023; do
          python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" \
            --aggregate-year "$Y" \
            --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json" \
            --batch-dir "${RUNNER_TEMP}/assembled/$Y" \
            --out "${RUNNER_TEMP}/years/year_$Y.json"
        done
        mkdir -p "${RUNNER_TEMP}/years/engine"
        cp "${RUNNER_TEMP}/engine"/* "${RUNNER_TEMP}/years/engine/"
    - name: Validate six-year assembly and write manifest
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os
        from datetime import datetime,timezone
        from pathlib import Path

        root=Path(os.environ["RUNNER_TEMP"])
        years=root/"years"
        eng=root/"engine"
        sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()

        assert sha(eng/"build_r1_r6_source_identity_v7.py")=="acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6"
        for y in range(2018,2024):
            d=json.loads((years/f"year_{y}.json").read_text())
            assert d["draft_year"]==y
            assert d["discovery"]["all_bounded_union_candidates_probed"] is True
            assert d["discovery"]["early_stopping_used"] is False
            assert d["discovery"]["search_errors"]=={}
            for k in (
                "historical_player_outcomes_read","holdout_2024_outcomes_read",
                "candidate_fit_performed","candidate_scores_computed",
                "candidate_selection_performed","production_change_authorized"
            ):
                assert d[k] is False

        contract=Path("research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.json")
        man={
          "schema_version":1,
          "study_id":"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity",
          "stage":"phase2_residual_router_six_year_assembly",
          "generated_at_utc":datetime.now(timezone.utc).isoformat(),
          "candidate_universe_total_n":6203,
          "r25_batch_total_n":251,
          "exact_once_coverage":True,
          "original_engine_sha256":"264cf774aa064521921fdab827dfa3b11c778e9612049a20177491faca2274d0",
          "residual_router_engine_sha256":"acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6",
          "residual_router_contract_sha256":sha(contract),
          "year_output_sha256":{str(y):sha(years/f"year_{y}.json") for y in range(2018,2024)},
          "identity_asset_manifest_sha256":sha(eng/"r1_r6_identity_asset_manifest_v7.json"),
          "historical_player_outcomes_read":False,
          "holdout_2024_outcomes_read":False,
          "candidate_fit_performed":False,
          "production_change_authorized":False
        }
        (years/"residual_router_six_years_manifest.json").write_text(json.dumps(man,indent=2,sort_keys=True)+"\\n")
        print(json.dumps(man,indent=2))

        PY
    - name: Upload complete six-year residual recovery assembly
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-residual-router-six-years
        path: ${{ runner.temp }}/years/
        if-no-files-found: error
        retention-days: 30
