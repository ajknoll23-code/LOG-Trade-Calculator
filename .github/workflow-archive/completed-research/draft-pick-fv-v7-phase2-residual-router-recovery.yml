# PREFLIGHTED: DRAFT_PICK_FV_V7_PHASE2_RESIDUAL_ROUTER_RECOVERY_V1
name: Draft Pick FV V7 - Phase 2 Residual Router Recovery
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: draft-pick-fv-v7-phase2-residual-router-recovery
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
      study_sha: ${{ steps.resolve.outputs.sha }}
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture residual recovery base
      id: base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install transport and regression dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen Draft Pick V7 lineage
      shell: bash
      run: |
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"

        declare -A EXPECTED=(
          ["research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json"]="42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"
          ["research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json"]="80a28c10ca3fb416631ec7352a3dc6d466f5c66d"
          ["research/draft-pick-fv-v7/r1_r6_phase2_transport_recovery_v7.json"]="4da07647e4e6bc8e1e662cac76be366600d6f0d2"
          ["research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.json"]="0b85dde3cc086bee0540aed6e1b15aee35349e5e"
          ["research/draft-pick-fv-v7/r1_r6_phase2_accelerated_probe_resume_v7.json"]="a51043e009c7d10c37f13ee02e11d63504480213"
          ["research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json"]="1d5e432316e257af0f201cd47aec99a7fb934655"
          ["research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_manifest_v7.json"]="d6073beea76f9a2d979f59e7910742468faa37b2"
        )

        for p in "${!EXPECTED[@]}"; do
          actual="$(git hash-object "$p")"
          test "$actual" = "${EXPECTED[$p]}" || {
            echo "ERROR: protected Draft Pick V7 lineage drift: $p expected=${EXPECTED[$p]} actual=$actual"
            exit 1
          }
        done

        for p in \
          research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json \
          research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json \
          research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl \
          research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl
        do
          test ! -e "$p" || { echo "ERROR: final Phase 2 output already exists: $p"; exit 1; }
        done

        for p in \
          research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.json \
          research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.md \
          research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_manifest_v7.json
        do
          test ! -e "$p" || { echo "ERROR: residual-router freeze already exists: $p"; exit 1; }
        done

        echo "PASS: protected Draft Pick V7 scientific/source lineage is unchanged."
    - name: Download exact targeted-recovery engine
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-targeted-recovery-engine
        path: ${{ runner.temp }}/engine
        repository: ${{ github.repository }}
        run-id: '36120014342'
        github-token: ${{ github.token }}
    - name: Download exact frozen discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-targeted-recovery-discoveries
        path: ${{ runner.temp }}/discoveries
        repository: ${{ github.repository }}
        run-id: '36120014342'
        github-token: ${{ github.token }}
    - name: Verify exact frozen engine and identity bundle
      shell: bash
      run: |
        set -euo pipefail
        sha() { sha256sum "$1" | awk '{print $1}'; }

        test "$(sha "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py")" = "264cf774aa064521921fdab827dfa3b11c778e9612049a20177491faca2274d0"
        test "$(sha "${RUNNER_TEMP}/engine/db_playerids.csv")" = "0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
        test "$(sha "${RUNNER_TEMP}/engine/nflverse_players.csv")" = "4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
        test "$(sha "${RUNNER_TEMP}/engine/r1_r6_identity_asset_manifest_v7.json")" = "e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e"

        python3 -m py_compile "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py"
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --selftest
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --guard
        echo "PASS: exact targeted-recovery engine and identity assets verified."
    - name: Download 30 successful targeted checkpoints and exact audit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/targeted-success" "${RUNNER_TEMP}/targeted-audit"
        gh run download 36120014342 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-targeted-recovery-20*' -D "${RUNNER_TEMP}/targeted-success"
        gh run download 36120014342 --repo "$GITHUB_REPOSITORY" -n "v7-p2-targeted-recovery-audit" -D "${RUNNER_TEMP}/targeted-audit"
    - name: Derive exact 30-success 22-residual state
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path

        root=Path(os.environ["RUNNER_TEMP"])
        disc=root/"discoveries"
        success=root/"targeted-success"
        auditroot=root/"targeted-audit"
        out=root/"residual-proof"
        out.mkdir(parents=True,exist_ok=True)

        expected_residual={2018: [0, 3, 5, 13, 24, 31, 33, 35, 36, 39, 41], 2019: [0, 15, 24, 25, 29, 37], 2020: [12, 34, 39], 2021: [28, 34], 2022: [], 2023: []}
        expected_target={
          2018:[0,3,5,6,7,13,14,15,16,17,24,25,26,27,31,32,33,34,35,36,37,39,40,41,42],
          2019:[0,1,2,3,4,15,16,17,18,19,24,25,26,27,28,29,37,38,39],
          2020:[12,13,14,34,39],
          2021:[28,29,34],
          2022:[],2023:[]
        }
        assert sum(map(len,expected_target.values()))==52
        assert sum(map(len,expected_residual.values()))==22

        audits=list(auditroot.rglob("targeted_recovery_audit.json"))
        assert len(audits)==1,audits
        audit=json.loads(audits[0].read_text())
        assert audit["expected_recovery_batch_n"]==52
        assert audit["recovered_valid_artifact_n"]==30
        assert audit["missing_recovery_batch_n"]==22
        assert audit["complete"] is False
        assert audit["missing_batches_by_year"]=={str(y):expected_residual[y] for y in sorted(expected_residual)}

        contract=json.loads(Path("research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json").read_text())
        assert contract["targeted_recovery_batch_n"]==52
        assert contract["targeted_recovery_batches_by_year"]=={str(y):expected_target[y] for y in sorted(expected_target)}

        discovery_sha={
          2018:"f23f32862b25c02a6e61a9613d3cf5eb5c603f6d9173a2937064d423542414d3",
          2019:"35f4299f8da6a4ba46d6167b820d411aa112741141f419e9f97fe840aea3092c",
          2020:"2f86ce2fb4599b2096de9418afbab7c7ea95a7aa07d0aa1551c7ca3a2b8e3f2c",
          2021:"7bbe19aea0edca5939cbfb03b8e5c016c5f9fd302b723e04a0d5e1dbd30c9df4",
          2022:"ce483998393fd9e2c602bf2797401b68dc0eef220fe4a8335e808f057457b898",
          2023:"2df0827bf2266c613d7784c6ed97ad225a0777fec668e265b9110a8ac2901cd4",
        }
        frozen={}
        for y in sorted(discovery_sha):
            p=disc/f"discovery_{y}.json"
            assert hashlib.sha256(p.read_bytes()).hexdigest()==discovery_sha[y]
            d=json.loads(p.read_text())
            frozen[y]=list(d["candidate_ids"])

        found={y:{} for y in expected_target}
        for p in sorted(success.rglob("batch_*.json")):
            d=json.loads(p.read_text())
            y=int(d["draft_year"]); b=int(d["batch_index"])
            assert b in expected_target[y],(y,b)
            assert b not in expected_residual[y],("residual unexpectedly has successful artifact",y,b)
            exp=frozen[y][b*25:min(len(frozen[y]),(b+1)*25)]
            assert d["candidate_ids"]==exp
            assert d["batch_size"]==25
            assert hashlib.sha256("\n".join(exp).encode()).hexdigest()==d["candidate_ids_sha256"]
            for k in ("historical_player_outcomes_read","holdout_2024_outcomes_read","candidate_fit_performed","candidate_scores_computed","candidate_selection_performed","production_change_authorized"):
                assert d[k] is False,(p,k)
            h=hashlib.sha256(p.read_bytes()).hexdigest()
            if b in found[y]: assert found[y][b]==h,(y,b)
            found[y][b]=h

        expected_success={y:sorted(set(expected_target[y])-set(expected_residual[y])) for y in expected_target}
        got={y:sorted(found[y]) for y in found}
        assert got==expected_success,(got,expected_success)
        assert sum(len(x) for x in found.values())==30

        rows=[f"{y}/{b}:{found[y][b]}" for y in sorted(found) for b in sorted(found[y])]
        fingerprint=hashlib.sha256("\n".join(rows).encode()).hexdigest()
        obj={
          "schema_version":1,
          "study_id":"draft-pick-fv-v7-r1-r6-full-scale-tail-continuity",
          "stage":"phase2_residual_router_preflight",
          "targeted_run_id":36120014342,
          "targeted_batch_n":52,
          "validated_targeted_success_n":30,
          "residual_batch_n":22,
          "residual_batches_by_year":{str(y):expected_residual[y] for y in sorted(expected_residual)},
          "validated_targeted_success_fingerprint_sha256":fingerprint,
          "historical_player_outcomes_read":False,
          "holdout_2024_outcomes_read":False,
          "candidate_fit_performed":False,
          "production_change_authorized":False,
        }
        (out/"residual_preflight.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
        print(json.dumps(obj,indent=2))

        PY
    - name: Patch transport only for residual router recovery
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import hashlib

        p=Path("${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py")
        raw=p.read_bytes()
        assert hashlib.sha256(raw).hexdigest()=="264cf774aa064521921fdab827dfa3b11c778e9612049a20177491faca2274d0"
        text=raw.decode("utf-8")

        start=text.index("def _request_once(session,url):")
        end=text.index("# All inherited V6 helper functions",start)
        old=text[start:end]
        assert "def mfl_get_json(" in old
        assert "allow_redirects=False" in old
        assert "MFL transport attempt" in old

        replacement="from urllib.parse import urlparse, urlunparse, parse_qsl\n\nMFL_ROUTE_ROUNDS=4\nMFL_ROUTE_WAITS=(30,60,120,180)\nMFL_CONNECT_TIMEOUT=10\nMFL_READ_TIMEOUT=45\nMFL_REDIRECT_CODES=(301,302,303,307,308)\n_MFL_SUCCESS_HOST_CACHE={}\n_MFL_TLS_FALLBACK_HOSTS=set()\n\ndef _diag(event, **payload):\n    import os\n    p=os.environ.get('MFL_TRANSPORT_DIAGNOSTIC_PATH')\n    if not p:\n        return\n    row={'event':event,'at_utc':now(),**payload}\n    Path(p).parent.mkdir(parents=True,exist_ok=True)\n    with Path(p).open('a',encoding='utf-8') as f:\n        f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\\n')\n\ndef _is_mfl_host(host):\n    h=str(host or '').lower().rstrip('.')\n    return h=='myfantasyleague.com' or h.endswith('.myfantasyleague.com')\n\ndef _same_export_identity(candidate, original):\n    a=urlparse(candidate); b=urlparse(original)\n    if not (_is_mfl_host(a.hostname) and _is_mfl_host(b.hostname)):\n        return False\n    if a.path != b.path:\n        return False\n    return sorted(parse_qsl(a.query,keep_blank_values=True)) == sorted(parse_qsl(b.query,keep_blank_values=True))\n\ndef _origin_variant(url,scheme,host):\n    p=urlparse(url)\n    return urlunparse((scheme,host,p.path,p.params,p.query,p.fragment))\n\ndef _logical_key(url):\n    p=urlparse(url)\n    q=dict(parse_qsl(p.query,keep_blank_values=True))\n    bits=[x for x in p.path.split('/') if x]\n    year=bits[0] if len(bits)>=2 and bits[0].isdigit() else ''\n    lid=str(q.get('L') or '').strip()\n    return (year,lid) if year and lid else None\n\ndef _route_add(routes, known, url, original):\n    try:\n        p=urlparse(url)\n    except Exception:\n        return False\n    if p.scheme not in ('http','https') or not _is_mfl_host(p.hostname):\n        return False\n    if not _same_export_identity(url,original):\n        return False\n    if url in known:\n        return False\n    known.add(url); routes.append(url); return True\n\ndef _router_probe_urls(original):\n    key=_logical_key(original)\n    if key is None:\n        return []\n    year,lid=key\n    return [\n        f'https://www.myfantasyleague.com/{year}/home/{lid}',\n        f'http://www.myfantasyleague.com/{year}/home/{lid}',\n    ]\n\ndef _request_no_redirect(session,url,verify=True):\n    _throttle()\n    return session.get(\n        url,\n        timeout=(MFL_CONNECT_TIMEOUT,MFL_READ_TIMEOUT),\n        allow_redirects=False,\n        verify=verify,\n        headers={'Accept':'application/json','Connection':'close'},\n    )\n\ndef _request_with_tls_fallback(session,url):\n    try:\n        return _request_no_redirect(session,url,verify=True), True\n    except requests.exceptions.SSLError as exc:\n        p=urlparse(url)\n        host=str(p.hostname or '').lower()\n        if p.scheme!='https' or host not in _MFL_TLS_FALLBACK_HOSTS:\n            raise\n        _diag('tls_verified_failed_on_trusted_redirect_host',url=url,error=f'{type(exc).__name__}: {exc}')\n        import urllib3\n        with urllib3.warnings.catch_warnings():\n            urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n            r=_request_no_redirect(session,url,verify=False)\n        _diag('tls_scoped_fallback_used',url=url,status_code=int(r.status_code))\n        return r, False\n\ndef _remember_verified_redirect_host(source_url, response_tls_verified, target_url):\n    if urlparse(source_url).scheme!='https' or not response_tls_verified:\n        return\n    host=str(urlparse(target_url).hostname or '').lower()\n    if _is_mfl_host(host):\n        _MFL_TLS_FALLBACK_HOSTS.add(host)\n\ndef _discover_router_hosts(session, original):\n    hosts=[]\n    for router_url in _router_probe_urls(original):\n        try:\n            r,verified=_request_with_tls_fallback(session,router_url)\n        except requests.RequestException as exc:\n            _diag('router_probe_error',url=router_url,error=f'{type(exc).__name__}: {exc}')\n            continue\n        if r.status_code in MFL_REDIRECT_CODES:\n            loc=r.headers.get('Location')\n            if not loc:\n                continue\n            nxt=urljoin(router_url,loc)\n            h=str(urlparse(nxt).hostname or '').lower()\n            if _is_mfl_host(h) and h not in hosts:\n                hosts.append(h)\n                _remember_verified_redirect_host(router_url,verified,nxt)\n                _diag('router_host_discovered',router_url=router_url,host=h)\n    return hosts\n\ndef mfl_get_json(session,url,retries=MFL_RETRIES,sleep_seconds=None):\n    original=url\n    routes=[]; known=set()\n    key=_logical_key(original)\n\n    if key in _MFL_SUCCESS_HOST_CACHE:\n        cached=_MFL_SUCCESS_HOST_CACHE[key]\n        for scheme in ('https','http'):\n            _route_add(routes,known,_origin_variant(original,scheme,cached),original)\n\n    _route_add(routes,known,original,original)\n    for scheme in ('https','http'):\n        _route_add(routes,known,_origin_variant(original,scheme,'www.myfantasyleague.com'),original)\n        _route_add(routes,known,_origin_variant(original,scheme,'api.myfantasyleague.com'),original)\n\n    last=None\n    router_discovered=False\n    rounds=min(int(retries),MFL_ROUTE_ROUNDS)\n\n    for round_idx in range(rounds):\n        idx=0\n        while idx < len(routes):\n            route=routes[idx]; idx+=1\n            try:\n                r,verified=_request_with_tls_fallback(session,route)\n                code=int(r.status_code)\n\n                if code in MFL_REDIRECT_CODES:\n                    loc=r.headers.get('Location')\n                    if not loc:\n                        last=GateError('redirect without Location')\n                        _diag('redirect_missing_location',url=route,status_code=code)\n                        continue\n                    nxt=urljoin(route,loc)\n                    if not _same_export_identity(nxt,original):\n                        last=GateError(f'redirect changed logical request: {nxt}')\n                        _diag('redirect_rejected_identity_change',url=route,next=nxt,status_code=code)\n                        continue\n                    _remember_verified_redirect_host(route,verified,nxt)\n                    _diag('redirect_discovered',url=route,next=nxt,status_code=code)\n                    _route_add(routes,known,nxt,original)\n                    h=str(urlparse(nxt).hostname or '').lower()\n                    if _is_mfl_host(h):\n                        for scheme in ('https','http'):\n                            _route_add(routes,known,_origin_variant(original,scheme,h),original)\n                    continue\n\n                if code==429:\n                    try:\n                        retry_after=float(r.headers.get('Retry-After') or 0)\n                    except ValueError:\n                        retry_after=0.0\n                    wait=max(\n                        retry_after,\n                        float(MFL_429_WAITS[min(round_idx,len(MFL_429_WAITS)-1)]),\n                    )\n                    last=GateError(f'HTTP 429; cooldown={wait:.0f}s')\n                    _diag('http_429',url=route,retry_after=retry_after,cooldown_seconds=wait)\n                    time.sleep(wait)\n                    continue\n\n                if 500 <= code < 600:\n                    last=GateError(f'HTTP {code}')\n                    _diag('http_5xx',url=route,status_code=code)\n                    continue\n\n                r.raise_for_status()\n                try:\n                    obj=r.json()\n                except ValueError as exc:\n                    last=exc\n                    _diag(\n                        'json_decode_error',\n                        url=route,\n                        status_code=code,\n                        content_type=str(r.headers.get('Content-Type') or ''),\n                        body_sha256=hashlib.sha256(r.content).hexdigest(),\n                    )\n                    continue\n                if not isinstance(obj,dict):\n                    last=GateError('non-object JSON')\n                    _diag('non_object_json',url=route,status_code=code,json_type=type(obj).__name__)\n                    continue\n\n                host=str(urlparse(route).hostname or '').lower()\n                if key is not None and _is_mfl_host(host):\n                    _MFL_SUCCESS_HOST_CACHE[key]=host\n                _diag(\n                    'success',url=route,status_code=code,tls_verified=verified,\n                    round=round_idx+1,cached_host=host,\n                )\n                return obj\n\n            except (requests.RequestException,GateError) as exc:\n                last=exc\n                _diag('route_error',url=route,round=round_idx+1,error=f'{type(exc).__name__}: {exc}')\n                continue\n\n        if not router_discovered:\n            router_discovered=True\n            try:\n                hosts=_discover_router_hosts(session,original)\n            except requests.RequestException as exc:\n                hosts=[]\n                last=exc\n            for h in hosts:\n                for scheme in ('https','http'):\n                    _route_add(routes,known,_origin_variant(original,scheme,h),original)\n\n        if round_idx+1 < rounds:\n            wait=float(MFL_ROUTE_WAITS[min(round_idx,len(MFL_ROUTE_WAITS)-1)])\n            _diag('round_sleep',round=round_idx+1,seconds=wait,route_count=len(routes))\n            print(\n                f'MFL residual router round {round_idx+1}/{rounds} failed across '\n                f'{len(routes)} same-request routes; sleeping {wait:.0f}s',\n                flush=True,\n            )\n            time.sleep(wait)\n\n    raise GateError(\n        f'residual router transport failure after {rounds} rounds / '\n        f'{len(routes)} same-request routes: {type(last).__name__}: {last}'\n    )\n\n"
        patched=text[:start]+replacement+text[end:]
        compile(patched,str(p),"exec")
        p.write_text(patched,encoding="utf-8")

        got=hashlib.sha256(p.read_bytes()).hexdigest()
        assert got=="acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6",(got,"acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6")
        print("PASS: exact frozen engine patched with residual-router transport only:",got)

        PY
        python3 -m py_compile "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py"
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --selftest
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --guard
    - name: Self-test same-request router constraints
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import importlib.util, os
        from pathlib import Path

        p=Path(os.environ["RUNNER_TEMP"])/"engine"/"build_r1_r6_source_identity_v7.py"
        spec=importlib.util.spec_from_file_location("v7residual",p)
        assert spec and spec.loader
        m=importlib.util.module_from_spec(spec)
        spec.loader.exec_module(m)

        u="https://api.myfantasyleague.com/2020/export?TYPE=draftResults&JSON=1&L=12345"
        assert m._same_export_identity("https://www72.myfantasyleague.com/2020/export?JSON=1&L=12345&TYPE=draftResults",u)
        assert m._same_export_identity("http://www.myfantasyleague.com/2020/export?TYPE=draftResults&JSON=1&L=12345",u)
        assert not m._same_export_identity("https://www72.myfantasyleague.com/2020/export?TYPE=draftResults&JSON=1&L=99999",u)
        assert not m._same_export_identity("https://www72.myfantasyleague.com/2021/export?TYPE=draftResults&JSON=1&L=12345",u)
        assert not m._same_export_identity("https://evil.example/2020/export?TYPE=draftResults&JSON=1&L=12345",u)
        assert m._router_probe_urls(u)==[
            "https://www.myfantasyleague.com/2020/home/12345",
            "http://www.myfantasyleague.com/2020/home/12345",
        ]
        routes=[]; known=set()
        assert m._route_add(routes,known,u,u)
