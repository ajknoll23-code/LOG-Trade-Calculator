name: A19 WR Structural Integrity Audit V1

# Read-only positional audit. No fitting. No production mutation.
"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  wr-structural-integrity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard A18 RB handoff and frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/rb-structural-integrity-audit-v1/manifest.json"]="7912846d096c0d14c5ad41fd7a35c7150443eb02"
            ["research/rb-structural-integrity-audit-v1/audit_result.json"]="15474cbcadcdb03bd10d8beb160a9f9e12d3c6e7"
            ["research/identity-v2/identity_v2_phase22_closure_freeze.json"]="3584e0e83f4a65a21730c745cd843c3011bfccc6"
            ["index.html"]="21af37c43ff6ede4b346a530ea65f0ca91d605bb"
            ["scripts/validation/snapshot_values.py"]="1efca4c35e910a95974c1bec0b06a106196618b3"
            ["research/production-v2/production_v2_phase1_audit.json"]="bdd4657ff45e0c64f1406f27c1ffe6ad2e597d31"
            ["research/legacy-prod-mult/prod_mult_lineage_audit.json"]="5be77a42610708464ea31508dd31daa0f4739b74"
            ["research/age-curve-v2/age_curve_v2_phase5_evaluation.json"]="e0de6d0c63f30f58bb8e889847b1f7c71c5eae44"
            ["research/position-weight-v2/position_weight_v2_phase5_evaluation.json"]="74b6b19147f49245001392d461f3a01b1c05d87a"
          )

          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: A19 frozen input drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          close=json.loads(
              Path("research/identity-v2/identity_v2_phase22_closure_freeze.json").read_text()
          )
          assert close["decision"]=="PASS_IDENTITY_V2_CLOSE_AND_FREEZE_WITH_JONAH_ELLISS_HOLD"
          assert close["identity_v2_closed"] is True
          assert close["deployable_identity_work_complete"] is True
          assert close["remaining_manual_review_fpids"]==["26157"]

          a18=json.loads(
              Path("research/rb-structural-integrity-audit-v1/audit_result.json").read_text()
          )
          assert a18["decision"]=="PASS_RB_STRUCTURAL_AUDIT_FREEZE_REVIEW_REQUIRED_BEFORE_ANY_MODEL_CHANGE"
          assert a18["production_changed"] is False
          assert a18["production_change_authorized"] is False
          assert all(a18["hard_integrity_gates"].values())

          print("PASS: A18 RB audit is frozen green and Identity V2 remains closed.")
          PY

      - name: Prove current production math and repository baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/snapshot_values.py --selftest
          python3 scripts/validation/repo_regression_checks.py

          sha256sum \
            index.html \
            scripts/validation/snapshot_values.py \
            research/production-v2/production_v2_phase1_audit.json \
            research/legacy-prod-mult/prod_mult_lineage_audit.json \
            research/age-curve-v2/age_curve_v2_phase5_evaluation.json \
            research/position-weight-v2/position_weight_v2_phase5_evaluation.json \
            research/rb-structural-integrity-audit-v1/manifest.json \
            > "${RUNNER_TEMP}/a19-immutable-production-and-inputs.sha256"

      - name: Freeze WR audit protocol before scoring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/wr-structural-integrity-audit-v1

          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/wr-structural-integrity-audit-v1")
          outputs=[
              D/"audit_protocol.json",
              D/"audit_result.json",
              D/"audit_report.md",
              D/"manifest.json",
          ]
          for p in outputs:
              assert not p.exists(),f"refusing to overwrite prior A19 output: {p}"

          protocol={
              "schema_version":1,
              "study_id":"wr-structural-integrity-audit-v1",
              "status":"FROZEN_BEFORE_AUDIT_SCORING",
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "scope":"All current PLAYER_DB wide receivers in the deployed calculator.",
              "research_only":True,
              "production_change_authorized":False,
              "production_mutation_allowed":False,
              "fitting_allowed":False,
              "named_player_targeting_allowed":False,
              "primary_questions":[
                  "Does the live WR board reproduce the exact deployed formula with no hidden WR-only mutation?",
                  "How much of within-WR spacing comes from production multiplier versus age multiplier?",
                  "Do the WR pre-peak production-coupled age mechanics or post-peak decline create sharp discontinuities?",
                  "Do elite production floors, no-history role rescue, production clamps, or the 0.62 age floor create structural cliffs?",
                  "Does the transparent Production V2 benchmark materially reorder WRs or mostly preserve current ordering?",
                  "Does legacy production-multiplier lineage show unusual WR drift relative to the overall player pool?",
                  "What do frozen Weeks 1-3 outcome diagnostics say about WR ordering while remaining descriptive only?",
                  "Does current WR position weight show cross-position tension in frozen pairwise diagnostics?"
              ],
              "hard_integrity_gates":{
                  "minimum_live_wr_count":100,
                  "all_live_wr_values_positive":True,
                  "unique_live_wr_keys":True,
                  "minimum_phase1_wr_candidate_coverage_share":0.90,
                  "minimum_phase1_current_vs_candidate_spearman":0.95,
                  "minimum_phase1_top_n_overlap_share":0.90,
                  "age_v2_must_not_authorize_deployment":True,
                  "position_weight_v2_must_not_authorize_deployment":True
              },
              "interpretation_rules":[
                  "Position weight is a common multiplicative factor within WR and cannot explain WR1-versus-WR24 spacing.",
                  "WR uses integer-age anchors in the deployed calculator; RB-only fractional-age and elite-youth mechanics must not be imported into WR analysis.",
                  "A structural audit may identify compression, discontinuities, lineage drift, or counterfactual sensitivity but cannot choose a new WR scale or age curve.",
                  "Weeks 1-3 realized outcomes are descriptive only and cannot authorize a model change.",
                  "Production V2 Phase 1 is an uncalibrated transparent benchmark, not a validated replacement.",
                  "No named WR may be manually raised or lowered from this audit.",
                  "Any follow-up model change requires a separately preregistered broad-cohort calibration/validation study."
              ],
              "decision_rule":{
                  "if_any_hard_integrity_gate_fails":
                      "STOP_WR_AUDIT_DATA_OR_LINEAGE_INTEGRITY_FAILURE",
                  "otherwise":
                      "PASS_WR_STRUCTURAL_AUDIT_FREEZE_REVIEW_REQUIRED_BEFORE_ANY_MODEL_CHANGE"
              }
          }
          (D/"audit_protocol.json").write_text(
              json.dumps(protocol,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A19 WR audit protocol frozen before scoring.")
          PY

      - name: Run comprehensive WR structural audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import math
          import statistics
          import subprocess
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path

          ROOT=Path(".")
          D=ROOT/"research/wr-structural-integrity-audit-v1"
          protocol=json.loads((D/"audit_protocol.json").read_text())

          def load_module(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot import {path}")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          sv=load_module(
              ROOT/"scripts/validation/snapshot_values.py",
              "a19_snapshot_values"
          )
          cfg=sv.load_from_html(ROOT/"index.html")
          live_values=sv.compute_all_values(cfg)

          phase1=json.loads(
              (ROOT/"research/production-v2/production_v2_phase1_audit.json").read_text()
          )
          legacy=json.loads(
              (ROOT/"research/legacy-prod-mult/prod_mult_lineage_audit.json").read_text()
          )
          age_eval=json.loads(
              (ROOT/"research/age-curve-v2/age_curve_v2_phase5_evaluation.json").read_text()
          )
          pw_eval=json.loads(
              (ROOT/"research/position-weight-v2/position_weight_v2_phase5_evaluation.json").read_text()
          )

          def js_round(x):
              return math.floor(float(x)+0.5)

          def qtile(values,q):
              vals=sorted(float(x) for x in values)
              if not vals:
                  return None
              if len(vals)==1:
                  return vals[0]
              pos=(len(vals)-1)*q
              lo=math.floor(pos)
              hi=math.ceil(pos)
              if lo==hi:
                  return vals[lo]
              t=pos-lo
              return vals[lo]*(1-t)+vals[hi]*t

          def summary(values):
              vals=[float(x) for x in values]
              if not vals:
                  return {"n":0}
              return {
                  "n":len(vals),
                  "min":min(vals),
                  "p10":qtile(vals,0.10),
                  "p25":qtile(vals,0.25),
                  "median":statistics.median(vals),
                  "mean":statistics.mean(vals),
                  "p75":qtile(vals,0.75),
                  "p90":qtile(vals,0.90),
                  "max":max(vals),
              }

          def cv(values):
              vals=[float(x) for x in values]
              if len(vals)<2:
                  return 0.0
              m=statistics.mean(vals)
              if m==0:
                  return None
              return statistics.pstdev(vals)/abs(m)

          def rankdata(values):
              indexed=sorted(enumerate(values),key=lambda z:z[1])
              ranks=[0.0]*len(values)
              i=0
              while i<len(indexed):
                  j=i+1
                  while j<len(indexed) and indexed[j][1]==indexed[i][1]:
                      j+=1
                  avg=(i+1+j)/2.0
                  for k in range(i,j):
                      ranks[indexed[k][0]]=avg
                  i=j
              return ranks

          def pearson(x,y):
              if len(x)!=len(y) or len(x)<2:
                  return None
              mx=statistics.mean(x); my=statistics.mean(y)
              num=sum((a-mx)*(b-my) for a,b in zip(x,y))
              dx=sum((a-mx)**2 for a in x)
              dy=sum((b-my)**2 for b in y)
              if dx<=0 or dy<=0:
                  return None
              return num/math.sqrt(dx*dy)

          def spearman(x,y):
              return pearson(rankdata(x),rankdata(y))

          pw=float(cfg["position_weight"]["WR"])
          age_curve=dict(cfg["age_curve"]["WR"])

          wrs=[]
          for key,info in cfg["player_db"].items():
              if info["pos"]!="WR":
                  continue

              role=info["role"]
              age=int(info["age"])
              rm,raw_rm=sv.production_multiplier(
                  key,role,cfg["prod_mult"],cfg["no_real_history"],cfg["role_mult"]
              )
              am=sv.effective_age_multiplier(
                  "WR",age,role,key,rm,raw_rm,cfg
              )
              expected=js_round(100*pw*am*rm*55)
              actual=live_values[key]["value"]
              assert expected==actual,(key,expected,actual)

              role_estimate=float(cfg["role_mult"].get(role,1.0))
              elite_floor=(
                  role=="Elite"
                  and isinstance(raw_rm,(int,float))
                  and raw_rm<0.65
                  and abs(rm-0.65)<1e-12
              )
              no_history_rescue=(
                  key in cfg["no_real_history"]
                  and isinstance(raw_rm,(int,float))
                  and raw_rm<=0.15
                  and role_estimate>raw_rm
                  and abs(rm-role_estimate)<1e-12
              )

              wrs.append({
                  "key":key,
                  "name":key,
                  "age":age,
                  "role":role,
                  "fv":expected,
                  "prod_mult":float(rm),
                  "raw_prod_mult":(
                      float(raw_rm) if isinstance(raw_rm,(int,float)) else None
                  ),
                  "age_mult":float(am),
                  "has_real_prod_data":raw_rm is not None,
                  "no_real_production_history":key in cfg["no_real_history"],
                  "elite_floor_applied":elite_floor,
                  "no_history_role_rescue_applied":no_history_rescue,
                  "raw_at_floor":(
                      isinstance(raw_rm,(int,float)) and raw_rm<=0.15+1e-12
                  ),
                  "raw_at_ceiling":(
                      isinstance(raw_rm,(int,float)) and raw_rm>=1.55-1e-12
                  ),
                  "age_floor_applied":abs(float(am)-0.62)<1e-12,
              })

          wrs.sort(key=lambda r:(-r["fv"],r["key"]))
          assert len({r["key"] for r in wrs})==len(wrs)
          for i,r in enumerate(wrs,1):
              r["live_rank"]=i

          top12=wrs[:12]
          top24=wrs[:24]
          top36=wrs[:36]
          wr1=wrs[0]

          rank_bands={}
          for lo,hi in (
              (1,3),(1,6),(1,12),(1,24),(1,36),
              (13,24),(25,36),(37,48),(49,72),(73,96)
          ):
              rows=wrs[lo-1:min(hi,len(wrs))]
              if not rows:
                  continue
              rank_bands[f"WR{lo}-WR{hi}"]={
                  "n":len(rows),
                  "fv":summary([r["fv"] for r in rows]),
                  "prod_mult":summary([r["prod_mult"] for r in rows]),
                  "age_mult":summary([r["age_mult"] for r in rows]),
                  "ages":summary([r["age"] for r in rows]),
                  "roles":dict(Counter(r["role"] for r in rows)),
                  "elite_floor_count":sum(r["elite_floor_applied"] for r in rows),
                  "no_history_rescue_count":sum(
                      r["no_history_role_rescue_applied"] for r in rows
                  ),
                  "age_floor_count":sum(r["age_floor_applied"] for r in rows),
              }

          reference_ranks={}
          for rank in (2,3,6,12,18,24,36,48,72,96):
              if len(wrs)>=rank:
                  row=wrs[rank-1]
                  reference_ranks[str(rank)]={
                      "player":row["key"],
                      "fv":row["fv"],
                      "wr1_to_rank_fv_ratio":wr1["fv"]/row["fv"] if row["fv"] else None,
                      "absolute_gap_from_wr1":wr1["fv"]-row["fv"],
                      "pct_below_wr1":(
                          (wr1["fv"]-row["fv"])/wr1["fv"]
                          if wr1["fv"] else None
                      ),
                  }

          within_wr1={}
          for pct in (0.02,0.05,0.10,0.15,0.20,0.25,0.30,0.40,0.50):
              within_wr1[str(int(pct*100))]=sum(
                  r["fv"]>=wr1["fv"]*(1-pct) for r in wrs
              )

          decomposition={
              "position_weight":pw,
              "position_weight_is_constant_within_wr":True,
              "global_value_scale":55,
              "top12_fv_cv":cv([r["fv"] for r in top12]),
              "top12_prod_mult_cv":cv([r["prod_mult"] for r in top12]),
              "top12_age_mult_cv":cv([r["age_mult"] for r in top12]),
              "top24_fv_vs_prod_mult_spearman":spearman(
                  [r["fv"] for r in top24],
                  [r["prod_mult"] for r in top24],
              ),
              "top24_fv_vs_age_mult_spearman":spearman(
                  [r["fv"] for r in top24],
                  [r["age_mult"] for r in top24],
              ),
              "top36_fv_vs_prod_mult_spearman":spearman(
                  [r["fv"] for r in top36],
                  [r["prod_mult"] for r in top36],
              ),
              "top36_fv_vs_age_mult_spearman":spearman(
                  [r["fv"] for r in top36],
                  [r["age_mult"] for r in top36],
              ),
              "all_wr_fv_vs_prod_mult_spearman":spearman(
                  [r["fv"] for r in wrs],
                  [r["prod_mult"] for r in wrs],
              ),
              "all_wr_fv_vs_age_mult_spearman":spearman(
                  [r["fv"] for r in wrs],
                  [r["age_mult"] for r in wrs],
              ),
          }

          live_semantics={
              "wr_count":len(wrs),
              "has_real_prod_data_count":sum(r["has_real_prod_data"] for r in wrs),
              "no_real_production_history_count":sum(
                  r["no_real_production_history"] for r in wrs
              ),
              "elite_floor_applied_count":sum(
                  r["elite_floor_applied"] for r in wrs
              ),
              "no_history_role_rescue_applied_count":sum(
                  r["no_history_role_rescue_applied"] for r in wrs
              ),
              "raw_at_floor_count":sum(r["raw_at_floor"] for r in wrs),
              "raw_at_ceiling_count":sum(r["raw_at_ceiling"] for r in wrs),
              "age_floor_applied_count":sum(r["age_floor_applied"] for r in wrs),
              "top24_elite_floor_count":sum(
                  r["elite_floor_applied"] for r in top24
              ),
              "top24_no_history_role_rescue_count":sum(
                  r["no_history_role_rescue_applied"] for r in top24
              ),
              "top24_age_floor_count":sum(
                  r["age_floor_applied"] for r in top24
              ),
              "position_weight":pw,
              "age_curve":age_curve,
          }

          # Mechanical sensitivity: no fitting; isolate +/-10% effective production
          # and +/-1 year age around each current top-24 WR.
          sensitivity=[]
          for r in top24:
              def fv_at(prod=None,age=None):
                  prod=r["prod_mult"] if prod is None else float(prod)
                  age=r["age"] if age is None else int(age)
                  prod=max(0.15,min(1.55,prod))
                  am=sv.age_multiplier("WR",age,r["role"],prod,prod,cfg)
                  return js_round(100*pw*am*prod*55)

              base=r["fv"]
              low=fv_at(prod=r["prod_mult"]*0.90)
              high=fv_at(prod=r["prod_mult"]*1.10)
              younger=fv_at(age=max(18,r["age"]-1))
              older=fv_at(age=r["age"]+1)
              sensitivity.append({
                  "rank":r["live_rank"],
                  "player":r["key"],
                  "age":r["age"],
                  "role":r["role"],
                  "base_fv":base,
                  "base_prod_mult":r["prod_mult"],
                  "base_age_mult":r["age_mult"],
                  "prod_minus_10_pct":(low-base)/base if base else None,
                  "prod_plus_10_pct":(high-base)/base if base else None,
                  "one_year_younger_pct":(younger-base)/base if base else None,
                  "one_year_older_pct":(older-base)/base if base else None,
              })

          sensitivity_summary={
              "top24_prod_minus_10_pct":summary(
                  [x["prod_minus_10_pct"] for x in sensitivity]
              ),
              "top24_prod_plus_10_pct":summary(
                  [x["prod_plus_10_pct"] for x in sensitivity]
              ),
              "top24_one_year_younger_pct":summary(
                  [x["one_year_younger_pct"] for x in sensitivity]
              ),
              "top24_one_year_older_pct":summary(
                  [x["one_year_older_pct"] for x in sensitivity]
              ),
          }

          # Explicit age surface around every deployed WR age breakpoint.
          age_surface=[]
          start=max(18,age_curve["peakStart"]-4)
          end=age_curve["floor"]+2
          for role in ("Elite","Starter","Rotational"):
              for prod in (0.35,0.65,1.00,1.30):
                  for age in range(start,end+1):
                      am=sv.age_multiplier("WR",age,role,prod,prod,cfg)
                      age_surface.append({
                          "role":role,
                          "prod_mult":prod,
                          "age":age,
                          "age_mult":am,
                          "fv":js_round(100*pw*am*prod*55),
                          "at_peak_start":age==age_curve["peakStart"],
                          "at_peak_end":age==age_curve["peakEnd"],
                          "at_floor_age":age==age_curve["floor"],
                      })

          p1_cov=phase1["coverage_by_position"]["WR"]
          p1_rank=phase1["rank_stability_by_position"]["WR"]
          p1_move=phase1["movement_summary_by_position"]["WR"]
          current_n=int(p1_cov["current_players"])
          candidate_n=int(p1_cov["candidate_final_value"])
          phase1_coverage=candidate_n/current_n

          phase1_diag={
              "wr_count":current_n,
              "candidate_count":candidate_n,
              "candidate_coverage_share":phase1_coverage,
              "reported_coverage":p1_cov,
              "rank_stability":p1_rank,
              "movement_summary":p1_move,
              "benchmark_transform":phase1["benchmark_assumptions"]["prod_mult_transform"],
              "benchmark_offense_forward":phase1["benchmark_assumptions"]["offense_forward"],
          }

          legacy_wr=legacy["by_position_abs_diff"]["WR"]
          legacy_diag={
              "wr_live_vs_generated_abs_diff":legacy_wr,
              "overall_live_vs_generated_abs_diff":legacy["overall_abs_diff"],
              "wr_median_abs_diff_vs_overall_ratio":(
                  legacy_wr["median"]/legacy["overall_abs_diff"]["median"]
                  if legacy["overall_abs_diff"]["median"] else None
              ),
              "wr_median_drift_above_overall":(
                  legacy_wr["median"]>legacy["overall_abs_diff"]["median"]
              ),
              "interpretation":"Legacy lineage drift is diagnostic only; elevated WR drift is a broad-cohort follow-up signal, not deployment authority."
          }

          age_wr=age_eval["metrics"]["deployed_control"]["by_position"]["WR"]
          wr_pair_metrics={
              k:v for k,v in
              pw_eval["variant_scores"]["deployed_control"][
                  "cross_position_pairwise"
              ]["by_position_pair"].items()
              if "WR" in k
          }
          prospective_diag={
              "completed_outcome_weeks_age_v2":age_eval["completed_outcome_weeks"],
              "completed_outcome_weeks_position_weight_v2":
                  pw_eval["completed_outcome_weeks"],
              "age_v2_deployed_control_wr_metrics":age_wr,
              "position_weight_v2_deployed_control_wr_cross_position_pairs":
                  wr_pair_metrics,
              "age_curve_change_authorized":
                  age_eval.get("age_curve_change_authorized"),
              "age_v2_deployment_authorized":
                  age_eval.get("deployment_authorized"),
              "position_weight_change_authorized":
                  pw_eval.get("position_weight_change_authorized"),
              "position_weight_v2_deployment_authorized":
                  pw_eval.get("deployment_authorized"),
              "interpretation":"Weeks 1-3 are early descriptive evidence under frozen upstream studies and cannot authorize a WR model change."
          }

          gates={
              "minimum_live_wr_count":
                  len(wrs)>=protocol["hard_integrity_gates"]["minimum_live_wr_count"],
              "all_live_wr_values_positive":
                  all(r["fv"]>0 for r in wrs),
              "unique_live_wr_keys":
                  len({r["key"] for r in wrs})==len(wrs),
              "minimum_phase1_wr_candidate_coverage_share":
                  phase1_coverage>=protocol["hard_integrity_gates"][
                      "minimum_phase1_wr_candidate_coverage_share"
                  ],
              "minimum_phase1_current_vs_candidate_spearman":
                  p1_rank["spearman_current_vs_phase1"]>=protocol[
                      "hard_integrity_gates"
                  ]["minimum_phase1_current_vs_candidate_spearman"],
              "minimum_phase1_top_n_overlap_share":
                  p1_rank["top_n_overlap_share"]>=protocol[
                      "hard_integrity_gates"
                  ]["minimum_phase1_top_n_overlap_share"],
              "age_v2_must_not_authorize_deployment":
                  age_eval.get("deployment_authorized") is False
                  and age_eval.get("age_curve_change_authorized") is False,
              "position_weight_v2_must_not_authorize_deployment":
                  pw_eval.get("deployment_authorized") is False
                  and pw_eval.get("position_weight_change_authorized") is False,
          }

          decision=(
              protocol["decision_rule"]["otherwise"]
              if all(gates.values())
              else protocol["decision_rule"]["if_any_hard_integrity_gate_fails"]
          )

          result={
              "schema_version":1,
              "study_id":"wr-structural-integrity-audit-v1",
              "status":"AUDIT_COMPLETE",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "production_changed":False,
              "fitting_performed":False,
              "named_player_adjustment_performed":False,
              "hard_integrity_gates":gates,
              "deployed_formula":{
                  "formula":"FV = JS-round(5500 * POSITION_WEIGHT[WR] * age_multiplier * effective_production_multiplier)",
                  "wr_position_weight":pw,
                  "wr_age_curve":age_curve,
                  "global_scale":55,
                  "fractional_age_used":False,
                  "rb_youth_bonus_used":False,
              },
              "structural_findings":{
                  "within_wr_position_weight_cancels":True,
                  "wr1":wr1,
                  "reference_ranks":reference_ranks,
                  "counts_within_percent_of_wr1":within_wr1,
                  "rank_bands":rank_bands,
                  "decomposition":decomposition,
                  "live_semantics":live_semantics,
                  "sensitivity_summary":sensitivity_summary,
                  "phase1_rank_order_is_highly_stable":(
                      p1_rank["spearman_current_vs_phase1"]>=0.95
                  ),
                  "phase1_top_n_membership_overlap_share":
                      p1_rank["top_n_overlap_share"],
                  "legacy_wr_lineage_drift_above_overall_median":
                      legacy_diag["wr_median_drift_above_overall"],
                  "weeks_1_3_are_not_model_selection_evidence":True,
              },
              "top_40_live_wrs":wrs[:40],
              "all_live_wrs":wrs,
              "top24_sensitivity":sensitivity,
              "wr_age_surface":age_surface,
              "production_v2_phase1_diagnostic":phase1_diag,
              "legacy_production_lineage_diagnostic":legacy_diag,
              "existing_prospective_evidence":prospective_diag,
              "scientific_limits":[
                  "This audit can identify mechanical compression, discontinuities, age sensitivity, coverage gaps, and lineage instability.",
                  "It cannot establish the true market price of WR scarcity.",
                  "It cannot infer that a specific named WR is too high or too low.",
                  "Production V2 Phase 1 is transparent but uncalibrated.",
                  "Weeks 1-3 realized outcomes are too early under frozen prospective protocols to select or deploy a WR model change.",
                  "No new WR weight, age curve, production transform, youth premium, or player-specific adjustment is fit here."
              ],
              "next_step_if_green":"Review A19 findings. If no material WR calibration concern is established, freeze no-change and continue to A20 TE Structural Integrity Audit V1. If a material concern remains, preregister a broad-cohort WR calibration study before fitting or validation."
          }

          (D/"audit_result.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# WR Structural Integrity Audit V1",
              "",
              f"**Decision:** `{decision}`",
              "",
              "## Scope",
              "",
              f"- Live WR count: **{len(wrs)}**",
              f"- Production V2 Phase 1 WR benchmark coverage: **{candidate_n}/{current_n} ({phase1_coverage:.1%})**",
              f"- Live WR position weight: **{pw:.6f}**",
              f"- WR age curve: **{age_curve}**",
              "- Fractional-age interpolation: **No (RB-only mechanism)**",
              "- Production changes: **None**",
              "- Fitting: **None**",
              "",
              "## Hard integrity gates",
              "",
          ]
          for k,v in gates.items():
              lines.append(f"- {k}: **{'PASS' if v else 'FAIL'}**")

          lines += [
              "",
              "## Mechanical interpretation",
              "",
              "Within WR, position weight is constant. WR-vs-WR spacing therefore comes from production and integer-age mechanics.",
              "",
              f"- Current WR1: **{wr1['key']} — {wr1['fv']} FV**",
          ]
          for rank,rec in reference_ranks.items():
              lines.append(
                  f"- WR1 / WR{rank} FV ratio: **{rec['wr1_to_rank_fv_ratio']:.3f}** "
                  f"(WR{rank}: {rec['player']} — {rec['fv']})"
              )

          lines += [
              "",
              "## Upper-WR decomposition",
              "",
              f"- Top-12 FV coefficient of variation: **{decomposition['top12_fv_cv']:.4f}**",
              f"- Top-12 production-multiplier coefficient of variation: **{decomposition['top12_prod_mult_cv']:.4f}**",
              f"- Top-12 age-multiplier coefficient of variation: **{decomposition['top12_age_mult_cv']:.4f}**",
              f"- Top-24 FV vs production-multiplier Spearman: **{decomposition['top24_fv_vs_prod_mult_spearman']:.4f}**",
              f"- Top-24 FV vs age-multiplier Spearman: **{decomposition['top24_fv_vs_age_mult_spearman']:.4f}**",
              "",
              "## Live fallback / floor semantics",
              "",
              f"- Elite production floor applied: **{live_semantics['elite_floor_applied_count']} WRs**",
              f"- No-history role rescue applied: **{live_semantics['no_history_role_rescue_applied_count']} WRs**",
              f"- Raw production at floor: **{live_semantics['raw_at_floor_count']} WRs**",
              f"- Raw production at ceiling: **{live_semantics['raw_at_ceiling_count']} WRs**",
              f"- Age multiplier at 0.62 floor: **{live_semantics['age_floor_applied_count']} WRs**",
              "",
              "## Production lineage",
              "",
              f"- Phase 1 current-vs-transparent-candidate Spearman: **{p1_rank['spearman_current_vs_phase1']:.6f}**",
              f"- Phase 1 top-{p1_rank['top_n']} overlap: **{p1_rank['top_n_overlap_count']}/{p1_rank['top_n']} ({p1_rank['top_n_overlap_share']:.1%})**",
              f"- Legacy WR live-vs-generated median absolute PM drift: **{legacy_wr['median']:.4f}**",
              f"- Legacy overall median absolute PM drift: **{legacy['overall_abs_diff']['median']:.4f}**",
              f"- WR / overall median drift ratio: **{legacy_diag['wr_median_abs_diff_vs_overall_ratio']:.3f}x**",
              "",
              "## Existing prospective evidence",
              "",
              f"- Completed outcome weeks available: **{age_eval['completed_outcome_weeks']}**",
              f"- WR FV vs active PPG Spearman: **{age_wr['value_vs_active_ppg']['spearman']:.4f}**",
              f"- WR FV vs total points Spearman: **{age_wr['value_vs_total_points']['spearman']:.4f}**",
              "- These Weeks 1-3 results are descriptive only under frozen upstream protocols.",
              "",
              "## Top 40 live WRs",
              "",
              "| Rank | WR | Age | Role | FV | Prod mult | Age mult | Elite floor | No-history rescue |",
              "|---:|---|---:|---|---:|---:|---:|:---:|:---:|",
          ]
          for r in wrs[:40]:
              lines.append(
                  f"| {r['live_rank']} | {r['key']} | {r['age']} | {r['role']} | "
                  f"{r['fv']} | {r['prod_mult']:.4f} | {r['age_mult']:.4f} | "
                  f"{'Y' if r['elite_floor_applied'] else 'N'} | "
                  f"{'Y' if r['no_history_role_rescue_applied'] else 'N'} |"
              )

          lines += [
              "",
              "## Scientific limit / next step",
              "",
              "This audit does not decide that the WR scale or age curve is correct merely because "
              "the deployed mechanics are internally consistent. Any material calibration concern "
              "must be preregistered at the broad-cohort level before fitting or validation.",
          ]

          (D/"audit_report.md").write_text(
              "\n".join(lines).rstrip()+"\n"
          )

          print(json.dumps({
              "decision":decision,
              "live_wr_count":len(wrs),
              "phase1_candidate_coverage_share":phase1_coverage,
              "phase1_spearman":p1_rank["spearman_current_vs_phase1"],
              "phase1_top_n_overlap_share":p1_rank["top_n_overlap_share"],
              "wr1":{"player":wr1["key"],"fv":wr1["fv"]},
              "wr1_to_wr24_ratio":reference_ranks["24"]["wr1_to_rank_fv_ratio"],
              "legacy_wr_median_abs_pm_drift":legacy_wr["median"],
              "legacy_wr_to_overall_median_drift_ratio":
                  legacy_diag["wr_median_abs_diff_vs_overall_ratio"],
              "all_hard_gates_pass":all(gates.values()),
          },indent=2))
          PY

      - name: Validate audit result and write manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/wr-structural-integrity-audit-v1")
          protocol=json.loads((D/"audit_protocol.json").read_text())
          result=json.loads((D/"audit_result.json").read_text())

          assert result["status"]=="AUDIT_COMPLETE"
          assert result["research_only"] is True
          assert result["production_change_authorized"] is False
          assert result["production_changed"] is False
          assert result["fitting_performed"] is False
          assert result["named_player_adjustment_performed"] is False
          assert result["decision"] in set(protocol["decision_rule"].values())
          assert len(result["all_live_wrs"])>=100
          assert len(result["top_40_live_wrs"])==40
          assert result["deployed_formula"]["fractional_age_used"] is False
          assert result["deployed_formula"]["rb_youth_bonus_used"] is False

          if all(result["hard_integrity_gates"].values()):
              assert result["decision"]==(
                  "PASS_WR_STRUCTURAL_AUDIT_FREEZE_REVIEW_REQUIRED_BEFORE_ANY_MODEL_CHANGE"
              )
          else:
              assert result["decision"]==(
                  "STOP_WR_AUDIT_DATA_OR_LINEAGE_INTEGRITY_FAILURE"
              )

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          manifest={
              "schema_version":1,
              "study_id":"wr-structural-integrity-audit-v1",
              "decision":result["decision"],
              "research_only":True,
              "production_change_authorized":False,
              "production_changed":False,
              "files":{
                  "audit_protocol.json":sha(D/"audit_protocol.json"),
                  "audit_result.json":sha(D/"audit_result.json"),
                  "audit_report.md":sha(D/"audit_report.md"),
              },
              "frozen_inputs":{
                  "a18_rb_audit_manifest.json":sha(
                      Path("research/rb-structural-integrity-audit-v1/manifest.json")
                  ),
                  "index.html":sha(Path("index.html")),
                  "snapshot_values.py":sha(
                      Path("scripts/validation/snapshot_values.py")
                  ),
                  "production_v2_phase1_audit.json":sha(
                      Path("research/production-v2/production_v2_phase1_audit.json")
                  ),
                  "prod_mult_lineage_audit.json":sha(
                      Path("research/legacy-prod-mult/prod_mult_lineage_audit.json")
                  ),
                  "age_curve_v2_phase5_evaluation.json":sha(
                      Path("research/age-curve-v2/age_curve_v2_phase5_evaluation.json")
                  ),
                  "position_weight_v2_phase5_evaluation.json":sha(
                      Path("research/position-weight-v2/position_weight_v2_phase5_evaluation.json")
                  ),
              }
          }
          (D/"manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A19 WR audit manifest frozen.")
          PY

      - name: Prove production and audit inputs remained immutable
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/a19-immutable-production-and-inputs.sha256"

          python3 scripts/validation/snapshot_values.py --selftest
          python3 scripts/validation/repo_regression_checks.py

          echo "PASS: A19 made no production or upstream research changes."

      - name: Prove exact A19 research-only scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          allowed={
              "research/wr-structural-integrity-audit-v1/audit_protocol.json",
              "research/wr-structural-integrity-audit-v1/audit_result.json",
              "research/wr-structural-integrity-audit-v1/audit_report.md",
              "research/wr-structural-integrity-audit-v1/manifest.json",
          }

          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}

          unexpected=touched-allowed
          missing=allowed-touched
          if unexpected:
              raise SystemExit(
                  "Unexpected A19 file changes: "
                  + ", ".join(sorted(unexpected))
              )
          if missing:
              raise SystemExit(
                  "Missing A19 research files: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: A19 touched exactly four WR research files.")
          PY

          git diff --check

      - name: Commit A19 WR audit freeze
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A19."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/wr-structural-integrity-audit-v1/

          git diff --cached --check
          git commit -m "Freeze WR structural integrity audit V1"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A19 WR structural integrity audit committed cleanly."
