name: Package Adjustment V6 Prospective Voting Activation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen V6P1 amendment and catalog
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/prospective_preregistration_v1.json")" = \
            "d0000c9f42c7be11a8d49d0029993a28fabebc73"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/prospective_catalog_freeze_manifest_v1.json")" = \
            "a9ee2075775a693098a7ca4162889e4af70e056a"
          test "$(git hash-object "$D/prospective_feasibility_amendment_v1.json")" = \
            "48cafa8ca85c9488f864e8eca6a8882f3e09b3ed"
          test "$(git hash-object "$D/prospective_feasibility_amendment_manifest_v1.json")" = \
            "6fb69d64b31c104b43666734b46599f9ed49abcd"

          test "$(sha256sum "$D/package_vote_challenges_v6_prospective_v1.json" | awk '{print $1}')" = \
            "2739a0f0728b422cce632fec2381c5a4d35a572dbfabc46c97c0591bb2f5a3fc"

          test ! -e "$D/prospective_voting_activation_manifest_v1.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          a = json.loads((d / "prospective_feasibility_amendment_v1.json").read_text())
          c = json.loads((d / "package_vote_challenges_v6_prospective_v1.json").read_text())
          cm = json.loads((d / "prospective_catalog_freeze_manifest_v1.json").read_text())

          assert a["status"] == "frozen_v6p1_pre_activation_feasibility_amendment"
          assert a["frozen"] is True
          assert a["timing_and_reason"][
              "amendment_frozen_before_prospective_voting_activation"
          ] is True
          assert a["timing_and_reason"]["prospective_outcomes_used_to_make_amendment"] is False

          r = a["feasible_recruitment_contract"]
          assert r["target_unique_voters"] == 50
          assert r["minimum_unique_voters_for_evaluation"] == 45
          assert r["daily_valid_ballot_cap_per_voter"] == 40
          assert r["effective_lifetime_cap_per_voter"] == 40.0
          assert r["one_session_completion_allowed"] is True

          s = a["prospective_evidence_maturity_and_stopping_v2"]
          assert s["exact_checkpoints_effective_votes"] == [1800, 2000]
          assert s["first_checkpoint_effective_votes"] == 1800
          assert s["hard_cap_effective_votes"] == 2000
          assert s["minimum_distinct_voters"] == 45
          assert s["minimum_effective_votes_per_cell"] == 48.0
          assert s["minimum_distinct_voters_per_cell"] == 27
          assert s["monitor_must_be_outcome_blind"] is True

          assert c["status"] == "frozen_v6p1_prospective_catalog"
          assert c["frozen"] is True
          assert c["released"] is False
          assert c["voting_activated"] is False
          assert len(c["challenges"]) == 504
          assert len(c["targets"]) == 21
          assert c["catalog_diagnostics"]["research_cell_count"] == 24

          assert cm["voting_activated"] is False
          assert cm["prospective_votes_collected"] is False
          assert cm["prospective_vote_outcomes_read"] is False

          print(
              "PASS: V6P1 feasible amendment and frozen 504-trade catalog "
              "are ready for activation."
          )
          PY

      - name: Verify production remains V1.6 before activation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Activate V6P1 browser transport and sampler
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          INDEX = Path("index.html")
          KTC = Path("scripts/market/ktc_pipeline.py")
          REG = Path("scripts/validation/repo_regression_checks.py")
          MANIFEST = Path(
              "research/package-adjustment-v6/"
              "prospective_voting_activation_manifest_v1.json"
          )

          CATALOG_COMMIT = "3f1e3d265265453e5356b93a34a3737e367c7990"
          CATALOG_BLOB = "dd12608b1b5fee03da5965458d6e59284657dce3"
          CATALOG_SHA256 = (
              "2739a0f0728b422cce632fec2381c5a4d35a572dbfabc46c97c0591bb2f5a3fc"
          )
          AMENDMENT_COMMIT = "5d1bbffea5ee557d835855d0a99cd3577ccc592d"
          AMENDMENT_BLOB = "48cafa8ca85c9488f864e8eca6a8882f3e09b3ed"
          AMENDMENT_SHA256 = (
              "fde80a898ec8b33e54df3c2aab37dd52af45dfbe7de08585b82b65a829392072"
          )

          CATALOG_URL = (
              "https://raw.githubusercontent.com/ajknoll23-code/"
              "LOG-Trade-Calculator/"
              + CATALOG_COMMIT
              + "/research/package-adjustment-v6/"
              "package_vote_challenges_v6_prospective_v1.json"
          )
          activated = datetime.now(timezone.utc).isoformat()

          text = INDEX.read_text(encoding="utf-8")

          replacements = [
              (
                  "/* Package Adjustment V6 Development: frozen 1-vs-3 composition catalog.\n"
                  "Research-only development evidence. Production Package Adjustment remains V1.6. */",
                  "/* Package Adjustment V6P1 Prospective Confirmation: fresh frozen "
                  "1-vs-3 catalog under the pre-activation feasibility amendment.\n"
                  "Research only. Production Package Adjustment remains V1.6. */",
              ),
              (
                  "const PACKAGE_VOTE_CHALLENGES_URL = "
                  "'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/"
                  "edcb76b353ff023e51d2ae31f02c8ddd3812e12a/research/package-adjustment-v6/"
                  "package_vote_challenges_v6.json';",
                  f"const PACKAGE_VOTE_CHALLENGES_URL = '{CATALOG_URL}';",
              ),
              (
                  "const PACKAGE_VOTE_CATALOG_SHA256 = "
                  "'f306da6cf396310be91c7e468703be8a9511dbff383508a75d81a17f7edf3a21';",
                  f"const PACKAGE_VOTE_CATALOG_SHA256 = '{CATALOG_SHA256}';",
              ),
              (
                  "const PACKAGE_VOTE_DAILY_LIMIT = 20;",
                  "const PACKAGE_VOTE_DAILY_LIMIT = 40;",
              ),
              (
                  "const PACKAGE_VOTE_VALID_AFTER_UTC = "
                  "'2026-09-15T05:13:39.413560+00:00';",
                  f"const PACKAGE_VOTE_VALID_AFTER_UTC = '{activated}';",
              ),
              (
                  "return 'package_votes_v6_development_v1_' + "
                  "new Date().toISOString().slice(0,10);",
                  "return 'package_votes_v6p1_prospective_v1_' + "
                  "new Date().toISOString().slice(0,10);",
              ),
              (
                  "localStorage.getItem('package_vote_recent_v6_development_v1')",
                  "localStorage.getItem('package_vote_recent_v6p1_prospective_v1')",
              ),
              (
                  "localStorage.setItem('package_vote_recent_v6_development_v1', JSON.stringify(recent));",
                  "localStorage.setItem('package_vote_recent_v6p1_prospective_v1', JSON.stringify(recent));",
              ),
              (
                  "/* PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1\n"
                  "   Frozen V6 development schedule:",
                  "/* PACKAGE_VOTE_V6P1_EXACT_CELL_SAMPLING_V1\n"
                  "   Frozen V6P1 prospective schedule:",
              ),
              ("doc.schema_version !== 6 ||", "doc.schema_version !== 1 ||"),
              (
                  "doc.status !== 'frozen_package_adjustment_v6_development_catalog' ||",
                  "doc.status !== 'frozen_v6p1_prospective_catalog' ||",
              ),
              ("doc.consumer_changed !== false ||\n", ""),
              ("doc.production_formula_enabled !== false ||\n", ""),
              (
                  "doc.exact_motivating_trade_included !== false ||\n",
                  "doc.development_vote_outcomes_read !== false ||\n"
                  "doc.prospective_vote_outcomes_read !== false ||\n"
                  "doc.development_target_reuse_count !== 0 ||\n"
                  "doc.development_trade_signature_overlap_count !== 0 ||\n",
              ),
              (
                  "Number(doc.catalog_diagnostics.motivating_trade_matches) !== 0 ||\n",
                  "Number(doc.catalog_diagnostics.development_target_overlap_count) !== 0 ||\n"
                  "Number(doc.catalog_diagnostics.development_trade_signature_overlap_count) !== 0 ||\n",
              ),
              ("c.schema_version === 6 &&", "c.schema_version === 1 &&"),
              (
                  "c.experiment === 'package_adjustment_v6_three_player_composition_development' &&",
                  "c.experiment === 'package_adjustment_v6_fresh_prospective_confirmation' &&",
              ),
              (
                  "throw new Error('unexpected frozen V6 development challenge catalog');",
                  "throw new Error('unexpected frozen V6P1 prospective challenge catalog');",
              ),
              (
                  "throw new Error('v6_development_catalog_cell_count');",
                  "throw new Error('v6p1_prospective_catalog_cell_count');",
              ),
              (
                  "throw new Error('v6_development_catalog_cell_balance');",
                  "throw new Error('v6p1_prospective_catalog_cell_balance');",
              ),
              (
                  "console.warn('Package Adjustment V6 development catalog load failed:', err);",
                  "console.warn('Package Adjustment V6P1 prospective catalog load failed:', err);",
              ),
              (
                  "keep: `__pkgv6__|${id}|${choice}`,",
                  "keep: `__pkgv6p1__|${id}|${choice}`,",
              ),
              (
                  "trade: `__pkgv6_meta__|${left}`,",
                  "trade: `__pkgv6p1_meta__|${left}`,",
              ),
              (
                  "cut: '__pkgv6_schema__|6',",
                  "cut: '__pkgv6p1_schema__|1',",
              ),
              (
                  "V6 development voting opens at "
                  "${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.",
                  "V6 prospective confirmation voting opens at "
                  "${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.",
              ),
              (
                  "Loading frozen V6 development comparisons...",
                  "Loading frozen V6 prospective comparisons...",
              ),
              (
                  "V6 package research is temporarily unavailable. "
                  "Normal KTC voting is unaffected.",
                  "V6 prospective package research is temporarily unavailable. "
                  "Normal KTC voting is unaffected.",
              ),
              (
                  "No V6 package comparison is available right now.",
                  "No V6 prospective package comparison is available right now.",
              ),
              (
                  '<b style="color:var(--text);">Research question:</b> '
                  'Which side would you rather receive in a dynasty trade?',
                  '<b style="color:var(--text);">Fresh confirmation question:</b> '
                  'Which side would you rather receive in a dynasty trade?',
              ),
          ]

          for old, new in replacements:
              expected_count = (
                  2
                  if old == "Loading frozen V6 development comparisons..."
                  else 1
              )
              count = text.count(old)
              if count != expected_count:
                  raise RuntimeError(
                      "index activation patch target count="
                      f"{count}, expected={expected_count}: {old[:100]!r}"
                  )
              text = text.replace(old, new, expected_count)

          # Voters can do all 40 in one session. Give a neutral halfway status
          # without forcing a return on another day.
          marker = (
              "${packageVotesToday()} / ${PACKAGE_VOTE_DAILY_LIMIT} package votes today "
              "&middot; display sides randomized"
          )
          replacement = (
              "${packageVotesToday()} / ${PACKAGE_VOTE_DAILY_LIMIT} package votes today "
              "&middot; display sides randomized"
              "${packageVotesToday() === 20 ? ' &middot; halfway done' : ''}"
          )
          if text.count(marker) != 1:
              raise RuntimeError("package vote progress marker drift")
          text = text.replace(marker, replacement, 1)

          INDEX.write_text(text, encoding="utf-8")

          ktc = KTC.read_text(encoding="utf-8")

          old_prefix = (
              'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", '
              '"__pkgv3__|", "__pkgv4__|", "__pkgv5__|", "__pkgnv2__|", '
              '"__pkgnv2p1__|", "__pkgv6__|", "__pkgv3c1__|", "__pkgv4c1__|")'
          )
          new_prefix = (
              'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", '
              '"__pkgv3__|", "__pkgv4__|", "__pkgv5__|", "__pkgnv2__|", '
              '"__pkgnv2p1__|", "__pkgv6__|", "__pkgv6p1__|", '
              '"__pkgv3c1__|", "__pkgv4c1__|")'
          )
          if ktc.count(old_prefix) != 1:
              raise RuntimeError("KTC package prefix patch target drift")
          ktc = ktc.replace(old_prefix, new_prefix, 1)

          old_comment = (
              "# Package Preference Voting V1-V6, NextGen V2, plus V3/V4 fresh confirmation\n"
              "# share transport only. Remove all reserved row families before normal KTC\n"
              "# daily-cap and Bradley-Terry work."
          )
          new_comment = (
              "# Package Preference Voting V1-V6, V6P1 prospective confirmation,\n"
              "# NextGen V2, plus V3/V4 fresh confirmation share transport only.\n"
              "# Remove all reserved row families before normal KTC daily-cap and\n"
              "# Bradley-Terry work."
          )
          if ktc.count(old_comment) != 1:
              raise RuntimeError("KTC transport comment patch target drift")
          ktc = ktc.replace(old_comment, new_comment, 1)
          KTC.write_text(ktc, encoding="utf-8")

          reg = REG.read_text(encoding="utf-8")

          old_tuple = (
              '        "__pkgnv2p1__|",\n'
              '        "__pkgv6__|",\n'
              '        "__pkgv3c1__|",'
          )
          new_tuple = (
              '        "__pkgnv2p1__|",\n'
              '        "__pkgv6__|",\n'
              '        "__pkgv6p1__|",\n'
              '        "__pkgv3c1__|",'
          )
          if reg.count(old_tuple) != 1:
              raise RuntimeError("regression prefix tuple drift")
          reg = reg.replace(old_tuple, new_tuple, 1)

          reg_replacements = [
              (
                  'assert "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" in block',
                  'assert "PACKAGE_VOTE_V6P1_EXACT_CELL_SAMPLING_V1" in block',
              ),
              (
                  'assert "Package Adjustment V6 Development: frozen 1-vs-3 composition catalog." in text',
                  'assert "Package Adjustment V6P1 Prospective Confirmation:" in text',
              ),
              (
                  'assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in text',
                  'assert "const PACKAGE_VOTE_DAILY_LIMIT = 40;" in text',
              ),
              (
                  'assert "__pkgv6__|" in text',
                  'assert "__pkgv6p1__|" in text',
              ),
              (
                  'assert "__pkgv6_meta__|" in text',
                  'assert "__pkgv6p1_meta__|" in text',
              ),
              (
                  'assert "__pkgv6_schema__|6" in text',
                  'assert "__pkgv6p1_schema__|1" in text',
              ),
              (
                  '"PASS V6 exact 24-cell sampling contract: no voter-roster filtering; "',
                  '"PASS V6P1 exact 24-cell sampling contract: no voter-roster filtering; "',
              ),
          ]
          for old, new in reg_replacements:
              if reg.count(old) != 1:
                  raise RuntimeError(
                      f"regression activation patch target drift: {old!r}"
                  )
              reg = reg.replace(old, new, 1)

          anchor = (
              '    assert "const PACKAGE_VOTE_DAILY_LIMIT = 40;" in text\n'
              '    assert "__pkgv6p1__|" in text'
          )
          replacement = (
              '    assert "const PACKAGE_VOTE_DAILY_LIMIT = 40;" in text\n'
              f'    assert "const PACKAGE_VOTE_CATALOG_SHA256 = \'{CATALOG_SHA256}\';" in text\n'
              f'    assert "{CATALOG_COMMIT}/research/package-adjustment-v6/'
              'package_vote_challenges_v6_prospective_v1.json" in text\n'
              '    assert "__pkgv6p1__|" in text'
          )
          if reg.count(anchor) != 1:
              raise RuntimeError("regression fingerprint insertion target drift")
          reg = reg.replace(anchor, replacement, 1)
          REG.write_text(reg, encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "status": "v6p1_feasible_prospective_voting_activated",
              "activated_at_utc": activated,
              "valid_ballot_start_utc": activated,
              "research_only": True,
              "production_change_authorized": False,
              "production_revision_unchanged": (
                  "v1.6-v5-size2-composition-overlay"
              ),
              "amendment": {
                  "source_commit": AMENDMENT_COMMIT,
                  "git_blob_sha": AMENDMENT_BLOB,
                  "sha256": AMENDMENT_SHA256,
                  "target_unique_voters": 50,
                  "minimum_unique_voters": 45,
              },
              "catalog": {
                  "source_commit": CATALOG_COMMIT,
                  "git_blob_sha": CATALOG_BLOB,
                  "sha256": CATALOG_SHA256,
                  "raw_url": CATALOG_URL,
                  "challenge_count": 504,
                  "target_count": 21,
                  "research_cell_count": 24,
              },
              "transport": {
                  "vote_prefix": "__pkgv6p1__|",
                  "meta_prefix": "__pkgv6p1_meta__|",
                  "schema_marker": "__pkgv6p1_schema__|1",
                  "daily_valid_ballot_cap_per_voter": 40,
                  "effective_lifetime_cap_per_voter": 40,
                  "one_session_completion_allowed": True,
                  "sampling": (
                      "uniform_24_cell_then_uniform_challenge_with_recent_filter_"
                      "post_cell_then_random_display_side"
                  ),
              },
              "maturity_contract": {
                  "exact_effective_vote_checkpoints": [1800, 2000],
                  "first_checkpoint_effective_votes": 1800,
                  "hard_cap_effective_votes": 2000,
                  "minimum_distinct_voters": 45,
                  "minimum_effective_votes_per_cell": 48.0,
                  "minimum_distinct_voters_per_cell": 27,
                  "required_cell_count": 24,
                  "stop_at_first_coverage_qualified_checkpoint": True,
                  "monitor_must_be_outcome_blind": True,
              },
              "isolation": {
                  "ktc_pipeline_reserves_v6p1_prefix": True,
                  "old_v6_development_rows_ineligible_for_v6p1": True,
                  "rows_at_or_before_valid_ballot_start_utc_invalid": True,
                  "normal_ktc_ratings_do_not_consume_v6p1_rows": True,
              },
              "next_action": (
                  "Collect V6P1 ballots and run only the outcome-blind maturity "
                  "monitor. Freeze the first coverage-qualified exact checkpoint "
                  "at 1,800 or, if needed, 2,000 effective votes."
              ),
          }

          MANIFEST.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("V6P1 valid ballot start UTC:", activated)
          print("Daily/session cap: 40")
          print("First checkpoint: 1800")
          print("Hard cap: 2000")
          PY

      - name: Verify activation contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          ktc_path = Path("scripts/market/ktc_pipeline.py")
          man_path = Path(
              "research/package-adjustment-v6/"
              "prospective_voting_activation_manifest_v1.json"
          )
          man = json.loads(man_path.read_text())

          assert "PACKAGE_VOTE_V6P1_EXACT_CELL_SAMPLING_V1" in index
          assert "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" not in index
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 40;" in index
          assert "__pkgv6p1__|" in index
          assert "__pkgv6p1_meta__|" in index
          assert "__pkgv6p1_schema__|1" in index
          assert "package_votes_v6p1_prospective_v1_" in index
          assert "package_vote_recent_v6p1_prospective_v1" in index
          assert "halfway done" in index
          assert "2739a0f0728b422cce632fec2381c5a4d35a572dbfabc46c97c0591bb2f5a3fc" in index

          start = index.index("function packageVoteTodayKey(){")
          end = index.index("\nfunction render(){", start)
          block = index[start:end]
          assert "function packageVoteOwnPlayers()" not in block
          assert "function packageVoteEligibleChallenges()" not in block
          assert "own.has(" not in block
          assert "const cells = Array.from(byCell.keys()).sort();" in block
          assert "if(cells.length !== 24) return null;" in block
          assert "const selectedCell = cells[Math.floor(Math.random() * cells.length)];" in block
          assert "const recent = new Set(packageVoteRecent());" in block
          assert block.index("const selectedCell =") < block.index(
              "const recent = new Set(packageVoteRecent());"
          )
          assert "left: Math.random() < 0.5 ? 'T' : 'P'" in block

          tree = ast.parse(ktc_path.read_text(encoding="utf-8"))
          prefixes = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "PACKAGE_VOTE_PREFIXES":
                          prefixes = ast.literal_eval(node.value)
                          break
              if prefixes is not None:
                  break
          assert "__pkgv6p1__|" in prefixes

          assert man["status"] == "v6p1_feasible_prospective_voting_activated"
          assert man["transport"]["daily_valid_ballot_cap_per_voter"] == 40
          assert man["transport"]["effective_lifetime_cap_per_voter"] == 40
          assert man["transport"]["one_session_completion_allowed"] is True
          assert man["maturity_contract"]["exact_effective_vote_checkpoints"] == [1800, 2000]
          assert man["maturity_contract"]["minimum_distinct_voters"] == 45
          assert man["maturity_contract"]["minimum_effective_votes_per_cell"] == 48.0
          assert man["maturity_contract"]["minimum_distinct_voters_per_cell"] == 27
          assert man["production_change_authorized"] is False

          print(
              "PASS: V6P1 40-vote transport, frozen catalog, KTC isolation, "
              "and 1,800/2,000 maturity contract are aligned."
          )
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Verify production still remains V1.6
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove exactly four intended activation files changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "scripts/market/ktc_pipeline.py",
              "scripts/validation/repo_regression_checks.py",
              "research/package-adjustment-v6/prospective_voting_activation_manifest_v1.json",
          }

          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          actual = {line[3:] for line in lines if line.strip()}

          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
