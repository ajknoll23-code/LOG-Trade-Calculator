name: Package Adjustment NextGen V2 Research Closeout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard completed M2b and M3 evidence
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          CLOSE_JSON="$D/package_adjustment_nextgen_v2_research_closeout_v1.json"
          CLOSE_MD="$D/package_adjustment_nextgen_v2_research_closeout_v1.md"
          CLOSE_MAN="$D/package_adjustment_nextgen_v2_research_closeout_manifest_v1.json"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/prospective_m2b_vs_m0_evaluation_v1.json")" = \
            "dc41bc6080bc2a36f122b2a3f9e555a328a778c7"
          test "$(git hash-object "$D/prospective_m2b_vs_m0_evaluation_manifest_v1.json")" = \
            "19eba3fb5cdca83c9f118f9fd12b5ffd2f54beff"
          test "$(git hash-object "$D/prospective_m2b_failure_diagnostic_v1.json")" = \
            "8197ce1eefb127dd17b9029084a701e47e6306a5"
          test "$(git hash-object "$D/m3_development_preregistration_v1.json")" = \
            "ff29e53ff05e1a96e47d9f91e535585d438f788f"
          test "$(git hash-object "$D/m3_development_preregistration_v1_manifest.json")" = \
            "afda67beb00a94011f0dae2bfe2549a9ba8c3cfa"
          test "$(git hash-object "$D/m3_development_fit_summary_v1.md")" = \
            "2a265205d38a0552068b54fcc0b0aa344580ab64"
          test "$(git hash-object "$D/m3_development_fit_manifest_v1.json")" = \
            "bc209507ebcf95bde6cc7b240e21b51c2a7bb42f"

          test "$(sha256sum "$D/m3_development_fit_results_v1.json" | awk '{print $1}')" = \
            "a3d5d2e4ed9f39959a6b59425a87b0587349f8e3ea34b375a96fd397f957bae1"
          test "$(sha256sum "$D/m3_development_fit_summary_v1.md" | awk '{print $1}')" = \
            "37a2a21ba6b899bd9421b1614c779ec66c98671d4d28ae9e7cde5a85aba1e498"

          test ! -e "$D/research_candidate_m3_v1.json"
          test ! -e "$D/research_candidate_m3_v1.md"

          test ! -e "$CLOSE_JSON"
          test ! -e "$CLOSE_MD"
          test ! -e "$CLOSE_MAN"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          m2 = json.loads((d / "prospective_m2b_vs_m0_evaluation_v1.json").read_text())
          m3 = json.loads((d / "m3_development_fit_results_v1.json").read_text())
          man = json.loads((d / "m3_development_fit_manifest_v1.json").read_text())

          assert m2["status"] == "prospective_validation_failed_research_only"
          assert m2["production_candidate_eligible"] is False
          assert m2["production_revision_unchanged"] == "v1.6-v5-size2-composition-overlay"

          assert m3["status"] == "no_m3_candidate_qualified_under_frozen_rules"
          assert m3["candidate_written"] is False
          assert m3["selection"]["selected_model_class"] is None
          assert m3["selection"]["eligible_candidates"] == []
          assert man["candidate_selected"] is False
          assert man["candidate_frozen"] is False
          assert man["production_revision_unchanged"] == "v1.6-v5-size2-composition-overlay"

          for model in ("M3a", "M3b", "M3c"):
              row = m3["selection"]["candidate_results"][model]
              assert row["eligible"] is False
              assert row["gates"]["combined_improvement_at_least_0_003"] is False
              assert row["gates"]["no_family_regression_exceeds_0_003"] is False
              assert row["gates"]["no_optimizer_boundary_solution"] is False
              assert row["gates"]["at_least_3_of_4_folds_positive"] is True

          print("PASS: completed research evidence supports branch closeout with no M3 candidate.")
          PY

      - name: Verify production remains V1.6 before closeout
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Write frozen research closeout
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")

          m2_eval_path = d / "prospective_m2b_vs_m0_evaluation_v1.json"
          m2_diag_path = d / "prospective_m2b_failure_diagnostic_v1.json"
          m3_prereg_path = d / "m3_development_preregistration_v1.json"
          m3_results_path = d / "m3_development_fit_results_v1.json"
          m3_summary_path = d / "m3_development_fit_summary_v1.md"
          m3_manifest_path = d / "m3_development_fit_manifest_v1.json"

          out_json = d / "package_adjustment_nextgen_v2_research_closeout_v1.json"
          out_md = d / "package_adjustment_nextgen_v2_research_closeout_v1.md"
          out_man = d / "package_adjustment_nextgen_v2_research_closeout_manifest_v1.json"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          m2 = json.loads(m2_eval_path.read_text())
          m3 = json.loads(m3_results_path.read_text())

          generated = datetime.now(timezone.utc).isoformat()

          closeout = {
              "schema_version": 1,
              "closeout_id": "pkgnv2-research-closeout-v1",
              "status": "research_closed_no_successor_candidate",
              "closed_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "production_revision_retained": "v1.6-v5-size2-composition-overlay",
              "research_branch": "package-adjustment-nextgen-v2",
              "conclusion": (
                  "Neither the frozen M2b candidate nor the preregistered M3 shrinkage/gating "
                  "candidate classes earned production eligibility. This research branch is closed."
              ),
              "m2b_prospective_result": {
                  "status": m2["status"],
                  "combined_M0_log_loss": m2["point_estimates"]["primary"]["M0_combined_log_loss"],
                  "combined_M2b_log_loss": m2["point_estimates"]["primary"]["M2b_combined_log_loss"],
                  "combined_improvement_M0_minus_M2b": (
                      m2["point_estimates"]["primary"]["improvement_M0_minus_M2b"]
                  ),
                  "minimum_required_improvement": (
                      m2["point_estimates"]["primary"]["minimum_required_improvement"]
                  ),
                  "bootstrap_favorable_fraction": (
                      m2["bootstrap"]["M2b_favorable_fraction_vs_M0"]
                  ),
                  "fragmentation_regression_M2b_minus_M0": (
                      m2["point_estimates"]["families"]["fragmentation_filler"]["regression_M2b_minus_M0"]
                  ),
                  "all_preregistered_conditions_passed": (
                      m2["pass_gate"]["all_conditions_passed"]
                  ),
              },
              "m3_development_result": {
                  "status": m3["status"],
                  "M0_cv_loss": m3["cv"]["M0"]["combined"],
                  "M2b_reference_cv_loss": m3["cv"]["M2b_reference"]["combined"],
                  "candidate_results": {
                      model: {
                          "cv_loss": m3["selection"]["candidate_results"][model]["cv_loss"],
                          "cv_improvement_vs_M0": (
                              m3["selection"]["candidate_results"][model]["cv_improvement_vs_M0"]
                          ),
                          "positive_fold_count": (
                              m3["selection"]["candidate_results"][model]["positive_fold_count"]
                          ),
                          "family_regression_vs_M0": (
                              m3["selection"]["candidate_results"][model]["family_regression_vs_M0"]
                          ),
                          "gates": m3["selection"]["candidate_results"][model]["gates"],
                          "eligible": False,
                      }
                      for model in ("M3a", "M3b", "M3c")
                  },
                  "eligible_candidates": [],
                  "selected_model_class": None,
                  "candidate_frozen": False,
              },
              "evidence_governance": {
                  "exact_900_vote_dataset_is_spent": True,
                  "existing_votes_may_not_be_reused_as_fresh_confirmation": True,
                  "no_fresh_M3_voting_should_begin": True,
                  "no_M3_candidate_exists_to_validate": True,
                  "no_parameter_tweaking_after_failed_preregistered_selection": True,
                  "no_new_candidate_should_be_created_from_this_closed_branch": True,
              },
              "future_research_rule": {
                  "package_adjustment_may_be_revisited": True,
                  "requirement": (
                      "Any future package-adjustment work must begin as a new independent research "
                      "cycle with a new hypothesis, new preregistered development plan, and fresh "
                      "confirmation evidence. It must not be represented as a continuation or rescue "
                      "of M2b/M3 using the spent 900-vote holdout."
                  ),
              },
              "operational_state": {
                  "production_should_change_now": False,
                  "production_remains_V1_6": True,
                  "additional_votes_needed_for_this_branch": False,
                  "research_branch_complete": True,
              },
              "next_action": (
                  "Archive/retain the research artifacts for provenance and continue with other "
                  "trade-calculator improvement work while production package adjustment remains V1.6."
              ),
          }

          out_json.write_text(
              json.dumps(closeout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md_lines = [
              "# Package Adjustment NextGen V2 Research Closeout",
              "",
              "**Status:** `research_closed_no_successor_candidate`",
              "",
              "The Package Adjustment NextGen V2 research branch is complete.",
              "",
              "## Final production decision",
              "",
              "**No production change.** Production remains:",
              "",
              "`v1.6-v5-size2-composition-overlay`",
              "",
              "## M2b prospective result",
              "",
              "The frozen M2b candidate failed its one-time prospective validation.",
              "",
              f"- M0 combined log loss: **{closeout['m2b_prospective_result']['combined_M0_log_loss']:.6f}**",
              f"- M2b combined log loss: **{closeout['m2b_prospective_result']['combined_M2b_log_loss']:.6f}**",
              f"- Improvement: **{closeout['m2b_prospective_result']['combined_improvement_M0_minus_M2b']:.6f}**",
              f"- Required improvement: **{closeout['m2b_prospective_result']['minimum_required_improvement']:.6f}**",
              f"- Bootstrap favorable fraction: **{closeout['m2b_prospective_result']['bootstrap_favorable_fraction']:.4f}**",
              f"- Fragmentation regression: **{closeout['m2b_prospective_result']['fragmentation_regression_M2b_minus_M0']:.6f}**",
              "",
              "M2b showed some real directional signal, but the preregistered effect-size floor and "
              "family-safety gate were not met.",
              "",
              "## M3 development result",
              "",
              "The preregistered M3 development cycle also stopped cleanly.",
              "",
              "| Model | CV loss | Improvement vs M0 | Positive folds | Eligible |",
              "|---|---:|---:|---:|---|",
              f"| M0 | {closeout['m3_development_result']['M0_cv_loss']:.6f} | — | — | baseline |",
              f"| M2b reference | {closeout['m3_development_result']['M2b_reference_cv_loss']:.6f} | "
              f"{(closeout['m3_development_result']['M0_cv_loss'] - closeout['m3_development_result']['M2b_reference_cv_loss']):.6f} | — | reference only |",
              f"| M3a | {closeout['m3_development_result']['candidate_results']['M3a']['cv_loss']:.6f} | "
              f"{closeout['m3_development_result']['candidate_results']['M3a']['cv_improvement_vs_M0']:.6f} | "
              f"{closeout['m3_development_result']['candidate_results']['M3a']['positive_fold_count']} / 4 | NO |",
              f"| M3b | {closeout['m3_development_result']['candidate_results']['M3b']['cv_loss']:.6f} | "
              f"{closeout['m3_development_result']['candidate_results']['M3b']['cv_improvement_vs_M0']:.6f} | "
              f"{closeout['m3_development_result']['candidate_results']['M3b']['positive_fold_count']} / 4 | NO |",
              f"| M3c | {closeout['m3_development_result']['candidate_results']['M3c']['cv_loss']:.6f} | "
              f"{closeout['m3_development_result']['candidate_results']['M3c']['cv_improvement_vs_M0']:.6f} | "
              f"{closeout['m3_development_result']['candidate_results']['M3c']['positive_fold_count']} / 4 | NO |",
              "",
              "No M3 model class qualified. No M3 candidate was selected or frozen.",
              "",
              "## Governance closeout",
              "",
              "The exact 900-vote dataset is spent development evidence. Do not collect fresh votes "
              "for this M3 branch because there is no frozen candidate to validate.",
              "",
              "Do not create an M4 by continuing to tune against these same results. If package adjustment "
              "is revisited later, it must start as a genuinely new research cycle with a new hypothesis, "
              "a new preregistration, and fresh confirmation evidence.",
              "",
              "The completed research artifacts remain in the repository for provenance.",
              "",
          ]
          md = "\n".join(md_lines)
          out_md.write_text(md, encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "status": "package_adjustment_nextgen_v2_research_closeout_manifest",
              "closed": True,
              "closed_at_utc": generated,
              "production_change_authorized": False,
              "production_revision_retained": "v1.6-v5-size2-composition-overlay",
              "successor_candidate_exists": False,
              "fresh_voting_authorized": False,
              "source_artifacts": {
                  "m2b_evaluation": {
                      "path": str(m2_eval_path),
                      "git_blob_sha": "dc41bc6080bc2a36f122b2a3f9e555a328a778c7",
                      "sha256": sha256(m2_eval_path),
                  },
                  "m2b_failure_diagnostic": {
                      "path": str(m2_diag_path),
                      "git_blob_sha": "8197ce1eefb127dd17b9029084a701e47e6306a5",
                      "sha256": sha256(m2_diag_path),
                  },
                  "m3_preregistration": {
                      "path": str(m3_prereg_path),
                      "git_blob_sha": "ff29e53ff05e1a96e47d9f91e535585d438f788f",
                      "sha256": sha256(m3_prereg_path),
                  },
                  "m3_fit_results": {
                      "path": str(m3_results_path),
                      "sha256": sha256(m3_results_path),
                  },
                  "m3_fit_summary": {
                      "path": str(m3_summary_path),
                      "git_blob_sha": "2a265205d38a0552068b54fcc0b0aa344580ab64",
                      "sha256": sha256(m3_summary_path),
                  },
                  "m3_fit_manifest": {
                      "path": str(m3_manifest_path),
                      "git_blob_sha": "bc209507ebcf95bde6cc7b240e21b51c2a7bb42f",
                      "sha256": sha256(m3_manifest_path),
                  },
              },
              "outputs": {
                  "closeout": {
                      "path": str(out_json),
                      "sha256": sha256(out_json),
                  },
                  "summary": {
                      "path": str(out_md),
                      "sha256": sha256(out_md),
                  },
              },
              "next_action": (
                  "Retain V1.6 in production and move to other calculator improvement work."
              ),
          }
          out_man.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: research closeout written; production remains V1.6.")
          PY

      - name: Verify closeout boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          close_path = d / "package_adjustment_nextgen_v2_research_closeout_v1.json"
          md_path = d / "package_adjustment_nextgen_v2_research_closeout_v1.md"
          man_path = d / "package_adjustment_nextgen_v2_research_closeout_manifest_v1.json"

          close = json.loads(close_path.read_text())
          man = json.loads(man_path.read_text())

          assert close["status"] == "research_closed_no_successor_candidate"
          assert close["production_change_authorized"] is False
          assert close["production_revision_retained"] == "v1.6-v5-size2-composition-overlay"
          assert close["operational_state"]["research_branch_complete"] is True
          assert close["operational_state"]["additional_votes_needed_for_this_branch"] is False
          assert close["m3_development_result"]["eligible_candidates"] == []
          assert close["m3_development_result"]["selected_model_class"] is None
          assert close["m3_development_result"]["candidate_frozen"] is False
          assert close["evidence_governance"]["no_fresh_M3_voting_should_begin"] is True

          assert man["closed"] is True
          assert man["successor_candidate_exists"] is False
          assert man["fresh_voting_authorized"] is False

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert man["outputs"]["closeout"]["sha256"] == sha256(close_path)
          assert man["outputs"]["summary"]["sha256"] == sha256(md_path)

          expected = {str(close_path), str(md_path), str(man_path)}
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          changed = {r[3:] for r in rows if len(r) >= 4}
          if changed != expected:
              raise RuntimeError(f"unexpected changed paths: {sorted(changed)}")

          print("PASS: exactly three research closeout files created.")
          PY

          git diff --check

      - name: Run repository regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Re-prove production and closeout-only boundary
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.json",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_manifest_v1.json",
          }

          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          changed = {r[3:] for r in rows if len(r) >= 4}
          if changed != expected:
              raise RuntimeError(f"unexpected changed paths after regressions: {sorted(changed)}")

          print("PASS: production remains V1.6; only research closeout files changed.")
          PY

      - name: Upload closeout proof
        uses: actions/upload-artifact@v4
        with:
          name: pkgnv2-research-closeout-v1
          path: |
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.json
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_manifest_v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit research closeout
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.json \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_manifest_v1.json

          git commit -m "Close NextGen V2 package adjustment research"

      - name: Rebase safely and verify committed boundary
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-nextgen-v2/m3_development_fit_manifest_v1.json)" = \
            "bc209507ebcf95bde6cc7b240e21b51c2a7bb42f"
          test "$(sha256sum research/package-adjustment-nextgen-v2/m3_development_fit_results_v1.json | awk '{print $1}')" = \
            "a3d5d2e4ed9f39959a6b59425a87b0587349f8e3ea34b375a96fd397f957bae1"

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.json",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_manifest_v1.json",
          }

          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", parent, head], text=True
              ).splitlines()
          )
          if changed != expected:
              raise RuntimeError(f"rebased closeout changed unexpected paths: {sorted(changed)}")
          if subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).strip():
              raise RuntimeError("working tree not clean after rebase")

          print("PASS: rebased closeout commit contains exactly three intended files.")
          PY

      - name: Push research closeout to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          git log --oneline -1
