# PREFLIGHTED: B29_V3_RECOVERY_V2_EXACT_ARTIFACT_REUSE
name: B29 Draft Capital Outlook V3 - Recovery V2 Exact-Artifact Finalization

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B29_SOURCE_RUN_ID: "36817635473"
  B29_SOURCE_HEAD_SHA: "9f453035124a48f94c7c5cc6671379281db59e35"

jobs:
  recover_and_reduce_years:
    name: Recover and reduce B29 historical year ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard B28 and no committed B29
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          b28=json.loads(Path("research/draft-capital-outlook-v3/b28/b28_manifest.json").read_text())
          assert b28["decision"]=="PASS_B28_INSTRUMENT_VALIDATION_AUTHORIZE_B29_HISTORICAL_SOURCE_AUDIT"
          assert b28["b29_historical_source_audit_authorized"] is True
          assert b28["historical_candidate_enumeration_authorized"] is True
          assert b28["2027_candidate_enumeration_authorized"] is False
          assert b28["historical_actual_capital_open_authorized"] is False
          assert b28["predictor_target_association_authorized"] is False
          assert not Path("research/draft-capital-outlook-v3/b29").exists()
          PY

      - uses: actions/download-artifact@v4
        with:
          name: b29-contract-v2
          path: /tmp/contract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - uses: actions/download-artifact@v4
        with:
          name: b29-candidates-${{ matrix.year }}
          path: /tmp/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36817635473

      - name: Verify frozen checkpoint contract
        shell: bash
        env:
          YEAR: "${{ matrix.year }}"
        run: |
          set -euo pipefail
          mkdir -p /tmp/evals /tmp/year-result
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          y=int(os.environ["YEAR"])
          c=Path("/tmp/contract/b29_execution_contract.json")
          s=Path("/tmp/contract/b29_scanner.py")
          h=Path("/tmp/contract/b29_execution_contract.sha256")
          assert c.is_file() and s.is_file() and h.is_file()
          assert hashlib.sha256(c.read_bytes()).hexdigest()==h.read_text().split()[0]
          j=json.loads(c.read_text())
          assert j["historical_years"]==list(range(2013,2027))
          assert j["operational_sharding"]["evaluation_bucket_count"]==32
          assert j["operational_sharding"]["scientific_semantics_changed"] is False
          assert j["2027_enumeration_authorized"] is False
          assert j["historical_actual_capital_open_authorized"] is False
          assert j["predictor_target_association_authorized"] is False
          m=Path(f"/tmp/candidate/candidates_{y}.json")
          assert m.is_file(),m
          mj=json.loads(m.read_text())
          assert mj["class_year"]==y
          assert mj["evaluation_bucket_count"]==32
          print({"year":y,"candidates":len(mj["candidates"])})
          PY

