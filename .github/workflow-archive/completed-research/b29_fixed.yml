      - name: Identify truly missing retained buckets
        id: missing
        shell: bash
        env:
          YEAR: "${{ matrix.year }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          y=int(os.environ["YEAR"])
          present={int(p.stem.rsplit("_",1)[1]) for p in Path("/tmp/evals").glob(f"eval_{y}_*.json")}
          assert present.issubset(set(range(32))),present
          missing=[b for b in range(32) if b not in present]
          Path("/tmp/missing.json").write_text(json.dumps(missing)+"\n")
          print({"year":y,"reused":len(present),"missing":missing})
          PY

