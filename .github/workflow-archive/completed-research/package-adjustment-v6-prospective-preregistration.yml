name: Package Adjustment V6 Prospective Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen V6 lineage and unused prospective surface
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/development_preregistration_v1.json")" = \
            "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/development_exact_700_frozen_v1.json")" = \
            "fd7097335bebae209bb380c121f44debf7d0cb82"
          test "$(git hash-object "$D/development_evaluation_v1.json")" = \
            "adfc1f289e7d12c74749eadc9d5b63f8651165d3"
          test "$(git hash-object "$D/development_candidate_v1.json")" = \
            "446a176757919be3deef0659ac01e05884be4007"
          test "$(git hash-object "$D/prospective_power_analysis_v1.json")" = \
            "c6348c91ecebf02112c7cc61320e065e68471735"
          test "$(git hash-object "$D/prospective_power_analysis_manifest_v1.json")" = \
            "5545d420f761aba5de6fb419667051af867950d5"

          for p in \
            "$D/prospective_preregistration_v1.json" \
            "$D/prospective_preregistration_v1.md" \
            "$D/prospective_preregistration_manifest_v1.json"
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          cand = json.loads((d / "development_candidate_v1.json").read_text())
          power = json.loads((d / "prospective_power_analysis_v1.json").read_text())
          pman = json.loads((d / "prospective_power_analysis_manifest_v1.json").read_text())

          assert cand["status"] == "v6_frozen_development_candidate"
          assert cand["selected_model_class"] == "C2"
          assert cand["frozen"] is True
          assert cand["fresh_prospective_confirmation_required"] is True
          assert cand["parameters_may_not_change_after_freeze"] is True
          assert cand["production_change_authorized"] is False

          assert power["status"] == "PROSPECTIVE_CHECKPOINT_SELECTED"
          assert power["selected_first_prospective_effective_vote_checkpoint"] == 13200
          assert power["prospective_catalog_generated"] is False
          assert power["prospective_votes_exist_or_read"] is False
          assert power["power_design"]["minimum_worthwhile_primary_improvement"] == 0.005
          assert power["power_design"]["target_joint_power"] == 0.80

          assert pman["prospective_catalog_generated"] is False
          assert pman["prospective_outcomes_read"] is False
          assert pman["selected_first_prospective_effective_vote_checkpoint"] == 13200

          print("PASS: frozen C2 candidate and 13,200-vote power checkpoint are intact.")
          PY

      - name: Verify production remains V1.6 before preregistration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze fresh V6 prospective confirmation plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          D = Path("research/package-adjustment-v6")

          CFG_PATH = D / "development_preregistration_v1.json"
          DATA_PATH = D / "development_exact_700_frozen_v1.json"
          EVAL_PATH = D / "development_evaluation_v1.json"
          CANDIDATE_PATH = D / "development_candidate_v1.json"
          POWER_PATH = D / "prospective_power_analysis_v1.json"
          POWER_MANIFEST_PATH = D / "prospective_power_analysis_manifest_v1.json"

          OUT = D / "prospective_preregistration_v1.json"
          OUT_MD = D / "prospective_preregistration_v1.md"
          OUT_MANIFEST = D / "prospective_preregistration_manifest_v1.json"

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          candidate = json.loads(CANDIDATE_PATH.read_text())
          power = json.loads(POWER_PATH.read_text())

          checkpoint = int(
              power["selected_first_prospective_effective_vote_checkpoint"]
          )
          assert checkpoint == 13200

          q = float(candidate["frozen_parameters"]["structural_parameters"][0])
          c2_log_beta = float(candidate["frozen_parameters"]["log_beta"])
          c2_beta = float(candidate["frozen_parameters"]["beta"])
          c2_delta = float(candidate["frozen_parameters"]["delta_left"])

          c1 = power["frozen_C1_prospective_baseline_calibration"]
          c1_log_beta = float(c1["log_beta"])
          c1_beta = float(c1["beta"])
          c1_delta = float(c1["delta_left"])

          # Coverage gates preserve the same conservative proportions used by the
          # previous prospective framework, scaled to the 13,200-vote checkpoint:
          #
          # old prospective design: 900 total, 30 voters, 15 eff/cell, 10 voters/cell
          # new exact checkpoint:   13,200 / 900 = 14.666...
          #
          # 30 * scale = 440 minimum voters (also mathematically necessary under
          # the 30-effective-vote lifetime cap)
          # 15 * scale = 220 effective votes/cell
          # 10 * scale = 146.666... -> ceil to 147 voters/cell
          scale = checkpoint / 900.0
          min_distinct_voters = 440
          min_effective_per_cell = 220.0
          min_voters_per_cell = 147

          assert abs(scale - 14.666666666666666) < 1e-12
          assert min_distinct_voters * 30 == checkpoint

          generated = datetime.now(timezone.utc).isoformat()

          prereg = {
              "schema_version": 1,
              "plan_id": "package-adjustment-v6-prospective-confirmation-v1",
              "status": "frozen_v6_prospective_preregistration",
              "frozen": True,
              "research_only": True,
              "production_candidate": False,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "production_revision_must_remain": (
                  "v1.6-v5-size2-composition-overlay"
              ),
              "preregistered_before_prospective_catalog_generation": True,
              "preregistered_before_prospective_outcomes_exist": True,
              "preregistered_before_prospective_voting_activation": True,
              "candidate": {
                  "candidate_id": candidate["candidate_id"],
                  "selected_model_class": "C2",
                  "interpretation_scope": (
                      "1-vs-3 player-only package utility only; this does not validate "
                      "a universal power norm for 2-vs-3, multi-vs-multi, picks, or "
                      "other topologies"
                  ),
                  "q": q,
                  "ScorePackage": "(sum(v_i**q))**(1/q)",
                  "ScoreTarget": "target_fv",
                  "log_beta": c2_log_beta,
                  "beta": c2_beta,
                  "delta_left": c2_delta,
                  "v_ref": 5401.0,
                  "refitting_allowed": False,
                  "recalibration_allowed": False,
                  "parameter_tuning_allowed": False,
                  "source_git_blob_sha": (
                      "446a176757919be3deef0659ac01e05884be4007"
                  ),
                  "source_sha256": sha256(CANDIDATE_PATH),
              },
              "baseline": {
                  "model_id": "C1",
                  "name": "frozen_production_v1_6",
                  "scoring_semantics": (
                      "exact V1.6 1-vs-3 behavior: V4 size3 multiplier inside its "
                      "frozen 45/33/22 envelope; raw fail-closed outside"
                  ),
                  "size3_multiplier": 2.0512371846911357,
                  "size3_composition_envelope": {
                      "largestMin": 0.41991319353657897,
                      "largestMax": 0.4696171986399035,
                      "middleMin": 0.30827026434134036,
                      "middleMax": 0.36725409193118236,
                      "smallestMin": 0.2120186203977994,
                      "smallestMax": 0.2247276896617619,
                  },
                  "log_beta": c1_log_beta,
                  "beta": c1_beta,
                  "delta_left": c1_delta,
                  "v_ref": 5401.0,
                  "refitting_allowed": False,
                  "recalibration_allowed": False,
                  "parameter_tuning_allowed": False,
                  "calibration_frozen_by_power_analysis": True,
              },
              "fresh_prospective_catalog_contract": {
                  "catalog_id": "package-adjustment-v6-prospective-catalog-v1",
                  "generation_must_occur_after_this_preregistration_freeze": True,
                  "source_fv_snapshot_must_be_frozen_and_hashed": True,
                  "source_fv_snapshot_time": (
                      "after_preregistration_freeze_before_voting_activation"
                  ),
                  "player_assets_only": True,
                  "draft_picks_allowed": False,
                  "values_visible_to_voter": False,
                  "evaluation_only_all_challenges": True,
                  "fit_eligible_challenges": 0,
                  "required_cell_count": 24,
                  "composition_profiles": [
                      "45/33/22",
                      "50/30/20",
                      "50/25/25",
                      "55/30/15",
                      "60/25/15",
                      "60/20/20",
                  ],
                  "apex_target_levels": [0.70, 0.80, 0.90, 0.97],
                  "cell_definition": (
                      "composition_profile x apex_piece_to_target_target"
                  ),
                  "minimum_fresh_target_count": 21,
                  "target_positions_required": [
                      "QB", "RB", "WR", "TE", "DL", "LB", "DB"
                  ],
                  "exact_trade_signature_overlap_with_development_catalog_allowed": False,
                  "duplicate_trade_signatures_within_prospective_catalog_allowed": False,
                  "embedded_asset_fv_frozen_for_entire_prospective_study": True,
                  "challenge_selection_may_not_use": [
                      "development_vote_outcomes",
                      "prospective_vote_outcomes",
                      "C2_predicted_choice_probability",
                      "C1_predicted_choice_probability",
                      "C2_minus_C1_score_gap",
                      "model_agreement_or_disagreement",
                      "candidate_advantage_rank",
                      "statistical_significance",
                  ],
                  "challenge_selection_may_use": [
                      "frozen_source_asset_eligibility",
                      "frozen_raw_fv",
                      "player_position",
                      "preregistered_composition_profile",
                      "preregistered_apex_target_level",
                      "deterministic_seed",
                      "exact_trade_signature_nonoverlap_with_development_catalog",
                  ],
                  "candidate_formula_may_only_be_used_during_catalog_generation_for": (
                      "post-generation validation that every challenge is numerically "
                      "valid; candidate prediction magnitude may not rank, select, or "
                      "retain challenges"
                  ),
                  "generator_must_refuse_freeze_if_contract_not_satisfied": True,
              },
              "prospective_transport_and_sampling_contract": {
                  "transport_version": 1,
                  "vote_prefix": "__pkgv6p1__|",
                  "meta_prefix": "__pkgv6p1_meta__|",
                  "schema_marker": "__pkgv6p1_schema__|1",
                  "canonical_choices": ["T", "P"],
                  "canonical_left_sides": ["T", "P"],
                  "activation_requires_separate_workflow": True,
                  "activation_manifest_must_record_valid_ballot_start_utc": True,
                  "rows_at_or_before_activation_cutoff_are_invalid": True,
                  "development_V6_transport_rows_are_ineligible": True,
                  "valid_ballot_timestamp_rule": (
                      "timestamp_strictly_after_activation_valid_ballot_start_utc"
                  ),
                  "voter_roster_may_filter_challenge_eligibility": False,
                  "cell_probability": 1.0 / 24.0,
                  "selection_order": [
                      "choose_one_of_24_cells_uniformly",
                      "choose_challenge_uniformly_within_selected_cell",
                      "apply_recent-memory_filter_only_after_cell_selection",
                      "if_cell_recent_filter_empty_fallback_to_full_selected_cell",
                      "display_side_randomized_50_50",
                  ],
                  "recent_history_scope": "within_already_selected_cell_only",
                  "adaptive_sampling_from_outcomes_allowed": False,
                  "adaptive_sampling_from_model_performance_allowed": False,
                  "fv_visible_to_voter": False,
              },
              "prospective_evidence_maturity_and_stopping": {
                  "monitor_must_be_outcome_blind": True,
                  "first_checkpoint_effective_votes": checkpoint,
                  "exact_checkpoints_effective_votes": [checkpoint],
                  "hard_cap_effective_votes": checkpoint,
                  "stop_at_exact_checkpoint_if_all_coverage_gates_pass": True,
                  "if_exact_checkpoint_reached_without_coverage": (
                      "prospective_evidence_unresolved_no_production_candidacy"
                  ),
                  "daily_valid_vote_cap_per_voter": 20,
                  "prospective_effective_lifetime_cap_per_voter": 30.0,
                  "ballot_weight": (
                      "min(1,30/valid_post_daily_cap_V6P1_ballot_count_for_voter)"
                  ),
                  "required_cell_count": 24,
                  "minimum_distinct_voters": min_distinct_voters,
                  "minimum_effective_votes_per_cell": min_effective_per_cell,
                  "minimum_distinct_voters_per_cell": min_voters_per_cell,
                  "coverage_gate_derivation": {
                      "reference_prior_prospective_total_effective_votes": 900,
                      "reference_prior_minimum_distinct_voters": 30,
                      "reference_prior_minimum_effective_votes_per_cell": 15,
                      "reference_prior_minimum_distinct_voters_per_cell": 10,
                      "scale_factor": scale,
                      "new_minimum_distinct_voters": min_distinct_voters,
                      "new_minimum_effective_votes_per_cell": min_effective_per_cell,
                      "new_minimum_distinct_voters_per_cell": min_voters_per_cell,
                      "rounding_rule_for_voters_per_cell": "ceiling",
                  },
                  "continuation_or_stopping_may_use_only": [
                      "total_effective_vote_count",
                      "distinct_voter_count",
                      "per_cell_effective_vote_count",
                      "per_cell_distinct_voter_count",
                  ],
                  "continuation_or_stopping_may_not_use": [
                      "vote_choice_direction",
                      "C2_performance",
                      "C1_performance",
                      "C2_minus_C1_improvement",
                      "bootstrap_results",
                      "confidence_bounds",
                      "statistical_significance",
                      "model_agreement",
                  ],
                  "previous_development_voters_may_participate": True,
                  "prospective_independence_basis": (
                      "future_time_period plus fresh nonoverlapping challenge catalog "
                      "plus separate V6P1 transport namespace"
                  ),
              },
              "prospective_evaluation_contract": {
                  "evaluation_occurs_once_after_exact_maturity_freeze": True,
                  "no_cross_validation": True,
                  "no_fitting": True,
                  "no_refitting": True,
                  "no_recalibration": True,
                  "no_parameter_tuning": True,
                  "no_model_selection": True,
                  "prediction_parameters_are_exactly_frozen_above": True,
                  "choice_probability": (
                      "logistic(beta * (ScorePackage - ScoreTarget) / 5401 "
                      "+ delta_left * I(package_displayed_left))"
                  ),
                  "primary_metric": (
                      "equal_cell_macro_mean_log_loss_across_all_24_prospective_cells"
                  ),
                  "primary_difference_definition": (
                      "D_overall = LL_C2 - LL_C1; lower is better"
                  ),
                  "minimum_practical_improvement": 0.005,
                  "primary_point_gate": "D_overall <= -0.005",
                  "primary_uncertainty_gate": (
                      "one-sided 95% upper confidence bound for D_overall < 0"
                  ),
                  "safety_family_definition": "composition_profile",
                  "safety_families": {
                      "45/33/22": {
                          "one_sided_95_percent_upper_bound_must_be_below": 0.003
                      },
                      "50/30/20": {
                          "one_sided_95_percent_upper_bound_must_be_below": 0.005
                      },
                      "50/25/25": {
                          "one_sided_95_percent_upper_bound_must_be_below": 0.005
                      },
                      "55/30/15": {
                          "one_sided_95_percent_upper_bound_must_be_below": 0.005
                      },
                      "60/25/15": {
                          "one_sided_95_percent_upper_bound_must_be_below": 0.005
                      },
                      "60/20/20": {
                          "one_sided_95_percent_upper_bound_must_be_below": 0.005
                      },
                  },
                  "uncertainty_method": {
                      "method": (
                          "crossed/two-way voter-and-challenge cluster resampling "
                          "for paired fixed-prediction C2-minus-C1 log-loss differences"
                      ),
                      "valid_draws": 5000,
                      "max_attempts": 50000,
                      "seed": 20260924,
                      "cluster_multiplicity_scales_frozen_original_ballot_weight": True,
                      "lifetime_cap_reapplied_inside_draw": False,
                      "model_parameters_refit_inside_draw": False,
                      "draw_invalid_if_any_required_prospective_cell_missing": True,
                      "report_one_sided_95_percent_upper_bounds": True,
                      "report_90_percent_and_95_percent_percentile_intervals": True,
                  },
                  "all_pass_conditions_required": True,
                  "pass_status": (
                      "v6_prospective_confirmation_passed_research_candidate_eligible_for_separate_human_production_decision"
                  ),
                  "fail_status": (
                      "v6_prospective_confirmation_failed_research_only"
                  ),
                  "unresolved_status": (
                      "v6_prospective_confirmation_unresolved_research_only"
                  ),
              },
              "governance": {
                  "development_votes_are_spent": True,
                  "development_evidence_may_not_be_confirmation": True,
                  "candidate_parameters_may_not_change_after_this_freeze": True,
                  "baseline_parameters_may_not_change_after_this_freeze": True,
                  "new_candidate_variant_requires_new_preregistration_and_fresh_evidence": True,
                  "prospective_pass_does_not_automatically_promote_candidate": True,
                  "prospective_pass_does_not_modify_production": True,
                  "separate_human_approved_production_decision_required": True,
                  "exact_named_motivating_trade_may_not_be_used_for_tuning": True,
              },
              "power_analysis_lineage": {
                  "status": power["status"],
                  "selected_first_prospective_effective_vote_checkpoint": checkpoint,
                  "target_joint_power": power["power_design"]["target_joint_power"],
                  "estimated_joint_power_at_selected_checkpoint": next(
                      x["joint_pass_power"]
                      for x in power["power_table_until_selection_or_cap"]
                      if x["effective_vote_checkpoint"] == checkpoint
                  ),
                  "minimum_worthwhile_primary_improvement": (
                      power["power_design"]["minimum_worthwhile_primary_improvement"]
                  ),
                  "source_git_blob_sha": (
                      "c6348c91ecebf02112c7cc61320e065e68471735"
                  ),
                  "source_sha256": sha256(POWER_PATH),
              },
              "required_sequence_after_this_freeze": [
                  "generate_and_freeze_fresh_V6P1_prospective_catalog",
                  "validate_catalog_without_vote_outcomes_or_model_based_selection",
                  "activate_V6P1_transport_and_exact_24_cell_sampler",
                  "collect_future_votes_under_outcome_blind_exact_13200_stopping",
                  "freeze_exact_13200_mature_prospective_evidence",
                  "evaluate_frozen_C2_vs_frozen_C1_once",
                  "if_and_only_if_all_gates_pass_require_separate_human_approved_production_decision",
              ],
              "this_workflow_scope": {
                  "purpose": "freeze_plan_before_any_prospective_exposure",
                  "prospective_catalog_generated": False,
                  "prospective_voting_activated": False,
                  "prospective_ballots_read": False,
                  "model_evaluation_performed": False,
                  "browser_modified": False,
                  "production_modified": False,
              },
          }

          OUT.write_text(
              json.dumps(prereg, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = "\n".join([
              "# Package Adjustment V6 Prospective Preregistration",
              "",
              "**Status:** `frozen_v6_prospective_preregistration`",
              "",
              "Production remains `v1.6-v5-size2-composition-overlay`.",
              "",
              "## Frozen confirmation target",
              "",
              "- Candidate: **C2**",
              f"- q: **{q:.6f}**",
              f"- First and only exact maturity checkpoint: **{checkpoint:,} effective votes**",
              "- Minimum distinct voters: **440**",
              "- Minimum effective votes per cell: **220**",
              "- Minimum distinct voters per cell: **147**",
              "- Required cells: **24 / 24**",
              "",
              "The 13,200-vote checkpoint comes directly from the frozen Monte Carlo "
              "power analysis. Coverage thresholds preserve the conservative proportions "
              "of the prior prospective framework, scaled to the larger checkpoint.",
              "",
              "## One-time prospective pass gates",
              "",
              "- Combined equal-cell macro log-loss improvement of at least **0.005** versus C1.",
              "- One-sided 95% upper confidence bound for overall C2-minus-C1 loss is **< 0**.",
              "- 45/33/22 one-sided 95% upper bound is **< +0.003**.",
              "- Every other composition profile one-sided 95% upper bound is **< +0.005**.",
              "- All conditions must pass; there is no refitting, retuning, or second model selection.",
              "",
              "## Independence",
              "",
              "The future catalog must be generated after this freeze, may not overlap exact "
              "development trade signatures, and may not use C2/C1 predictions or development "
              "vote outcomes to rank or select challenges. V6P1 uses a new transport namespace.",
              "",
              "## Next action",
              "",
              "Generate and freeze the fresh V6P1 prospective catalog. Do not activate voting "
              "until that catalog has been validated and frozen.",
              "",
          ])
          OUT_MD.write_text(md, encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "status": "package_adjustment_v6_prospective_preregistration_manifest",
              "generated_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "production_revision_unchanged": (
                  "v1.6-v5-size2-composition-overlay"
              ),
              "prospective_catalog_generated": False,
              "prospective_outcomes_read": False,
              "prospective_voting_activated": False,
              "selected_exact_effective_vote_checkpoint": checkpoint,
              "source_artifacts": {
                  "development_preregistration": {
                      "path": str(CFG_PATH),
                      "git_blob_sha": (
                          "81f20cb8afd78f624153c3337377f56ebf8115ae"
                      ),
                      "sha256": sha256(CFG_PATH),
                  },
                  "frozen_development_evidence": {
                      "path": str(DATA_PATH),
                      "git_blob_sha": (
                          "fd7097335bebae209bb380c121f44debf7d0cb82"
                      ),
                      "sha256": sha256(DATA_PATH),
                  },
                  "development_evaluation": {
                      "path": str(EVAL_PATH),
                      "git_blob_sha": (
                          "adfc1f289e7d12c74749eadc9d5b63f8651165d3"
                      ),
                      "sha256": sha256(EVAL_PATH),
                  },
                  "frozen_candidate": {
                      "path": str(CANDIDATE_PATH),
                      "git_blob_sha": (
                          "446a176757919be3deef0659ac01e05884be4007"
                      ),
                      "sha256": sha256(CANDIDATE_PATH),
                  },
                  "prospective_power_analysis": {
                      "path": str(POWER_PATH),
                      "git_blob_sha": (
                          "c6348c91ecebf02112c7cc61320e065e68471735"
                      ),
                      "sha256": sha256(POWER_PATH),
                  },
                  "prospective_power_manifest": {
                      "path": str(POWER_MANIFEST_PATH),
                      "git_blob_sha": (
                          "5545d420f761aba5de6fb419667051af867950d5"
                      ),
                      "sha256": sha256(POWER_MANIFEST_PATH),
                  },
              },
              "outputs": {
                  "preregistration": {
                      "path": str(OUT),
                      "sha256": sha256(OUT),
                  },
                  "summary": {
                      "path": str(OUT_MD),
                      "sha256": sha256(OUT_MD),
                  },
              },
              "next_action": (
                  "Generate and freeze the fresh V6P1 prospective catalog under the "
                  "frozen candidate-blind contract before activating any voting."
              ),
          }

          OUT_MANIFEST.write_text(
