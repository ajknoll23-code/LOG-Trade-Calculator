          assert m['R43_tier_only_test_loss_reproduction_pass'] is True
          assert m['historical_seasons']==[2013,2025]
          assert m['R43_holdout_validation_horizons']==[1,2,3]
          assert m['R42_H4_out_of_sample_validation'] is False
          assert m['LOG_complete_QB_scoring_config_verified'] is False
          assert m['independent_dated_historical_preseason_projection_series_verified'] is False
          assert m['numeric_FV_price_authorized'] is False and m['production_change_authorized'] is False
          assert m['index_html_modified'] is False
          assert m['2026_realized_weeks_read'] is False
          assert m['2026_weeks_8_to_12_holdout_read'] is False
          assert m['2026_weeks_13_to_18_holdout_read'] is False
          assert m['owner_QB_price_targets_used_as_fit_labels'] is False
          assert m['DLF_or_MV_used_as_FV_fit_targets'] is False
          assert m['tier_transfer_sample']['n']==31
          assert len(m['outputs_sha256'])==5
          for file,digest in m['outputs_sha256'].items():
              f=root/file; assert f.exists() and f.stat().st_size>50
              assert hashlib.sha256(f.read_bytes()).hexdigest()==digest
          with (root/'CAL26_V1R44_historical_validation_scoring_scenarios.csv').open() as f:
              assert len(list(csv.DictReader(f)))==36
          with (root/'CAL26_V1R44_scoring_annual.csv').open() as f:
