# QF6 / A5-F04 — mandatory 17-starter completeness, exact source and visible-UI audit.
# READ ONLY. No branch, no commit, no PR, no Pages deployment, no model changes.
# Phase 0 GREEN proves issue and surface; it does not close A5-F04.
name: QF6 Phase 0 - Team Utility 17-Starter Completeness and Visible UI Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf6-a5f04-readonly:
    name: Reproduce incomplete starter and trace actual rendered UI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QF6_TMP: /tmp/log-qf6-phase0
      QF6_REPORT_DIR: /tmp/log-qf6-phase0/report
      QF6_QF5_BASE: '84b6a3f9e3f2e247a8863bcb8bf702038eff2e5e'
    steps:
      - name: Checkout triggering main exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only regressions and Chrome dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Fail closed on source code drift, checkout and QF5 ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP checkout wrong main revision'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main advanced'; exit 1; }
          git merge-base --is-ancestor "${QF6_QF5_BASE}" HEAD || { echo 'STOP QF5 production lineage not ancestor'; exit 1; }
          check_blob(){
            local path="$1" expected="$2" got
            got="$(git hash-object "$path")"
            [[ "$got" == "$expected" ]] || { echo "STOP code source drift: $path=$got"; exit 1; }
          }
          check_blob index.html '2666f7f8b167e48b7d1571ab527450b521d32c75'
          check_blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
          check_blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
          echo 'PASS pinned QF6 source: canonical index, projection runtime and regression harness; QF5 ancestor'
      - name: Stage isolated exact-source reproduction scripts in runner scratch
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${QF6_TMP}" "${QF6_REPORT_DIR}"
          cat > "${QF6_TMP}/repro.js" <<'QF6_REPRO_JS'
          'use strict';
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const index = fs.readFileSync('index.html','utf8');
          const runtime = fs.readFileSync('scripts/team_utility_projection_runtime.js','utf8');

          const begin = 'const TU_DEDICATED_SLOTS = [';
          const end = 'function findBuriedTalent(';
          assert.equal(index.split(begin).length,2,'inline optimizer begin anchor must be unique');
          assert.equal(index.split(end).length,2,'inline optimizer end anchor must be unique');
          const inline = index.slice(index.indexOf(begin),index.indexOf(end));
          assert.ok(inline.includes('function tuOptimizeLineup('));
          assert.ok(inline.includes('function calculateTeamUtility('));
          const runtimeEnd='})(typeof window !== \'undefined\' ? window : globalThis);';
          assert.ok(runtime.includes(runtimeEnd),'projection runtime closure anchor changed');
          const runtimeIife=runtime.slice(0,runtime.indexOf(runtimeEnd)+runtimeEnd.length);

          const positions = [['QB',2],['RB',3],['WR',3],['TE',2],['K',1],['DL',4],['LB',4],['DB',4]];
          const full = []; let serial=0;
          for (const [pos,n] of positions) for(let i=0;i<n;i++) {
            serial += 1;
            full.push({key:`qf6_${pos}_${i}`,pos,value:3000-serial,lineupProjection:200-serial,starterEligible:true});
          }
          assert.ok(full.length > 17);
          const db = Object.fromEntries(full.map(p=>[p.key,{pos:p.pos}]));
          const scores=Object.fromEntries(full.map(p=>[p.key,p.value]));
          const context={PLAYER_DB:db,playerValueByKey:key=>scores[key], console, process:{argv:[]}};
          vm.createContext(context);
          vm.runInContext(inline,context,{filename:'index.html:actual-TeamUtility-source'});
          vm.runInContext(runtimeIife,context,{filename:'scripts/team_utility_projection_runtime.js:actual-IIFE'});
          const legacy=context.tuOptimizeLineup;
          const proj=context.TD_TEAM_UTILITY_RUNTIME_API.optimizeLineup;
          const legacyUtility=context.calculateTeamUtility;
          const projectedUtility=context.TD_TEAM_UTILITY_RUNTIME_API.calculateTeamUtilityV1;
          assert.equal(typeof legacy,'function');
          assert.equal(typeof proj,'function');
          const preKeys=full.map(p=>p.key);
          const slotMap=Object.fromEntries(full.map(p=>[p.key,'bench']));
          const cases = [
            {label:'complete_17',players:full,expect:17,missing:[]},
            {label:'missing_K',players:full.filter(x=>x.pos!=='K'),expect:16,missing:['K']},
            {label:'missing_LB',players:full.filter(x=>x.pos!=='LB'||x.key.endsWith('_0')),expect:16,missing:['LB']},
            {label:'superflex_uses_RB_WR_TE',players:full.filter(x=>x.key!=='qf6_QB_1'),expect:17,missing:[]},
            {label:'idp_flex_valid_after_two_DL_removals',players:full.filter(x=>x.pos!=='DL'||Number(x.key.split('_').at(-1))<2),expect:17,missing:[]},
          ];
          // Independently walk declared slot taxonomy to name missing slots. Do not
          // change the optimizers or confuse a low-value bench player with an open slot.
          function independentDeficits(players){
            let pool=players.map(x=>({...x})); const misses=[];
            const mandatory=[['QB',1],['RB',2],['WR',2],['TE',1],['DL',2],['LB',2],['DB',2],['K',1]];
            const flex=[['FLEX',['RB','WR','TE'],1],['SUPER_FLEX',['QB','RB','WR','TE'],1],['IDP_FLEX',['DL','LB','DB'],2]];
            for(const [pos,n] of mandatory) for(let k=0;k<n;k++){
              const i=pool.findIndex(p=>p.starterEligible&&p.pos===pos);
              if(i<0) misses.push(pos); else pool.splice(i,1);
            }
            for(const [name,eligible,n] of flex) for(let k=0;k<n;k++){
              const i=pool.findIndex(p=>p.starterEligible&&eligible.includes(p.pos));
              if(i<0) misses.push(name); else pool.splice(i,1);
            }
            return misses;
          }
          const results=[];
          for(const c of cases){
            const legacyCount=legacy(c.players).starters.length;
            const runtimeCount=proj(c.players).starters.length;
            const misses=independentDeficits(c.players);
            assert.equal(legacyCount,c.expect,`legacy ${c.label}`);
            assert.equal(runtimeCount,c.expect,`projection runtime ${c.label}`);
            assert.deepEqual(misses,c.missing,`slot diagnosis ${c.label}`);
            assert.equal(c.expect+misses.length,17,`17-slot invariant ${c.label}`);
            const afterKeys=c.players.map(p=>p.key);
            const legacyOutcome=legacyUtility(preKeys,afterKeys);
            const projectionOutcome=projectedUtility(preKeys,afterKeys,slotMap);
            assert.equal(typeof legacyOutcome.teamUtility,'number');
            assert.equal(typeof projectionOutcome.teamUtility,'number');
            for(const outcome of [legacyOutcome,projectionOutcome]) {
              assert.ok(!Object.hasOwn(outcome,'missingSlots'),`unexpected completeness diagnostic already exists ${c.label}`);
              assert.ok(!Object.hasOwn(outcome,'preStarterCount'),`unexpected starter count already exists ${c.label}`);
              assert.ok(!Object.hasOwn(outcome,'postStarterCount'),`unexpected starter count already exists ${c.label}`);
            }
            results.push({scenario:c.label,rosterPlayers:c.players.length,legacyStarters:legacyCount,projectionStarters:runtimeCount,requiredStarters:17,missingSlots:misses,legacyUtilityDelta:legacyOutcome.teamUtility,projectionUtilityDelta:projectionOutcome.teamUtility,completenessFieldsPresent:false});
          }
          const status={status:'PASS_READ_ONLY_REPRODUCTION_MISSING_WARNING_NOT_FIXED',issue:'A5-F04',source:'exact committed inline and external projection runtime code',fixtures:results};
          const output=path.join(process.env.QF6_REPORT_DIR||'/tmp/qf6-phase0','qf6_reproduction.json');
          fs.mkdirSync(path.dirname(output),{recursive:true});
          fs.writeFileSync(output,JSON.stringify(status,null,2)+'\n');
          console.log('PASS QF6 real legacy and projection optimizers: 17/17 full; 16/17 missing K; 16/17 missing LB; legal Superflex and IDP flex');
          console.log('PASS QF6 independent missing slot diagnosis: K, LB; both utility APIs emit numeric deltas without completeness fields');
          QF6_REPRO_JS
          cat > "${QF6_TMP}/ui.py" <<'QF6_UI_PY'
          """QF6 Phase 0 real headless Chrome UI visibility probe; read-only."""
          import json
          import os
          import re
          import threading
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          report_dir = Path(os.environ.get('QF6_REPORT_DIR', '/tmp/qf6-phase0'))
          index = Path('index.html').read_text(encoding='utf-8')
          required_tokens = [
              'function renderTradeImpact(){',
              'Team Utility: <span',
              'TEAM_IMPACT_UI_RETIRED_V1',
              "impactShell.hidden = true;",
              "impactShell.setAttribute('aria-hidden', 'true');",
              'const tuBeforeRoster = tuActiveRosterKeys();',
              'const teamUtil = calculateTeamUtility(tuBeforeRoster, tuAfterPool);',
              "moveLabeledTarget(teamPane, 'needsWrap');",
              "appendIf(teamPane, document.getElementById('fullRosterDetails'));",
          ]
          for token in required_tokens:
              assert token in index, f'QF6 STOP source UI routing/hidden marker missing: {token}'

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *args):
                  pass

          server=ThreadingHTTPServer(('127.0.0.1', 0), partial(QuietHandler,directory=str(Path.cwd())))
          thread = threading.Thread(target=server.serve_forever,daemon=True)
          thread.start()
          opts=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1280,900']:
              opts.add_argument(arg)
          # No external browser telemetry and no GitHub mutation.
          opts.add_experimental_option('excludeSwitches',['enable-logging'])

          try:
              with webdriver.Chrome(options=opts) as driver:
                  driver.set_page_load_timeout(45)
                  driver.get(f'http://127.0.0.1:{server.server_port}/index.html')
                  WebDriverWait(driver, 25).until(lambda d: d.execute_script("return !!document.querySelector('.td-retired-team-impact') && !!document.querySelector('.td-tab-pane[data-tab=\"team\"]')"))
                  observed=driver.execute_script('''
                    const impact=document.getElementById('tradeImpactWrap');
                    const shell=impact && impact.closest('.td-retired-team-impact');
                    const tabs=Array.from(document.querySelectorAll('.td-tab-pane')).map(x=>({tab:x.dataset.tab,hidden:x.hidden}));
                    const team=document.querySelector('.td-tab-pane[data-tab="team"]');
                    const needs=document.getElementById('needsWrap');
                    const roster=document.getElementById('fullRosterDetails');
                    const visible=node=>!!node && !node.hidden && getComputedStyle(node).display!=='none' && !node.closest('[hidden]');
                    return {legacyImpactExists:!!impact,legacyImpactRetired:!!shell,legacyImpactHidden:!!(shell&&shell.hidden),legacyImpactAriaHidden:shell&&shell.getAttribute('aria-hidden'),legacyImpactComputedDisplay:shell&&getComputedStyle(shell).display,tabState:tabs,teamResearchHasNeeds:!!(team&&needs&&team.contains(needs)),teamResearchHasRoster:!!(team&&roster&&team.contains(roster)),impactVisible:visible(impact)};
                  ''')
                  assert observed['legacyImpactExists']
                  assert observed['legacyImpactRetired']
                  assert observed['legacyImpactHidden']
                  assert observed['legacyImpactAriaHidden']=='true'
                  assert observed['impactVisible'] is False
                  assert observed['teamResearchHasNeeds'] and observed['teamResearchHasRoster']
                  driver.execute_script('''const tab=document.querySelector('[data-td-tab="team"]'); if(tab)tab.click();''')
                  after=driver.execute_script('''
                     const team=document.querySelector('.td-tab-pane[data-tab="team"]');
                     const shell=document.querySelector('.td-retired-team-impact');
                     return {teamTabActive:!!team&&!team.hidden,teamTabAriaHidden:team&&team.getAttribute('aria-hidden'),impactStillHidden:!!shell&&shell.hidden};
                  ''')
                  assert after['teamTabActive'] and after['impactStillHidden']
                  observed['afterSwitchToTeamResearch']=after
                  output={'status':'PASS_READ_ONLY_UI_TRACE_HIDDEN_LEGACY_IMPACT','page':'index.html local headless Chrome','observed':observed,'decision':'Do not add warning only to retired Trade Impact shell; select a genuinely visible consumer for future change.','production_change_authorized':False}
                  report_dir.mkdir(parents=True, exist_ok=True)
                  (report_dir/'qf6_ui_visibility.json').write_text(json.dumps(output,indent=2)+'\n',encoding='utf-8')
                  print('PASS QF6 real Chrome: Trade Impact shell hidden and aria-hidden; Team Research tab becomes visible; legacy impact remains retired')
          finally:
              server.shutdown()
              server.server_close()
          QF6_UI_PY
          node --check "${QF6_TMP}/repro.js"
          python3 - <<'PY'
          import ast,os
          from pathlib import Path
          p=Path(os.environ['QF6_TMP'])/'ui.py'
          ast.parse(p.read_text(encoding='utf-8'))
          print('PASS QF6 embedded Node syntax + Python parse')
          PY
      - name: Replay both real Team Utility lineup optimizers with complete and missing-starter rosters
        shell: bash
        run: |
          set -euo pipefail
          node "${QF6_TMP}/repro.js"
          node scripts/team_utility_projection_runtime.js --selftest
      - name: Trace B56 hidden Trade Impact and visible Team Research using real headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 "${QF6_TMP}/ui.py"
      - name: Run existing repository regression controls without changing code
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
      - name: Final no-mutation guard and write concise findings report
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP checkout modified'; git status --short; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main moved during audit'; exit 1; }
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ['QF6_REPORT_DIR'])
          a=json.loads((d/'qf6_reproduction.json').read_text())
          b=json.loads((d/'qf6_ui_visibility.json').read_text())
          assert len(a['fixtures'])==5
          assert a['fixtures'][1]['missingSlots']==['K']
          assert a['fixtures'][2]['missingSlots']==['LB']
          assert b['observed']['legacyImpactHidden']
          rows=['# QF6 Phase 0 / A5-F04 read-only closeout', '',
                '**Verdict: PASS evidence collection; A5-F04 remains OPEN.**','',
                f"- Source commit: `{os.environ['GITHUB_SHA']}`",
                '- Both real Team Utility optimizers return 16/17 when the only kicker is absent; the scalar utility API has no completeness metadata.',
                '- Missing-LB fixture also returns 16/17; complete, Superflex and IDP flex controls return 17/17.',
                '- Real headless Chrome verifies the old `tradeImpactWrap` is nested in a retired, hidden, aria-hidden container even on Team Research.',
                '- Team Research contains the visible roster-needs and full-roster surfaces; no mandatory-starter warning is currently wired there.',
                '- Next stage: propose one clearly visible diagnostic surface without reviving the retired panel; do not alter 17-slot optimizer/frozen FV.',
                '- No production patch, branch, data write or promotion authorized by this green.', '', '## Synthetic fixture results', '',
                '| Scenario | Legacy starters | Projection starters | Required | Missing slot labels |',
                '|---|---:|---:|---:|---|']
          for x in a['fixtures']:
              rows.append(f"| {x['scenario']} | {x['legacyStarters']} | {x['projectionStarters']} | 17 | {', '.join(x['missingSlots']) or 'none'} |")
          rows.extend(['', '## UI probe', '', '```json',json.dumps(b['observed'],indent=2),'```',''])
          (d/'qf6_phase0_findings.md').write_text('\n'.join(rows),encoding='utf-8')
          print('PASS QF6 PHASE 0 READ-ONLY: 16/17 reproduced, hidden legacy panel confirmed, no production change; A5-F04 OPEN')
          PY
      - name: Upload small read-only QF6 evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QF6-phase0-A5F04-readonly-evidence
          path: /tmp/log-qf6-phase0/report/
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy audit scratch outputs
        if: always()
        shell: bash
        run: rm -rf /tmp/log-qf6-phase0
