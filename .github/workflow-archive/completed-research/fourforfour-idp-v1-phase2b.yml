      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove workflow changed nothing in repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Phase 2B changed repository files:" >&2
            git status --short >&2
            exit 1
          fi
          echo "PASS: repository remains byte-clean; Phase 2B is research-only."

      - name: Destroy private inputs and temporary preregistration output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-idp-v1
          rm -f /tmp/fourforfour-phase2b.py /tmp/fourforfour-phase2b.py.b64
          echo "Private 4for4 inputs and temporary Phase 2B files destroyed."
