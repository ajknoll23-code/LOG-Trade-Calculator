name: 4for4 IDP V1 - Phase 2B Prospective Validation Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-validation-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Enforce pre-Week-2 freeze deadline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          deadline = datetime(2026, 9, 18, 0, 15, 0, tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          if now >= deadline:
              raise SystemExit(
                  f"ERROR: Phase 2B freeze deadline passed: now={now.isoformat()}, "
                  f"deadline={deadline.isoformat()}"
              )
          print(f"PASS: preregistration is before Week 2 kickoff; now={now.isoformat()}")
          PY

      - name: Verify exact Phase 2A public snapshots and frozen code
        shell: bash
        run: |
          set -euo pipefail

          check_sha256() {
            expected="$1"
            path="$2"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: SHA-256 drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
            echo "PASS sha256 $path $actual"
          }

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git-blob drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
            echo "PASS git-blob $path $actual"
          }

          check_sha256 3da23f6168576c789de86690fc059d0a33b2b0bb096ace2ec4eb9ba0d94237cb             scripts/fantasypros_api_normalized_2026.json
          check_sha256 ee577f745416d375938fbdbdf28f1dfbf9f304f6c9d5cedc62733b12c52cb4e0             scripts/artifacts/generated/sleeper_2026_raw_categories.json
          check_sha256 9ba70abae4f5f1946471b7cf3827db0a4c9cb7967b131c2c33d0073e692126eb             scripts/identity_crosswalk.json

          check_blob 50dddd078eec10b955c29f3f5fab239b56f19438             scripts/projections/fourforfour_projection_pipeline.py
          check_blob d25c46243184d031651a80bda26cbdc05aa50419             scripts/model/idp_v1_projection.py

      - name: Verify exact private 4for4 snapshots outside repository
        shell: bash
        run: |
          set -euo pipefail

          for var in FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret $var is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-fourforfour-idp-v1/input
          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc             > /tmp/log-fourforfour-idp-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc             > /tmp/log-fourforfour-idp-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc             > /tmp/log-fourforfour-idp-v1/input/db.csv
          chmod 600 /tmp/log-fourforfour-idp-v1/input/*.csv

          echo "a8ae4a3dc3ed7e24e102e9416467826dd93441cc6b18c0589ed8345aeca977f6  /tmp/log-fourforfour-idp-v1/input/dl.csv" | sha256sum --check --strict
          echo "957e3c03b604302d259393d3cd3c637d03ff15b6a51812bb23cc0d10830a8321  /tmp/log-fourforfour-idp-v1/input/lb.csv" | sha256sum --check --strict
          echo "7bc8fb440f171bc65ab82e4c2cf1ed88e4b53a6f64868461ac8a96cb08d9b079  /tmp/log-fourforfour-idp-v1/input/db.csv" | sha256sum --check --strict

          python3 - <<'PY'
          import csv
          from pathlib import Path

          expected_rows = {"dl.csv": 250, "lb.csv": 136, "db.csv": 262}
          required = {
              "Player", "Team", "Bye", "Position", "FF Pts", "Snap %",
              "Tackles", "Assists", "Sacks", "TFL", "QBH", "INT", "PD",
              "FFum", "FR", "Safety", "DefTD",
          }
          root = Path("/tmp/log-fourforfour-idp-v1/input")
          for name, expected in expected_rows.items():
              with (root / name).open(newline="", encoding="utf-8-sig") as fh:
                  reader = csv.DictReader(fh)
                  missing = required - set(reader.fieldnames or [])
                  rows = list(reader)
              if missing:
                  raise SystemExit(f"ERROR: {name} missing columns: {sorted(missing)}")
              if len(rows) != expected:
                  raise SystemExit(f"ERROR: {name} row count {len(rows)} != {expected}")
              print(f"PASS {name}: {len(rows)} rows; schema intact")
          PY

      - name: Verify incumbent IDP V1 self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/model/idp_v1_projection.py

