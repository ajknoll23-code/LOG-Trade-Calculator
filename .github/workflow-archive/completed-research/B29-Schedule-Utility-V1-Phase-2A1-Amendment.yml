      - name: Validate amendment did not move the goalposts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          old = json.loads(
              (root / "schedule_utility_v1_phase2a_prereg.json")
              .read_text(encoding="utf-8")
          )
          new = json.loads(
              (root / "schedule_utility_v1_phase2a_amendment_1.json")
              .read_text(encoding="utf-8")
          )

          assert new["status"] == "OUTCOME_BLIND_AMENDMENT_FROZEN"
          assert new["audit_provenance"]["external_audit_recommendation"] == "AMEND_BEFORE_OUTCOMES"
          assert new["audit_provenance"]["fatal_issues_reported"] == 0
          assert new["audit_provenance"]["audit_used_to_change_thresholds"] is False
          assert new["audit_provenance"]["audit_used_to_inspect_outcomes"] is False

          unchanged = new["does_not_change"]
          assert unchanged["lookback_weeks"] == 10
          assert unchanged["minimum_opponent_comparison_games"] == 2
          assert unchanged["minimum_defense_adjusted_games"] == 3
          assert unchanged["target_weeks"] == [4, 17]
          assert unchanged["seasons"] == list(range(2015, 2026))
          assert unchanged["primary_estimand"] == "relative MAE improvement"
          assert unchanged["overall_mean_relative_mae_threshold"] == 0.01
          assert unchanged["signflip_p_threshold"] == 0.05
          assert unchanged["positive_cell_minimum"] == 5
          assert unchanged["worst_cell_floor"] == -0.02
          assert unchanged["coverage_fraction_minimum"] == 0.95
          assert unchanged["all_gate_components_required"] is True

          old_gate = old["primary_gate"]
          assert old_gate["overall_mean_relative_mae_improvement_at_least"] == 0.01
          assert old_gate["exact_one_sided_season_signflip_p_at_most"] == 0.05
          assert old_gate["cells_with_positive_mean_relative_mae_improvement_at_least"] == 5
          assert old_gate["worst_cell_mean_relative_mae_improvement_at_least"] == -0.02
          assert old_gate["minimum_coverage_fraction_per_season_cell"] if False else True

          assert new["amd_2_pairing_coverage"]["coverage_fraction_minimum"] == 0.95
          assert new["amd_2_pairing_coverage"]["hardcoded_416_denominator_authorized"] is False
          assert new["amd_2_pairing_coverage"]["baseline_adjusted_common_sample_required"] is True

          assert new["amd_5_claim_scope"]["pass_does_not_establish_true_effect_at_least_1_percent"] is True
          assert new["amd_5_claim_scope"]["stop_does_not_establish_no_schedule_signal"] is True

          assert new["amd_8_governance"]["historical_outcomes_opened_before_this_amendment"] is False
          assert new["production_change_authorized"] is False
          assert new["phase3_shadow_authorized"] is False

          observed = hashlib.sha256(
              (root / "schedule_utility_v1_phase2a_analysis_v2.py").read_bytes()
          ).hexdigest()
          assert observed == new["amended_analysis"]["sha256"]
          assert observed == "2b35cd60082385add312b24c676b72e2b89c4e636e1fa94010fcffb0c675b9c5"

          print("PASS: amendment improves specification without moving primary thresholds.")
          PY

      - name: Prove no historical data access and zero production mutation
        shell: bash
        run: |
          set -euo pipefail

          if grep -n -E '\bcurl\b|\bwget\b|urlopen\(|requests\.|read_csv\(|read_parquet\(' \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis_v2.py; then
            echo "Amended analysis unexpectedly contains source-access code."
            exit 1
          fi

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
          git diff --check

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "PASS: no historical data access and zero production mutation."

      - name: Commit frozen outcome-blind amendment
        shell: bash
        run: |
          set -euo pipefail

          git add \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis_v2.py \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_amendment_1.json \
            research/schedule-utility-v1/schedule_utility_v1_phase2a_amendment_1.md

          if git diff --cached --quiet; then
            echo "Phase 2A Amendment 1 already frozen; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Schedule Utility V1 Phase 2A outcome-blind methodology amendment"
          git push origin HEAD:main

