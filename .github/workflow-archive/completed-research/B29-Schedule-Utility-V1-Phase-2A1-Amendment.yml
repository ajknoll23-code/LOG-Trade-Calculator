          (root / "schedule_utility_v1_phase2a_amendment_1.json").write_text(
              json.dumps(amendment, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Schedule Utility V1 — Phase 2A Amendment 1",
              "",
              "**Decision:** `OUTCOME_BLIND_AMENDMENT_FROZEN`",
              "",
