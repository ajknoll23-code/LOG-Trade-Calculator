          import json
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          amendment = {'schema_version': 1, 'study_id': 'schedule-utility-v1', 'phase': '2A-amendment-1', 'status': 'OUTCOME_BLIND_AMENDMENT_FROZEN', 'supersedes_only': ['information_cutoff_implementation_detail', 'coverage_denominator_and_pairing_detail', 'source_schema_position_scoring_detail', 'zero_stat_completeness_detail', 'claim_scope_and_test_description', 'cell_weight_disclosure', 'secondary_diagnostic_catalog', 'post_stop_governance', 'phase2a_analysis_implementation'], 'does_not_change': {'log_sapa_predictor_construction': True, 'lookback_weeks': 10, 'minimum_opponent_comparison_games': 2, 'minimum_defense_adjusted_games': 3, 'target_weeks': [4, 17], 'seasons': [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], 'primary_estimand': 'relative MAE improvement', 'season_weighting': 'equal', 'cell_weighting': 'equal across 7 cells', 'one_sided_exact_season_signflip': True, 'overall_mean_relative_mae_threshold': 0.01, 'signflip_p_threshold': 0.05, 'positive_cell_minimum': 5, 'worst_cell_floor': -0.02, 'coverage_fraction_minimum': 0.95, 'all_gate_components_required': True}, 'audit_provenance': {'external_outcome_blind_audit_sha256': '986ff856bd44f1ed3579cafa67d7303b65b947b7b22d12386040edd414c6de73', 'external_audit_recommendation': 'AMEND_BEFORE_OUTCOMES', 'fatal_issues_reported': 0, 'major_items_reported': 5, 'audit_used_to_change_thresholds': False, 'audit_used_to_inspect_outcomes': False}, 'amd_1_information_cutoff': {'target_week_definition': 'schedule source regular-season week label W', 'week_cutoff': 'earliest actual kickoff timestamp among regular-season games labeled scheduled Week W', 'predictor_candidate_rule': 'candidate game must have candidate scheduled week in [max(1,W-10), W-1] AND actual kickoff strictly earlier than the Week-W cutoff', 'postponed_prior_week_game_after_cutoff': 'EXCLUDE_FROM_PREDICTOR_AND_LOG', 'postponed_target_game': 'remains a target if ultimately played; predictor remains frozen at the cutoff of its schedul