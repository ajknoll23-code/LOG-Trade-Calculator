name: B6 Draft Class Strength V1 - Option D Historical Target and Formal V0
"on":
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen B5 contract
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json
        from pathlib import Path
        D=Path("research/draft-class-strength-v1")
        m=json.loads((D/"b5_manifest.json").read_text())
        p=json.loads((D/"b5_option_d_historical_fundamental_target_preregistration.json").read_text())
        s=json.loads((D/"b5_option_d_population_source_gate.json").read_text())
        b6=json.loads((D/"b5_b6_execution_contract.json").read_text())
        assert m["decision"]=="PASS_B5_OPTION_D_PREREGISTRATION_FROZEN_B6_NEXT"
        assert m["formal_option_d_v0_not_yet_run"] is True
        assert m["option_d_extended_outcomes_read"] is False
        assert m["2027_class_scored"] is False
        assert m["production_change_authorized"] is False
        for name,expected in m["output_hashes"].items():
            got=hashlib.sha256((D/name).read_bytes()).hexdigest()
            assert got==expected,(name,expected,got)
        assert p["decision"]=="FREEZE_OPTION_D_FUNDAMENTAL_CLASS_TALENT_ARCHITECTURE"
        assert p["historical_range_contract"]["candidate_years"]==list(range(2010,2024))
        assert p["outcome_sorted_target_contract"]["required_top_n"]==48
        assert p["formal_v0_next_stage"]["permutations"]==50000
        assert p["formal_v0_next_stage"]["reliability_bootstrap"]["replicates"]==10000
        assert s["decision"]=="FREEZE_PRE_OUTCOME_POPULATION_BRANCH_RULE"
        assert s["branch_switch_after_outcomes_forbidden"] is True
        assert s["h3o2_extended_outcomes_read"] is False
        assert b6["decision"]=="B6_AUTHORIZED_ONLY_UNDER_FROZEN_OPTION_D_CONTRACT"
        assert b6["2027_must_remain_blind"] is True
        assert b6["production_change_authorized"] is False
        print("PASS: exact B5 contract and hashes guarded.")
        PY
    - name: Build drafted population and freeze UDFA branch before outcomes
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from __future__ import annotations
        import csv, hashlib, json
        from collections import defaultdict
        from pathlib import Path
        import requests

        OUT=Path("/tmp/b6-source"); OUT.mkdir(parents=True, exist_ok=True)
        YEARS=list(range(2010,2024)); PRIMARY={"QB","RB","WR","TE"}
        URLS={
        "draft_picks.csv":"https://github.com/nflverse/nflverse-data/releases/download/draft_picks/draft_picks.csv",
        "players.csv":"https://github.com/nflverse/nflverse-data/releases/download/players/players.csv",
        "db_playerids.csv":"https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv",
        }
        def fetch(name,url):
            r=requests.get(url,timeout=120,headers={"User-Agent":"LOG-DCS-B6-SourceGate/1.0"})
            r.raise_for_status(); p=OUT/name; p.write_bytes(r.content)
            return {"url":url,"sha256":hashlib.sha256(r.content).hexdigest(),"bytes":len(r.content)}
        meta={n:fetch(n,u) for n,u in URLS.items()}
        def clean(v):
            s=str(v or "").strip()
            return None if s.upper() in {"","NA","N/A","NULL","NONE","NAN"} else s
        def intish(v):
            s=clean(v)
            if not s:return None
            try:return int(float(s))
            except ValueError:return None
        def npos(v):
            s=(clean(v) or "").upper()
            return {"FB":"RB"}.get(s,s)

        players_gsis={}; players_pfr={}
        with (OUT/"players.csv").open(newline="",encoding="utf-8-sig") as f:
            rd=csv.DictReader(f); fields=set(rd.fieldnames or [])
            assert {"gsis_id","display_name","position","pfr_id"}<=fields,fields
            birth="birth_date" if "birth_date" in fields else "birthdate"
            assert birth in fields,fields
            for row in rd:
                rec={"gsis_id":clean(row.get("gsis_id")),"pfr_id":clean(row.get("pfr_id")),
                     "name":clean(row.get("display_name")),"position":npos(row.get("position")),
                     "birth_date":clean(row.get(birth))}
                if rec["gsis_id"]:players_gsis[rec["gsis_id"]]=rec
                if rec["pfr_id"]:players_pfr[rec["pfr_id"]]=rec

        dp_g=defaultdict(set); dp_p=defaultdict(set); dp_undrafted=0
        with (OUT/"db_playerids.csv").open(newline="",encoding="utf-8-sig") as f:
            rd=csv.DictReader(f); fields=set(rd.fieldnames or [])
            assert {"gsis_id","sleeper_id"}<=fields,fields
            for row in rd:
                sid=clean(row.get("sleeper_id")); gsis=clean(row.get("gsis_id")); pfr=clean(row.get("pfr_id"))
                if sid and gsis:dp_g[gsis].add(sid)
                if sid and pfr:dp_p[pfr].add(sid)
                dy=intish(row.get("draft_year")); dr=intish(row.get("draft_round"))
                if dy in YEARS and dr in (None,0):dp_undrafted+=1
        dp_g={k:next(iter(v)) for k,v in dp_g.items() if len(v)==1}
        dp_p={k:next(iter(v)) for k,v in dp_p.items() if len(v)==1}

        rows=[]; seen=set()
        with (OUT/"draft_picks.csv").open(newline="",encoding="utf-8-sig") as f:
            rd=csv.DictReader(f); fields=set(rd.fieldnames or [])
            req={"season","round","pick","gsis_id","pfr_player_id","pfr_player_name","position"}
            assert req<=fields,(req-fields,sorted(fields))
            for row in rd:
                y=intish(row.get("season"))
                if y not in YEARS:continue
                p=npos(row.get("position"))
                if p not in PRIMARY:continue
                rnd=intish(row.get("round")); pick=intish(row.get("pick"))
                if rnd is None or pick is None:continue
                key=(y,pick); assert key not in seen,key; seen.add(key)
                gsis=clean(row.get("gsis_id")); pfr=clean(row.get("pfr_player_id"))
                pr=players_gsis.get(gsis) if gsis else None
                if not pr and pfr:pr=players_pfr.get(pfr)
                pr=pr or {}
                sid=dp_g.get(gsis) if gsis else None
                if not sid and pfr:sid=dp_p.get(pfr)
                rows.append({"draft_year":y,"draft_round":rnd,"draft_pick":pick,
                             "stable_id":gsis or pfr or f"draft:{y}:{pick}",
                             "gsis_id":gsis,"pfr_id":pfr,"sleeper_id":sid,
                             "name":clean(row.get("pfr_player_name")) or pr.get("name"),
                             "position":p,"birth_date":pr.get("birth_date")})

        overall_n=len(rows); overall_sid=sum(bool(x["sleeper_id"]) for x in rows); overall_birth=sum(bool(x["birth_date"]) for x in rows)
        by_year={}; gate=True
        for y in YEARS:
            yy=[x for x in rows if x["draft_year"]==y]; n=len(yy)
            sid=sum(bool(x["sleeper_id"]) for x in yy); birth=sum(bool(x["birth_date"]) for x in yy)
            stable=sum(bool(x["stable_id"]) for x in yy)
            sc=sid/n if n else 0; bc=birth/n if n else 0; ic=stable/n if n else 0
            ok=(n>=48 and ic==1.0 and sc>=0.90 and bc>=0.90); gate=gate and ok
            by_year[str(y)]={"drafted_primary_position_n":n,"stable_identity_coverage":ic,
                             "sleeper_id_coverage":sc,"birth_date_coverage":bc,"source_gate_pass":ok}
        osid=overall_sid/overall_n if overall_n else 0; obirth=overall_birth/overall_n if overall_n else 0
        gate=gate and osid>=0.95 and obirth>=0.95
        population={
        "schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_preoutcome_population_source_gate",
        "candidate_years":YEARS,"primary_positions":["QB","RB","WR","TE"],
        "population_branch":"DRAFTED_ONLY_PRIMARY_UDFA_SENSITIVITY",
        "udfa_branch_A_gate_pass":False,
        "udfa_branch_A_failure_reason":"No approved exhaustive outcome-independent UDFA signing registry covers every 2010-2023 class. DynastyProcess remains an identity crosswalk, not a complete UDFA population frame.",
        "source_gate_thresholds":{"drafted_primary_position_n_ge_each_year":48,"stable_identity_coverage_each_year":1.0,
        "sleeper_id_coverage_each_year_ge":0.90,"sleeper_id_coverage_overall_ge":0.95,
        "birth_date_coverage_each_year_ge":0.90,"birth_date_coverage_overall_ge":0.95},
        "source_gate_pass":gate,"overall":{"drafted_primary_position_n":overall_n,"sleeper_id_coverage":osid,
        "birth_date_coverage":obirth,"dynastyprocess_undrafted_rows_observed_diagnostic_only":dp_undrafted},
        "by_year":by_year,"source_files":meta,"players":rows,
        "h3o2_extended_outcomes_read":False,"predictor_data_read":False,"2027_class_scored":False,"production_change_authorized":False}
        (OUT/"population_source_gate.json").write_text(json.dumps(population,indent=2,sort_keys=True)+"\n")
        print(json.dumps({"population_branch":population["population_branch"],"source_gate_pass":gate,
        "overall_drafted_n":overall_n,"overall_sleeper_id_coverage":osid,"overall_birth_date_coverage":obirth,
        "udfa_branch_A_gate_pass":False},indent=2))
        PY
    - name: Upload frozen pre-outcome source artifact
      uses: actions/upload-artifact@v4
      with:
        name: dcs-b6-preoutcome-source
        path: /tmp/b6-source/
        if-no-files-found: error
        retention-days: 30
  season_score:
    name: Score historical NFL season ${{ matrix.season }}
    needs: source_gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        season:
        - 2010
        - 2011
        - 2012
        - 2013
        - 2014
        - 2015
        - 2016
        - 2017
        - 2018
        - 2019
        - 2020
        - 2021
        - 2022
        - 2023
        - 2024
        - 2025
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download frozen pre-outcome source
      uses: actions/download-artifact@v4
      with:
        name: dcs-b6-preoutcome-source
        path: /tmp/b6-source
    - name: Score season with frozen Sleeper scoring provider
      shell: bash
      env:
        SEASON: ${{ matrix.season }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from __future__ import annotations
        import csv, hashlib, importlib.util, json, os, time
        from collections import Counter, defaultdict
        from pathlib import Path
        import requests

        SEASON=int(os.environ["SEASON"]); assert 2010<=SEASON<=2025
        SRC=Path("/tmp/b6-source"); OUT=Path("/tmp/b6-season"); OUT.mkdir(parents=True,exist_ok=True)
        pop=json.loads((SRC/"population_source_gate.json").read_text())
        assert pop["h3o2_extended_outcomes_read"] is False and pop["2027_class_scored"] is False
        def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
        for name,m in pop["source_files"].items():assert sha(SRC/name)==m["sha256"]
        def clean(v):
            s=str(v or "").strip()
            return None if s.upper() in {"","NA","N/A","NULL","NONE","NAN"} else s
        def npos(v):
            s=(clean(v) or "").upper()
            return {"FB":"RB"}.get(s,s)
        dp=defaultdict(set)
        with (SRC/"db_playerids.csv").open(newline="",encoding="utf-8-sig") as f:
            rd=csv.DictReader(f)
            for row in rd:
                g=clean(row.get("gsis_id")); sid=clean(row.get("sleeper_id"))
                if g and sid:dp[g].add(sid)
        dp={k:next(iter(v)) for k,v in dp.items() if len(v)==1}

        rurl=f"https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_{SEASON}.csv"
        rr=requests.get(rurl,timeout=120,headers={"User-Agent":f"LOG-DCS-B6-Roster-{SEASON}/1.0"})
        roster_ok=rr.status_code==200; rsha=hashlib.sha256(rr.content).hexdigest() if roster_ok else None
        roster_map={}; rdiag={}
        if roster_ok:
            rp=Path(f"/tmp/roster_{SEASON}.csv"); rp.write_bytes(rr.content)
            cand=defaultdict(list)
            with rp.open(newline="",encoding="utf-8-sig") as f:
                rd=csv.DictReader(f); fields=set(rd.fieldnames or [])
                req={"season","position","gsis_id"}
                if not req<=fields:
                    roster_ok=False; rdiag["schema_missing"]=sorted(req-fields)
                else:
                    for row in rd:
                        try:sy=int(float(str(row.get("season") or "").strip()))
                        except ValueError:continue
                        if sy!=SEASON:continue
                        p=npos(row.get("position"))
                        if p not in {"QB","RB","WR","TE"}:continue
                        g=clean(row.get("gsis_id")); sid=clean(row.get("sleeper_id"))
                        if not sid and g:sid=dp.get(g)
                        if sid:cand[sid].append(p)
                    for sid,arr in cand.items():
                        c=Counter(arr).most_common()
                        if c and not(len(c)>1 and c[0][1]==c[1][1]):roster_map[sid]=c[0][0]
                    rdiag["mapped_sleeper_id_n"]=len(roster_map)

        score_path=Path("research/roster-economics/historical_weekly_points_pipeline.py")
        spec=importlib.util.spec_from_file_location(f"dcs_b6_score_{SEASON}",score_path)
        mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
        required=set(range(1,19 if SEASON>=2021 else 18))
        totals={}; nonempty=set(); endpoints=[]; errors=[]
        session=requests.Session(); session.headers["User-Agent"]=f"LOG-DCS-B6-Sleeper-{SEASON}/1.0"
        for week in range(1,19):
            url=f"https://api.sleeper.app/v1/stats/nfl/regular/{SEASON}/{week}"
            obj=None; status=None; raw=b""; last=None
            for attempt,wait in enumerate((1,2,4,8),1):
                try:
                    r=session.get(url,timeout=45); status=r.status_code
                    if SEASON<=2020 and week==18 and status==404:obj={};raw=b"{}";break
                    r.raise_for_status();raw=r.content;parsed=r.json()
                    if not isinstance(parsed,dict):raise RuntimeError("non-object JSON")
                    obj=parsed;break
                except Exception as e:
                    last=e
                    if attempt<4:time.sleep(wait)
            if obj is None:
                errors.append({"week":week,"status":status,"error":f"{type(last).__name__}: {last}"});obj={}
            if obj:nonempty.add(week)
            active=0
            for pid,stats in obj.items():
                if not isinstance(stats,dict):continue
                try:is_active=float(stats.get("gp") or 0)>=1
                except (TypeError,ValueError):is_active=False
                if not is_active:continue
                sid=str(pid); pts=float(mod.score_week(stats)); rec=totals.setdefault(sid,{"games":0,"season_total":0.0})
                rec["games"]+=1;rec["season_total"]+=pts;active+=1
            endpoints.append({"week":week,"status":status,"nonempty":bool(obj),"top_level_n":len(obj),"active_player_n":active,
                              "sha256":hashlib.sha256(raw).hexdigest() if raw else None})
            time.sleep(0.05)

        players={};mapped=0
        for sid,rec in totals.items():
            p=roster_map.get(sid);mapped+=bool(p)
            players[sid]={"games":int(rec["games"]),"season_total":round(float(rec["season_total"]),8),"season_position":p}
        missing=sorted(required-nonempty); cov=mapped/len(players) if players else 0.0
        ok=roster_ok and not missing and bool(players) and cov>=0.90
        payload={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_calendar_season_h3o2_source",
        "season":SEASON,"provider":"Sleeper historical weekly NFL stats","scoring_file":str(score_path),
        "scoring_file_sha256":sha(score_path),"roster_source":{"url":rurl,"http_ok":roster_ok,"sha256":rsha},
        "required_weeks":sorted(required),"nonempty_required_weeks":sorted(required&nonempty),"missing_required_weeks":missing,
        "transport_errors":errors,"active_player_n":len(players),"season_position_mapped_active_n":mapped,
        "season_position_mapping_coverage":cov,"availability_pass":ok,"players":players,"weekly_endpoints":endpoints,
        "2027_class_scored":False,"production_change_authorized":False}
        (OUT/f"season_{SEASON}.json").write_text(json.dumps(payload,separators=(",",":"))+"\n")
        print(json.dumps({"season":SEASON,"availability_pass":ok,"active_player_n":len(players),
        "position_mapping_coverage":cov,"missing_required_weeks":missing,"transport_error_n":len(errors)},indent=2))
        PY
    - name: Upload season artifact
      uses: actions/upload-artifact@v4
      with:
        name: dcs-b6-season-${{ matrix.season }}
        path: /tmp/b6-season/season_${{ matrix.season }}.json
        if-no-files-found: error
        retention-days: 30
  reduce:
    name: B6 formal Option D V0 and bridge
    needs:
    - source_gate
    - season_score
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Fail on operational job failure
      shell: bash
      env:
        SOURCE_RESULT: ${{ needs.source_gate.result }}
        SEASON_RESULT: ${{ needs.season_score.result }}
      run: |
        set -euo pipefail
        test "$SOURCE_RESULT" = "success" || { echo "ERROR: source gate operational failure: $SOURCE_RESULT"; exit 1; }
        test "$SEASON_RESULT" = "success" || { echo "ERROR: season score operational failure: $SEASON_RESULT"; exit 1; }
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture reducer base SHA
      id: base
      shell: bash
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Download pre-outcome source
      uses: actions/download-artifact@v4
      with:
        name: dcs-b6-preoutcome-source
        path: /tmp/b6-source
    - name: Download all season artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: dcs-b6-season-*
        path: /tmp/b6-seasons
        merge-multiple: true
    - name: Construct Option D target and run formal V0
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from __future__ import annotations
        import importlib.util, json, math, random, statistics
        from collections import defaultdict
        from datetime import date
        from pathlib import Path

        ROOT=Path.cwd(); D=ROOT/"research/draft-class-strength-v1"; SRC=Path("/tmp/b6-source"); SD=Path("/tmp/b6-seasons")
        pre=json.loads((D/"b5_option_d_historical_fundamental_target_preregistration.json").read_text())
        b5m=json.loads((D/"b5_manifest.json").read_text())
        old=json.loads((D/"phase0a_initial_realized_target_panel.json").read_text())
        pop=json.loads((SRC/"population_source_gate.json").read_text())
        YEARS=pre["historical_range_contract"]["candidate_years"]; PRIMARY=tuple(pre["player_scope_contract"]["positions_primary"])
        assert YEARS==list(range(2010,2024)) and PRIMARY==("QB","RB","WR","TE")
        assert pop["population_branch"]=="DRAFTED_ONLY_PRIMARY_UDFA_SENSITIVITY"
        arts={}
        for s in range(2010,2026):
            p=SD/f"season_{s}.json";assert p.exists(),p
            a=json.loads(p.read_text());assert a["season"]==s and a["provider"]=="Sleeper historical weekly NFL stats"
            arts[s]=a
        availability={str(s):{"availability_pass":bool(a["availability_pass"]),"missing_required_weeks":a["missing_required_weeks"],
        "position_mapping_coverage":a["season_position_mapping_coverage"],"active_player_n":a["active_player_n"]} for s,a in arts.items()}

        def write_final(obj):
            (D/"b6_formal_option_d_result.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
            print(json.dumps(obj,indent=2))
        if not pop["source_gate_pass"]:
            write_final({"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_formal_option_d",
            "decision":"STOP_B6_PREOUTCOME_DRAFTED_SOURCE_IDENTITY_GATE","population_branch":pop["population_branch"],
            "population_source_gate_pass":False,"season_availability":availability,"complete_class_n":0,
            "formal_v0_run":False,"bridge_run":False,"predictor_source_feasibility_authorized":False,
            "predictor_fit_performed":False,"2027_class_scored":False,"production_change_authorized":False})
            raise SystemExit(0)

        v5=json.loads((ROOT/"research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json").read_text())
        bridge=v5["frozen_scale_bridge"]; age_path=ROOT/"scripts/validation/snapshot_values.py"
        spec=importlib.util.spec_from_file_location("dcs_b6_age",age_path); age_mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(age_mod)
        h3=pre["h3o2_value_contract"]; weights={k:float(v) for k,v in h3["position_weights_primary_subset"].items()}
        ranks={k:int(v) for k,v in h3["replacement_ranks_primary_subset"].items()}
        prod=bridge["production_transform"]; age_cfg={"age_curve":bridge["age_curve"],"qb_post_peak_floor":float(bridge["qb_post_peak_floor"]),
        "lb_post_peak_decay_power":float(bridge["lb_post_peak_decay_power"])}; base=float(h3["o2_scale"]["base_scale"])
        def clamp(v,lo,hi):return max(lo,min(hi,v))
        def sched(s):return 17 if s>=2021 else 16
        def age_sep1(b,s):
            d=date.fromisoformat(str(b)[:10]);a=date(s,9,1);return a.year-d.year-((a.month,a.day)<(d.month,d.day))

        baselines={};bfail=[]
        for s,a in arts.items():
            if not a["availability_pass"]:continue
            by=defaultdict(list)
            for sid,r in a["players"].items():
                p=r.get("season_position")
                if p not in PRIMARY or int(r["games"])<3:continue
                by[p].append((float(r["season_total"])/int(r["games"]),sid))
            bb={}
            for p in PRIMARY:
                arr=sorted(by[p],key=lambda x:(-x[0],x[1]));rank=ranks[p]
                if len(arr)<rank:bfail.append({"season":s,"position":p,"eligible_n":len(arr),"required_rank":rank});continue
                bb[p]={"rank":rank,"replacement_ppg":arr[rank-1][0],"eligible_n":len(arr)}
            if len(bb)==len(PRIMARY):baselines[s]=bb

        class_players=defaultdict(list)
        for row in pop["players"]:
            y=int(row["draft_year"]);p=row["position"];sid=row.get("sleeper_id");birth=row.get("birth_date")
            req=[y,y+1,y+2]; season_ready=all(s in baselines and arts[s]["availability_pass"] for s in req)
            annual=[];flags=[]
            if not season_ready:flags.append("required_h3_season_unavailable")
            if not birth:flags.append("missing_birth_date")
            if not sid:flags.append("missing_sleeper_id")
            if season_ready and birth and sid:
                for s in req:
                    rec=arts[s]["players"].get(str(sid)) if sid else None;games=int(rec["games"]) if rec else 0;total=float(rec["season_total"]) if rec else 0.0
                    denom=float(baselines[s][p]["replacement_ppg"])*sched(s)
                    realized=float(prod["zero_games_override"]) if games==0 else clamp(float(prod["intercept"])+float(prod["slope"])*(total/denom),float(prod["floor"]),float(prod["ceiling"]))
                    age=age_sep1(birth,s);am=float(age_mod.age_multiplier(p,age,"Starter",realized,realized,age_cfg))
                    annual.append({"season":s,"games":games,"season_total":total,"replacement_ppg":baselines[s][p]["replacement_ppg"],
                                   "realized_prod_mult":realized,"age":age,"age_multiplier":am,"annual_player_equivalent_fv":base*weights[p]*am*realized})
            ready=season_ready and bool(birth) and bool(sid) and len(annual)==3
            o2=statistics.fmean(a["annual_player_equivalent_fv"] for a in annual) if ready else None
            class_players[y].append({**row,"status_flags":flags,"h3_o2_ready":ready,"H3_O2":o2,"annual":annual})

        classes={}
        for y in YEARS:
            rows=class_players[y];ready=[r for r in rows if r["h3_o2_ready"]];ready.sort(key=lambda r:(-float(r["H3_O2"]),str(r["stable_id"])))
            complete=len(ready)>=48;top=ready[:48] if complete else []
            buckets={}
            for bid,a,b in [("top6",1,6),("seven_to_12",7,12),("thirteen_to_24",13,24),("twentyfive_to_48",25,48)]:
                vals=[float(r["H3_O2"]) for r in top[a-1:b]];buckets[bid]=statistics.fmean(vals) if vals else None
            total=sum(float(r["H3_O2"]) for r in top) if complete else None
            qbt=sum(float(r["H3_O2"]) for r in top if r["position"]=="QB") if complete else None
            nonqb=[r for r in ready if r["position"]!="QB"][:48]
            classes[str(y)]={"drafted_population_n":len(rows),"h3_o2_ready_n":len(ready),"complete":complete,"top48_total":total,"bucket_means":buckets,
            "qb_top48_n":sum(r["position"]=="QB" for r in top) if complete else None,"qb_top48_total":qbt,
            "qb_share_top48_total":qbt/total if complete and total and qbt is not None else None,
            "largest_single_player_share_top48":max(float(r["H3_O2"]) for r in top)/total if complete and total else None,
            "nonqb_top48_total":sum(float(r["H3_O2"]) for r in nonqb) if len(nonqb)>=48 else None,
            "top48_players":[{"rank":i+1,"stable_id":r["stable_id"],"name":r["name"],"position":r["position"],"H3_O2":r["H3_O2"]} for i,r in enumerate(top)]}
        complete=[y for y in YEARS if classes[str(y)]["complete"]]
        if len(complete)>=2:
            for y in complete:
                bl=statistics.fmean(classes[str(o)]["top48_total"] for o in complete if o!=y)
                sc=math.log(classes[str(y)]["top48_total"]/bl);classes[str(y)]["loo_baseline_top48_total"]=bl;classes[str(y)]["class_log_strength"]=sc;classes[str(y)]["class_multiplier"]=math.exp(sc)
        panel={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_option_d_historical_target_panel",
        "population_branch":pop["population_branch"],"candidate_years":YEARS,"complete_years":complete,"complete_class_n":len(complete),
        "classes":classes,"baseline_failures":bfail,"provider":"Sleeper historical weekly NFL stats","fantasy_rookie_adp_used":False,
        "ktc_used":False,"2027_class_scored":False,"production_change_authorized":False}
        (D/"b6_option_d_historical_target_panel.json").write_text(json.dumps(panel,indent=2,sort_keys=True)+"\n")
        if len(complete)<10:
            write_final({"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_formal_option_d",
            "decision":"STOP_B6_FEWER_THAN_10_COMPLETE_OPTION_D_CLASSES","population_branch":pop["population_branch"],
            "population_source_gate_pass":True,"season_availability":availability,"complete_years":complete,"complete_class_n":len(complete),
            "formal_v0_run":False,"bridge_run":False,"predictor_source_feasibility_authorized":False,"predictor_fit_performed":False,
            "2027_class_scored":False,"production_change_authorized":False})
            raise SystemExit(0)

        def score_var(vby):
            totals={y:sum(sorted(vby[y],reverse=True)[:48]) for y in complete}
            scores=[math.log(totals[y]/statistics.fmean(totals[o] for o in complete if o!=y)) for y in complete]
            return statistics.variance(scores)
        vby={y:[float(r["H3_O2"]) for r in class_players[y] if r["h3_o2_ready"]] for y in complete}
        obs=statistics.variance(classes[str(y)]["class_log_strength"] for y in complete)
        formal=pre["formal_v0_next_stage"];rng=random.Random(int(formal["seed"]));B=int(formal["permutations"])
        pool=[];sizes=[]
        for y in complete:vals=list(vby[y]);pool.extend(vals);sizes.append((y,len(vals)))
        work=list(pool);null=[];exceed=0
        for _ in range(B):
            rng.shuffle(work);off=0;pv={}
            for y,n in sizes:pv[y]=work[off:off+n];off+=n
            nv=score_var(pv);null.append(nv);exceed+=nv>=obs
        pval=(exceed+1)/(B+1);nmean=statistics.fmean(null);rel=max(0.0,1.0-nmean/obs)

        bcfg=formal["reliability_bootstrap"];brng=random.Random(int(bcfg["seed"]));brels=[]
        for _ in range(int(bcfg["replicates"])):
            bv={}
            for y in complete:
                vals=vby[y];bv[y]=[vals[brng.randrange(len(vals))] for __ in range(len(vals))]
            vv=score_var(bv);brels.append(max(0.0,1.0-nmean/vv) if vv>0 else 0.0)
        brels.sort()
        def q(a,p):return a[int(round((len(a)-1)*p))]
        rel80=[q(brels,.10),q(brels,.90)];rel95=[q(brels,.025),q(brels,.975)]

        pospool=defaultdict(list);poscounts={}
        for y in complete:
            c=defaultdict(int)
            for r in class_players[y]:
                if r["h3_o2_ready"]:pospool[r["position"]].append(float(r["H3_O2"]));c[r["position"]]+=1
            poscounts[y]=dict(c)
        prng=random.Random(20261002);pnull=[];PB=10000
        for _ in range(PB):
            sh={}
            for p,vals in pospool.items():t=list(vals);prng.shuffle(t);sh[p]=t
            offs=defaultdict(int);pv={y:[] for y in complete}
            for y in complete:
                for p in PRIMARY:
                    n=poscounts[y].get(p,0);st=offs[p];pv[y].extend(sh[p][st:st+n]);offs[p]+=n
            pnull.append(score_var(pv))
        posp=(sum(v>=obs for v in pnull)+1)/(PB+1)

        bridge_years=[2018,2019,2020,2021,2022,2023];bavail=all(y in complete for y in bridge_years)
        bres={"run":bavail,"years":bridge_years}
        def pearson(x,y):
            mx,my=statistics.fmean(x),statistics.fmean(y);num=sum((a-mx)*(b-my) for a,b in zip(x,y))
            dx=math.sqrt(sum((a-mx)**2 for a in x));dy=math.sqrt(sum((b-my)**2 for b in y));return num/(dx*dy) if dx and dy else 0.0
        def ranks(a):
            order=sorted(range(len(a)),key=lambda i:(a[i],i));out=[0.0]*len(a);i=0
            while i<len(order):
                j=i+1
                while j<len(order) and a[order[j]]==a[order[i]]:j+=1
                rr=(i+1+j)/2
                for k in range(i,j):out[order[k]]=rr
                i=j
            return out
        if bavail:
            new=[classes[str(y)]["class_log_strength"] for y in bridge_years];oldv=[old["rows"][str(y)]["overall_log_strength"] for y in bridge_years]
            pr=pearson(new,oldv);sr=pearson(ranks(new),ranks(oldv));sign=sum((a>=0)==(b>=0) for a,b in zip(new,oldv))/6
            bres.update({"new_option_d_log_strength":dict(zip(map(str,bridge_years),new)),"old_sf_cell_log_strength":dict(zip(map(str,bridge_years),oldv)),
                         "spearman":sr,"pearson":pr,"sign_agreement":sign,"clear_failure":sr<.30,
                         "supportive":sr>=.60 and pr>=.50 and sign>=2/3})

        gate=formal["pass_gate"];v0pass=pval<float(gate["permutation_p_lt"]) and rel>=float(gate["reliability_ge"]) and rel80[0]>float(gate["reliability_80pct_lower_bound_gt"])
        if not v0pass:decision="STOP_B6_FORMAL_V0_FAILED_RETAIN_NEUTRAL_1_00";auth=False
        elif not bavail:decision="STOP_B6_BRIDGE_REQUIRED_YEARS_NOT_ALL_COMPLETE";auth=False
        elif bres["clear_failure"]:decision="STOP_B6_2018_2023_BRIDGE_CLEAR_FAILURE";auth=False
        elif bres["supportive"]:decision="PASS_B6_FORMAL_V0_AND_BRIDGE_AUTHORIZE_PREDICTOR_SOURCE_FEASIBILITY";auth=True
        else:decision="PASS_B6_FORMAL_V0_BRIDGE_MIDDLE_ZONE_RESEARCH_ONLY_SOURCE_FEASIBILITY";auth=True
        formal_result={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_formal_option_d_v0",
        "complete_years":complete,"complete_class_n":len(complete),"observed_class_score_variance":obs,
        "primary_null":{"permutations":B,"seed":formal["seed"],"mean_variance":nmean,"permutation_p_value":pval},
        "reliability":rel,"reliability_bootstrap":{"replicates":bcfg["replicates"],"seed":bcfg["seed"],"interval_80":rel80,"interval_95":rel95},
        "position_preserving_null":{"permutations":PB,"permutation_p_value":posp,"mean_variance":statistics.fmean(pnull)},
        "formal_gate_pass":v0pass,"bridge_2018_2023":bres,"decision":decision,"predictor_source_feasibility_authorized":auth,
        "predictor_fit_performed":False,"2027_class_scored":False,"production_change_authorized":False}
        (D/"b6_formal_v0_and_bridge.json").write_text(json.dumps(formal_result,indent=2,sort_keys=True)+"\n")
        write_final({"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_formal_option_d","decision":decision,
        "population_branch":pop["population_branch"],"population_source_gate_pass":True,"season_availability":availability,
        "complete_years":complete,"complete_class_n":len(complete),"formal_v0_run":True,"formal_v0_gate_pass":v0pass,
        "permutation_p_value":pval,"reliability":rel,"reliability_80pct_interval":rel80,"bridge_run":bavail,
        "bridge_spearman":bres.get("spearman") if bavail else None,"bridge_supportive":bres.get("supportive") if bavail else False,
        "bridge_clear_failure":bres.get("clear_failure") if bavail else None,"predictor_source_feasibility_authorized":auth,
        "predictor_fit_performed":False,"2027_class_scored":False,"production_change_authorized":False})
        PY
    - name: Freeze B6 manifest and validate no production mutation
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json
        from pathlib import Path
        D=Path("research/draft-class-strength-v1")
        r=json.loads((D/"b6_formal_option_d_result.json").read_text())
        assert r["predictor_fit_performed"] is False and r["2027_class_scored"] is False and r["production_change_authorized"] is False
        outs=[D/"b6_formal_option_d_result.json"]
        for name in ("b6_option_d_historical_target_panel.json","b6_formal_v0_and_bridge.json"):
            p=D/name
            if p.exists():
                x=json.loads(p.read_text())
                assert x["2027_class_scored"] is False and x["production_change_authorized"] is False
                if name=="b6_option_d_historical_target_panel.json":
                    assert x["fantasy_rookie_adp_used"] is False and x["ktc_used"] is False
                if name=="b6_formal_v0_and_bridge.json":assert x["predictor_fit_performed"] is False
                outs.append(p)
        m={"schema_version":1,"study_id":"draft-class-strength-v1","stage":"b6_manifest","decision":r["decision"],
        "output_hashes":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in outs},
        "predictor_fit_performed":False,"2027_class_scored":False,"production_change_authorized":False}
        (D/"b6_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")
        alltxt="\n".join(p.read_text() for p in D.glob("b6_*.json")).lower()
        assert '"production_change_authorized": true' not in alltxt
        assert '"predictor_fit_performed": true' not in alltxt
        assert '"2027_class_scored": true' not in alltxt
        print("PASS: B6 scientific result frozen and production remains untouched.")
        PY
    - name: Prove B6 research-only mutation scope
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import subprocess
        raw=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True)
        t=[x[3:] for x in raw.splitlines() if x.strip()]
        assert t
        assert all(p.startswith("research/draft-class-strength-v1/b6_") for p in t),t
        assert "index.html" not in t and "free-agent-board.html" not in t
        assert not any(p.startswith(("model/","scripts/","data/")) for p in t)
        print("PASS: B6 mutation scope is research-only.")
        PY
    - name: Commit B6 research artifacts
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |
        set -euo pipefail
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo "ERROR: origin/main moved during B6 reducer."; exit 1; }
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add research/draft-class-strength-v1/b6_*.json
        if git diff --cached --quiet; then echo "PASS: B6 artifacts already match; no commit required."; exit 0; fi
        git commit -m "Run Draft Class Strength V1 Option D formal V0"
        git push origin HEAD:main
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo "PASS: B6 research artifacts committed."
