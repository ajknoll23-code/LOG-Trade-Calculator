name: A15 Identity V2 Phase 22 Closure Freeze

# PATCH_VERSION: IDENTITY_V2_CLOSURE_FREEZE_V1

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase22-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact Phase 21 production anchor
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib,json
          from collections import defaultdict
          from pathlib import Path

          D=Path("research/identity-v2")
          confirmation_path=D/"identity_v2_phase21_devinculp_deployment_confirmation.json"
          manifest_path=D/"identity_v2_phase21_devinculp_manifest.json"

          confirmation=json.loads(confirmation_path.read_text())
          manifest=json.loads(manifest_path.read_text())

          assert confirmation["decision"]==(
              "PASS_IDENTITY_V2_PHASE21_DEVIN_CULP_DEPLOYED_"
              "ONE_TAXONOMY_HOLD_REMAINS"
          )
          assert confirmation["status"]=="DEPLOYED_VALIDATED"
          assert confirmation["changed_fpids"]==["26440"]
          assert confirmation["deployed_mapping_count"]==1
          assert confirmation["deployed_mappings"]=={
              "26440":{"name":"Devin Culp","sleeper_id":"11820"}
          }
          assert confirmation["manual_review_count_before"]==2
          assert confirmation["manual_review_count_after"]==1
          assert confirmation["remaining_manual_review_fpids"]==["26157"]
          assert confirmation["jonah_elliss_row_byte_identical"] is True
          assert confirmation["prior_identity_mappings_preserved"] is True
          assert confirmation["production_resolver_source_changed"] is False
          assert confirmation["global_position_compatibility_changed"] is False
          assert confirmation["full_repo_regression_passed"] is True
          assert confirmation["successor_resolver_exact_scope_passed"] is True

          assert manifest["decision"]==confirmation["decision"]
          assert manifest["deployed_mapping_count"]==1
          assert manifest["remaining_manual_review_count"]==1
          assert manifest["remaining_manual_review_fpids"]==["26157"]
          assert manifest["production_change_applied"] is True

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          assert sha(confirmation_path)==manifest["deployment_confirmation_json_sha256"]
          assert confirmation["postdeploy_crosswalk_sha256"]==manifest["postdeploy_crosswalk_sha256"]
          assert sha(Path("scripts/identity_crosswalk.json"))==confirmation["postdeploy_crosswalk_sha256"]

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          by={
              str(r["fantasypros_id"]):r
              for r in rows if r.get("fantasypros_id") not in (None,"")
          }
          manual={
              fpid:r for fpid,r in by.items()
              if r.get("requires_manual_review") is True
          }
          assert set(manual)=={"26157"},sorted(manual)

          jonah=manual["26157"]
          assert jonah["name"]=="Jonah Elliss"
          assert jonah["fp_position"]=="LB"
          assert jonah["fp_team"]=="DEN"
          assert jonah["sleeper_id"] is None
          assert jonah["candidate_sleeper_id"] is None
          assert jonah["match_method"]=="name_found_position_incompatible"
          assert jonah["match_confidence"]=="none"
          assert jonah["name_candidate_count"]==1
          assert jonah["position_candidate_count"]==0

          expected_authoritative={
              "26313":"11760",
              "27959":"13457",
              "28290":"13482",
              "26964":"12412",
              "15697":"3369",
              "18557":"6111",
              "20080":"8159",
              "16427":"4040",
              "25668":"11210",
              "26397":"11821",
              "18168":"5781",
              "22887":"12532",
              "23957":"11921",
              "16787":"4435",
              "24181":"8500",
              "26411":"11802",
              "26440":"11820",
          }
          for fpid,sid in expected_authoritative.items():
              row=by[fpid]
              assert str(row.get("sleeper_id") or "")==sid,(fpid,row)
              assert row.get("requires_manual_review") is False,(fpid,row)

          sid_owners=defaultdict(list)
          for row in rows:
              if row.get("requires_manual_review"):
                  continue
              sid=row.get("sleeper_id")
              fpid=row.get("fantasypros_id")
              if sid in (None,"") or fpid in (None,""):
                  continue
              sid_owners[str(sid)].append(str(fpid))
          collisions={
              sid:owners for sid,owners in sid_owners.items()
              if len(owners)>1
          }
          assert not collisions,collisions

          print("PASS: exact post-A14 production state guarded; Jonah Elliss is the sole manual hold.")
          PY

          cp scripts/identity_crosswalk.json \
            "${RUNNER_TEMP}/identity_crosswalk.preclosure.json"

          sha256sum \
            scripts/identity_crosswalk.json \
            scripts/projections/resolve_fantasypros_sleeper_identity.py \
            scripts/artifacts/reports/identity_collision_report.md \
            scripts/artifacts/generated/team_utility_lineup_projections.json \
            scripts/artifacts/reports/team_utility_lineup_projection_report.md \
            research/identity-v2/identity_v2_phase21_devinculp_deployment_confirmation.json \
            research/identity-v2/identity_v2_phase21_devinculp_deployment_confirmation.md \
            research/identity-v2/identity_v2_phase21_devinculp_manifest.json \
            > "${RUNNER_TEMP}/identity-v2-production-freeze.sha256"

      - name: Pre-closure full regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Audit successor behavior without writing production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json
          from collections import defaultdict
          from pathlib import Path

          root=Path(".")
          D=root/"research/identity-v2"
          resolver_path=root/"scripts/projections/resolve_fantasypros_sleeper_identity.py"

          spec=importlib.util.spec_from_file_location(
              "identity_prod_resolver",resolver_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load production identity resolver")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          current=json.loads((root/"scripts/identity_crosswalk.json").read_text())
          fp_doc=mod.read_json(mod.FP_PATH)
          totals=mod.read_json(mod.SLEEPER_TOTAL_PATH)
          raw=mod.read_json(mod.SLEEPER_RAW_PATH)
          teams=mod.read_json(mod.TEAM_REFRESH_PATH)

          successor=mod.build_production_crosswalk(
              fp_doc,totals,raw,teams,current
          )

          def index(rows,label):
              out={}
              for row in rows:
                  fpid=row.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  if fpid in out:
                      raise SystemExit(f"{label}: duplicate FPID {fpid}")
                  out[fpid]=row
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          a=index(current,"current")
          b=index(successor,"successor")
          if set(a)!=set(b):
              raise SystemExit("successor/current FPID universe differs")

          changed=sorted(
              fpid for fpid in a if canon(a[fpid])!=canon(b[fpid])
          )

          successor_manual=sorted(
              fpid for fpid,row in b.items()
              if row.get("requires_manual_review") is True
          )
          if successor_manual!=["26157"]:
              raise SystemExit(
                  f"successor manual universe changed: {successor_manual}"
              )

          jonah=b["26157"]
          if jonah.get("sleeper_id") not in (None,""):
              raise SystemExit("successor unexpectedly mapped Jonah Elliss")
          if jonah.get("requires_manual_review") is not True:
              raise SystemExit("successor unexpectedly cleared Jonah Elliss")
          if jonah.get("match_method")!="name_found_position_incompatible":
              raise SystemExit(
                  f"Jonah successor method changed: {jonah.get('match_method')}"
              )

          expected_authoritative={
              "26313":"11760","27959":"13457","28290":"13482","26964":"12412",
              "15697":"3369","18557":"6111","20080":"8159",
              "16427":"4040","25668":"11210","26397":"11821",
              "18168":"5781","22887":"12532","23957":"11921",
              "16787":"4435","24181":"8500","26411":"11802","26440":"11820",
          }
          for fpid,sid in expected_authoritative.items():
              row=b[fpid]
              if str(row.get("sleeper_id") or "")!=sid:
                  raise SystemExit(
                      f"successor lost authoritative pair {fpid}->{sid}"
                  )
              if row.get("requires_manual_review") is not False:
                  raise SystemExit(
                      f"successor returned authoritative FPID {fpid} to manual"
                  )

          by_sid=defaultdict(list)
          for row in successor:
              if row.get("requires_manual_review"):
                  continue
              sid=row.get("sleeper_id")
              fpid=row.get("fantasypros_id")
              if sid in (None,"") or fpid in (None,""):
                  continue
              by_sid[str(sid)].append(str(fpid))
          collisions={
              sid:owners for sid,owners in by_sid.items()
              if len(owners)>1
          }
          if collisions:
              raise SystemExit(f"successor authoritative SID collisions: {collisions}")

          audit={
              "schema_version":1,
              "study_id":"identity-v2-phase22-closure-freeze",
              "status":"SUCCESSOR_INVARIANT_AUDIT_PASS",
              "successor_manual_review_fpids":successor_manual,
              "successor_changed_fpids_vs_frozen_production":changed,
              "successor_changed_count_vs_frozen_production":len(changed),
              "all_17_evidence_backed_pairs_preserved":True,
              "jonah_elliss_remains_manual":True,
              "jonah_elliss_match_method":"name_found_position_incompatible",
              "authoritative_sid_collisions":collisions,
              "production_written":False
          }
          (D/"identity_v2_phase22_successor_invariant_audit.json").write_text(
              json.dumps(audit,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(audit,indent=2))
          PY

      - name: Freeze Identity V2 closure contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path

          root=Path(".")
          D=root/"research/identity-v2"
          crosswalk_path=root/"scripts/identity_crosswalk.json"
          resolver_path=root/"scripts/projections/resolve_fantasypros_sleeper_identity.py"

          rows=json.loads(crosswalk_path.read_text())
          by={
              str(r["fantasypros_id"]):r
              for r in rows if r.get("fantasypros_id") not in (None,"")
          }
          manual=sorted(
              fpid for fpid,row in by.items()
              if row.get("requires_manual_review") is True
          )
          assert manual==["26157"]

          p20=json.loads(
              (D/"identity_v2_phase20_final_pair_adjudication.json").read_text()
          )
          p21=json.loads(
              (D/"identity_v2_phase21_devinculp_deployment_confirmation.json").read_text()
          )
          successor=json.loads(
              (D/"identity_v2_phase22_successor_invariant_audit.json").read_text()
          )

          assert p20["passing_fpids"]==["26440"]
          assert p20["held_fpids"]==["26157"]
          assert p20["per_player"]["26157"]["stable_identity_passed"] is False
          assert p20["per_player"]["26157"]["context_passed"] is True
          assert p21["manual_review_count_after"]==1
          assert p21["remaining_manual_review_fpids"]==["26157"]
          assert successor["successor_manual_review_fpids"]==["26157"]
          assert successor["all_17_evidence_backed_pairs_preserved"] is True
          assert successor["jonah_elliss_remains_manual"] is True

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          jonah=by["26157"]

          closure={
              "schema_version":1,
              "study_id":"identity-v2-phase22-closure-freeze",
              "status":"FROZEN_COMPLETE_WITH_ONE_EXPLICIT_HOLD",
              "decision":"PASS_IDENTITY_V2_CLOSE_AND_FREEZE_WITH_JONAH_ELLISS_HOLD",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "production_change_applied":False,
              "production_change_authorized":False,
              "identity_v2_closed":True,
              "deployable_identity_work_complete":True,
              "remaining_manual_review_count":1,
              "remaining_manual_review_fpids":["26157"],
              "remaining_hold":{
                  "fantasypros_id":"26157",
                  "name":"Jonah Elliss",
                  "fantasypros_position":"LB",
                  "fantasypros_team":"DEN",
                  "current_production_sleeper_id":None,
                  "current_production_candidate_sleeper_id":None,
                  "current_match_method":"name_found_position_incompatible",
                  "current_match_confidence":"none",
                  "scientific_reason":[
                      "Current FantasyPros classifies Jonah Elliss as LB for Denver.",
                      "Current Sleeper projection evidence points to exact-name Jonah Elliss at SID 11714 for Denver but position DE.",
                      "Denver official evidence classifies him as OLB, a hybrid edge taxonomy.",
                      "The independent stable-ID bridge queried in Phase 20 contains SID 11714 but no FantasyPros-ID row for FPID 26157, so an exact FPID-to-SID bridge was not established.",
                      "Promoting the row anyway would require weakening the preregistered evidence standard or globally relaxing LB/DL taxonomy compatibility."
                  ],
                  "production_action":"KEEP_MANUAL_HOLD"
              },
              "reopen_only_if":[
                  {
                      "trigger":"independent_stable_id_bridge",
                      "requirement":"A reliable independent source links FantasyPros ID 26157 and Sleeper ID 11714 on the same player row with stable identifiers such as GSIS/PFR."
                  },
                  {
                      "trigger":"provider_taxonomy_becomes_directly_compatible",
                      "requirement":"Current provider data changes so the exact-name Denver Sleeper candidate is LB or EDGE-compatible with FantasyPros LB under the existing resolver rules, without a global compatibility relaxation."
                  },
                  {
                      "trigger":"material_provider_identity_change",
                      "requirement":"FantasyPros or Sleeper changes the underlying stable identity/position metadata enough to create a new exact evidence-backed path; ordinary team/status drift alone is insufficient."
                  }
              ],
              "do_not_reopen_for":[
                  "name-only matching",
                  "name plus team without compatible position or stable-ID corroboration",
                  "manual assumption that OLB must equal FantasyPros LB",
                  "desire to reach a cosmetic 100 percent mapping rate",
                  "ordinary transaction or free-agent status changes"
              ],
              "frozen_production_contract":{
                  "identity_crosswalk_sha256":sha(crosswalk_path),
                  "resolver_sha256":sha(resolver_path),
                  "identity_collision_report_sha256":sha(
                      root/"scripts/artifacts/reports/identity_collision_report.md"
                  ),
                  "team_utility_projection_sha256":sha(
                      root/"scripts/artifacts/generated/team_utility_lineup_projections.json"
                  ),
                  "team_utility_report_sha256":sha(
                      root/"scripts/artifacts/reports/team_utility_lineup_projection_report.md"
                  )
              },
              "evidence_chain":{
                  "phase20_final_pair_adjudication_sha256":sha(
                      D/"identity_v2_phase20_final_pair_adjudication.json"
                  ),
                  "phase20_manifest_sha256":sha(
                      D/"identity_v2_phase20_final_pair_manifest.json"
                  ),
                  "phase21_deployment_confirmation_sha256":sha(
                      D/"identity_v2_phase21_devinculp_deployment_confirmation.json"
                  ),
                  "phase21_manifest_sha256":sha(
                      D/"identity_v2_phase21_devinculp_manifest.json"
                  ),
                  "phase22_successor_invariant_audit_sha256":sha(
                      D/"identity_v2_phase22_successor_invariant_audit.json"
                  )
              },
              "successor_invariants":{
                  "sole_manual_hold_remains_26157":True,
                  "all_17_evidence_backed_pairs_preserved":True,
                  "no_authoritative_sid_collisions":True
              },
              "next_program_step":"Identity V2 requires no further active work. Proceed to position-level model audits; treat Jonah Elliss as an explicit frozen exception until a reopen trigger occurs."
          }

          out_json=D/"identity_v2_phase22_closure_freeze.json"
          out_md=D/"identity_v2_phase22_closure_freeze.md"

          out_json.write_text(json.dumps(closure,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 22 — Closure Freeze",
              "",
              f"**Decision:** `{closure['decision']}`",
              "",
              "## Final state",
              "",
              "- Identity V2 active research: **Closed**",
              "- Deployable identity work: **Complete**",
              "- Production changes in Phase 22: **None**",
              "- Remaining manual-review rows: **1**",
              "- Remaining hold: **Jonah Elliss — FPID 26157**",
              "- Evidence-backed mappings preserved through successor audit: **17 / 17**",
              "- Authoritative Sleeper-ID collisions: **0**",
              "",
              "## Why Jonah Elliss remains held",
              "",
              "FantasyPros currently treats Elliss as LB for Denver, while the "
              "current Sleeper candidate is exact-name Jonah Elliss at SID 11714 "
              "for Denver but position DE. Denver officially lists him as OLB. "
              "Phase 20 confirmed the contextual identity evidence, but the "
              "independent stable-ID source did not contain FantasyPros ID 26157, "
              "so it could not establish the required exact FPID ↔ SID bridge.",
              "",
              "Mapping him anyway would require lowering the evidence standard or "
              "relaxing LB/DL compatibility globally. This freeze does neither.",
              "",
              "## Reopen triggers",
              "",
              "Reopen only if materially stronger evidence appears: an independent "
              "FPID 26157 ↔ SID 11714 stable-ID bridge, directly compatible provider "
              "position metadata under the existing resolver, or another material "
              "provider identity change that creates an exact evidence-backed path.",
              "",
              "Do **not** reopen merely to make the mapping rate cosmetically 100%.",
              "",
              "## Next step",
              "",
              "Proceed to the position-level model audits. Jonah Elliss remains an "
              "explicit frozen exception and does not block the rest of the calculator."
          ]
          out_md.write_text("\n".join(lines).rstrip()+"\n")

          print(json.dumps({
              "decision":closure["decision"],
              "identity_v2_closed":closure["identity_v2_closed"],
              "remaining_manual_review_count":closure["remaining_manual_review_count"],
              "remaining_manual_review_fpids":closure["remaining_manual_review_fpids"],
              "deployable_identity_work_complete":closure["deployable_identity_work_complete"]
          },indent=2))
          PY

      - name: Prove production remained byte-identical
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/identity-v2-production-freeze.sha256"

          cmp -s \
            "${RUNNER_TEMP}/identity_crosswalk.preclosure.json" \
            scripts/identity_crosswalk.json

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/projections/build_team_utility_lineup_projections.py --check

          echo "PASS: closure research changed no production or derived production artifact."

      - name: Write closure manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          closure=D/"identity_v2_phase22_closure_freeze.json"
          closure_md=D/"identity_v2_phase22_closure_freeze.md"
          successor=D/"identity_v2_phase22_successor_invariant_audit.json"

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          result=json.loads(closure.read_text())
          assert result["decision"]=="PASS_IDENTITY_V2_CLOSE_AND_FREEZE_WITH_JONAH_ELLISS_HOLD"
          assert result["identity_v2_closed"] is True
          assert result["deployable_identity_work_complete"] is True
          assert result["remaining_manual_review_fpids"]==["26157"]
          assert result["production_change_applied"] is False

          manifest={
              "schema_version":1,
              "study_id":"identity-v2-phase22-closure-freeze",
              "decision":result["decision"],
              "identity_v2_closed":True,
              "deployable_identity_work_complete":True,
              "production_change_applied":False,
              "remaining_manual_review_count":1,
              "remaining_manual_review_fpids":["26157"],
              "closure_json_sha256":sha(closure),
              "closure_md_sha256":sha(closure_md),
              "successor_invariant_audit_sha256":sha(successor),
              "frozen_production_contract":result["frozen_production_contract"],
              "evidence_chain":result["evidence_chain"]
          }
          (D/"identity_v2_phase22_closure_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Identity V2 Phase 22 closure manifest frozen.")
          PY

      - name: Prove exact research-only closure scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/identity-v2/identity_v2_phase22_successor_invariant_audit.json",
              "research/identity-v2/identity_v2_phase22_closure_freeze.json",
              "research/identity-v2/identity_v2_phase22_closure_freeze.md",
              "research/identity-v2/identity_v2_phase22_closure_manifest.json",
          }

          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}

          unexpected=touched-allowed
          missing=allowed-touched
          if unexpected:
              raise SystemExit(
                  "Unexpected Phase 22 file changes: "
                  + ", ".join(sorted(unexpected))
              )
          if missing:
              raise SystemExit(
                  "Missing Phase 22 closure files: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: A15 touched exactly four research-only closure files.")
          PY

          git diff --check

      - name: Final closure regression proof
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/identity-v2-production-freeze.sha256"
          python3 scripts/validation/repo_regression_checks.py
          echo "PASS: Identity V2 closure freeze is production-neutral and regression-clean."

      - name: Commit A15 Identity V2 closure freeze
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A15."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase22_successor_invariant_audit.json \
            research/identity-v2/identity_v2_phase22_closure_freeze.json \
            research/identity-v2/identity_v2_phase22_closure_freeze.md \
            research/identity-v2/identity_v2_phase22_closure_manifest.json

          git diff --cached --check
          git commit -m "Freeze Identity V2 Phase 22 closure"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A15 Identity V2 closure freeze committed cleanly."
