# PREFLIGHTED: B19_C1_EXPLORATORY_HISTORICAL_SCREEN
name: B19 Draft Capital Outlook V1 - C1 Exploratory Historical Screen

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b19_c1_exploratory_historical_screen:
    name: Execute frozen one-shot C1 historical screen
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen analysis dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" \
            "requests==2.32.5"

      - name: Guard B18 authorization and frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          B18=D/"b18"
          cfgp=B18/"b18_config.json"
          authp=B18/"b18_authorization.json"
          pickp=B18/"rich_hill_pick_values_1_60.csv"
          for p in (cfgp,authp,pickp,B18/"b18_freeze_hashes.json"):
              assert p.is_file(), p

          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(cfgp)=="6c6706bd65059a8eb04ac66bf43a2a27810b93984ab90e336f3b9e1bd33b390e"
          assert sha(authp)=="9aceec752e6468fec1b9b73163ce9f4a362ac04ec8f4680f614bd8f2770e68b2"
          assert sha(pickp)=="3ff0004e20987786f4fa0df6372722533c0c826daf2067231ef6fd8f72b5af88"

          cfg=json.loads(cfgp.read_text())
          auth=json.loads(authp.read_text())
          freeze=json.loads((B18/"b18_freeze_hashes.json").read_text())

          assert freeze["config_sha256"]==sha(cfgp)
          assert freeze["pick_table_sha256"]==sha(pickp)
          assert cfg["frozen_before_historical_capital_association"] is True
          assert cfg["cohort"]["class_years"]==list(range(2013,2024))
          assert cfg["cohort"]["class_n"]==11
          assert cfg["construct"]["top_n"]==60
          assert cfg["construct"]["x"]=="ln(P_c)"
          assert cfg["construct"]["y"]=="ln(A_c)"
          assert cfg["construct"]["same_formula_both_sides"] is True
          assert cfg["construct"]["primary_position_weights"]=={"QB":1.0,"RB":1.0,"TE":1.0,"WR":1.0}
          assert cfg["construct"]["position_map"]=={"FB":"RB","QB":"QB","RB":"RB","TE":"TE","WR":"WR"}
          assert cfg["gates"]["G1"]["alpha"]==0.05
          assert cfg["gates"]["G2"]["alpha"]==0.15
          assert cfg["gates"]["G3"]["alpha"]==0.15
          assert cfg["b18_power_authorization"]["planned_c1_permutation_count"]==99999
          assert cfg["objective"]["post_c1_gate_movement_allowed"] is False
          assert cfg["objective"]["model_or_target_shopping_after_c1_allowed"] is False
          assert cfg["downstream_authority"]["production_change_authorized"] is False
          assert cfg["downstream_authority"]["2027_class_scored"] is False

          assert auth["decision"]=="AUTHORIZE_B18_EXPLORATORY_C1_SCREEN_N11_NO_PRODUCTION_AUTHORITY"
          assert auth["c1_exploratory_screen_authorized"] is True
          assert auth["c1_execution_count_authorized"]==1
          assert auth["current_n"]==11
          assert auth["primary_screen_calibrated"] is True
          assert auth["strong_category_calibrated"] is True
          assert auth["c1_executed"] is False
          assert auth["historical_capital_values_computed"] is False
          assert auth["predictor_target_association_computed"] is False
          assert auth["2027_class_scored"] is False
          assert auth["production_change_authorized"] is False

          assert not (D/"b19/c1_result.json").exists(), "B19 C1 result already committed; one-shot gate is closed"
          print("PASS: exact B18 authorization/protocol hashes and one-shot gate verified.")
          PY

      - name: Guard exact frozen historical input lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          expected_projected={
            2013:("b17e/2013_projected_top60.json","56b997d8a674332ca562f3610d45056b9c9619423de0bf98aac6602e74df6bd5"),
            2014:("archive/historical-anchor-parsing-v2/parsed/2014_projected_top60.json","3e671e66e2ef549e868568f6cd924779a5e33709310ba50b5dea14893b2f25ec"),
            2015:("archive/historical-anchor-parsing-v2/parsed/2015_projected_top60.json","29cd7c1daca1fd7d0052eae604b85a043567d2aac12a71fe5c71c31b2bc8b969"),
            2016:("archive/historical-anchor-parsing-v2/parsed/2016_projected_top60.json","9a458104bea4f1710bec01581e5d667dbe2d7f3d9b3f9d255f57e11b0a0bd009"),
            2017:("archive/historical-anchor-parsing-v2/parsed/2017_projected_top60.json","bf21c989b9b08ca688954a45f3fb050483037dd55ec6821c42ead4ea104efc45"),
            2018:("archive/historical-anchor-parsing-v2/parsed/2018_projected_top60.json","c7e3e4a746d623e89a38e0e2c659fe0c736d09d18fbff99547769e760e460cc4"),
            2019:("archive/historical-anchor-parsing-v2/parsed/2019_projected_top60.json","b190ddcdbc52a70539be4f35ad69a136587fbf97122a19a3b2052ffab125818f"),
            2020:("archive/historical-anchor-parsing-v2/parsed/2020_projected_top60.json","4ea37424f290cd0159d7e5bd746a733d59d6307d6dc0470e864899ac1a2e4fbd"),
            2021:("archive/historical-anchor-parsing-v2/parsed/2021_projected_top60.json","1db595ea440c2a181d2a2e37be3448d9e5d8dd5ac068d112f4a21413e9650aec"),
            2022:("archive/historical-anchor-parsing-v2/parsed/2022_projected_top60.json","083c5bd2986daebcfc1fc0a3c4e2679fef3f2f8d915ef6870c55c6b85e8d97fc"),
            2023:("archive/historical-anchor-parsing-v2/parsed/2023_projected_top60.json","fcca571562cbb3fd36689a3014571fc375d2a12aa0e59ee40c9d7fc3a40968f5"),
          }
          expected_actual={
            2013:("b17e/2013_actual_top60.json","ec6aa805a58ce1c7182cdb4986c6eb0216d3a33ff7a3dd6294aa2b00b0db5d43"),
            2014:("archive/historical-anchor-parsing/target/2014_actual_top60.json","13dac1ff5551ed9d8c237ae747692e4c84d9eb0d6a4225e6c4444dadb32d5442"),
            2015:("archive/historical-anchor-parsing/target/2015_actual_top60.json","d45cd8bc7552012aee5981a63f2e86b8e5c683b33234562780c578fd27f6ca5d"),
            2016:("archive/historical-anchor-parsing/target/2016_actual_top60.json","14a96cd1ea9852b4e8576834f81a1bfe6e06aaef55b03d7e1889952b4ee0cf41"),
            2017:("archive/historical-anchor-parsing/target/2017_actual_top60.json","9edd6339318a895d3a37ce87473885527c38b2cb0fa7bf6b2570e13301be25a8"),
            2018:("archive/historical-anchor-parsing/target/2018_actual_top60.json","21c7d7454467d82bd8d5fa3b396507532fc3abb5dc79f81cbbb28b6a819dd6b6"),
            2019:("archive/historical-anchor-parsing/target/2019_actual_top60.json","066db4e8e8199fa523e8c8a4ff6f3ba3a6cf35cad78c00d2baf396efea440114"),
            2020:("archive/historical-anchor-parsing/target/2020_actual_top60.json","40e9fe03bf1c39e6b16d3718631d41e5a9f959f41cf1b7b6fc34e41b122d1b7f"),
            2021:("archive/historical-anchor-parsing/target/2021_actual_top60.json","5e89c1bfcf91b9b57934f26588556ab82cf3b716ad7872ef5ee78bd716100a66"),
            2022:("archive/historical-anchor-parsing/target/2022_actual_top60.json","b8fe93839598299be02ceda4ff1143a202e72fb502abdba27e07839463382bc8"),
            2023:("archive/historical-anchor-parsing/target/2023_actual_top60.json","ac67bee171e4c6e730872952a359ef45e9861ff06a794ec3ac45564f2473f5c0"),
          }
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          lineage={}
          for year in range(2013,2024):
              lineage[year]={}
              for side,table in (("projected",expected_projected),("actual",expected_actual)):
                  rel,want=table[year]
                  p=D/rel
                  assert p.is_file(), p
                  got=sha(p)
                  assert got==want,(year,side,got,want)
                  obj=json.loads(p.read_text())
                  assert obj["class_year"]==year
                  rows=obj["fantasy_rows"]
                  assert isinstance(rows,list) and len(rows)>0
                  picks=[int(r["pick"]) for r in rows]
                  assert len(picks)==len(set(picks))
                  assert all(1<=k<=60 for k in picks)
                  for r in rows:
                      pos=r.get("primary_position") or r.get("fantasy_position")
                      assert pos in {"QB","RB","FB","WR","TE"},(year,side,pos)
                  lineage[year][side]={"path":rel,"sha256":got,"fantasy_row_n":len(rows)}
          assert sorted(lineage)==list(range(2013,2024))
          print(json.dumps(lineage,indent=2,sort_keys=True))
          print("PASS: all 22 frozen historical composition inputs match preregistered SHA-256 locks.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B19 deterministic execution contract before opening association
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b19
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b19")
          contract={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b19_c1_execution_contract",
            "objective":"Execute the single B18-authorized exploratory C1 historical screen without changing construct, gates, thresholds, or downstream authority.",
            "historical_class_years":list(range(2013,2024)),
            "historical_class_n":11,
            "permutation_count":99999,
            "permutation_p_value":"(1 + count(permuted statistic >= observed statistic)) / (B + 1)",
            "permutation_tie_rule":"greater-than-or-equal; numerical comparison tolerance 1e-15",
            "deterministic_seed_map":{
              "G1":180000,
              "G2_delete_2013_through_2023":[181000+i for i in range(11)],
              "G3":182000
            },
            "seed_derivation_note":"Deterministic non-overlapping C1 seed allocation from B18 permutation_bank_base=180000; frozen here before any historical P_c/A_c scalar or association is computed.",
            "construct":{
              "projected":"P_c=sum RichHill[k] for frozen projected fantasy rows at selection order k<=60",
              "actual":"A_c=sum RichHill[k] for frozen actual fantasy rows at selection order k<=60",
              "positions":["QB","RB","FB","WR","TE"],
              "FB_maps_to":"RB",
              "weights":{"QB":1.0,"RB":1.0,"WR":1.0,"TE":1.0},
              "x":"ln(P_c)","y":"ln(A_c)"
            },
            "predictive_utility":{
              "model":"LOO clipped OLS y=a+b*x with b=max(0, OLS slope) inside each training fold",
              "neutral":"training-fold mean y",
              "metric":"S=1-SSE_model/SSE_neutral",
              "pass":"S>0"
            },
            "G1":{"alpha":0.05,"test":"one-sided positive Pearson permutation","pass":"p<=0.05 AND LOO S>0"},
            "G2":{"alpha":0.15,"test":"delete every class in turn; same positive Pearson permutation plus LOO S","pass":"every deletion passes"},
            "G3":{"alpha":0.15,"test":"Freedman-Lane reduced y~1+year residual permutation; full y~1+year+x; one-sided x-coefficient t","pass":"p<=0.15"},
            "classification":{
              "STRONG":"G1 AND G2 AND G3",
              "MODERATE":"G1 AND exactly one of G2/G3",
              "WEAK":"G1 AND neither G2 nor G3",
              "NO_SIGNAL":"G1 fails",
              "C1_INVALID":"integrity/hash/protocol failure"
            },
            "one_shot_semantics":"A committed C1 result closes the gate. A runner failure before commit may replay only this exact deterministic contract and exact hashed inputs; it cannot create a different scientific result.",
            "post_c1_gate_movement_allowed":False,
            "model_or_target_shopping_after_c1_allowed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "downstream_authority":{
              "STRONG":"May authorize a separate Layer-D/shadow-calibration study only; never direct production.",
              "MODERATE":"Continue evidence collection; no FV adjustment authority.",
              "WEAK":"Continue evidence collection only; no FV adjustment authority.",
              "NO_SIGNAL":"Park construct at neutral 1.00.",
              "maximum_future_initial_shadow_multiplier_deviation":0.03
            }
          }
          p=O/"b19_execution_contract.json"
          p.write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b19_execution_contract.sha256").write_text(h+"  b19_execution_contract.json\n")
          print("B19 contract SHA256",h)
          print("PASS: deterministic C1 implementation details frozen before historical association is opened.")
          PY

      - name: Execute one-shot C1 historical screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, math
          from pathlib import Path
          import numpy as np

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b19"
          cfg=json.loads((D/"b18/b18_config.json").read_text())
          contract=json.loads((O/"b19_execution_contract.json").read_text())
          B=int(contract["permutation_count"])
          assert B==99999
          assert contract["historical_class_years"]==list(range(2013,2024))

          recorded=(O/"b19_execution_contract.sha256").read_text().split()[0]
          actual_contract_sha=hashlib.sha256((O/"b19_execution_contract.json").read_bytes()).hexdigest()
          assert recorded==actual_contract_sha

          expected_projected={
            2013:("b17e/2013_projected_top60.json","56b997d8a674332ca562f3610d45056b9c9619423de0bf98aac6602e74df6bd5"),
            2014:("archive/historical-anchor-parsing-v2/parsed/2014_projected_top60.json","3e671e66e2ef549e868568f6cd924779a5e33709310ba50b5dea14893b2f25ec"),
            2015:("archive/historical-anchor-parsing-v2/parsed/2015_projected_top60.json","29cd7c1daca1fd7d0052eae604b85a043567d2aac12a71fe5c71c31b2bc8b969"),
            2016:("archive/historical-anchor-parsing-v2/parsed/2016_projected_top60.json","9a458104bea4f1710bec01581e5d667dbe2d7f3d9b3f9d255f57e11b0a0bd009"),
            2017:("archive/historical-anchor-parsing-v2/parsed/2017_projected_top60.json","bf21c989b9b08ca688954a45f3fb050483037dd55ec6821c42ead4ea104efc45"),
            2018:("archive/historical-anchor-parsing-v2/parsed/2018_projected_top60.json","c7e3e4a746d623e89a38e0e2c659fe0c736d09d18fbff99547769e760e460cc4"),
            2019:("archive/historical-anchor-parsing-v2/parsed/2019_projected_top60.json","b190ddcdbc52a70539be4f35ad69a136587fbf97122a19a3b2052ffab125818f"),
            2020:("archive/historical-anchor-parsing-v2/parsed/2020_projected_top60.json","4ea37424f290cd0159d7e5bd746a733d59d6307d6dc0470e864899ac1a2e4fbd"),
            2021:("archive/historical-anchor-parsing-v2/parsed/2021_projected_top60.json","1db595ea440c2a181d2a2e37be3448d9e5d8dd5ac068d112f4a21413e9650aec"),
            2022:("archive/historical-anchor-parsing-v2/parsed/2022_projected_top60.json","083c5bd2986daebcfc1fc0a3c4e2679fef3f2f8d915ef6870c55c6b85e8d97fc"),
            2023:("archive/historical-anchor-parsing-v2/parsed/2023_projected_top60.json","fcca571562cbb3fd36689a3014571fc375d2a12aa0e59ee40c9d7fc3a40968f5"),
          }
          expected_actual={
            2013:("b17e/2013_actual_top60.json","ec6aa805a58ce1c7182cdb4986c6eb0216d3a33ff7a3dd6294aa2b00b0db5d43"),
            2014:("archive/historical-anchor-parsing/target/2014_actual_top60.json","13dac1ff5551ed9d8c237ae747692e4c84d9eb0d6a4225e6c4444dadb32d5442"),
            2015:("archive/historical-anchor-parsing/target/2015_actual_top60.json","d45cd8bc7552012aee5981a63f2e86b8e5c683b33234562780c578fd27f6ca5d"),
            2016:("archive/historical-anchor-parsing/target/2016_actual_top60.json","14a96cd1ea9852b4e8576834f81a1bfe6e06aaef55b03d7e1889952b4ee0cf41"),
            2017:("archive/historical-anchor-parsing/target/2017_actual_top60.json","9edd6339318a895d3a37ce87473885527c38b2cb0fa7bf6b2570e13301be25a8"),
            2018:("archive/historical-anchor-parsing/target/2018_actual_top60.json","21c7d7454467d82bd8d5fa3b396507532fc3abb5dc79f81cbbb28b6a819dd6b6"),
            2019:("archive/historical-anchor-parsing/target/2019_actual_top60.json","066db4e8e8199fa523e8c8a4ff6f3ba3a6cf35cad78c00d2baf396efea440114"),
            2020:("archive/historical-anchor-parsing/target/2020_actual_top60.json","40e9fe03bf1c39e6b16d3718631d41e5a9f959f41cf1b7b6fc34e41b122d1b7f"),
            2021:("archive/historical-anchor-parsing/target/2021_actual_top60.json","5e89c1bfcf91b9b57934f26588556ab82cf3b716ad7872ef5ee78bd716100a66"),
            2022:("archive/historical-anchor-parsing/target/2022_actual_top60.json","b8fe93839598299be02ceda4ff1143a202e72fb502abdba27e07839463382bc8"),
            2023:("archive/historical-anchor-parsing/target/2023_actual_top60.json","ac67bee171e4c6e730872952a359ef45e9861ff06a794ec3ac45564f2473f5c0"),
          }
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          pickp=D/"b18/rich_hill_pick_values_1_60.csv"
          assert sha(pickp)=="3ff0004e20987786f4fa0df6372722533c0c826daf2067231ef6fd8f72b5af88"
          values={}
          with pickp.open(newline="") as f:
              for row in csv.DictReader(f):
                  values[int(row["selection_order"])]=float(row["rich_hill_points"])
          assert sorted(values)==list(range(1,61))
          assert values[1]==1000 and values[33]==180 and values[60]==88

          years=np.array(list(range(2013,2024)),dtype=float)
          rows=[]
          input_hashes={}
          for year in range(2013,2024):
              pp_rel,pp_hash=expected_projected[year]
              ap_rel,ap_hash=expected_actual[year]
              pp=D/pp_rel; ap=D/ap_rel
              assert sha(pp)==pp_hash and sha(ap)==ap_hash
              pobj=json.loads(pp.read_text()); aobj=json.loads(ap.read_text())
              assert pobj["class_year"]==year and aobj["class_year"]==year

              def capital(obj):
                  rr=obj["fantasy_rows"]
                  picks=[]
                  total=0.0
                  for r in rr:
                      k=int(r["pick"])
                      pos=r.get("primary_position") or r.get("fantasy_position")
                      if pos=="FB": pos="RB"
                      assert pos in {"QB","RB","WR","TE"}
                      assert 1<=k<=60
                      picks.append(k)
                      total += values[k]
                  assert len(picks)==len(set(picks))
                  assert total>0
                  return total,len(rr),sorted(picks)

              P,pn,ppicks=capital(pobj)
              A,an,apicks=capital(aobj)
              rows.append({
                "class_year":year,"projected_capital":P,"actual_capital":A,
                "x_log_projected":math.log(P),"y_log_actual":math.log(A),
                "projected_fantasy_row_n":pn,"actual_fantasy_row_n":an,
                "projected_fantasy_selection_orders":ppicks,
                "actual_fantasy_selection_orders":apicks
              })
              input_hashes[str(year)]={
                "projected":{"path":pp_rel,"sha256":pp_hash},
                "actual":{"path":ap_rel,"sha256":ap_hash}
              }

          x=np.array([r["x_log_projected"] for r in rows],dtype=float)
          y=np.array([r["y_log_actual"] for r in rows],dtype=float)
          assert len(x)==11 and np.all(np.isfinite(x)) and np.all(np.isfinite(y))
          assert np.std(x)>0 and np.std(y)>0

          def pearson(a,b):
              ac=a-a.mean(); bc=b-b.mean()
              den=math.sqrt(float(ac@ac)*float(bc@bc))
              return float(ac@bc/den) if den>0 else float("nan")

          def loo_s(a,b):
              n=len(a); em=[]; en=[]
              for i in range(n):
                  mask=np.arange(n)!=i
                  xt=a[mask]; yt=b[mask]
                  vx=float(np.sum((xt-xt.mean())**2))
                  slope=float(np.sum((xt-xt.mean())*(yt-yt.mean()))/vx) if vx>0 else 0.0
                  slope=max(0.0,slope)
                  intercept=float(yt.mean()-slope*xt.mean())
                  pred=intercept+slope*float(a[i])
                  neutral=float(yt.mean())
                  em.append((float(b[i])-pred)**2)
                  en.append((float(b[i])-neutral)**2)
              sse_m=float(sum(em)); sse_n=float(sum(en))
              return float(1.0-sse_m/sse_n) if sse_n>0 else float("-inf")

          def perm_pearson_p(a,b,seed,B):
              obs=pearson(a,b)
              rng=np.random.default_rng(seed)
              ge=0; remaining=B; n=len(a)
              ac=a-a.mean(); anx=math.sqrt(float(ac@ac))
              while remaining:
                  m=min(5000,remaining)
                  idx=np.argsort(rng.random((m,n)),axis=1)
                  bp=b[idx]
                  bc=bp-bp.mean(axis=1,keepdims=True)
                  den=anx*np.sqrt(np.sum(bc*bc,axis=1))
                  stats=np.sum(bc*ac[None,:],axis=1)/den
                  ge += int(np.count_nonzero(stats >= obs-1e-15))
                  remaining-=m
              p=(1+ge)/(B+1)
              return obs,float(p),int(ge)

          def full_x_t(a,b,yr):
              X=np.column_stack([np.ones(len(a)),yr,a])
              beta=np.linalg.lstsq(X,b,rcond=None)[0]
              resid=b-X@beta
              df=len(a)-X.shape[1]
              assert df>0
              s2=float(resid@resid/df)
              inv=np.linalg.inv(X.T@X)
              se=math.sqrt(max(0.0,s2*float(inv[2,2])))
              return float(beta[2]/se) if se>0 else (float("inf") if beta[2]>0 else float("-inf"))

          def freedman_lane_p(a,b,yr,seed,B):
              R=np.column_stack([np.ones(len(a)),yr])
              beta_r=np.linalg.lstsq(R,b,rcond=None)[0]
              fitted=R@beta_r
              resid=b-fitted
              X=np.column_stack([np.ones(len(a)),yr,a])
              pinv=np.linalg.pinv(X)
              inv=np.linalg.inv(X.T@X)
              df=len(a)-X.shape[1]
              obs=full_x_t(a,b,yr)
              rng=np.random.default_rng(seed)
              ge=0; remaining=B; n=len(a)
              while remaining:
                  m=min(5000,remaining)
                  idx=np.argsort(rng.random((m,n)),axis=1)
                  ys=fitted[None,:]+resid[idx]
                  betas=ys@pinv.T
                  fitted_full=betas@X.T
                  er=ys-fitted_full
                  s2=np.sum(er*er,axis=1)/df
                  se=np.sqrt(np.maximum(0.0,s2*float(inv[2,2])))
                  t=np.divide(betas[:,2],se,out=np.where(betas[:,2]>=0,np.inf,-np.inf),where=se>0)
                  ge += int(np.count_nonzero(t >= obs-1e-15))
                  remaining-=m
              return obs,float((1+ge)/(B+1)),int(ge)

          g1_r,g1_p,g1_ge=perm_pearson_p(x,y,180000,B)
          g1_s=loo_s(x,y)
          g1_pass=bool(g1_p<=0.05 and g1_s>0.0)

          g2_deletions=[]
          for i,year in enumerate(range(2013,2024)):
              keep=np.arange(11)!=i
              rr,pp,ge=perm_pearson_p(x[keep],y[keep],181000+i,B)
              ss=loo_s(x[keep],y[keep])
              passed=bool(pp<=0.15 and ss>0.0)
              g2_deletions.append({
                "deleted_class_year":year,"pearson_r":rr,"permutation_p":pp,
                "permuted_ge_observed":ge,"loo_S":ss,"pass":passed,
                "seed":181000+i,"permutation_count":B
              })
          g2_pass=bool(all(d["pass"] for d in g2_deletions))

          g3_t,g3_p,g3_ge=freedman_lane_p(x,y,years,182000,B)
          g3_pass=bool(g3_p<=0.15)

          if not g1_pass:
              classification="NO_SIGNAL"
          elif g2_pass and g3_pass:
              classification="STRONG"
          elif g2_pass ^ g3_pass:
              classification="MODERATE"
          else:
              classification="WEAK"

          if classification=="STRONG":
              next_authority="AUTHORIZE_SEPARATE_LAYER_D_SHADOW_CALIBRATION_STUDY_ONLY_NO_PRODUCTION"
          elif classification=="MODERATE":
              next_authority="CONTINUE_EVIDENCE_COLLECTION_NO_FV_ADJUSTMENT_AUTHORITY"
          elif classification=="WEAK":
              next_authority="CONTINUE_EVIDENCE_COLLECTION_ONLY_NO_FV_ADJUSTMENT_AUTHORITY"
          else:
              next_authority="PARK_DRAFT_CAPITAL_OUTLOOK_CONSTRUCT_AT_NEUTRAL_1_00"

          result={
            "schema_version":1,"study_id":"draft-capital-outlook-v1","stage":"b19_c1_result",
            "decision":f"C1_{classification}","classification":classification,
            "historical_class_years":list(range(2013,2024)),"historical_class_n":11,
            "construct":{"x":"ln(P_c)","y":"ln(A_c)","top_n":60,"pick_curve":"B18 frozen Rich Hill"},
            "G1":{
              "alpha":0.05,"pearson_r":g1_r,"permutation_p":g1_p,"permuted_ge_observed":g1_ge,
              "loo_S":g1_s,"association_pass":bool(g1_p<=0.05),"utility_pass":bool(g1_s>0),
              "pass":g1_pass,"seed":180000,"permutation_count":B
            },
            "G2":{"alpha":0.15,"pass":g2_pass,"all_deletions_must_pass":True,"deletions":g2_deletions},
            "G3":{
              "alpha":0.15,"method":"Freedman-Lane reduced y~1+year; permute reduced residuals; full y~1+year+x",
              "observed_x_t":g3_t,"permutation_p":g3_p,"permuted_ge_observed":g3_ge,
              "pass":g3_pass,"seed":182000,"permutation_count":B
            },
            "downstream_authority":next_authority,
            "maximum_future_initial_shadow_multiplier_deviation":0.03,
            "direct_production_authority":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "post_c1_gate_movement_allowed":False,
            "model_or_target_shopping_after_c1_allowed":False
          }

          with (O/"historical_capital_table.csv").open("w",newline="") as f:
              w=csv.writer(f,lineterminator="\n")
              w.writerow(["class_year","projected_capital","actual_capital","ln_projected","ln_actual","projected_fantasy_rows","actual_fantasy_rows"])
              for r in rows:
                  w.writerow([r["class_year"],r["projected_capital"],r["actual_capital"],r["x_log_projected"],r["y_log_actual"],r["projected_fantasy_row_n"],r["actual_fantasy_row_n"]])
          (O/"historical_capital_details.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          (O/"b19_input_hashes.json").write_text(json.dumps(input_hashes,indent=2,sort_keys=True)+"\n")
          (O/"c1_result.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          report=f"""# B19 Draft Capital Outlook V1 — C1 Exploratory Historical Screen\n\n- Classification: **{classification}**\n- G1: {'PASS' if g1_pass else 'FAIL'} — r={g1_r:.6f}, p={g1_p:.6f}, LOO S={g1_s:.6f}\n- G2: {'PASS' if g2_pass else 'FAIL'} — every single-class deletion required\n- G3: {'PASS' if g3_pass else 'FAIL'} — x t={g3_t:.6f}, Freedman-Lane p={g3_p:.6f}\n- Historical classes: 2013–2023 (n=11)\n- Permutations per inferential test: {B:,}\n- 2027 scored: **NO**\n- Production change authorized: **NO**\n- Downstream authority: `{next_authority}`\n\nThis is the single B18-authorized exploratory C1 screen. Gates and classification rules were frozen before the historical predictor-target association was opened.\n"""
          (O/"b19_report.md").write_text(report)

          print(json.dumps(result,indent=2,sort_keys=True))
          print("PASS: C1 executed exactly under the frozen B18/B19 protocol.")
          PY

      - name: Build immutable B19 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          O=Path("research/draft-capital-outlook-v1/b19")
          result=json.loads((O/"c1_result.json").read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          names=[
            "b19_execution_contract.json","b19_execution_contract.sha256",
            "b19_input_hashes.json","historical_capital_table.csv",
            "historical_capital_details.json","c1_result.json","b19_report.md"
          ]
          for n in names: assert (O/n).is_file(),n
          manifest={
            "schema_version":1,"study_id":"draft-capital-outlook-v1","stage":"b19_manifest",
            "c1_executed":True,"c1_execution_count_committed":1,
            "classification":result["classification"],"decision":result["decision"],
            "historical_capital_values_computed":True,"predictor_target_association_computed":True,
            "2027_class_scored":False,"production_change_authorized":False,
            "direct_production_authority":False,"downstream_authority":result["downstream_authority"],
            "output_hashes":{n:sha(O/n) for n in names}
          }
          (O/"b19_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

      - name: Verify research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          lines=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True).splitlines()
          assert lines, "expected B19 research outputs"
          bad=[]
          for line in lines:
              path=line[3:]
              if " -> " in path: path=path.split(" -> ",1)[1]
              if not path.startswith("research/draft-capital-outlook-v1/b19/"):
                  bad.append(line)
          assert not bad, "non-B19 mutation(s): "+repr(bad)
          print("PASS: only research/draft-capital-outlook-v1/b19/ is modified.")
          PY

      - name: Run repository regression after C1 without losing research outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b19-preserve
          cp -a research/draft-capital-outlook-v1/b19 /tmp/b19-preserve
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          mkdir -p research/draft-capital-outlook-v1
          cp -a /tmp/b19-preserve research/draft-capital-outlook-v1/b19
          test -f research/draft-capital-outlook-v1/b19/c1_result.json
          echo "PASS: repository regression suite green after C1 computation."

      - name: Final scientific firewall and reproducibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          D=Path("research/draft-capital-outlook-v1")
          O=D/"b19"
          r=json.loads((O/"c1_result.json").read_text())
          m=json.loads((O/"b19_manifest.json").read_text())
          c=json.loads((O/"b19_execution_contract.json").read_text())
          assert r["classification"] in {"STRONG","MODERATE","WEAK","NO_SIGNAL"}
          assert r["decision"]=="C1_"+r["classification"]
          assert r["historical_class_n"]==11
          assert r["G1"]["permutation_count"]==99999
          assert len(r["G2"]["deletions"])==11
          assert all(d["permutation_count"]==99999 for d in r["G2"]["deletions"])
          assert r["G3"]["permutation_count"]==99999
          assert c["post_c1_gate_movement_allowed"] is False
          assert c["model_or_target_shopping_after_c1_allowed"] is False
          assert r["2027_class_scored"] is False
          assert r["production_change_authorized"] is False
          assert r["direct_production_authority"] is False
          assert m["c1_executed"] is True and m["c1_execution_count_committed"]==1
          assert m["2027_class_scored"] is False and m["production_change_authorized"] is False
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          for name,want in m["output_hashes"].items():
              assert sha(O/name)==want,(name,sha(O/name),want)
          recorded=(O/"b19_execution_contract.sha256").read_text().split()[0]
          assert recorded==sha(O/"b19_execution_contract.json")
          print("C1 CLASSIFICATION:",r["classification"])
          print("NEXT AUTHORITY:",r["downstream_authority"])
          print("PASS: final B19 scientific firewall, hashes, and one-shot manifest verified.")
          PY
          git diff --check

      - name: Commit B19 C1 result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "main moved during B19; refusing to commit a result against a different repository state" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v1/b19/
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          bad="$(git diff --cached --name-only | grep -v '^research/draft-capital-outlook-v1/b19/' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          git commit -m "B19: execute frozen C1 exploratory historical screen"
          git push origin HEAD:main
