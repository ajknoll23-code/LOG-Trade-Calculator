name: Draft Pick FV V8.1 - Final Research Closeout

"on":
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: draft-pick-fv-v8-1-final-research-closeout
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Guard exact one-shot H2 result
        shell: bash
        run: |
          set -euo pipefail

          # The workflow upload itself advances main, so do not pin the branch HEAD.
          # Instead pin every scientific input/result blob that defines this closeout.
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.json)" =             "8c787d2330ffd1d92fa0173479d7cb361133e796"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase1_sparse_tail_sensitivity.json)" =             "c846f0a690c13ae9eff4dc0502e20bf24e056772"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase1_6_holdout_rookie_only_scope_hardening.json)" =             "dfa78215fb33ef0cdbe12ce9b5c0f37fa43d627d"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_lock.json)" =             "deec1433b822747726debba7677ecb484f1cad81"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json)" =             "fca01dbea074a0ad83dc4caa149c1e8360ff5466"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json)" =             "6a65f8562bdeeae8d13100b30801e6ad8c3d480b"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_closeout.json)" =             "64ce1654446f46d92f817ca353f52df983132051"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_frozen.py)" =             "4fce145ccbd97758fca69fe95d55930eab52f982"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")

          prereg=json.loads((d/"v8_1_carryforward_preregistration.json").read_text())
          p1=json.loads((d/"v8_1_phase1_sparse_tail_sensitivity.json").read_text())
          p16=json.loads((d/"v8_1_phase1_6_holdout_rookie_only_scope_hardening.json").read_text())
          lock=json.loads((d/"v8_1_phase2_2024_h2_opening_lock.json").read_text())
          result=json.loads((d/"v8_1_phase2_2024_h2_confirmation.json").read_text())
          manifest=json.loads((d/"v8_1_phase2_2024_h2_confirmation_manifest.json").read_text())
          close=json.loads((d/"v8_1_phase2_2024_h2_opening_closeout.json").read_text())

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          assert prereg["decision"]=="FREEZE_V8_1_C1_CARRYFORWARD_SPARSE_SENSITIVITY_NEXT"
          assert prereg["frozen_primary_candidate"]["candidate_id"]=="C1_GLOBAL_SCALE_R1_R6_CARRYFORWARD"
          assert prereg["frozen_primary_candidate"]["k"]==0.3557942893
          assert prereg["phase2_2024_h2_independent_confirmation"]["open_exactly_once"] is True
          assert prereg["phase2_2024_h2_independent_confirmation"]["candidate_refit_allowed"] is False
          assert prereg["phase2_2024_h2_independent_confirmation"]["can_authorize_production"] is False

          assert p1["decision"]=="PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE"
          assert p16["decision"]=="PASS_V8_1_PHASE1_6_ROOKIE_ONLY_SCOPE_HARDENING_H2_AUTHORIZED"

          assert lock["decision"]=="LOCK_V8_1_2024_H2_ONE_SHOT_OPENING"
          assert lock["normal_rerun_after_lock_allowed"] is False
          assert lock["frozen_candidate"]["k"]==0.3557942893
          assert lock["scorer_sha256"]=="749b8444bc3b4a13211db9e39a04546aa7b2d81ed790179bee5de0c0725ae696"

          assert result["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert result["status"]=="H2_CONFIRMATION_STOP"
          assert result["gate_pass"] is False
          assert result["next_stage"] is None

          gates=result["gates"]
          assert gates["2024_h2_o2_equal_cell_macro_mae_improvement_vs_C0_ge_5pct"] is True
          assert gates["combined_r5_r6_2024_h2_o2_macro_mae_relative_regression_vs_C0_le_5pct"] is True
          assert gates["2024_h2_o1_normalized_18_cell_shape_error_regression_vs_C0_le_2pct"] is True
          assert gates["all_frozen_source_identity_retention_gates_remain_satisfied"] is True
          assert gates["candidate_parameter_and_18_cell_values_unchanged_since_v8_1_phase0_freeze"] is True
          assert gates["no_individual_round_2024_h2_o2_macro_mae_regression_vs_C0_worse_than_5pct"] is False

          o2=result["metrics"]["h2_o2"]
          assert abs(o2["C1_improvement_vs_C0"]-0.5598697499731174)<1e-15
          assert abs(o2["round_relative_regression_vs_C0"]["6"]-0.3015672140922469)<1e-15
          assert abs(o2["combined_r5_r6_relative_regression_vs_C0"]-(-0.0688394357871692))<1e-15
          assert result["metrics"]["h2_o1_shape"]["C1_relative_regression_vs_C0"]==0

          assert result["holdout_opening"]["2024_rookie_H2_outcomes_scored"] is True
          assert result["holdout_opening"]["2024_H3_confirmation_scored"] is False
          assert result["holdout_opening"]["2026_outcomes_read"] is False
          assert result["holdout_opening"]["partial_2026_data_read"] is False
          assert result["holdout_opening"]["open_exactly_once_contract_satisfied"] is True

          assert manifest["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert manifest["gate_pass"] is False
          assert manifest["next_stage"] is None
          assert manifest["2024_holdout_H2_opened"] is True
          assert manifest["2024_H3_confirmation_scored"] is False
          assert manifest["2026_outcomes_read"] is False
          assert manifest["candidate_refit_performed"] is False
          assert manifest["production_change_authorized"] is False

          assert manifest["output_hashes"]["v8_1_phase2_2024_h2_confirmation.json"]==sha(d/"v8_1_phase2_2024_h2_confirmation.json")
          assert manifest["output_hashes"]["v8_1_phase2_2024_h2_confirmation.md"]==sha(d/"v8_1_phase2_2024_h2_confirmation.md")
          assert manifest["output_hashes"]["v8_1_phase2_2024_h2_scored_occurrences.jsonl"]==sha(d/"v8_1_phase2_2024_h2_scored_occurrences.jsonl")

          assert close["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert close["gate_pass"] is False
          assert close["normal_rerun_allowed"] is False
          assert close["2024_h2_outcome_bytes_opened"] is True
          assert close["2024_rookie_h2_scored"] is True
          assert close["2024_h3_scored"] is False
          assert close["2026_outcomes_read"] is False
          assert close["production_change_authorized"] is False

          print("PASS: exact one-shot H2 STOP result and firewalls verified.")
          PY

      - name: Freeze V8.1 final research closeout
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v8-1"

          for f in \
            "$D/v8_1_final_research_closeout.json" \
            "$D/v8_1_final_research_closeout.md" \
            "$D/v8_1_final_research_closeout_manifest.json"
          do
            test ! -e "$f" || {
              echo "ERROR: final V8.1 closeout already exists: $f"
              exit 1
            }
          done

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")
          generated=datetime.now(timezone.utc).isoformat()

          prereg=json.loads((d/"v8_1_carryforward_preregistration.json").read_text())
          result=json.loads((d/"v8_1_phase2_2024_h2_confirmation.json").read_text())
          close=json.loads((d/"v8_1_phase2_2024_h2_opening_closeout.json").read_text())

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          decision="CLOSE_V8_1_H2_STOP_NO_H3_NO_PRODUCTION"
          obj={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-1-global-scale-sparse-tail-holdout-confirmation",
              "stage":"v8_1_final_research_closeout",
              "status":"RESEARCH_CLOSED_H2_CONFIRMATION_STOP",
              "generated_at_utc":generated,
              "decision":decision,
              "primary_candidate":{
                  "candidate_id":"C1_GLOBAL_SCALE_R1_R6_CARRYFORWARD",
                  "k":0.3557942893,
                  "candidate_refit_performed":False,
              },
              "development_evidence":{
                  "v8_c1_h3_o2_improvement":0.5855525789,
                  "v8_c1_failed_gate":"no_individual_round_h3_o2_regression_worse_than_5pct",
                  "v8_c1_r6_relative_regression":0.2257493235,
              },
              "v8_1_phase1_sparse_tail_sensitivity":"PASS",
              "v8_1_phase1_6_holdout_source_hardening":"PASS",
              "independent_2024_h2":{
                  "decision":result["decision"],
                  "gate_pass":False,
                  "h2_o2_equal_cell_macro_mae_improvement_vs_C0":result["metrics"]["h2_o2"]["C1_improvement_vs_C0"],
                  "round_relative_regression_vs_C0":result["metrics"]["h2_o2"]["round_relative_regression_vs_C0"],
                  "worst_round_relative_regression_vs_C0":max(result["metrics"]["h2_o2"]["round_relative_regression_vs_C0"].values()),
                  "failed_round":6,
                  "combined_r5_r6_relative_regression_vs_C0":result["metrics"]["h2_o2"]["combined_r5_r6_relative_regression_vs_C0"],
                  "o1_shape_relative_regression_vs_C0":result["metrics"]["h2_o1_shape"]["C1_relative_regression_vs_C0"],
                  "only_failed_primary_gate":"no individual round 2024 H2 O2 macro MAE regression vs C0 worse than 5%",
              },
              "one_shot_state":{
                  "2024_h2_outcomes_opened":True,
                  "2024_h2_scored":True,
                  "normal_h2_rerun_allowed":False,
                  "2024_h3_scored":False,
                  "2026_outcomes_read":False,
              },
              "scientific_conclusion":{
                  "v8_1_candidate_eligible_for_future_h3_confirmation":False,
                  "v8_1_candidate_eligible_for_production":False,
                  "production_change_authorized":False,
                  "automatic_production_promotion_allowed":False,
                  "reason":"The preregistered 2024 H2 confirmation failed the individual-round gate because Round 6 H2 O2 macro MAE regressed 30.1567% versus deployed C0, exceeding the allowed 5% maximum.",
              },
              "frozen_next_action":{
                  "within_v8_1":None,
                  "future_research_must_be_new_study":True,
                  "new_study_must_not_reinterpret_v8_1_h2_stop_as_pass":True,
                  "2024_h2_is_now_exposed_and_must_not_be_treated_as_fresh_holdout_again":True,
                  "candidate_or_gate_changes_require_new_preregistration":True,
              },
              "firewalls":{
                  "candidate_refit_after_h2":False,
                  "gate_change_after_h2":False,
                  "2024_h3_scored":False,
                  "2026_outcomes_read":False,
                  "market_or_ktc_used_for_v8_1_selection":False,
                  "package_votes_used_for_v8_1_selection":False,
                  "production_change_authorized":False,
              },
              "input_hashes":{
                  "v8_1_carryforward_preregistration.json":sha(d/"v8_1_carryforward_preregistration.json"),
                  "v8_1_phase1_sparse_tail_sensitivity.json":sha(d/"v8_1_phase1_sparse_tail_sensitivity.json"),
                  "v8_1_phase1_6_holdout_source_identity.json":sha(d/"v8_1_phase1_6_holdout_source_identity.json"),
                  "v8_1_phase2_2024_h2_opening_lock.json":sha(d/"v8_1_phase2_2024_h2_opening_lock.json"),
                  "v8_1_phase2_2024_h2_confirmation_frozen.py":sha(d/"v8_1_phase2_2024_h2_confirmation_frozen.py"),
                  "v8_1_phase2_2024_h2_confirmation.json":sha(d/"v8_1_phase2_2024_h2_confirmation.json"),
                  "v8_1_phase2_2024_h2_confirmation_manifest.json":sha(d/"v8_1_phase2_2024_h2_confirmation_manifest.json"),
                  "v8_1_phase2_2024_h2_opening_closeout.json":sha(d/"v8_1_phase2_2024_h2_opening_closeout.json"),
              },
          }

          jp=d/"v8_1_final_research_closeout.json"
          jp.write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")

          md=d/"v8_1_final_research_closeout.md"
          rr=obj["independent_2024_h2"]["round_relative_regression_vs_C0"]
          md.write_text(
              "# Draft Pick FV V8.1 — Final Research Closeout\n\n"
              f"**Decision:** `{decision}`\n\n"
              "V8.1 is scientifically closed. The frozen C1 global-scale candidate produced a "
              f"**{obj['independent_2024_h2']['h2_o2_equal_cell_macro_mae_improvement_vs_C0']:.2%}** "
              "overall H2 O2 macro-MAE improvement versus C0, but failed the preregistered "
              "individual-round gate.\n\n"
              f"- Round 6 relative regression vs C0: **{rr['6']:.2%}** (limit: 5%)\n"
              f"- Combined R5-R6 relative regression vs C0: **{obj['independent_2024_h2']['combined_r5_r6_relative_regression_vs_C0']:.2%}**\n"
              f"- O1 normalized-shape regression vs C0: **{obj['independent_2024_h2']['o1_shape_relative_regression_vs_C0']:.2%}**\n"
              "- All other primary H2 gates passed.\n\n"
              "The one-shot 2024 H2 holdout is now exposed and may not be reused as fresh "
              "confirmation evidence. V8.1 does not proceed to H3 and does not authorize any "
              "production change. Any redesigned candidate family or gate structure must start "
              "under a new preregistered study.\n"
          )

          man={
              "schema_version":1,
              "study_id":obj["study_id"],
              "stage":"v8_1_final_research_closeout_manifest",
              "status":obj["status"],
              "generated_at_utc":generated,
              "decision":decision,
              "h2_decision":"STOP_V8_1_2024_H2_CONFIRMATION",
              "h3_authorized":False,
              "production_change_authorized":False,
              "normal_h2_rerun_allowed":False,
              "closeout_sha256":sha(jp),
              "closeout_markdown_sha256":sha(md),
              "next_stage":None,
          }
          (d/"v8_1_final_research_closeout_manifest.json").write_text(
              json.dumps(man,indent=2,sort_keys=True)+"\n"
          )

          print("DECISION="+decision)
          print("H2_STOP=true")
          print("H3_AUTHORIZED=false")
          print("PRODUCTION_AUTHORIZED=false")
          PY

      - name: Independently validate final closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")
          c=json.loads((d/"v8_1_final_research_closeout.json").read_text())
          m=json.loads((d/"v8_1_final_research_closeout_manifest.json").read_text())
          r=json.loads((d/"v8_1_phase2_2024_h2_confirmation.json").read_text())

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          assert c["decision"]=="CLOSE_V8_1_H2_STOP_NO_H3_NO_PRODUCTION"
          assert c["status"]=="RESEARCH_CLOSED_H2_CONFIRMATION_STOP"
          assert c["independent_2024_h2"]["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert c["independent_2024_h2"]["failed_round"]==6
          assert c["scientific_conclusion"]["v8_1_candidate_eligible_for_future_h3_confirmation"] is False
          assert c["scientific_conclusion"]["v8_1_candidate_eligible_for_production"] is False
          assert c["scientific_conclusion"]["production_change_authorized"] is False
          assert c["one_shot_state"]["normal_h2_rerun_allowed"] is False
          assert c["one_shot_state"]["2024_h3_scored"] is False
          assert c["one_shot_state"]["2026_outcomes_read"] is False
          assert c["frozen_next_action"]["within_v8_1"] is None
          assert c["frozen_next_action"]["future_research_must_be_new_study"] is True
          assert c["frozen_next_action"]["2024_h2_is_now_exposed_and_must_not_be_treated_as_fresh_holdout_again"] is True

          assert m["decision"]==c["decision"]
          assert m["h2_decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert m["h3_authorized"] is False
          assert m["production_change_authorized"] is False
          assert m["normal_h2_rerun_allowed"] is False
          assert m["next_stage"] is None
          assert m["closeout_sha256"]==sha(d/"v8_1_final_research_closeout.json")
          assert m["closeout_markdown_sha256"]==sha(d/"v8_1_final_research_closeout.md")

          assert r["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert r["next_stage"] is None

          print("PASS: V8.1 final closeout faithfully preserves the one-shot H2 STOP.")
          PY

      - name: Prove exact research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v8-1/v8_1_final_research_closeout.json"
            "research/draft-pick-fv-v8-1/v8_1_final_research_closeout.md"
            "research/draft-pick-fv-v8-1/v8_1_final_research_closeout_manifest.json"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: exactly three final closeout research files changed."

      - name: Run repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
          python3 scripts/validation/repo_regression_checks.py

      - name: Upload final V8.1 closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-final-research-closeout
          path: |
            research/draft-pick-fv-v8-1/v8_1_final_research_closeout.json
            research/draft-pick-fv-v8-1/v8_1_final_research_closeout.md
            research/draft-pick-fv-v8-1/v8_1_final_research_closeout_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit final V8.1 closeout
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during closeout."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v8-1/v8_1_final_research_closeout.json \
            research/draft-pick-fv-v8-1/v8_1_final_research_closeout.md \
            research/draft-pick-fv-v8-1/v8_1_final_research_closeout_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no V8.1 closeout files staged."
            exit 1
          }

          git commit -m "Close Draft Pick FV V8.1 after H2 confirmation stop"
          git push origin HEAD:main

          echo "PASS: V8.1 closed with H2 STOP; no H3 or production authorization."
