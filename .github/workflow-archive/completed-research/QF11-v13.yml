# QF11 V13: RESEARCH ONLY. No voting, release, model repricing, source identity writes.
name: QF11 V13 - Three Held Slot Constraint Attribution and Identity Review (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF11_V13_ROOT: .
  QF11_V13_INPUT: /tmp/qf11-v13-input
  QF11_V13_OUTPUT: /tmp/qf11-v13-output
jobs:
  research:
    name: Attribute held slots 05 11 21 and conditionally preserved player identity sources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin immutable production and crosswalk inputs
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo QF11_V13_SOURCE_PINS_GREEN'
    - name: Download exact V12 conditional 25-slot and TE archive
      uses: actions/download-artifact@v4
      with:
        name: QF11-v12-RESEARCH-ONLY-conditional-priority-preservation
        run-id: 38299942270
        github-token: ${{ github.token }}
        path: /tmp/qf11-v13-input/v12
    - name: Download exact V11 identity evidence archive
      uses: actions/download-artifact@v4
      with:
        name: QF11-v11-RESEARCH-ONLY-identity-priority-decision
        run-id: 38281366896
        github-token: ${{ github.token }}
        path: /tmp/qf11-v13-input/v11
    - name: Download exact V10 source-bounded global slate
      uses: actions/download-artifact@v4
      with:
        name: QF11-v10-RESEARCH-ONLY-global-owner-review
        run-id: 38279761923
        github-token: ${{ github.token }}
        path: /tmp/qf11-v13-input/v10
    - name: Download exact V3 same-cohort prospective FV evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v13-input/v3
    - name: Independently attribute TE redesign blocks and held player ID evidence
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/qf11-v13-audit.py <<'QF11_V13_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V13 -- frozen-data,\
        \ read-only block-attribution research.\nNo voting, model or identity changes; proposals are NOT voter-ready.\n\"\"\
        \"\nimport collections, hashlib, json, os, re, sys\nfrom pathlib import Path\n\nFIXTURE='--fixture' in sys.argv\n\
        ROOT=Path(os.getenv('QF11_V13_ROOT','.'))\nINPUT=Path(os.getenv('QF11_V13_INPUT','/mnt/data/qf11-v13-fixture' if FIXTURE\
        \ else '/tmp/qf11-v13-input'))\nOUTPUT=Path(os.getenv('QF11_V13_OUTPUT','/mnt/data/qf11-v13-fixture-output' if FIXTURE\
        \ else '/tmp/qf11-v13-output'))\nOUTPUT.mkdir(parents=True,exist_ok=True)\nPINS={\n 'v12_slate':('v12/RESEARCH_ONLY_v12_conditional_priority_slate.json','c30a9e9b5c0d8c44ac969d5f1b6e00d18b0a641be1873161b43cb79a2d52cd7c'),\n\
        \ 'v12_te':('v12/RESEARCH_ONLY_v12_slot11_te_options.json','57f7461c657e7e5d10337123e3611f771147a5882f0b7cfbaa13d248fd71758a'),\n\
        \ 'v11':('v11/RESEARCH_ONLY_v11_identity_and_priority_matrix.json','3850b117dfcd5b0f0087573ffc399513f92b233de4e9960ba2e957d4c40f402a'),\n\
        \ 'v10':('v10/RESEARCH_ONLY_v10_shadow_slate.json','5d531e5ddaf97ff4aa6e2590b9b68680af56bde46f9c6b1528f9db7a2a08c62f'),\n\
        \ 'v3':('v3/PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json','19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc'),\n\
        }\ndata={}\nfor k,(rel,sha) in PINS.items():\n p=INPUT/rel\n assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,\
        \ 'STOP ARCHIVE SOURCE SHA '+k\n data[k]=json.loads(p.read_text())\na=data['v12_slate'];te_result=data['v12_te'];v11=data['v11'];v10=data['v10'];v3=data['v3']\n\
        assert a['summary']['status']=='RESEARCH_ONLY_PRIORITY_CONDITIONAL_RETAIN_AND_TE_RESCUE'\nassert a['summary']['v12_conditional_priority_preserving_slots']==25\n\
        assert a['summary']['v12_conditional_slots_without_identity_clearance']==[1,8,12,15]\nassert a['summary']['original_unresolved_slots']==[5,11,21]\n\
        assert a['summary']['owner_approval'] is False and a['summary']['voting_activated'] is False\nassert a['summary']['v12_strict_te_candidates']==33\n\
        assert len(a['slots'])==25 and len(v11['identity_evidence'])==10\nassert len(v10['slots'])==28 and len(v3['players'])==504\n\
        assert te_result['options']==[] and te_result['source_screened_candidate_count']==33\nassert v11['owner_approval']\
        \ is False and v3['research_only'] and not v3['deployment_authorized']\npvals=v3['players']\ndef info(k):\n assert\
        \ k in pvals, 'STOP MISSING FROZEN PLAYER '+k\n return pvals[k]\ndef ratio(names):\n vs=[info(n)['fundamental_value']\
        \ for n in names]\n assert min(vs)>0\n return max(vs)/min(vs)\noccupied=collections.Counter(k for row in a['slots']\
        \ for k in row['players'])\nused_pairs={tuple(sorted(row['same_position_pair'])) for row in a['slots']}\nassert len(used_pairs)==25\
        \ and max(occupied.values())<=2\nfor row in a['slots']:\n names=row['players']\n assert len(names)==len(set(names))==3\n\
        \ assert info(names[0])['pos']==info(names[1])['pos']!=info(names[2])['pos']\n assert ratio(names)<=1.30+1e-9\n assert\
        \ row['ballot_issuance_authorized'] is False\n\n# Strict screening uses exactly the V12 policy. No fuzzy matching\
        \ or silent name corrections.\ndef norm(x): return re.sub(r'\\s+',' ',re.sub(r'[^a-z0-9 ]',' ',str(x or '').lower())).strip()\n\
        def team(x):\n x=str(x or '').upper()\n return {'JAC':'JAX','WSH':'WAS','LA':'LAR'}.get(x,x)\nif not FIXTURE:\n crosswalk=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())\n\
        \ assert isinstance(crosswalk,list) and len(crosswalk)>150\n from scripts.validation.snapshot_values import extract_object_body\n\
        \ player_body=extract_object_body((ROOT/'index.html').read_text(),'PLAYER_DB')\n pattern=re.compile(r\"'([^']+)':\\\
        {pos:'([A-Z]+)',age:\\d+,role:'[^']+',team:'([^']+)'\",re.M)\n model={k:{'pos':pos,'team':t} for k,pos,t in pattern.findall(player_body)}\n\
        \ assert len(model)>=500\nelse:\n # Structural smoke fixture; it is not source verification.\n crosswalk=[]; model={k:{'pos':v['pos'],'team':'ZZ'}\
        \ for k,v in pvals.items()}\n for k,v in pvals.items():\n  crosswalk.append({'name':k,'sleeper_id':'synthetic','fp_position':v['pos'],\n\
        \   'sleeper_pos':v['pos'],'fp_team':'ZZ','sleeper_team':'ZZ'})\nbyname=collections.defaultdict(list)\nfor r in crosswalk:\n\
        \ if r.get('name'):byname[norm(r['name'])].append(r)\n\ndef strict(k):\n m=model.get(k)\n if not m or k not in pvals\
        \ or m['pos']!=info(k)['pos']:return False\n matches=byname.get(norm(k),[])\n if len(matches)!=1:return False\n r=matches[0]\n\
        \ return bool(r.get('sleeper_id')) and r.get('fp_position')==m['pos'] and r.get('sleeper_pos')==m['pos'] and team(r.get('fp_team'))==team(m['team'])\
        \ and team(r.get('sleeper_team'))==team(m['team'])\nstrict_te=sorted(k for k in pvals if info(k)['pos']=='TE' and\
        \ strict(k))\nstrict_non_te=sorted(k for k in pvals if info(k)['pos']!='TE' and strict(k) and k not in {'aaron donald','joe\
        \ mixon'})\nif not FIXTURE: assert len(strict_te)==33, 'STOP V12 SOURCE SCREENING DRIFT'\n\n# Which constraint prevents\
        \ the fixed-Nakobe one-TE-retained rescue?\noriginal=['brock bowers','trey mcbride','nakobe dean']\nassert info(original[0])['pos']==info(original[1])['pos']=='TE'\n\
        assert info(original[2])['pos']!='TE'\nfail_counts=collections.Counter()\nfixed=[]\nfor prior in original[:2]:\n for\
        \ other in sorted(k for k in pvals if info(k)['pos']=='TE' and k not in original):\n  names=[prior,other,original[2]]\n\
        \  reasons=[]\n  if other not in strict_te:reasons.append('substitute_not_strict_source_screened')\n  if any(occupied[k]>=2\
        \ for k in names):reasons.append('global_appearance_cap')\n  if tuple(sorted(names[:2])) in used_pairs:reasons.append('repeated_same_position_pair')\n\
        \  if ratio(names)>1.30+1e-9:reasons.append('three_way_FV_ratio')\n  if len(set(names))!=3:reasons.append('repeated_player_within_ballot')\n\
        \  for reason in reasons:fail_counts[reason]+=1\n  if not reasons:fixed.append({'players':names,'ratio':round(ratio(names),6),'preserved':prior})\n\
        if not FIXTURE:assert len(fixed)==0, 'STOP V12 FIXED-THIRD REPRODUCIBILITY'\n\n# Explicit *design changes* only, not\
        \ approved substitutes or a joint 28-slot solution.\n# A: Keep one original TE, replace BOTH the other TE and Nakobe\
        \ Dean.\nchanged_third=[]\nfor prior in original[:2]:\n for other in strict_te:\n  if other in original:continue\n\
        \  pair=tuple(sorted([prior,other]))\n  if pair in used_pairs or occupied[prior]>=2 or occupied[other]>=2:continue\n\
        \  for third in strict_non_te:\n   if occupied[third]>=2 or len({prior,other,third})<3:continue\n   names=[prior,other,third]\n\
        \   r=ratio(names)\n   if r<=1.30+1e-9:\n    changed_third.append({'players':names,'ratio':round(r,6),'preserved_original_te':prior,'changes_two_members':True})\n\
        changed_third.sort(key=lambda x:(x['ratio'],x['players']))\n# B: Keep the original third, but replace BOTH TEs (changes\
        \ meaning of slot).\nchanged_pair=[]\nfor i,t1 in enumerate(strict_te):\n for t2 in strict_te[i+1:]:\n  if t1 in original[:2]\
        \ or t2 in original[:2]:continue\n  names=[t1,t2,'nakobe dean']\n  if any(occupied[k]>=2 for k in names):continue\n\
        \  if tuple(sorted(names[:2])) in used_pairs:continue\n  r=ratio(names)\n  if r<=1.30+1e-9:\n   changed_pair.append({'players':names,'ratio':round(r,6),'replaces_both_TEs':True})\n\
        changed_pair.sort(key=lambda x:(x['ratio'],x['players']))\n\n# Separate unresolved 5/21 identity classification, no\
        \ normalizing providers into model.\nids={x['player']:x for x in v11['identity_evidence']}\npriority={'will anderson','byron\
        \ young','micah parsons','malik willis'}\nassert priority.issubset(ids)\nidentity_review=[]\nfor k,x in sorted(ids.items()):\n\
        \ hits=byname.get(norm(k),[])\n model_row=model.get(k,{})\n curr_strict=strict(k)\n flag_categories=[]\n if not hits:flag_categories.append('NO_EXACT_CROSSWALK_NAME')\n\
        \ elif len(hits)>1:flag_categories.append('AMBIGUOUS_CROSSWALK_NAMES')\n else:\n  h=hits[0]\n  if not h.get('sleeper_id'):flag_categories.append('MISSING_STABLE_SLEEPER_ID')\n\
        \  if h.get('fp_position')!=x['model_position'] or h.get('sleeper_pos')!=x['model_position']:\n   flag_categories.append('POSITION_TAXONOMY_CONFLICT')\n\
        \  if team(h.get('fp_team'))!=team(x['model_team']) or team(h.get('sleeper_team'))!=team(x['model_team']):\n   flag_categories.append('TEAM_OR_TEAM_CODE_CONFLICT')\n\
        \ if not flag_categories and not x['fully_source_cleared']:\n  flag_categories.append('SOURCE_METHOD_OR_OWNER_HOLD')\n\
        \ identity_review.append({'player':k,'model_pos':x['model_position'],'model_team':x['model_team'],\n  'v11_resolution_class':x['name_resolution_class'],'strict_screen_current':curr_strict\
        \ if not FIXTURE else None,\n  'source_conflict_types':flag_categories if not FIXTURE else ['SYNTHETIC_NOT_SOURCE_VERIFIED'],\n\
        \  'protected_priority':k in priority,'owner_identity_decision_required':True,'automatically_cleared':False})\nheld=[]\n\
        for slot in (5,11,21):\n row=v10['slots'][slot-1]\n assert row['slot']==slot and row['candidate_player_keys'] is None\n\
        \ names=row['original_player_keys']\n held.append({'slot':slot,'original_players':names,'original_hold_reasons':row['original_hold_reasons'],\n\
        \  'original_fv_ratio':round(ratio(names),6),'original_pair_already_in_25':tuple(sorted(names[:2])) in used_pairs,\n\
        \  'original_appearance_cap_would_hold':all(occupied[k]<2 for k in names),\n  'source_held_original_players':[k for\
        \ k in names if k in ids and not ids[k]['fully_source_cleared']],\n  'ballot_issuance_authorized':False})\n\nreport={'status':'RESEARCH_ONLY_CONSTRAINT_ATTRIBUTION_NO_APPROVAL','source_sha256':{k:v[1]\
        \ for k,v in PINS.items()},\n 'conditional_existing_slots':25,'conditionally_uncleared_priority_slots':[1,8,12,15],\n\
        \ 'unresolved_slots':[5,11,21], 'no_model_market_changes':True,'owner_approval':False,'voting_activated':False,\n\
        \ 'strict_source_TE_count':len(strict_te),'strict_non_TE_count':len(strict_non_te),\n 'original_slot11_zero_options_reproduced':len(fixed)==0,\n\
        \ 'fixed_third_failure_overlap_counts':dict(sorted(fail_counts.items())),\n 'one_TE_retained_and_third_changed_count':len(changed_third),\n\
        \ 'both_TEs_changed_and_third_retained_count':len(changed_pair),\n 'individual_options_not_jointly_proven':True,'no_new_release_thresholds':True}\n\
        (OUTPUT/'RESEARCH_ONLY_v13_constraint_diagnostics.json').write_text(json.dumps({'summary':report,'held_slots':held,\n\
        \ 'slot11_fixed_third_options':fixed,'one_original_TE_retained_new_third_illustrations':changed_third[:20],\n 'both_original_TEs_changed_illustrations':changed_pair[:20]},sort_keys=True,indent=2)+'\\\
        n')\n(OUTPUT/'RESEARCH_ONLY_v13_identity_owner_matrix.json').write_text(json.dumps({'research_only':True,\n 'owner_identity_decision_required':True,'identities':identity_review,'never_overwrite_model_or_crosswalk':True},sort_keys=True,indent=2)+'\\\
        n')\nlines=['# QF11 V13 — Three-held-slot constraint attribution and identity decision brief','',\n '**RESEARCH ONLY.\
        \ No owner authorization, voter links, ballots or valuation changes.**','',\n '## Findings',\n '- V12 conditional\
        \ slate: **25/28** mechanically consistent, but FOUR priority-player slots retain unresolved source holds.',\n '-\
        \ Original held slots: **05, 11, 21**; none issued.',\n f\"- Strict crosswalk screen: {len(strict_te)} TEs; fixed\
        \ Nakobe Dean design valid alternatives: **{len(fixed)}**.\",\n f\"- Design-changing options with one original TE\
        \ retained AND changed third: **{len(changed_third)}** (individual only, not globally assigned).\",\n f\"- Design-changing\
        \ options replacing BOTH TEs with Nakobe retained: **{len(changed_pair)}** (individual only, not globally assigned).\"\
        ,\n '- The two relaxed designs change the research question. Neither may be silently substituted.',\n '- No source\
        \ conflict was auto-corrected; teams, roles and stable IDs remain frozen.','',\n '## Why strict slot 11 rescue failed\
        \ (reasons overlap)',\n '| Exclusion | Candidate occurrences |','|---|---:|']\nfor k,n in sorted(fail_counts.items()):lines.append('|\
        \ '+k+' | '+str(n)+' |')\nlines+=['','## Original unresolved slots','| Slot | Original ballot | Source holds |','|---:|---|---|']\n\
        for r in held:lines.append('| '+str(r['slot'])+' | '+' / '.join(r['original_players'])+' | '+('; '.join(r['original_hold_reasons'])\
        \ or 'Repeat')+' |')\nlines+=['','## Identity owner adjudication','| Player | Model role/team | Unresolved category\
        \ |','|---|---|---|']\nfor r in identity_review:lines.append('| '+r['player']+' | '+r['model_pos']+' / '+r['model_team']+'\
        \ | '+', '.join(r['source_conflict_types'])+' |')\nlines+=['','## Owner decision boundaries',\n '1. Confirm stable\
        \ player ID/name and league-specific positional taxonomy before any held original player is voted.',\n '2. Decide\
        \ explicitly whether slot 11 should retain one TE with a different third, replace both TEs, or remain omitted.',\n\
        \ '3. Do not treat an individually feasible replacement as a jointly consistent voter slate. Recheck all 28 slots\
        \ globally after decisions.',\n '4. No ballot activation, voter allocation, Market Value source backfill or release\
        \ approval from this workflow.',\n '5. Original audit 13/20 remains unchanged.']\n(OUTPUT/'RESEARCH_ONLY_v13_owner_review.md').write_text('\\\
        n'.join(lines)+'\\n')\nassert all(p.stat().st_size>100 for p in OUTPUT.iterdir())\nprint('QF11_V13_THREE_HOLD_ATTRIBUTION_GREEN\
        \ '+json.dumps({k:report[k] for k in (\n 'conditional_existing_slots','strict_source_TE_count','original_slot11_zero_options_reproduced',\n\
        \ 'one_TE_retained_and_third_changed_count','both_TEs_changed_and_third_retained_count','voting_activated')},sort_keys=True))\n\
        QF11_V13_PY\npython3 /tmp/qf11-v13-audit.py\n"
    - name: Run all 14 frozen valuation regression groups and FA PA release selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V13_FROZEN_14_REGRESSIONS_GREEN'
    - name: Prove zero repo writes, exact protected blobs, and unresolved owner gate
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_REPO_WRITES; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        python3 - <<''QF11_V13_FINISH''

        from pathlib import Path

        import json

        p=Path(''/tmp/qf11-v13-output'')

        expected={''RESEARCH_ONLY_v13_constraint_diagnostics.json'',''RESEARCH_ONLY_v13_identity_owner_matrix.json'',''RESEARCH_ONLY_v13_owner_review.md''}

        assert {x.name for x in p.iterdir()}==expected

        j=json.loads((p/''RESEARCH_ONLY_v13_constraint_diagnostics.json'').read_text())

        s=j[''summary'']

        assert s[''status'']==''RESEARCH_ONLY_CONSTRAINT_ATTRIBUTION_NO_APPROVAL''

        assert s[''conditional_existing_slots'']==25 and s[''unresolved_slots'']==[5,11,21]

        assert s[''strict_source_TE_count'']==33 and s[''original_slot11_zero_options_reproduced''] is True

        assert s[''owner_approval''] is False and s[''voting_activated''] is False

        assert s[''no_model_market_changes''] is True

        print(''QF11_V13_ZERO_WRITE_NO_OWNER_APPROVAL_GREEN'')

        QF11_V13_FINISH

        '
    - name: Archive frozen-source three-hold forensic outputs, 7 days
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v13-RESEARCH-ONLY-three-hold-constraint-attribution
        path: /tmp/qf11-v13-output/
        retention-days: 7
        if-no-files-found: error
