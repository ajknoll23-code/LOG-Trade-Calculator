name: B47 Free Agent Utility V1 - Weekly 4for4 Source Refresh Repair V4r1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  repair-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Preflight exact repair base
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object scripts/projections/build_free_agent_utility_v1.py)" = \
            "09d047e295b9b64cfd9ca12dcd8166c312317e29"

          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = \
            "1bb87f685c00e51a488a0c21510ccdca452e6b72"

          test "$(git hash-object research/free-agent-utility-v1/phase2_preregistration.json)" = \
            "5225d82aae5607c5755a5c7ea281c5ac05ecaf6e"

          python3 - <<'PY'
          import importlib.util
          import sys

          path = "research/free-agent-utility-v1/free_agent_utility_v1_phase1.py"
          spec = importlib.util.spec_from_file_location(
              "fa_utility_v1_phase1_interface_check", path
          )
          if spec is None or spec.loader is None:
              raise RuntimeError("unable to load frozen Phase 1 interface")
          p1 = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = p1
          spec.loader.exec_module(p1)

          assert set(p1.EXPECTED_SHA256) == {
              "offense", "DL", "LB", "DB"
          }, sorted(p1.EXPECTED_SHA256)
          assert set(p1.EXPECTED_ROW_COUNTS) == {
              "offense", "DL", "LB", "DB"
          }, sorted(p1.EXPECTED_ROW_COUNTS)
          assert set(p1.EXPECTED_OFFENSE_BY_POS) == {
              "QB", "RB", "WR", "TE"
          }, sorted(p1.EXPECTED_OFFENSE_BY_POS)

          for name in (
              "read_offense",
              "read_idp",
              "finite",
              "index_provider",
              "norm_name",
              "norm_team",
              "midrank_percentiles",
              "ranks_desc",
              "current_board_rows",
          ):
              assert callable(getattr(p1, name, None)), name

          print("PASS: frozen Phase 1 interface matches refresh-adapter assumptions.")
          PY

          git diff --exit-code
          echo "PASS: exact repair base, frozen research lineage, and Phase 1 interface verified."

      - name: Decode and verify current private 4for4 bundle
        shell: bash
        env:
          FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}
          FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
          FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
          FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}
        run: |
          set -euo pipefail

          for var in \
            FOURFORFOUR_OFFENSE_GZ_B64_PART1 \
            FOURFORFOUR_OFFENSE_GZ_B64_PART2 \
            FOURFORFOUR_OFFENSE_GZ_B64_PART3 \
            FOURFORFOUR_DL_GZ_B64 \
            FOURFORFOUR_LB_GZ_B64 \
            FOURFORFOUR_DB_GZ_B64
          do
            test -n "${!var:-}" || {
              echo "ERROR: required GitHub Actions secret $var is missing or empty." >&2
              exit 1
            }
          done

          install -d -m 700 /tmp/log-fa-utility-v1/input

          printf '%s%s%s' \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/offense.csv

          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/db.csv

          chmod 600 /tmp/log-fa-utility-v1/input/*.csv

          test "$(sha256sum /tmp/log-fa-utility-v1/input/offense.csv | awk '{print $1}')" = \
            "b707ce5c84d8cadfeb21694228afee6cdbffb17f95fc94c9385dfec8780a39ea"
          test "$(sha256sum /tmp/log-fa-utility-v1/input/dl.csv | awk '{print $1}')" = \
            "a8ae4a3dc3ed7e24e102e9416467826dd93441cc6b18c0589ed8345aeca977f6"
          test "$(sha256sum /tmp/log-fa-utility-v1/input/lb.csv | awk '{print $1}')" = \
            "957e3c03b604302d259393d3cd3c637d03ff15b6a51812bb23cc0d10830a8321"
          test "$(sha256sum /tmp/log-fa-utility-v1/input/db.csv | awk '{print $1}')" = \
            "7bc8fb440f171bc65ab82e4c2cf1ed88e4b53a6f64868461ac8a96cb08d9b079"

          echo "PASS: exact 2026-10-07 private 4for4 bundle verified."

      - name: Patch production builder with frozen-reader refresh adapter
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/projections/build_free_agent_utility_v1.py")
          s = p.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(
                      f"ERROR: {label}: expected exactly one anchor, found {count}"
                  )
              s = s.replace(old, new, 1)

          replace_once(
              "import argparse\nfrom collections import defaultdict\n",
              "import argparse\nimport csv\nimport hashlib\nfrom collections import Counter, defaultdict\n",
              "imports",
          )

          replace_once(
              'SHIFT_CAP = 0.04\nPOLICY_ID = "phase3-selected-15pct-cap040"\n',
              'SHIFT_CAP = 0.04\n'
              'PHASE2_QUALIFICATION_COVERAGE_REFERENCE = 0.50\n'
              'MIN_PROVIDER_ROW_FRACTION = 0.50\n'
              'POLICY_ID = "phase3-selected-15pct-cap040"\n',
              "refresh safety constants",
          )

          anchor = '''def clamp(x, lo, hi):
              return max(lo, min(hi, x))
          '''

          insertion = '''def file_sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def _csv_rows(path: Path) -> list[dict]:
              with path.open(newline="", encoding="utf-8-sig") as fh:
                  return list(csv.DictReader(fh))


          def _validate_points(label: str, points: list[float]):
              if not points:
                  raise RuntimeError(f"{label}: no finite FF Pts values")
              if not any(abs(x) > 1e-12 for x in points):
                  raise RuntimeError(f"{label}: all FF Pts values are zero")
              if len({round(x, 9) for x in points}) < 2:
                  raise RuntimeError(f"{label}: FF Pts values are constant")


          def read_current_provider(phase1, offense: Path, dl: Path, lb: Path, db: Path):
              # Production refresh adapter around the frozen Phase 1 readers.
              # The frozen research file is never modified. For the current
              # private source bundle only, expected SHA/count metadata are
              # overridden in memory so exact frozen parsing/normalization
              # semantics are reused for weekly refreshes.
              paths = {"offense": offense, "DL": dl, "LB": lb, "DB": db}

              original_sha = dict(phase1.EXPECTED_SHA256)
              original_rows = dict(phase1.EXPECTED_ROW_COUNTS)
              original_offense_by_pos = dict(phase1.EXPECTED_OFFENSE_BY_POS)

              offense_rows = _csv_rows(offense)
              if not offense_rows:
                  raise RuntimeError("offense: provider export is empty")
              required_offense = {"PID", "Player", "Pos", "Team", "FF Pts"}
              missing = required_offense - set(offense_rows[0])
              if missing:
                  raise RuntimeError(
                      f"offense: missing required columns: {sorted(missing)}"
                  )

              offense_counts = Counter()
              offense_points = {pos: [] for pos in ("QB", "RB", "WR", "TE")}
              for row in offense_rows:
                  pos = str(row.get("Pos") or "").strip().upper()
                  if pos not in offense_points:
                      continue
                  pts = phase1.finite(row.get("FF Pts"))
                  if pts is None:
                      raise RuntimeError(
                          f"offense/{pos}: non-finite FF Pts in tracked row"
                      )
                  offense_counts[pos] += 1
                  offense_points[pos].append(float(pts))

              for pos, historical_n in original_offense_by_pos.items():
                  floor = max(
                      1,
                      int(int(historical_n) * MIN_PROVIDER_ROW_FRACTION + 0.999999),
                  )
                  if offense_counts[pos] < floor:
                      raise RuntimeError(
                          f"offense/{pos}: provider row count below 50% historical "
                          f"floor: {offense_counts[pos]} < {floor}"
                      )
                  _validate_points(f"offense/{pos}", offense_points[pos])

              idp_rows = {}
              for bucket, path in (("DL", dl), ("LB", lb), ("DB", db)):
                  rows = _csv_rows(path)
                  idp_rows[bucket] = rows
                  if not rows:
                      raise RuntimeError(f"{bucket}: provider export is empty")
                  required = {"Player", "Team", "FF Pts"}
                  missing = required - set(rows[0])
                  if missing:
                      raise RuntimeError(
                          f"{bucket}: missing required columns: {sorted(missing)}"
                      )
                  floor = max(
                      1,
                      int(
                          int(original_rows[bucket])
                          * MIN_PROVIDER_ROW_FRACTION
                          + 0.999999
                      ),
                  )
                  if len(rows) < floor:
                      raise RuntimeError(
                          f"{bucket}: provider row count below 50% historical "
                          f"floor: {len(rows)} < {floor}"
                      )
                  points = []
                  for row in rows:
                      pts = phase1.finite(row.get("FF Pts"))
                      if pts is None:
                          raise RuntimeError(
                              f"{bucket}: non-finite FF Pts in provider row"
                          )
                      points.append(float(pts))
                  _validate_points(bucket, points)

              current_sha = {
                  label: file_sha256(path)
                  for label, path in paths.items()
              }
              current_rows = {
                  "offense": len(offense_rows),
                  "DL": len(idp_rows["DL"]),
                  "LB": len(idp_rows["LB"]),
                  "DB": len(idp_rows["DB"]),
              }
              current_offense_by_pos = {
                  pos: offense_counts[pos]
                  for pos in ("QB", "RB", "WR", "TE")
              }

              try:
                  phase1.EXPECTED_SHA256.clear()
                  phase1.EXPECTED_SHA256.update(current_sha)
                  phase1.EXPECTED_ROW_COUNTS.clear()
                  phase1.EXPECTED_ROW_COUNTS.update(current_rows)
                  phase1.EXPECTED_OFFENSE_BY_POS.clear()
                  phase1.EXPECTED_OFFENSE_BY_POS.update(current_offense_by_pos)

                  provider = (
                      phase1.read_offense(offense)
                      + phase1.read_idp(dl, "DL")
                      + phase1.read_idp(lb, "LB")
                      + phase1.read_idp(db, "DB")
                  )
              finally:
                  phase1.EXPECTED_SHA256.clear()
                  phase1.EXPECTED_SHA256.update(original_sha)
                  phase1.EXPECTED_ROW_COUNTS.clear()
                  phase1.EXPECTED_ROW_COUNTS.update(original_rows)
                  phase1.EXPECTED_OFFENSE_BY_POS.clear()
                  phase1.EXPECTED_OFFENSE_BY_POS.update(original_offense_by_pos)

              provider_counts = Counter(r["pos"] for r in provider)
              expected_counts = dict(current_offense_by_pos)
              expected_counts.update({
                  "DL": current_rows["DL"],
                  "LB": current_rows["LB"],
                  "DB": current_rows["DB"],
              })
              if dict(provider_counts) != expected_counts:
                  raise RuntimeError(
                      "production refresh adapter output-count mismatch: "
                      f"expected={expected_counts} actual={dict(provider_counts)}"
                  )

              print(
                  "PASS: current provider bundle reused exact frozen Phase 1 "
                  "reader semantics; source SHA/count metadata were rebound "
                  "in memory only."
              )
              print(
                  "Provider counts: "
                  + ", ".join(
                      f"{pos}={provider_counts[pos]}"
                      for pos in ("QB", "RB", "WR", "TE", "DL", "LB", "DB")
                  )
              )
              return provider, current_sha


          def clamp(x, lo, hi):
              return max(lo, min(hi, x))
          '''

          replace_once(anchor, insertion, "production refresh adapter")

          replace_once(
              '''    provider = (
                  phase1.read_offense(offense)
                  + phase1.read_idp(dl, "DL")
                  + phase1.read_idp(lb, "LB")
                  + phase1.read_idp(db, "DB")
              )
              provider_idx = phase1.index_provider(provider)
          ''',
              '''    provider, current_private_sha = read_current_provider(
                  phase1, offense, dl, lb, db
              )
              provider_idx = phase1.index_provider(provider)
          ''',
              "provider ingestion call",
          )

          replace_once(
              '''    for pos in TRACKED:
                  cohort = by_pos[pos]
                  current_values = {r["sleeper_id"]: float(r["value"]) for r in cohort}
          ''',
              '''    for pos in TRACKED:
                  cohort = by_pos[pos]
                  if not cohort:
                      raise RuntimeError(
                          f"{pos}: current data-backed free-agent cohort is empty"
                      )
                  current_values = {r["sleeper_id"]: float(r["value"]) for r in cohort}
          ''',
              "empty cohort fail-closed guard",
          )

          replace_once(
              '''            elif len(cands) > 1:
                          raise RuntimeError(
                              f"ambiguous private-provider identity: {r['name']} {pos} {r['team']}"
                          )

                  matched_values = {r["sleeper_id"]: float(r["value"]) for r in matched}
          ''',
              '''            elif len(cands) > 1:
                          raise RuntimeError(
                              f"ambiguous private-provider identity: {r['name']} {pos} {r['team']}"
                          )

                  # Governance correction after B47 V3:
                  # Phase 2's >=50% match coverage was a research qualification
                  # gate, not a recurring Phase 4 production requirement.
                  # Weekly refreshes therefore report coverage diagnostically;
                  # unmatched players retain the frozen exact-LOG fallback.
                  #
                  # V3 first exposed this at RB 17/36 (47.2%). Removing that
                  # repair-added stop restores the frozen production contract.
                  # No frozen threshold, weight, cap, identity rule, fallback
                  # rule, or section policy is changed.
                  coverage = len(matched) / len(cohort)
                  print(
                      f"INFO {pos} provider match coverage: "
                      f"{len(matched)}/{len(cohort)} ({coverage:.1%})"
                  )
                  if coverage < PHASE2_QUALIFICATION_COVERAGE_REFERENCE:
                      print(
                          f"WARN {pos} coverage {coverage:.1%} < "
                          f"{PHASE2_QUALIFICATION_COVERAGE_REFERENCE:.0%} "
                          "Phase-2 qualification level; unmatched players use "
                          "frozen exact-LOG fallback."
                      )

                  matched_values = {r["sleeper_id"]: float(r["value"]) for r in matched}
          ''',
              "Phase 2 coverage diagnostic",
          )

          replace_once(
              '''        deltas = {
                  sid: matched_f4_pct[sid] - matched_log_pct[sid]
                  for sid in matched_log_pct
              }
              if deltas and abs(statistics.fmean(deltas.values())) > 1e-12:
                  raise RuntimeError(f"{pos}: matched-cohort delta lost mean-zero property")
          ''',
              '''        deltas = {
                  sid: matched_f4_pct[sid] - matched_log_pct[sid]
                  for sid in matched_log_pct
              }
              if len(matched) == 0 and deltas:
                  raise RuntimeError(f"{pos}: zero matches unexpectedly produced deltas")
              if len(matched) == 1 and any(
                  abs(float(v)) > 1e-12 for v in deltas.values()
              ):
                  raise RuntimeError(
                      f"{pos}: one-match cohort must produce zero transport delta"
                  )
              if len(matched) < 2:
                  print(
                      f"INFO {pos}: {len(matched)} exact matches; frozen "
                      "matched-subset math yields no 4for4 transport."
                  )
              if deltas and abs(statistics.fmean(deltas.values())) > 1e-12:
                  raise RuntimeError(f"{pos}: matched-cohort delta lost mean-zero property")
          ''',
              "small-match transport invariant",
          )

          replace_once(
              '''    # Run the byte-for-byte Phase 4 proof only when the public free-agent
              # source is the exact historical Phase 4 source. The private 4for4 inputs
              # are independently SHA-pinned by the frozen Phase 1 reader.
              current_free_agents_blob = git_blob_sha(FREE_AGENTS)
              if current_free_agents_blob == EXPECTED_PHASE4_FREE_AGENTS_BLOB:
          ''',
              '''    # Run the byte-for-byte Phase 4 proof only when BOTH the public
              # free-agent source and private provider bundle are the exact historical
              # Phase 4 sources. Current weekly provider refreshes intentionally use
              # the frozen parser with source metadata rebound in memory.
              current_free_agents_blob = git_blob_sha(FREE_AGENTS)
              historical_private_sha = dict(phase1.EXPECTED_SHA256)
              if (
                  current_free_agents_blob == EXPECTED_PHASE4_FREE_AGENTS_BLOB
                  and current_private_sha == historical_private_sha
              ):
          ''',
              "historical reproduction scope",
          )

          replace_once(
              '''    assert clamp(-0.1, -SHIFT_CAP, SHIFT_CAP) == -SHIFT_CAP

              # Historical reproduction must be bound to the exact source snapshot,
          ''',
              '''    assert clamp(-0.1, -SHIFT_CAP, SHIFT_CAP) == -SHIFT_CAP
              assert PHASE2_QUALIFICATION_COVERAGE_REFERENCE == 0.50
              assert MIN_PROVIDER_ROW_FRACTION == 0.50

              # Historical reproduction must be bound to the exact source snapshot,
          ''',
              "self-test refresh guards",
          )

          p.write_text(s, encoding="utf-8")
          PY

          python3 -m py_compile scripts/projections/build_free_agent_utility_v1.py
          python3 scripts/projections/build_free_agent_utility_v1.py --selftest

          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = \
            "1bb87f685c00e51a488a0c21510ccdca452e6b72"

          echo "New production builder blob:"
          git hash-object scripts/projections/build_free_agent_utility_v1.py
          echo "PASS: builder patched; frozen Phase 1 file remains byte-identical."

      - name: Build current utility from refreshed 4for4 bundle
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/projections/build_free_agent_utility_v1.py \
            --offense /tmp/log-fa-utility-v1/input/offense.csv \
            --dl /tmp/log-fa-utility-v1/input/dl.csv \
            --lb /tmp/log-fa-utility-v1/input/lb.csv \
            --db /tmp/log-fa-utility-v1/input/db.csv \
            --write-artifact

          python3 scripts/projections/build_free_agent_utility_v1.py --check
          python3 scripts/validation/validate_free_agent_utility_v1.py
          python3 scripts/validation/repo_regression_checks.py

          echo "PASS: current 4for4 bundle builds and full regression is green."

      - name: Prove frozen science and privacy remain unchanged
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = \
            "1bb87f685c00e51a488a0c21510ccdca452e6b72"

          test "$(git hash-object research/free-agent-utility-v1/phase2_preregistration.json)" = \
            "5225d82aae5607c5755a5c7ea281c5ac05ecaf6e"

          git diff --exit-code -- \
            research/free-agent-utility-v1/free_agent_utility_v1_phase1.py \
            research/free-agent-utility-v1/phase1_preregistration.json \
            research/free-agent-utility-v1/phase2_preregistration.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          builder = Path(
              "scripts/projections/build_free_agent_utility_v1.py"
          ).read_text(encoding="utf-8")

          required_frozen_policy = [
              'TRANSPORT_STRENGTH = 0.15',
              'SHIFT_CAP = 0.04',
              'PHASE2_QUALIFICATION_COVERAGE_REFERENCE = 0.50',
              'POLICY_ID = "phase3-selected-15pct-cap040"',
              'candidate_scores[sid] = base',
              'raw_shift = TRANSPORT_STRENGTH * deltas[sid]',
              'shift = clamp(raw_shift, -SHIFT_CAP, SHIFT_CAP)',
              '"all_section_policy": "existing_log_value_order_unchanged"',
              '"position_section_policy": "priority_rank_ascending"',
          ]
          for marker in required_frozen_policy:
              assert marker in builder, marker

          assert "current provider match coverage below frozen Phase 2 minimum" not in builder
          assert "WARN {pos} coverage" in builder
          assert "unmatched players use " in builder
          assert "frozen exact-LOG fallback." in builder

          d = json.loads(
              Path("data/free_agent_utility_v1.json").read_text(encoding="utf-8")
          )
          assert d["policy_id"] == "phase3-selected-15pct-cap040"
          assert d["all_section_policy"] == "existing_log_value_order_unchanged"
          assert d["position_section_policy"] == "priority_rank_ascending"
          assert d["players"]

          for row in d["players"]:
              assert set(row) == {"player_id", "pos", "priority_rank"}

          print(
              "PASS: frozen model policy unchanged; output remains rank-only "
              "with no raw provider rows, projections, percentiles or deltas."
          )
          PY

      - name: Commit builder repair and refreshed artifact only
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain -- .github/workflows)"
          git diff --check

          git config user.name "free-agent-utility-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            scripts/projections/build_free_agent_utility_v1.py \
            data/free_agent_utility_v1.json

          staged="$(git diff --cached --name-only)"
          echo "$staged"
          test -n "$staged"

          if echo "$staged" | grep -q '^\.github/workflows/'; then
            echo "ERROR: workflow-file mutation is forbidden in B47 V4." >&2
            exit 1
          fi

          git pull --rebase --autostash origin main

          git add \
            scripts/projections/build_free_agent_utility_v1.py \
            data/free_agent_utility_v1.json

          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"

          git commit \
            -m "Repair weekly 4for4 Free Agent Utility source refresh" \
            -m "Governance correction: the B47 recurring 50% coverage stop was not part of the Phase 4 production freeze. It was removed after the first B47 V3 run stopped at RB 17/36 (47.2%), restoring frozen production semantics: exact-match 4for4 transport and exact LOG fallback for unmatched players. No frozen threshold, weight, cap, identity rule, fallback rule, or section policy changed."
          git push origin HEAD:main

          echo "PASS: builder + refreshed artifact committed."
          echo "Committed production builder blob:"
          git hash-object scripts/projections/build_free_agent_utility_v1.py
          echo "NEXT: manually update the recurring Free Agent Utility V1 - Refresh workflow pin."

      - name: Destroy private inputs
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/log-fa-utility-v1
