# QF10 V2 — outcome-blind shadow impact quantification across three open P2 policy findings.
# NO model changes, calibrated alternatives, market recomputation, or production writes.
# QF9 production+Pages green: runs 38177812395 and 38177862776; 13/20 original tickets closed.
name: QF10 V2 - Three Finding Impact Matrix and Policy Boundary Study (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false

jobs:
  triage:
    name: Shadow impact matrices on deployed A1, A3 and A6 boundaries; no writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout dispatched main without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repo validation HTTP dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
      - name: Verify production QF9 and scientific boundary hashes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'STOP non-main dispatch'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP moved dispatch checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git merge-base --is-ancestor d8a2be0bf1edb8d19e94e2edc5157062f95096f3 HEAD || { echo 'STOP QF9 production ancestry missing'; exit 1; }
          pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP inspected source drift $1"; exit 1; }; }
          pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
          pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
          pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2
          pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
          pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
          pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
          echo 'PASS QF10 exact QF9 production source and protected artifact lineage verified'
      - name: Quantify youth factor deltas, six-by-four V6 shape routing and dated center mismatch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qf10-v2-impact.js <<'QF10_JS'
          'use strict';
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          const market = JSON.parse(fs.readFileSync('scripts/artifacts/generated/market_values.json','utf8'));
          const uncertainty = JSON.parse(fs.readFileSync('scripts/artifacts/generated/value_uncertainty.json','utf8'));
          function uniqueAnchor(token){
            const i=html.indexOf(token);
            assert(i>=0,`STOP missing exact code anchor ${token}`);
            assert.equal(html.indexOf(token,i+token.length),-1,`STOP duplicated code anchor ${token}`);
            return i;
          }
          function section(start,end){
            const i=uniqueAnchor(start),j=html.indexOf(end,i+start.length);
            assert(j>i,`STOP end anchor not found for ${start}`);
            return html.slice(i,j);
          }
          function objectDeclaration(name,closing){
            const token=`const ${name} =`,i=uniqueAnchor(token);
            const j=html.indexOf(closing,i+token.length);
            assert(j>i && j-i<200000,`STOP ${name} closing marker invalid`);
            return html.slice(i,j+closing.length);
          }
          const box=vm.createContext({state:{A:[],B:[]},console});
          function load(src,label){vm.runInContext(src,box,{timeout:10000,filename:label});}
          function evaluate(src){return vm.runInContext(src,box,{timeout:10000});}
          load(objectDeclaration('PLAYER_DB','\n};'),'PLAYER_DB');
          load(objectDeclaration('PROD_MULT_DATA','\n};'),'PROD_MULT_DATA');
          load(objectDeclaration('NO_REAL_PRODUCTION_HISTORY','\n};'),'NO_REAL_PRODUCTION_HISTORY');
          load(objectDeclaration('ROLE_MULT',';'),'ROLE_MULT');
          load(objectDeclaration('AGE_CURVE','\n};'),'AGE_CURVE');
          load(section('function ageMultiplier(pos, age, role, realProduction, rawProduction){','/* RB_CONTINUOUS_AGE_V1'),'ageMultiplier');
          const db=evaluate('PLAYER_DB'), data=evaluate('PROD_MULT_DATA');
          const noHist=evaluate('NO_REAL_PRODUCTION_HISTORY'), roleMult=evaluate('ROLE_MULT'), curves=evaluate('AGE_CURVE');
          const pv=section('function playerValue(pos, age, role, name){','/* QF2_AGE_DISPLAY_ONLY');
          const prodFn=section('function productionMultiplier(name, role){','function injuryMultiplier(');
          assert(pv.includes('effectiveAgeMultiplier(pos, age, role, name, rm, rawRm)'), 'STOP live FV age input changed');
          assert(pv.includes('const rawRm = PROD_MULT.hasOwnProperty(normKey) ? PROD_MULT[normKey] : null;'), 'STOP raw-age lineage changed');
          assert(prodFn.includes('return roleEstimate;'), 'STOP missing-production role estimate changed');
          // A1: compare ACTUAL ageMultiplier implementation at the integer-age branch.
          // These are NOT deployed prices, do not change productionMultiplier, and do not
          // extrapolate to RB continuous DOB or validate a new valuation policy.
          const missing=[]; const ageCases=[];
          for(const [name,p] of Object.entries(db)){
            if(!p || Object.hasOwn(data,name))continue;
            missing.push(name);
            const c=curves[p.pos],age=Number(p.age),role=String(p.role||'');
            if(!c || !Number.isFinite(age) || age<18 || age>c.peakEnd || p.pos==='K')continue;
            const roleEstimate=Number(roleMult[role]??1);
            const current=evaluate(`ageMultiplier(${JSON.stringify(p.pos)},${age},${JSON.stringify(role)},${roleEstimate},null)`);
            const missingBranch=evaluate(`ageMultiplier(${JSON.stringify(p.pos)},${age},${JSON.stringify(role)},null,null)`);
            assert(Number.isFinite(current)&&Number.isFinite(missingBranch),'STOP bad A1 branch results');
            const delta=current-missingBranch;
            ageCases.push({name,pos:p.pos,role,age,current:Number(current.toFixed(6)),missingBranch:Number(missingBranch.toFixed(6)),delta:Number(delta.toFixed(6)),registeredNo2025History:!!noHist[name]});
          }
          assert(Object.keys(db).length>=500,'STOP canonical player source unexpectedly small');
          assert(ageCases.length>0,'STOP no youth-age cases to evaluate');
          const a1Affected=ageCases.filter(x=>Math.abs(x.delta)>1e-8);
          const byPosition={};for(const x of ageCases){const a=byPosition[x.pos]||(byPosition[x.pos]={total:0,affected:0});a.total++;if(Math.abs(x.delta)>1e-8)a.affected++;}
          const a1Top=[...a1Affected].sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,8);
          console.log('QF10_V2_A1_IMPACT '+JSON.stringify({canonical:Object.keys(db).length,missingProductionMultiplier:missing.length,noRealHistoryFlags:Object.keys(noHist).length,integerYouthAgeCases:ageCases.length,integerYouthCasesWithDifferentAgeFactors:a1Affected.length,byPosition,examples:a1Top}));
          // A3: actual frozen V6/V4/unsupported production routing over every published
          // V6 profile x apex level. No policy is mutated: controlled fixtures only.
          load(objectDeclaration('PACKAGE_ADJUSTMENT_PRODUCTION_V1','\n});'),'PA_POLICY');
          load(section('function packageAdjustmentSize2Multiplier(targetFv){','function packageAdjustmentSize2CompositionFactor('),'PA_SIZE2');
          load(section('function packageAdjustmentSize3V6Assessment(values, targetFv){','function packageAdjustmentAssessment(){'),'PA_V6');
          load(section('function packageAdjustmentAssessment(){','function packageAdjustmentForTrade(){'),'PA_ROUTER');
          const cfg=evaluate('PACKAGE_ADJUSTMENT_PRODUCTION_V1');
          assert(cfg.enabled&&cfg.meaningfulPieceMinTargetShare===0.06,'STOP frozen PA shape changed');
          const T=10000,cut=T*cfg.meaningfulPieceMinTargetShare;
          const matrix=[];
          function assess(vals){box.state.A=[{type:'player',pos:'RB',name:'SyntheticTarget',value:T}];box.state.B=vals.map((v,i)=>({type:'player',pos:'WR',name:`SyntheticPiece${i}`,value:v}));return evaluate('packageAdjustmentAssessment()');}
          for(const p of cfg.size3V6Profiles)for(const apex of cfg.size3V6ApexLevels){
            const total=(T*apex)/p.shares[0],vals=p.shares.map(s=>total*s);
            const base=assess(vals),tiny=assess([...vals,cut-1]);
            assert(base.status==='applied'&&base.packageAdjustment.size3Source==='V6',`STOP V6 published profile ${p.label} apex ${apex} not supported`);
            assert(tiny.status==='applied'||tiny.status==='unsupported',`STOP unexpected tiny routing ${tiny.status}`);
            if(tiny.status==='applied')assert.equal(tiny.packageAdjustment.meaningfulCount,3,'STOP tiny was meaningful');
            matrix.push({profile:p.label,apex,status3:base.packageAdjustment.size3Source,status4:tiny.status==='applied'?tiny.packageAdjustment.size3Source:'unsupported',premium3:Math.round(base.packageAdjustment.adjustment),premium4:tiny.status==='applied'?Math.round(tiny.packageAdjustment.adjustment):null,premiumDelta:tiny.status==='applied'?Math.round(tiny.packageAdjustment.adjustment-base.packageAdjustment.adjustment):null});
          }
          assert(matrix.length===24,'STOP V6 profile/apex enumeration changed');
          const routes={};for(const row of matrix)routes[row.status4]=(routes[row.status4]||0)+1;
          console.log('QF10_V2_A3_POLICY_MATRIX '+JSON.stringify({frozenShapeProfiles:cfg.size3V6Profiles.length,frozenApexLevels:cfg.size3V6ApexLevels.length,fixtures:matrix.length,tinyPieceBelowMeaningfulThreshold:cut-1,tinyPieceCutoff:cut,afterAddingTinyRoutes:routes,matrix}));
          // A6: compare two dated, independent ARTIFACT centers. Neither date is
          // the current FV. Runtime fail-closed equality guards are retained.
          assert(market.scale_semantics==='league_rank_quantile_mapped_to_trade_desk_points_v1','STOP market schema changed');
          assert(uncertainty.range_semantics==='sensitivity_envelope_v1_not_probability_interval','STOP uncertainty schema changed');
          const marketFn=section('function marketValueForPlayer(name, fundamentalValue){','function marketValueHTML(');
          const uncertaintyFn=section('function valueUncertaintyForPlayer(name, centerValue){','function valueUncertaintyRangeHTML(');
          assert(marketFn.includes('storedFundamental !== Number(fundamentalValue)'),'STOP market stale-value guard changed');
          assert(uncertaintyFn.includes('artifactCenter !== Number(centerValue)'),'STOP uncertainty stale-value guard changed');
          const byPos={},worst=[];
          for(const [key,m] of Object.entries(market.players||{})){
            const u=uncertainty.players?.[key];if(!u||m.pos!==u.pos)continue;
            const a=Number(m.fundamental_value),b=Number(u.center_value);
            assert(Number.isFinite(a)&&Number.isFinite(b),'STOP nonnumeric paired artifact center');
            const k=m.pos,d=byPos[k]||(byPos[k]={paired:0,different:0,maxAbsDifference:0});d.paired++;
            const gap=Math.abs(a-b);if(gap>0)d.different++;
            d.maxAbsDifference=Math.max(d.maxAbsDifference,gap);
            if(gap>0)worst.push({name:key,pos:k,marketDatedCenter:a,uncertaintyDatedCenter:b,absDifference:gap,pctOfOlderCenter:Math.round(10000*gap/Math.max(1,a))/100});
          }
          worst.sort((a,b)=>b.absDifference-a.absDifference);
          assert(byPos.RB?.paired>=20&&byPos.RB.different>0,'STOP expected RB temporal mismatch not found');
          console.log('QF10_V2_A6_DATED_CENTER_MATRIX '+JSON.stringify({marketGeneratedAt:market.generated_at_utc,uncertaintyGeneratedAt:uncertainty.generated_at_utc,byPosition:byPos,largestDifferences:worst.slice(0,10),warning:'Different dated centers are not measured present-day FV drift. No recalculation or automatic freshness bypass.'}));
          console.log('QF10_V2_READ_ONLY_IMPACT_GREEN: 3 analyses; no FV policy or PA geometry, current values, market artifact or frozen release altered.');
          QF10_JS
          node --check /tmp/qf10-v2-impact.js
          node /tmp/qf10-v2-impact.js
      - name: Preserve frozen valuation and package runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          echo 'PASS existing production regressions, unchanged scientific state'
      - name: Verify exact zero-write read-only outcome
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP changed sources'; exit 1; }
          [[ "$(git hash-object index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
          echo 'QF10_V2_READ_ONLY_GREEN: impact matrices verified; no branch, commit, push, deployment or model updates'
