name: A5 Identity V2 Phase 12 Batch 1 Three-Player Stable-ID Shadow

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase12-batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact post-A4 production baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["scripts/identity_crosswalk.json"]="6f7f8540e451cfeaaa4ad997416fca77e0aa4fd3"
            ["research/identity-v2/identity_v2_phase11_deployment_confirmation.json"]="656aef1635b3e2b63da2c1c3555d2d7188b932b3"
            ["research/identity-v2/identity_v2_phase11_manifest.json"]="31ef254d0f03c07117e201d6961ceb297cf63968"
            ["scripts/projections/resolve_fantasypros_sleeper_identity.py"]="fa4b0fd9b201d79173125f55f7c1eeee916b2506"
          )
          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: A5 baseline drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          a4=json.loads((D/"identity_v2_phase11_deployment_confirmation.json").read_text())
          assert a4["decision"]=="PASS_IDENTITY_V2_PHASE11_TERRELL_JENNINGS_DEPLOYED"
          assert a4["deployed_mapping_count"]==1
          assert a4["changed_fpids"]==["26964"]
          assert a4["manual_review_count_after"]==14
          assert a4["full_repo_regression_passed"] is True
          assert a4["successor_resolver_exact_scope_passed"] is True

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          manual={
              str(r["fantasypros_id"]):r
              for r in rows if r.get("requires_manual_review") is True
          }
          assert len(manual)==14
          expected={
              "18557":("Jake Browning","QB","6111"),
              "20080":("Desmond Ridder","QB","8159"),
              "15697":("Elandon Roberts","LB","3369")
          }
          for fpid,(name,pos,sid) in expected.items():
              r=manual[fpid]
              assert r["name"]==name
              assert r["fp_position"]==pos
              assert str(r["candidate_sleeper_id"])==sid
              assert r["sleeper_id"] is None
              assert r["match_method"]=="unique_name_position_team_unavailable"

          print("PASS: exact 14-row post-A4 manual universe and Batch-1 targets guarded.")
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Freeze A5 three-player preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/identity-v2")
          outputs=[
              D/"identity_v2_phase12_batch1_preregistration.json",
              D/"identity_v2_phase12_batch1_second_source_snapshot.json",
              D/"identity_v2_phase12_batch1_stable_id_shadow.json",
              D/"identity_v2_phase12_batch1_stable_id_shadow.md",
              D/"identity_v2_phase12_batch1_direct_candidate_crosswalk.json",
              D/"identity_v2_phase12_batch1_control_refresh_crosswalk.json",
              D/"identity_v2_phase12_batch1_seeded_refresh_crosswalk.json",
              D/"identity_v2_phase12_batch1_manifest.json"
          ]
          for p in outputs:
              assert not p.exists(),f"refusing to overwrite {p}"

          prereg={
              "schema_version":1,
              "study_id":"identity-v2-phase12-batch1-three-player-stable-id-shadow",
              "status":"FROZEN_BEFORE_SECOND_SOURCE_READ",
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "deployment_authorized":False,
              "batch_targets":{
                  "15697":{
                      "name":"Elandon Roberts","position":"LB","candidate_sleeper_id":"3369"
                  },
                  "18557":{
                      "name":"Jake Browning","position":"QB","candidate_sleeper_id":"6111"
                  },
                  "20080":{
                      "name":"Desmond Ridder","position":"QB","candidate_sleeper_id":"8159"
                  }
              },
              "second_source":{
                  "provider":"DynastyProcess/nflverse ffverse player-ID bridge",
                  "url":"https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv"
              },
              "per_player_pass_rule":[
                  "Exactly one second-source row by frozen FantasyPros ID.",
                  "Exactly one second-source row by frozen candidate Sleeper ID.",
                  "Both lookups resolve to the same row.",
                  "Name matches after normalization.",
                  "Position matches exactly.",
                  "GSIS stable ID is present.",
                  "PFR stable ID is present."
              ],
              "independent_batch_rule":"Each player is classified independently. A failed player remains held and does not block other passing players.",
              "shadow_rule":"Only individually passing players may enter the direct/successor shadow.",
              "pass_to_deployment_rule":"A passing shadow authorizes only a separate A6 exact-scope deployment of the passing subset.",
              "production_change_authorized":False
          }
          (D/"identity_v2_phase12_batch1_preregistration.json").write_text(
              json.dumps(prereg,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A5 batch preregistration frozen.")
          PY

      - name: Fetch second source and classify each player independently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,io,json,re,requests
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          prereg=json.loads((D/"identity_v2_phase12_batch1_preregistration.json").read_text())
          url=prereg["second_source"]["url"]

          resp=requests.get(
              url,
              timeout=30,
              headers={"User-Agent":"LOG-Trade-Calculator-Identity-V2-A5"}
          )
          resp.raise_for_status()
          raw=resp.content
          rows=list(csv.DictReader(io.StringIO(raw.decode("utf-8"))))
          assert rows

          required={
              "fantasypros_id","sleeper_id","gsis_id","pfr_id",
              "espn_id","name","position","db_season"
          }
          assert required<=set(rows[0]),sorted(required-set(rows[0]))

          def clean(v):
              v=(v or "").strip()
              return None if v in ("","NA","N/A","null","None") else v

          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",str(s or "").lower()).strip()

          results={}
          snapshots={}
          for fpid,spec in prereg["batch_targets"].items():
              sid=spec["candidate_sleeper_id"]
              fp_rows=[r for r in rows if clean(r.get("fantasypros_id"))==fpid]
              sid_rows=[r for r in rows if clean(r.get("sleeper_id"))==sid]

              same_row=(
                  len(fp_rows)==1 and len(sid_rows)==1
                  and fp_rows[0]==sid_rows[0]
              )
              r=fp_rows[0] if len(fp_rows)==1 else None

              gates={
                  "exact_one_by_fpid":len(fp_rows)==1,
                  "exact_one_by_sid":len(sid_rows)==1,
                  "same_row":same_row,
                  "name_match":bool(
                      r and norm(clean(r.get("name")))==norm(spec["name"])
                  ),
                  "position_match":bool(
                      r and clean(r.get("position"))==spec["position"]
                  ),
                  "gsis_present":bool(
                      r and clean(r.get("gsis_id"))
                      and clean(r.get("gsis_id")).startswith("00-")
                  ),
                  "pfr_present":bool(r and clean(r.get("pfr_id")))
              }
              passed=all(gates.values())

              target_row=None
              if r:
                  target_row={
                      "fantasypros_id":clean(r.get("fantasypros_id")),
                      "sleeper_id":clean(r.get("sleeper_id")),
                      "gsis_id":clean(r.get("gsis_id")),
                      "pfr_id":clean(r.get("pfr_id")),
                      "espn_id":clean(r.get("espn_id")),
                      "sportradar_id":clean(r.get("sportradar_id")),
                      "mfl_id":clean(r.get("mfl_id")),
                      "name":clean(r.get("name")),
                      "position":clean(r.get("position")),
                      "team":clean(r.get("team")),
                      "db_season":clean(r.get("db_season"))
                  }

              results[fpid]={
                  "name":spec["name"],
                  "candidate_sleeper_id":sid,
                  "gates":gates,
                  "passed":passed,
                  "classification":(
                      "PASS_STABLE_ID_CORROBORATION"
                      if passed else "HOLD_STABLE_ID_CORROBORATION_FAILED"
                  ),
                  "target_row":target_row
              }
              snapshots[fpid]={
                  "fpid_match_count":len(fp_rows),
                  "sid_match_count":len(sid_rows),
                  "target_row":target_row
              }

          snapshot={
              "schema_version":1,
              "study_id":"identity-v2-phase12-batch1-three-player-stable-id-shadow",
              "status":"FROZEN_SECOND_SOURCE_SNAPSHOT",
              "captured_at_utc":datetime.now(timezone.utc).isoformat(),
              "source_url":url,
              "source_sha256":hashlib.sha256(raw).hexdigest(),
              "source_row_count":len(rows),
              "targets":snapshots,
              "production_change_authorized":False
          }
          (D/"identity_v2_phase12_batch1_second_source_snapshot.json").write_text(
              json.dumps(snapshot,indent=2,sort_keys=True)+"\n"
          )
          (D/"identity_v2_phase12_batch1_classification.tmp.json").write_text(
              json.dumps(results,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              fpid:{
                  "name":x["name"],
                  "passed":x["passed"],
                  "classification":x["classification"]
              }
              for fpid,x in results.items()
          },indent=2))
          PY

      - name: Build passing-subset direct and successor shadows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import copy,importlib.util,json,subprocess
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          PR=D/"identity_v2_phase12_batch1_preregistration.json"
          CLASS=D/"identity_v2_phase12_batch1_classification.tmp.json"
          PROD=Path("scripts/identity_crosswalk.json")
          RESOLVER=Path("scripts/projections/resolve_fantasypros_sleeper_identity.py")

          DIRECT=D/"identity_v2_phase12_batch1_direct_candidate_crosswalk.json"
          CONTROL=D/"identity_v2_phase12_batch1_control_refresh_crosswalk.json"
          SEEDED=D/"identity_v2_phase12_batch1_seeded_refresh_crosswalk.json"
          OUT=D/"identity_v2_phase12_batch1_stable_id_shadow.json"
          MD=D/"identity_v2_phase12_batch1_stable_id_shadow.md"

          prereg=json.loads(PR.read_text())
          classified=json.loads(CLASS.read_text())
          prod=json.loads(PROD.read_text())
          targets=prereg["batch_targets"]
          passing=sorted(
              fpid for fpid,r in classified.items()
              if r["passed"] is True
          )
          held=sorted(set(targets)-set(passing))

          def key(row):
              v=row.get("fantasypros_id")
              return None if v in (None,"") else str(v)

          def index(rows,label):
              out={}
              for r in rows:
                  k=key(r)
                  if k is None:
                      continue
                  assert k not in out,(label,"duplicate",k)
                  out[k]=r
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          def diff(a,b):
              aa=index(a,"A"); bb=index(b,"B")
              assert set(aa)==set(bb)
              return sorted(
                  k for k in aa if canon(aa[k])!=canon(bb[k])
              )

          def collisions(rows):
              by=defaultdict(list)
              for r in rows:
                  sid=r.get("sleeper_id")
                  fpid=key(r)
                  if not sid or not fpid or r.get("requires_manual_review"):
                      continue
                  by[str(sid)].append(fpid)
              return {
                  sid:fpids for sid,fpids in by.items()
                  if len(fpids)>1
              }

          prod_idx=index(prod,"production")
          assert sum(bool(r.get("requires_manual_review")) for r in prod)==14

          direct=copy.deepcopy(prod)
          direct_idx=index(direct,"direct")
          for fpid in passing:
              spec=targets[fpid]
              row=direct_idx[fpid]
              assert row["name"]==spec["name"]
              assert row["requires_manual_review"] is True
              assert row["sleeper_id"] is None
              assert str(row["candidate_sleeper_id"])==spec["candidate_sleeper_id"]
              row["sleeper_id"]=spec["candidate_sleeper_id"]
              row["candidate_sleeper_id"]=spec["candidate_sleeper_id"]
              row["requires_manual_review"]=False
              row["match_confidence"]="high"
              row["match_method"]="phase12_batch_stable_id_corroboration"

          direct_changed=diff(prod,direct)
          direct_gates={
              "changed_scope_equals_passing_subset":
                  direct_changed==passing,
              "passing_rows_authoritative_nonmanual":
                  all(
                      direct_idx[fpid]["requires_manual_review"] is False
                      and str(direct_idx[fpid]["sleeper_id"])
                          ==targets[fpid]["candidate_sleeper_id"]
                      for fpid in passing
                  ),
              "held_batch_rows_byte_identical":
                  all(
                      canon(prod_idx[fpid])==canon(direct_idx[fpid])
                      for fpid in held
                  ),
              "manual_count_reduced_by_passing_count":
                  sum(bool(r.get("requires_manual_review")) for r in direct)
                      ==14-len(passing),
              "all_nonpassing_current_manual_rows_unchanged":
                  all(
                      canon(prod_idx[fpid])==canon(direct_idx[fpid])
                      for fpid,r in prod_idx.items()
                      if r.get("requires_manual_review") is True
                      and fpid not in passing
                  ),
              "no_authoritative_sid_collision":
                  not collisions(direct)
          }
          assert all(direct_gates.values()),direct_gates
          DIRECT.write_text(json.dumps(direct,indent=2,sort_keys=True)+"\n")

          spec=importlib.util.spec_from_file_location("identity_resolver",RESOLVER)
          assert spec is not None and spec.loader is not None
          resolver=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(resolver)

          fp_doc=resolver.read_json(resolver.FP_PATH)
          totals=resolver.read_json(resolver.SLEEPER_TOTAL_PATH)
          raw=resolver.read_json(resolver.SLEEPER_RAW_PATH)
          teams=resolver.read_json(resolver.TEAM_REFRESH_PATH)

          control=resolver.build_production_crosswalk(
              fp_doc,totals,raw,teams,prod
          )
          seeded=resolver.build_production_crosswalk(
              fp_doc,totals,raw,teams,direct
          )
          CONTROL.write_text(json.dumps(control,indent=2,sort_keys=True)+"\n")
          SEEDED.write_text(json.dumps(seeded,indent=2,sort_keys=True)+"\n")

          control_idx=index(control,"control")
          seeded_idx=index(seeded,"seeded")
          successor_changed=diff(control,seeded)

          successor_gates={
              "seeded_vs_control_scope_equals_passing_subset":
                  successor_changed==passing,
              "all_passing_pairs_survive":
                  all(
                      str(seeded_idx[fpid].get("sleeper_id"))
                          ==targets[fpid]["candidate_sleeper_id"]
                      and seeded_idx[fpid].get("requires_manual_review") is False
                      for fpid in passing
                  ),
              "all_nonpassing_rows_identical_between_arms":
                  all(
                      canon(control_idx[k])==canon(seeded_idx[k])
                      for k in control_idx if k not in passing
                  ),
              "jonah_elliss_remains_held":
                  seeded_idx["26157"].get("requires_manual_review") is True
                  and canon(control_idx["26157"])==canon(seeded_idx["26157"]),
              "no_authoritative_sid_collision":
                  not collisions(seeded)
          }
          assert all(successor_gates.values()),successor_gates

          live_source_drift=diff(prod,control)

          if passing:
              decision=(
                  "PASS_IDENTITY_V2_PHASE12_BATCH1_SHADOW_"
                  "AUTHORIZE_A6_EXACT_SCOPE_DEPLOYMENT_OF_PASSING_SUBSET"
              )
          else:
              decision=(
                  "STOP_IDENTITY_V2_PHASE12_BATCH1_NO_PASSING_STABLE_ID_CANDIDATES"
              )

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase12-batch1-three-player-stable-id-shadow",
              "status":"BATCH_STABLE_ID_SHADOW_COMPLETE",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "deployment_authorized":False,
              "batch_target_count":3,
              "passing_fpids":passing,
              "held_fpids":held,
              "classification":classified,
              "direct_shadow":{
                  "changed_fpids":direct_changed,
                  "changed_count":len(direct_changed),
                  "manual_review_count_before":14,
                  "manual_review_count_after":14-len(passing),
                  "authoritative_sid_collisions":collisions(direct),
                  "hard_gates":direct_gates,
                  "all_hard_gates_pass":all(direct_gates.values())
              },
              "successor_resolver_shadow":{
                  "seeded_vs_control_changed_fpids":successor_changed,
                  "seeded_vs_control_changed_count":len(successor_changed),
                  "authoritative_sid_collisions":collisions(seeded),
                  "hard_gates":successor_gates,
                  "all_hard_gates_pass":all(successor_gates.values())
              },
              "live_source_drift_diagnostic":{
                  "production_vs_control_refresh_changed_count":
                      len(live_source_drift),
                  "production_vs_control_refresh_changed_fpids":
                      live_source_drift
              },
              "a6_exact_scope_deployment_authorized":bool(passing),
              "next_step_rule":"A6 may deploy only the exact passing_fpids subset frozen here. Held batch rows remain untouched."
          }
          OUT.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 12 Batch 1 — Three-Player Stable-ID Shadow",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- Batch targets: **3**",
              f"- Passing stable-ID rows: **{len(passing)}** — `{passing}`",
              f"- Held rows: **{len(held)}** — `{held}`",
              f"- Direct changed FPIDs: **{direct_changed}**",
              f"- Manual-review count shadow: **14 → {14-len(passing)}**",
              f"- Successor changed FPIDs: **{successor_changed}**",
              "- Production changed: **No**",
              "",
              "Each target was evaluated independently; failed targets do not block passing targets.",
              ""
          ]
          MD.write_text("\n".join(lines).rstrip()+"\n")
          print("\n".join(lines))
          PY

      - name: Remove temporary classification scratch file
        shell: bash
        run: |
          set -euo pipefail
          rm -f research/identity-v2/identity_v2_phase12_batch1_classification.tmp.json

      - name: Validate A5 batch shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          r=json.loads((D/"identity_v2_phase12_batch1_stable_id_shadow.json").read_text())

          assert r["batch_target_count"]==3
          assert set(r["passing_fpids"])|set(r["held_fpids"])=={
              "15697","18557","20080"
          }
          assert not (set(r["passing_fpids"])&set(r["held_fpids"]))
          assert r["direct_shadow"]["changed_fpids"]==r["passing_fpids"]
          assert r["successor_resolver_shadow"]["seeded_vs_control_changed_fpids"]==r["passing_fpids"]
          assert r["direct_shadow"]["all_hard_gates_pass"] is True
          assert r["successor_resolver_shadow"]["all_hard_gates_pass"] is True
          assert r["direct_shadow"]["manual_review_count_after"]==14-len(r["passing_fpids"])
          assert r["a6_exact_scope_deployment_authorized"] is bool(r["passing_fpids"])
          assert r["production_change_authorized"] is False
          assert r["deployment_authorized"] is False
          print("PASS: A5 independent batch-shadow contract validated.")
          PY

      - name: Regression test passing-subset candidate temporarily
        shell: bash
        run: |
          set -euo pipefail

          PROD="scripts/identity_crosswalk.json"
          CAND="research/identity-v2/identity_v2_phase12_batch1_direct_candidate_crosswalk.json"
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          cp "$PROD" "${RUNNER_TEMP}/identity_crosswalk.production.json"
          cp "$TU_JSON" "${RUNNER_TEMP}/team_utility_lineup_projections.production.json"
          cp "$TU_MD" "${RUNNER_TEMP}/team_utility_lineup_projection_report.production.md"

          sha256sum "$PROD" > "${RUNNER_TEMP}/identity_crosswalk.production.sha256"
          sha256sum "$TU_JSON" "$TU_MD" > "${RUNNER_TEMP}/team_utility.production.sha256"

          restore_prod() {
            cp "${RUNNER_TEMP}/identity_crosswalk.production.json" "$PROD"
            cp "${RUNNER_TEMP}/team_utility_lineup_projections.production.json" "$TU_JSON"
            cp "${RUNNER_TEMP}/team_utility_lineup_projection_report.production.md" "$TU_MD"
          }
          trap restore_prod EXIT

          cp "$CAND" "$PROD"
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/projections/build_team_utility_lineup_projections.py --check
          python3 scripts/validation/repo_regression_checks.py

          restore_prod
          trap - EXIT

          sha256sum -c "${RUNNER_TEMP}/identity_crosswalk.production.sha256"
          sha256sum -c "${RUNNER_TEMP}/team_utility.production.sha256"
          git diff --exit-code -- "$PROD" "$TU_JSON" "$TU_MD"
          echo "PASS: A5 passing-subset candidate regressions green; production restored."

      - name: Freeze A5 manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          D=Path("research/identity-v2")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=json.loads((D/"identity_v2_phase12_batch1_stable_id_shadow.json").read_text())
          files=[
              "identity_v2_phase12_batch1_preregistration.json",
              "identity_v2_phase12_batch1_second_source_snapshot.json",
              "identity_v2_phase12_batch1_stable_id_shadow.json",
              "identity_v2_phase12_batch1_stable_id_shadow.md",
              "identity_v2_phase12_batch1_direct_candidate_crosswalk.json",
              "identity_v2_phase12_batch1_control_refresh_crosswalk.json",
              "identity_v2_phase12_batch1_seeded_refresh_crosswalk.json"
          ]
          m={
              "schema_version":1,
              "study_id":"identity-v2-phase12-batch1-three-player-stable-id-shadow",
              "decision":r["decision"],
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "files":{f:sha(D/f) for f in files},
              "passing_fpids":r["passing_fpids"],
              "held_fpids":r["held_fpids"],
              "a6_exact_scope_deployment_authorized":
                  r["a6_exact_scope_deployment_authorized"],
              "production_change_authorized":False,
              "production_changed":False
          }
          (D/"identity_v2_phase12_batch1_manifest.json").write_text(
              json.dumps(m,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A5 manifest frozen.")
          PY

      - name: Prove research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          prefix="research/identity-v2/"
          allowed={
              prefix+"identity_v2_phase12_batch1_preregistration.json",
              prefix+"identity_v2_phase12_batch1_second_source_snapshot.json",
              prefix+"identity_v2_phase12_batch1_stable_id_shadow.json",
              prefix+"identity_v2_phase12_batch1_stable_id_shadow.md",
              prefix+"identity_v2_phase12_batch1_direct_candidate_crosswalk.json",
              prefix+"identity_v2_phase12_batch1_control_refresh_crosswalk.json",
              prefix+"identity_v2_phase12_batch1_seeded_refresh_crosswalk.json",
              prefix+"identity_v2_phase12_batch1_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "scripts/identity_crosswalk.json" not in touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: A5 writes research artifacts only.")
          PY

      - name: Postflight production regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit A5 research artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A5."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase12_batch1_preregistration.json \
            research/identity-v2/identity_v2_phase12_batch1_second_source_snapshot.json \
            research/identity-v2/identity_v2_phase12_batch1_stable_id_shadow.json \
            research/identity-v2/identity_v2_phase12_batch1_stable_id_shadow.md \
            research/identity-v2/identity_v2_phase12_batch1_direct_candidate_crosswalk.json \
            research/identity-v2/identity_v2_phase12_batch1_control_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase12_batch1_seeded_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase12_batch1_manifest.json

          git diff --cached --check
          git commit -m "Freeze Identity V2 Phase 12 Batch 1 stable-ID shadow"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A5 committed; production unchanged."
