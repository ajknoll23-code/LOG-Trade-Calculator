      - name: Prove only V3 freeze files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/draft-pick-fv-v3/draft_pick_fv_v3_catalog_prereg.py",
              "research/draft-pick-fv-v3/historical_draft_source_catalog_v3.json",
              "research/draft-pick-fv-v3/preregistration_v3.json",
              "research/draft-pick-fv-v3/preregistration_v3.md",
              "research/draft-pick-fv-v3/preregistration_manifest_v3.json",
          }

          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )

          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          if changed != expected:
              raise SystemExit(
                  "Unexpected changed-file set.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(changed)}"
              )

          print("PASS: exactly five intended V3 freeze files changed.")
          PY

      - name: Commit V3 catalog and preregistration freeze
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

