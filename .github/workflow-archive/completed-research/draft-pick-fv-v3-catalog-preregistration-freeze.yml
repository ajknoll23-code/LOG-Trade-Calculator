            exit 1
          }

          git pull --rebase --autostash origin main

          # Revalidate after the rebase so the freeze is attached to current main.
          python3 research/draft-pick-fv-v3/draft_pick_fv_v3_catalog_prereg.py --check
          python3 scripts/validation/repo_regression_checks.py

