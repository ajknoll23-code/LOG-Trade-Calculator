name: QF11 V25 - Offline Ballot Wording and Comprehension Instrument QC (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V25_V23: /tmp/qf11-v25-input/v23
  QF11_V25_V24: /tmp/qf11-v25-input/v24
  QF11_V25_OUTPUT: /tmp/qf11-v25-output
jobs:
  offline_wording_qc:
    name: Build offline one-trio preview and exact comprehension proposal without respondent contact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin protected frozen sources and observe changing cache without clearing identities
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V25_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V25_PROTECTED_SOURCE_PINS_GREEN

        '
    - name: Download exact V23 Green preregistration evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v23-RESEARCH-ONLY-approved-amendment-QC
        run-id: 38325685955
        github-token: ${{ github.token }}
        path: /tmp/qf11-v25-input/v23
    - name: Download exact V24 Green synthetic pilot QC evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v24-RESEARCH-ONLY-synthetic-pilot-qc
        run-id: 38326242398
        github-token: ${{ github.token }}
        path: /tmp/qf11-v25-input/v24
    - name: SHA-verify V23 V24 and generate offline ballot plus revised wording draft
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v25-output\ncat > /tmp/qf11-v25-instrument.py <<'QF11_V25_INSTRUMENT'\n#!/usr/bin/env python3\n\
        \"\"\"QF11 V25: immutable-evidence offline instrument spec and static preview. No respondent activity.\"\"\"\nfrom __future__ import annotations\n\
        import hashlib, html, itertools, json, os, pathlib, sys\n\nSRC23=pathlib.Path(os.environ.get('QF11_V25_V23','/tmp/qf11-v25-input/v23'))\n\
        SRC24=pathlib.Path(os.environ.get('QF11_V25_V24','/tmp/qf11-v25-input/v24'))\nOUT=pathlib.Path(os.environ.get('QF11_V25_OUTPUT','/tmp/qf11-v25-output'))\n\
        PINS={\n 'v23/RESEARCH_ONLY_v23_prospective_protocol_amendment.json': '7014ab5d890ce71496932174a5f7b01fbba26cfb1b63f731c196d2d48a3cf861',\n\
        \ 'v23/RESEARCH_ONLY_v23_unchanged_catalog_scope.json': '56e98848bf6341dfcc2cd0ed14bdec8f0fae819e13afb78fbff0e62bdb9f7694',\n 'v23/RESEARCH_ONLY_v23_independent_qc_handoff.md':\
        \ '4a7eb3c61f894f94b46e05525966fe3c9dee6cd91a8183225d4646b30383aa6d',\n 'v24/RESEARCH_ONLY_v24_synthetic_qc_summary.json': '97d5d82e0d3d0a0b6178ac3b5bd517213b64ae8eecad98b6975be77122d5e36c',\n\
        \ 'v24/RESEARCH_ONLY_v24_independent_qc_gate.md': '28ce9da4b9a107cca8f69b3623a8e0cff29af2a992f92617d472d7c579cc32ee',\n}\nfor rel,digest\
        \ in PINS.items():\n    root=SRC23 if rel.startswith('v23/') else SRC24\n    p=root/rel.split('/',1)[1]\n    if not p.is_file(): raise\
        \ RuntimeError(f'STOP_ARCHIVED_SOURCE_MISSING_{rel}')\n    if hashlib.sha256(p.read_bytes()).hexdigest()!=digest: raise RuntimeError(f'STOP_ARCHIVED_SOURCE_DRIFT_{rel}')\n\
        read=lambda root,name:json.loads((root/name).read_text())\np=read(SRC23,'RESEARCH_ONLY_v23_prospective_protocol_amendment.json')\ns=read(SRC23,'RESEARCH_ONLY_v23_unchanged_catalog_scope.json')\n\
        v=read(SRC24,'RESEARCH_ONLY_v24_synthetic_qc_summary.json')\nTRIO=['Brock Bowers','Tyler Warren','TreVeyon Henderson']\nassert [x['name']\
        \ for x in p['one_trio']]==TRIO\nassert [x['position'] for x in p['one_trio']]==['TE','TE','RB']\norders=[list(x) for x in itertools.permutations(TRIO)]\n\
        assert p['sample_plan']['display_orders']==orders\nassert p['sample_plan']['design_n']==12\nassert p['prospective_stop_amendment']['precedence']=='INDIVIDUAL_CRITICAL_STOP_OVERRIDES_ALL_AGGREGATE_THRESHOLDS'\n\
        assert p['owner_approval_scope']['pilot_recruitment_approved'] is False\nassert p['owner_approval_scope']['real_respondent_display_approved']\
        \ is False\nassert p['owner_approval_scope']['single_trio_research_protocol_amendment_approved'] is True\nassert v['status']=='RESEARCH_ONLY_SYNTHETIC_PASS_ACTIVATION_NOT_APPROVED'\n\
        assert v['open_human_or_implementation_gates']==5\nassert v['independent_human_qc_completed'] is False\nassert v['no_real_human_data']\
        \ and v['simulation_count']==12\nassert s['candidate_review_count']==22 and s['optional_shadow_certified']==0\nassert s['original_excluded_slots']==[1,5,8,12,15,21]\n\
        assert len(s['seven_identity_holds'])==7\nassert s['voting_activated'] is False\nassert p['fail_closed']['participants_contacted']==0\n\
        \nwording=(\n 'Offline wording proposal — 12-team dynasty Superflex with IDP. '\n 'For the same multiseason dynasty horizon, rank these\
        \ three assets by your own preference. '\n 'KEEP = your most preferred asset; TRADE = your middle-ranked asset; CUT = your least preferred\
        \ asset. '\n 'These are hypothetical ranking labels; choosing an option does not actually trade, drop or keep anyone. '\n 'There is no\
        \ correct player ranking.'\n)\nquestionnaire=[\n {'id':'Q1_NO_REAL_TRANSACTION','question':'Does choosing CUT actually drop a player from\
        \ your roster?',\n  'options':['Yes, automatically','No, it is only a hypothetical ranking label','Only in dynasty leagues'],\n  'expected_option_index':1,'type':'critical_semantics','explanation':'Distinguishes\
        \ symbolic rank from transaction execution'},\n {'id':'Q2_TRADE_MEANING','question':'In this exercise, what does TRADE mean?',\n  'options':['You\
        \ must offer the player in a real trade','Your second-most-preferred of the three assets','The player with the highest current trade volume'],\n\
        \  'expected_option_index':1,'type':'critical_semantics','explanation':'Tests precise label meaning, not memorizing player positions'},\n\
        \ {'id':'Q3_TIME_HORIZON','question':'Should all three assets be compared over the same dynasty time horizon?',\n  'options':['Yes','No,\
        \ each asset uses a different horizon'],\n  'expected_option_index':0,'type':'critical_semantics','explanation':'Tests fair comparison\
        \ context'},\n {'id':'Q4_OPEN_ENDED','question':'In your own words, what does TRADE represent here?',\n  'type':'qualitative_review','explanation':'Requires\
        \ a human review rubric; not automatically scored or counted as pilot result'}\n]\nassert all(q['id']!='IDENTIFY_RB' for q in questionnaire)\n\
        \nproposal={\n 'schema':'QF11_V25_OFFLINE_WORDING_QC_PROPOSAL',\n 'status':'DRAFT_NOT_APPROVED_FOR_RESPONDENT_DISPLAY',\n 'source_runs':{'v23':38325685955,'v24':38326242398},\n\
        \ 'source_sha256':PINS,\n 'candidate_scope':{'research_candidates':22,'optional_uncertified':9,'held_slots':s['original_excluded_slots'],'held_identities':s['seven_identity_holds'],'pilot_trio':TRIO},\n\
        \ 'same_horizon_wording_draft':wording,\n 'visible_player_positions':{'Brock Bowers':'TE','Tyler Warren':'TE','TreVeyon Henderson':'RB'},\n\
        \ 'reason_not_asking_RB_ID':'RB is explicitly labeled in the choices; that question only tests label reading, so draft asks about transaction\
        \ semantics and horizon instead',\n 'comprehension_questionnaire_draft':questionnaire,\n 'incident_policy_from_v23_unchanged':'INDIVIDUAL_CRITICAL_STOP_OVERRIDES_ALL_AGGREGATE_THRESHOLDS',\n\
        \ 'critical_failure_rule_change_proposed':'Replace RB identification with semantics questions; this is a material PROPOSED amendment,\
        \ not approved or implemented',\n 'proposed_critical_handling':'Any demonstrable misunderstanding of actual-transaction status, ranking\
        \ meaning, or same-horizon context immediately stops a separately authorized pilot; human reviewer adjudicates ambiguous responses',\n\
        \ 'aggregate_10_of_12':'Usability feedback only if 12 complete and zero critical events; not market calibration',\n 'six_display_orders':orders,\n\
        \ 'draft_consent_status':'NOT_IMPLEMENTED_OR_APPROVED',\n 'live_assignment':'NOT_IMPLEMENTED',\n 'duplicate_protection':'NOT_IMPLEMENTED',\n\
        \ 'real_incident_shutdown':'NOT_IMPLEMENTED',\n 'deletion_after_30_days':'NOT_IMPLEMENTED',\n 'independent_human_semantic_qc':False,\n\
        \ 'owner_new_wording_approval':False,\n 'owner_pilot_activation_approved':False,\n 'live_voter_issuance_approved':False,\n 'market_calibration_authorized':False,\n\
        \ 'actual_participants':0,\n 'actual_votes':0,\n 'production_changes':0\n}\n\ngaps={'schema':'QF11_V25_PRE_ACTIVATION_BLOCKER_MATRIX','gate_status':'BLOCKED_PENDING_INDEPENDENT_QC_AND_OWNER_AUTHORIZATION',\n\
        \ 'priority':[{\n  'id':'WORDING_QUESTION_INSTRUMENT','status':'PROPOSED_REVISION_NOT_APPROVED',\n  'deliverable':'Exact offline ballot\
        \ and four-question draft; removes easily cued RB-identification item; future independent human semantic review required'},\n  {'id':'CONSENT_AND_RECRUITMENT','status':'NOT_IMPLEMENTED','deliverable':'Draft\
        \ adult-only informed consent, eligibility, secure participant recruitment and consent logging'},\n  {'id':'BALANCED_RANDOMIZATION_DEDUP','status':'NOT_IMPLEMENTED','deliverable':'Deployed\
        \ privacy-respecting six-order allocation with dedup and caps, adversarial tests and manual audit'},\n  {'id':'PRIVACY_DELETE','status':'NOT_IMPLEMENTED','deliverable':'Concrete\
        \ retention policy, access controls, 30-day deletion job, and deletion verification'},\n  {'id':'CRITICAL_INCIDENT_RESPONSE','status':'NOT_IMPLEMENTED','deliverable':'Deployed\
        \ stop switch, quarantine, incident review, versioned resumption path'},\n  {'id':'MARKET_POWER','status':'NOT_APPROVED','deliverable':'12-person\
        \ single-trio test cannot be used as market-value or order-bias calibration'}],\n 'pilot_ready':False,'recruitment_approved':False,'voter_links_enabled':False,'production_modified':False,\n\
        \ 'owner_action':'Review proposed exact wording, revised comprehension checks, consent/privacy/retention and deployed implementation plan;\
        \ independent external/human QC then explicit owner pilot authorization required'}\n\nOUT.mkdir(parents=True,exist_ok=True)\n(OUT/'RESEARCH_ONLY_v25_wording_instrument_DRAFT.json').write_text(json.dumps(proposal,indent=2,ensure_ascii=False,sort_keys=True)+'\\\
        n')\n(OUT/'RESEARCH_ONLY_v25_preactivation_gaps.json').write_text(json.dumps(gaps,indent=2,ensure_ascii=False,sort_keys=True)+'\\n')\n\
        \n# Deliberately local, non-submittable preview: inline client-side demo code, no storage/network or form submission.\n# All characters\
        \ in user-facing template are html escaped.\nplayers=html.escape(json.dumps(p['one_trio'],ensure_ascii=False))\njs_orders=json.dumps(orders,ensure_ascii=False)\n\
        preview='''<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\
        >\n<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; img-src 'none'; connect-src 'none'; style-src 'unsafe-inline';\
        \ script-src 'unsafe-inline'; form-action 'none';\">\n<title>QF11 V25 - offline internal pilot preview (not a survey)</title>\n<style>body{font:16px/1.5\
        \ system-ui,Arial,sans-serif;max-width:850px;padding:1.5rem;margin:auto;color:#111827;background:#f9fafb}h1{font-size:1.5rem}h2{font-size:1.15rem}\
        \ .warn{background:#fef3c7;padding:1rem;border:2px solid #d97706;border-radius:9px} .panel{background:white;border:1px solid #d1d5db;border-radius:10px;padding:1rem;margin:1rem\
        \ 0} .player{padding:.6rem;border-bottom:1px solid #eee} .controls button{margin:.25rem .3rem .25rem 0;padding:.55rem;border:1px solid\
        \ #64748b;border-radius:6px;background:#fff;cursor:pointer}button:focus,input:focus{outline:3px solid #2563eb}label{margin-right:1.1rem}fieldset{border:none}\
        \ .foot{font-size:.9rem;color:#374151} .flag{font-weight:700;color:#92400e}</style></head>\n<body><h1>QF11 V25 — Internal offline ballot\
        \ preview</h1>\n<div class=\"warn\"><strong>PREVIEW ONLY — NOT AN APPROVED PILOT OR VOTING LINK.</strong> No responses are collected,\
        \ transmitted, stored, or counted. This file is for owner and independent quality review.</div>\n<section class=\"panel\"><h2>Draft instructions\
        \ (not yet approved)</h2><p>12-team dynasty Superflex with IDP. For the same multiseason dynasty horizon, rank these three assets by your\
        \ own preference. <strong>KEEP</strong> = most preferred; <strong>TRADE</strong> = middle-ranked; <strong>CUT</strong> = least preferred.\
        \ These are hypothetical ranking labels; choosing does not execute a trade, drop, or roster move. There is no correct player ranking.</p></section>\n\
        <section class=\"panel\"><h2>Display-order inspection</h2><p>Six permutations are selectable for visual inspection, not for actual participant\
        \ assignment.</p><div class=\"controls\" id=\"orders\"></div><div id=\"ballot\"></div><button type=\"button\" id=\"demo\">Check local\
        \ ranking only</button><p id=\"feedback\" aria-live=\"polite\"></p></section>\n<section class=\"panel\"><h2>Draft comprehension checks\
        \ — subject to independent review</h2>\n<ol><li>Does selecting CUT actually remove anyone from your roster? <em>Expected: No.</em></li>\n\
        <li>What does TRADE mean in this exercise? <em>Expected: Second-most-preferred asset, not a real transaction.</em></li>\n<li>Must all\
        \ three assets use the same dynasty time horizon? <em>Expected: Yes.</em></li>\n<li>Open-ended: Explain the meaning of TRADE in your own\
        \ words. <em>Human rubric required.</em></li></ol>\n<p class=\"flag\">An RB-identification question is intentionally not used because\
        \ the player is visibly labeled RB. Any new comprehension question requires a prospective owner-approved amendment.</p></section>\n<p\
        \ class=\"foot\">Offline, no external scripts, no forms, no cookies, no localStorage, no analytics, no network requests, no recruitment,\
        \ no vote submission, no Market Value updates. Preview does not implement real consent, deduplication, randomization, retention or shutdown.</p>\n\
        <script>\n'use strict';\nconst orders = ORDERS_PLACEHOLDER;\nconst pos = {'Brock Bowers':'TE','Tyler Warren':'TE','TreVeyon Henderson':'RB'};\n\
        let active=0;\nconst controls=document.getElementById('orders'), area=document.getElementById('ballot'),feedback=document.getElementById('feedback');\n\
        orders.forEach((order,i)=>{const b=document.createElement('button'); b.type='button'; b.textContent='Order '+(i+1); b.addEventListener('click',()=>render(i));\
        \ controls.appendChild(b);});\nfunction render(i){active=i; feedback.textContent=''; area.textContent=''; orders[active].forEach((name,n)=>{\n\
        const line=document.createElement('div');line.className='player';\nconst strong=document.createElement('strong');strong.textContent=name+'\
        \ — '+pos[name];line.appendChild(strong);\nconst fs=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent='Hypothetical\
        \ rank for '+name;fs.appendChild(legend);\n['KEEP','TRADE','CUT'].forEach(rank=>{const id='r'+active+'_'+n+'_'+rank;const l=document.createElement('label');const\
        \ input=document.createElement('input');input.type='radio';input.name='p'+n;input.value=rank;input.id=id;l.appendChild(input);l.appendChild(document.createTextNode('\
        \ '+rank));fs.appendChild(l);});\nline.appendChild(fs);area.appendChild(line);});}\ndocument.getElementById('demo').addEventListener('click',()=>{\n\
        const chosen=Array.from(area.querySelectorAll('input:checked')).map(x=>x.value);\nfeedback.textContent=chosen.length===3&&new Set(chosen).size===3\
        \ ? 'Local layout check only: three distinct hypothetical ranking labels selected. No data saved or submitted.' : 'Choose exactly one\
        \ KEEP, one TRADE and one CUT to check the layout.';\n});\nrender(0);\n</script></body></html>'''.replace('ORDERS_PLACEHOLDER',js_orders)\n\
        assert 'fetch(' not in preview and 'localStorage' in preview  # only documentation, never calls\nassert '<form' not in preview and 'type=\"\
        submit\"' not in preview\n(OUT/'RESEARCH_ONLY_v25_offline_preview.html').write_text(preview)\n\nbrief='''# QF11 V25 — Offline instrument\
        \ and comprehension proposal (no live pilot)\n\n**This is a research-only internal preview. Not an approved respondent instrument or deployment.**\n\
        \n## What changed from V23/V24\n- Draft wording now emphasizes **hypothetical ordered preferences** over one dynasty horizon; KEEP / TRADE\
        \ / CUT are ranking labels and never real roster actions.\n- Displays all three positions, because position is relevant for a realistic\
        \ comparison.\n- Proposes replacing the **cued RB-identification check** (RB is printed on the page) with questions on the meaning of\
        \ CUT, TRADE, and equal-horizon comparison, plus a qualitative explanation question.\n- This change to the original preregistered critical\
        \ trigger is explicitly **NOT approved**. Independent semantic review and a prospective owner amendment are necessary before humans see\
        \ it.\n- Produces a **non-networked HTML preview** to inspect all six orders and local one-of-each-rank validation. This is not a production\
        \ assignment application; it stores and submits nothing.\n\n## V24 Green and source provenance\n- V24 actual run 38326242398; 12 simulated\
        \ assignments, 6 orders (2 each), synthetic failures rejected, 14 frozen regression groups Green.\n- Archive V24 and V23 exact bytes SHA-256\
        \ verified before generating the proposal.\n- Still 22 research candidates (12 unchanged, 9 optional uncertified, 1 tentative), six held\
        \ original slots, 7 held identities; no voting, no promotions, no roster/Market changes.\n\n## Remaining true blockers\n- Independent\
        \ **human** review of exact wording, semantics, critical thresholds and question validity.\n- Approved consent, recruitment/eligibility,\
        \ real deduplication and balanced random assignment (not implemented).\n- Enforced 30-day deletion/access controls (not implemented).\n\
        - Live critical stop/quarantine and incident handling (not implemented).\n- Owner authorization for pilot activation and separate evaluation\
        \ of any votes for production. N=12 is usability only, never enough for market calibration.\n\n**No respondents, no voter links, no votes,\
        \ no Market Values, no repo writes. A V25 Green is not launch approval.**\n'''\n(OUT/'RESEARCH_ONLY_v25_owner_instrument_review.md').write_text(brief)\n\
        print('QF11_V25_OFFLINE_INSTRUMENT_DRAFT_GREEN '+json.dumps({'orders':len(orders),'draft_questions':len(questionnaire),'source_gates_open':v['open_human_or_implementation_gates'],'recruitment':False,'market_updates':False},sort_keys=True))\n\
        \nQF11_V25_INSTRUMENT\npython3 /tmp/qf11-v25-instrument.py\npython3 - <<'QF11_V25_EXTRACT'\nfrom pathlib import Path\nimport re, os\n\
        s=(Path(os.environ.get('QF11_V25_OUTPUT','/tmp/qf11-v25-output'))/'RESEARCH_ONLY_v25_offline_preview.html').read_text()\nassert s.count('<script>')==1\
        \ and s.count('</script>')==1\njs=s.split('<script>',1)[1].split('</script>',1)[0]\nfor prohibited in ('fetch(', 'XMLHttpRequest', 'sendBeacon(',\
        \ 'WebSocket(', 'localStorage.', 'sessionStorage.'):\n    assert prohibited not in js, f'STOP_OFFLINE_NETWORK_OR_STORAGE_{prohibited}'\n\
        assert '<form' not in s and 'type=\"submit\"' not in s\nassert \"connect-src 'none'\" in s\nPath('/tmp/qf11-v25-preview-check.js').write_text(js)\n\
        print('QF11_V25_OFFLINE_NO_NETWORK_STORAGE_GATE_GREEN')\nQF11_V25_EXTRACT\nnode --check /tmp/qf11-v25-preview-check.js\n"
    - name: Run all 14 frozen regression groups plus FA PA release selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V25_FROZEN_14_REGRESSIONS_GREEN

        '
    - name: Fail closed on review-only instrument, human QC and all activation gates
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''QF11_V25_FINAL_GATE''

        import json, os

        from pathlib import Path

        p=Path(os.environ.get(''QF11_V25_OUTPUT'',''/tmp/qf11-v25-output''))

        a=json.loads((p/''RESEARCH_ONLY_v25_wording_instrument_DRAFT.json'').read_text())

        b=json.loads((p/''RESEARCH_ONLY_v25_preactivation_gaps.json'').read_text())

        assert a[''schema'']==''QF11_V25_OFFLINE_WORDING_QC_PROPOSAL''

        assert a[''status'']==''DRAFT_NOT_APPROVED_FOR_RESPONDENT_DISPLAY''

        assert a[''source_runs'']=={''v23'':38325685955,''v24'':38326242398}

        assert len(a[''six_display_orders''])==6 and len(a[''comprehension_questionnaire_draft''])==4

        assert len(a[''candidate_scope''][''held_identities''])==7 and a[''candidate_scope''][''optional_uncertified'']==9

        assert a[''critical_failure_rule_change_proposed''].endswith(''not approved or implemented'')

        assert a[''owner_new_wording_approval''] is False and a[''independent_human_semantic_qc''] is False

        assert a[''owner_pilot_activation_approved''] is False and a[''live_voter_issuance_approved''] is False

        assert a[''actual_participants'']==0 and a[''actual_votes'']==0 and a[''production_changes'']==0

        assert not a[''market_calibration_authorized'']

        assert b[''pilot_ready''] is False and b[''recruitment_approved''] is False and not b[''voter_links_enabled'']

        assert all(x[''status'']!=''IMPLEMENTED'' for x in b[''priority''])

        print(''QF11_V25_REVIEW_ONLY_NO_HUMAN_DATA_NO_VOTING_NO_PRODUCTION_GREEN'')

