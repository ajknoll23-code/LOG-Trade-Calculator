name: Package Adjustment V8 - Phase 1B Catalog Design Freeze V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze_design:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard frozen V8 prerequisites
        shell: bash
        run: |
          set -euo pipefail

          V8="research/package-adjustment-v8"
          V7="research/package-adjustment-v7"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V8/topology_split_preregistration_v1.json")" = \
            "0861346a483ed9938246fd04173408c47c012ee9"
          test "$(git hash-object "$V8/topology_split_power_analysis_v1.json")" = \
            "6d4aae4126443c9550efa0a82586d2f5ccda03c3"
          test "$(git hash-object "$V8/topology_split_power_analysis_manifest_v1.json")" = \
            "ef330cc66780a0f94b1312f5cc3d09719a554316"
          test "$(git hash-object "$V7/phase1a_player_fv_snapshot_v1.json")" = \
            "945bfb8f504bf62cba46464e1940126fd7a528e8"

          test ! -e "$V8/catalog_design_contract_v1.json"
          test ! -e "$V8/catalog_design_feasibility_v1.json"
          test ! -e "$V8/catalog_design_manifest_v1.json"
          test ! -e "$V8/catalog_design_v1.md"
          test ! -e "$V8/development_catalog_v1.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          v8=Path("research/package-adjustment-v8")
          p=json.loads((v8/"topology_split_preregistration_v1.json").read_text())
          power=json.loads((v8/"topology_split_power_analysis_v1.json").read_text())

          assert p["status"]=="FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE"
          assert power["status"]=="FROZEN_PRE_CATALOG_PRE_VOTE_POWER"
          assert power["decision"]=="FREEZE_V8_POWER_AT_44_VOTERS_AND_44_PER_CHALLENGE"
          assert power["selected_first_checkpoint_distinct_voters"]==44
          assert power["development_catalog_generated"] is False
          assert power["v8_vote_outcomes_used_for_power"] is False
          assert p["catalog_generation_firewalls"]["no_votes_may_be_collected_before_catalog_audit_passes"] is True
          print("PASS: V8 prerequisites permit pre-vote catalog design freeze.")
          PY

      - name: Freeze cardinality-adjusted concentration design
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import bisect
          import hashlib
          import json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path.cwd()
          V8=ROOT/"research"/"package-adjustment-v8"
          V7=ROOT/"research"/"package-adjustment-v7"

          PREREG=V8/"topology_split_preregistration_v1.json"
          POWER=V8/"topology_split_power_analysis_v1.json"
          SNAP=V7/"phase1a_player_fv_snapshot_v1.json"

          CONTRACT=V8/"catalog_design_contract_v1.json"
          FEAS=V8/"catalog_design_feasibility_v1.json"
          MAN=V8/"catalog_design_manifest_v1.json"
          MD=V8/"catalog_design_v1.md"

          def load(p): return json.loads(p.read_text())
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()

          prereg=load(PREREG)
          power=load(POWER)
          snap=load(SNAP)

          eligible=[
              p for p in snap["players"]
              if int(p["fv"])>=2500
              and p.get("team") not in (None,"")
              and str(p["key"]).lower()!="joe mixon"
          ]
          eligible.sort(key=lambda p:(int(p["fv"]),p["key"]))

          min_fv=2500
          min_2v2=3000
          apex_min=4000
          max_fv=max(int(p["fv"]) for p in eligible)
          theoretical_4_top=max_fv/(max_fv+3*min_fv)
          theoretical_2_min=0.5
          raw_reverse_max=theoretical_4_top-theoretical_2_min

          assert raw_reverse_max < 0.05

          generated=datetime.now(timezone.utc).isoformat()

          contract={
              "schema_version":1,
              "study_id":prereg["study_id"],
              "stage":"phase1b_catalog_design_freeze",
              "status":"FROZEN_PRE_CATALOG_PRE_VOTE",
              "generated_at_utc":generated,
              "reason":
                  "The realism-first FV floors make raw top-asset share non-comparable across unequal cardinalities. In 2v4, reverse-direction moderate/high cells are structurally impossible without low-value filler assets.",
              "structural_impossibility_diagnostic":{
                  "maximum_eligible_player_fv":max_fv,
                  "minimum_asset_fv":min_fv,
                  "two_player_minimum_raw_top_share":theoretical_2_min,
                  "four_player_maximum_raw_top_share_under_floor":theoretical_4_top,
                  "maximum_possible_4v2_reverse_raw_top_share_gap":raw_reverse_max,
                  "moderate_band_lower_bound":0.05,
                  "raw_top_share_reverse_moderate_possible":False,
              },
              "primary_concentration_metric":{
                  "name":"apex_excess_share",
                  "formula":"top_asset_share - (1 / asset_count)",
                  "interpretation":
                      "How far the side's largest asset share sits above an equal split for that side size.",
                  "contrast_formula":
                      "apex_excess_share_A - apex_excess_share_B",
                  "direction_A_rule":"contrast > 0",
                  "direction_B_rule":"contrast < 0",
                  "same_size_equivalence":
                      "For equal-size topologies, the equal-split baseline cancels exactly, so contrast direction and magnitude equal raw top-share difference.",
                  "candidate_model_score_not_used":True,
              },
              "contrast_bands":prereg["development_catalog_preregistration"]["contrast_bands"],
              "topology_counts":prereg["development_catalog_preregistration"]["topology_counts"],
              "direction_balance":{
                  "overall_A":20,
                  "overall_B":20,
                  "within_each_6_trade_topology":"A_low,B_low,A_moderate,B_moderate,A_high,B_high",
                  "within_2v2_10_trade_topology":
                      "A_low,B_low,A_low,B_low,A_moderate,B_moderate,A_high,B_high,A_high,B_high",
              },
              "trade_realism_contract_sha256":
                  hashlib.sha256(
                      json.dumps(
                          prereg["trade_realism_contract"],
                          sort_keys=True,
                          separators=(",",":")
                      ).encode()
                  ).hexdigest(),
              "power_plan":{
                  "unchanged":True,
                  "first_checkpoint_distinct_voters":
                      power["selected_first_checkpoint_distinct_voters"],
                  "minimum_distinct_voters_per_challenge":
                      power["coverage_gate_at_or_after_first_checkpoint"]["minimum_distinct_voters_per_challenge"],
                  "hard_cap_distinct_voters":
                      power["coverage_gate_at_or_after_first_checkpoint"]["hard_cap_distinct_voters"],
                  "reason":
                      "Only the pre-vote catalog stratification descriptor is frozen here; topology counts, candidate model, primary metric weighting, and voter power assumptions are unchanged."
              },
              "firewalls":{
                  "v8_votes_read":False,
                  "candidate_predictions_used":False,
                  "candidate_scores_used":False,
                  "development_catalog_generated":False,
                  "production_change_authorized":False,
              },
              "next_if_green":
                  "Generate one deterministic fresh 40-trade catalog under this metric and the frozen realism contract, then audit it before voting activation."
          }
          CONTRACT.write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")

          PROFILES={
              2:((0.50,0.50),(0.60,0.40),(0.70,0.30)),
              3:((0.34,0.33,0.33),(0.45,0.33,0.22),(0.55,0.30,0.15),(0.65,0.20,0.15)),
              4:((0.25,0.25,0.25,0.25),(0.35,0.28,0.22,0.15),(0.45,0.25,0.18,0.12),(0.55,0.18,0.15,0.12)),
          }
          min_side={2:7000,3:9000,4:11500}

          def nearest(pool,desired,used,limit=18):
              rows=[p for p in pool if p["key"] not in used]
              rows.sort(key=lambda p:(abs(int(p["fv"])-desired),p["key"]))
              return rows[:limit]

          def build_side_pool(size):
              src=[
                  p for p in eligible
                  if size!=2 or int(p["fv"])>=min_2v2
              ]
              out={}
              for anchor in src:
                  for profile in PROFILES[size]:
                      total_goal=int(anchor["fv"])/profile[0]
                      for variant in range(6):
                          chosen=[anchor]
                          used={anchor["key"]}
                          for i in range(1,size):
                              n=nearest(src,total_goal*profile[i],used)
                              if not n:
                                  chosen=[]
                                  break
                              pick=n[(variant+i*3)%len(n)]
                              chosen.append(pick)
                              used.add(pick["key"])
                          if len(chosen)!=size:
                              continue
                          total=sum(int(p["fv"]) for p in chosen)
                          if total<min_side[size]:
                              continue
                          apex=max(int(p["fv"]) for p in chosen)
                          if apex<apex_min:
                              continue
                          shares=[int(p["fv"])/total for p in chosen]
                          if min(shares)<0.10:
                              continue
                          key="|".join(sorted(p["key"] for p in chosen))
                          if key not in out:
                              top=max(shares)
                              out[key]={
                                  "players":chosen,
                                  "sum":total,
                                  "top_share":top,
                                  "apex_excess_share":top-(1.0/size),
                                  "key":key,
                              }
              rows=list(out.values())
              rows.sort(key=lambda x:(x["sum"],x["key"]))
              return rows

          pools={n:build_side_pool(n) for n in (2,3,4)}
          assert all(len(pools[n])>=1000 for n in (2,3,4))

          design={
              "2v2":("A_low","B_low","A_low","B_low","A_moderate","B_moderate","A_high","B_high","A_high","B_high"),
              "2v3":("A_low","B_low","A_moderate","B_moderate","A_high","B_high"),
              "2v4":("A_low","B_low","A_moderate","B_moderate","A_high","B_high"),
              "3v3":("A_low","B_low","A_moderate","B_moderate","A_high","B_high"),
              "3v4":("A_low","B_low","A_moderate","B_moderate","A_high","B_high"),
              "4v4":("A_low","B_low","A_moderate","B_moderate","A_high","B_high"),
          }
          bands=contract["contrast_bands"]

          def overlap(a,b):
              aa={p["key"] for p in a["players"]}
              return any(p["key"] in aa for p in b["players"])

          def lower_bound(rows,target):
              vals=[x["sum"] for x in rows]
              return bisect.bisect_left(vals,target)

          counts={}
          CAP=500
          for topology,cells in design.items():
              a_size,b_size=[int(x) for x in topology.split("v")]
              A=pools[a_size]; B=pools[b_size]
              for cell in sorted(set(cells)):
                  direction,band=cell.split("_",1)
                  lo_band,hi_band=bands[band]
                  n=0
                  for a in A:
                      center=lower_bound(B,a["sum"])
                      lo=max(0,center-350)
                      hi=min(len(B),center+351)
                      for b in B[lo:hi]:
                          if overlap(a,b):
                              continue
                          ratio=min(a["sum"],b["sum"])/max(a["sum"],b["sum"])
                          if ratio<0.92:
                              continue
                          diff=a["apex_excess_share"]-b["apex_excess_share"]
                          if direction=="A" and diff<=0:
                              continue
                          if direction=="B" and diff>=0:
                              continue
                          ad=abs(diff)
                          if ad<lo_band or ad>hi_band:
                              continue
                          n+=1
                          if n>=CAP:
                              break
                      if n>=CAP:
                          break
                  counts[f"{topology}:{cell}"]=n

          assert len(counts)==36
          assert min(counts.values())>=CAP, min(counts.values())

          feasibility={
              "schema_version":1,
              "study_id":prereg["study_id"],
              "stage":"phase1b_catalog_design_feasibility",
              "status":"PASS",
              "generated_at_utc":generated,
              "metric":"apex_excess_share",
              "candidate_pair_count_cap":CAP,
              "side_pool_counts":{str(k):len(v) for k,v in pools.items()},
              "required_unique_design_cells":36,
              "cell_candidate_pair_counts_capped":counts,
              "weakest_cell_capped_candidate_count":min(counts.values()),
              "every_required_cell_has_at_least_500_high_value_candidate_pairs":True,
              "development_catalog_generated":False,
              "v8_votes_read":False,
              "candidate_scores_used":False,
              "production_change_authorized":False,
          }
          FEAS.write_text(json.dumps(feasibility,indent=2,sort_keys=True)+"\n")

          manifest={
              "schema_version":1,
              "study_id":prereg["study_id"],
              "stage":"phase1b_catalog_design_manifest",
              "status":"PASS",
              "generated_at_utc":generated,
              "inputs":{
                  "preregistration_sha256":sha(PREREG),
                  "power_analysis_sha256":sha(POWER),
                  "frozen_player_snapshot_sha256":sha(SNAP),
              },
              "outputs":{
                  "catalog_design_contract_sha256":sha(CONTRACT),
                  "catalog_design_feasibility_sha256":sha(FEAS),
              },
              "development_catalog_generated":False,
              "v8_votes_read":False,
              "production_change_authorized":False,
          }
          MAN.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Package Adjustment V8 — Phase 1B Catalog Design Freeze","",
              "**Decision:** `PASS`","",
              "## Why raw top share was rejected for unequal-size catalog stratification","",
              f"- 2-player minimum top share: **{theoretical_2_min:.4f}**",
              f"- Maximum 4-player top share under the FV>=2500 floor: **{theoretical_4_top:.4f}**",
              f"- Maximum reverse raw-top-share gap: **{raw_reverse_max:.4f}**",
              "- Moderate band begins at **0.0500**, so reverse 2v4 moderate/high cells are structurally impossible without low-value filler.","",
              "## Frozen replacement metric","",
              "`apex_excess_share = top_asset_share - 1 / asset_count`","",
              "This leaves 2v2, 3v3, and 4v4 contrast exactly unchanged while making 2v3, 2v4, and 3v4 concentration comparable across side sizes.","",
              "## Feasibility","",
              f"- 2-player side pool: **{len(pools[2])}**",
              f"- 3-player side pool: **{len(pools[3])}**",
              f"- 4-player side pool: **{len(pools[4])}**",
              f"- Weakest required design cell: **>={min(counts.values())} candidate pairs** (count capped at {CAP}).",
              "- Every required cell passes the high-value realism rules.","",
              "Power plan remains 44 voters / 44 per challenge, hard cap 50.",
              "No catalog or V8 vote was read/generated."
          ]
          MD.write_text("\n".join(lines)+"\n")

          print(json.dumps({
              "decision":"PASS",
              "metric":"apex_excess_share",
              "raw_reverse_2v4_max_gap":raw_reverse_max,
              "weakest_cell_candidate_pairs_capped":min(counts.values()),
              "catalog_generated":False,
              "v8_votes_read":False,
              "power_checkpoint":44
          },indent=2))
          PY

      - name: Validate Phase 1B design freeze
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          c=json.loads((d/"catalog_design_contract_v1.json").read_text())
          f=json.loads((d/"catalog_design_feasibility_v1.json").read_text())
          m=json.loads((d/"catalog_design_manifest_v1.json").read_text())

          assert c["status"]=="FROZEN_PRE_CATALOG_PRE_VOTE"
          assert c["primary_concentration_metric"]["name"]=="apex_excess_share"
          assert c["primary_concentration_metric"]["formula"]=="top_asset_share - (1 / asset_count)"
          assert c["primary_concentration_metric"]["candidate_model_score_not_used"] is True
          assert c["structural_impossibility_diagnostic"]["raw_top_share_reverse_moderate_possible"] is False
          assert c["power_plan"]["unchanged"] is True
          assert c["power_plan"]["first_checkpoint_distinct_voters"]==44
          assert c["firewalls"]["v8_votes_read"] is False
          assert c["firewalls"]["development_catalog_generated"] is False
          assert c["firewalls"]["production_change_authorized"] is False

          assert f["status"]=="PASS"
          assert f["required_unique_design_cells"]==36
          assert len(f["cell_candidate_pair_counts_capped"])==36
          assert f["weakest_cell_capped_candidate_count"]>=500
          assert f["every_required_cell_has_at_least_500_high_value_candidate_pairs"] is True
          assert f["development_catalog_generated"] is False
          assert f["v8_votes_read"] is False

          assert m["status"]=="PASS"
          assert m["development_catalog_generated"] is False
          assert m["v8_votes_read"] is False
          assert m["production_change_authorized"] is False

          assert m["outputs"]["catalog_design_contract_sha256"]==hashlib.sha256(
              (d/"catalog_design_contract_v1.json").read_bytes()
          ).hexdigest()
          assert m["outputs"]["catalog_design_feasibility_sha256"]==hashlib.sha256(
              (d/"catalog_design_feasibility_v1.json").read_bytes()
          ).hexdigest()

          print("PASS: Phase 1B cardinality-adjusted catalog design is frozen and outcome-blind.")
          PY

          python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove exact change scope
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' |
            sort
          )

          expected=(
            research/package-adjustment-v8/catalog_design_contract_v1.json
            research/package-adjustment-v8/catalog_design_feasibility_v1.json
            research/package-adjustment-v8/catalog_design_manifest_v1.json
            research/package-adjustment-v8/catalog_design_v1.md
          )

          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

      - name: Commit frozen Phase 1B design
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-v8/catalog_design_contract_v1.json \
            research/package-adjustment-v8/catalog_design_feasibility_v1.json \
            research/package-adjustment-v8/catalog_design_manifest_v1.json \
            research/package-adjustment-v8/catalog_design_v1.md

          git diff --cached --quiet && {
            echo "ERROR: no Phase 1B changes staged"
            exit 1
          }

          git commit -m "Freeze Package Adjustment V8 catalog design"

          git fetch origin main
          critical=(
            research/package-adjustment-v8/topology_split_preregistration_v1.json
            research/package-adjustment-v8/topology_split_power_analysis_v1.json
            research/package-adjustment-v8/topology_split_power_analysis_manifest_v1.json
            research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json
            scripts/validation/check_package_adjustment_live.py
          )

          for p in "${critical[@]}"; do
            test "$(git rev-parse "$BASE_SHA:$p")" = \
                 "$(git rev-parse "origin/main:$p")" || {
              echo "ERROR: frozen prerequisite changed during Phase 1B: $p"
              exit 1
            }
          done

          git rebase origin/main
          python3 scripts/validation/check_package_adjustment_live.py
          git push origin HEAD:main
