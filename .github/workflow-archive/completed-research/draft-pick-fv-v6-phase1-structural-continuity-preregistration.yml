# PREFLIGHTED_V3: live-schema-all-paths+pinned-shas+yaml+bash+python+fixture-execution
name: Draft Pick FV V6 - Phase 1 Structural Continuity Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard frozen predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          # V5 is closed and becomes prior design evidence only.
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_v5_research_closeout.json)" = \
            "b8ab3046cbe334a9340819af5b81d0262b999778"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_v5_research_closeout_manifest.json)" = \
            "1cf15bb909cee453a81d55df41c20ce513e3bbae"

          # Frozen V3 R1-R4 source catalog and pre-outcome occurrence harvest.
          test "$(git hash-object research/draft-pick-fv-v3/preregistration_v3.json)" = \
            "901939d18a38a87c26d8490b5f1874cdcc103dab"
          test "$(git hash-object research/draft-pick-fv-v3/historical_draft_source_catalog_v3.json)" = \
            "16983840d35739b19de0d4899e4d2335601801a1"
          test "$(git hash-object research/draft-pick-fv-v3/historical_draft_pick_contract_repair_v3.jsonl)" = \
            "c7c86ab4d4d8ed28e297699d5019433867cfd302"
          test "$(git hash-object research/draft-pick-fv-v3/historical_draft_pick_contract_repair_summary_v3.json)" = \
            "a84c3b4a517830f6c85e88762dfb3d804ea40823"
          test "$(git hash-object research/draft-pick-fv-v3/historical_draft_pick_contract_repair_manifest_v3.json)" = \
            "95859bbdc3048365e29034489e3e2f9c5d611bf6"

          # V5.1 pre-outcome identity semantics that corrected the V3 unique-ID gate.
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_bridge_preoutcome_amendment_v5_1.json)" = \
            "7716c8c413ed12dfe2d3bf50c96be709863ab48b"
          test "$(git hash-object research/draft-pick-fv-v5/r1_r2_source_identity_summary_v5_1.json)" = \
            "cc4e8f24fed9b865e70cfea8e253b5c99c8c6ccc"

          # V4 failed source-recovery branch remains closed.
          test "$(git hash-object research/draft-pick-fv-v4/clean_source_recovery_manifest_v4.json)" = \
            "97bc428fad88370e74cd0b6e2878ad4e88ec3100"

          # Guard the deployed Draft Pick production contract semantically,
          # because index.html also contains legitimately refreshed live data.
          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          expected = [
              "PICK_BASE = {",
              "  1: {early:7500, mid:5854, late:5244},",
              "  2: {early:3906, mid:3624, late:3291},",
              "  3: {early:2692, mid:2682, late:2319},",
              "  4: {early:1972, mid:1831, late:1689},",
              "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
              "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
              "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for line in expected:
              assert line in text, f"deployed pick contract drift: {line}"
          print("PASS: deployed PICK_BASE and YEAR_DISCOUNT unchanged.")
          PY

          for p in \
            research/draft-pick-fv-v6/freeze_structural_continuity_preregistration_v6.py \
            research/draft-pick-fv-v6/structural_continuity_preregistration_v6.json \
            research/draft-pick-fv-v6/structural_continuity_preregistration_v6.md \
            research/draft-pick-fv-v6/structural_continuity_preregistration_manifest_v6.json
          do
            test ! -e "$p"
          done

      - name: Preflight predecessor JSON schema contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          files = {
              "v5_close": ROOT / "research/draft-pick-fv-v5/r1_r2_v5_research_closeout.json",
              "v5_close_m": ROOT / "research/draft-pick-fv-v5/r1_r2_v5_research_closeout_manifest.json",
              "v3_pre": ROOT / "research/draft-pick-fv-v3/preregistration_v3.json",
              "v3_catalog": ROOT / "research/draft-pick-fv-v3/historical_draft_source_catalog_v3.json",
              "v3_repair": ROOT / "research/draft-pick-fv-v3/historical_draft_pick_contract_repair_summary_v3.json",
              "v3_repair_m": ROOT / "research/draft-pick-fv-v3/historical_draft_pick_contract_repair_manifest_v3.json",
              "v5_amend": ROOT / "research/draft-pick-fv-v5/r1_r2_bridge_preoutcome_amendment_v5_1.json",
              "v5_ident": ROOT / "research/draft-pick-fv-v5/r1_r2_source_identity_summary_v5_1.json",
              "v4_close": ROOT / "research/draft-pick-fv-v4/clean_source_recovery_manifest_v4.json",
          }

          data = {}
          for name, path in files.items():
              try:
                  data[name] = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"PRECHECK JSON load failed for {name}: {path}: {exc}")

          required_paths = {
              "v5_close": [
                  ("status",),
                  ("selected_candidate",),
                  ("v5_refit_allowed",),
                  ("final_decision",),
                  ("candidate_summary", "C2_R1_R2_ROUND_RESCALE", "validation_improvement_vs_C0"),
                  ("candidate_summary", "C2_R1_R2_ROUND_RESCALE", "failed_eligibility_gates"),
                  ("candidate_summary", "C3_R1_R2_LOW_PARAMETER_TIER_CURVE", "validation_improvement_vs_C0"),
                  ("structural_violations", "C2_R1_R2_ROUND_RESCALE"),
              ],
              "v5_close_m": [
                  ("research_complete",),
              ],
              "v3_pre": [
                  ("frozen_replacement_ranks",),
                  ("frozen_scale_bridge", "position_weight"),
              ],
              "v3_catalog": [
                  ("counts_by_year",),
                  ("contains_player_outcomes",),
                  ("contains_market_or_ktc_values",),
              ],
              "v3_repair": [
                  ("historical_player_outcomes_read",),
              ],
              "v3_repair_m": [
                  ("historical_player_outcomes_read",),
                  ("source_catalog_gate_pass",),
              ],
              "v5_amend": [
                  ("historical_player_outcomes_read",),
              ],
              "v5_ident": [
                  ("identity_gate", "pick_occurrence_coverage"),
              ],
              "v4_close": [
                  ("decision",),
              ],
          }

          def get_path(obj, parts):
              cur = obj
              for part in parts:
                  if not isinstance(cur, dict) or part not in cur:
                      raise SystemExit(
                          "PRECHECK missing JSON path: "
                          + ".".join(parts)
                      )
                  cur = cur[part]
              return cur

          for name, paths in required_paths.items():
              for parts in paths:
                  get_path(data[name], parts)

          counts = get_path(data["v3_catalog"], ("counts_by_year",))
          expected_years = {"2018", "2019", "2020", "2021", "2022", "2023"}
          if set(counts) != expected_years:
              raise SystemExit(
                  f"PRECHECK unexpected V3 catalog years: {sorted(counts)}"
              )
          r1_r4_total = sum(int(row["primary_r1_r4"]) for row in counts.values())
          assert r1_r4_total == 213

          assert data["v5_close"]["status"] == "V5_RESEARCH_CLOSED_NO_ELIGIBLE_CANDIDATE"
          assert data["v5_close"]["selected_candidate"] is None
          assert data["v5_close"]["v5_refit_allowed"] is False
          assert data["v5_close_m"]["research_complete"] is True
          assert data["v3_catalog"]["contains_player_outcomes"] is False
          assert data["v3_catalog"]["contains_market_or_ktc_values"] is False
          assert data["v3_repair"]["historical_player_outcomes_read"] is False
          assert data["v3_repair_m"]["historical_player_outcomes_read"] is False
          assert data["v3_repair_m"]["source_catalog_gate_pass"] is True
          assert data["v5_amend"]["historical_player_outcomes_read"] is False
          assert data["v5_ident"]["identity_gate"]["pick_occurrence_coverage"] >= 0.95
          assert data["v4_close"]["decision"] == "STOP_V4_CLEAN_SOURCE_RECOVERY_INSUFFICIENT"

          print("PASS: every predecessor JSON path consumed by the V6 freezer exists.")
          print(f"PASS: frozen V3 R1-R4 league total = {r1_r4_total}.")
          print("PASS: predecessor semantic contract matches V6 Phase 1 assumptions.")
          PY

      - name: Write preregistration freezer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-pick-fv-v6

          cat > research/draft-pick-fv-v6/freeze_structural_continuity_preregistration_v6.py <<'PY'
          #!/usr/bin/env python3
          """Freeze Draft Pick FV V6 structural-continuity preregistration.

          This stage is design-only. It reads predecessor manifests/catalog
          metadata but never reads historical NFL outcome rows, current market
          values, package-vote outcomes, or 2024 player outcomes.
          """

          from __future__ import annotations

          import hashlib
          import json
          import math
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          ROOT = Path.cwd()
          D = ROOT / "research" / "draft-pick-fv-v6"
          V3 = ROOT / "research" / "draft-pick-fv-v3"
          V4 = ROOT / "research" / "draft-pick-fv-v4"
          V5 = ROOT / "research" / "draft-pick-fv-v5"

          OUT_JSON = D / "structural_continuity_preregistration_v6.json"
          OUT_MD = D / "structural_continuity_preregistration_v6.md"
          OUT_MANIFEST = (
              D / "structural_continuity_preregistration_manifest_v6.json"
          )

          PICK_BASE = {
              "1": {"early": 7500.0, "mid": 5854.0, "late": 5244.0},
              "2": {"early": 3906.0, "mid": 3624.0, "late": 3291.0},
              "3": {"early": 2692.0, "mid": 2682.0, "late": 2319.0},
              "4": {"early": 1972.0, "mid": 1831.0, "late": 1689.0},
              "5": {"early": 1414.0, "mid": 1250.0, "late": 1118.0},
              "6": {"early": 1014.0, "mid": 853.0, "late": 740.0},
          }
          YEAR_DISCOUNT = {"2027": 1.0, "2028": 0.85, "2029": 0.72}
          CELLS = [
              f"r{r}_{tier}"
              for r in range(1, 5)
              for tier in ("early", "mid", "late")
          ]

          def read_json(path: Path) -> dict[str, Any]:
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_blob(path: Path) -> str:
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def git_head() -> str:
              return subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip()

          def main() -> None:
              if any(p.exists() for p in (OUT_JSON, OUT_MD, OUT_MANIFEST)):
                  raise RuntimeError("V6 preregistration output already exists")

              v5_close = read_json(
                  V5 / "r1_r2_v5_research_closeout.json"
              )
              v5_close_m = read_json(
                  V5 / "r1_r2_v5_research_closeout_manifest.json"
              )
              v3_pre = read_json(V3 / "preregistration_v3.json")
              v3_catalog = read_json(
                  V3 / "historical_draft_source_catalog_v3.json"
              )
              v3_repair = read_json(
                  V3 / "historical_draft_pick_contract_repair_summary_v3.json"
              )
              v3_repair_m = read_json(
                  V3 / "historical_draft_pick_contract_repair_manifest_v3.json"
              )
              v5_amend = read_json(
                  V5 / "r1_r2_bridge_preoutcome_amendment_v5_1.json"
              )
              v5_ident = read_json(
                  V5 / "r1_r2_source_identity_summary_v5_1.json"
              )
              v4_close = read_json(
                  V4 / "clean_source_recovery_manifest_v4.json"
              )

              assert v5_close["status"] == \
                  "V5_RESEARCH_CLOSED_NO_ELIGIBLE_CANDIDATE"
              assert v5_close["selected_candidate"] is None
              assert v5_close["v5_refit_allowed"] is False
              assert v5_close_m["research_complete"] is True
              assert v4_close["decision"] == \
                  "STOP_V4_CLEAN_SOURCE_RECOVERY_INSUFFICIENT"

              r1_r4_league_n = sum(
                  int(row["primary_r1_r4"])
                  for row in v3_catalog["counts_by_year"].values()
              )
              assert r1_r4_league_n == 213
              assert v3_catalog["contains_player_outcomes"] is False
              assert v3_catalog["contains_market_or_ktc_values"] is False
              assert v3_repair["historical_player_outcomes_read"] is False
              assert v3_repair_m["historical_player_outcomes_read"] is False
              assert v3_repair_m["source_catalog_gate_pass"] is True

              # V5.1 establishes that occurrence-level identity/retention,
              # not unique-player coverage, is the operational source gate.
              assert v5_ident["identity_gate"]["pick_occurrence_coverage"] >= 0.95
              assert v5_amend["historical_player_outcomes_read"] is False

              generated = datetime.now(timezone.utc).isoformat()

              prereg = {
                  "schema_version": 1,
                  "study_id": "draft-pick-fv-v6-r1-r4-structural-continuity",
                  "stage": "phase1_preregistration",
                  "status": "FROZEN_PRE_V6_R3_R4_OUTCOME_ACCESS",
                  "generated_at_utc": generated,
                  "preregistered_at_head_sha": git_head(),
                  "research_only": True,
                  "production_change_authorized": False,
                  "question": (
                      "Can a continuous R1-R4 Draft Pick Fundamental Value "
                      "curve materially improve realized player-equivalent "
                      "accuracy while preserving monotone continuity into the "
                      "frozen R5-R6 production table?"
                  ),
                  "reason_for_v6": {
                      "v5_final_decision":
                          v5_close["final_decision"],
                      "v5_c2_validation_improvement_vs_C0":
                          v5_close["candidate_summary"][
                              "C2_R1_R2_ROUND_RESCALE"
                          ]["validation_improvement_vs_C0"],
                      "v5_c2_only_failed_gate":
                          v5_close["candidate_summary"][
                              "C2_R1_R2_ROUND_RESCALE"
                          ]["failed_eligibility_gates"],
                      "v5_c2_boundary_violation":
                          v5_close["structural_violations"][
                              "C2_R1_R2_ROUND_RESCALE"
                          ],
                      "v5_c3_validation_improvement_vs_C0":
                          v5_close["candidate_summary"][
                              "C3_R1_R2_LOW_PARAMETER_TIER_CURVE"
                          ]["validation_improvement_vs_C0"],
                      "interpretation": (
                          "V5 demonstrated a large scale mismatch but could "
                          "not alter R1-R2 without creating an R2-to-R3 "
                          "upward discontinuity. V6 is a new study that "
                          "expands the fitted scope through R4 rather than "
                          "repairing V5 after validation."
                      ),
                  },
                  "evidence_status": {
                      "2018_2023_r1_r2_outcomes_previously_exposed":
                          True,
                      "2022_2023_are_spent_validation_classes":
                          True,
                      "2018_2023_usage_in_v6":
                          "development_and_cross_validation_only",
                      "v6_prereg_workflow_reads_r3_r4_nfl_outcomes":
                          False,
                      "v6_prereg_workflow_reads_2024_nfl_outcomes":
                          False,
                      "2024_primary_h3_is_future_clean_confirmation":
                          True,
                      "no_claim_that_2018_2023_are_fresh_holdout":
                          True,
                  },
                  "frozen_deployed_baseline": {
                      "candidate_id": "C0_DEPLOYED",
                      "pick_base_2027": PICK_BASE,
                      "year_discount_context_only": YEAR_DISCOUNT,
                      "r5_r6_fit_status": "frozen_not_fit",
                      "r5_boundary_anchor":
                          {"r5_early": PICK_BASE["5"]["early"]},
                  },
                  "source_population": {
                      "development_years":
                          [2018, 2019, 2020, 2021, 2022, 2023],
                      "provider": "MyFantasyLeague",
                      "format": "12-team Superflex/2QB dynasty rookie drafts",
                      "primary_scope": "R1-R4",
                      "frozen_v3_source_catalog_reused": True,
                      "frozen_v3_primary_r1_r4_league_n": r1_r4_league_n,
                      "counts_by_year": {
                          y: v["primary_r1_r4"]
                          for y, v in v3_catalog["counts_by_year"].items()
                      },
                      "development_source_rule": (
                          "Reuse the exact frozen V3 primary_r1_r4 league "
                          "catalog and pre-outcome harvested occurrence file. "
                          "Do not conduct a new 2018-2023 league search."
                      ),
                      "development_occurrence_source":
                          "historical_draft_pick_contract_repair_v3.jsonl",
                      "development_occurrence_source_git_blob":
                          git_blob(
                              V3 /
                              "historical_draft_pick_contract_repair_v3.jsonl"
                          ),
                      "2024_holdout_source": {
                          "provider": "MyFantasyLeague",
                          "source_search_allowed_after_prereg": True,
                          "same_league_eligibility_rules_as_v3_primary_r1_r4":
                              True,
                          "minimum_eligible_leagues": 19,
                          "minimum_reason": (
                              "19 is the smallest frozen historical "
                              "primary_r1_r4 class count (2018); threshold "
                              "is fixed before 2024 outcomes are read."
                          ),
                          "must_be_frozen_before_candidate_fit": True,
                          "alternate_provider_after_fit_or_holdout_results":
                              False,
                      },
                  },
                  "source_and_identity_contract": {
                      "invalid_occurrence_rule": (
                          "Omit and flag invalid/nonplayer occurrences; do not "
                          "requalify or discard an otherwise frozen league."
                      ),
                      "duplicate_player_same_league_rule": (
                          "Retain first valid occurrence, exclude later "
                          "duplicate occurrence, flag anomaly; no whole-league "
                          "removal."
                      ),
                      "operational_identity_denominator":
                          "retained pick occurrences",
                      "unique_player_identity_coverage":
                          "diagnostic_only_not_gate",
                      "minimum_occurrence_identity_coverage": 0.95,
                      "minimum_year_cell_retention": 0.95,
                      "minimum_year_cell_identity_coverage": 0.95,
                      "stable_identity_priority": [
                          "existing exact MFL-to-GSIS/Sleeper crosswalk",
                          "existing FantasyPros-to-Sleeper crosswalk",
                          "nflverse stable ID corroboration",
                          (
                              "unambiguous normalized name + frozen "
                              "draft-era position + draft class"
                          ),
                      ],
                      "manual_post_outcome_identity_adjudication_allowed":
                          False,
                      "v5_1_occurrence_semantics_inherited": True,
                  },
                  "historical_outcome_contract": {
                      "provider": "Sleeper historical weekly NFL stats",
                      "scoring_logic": (
                          "reviewed league scoring from "
                          "historical_weekly_points_pipeline.py"
                      ),
                      "weeks": list(range(1, 19)),
                      "availability_gate": (
                          "Every development class must have nonempty H1-H3 "
                          "season data before fitting. A missing required "
                          "season excludes the class before fit and forces "
                          "the six-class feasibility gate to be re-evaluated."
                      ),
                      "replacement_pool_position_lineage_hardening": {
                          "target_rookie_position": (
                              "prefer frozen draft-era source position"
                          ),
                          "full_nfl_replacement_pool_position": (
                              "season-appropriate nflverse roster position "
                              "mapped by stable player ID; do not classify "
                              "historical replacement pools from a current "
                              "2026 Sleeper position snapshot"
                          ),
                          "reason": (
                              "V5 audit found current-position lineage could "
                              "reclassify historical IDP replacement pools."
                          ),
                      },
                      "O1_shape": {
                          "name":
                              "three_year_replacement_adjusted_football_utility",
                          "annual_surplus": (
                              "max(0, season_total - "
                              "replacement_ppg*scheduled_games)"
                          ),
                          "H3": "sum years 1-3",
                          "use": "shape_robustness_only_not_FV",
                      },
                      "O2_scale": {
                          "name": "three_year_player_equivalent_fv",
                          "base_scale": 5500.0,
                          "realized_prod_mult": (
                              "0 if zero games; otherwise "
                              "clamp(-0.10 + 0.75 * "
                              "(season_total/(replacement_ppg*scheduled_games)), "
                              "0.15, 1.55)"
                          ),
                          "age_as_of": "September 1 of evaluated season",
                          "role": "Starter",
                          "aggregation":
                              "arithmetic mean of annual equivalents",
                      },
                      "frozen_replacement_ranks":
                          v3_pre["frozen_replacement_ranks"],
                      "frozen_position_weights":
                          v3_pre["frozen_scale_bridge"]["position_weight"],
                      "scheduled_games":
                          {"through_2020": 16, "2021_and_later": 17},
                  },
                  "fit_weighting": {
                      "draft_class_weight":
                          "each 2018-2023 class contributes equal total weight",
                      "cell_weight":
                          "12 R1-R4 production cells receive equal macro weight",
                      "league_weight": (
                          "within class and cell, frozen eligible leagues "
                          "receive equal total weight"
                      ),
                      "occurrence_weight": (
                          "retained occurrences divide their league-cell "
                          "weight equally"
                      ),
                      "player_independence": (
                          "repeated league selections of the same rookie are "
                          "not independent; inferential resampling clusters by "
                          "stable player identity within draft class"
                      ),
                  },
                  "candidate_families": {
                      "C0_DEPLOYED": {
                          "eligible": False,
                          "role": "baseline_only_never_refit",
                          "definition":
                              "exact deployed R1-R6 PICK_BASE",
                          "effective_parameters": 0,
                      },
                      "C1_ROUNDWISE_RESCALE_R1_R4": {
                          "eligible": True,
                          "effective_parameters": 4,
                          "definition": (
                              "For rounds 1-4, multiply every deployed tier "
                              "within round r by k_r. R5-R6 remain exact."
                          ),
                          "bounds": {
                              "k1": [0.15, 1.25],
                              "k2": [0.15, 1.25],
                              "k3": [0.15, 1.25],
                              "k4": [0.15, 1.25],
                          },
                          "optimizer": (
                              "exact weighted-LAD linear program using "
                              "scipy.optimize.linprog(method='highs')"
                          ),
                          "structural_constraints": [
                              "all 18 production cells positive",
                              (
                                  "all 18 cells non-increasing in exact "
                                  "round/tier slot order"
                              ),
                              "R5-R6 unchanged",
