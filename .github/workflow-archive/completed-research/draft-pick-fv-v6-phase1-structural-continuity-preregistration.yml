      - name: Prove prereg freezer has no outcome or network path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "research/draft-pick-fv-v6/"
              "freeze_structural_continuity_preregistration_v6.py"
          )
          text = p.read_text(encoding="utf-8")

          # Syntax-check without writing __pycache__/pyc files. A normal
          # py_compile invocation would pollute the change-scope gate.
          compile(text, str(p), "exec")

          forbidden = [
              "requests.",
              "urllib.",
              "http://",
              "https://",
              "r1_r2_development_outcomes_v5_1",
              "r1_r2_locked_validation_outcomes_v5_1",
              "api.sleeper",
              "stats/nfl",
              "package-adjustment-votes",
              "prospective-trade-evidence",
          ]
          for token in forbidden:
              assert token not in text, \
                  f"forbidden preregistration token: {token}"

          print(
              "PASS: V6 Phase 1 freezer has no historical-outcome, "
              "holdout-outcome, network, market, or package-vote path."
          )
          PY

