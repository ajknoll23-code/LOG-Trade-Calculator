      - name: Validate frozen V6 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/draft-pick-fv-v6")
          x = json.loads(
              (d / "structural_continuity_preregistration_v6.json")
              .read_text(encoding="utf-8")
          )
          m = json.loads(
              (d / "structural_continuity_preregistration_manifest_v6.json")
              .read_text(encoding="utf-8")
          )

          assert x["status"] == "FROZEN_PRE_V6_R3_R4_OUTCOME_ACCESS"
          assert x["production_change_authorized"] is False
          assert x["source_population"]["frozen_v3_primary_r1_r4_league_n"] == 213
          assert x["evidence_status"]["2022_2023_are_spent_validation_classes"] is True
          assert x["evidence_status"]["2024_primary_h3_is_future_clean_confirmation"] is True
          assert x["temporal_holdout_2024"]["outcomes_sealed_until_final_candidate_frozen"] is True
          assert x["frozen_deployed_baseline"]["r5_r6_fit_status"] == "frozen_not_fit"
          assert x["frozen_deployed_baseline"]["r5_boundary_anchor"]["r5_early"] == 1414.0
          assert x["candidate_families"]["C1_ROUNDWISE_RESCALE_R1_R4"]["eligible"] is True
          assert x["candidate_families"]["C2_ANCHORED_ADDITIVE_ROUND_TIER_CURVE"]["eligible"] is True
          assert x["candidate_families"]["C3_SHRUNK_MONOTONE_SLOT_CURVE_R1_R4"]["eligible"] is True
          assert x["candidate_families"]["D1_BOUNDARY_FREE_ROUNDWISE_DIAGNOSTIC"]["eligible"] is False
          assert x["next_stage"] == \
              "draft-pick-fv-v6-phase2-r1-r4-source-identity-freeze"

          assert m["historical_r3_r4_outcomes_read"] is False
          assert m["holdout_2024_outcomes_read"] is False
          assert m["candidate_fit_performed"] is False
          assert m["candidate_selection_performed"] is False
          assert m["production_change_authorized"] is False

