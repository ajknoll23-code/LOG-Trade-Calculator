name: Draft Pick FV V10 - Phase 3 Production Deployment V2

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: draft-pick-fv-v10-phase3-production-deployment-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture deployment base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact V10 Phase 2.5 frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          expected={
              D/"v10_phase1_frozen_production_candidate.json":
                  "261989459b788ff8f05e5c66607791fcbcabe2ec31c3c08be27b8e4b51bf54c9",
              D/"v10_phase2_production_candidate_audit.json":
                  "568b4defec4fe947b41e91b27258ba4bb18972f56ed1f0715e2365aeb0019d90",
              D/"v10_phase2_5_enhancement_contract.json":
                  "c8686b8604917c1b0c5c837e43f38665ccf0deb7f6c5b677401ce469a1728047",
              D/"v10_phase2_5_enhancement_result.json":
                  "2aa66bb98ddc82e8e88522b55a5f7905fce171fdd51b1bed027b60ac9d27ea09",
              D/"v10_phase2_5_frozen_production_candidate.json":
                  "af067573f029ed96efd45bf6c5a7598f60db6c9eaf3aeab681bc433cf6dbd3d5",
              D/"v10_phase2_5_ktc_2027_2029_screenshot_freeze.json":
                  "c54ada3d6b52936e1fa22a7ebd52b195b59f26b81a156cfa4788d7172e61f497",
              D/"v10_phase2_5_runtime_snapshot.json":
                  "10abcc7b851cfb86bdd82811c0df08861e35b499e0bc6db21f9a735db3484666",
              D/"v10_todo.json":
                  "191b002d581f10a1657cd0bf5d963f5cf0bbf7852e6a4b5ef0da110afcd58680",
          }
          for p,want in expected.items():
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want,(str(p),want,got)

          p2=json.loads((D/"v10_phase2_production_candidate_audit.json").read_text())
          e=json.loads((D/"v10_phase2_5_enhancement_result.json").read_text())
          c=json.loads((D/"v10_phase2_5_frozen_production_candidate.json").read_text())
          m=json.loads((D/"v10_phase2_5_manifest.json").read_text())
          todo=json.loads((D/"v10_todo.json").read_text())

          assert p2["decision"]=="PASS_V10_PHASE2_AUTHORIZE_PHASE3_PRODUCTION_DEPLOYMENT"
          assert p2["full_repository_regression_pass"] is True

          assert e["decision"]=="PASS_V10_PHASE2_5_AUTHORIZE_UPDATED_PHASE3_ENGINEERING_DEPLOYMENT"
          assert e["tail_v2"]["promoted"] is True
          assert all(e["tail_v2"]["gates"].values())
          assert e["year_discount_v2"]["all_gates_pass"] is True
          assert all(e["year_discount_v2"]["gates"].values())
          assert e["production_change_authorized"] is False

          assert c["candidate_id"]=="V10_C1_PLUS_M1_PLUS_MT2_PLUS_YD2"
          assert c["tail_v2_promoted"] is True
          assert c["year_discount"]=={
              "2027":1.0,
              "2028":0.8828875558859378,
              "2029":0.8069214853433114,
          }
          assert c["fallback_discount"]==0.6
          assert c["production_change_authorized"] is False

          assert m["decision"]=="PASS_V10_PHASE2_5_AUTHORIZE_UPDATED_PHASE3_ENGINEERING_DEPLOYMENT"
          assert m["tail_v2_promoted"] is True
          assert m["year_discount_v2_pass"] is True
          assert m["uncertainty_propagated"] is True
          assert m["exact_slot_todo_recorded"] is True
          assert m["runtime_pick_outputs_checked"]==72
          assert m["package_adjustment_regression_pass"] is True
          assert m["free_agent_valuation_parity_pass"] is True
          assert m["full_repository_regression_pass"] is True
          assert m["production_restored_byte_for_byte"] is True

          assert todo["items"][0]["id"]=="exact-rookie-slot-curve-v1"
          assert todo["items"][0]["status"]=="TODO_POST_V10"

          print("PASS: exact frozen Phase 2.5 V10 candidate verified.")
          PY

      - name: Guard exact pre-V10 production baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected_pick=[
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]
          pick_pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)

          for name in ("index.html","free-agent-board.html"):
              t=Path(name).read_text(encoding="utf-8")
              p=pick_pat.search(t); assert p,name
              vals=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",p.group(0))))
              assert vals==list(map(float,expected_pick)),(name,vals)

              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in t
              assert "const disc = YEAR_DISCOUNT[year] ?? 0.6;" in t
              assert "return Math.round(base * disc);" in t

          assert not Path("model/releases/draft-pick-fv-v10").exists()
          print("PASS: production remains exact pre-V10 baseline.")
          PY

      - name: Apply exact final V10 constants region and create rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          R=Path("model/releases/draft-pick-fv-v10")
          R.mkdir(parents=True,exist_ok=False)

          c=json.loads((D/"v10_phase2_5_frozen_production_candidate.json").read_text())
          v=c["pick_base_values"]
          yd=c["year_discount"]

          def fmt(x):
              s=f"{float(x):.10f}".rstrip("0").rstrip(".")
              return s if "." in s else s+".0"

          pick_comment=(
              "/* Draft Pick FV V10 production curve. R1-R4 shape comes from the frozen "
              "2018-2023 class-balanced historical rookie expected-value model, then receives "
              "one global 2027 KTC Crowd+Trades market-scale multiplier; no round- or tier-specific "
              "KTC fit is allowed. R5-R6 use the promoted MT2 late-round log-linear decay estimated "
              "from all six 2027 KTC R2->R3 and R3->R4 transitions across early/mid/late tiers. "
              "These are therefore modeled/extrapolated late-round values, not copied KTC R5-R6 values. */"
          )
          pick_block="\n".join([
              "const PICK_BASE = {",
              f"  1: {{early:{fmt(v['r1_early'])}, mid:{fmt(v['r1_mid'])}, late:{fmt(v['r1_late'])}}},",
              f"  2: {{early:{fmt(v['r2_early'])}, mid:{fmt(v['r2_mid'])}, late:{fmt(v['r2_late'])}}},",
              f"  3: {{early:{fmt(v['r3_early'])}, mid:{fmt(v['r3_mid'])}, late:{fmt(v['r3_late'])}}},",
              f"  4: {{early:{fmt(v['r4_early'])}, mid:{fmt(v['r4_mid'])}, late:{fmt(v['r4_late'])}}},",
              f"  5: {{early:{fmt(v['r5_early'])}, mid:{fmt(v['r5_mid'])}, late:{fmt(v['r5_late'])}}},",
              f"  6: {{early:{fmt(v['r6_early'])}, mid:{fmt(v['r6_mid'])}, late:{fmt(v['r6_late'])}}},",
              "};",
          ])

          yd_comment=(
              "/* V10 YEAR_DISCOUNT V2: 2028 and 2029 are direct market factors estimated as "
              "the geometric mean of all 12 R1-R4 KTC Crowd+Trades future-year / 2027 ratios. "
              "Tradesourced and Crowdsourced were retained as sensitivity bounds. The pre-existing "
              "0.6 fallback for years outside this table is unchanged. */"
          )
          yd_block=(
              "const YEAR_DISCOUNT = { "
              f"'2027':1.0, '2028':{fmt(yd['2028'])}, '2029':{fmt(yd['2029'])} "
              "};"
          )

          new_region=pick_comment+"\n"+pick_block+"\n"+yd_comment+"\n"+yd_block

          old_region_pat=re.compile(
              r"/\* Pick values benchmarked against KeepTradeCut's real Superflex crowdsourced.*?\*/\n"
              r"const PICK_BASE = \{.*?\n\};\n"
              r"/\* 2027→2028 discount benchmarked from real KTC data.*?\*/\n"
              r"const YEAR_DISCOUNT = \{[^\n]+\};",
              re.S,
          )

          originals={}
          pre_sha={}
          pre_blobs={}
          for name in ("index.html","free-agent-board.html"):
              p=Path(name)
              t=p.read_text(encoding="utf-8")
              matches=list(old_region_pat.finditer(t))
              assert len(matches)==1,(name,len(matches))
              m=matches[0]
              originals[name]=m.group(0)
              pre_sha[name]=hashlib.sha256(p.read_bytes()).hexdigest()
              pre_blobs[name]=subprocess.check_output(["git","hash-object",name],text=True).strip()
              p.write_text(t[:m.start()]+new_region+t[m.end():],encoding="utf-8")

          rollback={
              "schema_version":1,
              "release_id":"draft-pick-fv-v10-production-release-v2",
              "created_at_utc":datetime.now(timezone.utc).isoformat(),
              "source_commit_before_production_mutation":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "production_files":["index.html","free-agent-board.html"],
              "pre_deployment_git_blobs":pre_blobs,
              "pre_deployment_sha256":pre_sha,
              "pre_deployment_constants_regions":originals,
              "rollback_instruction":"Restore the exact pre_deployment_constants_regions. Do not alter player valuation, Package Adjustment, Team Utility, or trade-desk-preview.html.",
          }
          (R/"rollback.json").write_text(json.dumps(rollback,indent=2,sort_keys=True)+"\n")

          result=json.loads((D/"v10_phase2_5_enhancement_result.json").read_text())
          release={
              "schema_version":1,
              "release_id":"draft-pick-fv-v10-production-release-v2",
              "candidate_id":c["candidate_id"],
              "methodological_status":"HISTORICAL_EXPECTED_VALUE_CORE_PLUS_ONE_PARAMETER_MARKET_SCALE_PLUS_PROMOTED_LATE_ROUND_TAIL_PLUS_DIRECT_MARKET_YEAR_DISCOUNT",
              "pick_base_values":v,
              "year_discount":yd,
              "fallback_discount":0.6,
              "global_market_multiplier":2.24417411952795,
              "tail_v2":{
                  "candidate_id":result["tail_v2"]["candidate_id"],
                  "combined_decay":result["tail_v2"]["combined_decay"],
                  "tradesourced_decay":result["tail_v2"]["tradesourced_decay"],
                  "crowdsourced_decay":result["tail_v2"]["crowdsourced_decay"],
                  "promoted":result["tail_v2"]["promoted"],
              },
              "year_discount_v2":{
                  "candidate_id":result["year_discount_v2"]["candidate_id"],
                  "factors":result["year_discount_v2"]["factors"],
                  "all_gates_pass":result["year_discount_v2"]["all_gates_pass"],
              },
              "uncertainty":{
                  "artifact":"research/draft-pick-fv-v10/v10_phase2_5_enhancement_result.json",
                  "historical_bootstrap_propagated":True,
                  "market_source_sensitivity_reported_separately":True,
                  "uncertainty_changes_point_estimate":False,
              },
              "exact_slot_followup":{
                  "todo_artifact":"research/draft-pick-fv-v10/v10_todo.json",
                  "status":"TODO_POST_V10",
              },
              "production_behavior_changed":["PICK_BASE","YEAR_DISCOUNT"],
              "production_behavior_unchanged":[
                  "pickValue fallback discount",
                  "pickValue rounding logic",
                  "player valuation",
                  "Package Adjustment",
                  "Team Utility"
              ],
              "intentionally_not_modified":["trade-desk-preview.html"],
              "production_change_authorized":True,
          }
          (R/"release.json").write_text(json.dumps(release,indent=2,sort_keys=True)+"\n")

          (R/"README.md").write_text(
              "# Draft Pick FV V10 Production Release V2\n\n"
              "Deploys the frozen V10 Phase 2.5 PICK_BASE and YEAR_DISCOUNT V2 after the green shadow engineering audit.\n\n"
              "R1-R4 derive from the historical expected-value core plus one global market-scale bridge. "
              "R5-R6 use the promoted MT2 late-round decay. 2028/2029 YEAR_DISCOUNT values are direct "
              "12-cell KTC Crowd+Trades geometric market factors. The 0.6 fallback, player valuation, "
              "Package Adjustment, Team Utility, and trade-desk-preview.html remain unchanged.\n"
          )
          print("PASS: exact final V10 constants region applied and rollback frozen.")
          PY

      - name: Prove exact production mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          R=Path("model/releases/draft-pick-fv-v10")
          rollback=json.loads((R/"rollback.json").read_text())
          c=json.loads((D/"v10_phase2_5_frozen_production_candidate.json").read_text())

          new_region_pat=re.compile(
              r"/\* Draft Pick FV V10 production curve\..*?\*/\n"
              r"const PICK_BASE = \{.*?\n\};\n"
              r"/\* V10 YEAR_DISCOUNT V2:.*?\*/\n"
              r"const YEAR_DISCOUNT = \{[^\n]+\};",
              re.S,
          )
          pick_pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          yd_pat=re.compile(r"const YEAR_DISCOUNT = \{[^\n]+\};")

          expected_cells=[
              "r1_early","r1_mid","r1_late",
              "r2_early","r2_mid","r2_late",
              "r3_early","r3_mid","r3_late",
              "r4_early","r4_mid","r4_late",
              "r5_early","r5_mid","r5_late",
              "r6_early","r6_mid","r6_late",
          ]
          expected=[float(c["pick_base_values"][k]) for k in expected_cells]

          regions=[]
          for name in ("index.html","free-agent-board.html"):
              current=Path(name).read_text(encoding="utf-8")
              m=new_region_pat.search(current); assert m,name
              regions.append(m.group(0))

              p=pick_pat.search(current); assert p
              vals=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",p.group(0))))
              assert len(vals)==18
              assert all(abs(a-b)<=1e-9 for a,b in zip(vals,expected)),(name,vals,expected)

              ym=yd_pat.search(current); assert ym
              assert "'2027':1.0" in ym.group(0)
              assert "'2028':0.8828875559" in ym.group(0)
              assert "'2029':0.8069214853" in ym.group(0)
              assert "const disc = YEAR_DISCOUNT[year] ?? 0.6;" in current
              assert "return Math.round(base * disc);" in current

              reconstructed=(
                  current[:m.start()]
                  +rollback["pre_deployment_constants_regions"][name]
                  +current[m.end():]
              )
              base=subprocess.check_output(["git","show",f"HEAD:{name}"],text=True)
              assert reconstructed==base,f"non-V10-constants drift: {name}"

          assert regions[0]==regions[1]
          print("PASS: only exact V10 PICK_BASE + YEAR_DISCOUNT constants region changed.")
          PY

      - name: Validate all 72 final production runtime outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,re
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          c=json.loads((D/"v10_phase2_5_frozen_production_candidate.json").read_text())
          expected=json.loads((D/"v10_phase2_5_runtime_snapshot.json").read_text())
          yd=c["year_discount"]
          pick_pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)

          factors={
              "2026":0.6,
              "2027":1.0,
              "2028":float(yd["2028"]),
              "2029":float(yd["2029"]),
          }

          def js_round(x):
              return math.floor(float(x)+0.5)

          def snapshot(name):
              t=Path(name).read_text(encoding="utf-8")
              p=pick_pat.search(t); assert p
              nums=list(map(float,re.findall(r"(?:early|mid|late):\s*([0-9.]+)",p.group(0))))
              assert len(nums)==18
              out={}
              for year,disc in factors.items():
                  out[year]={}
                  for r in range(1,7):
                      i=(r-1)*3
                      out[year][str(r)]={
                          "early":js_round(nums[i]*disc),
                          "mid":js_round(nums[i+1]*disc),
                          "late":js_round(nums[i+2]*disc),
                      }
              return out

          a=snapshot("index.html")
          b=snapshot("free-agent-board.html")
          assert a==b==expected
          assert sum(len(x) for rounds in a.values() for x in rounds.values())==72
          print("PASS: all 72 final production runtime outputs match frozen Phase 2.5 snapshot.")
          PY

      - name: Run Package Adjustment regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: Package Adjustment regression green."

      - name: Run free-agent valuation parity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          echo "PASS: free-agent valuation parity green."

      - name: Run full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"
          echo "PASS: full repository regression suite green."

      - name: Freeze final V10 deployment manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          R=Path("model/releases/draft-pick-fv-v10")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()

          manifest={
              "schema_version":1,
              "release_id":"draft-pick-fv-v10-production-release-v2",
              "status":"PRODUCTION_VALIDATED_READY_TO_COMMIT",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "candidate_id":"V10_C1_PLUS_M1_PLUS_MT2_PLUS_YD2",
              "phase2_5_decision":"PASS_V10_PHASE2_5_AUTHORIZE_UPDATED_PHASE3_ENGINEERING_DEPLOYMENT",
              "production_files_changed":["index.html","free-agent-board.html"],
              "production_behavior_changed":["PICK_BASE","YEAR_DISCOUNT"],
              "fallback_discount_changed":False,
              "pick_value_runtime_logic_changed":False,
              "trade_desk_preview_changed":False,
              "player_valuation_changed":False,
              "package_adjustment_changed":False,
              "team_utility_changed":False,
              "rollback_artifact_present":True,
              "runtime_pick_outputs_checked":72,
              "runtime_pick_parity_pass":True,
              "package_adjustment_regression_pass":True,
              "free_agent_valuation_parity_pass":True,
              "full_repository_regression_pass":True,
              "tail_v2_promoted":True,
              "year_discount_v2_pass":True,
              "uncertainty_propagated":True,
              "exact_slot_todo_recorded":True,
              "input_sha256":{
                  "phase2_5_contract":sha(D/"v10_phase2_5_enhancement_contract.json"),
                  "phase2_5_result":sha(D/"v10_phase2_5_enhancement_result.json"),
                  "phase2_5_candidate":sha(D/"v10_phase2_5_frozen_production_candidate.json"),
                  "phase2_5_market_freeze":sha(D/"v10_phase2_5_ktc_2027_2029_screenshot_freeze.json"),
                  "phase2_5_runtime_snapshot":sha(D/"v10_phase2_5_runtime_snapshot.json"),
                  "phase2_5_manifest":sha(D/"v10_phase2_5_manifest.json"),
                  "todo":sha(D/"v10_todo.json"),
              },
              "release_sha256":{
                  "README.md":sha(R/"README.md"),
                  "rollback.json":sha(R/"rollback.json"),
                  "release.json":sha(R/"release.json"),
                  "index.html_post_mutation":sha("index.html"),
                  "free-agent-board.html_post_mutation":sha("free-agent-board.html"),
              },
              "production_change_authorized":True,
          }
          (R/"manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("PASS: final V10 deployment manifest frozen.")
          PY

      - name: Prove exact deployment file scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "index.html",
              "free-agent-board.html",
              "model/releases/draft-pick-fv-v10/README.md",
              "model/releases/draft-pick-fv-v10/rollback.json",
              "model/releases/draft-pick-fv-v10/release.json",
              "model/releases/draft-pick-fv-v10/manifest.json",
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "trade-desk-preview.html" not in touched
          assert not any(x.startswith("research/") for x in touched)
          print("PASS: final V10 deployment scope exact.")
          PY

      - name: Commit and deploy final V10
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during final V10 deployment validation."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            free-agent-board.html \
            model/releases/draft-pick-fv-v10/README.md \
            model/releases/draft-pick-fv-v10/rollback.json \
            model/releases/draft-pick-fv-v10/release.json \
            model/releases/draft-pick-fv-v10/manifest.json

          git diff --cached --quiet && { echo "ERROR: no final V10 deployment changes staged."; exit 1; }
          git commit -m "Deploy Draft Pick FV V10 final production model"
          git push origin HEAD:main

