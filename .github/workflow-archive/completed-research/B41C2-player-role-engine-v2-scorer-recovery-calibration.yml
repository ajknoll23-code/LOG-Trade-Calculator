name: B41C2 Player Role Engine V2 - Scorer Recovery Calibration and Untouched Week 4 Preregistration

'on':
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  recover_scorer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests>=2.32,<3"

      - name: Verify B41C scientific stop and preserved firewall
        shell: bash
        run: |
          set -euo pipefail

          BASE="research/player-role-v2"

          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          d = json.loads(
              (base / "player_role_v2_b41c_scientific_decision.json")
              .read_text(encoding="utf-8")
          )
          v = json.loads(
              (base / "player_role_v2_b41c_scorer_validation.json")
              .read_text(encoding="utf-8")
          )
          s = json.loads(
              (base / "player_role_v2_b41c_league_scoring_snapshot.json")
              .read_text(encoding="utf-8")
          )

          assert d["result"] == "STOP_BEFORE_MODEL_FIT"
          assert d["scorer_validation_pass"] is False
          assert d["historical_target_source_feasibility_pass"] is True
          assert d["ready_for_B41D_development_model_fitting"] is False
          assert d["2025_holdout_opened"] is False
          assert d["model_fit_performed"] is False
          assert d["role_weights_derived"] is False
          assert d["role_thresholds_derived"] is False
          assert d["production_change_authorized"] is False

          assert v["compared_player_weeks"] >= 500
          assert v["pass"] is False
          assert v["holdout_2025_opened"] is False

          settings = s["scoring_settings"]
          # Known omissions/misroutes in the retired B41C scorer.
          assert settings["fgm_0_19"] == 3.0
          assert settings["fgm_20_29"] == 3.0
          assert settings["fgm_30_39"] == 3.0
          assert settings["fgm_40_49"] == 4.0
          assert settings["fgm_50p"] == 5.0
          assert settings["xpm"] == 1.0
          assert settings["xpmiss"] == -1.0
          assert settings["idp_blk_kick"] == 6.0
          assert settings["blk_kick"] == 2.0
          assert settings["idp_safe"] == 3.0
          assert settings["safe"] == 2.0

          print("PASS: B41C was a scientific stop, not authorization.")
          print("PASS: exact Sleeper scoring snapshot is available.")
          print("PASS: 2025 remains unopened.")
          PY

          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Preregister recovery semantics before recalculating Weeks 1-3
        shell: bash
        run: |
          set -euo pipefail

          BASE="research/player-role-v2"
          PREREG="$BASE/player_role_v2_b41c2_scorer_recovery_preregistration.json"
          SCORER="$BASE/player_role_v2_b41c2_target_scorer.py"

          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          old = json.loads(
              (base / "player_role_v2_b41c_scorer_validation.json")
              .read_text(encoding="utf-8")
          )

          prereg = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C2-scorer-recovery-calibration",
              "status": "PREREGISTERED_RECOVERY_AFTER_B41C_STOP_BEFORE_RECALCULATION",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),

              "why_recovery_is_needed": {
                  "b41c_validation_pass": False,
                  "b41c_compared_player_weeks": old["compared_player_weeks"],
                  "b41c_within_tolerance_fraction": old["within_tolerance_fraction"],
                  "b41c_max_absolute_error": old["max_absolute_error"],
                  "known_structural_defects": [
                      "B41C scorer omitted kicker field-goal and extra-point scoring.",
                      (
                          "B41C scorer used selected generic fallback stat keys for "
                          "IDP events rather than scoring the exact Sleeper stat key "
                          "under the exact frozen league scoring setting."
                      ),
                      (
                          "B41C scorer treated blocked-kick and safety paths as if "
                          "generic and IDP scoring keys were interchangeable, but the "
                          "league assigns different values to those keys."
                      ),
                  ],
              },

              "information_reuse_policy": {
                  "weeks_1_3_status": "SEEN_AND_CONTAMINATED_FOR_CONFIRMATORY_VALIDATION",
                  "weeks_1_3_allowed_use": (
                      "scorer calibration, debugging, field-map verification only"
                  ),
                  "weeks_1_3_forbidden_use": (
                      "final scorer validation or authorization to fit role models"
                  ),
                  "untouched_validation_week": 4,
                  "week_4_must_be_fully_completed_before_validation": True,
                  "week_4_may_not_be_read_in_b41c2": True,
              },

              "corrected_scorer_architecture": {
                  "source_of_truth": (
                      "frozen B41C Sleeper league scoring_settings snapshot"
                  ),
                  "direct_rule": (
                      "For every scoring setting whose exact key exists in a raw "
                      "individual-player stat object, multiply that raw value by "
                      "the frozen setting value exactly once."
                  ),
                  "no_generic_to_idp_fallbacks": True,
                  "kicker_range_fields_scored_directly": True,
                  "extra_points_scored_directly": True,
                  "bonus_rule": (
                      "If Sleeper raw stats already include the exact bonus key, "
                      "score it directly. Only if the exact bonus key is absent, "
                      "derive the bonus deterministically from its base statistic."
                  ),
                  "nonstacking_yardage_bonus_bands": True,
                  "individual_players_only": True,
                  "team_defense_ids_excluded": True,
                  "owner_identity_used": False,
              },

              "calibration_gate": {
                  "season": 2026,
                  "weeks": [1, 2, 3],
                  "required_compared_player_weeks": 500,
                  "absolute_tolerance_points": 0.011,
                  "required_fraction_within_tolerance": 0.995,
                  "required_max_absolute_error": 0.051,
                  "if_fail": (
                      "STOP_SCORER_RECOVERY_NEEDS_NEW_VERSION; do not inspect Week 4"
                  ),
                  "if_pass": (
                      "freeze B41C2 scorer and proceed later to a separate B41C3 "
                      "untouched Week 4 validation workflow"
                  ),
              },

              "week4_confirmatory_gate_preregistered_now": {
                  "validation_season": 2026,
                  "validation_week": 4,
                  "required_compared_player_weeks": 150,
                  "absolute_tolerance_points": 0.011,
                  "required_fraction_within_tolerance": 0.995,
                  "required_max_absolute_error": 0.051,
                  "scorer_may_be_modified_after_week4_open": False,
                  "if_pass": "B41D development model fitting may become eligible",
                  "if_fail": (
                      "scientific STOP; new versioned scorer recovery required"
                  ),
              },

              "firewall": {
                  "week4_opened_in_b41c2": False,
                  "2025_holdout_opened": False,
                  "development_model_fit_performed": False,
                  "predictor_target_association_computed": False,
                  "role_weights_derived": False,
                  "role_thresholds_derived": False,
                  "production_change_authorized": False,
              },
          }

          (base / "player_role_v2_b41c2_scorer_recovery_preregistration.json").write_text(
              json.dumps(prereg, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS: recovery and untouched Week 4 gate preregistered.")
          PY

          cat > "$SCORER" <<'PYFILE'
          #!/usr/bin/env python3
          """
          Player Role V2 B41C2 exact-key scorer.

          Frozen before B41C2 recalculates the already-seen 2026 Weeks 1-3.

          Design:
          - frozen Sleeper league scoring_settings are the source of truth;
          - exact raw-stat keys are scored exactly once;
          - no generic<->IDP fallback substitution;
          - kicker range scoring is therefore naturally included;
          - derived bonuses are used only when Sleeper did not expose the
            exact bonus key in the raw player stat object.
          """

          from __future__ import annotations
          import math

          SCORER_VERSION = "player-role-v2-b41c2-v1"

          DERIVED_BONUS_KEYS = {
              "bonus_pass_yd_300",
              "bonus_pass_yd_400",
              "bonus_rush_yd_100",
              "bonus_rush_yd_200",
              "bonus_rec_yd_100",
              "bonus_rec_yd_200",
              "bonus_sack_2p",
              "bonus_tkl_10p",
              "idp_pass_def_3p",
          }

          def num(value):
              try:
                  x = float(value or 0)
              except (TypeError, ValueError):
                  return 0.0
              return x if math.isfinite(x) else 0.0

          def direct_score(raw, settings):
              pts = 0.0
              scored_keys = set()

              for key, weight in settings.items():
                  if key in DERIVED_BONUS_KEYS:
                      continue
                  if key not in raw:
                      continue
                  pts += num(raw.get(key)) * num(weight)
                  scored_keys.add(key)

              return pts, scored_keys

          def _score_exact_bonus_if_present(raw, settings, key):
              if key in raw:
                  return num(raw.get(key)) * num(settings.get(key)), True
              return 0.0, False

          def _yardage_bonus(raw, settings, base_key, low_key, high_key, low_cut, high_cut):
              pts = 0.0

              # Prefer provider-supplied exact bonus counters whenever present.
              high_pts, high_present = _score_exact_bonus_if_present(
                  raw, settings, high_key
              )
              low_pts, low_present = _score_exact_bonus_if_present(
                  raw, settings, low_key
              )

              if high_present or low_present:
                  # Exact provider counters govern; do not derive a second copy.
                  return high_pts + low_pts

              yards = num(raw.get(base_key))
              if yards >= high_cut:
                  return num(settings.get(high_key))
              if yards >= low_cut:
                  return num(settings.get(low_key))
              return 0.0

          def _threshold_bonus(raw, settings, stat_key, bonus_key, threshold):
              exact, present = _score_exact_bonus_if_present(
                  raw, settings, bonus_key
              )
              if present:
                  return exact
              return num(settings.get(bonus_key)) if num(raw.get(stat_key)) >= threshold else 0.0

          def score_week(raw, settings):
              pts, _ = direct_score(raw, settings)

              pts += _yardage_bonus(
                  raw, settings,
                  "pass_yd", "bonus_pass_yd_300", "bonus_pass_yd_400",
                  300, 400,
              )
              pts += _yardage_bonus(
                  raw, settings,
                  "rush_yd", "bonus_rush_yd_100", "bonus_rush_yd_200",
                  100, 200,
              )
              pts += _yardage_bonus(
                  raw, settings,
                  "rec_yd", "bonus_rec_yd_100", "bonus_rec_yd_200",
                  100, 200,
              )

              pts += _threshold_bonus(
                  raw, settings, "idp_sack", "bonus_sack_2p", 2
              )

              # Sleeper's 10-tackle bonus is based on total credited tackles.
              exact, present = _score_exact_bonus_if_present(
                  raw, settings, "bonus_tkl_10p"
              )
              if present:
                  pts += exact
              else:
                  total_tackles = (
                      num(raw.get("idp_tkl_solo"))
                      + num(raw.get("idp_tkl_ast"))
                  )
                  if total_tackles >= 10:
                      pts += num(settings.get("bonus_tkl_10p"))

              pts += _threshold_bonus(
                  raw, settings, "idp_pass_def", "idp_pass_def_3p", 3
              )

              return round(pts, 6)

          def selftest():
              settings = {
                  "pass_yd": 0.04,
                  "bonus_pass_yd_300": 2.0,
                  "bonus_pass_yd_400": 3.0,
                  "fgm_0_19": 3.0,
                  "fgm_40_49": 4.0,
                  "fgm_50p": 5.0,
                  "xpm": 1.0,
                  "xpmiss": -1.0,
                  "idp_blk_kick": 6.0,
                  "blk_kick": 2.0,
                  "idp_safe": 3.0,
                  "safe": 2.0,
                  "idp_tkl_solo": 1.5,
                  "idp_tkl_ast": 0.75,
                  "bonus_tkl_10p": 2.0,
              }

              assert score_week({"fgm_50p": 2, "xpm": 3}, settings) == 13.0
              assert score_week({"fgm_40_49": 1, "xpmiss": 1}, settings) == 3.0
              assert score_week({"idp_blk_kick": 1}, settings) == 6.0
              assert score_week({"blk_kick": 1}, settings) == 2.0
              assert score_week({"idp_safe": 1}, settings) == 3.0
              assert score_week({"safe": 1}, settings) == 2.0
              assert score_week({"pass_yd": 300}, settings) == 14.0
              assert score_week({"pass_yd": 400}, settings) == 19.0
              assert score_week({
                  "idp_tkl_solo": 8,
                  "idp_tkl_ast": 2,
              }, settings) == 15.5

              print("SELFTEST PASS")

          if __name__ == "__main__":
              selftest()
          PYFILE

          python3 -m py_compile "$SCORER"
          python3 "$SCORER"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          scorer = base / "player_role_v2_b41c2_target_scorer.py"
          prereg_path = base / "player_role_v2_b41c2_scorer_recovery_preregistration.json"

          p = json.loads(prereg_path.read_text(encoding="utf-8"))
          p["frozen_b41c2_scorer_sha256"] = hashlib.sha256(
              scorer.read_bytes()
          ).hexdigest()
          prereg_path.write_text(
              json.dumps(p, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("Frozen B41C2 scorer SHA256:", p["frozen_b41c2_scorer_sha256"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PREREG" "$SCORER"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "B41C2 recovery contract/scorer already frozen."
          else
            git commit -m "Preregister Player Role V2 scorer recovery"
            git push origin HEAD:main
          fi

      - name: Calibrate corrected scorer on already-seen Weeks 1-3 only
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main
          mkdir -p /tmp/player-role-v2-b41c2

          python3 - <<'PY'
          import collections
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import requests

          ROOT = Path(".")
          BASE = ROOT / "research/player-role-v2"
          OUT = Path("/tmp/player-role-v2-b41c2")

          prereg = json.loads(
              (BASE / "player_role_v2_b41c2_scorer_recovery_preregistration.json")
              .read_text(encoding="utf-8")
          )
          league_snapshot = json.loads(
              (BASE / "player_role_v2_b41c_league_scoring_snapshot.json")
              .read_text(encoding="utf-8")
          )
          settings = league_snapshot["scoring_settings"]
          league_id = str(league_snapshot["league_id"])

          scorer_path = BASE / "player_role_v2_b41c2_target_scorer.py"
          actual_sha = hashlib.sha256(scorer_path.read_bytes()).hexdigest()
          assert actual_sha == prereg["frozen_b41c2_scorer_sha256"]

          spec = importlib.util.spec_from_file_location("b41c2_scorer", scorer_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "LOG-Trade-Calculator-player-role-v2-b41c2"
          })

          def get_json(url):
              r = session.get(url, timeout=90)
              r.raise_for_status()
              return r.json()

          rows = []
          raw_key_counts = collections.Counter()

          for week in prereg["calibration_gate"]["weeks"]:
              matchups = get_json(
                  f"https://api.sleeper.app/v1/league/{league_id}/matchups/{week}"
              )
              stats = get_json(
                  f"https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}"
              )

              truth = {}
              for matchup in matchups:
                  for pid, points in (matchup.get("players_points") or {}).items():
                      try:
                          truth[str(pid)] = float(points)
                      except (TypeError, ValueError):
                          pass

              for pid, actual in sorted(truth.items()):
                  if not pid.isdigit():
                      continue

                  raw = stats.get(pid) or {}
                  for key in raw:
                      raw_key_counts[key] += 1

                  predicted = float(mod.score_week(raw, settings))
                  err = predicted - actual

                  rows.append({
                      "week": week,
                      "player_id": pid,
                      "actual": actual,
                      "predicted": predicted,
                      "error": round(err, 6),
                      "abs_error": round(abs(err), 6),
                      "raw_stats_present": bool(raw),
                      "nonzero_scoring_raw_keys": sorted(
                          key for key, weight in settings.items()
                          if key in raw
                          and float(raw.get(key) or 0) != 0
                          and float(weight or 0) != 0
                      ),
                  })

          tol = float(prereg["calibration_gate"]["absolute_tolerance_points"])
          n = len(rows)
          within = sum(r["abs_error"] <= tol for r in rows)
          fraction = within / n if n else 0.0
          mae = sum(r["abs_error"] for r in rows) / n if n else 999.0
          max_abs = max((r["abs_error"] for r in rows), default=999.0)
          mismatches = sorted(
              [r for r in rows if r["abs_error"] > tol],
              key=lambda r: (-r["abs_error"], r["week"], r["player_id"]),
          )

          gate = prereg["calibration_gate"]
          passed = (
              n >= int(gate["required_compared_player_weeks"])
              and fraction >= float(gate["required_fraction_within_tolerance"])
              and max_abs <= float(gate["required_max_absolute_error"])
          )

          result = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C2-seen-weeks-scorer-calibration",
              "data_status": (
                  "Weeks 1-3 were previously opened by B41C and are calibration-only"
              ),
              "season": 2026,
              "weeks": [1, 2, 3],
              "compared_player_weeks": n,
              "within_tolerance_count": within,
              "within_tolerance_fraction": fraction,
              "mean_absolute_error": mae,
              "max_absolute_error": max_abs,
              "mismatch_count": len(mismatches),
              "pass": passed,
              "largest_mismatches": mismatches[:100],
              "raw_stat_key_presence_counts": dict(raw_key_counts.most_common()),
              "week4_read": False,
              "2025_holdout_opened": False,
              "model_fit_performed": False,
              "predictor_target_association_computed": False,
              "role_weights_derived": False,
              "role_thresholds_derived": False,
              "production_change_authorized": False,
          }

          (OUT / "player_role_v2_b41c2_scorer_calibration.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "compared_player_weeks": n,
              "within_tolerance_fraction": fraction,
              "mean_absolute_error": mae,
              "max_absolute_error": max_abs,
              "mismatch_count": len(mismatches),
              "calibration_pass": passed,
              "week4_read": False,
          }, indent=2))
          PY

      - name: Commit B41C2 calibration evidence and freeze decision
        shell: bash
        run: |
          set -euo pipefail

          BASE="research/player-role-v2"
          OUT="/tmp/player-role-v2-b41c2"

          git fetch origin main
          git rebase origin/main

          cp "$OUT/player_role_v2_b41c2_scorer_calibration.json" \
            "$BASE/player_role_v2_b41c2_scorer_calibration.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          c = json.loads(
              (base / "player_role_v2_b41c2_scorer_calibration.json")
              .read_text(encoding="utf-8")
          )
          p = json.loads(
              (base / "player_role_v2_b41c2_scorer_recovery_preregistration.json")
              .read_text(encoding="utf-8")
          )

          assert c["week4_read"] is False
          assert c["2025_holdout_opened"] is False
          assert c["model_fit_performed"] is False
          assert c["predictor_target_association_computed"] is False
          assert c["role_weights_derived"] is False
          assert c["role_thresholds_derived"] is False
          assert c["production_change_authorized"] is False

          if c["pass"]:
              result = "CALIBRATION_PASS_AWAITING_UNTOUCHED_WEEK4_VALIDATION"
              next_stage = (
                  "B41C3 untouched Week 4 scorer validation after all Week 4 "
                  "games are final and Sleeper scoring has settled"
              )
          else:
              result = "STOP_SCORER_RECOVERY_NEEDS_NEW_VERSION"
              next_stage = (
                  "Inspect B41C2 calibration mismatch evidence and preregister "
                  "a new recovery version. Do not open Week 4."
              )

          decision = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41C2-scorer-recovery-decision",
              "result": result,
              "calibration_pass": c["pass"],
              "b41c2_scorer_sha256": p["frozen_b41c2_scorer_sha256"],
              "week4_read": False,
              "week4_reserved_for_untouched_validation": True,
              "2025_holdout_opened": False,
              "model_fit_performed": False,
              "predictor_target_association_computed": False,
              "role_weights_derived": False,
              "role_thresholds_derived": False,
              "ready_for_B41D_development_model_fitting": False,
              "production_change_authorized": False,
              "next_stage": next_stage,
          }

          (base / "player_role_v2_b41c2_scientific_decision.json").write_text(
              json.dumps(decision, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          report = [
              "# Player Role V2 — B41C2 Scorer Recovery Calibration",
              "",
              f"- Result: **{result}**",
              f"- Compared player-weeks: **{c['compared_player_weeks']:,}**",
              (
                  "- Within 0.011 points: "
                  f"**{c['within_tolerance_fraction']:.4%}**"
              ),
              f"- Mean absolute error: **{c['mean_absolute_error']:.6f}**",
              f"- Maximum absolute error: **{c['max_absolute_error']:.6f}**",
              f"- Mismatch count: **{c['mismatch_count']}**",
              "- Weeks 1-3 status: **calibration/debug only**",
              "- Week 4 opened: **No**",
              "- 2025 holdout opened: **No**",
              "- Model fit performed: **No**",
              "- Role weights derived: **No**",
              "- Role thresholds derived: **No**",
              "- Production change authorized: **No**",
              "",
              f"Next stage: {next_stage}",
              "",
          ]

          if c["largest_mismatches"]:
              report += ["## Largest remaining calibration mismatches", ""]
              for row in c["largest_mismatches"][:20]:
                  report.append(
                      f"- W{row['week']} player {row['player_id']}: "
                      f"Sleeper={row['actual']:.3f}, "
                      f"B41C2={row['predicted']:.3f}, "
                      f"abs error={row['abs_error']:.3f}; "
                      f"raw scoring keys={row['nonzero_scoring_raw_keys']}"
                  )
              report.append("")

          (base / "player_role_v2_b41c2_report.md").write_text(
              "\n".join(report),
              encoding="utf-8",
          )

