name: DLF Prospect FV V1 - Phase 1B V2 Identity and Preregistration

on:
  workflow_dispatch:

permissions:
  contents: read

  actions: read
concurrency:
  group: dlf-prospect-fv-v1-phase1b-v2-identity-preregistration
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DLF_WORKBOOK_URL: 'https://docs.google.com/spreadsheets/d/1fwDTd1WnlvPEPGVW8N3Z4zuA0Bft8whkMZTRbMvGDmM/export?format=xlsx'
  NFLVERSE_PLAYERS_URL: 'https://github.com/nflverse/nflverse-data/releases/download/players/players.csv'

  PHASE1A2_RUN_ID: '36080029610'
  PHASE1A2_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1a2-source-freeze
  PHASE1A2_FREEZE_JSON_SHA256: 
    4e84fd49534436aa6fe5a6f3e5507c15f4065f6524b032c2faaa9ee2e59b1b80
  DLF_SEMANTIC_SHA256: 
    4dd07ea9180c11f7f3c80657dfe7274245a683fbb3b3eca2edb92c903c562414
  DLF_STRUCTURE_SHA256: 
    01e780ede9a21806e7f838ad735ee1c73f2f970766651b276aed9f6215769c10
jobs:
  identity-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install audit dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir \
          'openpyxl==3.1.5' \
          'requests==2.34.2'

    - name: Guard frozen lineage
      shell: bash
      run: |
        set -euo pipefail
        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: frozen lineage drift for $path" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "PASS lineage $path $actual"
        }

        check_blob 25cfd357fb29f006bf1ddaeaa4d0dec09fa27edf \
          .github/workflows/dlf-prospect-fv-v1-phase1a-source-feasibility.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        check_blob a46607b42ad954d00e89b4eb08d9b7bb91c6be0a \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.md
        check_blob 5452d9bcd1d4b23a2f2953601344cae882860bd6 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.json

        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: Phase 1A + No-History/Rookie V2 lineage is exact.'

    - name: Download exact Phase 1A2 source-freeze artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1A2_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1a2-freeze
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1A2_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Download and verify frozen semantic DLF source plus nflverse 
        identity metadata
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        from __future__ import annotations
        import csv
        import hashlib
        import json
        import math
        import os
        import time
        from collections import Counter
        from datetime import date, datetime, time as dtime
        from pathlib import Path
        from typing import Any
        import openpyxl
        import requests

        root = Path(os.environ["RUNNER_TEMP"])
        a2_path = root / "phase1a2-freeze" / "dlf_prospect_fv_v1_phase1a2_source_freeze.json"

        def sha256_bytes(data: bytes) -> str:
            return hashlib.sha256(data).hexdigest()

        def canonical_json_bytes(obj: Any) -> bytes:
            return json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")

        def clean(v: Any) -> str:
            return "" if v is None else str(v).strip()

        def numeric_int(v: Any):
            if v is None or v == "" or isinstance(v, bool):
                return None
            try:
                x=float(v)
            except (TypeError, ValueError):
                return None
            if not math.isfinite(x):
                return None
            n=int(round(x))
            return n if abs(x-n)<1e-9 else None

        def stable_scalar(v: Any):
            if v is None:
                return None
            if isinstance(v, bool):
                return {"t":"bool","v":v}
            if isinstance(v, int):
                return {"t":"int","v":str(v)}
            if isinstance(v, float):
                if not math.isfinite(v):
                    raise RuntimeError(f"non-finite workbook value: {v!r}")
                if v == 0:
                    v=0.0
                return {"t":"num","v":format(v,'.15g')}
            if isinstance(v,(datetime,date,dtime)):
                return {"t":"date","v":v.isoformat()}
            return {"t":"str","v":str(v).replace("\\r\\n","\\n").replace("\\r","\\n").strip()}

        def inspect_workbook(path: Path):
            raw=path.read_bytes()
            if len(raw)<10000 or not raw.startswith(b"PK"):
                raise RuntimeError("invalid DLF XLSX payload")
            wb=openpyxl.load_workbook(path, read_only=True, data_only=True)
            semantic_sheets=[]
            sheet_reports=[]
            all_positions=Counter(); all_years=Counter(); total_rows=0
            for ws in wb.worksheets:
                preview=[list(r) for r in ws.iter_rows(min_row=1,max_row=min(ws.max_row or 15,15),values_only=True)]
                header_row=None; raw_headers=None
                for i,row in enumerate(preview,1):
                    texts=[clean(v) for v in row]
                    if {"Year","Position","Player"}.issubset(set(texts)):
                        header_row=i; raw_headers=texts; break
                if header_row is None:
                    sheet_reports.append({"sheet":ws.title,"relevant":False,"reason":"no Year/Position/Player header in first 15 rows"})
                    continue
                last_named=max(i for i,h in enumerate(raw_headers) if h)
                headers=raw_headers[:last_named+1]
                named=[h for h in headers if h]
                if len(named)!=len(set(named)):
                    raise RuntimeError(f"{ws.title}: duplicate named headers")
                ix={h:i for i,h in enumerate(headers) if h}
                rows=[]; pc=Counter(); yc=Counter()
                for values in ws.iter_rows(min_row=header_row+1, values_only=True):
                    vals=list(values[:len(headers)])
                    if len(vals)<len(headers): vals += [None]*(len(headers)-len(vals))
                    year=numeric_int(vals[ix['Year']]); player=clean(vals[ix['Player']]); pos=clean(vals[ix['Position']]).upper()
                    if year is None or not player: continue
                    rows.append([stable_scalar(v) for v in vals]); pc[pos]+=1; yc[year]+=1
                if not rows: raise RuntimeError(f"{ws.title}: zero prospect rows")
                semantic_sheets.append({"sheet":ws.title,"header_row":header_row,"headers":headers,"rows":rows})
                sheet_reports.append({"sheet":ws.title,"relevant":True,"header_row":header_row,"row_count":len(rows),"year_min":min(yc),"year_max":max(yc),"year_counts":dict(sorted(yc.items())),"position_counts":dict(sorted(pc.items())),"column_count":len(named),"columns":named})
                total_rows+=len(rows); all_positions.update(pc); all_years.update(yc)
            payload={"format_version":1,"relevant_sheets_in_workbook_order":semantic_sheets}
            structure={"worksheet_names":wb.sheetnames,"relevant_sheet_count":len(semantic_sheets),"prospect_row_count_across_relevant_sheets":total_rows,"position_counts_across_relevant_sheets":dict(sorted(all_positions.items())),"year_min":min(all_years),"year_max":max(all_years),"sheets":sheet_reports}
            return {"raw_sha256":sha256_bytes(raw),"semantic_sha256":sha256_bytes(canonical_json_bytes(payload)),"structure_sha256":sha256_bytes(canonical_json_bytes(structure))}

        # exact green A2 artifact
        raw=a2_path.read_bytes()
        actual=sha256_bytes(raw)
        expected=os.environ['PHASE1A2_FREEZE_JSON_SHA256']
        if actual!=expected:
            raise RuntimeError(f"A2 freeze artifact SHA mismatch expected={expected} actual={actual}")
        a2=json.loads(raw)
        assert a2['decision']=='FREEZE_SEMANTIC_SOURCE_CONTENT_NO_FV_CHANGE'
        assert a2['source']['semantic_sha256']==os.environ['DLF_SEMANTIC_SHA256']
        assert a2['source']['structure_sha256']==os.environ['DLF_STRUCTURE_SHA256']
        assert a2['source']['raw_xlsx_sha_is_scientific_freeze_key'] is False
        assert a2['source']['semantic_sha_is_scientific_freeze_key'] is True
        print('PASS: exact green Phase 1A2 freeze revalidated.')

        def get(url, out, *, expect_zip=False):
            last=None
            for attempt in range(1,7):
                try:
                    r=requests.get(url,timeout=(20,120),allow_redirects=True,headers={'User-Agent':'LOG-Trade-Calculator research audit/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
                    r.raise_for_status(); data=r.content
                    if len(data)<1000: raise RuntimeError(f"download unexpectedly small: {len(data)}")
                    if expect_zip and not data.startswith(b'PK'): raise RuntimeError('expected XLSX/ZIP payload')
                    out.write_bytes(data); return data
                except Exception as exc:
                    last=exc
                    if attempt==6: raise
                    wait=min(30,5*attempt); print(f"download attempt {attempt}/6 failed: {type(exc).__name__}: {exc}; sleeping {wait}s"); time.sleep(wait)
            raise RuntimeError(last)

        checks=[]
        for n in (1,2):
            p=root/f'dlf_verify_{n}.xlsx'
            get(os.environ['DLF_WORKBOOK_URL'],p,expect_zip=True)
            fp=inspect_workbook(p); checks.append(fp)
            if fp['semantic_sha256']!=os.environ['DLF_SEMANTIC_SHA256']:
                raise RuntimeError(f"DLF semantic drift copy={n} expected={os.environ['DLF_SEMANTIC_SHA256']} actual={fp['semantic_sha256']}")
            if fp['structure_sha256']!=os.environ['DLF_STRUCTURE_SHA256']:
                raise RuntimeError(f"DLF structure drift copy={n} expected={os.environ['DLF_STRUCTURE_SHA256']} actual={fp['structure_sha256']}")
        if checks[0]['semantic_sha256']!=checks[1]['semantic_sha256']:
            raise RuntimeError('two independent DLF downloads disagree semantically')
        (root/'dlf_prospect_workbook.xlsx').write_bytes((root/'dlf_verify_1.xlsx').read_bytes())
        print(f"PASS: frozen semantic source reproduced twice sha256={checks[0]['semantic_sha256']}")

        nfl=get(os.environ['NFLVERSE_PLAYERS_URL'],root/'nflverse_players.csv')
        print(f"PASS: nflverse identity metadata bytes={len(nfl)} sha256={sha256_bytes(nfl)}")
        PY

    - name: Audit historical identity and freeze outcome-blind feature contract
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/dlf-phase1b"
        python3 - <<'PY'
        from __future__ import annotations

        import csv
        import hashlib
        import io
        import json
        import math
        import os
        import re
        import unicodedata
        from collections import Counter, defaultdict
        from datetime import datetime, timezone
        from pathlib import Path

        import openpyxl

        root = Path(os.environ["RUNNER_TEMP"])
        out_dir = root / "dlf-phase1b"

        HISTORICAL_YEARS = tuple(range(2018, 2025))
        SEALED_YEARS = (2025, 2026)
        POSITIONS = ("QB", "RB", "WR", "TE")

        BASELINE_BY_POSITION = {
            "QB": "position_ols_log_pick",
            "RB": "position_ols_log_pick",
            "WR": "position_ols_log_pick_plus_draft_age",
            "TE": "position_ols_log_pick",
        }

        COMPOSITE_QUARANTINE = {
            "Markers", "Final.Grade", "Athleticism%", "Production%", "Advanced.Markers"
        }
        TARGET_LIKE_QUARANTINE = {
            "First.PPG", "Last.PPG", "Best.PPG", "FPPG",
            "Best.PPG.F4", "Best.YPTPA.F4", "Best.MSYards.F4",
        }

        PRODUCTION_FEATURES = {
            "QB": [
                "Career.CMP%", "Career.YPA", "Career.TD%", "Career.INT%",
                "Career.RuYPG", "Best.CMP%", "Best.YPA", "Best.TD%",
                "Best.INT%", "Best.RuYPG",
            ],
            "RB": [
                "YPC", "YPTP", "Best Receptions", "Best Total Yards Y1/Y2",
                "Career.BA/A", "Career.MTF/A", "Career.1D/A", "Career.YACO/A",
                "Career.YPRR", "Career.TPRR", "Best.BA/A", "Best.MTF/A",
                "Best.1D/A", "Best.YACO/A", "Best.YPRR", "Best.TPRR",
            ],
            "WR": [
                "YPG", "First.YPTPA", "Last.YPTPA", "Best.YPTPA",
                "First.MSYards", "Last.MSYards", "Best.MSYards",
                "Career.YPRR", "Career.TPRR", "Career.1DRR", "Career.YACR",
                "Career.CTR", "Career.CR", "Career.MTF",
                "Best.YPRR", "Best.TPRR", "Best.1DRR", "Best.YACR",
                "High.CTR", "High.CR", "High.MTF",
            ],
            "TE": [
                "YPR", "YPG", "First.YPTPA", "Last.YPTPA", "Best.YPTPA",
                "First.MSYards", "Last.MSYards", "Best.MSYards",
                "Career.YPRR", "Career.TPRR", "Career.1DRR", "Career.YACR",
                "Career.CTR", "Career.CR", "Career.MTF",
                "Average.PassBlock", "Average.RunBlock",
                "Best.YPRR", "Best.TPRR", "Best.1DRR", "Best.YACR",
                "High.CTR", "High.CR", "High.MTF",
            ],
        }

        TRANSPARENT_DERIVED = {
            "QB": [],
            "RB": [],
            "WR": ["BOY20", "BOA20"],
            "TE": ["BOY15", "BOA15"],
        }

        ADVANCED_FEATURES = {
            "QB": [
                "Career.Acc%", "Career.BTT%", "Career.TWP%", "Career.Sack%",
                "Min:Max.ADOT", "Best.Acc%", "Best.BTT%", "Best.TWP%",
                "Best.Sack%",
            ],
            "RB": [],
            "WR": ["Career.YPRR.Zone", "Career.YPRR.Man", "Career.Slot Rate", "High.Slot Rate"],
            "TE": ["Career.Slot Rate", "High.Slot Rate"],
        }

        ATHLETIC_FEATURES = {
            p: [
                "Weight", "Height", "BMI", "40-Dash", "3-Cone", "Shuttle",
                "Vertical", "Broad",
            ]
            for p in POSITIONS
        }

        def norm_name(value):
            s = unicodedata.normalize("NFKD", str(value or ""))
            s = "".join(ch for ch in s if not unicodedata.combining(ch))
            s = s.casefold().replace("’", "'")
            s = re.sub(r"[^a-z0-9 ]+", " ", s)
            toks = [t for t in s.split() if t]
            while toks and toks[-1] in {"jr", "sr", "ii", "iii", "iv", "v"}:
                toks.pop()
            return " ".join(toks)

        def clean(value):
            return "" if value is None else str(value).strip()

        def finite(value):
            if value is None or value == "":
                return None
            if isinstance(value, (int, float)):
                x = float(value)
                return x if math.isfinite(x) else None
            s = str(value).strip().replace(",", "").replace("%", "")
            try:
                x = float(s)
            except ValueError:
                return None
            return x if math.isfinite(x) else None

        def intish(value):
            x = finite(value)
            if x is None:
                return None
            n = int(round(x))
            return n if abs(x - n) < 1e-9 else None

        def norm_pos(pos, group=""):
            p = clean(pos).upper()
            g = clean(group).upper()
            if g in POSITIONS:
                return g
            if p in POSITIONS:
                return p
            return None

        # Load only nflverse player metadata. No weekly/stat/outcome source exists in this workflow.
        nfl_rows = list(csv.DictReader(
            io.StringIO((root / "nflverse_players.csv").read_text(encoding="utf-8-sig"))
        ))
        if not nfl_rows:
            raise RuntimeError("nflverse players metadata is empty")

        nfl_candidates = defaultdict(list)
        nfl_name_year_pos = defaultdict(list)
        nfl_dob_pick = defaultdict(list)

        for r in nfl_rows:
            year = intish(r.get("draft_year"))
            pick = intish(r.get("draft_pick"))
            pos = norm_pos(r.get("position"), r.get("position_group"))
            name = clean(r.get("display_name"))
            if year is None or pick is None or pos not in POSITIONS or not name:
                continue
            rec = {
                "gsis_id": clean(r.get("gsis_id")),
                "name": name,
                "norm": norm_name(name),
                "pos": pos,
                "year": year,
                "pick": pick,
                "dob": clean(r.get("birth_date"))[:10],
            }
            nfl_candidates[(rec["norm"], year, pos, pick)].append(rec)
            nfl_name_year_pos[(rec["norm"], year, pos)].append(rec)
            if rec["dob"]:
                nfl_dob_pick[(rec["dob"], year, pos, pick)].append(rec)

        wb = openpyxl.load_workbook(
            root / "dlf_prospect_workbook.xlsx",
            read_only=True,
            data_only=True,
        )

        dlf_rows = []
        available_columns = {}
        for pos in POSITIONS:
            if pos not in wb.sheetnames:
                raise RuntimeError(f"missing expected DLF sheet {pos}")
            ws = wb[pos]

            header_row = None
            headers = None
            for ri, values in enumerate(
                ws.iter_rows(min_row=1, max_row=min(ws.max_row or 15, 15), values_only=True),
                1,
            ):
                hs = [clean(v) for v in values]
                if {"Year", "Position", "Player"}.issubset(set(hs)):
                    header_row = ri
                    headers = hs
                    break
            if header_row is None or headers is None:
                raise RuntimeError(f"{pos}: unable to locate prospect header")

            index = {h: i for i, h in enumerate(headers) if h and h not in {"None"}}
            available_columns[pos] = sorted(index)

            for values in ws.iter_rows(min_row=header_row + 1, values_only=True):
                vals = list(values)
                if len(vals) < len(headers):
                    vals += [None] * (len(headers) - len(vals))
                year = intish(vals[index["Year"]])
                player = clean(vals[index["Player"]])
                row_pos = clean(vals[index["Position"]]).upper()
                if year is None or not player or row_pos != pos:
                    continue
                pick = intish(vals[index["Overall"]])
                dlf_rows.append({
                    "year": year,
                    "pos": pos,
                    "player": player,
                    "norm": norm_name(player),
                    "dob": clean(vals[index["DOB"]])[:10],
                    "pick": pick,
                    "round": intish(vals[index["Round"]]),
                    "values": {h: vals[i] if i < len(vals) else None for h, i in index.items()},
                })

        # Baseline-comparable universe: drafted offensive prospects from the same
        # 2018-2024 cohorts used by No-History/Rookie V2 Phase 2.
        hist = [
            r for r in dlf_rows
            if r["year"] in HISTORICAL_YEARS
            and r["pos"] in POSITIONS
            and r["pick"] is not None
            and 1 <= r["pick"] <= 300
        ]
        if len(hist) < 300:
            raise RuntimeError(f"historical drafted DLF cohort unexpectedly small: {len(hist)}")

        method_counts = Counter()
        mapped = []
        unresolved = []
        ambiguous = []

        for r in hist:
            key = (r["norm"], r["year"], r["pos"], r["pick"])
            cands = nfl_candidates.get(key, [])
            method = None
            chosen = None

            if len(cands) == 1:
                chosen = cands[0]
                method = "name_year_pos_pick"
            elif len(cands) > 1:
                ambiguous.append(r)
                continue

            if chosen is None and r["dob"]:
                cands = nfl_dob_pick.get((r["dob"], r["year"], r["pos"], r["pick"]), [])
                if len(cands) == 1:
                    chosen = cands[0]
                    method = "dob_year_pos_pick"
                elif len(cands) > 1:
                    ambiguous.append(r)
                    continue

            if chosen is None:
                # Conservative fallback: unique normalized name/year/position, but
                # only if nflverse still agrees on the exact draft pick.
                cands = nfl_name_year_pos.get((r["norm"], r["year"], r["pos"]), [])
                agreeing = [c for c in cands if c["pick"] == r["pick"]]
                if len(agreeing) == 1:
                    chosen = agreeing[0]
                    method = "name_year_pos_unique_with_pick_agreement"

            if chosen is None:
                unresolved.append(r)
                continue

            method_counts[method] += 1
            mapped.append({**r, "gsis_id": chosen["gsis_id"], "match_method": method})

        def group_coverage(rows, matched, key_fn):
            denom = Counter(key_fn(r) for r in rows)
            numer = Counter(key_fn(r) for r in matched)
            out = {}
            for k in sorted(denom, key=lambda x: str(x)):
                out[str(k)] = {
                    "eligible": denom[k],
                    "matched": numer[k],
                    "coverage_pct": round(100.0 * numer[k] / denom[k], 2),
                }
            return out

        identity_overall = 100.0 * len(mapped) / len(hist)
        by_pos = group_coverage(hist, mapped, lambda r: r["pos"])
        by_year = group_coverage(hist, mapped, lambda r: r["year"])

        identity_pass = (
            identity_overall >= 95.0
            and all(v["coverage_pct"] >= 90.0 for v in by_pos.values())
            and all(v["coverage_pct"] >= 90.0 for v in by_year.values())
            and len(ambiguous) == 0
        )

        # Feature eligibility is determined ONLY by source availability, never by NFL outcomes.
        # It is calculated on mapped 2018-2024 rows because those are the rows that can
        # participate in the future LOYO comparison against the existing baseline.
        feature_contract = {}
        for pos in POSITIONS:
            rows = [r for r in mapped if r["pos"] == pos]
            if not rows:
                raise RuntimeError(f"{pos}: no mapped historical rows")

            by_year_rows = {y: [r for r in rows if r["year"] == y] for y in HISTORICAL_YEARS}
            pos_out = {}

            family_specs = [
                ("production_primary", PRODUCTION_FEATURES[pos], 80.0, 70.0, 6, True),
                ("transparent_derived_primary", TRANSPARENT_DERIVED[pos], 80.0, 70.0, 6, True),
                ("athletic_primary", ATHLETIC_FEATURES[pos], 65.0, 50.0, 5, True),
                ("advanced_secondary", ADVANCED_FEATURES[pos], 55.0, 50.0, 4, False),
            ]

            for family, features, overall_gate, yearly_gate, years_required, primary in family_specs:
                items = []
                for f in features:
                    if f in COMPOSITE_QUARANTINE or f in TARGET_LIKE_QUARANTINE:
                        raise RuntimeError(f"quarantined feature leaked into candidate list: {f}")
                    if f not in available_columns[pos]:
                        continue

                    nonempty = sum(1 for r in rows if finite(r["values"].get(f)) is not None)
                    overall = 100.0 * nonempty / len(rows)
                    yearly = {}
                    years_passing = 0
                    for y in HISTORICAL_YEARS:
                        yr = by_year_rows[y]
                        if not yr:
                            pct = 0.0
                        else:
                            n = sum(1 for r in yr if finite(r["values"].get(f)) is not None)
                            pct = 100.0 * n / len(yr)
                        yearly[str(y)] = round(pct, 2)
                        if pct >= yearly_gate:
                            years_passing += 1

                    eligible = overall >= overall_gate and years_passing >= years_required
                    items.append({
                        "feature": f,
                        "eligible": eligible,
                        "primary_family": primary,
                        "overall_coverage_pct": round(overall, 2),
                        "yearly_coverage_pct": yearly,
                        "years_meeting_gate": years_passing,
                        "gates": {
                            "overall_pct_min": overall_gate,
                            "yearly_pct_min": yearly_gate,
                            "years_required": years_required,
                        },
                    })

                pos_out[family] = {
                    "primary": primary,
                    "eligible_features": [x["feature"] for x in items if x["eligible"]],
                    "features": items,
                }

            feature_contract[pos] = pos_out

        # Stable fingerprints without publishing row-level DLF content.
        mapped_identity_lines = sorted(
            f"{r['year']}|{r['pos']}|{r['pick']}|{r['gsis_id']}" for r in mapped
        )
        mapped_identity_sha = hashlib.sha256(
            ("\n".join(mapped_identity_lines) + "\n").encode()
        ).hexdigest()

        feature_freeze_payload = {
            pos: {
                fam: data["eligible_features"]
                for fam, data in families.items()
            }
            for pos, families in feature_contract.items()
        }
        feature_freeze_sha = hashlib.sha256(
            json.dumps(
                feature_freeze_payload,
                sort_keys=True,
                separators=(",", ":"),
            ).encode()
        ).hexdigest()

        decision = (
            "PASS_IDENTITY_AND_PREREGISTRATION_NO_OUTCOMES_READ"
            if identity_pass
            else "FAIL_IDENTITY_GATE_NO_MODELING_AUTHORIZED"
        )

        result = {
            "schema_version": 1,
            "study_id": "dlf-prospect-fv-v1",
            "phase": "1B_identity_and_preregistration",
            "decision": decision,
            "generated_at_utc": datetime.now(timezone.utc).isoformat(),
            "lineage": {
                "dlf_semantic_sha256": os.environ["DLF_SEMANTIC_SHA256"],
                "dlf_structure_sha256": os.environ["DLF_STRUCTURE_SHA256"],
                "phase1a2_run_id": int(os.environ["PHASE1A2_RUN_ID"]),
                "phase1a2_freeze_json_sha256": os.environ["PHASE1A2_FREEZE_JSON_SHA256"],
                "no_history_v2_baseline": "no-history-rookie-v2-phase2-prospect-prior-v1",
            },
            "firewalls": {
                "weekly_nfl_outcomes_read": False,
                "current_fv_read_for_selection": False,
                "ktc_read": False,
                "dlf_adp_read": False,
                "dlf_rankings_read": False,
                "dlf_trade_values_read": False,
                "dlf_composites_used": False,
                "target_like_dlf_scoring_fields_used": False,
                "model_fit_performed": False,
                "feature_selection_used_outcomes": False,
                "production_change_authorized": False,
            },
            "identity": {
                "historical_years": list(HISTORICAL_YEARS),
                "historical_drafted_rows": len(hist),
                "mapped_rows": len(mapped),
                "unresolved_rows": len(unresolved),
                "ambiguous_rows": len(ambiguous),
                "overall_coverage_pct": round(identity_overall, 2),
                "match_method_counts": dict(sorted(method_counts.items())),
                "coverage_by_position": by_pos,
                "coverage_by_year": by_year,
                "gate": {
                    "overall_min_pct": 95.0,
                    "each_position_min_pct": 90.0,
                    "each_year_min_pct": 90.0,
                    "ambiguous_required": 0,
                    "passed": identity_pass,
                },
                "mapped_identity_sha256": mapped_identity_sha,
            },
            "feature_contract": feature_contract,
            "feature_freeze": {
                "eligible_features_by_position_family": feature_freeze_payload,
                "sha256": feature_freeze_sha,
                "composite_quarantine": sorted(COMPOSITE_QUARANTINE),
                "target_like_quarantine": sorted(TARGET_LIKE_QUARANTINE),
            },
            "preregistration": {
                "historical_development_years": list(HISTORICAL_YEARS),
                "sealed_nonselection_years": list(SEALED_YEARS),
                "positions": list(POSITIONS),
                "primary_target": (
                    "custom-scored first-two-NFL-season points / scheduled team games "
                    "(exact existing No-History/Rookie V2 target)"
                ),
                "outer_validation": "leave one entire draft year out",
                "baseline_by_position": BASELINE_BY_POSITION,
                "candidate_models": [
                    "baseline + production_primary",
                    "baseline + transparent_derived_primary",
                    "baseline + athletic_primary",
                    "baseline + production_primary + athletic_primary",
                    "baseline + production_primary + athletic_primary",
                ],
                "secondary_research_only": [
                    "advanced_secondary; cannot win V1 primary evaluation"
                ],
                "preprocessing_inside_training_fold_only": [
                    "median imputation by position for numeric missing values",
                    "explicit missingness indicators for candidate features",
                    "z-score using training-fold mean and standard deviation",
                    "held-out draft year never contributes preprocessing statistics",
                ],
                "candidate_estimator": (
                    "ridge regression with fixed alpha=10 for DLF-enhanced candidates; "
                    "existing baseline remains unchanged"
                ),
                "comparison_metrics": [
                    "MAE primary",
                    "RMSE secondary",
                    "Spearman secondary",
                ],
                "minimum_primary_success_rule": (
                    "DLF-enhanced candidate must improve pooled outer-fold MAE versus "
                    "the exact frozen baseline and may not materially worsen a position "
                    "without explicit later amendment; no production weight is selected here."
                ),
                "selection_firewall": (
                    "No current FV, KTC, DLF market value, ADP, rankings, trade values, "
                    "2025 outcomes, or 2026 outcomes may choose the candidate."
                ),
            },
        }

        out_json = out_dir / "dlf_prospect_fv_v1_phase1b_identity_preregistration.json"
        out_md = out_dir / "dlf_prospect_fv_v1_phase1b_identity_preregistration.md"
        out_json.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")

        md = []
        md.append("# DLF Prospect FV V1 — Phase 1B Identity + Preregistration")
        md.append("")
        md.append(f"**Decision:** `{decision}`")
        md.append("")
        md.append("## Historical identity")
        md.append("")
        md.append(
            f"- Mapped: **{len(mapped)}/{len(hist)} "
            f"({identity_overall:.2f}%)**"
        )
        md.append(f"- Unresolved: **{len(unresolved)}**")
        md.append(f"- Ambiguous: **{len(ambiguous)}**")
        md.append(f"- Identity fingerprint: `{mapped_identity_sha}`")
        md.append("")
        md.append("### By position")
        md.append("")
        for pos, v in by_pos.items():
            md.append(
                f"- {pos}: {v['matched']}/{v['eligible']} "
                f"({v['coverage_pct']:.2f}%)"
            )
        md.append("")
        md.append("### By draft year")
        md.append("")
        for year, v in by_year.items():
            md.append(
                f"- {year}: {v['matched']}/{v['eligible']} "
                f"({v['coverage_pct']:.2f}%)"
            )
        md.append("")
        md.append("## Outcome-blind feature freeze")
        md.append("")
        for pos in POSITIONS:
            md.append(f"### {pos}")
            for fam, data in feature_contract[pos].items():
                fs = data["eligible_features"]
                md.append(
                    f"- `{fam}`: "
                    + (", ".join(f"`{x}`" for x in fs) if fs else "_none_")
                )
            md.append("")
        md.append(f"Feature freeze SHA-256: `{feature_freeze_sha}`")
        md.append("")
        md.append("## Preregistered comparison")
        md.append("")
        md.append(
            "The frozen comparison is the existing No-History/Rookie V2 prospect prior "
            "versus DLF-enhanced candidates under the same 2018–2024 leave-one-draft-year-out "
            "target. 2025 and 2026 are sealed from model selection."
        )
        md.append("")
        md.append(
            "DLF composite grades and DLF fantasy-scoring-like fields remain quarantined. "
            "No NFL outcomes were read and no model was fit in Phase 1B."
        )
        md.append("")
        md.append("## Next gate")
        md.append("")
        if identity_pass:
            md.append(
                "**Phase 1C:** reproduce this frozen source/identity/feature contract and "
                "run the preregistered historical LOYO incremental-signal evaluation."
            )
        else:
            md.append(
                "**Stop:** identity coverage failed the preregistered gate. Resolve identity "
                "before any outcome data or model fitting is allowed."
            )

        out_md.write_text("\n".join(md) + "\n")

        print(json.dumps({
            "decision": decision,
            "historical_drafted_rows": len(hist),
            "mapped_rows": len(mapped),
            "identity_coverage_pct": round(identity_overall, 2),
            "unresolved_rows": len(unresolved),
            "ambiguous_rows": len(ambiguous),
            "coverage_by_position": by_pos,
            "coverage_by_year": by_year,
            "feature_freeze_sha256": feature_freeze_sha,
            "eligible_feature_counts": {
                pos: {
                    fam: len(data["eligible_features"])
                    for fam, data in feature_contract[pos].items()
                }
                for pos in POSITIONS
            },
            "outcomes_read": False,
            "model_fit_performed": False,
        }, indent=2))

        if not identity_pass:
            raise SystemExit("FAIL: historical identity coverage gate did not pass")
        PY

    - name: Prove Phase 1B made no repository changes
      shell: bash
      run: |
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: Phase 1B is outcome-blind, research-only, and repo-clean.'

    - name: Destroy raw source copies
      if: always()
      shell: bash
      run: |
        rm -f \
          "${RUNNER_TEMP}/dlf_prospect_workbook.xlsx" \
          "${RUNNER_TEMP}/nflverse_players.csv"

    - name: Upload aggregate Phase 1B V2 evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1b-v2-identity-preregistration
        path: ${{ runner.temp }}/dlf-phase1b/
        if-no-files-found: warn
        retention-days: 14
