name: OPS1 - Archive 51 QF11 One-Off Workflows (Preview or PR)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview=read-only inventory; create_pr=archive files on review branch, never merge automatically'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - create_pr

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ops1-qf11-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fail-closed inventory, dependency checks, and preview
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          root = Path('.github/workflows')
          files = sorted(root.glob('QF11-v*.yml'))
          if len(files) != 51:
              raise SystemExit(f'STOP: expected exactly 51 QF11 files, found {len(files)}. Re-review required.')
          archive = Path('.github/workflow-archive/completed-research')
          for path in files:
              content = path.read_text(encoding='utf-8')
              if (archive / path.name).exists():
                  raise SystemExit('STOP: archive collision: ' + str(path))
              # No scheduled or event-triggered QF11 automation may be archived.
              if re.search(r'^\s{0,2}(?:schedule|push|pull_request|workflow_call|workflow_run|repository_dispatch)\s*:', content, re.M):
                  raise SystemExit('STOP: non-manual trigger in ' + str(path))
              if not re.search(r'^\s{0,2}(?:on|[\x27\x22]on[\x27\x22])\s*:', content, re.M):
                  raise SystemExit('STOP: missing event declaration in ' + str(path))
          # Only inspect *active workflow calls*. Documentation references remain intact.
          others = [p for p in root.glob('*.yml') if p not in files]
          for path in others:
              content = path.read_text(encoding='utf-8')
              if re.search(r'uses\s*:\s*[\x27\x22]?\.?/?\.github/workflows/QF11-v[^\s\x27\x22]+', content, re.I):
                  raise SystemExit('STOP: active reusable-workflow dependency: '+str(path))
          report = ['# OPS1 preview', '', f'Will archive **{len(files)}** QF11 one-off workflows.',
                    f'Will leave **{len(others)}** existing non-QF11 workflows untouched.',
                    'All moves preserve bytes and Git history. Review PR required.', '',
                    '## Files to move', *('- '+p.name for p in files)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(report)+'\n')
          Path('/tmp/ops1-list.txt').write_text('\n'.join(str(p) for p in files)+'\n')
          print(f'GREEN: {len(files)} QF11 workflows eligible; {len(others)} other workflows preserved.')
          PY

      - name: Create review branch and PR (explicit mode only)
        if: inputs.mode == 'create_pr'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ops1/archive-qf11-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          while IFS= read -r path; do
            git mv -- "$path" ".github/workflow-archive/completed-research/$(basename "$path")"
          done </tmp/ops1-list.txt
          git diff --cached --name-status
          test "$(git diff --cached --name-status | grep -c '^R100' || true)" -eq 51 || {
            echo 'STOP: expected 51 byte-for-byte moves'; exit 1;
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'OPS1: archive completed QF11 one-off workflows (51 exact renames)'
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'OPS1: archive 51 QF11 one-off workflows (no deletion)' \
            --body 'Moves exactly 51 QF11-v*.yml files into existing completed-research archive. No production, recurring, frozen data, or QF1–QF10 workflows changed. All 51 Git renames are byte-for-byte. Review before merging; this PR is NOT auto-merged.'
          echo 'GREEN: review PR created; no direct changes to main.'
