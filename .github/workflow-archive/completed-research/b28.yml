# PREFLIGHTED: B28_DRAFT_CAPITAL_OUTLOOK_V3_INSTRUMENT_VALIDATION
name: B28 Draft Capital Outlook V3 - Instrument Validation and Frozen Parser

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b28_v3_instrument_validation:
    name: Validate frozen qualification instrument on independent offline calibration fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard B27 preregistration and B28-only authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/draft-capital-outlook-v3/b27/b27_manifest.json")
          assert p.is_file(), p
          j=json.loads(p.read_text())
          assert j["study_id"]=="draft-capital-outlook-v3"
          assert j["stage"]=="b27_manifest"
          assert j["decision"]=="FREEZE_V3_METHODS_AUTHORIZE_B28_INSTRUMENT_VALIDATION_ONLY"
          assert j["b28_instrument_validation_authorized"] is True
          assert j["b29_historical_source_audit_authorized"] is False
          assert j["candidate_K"]==[60,32]
          assert j["candidate_N"]==[5,4,3]
          assert j["minimum_historical_classes_required"]==10
          assert j["new_v3_candidate_source_enumeration_authorized"] is False
          assert j["historical_actual_capital_open_authorized"] is False
          assert j["predictor_target_association_authorized"] is False
          assert j["2027_class_scoring_authorized"] is False
          assert j["production_change_authorized"] is False
          assert float(j["draft_capital_outlook_multiplier"])==1.0
          print("PASS: B27 authorizes B28 instrument validation only.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B28 instrument and calibration protocol before evaluation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v3/b28
          mkdir -p research/draft-capital-outlook-v3/b28/fixtures
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v3/b28")
          instrument_b64=""
          instrument=base64.b64decode(instrument_b64).decode("utf-8")
          instrument_path=O/"instrument_v1.py"
          instrument_path.write_text(instrument)
          instrument_sha=hashlib.sha256(instrument_path.read_bytes()).hexdigest()

          seeds=[
            {"class_year":2014,"publication_date":"2013-10-02","raw":"2014_20131002.html"},
            {"class_year":2015,"publication_date":"2014-10-01","raw":"2015_20141001.html"},
            {"class_year":2016,"publication_date":"2015-09-30","raw":"2016_20150930.html"},
            {"class_year":2017,"publication_date":"2016-09-29","raw":"2017_20160929.html"},
            {"class_year":2018,"publication_date":"2017-09-28","raw":"2018_20170928.html"},
            {"class_year":2019,"publication_date":"2018-09-27","raw":"2019_20180927.html"},
            {"class_year":2020,"publication_date":"2019-10-02","raw":"2020_20191002.html"},
            {"class_year":2021,"publication_date":"2020-09-30","raw":"2021_20200930.html"},
            {"class_year":2022,"publication_date":"2021-10-06","raw":"2022_20211006.html"},
            {"class_year":2023,"publication_date":"2022-09-28","raw":"2023_20220928.html"},
          ]
          mutations=[
            "remove_author","remove_date","big_board","access_wall","derivative",
            "wrong_domain","remove_author","remove_date","big_board","access_wall",
          ]
          cfg={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v3",
            "stage":"b28_instrument_validation_preregistration",
            "created_before_fixture_evaluation":True,
            "created_before_any_v3_candidate_source_enumeration":True,
            "created_before_any_2027_anchor_window_source_use":True,
            "instrument_sha256":instrument_sha,
            "instrument_scope":"Qualification-content and explicit-slot detection mechanics only; no claim that every real publisher template is measurable.",
            "calibration_lineage":{
              "positive_seed_root":"research/draft-capital-outlook-v1/archive/historical-anchor-feasibility-v2/selected",
              "frozen_parse_root":"research/draft-capital-outlook-v1/archive/historical-anchor-parsing-v2/parsed",
              "seed_count":10,
              "seed_class_years":list(range(2014,2024)),
              "2027_anchor_window_pages_allowed":False,
              "historical_actual_capital_used":False,
              "player_names_or_positions_extracted":False
            },
            "fixture_plan":{
              "total_fixture_count":30,
              "layout_families":["heading","ordered_list","table","visible_pick_lines"],
              "qualification_negative_mutations":mutations,
              "ground_truth_labels_depend_on_detector_output":False,
              "fixture_player_names":"NONE_REAL; placeholders only"
            },
            "gating_metrics":{
              "K32":{"minimum_sensitivity":0.95,"minimum_specificity":0.95},
              "K60":{"minimum_sensitivity":0.95,"minimum_specificity":0.95},
              "both_depths_must_pass":True
            },
            "unseen_real_template_policy":{
              "b28_pass_does_not_imply_all_publishers_parse":True,
              "future_instrument_unknown_may_not_be_reclassified_as_source_failure":True,
              "b29_must_report_unmeasurable_pages_separately":True
            },
            "pass_decision":"PASS_B28_INSTRUMENT_VALIDATION_AUTHORIZE_B29_HISTORICAL_SOURCE_AUDIT",
            "first_cycle_fail_decision":"STOP_B28_INITIAL_INSTRUMENT_VALIDATION_AUTHORIZE_ONE_CORRECTION_CYCLE_ONLY",
            "maximum_correction_cycles_after_initial":1,
            "2027_candidate_enumeration_authorized":False,
            "historical_actual_capital_open_authorized":False,
            "player_identity_open_authorized":False,
            "predictor_construction_authorized":False,
            "predictor_target_association_authorized":False,
            "production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0,
            "seeds":seeds
          }
          p=O/"b28_preregistration.json"
          p.write_text(json.dumps(cfg,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b28_preregistration.sha256").write_text(f"{h}  {p.name}\n")
          print(json.dumps({"preregistration_sha256":h,"instrument_sha256":instrument_sha,"fixture_count":30},indent=2))
          PY

      - name: Execute frozen offline calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,importlib.util,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v3/b28")
          F=O/"fixtures"
          P=json.loads((O/"b28_preregistration.json").read_text())
          expected=(O/"b28_preregistration.sha256").read_text().split()[0]
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(O/"b28_preregistration.json")==expected
          assert sha(O/"instrument_v1.py")==P["instrument_sha256"]

          spec=importlib.util.spec_from_file_location("b28_instrument",O/"instrument_v1.py")
          inst=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(inst)

          seed_root=Path(P["calibration_lineage"]["positive_seed_root"])
          parse_root=Path(P["calibration_lineage"]["frozen_parse_root"])
          B27=json.loads(Path("research/draft-capital-outlook-v3/b27/b27_phase0a_preregistration.json").read_text())
          allowed_domains=B27["publisher_domain_frame_v1"]["domains"]
          layouts=P["fixture_plan"]["layout_families"]
          mutations=P["fixture_plan"]["qualification_negative_mutations"]

          def metadata_block(author,pubdate,domain,layout):
              canonical=f"https://{domain}/calibration/mock.html"
              if layout=="heading":
                  return (
                      f'<link rel="canonical" href="{canonical}">\n'
                      + (f'<meta name="author" content="{author}">\n' if author else "")
                      + (f'<meta property="article:published_time" content="{pubdate}T12:00:00+00:00">\n' if pubdate else "")
                  )
              if layout=="ordered_list":
                  obj={"@context":"https://schema.org","@type":"Article"}
                  if author: obj["author"]={"@type":"Person","name":author}
                  if pubdate: obj["datePublished"]=pubdate+"T12:00:00+00:00"
                  return f'<link rel="canonical" href="{canonical}">\n<script type="application/ld+json">{json.dumps(obj)}</script>\n'
              if layout=="table":
                  return (
                      f'<link rel="canonical" href="{canonical}">\n'
                      + (f'<span class="byline">By {author}</span>\n' if author else "")
                      + (f'<time datetime="{pubdate}T12:00:00+00:00">{pubdate}</time>\n' if pubdate else "")
                  )
              pretty=""
              if pubdate:
                  y,m,d=[int(x) for x in pubdate.split("-")]
                  months=["","January","February","March","April","May","June","July","August","September","October","November","December"]
                  pretty=f'Updated {months[m]} {d}, {y}'
              return (
                  f'<link rel="canonical" href="{canonical}">\n'
                  + (f'<p>By {author}</p>\n' if author else "")
                  + (f'<p>{pretty}</p>\n' if pretty else "")
              )

          def slot_block(layout,gap=None):
              nums=[n for n in range(1,65) if n!=gap]
              if layout=="heading":
                  return "\n".join(f"<h3>{n}. Placeholder</h3>" for n in nums)
              if layout=="ordered_list":
                  return "<ol>"+"".join(f'<li value="{n}">Placeholder</li>' for n in nums)+"</ol>"
              if layout=="table":
                  return "<table>"+"".join(f"<tr><td>{n}</td><td>Placeholder</td></tr>" for n in nums)+"</table>"
              return "\n".join(f"<div>Pick #{n} - Placeholder</div>" for n in nums)

          def make_fixture(seed,layout,mutation=None,gap=None):
              author="Walt"
              pubdate=seed["publication_date"]
              domain="walterfootball.com"
              title=f'{seed["class_year"]} NFL Mock Draft'
              extra=""
              if mutation=="remove_author": author=None
              elif mutation=="remove_date": pubdate=None
              elif mutation=="big_board": title=f'{seed["class_year"]} NFL Draft Big Board'
              elif mutation=="access_wall": extra+="<div>Subscribe to continue</div>\n"
              elif mutation=="derivative": extra+="<div>This mock is derived from another mock consensus product.</div>\n"
              elif mutation=="wrong_domain": domain="example.com"
              elif mutation is not None: raise AssertionError(mutation)
              return (
                  "<!doctype html><html><head>\n"
                  f"<title>{title}</title>\n"
                  f"{metadata_block(author,pubdate,domain,layout)}"
                  "</head><body>\n"
                  f"<h1>{title}</h1>\n"
                  f"{extra}{slot_block(layout,gap)}\n"
                  "</body></html>\n"
              )

          fixture_records=[]
          seed_records=[]
          for idx,seed in enumerate(P["seeds"]):
              year=seed["class_year"]
              raw=seed_root/seed["raw"]
              parsed=parse_root/f"{year}_projected_top60.json"
              assert raw.is_file(),raw
              assert parsed.is_file(),parsed
              pj=json.loads(parsed.read_text())
              assert pj["class_year"]==year
              assert pj["parse_feasible"] is True
              assert pj["reaches_slot_60"] is True
              assert pj["source_integrity_available"] is True
              assert len(pj.get("top60_rows") or [])>=60
              seed_records.append({
                  "class_year":year,
                  "raw_path":str(raw),
                  "raw_sha256":sha(raw),
                  "parsed_path":str(parsed),
                  "parsed_sha256":sha(parsed),
                  "top60_row_count":len(pj.get("top60_rows") or []),
                  "player_fields_read":False
              })
              layout=layouts[idx % len(layouts)]
              mutation=mutations[idx]
              gap=20 if idx % 2==0 else 45
              cases=[
                  ("positive",None,None,True,True),
                  ("qualification_negative",mutation,None,False,False),
                  ("depth_control",None,gap,(gap>32),False),
              ]
              for kind,mut,gap_slot,label32,label60 in cases:
                  html=make_fixture(seed,layout,mut,gap_slot)
                  path=F/f"{year}_{kind}.html"
                  path.write_text(html)
                  r32=inst.analyze_html(html,32,allowed_domains)
                  r60=inst.analyze_html(html,60,allowed_domains)
                  fixture_records.append({
                      "class_year":year,"fixture_kind":kind,"layout":layout,
                      "mutation":mut,"gap_slot":gap_slot,
                      "fixture_path":str(path),"fixture_sha256":sha(path),
                      "expected_pass_K32":label32,"expected_pass_K60":label60,
                      "observed_pass_K32":r32["passed"],"observed_pass_K60":r60["passed"],
                      "K32_checks":r32["checks"],"K60_checks":r60["checks"]
                  })
          assert len(fixture_records)==30

          def metrics(k):
              label=f"expected_pass_K{k}"; obs=f"observed_pass_K{k}"
              tp=tn=fp=fn=0
              for r in fixture_records:
                  y=bool(r[label]); z=bool(r[obs])
                  if y and z: tp+=1
                  elif y and not z: fn+=1
                  elif not y and z: fp+=1
                  else: tn+=1
              return {
                  "tp":tp,"tn":tn,"fp":fp,"fn":fn,
                  "sensitivity":tp/(tp+fn) if tp+fn else 0.0,
                  "specificity":tn/(tn+fp) if tn+fp else 0.0
              }
          m32=metrics(32); m60=metrics(60)

          assert inst.independent_pair({"publisher_domain":"a.com","author":"Alpha"},{"publisher_domain":"b.com","author":"Beta"}) is True
          assert inst.independent_pair({"publisher_domain":"a.com","author":"Alpha"},{"publisher_domain":"a.com","author":"Beta"}) is False
          assert inst.independent_pair({"publisher_domain":"a.com","author":"Alpha"},{"publisher_domain":"b.com","author":"Alpha"}) is False
          assert inst.in_anchor_window("2025-10-08","2025-09-30",8) is True
          assert inst.in_anchor_window("2025-10-09","2025-09-30",8) is False

          t32=P["gating_metrics"]["K32"]; t60=P["gating_metrics"]["K60"]
          pass32=m32["sensitivity"]>=t32["minimum_sensitivity"] and m32["specificity"]>=t32["minimum_specificity"]
          pass60=m60["sensitivity"]>=t60["minimum_sensitivity"] and m60["specificity"]>=t60["minimum_specificity"]
          passed=pass32 and pass60
          decision=P["pass_decision"] if passed else P["first_cycle_fail_decision"]

          result={
              "schema_version":1,"study_id":"draft-capital-outlook-v3","stage":"b28_instrument_validation",
              "preregistration_sha256":expected,"instrument_sha256":P["instrument_sha256"],
              "fixture_count":len(fixture_records),"positive_seed_count":len(seed_records),
              "seed_records":seed_records,"metrics":{"K32":m32,"K60":m60},
              "K32_gate_pass":pass32,"K60_gate_pass":pass60,"instrument_validation_pass":passed,
              "fixture_records":fixture_records,
              "real_publisher_cross_template_validation_claimed":False,
              "unseen_real_template_must_fail_closed":True,
              "new_v3_candidate_sources_enumerated":False,
              "2027_anchor_window_pages_used":False,
              "player_names_extracted":False,"player_positions_extracted":False,
              "historical_actual_capital_loaded":False,
              "predictor_target_association_computed":False,
              "2027_class_scored":False,"production_change_authorized":False,
              "decision":decision
          }
          (O/"b28_validation_result.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          report=[
              "# Draft Capital Outlook V3 — B28 Instrument Validation","",
              f"Decision: **{decision}**","",
              f"- Calibration fixtures: **{len(fixture_records)}**",
              f"- Historical positive seed families: **{len(seed_records)}**",
              f"- K32 sensitivity: **{m32['sensitivity']:.3f}**",
              f"- K32 specificity: **{m32['specificity']:.3f}**",
              f"- K60 sensitivity: **{m60['sensitivity']:.3f}**",
              f"- K60 specificity: **{m60['specificity']:.3f}**","",
              "This calibration is offline: no 2027 anchor-window page and no new V3 source was enumerated.",
              "",
              "Scope limitation: PASS validates the frozen instrument mechanics on this preregistered fixture corpus only. It does not claim every real publisher template is measurable. Future unmeasurable pages must be reported separately and cannot be silently counted as source failures.",
              "",
              "No player names, positions, historical actual-capital outcomes, predictor-target associations, 2027 scores, multipliers, or production values were opened."
          ]
          (O/"b28_report.md").write_text("\n".join(report)+"\n")
          print(json.dumps({"decision":decision,"K32":m32,"K60":m60,"instrument_validation_pass":passed},indent=2))
          PY

      - name: Audit B28 firewall and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          O=Path("research/draft-capital-outlook-v3/b28")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          prereg=O/"b28_preregistration.json"
          instrument=O/"instrument_v1.py"
          result=O/"b28_validation_result.json"
          report=O/"b28_report.md"
          for p in (prereg,instrument,result,report,O/"b28_preregistration.sha256"):
              assert p.is_file(),p
          P=json.loads(prereg.read_text()); R=json.loads(result.read_text())
          assert R["preregistration_sha256"]==sha(prereg)
          assert R["instrument_sha256"]==sha(instrument)==P["instrument_sha256"]
          assert R["fixture_count"]>=30
          assert R["positive_seed_count"]==10
          assert R["new_v3_candidate_sources_enumerated"] is False
          assert R["2027_anchor_window_pages_used"] is False
          assert R["player_names_extracted"] is False
          assert R["player_positions_extracted"] is False
          assert R["historical_actual_capital_loaded"] is False
          assert R["predictor_target_association_computed"] is False
          assert R["2027_class_scored"] is False
          assert R["production_change_authorized"] is False
          assert R["real_publisher_cross_template_validation_claimed"] is False
          assert R["unseen_real_template_must_fail_closed"] is True
          passed=R["instrument_validation_pass"]
          assert R["decision"]==(P["pass_decision"] if passed else P["first_cycle_fail_decision"])

          manifest={
              "schema_version":1,"study_id":"draft-capital-outlook-v3","stage":"b28_manifest",
              "b28_executed":True,"b28_execution_count_committed":1,"decision":R["decision"],
              "fixture_count":R["fixture_count"],
              "K32_sensitivity":R["metrics"]["K32"]["sensitivity"],
              "K32_specificity":R["metrics"]["K32"]["specificity"],
              "K60_sensitivity":R["metrics"]["K60"]["sensitivity"],
              "K60_specificity":R["metrics"]["K60"]["specificity"],
              "instrument_validation_pass":passed,"instrument_sha256":sha(instrument),
              "b29_historical_source_audit_authorized":passed,
              "one_instrument_correction_cycle_authorized":not passed,
              "historical_candidate_enumeration_authorized":passed,
              "2027_candidate_enumeration_authorized":False,
              "player_identity_open_authorized":False,"predictor_construction_authorized":False,
              "historical_actual_capital_open_authorized":False,
              "predictor_target_association_authorized":False,
              "2027_class_scoring_authorized":False,"production_change_authorized":False,
              "draft_capital_outlook_multiplier":1.0,
              "unseen_real_template_policy":"FAIL_CLOSED_UNMEASURABLE_NOT_SOURCE_FAILURE",
              "output_hashes":{
                  "b28_preregistration.json":sha(prereg),"instrument_v1.py":sha(instrument),
                  "b28_validation_result.json":sha(result),"b28_report.md":sha(report)
              }
          }
          mp=O/"b28_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          files=[prereg,instrument,result,report,mp]
          (O/"b28_hashes.sha256").write_text("".join(f"{sha(x)}  {x.name}\n" for x in files))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Run repository regression after B28 artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/draft-capital-outlook-v3/b28"
          PRESERVE_DIR="$(mktemp -d)"
          PRESERVE_ARCHIVE="$PRESERVE_DIR/b28.tar"
          tar -C "$ROOT" -cf "$PRESERVE_ARCHIVE" .
          restore_b28() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$PRESERVE_ARCHIVE"
            rm -rf "$PRESERVE_DIR"
          }
          trap restore_b28 EXIT
          python3 scripts/validation/repo_regression_checks.py
          restore_b28
          trap - EXIT

      - name: Commit B28 validation artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v3/b28
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No B28 changes to commit."
            exit 1
          fi
          git commit -m "B28 validate Draft Capital Outlook V3 instrument"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final clean-state confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B28 complete. Read the committed manifest for PASS vs one permitted correction cycle."
