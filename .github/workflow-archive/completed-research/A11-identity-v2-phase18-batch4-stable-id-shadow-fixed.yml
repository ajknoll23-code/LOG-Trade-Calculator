            research/identity-v2/identity_v2_phase18_batch4_seeded_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase18_batch4_manifest.json

          git diff --cached --check
          git commit -m "Freeze Identity V2 Phase 18 Batch 4 stable-ID shadow"
          git push origin HEAD:main
