          }
          (D/"identity_v2_phase18_batch4_manifest.json").write_text(
              json.dumps(m,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A11 manifest frozen.")
          PY

      - name: Prove research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          prefix="research/identity-v2/"
          allowed={
              prefix+"identity_v2_phase18_batch4_preregistration.json",
              prefix+"identity_v2_phase18_batch4_second_source_snapshot.json",
              prefix+"identity_v2_phase18_batch4_stable_id_shadow.json",
              prefix+"identity_v2_phase18_batch4_stable_id_shadow.md",
              prefix+"identity_v2_phase18_batch4_direct_candidate_crosswalk.json",
              prefix+"identity_v2_phase18_batch4_control_refresh_crosswalk.json",
              prefix+"identity_v2_phase18_batch4_seeded_refresh_crosswalk.json",
              prefix+"identity_v2_phase18_batch4_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "scripts/identity_crosswalk.json" not in touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: A11 writes research artifacts only.")
          PY

