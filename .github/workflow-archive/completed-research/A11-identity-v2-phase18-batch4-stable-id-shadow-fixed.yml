        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit A11 research artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A11."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase18_batch4_preregistration.json \
            research/identity-v2/identity_v2_phase18_batch4_second_source_snapshot.json \
            research/identity-v2/identity_v2_phase18_batch4_stable_id_shadow.json \
