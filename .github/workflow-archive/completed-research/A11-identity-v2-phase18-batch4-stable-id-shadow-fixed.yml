              "identity_v2_phase18_batch4_control_refresh_crosswalk.json",
              "identity_v2_phase18_batch4_seeded_refresh_crosswalk.json"
          ]
          m={
              "schema_version":1,
              "study_id":"identity-v2-phase18-batch4-three-player-stable-id-shadow",
              "decision":r["decision"],
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "files":{f:sha(D/f) for f in files},
              "passing_fpids":r["passing_fpids"],
