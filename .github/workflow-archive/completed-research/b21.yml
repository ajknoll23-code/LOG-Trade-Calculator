# PREFLIGHTED: B21_LAYER_D_HISTORICAL_CALIBRATION_EXECUTION
name: B21 Draft Capital Outlook V1 - Layer D Historical Calibration Execution

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b21_layer_d_historical_calibration_execution:
    name: Execute frozen Layer D historical calibration
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen analysis and regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" \
            "requests==2.32.5"

      - name: Guard exact B20 preregistration and upstream historical inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          B18=D/"b18"
          B19=D/"b19"
          B20=D/"b20"
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          cfgp=B18/"b18_config.json"
          c1p=B19/"c1_result.json"
          tablep=B19/"historical_capital_table.csv"
          p20=B20/"b20_layer_d_preregistration.json"
          m20=B20/"b20_manifest.json"
          for p in (cfgp,c1p,tablep,p20,m20):
              assert p.is_file(), p

          assert sha(cfgp)=="6c6706bd65059a8eb04ac66bf43a2a27810b93984ab90e336f3b9e1bd33b390e"
          assert sha(c1p)=="75bfbc0b396238f61caa6b0d1d3c963b0dc1df5ea555f4e1962986369bc6b4d0"
          assert sha(tablep)=="104318a6efd9e9edc1eb29a37a7dc39891eb3e073e45f44a399cc95ac11a4883"
          assert sha(p20)=="aaf76bedd505295286de31a26260928288ee3ca2dbea48df6a22dd770f8b6fa7"

          cfg=json.loads(cfgp.read_text())
          c1=json.loads(c1p.read_text())
          P=json.loads(p20.read_text())
          M=json.loads(m20.read_text())

          assert c1["decision"]=="C1_STRONG"
          assert c1["classification"]=="STRONG"
          assert c1["G1"]["pass"] is True and c1["G2"]["pass"] is True and c1["G3"]["pass"] is True
          assert c1["downstream_authority"]=="AUTHORIZE_SEPARATE_LAYER_D_SHADOW_CALIBRATION_STUDY_ONLY_NO_PRODUCTION"
          assert c1["production_change_authorized"] is False
          assert c1["2027_class_scored"] is False

          assert cfg["downstream_authority"]["maximum_future_initial_shadow_multiplier_deviation"]==0.03
          assert cfg["objective"]["model_or_target_shopping_after_c1_allowed"] is False
          assert cfg["objective"]["post_c1_gate_movement_allowed"] is False

          assert P["decision"]=="PREREGISTER_LAYER_D_SHADOW_CALIBRATION_AUTHORIZE_B21_HISTORICAL_EXECUTION_ONLY"
          assert P["historical_calibration_cohort"]["class_years"]==list(range(2013,2024))
          assert P["historical_calibration_cohort"]["class_n"]==11
          assert P["historical_calibration_cohort"]["input_table_sha256"]==sha(tablep)
          assert P["layer_d_mapping"]["hard_multiplier_bounds"]==[0.97,1.03]
          assert P["layer_d_mapping"]["percentage_points_per_score_unit"]==0.015
          assert P["layer_d_mapping"]["score_clip"]==[-2.0,2.0]
          assert P["b21_execution_protocol"]["execution_count_authorized"]==1
          assert P["b21_execution_protocol"]["historical_only"] is True
          assert P["b21_execution_protocol"]["2027_source_content_may_be_read"] is False
          assert P["b21_execution_protocol"]["2027_class_may_be_scored"] is False
          assert P["b21_execution_protocol"]["production_files_may_be_modified"] is False
          G=P["b21_acceptance_gates"]
          assert G["D2_loo_direction"]["minimum_agreements"]==8
          assert G["D2_loo_direction"]["denominator"]==11
          assert G["D3_loo_rank"]["alpha"]==0.15
          assert G["D3_loo_rank"]["permutations"]==99999
          assert G["D3_loo_rank"]["seed"]==200000
          assert G["D4_single_class_mapping_stability"]["maximum_absolute_difference"]==0.01
          assert G["D5_historical_saturation"]["maximum_saturated_classes"]==2
          assert G["D5_historical_saturation"]["denominator"]==11
          assert G["joint_pass"]=="D1 AND D2 AND D3 AND D4 AND D5"
          assert P["epistemic_status"]["gate_or_mapping_tuning_after_b21_results_allowed"] is False

          assert M["protocol_sha256"]==sha(p20)
          assert M["b21_historical_execution_authorized"] is True
          assert M["b21_execution_count_authorized"]==1
          assert M["b21_gate_metrics_computed"] is False
          assert M["historical_shadow_multipliers_computed"] is False
          assert M["2027_source_content_read"] is False
          assert M["2027_class_scored"] is False
          assert M["production_change_authorized"] is False

          assert not (D/"b21/b21_historical_calibration.json").exists(), \
              "B21 historical calibration already committed; one-shot gate is closed"
          print("PASS: exact B20 protocol, B19 historical table, and one-shot B21 authority verified.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute frozen B21 Layer D historical calibration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b21
          python3 - <<'PY'
          import csv, hashlib, json, math
          from pathlib import Path
          import numpy as np

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b21"
          tablep=D/"b19/historical_capital_table.csv"
          p20=D/"b20/b20_layer_d_preregistration.json"
          P=json.loads(p20.read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          assert sha(tablep)==P["historical_calibration_cohort"]["input_table_sha256"]
          assert sha(p20)=="aaf76bedd505295286de31a26260928288ee3ca2dbea48df6a22dd770f8b6fa7"

          rows=[]
          with tablep.open(newline="") as f:
              r=csv.DictReader(f)
              need={"class_year","projected_capital","actual_capital","ln_projected","ln_actual",
                    "projected_fantasy_rows","actual_fantasy_rows"}
              assert set(r.fieldnames or [])==need, r.fieldnames
              for z in r:
                  year=int(z["class_year"])
                  pc=float(z["projected_capital"])
                  ac=float(z["actual_capital"])
                  x=float(z["ln_projected"])
                  y=float(z["ln_actual"])
                  assert pc>0 and ac>0 and math.isfinite(x) and math.isfinite(y)
                  assert abs(math.log(pc)-x)<=1e-12
                  assert abs(math.log(ac)-y)<=1e-12
                  rows.append({
                      "class_year":year,
                      "projected_capital":pc,
                      "actual_capital":ac,
                      "x":x,
                      "y":y,
                      "projected_fantasy_rows":int(z["projected_fantasy_rows"]),
                      "actual_fantasy_rows":int(z["actual_fantasy_rows"]),
                  })

          rows.sort(key=lambda z:z["class_year"])
          years=[z["class_year"] for z in rows]
          assert years==list(range(2013,2024))
          assert len(rows)==11
          x=np.array([z["x"] for z in rows],dtype=float)
          y=np.array([z["y"] for z in rows],dtype=float)

          def fit_mapping(xtr,ytr):
              xtr=np.asarray(xtr,dtype=float); ytr=np.asarray(ytr,dtype=float)
              assert len(xtr)==len(ytr) and len(xtr)>=3
              xm=float(np.mean(xtr)); ym=float(np.mean(ytr))
              den=float(np.sum((xtr-xm)**2))
              assert den>0 and math.isfinite(den)
              b_unc=float(np.sum((xtr-xm)*(ytr-ym))/den)
              b=max(0.0,b_unc)
              a=ym-b*xm
              x0=float(np.median(xtr))
              sy=float(np.std(ytr,ddof=1))
              assert sy>0 and all(math.isfinite(v) for v in (a,b,b_unc,x0,sy))
              return {"a":a,"b":b,"b_unconstrained":b_unc,"x0":x0,"s_y":sy}

          def score_one(fit,xv):
              z=(fit["b"]*(float(xv)-fit["x0"]))/fit["s_y"]
              zc=max(-2.0,min(2.0,z))
              m=1.0+0.015*zc
              # Enforce the preregistered hard bound exactly so boundary saturation is unambiguous.
              m=max(0.97,min(1.03,m))
              assert math.isfinite(z) and math.isfinite(m)
              return {"z":z,"z_clipped":zc,"multiplier":m}

          def rank_average(v):
              v=np.asarray(v,dtype=float)
              order=np.argsort(v,kind="mergesort")
              ranks=np.empty(len(v),dtype=float)
              i=0
              while i<len(v):
                  j=i+1
                  while j<len(v) and v[order[j]]==v[order[i]]:
                      j+=1
                  avg=(i+1+j)/2.0
                  ranks[order[i:j]]=avg
                  i=j
              return ranks

          def pearson(a,b):
              a=np.asarray(a,dtype=float); b=np.asarray(b,dtype=float)
              da=a-a.mean(); db=b-b.mean()
              den=float(np.sqrt(np.sum(da*da)*np.sum(db*db)))
              if den==0:
                  return 0.0
              return float(np.sum(da*db)/den)

          def spearman(a,b):
              return pearson(rank_average(a),rank_average(b))

          def sign(v):
              if v>0: return 1
              if v<0: return -1
              return 0

          # Full fit and frozen 5-point order-statistic stability grid.
          full=fit_mapping(x,y)
          full_scores=[score_one(full,v) for v in x]
          sx=np.sort(x)
          grid_indices=[0,2,5,8,10]
          grid=[float(sx[i]) for i in grid_indices]
          full_grid=[score_one(full,v)["multiplier"] for v in grid]

          # D1 begins with the required full-fit positive slope/outcome scale.
          # The all-produced-multiplier integrity clause is finalized after LOO and deletion grids exist.
          all_full_values=[s["multiplier"] for s in full_scores]+full_grid

          # LOO scoring for D2/D3.
          loo=[]
          for i,row in enumerate(rows):
              keep=np.arange(len(rows))!=i
              f=fit_mapping(x[keep],y[keep])
              sc=score_one(f,x[i])
              ymed=float(np.median(y[keep]))
              pred_dir=sign(sc["multiplier"]-1.0)
              target_dir=sign(y[i]-ymed)
              agree=(pred_dir==target_dir) if (pred_dir!=0 and target_dir!=0) else (pred_dir==0 and target_dir==0)
              loo.append({
                  "class_year":row["class_year"],
                  "fit_a":f["a"],
                  "fit_b":f["b"],
                  "fit_b_unconstrained":f["b_unconstrained"],
                  "fit_x0":f["x0"],
                  "fit_s_y":f["s_y"],
                  "heldout_x":float(x[i]),
                  "heldout_y":float(y[i]),
                  "training_y_median":ymed,
                  "z":sc["z"],
                  "z_clipped":sc["z_clipped"],
                  "multiplier":sc["multiplier"],
                  "predicted_direction":pred_dir,
                  "target_direction":target_dir,
                  "direction_agreement":bool(agree),
              })

          agreements=sum(1 for z in loo if z["direction_agreement"])
          d2=(agreements>=8)

          loo_m=np.array([z["multiplier"] for z in loo],dtype=float)
          obs_rho=spearman(loo_m,y)
          mr=rank_average(loo_m)
          yr=rank_average(y)
          rng=np.random.default_rng(200000)
          B=99999
          ge=0
          chunk=5000
          done=0
          while done<B:
              m=min(chunk,B-done)
              # Independent uniform random keys yield uniformly random permutations almost surely.
              perm_idx=np.argsort(rng.random((m,len(y))),axis=1)
              yp=yr[perm_idx]
              ma=mr-mr.mean()
              ypc=yp-yp.mean(axis=1,keepdims=True)
              den=np.sqrt(np.sum(ma*ma)*np.sum(ypc*ypc,axis=1))
              rho_perm=np.divide(ypc@ma,den,out=np.zeros(m,dtype=float),where=den>0)
              ge += int(np.count_nonzero(rho_perm>=obs_rho))
              done += m
          p=(1+ge)/(B+1)
          d3=(obs_rho>0 and p<=0.15)

          # D4: delete each class, refit, evaluate same frozen full-sample grid.
          deletion=[]
          max_delta=0.0
          for i,row in enumerate(rows):
              keep=np.arange(len(rows))!=i
              f=fit_mapping(x[keep],y[keep])
              gm=[score_one(f,v)["multiplier"] for v in grid]
              deltas=[abs(a-b) for a,b in zip(gm,full_grid)]
              local=max(deltas)
              max_delta=max(max_delta,local)
              deletion.append({
                  "deleted_class_year":row["class_year"],
                  "fit_a":f["a"],
                  "fit_b":f["b"],
                  "fit_b_unconstrained":f["b_unconstrained"],
                  "fit_x0":f["x0"],
                  "fit_s_y":f["s_y"],
                  "grid_multipliers":gm,
                  "absolute_deltas_vs_full":deltas,
                  "max_abs_delta":local,
              })
          d4=(max_delta<=0.01)

          # Finalize D1 across every produced historical/grid multiplier, including LOO and deletion grids.
          all_produced_values=(all_full_values +
                               [z["multiplier"] for z in loo] +
                               [v for z in deletion for v in z["grid_multipliers"]])
          d1=(full["b"]>0 and full["s_y"]>0 and
              all(math.isfinite(v) and 0.97<=v<=1.03 for v in all_produced_values))

          # D5: exact hard-bound saturation after clipping.
          saturated=[rows[i]["class_year"] for i,s in enumerate(full_scores)
                     if s["multiplier"] in (0.97,1.03)]
          d5=(len(saturated)<=2)

          joint=bool(d1 and d2 and d3 and d4 and d5)
          decision=(
              "PASS_LAYER_D_HISTORICAL_CALIBRATION_AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY"
              if joint else
              "STOP_LAYER_D_SHADOW_PATH_KEEP_DRAFT_CAPITAL_OUTLOOK_NEUTRAL_1_00"
          )

          result={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b21_layer_d_historical_calibration",
              "decision":decision,
              "joint_pass":joint,
              "historical_class_years":years,
              "historical_class_n":11,
              "input_table_sha256":sha(tablep),
              "b20_protocol_sha256":sha(p20),
              "full_fit":{
                  **full,
                  "stability_grid_x":grid,
                  "stability_grid_multipliers":full_grid,
              },
              "D1_numerical_monotonicity":{
                  "pass":bool(d1),
                  "full_fit_clipped_slope_b":full["b"],
                  "full_fit_unconstrained_slope_b":full["b_unconstrained"],
                  "s_y":full["s_y"],
                  "all_historical_and_grid_multipliers_within_bounds":bool(all(math.isfinite(v) and 0.97<=v<=1.03 for v in all_produced_values)),
                  "produced_multiplier_count_checked":len(all_produced_values),
              },
              "D2_loo_direction":{
                  "pass":bool(d2),
                  "agreement_count":agreements,
                  "required_minimum":8,
                  "denominator":11,
                  "rows":loo,
              },
              "D3_loo_rank":{
                  "pass":bool(d3),
                  "spearman_rho":obs_rho,
                  "permutation_count":B,
                  "permuted_ge_observed":ge,
                  "permutation_p":p,
                  "alpha":0.15,
                  "seed":200000,
              },
              "D4_single_class_mapping_stability":{
                  "pass":bool(d4),
                  "maximum_allowed_absolute_difference":0.01,
                  "max_abs_delta":max_delta,
                  "deletions":deletion,
              },
              "D5_historical_saturation":{
                  "pass":bool(d5),
                  "maximum_saturated_classes":2,
                  "saturation_count":len(saturated),
                  "saturated_class_years":saturated,
              },
              "mapping":P["layer_d_mapping"],
              "downstream_authority":(
                  "AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY"
                  if joint else "NONE_KEEP_NEUTRAL_1_00"
              ),
              "2027_source_content_read":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "direct_production_authority":False,
              "gate_or_mapping_tuning_after_result_allowed":False,
          }

          # Full-fit historical table plus LOO diagnostics.
          outcsv=O/"b21_historical_shadow_table.csv"
          with outcsv.open("w",newline="") as f:
              w=csv.writer(f,lineterminator="\n")
              w.writerow(["class_year","x","y","full_z","full_z_clipped","full_multiplier",
                          "loo_multiplier","target_direction","predicted_direction","direction_agreement"])
              for i,row in enumerate(rows):
                  fs=full_scores[i]; ls=loo[i]
                  w.writerow([row["class_year"],row["x"],row["y"],fs["z"],fs["z_clipped"],fs["multiplier"],
                              ls["multiplier"],ls["target_direction"],ls["predicted_direction"],int(ls["direction_agreement"])])

          (O/"b21_historical_calibration.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          inputs={
              "b20_layer_d_preregistration.json":sha(p20),
              "b19_historical_capital_table.csv":sha(tablep),
              "b19_c1_result.json":sha(D/"b19/c1_result.json"),
              "b18_config.json":sha(D/"b18/b18_config.json"),
          }
          (O/"b21_input_hashes.json").write_text(json.dumps(inputs,indent=2,sort_keys=True)+"\n")

          report=[
              "# Draft Capital Outlook V1 — B21 Layer D Historical Calibration",
              "",
              f"Decision: **{decision}**",
              "",
              f"- D1 numerical monotonicity: {'PASS' if d1 else 'FAIL'}",
              f"- D2 LOO direction: {'PASS' if d2 else 'FAIL'} — {agreements}/11 agreements",
              f"- D3 LOO rank: {'PASS' if d3 else 'FAIL'} — rho={obs_rho:.6f}, p={p:.6f}",
              f"- D4 single-class mapping stability: {'PASS' if d4 else 'FAIL'} — max delta={max_delta:.6f}",
              f"- D5 historical saturation: {'PASS' if d5 else 'FAIL'} — {len(saturated)}/11 saturated",
              "",
              f"- Full-fit slope b: {full['b']:.9f}",
              f"- Full-fit unconstrained slope b: {full['b_unconstrained']:.9f}",
              f"- Full-fit outcome scale s_y: {full['s_y']:.9f}",
              "",
              "2027 source content read: **NO**",
              "2027 class scored: **NO**",
              "Production change authorized: **NO**",
              "",
              "A PASS authorizes only a separate preregistration for exact 2027 source identity/comparability and one research-only shadow score. It does not authorize direct 2027 scoring or production.",
              "",
          ]
          (O/"b21_report.md").write_text("\n".join(report))

          print(json.dumps({
              "decision":decision,
              "joint_pass":joint,
              "D1":d1,"D2":d2,"D3":d3,"D4":d4,"D5":d5,
              "direction_agreements":agreements,
              "spearman_rho":obs_rho,
              "spearman_p":p,
              "max_mapping_delta":max_delta,
              "saturation_count":len(saturated),
          },indent=2))
          PY

      - name: Build immutable B21 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          O=Path("research/draft-capital-outlook-v1/b21")
          R=json.loads((O/"b21_historical_calibration.json").read_text())
          core=[
              "b21_historical_calibration.json",
              "b21_historical_shadow_table.csv",
              "b21_input_hashes.json",
              "b21_report.md",
          ]
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          hashes={n:sha(O/n) for n in core}
          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b21_manifest",
              "decision":R["decision"],
              "joint_pass":R["joint_pass"],
              "b21_executed":True,
              "b21_execution_count_committed":1,
              "historical_shadow_multipliers_computed":True,
              "2027_source_content_read":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "direct_production_authority":False,
              "output_hashes":hashes,
          }
          (O/"b21_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Verify B21 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed="research/draft-capital-outlook-v1/b21/"
          out=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True)
          paths=[]
          for line in out.splitlines():
              p=line[3:]
              if " -> " in p:
                  p=p.split(" -> ",1)[1]
              paths.append(p)
          assert paths, "B21 produced no outputs"
          bad=[p for p in paths if not p.startswith(allowed)]
          assert not bad, f"Non-B21 mutation detected: {bad}"
          print(f"PASS: research-only mutation scope ({len(paths)} B21 files).")
          PY

      - name: Run repository regression after B21 without losing research outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b21-preserve
          cp -a research/draft-capital-outlook-v1/b21 /tmp/b21-preserve
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          mkdir -p research/draft-capital-outlook-v1
          cp -a /tmp/b21-preserve research/draft-capital-outlook-v1/b21

      - name: Final B21 scientific firewall and reproducibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b21"
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          P=json.loads((D/"b20/b20_layer_d_preregistration.json").read_text())
          R=json.loads((O/"b21_historical_calibration.json").read_text())
          M=json.loads((O/"b21_manifest.json").read_text())

          assert sha(D/"b20/b20_layer_d_preregistration.json")=="aaf76bedd505295286de31a26260928288ee3ca2dbea48df6a22dd770f8b6fa7"
          assert sha(D/"b19/historical_capital_table.csv")=="104318a6efd9e9edc1eb29a37a7dc39891eb3e073e45f44a399cc95ac11a4883"
