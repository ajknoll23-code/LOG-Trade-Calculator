      - name: Commit B21 historical calibration result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "origin/main moved during B21; aborting commit without changing scientific result"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v1/b21
          git diff --cached --check
