name: B14 V2 Draft Class Strength - Residual Closeout and 2027 Anchor Archive Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  closeout_and_preregister:
    name: B14 V2 freeze B13 residual stop and preregister prospective archive
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B14 V2 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact B13 residual-channel result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-class-strength-v2")
          m=json.loads((D/"b13_manifest.json").read_text())
          r=json.loads((D/"b13_result.json").read_text())
          p=json.loads((D/"b13_primary_gate_frozen.json").read_text())
          w=json.loads((D/"b13_power_diagnostic.json").read_text())
          d=json.loads((D/"b13_non_gating_diagnostics.json").read_text())

          assert m["decision"]=="STOP_B13_V2_TARGET_UNDERPOWERED_NEUTRAL_1_00"
          assert m["primary_pass"] is False
          assert m["predictor_source_feasibility_authorized"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          for name,expected in m["output_hashes"].items():
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          assert r["decision"]=="STOP_B13_V2_TARGET_UNDERPOWERED_NEUTRAL_1_00"
          assert r["primary_pass"] is False
          assert abs(float(r["primary_p_value"])-0.628907421851563)<1e-15
          assert abs(float(r["observed_variance"])-0.02030603950078805)<1e-15
          assert abs(float(r["primary_null_mean_variance"])-0.025869520739222315)<1e-15
          assert float(r["excess_class_variance_ratio"])==0.0
          assert r["bootstrap_80_interval"]==[0.0,0.5465132782372489]
          assert abs(float(r["power_at_effect_sd_0_08"])-0.0865)<1e-15
          assert r["adequately_powered_at_effect_sd_0_08"] is False
          assert r["predictor_source_feasibility_authorized"] is False
          assert r["predictor_fit_performed"] is False
          assert r["2027_class_scored"] is False
          assert r["production_change_authorized"] is False
          assert r["neutral_multiplier_if_stopped"]==1.0

          assert p["primary_verdict_frozen_before_power_and_diagnostics"] is True
          assert p["gate_components"]=={
              "bootstrap_80_lower":False,
              "complete_classes":True,
              "excess_ratio":False,
              "p_value":False,
          }
          assert w["cannot_rescue_primary_failure"] is True
          assert d["all_diagnostics_non_gating"] is True
          assert d["primary_verdict_was_frozen_before_diagnostics"] is True

          print("PASS: exact B13 residual-channel result guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze residual-channel scientific closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-class-strength-v2")
          r=json.loads((D/"b13_result.json").read_text())
          p=json.loads((D/"b13_primary_gate_frozen.json").read_text())

          closeout={
              "schema_version":2,
              "study_id":"draft-class-strength-v2",
              "stage":"b14_v2_residual_channel_closeout",
              "decision":"CLOSE_B13_RESIDUAL_CHANNEL_AT_NEUTRAL_1_00_NO_REDESIGN_ON_2014_2023",

              "what_b13_tested":{
                  "construct":"Residual class-level H3.O2 variation after conditioning on each class's NFL top-60 fantasy-position draft-capital composition.",
                  "historical_years":list(range(2014,2024)),
                  "class_n":10,
                  "player_n":188,
                  "interpretation":"This is a residual/beyond-draft-capital question. It is not a test of unconditional fantasy-relevant draft-capital composition strength."
              },

              "frozen_b13_result":{
                  "primary_pass":False,
                  "observed_variance":r["observed_variance"],
                  "primary_null_mean_variance":r["primary_null_mean_variance"],
                  "primary_p_value":r["primary_p_value"],
                  "excess_class_variance_ratio":r["excess_class_variance_ratio"],
                  "bootstrap_80_interval":r["bootstrap_80_interval"],
                  "power_at_effect_sd_0_08":r["power_at_effect_sd_0_08"],
                  "adequately_powered_at_effect_sd_0_08":False,
                  "point_estimate_interpretation":"Observed between-class variance was below the primary null mean; estimated excess variance is zero."
              },

              "permanent_boundaries":{
                  "production_multiplier_for_residual_channel":1.0,
                  "production_change_authorized":False,
                  "predictor_source_feasibility_authorized":False,
                  "predictor_fit_authorized":False,
                  "2027_residual_class_score_authorized":False,
                  "retarget_2014_2023_for_decision_authority":False,
                  "change_b13_null_for_decision_authority":False,
                  "relax_b13_gate":False,
                  "fit_predictors_to_rescue_b13":False,
                  "reinterpret_future_composition_success_as_b13_pass":False
              },

              "allowed_exploratory_design_stage_work":{
                  "decision_authority":False,
                  "allowed":[
                      "Class-blind pooled outcome-distribution diagnostics.",
                      "Continuous NFL draft-pick plus position expected-value modeling.",
                      "Hierarchical/random-effects estimation of residual class variance, ICC, and uncertainty.",
                      "Exact simulation-based power studies.",
                      "Descriptive decomposition of composition vs residual channels.",
                      "Split-half reliability diagnostics with fixed randomization."
                  ],
                  "forbidden_claim":"No exploratory 2014-2023 analysis may authorize predictor fitting, 2027 scoring, a production multiplier, or be labeled independent confirmation."
              },

              "next_construct":{
                  "study_id":"draft-capital-outlook-v1",
                  "status":"SEPARATE_NEW_CONSTRUCT",
                  "question":"Can timestamped pre-draft information predict a class's eventual fantasy-relevant NFL draft-capital composition out of sample?",
                  "not_a_rescue_of_b13":True,
                  "production_authority_from_this_closeout":False
              },

              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }

          (D/"b14_v2_residual_channel_closeout.json").write_text(
              json.dumps(closeout,indent=2,sort_keys=True)+"\n"
          )

          report=[
              "# Draft Class Strength V2 — B14 V2 Residual-Channel Closeout",
              "",
              "## Frozen conclusion",
              "",
              "B13 remains a negative residual-channel result.",
              "",
              f'- permutation p: {r["primary_p_value"]}',
              f'- observed variance: {r["observed_variance"]}',
              f'- null mean variance: {r["primary_null_mean_variance"]}',
              f'- excess class variance ratio: {r["excess_class_variance_ratio"]}',
              f'- bootstrap 80% interval: {r["bootstrap_80_interval"]}',
              f'- power at effect SD 0.08: {r["power_at_effect_sd_0_08"]}',
              "",
              "Residual-channel multiplier remains 1.00.",
              "",
              "## What is closed",
              "",
              "No further 2014–2023 target/null/gate redesign can carry decision authority for B13.",
              "",
              "## What remains allowed",
              "",
              "Class-blind exploratory design-stage work is allowed only to improve future study design.",
              "",
              "A separate prospective construct, Draft Capital Outlook V1, may study whether pre-draft information forecasts eventual fantasy-relevant NFL draft-capital composition.",
              "Success there must never be represented as a B13 pass.",
              ""
          ]
          (D/"b14_v2_residual_channel_closeout_report.md").write_text("\n".join(report))

          names=[
              "b14_v2_residual_channel_closeout.json",
              "b14_v2_residual_channel_closeout_report.md"
          ]
          manifest={
              "schema_version":2,
              "study_id":"draft-class-strength-v2",
              "stage":"b14_v2_residual_closeout_manifest",
              "decision":closeout["decision"],
              "output_hashes":{
                  n:hashlib.sha256((D/n).read_bytes()).hexdigest()
                  for n in names
              },
              "residual_channel_neutral_multiplier":1.0,
              "draft_capital_outlook_v1_may_preregister_archive":True,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b14_v2_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("PASS: B13 residual channel permanently frozen at neutral 1.00.")
          PY

      - name: Preregister 2027 prospective anchor archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")

          prereg={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b14_v2_2027_anchor_archive_preregistration",
              "decision":"PREREGISTER_2027_POINT_IN_TIME_ARCHIVE_B15_CAPTURE_NEXT",

              "scientific_separation":{
                  "separate_from_draft_class_strength_v2":True,
                  "b13_may_not_be_reinterpreted":True,
                  "new_construct":"Prospective forecast of fantasy-relevant NFL draft-capital composition.",
                  "residual_h3_outcome_not_the_target":True,
                  "production_authority":False
              },

              "anchor_window":{
                  "class_year":2027,
                  "window_start":"2026-09-15T00:00:00Z",
                  "window_end":"2026-10-16T06:59:59Z",
                  "description":"Sept 15 through Oct 15, 2026 Arizona-local calendar window, represented conservatively in UTC.",
                  "capture_timestamp_required":True,
                  "raw_content_hash_required":True,
                  "retrieval_url_required":True,
                  "source_publication_date_required_when_available":True,
                  "snapshot_or_raw_response_required":True
              },

              "archive_purpose":{
                  "primary":"Preserve what was knowable about the 2027 prospect class during the preregistered anchor window before later NFL outcomes/draft results can influence source selection.",
                  "secondary":"Create a timestamp-verifiable source ledger for later feasibility and prospective composition-channel research.",
                  "not_allowed":"The archive itself cannot score 2027, fit predictors, select a production multiplier, or authorize production."
              },

              "eligible_source_categories":[
                  {
                      "category":"consensus_or_public_big_board",
                      "examples_are_non_binding":True,
                      "capture_fields":["rank","player_name","position","school","projected_or_consensus_grade_if_present","source_date"]
                  },
                  {
                      "category":"mock_draft_or_mock_consensus",
                      "examples_are_non_binding":True,
                      "capture_fields":["player_name","position","projected_overall_pick","team_if_present","source_date"]
                  },
                  {
                      "category":"devy_or_dynasty_prospect_ranking",
                      "examples_are_non_binding":True,
                      "capture_fields":["rank","player_name","position","school","class_year_if_present","source_date"]
                  },
                  {
                      "category":"projected_nfl_draft_capital",
                      "examples_are_non_binding":True,
                      "capture_fields":["player_name","position","projected_overall_pick_or_round","source_date"]
                  }
              ],

              "source_eligibility_rules":{
                  "must_be_publicly_accessible_or_archivable_by_repository_workflow":True,
                  "must_be_observable_inside_anchor_window":True,
                  "must_represent_information_available_at_capture_time":True,
                  "cannot_be_selected_using_later_nfl_draft_accuracy":True,
                  "cannot_be_selected_using_later_fantasy_outcomes":True,
                  "cannot_be_selected_using_2027_model_score":True,
                  "later_edits_require_preserved_original_snapshot":True,
                  "paywalled_or_login_only_source":"May be inventoried as unavailable, but cannot be treated as captured unless a lawful reproducible snapshot is stored."
              },

              "b15_capture_protocol":{
                  "authorized":True,
                  "scope":"Source discovery, feasibility logging, raw timestamped capture, parsing, hashing, and identity normalization only.",
                  "must_capture_all_feasible_sources_that_meet_frozen_eligibility_within_discovered_catalog":True,
                  "source_drop_requires_recorded_reason":True,
                  "raw_before_parse":True,
                  "no_future_accuracy_filter":True,
                  "no_outcome_reading":True,
                  "no_model_fit":True,
                  "no_2027_score":True,
                  "no_production_change":True
              },

              "ledger_schema":{
                  "required_fields":[
                      "source_id",
                      "source_name",
                      "source_category",
                      "retrieval_url",
                      "capture_timestamp_utc",
                      "publication_timestamp_or_date",
                      "raw_file_path",
                      "raw_sha256",
                      "parser_version",
                      "parsed_file_path",
                      "parsed_sha256",
                      "capture_status",
                      "drop_reason_if_any"
                  ],
                  "capture_status_allowed":[
                      "CAPTURED",
                      "UNAVAILABLE",
                      "BLOCKED",
                      "NO_TIMESTAMP_EVIDENCE",
                      "OUTSIDE_ANCHOR_WINDOW",
                      "NOT_REPRODUCIBLE"
                  ]
              },

              "future_c1_boundary":{
                  "c1_not_preregistered_by_b14_v2":True,
                  "reason":"C1 model/target/gates must wait for B15 archive/source-feasibility results; B14 V2 only freezes the prospective data-preservation protocol.",
                  "minimum_historical_snapshot_classes_not_assumed":True,
                  "future_power_gate_required_before_any_confirmatory_execution":True,
                  "future_target_must_measure_composition_channel_not_b13_residual_channel":True,
                  "future_model_must_be_low_capacity_and_out_of_sample":True,
                  "2024_2026_h3_outcomes_remain_unopened_for_this_construct":True
              },

              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }

          (D/"b14_v2_2027_anchor_archive_preregistration.json").write_text(
              json.dumps(prereg,indent=2,sort_keys=True)+"\n"
          )

          ledger={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b14_v2_empty_archive_ledger_template",
              "anchor_class_year":2027,
              "anchor_window_start":"2026-09-15T00:00:00Z",
              "anchor_window_end":"2026-10-16T06:59:59Z",
              "sources":[],
              "archive_complete":False,
              "b15_capture_required":True,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b14_v2_2027_anchor_archive_ledger_template.json").write_text(
              json.dumps(ledger,indent=2,sort_keys=True)+"\n"
          )

          report=[
              "# Draft Capital Outlook V1 — 2027 Anchor Archive Preregistration",
              "",
              "This is a separate construct from B13.",
              "",
              "## Purpose",
              "",
              "Preserve timestamped point-in-time evidence about the 2027 prospect class during the Sept 15–Oct 15, 2026 anchor window.",
              "",
              "## B15 may do",
              "",
              "- discover eligible sources",
              "- record feasibility",
              "- capture raw point-in-time content",
              "- hash raw content",
              "- parse fields",
              "- normalize identities",
              "- freeze a source ledger",
              "",
              "## B15 may not do",
              "",
              "- fit a model",
              "- score 2027",
              "- use future NFL draft results to pick sources",
              "- use fantasy outcomes",
              "- change production",
              "",
              "A later C1 preregistration is required before any composition-channel model is executed.",
              ""
          ]
          (D/"b14_v2_2027_anchor_archive_preregistration_report.md").write_text("\n".join(report))

          names=[
              "b14_v2_2027_anchor_archive_preregistration.json",
              "b14_v2_2027_anchor_archive_ledger_template.json",
              "b14_v2_2027_anchor_archive_preregistration_report.md"
          ]
          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b14_v2_archive_manifest",
              "decision":"PASS_B14_V2_2027_ARCHIVE_PREREGISTRATION_FROZEN_B15_CAPTURE_NEXT",
              "output_hashes":{
                  n:hashlib.sha256((D/n).read_bytes()).hexdigest()
                  for n in names
              },
              "b15_capture_authorized":True,
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b14_v2_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("PASS: 2027 prospective archive protocol frozen; B15 capture authorized only.")
          PY

      - name: Validate B14 V2 cross-study firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          R=Path("research/draft-class-strength-v2")
          A=Path("research/draft-capital-outlook-v1")

          rc=json.loads((R/"b14_v2_residual_channel_closeout.json").read_text())
          rm=json.loads((R/"b14_v2_manifest.json").read_text())
          ap=json.loads((A/"b14_v2_2027_anchor_archive_preregistration.json").read_text())
          am=json.loads((A/"b14_v2_manifest.json").read_text())
          ledger=json.loads((A/"b14_v2_2027_anchor_archive_ledger_template.json").read_text())

          assert rc["decision"]=="CLOSE_B13_RESIDUAL_CHANNEL_AT_NEUTRAL_1_00_NO_REDESIGN_ON_2014_2023"
          assert rc["permanent_boundaries"]["production_multiplier_for_residual_channel"]==1.0
          assert rc["permanent_boundaries"]["reinterpret_future_composition_success_as_b13_pass"] is False
          assert rc["allowed_exploratory_design_stage_work"]["decision_authority"] is False
          assert rc["next_construct"]["study_id"]=="draft-capital-outlook-v1"
          assert rc["next_construct"]["not_a_rescue_of_b13"] is True

          assert ap["scientific_separation"]["separate_from_draft_class_strength_v2"] is True
          assert ap["scientific_separation"]["b13_may_not_be_reinterpreted"] is True
          assert ap["b15_capture_protocol"]["authorized"] is True
          assert ap["b15_capture_protocol"]["no_outcome_reading"] is True
          assert ap["b15_capture_protocol"]["no_model_fit"] is True
          assert ap["b15_capture_protocol"]["no_2027_score"] is True
          assert ap["b15_capture_protocol"]["no_production_change"] is True
          assert ap["future_c1_boundary"]["c1_not_preregistered_by_b14_v2"] is True
          assert ap["future_c1_boundary"]["future_power_gate_required_before_any_confirmatory_execution"] is True
          assert ap["future_c1_boundary"]["2024_2026_h3_outcomes_remain_unopened_for_this_construct"] is True

          assert ledger["sources"]==[]
          assert ledger["archive_complete"] is False
          assert ledger["b15_capture_required"] is True

          assert rm["draft_capital_outlook_v1_may_preregister_archive"] is True
          assert am["b15_capture_authorized"] is True
          assert am["c1_model_preregistration_authorized"] is False

          for obj in (rc,rm,ap,am,ledger):
              assert obj["predictor_fit_performed"] is False
              assert obj["2027_class_scored"] is False
              assert obj["production_change_authorized"] is False

          for D,m in ((R,rm),(A,am)):
              for name,expected in m["output_hashes"].items():
                  got=hashlib.sha256((D/name).read_bytes()).hexdigest()
                  assert got==expected,(D,name,expected,got)

          print("PASS: cross-study firewall validated; archive-only authority preserved.")
          PY

      - name: Run post-B14 V2 repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove B14 V2 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched

          allowed=(
              "research/draft-class-strength-v2/b14_v2_",
              "research/draft-capital-outlook-v1/b14_v2_",
          )
          assert all(p.startswith(allowed) for p in touched),touched

          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B14 V2 mutation scope is research-only.")
          PY

      - name: Commit frozen B14 V2 closeout and archive preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B14 V2."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-class-strength-v2/b14_v2_residual_channel_closeout.json \
            research/draft-class-strength-v2/b14_v2_residual_channel_closeout_report.md \
            research/draft-class-strength-v2/b14_v2_manifest.json \
            research/draft-capital-outlook-v1/b14_v2_2027_anchor_archive_preregistration.json \
            research/draft-capital-outlook-v1/b14_v2_2027_anchor_archive_ledger_template.json \
            research/draft-capital-outlook-v1/b14_v2_2027_anchor_archive_preregistration_report.md \
            research/draft-capital-outlook-v1/b14_v2_manifest.json

          git commit -m "Freeze B13 residual closeout and preregister 2027 anchor archive"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B14 V2 closeout and archive preregistration committed."
