name: B17 Draft Capital Outlook V1 - Historical Mock Parsing and Target Feasibility

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  parse_and_target_feasibility:
    name: B17 parse historical anchors and actual draft target ingredients
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B17 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" \
            "beautifulsoup4==4.14.2"

      - name: Guard exact B16 V2 pass and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b16_v2_manifest.json").read_text())
          s=json.loads((D/"b16_v2_historical_snapshot_feasibility_summary.json").read_text())
          r=json.loads((D/"b16_v2_historical_snapshot_feasibility_result.json").read_text())

          assert m["decision"]=="PASS_B16_V2_HISTORICAL_ANCHOR_SERIES_AUTHORIZE_B17_PARSING_AND_TARGET_FEASIBILITY_ONLY"
          assert m["technical_feasibility_pass"] is True
          assert m["feasible_class_n"]==12
          assert m["implementation_fix_only"] is True
          assert m["scientific_gate_changed"] is False
          assert m["b17_parsing_and_target_feasibility_authorized"] is True
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["decision"]=="PASS_B16_V2_HISTORICAL_ANCHOR_SERIES_AUTHORIZE_B17_PARSING_AND_TARGET_FEASIBILITY_ONLY"
          assert s["feasible_class_n"]==12
          assert s["feasible_class_years"]==list(range(2014,2026))
          assert s["infeasible_class_years"]==[2026]
          assert s["minimum_feasible_classes_required"]==10
          assert s["b17_parsing_and_target_feasibility_authorized"] is True
          assert s["c1_model_preregistration_authorized"] is False

          # Guard core B16 V2 files by manifest hash.
          for name in [
              "b16_v2_discovery_fix_preregistration.json",
              "b16_v2_historical_snapshot_feasibility_result.json",
              "b16_v2_historical_snapshot_feasibility_summary.json",
              "b16_v2_historical_snapshot_feasibility_report.md",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          # Guard every selected raw anchor used by B17.
          by_year={int(x["class_year"]):x for x in r["results"] if x["feasible"]}
          assert sorted(by_year)==list(range(2014,2026))
          for year,x in by_year.items():
              p=Path(x["selected_raw_path"])
              assert p.is_file(),p
              expected=m["output_hashes"][str(p.relative_to(D))]
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==expected==x["selected_raw_sha256"],(year,expected,got)

          print("PASS: B16 V2 pass and all selected historical anchor hashes guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B17 parsing and target protocol before target download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b17
          python3 - <<'PY'
          import json
          from pathlib import Path

          protocol={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17_parsing_and_target_feasibility_protocol",
              "frozen_before_target_download":True,

              "scientific_purpose":"Test whether the B16-approved point-in-time mock snapshots can be converted into a consistent top-60 projected NFL draft-capital composition representation and whether matching actual top-60 NFL draft composition can be reconstructed from a public historical draft source.",

              "class_years":list(range(2014,2026)),
              "class_n":12,

              "predictor_contract":{
                  "source_family":"WalterFootball Walt historical mock archive selected by B16 V2",
                  "base_snapshot_is_frozen_b16_raw_file":True,
                  "companion_pages_allowed":[
                      "same archived base URL with _1.php suffix for remaining Round 1 picks",
                      "same archived base URL with _2.php suffix for Round 2"
                  ],
                  "companion_selection_is_deterministic":True,
                  "companion_must_match_class_year":True,
                  "companion_must_contain_anchor_date":True,
                  "top_slot_cutoff":60,
                  "player_identity_join_not_required":True,
                  "position_interpretation":"Use the first listed position token only. This prevents a defensive player such as LB/RB from being counted as a fantasy RB.",
                  "fantasy_primary_positions":["QB","RB","FB","WR","TE"],
                  "position_mapping":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
                  "projected_slots_are_structure_only":True
              },

              "actual_target_contract":{
                  "source_name":"nflverse nfldata draft_picks.csv",
                  "source_url":"https://raw.githubusercontent.com/nflverse/nfldata/master/data/draft_picks.csv",
                  "required_columns":["season","round","pick","pfr_name","position"],
                  "class_years":list(range(2014,2026)),
                  "top_slot_cutoff":60,
                  "fantasy_primary_positions":["QB","RB","FB","WR","TE"],
                  "position_mapping":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
                  "missing_overall_pick_number_interpretation":"No selection at that numbered slot, e.g. a forfeited pick. Preserve the slot as missing rather than renumbering later selections.",
                  "scalar_target_function_defined_here":False,
                  "draft_capital_weight_function_defined_here":False
              },

              "parser_contract":{
                  "mock_entry_source":"WalterFootball ordered-list list items with a bold 'Team: Player, POS, School' label.",
                  "respect_html_ol_start_attribute":True,
                  "fallback_page_start_rule":"If an archived companion page lacks an OL start attribute, assign it immediately after the maximum already parsed slot from earlier page parts.",
                  "page_order":["base","round1_remainder","round2"],
                  "deduplicate_by_pick_number":True,
                  "duplicate_pick_with_conflicting_content_is_failure":True,
                  "do_not_fill_unparsed_player_data_from_later_sources":True
              },

              "feasibility_gate":{
                  "minimum_joint_feasible_classes":10,
                  "predictor_minimum_unique_slots_through_60":58,
                  "predictor_must_reach_slot_60":True,
                  "target_must_contain_or_span_through_pick_60":True,
                  "target_minimum_observed_selections_at_or_below_60":58,
                  "minimum_fantasy_players_not_gated":"Class strength itself may legitimately vary; do not require a minimum fantasy-player count.",
                  "pass_decision":"PASS_B17_HISTORICAL_PARSE_AND_TARGET_FEASIBILITY_AUTHORIZE_B18_TARGET_FUNCTION_AND_POWER_PREREGISTRATION_ONLY",
                  "fail_decision":"STOP_B17_HISTORICAL_PARSE_OR_TARGET_FEASIBILITY_INSUFFICIENT"
              },

              "strict_non_authority":{
                  "no_predictor_target_correlation":True,
                  "no_model_fit":True,
                  "no_model_selection":True,
                  "no_target_weight_tuning":True,
                  "no_class_strength_scalar":True,
                  "no_2027_score":True,
                  "no_production_change":True,
                  "c1_model_preregistration_authorized":False
              },

              "future_boundary":{
                  "b18_if_pass":"Preregister a class-blind fantasy draft-capital target function and exact power/validation design before any historical predictor-vs-target skill is computed.",
                  "b18_may_not_fit_predictor_model":True,
                  "b18_must_freeze_power_gate_before_c1":True,
                  "b13_residual_result_remains_separate":True
              },

              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }

          Path("/tmp/b17/b17_protocol_frozen.json").write_text(
              json.dumps(protocol,indent=2,sort_keys=True)+"\n"
          )

          assert protocol["feasibility_gate"]["minimum_joint_feasible_classes"]==10
          assert protocol["predictor_contract"]["top_slot_cutoff"]==60
          assert protocol["actual_target_contract"]["scalar_target_function_defined_here"] is False
          assert protocol["strict_non_authority"]["no_predictor_target_correlation"] is True
          print("PASS: B17 parser/target feasibility protocol frozen before target download.")
          PY

      - name: Capture deterministic historical mock companion pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/archive/historical-anchor-parsing/companions
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,re,time
          from datetime import date
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          A=D/"archive/historical-anchor-parsing"
          COMP=A/"companions"
          COMP.mkdir(parents=True,exist_ok=True)

          protocol=json.loads(Path("/tmp/b17/b17_protocol_frozen.json").read_text())
          b16=json.loads((D/"b16_v2_historical_snapshot_feasibility_result.json").read_text())

          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B17/1.0 (+historical mock parser feasibility)",
              "Accept":"text/html,*/*;q=0.5",
              "Accept-Language":"en-US,en;q=0.9",
              "Accept-Encoding":"identity"
          })

          MONTHS={
              "jan":1,"january":1,"feb":2,"february":2,"mar":3,"march":3,
              "apr":4,"april":4,"may":5,"jun":6,"june":6,"jul":7,"july":7,
              "aug":8,"august":8,"sep":9,"sept":9,"september":9,"oct":10,
              "october":10,"nov":11,"november":11,"dec":12,"december":12
          }

          def get(url):
              attempts=[]
              resp=None
              err=None
              for i,delay in enumerate([0,2,6],start=1):
                  if delay: time.sleep(delay)
                  try:
                      t0=time.time()
                      resp=session.get(url,timeout=45,allow_redirects=True)
                      attempts.append({
                          "attempt":i,
                          "status_code":int(resp.status_code),
                          "elapsed_seconds":round(time.time()-t0,3),
                          "final_url":resp.url
                      })
                      if resp.status_code not in {429,500,502,503,504}:
                          break
                  except Exception as e:
                      err=f"{type(e).__name__}: {e}"
                      attempts.append({"attempt":i,"error":err})
              return resp,attempts,err

          def decode(resp):
              enc=resp.encoding or "utf-8"
              try:
                  return resp.content.decode(enc,errors="replace")
              except LookupError:
                  return resp.content.decode("utf-8",errors="replace")

          def normalized_text(html):
              soup=BeautifulSoup(html,"html.parser")
              return " ".join(soup.get_text(" ",strip=True).split())

          def dates_in_text(text,anchor_year):
              found=set()
              rx=re.compile(
                  r"\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
                  r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                  r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)(20\d{2})\b",
                  re.I
              )
              for m in rx.finditer(text):
                  try:
                      found.add(date(int(m.group(3)),MONTHS[m.group(1).lower().rstrip(".")],int(m.group(2))))
                  except ValueError:
                      pass
              for m in re.finditer(r"\b(20\d{2})-(0[1-9]|1[0-2])-([0-3]\d)\b",text):
                  try: found.add(date(int(m.group(1)),int(m.group(2)),int(m.group(3))))
                  except ValueError: pass
              for m in re.finditer(r"\b(0?[1-9]|1[0-2])/([0-3]?\d)/(20\d{2}|\d{2})\b",text):
                  y=int(m.group(3)); y=y+2000 if y<100 else y
                  try: found.add(date(y,int(m.group(1)),int(m.group(2))))
                  except ValueError: pass
              return sorted(d for d in found if d.year==anchor_year)

          rows=[]
          feasible={int(x["class_year"]):x for x in b16["results"] if x["feasible"]}
          assert sorted(feasible)==protocol["class_years"]

          for year in protocol["class_years"]:
              src=feasible[year]
              base_url=src["selected_url"]
              expected_date=date.fromisoformat(src["selected_embedded_anchor_date"])
              anchor_year=year-1

              assert base_url.lower().endswith(".php")
              stem=base_url[:-4]
              companion_urls={
                  "round1_remainder":stem+"_1.php",
                  "round2":stem+"_2.php",
              }

              out={
                  "class_year":year,
                  "base_url":base_url,
                  "base_raw_path":src["selected_raw_path"],
                  "base_raw_sha256":src["selected_raw_sha256"],
                  "expected_anchor_date":expected_date.isoformat(),
                  "companions":{}
              }

              for role,url in companion_urls.items():
                  resp,attempts,error=get(url)
                  status=int(resp.status_code) if resp is not None else None
                  raw=resp.content if resp is not None else b""
                  text=decode(resp) if resp is not None else ""
                  visible=normalized_text(text) if text else ""
                  dates=dates_in_text(visible,anchor_year) if visible else []
                  date_match=expected_date in dates
                  class_marker=(f"{year} NFL Mock Draft".lower() in visible.lower()) if visible else False

                  raw_path=None
                  raw_sha=None
                  usable=False
                  if resp is not None:
                      p=COMP/f"{year}_{role}.html"
                      p.write_bytes(raw)
                      raw_path=str(p)
                      raw_sha=hashlib.sha256(raw).hexdigest()

                  if (
                      resp is not None
                      and 200<=resp.status_code<300
                      and len(raw)>=1000
                      and class_marker
                      and date_match
                  ):
                      usable=True

                  out["companions"][role]={
                      "url":url,
                      "http_status":status,
                      "final_url":resp.url if resp is not None else None,
                      "attempts":attempts,
                      "error":error,
                      "raw_bytes":len(raw),
                      "raw_path":raw_path,
                      "raw_sha256":raw_sha,
                      "embedded_anchor_dates":[d.isoformat() for d in dates],
                      "expected_anchor_date_match":date_match,
                      "class_year_marker":class_marker,
                      "usable":usable
                  }

              rows.append(out)

          Path("/tmp/b17/b17_companion_capture.json").write_text(
              json.dumps({
                  "schema_version":1,
                  "study_id":"draft-capital-outlook-v1",
                  "stage":"b17_companion_capture",
                  "classes":rows,
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              },indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              str(x["class_year"]):{
                  k:v["usable"] for k,v in x["companions"].items()
              } for x in rows
          },indent=2))
          PY

      - name: Parse projected top-60 composition ingredients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/archive/historical-anchor-parsing/parsed
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,re
          from pathlib import Path

          from bs4 import BeautifulSoup

          D=Path("research/draft-capital-outlook-v1")
          PARSED=D/"archive/historical-anchor-parsing/parsed"
          PARSED.mkdir(parents=True,exist_ok=True)

          protocol=json.loads(Path("/tmp/b17/b17_protocol_frozen.json").read_text())
          comp=json.loads(Path("/tmp/b17/b17_companion_capture.json").read_text())

          fantasy=set(protocol["predictor_contract"]["fantasy_primary_positions"])
          mapping=protocol["predictor_contract"]["position_mapping"]
          cutoff=protocol["predictor_contract"]["top_slot_cutoff"]

          label_rx=re.compile(
              r"^\s*(?P<team>[^:]{2,100}):\s*(?P<player>.+?),\s*(?P<pos>[A-Za-z0-9/-]{1,15}),\s*(?P<school>.+?)\s*$"
          )

          def norm(s):
              return " ".join(str(s).replace("\xa0"," ").split())

          def parse_page(path,default_start):
              raw=Path(path).read_bytes()
              soup=BeautifulSoup(raw,"html.parser")
              entries=[]
              next_default=default_start

              for ol in soup.find_all("ol"):
                  qualifying=[]
                  for li in ol.find_all("li",recursive=False):
                      b=li.find("b")
                      if b is None:
                          continue
                      txt=norm(b.get_text(" ",strip=True))
                      m=label_rx.match(txt)
                      if not m:
                          continue
                      qualifying.append({
                          "team":norm(m.group("team")),
                          "player":norm(m.group("player")),
                          "position_raw":norm(m.group("pos")).upper(),
                          "school":norm(m.group("school")),
                      })

                  if not qualifying:
                      continue

                  start_attr=ol.get("start")
                  if start_attr is not None and str(start_attr).strip().isdigit():
                      start=int(start_attr)
                  else:
                      start=next_default

                  for offset,row in enumerate(qualifying):
                      row=dict(row)
                      row["pick"]=start+offset
                      entries.append(row)

                  next_default=max(next_default,start+len(qualifying))

              # fallback: if site markup lost OL wrappers, parse bold labels in document order
              if not entries:
                  qualifying=[]
                  for b in soup.find_all("b"):
                      txt=norm(b.get_text(" ",strip=True))
                      m=label_rx.match(txt)
                      if not m:
                          continue
                      qualifying.append({
                          "team":norm(m.group("team")),
                          "player":norm(m.group("player")),
                          "position_raw":norm(m.group("pos")).upper(),
                          "school":norm(m.group("school")),
                      })
                  for offset,row in enumerate(qualifying):
                      row=dict(row); row["pick"]=default_start+offset
                      entries.append(row)

              return entries

          class_rows=[]
          for c in comp["classes"]:
              year=int(c["class_year"])
              pages=[
                  ("base",c["base_raw_path"],True),
                  ("round1_remainder",c["companions"]["round1_remainder"]["raw_path"],c["companions"]["round1_remainder"]["usable"]),
                  ("round2",c["companions"]["round2"]["raw_path"],c["companions"]["round2"]["usable"]),
              ]

              combined={}
              conflicts=[]
              page_diagnostics=[]
              next_default=1

              for role,path,usable in pages:
                  if role=="base":
                      usable=True
                  if not usable or not path:
                      page_diagnostics.append({
                          "role":role,"used":False,"parsed_entry_n":0
                      })
                      continue

                  parsed=parse_page(path,next_default)
                  page_diagnostics.append({
                      "role":role,
                      "used":True,
                      "parsed_entry_n":len(parsed),
                      "minimum_pick":min((x["pick"] for x in parsed),default=None),
                      "maximum_pick":max((x["pick"] for x in parsed),default=None)
                  })

                  if parsed:
                      next_default=max(next_default,max(x["pick"] for x in parsed)+1)

                  for row in parsed:
                      p=int(row["pick"])
                      if p in combined:
                          old=combined[p]
                          if (
                              old["player"]!=row["player"]
                              or old["position_raw"]!=row["position_raw"]
                              or old["team"]!=row["team"]
                          ):
                              conflicts.append({"pick":p,"old":old,"new":row,"page_role":role})
                          continue
                      row["source_page_role"]=role
                      combined[p]=row

              selected=[]
              for p in sorted(combined):
                  if p>cutoff:
                      continue
                  row=dict(combined[p])
                  primary=row["position_raw"].split("/")[0].strip().upper()
                  row["primary_position"]=primary
                  row["fantasy_position"]=mapping.get(primary) if primary in fantasy else None
                  selected.append(row)

              picks={int(x["pick"]) for x in selected}
              missing=[p for p in range(1,cutoff+1) if p not in picks]
              fantasy_rows=[x for x in selected if x["fantasy_position"] is not None]

              out={
                  "schema_version":1,
                  "study_id":"draft-capital-outlook-v1",
                  "stage":"b17_projected_top60_parse",
                  "class_year":year,
                  "anchor_date":c["expected_anchor_date"],
                  "page_diagnostics":page_diagnostics,
                  "conflicting_duplicate_picks":conflicts,
                  "conflicting_duplicate_pick_n":len(conflicts),
                  "top60_rows":selected,
                  "unique_slot_n_through_60":len(picks),
                  "reaches_slot_60":60 in picks,
                  "missing_slots_through_60":missing,
                  "fantasy_rows":fantasy_rows,
                  "fantasy_row_n":len(fantasy_rows),
                  "fantasy_counts":{
                      pos:sum(x["fantasy_position"]==pos for x in fantasy_rows)
                      for pos in ["QB","RB","WR","TE"]
                  },
                  "parse_feasible":(
                      len(conflicts)==0
                      and len(picks)>=protocol["feasibility_gate"]["predictor_minimum_unique_slots_through_60"]
                      and 60 in picks
                  ),
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }

              p=PARSED/f"{year}_projected_top60.json"
              p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
              class_rows.append(out)

          Path("/tmp/b17/b17_projected_parse_summary.json").write_text(
              json.dumps({
                  "schema_version":1,
                  "study_id":"draft-capital-outlook-v1",
                  "stage":"b17_projected_parse_summary",
                  "classes":[{
                      "class_year":x["class_year"],
                      "parse_feasible":x["parse_feasible"],
                      "unique_slot_n_through_60":x["unique_slot_n_through_60"],
                      "reaches_slot_60":x["reaches_slot_60"],
                      "missing_slots_through_60":x["missing_slots_through_60"],
                      "fantasy_row_n":x["fantasy_row_n"],
                      "fantasy_counts":x["fantasy_counts"],
                      "conflicting_duplicate_pick_n":x["conflicting_duplicate_pick_n"]
                  } for x in class_rows],
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              },indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              "parse_feasible_n":sum(x["parse_feasible"] for x in class_rows),
              "years":[x["class_year"] for x in class_rows if x["parse_feasible"]]
          },indent=2))
          PY

      - name: Capture frozen actual NFL draft target source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/archive/historical-anchor-parsing/target
          python3 - <<'PY'
          import hashlib,json,time
          from pathlib import Path

          import requests

          D=Path("research/draft-capital-outlook-v1")
          T=D/"archive/historical-anchor-parsing/target"
          protocol=json.loads(Path("/tmp/b17/b17_protocol_frozen.json").read_text())
          url=protocol["actual_target_contract"]["source_url"]

          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B17/1.0 (+actual draft target capture)",
              "Accept":"text/csv,*/*;q=0.5",
              "Accept-Encoding":"identity"
          })

          response=None
          attempts=[]
          error=None
          for i,delay in enumerate([0,2,6],start=1):
              if delay: time.sleep(delay)
              try:
                  t0=time.time()
                  response=session.get(url,timeout=45,allow_redirects=True)
                  attempts.append({
                      "attempt":i,
                      "status_code":int(response.status_code),
                      "elapsed_seconds":round(time.time()-t0,3),
                      "final_url":response.url
                  })
                  if response.status_code not in {429,500,502,503,504}:
                      break
              except Exception as e:
                  error=f"{type(e).__name__}: {e}"
                  attempts.append({"attempt":i,"error":error})

          assert response is not None,error
          assert 200<=response.status_code<300,response.status_code
          raw=response.content
          assert len(raw)>100000,len(raw)

          p=T/"nflverse_draft_picks.csv"
          p.write_bytes(raw)
          meta={
              "schema_version":1,
              "source_name":protocol["actual_target_contract"]["source_name"],
              "source_url":url,
              "final_url":response.url,
              "http_status":int(response.status_code),
              "attempts":attempts,
              "raw_bytes":len(raw),
              "raw_sha256":hashlib.sha256(raw).hexdigest(),
              "response_headers_subset":{
                  k:v for k,v in response.headers.items()
                  if k.lower() in {"content-type","content-length","etag","last-modified","date"}
              }
          }
          (T/"nflverse_draft_picks_capture_meta.json").write_text(
              json.dumps(meta,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: actual NFL draft target source captured and hashed.")
          PY

      - name: Parse actual top-60 composition ingredients
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          T=D/"archive/historical-anchor-parsing/target"
          protocol=json.loads(Path("/tmp/b17/b17_protocol_frozen.json").read_text())
          required=protocol["actual_target_contract"]["required_columns"]
          cutoff=protocol["actual_target_contract"]["top_slot_cutoff"]
          mapping=protocol["actual_target_contract"]["position_mapping"]
          fantasy=set(protocol["actual_target_contract"]["fantasy_primary_positions"])

          with (T/"nflverse_draft_picks.csv").open(newline="",encoding="utf-8") as f:
              reader=csv.DictReader(f)
              assert reader.fieldnames is not None
              for c in required:
                  assert c in reader.fieldnames,(c,reader.fieldnames)
              rows=list(reader)

          output=[]
          for year in protocol["class_years"]:
              yrows=[
                  r for r in rows
                  if str(r.get("season","")).strip()==str(year)
                  and str(r.get("pick","")).strip()
                  and int(float(r["pick"]))<=cutoff
              ]
              picks={}
              duplicates=[]
              for r in yrows:
                  p=int(float(r["pick"]))
                  rec={
                      "pick":p,
                      "round":int(float(r["round"])) if str(r.get("round","")).strip() else None,
                      "player":str(r.get("pfr_name") or "").strip(),
                      "position_raw":str(r.get("position") or "").strip().upper()
                  }
                  if p in picks:
                      duplicates.append({"pick":p,"old":picks[p],"new":rec})
                  else:
                      picks[p]=rec

              slots=[]
              for p in range(1,cutoff+1):
                  if p not in picks:
                      slots.append({
                          "pick":p,
                          "selection_present":False,
                          "player":None,
                          "position_raw":None,
                          "fantasy_position":None
                      })
                      continue
                  rec=dict(picks[p])
                  primary=rec["position_raw"].split("/")[0].strip().upper()
                  rec["selection_present"]=True
                  rec["primary_position"]=primary
                  rec["fantasy_position"]=mapping.get(primary) if primary in fantasy else None
                  slots.append(rec)

              observed=[x for x in slots if x["selection_present"]]
              fantasy_rows=[x for x in slots if x["selection_present"] and x["fantasy_position"] is not None]

              out={
                  "schema_version":1,
                  "study_id":"draft-capital-outlook-v1",
                  "stage":"b17_actual_top60_target_ingredients",
                  "class_year":year,
                  "top60_slots":slots,
                  "observed_selection_n_at_or_below_60":len(observed),
                  "missing_selection_slots":[x["pick"] for x in slots if not x["selection_present"]],
                  "duplicate_pick_n":len(duplicates),
                  "duplicate_picks":duplicates,
                  "fantasy_rows":fantasy_rows,
                  "fantasy_row_n":len(fantasy_rows),
                  "fantasy_counts":{
                      pos:sum(x["fantasy_position"]==pos for x in fantasy_rows)
                      for pos in ["QB","RB","WR","TE"]
                  },
                  "target_parse_feasible":(
                      len(duplicates)==0
                      and len(observed)>=protocol["feasibility_gate"]["target_minimum_observed_selections_at_or_below_60"]
                      and any(x["pick"]==60 and x["selection_present"] for x in slots)
                  ),
                  "scalar_target_function_computed":False,
                  "predictor_target_correlation_computed":False,
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }
              (T/f"{year}_actual_top60.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
              output.append(out)

          Path("/tmp/b17/b17_actual_target_summary.json").write_text(
              json.dumps({
                  "schema_version":1,
                  "study_id":"draft-capital-outlook-v1",
                  "stage":"b17_actual_target_summary",
                  "classes":[{
                      "class_year":x["class_year"],
                      "target_parse_feasible":x["target_parse_feasible"],
                      "observed_selection_n_at_or_below_60":x["observed_selection_n_at_or_below_60"],
                      "missing_selection_slots":x["missing_selection_slots"],
                      "fantasy_row_n":x["fantasy_row_n"],
                      "fantasy_counts":x["fantasy_counts"],
                      "duplicate_pick_n":x["duplicate_pick_n"]
                  } for x in output],
                  "scalar_target_function_computed":False,
                  "predictor_target_correlation_computed":False,
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              },indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              "target_parse_feasible_n":sum(x["target_parse_feasible"] for x in output),
              "years":[x["class_year"] for x in output if x["target_parse_feasible"]]
          },indent=2))
          PY

      - name: Apply frozen B17 joint feasibility gate without computing skill
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads(Path("/tmp/b17/b17_protocol_frozen.json").read_text())
          X=json.loads(Path("/tmp/b17/b17_projected_parse_summary.json").read_text())
          Y=json.loads(Path("/tmp/b17/b17_actual_target_summary.json").read_text())

          x={int(r["class_year"]):r for r in X["classes"]}
          y={int(r["class_year"]):r for r in Y["classes"]}
          assert sorted(x)==sorted(y)==P["class_years"]

          per_class=[]
          for year in P["class_years"]:
              joint=bool(x[year]["parse_feasible"] and y[year]["target_parse_feasible"])
              per_class.append({
                  "class_year":year,
                  "predictor_parse_feasible":x[year]["parse_feasible"],
                  "predictor_unique_slot_n_through_60":x[year]["unique_slot_n_through_60"],
                  "predictor_reaches_slot_60":x[year]["reaches_slot_60"],
                  "predictor_missing_slots_through_60":x[year]["missing_slots_through_60"],
                  "target_parse_feasible":y[year]["target_parse_feasible"],
                  "target_observed_selection_n_at_or_below_60":y[year]["observed_selection_n_at_or_below_60"],
                  "target_missing_selection_slots":y[year]["missing_selection_slots"],
                  "joint_feasible":joint
              })

          joint=[r for r in per_class if r["joint_feasible"]]
          n=len(joint)
          required=P["feasibility_gate"]["minimum_joint_feasible_classes"]
          passed=n>=required
          decision=(
              P["feasibility_gate"]["pass_decision"]
              if passed else P["feasibility_gate"]["fail_decision"]
          )

          summary={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b17_historical_parse_and_target_feasibility_summary",
              "decision":decision,
              "joint_feasibility_pass":passed,
              "candidate_class_n":len(per_class),
              "minimum_joint_feasible_classes_required":required,
              "joint_feasible_class_n":n,
              "joint_feasible_class_years":[r["class_year"] for r in joint],
              "joint_infeasible_class_years":[r["class_year"] for r in per_class if not r["joint_feasible"]],
              "per_class":per_class,

              "scientific_firewall":{
                  "predictor_target_correlation_computed":False,
                  "scalar_target_function_computed":False,
                  "draft_capital_weight_function_defined":False,
                  "predictor_fit_performed":False,
                  "model_selection_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              },

              "b18_target_function_and_power_preregistration_authorized":passed,
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,

              "scientific_note":"B17 tests only data-structure feasibility. No predictor-vs-target association, model fit, class-strength scalar, or production multiplier is computed."
          }

          (D/"b17_protocol_frozen.json").write_bytes(
              Path("/tmp/b17/b17_protocol_frozen.json").read_bytes()
          )
          (D/"b17_companion_capture.json").write_bytes(
              Path("/tmp/b17/b17_companion_capture.json").read_bytes()
          )
          (D/"b17_projected_parse_summary.json").write_bytes(
              Path("/tmp/b17/b17_projected_parse_summary.json").read_bytes()
          )
          (D/"b17_actual_target_summary.json").write_bytes(
              Path("/tmp/b17/b17_actual_target_summary.json").read_bytes()
          )
          (D/"b17_historical_parse_and_target_feasibility_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps(summary,indent=2))
          PY

      - name: Validate B17 scientific firewall and file lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads((D/"b17_protocol_frozen.json").read_text())
          C=json.loads((D/"b17_companion_capture.json").read_text())
          X=json.loads((D/"b17_projected_parse_summary.json").read_text())
          Y=json.loads((D/"b17_actual_target_summary.json").read_text())
          S=json.loads((D/"b17_historical_parse_and_target_feasibility_summary.json").read_text())

          assert P["frozen_before_target_download"] is True
          assert P["class_years"]==list(range(2014,2026))
          assert P["predictor_contract"]["top_slot_cutoff"]==60
          assert P["actual_target_contract"]["top_slot_cutoff"]==60
          assert P["actual_target_contract"]["scalar_target_function_defined_here"] is False
          assert P["actual_target_contract"]["draft_capital_weight_function_defined_here"] is False
          assert P["strict_non_authority"]["no_predictor_target_correlation"] is True
          assert P["strict_non_authority"]["no_model_fit"] is True
          assert P["strict_non_authority"]["no_target_weight_tuning"] is True
          assert P["strict_non_authority"]["no_class_strength_scalar"] is True

          assert len(C["classes"])==12
          assert len(X["classes"])==12
          assert len(Y["classes"])==12

          for c in C["classes"]:
              bp=Path(c["base_raw_path"])
              assert bp.is_file()
              assert hashlib.sha256(bp.read_bytes()).hexdigest()==c["base_raw_sha256"]
              for role,v in c["companions"].items():
                  if v["raw_path"]:
                      p=Path(v["raw_path"])
                      assert p.is_file()
                      assert hashlib.sha256(p.read_bytes()).hexdigest()==v["raw_sha256"]

          # Validate per-class parse artifacts exist and preserve authority boundaries.
          for year in range(2014,2026):
              x=json.loads((D/f"archive/historical-anchor-parsing/parsed/{year}_projected_top60.json").read_text())
              y=json.loads((D/f"archive/historical-anchor-parsing/target/{year}_actual_top60.json").read_text())
              assert x["predictor_fit_performed"] is False
              assert x["2027_class_scored"] is False
              assert x["production_change_authorized"] is False
              assert y["scalar_target_function_computed"] is False
              assert y["predictor_target_correlation_computed"] is False
              assert y["predictor_fit_performed"] is False
              assert y["2027_class_scored"] is False
              assert y["production_change_authorized"] is False

          assert S["scientific_firewall"]=={
              "draft_capital_weight_function_defined":False,
              "model_selection_performed":False,
              "predictor_fit_performed":False,
              "predictor_target_correlation_computed":False,
              "production_change_authorized":False,
              "scalar_target_function_computed":False,
              "2027_class_scored":False,
          }
          assert S["c1_model_preregistration_authorized"] is False
          assert S["predictor_fit_performed"] is False
          assert S["2027_class_scored"] is False
          assert S["production_change_authorized"] is False

          if S["joint_feasibility_pass"]:
              assert S["joint_feasible_class_n"]>=10
              assert S["decision"]=="PASS_B17_HISTORICAL_PARSE_AND_TARGET_FEASIBILITY_AUTHORIZE_B18_TARGET_FUNCTION_AND_POWER_PREREGISTRATION_ONLY"
              assert S["b18_target_function_and_power_preregistration_authorized"] is True
          else:
              assert S["joint_feasible_class_n"]<10
              assert S["decision"]=="STOP_B17_HISTORICAL_PARSE_OR_TARGET_FEASIBILITY_INSUFFICIENT"
              assert S["b18_target_function_and_power_preregistration_authorized"] is False

          print("PASS: B17 parsing lineage and no-skill/no-model firewall validated.")
          PY

