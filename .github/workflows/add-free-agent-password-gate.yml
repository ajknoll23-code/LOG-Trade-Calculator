name: Add Free Agent Password Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked Free Agent Board
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_FA_BLOB="31030919d88922d779c904c56cdc6068a5766fdb"
          ACTUAL_FA_BLOB="$(git hash-object free-agent-board.html)"

          echo "Expected free-agent-board.html blob: $EXPECTED_FA_BLOB"
          echo "Actual free-agent-board.html blob:   $ACTUAL_FA_BLOB"

          test "$ACTUAL_FA_BLOB" = "$EXPECTED_FA_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: free-agent-board-pre-password-gate-v1
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Add password gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("free-agent-board.html")
          text = path.read_text(encoding="utf-8")

          marker = "FREE_AGENT_PASSWORD_GATE_V1"
          expected_hash = (
              "93cb8c6fdfd9f1fda78a42f511c6714967cbe8726b4a0629afebe794694af8ad"
          )

          if marker in text:
              raise SystemExit(
                  f"{marker} already present; refusing to double-apply."
              )

          required = [
              "<body>",
              'id="boardWrap"',
              "FREE_AGENT_APP_SHELL_V1",
              "</body>",
          ]

          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Free Agent Board structure changed; missing: "
                  + ", ".join(missing)
              )

          # Preserve the canonical valuation block byte-for-byte.
          canonical_marker = "/* CANONICAL VALUATION SYNC"
          start = text.index(canonical_marker)
          end = text.index("</script>", start) + len("</script>")
          canonical_before = text[start:end]

          css = r'''
          <style id="free-agent-password-gate-styles">
          /* FREE_AGENT_PASSWORD_GATE_V1
             Simple client-side deterrent for the private Free Agent Board.
             Static GitHub Pages cannot provide server-side authentication. */

          body.free-agent-locked{
            overflow:hidden!important;
            background:#091B2C!important;
          }

          body.free-agent-locked > :not(#freeAgentPasswordGate){
            display:none!important;
          }

          #freeAgentPasswordGate{
            min-height:100vh;
            display:grid;
            place-items:center;
            padding:22px;
            background:
              radial-gradient(
                ellipse 700px 420px at 50% 0%,
                rgba(235,98,97,.08),
                transparent 60%
              ),
              #091B2C;
            color:#F8FAFC;
            font-family:'Inter',sans-serif;
          }

          .fa-gate-card{
            width:min(100%,420px);
            padding:22px;
            border:1px solid rgba(201,206,210,.16);
            border-radius:14px;
            background:#16324F;
            box-shadow:0 18px 50px rgba(0,0,0,.28);
          }

          .fa-gate-eyebrow{
            margin-bottom:7px;
            color:#EB6261;
            font-family:'IBM Plex Mono',monospace;
            font-size:9px;
            font-weight:600;
            letter-spacing:.12em;
            text-transform:uppercase;
          }

          .fa-gate-title{
            margin:0 0 8px;
            font-family:'Anton',sans-serif;
            font-size:27px;
            line-height:1.05;
            text-transform:uppercase;
          }

          .fa-gate-copy{
            margin:0 0 16px;
            color:#B5C4D6;
            font-size:12px;
            line-height:1.5;
          }

          .fa-gate-label{
            display:block;
            margin-bottom:5px;
            color:#516885;
            font-family:'IBM Plex Mono',monospace;
            font-size:9px;
            font-weight:600;
            letter-spacing:.08em;
            text-transform:uppercase;
          }

          .fa-gate-input{
            width:100%;
            min-height:42px;
            padding:9px 10px;
            border:1px solid rgba(201,206,210,.24);
            border-radius:8px;
            outline:none;
            background:#0E2841;
            color:#F8FAFC;
            font-family:'Inter',sans-serif;
            font-size:14px;
          }

          .fa-gate-input:focus{
            border-color:#EB6261;
            box-shadow:0 0 0 3px rgba(235,98,97,.15);
          }

          .fa-gate-button{
            width:100%;
            min-height:41px;
            margin-top:10px;
            border:0;
            border-radius:8px;
            background:#EB6261;
            color:#fff;
            font-family:'Inter',sans-serif;
            font-size:12px;
            font-weight:800;
            letter-spacing:.05em;
            text-transform:uppercase;
            cursor:pointer;
          }

          .fa-gate-button:disabled{
            opacity:.65;
            cursor:wait;
          }

          .fa-gate-error{
            min-height:17px;
            margin-top:8px;
            color:#FF8A4C;
            font-family:'IBM Plex Mono',monospace;
            font-size:9px;
          }

          .fa-gate-back{
            display:inline-block;
            margin-top:12px;
            color:#B5C4D6;
            font-size:10px;
            text-decoration:none;
          }

          .fa-gate-back:hover{
            color:#F8FAFC;
          }
          </style>
          '''

          gate = r'''
          <div id="freeAgentPasswordGate" role="dialog" aria-modal="true" aria-labelledby="faGateTitle">
            <div class="fa-gate-card">
              <div class="fa-gate-eyebrow">Private League Tool</div>
              <h1 class="fa-gate-title" id="faGateTitle">Free Agent Board</h1>
              <p class="fa-gate-copy">
                Enter the private access password to open the Free Agent Board.
              </p>

              <form id="freeAgentGateForm" autocomplete="off">
                <label class="fa-gate-label" for="freeAgentGatePassword">Password</label>
                <input
                  class="fa-gate-input"
                  id="freeAgentGatePassword"
                  name="freeAgentGatePassword"
                  type="password"
                  autocomplete="current-password"
                  required
                >
                <button class="fa-gate-button" id="freeAgentGateButton" type="submit">
                  Unlock Free Agents
                </button>
                <div class="fa-gate-error" id="freeAgentGateError" aria-live="polite"></div>
              </form>

              <a class="fa-gate-back" href="index.html">← Back to Trade Desk</a>
            </div>
          </div>
          '''

          js = f'''
          <script id="free-agent-password-gate-runtime">
          /* FREE_AGENT_PASSWORD_GATE_V1
             Simple browser-side password gate.
             Only the SHA-256 hash is stored in source. */
          (function () {{
            'use strict';

            const EXPECTED_HASH = '{expected_hash}';
            const SESSION_KEY = 'logFreeAgentAccessV1';

            function bytesToHex(buffer) {{
              return Array.from(new Uint8Array(buffer))
                .map(byte => byte.toString(16).padStart(2, '0'))
                .join('');
            }}

            async function sha256(text) {{
              const data = new TextEncoder().encode(text);
              const digest = await crypto.subtle.digest('SHA-256', data);
              return bytesToHex(digest);
            }}

            function unlock() {{
              document.body.classList.remove('free-agent-locked');

              const gate = document.getElementById('freeAgentPasswordGate');
              if (gate) gate.remove();

              try {{
                sessionStorage.setItem(SESSION_KEY, '1');
              }} catch (_) {{}}
            }}

            function alreadyUnlocked() {{
              try {{
                return sessionStorage.getItem(SESSION_KEY) === '1';
              }} catch (_) {{
                return false;
              }}
            }}

            async function init() {{
              if (alreadyUnlocked()) {{
                unlock();
                return;
              }}

              const form = document.getElementById('freeAgentGateForm');
              const input = document.getElementById('freeAgentGatePassword');
              const button = document.getElementById('freeAgentGateButton');
              const error = document.getElementById('freeAgentGateError');

              if (!form || !input || !button || !error) return;

              input.focus();

              form.addEventListener('submit', async event => {{
                event.preventDefault();

                error.textContent = '';
                button.disabled = true;
                button.textContent = 'Checking…';

                try {{
                  if (!window.crypto || !crypto.subtle) {{
                    throw new Error('Secure browser hashing is unavailable.');
                  }}

                  const submittedHash = await sha256(input.value);

                  if (submittedHash === EXPECTED_HASH) {{
                    input.value = '';
                    unlock();
                    return;
                  }}

                  input.select();
                  error.textContent = 'Incorrect password.';
                }} catch (err) {{
                  error.textContent =
                    'Unable to verify password in this browser.';
                  console.error(err);
                }} finally {{
                  button.disabled = false;
                  button.textContent = 'Unlock Free Agents';
                }}
              }});
            }}

            if (document.readyState === 'loading') {{
              document.addEventListener('DOMContentLoaded', init, {{ once:true }});
            }} else {{
              init();
            }}
          }})();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          gate = "\n".join(line.rstrip() for line in gate.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text:
              raise RuntimeError("Free Agent Board missing closing </head>")

          text = text.replace("</head>", css + "\n</head>", 1)

          if "<body>" not in text:
              raise RuntimeError("Expected exact <body> tag missing")

          text = text.replace(
              "<body>",
              '<body class="free-agent-locked">\n' + gate,
              1,
          )

          if "</body>" not in text:
              raise RuntimeError("Free Agent Board missing closing </body>")

          text = text.replace("</body>", js + "\n</body>", 1)

          # Canonical valuation content must remain byte-for-byte identical.
          start_after = text.index(canonical_marker)
          end_after = text.index("</script>", start_after) + len("</script>")
          canonical_after = text[start_after:end_after]

          if canonical_before != canonical_after:
              raise RuntimeError(
                  "Canonical valuation block changed during password-gate patch"
              )

          if expected_hash not in text:
              raise RuntimeError("Expected password hash missing")

          if text.count(marker) != 2:
              raise RuntimeError(
                  f"Unexpected {marker} count: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")

          print("PASS password gate added")
          print("PASS plaintext password absent")
          print("PASS canonical valuation block unchanged")
          PY

      - name: Validate password gate JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("free-agent-board.html").read_text(encoding="utf-8")

          js = re.search(
              r'<script id="free-agent-password-gate-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )

          css = re.search(
              r'<style id="free-agent-password-gate-styles">(.*?)</style>',
              html,
              flags=re.S,
          )

          if not js or not css:
              raise SystemExit("Password-gate UI blocks missing")

          required = [
              "crypto.subtle.digest",
              "sessionStorage",
              "free-agent-locked",
              "Incorrect password.",
          ]

          missing = [
              token for token in required
              if token not in js.group(1) and token not in css.group(1)
          ]

          if missing:
              raise SystemExit(f"Password-gate implementation missing: {missing}")

          for label, block in [
              ("CSS", css.group(1)),
              ("JS", js.group(1)),
          ]:
              bad = [
                  i for i, line in enumerate(block.splitlines(), 1)
                  if line != line.rstrip()
              ]

              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at lines {bad[:10]}"
                  )

              print(f"PASS {label} whitespace")

          out = Path("/tmp/free-agent-password-gate.js")
          out.write_text(js.group(1), encoding="utf-8")
          print(out)
          PY

          node --check /tmp/free-agent-password-gate.js

      - name: Validate Free Agent Board valuation parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync/sync_free_agent_valuation.py --check

      - name: Validate patch cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff --stat

      - name: Commit password gate only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add free-agent-board.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "free-agent-board.html"

          if git diff --cached --quiet; then
            echo "No password-gate changes to commit."
            exit 0
          fi

          git commit -m "Add password gate to Free Agent Board"
          git push origin HEAD:main
