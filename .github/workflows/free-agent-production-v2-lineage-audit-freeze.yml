      - name: Prove production was not mutated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              'research/free-agent-production-v2/free_agent_production_v2_phase1.py',
              'research/free-agent-production-v2/free_agent_production_v2_phase1.json',
              'research/free-agent-production-v2/free_agent_production_v2_phase1.md',
              'research/free-agent-production-v2/phase1_manifest.json',
          }

          out = subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all'], text=True)
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)

          extra = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if extra:
              raise SystemExit(f'Unexpected changed files: {extra}')
          if missing:
              raise SystemExit(f'Expected Phase-1 files not changed/created: {missing}')

          forbidden = {
              'index.html',
              'free-agent-board.html',
              'data/free_agents.json',
          }
          if changed & forbidden:
              raise SystemExit(f'Production mutation detected: {sorted(changed & forbidden)}')

          print('PASS: exactly four research-only Phase-1 files changed.')
          print('PASS: zero production files changed.')
          PY

