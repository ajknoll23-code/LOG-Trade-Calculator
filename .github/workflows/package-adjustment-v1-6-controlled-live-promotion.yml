      - name: Guard exact promotion change set
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              "index.html",
              "scripts/validation/check_package_adjustment_live.py",
              "research/package-adjustment-production-candidate-v1/live_deployment.json",
              "research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_6.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.md",
              "research/package-adjustment-v5/controlled_live_v1_6_promotion.json",
              "research/package-adjustment-v5/controlled_live_v1_6_promotion.md",
          }

          out = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          paths = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(
                  f"Unexpected files changed during V1.6 promotion: {unexpected}"
              )

          required_changed = {
              "index.html",
              "scripts/validation/check_package_adjustment_live.py",
              "research/package-adjustment-production-candidate-v1/live_deployment.json",
              "research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_6.json",
              "research/package-adjustment-v5/controlled_live_v1_6_promotion.json",
              "research/package-adjustment-v5/controlled_live_v1_6_promotion.md",
          }
          missing = sorted(required_changed - paths)
          if missing:
              raise RuntimeError(
                  f"Required V1.6 promotion files were not changed/created: {missing}"
              )

          print("Exact V1.6 promotion change set verified.")
          print("Changed files:", sorted(paths))
          PY

