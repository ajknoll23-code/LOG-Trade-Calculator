name: QF11 V7 - KTC Catalog Identity and Realism Audit (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  research:
    name: Review 28 KTC ballots, duplicated anchors and current model/provider identity; no voter activation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout dispatched main read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin source exact model, market, identity cache and frozen lineage
      shell: bash
      run: |-
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "STOP requires main"; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ "$(git hash-object index.html)" == "c83e3f68d11853c072017e6bd83bb1ad085f4a3e" ]] || { echo "STOP pinned source drift index.html"; exit 1; }
        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == "829445174a77ceb4bb19dfd97a725e371d18efe8" ]] || { echo "STOP pinned source drift scripts/artifacts/generated/market_values.json"; exit 1; }
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == "9d007a7f053e15dcdc0f694563ca17bc47568e5f" ]] || { echo "STOP pinned source drift scripts/artifacts/generated/value_uncertainty.json"; exit 1; }
        [[ "$(git hash-object scripts/market/build_market_value.py)" == "a015d54785ce5fcb3b9f26bae0120b82693a6bd8" ]] || { echo "STOP pinned source drift scripts/market/build_market_value.py"; exit 1; }
        [[ "$(git hash-object scripts/market/ktc_pipeline.py)" == "b9612c73a91223397a4f49b384d8d86719ee8d79" ]] || { echo "STOP pinned source drift scripts/market/ktc_pipeline.py"; exit 1; }
        [[ "$(git hash-object scripts/validation/snapshot_values.py)" == "1efca4c35e910a95974c1bec0b06a106196618b3" ]] || { echo "STOP pinned source drift scripts/validation/snapshot_values.py"; exit 1; }
        [[ "$(git hash-object scripts/validation/repo_regression_checks.py)" == "5191e1160c966ed14401b70c86c6f63808e1265d" ]] || { echo "STOP pinned source drift scripts/validation/repo_regression_checks.py"; exit 1; }
        [[ "$(git hash-object scripts/identity_crosswalk.json)" == "3489c01c923474931f4db81e3dd338f437bfdf5f" ]] || { echo "STOP pinned source drift scripts/identity_crosswalk.json"; exit 1; }
        [[ "$(git hash-object data/players_cache.json)" == "216242d9f87a81c4d1532cca2468c90a52918c3d" ]] || { echo "STOP pinned source drift data/players_cache.json"; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || exit 1
        echo "QF11_V7_FROZEN_SOURCES_GREEN"
    - name: Download exact immutable QF11 V6R1 unactivated catalog (not live ballots)
      uses: actions/download-artifact@v4
      with:
        name: QF11-v6-RESEARCH-ONLY-unactivated-vote-catalog
        run-id: 38255346352
        github-token: ${{ github.token }}
        path: /tmp/qf11-v7-source
    - name: Independently review 28 anchored pairs and source identity/position/team conflicts
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p /tmp/qf11-v7-review
        cat > /tmp/qf11-v7-review.py <<'QF11_V7_PY'
        from __future__ import annotations
        import collections, hashlib, json, math, re, sys
        from pathlib import Path
        sys.path.insert(0,str(Path.cwd()))
        from scripts.validation import snapshot_values

        root=Path.cwd()
        archive=Path('/tmp/qf11-v7-source')
        out=Path('/tmp/qf11-v7-review')
        out.mkdir(parents=True,exist_ok=True)
        expected={
         'RESEARCH_ONLY_catalog_summary.json':'93c3c83d8c2717df289761ac03ce043f877ead076439cd1b20fa65e0f57c7207',
         'RESEARCH_ONLY_design_notes.md':'0c667c5ea5b420b9456a4bf699dc1ca492ba703e5f14cd44ab46c66cd135ed58',
         'RESEARCH_ONLY_proposed_28_triplets_NOT_FOR_VOTERS.json':'627a6774170cccfef94be80ce8c892734de47c1b195e2298ca69fe85cb6154ec',
        }
        for name,sha in expected.items():
            b=(archive/name).read_bytes()
            assert hashlib.sha256(b).hexdigest()==sha, f'STOP archive changed {name}'
        cat=json.loads((archive/'RESEARCH_ONLY_proposed_28_triplets_NOT_FOR_VOTERS.json').read_text())
        summary=json.loads((archive/'RESEARCH_ONLY_catalog_summary.json').read_text())
        assert cat['status']=='PROPOSED_NOT_APPROVED_NOT_LAUNCHED'
        assert cat['no_ballots_created_or_votes_collected'] is True
        assert cat['owner_approval_required'] is True
        assert cat['source_after_daily_cap_sha256']==summary['source_hash']=='a0ed9f867883d9013cbee69a0136586a22223571f5f57d4f0627d5d77fd6d2b2'
        ballots=cat['catalog']
        assert len(ballots)==28
        cfg=snapshot_values.load_from_html(root/'index.html')
        values=snapshot_values.compute_all_values(cfg)
        players=cfg['player_db']
        index_html=(root/'index.html').read_text()
        model_teams=dict(re.findall(r"'([^']+)':\{pos:'[A-Z]+',age:\d+,role:'[^']+',team:'([^']*)'",index_html))
        assert len(model_teams)>=550, 'STOP model team extraction incomplete'
        market=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())
        assert len(market['players'])==504
        raw_cross=json.loads((root/'scripts/identity_crosswalk.json').read_text())
        assert isinstance(raw_cross,list) and len(raw_cross)>1000

        def canon(v):
            return re.sub(r'[^a-z0-9]','',str(v or '').lower())

        cross=collections.defaultdict(list)
        for row in raw_cross:
            if isinstance(row,dict):cross[canon(row.get('name'))].append(row)

        def norm_pos(pos):
            p=str(pos or '').upper().strip()
            return {'DE':'DL','DT':'DL','NT':'DL','EDGE':'DL','OLB':'LB','ILB':'LB','MLB':'LB','CB':'DB','SS':'DB','FS':'DB','S':'DB','SAF':'DB'}.get(p,p)

        cache_path=root/'data/players_cache.json'
        cache=json.loads(cache_path.read_text())
        if isinstance(cache,dict):
            source=cache.get('players') or cache.get('data') or cache
            cache_rows=list(source.values()) if isinstance(source,dict) else source if isinstance(source,list) else []
        elif isinstance(cache,list):cache_rows=cache
        else:cache_rows=[]
        cache_by_id={}
        for row in cache_rows:
            if isinstance(row,dict):
                sid=str(row.get('player_id') or row.get('id') or '')
                if sid:cache_by_id[sid]=row

        ballot_rows=[]
        names=collections.Counter()
        pair_counter=collections.Counter()
        issues=collections.Counter()
        flagged_players={}
        for i,b in enumerate(ballots,1):
            assert b['slot']==i and b['research_only'] is True
            keys=b['player_keys']
            assert len(keys)==3 and len(set(keys))==3
            pos=b['audit_pair_position']
            assert all(k in players and k in values for k in keys), f'STOP unknown player {keys}'
            assert players[keys[0]]['pos']==players[keys[1]]['pos']==pos, f'STOP pair position changed slot {i}'
            assert players[keys[2]]['pos']!=pos, f'STOP not cross-position third slot {i}'
            pair=tuple(sorted(keys[:2]))
            pair_counter[pair]+=1
            names.update(keys)
            v=[int(values[k]['value']) for k in keys]
            spread=max(v)/max(1,min(v))
            assert spread<=1.30, f'STOP excessive FV spread {i}: {spread}'
            reviews=[]
            for k in keys:
                model=players[k]
                row={'name':k,'model_pos':model['pos'],'model_team':model_teams.get(k), 'fundamental_value':int(values[k]['value'])}
                xrows=cross.get(canon(k),[])
                ids=sorted({str(x.get('sleeper_id')) for x in xrows if x.get('sleeper_id') is not None})
                row['crosswalk_ids']=ids
                row['crosswalk_records']=len(xrows)
                rflags=[]
                if not xrows:rflags.append('crosswalk_name_unresolved')
                if len(ids)>1:rflags.append('same_name_multiple_sleeper_ids_identity_review')
                if xrows:
                    details=[]
                    for x in xrows:
                        detail={s:x.get(s) for s in ('sleeper_id','sleeper_pos','fp_position','sleeper_team','fp_team','match_method')}
                        details.append(detail)
                        for field in ('fp_position','sleeper_pos'):
                            p=norm_pos(x.get(field))
                            if p and p!=model['pos']:
                                rflags.append(f'{field}_disagrees_with_model_position')
                        for field in ('fp_team','sleeper_team'):
                            team=x.get(field)
                            if team and model_teams.get(k) and team!=model_teams[k]:
                                rflags.append(f'{field}_disagrees_with_model_team')
                    row['source_crosswalk']=details
                    if len(ids)==1 and ids[0] in cache_by_id:
                        c=cache_by_id[ids[0]]
                        row['cached_sleeper']={f:c.get(f) for f in ('player_id','position','team','status','injury_status') if f in c}
                        for field in ('team',):
                            if c.get(field) and model_teams.get(k) and c[field]!=model_teams[k]:
                                rflags.append('cached_sleeper_team_disagrees_with_model')
                        if str(c.get('status') or '').lower() in ('inactive','retired','suspended','out'):
                            rflags.append('cached_status_requires_manual_eligibility_review')
                if k in ('aaron donald','joe mixon'):rflags.append('known_exception_must_exclude')
                row['review_flags']=sorted(set(rflags))
                for flag in row['review_flags']:issues[flag]+=1
                if row['review_flags']:flagged_players[k]=row
                reviews.append(row)
            ballot_rows.append({'slot':i,'pair_position':pos,'anchored_pair':list(pair),
               'players':reviews,'fv_spread_ratio_current':round(spread,5),
               'source_review_required':any(p['review_flags'] for p in reviews),
               'research_only':True})
        assert len(names)==56 and max(names.values())<=2, 'STOP catalog appearance drift'
        assert len(pair_counter)==16 and sum(n-1 for n in pair_counter.values())==12, 'STOP unexpected duplicate pair footprint'
        for pos in ('QB','RB','WR','TE','DL','LB','DB'):
            assert sum(b['pair_position']==pos for b in ballot_rows)==4
        for row in ballot_rows:
            if pair_counter[tuple(row['anchored_pair'])]>1:
                row['duplicate_same_position_pair_elsewhere']=True
                row['shared_same_position_pair_slots']=[b['slot'] for b in ballot_rows if b['anchored_pair']==row['anchored_pair']]
            else:
                row['duplicate_same_position_pair_elsewhere']=False
        out_report={
         'decision':'REVIEW_REQUIRED_NOT_APPROVED_NOT_FOR_VOTERS',
         'source_catalog_sha256':expected['RESEARCH_ONLY_proposed_28_triplets_NOT_FOR_VOTERS.json'],
         'source_after_daily_cap_sha256':summary['source_hash'],
         'model_and_voter_policy_changed':False,
         'catalog_activated':False,
         'approval_authorized':False,
         'ballots':ballot_rows,
         'summary':{'slots':len(ballots),'unique_players':len(names),'unique_same_position_pairs':len(pair_counter),
               'repeated_same_position_pair_exposures':sum(n-1 for n in pair_counter.values()),
               'source_flagged_distinct_players':len(flagged_players),
               'source_review_flag_counts_across_occurrences':dict(sorted(issues.items())),
               'cached_sleeper_id_coverage':len(cache_by_id),
               'manual_realism_review_needed':True,'same_pair_repeat_requires_independent_voter_plan':True,
               'theoretical_extra_voter_support':None,'market_refresh_authorized':False}
        }
        (out/'RESEARCH_ONLY_28_slot_eligibility_review.json').write_text(json.dumps(out_report,indent=2,sort_keys=True)+'\n')
        lines=['# QF11 V7 — independent eligibility and realism review (not approved)',
        '','Do not distribute or activate ballots; this is an **internal review**, not a launch.',
        '','## Structural audit',
        '',f"- {len(ballots)} slots, {len(names)} distinct players; {len(pair_counter)} distinct same-position pairs.",
         f"- {sum(n-1 for n in pair_counter.values())} repeated same-position pair exposures (the different third player does not create a new same-position pair).",
         f"- {len(flagged_players)} unique players require source identity/position/team review; source disagreements are **not** automatically disqualifying.",
         '- Model FV is used only to analyze matchup comparability; neither FV nor Market Value changes.',
         '- Keep/Trade/Cut future behavior, voter independence, survey realism and publication thresholds cannot be inferred from these artifacts.',
         '','## Proposed slots', '']
        for b in ballot_rows:
            playerstr=' · '.join(p['name'] for p in b['players'])
            flags=' | '.join(f"{p['name']}: {','.join(p['review_flags'])}" for p in b['players'] if p['review_flags'])
            repeated='repeat anchor' if b['duplicate_same_position_pair_elsewhere'] else 'unique anchor'
            lines.append(f"- **{b['slot']:02d} [{b['pair_position']}]** {playerstr} — {repeated}; FV spread {b['fv_spread_ratio_current']:.3f}; {'FLAGS '+flags if flags else 'no automated identity flag'}")
        lines.extend(['','## Next gating decision','',
         'This workflow does **not** independently verify external current NFL playing status or human ballot realism. Review same-name collisions and source position/team disagreements against authoritative data first; choose whether repeated anchored pairs are intentional. Obtain explicit owner approval before any invitations or voter URLs.',
         'No published Market Value vote provenance or value changes are authorized.',''])
        (out/'RESEARCH_ONLY_28_slot_review_notes.md').write_text('\n'.join(lines))
        for p in out.iterdir():
            c=p.read_text()
            assert 'voter_roster_id' not in c and 'sheet_url' not in c and 'raw_ballots' not in c
        print('QF11_V7_ELIGIBILITY_REVIEW_GREEN '+json.dumps(out_report['summary'],sort_keys=True))
        print('QF11_V7_HOLD owner_approval=False eligibility_review_required=True voting_activated=False publication_authorized=False')
        QF11_V7_PY
        python3 -m py_compile /tmp/qf11-v7-review.py
        python3 /tmp/qf11-v7-review.py
    - name: Run unchanged 14 regression groups and release guards
      shell: bash
      run: |-
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo 'QF11_V7_14_REPO_REGRESSIONS_GREEN'
    - name: Verify zero source writes, invariant source blobs and two review outputs
      shell: bash
      run: |-
        set -euo pipefail
        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_WRITES; exit 1; }
        [[ "$(git hash-object index.html)" == "c83e3f68d11853c072017e6bd83bb1ad085f4a3e" ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == "829445174a77ceb4bb19dfd97a725e371d18efe8" ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == "9d007a7f053e15dcdc0f694563ca17bc47568e5f" ]] || exit 1
        [[ "$(git hash-object scripts/market/build_market_value.py)" == "a015d54785ce5fcb3b9f26bae0120b82693a6bd8" ]] || exit 1
        [[ "$(git hash-object scripts/market/ktc_pipeline.py)" == "b9612c73a91223397a4f49b384d8d86719ee8d79" ]] || exit 1
        [[ "$(git hash-object scripts/validation/snapshot_values.py)" == "1efca4c35e910a95974c1bec0b06a106196618b3" ]] || exit 1
        [[ "$(git hash-object scripts/validation/repo_regression_checks.py)" == "5191e1160c966ed14401b70c86c6f63808e1265d" ]] || exit 1
        [[ "$(git hash-object scripts/identity_crosswalk.json)" == "3489c01c923474931f4db81e3dd338f437bfdf5f" ]] || exit 1
        [[ "$(git hash-object data/players_cache.json)" == "216242d9f87a81c4d1532cca2468c90a52918c3d" ]] || exit 1
        [[ "$(find /tmp/qf11-v7-review -maxdepth 1 -type f | wc -l)" -eq 2 ]] || exit 1
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        echo "QF11_V7_ZERO_WRITE_GREEN no ballot activation no market changes"
    - name: Archive internal ballot eligibility report only (seven days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v7-RESEARCH-ONLY-eligibility-review
        path: /tmp/qf11-v7-review/
        retention-days: 7
        if-no-files-found: error
