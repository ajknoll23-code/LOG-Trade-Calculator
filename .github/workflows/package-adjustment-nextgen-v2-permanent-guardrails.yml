name: Package Adjustment NextGen V2 Permanent Guardrails

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-permanent-guardrails
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependency
        run: python3 -m pip install requests

      - name: Capture reviewed baseline
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"
          CAT="research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          DESIGN="research/package-adjustment-nextgen-v2/challenge_catalog_design.md"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$GEN")" = "a6f58a1db8945547f5e6a7ab2a3d822265e630d2"
          test "$(git hash-object "$SPEC")" = "f92d1490772763de8f8cc9db35c7e0f9f49eda33"
          test "$(git hash-object "$CAT")" = "dcf6e7799af5db28a4fdc467867ea860c7f4d46f"
          test "$(git hash-object "$DESIGN")" = "84661edcfe93ea37c9ea4f3be86c2cb8e6b3f4b1"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json")
          cat = json.loads(path.read_text(encoding="utf-8"))

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["research_only"] is True
          assert cat["frozen"] is False
          assert cat["catalog_diagnostics"]["challenge_count"] == 129
          assert cat["catalog_diagnostics"]["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert cat["catalog_diagnostics"]["skipped_or_underfilled_cells"] == []
          assert [x["label"] for x in cat["design"]["fragmentation_comparisons"]] == [
              "80_20_vs_80_10_10"
          ]
          assert [x["label"] for x in cat["design"]["deferred_fragmentation_comparisons"]] == [
              "80_20_vs_80_05x4"
          ]

          Path("/tmp/pkgnv2-challenges-before.json").write_text(
              json.dumps(cat["challenges"], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/pkgnv2-invariants-before.json").write_text(
              json.dumps({
                  "v_ref": cat["v_ref"],
                  "inputs": cat["inputs"],
                  "production_revision_at_generation": cat["production_revision_at_generation"],
                  "exact_live_formula_sha256_at_generation": cat["exact_live_formula_sha256_at_generation"],
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: exact 129-row reviewed baseline captured.")
          PY

      - name: Verify production before hardening
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Add permanent scale and reuse guardrails
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          gen_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "generate_package_vote_challenges_nextgen_v2.py"
          )
          spec_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "package_adjustment_nextgen_v2_research_spec.md"
          )

          gen = gen_path.read_text(encoding="utf-8")
          spec = spec_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {n}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Permanent integrity function:
          # - validates every row against the scale band implied by its
          #   declared low/mid/high anchors;
          # - reports goal-to-anchor drift;
          # - rejects exact side reuse across scales inside one cell;
          # - reports cross-cell/cross-family side reuse;
          # - proves repeated core cross-cell packages are only the common
          #   50/50 comparator, never a manipulated concentration package.
          # ------------------------------------------------------------------
          insert_after = '''def counter_to_dict(counter):
              return {str(k): int(v) for k, v in sorted(counter.items(), key=lambda kv: str(kv[0]))}


          '''
          helper = '''def counter_to_dict(counter):
              return {str(k): int(v) for k, v in sorted(counter.items(), key=lambda kv: str(kv[0]))}


          def build_scale_reuse_integrity(challenges, core_plans, fragmentation_plans, holdout_plans):
              scale_labels = [label for label, _q in SCALE_QUANTILES]
              if scale_labels != ["low", "mid", "high"]:
                  raise RuntimeError(f"unexpected scale ordering: {scale_labels}")

              def plan_for_cell(family, cell_id):
                  if family == "core_concentration_2v2":
                      return core_plans
                  if family == "fragmentation_filler":
                      prefix = "frag_"
                      if not cell_id.startswith(prefix):
                          raise RuntimeError(f"unexpected fragmentation cell id: {cell_id}")
                      comparison = cell_id[len(prefix):]
                      if comparison not in fragmentation_plans:
                          raise RuntimeError(
                              f"missing fragmentation scale plan for {comparison}"
                          )
                      return fragmentation_plans[comparison]
                  if family == "structural_topology_3v3":
                      return holdout_plans
                  raise RuntimeError(f"unknown challenge family: {family}")

              cell_rows = defaultdict(lambda: defaultdict(list))
              side_occurrences = defaultdict(list)

              for challenge in challenges:
                  family = challenge["family"]
                  cell_id = challenge["cell_id"]
                  scale = challenge["scale_label"]
                  plan = plan_for_cell(family, cell_id)

                  expected_anchor = float(plan[scale]["anchor_total_fv"])
                  recorded_anchor = float(challenge["scale_anchor_total_fv"])
                  if abs(expected_anchor - recorded_anchor) > 0.001:
                      raise RuntimeError(
                          f"{challenge['id']}: scale anchor mismatch; "
                          f"expected={expected_anchor}, recorded={recorded_anchor}"
                      )

                  cell_rows[(family, cell_id)][scale].append(challenge)

                  for side_name in ("side_a", "side_b"):
                      side = challenge[side_name]
                      signature = tuple(
                          sorted(str(asset["key"]) for asset in side["assets"])
                      )
                      side_occurrences[signature].append({
                          "family": family,
                          "cell_id": cell_id,
                          "scale_label": scale,
                          "challenge_id": challenge["id"],
                          "side": side_name,
                          "intended_shares": tuple(
                              round(float(x), 8) for x in side["intended_shares"]
                          ),
                      })

              scale_groups = []
              for (family, cell_id), rows_by_scale in sorted(cell_rows.items()):
                  plan = plan_for_cell(family, cell_id)
                  anchors = {
                      scale: float(plan[scale]["anchor_total_fv"])
                      for scale in scale_labels
                  }
                  if not (anchors["low"] < anchors["mid"] < anchors["high"]):
                      raise RuntimeError(
                          f"{family}/{cell_id}: non-increasing scale anchors {anchors}"
                      )

                  low_mid = (anchors["low"] + anchors["mid"]) / 2.0
                  mid_high = (anchors["mid"] + anchors["high"]) / 2.0

                  for scale in scale_labels:
                      rows = rows_by_scale.get(scale, [])
                      if not rows:
                          scale_groups.append({
                              "family": family,
                              "cell_id": cell_id,
                              "scale_label": scale,
                              "row_count": 0,
                              "anchor_total_fv": round(anchors[scale], 6),
                              "goal_min": None,
                              "goal_max": None,
                              "mean_anchor_drift_pct": None,
                              "max_anchor_drift_pct": None,
                          })
                          continue

                      goals = [float(row["goal_total_fv"]) for row in rows]
                      if scale == "low":
                          outside = [g for g in goals if g > low_mid + 1e-9]
                      elif scale == "mid":
                          outside = [
                              g for g in goals
                              if not (g > low_mid + 1e-9 and g <= mid_high + 1e-9)
                          ]
                      else:
                          outside = [g for g in goals if g <= mid_high + 1e-9]

                      if outside:
                          raise RuntimeError(
                              f"{family}/{cell_id}/{scale}: goals outside declared "
                              f"scale band; goals={goals}; boundaries="
                              f"({low_mid}, {mid_high})"
                          )

                      drifts = [
                          abs(goal - anchors[scale]) / anchors[scale]
                          for goal in goals
                      ]
                      scale_groups.append({
                          "family": family,
                          "cell_id": cell_id,
                          "scale_label": scale,
                          "row_count": len(rows),
                          "anchor_total_fv": round(anchors[scale], 6),
                          "goal_min": round(min(goals), 6),
                          "goal_max": round(max(goals), 6),
                          "mean_anchor_drift_pct": round(
                              sum(drifts) / len(drifts), 10
                          ),
                          "max_anchor_drift_pct": round(max(drifts), 10),
                      })

              repeated = {
                  signature: occs
                  for signature, occs in side_occurrences.items()
                  if len(occs) > 1
              }

              same_cell_same_scale = 0
              cross_scale_same_cell = 0
              cross_cell_same_family = 0
              cross_family = 0
              core_cross_cell_nonflat = []

              for signature, occs in repeated.items():
                  families = {o["family"] for o in occs}
                  if len(families) > 1:
                      cross_family += 1

                  family_cells = defaultdict(set)
                  cell_scales = defaultdict(set)
                  cell_scale_counts = Counter()

                  for o in occs:
                      family_cells[o["family"]].add(o["cell_id"])
                      cell_scales[(o["family"], o["cell_id"])].add(o["scale_label"])
                      cell_scale_counts[
                          (o["family"], o["cell_id"], o["scale_label"])
                      ] += 1

                  if any(n > 1 for n in cell_scale_counts.values()):
                      same_cell_same_scale += 1

                  if any(len(scales) > 1 for scales in cell_scales.values()):
                      cross_scale_same_cell += 1

                  if any(len(cells) > 1 for cells in family_cells.values()):
                      cross_cell_same_family += 1

                  if (
                      len(families) == 1
                      and families == {"core_concentration_2v2"}
                      and len(family_cells["core_concentration_2v2"]) > 1
                  ):
                      nonflat = [
                          o for o in occs
                          if o["intended_shares"] != tuple(FLAT_PROFILE)
                      ]
                      if nonflat:
                          core_cross_cell_nonflat.append({
                              "asset_keys": list(signature),
                              "occurrences": occs,
                          })

              if same_cell_same_scale:
                  raise RuntimeError(
                      "exact side package reused within the same cell/scale: "
                      f"{same_cell_same_scale} signatures"
                  )
              if cross_scale_same_cell:
                  raise RuntimeError(
                      "exact side package reused across scales in the same cell: "
                      f"{cross_scale_same_cell} signatures"
                  )
              if core_cross_cell_nonflat:
                  raise RuntimeError(
                      "core cross-cell exact side reuse includes a manipulated "
                      f"non-50/50 package: {core_cross_cell_nonflat[:3]}"
                  )

              max_anchor_drift = max(
                  (
                      row["max_anchor_drift_pct"]
                      for row in scale_groups
                      if row["max_anchor_drift_pct"] is not None
                  ),
                  default=0.0,
              )

              return {
                  "scale_band_rule": (
                      "midpoint boundaries between declared low/mid/high anchors; "
                      "every selected goal must remain inside its declared band"
                  ),
                  "all_selected_goals_inside_declared_scale_band": True,
                  "max_goal_to_anchor_drift_pct": round(max_anchor_drift, 10),
                  "scale_groups": scale_groups,
                  "exact_side_reuse": {
                      "repeated_signature_count_global": len(repeated),
                      "same_cell_same_scale_signature_count": same_cell_same_scale,
                      "cross_scale_same_cell_signature_count": cross_scale_same_cell,
                      "cross_cell_same_family_signature_count": cross_cell_same_family,
                      "cross_family_signature_count": cross_family,
                      "core_cross_cell_nonflat_signature_count": len(
                          core_cross_cell_nonflat
                      ),
                      "max_global_signature_occurrences": max(
                          (len(occs) for occs in repeated.values()),
                          default=1,
                      ),
                  },
              }


          '''
          gen = replace_once(
              gen, insert_after, helper,
              "insert permanent scale/reuse integrity function",
          )

          old_catalog_head = '''    diversity = build_diversity_diagnostics(challenges, players, appearance_counts)

              cells = []
          '''
          new_catalog_head = '''    diversity = build_diversity_diagnostics(challenges, players, appearance_counts)\n    integrity = build_scale_reuse_integrity(\n        challenges, plans, fragmentation_plans, holdout_plans\n    )\n\n    cells = []\n'''
          gen = replace_once(
              gen, old_catalog_head, new_catalog_head,
              "catalog integrity diagnostic build",
          )

          old_catalog_diag = '''            "max_asset_appearance_count": diversity["max_asset_appearance_count"],
                      "diversity": diversity,
                  },
          '''
          new_catalog_diag = '''            "max_asset_appearance_count": diversity["max_asset_appearance_count"],
                      "diversity": diversity,
                      "scale_reuse_integrity": integrity,
                  },
          '''
          gen = replace_once(
              gen, old_catalog_diag, new_catalog_diag,
              "catalog permanent integrity diagnostics",
          )

          old_design_lines = '''        f"- Exact side reuses within the same cell/scale: `{d['diversity']['exact_side_reuse_count_same_cell_scale']}`",
                  f"- Pick cells active: `{catalog['pick_cells']['active']}`",
          '''
          new_design_lines = '''        f"- Exact side reuses within the same cell/scale: `{d['diversity']['exact_side_reuse_count_same_cell_scale']}`",
                  f"- Exact side reuses across scales within one cell: `{d['scale_reuse_integrity']['exact_side_reuse']['cross_scale_same_cell_signature_count']}`",
                  f"- Cross-cell exact side signatures within one family: `{d['scale_reuse_integrity']['exact_side_reuse']['cross_cell_same_family_signature_count']}`",
                  f"- Core cross-cell reused signatures with non-50/50 shares: `{d['scale_reuse_integrity']['exact_side_reuse']['core_cross_cell_nonflat_signature_count']}`",
                  f"- Maximum selected-goal drift from its scale anchor: `{d['scale_reuse_integrity']['max_goal_to_anchor_drift_pct']}`",
                  f"- Pick cells active: `{catalog['pick_cells']['active']}`",
          '''
          gen = replace_once(
              gen, old_design_lines, new_design_lines,
              "design permanent integrity summary",
          )

          old_roundtrip = '''    validate_challenges(loaded["challenges"], cell_counts)
              validate_fv_lookup(loaded["challenges"], players)

              print(f"NextGen V2 catalog {out_status}: {OUT.relative_to(ROOT)}")
          '''
          new_roundtrip = '''    validate_challenges(loaded["challenges"], cell_counts)
              validate_fv_lookup(loaded["challenges"], players)
              build_scale_reuse_integrity(
                  loaded["challenges"], plans, fragmentation_plans, holdout_plans
              )

              print(f"NextGen V2 catalog {out_status}: {OUT.relative_to(ROOT)}")
          '''
          gen = replace_once(
              gen, old_roundtrip, new_roundtrip,
              "round-trip permanent integrity validation",
          )

          old_selftest = '''    diversity = build_diversity_diagnostics(challenges, players, appearances)
              assert diversity["rank_version"] == DIVERSITY_RANK_VERSION
              assert diversity["unique_assets_used"] > 0
              assert diversity["max_exact_side_repeat_count_same_cell_scale"] >= 0
              assert set(frag_plans) == {label for label, _a, _b in FRAGMENTATION_COMPARISONS}
          '''
          new_selftest = '''    diversity = build_diversity_diagnostics(challenges, players, appearances)
              assert diversity["rank_version"] == DIVERSITY_RANK_VERSION
              assert diversity["unique_assets_used"] > 0
              assert diversity["max_exact_side_repeat_count_same_cell_scale"] >= 0
              integrity = build_scale_reuse_integrity(
                  challenges, plans, frag_plans, holdout_plans
              )
              assert integrity["all_selected_goals_inside_declared_scale_band"] is True
              assert integrity["exact_side_reuse"]["same_cell_same_scale_signature_count"] == 0
              assert integrity["exact_side_reuse"]["cross_scale_same_cell_signature_count"] == 0
              assert integrity["exact_side_reuse"]["core_cross_cell_nonflat_signature_count"] == 0
              assert set(frag_plans) == {label for label, _a, _b in FRAGMENTATION_COMPARISONS}
          '''
          gen = replace_once(
              gen, old_selftest, new_selftest,
              "selftest permanent integrity checks",
          )

          section_18 = "# 18. Low-value filler stress family\n"
          section_17_2 = '''## 17.2 Permanent pre-freeze scale and package-reuse guardrails

          Before the first catalog freeze, the generator was hardened to make the scale-integrity
          failure class itself impossible to pass silently. This hardening was performed while the
          catalog remained unreleased and `frozen: false`, before any NextGen V2 voter exposure or
          vote outcomes.

          The generator must now:

          - derive midpoint boundaries from each cell's declared low / middle / high scale anchors
            and reject any selected challenge goal that falls outside its declared scale band;
          - record per-cell/per-scale goal ranges and mean/max goal-to-anchor drift;
          - reject exact side-package reuse within the same cell and scale;
          - reject exact side-package reuse across different scales within the same experimental
            cell;
          - report exact side-package reuse across cells and across families; and
          - for the core concentration ladder, allow a repeated exact package across different core
            treatment cells only when every occurrence is the common 50/50 comparator. A manipulated
            concentration package may not be reused across core treatment cells.

          The reviewed 129-row catalog passed these rules before freeze. The existing 2.5% side
          target, component-share, and pair-total tolerances remain unchanged. These guardrails do
          not alter the production Package Adjustment formula and do not use voter outcomes.

          ---

          '''
          gen_section_marker = None
          if section_17_2 in spec:
              raise SystemExit("spec guardrail section unexpectedly already present")
          if spec.count(section_18) != 1:
              raise SystemExit(
                  f"spec section-18 marker expected once, found {spec.count(section_18)}"
              )
          spec = spec.replace(section_18, section_17_2 + section_18, 1)

          gen_path.write_text(gen, encoding="utf-8")
          spec_path.write_text(spec, encoding="utf-8")

          print("PASS: permanent scale/reuse guardrails patched into generator and spec.")
          PY

          python3 -m py_compile \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py

      - name: Verify patch boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          assert changed == expected, (changed, expected)
          print("PASS: only generator + research spec changed before first commit.")
          PY

      - name: Run hardened generator self-test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --selftest

      - name: Commit permanent guardrails
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md

          git commit -m "Harden NextGen V2 scale and reuse guardrails"
          echo "GUARDRAIL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dry run hardened generator
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          python3 "$GEN" --dry-run > /tmp/pkgnv2-guardrail-dry-run.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("/tmp/pkgnv2-guardrail-dry-run.json").read_text(encoding="utf-8")
          )

          assert d["status"] == "dry_run_passed"
          assert d["challenge_count"] == 129
          assert d["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert d["split_counts"] == {
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
              "train": 75,
          }
          assert d["skipped_or_underfilled_cells"] == 0

          integ = d["diversity"]
          assert integ["rank_version"] == 3

          print("PASS: hardened dry run remains 129 rows with zero underfilled cells.")
          PY

      - name: Regenerate unreleased catalog with permanent diagnostics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --force

      - name: Prove ballot payload is unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          cat_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "package_vote_challenges_nextgen_v2.json"
          )
          cat = json.loads(cat_path.read_text(encoding="utf-8"))

          before_challenges = json.loads(
              Path("/tmp/pkgnv2-challenges-before.json").read_text(encoding="utf-8")
          )
          before_invariants = json.loads(
              Path("/tmp/pkgnv2-invariants-before.json").read_text(encoding="utf-8")
          )

          assert cat["challenges"] == before_challenges
          assert cat["v_ref"] == before_invariants["v_ref"]
          assert cat["inputs"] == before_invariants["inputs"]
          assert (
              cat["production_revision_at_generation"]
              == before_invariants["production_revision_at_generation"]
          )
          assert (
              cat["exact_live_formula_sha256_at_generation"]
              == before_invariants["exact_live_formula_sha256_at_generation"]
          )

          diag = cat["catalog_diagnostics"]
          assert diag["challenge_count"] == 129
          assert diag["skipped_or_underfilled_cells"] == []

          integ = diag["scale_reuse_integrity"]
          reuse = integ["exact_side_reuse"]

          assert integ["all_selected_goals_inside_declared_scale_band"] is True
          assert reuse["same_cell_same_scale_signature_count"] == 0
          assert reuse["cross_scale_same_cell_signature_count"] == 0
          assert reuse["cross_family_signature_count"] == 0
          assert reuse["cross_cell_same_family_signature_count"] == 31
          assert reuse["core_cross_cell_nonflat_signature_count"] == 0
          assert reuse["max_global_signature_occurrences"] == 4

          assert diag["diversity"]["unique_assets_used"] == 238
          assert diag["diversity"]["max_asset_appearance_count"] == 11

          frag = [
              c for c in cat["challenges"]
              if c["family"] == "fragmentation_filler"
          ]
          assert len(frag) == 15
          assert {
              c["cell_id"] for c in frag
          } == {"frag_80_20_vs_80_10_10"}
          assert not any(
              c["cell_id"] == "frag_80_20_vs_80_05x4"
              for c in cat["challenges"]
          )

          print("PASS: all 129 ballot rows are byte-equivalent as JSON data.")
          print(
              "Permanent reuse diagnostics:",
              json.dumps(reuse, sort_keys=True),
          )
          print(
              "Max goal-to-anchor drift:",
              integ["max_goal_to_anchor_drift_pct"],
          )
          PY

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Revalidate production after regeneration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Verify only generated outputs remain
