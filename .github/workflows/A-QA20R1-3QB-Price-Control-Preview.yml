name: A-QA20 - Three-QB Controlled FV Correction Preview (Read Only)
run-name: A-QA20 targeted 3 QB HTML valuation scenario and 72-player parity NO RELEASE

'on':
  workflow_dispatch:
    inputs:
      qa19_run_id:
        description: Exact verified green A-QA19 source run
        required: true
        type: string
        default: '41207517148'

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa20-targeted-qb-preview-read-only
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA20_RUN19: ${{ inputs.qa19_run_id }}
      QA20_IN19: /tmp/a-qa20-qa19
      QA20_IN08: /tmp/a-qa20-qa08
      QA20_OUT: /tmp/a-qa20-out
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout production main with no write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate immutable upstream successful workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QA20_RUN19" =~ ^[0-9]{7,15}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA20_RUN19" > "$RUNNER_TEMP/qa20_run19.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41072676062" > "$RUNNER_TEMP/qa20_run08.json"
          python3 - <<'PY_CHECK_RUN'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for filename,wanted in [('qa20_run19.json','.github/workflows/A-QA19R1-QB-Numeric-Owner-Preview.yml'),('qa20_run08.json','.github/workflows/A-QA08R1-Role-Audit.yml')]:
              x=json.loads((root/filename).read_text())
              assert x['status']=='completed' and x['conclusion']=='success' and x['event']=='workflow_dispatch'
              assert x['path']==wanted and x['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY_CHECK_RUN
      - name: Download exact successful QA19 numerical preview
        uses: actions/download-artifact@v4
        with:
          name: A-QA19-Four-QB-Numeric-Owner-Preview
          run-id: ${{ inputs.qa19_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/a-qa20-qa19
      - name: Download exact successful original QA08 72-player role/DOB parity
        uses: actions/download-artifact@v4
        with:
          name: A-QA08-DOB-Parity-Role-Evidence
          run-id: '41072676062'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/a-qa20-qa08
      - name: Stage exact three-player HTML valuation preview and protect 565 originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA20_OUT"
          cat > "$RUNNER_TEMP/qa20_stage.py" <<'PY_STAGE'
          #!/usr/bin/env python3
          import csv,datetime,hashlib,json,os,pathlib,re,sys
          src19=pathlib.Path(os.environ['QA20_IN19']);src08=pathlib.Path(os.environ['QA20_IN08'])
          out=pathlib.Path(os.environ['QA20_OUT']);out.mkdir(parents=True,exist_ok=True)
          def stop(s):raise AssertionError('QA20 GUARDED PREVIEW STOP: '+str(s))
          def load(p):return json.loads(p.read_text(encoding='utf8'))
          def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          m19=load(src19/'QA19_Manifest.json');m08=load(src08/'QA08_Manifest.json')
          assert m19['status']=='QA19_FOUR_QB_NUMERIC_OWNER_SHADOW_READ_ONLY'
          assert m19['owner_shadow_preview_count']==3 and m19['read_only'] and not m19['owner_release_authorized']
          assert m19['fp_source_status']=='PASS_EXACT_QA18_RANKING_SNAPSHOT'
          assert m19['source_git_sha']==m08['source_git_sha']=='130538b931a8ac91ea9d993304eba4f88e50e802'
          assert m08['status']=='QA08_DOB_PARITY_AND_DEPTH_SOURCE_COMPLETE_READ_ONLY'
          assert m08['cohort']==72 and m08['remaining_parity_holds']==0
          assert all(m19[k]==0 for k in ['fv_changes','fv_plus_changes','mv_changes','repo_mutations','new_fv_recommended'])
          raw19=load(src19/'QA19_Four_QB_Numeric_Owner_Scenarios.json')
          raw08=load(src08/'QA08_Input72.json')
          assert len(raw19)==4 and len(raw08)==72 and len({c['sleeper_id'] for c in raw08})==72
          expected={'7083':('Tyler Huntley',7150,1250,28,'Starter'),
                    '5854':('Drew Lock',4648,1104,29,'Rotational'),
                    '8162':('Sam Howell',4648,1098,26,'Rotational')}
          all19={c['sleeper_id']:c for c in raw19}
          all08={c['sleeper_id']:c for c in raw08}
          assert set(expected).issubset(all19.keys() & all08.keys())
          assert len([x for x in raw19 if x['illustrative_owner_FV_center_NOT_APPROVED'] is not None])==3
          assert all19['1737']['illustrative_owner_FV_center_NOT_APPROVED'] is None
          for sid,(name,old,new,age,role) in expected.items():
              a=all19[sid];b=all08[sid]
              assert (a['player'],a['current_fv_UNCHANGED'],a['illustrative_owner_FV_center_NOT_APPROVED'])==(name,old,new)
              assert a['decision_gate']=='NUMERIC_OWNER_PREVIEW_ONLY_NOT_DEPLOYABLE' and a['owner_approved']=='NO'
              assert (b['player'],b['position'],b['published_fv'],b['age'],b['assigned_role'])==(name,'QB',old,float(age),role)
              assert a['overlapping_internal_FV_range_low']<=new<=a['overlapping_internal_FV_range_high']
          # Validate currently synced league identity/slot before model preview. Never use name-only matching.
          roster=load(pathlib.Path('data/league_rosters.json'))
          assert len(roster['rosters'])==12
          slot_map={'starters':'Starter','bench':'Rotational','taxi':'Speculative','reserve_ir':'Depth'}
          roster_map={}
          for team in roster['rosters']:
              for slot,role in slot_map.items():
                  for p in team.get(slot,[]):
                      sid=str(p.get('player_id') or '')
                      if sid in expected:
                          if sid in roster_map:stop('QB stable ID duplicated across league')
                          roster_map[sid]=(p,slot,role)
          for sid,(name,old,new,age,role) in expected.items():
              if sid not in roster_map:stop('Target no longer rostered: '+sid)
              p,slot,live_role=roster_map[sid]
              if p['name']!=name or p['position']!='QB' or p['age']!=age or live_role!=role:
                  stop('Sleeper roster drift for '+name)
          # Import the real current pricing evaluator from repo; 565 original curated values protected.
          sys.path.insert(0,str(pathlib.Path('scripts/validation').resolve()))
          import snapshot_values as sv
          index=pathlib.Path('index.html');board=pathlib.Path('free-agent-board.html')
          oldindex=index.read_text(encoding='utf8');oldboard=board.read_text(encoding='utf8')
          pattern='function playerValue(pos, age, role, name){'
          if oldindex.count(pattern)!=1 or oldboard.count(pattern)!=1:stop('Pricing function uniqueness/source drift')
          marker='/* QA20_OWNER_SCENARIO_PREVIEW_ONLY_NOT_APPROVED */'
          for source in (oldindex,oldboard):
              if marker in source:stop('QA20 scenario appears to be already deployed')
              if 'const CAL26_FV_OWNER_ANCHORS = {' not in source or 'const QA20_FV_PREVIEW' in source:
                  stop('Owner anchors or stage invariant altered')
              if 'const rm = productionMultiplier(name || \'\', role);' not in source:
                  stop('Expected model equation no longer present')
          base_cfg=sv.load_from_html(index)
          base_565=sv.compute_all_values(base_cfg)
          assert len(base_565)==565 and len(base_cfg['cal26_fv_owner_anchors'])==15
          assert all(n.lower() not in base_cfg['player_db'] for n,_,_,_,_ in expected.values())
          # Stage source only in RUNNER_TEMP. No repository paths are written.
          entries=[]
          for sid,(name,old,new,age,role) in sorted(expected.items()):
              entries.append("  '"+name.lower()+"':{pos:'QB',age:"+str(age)+",role:'"+role+"',value:"+str(new)+"},")
          shadow=marker+'\nconst QA20_FV_PREVIEW = {\n'+'\n'.join(entries)+'\n};\n'
          start=pattern+'\n  const qa20Preview=QA20_FV_PREVIEW[normalizeName(name || \'\')];\n  if(qa20Preview && pos===qa20Preview.pos && age===qa20Preview.age && role===qa20Preview.role){\n    return qa20Preview.value;\n  }\n'
          def stage(source):
              return source.replace(pattern,shadow+start,1)
          staged_index=out/'qa20_staged_index.html';staged_board=out/'qa20_staged_free-agent-board.html'
          staged_index.write_text(stage(oldindex),encoding='utf8')
          staged_board.write_text(stage(oldboard),encoding='utf8')
          # Verify the staging operation was exactly one insertion; everything else byte-for-byte preserved.
          for original,staged in [(oldindex,staged_index.read_text()),(oldboard,staged_board.read_text())]:
              if staged.replace(shadow+start,pattern,1)!=original or staged.count(marker)!=1:
                  stop('Staging failed exact reversible source check')
          preview_cfg=sv.load_from_html(staged_index)
          preview_565=sv.compute_all_values(preview_cfg)
          if set(preview_565)!=set(base_565) or any(preview_565[k]!=base_565[k] for k in base_565):
              stop('Curated player valuation regression')
          if preview_cfg['cal26_fv_owner_anchors']!=base_cfg['cal26_fv_owner_anchors']:
              stop('Historical 15 owner FV anchors changed')
          # The HTML evaluator is a STATIC 565-player evaluator: it does not include the three new
          # roster-merged players. Node will replay their exact baseline/pricing function below.
          manifest={'status':'QA20_THREE_QB_TARGETED_PREVIEW_STAGED_READ_ONLY',
              'qa19_verified_run':os.environ['QA20_RUN19'],'qa08_verified_run':'41072676062',
              'qa19_manifest_sha256':sha(src19/'QA19_Manifest.json'),
              'qa08_manifest_sha256':sha(src08/'QA08_Manifest.json'),
              'base_live_index_sha256':sha(index),'base_live_board_sha256':sha(board),
              'staged_index_sha256':sha(staged_index),'staged_board_sha256':sha(staged_board),
              'roster_sync_utc':datetime.datetime.fromtimestamp(roster['synced_at'],datetime.timezone.utc).isoformat(),
              'curated_reference_count':len(base_565),'existing_owner_anchor_count':len(base_cfg['cal26_fv_owner_anchors']),
              'selected_candidates':3,'candidate_scenario_values':{expected[s][0]:expected[s][2] for s in expected},
              'production_value_changes':0,'fv_plus_changes':0,'mv_changes':0,'repo_mutations':0,
              'owner_release_authorized':False,'read_only':True,
              'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (out/'QA20_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'curated_unchanged':len(base_565),'historical_owner_anchors':len(base_cfg['cal26_fv_owner_anchors']),
              'preview_candidates':3,'repo_mutations':0}))

          PY_STAGE
          python3 -m py_compile "$RUNNER_TEMP/qa20_stage.py"
          python3 "$RUNNER_TEMP/qa20_stage.py"
      - name: Replay exact live JS pricing function for 72 roster profiles on both pages
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa20_replay.js" <<'JS_REPLAY'
          'use strict';
          const fs=require('fs');
          const vm=require('vm');
          const source=fs.readFileSync('index.html','utf8');
          const cases=JSON.parse(fs.readFileSync(process.env.QA20_IN08+'/QA08_Input72.json','utf8'));
          const qa19=JSON.parse(fs.readFileSync(process.env.QA20_IN19+'/QA19_Four_QB_Numeric_Owner_Scenarios.json','utf8'));
          const preview=qa19.filter(q=>q.illustrative_owner_FV_center_NOT_APPROVED!==null);
          const mapping=new Map(preview.map(p=>[p.sleeper_id, p]));
          const output=process.env.QA20_OUT;
          const stageIndex=fs.readFileSync(output+'/qa20_staged_index.html','utf8');
          const sourceBoard=fs.readFileSync('free-agent-board.html','utf8');
          const stageBoard=fs.readFileSync(output+'/qa20_staged_free-agent-board.html','utf8');
          function fail(s){throw new Error('QA20 SIMULATION STOP: '+s)}
          // Require the same exact core function and original fantasy-slot mechanism.
          for(const p of [/function playerValue\(pos, age, role, name\)\{/,
              /function productionMultiplier\(name, role\)\{/,
              /role:\s*existing\s*\?\s*existing\.role\s*:\s*slotDefaults\[slot\]/,
              /return Math\.round\(100 \* pw \* am \* rm \* 55\);/])
            if(!p.test(source)) fail('Core source structure changed: '+p);
          if(qa19.length!==4 || mapping.size!==3 ||
            JSON.stringify([...mapping.keys()].sort())!==JSON.stringify(['5854','7083','8162'].sort()))
            fail('Incorrect three-player owner preview selection');
          // Capture exact source definitions rather than reimplement the pricing formula.
          function getConst(name,source){
            const re=new RegExp('^const '+name+'\\s*=', 'm');
            const m=re.exec(source);
            if(!m) fail('Constant missing: '+name);
            const start=m.index, rhsStart=start+m[0].length;
            const tail=source.slice(rhsStart);
            const rhs=tail.trimStart();
            if(rhs.startsWith('{')){
              // R2 repair: some constants (POSITION_WEIGHT and ROLE_MULT) are
              // complete single-line objects. R1 incorrectly captured through
              // the NEXT multiline object's close, redeclaring AGE_CURVE.
              // Match the exact one-line object before trying a multiline close.
              const firstLine=tail.split('\n',1)[0];
              if(/^\s*\{[^{}]*\}\s*;\s*(?:\/\/.*)?$/.test(firstLine))
                return source.slice(start,rhsStart+firstLine.length);
              const end=/^};\s*$/m.exec(tail);
              if(!end) fail('Could not safely locate object closing: '+name);
              const result=source.slice(start,rhsStart+end.index+end[0].length);
              // A multiline object must end on the line containing its own
              // closing brace; no intervening top-level declaration allowed.
              if(/^const [A-Za-z_$][\w$]*\s*=/m.test(result.slice(m[0].length)))
                fail('Object extraction swallowed another constant: '+name);
              return result;
            }
            const lineEnd=source.indexOf('\n',rhsStart);
            const one=source.slice(start,lineEnd<0?source.length:lineEnd);
            if(!one.includes(';')) fail('Nonliteral simple constant: '+name);
            return one;
          }
          function getFn(name,source){
            const re=new RegExp('^function '+name+'\\([^\\n]*\\)\\s*\\{', 'm');
            const m=re.exec(source);
            if(!m) fail('Function missing: '+name);
            const tail=source.slice(m.index);
            const end=/^}\s*$/m.exec(tail);
            if(!end) fail('Unable to locate exact function end: '+name);
            return tail.slice(0,end.index+end[0].length);
          }
          const constants=[
            'POSITION_WEIGHT','AGE_CURVE','QB_POST_PEAK_FLOOR','LB_POST_PEAK_DECAY_POWER',
            'ROLE_MULT','PROD_MULT_DATA','NO_REAL_PRODUCTION_HISTORY',
            'CAL22_LEGACY_MONOTONE_KEYS','PROD_MULT','PLAYER_DB','RB_BIRTH_DATE_DATA',
            'CAL26_FV_OWNER_ANCHORS'
          ];
          const functions=[
            'normalizeName','productionMultiplier','ageMultiplier',
            'fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier',
            'effectiveAgeMultiplier','playerValue'
          ];
          function buildEngine(content,isStage){
            const defs=[...constants, ...(isStage?['QA20_FV_PREVIEW']:[])];
            const script=defs.map(k=>getConst(k,content)).join('\n')+'\n'+
               functions.map(k=>getFn(k,content)).join('\n')+
               '\nglobalThis.QA20_EXPORT={playerValue,normalizeName,PLAYER_DB};';
            const FIXED_DAY='2026-10-30T12:00:00.000Z';
            class AuditDate extends Date {
              constructor(...args){super(...(args.length?args:[FIXED_DAY]));}
              static now(){return Date.parse(FIXED_DAY);}
            }
            const sandbox={Date:AuditDate};
            try{vm.runInNewContext(script,sandbox,{timeout:12000});}
            catch(e){fail('Could not isolate exact source functions: '+e.message)}
            const res=sandbox.QA20_EXPORT;
            if(!res||typeof res.playerValue!=='function')fail('Source replay exports unavailable');
            return res;
          }
          const originalIndex=buildEngine(source,false);
          const patchedIndex=buildEngine(stageIndex,true);
          const originalBoard=buildEngine(sourceBoard,false);
          const patchedBoard=buildEngine(stageBoard,true);
          if(cases.length!==72 || new Set(cases.map(c=>c.sleeper_id)).size!==72) fail('Bad 72-player cohort');
          const expected={
            '7083':{name:'Tyler Huntley',age:28,role:'Starter',value:1250,baseline:7150},
            '5854':{name:'Drew Lock',age:29,role:'Rotational',value:1104,baseline:4648},
            '8162':{name:'Sam Howell',age:26,role:'Rotational',value:1098,baseline:4648}
          };
          for(const [sid,decision] of Object.entries(expected)){
            const p=mapping.get(sid);
            if(!p||p.player!==decision.name||p.current_fv_UNCHANGED!==decision.baseline||
              p.illustrative_owner_FV_center_NOT_APPROVED!==decision.value||
              p.decision_gate!=='NUMERIC_OWNER_PREVIEW_ONLY_NOT_DEPLOYABLE' ||
              p.owner_approved!=='NO'||p.production_FV_changed!=='NO')
              fail('QA19 candidate drift '+sid);
          }
          function evaluate(engine,c){
            const key=engine.normalizeName(c.player);
            const prior=engine.PLAYER_DB[key];
            if(c.sleeper_birth_date){
              engine.PLAYER_DB[key]={...(prior||{}),birth_date:c.sleeper_birth_date};
            }
            const out=engine.playerValue(c.position,c.age,c.assigned_role,c.player);
            if(prior===undefined)delete engine.PLAYER_DB[key];else engine.PLAYER_DB[key]=prior;
            if(!Number.isInteger(out)||out<0||out>20000) fail('Invalid FV '+c.player);
            return out;
          }
          const records=[];
          for(const c of cases){
            const sid=c.sleeper_id;
            const before=evaluate(originalIndex,c);
            const after=evaluate(patchedIndex,c);
            const bBefore=evaluate(originalBoard,c);
            const bAfter=evaluate(patchedBoard,c);
            const target=expected[sid]||null;
            if(target){
              if(c.player!==target.name||c.position!=='QB'||c.age!==target.age||
                c.assigned_role!==target.role||before!==target.baseline||bBefore!==target.baseline||
                after!==target.value||bAfter!==target.value)
                fail('Three-player exact baseline or preview drift '+sid+' '+JSON.stringify({before,after,bBefore,bAfter}));
              // Role/age changes deliberately revert to unmodified live FV, never silently override.
              const probes=[
                { ...c,assigned_role:'Speculative'},
                { ...c,age:c.age+1},
                { ...c,position:'RB'}
              ];
              for(const probe of probes){
                if(evaluate(originalIndex,probe)!==evaluate(patchedIndex,probe))
                  fail('Preview conditional leaked to changed role/age/position '+sid);
              }
            }else if(before!==after||bBefore!==bAfter)fail('Non-target preview mutation '+sid);
            if(before!==bBefore||after!==bAfter)fail('Index versus free-agent board model disagrees '+sid);
            records.push({sleeper_id:sid,player:c.player,position:c.position,fantasy_slot:c.fantasy_slot,
              actual_baseline_current_source:before,qa08_frozen_baseline:c.published_fv,
              staged_preview_FV:after,illustrative_delta:after-before,
              original_source_drift_from_QA08:before-c.published_fv,
              candidate_selected:!!target,
              owner_release_authorized:false});
          }
          if(records.filter(x=>x.candidate_selected).length!==3||
            records.filter(x=>x.illustrative_delta!==0).length!==3) fail('Not exactly three corrections');
          fs.writeFileSync(output+'/QA20_72_Player_Live_Function_Parity.json',JSON.stringify(records,null,2)+'\n');
          console.log(JSON.stringify({qa20:'READ_ONLY_PREVIEW',cohort:records.length,changed:3,
            other69_unchanged:records.filter(x=>!x.candidate_selected&&x.illustrative_delta===0).length,
            pinned_baseline_drift:records.filter(x=>x.original_source_drift_from_QA08!==0).length,
            both_ui_pages_tested:true}));

          JS_REPLAY
          node --check "$RUNNER_TEMP/qa20_replay.js"
          node "$RUNNER_TEMP/qa20_replay.js"
      - name: Build owner review and validate 72-player parity
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa20_report.py" <<'PY_REPORT'
          #!/usr/bin/env python3
          import csv,datetime,json,os,pathlib
          out=pathlib.Path(os.environ['QA20_OUT'])
          m=json.loads((out/'QA20_Manifest.json').read_text())
          rows=json.loads((out/'QA20_72_Player_Live_Function_Parity.json').read_text())
          if len(rows)!=72 or len({x['sleeper_id'] for x in rows})!=72:raise AssertionError('QA20 cohort changed')
          if len([x for x in rows if x['illustrative_delta']!=0])!=3:raise AssertionError('Unexpected change count')
          assert all(x['illustrative_delta']==0 for x in rows if not x['candidate_selected'])
          with (out/'QA20_72_Player_Pricing_Parity.csv').open('w',newline='',encoding='utf8') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          t=[x for x in rows if x['candidate_selected']];t.sort(key=lambda x:-x['actual_baseline_current_source'])
          with (out/'QA20_Three_QB_Owner_Review.csv').open('w',newline='',encoding='utf8') as f:
            w=csv.DictWriter(f,fieldnames=list(t[0]));w.writeheader();w.writerows(t)
          report=['# QA20 — Controlled three-QB FV preview — owner decision only','',
            '**No production release, no owner approval implied.**', '',
            '## Staged numeric impact using actual uncurated-roster fallback function','',
            '| Player | Current live FV | Staged hypothetical FV | Change |','|---|---:|---:|---:|']
          for r in t:
            report.append(f"| {r['player']} | {r['actual_baseline_current_source']:,} | {r['staged_preview_FV']:,} | {r['illustrative_delta']:+,} |")
          report.extend(['','## Source and blast radius checks','',
            f"- Original 72 uncurated players compared: **{len(rows)}**; only **3** change in staged source, other **69** remain identical.",
            f"- Curated static players unchanged: **{m['curated_reference_count']}**.",
            f"- Historical owner-approved price anchors unchanged: **{m['existing_owner_anchor_count']}**.",
            f"- Original QA08 parity baseline drift since frozen source: **{len([r for r in rows if r['original_source_drift_from_QA08']])}** cases; see CSV.",
            '- Staged index and free-agent board pricing functions agreed on all 72 hypothetical roster profiles.',
            '- The three interventions are explicitly limited to matching player name, QB position, age and original fantasy roster role.',
            '- Changing the role, age or position bypasses the staged override and returns the existing formula value.',
            '- The underlying roster-slot-as-NFL-role bug is **not repaired by this explicit-price example**.',
            '- Scenario values come from two internal FV reference ranges ordered by FP rankings; they are **not cardinal independent market prices**.',
            '- This confirms software isolation, not correctness of numeric FV, FV+ or MV, future production accuracy, or the full live web UI.',
            '- The still-unresolved other 69 uncurated valuations require broader structural resolution.',
            '- No staged HTML is committed or used by production. QA20 files are research outputs only.',
            '', '## Owner decision', '',
            'Approve/reject each hypothetical price **as a pricing decision only**. Any release requires a new, separate production authorization and full regression tests.',
            '','Source timestamps: QA08 original Oct 30; QA19 Oct 31. Live roster snapshot and SHA values are recorded in the manifest.', ''])
          (out/'QA20_Report.md').write_text('\n'.join(report))
          assert m['read_only'] and not m['owner_release_authorized'] and m['production_value_changes']==0
          print(json.dumps({'status':m['status'],'preview_qbs':len(t),'curated_unchanged':m['curated_reference_count']}))

          PY_REPORT
          python3 -m py_compile "$RUNNER_TEMP/qa20_report.py"
          python3 "$RUNNER_TEMP/qa20_report.py"
      - name: Enforce zero production or repository changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY_SAFE'
          import json,os,pathlib
          m=json.loads((pathlib.Path(os.environ['QA20_OUT'])/'QA20_Manifest.json').read_text())
          assert m['read_only'] and not m['owner_release_authorized']
          assert m['curated_reference_count']==565 and m['existing_owner_anchor_count']==15
          assert m['selected_candidates']==3
          assert all(m[k]==0 for k in ('production_value_changes','fv_plus_changes','mv_changes','repo_mutations'))
          PY_SAFE
      - name: Upload reversible staged files and guarded owner preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A-QA20-Controlled-3QB-Price-Preview
          path: /tmp/a-qa20-out/
          retention-days: 30
          if-no-files-found: error
      - name: Mobile-readable decision report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$QA20_OUT/QA20_Report.md"; then
            cat "$QA20_OUT/QA20_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A-QA20 halted; no changes to production." >> "$GITHUB_STEP_SUMMARY"
          fi
