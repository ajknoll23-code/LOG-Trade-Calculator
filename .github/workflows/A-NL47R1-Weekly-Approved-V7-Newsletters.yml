name: A-NL47R1 - LOG Approved Weekly Newsletters (One Run)
run-name: A-NL47R1 - Final War Room W${{ inputs.war_week }} and previous Aftermath with V7 and unit leaderboards
'on':
  workflow_dispatch:
    inputs:
      war_week:
        description: Upcoming War Room week (completed Aftermath is one week earlier). W9 reissue uses completed W8.
        type: string
        required: true
        default: '9'
      refresh_sources:
        description: Generate new underlying NL39, NL44 and NL45 artifacts rather than reuse matching successful runs
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: log-nl47r1-owner-approved-week-${{ inputs.war_week }}
  cancel-in-progress: false
jobs:
  approved-newsletters:
    name: Reconcile sources and generate two share-ready 11-page PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select or dispatch exact-week newsletter and starter-scoring evidence
        id: sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WAR_WEEK: ${{ inputs.war_week }}
          REFRESH_SOURCES: ${{ inputs.refresh_sources }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nl47_resolve.py" <<'NL47_RESOLVE'
          #!/usr/bin/env python3
          """Select or dispatch the exact successful newsletter lineage for a selected NFL week.

          Calls only approved existing GitHub Actions, never mutates repo files or scores.
          Downstream render revalidates Week, NL44 V7 weights and NL45 season reconciliation.
          """
          from __future__ import annotations
          import json, os, re, sys, time
          import urllib.error
          import urllib.request

          REPO=os.environ['GITHUB_REPOSITORY']
          TOKEN=os.environ['GH_TOKEN']
          WAR=int(os.environ['WAR_WEEK'])
          REFRESH=os.environ.get('REFRESH_SOURCES','false').lower()=='true'
          BASE=f'https://api.github.com/repos/{REPO}'
          if not 4<=WAR<=18:raise ValueError('War Room week must be between 4 and 18')
          SCORED=WAR-1
          HEADERS={
              'Authorization':'Bearer '+TOKEN,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'LOG-NL47R1-Approved-Weekly-PDFs'}
          SPEC={
              'nl39':{
                  'filename':'A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml',
                  'regex':rf'\bWar Room W0?{WAR}(?!\d)',
                  'inputs':{'war_week':str(WAR)},
                  'artifact':lambda rid:f'LOG-NL39R1-Weekly-Newsroom-Shadow-{rid}'},
              'nl44':{
                  'filename':'A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml',
                  'regex':rf'\bWar Room W0?{WAR}(?!\d)',
                  'inputs':{},
                  'artifact':lambda rid:f'LOG-W{WAR}-V7-WarRoom-RELEASE-{rid}'},
              'nl45':{
                  'filename':'A-NL45R1-Offense-IDP-Leaderboard-ReadOnly.yml',
                  'regex':rf'\bWeek\s+0?{SCORED}(?!\d)',
                  'inputs':{'through_week':str(SCORED)},
                  'artifact':lambda rid:f'LOG-NL45R1-Offense-IDP-Scoring-Through-W{SCORED}-{rid}'},
          }

          def call(method,path,payload=None):
              data=json.dumps(payload).encode('utf-8') if payload is not None else None
              hdr=dict(HEADERS)
              if payload is not None:hdr['Content-Type']='application/json'
              request=urllib.request.Request(BASE+path,data=data,headers=hdr,method=method)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request,timeout=35) as response:
                          raw=response.read()
                          return json.loads(raw) if raw else None
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429,500,502,503,504) or attempt==2:raise
                  except (TimeoutError,urllib.error.URLError):
                      if attempt==2:raise
                  time.sleep(2*(attempt+1))

          def matches(kind,run,require_success=True):
              cfg=SPEC[kind]
              result=(run.get('path')=='.github/workflows/'+cfg['filename']
                      and run.get('head_branch')=='main'
                      and run.get('event')=='workflow_dispatch'
                      and bool(re.search(cfg['regex'],str(run.get('display_title') or ''),re.I)))
              return result and (not require_success or (run.get('status')=='completed' and run.get('conclusion')=='success'))

          def list_runs(kind):
              cfg=SPEC[kind];out=[]
              for page in range(1,5):
                  js=call('GET',f'/actions/workflows/{cfg["filename"]}/runs?event=workflow_dispatch&branch=main&per_page=100&page={page}')
                  all_runs=js.get('workflow_runs',[])
                  out.extend(r for r in all_runs if matches(kind,r,False))
                  if len(all_runs)<100:break
              return out

          def wait_for_new(kind,old_ids):
              deadline=time.monotonic()+20*60
              new_id=None
              while time.monotonic()<deadline:
                  new=[r for r in list_runs(kind) if int(r['id']) not in old_ids]
                  if len(new)>1:raise RuntimeError(f'Ambiguous newly dispatched {kind} runs: {[r["id"] for r in new]}')
                  if new:
                      new_id=int(new[0]['id'])
                      break
                  time.sleep(5)
              if not new_id:raise RuntimeError(f'Could not identify newly dispatched {kind} run')
              print(f'INFO: dispatched {kind} run #{new_id}',flush=True)
              while time.monotonic()<deadline:
                  r=call('GET',f'/actions/runs/{new_id}')
                  if not matches(kind,r,False):raise RuntimeError(f'{kind} run identity changed mid-flight')
                  if r.get('status')=='completed':
                      if r.get('conclusion')!='success':raise RuntimeError(f'{kind} #{new_id} concluded {r.get("conclusion")}; cannot release')
                      return r
                  time.sleep(8)
              raise RuntimeError(f'Timed out waiting for {kind} #{new_id}')

          def choose(kind):
              cfg=SPEC[kind]
              existing=list_runs(kind)
              ready=sorted((r for r in existing if matches(kind,r)),key=lambda x:int(x['id']),reverse=True)
              if ready and not REFRESH:
                  print(f'REUSE {kind} #{ready[0]["id"]} for War W{WAR}, scored through W{SCORED}',flush=True)
                  return ready[0]
              inputs=dict(cfg['inputs'])
              if kind=='nl44':
                  if 'nl39' not in chosen:raise RuntimeError('NL44 requires an exact known NL39 run')
                  inputs={'war_week':str(WAR),'source_nl39_run_id':str(chosen['nl39']['id'])}
              before={int(r['id']) for r in existing}
              print(f'DISPATCH {kind} via approved {cfg["filename"]} with {inputs}',flush=True)
              call('POST',f'/actions/workflows/{cfg["filename"]}/dispatches',{'ref':'main','inputs':inputs})
              return wait_for_new(kind,before)

          def verify_artifact(kind,run):
              rid=int(run['id']);expected=SPEC[kind]['artifact'](rid)
              response=call('GET',f'/actions/runs/{rid}/artifacts?per_page=100')
              matches_=[x for x in response.get('artifacts',[]) if x.get('name')==expected and not x.get('expired')]
              if len(matches_)!=1:raise RuntimeError(f'Expected one unexpired artifact {expected}, found {len(matches_)}')
              return expected

          chosen={}
          for key in ('nl39','nl44','nl45'):
              run=choose(key)
              name=verify_artifact(key,run)
              chosen[key]={'id':int(run['id']),'artifact':name,'path':run['path'],'status':'success','week':WAR if key!='nl45' else SCORED}
              print(f'PASS: {key} GitHub run #{run["id"]}: {name}',flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              for key,value in chosen.items():
                  f.write(f'{key}_id={value["id"]}\n{key}_artifact={value["artifact"]}\n')
          with open('NL47-SOURCE-RUN-IDS.json','w',encoding='utf-8') as f:
              json.dump({'war_week':WAR,'scored_through_week':SCORED,'source_runs':chosen,'refresh_sources':REFRESH},f,indent=2)
          print('PASS: all exact-week approved upstream artifacts present; proceeding to independent PDF audit',flush=True)
          NL47_RESOLVE
          python3 "$RUNNER_TEMP/nl47_resolve.py"
      - name: Download approved NL44 production V7 War Room source
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.nl44_artifact }}
          run-id: ${{ steps.sources.outputs.nl44_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl47_input/nl44
      - name: Download reconciled offense and IDP starter-scoring source
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.nl45_artifact }}
          run-id: ${{ steps.sources.outputs.nl45_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl47_input/nl45
      - name: Download exact matched NL39 original matchup articles
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.sources.outputs.nl39_artifact }}
          run-id: ${{ steps.sources.outputs.nl39_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl47_input/nl39
      - name: Install pinned PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5'
      - name: Rehydrate approved NL46 layout with production-safe Aftermath metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nl47_module.b64" <<'NL47_MODULE_B64'
