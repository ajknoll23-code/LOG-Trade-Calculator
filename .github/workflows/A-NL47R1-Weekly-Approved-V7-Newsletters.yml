      - name: Render and verify both final PDF editions
        shell: bash
        env:
          WAR_WEEK: ${{ inputs.war_week }}
          NL44_RUN: ${{ steps.sources.outputs.nl44_id }}
          NL45_RUN: ${{ steps.sources.outputs.nl45_id }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/nl47_production.py" \
            --input nl47_input --output nl47_output --war-week "$WAR_WEEK" \
            --mode Release --nl44-run-id "$NL44_RUN" --nl45-run-id "$NL45_RUN"
          cp NL47-SOURCE-RUN-IDS.json nl47_output/NL47-SOURCE-RUN-IDS.json
          python3 - <<'NL47_FINAL_AUDIT'
          from pathlib import Path
          import fitz, json, os, re
          w=int(os.environ['WAR_WEEK']);p=w-1
          d=Path('nl47_output')
          candidates={'WarRoom':d/f'LOG-W{w:02d}-War-Room-V7-Offense-IDP-Final.pdf',
                      'Aftermath':d/f'LOG-W{p:02d}-Aftermath-V7-Offense-IDP-Final.pdf'}
          for edition,path in candidates.items():
              if not path.is_file():raise RuntimeError(f'{edition} final PDF missing')
              with fitz.open(path) as pdf:
                  if len(pdf)!=11:raise RuntimeError(f'{edition}: expected 11 pages, got {len(pdf)}')
                  body=' '.join(page.get_text() for page in pdf)
                  if 'NOT PUBLISHED' in body or 'SHADOW' in body:
                      raise RuntimeError(f'{edition} still contains draft-only metadata')
                  if 'POSITIONAL SCORING LEADERS' in body:
                      raise RuntimeError(f'{edition}: removed section resurfaced')
                  for index,title in [(7,'POWER RANKINGS / V7'),(9,'OFFENSIVE POWERHOUSES'),(10,'DEFENSIVE POWERHOUSES')]:
                      if title not in pdf[index].get_text():
                          raise RuntimeError(f'{edition}: missing approved section {title}')
                  for index in range(1,7):
                      if f'MATCHUP {index:02d} / 06' not in pdf[index].get_text():
                          raise RuntimeError(f'{edition}: missing matchup #{index}')
                  if re.search(r'(?i)free.agent.*(ranking|scouting|target)',body):
                      raise RuntimeError(f'{edition}: possible private FA-board reference')
                  print(f'PASS FINAL {edition}: {len(pdf)} pages, 6 matchups, V7, H2H/median, 12 offenses and 12 IDP teams, no removed section: {path}')
          manifest=json.loads((d/'NL46-VERIFIED-SOURCE-MANIFEST.json').read_text())
          if manifest.get('model')!='V7' or int(manifest.get('war_week'))!=w or int(manifest.get('scored_through_week'))!=p:
              raise RuntimeError('Cross-week or formula drift in final manifests')
          print('PASS: two fully reconciled final newsletter PDFs; no repository, mail, picks-archive or private FA changes')
          NL47_FINAL_AUDIT
      - name: Upload approved share-ready PDFs and source evidence (no email or repository writes)
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL47R1-W${{ inputs.war_week }}-APPROVED-WEEKLY-PDFS-${{ github.run_id }}
          path: nl47_output/
          retention-days: 90
          if-no-files-found: error
      - name: Show weekly newsletter release summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NL47_SUMMARY'
          ## LOG NL47R1 — Approved weekly newsletter PDF editions
          - ONE workflow invocation finds or builds the exact-week approved NL39 writing, NL44 V7 power ranks, and NL45 verified starter scoring.
          - **Both PDFs are share-ready**: War Room W${{ inputs.war_week }} and the preceding completed-week Aftermath.
          - Each edition has six matchup articles, two V7 rankings pages with H2H/median records, and two full 12-team offense / IDP scoring leaderboards (11 pages total).
          - The **Positional Scoring Leaders** section is permanently excluded from this workflow.
          - The original article copy is preserved. Only draft/shadow metadata is cleaned from the Aftermath source.
          - Frozen V7 weights: 35% season scoring, 20% all-play, 10% recent, 25% scoring floor, 10% H2H.
          - No automatic email, social posting, git commits, FA scouting, trade values, or production data modifications.
          - Your downloadable artifact has two ready-to-share PDFs plus two source integrity manifests.
          NL47_SUMMARY
