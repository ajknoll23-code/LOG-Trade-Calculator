name: Package Adjustment V6 Development Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard historical package-adjustment evidence
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain=v1)"

          # V3: original 1-vs-N indifference study.
          test "$(git hash-object research/package-adjustment-v3/generate_package_vote_challenges_v3.py)" = \
            "3c7598b3174036d6dec31f5ef220e2a40d5c34fb"
          test "$(git hash-object research/package-adjustment-v3/package_vote_v3_fit_diagnostics.md)" = \
            "6b23eea8a4229452f4b6ae691f370b8c4a415ec8"

          # V4: fixed 45/33/22 three-player extension.
          test "$(git hash-object research/package-adjustment-v4/generate_package_vote_challenges_v4.py)" = \
            "16ec2d9156281c0527b48a643a3c528d2e09f92d"
          test "$(git hash-object research/package-adjustment-v4/package_vote_v4_results.md)" = \
            "415ec7f233a24dc238cce3a6295db28d38176cf8"
          test "$(git hash-object research/package-adjustment-v4/package_vote_v4_fit_diagnostics.md)" = \
            "3955921585d1fd9187340e8000353026bb88e954"

          # V5: two-player composition expansion that became the V1.6 overlay.
          test "$(git hash-object research/package-adjustment-v5/package_vote_v5_results.md)" = \
            "04f48cd916006c105878f7cac3ed48082601c39e"
          test "$(git hash-object research/package-adjustment-v5/package_vote_v5_fit_diagnostics.md)" = \
            "79fbfc334042c7bb4e9a4b7cd46b1fdc5429512d"
          test "$(git hash-object research/package-adjustment-v5/evidence_hardening.md)" = \
            "059df13b62ae4ac548db235c4b46945e52962943"
          test "$(git hash-object research/package-adjustment-v5/production_candidate_design.md)" = \
            "97f816c7d532e9cf8273ad48ac45a409189b2258"

          # Closed NextGen V2 evidence: used only to prevent retesting already-tried ideas.
          test "$(git hash-object research/package-adjustment-nextgen-v2/model_fit_preregistration.json)" = \
            "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object research/package-adjustment-nextgen-v2/model_fit_beta_amended_v1_results.json)" = \
            "22efc47a2ce32bb9bcba35a5ec48cbccaf953c50"
          test "$(git hash-object research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json)" = \
            "ff29e53ff05e1a96e47d9f91e535585d438f788f"
          test "$(git hash-object research/package-adjustment-nextgen-v2/m3_development_fit_summary_v1.md)" = \
            "2a265205d38a0552068b54fcc0b0aa344580ab64"

          test ! -e research/package-adjustment-v6/development_preregistration_v1.json
          test ! -e research/package-adjustment-v6/development_preregistration_v1.md
          test ! -e research/package-adjustment-v6/development_preregistration_v1_manifest.json

      - name: Verify production remains V1.6
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze V6 development design before new voting
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          D = ROOT / "research/package-adjustment-v6"
          D.mkdir(parents=True, exist_ok=False)

          CFG = D / "development_preregistration_v1.json"
          MD = D / "development_preregistration_v1.md"
          MAN = D / "development_preregistration_v1_manifest.json"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          phi_ref = 1.0 - (0.45**2 + 0.33**2 + 0.22**2)
          assert abs(phi_ref - 0.6402) < 1e-12

          profiles = [
              {"label": "45/33/22", "shares": [0.45, 0.33, 0.22]},
              {"label": "50/30/20", "shares": [0.50, 0.30, 0.20]},
              {"label": "50/25/25", "shares": [0.50, 0.25, 0.25]},
              {"label": "55/30/15", "shares": [0.55, 0.30, 0.15]},
              {"label": "60/25/15", "shares": [0.60, 0.25, 0.15]},
              {"label": "60/20/20", "shares": [0.60, 0.20, 0.20]},
          ]
          for p in profiles:
              p["hhi"] = sum(x*x for x in p["shares"])
              p["phi"] = 1.0 - p["hhi"]

          # Ratio cells are generated from apex-piece/target levels rather than
          # hand-picking a different raw-ratio grid for each composition.
          # This keeps every package piece below the target while creating a
          # reproducible 24-cell design.
          apex_to_target_levels = [0.70, 0.80, 0.90, 0.97]

          source_paths = [
              "research/package-adjustment-v3/generate_package_vote_challenges_v3.py",
              "research/package-adjustment-v3/package_vote_v3_fit_diagnostics.md",
              "research/package-adjustment-v4/generate_package_vote_challenges_v4.py",
              "research/package-adjustment-v4/package_vote_v4_results.md",
              "research/package-adjustment-v4/package_vote_v4_fit_diagnostics.md",
              "research/package-adjustment-v5/package_vote_v5_results.md",
              "research/package-adjustment-v5/package_vote_v5_fit_diagnostics.md",
              "research/package-adjustment-v5/evidence_hardening.md",
              "research/package-adjustment-v5/production_candidate_design.md",
              "research/package-adjustment-nextgen-v2/model_fit_preregistration.json",
              "research/package-adjustment-nextgen-v2/model_fit_beta_amended_v1_results.json",
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json",
              "research/package-adjustment-nextgen-v2/m3_development_fit_summary_v1.md",
              "scripts/market/package_vote_v4_pipeline.py",
              "scripts/market/package_vote_v5_pipeline.py",
              "scripts/market/ktc_pipeline.py",
              "scripts/validation/check_package_adjustment_live.py",
          ]
          provenance = {
              p: {"sha256": sha256(ROOT / p)}
              for p in source_paths
          }

          generated = datetime.now(timezone.utc).isoformat()

          cfg = {
              "schema_version": 1,
              "plan_id": "package-adjustment-v6-development-prereg-v1",
              "status": "frozen_v6_development_preregistration",
              "frozen": True,
              "generated_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "production_revision_must_remain": "v1.6-v5-size2-composition-overlay",
              "research_question": (
                  "Can the existing evidence-backed three-player consolidation adjustment "
                  "be extended continuously across nearby 1-vs-3 package compositions "
                  "without changing intrinsic FV, without disturbing the frozen two-player "
                  "V1.6 adjustment, and without fitting to any named anecdotal trade?"
              ),
              "scope": {
                  "eligible_topology": "exactly_one_player_vs_exactly_three_players",
                  "player_only": True,
                  "draft_picks_allowed": False,
                  "all_three_package_players_must_have_fv_strictly_below_target": True,
                  "supported_positions": ["QB", "RB", "WR", "TE", "DL", "LB", "DB"],
                  "size2_production_behavior": "frozen_V1.6_unchanged",
                  "multi_vs_multi_behavior": "out_of_scope_frozen_V1.6_fail_closed_semantics",
                  "size4_plus_behavior": "out_of_scope",
                  "intrinsic_player_fv_changes": False,
                  "team_utility_changes": False,
                  "market_value_changes": False,
                  "motivating_named_trade_is_never_a_fit_target": True,
              },
              "historical_evidence_classification": {
                  "V3": {
                      "role": "spent_development_anchor_and_design_evidence",
                      "facts": {
                          "votes": 300,
                          "voters": 15,
                          "targets": 20,
                          "size2_shape": [0.51, 0.49],
                          "size3_shape": [0.45, 0.33, 0.22],
                      },
                  },
                  "V4": {
                      "role": "spent_development_anchor_and_design_evidence",
                      "facts": {
                          "votes": 300,
                          "voters": 15,
                          "targets": 20,
                          "shape": [0.45, 0.33, 0.22],
                          "tested_ratios": [1.75, 1.85, 1.95, 2.05, 2.15],
                          "ratio_only_indifference": 2.0512371846911357,
                          "ratio_only_lowest_AIC": True,
                      },
                  },
                  "V5": {
                      "role": "methodological_design_evidence_only_for_V6_size3",
                      "facts": {
                          "votes": 600,
                          "voters": 30,
                          "topology": "one_vs_two",
                          "composition_expansion_review_ceiling": "60/40",
                      },
                      "restriction": (
                          "V5 size2 composition effects may inform study design and hardening "
                          "methods but are not treated as estimates of the size3 composition slope."
                      ),
                  },
                  "NextGen_V2": {
                      "role": "spent_negative_and_methodological_evidence",
                      "facts": {
                          "all_129_first_wave_challenges_multi_piece_vs_multi_piece": True,
                          "constant_power_norm_M2a_already_tested": True,
                          "M2a_p_fit": 1.0,
                          "M2a_bootstrap_favorable_fraction_vs_M0": 0.52,
                          "M2b_generic_convex_independent_utility_failed_fresh_prospective_validation": True,
                          "M3_scale_topology_top_share_gates_failed_to_rescue_M2b": True,
                      },
                      "restriction": (
                          "The spent NextGen evidence may not count as confirmation for V6 "
                          "and does not contain the 1-vs-3 topology targeted here."
                      ),
                  },
              },
              "why_new_development_votes_are_required": (
                  "Historical V4 identifies the 3-player indifference level only near 45/33/22. "
                  "It contains no three-player composition variation, so the HHI/fragmentation "
                  "slope is not identifiable from existing V4 evidence. V5 varies composition "
                  "only for size2 and cannot be silently transferred to size3."
              ),
              "development_catalog_design": {
                  "catalog_generated_only_after_this_preregistration_is_committed": True,
                  "candidate_predictions_may_not_be_used_to_select_challenges": True,
                  "target_selection_must_be_programmatic_from_frozen_player_FV_snapshot": True,
                  "minimum_distinct_targets": 20,
                  "target_position_coverage_required": ["QB", "RB", "WR", "TE", "DL", "LB", "DB"],
                  "composition_profiles": profiles,
                  "apex_piece_to_target_levels": apex_to_target_levels,
                  "research_cells": "composition_profile_x_apex_piece_to_target_level",
                  "cell_count": len(profiles) * len(apex_to_target_levels),
                  "ratio_rule": (
                      "For profile top share s1 and apex level a, raw package/target ratio target = a/s1. "
                      "This makes the intended largest package piece equal a*target_FV and keeps it below target."
                  ),
                  "paired_shape_checks": [
                      {
                          "pair": ["50/30/20", "50/25/25"],
                          "purpose": "near-HHI pair tests whether HHI alone misses remainder-shape preference",
                      },
                      {
                          "pair": ["60/25/15", "60/20/20"],
                          "purpose": "near-HHI pair tests whether HHI alone misses remainder-shape preference",
                      },
                  ],
                  "exact_named_motivating_trade_excluded": True,
                  "display_side_randomization_required": True,
              },
              "development_maturity_and_stopping": {
                  "outcome_blind_coverage_only": True,
                  "first_effective_vote_checkpoint": 600,
                  "coverage_retry_increment": 100,
                  "hard_cap_effective_votes": 800,
                  "minimum_distinct_voters": 30,
                  "minimum_effective_votes_per_cell": 15,
                  "minimum_distinct_voters_per_cell": 10,
                  "required_cell_count": len(profiles) * len(apex_to_target_levels),
                  "effect_direction_may_change_stopping": False,
                  "significance_may_change_stopping": False,
                  "daily_valid_vote_cap_per_voter": 20,
                  "effective_lifetime_vote_cap_per_voter": 30,
              },
              "shared_probability_layer": {
                  "v_ref": 5401.0,
                  "canonical_outcome": "package_preferred",
                  "probability": (
                      "logistic(beta * (ScorePackage - ScoreTarget) / 5401 "
                      "+ delta_left * I(package_displayed_left))"
                  ),
                  "beta_parameterization": "beta=exp(log_beta)",
                  "generic_intercept": False,
                  "log_beta_bounds": [-8.0, 8.0],
                  "delta_left_bounds": [-2.0, 2.0],
                  "beta_and_delta_refit_inside_each_training_fold_for_every_model": True,
                  "same_link_and_calibration_rules_for_all_candidates": True,
              },
              "models": {
                  "C0": {
                      "name": "raw_additive_control",
                      "role": "control",
                      "ScorePackage": "sum(package_fv)",
                      "ScoreTarget": "target_fv",
                      "free_structural_parameters": 0,
                  },
                  "C1": {
                      "name": "frozen_production_v1_6",
                      "role": "production_baseline",
                      "definition": (
                          "Exact current V1.6 verdict-side package adjustment semantics. "
                          "Inside its supported V4 core, use the frozen size3 adjustment; "
                          "outside support, fail closed exactly as production does."
                      ),
                      "free_structural_parameters": 0,
                  },
                  "C2": {
                      "name": "one_vs_three_constant_power_norm_diagnostic",
                      "role": "challenger_but_not_evidence_of_universal_power_norm",
                      "ScorePackage": "(sum(v_i**q))**(1/q)",
                      "ScoreTarget": "target_fv",
                      "q_bounds": [1.0, 6.0],
                      "q_equals_1_allowed_as_raw_FV_collapse": True,
                      "q_upper_boundary_is_unresolved": True,
                      "free_structural_parameters": 1,
                      "historical_note": (
                          "NextGen M2a already tested q in [1,3] on multi-v-multi and fitted q=1. "
                          "C2 is retained only to test the distinct 1-vs-3 domain; it may never be "
                          "interpreted as validation of a universal all-topology power norm."
                      ),
                  },
                  "C4": {
                      "name": "one_vs_three_rank_decayed_order_statistic_utility",
                      "role": "primary_independent_utility_challenger",
                      "sort_rule": "v_(1)>=v_(2)>=v_(3)",
                      "ScorePackage": "v_(1) + lambda*v_(2) + lambda**2*v_(3)",
                      "ScoreTarget": "target_fv",
                      "lambda_bounds": [0.0, 1.0],
                      "lambda_zero_boundary_is_unresolved": True,
                      "lambda_one_allowed_as_raw_FV_collapse": True,
                      "free_structural_parameters": 1,
                  },
                  "C5": {
                      "name": "three_player_HHI_fragmentation_threshold",
                      "role": "primary_continuous_extension_of_V4",
                      "package_total": "S=sum(v_i)",
                      "shares": "s_i=v_i/S",
                      "hhi": "H=sum(s_i**2)",
                      "fragmentation": "phi=1-H",
                      "phi_ref": phi_ref,
                      "eta": "a0 + a_phi*(phi-phi_ref)",
                      "multiplier": "m(phi)=1+exp(eta)",
                      "ScorePackage": "S",
                      "ScoreTarget": "target_fv*m(phi)",
                      "a0_bounds": [math.log(0.75), math.log(1.15)],
                      "a0_bound_interpretation": (
                          "At phi_ref, m_ref=1+exp(a0) is constrained to the V4 tested "
                          "indifference bracket [1.75,2.15]."
                      ),
                      "a_phi_bounds": [0.0, 0.5],
                      "a_phi_zero_allowed": (
                          "Yes; it reduces to a composition-invariant 3-player multiplier."
                      ),
                      "a_phi_upper_boundary_is_unresolved": True,
                      "free_structural_parameters": 2,
                      "hard_mathematical_constraint": (
                          "d log(m)/d phi < a_phi <= 0.5. Since "
                          "d phi/d v_j = 2*(H-s_j)/S, this is a sufficient global condition "
                          "for d log[S/m(phi)]/d v_j >= 0 for every existing package asset. "
                          "Therefore increasing any existing package player's FV cannot make "
                          "the package less sufficient."
                      ),
                  },
              },
              "mathematical_invariants": {
                  "all_challengers": [
                      "permutation_invariance",
                      "non_negative_scores",
                      "increasing_existing_asset_fv_cannot_make_offer_worse",
                      "same_formula_regardless_of_display_side",
                      "no_named_player_or_challenge_id_feature",
                  ],
                  "C2": [
                      "singleton_identity",
                      "coordinatewise_monotonicity_for_q>=1",
                      "split_penalty_for_q>1",
                  ],
                  "C4": [
                      "permutation_invariance_after_sorting",
                      "coordinatewise_monotonicity_for_0<=lambda<=1",
                      "nonincreasing_rank_weights",
                  ],
                  "C5": [
                      "HHI_strictly_decreases_under_any_nontrivial_split",
                      "phi_strictly_increases_under_any_nontrivial_split",
                      "m_strictly_increases_with_phi_when_a_phi>0",
                      "package_sufficiency_coordinatewise_monotonicity_under_a_phi<=0.5",
                      "continuity_in_all_existing_package_FVs",
                  ],
                  "property_test_requirement": (
                      "Before any fit result is accepted, run at least 1,000,000 deterministic "
                      "randomized eligible 1-vs-3 vectors across the preregistered production "
                      "domain and verify every hard invariant numerically in addition to the "
                      "analytic checks."
                  ),
              },
              "development_cross_validation": {
                  "method": "deterministic_stratified_grouped_challenge_5_fold",
                  "grouping_unit": "challenge_id",
                  "all_ballots_for_one_challenge_stay_in_same_fold": True,
                  "stratification_unit": "research_cell",
                  "fold_count": 5,
                  "fold_assignment": (
                      "Within each research cell, sort challenge IDs by "
                      "sha256('pkgv6-dev-cv-v1|' + challenge_id), then round-robin across folds."
                  ),
                  "voter_weights": (
                      "Freeze original development ballot weights before CV; do not reapply "
                      "daily or lifetime caps inside folds."
                  ),
                  "fit_objective": "equal_cell_macro_mean_weighted_negative_log_likelihood",
                  "validation_metric": "equal_cell_macro_mean_weighted_log_loss",
                  "candidate_parameters_fit_on_training_challenges_only": True,
                  "beta_delta_fit_on_training_challenges_only": True,
                  "note_on_voter_dependence": (
                      "Challenge grouping prevents trade-construction leakage. Repeated-voter "
                      "dependence is handled in uncertainty by crossed voter/challenge resampling; "
                      "no voter-specific parameter is fitted."
                  ),
              },
              "development_selection": {
                  "production_baseline": "C1",
                  "raw_control": "C0",
                  "eligible_challengers": ["C2", "C4", "C5"],
                  "minimum_combined_cv_improvement_vs_C1": 0.003,
                  "minimum_folds_with_positive_improvement_vs_C1": 3,
                  "maximum_anchor_profile_cv_regression_vs_C1": 0.003,
                  "maximum_any_profile_cv_regression_vs_C1": 0.005,
                  "paired_shape_HHI_residual_gate": (
                      "C5 is ineligible if either preregistered near-HHI profile pair shows "
                      "an absolute package-choice residual difference larger than 0.10 after "
                      "conditioning on fitted score margin in the frozen diagnostic."
                  ),
                  "boundary_saturated_fit_is_ineligible_except_documented_raw_collapse_boundary": True,
                  "selection_rule": (
                      "Among eligible candidates, choose the lowest combined CV log loss. "
                      "If a lower-parameter eligible candidate is within 0.001 absolute log loss "
                      "of the best, select the lower-parameter candidate. If equal complexity, "
                      "select the lower loss without an architecture preference."
                  ),
                  "if_no_candidate_qualifies": (
                      "Stop V6 development. Production remains V1.6 unchanged. No rescue patch."
                  ),
              },
              "uncertainty_and_robustness": {
                  "development_inference_is_not_confirmation": True,
                  "crossed_dependence_dimensions": ["voter_id", "challenge_id"],
                  "required_uncertainty_method": (
                      "crossed/two-way voter-and-challenge cluster resampling for paired "
                      "candidate-minus-baseline log-loss differences"
                  ),
                  "leave_one_target_out_stability_required": True,
                  "leave_one_composition_profile_out_diagnostic_required": True,
                  "exact_named_motivating_trade_may_only_be_scored_after_candidate_freeze": True,
              },
              "fresh_confirmation_requirement": {
                  "required_before_any_production_eligibility": True,
                  "development_votes_are_spent_after_model_selection": True,
                  "candidate_class_and_all_parameters_must_be_frozen_first": True,
                  "prospective_catalog_generated_after_candidate_freeze": True,
                  "prospective_catalog_may_not_be_selected_using_candidate_predictions": True,
                  "new_votes_required": True,
                  "sample_size_not_guessed_now": True,
                  "sample_size_rule": (
                      "After development candidate freeze, run a frozen Monte Carlo power analysis "
                      "using observed development voter/challenge variance and the preregistered "
                      "minimum worthwhile effect to choose the first prospective checkpoint."
                  ),
                  "primary_minimum_practical_improvement_vs_C1_log_loss": 0.005,
                  "family_noninferiority_rule": (
                      "For each preregistered safety family, define paired D=LL_candidate-LL_C1 "
                      "and require the one-sided 95% upper confidence bound from crossed "
                      "voter/challenge resampling to be below a preregistered practical margin delta."
                  ),
                  "no_refitting_on_prospective_votes": True,
                  "one_time_evaluation": True,
                  "separate_human_approved_production_promotion_required_even_after_pass": True,
              },
              "explicit_non_goals": [
                  "Do not reopen or rescue NextGen V2.",
                  "Do not alter size2 V1.6 production adjustment.",
                  "Do not claim C2 is novel or universally validated.",
                  "Do not use KTC values or KTC adjustment as fit targets.",
                  "Do not tune any parameter to make one named trade look correct.",
                  "Do not solve multi-v-multi or 1-vs-4 in this cycle.",
                  "Do not use V5 size2 composition estimates as if they were size3 estimates.",
              ],
              "required_sequence_after_this_freeze": [
                  "generate_and_freeze_unreleased_V6_development_catalog_from_preregistered_rules",
                  "validate_catalog_coverage_and_prove_no_candidate_prediction_was_used",
                  "activate_V6_development_voting",
                  "monitor_only_outcome_blind_coverage_and_stop_at_first_qualified_checkpoint",
                  "freeze_exact_development_evidence",
                  "implement_C0_C1_C2_C4_C5_evaluator_with_shared_probability_layer",
                  "run_preregistered_grouped_CV_and_property_tests",
                  "select_at_most_one_development_candidate_under_frozen_rules",
                  "if_none_qualifies_stop_and_keep_V1.6",
                  "if_one_qualifies_refit_on_all_development_evidence_and_freeze_candidate",
                  "run_frozen_power_simulation_and_preregister_fresh_prospective_test",
                  "generate_new_unseen_prospective_catalog_after_candidate_freeze",
                  "collect_new_votes_to_outcome_blind_stopping_rule",
                  "evaluate_frozen_candidate_once",
                  "if_and_only_if_all_gates_pass_require_separate_human_approved_production_decision",
              ],
              "source_provenance": provenance,
          }

          CFG.write_text(json.dumps(cfg, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          lines = [
              "# Package Adjustment V6 — Development Preregistration",
              "",
              "**Status: FROZEN DEVELOPMENT PLAN — research only. Production remains V1.6.**",
              "",
              "## Scope",
              "",
              "V6 targets one unresolved production gap only: **one player vs exactly three lesser players** "
              "outside the narrow V4 45/33/22 composition envelope. Size2 V1.6 remains frozen and untouched. "
              "Multi-v-multi and 1-vs-4 are out of scope.",
              "",
              "## Why new development voting is necessary",
              "",
              "V4 established the three-player indifference level near 45/33/22, but it never varied "
              "three-player composition. Therefore a continuous composition/fragmentation slope cannot be "
              "identified from the existing V4 evidence. V5 varied composition only for 1-vs-2. "
              "NextGen V2 contained no 1-vs-3 challenges.",
              "",
              "## Frozen development design",
              "",
              f"- Composition profiles: {', '.join(p['label'] for p in profiles)}",
              f"- Fragmentation measure: `phi = 1 - H`, `H = sum(s_i^2)`; V4 reference `phi_ref = {phi_ref:.4f}`.",
              f"- Apex-piece/target levels: {', '.join(f'{x:.2f}' for x in apex_to_target_levels)}.",
              f"- Research cells: `{len(profiles) * len(apex_to_target_levels)}`.",
              "- First maturity checkpoint: 600 effective votes; coverage-only retries at +100; hard cap 800.",
              "- Minimum 30 distinct voters, 15 effective votes/cell, 10 voters/cell.",
              "",
              "## Candidate set",
              "",
              "- **C0:** raw additive FV control.",
              "- **C1:** exact frozen production V1.6 baseline.",
              "- **C2:** constant power norm, scoped only to 1-vs-3; retained as a diagnostic because "
              "NextGen M2a already collapsed to q=1 on multi-v-multi.",
              "- **C4:** one-parameter rank-decayed order-statistic utility.",
              "- **C5:** two-parameter HHI-fragmentation threshold, the direct continuous V4-extension candidate.",
              "",
              "### Corrected C5",
              "",
              "`S = sum(v_i)`, `s_i = v_i/S`, `H = sum(s_i^2)`, `phi = 1-H`.",
              "",
              f"`eta = a0 + a_phi*(phi - {phi_ref:.4f})`",
              "",
              "`m(phi) = 1 + exp(eta)`",
              "",
              "`ScorePackage = S`",
              "",
              "`ScoreTarget = target_FV * m(phi)`",
              "",
              f"`a0 in [{math.log(0.75):.12f}, {math.log(1.15):.12f}]` "
              "(reference multiplier 1.75–2.15).",
              "",
              "`a_phi in [0, 0.5]`.",
              "",
              "The `a_phi <= 0.5` bound is mathematical, not cosmetic: it is a sufficient condition "
              "that increasing the FV of any already-present package player cannot make the offer less sufficient.",
              "",
              "## Shared choice-probability layer",
              "",
              "`P(package) = logistic(beta*(ScorePackage-ScoreTarget)/5401 + "
              "delta_left*I(package_displayed_left))`.",
              "",
              "Every model uses the same link. `beta` and `delta_left` are refit only on each training fold.",
              "",
              "## Selection and governance",
              "",
              "Five-fold deterministic challenge-grouped CV is preregistered. Development evidence can select "
              "at most one candidate but can never confirm production. A selected candidate must be frozen, "
              "followed by a separately generated fresh prospective catalog and new votes. If no development "
              "candidate qualifies, V6 stops and V1.6 stays unchanged. No post-hoc 50/30/20 rescue patch is allowed.",
              "",
          ]
          MD.write_text("\n".join(lines) + "\n", encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "plan_id": cfg["plan_id"],
              "status": "frozen_v6_development_preregistration_manifest",
              "generated_at_utc": generated,
              "frozen": True,
              "research_only": True,
              "production_revision_retained": "v1.6-v5-size2-composition-overlay",
              "development_preregistration_sha256": sha256(CFG),
              "development_summary_sha256": sha256(MD),
              "development_catalog_generated": False,
              "development_voting_activated": False,
              "development_evidence_frozen": False,
              "model_fit_performed": False,
              "candidate_selected": False,
              "fresh_prospective_confirmation_started": False,
              "production_change_authorized": False,
          }
          MAN.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          # Internal contract checks.
          loaded = json.loads(CFG.read_text())
          assert loaded["status"] == "frozen_v6_development_preregistration"
          assert loaded["production_revision_must_remain"] == "v1.6-v5-size2-composition-overlay"
          assert loaded["scope"]["eligible_topology"] == "exactly_one_player_vs_exactly_three_players"
          assert loaded["development_catalog_design"]["cell_count"] == 24
          assert set(loaded["models"]) == {"C0", "C1", "C2", "C4", "C5"}
          assert abs(loaded["models"]["C5"]["phi_ref"] - 0.6402) < 1e-12
          assert loaded["models"]["C5"]["a_phi_bounds"] == [0.0, 0.5]
          assert loaded["fresh_confirmation_requirement"]["required_before_any_production_eligibility"] is True
          assert loaded["production_change_authorized"] is False
          assert manifest["model_fit_performed"] is False
          assert manifest["candidate_selected"] is False

          print("PASS: V6 development preregistration frozen before catalog generation or new voting.")
          print("CFG SHA256:", manifest["development_preregistration_sha256"])
          print("MD SHA256:", manifest["development_summary_sha256"])
          PY

      - name: Validate V6 preregistration and production isolation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          import random
          from pathlib import Path

          p = Path("research/package-adjustment-v6/development_preregistration_v1.json")
          cfg = json.loads(p.read_text())

          c5 = cfg["models"]["C5"]
          phi_ref = float(c5["phi_ref"])
          a0_lo, a0_hi = map(float, c5["a0_bounds"])
          ap_lo, ap_hi = map(float, c5["a_phi_bounds"])

          assert abs(phi_ref - 0.6402) < 1e-12
          assert ap_lo == 0.0 and ap_hi == 0.5
          assert 1.0 + math.exp(a0_lo) == 1.75
          assert abs((1.0 + math.exp(a0_hi)) - 2.15) < 1e-12

          # Deterministic numerical confirmation of the C5 package-sufficiency
          # monotonicity condition over eligible 3-piece vectors and parameter bounds.
          rng = random.Random(20260916)
          for _ in range(200000):
              vals = [10 ** rng.uniform(1.0, 4.0) for _ in range(3)]
              S = sum(vals)
              shares = [v / S for v in vals]
              H = sum(s*s for s in shares)
              phi = 1.0 - H
              a0 = rng.uniform(a0_lo, a0_hi)
              ap = rng.uniform(ap_lo, ap_hi)
              eta = a0 + ap * (phi - phi_ref)
              m = 1.0 + math.exp(eta)
              dlogm_dphi = ap * (m - 1.0) / m
              assert dlogm_dphi <= 0.5 + 1e-15

              for j, sj in enumerate(shares):
                  # d log[S/m(phi)] / d v_j times S.
                  scaled_derivative = 1.0 - 2.0 * (H - sj) * dlogm_dphi
                  assert scaled_derivative >= -1e-12

          print("PASS: C5 monotonicity constraint verified on 200,000 randomized vectors.")
          PY

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

