# CAL26 V1R21 | One read-only evidence review; no new age curve or price policy.
name: CAL26 V1R21 - QB Market and Owner Evidence Crosscheck 565 READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r21-qb-evidence-crosscheck
  cancel-in-progress: false
jobs:
  qb_evidence_review:
    name: Pinned 565 FV parity and 64 QB source triangulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main with no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify main and read-only market evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s index.html
          test -s scripts/artifacts/generated/market_values.json
          test -s scripts/artifacts/generated/fv_informed_estimate_cal15.json
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retrieve exact green V1R20 canonical QB diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r20-pinned"
          gh run download 39828172108 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R20-QB-FV-Drivers-565-Read-Only \
            --dir "$RUNNER_TEMP/cal26-v1r20-pinned"
          test -s "$RUNNER_TEMP/cal26-v1r20-pinned/CAL26_V1R20_Manifest.json"
      - name: Materialize and compile the isolated read-only V1R21 reviewer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r21_engine.py" <<'PY_CAL26_V1R21'
          #!/usr/bin/env python3
          """CAL26 V1R21: vote/market evidence vs owner QB review; read-only diagnostics."""
          from __future__ import annotations
          import argparse, csv, hashlib, json
          from pathlib import Path
          from collections import Counter
          SOURCE_RUN = 39828172108
          SOURCE_FILES = {
            'CAL26_V1R20_Manifest.json',
            'CAL26_V1R20_14_Owner_QB_Feedback_Scenario_Review.csv',
            'CAL26_V1R20_64_QB_Component_Attribution_and_Scenarios.csv',
            'CAL26_V1R20_All_565_Reproduced_Baseline_Zero_Write_Audit.csv',
          }
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def load_json(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def load_csv(path):
              with Path(path).open(newline='', encoding='utf-8') as f: return list(csv.DictReader(f))
          def dump_csv(path, rows, cols):
              with Path(path).open('w', newline='', encoding='utf-8') as f:
                  w=csv.DictWriter(f, fieldnames=cols, extrasaction='ignore'); w.writeheader();w.writerows(rows)
          def ensure(test, code):
              if not test: raise RuntimeError(code)
          def main(repo,source,out):
              for fname in SOURCE_FILES: ensure((source/fname).is_file(),'MISSING_PINNED_V1R20_'+fname)
              m=load_json(source/'CAL26_V1R20_Manifest.json')
              ensure(m['status']=='PASS_CAL26_V1R20_READ_ONLY_QB_DRIVER_DIAGNOSTIC','WRONG_SOURCE_STATUS')
              ensure(m['players']==565 and m['qbs']==64 and m['owner_qb_feedback']==14,'WRONG_PINNED_SCOPE')
              ensure(m['owner_anchors_protected']==15 and m['accepted_controls_protected']==18,'WRONG_PROTECTED_COUNTS')
              ensure(m['production_change_authorized'] is False and m['production_files_mutated']==0,'SOURCE_NOT_READONLY')
              for fname,digest in m['files'].items():
                  ensure(sha(source/fname)==digest, 'SOURCE_DIGEST_DRIFT_'+fname)
              ensure(sha(repo/'index.html')==m['canonical_index_sha256'],'PRODUCTION_INDEX_DRIFT_RERUN_BASELINE_FIRST')
              all565=load_csv(source/'CAL26_V1R20_All_565_Reproduced_Baseline_Zero_Write_Audit.csv')
              qb64=load_csv(source/'CAL26_V1R20_64_QB_Component_Attribution_and_Scenarios.csv')
              owner14=load_csv(source/'CAL26_V1R20_14_Owner_QB_Feedback_Scenario_Review.csv')
              ensure(len(all565)==565 and len(qb64)==64 and len(owner14)==14,'BAD_SOURCE_LENGTH')
              ensure(sum(x['protected']=='True' for x in all565)==33,'PROTECTION_NOT_PRESERVED')
              ensure(all(x['computed_fv_parity']=='True' and x['unchanged_in_repository']=='True' for x in all565),'BASELINE_PARITY_FAILED')
              ensure(len({r['player'] for r in qb64})==64 and len({r['player'] for r in owner14})==14,'DUPLICATE_PLAYER')
              market=load_json(repo/'scripts/artifacts/generated/market_values.json')
              estimate=load_json(repo/'scripts/artifacts/generated/fv_informed_estimate_cal15.json')
              ensure(market.get('scale_semantics')=='league_rank_quantile_mapped_to_trade_desk_points_v1','UNEXPECTED_MARKET_SCALE')
              ensure(estimate.get('display_only') is True and estimate.get('pricing_accuracy_validated') is False,'UNEXPECTED_ESTIMATE_SEMANTICS')
              market_players=market['players']; estimate_players=estimate['players']
              owner_by={r['player']:r for r in owner14}; enriched=[]
              for q in qb64:
                  key=q['player']; f=int(q['baseline_fv']);
                  p=market_players.get(key); e=estimate_players.get(key)
                  voters=int(e.get('distinct_voters',0)) if e else 0
                  appearances=int(e.get('ballot_appearances',0)) if e else 0
                  band=('zero' if appearances==0 else 'thin_1_3' if appearances<=3 else 'developing_4_9' if appearances<=9 else '10_plus')
                  mv=int(p['market_value']) if p and p.get('market_value') is not None else None
                  mp=int(p['fundamental_value']) if p and p.get('fundamental_value') is not None else None
                  # Market rank quantiles are descriptive, NOT independent valuation targets.
                  market_ref_current=mp==f if mp is not None else False
                  feed=owner_by.get(key,{}).get('feedback','Unrated')
                  if feed in ('Too High','Too Low') and mv is not None:
                      if mv==f: agreement='neutral'
                      elif (mv>f and feed=='Too Low') or (mv<f and feed=='Too High'):
                          agreement='supports_direction_only'
                      else: agreement='conflicts_direction_only'
                  else: agreement='not_assessed'
                  row={
                    'player':key,'age':q['age'],'role':q['role'],'feedback':feed,
                    'baseline_fv':f,'production_multiplier':q['effective_production_mult'],
                    'age_multiplier':q['age_multiplier'],'age_penalty_points':q['age_penalty_points_without_anchor'],
                    'half_youth_preview_fv':q['age_25_half_discount_relief_preview_fv'],
                    'half_youth_delta':q['half_relief_delta'],
                    'protected':q['is_owner_protected'],
                    'market_quote_exists':bool(p),'market_value':mv if mv is not None else '',
                    'market_minus_current_fv':mv-f if mv is not None else '',
                    'market_original_fundamental_fv':mp if mp is not None else '',
                    'market_fundamental_matches_current':market_ref_current,
                    'market_direction_vs_feedback':agreement,'market_rank':p.get('market_rank','') if p else '',
                    'fv_informed_ballot_appearances':appearances,'fv_informed_distinct_voters':voters,
                    'fv_informed_evidence_band':band,
                    'fv_informed_estimate':e.get('fv_informed_estimate','') if e else '',
                    'market_non_independent_provisional':True,
                    'decision':'HOLD_OWNER_REVIEW_ONLY',
                  }
                  enriched.append(row)
              fields=list(enriched[0]); out.mkdir(parents=True,exist_ok=True)
              dump_csv(out/'CAL26_V1R21_64_QB_Evidence_Review_READ_ONLY.csv',enriched,fields)
              labeled=[q for q in enriched if q['feedback']!='Unrated']
              assert len(labeled)==14
              # Preserve fixed owner feedback order instead of alphabetical filtering.
              labeled.sort(key=lambda x:[i['player'] for i in owner14].index(x['player']))
              dump_csv(out/'CAL26_V1R21_14_Owner_QB_Decision_Review_READ_ONLY.csv',labeled,fields)
              signal=Counter(x['market_direction_vs_feedback'] for x in labeled)
              bands=Counter(x['fv_informed_evidence_band'] for x in labeled)
              mismatches=[x['player'] for x in labeled if x['market_quote_exists'] and not x['market_fundamental_matches_current']]
              missing=[x['player'] for x in labeled if not x['market_quote_exists']]
              improvement=sum(int(q['half_youth_delta'])>0 and q['feedback']=='Too Low' for q in labeled)
              worsens=sum(int(q['half_youth_delta'])>0 and q['feedback']=='Too High' for q in labeled)
              changed=sum(int(q['half_youth_delta'])!=0 for q in enriched)
              ensure(improvement==4 and worsens==0 and changed==24,'SOURCE_YOUTH_SCENARIO_DRIFT')
              md=[
                '# CAL26 V1R21 — QB Evidence Triangulation (READ ONLY)', '',
                '**Decision: HOLD_FOR_OWNER_REVIEW — no market or youth change authorized.**','',
                f'- Pinned CAL26 V1R20 run: `{SOURCE_RUN}`; baseline SHA256: `{m["canonical_index_sha256"]}`.',
                '- 565 FV prices reproduced in pinned V1R20; 64 QB rows; 14 owner feedback; 33 protected values unchanged.',
                f'- Market source updated at `{market.get("generated_at_utc")}`; it is rank-quantile mapped, not independent dollar/point truth.',
                f'- FV-informed quote artifact is display-only, pricing_accuracy_validated=false; source vote evidence is sparse.',
                f'- Market quote coverage among 14 feedback QBs: **{14-len(missing)}/14**.',
                f'- Current-FV parity mismatches in market artifact: **{", ".join(mismatches) or "none"}**; interpret with caution.',
                f'- Missing market quote: **{", ".join(missing) or "none"}**.',
                f'- Vote sample bands: **{dict(bands)}**.',
                f'- Market direction vs directional feedback (unreconciled): **{dict(signal)}**.',
                f'- Arbitrary youth half-relief changes **{changed}** QBs, aligns with **{improvement}/12** rated-high/low QBs, worsens **{worsens}** (unchanged others).',
                '', '## 14 quarterback owner-feedback evidence','',
                '| Player | Owner | FV | Market quote | Ballots / voters | Market direction | Half youth FV |',
                '|---|---|---:|---:|---:|---|---:|'
              ]
              for q in labeled:
                  v=q['market_value'] if q['market_value']!='' else 'missing'
                  md.append(f"| {q['player']} | {q['feedback']} | {q['baseline_fv']} | {v} | {q['fv_informed_ballot_appearances']} / {q['fv_informed_distinct_voters']} | {q['market_direction_vs_feedback']} | {q['half_youth_preview_fv']} |")
              md += ['', '## Owner decision',
                'Review actual player ordering and external source strength before choosing a policy. ',
                'Do not infer market truth from 1-5 ballots, mix legacy MV `fundamental_value` with locked current FV, or fit a curve to only the 14 qualitative labels.',
                'No new production coefficients, owner FV anchors, market values, votes, weekly role data, or release files have been written.',
                'Recommended follow-up: obtain materially stronger independent QB market/rank evidence or expand owner review across the 64-QB ladder; preserve existing production in the meantime.','']
              (out/'CAL26_V1R21_Decision_Report.md').write_text('\n'.join(md)+'\n',encoding='utf8')
              manifest={'status':'PASS_CAL26_V1R21_READ_ONLY_TRIANGULATION','source_run':SOURCE_RUN,
                'baseline_index_sha256':m['canonical_index_sha256'],'n_players':565,'n_qb':64,
                'owner_feedback_n':14,'protected_n':33,'youth_scenario_changed_qbs':changed,
                'youth_scenario_rated_improved':improvement,'youth_scenario_rated_worsened':worsens,
                'market_quote_coverage_feedback':14-len(missing),'market_parity_mismatch_feedback':len(mismatches),
                'market_vote_band_counts':dict(bands),'market_direction_counts':dict(signal),
                'production_change_authorized':False,'repository_files_mutated':0,
                'files':{p.name:sha(p) for p in out.iterdir() if p.is_file()}}
              (out/'CAL26_V1R21_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(manifest,indent=2,sort_keys=True))
          if __name__=='__main__':
              parser=argparse.ArgumentParser();parser.add_argument('--repo',type=Path,required=True);parser.add_argument('--source',type=Path,required=True);parser.add_argument('--out',type=Path,required=True);a=parser.parse_args();main(a.repo,a.source,a.out)
          PY_CAL26_V1R21
          python3 - "$RUNNER_TEMP/cal26_v1r21_engine.py" <<'PY_CHECK'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          compile(p.read_text(),str(p),'exec')
          print('PASS V1R21 Python compile')
          PY_CHECK
      - name: Produce 64 QB evidence and 14 feedback review without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r21_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source "$RUNNER_TEMP/cal26-v1r20-pinned" \
            --out "$RUNNER_TEMP/CAL26_V1R21_Evidence"
      - name: Verify hashes and repository unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R21_Evidence'
          m=json.loads((p/'CAL26_V1R21_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R21_READ_ONLY_TRIANGULATION'
          assert (m['n_players'],m['n_qb'],m['owner_feedback_n'],m['protected_n'])==(565,64,14,33)
          assert m['production_change_authorized'] is False and m['repository_files_mutated']==0
          for filename,digest in m['files'].items():
              assert hashlib.sha256((p/filename).read_bytes()).hexdigest()==digest,filename
          with (p/'CAL26_V1R21_64_QB_Evidence_Review_READ_ONLY.csv').open() as f: qb=list(csv.DictReader(f))
          with (p/'CAL26_V1R21_14_Owner_QB_Decision_Review_READ_ONLY.csv').open() as f: owner=list(csv.DictReader(f))
          assert len(qb)==64 and len({r['player'] for r in qb})==64
          assert len(owner)==14 and len({r['player'] for r in owner})==14
          assert all(x['decision']=='HOLD_OWNER_REVIEW_ONLY' for x in qb)
          print('PASS V1R21 565 parity / 64 QBs / 14 feedback / 33 locks / read only')
          PY_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS no production files changed'
      - name: Upload the research-only owner decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R21-QB-Market-Owner-Crosscheck-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R21_Evidence
          if-no-files-found: error
          retention-days: 60
