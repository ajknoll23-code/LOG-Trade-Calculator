name: Young RB Age Curve Shape Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run self-test
        run: python3 research/age-calibration/young_rb_age_curve_shape_audit.py --selftest

      - name: Run shape audit
        run: python3 research/age-calibration/young_rb_age_curve_shape_audit.py

      - name: Show report
        run: cat research/age-calibration/young_rb_age_curve_shape_audit.md

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/age-calibration/young_rb_age_curve_shape_audit.json \
            research/age-calibration/young_rb_age_curve_shape_audit.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Audit young RB age curve shape"
          git push
