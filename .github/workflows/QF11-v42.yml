# QF11 V42: NO GOOGLE CALLS, NO PARTICIPANTS, NO SOURCE OR PRODUCTION WRITES.
name: QF11 V42 - KTC V2 Batched Retention Transport Consent Remediation Design (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v42-ktc-v2-remediation-design-only
  cancel-in-progress: false
jobs:
  design_audit:
    name: Evaluate 28d retention proposal and real-environment review gates; no Google calls
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: Checkout pinned main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install regression dependencies
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin source and immutable calculator outputs
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo STOP_NOT_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_SHA_DRIFT; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY; exit 1; }

        check() { test -f "$1" && test "$(git hash-object "$1")" = "$2" || { echo "STOP_SOURCE_PIN_DRIFT:$1";
        exit 1; }; }

        check .github/workflows/QF11-v41r1.yml 66cdc2bd9f901854626720054337198c40418710

        check research/ktc-v2-isolated/collector.gs ced5f95d3e34023d37b95cf7029c94ccdcdca483

        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d

        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7

        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a

        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860

        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167

        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        echo QF11_V42_FROZEN_SOURCE_PINS_PASS'
    - name: Rerun baseline KTC and frozen regressions
      run: 'set -euo pipefail

        node --check < research/ktc-v2-isolated/collector.gs

        node --check < research/ktc-v2-isolated/frame-host.gs

        node research/ktc-v2-isolated/collector.test.js

        node research/ktc-v2-isolated/client-bridge.test.js

        node research/ktc-v2-isolated/frame-host.test.js

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V42_EXISTING_TESTS_AND_FROZEN_PRODUCTION_PASS'
    - name: Build and test isolated 28-day candidate with synthetic mocks
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v42\ncat > /tmp/qf11-v42/audit.js <<'QF11V42AUDIT'\n\
        \"use strict\";\n// QF11 V42 local-only synthetic verification. Never contacts Google or\
        \ a participant.\nconst fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict'),crypto=require('node:crypto');\n\
        const base='research/ktc-v2-isolated/';\nconst src=fs.readFileSync(base+'collector.gs','utf8');\n\
        const host=fs.readFileSync(base+'frame-host.gs','utf8');\nconst html=fs.readFileSync(base+'pilot-frame.html','utf8');\n\
        const anchor='var start=new Date(now);var expires=new Date(now+30*24*3600*1000);';\nassert.equal(src.split(anchor).length-1,1,'STOP_SOURCE_EXPIRY_ANCHOR_DRIFT');\n\
        const candidate=src.replace(anchor,'var start=new Date(now);var expires=new Date(now+28*24*3600*1000);');\n\
        const dir='/tmp/qf11-v42';fs.mkdirSync(dir,{recursive:true});\nfs.writeFileSync(dir+'/COLLECTOR-CANDIDATE-28D-NOT-APPROVED.gs.txt',candidate);\n\
        const day=86400000, NOW=Date.parse('2026-10-13T12:00:00Z');\nconst HEAD=['received_utc','delete_due_utc','schema','slot','display_order','token_hmac','keep','trade','cut','q1','q2','q3','review_status'];\n\
        const KEYS=['QF11_V2_ENABLED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'];\n\
        const token='QF11_V42_SYNTHETIC_TEST_TOKEN_000000000000000',secret='QF11_V42_SYNTHETIC_SECRET_12345678901234567890';\n\
        const digest=crypto.createHmac('sha256',secret).update(token).digest('base64url');\nlet passed=0;const\
        \ cases=[];\nfunction check(label,fn){fn();passed++;cases.push(label);console.log('PASS '+label);}\n\
        function fixture(code=candidate,authorized=false){\n const state={now:NOW,rows:[HEAD.slice()],events:[],lockBusy:false,lockHeld:false,failDelete:false};\n\
        \ const cfg={QF11_V1_SHEET_ID:'FAKE_V1',QF11_V2_SHEET_ID:'FAKE_V2',QF11_V2_SEPARATE_SHEET_VERIFIED:'YES',QF11_V2_HALTED:'false',QF11_V2_CLOSED:'false',QF11_V2_HMAC_SECRET:secret,QF11_V2_INVITES_JSON:JSON.stringify({[digest]:{slot:1,display_order:0}}),QF11_V2_PLAYER_KEYS_JSON:JSON.stringify(['test_a','test_b','test_c']),QF11_V2_PLAYER_LABELS_JSON:JSON.stringify(['Test\
        \ A','Test B','Test C'])};\n KEYS.forEach(k=>cfg[k]=authorized?'true':'false');\n const props={getProperty:k=>Object.prototype.hasOwnProperty.call(cfg,k)?cfg[k]:null,setProperty:(k,v)=>{cfg[k]=String(v);state.events.push('set:'+k+':'+v);}};\n\
        \ const sh={getLastRow:()=>state.rows.length,getRange:(r,c,n)=>({getValues:()=>state.rows.slice(r-1,r-1+n).map(row=>row.slice(c-1,c-1+HEAD.length))}),getDataRange:()=>({getValues:()=>state.rows.map(row=>row.slice())}),appendRow:row=>{state.events.push('append');state.rows.push(row.slice());},deleteRow:i=>{state.events.push('delete:'+i);if(state.failDelete)throw\
        \ Error('SYNTHETIC_DELETE_FAILURE');state.rows.splice(i-1,1);}};\n class Clock extends Date{static\
        \ now(){return state.now;}}\n const env={PropertiesService:{getScriptProperties:()=>props},SpreadsheetApp:{openById:id=>{assert.equal(id,'FAKE_V2');return\
        \ {getSheetByName:name=>name==='Responses'?sh:null};}},LockService:{getScriptLock:()=>({tryLock:()=>{if(state.lockBusy)return\
        \ false;state.lockHeld=true;return true;},releaseLock:()=>{state.lockHeld=false;}})},Utilities:{computeHmacSha256Signature:(t,s)=>Array.from(crypto.createHmac('sha256',s).update(t).digest()),base64EncodeWebSafe:x=>Buffer.from(x).toString('base64url')},ContentService:{MimeType:{JSON:'application/json'},createTextOutput:s=>({getContent:()=>s,setMimeType(){return\
        \ this}})},HtmlService:{createHtmlOutput:s=>({getContent:()=>s})},Logger:{log:()=>{}},Date:Clock,JSON,Object,Array,String,Number,Set,Error,Math};\n\
        \ vm.createContext(env);vm.runInContext(code+'\\n'+host,env,{timeout:3000});\n const payload=()=>({schema:'QF11_KTC_V2_PILOT_RESPONSE_V1',participant_token:token,display_order:0,consent:true,adult:true,sf_idp_experience:true,keep:'test_a',trade:'test_b',cut:'test_c',mc:[1,1,0]});\n\
        \ const post=()=>JSON.parse(env.doPost({postData:{contents:JSON.stringify(payload())}}).getContent()).status;\n\
        \ return {state,cfg,env,post,payload};\n}\ncheck('V39 source has precisely one expiry anchor',()=>assert.equal(src.split(anchor).length-1,1));\n\
        check('unmodified source parses',()=>new vm.Script(src+'\\n'+host));\ncheck('proposed 28-day\
        \ source parses',()=>new vm.Script(candidate+'\\n'+host));\ncheck('proposal only changes\
        \ the expiry literal',()=>assert.equal(candidate.replace('now+28*24*3600*1000','now+30*24*3600*1000'),src));\n\
        check('default proposed source blocks direct POST',()=>{const f=fixture();assert.equal(f.post(),'DISABLED');assert.equal(f.state.rows.length,1);});\n\
        check('default proposed source blocks iframe GET',()=>{const f=fixture();assert.match(f.env.doGet({}).getContent(),/not\
        \ accepting pilot responses/);});\ncheck('default proposed source blocks RPC',()=>{const\
        \ f=fixture();assert.equal(f.env.qf11v33Submit(f.payload()).status,'DISABLED');});\ncheck('each\
        \ missing authorization still blocks direct POST',()=>{for(const k of KEYS){const f=fixture(candidate,true);f.cfg[k]='false';assert.equal(f.post(),'DISABLED',k);assert.equal(f.state.rows.length,1);}});\n\
        check('proposed authorized synthetic receipt expires after exactly 28 days',()=>{const f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');assert.equal(f.state.rows.length,2);const\
        \ r=f.state.rows[1];assert.equal(Date.parse(r[1])-Date.parse(r[0]),28*day);assert(!JSON.stringify(r).includes(token));});\n\
        check('original 30-day source is later than candidate by two days',()=>{const f=fixture(src,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');assert.equal(Date.parse(f.state.rows[1][1])-Date.parse(f.state.rows[1][0]),30*day);});\n\
        check('synthetic 28-day row deletes when eligible',()=>{const f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now=NOW+28*day;assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert.equal(f.state.rows.length,1);assert.equal(f.cfg.QF11_V2_HALTED,'true');});\n\
        check('proposed expiry precondition preserves unexpired row',()=>{const f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now=NOW+27*day;assert.equal(f.env.purgeExpiredQF11V2Rows(),0);assert.equal(f.state.rows.length,2);});\n\
        check('scheduler delay <= 48h conditionally deletes by day 30',()=>{for(const lag of [0,60e3,day,day*1.99,2*day]){const\
        \ f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now=NOW+28*day+lag;assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert(f.state.now<=NOW+30*day);}});\n\
        check('missed trigger beyond 48h defeats hard 30-day ceiling',()=>{const f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now=NOW+30*day+60e3;assert.equal(f.state.rows.length,2);assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert(f.state.now>NOW+30*day);});\n\
        check('failed candidate purge propagates and halts intake',()=>{const f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.failDelete=true;f.state.now=NOW+28*day;assert.throws(()=>f.env.purgeExpiredQF11V2Rows(),/SYNTHETIC_DELETE_FAILURE/);assert.equal(f.cfg.QF11_V2_HALTED,'true');assert.equal(f.state.lockHeld,false);});\n\
        check('expired candidate row blocks newly attempted intake before purge',()=>{const f=fixture(candidate,true);assert.equal(f.post(),'PENDING_HUMAN_Q4_REVIEW');f.state.now=NOW+28*day+1;assert.equal(f.post(),'HALTED');assert.equal(f.cfg.QF11_V2_HALTED,'true');});\n\
        check('invalid candidate deadline deletes and halts intake',()=>{const f=fixture();f.state.rows.push(['','invalid-date']);assert.equal(f.env.purgeExpiredQF11V2Rows(),1);assert.equal(f.cfg.QF11_V2_HALTED,'true');});\n\
        check('collector source does not install triggers or call live endpoints',()=>{for(const\
        \ v of ['ScriptApp.newTrigger(', 'script.google.com/macros/s/'])assert(!candidate.includes(v));});\n\
        check('current iframe referrer is client-side, ALLOWALL is set',()=>{assert(host.includes('HtmlService.XFrameOptionsMode.ALLOWALL'));assert(html.includes('document.referrer'));assert(html.includes('window.self!==window.top'));});\n\
        check('existing server does not accept parent-origin parameter',()=>{assert(!host.includes('requestOrigin'));assert(!host.includes('verifiedParentOrigin'));});\n\
        check('Google RPC is not validated by offline vm mocks',()=>{assert(html.includes('google.script.run.withSuccessHandler'));assert(!html.includes('XMLHttpRequest'));});\n\
        check('consent references external moderator document and requires human review',()=>{assert(html.includes('approved\
        \ separate pilot consent information provided by the moderator'));assert(html.includes('id=\"\
        consent\"'));});\ncheck('Q4 is not sent to the collector',()=>{assert(!candidate.includes(\"\
        'q4'\"));assert(html.includes('never sent through this form'));});\nfs.writeFileSync(dir+'/synthetic-tests.json',JSON.stringify({schema:'QF11_V42_SOURCE_PROPOSAL_SYNTHETIC_V1',passed,cases,real_google_calls:0,real_participants:0,live_votes:0,production_changes:0,proposal_only:true},null,2)+'\\\
        n');\nconsole.log('QF11_V42_'+passed+'_SYNTHETIC_TESTS_GREEN__NO_ACTIVATION');\nQF11V42AUDIT\n\
        node --check /tmp/qf11-v42/audit.js\nnode /tmp/qf11-v42/audit.js\nnode --check < /tmp/qf11-v42/COLLECTOR-CANDIDATE-28D-NOT-APPROVED.gs.txt\n"
    - name: Compile truthful transport, retention, and consent design review
      run: "set -euo pipefail\ncat > /tmp/qf11-v42/report.py <<'QF11V42REPORT'\nfrom pathlib import\
        \ Path\nimport hashlib,json\nout=Path('/tmp/qf11-v42')\ntest=json.loads((out/'synthetic-tests.json').read_text())\n\
        source=(out/'COLLECTOR-CANDIDATE-28D-NOT-APPROVED.gs.txt').read_bytes()\nassert test['passed']>=23\n\
        issues=[\n {'id':'RETENTION_30_DAY_CEILING','status':'BLOCKED_LIVE','finding':'Current Code.gs\
        \ sets due=receipt+30 days. An installed daily trigger cannot guarantee actual deletion at\
        \ or before the exact 30-day instant.','proposed':'28-day expiry in a SOURCE-ONLY candidate\
        \ gives a conditional 48h margin. A delayed or failed trigger, logs, exports, and invitation/Q4\
        \ materials still require independent disposal and monitoring. Do not certify a hard cap.'},\n\
        \ {'id':'SCHEDULED_TRIGGER_EXECUTION','status':'PENDING_OWNER_EVIDENCE','finding':'Owner\
        \ verified exactly one scheduled trigger and manually executed an empty-sheet purge without\
        \ errors.','proposed':'Inspect Apps Script Executions after the first scheduled window; record\
        \ status/time without participant data. Never plant synthetic participant rows in the live\
        \ Responses sheet.'},\n {'id':'IFRAME_CLICKJACKING_ORIGIN','status':'BLOCKED_LIVE','finding':'Actual\
        \ host uses ALLOWALL framing and client document.referrer check only; a browser referrer\
        \ is not server authorization.','proposed':'Security-review standalone owner-only app or\
        \ stronger server authentication before approving embedding. Test official and hostile parent\
        \ frames in a controlled real browser; keep intake disabled.'},\n {'id':'RPC_DELIVERY','status':'PENDING_REAL_EVIDENCE','finding':'Offline\
        \ tests mock google.script.run; the existing disabled interface does not exercise a real\
        \ iframe RPC round-trip.','proposed':'Design nonparticipant owner-only disabled RPC probe\
        \ with constant response and no token, then separately approve and test in existing project;\
        \ avoid participant vote submissions.'},\n {'id':'CONSENT_Q4_AND_DATA_COPIES','status':'HUMAN_REVIEW_REQUIRED','finding':'External\
        \ consent document, adult/expertise screening, Q4 moderation, review SOP, log/export/invite\
        \ cleanup lack independent sign-off.','proposed':'Approve external consent and Q1-Q4 comprehension\
        \ text and define a complete deletion inventory; ensure incident contact and retention schedule.'},\n\
        \ {'id':'OWNER_LAUNCH_AUTHORIZATION','status':'NOT_AUTHORIZED','finding':'Owner has not authorized\
        \ a real participant pilot, and research Green never authorizes calibration.','proposed':'Keep\
        \ all nine flags false, collect no votes, make no production changes.'}\n]\nmanifest={\n\
        \ 'schema':'QF11_V42_REMEDIATION_DESIGN_REVIEW_V1',\n 'decision':'SOURCE_PROPOSAL_GREEN_REVIEW_REQUIRED_LIVE_DISABLED',\n\
        \ 'candidate_collector_sha256':hashlib.sha256(source).hexdigest(),\n 'candidate_retention_days':28,\n\
        \ 'current_retention_days':30,\n 'proposed_conditional_max_delay_hours':48,\n 'strict_30_day_guarantee_proven':False,\n\
        \ 'scheduled_trigger_execution_verified':False,\n 'real_htmlservice_rpc_verified':False,\n\
        \ 'real_parent_origin_authenticated':False,\n 'independent_consent_q4_approved':False,\n\
        \ 'owner_live_approval':False,\n 'tests_passed':test['passed'],\n 'google_calls':0,'real_votes':0,'real_spreadsheet_writes':0,'google_apps_script_edits':0,'repo_writes':0,'production_changes':0,\n\
        \ 'next_stage':'INDEPENDENT_DESIGN_REVIEW_BEFORE_GOOGLE_CODE_REPLACEMENT',\n 'issues':issues,\n\
        }\n(out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\\n')\nmd=['# QF11 V42\
        \ — Batched retention, transport, and consent design review','',\n '**Status:** SOURCE-ONLY\
        \ DESIGN GREEN; **LIVE PILOT STILL BLOCKED**.','',\n f\"Synthetic cases passed: **{test['passed']}**,\
        \ zero actual Google calls or participant votes.\",'',\n '## Remediation alternatives and\
        \ recommendation','',\n '| Retention option | Benefit | Limitation | Rank |','|---|---|---|---|',\n\
        \ '| 28-day internal expiration + daily deletion trigger + independent operator monitoring\
        \ | Adds conditional schedule slack, minor isolated code delta | Not a strict 30-day guarantee\
        \ if the trigger fails or additional copies exist | 1 — provisional |',\n '| 27-day expiration\
        \ + more frequent documented cleanup / external watchdog | More time buffer | More maintenance\
        \ and scheduling complexity, still no hard guarantee | 2 |',\n '| Keep expiration at exactly\
        \ 30 days with daily trigger | No change | Can exceed deadline even when trigger works normally\
        \ | 3 — reject |','',\n 'The 28-day candidate is *not* approved. It changes **only** the\
        \ retention-period literal in the isolated collector; all seven authorization gates stay\
        \ unchanged. Propose independent security/privacy review **before** replacing actual Code.gs.','',\n\
        \ 'A hard guarantee requires additional architecture and operational controls; normal best-effort\
        \ trigger scheduling alone cannot establish it. Validate all participant-data copies, not\
        \ just Responses.','',\n '## Findings and next actions','']\nfor i in issues:md += [f\"###\
        \ {i['id']} — {i['status']}\", i['finding'],'',f\"Recommended next action: {i['proposed']}\"\
        ,'']\nmd+=['## Existing-project owner validation plan (not executed)','',\n '1. Leave the\
        \ current Apps Script project and its nine flags disabled. Do not replace Code.gs with the\
        \ V42 candidate yet.',\n '2. After the scheduled trigger window, inspect Executions for an\
        \ automatic purge. A successful run against an empty sheet is not proof of deleting expired\
        \ rows.',\n '3. Review Google project permissions, V2 sheet isolation, external logging/data\
        \ copies and moderator access without sharing sensitive IDs or tokens.',\n '4. Independently\
        \ review consent text, Q1-Q4 comprehension and Q4 moderation protocol.',\n '5. After approved\
        \ design changes, prepare one full combined Code.gs file and test disabled-only in the **same**\
        \ Google project; do not create another project.',\n '6. Perform authorized owner-only browser\
        \ transport diagnostics before considering real recruitment. Client referrer alone is not\
        \ authorization.',\n '', '**No source-to-production promotion or live collection is authorized.**','']\n\
        (out/'OWNER-DESIGN-REVIEW.md').write_text('\\n'.join(md)+'\\n')\nprint('QF11_V42_REMEDIATION_DESIGN_READY',test['passed'],'tests')\n\
        QF11V42REPORT\npython3 -m py_compile /tmp/qf11-v42/report.py\npython3 /tmp/qf11-v42/report.py\n\
        [[ -z \"$(git status --porcelain)\" ]] || { echo STOP_REPO_CHANGED; exit 1; }\necho QF11_V42_SOURCE_DESIGN_GREEN__LIVE_BLOCKED\n"
    - name: Upload review-only candidate and reports
      uses: actions/upload-artifact@v4
      with:
        name: QF11-V42-REMEDIATION-DESIGN-REVIEW-ONLY
        path: '/tmp/qf11-v42/COLLECTOR-CANDIDATE-28D-NOT-APPROVED.gs.txt

          /tmp/qf11-v42/synthetic-tests.json

          /tmp/qf11-v42/manifest.json

          /tmp/qf11-v42/OWNER-DESIGN-REVIEW.md'
        retention-days: 14
        if-no-files-found: error
