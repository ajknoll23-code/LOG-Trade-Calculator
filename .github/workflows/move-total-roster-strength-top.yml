name: Move Total Roster Strength Up

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-section:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked live Trade Desk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_INDEX_BLOB="f47cb8f16ac38cfa888282c4b2d97cbb003fcadf"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"
          echo "Expected index.html blob: $EXPECTED_INDEX_BLOB"
          echo "Actual index.html blob:   $ACTUAL_INDEX_BLOB"
          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-pre-roster-strength-top-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Move roster strength under team selector
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "ROSTER_STRENGTH_TOP_SECTION_V1"

          if marker in text:
              raise SystemExit(
                  f"{marker} already present; refusing to double-apply."
              )

          required = [
              'id="teamPickerWrap"',
              'id="rosterStrengthWrap"',
              "COMPACT_ROSTER_STRENGTH_UI_V1",
              "ui2-roster-strength-shell",
              "Your Roster Needs",
              "Position Leaders",
          ]

          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Expected Trade Desk section hooks missing: "
                  + ", ".join(missing)
              )

          original_scripts = re.findall(
              r"<script(?:\s[^>]*)?>.*?</script>",
              text,
              flags=re.S | re.I,
          )

          css = r'''
          <style id="roster-strength-top-section-styles">
          /* ROSTER_STRENGTH_TOP_SECTION_V1
             Presentation / placement only. Roster-strength totals, rankings
             and expandable team detail calculations are unchanged. */

          .roster-strength-top-section{
            margin:0 0 18px;
          }

          .roster-strength-top-section > .section-label{
            margin:0 0 9px!important;
          }

          .roster-strength-top-section .ui2-roster-strength-shell{
            margin-top:0!important;
          }

          .roster-strength-top-section .ui2-roster-strength-shell > summary{
            min-height:54px;
          }

          @media(max-width:720px){
            .roster-strength-top-section{
              margin:0 0 14px;
            }

            .roster-strength-top-section > .section-label{
              margin-bottom:7px!important;
            }
          }
          </style>
          '''

          js = r'''
          <script id="roster-strength-top-section-runtime">
          /* ROSTER_STRENGTH_TOP_SECTION_V1 — placement only. */
          (function () {
            'use strict';

            function install() {
              if (
                document.documentElement.dataset.rosterStrengthTopSection === '1'
              ) return true;

              const wrap = document.querySelector('.wrap');
              const pageHeader = wrap && wrap.querySelector('header');
              const shell = wrap && wrap.querySelector(
                '.ui2-roster-strength-shell'
              );

              if (!wrap || !pageHeader || !shell) return false;

              let section = document.getElementById(
                'rosterStrengthTopSection'
              );

              if (!section) {
                section = document.createElement('section');
                section.id = 'rosterStrengthTopSection';
                section.className = 'roster-strength-top-section';

                const label = document.createElement('div');
                label.className = 'section-label';
                label.textContent = 'Total Roster Strength';

                section.appendChild(label);
                pageHeader.insertAdjacentElement('afterend', section);
              }

              section.appendChild(shell);

              const title = shell.querySelector(
                '.ui2-roster-strength-title'
              );
              const sub = shell.querySelector(
                '.ui2-roster-strength-sub'
              );

              if (title) title.textContent = 'League Rankings';

              if (sub) {
                sub.textContent =
                  'Compare every team · tap to view roster strength';
              }

              document.documentElement.dataset.rosterStrengthTopSection = '1';
              return true;
            }

            function init() {
              if (install()) return;

              let attempts = 0;

              function retry() {
                attempts += 1;

                if (install() || attempts >= 20) return;

                requestAnimationFrame(retry);
              }

              requestAnimationFrame(retry);
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded',
                init,
                { once:true }
              );
            } else {
              init();
            }
          })();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text or "</body>" not in text:
              raise RuntimeError("index.html missing closing head/body tags")

          text = text.replace("</head>", css + "\n</head>", 1)
          text = text.replace("</body>", js + "\n</body>", 1)

          missing_scripts = [
              i for i, block in enumerate(original_scripts)
              if block not in text
          ]

          if missing_scripts:
              raise RuntimeError(
                  "Existing production script blocks changed: "
                  + str(missing_scripts)
              )

          if text.count(marker) != 2:
              raise RuntimeError(
                  f"Unexpected {marker} count: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")

          print(
              f"PASS preserved {len(original_scripts)} existing production "
              "script blocks byte-for-byte"
          )
          print("PASS Total Roster Strength promoted below team selector")
          PY

      - name: Validate section-move JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          js = re.search(
              r'<script id="roster-strength-top-section-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )

          css = re.search(
              r'<style id="roster-strength-top-section-styles">(.*?)</style>',
              html,
              flags=re.S,
          )

          if not js or not css:
              raise SystemExit("Roster-strength top-section blocks missing")

          required_js = [
              "rosterStrengthTopSection",
              "ui2-roster-strength-shell",
              "pageHeader.insertAdjacentElement('afterend', section)",
              "League Rankings",
              "Compare every team",
          ]

          missing = [
              token for token in required_js
              if token not in js.group(1)
          ]

          if missing:
              raise SystemExit(
                  f"Roster-strength placement JS missing: {missing}"
              )

          for label, block in [
              ("CSS", css.group(1)),
              ("JS", js.group(1)),
          ]:
              bad = [
                  i for i, line in enumerate(block.splitlines(), 1)
                  if line != line.rstrip()
              ]

              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at lines {bad[:10]}"
                  )

              print(f"PASS {label} whitespace")

          out = Path("/tmp/roster-strength-top-section.js")
          out.write_text(js.group(1), encoding="utf-8")
          print(out)
          PY

          node --check /tmp/roster-strength-top-section.js

      - name: Validate existing runtime self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Commit section move only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "index.html"

          if git diff --cached --quiet; then
            echo "No section-placement changes to commit."
            exit 0
          fi

          git commit -m "Move Total Roster Strength under team selector"
          git push origin HEAD:main
