name: CAL23 V1R1 - Week6 Replacement and Rookie Prior FV Shadow READ ONLY

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cal23-v1r1-dual-frozen-study-shadow
  cancel-in-progress: false

jobs:
  week6-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact green CAL20 V1R3 eight-file candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cal23-cal20"
          gh run download 39463394968 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'cal20-v1r3-core173-exact-OWNER-REVIEW-PREVIEW' \
            --dir "${RUNNER_TEMP}/cal23-cal20"
          test -s "${RUNNER_TEMP}/cal23-cal20/review_contract.json"
          test -s "${RUNNER_TEMP}/cal23-cal20/candidate/index.html"

      - name: Materialize complete research-only CAL23 analyzer
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/cal23_shadow.py" <<'PY_CAL23_ANALYZER'
          #!/usr/bin/env python3
          """CAL23 V1R1 owner-directed, research-only frozen-study -> FV candidate comparison.

          Data lineage: pinned green CAL20 preview, immutable No-History Rookie V2 and
          Replacement Level V2 preseason frozen candidates, and Week 6 evaluations.
          Explicitly NEVER edits the repo, frozen study, or production price tables.
          """
          from __future__ import annotations
          import argparse
          import copy
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          import sys
          from collections import Counter
          from pathlib import Path

          TARGETS = {
              'fernando mendoza': ('too_low', 'rookie_qb'),
              'sonny styles': ('too_low', 'rookie_lb'),
              'kc concepcion': ('too_low', 'rookie_wr'),
              'bijan robinson': ('slightly_low', 'veteran_rb'),
              'malik davis': ('about_right', 'veteran_rb_control'),
              'kenyon sadiq': ('too_low', 'rookie_te'),
              'ashton jeanty': ('slightly_high', 'veteran_rb'),
              'ty simpson': ('too_low', 'rookie_qb'),
              'malik willis': ('about_right', 'veteran_qb_control'),
              'dj giddens': ('about_right', 'veteran_rb_control'),
          }
          ROOKIE_WEIGHTS = ('0.00', '0.15', '0.30', '0.45')
          REPLACEMENT_VARIANTS = ('legacy_control','prior_limited_evidence','stable_positions_only','full_phase2_leaders')


          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def write_csv(path, rows, headers=None):
              if not rows and not headers: raise AssertionError(f'No rows for {path}')
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=headers or list(dict.fromkeys(k for r in rows for k in r)), extrasaction='ignore')
                  w.writeheader(); w.writerows(rows)

          def load_snapshot_module(path):
              spec = importlib.util.spec_from_file_location('cal23_pinned_cal20_snapshot', str(path))
              mod = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = mod
              spec.loader.exec_module(mod)
              return mod

          def candidate_value(sv,cfg,key,raw):
              """Actual frozen CAL20 FV formula, one player, no proxy conversion."""
              info = cfg['player_db'][key]
              role = info['role']; pos = info['pos']; age = info['age']
              data = cfg['prod_mult'].copy(); data[key] = raw
              effective,raw_under = sv.production_multiplier(key,role,data,cfg['no_real_history'],cfg['role_mult'])
              age_effective = sv.effective_age_multiplier(pos,age,role,key,effective,raw_under,cfg)
              pw = cfg['position_weight'][pos]
              return int(math.floor(100*pw*age_effective*effective*55+.5)),effective

          def frozen_check(frozen,evaluation,required_variants,study):
              assert frozen['research_only'] is True and frozen['deployment_authorized'] is False,study
              assert evaluation['research_only'] is True and evaluation['deployment_authorized'] is False,study
              assert frozen['frozen_prediction_sha256'] == evaluation.get('frozen_prediction_sha256', evaluation.get('frozen_candidate_sha256')), (study,'frozen candidate identity drift')
              weeks = sorted(map(int,evaluation['completed_outcome_weeks']))
              assert weeks[:6]==[1,2,3,4,5,6] and 6 in weeks,(study,weeks)
              assert set(required_variants) <= set(frozen['variants']),(study,required_variants)
              return weeks

          def parse_cal20(root):
              c = load(root/'review_contract.json')
              assert c['release_id']=='cal20-offense-core173-2026-10-20-v1'
              assert c['changed_players']==173 and c['owner_approval_required'] is True
              assert c['as_of_fv_price_date']=='2026-10-20'
              assert len(c['files_sha256'])==8
              for path,h in c['files_sha256'].items():
                  assert sha(root/'candidate'/path)==h,('cal20 tamper',path)
              release = load(root/'candidate/model/releases/cal20-offense-core173-2026-10-20-v1/release.json')
              assert release['production_apply_authorized'] is False
              sv = load_snapshot_module(root/'candidate/scripts/validation/snapshot_values.py')
              cfg = sv.load_from_html(root/'candidate/index.html')
              current = sv.compute_all_values(cfg)
              q = load(root/'candidate/scripts/artifacts/generated/fv_informed_estimate_cal18.json')
              mv = load(root/'candidate/scripts/artifacts/generated/market_values.json')
              assert len(current)==len(q['players'])==565 and len(mv['players'])==504
              assert all(q['players'][k]['fundamental_value']==v['value'] for k,v in current.items())
              return sv,cfg,current,q,mv,c,release

          def run(repo,cal20,out):
              out.mkdir(parents=True,exist_ok=True)
              sv,cfg,baseline,q,mv,contract,release = parse_cal20(cal20)
              nr_path=repo/'research/no-history-v2'
              r_path=repo/'research/replacement-level-v2'
              nrf=load(nr_path/'no_history_v2_phase3_frozen_candidates.json')
              nre=load(nr_path/'no_history_v2_phase3_evaluation.json')
              rf=load(r_path/'replacement_level_v2_phase5_frozen_candidates.json')
              re=load(r_path/'replacement_level_v2_phase5_evaluation.json')
              nw=frozen_check(nrf,nre,['prospect_prior_weight_'+w for w in ROOKIE_WEIGHTS],'rookie')
              rw=frozen_check(rf,re,REPLACEMENT_VARIANTS,'replacement')
              assert nrf['cohort_size']==95 and rf['cohort_size']==518,(nrf['cohort_size'],rf['cohort_size'])
              assert set(TARGETS)<=set(baseline)
              assert len(nrf['players'])==95 and len(rf['players'])==518
              assert set(nrf['players'])==set(nrf['variants']['prospect_prior_weight_0.00']['predictions'])
              assert set(rf['players'])==set(rf['variants']['legacy_control']['predictions'])
              # Never refit any frozen input on new outcome labels. We read evaluations only
              # for model comparison, and PRESEASON predictions for per-player counterfactuals.
              rows=[]; rookie=[]; anchored=[]
              for name in sorted(baseline):
                  info=cfg['player_db'][name]; pos=info['pos']; age=info['age']; role=info['role']
                  fv=int(baseline[name]['value']); curr_raw=cfg['prod_mult'].get(name)
                  member = name in nrf['players']; repl = name in rf['players']
                  rr=rf['players'].get(name) or {}
                  row={
                      'player':name,'position':pos,'age':age,'role':role,
                      'cal20_green_fv_not_deployed':fv,
                      'cal20_green_fv_plus_votes_not_deployed':int(q['players'][name]['fv_informed_estimate']),
                      'market_value_is_not_used_for_price_calibration':(mv['players'].get(name) or {}).get('market_value',''),
                      'owner_fv_assessment':TARGETS.get(name,('not_reviewed',''))[0],
                      'in_frozen_no_history_rookie95':str(member).upper(),
                      'in_frozen_replacement518':str(repl).upper(),
                      'replacement_primary_real_history_eligible':str(rr.get('primary_real_history_eligible',False)).upper() if repl else '',
                      'current_cal20_no_real_history':str(name in cfg['no_real_history']).upper(),
                      'current_cal20_raw_prod_mult':curr_raw if curr_raw is not None else '',
                  }
                  if repl:
                      for variant in REPLACEMENT_VARIANTS:
                          rpred=rf['variants'][variant]['predictions'][name]
                          row['repl_'+variant+'_preseason_ratio']=round(rpred['predicted_production_ratio'],6)
                  if member:
                      pred={w:nrf['variants']['prospect_prior_weight_'+w]['predictions'][name] for w in ROOKIE_WEIGHTS}
                      # Owner's feedback must not be used to fit or cherry-pick variant.
                      for w in ROOKIE_WEIGHTS:
                          row['rookie_preseason_'+w+'_fv']=int(pred[w]['value'])
                          row['rookie_preseason_'+w+'_raw']=round(float(pred[w]['raw_prod_mult']),6)
                      for w in ROOKIE_WEIGHTS[1:]:
                          frozen_delta_raw=float(pred[w]['raw_prod_mult'])-float(pred['0.00']['raw_prod_mult'])
                          frozen_delta_fv=int(pred[w]['value'])-int(pred['0.00']['value'])
                          # This *new*, explicitly exploratory counterfactual transfers a
                          # previously-frozen additive prior delta to the later CAL20 raw
                          # input; it does NOT transplant 2026-09 absolute prices.
                          permitted=(bool(pred[w]['prior_applied']) and
                                     name in cfg['no_real_history'] and curr_raw is not None and
                                     float(pred[w]['raw_prod_mult']) >= float(pred['0.00']['raw_prod_mult']) and
                                     0.15-1e-9 <= curr_raw <= 1.55+1e-9)
                          if permitted:
                              scenario_raw=max(0.15,min(1.55,float(curr_raw)+frozen_delta_raw))
                              scenario_fv,eff=candidate_value(sv,cfg,name,scenario_raw)
                              action='INVESTIGATE_FV_UPLIFT' if scenario_fv>fv else 'NO_FV_GAIN'
                              if scenario_fv<fv: action='HOLD_MONOTONICITY_CLIFF'
                              if pos=='K': action='HOLD_K_NOT_RESEARCHED'
                          else:
                              scenario_raw=None; scenario_fv=None;eff=None;action='HOLD_NO_COMPATIBLE_CURRENT_RAW_SOURCE'
                          row['rookie_'+w+'_scenario_action']=action
                          row['rookie_'+w+'_scenario_fv']=scenario_fv if scenario_fv is not None else ''
                          row['rookie_'+w+'_scenario_fv_delta']=scenario_fv-fv if scenario_fv is not None else ''
                          rookie.append({
                              'player':name,'pos':pos,'age':age,'role':role,'owner_fv_assessment':row['owner_fv_assessment'],
                              'weight':w,'frozen_preseason_base_fv':pred['0.00']['value'],
                              'frozen_preseason_variant_fv':pred[w]['value'],
                              'frozen_preseason_fv_delta':frozen_delta_fv,
                              'frozen_raw_delta':round(frozen_delta_raw,8),
                              'current_cal20_raw':curr_raw if curr_raw is not None else '',
                              'shadow_raw_input':round(scenario_raw,8) if scenario_raw is not None else '',
                              'cal20_baseline_fv':fv,
                              'exact_cal20_formula_shadow_fv':scenario_fv if scenario_fv is not None else '',
                              'shadow_fv_delta':scenario_fv-fv if scenario_fv is not None else '',
                              'decision':action,
                              'warning':'NOT_APPROVED_PRICE; additive frozen-prior sensitivity; may overlap October 2026 projections; no FV+Votes recalibration',
                          })
                  rows.append(row)
              audit_names={r['player'] for r in rows}
              assert len(audit_names)==565
              for name in TARGETS:
                  anchored.append(next(r for r in rows if r['player']==name))
              bypos=[]
              for p in ['QB','RB','WR','TE','DL','LB','DB']:
                  for v in REPLACEMENT_VARIANTS[1:]:
                      primary=re['primary_deltas_vs_control'][v]['by_position'][p]
                      secondary=re['secondary_deltas_vs_control'][v]['by_position'][p]
                      bypos.append({'position':p,'variant':v,'primary_relative_production_mae_delta_vs_control':round(primary['mae_delta'],6),
                              'secondary_relative_total_points_mae_delta_vs_control':round(secondary['mae_delta'],6),
                              'primary_improves':str(primary['mae_delta']<0).upper(),
                              'secondary_improves':str(secondary['mae_delta']<0).upper(),
                              'first_target':'real_history_only; no pre-season rookie player valuation authorization'})
              stats=[]
              for w in ROOKIE_WEIGHTS:
                  m=nre['metrics']['prospect_prior_weight_'+w]
                  total=m['fundamental_value_vs_total_points']
                  active=m['fundamental_value_vs_active_ppg']
                  stats.append({'study':'No-History Rookie V2', 'weight':w,'primary_future_total_points_mae':total['minmax_normalized_mae'],
                       'primary_future_total_points_spearman':total['spearman'],
                       'secondary_active_ppg_mae':active['minmax_normalized_mae'],
                       'secondary_active_ppg_spearman':active['spearman'],
                       'primary_n':total['n'],'secondary_n':active['n'],
                       'weeks':','.join(map(str,nw))})
              for name,f in [('CAL23_Full_565_Study_Coverage_READ_ONLY.csv',rows),
                             ('CAL23_All_Rookie_FrozenPrior_Transfers_READ_ONLY.csv',rookie),
                             ('CAL23_Ten_Owner_Players_FV_Shadow_READ_ONLY.csv',anchored),
                             ('CAL23_Replacement_Position_Control_Comparison.csv',bypos),
                             ('CAL23_Rookie_Tradeoff_By_Frozen_Weight.csv',stats)]:
                  write_csv(out/name,f)
              assert len(rookie)==95*3 and len(anchored)==10 and len(bypos)==7*3 and len(stats)==4
              counts=Counter(r['decision'] for r in rookie)
              # Additional governance: no candidate index, price override, release file,
              # deployment command, or FV+Votes estimate is generated by this audit.
              report={'status':'READ_ONLY_WEEK6_SHADOW_AND_MODEL_COMPARISON',
                      'production_authorized':False,'production_files_changed':0,
                      'source_cal20_green_run':39463394968,
                      'source_cal20_green_review_contract_sha256':sha(cal20/'review_contract.json'),
                      'source_frozen_rookie_sha256':nrf['frozen_prediction_sha256'],
                      'source_frozen_replacement_sha256':rf['frozen_prediction_sha256'],
                      'rookie_week_6_included':6 in nw,'replacement_week_6_included':6 in rw,
                      'cal20_player_count':len(rows),'rookie_frozen_player_count':len(nrf['players']),
                      'replacement_frozen_player_count':len(rf['players']),
                      'rookie_counterfactual_count':len(rookie),
                      'rookie_counterfactual_actions':dict(counts),
                      'owner_anchor_count':len(anchored),
                      'selection_policy':'None: four preregistered rookie weights and three replacement alternatives are compared without selection',
                      'no_future_label_used_to_refit_price':True,
                      'note':'Frozen predictions are 2026 preseason, CAL20 is Oct20; later projection data may already reflect some prospect prior effects. Additive raw transfers are scenario-only, not an identified causal effect or recommended final pricing.'}
              (out/'CAL23_Manifest.json').write_text(json.dumps(report,indent=2)+'\n')
              rookie_count={w: Counter(r['decision'] for r in rookie if r['weight']==w) for w in ROOKIE_WEIGHTS[1:]}
              text=['# CAL23 V1R1 — Week 6 Dual-Study FV Shadow (READ ONLY)','',
                '## Verdict','',
                'Both frozen projects contain Week 6 outcomes. No deployment authorization is claimed and no production files are changed.','',
                'Rookie study primary loss **improves** with stronger historical priors but primary **Spearman player ordering worsens**; a single new weight cannot be declared calibrated.','',
                'Replacement Level primary (active-game-relative) model improves most with full position baselines, but TE gets worse and LB barely moves; this is **not** a player-FV correction factor.','',
                '## Owner-guided anchors: current CAL20 candidate vs three exact-formula prior sensitivities','',
                '| Player | CAL20 FV | Owner feedback | w15 shadow | w30 shadow | w45 shadow |','|---|---:|---|---:|---:|---:|']
              for x in anchored:
                  vs=[x.get('rookie_'+w+'_scenario_fv','—') for w in ROOKIE_WEIGHTS[1:]]
                  text.append(f"| {x['player'].title()} | {x['cal20_green_fv_not_deployed']:,} | {x['owner_fv_assessment']} | " + ' | '.join(str(v) if v!='' else '—' for v in vs)+' |')
              text+=['','These shadow FVs result from a *frozen additive prior delta* applied to CAL20 raw production, then evaluated through the exact CAL20 FV formula. They are not historical published rookie candidate values and are **not approved prices**. A negative result on increased raw production is flagged as `HOLD_MONOTONICITY_CLIFF`, because CAL22 is not deployed.','',
                '## Full-pool guardrails','',f'- Evaluated CAL20 players: {len(rows)}.',
                f'- Frozen rookie study cohort: {len(nrf["players"])}; scenario rows: {len(rookie)}.',
                f'- Frozen replacement study cohort: {len(rf["players"])}; primary validation only uses players with real history.',
                f'- Action counts for w30: {dict(rookie_count["0.30"])}.',
                '- No automatic correction of FV+Votes or Market Value: synchronizing those is a separate required release process.',
                '- Owner controls Malik Davis / Malik Willis / DJ Giddens are not adjusted by the no-history study unless independently in the eligible frozen no-history cohort.',
                '- The Sonny Styles elite-LB mispricing cannot be resolved by a rookie prior alone; independent IDP peer valuation calibration is required.',
                '- Use frozen study results for candidate screening, **not** training to the same Week 1–6 labels and claiming an unseen holdout.',
                '- The stronger 0.45 rookie prior improves one primary error metric but worsens primary Spearman and pairwise ranking compared with 0.00.',
                '- CAL20 remained an owner-review preview at the time of this audit; this does not apply it.',
                '', '## Recommended next implementation stage','',
                'First fix/release CAL22 monotonicity independently if approved; then develop a new FV model candidate that uses prospect prior only as a protected production input, validating against unseen future outcomes and league market evidence. Separately test replacement baseline per position and leave TE out of any promotion unless its adverse result is resolved. Follow with synced FV+Votes and independent MV reconstruction.','',
                'Source files and snapshots are version-checked and read-only; all scenario outputs are diagnostic.', '']
              (out/'CAL23_Review.md').write_text('\n'.join(text),encoding='utf-8')
              print(json.dumps(report,indent=2))
              return report


          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--repo',type=Path,required=True)
              p.add_argument('--cal20',type=Path,required=True)
              p.add_argument('--out',type=Path,required=True)
              a=p.parse_args()
              run(a.repo,a.cal20,a.out)
          if __name__=='__main__':main()
          PY_CAL23_ANALYZER
          python3 -m py_compile "${RUNNER_TEMP}/cal23_shadow.py"

      - name: Recheck both frozen families and simulate CAL20 valuation scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/cal23_shadow.py" \
            --repo . \
            --cal20 "${RUNNER_TEMP}/cal23-cal20" \
            --out "${RUNNER_TEMP}/cal23-results"
          python3 - <<'PY_CAL23_CHECKS'
          import csv,hashlib,json
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'cal23-results'
          m=json.loads((p/'CAL23_Manifest.json').read_text())
          assert m['status']=='READ_ONLY_WEEK6_SHADOW_AND_MODEL_COMPARISON'
          assert m['cal20_player_count']==565 and m['owner_anchor_count']==10
          assert m['rookie_counterfactual_count']==285
          assert m['production_authorized'] is False and m['production_files_changed']==0
          with (p/'CAL23_Ten_Owner_Players_FV_Shadow_READ_ONLY.csv').open(newline='') as f:
              anchor={x['player']:x for x in csv.DictReader(f)}
          assert int(anchor['fernando mendoza']['rookie_0.30_scenario_fv'])==2859
          assert int(anchor['kenyon sadiq']['rookie_0.30_scenario_fv'])==1462
          assert int(anchor['ty simpson']['rookie_0.15_scenario_fv'])<int(anchor['ty simpson']['cal20_green_fv_not_deployed'])
          assert 'HOLD_MONOTONICITY_CLIFF'==anchor['ty simpson']['rookie_0.15_scenario_action']
          assert int(anchor['sonny styles']['rookie_0.45_scenario_fv'])==3359
          print('CAL23 PLAYER REPLAY PASS; 565 source-pinned FVs, 10 owner anchors, 95x3 prior scenarios')
          PY_CAL23_CHECKS

      - name: Show research summary and assert no repository modifications
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          cat "${RUNNER_TEMP}/cal23-results/CAL23_Review.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'CAL23 PASS: research-only, owner review, no production mutation'

      - name: Upload complete independent evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cal23-v1r1-week6-rookie-replacement-565-player-READ-ONLY
          path: ${{ runner.temp }}/cal23-results/
          if-no-files-found: warn
          retention-days: 30
