name: Draft Pick FV V8 - Phase 0H Fleaflicker Third Provider Preregistration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0h-fleaflicker-third-provider-preregistration
  cancel-in-progress: false

jobs:
  source_frame:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download and verify exact Phase 0D baseline and Phase 0G authorization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lineage/p0d" "${RUNNER_TEMP}/lineage/p0g"

          P0D_RUN_ID="36378357894"
          P0D_ARTIFACT_ID="10952656904"
          P0D_DIGEST="sha256:0c24659a7e085f47876227349c884060714f6efbdc90ef680c26750c4359f1a6"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0D_ARTIFACT_ID}" --jq '.digest // ""')" = "$P0D_DIGEST"
          gh run download "$P0D_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0d-targeted-2018-r6-closeout" \
            -D "${RUNNER_TEMP}/lineage/p0d"

          P0G_RUN_ID="36451373540"
          P0G_ARTIFACT_ID="10983377420"
          P0G_DIGEST="sha256:65e78cb5d10f1f8fbde63e49c5044f9c86f0a61e5b5a26c6e4f7cf9e07f0f5cd"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${P0G_ARTIFACT_ID}" --jq '.digest // ""')" = "$P0G_DIGEST"
          gh run download "$P0G_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0g-sleeper-bridge-upper-bound-closeout" \
            -D "${RUNNER_TEMP}/lineage/p0g"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"lineage"
          p0d=root/"p0d"
          p0g=root/"p0g"

          s=json.loads((p0d/"v8_phase0d_targeted_2018_r6_source_expansion.json").read_text())
          e=json.loads((p0d/"v8_phase0d_exact_source_identity_evidence.json").read_text())
          g=json.loads((p0g/"v8_phase0g_sleeper_bridge_upper_bound_closeout.json").read_text())

          assert s["decision"]=="STOP_AND_PREREGISTER_V8_PHASE0E_SECOND_SOURCE_2018_R6_BEFORE_OUTCOMES"
          assert s["phase0d_final_target_counts"]=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }
          assert s["year_cells_passing"]==105
          assert s["all_year_cells_pass"] is False
          assert s["transport"]["gate_pass"] is True
          assert s["historical_outcome_ingestion_authorized"] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert e["decision"]==s["decision"]
          for cell in ("r6_early","r6_mid","r6_late"):
              assert len(e["cell_membership_league_ids"][f"2018:{cell}"])==6

          assert g["decision"]=="STOP_SLEEPER_AS_V8_2018_R6_SECOND_SOURCE_AND_PREREGISTER_THIRD_PROVIDER_BEFORE_OUTCOMES"
          assert g["phase0f_bridge_candidate_league_n"]==37
          assert g["explicit_alternate_tag_league_n"]==34
          assert g["missing_player_type_league_n"]==4
          assert g["bridgeable_distinct_league_upper_bound_n"]==4
          assert g["required_new_distinct_leagues_per_target_cell"]==6
          assert g["max_possible_final_counts_by_cell"]=={
              "r6_early":10,"r6_mid":10,"r6_late":10,
          }
          assert g["minimum_remaining_shortfall_by_cell"]=={
              "r6_early":2,"r6_mid":2,"r6_late":2,
          }
          assert g["source_frame_can_close_gap"] is False
          assert g["next_stage"]=="PREREGISTER_V8_PHASE0H_THIRD_PROVIDER_2018_R6_BEFORE_OUTCOMES"

          for key in (
              "draft_pick_endpoint_read",
              "player_catalog_read",
              "historical_player_outcomes_read",
              "holdout_2024_outcomes_read",
              "market_or_ktc_values_read",
              "package_vote_data_read",
              "candidate_fit_performed",
              "candidate_scores_computed",
              "production_change_authorized",
          ):
              assert g[key] is False,(key,g[key])

          print("PASS: Phase 0D exact baseline and Phase 0G third-provider authorization verified.")
          PY

      - name: Preregister Fleaflicker source frame and run metadata-only feasibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out"

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import re
          import time
          from collections import Counter
          from pathlib import Path
          from typing import Any

          import requests
          from bs4 import BeautifulSoup

          ROOT=Path(os.environ["RUNNER_TEMP"])
          OUT=ROOT/"out"
          LINEAGE=ROOT/"lineage"
          YEAR=2018
          TARGET_CELLS=("r6_early","r6_mid","r6_late")
          REQUIRED_NEW_DISTINCT_LEAGUES=6

          DIRECTORY_URL="https://www.fleaflicker.com/nfl/leagues"
          API_BASE="https://www.fleaflicker.com/api"

          # Frozen before any draft-board access. This phase never calls
          # FetchLeagueDraftBoard.
          DIRECTORY_SORT_NAME=0
          DIRECTORY_SORT_DIRECTION="ASC"
          DIRECTORY_PAGE_SIZE=24
          MAX_DIRECTORY_PAGES=200
          MAX_DISCOVERY_CANDIDATES=1200
          MIN_KEEPERS_FOR_DYNASTY_PROXY=12
          LATEST_ESTABLISHED_YEAR=2017
          REQUEST_RETRIES=6
          REQUEST_SLEEP=0.20

          class TransportError(RuntimeError):
              pass

          def stable_hash(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          def sha_ids(values: list[str]) -> str:
              return hashlib.sha256("\n".join(values).encode()).hexdigest()

          def norm_space(x: Any) -> str:
              return re.sub(r"\s+"," ",str(x or "").replace("\xa0"," ")).strip()

          def safe_int(x: Any):
              try:
                  return int(str(x).strip())
              except Exception:
                  return None

          def obvious_mock_name(name: Any) -> bool:
              n=norm_space(name).lower()
              return any(tok in n for tok in ("mock","draft master","draftmasters","test league"))

          def parse_directory_page(html: str) -> list[dict[str, Any]]:
              soup=BeautifulSoup(html,"html.parser")
              rows=[]
              seen=set()
              for tr in soup.find_all("tr"):
                  links=tr.find_all("a",href=True)
                  lid=None
                  league_name=None
                  for a in links:
                      m=re.search(r"/nfl/leagues/(\d+)(?:/|$|\?)",str(a.get("href") or ""))
                      if not m:
                          continue
                      lid=m.group(1)
                      txt=norm_space(a.get_text(" ",strip=True))
                      if txt:
                          league_name=txt
                      break
                  if not lid or lid in seen:
                      continue
                  seen.add(lid)
                  text=norm_space(tr.get_text(" ",strip=True))
                  keep=re.search(r"\b(\d+)\s+Keepers?\s+Est\.\s+(\d{4})\b",text,re.I)
                  members=re.search(r"\b(\d+)\s*/\s*(\d+)\b",text)
                  rows.append({
                      "league_id":lid,
                      "league_name":league_name,
                      "row_text":text,
                      "keeper_count":int(keep.group(1)) if keep else None,
                      "established_year":int(keep.group(2)) if keep else None,
                      "current_member_n":int(members.group(1)) if members else None,
                      "current_capacity":int(members.group(2)) if members else None,
                      "directory_redraft_marker":bool(re.search(r"\bRedraft\b",text,re.I)),
                  })
              return rows

          def sf_2qb_from_rules(obj: Any) -> tuple[bool,str,dict[str,Any]]:
              if not isinstance(obj,dict):
                  return False,"rules_not_object",{}
              positions=obj.get("roster_positions")
              if not isinstance(positions,list):
                  return False,"roster_positions_missing",{}
              qb_only_starts=0
              flex_qb_starts=0
              start_rows=[]
              for p in positions:
                  if not isinstance(p,dict):
                      continue
                  if str(p.get("group") or "").upper()!="START":
                      continue
                  start=max(0,safe_int(p.get("start")) or 0)
                  elig={str(x).upper() for x in (p.get("eligibility") or []) if x is not None}
                  if start<=0:
                      continue
                  start_rows.append({
                      "label":p.get("label"),
                      "eligibility":sorted(elig),
                      "start":start,
                  })
                  if elig=={"QB"}:
                      qb_only_starts+=start
                  if "QB" in elig and bool(elig & {"RB","WR","TE"}):
                      flex_qb_starts+=start
              if qb_only_starts>=2:
                  return True,"current_rules_2qb",{
                      "qb_only_starts":qb_only_starts,
                      "qb_flex_starts":flex_qb_starts,
                      "start_rows":start_rows,
                  }
              if qb_only_starts>=1 and flex_qb_starts>=1:
                  return True,"current_rules_superflex",{
                      "qb_only_starts":qb_only_starts,
                      "qb_flex_starts":flex_qb_starts,
                      "start_rows":start_rows,
                  }
              return False,"current_rules_not_sf_2qb",{
                  "qb_only_starts":qb_only_starts,
                  "qb_flex_starts":flex_qb_starts,
                  "start_rows":start_rows,
              }

          def historical_team_ids(standings: Any) -> list[str]:
              if not isinstance(standings,dict):
                  return []
              ids=[]
              for div in standings.get("divisions") or []:
                  if not isinstance(div,dict):
                      continue
                  for team in div.get("teams") or []:
                      if not isinstance(team,dict):
                          continue
                      tid=str(team.get("id") or "").strip()
                      if tid:
                          ids.append(tid)
              return sorted(set(ids))

          def selftest():
              html="""
              <table><tr>
                <td><a href="/nfl/leagues/140072">International Dynasty League</a></td>
                <td>No</td><td>30 Keepers Est. 2013</td><td>12 / 12</td>
                <td>Private</td><td>At game start</td><td>Drafted</td>
              </tr></table>
              """
              rows=parse_directory_page(html)
              assert len(rows)==1
              r=rows[0]
              assert r["league_id"]=="140072"
              assert r["keeper_count"]==30
              assert r["established_year"]==2013
              assert r["current_capacity"]==12

              sf={
                  "roster_positions":[
                      {"group":"START","label":"QB","eligibility":["QB"],"start":1},
                      {"group":"START","label":"SF","eligibility":["QB","RB","WR","TE"],"start":1},
                  ]
              }
              ok,kind,_=sf_2qb_from_rules(sf)
              assert ok and kind=="current_rules_superflex"

              twoqb={
                  "roster_positions":[
                      {"group":"START","label":"QB","eligibility":["QB"],"start":2},
                  ]
              }
              ok,kind,_=sf_2qb_from_rules(twoqb)
              assert ok and kind=="current_rules_2qb"

              st={"divisions":[{"teams":[{"id":i} for i in range(1,7)]},
                               {"teams":[{"id":i} for i in range(7,13)]}]}
              assert len(historical_team_ids(st))==12
              print("PASS: Phase 0H directory/rules/standings parser self-test.")

          selftest()

          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Pick-FV-V8-P0H-Fleaflicker-SourceFrame/1.0",
              "Accept":"application/json,text/html;q=0.9,*/*;q=0.8",
          })

          def request(method: str, url: str, **kwargs):
              last=None
              for attempt in range(REQUEST_RETRIES):
                  try:
                      r=session.request(method,url,timeout=35,**kwargs)
                      if r.status_code in {429,500,502,503,504}:
                          raise requests.HTTPError(f"HTTP {r.status_code}",response=r)
                      r.raise_for_status()
                      time.sleep(REQUEST_SLEEP)
                      return r
                  except Exception as exc:
                      last=exc
                      if attempt+1>=REQUEST_RETRIES:
                          break
                      time.sleep(min(2**attempt,12))
              raise TransportError(f"{url}: {type(last).__name__}: {last}")

          # -------- Discovery: public league directory only; no draft endpoints. --------
          directory_rows={}
          page_stats=[]
          page_signatures=set()
          stop_reason=None

          for page in range(MAX_DIRECTORY_PAGES):
              offset=page*DIRECTORY_PAGE_SIZE
              r=request(
                  "GET",
                  DIRECTORY_URL,
                  params={
                      "tableOffset":offset,
                      "tableSortDirection":DIRECTORY_SORT_DIRECTION,
                      "tableSortName":DIRECTORY_SORT_NAME,
                  },
              )
              rows=parse_directory_page(r.text)
              ids=sorted(x["league_id"] for x in rows)
              sig=sha_ids(ids) if ids else None
              if not rows:
                  stop_reason="empty_directory_page"
                  page_stats.append({"page":page,"offset":offset,"row_n":0,"new_n":0})
                  break
              if sig in page_signatures:
                  stop_reason="repeated_directory_page"
                  page_stats.append({"page":page,"offset":offset,"row_n":len(rows),"new_n":0})
                  break
              page_signatures.add(sig)
              new_n=0
              for row in rows:
                  if row["league_id"] not in directory_rows:
                      directory_rows[row["league_id"]]=row
                      new_n+=1
              page_stats.append({"page":page,"offset":offset,"row_n":len(rows),"new_n":new_n})
              if len(rows)<DIRECTORY_PAGE_SIZE:
                  stop_reason="short_final_directory_page"
                  break
          else:
              stop_reason="maximum_directory_pages_reached"

          if not directory_rows:
              raise RuntimeError("Fleaflicker directory discovery produced zero league rows")

          # Frozen source-frame filters that do not inspect historical draft picks:
          # 12-team current capacity; >=12 keepers; established before 2018; non-mock.
          discovery_candidates=[]
          discovery_reject_counts=Counter()
          for lid,row in sorted(directory_rows.items(),key=lambda kv:int(kv[0])):
              if row["current_capacity"]!=12:
                  discovery_reject_counts["not_current_capacity_12"]+=1
                  continue
              if row["directory_redraft_marker"]:
                  discovery_reject_counts["directory_redraft"]+=1
                  continue
              if row["keeper_count"] is None or row["keeper_count"]<MIN_KEEPERS_FOR_DYNASTY_PROXY:
                  discovery_reject_counts["keeper_count_below_12_or_missing"]+=1
                  continue
              if row["established_year"] is None or row["established_year"]>LATEST_ESTABLISHED_YEAR:
                  discovery_reject_counts["not_established_before_2018"]+=1
                  continue
              if obvious_mock_name(row["league_name"]):
                  discovery_reject_counts["obvious_mock_name"]+=1
                  continue
              discovery_candidates.append(row)

          discovery_candidates=sorted(
              discovery_candidates,
              key=lambda x:(stable_hash(f"v8p0h|2018|fleaflicker|{x['league_id']}"),x["league_id"]),
          )[:MAX_DISCOVERY_CANDIDATES]

          candidate_ids=[x["league_id"] for x in discovery_candidates]
          if not candidate_ids:
              raise RuntimeError(
                  "Fleaflicker directory produced zero preregisterable 12-team established high-keeper candidates"
              )
          assert len(candidate_ids)==len(set(candidate_ids))

          # The candidate universe is now frozen. Only source metadata endpoints follow.
          candidate_ids_sha256=sha_ids(candidate_ids)

          def api_json(endpoint: str, **params):
              q={"sport":"NFL"}
              q.update(params)
              r=request("GET",f"{API_BASE}/{endpoint}",params=q)
              obj=r.json()
              if not isinstance(obj,dict):
                  raise RuntimeError(f"{endpoint}: non-object JSON")
              return obj

          records=[]
          transport_unresolved=[]

          for idx,row in enumerate(discovery_candidates,1):
              lid=row["league_id"]
              rec={
                  "scan_index":idx,
                  "league_id":lid,
                  "league_name":row["league_name"],
                  "directory_keeper_count":row["keeper_count"],
                  "directory_established_year":row["established_year"],
                  "directory_current_member_n":row["current_member_n"],
                  "directory_current_capacity":row["current_capacity"],
              }
              try:
                  standings=api_json(
                      "FetchLeagueStandings",
                      league_id=int(lid),
                      season=YEAR,
                  )
                  team_ids=historical_team_ids(standings)
                  rec["historical_2018_team_n"]=len(team_ids)
                  rec["historical_2018_team_ids_sha256"]=sha_ids(team_ids) if team_ids else None
                  if len(team_ids)!=12:
                      rec["status"]="historical_2018_not_12_team"
                      records.append(rec)
                      continue

                  rules=api_json(
                      "FetchLeagueRules",
                      league_id=int(lid),
                  )
                  sf_ok,sf_kind,sf_detail=sf_2qb_from_rules(rules)
                  rec["current_sf_2qb_proxy_kind"]=sf_kind
                  rec["current_sf_2qb_proxy_detail"]=sf_detail
                  rec["current_max_roster_size"]=safe_int(rules.get("max_roster_size"))
                  rec["current_num_starters"]=safe_int(rules.get("num_starters"))
                  if not sf_ok:
                      rec["status"]="current_rules_not_sf_2qb"
                      records.append(rec)
                      continue

                  rec["status"]="prequalified_metadata_only"
                  records.append(rec)

              except TransportError as exc:
                  fp=hashlib.sha256(str(exc).encode()).hexdigest()
                  rec["status"]="transport_unresolved"
                  rec["transport_error_fingerprint_sha256"]=fp
                  records.append(rec)
                  transport_unresolved.append({
                      "league_id":lid,
                      "scan_index":idx,
                      "failure_class":"fleaflicker_metadata_transport_exhausted",
                      "error_fingerprint_sha256":fp,
                  })

          assert len(records)==len(candidate_ids)
          assert [x["league_id"] for x in records]==candidate_ids

          prequalified=[
              x for x in records if x["status"]=="prequalified_metadata_only"
          ]
          prequalified_ids=[x["league_id"] for x in prequalified]
          unresolved_ids={x["league_id"] for x in transport_unresolved}

          transport_cap=max(3,math.ceil(len(candidate_ids)*0.01))
          transport_gate=len(unresolved_ids)<=transport_cap
          source_frame_minimum_pass=len(prequalified_ids)>=REQUIRED_NEW_DISTINCT_LEAGUES
          proceed=transport_gate and source_frame_minimum_pass

          decision=(
              "PROCEED_TO_V8_PHASE0I_FLEAFLICKER_DRAFT_SCOPE_AND_R6_PROBE"
              if proceed else
              "STOP_V8_PHASE0H_FLEAFLICKER_SOURCE_FRAME_INSUFFICIENT_BEFORE_DRAFT_PICKS"
          )

          status_counts=Counter(x["status"] for x in records)

          contract={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase0h_fleaflicker_third_provider_preregistration",
              "status":"FROZEN_PRE_FLEAFLICKER_DRAFT_BOARD_PRE_OUTCOME",
              "authorization":{
                  "phase0g_decision":
                      "STOP_SLEEPER_AS_V8_2018_R6_SECOND_SOURCE_AND_PREREGISTER_THIRD_PROVIDER_BEFORE_OUTCOMES",
                  "phase0g_run_id":36451373540,
                  "phase0g_artifact_id":10983377420,
                  "phase0g_artifact_digest":
                      "sha256:65e78cb5d10f1f8fbde63e49c5044f9c86f0a61e5b5a26c6e4f7cf9e07f0f5cd",
              },
              "frozen_baseline":{
                  "provider":"MyFantasyLeague",
                  "phase0d_run_id":36378357894,
                  "phase0d_artifact_id":10952656904,
                  "phase0d_artifact_digest":
                      "sha256:0c24659a7e085f47876227349c884060714f6efbdc90ef680c26750c4359f1a6",
                  "target_counts":{
                      "r6_early":6,"r6_mid":6,"r6_late":6,
                  },
                  "year_cells_passing":105,
                  "non_target_105_year_cells_may_change":False,
              },
              "third_provider":{
                  "provider":"Fleaflicker",
                  "api_base":API_BASE,
                  "directory_url":DIRECTORY_URL,
                  "year":YEAR,
                  "rationale":"public historical draft-board API plus public historical standings and roster-rule API",
              },
              "discovery":{
                  "source":"Fleaflicker public NFL league directory",
                  "sort_name":DIRECTORY_SORT_NAME,
                  "sort_direction":DIRECTORY_SORT_DIRECTION,
                  "page_size":DIRECTORY_PAGE_SIZE,
                  "maximum_pages":MAX_DIRECTORY_PAGES,
                  "stop_reason":stop_reason,
                  "directory_unique_league_n":len(directory_rows),
                  "minimum_keeper_count":MIN_KEEPERS_FOR_DYNASTY_PROXY,
                  "latest_established_year":LATEST_ESTABLISHED_YEAR,
                  "required_current_capacity":12,
                  "candidate_cap":MAX_DISCOVERY_CANDIDATES,
                  "candidate_n":len(candidate_ids),
                  "candidate_ids_sha256":candidate_ids_sha256,
                  "candidate_order":"SHA256(v8p0h|2018|fleaflicker|league_id), then league_id",
                  "draft_board_read_during_discovery":False,
                  "draft_pick_read_during_discovery":False,
                  "manual_candidate_addition_allowed":False,
              },
              "metadata_qualification":{
                  "historical_team_count_endpoint":"FetchLeagueStandings(season=2018)",
                  "historical_team_count_required":12,
                  "sf_2qb_endpoint":"FetchLeagueRules(current)",
                  "sf_2qb_is_current_rules_continuity_proxy":True,
                  "sf_definition":"at least two QB-only starters OR at least one QB-only starter plus one QB/RB/WR/TE flex starter",
                  "dynasty_definition":"directory keeper_count >= 12 and established_year <= 2017",
                  "rookie_scope_not_tested_in_phase0h":True,
                  "rookie_scope_must_be_proved_pre_outcome_in_phase0i":True,
                  "draft_board_endpoint_allowed_in_phase0h":False,
              },
              "phase0i_if_authorized":{
                  "target_cells":["r6_early","r6_mid","r6_late"],
                  "target_slots":{
                      "r6_early":[61,62,63,64],
                      "r6_mid":[65,66,67,68],
                      "r6_late":[69,70,71,72],
                  },
                  "required_additional_distinct_leagues_each":6,
                  "prequalified_league_ids_sha256":sha_ids(prequalified_ids),
                  "prequalified_league_n":len(prequalified_ids),
                  "candidate_fit_or_outcome_selection_allowed":False,
              },
              "transport":{
                  "metadata_unresolved_distinct_league_n":len(unresolved_ids),
                  "maximum_allowed_unresolved_n":transport_cap,
                  "gate_pass":transport_gate,
              },
              "firewalls":{
                  "fleaflicker_draft_board_read":False,
                  "fleaflicker_draft_pick_read":False,
                  "player_catalog_read":False,
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "production_change_authorized":False,
              },
              "decision":decision,
              "next_stage":(
                  "draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe"
                  if proceed else
                  "STOP_RESEARCH_BEFORE_OUTCOMES_REVIEW_THIRD_PROVIDER_FRAME"
              ),
          }

          result={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0h_fleaflicker_third_provider_source_frame_closeout",
              "decision":decision,
              "candidate_n":len(candidate_ids),
              "candidate_ids":candidate_ids,
              "candidate_ids_sha256":candidate_ids_sha256,
              "directory_page_stats":page_stats,
              "directory_stop_reason":stop_reason,
              "directory_unique_league_n":len(directory_rows),
              "directory_filter_reject_counts":dict(sorted(discovery_reject_counts.items())),
              "candidate_records":records,
              "candidate_status_counts":dict(sorted(status_counts.items())),
              "prequalified_metadata_only_league_n":len(prequalified_ids),
              "prequalified_metadata_only_league_ids":prequalified_ids,
              "prequalified_metadata_only_league_ids_sha256":sha_ids(prequalified_ids),
              "minimum_required_for_phase0i":REQUIRED_NEW_DISTINCT_LEAGUES,
              "source_frame_minimum_pass":source_frame_minimum_pass,
              "transport":{
                  "unresolved_distinct_league_n":len(unresolved_ids),
                  "maximum_allowed_unresolved_n":transport_cap,
                  "gate_pass":transport_gate,
              },
              "firewalls":contract["firewalls"],
              "fleaflicker_draft_board_read":False,
              "fleaflicker_draft_pick_read":False,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":contract["next_stage"],
          }

          (OUT/"v8_phase0h_fleaflicker_third_provider_contract.json").write_text(
              json.dumps(contract,indent=2,sort_keys=True)+"\n"
          )
          (OUT/"v8_phase0h_fleaflicker_third_provider_source_frame.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0H Fleaflicker Third Provider Preregistration",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- Fleaflicker directory leagues observed: **{len(directory_rows)}**",
              f"- Frozen high-keeper, pre-2018, 12-capacity candidates: **{len(candidate_ids)}**",
              f"- Historical-2018 12-team + current SF/2QB-proxy prequalified: **{len(prequalified_ids)}**",
              f"- Minimum needed before a pick-level Phase 0I probe: **{REQUIRED_NEW_DISTINCT_LEAGUES}**",
              f"- Metadata transport unresolved: **{len(unresolved_ids)}**; cap **{transport_cap}**",
              f"- Directory stop: **{stop_reason}**",
              "",
              "Phase 0H intentionally does not read Fleaflicker draft boards or draft picks.",
              "Rookie-scope/contamination and target-cell identity are deferred to a separately preregistered Phase 0I.",
              "",
              "No historical NFL outcomes, 2024 holdout outcomes, market/KTC values, package votes, candidate fits, candidate scores, or production values were read.",
          ]
          (OUT/"v8_phase0h_fleaflicker_third_provider_source_frame.md").write_text(
              "\n".join(lines)+"\n"
          )

          print("\n".join(lines))
          PY

      - name: Validate Phase 0H source-frame closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"out"
          c=json.loads((out/"v8_phase0h_fleaflicker_third_provider_contract.json").read_text())
          r=json.loads((out/"v8_phase0h_fleaflicker_third_provider_source_frame.json").read_text())

          assert c["status"]=="FROZEN_PRE_FLEAFLICKER_DRAFT_BOARD_PRE_OUTCOME"
          assert c["authorization"]["phase0g_run_id"]==36451373540
          assert c["authorization"]["phase0g_artifact_id"]==10983377420
          assert c["frozen_baseline"]["target_counts"]=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }
          assert c["frozen_baseline"]["year_cells_passing"]==105
          assert c["third_provider"]["provider"]=="Fleaflicker"
          assert c["discovery"]["candidate_n"]==r["candidate_n"]
          assert c["discovery"]["candidate_ids_sha256"]==r["candidate_ids_sha256"]
          assert c["discovery"]["draft_board_read_during_discovery"] is False
          assert c["discovery"]["draft_pick_read_during_discovery"] is False
          assert c["metadata_qualification"]["historical_team_count_required"]==12
          assert c["metadata_qualification"]["sf_2qb_is_current_rules_continuity_proxy"] is True
          assert c["metadata_qualification"]["rookie_scope_not_tested_in_phase0h"] is True
          assert c["metadata_qualification"]["draft_board_endpoint_allowed_in_phase0h"] is False
          assert c["phase0i_if_authorized"]["required_additional_distinct_leagues_each"]==6
          assert r["minimum_required_for_phase0i"]==6
          assert r["fleaflicker_draft_board_read"] is False
          assert r["fleaflicker_draft_pick_read"] is False
          assert r["historical_player_outcomes_read"] is False
          assert r["holdout_2024_outcomes_read"] is False
          assert r["production_change_authorized"] is False
          assert all(v is False for v in c["firewalls"].values())
          assert all(v is False for v in r["firewalls"].values())

          assert r["decision"] in {
              "PROCEED_TO_V8_PHASE0I_FLEAFLICKER_DRAFT_SCOPE_AND_R6_PROBE",
              "STOP_V8_PHASE0H_FLEAFLICKER_SOURCE_FRAME_INSUFFICIENT_BEFORE_DRAFT_PICKS",
          }

          if r["decision"]=="PROCEED_TO_V8_PHASE0I_FLEAFLICKER_DRAFT_SCOPE_AND_R6_PROBE":
              assert r["prequalified_metadata_only_league_n"]>=6
              assert r["source_frame_minimum_pass"] is True
              assert r["transport"]["gate_pass"] is True
              assert r["next_stage"]=="draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe"

          print("PASS: Phase 0H is preregistered, metadata-only, draft-board sealed, and outcome sealed.")
          PY

      - name: Upload Phase 0H source-frame closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0h-fleaflicker-third-provider-preregistration
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
