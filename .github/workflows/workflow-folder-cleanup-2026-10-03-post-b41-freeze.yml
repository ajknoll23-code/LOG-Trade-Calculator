name: Workflow Folder Cleanup - 2026-10-03 Post B41 Freeze

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CLEANUP_FILE: "workflow-folder-cleanup-2026-10-03-post-b41-freeze.yml"
  EXPECTED_RESOLVER_BLOB: "cf77502d864d71cf60507bb0d209c22f12dcc127"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests>=2.32,<3"

      - name: Guard exact archive targets and protected live workflows
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git branch --show-current)" = "main"

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import yaml

          W = Path('.github/workflows')
          assert W.is_dir()

          targets = {
            'B34B-package-trade-evidence-pick-round-key-repair.yml': '064ba93a68a807e8f15b086c1c6594473f98d313',
            'B38-weekly-floor-ceiling-volatility-v1-prospective-only-prereg-week4-freeze.yml': '8820bec1c9d16eac9761d43ca8c2b9f5b6627cdb',
            'B38A-weekly-floor-ceiling-volatility-v1-week4-partial-origin-salvage.yml': 'fadbc0a307b100cd02125062050b5e57bdb9d9b1',
            'B40-live-draft-pick-ownership-repair.yml': 'b83fc95740678989d1516422b0a04bb6e652fe95',
            'B40-live-draft-pick-ownership-repair-v2.yml': '5e37b3517a8ed135d6064734792742f822d7dac4',
            'B41A-player-role-engine-v2-scientific-prereg-source-feasibility.yml': 'fa294a0dfc302ef03d545228a17c0199e6478cdc',
            'B41B-player-role-engine-v2-historical-cohort-leakage-audit.yml': '4160762537132d28047240d624fcdc6165faa88f',
            'B41B-v2-player-role-engine-v2-rectangular-schema-recovery.yml': '7d14b42a8f1ee38b888398b7ca72ee66fdd553cc',
            'B41C-player-role-engine-v2-exact-target-scorer-validation-model-prereg.yml': '44ca7704c21ada678bfb9b647a541ac38df43bfa',
            'B41C2-player-role-engine-v2-scorer-recovery-calibration.yml': 'a78a9b8f15685bd964450c011d1d3547cc076f77',
            'B41D-player-role-engine-v2-owner-blind-historical-development-model-fitting.yml': 'e5236f4bbd5152dfc1256f43b5cd3d1c93a60833',
            'B41E-player-role-engine-v2-exact-seven-tier-development-oof-derivation-and-freeze.yml': 'e1e440b9a869062f7ae02a533d6d8d97fe12bf00',
            'B41F-player-role-engine-v2-final-development-model-fit-and-pre-holdout-freeze.yml': '6d78b6a26b437362fbc1a60d48d9fc3d3f5bd1b0',
            'B41G-player-role-engine-v2-2025-holdout-validation-preregistration-and-baseline-freeze.yml': '2dbeee3b3f7a75994ed7c8a25f9594450f0ab5d5',
            'scheduled-data-refresh-stable-identity-diacritic-repair.yml': 'a9a94da55fa5322c01e33821e3efe6750a5d1622',
          }

          protected = {
            'B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml',
            'B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml',
            'B34D-package-trade-evidence-future-structural-maturity-monitor.yml',
            'B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml',
            'B41C3-player-role-engine-v2-untouched-week4-scorer-confirmation.yml',
            'B41H-player-role-engine-v2-frozen-one-shot-2025-holdout-evaluator.yml',
            'age-curve-v2-phase5.yml',
            'cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml',
            'durability-v2-phase5.yml',
            'fantasypros-api-pipeline.yml',
            'free-agent-utility-v1-refresh.yml',
            'idp-dl-lb-phase2.yml',
            'ktc-vote-aggregation.yml',
            'ktc_voter_balance_prospective.yml',
            'market-edge-v1-prospective-study.yml',
            'no-history-rookie-v2-phase3.yml',
            'opportunity-v2-phase5.yml',
            'package-adjustment-audit-step4-exact-live-oos.yml',
            'position-weight-v2-phase5.yml',
            'prospective-trade-evidence-capture.yml',
            'replacement-level-v2-phase5.yml',
            'repo-regression-checks.yml',
            'research-program-status-v1-current-state-audit.yml',
            'scheduled-data-refresh.yml',
            'sync-sleeper.yml',
          }

          current = {p.name for p in W.iterdir() if p.is_file() and p.suffix in {'.yml', '.yaml'}}
          cleanup = 'workflow-folder-cleanup-2026-10-03-post-b41-freeze.yml'
          assert cleanup in current, f'missing cleanup workflow: {cleanup}'

          missing_targets = sorted(set(targets) - current)
          if missing_targets:
              raise SystemExit('Archive target(s) missing: ' + ', '.join(missing_targets))

          missing_protected = sorted(protected - current)
          if missing_protected:
              raise SystemExit('Protected live workflow(s) missing: ' + ', '.join(missing_protected))

          for name, expected_blob in targets.items():
              path = W / name
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              if actual != expected_blob:
                  raise SystemExit(
                      f'Blob drift for {name}: expected={expected_blob} actual={actual}'
                  )

          # Validate every currently active YAML before moving anything.
          for path in sorted(W.iterdir()):
              if path.is_file() and path.suffix in {'.yml', '.yaml'}:
                  yaml.safe_load(path.read_text(encoding='utf-8'))

          # Scientific state: B41 development is frozen, B41C3 and B41H remain live,
          # and the untouched 2025 holdout is still sealed.
          D = Path('research/player-role-v2')
          g = json.loads((D/'player_role_v2_b41g_freeze_decision.json').read_text(encoding='utf-8'))
          assert g['result'] == 'PASS_2025_HOLDOUT_PROTOCOL_AND_BASELINE_FROZEN'
          assert g.get('production_change_authorized') is False

          h = json.loads((D/'player_role_v2_b41h_evaluator_freeze.json').read_text(encoding='utf-8'))
          assert h['status'] == 'EVALUATOR_IMPLEMENTATION_FROZEN_BEFORE_B41C3_AND_2025_HOLDOUT'
          assert h['sequencing']['B41C3_pass_required_before_first_2025_request'] is True
          assert h['sequencing']['one_scientific_2025_evaluation_only'] is True
          assert h['production_model_deployed'] is False
          assert h['production_change_authorized'] is False

          # The first B41H run was freeze-only. Do not archive the executable B41H workflow.
          assert not (D/'player_role_v2_b41h_holdout_open_witness.json').exists()
          assert not (D/'player_role_v2_b41h_scientific_decision.json').exists()

          # The just-completed identity repair must be present in production code.
          resolver = Path('scripts/projections/resolve_fantasypros_sleeper_identity.py')
          actual_resolver_blob = subprocess.check_output(['git','hash-object',str(resolver)], text=True).strip()
          expected_resolver_blob = 'cf77502d864d71cf60507bb0d209c22f12dcc127'
          assert actual_resolver_blob == expected_resolver_blob, (actual_resolver_blob, expected_resolver_blob)
          text = resolver.read_text(encoding='utf-8')
          assert 'import unicodedata' in text
          assert 'def stable_name(value):' in text
          assert 'Diacritic tolerance is deliberately scoped ONLY here' in text

          print(f'PASS: active workflows before cleanup = {len(current)}')
          print(f'PASS: exact archive target count = {len(targets)}')
          print('PASS: B41C3 and B41H remain protected and 2025 remains sealed.')
          print('PASS: completed diacritic repair is verified before archival.')
          PY

      - name: Pre-cleanup regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Archive completed and superseded workflows
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          W = Path('.github/workflows')
          A = Path('.github/workflow-archive/completed-research')
          C = Path('.github/workflow-archive/cleanup-workflows')
          M = Path('.github/workflow-archive/cleanup-manifests')
          A.mkdir(parents=True, exist_ok=True)
          C.mkdir(parents=True, exist_ok=True)
          M.mkdir(parents=True, exist_ok=True)

          targets = {
            'B34B-package-trade-evidence-pick-round-key-repair.yml': '064ba93a68a807e8f15b086c1c6594473f98d313',
            'B38-weekly-floor-ceiling-volatility-v1-prospective-only-prereg-week4-freeze.yml': '8820bec1c9d16eac9761d43ca8c2b9f5b6627cdb',
            'B38A-weekly-floor-ceiling-volatility-v1-week4-partial-origin-salvage.yml': 'fadbc0a307b100cd02125062050b5e57bdb9d9b1',
            'B40-live-draft-pick-ownership-repair.yml': 'b83fc95740678989d1516422b0a04bb6e652fe95',
            'B40-live-draft-pick-ownership-repair-v2.yml': '5e37b3517a8ed135d6064734792742f822d7dac4',
            'B41A-player-role-engine-v2-scientific-prereg-source-feasibility.yml': 'fa294a0dfc302ef03d545228a17c0199e6478cdc',
            'B41B-player-role-engine-v2-historical-cohort-leakage-audit.yml': '4160762537132d28047240d624fcdc6165faa88f',
            'B41B-v2-player-role-engine-v2-rectangular-schema-recovery.yml': '7d14b42a8f1ee38b888398b7ca72ee66fdd553cc',
            'B41C-player-role-engine-v2-exact-target-scorer-validation-model-prereg.yml': '44ca7704c21ada678bfb9b647a541ac38df43bfa',
            'B41C2-player-role-engine-v2-scorer-recovery-calibration.yml': 'a78a9b8f15685bd964450c011d1d3547cc076f77',
            'B41D-player-role-engine-v2-owner-blind-historical-development-model-fitting.yml': 'e5236f4bbd5152dfc1256f43b5cd3d1c93a60833',
            'B41E-player-role-engine-v2-exact-seven-tier-development-oof-derivation-and-freeze.yml': 'e1e440b9a869062f7ae02a533d6d8d97fe12bf00',
            'B41F-player-role-engine-v2-final-development-model-fit-and-pre-holdout-freeze.yml': '6d78b6a26b437362fbc1a60d48d9fc3d3f5bd1b0',
            'B41G-player-role-engine-v2-2025-holdout-validation-preregistration-and-baseline-freeze.yml': '2dbeee3b3f7a75994ed7c8a25f9594450f0ab5d5',
            'scheduled-data-refresh-stable-identity-diacritic-repair.yml': 'a9a94da55fa5322c01e33821e3efe6750a5d1622',
          }
          cleanup = 'workflow-folder-cleanup-2026-10-03-post-b41-freeze.yml'

          before = sorted(
              p.name for p in W.iterdir()
              if p.is_file() and p.suffix in {'.yml', '.yaml'}
          )

          archived = []
          for name, expected_blob in targets.items():
              src = W/name
              dst = A/name
              assert src.exists(), src
              assert subprocess.check_output(['git','hash-object',str(src)], text=True).strip() == expected_blob
              if dst.exists():
                  dst_blob = subprocess.check_output(['git','hash-object',str(dst)], text=True).strip()
                  if dst_blob != expected_blob:
                      raise SystemExit(f'Archive collision with different content: {dst}')
                  subprocess.run(['git','rm',str(src)], check=True)
              else:
                  subprocess.run(['git','mv',str(src),str(dst)], check=True)
              archived.append({'name': name, 'blob_sha': expected_blob, 'archive_path': str(dst)})

          # Self-archive so the active Actions folder remains clean after this run.
          self_src = W/cleanup
          self_dst = C/cleanup
          assert self_src.exists()
          if self_dst.exists():
              if self_dst.read_bytes() != self_src.read_bytes():
                  raise SystemExit(f'Cleanup archive collision: {self_dst}')
              subprocess.run(['git','rm',str(self_src)], check=True)
          else:
              subprocess.run(['git','mv',str(self_src),str(self_dst)], check=True)

          after = sorted(
              p.name for p in W.iterdir()
              if p.is_file() and p.suffix in {'.yml', '.yaml'}
          )
          expected_after_count = len(before) - len(targets) - 1
          assert len(after) == expected_after_count, (len(before), len(after), expected_after_count)

          for name in targets:
              assert name not in after
          assert cleanup not in after
          for name in (
              'B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml',
              'B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml',
              'B34D-package-trade-evidence-future-structural-maturity-monitor.yml',
              'B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml',
              'B41C3-player-role-engine-v2-untouched-week4-scorer-confirmation.yml',
              'B41H-player-role-engine-v2-frozen-one-shot-2025-holdout-evaluator.yml',
              'scheduled-data-refresh.yml',
              'sync-sleeper.yml',
              'repo-regression-checks.yml',
          ):
              assert name in after, name

          manifest = {
              'schema_version': 1,
              'cleanup_id': '2026-10-03-post-b41-freeze',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'active_workflow_count_before': len(before),
              'active_workflow_count_after': len(after),
              'archived_completed_or_superseded_count': len(targets),
              'cleanup_self_archived': True,
              'archived': archived,
              'protected_key_workflows': [
                  'B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml',
                  'B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml',
                  'B34D-package-trade-evidence-future-structural-maturity-monitor.yml',
                  'B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml',
                  'B41C3-player-role-engine-v2-untouched-week4-scorer-confirmation.yml',
                  'B41H-player-role-engine-v2-frozen-one-shot-2025-holdout-evaluator.yml',
                  'scheduled-data-refresh.yml',
                  'sync-sleeper.yml',
                  'repo-regression-checks.yml',
              ],
              'b41_2025_holdout_opened_by_cleanup': False,
              'production_math_changed': False,
              'production_values_changed': False,
          }
          mp = M/'workflow_cleanup_2026_10_03_post_b41_freeze.json'
          mp.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          print(f'PASS: archived {len(targets)} completed/superseded workflows.')
          print('PASS: cleanup workflow self-archived.')
          print(f'PASS: active workflows {len(before)} -> {len(after)}.')
          PY

      - name: Validate post-cleanup active workflows and production invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          W = Path('.github/workflows')
          for path in sorted(W.iterdir()):
              if path.is_file() and path.suffix in {'.yml', '.yaml'}:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
          print('PASS: every remaining active workflow parses as YAML.')
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No workflow cleanup changes to commit."
          else
            git commit -m "Archive completed workflows after B41 freeze"
            git push origin HEAD:main
          fi

      - name: Closeout
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW CLEANUP: GREEN"
          echo "ARCHIVED COMPLETED/SUPERSEDED WORKFLOWS: 15"
          echo "B41C3 ACTIVE: true"
          echo "B41H ACTIVE: true"
          echo "2025 HOLDOUT OPENED: false"
          echo "PRODUCTION MATH CHANGED: false"
          echo "PRODUCTION VALUES CHANGED: false"
          echo "CLEANUP WORKFLOW SELF-ARCHIVED: true"
