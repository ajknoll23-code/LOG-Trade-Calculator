name: Opportunity V2 Phase 1 Coverage Audit

# Research-only audit of continuous historical opportunity / role evidence.
# This workflow does NOT change index.html, ROLE_MULT, Production V2,
# Market Value, or any deployed player value.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Phase 1 self-test
        run: python3 research/opportunity-v2/opportunity_v2_phase1_coverage_audit.py --selftest

      - name: Build opportunity coverage audit
        run: python3 research/opportunity-v2/opportunity_v2_phase1_coverage_audit.py --write

      - name: Verify Phase 1 guardrails and outputs
        run: python3 research/opportunity-v2/opportunity_v2_phase1_coverage_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/opportunity-v2/opportunity_v2_phase1_coverage_audit.json
          git add research/opportunity-v2/opportunity_v2_phase1_coverage_audit.md
          git diff --staged --quiet || git commit -m "Add Opportunity V2 Phase 1 coverage audit"
          git push
