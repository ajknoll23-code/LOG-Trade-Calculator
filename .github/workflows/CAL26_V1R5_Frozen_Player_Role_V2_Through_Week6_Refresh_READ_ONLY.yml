name: CAL26 V1R5 - Frozen Role V2 Weeks 5 and 6 Refresh READ ONLY

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r5-week6-replay-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  week6_frozen_role_replay:
    name: Recompute frozen Role V2 from 2026 Weeks 1-6; reconcile 565 players; no writes
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout live repository read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact frozen B41J B42 numerical runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install B42 snapshot pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'requests>=2.32,<3' 'numpy==2.5.3' 'pandas==2.3.3' 'scipy==1.18.1'
          python - <<'PY_RUNTIME'
          import importlib.metadata as md
          for pkg,expected in [('numpy','2.5.3'),('pandas','2.3.3'),('scipy','1.18.1')]:
              assert md.version(pkg)==expected,(pkg,md.version(pkg),expected)
          print('Frozen B41J / B42 runtime pins verified')
          PY_RUNTIME

      - name: Retrieve actual green V1R3R1 565 player bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r3r1-baseline"
          gh run download 39640157223 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R3R1-Frozen-Role-V2-565-Bridge-READ-ONLY \
            --dir "$RUNNER_TEMP/cal26-v1r3r1-baseline"
          python - <<'PY_SOURCE'
          import hashlib,os,pathlib,csv
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'cal26-v1r3r1-baseline'/'CAL26_V1R3_565_Player_Role_V2_Bridge.csv'
          expected='dee90725bc7238e47d1a07dc744452f79d83482a5525b5b5c64c6d6623bf7b69'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected,'Green 565 bridge source SHA changed'
          with p.open(newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==565 and sum(r['protect_accepted_fv']=='True' for r in rows)==18
          print('Exact V1R3R1 green 565/18-control source verified')
          PY_SOURCE

      - name: Create isolated fixed Week6 input-cutoff adapter for the unmodified frozen B42 evaluator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_ADAPTER'
          from pathlib import Path
          import hashlib,json,os
          root=Path('research/player-role-v2')
          original=root/'player_role_v2_b42_v4_owner_blind_parity_evaluator.py'
          proto=json.loads((root/'player_role_v2_b42_v4_protocol_freeze.json').read_text())
          parity=json.loads((root/'player_role_v2_b42_v4_implementation_parity.json').read_text())
          assert parity['exact_parity']['pass'] is True
          src=original.read_bytes()
          assert hashlib.sha256(src).hexdigest()==proto['evaluator_sha256'], 'Frozen evaluator SHA drift'
          text=src.decode('utf-8')
          old='    latest_completed_week = progress - 1'
          new='    latest_completed_week = min(6, progress - 1)'
          assert text.count(old)==1,'B42 cutoff adapter cannot locate unique line'
          text=text.replace(old,new,1)
          tmp=Path(os.environ['RUNNER_TEMP'])/'cal26_v1r5_b42_week6_evaluator_copy.py'
          tmp.write_text(text,encoding='utf-8')
          compile(text,str(tmp),'exec')
          # This one-line temporary input horizon cap does not change frozen B41F models,
          # thresholds, current model inference, or any repo file.
          print('Week6 input-cutoff adapter created outside repository:',tmp)
          print('Frozen SHA:',proto['evaluator_sha256'])
          print('Temporary adapter SHA:',hashlib.sha256(tmp.read_bytes()).hexdigest())
          PY_ADAPTER
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Refresh source weeks 1 through 6 with frozen B42 engine; no fantasy roster read
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/cal26_v1r5_b42_week6_evaluator_copy.py" \
            --mode shadow --repo . \
            --out "$RUNNER_TEMP/cal26-v1r5-week6-raw" \
            --protocol-commit "$(python - <<'PY_COMMIT'
          import json
          d=json.load(open('research/player-role-v2/player_role_v2_b42_v4_shadow_refresh_witness.json'))
          print(d['protocol_freeze_commit'])
          PY_COMMIT
          )" \
            --parity-commit "$(python - <<'PY_PARITY'
          import json
          d=json.load(open('research/player-role-v2/player_role_v2_b42_v4_shadow_refresh_witness.json'))
          print(d['implementation_parity_commit'])
          PY_PARITY
          )"
          test -s "$RUNNER_TEMP/cal26-v1r5-week6-raw/player_role_v2_b42_v4_shadow_refresh_witness.json"
          test -s "$RUNNER_TEMP/cal26-v1r5-week6-raw/player_role_v2_b42_v4_shadow_refresh.csv"
          test -s "$RUNNER_TEMP/cal26-v1r5-week6-raw/player_role_v2_b42_v4_role_eligibility.csv"

      - name: Materialize CAL26 Week6 comparison and test locally against synthetic inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r5_week6_bridge.py" <<'PY_CAL26_V1R5'
          #!/usr/bin/env python3
          """CAL26 V1R5: 2026 through-Week-6 frozen Role V2 continuation, read only.

          Consumes exact green CAL26 V1R3R1 565-player source and B42 V4
          shadow evaluator rerun with a fixed week-six input cutoff. No role
          model coefficients, thresholds, quote/FV values, or production files change.
          """
          from __future__ import annotations
          import argparse, csv, json, hashlib, re, unicodedata
          from collections import Counter, defaultdict
          from pathlib import Path

          ROLES = ['Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite']
          POSITIONS = {'QB','RB','WR','TE','DL','LB','DB','K'}
          BASE_NAME = 'CAL26_V1R3_565_Player_Role_V2_Bridge.csv'
          BASE_SHA = 'dee90725bc7238e47d1a07dc744452f79d83482a5525b5b5c64c6d6623bf7b69'
          SOURCE_BASE = 'research/player-role-v2'

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def loadcsv(path):
              with Path(path).open(encoding='utf-8',newline='') as f:
                  return list(csv.DictReader(f))

          def writecsv(path, rows, columns):
              with Path(path).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction='ignore')
                  w.writeheader()
                  w.writerows(rows)

          def check(cond, msg):
              if not cond:
                  raise AssertionError('CAL26_V1R5_INTEGRITY: '+msg)

          def key(value):
              value=''.join(x for x in unicodedata.normalize('NFKD',str(value or ''))
                            if not unicodedata.combining(x)).casefold()
              toks=re.findall(r'[a-z0-9]+',value)
              while toks and toks[-1] in ('jr','sr','ii','iii','iv','v'): toks.pop()
              result=[]; i=0
              while i<len(toks):
                  if len(toks[i])==1 and toks[i].isalpha():
                      j=i
                      while j<len(toks) and len(toks[j])==1 and toks[j].isalpha(): j+=1
                      if j-i>=2:
                          result.append(''.join(toks[i:j]));i=j;continue
                  result.append(toks[i]);i+=1
              return ' '.join(result)

          def boolfield(v):
              return str(v).strip().lower() in ('true','1')

          def score_rows(baseline, shadow, identity, synthetic=False):
              check(len(baseline)==565 and len(set(r['player'] for r in baseline))==565,
                    'Frozen CAL26 baseline not 565 unique')
              check(len(shadow)>0 and len(identity)>0,'Week6 shadow/identity empty')
              bysid={};bygsis={}
              for s in shadow:
                  sid,gsis,pos = s['sleeper_id'],s['gsis_id'],s['position']
                  check(sid not in bysid and gsis not in bygsis,'Duplicate Week6 model identity')
                  check(pos in POSITIONS and s['role_tier'] in ROLES,'Unsupported frozen tier or position')
                  check(int(s['tier_index'])==ROLES.index(s['role_tier']), 'Week6 tier index mismatch')
                  check(int(s['origin_week'])==6, 'Week6 model includes non-Week6 origin')
                  bysid[sid]=s;bygsis[gsis]=s
              byname=defaultdict(list)
              for i in identity:
                  if not boolfield(i['identity_mapped']) or not i['sleeper_id']:
                      continue
                  target=bygsis.get(i['gsis_id'])
                  if target is None or target['sleeper_id']!=i['sleeper_id']:
                      continue
                  if i['position']!=target['position']:
                      continue
                  k=(key(i['player_name']),i['position'])
                  if k[0]:byname[k].append(target)
              results=[];stats=Counter();position_stats=defaultdict(Counter)
              accepted=[]
              for source in baseline:
                  r=dict(source);pos=r['position'];old=r['cal26_role_original']
                  check(pos in POSITIONS and old in ROLES,'Invalid baseline role/position')
                  was_matched=bool(r['matched_frozen_model_role'])
                  prior=r['matched_frozen_model_role'] if was_matched else ''
                  if was_matched:
                      check(prior in ROLES and int(r['b42_snapshot_origin_week'])==4,'Invalid frozen week4 provenance')
                  candidate=None
                  method=''
                  sid=str(r.get('sleeper_id') or '').strip();gsis=str(r.get('gsis_id') or '').strip()
                  if sid and gsis:
                      s=bysid.get(sid)
                      if s is not None and s['gsis_id']==gsis and s['position']==pos:
                          candidate=s;method='EXACT_PRIOR_SLEEPER_GSIS'
                  if candidate is None:
                      options=byname.get((key(r['player']),pos),[])
                      uniq={(s['gsis_id'],s['sleeper_id']) for s in options}
                      if len(uniq)==1 and len(options)==1:
                          s=options[0]
                          # A past mapped identity must not silently switch players.
                          if not was_matched or (sid==s['sleeper_id'] and gsis==s['gsis_id']):
                              candidate=s;method='UNIQUE_NAME_POSITION_CROSSWALK_VERIFIED'
                  newrole=candidate['role_tier'] if candidate else ''
                  newshift=ROLES.index(newrole)-ROLES.index(old) if candidate else 0
                  if candidate is None:
                      action='NO_WEEK6_MATCH_RETAIN_OLD_ROLE'
                      effective=old;stats['no_week6_match']+=1
                  elif newshift<0:
                      action='WEEK6_DOWNGRADE_HELD'
                      effective=old;stats['downgrade_held']+=1
                  elif newshift>0:
                      action='WEEK6_LARGE_UPGRADE_REVIEW' if newshift>=3 else 'WEEK6_STANDARD_UPGRADE'
                      effective=newrole;stats['upgrades']+=1
                      if newshift>=3: stats['large_upgrades']+=1
                  else:
                      action='WEEK6_MATCHED_UNCHANGED'
                      effective=old;stats['matched_unchanged']+=1
                  if candidate:
                      stats['week6_matched']+=1
                      if not was_matched: stats['new_from_week4_unmatched']+=1
                  if was_matched and not candidate:stats['lost_since_week4']+=1
                  if prior and newrole:
                      if prior==newrole:stats['same_week4_week6_tier']+=1
                      else:stats['week4_week6_tier_changed']+=1
                  position_stats[pos][action]+=1
                  r.update({
                      'week4_model_tier': prior,
                      'week6_model_tier': newrole,
                      'week4_week6_tier_change': (
                          ROLES.index(newrole)-ROLES.index(prior) if prior and newrole else ''),
                      'week6_vs_current_tier_change':newshift if candidate else '',
                      'week6_id_join_method':method or 'NO_VERIFIED_WEEK6_IDENTITY',
                      'week6_sleeper_id':candidate['sleeper_id'] if candidate else '',
                      'week6_gsis_id':candidate['gsis_id'] if candidate else '',
                      'week6_model_score':candidate['model_score'] if candidate else '',
                      'week6_prior_active_games':candidate['prior_active_games'] if candidate else '',
                      'week6_missing_feature_count':candidate['frozen_feature_missing_count_before_imputation'] if candidate else '',
                      'week6_role_decision':action,
                      'week6_partial_release_candidate_role':effective,
                      'week6_role_research_only':'True',
                      'production_changed':'False',
                  })
                  check(r['current_fv_unchanged']==source['current_fv_unchanged']
                        and r['cal26_proposed_fv_unchanged']==source['cal26_proposed_fv_unchanged'],
                        'FV changed')
                  results.append(r)
                  if boolfield(r['protect_accepted_fv']): accepted.append(r)
              check(len(results)==565 and len(accepted)==18,'565 population or 18 accepted controls')
              check(sum(x['cal26_proposal_available']=='True' for x in results)==80,
                    'Reviewed CAL26 proposals changed')
              check(stats['week6_matched']+stats['no_week6_match']==565,'Population accounting')
              check(stats['upgrades']+stats['downgrade_held']+stats['matched_unchanged']+stats['no_week6_match']==565,
                    'Role movement accounting')
              for label in ('week6_matched','no_week6_match','downgrade_held','upgrades','large_upgrades','matched_unchanged','new_from_week4_unmatched','lost_since_week4','same_week4_week6_tier','week4_week6_tier_changed'):
                  stats[label]+=0
              return results,dict(stats),{p:dict(s) for p,s in sorted(position_stats.items())}

          def run(source, week6, out, repo, synthetic=False):
              source,week6,out,repo=map(Path,(source,week6,out,repo))
              out.mkdir(parents=True,exist_ok=True)
              base=source/BASE_NAME
              check(base.exists(),'Green V1R3R1 bridge CSV missing')
              if not synthetic: check(sha(base)==BASE_SHA,'Green bridge CSV SHA drift')
              baseline=loadcsv(base)
              shadowfile=week6/'player_role_v2_b42_v4_shadow_refresh.csv'
              identityfile=week6/'player_role_v2_b42_v4_role_eligibility.csv'
              witnessfile=week6/'player_role_v2_b42_v4_shadow_refresh_witness.json'
              for f in (shadowfile,identityfile,witnessfile):check(f.exists(),'Missing Week6 file '+f.name)
              witness=json.loads(witnessfile.read_text(encoding='utf-8'))
              check(witness['latest_completed_week']==6,'Expected precisely Week 6')
              check(witness['shadow_refresh_sha256']==sha(shadowfile),'Week6 role source SHA mismatch')
              check(witness['role_eligibility_sha256']==sha(identityfile),'Week6 name bridge SHA mismatch')
              check(witness['implementation_parity_exact_pass'] is True,'Frozen B41J parity failed')
              check(witness['future_target_used'] is False and witness['model_or_tier_retuning_performed'] is False,
                    'Evidence/model changed')
              check(witness['role_inference_used_owner_identity'] is False
                    and witness['role_inference_used_dynasty_team'] is False
                    and witness['role_inference_used_fantasy_roster_slot'] is False,
                    'Owner context contaminated inference')
              if not synthetic:
                  for source_name in ('weekly_stats','snap_counts'):
                      entry=witness['current_sources'][source_name]
                      check(int(entry['latest_completed_week_included'])==6,
                            'Current source has wrong max week '+source_name)
                  check('6' in witness['current_sources']['sleeper_completed_week_stats_sha256'],
                        'Missing Sleeper Week6 stats provenance')
                  frozen=repo/SOURCE_BASE/'player_role_v2_b42_v4_protocol_freeze.json'
                  proto=json.loads(frozen.read_text())
                  check(proto['evaluator_sha256']==witness['evaluator_sha256'],
                        'Frozen evaluator/protocol drift')
              rows,stats,bypos=score_rows(baseline,loadcsv(shadowfile),loadcsv(identityfile),synthetic)
              fields=list(rows[0].keys())
              writecsv(out/'CAL26_V1R5_565_Week6_Role_Comparison.csv',rows,fields)
              writecsv(out/'CAL26_V1R5_Week6_Upgrades.csv',[r for r in rows if r['week6_role_decision'].startswith('WEEK6_') and 'UPGRADE' in r['week6_role_decision']],fields)
              writecsv(out/'CAL26_V1R5_Week6_Downgrades_Held.csv',[r for r in rows if r['week6_role_decision']=='WEEK6_DOWNGRADE_HELD'],fields)
              writecsv(out/'CAL26_V1R5_Week6_Unmatched.csv',[r for r in rows if r['week6_role_decision']=='NO_WEEK6_MATCH_RETAIN_OLD_ROLE'],fields)
              writecsv(out/'CAL26_V1R5_Week4_to_Week6_Changed_Tiers.csv',[r for r in rows if r['week4_model_tier'] and r['week6_model_tier'] and r['week4_model_tier']!=r['week6_model_tier']],fields)
              man={
                  'stage':'CAL26_V1R5_WEEK6_FROZEN_ROLE_V2_REPLAY',
                  'status':'PASS_WEEK6_READ_ONLY_ROLE_REFRESH',
                  'as_of_completed_week':6,
                  'included_regular_season_weeks':[1,2,3,4,5,6],
                  'week4_comparator_run_id':39640157223,
                  'model_frozen':True,'model_retuned':False,
                  'week6_witness_sha256':sha(witnessfile),
                  'week6_shadow_sha256':sha(shadowfile),
                  'week6_eligibility_sha256':sha(identityfile),
                  'source_565_sha256':sha(base),
                  'player_count':565,
                  'reviewed_cal26_fv_proposals_retained':80,
                  'owner_accepted_fv_proposals_protected':18,
                  'production_files_modified':0,
                  'production_valuation_change_authorized':False,
                  'production_role_change_authorized':False,
                  'counts':stats,
                  'by_position':bypos,
              }
              (out/'CAL26_V1R5_Manifest.json').write_text(json.dumps(man,sort_keys=True,indent=2)+'\n')
              lines=['# CAL26 V1R5 — Week 6 Player Role V2 Refresh','',
                     '**Status:** Read-only role candidate; frozen coefficients and thresholds unchanged; no production FV/role updates.','',
                     'Input horizon: **2026 regular-season Weeks 1–6**, expanding the B42 frozen Week 4 model inputs with Weeks 5 and 6.','',
                     f"Week 6 exact matches: **{stats['week6_matched']} / 565**.",
                     f"Newly matched from prior Week 4 unmatched group: **{stats['new_from_week4_unmatched']}**.",
                     f"Previously matched but lacking a Week 6 match: **{stats['lost_since_week4']}**.",
                     f"Week 6 role upgrades vs legacy baseline: **{stats['upgrades']}**; large jumps flagged: **{stats['large_upgrades']}**.",
                     f"Week 6 downgrades held: **{stats['downgrade_held']}**; unmatched retained: **{stats['no_week6_match']}**.",
                     f"Week 4 to Week 6 matched-model tier changes: **{stats['week4_week6_tier_changed']}**.",
                     '', '## Focus players', '',
                     '| Player | Legacy | Week 4 V2 | Week 6 V2 | Week 6 release-review action |',
                     '|---|---|---|---|---|']
              for p in ('justin jefferson','cj stroud','marvin harrison','matthew golden','brian branch','drake maye','justin herbert','bo nix','saquon barkley','george kittle'):
                  found=next((r for r in rows if r['player']==p),None)
                  if found:
                      lines.append(f"| {p.title()} | {found['cal26_role_original']} | {found['week4_model_tier'] or '—'} | {found['week6_model_tier'] or '—'} | {found['week6_role_decision']} |")
              lines+=['','This is a fresh Week 6 replay of frozen B42-style inference, not a reversal of the historical B42 owner-blind parity scientific STOP. Its role outputs are candidate inputs for a separately evaluated FV/quote/MV shadow; they are not dynasty talent grades and do not imply numeric FV increments.','']
              (out/'CAL26_V1R5_Week6_Review.md').write_text('\n'.join(lines),encoding='utf-8')
              print(json.dumps(man,indent=2)[:7000])
              return man

          def synthetic_test(source,out):
              """Fixture derived from the real green baseline, with synthetic Week6 model tiers."""
              source=Path(source);out=Path(out)
              baseline=loadcsv(source/BASE_NAME)
              identity=[];shadow=[]
              for i,r in enumerate(x for x in baseline if x['matched_frozen_model_role']):
                  sid=r['sleeper_id'];gsis=r['gsis_id']
                  pos=r['position'];tier=r['matched_frozen_model_role']
                  shadow.append(dict(sleeper_id=sid,gsis_id=gsis,position=pos,origin_week='6',
                      tier_index=str(ROLES.index(tier)),role_tier=tier,model_score='0.5',
                      prior_active_games='6',frozen_feature_missing_count_before_imputation='0'))
                  identity.append(dict(sleeper_id=sid,gsis_id=gsis,position=pos,
                      identity_mapped='True',player_name=r['player']))
              # Demonstrate a newly eligible Week6-only identity (formerly unmatched Brian Branch).
              brian=next(r for r in baseline if r['player']=='brian branch')
              shadow.append(dict(sleeper_id='synthetic-sid-brian',gsis_id='synthetic-gsis-brian',
                                 position='DB',origin_week='6',tier_index='5',role_tier='Every-Down',
                                 model_score='0.72',prior_active_games='6',
                                 frozen_feature_missing_count_before_imputation='0'))
              identity.append(dict(sleeper_id='synthetic-sid-brian',gsis_id='synthetic-gsis-brian',
                                   position='DB',identity_mapped='True',player_name=brian['player']))
              # Force two changed roles in fixture, including one negative as a held downgrade.
              for s in shadow:
                  if s['sleeper_id']=='6794':
                      s['role_tier']='Every-Down';s['tier_index']='5'
                  if s['sleeper_id']=='9758':
                      s['role_tier']='Elite';s['tier_index']='6'
              week=out/'fixture_week6';week.mkdir(parents=True,exist_ok=True)
              writecsv(week/'player_role_v2_b42_v4_shadow_refresh.csv',shadow,list(shadow[0]))
              writecsv(week/'player_role_v2_b42_v4_role_eligibility.csv',identity,list(identity[0]))
              witness=dict(latest_completed_week=6,
                  shadow_refresh_sha256=sha(week/'player_role_v2_b42_v4_shadow_refresh.csv'),
                  role_eligibility_sha256=sha(week/'player_role_v2_b42_v4_role_eligibility.csv'),
                  implementation_parity_exact_pass=True,future_target_used=False,
                  model_or_tier_retuning_performed=False,role_inference_used_owner_identity=False,
                  role_inference_used_dynasty_team=False,role_inference_used_fantasy_roster_slot=False)
              (week/'player_role_v2_b42_v4_shadow_refresh_witness.json').write_text(json.dumps(witness))
              m=run(source,week,out/'synthetic_preview',Path('.'),synthetic=True)
              check(m['counts']['week6_matched']==422,'Expected fixture 422 matches')
              check(m['counts']['new_from_week4_unmatched']==1,'New Week6 identity was not recovered')
              check(m['owner_accepted_fv_proposals_protected']==18,'Accepted prices lost')
              result=loadcsv(out/'synthetic_preview'/'CAL26_V1R5_565_Week6_Role_Comparison.csv')
              if any(r['player']=='justin jefferson' for r in result):
                  check(next(r for r in result if r['player']=='justin jefferson')['week6_model_tier']=='Every-Down','Fixture tier refresh failed')
              # Tampering with the model tier source must invalidate the recorded evidence digest.
              data=(week/'player_role_v2_b42_v4_shadow_refresh.csv').read_bytes()
              with (week/'player_role_v2_b42_v4_shadow_refresh.csv').open('ab') as f: f.write(b'\\nTAMPER')
              try:
                  try:
                      run(source,week,out/'must_fail_tamper',Path('.'),synthetic=True)
                      raise AssertionError('Shadow evidence tampering was not rejected')
                  except AssertionError as exc:
                      check('Week6 role source SHA mismatch' in str(exc),'Wrong tamper failure')
              finally:
                  (week/'player_role_v2_b42_v4_shadow_refresh.csv').write_bytes(data)
              print('CAL26 V1R5 synthetic Week6, new identity, controls, and tamper tests PASS')

          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--baseline',required=True)
              p.add_argument('--week6')
              p.add_argument('--out',required=True)
              p.add_argument('--repo',default='.')
              p.add_argument('--test',action='store_true')
              a=p.parse_args()
              if a.test:synthetic_test(a.baseline,a.out)
              else:
                  if not a.week6:p.error('--week6 required')
