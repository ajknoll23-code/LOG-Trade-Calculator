name: Draft Pick FV V8.1 - Phase 1.6 Holdout Rookie-Only Scope Hardening

"on":
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: draft-pick-fv-v8-1-phase1-6-holdout-rookie-only-scope-hardening
  cancel-in-progress: false

jobs:
  rookie_only_scope_hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Guard Phase 1.5 stop and untouched H2 holdout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")
          p=json.loads((d/"v8_1_carryforward_preregistration.json").read_text())
          s1=json.loads((d/"v8_1_phase1_sparse_tail_sensitivity.json").read_text())
          s15=json.loads((d/"v8_1_phase1_5_holdout_source_scope_correction.json").read_text())
          m15=json.loads((d/"v8_1_phase1_5_holdout_source_scope_correction_manifest.json").read_text())
          src=json.loads((d/"v8_1_phase1_5_holdout_source_identity.json").read_text())

          assert p["frozen_primary_candidate"]["k"]==0.3557942893
          assert p["phase2_2024_h2_independent_confirmation"]["open_exactly_once"] is True
          assert p["evidence_status"]["2024_rookie_holdout_outcomes_read"] is False

          assert s1["decision"]=="PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE"
          assert s1["2024_H2_outcome_open_authorized_next_stage"] is True
          assert s1["2024_holdout_rookie_outcomes_read"] is False

          assert s15["decision"]=="STOP_V8_1_PHASE1_5_HOLDOUT_SOURCE_SCOPE_INSUFFICIENT"
          assert s15["h2_open_authorized_next_stage"] is False
          assert s15["firewalls"]["2024_rookie_outcomes_read"] is False
          assert s15["firewalls"]["2025_rookie_outcomes_read"] is False
          assert s15["firewalls"]["new_2024_search_used"] is False
          assert s15["firewalls"]["replacement_or_substitution_used"] is False
          assert s15["firewalls"]["candidate_refit_performed"] is False

          assert m15["corrected_source_gate_pass"] is False
          assert m15["h2_open_authorized_next_stage"] is False
          assert m15["2024_rookie_outcomes_read"] is False

          assert src["original_frozen_full72_league_n"]==10
          assert src["selected_clean_full72_league_n"]==10
          assert src["corrected_source_gate_pass"] is False
          assert src["2024_rookie_outcomes_read"] is False
          assert src["2025_rookie_outcomes_read"] is False
          assert len(src["clean_leagues"])==10

          # Failed Phase 2 never reached its H2 job and therefore must not have
          # committed any Phase 2 holdout outcome/result artifact.
          for f in (
              "v8_1_phase2_2024_h2_scored_occurrences.jsonl",
              "v8_1_phase2_2024_h2_confirmation.json",
              "v8_1_phase2_2024_h2_confirmation_manifest.json",
          ):
              assert not (d/f).exists(), f

          print("PASS: Phase 1.5 is a source-only stop; H2 remains completely unopened.")
          PY

      - name: Apply frozen rookie-only league-name scope rule
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v8-1"

          for f in \
            "$D/v8_1_phase1_6_rookie_only_scope_amendment.json" \
            "$D/v8_1_phase1_6_rookie_only_scope_amendment.md" \
            "$D/v8_1_phase1_6_holdout_source_identity.json" \
            "$D/v8_1_phase1_6_holdout_rookie_only_scope_hardening.json" \
            "$D/v8_1_phase1_6_holdout_rookie_only_scope_hardening.md" \
            "$D/v8_1_phase1_6_holdout_rookie_only_scope_hardening_manifest.json"
          do
            test ! -e "$f" || {
              echo "ERROR: Phase 1.6 output already exists: $f"
              exit 1
            }
          done

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import re
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          D=Path("research/draft-pick-fv-v8-1")
          src_path=D/"v8_1_phase1_5_holdout_source_identity.json"
          src=json.loads(src_path.read_text())
          generated=datetime.now(timezone.utc).isoformat()

          CELLS=tuple(
              f"r{r}_{t}"
              for r in range(1,7)
              for t in ("early","mid","late")
          )
          MIN_COV=.95
          MIN_LEAGUES=8

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def write_json(path,obj):
              path.write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")

          def normalized_tokens(name):
              s=str(name or "").lower()
              s=s.replace("’","'").replace("`","'")
              s=re.sub(r"[^a-z0-9]+"," ",s)
              return tuple(x for x in s.split() if x)

          # This rule is frozen in the workflow itself and is intentionally
          # independent of player outcomes, candidate scores, and gate results.
          def is_explicit_devy_league(league):
              return "devy" in normalized_tokens(league.get("league_name"))

          amendment_decision="FREEZE_V8_1_PHASE1_6_PREOUTCOME_ROOKIE_ONLY_LEAGUE_NAME_SCOPE_RULE"
          amendment={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-1-global-scale-sparse-tail-holdout-confirmation",
              "stage":"phase1_6_preoutcome_rookie_only_scope_amendment",
              "status":"FROZEN_BEFORE_PHASE1_6_REWEIGHT_AND_GATE",
              "generated_at_utc":generated,
              "decision":amendment_decision,
              "reason":"Phase 1.5 showed that the exact ten frozen full-72 leagues fail the pre-outcome source/identity gate. Review of frozen league metadata also shows the original V6/V7 source classifier did not operationalize the already-required rookie-only scope at the league-name level.",
              "scientific_status":"pre-outcome source-scope amendment informed only by already-frozen source and identity metadata; no rookie performance outcome is read",
              "frozen_rule":{
                  "population":"the exact same ten already-frozen 2024 full-72 leagues only",
                  "normalization":"lowercase frozen league_name, normalize apostrophes, replace non-alphanumeric runs with spaces, split into tokens",
                  "exclude_if":"normalized frozen league_name contains the exact token 'devy'",
                  "new_2024_search_allowed":False,
                  "replacement_or_substitution_allowed":False,
                  "manual_league_id_exclusions_allowed":False,
                  "minimum_retained_leagues":MIN_LEAGUES,
              },
              "post_rule_gates":[
                  "retained league count >=8",
                  "every one of 18 cells occurrence retention >=95%",
                  "every one of 18 cells represented-league retention >=95%",
                  "every one of 18 cells resolved identity coverage >=95%",
                  "every one of 18 cells Sleeper-ready coverage >=95%",
                  "overall identity coverage >=95%",
                  "overall Sleeper-ready coverage >=95%",
                  "all retained rows remain from the original exact-ten frozen source",
              ],
              "candidate_parameter_k":0.3557942893,
              "candidate_refit_allowed":False,
              "2024_rookie_outcomes_read":False,
              "2025_rookie_outcomes_read":False,
              "production_change_authorized":False,
          }
          amend_path=D/"v8_1_phase1_6_rookie_only_scope_amendment.json"
          write_json(amend_path,amendment)
          amend_md=D/"v8_1_phase1_6_rookie_only_scope_amendment.md"
          amend_md.write_text(
              "# Draft Pick FV V8.1 — Phase 1.6 Rookie-Only Scope Amendment\n\n"
              f"**Decision:** `{amendment_decision}`\n\n"
              "Before any 2024/2025 rookie outcome access, apply one uniform source rule to the "
              "exact ten frozen full-72 holdout leagues: normalize the already-frozen league name "
              "and exclude the league iff the exact token `devy` is present. No league ID is named "
              "in the rule, no new league may be searched or substituted, and at least eight frozen "
              "leagues must remain. The candidate stays frozen at k = 0.3557942893.\n"
          )

          leagues=list(src["clean_leagues"])
          rows=list(src["occurrences"])
          original_ids={str(x["league_id"]) for x in leagues}
          assert len(leagues)==10 and len(original_ids)==10

          excluded=[x for x in leagues if is_explicit_devy_league(x)]
          kept=[x for x in leagues if not is_explicit_devy_league(x)]
          kept_ids={str(x["league_id"]) for x in kept}
          excluded_ids={str(x["league_id"]) for x in excluded}

          # No rule may introduce a league not already in the exact-ten source.
          assert kept_ids | excluded_ids == original_ids
          assert not (kept_ids & excluded_ids)

          kept_rows=[dict(x) for x in rows if str(x["league_id"]) in kept_ids]

          # Recompute the frozen holdout weights after the deterministic source
          # exclusion. Equal league total weight within each cell and equal
          # occurrence weight within league-cell, plus equal source-year weight.
          expected_league_n=len(kept)
          valid_lgc=Counter()
          valid_lgy=Counter()
          represented_cell=defaultdict(set)
          represented_year=set()

          for r in kept_rows:
              lid=str(r["league_id"])
              cell=r["cell"]
              valid_lgc[(lid,cell)]+=1
              valid_lgy[lid]+=1
              represented_cell[cell].add(lid)
              represented_year.add(lid)

          for r in kept_rows:
              lid=str(r["league_id"])
              cell=r["cell"]
              nrepr=len(represented_cell[cell])
              nlc=valid_lgc[(lid,cell)]
              nry=len(represented_year)
              nly=valid_lgy[lid]
              assert min(nrepr,nlc,nry,nly)>0
              r["cell_weight_v8_1_holdout"] = 1.0 / nrepr / nlc
              r["source_weight_v8_1_holdout"] = 1.0 / nry / nly

          cell_diag={}
          retention_gate=True
          identity_gate=True
          sleeper_gate=True

          for cell in CELLS:
              rs=[r for r in kept_rows if r["cell"]==cell]
              expected=expected_league_n*4
              retained=len(rs)
              represented=len({str(r["league_id"]) for r in rs})
              ident=sum(bool(r["identity_resolved"]) for r in rs)
              sleeper=sum(bool(r["outcome_ready_sleeper_id"]) for r in rs)

              retention=retained/expected if expected else 0.0
              represented_fraction=represented/expected_league_n if expected_league_n else 0.0
              identity=ident/retained if retained else 0.0
              sleeper_cov=sleeper/retained if retained else 0.0

              cell_diag[f"2024:{cell}"]={
                  "draft_year":2024,
                  "cell":cell,
                  "frozen_league_n":expected_league_n,
                  "expected_occurrence_n":expected,
                  "retained_occurrence_n":retained,
                  "retention_fraction":retention,
                  "represented_league_n":represented,
                  "represented_league_fraction":represented_fraction,
                  "identity_resolved_n":ident,
                  "identity_coverage":identity,
                  "sleeper_ready_n":sleeper,
                  "sleeper_ready_coverage":sleeper_cov,
              }
              retention_gate = (
                  retention_gate
                  and retention>=MIN_COV
                  and represented_fraction>=MIN_COV
              )
              identity_gate = identity_gate and identity>=MIN_COV
              sleeper_gate = sleeper_gate and sleeper_cov>=MIN_COV

          overall_identity=(
              sum(bool(r["identity_resolved"]) for r in kept_rows)/len(kept_rows)
              if kept_rows else 0.0
          )
          overall_sleeper=(
              sum(bool(r["outcome_ready_sleeper_id"]) for r in kept_rows)/len(kept_rows)
              if kept_rows else 0.0
          )
          identity_gate = identity_gate and overall_identity>=MIN_COV
          sleeper_gate = sleeper_gate and overall_sleeper>=MIN_COV

          # Exact weight normalization.
          for cell in CELLS:
              total=sum(
                  float(r["cell_weight_v8_1_holdout"])
                  for r in kept_rows if r["cell"]==cell
              )
              assert math.isclose(total,1.0,rel_tol=0.0,abs_tol=1e-12),(cell,total)
          total_source=sum(float(r["source_weight_v8_1_holdout"]) for r in kept_rows)
          assert math.isclose(total_source,1.0,rel_tol=0.0,abs_tol=1e-12),total_source

          pass_gate=(
              len(kept)>=MIN_LEAGUES
              and retention_gate
              and identity_gate
              and sleeper_gate
          )

          decision=(
              "PASS_V8_1_PHASE1_6_ROOKIE_ONLY_SCOPE_HARDENING_H2_AUTHORIZED"
              if pass_gate else
              "STOP_V8_1_PHASE1_6_ROOKIE_ONLY_SCOPE_HARDENING"
          )

          source_out={
              "schema_version":1,
              "study_id":amendment["study_id"],
              "stage":"phase1_6_holdout_source_identity_freeze",
              "status":"HOLDOUT_SOURCE_HARDENING_PASS" if pass_gate else "HOLDOUT_SOURCE_HARDENING_STOP",
              "generated_at_utc":generated,
              "decision":decision,
              "research_only":True,
              "original_exact_ten_league_ids":sorted(original_ids,key=int),
              "league_name_rule":"normalized frozen league_name contains exact token devy",
              "excluded_leagues":[
                  {
                      "league_id":str(x["league_id"]),
                      "league_name":x.get("league_name"),
                      "normalized_tokens":list(normalized_tokens(x.get("league_name"))),
                      "exclusion_reason":"explicit_devy_token_in_frozen_league_name",
                  }
                  for x in sorted(excluded,key=lambda y:int(y["league_id"]))
              ],
              "selected_league_ids":sorted(kept_ids,key=int),
              "selected_clean_full72_league_n":len(kept),
              "minimum_clean_full72_leagues":MIN_LEAGUES,
              "retained_occurrence_n":len(kept_rows),
              "expected_raw_occurrence_n":len(kept)*72,
              "diagnostics":{
                  "retention_gate_pass":retention_gate,
                  "identity_gate_pass":identity_gate,
                  "sleeper_gate_pass":sleeper_gate,
                  "overall_identity_coverage":overall_identity,
                  "overall_sleeper_ready_coverage":overall_sleeper,
                  "cell_year":cell_diag,
                  "weight_normalization_proved":True,
              },
              "corrected_source_gate_pass":pass_gate,
              "new_2024_search_used":False,
              "replacement_or_substitution_used":False,
              "manual_league_id_exclusion_used":False,
              "2024_rookie_outcomes_read":False,
              "2025_rookie_outcomes_read":False,
              "candidate_fit_performed":False,
              "candidate_parameter_changed":False,
              "market_or_ktc_values_read":False,
              "package_vote_data_read":False,
              "production_change_authorized":False,
              "clean_leagues":sorted(kept,key=lambda y:int(y["league_id"])),
              "occurrences":sorted(
                  kept_rows,
                  key=lambda y:(int(y["league_id"]),int(y["overall_slot"]))
              ),
          }
          source_out_path=D/"v8_1_phase1_6_holdout_source_identity.json"
          write_json(source_out_path,source_out)

          result={
              "schema_version":1,
              "study_id":amendment["study_id"],
              "stage":"phase1_6_holdout_rookie_only_scope_hardening",
              "status":source_out["status"],
              "generated_at_utc":generated,
              "decision":decision,
              "research_only":True,
              "amendment_decision":amendment_decision,
              "original_frozen_full72_league_n":10,
              "excluded_explicit_devy_league_n":len(excluded),
              "excluded_explicit_devy_leagues":[
                  {
                      "league_id":str(x["league_id"]),
                      "league_name":x.get("league_name"),
                  }
                  for x in sorted(excluded,key=lambda y:int(y["league_id"]))
              ],
              "selected_clean_full72_league_n":len(kept),
              "selected_league_ids":sorted(kept_ids,key=int),
              "minimum_required":MIN_LEAGUES,
              "retained_occurrence_n":len(kept_rows),
              "expected_raw_occurrence_n":len(kept)*72,
              "retention_gate_pass":retention_gate,
              "identity_gate_pass":identity_gate,
              "sleeper_gate_pass":sleeper_gate,
              "overall_identity_coverage":overall_identity,
              "overall_sleeper_ready_coverage":overall_sleeper,
              "failing_cells":{
                  k:v for k,v in cell_diag.items()
                  if (
                      v["retention_fraction"]<MIN_COV
                      or v["represented_league_fraction"]<MIN_COV
                      or v["identity_coverage"]<MIN_COV
                      or v["sleeper_ready_coverage"]<MIN_COV
                  )
              },
              "source_gate_pass":pass_gate,
              "firewalls":{
                  "new_2024_search_used":False,
                  "replacement_or_substitution_used":False,
                  "manual_league_id_exclusion_used":False,
                  "2024_rookie_outcomes_read":False,
                  "2025_rookie_outcomes_read":False,
                  "candidate_refit_performed":False,
                  "candidate_parameter_changed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "production_change_authorized":False,
              },
              "h2_open_authorized_next_stage":pass_gate,
              "next_stage":(
                  "draft-pick-fv-v8-1-phase2-2024-h2-independent-confirmation-v2"
                  if pass_gate else None
              ),
          }
          result_path=D/"v8_1_phase1_6_holdout_rookie_only_scope_hardening.json"
          write_json(result_path,result)

          md_path=D/"v8_1_phase1_6_holdout_rookie_only_scope_hardening.md"
          md_path.write_text(
              "# Draft Pick FV V8.1 — Phase 1.6 Holdout Rookie-Only Scope Hardening\n\n"
              f"**Decision:** `{decision}`\n\n"
              f"- Exact frozen full-72 leagues entering rule: **10**\n"
              f"- Explicit `devy` league-name exclusions: **{len(excluded)}**\n"
              f"- Retained frozen leagues: **{len(kept)}** (minimum {MIN_LEAGUES})\n"
              f"- Retained occurrences: **{len(kept_rows)} / {len(kept)*72}**\n"
              f"- 18-cell retention gate: **{'PASS' if retention_gate else 'FAIL'}**\n"
              f"- 18-cell identity gate: **{'PASS' if identity_gate else 'FAIL'}**\n"
              f"- 18-cell Sleeper-ready gate: **{'PASS' if sleeper_gate else 'FAIL'}**\n"
              f"- Overall identity coverage: **{overall_identity:.2%}**\n"
              f"- Overall Sleeper-ready coverage: **{overall_sleeper:.2%}**\n"
              f"- Failing cells: **{len(result['failing_cells'])}**\n\n"
              "No 2024/2025 rookie outcome data, candidate refit, market/KTC data, package votes, "
              "new 2024 search, replacement source, or production value was used.\n"
          )

          manifest={
              "schema_version":1,
              "study_id":amendment["study_id"],
              "stage":"phase1_6_holdout_rookie_only_scope_hardening_manifest",
              "status":result["status"],
              "generated_at_utc":generated,
              "decision":decision,
              "amendment_sha256":sha(amend_path),
              "amendment_markdown_sha256":sha(amend_md),
              "source_identity_sha256":sha(source_out_path),
              "result_sha256":sha(result_path),
              "markdown_sha256":sha(md_path),
              "selected_clean_full72_league_n":len(kept),
              "source_gate_pass":pass_gate,
              "h2_open_authorized_next_stage":pass_gate,
              "2024_rookie_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":result["next_stage"],
          }
          man_path=D/"v8_1_phase1_6_holdout_rookie_only_scope_hardening_manifest.json"
          write_json(man_path,manifest)

          print("DECISION="+decision)
          print("EXCLUDED="+",".join(
              f"{x['league_id']}:{x.get('league_name')}" for x in
              sorted(excluded,key=lambda y:int(y["league_id"]))
          ))
          print("SELECTED="+",".join(sorted(kept_ids,key=int)))
          print(f"SELECTED_N={len(kept)}")
          print(f"RETAINED={len(kept_rows)}/{len(kept)*72}")
          print(f"IDENTITY={overall_identity:.6f}")
          print(f"SLEEPER={overall_sleeper:.6f}")
          print(f"FAILING_CELLS={len(result['failing_cells'])}")
          print("H2_AUTHORIZED="+str(pass_gate).lower())
          print("2024_ROOKIE_OUTCOMES_READ=false")
          PY

      - name: Independently validate Phase 1.6 result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          D=Path("research/draft-pick-fv-v8-1")
          a=json.loads((D/"v8_1_phase1_6_rookie_only_scope_amendment.json").read_text())
          s=json.loads((D/"v8_1_phase1_6_holdout_source_identity.json").read_text())
          r=json.loads((D/"v8_1_phase1_6_holdout_rookie_only_scope_hardening.json").read_text())
          m=json.loads((D/"v8_1_phase1_6_holdout_rookie_only_scope_hardening_manifest.json").read_text())

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          assert a["decision"]=="FREEZE_V8_1_PHASE1_6_PREOUTCOME_ROOKIE_ONLY_LEAGUE_NAME_SCOPE_RULE"
          assert a["frozen_rule"]["exclude_if"]=="normalized frozen league_name contains the exact token 'devy'"
          assert a["frozen_rule"]["manual_league_id_exclusions_allowed"] is False
          assert a["2024_rookie_outcomes_read"] is False

          allowed={
              "PASS_V8_1_PHASE1_6_ROOKIE_ONLY_SCOPE_HARDENING_H2_AUTHORIZED",
              "STOP_V8_1_PHASE1_6_ROOKIE_ONLY_SCOPE_HARDENING",
          }
          assert r["decision"] in allowed
          assert s["decision"]==r["decision"]==m["decision"]

          assert s["new_2024_search_used"] is False
          assert s["replacement_or_substitution_used"] is False
          assert s["manual_league_id_exclusion_used"] is False
          assert s["2024_rookie_outcomes_read"] is False
          assert s["2025_rookie_outcomes_read"] is False
          assert s["candidate_fit_performed"] is False
          assert s["candidate_parameter_changed"] is False
          assert s["production_change_authorized"] is False

          original=set(s["original_exact_ten_league_ids"])
          selected=set(s["selected_league_ids"])
          excluded={str(x["league_id"]) for x in s["excluded_leagues"]}
          assert selected | excluded == original
          assert not (selected & excluded)

          for x in s["excluded_leagues"]:
              assert "devy" in x["normalized_tokens"]
              assert x["exclusion_reason"]=="explicit_devy_token_in_frozen_league_name"

          passed=bool(s["corrected_source_gate_pass"])
          assert passed==bool(r["source_gate_pass"])
          assert passed==bool(r["h2_open_authorized_next_stage"])
          assert passed==bool(m["h2_open_authorized_next_stage"])

          d=s["diagnostics"]
          if passed:
              assert s["selected_clean_full72_league_n"]>=8
              assert d["retention_gate_pass"] is True
              assert d["identity_gate_pass"] is True
              assert d["sleeper_gate_pass"] is True
              assert d["overall_identity_coverage"]>=.95
              assert d["overall_sleeper_ready_coverage"]>=.95
              assert len(r["failing_cells"])==0

          # Weight normalization of frozen corrected source.
          for cell in {x["cell"] for x in s["occurrences"]}:
              total=sum(
                  float(x["cell_weight_v8_1_holdout"])
                  for x in s["occurrences"] if x["cell"]==cell
              )
