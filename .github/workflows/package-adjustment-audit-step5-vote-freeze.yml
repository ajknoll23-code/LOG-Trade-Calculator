name: Package Adjustment Audit Step 5 Vote Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Freeze pre-launch vote evidence and separate post-launch rows
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import shutil

          ROOT = Path(".")
          LIVE = ROOT / "research/package-adjustment-production-candidate-v1/live_deployment.json"
          PLAN = ROOT / "research/package-adjustment-production-candidate-v1/audit_clean_plan.md"
          RELEASE = ROOT / "research/package-adjustment-production-candidate-v1/prospective/release_manifest.json"

          V3_DIR = ROOT / "research/package-adjustment-v3"
          V4_DIR = ROOT / "research/package-adjustment-v4"
          SHADOW_DIR = ROOT / "research/package-adjustment-shadow-v2"

          V3_PIPE = ROOT / "scripts/market/package_vote_v3_pipeline.py"
          V4_PIPE = ROOT / "scripts/market/package_vote_v4_pipeline.py"
          SHADOW_BUILDER = ROOT / "scripts/market/build_package_adjustment_shadow_v2.py"
          PHASE_HELPER = ROOT / "scripts/market/package_vote_phase.py"

          FREEZE_DIR = ROOT / "research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze"
          MANIFEST = FREEZE_DIR / "manifest.json"
          MANIFEST_MD = FREEZE_DIR / "manifest.md"

          source_files = {
              "v3_challenges": V3_DIR / "package_vote_challenges_v3.json",
              "v3_results_json": V3_DIR / "package_vote_v3_results.json",
              "v3_results_md": V3_DIR / "package_vote_v3_results.md",
              "v3_diagnostics_json": V3_DIR / "package_vote_v3_fit_diagnostics.json",
              "v3_diagnostics_md": V3_DIR / "package_vote_v3_fit_diagnostics.md",
              "v4_challenges": V4_DIR / "package_vote_challenges_v4.json",
              "v4_results_json": V4_DIR / "package_vote_v4_results.json",
              "v4_results_md": V4_DIR / "package_vote_v4_results.md",
              "v4_diagnostics_json": V4_DIR / "package_vote_v4_fit_diagnostics.json",
              "v4_diagnostics_md": V4_DIR / "package_vote_v4_fit_diagnostics.md",
              "shadow_v2_json": SHADOW_DIR / "package_adjustment_shadow_v2.json",
              "shadow_v2_md": SHADOW_DIR / "package_adjustment_shadow_v2.md",
          }

          for p in (LIVE, PLAN, RELEASE, V3_PIPE, V4_PIPE, SHADOW_BUILDER, *source_files.values()):
              if not p.exists():
                  raise RuntimeError(f"Required file missing: {p}")

          if MANIFEST.exists():
              raise RuntimeError(
                  "Step 5 pre-launch freeze manifest already exists. "
                  "Do not re-freeze calibration evidence."
              )

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def parse_iso(value):
              s = str(value or "").strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              dt = datetime.fromisoformat(s)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          live = read_json(LIVE)
          release = read_json(RELEASE)
          v3_results = read_json(source_files["v3_results_json"])
          v4_results = read_json(source_files["v4_results_json"])
          v3_diag = read_json(source_files["v3_diagnostics_json"])
          v4_diag = read_json(source_files["v4_diagnostics_json"])
          v3_catalog = read_json(source_files["v3_challenges"])
          v4_catalog = read_json(source_files["v4_challenges"])

          if live.get("status") != "controlled_live":
              raise RuntimeError("Package Adjustment is not controlled_live")
          if live.get("production_formula_enabled") is not True:
              raise RuntimeError("Package Adjustment production formula is not enabled")
          if release.get("frozen") is not True:
              raise RuntimeError("Step 4 exact-live release manifest is not frozen")
          if release.get("production_revision_at_release") != "v1.4-audit-step4-exact-live-oos-monitoring":
              raise RuntimeError("Unexpected Step 4 release revision")

          launch_utc = str(live.get("deployed_at_utc") or "")
          if not launch_utc:
              raise RuntimeError("live_deployment.json missing deployed_at_utc")
          launch_dt = parse_iso(launch_utc)
          launch_ms = int(launch_dt.timestamp() * 1000)

          # The canonical results used for calibration must be from before launch.
          v3_generated = parse_iso(v3_results["generated_at_utc"])
          v4_generated = parse_iso(v4_results["generated_at_utc"])
          if not v3_generated < launch_dt:
              raise RuntimeError(
                  f"V3 result is not pre-launch: {v3_generated.isoformat()} >= {launch_dt.isoformat()}"
              )
          if not v4_generated < launch_dt:
              raise RuntimeError(
                  f"V4 result is not pre-launch: {v4_generated.isoformat()} >= {launch_dt.isoformat()}"
              )

          if v3_results.get("summary", {}).get("raw_vote_count") != 300:
              raise RuntimeError("Expected frozen V3 calibration result to contain 300 counted votes")
          if v4_results.get("summary", {}).get("raw_vote_count") != 300:
              raise RuntimeError("Expected frozen V4 calibration result to contain 300 counted votes")
          if v3_diag.get("data", {}).get("counted_votes") != 300:
              raise RuntimeError("V3 diagnostics do not match the 300-vote pre-launch result")
          if v4_diag.get("data", {}).get("counted_votes") != 300:
              raise RuntimeError("V4 diagnostics do not match the 300-vote pre-launch result")

          if v3_diag.get("diagnostic_gates", {}).get("all_passed") is not True:
              raise RuntimeError("V3 diagnostic gates are not all passed")
          if v4_diag.get("diagnostic_gates", {}).get("all_passed") is not True:
              raise RuntimeError("V4 diagnostic gates are not all passed")
          if v3_catalog.get("frozen") is not True or v3_catalog.get("status") != "frozen_package_preference_v3":
              raise RuntimeError("V3 catalog is not frozen")
          if v4_catalog.get("frozen") is not True or v4_catalog.get("status") != "frozen_package_preference_v4":
              raise RuntimeError("V4 catalog is not frozen")

          FREEZE_DIR.mkdir(parents=True, exist_ok=False)

          frozen_files = {}
          snapshot_names = {
              "v3_challenges": "v3_package_vote_challenges_prelaunch.json",
              "v3_results_json": "v3_package_vote_results_prelaunch.json",
              "v3_results_md": "v3_package_vote_results_prelaunch.md",
              "v3_diagnostics_json": "v3_package_vote_fit_diagnostics_prelaunch.json",
              "v3_diagnostics_md": "v3_package_vote_fit_diagnostics_prelaunch.md",
              "v4_challenges": "v4_package_vote_challenges_prelaunch.json",
              "v4_results_json": "v4_package_vote_results_prelaunch.json",
              "v4_results_md": "v4_package_vote_results_prelaunch.md",
              "v4_diagnostics_json": "v4_package_vote_fit_diagnostics_prelaunch.json",
              "v4_diagnostics_md": "v4_package_vote_fit_diagnostics_prelaunch.md",
              "shadow_v2_json": "shadow_v2_prelaunch.json",
              "shadow_v2_md": "shadow_v2_prelaunch.md",
          }

          for key, src in source_files.items():
              dest = FREEZE_DIR / snapshot_names[key]
              shutil.copyfile(src, dest)
              src_hash = sha256(src)
              dest_hash = sha256(dest)
              if src_hash != dest_hash:
                  raise RuntimeError(f"Byte-for-byte freeze copy failed for {key}")
              frozen_files[key] = {
                  "source_path": str(src),
                  "snapshot_path": str(dest),
                  "sha256": dest_hash,
                  "byte_count": dest.stat().st_size,
              }

          created = datetime.now(timezone.utc).isoformat()
          manifest = {
              "schema_version": 1,
              "status": "package_adjustment_prelaunch_vote_evidence_freeze",
              "frozen": True,
              "created_at_utc": created,
              "production_launch_cutoff_utc": launch_dt.isoformat(),
              "production_launch_cutoff_epoch_ms": launch_ms,
              "exact_live_release_id": release["release_id"],
              "exact_live_formula_sha256": release["exact_live_formula_sha256"],
              "phase_policy": {
                  "prelaunch": (
                      "Rows at or before the production launch cutoff belong only to "
                      "the frozen calibration evidence and are never merged with "
                      "post-launch vote analysis."
                  ),
                  "postlaunch": (
                      "Rows strictly after the production launch cutoff may be "
                      "aggregated as research-only post-launch evidence."
                  ),
                  "daily_cap_partition_order": (
                      "Partition by launch cutoff before applying each version's "
                      "per-voter daily cap, so pre-launch rows cannot consume "
                      "post-launch daily-cap allowance."
                  ),
                  "production_change_from_postlaunch_votes": "never automatic",
              },
              "prelaunch_evidence": {
                  "v3": {
                      "counted_votes": 300,
                      "result_generated_at_utc": v3_results["generated_at_utc"],
                      "result_generated_before_launch": True,
                      "diagnostic_count_matches_result": True,
                      "catalog_frozen": True,
                      "results_snapshot": frozen_files["v3_results_json"]["snapshot_path"],
                      "diagnostics_snapshot": frozen_files["v3_diagnostics_json"]["snapshot_path"],
                      "catalog_snapshot": frozen_files["v3_challenges"]["snapshot_path"],
                  },
                  "v4": {
                      "counted_votes": 300,
                      "result_generated_at_utc": v4_results["generated_at_utc"],
                      "result_generated_before_launch": True,
                      "diagnostic_count_matches_result": True,
                      "catalog_frozen": True,
                      "results_snapshot": frozen_files["v4_results_json"]["snapshot_path"],
                      "diagnostics_snapshot": frozen_files["v4_diagnostics_json"]["snapshot_path"],
                      "catalog_snapshot": frozen_files["v4_challenges"]["snapshot_path"],
                  },
              },
              "derived_calibration_snapshot": {
                  "shadow_v2_snapshot": frozen_files["shadow_v2_json"]["snapshot_path"],
                  "future_rebuild_from_postlaunch_votes_allowed": False,
              },
              "frozen_files": frozen_files,
          }

          MANIFEST.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest_hash = sha256(MANIFEST)

          md = [
              "# Package Adjustment Step 5 — Pre-Launch Vote Evidence Freeze",
              "",
              f"Created: {created}",
              "",
              "## Production launch cutoff",
              "",
              f"**{launch_dt.isoformat()}**",
              "",
              "Votes at or before this timestamp are calibration evidence. Votes strictly",
              "after it are post-launch research evidence. The two phases must never be",
              "merged into one calibration dataset.",
              "",
              "## Frozen calibration evidence",
              "",
              "- V3: **300 counted votes**, canonical result generated before production launch.",
              "- V4: **300 counted votes**, canonical result generated before production launch.",
              "- V3 and V4 challenge catalogs, results, fit diagnostics, and the derived",
              "  Shadow V2 candidate were copied byte-for-byte and SHA256-pinned.",
              f"- Freeze manifest SHA256: `{manifest_hash}`",
              "",
              "## Post-launch policy",
              "",
              "- V3/V4 aggregators partition rows by the production launch cutoff **before**",
              "  applying the daily voter cap.",
              "- Canonical aggregation output after Step 5 is post-launch-only research.",
              "- Frozen pre-launch snapshots are never rewritten by those aggregators.",
              "- Shadow V2 is not rebuilt from post-launch vote results.",
              "- Post-launch votes can trigger future human research review only; they never",
              "  modify the live Package Adjustment automatically.",
              "",
              "## Audit state",
              "",
              "Step 5 is complete. The next gate is **Step 6 — Unsupported-shape UI + scope guards + IDP consistency**.",
              "",
          ]
          MANIFEST_MD.write_text("\n".join(md), encoding="utf-8")

          # Write a reusable, manifest-pinned phase partition helper.
          helper_lines = [
              "#!/usr/bin/env python3",
              "from __future__ import annotations",
              "",
              "import hashlib",
              "import json",
              "from datetime import datetime, timezone",
              "from pathlib import Path",
              "",
              "ROOT = Path(__file__).resolve().parents[2]",
              "MANIFEST = ROOT / 'research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze/manifest.json'",
              f"EXPECTED_MANIFEST_SHA256 = '{manifest_hash}'",
              "",
              "def sha256(path):",
              "    return hashlib.sha256(path.read_bytes()).hexdigest()",
              "",
              "def parse_timestamp_utc(value):",
              "    s = str(value or '').strip()",
              "    if not s:",
              "        return None",
              "    if s.endswith('Z'):",
              "        s = s[:-1] + '+00:00'",
              "    try:",
              "        dt = datetime.fromisoformat(s)",
              "    except ValueError:",
              "        return None",
              "    if dt.tzinfo is None:",
              "        dt = dt.replace(tzinfo=timezone.utc)",
              "    return dt.astimezone(timezone.utc)",
              "",
              "def load_and_verify_manifest():",
              "    if not MANIFEST.exists():",
              "        return None",
              "    actual = sha256(MANIFEST)",
              "    if actual != EXPECTED_MANIFEST_SHA256:",
              "        raise RuntimeError(",
              "            f'Pre-launch vote freeze manifest drift: {actual} != {EXPECTED_MANIFEST_SHA256}'",
              "        )",
              "    doc = json.loads(MANIFEST.read_text(encoding='utf-8'))",
              "    if doc.get('status') != 'package_adjustment_prelaunch_vote_evidence_freeze':",
              "        raise RuntimeError('Unexpected pre-launch vote freeze manifest status')",
              "    if doc.get('frozen') is not True:",
              "        raise RuntimeError('Pre-launch vote freeze manifest is not frozen')",
              "    for key, row in (doc.get('frozen_files') or {}).items():",
              "        p = ROOT / row['snapshot_path']",
              "        if not p.exists():",
              "            raise RuntimeError(f'Missing frozen pre-launch snapshot: {key} {p}')",
              "        actual_file = sha256(p)",
              "        if actual_file != row['sha256']:",
              "            raise RuntimeError(",
              "                f'Frozen pre-launch snapshot drift for {key}: '",
              "                f'{actual_file} != {row[\"sha256\"]}'",
              "            )",
              "    return doc",
              "",
              "def partition_rows(rows, version):",
              "    doc = load_and_verify_manifest()",
              "    if doc is None:",
              "        return {",
              "            'vote_phase': 'legacy_unpartitioned',",
              "            'postlaunch_rows': list(rows),",
              "            'prelaunch_rows_excluded': 0,",
              "            'invalid_timestamp_rows_excluded': 0,",
              "            'prelaunch_cutoff_utc': None,",
              "            'prelaunch_cutoff_epoch_ms': None,",
              "            'canonical_prelaunch_snapshot': None,",
              "        }",
              "    version = str(version).lower()",
              "    if version not in {'v3', 'v4'}:",
              "        raise ValueError(f'Unsupported package vote version: {version}')",
              "    cutoff = parse_timestamp_utc(doc['production_launch_cutoff_utc'])",
              "    if cutoff is None:",
              "        raise RuntimeError('Invalid production launch cutoff timestamp')",
              "    post = []",
              "    pre = 0",
              "    invalid = 0",
              "    for row in rows:",
              "        ts = parse_timestamp_utc(row.get('timestamp'))",
              "        if ts is None:",
              "            invalid += 1",
              "            continue",
              "        if ts <= cutoff:",
              "            pre += 1",
              "            continue",
              "        post.append(row)",
              "    evidence = doc['prelaunch_evidence'][version]",
              "    return {",
              "        'vote_phase': 'postlaunch_only',",
              "        'postlaunch_rows': post,",
              "        'prelaunch_rows_excluded': pre,",
              "        'invalid_timestamp_rows_excluded': invalid,",
              "        'prelaunch_cutoff_utc': doc['production_launch_cutoff_utc'],",
              "        'prelaunch_cutoff_epoch_ms': int(doc['production_launch_cutoff_epoch_ms']),",
              "        'canonical_prelaunch_snapshot': evidence['results_snapshot'],",
              "    }",
              "",
          ]
          PHASE_HELPER.write_text("\n".join(helper_lines), encoding="utf-8")

          def patch_vote_pipeline(path, version, is_func):
              text = path.read_text(encoding="utf-8")
              if "import package_vote_phase" in text:
                  raise RuntimeError(f"{path}: phase partition already installed")
              if "import ktc_pipeline\n" not in text:
                  raise RuntimeError(f"{path}: ktc_pipeline import marker missing")
              text = text.replace(
                  "import ktc_pipeline\n",
                  "import ktc_pipeline\nimport package_vote_phase\n",
                  1,
              )

              old_raw = "\n".join([
                  f"    raw = [parse_row(r) for r in fetch_rows() if {is_func}(r)]",
                  "    raw = [r for r in raw if r is not None]",
                  "    capped, dropped = apply_daily_cap(raw)",
                  "    summary = summarize(capped, doc)",
              ])
              new_raw = "\n".join([
                  f"    raw = [parse_row(r) for r in fetch_rows() if {is_func}(r)]",
                  "    raw = [r for r in raw if r is not None]",
                  f"    phase = package_vote_phase.partition_rows(raw, '{version}')",
                  "    source_raw_package_rows = len(raw)",
                  "    raw = phase['postlaunch_rows']",
                  "    capped, dropped = apply_daily_cap(raw)",
                  "    summary = summarize(capped, doc)",
              ])
              if old_raw not in text:
                  raise RuntimeError(f"{path}: expected raw aggregation block not found")
              text = text.replace(old_raw, new_raw, 1)

              old_field = '        "raw_package_rows": len(raw),\n'
              new_fields = "\n".join([
                  '        "vote_phase": phase["vote_phase"],',
                  '        "prelaunch_evidence_excluded": phase["vote_phase"] == "postlaunch_only",',
                  '        "prelaunch_cutoff_utc": phase["prelaunch_cutoff_utc"],',
                  '        "prelaunch_cutoff_epoch_ms": phase["prelaunch_cutoff_epoch_ms"],',
                  '        "canonical_prelaunch_snapshot": phase["canonical_prelaunch_snapshot"],',
                  '        "source_raw_package_rows": source_raw_package_rows,',
                  '        "prelaunch_rows_excluded": phase["prelaunch_rows_excluded"],',
                  '        "invalid_timestamp_rows_excluded": phase["invalid_timestamp_rows_excluded"],',
                  '        "raw_package_rows": len(raw),',
                  "",
              ])
              if old_field not in text:
                  raise RuntimeError(f"{path}: expected raw_package_rows result field not found")
              text = text.replace(old_field, new_fields, 1)

              path.write_text(text, encoding="utf-8")

          patch_vote_pipeline(V3_PIPE, "v3", "is_package_v3_row")
          patch_vote_pipeline(V4_PIPE, "v4", "is_package_v4_row")

          # Prevent the historical Shadow V2 candidate from being rebuilt from
          # post-launch-only votes. Self-test remains available.
          shadow = SHADOW_BUILDER.read_text(encoding="utf-8")
          const_marker = 'OUT_MD = OUT_DIR / "package_adjustment_shadow_v2.md"\n'
          freeze_const = (
              'PRELAUNCH_VOTE_FREEZE = ROOT / '
              '"research/package-adjustment-production-candidate-v1/'
              'prelaunch-vote-freeze/manifest.json"\n'
          )
          if "PRELAUNCH_VOTE_FREEZE" in shadow:
              raise RuntimeError("Shadow V2 freeze guard already exists")
          if const_marker not in shadow:
              raise RuntimeError("Shadow V2 output marker not found")
          shadow = shadow.replace(const_marker, const_marker + freeze_const, 1)

          old_main = "\n".join([
              "def main():",
              '    if "--selftest" in sys.argv:',
              "        selftest()",
              "        return",
              "    payload = build_payload()",
          ])
          new_main = "\n".join([
              "def main():",
              '    if "--selftest" in sys.argv:',
              "        selftest()",
              "        return",
              "    if PRELAUNCH_VOTE_FREEZE.exists():",
              "        freeze = read_json(PRELAUNCH_VOTE_FREEZE)",
              "        if freeze.get('status') != 'package_adjustment_prelaunch_vote_evidence_freeze':",
              "            raise RuntimeError('Unexpected pre-launch vote freeze status')",
              "        if freeze.get('frozen') is not True:",
              "            raise RuntimeError('Pre-launch vote freeze is not frozen')",
              "        print(",
              "            'Pre-launch Package Adjustment calibration is frozen; '",
              "            'Shadow V2 rebuild from post-launch vote evidence is disabled.'",
              "        )",
              "        return",
              "    payload = build_payload()",
          ])
          if old_main not in shadow:
              raise RuntimeError("Shadow V2 main block not found")
          shadow = shadow.replace(old_main, new_main, 1)
          SHADOW_BUILDER.write_text(shadow, encoding="utf-8")

          # Mark Step 5 complete without touching the exact live formula.
          plan = PLAN.read_text(encoding="utf-8")
          old_plan = "- [ ] Step 5 — Freeze pre-launch V3/V4 evidence / separate post-launch votes"
          new_plan = "\n".join([
              "- [x] Step 5 — Freeze pre-launch V3/V4 evidence / separate post-launch votes",
              "  - The 300-vote V3 and 300-vote V4 calibration datasets are frozen byte-for-byte.",
              "  - Production launch time is the hard pre-launch/post-launch vote boundary.",
              "  - V3/V4 aggregators partition before daily caps and report post-launch-only evidence.",
              "  - Historical Shadow V2 cannot be rebuilt from post-launch vote results.",
          ])
          if old_plan not in plan:
              raise RuntimeError("Expected unchecked Step 5 plan entry not found")
          plan = plan.replace(old_plan, new_plan, 1)
          PLAN.write_text(plan, encoding="utf-8")

          print("Step 5 vote evidence freeze installed.")
          print("Production launch cutoff:", launch_dt.isoformat())
          print("V3 frozen votes: 300")
          print("V4 frozen votes: 300")
          print("Manifest SHA256:", manifest_hash)
          print("Next gate: Step 6 — Unsupported-shape UI + scope guards + IDP consistency")
          PY

      - name: Validate freeze manifest and exact copies
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          ROOT = Path(".")
          base = ROOT / "research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze"
          manifest_path = base / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest["status"] == "package_adjustment_prelaunch_vote_evidence_freeze"
          assert manifest["frozen"] is True
          assert manifest["prelaunch_evidence"]["v3"]["counted_votes"] == 300
          assert manifest["prelaunch_evidence"]["v4"]["counted_votes"] == 300

          for key, row in manifest["frozen_files"].items():
              src = ROOT / row["source_path"]
              snap = ROOT / row["snapshot_path"]
              assert snap.exists(), (key, snap)
              snap_hash = hashlib.sha256(snap.read_bytes()).hexdigest()
              assert snap_hash == row["sha256"], (key, snap_hash, row["sha256"])
              # At installation time the originals must still match their snapshots.
              assert src.read_bytes() == snap.read_bytes(), key

          sys.path.insert(0, str(ROOT / "scripts/market"))
          import package_vote_phase

          verified = package_vote_phase.load_and_verify_manifest()
          assert verified["frozen"] is True

          from datetime import timedelta

          cutoff = verified["production_launch_cutoff_utc"]
          cutoff_dt = package_vote_phase.parse_timestamp_utc(cutoff)
          assert cutoff_dt is not None
          fake = [
              {"timestamp": cutoff_dt.isoformat(), "id": "at_cutoff"},
              {"timestamp": (cutoff_dt - timedelta(microseconds=1)).isoformat(), "id": "before"},
              {"timestamp": (cutoff_dt + timedelta(microseconds=1)).isoformat(), "id": "after"},
              {"timestamp": "", "id": "invalid"},
          ]
          part = package_vote_phase.partition_rows(fake, "v4")
          assert part["vote_phase"] == "postlaunch_only"
          assert [r["id"] for r in part["postlaunch_rows"]] == ["after"]
          assert part["prelaunch_rows_excluded"] == 2
          assert part["invalid_timestamp_rows_excluded"] == 1
          assert part["prelaunch_cutoff_utc"] == cutoff

          print("Pre-launch freeze hashes verified.")
          print("Partition boundary self-test passed.")
          PY

      - name: Self-test patched vote pipelines
        run: |
          python scripts/market/package_vote_v3_pipeline.py --selftest
          python scripts/market/package_vote_v4_pipeline.py --selftest
          python scripts/market/build_package_adjustment_shadow_v2.py --selftest

      - name: Verify Shadow V2 normal rebuild is frozen
        run: |
          before_json="$(sha256sum research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json | awk '{print $1}')"
          before_md="$(sha256sum research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.md | awk '{print $1}')"

          python scripts/market/build_package_adjustment_shadow_v2.py

          after_json="$(sha256sum research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json | awk '{print $1}')"
          after_md="$(sha256sum research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.md | awk '{print $1}')"

          test "$before_json" = "$after_json"
          test "$before_md" = "$after_md"

      - name: Protect live formula and frozen source catalogs
        run: |
          git diff --exit-code -- \
            index.html \
            research/package-adjustment-production-candidate-v1/live_deployment.json \
            research/package-adjustment-production-candidate-v1/prospective/release_manifest.json \
            research/package-adjustment-v3/package_vote_challenges_v3.json \
            research/package-adjustment-v4/package_vote_challenges_v4.json

      - name: Run repository regression checks
        run: |
          python scripts/validation/repo_regression_checks.py

      - name: Show Step 5 summary
        run: |
          cat research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze/manifest.md
          echo
          git diff --check
          git status --short

      - name: Commit Step 5 vote freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/market/package_vote_phase.py \
            scripts/market/package_vote_v3_pipeline.py \
            scripts/market/package_vote_v4_pipeline.py \
            scripts/market/build_package_adjustment_shadow_v2.py \
            research/package-adjustment-production-candidate-v1/audit_clean_plan.md \
            research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze/

          if git diff --cached --quiet; then
            echo "No Step 5 changes to commit."
            exit 0
          fi

          git commit -m "Freeze prelaunch Package Adjustment vote evidence"
          git pull --rebase origin main
          git push origin HEAD:main
