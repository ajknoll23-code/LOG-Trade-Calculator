name: B10G Package Adjustment V9 - Prospective Pseudonym Salt Continuity Amendment V1

'on':
  workflow_dispatch:
    inputs:
      salt_commitment_sha256:
        description: 'SHA256 of the new private salt string for slots 2-40; do not enter the salt itself'
        required: true
        type: string
      operator_attestation:
        description: 'Confirm no human vote choices were inspected and the private salt is kept off GitHub'
        required: true
        type: choice
        options:
          - I_CONFIRM_NO_HUMAN_CHOICES_READ_AND_PRIVATE_SALT_KEPT_OFF_GITHUB

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b10e-distribution-log
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SALT_COMMITMENT_INPUT: ${{ inputs.salt_commitment_sha256 }}
      OPERATOR_ATTESTATION: ${{ inputs.operator_attestation }}
      DISTRIBUTION_LOG: research/package-adjustment-v9/b10d-p6-final-launch-checklist/distribution_log.csv
      B10E_WORKFLOW: .github/workflows/B10E-package-adjustment-v9-voter-url-issuance-and-distribution-logger-v2-stdlib-squat-resilience-repair.yml
      B10F_RECORD: research/package-adjustment-v9/b10f-ux-latency-preview-amendment-v1/b10f_ux_latency_preview_amendment_v1.json
      OUT_DIR: research/package-adjustment-v9/b10g-pseudonym-salt-continuity-amendment-v1
      EXPECTED_B10E_SHA256: 5879a810cd008eb710caf1ce5cb5f86c4924ecf6d0fc590ef6bbd7ac41e22cd4
      LEGACY_SLOT1_PSEUDONYM: a8c7cccfabf74c651c1a0c3fa6c518144221b64bc2e579420ff85062b7234cf3

    steps:
      - name: Checkout durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate prospective amendment point
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || {
            echo 'B10G_DIRTY_CHECKOUT'
            git status --short
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, io, json, os, re

          commitment = os.environ['SALT_COMMITMENT_INPUT'].strip()
          attestation = os.environ['OPERATOR_ATTESTATION']

          if not re.fullmatch(r'[0-9a-f]{64}', commitment):
              raise RuntimeError('B10G_SALT_COMMITMENT_MUST_BE_64_LOWERCASE_HEX')
          if attestation != 'I_CONFIRM_NO_HUMAN_CHOICES_READ_AND_PRIVATE_SALT_KEPT_OFF_GITHUB':
              raise RuntimeError('B10G_OPERATOR_ATTESTATION_MISSING')

          log_path = Path(os.environ['DISTRIBUTION_LOG'])
          b10e_path = Path(os.environ['B10E_WORKFLOW'])
          b10f_path = Path(os.environ['B10F_RECORD'])
          for p in [log_path, b10e_path, b10f_path]:
              if not p.exists():
                  raise RuntimeError(f'B10G_MISSING_REQUIRED_FILE {p}')

          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          if sha(b10e_path) != os.environ['EXPECTED_B10E_SHA256']:
              raise RuntimeError(f'B10G_B10E_SHA_DRIFT {sha(b10e_path)}')

          b10f = json.loads(b10f_path.read_text())
          if b10f.get('decision') != 'PASS_B10F_PROSPECTIVE_PRESENTATION_ONLY_LATENCY_AMENDMENT':
              raise RuntimeError('B10G_B10F_NOT_GREEN')
          if b10f.get('human_outcomes_read') is not False:
              raise RuntimeError('B10G_B10F_OUTCOME_BLIND_GUARD_FAILED')
          if b10f.get('production_v9_activation_authorized') is not False:
              raise RuntimeError('B10G_B10F_PRODUCTION_GUARD_FAILED')

          expected_header = ['slot','utc_sent','recipient_pseudonym_sha256','is_replacement']
          reader = csv.DictReader(io.StringIO(log_path.read_text()))
          if reader.fieldnames != expected_header:
              raise RuntimeError('B10G_DISTRIBUTION_LOG_SCHEMA_DRIFT')
          rows = list(reader)

          if len(rows) != 1:
              raise RuntimeError(f'B10G_EXPECTED_EXACTLY_ONE_ISSUANCE_BEFORE_AMENDMENT got={len(rows)}')
          row = rows[0]
          if row['slot'] != '1' or row['is_replacement'] != 'false':
              raise RuntimeError('B10G_ONLY_INITIAL_SLOT1_MAY_PRECEDE_AMENDMENT')
          if row['recipient_pseudonym_sha256'] != os.environ['LEGACY_SLOT1_PSEUDONYM']:
              raise RuntimeError('B10G_SLOT1_LEGACY_PSEUDONYM_DRIFT')

          print('PASS: B10G amendment point is prospective after slot 1 and before slot 2.')
          print('PASS: B10E remains exact and B10F is outcome-blind Green.')
          PY

      - name: Write salt continuity amendment record
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, textwrap

          out = Path(os.environ['OUT_DIR'])
          if out.exists():
              raise RuntimeError('B10G_OUTPUT_DIRECTORY_ALREADY_EXISTS')
          out.mkdir(parents=True)

          commitment = os.environ['SALT_COMMITMENT_INPUT']
          b10e_path = Path(os.environ['B10E_WORKFLOW'])

          record = {
              'schema_version': 1,
              'study_id': 'package-adjustment-v9-discordant-human-validation',
              'stage': 'b10g_pseudonym_salt_continuity_amendment_v1',
              'decision': 'PASS_B10G_PROSPECTIVE_PSEUDONYM_SALT_CONTINUITY_AMENDMENT',
              'reason': (
                  'The private salt implicitly used for the sole pre-amendment '
                  'slot-1 pseudonym was not recoverably preserved. No human '
                  'vote choices were inspected before this amendment.'
              ),
              'timing': {
                  'legacy_slots': [1],
                  'new_salt_applies_to_slots': list(range(2, 41)),
                  'amendment_is_prospective': True,
                  'distribution_rows_before_amendment': 1,
              },
              'legacy_slot_1': {
                  'pseudonym_sha256': os.environ['LEGACY_SLOT1_PSEUDONYM'],
                  'status': 'grandfathered_unique_legacy_pseudonym',
                  'rehash_or_replacement_required': False,
                  'included_in_primary_analysis': True,
              },
              'slots_2_40_policy': {
                  'one_shared_private_salt_required': True,
                  'private_salt_must_not_be_committed_to_github': True,
                  'salt_commitment_sha256': commitment,
                  'salt_commitment_definition': 'SHA256(UTF-8(private_salt_string))',
                  'handle_normalization': 'lowercase(trim(stable recipient handle))',
                  'pseudonym_formula': (
                      'SHA256(UTF-8(lowercase(trim(stable recipient handle)) '
                      '+ newline + private_salt_string))'
                  ),
                  'same_normalized_handle_and_same_salt_produce_same_pseudonym': True,
              },
              'scientific_impact': {
                  'human_choices_read': False,
                  'human_outcome_analysis_performed': False,
                  'vote_transport_changed': False,
                  'challenge_assignment_changed': False,
                  'display_randomization_changed': False,
                  'model_changed': False,
                  'analysis_thresholds_changed': False,
                  'pseudonyms_used_as_outcome_or_predictor': False,
                  'primary_analysis_changed': False,
                  'slot_1_exclusion_sensitivity_from_b10f_still_required': True,
              },
              'operational_controls': {
                  'b10e_workflow_sha256': hashlib.sha256(b10e_path.read_bytes()).hexdigest(),
                  'b10e_workflow_unchanged': True,
                  'next_slot_to_issue': 2,
                  'future_recipient_hashes_must_be_generated_with_committed_slots_2_40_salt': True,
              },
              'human_outcomes_read': False,
              'human_outcome_analysis_authorized': False,
              'production_v9_activation_authorized': False,
              'next_if_green': 'Use unchanged B10E V2 to issue slot 2 with a pseudonym generated under the committed slots-2-40 salt.',
          }

          record_path = out / 'b10g_pseudonym_salt_continuity_amendment_v1.json'
          record_path.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')

          report = f'''
          # Package Adjustment V9 — B10G Pseudonym Salt Continuity Amendment V1

          ## Decision

          **PASS_B10G_PROSPECTIVE_PSEUDONYM_SALT_CONTINUITY_AMENDMENT**

          ## Why this exists

          Slot 1 was issued with a valid unique 64-character pseudonym, but the
          private salt implicitly used to create that pseudonym was not
          recoverably preserved. This was discovered before issuing Slot 2 and
          without inspecting any human vote choices.

          ## Prospective rule

          Slot 1 is grandfathered exactly as logged. It is not rehashed and the
          voter is not asked to repeat the study.

          Slots 2 through 40 must all use one new private salt. The salt itself
          stays off GitHub. GitHub stores only this commitment:

          `{commitment}`

          Commitment definition:

          `SHA256(UTF-8(private_salt_string))`

          Recipient pseudonym formula for Slots 2–40:

          `SHA256(UTF-8(lowercase(trim(stable recipient handle)) + newline + private_salt_string))`

          ## Scientific effect

          This changes only operator-side pseudonymization. It does not change
          any ballot, challenge assignment, left/right randomization, vote
          transport, model prediction, threshold, or analysis. Pseudonyms are
          identifiers for issuance/uniqueness and are not predictors or outcome
          variables.

          No human choices were read.

          ## Next

          After this workflow is Green, resume the unchanged B10E V2 issuance
          workflow beginning with Slot 2. Every Slot 2–40 recipient pseudonym
          must use the committed new salt.
          '''
          report_path = out / 'b10g_pseudonym_salt_continuity_amendment_v1.md'
          report_path.write_text(textwrap.dedent(report).lstrip())

          hashes = {
              record_path.name: hashlib.sha256(record_path.read_bytes()).hexdigest(),
              report_path.name: hashlib.sha256(report_path.read_bytes()).hexdigest(),
          }
          (out / 'b10g_output_hashes.json').write_text(
              json.dumps({'sha256': hashes}, indent=2, sort_keys=True) + '\n'
          )

          print(json.dumps({
              'decision': record['decision'],
              'salt_commitment_sha256': commitment,
              'legacy_slots': [1],
              'new_salt_slots': '2-40',
              'human_outcomes_read': False,
              'b10e_unchanged': True,
          }, indent=2))
          PY

      - name: Prove exact repository change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' |
            sort
          )

          expected=(
            research/package-adjustment-v9/b10g-pseudonym-salt-continuity-amendment-v1/b10g_output_hashes.json
            research/package-adjustment-v9/b10g-pseudonym-salt-continuity-amendment-v1/b10g_pseudonym_salt_continuity_amendment_v1.json
            research/package-adjustment-v9/b10g-pseudonym-salt-continuity-amendment-v1/b10g_pseudonym_salt_continuity_amendment_v1.md
          )

          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

      - name: Commit prospective amendment
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add research/package-adjustment-v9/b10g-pseudonym-salt-continuity-amendment-v1

          git commit \
            -m 'Record V9 B10G prospective pseudonym salt continuity amendment' \
            -m 'Grandfather slot 1; commit one new private-salt hash for slots 2-40; no outcomes read.' \
            -m 'B10E, vote transport, assignments, model and analysis remain unchanged.'

          git push origin HEAD:main

      - name: Reverify durable main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          out = Path(os.environ['OUT_DIR'])
          record = json.loads((out / 'b10g_pseudonym_salt_continuity_amendment_v1.json').read_text())

          assert record['decision'] == 'PASS_B10G_PROSPECTIVE_PSEUDONYM_SALT_CONTINUITY_AMENDMENT'
          assert record['human_outcomes_read'] is False
          assert record['slots_2_40_policy']['salt_commitment_sha256'] == os.environ['SALT_COMMITMENT_INPUT']
          assert record['timing']['legacy_slots'] == [1]
          assert record['timing']['new_salt_applies_to_slots'] == list(range(2,41))

          b10e = Path(os.environ['B10E_WORKFLOW'])
          got = hashlib.sha256(b10e.read_bytes()).hexdigest()
          if got != os.environ['EXPECTED_B10E_SHA256']:
              raise RuntimeError(f'B10G_DURABLE_B10E_SHA_DRIFT {got}')

          print('PASS: B10G amendment durable on main; B10E remains exact.')
          PY

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## B10G Package Adjustment V9 — Pseudonym Salt Continuity Amendment V1'
            echo
            echo '**GREEN means:**'
            echo '- Slot 1 remains grandfathered exactly as already logged.'
            echo '- No human vote choices were read.'
            echo '- Slots 2–40 are prospectively bound to one private salt commitment.'
            echo '- The actual private salt is not stored in GitHub.'
            echo '- B10E V2 is unchanged.'
            echo '- Voting transport, assignments, model, thresholds and primary analysis are unchanged.'
            echo
            echo '**Next:** issue Slot 2 with unchanged B10E V2 using a recipient pseudonym generated from the committed new salt.'
          } >> "$GITHUB_STEP_SUMMARY"
