        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort
          )
          expected=(
            research/package-adjustment-v8/evaluate_development_v1.py
            research/package-adjustment-v8/evaluation_engine_freeze_v1.md
            research/package-adjustment-v8/evaluation_engine_manifest_v1.json
