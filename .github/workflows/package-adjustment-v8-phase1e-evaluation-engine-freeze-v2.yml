        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/package-adjustment-v8/evaluate_development_v1.py \
                  research/package-adjustment-v8/evaluation_*
          git commit -m "Freeze Package Adjustment V8 evaluator against certified V6 catalog"
          git fetch origin main
          for p in \
            research/package-adjustment-v8/development_catalog_v1.json \
            research/package-adjustment-v8/development_catalog_audit_v1.json \
            research/package-adjustment-v8/development_catalog_manifest_v1.json \
