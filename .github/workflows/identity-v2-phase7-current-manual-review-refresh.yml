name: Identity V2 Phase 7 Current Manual-Review Refresh Freeze

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase7:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact Week-3 identity state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["scripts/identity_crosswalk.json"]="c513054640c413de48e073a2f69fb56a3333e903"
            ["scripts/fantasypros_api_normalized_2026.json"]="2a12d9123818c1910833f0eda8c0059304536c32"
            ["scripts/artifacts/generated/sleeper_2026_raw_categories.json"]="821a53ec4120b9f1b0cce7892688ad2b00bca35a"
            ["scripts/artifacts/generated/player_team_refresh.json"]="3e8e91a98728b6a9cad4f9c2da79749856acc6d6"
            ["scripts/projections/resolve_fantasypros_sleeper_identity.py"]="fa4b0fd9b201d79173125f55f7c1eeee916b2506"
            ["research/identity-v2/identity_v2_phase2_manual_adjudication.json"]="e5c36ca855f34144cd75f83023dad07765f2ff15"
            ["research/identity-v2/identity_v2_phase3_independent_corroboration.json"]="e7092e1c9fa959447e9ebb1a78f2d6aece8e0943"
            ["research/identity-v2/identity_v2_phase6_deployment_confirmation.json"]="0d9cd7807491fc261720bd6ecc225a7a525738bb"
          )
          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: identity input drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Freeze Phase 7 preregistration and current manual-review audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib,json,subprocess
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          PR=D/"identity_v2_phase7_preregistration.json"
          OUT=D/"identity_v2_phase7_current_manual_review_refresh.json"
          MD=D/"identity_v2_phase7_current_manual_review_refresh.md"
          MAN=D/"identity_v2_phase7_manifest.json"
          for p in (PR,OUT,MD,MAN):
              assert not p.exists(),f"refusing to overwrite {p}"

          CROSS=Path("scripts/identity_crosswalk.json")
          P2=D/"identity_v2_phase2_manual_adjudication.json"
          P3=D/"identity_v2_phase3_independent_corroboration.json"
          P6=D/"identity_v2_phase6_deployment_confirmation.json"

          expected_manual={
              "15697","16427","16787","18168","18557",
              "20080","22887","23957","24181","25668",
              "26157","26397","26411","26440","26964"
          }
          expected_persistent={
              "15697","18557","20080","23957","26157","26440"
          }
          expected_new=expected_manual-{
              "15697","18557","20080","23957","26157","26440"
          }
          expected_positions={"QB":2,"RB":1,"WR":7,"TE":3,"LB":2}

          prereg={
              "schema_version":1,
              "study_id":"identity-v2-phase7-current-manual-review-refresh",
              "status":"FROZEN_BEFORE_CLASSIFICATION",
              "research_only":True,
              "production_change_authorized":False,
              "production_crosswalk_mutation_allowed":False,
              "expected_current_manual_review_count":15,
              "expected_current_manual_fpids":sorted(expected_manual),
              "expected_persistent_phase2_hold_fpids":sorted(expected_persistent),
              "expected_new_since_phase2_fpids":sorted(expected_new),
              "expected_position_counts":expected_positions,
              "rules":[
                  "Do not guess identity from name alone.",
                  "Do not weaken team corroboration or position compatibility.",
                  "Preserve all three Phase-6 deployed mappings.",
                  "Natural resolution under the unchanged resolver is not manual promotion.",
                  "Source disappearance is not identity evidence.",
                  "Prior external evidence is provenance only and must be refreshed before a new production decision.",
                  "Phase 7 writes research artifacts only."
              ],
              "next_step_if_pass":"Identity V2 Phase 8 refreshed independent corroboration for the exact 15-row current manual-review universe."
          }
          PR.write_text(json.dumps(prereg,indent=2,sort_keys=True)+"\n")

          cross=json.loads(CROSS.read_text())
          p2=json.loads(P2.read_text())
          p3=json.loads(P3.read_text())
          p6=json.loads(P6.read_text())

          by={str(r["fantasypros_id"]):r for r in cross}
          manual={
              str(r["fantasypros_id"]):r
              for r in cross if r.get("requires_manual_review") is True
          }
          assert set(manual)==expected_manual,(sorted(manual),sorted(expected_manual))
          assert len(manual)==15

          positions=Counter(r["fp_position"] for r in manual.values())
          assert dict(positions)==expected_positions,(positions,expected_positions)

          methods=Counter(r["match_method"] for r in manual.values())
          assert methods=={
              "unique_name_position_team_unavailable":14,
              "name_found_position_incompatible":1
          },methods

          p2_rows={str(r["fantasypros_id"]):r for r in p2["rows"]}
          p2_holds={
              k:r for k,r in p2_rows.items()
              if r["disposition"].startswith("HOLD_")
          }
          persistent=set(manual)&set(p2_holds)
          new=set(manual)-set(p2_rows)
          assert persistent==expected_persistent,(persistent,expected_persistent)
          assert new==expected_new,(new,expected_new)

          # Exact old-hold paths after Phase 6/current refresh.
          deployed={"26313":"11760","27959":"13457","28290":"13482"}
          for fpid,sid in deployed.items():
              assert str(by[fpid]["sleeper_id"])==sid
              assert by[fpid]["requires_manual_review"] is False

          assert by["23193"]["requires_manual_review"] is False
          assert str(by["23193"]["sleeper_id"])=="7946"
          assert by["23193"]["match_confidence"]=="high"
          assert "19223" not in by

          old_hold_no_longer=set(p2_holds)-set(manual)
          assert old_hold_no_longer=={
              "19223","23193","26313","27959","28290"
          },old_hold_no_longer

          p3_by={str(r["fantasypros_id"]):r for r in p3["rows"]}

          def compact(row):
              return {
                  "fantasypros_id":str(row["fantasypros_id"]),
                  "name":row["name"],
                  "fp_position":row["fp_position"],
                  "fp_team":row.get("fp_team"),
                  "candidate_sleeper_id":row.get("candidate_sleeper_id"),
                  "sleeper_team":row.get("sleeper_team"),
                  "sleeper_pos":row.get("sleeper_pos"),
                  "match_method":row["match_method"],
                  "match_confidence":row["match_confidence"]
              }

          persistent_rows=[]
          for fpid in sorted(persistent):
              item=compact(manual[fpid])
              item["phase2_disposition"]=p2_holds[fpid]["disposition"]
              item["phase3_classification"]=p3_by[fpid]["classification"]
              item["phase7_disposition"]="PERSISTENT_HOLD_REQUIRES_REFRESHED_CORROBORATION"
              persistent_rows.append(item)

          new_rows=[]
          for fpid in sorted(new):
              item=compact(manual[fpid])
              item["phase7_disposition"]="NEW_MANUAL_REVIEW_REQUIRES_EXTERNAL_CORROBORATION"
              new_rows.append(item)

          resolved=[
              {
                  "fantasypros_id":"23193","name":"Jack Stoll",
                  "path":"NATURAL_SOURCE_RESOLUTION_UNCHANGED_RESOLVER",
                  "current_sleeper_id":"7946"
              },
              {
                  "fantasypros_id":"19223","name":"Julian Okwara",
                  "path":"CURRENT_FANTASYPROS_SOURCE_ROW_ABSENT",
                  "current_sleeper_id":None
              }
          ]
          for fpid,sid in deployed.items():
              resolved.append({
                  "fantasypros_id":fpid,
                  "name":by[fpid]["name"],
                  "path":"DEPLOYED_PHASE6_EXPLICIT_EVIDENCE_BACKED_MAPPING",
                  "current_sleeper_id":sid
              })

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase7-current-manual-review-refresh",
              "status":"CURRENT_MANUAL_REVIEW_REFRESH_FROZEN",
              "decision":"PASS_IDENTITY_V2_PHASE7_AUTHORIZE_PHASE8_EXTERNAL_CORROBORATION",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "production_crosswalk_mutated":False,
              "current_crosswalk_row_count":len(cross),
              "current_manual_review_count":15,
              "current_manual_by_position":dict(sorted(positions.items())),
              "current_manual_by_match_method":dict(sorted(methods.items())),
              "persistent_phase2_hold_count":len(persistent_rows),
              "persistent_phase2_holds":persistent_rows,
              "new_manual_since_phase2_count":len(new_rows),
              "new_manual_since_phase2":new_rows,
              "phase2_holds_no_longer_manual_count":len(resolved),
              "phase2_holds_no_longer_manual":sorted(
                  resolved,key=lambda x:x["fantasypros_id"]
              ),
              "phase6_deployed_mappings":deployed,
              "jonah_elliss":{
                  "fantasypros_id":"26157",
                  "remains_manual":True,
                  "current_match_method":manual["26157"]["match_method"],
                  "prior_phase3_classification":p3_by["26157"]["classification"],
                  "production_change_authorized":False
              },
              "source_sha256":{
                  "scripts/identity_crosswalk.json":
                      hashlib.sha256(CROSS.read_bytes()).hexdigest(),
                  "phase2":
                      hashlib.sha256(P2.read_bytes()).hexdigest(),
                  "phase3":
                      hashlib.sha256(P3.read_bytes()).hexdigest(),
                  "phase6":
                      hashlib.sha256(P6.read_bytes()).hexdigest()
              },
              "hard_gates":{
                  "exact_15_current_manual_rows":True,
                  "exact_position_counts":True,
                  "exact_resolver_mechanism_counts":True,
                  "exact_6_persistent_holds":True,
                  "exact_9_new_manual_rows":True,
                  "phase6_three_mappings_intact":True,
                  "jack_stoll_natural_resolution_confirmed":True,
                  "julian_okwara_current_source_absence_confirmed":True,
                  "production_unchanged":True
              },
              "next_step_rule":"Refresh independent external evidence for all exact 15 current manual-review rows. Do not promote by name alone and do not reuse old evidence silently."
          }
          OUT.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 7 — Current Manual-Review Refresh",
              "",
              f"**Decision:** `{result['decision']}`",
              "",
              "- Current manual-review rows: **15**",
              "- Persistent Phase-2 holds: **6**",
              "- New manual-review rows since Phase 2: **9**",
              "- Old Phase-2 holds no longer manual: **5**",
              "",
              "## Current rows",
              "",
              "| FPID | Player | Pos | FP team | Candidate SID | Provenance |",
              "|---|---|---|---|---|---|"
          ]
          for fpid,row in sorted(
              manual.items(),key=lambda kv:(kv[1]["fp_position"],kv[1]["name"])
          ):
              provenance=(
                  "persistent Phase-2 hold"
                  if fpid in persistent else "new since Phase 2"
              )
              lines.append(
                  f"| {fpid} | {row['name']} | {row['fp_position']} | "
                  f"{row.get('fp_team') or '—'} | "
                  f"{row.get('candidate_sleeper_id') or '—'} | "
                  f"{provenance} |"
              )
          lines += [
              "",
              "No identity is promoted here. Phase 8 is refreshed independent corroboration for this exact 15-row frozen universe.",
              ""
          ]
          MD.write_text("\n".join(lines)+"\n")

          manifest={
              "schema_version":1,
              "study_id":"identity-v2-phase7-current-manual-review-refresh",
              "decision":result["decision"],
              "current_manual_review_count":15,
              "files":{
                  PR.name:hashlib.sha256(PR.read_bytes()).hexdigest(),
                  OUT.name:hashlib.sha256(OUT.read_bytes()).hexdigest(),
                  MD.name:hashlib.sha256(MD.read_bytes()).hexdigest()
              },
              "production_change_authorized":False,
              "production_changed":False
          }
          MAN.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("\n".join(lines[:18]))
          PY

      - name: Validate exact Phase 7 result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          r=json.loads(
              (D/"identity_v2_phase7_current_manual_review_refresh.json").read_text()
          )
          assert r["decision"]=="PASS_IDENTITY_V2_PHASE7_AUTHORIZE_PHASE8_EXTERNAL_CORROBORATION"
          assert r["current_manual_review_count"]==15
          assert r["persistent_phase2_hold_count"]==6
          assert r["new_manual_since_phase2_count"]==9
          assert r["phase2_holds_no_longer_manual_count"]==5
          assert all(r["hard_gates"].values())
          assert r["production_change_authorized"] is False
          assert r["production_crosswalk_mutated"] is False
          print("PASS: exact Phase 7 result validated.")
          PY

      - name: Prove research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/identity-v2/identity_v2_phase7_preregistration.json",
              "research/identity-v2/identity_v2_phase7_current_manual_review_refresh.json",
              "research/identity-v2/identity_v2_phase7_current_manual_review_refresh.md",
              "research/identity-v2/identity_v2_phase7_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "scripts/identity_crosswalk.json" not in touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: Phase 7 is research-only.")
          PY

      - name: Postflight repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit Phase 7 artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during Phase 7."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/identity-v2/identity_v2_phase7_preregistration.json \
            research/identity-v2/identity_v2_phase7_current_manual_review_refresh.json \
            research/identity-v2/identity_v2_phase7_current_manual_review_refresh.md \
            research/identity-v2/identity_v2_phase7_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no Phase 7 artifacts staged."
            exit 1
          }

          git commit -m "Freeze Identity V2 Phase 7 current manual-review refresh"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: Phase 7 committed; production unchanged."
