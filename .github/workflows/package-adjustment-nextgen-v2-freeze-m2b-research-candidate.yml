name: Package Adjustment NextGen V2 Freeze M2b Research Candidate

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: package-adjustment-nextgen-v2-freeze-m2b-research-candidate
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact dispatch commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          echo "PASS: checkout pinned to dispatch SHA."

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy==2.5.3" \
            "scipy==1.18.1" \
            "requests"

          python3 - <<'PY'
          import platform
          import numpy
          import scipy
          import requests

          assert platform.python_version() == "3.13.15"
          assert numpy.__version__ == "2.5.3"
          assert scipy.__version__ == "1.18.1"
          print("PASS: exact validation environment available.")
          PY

      - name: Guard frozen research boundary before candidate freeze
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          test -z "$(git status --porcelain=v1)"

          # Original frozen objects.
          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"
          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"
          test "$(git hash-object "$D/voting_sampling_correction_manifest.json")" = "8c181ec2dbcfb4b259de7e839247780e67539b09"

          # Frozen beta-bound amendment.
          test "$(git hash-object "$D/model_fit_preregistration_beta_bound_amendment_v1.json")" = "88a72e5c61abdea61a7b5e3def2838473dd2e5ae"
          test "$(git hash-object "$D/model_fit_preregistration_beta_bound_amendment_v1.md")" = "d7a0c98f46764275dc4cb2c41134d76348ff3c24"
          test "$(git hash-object "$D/model_fit_preregistration_beta_bound_amendment_v1_manifest.json")" = "b4be78011a5a276ca18ab3b234d209cba30e7a61"

          git merge-base --is-ancestor 8edba8a6f4e612fa20995a8c62c4be619907abe1 HEAD
          git merge-base --is-ancestor fbf8829a61a087704e271b05dc52f8500aa9f46f HEAD
          git merge-base --is-ancestor 141226b8b8e30a8c0153779b6efe5fdf0399c931 HEAD

          # Candidate freeze must be a one-time repository event.
          test ! -e "$D/model_fit_beta_amended_v1_results.json"
          test ! -e "$D/model_fit_beta_amended_v1_summary.md"
          test ! -e "$D/model_fit_beta_amended_v1_provenance.json"
          test ! -e "$D/model_fit_beta_amended_v1_checkpoint_lock.json"
          test ! -e "$D/model_fit_beta_amended_v1_holdout_spend_marker.json"
          test ! -e "$D/research_candidate_m2b_v1.json"
          test ! -e "$D/research_candidate_m2b_v1.md"
          test ! -e "$D/research_candidate_m2b_v1_manifest.json"

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: frozen boundary intact; production unchanged."

      - name: Download and authenticate successful amended-fit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/pkgnv2-candidate-freeze"
          FINAL="$ROOT/final-artifact"
          MARKER="$ROOT/marker-artifact"

          rm -rf "$ROOT"
          mkdir -p "$FINAL" "$MARKER"

          RUN_ID=34658221528
          FINAL_ARTIFACT_ID=10289186364
          MARKER_ARTIFACT_ID=10286309097
          REPO="ajknoll23-code/LOG-Trade-Calculator"

          gh api "repos/$REPO/actions/runs/$RUN_ID" > "$ROOT/run.json"
          gh api "repos/$REPO/actions/artifacts/$FINAL_ARTIFACT_ID" > "$ROOT/final-meta.json"
          gh api "repos/$REPO/actions/artifacts/$MARKER_ARTIFACT_ID" > "$ROOT/marker-meta.json"

          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name package-adjustment-nextgen-v2-model-fit-beta-amended-v1 \
            --dir "$FINAL"

          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name package-adjustment-nextgen-v2-holdout-spend-marker \
            --dir "$MARKER"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/pkgnv2-candidate-freeze")
          final = root / "final-artifact"
          marker = root / "marker-artifact"

          run = json.loads((root / "run.json").read_text())
          final_meta = json.loads((root / "final-meta.json").read_text())
          marker_meta = json.loads((root / "marker-meta.json").read_text())

          assert run["id"] == 34658221528
          assert run["name"] == "Package Adjustment NextGen V2 Model Fit — Beta Amendment V1"
          assert run["path"] == ".github/workflows/package-adjustment-nextgen-v2-model-fit-beta-amended-v1.yml"
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"
          assert run["run_attempt"] == 1
          assert run["head_sha"] == "141226b8b8e30a8c0153779b6efe5fdf0399c931"

          assert final_meta["id"] == 10289186364
          assert final_meta["name"] == "package-adjustment-nextgen-v2-model-fit-beta-amended-v1"
          assert final_meta["expired"] is False
          assert final_meta["digest"] == (
              "sha256:55c0e642f02edbd7978ff94293f37d3e1740d7c9d72d54599c52e19119c7ce74"
          )

          assert marker_meta["id"] == 10286309097
          assert marker_meta["name"] == "package-adjustment-nextgen-v2-holdout-spend-marker"
          assert marker_meta["expired"] is False
          assert marker_meta["digest"] == (
              "sha256:9dac1f6152a3b35d016b99b3217262392f3c309e85c3b613f555db96954da61a"
          )

          expected = {
              "amended-model-fit-results.json":
                  "8fddf78b922cec23080b90c5b691b564c43409443627a6a9109709b11fc3cb6f",
              "amended-model-fit-summary.md":
                  "6e224e64716dbd333f6aec490aea8494c7dcf139120e29b776cc34193887fa6f",
              "amendment-provenance.json":
                  "39ae54e2738dd0030a95877f9c4918e31c4dc13df915d3201864ceafa4af84a1",
              "checkpoint-lock.json":
                  "bb5553b05046ad25dd12215ec172d30dc67b3e55e946b5e0fae2ff6d6608a95f",
              "holdout-spend-marker.json":
                  "964e86734a46c4513d014e35fb102f984d46b216ab904553160ad5396a6d768e",
          }

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for name, digest in expected.items():
              path = final / name
              assert path.exists(), name
              assert sha(path) == digest, (name, sha(path), digest)

          # The marker persisted before fitting must match the copy preserved in
          # the final artifact byte-for-byte.
          separate_marker = marker / "holdout-spend-marker.json"
          assert separate_marker.exists()
          assert separate_marker.read_bytes() == (
              final / "holdout-spend-marker.json"
          ).read_bytes()

          print("PASS: successful run + both artifacts authenticated exactly.")
          PY

      - name: Validate frozen winning result before repository freeze
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          final = Path("/tmp/pkgnv2-candidate-freeze/final-artifact")
          result = json.loads((final / "amended-model-fit-results.json").read_text())
          checkpoint = json.loads((final / "checkpoint-lock.json").read_text())
          provenance = json.loads((final / "amendment-provenance.json").read_text())
          marker = json.loads((final / "holdout-spend-marker.json").read_text())

          assert result["status"] == "fit_complete_research_only"
          assert result["fit_performed"] is True
          assert result["research_only"] is True
          assert result["production_change_authorized"] is False
          assert result["automatic_production_change_allowed"] is False

          assert result["maturity"]["mature"] is True
          assert result["maturity"]["valid_effective_votes"] == 800.0
          assert result["maturity"]["distinct_voters"] == 40
          assert all(result["maturity"]["conditions"].values())

          assert checkpoint["canonical_ballot_sha256"] == (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )
          assert checkpoint["valid_ballots"] == 800
          assert checkpoint["distinct_voters"] == 40
          assert checkpoint["beta_bound_amendment_id"] == "pkgnv2-beta-bound-v1"
          assert checkpoint["beta_upper_bound"] == 250.0

          assert result["beta_bound_amendment"]["amendment_id"] == "pkgnv2-beta-bound-v1"
          assert result["beta_bound_amendment"]["old_beta_upper"] == 50.0
          assert result["beta_bound_amendment"]["new_beta_upper"] == 250.0
          assert result["beta_bound_amendment"]["original_fitter_logic_reused"] is True
          assert result["beta_bound_amendment"]["all_other_preregistered_fields_unchanged"] is True

          assert result["structural_holdout_evidence_status"]["spent_by_this_execution"] is True
          assert result["structural_holdout_evidence_status"]["repeat_evaluation_allowed"] is False
          assert result["structural_holdout_evidence_status"]["further_tuning_allowed"] is False
          assert marker["status"] == "structural_holdout_evaluation_boundary_crossed"

          cv = result["M2b_cross_validation"]
          assert cv["success"] is True
          assert cv["selected_lambda"] == 1.0
          assert len(cv["candidates"]) == 5
          assert all(row["usable"] for row in cv["candidates"])

          boot = result["bootstrap"]
          assert boot["status"] == "complete"
          assert boot["valid_draws"] == 500
          assert boot["target_valid_draws"] == 500
          assert boot["favorable_fraction"]["M2b_vs_M0"] == 0.914
          assert boot["favorable_fraction"]["M2b_vs_M2a"] == 0.906
          assert boot["favorable_fraction"]["M2a_vs_M0"] == 0.52

          selection = result["selection"]
          assert selection["status"] == "research_candidate_selected"
          assert selection["selected_model"] == "M2b"
          assert selection["production_promotion_authorized"] is False
          assert selection["decisions"][0]["challenger"] == "M2a"
          assert selection["decisions"][0]["qualified"] is False
          assert selection["decisions"][1]["challenger"] == "M2b"
          assert selection["decisions"][1]["incumbent"] == "M0"
          assert selection["decisions"][1]["qualified"] is True
          assert selection["decisions"][1]["reasons"] == []

          point = result["point_estimates"]
          assert point["M0"]["eligible"] is True
          assert point["M2a"]["eligible"] is True
          assert point["M2b"]["eligible"] is True

          assert abs(point["M0"]["combined_holdout_log_loss"] - 0.6806697309320987) < 1e-15
          assert abs(point["M2b"]["combined_holdout_log_loss"] - 0.6608075702085044) < 1e-15
          assert abs(point["M2b"]["scale_holdout_log_loss"] - 0.6037035174834041) < 1e-15
          assert abs(point["M2b"]["topology_holdout_log_loss"] - 0.7083942808127549) < 1e-15

          m2b_fit = point["M2b"]["fit"]
          assert m2b_fit["success"] is True
          assert m2b_fit["eligible"] is True
          assert m2b_fit["boundary_flags"] == []
          expected_x = [
              0.0,
              0.0,
              0.0362911410036889,
              0.0074486570102035975,
              4.745193657558804,
              0.24927858289620897,
          ]
          assert len(m2b_fit["x"]) == len(expected_x)
          assert all(abs(a - b) < 1e-15 for a, b in zip(m2b_fit["x"], expected_x))
          assert abs(math.exp(m2b_fit["x"][4]) - 115.03007979068902) < 1e-10

          ci = boot["combined_holdout_log_loss_improvement_ci90"]["M2b_vs_M0"]
          assert ci["p05"] < 0.0
          assert ci["median"] > 0.0
          assert ci["p95"] > 0.0

          assert provenance["research_only"] is True
          assert provenance["production_change_authorized"] is False
          assert provenance["automatic_production_change_allowed"] is False
          assert provenance["no_tuning_after_this_execution"] is True

          print("PASS: exact M2b winning result validated without reinterpretation.")
          PY

      - name: Freeze exact run outputs and M2b research candidate
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          SRC="/tmp/pkgnv2-candidate-freeze/final-artifact"

          cp "$SRC/amended-model-fit-results.json" \
            "$D/model_fit_beta_amended_v1_results.json"
          cp "$SRC/amended-model-fit-summary.md" \
            "$D/model_fit_beta_amended_v1_summary.md"
          cp "$SRC/amendment-provenance.json" \
            "$D/model_fit_beta_amended_v1_provenance.json"
          cp "$SRC/checkpoint-lock.json" \
            "$D/model_fit_beta_amended_v1_checkpoint_lock.json"
          cp "$SRC/holdout-spend-marker.json" \
            "$D/model_fit_beta_amended_v1_holdout_spend_marker.json"

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          result = json.loads((d / "model_fit_beta_amended_v1_results.json").read_text())
          point = result["point_estimates"]
          fit = point["M2b"]["fit"]
          boot = result["bootstrap"]

          candidate = {
              "schema_version": 1,
              "status": "frozen_first_wave_research_candidate",
              "frozen": True,
              "candidate_id": "pkgnv2-m2b-v1",
              "model": "M2b",
              "model_name": "normalized_convex_monotone_piecewise_linear_spline_equivalent",
              "research_only": True,
              "production_candidate": False,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "source_model_fit": {
                  "run_id": 34658221528,
                  "run_attempt": 1,
                  "head_sha": "141226b8b8e30a8c0153779b6efe5fdf0399c931",
                  "artifact_id": 10289186364,
                  "artifact_digest": (
                      "sha256:55c0e642f02edbd7978ff94293f37d3e1740d7c9d72d54599c52e19119c7ce74"
                  ),
                  "result_sha256": hashlib.sha256(
                      (d / "model_fit_beta_amended_v1_results.json").read_bytes()
                  ).hexdigest(),
              },
              "evidence_checkpoint": {
                  "effective_votes": 800,
                  "distinct_voters": 40,
                  "canonical_ballot_sha256": (
                      "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
                  ),
              },
              "preregistration": {
                  "original_config_sha256": (
                      "4b8793c8de50d45c2d5ac6423013ee34d127982fc0492e933f5dc6a6ef6aaf98"
                  ),
                  "original_fitter_sha256": (
                      "b9a74dded87189971703f8b2a63626b3778ceabd0ed6ea258855cc2e071a36f2"
                  ),
                  "beta_bound_amendment_id": "pkgnv2-beta-bound-v1",
                  "beta_upper_bound": 250.0,
                  "all_other_preregistered_rules_unchanged": True,
              },
              "frozen_candidate_parameters": {
                  "regularization_lambda": float(
                      result["M2b_cross_validation"]["selected_lambda"]
                  ),
                  "slope_increments": [float(x) for x in fit["x"][:4]],
                  "log_beta": float(fit["x"][4]),
                  "beta": math.exp(float(fit["x"][4])),
                  "delta_left": float(fit["x"][5]),
                  "parameter_vector_x": [float(x) for x in fit["x"]],
                  "boundary_flags": list(fit["boundary_flags"]),
                  "fit_objective": float(fit["objective"]),
              },
              "structural_holdout_results": {
                  "combined_log_loss": float(
                      point["M2b"]["combined_holdout_log_loss"]
                  ),
                  "scale_log_loss": float(
                      point["M2b"]["scale_holdout_log_loss"]
                  ),
                  "topology_log_loss": float(
                      point["M2b"]["topology_holdout_log_loss"]
                  ),
                  "M0_combined_log_loss": float(
                      point["M0"]["combined_holdout_log_loss"]
                  ),
                  "absolute_combined_improvement_vs_M0": float(
                      point["M0"]["combined_holdout_log_loss"]
                      - point["M2b"]["combined_holdout_log_loss"]
                  ),
                  "holdouts_spent": True,
                  "repeat_evaluation_allowed": False,
                  "further_tuning_allowed": False,
              },
              "bootstrap": {
                  "method": "nonparametric_voter_cluster_bootstrap",
                  "valid_draws": int(boot["valid_draws"]),
                  "M2b_favorable_fraction_vs_M0": float(
                      boot["favorable_fraction"]["M2b_vs_M0"]
                  ),
                  "M2b_favorable_fraction_vs_M2a": float(
                      boot["favorable_fraction"]["M2b_vs_M2a"]
                  ),
                  "improvement_vs_M0_ci90": dict(
                      boot["combined_holdout_log_loss_improvement_ci90"]["M2b_vs_M0"]
                  ),
                  "note": (
                      "The preregistered favorable-fraction criterion passed. "
                      "The 90% percentile improvement interval has a slightly negative "
                      "5th percentile and must not be represented as wholly above zero."
                  ),
              },
              "selection": {
                  "status": "research_candidate_selected",
                  "selected_model": "M2b",
                  "M2b_qualified_against": "M0",
                  "all_preregistered_selection_thresholds_passed": True,
              },
              "next_evidence_requirement": {
                  "prospective_time_holdout_required_before_production_candidate": True,
                  "candidate_parameters_must_remain_frozen": True,
                  "structural_holdouts_may_not_be_reused_for_tuning_or_selection": True,
                  "production_promotion_requires_separate_preregistered_decision": True,
              },
          }

          candidate_path = d / "research_candidate_m2b_v1.json"
          candidate_path.write_text(
              json.dumps(candidate, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = f"""# Package Adjustment NextGen V2 — Frozen M2b Research Candidate V1

          **Status:** frozen first-wave research candidate

          ## Candidate

          - Candidate ID: **pkgnv2-m2b-v1**
          - Model: **M2b**
          - Selected regularization lambda: **{candidate['frozen_candidate_parameters']['regularization_lambda']}**
          - Beta: **{candidate['frozen_candidate_parameters']['beta']:.12f}**
          - Delta-left: **{candidate['frozen_candidate_parameters']['delta_left']:.12f}**
          - Slope increments: **{candidate['frozen_candidate_parameters']['slope_increments']}**
          - Boundary flags: **none**

          ## Frozen evidence

          - Exact checkpoint: **800 effective votes / 40 voters**
          - Canonical ballot SHA-256:
            `{candidate['evidence_checkpoint']['canonical_ballot_sha256']}`
          - Successful amended-fit run: **34658221528**
          - Successful amended-fit artifact digest:
            `{candidate['source_model_fit']['artifact_digest']}`

          ## Structural holdout result

          - M0 combined log loss: **{candidate['structural_holdout_results']['M0_combined_log_loss']:.12f}**
          - M2b combined log loss: **{candidate['structural_holdout_results']['combined_log_loss']:.12f}**
          - Absolute M2b improvement: **{candidate['structural_holdout_results']['absolute_combined_improvement_vs_M0']:.12f}**
          - M2b scale holdout log loss: **{candidate['structural_holdout_results']['scale_log_loss']:.12f}**
          - M2b topology holdout log loss: **{candidate['structural_holdout_results']['topology_log_loss']:.12f}**

          The structural scale and topology holdouts are now **spent**. They may not be
          reused for candidate tuning, model selection, or parameter changes.

          ## Bootstrap evidence

          - Valid voter-cluster draws: **{candidate['bootstrap']['valid_draws']} / 500**
          - M2b favorable vs M0: **{candidate['bootstrap']['M2b_favorable_fraction_vs_M0']:.3f}**
          - M2b favorable vs M2a: **{candidate['bootstrap']['M2b_favorable_fraction_vs_M2a']:.3f}**
          - 90% percentile improvement interval vs M0:
            **[{candidate['bootstrap']['improvement_vs_M0_ci90']['p05']:.12f},
            {candidate['bootstrap']['improvement_vs_M0_ci90']['p95']:.12f}]**
          - Median improvement vs M0:
            **{candidate['bootstrap']['improvement_vs_M0_ci90']['median']:.12f}**

          The preregistered favorable-fraction criterion passed. The interval's 5th
          percentile is slightly negative, so this result must not be described as a
          wholly-positive 90% improvement interval.

          ## Production status

          **M2b is not a production candidate yet.**

          Production remains Package Adjustment V1.6. This freeze authorizes no production
          change and no automatic promotion.

          Before M2b can become a production candidate, its exact frozen parameters must be
          evaluated prospectively under a separately preregistered time holdout. No further
          tuning against the spent structural holdouts is allowed.
          """

          md_path = d / "research_candidate_m2b_v1.md"
          md_path.write_text(
              "\n".join(line.strip() for line in md.splitlines()) + "\n",
              encoding="utf-8",
          )

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          artifacts = {}
          for name in (
              "model_fit_beta_amended_v1_results.json",
              "model_fit_beta_amended_v1_summary.md",
              "model_fit_beta_amended_v1_provenance.json",
              "model_fit_beta_amended_v1_checkpoint_lock.json",
              "model_fit_beta_amended_v1_holdout_spend_marker.json",
              "research_candidate_m2b_v1.json",
              "research_candidate_m2b_v1.md",
          ):
              p = d / name
              artifacts[name] = {
                  "path": str(p),
                  "sha256": sha(p),
              }

          manifest = {
              "schema_version": 1,
              "status": "frozen_m2b_research_candidate_manifest",
              "frozen": True,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "candidate_id": "pkgnv2-m2b-v1",
              "source_run_id": 34658221528,
              "source_artifact_id": 10289186364,
              "source_artifact_digest": (
                  "sha256:55c0e642f02edbd7978ff94293f37d3e1740d7c9d72d54599c52e19119c7ce74"
              ),
              "artifacts": artifacts,
              "structural_holdouts_spent": True,
              "production_change_authorized": False,
              "production_candidate": False,
          }

