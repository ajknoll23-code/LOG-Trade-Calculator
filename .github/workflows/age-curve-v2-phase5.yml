name: Age Curve V2 Phase 5 Prospective

# Research-only prospective evaluation of the frozen age-curve bridge family.
# The first successful run freezes the preseason candidate values.
# Later runs grade those exact predictions against completed 2026 weeks.
#
# This workflow never changes index.html, AGE_CURVE, Production V2,
# Market Value, or any deployed player value.
on:
  workflow_dispatch:
  schedule:
    # Run after the Tuesday full data refresh and other prospective evaluators.
    - cron: '0 17 * * 2'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 5 self-test
        run: python3 research/age-curve-v2/age_curve_v2_phase5_prospective_evaluator.py --selftest

      - name: Freeze preseason age candidates if needed and evaluate
        run: python3 research/age-curve-v2/age_curve_v2_phase5_prospective_evaluator.py --freeze --write

      - name: Verify frozen candidates and prospective outputs
        run: python3 research/age-curve-v2/age_curve_v2_phase5_prospective_evaluator.py --check

      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/age-curve-v2/age_curve_v2_phase5_frozen_candidates.json
          git add research/age-curve-v2/age_curve_v2_phase5_evaluation.json
          git add research/age-curve-v2/age_curve_v2_phase5_evaluation.md
          git diff --staged --quiet || git commit -m "Update Age Curve V2 Phase 5 prospective research"
          git push
