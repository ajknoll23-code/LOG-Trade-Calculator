name: Replacement Level V2 Phase 2 Historical Backtest

# Research-only comprehensive replacement-rank backtest.
# Does not change deployed player values, Production V2, position weights,
# global scale, or any frozen prospective experiment.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 2 self-test
        run: python3 research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.py --selftest

      - name: Build Phase 2 historical backtest
        run: python3 research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.json
          git add research/replacement-level-v2/replacement_level_v2_phase2_historical_backtest.md
          git diff --staged --quiet || git commit -m "Add Replacement Level V2 Phase 2 historical backtest"
          git push
