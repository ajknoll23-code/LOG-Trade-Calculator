name: Package Adjustment NextGen V2 Scale Integrity Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-adjustment-nextgen-v2-scale-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependency
        run: python3 -m pip install requests

      - name: Verify reviewed starting state
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          CAT="research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"

          test -f "$GEN"
          test -f "$CAT"
          test -f "$SPEC"
          test -z "$(git status --porcelain=v1)"

          GEN_SHA="$(sha256sum "$GEN" | awk '{print $1}')"
          SPEC_SHA="$(sha256sum "$SPEC" | awk '{print $1}')"

          test "$GEN_SHA" = "e2fee705d959b363a1844635f8dd0dba87f2b316644f97952028d653507158ee"
          test "$SPEC_SHA" = "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"

          python3 - <<'PY'
          import json
          from pathlib import Path

          cat = json.loads(Path(
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          ).read_text(encoding="utf-8"))

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["research_only"] is True
          assert cat["frozen"] is False
          assert cat["production_formula_enabled"] is False
          assert cat["automatic_production_change_allowed"] is False
          assert cat["generator_sha256"] == "e2fee705d959b363a1844635f8dd0dba87f2b316644f97952028d653507158ee"
          assert cat["research_spec"]["sha256"] == "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"
          assert cat["catalog_diagnostics"]["challenge_count"] == 144
          assert cat["catalog_diagnostics"]["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 30,
              "structural_topology_3v3": 24,
          }
          assert cat["catalog_diagnostics"]["skipped_or_underfilled_cells"] == []
          print("PASS: current unreleased catalog and reviewed generator/spec are exactly the expected inputs.")
          PY

      - name: Verify production Package Adjustment before audit
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Audit current scale integrity and separated-band constructibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import importlib.util
          import json
          import math
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path.cwd()
          GEN_PATH = ROOT / "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          CAT_PATH = ROOT / "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          REPORT_PATH = Path("/tmp/package-adjustment-nextgen-v2-scale-integrity-audit.json")

          spec = importlib.util.spec_from_file_location("pkgnv2_generator", GEN_PATH)
          g = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(g)

          catalog = json.loads(CAT_PATH.read_text(encoding="utf-8"))
          challenges = catalog["challenges"]

          # ------------------------------------------------------------------
          # 1) Audit the current committed catalog.
          # ------------------------------------------------------------------
          current_cells = defaultdict(list)
          for c in challenges:
              if c["family"] == "fragmentation_filler":
                  current_cells[(c["cell_id"], c["scale_label"])].append(c)

          current_scale_summary = {}
          for (cell_id, scale_label), rows in sorted(current_cells.items()):
              anchor = float(rows[0]["scale_anchor_total_fv"])
              goals = [float(r["goal_total_fv"]) for r in rows]
              drift = [abs(x - anchor) / anchor for x in goals]
              current_scale_summary[f"{cell_id}/{scale_label}"] = {
                  "anchor_total_fv": anchor,
                  "challenge_count": len(rows),
                  "goal_min": min(goals),
                  "goal_max": max(goals),
                  "goal_mean": sum(goals) / len(goals),
                  "max_anchor_drift_pct": max(drift),
                  "mean_anchor_drift_pct": sum(drift) / len(drift),
              }

          # Exact side packages repeated across different scale labels for the
          # same fragmentation cell are invisible to the current same-scale
          # diversity diagnostic, so measure them explicitly here.
          side_scales = defaultdict(set)
          side_occurrences = defaultdict(list)
          for c in challenges:
              if c["family"] != "fragmentation_filler":
                  continue
              for side_name in ("side_a", "side_b"):
                  keys = tuple(sorted(a["key"] for a in c[side_name]["assets"]))
                  sig = (c["cell_id"], keys)
                  side_scales[sig].add(c["scale_label"])
                  side_occurrences[sig].append({
                      "challenge_id": c["id"],
                      "scale_label": c["scale_label"],
                      "side": side_name,
                      "names": [a["name"] for a in c[side_name]["assets"]],
                  })

          cross_scale_repeats = []
          for sig, scales in side_scales.items():
              if len(scales) > 1:
                  cell_id, keys = sig
                  cross_scale_repeats.append({
                      "cell_id": cell_id,
                      "asset_keys": list(keys),
                      "scales": sorted(scales),
                      "occurrences": side_occurrences[sig],
                  })
          cross_scale_repeats.sort(
              key=lambda row: (-len(row["occurrences"]), row["cell_id"], row["asset_keys"])
          )

          # ------------------------------------------------------------------
          # 2) Rebuild frozen player universe and the preregistered scale plans.
          # ------------------------------------------------------------------
          values_doc = g.read_json(g.VALUES)
          rosters_doc = g.read_json(g.ROSTERS)
          players, unresolved, pos_counts = g.build_player_universe(values_doc, rosters_doc)
          feasible_pairs = g.enumerate_feasible_8020_pairs(players)
          core_plans = g.scale_plan(feasible_pairs)
          frag_plans, frag_diag = g.fragmentation_scale_plans(players, feasible_pairs)

          # ------------------------------------------------------------------
          # 3) For each fragmentation comparison, construct NON-OVERLAPPING
          #    scale bands. Boundaries are midpoints between the frozen low/mid
          #    and mid/high anchors. This prevents a candidate total from being
          #    eligible for two nominal scales.
          #
          #    Within each band, test the existing 5-rep target without changing
          #    any 2.5% scientific tolerance. If the normal 24-side candidate
          #    limit is insufficient, retry 48 then 96 only to diagnose whether
          #    the failure is search truncation or true real-player-grid sparsity.
          # ------------------------------------------------------------------
          separated_band_results = {}
          original_side_limit = int(g.SIDE_CANDIDATE_LIMIT)
          candidate_limits = [24, 48, 96]

          for comparison_label, shares_a, shares_b in g.FRAGMENTATION_COMPARISONS:
              plans = frag_plans[comparison_label]
              anchors = {
                  label: float(plans[label]["anchor_total_fv"])
                  for label, _q in g.SCALE_QUANTILES
              }
              b_low_mid = (anchors["low"] + anchors["mid"]) / 2.0
              b_mid_high = (anchors["mid"] + anchors["high"]) / 2.0

              feasible_totals = []
              seen = set()
              for row in feasible_pairs:
                  total = float(row["total_fv"])
                  code = round(total, 3)
                  if code in seen:
                      continue
                  seen.add(code)
                  if g.component_window_matching_exists(players, total, shares_a, shares_b):
                      feasible_totals.append(total)
              feasible_totals.sort()

              bands = {
                  "low": [x for x in feasible_totals if x <= b_low_mid],
                  "mid": [x for x in feasible_totals if b_low_mid < x <= b_mid_high],
                  "high": [x for x in feasible_totals if x > b_mid_high],
              }

              comparison_result = {
                  "anchors": anchors,
                  "boundaries": {
                      "low_mid_midpoint": b_low_mid,
                      "mid_high_midpoint": b_mid_high,
                  },
                  "component_feasible_total_count": len(feasible_totals),
                  "scales": {},
              }

              for scale_label, _q in g.SCALE_QUANTILES:
                  anchor = anchors[scale_label]
                  band_goals = sorted(
                      bands[scale_label],
                      key=lambda x: (abs(float(x) - anchor), float(x)),
                  )

                  attempts = []
                  resolved = None
                  for side_limit in candidate_limits:
                      g.SIDE_CANDIDATE_LIMIT = side_limit
                      test_challenges = []
                      test_skipped = []
                      appearance_counts = Counter()
                      used_signatures = set()

                      info = {
                          "label": scale_label,
                          "anchor_total_fv": anchor,
                          "candidate_goal_totals": [float(x) for x in band_goals],
                      }
                      built = g.add_cell(
                          test_challenges,
                          test_skipped,
                          players,
                          appearance_counts,
                          used_signatures,
                          info,
                          family="fragmentation_filler",
                          cell_id=f"frag_{comparison_label}",
                          shares_a=shares_a,
                          shares_b=shares_b,
                          target_reps=g.FRAG_TARGET_REPS,
                          split="train",
                          fit_eligible=True,
                          treatment=f"{g.profile_label(shares_a)}_vs_{g.profile_label(shares_b)}",
                      )

                      used_goals = [float(c["goal_total_fv"]) for c in test_challenges]
                      max_drift = (
                          max(abs(x - anchor) / anchor for x in used_goals)
                          if used_goals else None
                      )
                      attempt = {
                          "side_candidate_limit": side_limit,
                          "built_reps": int(built),
                          "used_goal_totals": used_goals,
                          "max_anchor_drift_pct": max_drift,
                      }
                      attempts.append(attempt)

                      if built >= g.FRAG_TARGET_REPS:
                          resolved = {
                              "minimum_tested_side_candidate_limit_for_5_reps": side_limit,
                              "used_goal_totals": used_goals,
                              "max_anchor_drift_pct": max_drift,
                          }
                          break

                  comparison_result["scales"][scale_label] = {
                      "band_component_feasible_goal_count": len(band_goals),
                      "band_goal_min": min(band_goals) if band_goals else None,
                      "band_goal_max": max(band_goals) if band_goals else None,
                      "attempts": attempts,
                      "five_rep_solution_found": resolved is not None,
                      "solution": resolved,
                  }

              separated_band_results[comparison_label] = comparison_result

          g.SIDE_CANDIDATE_LIMIT = original_side_limit

          all_cells_resolved = all(
              scale_info["five_rep_solution_found"]
              for comparison in separated_band_results.values()
              for scale_info in comparison["scales"].values()
          )

          report = {
              "status": "audit_complete",
              "mutates_repository": False,
              "scientific_tolerances_changed": False,
              "current_catalog": {
                  "challenge_count": len(challenges),
                  "fragmentation_scale_summary": current_scale_summary,
                  "cross_scale_exact_side_repeat_signature_count": len(cross_scale_repeats),
                  "cross_scale_exact_side_repeats": cross_scale_repeats,
                  "diversity": catalog["catalog_diagnostics"]["diversity"],
              },
              "separated_band_test": {
                  "band_definition": "midpoints_between_frozen_scale_anchors",
                  "candidate_limits_tested_adaptively": candidate_limits,
                  "all_fragmentation_scale_cells_support_5_reps": all_cells_resolved,
                  "results": separated_band_results,
              },
          }

          REPORT_PATH.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("=== PACKAGE ADJUSTMENT NEXTGEN V2 SCALE INTEGRITY AUDIT ===")
          print(json.dumps(report, indent=2, sort_keys=True))
          print("=== END SCALE INTEGRITY AUDIT ===")

          assert len(challenges) == 144
          assert catalog["frozen"] is False
          assert catalog["research_only"] is True
          assert catalog["production_formula_enabled"] is False
          assert REPORT_PATH.is_file()
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-scale-integrity-audit
          path: /tmp/package-adjustment-nextgen-v2-scale-integrity-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove audit wrote nothing to repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code
          git diff --cached --exit-code
          echo "PASS: scale-integrity audit made no repository changes."

      - name: Revalidate production Package Adjustment after audit
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
