# One-time, completed-outcomes-only recovery while roster 7 is short one kicker.
name: A-RG08 - Isolated 2026 Realized Outcomes Capture
run-name: A-RG08 ${{ inputs.mode }} - update completed outcomes, frozen identities unchanged
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: PREVIEW_ONLY validates without pushing; APPLY commits outcomes only
        required: true
        type: choice
        default: PREVIEW_ONLY
        options:
        - PREVIEW_ONLY
        - APPLY
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  capture:
    name: Isolated outcomes; Team Utility artifact intentionally deferred
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Check out latest main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install outcome capture dependency
      run: python3 -m pip install --disable-pip-version-check "requests>=2.32,<3"
    - name: Check one-time exception window and pin immutable sources
      shell: bash
      run: "set -euo pipefail\ntest \"$(date -u +%s)\" -lt \"$(date -u -d '2026-11-08T00:00:00Z' +%s)\" || { echo 'Temporary exception\
        \ expired'; exit 1; }\ntest -z \"$(git status --porcelain=v1 --untracked-files=all)\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/rg08_base.txt\"\
        \nsha256sum index.html free-agent-board.html \\\n   research/model-history/identity/2026-w06-sleeper-registry.json \\\n   data/league_rosters.json\
        \ data/free_agents.json data/free_agent_utility_v1.json \\\n   scripts/validation/capture_realized_outcomes.py \\\n   scripts/validation/repo_regression_checks.py\
        \ \\\n   scripts/validation/snapshot_values.py scripts/model/ppg_pipeline.py \\\n   scripts/projections/build_team_utility_lineup_projections.py\
        \ \\\n   scripts/artifacts/generated/team_utility_lineup_projections.json \\\n   scripts/artifacts/reports/team_utility_lineup_projection_report.md\
        \ \\\n   > \"$RUNNER_TEMP/rg08_protected.sha\"\necho 'PASS: protected scripts, historic identity, live valuations, and roster\
        \ files fingerprinted.'\n"
    - name: Capture updated completed realized outcomes (runner only)
      shell: bash
      run: "set -euo pipefail\npython3 scripts/validation/capture_realized_outcomes.py --selftest\npython3 scripts/validation/capture_realized_outcomes.py\n\
        python3 - <<'PYTHON'\nimport json, math, os, subprocess, sys\nfrom pathlib import Path\nnew = json.loads(Path('research/model-history/outcomes/2026.json').read_text(encoding='utf-8'))\n\
        old = json.loads(subprocess.check_output(['git','show','HEAD:research/model-history/outcomes/2026.json'], text=True))\nassert\
        \ new['schema_version'] == 1 and new['season'] == '2026'\nassert new['model_key_count'] == new['resolved_model_key_count'] ==\
        \ 565\nassert new['identity_coverage_pct'] == 100.0\nassert not new['unresolved_model_keys']\nassert new['identity_source']\
        \ == 'research/model-history/identity/2026-w06-sleeper-registry.json'\nassert new['scoring_source'] == 'scripts/model/ppg_pipeline.py::score_week'\n\
        assert new['unique_resolved_sleeper_ids'] == old['unique_resolved_sleeper_ids'], 'Stable ID collision count changed'\nold_weeks\
        \ = set(map(int, old.get('weeks', {})))\nnew_weeks = set(map(int, new.get('weeks', {})))\nassert old_weeks <= new_weeks, f'Previously\
        \ captured weeks disappeared: {old_weeks - new_weeks}'\nassert new_weeks, 'No live realized outcomes returned'\nassert sorted(new_weeks)\
        \ == new['weeks_with_realized_data']\nstate = new.get('sleeper_state_at_refresh') or {}\nassert str(state.get('season')) ==\
        \ '2026', f'Sleeper returned unexpected season: {state}'\ncurrent_week = int(state.get('week') or 0)\nassert 1 <= current_week\
        \ <= 18, f'Unexpected live NFL week: {current_week}'\nassert all(w < current_week for w in new_weeks), (\n    f'Current/incomplete\
        \ week {current_week} contains data. Refuse to label a partial week realized.'\n)\nfor week, payload in new['weeks'].items():\n\
        \    players = payload['players']\n    ids = [str(p['sleeper_id']) for p in players]\n    assert len(players) == payload['player_count']\
        \ and len(ids) == len(set(ids)), week\n    assert all(math.isfinite(float(p['fantasy_points'])) for p in players), week\nassert\
        \ new['scoring_source_sha256'] == __import__('hashlib').sha256(\n    Path('scripts/model/ppg_pipeline.py').read_bytes()).hexdigest()\n\
        changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()\nassert changed in ([], ['research/model-history/outcomes/2026.json']),\
        \ f'Unexpected modified paths: {changed}'\nwith open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:\n    f.write('##\
        \ A-RG08 isolated realized-outcome capture\\n')\n    f.write(f'- Model identities: **{new[\"resolved_model_key_count\"]}/565**\\\
        n')\n    f.write(f'- Recorded completed weeks: **{sorted(new_weeks)}**\\n')\n    f.write(f'- Existing completed weeks preserved:\
        \ **{sorted(old_weeks)}**\\n')\n    f.write(f'- New weeks: **{sorted(new_weeks-old_weeks)}**\\n')\n    f.write('- Deferred:\
        \ Team Utility 17-slot projection (Jersey Bagels kicker)\\n')\nprint('PASS: 565 stable IDs, completed-week targets present,\
        \ old weeks retained, no partial week')\nprint('Weeks:', sorted(new_weeks), 'new:', sorted(new_weeks-old_weeks))\nPYTHON\n"
    - name: Re-confirm temporary kicker exception without changing lineup artifact
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYTHON'\nfrom collections import Counter\nfrom pathlib import Path\nimport json, subprocess,\
        \ sys\nsys.path.insert(0, 'scripts/projections')\nimport build_team_utility_lineup_projections as b\nrosters = json.loads(Path('data/league_rosters.json').read_text())\n\
        positions = json.loads(Path('scripts/artifacts/generated/player_positions.json').read_text())\nassert len(rosters['rosters'])\
        \ == 12 and b.EXPECTED_STARTERS == 17\nrequirements = list(b.DEDICATED) + [(label, n) for label, _, n in b.FLEXES]\nproblems\
        \ = []\nfor roster in rosters['rosters']:\n    active = []\n    for slot in ('starters', 'bench'):\n        for item in roster.get(slot)\
        \ or []:\n            sid = str(item.get('player_id') or '')\n            pos = b.roster_position(item, positions)\n       \
        \     if sid and pos:\n                active.append(b.RosterPlayer(sleeper_id=sid, name=item.get('name') or sid, pos=pos, projection=0.0))\n\
        \    selected, _ = b.optimize_projection_lineup(active)\n    labels = Counter(name for name, p in selected)\n    missing = {name:n-labels[name]\
        \ for name, n in requirements if labels[name]!=n}\n    if missing:\n        problems.append((roster.get('roster_id'),roster.get('team_name'),len(selected),missing,sum(p.pos=='K'\
        \ for p in active)))\nassert not problems or problems == [(7, 'Jersey Bagels', 16, {'K': 1}, 0)], (\n  f'Unexpected roster problem;\
        \ not a permitted deferral: {problems}'\n)\nprint('Lineup coverage:', 'TEMPORARY DEFERRAL roster7 missing K' if problems else\
        \ 'All full')\n# Even if lineups are full, this workflow is only authorized to update outcomes,\n# never the lineup artifact.\
        \ Preserve last committed projections unchanged.\nfor path in ('scripts/artifacts/generated/team_utility_lineup_projections.json',\n\
        \             'scripts/artifacts/reports/team_utility_lineup_projection_report.md'):\n    assert subprocess.run(['git','diff','--quiet','--',path],check=False).returncode==0,\
        \ path\nPYTHON\nnode --check scripts/team_utility_projection_runtime.js\nnode scripts/team_utility_projection_runtime.js --selftest\n\
        python3 scripts/projections/build_team_utility_lineup_projections.py --selftest\n"
    - name: Run all 13 unaffected repository regression groups; defer only stale lineup artifact
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYTHON'\nimport sys\nsys.path.insert(0, 'scripts/validation')\nimport repo_regression_checks\
        \ as r\n# Run every other production regression group. The separate Team Utility\n# artifact freshness check is intentionally\
        \ DEFERRED, never represented as passing.\nchecks = [\n r.check_snapshot_parity,\n r.check_position_rules_and_free_agents,\n\
        \ r.check_dual_eligibility_audit,\n r.check_team_identity,\n r.check_aliases_and_ktc_positions,\n r.check_idp_v1_projection_invariants,\n\
        \ r.check_canonical_history_and_v1_bridge,\n r.check_preferred_bake_preview_invariants,\n r.check_deployed_idp_v1_invariants,\n\
        \ r.check_free_agent_board_parity,\n r.check_package_adjustment_live.validate,\n r.check_package_sampling_contract,\n r.check_index_js_syntax,\n\
        ]\nfor check in checks:\n    check()\nprint(f'PASS: {len(checks)} other regression groups; Team Utility artifact freshness explicitly\
        \ DEFERRED')\nPYTHON\npython3 scripts/validation/validate_free_agent_utility_v1.py\nsha256sum --check \"$RUNNER_TEMP/rg08_protected.sha\"\
        \ngit diff --check\ntest \"$(git diff --name-only)\" = 'research/model-history/outcomes/2026.json'\n"
    - name: Upload outcome capture proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: A-RG08-outcomes-${{ inputs.mode }}-${{ github.run_id }}
        retention-days: 14
        if-no-files-found: warn
        path: '${{ runner.temp }}/rg08_protected.sha

          ${{ runner.temp }}/rg08_base.txt'
    - name: APPLY outcomes-only commit
      if: ${{ inputs.mode == 'APPLY' }}
      shell: bash
      run: "set -euo pipefail\n test \"$(git rev-parse HEAD)\" = \"$(cat \"$RUNNER_TEMP/rg08_base.txt\")\"\n test \"$(git diff --name-only)\"\
        \ = 'research/model-history/outcomes/2026.json'\n git config user.name 'github-actions[bot]'\n git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        \ git add -- research/model-history/outcomes/2026.json\n git diff --cached --name-only | grep -Fxq 'research/model-history/outcomes/2026.json'\n\
        \ git commit -m 'A-RG08: refresh realized 2026 outcomes without stale Team Utility artifact'\n git push origin HEAD:main\n"
