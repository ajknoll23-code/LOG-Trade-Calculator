name: A-NL12R1 - LOG branded PDF newsletter source update
run-name: A-NL12R1 ${{ inputs.mode }} - exact LOG logo and no unrostered section

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY verifies source + synthetic PDF; APPLY_CONTENT_ONLY commits only newsletter source/tests/docs.'
        type: choice
        required: true
        options: [PREVIEW_ONLY, APPLY_CONTENT_ONLY]
        default: PREVIEW_ONLY

permissions:
  contents: write
concurrency:
  group: a-nl12r1-source-install
  cancel-in-progress: false

jobs:
  install-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'weasyprint==68.0'
      - name: Verify reviewed source and protected calculator files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'scripts/newsletters/league_newsletter.py': '5b0fd404ad541411ac3a0048ea788754ea6f5734ac6ac9e934807a8648e197d5',
            'tests/newsletters/test_newsletter.py': 'cb8cef522e54ed6e37fec224ef8306ebfd41a7751024a8fa95ca152810185ba5'
          }
          for name,sha in expected.items():
              got=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert got==sha, f'Newsletter source changed since review: {name}'
          print('PASS: reviewed source hashes match')
          PY
          sha256sum index.html free-agent-board.html config.json scripts/validation/repo_regression_checks.py scripts/validation/snapshot_values.py > "$RUNNER_TEMP/nl12_protected.sha"
