      - name: Generate synthetic LOG branded visual proof with actual website logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nl12proof"
          python3 - <<'PY'
          from importlib.util import spec_from_file_location,module_from_spec
          from pathlib import Path
          from weasyprint import HTML
          import os
          s=spec_from_file_location('engine','scripts/newsletters/league_newsletter.py')
          eng=module_from_spec(s);s.loader.exec_module(eng)
          s2=spec_from_file_location('fixtures','tests/newsletters/test_newsletter.py')
          f=module_from_spec(s2);s2.loader.exec_module(f)
          eng.read_repo_json=lambda rel,default=None: default
          assert eng.log_site_logo_data_uri().startswith('data:image/png;base64,')
          for edition in ('pre','post'):
              p=eng.build_payload(f.make_api(final=True),{'league_id':'league26','season':'2026'},edition,9)
              assert len(p['games'])==6 and 'free_agents' not in p
              html=eng.render_html(p)
              assert "class='brand-logo'" in html and 'data:image/png;base64,' in html
              assert 'Unrostered Players to Investigate' not in html
              assert 'Free agent watch' not in eng.render_text(p)
              dest=Path(os.environ['RUNNER_TEMP'])/'nl12proof'/f'LOG-newsletter-{edition}-SYNTHETIC-proof.pdf'
              pdf=HTML(string=html,base_url=str(Path.cwd())).render()
              assert 1<=len(pdf.pages)<=12, len(pdf.pages)
              pdf.write_pdf(dest)
              assert dest.read_bytes().startswith(b'%PDF-') and dest.stat().st_size>10000
              print('PASS: branded synthetic PDF',edition,len(pdf.pages),'pages',dest.stat().st_size,'bytes')
          PY
      - name: Verify protected files and exact staged diff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/nl12_protected.sha"
          git diff --check
          git add -- scripts/newsletters/league_newsletter.py tests/newsletters/test_newsletter.py docs/LOOG-newsletter-setup.md
          python3 - <<'PY'
          import subprocess
          expected={'scripts/newsletters/league_newsletter.py','tests/newsletters/test_newsletter.py','docs/LOOG-newsletter-setup.md'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==expected, f'Unexpected staged files: {changed}'
          print('PASS: exactly 3 newsletter-only files staged; no workflows or calculator values touched')
          PY
      - name: APPLY source-only commit (no workflow token required)
        if: ${{ inputs.mode == 'APPLY_CONTENT_ONLY' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-NL12R1: LOG website logo PDF design, remove unrostered section'
          git push origin HEAD:main
      - name: Upload synthetic visual proof PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-NL12R1-LOG-PDF-proof-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nl12proof/*.pdf
          retention-days: 30
          if-no-files-found: warn
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## A-NL12R1 LOG newsletter source refresh' >> "$GITHUB_STEP_SUMMARY"
          echo '- No email, no calculator valuation or frozen research changes' >> "$GITHUB_STEP_SUMMARY"
          echo '- Synthetic PDF proof uses the exact logo from index.html' >> "$GITHUB_STEP_SUMMARY"
          echo '- After source APPLY succeeds, manually upload A-NL01R5.yml to create live scheduled PDF newsletters' >> "$GITHUB_STEP_SUMMARY"
