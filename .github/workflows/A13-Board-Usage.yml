name: A - FA13R1 Rising Usage Evidence on Free Agent Board (Guarded)

# Preview by default. Apply edits free-agent-board.html ONLY; no FV/MV or data changes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first, or explicitly apply board-only presentation update'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  board-evidence-overlay:
    name: Validate and optionally deploy fixed Week 7 watch evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm untouched repository baseline and source registry
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git hash-object research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json)" = "f5d005b6a37a33444be76ec28e6b6a98174af47b"
          test -s free-agent-board.html
          test -s index.html

      - name: Build display-only research panel and verify no canonical code edits
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa13r1
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          cat > "$REPORT_DIR/fa13r1_patcher.py" <<'PYCODE'
          #!/usr/bin/env python3
          """FA13R1 display-only frozen research overlay for canonical Free Agent Board.
          Does not edit value functions, data, or frozen research; no player ranks changed.
          """
          import json
          import re
          import subprocess
          from pathlib import Path

          BOARD = Path('free-agent-board.html')
          WATCH = Path('research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json')
          STYLE = '''
          /* FA13R1 RESEARCH PANEL: display-only, no valuation or sort changes */
          .fa13-copy{padding:11px 13px;color:var(--text-muted);font:10.5px/1.5 'IBM Plex Mono',monospace;border-bottom:1px solid var(--line)}
          .fa13-error{color:var(--red)}
          .fa13-lane{font:700 10px 'IBM Plex Mono',monospace;padding:10px 13px;background:rgba(9,27,44,.28);color:var(--text)}
          .fa13-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 13px;border-bottom:1px solid var(--line)}
          .fa13-row:last-child{border-bottom:0}
          .fa13-title{font-size:12px;color:var(--text);font-weight:700}
          .fa13-meta{font:9.5px/1.5 'IBM Plex Mono',monospace;color:var(--text-muted);margin-top:4px}
          .fa13-pts{min-width:92px;text-align:right;font:9.5px/1.5 'IBM Plex Mono',monospace;color:var(--text-muted)}
          .fa13-plus{color:var(--green)}
          @media(max-width:430px){.fa13-row{gap:8px;padding:9px}.fa13-pts{min-width:75px}}
          '''
          SECTION = '''
            <!-- FA13R1: Week 7 research watch, additive to Free Agent Board; no price changes. -->
            <section aria-label="Rising usage watch research">
              <details id="fa13ResearchPanel">
                <summary>Rising Usage Watch <span id="fa13Count" style="color:var(--text-dim);font-weight:400;">(2026 W5–7)</span></summary>
                <div class="fa13-copy">Frozen pre-Week 9 study of 42 players. Snap/point changes describe Week 7 versus Weeks 5–6; these are NOT validated breakout predictions, pickup recommendations, or FV/MV adjustments. Only players in the latest loaded free-agent pool appear below.</div>
                <div id="fa13Status" class="fa13-copy" role="status">Loading research watchlist…</div>
                <div id="fa13Items"></div>
              </details>
            </section>
          '''
          JS = r'''<script id="fa13r1-frozen-research-watch">
          /* Display-only overlay, deliberately isolated from canonical Trade Desk pricing. */
          (async function(){
            'use strict';
            const status=document.getElementById('fa13Status');
            const count=document.getElementById('fa13Count');
            const out=document.getElementById('fa13Items');
            if(!status||!count||!out||typeof fetch!=='function') return;
            const base='https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/main/';
            const path='research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json';
            const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const fmt=x=>x.toFixed(1);
            const delta=x=>(x>0?'+':'')+fmt(x);
            try{
              const [wr,ar]=await Promise.all([fetch(base+path+'?t='+Date.now(),{cache:'no-store'}),fetch(base+'data/free_agents.json?t='+Date.now(),{cache:'no-store'})]);
              if(!wr.ok||!ar.ok)throw new Error('source HTTP error');
              const frozen=await wr.json(),current=await ar.json();
              if(frozen.schema_version!==1||frozen.classification!=='FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION'||
                 frozen.registered_for_season!==2026||frozen.registered_for_week!==9||
                 !Array.isArray(frozen.usage_and_scoring_feature_weeks)||frozen.usage_and_scoring_feature_weeks.join(',')!=='5,6,7'||
                 !frozen.counts||frozen.counts.watch_total!==42||
                 frozen.predictive_accuracy_established!==false||frozen.pricing_changes_authorized!==false||
                 !Array.isArray(frozen.players)||frozen.players.length!==42||
                 !Array.isArray(current.free_agents)||current.count!==current.free_agents.length){throw new Error('frozen source validation');}
              const available=new Set(current.free_agents.map(p=>String(p.player_id)+'|'+p.pos));
              const seen=new Set();
              for(const p of frozen.players){
                const key=String(p.player_id)+'|'+String(p.position);
                if(seen.has(key)||!['DYNASTY_STASH','SHORT_TERM_UTILITY'].includes(p.shadow_lane)||
                   ![p.week7_snaps,p.week7_snap_increase_vs_w5w6_mean,p.week7_LOG_pts,p.week7_LOG_pts_increase_vs_w5w6_mean].every(Number.isFinite)||
                   p.prediction_probability!==null)throw new Error('invalid evidence row');
                seen.add(key);
              }
              if(seen.size!==42)throw new Error('duplicate IDs');
              const shown=frozen.players.filter(p=>available.has(String(p.player_id)+'|'+p.position));
              shown.sort((a,b)=>Number(b.shadow_lane==='DYNASTY_STASH')-Number(a.shadow_lane==='DYNASTY_STASH')||
                b.week7_LOG_pts_increase_vs_w5w6_mean-a.week7_LOG_pts_increase_vs_w5w6_mean||a.name.localeCompare(b.name));
              count.textContent='('+shown.length+' in current free-agent snapshot / 42 frozen)';
              status.textContent='Free-agent snapshot synced '+new Date(Number(current.synced_at)*1000).toLocaleString()+'. Availability and Week 7 research evidence are from different dates; confirm eligibility before any claim.';
              const html=[];
              for(const [lane,label] of [['DYNASTY_STASH','Dynasty Stash · Younger Players'],['SHORT_TERM_UTILITY','Short-Term Usage · Veterans']]){
                const group=shown.filter(p=>p.shadow_lane===lane);
                html.push('<div class="fa13-lane">'+esc(label)+' ('+group.length+')</div>');
                for(const p of group){
                  html.push('<div class="fa13-row" data-player-id="'+esc(p.player_id)+'"><div><div class="fa13-title">'+esc(p.name)+'</div>'+
                    '<div class="fa13-meta">'+esc(p.position)+' · '+esc(p.team_at_2026W09_freeze)+' (team at freeze) · W7 snaps '+fmt(p.week7_snaps)+' ('+delta(p.week7_snap_increase_vs_w5w6_mean)+')</div></div>'+
                    '<div class="fa13-pts'+(p.week7_LOG_pts_increase_vs_w5w6_mean>=5?' fa13-plus':'')+'">W7 LOG '+fmt(p.week7_LOG_pts)+'<div>'+delta(p.week7_LOG_pts_increase_vs_w5w6_mean)+' pts vs W5–6</div></div></div>');
                }
                if(!group.length)html.push('<div class="fa13-copy">No players in this lane are in the latest available free-agent pool.</div>');
              }
              out.innerHTML=html.join('');
            }catch(error){
              count.textContent='(unavailable)';
              status.classList.add('fa13-error');
              status.textContent='Research panel unavailable. The standard board, rankings and valuations are unaffected.';
              out.textContent='';
            }
          })();
          </script>
          '''


          def edit(src):
              if 'fa13r1-frozen-research-watch' in src:
                  raise ValueError('FA13R1 is already present; refuse duplicate insertion')
              mods = [
                  ('\n</style>\n\n<style id="free-agent-password-gate-styles">', STYLE + '\n</style>\n\n<style id="free-agent-password-gate-styles">'),
                  ('  <div id="boardWrap"></div>', SECTION + '  <div id="boardWrap"></div>'),
                  ('loadFreeAgents();\n</script>\n<script id="free-agent-app-shell-runtime">', 'loadFreeAgents();\n</script>\n' + JS + '<script id="free-agent-app-shell-runtime">'),
              ]
              dst = src
              for old,new in mods:
                  if dst.count(old)!=1: raise ValueError('Unique HTML anchor missing: '+repr(old[:80]))
                  dst=dst.replace(old,new,1)
              # Exact reversal proves no canonical pricing, utility rankings, or UI code was altered.
              reverse=dst
              for old,new in reversed(mods):
                  if reverse.count(new)!=1:raise ValueError('Reverse patch did not have exactly one anchor')
                  reverse=reverse.replace(new,old,1)
              if reverse!=src:raise ValueError('Original board differs beyond isolated insertions')
              return dst


          def validate_source():
              doc=json.loads(WATCH.read_text())
              assert doc['classification']=='FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION'
              assert doc['registered_for_week']==9 and doc['registered_for_season']==2026
              assert doc['counts']['watch_total']==42 and len(doc['players'])==42
              assert len(set((str(p['player_id']),p['position']) for p in doc['players']))==42
              assert doc['pricing_changes_authorized'] is False
              assert doc['predictive_accuracy_established'] is False
              assert doc['usage_and_scoring_feature_weeks']==[5,6,7]
              return doc


          def check_js(html):
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
              assert len(scripts)>=4, len(scripts)
              for i,script in enumerate(scripts):
                  result=subprocess.run(['node','--check'],input=script,text=True,capture_output=True)
                  if result.returncode:raise ValueError('JavaScript parse failed script '+str(i)+': '+result.stderr)
              return len(scripts)


          def main():
              doc=validate_source()
              original=BOARD.read_text()
              assert '<script id="fa13r1-frozen-research-watch">' not in original
              patched=edit(original)
              checked=check_js(patched)
              BOARD.write_text(patched)
              print(json.dumps({'status':'FA13R1_PREVIEW_PASS','frozen_watch_count':len(doc['players']),'compiled_scripts':checked,
                'board_bytes_before':len(original),'board_bytes_after':len(patched),'canonical_board_edit':'zero original bytes changed',
                'pricing_changed':False,'production_data_changed':False}))

          if __name__=='__main__':main()
          PYCODE
          python3 "$REPORT_DIR/fa13r1_patcher.py" | tee "$REPORT_DIR/FA13R1_diagnostics.json"
          git diff --check
          test "$(git diff --name-only)" = "free-agent-board.html"
          git diff -- free-agent-board.html > "$REPORT_DIR/FA13R1_board_only.diff"
          test -s "$REPORT_DIR/FA13R1_board_only.diff"
          cp free-agent-board.html "$REPORT_DIR/FA13R1_free_agent_board_preview.html"

      - name: Canonical valuation synchronizer must remain in parity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync/sync_free_agent_valuation.py --check

      - name: Full free-agent valuation parity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_free_agent_valuation_parity.py

      - name: Upload proposed board and diagnostics regardless of Apply
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA13R1_RESEARCH_WATCH_BOARD_PREVIEW
          path: |
            ${{ runner.temp }}/a-fa13r1/FA13R1_diagnostics.json
            ${{ runner.temp }}/a-fa13r1/FA13R1_board_only.diff
            ${{ runner.temp }}/a-fa13r1/FA13R1_free_agent_board_preview.html
          if-no-files-found: warn
          retention-days: 90

      - name: Apply board-only UI update
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "free-agent-board.html"
          git add -- free-agent-board.html
          test "$(git diff --cached --name-only)" = "free-agent-board.html"
          git diff --cached --check
          git config user.name 'a-fa13-board-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'A FA13R1: show frozen rising-usage watch on Free Agent Board (UI only)'
          git push origin HEAD:main
          echo 'PASS: board presentation updated; FV/MV and frozen study untouched'

      - name: Preview result (no repository write)
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'PASS Preview. Run Apply only after reviewing the guarded UI diff.'
