name: KTC Cap Sensitivity Research

# Temporary/manual research workflow for evaluating the voter-balance lifetime
# effective-vote cap. This does not change Market Value V1 or production model
# consumers. Once the cap policy is settled, this can be folded into the normal
# KTC/Scheduled Data Refresh workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  analyze-cap-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate canonical player-position lookup
        run: python3 scripts/utilities/generate_player_positions.py

      - name: Refresh KTC vote ratings from current vote sheet
        run: python3 scripts/market/ktc_pipeline.py

      - name: KTC cap-sensitivity self-test
        run: python3 scripts/market/analyze_ktc_cap_sensitivity.py --selftest

      - name: Build KTC cap-sensitivity research analysis
        run: python3 scripts/market/analyze_ktc_cap_sensitivity.py --write

      - name: Verify KTC cap-sensitivity research analysis
        run: python3 scripts/market/analyze_ktc_cap_sensitivity.py --check

      - name: Refresh voter-balance comparison report
        run: python3 scripts/market/analyze_ktc_voter_balance.py --write

      - name: Verify voter-balance comparison report
        run: python3 scripts/market/analyze_ktc_voter_balance.py --check

      - name: Commit research outputs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/artifacts/generated/ktc_ratings.json
          git add scripts/artifacts/generated/player_positions.json
          git add scripts/artifacts/generated/ktc_cap_sensitivity.json
          git add scripts/artifacts/reports/ktc_cap_sensitivity.md
          git add scripts/artifacts/generated/ktc_voter_balance_analysis.json
          git add scripts/artifacts/reports/ktc_voter_balance_analysis.md
          git diff --staged --quiet || git commit -m "Add KTC cap sensitivity research results"
          git push origin main
