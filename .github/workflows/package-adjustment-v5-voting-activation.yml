name: Package Adjustment V5 Voting Activation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate-v5-voting:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install regression dependency
        run: pip install requests

      - name: Baseline permanent Package Adjustment validator
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Baseline full repository regression
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Install V5 vote pipeline
        shell: bash
        run: |
          cat > scripts/market/package_vote_v5_pipeline.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import io
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          import sys

          import requests

          SCRIPT_DIR = Path(__file__).resolve().parent
          ROOT = SCRIPT_DIR.parents[1]
          sys.path.insert(0, str(SCRIPT_DIR))
          import ktc_pipeline

          CHALLENGES = ROOT / "research/package-adjustment-v5/package_vote_challenges_v5.json"
          RELEASE = ROOT / "research/package-adjustment-v5/release_manifest.json"
          OUT_JSON = ROOT / "research/package-adjustment-v5/package_vote_v5_results.json"
          OUT_MD = ROOT / "research/package-adjustment-v5/package_vote_v5_results.md"

          PREFIX = "__pkgv5__|"
          META_PREFIX = "__pkgv5_meta__|"
          SCHEMA_MARKER = "__pkgv5_schema__|5"

          MAX_VOTES_PER_VOTER_PER_DAY = 20
          VOTER_EFFECTIVE_LIFETIME_CAP = 30.0

          MIN_VOTES = 500
          MIN_VOTERS = 12
          MIN_CHALLENGES = 180
          MIN_TARGETS = 14
          MIN_EACH_CHOICE = 75
          MIN_VOTES_PER_COMPOSITION = 50
          MIN_VOTES_PER_COMPOSITION_RATIO_CELL = 10


          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))


          def parse_timestamp_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)


          def fetch_rows():
              r = requests.get(ktc_pipeline.SHEET_CSV_URL, timeout=30)
              r.raise_for_status()
              return list(csv.DictReader(io.StringIO(r.text)))


          def is_package_v5_row(row):
              return str(row.get("keep") or "").startswith(PREFIX)


          def parse_row(row):
              parts = str(row.get("keep") or "").split("|")
              if len(parts) != 3 or parts[0] != "__pkgv5__" or parts[2] not in {"T", "P"}:
                  return None
              meta = str(row.get("trade") or "")
              left = meta[len(META_PREFIX):] if meta.startswith(META_PREFIX) else None
              if left not in {"T", "P"}:
                  left = None
              if str(row.get("cut") or "") != SCHEMA_MARKER:
                  return None
              return {
                  "timestamp": row.get("timestamp") or "",
                  "voter_roster_id": str(row.get("voter_roster_id") or ""),
                  "challenge_id": parts[1],
                  "choice": parts[2],
                  "left_canonical_side": left,
              }


          def filter_after_release(rows, release):
              cutoff = parse_timestamp_utc(release["released_at_utc"])
              if cutoff is None:
                  raise RuntimeError("invalid V5 release timestamp")
              kept = []
              pre = 0
              invalid = 0
              for row in rows:
                  ts = parse_timestamp_utc(row.get("timestamp"))
                  if ts is None:
                      invalid += 1
                      continue
                  if ts <= cutoff:
                      pre += 1
                      continue
                  kept.append(row)
              return kept, pre, invalid


          def apply_daily_cap(rows):
              rows = sorted(
                  rows,
                  key=lambda r: (str(r.get("timestamp") or ""), str(r.get("voter_roster_id") or "")),
              )
              counts = defaultdict(int)
              kept = []
              dropped = 0
              for row in rows:
                  day = str(row.get("timestamp") or "")[:10]
                  voter = str(row.get("voter_roster_id") or "")
                  if not day or not voter:
                      continue
                  key = (voter, day)
                  if counts[key] >= MAX_VOTES_PER_VOTER_PER_DAY:
                      dropped += 1
                      continue
                  counts[key] += 1
                  kept.append(row)
              return kept, dropped


          def voter_weights(rows):
              counts = defaultdict(int)
              for row in rows:
                  counts[row["voter_roster_id"]] += 1
              return {
                  voter: {
                      "raw_votes": count,
                      "ballot_weight": min(1.0, VOTER_EFFECTIVE_LIFETIME_CAP / count),
                      "effective_votes": min(float(count), VOTER_EFFECTIVE_LIFETIME_CAP),
                  }
                  for voter, count in counts.items()
              }


          def weighted_choice_pct(rows, weights):
              if not rows:
                  return None
              package = 0.0
              total = 0.0
              for row in rows:
                  w = float(weights[row["voter_roster_id"]]["ballot_weight"])
                  total += w
                  if row["choice"] == "P":
                      package += w
              return None if total <= 0 else 100.0 * package / total


          def summarize(rows, doc):
              catalog = {c["id"]: c for c in doc["challenges"]}
              valid = [r for r in rows if r["challenge_id"] in catalog]
              unknown = len(rows) - len(valid)
              weights = voter_weights(valid)

              package_votes = sum(r["choice"] == "P" for r in valid)
              target_votes = sum(r["choice"] == "T" for r in valid)
              distinct_challenges = len({r["challenge_id"] for r in valid})
              distinct_targets = len({
                  catalog[r["challenge_id"]]["target"]["key"] for r in valid
              })

              left_known = [r for r in valid if r["left_canonical_side"] in {"T", "P"}]
              left_rate = (
                  100.0 * sum(r["choice"] == r["left_canonical_side"] for r in left_known) / len(left_known)
                  if left_known else None
              )

              compositions = list(doc["design"]["composition_labels"])
              by_composition = {}
              by_composition_ratio = {}

              for label in compositions:
                  ids = {
                      c["id"] for c in catalog.values()
                      if c["composition_target"]["label"] == label
                  }
                  sub = [r for r in valid if r["challenge_id"] in ids]
                  raw_p = sum(r["choice"] == "P" for r in sub)
                  by_composition[label] = {
                      "votes": len(sub),
                      "package_choice_pct": round(100.0 * raw_p / len(sub), 2) if sub else None,
                      "weighted_package_choice_pct": (
                          round(weighted_choice_pct(sub, weights), 2) if sub else None
                      ),
                      "distinct_challenges": len({r["challenge_id"] for r in sub}),
                      "distinct_targets": len({
                          catalog[r["challenge_id"]]["target"]["key"] for r in sub
                      }),
                  }

                  ratios = sorted({
                      float(c["ratio_target"]) for c in catalog.values()
                      if c["composition_target"]["label"] == label
                  })
                  cells = {}
                  for ratio in ratios:
                      cell_ids = {
                          c["id"] for c in catalog.values()
                          if c["composition_target"]["label"] == label
                          and abs(float(c["ratio_target"]) - ratio) < 1e-9
                      }
                      cell_rows = [r for r in valid if r["challenge_id"] in cell_ids]
                      raw_cp = sum(r["choice"] == "P" for r in cell_rows)
                      cells[f"{ratio:.2f}"] = {
                          "votes": len(cell_rows),
                          "package_choice_pct": (
                              round(100.0 * raw_cp / len(cell_rows), 2) if cell_rows else None
                          ),
                          "weighted_package_choice_pct": (
                              round(weighted_choice_pct(cell_rows, weights), 2) if cell_rows else None
                          ),
                          "distinct_targets": len({
                              catalog[r["challenge_id"]]["target"]["key"]
                              for r in cell_rows
                          }),
                      }
                  by_composition_ratio[label] = cells

              composition_coverage = all(
                  by_composition[label]["votes"] >= MIN_VOTES_PER_COMPOSITION
                  for label in compositions
              )
              cell_coverage = all(
                  row["votes"] >= MIN_VOTES_PER_COMPOSITION_RATIO_CELL
                  for cells in by_composition_ratio.values()
                  for row in cells.values()
              )

              gates = {
                  "counted_votes": len(valid) >= MIN_VOTES,
                  "unique_voters": len(weights) >= MIN_VOTERS,
                  "distinct_challenges": distinct_challenges >= MIN_CHALLENGES,
                  "distinct_targets": distinct_targets >= MIN_TARGETS,
                  "choice_mix": package_votes >= MIN_EACH_CHOICE and target_votes >= MIN_EACH_CHOICE,
                  "composition_coverage": composition_coverage,
                  "composition_ratio_cell_coverage": cell_coverage,
              }

              return {
                  "raw_vote_count": len(valid),
                  "unknown_challenge_rows": unknown,
                  "unique_voters": len(weights),
                  "distinct_challenges": distinct_challenges,
                  "distinct_targets": distinct_targets,
                  "package_votes": package_votes,
                  "target_votes": target_votes,
                  "package_choice_pct": (
                      round(100.0 * package_votes / len(valid), 2) if valid else None
                  ),
                  "weighted_package_choice_pct": (
                      round(weighted_choice_pct(valid, weights), 2) if valid else None
                  ),
                  "display_left_choice_pct": round(left_rate, 2) if left_rate is not None else None,
                  "by_composition": by_composition,
                  "by_composition_and_ratio": by_composition_ratio,
                  "voter_weights": weights,
                  "diagnostic_data_gates": {
                      "thresholds": {
                          "counted_votes": MIN_VOTES,
                          "unique_voters": MIN_VOTERS,
                          "distinct_challenges": MIN_CHALLENGES,
                          "distinct_targets": MIN_TARGETS,
                          "minimum_each_choice": MIN_EACH_CHOICE,
                          "minimum_votes_per_composition": MIN_VOTES_PER_COMPOSITION,
                          "minimum_votes_per_composition_ratio_cell": MIN_VOTES_PER_COMPOSITION_RATIO_CELL,
                      },
                      "passed": gates,
                      "all_passed": all(gates.values()),
                  },
              }


          def write_report(result):
              s = result["summary"]
              lines = [
                  "# Package Preference Voting V5 — Two-Player Composition Expansion",
                  "",
                  "**Status: RESEARCH ONLY — production V1.5 is unchanged.**",
                  "",
                  f"- Counted V5 votes: `{s['raw_vote_count']}`",
                  f"- Unique V5 voters: `{s['unique_voters']}`",
                  f"- Distinct challenges: `{s['distinct_challenges']}`",
                  f"- Distinct targets: `{s['distinct_targets']}`",
                  f"- Overall package choice rate: `{s['package_choice_pct']}`",
                  f"- Voter-capped weighted package choice rate: `{s['weighted_package_choice_pct']}`",
                  f"- Display-left choice rate: `{s['display_left_choice_pct']}`",
                  "",
                  "## By two-player composition",
                  "",
                  "| Composition | Votes | Package chosen | Weighted package chosen |",
                  "|---:|---:|---:|---:|",
              ]
              for label, row in s["by_composition"].items():
                  raw = "n/a" if row["package_choice_pct"] is None else f"{row['package_choice_pct']:.1f}%"
                  weighted = (
                      "n/a" if row["weighted_package_choice_pct"] is None
                      else f"{row['weighted_package_choice_pct']:.1f}%"
                  )
                  lines.append(f"| {label} | {row['votes']} | {raw} | {weighted} |")

              lines += ["", "## Composition × ratio cells", ""]
              for label, cells in s["by_composition_and_ratio"].items():
                  lines += [
                      f"### {label}",
                      "",
                      "| Ratio | Votes | Package chosen | Weighted package chosen |",
                      "|---:|---:|---:|---:|",
                  ]
                  for ratio, row in cells.items():
                      raw = "n/a" if row["package_choice_pct"] is None else f"{row['package_choice_pct']:.1f}%"
                      weighted = (
                          "n/a" if row["weighted_package_choice_pct"] is None
                          else f"{row['weighted_package_choice_pct']:.1f}%"
                      )
                      lines.append(f"| {ratio} | {row['votes']} | {raw} | {weighted} |")
                  lines.append("")

              lines += [
                  "## Diagnostic gates",
                  "",
                  f"- All passed: `{s['diagnostic_data_gates']['all_passed']}`",
              ]
              for key, passed in s["diagnostic_data_gates"]["passed"].items():
                  lines.append(f"- {key}: `{passed}`")

              lines += [
                  "",
                  "## Isolation",
                  "",
                  "- V5 is two-player composition research only.",
                  "- V3 and V4 remain frozen.",
                  "- V5 does not alter Fundamental Value, Market Value, Team Utility, draft-pick values, or the live Package Adjustment formula.",
                  "- No automatic production change is allowed from these results.",
                  "",
              ]
              OUT_MD.write_text("\n".join(lines), encoding="utf-8")


          def selftest():
              assert is_package_v5_row({"keep":"__pkgv5__|abc|P"})
              assert not is_package_v5_row({"keep":"__pkgv4__|abc|P"})
              parsed = parse_row({
                  "timestamp":"2026-09-09T00:00:00Z",
                  "voter_roster_id":"ext_x",
                  "keep":"__pkgv5__|abc|T",
                  "trade":"__pkgv5_meta__|P",
                  "cut":"__pkgv5_schema__|5",
              })
              assert parsed is not None
              assert parsed["challenge_id"] == "abc"
              assert parsed["choice"] == "T"
              assert parsed["left_canonical_side"] == "P"

              release = {"released_at_utc":"2026-09-09T00:00:00+00:00"}
              rows = [
                  {"timestamp":"2026-09-08T23:59:59Z"},
                  {"timestamp":"2026-09-09T00:00:00Z"},
                  {"timestamp":"2026-09-09T00:00:01Z"},
                  {"timestamp":"bad"},
              ]
              kept, pre, invalid = filter_after_release(rows, release)
              assert len(kept) == 1 and pre == 2 and invalid == 1

              caprows = [{
                  "timestamp":"2026-09-09T01:00:00Z",
                  "voter_roster_id":"ext_x",
                  "challenge_id":f"x{i}",
                  "choice":"P",
                  "left_canonical_side":"P",
              } for i in range(25)]
              capped, dropped = apply_daily_cap(caprows)
              assert len(capped) == 20 and dropped == 5
              print("Package Preference V5 pipeline self-test passed.")


          def main():
              if "--selftest" in sys.argv:
                  selftest()
                  return

              doc = read_json(CHALLENGES)
              release = read_json(RELEASE)

              if doc.get("status") != "frozen_package_preference_v5" or doc.get("frozen") is not True:
                  raise RuntimeError("unexpected/unfrozen V5 challenge catalog")
              if release.get("status") != "package_adjustment_v5_composition_vote_release":
                  raise RuntimeError("unexpected V5 release manifest")
              if release.get("frozen") is not True:
                  raise RuntimeError("V5 release manifest must be frozen")
              if release.get("production_formula_changed") is not False:
                  raise RuntimeError("V5 release manifest must not change production")

              raw = [parse_row(r) for r in fetch_rows() if is_package_v5_row(r)]
              raw = [r for r in raw if r is not None]
              source_raw_package_rows = len(raw)

              post, pre, invalid = filter_after_release(raw, release)
              capped, dropped = apply_daily_cap(post)
              summary = summarize(capped, doc)

              result = {
                  "schema_version": 5,
                  "status": "research_only",
                  "consumer_changed": False,
                  "market_value_consumer_changed": False,
                  "fundamental_value_consumer_changed": False,
                  "team_utility_consumer_changed": False,
                  "trade_verdict_consumer_changed": False,
                  "production_formula_enabled": False,
                  "automatic_production_change_allowed": False,
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "transport": "existing KTC Google Sheet via reserved __pkgv5__ rows",
                  "release_id": release["release_id"],
                  "released_at_utc": release["released_at_utc"],
                  "package_daily_cap_per_voter": MAX_VOTES_PER_VOTER_PER_DAY,
                  "voter_effective_lifetime_cap": VOTER_EFFECTIVE_LIFETIME_CAP,
                  "source_raw_package_rows": source_raw_package_rows,
                  "pre_release_rows_excluded": pre,
                  "invalid_timestamp_rows_excluded": invalid,
                  "post_release_rows": len(post),
                  "daily_cap_dropped": dropped,
                  "summary": summary,
              }

              OUT_JSON.parent.mkdir(parents=True, exist_ok=True)
              OUT_JSON.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              write_report(result)

              print(f"Wrote {OUT_JSON.relative_to(ROOT)}")
              print(f"Wrote {OUT_MD.relative_to(ROOT)}")
              print("V5 votes counted:", summary["raw_vote_count"])
              print("V5 maturity gates:", summary["diagnostic_data_gates"]["all_passed"])


          if __name__ == "__main__":
              main()

          PY
          chmod +x scripts/market/package_vote_v5_pipeline.py

      - name: Patch browser voting to V5 and freeze activation release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from datetime import datetime, timezone

          ROOT = Path(".")
          INDEX = ROOT / "index.html"
          CATALOG = ROOT / "research/package-adjustment-v5/package_vote_challenges_v5.json"
          RELEASE = ROOT / "research/package-adjustment-v5/release_manifest.json"
          REPORT = ROOT / "research/package-adjustment-v5/voting_activation.md"

          text = INDEX.read_text(encoding="utf-8")
          before = text


          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, got {count}")
              text = text.replace(old, new, 1)


          replace_once(
              "/* Package Preference Voting V4: 3-player indifference extension; shared transport only. */",
              "/* Package Preference Voting V5: two-player composition expansion; shared transport only. */",
              "package vote comment",
          )
          replace_once(
              "research/package-adjustment-v4/package_vote_challenges_v4.json",
              "research/package-adjustment-v5/package_vote_challenges_v5.json",
              "challenge URL",
          )
          replace_once(
              "return 'package_votes_v4_' + new Date().toISOString().slice(0,10);",
              "return 'package_votes_v5_' + new Date().toISOString().slice(0,10);",
              "daily localStorage key",
          )
          replace_once(
              "localStorage.getItem('package_vote_recent_v4')",
              "localStorage.getItem('package_vote_recent_v5')",
              "recent read key",
          )
          replace_once(
              "localStorage.setItem('package_vote_recent_v4', JSON.stringify(recent));",
              "localStorage.setItem('package_vote_recent_v5', JSON.stringify(recent));",
              "recent write key",
          )
          replace_once(
              "localStorage.removeItem('package_vote_recent_v4');",
              "localStorage.removeItem('package_vote_recent_v5');",
              "recent clear key",
          )
          replace_once(
              "doc.status !== 'frozen_package_preference_v4' ||",
              "doc.schema_version !== 5 ||\n        doc.status !== 'frozen_package_preference_v5' ||",
              "catalog status/schema guard",
          )
          replace_once(
              "doc.challenges.length < 70",
              "doc.challenges.length < 250",
              "catalog minimum size guard",
          )
          replace_once(
              "console.warn('Package Preference V2 load failed:', err);",
              "console.warn('Package Preference V5 load failed:', err);",
              "load warning",
          )
          replace_once(
              "keep: `__pkgv4__|${id}|${choice}`,\n      trade: `__pkgv4_meta__|${left}`,\n      cut: '__pkgv4_schema__|4',",
              "keep: `__pkgv5__|${id}|${choice}`,\n      trade: `__pkgv5_meta__|${left}`,\n      cut: '__pkgv5_schema__|5',",
              "V5 transport markers",
          )


          def replace_function(source, name, replacement):
              marker = f"function {name}("
              start = source.find(marker)
              if start < 0:
                  raise RuntimeError(f"missing function {name}")
              brace = source.find("{", start)
              if brace < 0:
                  raise RuntimeError(f"missing opening brace for {name}")

              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in {"'", '"', "`"}:
                          quote = ch
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              return source[:start] + replacement + source[end:]
                  i += 1
              raise RuntimeError(f"unterminated function {name}")


          new_selector = r"""function packageVoteSelectChallenge(){
            let pool = packageVoteEligibleChallenges();
            if(!pool.length && PACKAGE_VOTE_CHALLENGES){
              localStorage.removeItem('package_vote_recent_v5');
              pool = packageVoteEligibleChallenges();
            }
            if(!pool.length) return null;

            /* V5 sampling is deliberately stratified. Each available composition band
               gets equal selection probability; within it, each feasible ratio cell gets
               equal probability; then a challenge is sampled inside that cell. */
            const byComposition = new Map();
            for(const c of pool){
              const label = c && c.composition_target && c.composition_target.label;
              if(!label) continue;
              if(!byComposition.has(label)) byComposition.set(label, []);
              byComposition.get(label).push(c);
            }
            const labels = Array.from(byComposition.keys());
            if(!labels.length) return null;

            const label = labels[Math.floor(Math.random() * labels.length)];
            const compPool = byComposition.get(label);
            const byRatio = new Map();
            for(const c of compPool){
              const ratio = Number(c.ratio_target).toFixed(2);
              if(!byRatio.has(ratio)) byRatio.set(ratio, []);
              byRatio.get(ratio).push(c);
            }
            const ratios = Array.from(byRatio.keys());
            const ratio = ratios[Math.floor(Math.random() * ratios.length)];
            const cell = byRatio.get(ratio);
            const challenge = cell[Math.floor(Math.random() * cell.length)];
            return { challenge, left: Math.random() < 0.5 ? 'T' : 'P' };
          }"""

          text = replace_function(text, "packageVoteSelectChallenge", new_selector)

          production_markers = [
              "const PACKAGE_ADJUSTMENT_PRODUCTION_V1 = Object.freeze({",
              "function packageAdjustmentSize2Multiplier(",
              "function packageAdjustmentAssessment(",
              "function packageAdjustmentForTrade(",
          ]
          for marker in production_markers:
              if marker not in text:
                  raise RuntimeError(f"production marker missing after V5 patch: {marker}")

          if text == before:
              raise RuntimeError("V5 browser patch made no changes")

          INDEX.write_text(text, encoding="utf-8")

          catalog = json.loads(CATALOG.read_text(encoding="utf-8"))
          if catalog.get("schema_version") != 5 or catalog.get("status") != "frozen_package_preference_v5":
              raise RuntimeError("unexpected V5 catalog while creating release")

          now = datetime.now(timezone.utc).isoformat()
          release = {
              "schema_version": 1,
              "status": "package_adjustment_v5_composition_vote_release",
              "frozen": True,
              "release_id": "package-adjustment-v5-composition-voting-v1",
              "released_at_utc": now,
              "research_only": True,
              "production_status": "controlled_live",
              "production_revision": "v1.5-audit-step6-scope-ui-idp",
              "production_formula_changed": False,
              "fundamental_value_consumer_changed": False,
              "market_value_consumer_changed": False,
              "draft_pick_value_consumer_changed": False,
              "team_utility_consumer_changed": False,
              "trade_verdict_consumer_changed": False,
              "catalog_sha256": hashlib.sha256(CATALOG.read_bytes()).hexdigest(),
              "browser_index_sha256_after_v5_activation": hashlib.sha256(INDEX.read_bytes()).hexdigest(),
              "transport": {
                  "keep_prefix": "__pkgv5__|",
                  "meta_prefix": "__pkgv5_meta__|",
                  "schema_marker": "__pkgv5_schema__|5",
              },
              "sampling": {
                  "composition_band_selection": "uniform_among_currently_eligible_bands",
                  "ratio_cell_selection_within_band": "uniform_among_currently_eligible_ratio_cells",
                  "challenge_selection_within_cell": "uniform",
                  "display_side_randomized": True,
                  "values_hidden_from_voter": True,
                  "daily_vote_limit": 20,
              },
              "supersedes_browser_package_vote_version": "v4",
              "frozen_v3_v4_evidence_changed": False,
              "automatic_production_change_allowed": False,
          }
          RELEASE.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          REPORT.write_text(
              "\n".join([
                  "# Package Adjustment V5 — Voting Activation",
                  "",
                  "**Status: ACTIVE RESEARCH — production V1.5 unchanged.**",
                  "",
                  f"- Released: `{now}`",
                  "- Browser package-research slot now serves frozen V5 two-player composition challenges.",
                  "- Composition band is sampled uniformly.",
                  "- Ratio cell is sampled uniformly within the selected composition band.",
                  "- Challenge is sampled uniformly within the selected cell.",
                  "- Left/right display is randomized.",
                  "- FV values remain hidden from voters.",
                  "- V5 rows use reserved `__pkgv5__` transport markers.",
                  "- V3 and V4 frozen evidence is untouched.",
                  "- No live Package Adjustment formula or consumer changed.",
                  "",
              ]) + "\n",
              encoding="utf-8",
          )

          print("Patched index.html for V5 composition voting.")
          print("Created frozen V5 voting release manifest.")

          PY

      - name: V5 pipeline self-test
        run: python3 scripts/market/package_vote_v5_pipeline.py --selftest

      - name: Verify V5 browser markers and stratified sampling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          text = Path("index.html").read_text(encoding="utf-8")
          required = [
              "research/package-adjustment-v5/package_vote_challenges_v5.json",
              "frozen_package_preference_v5",
              "__pkgv5__|${id}|${choice}",
              "__pkgv5_meta__|${left}",
              "__pkgv5_schema__|5",
              "package_votes_v5_",
              "package_vote_recent_v5",
              "composition_target",
              "byComposition",
              "byRatio",
          ]
          for token in required:
              assert token in text, token

          forbidden_browser = [
              "research/package-adjustment-v4/package_vote_challenges_v4.json",
              "__pkgv4__|${id}|${choice}",
              "__pkgv4_schema__|4",
              "package_votes_v4_",
              "package_vote_recent_v4",
          ]
          for token in forbidden_browser:
              assert token not in text, token

          release = json.loads(Path(
              "research/package-adjustment-v5/release_manifest.json"
          ).read_text())
          assert release["frozen"] is True
          assert release["research_only"] is True
          assert release["production_formula_changed"] is False
          assert release["automatic_production_change_allowed"] is False
          assert release["sampling"]["display_side_randomized"] is True
          assert release["sampling"]["values_hidden_from_voter"] is True

          print("V5 browser voting activation verified.")
          PY

      - name: Protect frozen V3 V4 and production audit artifacts
        shell: bash
        run: |
          git diff --exit-code -- research/package-adjustment-v3
          git diff --exit-code -- research/package-adjustment-v4
          git diff --exit-code -- research/package-adjustment-production-candidate-v1
          git diff --exit-code -- scripts/validation/check_package_adjustment_live.py
          git diff --exit-code -- scripts/validation/repo_regression_checks.py
          git diff --exit-code -- .github/workflows

      - name: Permanent validator after V5 browser activation
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Full repository regression after V5 browser activation
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Validate Python JSON and whitespace
        shell: bash
        run: |
          python3 -m py_compile scripts/market/package_vote_v5_pipeline.py
          python3 -m json.tool research/package-adjustment-v5/release_manifest.json >/dev/null
          git diff --check

      - name: Verify only V5 research browser files changed
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "index.html",
              "scripts/market/package_vote_v5_pipeline.py",
              "research/package-adjustment-v5/release_manifest.json",
              "research/package-adjustment-v5/voting_activation.md",
          }
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          paths = set()
          for row in rows:
              if not row.strip():
                  continue
              p = row[3:]
              if " -> " in p:
                  p = p.split(" -> ", 1)[1]
              paths.add(p)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(f"Unexpected V5 activation changes: {unexpected}")
          missing = sorted(allowed - paths)
          if missing:
              raise RuntimeError(f"Expected V5 activation changes missing: {missing}")
          print("V5 activation change set verified.")
          PY

      - name: Commit V5 voting activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add scripts/market/package_vote_v5_pipeline.py
          git add research/package-adjustment-v5/release_manifest.json
          git add research/package-adjustment-v5/voting_activation.md

          git commit -m "Activate Package Adjustment V5 composition voting"
          git pull --rebase origin main
          git push origin main
