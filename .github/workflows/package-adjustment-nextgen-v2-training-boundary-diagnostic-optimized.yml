name: Package Adjustment NextGen V2 Training Boundary Diagnostic Optimized

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact frozen numeric environment
        run: |
          set -euo pipefail
          python3 -m pip install \
            "numpy==2.5.3" \
            "scipy==1.18.1" \
            "requests"

      - name: Guard frozen inputs and unchanged production
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/voting_sampling_correction_manifest.json")" = "8c181ec2dbcfb4b259de7e839247780e67539b09"

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 "$D/fit_package_adjustment_nextgen_v2.py" --selftest

      - name: Run exact-checkpoint training-only boundary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/pkgnv2-boundary-diagnostic"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          from __future__ import annotations

          import copy
          import csv
          import hashlib
          import importlib.util
          import io
          import json
          import math
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          ROOT = Path.cwd()
          D = ROOT / "research/package-adjustment-nextgen-v2"
          OUT = Path("/tmp/pkgnv2-boundary-diagnostic")
          FITTER = D / "fit_package_adjustment_nextgen_v2.py"

          SOURCE_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          VOTE_PREFIX = "__" + "pkg" + "nv2__|"
          META_PREFIX = "__" + "pkg" + "nv2_meta__|"
          SCHEMA_MARKER = "__" + "pkg" + "nv2_schema__|" + "1"

          EXPECTED_CANONICAL_SHA = (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )
          EXPECTED_ROWS = 800
          EXPECTED_VOTERS = 40

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def parse_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          correction = read_json(D / "voting_sampling_correction_manifest.json")
          cfg_frozen = read_json(D / "model_fit_preregistration.json")
          catalog_doc = read_json(D / "package_vote_challenges_nextgen_v2.json")
          catalog = {c["id"]: c for c in catalog_doc["challenges"]}

          response = requests.get(SOURCE_URL, timeout=30)
          response.raise_for_status()
          source_rows = list(csv.DictReader(io.StringIO(response.text)))

          cutoff = parse_utc(correction["valid_ballot_start_utc"])
          now = datetime.now(timezone.utc)
          candidates = []
          excluded = Counter()
          raw_prefix_rows = 0

          for source_index, row in enumerate(source_rows):
              keep = str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue
              raw_prefix_rows += 1

              ts = parse_utc(row.get("timestamp"))
              if ts is None:
                  excluded["invalid_timestamp"] += 1
                  continue
              if ts <= cutoff:
                  excluded["at_or_before_corrected_cutoff"] += 1
                  continue
              if ts > now:
                  excluded["future_timestamp"] += 1
                  continue

              parts = keep.split("|")
              if len(parts) != 3 or parts[0] != VOTE_PREFIX[:-1]:
                  excluded["malformed_keep_transport"] += 1
                  continue

              challenge_id = parts[1].strip()
              choice_side = parts[2].strip().upper()

              meta = str(row.get("trade") or "")
              displayed_left = (
                  meta[len(META_PREFIX):].strip().upper()
                  if meta.startswith(META_PREFIX)
                  else ""
              )
              voter_id = str(row.get("voter_roster_id") or "").strip()

              if choice_side not in {"A", "B"}:
                  excluded["invalid_choice"] += 1
                  continue
              if displayed_left not in {"A", "B"}:
                  excluded["invalid_display_side"] += 1
                  continue
              if str(row.get("cut") or "") != SCHEMA_MARKER:
                  excluded["invalid_schema"] += 1
                  continue
              if not voter_id:
                  excluded["missing_voter"] += 1
                  continue
              if challenge_id not in catalog:
                  excluded["unknown_challenge"] += 1
                  continue

              candidates.append({
                  "timestamp": ts,
                  "timestamp_iso": ts.isoformat(),
                  "voter_id": voter_id,
                  "challenge_id": challenge_id,
                  "choice_side": choice_side,
                  "displayed_left_side": displayed_left,
                  "source_index": source_index,
              })

          candidates.sort(key=lambda r: (
              r["timestamp"],
              r["voter_id"],
              r["challenge_id"],
              r["choice_side"],
              r["displayed_left_side"],
              r["source_index"],
          ))

          daily_cap = int(cfg_frozen["voter_protections"]["daily_valid_nextgen_vote_cap"])
          daily_counts = Counter()
          valid = []
          for r in candidates:
              key = (r["voter_id"], r["timestamp"].date().isoformat())
              if daily_counts[key] >= daily_cap:
                  excluded["daily_cap_dropped"] += 1
                  continue
              daily_counts[key] += 1
              valid.append(r)

          canonical_rows = [
              {
                  "timestamp": r["timestamp_iso"],
                  "voter_id": r["voter_id"],
                  "challenge_id": r["challenge_id"],
                  "choice_side": r["choice_side"],
                  "displayed_left_side": r["displayed_left_side"],
              }
              for r in valid
          ]
          canonical_sha = hashlib.sha256(
              json.dumps(
                  canonical_rows,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
          ).hexdigest()

          assert raw_prefix_rows == EXPECTED_ROWS
          assert len(valid) == EXPECTED_ROWS
          assert len({r["voter_id"] for r in valid}) == EXPECTED_VOTERS
          assert not excluded
          assert canonical_sha == EXPECTED_CANONICAL_SHA

          # Import exact frozen fitter.
          spec = importlib.util.spec_from_file_location("pkgnv2_fitter", FITTER)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          cfg_verified, catalog_verified, _ = mod.verify_preregistration()
          ctx = mod.catalog_maps(catalog_verified)
          spline = mod.ConvexLinearSpline(cfg_verified)

          full_payload = {
              "schema_version": 1,
              "released_at_utc": correction["valid_ballot_start_utc"],
              "catalog_payload_sha256": cfg_verified["anchors"][
                  "canonical_challenge_payload_sha256"
              ],
              "maturity_plan_sha256": cfg_verified["anchors"]["maturity_plan_sha256"],
              "ballots": canonical_rows,
          }

          normalized, normalize_exclusions = mod.normalize_ballots(
              full_payload, ctx, cfg_verified
          )
          assert not normalize_exclusions
          assert len(normalized) == EXPECTED_ROWS

          # CRITICAL HOLDOUT FIREWALL:
          # Discard every structural-holdout ballot before any diagnostic fit.
          challenge_map = ctx["challenges"]
          train_rows = [
              r for r in normalized
              if challenge_map[r["challenge_id"]]["fit_eligible"] is True
          ]
          holdout_count = len(normalized) - len(train_rows)
          assert train_rows
          assert holdout_count > 0
          assert all(
              challenge_map[r["challenge_id"]]["split"] == "train"
              and challenge_map[r["challenge_id"]]["fit_eligible"] is True
              for r in train_rows
          )

          beta_caps = [50.0, 75.0, 100.0, 150.0, 250.0, 500.0, 1000.0]
          diagnostics = []
          resolved_cap = None

          # Phase 1: scan only M0 + M2a across beta caps.
          for cap in beta_caps:
              cfg = copy.deepcopy(cfg_verified)
              cfg["optimizer"]["log_beta_bounds"] = [
                  float(cfg_verified["optimizer"]["log_beta_bounds"][0]),
                  math.log(cap),
              ]

              m0 = mod.fit_model(
                  "M0", train_rows, challenge_map, ctx["train_cells"], cfg, spline
              )
              m2a = mod.fit_model(
                  "M2a", train_rows, challenge_map, ctx["train_cells"], cfg, spline
              )

              row = {
                  "beta_cap": cap,
                  "M0": {
                      "success": bool(m0.get("success")),
                      "eligible": bool(m0.get("eligible")),
                      "boundary_flags": m0.get("boundary_flags", []),
                      "objective": m0.get("objective"),
                      "beta": math.exp(float(m0["x"][0])) if m0.get("success") else None,
                      "delta_left": float(m0["x"][1]) if m0.get("success") else None,
                  },
                  "M2a": {
                      "success": bool(m2a.get("success")),
                      "eligible": bool(m2a.get("eligible")),
                      "boundary_flags": m2a.get("boundary_flags", []),
                      "objective": m2a.get("objective"),
                      "p": float(m2a["x"][0]) if m2a.get("success") else None,
                      "beta": math.exp(float(m2a["x"][1])) if m2a.get("success") else None,
                      "delta_left": float(m2a["x"][2]) if m2a.get("success") else None,
                  },
                  "M2b_cv": None,
                  "M2b": None,
              }
              diagnostics.append(row)

              if row["M0"]["eligible"] and row["M2a"]["eligible"]:
                  resolved_cap = cap
                  break

          # Phase 2: run the expensive M2b CV exactly once.
          if resolved_cap is not None:
              cfg = copy.deepcopy(cfg_verified)
              cfg["optimizer"]["log_beta_bounds"] = [
                  float(cfg_verified["optimizer"]["log_beta_bounds"][0]),
                  math.log(resolved_cap),
              ]

              cv = mod.select_m2b_lambda(
                  train_rows, challenge_map, ctx["train_cells"], cfg, spline
              )
              diagnostics[-1]["M2b_cv"] = {
                  "success": bool(cv.get("success")),
                  "selected_lambda": cv.get("selected_lambda"),
                  "reason": cv.get("reason"),
              }

              if cv.get("success"):
                  m2b = mod.fit_model(
                      "M2b",
                      train_rows,
                      challenge_map,
                      ctx["train_cells"],
                      cfg,
                      spline,
                      regularization_lambda=float(cv["selected_lambda"]),
                  )
                  diagnostics[-1]["M2b"] = {
                      "success": bool(m2b.get("success")),
                      "eligible": bool(m2b.get("eligible")),
                      "boundary_flags": m2b.get("boundary_flags", []),
                      "objective": m2b.get("objective"),
                      "deltas": [float(x) for x in m2b["x"][:4]] if m2b.get("success") else None,
                      "beta": math.exp(float(m2b["x"][4])) if m2b.get("success") else None,
                      "delta_left": float(m2b["x"][5]) if m2b.get("success") else None,
                  }

          smallest_fully_resolved = None
          if resolved_cap is not None:
              last = diagnostics[-1]
              if (
                  last["M0"]["eligible"]
                  and last["M2a"]["eligible"]
                  and last["M2b_cv"] is not None
                  and last["M2b_cv"]["success"]
                  and last["M2b"] is not None
                  and last["M2b"]["eligible"]
              ):
                  smallest_fully_resolved = resolved_cap

          result = {
              "schema_version": 1,
              "status": (
                  "training_only_boundary_resolved"
                  if fully_resolved_caps
                  else "training_only_boundary_still_unresolved"
              ),
              "research_only": True,
              "production_change_authorized": False,
              "structural_holdout_outcomes_evaluated": False,
              "structural_holdout_ballots_discarded_before_fit": True,
              "frozen_checkpoint": {
                  "effective_ballots": EXPECTED_ROWS,
                  "distinct_voters": EXPECTED_VOTERS,
                  "canonical_ballot_sha256": canonical_sha,
              },
              "training_ballot_count": len(train_rows),
              "holdout_ballot_count_discarded_without_evaluation": holdout_count,
              "beta_cap_grid": beta_caps,
              "smallest_fully_resolved_beta_cap": (
                  min(fully_resolved_caps) if fully_resolved_caps else None
              ),
              "diagnostics": diagnostics,
              "interpretation_guardrail": (
                  "This diagnostic may inform a versioned preregistration amendment "
                  "to nuisance optimizer bounds only. It must not be used to select "
                  "a production formula, and structural holdouts remain unopened."
              ),
          }

          (OUT / "training-boundary-diagnostic.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Package Adjustment NextGen V2 — Training-Only Boundary Diagnostic",
              "",
              f"**Status:** `{result['status']}`",
              "",
              "- Structural holdout outcomes evaluated: **NO**",
              "- Structural holdout ballots discarded before fitting: **YES**",
              f"- Exact checkpoint: **800 votes / 40 voters**",
              f"- Canonical ballot SHA-256: `{canonical_sha}`",
              f"- Training ballots used: **{len(train_rows)}**",
              f"- Holdout ballots discarded without evaluation: **{holdout_count}**",
              "",
              "| beta cap | M0 beta | M0 eligible | M2a p | M2a beta | M2a eligible | M2b CV | M2b beta | M2b eligible |",
              "|---:|---:|:---:|---:|---:|:---:|:---:|---:|:---:|",
          ]

          for d in diagnostics:
              m2b = d["M2b"] or {}
              lines.append(
                  f"| {d['beta_cap']:.0f} | "
                  f"{d['M0']['beta'] if d['M0']['beta'] is not None else '—'} | "
                  f"{'yes' if d['M0']['eligible'] else 'no'} | "
                  f"{d['M2a']['p'] if d['M2a']['p'] is not None else '—'} | "
                  f"{d['M2a']['beta'] if d['M2a']['beta'] is not None else '—'} | "
                  f"{'yes' if d['M2a']['eligible'] else 'no'} | "
                  f"{'yes' if m2b_cv.get('success') else 'not run'} | "
                  f"{m2b.get('beta', '—')} | "
                  f"{'yes' if m2b.get('eligible') else 'no'} |"
              )

          lines += [
              "",
              f"Smallest fully resolved diagnostic beta cap: "
              f"**{result['smallest_fully_resolved_beta_cap']}**",
              "",
              "This is a **training-only numerical diagnostic**. It does not select "
              "a model and does not authorize any production change.",
              "",
          ]

          (OUT / "training-boundary-diagnostic.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "status": result["status"],
              "smallest_fully_resolved_beta_cap": result[
                  "smallest_fully_resolved_beta_cap"
              ],
              "training_ballots": len(train_rows),
              "holdout_ballots_discarded": holdout_count,
              "holdout_outcomes_evaluated": False,
          }, indent=2))
          PY

      - name: Prove diagnostic is read-only and production unchanged
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py
          test -z "$(git status --porcelain=v1)"

      - name: Upload training-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-training-boundary-diagnostic
          path: |
            /tmp/pkgnv2-boundary-diagnostic/training-boundary-diagnostic.json
            /tmp/pkgnv2-boundary-diagnostic/training-boundary-diagnostic.md
          if-no-files-found: error
          retention-days: 30
