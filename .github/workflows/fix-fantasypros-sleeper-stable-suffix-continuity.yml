name: Fix FantasyPros Sleeper Stable Suffix Continuity v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        run: python3 -m pip install requests

      - name: Guard exact failing resolver
        shell: bash
        run: |
          set -euo pipefail
          FILE="scripts/projections/resolve_fantasypros_sleeper_identity.py"

          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object "$FILE")" = "f444e7e06b458d31e8d0021a026473dd60147c52"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PASS: exact resolver version from failed refresh confirmed."

      - name: Patch stable historical suffix continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/projections/resolve_fantasypros_sleeper_identity.py")
          text = path.read_text(encoding="utf-8")

          old_aliases = '''TEAM_ALIASES = {
              "JAC": "JAX",  # confirmed provider difference in the existing IDP resolver
          }

          POSITION_MAP = {
          '''
          new_aliases = '''TEAM_ALIASES = {
              "JAC": "JAX",  # confirmed provider difference in the existing IDP resolver
          }

          # Provider display names can legitimately add or drop a generational
          # suffix while the stable provider IDs continue to identify the same
          # person. This tolerance is used ONLY for a previously-authoritative
          # FPID<->Sleeper-ID pair; new identity discovery remains strict.
          GENERATIONAL_SUFFIXES = frozenset({"jr", "sr", "ii", "iii", "iv", "v"})

          POSITION_MAP = {
          '''
          if text.count(old_aliases) != 1:
              raise RuntimeError("TEAM_ALIASES insertion anchor changed")
          text = text.replace(old_aliases, new_aliases, 1)

          old_normalize = '''def normalize_name(value) -> str:
              s = str(value or "").strip().lower()
              s = re.sub(r"[.'’\\-]", "", s)
              return re.sub(r"\\s+", " ", s).strip()


          def normalize_team(value):
          '''
          new_normalize = '''def normalize_name(value) -> str:
              s = str(value or "").strip().lower()
              s = re.sub(r"[.'’\\-]", "", s)
              return re.sub(r"\\s+", " ", s).strip()


          def split_generational_suffix(value):
              # Return (base_name, suffix) after ordinary name normalization.
              name = normalize_name(value)
              parts = name.split()
              if parts and parts[-1] in GENERATIONAL_SUFFIXES:
                  return " ".join(parts[:-1]), parts[-1]
              return name, None


          def stable_authoritative_name_equivalent(prior_name, current_name) -> bool:
              # Narrow equivalence for an already-authoritative stable ID pair.
              # Exact names remain valid. A recognized generational suffix may
              # exist on only one provider. If both supply suffixes, they must
              # agree, so Sr/Jr or II/III still hard-fail.
              prior = normalize_name(prior_name)
              current = normalize_name(current_name)
              if prior == current:
                  return True

              prior_base, prior_suffix = split_generational_suffix(prior)
              current_base, current_suffix = split_generational_suffix(current)
              if prior_base != current_base:
                  return False

              if prior_suffix and current_suffix:
                  return prior_suffix == current_suffix

              return bool(prior_suffix or current_suffix)


          def normalize_team(value):
          '''
          if text.count(old_normalize) != 1:
              raise RuntimeError("normalize_name insertion anchor changed")
          text = text.replace(old_normalize, new_normalize, 1)

          old_guard = '''    if current["player"] != fp["_name"]:
                  raise RuntimeError(
                      f"Stable identity contradiction for FantasyPros {fp['_fpid']} "
                      f"({fp['_name']}): prior Sleeper {prior_sid} now resolves to "
                      f"{current['player']!r}"
                  )
              # Position is mutable even when provider IDs identify the same person.
          '''
          new_guard = '''    if not stable_authoritative_name_equivalent(fp["_name"], current["player"]):
                  raise RuntimeError(
                      f"Stable identity contradiction for FantasyPros {fp['_fpid']} "
                      f"({fp['_name']}): prior Sleeper {prior_sid} now resolves to "
                      f"{current['player']!r}"
                  )
              # Position is mutable even when provider IDs identify the same person.
          '''
          if text.count(old_guard) != 1:
              raise RuntimeError("stable identity guard anchor changed")
          text = text.replace(old_guard, new_guard, 1)

          old_bad_previous = '''    # A previous stable mapping to the wrong current person must hard-fail.
              bad_previous = [{"fantasypros_id": 1, "sleeper_id": "200", "requires_manual_review": False}]
          '''
          new_bad_previous = '''    # Provider-only generational suffix changes are allowed ONLY because
              # this is an already-authoritative stable FPID<->Sleeper-ID pair.
              suffix_fp = {"players": [{
                  "fantasypros_id": 25263,
                  "name": "Tyrique Stevenson Sr.",
                  "normalized_name": "tyrique stevenson sr",
                  "source_position": "DB",
                  "team": "CHI",
              }]}
              suffix_raw = [{
                  "sleeper_id": "10897",
                  "player": "tyrique stevenson",
                  "pos": "CB",
                  "team": "CHI",
                  "fantasy_positions": ["DB"],
                  "raw_category_season_totals": {"idp_tkl_solo": 50},
              }]
              suffix_previous = [{
                  "fantasypros_id": 25263,
                  "name": "Tyrique Stevenson Sr.",
                  "fp_position": "DB",
                  "sleeper_id": "10897",
                  "requires_manual_review": False,
              }]
              suffix_rows = build_production_crosswalk(
                  suffix_fp, [], suffix_raw, refresh, suffix_previous
              )
              assert suffix_rows[0]["sleeper_id"] == "10897"
              assert suffix_rows[0]["requires_manual_review"] is False

              # The tolerance is symmetric if the suffix appears on Sleeper.
              assert stable_authoritative_name_equivalent(
                  "Tyrique Stevenson", "Tyrique Stevenson Sr."
              )
              assert stable_authoritative_name_equivalent(
                  "Tyrique Stevenson Sr.", "Tyrique Stevenson"
              )

              # Conflicting generational suffixes remain contradictions.
              assert not stable_authoritative_name_equivalent(
                  "Example Player Sr.", "Example Player Jr."
              )
              assert not stable_authoritative_name_equivalent(
                  "Example Player II", "Example Player III"
              )

              # Unrelated names remain contradictions.
              assert not stable_authoritative_name_equivalent(
                  "Tyrique Stevenson Sr.", "Tyrique Smith"
              )

              # New identity matching remains strict: without prior authority,
              # suffix mismatch must not manufacture a fresh match.
              untrusted_suffix = build_production_crosswalk(
                  suffix_fp, [], suffix_raw, refresh, []
              )
              assert untrusted_suffix[0]["sleeper_id"] is None
              assert untrusted_suffix[0]["candidate_sleeper_id"] is None
              assert untrusted_suffix[0]["name_candidate_count"] == 0
              assert (
                  untrusted_suffix[0]["match_method"]
                  == "no_sleeper_name_candidate"
              )

              # A previous stable mapping to the wrong current person must hard-fail.
              bad_previous = [{"fantasypros_id": 1, "sleeper_id": "200", "requires_manual_review": False}]
          '''
          if text.count(old_bad_previous) != 1:
              raise RuntimeError("self-test insertion anchor changed")
          text = text.replace(old_bad_previous, new_bad_previous, 1)

          path.write_text(text, encoding="utf-8")
          print("PASS: narrow stable-ID suffix continuity patch applied.")
          PY

      - name: Compile and run resolver self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/projections/resolve_fantasypros_sleeper_identity.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest

      - name: Prove narrow behavior directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/projections/resolve_fantasypros_sleeper_identity.py")
          spec = importlib.util.spec_from_file_location("resolver", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          eq = module.stable_authoritative_name_equivalent

          assert eq("tyrique stevenson sr", "tyrique stevenson")
          assert eq("Tyrique Stevenson", "Tyrique Stevenson Sr.")
          assert eq("John Doe Jr.", "John Doe")
          assert eq("John Doe III", "John Doe")
          assert not eq("John Doe Sr.", "John Doe Jr.")
          assert not eq("John Doe II", "John Doe III")
          assert not eq("John Doe", "John Roe")
          assert module.normalize_name("Tyrique Stevenson Sr.") == "tyrique stevenson sr"

          print("PASS: suffix added/removed is continuity-safe for prior stable IDs.")
          print("PASS: conflicting suffixes and unrelated names still reject.")
          PY

      - name: Verify only resolver changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {"scripts/projections/resolve_fantasypros_sleeper_identity.py"}
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          if paths != expected:
              raise RuntimeError(f"unexpected changed paths: {sorted(paths)}")
          print("PASS: exactly one tracked file changed.")
          PY
          git diff --check

      - name: Run repository regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Re-prove one-file boundary after regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {"scripts/projections/resolve_fantasypros_sleeper_identity.py"}
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          if paths != expected:
              raise RuntimeError(f"regressions changed unexpected paths: {sorted(paths)}")
          print("PASS: regressions left the one-file patch boundary intact.")
          PY

      - name: Commit resolver repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/projections/resolve_fantasypros_sleeper_identity.py
          git commit -m "Handle stable identity generational suffix drift"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify committed diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$PATCH_COMMIT")"
          test "$changed" = "scripts/projections/resolve_fantasypros_sleeper_identity.py"
          test -z "$(git status --porcelain=v1)"

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest

          echo "PASS: committed repair is one file and self-test remains green."

      - name: Push resolver repair
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          echo "Patch commit: $PATCH_COMMIT"
          git log --oneline -1
