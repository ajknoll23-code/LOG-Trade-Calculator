      - name: Prove cleanup scope
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )

          batch = (
              "2026-09-26-post-package-v8-phase1b-and-draft-pick-v8"
          )
          batch_rows = [
              row
              for row in manifest["archive_entries"]
              if row.get("cleanup_batch") == batch
          ]

          if len(batch_rows) != 26:
              raise SystemExit(
                  f"Expected 26 workflows in current cleanup batch, "
                  f"found {len(batch_rows)}"
              )

          allowed = {
              ".github/workflow-archive/completed-research/README.md",
              ".github/workflow-archive/completed-research/archive_manifest.json",
              ".github/workflows/workflow-folder-cleanup.yml",
              ".github/workflows/workflow-folder-cleanup-UPDATED-2026-09-26.yml",
              ".github/workflows/workflow-folder-cleanup-FIXED-2026-09-26.yml",
          }

          for row in batch_rows:
              allowed.add(row["original_path"])
              allowed.add(row["archive_path"])

          status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          )

          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              raw = line[3:]
              if " -> " in raw:
                  left, right = raw.split(" -> ", 1)
                  touched.add(left)
                  touched.add(right)
              else:
                  touched.add(raw)

          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit(
                  "Cleanup touched unexpected files: "
                  + ", ".join(unexpected)
              )

          print(
              f"PASS: cleanup scope exact; "
              f"touched {len(touched)} paths."
          )
          PY

      - name: Commit workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during cleanup; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .github

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Archive completed V7 and early V8 research workflows"
          git push origin HEAD:main

          echo "PASS: workflow-folder cleanup committed."
