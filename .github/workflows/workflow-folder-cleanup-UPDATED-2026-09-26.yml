# PREFLIGHTED: POST_PACKAGE_V8_PHASE1B_AND_DRAFT_PICK_V8_WORKFLOW_CLEANUP_SELF_CANONICALIZING_V4
name: Workflow Folder Cleanup

'on':
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DP_V7_CLOSEOUT_RUN_ID: '36202621067'
  DP_V8_P0A_RUN_ID: '36207166693'
  DP_V8_OLD_P0B_FAILED_RUN_ID: '36264685319'
  PKG_V7_FINAL_EVAL_RUN_ID: '36265243588'
  PKG_V8_PREREG_RUN_ID: '36272293565'
  PKG_V8_POWER_RUN_ID: '36274066881'
  PKG_V8_PHASE1B_RUN_ID: '36278489432'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.15

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Canonicalize uploaded cleanup workflow filename
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          CANON=".github/workflows/workflow-folder-cleanup.yml"
          ALIAS=".github/workflows/workflow-folder-cleanup-UPDATED-2026-09-26.yml"
          STRAY=".github/workflows/workflow-folder-cleanup-FIXED-2026-09-26.yml"
          OLD_CANON_BLOB="60378c466fc1ad331d81b050570f52a126e1f02c"
          KNOWN_STRAY_BLOB="5014777e98f0941fee1f7d6bc4fbc5ad32e7e6cf"

          # The workflow being run must exist at ALIAS in the starting commit.
          [[ -f "$ALIAS" ]] || {
            echo "ERROR: expected running UPDATED cleanup workflow is missing."
            exit 1
          }

          alias_blob="$(git hash-object "$ALIAS")"
          expected_alias_blob="$(git rev-parse "$BASE_SHA:$ALIAS")"

          echo "Alias blob: $alias_blob"
          echo "Expected alias blob from BASE_SHA: $expected_alias_blob"

          [[ "$alias_blob" == "$expected_alias_blob" ]] || {
            echo "ERROR: UPDATED cleanup workflow does not match the starting commit."
            exit 1
          }

          # Do not depend on a marker string. The exact starting-commit blob
          # identity above is the self-identity guard.

          # Remove the mistakenly uploaded FIXED alias only if it is the exact
          # known blob already observed in the repository.
          if [[ -f "$STRAY" ]]; then
            stray_blob="$(git hash-object "$STRAY")"
            echo "Stray FIXED blob: $stray_blob"
            [[ "$stray_blob" == "$KNOWN_STRAY_BLOB" ]] || {
              echo "ERROR: unexpected FIXED cleanup workflow content; refusing deletion."
              exit 1
            }
            rm "$STRAY"
            echo "PASS: removed exact stray FIXED cleanup workflow."
          fi

          # Canonical may be absent (current repo), stale old content, or
          # already identical to the running UPDATED workflow.
          if [[ -f "$CANON" ]]; then
            canon_blob="$(git hash-object "$CANON")"
            echo "Existing canonical blob: $canon_blob"

            if [[ "$canon_blob" != "$OLD_CANON_BLOB" && "$canon_blob" != "$alias_blob" ]]; then
              echo "ERROR: unexpected canonical cleanup workflow content; refusing overwrite."
              exit 1
            fi
            rm "$CANON"
          else
            echo "Canonical cleanup file is absent; promoting UPDATED workflow."
          fi

          mv "$ALIAS" "$CANON"

          [[ -f "$CANON" ]] || {
            echo "ERROR: canonical cleanup workflow missing after normalization."
            exit 1
          }
          [[ ! -e "$ALIAS" ]] || {
            echo "ERROR: UPDATED alias still exists after normalization."
            exit 1
          }
          [[ ! -e "$STRAY" ]] || {
            echo "ERROR: FIXED stray still exists after normalization."
            exit 1
          }

          echo "PASS: exactly one canonical cleanup workflow remains."

      - name: Guard scientific closure evidence and exact workflow inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          import requests
          import yaml

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True, exist_ok=True)

          batch = "2026-09-26-post-package-v8-phase1b-and-draft-pick-v8"

          archive_targets = {
              "draft-pick-fv-v7-phase1-r1-r6-full-scale-preregistration.yml":
                  "e4a883b39f7e07ac69522a70c8f9de70cc258631",
              "draft-pick-fv-v7-phase2-accelerated-finalize.yml":
                  "74962c71ea7845b144b25ed7dbaeaf6dab062434",
              "draft-pick-fv-v7-phase2-accelerated-probe-resume-v2.yml":
                  "8e7dfe5cffb25377c906659c4017cabec834c558",
              "draft-pick-fv-v7-phase2-accelerated-probe-shard.yml":
                  "de4565f1ab9f3e15fbf42f7ca7e6b10ddf4520e7",
              "draft-pick-fv-v7-phase2-candidate-transport-isolation-v4.yml":
                  "a18245aff73e138865106a88bf72422826dfefdc",
              "draft-pick-fv-v7-phase2-checkpointed-source-identity-freeze.yml":
                  "440c7688248657958897fad6d95dd1e9f4b5f371",
              "draft-pick-fv-v7-phase2-gate-diagnostic-v4_1.yml":
                  "2a8ad6e97dd5b41e9f48fe52cc0d49f429af0abe",
              "draft-pick-fv-v7-phase2-r1-r6-source-identity-freeze.yml":
                  "58605ad8ae2ae0872a74cbad252c9203966e55d2",
              "draft-pick-fv-v7-phase2-r25-probe-recovery.yml":
                  "7ed49a84021b780c360df91bb32a78ed70e8614a",
              "draft-pick-fv-v7-phase2-residual-router-recovery-v2.yml":
                  "81a823ef0bbcb587345919fd864d6c3015a5a29a",
              "draft-pick-fv-v7-phase2-residual-router-recovery-v3.yml":
                  "a459d86a82b552c47531905be5373ec0309eb0c6",
              "draft-pick-fv-v7-phase2-residual-router-recovery.yml":
                  "61f77182c0e8f4e9ffef4fbb6e8661c59b41e1e4",
              "draft-pick-fv-v7-phase2-source-feasibility-closeout-v4_2.yml":
                  "847f9539b8b01b0f55e4cbf3a2045c7ff0543183",
              "draft-pick-fv-v7-phase2-targeted-r25-recovery.yml":
                  "f2f485cd354bd10db71e78c8934cdfd9ad844635",
              "draft-pick-fv-v8-phase0a-raw-depth-feasibility-v2-reloaded.yml":
                  "08782d0fb26e40bfc98c7a619038c2d4158623a3",
              "draft-pick-fv-v8-phase0b-qualified-depth-feasibility.yml":
                  "99524e8778dd5873f11321eb04f1b48fe0a246d8",
              "package-adjustment-v7-development-candidate-evaluation-v1-PARALLEL-RECOVERY.yml":
                  "a84ad22a78d575a1656fac877ccb431b35006998",
              "package-adjustment-v7-development-candidate-evaluation-v1.yml":
                  "0a1e9d276182d8a9310b4c292013789fafea40b5",
              "package-adjustment-v7-development-freeze-first-qualification-v1.yml":
                  "d2af0d22eb7b5236e0d27579a48f345a16f97a80",
              "package-adjustment-v7-development-voting-activation-r4.yml":
                  "607e5bdab00be85c39a6ff2b383ee2c2d5ad6a8c",
              "package-adjustment-v7-outcome-blind-maturity-monitor-v1.yml":
                  "e3536d60144d1c0fadd215c65e4949bee0132ab5",
              "package-adjustment-v7-phase1-multi-v-multi-preregistration.yml":
                  "b21bd34499e025e689623a58133277832627c149",
              "package-adjustment-v7-phase1a-power-and-catalog-freeze-v1.yml":
                  "c32cea6ae7e2b4342d2e1b2e5505137523dc35c6",
              "package-adjustment-v8-topology-split-preregistration-v1-REALISM-REVISED.yml":
                  "c9c1dedb8a1ccc3f125e4f207ab2067c25bbc84f",
              "package-adjustment-v8-phase1a-pre-vote-power-analysis-v1.yml":
                  "bf3f8db0fca00800dd63b9c5149291d2f0b3ce6d",
              "package-adjustment-v8-phase1b-catalog-design-freeze-v1.yml":
                  "b3a2e4eb307133393b64aa70532b1a930d8ce859",
          }

          protected = {
              "age-curve-v2-phase5.yml",
              "cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml",
              "draft-pick-fv-v8-phase0b-qualified-depth-feasibility-PATCHED.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "free-agent-utility-v1-refresh.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "market-edge-v1-prospective-study.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "research-program-status-v1-current-state-audit.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "workflow-folder-cleanup.yml",
          }

          expected_runs = {
              int(os.environ["DP_V7_CLOSEOUT_RUN_ID"]): (
                  "Draft Pick FV V7 - Phase 2 Source Feasibility Closeout V4.2",
                  "success",
              ),
              int(os.environ["DP_V8_P0A_RUN_ID"]): (
                  "Draft Pick FV V8 - Phase 0A Raw Depth Feasibility",
                  "success",
              ),
              int(os.environ["DP_V8_OLD_P0B_FAILED_RUN_ID"]): (
                  "Draft Pick FV V8 - Phase 0B Qualified Depth Feasibility",
                  "failure",
              ),
              int(os.environ["PKG_V7_FINAL_EVAL_RUN_ID"]): (
                  "Package Adjustment V7 - Development Candidate Evaluation V1 Parallel Recovery",
                  "success",
              ),
              int(os.environ["PKG_V8_PREREG_RUN_ID"]): (
                  "Package Adjustment V8 - Topology Split Preregistration V1 REALISM REVISED",
                  "success",
              ),
              int(os.environ["PKG_V8_POWER_RUN_ID"]): (
                  "Package Adjustment V8 - Phase 1A Pre-Vote Power Analysis V1",
                  "success",
              ),
              int(os.environ["PKG_V8_PHASE1B_RUN_ID"]): (
                  "Package Adjustment V8 - Phase 1B Catalog Design Freeze V1",
                  "success",
              ),
          }

          def git_blob_sha(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def trigger_names(path):
              doc = yaml.load(
                  Path(path).read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")
              triggers = doc.get("on")
              if isinstance(triggers, str):
                  return {triggers}
              if isinstance(triggers, list):
                  return set(map(str, triggers))
              if isinstance(triggers, dict):
                  return set(map(str, triggers.keys()))
              raise SystemExit(
                  f"Unrecognized workflow trigger syntax: {path}: {triggers!r}"
              )

          def run_info(run_id):
              repo = os.environ["GH_REPOSITORY"]
              token = os.environ["GH_TOKEN"]
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              r = requests.get(
                  url,
                  timeout=30,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              r.raise_for_status()
              return r.json()

          run_evidence = []
          for run_id, (expected_name, expected_conclusion) in sorted(
              expected_runs.items()
          ):
              info = run_info(run_id)
              actual = {
                  "id": int(info["id"]),
                  "name": info["name"],
                  "status": info["status"],
                  "conclusion": info["conclusion"],
                  "path": info["path"],
                  "head_sha": info["head_sha"],
              }
              if actual["status"] != "completed":
                  raise SystemExit(f"Authorization run not completed: {actual}")
              if actual["name"] != expected_name:
                  raise SystemExit(
                      f"Authorization run name drift for {run_id}: "
                      f"{actual['name']!r}"
                  )
              if actual["conclusion"] != expected_conclusion:
                  raise SystemExit(
                      f"Authorization run conclusion drift for {run_id}: "
                      f"expected={expected_conclusion} "
                      f"actual={actual['conclusion']}"
                  )
              run_evidence.append(actual)

          pkg_v7_path = Path(
              "research/package-adjustment-v7/development_evaluation_v1.json"
          )
          assert git_blob_sha(pkg_v7_path) == (
              "a3be8c22ca24b84f10526a98359a20a282af4e41"
          )
          pkg_v7 = json.loads(pkg_v7_path.read_text(encoding="utf-8"))
          assert pkg_v7["decision"] == (
              "STOP_V7_MULTI_V_MULTI_NO_DEVELOPMENT_SIGNAL"
          )
          assert pkg_v7["selected_candidate"] is None
          assert pkg_v7["eligible_candidates"] == []
          assert pkg_v7["production_change_authorized"] is False

          prereg_path = Path(
              "research/package-adjustment-v8/"
              "topology_split_preregistration_v1.json"
          )
          assert git_blob_sha(prereg_path) == (
              "0861346a483ed9938246fd04173408c47c012ee9"
          )
          prereg = json.loads(prereg_path.read_text(encoding="utf-8"))
          assert prereg["status"] == (
              "FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE"
          )
          assert prereg["production_firewall"][
              "automatic_production_change_authorized"
          ] is False

          power_path = Path(
              "research/package-adjustment-v8/"
              "topology_split_power_analysis_v1.json"
          )
          assert git_blob_sha(power_path) == (
              "6d4aae4126443c9550efa0a82586d2f5ccda03c3"
          )
          power = json.loads(power_path.read_text(encoding="utf-8"))
          assert power["decision"] == (
              "FREEZE_V8_POWER_AT_44_VOTERS_AND_44_PER_CHALLENGE"
          )
          assert power["selected_first_checkpoint_distinct_voters"] == 44
          assert power["production_change_authorized"] is False

          design_path = Path(
              "research/package-adjustment-v8/catalog_design_contract_v1.json"
          )
          feas_path = Path(
              "research/package-adjustment-v8/"
              "catalog_design_feasibility_v1.json"
          )
          assert git_blob_sha(design_path) == (
              "9f75e427c8d182b8e1ac2bf0ef5759a80d7e2b0c"
          )
          assert git_blob_sha(feas_path) == (
              "f2e6d72d58acea23700807af991f3c0a1103bd05"
          )
          design = json.loads(design_path.read_text(encoding="utf-8"))
          feas = json.loads(feas_path.read_text(encoding="utf-8"))
          assert design["status"] == "FROZEN_PRE_CATALOG_PRE_VOTE"
          assert design["primary_concentration_metric"]["name"] == (
              "apex_excess_share"
          )
          assert design["firewalls"]["v8_votes_read"] is False
          assert design["firewalls"]["development_catalog_generated"] is False
          assert feas["status"] == "PASS"
          assert feas[
              "every_required_cell_has_at_least_500_high_value_candidate_pairs"
          ] is True

          current = {
              p.name
              for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          expected_current = set(archive_targets) | protected
          if current != expected_current:
              raise SystemExit(
                  "Cleanup inventory drift. Refusing to guess.\n"
                  f"Missing expected: {sorted(expected_current-current)}\n"
                  f"Unexpected current: {sorted(current-expected_current)}"
              )
          if set(archive_targets) & protected:
              raise SystemExit("archive/protected overlap")

          patched = (
              workflow_dir
              / "draft-pick-fv-v8-phase0b-qualified-depth-feasibility-PATCHED.yml"
          )
          if not patched.exists():
              raise SystemExit(
                  "Patched Draft Pick V8 Phase 0B workflow is not protected"
              )

          rows = []
          for name, expected_sha in sorted(archive_targets.items()):
              src = workflow_dir / name
              dst = archive_dir / name
              if not src.exists():
                  raise SystemExit(f"Archive target missing: {src}")
              if dst.exists():
                  raise SystemExit(
                      f"Archive destination already exists: {dst}"
                  )
              actual_sha = git_blob_sha(src)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"SHA drift for {name}: "
                      f"expected={expected_sha} actual={actual_sha}"
                  )
              triggers = trigger_names(src)
              if triggers != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Refusing to archive non-manual-only workflow "
                      f"{name}: triggers={sorted(triggers)}"
                  )

              if name.startswith("draft-pick-fv-v7-"):
                  family = "Draft Pick FV V7"
              elif name.startswith("draft-pick-fv-v8-"):
                  family = "Draft Pick FV V8 completed/superseded"
              elif name.startswith("package-adjustment-v7-"):
                  family = "Package Adjustment V7"
              elif name.startswith("package-adjustment-v8-"):
                  family = "Package Adjustment V8 completed phase"
              else:
                  raise SystemExit(
                      f"Unknown cleanup family for {name}"
                  )

              rows.append(
                  {
                      "original_path": str(src),
                      "archive_path": str(dst),
                      "git_blob_sha": actual_sha,
                      "sha256": hashlib.sha256(
                          src.read_bytes()
                      ).hexdigest(),
                      "triggers": sorted(triggers),
                      "cleanup_batch": batch,
                      "research_family": family,
                  }
              )

          assert len(current) == 46
          assert len(rows) == 26
          assert len(protected) == 20

          plan = {
              "schema_version": 8,
              "cleanup_batch": batch,
              "authorization_evidence": {
                  "run_evidence": run_evidence,
                  "package_v7_decision": pkg_v7["decision"],
                  "package_v8_power_decision": power["decision"],
                  "package_v8_phase1b_status": design["status"],
                  "package_v8_phase1b_metric":
                      design["primary_concentration_metric"]["name"],
              },
              "active_before_n": len(current),
              "archive_now_n": len(rows),
              "active_after_n": len(protected),
              "protected_active_workflows": sorted(protected),
              "archive_entries": rows,
              "delete_entries": [],
          }

          Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          ).write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: exact research closure evidence authorizes cleanup.")
          print("PASS: active workflows before cleanup: 46")
          print("PASS: exact workflows to archive: 26")
          print("PASS: patched Draft Pick V8 Phase 0B remains protected.")
          print("PASS: active protected workflows after cleanup: 20")
          PY

      - name: Archive exact completed and superseded workflows
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(
              Path(
                  ".github/workflow-archive/workflow-cleanup-plan.json"
              ).read_text(encoding="utf-8")
          )

          for row in plan["archive_entries"]:
              src = Path(row["original_path"])
              dst = Path(row["archive_path"])
              dst.parent.mkdir(parents=True, exist_ok=True)

              if not src.exists() or dst.exists():
                  raise SystemExit(
                      f"Unsafe move state: src={src.exists()} "
                      f"dst={dst.exists()} for {src.name}"
                  )

              src.rename(dst)

              actual = hashlib.sha256(dst.read_bytes()).hexdigest()
              if actual != row["sha256"]:
                  raise SystemExit(
                      f"Post-move hash mismatch: {dst}"
                  )

          print(
              f"PASS: archived "
              f"{len(plan['archive_entries'])} exact workflows."
          )
          PY

      - name: Update archive manifest and README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          archive_dir = Path(
              ".github/workflow-archive/completed-research"
          )
          plan_path = Path(
              ".github/workflow-archive/workflow-cleanup-plan.json"
          )
          manifest_path = archive_dir / "archive_manifest.json"
          readme_path = archive_dir / "README.md"

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          old = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          assert old["archive_workflow_n"] == 132
          assert old["last_cleanup_batch"] == (
              "2026-09-25-post-dlf-prospect-fv-v2"
          )

          archive_by_original = {
              row["original_path"]: row
              for row in old.get("archive_entries", [])
          }

          for row in plan["archive_entries"]:
              prior = archive_by_original.get(row["original_path"])
              if prior and prior.get("sha256") != row["sha256"]:
                  raise SystemExit(
                      f"Archive manifest conflict: "
                      f"{row['original_path']}"
                  )
              archive_by_original[row["original_path"]] = row

          archive_entries = [
              archive_by_original[k]
              for k in sorted(archive_by_original)
          ]
          deleted_entries = list(
              old.get("deleted_obsolete_workflows", [])
          )

          actual_yaml = sorted(
              p.name
              for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )
          manifest_yaml = sorted(
              Path(row["archive_path"]).name
              for row in archive_entries
          )
          if actual_yaml != manifest_yaml:
              raise SystemExit(
                  "Archive inventory mismatch after workflow moves."
              )

          now = datetime.now(timezone.utc).isoformat()

          manifest = {
              "schema_version": 8,
              "last_cleanup_batch": plan["cleanup_batch"],
              "last_cleanup_at_utc": now,
              "last_cleanup_authorization_evidence":
                  plan["authorization_evidence"],
              "archive_workflow_n": len(archive_entries),
              "protected_active_workflow_n":
                  len(plan["protected_active_workflows"]),
              "protected_active_workflows":
                  plan["protected_active_workflows"],
              "archive_entries": archive_entries,
              "deleted_obsolete_workflows": deleted_entries,
          }

          manifest_path.write_text(
              json.dumps(
                  manifest, indent=2, sort_keys=True
              ) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual-only research/deployment workflows "
              "are moved out of `.github/workflows` so they do not "
              "clutter the GitHub Actions workflow list.",
              "",
              "Archived YAML files are preserved byte-for-byte. "
              "Original paths, Git blob SHAs, SHA-256 hashes, and "
              "triggers are recorded in `archive_manifest.json`.",
              "",
              "Recurring production/data workflows and studies that "
              "are still active or intentionally rerunnable remain "
              "in `.github/workflows`.",
              "",
              f"Archive refreshed: {now}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              f"Active protected workflow count: "
              f"**{len(plan['protected_active_workflows'])}**",
              "",
              "## Active protected workflows",
              "",
          ]
          lines.extend(
              f"- {name}"
              for name in plan["protected_active_workflows"]
          )
          lines += ["", "## Archived workflows", ""]
          lines.extend(f"- {name}" for name in actual_yaml)

          if deleted_entries:
              lines += [
