          assert len(actual_yaml) == 158
          assert len(plan["protected_active_workflows"]) == 20

          print(
              f"PASS: archive manifest now tracks "
              f"{len(archive_entries)} workflows."
          )
          PY

      - name: Validate remaining active workflow folder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          import yaml

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )
          expected = set(
              manifest["protected_active_workflows"]
          )

          workflow_dir = Path(".github/workflows")
          actual = {
              p.name
              for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }

          if actual != expected:
              raise SystemExit(
                  "Active workflow mismatch.\n"
                  f"Expected={sorted(expected)}\n"
                  f"Actual={sorted(actual)}"
              )

          names = {}
          for p in sorted(workflow_dir.iterdir()):
              if p.suffix not in {".yml", ".yaml"}:
                  continue
              doc = yaml.load(
                  p.read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid YAML object: {p}")

              display = str(doc.get("name") or "")
              if not display:
                  raise SystemExit(
                      f"Workflow has no name: {p}"
                  )
              if display in names:
                  raise SystemExit(
                      f"Duplicate workflow display name: {display}: "
                      f"{names[display]} and {p.name}"
                  )
              names[display] = p.name

              if "on" not in doc:
                  raise SystemExit(
                      f"Workflow has no trigger: {p}"
                  )

          assert not any(
              name.startswith("draft-pick-fv-v7-")
              for name in actual
          )
          assert not any(
              name.startswith("package-adjustment-v7-")
              for name in actual
          )
          assert (
              "draft-pick-fv-v8-phase0b-qualified-depth-feasibility-PATCHED.yml"
              in actual
          )
          assert "workflow-folder-cleanup.yml" in actual
          assert (
              "workflow-folder-cleanup-UPDATED-2026-09-26.yml"
              not in actual
          )
          assert (
              "workflow-folder-cleanup-FIXED-2026-09-26.yml"
              not in actual
          )

          dispatcher = (
              workflow_dir
              / "package-adjustment-audit-step4-exact-live-oos.yml"
          )
          text = dispatcher.read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in text
          assert "schedule:" in text

          assert len(actual) == 20

          print(
              "PASS: active Actions folder now contains exactly "
              "20 protected workflows."
          )
          print(
              "PASS: no Draft Pick V7 or Package Adjustment V7 "
              "workflow remains active."
          )
          print(
              "PASS: patched Draft Pick V8 Phase 0B remains active."
          )
          PY

