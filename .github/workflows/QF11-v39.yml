        const assignments=Object.fromEntries(Array.from({length:12},(_,i)=>[hmac(token(i+1)),{slot:i+1,display_order:i%6}]));\n\
        const GATES=['QF11_V2_ENABLED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'];\n\
        const NOW=Date.parse('2026-10-12T17:00:00.000Z'); // fixture time, not production clock\nconst SyntheticDate=class\
        \ extends Date {static now(){return NOW;}};\nlet passed=0;const labels=[];\nfunction check(label,test){test();passed++;labels.push(label);console.log('PASS\
        \ '+label)}\nfunction fixture(authorized=false){\n  const rows=[HEADERS.slice()];\n  let locked=false;\n  const\
        \ conf={QF11_V2_ENABLED:'false',QF11_V2_HALTED:'false',QF11_V2_CLOSED:'false',QF11_V2_SHEET_ID:'SYNTHETIC_V2_ONLY',QF11_V1_SHEET_ID:'SYNTHETIC_V1_ONLY',QF11_V2_SEPARATE_SHEET_VERIFIED:'YES',QF11_V2_HMAC_SECRET:secret,QF11_V2_INVITES_JSON:JSON.stringify(assignments),QF11_V2_PLAYER_KEYS_JSON:JSON.stringify(['sample_a','sample_b','sample_c'])};\n\
