        \ expiry blocks next slot and sets HALTED',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[1][1]='2000-01-01T00:00:00Z';assert.strictEqual(e.post(e.payload(2)),'HALTED');assert.strictEqual(e.rows.length,2);assert.strictEqual(e.conf.QF11_V2_HALTED,'true')});\n\
        check('malformed pending expiry blocks next slot',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[1][1]='bad-date';assert.strictEqual(e.post(e.payload(2)),'HALTED');assert.strictEqual(e.rows.length,2);assert.strictEqual(e.conf.QF11_V2_HALTED,'true')});\n\
        check('expiry equal to current time blocks intake',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[1][1]=new\
        \ Date(NOW).toISOString();assert.strictEqual(e.post(e.payload(2)),'HALTED');assert.strictEqual(e.rows.length,2)});\n\
        check('valid unexpired response permits new valid slot',()=>{const e=fixture(true);assert.strictEqual(e.post(e.payload(1)),'PENDING_HUMAN_Q4_REVIEW');assert.strictEqual(e.post(e.payload(2)),'PENDING_HUMAN_Q4_REVIEW');assert.strictEqual(e.rows.length,3);assert.strictEqual(e.conf.QF11_V2_HALTED,'false')});\n\
        check('purge schema error sets HALTED instead of leaving intake open',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[0][0]='invalid_header';assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/SHEET_SCHEMA_MISMATCH/);assert.strictEqual(e.conf.QF11_V2_HALTED,'true');assert.strictEqual(e.rows.length,2)});\n\
        check('purge lock acquisition failure sets HALTED',()=>{const e=fixture(true);e.post(e.payload(1));e.forceLock();assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/LOCK_UNAVAILABLE/);assert.strictEqual(e.conf.QF11_V2_HALTED,'true');assert.strictEqual(e.rows.length,2);e.unlock()});\n\
        check('deleteRow failure sets HALTED before first deletion',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[1][1]='2000-01-01T00:00:00Z';const\
        \ original=e.env.SpreadsheetApp.openById;e.env.SpreadsheetApp.openById=id=>{const book=original(id);const get=book.getSheetByName;book.getSheetByName=name=>{const\
        \ sheet=get(name);sheet.deleteRow=()=>{throw new Error('SYNTHETIC_DELETE_FAILURE')};return sheet};return book};assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/SYNTHETIC_DELETE_FAILURE/);assert.strictEqual(e.conf.QF11_V2_HALTED,'true');assert.strictEqual(e.rows.length,2)});\n\
        check('partial purge failure stays HALTED with remaining stale data',()=>{const e=fixture(true);e.post(e.payload(1));e.post(e.payload(2));e.rows[1][1]='2000-01-01T00:00:00Z';e.rows[2][1]='2000-01-01T00:00:00Z';const\
        \ original=e.env.SpreadsheetApp.openById;let deletes=0;e.env.SpreadsheetApp.openById=id=>{const book=original(id);const\
        \ get=book.getSheetByName;book.getSheetByName=name=>{const sheet=get(name);const del=sheet.deleteRow;sheet.deleteRow=row=>{if(++deletes===2)throw\
        \ new Error('SYNTHETIC_PARTIAL_FAILURE');del(row)};return sheet};return book};assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/SYNTHETIC_PARTIAL_FAILURE/);assert.strictEqual(e.conf.QF11_V2_HALTED,'true');assert.strictEqual(e.rows.length,2);assert.strictEqual(e.post(e.payload(3)),'HALTED')});\n\
        check('empty purge leaves intake state unchanged',()=>{const e=fixture(true);assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),0);assert.strictEqual(e.conf.QF11_V2_HALTED,'false')});\n\
        check('successful purge deletes expired and prevents new intake',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[1][1]='2000-01-01T00:00:00Z';assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),1);assert.strictEqual(e.rows.length,1);assert.strictEqual(e.conf.QF11_V2_HALTED,'true');assert.strictEqual(e.post(e.payload(2)),'HALTED')});\n\
        check('no real trigger installation performed by collector source',()=>{assert(!source.includes('ScriptApp.newTrigger('));assert(source.includes('function\
        \ purgeExpiredQF11V2Rows()'))});\ncheck('no source path writes to V1 or market value',()=>{assert(!source.includes('market_values.json'));assert(!source.includes('KTC_SUBMIT_URL'));assert(source.includes('QF11_V2_SHEET_ID'))});\n\
        assert.strictEqual(passed,12);\nfs.mkdirSync('/tmp/qf11-v39',{recursive:true});\nfs.writeFileSync('/tmp/qf11-v39/hardening-tests.json',JSON.stringify({schema:'QF11_V39_FAIL_CLOSED_SYNTHETIC_V1',tests_passed:passed,test_names:labels,real_votes:0,google_calls:0,google_modified:false},null,2)+'\\\
        n');\nconsole.log('QF11_V39_ADDITIONAL_12_SECURITY_CHECKS_GREEN');\nJSV39BATCH\nnode --check /tmp/qf11-v39/retention_audit.js\n\
        node --check /tmp/qf11-v39/hardening_tests.js\nnode /tmp/qf11-v39/retention_audit.js research/ktc-v2-isolated/collector.gs\n\
        node /tmp/qf11-v39/hardening_tests.js research/ktc-v2-isolated/collector.gs\ncp /tmp/qf11-v38/retention-report.json\
        \ /tmp/qf11-v39/retention-report.json\necho QF11_V39_29_SYNTHETIC_RETENTION_AND_FAILURE_CASES_GREEN\n"
