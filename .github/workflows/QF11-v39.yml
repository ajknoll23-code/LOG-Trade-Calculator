        \ throwing'],\n 'real_world_launch_gates':{\n    'deployed_google_code_synced':False,\n    'v2_collection_enabled':False,\n\
        \    'actual_retention_trigger_verified':False,\n    'actual_30_day_ceiling_verified':False,\n    'actual_google_iframe_referrer_and_rpc_verified':False,\n\
        \    'independent_ballot_consent_q4_moderator_review':False,\n    'owner_authorized_real_pilot':False},\n 'remaining_observations':[\n\
        \   {'severity':'BLOCKER','area':'Google deployment','detail':'Repository collector source update does not update\
