# QF11 V39 -- batched collector-source hardening only; no deployment, no invitations,
# no Google RPC, no Apps Script project or spreadsheet writes, and no model changes.
# Green means patched GitHub source passed synthetic checks and regressions,
# NOT that the existing disabled Google collector or real pilot is approved.
name: QF11 V39 - KTC V2 Batched Retention and Fail Closed Repair (Source Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: qf11-v39-ktc-v2-batch-security-source-only
  cancel-in-progress: false
jobs:
  batch_hardening:
    name: Patch two retention failure boundaries; run 104 synthetic checks; never deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout pinned main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install frozen regression dependency
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Fail closed on any existing KTC V2 or production input drift
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_RUN_SHA_DRIFT; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_WORKTREE_DIRTY; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_DRIFT_$1"; exit 1; }; }

        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28

        check research/ktc-v2-isolated/collector.gs b4ce85ea8bf72ef5399d5ffc898b3b571fbcad89

        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a

        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d

        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7

        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860

        check research/ktc-v2-isolated/client-bridge.js a7dd731fd013c0ce7e547eb05ae8c825e85ccd9b

        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167

        check research/ktc-v2-isolated/README.md 8dce132bfd2fa9584636b072fff4fde4cecf9436

        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        [[ -f data/players_cache.json ]] || { echo STOP_PRODUCTION_CACHE_MISSING; exit 1; }

        echo QF11_V38_FROZEN_INPUTS_GREEN

        '
    - name: Apply both fail-closed retention source protections
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v39\ncat > /tmp/qf11-v39/v39_harden.py <<'PYV39PATCH'\nfrom pathlib import\
        \ Path\np=Path('research/ktc-v2-isolated/collector.gs')\ns=p.read_text()\nold='''  var sheet=qf11v2Sheet_(props);\n\
        \  var rows=sheet.getDataRange().getValues().slice(1);\n  if(rows.some(function(row){return String(row[5])===digest\
        \ || Number(row[3])===assignment.slot;})) return 'DUPLICATE_OR_SLOT_USED';'''\nnew='''  var sheet=qf11v2Sheet_(props);\n\
        \  var rows=sheet.getDataRange().getValues().slice(1);\n  // V39: fail closed if the purge trigger failed or a deadline\
        \ is corrupt.\n  // Do not accept a fresh response while stale participant data remain.\n  if(!Number.isFinite(now)\
        \ || rows.some(function(row){\n    var due=Date.parse(String(row[1]));\n    return !Number.isFinite(due) || due<=now;\n\
        \  })) {\n    props.setProperty('QF11_V2_HALTED','true');\n    return 'HALTED';\n  }\n  if(rows.some(function(row){return\
        \ String(row[5])===digest || Number(row[3])===assignment.slot;})) return 'DUPLICATE_OR_SLOT_USED';'''\nassert s.count(old)==1,\
        \ 'STOP_HANDLER_ANCHOR_DRIFT'\ns=s.replace(old,new)\nold2 = s[s.index('function purgeExpiredQF11V2Rows() {'):]\n\
        assert 'var count=0, now=Date.now();' in old2 and old2.rstrip().endswith('} finally {lock.releaseLock();}\\n}'),\
        \ 'STOP_PURGE_BODY_DRIFT'\nnew2='''function purgeExpiredQF11V2Rows() {\n  var props=PropertiesService.getScriptProperties();\n\
        \  var lock=LockService.getScriptLock();\n  var acquired=false;\n  try {\n    qf11v2Assert_(lock.tryLock(15000),'LOCK_UNAVAILABLE');\n\
        \    acquired=true;\n    var sheet=qf11v2Sheet_(props),values=sheet.getDataRange().getValues();\n    var now=Date.now(),expired=[];\n\
        \    for(var i=values.length-1;i>=1;i--){\n      var due=Date.parse(String(values[i][1]));\n      if(!Number.isFinite(due)\
        \ || due<=now)expired.push(i+1);\n    }\n    // V39: halt BEFORE attempting any deletion, including partial failures.\n\
        \    if(expired.length>0)props.setProperty('QF11_V2_HALTED','true');\n    expired.forEach(function(row){sheet.deleteRow(row);});\n\
        \    // Only return a count (no respondent identifiers or raw data).\n    return expired.length;\n  } catch(error)\
        \ {\n    // A failed scheduled purge must not leave intake authorized.\n    props.setProperty('QF11_V2_HALTED','true');\n\
        \    throw error;\n  } finally {if(acquired)lock.releaseLock();}\n}'''\nassert s.count(old2)==1,'STOP_PURGE_ANCHOR_DRIFT'\n\
        s=s.replace(old2,new2.rstrip()+\"\\n\")\nassert s.count('function purgeExpiredQF11V2Rows()')==1\nassert s.count('function\
        \ qf11v2Handle_(')==1\nassert s.count(\"props.setProperty('QF11_V2_HALTED','true')\")>=4\np.write_text(s)\nprint('QF11_V39_TWO_FAIL_CLOSED_RETENTION_PATCHES_APPLIED')\n\
        PYV39PATCH\npython3 /tmp/qf11-v39/v39_harden.py\nnode --check < research/ktc-v2-isolated/collector.gs\ngit diff\
        \ --check\necho QF11_V39_RETENTION_GUARD_AND_PURGE_FAILURE_PATCH_APPLIED\n"
    - name: Run 17 prior plus 12 new synthetic retention, lock, and deletion tests
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v39\ncat > /tmp/qf11-v39/retention_audit.js <<'JSV38REPEAT'\n'use strict';\n\
