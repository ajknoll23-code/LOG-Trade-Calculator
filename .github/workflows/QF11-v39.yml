        index=Path('index.html').read_text()\n# Confirm that unsafe claims cannot be inferred from an off-network synthetic\
        \ audit.\nassert 'HtmlService.XFrameOptionsMode.ALLOWALL' in host\nassert 'document.referrer' in html and 'window.self!==window.top'\
        \ in html\nassert 'google.script.run.withSuccessHandler' in html\nassert 'function qf11v33Bootstrap(' in host and\
        \ 'function qf11v33Submit(' in host\nassert 'function qf11v2IntakeAuthorized_(props)' in collector\nassert 'function\
