        \ Q4 moderator review, other copies/logs/exports and approved privacy SOP still require human review.'},\n   {'severity':'BLOCKER','area':'Authorization','detail':'No\
        \ real participants or pilot activation allowed without explicit owner approval.'}],\n 'google_calls_from_workflow':0,'live_votes_written':0,'new_apps_script_project_created':False,\n\
