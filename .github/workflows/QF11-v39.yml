        check('every one of seven approval flags independently blocks intake',()=>{for(const gate of GATES){const e=fixture(true);e.conf[gate]='false';assert.strictEqual(e.post(e.payload()),'DISABLED',gate);assert.strictEqual(e.rows.length,1)}});\n\
