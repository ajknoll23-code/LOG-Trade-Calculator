name: A-QA11 - B46 Independent Role Evidence Shadow (Read Only)
run-name: A-QA11 B46 role versus fantasy slot FV shadow

'on':
  workflow_dispatch:
    inputs:
      qa10_run_id:
        description: Successful QA10R1 provenance-only source preview run
        required: true
        type: string
        default: '41084608509'
      qa08_run_id:
        description: Successful QA08 exact DOB-parity replay run
        required: true
        type: string
        default: '41072676062'

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa11-b46-independent-role-read-only
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA10_RUN_ID: ${{ inputs.qa10_run_id }}
      QA08_RUN_ID: ${{ inputs.qa08_run_id }}
      QA10_IN: /tmp/qa11-qa10
      QA08_IN: /tmp/qa11-qa08
      QA11_OUT: /tmp/qa11-output
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify green upstream run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$QA10_RUN_ID" =~ ^[0-9]{7,15}$ ]] && [[ "$QA08_RUN_ID" =~ ^[0-9]{7,15}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA10_RUN_ID" > "$RUNNER_TEMP/qa10_run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA08_RUN_ID" > "$RUNNER_TEMP/qa08_run.json"
          python3 - <<'PY_VERIFY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          checks=[('qa10','.github/workflows/A-QA10-Role-Provenance-Preview-Renamed.yml',
                   'A-QA10R1 source-pinned role provenance preview READ ONLY'),
                  ('qa08','.github/workflows/A-QA08R1-Role-Audit.yml',
                   'A-QA08 RB DOB parity and source-role audit')]
          for label,path,title in checks:
              run=json.loads((root/f'{label}_run.json').read_text())
              for k,v in {'status':'completed','conclusion':'success','event':'workflow_dispatch',
                          'path':path,'display_title':title,'head_branch':'main'}.items():
                  assert run.get(k)==v,(label,k,run.get(k))
              assert run.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY']
          print('Source QA10 and QA08 runs verified green and read-only.')
          PY_VERIFY

      - name: Download QA10 provenance queue
        uses: actions/download-artifact@v4
        with:
          name: A-QA10R1-Provenance-Patch-Preview
          run-id: ${{ inputs.qa10_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/qa11-qa10
      - name: Download QA08 DOB-corrected original valuations
        uses: actions/download-artifact@v4
        with:
          name: A-QA08-DOB-Parity-Role-Evidence
          run-id: ${{ inputs.qa08_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/qa11-qa08

      - name: Pin original source revision and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PIN'
          import hashlib,json,os,pathlib,re
          ten=pathlib.Path(os.environ['QA10_IN']);eight=pathlib.Path(os.environ['QA08_IN'])
          a=json.loads((ten/'QA10_Manifest.json').read_text())
          b=json.loads((eight/'QA08_Manifest.json').read_text())
          assert a['status']=='QA10_PROVENANCE_ONLY_PATCH_PREVIEW_READ_ONLY'
          assert a['cohort']==72 and a['role_sensitive_count']==37 and a['priority_role_conflict_count']==9
          assert a['metadata_only'] is True and a['owner_release_authorized'] is False
          assert a['fv_changes']==a['fv_plus_changes']==a['mv_changes']==a['repository_mutations']==0
          assert b['status']=='QA08_DOB_PARITY_AND_DEPTH_SOURCE_COMPLETE_READ_ONLY'
          assert b['remaining_parity_holds']==0
          assert a['source_qa08_run']==os.environ['QA08_RUN_ID']
          assert a['source_git_sha']==b['source_git_sha']
          assert len(a['source_index_sha256'])==64
          sha=a['source_git_sha'];assert re.fullmatch('[a-f0-9]{40}',sha)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'qa11_sha').write_text(sha)
          PY_PIN
          git fetch --depth=1 origin "$(cat "$RUNNER_TEMP/qa11_sha")"
          git checkout --detach "$(cat "$RUNNER_TEMP/qa11_sha")"
          python3 - <<'PY_HASH'
          import hashlib,json,os,pathlib
          a=json.loads((pathlib.Path(os.environ['QA10_IN'])/'QA10_Manifest.json').read_text())
          assert hashlib.sha256(pathlib.Path('index.html').read_bytes()).hexdigest()==a['source_index_sha256']
          assert (pathlib.Path(os.environ['RUNNER_TEMP'])/'qa11_sha').read_text()==os.popen('git rev-parse HEAD').read().strip()
          print('Historical live pricing source pinned and verified.')
          PY_HASH

      - name: Build stable-ID B46 and projection evidence cohort
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA11_OUT"
          cat > "$RUNNER_TEMP/qa11_inputs.py" <<'PY_INPUTS'
          import csv,json,os,pathlib,collections,hashlib
          out=pathlib.Path(os.environ['QA11_OUT'])
          qa10=pathlib.Path(os.environ['QA10_IN'])
          qa08=pathlib.Path(os.environ['QA08_IN'])
          def load_csv(path):
              with path.open(encoding='utf8',newline='') as f:return list(csv.DictReader(f))
          q10=load_csv(qa10/'QA10_All72_Provenance_Preview.csv')
          q08=load_csv(qa08/'QA08_All72_DOB_And_Depth.csv')
          assert len(q10)==len(q08)==72
          ten={r['sleeper_id']:r for r in q10};eight={r['sleeper_id']:r for r in q08}
          assert len(ten)==len(eight)==72 and set(ten)==set(eight)
          b46=json.loads(pathlib.Path('data/player_role_v2_week5.json').read_text())
          assert b46['study_id']=='player-role-v2' and b46['season']==2026 and b46['week']==5
          assert b46['publication_scope']=='DISPLAY_ONLY_FROZEN_PROSPECTIVE_ROLE_SNAPSHOT'
          assert b46['score_or_confidence_probability_calibrated'] is False
          assert b46['valuation_adjustments_authorized'] is False
          roles={'Elite','Every-Down','Starter','Rotational','Understudy','Depth','Speculative'}
          b46_map={}
          for p in b46['players']:
              sid=str(p['sleeper_id'])
              assert sid not in b46_map,'Repeated B46 ID '+sid
              assert p['role_tier'] in roles
              b46_map[sid]=p
          lineup=json.loads(pathlib.Path('scripts/artifacts/generated/team_utility_lineup_projections.json').read_text())
          assert lineup['purpose']=='Team Utility starter selection only; never Fundamental Value'
          projections=lineup['players']
          assert isinstance(projections,dict)
          cohort=[]
          for sid,q in ten.items():
              a=eight[sid]
              assert q['name']==a['player'] and q['position']==a['position']
              assert int(q['current_FV_UNCHANGED'])==int(a['published_fv'])
              assert q['legacy_role']==a['assigned_role']
              assert a['corrected_parity']=='PARITY_PASS'
              assert a['current_fv_changed']=='NO' and a['replacement_fv']==''
              assert q['release_approved']=='NO' and q['proposed_new_fv']==''
              assert q['role_and_FV_formula_changed_in_preview']=='NO'
              r=b46_map.get(sid); pr=projections.get(sid)
              if r:
                  assert r['confidence']=='Not calibrated',('Unexpected calibrated evidence',sid)
              if pr:
                  assert pr['sleeper_id']==sid,('Projection identity mismatch',sid)
              # Position changes (particularly DL/LB) are not silently merged.
              # Retain each source observation, hold any non-comparable role/price replay.
              b46_ok=bool(r and r['position']==a['position'])
              proj_ok=bool(pr and pr['pos']==a['position'])
              tier=r['role_tier'] if b46_ok else ''
              cohort.append({
                  'sleeper_id':sid,'player':a['player'],'position':a['position'],
                  'age':float(a['age']),'birth_date':a['sleeper_birth_date'],
                  'fantasy_slot':a['fantasy_slot'],'legacy_role':a['assigned_role'],
                  'published_fv':int(a['published_fv']),'source_risk_priority':q['priority'],
                  'role_sensitive':q['role_sensitive']=='TRUE',
                  'nfl_depth_order':a['sleeper_depth_chart_order'],
                  'b46_role':tier,
                  'b46_role_observed':r['role_tier'] if r else '',
                  'b46_position_observed':r['position'] if r else '',
                  'b46_games':r['active_games'] if r else None,
                  'b46_confidence':r['confidence'] if r else '',
                  'role_agreement': ('B46_MISSING' if not r else
                                     'B46_POSITION_MISMATCH_HOLD' if not b46_ok else
                                     'MATCH' if tier==a['assigned_role'] else 'DISAGREE'),
                  'projection_points_CONTEXT_ONLY':pr.get('projection') if proj_ok else None,
                  'projection_source_CONTEXT_ONLY':pr.get('source','') if proj_ok else '',
                  'projection_weeks_CONTEXT_ONLY':pr.get('weeks_with_projection_data') if proj_ok else None,
                  'projection_evidence_status':('MISSING' if not pr else
                     'POSITION_MISMATCH_HOLD' if not proj_ok else 'SAME_POSITION_CONTEXT'),
              })
          assert sum(x['role_sensitive'] for x in cohort)==37
          assert sum(x['source_risk_priority'] in ('HIGHEST','HIGH') for x in cohort)==9
          (out/'QA11_Input72.json').write_text(json.dumps(cohort,indent=2)+'\n')
          (out/'QA11_B46_Source_Metadata.json').write_text(json.dumps({k:v for k,v in b46.items() if k!='players'},indent=2)+'\n')
          print('B46 same-position coverage:',sum(bool(x['b46_role']) for x in cohort),'of 72; position mismatches held; independent values never applied')
          PY_INPUTS
          python3 -m py_compile "$RUNNER_TEMP/qa11_inputs.py"
          python3 "$RUNNER_TEMP/qa11_inputs.py"

      - name: Replay exact live FV JS using B46 tier as hypothetical input only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa11_shadow.js" <<'JS_SHADOW'
          'use strict';
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('index.html','utf8');
          const cases=JSON.parse(fs.readFileSync(process.env.QA11_OUT+'/QA11_Input72.json','utf8'));
          function stop(s){throw Error('QA11 SOURCE HALT: '+s)}
          for(const pattern of [
            /function playerValue\(pos, age, role, name\)\{/,
            /const rm = productionMultiplier\(name \|\| '', role\);/,
            /return Math\.round\(100 \* pw \* am \* rm \* 55\);/,
            /function productionMultiplier\(name, role\)\{/
          ])if(!pattern.test(source))stop('Source contract changed '+pattern);
          function getConst(name){
            const m=new RegExp('^const '+name+'\\s*=', 'm').exec(source);
            if(!m)stop('Missing constant '+name);
            const start=m.index,rhsStart=start+m[0].length,tail=source.slice(rhsStart);
            if(tail.trimStart().startsWith('{')){
              const first=tail.split('\n',1)[0];
              if(/^\s*\{[^{}]*\}\s*;\s*(?:\/\/.*)?$/.test(first))
                return source.slice(start,rhsStart+first.length);
              const end=/^};\s*$/m.exec(tail);
              if(!end)stop('Object not terminated '+name);
              const r=source.slice(start,rhsStart+end.index+end[0].length);
              if(/^const [A-Za-z_$][\w$]*\s*=/m.test(r.slice(m[0].length)))
                stop('Captured other constant '+name);
              return r;
            }
            const i=source.indexOf('\n',rhsStart),s=source.slice(start,i<0?undefined:i);
            if(!s.includes(';'))stop('Constant not terminated '+name);
            return s;
          }
          function getFn(name){
            const m=new RegExp('^function '+name+'\\([^\\n]*\\)\\s*\\{','m').exec(source);
            if(!m)stop('Missing function '+name);
            const tail=source.slice(m.index),end=/^}\s*$/m.exec(tail);
            if(!end)stop('Function not terminated '+name);
            return tail.slice(0,end.index+end[0].length);
          }
          const constants=['POSITION_WEIGHT','AGE_CURVE','QB_POST_PEAK_FLOOR',
            'LB_POST_PEAK_DECAY_POWER','ROLE_MULT','PROD_MULT_DATA',
            'NO_REAL_PRODUCTION_HISTORY','CAL22_LEGACY_MONOTONE_KEYS','PROD_MULT',
            'PLAYER_DB','RB_BIRTH_DATE_DATA','CAL26_FV_OWNER_ANCHORS'];
          const functions=['normalizeName','productionMultiplier','ageMultiplier',
            'fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier',
            'effectiveAgeMultiplier','playerValue'];
          const script=constants.map(getConst).join('\n')+'\n'+functions.map(getFn).join('\n')+
            '\nglobalThis.QA11={playerValue,normalizeName,PLAYER_DB};';
          const FIXED_DAY='2026-10-30T12:00:00.000Z';
          class AuditDate extends Date{
            constructor(...args){super(...(args.length?args:[FIXED_DAY]));}
            static now(){return Date.parse(FIXED_DAY);}
          }
          const sandbox={Date:AuditDate};
          try{vm.runInNewContext(script,sandbox,{timeout:12000})}
          catch(e){stop('Exact source isolation failed '+e.message)}
          const model=sandbox.QA11;
          if(!model||typeof model.playerValue!=='function')stop('Missing replay function');
          const results=[];
          for(const row of cases){
            const key=model.normalizeName(row.player),prior=model.PLAYER_DB[key];
            if(row.birth_date)model.PLAYER_DB[key]={...(prior||{}),birth_date:row.birth_date};
            const legacy=model.playerValue(row.position,row.age,row.legacy_role,row.player);
            if(legacy!==row.published_fv)stop('Published FV parity failed '+row.player+' '+legacy+' '+row.published_fv);
            const b46=row.b46_role?model.playerValue(row.position,row.age,row.b46_role,row.player):null;
            if(b46!==null&&(!Number.isInteger(b46)||b46<0||b46>20000))
              stop('Invalid B46 shadow '+row.player);
            if(prior===undefined)delete model.PLAYER_DB[key];else model.PLAYER_DB[key]=prior;
            results.push({...row,baseline_parity:'EXACT',baseline_fv:legacy,
              b46_role_fv_HYPOTHETICAL_NOT_RECOMMENDED:b46,
              b46_role_delta_HYPOTHETICAL_NOT_RECOMMENDED:b46===null?null:b46-legacy,
              proposed_new_fv:'',applied_change:'NONE'});
          }
          if(results.length!==72)stop('Wrong source cohort');
          fs.writeFileSync(process.env.QA11_OUT+'/QA11_Shadow72.json',JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify({players:72,exact_parity:72,b46_role_coverage:results.filter(x=>x.b46_role).length,
            b46_disagreement:results.filter(x=>x.role_agreement==='DISAGREE').length,
            production_changes:0}));
          JS_SHADOW
          node --check "$RUNNER_TEMP/qa11_shadow.js"
          node "$RUNNER_TEMP/qa11_shadow.js"

      - name: Generate decision-ready evidence and explicit price holds
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa11_report.py" <<'PY_REPORT'
          import csv,collections,datetime,hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['QA11_OUT'])
          data=json.loads((out/'QA11_Shadow72.json').read_text())
          assert len(data)==72 and len({x['sleeper_id'] for x in data})==72
          assert all(x['baseline_parity']=='EXACT' and x['applied_change']=='NONE' and x['proposed_new_fv']=='' for x in data)
          match=collections.Counter(x['role_agreement'] for x in data)
          priority=sorted((x for x in data if x['source_risk_priority'] in ('HIGHEST','HIGH')),
                          key=lambda x: (0 if x['source_risk_priority']=='HIGHEST' else 1, x['player']))
          assert len(priority)==9
          matched=sum(bool(x['b46_role']) for x in data)
          contextual=sum(x['projection_points_CONTEXT_ONLY'] is not None for x in data)
          role_sensitive_disagree=sum(x['role_sensitive'] and x['role_agreement']=='DISAGREE' for x in data)
          cols=list(data[0]);
          with (out/'QA11_All72_B46_Independent_Role_Shadow.csv').open('w',newline='',encoding='utf8') as f:
              w=csv.DictWriter(f,fieldnames=cols);w.writeheader();w.writerows(data)
          def fmt(v):return 'N/A' if v is None else f'{v:,}'
          report=['# A-QA11 — B46 Independent Role Evidence Shadow (Read Only)','',
           '**NO RELEASE: source B46 Week 5 explicitly uncalibrated and display-only. Hypothetical FVs are not price recommendations.**','',
           '## Exact source verification','',
           '- All 72 current published FVs reproduced exactly using the pinned production JavaScript and DOB from QA08.',
           '- No current price, roster role, UI or repository source was changed.',
           '- The B46 signal is generated independently of fantasy roster slot, but is frozen at **Week 5** and is not probability-calibrated.',
           '- The Team Utility projection source expressly says its points must **never** feed Fundamental Value directly.',
           '', '## Snapshot coverage','',
           f'- B46 same-position Sleeper ID matches usable for shadow: **{matched}/72**.',
           f'- B46 stable-ID matches held for position conflict: **{match["B46_POSITION_MISMATCH_HOLD"]}**.',
           f'- B46 tier agrees with fantasy-slot role: **{match["MATCH"]}**.',
           f'- B46 tier disagrees with fantasy-slot role: **{match["DISAGREE"]}**.',
           f'- No B46 tier available: **{match["B46_MISSING"]}**.',
           '- Some DL/LB source position classifications differ; these cases are held, not forced into a role-based FV scenario.',
           f'- Role-sensitive players with disagreement: **{role_sensitive_disagree}**.',
           f'- Supplemental 2026 projection source observations: **{contextual}/72** (context only, not equal to FV).',
           '', '## Nine high-priority provenance conflicts','',
           '| Player | Original FV | Fantasy-slot role | Frozen B46 tier | Week 5 games | Hypothetical FV* | Delta* |',
           '|---|---:|---|---|---:|---:|---:|']
          for r in priority:
              report.append('| '+ ' | '.join([
                  r['player'].replace('|','/'),fmt(r['published_fv']),r['legacy_role'],
                  r['b46_role'] or 'Unknown',str(r['b46_games']) if r['b46_games'] is not None else 'N/A',
                  fmt(r['b46_role_fv_HYPOTHETICAL_NOT_RECOMMENDED']),
                  fmt(r['b46_role_delta_HYPOTHETICAL_NOT_RECOMMENDED'])])+' |')
          report.extend(['', '*Exact price-formula sensitivity if the input role were replaced by the frozen B46 tier.',
            'This is a **counterfactual**, not a warranted FV adjustment or current NFL depth chart.',
            '', '## Engineering decision', '',
            '1. Retain QA10 provenance-only patch as candidate; it does not itself address inflated FV.',
            '2. Do not automatically promote B46 Week 5 tiers into live FV; source explicitly prohibits valuation adjustments.',
            '3. Candidate next engineering phase: refresh and calibrate B46 role evidence, use current independent opportunity and multi-year production, then build a guarded **preview** of role-dependent price changes.',
            '4. Preserve all curated prices and all prospects without sufficient data as explicit holds; no fixed discounts.',
            '5. Any production changes require separate owner authorization after numerical review.',
            '', '## Files','',
            '- `QA11_All72_B46_Independent_Role_Shadow.csv` (72-row reconciled source evidence and hypothetical FV).',
            '- `QA11_Shadow72.json` (full stable ID data and calculations).',
            '- `QA11_Manifest.json` (source lineage and zero-change release hold).',
            '', 'Generated: '+datetime.datetime.now(datetime.timezone.utc).isoformat(),''])
          (out/'QA11_Report.md').write_text('\n'.join(report))
          upstream=json.loads((pathlib.Path(os.environ['QA10_IN'])/'QA10_Manifest.json').read_text())
          src=(pathlib.Path('data/player_role_v2_week5.json')).read_bytes()
          m={'status':'QA11_B46_ROLE_EVIDENCE_SHADOW_READ_ONLY',
             'qa10_run':os.environ['QA10_RUN_ID'],'qa08_run':os.environ['QA08_RUN_ID'],
             'source_git_sha':upstream['source_git_sha'],'cohort':72,'exact_baseline_parity':72,
             'b46_source_file_sha256':hashlib.sha256(src).hexdigest(),
             'b46_source_week':5,'b46_calibrated':False,'b46_price_adjustments_authorized':False,
             'b46_matches':matched,'role_agreement_counts':dict(match),
             'role_sensitive_disagreement':role_sensitive_disagree,
             'high_priority_review_cases':9,'new_roles_assigned':0,'new_fv_proposed':0,
             'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repo_mutations':0,
             'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (out/'QA11_Manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:m[k] for k in ('cohort','exact_baseline_parity','b46_matches','role_agreement_counts','role_sensitive_disagreement')}))
          PY_REPORT
          python3 -m py_compile "$RUNNER_TEMP/qa11_report.py"
          python3 "$RUNNER_TEMP/qa11_report.py"

      - name: Ensure no repository mutation or live price change
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo 'QA11 read-only contract violated'; exit 1;
          }
          python3 - <<'PY_NO_RELEASE'
          import json,os,pathlib
          m=json.loads((pathlib.Path(os.environ['QA11_OUT'])/'QA11_Manifest.json').read_text())
          assert all(m[k]==0 for k in ['new_roles_assigned','new_fv_proposed','fv_changes','fv_plus_changes','mv_changes','repo_mutations'])
          assert m['b46_price_adjustments_authorized'] is False
          PY_NO_RELEASE
      - name: Upload independent role evidence artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA11-B46-Independent-Role-Shadow
          path: /tmp/qa11-output/
          retention-days: 30
          if-no-files-found: error
      - name: Mobile review
        if: always()
        shell: bash
        run: |
          if test -f "$QA11_OUT/QA11_Report.md"; then
            cat "$QA11_OUT/QA11_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA11 held before reporting; no production valuations changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
