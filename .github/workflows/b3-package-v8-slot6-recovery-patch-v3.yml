name: B3 Package Adjustment V8 - Slot 6 Transport Recovery and B2 Monitor V3 Patch V3

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v8-transport-recovery-patch
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Derive outcome-blind slot 6 recovery instruction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgv8patch
          python3 - <<'PY'
          import csv, hashlib, io, json, re
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          D=Path("research/package-adjustment-v8")
          act=json.loads((D/"development_voting_activation_manifest_v1.json").read_text())
          sched=json.loads((D/"voting_randomization_schedule_v1.json").read_text())
          assert act["accepted_complete_voters_exactly"]==50
          assert act["accepted_ballots_exactly"]==2000
          assert act["production_change_authorized"] is False

          SHEET_URL=("https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv")
          VOTE_PREFIX="__pkgv8dev__|"
          SCHEMA="__pkgv8dev_schema__|1"

          def parse_utc(v):
              s=str(v or "").strip()
              if s.endswith("Z"): s=s[:-1]+"+00:00"
              try: x=datetime.fromisoformat(s)
              except Exception: return None
              if x.tzinfo is None: x=x.replace(tzinfo=timezone.utc)
              return x.astimezone(timezone.utc)

          cutoff=parse_utc(act["valid_ballot_start_utc"])
          now=datetime.now(timezone.utc)
          r=requests.get(SHEET_URL,timeout=30)
          r.raise_for_status()
          rows=list(csv.DictReader(io.StringIO(r.text)))
          meta_re=re.compile(r"^__pkgv8dev_meta__\|[AB]\|6\|([0-9]|[1-2][0-9]|3[0-9])$")
          observed=[]; voters=[]
          spec=sched["slots"]["6"]

          for row in rows:
              keep=str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX): continue
              ts=parse_utc(row.get("timestamp"))
              if ts is None or ts<=cutoff or ts>now: continue
              if str(row.get("cut") or "")!=SCHEMA: continue
              mm=meta_re.fullmatch(str(row.get("trade") or ""))
              if not mm: continue
              payload=keep[len(VOTE_PREFIX):]
              cid,sep,_ignored_choice_payload=payload.partition("|")
              if not sep: continue
              cid=cid.strip()
              if cid not in spec["challenge_order"]: continue
              if int(mm.group(1))!=spec["challenge_order"].index(cid): continue
              voter=str(row.get("voter_roster_id") or "").strip()
              if not voter: continue
              observed.append(cid); voters.append(voter)

          uv=sorted(set(voters))
          counts=Counter(observed)
          duplicates=sorted(k for k,v in counts.items() if v>1)
          expected=list(map(str,spec["challenge_order"]))
          missing=[cid for cid in expected if cid not in set(observed)]

          if len(set(observed))==40 and not duplicates and len(uv)==1:
              active=False; missing_id=None; missing_order=None
          else:
              assert len(uv)==1,("slot6_voters",len(uv))
              assert len(observed)==39,("slot6_rows",len(observed))
              assert len(set(observed))==39
              assert not duplicates
              assert len(missing)==1,missing
              active=True
              missing_id=missing[0]
              missing_order=expected.index(missing_id)

          doc={
              "schema_version":1,
              "study_id":"package-adjustment-v8",
              "stage":"slot6_transport_recovery_v1",
              "generated_at_utc":now.isoformat(),
              "outcome_blind":True,
              "human_choice_payload_read":False,
              "human_choice_payload_stored":False,
              "slot":6,
              "active":active,
              "remote_structural_row_count":len(observed),
              "remote_unique_challenge_count":len(set(observed)),
              "remote_duplicate_challenge_count":len(duplicates),
              "missing_challenge_id":missing_id,
              "missing_display_order":missing_order,
              "voter_hash":hashlib.sha256(("v8-slot6-recovery|"+uv[0]).encode()).hexdigest()[:16] if uv else None,
              "sheet_sha256":hashlib.sha256(r.content).hexdigest(),
              "repair_scope":"one missing structural challenge only",
              "production_change_authorized":False
          }
          Path("/tmp/pkgv8patch/voting_transport_recovery_v1.json").write_text(json.dumps(doc,indent=2,sort_keys=True)+"\n")
          print(json.dumps(doc,indent=2))
          PY

      - name: Patch live page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,re
          from pathlib import Path
          helpers=base64.b64decode("").decode()
          submit=base64.b64decode("").decode()
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          recovery=json.loads(Path("/tmp/pkgv8patch/voting_transport_recovery_v1.json").read_text())
          rjs=json.dumps(recovery,separators=(",",":"))

          anchor="const PACKAGE_VOTE_VALID_AFTER_UTC = '2026-09-27T13:08:00.705011+00:00';"
          assert s.count(anchor)==1
          insert=anchor+"\nconst PACKAGE_VOTE_RECOVERY = Object.freeze("+rjs+");\nlet packageVoteSubmitInFlight = false;\nlet packageVoteSubmitError = '';"
          s=s.replace(anchor,insert,1)

          helper_anchor="/* PACKAGE_VOTE_V6P1_EXACT_CELL_SAMPLING_V1"
          assert s.count(helper_anchor)==1
          s=s.replace(helper_anchor,helpers+helper_anchor,1)

          old="const completed=new Set(packageVoteCompleted());"
          pos=s.index("function packageVoteSelectChallenge()")
          hit=s.index(old,pos)
          s=s[:hit]+s[hit:].replace(old,"const completed=new Set(packageVoteEffectiveCompleted());",1)

          pattern=r"function packageVoteSubmit\(displaySide\)\{.*?\n\}\n\nfunction renderPackageVote\(\)\{"
          m=re.search(pattern,s,re.S)
          assert m,"packageVoteSubmit block not found"
          s=s[:m.start()]+submit+s[m.end():]

          old_count="const completedCount=packageVoteCompleted().length;"
          assert s.count(old_count)==1
          new_count="const completedCount=packageVoteEffectiveCompleted().length;\nif(packageVoteSubmitError){\n  el.innerHTML=`<div style=\"border:1px solid var(--red);border-radius:8px;padding:10px;color:var(--text-muted);font-size:13px;\"><b style=\"color:var(--red);\">Vote submission status uncertain.</b><br>${escapeHtml(packageVoteSubmitError)}</div>`;\n  return;\n}"
          s=s.replace(old_count,new_count,1)

          p.write_text(s,encoding="utf-8")
          check=p.read_text(encoding="utf-8")
          assert "async function packageVoteSubmit(displaySide)" in check
          assert "packageVoteEffectiveCompleted().includes(id)" in check
          assert check.index("const response=await fetch(KTC_SUBMIT_URL") < check.index("packageVoteRemember(id);")
          PY

      - name: Patch B2 monitor classification to V3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          p=Path(".github/workflows/B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml")
          s=p.read_text(encoding="utf-8")

          replacements=(
              ("name: B2 Package Adjustment V8 - Outcome-Blind Maturity Monitor V2",
               "name: B2 Package Adjustment V8 - Outcome-Blind Maturity Monitor V3"),
              ("group: package-adjustment-v8-development-maturity-monitor-v2",
               "group: package-adjustment-v8-development-maturity-monitor-v3"),
              ('"stage":"development_outcome_blind_maturity_monitor_v2"',
               '"stage":"development_outcome_blind_maturity_monitor_v3"'),
              ("# Package Adjustment V8 — Outcome-Blind Development Maturity V2",
               "# Package Adjustment V8 — Outcome-Blind Development Maturity V3"),
              ("name: package-adjustment-v8-development-maturity-v2",
               "name: package-adjustment-v8-development-maturity-v3"),
          )
          for old,new in replacements:
              assert old in s,old
              s=s.replace(old,new,1)

          # V2 incorrectly required a partial session to contain display orders 0..39.
          # V3 validates only the rows actually present against the frozen slot schedule.
          pat=re.compile(
              r'(?P<i>[ \t]*)by_order=sorted\(rows,key=lambda r:r\["display_order"\]\)\n'
              r'(?P=i)if \[r\["display_order"\] for r in by_order\]!=list\(range\(40\)\):\n'
              r'(?P=i)    reasons\.append\("display_order_not_exactly_0_to_39"\)\n'
              r'(?P=i)elif \[r\["challenge_id"\] for r in by_order\]!=spec\["challenge_order"\]:\n'
              r'(?P=i)    reasons\.append\("challenge_order_schedule_mismatch"\)'
          )
          m=pat.search(s)
          if not m:
              marker='by_order=sorted(rows,key=lambda r:r["display_order"])'
              pos=s.find(marker)
              print("DEBUG marker position:",pos)
              if pos>=0:
                  print("DEBUG surrounding monitor text:")
                  print(s[max(0,pos-250):pos+700])
              raise AssertionError("V2 report order block not found after spaces-only matcher")
          i=m.group('i')
          repl=(
              f'{i}by_order=sorted(rows,key=lambda r:r["display_order"])\n'
              f'{i}orders=[r["display_order"] for r in by_order]\n'
              f'{i}if len(set(orders))!=len(orders) or any(o<0 or o>=40 for o in orders):\n'
              f'{i}    reasons.append("display_order_duplicate_or_out_of_range")\n'
              f'{i}elif any(spec["challenge_order"][r["display_order"]]!=r["challenge_id"] for r in by_order):\n'
              f'{i}    reasons.append("challenge_order_schedule_mismatch")'
          )
          s=s[:m.start()]+repl+s[m.end():]

          old='or "display_order_not_exactly_0_to_39" in reasons'
          assert old in s
          s=s.replace(old,'or "display_order_duplicate_or_out_of_range" in reasons',1)

          p.write_text(s,encoding="utf-8")

          check=p.read_text(encoding="utf-8")
          assert "Outcome-Blind Maturity Monitor V3" in check
          assert '"stage":"development_outcome_blind_maturity_monitor_v3"' in check
          assert "display_order_duplicate_or_out_of_range" in check
          assert 'or "display_order_not_exactly_0_to_39" in reasons' not in check
          print("PASS: B2 V3 incomplete-vs-invalid monitor patch applied.")
          PY

      - name: Persist recovery evidence and validate
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pkgv8patch/voting_transport_recovery_v1.json research/package-adjustment-v8/voting_transport_recovery_v1.json
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml research/package-adjustment-v8/voting_transport_recovery_v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "Patch V8 slot 6 recovery and B2 monitor V3"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PATCH COMPLETE"
          echo "Original slot-6 voter should reopen the same ?pkgv8slot=6 link."
          echo "After that, run B2 Package Adjustment V8 - Outcome-Blind Maturity Monitor V3."
