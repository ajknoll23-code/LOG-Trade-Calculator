      - name: Prove only Elite Surplus evaluation artifacts changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          D = Path("research/elite-surplus-v1")
          r = json.loads(
              (D / "historical_development_evaluation_v1.json").read_text()
          )

          expected = {
              "research/elite-surplus-v1/historical_development_evaluation_v1.json",
              "research/elite-surplus-v1/historical_development_evaluation_v1.md",
              "research/elite-surplus-v1/historical_development_manifest_v1.json",
          }
          if r["selected_candidate_class"] is not None:
              expected |= {
                  "research/elite-surplus-v1/selected_candidate_v1.json",
                  "research/elite-surplus-v1/prospective_prediction_snapshot_v1.json",
              }

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          actual = set()
          for line in raw.splitlines():
              if not line:
                  continue
              actual.add(line[3:])

          print("Changed files:")
          for x in sorted(actual):
              print(x)

          assert actual == expected, (sorted(actual), sorted(expected))
          print("PASS: only preregistered Elite Surplus evaluation artifacts changed.")
          PY

      - name: Commit historical result and any frozen candidate snapshot
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          r = json.loads(
              Path(
                  "research/elite-surplus-v1/"
                  "historical_development_evaluation_v1.json"
              ).read_text()
          )
          if r["selected_candidate_class"] is not None:
              cutoff = datetime.fromisoformat(
                  os.environ["ELITE_SURPLUS_WEEK2_CUTOFF_UTC"]
              )
              if not datetime.now(timezone.utc) < cutoff:
                  raise RuntimeError(
                      "Refusing to commit a supposedly pre-Week-2 candidate "
                      "or prediction snapshot after the first Week 2 kickoff."
                  )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/elite-surplus-v1/historical_development_evaluation_v1.json \
            research/elite-surplus-v1/historical_development_evaluation_v1.md \
            research/elite-surplus-v1/historical_development_manifest_v1.json

          if test -f research/elite-surplus-v1/selected_candidate_v1.json; then
            git add \
              research/elite-surplus-v1/selected_candidate_v1.json \
              research/elite-surplus-v1/prospective_prediction_snapshot_v1.json
          fi

          git commit -m "Evaluate Elite Surplus V1 historical development"
          git push origin HEAD:main
