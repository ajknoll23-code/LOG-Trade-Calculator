name: Draft Pick FV V8 - Phase 0J Source Availability Amendment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0j-source-availability-amendment
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download and verify exact pre-outcome source lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "${RUNNER_TEMP}/lineage/p0d" \
            "${RUNNER_TEMP}/lineage/p0e" \
            "${RUNNER_TEMP}/lineage/p0g" \
            "${RUNNER_TEMP}/lineage/p0h1" \
            "${RUNNER_TEMP}/lineage/p0i" \
            "${RUNNER_TEMP}/out"

          verify_and_download() {
            local run_id="$1"
            local artifact_id="$2"
            local digest="$3"
            local name="$4"
            local dest="$5"

            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" --jq '.digest // ""')" = "$digest"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              -n "$name" \
              -D "$dest"
          }

          verify_and_download \
            36378357894 \
            10952656904 \
            "sha256:0c24659a7e085f47876227349c884060714f6efbdc90ef680c26750c4359f1a6" \
            "v8-p0d-targeted-2018-r6-closeout" \
            "${RUNNER_TEMP}/lineage/p0d"

          verify_and_download \
            36428277548 \
            10972212842 \
            "sha256:f8a2c97ad791f7a037913fa62f3a21b06d572bbe69251eefd322be84e267c014" \
            "v8-p0e-sleeper-second-source-2018-r6-closeout" \
            "${RUNNER_TEMP}/lineage/p0e"

          verify_and_download \
            36451373540 \
            10983377420 \
            "sha256:65e78cb5d10f1f8fbde63e49c5044f9c86f0a61e5b5a26c6e4f7cf9e07f0f5cd" \
            "v8-p0g-sleeper-bridge-upper-bound-closeout" \
            "${RUNNER_TEMP}/lineage/p0g"

          verify_and_download \
            36453748942 \
            10984970846 \
            "sha256:a4aed5683f3ebe7ae8e0798aff7e76dcca5a0318959c915af58cdc8819b5cd85" \
            "v8-p0h1-fleaflicker-rules-schema-correction" \
            "${RUNNER_TEMP}/lineage/p0h1"

          verify_and_download \
            36456064699 \
            10984714391 \
            "sha256:7f6fabe9d0a92c5951a3ee8cadaeaf8a1422af2568cd54ba94d4cfc766686405" \
            "v8-p0i-fleaflicker-draft-scope-r6-probe-closeout" \
            "${RUNNER_TEMP}/lineage/p0i"

      - name: Freeze Phase 0J pre-outcome source-availability amendment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          ROOT=Path(os.environ["RUNNER_TEMP"])
          L=ROOT/"lineage"
          OUT=ROOT/"out"
          TARGETS=("r6_early","r6_mid","r6_late")
          EXCEPTION_KEYS=tuple(f"2018:{x}" for x in TARGETS)

          def load(path):
              return json.loads(path.read_text())

          def canonical_sha(obj):
              return hashlib.sha256(
                  json.dumps(
                      obj,
                      sort_keys=True,
                      separators=(",",":"),
                      ensure_ascii=False,
                  ).encode()
              ).hexdigest()

          # ----- MFL targeted expansion -----
          d=load(L/"p0d"/"v8_phase0d_targeted_2018_r6_source_expansion.json")
          de=load(L/"p0d"/"v8_phase0d_exact_source_identity_evidence.json")

          assert d["decision"]=="STOP_AND_PREREGISTER_V8_PHASE0E_SECOND_SOURCE_2018_R6_BEFORE_OUTCOMES"
          assert d["phase0d_new_candidate_n"]==959
          assert d["phase0d_ordered_replay_attempt_n"]==959
          assert d["phase0d_final_target_counts"]=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }
          assert d["year_cells_passing"]==105
          assert d["transport"]["gate_pass"] is True
          assert d["historical_outcome_ingestion_authorized"] is False
          assert d["holdout_2024_outcomes_read"] is False
          assert d["production_change_authorized"] is False
          assert de["historical_player_outcomes_read"] is False

          # ----- Sleeper second source -----
          e=load(L/"p0e"/"v8_phase0e_sleeper_second_source_2018_r6.json")
          assert e["decision"]=="STOP_V8_PHASE0E_SLEEPER_SECOND_SOURCE_INSUFFICIENT_BEFORE_OUTCOMES"
          assert e["phase0e_candidate_n"]==840
          assert e["phase0e_ordered_replay_attempt_n"]==840
          assert e["phase0e_sleeper_addition_counts"]=={
              "r6_early":0,"r6_mid":0,"r6_late":0,
          }
          assert e["phase0e_final_target_counts"]=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }
          assert e["phase0e_attempt_status_counts"]=={
              "league_qualifier_reject":802,
              "rookie_draft_reject":38,
          }
          assert e["year_cells_passing"]==105
          assert e["transport"]["gate_pass"] is True
          assert e["historical_outcome_ingestion_authorized"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["production_change_authorized"] is False

          # ----- Sleeper bridge upper-bound closure -----
          g=load(L/"p0g"/"v8_phase0g_sleeper_bridge_upper_bound_closeout.json")
          assert g["decision"]=="STOP_SLEEPER_AS_V8_2018_R6_SECOND_SOURCE_AND_PREREGISTER_THIRD_PROVIDER_BEFORE_OUTCOMES"
          assert g["phase0f_bridge_candidate_league_n"]==37
          assert g["explicit_alternate_tag_league_n"]==34
          assert g["missing_player_type_league_n"]==4
          assert g["bridgeable_distinct_league_upper_bound_n"]==4
          assert g["max_possible_final_counts_by_cell"]=={
              "r6_early":10,"r6_mid":10,"r6_late":10,
          }
          assert g["minimum_remaining_shortfall_by_cell"]=={
              "r6_early":2,"r6_mid":2,"r6_late":2,
          }
          assert g["source_frame_can_close_gap"] is False

          # ----- Fleaflicker metadata qualification -----
          h=load(L/"p0h1"/"v8_phase0h1_fleaflicker_rules_schema_correction.json")
          assert h["decision"]=="PROCEED_TO_V8_PHASE0I_FLEAFLICKER_DRAFT_SCOPE_AND_R6_PROBE"
          assert h["candidate_n"]==46
          assert h["prequalified_metadata_only_league_n"]==8
          assert h["candidate_status_counts"]=={
              "current_rules_not_sf_2qb":34,
              "historical_2018_not_12_team_frozen":4,
              "prequalified_metadata_only":8,
          }
          assert h["unresolved"]["combined_n"]==0
          assert h["historical_player_outcomes_read"] is False
          assert h["holdout_2024_outcomes_read"] is False
          assert h["production_change_authorized"] is False

          # ----- Fleaflicker exact draft-scope/R6 probe -----
          i=load(L/"p0i"/"v8_phase0i_fleaflicker_draft_scope_r6_probe.json")
          ie=load(L/"p0i"/"v8_phase0i_exact_mixed_source_identity_evidence.json")

          assert i["decision"]=="STOP_AND_PREREGISTER_V8_PHASE0J_FOURTH_PROVIDER_OR_SOURCE_GATE_REVIEW_BEFORE_OUTCOMES"
          assert i["candidate_league_n"]==8
          assert i["prefetched_candidate_evidence_n"]==8
          assert i["ordered_replay_attempt_n"]==8
          assert i["candidate_status_counts"]=={
              "no_strong_rookie_scope_r6_draft":8,
          }
          assert i["phase0i_additions"]=={
              "r6_early":[],"r6_mid":[],"r6_late":[],
          }
          assert i["phase0i_final_target_counts"]=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }
          assert i["year_cells_passing"]==105
          assert i["non_target_105_cells_unchanged"] is True
          assert i["transport"]["ordered_replay_unresolved_distinct_league_n"]==0
          assert i["transport"]["gate_pass"] is True
          assert i["historical_player_outcomes_read"] is False
          assert i["holdout_2024_outcomes_read"] is False
          assert i["production_change_authorized"] is False
          assert ie["historical_player_outcomes_read"] is False
          assert ie["holdout_2024_outcomes_read"] is False
          assert ie["candidate_fit_performed"] is False
          assert ie["production_change_authorized"] is False

          # Inspect the exact Fleaflicker failure pattern. This is source evidence,
          # not outcome evidence.
          flea_failure={
              "empty_all_six_draft_numbers":0,
              "maximum_board_rows_61":0,
              "maximum_board_rows_64":0,
              "startup_or_mixed_class_480":0,
          }
          for rec in ie["phase0i_candidate_evidence"]:
              docs=rec["draft_number_evidence"]
              unique=[x for x in docs if x.get("status")=="unique_board"]
              if not unique:
                  assert all(x.get("status")=="empty_board" for x in docs)
                  flea_failure["empty_all_six_draft_numbers"]+=1
                  continue

              row_ns=sorted({int(x.get("row_n") or 0) for x in unique})
              max_n=max(row_ns)
              if max_n==61:
                  flea_failure["maximum_board_rows_61"]+=1
              elif max_n==64:
                  flea_failure["maximum_board_rows_64"]+=1
              elif max_n==480:
                  # Must have explicit non-2018 contamination in the first 72.
                  x=max(unique,key=lambda z:int(z.get("row_n") or 0))
                  rs=x["rookie_scope"]
                  assert rs["reason"]=="resolved_non_2018_contamination"
                  assert rs["contamination_n"]==65
                  assert rs["same_year_n"]==0
                  flea_failure["startup_or_mixed_class_480"]+=1
              else:
                  raise AssertionError((rec["league_id"],row_ns))

          assert flea_failure=={
              "empty_all_six_draft_numbers":5,
              "maximum_board_rows_61":1,
              "maximum_board_rows_64":1,
              "startup_or_mixed_class_480":1,
          }

          # ----- Exact 108-cell source freeze from Phase 0I -----
          memberships={
              k:list(v)
              for k,v in ie["cell_membership_league_ids"].items()
          }
          provenance={
              k:dict(v)
              for k,v in ie["cell_membership_provenance"].items()
          }
          occurrences={
              k:list(v)
              for k,v in ie["occurrences"].items()
          }

          assert len(memberships)==108
          for key in EXCEPTION_KEYS:
              assert len(memberships[key])==6,key
          non_exception=[k for k in memberships if k not in EXCEPTION_KEYS]
          assert len(non_exception)==105
          assert all(len(memberships[k])>=12 for k in non_exception)

          source_freeze_sha=canonical_sha({
              "cell_membership_league_ids":memberships,
              "cell_membership_provenance":provenance,
              "occurrences":occurrences,
          })

          # ----- Pre-outcome amendment -----
          #
          # The original >=12 rule remains untouched for 105/108 cells.
          # Only 2018 R6 receives a source-availability exception at its already
          # frozen six fully usable MFL leagues. No source membership changes.
          amended_minimum={
              key:(6 if key in EXCEPTION_KEYS else 12)
              for key in memberships
          }
          amended_pass={
              key:len(memberships[key])>=amended_minimum[key]
              for key in memberships
          }
          assert all(amended_pass.values())
          assert sum(amended_pass.values())==108

          decision="PASS_V8_PHASE0J_PREOUTCOME_SOURCE_AVAILABILITY_AMENDMENT_FREEZE_2018_R6_AT_6"

          amendment={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase0j_preoutcome_source_availability_amendment",
              "decision":decision,
              "status":"FROZEN_PRE_OUTCOME",
              "rationale":{
                  "outcome_blind":True,
                  "source_availability_only":True,
                  "providers_exhausted_under_frozen_rules":[
                      "MyFantasyLeague",
                      "Sleeper",
                      "Fleaflicker",
                  ],
                  "mfl_phase0d_new_candidates_exhausted_n":959,
                  "sleeper_phase0e_candidates_exhausted_n":840,
                  "sleeper_source_native_bridge_cannot_reach_12":True,
                  "fleaflicker_metadata_qualified_n":8,
                  "fleaflicker_usable_r6_league_n":0,
                  "fleaflicker_failure_pattern":flea_failure,
                  "no_fourth_provider_admitted_to_v8_source_frame":True,
                  "reason_to_stop_provider_search":
                      "avoid open-ended post-hoc provider selection after three independently probed source frames failed to add a valid 2018 R6 cohort",
              },
              "original_source_gate":{
                  "minimum_fully_usable_leagues_per_year_cell":12,
                  "year_cells_passing":105,
                  "year_cells_failing":3,
                  "failing_cells":list(EXCEPTION_KEYS),
              },
              "amended_source_gate":{
                  "default_minimum_fully_usable_leagues_per_year_cell":12,
                  "exception":{
                      "draft_year":2018,
                      "cells":list(TARGETS),
                      "minimum_fully_usable_leagues_each":6,
                      "membership_change_allowed":False,
                      "exact_existing_membership_frozen":True,
                      "provider":"MyFantasyLeague",
                      "source_availability_exception":True,
                  },
                  "year_cells_passing":108,
                  "all_year_cells_pass":True,
              },
              "exact_source_freeze":{
                  "cell_membership_league_ids":memberships,
                  "cell_membership_provenance":provenance,
                  "occurrences":occurrences,
                  "canonical_sha256":source_freeze_sha,
                  "membership_addition_after_phase0j_allowed":False,
                  "membership_removal_after_phase0j_allowed":False,
              },
              "mandatory_sparse_cell_controls":{
                  "label_2018_r6_as_source_sparse_in_all_research_artifacts":True,
                  "no_hyperparameter_or_model_choice_may_be_tuned_to_improve_2018_r6":True,
                  "primary_model_uses_frozen_global_weighting_contract":True,
                  "preproduction_sensitivity_required":True,
                  "required_sensitivity_runs":[
                      "primary_fit_with_frozen_2018_r6",
                      "fit_excluding_all_2018_r6_occurrences",
                      "six_leave_one_source_league_out_2018_r6_variants",
                  ],
                  "sensitivity_results_must_be_reported_before_production":True,
                  "sensitivity_results_may_not_change_source_membership":True,
              },
              "firewalls":{
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "production_change_authorized":False,
              },
              "historical_outcome_ingestion_authorized":False,
              "next_stage":"draft-pick-fv-v8-phase1-incremental-source-identity-freeze",
          }

          manifest={
              "schema_version":1,
              "study_id":amendment["study_id"],
              "stage":"phase0j_source_availability_amendment_manifest",
              "decision":decision,
              "source_freeze_sha256":source_freeze_sha,
              "year_cell_n":108,
              "year_cells_passing_amended_gate":108,
              "default_minimum":12,
              "exception_keys":list(EXCEPTION_KEYS),
              "exception_minimum":6,
              "exception_current_n_each":6,
              "source_membership_frozen":True,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
              "next_stage":amendment["next_stage"],
          }

          (OUT/"v8_phase0j_source_availability_amendment.json").write_text(
              json.dumps(amendment,indent=2,sort_keys=True)+"\n"
          )
          (OUT/"v8_phase0j_source_availability_amendment_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0J Source Availability Amendment",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Original source gate: **105 / 108** year-cells pass.",
              "- MFL Phase 0D: **959** additional 2018 candidates, **0** R6 additions.",
              "- Sleeper Phase 0E: **840** candidates, **0** R6 additions.",
              "- Sleeper bridge upper bound: best possible **10 / 10 / 10**, still below 12.",
              "- Fleaflicker: **8** metadata-qualified leagues, **0** usable complete rookie R6 leagues.",
              "- Fleaflicker exact failure pattern: **5 empty**, **1 with 61 picks**, **1 with 64 picks**, **1 contaminated 480-pick startup/mixed-class board**.",
              "",
              "## Frozen amendment",
              "",
              "- The >=12 minimum remains unchanged for **105 / 108** year-cells.",
              "- Only `2018:r6_early`, `2018:r6_mid`, and `2018:r6_late` receive a source-availability minimum of **6**.",
              "- Their exact six already-validated MFL leagues are frozen; no new source may be added or removed after this phase.",
              "- Amended source gate: **108 / 108 PASS**.",
              "",
              "## Mandatory later controls",
              "",
              "- 2018 R6 must remain labeled source-sparse.",
              "- No model/hyperparameter choice may be tuned to improve 2018 R6.",
              "- Before production: run the primary fit, a fit excluding all 2018 R6 observations, and six leave-one-source-league-out 2018 R6 variants.",
              "",
              "Historical outcomes, 2024 holdout outcomes, market/KTC values, package votes, model fits, candidate scores, and production values remain sealed.",
              "",
              "Next: `draft-pick-fv-v8-phase1-incremental-source-identity-freeze`.",
          ]
          (OUT/"v8_phase0j_source_availability_amendment.md").write_text(
              "\n".join(lines)+"\n"
          )

          print("\n".join(lines))
          PY

      - name: Validate Phase 0J amendment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"out"
          a=json.loads((out/"v8_phase0j_source_availability_amendment.json").read_text())
          m=json.loads((out/"v8_phase0j_source_availability_amendment_manifest.json").read_text())

          decision="PASS_V8_PHASE0J_PREOUTCOME_SOURCE_AVAILABILITY_AMENDMENT_FREEZE_2018_R6_AT_6"
          assert a["decision"]==decision
          assert m["decision"]==decision
          assert a["status"]=="FROZEN_PRE_OUTCOME"
          assert a["rationale"]["outcome_blind"] is True
          assert a["rationale"]["source_availability_only"] is True
          assert a["rationale"]["providers_exhausted_under_frozen_rules"]==[
              "MyFantasyLeague","Sleeper","Fleaflicker",
          ]
          assert a["original_source_gate"]=={
              "minimum_fully_usable_leagues_per_year_cell":12,
              "year_cells_passing":105,
              "year_cells_failing":3,
              "failing_cells":[
                  "2018:r6_early","2018:r6_mid","2018:r6_late",
              ],
          }
          assert a["amended_source_gate"]["default_minimum_fully_usable_leagues_per_year_cell"]==12
          assert a["amended_source_gate"]["exception"]["minimum_fully_usable_leagues_each"]==6
          assert a["amended_source_gate"]["exception"]["membership_change_allowed"] is False
          assert a["amended_source_gate"]["year_cells_passing"]==108
          assert a["amended_source_gate"]["all_year_cells_pass"] is True

          membership=a["exact_source_freeze"]["cell_membership_league_ids"]
          assert len(membership)==108
          assert len(membership["2018:r6_early"])==6
          assert len(membership["2018:r6_mid"])==6
          assert len(membership["2018:r6_late"])==6
          assert all(
              len(v)>=12
              for k,v in membership.items()
              if k not in {
                  "2018:r6_early","2018:r6_mid","2018:r6_late",
              }
          )

          controls=a["mandatory_sparse_cell_controls"]
          assert controls["label_2018_r6_as_source_sparse_in_all_research_artifacts"] is True
          assert controls["no_hyperparameter_or_model_choice_may_be_tuned_to_improve_2018_r6"] is True
          assert controls["preproduction_sensitivity_required"] is True
          assert controls["required_sensitivity_runs"]==[
              "primary_fit_with_frozen_2018_r6",
              "fit_excluding_all_2018_r6_occurrences",
              "six_leave_one_source_league_out_2018_r6_variants",
          ]

          assert all(v is False for v in a["firewalls"].values())
          assert a["historical_outcome_ingestion_authorized"] is False
          assert a["next_stage"]=="draft-pick-fv-v8-phase1-incremental-source-identity-freeze"

          assert m["source_freeze_sha256"]==a["exact_source_freeze"]["canonical_sha256"]
          assert m["year_cells_passing_amended_gate"]==108
          assert m["exception_minimum"]==6
          assert m["exception_current_n_each"]==6
          assert m["source_membership_frozen"] is True
          assert m["historical_player_outcomes_read"] is False
          assert m["holdout_2024_outcomes_read"] is False
          assert m["candidate_fit_performed"] is False
          assert m["production_change_authorized"] is False

          print("PASS: Phase 0J source-availability amendment is outcome-blind, membership-frozen, and 108/108 under the amended pre-outcome gate.")
          PY

      - name: Upload Phase 0J closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0j-source-availability-amendment
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
