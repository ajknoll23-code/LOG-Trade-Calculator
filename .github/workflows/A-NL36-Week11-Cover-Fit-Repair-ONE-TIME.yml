name: "05 | NEWSLETTERS & PUBLISHING | NL36 Cover Fit Repair (One Time)"
run-name: "NL36 W11 Cover Fit Repair — preserve all stories and V7 model"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-nl36-cover-fit-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main (write access for one guarded commit)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate repository and repair exactly two NL36 cover-geometry settings
        id: patch
        shell: bash
        env:
          EXPECTED_REPO: ajknoll23-code/LOG-Trade-Calculator
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$GITHUB_REF" = refs/heads/main
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 - <<'PY'
          from pathlib import Path
          import os
          import yaml

          path = Path('.github/workflows/A-NL36R1.yml')
          if not path.is_file():
              raise SystemExit('BLOCKED: original NL36 workflow not found')
          original = path.read_text(encoding='utf-8')
          replacements = {
              '@page { size:108mm 183mm;': '@page { size:108mm 244mm;',
              'not 510<=page.rect.height<=530:': 'not 680<=page.rect.height<=700:',
          }
          already = all(original.count(new) == 1 and original.count(old) == 0
                        for old, new in replacements.items())
          if already:
              print('ALREADY PATCHED — original NL36 page size and geometry gate agree')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('changed=false\n')
              raise SystemExit(0)
          if not all(original.count(old) == 1 and original.count(new) == 0
                     for old, new in replacements.items()):
              raise SystemExit('BLOCKED: unexpected NL36 source; refusing partial/ambiguous change')

          changed = original
          for old, new in replacements.items():
              changed = changed.replace(old, new, 1)
          # The only differences must be these two exact substitutions.
          if len(changed) != len(original):
              raise SystemExit('BLOCKED: unexpected patch length')
          doc = yaml.safe_load(changed)
          if not isinstance(doc, dict) or not doc.get('jobs'):
              raise SystemExit('BLOCKED: patched YAML failed structure validation')
          steps = doc['jobs']['nl36r1-editorial-shadow']['steps']
          engines = [s.get('run', '') for s in steps
                     if 'Stage NL36R1 engine' in s.get('name', '')]
          if len(engines) != 1:
              raise SystemExit('BLOCKED: original NL36 engine step not uniquely found')
          source = engines[0]
          if not all(new in source for new in replacements.values()):
              raise SystemExit('BLOCKED: patched source not reflected in staged NL36 engine')
          path.write_text(changed, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('changed=true\n')
          print('PASS: resized all seven pages from 108x183 mm to 108x244 mm')
          print('PASS: updated the geometry safety gate consistently')
          print('PASS: no matchup/story trimming, ranking formula changes or source deletions')
          PY
          git diff --check
          git diff --stat
          if test "$(git diff --name-only)" != '.github/workflows/A-NL36R1.yml'; then
            if ! git diff --quiet; then
              echo 'BLOCKED: unexpected changed files'; exit 1
            fi
          fi

      - name: Commit only patched NL36 workflow to main
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/A-NL36R1.yml
          git diff --cached --name-only | grep -Fx '.github/workflows/A-NL36R1.yml'
          git commit -m 'Fix NL36 W11 cover overflow with 108x244mm mobile page and matching QA gate'
          git push origin HEAD:main

      - name: Summary and next step
        if: always()
        shell: bash
        run: |
          {
            echo '## NL36 one-time cover repair'
            echo '- Changes ONLY the NL36 cover/page geometry and its corresponding safety bound.'
            echo '- Keeps all six matchup entries, text, and the V7 formula unchanged.'
            echo '- No PDF publication and no private newsletter repository changes.'
            echo '- After a GREEN repair, rerun **A-NL44R1** with **war_week=11** and an empty source run ID.'
            echo '- Then delete this one-time repair workflow to avoid clutter.'
          } >> "$GITHUB_STEP_SUMMARY"
