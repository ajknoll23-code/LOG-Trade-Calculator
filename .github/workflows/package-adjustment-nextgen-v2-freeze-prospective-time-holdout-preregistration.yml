name: Package Adjustment NextGen V2 Freeze Prospective Time-Holdout Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-freeze-prospective-time-holdout-preregistration
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact dispatch commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          echo "PASS: checkout pinned to exact workflow-dispatch SHA."

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy==2.5.3" \
            "scipy==1.18.1" \
            "requests"

          python3 - <<'PY'
          import platform
          import numpy
          import scipy
          import requests

          assert platform.python_version() == "3.13.15"
          assert numpy.__version__ == "2.5.3"
          assert scipy.__version__ == "1.18.1"
          print("PASS: exact validation environment available.")
          PY

      - name: Guard frozen M2b candidate and production boundary
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          test -z "$(git status --porcelain=v1)"

          # Exact first-wave research lineage must remain in ancestry.
          git merge-base --is-ancestor 8edba8a6f4e612fa20995a8c62c4be619907abe1 HEAD
          git merge-base --is-ancestor fbf8829a61a087704e271b05dc52f8500aa9f46f HEAD
          git merge-base --is-ancestor 141226b8b8e30a8c0153779b6efe5fdf0399c931 HEAD
          git merge-base --is-ancestor c6eafaac6463e3d5e8cf947ba61d4cc994d59ef4 HEAD

          # Frozen candidate Git objects.
          test "$(git hash-object "$D/model_fit_beta_amended_v1_checkpoint_lock.json")" = \
            "68eb1a7ed4d09bf91d26e6ad270e3c5c41c823b9"
          test "$(git hash-object "$D/model_fit_beta_amended_v1_holdout_spend_marker.json")" = \
            "b82b90caed16af8d7216d383fa429028587f28d1"
          test "$(git hash-object "$D/model_fit_beta_amended_v1_provenance.json")" = \
            "b49dd1a91d9b47589c89d2c3caeb4e1b319779b5"
          test "$(git hash-object "$D/model_fit_beta_amended_v1_results.json")" = \
            "22efc47a2ce32bb9bcba35a5ec48cbccaf953c50"
          test "$(git hash-object "$D/research_candidate_m2b_v1.json")" = \
            "1560124540e1104fdc4f4e9f367d984b46921cb9"
          test "$(git hash-object "$D/research_candidate_m2b_v1.md")" = \
            "ce23b76e1f61ee606311b52b5103130827313dbe"
          test "$(git hash-object "$D/research_candidate_m2b_v1_manifest.json")" = \
            "5a6482cb927b350170f37d0a1fa8fcd469ad0e1d"

          # Exact successful-run bytes recorded by the candidate manifest.
          test "$(sha256sum "$D/model_fit_beta_amended_v1_checkpoint_lock.json" | awk '{print $1}')" = \
            "bb5553b05046ad25dd12215ec172d30dc67b3e55e946b5e0fae2ff6d6608a95f"
          test "$(sha256sum "$D/model_fit_beta_amended_v1_holdout_spend_marker.json" | awk '{print $1}')" = \
            "964e86734a46c4513d014e35fb102f984d46b216ab904553160ad5396a6d768e"
          test "$(sha256sum "$D/model_fit_beta_amended_v1_provenance.json" | awk '{print $1}')" = \
            "39ae54e2738dd0030a95877f9c4918e31c4dc13df915d3201864ceafa4af84a1"
          test "$(sha256sum "$D/model_fit_beta_amended_v1_results.json" | awk '{print $1}')" = \
            "8fddf78b922cec23080b90c5b691b564c43409443627a6a9109709b11fc3cb6f"
          test "$(sha256sum "$D/model_fit_beta_amended_v1_summary.md" | awk '{print $1}')" = \
            "6e224e64716dbd333f6aec490aea8494c7dcf139120e29b776cc34193887fa6f"
          test "$(sha256sum "$D/research_candidate_m2b_v1.json" | awk '{print $1}')" = \
            "4b27bc48ca90fb7c3a60745a51d6cfe8b98ef26fe7c6791b12983b3e39f534a7"
          test "$(sha256sum "$D/research_candidate_m2b_v1.md" | awk '{print $1}')" = \
            "d82c389ef7bbf677dba63e9d6eaef00fae4bc4bc5108439fa1ccc787b1944378"

          # This preregistration is a one-time freeze.
          test ! -e "$D/prospective_time_holdout_preregistration_v1.json"
          test ! -e "$D/prospective_time_holdout_preregistration_v1.md"
          test ! -e "$D/prospective_time_holdout_preregistration_v1_manifest.json"

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          candidate = json.loads((d / "research_candidate_m2b_v1.json").read_text())
          manifest = json.loads((d / "research_candidate_m2b_v1_manifest.json").read_text())
          result = json.loads((d / "model_fit_beta_amended_v1_results.json").read_text())

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          assert candidate["status"] == "frozen_first_wave_research_candidate"
          assert candidate["frozen"] is True
          assert candidate["candidate_id"] == "pkgnv2-m2b-v1"
          assert candidate["model"] == "M2b"
          assert candidate["research_only"] is True
          assert candidate["production_candidate"] is False
          assert candidate["production_change_authorized"] is False
          assert candidate["automatic_production_promotion_allowed"] is False

          params = candidate["frozen_candidate_parameters"]
          assert params["regularization_lambda"] == 1.0
          assert params["parameter_vector_x"] == [
              0.0,
              0.0,
              0.0362911410036889,
              0.0074486570102035975,
              4.745193657558804,
              0.24927858289620897,
          ]
          assert abs(params["beta"] - 115.03007979068902) < 1e-10
          assert params["boundary_flags"] == []

          assert candidate["structural_holdout_results"]["holdouts_spent"] is True
          assert candidate["structural_holdout_results"]["repeat_evaluation_allowed"] is False
          assert candidate["structural_holdout_results"]["further_tuning_allowed"] is False
          assert candidate["next_evidence_requirement"][
              "prospective_time_holdout_required_before_production_candidate"
          ] is True
          assert candidate["next_evidence_requirement"][
              "candidate_parameters_must_remain_frozen"
          ] is True

          assert result["selection"]["selected_model"] == "M2b"
          assert result["selection"]["status"] == "research_candidate_selected"
          assert result["point_estimates"]["M0"]["fit"]["x"] == [
              4.67248211670666,
              0.24949028824223837,
          ]
          assert result["point_estimates"]["M2b"]["fit"]["x"] == params["parameter_vector_x"]

          assert manifest["status"] == "frozen_m2b_research_candidate_manifest"
          assert manifest["frozen"] is True
          assert manifest["candidate_id"] == "pkgnv2-m2b-v1"
          assert manifest["structural_holdouts_spent"] is True
          assert manifest["production_candidate"] is False
          assert manifest["production_change_authorized"] is False
          for item in manifest["artifacts"].values():
              assert sha(item["path"]) == item["sha256"]

          print("PASS: exact frozen M2b candidate and first-wave lineage verified.")
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: production remains unchanged before prospective preregistration."

      - name: Generate frozen prospective time-holdout preregistration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np

          D = Path("research/package-adjustment-nextgen-v2")
          OUT_JSON = D / "prospective_time_holdout_preregistration_v1.json"
          OUT_MD = D / "prospective_time_holdout_preregistration_v1.md"
          OUT_MANIFEST = D / "prospective_time_holdout_preregistration_v1_manifest.json"

          candidate = json.loads((D / "research_candidate_m2b_v1.json").read_text())
          fit_result = json.loads((D / "model_fit_beta_amended_v1_results.json").read_text())

          # ------------------------------------------------------------------
          # Coverage-only prospective maturity simulation.
          #
          # Exact design: 30 voters x 30 ballots = 900 ballots, each ballot
          # independently selects one of 24 cells with probability 1/24.
          # We simulate both cell ballot mass and distinct-voter cell coverage.
          # No vote choice/outcome or model prediction enters this simulation.
          # ------------------------------------------------------------------
          sim_seed = 20260912
          sim_trials = 100_000
          batch_size = 1_000
          rng = np.random.default_rng(sim_seed)

          vote_gate_pass = 0
          voter_gate_pass = 0
          both_gate_pass = 0
          min_votes = []
          min_voters = []

          for start in range(0, sim_trials, batch_size):
              b = min(batch_size, sim_trials - start)
              draws = rng.integers(
                  0, 24, size=(b, 30, 30), dtype=np.int16
              )
              mv = np.full(b, 999, dtype=np.int16)
              md = np.full(b, 999, dtype=np.int16)

              for cell in range(24):
                  hits = draws == cell
                  counts = hits.sum(axis=(1, 2))
                  distinct = hits.any(axis=2).sum(axis=1)
                  mv = np.minimum(mv, counts)
                  md = np.minimum(md, distinct)

              vote_ok = mv >= 15
              voter_ok = md >= 10

              vote_gate_pass += int(vote_ok.sum())
              voter_gate_pass += int(voter_ok.sum())
              both_gate_pass += int((vote_ok & voter_ok).sum())
              min_votes.extend(int(x) for x in mv)
              min_voters.extend(int(x) for x in md)

          simulation = {
              "method": (
                  "numpy_default_rng_exact_equal_cell_sampling_"
                  "30_voters_x_30_ballots"
              ),
              "numpy_version": np.__version__,
              "seed": sim_seed,
              "trials": sim_trials,
              "voters_per_trial": 30,
              "ballots_per_voter": 30,
              "total_ballots_per_trial": 900,
              "cell_count": 24,
              "cell_probability": 1 / 24,
              "minimum_votes_per_cell_gate": 15,
              "minimum_distinct_voters_per_cell_gate": 10,
              "trials_all_cells_votes_gate": vote_gate_pass,
              "trials_all_cells_voter_gate": voter_gate_pass,
              "trials_both_gates": both_gate_pass,
              "probability_all_cells_votes_gate": vote_gate_pass / sim_trials,
              "probability_all_cells_voter_gate": voter_gate_pass / sim_trials,
              "probability_both_gates": both_gate_pass / sim_trials,
              "p10_min_cell_votes": float(np.quantile(min_votes, 0.10)),
              "median_min_cell_votes": float(np.quantile(min_votes, 0.50)),
              "p10_min_cell_distinct_voters": float(
                  np.quantile(min_voters, 0.10)
              ),
              "median_min_cell_distinct_voters": float(
                  np.quantile(min_voters, 0.50)
              ),
              "outcomes_or_model_scores_used": False,
          }

          # Lock the simulation implementation/output used to justify the first
          # coverage checkpoint. Any code drift makes the workflow fail.
          assert vote_gate_pass == 99_980
          assert voter_gate_pass == 99_994
          assert both_gate_pass == 99_976
          assert simulation["p10_min_cell_votes"] == 23.0
          assert simulation["median_min_cell_votes"] == 26.0
          assert simulation["p10_min_cell_distinct_voters"] == 15.0
          assert simulation["median_min_cell_distinct_voters"] == 17.0

          m2b_x = list(candidate["frozen_candidate_parameters"]["parameter_vector_x"])
          m0_x = list(fit_result["point_estimates"]["M0"]["fit"]["x"])

          assert m2b_x == [
              0.0,
              0.0,
              0.0362911410036889,
              0.0074486570102035975,
              4.745193657558804,
              0.24927858289620897,
          ]
          assert m0_x == [4.67248211670666, 0.24949028824223837]

          plan = {
              "schema_version": 1,
              "status": "frozen_prospective_time_holdout_preregistration",
              "frozen": True,
              "plan_id": "pkgnv2-prospective-time-holdout-v1",
              "candidate_id": "pkgnv2-m2b-v1",
              "research_only_until_prospective_gate_passes": True,
              "production_candidate": False,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "preregistered_before_prospective_catalog_generation": True,
              "preregistered_before_prospective_voting_activation": True,
              "preregistered_before_prospective_outcomes_exist": True,

              "source_candidate": {
                  "candidate_freeze_commit": (
                      "c6eafaac6463e3d5e8cf947ba61d4cc994d59ef4"
                  ),
                  "candidate_json_path": (
                      "research/package-adjustment-nextgen-v2/"
                      "research_candidate_m2b_v1.json"
                  ),
                  "candidate_json_sha256": (
                      "4b27bc48ca90fb7c3a60745a51d6cfe8b98ef26fe7c6791b12983b3e39f534a7"
                  ),
                  "candidate_json_git_blob_sha": (
                      "1560124540e1104fdc4f4e9f367d984b46921cb9"
                  ),
                  "source_model_fit_run_id": 34658221528,
                  "source_model_fit_artifact_id": 10289186364,
                  "source_model_fit_artifact_digest": (
                      "sha256:"
                      "55c0e642f02edbd7978ff94293f37d3e1740d7c9d72d54599c52e19119c7ce74"
                  ),
                  "spent_structural_holdouts_may_not_be_reused": True,
              },

              "frozen_prediction_models": {
                  "M0": {
                      "name": "raw_fv_control_fixed_predictor",
                      "score": "sum(asset_fv)",
                      "parameter_vector_x": m0_x,
                      "log_beta": float(m0_x[0]),
                      "beta": math.exp(float(m0_x[0])),
                      "delta_left": float(m0_x[1]),
                      "refitting_allowed": False,
                      "recalibration_allowed": False,
                  },
                  "M2b": {
                      "name": candidate["model_name"],
                      "parameter_vector_x": m2b_x,
                      "regularization_lambda_at_candidate_freeze": 1.0,
                      "slope_increments": [float(x) for x in m2b_x[:4]],
                      "log_beta": float(m2b_x[4]),
                      "beta": math.exp(float(m2b_x[4])),
                      "delta_left": float(m2b_x[5]),
                      "v_ref": 5401.0,
                      "knots_normalized": [
                          0.0,
                          0.30531383077207924,
                          0.5173116089613035,
                          0.6989446398815035,
                          1.0,
                          1.259027,
                      ],
                      "inverse_domain_max_normalized": 1.259027,
                      "refitting_allowed": False,
                      "recalibration_allowed": False,
                      "parameter_tuning_allowed": False,
                  },
              },

              "fresh_prospective_catalog_contract": {
                  "catalog_id": "pkgnv2-prospective-catalog-v1",
                  "generation_must_occur_after_this_preregistration_freeze": True,
                  "generation_seed": 20260912,
                  "source_fv_snapshot_must_be_frozen_and_hashed": True,
                  "source_fv_snapshot_time": (
                      "after_preregistration_freeze_before_voting_activation"
                  ),
                  "embedded_asset_fv_is_frozen_for_entire_prospective_study": True,
                  "player_assets_only": True,
                  "draft_picks_allowed": False,
                  "challenge_count": 129,
                  "family_counts": {
                      "core_concentration_2v2": 90,
                      "fragmentation_filler": 15,
                      "structural_topology_3v3": 24,
                  },
                  "scale_counts": {
                      "low": 43,
                      "mid": 43,
                      "high": 43,
                  },
                  "evaluation_cell_count": 24,
                  "all_challenges_evaluation_only": True,
                  "fit_eligible_challenges": 0,
                  "all_challenges_multi_piece_vs_multi_piece": True,
                  "core_cells": [
                      "core_50_50_control",
                      "core_55_45",
                      "core_60_40",
                      "core_70_30",
                      "core_80_20",
                  ],
                  "fragmentation_cells": [
                      "frag_80_20_vs_80_10_10",
                  ],
                  "topology_cells": [
