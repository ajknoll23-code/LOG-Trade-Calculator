                      "high": 5700.0,
                  },
                  "maximum_player_appearance": 11,
                  "exact_trade_signature_overlap_with_first_wave_catalog_allowed": False,
                  "duplicate_trade_signatures_within_prospective_catalog_allowed": False,
                  "values_visible_to_voter": False,
                  "challenge_selection_may_use": [
