name: KTC Voter-Balance Prospective Research

# Research-only prospective test.
#
# Refreshes KTC ratings, freezes a dedicated research snapshot, then scores
# earlier snapshots only against ballots submitted afterward.
#
# This workflow NEVER runs build_market_value.py and never changes the
# production Market Value consumer.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: ktc-voter-balance-research
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate canonical player-position lookup
        run: python3 scripts/utilities/generate_player_positions.py

      - name: Refresh KTC raw and voter-balanced ratings
        run: python3 scripts/market/ktc_pipeline.py

      - name: Prospective evaluator self-test
        run: python3 scripts/market/evaluate_ktc_voter_balance_prospective.py --selftest

      - name: Freeze current KTC research snapshot and evaluate future votes
        run: python3 scripts/market/evaluate_ktc_voter_balance_prospective.py --snapshot --write

      - name: Verify prospective research outputs
        run: python3 scripts/market/evaluate_ktc_voter_balance_prospective.py --check

      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/artifacts/generated/ktc_ratings.json
          git add scripts/artifacts/generated/player_positions.json
          git add research/ktc-voter-balance/snapshots/
          git add research/ktc-voter-balance/prospective/latest.json
          git add research/ktc-voter-balance/prospective/latest.md
          git diff --staged --quiet || git commit -m "Update KTC voter-balance prospective research"
          git push
