name: Workflow Folder Cleanup V2 - 2026-10-06 B-Series Archive

on:
  workflow_dispatch:
    inputs:
      cleanup_attestation:
        description: Exact cleanup attestation
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup-workflow-folder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove completed and superseded workflow files
        shell: bash
        env:
          CLEANUP_ATTEST: ${{ inputs.cleanup_attestation }}
        run: |
          set -euo pipefail
          test "$CLEANUP_ATTEST" = 'I_CONFIRM_WORKFLOW_FOLDER_CLEANUP_V2_B_SERIES_ARCHIVE_2026_10_06'

          REMOVE=(
            'A-B43-player-role-engine-v2-direct-sleeper-gsis-id-current-source-extension-v4r2-objective-respecification-candidate.yml'
            'A-B43-player-role-engine-v2-owner-blind-identity-bridge-remediation-feasibility-v3r2-undefined-name-operational-repair-candidate.yml'
            'A-B43-v1r1-dob-position-engineering-adoption-decision-v1.yml'
            'B10B-package-adjustment-v9-private-collector-launch-preconditions-p1-p4-verification-v2-publish-to-web-privacy-repair.yml'
            'B10B-package-adjustment-v9-private-collector-launch-preconditions-p1-p4-verification-v3-stale-element-browser-click-repair.yml'
            'B10B-package-adjustment-v9-private-collector-launch-preconditions-p1-p4-verification-v4-p4-network-retry-repair.yml'
            'B10B-package-adjustment-v9-private-collector-launch-preconditions-p1-p4-verification-v5-dual-criterion-p4-timing-repair.yml'
            'B10C-package-adjustment-v9-p5-outcome-blind-structural-monitoring-freeze-v2-malformed-row-resilience-repair.yml'
            'B10D-package-adjustment-v9-p6-final-launch-checklist-v2-pre-distribution-eligibility-freeze-repair.yml'
            'B10F-package-adjustment-v9-prospective-ux-latency-preview-amendment-v1.yml'
            'B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml'
            'B2A-package-adjustment-v8-outcome-blind-maturity-monitor-v3-slot16-reset.yml'
            'B2B-package-adjustment-v8-outcome-blind-maturity-monitor-v4-slot35-reset.yml'
            'B3-package-adjustment-v8-frozen-development-outcome-evaluator.yml'
            'B3A-package-adjustment-v8-frozen-development-outcome-evaluator-v2-catalog-guard-repair.yml'
            'B3B-package-adjustment-v8-read-only-2v2-calibration-decomposition.yml'
            'B4B-package-adjustment-v8-durable-scientific-stop-closeout-v3.yml'
            'B5A-package-adjustment-v9-joint-gate-simulation-design-sizing-and-assignment-feasibility.yml'
            'B5B-package-adjustment-v9-strict-joint-gate-feasibility-boundary-audit.yml'
            'B5C-package-adjustment-v9-calibration-integrity-and-coverage-diagnostics.yml'
            'B5D-package-adjustment-v9-prospective-rule-and-burden-operating-characteristic-screen.yml'
            'B5E-package-adjustment-v9-post-stop-burden-endpoint-and-scope-feasibility-audit.yml'
            'B6-package-adjustment-v9-topology-specific-discordance-information-limit-audit-v2-blob-guard-repair.yml'
            'B6-package-adjustment-v9-topology-specific-discordance-information-limit-audit.yml'
            'B6A-package-adjustment-v9-targeted-discordance-supply-and-structural-feasibility-audit.yml'
            'B6B-package-adjustment-v9-five-topology-discordant-catalog-diversity-feasibility-audit.yml'
            'B6C-package-adjustment-v9-catalog-diversity-bottleneck-boundary-audit-v3-feasibility-objective-repair.yml'
            'B6D-package-adjustment-v9-candidate-blind-current-source-expansion-and-scope-amendment-v2-pre-run-repair.yml'
            'B6D-package-adjustment-v9-candidate-blind-current-source-expansion-and-scope-amendment-v3-current-fv-authority-repair.yml'
            'B7-package-adjustment-v9-independent-oc-confirmation-and-final-prospective-freeze-v2-estimator-anchor-catalog-binding-repair.yml'
            'B8-package-adjustment-v9-human-catalog-and-voter-assignment-freeze-v2-session-eligibility-repair.yml'
            'B8-package-adjustment-v9-human-catalog-and-voter-assignment-freeze-v3-validator-literal-repair.yml'
            'B9-package-adjustment-v9-frozen-voting-transport-launch-parity-and-deployment-guard-v2-conditional-url-authorization-repair.yml'
            'B9-package-adjustment-v9-frozen-voting-transport-launch-parity-and-deployment-guard-v3-leakage-validator-self-reference-repair.yml'
            'B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml'
            'B41C3-player-role-engine-v2-untouched-week4-scorer-confirmation.yml'
            'B41H-player-role-engine-v2-frozen-one-shot-2025-holdout-evaluator.yml'
            'B41I-player-role-engine-v2-b41h-outcome-blind-recovery-eligibility-audit-v2-snapshot-freeze-repair.yml'
            'B41I-player-role-engine-v2-b41h-outcome-blind-recovery-eligibility-audit-v3-call-graph-repair.yml'
            'B41I-player-role-engine-v2-b41h-outcome-blind-recovery-eligibility-audit-v4-required-vs-optional-identity-schema-repair.yml'
            'B41J-player-role-engine-v2-frozen-outcome-blind-2025-holdout-continuation-evaluator-v3-complete-parity-window-closure.yml'
            'B41J-player-role-engine-v2-frozen-outcome-blind-2025-holdout-continuation-evaluator-v4-b41f-selected-family-key-repair.yml'
            'B42-player-role-engine-v2-12-team-owner-blind-shadow-refresh-parity-audit-v4-pre-run-candidate.yml'
            'B42-player-role-engine-v2-12-team-owner-blind-shadow-refresh-parity-audit-v4r1-operational-repair-candidate.yml'
            'B43-player-role-engine-v2-owner-blind-identity-bridge-remediation-feasibility-v1r1-pre-run-repair-candidate.yml'
            'B43-player-role-engine-v2-owner-blind-identity-bridge-remediation-feasibility-v2r1-masked-rule-validation-collision-evidence-candidate.yml'
            'B43-player-role-engine-v2-owner-blind-identity-bridge-remediation-feasibility-v3r2-undefined-name-operational-repair-candidate.yml'
            'ZZ-workflow-folder-cleanup-2026-10-06-b-series-archive.yml'
          )

          PRESERVE=(
            'B2C-package-adjustment-v8-outcome-blind-maturity-monitor-v5-slot44-reset.yml'
            'B10E-package-adjustment-v9-voter-url-issuance-and-distribution-logger-v2-stdlib-squat-resilience-repair.yml'
            'B10F-package-adjustment-v9-prospective-ux-latency-preview-amendment-v2-scoped-transport-order-repair.yml'
            'B10G-package-adjustment-v9-prospective-pseudonym-salt-continuity-amendment-v1.yml'
            'B34D-package-trade-evidence-future-structural-maturity-monitor.yml'
            'B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml'
            'fantasypros-api-pipeline.yml'
            'free-agent-utility-v1-refresh.yml'
            'ktc-vote-aggregation.yml'
            'ktc_voter_balance_prospective.yml'
            'prospective-trade-evidence-capture.yml'
            'repo-regression-checks.yml'
            'scheduled-data-refresh.yml'
            'sync-sleeper.yml'
          )

          ROOT='.github/workflows'

          test "${#REMOVE[@]}" -eq 48
          test "${#PRESERVE[@]}" -eq 14

          echo "Workflow files before cleanup: $(find "$ROOT" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"
          echo "Explicit removal entries: ${#REMOVE[@]}"
          echo "Explicit preserve entries: ${#PRESERVE[@]}"

          # Fail closed if the static lists overlap.
          for r in "${REMOVE[@]}"; do
            for p in "${PRESERVE[@]}"; do
              if [ "$r" = "$p" ]; then
                echo "ERROR: removal/preserve overlap: $r"
                exit 1
              fi
            done
          done

          REMOVED=0
          MISSING=0
          for name in "${REMOVE[@]}"; do
            if [ -e "$ROOT/$name" ]; then
              git rm -- "$ROOT/$name"
              REMOVED=$((REMOVED + 1))
            else
              MISSING=$((MISSING + 1))
            fi
          done

          # Static preserved workflows must never be staged.
          for name in "${PRESERVE[@]}"; do
            if git diff --cached --name-only | grep -Fxq "$ROOT/$name"; then
              echo "ERROR: protected workflow staged for deletion: $name"
              exit 1
            fi
          done

          # Current/future B44 workflows are protected dynamically.
          if git diff --cached --name-only | grep -E '^\.github/workflows/(A-)?B44-' >/dev/null; then
            echo "ERROR: B44 workflow staged for deletion."
            exit 1
          fi

          # Self-delete this V2 cleanup workflow.
          git rm --ignore-unmatch -- "$ROOT/ZZ-workflow-folder-cleanup-v2-2026-10-06-b-series-archive.yml"

          echo "Explicit files removed: $REMOVED"
          echo "Explicit files already absent: $MISSING"

          CHANGED="$(git diff --cached --name-only | sort)"
          if [ -z "$CHANGED" ]; then
            echo "Nothing to clean."
            exit 0
          fi

          # Cleanup commit may touch workflow files only.
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^\.github/workflows/' || true)"
          test -z "$BAD"

          if printf '%s\n' "$CHANGED" | grep -E '^\.github/workflows/(A-)?B44-' >/dev/null; then
            echo "ERROR: B44 workflow staged for deletion after self-delete."
            exit 1
          fi

          git config user.name 'workflow-folder-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Clean completed and superseded workflow files v2'

          git fetch origin main
          git rebase origin/main

          COMMIT_CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          BAD="$(printf '%s\n' "$COMMIT_CHANGED" | grep -Ev '^\.github/workflows/' || true)"
          test -z "$BAD"

          if printf '%s\n' "$COMMIT_CHANGED" | grep -E '^\.github/workflows/(A-)?B44-' >/dev/null; then
            echo "ERROR: B44 workflow included in cleanup commit after rebase."
            exit 1
          fi

          git push origin HEAD:main

      - name: Verify cleanup landed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          test ! -f ".github/workflows/ZZ-workflow-folder-cleanup-2026-10-06-b-series-archive.yml"
          test ! -f ".github/workflows/ZZ-workflow-folder-cleanup-v2-2026-10-06-b-series-archive.yml"

          test -f ".github/workflows/B2C-package-adjustment-v8-outcome-blind-maturity-monitor-v5-slot44-reset.yml"
          test -f ".github/workflows/B10E-package-adjustment-v9-voter-url-issuance-and-distribution-logger-v2-stdlib-squat-resilience-repair.yml"
          test -f ".github/workflows/B10F-package-adjustment-v9-prospective-ux-latency-preview-amendment-v2-scoped-transport-order-repair.yml"
          test -f ".github/workflows/B10G-package-adjustment-v9-prospective-pseudonym-salt-continuity-amendment-v1.yml"
          test -f ".github/workflows/B34D-package-trade-evidence-future-structural-maturity-monitor.yml"
          test -f ".github/workflows/B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml"

          echo "PASS: targeted workflow-folder cleanup V2 landed and cleanup workflows self-deleted."
