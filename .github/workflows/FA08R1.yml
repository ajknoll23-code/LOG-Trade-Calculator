name: A - FA08R1 Week 9 Shadow Free Agent Watch Registration (Guarded)

# Locks the fixed 42-player FA06 / FA07 observational evidence for a later
# prospective Week9+ evaluation. An editorial triage, NOT a calibrated forecast.
# Preview: creates downloadable analysis artifact. Apply: commits exactly one
# immutable research JSON file, never live prices, model, board, or Sleeper data.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only or apply one immutable research-only Week 9 registry'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  frozen-shadow:
    name: Join fixed FA06 and FA07 evidence into immutable Week 9 shadow watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main for guarded research-only registration
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify original frozen availability is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          p='research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json'
          test "$(git hash-object "$p")" = '75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5'
          test -f 'scripts/model/ppg_pipeline.py'

      - name: Retrieve exact FA06 and FA07 GitHub research artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/a-fa08r1
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR/fa06" "$REPORT_DIR/fa07"
          gh run download 40560433637 --repo "$GITHUB_REPOSITORY" --name A_FA06R1_FIXED_SOURCE_WEEK7_RISING_USAGE_WATCH --dir "$REPORT_DIR/fa06"
          gh run download 40561575133 --repo "$GITHUB_REPOSITORY" --name A_FA07R1_FIXED_FA06_WATCH_EXACT_LOG_POINTS --dir "$REPORT_DIR/fa07"
          test -s "$REPORT_DIR/fa06/A_FA06R1_rising_usage_watch.csv"
          test -s "$REPORT_DIR/fa07/A_FA07R1_42_watch_players_scored.csv"
          test -s "$REPORT_DIR/fa07/A_FA07R1_report.json"

      - name: Build watchlist and test fixed source integrity
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa08r1
        run: |
          set -euo pipefail
          cat > "$REPORT_DIR/FA08R1_engine.py" <<'PYCODE'
          #!/usr/bin/env python3
          """FA08R1: Immutable Week 9 shadow research watch cohort, no pricing or live changes."""
          import argparse
          import csv
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          from collections import Counter,defaultdict
          from datetime import datetime,timezone

          SENTINEL=Path('research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json')
          SENTINEL_GIT_BLOB='75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5'
          SHA_FA06_CSV='61c9ff3cd95f04e2b71bacb51b0ea5acb9b12104a1a9779893c7b7ac9bea23c0'
          SHA_FA07_CSV='7c8d773f7c82d9bfa31ae0709be9eecd3c8be4bce4ac1c9f53e7833c04f6633d'
          SHA_FA07_JSON='f496cde11acc6ef83d38d01717d914a18b9c7cb86bfcf448414546df46e6435d'
          DEST='research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json'
          POS=('QB','RB','WR','TE','DL','LB','DB')


          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def yes(v):return str(v).strip().lower() == 'true'

          def finite(v):
              try:
                  x=float(v)
                  if not math.isfinite(x):raise ValueError('Nonfinite')
                  return x
              except (TypeError, ValueError):raise AssertionError(f'Invalid numeric field {v!r}')


          def classify(r):
              young=r['young_age_experience_screen']
              support=bool(r['supporting_stats'])
              productive=r['week7_LOG_pts']>=5
              gaining=r['week7_LOG_pts_increase_vs_w5w6_mean']>=5
              if young:
                  if support and productive and gaining:return 'DYNASTY_USAGE_AND_PRODUCTION'
                  if support and productive:return 'DYNASTY_USAGE_WITH_PRODUCTION'
                  if support:return 'DYNASTY_USAGE_WITH_OPPORTUNITY'
                  return 'DYNASTY_SNAPS_ONLY'
              if productive and gaining:return 'SHORT_TERM_USAGE_AND_PRODUCTION'
              if productive:return 'SHORT_TERM_USAGE_WITH_PRODUCTION'
              return 'VETERAN_SNAPS_ONLY'


          def build(watch, scored, report, freeze, now):
              assert len(watch)==len(scored)==42
              assert len(freeze['players'])==1607 and freeze['target_week_requested_not_kickoff_certified']==9
              assert freeze['classification']=='PROSPECTIVE_CURRENT_AVAILABILITY_CAPTURE_NOT_PREDICTION'
              assert freeze['captured_at_utc']=='2026-10-27T16:07:46+00:00'
              assert report['status']=='W5_W7_LEAGUE_POINTS_CROSSCHECK_PASS'
              assert report['source_FA06_run_id']==40560433637
              assert report['source_watch_csv_sha256']==SHA_FA06_CSV
              assert report['research_no_week8_or_week9_sources_used'] is True
              assert report['fully_scored_3_week_candidates']==42
              assert report['frozen_pool_path']==str(SENTINEL)
              assert report['classification']=='RETROSPECTIVE_IN_WINDOW_SCORING_CROSSCHECK_NOT_PREDICTION'
              by_frozen={str(x['player_id']):x for x in freeze['players']}
              by_watch={str(x['player_id']):x for x in watch}
              by_scored={str(x['player_id']):x for x in scored}
              assert len(by_frozen)==1607 and len(by_watch)==len(by_scored)==42
              assert set(by_watch)==set(by_scored) and set(by_scored)<=set(by_frozen)
              result=[]
              for sid,src in by_scored.items():
                  w=by_watch[sid];f=by_frozen[sid]
                  assert src['name']==w['name']==f['name'],sid
                  assert src['pos']==w['pos']==f['pos'] and src['pos'] in POS,sid
                  assert src['watch_category']==w['watch_category'],sid
                  assert yes(src['full_scored_w5_w7']) and yes(w['completed_w5_w7_snaps_and_gp'])
                  assert all(src[f'week{k}_status']=='SCORED_CONFIRMED_GP' for k in (5,6,7))
                  assert yes(src['young_age_experience_screen'])==yes(w['young_screen_age26_exp3'])
                  assert str(src['week7_supporting_fields'])==str(w['week7_supporting_stat_fields'])
                  v5,v6,v7=(finite(src[f'week{k}_LOG_pts']) for k in (5,6,7))
                  baseline=(v5+v6)/2
                  assert abs(finite(src['week7_minus_prior_avg_LOG_pts'])-(v7-baseline))<0.075,sid
                  snap5,snap6,snap7=(finite(w[f'week{k}_snap_count']) for k in (5,6,7))
                  assert abs(finite(src['week7_snap_delta'])-(snap7-(snap5+snap6)/2))<0.075,sid
                  young=yes(src['young_age_experience_screen'])
                  support=src['week7_supporting_fields'].strip()
                  record={
                    'player_id':sid,'name':src['name'],'position':src['pos'],'team_at_2026W09_freeze':f.get('team'),
                    'age_at_freeze':f.get('age'),'young_age26_exp3':young,'young_age_experience_screen':young,
                    'v1_priority_rank_within_position_at_freeze':f.get('v1_priority_rank_within_position'),
                    'week5_snaps':snap5,'week6_snaps':snap6,'week7_snaps':snap7,
                    'week7_snap_increase_vs_w5w6_mean':round(snap7-(snap5+snap6)/2,2),
                    'week5_LOG_pts':v5,'week6_LOG_pts':v6,'week7_LOG_pts':v7,
                    'week7_LOG_pts_increase_vs_w5w6_mean':round(v7-baseline,2),
                    'week7_supporting_stats':support,'supporting_stats':support,
                    'original_FA06_category':w['watch_category'],
                    'original_factual_stash_screen':yes(w['frozen_dynasty_stash_factual_flag']),
                    'source_scoring_complete':True,
                    'observation_horizon':'COMPLETED_2026_W5_W7_ONLY',
                    'prediction_probability':None,
                  }
                  record['shadow_lane']='DYNASTY_STASH' if young else 'SHORT_TERM_UTILITY'
                  record['descriptive_tier']=classify(record)
                  record.pop('supporting_stats')
                  record.pop('young_age_experience_screen')
                  result.append(record)
              priority={
                'DYNASTY_USAGE_AND_PRODUCTION':0,
                'DYNASTY_USAGE_WITH_PRODUCTION':1,
                'DYNASTY_USAGE_WITH_OPPORTUNITY':2,
                'DYNASTY_SNAPS_ONLY':3,
                'SHORT_TERM_USAGE_AND_PRODUCTION':0,
                'SHORT_TERM_USAGE_WITH_PRODUCTION':1,
                'VETERAN_SNAPS_ONLY':2,
              }
              result.sort(key=lambda r:(r['shadow_lane'],POS.index(r['position']),priority[r['descriptive_tier']],-r['week7_LOG_pts_increase_vs_w5w6_mean'],-r['week7_snaps'],r['name']))
              ct=Counter(r['descriptive_tier'] for r in result)
              youngs=sum(r['young_age26_exp3'] for r in result)
              support=sum(bool(r['week7_supporting_stats']) and r['young_age26_exp3'] for r in result)
              gain5=sum(r['week7_LOG_pts_increase_vs_w5w6_mean']>=5 for r in result)
              assert youngs==21 and support==14 and gain5==15,(youngs,support,gain5)
              assert not any(r['prediction_probability'] is not None for r in result)
              by_position={p:{'total':sum(r['position']==p for r in result),'young':sum(r['position']==p and r['young_age26_exp3'] for r in result),'production_gain5':sum(r['position']==p and r['week7_LOG_pts_increase_vs_w5w6_mean']>=5 for r in result)} for p in POS}
              return {
                 'schema_version':1,'study':'A_FA08R1 Week 9 shadow watch registration',
                 'classification':'FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION',
                 'registered_at_utc':now.astimezone(timezone.utc).isoformat(timespec='seconds'),
                 'registered_for_season':2026,'registered_for_week':9,
                 'registration_before_week9_first_kickoff_verified':False,
                 'usage_and_scoring_feature_weeks':[5,6,7],
                 'future_outcomes_used_as_features':False,
                 'source_waiver_pool_frozen_at':freeze['captured_at_utc'],
                 'source_waiver_status_is_current_today':False,
                 'source_waiver_pool_size':1607,
                 'source_FA06_run':40560433637,'source_FA07_run':40561575133,
                 'source_shas':{'FA06_watch_csv':SHA_FA06_CSV,'FA07_scored_csv':SHA_FA07_CSV,'FA07_report_json':SHA_FA07_JSON,'frozen_week9_waiver_snapshot_git_blob':SENTINEL_GIT_BLOB},
                 'registration_repo_path':DEST,
                 'counts':{'watch_total':42,'young':youngs,'veteran':42-youngs,'young_with_supporting_stats':support,'production_gain_ge_5pts':gain5},
                 'by_position':by_position,'descriptive_tier_counts':dict(sorted(ct.items())),
                 'ranking_policy':'within_position_then_descriptive_tier_then_LOG_gain_then_snap_count; editorial research triage, not predictive probabilities',
                 'limitations':[
                    'Week7 playing-time change was used to select candidates and Week7 points used to label them: in-sample descriptive crosscheck, not a historical W7 prediction.',
                    'The frozen Week9 free-agent cache established that these names were listed available at sync, but cannot establish availability now or before Week7.',
                    'No Week8/Week9 points, Week9 role, protected CAL26 holdouts, opponent adjustment, team snap denominator or future dynasty-market value used.',
                    'Sample of 42 preselected rising-snap names is biased; no predictive precision, skill or future value appreciation is claimed.',
                    'Age/experience and thresholds are explicit editorial buckets, not optimized or fitted model coefficients.',
                    'Prospective outcomes must be captured AFTER Week9 results, and only treated as forward evaluation if independent kickoff timing is certified.',
                    'Player values, live board and pricing models remain unchanged.',
                 ],
                 'pricing_changes_authorized':False,'live_board_changes_authorized':False,
                 'predictive_accuracy_established':False,'future_outcome_snapshot_already_present':False,
                 'players':result,
              }


          def main():
              p=argparse.ArgumentParser();p.add_argument('--selftest',action='store_true');a=p.parse_args()
              if a.selftest:
                  assert classify({'young_age_experience_screen':True,'supporting_stats':'targets=5','week7_LOG_pts':7,'week7_LOG_pts_increase_vs_w5w6_mean':5.5})=='DYNASTY_USAGE_AND_PRODUCTION'
                  assert classify({'young_age_experience_screen':True,'supporting_stats':'','week7_LOG_pts':12,'week7_LOG_pts_increase_vs_w5w6_mean':6})=='DYNASTY_SNAPS_ONLY'
                  assert classify({'young_age_experience_screen':False,'supporting_stats':'','week7_LOG_pts':9,'week7_LOG_pts_increase_vs_w5w6_mean':6})=='SHORT_TERM_USAGE_AND_PRODUCTION'
                  print('PASS A_FA08R1 synthetic classification + no fabricated predictive score')
                  return
              root=Path(os.environ['REPORT_DIR']);root.mkdir(parents=True,exist_ok=True)
              paths={'FA06_CSV':root/'fa06/A_FA06R1_rising_usage_watch.csv','FA07_CSV':root/'fa07/A_FA07R1_42_watch_players_scored.csv','FA07_JSON':root/'fa07/A_FA07R1_report.json'}
              for k,x in paths.items():
                  assert x.is_file() and sha(x)==globals()[{'FA06_CSV':'SHA_FA06_CSV','FA07_CSV':'SHA_FA07_CSV','FA07_JSON':'SHA_FA07_JSON'}[k]],f'Fixed research evidence missing or SHA drift: {k}'
              watch=list(csv.DictReader(paths['FA06_CSV'].open(newline='')))
              score=list(csv.DictReader(paths['FA07_CSV'].open(newline='')))
              report=json.loads(paths['FA07_JSON'].read_text())
              freeze=json.loads(SENTINEL.read_text())
              doc=build(watch,score,report,freeze,datetime.now(timezone.utc))
              (root/'A_FA08R1_shadow_register.json').write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
              cols=['shadow_lane','descriptive_tier','position','name','team_at_2026W09_freeze','age_at_freeze','v1_priority_rank_within_position_at_freeze','week7_snaps','week7_snap_increase_vs_w5w6_mean','week7_LOG_pts','week7_LOG_pts_increase_vs_w5w6_mean','week7_supporting_stats','player_id']
              with (root/'A_FA08R1_shadow_watchlist.csv').open('w',newline='') as f:
                  wr=csv.DictWriter(f,fieldnames=cols);wr.writeheader();wr.writerows({k:r.get(k) for k in cols} for r in doc['players'])
              md=['# A FA08R1 — Week 9 Shadow Free Agent Watchlist','',f"**Evidence:** 42 Week7 rising-snap players; {doc['counts']['young']} young, {doc['counts']['production_gain_ge_5pts']} with a 5+ LOG point gain vs W5–6 mean.",'',
                '**Not a validated forecast or current waiver confirmation. No FV, MV or live board changes.**','',
                '## Triage counts by position','', '| Position | Total | Young | W7 point gain ≥5 |','|---|---:|---:|---:|']
              for p,v in doc['by_position'].items():md.append(f"| {p} | {v['total']} | {v['young']} | {v['production_gain5']} |")
              for lane in ('DYNASTY_STASH','SHORT_TERM_UTILITY'):
                  md.extend(['',f'## {lane.replace("_"," ").title()}', '', '| Player | Pos | Evidence tier | Week7 LOG | Gain | Snap gain |', '|---|---|---|---:|---:|---:|'])
                  for x in sorted((r for r in doc['players'] if r['shadow_lane']==lane),key=lambda r:(r['descriptive_tier'].split('_')[-1] not in ('PRODUCTION',),-r['week7_LOG_pts_increase_vs_w5w6_mean']))[:20]:
                      md.append(f"| {x['name']} | {x['position']} | {x['descriptive_tier']} | {x['week7_LOG_pts']:.1f} | {x['week7_LOG_pts_increase_vs_w5w6_mean']:+.1f} | {x['week7_snap_increase_vs_w5w6_mean']:+.1f} |")
              md.extend(['','## Limitations','']+['- '+v for v in doc['limitations']]+['',f"**Registration target (apply only):** `{DEST}`",''])
              (root/'A_FA08R1_report.md').write_text('\n'.join(md))
              print('SHADOW_WATCH_REPORT_PASS',json.dumps(doc['counts'],sort_keys=True),dict(doc['descriptive_tier_counts']))

          if __name__=='__main__':main()
          PYCODE
          python3 "$REPORT_DIR/FA08R1_engine.py" --selftest
          python3 "$REPORT_DIR/FA08R1_engine.py"
          python3 -m json.tool "$REPORT_DIR/A_FA08R1_shadow_register.json" >/dev/null
          test -z "$(git status --porcelain)"

      - name: Upload shadow research reports even if apply subsequently fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA08R1_W09_FROZEN_42_SHADOW_REGISTRATION
          path: |
            ${{ runner.temp }}/a-fa08r1/A_FA08R1_shadow_register.json
            ${{ runner.temp }}/a-fa08r1/A_FA08R1_shadow_watchlist.csv
            ${{ runner.temp }}/a-fa08r1/A_FA08R1_report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Apply exactly one new immutable research registry
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa08r1
        run: |
          set -euo pipefail
          p='research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json'
          test ! -e "$p" || { echo 'Immutable registry already exists: must not overwrite'; exit 1; }
          test -z "$(git status --porcelain)"
          mkdir -p "$(dirname "$p")"
          cp "$REPORT_DIR/A_FA08R1_shadow_register.json" "$p"
          test "$(git ls-files --others --exclude-standard)" = "$p" || { echo 'Unexpected untracked files'; exit 1; }
          git add -- "$p"
          test "$(git diff --cached --name-only)" = "$p"
          git diff --cached --check
          git config user.name 'a-fa08-shadow-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'A FA08R1: register frozen Week 9 shadow free-agent watch (research only)'
          git push origin HEAD:main
          echo 'PASS research-only 42-player shadow watch frozen without production edits'

      - name: Preview-only result
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'PASS preview. Run apply only if you want the fixed 42-player research watch frozen to main.'
