name: Package Adjustment NextGen V2 Freeze Beta-Bound Amendment

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Guard original frozen preregistration
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          cfg = json.loads((d / "model_fit_preregistration.json").read_text())

          assert cfg["status"] == "frozen_model_fit_preregistration"
          assert cfg["frozen"] is True
          assert cfg["research_only"] is True
          assert cfg["production_change_authorized"] is False
          assert cfg["automatic_production_change_allowed"] is False
          assert cfg["optimizer"]["log_beta_bounds"] == [
              -6.907755278982137,
              3.912023005428146,
          ]
          assert abs(math.exp(cfg["optimizer"]["log_beta_bounds"][1]) - 50.0) < 1e-9

          print("PASS: original frozen preregistration remains intact at beta cap 50.")
          PY

      - name: Verify training-only diagnostic provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/pkgnv2-amendment-provenance

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = "ajknoll23-code/LOG-Trade-Calculator"
          token = os.environ["GH_TOKEN"]
          out = Path("/tmp/pkgnv2-amendment-provenance")

          checks = [
              {
                  "run_id": 34645327891,
                  "artifact_id": 10282102386,
                  "artifact_digest": "sha256:ea98defc7de8d18f9ba7d4d83c77b98bb010a86a4aea79f7c849b9ea76d9793b",
                  "artifact_name": "package-adjustment-nextgen-v2-model-fit",
                  "required_file": "model-fit-results.json",
              },
              {
                  "run_id": 34651267567,
                  "artifact_id": 10283274870,
                  "artifact_digest": "sha256:b4a86c0caf0672977f178676b10ac2b79b3a1f52d8bfc4f133e5020f9d99b04e",
                  "artifact_name": "package-adjustment-nextgen-v2-training-boundary-diagnostic",
                  "required_file": "training-boundary-diagnostic.json",
              },
              {
                  "run_id": 34651852369,
                  "artifact_id": 10285180714,
                  "artifact_digest": "sha256:cf84f1d8deb32f6357e7b3e69dcee841ca82aa9297d9538d4e5d5cfd405012ae",
                  "artifact_name": "package-adjustment-nextgen-v2-m2b-fold-boundary-diagnostic",
                  "required_file": "m2b-fold-boundary-diagnostic.json",
              },
          ]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pkgnv2-amendment-freeze",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def download(url, path):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  path.write_bytes(r.read())

          extracted = {}

          for item in checks:
              run = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs/{item['run_id']}"
              )
              assert run["status"] == "completed"
              assert run["conclusion"] == "success"

              meta = get_json(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{item['artifact_id']}"
              )
              assert meta["name"] == item["artifact_name"]
              assert meta["expired"] is False
              assert meta["digest"] == item["artifact_digest"]

              zip_path = out / f"{item['artifact_id']}.zip"
              download(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{item['artifact_id']}/zip",
                  zip_path,
              )

              dest = out / str(item["artifact_id"])
              dest.mkdir()
              with zipfile.ZipFile(zip_path) as zf:
                  zf.extractall(dest)

              required = dest / item["required_file"]
              assert required.exists()
              extracted[item["artifact_id"]] = json.loads(required.read_text())

          model_fit = extracted[10282102386]
          training_diag = extracted[10283274870]
          m2b_diag = extracted[10285180714]

          # Original frozen fit was unresolved and did not authorize production.
          assert model_fit["status"] == "model_fit_unresolved"
          assert model_fit["research_only"] is True
          assert model_fit["production_change_authorized"] is False
          assert model_fit["maturity"]["valid_effective_votes"] == 800.0
          assert model_fit["maturity"]["distinct_voters"] == 40

          # First training-only diagnostic proved cap 150 resolves M0/M2a.
          assert training_diag["structural_holdout_outcomes_evaluated"] is False
          assert training_diag["structural_holdout_ballots_discarded_before_fit"] is True
          assert training_diag["training_ballot_count"] == 407
          assert training_diag["holdout_ballot_count_discarded_without_evaluation"] == 393
          assert training_diag["frozen_checkpoint"]["canonical_ballot_sha256"] == (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )

          # M2b fold diagnostic proved cap 250 resolves every fold and full CV.
          assert m2b_diag["status"] == "m2b_training_path_resolved"
          assert m2b_diag["structural_holdout_outcomes_evaluated"] is False
          assert m2b_diag["structural_holdout_ballots_discarded_before_fit"] is True
          assert m2b_diag["training_ballot_count"] == 407
          assert m2b_diag["holdout_ballot_count_discarded_without_evaluation"] == 393
          assert m2b_diag["smallest_beta_cap_with_all_m2b_lambda0_folds_eligible"] == 250.0
          assert m2b_diag["full_cv_at_resolved_cap"]["success"] is True
          assert m2b_diag["full_cv_at_resolved_cap"]["selected_lambda"] == 1.0
          assert m2b_diag["final_full_training_m2b_fit"]["eligible"] is True
          assert m2b_diag["final_full_training_m2b_fit"]["boundary_flags"] == []
          assert m2b_diag["frozen_checkpoint"]["canonical_ballot_sha256"] == (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )

          scan = {
              row["beta_cap"]: row
              for row in m2b_diag["fold_scan"]
          }
          assert scan[150.0]["eligible_fold_count"] == 3
          assert scan[250.0]["eligible_fold_count"] == 5

          print("PASS: diagnostic provenance proves beta-cap amendment is training-only.")
          PY

      - name: Generate frozen beta-bound amendment
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          test ! -e "$D/model_fit_preregistration_beta_bound_amendment_v1.json"
          test ! -e "$D/model_fit_preregistration_beta_bound_amendment_v1.md"
          test ! -e "$D/model_fit_preregistration_beta_bound_amendment_v1_manifest.json"

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          original = json.loads((d / "model_fit_preregistration.json").read_text())

          old_upper_log_beta = float(original["optimizer"]["log_beta_bounds"][1])
          new_upper_beta = 250.0
          new_upper_log_beta = math.log(new_upper_beta)

          amendment = {
              "schema_version": 1,
              "status": "frozen_pre_holdout_optimizer_bound_amendment",
              "frozen": True,
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_change_allowed": False,
              "amendment_id": "pkgnv2-beta-bound-v1",
              "scope": "optimizer_nuisance_beta_upper_bound_only",
              "reason": (
                  "Original preregistered beta cap 50 caused otherwise successful "
                  "training-only fits to be classified unresolved at the upper boundary. "
                  "Outcome-bearing structural holdouts were not evaluated during diagnosis."
              ),
              "original_preregistration": {
                  "path": "research/package-adjustment-nextgen-v2/model_fit_preregistration.json",
                  "git_blob_sha": "11839895bc255721365c7133792a4b806d825d45",
                  "sha256": hashlib.sha256(
                      (d / "model_fit_preregistration.json").read_bytes()
                  ).hexdigest(),
              },
              "original_fitter": {
                  "path": "research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py",
                  "git_blob_sha": "1bb4912cf94621bb216a9330caaf6ae00204144a",
                  "sha256": hashlib.sha256(
                      (d / "fit_package_adjustment_nextgen_v2.py").read_bytes()
                  ).hexdigest(),
                  "code_changed_by_amendment": False,
              },
              "change": {
                  "field": "optimizer.log_beta_bounds[1]",
                  "old_log_beta": old_upper_log_beta,
                  "old_beta": math.exp(old_upper_log_beta),
                  "new_log_beta": new_upper_log_beta,
                  "new_beta": new_upper_beta,
                  "lower_beta_bound_unchanged": float(
                      original["optimizer"]["log_beta_bounds"][0]
                  ),
                  "boundary_semantics_unchanged": (
                      "upper_beta_boundary_is_unresolved remains true"
                  ),
              },
              "diagnostic_basis": {
                  "evidence_checkpoint": {
                      "effective_votes": 800,
                      "distinct_voters": 40,
                      "canonical_ballot_sha256": (
                          "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
                      ),
                  },
                  "training_ballots": 407,
                  "structural_holdout_ballots_discarded_before_fit": 393,
                  "structural_holdout_outcomes_evaluated": False,
                  "full_training_M0_M2a_first_resolved_tested_cap": 150.0,
                  "M2b_lambda0_cv_folds_eligible_at_beta_150": "3/5",
                  "M2b_lambda0_cv_folds_eligible_at_beta_250": "5/5",
                  "smallest_tested_M2b_all_fold_resolved_cap": 250.0,
                  "M2b_full_cv_success_at_250": True,
                  "M2b_selected_lambda_at_250": 1.0,
                  "M2b_final_full_training_fit_eligible_at_250": True,
                  "M2b_final_full_training_beta_at_250": 115.03006974128468,
              },
              "provenance": {
                  "original_model_fit": {
                      "run_id": 34645327891,
                      "artifact_id": 10282102386,
                      "artifact_digest": (
                          "sha256:ea98defc7de8d18f9ba7d4d83c77b98bb010a86a4aea79f7c849b9ea76d9793b"
                      ),
                  },
                  "training_boundary_diagnostic": {
                      "run_id": 34651267567,
                      "artifact_id": 10283274870,
                      "artifact_digest": (
                          "sha256:b4a86c0caf0672977f178676b10ac2b79b3a1f52d8bfc4f133e5020f9d99b04e"
                      ),
                  },
                  "m2b_fold_boundary_diagnostic": {
                      "run_id": 34651852369,
                      "artifact_id": 10285180714,
                      "artifact_digest": (
                          "sha256:cf84f1d8deb32f6357e7b3e69dcee841ca82aa9297d9538d4e5d5cfd405012ae"
                      ),
                  },
              },
              "unchanged_contract": {
                  "catalog": True,
                  "ballot_evidence": True,
                  "maturity_gate": True,
                  "train_holdout_split": True,
                  "model_definitions": True,
                  "M2b_lambda_grid": True,
                  "cross_validation_folds_and_assignment": True,
                  "cross_validation_selection_rule": True,
                  "bootstrap_method_seed_draw_count": True,
                  "model_selection_thresholds": True,
                  "simplicity_order": True,
                  "production_formula": True,
                  "automatic_promotion": False,
              },
              "execution_rule": {
                  "next_model_fit_must_use_beta_upper_bound": 250.0,
                  "next_model_fit_must_use_exact_800_vote_checkpoint": True,
                  "next_model_fit_must_reuse_original_fitter_logic": True,
                  "structural_holdouts_may_be_evaluated_only_after_this_amendment_is_frozen": True,
                  "no_additional_training_tuning_after_structural_holdout_evaluation": True,
                  "production_promotion_requires_separate_human_approved_step": True,
              },
          }

          json_path = d / "model_fit_preregistration_beta_bound_amendment_v1.json"
          json_path.write_text(
              json.dumps(amendment, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = f"""# Package Adjustment NextGen V2 — Beta-Bound Amendment V1

          Status: **frozen pre-holdout optimizer-bound amendment**

          ## Change

          Only the nuisance choice-sensitivity optimizer upper bound changes:

          - Original beta upper bound: **50**
          - Amended beta upper bound: **250**
          - Original log-beta upper bound: `{old_upper_log_beta}`
          - Amended log-beta upper bound: `{new_upper_log_beta}`

          The rule that an optimizer solution at the upper beta boundary is unresolved remains unchanged.

          ## Why this amendment is allowed before holdout evaluation

          The original frozen fit returned unresolved because beta hit the preregistered ceiling.
          All subsequent diagnostics were explicitly training-only.

          - Exact evidence checkpoint remained **800 effective votes / 40 voters**.
          - Canonical ballot fingerprint remained
            `6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72`.
          - **407** training ballots were used in diagnostics.
          - **393** structural-holdout ballots were discarded before fitting.
          - Structural-holdout outcomes were **not evaluated**.

          Full-training M0/M2a first resolved at tested beta cap **150**.
          M2b lambda=0 CV folds were only **3/5 eligible at 150**, but **5/5 eligible at 250**.
          At beta cap 250, the full frozen M2b CV procedure succeeded, selected lambda **1.0**,
          and the final full-training M2b fit was eligible with beta approximately **115.0301**
          and no disallowed boundary flags.

          ## What does not change

          The challenge catalog, evidence, maturity rules, train/holdout split, model formulas,
          spline knots, M2b lambda grid, five-fold voter CV assignment, CV selection rule,
          bootstrap procedure, bootstrap seed, 500-valid-draw requirement, model-selection
          thresholds, simplicity order, and production Package Adjustment V1.6 formula all
          remain unchanged.

          This amendment does **not** authorize a production change.

          ## Next execution rule

          The next first-wave research fit must use the exact frozen 800-vote checkpoint and
          the original fitter logic with only the beta upper bound replaced by **250**.
          Once structural-holdout outcomes are evaluated under that frozen amended procedure,
          no additional tuning using these holdouts is allowed.
          """

          md_path = d / "model_fit_preregistration_beta_bound_amendment_v1.md"
          md_path.write_text(
              "\n".join(line.strip() for line in md.splitlines()) + "\n",
              encoding="utf-8",
          )

          manifest = {
              "schema_version": 1,
              "status": "frozen_pre_holdout_optimizer_bound_amendment_manifest",
              "frozen": True,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "artifacts": {
                  "amendment_json": {
                      "path": str(json_path),
                      "sha256": hashlib.sha256(json_path.read_bytes()).hexdigest(),
                  },
                  "amendment_markdown": {
                      "path": str(md_path),
                      "sha256": hashlib.sha256(md_path.read_bytes()).hexdigest(),
                  },
              },
              "production_change_authorized": False,
              "structural_holdout_outcomes_evaluated_before_freeze": False,
          }

          manifest_path = d / "model_fit_preregistration_beta_bound_amendment_v1_manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: frozen beta-bound amendment artifacts generated.")
          print("JSON SHA256:", manifest["artifacts"]["amendment_json"]["sha256"])
          print("MD SHA256:", manifest["artifacts"]["amendment_markdown"]["sha256"])
          PY

      - name: Validate amendment isolation
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          amendment = json.loads(
              (d / "model_fit_preregistration_beta_bound_amendment_v1.json").read_text()
          )
          manifest = json.loads(
              (d / "model_fit_preregistration_beta_bound_amendment_v1_manifest.json").read_text()
          )

          assert amendment["status"] == "frozen_pre_holdout_optimizer_bound_amendment"
          assert amendment["frozen"] is True
          assert amendment["production_change_authorized"] is False
          assert amendment["change"]["field"] == "optimizer.log_beta_bounds[1]"
          assert amendment["change"]["old_beta"] == 49.99999999999999
          assert amendment["change"]["new_beta"] == 250.0
          assert abs(
              amendment["change"]["new_log_beta"] - math.log(250.0)
          ) < 1e-15
          assert amendment["diagnostic_basis"]["structural_holdout_outcomes_evaluated"] is False
          assert amendment["unchanged_contract"]["model_definitions"] is True
          assert amendment["unchanged_contract"]["model_selection_thresholds"] is True
          assert amendment["unchanged_contract"]["production_formula"] is True
          assert amendment["execution_rule"]["next_model_fit_must_use_beta_upper_bound"] == 250.0

          for key, item in manifest["artifacts"].items():
              path = Path(item["path"])
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]

          print("PASS: amendment changes optimizer beta ceiling only.")
          PY

          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            "$D/model_fit_preregistration_beta_bound_amendment_v1.json" \
            "$D/model_fit_preregistration_beta_bound_amendment_v1.md" \
            "$D/model_fit_preregistration_beta_bound_amendment_v1_manifest.json" \
            | sort)"

          test "$changed" = "$expected"

      - name: Run full repository regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Commit exactly the frozen amendment
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$D/model_fit_preregistration_beta_bound_amendment_v1.json" \
            "$D/model_fit_preregistration_beta_bound_amendment_v1.md" \
            "$D/model_fit_preregistration_beta_bound_amendment_v1_manifest.json"

          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --quiet && {
            echo "ERROR: no amendment changes staged"
            exit 1
          }

          git commit -m "Freeze NextGen V2 beta-bound amendment"
          git push origin HEAD:main

      - name: Verify committed file set
        shell: bash
        run: |
          set -euo pipefail

          files="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          expected="$(printf '%s\n' \
            "research/package-adjustment-nextgen-v2/model_fit_preregistration_beta_bound_amendment_v1.json" \
            "research/package-adjustment-nextgen-v2/model_fit_preregistration_beta_bound_amendment_v1.md" \
            "research/package-adjustment-nextgen-v2/model_fit_preregistration_beta_bound_amendment_v1_manifest.json" \
            | sort)"

          test "$files" = "$expected"
          test -z "$(git status --porcelain=v1)"
          echo "PASS: exactly three frozen amendment files committed."
