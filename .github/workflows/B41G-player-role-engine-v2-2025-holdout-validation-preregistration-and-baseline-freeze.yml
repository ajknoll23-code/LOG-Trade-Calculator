      - name: Build preregistration report
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          cat > "$BASE/player_role_v2_b41g_preregistration_report.md" <<'MD'
          # Player Role V2 — B41G 2025 Holdout Preregistration

          - 2025 holdout opened: **No**
          - B41C3 required before any 2025 read: **Yes**
          - B41F model weights changed: **No**
          - B41E tier thresholds changed: **No**
          - B41C2 scorer changed: **No**
          - Final best-single-signal baseline implementation frozen from 2019–2024 only: **Yes**
          - Production change authorized: **No**

          ## Frozen final holdout decision

          The eventual one-shot 2025 evaluation passes only if all data-integrity gates and all four preregistered tests pass:

          1. The frozen B41F model is strictly superior to the frozen best-single-signal baseline by the upper bound of a 20,000-replicate origin-week cluster-bootstrap 95% CI on macro-position MAE difference.
          2. The lower bound of the corresponding pooled Spearman 95% CI is strictly positive.
          3. Frozen seven-tier mean future-production percentile is non-decreasing from Speculative through Elite.
          4. Frozen seven-tier mean future-snap percentile is non-decreasing across snap-relevant positions.

          No 2025 result may be used to retune weights, features, thresholds, scoring, exclusions, or the pass rule.
          MD

      - name: Commit B41G preregistration before any baseline derivation or 2025 access
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$BASE/player_role_v2_b41g_baseline_freezer.py" \
            "$BASE/player_role_v2_b41g_holdout_validation_preregistration.json" \
            "$BASE/player_role_v2_b41g_preregistration_report.md"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "B41G preregistration already committed identically"
          else
            git commit -m "Preregister Player Role V2 B41G 2025 holdout validation"
            git push origin HEAD:main
          fi

  freeze_final_baseline:
    needs: freeze_holdout_protocol
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out latest B41G preregistration
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact B41F-compatible runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.5.3" "pandas==2.3.3" "scipy==1.18.1" "scikit-learn==1.9.1"

      - name: Download exact sealed 2019-2024 B41D modeling artifact
        uses: actions/download-artifact@v4
        with:
          name: b41d-modeling-data
          path: /tmp/b41g-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37093761378

      - name: Verify development artifact and B41G freezer before baseline derivation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path('research/player-role-v2')
          p = json.loads((base / 'player_role_v2_b41g_holdout_validation_preregistration.json').read_text())
          data = Path('/tmp/b41g-data/player_role_v2_b41d_modeling_data.csv.gz')
          freezer = base / 'player_role_v2_b41g_baseline_freezer.py'
          sha = lambda x: hashlib.sha256(Path(x).read_bytes()).hexdigest()
          if not data.exists():
              raise RuntimeError('B41G_DEVELOPMENT_ARTIFACT_MISSING')
          if sha(data) != p['frozen_inputs']['development_modeling_data_sha256']:
              raise RuntimeError('B41G_DEVELOPMENT_ARTIFACT_SHA_MISMATCH')
          if sha(freezer) != p['frozen_inputs']['baseline_freezer_sha256']:
              raise RuntimeError('B41G_BASELINE_FREEZER_SHA_MISMATCH')
          assert p['status'] == 'PREREGISTERED_BEFORE_ANY_2025_HOLDOUT_ACCESS'
          assert p['sequencing']['B41G_preregistration_reads_2025_data'] is False
          print('PASS: exact development artifact and frozen B41G freezer verified.')
          PY

      - name: Derive frozen final best-single-signal baseline twice for determinism
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          mkdir -p /tmp/b41g-baseline

          for tag in a b; do
            python3 "$BASE/player_role_v2_b41g_baseline_freezer.py" \
              --data /tmp/b41g-data/player_role_v2_b41d_modeling_data.csv.gz \
              --development-contract "$BASE/player_role_v2_b41d_development_contract.json" \
              --b41d-decision "$BASE/player_role_v2_b41d_scientific_decision.json" \
              --b41f-snapshot "$BASE/player_role_v2_b41f_final_model_snapshot.json" \
              --prereg "$BASE/player_role_v2_b41g_holdout_validation_preregistration.json" \
              --out "/tmp/b41g-baseline/baseline_${tag}.json"
          done

          cmp /tmp/b41g-baseline/baseline_a.json /tmp/b41g-baseline/baseline_b.json
          cp /tmp/b41g-baseline/baseline_a.json "$BASE/player_role_v2_b41g_baseline_snapshot.json"

      - name: Record B41G pre-holdout freeze decision
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path('research/player-role-v2')
          b = json.loads((base / 'player_role_v2_b41g_baseline_snapshot.json').read_text())
          p = json.loads((base / 'player_role_v2_b41g_holdout_validation_preregistration.json').read_text())
          sha = lambda x: hashlib.sha256(Path(x).read_bytes()).hexdigest()
          positions = ['QB','RB','WR','TE','K','DL','LB','DB']

          assert b['status'] == 'BASELINE_FROZEN_BEFORE_2025_HOLDOUT_OPEN'
          assert b['2025_holdout_opened'] is False
          assert set(b['position_baselines']) == set(positions)

          decision = {
              'schema_version': 1,
              'study_id': 'player-role-v2',
              'phase': 'B41G-pre-holdout-freeze-decision',
              'result': 'PASS_2025_HOLDOUT_PROTOCOL_AND_BASELINE_FROZEN',
              'preregistration_sha256': sha(base / 'player_role_v2_b41g_holdout_validation_preregistration.json'),
              'baseline_snapshot_sha256': sha(base / 'player_role_v2_b41g_baseline_snapshot.json'),
              'baseline_freezer_sha256': p['frozen_inputs']['baseline_freezer_sha256'],
              '2025_holdout_opened': False,
              '2026_week4_opened_by_b41g': False,
              'B41C3_pass_required_before_holdout_open': True,
              'B41F_model_changed': False,
              'B41E_thresholds_changed': False,
              'B41C2_scorer_changed': False,
              'production_model_deployed': False,
              'production_change_authorized': False,
              'next_stage': 'Wait for B41C3 untouched Week 4 scorer confirmation. If and only if B41C3 passes, run a separately frozen one-shot evaluator that opens 2025 exactly once under this B41G protocol.',
          }
          (base / 'player_role_v2_b41g_freeze_decision.json').write_text(
              json.dumps(decision, indent=2, sort_keys=True) + '\n'
          )

          lines = [
              '# Player Role V2 — B41G Pre-Holdout Freeze', '',
              '- Result: **PASS_2025_HOLDOUT_PROTOCOL_AND_BASELINE_FROZEN**',
              '- 2025 holdout opened: **No**',
              '- B41C3 pass required before 2025 may be read: **Yes**',
              '- B41F model changed: **No**',
              '- B41E thresholds changed: **No**',
              '- Production deployed: **No**', '',
              '## Frozen best-single-signal baseline', '',
              '| Position | Selected signal | Development LOSO MAE |',
              '|---|---|---:|',
          ]
          for pos in positions:
              r = b['position_baselines'][pos]
              lines.append(f"| {pos} | `{r['selected_feature']}` | {r['mean_loso_mae']:.6f} |")
          lines += ['', 'No 2025 data were used to choose any baseline feature or pass criterion.', '']
          (base / 'player_role_v2_b41g_freeze_report.md').write_text('\n'.join(lines))
          PY

      - name: Commit final B41G baseline freeze
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$BASE/player_role_v2_b41g_baseline_snapshot.json" \
            "$BASE/player_role_v2_b41g_freeze_decision.json" \
            "$BASE/player_role_v2_b41g_freeze_report.md"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "B41G baseline already committed identically"
          else
            git commit -m "Freeze Player Role V2 B41G holdout baseline"
            git push origin HEAD:main
          fi

      - name: B41G closeout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('research/player-role-v2')
          p = json.loads((base / 'player_role_v2_b41g_holdout_validation_preregistration.json').read_text())
          b = json.loads((base / 'player_role_v2_b41g_baseline_snapshot.json').read_text())
          d = json.loads((base / 'player_role_v2_b41g_freeze_decision.json').read_text())

          assert p['status'] == 'PREREGISTERED_BEFORE_ANY_2025_HOLDOUT_ACCESS'
          assert b['status'] == 'BASELINE_FROZEN_BEFORE_2025_HOLDOUT_OPEN'
          assert d['result'] == 'PASS_2025_HOLDOUT_PROTOCOL_AND_BASELINE_FROZEN'
          assert d['2025_holdout_opened'] is False
          assert d['B41C3_pass_required_before_holdout_open'] is True
          assert d['production_model_deployed'] is False
          assert d['production_change_authorized'] is False
          print('B41G CLOSEOUT: PASS_2025_HOLDOUT_PROTOCOL_AND_BASELINE_FROZEN')
          print('2025 HOLDOUT OPENED: false')
          print('B41C3 PASS REQUIRED BEFORE HOLDOUT: true')
          print('PRODUCTION DEPLOYED: false')
          print('PRODUCTION CHANGE AUTHORIZED: false')
          print('NEXT: wait for B41C3; do not open 2025 yet')
          PY
