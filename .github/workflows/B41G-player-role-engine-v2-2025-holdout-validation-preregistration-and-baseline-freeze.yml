name: B41G Player Role Engine V2 - 2025 Holdout Validation Preregistration and Baseline Freeze

'on':
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  freeze_holdout_protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify frozen parents and confirm 2025 is still sealed
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          base = Path('research/player-role-v2')

          expected_blobs = {
              'player_role_v2_b41a_scientific_preregistration.json': '22f465253982b4e5a923327153bf9861ff3e76ec',
              'player_role_v2_b41a_source_feasibility.json': 'c97b36b158b9ca8ac9f30bd3673ce6e3011fceed',
              'player_role_v2_b41b_cohort_manifest.json': '03fc341d055358d0158f923d7d75e5c4e2f41478',
              'player_role_v2_b41c_model_development_preregistration.json': '669eb6ed92c6309029979bbfdf336d74885e6919',
              'player_role_v2_b41c_league_scoring_snapshot.json': '8e350fc927417d2f8afceb5b42545e48e3622fff',
              'player_role_v2_b41c2_target_scorer.py': '9b5ba8edd4430bd62b713be71e03fda3d39cab96',
              'player_role_v2_b41d_development_contract.json': 'fba6dd0c63e48e076c447d1c11841cfaedd0f688',
              'player_role_v2_b41d_identity_audit.json': '32aca01e50368a25a7cfe5e4c04a6aaf7fe64b93',
              'player_role_v2_b41d_scientific_decision.json': '87bdc7e0b4d3e6878ded90221ae1fb4368e48034',
              'player_role_v2_b41e_tier_derivation_contract.json': 'c1961f0006813b346f2a59838152206e064b39dc',
              'player_role_v2_b41e_tier_thresholds.json': '4542575da6e258d9bd881fbe0497c9f6c0133a45',
              'player_role_v2_b41f_final_fit_contract.json': '745437b301d1c64f2e1add66ce364bd0d8129d26',
              'player_role_v2_b41f_final_model_snapshot.json': 'd1ac822c29bfe31e9e1a9418b443ef1124b42413',
          }

          for name, expected in expected_blobs.items():
              path = base / name
              if not path.exists():
                  raise RuntimeError(f'B41G_PARENT_MISSING {name}')
              actual = subprocess.check_output(
                  ['git', 'rev-parse', f'HEAD:{path.as_posix()}'], text=True
              ).strip()
              if actual != expected:
                  raise RuntimeError(
                      f'B41G_PARENT_GIT_BLOB_DRIFT {name} expected={expected} actual={actual}'
                  )

          a = json.loads((base / 'player_role_v2_b41a_scientific_preregistration.json').read_text())
          src = json.loads((base / 'player_role_v2_b41a_source_feasibility.json').read_text())
          c = json.loads((base / 'player_role_v2_b41c_model_development_preregistration.json').read_text())
          c2 = json.loads((base / 'player_role_v2_b41c2_scorer_recovery_preregistration.json').read_text())
          d = json.loads((base / 'player_role_v2_b41d_scientific_decision.json').read_text())
          ident = json.loads((base / 'player_role_v2_b41d_identity_audit.json').read_text())
          e = json.loads((base / 'player_role_v2_b41e_tier_thresholds.json').read_text())
          f = json.loads((base / 'player_role_v2_b41f_final_model_snapshot.json').read_text())
          fc = json.loads((base / 'player_role_v2_b41f_final_fit_contract.json').read_text())

          assert a['population']['untouched_holdout_season'] == 2025
          assert a['model_development_plan']['no_2025_holdout_access_during_selection'] is True
          assert a['tier_derivation_plan']['thresholds_frozen_before_2025_holdout'] is True
          assert c['holdout_policy']['season'] == 2025 and c['holdout_policy']['opened_in_b41c'] is False
          assert d['2025_holdout_opened'] is False
          assert e['2025_holdout_opened'] is False
          assert f['2025_holdout_opened'] is False
          assert f['week4_2026_opened'] is False
          assert f['B41C3_completed'] is False
          assert f['production_model_fitted'] is True
          assert f['production_model_deployed'] is False
          assert f['production_change_authorized'] is False
          assert fc['sequencing']['B41C3_required_before_2025_holdout_open'] is True

          expected_scorer_sha = 'cbc8548eb0dac7d6f8a95717925487e746605627f674c0a04637771c21e54e6b'
          scorer_sha = hashlib.sha256((base / 'player_role_v2_b41c2_target_scorer.py').read_bytes()).hexdigest()
          assert scorer_sha == expected_scorer_sha == c2['frozen_b41c2_scorer_sha256']

          stats25 = src['sources']['nflverse_weekly_player_stats']['seasons']['2025']
          snaps25 = src['sources']['nflverse_snap_counts']['seasons']['2025']
          assert stats25['sha256'] == 'e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2'
          assert snaps25['sha256'] == '3fc2deb0e9ad86d34d4578cb80bb21c95253e088ee22ca028adf46f7485eff1f'
          assert ident['crosswalk_commit'] == 'b2a5e872b343fc36f819936ba6e0576e80519897'
          assert ident['crosswalk_sha256'] == 'de241875e4ae91d43bbc7fbff682521da2abc9535028f952a35cb3305106c0a5'

          forbidden = [
              'player_role_v2_b41g_2025_holdout_results.json',
              'player_role_v2_b41g_2025_holdout_rows.csv.gz',
              'player_role_v2_b41g_2025_holdout_decision.json',
              'player_role_v2_b41g_2025_holdout_report.md',
              'player_role_v2_b41h_2025_holdout_results.json',
              'player_role_v2_b41h_2025_holdout_rows.csv.gz',
              'player_role_v2_b41h_2025_holdout_decision.json',
              'player_role_v2_b41h_2025_holdout_report.md',
          ]
          for name in forbidden:
              if (base / name).exists():
                  raise RuntimeError(f'B41G_HOLDOUT_ALREADY_OPENED_OR_RECORDED {name}')

          print('PASS: all frozen parent blobs are exact.')
          print('PASS: B41F is fitted but undeployed; 2025 remains sealed.')
          print('PASS: 2025 source metadata only is pinned; no 2025 data were read.')
          PY

      - name: Freeze exact B41G baseline freezer implementation
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          cat > "$BASE/player_role_v2_b41g_baseline_freezer.py" <<'PYBASE'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import mean_absolute_error

          SEASONS = [2019, 2020, 2021, 2022, 2023, 2024]
          POSITIONS = ["QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"]

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def usable(train, feature):
              x = pd.to_numeric(train[feature], errors='coerce')
              finite = x[np.isfinite(x)]
              return len(finite) >= 2 and finite.nunique() >= 2

          def select_baseline(sub, features):
              candidates = []
              for feature in sorted(features):
                  folds = []
                  eligible = True
                  for season in SEASONS:
                      tr = sub[sub['season'] != season]
                      va = sub[sub['season'] == season]
                      if not usable(tr, feature):
                          eligible = False
                          break
                      tr_x = pd.to_numeric(tr[feature], errors='coerce').astype(float)
                      va_x = pd.to_numeric(va[feature], errors='coerce').astype(float)
                      med = float(tr_x.median(skipna=True)) if tr_x.notna().any() else 0.5
                      pred = np.clip(va_x.fillna(med).to_numpy(float), 0.0, 1.0)
                      y = va['target_percentile'].to_numpy(float)
                      folds.append({
                          'validation_season': int(season),
                          'n': int(len(va)),
                          'mae': float(mean_absolute_error(y, pred)),
                          'training_median': med,
                      })
                  if eligible and folds:
                      candidates.append({
                          'feature': feature,
                          'mean_loso_mae': float(np.mean([r['mae'] for r in folds])),
                          'folds': folds,
                      })
              if not candidates:
                  raise RuntimeError('B41G_NO_ELIGIBLE_BASELINE_FEATURE')
              candidates.sort(key=lambda r: (r['mean_loso_mae'], r['feature']))
              winner = candidates[0]
              x = pd.to_numeric(sub[winner['feature']], errors='coerce').astype(float)
              full_median = float(x.median(skipna=True)) if x.notna().any() else 0.5
              return winner, full_median, candidates

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--data', required=True)
              ap.add_argument('--development-contract', required=True)
              ap.add_argument('--b41d-decision', required=True)
              ap.add_argument('--b41f-snapshot', required=True)
              ap.add_argument('--prereg', required=True)
              ap.add_argument('--out', required=True)
              a = ap.parse_args()

              contract = json.loads(Path(a.development_contract).read_text())
              decision = json.loads(Path(a.b41d_decision).read_text())
              final = json.loads(Path(a.b41f_snapshot).read_text())
              prereg = json.loads(Path(a.prereg).read_text())

              if sha(a.data) != prereg['frozen_inputs']['development_modeling_data_sha256']:
                  raise RuntimeError('B41G_MODELING_DATA_SHA_MISMATCH')
              if final['2025_holdout_opened'] or final['week4_2026_opened']:
                  raise RuntimeError('B41G_FIREWALL_BROKEN')
              if final['production_model_deployed'] or final['production_change_authorized']:
                  raise RuntimeError('B41G_PRODUCTION_ALREADY_CHANGED')

              df = pd.read_csv(a.data, compression='gzip')
              if len(df) != 85648:
                  raise RuntimeError(f'B41G_MODELING_ROW_COUNT {len(df)}')
              if sorted(df['season'].astype(int).unique()) != SEASONS:
                  raise RuntimeError('B41G_DEVELOPMENT_SEASONS_DRIFT')
              if 2025 in set(df['season'].astype(int)):
                  raise RuntimeError('B41G_2025_LEAK_IN_DEVELOPMENT_ARTIFACT')

              out = {}
              for pos in POSITIONS:
                  sub = df[df['position'] == pos].copy()
                  features = list(contract['position_feature_columns'][pos])
                  if decision['selected_family_by_position'][pos] != 'nonnegative_ridge_linear':
                      raise RuntimeError(f'B41G_SELECTED_FAMILY_DRIFT {pos}')
                  if final['position_models'][pos]['selected_family'] != 'nonnegative_ridge_linear':
                      raise RuntimeError(f'B41G_FINAL_FAMILY_DRIFT {pos}')
                  winner, median, candidates = select_baseline(sub, features)
                  out[pos] = {
                      'selected_feature': winner['feature'],
                      'selection_rule': 'lowest six-season LOSO mean MAE; lexicographic feature name wins exact tie',
                      'mean_loso_mae': winner['mean_loso_mae'],
                      'folds': winner['folds'],
                      'full_development_imputation_median': median,
                      'holdout_prediction_rule': 'clip(imputed selected normalized feature, 0, 1)',
                      'candidate_results_sorted': candidates,
                      'n_development_rows': int(len(sub)),
                  }

              snapshot = {
                  'schema_version': 1,
                  'study_id': 'player-role-v2',
                  'phase': 'B41G-best-single-signal-baseline-freeze',
                  'status': 'BASELINE_FROZEN_BEFORE_2025_HOLDOUT_OPEN',
                  'development_seasons': SEASONS,
                  'development_modeling_data_sha256': sha(a.data),
                  'development_modeling_row_count': int(len(df)),
                  'position_baselines': out,
                  '2025_holdout_opened': False,
                  '2026_week4_opened_by_b41g': False,
                  'model_or_tier_retuning_performed': False,
                  'production_model_deployed': False,
                  'production_change_authorized': False,
              }
              Path(a.out).write_text(json.dumps(snapshot, indent=2, sort_keys=True) + '\n')

          if __name__ == '__main__':
              main()
          PYBASE

          chmod +x "$BASE/player_role_v2_b41g_baseline_freezer.py"

      - name: Freeze exact one-shot 2025 holdout protocol before holdout access
