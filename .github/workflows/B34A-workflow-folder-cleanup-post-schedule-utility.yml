name: B34A Workflow Folder Cleanup - Post Schedule Utility Preregistration
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SELF_WORKFLOW: B34A-workflow-folder-cleanup-post-schedule-utility.yml
  ARCHIVE_TARGETS_JSON: '["B17C-V3-workflow-cleanup.yml","B17D-V2-technical-recovery.yml","B17D-source-only-expansion-regime-firewall.yml","B17E-2013-joint-feasibility-admission.yml","B17V2-FIXED.yml","B18-exploratory-product-validation-power.yml","B24-Schedule-Utility-V1-Phase-1C.yml","B25-Schedule-Utility-V1-Phase-1D.yml","B26-Schedule-Utility-V1-Phase-1E-A-V2.yml","B26-Schedule-Utility-V1-Phase-1E-A-V3.yml","B26-Schedule-Utility-V1-Phase-1E-A.yml","B27-Schedule-Utility-V1-Phase-1E-B.yml","B28-Schedule-Utility-V1-Phase-2A.yml","B29-Schedule-Utility-V1-Phase-2A1-Amendment.yml","B30-Schedule-Utility-V1-Phase-2B-Preflight-V2.yml","B30-Schedule-Utility-V1-Phase-2B-Preflight.yml","B31-Schedule-Utility-V1-Phase-2B-Evaluation.yml","B31-V2-Schedule-Utility-V1-Phase-2B-Evaluation.yml","B31A-Schedule-Utility-V1-Source-Drift-Audit.yml","B32-Schedule-Utility-V1-Quantitative-STOP-Ordinal-Shadow-Disposition.yml","B32A-Schedule-Utility-V1-Post-Run-Zero-Fill-Validity-Audit.yml","B32A-V2-Schedule-Utility-V1-Post-Run-Zero-Fill-Validity-Audit.yml","B32C-Schedule-Utility-V1-Historical-Ordinal-Development-Diagnostic.yml","B33-Schedule-Utility-V1-Ordinal-Prospective-Shadow-Preregistration.yml","b18.yml","b19-package-adjustment-v1-7-ui-clarity-deploy-v2.yml","b19-package-adjustment-v1-7-ui-clarity-deploy.yml","b19.yml","b20-trade-robustness-v1-current-production-revalidation-v2.yml","b20-trade-robustness-v1-current-production-revalidation-v3.yml","b20-trade-robustness-v1-current-production-revalidation.yml","b20.yml","b21-schedule-utility-v1-phase0-preregistration-source-contract.yml","b21.yml","b22-schedule-utility-v1-phase1a-private-source-ingestion-feasibility.yml","b22.yml","b23-schedule-utility-v1-phase1b-coverage-freshness-dependence-audit.yml","b23-v2-schedule-utility-v1-phase1b-coverage-freshness-dependence-audit.yml","b23.yml","b24.yml","b25.yml","b26.yml","b27.yml","b28.yml","b29.yml","b29_fixed.yml","b29c.yml","b29d.yml","b29e-draft-capital-outlook-v3-terminal-closure-neutral-freeze-v2.yml","b29e-draft-capital-outlook-v3-terminal-closure-neutral-freeze.yml","b3-package-v8-slot6-recovery-final-v4.yml","b3-package-v8-slot6-recovery-patch-v3.yml","b3-package-v8-slot6-recovery-patch.yml","b4-package-v8-slot6-collector-field-repair-v1.yml","b5-package-v8-brave-no-cors-transport-repair-v1.yml","B34A-workflow-folder-cleanup-post-schedule-utility.yml"]'
  PROTECTED_WORKFLOWS_JSON: '["B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml","B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml","age-curve-v2-phase5.yml","cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml","durability-v2-phase5.yml","fantasypros-api-pipeline.yml","free-agent-utility-v1-refresh.yml","idp-dl-lb-phase2.yml","ktc-vote-aggregation.yml","ktc_voter_balance_prospective.yml","market-edge-v1-prospective-study.yml","no-history-rookie-v2-phase3.yml","opportunity-v2-phase5.yml","package-adjustment-audit-step4-exact-live-oos.yml","position-weight-v2-phase5.yml","prospective-trade-evidence-capture.yml","replacement-level-v2-phase5.yml","repo-regression-checks.yml","research-program-status-v1-current-state-audit.yml","scheduled-data-refresh.yml","sync-sleeper.yml"]'
jobs:
  cleanup:
    name: Archive completed workflows and preserve active surface
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture starting main
      id: base
      shell: bash
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install cleanup dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir   "PyYAML==6.0.2"   "requests>=2.32,<3"
    - name: Guard exact pre-cleanup workflow inventory
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        from pathlib import Path

        workflow_dir = Path(".github/workflows")
        archive_targets = set(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
        protected = set(json.loads(os.environ["PROTECTED_WORKFLOWS_JSON"]))

        current = {
            p.name for p in workflow_dir.iterdir()
            if p.is_file() and p.suffix in {".yml", ".yaml"}
        }
        expected = archive_targets | protected

        if current != expected:
            raise SystemExit(
                "Workflow inventory changed from frozen B34A cleanup plan.\n"
                f"Missing: {sorted(expected-current)}\n"
                f"Unexpected: {sorted(current-expected)}"
            )

        assert len(current) == 77, len(current)
        assert len(archive_targets) == 56, len(archive_targets)
        assert len(protected) == 21, len(protected)
        assert os.environ["SELF_WORKFLOW"] in archive_targets
        assert "B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml" in protected
        assert "B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml" in protected
        assert "idp-dl-lb-phase2.yml" in protected
        assert "scheduled-data-refresh.yml" in protected
        assert "sync-sleeper.yml" in protected

        print("PASS: exact pre-cleanup inventory = 77 workflows.")
        print("PASS: 56 completed/superseded workflows will be archived.")
        print("PASS: 21 active/recurring workflows will remain.")
        PY
    - name: Guard active scientific and operational handoffs
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path

        W = Path(".github/workflows")
        R = Path("research/schedule-utility-v1")

        b33 = json.loads(
            (R / "schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.json")
            .read_text(encoding="utf-8")
        )
        assert b33["status"] == "PREREGISTERED_ORDINAL_PROSPECTIVE_SHADOW"
        assert b33["governance"]["user_facing_production_authorized"] is False
        assert b33["next_stage"]["name"] == "B34 weekly prospective snapshot freezer"

        required = [
            "B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml",
            "B2-package-adjustment-v8-outcome-blind-maturity-monitor-v2.yml",
            "idp-dl-lb-phase2.yml",
            "scheduled-data-refresh.yml",
            "sync-sleeper.yml",
            "fantasypros-api-pipeline.yml",
            "free-agent-utility-v1-refresh.yml",
            "repo-regression-checks.yml",
        ]
        for name in required:
            assert (W / name).is_file(), name

        print("PASS: Schedule Utility prospective handoff preserved.")
        print("PASS: Package V8 monitor preserved.")
        print("PASS: IDP Week 4 path preserved.")
        print("PASS: production data/maintenance workflows preserved.")
        PY
    - name: Pre-cleanup repository regression proof
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/repo_regression_checks.py
    - name: Archive completed and superseded workflows
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json, os, shutil
        from datetime import datetime, timezone
        from pathlib import Path

        workflow_dir = Path(".github/workflows")
        archive_dir = Path(".github/workflow-archive/completed-research")
        archive_dir.mkdir(parents=True, exist_ok=True)
        targets = sorted(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
        moved = []

        def sha256(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()

        for name in targets:
            src = workflow_dir / name
            dst = archive_dir / name

            if not src.is_file():
                raise SystemExit(f"Archive target missing: {src}")

            before = sha256(src)

            if dst.exists():
                existing = sha256(dst)
                if existing != before:
                    raise SystemExit(
                        f"Archive collision with different bytes: {dst}\n"
                        f"source_sha256={before}\narchive_sha256={existing}"
                    )
                src.unlink()
                action = "source_removed_existing_identical_archive"
            else:
                shutil.move(str(src), str(dst))
                after = sha256(dst)
                if after != before:
                    raise SystemExit(
                        f"Byte identity failure moving {name}: {before} != {after}"
                    )
                action = "moved_to_archive"

            moved.append({
                "filename": name,
                "sha256": before,
                "action": action,
                "archive_path": str(dst),
            })

        batch = {
            "schema_version": 1,
            "batch_id": "2026-10-02-b34a-post-schedule-utility-cleanup",
            "created_utc": datetime.now(timezone.utc).isoformat(),
            "pre_cleanup_active_count": 77,
            "archive_count": len(moved),
            "post_cleanup_active_count": 21,
            "self_archived": os.environ["SELF_WORKFLOW"],
            "protected_active_workflows": sorted(
                json.loads(os.environ["PROTECTED_WORKFLOWS_JSON"])
            ),
            "reason": (
                "Archive completed/superseded Draft Capital, Trade Robustness, "
                "Package repair, and Schedule Utility research workflows while "
                "preserving all recurring/prospective/maintenance workflows."
            ),
            "entries": moved,
        }
        manifest = archive_dir / "cleanup_batch_2026-10-02_b34a.json"
        manifest.write_text(
            json.dumps(batch, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        assert len(moved) == 56
        print("PASS: archived 56 byte-identical workflow files.")
        print(f"PASS: cleanup manifest written: {manifest}")
        PY
    - name: Validate final active workflow surface
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        import yaml

        workflow_dir = Path(".github/workflows")
        archive_dir = Path(".github/workflow-archive/completed-research")
        protected = set(json.loads(os.environ["PROTECTED_WORKFLOWS_JSON"]))

        active = {
            p.name for p in workflow_dir.iterdir()
            if p.is_file() and p.suffix in {".yml", ".yaml"}
        }
        assert active == protected, (
            f"Unexpected active: {sorted(active-protected)}",
            f"Missing protected: {sorted(protected-active)}",
        )
        assert len(active) == 21

        for name in sorted(active):
            p = workflow_dir / name
            doc = yaml.safe_load(p.read_text(encoding="utf-8"))
            assert isinstance(doc, dict), name
            assert "jobs" in doc and isinstance(doc["jobs"], dict) and doc["jobs"], name

        assert not (workflow_dir / os.environ["SELF_WORKFLOW"]).exists()
        assert (archive_dir / os.environ["SELF_WORKFLOW"]).is_file()
        assert (archive_dir / "B17V2-FIXED.yml").is_file()
        assert (archive_dir / "B33-Schedule-Utility-V1-Ordinal-Prospective-Shadow-Preregistration.yml").is_file()
        assert (workflow_dir / "B34-Schedule-Utility-V1-Week-5-Prospective-Snapshot-Freezer.yml").is_file()

        print("PASS: final active workflow inventory = 21.")
        print("PASS: cleanup workflow archived itself.")
        print("PASS: all remaining active YAML files parse and contain jobs.")
        PY
    - name: Post-cleanup repository regression proof
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/repo_regression_checks.py
    - name: Prove cleanup-only mutation scope
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import subprocess

        raw = subprocess.check_output(
            ["git", "status", "--porcelain=v1", "--untracked-files=all"],
            text=True,
        )
        touched = [line[3:] for line in raw.splitlines() if line.strip()]
        assert touched, touched
        assert all(
            p.startswith(".github/workflows/")
            or p.startswith(".github/workflow-archive/completed-research/")
            for p in touched
        ), touched
        assert not any(
            p == "index.html"
            or p == "free-agent-board.html"
            or p.startswith(("data/", "model/", "scripts/", "research/"))
            for p in touched
        ), touched

        print("PASS: mutation scope is workflow/archive only.")
        PY
    - name: Commit workflow cleanup
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |
        set -euo pipefail

        git fetch origin main
        test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
          echo "ERROR: origin/main moved during cleanup; refusing non-atomic push."
          exit 1
        }

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add .github/workflows .github/workflow-archive/completed-research
        git diff --cached --check
        git commit -m "Archive completed workflows after Schedule Utility preregistration"
        git push origin HEAD:main

        git fetch origin main
        test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"

        echo "PASS: workflow cleanup committed atomically."
    - name: Closeout
      shell: bash
      run: |
        set -euo pipefail
        echo "=== B34A WORKFLOW CLEANUP COMPLETE ==="
        echo "Active workflows before upload: 76"
        echo "Cleanup workflow added: 1"
        echo "Archived in this run: 56"
        echo "Active workflows remaining: 21"
        echo "Completed workflow history preserved under .github/workflow-archive/completed-research/"
