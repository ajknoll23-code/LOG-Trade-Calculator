name: B6 Package Adjustment V9 - Topology-Specific Discordance Information-Limit Audit

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b6-discordance-information-limit
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6_ANALYSIS_VERSION: "package-adjustment-v9-b6-discordance-information-limit-v1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" "scipy==1.16.2"

      - name: Guard exact scientific lineage and live comparator semantics
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_nuisance_estimation.json"]="cefd3a8c8a1a9beeeb8344ad3e81b224bb972d2e"
            ["research/package-adjustment-v9/b5c-calibration-diagnostics/b5c_joint_nuisance_draws.json"]="8c2422b9dd37bd84a2bfed2994d024236bd4e4a1"
            ["research/package-adjustment-v9/b5e-post-stop-feasibility-forks/b5e_post_stop_feasibility_forks.json"]="98b69093fff3f1babd1065fd0119a7cd85a60598"
            ["research/package-adjustment-v9/b5e-post-stop-feasibility-forks/b5e_preregistered_fork_protocol.json"]="efb9034f08402ebaa460d6159c2a20d32aef7f5b"
            ["research/package-adjustment-v9/b5e-post-stop-feasibility-forks/b5e_report.md"]="52489935c00d0068ca0d877f9af170ad5696e56b"
            ["research/package-adjustment-v9/b5e-post-stop-feasibility-forks/b5e_screen_manifest.json"]="c22698810ff0966edac61e8a8aa724c76e82f3d3"
            ["research/package-adjustment-v6/production_candidate_v1.json"]="9abaf2c01890da3abb0d13ae4d57cb37b91a08e"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: durable source drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          # Current V1.7 must still pass its permanent regression suite.
          python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY1'
          import json,re
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          b5a=load('research/package-adjustment-v9/b5a-design-sizing/b5a_nuisance_estimation.json')
          b5e=load('research/package-adjustment-v9/b5e-post-stop-feasibility-forks/b5e_screen_manifest.json')
          v6=load('research/package-adjustment-v6/production_candidate_v1.json')
          cat=load('research/package-adjustment-v8/development_catalog_v1.json')
          assert b5a['status']=='PASS_NUISANCE_ESTIMATION_ONLY'
          assert b5e['decision']=='STOP_NO_TESTED_POST_STOP_FORK_RESTORES_FEASIBILITY'
          assert b5e['production_change_authorized'] is False
          assert b5e['v9_outcomes_exist_or_were_read'] is False
          assert v6['frozen'] is True
          assert abs(float(v6['frozen_c2']['q'])-2.9897594788655337)<1e-15
          assert cat['candidate_predictions_used_for_catalog_selection'] is False
          assert cat['candidate_scores_used_for_catalog_selection'] is False
          assert int(cat['challenge_count'])==40

          text=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r"if\s*\(\s*diffPct\s*<\s*(0\.\d+)\s*\)\s*\{\s*return\s*\{label:'fair'", text)
          assert m, 'could not extract live fair-band rule'
          fair=float(m.group(1))
          assert abs(fair-0.07)<1e-12, fair

          livecheck=Path('scripts/validation/check_package_adjustment_live.py').read_text()
          assert "check(r.status==='unsupported','multi-v-multi')" in livecheck
          print('PASS: B5E STOP, V6 q, source-only catalog, V1.7 live validation, multi-v-multi fail-closed semantics, and 7% fair band are exact.')
          PY1

      - name: Run preregistered B6 information-limit audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b6
          mkdir -p /tmp/package-adjustment-v9-b6

          cat > /tmp/package-adjustment-v9-b6/analyze_b6.py <<'PY2'
          from __future__ import annotations
          import hashlib,json,math,os,re
          from collections import Counter,defaultdict
          from pathlib import Path

          import numpy as np
          from numpy.polynomial.hermite import hermgauss
          from scipy.special import expit
          from scipy.stats import beta as beta_dist
          from scipy.stats import t as student_t

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b6')
          VERSION=os.environ['B6_ANALYSIS_VERSION']
          SEED=2026100506
          RNG=np.random.default_rng(SEED)

          TOPO=['2v2','2v3','2v4','3v3','3v4','4v4']
          COUNTS={'2v2':(2,2),'2v3':(2,3),'2v4':(2,4),'3v3':(3,3),'3v4':(3,4),'4v4':(4,4)}
          Q=2.9897594788655337
          THETA_MIN=0.60
          FWER_ALPHA=0.05
          FAIR_BAND=0.07
          WORKLOAD=24
          BALLOTS_PER_TOPO_PER_VOTER=4
          DESIGN_VOTERS=[18,24,30,36,42,48,54,60,72,90,120]
          SCREEN_REPS=500
          DIAGNOSTIC_REPS=500
          GENERATOR_TRIALS_PER_TOPO=120000

          # -----------------------------------------------------------------
          # Frozen BEFORE any B6 feasibility number is computed.
          # Candidate is scale-coherent and inherits q from pre-V8 V6 only.
          # theta_min=0.60 is a product-meaning threshold: V9 must win at
          # least 3 of every 5 discordant manager judgments to justify
          # changing the production verdict in that topology.
          # -----------------------------------------------------------------
          CANDIDATE_FREEZE={
            'analysis_version':VERSION,
            'status':'FROZEN_BEFORE_B6_SIMULATION',
            'candidate_id':'V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q',
            'formula':'S(side)=n**(1-1/q) * (sum(v_i**q))**(1/q)',
            'q':Q,
            'q_source':'research/package-adjustment-v6/production_candidate_v1.json; frozen before V8',
            'free_parameters':0,
            'scale_coherent':True,
            'equal_piece_identity':'for equal-valued pieces, S(side)==raw sum(side)',
            'primary_estimand':'theta_t = P(manager chooses V9 verdict | V9 and V1.7 give opposite non-fair verdicts, topology t)',
            'theta_min':THETA_MIN,
            'theta_min_reason':'A 60% win rate on true verdict disagreements is the minimum product-relevant edge chosen before B6 feasibility.',
            'comparator':'current production Package Adjustment V1.7; for 2v2/2v3/2v4/3v3/3v4/4v4 it fails closed and trade verdict totals remain raw FV sums',
            'fair_band_relative_difference':FAIR_BAND,
            'discordance_definition':'opposite V9 vs V1.7 favored sides and each model is outside the frozen 7% fair band',
            'eligible_topologies':TOPO,
            'deployment_semantics':'topology-specific router; a topology uses V9 only if it independently activates; otherwise it remains on V1.7',
            'familywise_harmful_activation_alpha':FWER_ALPHA,
            'multiplicity_procedure':'Holm step-down over six topology-specific one-sided tests',
            'v8_candidate_performance_used_to_choose_formula':False,
            'production_change_authorized':False,
          }
          (OUT/'b6_candidate_and_estimand_freeze.json').write_text(json.dumps(CANDIDATE_FREEZE,indent=2,sort_keys=True)+'\n')

          PROTOCOL={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B6_INFORMATION_LIMIT_AUDIT_ONLY',
            'seed':SEED,
            'purpose':'Determine whether topology-specific activation on fresh discordant challenges can restore a feasible V9 validation design without lowering the 5% familywise harmful-activation standard.',
            'design':{
              'voters':DESIGN_VOTERS,
              'ballots_per_voter':WORKLOAD,
              'ballots_per_topology_per_voter':BALLOTS_PER_TOPO_PER_VOTER,
              'votes_per_challenge':1,
              'unique_challenges_only':True,
              'left_right':'within each voter x topology: exactly two V9-left and two V9-right ballots',
              'preferred_total_ballot_ceiling':1440,
              'conditional_total_ballot_ceiling':2880,
            },
            'activation_rule':{
              'estimator':'direct linear-probability intercept with centered left/right covariate; CR1 voter-cluster robust SE',
              'null':'theta_t <= 0.5',
              'one_sided_raw_p_values':True,
              'multiplicity':'Holm across all six eligible topologies',
              'familywise_alpha':FWER_ALPHA,
              'additional_point_requirement':'theta_hat_t >= 0.60',
              'activation':'Holm rejects AND theta_hat_t >= theta_min',
              'log_loss':'preregistered secondary only; not used for B6 activation sizing',
            },
            'primary_scenarios':{
              'all_good_0p60':[0.60]*6,
              'global_null_0p50':[0.50]*6,
              'one_harmful_0p49':'rotate one theta=0.49 through all six positions; remaining theta=0.60',
              'two_harmful_0p49':'cycle pairs of theta=0.49; remaining theta=0.60',
            },
            'secondary_red_team_scenarios':{
              'candidate_worse_everywhere_0p45':[0.45]*6,
              'one_harmful_0p45':'rotate one theta=0.45; remaining theta=0.60',
              'one_harmful_0p40':'rotate one theta=0.40; remaining theta=0.60',
              'small_benefit_0p55':[0.55]*6,
              'heterogeneous_safe':[0.56,0.58,0.60,0.62,0.64,0.66],
              'asymmetric_only':[0.50,0.60,0.60,0.50,0.60,0.50],
            },
            'nuisance_assurance':'sample the exact 500 B5C crossed-bootstrap nuisance draws; B5A nuisance estimates are separately guarded. This avoids simultaneous p90+p90 stress as the only sizing basis.',
            'primary_pass':{
              'familywise_harmful_activation_one_sided_95_upper_bound_max':0.05,
              'probability_at_least_one_true_good_topology_activated_min':0.80,
              'preferred_total_ballots_max':1440,
            },
            'conditional':'same OC targets but 1441-2880 total ballots',
            'stop':'no design <=2880 ballots clears the OC targets',
            'generator_audit':{
              'planning_source':'candidate-blind pre-vote V8 development catalog is used only as a player/FV source pool; no V8 outcomes or candidate scores are read',
              'realism_filters':{'minimum_asset_fv':2500,'minimum_side_apex_fv':4000,'raw_sum_ratio_min_over_max_min':0.75},
              'trials_per_topology':GENERATOR_TRIALS_PER_TOPO,
              'future_human_catalog_generated':False,
            },
            'screen_replicates_per_design':SCREEN_REPS,
            'candidate_formula_frozen_before_simulation':True,
            'theta_min_frozen_before_simulation':True,
            'v9_human_outcomes_exist_or_were_read':False,
            'production_v1_7_predictions_on_v8_votes_used':False,
            'v8_candidate_performance_used':False,
            'production_change_authorized':False,
          }
          (OUT/'b6_preregistered_protocol.json').write_text(json.dumps(PROTOCOL,indent=2,sort_keys=True)+'\n')

          # Load only permitted planning sources.
          b5a=json.loads((ROOT/'research/package-adjustment-v9/b5a-design-sizing/b5a_nuisance_estimation.json').read_text())
          b5c_draws=json.loads((ROOT/'research/package-adjustment-v9/b5c-calibration-diagnostics/b5c_joint_nuisance_draws.json').read_text())
          b5e=json.loads((ROOT/'research/package-adjustment-v9/b5e-post-stop-feasibility-forks/b5e_screen_manifest.json').read_text())
          cat=json.loads((ROOT/'research/package-adjustment-v8/development_catalog_v1.json').read_text())
          v6=json.loads((ROOT/'research/package-adjustment-v6/production_candidate_v1.json').read_text())
          assert b5a['status']=='PASS_NUISANCE_ESTIMATION_ONLY'
          assert b5e['decision']=='STOP_NO_TESTED_POST_STOP_FORK_RESTORES_FEASIBILITY'
          assert abs(float(v6['frozen_c2']['q'])-Q)<1e-15
          draws=np.asarray([[float(d['sigma_challenge']),float(d['sigma_voter']),float(d['delta_left'])] for d in b5c_draws['draws']],float)
          assert draws.shape==(500,3)
          assert np.all(draws[:,:2]>0)

          # ---------- mathematical self-tests ----------
          def v9_score(vals):
            vals=np.asarray(vals,float); n=len(vals)
            assert n>=2 and np.all(vals>0)
            return float((n**(1.0-1.0/Q))*(np.sum(vals**Q)**(1.0/Q)))
          for n in (2,3,4):
            vals=np.full(n,4000.0)
            assert abs(v9_score(vals)-float(vals.sum()))<1e-8
          assert v9_score([6000,2500]) > 8500.0

          def verdict(a,b):
            a=float(a);b=float(b)
            diff=a-b; pct=abs(diff)/max(a,b,1.0)
            if pct < FAIR_BAND: return 0,pct
            return (1 if diff>0 else -1),pct

          # ---------- source-only discordance generator audit ----------
          pool={}
          for ch in cat['challenges']:
            for side in ('side_A','side_B'):
              for a in ch[side]['assets']:
                if float(a['fv'])>=2500:
                  pool[a['key']]={'key':a['key'],'fv':float(a['fv']),'pos':a.get('pos'),'team':a.get('team')}
          pool=list(pool.values())
          assert len(pool)>=120
          fvs=np.asarray([p['fv'] for p in pool],float)

          gen_rng=np.random.default_rng(SEED+101)
          generator_rows=[]
          for topo in TOPO:
            na,nb=COUNTS[topo]
            realistic=0; discord=0
            strength=Counter(); raw_attempts=0
            # Hash only compact numeric signatures; do not write a candidate human catalog.
            sig_hash=hashlib.sha256()
            for _ in range(GENERATOR_TRIALS_PER_TOPO):
              raw_attempts+=1
              idx=gen_rng.choice(len(pool),size=na+nb,replace=False)
              A=fvs[idx[:na]];B=fvs[idx[na:]]
              if A.min()<2500 or B.min()<2500: continue
              if A.max()<4000 or B.max()<4000: continue
              sa=float(A.sum());sb=float(B.sum())
              ratio=min(sa,sb)/max(sa,sb)
              if ratio<0.75: continue
              realistic+=1
              vr,pr=verdict(sa,sb)
              va,pa=verdict(v9_score(A),v9_score(B))
              if vr!=0 and va!=0 and vr==-va:
                discord+=1
                m=min(pr,pa)
                if m<0.10: band='7-10%'
                elif m<0.15: band='10-15%'
                else: band='15%+'
                strength[band]+=1
                sig_hash.update((topo+'|'+','.join(map(str,sorted(idx.tolist())))+'\n').encode())
            accept=realistic/raw_attempts
            dr=(discord/realistic) if realistic else 0.0
            generator_rows.append({
              'topology':topo,'raw_trials':raw_attempts,'realistic_trials':realistic,
              'realism_acceptance_rate':accept,'discordant_trials':discord,
              'discordance_rate_within_realistic':dr,
              'discordance_rate_per_raw_draw':discord/raw_attempts,
              'discordance_strength_counts':dict(strength),
              'planning_signature_sha256':sig_hash.hexdigest(),
            })
          generator_audit={
            'status':'PASS_SOURCE_ONLY_DISCORDANCE_RATE_AUDIT' if all(r['discordant_trials']>0 for r in generator_rows) else 'STOP_ZERO_DISCORDANCE_IN_AT_LEAST_ONE_TOPOLOGY_SOURCE_AUDIT',
            'candidate_formula':CANDIDATE_FREEZE,
            'player_pool_unique_count':len(pool),
            'source_catalog_sha256':hashlib.sha256((ROOT/'research/package-adjustment-v8/development_catalog_v1.json').read_bytes()).hexdigest(),
            'source_catalog_candidate_blind':True,
            'human_outcomes_read':False,
            'rows':generator_rows,
            'future_human_catalog_generated':False,
          }
          (OUT/'b6_discordance_generator_audit.json').write_text(json.dumps(generator_audit,indent=2,sort_keys=True)+'\n')

          # ---------- direct preference endpoint simulation ----------
          gh_x,gh_w=hermgauss(32)
          gh_z=np.sqrt(2.0)*gh_x
          gh_w=gh_w/np.sqrt(np.pi)
          TARGETS=sorted({0.40,0.45,0.49,0.50,0.55,0.56,0.58,0.60,0.62,0.64,0.66})

          def solve_mu(target,sig_ch,sig_v,delta):
            sd=math.sqrt(sig_ch*sig_ch+sig_v*sig_v)
            def marginal(mu):
              p1=float(np.sum(gh_w*expit(mu+sd*gh_z+delta)))
              p2=float(np.sum(gh_w*expit(mu+sd*gh_z-delta)))
              return 0.5*(p1+p2)
            lo,hi=-35.0,35.0
            for _ in range(70):
              mid=(lo+hi)/2
              if marginal(mid)<target: lo=mid
              else: hi=mid
            return (lo+hi)/2

          mu_cache={}
          for di,(sc,sv,dl) in enumerate(draws):
            for target in TARGETS:
              mu_cache[(di,target)]=solve_mu(target,float(sc),float(sv),float(dl))

          def cluster_lpm(y,x,voter):
            y=np.asarray(y,float);x=np.asarray(x,float);voter=np.asarray(voter,int)
            X=np.column_stack([np.ones(len(y)),x])
            xtxi=np.linalg.inv(X.T@X)
            bh=xtxi@(X.T@y)
            resid=y-X@bh
            meat=np.zeros((2,2),float)
            groups=np.unique(voter)
            for g in groups:
              z=(voter==g)
              s=X[z].T@resid[z]
              meat+=np.outer(s,s)
            G=len(groups);N=len(y);k=2
            cov=xtxi@meat@xtxi
            if G>1 and N>k: cov*=G/(G-1)*(N-1)/(N-k)
            se=math.sqrt(max(float(cov[0,0]),1e-14))
            tstat=(float(bh[0])-0.5)/se
            p=float(student_t.sf(tstat,df=max(G-1,1)))
            return float(bh[0]),se,p

          def holm(pvals,alpha=FWER_ALPHA):
            p=np.asarray(pvals,float);m=len(p);order=np.argsort(p)
            out=np.zeros(m,dtype=bool)
            for rank,idx in enumerate(order):
              if p[idx] <= alpha/(m-rank): out[idx]=True
              else: break
            return out

          def one_sided_cp_upper(k,n,conf=0.95):
            if k>=n:return 1.0
            return float(beta_dist.ppf(conf,k+1,n-k))

          def balanced_orientation(voters,rng):
            x=np.empty(voters*4,float)
            for v in range(voters):
              a=np.array([1.0,1.0,-1.0,-1.0]);rng.shuffle(a);x[v*4:(v+1)*4]=a
            return x

          def simulate_once(voters,thetas,rng,draw_index):
            sc,sv,dl=map(float,draws[draw_index])
            hats=[];pvals=[]
            for ti,target in enumerate(thetas):
              n=voters*4
              voter=np.repeat(np.arange(voters),4)
              x=balanced_orientation(voters,rng)
              mu=mu_cache[(draw_index,float(target))]
              vb=rng.normal(0.0,sv,size=voters)
              ch=rng.normal(0.0,sc,size=n)
              eta=mu+ch+vb[voter]+dl*x
              y=rng.binomial(1,expit(eta)).astype(float)
              h,se,p=cluster_lpm(y,x,voter)
              hats.append(h);pvals.append(p)
            rej=holm(pvals)
            act=rej & (np.asarray(hats)>=THETA_MIN)
            return act,np.asarray(hats),np.asarray(pvals)

          def scenario_metrics(voters,scenario,reps,seed_offset=0):
            rng=np.random.default_rng(SEED+1000+seed_offset+voters)
            any_act=0;harm_fail=0;good_any=0
            topo_act=np.zeros(6,int)
            harm_cases=0
            pairs=[(i,j) for i in range(6) for j in range(i+1,6)]
            for r in range(reps):
              di=(r*37+voters+seed_offset)%len(draws)
              if scenario=='all_good_0p60':
                th=[0.60]*6; harmful=[];good=list(range(6))
              elif scenario=='global_null_0p50':
                th=[0.50]*6; harmful=list(range(6));good=[]
              elif scenario=='one_harmful_0p49':
                bad=r%6; th=[0.60]*6; th[bad]=0.49; harmful=[bad];good=[i for i in range(6) if i!=bad]
              elif scenario=='two_harmful_0p49':
                bad=list(pairs[r%len(pairs)]);th=[0.60]*6
                for i in bad:th[i]=0.49
                harmful=bad;good=[i for i in range(6) if i not in bad]
              elif scenario=='candidate_worse_everywhere_0p45':
                th=[0.45]*6; harmful=list(range(6));good=[]
              elif scenario=='one_harmful_0p45':
                bad=r%6;th=[0.60]*6;th[bad]=0.45;harmful=[bad];good=[i for i in range(6) if i!=bad]
              elif scenario=='one_harmful_0p40':
                bad=r%6;th=[0.60]*6;th[bad]=0.40;harmful=[bad];good=[i for i in range(6) if i!=bad]
              elif scenario=='small_benefit_0p55':
                th=[0.55]*6;harmful=[];good=list(range(6))
              elif scenario=='heterogeneous_safe':
                th=[0.56,0.58,0.60,0.62,0.64,0.66];harmful=[];good=list(range(6))
              elif scenario=='asymmetric_only':
                th=[0.50,0.60,0.60,0.50,0.60,0.50];harmful=[];good=[1,2,4]
              else: raise KeyError(scenario)
              act,_,_=simulate_once(voters,th,rng,di)
              topo_act+=act.astype(int)
              any_act+=int(act.any())
              if good: good_any+=int(act[good].any())
              if harmful:
                harm_cases+=1
                harm_fail+=int(act[harmful].any())
            return {
              'voters':voters,'ballots':voters*WORKLOAD,'challenges_per_topology':voters*4,
              'scenario':scenario,'reps':reps,
              'any_activation_rate':any_act/reps,
              'good_any_activation_rate':good_any/reps if scenario not in {'global_null_0p50','candidate_worse_everywhere_0p45'} else None,
              'harmful_activation_rate':harm_fail/harm_cases if harm_cases else None,
              'harmful_activation_one_sided_95_upper':one_sided_cp_upper(harm_fail,harm_cases) if harm_cases else None,
              'topology_activation_rates':{TOPO[i]:float(topo_act[i]/reps) for i in range(6)},
            }

          primary_rows=[]
          for voters in DESIGN_VOTERS:
            rows={}
            for si,scen in enumerate(['all_good_0p60','global_null_0p50','one_harmful_0p49','two_harmful_0p49']):
              rows[scen]=scenario_metrics(voters,scen,SCREEN_REPS,seed_offset=10000*si)
            safety_ucb=max(rows[x]['harmful_activation_one_sided_95_upper'] for x in ['global_null_0p50','one_harmful_0p49','two_harmful_0p49'])
            power=rows['all_good_0p60']['good_any_activation_rate']
            qualifies=bool(power>=0.80 and safety_ucb<=0.05)
            primary_rows.append({
              'voters':voters,'ballots':voters*WORKLOAD,'challenges_per_topology':voters*4,
              'power_any_good_at_theta_min':power,
              'max_familywise_harmful_activation_ucb95':safety_ucb,
              'qualifies_oc':qualifies,
              'scenario_details':rows,
            })

          qualifying=[r for r in primary_rows if r['qualifies_oc'] and r['ballots']<=2880]
          chosen=min(qualifying,key=lambda r:r['ballots']) if qualifying else None
          if chosen and chosen['ballots']<=1440:
            decision='PASS_PREFERRED_BURDEN_FEASIBLE'
          elif chosen:
            decision='CONDITIONAL_FEASIBLE_REQUIRES_OWNER_BURDEN_ACCEPTANCE'
          else:
            decision='STOP_MORE_THAN_2880_BALLOTS_OR_RULE_NOT_FEASIBLE'

          # Prespecified red-team suite at the selected design, or at 60 voters
          # if no design qualifies, so STOP remains informative.
          diag_voters=int(chosen['voters'] if chosen else 60)
          secondary={}
          for si,scen in enumerate(['candidate_worse_everywhere_0p45','one_harmful_0p45','one_harmful_0p40','small_benefit_0p55','heterogeneous_safe','asymmetric_only']):
            secondary[scen]=scenario_metrics(diag_voters,scen,DIAGNOSTIC_REPS,seed_offset=70000+10000*si)

          # Oracle-vs-search harm diagnostic on the NEW direct endpoint.
          # Oracle knows the harmful topology. Search must test all six with Holm.
          def harm_detection(voters,reps=400,bad_theta=0.45):
            rng=np.random.default_rng(SEED+900000+voters)
            oracle=0;search=0
            for r in range(reps):
              di=(r*53+voters)%len(draws)
              sc,sv,dl=map(float,draws[di]); bad=r%6
              th=[0.60]*6;th[bad]=bad_theta
              # Simulate all topology data but compute harm-direction p values.
              harm_ps=[];hats=[]
              for ti,target in enumerate(th):
                n=voters*4;voter=np.repeat(np.arange(voters),4);x=balanced_orientation(voters,rng)
                mu=mu_cache[(di,float(target))]
                vb=rng.normal(0.0,sv,size=voters);ch=rng.normal(0.0,sc,size=n)
                y=rng.binomial(1,expit(mu+ch+vb[voter]+dl*x)).astype(float)
                h,se,_=cluster_lpm(y,x,voter)
                tstat=(h-0.5)/se
                p_lower=float(student_t.cdf(tstat,df=max(voters-1,1)))
                hats.append(h);harm_ps.append(p_lower)
              oracle+=int(harm_ps[bad]<=0.05)
              hr=holm(harm_ps)
              search+=int(hr[bad])
            return {'voters':voters,'ballots':voters*WORKLOAD,'bad_theta':bad_theta,'reps':reps,'oracle_known_bad_detection':oracle/reps,'familywise_search_detection':search/reps}

          oracle_rows=[harm_detection(v) for v in [60,90,120,180,240]]
          prior_b5e_curve=[
            {'voters':60,'ballots':1440,'one_unsafe_detection':0.642},
            {'voters':120,'ballots':2880,'one_unsafe_detection':0.592},
            {'voters':150,'ballots':3600,'one_unsafe_detection':0.650},
            {'voters':180,'ballots':4320,'one_unsafe_detection':0.675},
            {'voters':240,'ballots':5760,'one_unsafe_detection':0.742},
          ]
          oracle_diag={
            'status':'PASS_DIAGNOSTIC_ONLY',
            'prior_b5e_observed_curve':prior_b5e_curve,
            'new_direct_endpoint_oracle_vs_familywise_search':oracle_rows,
            'interpretation':'Diagnostic only. The new endpoint changes the product decision to harmful-activation control; old B5E detection and new direct-endpoint detection are not treated as the same estimand.',
          }
          (OUT/'b6_oracle_rule_diagnostic.json').write_text(json.dumps(oracle_diag,indent=2,sort_keys=True)+'\n')

          # Add estimated source draw burden for whichever human design would be selected.
          required_per_topology=int(chosen['challenges_per_topology']) if chosen else int(120*4)
          for row in generator_rows:
            rate=row['discordance_rate_per_raw_draw']
            row['required_unique_discordant_challenges_for_selected_or_stop_reference']=required_per_topology
            row['estimated_raw_generator_draws_needed']=None if rate<=0 else required_per_topology/rate

          oc={
            'analysis_version':VERSION,
            'status':'PASS_B6_INFORMATION_LIMIT_AUDIT_ONLY',
            'decision':decision,
            'candidate_id':CANDIDATE_FREEZE['candidate_id'],
            'theta_min':THETA_MIN,
            'familywise_alpha':FWER_ALPHA,
            'primary_rows':primary_rows,
            'minimum_qualifying_design':None if chosen is None else {k:chosen[k] for k in ['voters','ballots','challenges_per_topology','power_any_good_at_theta_min','max_familywise_harmful_activation_ucb95']},
            'secondary_red_team_at_selected_or_reference_design':{'voters':diag_voters,'results':secondary},
            'generator_status':generator_audit['status'],
            'no_v9_human_outcomes':True,
            'no_production_change_authorized':True,
          }
          (OUT/'b6_operating_characteristics.json').write_text(json.dumps(oc,indent=2,sort_keys=True)+'\n')

          manifest={
            'analysis_version':VERSION,
            'status':'PASS_B6_TOPOLOGY_SPECIFIC_DISCORDANCE_INFORMATION_LIMIT_AUDIT_ONLY',
            'decision':decision,
            'candidate_formula_frozen_for_b6':True,
            'theta_min_frozen_for_b6':True,
            'minimum_qualifying_design':oc['minimum_qualifying_design'],
            'next_if_pass_preferred':'B7 independent high-rep operating-characteristic confirmation and full prospective freeze; do not generate human catalog before B7 passes.',
            'next_if_conditional':'Owner must explicitly accept 1441-2880 ballot burden before B7; otherwise treat as STOP.',
            'next_if_stop':'Do not generate V9 human challenges. Any science loosening must be a separately declared amendment/research generation, never a post-outcome rescue.',
            'v9_human_outcomes_exist_or_were_read':False,
            'v8_candidate_performance_used':False,
            'production_v1_7_predictions_on_v8_votes_used':False,
            'v9_human_catalog_generated':False,
            'v9_final_evaluator_frozen':False,
            'production_change_authorized':False,
          }
          (OUT/'b6_screen_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')

          lines=[]
          lines.append('# Package Adjustment V9 — B6 Topology-Specific Discordance Information-Limit Audit')
          lines.append('')
          lines.append(f"**Decision:** `{decision}`")
          lines.append('')
          lines.append('B6 is synthetic/planning only. No V9 human outcomes exist, no fresh human catalog is generated, and production V1.7 remains unchanged.')
          lines.append('')
          lines.append('## Frozen before feasibility')
          lines.append(f'- Candidate: `{CANDIDATE_FREEZE["candidate_id"]}`')
          lines.append(f'- q: `{Q}` from frozen pre-V8 V6')
          lines.append(f'- theta_min: `{THETA_MIN}`')
          lines.append(f'- familywise harmful-activation alpha: `{FWER_ALPHA}` via Holm')
          lines.append(f'- live fair band: `{FAIR_BAND:.0%}`')
          lines.append('- one vote per unique discordant challenge; 24 ballots/voter; four per topology')
          lines.append('')
          lines.append('## Primary design screen')
          lines.append('| Voters | Ballots | Challenges/topology | P(any good activates) | Max harmful-activation UCB95 | Qualifies |')
          lines.append('|---:|---:|---:|---:|---:|---|')
          for r in primary_rows:
            lines.append(f"| {r['voters']} | {r['ballots']} | {r['challenges_per_topology']} | {r['power_any_good_at_theta_min']:.3f} | {r['max_familywise_harmful_activation_ucb95']:.3f} | {'yes' if r['qualifies_oc'] else 'no'} |")
          lines.append('')
          lines.append('## Source-only discordance audit')
          lines.append('| Topology | Realism accept | Discordance within realistic | Discordant draws |')
          lines.append('|---|---:|---:|---:|')
          for r in generator_rows:
            lines.append(f"| {r['topology']} | {r['realism_acceptance_rate']:.3f} | {r['discordance_rate_within_realistic']:.3f} | {r['discordant_trials']} |")
          lines.append('')
          lines.append('## Firewall')
          lines.append('- V8 outcomes beyond nuisance planning were not read.')
          lines.append('- V8 candidate performance was not used to select the V9 candidate.')
          lines.append('- Production V1.7 predictions were not applied to V8 votes.')
          lines.append('- No V9 human challenge catalog was generated.')
          lines.append('- No production change is authorized.')
          (OUT/'b6_report.md').write_text('\n'.join(lines)+'\n')

          # deterministic output hashes, excluding the hash file itself
          hashes={}
          for p in sorted(OUT.iterdir()):
            if p.name.startswith('analyze_') or p.name=='b6_output_hashes.json': continue
            hashes[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (OUT/'b6_output_hashes.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')

          print(json.dumps({
            'status':manifest['status'],'decision':decision,
            'minimum_qualifying_design':oc['minimum_qualifying_design'],
            'generator_status':generator_audit['status'],
          },indent=2,sort_keys=True))
          PY2

          python3 /tmp/package-adjustment-v9-b6/analyze_b6.py

      - name: Validate scientific firewall and deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import hashlib,json
          from pathlib import Path
          out=Path('/tmp/package-adjustment-v9-b6')
          load=lambda n:json.loads((out/n).read_text())
          freeze=load('b6_candidate_and_estimand_freeze.json')
          protocol=load('b6_preregistered_protocol.json')
          oc=load('b6_operating_characteristics.json')
          m=load('b6_screen_manifest.json')
          h=load('b6_output_hashes.json')
          g=load('b6_discordance_generator_audit.json')
          assert freeze['status']=='FROZEN_BEFORE_B6_SIMULATION'
          assert freeze['q']==2.9897594788655337
          assert freeze['theta_min']==0.60
          assert protocol['v9_human_outcomes_exist_or_were_read'] is False
          assert protocol['production_v1_7_predictions_on_v8_votes_used'] is False
          assert protocol['v8_candidate_performance_used'] is False
          assert m['production_change_authorized'] is False
          assert m['v9_human_catalog_generated'] is False
          assert oc['decision'] in {
            'PASS_PREFERRED_BURDEN_FEASIBLE',
            'CONDITIONAL_FEASIBLE_REQUIRES_OWNER_BURDEN_ACCEPTANCE',
            'STOP_MORE_THAN_2880_BALLOTS_OR_RULE_NOT_FEASIBLE',
          }
          assert g['human_outcomes_read'] is False
          for name,sha in h.items():
            actual=hashlib.sha256((out/name).read_bytes()).hexdigest()
            assert actual==sha,(name,actual,sha)
          print('PASS: B6 scientific firewall and deterministic output hashes validated.')
          PY3

      - name: Commit durable B6 planning record
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b6-discordance-information-limit"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b6/b6_*.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6/b6_report.md "$DEST/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "B6 durable outputs already current; no commit needed."
          else
            git commit -m "Record Package Adjustment V9 B6 discordance information-limit audit"
            git push origin HEAD:main
          fi

      - name: Upload B6 audit artifact
        uses: actions/upload-artifact@v4
        with:
