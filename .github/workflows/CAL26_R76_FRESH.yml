# R76 private, read-only. Uses the existing DLF repository secret. No licensed rows leave memory.
name: CAL26 V1R76 - Private DLF 2026 vs 2027 Incremental Value Ablation (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r76-private-dlf-ablation
  cancel-in-progress: false
jobs:
  private-market-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Read-only checkout pinned deployed FV formula
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install fixed statistical dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "numpy==2.2.6" "scikit-learn==1.8.0"
    - name: Download exact successful R74 next-season model
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R74_CHRONOLOGICAL_NEXT_SEASON_SURPLUS_FV_HOLD
        run-id: 40106627943
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r76-in/R74
    - name: Download exact successful R72 live FV replay
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R72_518_NATIVE_FV_FORMULA_REPLAY_AND_SENSITIVITY_FV_HOLD
        run-id: 40102341863
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r76-in/R72
    - name: Download exact successful private R75 aggregate comparison
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R75_PRIVATE_DLF_MARKET_FACE_VALIDITY_AGGREGATES_FV_HOLD
        run-id: 40114279895
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r76-in/R75
    - name: Private 2026-vs-2027 ablation on exact R75 cohorts (no FV edits)
      shell: bash
      env:
        CAL26_DLF_SF_CSV_B64: ${{ secrets.CAL26_DLF_SF_CSV_B64 }}
      run: |
        set -euo pipefail
        # Keep the current public deployed FV frozen; only private data in memory.
        test "$(git hash-object index.html)" = "5630bb681dd8710f8e45bc5363488f358ce9ebe2"
        test -z "$(git status --porcelain)"
        test ! -e sf.csv
        cat > "$RUNNER_TEMP/CAL26_R76_engine.py" <<'PY_R76_PRIVATE_ENGINE'
        #!/usr/bin/env python3
        """R75: private DLF value signal test, no provider rows or names in output, zero live FV changes.
        Source DLF CSV via existing GitHub secret only. Never create files with DLF data.
        This is same-vintage market face-validity, not a time-prospective or true-FV test.
        """
        import argparse,base64,csv,hashlib,io,json,math,os,pathlib,statistics,re
        import numpy as np
        from sklearn.linear_model import Ridge
        from sklearn.preprocessing import StandardScaler
        P=pathlib.Path
        PIN={
         'R74/CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv':'2e3e3bcd005fcaa1480b2200893c5b4c3548a1b3be2dd0ce8fdb8af9d0d8b50b',
         'R74/CAL26_R74_7position_chronological_transition_risk.csv':'de552a013876b60c9d5a1b84db0d400ffb1f5e74b275af55ee761fa9b7f19c17',
         'R72/CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv':'2ebce111316cdb578d0bd240e1858a4ac87e1b61543dff01fffc3b60e943d2b2'
        }
        POS=('QB','RB','WR','TE','DL','LB','DB')
        DLF_POS=('QB','RB','WR','TE')
        def chk(c,s):
         if not c:raise AssertionError(s)
        def sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()
        def norm(s):return re.sub(r'\s+',' ',re.sub(r"[.'’\-]",'',s.strip().lower()))
        def read(p):
         with P(p).open(newline='',encoding='utf-8-sig') as f:return list(csv.DictReader(f))
        def write(p,rr):
         with P(p).open('w',newline='',encoding='utf-8') as f:
          w=csv.DictWriter(f,fieldnames=list(rr[0]));w.writeheader();w.writerows(rr)
        def val(s):
         try:
          f=float(s);return f if math.isfinite(f) else None
         except (TypeError,ValueError):return None
        def parse_dlf(secret):
         if not secret:return None
         try:decoded=base64.b64decode(secret,validate=True).decode('utf-8-sig')
         except Exception as e:raise ValueError('PRIVATE_INPUT_INVALID_BASE64_OR_UTF8') from None
         f=io.StringIO(decoded);reader=csv.DictReader(f)
         chk(reader.fieldnames == ['name','position','team','value'],'PRIVATE_DLF_SCHEMA_CHANGED')
         out={}
         for row in reader:
          pos=row['position'].strip().upper()
          if pos not in DLF_POS:continue  # IDP isn't present in DLF SF offensive values file
          name=norm(row['name']);pv=val(row['value'])
          chk(name and pv is not None and pv>0,'PRIVATE_DLF_BAD_ROW')
          k=(name,pos);chk(k not in out,'PRIVATE_DLF_DUPLICATE_IDENTITY')
          out[k]=pv
         chk(len(out)>=25,'PRIVATE_DLF_TOO_FEW_VALID_OFFENSE_VALUES')
         return out

        def model_market(rows,dlf):
         # This is a price predictability comparison, NOT a LOG FV scale calibration.
         cohorts={p:[] for p in DLF_POS}
         for r in rows:
          p=r['position'];name=norm(r['name'])
          if p not in DLF_POS or (name,p) not in dlf:continue
          y0=val(r['2026_year0_replacement_surplus_RESEARCH'])
          h1=val(r['2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH'])
          live=val(r['live_JS_FV_UNCHANGED'])
          age=val(r['age']);gp=val(r['games_played_through_2026_week6'])
          if any(z is None for z in (y0,h1,live,age,gp)) or live<=0:continue
          # Restricted to 4+ observed games: missing playing time is not automatically poor dynasty value.
          if gp<4:continue
          baseline=[math.log(live)]
          extended=[math.log(live),math.log1p(max(0,y0)),math.log1p(max(0,h1))]
          cohorts[p].append({'name':name,'baseline':baseline,'extended':extended,'y':math.log(dlf[(name,p)])})
         summary=[]
         for p in POS:
          cc=cohorts.get(p,[])
          n=len(cc);r={'position':p,'eligible_private_licensed_market_matches':n if p in DLF_POS else 0,
            'market_source':'private_DLF_SF_offense_2026_10_20' if p in DLF_POS else 'NO_IDP_NUMERIC_DLF_SOURCE',
            'price_baseline_OOF_log_MAE':'','multi_year_augmented_OOF_log_MAE':'','augmented_vs_live_MAE_improvement_pct':'',
            'market_price_out_of_time_holdout':False,'LOG_FV_cardinal_transfer_validated':False,'auto_price_release_authorized':False,
            'decision':'NO_OFFENSE_DLF_SOURCE' if p not in DLF_POS else 'INSUFFICIENT_MATCHED_PRIVATE_ROWS'}
          if p not in DLF_POS or n<20:summary.append(r);continue
          cc.sort(key=lambda x:hashlib.sha256((p+'|'+x['name']).encode()).hexdigest())
          outs=[];positive=True
          for features in ('baseline','extended'):
           errors=[]
           for fold in range(5):
            tr=[t for i,t in enumerate(cc) if i%5!=fold];te=[t for i,t in enumerate(cc) if i%5==fold]
            assert len(tr)>=16 and len(te)>=4
            Xtr=np.array([t[features] for t in tr],dtype=float);Xte=np.array([t[features] for t in te],dtype=float)
            ytr=np.array([t['y'] for t in tr],dtype=float)
            sc=StandardScaler().fit(Xtr)
            mdl=Ridge(alpha=5.0).fit(sc.transform(Xtr),ytr)
            pred=mdl.predict(sc.transform(Xte))
            errors.extend(abs(float(yp)-t['y']) for yp,t in zip(pred,te))
           outs.append(statistics.mean(errors))
          gain=100*(1-outs[1]/outs[0]) if outs[0]>0 else 0
          r.update({'price_baseline_OOF_log_MAE':round(outs[0],6),'multi_year_augmented_OOF_log_MAE':round(outs[1],6),
            'augmented_vs_live_MAE_improvement_pct':round(gain,2),
            'decision':'PROMISING_PRIVATE_CROSS_SECTIONAL_NOT_FV' if gain>2 else 'NO_CLEAR_MARKET_IMPROVEMENT'})
          summary.append(r)
         return summary

        def build(r74,r72,out,secret):
         p=P(out);p.mkdir(parents=True,exist_ok=True)
         for key,h in PIN.items():
          q=(P(r74) if key.startswith('R74/') else P(r72))/key.split('/',1)[1]
          chk(q.is_file(),'PINNED_FILE_MISSING '+key)
          chk(sha(q)==h,'PINNED_SOURCE_SHA_DRIFT '+key)
         full=read(P(r74)/'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv')
         raw=read(P(r72)/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv')
         rr={(norm(x['name']),x['position']):x for x in raw}
         chk(len(full)==len(rr)==518,'PLAYER_COUNT_DRIFT')
         seen=set()
         for r in full:
          k=(norm(r['name']),r['position']);chk(k not in seen and k in rr,'BAD_IDENTITY_'+str(k));seen.add(k)
          chk(int(r['live_JS_FV_UNCHANGED'])==int(rr[k]['exact_production_JS_replayed_FV']),'LIVE_JS_QUOTE_DRIFT')
          chk(r['proposed_FV']=='' and r['FV_production_change_authorized']=='False','INADVERTENT_PRICE_RELEASE')
          chk(r['2028_H2_independent_future_outcome_certified']=='False','2028_SEALED_H2_DRIFT')
         chk({r['position'] for r in full}==set(POS),'POSITION_COUNT_DRIFT')
         chk(sum(r['owner_price_anchor_protected']=='True' for r in full)==15,'ANCHOR_COUNT_DRIFT')
         market=parse_dlf(secret)
         result=model_market(full,market) if market is not None else [
          {'position':pos,'eligible_private_licensed_market_matches':'','market_source':('PRIVATE_DLF_SECRET_NOT_CONFIGURED' if pos in DLF_POS else 'NO_IDP_NUMERIC_DLF_SOURCE'),
            'price_baseline_OOF_log_MAE':'','multi_year_augmented_OOF_log_MAE':'','augmented_vs_live_MAE_improvement_pct':'',
            'market_price_out_of_time_holdout':False,'LOG_FV_cardinal_transfer_validated':False,'auto_price_release_authorized':False,
            'decision':'PRIVATE_SOURCE_MISSING' if pos in DLF_POS else 'NO_OFFENSE_DLF_SOURCE'} for pos in POS]
         # No provider rows, individual provider labels, or named DLF predictions leave memory.
         cards=[]
         focus=['bryce young','caleb williams','drake maye','jayden daniels','cj stroud','puka nacua','myles garrett','brian burns','maxx crosby','josh allen','jahmyr gibbs','will anderson','trevor lawrence','jeremiyah love','breece hall','patrick mahomes']
         by={norm(r['name']):r for r in full}
         for name in focus:
          r=by[name];cards.append({'name':r['name'],'position':r['position'],'current_live_FV_NO_CHANGE':r['live_JS_FV_UNCHANGED'],
           '2026_H0_surplus_research':r['2026_year0_replacement_surplus_RESEARCH'],
           '2027_H1_surplus_research':r['2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH'],
           '2027_research_uncertainty_lower':r['2027_H1_residual_p10_lower_RESEARCH_NOT_PROBABILISTIC'],
           '2027_research_uncertainty_upper':r['2027_H1_residual_p90_upper_RESEARCH_NOT_PROBABILISTIC'],
           '2026_GP':r['games_played_through_2026_week6'],
           'independent_DLF_individual_value_or_derived_prediction':'PRIVATE_NOT_EXPORTED',
           'FV_numeric_proposal':'','FV_release_authorized':False})
         write(p/'CAL26_R75_7position_market_price_predictability_AGGREGATE_ONLY.csv',result)
         write(p/'CAL26_R75_16_owner_multi_year_cards_NO_PRICE_RELEASE.csv',cards)
         n_eligible=sum(int(r['eligible_private_licensed_market_matches']) for r in result if isinstance(r['eligible_private_licensed_market_matches'],int))
         status='PRIVATE_MARKET_CROSS_SECTIONAL_AUDITED_FV_HOLD' if market is not None else 'PRIVATE_MARKET_SOURCE_ABSENT_FV_HOLD'
         lines=['# CAL26 V1R75 — independent market predictability (licensed data private)','',
          '**Decision: NO FV PRICE RELEASE.** GitHub success means the pinned inputs and private-data boundary worked, not that multi-year pricing has been calibrated.','',
          'Private DLF source provided through `CAL26_DLF_SF_CSV_B64`: '+('YES — privately analyzed' if market else 'NO — not configured'),'',
          'The DLF source is the offensive superflex DLF 2026-10-20 upload, not an IDP market price source. The date is provenance inherited from R33, not freshly verified by this run.','',
          'Model comparison uses fixed five-fold *player-held-out* ridge regression on log(DLF values) within positions, using training-only normalization and a fixed regularization. Baseline: current live FV. Augmented: current live FV + 2026 one-year surplus + 2027 experimental H1 surplus.','',
          'This is **cross-sectional** benchmark with model/features sourced around Oct 24, NOT a point-in-time Oct 20 prospectively frozen valuation backtest. It cannot prove FV, does not validate a 2028 horizon, and cannot transfer raw DLF units to LOG FV. Small/sparse positions are withheld.','',
          '| Position | Private eligible comparisons | Live-only OOF log MAE | Multi-year OOF log MAE | Relative error improvement | Decision |','|---|---:|---:|---:|---:|---|']
         for s in result:
          lines.append('| '+s['position']+' | '+str(s['eligible_private_licensed_market_matches'] or '—')+' | '+str(s['price_baseline_OOF_log_MAE'] or '—')+' | '+str(s['multi_year_augmented_OOF_log_MAE'] or '—')+' | '+str(s['augmented_vs_live_MAE_improvement_pct'] if s['augmented_vs_live_MAE_improvement_pct']!='' else '—')+' | '+s['decision']+' |')
         lines+=['','Any source CSV contents, provider-name matches, DLF values, and player-level learned prices were held in memory and **not** written to GitHub logs or artifacts.','',
          'IDP market calibration: **unavailable from the provided offensive DLF file**. Live FV and all owner price anchors remain unchanged.','',
          'If the secret is missing, privately configure the existing repository secret `CAL26_DLF_SF_CSV_B64` from the user-provided licensed `sf.csv`, then rerun the same workflow. Do not commit `sf.csv` or embed its contents in YAML.','',
          'No future 2026 weeks (7+) outcomes, protected Weeks8–12 holdout, or hypothetical 2027/2028 results are consumed.']
         (p/'CAL26_R75_decision.md').write_text('\n'.join(lines)+'\n')
         outs=[q.name for q in p.iterdir() if q.is_file()]
         m={'run':'CAL26_V1R75','status':status,'input_sha256':PIN,'source_type':'DLF_OFFENSE_NATIVE_VALUE_PRIVATE_OR_ABSENT',
          'private_DLF_secret_configured':market is not None,'licensed_rows_exposed_in_outputs':False,'market_player_labels_exported':False,
          'full_player_count':len(full),'owner_card_count':len(cards),'positions':list(POS),'2026_week6_only':True,'H2_2028_prospectively_validated':False,
          'one_to_one_DLF_to_LOG_FV_scale_validated':False,'production_changes':0,'owner_price_anchors_protected':15,
          'per_position_private_eligible_suppressed_if_lt20':True,
          'output_sha256':{n:sha(p/n) for n in outs}}
         (p/'CAL26_R75_manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
         print('R75_COMPLETE_NO_FV_RELEASE',status,'players',len(full),'private_market_source',bool(market),'positions',len(result))
         return m

        def main():
         a=argparse.ArgumentParser();a.add_argument('--r74');a.add_argument('--r72');a.add_argument('--out');a.add_argument('--selftest',action='store_true');args=a.parse_args()
         if args.selftest:
          chk(norm('C.J. Stroud')=='cj stroud','NAME_NORMALIZATION')
          chk(parse_dlf('') is None,'EMPTY_PRIVATE_SECRET')
          try:parse_dlf('not-base64^^');raise AssertionError('BAD_SECRET_NOT_REJECTED')
          except ValueError:pass
          # No licensed inputs; only synthetic test for deterministic OOF logic.
          synthetic=[];dlf={}
          for p in DLF_POS:
           for i in range(25):
            name='fixture '+p.lower()+' '+str(i)
            synthetic.append({'name':name,'position':p,'age':str(22+i%12),'games_played_through_2026_week6':'6',
              '2026_year0_replacement_surplus_RESEARCH':str(i*2),'2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH':str(i*3),
              'live_JS_FV_UNCHANGED':str(700+i*190)})
            dlf[(name,p)]=100+i*30
          out=model_market(synthetic,dlf)
          chk(len(out)==7 and all(t['eligible_private_licensed_market_matches']==25 for t in out if t['position'] in DLF_POS),'PRIVATE_OOF_SELFTEST')
          print('R75_SELFTEST_GREEN synthetic private OOF; missing private source; corrupted private input')
          return
         chk(args.r74 and args.r72 and args.out,'MISSING_REQUIRED_SOURCE_DIRS')
         build(args.r74,args.r72,args.out,os.environ.get('CAL26_DLF_SF_CSV_B64',''))
        # R76 extension to the already-validated R75 private-source engine; R75 input parsing and
        # baseline calculations reused without changing their cohort, scoring, or folds.
        import random
        FEATURES=('live','live_y0','live_h1','live_y0_h1')
        def cohorted(rows,dlf):
            cohorts={p:[] for p in DLF_POS}
            for r in rows:
                pos=r['position'];name=norm(r['name'])
                if pos not in DLF_POS or (name,pos) not in dlf:continue
                a=val(r['2026_year0_replacement_surplus_RESEARCH']);b=val(r['2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH'])
                live=val(r['live_JS_FV_UNCHANGED']);age=val(r['age']);gp=val(r['games_played_through_2026_week6'])
                if any(q is None for q in (a,b,live,age,gp)) or not live or live<=0 or gp<4:continue
                cohorts[pos].append({'name':name,'live':math.log(live),'y0':math.log1p(max(0,a)),
                                     'h1':math.log1p(max(0,b)),'target':math.log(dlf[(name,pos)])})
            for p in cohorts:cohorts[p].sort(key=lambda x:hashlib.sha256((p+'|'+x['name']).encode()).hexdigest())
            return cohorts

        def oof_errors(cc, features):
            """Identical R75 OOF folds, estimator, and training-only normalization; errors by sorted row index."""
            errs=[None]*len(cc)
            for fold in range(5):
                train=[(i,r) for i,r in enumerate(cc) if i%5!=fold]
                test=[(i,r) for i,r in enumerate(cc) if i%5==fold]
                chk(len(train)>=16 and len(test)>=4,'INSUFFICIENT_PRIVATE_FOLDS')
                Xtr=np.array([[r[v] for v in features] for _,r in train]);Xte=np.array([[r[v] for v in features] for _,r in test])
                ytr=np.array([r['target'] for _,r in train]);sc=StandardScaler().fit(Xtr)
                model=Ridge(alpha=5.0).fit(sc.transform(Xtr),ytr)
                yhat=model.predict(sc.transform(Xte))
                for (i,r),y in zip(test,yhat):errs[i]=abs(float(y)-r['target'])
            chk(len(errs)==len(cc) and all(e is not None and math.isfinite(e) for e in errs),'OOF_MISSING_VALUE')
            return errs

        def paired_ci(left,right,pos,seed='R76paired2026_10_24',B=1000):
            """Paired nonparametric bootstrap conditional on fixed OOF fits; not an out-of-time CI."""
            chk(len(left)==len(right) and len(left)>0,'BOOTSTRAP_BAD_COHORT')
            delta=[float(a)-float(b) for a,b in zip(left,right)]  # positive if right better
            h=int(hashlib.sha256((seed+'/'+pos).encode()).hexdigest()[:16],16)
            rng=random.Random(h);n=len(delta);draws=[]
            for _ in range(B):draws.append(sum(delta[rng.randrange(n)] for j in range(n))/n)
            draws.sort()
            return round(draws[int(.025*B)],6),round(draws[int(.975*B)],6)

        def private_ablation(rows,dlf,actual_r75):
            cohorts=cohorted(rows,dlf);results=[]
            for pos in POS:
                c=cohorts.get(pos,[]);n=len(c)
                rec={'position':pos,'private_matched_eligible_n':n,'live_only_oof_log_mae':'',
                    'live_plus_2026_oof_log_mae':'','live_plus_2027_oof_log_mae':'',
                    'live_plus_both_oof_log_mae':'','2026_only_vs_live_pct':'',
                    'incremental_2027_vs_2026_pct':'','incremental_2027_mean_abs_error_reduction':'',
                    'incremental_2027_paired_boot_ci_low':'','incremental_2027_paired_boot_ci_high':'',
                    'live_plus_both_vs_live_pct':'','incremental_h1_supported_by_paired_ci':False,
                    'DLF_to_LOG_FV_cardinal_transfer_authorized':False,'production_FV_changes':0,
                    'historical_future_h1_transport_validated':False,'point_in_time_market_backtest':False,
                    'decision':'NO_INDEPENDENT_IDP_DLF_VALUES' if pos not in DLF_POS else 'INSUFFICIENT_PRIVATE_COHORT'}
                if pos not in DLF_POS or n<20:results.append(rec);continue
                e={
                    'live':oof_errors(c,['live']),
                    'live_y0':oof_errors(c,['live','y0']),
                    'live_h1':oof_errors(c,['live','h1']),
                    'live_y0_h1':oof_errors(c,['live','y0','h1'])}
                means={k:statistics.mean(v) for k,v in e.items()}
                prev=actual_r75[pos]
                chk(n==int(prev['eligible_private_licensed_market_matches']),'R75_MATCHED_SAMPLE_DRIFT')
                chk(abs(means['live']-float(prev['price_baseline_OOF_log_MAE']))<1.1e-6,'R75_LIVE_ERROR_PARITY')
                chk(abs(means['live_y0_h1']-float(prev['multi_year_augmented_OOF_log_MAE']))<1.1e-6,'R75_BOTH_ERROR_PARITY')
                lo,hi=paired_ci(e['live_y0'],e['live_y0_h1'],pos)
                gain=lambda a,b:round(100*(1-b/a),2)
                rec.update({'live_only_oof_log_mae':round(means['live'],6),
                   'live_plus_2026_oof_log_mae':round(means['live_y0'],6),
                   'live_plus_2027_oof_log_mae':round(means['live_h1'],6),
                   'live_plus_both_oof_log_mae':round(means['live_y0_h1'],6),
                   '2026_only_vs_live_pct':gain(means['live'],means['live_y0']),
                   'incremental_2027_vs_2026_pct':gain(means['live_y0'],means['live_y0_h1']),
                   'incremental_2027_mean_abs_error_reduction':round(means['live_y0']-means['live_y0_h1'],6),
                   'incremental_2027_paired_boot_ci_low':lo,'incremental_2027_paired_boot_ci_high':hi,
                   'live_plus_both_vs_live_pct':gain(means['live'],means['live_y0_h1']),
                   'incremental_h1_supported_by_paired_ci':lo>0,
                   'decision':'INCREMENTAL_H1_POSITIVE_PAIRED_CI_CROSSSECTIONAL_ONLY' if lo>0 else ('H1_NO_INCREMENTAL_OOF_BENEFIT' if means['live_y0_h1']>=means['live_y0'] else 'H1_INCREMENT_INCONCLUSIVE')})
                results.append(rec)
            return results

        def ablation_build(r74,r72,r75,out,secret):
            p=P(out);p.mkdir(parents=True,exist_ok=True)
            for key,h in PIN.items():
                q=(P(r74) if key.startswith('R74/') else P(r72))/key.split('/',1)[1]
                chk(q.is_file() and sha(q)==h,'PINNED_R74_OR_R72_FILE_DRIFT')
            # R75 artifact pin protects its aggregate results and study vintage, not provider data.
            pins75={
              'CAL26_R75_7position_market_price_predictability_AGGREGATE_ONLY.csv':'e04929a702ede4b7c40231dcd77c7f3d495bdd3519b6b307c6218c12128367b7',
              'CAL26_R75_manifest.json':'17d282d33382fb7ecedfc0cf2b8384b8d687491f4d3f449e5e3cb0da589e2440'
            }
            for name,h in pins75.items():
                q=P(r75)/name;chk(q.is_file() and sha(q)==h,'PINNED_PRIVATE_R75_AGGREGATE_DRIFT')
            m75=json.loads((P(r75)/'CAL26_R75_manifest.json').read_text())
            chk(m75['status']=='PRIVATE_MARKET_CROSS_SECTIONAL_AUDITED_FV_HOLD' and m75['private_DLF_secret_configured'], 'R75_WAS_NOT_PRIVATE_GREEN')
            chk(m75['full_player_count']==518 and m75['production_changes']==0 and not m75['licensed_rows_exposed_in_outputs'],'R75_GUARD_DRIFT')
            ref={x['position']:x for x in read(P(r75)/'CAL26_R75_7position_market_price_predictability_AGGREGATE_ONLY.csv')}
            full=read(P(r74)/'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv')
            raw=read(P(r72)/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv')
            rr={(norm(x['name']),x['position']):x for x in raw};chk(len(full)==len(rr)==518,'PLAYER_COUNT_DRIFT')
            seen=set()
            for r in full:
                k=(norm(r['name']),r['position']);chk(k not in seen and k in rr,'IDENTITY_DRIFT');seen.add(k)
                chk(int(r['live_JS_FV_UNCHANGED'])==int(rr[k]['exact_production_JS_replayed_FV']),'LIVE_PRICE_DRIFT')
                chk(r['proposed_FV']=='' and r['FV_production_change_authorized']=='False','INADVERTENT_PRICE_WRITE')
                chk(r['2028_H2_independent_future_outcome_certified']=='False','H2_LEAK')
            chk(sum(r['owner_price_anchor_protected']=='True' for r in full)==15,'OWNER_ANCHOR_DRIFT')
            chk({x['position'] for x in full}==set(POS),'POSITION_DRIFT')
            market=parse_dlf(secret)
            chk(market is not None,'PRIVATE_DLF_SECRET_ABSENT_USE_R75_SETUP')
            agg=private_ablation(full,market,ref)
            write(p/'CAL26_R76_7position_PRIVATE_ABLATION_AGGREGATE_ONLY.csv',agg)
            # Nonprovider summary. No raw market values, matched player names or market predictions anywhere on disk.
            lines=['# CAL26 V1R76 — DLF private incremental 2027 signal audit','',
              '**Result is a private cross-sectional feature ablation; NO FV prices authorized.**','',
              'Exactly the same private DLF player cohorts, fixed folds and model regularization as R75. Models: live FV; live+2026 surplus; live+2027 H1; live+both. DLF native price is never written to artifacts.','',
              'Bootstrap CI resamples paired player OOF absolute-error improvements while holding fitted models fixed. It describes uncertainty *conditional on this cross-sectional data*, not a prospective market validation.','',
              '| Position | Matched | Live MAE | Live+2026 MAE | Live+2027 MAE | Live+both MAE | H1 marginal vs 2026 | Paired CI (abs log error) | Conclusion |',
              '|---|---:|---:|---:|---:|---:|---:|---|---|']
            for x in agg:
                disp=lambda k:str(x[k]) if x[k]!='' else '—'
                ci=(str(x['incremental_2027_paired_boot_ci_low'])+'..'+str(x['incremental_2027_paired_boot_ci_high'])) if x['incremental_2027_paired_boot_ci_low']!='' else '—'
                lines.append('| '+x['position']+' | '+str(x['private_matched_eligible_n'])+' | '+disp('live_only_oof_log_mae')+' | '+disp('live_plus_2026_oof_log_mae')+' | '+disp('live_plus_2027_oof_log_mae')+' | '+disp('live_plus_both_oof_log_mae')+' | '+disp('incremental_2027_vs_2026_pct')+'% | '+ci+' | '+x['decision']+' |')
            lines += ['',
              'The underlying R74 next-season model did not beat the historical YTD-control across all positions. Even positive cross-sectional H1 gains alone would not justify absolute FV conversion.',
              'DL/LB/DB have no private DLF numeric labels. No future 2026 Week7+ outcomes or protected holdout touched.',
              'No per-player private labels, matched names, values or predictions were exported. All 518 live FV quotes and 15 anchors are unchanged.',
              '', '**Next production-directed decision:** consider conservative price candidate only for features supported beyond this cross-sectional test; do not use numeric DLF prices directly as LOG FV.']
            (p/'CAL26_R76_decision.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
            file_hash={q.name:sha(q) for q in p.iterdir() if q.is_file()}
            m={'run':'CAL26_V1R76','status':'PRIVATE_ABLATION_COMPLETED_NO_FV_PRICE_RELEASE','matched_cohort_sizes_by_position':{x['position']:x['private_matched_eligible_n'] for x in agg},
               'source_runs':{'R75':40114279895,'R74':40106627943,'R72':40102341863},'input_sha256':PIN,'R75_output_pins':pins75,
               'private_DLF_secret_configured':True,'licensed_rows_exposed_in_outputs':False,'market_player_labels_exported':False,
               'total_2026_player_count':518,'owner_anchors_protected':15,'production_changes':0,
               'same_fold_cohort_R75_reproduced':True,'no_production_price_conversion':True,'no_future_week_outcomes':True,
               'output_sha256':file_hash}
            (p/'CAL26_R76_manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
            print('R76_PRIVATE_ABLATION_DONE','cohorts',sum(x['private_matched_eligible_n'] for x in agg),'positions',len(agg),'FV_changes',0)
            return m

        def ablation_main():
            a=argparse.ArgumentParser();a.add_argument('--r74');a.add_argument('--r72');a.add_argument('--r75');a.add_argument('--out');a.add_argument('--selftest',action='store_true');args=a.parse_args()
            if args.selftest:
                rng=random.Random(1176);fake=[];ds={}
                for pos in DLF_POS:
                    for i in range(25):
                        name='fixture '+pos.lower()+' '+str(i)
                        fake.append({'name':name,'position':pos,'age':'25','games_played_through_2026_week6':'6',
                           '2026_year0_replacement_surplus_RESEARCH':str(i*4+1),
                           '2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH':str((i*13)%19+1),
                           'live_JS_FV_UNCHANGED':str(900+i*190)})
                        ds[(name,pos)]=250+(i*30)+rng.randrange(50)
                old={x['position']:x for x in model_market(fake,ds)}
                new=private_ablation(fake,ds,old)
                chk(len(new)==7 and all(x['private_matched_eligible_n']==25 for x in new[:4]),'SYNTHETIC_PRIVATE_ABLATION_FAILURE')
                chk(all(x['DLF_to_LOG_FV_cardinal_transfer_authorized']==False for x in new),'PRIVATE_RELEASE_FLAG')
                lo,hi=paired_ci([.9,.7,1.,.4],[.6,.5,.9,.2],'QB')
                chk(lo>0 and hi>0,'POSITIVE_PAIR_TEST')
                bad_secret=False
                try:parse_dlf('not-base64^^')
                except ValueError:bad_secret=True
                chk(bad_secret,'INVALID_BASE64_NOT_REJECTED')
                print('R76_SELFTEST_GREEN independent ablations + paired CI + secret rejection')
                return
            chk(all((args.r74,args.r72,args.r75,args.out)),'MISSING_SOURCE_ARGS')
            ablation_build(args.r74,args.r72,args.r75,args.out,os.environ.get('CAL26_DLF_SF_CSV_B64',''))

        if __name__=='__main__':ablation_main()
        PY_R76_PRIVATE_ENGINE
        python -m py_compile "$RUNNER_TEMP/CAL26_R76_engine.py"
        python "$RUNNER_TEMP/CAL26_R76_engine.py" --selftest
        python "$RUNNER_TEMP/CAL26_R76_engine.py" \
          --r74 "$RUNNER_TEMP/cal26-r76-in/R74" \
          --r72 "$RUNNER_TEMP/cal26-r76-in/R72" \
          --r75 "$RUNNER_TEMP/cal26-r76-in/R75" \
          --out "$RUNNER_TEMP/cal26-r76-results"
        python - "$RUNNER_TEMP/cal26-r76-results" <<'PY_R76_VERIFY'
        import json,hashlib,csv,pathlib,sys
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R76_manifest.json').read_text())
        assert m['run']=='CAL26_V1R76' and m['status']=='PRIVATE_ABLATION_COMPLETED_NO_FV_PRICE_RELEASE'
        assert m['total_2026_player_count']==518 and m['owner_anchors_protected']==15 and m['production_changes']==0
        assert m['private_DLF_secret_configured'] and not m['licensed_rows_exposed_in_outputs'] and not m['market_player_labels_exported']
        assert m['same_fold_cohort_R75_reproduced'] and m['no_future_week_outcomes'] and m['no_production_price_conversion']
        for n,h in m['output_sha256'].items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
        with (p/'CAL26_R76_7position_PRIVATE_ABLATION_AGGREGATE_ONLY.csv').open() as f:rows=list(csv.DictReader(f))
        assert len(rows)==7 and set(x['position'] for x in rows)=={'QB','RB','WR','TE','DL','LB','DB'}
        assert sum(int(r['private_matched_eligible_n']) for r in rows)==205
        assert all(x['DLF_to_LOG_FV_cardinal_transfer_authorized']=='False' and x['production_FV_changes']=='0' for x in rows)
        print('R76_REAL_SOURCE_INTEGRITY_AND_PRIVATE_REPLAY_GREEN', m['status'])
        PY_R76_VERIFY
        test -z "$(git status --porcelain)"
        cat "$RUNNER_TEMP/cal26-r76-results/CAL26_R76_decision.md" >> "$GITHUB_STEP_SUMMARY"
