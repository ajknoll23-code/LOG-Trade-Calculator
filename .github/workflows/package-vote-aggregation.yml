name: Package Vote Aggregation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: pip install requests numpy

      - name: Aggregate Package Preference V1 votes
        shell: bash
        run: |
          python3 scripts/market/package_vote_pipeline.py --selftest
          python3 scripts/market/package_vote_pipeline.py

      - name: Run Package Vote Fit Diagnostics V1
        shell: bash
        run: |
          python3 scripts/market/package_vote_fit_diagnostics.py --selftest
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          results = json.loads(
              Path("research/package-adjustment-v1/package_vote_results.json").read_text()
          )
          if results["summary"]["promotion_data_gates"]["all_passed"]:
              subprocess.run(
                  ["python3", "scripts/market/package_vote_fit_diagnostics.py"],
                  check=True,
              )
          else:
              print("V1 collection gates not all passed; V1 diagnostics skipped.")
          PY

      - name: Aggregate Package Preference V2 votes
        shell: bash
        run: |
          python3 scripts/market/package_vote_v2_pipeline.py --selftest
          python3 scripts/market/package_vote_v2_pipeline.py

      - name: Run Package Vote Fit Diagnostics V2
        shell: bash
        run: |
          python3 scripts/market/package_vote_v2_fit_diagnostics.py --selftest
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          results = json.loads(
              Path("research/package-adjustment-v2/package_vote_v2_results.json").read_text()
          )
          gates = results["summary"]["diagnostic_data_gates"]["all_passed"]
          if gates:
              subprocess.run(
                  ["python3", "scripts/market/package_vote_v2_fit_diagnostics.py"],
                  check=True,
              )
          else:
              print("V2 diagnostic collection gates not all passed; V2 diagnostics skipped.")
          PY

      - name: Verify research-only contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          v1 = json.loads(
              Path("research/package-adjustment-v1/package_vote_results.json").read_text()
          )
          assert v1["status"] == "research_only"
          assert v1["consumer_changed"] is False
          assert v1["market_value_consumer_changed"] is False

          v2_catalog = json.loads(
              Path("research/package-adjustment-v2/package_vote_challenges_v2.json").read_text()
          )
          assert v2_catalog["status"] == "frozen_package_preference_v2"
          assert v2_catalog["frozen"] is True
          assert v2_catalog["consumer_changed"] is False

          v2 = json.loads(
              Path("research/package-adjustment-v2/package_vote_v2_results.json").read_text()
          )
          assert v2["status"] == "research_only"
          assert v2["consumer_changed"] is False
          assert v2["market_value_consumer_changed"] is False
          assert v2["fundamental_value_consumer_changed"] is False
          assert v2["team_utility_consumer_changed"] is False

          index = Path("index.html").read_text()
          assert "package-adjustment-v2/package_vote_challenges_v2.json" in index
          assert "__pkgv2__|${id}|${choice}" in index
          assert "__pkgv2_meta__|${left}" in index
          assert "__pkgv2_schema__|2" in index

          ktc = Path("scripts/market/ktc_pipeline.py").read_text()
          assert '"__pkgv1__|"' in ktc
          assert '"__pkgv2__|"' in ktc
          assert "PACKAGE_VOTE_PREFIXES" in ktc
          assert "rows = [r for r in all_rows if not is_package_vote_row(r)]" in ktc

          v0 = json.loads(
              Path("research/package-adjustment-v0/package_adjustment_v0.json").read_text()
          )
          assert v0["production_formula_enabled"] is False

          v2_diag = Path(
              "research/package-adjustment-v2/package_vote_v2_fit_diagnostics.json"
          )
          if v2_diag.exists():
              diag = json.loads(v2_diag.read_text())
              assert diag["status"] == "research_only"
              assert diag["production_consumer_changed"] is False
              assert diag["diagnostics"]["conclusion"]["production_promotion_allowed"] is False

          print("Package voting V1/V2 research-only contract verified.")
          PY

      - name: Commit changed research results
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v1/package_vote_results.json
          git add research/package-adjustment-v1/package_vote_results.md

          if [ -f research/package-adjustment-v1/package_vote_fit_diagnostics.json ]; then
            git add research/package-adjustment-v1/package_vote_fit_diagnostics.json
            git add research/package-adjustment-v1/package_vote_fit_diagnostics.md
          fi

          git add research/package-adjustment-v2/package_vote_v2_results.json
          git add research/package-adjustment-v2/package_vote_v2_results.md

          if [ -f research/package-adjustment-v2/package_vote_v2_fit_diagnostics.json ]; then
            git add research/package-adjustment-v2/package_vote_v2_fit_diagnostics.json
            git add research/package-adjustment-v2/package_vote_v2_fit_diagnostics.md
          fi

          if git diff --cached --quiet; then
            echo "No package-vote result changes."
            exit 0
          fi

          git commit -m "Update package voting research"
          git pull --rebase origin main
          git push origin main
