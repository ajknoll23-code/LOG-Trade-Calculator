name: Package Vote Aggregation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: pip install requests numpy

      - name: Aggregate Package Preference V1 votes
        shell: bash
        run: |
          python3 scripts/market/package_vote_pipeline.py --selftest
          python3 scripts/market/package_vote_pipeline.py

      - name: Run Package Vote Fit Diagnostics V1
        shell: bash
        run: |
          python3 scripts/market/package_vote_fit_diagnostics.py --selftest

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          results = json.loads(
              Path("research/package-adjustment-v1/package_vote_results.json").read_text()
          )
          ready = results["summary"]["promotion_data_gates"]["all_passed"]

          if ready:
              subprocess.run(
                  ["python3", "scripts/market/package_vote_fit_diagnostics.py"],
                  check=True,
              )
          else:
              print("Package vote collection gates are not all passed; diagnostics skipped.")
          PY

      - name: Verify research-only contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(
              Path(
                  "research/package-adjustment-v1/package_vote_results.json"
              ).read_text()
          )

          assert results["status"] == "research_only"
          assert results["consumer_changed"] is False
          assert results["market_value_consumer_changed"] is False
          assert results["package_daily_cap_per_voter"] == 10

          v0 = json.loads(
              Path(
                  "research/package-adjustment-v0/package_adjustment_v0.json"
              ).read_text()
          )
          assert v0["production_formula_enabled"] is False

          index = Path("index.html").read_text()
          assert "packageVoteWrap" in index
          assert "__pkgv1__|${id}|${choice}" in index

          ktc = Path("scripts/market/ktc_pipeline.py").read_text()
          assert 'PACKAGE_VOTE_PREFIX = "__pkgv1__|"' in ktc
          assert (
              "rows = [r for r in all_rows if not is_package_vote_row(r)]"
              in ktc
          )

          diagnostic_path = Path(
              "research/package-adjustment-v1/package_vote_fit_diagnostics.json"
          )
          if results["summary"]["promotion_data_gates"]["all_passed"]:
              assert diagnostic_path.exists()
              diag = json.loads(diagnostic_path.read_text())
              assert diag["status"] == "research_only"
              assert diag["production_consumer_changed"] is False
              assert diag["market_value_consumer_changed"] is False
              assert diag["fundamental_value_consumer_changed"] is False
              assert diag["team_utility_consumer_changed"] is False
              assert diag["diagnostics"]["conclusion"]["production_promotion_allowed"] is False

          print("Package-vote research-only contract verified.")
          PY

      - name: Commit changed research results
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v1/package_vote_results.json
          git add research/package-adjustment-v1/package_vote_results.md

          if [ -f research/package-adjustment-v1/package_vote_fit_diagnostics.json ]; then
            git add research/package-adjustment-v1/package_vote_fit_diagnostics.json
            git add research/package-adjustment-v1/package_vote_fit_diagnostics.md
          fi

          if git diff --cached --quiet; then
            echo "No package-vote result changes."
            exit 0
          fi

          git commit -m "Update package voting research diagnostics"
          git pull --rebase origin main
          git push origin main
