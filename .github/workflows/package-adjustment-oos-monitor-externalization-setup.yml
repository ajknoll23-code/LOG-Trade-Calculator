name: Package Adjustment OOS Monitor Externalization Setup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  externalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Snapshot protected files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          protected = [
              "index.html",
              "research/package-adjustment-production-candidate-v1/live_deployment.json",
              "research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_5.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json",
              ".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml",
              "scripts/validation/check_package_adjustment_live.py",
              "research/package-adjustment-v5/promotion_readiness.json",
              "research/package-adjustment-v5/production_candidate_design.json",
              "research/package-adjustment-v5/shadow_regression_hardening.json",
          ]

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          missing = [p for p in protected if not Path(p).exists()]
          if missing:
              raise RuntimeError(f"Missing protected files before externalization: {missing}")

          Path("/tmp/oos_externalize_protected.json").write_text(
              json.dumps({p: sha(p) for p in protected}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Protected-file snapshot recorded.")
          PY

      - name: Externalize exact current V1.5 monitor logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import textwrap
          from datetime import datetime, timezone

          workflow_path = Path(".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml")
          out_script = Path("scripts/validation/package_adjustment_exact_live_oos_v1_5.py")
          out_json = Path("research/package-adjustment-v5/oos_monitor_externalization.json")
          out_md = Path("research/package-adjustment-v5/oos_monitor_externalization.md")

          text = workflow_path.read_text(encoding="utf-8")
          lines = text.splitlines()

          start = None
          end = None
          for i, line in enumerate(lines):
              if "python - <<'PY'" in line or 'python - <<\'PY\'' in line or 'python3 - <<\'PY\'' in line:
                  start = i + 1
                  break
          if start is None:
              raise RuntimeError("Could not find embedded exact-live Python start marker")

          for i in range(start, len(lines)):
              if lines[i].strip() == "PY":
                  end = i
                  break
          if end is None:
              raise RuntimeError("Could not find embedded exact-live Python end marker")

          raw_block = "\n".join(lines[start:end]) + "\n"
          script = textwrap.dedent(raw_block)

          required = [
              "def extract_formula(",
              "def verify_live_metadata(",
              "def composition_supported(",
              "def classify_trade(",
              "exact_live_oos_validation.json",
              "release_manifest_v1_5.json",
              "v1.5-audit-step6-scope-ui-idp",
          ]
          missing = [token for token in required if token not in script]
          if missing:
              raise RuntimeError(f"Externalized script is missing expected V1.5 monitor logic: {missing}")

          # Refuse to externalize any shell/YAML residue.
          forbidden = [
              "uses: actions/",
              "git commit -m",
              "git push origin",
              "permissions:",
          ]
          leaked = [token for token in forbidden if token in script]
          if leaked:
              raise RuntimeError(f"Extraction leaked workflow content into Python: {leaked}")

          out_script.parent.mkdir(parents=True, exist_ok=True)
          out_script.write_text(
              "#!/usr/bin/env python3\n"
              "# AUTO-EXTERNALIZED FROM THE EXACT CONTROLLED-LIVE V1.5 OOS WORKFLOW.\n"
              "# This file preserves the previous inline monitor logic byte-for-logic;\n"
              "# it is retained as the V1.5 compatibility implementation.\n\n"
              + script,
              encoding="utf-8",
          )

          script_sha = hashlib.sha256(out_script.read_bytes()).hexdigest()
          workflow_sha = hashlib.sha256(workflow_path.read_bytes()).hexdigest()
          extracted_payload_sha = hashlib.sha256(script.encode("utf-8")).hexdigest()

          doc = {
              "schema_version": 1,
              "status": "v1_5_oos_monitor_logic_externalized",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_workflow_path": str(workflow_path),
              "source_workflow_sha256": workflow_sha,
              "source_embedded_python_sha256": extracted_payload_sha,
              "externalized_script_path": str(out_script),
              "externalized_script_sha256": script_sha,
              "production_formula_changed": False,
              "live_workflow_changed": False,
              "production_revision": "v1.5-audit-step6-scope-ui-idp",
              "purpose": (
                  "move exact-live OOS implementation out of workflow YAML so future "
                  "formula revisions can update normal tracked Python without GitHub "
                  "workflow-file permission failures"
              ),
              "next_step": "build_transition_dispatcher_and_thin_permanent_workflow",
          }
          out_json.write_text(
              json.dumps(doc, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          out_md.write_text(
              "# Package Adjustment — OOS Monitor Externalization\n\n"
              "**No production or workflow change performed.**\n\n"
              "The exact Python implementation embedded in the permanent V1.5 OOS "
              "workflow has been copied into a normal tracked validator script. This "
              "preserves the current monitor implementation while removing the need "
              "for future formula changes to edit a giant inline workflow.\n\n"
              f"- Source workflow SHA-256: `{workflow_sha}`\n"
              f"- Externalized script SHA-256: `{script_sha}`\n"
              "- Current production revision remains `v1.5-audit-step6-scope-ui-idp`.\n"
              "- Permanent workflow is still byte-identical at this step.\n\n"
              "Next: add a V1.5/V1.6 dispatcher and replace the permanent workflow "
              "manually with a thin runner.\n",
              encoding="utf-8",
          )

          print("Externalized:", out_script)
          print("Source workflow SHA:", workflow_sha)
          print("Externalized script SHA:", script_sha)
          PY

      - name: Compile externalized Python
        run: python3 -m py_compile scripts/validation/package_adjustment_exact_live_oos_v1_5.py

      - name: Verify extracted implementation contract
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path("scripts/validation/package_adjustment_exact_live_oos_v1_5.py")
          tree = ast.parse(path.read_text(encoding="utf-8"))

          funcs = {
              n.name
              for n in ast.walk(tree)
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required_funcs = {
              "extract_formula",
              "verify_live_metadata",
              "composition_supported",
              "classify_trade",
          }
          missing = sorted(required_funcs - funcs)
          if missing:
              raise RuntimeError(f"Externalized V1.5 monitor missing functions: {missing}")

          doc = json.loads(
              Path("research/package-adjustment-v5/oos_monitor_externalization.json")
              .read_text(encoding="utf-8")
          )
          assert doc["status"] == "v1_5_oos_monitor_logic_externalized"
          assert doc["production_formula_changed"] is False
          assert doc["live_workflow_changed"] is False
          assert doc["production_revision"] == "v1.5-audit-step6-scope-ui-idp"

          print("Externalized monitor contract validated.")
          PY

      - name: Verify protected files remain byte-identical
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          before = json.loads(
              Path("/tmp/oos_externalize_protected.json").read_text(encoding="utf-8")
          )

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          changed = []
          for path, expected in before.items():
              p = Path(path)
              if not p.exists():
                  changed.append((path, expected, "MISSING"))
                  continue
              actual = sha(path)
              if actual != expected:
                  changed.append((path, expected, actual))

          if changed:
              raise RuntimeError(f"Protected files changed during externalization: {changed}")

          print("All protected production/workflow files remain byte-identical.")
          PY

      - name: Guard change set
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              "scripts/validation/package_adjustment_exact_live_oos_v1_5.py",
              "research/package-adjustment-v5/oos_monitor_externalization.json",
              "research/package-adjustment-v5/oos_monitor_externalization.md",
          }

          out = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          paths = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(f"Unexpected externalization changes: {unexpected}")

          missing = sorted(p for p in allowed if not Path(p).exists())
          if missing:
              raise RuntimeError(f"Expected externalization outputs missing: {missing}")

          print("Externalization change set verified.")
          PY

      - name: Whitespace check
        run: git diff --check

      - name: Commit externalized monitor logic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/validation/package_adjustment_exact_live_oos_v1_5.py \
            research/package-adjustment-v5/oos_monitor_externalization.json \
            research/package-adjustment-v5/oos_monitor_externalization.md

          if git diff --cached --quiet; then
            echo "No OOS externalization changes to commit."
            exit 0
          fi

          git commit -m "Externalize Package Adjustment exact-live OOS monitor"
          git push
