name: Package Vote Aggregation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: pip install requests numpy

      - name: Aggregate Package Preference V4 votes
        shell: bash
        run: |
          python3 scripts/market/package_vote_v4_pipeline.py --selftest
          python3 scripts/market/package_vote_v4_pipeline.py

      - name: Run Package Vote V4 diagnostics when gates pass
        shell: bash
        run: |
          python3 scripts/market/package_vote_v4_fit_diagnostics.py --selftest
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          results = json.loads(
              Path("research/package-adjustment-v4/package_vote_v4_results.json").read_text()
          )
          gates = results["summary"]["diagnostic_data_gates"]["all_passed"]

          if gates:
              subprocess.run(
                  ["python3", "scripts/market/package_vote_v4_fit_diagnostics.py"],
                  check=True,
              )
          else:
              s = results["summary"]
              print("V4 diagnostic collection gates not all passed; diagnostics skipped.")
              print("Votes:", s["raw_vote_count"])
              print("Voters:", s["unique_voters"])
              print("Challenges:", s["distinct_challenges"])
              print("Targets:", s["distinct_targets"])
              print("By ratio:", s["by_ratio_target"])
          PY

      - name: Refresh Package Adjustment Shadow V2 when V4 diagnostics exist
        shell: bash
        run: |
          if [ -f research/package-adjustment-v4/package_vote_v4_fit_diagnostics.json ]; then
            python3 scripts/market/build_package_adjustment_shadow_v2.py --selftest
            python3 scripts/market/build_package_adjustment_shadow_v2.py
          else
            echo "V4 diagnostics not present yet; Shadow V2 refresh skipped."
          fi

      - name: Verify V3 frozen, V4 active, Shadow V2 isolated
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # V3 stays frozen historical calibration evidence.
          v3_catalog = json.loads(
              Path("research/package-adjustment-v3/package_vote_challenges_v3.json").read_text()
          )
          assert v3_catalog["status"] == "frozen_package_preference_v3"
          assert v3_catalog["frozen"] is True
          assert v3_catalog["consumer_changed"] is False
          assert v3_catalog["production_formula_enabled"] is False

          v3_results = json.loads(
              Path("research/package-adjustment-v3/package_vote_v3_results.json").read_text()
          )
          assert v3_results["status"] == "research_only"
          assert v3_results["consumer_changed"] is False

          # V4 remains the active package-vote experiment.
          v4_catalog = json.loads(
              Path("research/package-adjustment-v4/package_vote_challenges_v4.json").read_text()
          )
          assert v4_catalog["status"] == "frozen_package_preference_v4"
          assert v4_catalog["frozen"] is True
          assert v4_catalog["consumer_changed"] is False
          assert v4_catalog["production_formula_enabled"] is False
          assert len(v4_catalog["challenges"]) == 100
          assert v4_catalog["catalog_diagnostics"]["target_count"] == 20
          assert set(map(float, v4_catalog["design"]["ratio_targets"])) == {
              1.75, 1.85, 1.95, 2.05, 2.15
          }
          assert v4_catalog["design"]["package_sizes"] == [3]

          v4 = json.loads(
              Path("research/package-adjustment-v4/package_vote_v4_results.json").read_text()
          )
          assert v4["status"] == "research_only"
          assert v4["consumer_changed"] is False
          assert v4["market_value_consumer_changed"] is False
          assert v4["fundamental_value_consumer_changed"] is False
          assert v4["team_utility_consumer_changed"] is False
          assert v4["production_formula_enabled"] is False
          assert v4["package_daily_cap_per_voter"] == 20
          assert v4["voter_effective_lifetime_cap"] == 30.0

          # Shadow V1 stays historical research.
          shadow_v1 = json.loads(
              Path("research/package-adjustment-shadow-v1/package_adjustment_shadow_v1.json").read_text()
          )
          assert shadow_v1["status"] == "research_only_shadow"
          assert shadow_v1["consumer_changed"] is False
          assert shadow_v1["trade_verdict_consumer_changed"] is False

          # Once V4 diagnostics exist, Shadow V2 must also exist and remain isolated.
          diag_path = Path(
              "research/package-adjustment-v4/package_vote_v4_fit_diagnostics.json"
          )
          shadow_v2_path = Path(
              "research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json"
          )

          if diag_path.exists():
              diag = json.loads(diag_path.read_text())
              assert diag["status"] == "research_only"
              assert diag["production_consumer_changed"] is False
              assert diag["diagnostics"]["conclusion"]["production_promotion_allowed"] is False

              assert shadow_v2_path.exists()
              shadow_v2 = json.loads(shadow_v2_path.read_text())
              assert shadow_v2["schema_version"] == 2
              assert shadow_v2["status"] == "research_only_shadow"
              assert shadow_v2["consumer_changed"] is False
              assert shadow_v2["fundamental_value_consumer_changed"] is False
              assert shadow_v2["market_value_consumer_changed"] is False
              assert shadow_v2["team_utility_consumer_changed"] is False
              assert shadow_v2["trade_verdict_consumer_changed"] is False
              assert shadow_v2["production_formula_enabled"] is False
              assert shadow_v2["production_promotion_allowed"] is False
              assert shadow_v2["preferred_candidate"] == (
                  "hybrid_v3_2p_target_sensitive_v4_3p_ratio_only"
              )
              assert shadow_v2["torture_tests_all_passed"] is True

              size3 = shadow_v2["size3"]
              assert 1.75 <= float(size3["multiplier"]) <= 2.15
              assert float(size3["raw_2_05_package_choice_pct"]) == 50.0
              assert float(size3["bootstrap_within_tested_range_pct"]) >= 80.0

          index = Path("index.html").read_text()
          assert "package-adjustment-v4/package_vote_challenges_v4.json" in index
          assert "__pkgv4__|${id}|${choice}" in index
          assert "__pkgv4_meta__|${left}" in index
          assert "__pkgv4_schema__|4" in index
          assert "package_votes_v4_" in index
          assert "package_vote_recent_v4" in index
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in index

          ktc = Path("scripts/market/ktc_pipeline.py").read_text()
          for marker in ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|"):
              assert f'"{marker}"' in ktc
          assert "rows = [r for r in all_rows if not is_package_vote_row(r)]" in ktc

          print("V3 frozen + V4 active + Shadow V2 research-only contract verified.")
          PY

      - name: Commit changed V4 and Shadow V2 research
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v4/package_vote_v4_results.json
          git add research/package-adjustment-v4/package_vote_v4_results.md

          if [ -f research/package-adjustment-v4/package_vote_v4_fit_diagnostics.json ]; then
            git add research/package-adjustment-v4/package_vote_v4_fit_diagnostics.json
            git add research/package-adjustment-v4/package_vote_v4_fit_diagnostics.md
          fi

          if [ -f research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json ]; then
            git add research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json
            git add research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.md
          fi

          if git diff --cached --quiet; then
            echo "No V4 / Shadow V2 research changes."
            exit 0
          fi

          git commit -m "Update Package Voting V4 and Shadow V2 research"
          git pull --rebase origin main
          git push origin main
