name: Package Vote Aggregation V5

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install research dependencies
        run: pip install requests

      - name: Verify controlled-live Package Adjustment before research update
        run: |
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Aggregate Package Preference V5 votes
        shell: bash
        run: |
          python3 scripts/market/package_vote_v5_pipeline.py --selftest
          python3 scripts/market/package_vote_v5_pipeline.py

      - name: Report V5 evidence maturity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("research/package-adjustment-v5/package_vote_v5_results.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          s = result["summary"]
          gates = s["diagnostic_data_gates"]

          print("V5 RESEARCH ONLY")
          print("Release:", result["release_id"])
          print("Votes:", s["raw_vote_count"])
          print("Unique voters:", s["unique_voters"])
          print("Distinct challenges:", s["distinct_challenges"])
          print("Distinct targets:", s["distinct_targets"])
          print("Package choice %:", s["package_choice_pct"])
          print("Weighted package choice %:", s["weighted_package_choice_pct"])
          print("Display-left choice %:", s["display_left_choice_pct"])
          print("By composition:")
          for label, row in s["by_composition"].items():
              print(" ", label, row)
          print("Maturity gates:", gates["passed"])
          print("All maturity gates passed:", gates["all_passed"])

          assert result["status"] == "research_only"
          assert result["production_formula_enabled"] is False
          assert result["automatic_production_change_allowed"] is False
          assert result["consumer_changed"] is False
          assert result["fundamental_value_consumer_changed"] is False
          assert result["market_value_consumer_changed"] is False
          assert result["team_utility_consumer_changed"] is False
          assert result["trade_verdict_consumer_changed"] is False
          PY

      - name: Verify V5 active and V3 V4 frozen
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          v3_path = Path("research/package-adjustment-v3/package_vote_challenges_v3.json")
          v4_path = Path("research/package-adjustment-v4/package_vote_challenges_v4.json")
          v5_path = Path("research/package-adjustment-v5/package_vote_challenges_v5.json")
          release_path = Path("research/package-adjustment-v5/release_manifest.json")

          v3 = json.loads(v3_path.read_text(encoding="utf-8"))
          v4 = json.loads(v4_path.read_text(encoding="utf-8"))
          v5 = json.loads(v5_path.read_text(encoding="utf-8"))
          release = json.loads(release_path.read_text(encoding="utf-8"))

          assert v3["status"] == "frozen_package_preference_v3"
          assert v3["frozen"] is True
          assert v4["status"] == "frozen_package_preference_v4"
          assert v4["frozen"] is True

          assert v5["schema_version"] == 5
          assert v5["status"] == "frozen_package_preference_v5"
          assert v5["frozen"] is True
          assert v5["production_formula_enabled"] is False
          assert v5["design"]["package_sizes"] == [2]
          assert v5["design"]["composition_labels"] == [
              "50/50", "55/45", "60/40", "65/35", "70/30", "75/25"
          ]
          assert v5["catalog_diagnostics"]["challenge_count"] == 640
          assert v5["catalog_diagnostics"]["target_count"] == 20
          assert v5["catalog_diagnostics"]["skipped_cell_count"] == 0

          assert release["frozen"] is True
          assert release["research_only"] is True
          assert release["release_id"] == "package-adjustment-v5-composition-voting-v1"
          assert release["production_revision"] == "v1.5-audit-step6-scope-ui-idp"
          assert release["production_formula_changed"] is False
          assert release["automatic_production_change_allowed"] is False
          assert release["catalog_sha256"] == hashlib.sha256(v5_path.read_bytes()).hexdigest()

          index = Path("index.html").read_text(encoding="utf-8")
          assert "package-adjustment-v5/package_vote_challenges_v5.json" in index
          assert "__pkgv5__|${id}|${choice}" in index
          assert "__pkgv5_meta__|${left}" in index
          assert "__pkgv5_schema__|5" in index
          assert "package_votes_v5_" in index
          assert "package_vote_recent_v5" in index

          ktc_path = Path("scripts/market/ktc_pipeline.py")
          tree = ast.parse(ktc_path.read_text(encoding="utf-8"))
          prefixes = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "PACKAGE_VOTE_PREFIXES":
                          prefixes = ast.literal_eval(node.value)
                          break
              if prefixes is not None:
                  break

          assert prefixes == (
              "__pkgv1__|",
              "__pkgv2__|",
              "__pkgv3__|",
              "__pkgv4__|",
              "__pkgv5__|",
          )

          print("PASS V5 active research + frozen V3/V4 + KTC transport isolation.")
          PY

      - name: Protect production and frozen research evidence
        shell: bash
        run: |
          git diff --exit-code -- index.html
          git diff --exit-code -- research/package-adjustment-v3
          git diff --exit-code -- research/package-adjustment-v4
          git diff --exit-code -- research/package-adjustment-v5/package_vote_challenges_v5.json
          git diff --exit-code -- research/package-adjustment-v5/release_manifest.json
          git diff --exit-code -- research/package-adjustment-v5/composition_study_design.md
          git diff --exit-code -- research/package-adjustment-v5/voting_activation.md
          git diff --exit-code -- research/package-adjustment-production-candidate-v1
          git diff --exit-code -- scripts/market/ktc_pipeline.py
          git diff --exit-code -- scripts/market/package_vote_v5_pipeline.py
          git diff --exit-code -- scripts/validation
          git diff --exit-code -- .github/workflows

      - name: Verify only V5 result files changed
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "research/package-adjustment-v5/package_vote_v5_results.json",
              "research/package-adjustment-v5/package_vote_v5_results.md",
          }

          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()

          paths = set()
          for row in rows:
              if not row.strip():
                  continue
              path = row[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(f"Unexpected V5 aggregation changes: {unexpected}")

          missing = sorted(allowed - paths)
          if missing:
              raise RuntimeError(f"Expected V5 result files missing: {missing}")

          print("V5 aggregation change set verified.")
          PY

      - name: Re-run permanent regressions after aggregation
        run: |
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Validate JSON and whitespace
        shell: bash
        run: |
          python3 -m json.tool research/package-adjustment-v5/package_vote_v5_results.json >/dev/null
          git diff --check

      - name: Commit V5 research results
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v5/package_vote_v5_results.json
          git add research/package-adjustment-v5/package_vote_v5_results.md

          if git diff --cached --quiet; then
            echo "No V5 research result changes."
            exit 0
          fi

          git commit -m "Update Package Voting V5 composition research"
          git pull --rebase origin main
          git push origin main
