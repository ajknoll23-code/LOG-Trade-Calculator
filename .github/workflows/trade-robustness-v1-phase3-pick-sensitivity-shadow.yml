name: Trade Robustness V1 Phase 3 Pick Sensitivity Shadow - Valid HOLD Fix V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  phase3-pick-sensitivity-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard Phase 1B anchor and freeze production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path(
                  "research/trade-robustness-v1/"
                  "trade_robustness_v1_phase1b_live_verdict_alignment.json"
              ).read_text(encoding="utf-8")
          )
          assert p["decision"] == "PASS_TRADE_ROBUSTNESS_V1_PHASE1B_LIVE_VERDICT_ALIGNMENT"
          assert p["production_thresholds"]["fair_trade_diff_pct_lt"] == 0.07
          assert p["production_thresholds"]["strongly_favors_diff_pct_gte"] == 0.20

          text = Path("index.html").read_text(encoding="utf-8")
          assert "const PICK_BASE = {" in text
          assert "const YEAR_DISCOUNT = {" in text
          assert "function pickValue(" in text
          assert "5: {early:1414, mid:1250, late:1118}" in text
          assert "6: {early:1014, mid:853,  late:740}" in text
          assert "function tradeVerdictTotals()" in text
          assert "function packageAdjustmentAssessment()" in text

          print("PASS: Phase 1B and production pick semantics anchored.")
          PY

          sha256sum \
            index.html \
            scripts/artifacts/generated/value_uncertainty.json \
            research/trade-robustness-v1/trade_robustness_v1_phase1_shadow.py \
            research/trade-robustness-v1/trade_robustness_v1_phase1b_live_verdict_alignment.py \
            research/trade-robustness-v1/trade_robustness_v1_phase1b_live_verdict_alignment.json \
            > "${RUNNER_TEMP}/protected.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Write frozen Phase 3 evaluator
        shell: bash
        env:
          EVALUATOR_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          out = Path(
              "research/trade-robustness-v1/"
              "trade_robustness_v1_phase3_pick_sensitivity_shadow.py"
          )
          out.write_bytes(base64.b64decode(os.environ["EVALUATOR_B64"]))
          compile(out.read_text(encoding="utf-8"), str(out), "exec")
          print(f"Wrote {out}")
          PY

      - name: Phase 3 evaluator self-test
        run: >-
          python3
          research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.py
          --selftest

      - name: Run Phase 3 pick sensitivity shadow
        run: >-
          python3
          research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.py
          --write

      - name: Verify Phase 3 artifacts
        run: >-
          python3
          research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.py
          --check

      - name: Report Phase 3 scientific decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path(
                  "research/trade-robustness-v1/"
                  "trade_robustness_v1_phase3_pick_sensitivity_shadow.json"
              ).read_text(encoding="utf-8")
          )
          failed = [
              key for key, value in (p.get("gates") or {}).items()
              if not value
          ]
          print(f"Decision: {p['decision']}")
          print(f"Failed gates: {failed}")
          if p["decision"].startswith("HOLD_"):
              print(
                  "::notice::Phase 3 produced a valid scientific HOLD. "
                  "No production/UI promotion is authorized."
              )
          else:
              print(
                  "::notice::Phase 3 produced PASS. "
                  "Production remains unchanged until a separate promotion phase."
              )
          PY

      - name: Prove production inputs unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/protected.sha256"
          echo "PASS: index, player uncertainty, and prior Trade Robustness anchors unchanged."

      - name: Show Phase 3 report
        run: cat research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.md

      - name: Verify exact research-only scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          allowed = {
              "research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.py",
              "research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.json",
              "research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.md",
              "research/trade-robustness-v1/trade_robustness_v1_phase3_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          unexpected = actual - allowed
          assert not unexpected, f"Unexpected Phase 3 changes: {sorted(unexpected)}"
          assert actual, "Phase 3 produced no research artifacts"

          print("PASS: Phase 3 is research-only with exact scope.")
          PY

          git diff --check

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Commit Phase 3 research
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.py \
            research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.json \
            research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.md \
            research/trade-robustness-v1/trade_robustness_v1_phase3_manifest.json

          git diff --cached --check
          git commit -m "Add Trade Robustness V1 pick sensitivity shadow"
          git pull --rebase origin main
          git push origin main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PASS: Trade Robustness V1 Phase 3 committed cleanly."
