name: Age Curve V2 Phase 3 Shadow Audit

# Research-only current-player shadow audit of empirical age candidates.
# This workflow does NOT change index.html, AGE_CURVE, Production V2,
# Market Value, or any deployed player value.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 3 self-test
        run: python3 research/age-curve-v2/age_curve_v2_phase3_shadow_audit.py --selftest

      - name: Build current-player age shadow audit
        run: python3 research/age-curve-v2/age_curve_v2_phase3_shadow_audit.py --write

      - name: Verify Phase 3 guardrails and outputs
        run: python3 research/age-curve-v2/age_curve_v2_phase3_shadow_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/age-curve-v2/age_curve_v2_phase3_shadow_audit.json
          git add research/age-curve-v2/age_curve_v2_phase3_shadow_audit.md
          git diff --staged --quiet || git commit -m "Add Age Curve V2 Phase 3 shadow audit"
          git push
