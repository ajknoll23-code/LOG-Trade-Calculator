name: A3 Identity V2 Phase 10 Terrell Jennings Production-Candidate Shadow

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact A2 Phase 9 authorization
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          p=D/"identity_v2_phase9_stable_id_corroboration.json"
          m=D/"identity_v2_phase9_manifest.json"

          r=json.loads(p.read_text())
          manifest=json.loads(m.read_text())

          assert r["decision"]==(
              "FREEZE_TERRELL_JENNINGS_FPID26964_SID12412_AS_"
              "EVIDENCE_BACKED_IDENTITY_CANDIDATE_AUTHORIZE_PHASE10_SHADOW"
          )
          assert r["phase10_authorized"] is True
          assert r["target"]=={
              "fantasypros_id":"26964",
              "sleeper_id":"12412",
              "name":"Terrell Jennings",
              "position":"RB"
          }
          assert all(r["hard_gates"].values())
          assert r["production_change_authorized"] is False
          assert r["production_crosswalk_mutated"] is False

          assert hashlib.sha256(p.read_bytes()).hexdigest()==(
              manifest["files"]["identity_v2_phase9_stable_id_corroboration.json"]
          )
          assert manifest["phase10_authorized"] is True
          assert manifest["production_changed"] is False

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          by={str(x["fantasypros_id"]):x for x in rows}
          tj=by["26964"]
          assert tj["name"]=="Terrell Jennings"
          assert tj["fp_position"]=="RB"
          assert tj["requires_manual_review"] is True
          assert tj["sleeper_id"] is None
          assert str(tj["candidate_sleeper_id"])=="12412"
          assert sum(bool(x.get("requires_manual_review")) for x in rows)==15

          # Phase-6 mappings must remain intact before opening a new shadow.
          assert str(by["26313"]["sleeper_id"])=="11760"
          assert str(by["27959"]["sleeper_id"])=="13457"
          assert str(by["28290"]["sleeper_id"])=="13482"

          print("PASS: exact A2 authorization and production baseline guarded.")
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Freeze A3 Phase 10 shadow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/identity-v2")
          outputs=[
              D/"identity_v2_phase10_preregistration.json",
              D/"identity_v2_phase10_direct_candidate_crosswalk.json",
              D/"identity_v2_phase10_control_refresh_crosswalk.json",
              D/"identity_v2_phase10_seeded_refresh_crosswalk.json",
              D/"identity_v2_phase10_production_candidate_shadow.json",
              D/"identity_v2_phase10_production_candidate_shadow.md",
              D/"identity_v2_phase10_manifest.json",
          ]
          for p in outputs:
              assert not p.exists(),f"refusing to overwrite {p}"

          prereg={
              "schema_version":1,
              "study_id":"identity-v2-phase10-terrell-jennings-production-candidate-shadow",
              "status":"FROZEN_ONE_MAPPING_SHADOW",
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "deployment_authorized":False,
              "candidate_mapping":{
                  "fantasypros_id":"26964",
                  "name":"Terrell Jennings",
                  "sleeper_id":"12412",
                  "position":"RB",
                  "evidence_basis":"Phase 9 independent direct FPID↔Sleeper-ID bridge with GSIS and PFR corroboration."
              },
              "protected_existing_deployed_mappings":{
                  "26313":"11760",
                  "27959":"13457",
                  "28290":"13482"
              },
              "protected_taxonomy_hold":{
                  "26157":"Jonah Elliss"
              },
              "direct_shadow_hard_gates":[
                  "Production target exists exactly once and is still manual.",
                  "Direct shadow changes exactly FPID 26964 and no other row.",
                  "Target receives Sleeper ID 12412 and becomes authoritative/non-manual.",
                  "Manual-review count changes exactly 15 to 14.",
                  "All other 14 current manual-review rows remain byte-identical.",
                  "All three Phase-6 deployed mappings remain byte-identical.",
                  "No authoritative Sleeper-ID collision is introduced."
              ],
              "successor_shadow_hard_gates":[
                  "Control and seeded resolver arms use identical current source inputs.",
                  "Seeded-vs-control resolver output differs only on FPID 26964.",
                  "The 26964↔12412 stable-ID pair survives the unchanged production resolver.",
                  "Jonah Elliss remains held and identical between causal arms.",
                  "All Phase-6 deployed mappings remain identical between causal arms.",
                  "No authoritative Sleeper-ID collision is introduced."
              ],
              "temporary_regression_rule":"The direct candidate may temporarily replace scripts/identity_crosswalk.json only for regression testing and must be restored byte-for-byte before any commit.",
              "pass_rule":"All direct and successor hard gates plus full repository regressions must pass.",
              "next_step_if_pass":"Authorize a separate exact-scope Phase 11 deployment workflow for FPID 26964 -> Sleeper SID 12412 only.",
              "production_change_authorized":False
          }
          (D/"identity_v2_phase10_preregistration.json").write_text(
              json.dumps(prereg,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A3 Phase 10 shadow contract frozen.")
          PY

      - name: Build direct and successor shadows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import copy,importlib.util,json
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          PR=D/"identity_v2_phase10_preregistration.json"
          PROD=Path("scripts/identity_crosswalk.json")
          RESOLVER=Path("scripts/projections/resolve_fantasypros_sleeper_identity.py")

          DIRECT=D/"identity_v2_phase10_direct_candidate_crosswalk.json"
          CONTROL=D/"identity_v2_phase10_control_refresh_crosswalk.json"
          SEEDED=D/"identity_v2_phase10_seeded_refresh_crosswalk.json"
          OUT=D/"identity_v2_phase10_production_candidate_shadow.json"
          MD=D/"identity_v2_phase10_production_candidate_shadow.md"

          prereg=json.loads(PR.read_text())
          prod=json.loads(PROD.read_text())
          target=prereg["candidate_mapping"]
          target_fpid=target["fantasypros_id"]
          target_sid=target["sleeper_id"]

          def key(row):
              v=row.get("fantasypros_id")
              return None if v in (None,"") else str(v)

          def index(rows,label):
              out={}
              for r in rows:
                  k=key(r)
                  if k is None:
                      continue
                  assert k not in out,(label,"duplicate",k)
                  out[k]=r
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          def diff(a,b):
              aa=index(a,"A"); bb=index(b,"B")
              return sorted(
                  k for k in set(aa)|set(bb)
                  if canon(aa.get(k))!=canon(bb.get(k))
              )

          def collisions(rows):
              by=defaultdict(list)
              for r in rows:
                  sid=r.get("sleeper_id")
                  fpid=key(r)
                  if not sid or not fpid or r.get("requires_manual_review"):
                      continue
                  by[str(sid)].append(fpid)
              return {
                  sid:fpids for sid,fpids in by.items()
                  if len(fpids)>1
              }

          prod_idx=index(prod,"production")
          assert target_fpid in prod_idx
          before=prod_idx[target_fpid]
          assert before["name"]==target["name"]
          assert before["fp_position"]==target["position"]
          assert before["requires_manual_review"] is True
          assert before["sleeper_id"] is None
          assert str(before["candidate_sleeper_id"])==target_sid

          current_manual={
              k for k,r in prod_idx.items()
              if r.get("requires_manual_review") is True
          }
          assert len(current_manual)==15
          assert target_fpid in current_manual

          direct=copy.deepcopy(prod)
          direct_idx=index(direct,"direct")
          row=direct_idx[target_fpid]
          row["sleeper_id"]=target_sid
          row["candidate_sleeper_id"]=target_sid
          row["requires_manual_review"]=False
          row["match_confidence"]="high"
          row["match_method"]="phase10_independent_stable_id_corroboration"

          direct_changed=diff(prod,direct)
          other_manual=current_manual-{target_fpid}
          phase6={"26313":"11760","27959":"13457","28290":"13482"}

          direct_gates={
              "target_present_once_and_initially_manual":True,
              "exactly_one_changed_fpid_26964":
                  direct_changed==[target_fpid],
              "target_sid_applied":
                  str(direct_idx[target_fpid]["sleeper_id"])==target_sid,
              "target_authoritative_nonmanual":
                  direct_idx[target_fpid]["requires_manual_review"] is False
                  and direct_idx[target_fpid]["match_confidence"]=="high",
              "manual_count_15_to_14":
                  sum(bool(r.get("requires_manual_review")) for r in prod)==15
                  and sum(bool(r.get("requires_manual_review")) for r in direct)==14,
              "all_other_14_manual_rows_byte_identical":
                  all(
                      canon(prod_idx[k])==canon(direct_idx[k])
                      for k in other_manual
                  ),
              "phase6_deployed_rows_byte_identical":
                  all(
                      canon(prod_idx[k])==canon(direct_idx[k])
                      and str(direct_idx[k]["sleeper_id"])==sid
                      for k,sid in phase6.items()
                  ),
              "no_authoritative_sid_collision":
                  not collisions(direct)
          }
          assert all(direct_gates.values()),direct_gates
          DIRECT.write_text(json.dumps(direct,indent=2,sort_keys=True)+"\n")

          spec=importlib.util.spec_from_file_location("identity_resolver",RESOLVER)
          assert spec is not None and spec.loader is not None
          resolver=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(resolver)

          fp_doc=resolver.read_json(resolver.FP_PATH)
          totals=resolver.read_json(resolver.SLEEPER_TOTAL_PATH)
          raw=resolver.read_json(resolver.SLEEPER_RAW_PATH)
          teams=resolver.read_json(resolver.TEAM_REFRESH_PATH)

          control=resolver.build_production_crosswalk(
              fp_doc,totals,raw,teams,prod
          )
          seeded=resolver.build_production_crosswalk(
              fp_doc,totals,raw,teams,direct
          )
          CONTROL.write_text(json.dumps(control,indent=2,sort_keys=True)+"\n")
          SEEDED.write_text(json.dumps(seeded,indent=2,sort_keys=True)+"\n")

          control_idx=index(control,"control")
          seeded_idx=index(seeded,"seeded")
          successor_changed=diff(control,seeded)

          successor_gates={
              "seeded_vs_control_exactly_26964":
                  successor_changed==[target_fpid],
              "stable_pair_survives_resolver":
                  str(seeded_idx[target_fpid].get("sleeper_id"))==target_sid
                  and seeded_idx[target_fpid].get("requires_manual_review") is False,
              "jonah_elliss_unchanged_and_held":
                  canon(control_idx["26157"])==canon(seeded_idx["26157"])
                  and seeded_idx["26157"].get("requires_manual_review") is True,
              "phase6_rows_identical_between_arms":
                  all(
                      canon(control_idx[k])==canon(seeded_idx[k])
                      and str(seeded_idx[k].get("sleeper_id"))==sid
                      for k,sid in phase6.items()
                  ),
              "all_non_target_rows_identical_between_arms":
                  all(
                      canon(control_idx[k])==canon(seeded_idx[k])
                      for k in set(control_idx)&set(seeded_idx)
                      if k!=target_fpid
                  )
                  and set(control_idx)==set(seeded_idx),
              "no_authoritative_sid_collision":
                  not collisions(seeded)
          }
          assert all(successor_gates.values()),successor_gates

          live_source_drift=diff(prod,control)

          decision=(
              "PASS_IDENTITY_V2_PHASE10_ONE_PLAYER_PRODUCTION_CANDIDATE_SHADOW_"
              "AUTHORIZE_PHASE11_EXACT_SCOPE_DEPLOYMENT"
          )

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase10-terrell-jennings-production-candidate-shadow",
              "status":"PRODUCTION_CANDIDATE_SHADOW_COMPLETE",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "research_only":True,
              "production_change_authorized":False,
              "deployment_authorized":False,
              "phase11_exact_scope_deployment_authorized":True,
              "candidate_mapping":{
                  "26964":{
                      "name":"Terrell Jennings",
                      "sleeper_id":"12412"
                  }
              },
              "direct_shadow":{
                  "changed_fpids":direct_changed,
                  "changed_count":len(direct_changed),
                  "manual_review_count_before":15,
                  "manual_review_count_after":14,
                  "authoritative_sid_collisions":collisions(direct),
                  "hard_gates":direct_gates,
                  "all_hard_gates_pass":all(direct_gates.values())
              },
              "successor_resolver_shadow":{
                  "seeded_vs_control_changed_fpids":successor_changed,
                  "seeded_vs_control_changed_count":len(successor_changed),
                  "authoritative_sid_collisions":collisions(seeded),
                  "hard_gates":successor_gates,
                  "all_hard_gates_pass":all(successor_gates.values())
              },
              "live_source_drift_diagnostic":{
                  "production_vs_control_refresh_changed_count":
                      len(live_source_drift),
                  "production_vs_control_refresh_changed_fpids":
                      live_source_drift
              },
              "protected_holds":{
                  "jonah_elliss_26157_remains_held":True,
                  "other_current_manual_rows_unchanged_in_direct_shadow":True
              },
              "next_step_rule":"A PASS authorizes only A4/Phase 11 exact-scope deployment of FPID 26964 -> Sleeper SID 12412, with full successor and repository regression proofs. This workflow does not deploy."
          }
          OUT.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 10 — Terrell Jennings Production-Candidate Shadow",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Candidate: **Terrell Jennings FPID 26964 → Sleeper SID 12412**",
              f"- Direct changed FPIDs: **{direct_changed}**",
              "- Direct manual-review count: **15 → 14**",
              f"- Successor seeded-vs-control changed FPIDs: **{successor_changed}**",
              f"- Live-source drift diagnostic count: **{len(live_source_drift)}**",
              "- Jonah Elliss remains held: **Yes**",
              "- Production changed: **No**",
              "",
              "A PASS authorizes only a separate exact-scope deployment workflow.",
              ""
          ]
          MD.write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Validate A3 shadow output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          r=json.loads(
              (D/"identity_v2_phase10_production_candidate_shadow.json").read_text()
          )
          assert r["decision"]==(
              "PASS_IDENTITY_V2_PHASE10_ONE_PLAYER_PRODUCTION_CANDIDATE_SHADOW_"
              "AUTHORIZE_PHASE11_EXACT_SCOPE_DEPLOYMENT"
          )
          assert r["candidate_mapping"]=={
              "26964":{
                  "name":"Terrell Jennings",
                  "sleeper_id":"12412"
              }
          }
          assert r["direct_shadow"]["changed_fpids"]==["26964"]
          assert r["direct_shadow"]["changed_count"]==1
          assert r["direct_shadow"]["manual_review_count_before"]==15
          assert r["direct_shadow"]["manual_review_count_after"]==14
          assert r["direct_shadow"]["all_hard_gates_pass"] is True
          assert r["successor_resolver_shadow"]["seeded_vs_control_changed_fpids"]==["26964"]
          assert r["successor_resolver_shadow"]["all_hard_gates_pass"] is True
          assert r["phase11_exact_scope_deployment_authorized"] is True
          assert r["production_change_authorized"] is False
          assert r["deployment_authorized"] is False
          print("PASS: A3 shadow result validated.")
          PY

      - name: Regression test direct candidate temporarily
        shell: bash
        run: |
          set -euo pipefail

          PROD="scripts/identity_crosswalk.json"
          CAND="research/identity-v2/identity_v2_phase10_direct_candidate_crosswalk.json"
          cp "$PROD" "${RUNNER_TEMP}/identity_crosswalk.production.json"
          sha256sum "$PROD" > "${RUNNER_TEMP}/identity_crosswalk.production.sha256"

          restore_prod() {
            cp "${RUNNER_TEMP}/identity_crosswalk.production.json" "$PROD"
          }
          trap restore_prod EXIT

          cp "$CAND" "$PROD"
          python3 scripts/validation/repo_regression_checks.py

          restore_prod
          trap - EXIT
          sha256sum -c "${RUNNER_TEMP}/identity_crosswalk.production.sha256"
          git diff --exit-code -- "$PROD"
          echo "PASS: candidate regressions green and production crosswalk restored byte-for-byte."

      - name: Freeze A3 manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          D=Path("research/identity-v2")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=json.loads(
              (D/"identity_v2_phase10_production_candidate_shadow.json").read_text()
          )
          files=[
              "identity_v2_phase10_preregistration.json",
              "identity_v2_phase10_direct_candidate_crosswalk.json",
              "identity_v2_phase10_control_refresh_crosswalk.json",
              "identity_v2_phase10_seeded_refresh_crosswalk.json",
              "identity_v2_phase10_production_candidate_shadow.json",
              "identity_v2_phase10_production_candidate_shadow.md"
          ]
          m={
              "schema_version":1,
              "study_id":"identity-v2-phase10-terrell-jennings-production-candidate-shadow",
              "decision":r["decision"],
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "files":{f:sha(D/f) for f in files},
              "phase11_exact_scope_deployment_authorized":
                  r["phase11_exact_scope_deployment_authorized"],
              "production_change_authorized":False,
              "production_changed":False
          }
          (D/"identity_v2_phase10_manifest.json").write_text(
              json.dumps(m,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A3 manifest frozen.")
          PY

      - name: Prove research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          prefix="research/identity-v2/"
          allowed={
              prefix+"identity_v2_phase10_preregistration.json",
              prefix+"identity_v2_phase10_direct_candidate_crosswalk.json",
              prefix+"identity_v2_phase10_control_refresh_crosswalk.json",
              prefix+"identity_v2_phase10_seeded_refresh_crosswalk.json",
              prefix+"identity_v2_phase10_production_candidate_shadow.json",
              prefix+"identity_v2_phase10_production_candidate_shadow.md",
              prefix+"identity_v2_phase10_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "scripts/identity_crosswalk.json" not in touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: A3 commit scope is research-only.")
          PY

      - name: Postflight production regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit A3 research artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A3."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase10_preregistration.json \
            research/identity-v2/identity_v2_phase10_direct_candidate_crosswalk.json \
            research/identity-v2/identity_v2_phase10_control_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase10_seeded_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase10_production_candidate_shadow.json \
            research/identity-v2/identity_v2_phase10_production_candidate_shadow.md \
            research/identity-v2/identity_v2_phase10_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no A3 artifacts staged."
            exit 1
          }

          git commit -m "Freeze Identity V2 Phase 10 Terrell Jennings shadow"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A3 committed; production unchanged."
