name: A - FA09R1 Frozen Week 9 Matched Comparison Cohort (Guarded)

# No outcome peeking: frozen FA08 42 watches against the exact 2026W9 original
# FA06R1 1607-waiver pool, using only W5-W7 snap evidence. Source hash pinned.
# Research-only. Preview downloads files; Apply persists ONE NEW registry JSON.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview matches, or apply exactly one immutable research registry'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  controls:
    name: Pre-register 42 fixed comparison controls for Week 9 shadow study
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify fixed watchlist and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git hash-object research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json)" = 'f5d005b6a37a33444be76ec28e6b6a98174af47b'
          test "$(git hash-object research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json)" = '75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5'

      - name: Download exact FA06R1 research evidence (immutable source)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/a-fa09r1
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          gh run download 40560433637 --repo "$GITHUB_REPOSITORY" --name A_FA06R1_FIXED_SOURCE_WEEK7_RISING_USAGE_WATCH --dir "$REPORT_DIR"
          test -s "$REPORT_DIR/A_FA06R1_all_waivers.csv"
          echo 'PASS exact prior FA06R1 research artifact downloaded'

      - name: Match comparison players using W5-W7 only
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa09r1
        run: |
          set -euo pipefail
          cat > "$REPORT_DIR/FA09R1_engine.py" <<'PYCODE'
          #!/usr/bin/env python3
          """Pre-Week9 fixed matched controls for FA08R1 watch, research only.
          
          Uses only FA06R1's pinned pre-W9 usage evidence (W5-7) and committed
          FA08R1 shadow registry. Match by position+youngness and Week7 snap count;
          future weekly fantasy outcomes must be evaluated separately after games.
          """
          import argparse
          import csv
          import hashlib
          import json
          import os
          import sys
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          
          REG='research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json'
          REG_BLOB='f5d005b6a37a33444be76ec28e6b6a98174af47b'
          FA06_SHA='c0462ebfa43d50ce4d6375c6b8a8b4b1ff26bdc3f855e8284c7d57c84ce828fe'
          FA06_RUN=40560433637
          DEST='research/free-agent-opportunity/forward-registrations/2026-W09_FA09R1_frozen_42_matched_controls.json'
          FA06_NAME='A_FA06R1_all_waivers.csv'
          ALLOWED={'QB','RB','WR','TE','DL','LB','DB'}
          
          
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def flag(v):
              if v in (True,'True','true','1'):return True
              if v in (False,'False','false','0',None,''):return False
              raise ValueError(f'Unexpected boolean value {v!r}')
          def num(v):
              if v in ('',None,'None'):return None
              f=float(v)
              if not (0<=f<=250):raise ValueError(f'Invalid snap count {v}')
              return f
          
          def make(reg,all_rows,now):
              assert reg['classification']=='FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION'
              assert reg['registered_for_week']==9 and reg['registered_for_season']==2026
              assert reg['usage_and_scoring_feature_weeks']==[5,6,7]
              assert not reg['future_outcomes_used_as_features']
              assert reg['counts']['watch_total']==42 and len(reg['players'])==42
              assert len(all_rows)==1607
              by_id={str(x['player_id']):x for x in all_rows}
              assert len(by_id)==1607,'Duplicate free-agent IDs'
              watched={str(x['player_id']):x for x in reg['players']}
              assert len(watched)==42,'Duplicate watched IDs'
              # FA06R1 triaged from the same pre-W9 frozen waiver pool, with all roster
              # slots excluded by FA03R2. Source rows may not certify *current* waivers.
              assert set(watched).issubset(by_id),'Watchlist includes player not on source waiver universe'
              strata=defaultdict(list)
              covered=[]
              for x in all_rows:
                  if x['pos'] not in ALLOWED:continue
                  if not flag(x['completed_w5_w7_snaps_and_gp']):continue
                  v7=num(x['week7_snap_count']); pre=num(x['pre_week7_mean_snap_count'])
                  if v7 is None or pre is None:continue
                  y=flag(x['young_screen_age26_exp3'])
                  row=dict(player_id=str(x['player_id']),name=x['name'],pos=x['pos'],young=y,
                           w7_snaps=v7,pre_mean_snaps=pre,w7_snap_change=round(v7-pre,3),
                           v1_rank=x.get('v1_rank_within_position') or None,
                           team_at_waiver_freeze=x.get('team_at_freeze'),
                           original_FA06_watch_category=x.get('watch_category'))
                  covered.append(row)
                  if row['player_id'] not in watched:
                      strata[(row['pos'],row['young'])].append(row)
              assert len(covered)==317,'Unexpected complete three-week source population'
              assert len(covered)-len(watched)==275,'All 42 frozen watch must have complete W5-7 observations'
              selected=[]; used=set()
              diagnostics=[]
              for w in sorted(reg['players'],key=lambda x:(x['position'],not x['young_age26_exp3'],-x['week7_snaps'],x['player_id'])):
                  pid=str(w['player_id']); src=by_id[pid]
                  key=(w['position'],bool(w['young_age26_exp3']))
                  assert w['position']==src['pos'] and bool(w['young_age26_exp3'])==flag(src['young_screen_age26_exp3'])
                  assert flag(src['completed_w5_w7_snaps_and_gp'])
                  assert abs(float(w['week7_snaps'])-float(src['week7_snap_count']))<0.01
                  candidates=[x for x in strata[key] if x['player_id'] not in used]
                  if not candidates:
                      diagnostics.append({'player_id':pid,'reason':'NO_AVAILABLE_POSITION_YOUTH_CONTROL'})
                      continue
                  # Deterministic greedy nearest W7 observed usage, without future outcomes
                  # or rising-usage delta, so the signal itself is not matched away.
                  best=min(candidates,key=lambda x:(abs(x['w7_snaps']-float(w['week7_snaps'])),x['player_id']))
                  used.add(best['player_id'])
                  snap_gap=abs(best['w7_snaps']-float(w['week7_snaps']))
                  selected.append({
                    'comparability_tier':('PRIMARY_LE_10_SNAPS' if snap_gap<=10 else ('SECONDARY_LE_20_SNAPS' if snap_gap<=20 else 'WEAK_GT_20_SNAPS')),
                    'watch_id':pid,'watch_name':w['name'],'position':w['position'],
                    'watch_lane':w['shadow_lane'],'young_screen':key[1],
                    'watch_w7_snaps':float(w['week7_snaps']),
                    'control_id':best['player_id'],'control_name':best['name'],
                    'control_w7_snaps':best['w7_snaps'],
                    'abs_w7_snap_gap':round(abs(best['w7_snaps']-float(w['week7_snaps'])),2),
                    'watch_week7_snap_rise':float(w['week7_snap_increase_vs_w5w6_mean']),
                    'control_week7_snap_rise':best['w7_snap_change'],
                    'control_team_at_original_waiver_freeze':best['team_at_waiver_freeze'],
                    'matching_procedure':'exact_position_young_screen_then_nearest_w7_snap_count_without_replacement',
                    'baseline_week7_scoring_not_computed':True,
                    'future_fantasy_scores_not_accessed':True,
                  })
              assert len(selected)==42 and not diagnostics,'Expected one control for each watched player'
              assert len(set(x['control_id'] for x in selected))==42
              assert not (set(watched)&used)
              assert all(x['watch_id']!=x['control_id'] for x in selected)
              by_pos={p:{'watch':sum(x['position']==p for x in selected),
                         'mean_abs_w7_snap_gap':round(sum(x['abs_w7_snap_gap'] for x in selected if x['position']==p)/max(1,sum(x['position']==p for x in selected)),2),
                         'eligible_controls':sum(z['pos']==p for z in covered if z['player_id'] not in watched),
                        } for p in ['QB','RB','WR','TE','DL','LB','DB']}
              gaps=sorted(x['abs_w7_snap_gap'] for x in selected)
              obj={
                'schema_version':1,'study':'A FA09R1 Frozen matched control baseline for Week9+ shadow evaluation',
                'classification':'PROSPECTIVE_RESEARCH_CONTROLS_NOT_PREDICTIVE_ACCURACY',
                'registered_season':2026,'evaluation_start_week':9,
                'created_at_utc':now.astimezone(timezone.utc).isoformat(timespec='seconds'),
                'registry_path':DEST,
                'source_FA08_registry_path':REG,'source_FA08_git_blob':REG_BLOB,
                'source_FA06_run':FA06_RUN,'source_FA06_all_waivers_sha256':FA06_SHA,
                'feature_weeks':[5,6,7], 'future_outcomes_used':False,
                'candidate_population':{'waiver_pool_frozen_size':1607,'observed_three_week_nfl_participation':317,
                   'watch_total':42,'nonwatch_eligible':275,'control_count':len(selected)},
                'by_position':by_pos,
                'match_quality':{'max_abs_w7_snap_gap':max(gaps),'median_abs_w7_snap_gap':(gaps[20]+gaps[21])/2,
                   'mean_abs_w7_snap_gap':round(sum(gaps)/len(gaps),2),
                   'within_10_snaps':sum(g<=10 for g in gaps),'between_10_and_20_snaps':sum(10<g<=20 for g in gaps),
                   'greater_than_20_snaps':sum(g>20 for g in gaps)},
                'pairs':selected,
                'rules':[
                    'Controls were in the same 2026 Week9 league waiver snapshot as the 42 watched players.',
                    'Exact Sleeper ID; required all W5-7 games played and snap count presence.',
                    'Match EXACT position and young/veteran screen, then closest observed Week7 snap count without replacement.',
                    'No week8 or later stats, roster statuses or point production used to select controls.',
                    'Primary comparison is restricted to pairs with <=10 snap difference; 10-20 snap pairs exploratory; >20 snap pairs inadequate for paired inference.',
                    'Neither group is an experimental randomized assignment; selection biases may remain.',
                    'Future evaluation must score the same week(s) for watch and control players with comparable missing-outcome rules.',
                    'No preliminary conclusion about fantasy predictive edge, add/drop advice or dynasty valuation permitted.',
                ],
                'live_board_changes_authorized':False, 'pricing_changes_authorized':False,
                'predictive_accuracy_established':False,
              }
              return obj
          
          
          def selftest():
              now=datetime(2026,10,27,tzinfo=timezone.utc)
              r={'classification':'FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION','registered_for_week':9,'registered_for_season':2026,
                  'usage_and_scoring_feature_weeks':[5,6,7],'future_outcomes_used_as_features':False,
                  'counts':{'watch_total':42},'players':[]}
              # Test exact unambiguous booleans and 0-vs-null parsing, plus stale/schema fail closed.
              assert flag('False') is False and flag('True') is True
              assert num('0.0')==0 and num('') is None
              try:flag('maybe')
              except ValueError:pass
              else:raise AssertionError('Bad boolean was accepted')
              try:make(r,[],now)
              except AssertionError:pass
              else:raise AssertionError('Empty source accepted')
              print('PASS FA09R1 source guards, exact bool, zero/missing distinction, stale fixture rejection')
          
          
          def main():
              ap=argparse.ArgumentParser(); ap.add_argument('--selftest',action='store_true'); ap.add_argument('--registry',default=REG);ap.add_argument('--source',default=os.getenv('REPORT_DIR','/tmp')+'/'+FA06_NAME);ap.add_argument('--out',default=os.getenv('REPORT_DIR','/tmp'));args=ap.parse_args()
              if args.selftest:return selftest()
              if sha(args.source)!=FA06_SHA:raise RuntimeError('Pinned FA06 source SHA mismatch')
              registry=Path(args.registry)
              reg=json.loads(registry.read_text())
              import subprocess
              if registry.as_posix()==REG and subprocess.check_output(['git','hash-object',REG],text=True).strip()!=REG_BLOB:
                  raise RuntimeError('FA08 research registry git blob changed')
              with open(args.source,newline='') as fp:all_rows=list(csv.DictReader(fp))
              obj=make(reg,all_rows,datetime.now(timezone.utc));o=Path(args.out);o.mkdir(parents=True,exist_ok=True)
              (o/'A_FA09R1_controls.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
              cols=['comparability_tier','position','young_screen','watch_name','watch_id','watch_lane','control_name','control_id','watch_w7_snaps','control_w7_snaps','abs_w7_snap_gap','watch_week7_snap_rise','control_week7_snap_rise']
              with (o/'A_FA09R1_pairs.csv').open('w',newline='') as f:
                  wr=csv.DictWriter(f,fieldnames=cols);wr.writeheader();wr.writerows({k:r[k] for k in cols} for r in obj['pairs'])
              m=obj['match_quality']
              md=['# A FA09R1 — Frozen 2026 Week9 matched free-agent controls','','**Research-only, NOT validation of predictive accuracy.**',
                  '',f"42 fixed watches matched 1-to-1 against 275 non-watched, W5–7 active free agents from the same 1,607-player frozen waiver pool.",
                  f"Pre-origin Week7 snap-count gap: median {m['median_abs_w7_snap_gap']:.1f}, mean {m['mean_abs_w7_snap_gap']:.1f}, max {m['max_abs_w7_snap_gap']:.1f}.",
                  f"Primary comparable pairs (<=10 snaps): {m['within_10_snaps']}/42; secondary 10–20 snaps: {m['between_10_and_20_snaps']}; too wide for paired inference (>20): {m['greater_than_20_snaps']}.",
                  '','| Position | Watch | Available non-watch controls | Mean W7 snap gap |','|---|---:|---:|---:|']
              for p,d in obj['by_position'].items():md.append(f"| {p} | {d['watch']} | {d['eligible_controls']} | {d['mean_abs_w7_snap_gap']:.1f} |")
              md+=['','## Comparisons (original position/age strata preserved)','', '| Watch | Control | Pos | Young | W7 snaps (watch/control) | Gap | Tier |', '|---|---|---|---|---|---:|---|']
              for x in sorted(obj['pairs'],key=lambda x:(x['position'],x['watch_name'])):
                  md.append(f"| {x['watch_name']} | {x['control_name']} | {x['position']} | {x['young_screen']} | {x['watch_w7_snaps']:g}/{x['control_w7_snaps']:g} | {x['abs_w7_snap_gap']:g} | {x['comparability_tier']} |")
              md+=['','## Methodology and limits','']+['- '+x for x in obj['rules']]
              md+=['','**Next phase, only after Week9 is completed and results are available:** evaluate weekly LOG scoring, game/snap participation and add-rate or roster-change proxies for the fixed watches vs controls. Distinguish missing data from zero scores.','',f'Apply destination: `{DEST}`']
              (o/'A_FA09R1_report.md').write_text('\n'.join(md)+'\n')
              print('FA09R1_MATCHED_CONTROLS_PASS',json.dumps({'matches':len(obj['pairs']),'quality':m,'eligible':obj['candidate_population']}))
          
          if __name__=='__main__':main()
          PYCODE
          python3 "$REPORT_DIR/FA09R1_engine.py" --selftest
          python3 "$REPORT_DIR/FA09R1_engine.py"
          python3 -m json.tool "$REPORT_DIR/A_FA09R1_controls.json" >/dev/null
          test -z "$(git status --porcelain)"

      - name: Upload independent research report even if Apply fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA09R1_2026W09_FROZEN_MATCHED_COMPARATORS
          path: |
            ${{ runner.temp }}/a-fa09r1/A_FA09R1_controls.json
            ${{ runner.temp }}/a-fa09r1/A_FA09R1_pairs.csv
            ${{ runner.temp }}/a-fa09r1/A_FA09R1_report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Apply one immutable research-only control registry
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa09r1
        run: |
          set -euo pipefail
          p='research/free-agent-opportunity/forward-registrations/2026-W09_FA09R1_frozen_42_matched_controls.json'
          test ! -e "$p" || { echo 'Frozen controls already committed; refusing overwrite'; exit 1; }
          test -z "$(git status --porcelain)"
          mkdir -p "$(dirname "$p")"
          cp "$REPORT_DIR/A_FA09R1_controls.json" "$p"
          test "$(git ls-files --others --exclude-standard)" = "$p" || { echo 'Unexpected untracked repo files'; exit 1; }
          git add -- "$p"
          test "$(git diff --cached --name-only)" = "$p"
          git diff --cached --check
          git config user.name 'a-fa09-matched-controls-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'A FA09R1: freeze Week9 comparison controls for shadow evaluation (research only)'
          git push origin HEAD:main
          echo 'PASS matched comparison group frozen; no production updates'

      - name: Preview result (no repository write)
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'PASS preview controls; choose apply only to freeze fixed baseline for Week 9+ evaluation.'
