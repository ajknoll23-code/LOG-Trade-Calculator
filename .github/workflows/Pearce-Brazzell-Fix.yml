name: A - ID03 Pearce Brazzell Exact Identity and Position Repair (Guarded)
run-name: A-ID03 ${{ inputs.mode }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Run PREVIEW first; APPLY requires reviewed matching PREVIEW run
        type: choice
        required: true
        default: PREVIEW
        options:
          - PREVIEW
          - APPLY
      preview_run_id:
        description: Numeric green A-ID03 PREVIEW run ID (APPLY only)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ID03_MODE: ${{ inputs.mode }}
      ID03_PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
      ID03_OUT: /tmp/A-ID03-review
    steps:
      - name: Checkout current main without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize and syntax-check pinned A-ID03 engine
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/id03_engine.py" <<'PY_ID03_ENGINE'
          #!/usr/bin/env python3
          """A-ID03: exact Sleeper-ID identity repair for Pearce and Brazzell.
          PREVIEW is read-only. APPLY pins successful preview on same main commit.
          No global suffix stripping. No FV formula, multipliers, market, or data edits.
          The documented Pearce LB->DL position correction can change live FV output.
          """
          import difflib
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          UI_FILES = ('index.html', 'trade-desk-preview.html')
          OUT = pathlib.Path(os.environ.get('ID03_OUT','/tmp/id03-review'))
          EXACT = {
              '12585': {'synced':'james pearce jr','curated':'james pearce','pos':'DL','team':'ATL','slot':'bench'},
              '13353': {'synced':'chris brazzell ii','curated':'chris brazzell','pos':'WR','team':'CAR','slot':'reserve_ir'},
          }
          PEARCE_BEFORE="'james pearce':{pos:'LB',age:22,role:'Understudy',team:'ATL',pts2025:141.8,proj2026:107.8},"
          PEARCE_AFTER ="'james pearce':{pos:'DL',age:22,role:'Understudy',team:'ATL',pts2025:141.8,proj2026:107.8},"
          BRAZZELL_BEFORE="'chris brazzell':{pos:'WR',age:22,role:'Speculative',team:'CIN'},"
          BRAZZELL_AFTER ="'chris brazzell':{pos:'WR',age:22,role:'Speculative',team:'CAR'},"
          OLD_COMMENT="""/* A-ID02: exact Sleeper-ID verified alias map. Intentionally excludes
           * James Pearce Jr. (LB/DL disagreement) and Chris Brazzell II (no
           * independent high-confidence crosswalk). Never strip suffixes globally.
           * Existing curated records keep their position and production history.
           */"""
          NEW_COMMENT="""/* A-ID02 / A-ID03: exact Sleeper-ID verified aliases. A-ID03 adds
           * James Pearce Jr. as DL (Sleeper and FantasyPros crosswalk agree) and
           * Chris Brazzell II as WR (exact roster ID and independent team roster feed).
           * Brazzell has no high-confidence FantasyPros crosswalk; this exception is
           * explicitly scoped to his single verified Sleeper ID, name, team and role.
           * Never strip suffixes globally; other mappings remain unchanged.
           */"""


          def git(*args): return subprocess.check_output(['git',*args], text=True).strip()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def norm(s): return re.sub(r'\s+', ' ', re.sub(r"[.'’\-]",'',str(s).lower())).strip()

          def verify_sources():
              assert git('branch','--show-current') == 'main', 'Only main allowed'
              assert not git('status','--porcelain','--untracked-files=all'), 'Repository dirty; stop'
              assert pathlib.Path('.github/workflows/A-ID03.yml').is_file(), 'A-ID03 workflow not in checkout'
              assert pathlib.Path('.github/workflows/A-ID02.yml').is_file(), 'A-ID02 prerequisite absent'
              db = json.loads(pathlib.Path('data/league_rosters.json').read_text())
              all_players={}
              for r in db.get('rosters',[]):
                  for slot in ('starters','bench','taxi','reserve_ir'):
                      for p in r.get(slot,[]):
                          pid=str(p.get('player_id'))
                          assert pid not in all_players, f'Duplicate roster Sleeper ID {pid}; halt'
                          all_players[pid] = (p,slot,r.get('roster_id'))
              cross = json.loads(pathlib.Path('scripts/identity_crosswalk.json').read_text())
              teams = json.loads(pathlib.Path('scripts/artifacts/generated/player_team_refresh.json').read_text())
              positions = json.loads(pathlib.Path('scripts/artifacts/generated/player_positions.json').read_text())
              for sid,spec in EXACT.items():
                  assert sid in all_players, f'Missing {sid}'; p,slot,rid=all_players[sid]
                  assert norm(p.get('name'))==spec['synced'], f'ID/name changed: {sid}'
                  assert p.get('position')==spec['pos'] and spec['pos'] in p.get('fantasy_positions',[]), f'Position changed: {sid}'
                  assert p.get('team')==spec['team'] and slot==spec['slot'], f'Team or roster slot changed: {sid}'
                  assert teams['teams_by_sleeper_id'].get(sid)==spec['team'], f'Independent team refresh differs: {sid}'
                  assert positions.get(spec['synced'])==spec['pos'], f'Generated player-position evidence differs: {sid}'
                  assert positions.get(spec['curated'])==('LB' if sid=='12585' else 'WR'), f'Unexpected pre-existing canonical position: {sid}'
                  assert sum(1 for q,_,_ in all_players.values() if norm(q.get('name'))==spec['synced'])==1, f'Ambiguous exact name: {sid}'
              # Pearce gets independent exact stable-ID high-confidence FP crosswalk corroboration.
              pcross=[x for x in cross if str(x.get('sleeper_id'))=='12585']
              assert len(pcross)==1 and norm(pcross[0].get('name',''))=='james pearce jr', 'Pearce crosswalk identity mismatch'
              assert pcross[0].get('fp_position')=='DL' and pcross[0].get('sleeper_pos')=='DL', 'Pearce crosswalk position disagreement'
              assert pcross[0].get('match_confidence')=='high' and pcross[0].get('requires_manual_review') is False, 'Pearce confidence inadequate'
              # Brazzell has no FP crosswalk. Exact unique Sleeper roster record,
              # separate generated team-by-ID refresh, WR position evidence and official
              # Carolina team roster/injury announcement are used instead.
              assert not [x for x in cross if str(x.get('sleeper_id'))=='13353'], 'Brazzell now in crosswalk; stop to re-audit'
              bp,_,_=all_players['13353']
              assert bp.get('injury_status')=='IR', 'Brazzell injury status drift; re-audit'
              assert norm(bp['name'])=='chris brazzell ii', 'Brazzell identity drift'
              return {'roster_player_count':len(all_players),'pearce_fp_crosswalk_confirmed':True,'brazzell_fp_crosswalk_available':False,
                      'brazzell_sources':['live_league_roster_exact_id','generated_team_refresh_exact_id','player_positions_exact_suffix','Panthers_official_roster_report_July_2026']}

          def get_map_rows(src):
              a=src.index('const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze({')
              b=src.index('\n});',a)
              chunk=src[a:b]
              # Exact syntax, no unrecognized map forms.
              pairs = re.findall(r'(?m)^  "(\d+)": Object\.freeze\(\{synced:"([^"]+)",curated:"([^"]+)",pos:"([^"]+)"\}\),$', chunk)
              assert len(pairs)==38, f'Expected 38 ID02 pinned aliases, got {len(pairs)}'
              assert len({x[0] for x in pairs})==38, 'Duplicate ID02 key'
              return pairs

          def patch(src,path):
              rows=get_map_rows(src)
              assert all(sid not in {x[0] for x in rows} for sid in EXACT), 'Already patched or identity collision'
              assert src.count(OLD_COMMENT)==1, f'Prior ID02 comment changed: {path}'
              assert src.count(PEARCE_BEFORE)==1 and src.count(BRAZZELL_BEFORE)==1, f'Curated row drift: {path}'
              assert src.count('function playerValue(')==1, f'Unexpected FV function: {path}'
              assert src.count('const PROD_MULT')>=1 and src.count('const POSITION_WEIGHT')==1, f'Unknown pricing code: {path}'
              for anchor in ['  "12588": Object.freeze({synced:"kevin winston jr",curated:"kevin winston",pos:"DB"}),',
                             '  "13365": Object.freeze({synced:"anthony hill jr",curated:"anthony hill",pos:"LB"}),']:
                  assert src.count(anchor)==1, f'Expected fixed previous map anchor absent: {path}'
              out=src.replace(OLD_COMMENT,NEW_COMMENT,1)
              out=out.replace('  "12588": Object.freeze({synced:"kevin winston jr",curated:"kevin winston",pos:"DB"}),',
                  '  "12585": Object.freeze({synced:"james pearce jr",curated:"james pearce",pos:"DL"}),\n'
                  '  "12588": Object.freeze({synced:"kevin winston jr",curated:"kevin winston",pos:"DB"}),',1)
              out=out.replace('  "13365": Object.freeze({synced:"anthony hill jr",curated:"anthony hill",pos:"LB"}),',
                  '  "13353": Object.freeze({synced:"chris brazzell ii",curated:"chris brazzell",pos:"WR"}),\n'
                  '  "13365": Object.freeze({synced:"anthony hill jr",curated:"anthony hill",pos:"LB"}),',1)
              out=out.replace(PEARCE_BEFORE,PEARCE_AFTER,1).replace(BRAZZELL_BEFORE,BRAZZELL_AFTER,1)
              after=get_map_rows_with_40(out)
              assert len(after)==40, 'Alias population must be exactly 40'
              assert [x for x in after if x[0] not in EXACT]==rows, 'One of the 38 approved mappings was changed'
              assert {x[0] for x in after}==({x[0] for x in rows}|set(EXACT)), 'Unexpected alias map keys'
              # Forbid edits of source pipeline / formula: our replacements are exact finite strings.
              assert out!=src and out.count(PEARCE_AFTER)==1 and out.count(BRAZZELL_AFTER)==1
              return out

          def get_map_rows_with_40(src):
              a=src.index('const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze({')
              b=src.index('\n});',a)
              pairs=re.findall(r'(?m)^  "(\d+)": Object\.freeze\(\{synced:"([^"]+)",curated:"([^"]+)",pos:"([^"]+)"\}\),$',src[a:b])
              assert len(pairs)==40 and len(set(r[0] for r in pairs))==40,'Malformed 40-entry map'
              return pairs

          def check_js_syntax(path,html):
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',html,flags=re.I|re.S)
              target=[x for x in blocks if 'function resolveExistingKey' in x]
              assert len(target)==1,f'Cannot isolate main inline JS: {path}'
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js',delete=True) as f:
                  f.write(target[0]);f.flush()
                  subprocess.run(['node','--check',f.name],check=True,capture_output=True,text=True)

          def check_node_resolver(html,path):
              i=html.index('const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze(')
              j=html.index('\n/* Sleeper uses finer-grained position',i)
              block=html[i:j]
              js="""const assert=require('node:assert/strict');
          const PLAYER_DB={'james pearce':{pos:'DL'},'chris brazzell':{pos:'WR'},'alex singleton':{pos:'LB'}};
          const ALIASES={};const ALIASES_REVERSE={};
          """+block+"""
          const cases=[['12585','james pearce jr','james pearce','DL'],['13353','chris brazzell ii','chris brazzell','WR']];
          for(const [id,synced,canon,pos] of cases){
           assert.equal(resolveExistingKey(synced,id),canon,'Exact ID/name must resolve');
           assert.equal(resolveExistingKey(synced,'99999999'),synced,'Incorrect ID cannot resolve');
           assert.equal(resolveExistingKey(synced+' alternate',id),synced+' alternate','Changed name cannot resolve');
           PLAYER_DB[canon].pos='WRONG';
           assert.equal(resolveExistingKey(synced,id),synced,'Position disagreement fails closed');
           PLAYER_DB[canon].pos=pos;
          }
          assert.equal(resolveExistingKey('alex singleton','2617'),'alex singleton','Unrelated name preserved');
          assert.equal(resolveExistingKey('james pearce jr',null),'james pearce jr','No ID, no name guess');
          assert.equal(Object.keys(A_ID02_VERIFIED_SLEEPER_IDENTITIES).length,40,'All original ID02 mappings preserved');
          console.log('ID03_IDENTITY_AND_POSITION_TEST_PASS');
          """
              res=subprocess.run(['node','-e',js],capture_output=True,text=True,check=True)
              assert 'ID03_IDENTITY_AND_POSITION_TEST_PASS' in res.stdout
              return res.stdout.strip()

          def report_md(result):
              return '\n'.join([
                '# A-ID03 — Pearce and Brazzell exact-ID repairs','',
                f'- Source commit: `{result["head_sha"]}`',
                '- Scope: `index.html` and `trade-desk-preview.html` only',
                '- Exact Sleeper IDs: James Pearce Jr. `12585`, Chris Brazzell II `13353`',
                '- Pearce: curate position LB → DL, align with Sleeper DL and high-confidence FP crosswalk DL',
                '- Brazzell: curate static team CIN → CAR; source roster reports 2026 IR and Carolina team',
                '- Existing 38 ID02 aliases remain byte-equivalent and operational',
                '- No changes to formula, PROD_MULT, historical artifacts, stored FV/FV+/MV or frozen studies',
                '- **Important**: Pearce underlying production multiplier is historically LB-derived; treating him as DL changes display FV and requires a separate production-lineage review before treating the result as calibrated.',
                '- Brazzell has no independent high-confidence FantasyPros crosswalk; unique exact Sleeper name/ID, separate team feed, position and official roster evidence were used.','',
                '## Runtime checks','',
                *[f'- `{name}`: {status}' for name,status in result['checks'].items()],
                '',
                '## Deployment policy','',
                '**PREVIEW is read-only**. APPLY requires a matching successful reviewed PREVIEW GitHub run, an unchanged `main` commit, strict manifest equality, and `WFC01_PUSH_TOKEN`.',
                'Only the two HTML files are eligible for staging. Revert the resulting commit to roll back.',
              ])+'\n'

          def main():
              assert len(sys.argv)==2 and sys.argv[1] in ('PREVIEW','APPLY')
              mode=sys.argv[1]
              stats=verify_sources()
              prepared={};diff=[];checks={}
              for path in UI_FILES:
                  old=pathlib.Path(path).read_text()
                  new=patch(old,path)
                  check_js_syntax(path,new)
                  checks[path]=check_node_resolver(new,path)
                  prepared[path]=new
                  diff.extend(difflib.unified_diff(old.splitlines(True),new.splitlines(True),fromfile='a/'+path,tofile='b/'+path))
              manifest={
                'schema':1,'status':'ID03_PREVIEW_VALIDATED_READ_ONLY',
                'head_sha':git('rev-parse','HEAD'),'scope':list(UI_FILES),
                'original_sha256':{p:sha(pathlib.Path(p).read_bytes()) for p in UI_FILES},
                'patched_sha256':{p:sha(prepared[p].encode('utf8')) for p in UI_FILES},
                'identities':EXACT,'stats':stats,'checks':checks,
                'valuation_formula_changed':False,'valuation_inputs_changed':True,
                'position_change':'James Pearce Jr. LB -> DL; historical multiplier lineage requires follow-up',
                'historical_data_changed':False,
              }
              OUT.mkdir(parents=True,exist_ok=True)
              (OUT/'ID03_Preview.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              (OUT/'ID03_diff.patch').write_text(''.join(diff))
              (OUT/'ID03_Report.md').write_text(report_md(manifest))
              if mode=='PREVIEW':
                  print(json.dumps({'status':manifest['status'],'head':manifest['head_sha'],
                       'mapping_count':2,'existing_id02_preserved':38,'paths':list(UI_FILES),'checks':checks},sort_keys=True))
                  return
              assert os.environ.get('ID03_MODE')=='APPLY','Explicit APPLY mode required'
              prior=OUT/'ID03_Approved_Preview.json'
              assert prior.is_file(),'Missing successful PREVIEW manifest'
              assert json.loads(prior.read_text())==manifest,'Preview differs from current sources or patch; stop'
              token=os.environ.get('WFC01_PUSH_TOKEN','')
              assert token,'WFC01_PUSH_TOKEN not configured'
              for path,content in prepared.items():pathlib.Path(path).write_text(content)
              git('add','--',*UI_FILES)
              changed=set(filter(None,git('diff','--cached','--name-only').splitlines()))
              assert changed==set(UI_FILES),f'Unexpected staged paths: {changed}'
              assert not git('diff','--name-only'),'Unexpected unstaged changes'
              git('diff','--cached','--check')
              git('config','user.name','github-actions[bot]')
              git('config','user.email','github-actions[bot]@users.noreply.github.com')
              git('commit','-m','A-ID03: repair Pearce and Brazzell exact-ID aliases; curate DL and CAR sources')
              url='https://x-access-token:'+token+'@github.com/'+os.environ['GITHUB_REPOSITORY']+'.git'
              subprocess.run(['git','push',url,'HEAD:main'],check=True)
              print(json.dumps({'status':'ID03_PATCH_PUSHED','commit':git('rev-parse','HEAD'),'changed_files':list(UI_FILES)}))

          if __name__=='__main__': main()
          PY_ID03_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/id03_engine.py"
      - name: PREVIEW exact identity mappings and guarded patch
        if: inputs.mode == 'PREVIEW'
        run: python3 "$RUNNER_TEMP/id03_engine.py" PREVIEW
      - name: Upload PREVIEW manifest, source audit and exact patch
        if: inputs.mode == 'PREVIEW'
        uses: actions/upload-artifact@v4
        with:
          name: A-ID03-Preview
          path: /tmp/A-ID03-review/
          retention-days: 30
      - name: APPLY requires matching approved successful PREVIEW and scoped token
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$ID03_PREVIEW_RUN_ID" =~ ^[0-9]{7,15}$ ]] || { echo '::error::Supply the green PREVIEW run ID'; exit 1; }
          test -n "$WFC01_PUSH_TOKEN" || { echo '::error::Missing WFC01_PUSH_TOKEN'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID03_PREVIEW_RUN_ID" --jq '[.conclusion,.event,.path,.head_sha,.display_title]|@tsv' > "$RUNNER_TEMP/id03_preview.tsv"
          IFS=$'\t' read -r result event path sha title < "$RUNNER_TEMP/id03_preview.tsv"
          test "$result" = success && test "$event" = workflow_dispatch && test "$path" = .github/workflows/A-ID03.yml && test "$sha" = "$(git rev-parse HEAD)" && test "$title" = 'A-ID03 PREVIEW' || { echo '::error::PREVIEW identity or main commit mismatch'; exit 1; }
      - name: Download the exact reviewed PREVIEW manifest
        if: inputs.mode == 'APPLY'
        uses: actions/download-artifact@v4
        with:
          name: A-ID03-Preview
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/A-ID03-approved
      - name: APPLY reviewed exact patch to two HTML pages
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          cp /tmp/A-ID03-approved/ID03_Preview.json "$ID03_OUT/ID03_Approved_Preview.json" || { mkdir -p "$ID03_OUT"; cp /tmp/A-ID03-approved/ID03_Preview.json "$ID03_OUT/ID03_Approved_Preview.json"; }
          python3 "$RUNNER_TEMP/id03_engine.py" APPLY
      - name: Publish readable report
        if: always()
        shell: bash
        run: |
          if test -f "$ID03_OUT/ID03_Report.md"; then
            cat "$ID03_OUT/ID03_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No completed report; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
