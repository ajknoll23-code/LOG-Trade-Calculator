name: Apply Market Value UI

# One-time/replayable release of the separate Fundamental / Market / Team Utility UI.
# The maintenance script is idempotent and modifies presentation only.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Market UI integration self-test
        run: python3 scripts/maintenance/apply_market_value_ui.py --selftest

      - name: Apply separate Market Value UI
        run: python3 scripts/maintenance/apply_market_value_ui.py --write

      - name: Verify Market Value UI
        run: python3 scripts/maintenance/apply_market_value_ui.py --check

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if not scripts:
              raise SystemExit("Could not locate inline script in index.html")
          Path("/tmp/trade-desk-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/trade-desk-inline.js

      - name: Diff safety check
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "index.html" ]; then
            echo "Unexpected files changed:"
            echo "$changed"
            exit 1
          fi

      - name: Commit UI release
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Market Value UI already applied; nothing to commit."
            exit 0
          fi
          git config user.name "trade-desk-ui-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Separate fundamental market and team utility views"
          git push
