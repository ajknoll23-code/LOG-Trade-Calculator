name: Package Adjustment NextGen V2 Maturity Planning Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install audit dependencies
        run: python3 -m pip install requests numpy

      - name: Guard exact frozen and historical evidence
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object research/package-adjustment-nextgen-v2/catalog_freeze_manifest.json)" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object research/package-adjustment-v3/package_vote_v3_results.json)" = "a9f7a2922478d252d92f4da35f641be41645b957"
          test "$(git hash-object research/package-adjustment-v4/package_vote_v4_results.json)" = "ffcc787615d4611d13ea6bca51e68e58b61e8364"
          test "$(git hash-object research/package-adjustment-v5/package_vote_v5_results.json)" = "1af3e05001ebd4ecbd232366d73d5d251ba0936f"

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path.cwd()
          d = root / "research/package-adjustment-nextgen-v2"
          m = json.loads((d / "catalog_freeze_manifest.json").read_text())
          assert m["status"] == "frozen_package_adjustment_nextgen_v2_catalog"
          assert m["frozen"] is True
          assert m["released_to_voters"] is False
          assert m["voting_activated"] is False
          assert m["production_change_authorized"] is False
          assert m["activation"]["authorized"] is False
          assert m["activation"]["maturity_plan_committed"] is False
          assert m["challenge_count"] == 129
          assert m["canonical_challenge_payload_sha256"] == "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for key, name in {
              "catalog": "package_vote_challenges_nextgen_v2.json",
              "design": "challenge_catalog_design.md",
              "generator": "generate_package_vote_challenges_nextgen_v2.py",
              "research_spec": "package_adjustment_nextgen_v2_research_spec.md",
          }.items():
              assert sha(d / name) == m[key]["sha256"]

          c = json.loads((d / "package_vote_challenges_nextgen_v2.json").read_text())
          assert c["status"] == "frozen_package_adjustment_nextgen_v2"
          assert c["frozen"] is True
          assert c["freeze"]["voting_activated"] is False
          payload = json.dumps(c["challenges"], sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          assert hashlib.sha256(payload).hexdigest() == m["canonical_challenge_payload_sha256"]
          print("PASS: exact frozen catalog and historical snapshots confirmed.")
          PY

      - name: Verify production before audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Generate read-only maturity planning audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkgnv2-maturity-audit
          mkdir -p /tmp/pkgnv2-maturity-audit

          python3 - <<'PY'
          import csv, json, math, statistics
          from collections import Counter, defaultdict
          from pathlib import Path
          import numpy as np

          root = Path.cwd()
          out = Path("/tmp/pkgnv2-maturity-audit")
          ng = root / "research/package-adjustment-nextgen-v2"

          def read(path):
              return json.loads(path.read_text())

          # Historical participation. Pseudonymous IDs are used only in memory.
          hist_files = {
              "V3": root / "research/package-adjustment-v3/package_vote_v3_results.json",
              "V4": root / "research/package-adjustment-v4/package_vote_v4_results.json",
              "V5": root / "research/package-adjustment-v5/package_vote_v5_results.json",
          }
          hist, voter_sets, all_counts = {}, {}, []
          for phase, path in hist_files.items():
              doc = read(path); s = doc["summary"]; weights = s["voter_weights"]
              ids = set(weights); counts = [int(v["raw_votes"]) for v in weights.values()]
              voter_sets[phase] = ids; all_counts.extend(counts)
              assert sum(counts) == int(s["raw_vote_count"])
              assert len(ids) == int(s["unique_voters"])
              hist[phase] = {
                  "counted_votes": int(s["raw_vote_count"]),
                  "unique_voters": int(s["unique_voters"]),
                  "distinct_challenges": int(s["distinct_challenges"]),
                  "daily_cap": int(doc["package_daily_cap_per_voter"]),
                  "effective_lifetime_cap": float(doc["voter_effective_lifetime_cap"]),
                  "votes_per_voter_min": min(counts),
                  "votes_per_voter_median": float(statistics.median(counts)),
                  "votes_per_voter_max": max(counts),
                  "prior_diagnostic_thresholds": s["diagnostic_data_gates"]["thresholds"],
              }

          union = set().union(*voter_sets.values())
          overlap = {a: {b: len(voter_sets[a] & voter_sets[b]) for b in voter_sets} for a in voter_sets}

          # Realized frozen cells: family + cell + scale + split.
          manifest = read(ng / "catalog_freeze_manifest.json")
          cat = read(ng / "package_vote_challenges_nextgen_v2.json")
          cells = {}
          family_challenges = Counter()
          for c in cat["challenges"]:
              k = (c["family"], c["cell_id"], c["scale_label"], c["split"])
              cells.setdefault(k, {"family": c["family"], "cell_id": c["cell_id"], "scale_label": c["scale_label"], "split": c["split"], "challenge_count": 0})
              cells[k]["challenge_count"] += 1
              family_challenges[c["family"]] += 1
          rows = sorted(cells.values(), key=lambda r: (r["family"], r["cell_id"], r["scale_label"], r["split"]))
          family_cells = Counter(r["family"] for r in rows)
          split_cells = Counter(r["split"] for r in rows)
          assert len(rows) == 24
          assert dict(family_cells) == {"core_concentration_2v2": 15, "fragmentation_filler": 3, "structural_topology_3v3": 6}
          assert dict(split_cells) == {"structural_scale_holdout": 5, "train": 13, "structural_topology_holdout": 6}

          families = sorted(family_cells)
          schedules = {
              "equal_family": {f: 1/3 for f in families},
              "equal_cell_via_family_weights": {f: family_cells[f]/24 for f in families},
              "challenge_proportional_family": {f: family_challenges[f]/129 for f in families},
          }
          probs = {}
          for name, fw in schedules.items():
              p = [fw[r["family"]] / family_cells[r["family"]] for r in rows]
              assert abs(sum(p) - 1) < 1e-12
              probs[name] = p
          assert min(probs["equal_cell_via_family_weights"]) >= max(min(probs["equal_family"]), min(probs["challenge_proportional_family"])) - 1e-12

          # Exact binomial helper for per-cell distinct-voter lower bounds.
          def p_less_than(n, p, k):
              return sum(math.comb(n, x) * p**x * (1-p)**(n-x) for x in range(k))

          def wilson_halfwidth(n, z=1.959963984540054):
              if n <= 0: return 0.5
              denom = 1 + z*z/n
              return z * math.sqrt(.25/n + z*z/(4*n*n)) / denom

          rng = np.random.default_rng(20260911)
          trials = 20000
          ballots_per_voter = 20
          voter_grid = [12, 15, 20, 25, 30, 40, 50, 60, 75, 100]
          split_idx = defaultdict(list)
          for i, r in enumerate(rows): split_idx[r["split"]].append(i)

          sim = []
          for name, pp in probs.items():
              p = np.asarray(pp, dtype=float)
              seen = 1 - np.power(1-p, ballots_per_voter)
              for voters in voter_grid:
                  total = voters * ballots_per_voter
                  draw = rng.multinomial(total, p, size=trials)
                  mins = draw.min(axis=1)
                  train = draw[:, split_idx["train"]].min(axis=1)
                  scale = draw[:, split_idx["structural_scale_holdout"]].min(axis=1)
                  topo = draw[:, split_idx["structural_topology_holdout"]].min(axis=1)
                  def conservative_distinct(k):
                      return max(0.0, 1 - sum(p_less_than(voters, float(q), k) for q in seen))
                  p10 = int(np.quantile(mins, .10, method="lower"))
                  sim.append({
                      "schedule": name,
                      "voters": voters,
                      "ballots_per_voter": ballots_per_voter,
                      "total_votes": total,
                      "min_cell_probability": float(p.min()),
                      "max_cell_probability": float(p.max()),
                      "expected_votes_worst_cell": float(total*p.min()),
                      "p10_min_votes_any_cell": p10,
                      "median_min_votes_any_cell": int(np.quantile(mins, .50, method="lower")),
                      "prob_all_cells_ge_5_votes": float(np.mean(mins >= 5)),
                      "prob_all_cells_ge_10_votes": float(np.mean(mins >= 10)),
                      "prob_all_cells_ge_15_votes": float(np.mean(mins >= 15)),
                      "prob_all_cells_ge_20_votes": float(np.mean(mins >= 20)),
                      "prob_all_train_cells_ge_10_votes": float(np.mean(train >= 10)),
                      "prob_all_scale_holdout_cells_ge_10_votes": float(np.mean(scale >= 10)),
                      "prob_all_topology_holdout_cells_ge_10_votes": float(np.mean(topo >= 10)),
                      "expected_distinct_voters_worst_cell": float(voters*seen.min()),
                      "conservative_prob_all_cells_ge_5_distinct_voters": conservative_distinct(5),
                      "conservative_prob_all_cells_ge_8_distinct_voters": conservative_distinct(8),
                      "conservative_prob_all_cells_ge_10_distinct_voters": conservative_distinct(10),
                      "worst_case_95pct_wilson_halfwidth_using_p10_min_n": wilson_halfwidth(max(1, p10)),
                  })

          with (out / "package-adjustment-nextgen-v2-precision-simulation.csv").open("w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(sim[0])); w.writeheader(); w.writerows(sim)

          with (out / "package-adjustment-nextgen-v2-realized-cells.csv").open("w", newline="") as f:
              fields = ["family", "cell_id", "scale_label", "split", "challenge_count", "p_equal_family", "p_equal_cell_via_family_weights", "p_challenge_proportional_family"]
              w = csv.DictWriter(f, fieldnames=fields); w.writeheader()
              for i, r in enumerate(rows):
                  w.writerow({**r, "p_equal_family": probs["equal_family"][i], "p_equal_cell_via_family_weights": probs["equal_cell_via_family_weights"][i], "p_challenge_proportional_family": probs["challenge_proportional_family"][i]})

          crossings = {}
          for name in schedules:
              crossings[name] = {}
              for metric in ["prob_all_cells_ge_10_votes", "prob_all_cells_ge_15_votes", "conservative_prob_all_cells_ge_8_distinct_voters"]:
                  crossings[name][metric] = next((r["voters"] for r in sim if r["schedule"] == name and r[metric] >= .90), None)

          audit = {
              "schema_version": 1,
              "status": "read_only_maturity_planning_audit",
              "nextgen_votes_used": False,
              "voting_activation_authorized": False,
              "production_change_authorized": False,
              "frozen_catalog": {"challenge_count": 129, "experimental_cell_count": 24, "canonical_challenge_payload_sha256": manifest["canonical_challenge_payload_sha256"], "catalog_sha256": manifest["catalog"]["sha256"]},
              "historical_participation": {
                  "phases": hist,
                  "snapshot_vote_sum": sum(x["counted_votes"] for x in hist.values()),
                  "unique_voter_union": len(union),
                  "phase_overlap_counts": overlap,
                  "observed_votes_per_voter": {"min": min(all_counts), "median": float(statistics.median(all_counts)), "max": max(all_counts)},
                  "note": "Historical snapshot vote totals are not independent because voters overlap across phases."
              },
              "realized_design": {"cell_counts_by_family": dict(family_cells), "cell_counts_by_split": dict(split_cells), "challenge_counts_by_family": dict(family_challenges)},
              "candidate_sampling_schedules": {n: {"family_weights": fw, "min_cell_probability": min(probs[n]), "max_cell_probability": max(probs[n])} for n, fw in schedules.items()},
              "simulation": {"seed": 20260911, "trials_per_scenario": trials, "ballots_per_voter": ballots_per_voter, "voter_grid": voter_grid, "crossings_at_90pct_for_review_not_gates": crossings},
              "methodology_to_preserve": {"primary_model_metric": "held_out_log_loss", "primary_uncertainty": "nonparametric_voter_cluster_bootstrap", "stopping_rule": "coverage_and_precision_only_not_effect_direction", "prospective_time_holdout_required": True},
              "hard_facts": {"historical_daily_cap_20": all(x["daily_cap"] == 20 for x in hist.values()), "historical_effective_lifetime_cap_30": all(x["effective_lifetime_cap"] == 30 for x in hist.values()), "frozen_cells_24": len(rows) == 24, "train_cells_13": split_cells["train"] == 13, "scale_holdout_cells_5": split_cells["structural_scale_holdout"] == 5, "topology_holdout_cells_6": split_cells["structural_topology_holdout"] == 6, "equal_cell_schedule_is_minimax_balanced_among_tested": True},
          }
          (out / "package-adjustment-nextgen-v2-maturity-planning-audit.json").write_text(json.dumps(audit, indent=2, sort_keys=True) + "\n")

          def at(name, voters):
              return next(r for r in sim if r["schedule"] == name and r["voters"] == voters)

          md = [
              "# Package Adjustment NextGen V2 — Maturity Planning Audit", "",
              "**READ-ONLY. NO NEXTGEN VOTES USED. NO VOTING ACTIVATION. NO PRODUCTION CHANGE.**", "",
              "## Historical participation", "",
              f"- V3: {hist['V3']['counted_votes']} votes / {hist['V3']['unique_voters']} voters",
              f"- V4: {hist['V4']['counted_votes']} votes / {hist['V4']['unique_voters']} voters",
              f"- V5: {hist['V5']['counted_votes']} votes / {hist['V5']['unique_voters']} voters",
              f"- Unique pseudonymous voter union: {len(union)}",
              f"- Observed ballots per voter across phase records: {min(all_counts)}–{max(all_counts)}; median {statistics.median(all_counts):.1f}",
              "- Historical daily cap: 20; effective lifetime cap: 30", "",
              "No raw voter identifiers are emitted. Historical phase totals are not treated as independent because voters overlap.", "",
              "## Frozen NextGen design", "",
              "- 129 challenges / 24 experimental cells",
              "- 13 training cells / 5 unseen-scale holdout cells / 6 unseen-topology holdout cells",
              "- Prospective time holdout remains required", "",
              "## Sampling schedules under review", "",
              "| Schedule | Min cell probability | Max cell probability |", "| --- | ---: | ---: |",
          ]
          for name in schedules:
              md.append(f"| {name} | {min(probs[name]):.4f} | {max(probs[name]):.4f} |")
          md += ["", "`equal_cell_via_family_weights` gives every frozen cell probability 1/24 while still sampling family first, so it maximizes the minimum cell probability among the tested schedules.", "", "## Planning snapshots — diagnostics, not gates", "", "| Schedule | Voters | Votes | P(all cells >=10 votes) | P(all cells >=15 votes) | Conservative P(all cells >=8 distinct voters) |", "| --- | ---: | ---: | ---: | ---: | ---: |"]
          for name in schedules:
              for voters in (15, 30, 50):
                  r = at(name, voters)
                  md.append(f"| {name} | {voters} | {r['total_votes']} | {r['prob_all_cells_ge_10_votes']:.3f} | {r['prob_all_cells_ge_15_votes']:.3f} | {r['conservative_prob_all_cells_ge_8_distinct_voters']:.3f} |")
          md += ["", "## What remains to preregister", "", "The final plan must freeze numeric minimum cell coverage, minimum distinct voters per cell, total voter coverage, effective voter cap, voter-cluster bootstrap precision/stability, stopping checkpoints, holdout protection, and the unresolved-cell/family rule.", "", "Stopping must be based on coverage and precision only, never whether an observed effect is favorable, significant, or agrees with V1.6.", "", "A separate workflow must commit the final maturity plan and its SHA-256 before voting activation."]
          (out / "package-adjustment-nextgen-v2-maturity-planning-audit.md").write_text("\n".join(md) + "\n")

          print("=== MATURITY PLANNING AUDIT SUMMARY ===")
          print("Frozen challenges / cells:", 129, 24)
          print("Train / scale holdout / topology holdout cells:", 13, 5, 6)
          print("Historical phase votes:", hist["V3"]["counted_votes"], hist["V4"]["counted_votes"], hist["V5"]["counted_votes"])
          print("Historical unique voter union:", len(union))
          print("Raw voter identifiers emitted: 0")
          print("Simulation trials per scenario:", trials)
          print("NextGen outcomes used: 0")
          print("PASS: maturity planning audit generated.")
          PY

      - name: Validate privacy and read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          out = Path("/tmp/pkgnv2-maturity-audit")
          files = sorted(out.iterdir())
          assert len(files) == 4, [p.name for p in files]
          pat = re.compile(r"\bext_[a-z0-9]+\b")
          assert not any(pat.search(p.read_text()) for p in files)
          a = json.loads((out / "package-adjustment-nextgen-v2-maturity-planning-audit.json").read_text())
          assert a["nextgen_votes_used"] is False
          assert a["voting_activation_authorized"] is False
          assert a["production_change_authorized"] is False
          assert all(a["hard_facts"].values())
          print("PASS: aggregate-only artifacts; no voter IDs; no NextGen outcomes.")
          PY
          test -z "$(git status --porcelain=v1)"
          test -z "$(git diff --name-only)"
          echo "PASS: repository untouched."

      - name: Revalidate production after audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Upload maturity planning audit
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-maturity-planning-audit
          path: /tmp/pkgnv2-maturity-audit/
          if-no-files-found: error
          retention-days: 30
