# QF5 V1R2 - Repair false-positive allowlist baseline gate; preserve exact read-only Phase 0 audit.
# OWNER MANUAL RUN. READ ONLY. NO BRANCH/COMMIT/PRODUCTION DEPLOYMENT.
# Reproduces the existing collision; a GREEN audit is NOT a repaired model.
name: QF5 V1R2 - Free Agent Stable ID Collision Lineage Audit (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf5-readonly-lineage:
    name: Exact-source identity and Free Agent collision audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QF5_BASE: '0621d68292fe088f5b948849eea2027c537534e2'
      QF5_REPORT_DIR: /tmp/qf5-phase0
    steps:
      - name: Checkout triggering main exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression dependency
        run: python3 -m pip install requests
      - name: Fail closed on moving refs or changed protected data
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP wrong commit'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty runner'; git status --short; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main moved'; exit 1; }
          [[ "$(git rev-parse "${QF5_BASE}^{commit}")" == "${QF5_BASE}" ]] || exit 1
          # The user may have removed failed QF5-v1.yml or QF5-v1r1.yml.
          # Reject ALL other changes since the exact approved QF4 production baseline.
          # Do not assume old workflow files remain present or that they are ordered.
          mapfile -t changed_files < <(git diff --name-only "${QF5_BASE}" HEAD)
          [[ ${#changed_files[@]} -ge 1 ]] || { echo 'STOP no QF5 workflow update'; exit 1; }
          for changed_file in "${changed_files[@]}"; do
            case "${changed_file}" in
              .github/workflows/QF5-v1.yml|.github/workflows/QF5-v1r1.yml|.github/workflows/QF5-v1r2.yml)
                echo "ALLOWED QF5-only workflow delta: ${changed_file}" ;;
              *) echo "STOP unexpected change after QF4 release: ${changed_file}"; exit 1 ;;
            esac
          done
          [[ -f .github/workflows/QF5-v1r2.yml ]] || { echo 'STOP V1R2 workflow file absent'; exit 1; }
          echo 'PASS immutable QF4 baseline plus only QF5 workflow-file changes'
          check_blob(){
            local path="$1" expected="$2" got
            got="$(git hash-object "$path")"
            [[ "$got" == "$expected" ]] || {
              echo "STOP $path source blob changed (got $got)"; exit 1;
            }
          }
          check_blob index.html '2666f7f8b167e48b7d1571ab527450b521d32c75'
          check_blob free-agent-board.html '700c52db74c05b1122b4f0a48cf082243d98b0a7'
          check_blob data/free_agents.json '7b36b98e8bbdd5fdd7ea23120d8ab62accb65b40'
          check_blob data/free_agent_utility_v1.json 'ab662a8c235e9302d60d3667c6f505aa2ecb2fe9'
          check_blob scripts/identity_crosswalk.json '3489c01c923474931f4db81e3dd338f437bfdf5f'
          check_blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
          echo 'PASS exact QF4 baseline and pinned A7/F02 production source artifacts'
      - name: Audit real SID collision and replay exact FA Board mapping in isolated Node fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${QF5_REPORT_DIR}"
          python3 - <<'PY'
          #!/usr/bin/env python3
          """QF5/A7-F02 Phase 0: read-only, pinned-source identity lineage audit.
          Do not import code as a production valuation update; this is a diagnostic only.
          """
          from __future__ import annotations
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          from collections import defaultdict
          from pathlib import Path

          root = Path.cwd()
          artifact_dir = Path(os.environ.get('QF5_REPORT_DIR', '/tmp/qf5-phase0'))
          artifact_dir.mkdir(parents=True, exist_ok=True)
          def read(path): return (root / path).read_text(encoding='utf-8')
          def norm(x): return re.sub(r'\s+', ' ', re.sub(r"[.'’\-]", '', str(x or '').strip().lower()))
          def required(condition, message):
              if not condition: raise AssertionError(message)

          paths = ['index.html','free-agent-board.html','data/free_agents.json','data/free_agent_utility_v1.json','model/releases/free-agent-production-v2/release.json','scripts/identity_crosswalk.json']
          sha = {p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          index, board = read('index.html'), read('free-agent-board.html')
          fa_doc = json.loads(read('data/free_agents.json'))
          free_agents = fa_doc['free_agents']
          utility = json.loads(read('data/free_agent_utility_v1.json'))
          release = json.loads(read('model/releases/free-agent-production-v2/release.json'))
          crosswalk = json.loads(read('scripts/identity_crosswalk.json'))
          required(len(free_agents) == fa_doc['count'] == 1614, 'Unexpected source FA count')
          required(len(utility['players']) == 406, 'Free Agent Utility source count changed')
          required(len(release['candidate_overrides']) == release['candidate_count'] == 333, 'FA V2 release hold changed')
          required(len(crosswalk) == 1083, 'Crosswalk source population changed')
          authoritative = [x for x in crosswalk if x.get('sleeper_id') and not x.get('requires_manual_review') and x.get('match_confidence') == 'high']
          auth_ids = {str(x['sleeper_id']) for x in authoritative}
          required(len(authoritative) == len(auth_ids) == 984, 'Authoritative 984-ID continuity not met')
          required(len({str(x['player_id']) for x in free_agents}) == len(free_agents), 'Duplicate raw Free Agent Sleeper ID')
          required(len({(str(x['player_id']),x['pos']) for x in utility['players']}) == 406, 'Free Agent Utility SID|position ranks not unique')
          release_ids = {str(x['sleeper_id']) for x in release['candidate_overrides']}
          required(len(release_ids) == 333, 'Free Agent V2 release IDs not unique')

          by_sid = {str(x['player_id']):x for x in free_agents}
          ids = ('11052','8702')
          required(all(x in by_sid for x in ids), 'Either Jaylon record is absent from pinned free-agent snapshot')
          jaylons = [by_sid[x] for x in ids]
          required(all(norm(x['name']) == 'jaylon jones' and x['pos'] == 'DB' for x in jaylons), 'Two-ID Jaylon collision no longer matches source')
          required(len({x['birth_date'] for x in jaylons}) == 2, 'Different-person DOB evidence missing')
          required(len({x['team'] for x in jaylons}) == 2, 'Different-person team evidence missing')
          required(not set(ids) & release_ids, 'A Jaylon was released in V2: requires new study')
          required(not set(ids) & auth_ids, 'A Jaylon is authoritative in identity crosswalk: requires re-assessment')

          # Explicitly separate *three* potentially untrusted name-based production matches.
          for string in ("'jaylon jones':0.342", "'jaylon jones':{pos:'DB',age:24,role:'Depth',team:'IND'", "'jaylon jones':{prod:0.15, pos:'DB', team:'CHI'}"):
              required(string in board, f'Expected collision lineage missing: {string}')
          required("const curated = (candidateCurated && candidateCurated.pos === fa.pos) ? candidateCurated : null;" in board, 'Position-only curated gate changed')
          required("const faProdMatch = (faProdEntry && faProdEntry.pos === fa.pos) ? faProdEntry : null;" in board, 'Position-only FA gate changed')
          required("const hasRealData = !!(curated && PROD_MULT.hasOwnProperty(key)) || !!faProdMatch;" in board, 'Current FA data-backed rule changed')
          required("valueKey = key;" in board, 'Current value key inheritance changed')
          required("valueKey = key + '_fa_' + fa.player_id;" in board, 'Unknown ID synthetic fallback changed')

          # Execute the EXACT current Free Agent Board mapping, with synthetic valuation
          # only so the test checks source identity *routing*, not a guessed FV formula.
          start = board.index('    const filteredRaw = raw.filter(fa => {')
          endmarker = '    }).filter(fa => fa.pos && fa.val > 0);'
          end = board.index(endmarker, start) + len(endmarker)
          mapping_source = board[start:end]
          start2 = board.index('    const EXCLUDED_FREE_AGENTS = [')
          end2 = board.index('    ];',start2)+len('    ];')
          exclude_source = board[start2:end2]
          js = r'''
          const assert = require('node:assert/strict');
          const raw=__FIXTURES__;
          function normalizeName(s){return String(s).trim().toLowerCase().replace(/[.'’-]/g,'').replace(/\s+/g,' ')}
          const ALIASES={},ALIASES_REVERSE={};
          const PLAYER_DB={
           'jaylon jones':{pos:'DB',age:24,role:'Depth',team:'IND'},
           'justin jefferson':{pos:'WR',age:27,role:'Elite',team:'MIN'},
           'devonta smith':{pos:'WR',age:27,role:'Elite',team:'PHI'},
          };
          const PROD_MULT={'jaylon jones':0.342,'justin jefferson':0.95,'devonta smith':0.88};
          const FA_PROD_MULT_DATA={
           'jaylon jones':{prod:0.15,pos:'DB',team:'CHI'},
           'devin neal':[{prod:0.27,pos:'RB',team:'A'},{prod:0.19,pos:'DB',team:'B'}],
          };
          let FREE_AGENTS=[],FREE_AGENT_UTILITY_ACTIVE=false,FREE_AGENT_UTILITY=new Map();
          const calls=[];
          function playerValue(pos,age,role,name){
           const prod = Object.prototype.hasOwnProperty.call(PROD_MULT,normalizeName(name)) ? PROD_MULT[normalizeName(name)] : 0.15;
           calls.push({pos,age,role,name,prod});return 1000 + Math.round(prod*1000);
          }
          __EXCLUSIONS__
          __MAPPING__
          const byId=Object.fromEntries(FREE_AGENTS.map(x=>[String(x.playerId),x]));
          for(const id of ['11052','8702','qf5_unknown_jaylon']){
           assert.equal(byId[id].key,'jaylon jones');
           assert.equal(byId[id].pos,'DB');
           assert.equal(byId[id].age,24);
           assert.equal(byId[id].role,'Depth');
           assert.equal(byId[id].hasRealData,true);
           assert.equal(calls.find(x=>String(x.name)==='jaylon jones' && x.pos==='DB').prod,0.342);
          }
          assert.equal(byId['11052'].val,byId['8702'].val);
          assert.equal(byId['11052'].val,byId['qf5_unknown_jaylon'].val);
          assert.equal(byId['qf5_wrong_position'].hasRealData,false);
          assert.equal(byId['qf5_wrong_position'].age,26);
          assert.equal(byId['qf5_wrong_position'].role,'Speculative');
          assert.equal(byId['qf5_wrong_position'].pos,'WR');
          assert.equal(byId['qf5_justin_lb'].hasRealData,false);
          assert.equal(byId['qf5_devonta_db'],undefined); // explicit existing DB exclusion
          assert.equal(byId['qf5_byron_dl'],undefined); // explicit existing DL exclusion
          assert.equal(byId['qf5_byron_wr'].hasRealData,false);
          assert.equal(byId['qf5_neal_rb'].hasRealData,true);
          assert.equal(byId['qf5_neal_db'].hasRealData,true);
          assert.notEqual(calls.find(x=>x.name==='devin neal_faprod_qf5_neal_rb').prod,calls.find(x=>x.name==='devin neal_faprod_qf5_neal_db').prod);
          const proof={both_inherit_historic_key: ['11052','8702'].every(id=>byId[id].hasRealData && byId[id].age===24 && byId[id].val===1342),
           unknown_sid_inherits_historic_key: byId.qf5_unknown_jaylon.hasRealData,
           same_name_different_position_guard_preserved: !byId.qf5_wrong_position.hasRealData,
           exclusions_preserved: !byId.qf5_devonta_db && !byId.qf5_byron_dl,
           array_different_position_guard_preserved: byId.qf5_neal_rb.hasRealData && byId.qf5_neal_db.hasRealData,
           synthetic_value_not_live_fv: true};
          console.log(JSON.stringify(proof));
          '''
          fixtures = jaylons + [
           {'player_id':'qf5_unknown_jaylon','name':'Jaylon Jones','pos':'DB','age':30,'team':'XX'},
           {'player_id':'qf5_wrong_position','name':'Jaylon Jones','pos':'WR','age':26,'team':'XX'},
           {'player_id':'qf5_justin_lb','name':'Justin Jefferson','pos':'LB','age':23,'team':'CLE'},
           {'player_id':'qf5_devonta_db','name':'Devonta Smith','pos':'DB','age':23,'team':'CAR'},
           {'player_id':'qf5_byron_dl','name':'Byron Young','pos':'DL','age':25,'team':'PHI'},
           {'player_id':'qf5_byron_wr','name':'Byron Young','pos':'WR','age':25,'team':'XX'},
           {'player_id':'qf5_neal_rb','name':'Devin Neal','pos':'RB','age':23,'team':'A'},
           {'player_id':'qf5_neal_db','name':'Devin Neal','pos':'DB','age':23,'team':'B'},
          ]
          js = js.replace('__FIXTURES__',json.dumps(fixtures)).replace('__EXCLUSIONS__',exclude_source).replace('__MAPPING__',mapping_source)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); jspath=f.name
          try:
              cp = subprocess.run(['node',jspath],capture_output=True,text=True)
              required(cp.returncode==0,'Actual FA mapping runtime fixture failed: '+cp.stderr[-1800:])
              proof=json.loads(cp.stdout.strip())
              required(all(proof.values()),'Actual current FA mapping did not reproduce all expected conditions')
          finally: Path(jspath).unlink(missing_ok=True)

          collisions=defaultdict(list)
          for fa in free_agents: collisions[(norm(fa['name']),fa['pos'])].append(fa)
          collisions={k:v for k,v in collisions.items() if len({str(x['player_id']) for x in v})>1}
          examples=[]
          for (name,pos),rows in sorted(collisions.items()):
              examples.append({'name':name,'pos':pos,'sleeper_ids':[str(x['player_id']) for x in rows],
                               'teams':[x.get('team') for x in rows], 'ages':[x.get('age') for x in rows],
                               'authoritative_id_count':sum(str(x['player_id']) in auth_ids for x in rows),
                               'fa_release_id_count':sum(str(x['player_id']) in release_ids for x in rows)})
          util_ranks={str(x['player_id']):x['priority_rank'] for x in utility['players'] if x['pos']=='DB'}
          report={
           'status':'PASS_READ_ONLY_AUDIT_STOP_BEFORE_REPAIR',
           'ticket':'A7-F02','workflow':'QF5 Phase 0',
           'source_provenance':{'repository_main_sha':os.environ.get('GITHUB_SHA','local'),
                               'synced_at':fa_doc['synced_at'],'file_sha256':sha},
           'locked_science_guards':{'fa_v2_release_overrides':len(release_ids),
                                    'free_agent_utility_rows':len(utility['players']),
                                    'authoritative_identity_crosswalk_unique_sids':len(auth_ids)},
           'jaylon_jones':{'distinct_sleeper_records':[{k:x.get(k) for k in ('player_id','name','pos','raw_position','team','age','birth_date','status')} for x in jaylons],
                           'release_v2_sid_covered':[sid for sid in ids if sid in release_ids],
                           'authoritative_crosswalk_sid_covered':[sid for sid in ids if sid in auth_ids],
                           'fa_utility_db_ranks':{sid:util_ranks.get(sid) for sid in ids},
                           'historic_name_prod':0.342,'historic_curated_identity':'IND / DB / age24 / Depth',
                           'legacy_fa_prod_entry':'CHI / DB / 0.15 (also name+position only)',
                           'runtime_reproduction':proof},
           'collision_exposure':{'same_normalized_name_and_position_groups':len(collisions),
                                 'players_in_groups':sum(len(x) for x in collisions.values()),
                                 'examples':examples[:60]},
           'bounded_repair_design':{
             'principle':'Production and curated source precedence must be based on verifiable stable Sleeper ID; name+position is not proof of same person',
             'explicit_hold':'Do not assert whether historical IND production belongs to either present SID without corroboration',
             'for_unresolved_identity':'Do not inherit PROD_MULT_DATA, PLAYER_DB metadata, or FA_PROD_MULT_DATA solely by colliding display name; use existing Speculative no-data estimate path with an SID-specific synthetic key',
             'expected_affected_surface':['free-agent-board.html derived FA mapping','Data-backed versus est. label','FA Utility V1 data-backed coverage and freshness contract'],
             'no_production_authorization':True,'no_model_refit':True,
             'next_gate':'External owner/design review, then exact-scope review-branch candidate with stable-ID fixtures and protected release regression'
           }}
          (artifact_dir/'qf5_phase0_identity_lineage.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          lines=[
           '# QF5 Phase 0 — Read-only player identity lineage audit',
           '', '**Decision: PASS audit, STOP before any production repair.**',
           '', f"Pinned free-agent snapshot contains **{len(free_agents)}** distinct Sleeper IDs; **{len(collisions)}** normalized name+position collision groups.",
           f"Authoritative identity crosswalk: **{len(auth_ids)}** unique stable SIDs; FA V2 release: **{len(release_ids)}** unchanged candidate SIDs; Free Agent Utility: **{len(utility['players'])}** ranks.",
           '', '## Jaylon Jones: two different real players',
           '', '| SID | Team | Position | Age | Birth date | Utility DB priority |', '|---|---|---|---:|---|---:|',
           ]
          for x in jaylons:
           sid=str(x['player_id']);lines.append(f"| {sid} | {x['team']} | {x['pos']} | {x['age']} | {x['birth_date']} | {util_ranks.get(sid, 'not ranked')} |")
          lines += ['', 'Both IDs are absent from the 984 authoritative crosswalk SID mappings and the 333 FA Production V2 release overrides.',
           'The **real mapping code** reproduces an unsafe name+position source inheritance: both current SIDs plus an unknown synthetic SID claim the old IND/DB/age-24/Depth canonical row and production 0.342. The runtime fixture uses a **synthetic score**, not a new or proposed actual FV.',
           '', '## Required repair boundary',
           '', '- No changes to frozen weights, models, draft pick curves, IDP science, package logic or trade desk player values.',
           '- Never automatically attach the IND .342 or the legacy CHI .15 row to a different Sleeper ID solely on a name/position match.',
           '- Unresolved identities must use existing SID-specific no-data estimate routing; do not invent replacement production.',
           '- Audit Free Agent Utility ranks and fail-closed data-backed eligibility before promoting any identity patch.',
           '- First secure an owner-reviewed deterministic identity policy and a separate read-only/review-branch candidate.',
           '', '## Same-name same-position collision groups',
           ]
          for row in examples[:60]: lines.append(f"- {row['name']} / {row['pos']}: {', '.join(row['sleeper_ids'])}")
          lines+=['','**No repository files were edited by this audit.**','']
          (artifact_dir/'qf5_phase0_identity_lineage.md').write_text('\n'.join(lines),encoding='utf-8')
          print('PASS QF5 Phase0 authoritative crosswalk=984 FA V2 release=333 FA utility=406')
          print('PASS actual Free Agent Board mapping replay: two distinct Jaylon SIDs and unknown SID inherit IND 0.342; guards pass for wrong-position controls')
          print('PASS source collision exposure: groups=',len(collisions),'players=',sum(len(x) for x in collisions.values()))
          print('STOP_AND_DESIGN_STABLE_ID_BOUND_MATCHING: audit-only, no repricing or production edit approved')
          print('Report:',artifact_dir)
          PY
      - name: Run all 14 repo regressions and existing protected release checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as v
          report = v.validate_deployment()
          assert report['actual_changed_entry_count'] == 320
          print('PASS frozen IDP 320 changes and 84 science holds via deployed validation')
          PY
      - name: Final fail-closed non-mutation check
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || {
            echo 'STOP unexpected repository write';git status --short;exit 1;
          }
          [[ "$(git hash-object free-agent-board.html)" == '700c52db74c05b1122b4f0a48cf082243d98b0a7' ]] || exit 1
          [[ "$(git hash-object index.html)" == '2666f7f8b167e48b7d1571ab527450b521d32c75' ]] || exit 1
          [[ "$(git hash-object data/free_agent_utility_v1.json)" == 'ab662a8c235e9302d60d3667c6f505aa2ecb2fe9' ]] || exit 1
          [[ "$(git hash-object scripts/identity_crosswalk.json)" == '3489c01c923474931f4db81e3dd338f437bfdf5f' ]] || exit 1
          echo 'QF5 PHASE0 GREEN means AUDIT COMPLETE, NOT A7-F02 FIXED. DO NOT PROMOTE.'
      - name: Attach read-only identity report (small, no model changes)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QF5-phase0-readonly-identity-lineage
          path: /tmp/qf5-phase0/
          if-no-files-found: error
          retention-days: 7
