name: Package Adjustment NextGen V2 Maturity Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install monitor dependency
        run: python3 -m pip install requests

      - name: Guard exact corrected research boundary
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          test -z "$(git status --porcelain=v1)"

          # Immutable frozen research evidence.
          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"
          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"
          test "$(git hash-object "$D/voting_sampling_correction_manifest.json")" = "8c181ec2dbcfb4b259de7e839247780e67539b09"

          # The uploaded workflow commit may advance main, but the reviewed
          # sampling-correction commit must remain in its ancestry.
          git merge-base --is-ancestor 8edba8a6f4e612fa20995a8c62c4be619907abe1 HEAD

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          correction = json.loads((d / "voting_sampling_correction_manifest.json").read_text())
          maturity = json.loads((d / "evidence_maturity_plan.json").read_text())
          maturity_manifest = json.loads((d / "evidence_maturity_plan_manifest.json").read_text())
          model_cfg = json.loads((d / "model_fit_preregistration.json").read_text())
          model_manifest = json.loads((d / "model_fit_preregistration_manifest.json").read_text())
          catalog = json.loads((d / "package_vote_challenges_nextgen_v2.json").read_text())

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          assert correction["status"] == "nextgen_v2_sampling_contract_corrected_before_valid_evidence"
          assert correction["valid_ballot_start_utc"] == "2026-09-11T15:22:18.334044+00:00"
          assert correction["outcome_blind_audit"]["pre_correction_transport_rows_observed_at_patch_time"] == 0
          assert correction["outcome_blind_audit"]["choice_fields_inspected"] is False
          assert correction["sampling"]["voter_roster_filtering_allowed"] is False
          assert abs(correction["sampling"]["cell_probability"] - 1/24) < 1e-15
          assert correction["sampling"]["recent_memory_scope"] == "within_already_selected_cell_only"
          assert correction["production_formula_changed"] is False

          assert sha("index.html") == correction["corrected_browser"]["sha256"]
          assert sha("scripts/validation/repo_regression_checks.py") == (
              correction["permanent_regression"]["sha256"]
          )
          assert sha("scripts/market/ktc_pipeline.py") == (
              correction["ktc_transport_isolation_unchanged"]["sha256"]
          )

          assert sha(d / "package_vote_challenges_nextgen_v2.json") == (
              correction["anchors"]["catalog_sha256"]
          )
          assert sha(d / "evidence_maturity_plan.json") == (
              correction["anchors"]["maturity_plan_sha256"]
          )
          assert sha(d / "model_fit_preregistration.json") == (
              correction["anchors"]["model_fit_preregistration_sha256"]
          )

          assert maturity["status"] == "preregistered_before_nextgen_voting"
          assert maturity_manifest["status"] == "committed_evidence_maturity_plan"
          assert maturity_manifest["plan_json"]["sha256"] == sha(d / "evidence_maturity_plan.json")
          assert model_cfg["status"] == "frozen_model_fit_preregistration"
          assert model_cfg["frozen"] is True
          assert model_manifest["status"] == "frozen_model_fit_preregistration_manifest"
          assert model_manifest["frozen"] is True
          assert model_manifest["artifacts"]["config"]["sha256"] == sha(d / "model_fit_preregistration.json")
          assert model_manifest["artifacts"]["fitter"]["sha256"] == sha(d / "fit_package_adjustment_nextgen_v2.py")

          gate = maturity["primary_maturity_checkpoint"]
          assert gate["minimum_valid_effective_votes"] == 800
          assert gate["minimum_distinct_voters"] == 40
          assert gate["minimum_valid_effective_votes_per_each_of_24_cells"] == 15
          assert gate["minimum_distinct_voters_per_each_of_24_cells"] == 10
          assert maturity["voter_protections"]["daily_valid_nextgen_vote_cap"] == 20
          assert maturity["voter_protections"]["primary_evidence_effective_lifetime_cap"] == 20
          assert maturity["stopping_rule"]["hard_collection_cap_valid_effective_votes"] == 1200
          assert maturity["stopping_rule"]["if_coverage_not_mature_continue_in_fixed_vote_increments"] == 100

          # The frozen fitter must encode the same operational evidence gates.
          assert model_cfg["maturity_gate"]["minimum_valid_effective_votes"] == 800.0
          assert model_cfg["maturity_gate"]["minimum_distinct_voters"] == 40
          assert model_cfg["maturity_gate"]["minimum_valid_effective_votes_per_cell"] == 15.0
          assert model_cfg["maturity_gate"]["minimum_distinct_voters_per_cell"] == 10
          assert model_cfg["maturity_gate"]["required_cell_count"] == 24
          assert model_cfg["voter_protections"]["daily_valid_nextgen_vote_cap"] == 20
          assert model_cfg["voter_protections"]["primary_evidence_effective_lifetime_cap"] == 20.0
          assert model_cfg["stopping"]["first_checkpoint_valid_effective_votes"] == 800
          assert model_cfg["stopping"]["coverage_only_increment"] == 100
          assert model_cfg["stopping"]["hard_collection_cap_valid_effective_votes"] == 1200.0

          assert catalog["status"] == "frozen_package_adjustment_nextgen_v2"
          assert catalog["frozen"] is True
          assert len(catalog["challenges"]) == 129

          print("PASS: corrected sampling boundary and frozen maturity gates confirmed.")
          PY

      - name: Verify production before monitoring
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Build outcome-blind maturity snapshot
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/pkgnv2-maturity-monitor"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import math
          import re
          import textwrap
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          ROOT = Path.cwd()
          D = ROOT / "research/package-adjustment-nextgen-v2"
          OUT = Path("/tmp/pkgnv2-maturity-monitor")

          SOURCE_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          VOTE_PREFIX = "__" + "pkg" + "nv2__|"
          META_PREFIX = "__" + "pkg" + "nv2_meta__|"
          SCHEMA_MARKER = "__" + "pkg" + "nv2_schema__|" + "1"

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def sha256_file(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def parse_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          correction = read_json(D / "voting_sampling_correction_manifest.json")
          maturity_plan = read_json(D / "evidence_maturity_plan.json")
          maturity_manifest = read_json(D / "evidence_maturity_plan_manifest.json")
          model_cfg = read_json(D / "model_fit_preregistration.json")
          model_manifest = read_json(D / "model_fit_preregistration_manifest.json")
          catalog_doc = read_json(D / "package_vote_challenges_nextgen_v2.json")

          DAILY_CAP = int(model_cfg["voter_protections"]["daily_valid_nextgen_vote_cap"])
          LIFETIME_CAP = float(model_cfg["voter_protections"]["primary_evidence_effective_lifetime_cap"])
          assert DAILY_CAP == int(maturity_plan["voter_protections"]["daily_valid_nextgen_vote_cap"])
          assert LIFETIME_CAP == float(maturity_plan["voter_protections"]["primary_evidence_effective_lifetime_cap"])

          cutoff = parse_utc(correction["valid_ballot_start_utc"])
          assert cutoff is not None

          generated_at = datetime.now(timezone.utc)
          catalog = {c["id"]: c for c in catalog_doc["challenges"]}
          assert len(catalog) == 129

          def cell_key(c):
              return "|".join((
                  str(c["family"]),
                  str(c["cell_id"]),
                  str(c["scale_label"]),
                  str(c["split"]),
              ))

          cells = {}
          for c in catalog.values():
              key = cell_key(c)
              meta = (
                  c["family"],
                  c["cell_id"],
                  c["scale_label"],
                  c["split"],
              )
              if key in cells:
                  assert cells[key] == meta
              else:
                  cells[key] = meta

          assert len(cells) == 24
          split_counts = Counter(meta[3] for meta in cells.values())
          family_counts = Counter(meta[0] for meta in cells.values())
          assert split_counts == {
              "train": 13,
              "structural_scale_holdout": 5,
              "structural_topology_holdout": 6,
          }
          assert family_counts == {
              "core_concentration_2v2": 15,
              "fragmentation_filler": 3,
              "structural_topology_3v3": 6,
          }

          response = requests.get(SOURCE_URL, timeout=30)
          response.raise_for_status()
          source_bytes = response.content
          rows = list(csv.DictReader(io.StringIO(response.text)))

          excluded = Counter()
          candidates = []
          raw_prefix_rows = 0

          for source_index, row in enumerate(rows):
              keep = str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue
              raw_prefix_rows += 1

              ts = parse_utc(row.get("timestamp"))
              if ts is None:
                  excluded["invalid_timestamp"] += 1
                  continue
              if ts <= cutoff:
                  excluded["at_or_before_corrected_cutoff"] += 1
                  continue
              if ts > generated_at:
                  excluded["future_timestamp"] += 1
                  continue

              parts = keep.split("|")
              if len(parts) != 3 or parts[0] != VOTE_PREFIX[:-1]:
                  excluded["malformed_keep_transport"] += 1
                  continue

              challenge_id = parts[1].strip()
              choice_side = parts[2].strip().upper()
              if choice_side not in {"A", "B"}:
                  excluded["invalid_choice_token"] += 1
                  continue

              meta = str(row.get("trade") or "")
              if not meta.startswith(META_PREFIX):
                  excluded["missing_or_invalid_meta_prefix"] += 1
                  continue
              displayed_left = meta[len(META_PREFIX):].strip().upper()
              if displayed_left not in {"A", "B"}:
                  excluded["invalid_display_side"] += 1
                  continue

              if str(row.get("cut") or "") != SCHEMA_MARKER:
                  excluded["invalid_schema_marker"] += 1
                  continue

              voter_id = str(row.get("voter_roster_id") or "").strip()
              if not voter_id:
                  excluded["missing_voter_id"] += 1
                  continue

              if challenge_id not in catalog:
                  excluded["unknown_challenge_id"] += 1
                  continue

              candidates.append({
                  "timestamp": ts,
                  "timestamp_iso": ts.isoformat(),
                  "voter_id": voter_id,
                  "challenge_id": challenge_id,
                  "choice_side": choice_side,
                  "displayed_left_side": displayed_left,
                  "source_index": source_index,
              })

          # Deterministic daily cap: same semantic ordering as frozen fitter,
          # with source_index as a final tie-breaker for truly identical rows.
          candidates.sort(key=lambda r: (
              r["timestamp"],
              r["voter_id"],
              r["challenge_id"],
              r["choice_side"],
              r["displayed_left_side"],
              r["source_index"],
          ))

          daily_counts = Counter()
          valid = []
          for r in candidates:
              key = (r["voter_id"], r["timestamp"].date().isoformat())
              if daily_counts[key] >= DAILY_CAP:
                  excluded["daily_cap_dropped"] += 1
                  continue
              daily_counts[key] += 1
              valid.append(r)

          voter_counts = Counter(r["voter_id"] for r in valid)
          voter_weight = {
              voter: min(1.0, LIFETIME_CAP / count)
              for voter, count in voter_counts.items()
          }

          per_cell_mass = {key: 0.0 for key in cells}
          per_cell_voters = {key: set() for key in cells}
          distinct_challenges = set()

          for r in valid:
              challenge = catalog[r["challenge_id"]]
              key = cell_key(challenge)
              w = voter_weight[r["voter_id"]]
              per_cell_mass[key] += w
              per_cell_voters[key].add(r["voter_id"])
              distinct_challenges.add(r["challenge_id"])

          effective_votes = sum(voter_weight[r["voter_id"]] for r in valid)
          distinct_voters = len(voter_counts)
          distinct_cells_observed = sum(per_cell_mass[k] > 0 for k in cells)
          distinct_families_observed = len({
              cells[k][0] for k in cells if per_cell_mass[k] > 0
          })

          gate = maturity_plan["primary_maturity_checkpoint"]
          min_total = float(gate["minimum_valid_effective_votes"])
          min_voters = int(gate["minimum_distinct_voters"])
          min_cell_votes = float(
              gate["minimum_valid_effective_votes_per_each_of_24_cells"]
          )
          min_cell_voters = int(
              gate["minimum_distinct_voters_per_each_of_24_cells"]
          )

          gates = {
              "minimum_valid_effective_votes": effective_votes + 1e-9 >= min_total,
              "minimum_distinct_voters": distinct_voters >= min_voters,
              "minimum_valid_effective_votes_each_cell": all(
                  per_cell_mass[k] + 1e-9 >= min_cell_votes for k in cells
              ),
              "minimum_distinct_voters_each_cell": all(
                  len(per_cell_voters[k]) >= min_cell_voters for k in cells
              ),
          }
          all_mature = all(gates.values())

          hard_cap = float(
              maturity_plan["stopping_rule"]["hard_collection_cap_valid_effective_votes"]
          )
          increment = int(
              maturity_plan["stopping_rule"][
                  "if_coverage_not_mature_continue_in_fixed_vote_increments"
              ]
          )

          checkpoint_values = list(range(int(min_total), int(hard_cap) + 1, increment))
          rounded_effective = int(round(effective_votes))
          effective_is_integer = abs(effective_votes - rounded_effective) <= 1e-9
          at_preregistered_checkpoint = (
              effective_is_integer and rounded_effective in checkpoint_values
          )
          current_checkpoint = rounded_effective if at_preregistered_checkpoint else None

          if effective_votes > hard_cap + 1e-9:
              status = "hard_cap_breached_stop_collection_no_fit"
              next_checkpoint = None
          elif at_preregistered_checkpoint and rounded_effective == int(hard_cap) and not all_mature:
              status = "hard_cap_coverage_unresolved_stop_collection"
              next_checkpoint = None
          elif at_preregistered_checkpoint and all_mature:
              status = "maturity_reached_stop_collection"
              next_checkpoint = None
          elif effective_votes < min_total - 1e-9:
              status = "collecting_before_first_checkpoint"
              next_checkpoint = int(min_total)
          else:
              status = "between_or_failed_preregistered_checkpoints_continue_collection"
              higher = [cp for cp in checkpoint_values if cp > effective_votes + 1e-9]
              next_checkpoint = min(higher) if higher else int(hard_cap)

          # Canonical reproducibility fingerprint only. The canonical ballot
          # payload contains private voter IDs and choices in memory, but only
          # the SHA-256 is persisted.
          canonical_rows = [
              {
                  "timestamp": r["timestamp_iso"],
                  "voter_id": r["voter_id"],
                  "challenge_id": r["challenge_id"],
                  "choice_side": r["choice_side"],
                  "displayed_left_side": r["displayed_left_side"],
              }
              for r in valid
          ]
          canonical_payload = json.dumps(
              canonical_rows,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          canonical_ballot_sha256 = hashlib.sha256(canonical_payload).hexdigest()

          cell_rows = []
          for key in sorted(cells):
              family, cell_id, scale_label, split = cells[key]
              votes = per_cell_mass[key]
              voters = len(per_cell_voters[key])
              cell_rows.append({
                  "cell_key": key,
                  "family": family,
                  "cell_id": cell_id,
                  "scale_label": scale_label,
                  "split": split,
                  "effective_votes": round(votes, 10),
                  "distinct_voters": voters,
                  "vote_gate_pass": votes + 1e-9 >= min_cell_votes,
                  "voter_gate_pass": voters >= min_cell_voters,
                  "cell_mature": (
                      votes + 1e-9 >= min_cell_votes and voters >= min_cell_voters
                  ),
              })

          anchors = {
              "canonical_challenge_payload_sha256": correction["anchors"][
                  "canonical_challenge_payload_sha256"
              ],
              "catalog_sha256": correction["anchors"]["catalog_sha256"],
              "maturity_plan_sha256": correction["anchors"]["maturity_plan_sha256"],
              "maturity_plan_manifest_sha256": sha256_file(
                  D / "evidence_maturity_plan_manifest.json"
              ),
              "model_fit_preregistration_sha256": correction["anchors"][
                  "model_fit_preregistration_sha256"
              ],
              "model_fit_preregistration_manifest_sha256": sha256_file(
                  D / "model_fit_preregistration_manifest.json"
              ),
              "fitter_sha256": sha256_file(
                  D / "fit_package_adjustment_nextgen_v2.py"
              ),
              "correction_manifest_sha256": sha256_file(
                  D / "voting_sampling_correction_manifest.json"
              ),
              "correction_commit": "8edba8a6f4e612fa20995a8c62c4be619907abe1",
              "production_exact_live_formula_sha256": correction["anchors"][
                  "production_exact_live_formula_sha256"
              ],
              "player_fv_sha256": (
                  "a12a0fed97a95f8bbd3b33d56d1f8151de228a344af98982e6fb01b9a610012d"
              ),
              "league_rosters_sha256": (
                  "0d49ee988dc07afa7b0e34daa7d5e7a62cc9e263dca637dc760e27994bc9c716"
              ),
          }

          result = {
              "schema_version": 1,
              "status": status,
              "generated_at_utc": generated_at.isoformat(),
              "research_only": True,
              "model_fit_run": False,
              "production_change_authorized": False,
              "automatic_production_change_allowed": False,
              "valid_ballot_start_utc": correction["valid_ballot_start_utc"],
              "source": {
                  "sheet_csv_sha256": hashlib.sha256(source_bytes).hexdigest(),
                  "total_csv_rows": len(rows),
                  "raw_nextgen_prefix_rows": raw_prefix_rows,
              },
              "canonical_ballot_sha256": canonical_ballot_sha256,
              "anchors": anchors,
              "filtering": {
                  "post_cutoff_transport_candidates_before_daily_cap": len(candidates),
                  "valid_ballots_after_daily_cap": len(valid),
                  "excluded_counts": dict(sorted(excluded.items())),
                  "daily_valid_vote_cap": DAILY_CAP,
                  "effective_lifetime_cap": LIFETIME_CAP,
              },
              "coverage": {
                  "valid_effective_votes": round(effective_votes, 10),
                  "distinct_voters": distinct_voters,
                  "distinct_challenges": len(distinct_challenges),
                  "distinct_cells": distinct_cells_observed,
                  "distinct_families": distinct_families_observed,
                  "minimum_effective_votes_any_cell": round(
                      min(per_cell_mass.values()), 10
                  ),
                  "minimum_distinct_voters_any_cell": min(
                      len(v) for v in per_cell_voters.values()
                  ),
                  "experimental_cell_count": len(cells),
                  "split_cell_counts": dict(sorted(split_counts.items())),
                  "family_cell_counts": dict(sorted(family_counts.items())),
              },
              "maturity": {
                  "thresholds": {
                      "minimum_valid_effective_votes": min_total,
                      "minimum_distinct_voters": min_voters,
                      "minimum_effective_votes_each_cell": min_cell_votes,
                      "minimum_distinct_voters_each_cell": min_cell_voters,
                      "hard_collection_cap_valid_effective_votes": hard_cap,
                  },
                  "gates": gates,
                  "all_gates_pass": all_mature,
                  "at_preregistered_checkpoint": at_preregistered_checkpoint,
                  "current_preregistered_checkpoint_effective_votes": current_checkpoint,
                  "checkpoint_values_effective_votes": checkpoint_values,
                  "next_preregistered_checkpoint_effective_votes": next_checkpoint,
              },
              "privacy": {
                  "raw_voter_ids_persisted": False,
                  "choice_counts_or_rates_persisted": False,
                  "ballot_rows_persisted": False,
                  "canonical_ballot_hash_only": True,
              },
          }

          json_path = OUT / "package-adjustment-nextgen-v2-maturity-monitor.json"
          md_path = OUT / "package-adjustment-nextgen-v2-maturity-monitor.md"
          csv_path = OUT / "package-adjustment-nextgen-v2-cell-coverage.csv"

          json_path.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          with csv_path.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=[
                  "cell_key",
                  "family",
                  "cell_id",
                  "scale_label",
                  "split",
                  "effective_votes",
                  "distinct_voters",
                  "vote_gate_pass",
                  "voter_gate_pass",
                  "cell_mature",
              ])
              writer.writeheader()
              writer.writerows(cell_rows)

          gate_lines = "\n".join(
              f"- {name}: **{'PASS' if passed else 'NOT YET'}**"
              for name, passed in gates.items()
          )
          next_line = (
              "none — collection should stop"
              if next_checkpoint is None
              else str(next_checkpoint)
          )
          md = f"""# Package Adjustment NextGen V2 — Maturity Monitor

          **Status: `{status}`**

          This is an outcome-blind coverage monitor. It does **not** fit M0/M1/M2a/M2b,
          report A/B choice rates, or authorize any production change.

          ## Evidence window

          - Valid-ballot start: `{correction["valid_ballot_start_utc"]}`
          - Generated at: `{generated_at.isoformat()}`
          - Raw NextGen-prefix transport rows: **{raw_prefix_rows}**
          - Valid ballots after cutoff/transport validation/daily cap: **{len(valid)}**
          - Valid effective votes after the 20-vote lifetime cap: **{effective_votes:.3f}**
          - Distinct voters: **{distinct_voters}**
          - Distinct frozen challenges observed: **{len(distinct_challenges)}**
          - Experimental cells observed: **{distinct_cells_observed} / 24**
          - Canonical ballot SHA-256: `{canonical_ballot_sha256}`

          ## Frozen maturity gates

          {gate_lines}

          - Minimum effective votes in any cell: **{min(per_cell_mass.values()):.3f}**
          - Minimum distinct voters in any cell: **{min(len(v) for v in per_cell_voters.values())}**
          - At an exact preregistered checkpoint: **{at_preregistered_checkpoint}**
          - Current preregistered checkpoint: **{current_checkpoint if current_checkpoint is not None else "none"}**
          - Next preregistered checkpoint: **{next_line}**

          ## Interpretation

          `collecting_before_first_checkpoint` means continue collection without fitting.
          `between_or_failed_preregistered_checkpoints_continue_collection` means no stop
          decision is authorized from this snapshot; continue only to the next frozen
          100-effective-vote checkpoint. Coverage is shown diagnostically between checkpoints,
          but maturity is declared only at 800/900/1000/1100/1200 effective votes.
          `maturity_reached_stop_collection` means all coverage gates are met at an exact
          preregistered checkpoint and collection should stop before the separately frozen
          model-fit procedure is run. A hard-cap status means stop collection and do not relax gates.

          ## Privacy / outcome isolation

          - No voter IDs are written to this artifact.
          - No A/B counts, rates, winners, or model effects are written.
          - No raw ballot rows are written.
          - Choices are used only for transport validation and the canonical reproducibility hash.
          - `model_fit_run = false`.
          - Production Package Adjustment V1.6 remains unchanged.
          """
          md_path.write_text(textwrap.dedent(md).strip() + "\n", encoding="utf-8")

          print("NextGen V2 maturity monitor status:", status)
          print("Valid effective votes:", round(effective_votes, 3))
          print("Distinct voters:", distinct_voters)
          print("Minimum cell effective votes:", round(min(per_cell_mass.values()), 3))
          print("Minimum cell distinct voters:", min(len(v) for v in per_cell_voters.values()))
          print("All maturity gates pass:", all_mature)
          print("At preregistered checkpoint:", at_preregistered_checkpoint)
          print("Current checkpoint:", current_checkpoint)
          print("Next checkpoint:", next_checkpoint)
          print("Model fit run: False")
          PY

      - name: Validate outcome and privacy isolation
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/pkgnv2-maturity-monitor"

          python3 - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          out = Path("/tmp/pkgnv2-maturity-monitor")
          j = json.loads(
              (out / "package-adjustment-nextgen-v2-maturity-monitor.json").read_text()
          )
          md = (out / "package-adjustment-nextgen-v2-maturity-monitor.md").read_text()
          csv_text = (
              out / "package-adjustment-nextgen-v2-cell-coverage.csv"
          ).read_text()

          assert j["research_only"] is True
          assert j["model_fit_run"] is False
          assert j["production_change_authorized"] is False
          assert j["automatic_production_change_allowed"] is False
          assert j["valid_ballot_start_utc"] == "2026-09-11T15:22:18.334044+00:00"
          assert j["coverage"]["experimental_cell_count"] == 24
          assert j["coverage"]["split_cell_counts"] == {
              "structural_scale_holdout": 5,
              "structural_topology_holdout": 6,
              "train": 13,
          }
          assert j["coverage"]["family_cell_counts"] == {
              "core_concentration_2v2": 15,
              "fragmentation_filler": 3,
              "structural_topology_3v3": 6,
          }
          assert j["maturity"]["checkpoint_values_effective_votes"] == [800, 900, 1000, 1100, 1200]
          if j["status"] == "maturity_reached_stop_collection":
              assert j["maturity"]["at_preregistered_checkpoint"] is True
              assert j["maturity"]["all_gates_pass"] is True
          if j["status"] == "hard_cap_coverage_unresolved_stop_collection":
              assert j["maturity"]["current_preregistered_checkpoint_effective_votes"] == 1200
              assert j["maturity"]["all_gates_pass"] is False

          # Persisted schema must not expose row-level voter or choice fields.
          forbidden_keys = {
              "voter_id",
              "voter_roster_id",
              "choice",
              "choice_side",
              "displayed_left_side",
              "left_canonical_side",
              "ballots",
              "voter_weights",
              "package_votes",
              "target_votes",
              "package_choice_pct",
              "weighted_package_choice_pct",
          }

          def walk(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      assert k not in forbidden_keys, f"forbidden persisted key: {k}"
                      walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v)

          walk(j)

          combined = (
              (out / "package-adjustment-nextgen-v2-maturity-monitor.json").read_text()
              + "\n" + md + "\n" + csv_text
          )
          assert not re.search(r"\bext_[A-Za-z0-9_-]+\b", combined)
          vote_marker = "__" + "pkg" + "nv2__|"
          meta_marker = "__" + "pkg" + "nv2_meta__|"
          schema_marker = "__" + "pkg" + "nv2_schema__|" + "1"
          assert vote_marker not in combined
          assert meta_marker not in combined
          assert schema_marker not in combined

          with (
              out / "package-adjustment-nextgen-v2-cell-coverage.csv"
          ).open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 24
          assert set(rows[0]) == {
              "cell_key",
              "family",
              "cell_id",
              "scale_label",
              "split",
              "effective_votes",
              "distinct_voters",
              "vote_gate_pass",
              "voter_gate_pass",
              "cell_mature",
          }

          print("PASS: monitor artifacts are coverage-only and privacy-safe.")
          PY

      - name: Run full repository regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove monitor wrote nothing to repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          test ! -e research/package-adjustment-nextgen-v2/package_vote_nextgen_v2_results.json
          test ! -e research/package-adjustment-nextgen-v2/package_vote_nextgen_v2_results.md
          echo "PASS: monitor is read-only and wrote no fit/results files to the repository."

      - name: Upload maturity monitor artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-maturity-monitor
          path: /tmp/pkgnv2-maturity-monitor
          retention-days: 30
          if-no-files-found: error
