# PREFLIGHTED: V6_PHASE4_RESEARCH_CLOSEOUT_NO_CANDIDATE_V1
name: Draft Pick FV V6 - Phase 4 Research Closeout

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "requests==2.34.2"

      - name: Guard exact frozen V6 no-candidate result
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/draft-pick-fv-v6/structural_continuity_preregistration_v6.json"]="87c25b5390f75707934deb6d28b5513e6c93cf25"
            ["research/draft-pick-fv-v6/r1_r4_dob_repair_manifest_v6_1.json"]="5647d82ac9b7057fc973e7823d1c3728e0c5a0f1"
            ["research/draft-pick-fv-v6/r1_r4_phase4_metric_implementation_contract_v6_1.json"]="39df9d56631242b5d2c681a8938c5299cc129378"
            ["research/draft-pick-fv-v6/r1_r4_phase4_metric_implementation_contract_manifest_v6_1.json"]="36285f26e699f5026ca65d6b2fa0df0dd34167f2"
            ["research/draft-pick-fv-v6/r1_r4_phase4_solver_erratum_v6_1.json"]="12642c456891cb277f6fb3167e1f2e018b79a9f6"
            ["research/draft-pick-fv-v6/r1_r4_phase4_solver_erratum_manifest_v6_1.json"]="7487909232b8db08fbdb5f1a9b6dabcf86cefb1a"
            ["research/draft-pick-fv-v6/r1_r4_loyo_development_selection_v6_1.json"]="378ba0b1a4f2e9cc211d01dcf2400192954ce673"
            ["research/draft-pick-fv-v6/r1_r4_loyo_development_selection_manifest_v6_1.json"]="67a4d246d290e372ae8563763f13c56a2f0cd9c0"
            ["research/draft-pick-fv-v6/r1_r4_frozen_development_candidate_v6_1.json"]="a063609298fa88a942cd720daf28fce6deec857e"
            ["research/draft-pick-fv-v6/r1_r4_loyo_bootstrap_v6_1.json"]="525484127c190b11fc8d1727736d37c860066d35"
            ["research/package-adjustment-production-candidate-v1/live_deployment.json"]="fb192d6d52ca302f9694adc3ae39c7f1047f6140"
          )

          for path in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$path")"
            test "$actual" = "${EXPECTED[$path]}" || {
              echo "ERROR: frozen V6 closeout input drift: $path"
              echo "expected=${EXPECTED[$path]} actual=$actual"
              exit 1
            }
          done

          for p in             research/draft-pick-fv-v6/r1_r4_v6_research_closeout.json             research/draft-pick-fv-v6/r1_r4_v6_research_closeout.md             research/draft-pick-fv-v6/r1_r4_v6_research_closeout_manifest.json
          do
            test ! -e "$p"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v6")
          r=json.loads((d/"r1_r4_loyo_development_selection_v6_1.json").read_text())
          m=json.loads((d/"r1_r4_loyo_development_selection_manifest_v6_1.json").read_text())
          c=json.loads((d/"r1_r4_frozen_development_candidate_v6_1.json").read_text())
          b=json.loads((d/"r1_r4_loyo_bootstrap_v6_1.json").read_text())
          e=json.loads((d/"r1_r4_phase4_solver_erratum_v6_1.json").read_text())

          stop="STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
          assert r["decision"]==stop
          assert m["decision"]==stop
          assert c["decision"]==stop
          assert r["eligible_candidates"]==[]
          assert r["selected_candidate"] is None
          assert r["final_candidate"] is None
          assert m["eligible_candidate_n"]==0
          assert m["final_candidate_frozen"] is False

          assert r["2024_H2_outcome_open_authorized_next_stage"] is False
          assert r["2024_H3_outcomes_remain_sealed"] is True
          assert r["holdout_2024_outcomes_read"] is False
          assert r["holdout_2024_pick_identity_file_read"] is False
          assert c["holdout_2024_outcomes_read"] is False

          assert r["production_change_authorized"] is False
          assert r["year_discount_fit_or_changed"] is False
          assert r["r5_r6_fit_or_changed"] is False
          assert b["replicates"]==10000
          assert b["seed"]==20260923
          assert b["candidate_fit_performed_inside_bootstrap"] is False
          assert e["scientific_contract_changed"] is False

          d1=r["D1_boundary_free_diagnostic"]
          assert d1["can_win"] is False
          assert d1["all_development_fit"]["r1_r4_values"]["r4_late"] < 1414
          assert d1["all_development_fit"]["structural"]["r5_r6_unchanged"] is True

          # Freeze the exact observed failure pattern.
          c1=r["eligibility_gate_results"]["C1_ROUNDWISE_RESCALE_R1_R4"]
          c2=r["eligibility_gate_results"]["C2_ANCHORED_ADDITIVE_ROUND_TIER_CURVE"]
          c3=r["eligibility_gate_results"]["C3_SHRUNK_MONOTONE_SLOT_CURVE_R1_R4"]
          assert c1["gates"]["h3_o1_shape_regression_vs_C0_le_2pct"] is False
          assert c1["gates"]["no_hard_numeric_bound_saturation"] is True
          assert c2["gates"]["h3_o1_shape_regression_vs_C0_le_2pct"] is False
          assert c2["gates"]["no_hard_numeric_bound_saturation"] is False
          assert c3["gates"]["h3_o1_shape_regression_vs_C0_le_2pct"] is False
          assert c3["gates"]["no_hard_numeric_bound_saturation"] is False
          assert c3["gates"]["c3_selected_alpha_not_grid_edge"] is False

          print("PASS: exact V6 no-candidate scientific state frozen for closeout.")
          PY

      - name: Write closeout builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/build_v6_research_closeout.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          D = ROOT / "research" / "draft-pick-fv-v6"

          PRE = D / "structural_continuity_preregistration_v6.json"
          RESULT = D / "r1_r4_loyo_development_selection_v6_1.json"
          RESULT_MAN = D / "r1_r4_loyo_development_selection_manifest_v6_1.json"
          FROZEN_CAND = D / "r1_r4_frozen_development_candidate_v6_1.json"
          BOOT = D / "r1_r4_loyo_bootstrap_v6_1.json"
          IMPL = D / "r1_r4_phase4_metric_implementation_contract_v6_1.json"
          IMPL_MAN = D / "r1_r4_phase4_metric_implementation_contract_manifest_v6_1.json"
          ERRATUM = D / "r1_r4_phase4_solver_erratum_v6_1.json"
          ERRATUM_MAN = D / "r1_r4_phase4_solver_erratum_manifest_v6_1.json"
          DOB_MAN = D / "r1_r4_dob_repair_manifest_v6_1.json"

          OUT = D / "r1_r4_v6_research_closeout.json"
          OUT_MD = D / "r1_r4_v6_research_closeout.md"
          OUT_MAN = D / "r1_r4_v6_research_closeout_manifest.json"

          WINNERS = (
              "C1_ROUNDWISE_RESCALE_R1_R4",
              "C2_ANCHORED_ADDITIVE_ROUND_TIER_CURVE",
              "C3_SHRUNK_MONOTONE_SLOT_CURVE_R1_R4",
          )

          def load(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canon(obj) -> str:
              raw = json.dumps(
                  obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def finite(v):
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return False
              return x == x and abs(x) != float("inf")

          def main():
              pre = load(PRE)
              result = load(RESULT)
              result_man = load(RESULT_MAN)
              frozen = load(FROZEN_CAND)
              boot = load(BOOT)
              impl = load(IMPL)
              impl_man = load(IMPL_MAN)
              err = load(ERRATUM)
              err_man = load(ERRATUM_MAN)
              dob_man = load(DOB_MAN)

              stop = "STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
              assert result["decision"] == stop
              assert result_man["decision"] == stop
              assert frozen["decision"] == stop
              assert result["eligible_candidates"] == []
              assert result["selected_candidate"] is None
              assert result["final_candidate"] is None
              assert result["final_candidate_frozen"] is False
              assert result_man["eligible_candidate_n"] == 0
              assert result_man["selected_candidate"] is None
              assert result_man["final_candidate_frozen"] is False

              assert result["2024_H2_outcome_open_authorized_next_stage"] is False
              assert result["2024_H3_outcomes_remain_sealed"] is True
              assert result["holdout_2024_outcomes_read"] is False
              assert result["holdout_2024_pick_identity_file_read"] is False
              assert result_man["2024_H2_outcome_open_authorized_next_stage"] is False
              assert result_man["2024_H3_outcomes_remain_sealed"] is True
              assert result_man["holdout_2024_outcomes_read"] is False
              assert frozen["holdout_2024_outcomes_read"] is False

              assert result["production_change_authorized"] is False
              assert result["automatic_production_promotion_allowed"] is False
              assert result["year_discount_fit_or_changed"] is False
              assert result["r5_r6_fit_or_changed"] is False
              assert result_man["production_change_authorized"] is False

              assert dob_man["readiness_gate_pass"] is True
              assert impl["candidate_scores_computed"] is False
              assert impl_man["candidate_scores_computed"] is False
              assert err["scientific_contract_changed"] is False
              assert err_man["scientific_contract_changed"] is False
              assert err["holdout_2024_outcomes_read"] is False

              assert boot["replicates"] == 10000
              assert boot["seed"] == 20260923
              assert boot["paired"] is True
              assert boot["candidate_fit_performed_inside_bootstrap"] is False
              assert boot["out_of_fold_predictions_held_fixed"] is True

              c0 = result["candidate_scores"]["C0_DEPLOYED"]
              c0_h3 = float(c0["loyo_h3_o2_macro_mae"])
              c0_o1 = float(c0["loyo_h3_o1_normalized_shape_error"])

              candidate_summary = {}
              for cid in WINNERS:
                  score = result["candidate_scores"][cid]
                  elig = result["eligibility_gate_results"][cid]
                  failed = [
                      name for name, passed in elig["gates"].items()
                      if passed is not True
                  ]
                  assert elig["eligible"] is False
                  assert failed
                  candidate_summary[cid] = {
                      "loyo_h3_o2_macro_mae":
                          float(score["loyo_h3_o2_macro_mae"]),
                      "loyo_h3_o2_improvement_vs_C0":
                          float(elig["loyo_h3_o2_improvement_vs_C0"]),
                      "improved_heldout_class_n":
                          int(elig["improved_heldout_class_n"]),
                      "worst_heldout_class_relative_regression":
                          float(elig["worst_heldout_class_relative_regression"]),
                      "h3_o1_normalized_shape_error":
                          float(score["loyo_h3_o1_normalized_shape_error"]),
                      "h3_o1_relative_regression_vs_C0":
                          float(elig["o1_shape_relative_regression_vs_C0"]),
                      "h2_o2_relative_regression_vs_C0":
                          float(elig["h2_o2_relative_regression_vs_C0"]),
                      "mature_h4_o2_relative_regression_vs_C0":
                          float(elig["mature_h4_o2_relative_regression_vs_C0"]),
                      "bootstrap_upper95_candidate_minus_C0":
                          float(elig["bootstrap"]["one_sided_upper_95"]),
                      "boundary_saturation_gate_pass":
                          bool(elig["boundary_saturation"]["pass"]),
                      "failed_eligibility_gates": failed,
                      "eligible": False,
                  }

              d1_score = result["candidate_scores"][
                  "D1_BOUNDARY_FREE_ROUNDWISE_DIAGNOSTIC"
              ]
              d1_diag = result["D1_boundary_free_diagnostic"]
              d1_fit = d1_diag["all_development_fit"]
              d1_h3 = float(d1_score["loyo_h3_o2_macro_mae"])
              d1_o1 = float(d1_score["loyo_h3_o1_normalized_shape_error"])
              r4_late = float(d1_fit["r1_r4_values"]["r4_late"])
              r5_early = float(
                  pre["frozen_deployed_baseline"]["pick_base_2027"]["5"]["early"]
              )
              boundary_jump = r5_early - r4_late
              boundary_jump_rel = boundary_jump / r4_late

              assert r5_early == 1414.0
              assert r4_late < r5_early
              assert d1_diag["can_win"] is False
              assert d1_fit["structural"]["r4_late_ge_1414"] is False
              assert d1_fit["structural"][
                  "all_monotone_except_optional_r4_r5_boundary"
              ] is True
              assert d1_fit["structural"]["r5_r6_unchanged"] is True

              generated = datetime.now(timezone.utc).isoformat()
              closeout = {
                  "schema_version": 1,
                  "study_id": pre["study_id"],
                  "stage": "phase4_research_closeout_no_development_candidate",
                  "status": "V6_RESEARCH_CLOSED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE",
                  "generated_at_utc": generated,
                  "final_decision": stop,
                  "research_complete": True,
                  "eligible_candidate_n": 0,
                  "selected_candidate": None,
                  "final_candidate_frozen": False,
                  "production_change_authorized": False,
                  "automatic_production_promotion_allowed": False,
                  "v6_refit_allowed": False,
                  "v6_candidate_family_changes_allowed": False,
                  "v6_gate_changes_allowed": False,
                  "v6_scope_expansion_allowed": False,
                  "v6_2024_H2_open_allowed": False,
                  "v6_2024_H3_open_allowed": False,
                  "deployed_pick_base_changed": False,
                  "year_discount_changed": False,
                  "r5_r6_changed": False,
                  "baseline": {
                      "C0_loyo_h3_o2_macro_mae": c0_h3,
                      "C0_h3_o1_normalized_shape_error": c0_o1,
                  },
                  "candidate_summary": candidate_summary,
                  "d1_boundary_free_diagnostic": {
                      "can_win": False,
                      "role": "diagnostic_only",
                      "loyo_h3_o2_macro_mae": d1_h3,
                      "loyo_h3_o2_improvement_vs_C0":
                          (c0_h3 - d1_h3) / c0_h3,
                      "h3_o1_normalized_shape_error": d1_o1,
                      "h3_o1_relative_change_vs_C0": d1_o1 / c0_o1 - 1.0,
                      "all_development_r1_r4_values": d1_fit["r1_r4_values"],
                      "all_development_parameters": d1_fit["parameters"],
                      "unconstrained_r4_late": r4_late,
                      "frozen_r5_early": r5_early,
                      "r4_late_to_r5_early_upward_jump": boundary_jump,
                      "r4_late_to_r5_early_upward_jump_relative_to_r4_late":
                          boundary_jump_rel,
                      "interpretation": (
                          "Removing only the frozen R4-late-to-R5-early continuity "
                          "constraint materially improved O2 error and restored O1 "
                          "shape relative to C0, while the all-development diagnostic "
                          "placed R4 late far below frozen R5 early. This is evidence "
                          "that the frozen R5 boundary is an important successor-study "
                          "hypothesis; it is not proof that the deployed R5 value is "
                          "wrong and D1 was never eligible to win V6."
                      ),
                  },
                  "primary_findings": {
                      "all_three_candidate_families_materially_improved_O2":
                          all(
                              candidate_summary[c][
                                  "loyo_h3_o2_improvement_vs_C0"
                              ] >= 0.05
                              for c in WINNERS
                          ),
                      "all_three_improved_all_six_heldout_classes":
                          all(
                              candidate_summary[c]["improved_heldout_class_n"] == 6
                              for c in WINNERS
                          ),
                      "C1_failed_only_O1_shape_gate":
                          candidate_summary[
                              "C1_ROUNDWISE_RESCALE_R1_R4"
                          ]["failed_eligibility_gates"]
                          == ["h3_o1_shape_regression_vs_C0_le_2pct"],
                      "C2_failure_modes":
                          candidate_summary[
                              "C2_ANCHORED_ADDITIVE_ROUND_TIER_CURVE"
                          ]["failed_eligibility_gates"],
                      "C3_failure_modes":
                          candidate_summary[
                              "C3_SHRUNK_MONOTONE_SLOT_CURVE_R1_R4"
                          ]["failed_eligibility_gates"],
                      "C3_selected_alpha":
                          int(result["c3_alpha_selection"]["selected_alpha"]),
                      "C3_selected_alpha_is_grid_edge":
                          bool(result["c3_alpha_selection"][
                              "selected_alpha_is_grid_edge"
                          ]),
                      "structural_boundary_hypothesis": (
                          "V6 removed the R2-to-R3 splice problem identified by V5 "
                          "by fitting R1-R4 jointly, but the boundary-free D1 "
                          "diagnostic shows a new large R4-to-frozen-R5 discontinuity. "
                          "A successor study should test the full R1-R6 scale rather "
                          "than repair V6 after selection."
                      ),
                  },
                  "holdout_2024": {
                      "source_identity_frozen": True,
                      "H2_outcomes_opened_by_V6": False,
                      "H3_outcomes_opened_by_V6": False,
                      "remains_available_for_future_separately_preregistered_use": True,
                      "note": (
                          "Because V6 produced no eligible development candidate, "
                          "the preregistered 2024 H2 confirmation was never opened. "
                          "Any future use must be specified prospectively by a new "
                          "study before accessing those holdout outcomes."
                      ),
                  },
                  "successor_research_constraints": {
                      "new_study_required": True,
                      "do_not_repair_or_reopen_V6": True,
                      "recommended_scope": "R1-R6 full absolute-scale / tail-continuity study",
                      "recommended_question": (
                          "Can a jointly fitted R1-R6 Draft Pick Fundamental Value "
                          "curve preserve historical O1 shape while retaining the "
                          "large O2 accuracy gains observed in V6 and eliminating "
                          "the R4-to-R5 structural discontinuity exposed by D1?"
                      ),
                      "must_preregister_before_fitting": [
                          "R1-R6 candidate families and bounds",
                          "treatment of O1 shape as eligibility versus objective",
                          "LOYO development design and uncertainty method",
                          "boundary-saturation rules",
                          "2024 holdout access policy",
                          "any external frozen trade replay policy",
                      ],
                      "V6_development_results_are_exposed": True,
                      "2024_holdout_outcomes_are_unspent": True,
                      "D1_may_motivate_but_may_not_be_promoted": True,
                      "no_automatic_production_promotion": True,
                  },
                  "frozen_external_replay_policy": {
                      "prior_pick_containing_mock_trades_used_in_V6": False,
                      "external_trade_replay_run_in_V6": False,
                      "reason": "V6 produced no eligible candidate to replay.",
                      "future_use": (
                          "Keep prior frozen pick-containing trade evidence untouched "
                          "until a separately preregistered successor freezes an "
                          "eligible candidate."
                      ),
                  },
                  "methodology_integrity": {
                      "phase4_implementation_contract_frozen_before_scoring": True,
                      "phase4_solver_erratum_changed_scientific_contract": False,
                      "bootstrap_replicates": int(boot["replicates"]),
                      "bootstrap_seed": int(boot["seed"]),
                      "candidate_fit_inside_bootstrap": False,
                      "post_selection_refit_performed": False,
                      "2024_holdout_outcomes_read": False,
                      "market_or_ktc_values_read": False,
                      "package_vote_data_read": False,
                  },
                  "source_fingerprints": {
                      PRE.name: sha(PRE),
                      RESULT.name: sha(RESULT),
                      RESULT_MAN.name: sha(RESULT_MAN),
                      FROZEN_CAND.name: sha(FROZEN_CAND),
                      BOOT.name: sha(BOOT),
                      IMPL.name: sha(IMPL),
                      IMPL_MAN.name: sha(IMPL_MAN),
                      ERRATUM.name: sha(ERRATUM),
                      ERRATUM_MAN.name: sha(ERRATUM_MAN),
                      DOB_MAN.name: sha(DOB_MAN),
                  },
                  "next_action": (
                      "Archive/freeze V6. Any additional draft-pick fitting must begin "
                      "as a separately preregistered successor study."
                  ),
              }

              OUT.write_text(
                  json.dumps(closeout, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              lines = [
                  "# Draft Pick FV V6 — Research Closeout",
                  "",
                  f"**Final decision:** `{stop}`",
                  "",
                  "V6 is closed. No development candidate passed every preregistered "
                  "gate, no 2024 holdout outcomes were opened, and no production "
                  "change is authorized.",
                  "",
                  "## Development result",
                  "",
                  f"- C0 LOYO H3 O2 macro MAE: **{c0_h3:.2f}**",
              ]
              for cid in WINNERS:
                  x = candidate_summary[cid]
                  lines.append(
                      f"- {cid}: **{x['loyo_h3_o2_macro_mae']:.2f}** MAE "
                      f"({x['loyo_h3_o2_improvement_vs_C0']:.2%} improvement vs C0); "
                      f"failed: `{', '.join(x['failed_eligibility_gates'])}`."
                  )
              lines += [
                  "",
                  "## Boundary-free diagnostic",
                  "",
                  f"- D1 LOYO H3 O2 macro MAE: **{d1_h3:.2f}** "
                  f"({(c0_h3-d1_h3)/c0_h3:.2%} improvement vs C0).",
                  f"- D1 H3 O1 shape error: **{d1_o1:.4f}** vs C0 **{c0_o1:.4f}**.",
                  f"- D1 all-development R4 late: **{r4_late:.2f}**.",
                  f"- Frozen R5 early: **{r5_early:.2f}**.",
                  f"- Splicing those values would create an upward jump of "
                  f"**{boundary_jump:.2f} ({boundary_jump_rel:.2%})**.",
                  "",
                  "D1 was diagnostic-only and cannot be promoted. Its value is to show "
                  "that the frozen R5 boundary is a serious hypothesis for the next "
                  "study, not to establish that R5 is wrong.",
                  "",
                  "## 2024 holdout",
                  "",
                  "- Source/identity cohort frozen: **Yes**",
                  "- H2 outcomes opened by V6: **No**",
                  "- H3 outcomes opened by V6: **No**",
                  "",
                  "## Production",
                  "",
                  "- PICK_BASE changed: **No**",
                  "- YEAR_DISCOUNT changed: **No**",
                  "- R5-R6 changed: **No**",
                  "- Production change authorized: **No**",
                  "",
                  "## Successor",
                  "",
                  "Do not repair V6. A new preregistered study should test the full "
                  "**R1-R6 absolute scale / tail continuity** problem, including whether "
                  "a jointly fitted curve can preserve O1 shape while keeping the large "
                  "O2 accuracy gains observed here.",
                  "",
              ]
              OUT_MD.write_text("\n".join(lines), encoding="utf-8")

              manifest = {
                  "schema_version": 1,
                  "study_id": closeout["study_id"],
                  "stage": closeout["stage"],
                  "status": closeout["status"],
                  "generated_at_utc": generated,
                  "final_decision": stop,
                  "research_complete": True,
                  "eligible_candidate_n": 0,
                  "selected_candidate": None,
                  "production_change_authorized": False,
                  "2024_H2_outcomes_opened": False,
                  "2024_H3_outcomes_opened": False,
                  "v6_refit_allowed": False,
                  "successor_requires_new_preregistration": True,
                  "source_fingerprints": closeout["source_fingerprints"],
                  "output_hashes": {
                      OUT.name: sha(OUT),
                      OUT_MD.name: sha(OUT_MD),
                  },
                  "canonical_closeout_sha256": canon(closeout),
                  "next_action": closeout["next_action"],
              }
              OUT_MAN.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              print(f"DECISION={stop}")
              print("RESEARCH_COMPLETE=true")
              print("ELIGIBLE_CANDIDATES=0")
              print("2024_H2_OPENED=false")
              print("2024_H3_OPENED=false")
              print("PRODUCTION_CHANGE_AUTHORIZED=false")

          if __name__ == "__main__":
              main()
          PY
          chmod +x "${RUNNER_TEMP}/build_v6_research_closeout.py"

      - name: Preflight closeout builder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"build_v6_research_closeout.py"
          compile(p.read_text(),str(p),"exec")
          print("PASS: V6 closeout builder compiles without pyc.")
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          t=(Path(os.environ["RUNNER_TEMP"])/"build_v6_research_closeout.py").read_text().lower()
          forbidden=[
            "api.sleeper.app",
            "stats/nfl",
            "keeptradecut",
            "ktc-vote",
            "ktc_vote",
            "prospective_trade_evidence",
          ]
          for token in forbidden:
            assert token not in t, f"forbidden closeout input/read token: {token}"
          print("PASS: closeout is descriptive only; no external/outcome/market read path.")
          PY

      - name: Build immutable V6 closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/build_v6_research_closeout.py"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v6")
          c=json.loads((d/"r1_r4_v6_research_closeout.json").read_text())
          m=json.loads((d/"r1_r4_v6_research_closeout_manifest.json").read_text())

          assert c["status"]=="V6_RESEARCH_CLOSED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE"
          assert c["final_decision"]=="STOP_NO_V6_R1_R4_DEVELOPMENT_CANDIDATE"
          assert c["research_complete"] is True
          assert c["eligible_candidate_n"]==0
          assert c["selected_candidate"] is None
          assert c["production_change_authorized"] is False
          assert c["v6_refit_allowed"] is False
          assert c["v6_scope_expansion_allowed"] is False
          assert c["v6_2024_H2_open_allowed"] is False
          assert c["v6_2024_H3_open_allowed"] is False
          assert c["holdout_2024"]["H2_outcomes_opened_by_V6"] is False
          assert c["holdout_2024"]["H3_outcomes_opened_by_V6"] is False
          assert c["successor_research_constraints"]["new_study_required"] is True
          assert c["successor_research_constraints"]["recommended_scope"] ==               "R1-R6 full absolute-scale / tail-continuity study"
          assert c["d1_boundary_free_diagnostic"]["can_win"] is False

          assert m["research_complete"] is True
          assert m["eligible_candidate_n"]==0
          assert m["selected_candidate"] is None
          assert m["2024_H2_outcomes_opened"] is False
          assert m["2024_H3_outcomes_opened"] is False
          assert m["successor_requires_new_preregistration"] is True

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          for name, expected in m["output_hashes"].items():
              assert sha(d/name)==expected, name

          print("PASS: immutable V6 closeout contract validated.")
          PY

      - name: Prove exact closeout-only change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v6/r1_r4_v6_research_closeout.json"
            "research/draft-pick-fv-v6/r1_r4_v6_research_closeout.md"
            "research/draft-pick-fv-v6/r1_r4_v6_research_closeout_manifest.json"
          )
          diff -u             <(printf '%s\n' "${expected[@]}" | sort)             <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: exactly three intended V6 closeout files changed."

      - name: Run production and repository regression
        shell: bash
        run: |
          set -euo pipefail

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

