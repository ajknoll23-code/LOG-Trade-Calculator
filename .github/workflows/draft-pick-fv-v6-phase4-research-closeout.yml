      - name: Commit frozen V6 closeout
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during V6 closeout."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email             "41898282+github-actions[bot]@users.noreply.github.com"

          git add             research/draft-pick-fv-v6/r1_r4_v6_research_closeout.json             research/draft-pick-fv-v6/r1_r4_v6_research_closeout.md             research/draft-pick-fv-v6/r1_r4_v6_research_closeout_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no V6 closeout artifacts staged."
            exit 1
          }

          git commit -m "Close Draft Pick FV V6 research"
          git push origin HEAD:main

          echo "PASS: V6 research closeout committed."
