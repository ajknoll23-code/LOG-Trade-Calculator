name: Package Adjustment V4 - Phase 3E Exact 600 Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install freeze dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V4 confirmation state
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$V4/package_adjustment_v4_phase3e_freeze.py")" = "e9298d92e504ac2d1d430bf0f7d38038880c7ad4"

          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog_manifest.json")" = "9e23647b9e877b4b20c1f2ff52ec01ecf7db8fb7"
          test "$(git hash-object "$V4/phase3c_voting_release.json")" = "32fcdfed8216334fb4773595f09c883bc8333e0d"
          test "$(git hash-object "$V4/package_adjustment_v4_phase3d_maturity.py")" = "6247e3caab529656d56524c8bc45a84ec7b6d602"

          test "$(git hash-object index.html)" = "6898ec82851a98b48757dfe4f48b0406c5157b44"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = "7f94ad75100a161e22702fe155f9e73c56739227"
          test "$(git hash-object .github/workflows/package-adjustment-v4-phase3d-maturity-monitor.yml)" = "f6d4352b558aa37ee2a23acb83650c5b37565a9c"

          test ! -e "$V4/phase3_exact_600_frozen.json"
          test ! -e "$V4/phase3_exact_600_freeze_manifest.json"
          test ! -e "$V4/phase3_exact_600_freeze.md"
          test ! -e "$V4/phase3f_interpretation_contract.json"

      - name: Verify production remains V1.6 before freeze
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Exact-600 freeze self-test
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3e_freeze.py --selftest

      - name: Freeze exact 600 checkpoint and close voting
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3e_freeze.py

      - name: Verify frozen evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          data = json.loads((d / "phase3_exact_600_frozen.json").read_text())
          man = json.loads((d / "phase3_exact_600_freeze_manifest.json").read_text())

          assert data["status"] == "FROZEN_EXACT_600_CONFIRMATION_EVIDENCE"
          assert data["frozen"] is True
          assert data["checkpoint_selection_outcome_blind"] is True
          assert data["human_outcomes_revealed_only_after_checkpoint_selection"] is True
          assert data["model_evaluation_performed"] is False
          assert data["checkpoint_effective_votes"] == 600
          assert data["raw_checkpoint_ballot_count"] == 600
          assert data["distinct_voter_clusters"] == 31
          assert len(data["ballots"]) == 600

          assert man["status"] == "FROZEN_EXACT_600_CONFIRMATION_EVIDENCE_MANIFEST"
          assert man["model_evaluation_performed"] is False
          assert man["production_change_authorized"] is False
          assert man["voting_closed_by_this_phase"] is True
          assert man["maturity_anchor"]["status"] == "STOP_AND_FREEZE_AT_600"
          assert man["maturity_anchor"]["run_id"] == 35512427556
          assert man["maturity_anchor"]["job_id"] == 106085395037
          assert man["checkpoint"]["coverage_gates_pass"] is True
          assert man["checkpoint"]["effective_votes"] == 600
          assert man["checkpoint"]["distinct_voters"] == 31
          assert man["checkpoint"]["distinct_challenges"] == 231
          assert man["checkpoint"]["cells_passing_both_gates"] == 24
          assert man["checkpoint"]["minimum_cell_effective_votes"] == 17
          assert man["checkpoint"]["minimum_cell_distinct_voters"] == 13
          assert man["dataset"]["contains_model_predictions"] is False
          assert man["dataset"]["contains_model_performance_statistics"] is False
          assert man["dataset"]["contains_raw_voter_identifiers"] is False

          contract = json.loads((d / "phase3f_interpretation_contract.json").read_text())
          assert contract["status"] == "FROZEN_BEFORE_V4_CONFIRMATION_UNBLINDING"
          assert contract["frozen_before_human_outcomes_interpreted"] is True
          assert contract["changes_existing_preregistered_thresholds"] is False
          assert contract["changes_frozen_candidate_family"] is False
          assert contract["candidate_selection_rule"]["unresolved_if_best_vs_runner_up_gap_below"] == 0.002
          assert contract["deployment_gates"]["minimum_log_loss_improvement_vs_raw_control"] == 0.005
          assert len(contract["interpretation_ladder"]) == 4
          assert man["phase3f_interpretation_contract"]["frozen_before_human_outcomes_interpreted"] is True

          text = Path("index.html").read_text()
          assert "const PACKAGE_VOTE_V4C1_RESEARCH_CLOSED = true;" in text
          assert "if(PACKAGE_VOTE_V4C1_RESEARCH_CLOSED) return;" in text
          assert "Package Adjustment V4 confirmation voting is closed." in text

          print("PASS: exact-600 V4 evidence frozen before model evaluation; voting closed.")
          PY

      - name: Run repository regressions after voting closure
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after freeze
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V4 maturity and freeze workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm             .github/workflows/package-adjustment-v4-phase3d-maturity-monitor.yml             .github/workflows/package-adjustment-v4-phase3e-exact-600-freeze.yml
          echo "PASS: V4 collection workflows removed from active Actions."

      - name: Stage exact Phase 3E scope
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          git add             index.html             scripts/validation/repo_regression_checks.py             "$V4/phase3_exact_600_frozen.json"             "$V4/phase3_exact_600_freeze_manifest.json"             "$V4/phase3_exact_600_freeze.md" \
            "$V4/phase3f_interpretation_contract.json"

          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "scripts/validation/repo_regression_checks.py",
              "research/package-adjustment-v4-elite-fragmentation/phase3_exact_600_frozen.json",
              "research/package-adjustment-v4-elite-fragmentation/phase3_exact_600_freeze_manifest.json",
              "research/package-adjustment-v4-elite-fragmentation/phase3_exact_600_freeze.md",
              "research/package-adjustment-v4-elite-fragmentation/phase3f_interpretation_contract.json",
              ".github/workflows/package-adjustment-v4-phase3d-maturity-monitor.yml",
              ".github/workflows/package-adjustment-v4-phase3e-exact-600-freeze.yml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Unexpected V4 Phase 3E scope: {sorted(changed)}")
          print("PASS: exact eight-file V4 Phase 3E freeze/closure scope staged.")
          PY

      - name: Commit immutable exact-600 V4 evidence
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Freeze Package Adjustment V4 exact 600 confirmation evidence"
          git pull --rebase origin main

          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test "$(git hash-object "$V4/phase3c_voting_release.json")" = "32fcdfed8216334fb4773595f09c883bc8333e0d"

          test ! -e .github/workflows/package-adjustment-v4-phase3d-maturity-monitor.yml
          test ! -e .github/workflows/package-adjustment-v4-phase3e-exact-600-freeze.yml

          grep -Fq "const PACKAGE_VOTE_V4C1_RESEARCH_CLOSED = true;" index.html

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          python3 - <<'PY'
          import json
          from pathlib import Path
          d = Path("research/package-adjustment-v4-elite-fragmentation")
          man = json.loads((d / "phase3_exact_600_freeze_manifest.json").read_text())
          print("V4_PHASE3E_STATUS=" + man["status"])
          print("V4_PHASE3E_DATA_SHA256=" + man["dataset"]["sha256"])
          PY

          git log --oneline -1
