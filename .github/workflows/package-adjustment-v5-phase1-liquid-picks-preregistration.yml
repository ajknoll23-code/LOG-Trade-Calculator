name: Package Adjustment V5 - Phase 1 Liquid Picks Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact post-V4 state
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$V4/phase3_confirmation_evaluation.json")" = "dc293d2e21b1f15e32ded441d64e29e544774251"
          test "$(git hash-object "$V4/phase3_confirmation_evaluation_manifest.json")" = "d86e12788f2ecfd4fce446e65831c66a7eb19009"
          test "$(git hash-object research/package-adjustment-v5-liquid-picks/package_adjustment_v5_phase1_preregister.py)" = "87f3528b0b3bd5a3bf0ebd972f395bb16c00cc4a"

          test ! -e "$V4/package_adjustment_v4_research_closeout.json"
          test ! -e "$V4/package_adjustment_v4_research_closeout.md"
          test ! -e research/package-adjustment-v5-liquid-picks/phase1_structural_preregistration.json
          test ! -e research/package-adjustment-v5-liquid-picks/phase1_manifest.json

          test ! -e .github/workflows/package-adjustment-v4-phase3f-one-time-evaluation.yml

      - name: Verify production remains V1.6 before V5 preregistration
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Close V4 and freeze V5 before spent-evidence development
        run: python3 research/package-adjustment-v5-liquid-picks/package_adjustment_v5_phase1_preregister.py

      - name: Verify V5 preregistration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          v4 = Path("research/package-adjustment-v4-elite-fragmentation")
          v5 = Path("research/package-adjustment-v5-liquid-picks")

          closeout = json.loads((v4 / "package_adjustment_v4_research_closeout.json").read_text())
          prereg = json.loads((v5 / "phase1_structural_preregistration.json").read_text())
          manifest = json.loads((v5 / "phase1_manifest.json").read_text())

          assert closeout["status"] == "research_closed_no_production_successor"
          assert closeout["candidate_selection"]["resolved"] is True
          assert closeout["candidate_selection"]["selected_candidate_id"] == "elite-frag-s75-p210-p330"
          assert closeout["selected_candidate_confirmation"]["improvement_gate_pass"] is True
          assert closeout["selected_candidate_confirmation"]["bootstrap_gate_pass"] is True
          assert closeout["selected_candidate_confirmation"]["group_safety_gate_pass"] is False
          assert closeout["selected_candidate_confirmation"]["failing_group"]["topology"] == "3v3"
          assert closeout["selected_candidate_confirmation"]["failing_group"]["asset_mix"] == "includes_picks"
          assert closeout["production_change_authorized"] is False

          assert prereg["status"] == "FROZEN_BEFORE_SPENT_V4_DEVELOPMENT"
          assert prereg["frozen"] is True
          assert prereg["new_independent_research_cycle"] is True
          assert prereg["candidate_grid"]["candidate_count"] == 12
          assert prereg["candidate_grid"]["no_continuous_parameter_optimization"] is True
          assert prereg["candidate_grid"]["no_topology_specific_parameters"] is True
          assert prereg["candidate_grid"]["players_only_formula_frozen_to_v4_s75"] is True
          assert prereg["base_player_only_contract"]["players_only_trade_scores_must_equal_v4_s75_exactly"] is True
          assert prereg["asset_eligibility"]["draft_picks"]["years_allowed"] == [2027, 2028]
          assert prereg["asset_eligibility"]["players"]["explicitly_excluded_players"] == ["Joe Mixon"]
          assert prereg["development_evidence_boundary"]["v4_exact_600_may_count_as_fresh_confirmation"] is False
          assert prereg["fresh_confirmation_contract_if_candidate_frozen"]["new_vote_namespace"] == "__pkgv5c1__"
          assert prereg["fresh_confirmation_contract_if_candidate_frozen"]["evaluation"]["deployment_gates"]["maximum_topology_x_asset_mix_log_loss_regression_vs_raw"] == 0.03

          assert manifest["v4_individual_ballots_read_by_this_phase"] is False
          assert manifest["v4_aggregate_evaluation_only"] is True
          assert manifest["candidate_grid_count"] == 12
          assert manifest["production_change_authorized"] is False

          print("PASS: V4 closed and V5 frozen before spent V4 development.")
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V5 Phase 1 workflow
        run: git rm .github/workflows/package-adjustment-v5-phase1-liquid-picks-preregistration.yml

      - name: Stage exact closeout and preregistration scope
        shell: bash
        run: |
          set -euo pipefail
          git add \
            research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_research_closeout.json \
            research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_research_closeout.md \
            research/package-adjustment-v5-liquid-picks/phase1_structural_preregistration.json \
            research/package-adjustment-v5-liquid-picks/phase1_manifest.json

          git diff --cached --check

          python3 - <<'PY'
          import subprocess
          expected = {
              "research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_research_closeout.json",
              "research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_research_closeout.md",
              "research/package-adjustment-v5-liquid-picks/phase1_structural_preregistration.json",
              "research/package-adjustment-v5-liquid-picks/phase1_manifest.json",
              ".github/workflows/package-adjustment-v5-phase1-liquid-picks-preregistration.yml",
          }
          changed = set(subprocess.check_output(
              ["git","diff","--cached","--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Unexpected V5 Phase 1 scope: {sorted(changed)}")
          print("PASS: exact five-file V4 closeout/V5 preregistration scope staged.")
          PY

      - name: Commit V4 closeout and frozen V5 preregistration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Close Package Adjustment V4 and preregister V5 liquid picks"
          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-v4-elite-fragmentation/phase3_confirmation_evaluation.json)" = "dc293d2e21b1f15e32ded441d64e29e544774251"
          test ! -e .github/workflows/package-adjustment-v5-phase1-liquid-picks-preregistration.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "V4_STATUS=research_closed_no_production_successor"
          echo "V5_STATUS=FROZEN_BEFORE_SPENT_V4_DEVELOPMENT"
          echo "V5_CANDIDATE_COUNT=12"
          git log --oneline -1
