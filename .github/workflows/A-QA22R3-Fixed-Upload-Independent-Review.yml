name: A-QA22R3 - Six Player Independent Value Investigation
run-name: A-QA22R3 read-only independent RB WR LB valuation check
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: a-qa22r3-six-player-value-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA22_SRC: /tmp/qa22-qa15
      QA22_OUT: /tmp/qa22-output
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout read-only
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Download pinned QA15 opportunity internal audit
      uses: actions/download-artifact@v4
      with:
        name: A-QA15-Opportunity-Aware-Peer-Shadow
        run-id: '41099108472'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: ${{ env.QA22_SRC }}
    - name: Crosscheck six players vs current roster, Sleeper season context, private FP/DLF ranks
      shell: bash
      env:
        CAL26_DLF_SF_CSV_B64: ${{ secrets.CAL26_DLF_SF_CSV_B64 }}
        FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      run: |
        set -euo pipefail
        mkdir -p "$QA22_OUT"
        python3 - <<'PY_SOURCE'
        import json,os,pathlib
        p=pathlib.Path(os.environ['QA22_SRC']);m=json.loads((p/'QA15_Manifest.json').read_text())
        assert m['cohort']==72 and m['candidate_reviews']==16 and not m['independent_market_validated']
        assert m['read_only'] and not m['release_approved']
        PY_SOURCE
        cat > "$RUNNER_TEMP/qa22_engine.py" <<'PY_ENGINE'
        #!/usr/bin/env python3
        import base64,collections,csv,datetime,hashlib,io,json,math,os,pathlib,re,urllib.parse,urllib.request,urllib.error
        ROOT=pathlib.Path('.');SRC=pathlib.Path(os.environ['QA22_SRC']);OUT=pathlib.Path(os.environ['QA22_OUT']);OUT.mkdir(exist_ok=True,parents=True)
        TARGETS={'10235':('Roschon Johnson','RB',4618),'8349':('Jake Hansen','LB',4004),'11630':('Roman Wilson','WR',3575),'8135':('Treylon Burks','WR',3575),'8122':('Zonovan Knight','RB',2391),'7561':('Elijah Mitchell','RB',2336)}
        def fail(s):raise AssertionError('QA22_SOURCE_INTEGRITY_'+str(s))
        def norm(s):
         s=str(s or '').lower().replace('’',"'")
         s=re.sub(r"[.\-']",'',s);s=re.sub(r'\b(jr|sr|ii|iii|iv)\b','',s)
         return ' '.join(s.split())
        def qile(value,values,descending=False):
         if value is None or not values:return 'MISSING_OR_UNRANKED'
         percentile=100*(sum(x>value for x in values)+.5*sum(x==value for x in values))/len(values) if descending else 100*(sum(x<value for x in values)+.5*sum(x==value for x in values))/len(values)
         return 'TOP_QUARTILE' if percentile>=75 else 'UPPER_MIDDLE' if percentile>=50 else 'LOWER_MIDDLE' if percentile>=25 else 'BOTTOM_QUARTILE'
        def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
        def load(p):return json.loads(pathlib.Path(p).read_text())
        m=load(SRC/'QA15_Manifest.json')
        assert m['cohort']==72 and m['candidate_reviews']==16 and m['read_only'] and not m['release_approved']
        assert not m['independent_market_validated'] and not m['recommended_fv_count']
        assert all(m[k]==0 for k in ['fv_changes','fv_plus_changes','mv_changes','repo_mutations'])
        raw=list(csv.DictReader((SRC/'QA15_All72_Opportunity_Ranges.csv').open(newline='',encoding='utf8')))
        cases={r['sleeper_id']:r for r in raw}
        assert len(raw)==72 and len(cases)==72
        for sid,(name,pos,fv) in TARGETS.items():
         r=cases[sid]
         assert (r['player'],r['position'],int(r['current_fv_UNCHANGED']))==(name,pos,fv)
         assert r['review_status']=='OPPORTUNITY_CHECKED_INTERNAL_RANGE_FOR_REVIEW' and not r['new_fv_recommended']
        ros=load('data/league_rosters.json');fa=load('data/free_agents.json')
        assert len(ros['rosters'])==12 and ros['league_id']==fa['league_id']
        roster={}
        for t in ros['rosters']:
         for slot in ('starters','bench','taxi','reserve_ir'):
          for p in t.get(slot,[]):
           sid=str(p.get('player_id') or '')
           if sid in TARGETS:
            if sid in roster:fail('DUPLICATE_SLEEPA_ID_'+sid)
            roster[sid]={'sleeper_owner':t['team_name'],'fantasy_slot':slot,'nfl_team':p.get('team'),'nfl_depth_order':p.get('depth_chart_order'),'injury':p.get('injury_status'),'status':p.get('status')}
        free={str(x['player_id']):x for x in fa['free_agents'] if str(x['player_id']) in TARGETS}
        for sid in TARGETS:
         if (sid in free)==(sid in roster):fail('ROSTER_OR_FA_EXCLUSIVITY_'+sid)
        projs={str(p['sleeper_id']):p for p in load('scripts/sleeper_2026_projections.json') if str(p.get('sleeper_id')) in TARGETS}
        ppg={str(p['sleeper_id']):p for p in load('scripts/ppg_results.json') if str(p.get('sleeper_id')) in TARGETS}
        # Parse private DLF offensive dynasty values entirely in job memory. Only relative bands published.
        dlf_status='HOLD_NO_SECRET';dlf=collections.defaultdict(dict);dlf_vals=collections.defaultdict(list)
        secret=os.environ.get('CAL26_DLF_SF_CSV_B64','').strip()
        if secret:
         try:
          src=csv.DictReader(io.StringIO(base64.b64decode(secret,validate=True).decode('utf8-sig')))
          if src.fieldnames!=['name','position','team','value']:raise ValueError('PRIVATE_DLF_SCHEMA_CHANGED')
          for row in src:
           pos=row['position'].strip().upper()
           if pos not in ('RB','WR'):continue
           name=norm(row['name']);v=float(row['value']);assert math.isfinite(v) and v>0
           assert name not in dlf[pos],('duplicate DLF',pos,name)
           dlf[pos][name]=v;dlf_vals[pos].append(v)
          dlf_status='PASS_PRIVATE_DLF_OFFENSE_ORDINAL' if min(len(dlf['RB']),len(dlf['WR']))>=15 else 'HOLD_TOO_FEW_DLF_ROWS'
         except Exception:dlf_status='HOLD_INVALID_PRIVATE_DLF_INPUT';dlf={};dlf_vals={}
        if not dlf_status.startswith('PASS_'):dlf={};dlf_vals={}
        # Fetch FantasyPros dynasty positional QB-independent consensus. Only quartile bands exported.
        fp_status={};fp={};fp_vals={}
        key=os.environ.get('FANTASYPROS_API_KEY','').strip()
        for pos in ('RB','WR'):
         if not key:fp_status[pos]='HOLD_NO_API_KEY';continue
         url='https://api.fantasypros.com/public/v2/json/nfl/2026/consensus-rankings?'+urllib.parse.urlencode({'position':pos,'type':'DYNASTY','scoring':'PPR'})
         req=urllib.request.Request(url,headers={'x-api-key':key,'Accept':'application/json','User-Agent':'LOG-QA22-NoRelease','Cache-Control':'no-cache'})
         try:
          with urllib.request.urlopen(req,timeout=25) as response:raw=response.read(12_000_001)
          if len(raw)>12_000_000:raise ValueError('API_TOO_LARGE')
          doc=json.loads(raw)
          if doc.get('ranking_type_name')!='dynasty' or not isinstance(doc.get('players'),list):raise ValueError('BAD_API_RANKING_SCHEMA')
          vals={}
          for v in doc['players']:
           if not isinstance(v,dict):continue
           if str(v.get('player_position_id') or v.get('position_id') or v.get('position') or '').upper()!=pos:continue
           n=norm(v.get('player_name') or v.get('name'))
           try:q=float(v['rank_ecr'])
           except (TypeError,ValueError,KeyError):continue
           if not n or not math.isfinite(q) or q<=0:continue
           if n in vals:raise ValueError('DUPLICATE_PLAYER_MATCH')
           vals[n]=q
          fp_status[pos]='PASS_DYNASTY_RANKINGS' if len(vals)>=20 else 'HOLD_INSUFFICIENT_RANKS'
          if fp_status[pos].startswith('PASS_'):fp[pos]=vals;fp_vals[pos]=list(vals.values())
         except Exception as e:fp_status[pos]='HOLD_API_ERROR_'+type(e).__name__
        records=[]
        for sid,(name,pos,fv) in TARGETS.items():
         r=cases[sid];keyname=norm(name);own=roster.get(sid);f=free.get(sid)
         a=projs.get(sid,{})
         if not a or a.get('pos')!=pos:fail('BAD_SLEEPA_PROJECTION_ID_'+sid)
         dlfv=dlf.get(pos,{}).get(keyname)
         fpv=fp.get(pos,{}).get(keyname)
         rp=ppg.get(sid)
         low=int(r['new_range_low_CONTEXT_ONLY']);mid=int(r['new_range_median_CONTEXT_ONLY']);high=int(r['new_range_high_CONTEXT_ONLY'])
         row={'sleeper_id':sid,'player':name,'position':pos,'current_FV_UNCHANGED':fv,'QA15_internal_low_CONTEXT_ONLY':low,'QA15_internal_median_CONTEXT_ONLY':mid,'QA15_internal_high_CONTEXT_ONLY':high,'internal_FV_to_median_ratio':round(fv/mid,2),'QA15_LOO_p75_error_percent':float(r['opportunity_loo_p75_error_pct']),
          'Sleeper_2026_full_season_projected_points_HISTORICAL_CONTEXT':a['sleeper_2026_proj_total'],
          'Sleeper_history_games_observed':int(r['historical_games_observed']) if r['historical_games_observed'] else None,
          'Season_PPG_history_observed':rp['true_ppg'] if rp else None,
          'NFL_team':(own or f).get('nfl_team') if own else f.get('team'),
          'NFL_depth_chart_order':(own or f).get('nfl_depth_order') if own else f.get('depth_chart_order'),
          'league_status':'ROSTERED' if own else 'FREE_AGENT','fantasy_slot':own['fantasy_slot'] if own else None,
          'injury_status':(own or f).get('injury') if own else f.get('injury_status'),
          'DLF_position_quartile_only':qile(dlfv,dlf_vals.get(pos,[])) if pos!='LB' else 'NO_IDP_DLF_SOURCE',
          'FantasyPros_dynasty_position_quartile_only':qile(-fpv,[-v for v in fp_vals.get(pos,[])]) if fpv is not None else ('NO_VALID_LB_SOURCE' if pos=='LB' else 'MISSING_OR_UNRANKED'),
          'independent_source_comparison':('NO_CURRENT_INDEPENDENT_IDP_ANCHOR' if pos=='LB' else 'ORDINAL_ONLY_NO_CARDINAL_PRICE'),
          'source_asof_verified':'NO','proposed_new_FV':'','FV_changed':'NO'}
         records.append(row)
        records.sort(key=lambda r:-r['current_FV_UNCHANGED'])
        with (OUT/'QA22_Six_Player_Independent_Evidence.csv').open('w',newline='',encoding='utf8') as file:
         w=csv.DictWriter(file,fieldnames=list(records[0]));w.writeheader();w.writerows(records)
        source={'qa15_green_run':41099108472,'qa15_manifest_sha256':sha(SRC/'QA15_Manifest.json'),'sleeper_roster_last_sync_unix':ros['synced_at'],'sleeper_FA_last_sync_unix':fa['synced_at'],'DLF_source_status':dlf_status,'FantasyPros_status':fp_status,'freshness_verified':False,'current_ROS_projections_verified':False,'league_roster_player_ids_unique':True,'targets':6,'new_fv_proposals':0,'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repository_mutations':0,'read_only':True,'release_authorized':False}
        (OUT/'QA22_Manifest.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
        lines=['# A-QA22 — Next Six Fallback FV Investigation','', '**READ ONLY: Source ordering, roster status, opportunity, and internal consistency — not new FV proposals.**','',
         f"- DLF: **{dlf_status}**; FantasyPros RB: **{fp_status.get('RB','UNAVAILABLE')}**; WR: **{fp_status.get('WR','UNAVAILABLE')}**.",
         f"- League snapshot: **{datetime.datetime.fromtimestamp(ros['synced_at'],datetime.timezone.utc).isoformat()}**; role and injury status may have changed since that time.",
         '- Sleeper 2026 projection values are season-total context, not validated current ROS forecast.','- Source vintages, IDP dynasty market values, and external cardinal FV mapping remain unverified.',
         '- LB Jake Hansen is intentionally held for a dedicated IDP opportunity / snap-share source; offensive DLF/FP data cannot validate his LB price.','',
         '| Player | Current FV | Internal QA15 median | FP dynasty band | DLF band | Roster |', '|---|---:|---:|---|---|---|']
        for x in records:lines.append(f"| {x['player']} | {x['current_FV_UNCHANGED']:,} | {x['QA15_internal_median_CONTEXT_ONLY']:,} | {x['FantasyPros_dynasty_position_quartile_only']} | {x['DLF_position_quartile_only']} | {x['league_status']} |")
        lines += ['','**Next decision:** compare ordinal source agreement and current depth/opportunity, then establish numerical validation on same-position peer cohorts; do not auto-apply internal medians.','No code or production prices modified.']
        (OUT/'QA22_Report.md').write_text('\n'.join(lines)+'\n')
        print(json.dumps({'status':'QA22_READ_ONLY_SIX_PLAYER_EVIDENCE','players':len(records),'sources':source,'production_changes':0}))

        PY_ENGINE
        python3 -m py_compile "$RUNNER_TEMP/qa22_engine.py"
        python3 "$RUNNER_TEMP/qa22_engine.py"
    - name: Protect release and no code mutations
      shell: bash
      run: |-
        set -euo pipefail
        git diff --exit-code
        test -z "$(git status --porcelain --untracked-files=all)"
        python3 - <<'PY_CHECK'
        import json,os,pathlib,csv
        p=pathlib.Path(os.environ['QA22_OUT']);m=json.loads((p/'QA22_Manifest.json').read_text())
        r=list(csv.DictReader((p/'QA22_Six_Player_Independent_Evidence.csv').open()))
        assert len(r)==6 and len({x['sleeper_id'] for x in r})==6
        assert all(not x['proposed_new_FV'] and x['FV_changed']=='NO' for x in r)
        assert all(m[x]==0 for x in ('new_fv_proposals','fv_changes','fv_plus_changes','mv_changes','repository_mutations'))
        assert m['read_only'] and not m['release_authorized']
        PY_CHECK
    - name: Upload A-QA22 research evidence
      uses: actions/upload-artifact@v4
      with:
        name: A-QA22-Six-Player-Independent-Research
        path: ${{ env.QA22_OUT }}/
        retention-days: 30
        if-no-files-found: error
    - name: Mobile review
      if: always()
      shell: bash
      run: |-
        set -euo pipefail
        if test -f "$QA22_OUT/QA22_Report.md"; then
          cat "$QA22_OUT/QA22_Report.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo 'QA22 did not produce a completed report; no values changed.' >> "$GITHUB_STEP_SUMMARY"
        fi
