name: QF11 V23 - Owner Approved Pilot Safeguard Amendment Preregistration (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V23_INPUT: /tmp/qf11-v23-input
  QF11_V23_OUTPUT: /tmp/qf11-v23-output
jobs:
  preregister:
    name: Preregister owner-approved single-trio pilot safeguards without contacting people
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Verify immutable production pins and observe mutable Sleeper cache
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V23_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V23_PROTECTED_SOURCE_PINS_GREEN

        '
    - name: Download SHA-pinned V21 original preregistration source
      uses: actions/download-artifact@v4
      with:
        name: QF11-v21-RESEARCH-ONLY-owner-prereg-and-pilot-design
        run-id: 38324067358
        github-token: ${{ github.token }}
        path: /tmp/qf11-v23-input/v21
    - name: Download SHA-pinned V22 independent quality review
      uses: actions/download-artifact@v4
      with:
        name: QF11-v22-RESEARCH-ONLY-independent-quality-gate
        run-id: 38324741333
        github-token: ${{ github.token }}
        path: /tmp/qf11-v23-input/v22
    - name: SHA-verify V21 and V22 then preregister prospective one-trio stop rule and privacy plan
      shell: bash
      run: "set -euo pipefail\npython3 - <<'QF11_V23_AMENDMENT'\n#!/usr/bin/env python3\n\"\"\"QF11 V23 prospective read-only protocol-amendment\
        \ preregistration.\n\nNot a recruitment, sampling, issuance, voting, or production-change process.\nSources are SHA-pinned GitHub V21/V22\
        \ research archives; owner authorization\nin the conversation is ONLY permission to record an amended research protocol.\n\"\"\"\nimport\
        \ collections\nimport hashlib\nimport itertools\nimport json\nimport os\nfrom pathlib import Path\n\nIN = Path(os.environ.get('QF11_V23_INPUT',\
        \ '/tmp/qf11-v23-input'))\nOUT = Path(os.environ.get('QF11_V23_OUTPUT', '/tmp/qf11-v23-output'))\nOUT.mkdir(parents=True, exist_ok=True)\n\
        EXPECTED = {\n    'v21/RESEARCH_ONLY_v21_scope_prereg.json':'305696d7839401b854c65042e9d32d2687021b14bc9de7cafae03ad9346734b3',\n    'v21/RESEARCH_ONLY_v21_protocol_prereg.json':'5de62a4172d9c258fa3083ba43c7e23490e1c364fa6403b9ca0b7eb59d424109',\n\
        \    'v21/RESEARCH_ONLY_v21_owner_gate.md':'69a25bac8d53680902f8af68d4196e51e4d782bc131fd26f8896d38dc55a0f7a',\n    'v22/RESEARCH_ONLY_v22_independent_readiness_matrix.json':'39ec4e70111816d380e444dbeb7fb28868d10a483d7ccd300bf3747f00aedece',\n\
        \    'v22/RESEARCH_ONLY_v22_owner_quality_gate.md':'2aae5ab241a739303a9a2d06fdee8f3d164b6ec65f1f4461b000406d42efe01e',\n}\nfor rel, sha\
        \ in EXPECTED.items():\n    f = IN / rel\n    assert f.is_file(), 'STOP_ARCHIVED_SOURCE_MISSING:' + rel\n    assert hashlib.sha256(f.read_bytes()).hexdigest()\
        \ == sha, 'STOP_ARCHIVED_SOURCE_DRIFT:' + rel\n\ndef get(rel):\n    return json.loads((IN / rel).read_text())\nscope = get('v21/RESEARCH_ONLY_v21_scope_prereg.json')\n\
        pilot = get('v21/RESEARCH_ONLY_v21_protocol_prereg.json')\nreview = get('v22/RESEARCH_ONLY_v22_independent_readiness_matrix.json')\nassert\
        \ scope['status'] == 'OWNER_APPROVED_22_SLOT_RESEARCH_PREREG_ONLY_NOT_VOTER_AUTHORIZED'\nassert scope['approved_scope'] == 'REVIEW_AND_DESIGN_ONLY'\n\
        assert pilot['status'] == 'OWNER_APPROVED_DESIGN_PREREG_NOT_PILOT_ACTIVATION'\nassert pilot['approved_protocol_development_only'] is True\n\
        assert review['status'] == 'SCIENTIFIC_REVIEW_FINDINGS_OPEN_NOT_PILOT_AUTHORIZED'\nassert scope['candidate_review_count'] == 22 and scope['source_screened_prior_count']\
        \ == 21\nassert scope['tentative_slot11_count'] == 1\nassert scope['excluded_held_slots'] == [1,5,8,12,15,21]\nassert scope['identity_holds_cleared']\
        \ == 0 and len(scope['identity_hold_names']) == 7\nassert review['original_excluded_slots'] == scope['excluded_held_slots']\nassert review['unresolved_identities']\
        \ == scope['identity_hold_names']\nassert review['review_candidates'] == 22 and review['actual_participants'] == 0\nassert review['critical_stop_rule_reconciliation_required']\
        \ is True\nassert review['independent_protocol_review_completed'] is False\nassert review['owner_pilot_activation_approved'] is False\n\
        assert review['recruitment_or_issuance_permitted'] is False\nassert review['market_value_ingestion_or_promotion_permitted'] is False\n\
        assert review['production_changed'] is False\nassert len(review['risks']) == 6\nassert {r['id'] for r in review['risks']} == {\n 'CATALOG_OPTIONAL_CERTIFICATION',\
        \ 'PILOT_TRIO_DISPLAY_CONSENT',\n 'CRITICAL_STOP_VS_AGGREGATE_THRESHOLD', 'SAMPLE_AND_ORDER_INFERENCE',\n 'RECRUITMENT_AND_PRIVACY_IMPLEMENTATION',\
        \ 'IDENTITY_SOURCE_HOLDS'\n}\nfor key in (\n 'catalog_final_for_issuance','optional_substitutions_owner_certified','ballot_issuance_permitted',\n\
        \ 'voter_link_creation_permitted','respondent_recruitment_permitted','ktc_vote_ingestion_permitted',\n 'market_value_training_permitted','market_value_backfill_permitted','production_change_permitted'\n\
        ):\n    assert scope[key] is False, 'STOP_UNAUTHORIZED_SCOPE_' + key\nfor key in ('pilot_activation_approved','randomization_algorithm_deployment_approved',\n\
        \            'voter_links_created','ballots_issued','market_values_changed','fv_or_package_adjustment_changed'):\n    assert pilot[key]\
        \ is False, 'STOP_UNAUTHORIZED_PILOT_' + key\nassert pilot['assigned_recruits'] == [] and pilot['consented_participants'] == []\nassert\
        \ pilot['sample_or_result_count'] == 0 and pilot['new_votes_ingested'] == 0\nassert pilot['preexisting_votes_ingested'] == 0\nassert pilot['sample_n_for_preregistered_design']\
        \ == 12\nassert pilot['independent_participants_per_order_design'] == 2\norders = pilot['six_order_design']\ntrio = ['Brock Bowers', 'Tyler\
        \ Warren', 'TreVeyon Henderson']\nassert len(orders) == 6 and {tuple(x) for x in orders} == set(itertools.permutations(trio))\nrows =\
        \ scope['proposed_catalog_for_review']\nassert len(rows) == 22 and len({x['slot'] for x in rows}) == 22\nassert {x['slot'] for x in rows}\
        \ == set(range(1,29))-{1,5,8,12,15,21}\nstatuses = collections.Counter(x['source_status'] for x in rows)\nassert statuses == {\n 'SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED':12,\n\
        \ 'OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY':9,\n 'OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN':1\n}\nassert [x['slot'] for x in rows\
        \ if x['source_status'] == 'OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN'] == [11]\nassert next(x for x in rows if x['slot']==11)['players']\
        \ == ['brock bowers','tyler warren','treveyon henderson']\nassert all(not(set(x['players'])&set(scope['identity_hold_names'])) for x in\
        \ rows)\nassert not review['market_value_ingestion_or_promotion_permitted']\nassert '>=10/12' in pilot['design_feedback_threshold_from_v20_draft']\n\
        assert 'misidentifies the RB' in pilot['critical_failure_from_v20_draft']\nassert 'serious comprehension issue' in pilot['pilot_stop_rule_from_v20_draft']\n\
        \n# Existing V21 prereg and V22 review are archival evidence, NOT edited retroactively.\n# Owner approval this turn authorizes recording\
        \ *this* dated amendment only.\nwording = (\n '12-team dynasty Superflex with IDP — usability exercise. '\n 'Compare three player assets\
        \ over the same dynasty time horizon. '\n 'KEEP means your most preferred asset, TRADE means your middle-ranked asset, '\n 'and CUT means\
        \ your least preferred asset. These are preference labels, not '\n 'instructions to execute a trade or drop a player. Rank all three once.'\n\
        )\namendment = {\n 'schema': 'QF11_V23_PROSPECTIVE_PILOT_PROTOCOL_AMENDMENT',\n 'date_utc': '2026-10-12',\n 'status': 'OWNER_APPROVED_RESEARCH_AMENDMENT_PREREG_ONLY_NOT_PILOT_ACTIVATION',\n\
        \ 'source_v21_run': 38324067358,\n 'source_v22_run': 38324741333,\n 'pinned_source_sha256': EXPECTED,\n 'owner_approval_scope': {\n  \
        \  'source': 'Owner explicitly affirmed V22 recommended safeguards for preregistration only in conversation',\n    'single_trio_research_protocol_amendment_approved':\
        \ True,\n    'critical_stop_precedence_amendment_approved': True,\n    'participant_safeguard_plan_for_qc_approved': True,\n    'real_respondent_display_approved':\
        \ False,\n    'consent_text_approved_for_use': False,\n    'pilot_recruitment_approved': False,\n    'voter_issuance_approved': False,\n\
        \    'market_value_promotion_approved': False,\n    'independent_review_completed': False,\n },\n 'study_class': 'USABILITY_COMPREHENSION_ONLY_NOT_MARKET_CALIBRATION',\n\
        \ 'one_trio': [{'name':'Brock Bowers','position':'TE'}, {'name':'Tyler Warren','position':'TE'}, {'name':'TreVeyon Henderson','position':'RB'}],\n\
        \ 'one_trio_research_source_status': 'OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN',\n 'display_wording': {'status':'DRAFT_FOR_INDEPENDENT_QC_NOT_APPROVED_TO_DISPLAY',\
        \ 'context_text': wording,\n                     'identity_label':'Brock Bowers — TE | Tyler Warren — TE | TreVeyon Henderson — RB',\n\
        \                     'open_question':'Check equivalence with intended Keep/Trade/Cut ranking semantics before any actual participant\
        \ sees it'},\n 'sample_plan': {'design_n':12,'display_orders':orders,'two_independent_per_order':True,\n                 'live_assignment_implemented':False,\
        \ 'interpretation':'Basic comprehension feedback only; cannot establish order bias or player market values'},\n 'prospective_stop_amendment':\
        \ {\n   'precedence':'INDIVIDUAL_CRITICAL_STOP_OVERRIDES_ALL_AGGREGATE_THRESHOLDS',\n   'critical_triggers': ['Misidentifies TreVeyon\
        \ Henderson as not the RB or selects either TE as RB',\n                         'Misunderstands same dynasty time horizon or 12-team\
        \ dynasty SF/IDP context',\n                         'Believes KEEP/TRADE/CUT forces actual transactions'],\n   'action_on_any_critical':'Immediately\
        \ pause new exposure/collection; quarantine any results; record a pseudonymous incident; human review; no pilot passage',\n   'after_issue':'Version\
        \ wording or UI, preregister prospective change, obtain new independent QC and separate owner signoff before any resumption',\n   'noncritical_design_feedback_only':\
        \ {'rb_identification_minimum':'10/12', 'equal_horizon_and_semantics_minimum':'10/12',\n                                        'precondition':'Completed\
        \ 12 responses with zero critical issues',\n                                        'not_market_calibration_evidence':True},\n   'stop_at':'12\
        \ independent consented completed responses maximum, if separately authorized',\n },\n 'eligibility_and_data_policy_draft': {\n   'eligibility':'Consenting\
        \ adults experienced with dynasty Superflex and IDP; no bots, duplicates or prior pilot participants',\n   'assignment':'Six orders, balanced\
        \ two per order, pseudonymous audit log, at most one exposure/person; actual implementation unapproved',\n   'data_minimization':'Collect\
        \ consented pseudonymous usability results only; do not record public names or sensitive identifiers in research archive',\n   'raw_retention_proposal':'30\
        \ days after collection, then delete; policy and deletion mechanism need independent review/approval',\n   'incident_handling':'Record\
        \ anonymous critical-issue reason; stop; quarantine outcomes; secure retention and deletion review pending',\n   'recruitment_blocked':True,\n\
        \ },\n 'held_scope': {'original_excluded_slots':scope['excluded_held_slots'], 'seven_identity_holds':scope['identity_hold_names'],\n \
        \                'optional_shadow_rows_uncertified':9, 'catalog_ballots_issued':0},\n 'fail_closed': {'participants_contacted':0,'participant_results_collected':0,'voter_links_created':False,\n\
        \                 'ballots_issued':False,'votes_ingested':0,'recruitment_enabled':False,\n                 'market_value_changed':False,'production_change_authorized':False,'identity_holds_cleared':0,\n\
        \                 'catalog_issuance_approved':False,'independent_qc_completed':False},\n 'required_next_gate': 'Independent human review\
        \ of exact wording, comprehension questions, critical stop, consent, privacy, assignment/dedup, deletion, incident response; then separate\
        \ owner approval for any recruitment or live display',\n 'full_model_audit': {'closed':13,'total':20}\n}\noriginal = json.loads(json.dumps(rows))\n\
        scoperecord = {\n 'status':'UNCHANGED_22_RESEARCH_CANDIDATES_NO_ISSUANCE',\n 'source_v21_scope_sha256':EXPECTED['v21/RESEARCH_ONLY_v21_scope_prereg.json'],\n\
        \ 'candidate_review_count':22,'statuses':dict(statuses),\n 'research_catalog':original,'original_excluded_slots':scope['excluded_held_slots'],\n\
        \ 'seven_identity_holds':scope['identity_hold_names'],\n 'single_trio_for_usability_research_slot':11,\n 'only_single_trio_pilot_draft_no_real_display':True,\n\
        \ 'identity_holds_cleared':0,'optional_shadow_certified':0,\n 'catalog_issuance_approved':False,'recruitment_approved':False,\n 'voting_activated':False,'production_changed':False,\n\
        }\nfiles = {\n 'RESEARCH_ONLY_v23_prospective_protocol_amendment.json': amendment,\n 'RESEARCH_ONLY_v23_unchanged_catalog_scope.json':\
        \ scoperecord,\n}\nfor name,value in files.items():\n (OUT/name).write_text(json.dumps(value,sort_keys=True,indent=2,ensure_ascii=False)+'\\\
        n')\nlines = [\n '# QF11 V23 — Prospective pilot amendment / independent QC handoff', '',\n '**Owner approval is preregistration-only.\
        \ No real respondents, consent collection, ballot links, vote ingestion or production changes.**', '',\n '## Source provenance',\n '-\
        \ Exact V21 and V22 GitHub Green artifact bytes SHA-256 pinned in the JSON protocol; original documents remain immutable.',\n '- V21 run\
        \ **38324067358**, V22 run **38324741333**. V22 independently recorded six open protocol/catalog safeguards.', '',\n '## Scope',\n '-\
        \ Preserve 22 source-status-tagged research candidates (**12 unchanged**, **9 optional uncertified**, **1 tentative**). No catalog voting\
        \ authorization.',\n '- Narrow prospective usability pilot to **Brock Bowers (TE) / Tyler Warren (TE) / TreVeyon Henderson (RB)** only,\
        \ six display orders with a paper-design target of 12 adults, two/order.',\n '- Original held slots **1, 5, 8, 12, 15, 21** and **seven\
        \ identity holds** remain unchanged.', '',\n '## Prospective V23 amendment to stop rule',\n '- **One critical comprehension misunderstanding\
        \ overrides any aggregate 10/12 design-feedback rule.**',\n '- Stop new exposure/collection and quarantine findings at the first critical\
        \ event; manual incident review. Fixes must be new, versioned, independently reviewed, and separately authorized.',\n '- Only if **zero**\
        \ critical incidents and all 12 completed results exist can the >=10/12 criteria be inspected as usability feedback, never as statistical\
        \ market validation.', '',\n '## Exact wording draft (NOT approved for respondent display)',\n '> ' + wording, '',\n '> Brock Bowers —\
        \ TE | Tyler Warren — TE | TreVeyon Henderson — RB', '',\n '## Safeguards for future independent QC',\n '- Adults familiar with dynasty\
        \ SF/IDP; documented informed consent; bots, duplicates, and prior participants excluded.',\n '- Auditably balanced six-order prospective\
        \ assignment; one exposure per person, pseudonymous records; mechanism must be tested and approved before real use.',\n '- Minimal consented\
        \ usability data. Proposed 30-day raw retention/delete rule is a **draft**, not an implemented policy or deletion control.',\n '- Privacy,\
        \ exact questions, semantics, incident quarantine, versioned resumption, consent and deletion implementation require independent signoff.',\n\
        \ '- The nine optional substitutions cannot be shown as vetted ballots; seven identity holds cannot be auto-cleared.', '',\n '## No-live-pilot\
        \ invariant',\n '- `owner_pilot_activation_approved=false`; `independent_qc_completed=false`; no participant contact, voter links, ballot\
        \ issuance or new votes.',\n '- No use in Market Value, Fundamental Value, Package Adjustment, or any frozen production artifact.',\n\
        \ '- Full-model audit remains 13/20 closed (65%).', '',\n '## Next gate',\n 'Independent wording, eligibility, protocol/statistics, privacy\
        \ and implementation QC; then owner must separately authorize any human-participant contact. **A Green workflow is not such authorization.**',\
        \ ''\n]\n(OUT/'RESEARCH_ONLY_v23_independent_qc_handoff.md').write_text('\\n'.join(lines))\nassert {x.name for x in OUT.iterdir()} ==\
        \ set(files)|{'RESEARCH_ONLY_v23_independent_qc_handoff.md'}\nassert not any(x.is_symlink() for x in OUT.iterdir())\nprint('QF11_V23_OWNER_AMENDMENT_PREREG_GREEN\
        \ '+json.dumps({\n 'research_candidates':22,'optional_uncertified':9,'held_slots':6,'identities_held':7,\n 'pilot_n_design':12,'display_orders':6,'critical_stop_override':True,\n\
        \ 'owner_pilot_activation':False,'independent_qc_completed':False,\n 'participants_contacted':0,'ballots_issued':0,'production_changes':0\n\
        },sort_keys=True))\nQF11_V23_AMENDMENT\n"
    - name: Run all 14 frozen model regressions and FA PA release selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V23_FROZEN_14_REGRESSIONS_GREEN

        '
    - name: Prove V23 amendment keeps identity catalog participant and market gates closed
      shell: bash
      run: "set -euo pipefail\npython3 - <<'QF11_V23_GATE'\nimport json\nfrom pathlib import Path\np=Path('/tmp/qf11-v23-output')\nassert {f.name\
        \ for f in p.iterdir()}=={\n 'RESEARCH_ONLY_v23_prospective_protocol_amendment.json',\n 'RESEARCH_ONLY_v23_unchanged_catalog_scope.json',\n\
        \ 'RESEARCH_ONLY_v23_independent_qc_handoff.md',\n}\na=json.loads((p/'RESEARCH_ONLY_v23_prospective_protocol_amendment.json').read_text())\n\
        c=json.loads((p/'RESEARCH_ONLY_v23_unchanged_catalog_scope.json').read_text())\nassert a['status']=='OWNER_APPROVED_RESEARCH_AMENDMENT_PREREG_ONLY_NOT_PILOT_ACTIVATION'\n\
        assert a['prospective_stop_amendment']['precedence']=='INDIVIDUAL_CRITICAL_STOP_OVERRIDES_ALL_AGGREGATE_THRESHOLDS'\nassert a['display_wording']['status']=='DRAFT_FOR_INDEPENDENT_QC_NOT_APPROVED_TO_DISPLAY'\n\
        assert a['sample_plan']['design_n']==12 and len(a['sample_plan']['display_orders'])==6\nassert a['owner_approval_scope']['real_respondent_display_approved']\
        \ is False\nassert a['owner_approval_scope']['pilot_recruitment_approved'] is False\nassert a['owner_approval_scope']['independent_review_completed']\
        \ is False\nassert a['fail_closed']['participants_contacted']==0\nassert a['fail_closed']['votes_ingested']==0 and a['fail_closed']['ballots_issued']\
        \ is False\nassert a['fail_closed']['production_change_authorized'] is False\nassert a['fail_closed']['identity_holds_cleared']==0\nassert\
        \ c['candidate_review_count']==22 and len(c['research_catalog'])==22\nassert c['statuses']=={'SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED':12,\
        \ 'OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY':9,'OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN':1}\nassert c['original_excluded_slots']==[1,5,8,12,15,21]\
        \ and len(c['seven_identity_holds'])==7\nassert c['optional_shadow_certified']==0 and c['catalog_issuance_approved'] is False\nassert\
        \ c['voting_activated'] is False and c['production_changed'] is False\nprint('QF11_V23_UNCHANGED_SCOPE_ZERO_CONTACT_NO_VOTING_NO_PRODUCTION_GREEN')\n\
        QF11_V23_GATE\n"
    - name: Recheck exact protected production blobs and clean read-only checkout
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

