# B57V V1R3 -- READ-ONLY SIGSTORE FORENSICS -- DRAFT; NOT APPROVED FOR COMMIT OR RUN.
# Separate pre-run approvals are required before this workflow or its companion script
# is uploaded to main or dispatched. NO signing, new attestations, repository writes,
# study/source/custody/H3/O2/2024/market/voting reads or production/V10 changes.
# READ-ONLY means Git/study/attestation state; this workflow DOES upload a diagnostic
# GitHub Actions artifact as transport. It NEVER declares a scientific freeze.
name: B57V Exact Rookie Slot V2 - Read-Only B57R Sigstore Verification V1R3

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: b57v-read-only-attestation-verifier
  cancel-in-progress: false

jobs:
  collect_and_verify_b57r:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Sparse checkout of only this verifier workflow and script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/B57V-v1r3.yml
            .github/scripts/B57V-v1r3-verify.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Fail closed on unexpected workflow identity, script, or materialized files
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY_B57V_CHECK'
          import hashlib, os, pathlib, re, subprocess
          def require(ok,code):
              if not ok: raise RuntimeError(code)
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL).decode('utf8').strip()
          repo='ajknoll23-code/LOG-Trade-Calculator'
          workflow='.github/workflows/B57V-v1r3.yml'
          script='.github/scripts/B57V-v1r3-verify.py'
          expected_script_sha256='61f52d5705ab48e34ac88cbc2421fd69b14cc560e2d32253122de3f5f9d22d5f'
          require(os.environ.get('GITHUB_REPOSITORY')==repo,'WRONG_REPOSITORY')
          require(os.environ.get('GITHUB_REPOSITORY_ID')=='1332656701','WRONG_REPO_ID')
          require(os.environ.get('GITHUB_REPOSITORY_OWNER_ID')=='302637022','WRONG_OWNER_ID')
          require(os.environ.get('GITHUB_WORKFLOW_REF')==repo+'/'+workflow+'@refs/heads/main','WRONG_WORKFLOW_REF')
          require(os.environ.get('GITHUB_REF')=='refs/heads/main','WRONG_REF')
          require(os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch','WRONG_EVENT')
          require(os.environ.get('GITHUB_RUN_ATTEMPT')=='1','RERUN_NOT_AUTHORIZED')
          sha=os.environ.get('GITHUB_SHA','')
          require(re.fullmatch('[0-9a-f]{40}',sha) is not None,'BAD_COMMIT_SHA')
          require(os.environ.get('GITHUB_WORKFLOW_SHA')==sha,'WORKFLOW_SHA_MISMATCH')
          require(git('rev-parse','HEAD')==sha,'HEAD_SHA_MISMATCH')
          require(git('remote','get-url','origin')=='https://github.com/'+repo,'ORIGIN_DRIFT')
          require(git('status','--porcelain','--untracked-files=all')=='','DIRTY_CHECKOUT')
          patterns=subprocess.check_output(['git','sparse-checkout','list'],text=True).strip().splitlines()
          normalized=[x.lstrip('/') for x in patterns]
          require(set(normalized)=={workflow,script} and len(normalized)==2,'SPARSE_PATTERNS_DRIFT')
          # Sparse checkout's index may list thousands of SKIP-WORKTREE entries.
          # Check actual materialization, not git ls-files count.
          materialized=[]
          for folder,dirs,files in os.walk('.'):
              dirs[:]=[x for x in dirs if x!='.git']
              materialized.extend(str((pathlib.Path(folder)/file).as_posix()).removeprefix('./') for file in files)
          require(set(materialized)=={workflow,script},'UNEXPECTED_MATERIALIZED_REPO_FILE')
          contents=pathlib.Path(script).read_bytes()
          require(hashlib.sha256(contents).hexdigest()==expected_script_sha256,'SCRIPT_SHA256_DRIFT')
          committed=subprocess.check_output(['git','show','HEAD:'+script],stderr=subprocess.DEVNULL)
          require(contents==committed,'SCRIPT_NOT_COMMITTED_BYTES')
          actual_workflow=pathlib.Path(workflow).read_bytes()
          require(actual_workflow==subprocess.check_output(['git','show','HEAD:'+workflow],stderr=subprocess.DEVNULL),
                  'WORKFLOW_NOT_COMMITTED_BYTES')
          print('B57V_FAIL_CLOSED_IDENTITY_AND_SPARSE_CHECKOUT_PASS')
          print('B57V_SCRIPT_SHA256='+expected_script_sha256)
          print('B57V_PRODUCER_COMMIT='+sha)
          print('B57V_STUDY_DATA_MATERIALIZED=FALSE')
          PY_B57V_CHECK

      - name: Collect fixed B57R artifacts and compare same-upstream TUF bootstrap routes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/B57V-v1r3-verify.py

      # This artifact is diagnostic-only. It does NOT create a Sigstore signature,
      # TUF root assertion, scientific freeze, verified identity gate or Git commit.
      - name: Retain diagnostics whether verification passes or fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b57v-read-only-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b57v-verification-v1/
          if-no-files-found: warn
          retention-days: 30
