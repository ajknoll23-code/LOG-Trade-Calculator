name: QF11 V36 - Existing KTC V2 Apps Script Hardened Code Sync Kit (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v36-existing-ktc-v2-apps-script-code-sync-kit
  cancel-in-progress: false
jobs:
  prepare_code_sync:
    name: Generate verified Code.gs for existing private Google project; never deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout pinned main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install regression dependency
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin V35r1 hardened sources and unchanged calculator
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == refs/heads/main ]] || { echo STOP_BRANCH; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_DRIFT_$1"; exit 1; }; }

        check research/ktc-v2-isolated/collector.gs b4ce85ea8bf72ef5399d5ffc898b3b571fbcad89

        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a

        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d

        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7

        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860

        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167

        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        echo QF11_V36_SOURCE_PINS_GREEN

        '
    - name: Run all synthetic tests and frozen production regressions
      run: 'set -euo pipefail

        node research/ktc-v2-isolated/collector.test.js

        node research/ktc-v2-isolated/client-bridge.test.js

        node research/ktc-v2-isolated/frame-host.test.js

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V36_75_SYNTHETIC_AND_FROZEN_PRODUCTION_REGRESSIONS_GREEN

        '
    - name: Prepare single-file replacement for EXISTING Code.gs, no external calls
      run: "set -euo pipefail\npython3 - <<'PYV36'\nfrom pathlib import Path\nimport hashlib,json,subprocess\np=Path('research/ktc-v2-isolated')\n\
        header=\"\"\"/* QF11 V36 — Existing KTC V2 Apps Script Code.gs full replacement.\n * No new project; keep\
        \ the existing pilot-frame.html unchanged.\n * All nine disabled-state script properties MUST remain false.\n\
        \ * No tokens, spreadsheet IDs, or secrets are included in this source.\n * V35r1 hardened direct POST +\
        \ internal handler; V33 HtmlService host.\n */\n\n\"\"\"\nhelper=\"/** V36: operator-only, read-only verification\
        \ functions. Do not enable collection. */\\nfunction qf11v2VerifyDisabledSetup() {\\n  var props = PropertiesService.getScriptProperties();\\\
        n  var flags = [\\n    'QF11_V2_ENABLED',\\n    'QF11_V2_HALTED',\\n    'QF11_V2_CLOSED',\\n    'QF11_V2_IFRAME_TRANSPORT_VERIFIED',\\\
        n    'QF11_V2_OWNER_PILOT_AUTHORIZED',\\n    'QF11_V2_INDEPENDENT_WORDING_QC',\\n    'QF11_V2_PRIVACY_DELETION_VERIFIED',\\\
        n    'QF11_V2_MODERATOR_SOP_VERIFIED',\\n    'QF11_V2_COLLECTOR_ISOLATION_VERIFIED'\\n  ];\\n  flags.forEach(function(key)\
        \ {\\n    if (props.getProperty(key) !== 'false') {\\n      throw new Error('STOP: ' + key + ' must be false');\\\
        n    }\\n  });\\n  var sheet = qf11v2Sheet_(props);\\n  if (sheet.getLastRow() !== 1) {\\n    throw new\
        \ Error('STOP: Expected an empty Responses sheet');\\n  }\\n  Logger.log('PASS: KTC V2 disabled, separate\
        \ spreadsheet verified, all 13 headers correct, and no responses present.');\\n}\\nfunction qf11v2VerifyLockedInterface()\
        \ {\\n  var page = doGet({});\\n  var html = page.getContent();\\n  if (!html.includes('KTC V2 is not accepting\
        \ pilot responses.')) {\\n    throw new Error('STOP: Voting interface is not disabled.');\\n  }\\n  var\
        \ invitation = qf11v33Bootstrap('TEST_INVALID_TOKEN');\\n  if (invitation.status !== 'DISABLED') {\\n  \
        \  throw new Error('STOP: Invitation access is not disabled.');\\n  }\\n  var response = qf11v33Submit({});\\\
        n  if (response.status !== 'DISABLED') {\\n    throw new Error('STOP: Vote submissions are not disabled.');\\\
        n  }\\n  Logger.log('PASS: KTC V2 interface, invitations, and vote submissions are all disabled.');\\n}\\\
        n\"\ncode=header+(p/'collector.gs').read_text().rstrip()+\"\\n\\n/* Existing V33 iframe HtmlService host\
        \ */\\n\"+(p/'frame-host.gs').read_text().rstrip()+\"\\n\\n\"+helper\nout=Path('/tmp/qf11-v36');out.mkdir(parents=True,exist_ok=True)\n\
        name='QF11-V36-EXISTING-KTC-V2-Code.gs.txt'\n(out/name).write_text(code)\nassert code.count('function doGet(')==1\
        \ and code.count('function doPost(')==1\nassert code.count('function qf11v2IntakeAuthorized_')==1\nassert\
        \ code.count('if(!qf11v2IntakeAuthorized_(props))')==2\nassert code.count('function qf11v2VerifyDisabledSetup(')==1\n\
        assert code.count('function qf11v2VerifyLockedInterface(')==1\nassert not any(x in code for x in ['1JE07k2vh14OPCvTzGxnsPrh_3Bdwoq4PF_MBssI6C3I','1vXSYK8d-X6EXO2QfaU3_x7Zu_WwRwv9k62LnuEeFmBs'])\n\
        manifest={\n 'schema':'QF11_V36_EXISTING_APPS_SCRIPT_SYNC_BUNDLE_V1',\n 'code_sha256':hashlib.sha256(code.encode()).hexdigest(),\n\
        \ 'source_collector_blob':'b4ce85ea8bf72ef5399d5ffc898b3b571fbcad89',\n 'source_html_host_blob':'36c9805cee98098e51bc3bf7a45e76559d62b46d',\n\
        \ 'source_only':True,'collector_enabled_by_workflow':False,'google_deployment_changed':False,\n 'new_google_project_needed':False,'pilot_frame_html_unchanged':True,\n\
        \ 'human_participants_enrolled_by_workflow':0,'live_responses_written_by_workflow':0,'real_browser_rpc_verified':False,\n\
        \ 'next_manual_action':'Replace contents of Code.gs in EXISTING private Google Apps Script with this exact\
        \ file, leave pilot-frame.html unchanged, keep all nine flags false. Save and run both read-only verifier\
        \ functions before editing the owner-only deployment. Do not activate real votes.'\n}\n(out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\\\
        n')\n(out/'INSTRUCTIONS.txt').write_text('QF11 V36 — EXISTING PRIVATE PROJECT ONLY\\n\\nNo new spreadsheet\
        \ or Apps Script project.\\nDo not share secrets in chat.\\nOpen existing KTC V2 Apps Script > Code.gs.\\\
        nReplace Code.gs contents with text from '+name+'.\\nSave. Do NOT modify pilot-frame.html or script properties.\\\
        nKeep all nine existing safety flags false.\\nRun qf11v2VerifyDisabledSetup and qf11v2VerifyLockedInterface;\
        \ both must log PASS.\\nOnly after both Green, edit your existing owner-only Web app deployment to New version,\
        \ keeping Execute as Me and access Only myself.\\nConfirm disabled message still appears.\\nNo real votes\
        \ or tokens.\\n')\nprint('QF11_V36_SOURCE_ONLY_KIT_PREPARED',manifest['code_sha256'])\n\nPYV36\nnode --check\
        \ < /tmp/qf11-v36/QF11-V36-EXISTING-KTC-V2-Code.gs.txt\n"
    - name: Run standalone compiled-code disabled-mode smoke tests
      run: "set -euo pipefail\ncat > /tmp/qf11-v36/smoke.js <<'JSSMOKE'\nconst fs=require('fs'),vm=require('vm'),assert=require('assert');\n\
        const code=fs.readFileSync(process.argv[2],'utf8');\nconst conf={};\nfor(const x of ['QF11_V2_ENABLED','QF11_V2_HALTED','QF11_V2_CLOSED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'])conf[x]='false';\n\
        conf.QF11_V2_SEPARATE_SHEET_VERIFIED='YES';conf.QF11_V1_SHEET_ID='TEST_V1';conf.QF11_V2_SHEET_ID='TEST_V2';\n\
        const HEADERS=['received_utc','delete_due_utc','schema','slot','display_order','token_hmac','keep','trade','cut','q1','q2','q3','review_status'];\n\
        let rows=[HEADERS];\nconst env={\n  PropertiesService:{getScriptProperties:()=>({getProperty:key=>conf[key]??null,setProperty:(key,val)=>{conf[key]=val}})},\n\
        \  SpreadsheetApp:{openById:id=>{assert.equal(id,'TEST_V2');return {getSheetByName:name=>{assert.equal(name,'Responses');return\
        \ {getLastRow:()=>rows.length,getRange:(r,c,n)=>({getValues:()=>[HEADERS]})}}}}},\n  ContentService:{MimeType:{JSON:'application/json'},createTextOutput:(str)=>({getContent:()=>str,setMimeType(){return\
        \ this}})},\n  HtmlService:{createHtmlOutput:(str)=>({getContent:()=>str})},\n  Logger:{log:(s)=>{assert(s.startsWith('PASS:'))}},\n\
        \  Date,JSON,Object,Array,String,Number,Set,Error,Math,\n};\nvm.createContext(env);vm.runInContext(code,env,{timeout:2000});\n\
        assert.equal(env.qf11v33Submit({}).status,'DISABLED');\nassert.equal(env.qf11v33Bootstrap('INVALID_TOKEN').status,'DISABLED');\n\
        assert.equal(JSON.parse(env.doPost({postData:{contents:'{}'}}).getContent()).status,'DISABLED');\nassert(env.doGet({}).getContent().includes('not\
        \ accepting pilot responses'));\nenv.qf11v2VerifyDisabledSetup();env.qf11v2VerifyLockedInterface();\nfor\
        \ (let key of ['QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'])\
        \ {\n  conf.QF11_V2_ENABLED='true';conf[key]='false';\n  assert.equal(JSON.parse(env.doPost({postData:{contents:'{}'}}).getContent()).status,'DISABLED',key);\n\
        \  assert.equal(env.qf11v2Handle_({},env.PropertiesService.getScriptProperties(),Date.now()),'DISABLED',key);\n\
        \  conf[key]='false';conf.QF11_V2_ENABLED='false';\n}\nassert.equal(rows.length,1);\nconsole.log('QF11_V36_COMBINED_SOURCE_DISABLED_E2E_SMOKE_GREEN');\n\
        \nJSSMOKE\nnode /tmp/qf11-v36/smoke.js /tmp/qf11-v36/QF11-V36-EXISTING-KTC-V2-Code.gs.txt\n"
    - name: Verify repo unchanged and upload isolated source-only sync kit
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_REPO_CHANGED; exit 1; }

        echo QF11_V36_READ_ONLY_KIT_READY_NO_DEPLOY_NO_REAL_VOTES

        '
    - name: Upload existing-project code sync kit
      uses: actions/upload-artifact@v4
      with:
        name: QF11-V36-EXISTING-PROJECT-CODE-SYNC-KIT
        path: '/tmp/qf11-v36/QF11-V36-EXISTING-KTC-V2-Code.gs.txt

          /tmp/qf11-v36/INSTRUCTIONS.txt

          /tmp/qf11-v36/manifest.json'
        retention-days: 7
        if-no-files-found: error
