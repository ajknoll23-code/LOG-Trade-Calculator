              and (
                  isinstance(x.func, ast.Name)
                  and x.func.id == 'build_holdout_cohort'
              )
          ]
          assert len(h_calls) == 1 and len(j_calls) == 1, 'B41J_PARITY_COHORT_CALL_COUNT'
          h_call, j_call = h_calls[0], j_calls[0]
          assert len(h_call.args) == 4, 'B41J_PARITY_B41H_COHORT_ARG_COUNT'
          assert len(j_call.args) == 6, 'B41J_PARITY_B41J_COHORT_ARG_COUNT'
          for i in range(4):
              assert canon(h_call.args[i]) == canon(j_call.args[i]), (
                  f'B41J_PARITY_COHORT_ARG_DRIFT {i}'
              )
          assert ast.dump(j_call.args[4], include_attributes=False) == ast.dump(
              ast.Name(id='b41h', ctx=ast.Load()), include_attributes=False
          )
          assert ast.dump(j_call.args[5], include_attributes=False) == ast.dump(
              ast.Name(id='players_path', ctx=ast.Load()), include_attributes=False
          )

          # Exact performance-orchestration equality from the identity_mapped
          # filter through the complete four-test primary_pass branch.
          # Structural reporting is deliberately before this start marker.
          h_model_start = stmt_index(
              h_body, 'model = cohort_ids[cohort_ids'
          )
          j_model_start = stmt_index(
              j_body, 'model = cohort_ids[cohort_ids'
          )
          h_scored_keep = stmt_index(h_body, 'scored_keep =')
          j_scored_keep = stmt_index(j_body, 'scored_keep =')
          n_eval = compare_sequence(
              'performance_core',
              h_body[h_model_start:h_scored_keep],
              j_body[j_model_start:j_scored_keep],
              min_count=8,
          )

          # B41J V3 residual parity closure:
          # (a) Close the entire window between cohort construction and the
          # identity_mapped model filter. B41J-only structural reporting is the
          # only permitted insertion and may not rebind downstream variables.
          h_cohort_idx = stmt_index(h_body, 'build_holdout_cohort(')
          j_cohort_idx = stmt_index(j_body, 'build_holdout_cohort(')
          h_mid = h_body[h_cohort_idx + 1:h_model_start]
          j_mid_all = j_body[j_cohort_idx + 1:j_model_start]
          j_mid = [
              s for s in j_mid_all
              if 'structural' not in ast.unparse(s)
          ]
          n_mid = compare_sequence(
              'cohort_to_model_window',
              h_mid,
              j_mid,
              min_count=1,
          )

          for s in j_mid_all:
              if 'structural' in ast.unparse(s):
                  for t in ast.walk(s):
                      if (
                          isinstance(t, ast.Name)
                          and isinstance(t.ctx, ast.Store)
                          and t.id not in ('structural', 'structural_path')
                      ):
                          raise SystemExit(
                              f'B41J_STRUCTURAL_STATEMENT_REBINDS {t.id}'
                          )

          # Also prove there are no omitted or inserted scientific statements
          # inside the try body before the cohort call.
          n_pre_cohort = compare_sequence(
              'try_pre_cohort',
              h_body[:h_cohort_idx],
              j_body[:j_cohort_idx],
              min_count=0,
          )

          # (b) B41H is imported as a module, so its main() and evaluate()
          # pre-try setup do not execute through B41H itself. Prove those
          # non-executed regions do not carry scientific global-state setup.
          h_pre_try = [
              s for s in h_eval.body
              if not isinstance(s, ast.Try)
          ]
          setup_calls_checked = 0
          for node in [fn(h_tree, 'main'), *h_pre_try]:
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Call):
                      setup_calls_checked += 1
                      f = ast.unparse(sub.func)
                      if any(
                          k in f
                          for k in (
                              'seed',
                              'set_option',
                              'seterr',
                              'setrecursionlimit',
                              'default_rng',
                          )
                      ):
                          raise SystemExit(
                              f'B41J_B41H_SETUP_NOT_REPLICATED {f}'
                          )

          # Scored-row evidence columns must also remain identical.
          compare_sequence(
              'scored_keep_columns',
              [h_body[h_scored_keep]],
              [j_body[j_scored_keep]],
              min_count=1,
          )

          # Explicitly protect the final PASS-selection topology.
          result_ifs = [
              s for s in j_body
              if isinstance(s, ast.If)
              and "not dq['pass']" in ast.unparse(s)
          ]
          assert len(result_ifs) == 1, 'B41J_RESULT_SELECTION_COUNT'
          r = result_ifs[0]
          assert ast.unparse(r.test).replace('"', "'") == "not dq['pass']"
          assert len(r.body) == 1 and isinstance(r.body[0], ast.Assign)
          assert ast.unparse(r.body[0].value) == 'DATA_STOP_RESULT'
          assert len(r.orelse) == 1 and isinstance(r.orelse[0], ast.If)
          r2 = r.orelse[0]
          assert ast.unparse(r2.test) == 'primary_pass'
          assert ast.unparse(r2.body[0].value) == 'PASS_RESULT'
          assert ast.unparse(r2.orelse[0].value) == 'FAIL_RESULT'

          print(
              'PASS: strict B41J orchestration parity with frozen B41H — '
              f'pre_identity={n_pre}, post_identity={n_post}, '
              f'try_pre_cohort={n_pre_cohort}, cohort_to_model={n_mid}, '
              f'performance_core={n_eval}, '
              f'nonexecuted_setup_calls_checked={setup_calls_checked}; '
              'omissions/reordering/state-setup drift fail closed.'
          )
          PYSTATIC

          if [ -e "$SCRIPT" ]; then
            test "$(sha256sum "$SCRIPT" | awk '{print $1}')" = "$B41J_EVALUATOR_SHA256"
          else
            cp /tmp/b41j_expected_evaluator.py "$SCRIPT"
          fi

          if [ -e "$CONTRACT" ]; then
            test "$(sha256sum "$CONTRACT" | awk '{print $1}')" = "$B41J_FREEZE_SHA256"
          else
            cp /tmp/b41j_expected_freeze.json "$CONTRACT"
          fi

      - name: Install exact runtime and run both frozen self-tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check \
            'numpy==2.5.3' \
            'pandas==2.3.3' \
            'scipy==1.18.1' \
            'requests>=2.32,<3'

          python "$BASE/player_role_v2_b41h_one_shot_holdout_evaluator.py" --self-test
          python "$BASE/player_role_v2_b41j_continuation_holdout_evaluator.py" --self-test

          python3 - <<'PYRUNTIME'
          import importlib.metadata as md

          expected = {
              'numpy': '2.5.3',
              'pandas': '2.3.3',
              'scipy': '1.18.1',
          }
          actual = {name: md.version(name) for name in expected}
          assert actual == expected, (actual, expected)
          print(f'PASS: B41J scientific runtime matches frozen B41H pins: {actual}')
          PYRUNTIME

      - name: Commit immutable B41J evaluator freeze before performance continuation
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          # Recheck the B41I identity source after rebasing.
          test "$(sha256sum "$BASE/frozen_inputs/players_b41i_snapshot.csv" | awk '{print $1}')" = "$B41I_IDENTITY_SHA256"
          test "$(sha256sum "$BASE/player_role_v2_b41j_continuation_holdout_evaluator.py" | awk '{print $1}')" = "$B41J_EVALUATOR_SHA256"
          test "$(sha256sum "$BASE/player_role_v2_b41j_evaluator_freeze.json" | awk '{print $1}')" = "$B41J_FREEZE_SHA256"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$BASE/player_role_v2_b41j_continuation_holdout_evaluator.py" \
            "$BASE/player_role_v2_b41j_evaluator_freeze.json"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'B41J evaluator implementation already frozen identically.'
          else
            git commit -m 'Freeze Player Role V2 B41J continuation evaluator before performance'
            git push origin HEAD:main
          fi

      - name: Durably authorize exactly one B41J continuation attempt
        id: eligibility
        shell: bash
        env:
          OWNER_ATTEST: ${{ inputs.independent_review_and_no_peek_attestation }}
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PYGATE'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, subprocess

          base = Path(os.environ['BASE'])
          evaluator = base / 'player_role_v2_b41j_continuation_holdout_evaluator.py'
          freeze = base / 'player_role_v2_b41j_evaluator_freeze.json'
          witness = base / 'player_role_v2_b41j_holdout_continuation_open_witness.json'
          abort = base / 'player_role_v2_b41j_operational_abort.json'

          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(evaluator) == os.environ['B41J_EVALUATOR_SHA256']
          assert sha(freeze) == os.environ['B41J_FREEZE_SHA256']
          assert sha(base / 'frozen_inputs/players_b41i_snapshot.csv') == os.environ['B41I_IDENTITY_SHA256']

          # Evaluator/freeze may have exactly one content-changing commit: their frozen introduction.
          for p in [evaluator, freeze]:
              commits = subprocess.check_output(
                  ['git', 'log', '--format=%H', '--', str(p)], text=True
              ).splitlines()
              if len(commits) != 1:
                  raise RuntimeError(
                      f'B41J_FROZEN_IMPLEMENTATION_HISTORY_CHANGED {p.name} commits={len(commits)}'
                  )

          for p in [
              base / 'player_role_v2_b41j_holdout_evidence.json',
              base / 'player_role_v2_b41j_scientific_decision.json',
              base / 'player_role_v2_b41j_scored_holdout_rows.csv',
              base / 'player_role_v2_b41j_bootstrap_replicates.csv',
          ]:
              if p.exists():
                  raise RuntimeError(
                      f'B41J_ONE_SHOT_EVIDENCE_ALREADY_EXISTS_REFUSE_RERUN {p.name}'
                  )

          mode = None
          if not witness.exists():
              w = {
                  'schema_version': 1,
                  'study_id': 'player-role-v2',
                  'phase': 'B41J-2025-holdout-continuation-open-witness',
                  'opened_at_utc': datetime.now(timezone.utc).isoformat(),
                  'continuation_class': os.environ['CONTINUATION_CLASS'],
                  'B41I_result': 'PASS_B41I_OUTCOME_BLIND_RECOVERY_ELIGIBLE_FOR_B41J',
                  'B41I_pass_commit': os.environ['B41I_PASS_COMMIT'],
                  'b41i_identity_sha256': os.environ['B41I_IDENTITY_SHA256'],
                  'b41j_evaluator_sha256': os.environ['B41J_EVALUATOR_SHA256'],
                  'independent_review_attested': True,
                  'no_2025_holdout_performance_viewed_before_B41J_attested': True,
                  'performance_decision_computed_before_witness': False,
                  'retuning_permitted': False,
                  'production_change_authorized': False,
              }
              witness.write_text(json.dumps(w, indent=2, sort_keys=True) + '\n')
              mode = 'fresh'
          else:
              if not abort.exists():
                  raise RuntimeError(
                      'B41J_OPEN_WITNESS_EXISTS_WITHOUT_DURABLE_TRANSPORT_ABORT_REFUSE_RERUN'
                  )
              a = json.loads(abort.read_text())
              if a.get('result') != 'OPERATIONAL_ABORT_BEFORE_COMPLETE_METRIC_EVALUATION':
                  raise RuntimeError('B41J_ABORT_RESULT_NOT_RERUN_ELIGIBLE')
              if a.get('same_frozen_evaluator_rerun_permitted') is not True:
                  raise RuntimeError('B41J_ABORT_DOES_NOT_AUTHORIZE_EXACT_RERUN')
              if a.get('performance_decision_computed') is not False:
                  raise RuntimeError('B41J_ABORT_PERFORMANCE_FLAG_NOT_FALSE')

              # Consume this specific retry authorization before the next attempt.
              # A future retry therefore requires a NEW transport abort from the
              # new attempt; stale aborts cannot authorize repeated reruns.
              now = datetime.now(timezone.utc)
              stamp = now.strftime('%Y%m%dT%H%M%S%fZ')
              archived = base / f'player_role_v2_b41j_operational_abort_attempt_{stamp}.json'
              abort.rename(archived)

              w = json.loads(witness.read_text())
              w['attempt_number'] = int(w.get('attempt_number', 1)) + 1
              w['last_attempt_opened_at_utc'] = now.isoformat()
              w['previous_transport_abort_archived_as'] = archived.name
              w['performance_decision_computed_before_witness'] = False
              w['retuning_permitted'] = False
              w['production_change_authorized'] = False
              witness.write_text(json.dumps(w, indent=2, sort_keys=True) + '\n')
              mode = 'transport_retry'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('eligible=true\n')
              f.write(f'mode={mode}\n')
          print(f'B41J continuation eligibility: {mode}')
          PYGATE

          # The open witness is committed before any B41J performance computation.
          if [ -f "$BASE/player_role_v2_b41j_holdout_continuation_open_witness.json" ]; then
            git add -A "$BASE"
            git diff --cached --check

            # Keep the broad add operation provably narrow. Fresh open may stage
            # only the witness. A transport retry may additionally stage exactly
            # one deletion of the active abort and one attempt-stamped archive.
            mapfile -t staged_paths < <(
              git diff --cached --name-only --no-renames | sort -u
            )
            witness_path="$BASE/player_role_v2_b41j_holdout_continuation_open_witness.json"
            abort_path="$BASE/player_role_v2_b41j_operational_abort.json"
            archive_count=0
            seen_witness=0
            seen_abort=0
            for p in "${staged_paths[@]}"; do
              case "$p" in
                "$witness_path")
                  seen_witness=1
                  ;;
                "$abort_path")
                  seen_abort=1
                  ;;
                "$BASE"/player_role_v2_b41j_operational_abort_attempt_*.json)
                  archive_count=$((archive_count + 1))
                  ;;
                *)
                  echo "B41J_UNEXPECTED_STAGED_PATH $p" >&2
                  exit 1
                  ;;
              esac
            done
            test "$seen_witness" -eq 1
            if [ "$archive_count" -eq 0 ]; then
              test "$seen_abort" -eq 0
              test "${#staged_paths[@]}" -eq 1
            else
              test "$archive_count" -eq 1
              test "$seen_abort" -eq 1
              test "${#staged_paths[@]}" -eq 3
            fi

            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Open Player Role V2 B41J continuation evaluation under frozen amendment'
              git push origin HEAD:main
            fi
          fi

