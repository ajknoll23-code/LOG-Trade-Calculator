              if d.get('result') == pass_result:
                  print('B41J SCIENTIFIC PASS under disclosed B41I identity-source amendment.')
                  print('B42 is still mandatory. Production remains unauthorized.')
                  raise SystemExit(0)
              raise SystemExit(
                  'B41J SCIENTIFIC STOP — durable evidence preserved; do not retune or deploy Role V2.'
              )

          if abort.exists():
              a = json.loads(abort.read_text())
              print(json.dumps(a, indent=2, sort_keys=True))
              raise SystemExit(
                  'B41J operational transport abort — exact frozen evaluator rerun only; no retuning.'
              )

          raise SystemExit(
              'B41J failed without a durable scientific decision or transport abort. '
              'Do not rerun automatically; inspect the exact failure first.'
          )
          PYCLOSE
