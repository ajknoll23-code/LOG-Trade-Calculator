          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BASE"/player_role_v2_b41j_*
          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'B41J evidence already committed identically.'
          else
            git commit \
              -m 'Record Player Role V2 B41J 2025 holdout continuation evidence' \
              -m 'Outcome-blind identity-source amendment preserved; no retuning or production authorization.'
            git push origin HEAD:main
          fi

