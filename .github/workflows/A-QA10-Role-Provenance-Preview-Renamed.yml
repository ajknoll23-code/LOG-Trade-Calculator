name: A-QA10R1 - Slot Role Provenance Patch Preview (Read Only)
run-name: A-QA10R1 source-pinned role provenance preview READ ONLY

'on':
  workflow_dispatch:
    inputs:
      qa09_run_id:
        description: Green A-QA09 run ID
        required: true
        type: string
        default: '41074900358'
      qa08_run_id:
        description: Green A-QA08 run ID
        required: true
        type: string
        default: '41072676062'

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa10r1-role-provenance-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA09_RUN_ID: ${{ inputs.qa09_run_id }}
      QA08_RUN_ID: ${{ inputs.qa08_run_id }}
      QA09_IN: /tmp/a-qa10-qa09
      QA08_IN: /tmp/a-qa10-qa08
      QA10_OUT: /tmp/a-qa10-report
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify green QA09 and QA08 upstream provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$QA09_RUN_ID" =~ ^[0-9]{7,15}$ ]] && [[ "$QA08_RUN_ID" =~ ^[0-9]{7,15}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA09_RUN_ID" > "$RUNNER_TEMP/qa09_run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA08_RUN_ID" > "$RUNNER_TEMP/qa08_run.json"
          python3 - <<'PY_VERIFY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          checks=[
           ('qa09','.github/workflows/A-QA09R1-Candidate-Review.yml','A-QA09 source-backed role intervention preview READ ONLY'),
           ('qa08','.github/workflows/A-QA08R1-Role-Audit.yml','A-QA08 RB DOB parity and source-role audit'),
          ]
          for which,path,title in checks:
           r=json.loads((p/(which+'_run.json')).read_text())
           expected={'conclusion':'success','status':'completed','event':'workflow_dispatch',
                     'path':path,'display_title':title,'head_branch':'main'}
           for k,v in expected.items():assert r.get(k)==v,(which,k,r.get(k),v)
           assert r.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY']
          print('Verified exact green QA09 / QA08 provenance')
          PY_VERIFY
      - name: Retrieve QA09 source-backed triage
        uses: actions/download-artifact@v4
        with:
          name: A-QA09-Fallback-Role-Intervention-Preview
          run-id: ${{ inputs.qa09_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/a-qa10-qa09
      - name: Retrieve QA08 exact FV/DOB evidence
        uses: actions/download-artifact@v4
        with:
          name: A-QA08-DOB-Parity-Role-Evidence
          run-id: ${{ inputs.qa08_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/a-qa10-qa08
      - name: Pin exact original JS source revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PIN'
          import json,os,pathlib,re
          m=json.loads((pathlib.Path(os.environ['QA09_IN'])/'QA09_Manifest.json').read_text())
          assert m.get('status')=='QA09_INTERVENTION_EVIDENCE_PREVIEW_COMPLETE_READ_ONLY'
          assert m.get('source_qa08_run_id')==os.environ['QA08_RUN_ID']
          sha=m.get('source_qa08_sha','')
          assert re.fullmatch('[a-f0-9]{40}',sha)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'qa10_source_sha').write_text(sha)
          PY_PIN
          git fetch --depth=1 origin "$(cat "$RUNNER_TEMP/qa10_source_sha")"
          git checkout --detach "$(cat "$RUNNER_TEMP/qa10_source_sha")"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/qa10_source_sha")"
      - name: Generate provenance-only staged diff and exact cohort review
        shell: bash
        run: |
          set -euo pipefail
          export QA10_STAGE="$RUNNER_TEMP/qa10_staged_preview.html"
          cat > "$RUNNER_TEMP/qa10_engine.py" <<'PY_QA10_ENGINE'
          #!/usr/bin/env python3
          """A-QA10: source-pinned, read-only provenance-only patch candidate.
          
          The staged patch annotates the original role guess with provenance;
          it NEVER changes existing role assignment or the FV model. A strict
          unverified-price hold is discussed but NOT implemented here.
          """
          import collections
          import csv
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          
          qa09_dir=Path(os.environ['QA09_IN'])
          qa08_dir=Path(os.environ['QA08_IN'])
          out=Path(os.environ['QA10_OUT'])
          out.mkdir(parents=True,exist_ok=True)
          
          def stop(msg): raise RuntimeError('QA10 CONTRACT STOP: '+msg)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          
          qa09=load(qa09_dir/'QA09_Manifest.json')
          qa08=load(qa08_dir/'QA08_Manifest.json')
          expected09={
           'status':'QA09_INTERVENTION_EVIDENCE_PREVIEW_COMPLETE_READ_ONLY',
           'cohort':72,'parity_pass':72,'role_price_sensitive':37,
           'review_tiers':{'HIGHEST':5,'HIGH':4,'MEDIUM':28,'LOW':35},
           'new_nfl_roles_assigned':0,'proposed_new_fv_count':0,
           'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repository_mutations':0,
           'source_qa08_run_id':'41072676062',
          }
          for k,v in expected09.items():
           if qa09.get(k)!=v: stop('QA09 manifest changed '+k)
          expected08={
           'status':'QA08_DOB_PARITY_AND_DEPTH_SOURCE_COMPLETE_READ_ONLY',
           'cohort':72,'rb_holds_reconciled':5,'remaining_parity_holds':0,
           'verified_role_sensitive_on_passing_baseline':37,
           'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repository_mutations':0,
          }
          for k,v in expected08.items():
           if qa08.get(k)!=v: stop('QA08 manifest changed '+k)
          if qa09['source_qa08_sha']!=qa08['source_git_sha']:stop('QA09 vs QA08 revision mismatch')
          if sha(qa08_dir/'QA08_Manifest.json')!=qa09['source_qa08_manifest_sha256']:stop('QA08 manifest drift')
          if sha(qa08_dir/'QA08_All72_DOB_And_Depth.csv')!=qa09['source_qa08_csv_sha256']:stop('QA08 CSV drift')
          source_file=Path('index.html')
          if not source_file.is_file():stop('Pinned index.html unavailable')
          if sha(source_file)!=qa09['repo_index_sha256'] and os.environ.get('QA10_LOCAL_FIXTURE')!='1':stop('Pinned index.html source SHA drift')
          
          with (qa09_dir/'QA09_Evidence_Priority_Queue.csv').open(newline='',encoding='utf-8') as f:
           queue=list(csv.DictReader(f))
          with (qa08_dir/'QA08_All72_DOB_And_Depth.csv').open(newline='',encoding='utf-8') as f:
           detail=list(csv.DictReader(f))
          if len(queue)!=72 or len(detail)!=72:stop('72-player cohort missing')
          q09={r['sleeper_id']:r for r in queue}
          q08={r['sleeper_id']:r for r in detail}
          if len(q09)!=72 or len(q08)!=72 or set(q09)!=set(q08):stop('Stable Sleeper identity mismatch')
          review=[]
          for sid,a in q09.items():
           b=q08[sid]
           if a['player']!=b['player'] or a['position']!=b['position'] or a['fallback_role_from_slot']!=b['assigned_role']:
            stop('Identity/role mismatch '+sid)
           if a['published_fv_UNCHANGED']!=b['published_fv'] or b['corrected_parity']!='PARITY_PASS':stop('FV baseline mismatch '+sid)
           if b['current_fv_changed']!='NO' or b['replacement_fv'] or a['proposed_new_fv']:stop('Unexpected price change '+sid)
           if (a['role_price_sensitive']=='TRUE') != (b['role_sensitive_after_dob']=='True'):
            stop('Role-only scenario mismatch '+sid)
           if a['priority'] not in ('HIGHEST','HIGH','MEDIUM','LOW'):stop('Priority value drift')
           review.append({
            'priority':a['priority'],'sleeper_id':sid,'name':a['player'],'position':a['position'],
            'current_FV_UNCHANGED':a['published_fv_UNCHANGED'],
            'fantasy_slot_not_NFL_role':a['fantasy_slot'],
            'legacy_role':a['fallback_role_from_slot'],
            'role_sensitive':a['role_price_sensitive'],
            'nfl_depth_observation':a['nfl_depth_order_from_sleeper'],
            'role_source_after_PROVENANCE_ONLY_PATCH':'FANTASY_SLOT_GUESS_UNVERIFIED',
            'role_and_FV_formula_changed_in_preview':'NO',
            'quote_held_in_this_preview':'NO',
            'needs_independent_role_evidence':'YES',
            'hypothetical_role_spread_NOT_PRICE_TARGET':a['role_only_price_spread_NOT_RECOMMENDED'],
            'proposed_new_fv':'',
            'release_approved':'NO',
           })
          if collections.Counter(r['priority'] for r in review)!=expected09['review_tiers']:stop('Queue distribution drift')
          
          source=source_file.read_text(encoding='utf-8')
          needle='role: existing ? existing.role : slotDefaults[slot],'
          if source.count(needle)!=2:stop('Expected exactly two live role assignment locations')
          for block in ('function mergeLiveRoster(data){','function mergeLeagueRosters(data){',
                        'function playerValue(pos, age, role, name){',
                        "const rm = productionMultiplier(name || '', role);"):
           if block not in source:stop('Expected source code anchor missing: '+block)
          if 'fvRoleProvenance:' in source or 'fvRoleFromFantasySlot:' in source:stop('Staged metadata name collision in existing source')
          # This source-level candidate preserves the ENTIRE existing price mechanism.
          # Its only change is provenance metadata for future release gating.
          # Later pricing changes must be separately approved.
          insert=(
           'role: existing ? existing.role : slotDefaults[slot],\n'
           'fvRoleProvenance: existing\n'
           "  ? (existing.fvRoleProvenance || 'PREEXISTING_CURATED_ROLE')\n"
           "  : 'FANTASY_SLOT_GUESS_UNVERIFIED',\n"
           'fvRoleFromFantasySlot: existing\n'
           '  ? (existing.fvRoleFromFantasySlot || null)\n'
           '  : slot,'
          )
          # match indentation from the source line, rather than changing adjacent code
          raw_lines=source.splitlines(keepends=True)
          patched=[]
          replaced=[]
          for i,line in enumerate(raw_lines):
           if needle in line:
            if line.strip()!=needle:stop('Unsafe inline role assignment at line '+str(i+1))
            lead=line[:len(line)-len(line.lstrip())]
            multiline=insert.split('\n')
            rewritten=(lead+multiline[0]+'\n'+''.join(lead+s+'\n' for s in multiline[1:]))
            patched.append(rewritten)
            replaced.append(i+1)
           else:patched.append(line)
          if len(replaced)!=2:stop('Not exactly 2 source assignment sites')
          staged=''.join(patched)
          if staged.count(needle)!=2 or staged.count("'FANTASY_SLOT_GUESS_UNVERIFIED'")!=2:
           stop('Metadata insertion failed')
          # no replacing/removing existing source lines: only add metadata fields
          if ''.join(s for s in staged.splitlines(keepends=True) if not ('fvRoleProvenance' in s or 'fvRoleFromFantasySlot' in s or 'PREEXISTING_CURATED_ROLE' in s or 'FANTASY_SLOT_GUESS_UNVERIFIED' in s))==source:
           pass  # best-effort; continuation syntax includes punctuation, so diff check below is authoritative
          # Count original role lines and formula anchors unchanged.
          if staged.count('function playerValue(pos, age, role, name){')!=source.count('function playerValue(pos, age, role, name){'):
           stop('Formula definition changed')
          for token in ('return Math.round(100 * pw * am * rm * 55);','const rm = productionMultiplier(name || \'\', role);'):
           if staged.count(token)!=source.count(token):stop('FV formula modified unexpectedly')
          # Staged code lives outside git working tree; no live file is mutated.
          staged_path=Path(os.environ.get('QA10_STAGE',str(out/'QA10_staged_index_test_only.html')))
          staged_path.write_text(staged,encoding='utf-8')
          diff=''.join(difflib.unified_diff(source.splitlines(keepends=True),staged.splitlines(keepends=True),fromfile='a/index.html',tofile='b/index.html',n=4))
          if diff.count('fvRoleProvenance:')!=2 or diff.count('fvRoleFromFantasySlot:')!=2:stop('Unexpected patch diff')
          (out/'QA10_Provenance_Only_Patch.diff').write_text(diff,encoding='utf-8')
          with (out/'QA10_All72_Provenance_Preview.csv').open('w',newline='',encoding='utf-8') as f:
           w=csv.DictWriter(f,fieldnames=list(review[0]));w.writeheader();w.writerows(review)
          
          lines=['# A-QA10 — Proposed Safe Provenance-Only Correction (Read Only)','',
          '**Status: preview only. No FV, FV+, MV, role, or production source changes.**','',
          '## What is now proved','',
          '- QA08 replay reconciles all 72 published valuations; 37 of 72 are causally sensitive to role input.',
          '- QA09 found 9 source-conflict, role-sensitive review cases (5 highest priority, 4 high priority).',
          '- `mergeLiveRoster` and `mergeLeagueRosters` derive new, uncurated player role from a fantasy manager\'s lineup slot.',
          '- The live formula reads that role when production evidence is unavailable or on qualifying 0-game floor-rescue paths.',
          '', '## Staged engineering change','',
          '- **Provenance-only:** record whether a role came from fantasy roster placement rather than an independent NFL source.',
          '- Keep both existing `role:` assignments and the original `playerValue()`/`productionMultiplier()` formulas exactly unchanged.',
          '- Preserve the existing `fvRoleProvenance` field for players encountered by both personal and league syncs, avoiding sync-order erasure.',
          '- The staged `.diff` is a candidate for code review **only**; not committed, deployed, or approved.',
          '- This preview **does not fix inflated FVs**: it makes the root cause observable for later evidence-based correction.',
          '', '## Why no automatic price correction','',
          '- A fantasy bench, NFL depth-chart position, or low one-season projection does not determine dynasty value.',
          '- Simply reclassifying everyone as Depth or assigning a flat reduction would damage rookie/prospect upside.',
          '- Replacing missing-role FV with `null` requires separate UI and trade-math null-safety work, not safe as an unreviewed patch.',
          '- Source-backed new role or pricing must use independent opportunity, multi-year production, prospect and market evidence.',
          '', '## Cohort and priorities','',
          '| Priority | Players | Next step |','|---|---:|---|',
          '| Highest | 5 | Verify independent NFL role, revisit role-derived FV only if supported |',
          '| High | 4 | Check whether fantasy bench role wrongly suppresses role-based FV |',
          '| Medium | 28 | Obtain independent role evidence before intervention |',
          '| Low | 35 | Preserve current FV; review if source or role changes |',
          '', '## Source-level regression test', '',
          '- Exactly **two** uncurated merge assignment sites are extended with metadata; original role assignment remains intact.',
          '- `PLAYER_DB` curated player roles remain untouched; all current prices remain unchanged by the patch design.',
          '- Node preview tests evaluate both new and previously-seen players and exercise slot changes without allowing provenance loss.',
          '- The original checked-out git worktree is confirmed clean by a later workflow step.',
          '', '## Release sequence', '',
          '1. Owner reviews this provenance-only diff and the 9 highest-priority candidates.',
          '2. If approved, a distinct PREVIEW + explicit APPLY can ship only provenance annotations (no price changes).',
          '3. Source-backed role enrichment and a validated numeric FV model are a separate study and release decision.',
          '', '## Artifacts', '',
          '- `QA10_Provenance_Only_Patch.diff`: suggested source metadata patch, not applied.',
          '- `QA10_All72_Provenance_Preview.csv`: evidence queue, all 72 stable IDs.',
          '- `QA10_Manifest.json`: upstream provenance, patched locations, zero-production change contract.',
          '']
          (out/'QA10_Report.md').write_text('\n'.join(lines),encoding='utf-8')
          manifest={
           'status':'QA10_PROVENANCE_ONLY_PATCH_PREVIEW_READ_ONLY',
           'source_qa09_run':'41074900358',
           'source_qa08_run':'41072676062',
           'source_git_sha':qa09['source_qa08_sha'],
           'source_index_sha256':qa09['repo_index_sha256'],
           'qa09_manifest_sha256':sha(qa09_dir/'QA09_Manifest.json'),
           'qa08_manifest_sha256':sha(qa08_dir/'QA08_Manifest.json'),
           'cohort':72,'exact_source_role_assignment_sites':2,
           'role_sensitive_count':37,'priority_role_conflict_count':9,
           'patched_role_assignments':0,'metadata_only':True,
           'source_role_values_unchanged':True,'playerValue_formula_unchanged':True,
           'proposed_new_fv_count':0,'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,
           'repository_mutations':0,'owner_release_authorized':False,
          }
          (out/'QA10_Manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:manifest[k] for k in ('status','cohort','role_sensitive_count','priority_role_conflict_count','repository_mutations')}))
          PY_QA10_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/qa10_engine.py"
          python3 "$RUNNER_TEMP/qa10_engine.py"
      - name: Test both staged source branches with Node.js
        shell: bash
        run: |
          set -euo pipefail
          export QA10_STAGE="$RUNNER_TEMP/qa10_staged_preview.html"
          cat > "$RUNNER_TEMP/qa10_test.js" <<'JS_QA10_TEST'
          'use strict';
          const fs = require('fs');
          const file = process.env.QA10_STAGE;
          const source=fs.readFileSync(file,'utf8');
          const functions=['mergeLiveRoster','mergeLeagueRosters'];
          const roleSourceLine='role: existing ? existing.role : slotDefaults[slot],';
          const defaults={starters:'Starter',bench:'Rotational',taxi:'Speculative',reserve_ir:'Depth'};
          for(const name of functions){
            const start=source.indexOf(`function ${name}(data){`);
            if(start<0) throw new Error('Missing merge function '+name);
            const sample=source.slice(start,start+9000);
            const roleStart=sample.indexOf(roleSourceLine);
            const roleEnd=sample.indexOf('injury: p.injury_status || null,',roleStart);
            if(roleStart<0||roleEnd<=roleStart) throw new Error('Unable to isolate role assignment from '+name);
            const body=sample.slice(roleStart,roleEnd);
            const apply=new Function('existing','slot','slotDefaults',`return ({${body}});`);
            for(const slot of Object.keys(defaults)){
              const actual=apply(null,slot,defaults);
              if(actual.role!==defaults[slot] || actual.fvRoleProvenance!=='FANTASY_SLOT_GUESS_UNVERIFIED' || actual.fvRoleFromFantasySlot!==slot)
                throw new Error('Uncurated provenance behavior changed '+name+'/'+slot);
            }
            const curated=apply({role:'Elite'},'bench',defaults);
            if(curated.role!=='Elite' || curated.fvRoleProvenance!=='PREEXISTING_CURATED_ROLE' || curated.fvRoleFromFantasySlot!==null)
              throw new Error('Curated role was not preserved '+name);
            const first=apply(null,'starters',defaults),second=apply(first,'bench',defaults);
            if(second.role!=='Starter'||second.fvRoleProvenance!=='FANTASY_SLOT_GUESS_UNVERIFIED'||second.fvRoleFromFantasySlot!=='starters')
              throw new Error('Prior provisional lineage lost on another sync '+name);
          }
          console.log('QA10 staged-only JS regression green: both merge functions; all 4 new-player slots; preserved curated roles; preserved provisional lineage.');
          JS_QA10_TEST
          node --check "$RUNNER_TEMP/qa10_test.js"
          node "$RUNNER_TEMP/qa10_test.js"
      - name: Enforce no tracked or untracked source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || { echo 'QA10 source was modified'; exit 1; }
      - name: Upload read-only staged source and review evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA10R1-Provenance-Patch-Preview
          path: /tmp/a-qa10-report/
          retention-days: 30
          if-no-files-found: error
      - name: Publish QA10 design and release holds
        if: always()
        shell: bash
        run: |
          if test -f "$QA10_OUT/QA10_Report.md"; then
            cat "$QA10_OUT/QA10_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA10 stopped before review artifact completion; no production changes.' >> "$GITHUB_STEP_SUMMARY"
          fi
