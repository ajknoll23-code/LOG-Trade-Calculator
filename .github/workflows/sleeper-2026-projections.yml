name: Sleeper 2026 Projections

# Fetches Sleeper's real forward-looking 2026 season projections and
# scores them under this league's exact custom rules. Now also persists
# real per-category raw stat totals (solo tackles, sacks, etc.), not
# just the final blended point total -- added specifically to enable a
# real, direct category-by-category comparison against the new
# FantasyPros API pipeline's raw stats, rather than inferring
# disagreement from already-blended final totals (which conflate
# scoring-category coverage differences with genuine forecast/role
# disagreements in a way that's hard to untangle after the fact).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleeper-2026-projections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Self-test before trusting real output
        run: python3 scripts/sleeper_projections_pipeline.py --selftest

      - name: Run the pipeline
        run: python3 scripts/sleeper_projections_pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sleeper_2026_projections.json scripts/sleeper_2026_raw_categories.json scripts/sleeper_2026_raw_weekly.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run Sleeper 2026 projections pipeline"
          git push
