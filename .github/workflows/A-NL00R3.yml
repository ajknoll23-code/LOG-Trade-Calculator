      - name: Verify live Sleeper newsletter generation without sending
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loog-previews"
          python3 scripts/newsletters/league_newsletter.py --edition pre --week 9 --output-dir "$RUNNER_TEMP/loog-previews"
          python3 scripts/newsletters/league_newsletter.py --edition post --week 8 --output-dir "$RUNNER_TEMP/loog-previews"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'loog-previews'
          found=sorted(root.glob('*.json'))
          assert len(found)==2
          for path in found:
            d=json.loads(path.read_text())
            assert d['league_id']=='1326679131051532288' and d['season']==2026
            assert len(d['games'])==6
            ids=[g[k] for g in d['games'] for k in ('a','b')]
            assert len(set(ids))==12
            if d['edition']=='post':
              assert d['week']==8 and d['median'] is not None
              assert all(g['score_a'] is not None and g['score_b'] is not None for g in d['games'])
            else:assert d['week']==9
            print('PASS LIVE:',d['edition'],'week',d['week'],'12 teams, six matchups, no email sent')
          assert len(list(root.glob('*.html')))==2 and len(list(root.glob('*.txt')))==2
          PY

      - name: Prove only approved package files staged and preserve protected files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/nl00r3_protected.sha"
          python3 - <<'PY'
          import subprocess
          expected={
            '.github/workflows/A-NL01R2.yml',
            'scripts/newsletters/league_newsletter.py',
            'tests/newsletters/test_newsletter.py',
            'docs/LOOG-newsletter-setup.md'
          }
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True)
          changed={x[3:] for x in s.splitlines() if x.strip()}
          assert changed==expected,(changed,expected)
          print('PASS only exact four newsletter package files generated, original repository unchanged')
          PY
          git diff --exit-code -- index.html free-agent-board.html data/ research/ scripts/validation/
          git diff --check

      - name: APPLY source-only commit never containing any workflow file
        if: ${{ inputs.mode == 'APPLY_CONTENT_ONLY' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/nl00r3_initial_head.txt")"
          sha256sum --check "$RUNNER_TEMP/nl00r3_protected.sha"
          git add -- scripts/newsletters/league_newsletter.py tests/newsletters/test_newsletter.py docs/LOOG-newsletter-setup.md
          python3 - <<'PY'
          import subprocess
          expected={'scripts/newsletters/league_newsletter.py','tests/newsletters/test_newsletter.py','docs/LOOG-newsletter-setup.md'}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged==expected, f'Only the three non-workflow files may be pushed: {staged}'
          assert not any(p.startswith('.github/') for p in staged)
          print('PASS staged source only; GitHub workflows permission is not needed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-NL00R3: install validated LOOG newsletter source only'
          git push origin HEAD:main
          echo 'PASS: newsletter engine, tests, and docs pushed; A-NL01R2.yml must be manually uploaded by repo owner.' >> "$GITHUB_STEP_SUMMARY"

      - name: Summary of install state and manual remaining action
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo '## A-NL00R3 newsletter source installation'
            echo "- Mode: $MODE"
            echo '- Newsletter tests: see steps for 12 synthetic checks + two live edition previews'
            echo '- Email: disabled and never invoked by this installer'
            echo '- A-NL01R2.yml: supplied as artifact, **not** pushed by Actions bot'
            if [ "$MODE" = APPLY_CONTENT_ONLY ]; then
              echo '- If the push step succeeded, upload A-NL01R2.yml manually under .github/workflows/'
            else
              echo '- Preview-only: no commit and no push'
            fi
            echo '- Calculator source, FV, MV and frozen studies unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recurring workflow for separate owner upload and live previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-NL00R3-owner-install-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            .github/workflows/A-NL01R2.yml
            ${{ runner.temp }}/loog-previews/
