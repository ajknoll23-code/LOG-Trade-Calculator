name: A-NL00R3 - Newsletter source install without workflow token permission
run-name: A-NL00R3 ${{ inputs.mode }} - exact newsletter source, no workflow push

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY: no commit; APPLY_CONTENT_ONLY: commit exactly script, tests and docs (not workflow files)'
        required: true
        type: choice
        default: PREVIEW_ONLY
        options:
          - PREVIEW_ONLY
          - APPLY_CONTENT_ONLY

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  install:
    name: Verify exact newsletter source and install without workflows permission
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard repository and record protected file hashes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > "$RUNNER_TEMP/nl00r3_initial_head.txt"
          for path in scripts/newsletters/league_newsletter.py tests/newsletters/test_newsletter.py docs/LOOG-newsletter-setup.md .github/workflows/A-NL01R2.yml; do
            test ! -e "$path" || { echo "::error::Already installed: $path; stop and inspect before proceeding"; exit 1; }
          done
          sha256sum \
            index.html free-agent-board.html config.json \
            scripts/validation/repo_regression_checks.py \
            scripts/validation/snapshot_values.py \
            research/model-history/identity/2026-w06-sleeper-registry.json \
            data/league_rosters.json data/free_agents.json \
            data/free_agent_utility_v1.json \
            > "$RUNNER_TEMP/nl00r3_protected.sha"

      - name: Extract pinned newsletter bundle with exact integrity proof
