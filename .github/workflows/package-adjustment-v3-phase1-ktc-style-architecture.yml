name: Package Adjustment V3 - Phase 1 KTC-Style Architecture Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard exact Phase 1 evaluator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase1.py)" = "fccf42fc8fd98aae3bd03653d0ac591e535147ea"

      - name: Guard clean production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(
              Path("research/package-adjustment-production-candidate-v1/live_deployment.json")
              .read_text(encoding="utf-8")
          )
          assert live["status"] == "controlled_live"
          assert live["production_formula_enabled"] is True
          assert live["production_revision"] == "v1.6-v5-size2-composition-overlay"

          closeout = Path(
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md"
          ).read_text(encoding="utf-8")
          assert "research_closed_no_successor_candidate" in closeout
          assert "exact 900-vote dataset is spent development evidence" in closeout

          print("PASS: V1.6 baseline and V2 closeout governance verified.")
          PY

          sha256sum             index.html             research/package-adjustment-production-candidate-v1/live_deployment.json             scripts/validation/package_adjustment_exact_live_oos.py             scripts/validation/package_adjustment_exact_live_oos_v1_6.py             > "${RUNNER_TEMP}/production_before.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Freeze preregistration
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase1.py --preregister

      - name: Evaluator self-test
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase1.py --selftest

      - name: Run Phase 1 architecture audit
        shell: bash
        run: |
          set -euo pipefail
          python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase1.py --evaluate
          cat research/package-adjustment-v3-ktc-style/phase1_architecture_audit.md

      - name: Enforce Phase 1 decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("research/package-adjustment-v3-ktc-style/phase1_architecture_audit.json")
              .read_text(encoding="utf-8")
          )

          assert result["decision"] == "PASS_V3_PHASE1_ARCHITECTURE_REPLACEMENT_JUSTIFIED"
          assert result["production_change_authorized"] is False
          assert result["governance"]["old_900_votes_used_for_fit"] is False
          assert result["governance"]["old_900_votes_used_for_selection"] is False
          assert result["governance"]["old_900_votes_used_for_confirmation"] is False
          assert result["current_v16_ktc_reference_coverage"]["supported_fixture_count"] == 1
          assert result["historical_league_trade_anchors"]["verified_trade_count"] == 8
          assert result["historical_league_trade_anchors"]["current_v16_supported_trade_count"] == 0
          assert result["prototype_power_baseline"]["adjusted_side_accuracy"] == "5/5"

          print("PASS: replacement architecture justified; production remains unchanged.")
          PY

      - name: Prove production byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/production_before.sha256"

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Guard exact research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v3-ktc-style/phase1_preregistration.json",
              "research/package-adjustment-v3-ktc-style/phase1_preregistration.md",
              "research/package-adjustment-v3-ktc-style/phase1_architecture_audit.json",
              "research/package-adjustment-v3-ktc-style/phase1_architecture_audit.md",
              "research/package-adjustment-v3-ktc-style/phase1_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected Phase 1 changed-file set. "
                  f"Expected={sorted(expected)} Actual={sorted(actual)}"
              )

          print("PASS: exactly five generated research artifacts changed.")
          PY

      - name: Commit frozen Phase 1 research
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/package-adjustment-v3-ktc-style/phase1_preregistration.json
          git add research/package-adjustment-v3-ktc-style/phase1_preregistration.md
          git add research/package-adjustment-v3-ktc-style/phase1_architecture_audit.json
          git add research/package-adjustment-v3-ktc-style/phase1_architecture_audit.md
          git add research/package-adjustment-v3-ktc-style/phase1_manifest.json

          git diff --cached --check
          git commit -m "research: package adjustment v3 KTC-style architecture phase 1"
          git push origin HEAD:main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: V3 Phase 1 frozen; production unchanged."
