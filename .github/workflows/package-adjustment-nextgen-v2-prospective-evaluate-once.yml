name: Package Adjustment NextGen V2 Prospective Evaluate Once

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen evidence, preregistration, and one-time evaluation surface
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          DATA="$D/prospective_exact_900_frozen_v1.json"
          FREEZE_MANIFEST="$D/prospective_exact_900_freeze_manifest_v1.json"
          RESULT="$D/prospective_m2b_vs_m0_evaluation_v1.json"
          EVAL_MANIFEST="$D/prospective_m2b_vs_m0_evaluation_manifest_v1.json"
          FITTER="$D/fit_package_adjustment_nextgen_v2.py"
          CANDIDATE_FREEZE="c6eafaac6463e3d5e8cf947ba61d4cc994d59ef4"

          test -z "$(git status --porcelain=v1)"

          # Exact successful freeze commit must be in this history.
          git merge-base --is-ancestor \
            fd0fc86c219d22ae4b389a0ffa6b694006db7940 HEAD

          # Frozen prospective contract inputs remain byte-identical.
          test "$(git hash-object "$D/prospective_time_holdout_preregistration_v1.json")" = \
            "f37b18ec24ae9fa73872069963be7d13f620e80a"
          test "$(git hash-object "$D/package_vote_challenges_prospective_v1.json")" = \
            "b338b18291c5058c5a2b941e1293322e2e70ea8c"
          test "$(git hash-object "$D/prospective_voting_restart_30_daily_v1.json")" = \
            "2b8fbc79d0c0c7da31aa0a2ce2d2c4b44c554e2b"
          test "$(git hash-object "$D/research_candidate_m2b_v1.json")" = \
            "1560124540e1104fdc4f4e9f367d984b46921cb9"

          # Exact green freeze outputs are the only evidence this evaluation may read.
          test "$(git hash-object "$DATA")" = \
            "e0a6e80d98c19b9fa672b863844e4541817dbc88"
          test "$(git hash-object "$FREEZE_MANIFEST")" = \
            "515c86c8270cefe17763865006f46072f061338a"
          test "$(sha256sum "$DATA" | awk '{print $1}')" = \
            "9b00c103efb47dd54976bb0c9d35c8c87cf96ea9c9d7adeac5db15552b2e9c8c"

          # Anchor the scoring math to the fitter frozen with the M2b candidate.
          test "$(git rev-parse "$CANDIDATE_FREEZE:$FITTER")" = \
            "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git show "$CANDIDATE_FREEZE:$FITTER" | sha256sum | awk '{print $1}')" = \
            "b9a74dded87189971703f8b2a63626b3778ceabd0ed6ea258855cc2e071a36f2"

          # This prospective evaluation is explicitly one-time and immutable.
          test ! -e "$RESULT"
          test ! -e "$EVAL_MANIFEST"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          data_path = d / "prospective_exact_900_frozen_v1.json"
          freeze_manifest_path = d / "prospective_exact_900_freeze_manifest_v1.json"
          prereg_path = d / "prospective_time_holdout_preregistration_v1.json"
          amendment_path = d / "prospective_voting_restart_30_daily_v1.json"
          catalog_path = d / "package_vote_challenges_prospective_v1.json"
          candidate_path = d / "research_candidate_m2b_v1.json"

          freeze = json.loads(freeze_manifest_path.read_text(encoding="utf-8"))
          prereg = json.loads(prereg_path.read_text(encoding="utf-8"))
          amendment = json.loads(amendment_path.read_text(encoding="utf-8"))
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))

          assert freeze["status"] == "frozen_exact_900_prospective_evidence_manifest"
          assert freeze["frozen"] is True
          assert freeze["research_only"] is True
          assert freeze["production_change_authorized"] is False
          assert freeze["model_evaluation_performed"] is False
          assert freeze["checkpoint"]["effective_votes"] == 900.0
          assert freeze["checkpoint"]["distinct_voters"] == 30
          assert freeze["checkpoint"]["cells_observed"] == 24
          assert freeze["checkpoint"]["cells_passing_both_gates"] == 24
          assert freeze["checkpoint"]["minimum_cell_effective_votes"] == 30.0
          assert freeze["checkpoint"]["minimum_cell_distinct_voters"] == 19
          assert freeze["dataset"]["raw_ballot_count"] == 960
          assert freeze["dataset"]["effective_vote_count"] == 900.0
          assert freeze["dataset"]["voter_cluster_count"] == 30
          assert freeze["dataset"]["contains_human_choice"] is True
          assert freeze["dataset"]["contains_display_orientation"] is True
          assert freeze["dataset"]["contains_model_predictions"] is False
          assert freeze["dataset"]["contains_model_performance_statistics"] is False
          assert freeze["dataset"]["contains_raw_voter_identifiers"] is False

          actual_data_sha = hashlib.sha256(data_path.read_bytes()).hexdigest()
          assert actual_data_sha == freeze["dataset"]["sha256"]
          assert actual_data_sha == "9b00c103efb47dd54976bb0c9d35c8c87cf96ea9c9d7adeac5db15552b2e9c8c"

          assert prereg["status"] == "frozen_prospective_time_holdout_preregistration"
          assert prereg["frozen"] is True
          assert prereg["candidate_id"] == "pkgnv2-m2b-v1"
          assert prereg["required_sequence_after_this_freeze"][4] == (
              "freeze_exact_mature_prospective_evidence_checkpoint"
          )
          assert prereg["required_sequence_after_this_freeze"][5] == (
              "evaluate_frozen_M2b_vs_frozen_M0_once"
          )

          contract = prereg["prospective_evaluation_contract"]
          assert contract["evaluation_occurs_once_after_maturity"] is True
          assert contract["no_cross_validation"] is True
          assert contract["no_fitting"] is True
          assert contract["no_refitting"] is True
          assert contract["no_parameter_tuning"] is True
          assert contract["primary_metric"] == (
              "equal_cell_macro_mean_log_loss_across_all_24_prospective_cells"
          )
          assert contract["primary_improvement_definition"] == (
              "M0_combined_log_loss_minus_M2b_combined_log_loss"
          )
          assert contract["minimum_combined_log_loss_improvement"] == 0.005
          assert contract["maximum_absolute_regression_each_family"] == 0.005

          boot = contract["bootstrap"]
          assert boot["method"] == "nonparametric_voter_cluster_bootstrap_fixed_predictions"
          assert boot["resampling_unit"] == "voter"
          assert boot["original_capped_voter_weights_frozen_before_resampling"] is True
          assert boot["cluster_multiplicity_scales_frozen_original_ballot_weight"] is True
          assert boot["lifetime_cap_reapplied_inside_draw"] is False
          assert boot["model_parameters_refit_inside_draw"] is False
          assert boot["draw_invalid_if_any_required_prospective_cell_missing"] is True
          assert boot["valid_draws"] == 5000
          assert boot["max_attempts"] == 25000
          assert boot["seed"] == 20260912
          assert boot["minimum_favorable_fraction"] == 0.8
          assert boot["interval_must_be_wholly_above_zero_to_pass"] is False

          rules = amendment["superseding_evidence_rules"]
          assert rules["daily_valid_vote_cap_per_voter"] == 30
          assert rules["effective_lifetime_cap_per_voter"] == 30.0
          assert rules["first_checkpoint_effective_votes"] == 900
          assert rules["stopping_is_coverage_only"] is True

          assert catalog["catalog_id"] == "pkgnv2-prospective-catalog-v1"
          assert len(catalog["challenges"]) == 129
          assert all(c["evaluation_only"] is True for c in catalog["challenges"])
          assert all(c["fit_eligible"] is False for c in catalog["challenges"])
          assert all(c["split"] == "prospective_time_holdout" for c in catalog["challenges"])

          assert candidate["candidate_id"] == "pkgnv2-m2b-v1"
          assert candidate["model"] == "M2b"
          assert candidate["model_name"] == (
              "normalized_convex_monotone_piecewise_linear_spline_equivalent"
          )
          assert candidate["selection"]["selected_model"] == "M2b"
          assert candidate["production_change_authorized"] is False
          assert candidate["automatic_production_promotion_allowed"] is False

          print("PASS: exact frozen evidence and one-time preregistered evaluation contract confirmed.")
          PY

      - name: Verify production remains V1.6 before evaluation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Evaluate frozen M2b versus frozen M0 exactly once
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import bisect
          import hashlib
          import json
          import math
          import os
          import random
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          D = Path("research/package-adjustment-nextgen-v2")
          DATA_PATH = D / "prospective_exact_900_frozen_v1.json"
          FREEZE_MANIFEST_PATH = D / "prospective_exact_900_freeze_manifest_v1.json"
          PREREG_PATH = D / "prospective_time_holdout_preregistration_v1.json"
          AMENDMENT_PATH = D / "prospective_voting_restart_30_daily_v1.json"
          CATALOG_PATH = D / "package_vote_challenges_prospective_v1.json"
          CANDIDATE_PATH = D / "research_candidate_m2b_v1.json"
          RESULT_PATH = D / "prospective_m2b_vs_m0_evaluation_v1.json"
          EVAL_MANIFEST_PATH = D / "prospective_m2b_vs_m0_evaluation_manifest_v1.json"
          REPORT_PATH = Path("/tmp/prospective_m2b_vs_m0_evaluation_report.md")

          DATA_GIT_BLOB_SHA = "e0a6e80d98c19b9fa672b863844e4541817dbc88"
          FREEZE_MANIFEST_GIT_BLOB_SHA = "515c86c8270cefe17763865006f46072f061338a"
          PREREG_GIT_BLOB_SHA = "f37b18ec24ae9fa73872069963be7d13f620e80a"
          CATALOG_GIT_BLOB_SHA = "b338b18291c5058c5a2b941e1293322e2e70ea8c"
          AMENDMENT_GIT_BLOB_SHA = "2b8fbc79d0c0c7da31aa0a2ce2d2c4b44c554e2b"
          CANDIDATE_GIT_BLOB_SHA = "1560124540e1104fdc4f4e9f367d984b46921cb9"
          HISTORICAL_FITTER_GIT_BLOB_SHA = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          CANDIDATE_FREEZE_COMMIT = "c6eafaac6463e3d5e8cf947ba61d4cc994d59ef4"
          FREEZE_COMMIT = "fd0fc86c219d22ae4b389a0ffa6b694006db7940"

          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def canonical_sha256(obj) -> str:
              payload = json.dumps(
                  obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def cell_key(challenge) -> str:
              return "|".join(
                  (
                      str(challenge["family"]),
                      str(challenge["cell_id"]),
                      str(challenge["scale_label"]),
                      str(challenge["split"]),
                  )
              )

          def mean(values):
              values = list(values)
              if not values:
                  raise RuntimeError("cannot average empty sequence")
              return float(sum(values) / len(values))

          def softplus(x: float) -> float:
              if x >= 0:
                  return float(x + math.log1p(math.exp(-x)))
              return float(math.log1p(math.exp(x)))

          def nll_from_eta(eta: float, y: float) -> float:
              return float(softplus(eta) - y * eta)

          def quantile_linear(values, q: float) -> float:
              vals = sorted(float(v) for v in values)
              if not vals:
                  raise RuntimeError("cannot take percentile of empty sequence")
              if len(vals) == 1:
                  return vals[0]
              h = (len(vals) - 1) * float(q)
              lo = int(math.floor(h))
              hi = int(math.ceil(h))
              if lo == hi:
                  return vals[lo]
              frac = h - lo
              return float(vals[lo] * (1.0 - frac) + vals[hi] * frac)

          data = read_json(DATA_PATH)
          freeze = read_json(FREEZE_MANIFEST_PATH)
          prereg = read_json(PREREG_PATH)
          amendment = read_json(AMENDMENT_PATH)
          catalog_doc = read_json(CATALOG_PATH)
          candidate = read_json(CANDIDATE_PATH)

          contract = prereg["prospective_evaluation_contract"]
          boot_cfg = contract["bootstrap"]
          predictors = prereg["frozen_prediction_models"]
          m0_cfg = predictors["M0"]
          m2_cfg = predictors["M2b"]

          # Exact parameter assertions: there is no fitting, recalibration, CV,
          # tuning, model selection, or data-dependent parameter choice here.
          assert m0_cfg["beta"] == 106.96290763085172
          assert m0_cfg["delta_left"] == 0.24949028824223837
          assert m0_cfg["log_beta"] == 4.67248211670666
          assert m0_cfg["score"] == "sum(asset_fv)"
          assert m0_cfg["recalibration_allowed"] is False
          assert m0_cfg["refitting_allowed"] is False

          assert m2_cfg["beta"] == 115.03007979068902
          assert m2_cfg["delta_left"] == 0.24927858289620897
          assert m2_cfg["log_beta"] == 4.745193657558804
          assert m2_cfg["v_ref"] == 5401.0
          assert m2_cfg["inverse_domain_max_normalized"] == 1.259027
          assert m2_cfg["knots_normalized"] == [
              0.0,
              0.30531383077207924,
              0.5173116089613035,
              0.6989446398815035,
              1.0,
              1.259027,
          ]
          assert m2_cfg["slope_increments"] == [
              0.0,
              0.0,
              0.0362911410036889,
              0.0074486570102035975,
          ]
          assert m2_cfg["parameter_vector_x"] == [
              0.0,
              0.0,
              0.0362911410036889,
              0.0074486570102035975,
              4.745193657558804,
              0.24927858289620897,
          ]
          assert m2_cfg["regularization_lambda_at_candidate_freeze"] == 1.0
          assert m2_cfg["parameter_tuning_allowed"] is False
          assert m2_cfg["recalibration_allowed"] is False
          assert m2_cfg["refitting_allowed"] is False

          frozen_candidate_params = candidate["frozen_candidate_parameters"]
          assert frozen_candidate_params["beta"] == m2_cfg["beta"]
          assert frozen_candidate_params["delta_left"] == m2_cfg["delta_left"]
          assert frozen_candidate_params["log_beta"] == m2_cfg["log_beta"]
          assert frozen_candidate_params["slope_increments"] == m2_cfg["slope_increments"]
          assert frozen_candidate_params["parameter_vector_x"] == m2_cfg["parameter_vector_x"]
          assert frozen_candidate_params["regularization_lambda"] == 1.0

          if not math.isclose(math.exp(m0_cfg["log_beta"]), m0_cfg["beta"], rel_tol=1e-14, abs_tol=1e-14):
              raise RuntimeError("M0 beta/log_beta mismatch")
          if not math.isclose(math.exp(m2_cfg["log_beta"]), m2_cfg["beta"], rel_tol=1e-14, abs_tol=1e-14):
              raise RuntimeError("M2b beta/log_beta mismatch")

          V_REF = 5401.0
          assert m2_cfg["v_ref"] == V_REF
          assert contract["choice_probability"] == (
              "logistic(beta*(ScoreA-ScoreB)/5401 + delta_left*I(canonical_A_displayed_left))"
          )

          # Exact historical M2b scoring implementation, transcribed from the
          # fitter frozen at the candidate freeze commit. This is deliberately
          # fixed and contains no optimizer or data-dependent branch.
          class FrozenConvexLinearSpline:
              def __init__(self, cfg):
                  self.v_ref = float(cfg["v_ref"])
                  self.knots = [float(x) for x in cfg["knots_normalized"]]
                  self.domain_max = float(cfg["inverse_domain_max_normalized"])
                  if len(self.knots) != 6:
                      raise RuntimeError("M2b requires exactly six knots")
                  if abs(self.knots[0]) > 1e-15 or abs(self.knots[-2] - 1.0) > 1e-15:
                      raise RuntimeError("M2b knots lost 0/1 identification anchors")
                  if not all(self.knots[i + 1] > self.knots[i] for i in range(5)):
                      raise RuntimeError("M2b knots must be strictly increasing")
                  if abs(self.knots[-1] - self.domain_max) > 1e-12:
                      raise RuntimeError("M2b inverse-domain endpoint mismatch")

              def _shape(self, deltas):
                  d = [float(x) for x in deltas]
                  if len(d) != 4 or any(x < -1e-12 for x in d):
                      raise RuntimeError("M2b requires four nonnegative slope increments")
                  raw_slopes = [1.0]
                  cumulative = 0.0
                  for x in d:
                      cumulative += x
                      raw_slopes.append(1.0 + cumulative)
                  raw_y = [0.0] * len(self.knots)
                  for i, slope in enumerate(raw_slopes):
                      raw_y[i + 1] = (
                          raw_y[i]
                          + slope * (self.knots[i + 1] - self.knots[i])
                      )
                  one_idx = len(self.knots) - 2
                  norm = float(raw_y[one_idx])
                  if not math.isfinite(norm) or norm <= 0:
                      raise RuntimeError("invalid M2b normalization")
                  slopes = [x / norm for x in raw_slopes]
                  y = [x / norm for x in raw_y]
                  return slopes, y

              def g(self, x, deltas):
                  x = float(x)
                  if x < -1e-12 or x > self.domain_max + 1e-12:
                      raise ValueError("normalized asset value outside M2b support")
                  x = min(max(x, 0.0), self.domain_max)
                  slopes, y = self._shape(deltas)
                  idx = bisect.bisect_right(self.knots, x) - 1
                  idx = max(0, min(idx, len(slopes) - 1))
                  return float(y[idx] + slopes[idx] * (x - self.knots[idx]))

              def inverse(self, u, deltas):
                  u = float(u)
                  slopes, y = self._shape(deltas)
                  if u < -1e-12 or u > float(y[-1]) + 1e-12:
                      raise ValueError("M2b utility sum outside preregistered inverse support")
                  u = min(max(u, 0.0), float(y[-1]))
                  idx = bisect.bisect_right(y, u) - 1
                  idx = max(0, min(idx, len(slopes) - 1))
                  return float(self.knots[idx] + (u - y[idx]) / slopes[idx])

              def equivalent_values(self, values, deltas):
                  xs = [float(v) / self.v_ref for v in values]
                  if any(x < 0 or x > self.domain_max + 1e-12 for x in xs):
                      raise ValueError("M2b asset outside preregistered domain")
                  utility = sum(self.g(x, deltas) for x in xs)
                  xeq = self.inverse(utility, deltas)
                  return float(self.v_ref * xeq)

              def score(self, side, deltas):
                  return self.equivalent_values(
                      [float(a["fv"]) for a in side["assets"]],
                      deltas,
                  )

          spline = FrozenConvexLinearSpline(m2_cfg)
          deltas = [float(x) for x in m2_cfg["slope_increments"]]

          challenges = {c["id"]: c for c in catalog_doc["challenges"]}
          if len(challenges) != 129:
              raise RuntimeError(f"expected 129 challenges, found {len(challenges)}")

          cell_meta = {}
          challenge_scores = {}
          for challenge in challenges.values():
              if challenge["evaluation_only"] is not True or challenge["fit_eligible"] is not False:
                  raise RuntimeError(f"prospective challenge not evaluation-only: {challenge['id']}")
              if challenge["split"] != "prospective_time_holdout":
                  raise RuntimeError(f"unexpected prospective split: {challenge['id']}")

              ck = cell_key(challenge)
              meta = {
                  "family": challenge["family"],
                  "cell_id": challenge["cell_id"],
                  "scale_label": challenge["scale_label"],
                  "split": challenge["split"],
              }
              if ck in cell_meta and cell_meta[ck] != meta:
                  raise RuntimeError(f"cell metadata collision: {ck}")
              cell_meta[ck] = meta

              def raw_side_score(side):
                  asset_sum = float(sum(float(a["fv"]) for a in side["assets"]))
                  if not math.isclose(asset_sum, float(side["raw_fv"]), rel_tol=0.0, abs_tol=1e-9):
                      raise RuntimeError(f"raw_fv does not equal asset sum: {challenge['id']}")
                  return asset_sum

              m0_a = raw_side_score(challenge["side_a"])
              m0_b = raw_side_score(challenge["side_b"])
              m2_a = spline.score(challenge["side_a"], deltas)
              m2_b = spline.score(challenge["side_b"], deltas)
              if not all(math.isfinite(x) for x in (m0_a, m0_b, m2_a, m2_b)):
                  raise RuntimeError(f"non-finite frozen score: {challenge['id']}")

              challenge_scores[challenge["id"]] = {
                  "M0_A": m0_a,
                  "M0_B": m0_b,
                  "M2b_A": m2_a,
                  "M2b_B": m2_b,
              }

          if len(cell_meta) != 24:
              raise RuntimeError(f"expected 24 prospective cells, found {len(cell_meta)}")
          required_cells = tuple(sorted(cell_meta))

          ballots = list(data.get("ballots") or [])
          if len(ballots) != 960:
              raise RuntimeError(f"expected 960 frozen raw ballots, found {len(ballots)}")

          cluster_counts = Counter(str(r["voter_cluster"]) for r in ballots)
          if len(cluster_counts) != 30:
              raise RuntimeError(f"expected 30 frozen voter clusters, found {len(cluster_counts)}")

          # Prove the frozen per-ballot weights are exactly the preregistered
          # min(1,30/count) weights before any bootstrap resampling occurs.
          for row in ballots:
              voter = str(row["voter_cluster"])
              expected_weight = min(1.0, 30.0 / cluster_counts[voter])
              actual_weight = float(row["frozen_ballot_weight"])
              if not math.isclose(actual_weight, expected_weight, rel_tol=0.0, abs_tol=1e-12):
                  raise RuntimeError(
                      f"frozen weight mismatch for {voter}: {actual_weight} != {expected_weight}"
                  )

          total_effective = float(sum(float(r["frozen_ballot_weight"]) for r in ballots))
          if not math.isclose(total_effective, 900.0, rel_tol=0.0, abs_tol=1e-9):
              raise RuntimeError(f"frozen effective total drifted: {total_effective}")

          # Precompute fixed predictions/losses exactly once before bootstrap.
          rows = []
          observed_challenges = set()
          coverage_mass = defaultdict(float)
          coverage_voters = defaultdict(set)

          for row in ballots:
              cid = str(row["challenge_id"])
              if cid not in challenges:
                  raise RuntimeError(f"unknown frozen challenge: {cid}")
              challenge = challenges[cid]
              ck = cell_key(challenge)

              for field in ("family", "cell_id", "scale_label", "split"):
                  if row[field] != challenge[field]:
                      raise RuntimeError(f"frozen ballot/catalog {field} mismatch: {cid}")

              choice = str(row["human_choice"]).upper()
              display_left = str(row["display_left"]).upper()
              if choice not in {"A", "B"}:
                  raise RuntimeError(f"invalid frozen human choice: {cid}")
              if display_left not in {"A", "B"}:
                  raise RuntimeError(f"invalid frozen display orientation: {cid}")
              left_bool = bool(row["canonical_a_displayed_left"])
              if left_bool != (display_left == "A"):
                  raise RuntimeError(f"display-left boolean mismatch: {cid}")

              y = 1.0 if choice == "A" else 0.0
              left_indicator = 1.0 if left_bool else 0.0
              scores = challenge_scores[cid]

              eta_m0 = (
                  float(m0_cfg["beta"]) * ((scores["M0_A"] - scores["M0_B"]) / V_REF)
                  + float(m0_cfg["delta_left"]) * left_indicator
              )
              eta_m2 = (
                  float(m2_cfg["beta"]) * ((scores["M2b_A"] - scores["M2b_B"]) / V_REF)
                  + float(m2_cfg["delta_left"]) * left_indicator
              )

              loss_m0 = nll_from_eta(eta_m0, y)
              loss_m2 = nll_from_eta(eta_m2, y)
              if not math.isfinite(loss_m0) or not math.isfinite(loss_m2):
                  raise RuntimeError(f"non-finite ballot loss: {cid}")

              weight = float(row["frozen_ballot_weight"])
              voter = str(row["voter_cluster"])
              rows.append(
                  {
                      "voter": voter,
                      "cell": ck,
                      "weight": weight,
                      "loss_M0": loss_m0,
                      "loss_M2b": loss_m2,
                  }
              )
              observed_challenges.add(cid)
              coverage_mass[ck] += weight
              coverage_voters[ck].add(voter)

          if len(observed_challenges) != 129:
              raise RuntimeError(
                  f"expected all 129 challenges at frozen checkpoint, found {len(observed_challenges)}"
              )
          if set(coverage_mass) != set(required_cells):
              raise RuntimeError("frozen evidence does not cover all 24 required cells")
          if min(coverage_mass.values()) < 30.0 - 1e-9:
              raise RuntimeError("frozen checkpoint no longer reproduces minimum cell effective mass")
          if min(len(coverage_voters[ck]) for ck in required_cells) < 19:
              raise RuntimeError("frozen checkpoint no longer reproduces minimum cell voter coverage")

          # Point estimate: weighted loss inside each cell, then equal-cell macro
          # mean over the preregistered 24 cells. Family metrics are equal-cell
          # macro means within each family.
          cell_acc = {
              ck: {"denom": 0.0, "M0": 0.0, "M2b": 0.0, "raw": 0, "voters": set()}
              for ck in required_cells
          }
          for row in rows:
              acc = cell_acc[row["cell"]]
              w = row["weight"]
              acc["denom"] += w
              acc["M0"] += w * row["loss_M0"]
              acc["M2b"] += w * row["loss_M2b"]
              acc["raw"] += 1
              acc["voters"].add(row["voter"])

          point_cells = []
          cell_losses = {}
          for ck in required_cells:
              acc = cell_acc[ck]
              if acc["denom"] <= 0:
                  raise RuntimeError(f"empty required cell: {ck}")
              m0_loss = float(acc["M0"] / acc["denom"])
              m2_loss = float(acc["M2b"] / acc["denom"])
              improvement = float(m0_loss - m2_loss)
              cell_losses[ck] = {"M0": m0_loss, "M2b": m2_loss}
              point_cells.append(
                  {
                      **cell_meta[ck],
                      "effective_weight": float(acc["denom"]),
                      "raw_ballots": int(acc["raw"]),
                      "distinct_voters": len(acc["voters"]),
                      "M0_log_loss": m0_loss,
                      "M2b_log_loss": m2_loss,
                      "improvement_M0_minus_M2b": improvement,
                  }
              )

          combined_m0 = mean(cell_losses[ck]["M0"] for ck in required_cells)
          combined_m2 = mean(cell_losses[ck]["M2b"] for ck in required_cells)
          combined_improvement = float(combined_m0 - combined_m2)

          family_cells = defaultdict(list)
          for ck in required_cells:
              family_cells[cell_meta[ck]["family"]].append(ck)

          expected_families = {
              "core_concentration_2v2",
              "fragmentation_filler",
              "structural_topology_3v3",
          }
          if set(family_cells) != expected_families:
              raise RuntimeError(f"unexpected prospective family set: {sorted(family_cells)}")

          family_point = {}
          for family in sorted(family_cells):
              cells = sorted(family_cells[family])
              m0_loss = mean(cell_losses[ck]["M0"] for ck in cells)
              m2_loss = mean(cell_losses[ck]["M2b"] for ck in cells)
              improvement = float(m0_loss - m2_loss)
              regression = float(m2_loss - m0_loss)
              family_point[family] = {
                  "cell_count": len(cells),
                  "M0_log_loss": m0_loss,
                  "M2b_log_loss": m2_loss,
                  "improvement_M0_minus_M2b": improvement,
                  "regression_M2b_minus_M0": regression,
              }

          # Preaggregate by voter cluster and cell. Bootstrap draws only change
          # cluster multiplicity; fixed original ballot weights and predictions
          # are never recomputed or capped again.
          cluster_cell = defaultdict(
              lambda: defaultdict(lambda: {"denom": 0.0, "M0": 0.0, "M2b": 0.0})
          )
          for row in rows:
              agg = cluster_cell[row["voter"]][row["cell"]]
              w = row["weight"]
              agg["denom"] += w
              agg["M0"] += w * row["loss_M0"]
              agg["M2b"] += w * row["loss_M2b"]

          voters = sorted(cluster_counts)
          draws_target = int(boot_cfg["valid_draws"])
          max_attempts = int(boot_cfg["max_attempts"])
          seed = int(boot_cfg["seed"])
          rng = random.Random(seed)
          improvements = []
          favorable = 0
          attempts = 0

          while attempts < max_attempts and len(improvements) < draws_target:
              attempts += 1
              picks = [rng.choice(voters) for _ in voters]
              multiplicity = Counter(picks)

              draw_acc = defaultdict(lambda: {"denom": 0.0, "M0": 0.0, "M2b": 0.0})
              for voter, mult in multiplicity.items():
                  if mult <= 0:
                      continue
                  for ck, src in cluster_cell[voter].items():
                      dst = draw_acc[ck]
                      dst["denom"] += float(mult) * src["denom"]
                      dst["M0"] += float(mult) * src["M0"]
                      dst["M2b"] += float(mult) * src["M2b"]

              # Preregistered invalid-draw rule: every required prospective cell
              # must remain represented after voter-cluster resampling.
              if any(draw_acc[ck]["denom"] <= 0 for ck in required_cells):
                  continue

              draw_m0 = mean(
                  draw_acc[ck]["M0"] / draw_acc[ck]["denom"]
                  for ck in required_cells
              )
              draw_m2 = mean(
                  draw_acc[ck]["M2b"] / draw_acc[ck]["denom"]
                  for ck in required_cells
              )
              improvement = float(draw_m0 - draw_m2)
              if not math.isfinite(improvement):
                  continue
              improvements.append(improvement)
              if draw_m2 < draw_m0:
                  favorable += 1

          bootstrap_complete = len(improvements) == draws_target
          if bootstrap_complete:
              favorable_fraction = float(favorable / len(improvements))
              interval = {
                  "p05": quantile_linear(improvements, 0.05),
                  "median": quantile_linear(improvements, 0.50),
                  "p95": quantile_linear(improvements, 0.95),
              }
              bootstrap_result = {
                  "status": "complete",
                  "method": boot_cfg["method"],
                  "rng_engine": "python_random.Random_MT19937",
                  "seed": seed,
                  "valid_draws": len(improvements),
                  "target_valid_draws": draws_target,
                  "attempts": attempts,
                  "max_attempts": max_attempts,
                  "invalid_draws_missing_required_cell": attempts - len(improvements),
                  "favorable_definition": boot_cfg["favorable_definition"],
                  "M2b_favorable_fraction_vs_M0": favorable_fraction,
                  "minimum_favorable_fraction": float(boot_cfg["minimum_favorable_fraction"]),
                  "improvement_M0_minus_M2b_ci90": interval,
                  "percentile_method": "linear_interpolation_h=(n-1)*q",
                  "interval_must_be_wholly_above_zero_to_pass": False,
                  "original_capped_voter_weights_frozen_before_resampling": True,
                  "cluster_multiplicity_scales_frozen_original_ballot_weight": True,
                  "lifetime_cap_reapplied_inside_draw": False,
                  "model_parameters_refit_inside_draw": False,
              }
          else:
              favorable_fraction = None
              bootstrap_result = {
                  "status": "unresolved",
                  "reason": "insufficient_valid_voter_cluster_bootstrap_draws",
                  "method": boot_cfg["method"],
                  "rng_engine": "python_random.Random_MT19937",
                  "seed": seed,
                  "valid_draws": len(improvements),
                  "target_valid_draws": draws_target,
                  "attempts": attempts,
                  "max_attempts": max_attempts,
                  "invalid_draws_missing_required_cell": attempts - len(improvements),
                  "original_capped_voter_weights_frozen_before_resampling": True,
                  "cluster_multiplicity_scales_frozen_original_ballot_weight": True,
                  "lifetime_cap_reapplied_inside_draw": False,
                  "model_parameters_refit_inside_draw": False,
              }

          min_improvement = float(contract["minimum_combined_log_loss_improvement"])
          max_family_regression_allowed = float(contract["maximum_absolute_regression_each_family"])
          min_favorable = float(boot_cfg["minimum_favorable_fraction"])

          combined_gate = combined_improvement + 1e-15 >= min_improvement
          family_gate_by_name = {
              family: metrics["regression_M2b_minus_M0"] <= max_family_regression_allowed + 1e-15
              for family, metrics in family_point.items()
          }
          family_gate = all(family_gate_by_name.values())
          bootstrap_gate = (
              bootstrap_complete
              and favorable_fraction is not None
              and favorable_fraction + 1e-15 >= min_favorable
          )

          if not bootstrap_complete:
              final_status = contract["unresolved_status"]
          elif combined_gate and family_gate and bootstrap_gate:
              final_status = contract["pass_status"]
          else:
              final_status = contract["fail_status"]

          evaluated_at = datetime.now(timezone.utc).isoformat()
          evaluation_contract_sha = canonical_sha256(contract)

          result = {
              "schema_version": 1,
              "evaluation_id": "pkgnv2-prospective-m2b-vs-m0-v1",
              "status": final_status,
              "frozen": True,
              "research_only": True,
              "evaluation_occurs_once": True,
              "evaluated_at_utc": evaluated_at,
              "candidate_id": prereg["candidate_id"],
              "models_compared": ["M0", "M2b"],
              "production_revision_unchanged": "v1.6-v5-size2-composition-overlay",
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "production_candidate_eligible": final_status == contract["pass_status"],
              "source_evidence": {
                  "freeze_commit": FREEZE_COMMIT,
                  "dataset_path": str(DATA_PATH),
                  "dataset_git_blob_sha": DATA_GIT_BLOB_SHA,
                  "dataset_sha256": sha256_file(DATA_PATH),
                  "freeze_manifest_path": str(FREEZE_MANIFEST_PATH),
                  "freeze_manifest_git_blob_sha": FREEZE_MANIFEST_GIT_BLOB_SHA,
                  "raw_ballots": len(ballots),
                  "effective_votes": total_effective,
                  "voter_clusters": len(voters),
                  "distinct_challenges": len(observed_challenges),
                  "required_cells": len(required_cells),
              },
              "frozen_contract": {
                  "preregistration_git_blob_sha": PREREG_GIT_BLOB_SHA,
                  "catalog_git_blob_sha": CATALOG_GIT_BLOB_SHA,
                  "restart_amendment_git_blob_sha": AMENDMENT_GIT_BLOB_SHA,
                  "candidate_git_blob_sha": CANDIDATE_GIT_BLOB_SHA,
                  "evaluation_contract_canonical_sha256": evaluation_contract_sha,
                  "candidate_freeze_commit": CANDIDATE_FREEZE_COMMIT,
                  "historical_scoring_reference_git_blob_sha": HISTORICAL_FITTER_GIT_BLOB_SHA,
                  "choice_probability": contract["choice_probability"],
                  "primary_metric": contract["primary_metric"],
                  "primary_improvement_definition": contract["primary_improvement_definition"],
              },
              "frozen_predictors": {
                  "M0": {
                      "name": m0_cfg["name"],
                      "beta": float(m0_cfg["beta"]),
                      "log_beta": float(m0_cfg["log_beta"]),
                      "delta_left": float(m0_cfg["delta_left"]),
                      "score": m0_cfg["score"],
                  },
                  "M2b": {
                      "name": m2_cfg["name"],
                      "beta": float(m2_cfg["beta"]),
                      "log_beta": float(m2_cfg["log_beta"]),
                      "delta_left": float(m2_cfg["delta_left"]),
                      "v_ref": float(m2_cfg["v_ref"]),
                      "knots_normalized": [float(x) for x in m2_cfg["knots_normalized"]],
                      "slope_increments": [float(x) for x in m2_cfg["slope_increments"]],
                      "inverse_domain_max_normalized": float(m2_cfg["inverse_domain_max_normalized"]),
                  },
                  "fixed_before_bootstrap": True,
                  "refit_or_tuning_performed": False,
              },
              "point_estimates": {
                  "primary": {
                      "M0_combined_log_loss": combined_m0,
                      "M2b_combined_log_loss": combined_m2,
                      "improvement_M0_minus_M2b": combined_improvement,
                      "minimum_required_improvement": min_improvement,
                  },
                  "families": family_point,
                  "cells": point_cells,
              },
              "bootstrap": bootstrap_result,
              "pass_gate": {
                  "all_conditions_required": True,
                  "combined_improvement_at_least_0_005": combined_gate,
                  "no_family_regression_exceeds_0_005": family_gate,
                  "family_gate_by_name": family_gate_by_name,
                  "bootstrap_favorable_fraction_at_least_0_80": bootstrap_gate,
                  "all_conditions_passed": (
                      bootstrap_complete and combined_gate and family_gate and bootstrap_gate
                  ),
              },
              "next_action": (
                  "Separate human-approved production decision required; this evaluation does not modify production."
                  if final_status == contract["pass_status"]
                  else (
                      "Prospective validation is unresolved under the preregistered bootstrap attempt cap; production remains V1.6 and no promotion is authorized."
                      if final_status == contract["unresolved_status"]
                      else "Prospective validation failed; keep M2b research-only and production remains V1.6."
                  )
              ),
          }

          result_text = json.dumps(result, indent=2, sort_keys=True) + "\n"
          RESULT_PATH.write_text(result_text, encoding="utf-8")
          result_sha = hashlib.sha256(result_text.encode("utf-8")).hexdigest()

          eval_manifest = {
              "schema_version": 1,
              "status": "frozen_one_time_prospective_evaluation_manifest",
              "frozen": True,
              "research_only": True,
              "evaluated_at_utc": evaluated_at,
              "evaluation_status": final_status,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "evaluation_source_commit": os.environ.get("BASE_SHA"),
              "source_artifacts": {
                  "dataset": {
                      "path": str(DATA_PATH),
                      "git_blob_sha": DATA_GIT_BLOB_SHA,
                      "sha256": sha256_file(DATA_PATH),
                  },
                  "freeze_manifest": {
                      "path": str(FREEZE_MANIFEST_PATH),
                      "git_blob_sha": FREEZE_MANIFEST_GIT_BLOB_SHA,
                  },
                  "preregistration": {
                      "path": str(PREREG_PATH),
                      "git_blob_sha": PREREG_GIT_BLOB_SHA,
                      "sha256": sha256_file(PREREG_PATH),
                  },
                  "catalog": {
                      "path": str(CATALOG_PATH),
                      "git_blob_sha": CATALOG_GIT_BLOB_SHA,
                      "sha256": sha256_file(CATALOG_PATH),
                  },
                  "restart_amendment": {
                      "path": str(AMENDMENT_PATH),
                      "git_blob_sha": AMENDMENT_GIT_BLOB_SHA,
                      "sha256": sha256_file(AMENDMENT_PATH),
                  },
                  "candidate": {
                      "path": str(CANDIDATE_PATH),
                      "git_blob_sha": CANDIDATE_GIT_BLOB_SHA,
                      "sha256": sha256_file(CANDIDATE_PATH),
                  },
              },
              "implementation": {
                  "historical_scoring_reference_candidate_freeze_commit": CANDIDATE_FREEZE_COMMIT,
                  "historical_scoring_reference_git_blob_sha": HISTORICAL_FITTER_GIT_BLOB_SHA,
                  "M2b_scoring_math": "exact frozen ConvexLinearSpline equivalent-value transform",
                  "bootstrap_rng": "python_random.Random_MT19937",
                  "bootstrap_seed": seed,
                  "bootstrap_valid_draws_target": draws_target,
                  "bootstrap_max_attempts": max_attempts,
                  "percentile_method": "linear_interpolation_h=(n-1)*q",
                  "row_predictions_persisted": False,
                  "model_refit_or_tuning_performed": False,
              },
              "result": {
                  "path": str(RESULT_PATH),
                  "sha256": result_sha,
                  "byte_length": len(result_text.encode("utf-8")),
              },
              "one_time_evaluation_consumed": True,
              "next_action": result["next_action"],
          }
          manifest_text = json.dumps(eval_manifest, indent=2, sort_keys=True) + "\n"
          EVAL_MANIFEST_PATH.write_text(manifest_text, encoding="utf-8")

          def f6(x):
              return f"{float(x):.6f}"

          report = [
              "# NextGen V2 One-Time Prospective M2b vs M0 Evaluation",
              "",
              f"**Status:** `{final_status}`",
              "",
              f"- Evaluated: `{evaluated_at}`",
              f"- Frozen evidence: **{len(ballots)} raw / {f6(total_effective)} effective votes**",
              f"- Voter clusters: **{len(voters)}**",
              f"- Required cells: **{len(required_cells)} / 24**",
              f"- M0 combined log loss: **{f6(combined_m0)}**",
              f"- M2b combined log loss: **{f6(combined_m2)}**",
              f"- Improvement (M0 - M2b): **{f6(combined_improvement)}** (required >= {min_improvement:.3f})",
              "",
              "## Family metrics",
              "",
              "| Family | M0 loss | M2b loss | Improvement | M2b regression | Gate |",
              "|---|---:|---:|---:|---:|:---:|",
          ]
          for family in sorted(family_point):
              m = family_point[family]
              report.append(
                  f"| {family} | {f6(m['M0_log_loss'])} | {f6(m['M2b_log_loss'])} | "
                  f"{f6(m['improvement_M0_minus_M2b'])} | {f6(m['regression_M2b_minus_M0'])} | "
                  f"{'PASS' if family_gate_by_name[family] else 'FAIL'} |"
              )

          report.extend(["", "## Bootstrap", ""])
          if bootstrap_complete:
              ci = bootstrap_result["improvement_M0_minus_M2b_ci90"]
              report.extend(
                  [
                      f"- Valid draws: **{len(improvements)} / {draws_target}** in {attempts} attempts",
                      f"- M2b favorable fraction vs M0: **{favorable_fraction:.4f}** (required >= {min_favorable:.2f})",
                      f"- 90% percentile improvement interval: **[{f6(ci['p05'])}, {f6(ci['p95'])}]**; median **{f6(ci['median'])}**",
                      "- A wholly-positive interval is **not** required by the preregistration.",
                  ]
              )
          else:
              report.extend(
                  [
                      f"- Bootstrap unresolved: **{len(improvements)} / {draws_target}** valid draws after {attempts} attempts",
                      "- No bootstrap pass gate is granted when the preregistered valid-draw target is incomplete.",
                  ]
              )

          report.extend(
              [
                  "",
                  "## Preregistered pass gate",
                  "",
                  f"- Combined improvement >= 0.005: **{'PASS' if combined_gate else 'FAIL'}**",
                  f"- No family regression > 0.005: **{'PASS' if family_gate else 'FAIL'}**",
                  f"- Bootstrap favorable fraction >= 0.80: **{'PASS' if bootstrap_gate else 'FAIL'}**",
                  "",
                  "## Governance",
                  "",
                  result["next_action"],
                  "",
                  "> This workflow performs no fitting, refitting, recalibration, parameter tuning, cross-validation, or automatic production promotion.",
                  "",
              ]
          )
          report_text = "\n".join(report)
          REPORT_PATH.write_text(report_text, encoding="utf-8")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write(report_text)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PROSPECTIVE_EVAL_STATUS={final_status}\n")
              fh.write(f"PROSPECTIVE_RESULT_SHA256={result_sha}\n")
              fh.write(
                  "PROSPECTIVE_EVAL_MANIFEST_SHA256="
                  + hashlib.sha256(manifest_text.encode("utf-8")).hexdigest()
                  + "\n"
              )

          print(f"ONE-TIME PROSPECTIVE EVALUATION STATUS: {final_status}")
          print(f"M0 combined log loss: {combined_m0:.12f}")
          print(f"M2b combined log loss: {combined_m2:.12f}")
          print(f"Improvement M0-M2b: {combined_improvement:.12f}")
          if bootstrap_complete:
              print(f"Bootstrap favorable fraction: {favorable_fraction:.6f}")
          else:
              print(f"Bootstrap unresolved: {len(improvements)}/{draws_target} valid draws")
          print("PASS: evaluation executed exactly once against fixed frozen predictors and evidence.")
          PY

