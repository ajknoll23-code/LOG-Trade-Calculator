name: KTC Vote Aggregation

# Manual fallback for KTC aggregation.
#
# The normal weekly KTC refresh is now included automatically in the Tuesday
# full Scheduled Data Refresh. This workflow remains available for an
# event-driven/manual refresh after a meaningful batch of new votes.
#
# Requires SHEET_CSV_URL in scripts/market/ktc_pipeline.py to remain valid and
# scripts/artifacts/generated/player_positions.json to be available.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shared with all other repository data writers so a manual KTC refresh cannot
# collide with Sleeper Maintenance or Scheduled Data Refresh.
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  run-ktc-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate canonical player-position lookup
        run: python3 scripts/utilities/generate_player_positions.py

      - name: Run KTC pipeline
        run: python3 scripts/market/ktc_pipeline.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/artifacts/generated/ktc_ratings.json scripts/artifacts/generated/player_positions.json
          git diff --staged --quiet || git commit -m "Update KTC vote ratings"
          git push
