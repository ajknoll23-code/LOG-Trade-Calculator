name: KTC Vote Aggregation

# Manual-trigger-only. Go to Actions tab, select "KTC Vote Aggregation" in
# the left sidebar, click "Run workflow".
#
# Requires SHEET_CSV_URL in scripts/market/ktc_pipeline.py to be filled in first
# (see ktc_vote_collector.gs's setup instructions for how to get that URL),
# and scripts/artifacts/generated/player_positions.json to exist for position-level
# aggregation to work (a plain export of PLAYER_DB's key->pos mapping --
# regenerate it whenever PLAYER_DB changes in index.html).
#
# Output: scripts/ktc_ratings.json, committed back to the repo
# automatically. Real, votes-backed Bradley-Terry ratings per player and
# per position, with an explicit flag on which position-pair comparisons
# actually have enough data to trust yet.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ktc-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate canonical player-position lookup
        run: python3 scripts/utilities/generate_player_positions.py

      - name: Run KTC pipeline
        run: python3 scripts/market/ktc_pipeline.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ktc_ratings.json scripts/artifacts/generated/player_positions.json
          git diff --staged --quiet || git commit -m "Update KTC vote ratings"
          git push
