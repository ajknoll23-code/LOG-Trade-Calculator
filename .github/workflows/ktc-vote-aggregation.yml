name: KTC Vote Aggregation

# Manual fallback for KTC aggregation.
#
# This workflow now refreshes:
#   KTC ratings -> voter-balance research -> deployed league Market Value V1
#   -> blended Market Value V2 shadow research.
#
# Market Value V2 remains research-only and does not alter FV, Team Utility,
# the live verdict, or the deployed Market Value V1 consumer.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  run-ktc-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate canonical player-position lookup
        run: python3 scripts/utilities/generate_player_positions.py

      - name: Run KTC pipeline
        run: python3 scripts/market/ktc_pipeline.py

      - name: KTC voter-balance analysis self-test
        run: python3 scripts/market/analyze_ktc_voter_balance.py --selftest

      - name: Build KTC voter-balance research analysis
        run: python3 scripts/market/analyze_ktc_voter_balance.py --write

      - name: Verify KTC voter-balance research analysis
        run: python3 scripts/market/analyze_ktc_voter_balance.py --check

      - name: Market Value V1 self-test
        run: python3 scripts/market/build_market_value.py --selftest

      - name: Rebuild deployed league Market Value V1
        run: python3 scripts/market/build_market_value.py --write

      - name: Market Value V2 shadow self-test
        run: python3 scripts/market/build_market_value_v2_shadow.py --selftest

      - name: Build blended Market Value V2 shadow
        run: python3 scripts/market/build_market_value_v2_shadow.py --write

      - name: Verify Market Value V2 shadow
        run: python3 scripts/market/build_market_value_v2_shadow.py --check

      - name: Commit results back to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add scripts/artifacts/generated/ktc_ratings.json
          git add scripts/artifacts/generated/player_positions.json
          git add scripts/artifacts/generated/ktc_voter_balance_analysis.json
          git add scripts/artifacts/reports/ktc_voter_balance_analysis.md
          git add scripts/artifacts/generated/market_values.json
          git add scripts/artifacts/reports/market_value_report.md
          git add research/market-value-v2/market_value_v2_shadow.json
          git add research/market-value-v2/market_value_v2_shadow.md

          if git diff --staged --quiet; then
            echo "No KTC/Market Value changes."
            exit 0
          fi

          git commit -m "Update KTC and blended market value research"
          git pull --rebase origin main
          git push origin main
