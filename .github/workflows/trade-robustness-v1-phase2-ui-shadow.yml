name: Trade Robustness V1 Phase 2 UI Shadow - EOF Fix V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deploy-trade-robustness-ui-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Verify Phase 1B anchor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/trade-robustness-v1/trade_robustness_v1_phase1b_live_verdict_alignment.json").read_text())
          assert p["decision"] == "PASS_TRADE_ROBUSTNESS_V1_PHASE1B_LIVE_VERDICT_ALIGNMENT"
          assert p["production_change_authorized"] is False
          text = Path("index.html").read_text()
          assert "if(diffPct < 0.07)" in text
          assert "} else if(diffPct < 0.20){" in text
          print("PASS: Phase 1B and live 7%/20% verdict thresholds anchored.")
          PY
          sha256sum             scripts/artifacts/generated/value_uncertainty.json             research/trade-robustness-v1/trade_robustness_v1_phase1b_live_verdict_alignment.json             research/trade-robustness-v1/trade_robustness_v1_phase1b_manifest.json             > "${RUNNER_TEMP}/immutable.sha256"

      - name: Preflight repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Patch display-only UI shadow
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          assert "function tradeRobustnessAssessment(){" not in text
          block = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          marker = "function syncValueUncertaintyFromGitHub(){"
          assert marker in text
          text = text.replace(marker, block + "\n" + marker, 1)
          render_marker = "  renderTradeImpact();\n  renderSensitivity();"
          assert render_marker in text
          text = text.replace(render_marker, "  renderTradeRobustness();\n  renderTradeImpact();\n  renderSensitivity();", 1)
          path.write_text(text, encoding="utf-8")
          print("PASS: display-only Trade Robustness UI shadow patched.")
          PY

      - name: Write and run Phase 2 validator
        shell: bash
        env:
          VALIDATOR_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path("research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_validator.py")
          p.write_bytes(base64.b64decode(os.environ["VALIDATOR_B64"]))
          PY
          python3 research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_validator.py
          cat research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.md

      - name: Verify immutable inputs and exact scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/immutable.sha256"
          python3 - <<'PY'
          import subprocess
          allowed = {
              "index.html",
              "research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_validator.py",
              "research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.json",
              "research/trade-robustness-v1/trade_robustness_v1_phase2_ui_shadow_confirmation.md",
              "research/trade-robustness-v1/trade_robustness_v1_phase2_manifest.json",
          }
          actual = {
              line[3:] for line in subprocess.check_output(
                  ["git","status","--porcelain","--untracked-files=all"], text=True
              ).splitlines() if line.strip()
          }
          unexpected = actual - allowed
          assert not unexpected, f"Unexpected changes: {sorted(unexpected)}"
          print("PASS: Phase 2 deployment scope exact.")
          PY
          git diff --check

      - name: Post-deployment repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Commit Phase 2 UI shadow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research/trade-robustness-v1/
          git diff --cached --check
          git commit -m "Deploy Trade Robustness V1 display-only UI shadow"
          git pull --rebase origin main
          git push origin main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PASS: Trade Robustness V1 Phase 2 deployed cleanly."
