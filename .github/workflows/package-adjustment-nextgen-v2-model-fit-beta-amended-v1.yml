name: Package Adjustment NextGen V2 Model Fit — Beta Amendment V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: package-adjustment-nextgen-v2-model-fit-beta-amended-v1
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact dispatch commit
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          echo "PASS: checkout is pinned to the exact workflow-dispatch commit."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install exact frozen numeric environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy==2.5.3" \
            "scipy==1.18.1" \
            "requests"

          python3 - <<'PY'
          import platform
          import numpy
          import scipy
          import requests
          assert platform.python_version() == "3.13.15"
          assert numpy.__version__ == "2.5.3"
          assert scipy.__version__ == "1.18.1"
          print("PASS: exact frozen numeric environment available.")
          PY

      - name: Guard frozen originals and beta amendment
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          test -z "$(git status --porcelain=v1)"

          # Original frozen research identities.
          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"
          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"
          test "$(git hash-object "$D/voting_sampling_correction_manifest.json")" = "8c181ec2dbcfb4b259de7e839247780e67539b09"

          # Frozen amendment identities.
          test "$(git hash-object "$D/model_fit_preregistration_beta_bound_amendment_v1.json")" = "88a72e5c61abdea61a7b5e3def2838473dd2e5ae"
          test "$(git hash-object "$D/model_fit_preregistration_beta_bound_amendment_v1.md")" = "d7a0c98f46764275dc4cb2c41134d76348ff3c24"
          test "$(git hash-object "$D/model_fit_preregistration_beta_bound_amendment_v1_manifest.json")" = "b4be78011a5a276ca18ab3b234d209cba30e7a61"

          test "$(sha256sum "$D/model_fit_preregistration_beta_bound_amendment_v1.json" | awk '{print $1}')" = "5745ed5e5cb08fb88c8cd2f6833cc7f262bbf56cc6233ebc3c558d2c875976eb"
          test "$(sha256sum "$D/model_fit_preregistration_beta_bound_amendment_v1.md" | awk '{print $1}')" = "b8e930358f03b25851e6fb290db03cf52c5ed9ae4a5a89b57b79eb8636622d76"
          test "$(sha256sum "$D/model_fit_preregistration_beta_bound_amendment_v1_manifest.json" | awk '{print $1}')" = "4c7f78f0c364c7d80278ab68cecb7eebb37397c461210d036831a499b66ff0b0"

          # Corrected sampling and amendment freeze must remain in ancestry.
          git merge-base --is-ancestor 8edba8a6f4e612fa20995a8c62c4be619907abe1 HEAD
          git merge-base --is-ancestor fbf8829a61a087704e271b05dc52f8500aa9f46f HEAD

          python3 - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          cfg = json.loads((d / "model_fit_preregistration.json").read_text())
          manifest = json.loads((d / "model_fit_preregistration_manifest.json").read_text())
          amendment = json.loads(
              (d / "model_fit_preregistration_beta_bound_amendment_v1.json").read_text()
          )
          amendment_manifest = json.loads(
              (d / "model_fit_preregistration_beta_bound_amendment_v1_manifest.json").read_text()
          )

          # Original preregistration remains frozen and untouched.
          assert cfg["status"] == "frozen_model_fit_preregistration"
          assert cfg["frozen"] is True
          assert cfg["research_only"] is True
          assert cfg["production_change_authorized"] is False
          assert cfg["automatic_production_change_allowed"] is False
          assert cfg["optimizer"]["log_beta_bounds"] == [
              -6.907755278982137,
              3.912023005428146,
          ]
          assert manifest["artifacts"]["fitter"]["sha256"] == sha(
              d / "fit_package_adjustment_nextgen_v2.py"
          )
          assert manifest["artifacts"]["config"]["sha256"] == sha(
              d / "model_fit_preregistration.json"
          )

          # Amendment is frozen, narrow, and pre-holdout.
          assert amendment["status"] == "frozen_pre_holdout_optimizer_bound_amendment"
          assert amendment["frozen"] is True
          assert amendment["research_only"] is True
          assert amendment["production_change_authorized"] is False
          assert amendment["automatic_production_change_allowed"] is False
          assert amendment["amendment_id"] == "pkgnv2-beta-bound-v1"
          assert amendment["scope"] == "optimizer_nuisance_beta_upper_bound_only"
          assert amendment["change"]["field"] == "optimizer.log_beta_bounds[1]"
          assert amendment["change"]["old_beta"] == 49.99999999999999
          assert amendment["change"]["new_beta"] == 250.0
          assert abs(amendment["change"]["new_log_beta"] - math.log(250.0)) < 1e-15
          assert amendment["change"]["lower_beta_bound_unchanged"] == cfg["optimizer"]["log_beta_bounds"][0]
          assert amendment["original_fitter"]["code_changed_by_amendment"] is False
          assert amendment["diagnostic_basis"]["structural_holdout_outcomes_evaluated"] is False
          assert amendment["execution_rule"]["next_model_fit_must_use_beta_upper_bound"] == 250.0
          assert amendment["execution_rule"]["next_model_fit_must_use_exact_800_vote_checkpoint"] is True
          assert amendment["execution_rule"]["no_additional_training_tuning_after_structural_holdout_evaluation"] is True

          for key in (
              "catalog",
              "ballot_evidence",
              "maturity_gate",
              "train_holdout_split",
              "model_definitions",
              "M2b_lambda_grid",
              "cross_validation_folds_and_assignment",
              "cross_validation_selection_rule",
              "bootstrap_method_seed_draw_count",
              "model_selection_thresholds",
              "production_formula",
              "simplicity_order",
          ):
              assert amendment["unchanged_contract"][key] is True

          assert amendment_manifest["status"] == "frozen_pre_holdout_optimizer_bound_amendment_manifest"
          assert amendment_manifest["frozen"] is True
          assert amendment_manifest["production_change_authorized"] is False
          assert amendment_manifest["structural_holdout_outcomes_evaluated_before_freeze"] is False
          assert amendment_manifest["artifacts"]["amendment_json"]["sha256"] == sha(
              d / "model_fit_preregistration_beta_bound_amendment_v1.json"
          )
          assert amendment_manifest["artifacts"]["amendment_markdown"]["sha256"] == sha(
              d / "model_fit_preregistration_beta_bound_amendment_v1.md"
          )

          # Exact frozen analytical contract.
          assert cfg["bootstrap"]["valid_draws"] == 500
          assert cfg["bootstrap"]["max_attempts"] == 2500
          assert cfg["bootstrap"]["seed"] == 20260911
          assert cfg["models"]["M2b"]["regularization_lambda_grid"] == [0.0, 0.001, 0.01, 0.1, 1.0]
          assert cfg["cross_validation"]["fold_count"] == 5
          assert cfg["model_selection"]["minimum_absolute_combined_holdout_log_loss_improvement"] == 0.005
          assert cfg["model_selection"]["maximum_absolute_regression_per_structural_holdout_split"] == 0.005
          assert cfg["model_selection"]["minimum_bootstrap_favorable_fraction"] == 0.8

          print("PASS: original preregistration + frozen beta amendment verified.")
          PY

      - name: Refuse a second structural-holdout evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = "ajknoll23-code/LOG-Trade-Calculator"
          workflow = "package-adjustment-nextgen-v2-model-fit-beta-amended-v1.yml"
          current = int(os.environ["CURRENT_RUN_ID"])
          attempt = int(os.environ["CURRENT_RUN_ATTEMPT"])

          # GitHub's "Re-run jobs" keeps the same run_id. Never allow that to
          # become a second holdout evaluation.
          if attempt != 1:
              raise SystemExit(
                  "REFUSE FIT: workflow re-run attempts are prohibited for the "
                  "one-time structural-holdout evaluation."
              )

          raw = subprocess.check_output(
              [
                  "gh", "api",
                  f"repos/{repo}/actions/workflows/{workflow}/runs?per_page=100",
              ],
              text=True,
          )
          runs = json.loads(raw).get("workflow_runs", [])

          for run in runs:
              rid = int(run["id"])
              if rid == current:
                  continue

              # Primary guard: persisted spend-marker artifact.
              artifacts_raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100"],
                  text=True,
              )
              artifacts = json.loads(artifacts_raw).get("artifacts", [])
              if any(
                  a.get("name") == "package-adjustment-nextgen-v2-holdout-spend-marker"
                  for a in artifacts
              ):
                  raise SystemExit(
                      "REFUSE FIT: a prior run already crossed the structural-holdout "
                      f"evaluation boundary (run {rid}). Holdouts are spent."
                  )

              # Secondary guard: retain protection even if an artifact is later
              # deleted/expired but the Actions run history still exists.
              jobs_raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100"],
                  text=True,
              )
              jobs = json.loads(jobs_raw).get("jobs", [])
              for job in jobs:
                  for step in job.get("steps", []):
                      if (
                          step.get("name") == "Persist holdout-spend marker"
                          and step.get("conclusion") == "success"
                      ):
                          raise SystemExit(
                              "REFUSE FIT: prior Actions history proves the holdout-spend "
                              f"marker was persisted in run {rid}. Holdouts are spent."
                          )

          print(
              "PASS: no prior holdout-spend artifact or successful marker step exists; "
              "first evaluation may proceed."
          )
          PY

      - name: Verify production remains unchanged before fit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Run original frozen fitter self-test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py \
            --selftest

      - name: Build exact 800-vote frozen ballot payload
        shell: bash
        run: |
          set -euo pipefail

          OUT="/tmp/pkgnv2-model-fit-beta-amended-v1"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          ROOT = Path.cwd()
          D = ROOT / "research/package-adjustment-nextgen-v2"
          OUT = Path("/tmp/pkgnv2-model-fit-beta-amended-v1")

          SOURCE_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          VOTE_PREFIX = "__" + "pkg" + "nv2__|"
          META_PREFIX = "__" + "pkg" + "nv2_meta__|"
          SCHEMA_MARKER = "__" + "pkg" + "nv2_schema__|" + "1"

          EXPECTED_CANONICAL_BALLOT_SHA256 = (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )
          EXPECTED_RAW_PREFIX_ROWS = 800
          EXPECTED_VALID_BALLOTS = 800
          EXPECTED_DISTINCT_VOTERS = 40

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def parse_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          correction = read_json(D / "voting_sampling_correction_manifest.json")
          cfg = read_json(D / "model_fit_preregistration.json")
          catalog_doc = read_json(D / "package_vote_challenges_nextgen_v2.json")

          cutoff = parse_utc(correction["valid_ballot_start_utc"])
          assert cutoff is not None
          catalog = {c["id"]: c for c in catalog_doc["challenges"]}
          assert len(catalog) == 129

          daily_cap = int(cfg["voter_protections"]["daily_valid_nextgen_vote_cap"])
          lifetime_cap = float(
              cfg["voter_protections"]["primary_evidence_effective_lifetime_cap"]
          )
          assert daily_cap == 20
          assert lifetime_cap == 20.0

          response = requests.get(SOURCE_URL, timeout=30)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          candidates = []
          excluded = Counter()
          raw_prefix_rows = 0
          now = datetime.now(timezone.utc)

          for source_index, row in enumerate(rows):
              keep = str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue

              raw_prefix_rows += 1

              ts = parse_utc(row.get("timestamp"))
              if ts is None:
                  excluded["invalid_timestamp"] += 1
                  continue
              if ts <= cutoff:
                  excluded["at_or_before_corrected_cutoff"] += 1
                  continue
              if ts > now:
                  excluded["future_timestamp"] += 1
                  continue

              parts = keep.split("|")
              if len(parts) != 3 or parts[0] != VOTE_PREFIX[:-1]:
                  excluded["malformed_keep_transport"] += 1
                  continue

              challenge_id = parts[1].strip()
              choice_side = parts[2].strip().upper()
              if choice_side not in {"A", "B"}:
                  excluded["invalid_choice_token"] += 1
                  continue

              meta = str(row.get("trade") or "")
              if not meta.startswith(META_PREFIX):
                  excluded["missing_or_invalid_meta_prefix"] += 1
                  continue

              displayed_left = meta[len(META_PREFIX):].strip().upper()
              if displayed_left not in {"A", "B"}:
                  excluded["invalid_display_side"] += 1
                  continue

              if str(row.get("cut") or "") != SCHEMA_MARKER:
                  excluded["invalid_schema_marker"] += 1
                  continue

              voter_id = str(row.get("voter_roster_id") or "").strip()
              if not voter_id:
                  excluded["missing_voter_id"] += 1
                  continue

              if challenge_id not in catalog:
                  excluded["unknown_challenge_id"] += 1
                  continue

              candidates.append(
                  {
                      "timestamp": ts,
                      "timestamp_iso": ts.isoformat(),
                      "voter_id": voter_id,
                      "challenge_id": challenge_id,
                      "choice_side": choice_side,
                      "displayed_left_side": displayed_left,
                      "source_index": source_index,
                  }
              )

          candidates.sort(
              key=lambda r: (
                  r["timestamp"],
                  r["voter_id"],
                  r["challenge_id"],
                  r["choice_side"],
                  r["displayed_left_side"],
                  r["source_index"],
              )
          )

          daily_counts = Counter()
          valid = []
          for r in candidates:
              key = (r["voter_id"], r["timestamp"].date().isoformat())
              if daily_counts[key] >= daily_cap:
                  excluded["daily_cap_dropped"] += 1
                  continue
              daily_counts[key] += 1
              valid.append(r)

          canonical_rows = [
              {
                  "timestamp": r["timestamp_iso"],
                  "voter_id": r["voter_id"],
                  "challenge_id": r["challenge_id"],
                  "choice_side": r["choice_side"],
                  "displayed_left_side": r["displayed_left_side"],
              }
              for r in valid
          ]
          canonical_payload = json.dumps(
              canonical_rows,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          canonical_sha = hashlib.sha256(canonical_payload).hexdigest()

          if raw_prefix_rows != EXPECTED_RAW_PREFIX_ROWS:
              raise RuntimeError(
                  f"REFUSE FIT: expected exactly {EXPECTED_RAW_PREFIX_ROWS} NextGen rows, "
                  f"found {raw_prefix_rows}. Evidence changed after the frozen checkpoint."
              )
          if len(valid) != EXPECTED_VALID_BALLOTS:
              raise RuntimeError(
                  f"REFUSE FIT: expected exactly {EXPECTED_VALID_BALLOTS} valid ballots, "
                  f"found {len(valid)}."
              )
          if len({r["voter_id"] for r in valid}) != EXPECTED_DISTINCT_VOTERS:
              raise RuntimeError(
                  f"REFUSE FIT: expected exactly {EXPECTED_DISTINCT_VOTERS} voters."
              )
          if excluded:
              raise RuntimeError(
                  "REFUSE FIT: unexpected ballot exclusions at frozen checkpoint: "
                  f"{dict(sorted(excluded.items()))}"
              )
          if canonical_sha != EXPECTED_CANONICAL_BALLOT_SHA256:
              raise RuntimeError(
                  "REFUSE FIT: canonical ballot fingerprint differs from the frozen "
                  f"800-vote checkpoint: {canonical_sha}"
              )

          ballot_payload = {
              "schema_version": 1,
              "released_at_utc": correction["valid_ballot_start_utc"],
              "catalog_payload_sha256": cfg["anchors"][
                  "canonical_challenge_payload_sha256"
              ],
              "maturity_plan_sha256": cfg["anchors"]["maturity_plan_sha256"],
              "ballots": canonical_rows,
          }

          (OUT / "private-ballots.json").write_text(
              json.dumps(ballot_payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          checkpoint = {
              "schema_version": 1,
              "status": "exact_800_vote_checkpoint_locked",
              "raw_nextgen_prefix_rows": raw_prefix_rows,
              "valid_ballots": len(valid),
              "distinct_voters": len({r["voter_id"] for r in valid}),
              "canonical_ballot_sha256": canonical_sha,
              "private_ballot_payload_persisted": False,
              "beta_bound_amendment_id": "pkgnv2-beta-bound-v1",
              "beta_upper_bound": 250.0,
              "production_change_authorized": False,
          }
          (OUT / "checkpoint-lock.json").write_text(
              json.dumps(checkpoint, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              "PASS: exact 800-vote / 40-voter checkpoint locked to "
              + canonical_sha
          )
          PY

      - name: Freeze run provenance before holdout spend
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          D = Path("research/package-adjustment-nextgen-v2")
          OUT = Path("/tmp/pkgnv2-model-fit-beta-amended-v1")

          provenance = {
              "schema_version": 1,
              "status": "frozen_amended_fit_execution_provenance",
              "amendment_commit": "fbf8829a61a087704e271b05dc52f8500aa9f46f",
              "original_fitter": {
                  "git_blob_sha": "1bb4912cf94621bb216a9330caaf6ae00204144a",
                  "sha256": hashlib.sha256(
                      (D / "fit_package_adjustment_nextgen_v2.py").read_bytes()
                  ).hexdigest(),
              },
              "original_config": {
                  "git_blob_sha": "11839895bc255721365c7133792a4b806d825d45",
                  "sha256": hashlib.sha256(
                      (D / "model_fit_preregistration.json").read_bytes()
                  ).hexdigest(),
              },
              "amendment": {
                  "id": "pkgnv2-beta-bound-v1",
                  "json_git_blob_sha": "88a72e5c61abdea61a7b5e3def2838473dd2e5ae",
                  "json_sha256": "5745ed5e5cb08fb88c8cd2f6833cc7f262bbf56cc6233ebc3c558d2c875976eb",
                  "markdown_git_blob_sha": "d7a0c98f46764275dc4cb2c41134d76348ff3c24",
                  "markdown_sha256": "b8e930358f03b25851e6fb290db03cf52c5ed9ae4a5a89b57b79eb8636622d76",
                  "manifest_git_blob_sha": "b4be78011a5a276ca18ab3b234d209cba30e7a61",
                  "manifest_sha256": "4c7f78f0c364c7d80278ab68cecb7eebb37397c461210d036831a499b66ff0b0",
                  "only_runtime_change": "optimizer.log_beta_bounds[1]",
                  "old_beta_upper": 50.0,
                  "new_beta_upper": 250.0,
              },
              "evidence": {
                  "effective_votes": 800,
                  "distinct_voters": 40,
                  "canonical_ballot_sha256": "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72",
              },
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_change_allowed": False,
              "structural_holdouts_spent_before_this_execution": False,
              "no_tuning_after_this_execution": True,
          }

          (OUT / "amendment-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS: amended-fit provenance frozen.")
          PY

      - name: Mark structural holdouts spent before evaluation
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("/tmp/pkgnv2-model-fit-beta-amended-v1")
          marker = {
              "schema_version": 1,
              "status": "structural_holdout_evaluation_boundary_crossed",
              "scientific_effect": (
                  "Scale and topology structural holdouts are considered spent for "
                  "first-wave model selection from this run forward. No further "
                  "training tuning or repeated holdout evaluation is allowed."
              ),
              "run_id": int(os.environ["CURRENT_RUN_ID"]),
              "head_sha": os.environ["CURRENT_HEAD_SHA"],
              "crossed_at_utc": datetime.now(timezone.utc).isoformat(),
              "amendment_commit": "fbf8829a61a087704e271b05dc52f8500aa9f46f",
              "canonical_ballot_sha256": (
                  "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
              ),
              "beta_upper_bound": 250.0,
              "production_change_authorized": False,
          }
          (out / "holdout-spend-marker.json").write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS: structural holdout spend boundary marked.")
          PY

      - name: Persist holdout-spend marker
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-holdout-spend-marker
          path: /tmp/pkgnv2-model-fit-beta-amended-v1/holdout-spend-marker.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute one-time beta-amended research fit
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import copy
          import importlib.util
          import json
          import math
          from pathlib import Path

          ROOT = Path.cwd()
          D = ROOT / "research/package-adjustment-nextgen-v2"
          OUT = Path("/tmp/pkgnv2-model-fit-beta-amended-v1")
          fitter_path = D / "fit_package_adjustment_nextgen_v2.py"

          spec = importlib.util.spec_from_file_location(
              "pkgnv2_frozen_fitter_beta_amended_v1",
              fitter_path,
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          # First validate the untouched original preregistration through the
          # original fitter's own frozen verification function.
          original_cfg, catalog, maturity_plan = mod.verify_preregistration()
          amendment = json.loads(
              (D / "model_fit_preregistration_beta_bound_amendment_v1.json").read_text()
          )

          amended_cfg = copy.deepcopy(original_cfg)
          old_upper = float(amended_cfg["optimizer"]["log_beta_bounds"][1])
          new_upper = float(amendment["change"]["new_log_beta"])
          assert abs(math.exp(old_upper) - 50.0) < 1e-9
          assert abs(math.exp(new_upper) - 250.0) < 1e-9

          amended_cfg["optimizer"]["log_beta_bounds"][1] = new_upper

          # Prove this in-memory object differs from the frozen original at
          # exactly one scalar field.
          restored = copy.deepcopy(amended_cfg)
          restored["optimizer"]["log_beta_bounds"][1] = old_upper
          assert restored == original_cfg

          # run_analysis() remains byte-for-byte original. Only its prereg
          # provider is wrapped to return the frozen one-field amended config.
          def verified_amended_preregistration():
              return amended_cfg, catalog, maturity_plan

          mod.verify_preregistration = verified_amended_preregistration

          payload = mod.read_json(OUT / "private-ballots.json")
          result = mod.run_analysis(payload)

          result["beta_bound_amendment"] = {
              "amendment_id": "pkgnv2-beta-bound-v1",
              "amendment_commit": "fbf8829a61a087704e271b05dc52f8500aa9f46f",
              "changed_field": "optimizer.log_beta_bounds[1]",
              "old_beta_upper": 50.0,
              "new_beta_upper": 250.0,
              "original_fitter_logic_reused": True,
              "all_other_preregistered_fields_unchanged": True,
          }
          result["structural_holdout_evidence_status"] = {
              "spent_by_this_execution": True,
              "repeat_evaluation_allowed": False,
              "further_tuning_allowed": False,
          }

          (OUT / "amended-model-fit-results.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              json.dumps(
                  {
                      "status": result.get("status"),
                      "fit_performed": result.get("fit_performed"),
                      "selection_status": result.get("selection", {}).get("status"),
                      "selected_model": result.get("selection", {}).get("selected_model"),
                      "holdouts_spent": True,
                      "production_change_authorized": False,
                  },
                  indent=2,
              )
          )
          PY

      - name: Validate amended result and build public summary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          out = Path("/tmp/pkgnv2-model-fit-beta-amended-v1")
          result = json.loads((out / "amended-model-fit-results.json").read_text())
          lock = json.loads((out / "checkpoint-lock.json").read_text())
          marker = json.loads((out / "holdout-spend-marker.json").read_text())
          provenance = json.loads((out / "amendment-provenance.json").read_text())

          assert result["research_only"] is True
          assert result["production_change_authorized"] is False
          assert result["automatic_production_change_allowed"] is False
          assert result["maturity"]["mature"] is True
          assert result["maturity"]["valid_effective_votes"] == 800.0
          assert result["maturity"]["distinct_voters"] == 40
          assert all(result["maturity"]["conditions"].values())
          assert result["fit_performed"] is True
          assert result["status"] in {
              "fit_complete_research_only",
              "model_fit_unresolved",
          }
          assert result["beta_bound_amendment"]["new_beta_upper"] == 250.0
          assert result["beta_bound_amendment"]["all_other_preregistered_fields_unchanged"] is True
          assert result["structural_holdout_evidence_status"]["spent_by_this_execution"] is True
          assert result["structural_holdout_evidence_status"]["repeat_evaluation_allowed"] is False
          assert result["structural_holdout_evidence_status"]["further_tuning_allowed"] is False
          assert marker["status"] == "structural_holdout_evaluation_boundary_crossed"
          assert lock["canonical_ballot_sha256"] == (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )
          assert provenance["amendment"]["new_beta_upper"] == 250.0

          # No raw ballot records or voter identifiers may leak to public outputs.
          forbidden = {
              "voter_id",
              "voter_roster_id",
              "ballots",
              "choice_side",
              "displayed_left_side",
          }

          def walk(value):
              if isinstance(value, dict):
                  for k, v in value.items():
                      if k in forbidden:
                          raise AssertionError(f"private field leaked to public result: {k}")
                      walk(v)
              elif isinstance(value, list):
                  for x in value:
                      walk(x)

          walk(result)

          lines = [
              "# Package Adjustment NextGen V2 — Model Fit, Beta Amendment V1",
              "",
              f"**Status:** `{result['status']}`",
              "",
              "## Frozen evidence checkpoint",
              "",
              f"- Effective votes: **{result['maturity']['valid_effective_votes']:.0f}**",
              f"- Distinct voters: **{result['maturity']['distinct_voters']}**",
              f"- Canonical ballot SHA-256: `{lock['canonical_ballot_sha256']}`",
              "- Exact checkpoint: **800 votes / 40 voters**",
              "",
              "## Frozen beta-bound amendment",
              "",
              "- Amendment: **pkgnv2-beta-bound-v1**",
              "- Original beta upper bound: **50**",
              "- Amended beta upper bound: **250**",
              "- All other preregistered model/CV/bootstrap/selection rules: **unchanged**",
              "",
              "## Structural-holdout status",
              "",
              "- Scale holdout: **SPENT by this one-time execution**",
              "- Topology holdout: **SPENT by this one-time execution**",
              "- Repeat structural-holdout evaluation: **not allowed**",
              "- Further tuning against these holdouts: **not allowed**",
              "",
              "## Research safety",
              "",
              "- Research only: **true**",
              "- Production change authorized: **false**",
              "- Automatic production promotion: **false**",
              "- Raw ballots/voter IDs persisted: **false**",
              "",
          ]

          if result["status"] == "fit_complete_research_only":
              point = result["point_estimates"]
              boot = result["bootstrap"]
              sel = result["selection"]

              lines += [
                  "## Point estimates",
                  "",
                  "| Model | Combined holdout log loss | Scale holdout | Topology holdout | Eligible |",
                  "|---|---:|---:|---:|:---:|",
              ]
              for model in ("M0", "M1", "M2a", "M2b"):
                  row = point[model]
                  lines.append(
                      f"| {model} | {row['combined_holdout_log_loss']:.6f} | "
                      f"{row['scale_holdout_log_loss']:.6f} | "
                      f"{row['topology_holdout_log_loss']:.6f} | "
                      f"{'yes' if row['eligible'] else 'no'} |"
                  )

              lines += [
                  "",
                  "## Preregistered bootstrap",
                  "",
                  f"- Status: `{boot['status']}`",
                  f"- Valid voter-cluster draws: **{boot.get('valid_draws', 0)} / "
                  f"{boot.get('target_valid_draws', 500)}**",
              ]

              if boot.get("status") == "complete":
                  ff = boot["favorable_fraction"]
                  lines += [
                      f"- M2a favorable vs M0: **{ff['M2a_vs_M0']:.3f}**",
                      f"- M2b favorable vs M0: **{ff['M2b_vs_M0']:.3f}**",
                      f"- M2b favorable vs M2a: **{ff['M2b_vs_M2a']:.3f}**",
                  ]

              lines += [
                  "",
                  "## Frozen selection rule",
                  "",
                  f"- Selection status: `{sel['status']}`",
                  f"- Research candidate: **{sel.get('selected_model')}**",
                  "- Production promotion authorized: **false**",
                  "",
              ]

              m2a_fit = point["M2a"]["fit"]
              if m2a_fit.get("success"):
                  lines += [
                      "## M2a fitted parameter",
                      "",
                      f"- p: **{m2a_fit['x'][0]:.8f}**",
                      "",
                  ]

              cv = result["M2b_cross_validation"]
              if cv.get("success"):
                  lines += [
                      "## M2b regularization",
                      "",
                      f"- Selected lambda: **{cv['selected_lambda']}**",
                      "",
                  ]
          else:
              lines += [
                  "## Resolution",
                  "",
                  "The frozen amended fitter returned `model_fit_unresolved`. "
                  "The structural holdouts are nevertheless spent by this execution; "
                  "no retuning or repeated evaluation is permitted. No model is selected "
                  "and no production change is authorized.",
                  "",
              ]

          (out / "amended-model-fit-summary.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("PASS: amended public result validated.")
          PY

      - name: Run full repository regressions after fit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains unchanged after fit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove workflow wrote nothing to repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo "PASS: amended model-fit workflow wrote nothing to repository."

      - name: Remove private ballot payload before final artifact upload
        if: always()
        shell: bash
        run: |
          rm -f /tmp/pkgnv2-model-fit-beta-amended-v1/private-ballots.json

      - name: Upload amended research-only model-fit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-model-fit-beta-amended-v1
          path: |
            /tmp/pkgnv2-model-fit-beta-amended-v1/checkpoint-lock.json
            /tmp/pkgnv2-model-fit-beta-amended-v1/amended-model-fit-results.json
            /tmp/pkgnv2-model-fit-beta-amended-v1/amended-model-fit-summary.md
            /tmp/pkgnv2-model-fit-beta-amended-v1/amendment-provenance.json
            /tmp/pkgnv2-model-fit-beta-amended-v1/holdout-spend-marker.json
          if-no-files-found: warn
          retention-days: 90
