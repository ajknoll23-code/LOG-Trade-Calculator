name: Prepare IDP V1 Model-Delta Candidate

# SAFETY CHANGE 2026-08-28:
# The old direct bake was retired after the lineage audit proved that
# prod_mult_pipeline_output.json was not the true pre-V1 production baseline.
# This workflow is now read-only candidate preparation/validation. It NEVER
# edits index.html and NEVER pushes a commit.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prepare-idp-v1-model-delta-candidate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify retired direct-bake formula self-test only
        run: python3 scripts/bake_idp_ensemble_v1.py --selftest

      - name: Regenerate canonical history and V1 candidates
        run: |
          python3 scripts/production_history_component.py --selftest
          python3 scripts/production_history_component.py
          python3 scripts/idp_v1_projection.py
          python3 scripts/idp_v1_production_candidate.py
          python3 scripts/idp_v1_isolated_projection_candidate.py
          python3 scripts/idp_v1_projection_only_candidate.py
          python3 scripts/idp_v1_model_delta_transport_candidate.py
          python3 scripts/validate_idp_v1_candidates.py
          python3 scripts/prepare_idp_v1_bake.py

      - name: Repository regression checks
        run: python3 scripts/repo_regression_checks.py

      - name: Confirm production index was not changed
        run: git diff --exit-code -- index.html
