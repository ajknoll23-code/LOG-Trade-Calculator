name: Bake IDP Ensemble V1

# Production bake of the validated V1 IDP ensemble into
# prod_mult_pipeline_output.json. Does NOT touch index.html directly --
# that update is a separate, deliberate step (surgical line-by-line
# update, reviewed by hand before committing, not automated here on
# purpose given how consequential a live production file change is).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bake-idp-ensemble-v1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test before trusting real output
        run: python3 scripts/bake_idp_ensemble_v1.py --selftest

      - name: Run the bake
        run: python3 scripts/bake_idp_ensemble_v1.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/prod_mult_pipeline_output.json scripts/idp_bake_report.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Bake IDP ensemble V1 into prod_mult_pipeline_output.json"
          git push
