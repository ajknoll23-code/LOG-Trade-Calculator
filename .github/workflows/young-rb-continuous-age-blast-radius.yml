name: Young RB Continuous Age Blast Radius

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run self-test
        run: python3 research/age-calibration/young_rb_continuous_age_blast_radius.py --selftest

      - name: Run blast-radius audit
        run: python3 research/age-calibration/young_rb_continuous_age_blast_radius.py --as-of 2026-09-02

      - name: Show report
        run: cat research/age-calibration/young_rb_continuous_age_blast_radius.md

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/age-calibration/young_rb_continuous_age_blast_radius.json \
            research/age-calibration/young_rb_continuous_age_blast_radius.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Audit continuous RB age blast radius"
          git push
