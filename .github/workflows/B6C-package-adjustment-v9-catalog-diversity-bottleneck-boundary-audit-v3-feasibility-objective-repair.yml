name: B6C Package Adjustment V9 - Catalog Diversity Bottleneck Boundary Audit V3 Feasibility Objective Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b6c-catalog-diversity-bottleneck-boundary-v3
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6C_ANALYSIS_VERSION: "package-adjustment-v9-b6c-catalog-diversity-bottleneck-boundary-v3-feasibility-objective-repair"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" \
            "scipy==1.16.2"

      - name: Guard exact B6B STOP and frozen lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            [".github/workflows/B6B-package-adjustment-v9-five-topology-discordant-catalog-diversity-feasibility-audit.yml"]="d446e21821305fda29b7d89f8b160943675012eb"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json"]="8fb47e28595bed2b667ed8a6e29cbe9d52aaf670"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json"]="81cee2e1242ee05259cb68639efad80c704647f9"
            ["research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_supply_manifest.json"]="a271b9e3cf77e318bc7235be2fa9433b36e3c308"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_breadth_reservoir_audit.json"]="f40408f447e3073be9fe34c0f6692d6b3cb574ea"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_diversity_feasibility.json"]="9a132c41ab2bd3bddc2f7aee557d99cb2c9b2e3d"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_manifest.json"]="04f8c7c2276ab07cc985291a236151646a1aa236"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_preregistered_diversity_protocol.json"]="c9bc86ae7232cdd6db658bf7cd68cb1c04559357"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_report.md"]="b907311eef04b3a4db7304792589a71e991c8e24"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_scope_amendment.json"]="09239d4e792f66d8c5440cf67abd5803ba09c70f"
            ["research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json"]="945bfb8f504bf62cba46464e1940126fd7a528e8"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: durable source drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY1'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          b6=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json')
          b6a=load('research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_supply_manifest.json')
          b6b=load('research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_manifest.json')
          div=load('research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_diversity_feasibility.json')
          breadth=load('research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_breadth_reservoir_audit.json')

          assert b6['decision']=='PASS_PREFERRED_BURDEN_FEASIBLE'
          assert b6a['decision']=='CONDITIONAL_SOURCE_SPACE_FEASIBLE_BUT_FROZEN_SNAPSHOT_SHORTFALL'
          assert b6b['decision']=='STOP_NO_DIVERSE_FIVE_TOPOLOGY_CATALOG_FEASIBLE'
          assert b6b['winning_diversity_tier'] is None
          assert b6b['v9_eligible_topologies']==['2v3','2v4','3v3','3v4','4v4']
          assert b6b['v1_7_only_topologies']==['2v2']
          assert b6b['v9_human_catalog_generated'] is False
          assert b6b['v9_human_outcomes_exist_or_were_read'] is False
          assert b6b['production_change_authorized'] is False
          assert abs(float(b6b['q'])-2.9897594788655337)<1e-15
          assert abs(float(b6b['theta_min'])-.60)<1e-15
          assert abs(float(b6b['fair_band'])-.07)<1e-15
          assert abs(float(b6b['familywise_alpha'])-.05)<1e-15
          assert [x['tier']['id'] for x in div['tiers_attempted']]==['A','B','C']
          assert all(x['feasible'] is False for x in div['tiers_attempted'])
          assert all(int(x['solver_status'])==2 for x in div['tiers_attempted']), 'B6B STOP must be HiGHS-proven infeasible, not timeout/unknown'
          assert breadth['all_five_topologies_have_at_least_120'] is True
          rows={r['topology']:r for r in breadth['rows']}
          assert rows['2v4']['reservoir_count']==127
          assert rows['2v4']['distinct_players_in_reservoir']==60
          assert rows['2v4']['distinct_side_bundles_in_reservoir']==110
          print('PASS: exact B6B scientific STOP, five-topology scope, frozen efficacy thresholds, and no-human-outcomes firewall guarded.')
          PY1

      - name: Run preregistered bottleneck boundary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b6c
          mkdir -p /tmp/package-adjustment-v9-b6c

          cat > /tmp/package-adjustment-v9-b6c/analyze_b6c.py <<'PY2'
          from __future__ import annotations
          import hashlib, json, math, os, textwrap
          from collections import Counter, defaultdict
          from pathlib import Path

          import numpy as np
          from scipy.optimize import Bounds, LinearConstraint, milp
          from scipy.sparse import coo_matrix

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b6c')
          VERSION=os.environ.get('B6C_ANALYSIS_VERSION','package-adjustment-v9-b6c-catalog-diversity-bottleneck-boundary-v3-feasibility-objective-repair')
          B6B=ROOT/'research/package-adjustment-v9/b6b-five-topology-diversity-feasibility'
          B6B_WORKFLOW=ROOT/'.github/workflows/B6B-package-adjustment-v9-five-topology-discordant-catalog-diversity-feasibility-audit.yml'

          TOPOLOGIES=['2v3','2v4','3v3','3v4','4v4']
          TARGET=120
          ORIGINAL_TIER_C={'max_player_per_topology':24,'max_player_global':60,'side_reuse_cap':6}
          MODEST_ENVELOPE={'max_player_per_topology':30,'max_player_global':75,'side_reuse_cap':8}
          AGGRESSIVE_DIAGNOSTIC_ENVELOPE={'max_player_per_topology':36,'max_player_global':90,'side_reuse_cap':10}
          BROAD_SANITY_ENVELOPE={'max_player_per_topology':60,'max_player_global':150,'side_reuse_cap':12}

          def load(p): return json.loads(Path(p).read_text())

          # Freeze the diagnostic interpretation BEFORE replaying the source reservoir.
          protocol={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B6C_DIAGNOSTIC_ONLY',
            'purpose':'Identify the binding catalog-diversity constraint after the preregistered B6B Tier A/B/C failure without changing efficacy thresholds or authorizing human voting.',
            'scope':TOPOLOGIES,
            'target_unique_challenges_per_topology':TARGET,
            'frozen_candidate':'V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q',
            'q':2.9897594788655337,
            'theta_min':0.60,
            'fair_band':0.07,
            'familywise_alpha':0.05,
            'one_vote_per_challenge':True,
            'original_tier_c':ORIGINAL_TIER_C,
            'diagnostic_envelopes':{
              'modest':MODEST_ENVELOPE,
              'aggressive_diagnostic_only':AGGRESSIVE_DIAGNOSTIC_ENVELOPE,
              'broad_sanity_only':BROAD_SANITY_ENVELOPE,
            },
            'modest_envelope_interpretation':'Existence proof only. Even if feasible, it does not amend B6B and does not authorize B7; a separate prospective amendment is required.',
            'decision_rules':{
              'modest_feasible':'DIAGNOSE_MODEST_DIVERSITY_AMENDMENT_FEASIBLE_NOT_AUTHORIZED',
              'modest_fail_aggressive_feasible':'DIAGNOSE_ONLY_AGGRESSIVE_RELAXATION_FEASIBLE_SOURCE_EXPANSION_PREFERRED',
              'aggressive_fail_broad_feasible':'DIAGNOSE_BROAD_RELAXATION_ONLY_SOURCE_EXPANSION_OR_SCOPE_REDUCTION_REQUIRED',
              'broad_fail':'DIAGNOSE_FROZEN_SOURCE_STRUCTURALLY_TOO_CONCENTRATED_FOR_FIVE_TOPOLOGY_CATALOG',
            },
            'solver_certainty_contract':{
              'FEASIBLE':'a finite incumbent satisfies all hard constraints; optimality is unnecessary for an existence proof',
              'PROVEN_INFEASIBLE':'HiGHS status 2 only',
              'UNKNOWN_TIMEOUT':'time/iteration limit reached with no feasible incumbent; never interpreted as infeasible',
              'UNKNOWN_OTHER':'any other unresolved solver state; never interpreted as infeasible',
              'joint_time_limit_seconds':900,
              'local_time_limit_seconds':300,
              'unknown_policy':'raise operational error and commit no scientific conclusion',
            },
            'diagnostics':[
              'reproduce original Tier C joint infeasibility as PROVEN_INFEASIBLE',
              'anonymous direct 2v4 reservoir player-frequency and unavoidable-exposure arithmetic',
              'constraint-family ablations',
              'single-topology Tier C feasibility and bounded local player-cap frontier',
              'drop-one-topology Tier C feasibility',
              'predeclared modest/aggressive/broad joint envelopes',
            ],
            'human_outcomes_read':False,
            'v8_candidate_performance_read':False,
            'future_human_catalog_generated':False,
            'production_change_authorized':False,
            'b7_authorized':False,
          }
          (OUT/'b6c_preregistered_boundary_protocol.json').write_text(json.dumps(protocol,indent=2,sort_keys=True)+'\n')

          b6b=load(B6B/'b6b_manifest.json')
          assert b6b['decision']=='STOP_NO_DIVERSE_FIVE_TOPOLOGY_CATALOG_FEASIBLE'
          assert b6b['winning_diversity_tier'] is None
          assert b6b['v9_human_outcomes_exist_or_were_read'] is False

          # Reuse the exact, guarded B6B source-frame generator instead of rewriting it.
          # Execute only the prefix through construction of reservoirs/indexes/solve_tier;
          # stop before B6B evaluates Tier A/B/C or writes its scientific decision.
          wf=B6B_WORKFLOW.read_text()
          start_marker="          cat > /tmp/package-adjustment-v9-b6b/analyze_b6b.py <<'PY2'\n"
          end_marker="\n          PY2\n"
          assert start_marker in wf, 'B6B embedded engine start marker missing'
          start=wf.index(start_marker)+len(start_marker)
          end=wf.index(end_marker,start)
          b6b_src=textwrap.dedent(wf[start:end])
          split_marker="\nresults=[]; chosen=None; winning=None"
          assert split_marker in b6b_src, 'B6B engine split marker missing'
          prefix=b6b_src.split(split_marker,1)[0]

          replay_dir=OUT/'b6b-replay-transient'
          replay_dir.mkdir(parents=True,exist_ok=True)
          os.environ['B6B_OUT']=str(replay_dir)
          ns={'__name__':'__b6b_replay__'}
          exec(compile(prefix,'<guarded-b6b-prefix>','exec'),ns,ns)

          all_cands=ns['all_cands']
          assert ns['TOPOLOGIES']==TOPOLOGIES
          assert ns['TARGET']==TARGET
          assert len(all_cands)>0

          # Anonymous source-frame checksum only; no identities are persisted.
          frame_counts=Counter(c['topology'] for c in all_cands)
          assert all(frame_counts[t]>=TARGET for t in TOPOLOGIES)

          def solve(scope, per_topology_cap=None, global_cap=None, side_cap=None, time_limit=900):
            scope=list(scope)
            cands=[c for c in all_cands if c['topology'] in scope]
            N=len(cands)
            idx_by_topo=defaultdict(list)
            idx_by_tp=defaultdict(list)
            idx_by_player=defaultdict(list)
            idx_by_tside=defaultdict(list)
            for i,c in enumerate(cands):
              assert len(c['player_keys'])==len(set(c['player_keys'])), 'duplicate player key inside a candidate trade'
              t=c['topology']; idx_by_topo[t].append(i)
              for p in c['player_keys']:
                idx_by_tp[(t,p)].append(i)
                idx_by_player[p].append(i)
              for s in c['side_signatures']:
                idx_by_tside[(t,s)].append(i)

            row=[]; col=[]; data=[]; lb=[]; ub=[]; labels=[]; r=0
            def add(indices,lo,hi,label):
              nonlocal r
              for j in indices:
                row.append(r); col.append(j); data.append(1.0)
              lb.append(float(lo)); ub.append(float(hi)); labels.append(label); r+=1

            for t in scope:
              add(idx_by_topo[t],TARGET,TARGET,f'topology_exact:{t}')
            if per_topology_cap is not None:
              for (t,p),inds in idx_by_tp.items():
                add(inds,-np.inf,per_topology_cap,f'player_topology:{t}:{p}')
            if global_cap is not None:
              for p,inds in idx_by_player.items():
                add(inds,-np.inf,global_cap,f'player_global:{p}')
            if side_cap is not None:
              for (t,s),inds in idx_by_tside.items():
                if len(inds)>side_cap:
                  add(inds,-np.inf,side_cap,f'side_reuse:{t}:{s}')

            A=coo_matrix((data,(row,col)),shape=(r,N)).tocsr()
            lc=LinearConstraint(A,np.asarray(lb),np.asarray(ub))
            # Pure feasibility problem: zero objective makes the first valid incumbent optimal.
            objective=np.zeros(N,dtype=float)
            res=milp(
              objective,
              integrality=np.ones(N,dtype=int),
              bounds=Bounds(np.zeros(N),np.ones(N)),
              constraints=lc,
              options={'time_limit':time_limit,'mip_rel_gap':0.0,'presolve':True},
            )

            has_incumbent=bool(res.x is not None and np.all(np.isfinite(res.x)))
            status=int(res.status)
            if has_incumbent:
              outcome='FEASIBLE'
            elif status==2:
              outcome='PROVEN_INFEASIBLE'
            elif status==1:
              outcome='UNKNOWN_TIMEOUT'
            else:
              outcome='UNKNOWN_OTHER'

            out={
              'scope':scope,
              'per_topology_cap':per_topology_cap,
              'global_cap':global_cap,
              'side_cap':side_cap,
              'outcome':outcome,
              'feasible':outcome=='FEASIBLE',
              'proven_infeasible':outcome=='PROVEN_INFEASIBLE',
              'solver_status':status,
              'solver_message':str(res.message),
              'time_limit_seconds':time_limit,
              'variable_count':N,
              'constraint_count':r,
            }
            if outcome!='FEASIBLE':
              return out

            chosen=[cands[i] for i,x in enumerate(res.x) if x>0.5]
            expected=TARGET*len(scope)
            if len(chosen)!=expected:
              raise RuntimeError(f'B6C solver selected {len(chosen)} != {expected}')

            per_topo=Counter(c['topology'] for c in chosen)
            assert all(per_topo[t]==TARGET for t in scope)
            topo_pc=defaultdict(Counter); global_pc=Counter(); side_pc=defaultdict(Counter)
            for c in chosen:
              t=c['topology']
              for p in c['player_keys']:
                topo_pc[t][p]+=1; global_pc[p]+=1
              for s in c['side_signatures']:
                side_pc[t][s]+=1

            if per_topology_cap is not None:
              assert max(max(v.values()) for v in topo_pc.values())<=per_topology_cap
            if global_cap is not None:
              assert max(global_pc.values())<=global_cap
            if side_cap is not None:
              assert max(max(v.values()) for v in side_pc.values())<=side_cap

            out['witness_summary']={
              'selected_total':len(chosen),
              'distinct_players_global':len(global_pc),
              'max_player_appearances_global':max(global_pc.values()),
              'topologies':{
                t:{
                  'distinct_players':len(topo_pc[t]),
                  'max_player_appearances':max(topo_pc[t].values()),
                  'distinct_side_bundles':len(side_pc[t]),
                  'max_exact_side_bundle_reuse':max(side_pc[t].values()),
                } for t in scope
              },
              'challenge_identities_written_durably':False,
            }
            return out

          def require_known(label, result):
            if result['outcome'] in {'UNKNOWN_TIMEOUT','UNKNOWN_OTHER'}:
              raise RuntimeError(
                f"{label} unresolved: outcome={result['outcome']} "
                f"status={result['solver_status']} message={result['solver_message']}"
              )
            return result

          def solve_joint(label, scope, per_topology_cap=None, global_cap=None, side_cap=None):
            return require_known(label, solve(scope,per_topology_cap,global_cap,side_cap,time_limit=900))

          def solve_local(label, scope, per_topology_cap=None, global_cap=None, side_cap=None):
            return require_known(label, solve(scope,per_topology_cap,global_cap,side_cap,time_limit=300))

          # Direct anonymous 2v4 concentration arithmetic, independent of MILP status.
          r24=[c for c in all_cands if c['topology']=='2v4']
          pc24=Counter(p for c in r24 for p in c['player_keys'])
          side24=Counter(s for c in r24 for s in c['side_signatures'])
          drop_capacity=len(r24)-TARGET
          sorted_player_counts=sorted(pc24.values(),reverse=True)
          max_player_in_reservoir=max(sorted_player_counts)
          unavoidable_from_most_frequent=max(0,max_player_in_reservoir-drop_capacity)
          direct_2v4={
            'reservoir_count':len(r24),
            'target':TARGET,
            'trades_that_may_be_dropped':drop_capacity,
            'distinct_players':len(pc24),
            'distinct_side_bundles':len(side24),
            'max_player_appearances_in_reservoir':max_player_in_reservoir,
            'unavoidable_appearances_of_most_frequent_player_in_any_120_subset_lower_bound':unavoidable_from_most_frequent,
            'top_10_player_appearance_counts_anonymous':sorted_player_counts[:10],
            'players_above_12_in_full_reservoir':sum(v>12 for v in pc24.values()),
            'players_above_18_in_full_reservoir':sum(v>18 for v in pc24.values()),
            'players_above_24_in_full_reservoir':sum(v>24 for v in pc24.values()),
            'players_above_30_in_full_reservoir':sum(v>30 for v in pc24.values()),
            'players_that_force_tier_c_cap24_violation_in_any_120_subset':sum(max(0,v-drop_capacity)>24 for v in pc24.values()),
            'max_side_bundle_appearances_in_reservoir':max(side24.values()),
            'identities_persisted':False,
          }

          # 1) Reproduce B6B Tier C failure using the exact replayed frame.
          baseline=solve_joint('baseline_tier_c',TOPOLOGIES,24,60,6)
          if baseline['outcome']!='PROVEN_INFEASIBLE':
            raise RuntimeError(f"B6C baseline must reproduce B6B Tier C as PROVEN_INFEASIBLE; got {baseline['outcome']}")

          # 2) Constraint-family ablations.
          ablations={
            'counts_only':solve_joint('ablation_counts_only',TOPOLOGIES,None,None,None),
            'side_only':solve_joint('ablation_side_only',TOPOLOGIES,None,None,6),
            'player_caps_only_tier_c':solve_joint('ablation_player_caps_only',TOPOLOGIES,24,60,None),
            'tier_c_without_global_cap':solve_joint('ablation_without_global_cap',TOPOLOGIES,24,None,6),
            'tier_c_without_per_topology_cap':solve_joint('ablation_without_per_topology_cap',TOPOLOGIES,None,60,6),
          }

          # 3) Local topology diagnosis under Tier C and a bounded player-cap frontier.
          local=[]
          local_cap_grid=[24,30,36,48,60,120]
          for t in TOPOLOGIES:
            base=solve_local(f'local_{t}_cap24',[t],24,None,6)
            first_cap=24 if base['feasible'] else None
            frontier=[{'cap':24,'feasible':base['feasible'],'outcome':base['outcome'],'solver_status':base['solver_status']}]
            if not base['feasible']:
              for cap in local_cap_grid[1:]:
                z=solve_local(f'local_{t}_cap{cap}',[t],cap,None,6)
                frontier.append({'cap':cap,'feasible':z['feasible'],'outcome':z['outcome'],'solver_status':z['solver_status']})
                if z['feasible']:
                  first_cap=cap
                  break
            local.append({
              'topology':t,
              'tier_c_local_feasible':base['feasible'],
              'tier_c_local_outcome':base['outcome'],
              'tier_c_local_solver_status':base['solver_status'],
              'first_feasible_player_cap_on_predeclared_grid_with_side_cap_6':first_cap,
              'frontier':frontier,
            })

          # 4) Drop-one-topology diagnostic under original absolute Tier C caps.
          drop_one=[]
          for dropped in TOPOLOGIES:
            scope=[t for t in TOPOLOGIES if t!=dropped]
            z=solve_joint(f'drop_one_{dropped}',scope,24,60,6)
            drop_one.append({'dropped_topology':dropped,'remaining_scope':scope,'feasible':z['feasible'],'outcome':z['outcome'],'solver_status':z['solver_status']})

          # 5) Prospectively bounded envelopes. These are diagnostics only.
          modest=solve_joint('envelope_modest',TOPOLOGIES,30,75,8)
          aggressive=solve_joint('envelope_aggressive',TOPOLOGIES,36,90,10)
          broad=solve_joint('envelope_broad',TOPOLOGIES,60,150,12)

          if modest['feasible']:
            decision='DIAGNOSE_MODEST_DIVERSITY_AMENDMENT_FEASIBLE_NOT_AUTHORIZED'
            next_recommendation='Diagnostic only: use the full B6C constraint/topology evidence to preregister B6D separately. Do not generate human challenges or run B7 yet.'
          elif aggressive['feasible']:
            decision='DIAGNOSE_ONLY_AGGRESSIVE_RELAXATION_FEASIBLE_SOURCE_EXPANSION_PREFERRED'
            next_recommendation='Prefer a candidate-blind source expansion over accepting >25% within-topology / >12.5% global player concentration. Keep B7 blocked.'
          elif broad['feasible']:
            decision='DIAGNOSE_BROAD_RELAXATION_ONLY_SOURCE_EXPANSION_OR_SCOPE_REDUCTION_REQUIRED'
            next_recommendation='Do not relax diversity this far. Preregister candidate-blind source expansion or an explicit additional topology-scope reduction before B7.'
          else:
            decision='DIAGNOSE_FROZEN_SOURCE_STRUCTURALLY_TOO_CONCENTRATED_FOR_FIVE_TOPOLOGY_CATALOG'
            next_recommendation='The frozen source cannot support a defensible five-topology catalog even under the broad sanity envelope. Source expansion or further topology-scope reduction is required before B7.'

          boundary={
            'analysis_version':VERSION,
            'status':'PASS_B6C_DIAGNOSTIC_EXECUTION_ONLY',
            'scientific_decision':decision,
            'baseline_tier_c_reproduced_as_proven_infeasible':baseline['outcome']=='PROVEN_INFEASIBLE',
            'source_frame_counts':dict(frame_counts),
            'direct_2v4_concentration_diagnostic':direct_2v4,
            'constraint_ablations':ablations,
            'local_topology_diagnostics':local,
