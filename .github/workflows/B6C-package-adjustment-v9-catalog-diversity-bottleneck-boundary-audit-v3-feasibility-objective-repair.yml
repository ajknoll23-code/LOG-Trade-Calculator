      - name: Validate B6C firewall and durable outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import json
          from pathlib import Path
          out=Path('/tmp/package-adjustment-v9-b6c')
          load=lambda p: json.loads((out/p).read_text())

          protocol=load('b6c_preregistered_boundary_protocol.json')
          result=load('b6c_constraint_boundary_results.json')
          manifest=load('b6c_manifest.json')
          hashes=load('b6c_output_hashes.json')

          allowed={
            'DIAGNOSE_MODEST_DIVERSITY_AMENDMENT_FEASIBLE_NOT_AUTHORIZED',
            'DIAGNOSE_ONLY_AGGRESSIVE_RELAXATION_FEASIBLE_SOURCE_EXPANSION_PREFERRED',
            'DIAGNOSE_BROAD_RELAXATION_ONLY_SOURCE_EXPANSION_OR_SCOPE_REDUCTION_REQUIRED',
            'DIAGNOSE_FROZEN_SOURCE_STRUCTURALLY_TOO_CONCENTRATED_FOR_FIVE_TOPOLOGY_CATALOG',
          }
          assert protocol['status']=='PREREGISTERED_B6C_DIAGNOSTIC_ONLY'
          assert manifest['status']=='PASS_B6C_CATALOG_DIVERSITY_BOTTLENECK_BOUNDARY_AUDIT_ONLY'
          assert manifest['decision'] in allowed
          assert result['scientific_decision']==manifest['decision']
          assert result['baseline_tier_c_reproduced_as_proven_infeasible'] is True
          assert manifest['b6b_stop_preserved'] is True
          assert manifest['candidate_formula_unchanged'] is True
          assert abs(float(manifest['q'])-2.9897594788655337)<1e-15
          assert abs(float(manifest['theta_min'])-.60)<1e-15
          assert abs(float(manifest['fair_band'])-.07)<1e-15
          assert abs(float(manifest['familywise_alpha'])-.05)<1e-15
          assert manifest['human_catalog_generated'] is False
          assert manifest['human_outcomes_exist_or_were_read'] is False
          assert manifest['production_change_authorized'] is False
          assert manifest['b7_authorized'] is False
          assert len(result['local_topology_diagnostics'])==5
          assert len(result['drop_one_topology_diagnostics'])==5
          assert result['direct_2v4_concentration_diagnostic']['identities_persisted'] is False
          for z in result['constraint_ablations'].values():
            assert z['outcome'] in {'FEASIBLE','PROVEN_INFEASIBLE'}
          for z in result['envelopes'].values():
            assert z['outcome'] in {'FEASIBLE','PROVEN_INFEASIBLE'}

          for name,digest in hashes['sha256'].items():
            import hashlib
            actual=hashlib.sha256((out/name).read_bytes()).hexdigest()
            assert actual==digest, (name,actual,digest)

          forbidden_fragments=['trade_signature','trade_hash','player_keys','side_signatures']
          for p in [
            out/'b6c_preregistered_boundary_protocol.json',
            out/'b6c_constraint_boundary_results.json',
            out/'b6c_manifest.json',
            out/'b6c_report.md',
            out/'b6c_output_hashes.json',
          ]:
            txt=p.read_text()
            for frag in forbidden_fragments:
              assert frag not in txt, (p,frag)

          assert not (out/'b6b-replay-transient').exists()
          print('PASS: B6C diagnostic outputs are anonymous, B6B STOP is preserved, no human catalog exists, and B7 remains blocked.')
          PY3

