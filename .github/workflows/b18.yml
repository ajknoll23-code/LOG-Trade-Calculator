# PREFLIGHTED: B18_EXPLORATORY_PRODUCT_VALIDATION_PREREG_AND_SYNTHETIC_POWER
name: B18 Draft Capital Outlook V1 - Exploratory Product Validation Preregistration and Synthetic Power

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b18_exploratory_power:
    name: Freeze exploratory protocol and run synthetic-only power calibration
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen simulation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" \
            "scipy==1.17.0" \
            "requests==2.32.5"

      - name: Guard B17E n11 admission and unopened capital association
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          s=json.loads((D/"b17e/b17e_summary.json").read_text())
          m=json.loads((D/"b17e/b17e_manifest.json").read_text())

          assert s["decision"]=="PASS_B17E_2013_JOINT_FEASIBILITY_ADMIT_2013_AUTHORIZE_B18_EXPLORATORY_POWER_PREREGISTRATION_N11"
          assert s["joint_feasibility_pass"] is True
          assert s["newly_admitted_class_years"]==[2013]
          assert s["exploratory_historical_class_years"]==list(range(2013,2024))
          assert s["exploratory_historical_class_n"]==11
          assert s["b18_exploratory_power_preregistration_authorized"] is True

          assert s["capital_values_computed"] is False
          assert s["predictor_target_correlation_computed"] is False
          assert s["model_fit_performed"] is False
          assert s["c1_executed"] is False
          assert s["2027_class_scored"] is False
          assert s["production_change_authorized"] is False

          assert m["decision"]==s["decision"]
          assert m["joint_feasibility_pass"] is True
          assert m["exploratory_historical_class_n"]==11
          assert m["capital_values_computed"] is False
          assert m["predictor_target_correlation_computed"] is False
          assert m["production_change_authorized"] is False

          # Only summary/manifest are read in this guard. No composition artifact is
          # opened by B18's power stage.
          for name in ["b17e_summary.json","b17e_manifest.json"]:
              p=D/"b17e"/name
              assert p.is_file()
              print(name, hashlib.sha256(p.read_bytes()).hexdigest())

          print("PASS: B17E authorizes B18 exploratory power at n=11.")
          print("PASS: historical capital association remains unopened.")
          PY

      - name: Guard prior B13 residual closeout and B17D firewall disclosure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          b17d=json.loads((D/"b17d/b17d_summary.json").read_text())
          fw=json.loads((D/"b17d/b17d_firewall_and_exposure_ledger.json").read_text())

          assert b17d["decision"]=="COMPLETE_B17D_SOURCE_ONLY_AUDIT_NO_C1_AUTHORITY"
          assert b17d["firewall_disclosure_recorded"] is True
          assert fw["disclosure"]["historical_2014_2023_is_not_pristine_under_strict_marginal_blinding"] is True
          assert fw["disclosure"]["predictor_target_association_remains_unopened"] is True

          # This stage does not reinterpret or reopen the failed B13 residual channel.
          print("PASS: B17D firewall disclosure preserved.")
          print("PASS: Draft Capital Outlook remains a separate construct from frozen B13 residual work.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B18 exploratory objective, target, gates, and Rich Hill table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b18
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b18")

          # Canonical Rich Hill modern chart values, picks 1-60.
          # Provenance is frozen before any historical capital scalar is computed.
          values=[
              1000,717,514,491,468,446,426,406,387,369,358,347,336,325,315,305,
              296,287,278,269,261,253,245,237,230,223,216,209,202,196,190,184,
              180,175,170,166,162,157,153,149,146,142,138,135,131,128,124,121,
              118,115,112,109,106,104,101,98,96,93,91,88
          ]
          assert len(values)==60
          assert values[0]==1000 and values[32]==180 and values[-1]==88
          assert all(values[i]>values[i+1] for i in range(59))

          csv_path=O/"rich_hill_pick_values_1_60.csv"
          with csv_path.open("w",newline="") as f:
              w=csv.writer(f,lineterminator="\n")
              w.writerow(["selection_order","rich_hill_points"])
              for k,v in enumerate(values,1):
                  w.writerow([k,v])

          table_sha=hashlib.sha256(csv_path.read_bytes()).hexdigest()

          config={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b18_exploratory_product_validation_preregistration",
              "frozen_before_historical_capital_association":True,

              "objective":{
                  "label":"EXPLORATORY_LOW_AUTHORITY_PRODUCT_SCREEN",
                  "purpose":"Give Draft Capital Outlook one preregistered, one-shot test for a practically useful positive signal while limiting downstream authority because n is small.",
                  "strict_confirmatory_production_claim":False,
                  "reason_for_redesign":"The earlier confirmatory proposal was underpowered at attainable n and its original G3 residual-permutation method was defective. The objective and gate are changed before any historical capital scalar or predictor-target association is computed.",
                  "post_c1_gate_movement_allowed":False,
                  "model_or_target_shopping_after_c1_allowed":False
              },

              "cohort":{
                  "class_years":list(range(2013,2024)),
                  "class_n":11,
                  "source_rule":"Only classes admitted under B17/B17A/B17D/B17E frozen source and joint-feasibility rules.",
                  "2014_2023_strict_marginal_blinding_pristine":False,
                  "association_blinded":True
              },

              "construct":{
                  "top_n":60,
                  "selection_index_definition":"Selection order 1 through 60 on BOTH projected and actual sides; no phantom index is inserted for a forfeited nominal pick.",
                  "fantasy_positions":["QB","RB","FB","WR","TE"],
                  "position_map":{"QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE"},
                  "primary_position_weights":{"QB":1.0,"RB":1.0,"WR":1.0,"TE":1.0},
                  "all_other_positions_weight":0.0,
                  "position_weight_rationale":"Equal primary weights isolate fantasy-relevant NFL draft-capital composition and avoid importing outcome-fitted dynasty weights into the primary historical test.",
                  "pick_value_curve":"Rich Hill modern NFL draft trade-value chart, frozen picks 1-60",
                  "pick_value_table_file":"rich_hill_pick_values_1_60.csv",
                  "pick_value_table_sha256":table_sha,
                  "pick_value_provenance":{
                      "original_method_author":"Rich Hill",
                      "original_method_url":"https://www.patspulpit.com/2018/4/21/17256758/2018-nfl-draft-value-chart-rich-hill",
                      "public_table_transcription_url":"https://www.drafttek.com/NFL-Trade-Value-Chart-Rich-Hill.asp",
                      "assistant_public_crosscheck_date":"2026-09-30",
                      "anchor_checks":{"pick_1":1000,"pick_33":180,"pick_60":88},
                      "fallback_allowed":False
                  },
                  "projected_scalar":"P_c = sum_{k=1..60} V[k] * I(projected selection k maps to QB/RB/WR/TE after FB->RB)",
                  "actual_scalar":"A_c = sum_{k=1..60} V[k] * I(actual selection k maps to QB/RB/WR/TE after FB->RB)",
                  "x":"ln(P_c)",
                  "y":"ln(A_c)",
                  "same_formula_both_sides":True
              },

              "predictive_utility":{
                  "model":"LOO clipped OLS: y=a+b*x with b=max(0, OLS slope) inside each training fold",
                  "neutral":"training-fold mean of y",
                  "metric":"S = 1 - SSE_model / SSE_neutral on held-out log outcomes",
                  "primary_utility_requirement":"S > 0"
              },

              "gates":{
                  "G1":{
                      "role":"primary positive-signal screen",
                      "association_test":"one-sided permutation test of Pearson r between x and y",
                      "alpha":0.05,
                      "utility_requirement":"LOO S > 0",
                      "pass":"permutation p <= 0.05 AND LOO S > 0"
                  },
                  "G2":{
                      "role":"single-class deletion robustness",
                      "procedure":"Delete each class in turn. On the remaining n-1 classes require the same positive Pearson permutation test at alpha 0.15 AND LOO S > 0.",
                      "alpha":0.15,
                      "pass":"every class deletion passes",
                      "changed_from_original_strict_proposal":False
                  },
                  "G3":{
                      "role":"shared-calendar-trend robustness",
                      "procedure":"Freedman-Lane. Fit reduced y~1+year on all classes; permute ONLY reduced-model y residuals; reconstruct y*=fitted_year+permuted_residual; keep x and year fixed; refit full y*~1+year+x; compare the one-sided x-coefficient t statistic.",
                      "observed_statistic":"t statistic for positive x coefficient in full OLS y~1+year+x",
                      "alpha":0.15,
                      "pass":"Freedman-Lane one-sided p <= 0.15",
                      "original_detrend_then_free_permute_method_forbidden":True
                  }
              },

              "c1_classification":{
                  "STRONG":"G1 AND G2 AND G3",
                  "MODERATE":"G1 AND exactly one of G2/G3",
                  "WEAK":"G1 AND neither G2 nor G3",
                  "NO_SIGNAL":"G1 fails",
                  "C1_INVALID":"integrity/hash/protocol failure"
              },

              "b18_power_authorization":{
                  "meaningful_rho":0.60,
                  "current_n":11,
                  "primary_power_min":{"F1_normal":0.60,"F2_t4":0.55,"F3_skew_gamma":0.50},
                  "primary_null_false_pass_max":{"F1_normal":0.06,"F2_t4":0.08,"F3_skew_gamma":0.07},
                  "strong_category_pathology_false_pass_max":{"F4_single_class":0.15,"F5_shared_trend_each_strength":0.15},
                  "monte_carlo_tolerance":"For each false-pass ceiling: point estimate <= ceiling AND upper 95% Wilson bound <= ceiling + 0.01.",
                  "power_stage_permutation_count":199,
                  "planned_c1_permutation_count":99999,
                  "critical_outer_reps":{"primary_null":12000,"primary_rho_0_60":6000,"strong_pathology":2500},
                  "noncritical_outer_reps":{"rho_sensitivity":1500,"n_sweep":1500,"f5_n_sweep":400}
              },

              "synthetic_families":{
                  "F1":"bivariate normal with correlation rho",
                  "F2":"bivariate t with 4 df using common chi-square scale and correlation parameter rho",
                  "F3":"Gaussian copula with gamma(shape=2) marginals and latent correlation rho",
                  "F4":"single-class dominance null: n-1 independent null classes plus one (+3,+3) class",
                  "F5":"shared-trend null: x and y each correlate with standardized class-year index at strength q in {0.3,0.5,0.7}, with independent residual innovations"
              },

              "downstream_authority":{
                  "c1_may_run_once_only_if_b18_authorized":True,
                  "c1_strong_if_robustness_calibrated":"May authorize a separate Layer-D/shadow-calibration study only.",
                  "c1_moderate":"Continue evidence collection; no FV adjustment authority.",
                  "c1_weak":"Continue evidence collection only; no FV adjustment authority.",
                  "c1_no_signal":"Park construct at neutral 1.00.",
                  "maximum_future_initial_shadow_multiplier_deviation":0.03,
                  "shadow_cap_note":"The +/-3% bound is a maximum authority, not a mapping. A separate preregistered calibration study is required before any shadow multiplier exists.",
                  "production_change_authorized":False,
                  "2027_class_scored":False
              },

              "non_gating_future_sensitivities":[
                  "calculator position weights only if their provenance is independently clean",
                  "slope fixed at 1",
                  "rank correlation",
                  "per-class influence/leverage diagnostics"
              ],

              "seeds":{
                  "permutation_bank_base":180000,
                  "primary_null_base":510000,
                  "primary_power_base":520000,
                  "sensitivity_base":530000,
                  "robustness_base":540000,
                  "n_sweep_base":550000,
                  "f5_sweep_base":560000
              },

              "firewall":{
                  "b18_may_read_only_b17e_summary_and_manifest_for_cohort_n":True,
                  "historical_projected_composition_read_by_power_stage":False,
                  "historical_actual_composition_read_by_power_stage":False,
                  "historical_capital_values_computed":False,
                  "predictor_target_association_computed":False,
                  "model_fit_on_historical_capital":False,
                  "c1_executed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }
          }

          (O/"b18_config.json").write_text(json.dumps(config,indent=2,sort_keys=True)+"\n")

          iteration={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b18_design_iteration_ledger",
              "real_capital_association_seen_before_redesign":False,
              "iterations":[
                  {
                      "label":"STRICT_CONFIRMATORY_DRAFT",
                      "status":"SUPERSEDED_BEFORE_REAL_ASSOCIATION",
                      "reason":"Attainable n was underpowered for 80/70 full-gate requirement; synthetic testing also found original G3 anti-conservative under shared trend."
                  },
                  {
                      "label":"EXPLORATORY_PRODUCT_VALIDATION_V1",
                      "status":"FROZEN_BY_THIS_WORKFLOW_BEFORE_REAL_ASSOCIATION",
                      "reason":"User chose low-authority exploratory/shadow objective. G1 remains alpha=.05; power authorization is relaxed for one-shot screening; G2/G3 classify robustness; only STRONG can ever advance to later shadow calibration."
                  }
              ],
              "post_c1_redesign_allowed":False
          }
          (O/"b18_design_iteration_ledger.json").write_text(
              json.dumps(iteration,indent=2,sort_keys=True)+"\n"
          )

          print("PASS: B18 exploratory config frozen.")
          print("Rich Hill CSV SHA256:",table_sha)
          PY

      - name: Hash and self-audit frozen B18 config before simulation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b18")
          C=json.loads((O/"b18_config.json").read_text())
          rows=list(csv.DictReader((O/"rich_hill_pick_values_1_60.csv").read_text().splitlines()))

          assert C["cohort"]["class_n"]==11
          assert C["cohort"]["class_years"]==list(range(2013,2024))
          assert C["construct"]["primary_position_weights"]=={"QB":1.0,"RB":1.0,"WR":1.0,"TE":1.0}
          assert C["construct"]["same_formula_both_sides"] is True
          assert C["gates"]["G1"]["alpha"]==0.05
          assert C["gates"]["G2"]["alpha"]==0.15
          assert C["gates"]["G3"]["alpha"]==0.15
          assert C["gates"]["G3"]["original_detrend_then_free_permute_method_forbidden"] is True
          assert C["b18_power_authorization"]["meaningful_rho"]==0.60
          assert C["downstream_authority"]["maximum_future_initial_shadow_multiplier_deviation"]==0.03
          assert C["downstream_authority"]["production_change_authorized"] is False
          assert C["firewall"]["predictor_target_association_computed"] is False

          assert len(rows)==60
          vals={int(r["selection_order"]):int(r["rich_hill_points"]) for r in rows}
          assert vals[1]==1000 and vals[33]==180 and vals[60]==88
          assert hashlib.sha256((O/"rich_hill_pick_values_1_60.csv").read_bytes()).hexdigest()==C["construct"]["pick_value_table_sha256"]

          freeze={
              "config_sha256":hashlib.sha256((O/"b18_config.json").read_bytes()).hexdigest(),
              "pick_table_sha256":hashlib.sha256((O/"rich_hill_pick_values_1_60.csv").read_bytes()).hexdigest(),
              "iteration_ledger_sha256":hashlib.sha256((O/"b18_design_iteration_ledger.json").read_bytes()).hexdigest()
          }
          (O/"b18_freeze_hashes.json").write_text(json.dumps(freeze,indent=2,sort_keys=True)+"\n")
          print(json.dumps(freeze,indent=2))
          PY

      - name: Run synthetic-only exploratory power and robustness calibration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,math
          from pathlib import Path

          import numpy as np
          import scipy
          from scipy.stats import gamma,norm

          O=Path("research/draft-capital-outlook-v1/b18")
          C=json.loads((O/"b18_config.json").read_text())
          F=json.loads((O/"b18_freeze_hashes.json").read_text())

          # Fail if config changed after freeze.
          assert hashlib.sha256((O/"b18_config.json").read_bytes()).hexdigest()==F["config_sha256"]

          B=int(C["b18_power_authorization"]["power_stage_permutation_count"])
          n_current=int(C["cohort"]["class_n"])
          assert n_current==11 and B==199

          def wilson(k,n,z=1.959963984540054):
              if n<=0:
                  return [0.0,1.0]
              p=k/n
              d=1+z*z/n
              center=(p+z*z/(2*n))/d
              half=z*math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d
              return [max(0.0,center-half),min(1.0,center+half)]

          def perm_bank(n,seed):
              rng=np.random.default_rng(seed)
              base=np.arange(n,dtype=np.int16)
              out=np.empty((B,n),dtype=np.int16)
              for i in range(B):
                  out[i]=rng.permutation(base)
              return out

          banks={
              n:perm_bank(n,int(C["seeds"]["permutation_bank_base"])+n)
              for n in range(8,25)
          }

          def loo_skill(x,y):
              x=np.asarray(x,float); y=np.asarray(y,float)
              n=x.size
              sx=float(x.sum()); sy=float(y.sum())
              sxx=float(x@x); sxy=float(x@y)
              sse_model=0.0; sse_neutral=0.0
              for i in range(n):
                  nt=n-1
                  sx_i=sx-x[i]; sy_i=sy-y[i]
                  xb=sx_i/nt; yb=sy_i/nt
                  sxxc=(sxx-x[i]*x[i])-nt*xb*xb
                  sxyc=(sxy-x[i]*y[i])-nt*xb*yb
                  b=max(0.0,sxyc/sxxc) if sxxc>1e-12 else 0.0
                  a=yb-b*xb
                  em=y[i]-(a+b*x[i])
                  en=y[i]-yb
                  sse_model+=em*em
                  sse_neutral+=en*en
              if sse_neutral<=1e-15:
                  return float("-inf")
              return 1.0-sse_model/sse_neutral

          def perm_corr_p(x,y,bank):
              x=np.asarray(x,float); y=np.asarray(y,float)
              xz=x-x.mean(); yz=y-y.mean()
              den=math.sqrt(float(xz@xz)*float(yz@yz))
              if den<=1e-15:
                  return 1.0,0.0
              robs=float(xz@yz)/den
              if robs<=0:
                  return 1.0,robs
              rperm=(yz[bank]@xz)/den
              ge=int(np.count_nonzero(rperm>=robs-1e-12))
              return (1+ge)/(len(bank)+1),robs

          def primary(x,y,alpha=0.05):
              p,r=perm_corr_p(x,y,banks[len(x)])
              s=loo_skill(x,y)
              return bool(p<=alpha and s>0),p,r,s

          def deletion_guard(x,y):
              n=len(x)
              details=[]
              all_pass=True
              for i in range(n):
                  xx=np.delete(x,i); yy=np.delete(y,i)
                  ok,p,r,s=primary(xx,yy,alpha=0.15)
                  details.append({"deleted_index":i,"pass":ok,"p":p,"r":r,"S":s})
                  all_pass=all_pass and ok
              return all_pass,details

          def fl_year_guard(x,y,year):
              x=np.asarray(x,float); y=np.asarray(y,float); year=np.asarray(year,float)
              n=len(x)
              Z=np.column_stack([np.ones(n),year])
              H=Z@np.linalg.pinv(Z.T@Z)@Z.T
              M=np.eye(n)-H
              xr=M@x
              yr=M@y
              df=n-3

              def t_from_resids(a,b):
                  aa=float(a@a); bb=float(b@b)
                  if aa<=1e-15 or bb<=1e-15:
                      return float("-inf")
                  r=float(a@b)/math.sqrt(aa*bb)
                  r=max(-0.999999999999,min(0.999999999999,r))
                  return r*math.sqrt(df/max(1e-15,1-r*r))

              tobs=t_from_resids(xr,yr)
              if tobs<=0:
                  return False,1.0,tobs

              fitted=H@y
              resid=y-fitted
              E=resid[banks[n]]
              Yres=E@M.T

              aa=float(xr@xr)
              bb=np.einsum("ij,ij->i",Yres,Yres)
              num=Yres@xr
              rr=num/np.sqrt(np.maximum(1e-15,aa*bb))
              rr=np.clip(rr,-0.999999999999,0.999999999999)
              tt=rr*np.sqrt(df/np.maximum(1e-15,1-rr*rr))
              ge=int(np.count_nonzero(tt>=tobs-1e-12))
              p=(1+ge)/(len(banks[n])+1)
              return bool(p<=0.15),p,tobs

          def generate(rng,family,n,rho=0.0,trend_strength=None):
              if family in {"F1","F2","F3"}:
                  z=rng.multivariate_normal(
                      [0.0,0.0],
                      [[1.0,rho],[rho,1.0]],
                      size=n
                  )
                  if family=="F1":
                      return z[:,0],z[:,1]
                  if family=="F2":
                      scale=rng.chisquare(4,size=n)/4.0
                      return z[:,0]/np.sqrt(scale),z[:,1]/np.sqrt(scale)
                  u=norm.cdf(z)
                  return gamma.ppf(u[:,0],a=2.0),gamma.ppf(u[:,1],a=2.0)

              if family=="F4":
                  x=rng.normal(size=n); y=rng.normal(size=n)
                  j=int(rng.integers(n))
                  x[j]=3.0; y[j]=3.0
                  return x,y

              if family=="F5":
                  q=float(trend_strength)
                  t=np.linspace(-1.0,1.0,n)
                  t=(t-t.mean())/t.std(ddof=0)
                  x=q*t+math.sqrt(1-q*q)*rng.normal(size=n)
                  y=q*t+math.sqrt(1-q*q)*rng.normal(size=n)
                  return x,y

              raise ValueError(family)

          def primary_rate(family,n,rho,reps,seed,trend_strength=None):
              rng=np.random.default_rng(seed)
              passed=0
              for _ in range(reps):
                  x,y=generate(rng,family,n,rho,trend_strength)
                  passed+=primary(x,y)[0]
              rate=passed/reps
              lo,hi=wilson(passed,reps)
              return {
                  "family":family,"n":n,"rho":rho,
                  "trend_strength":trend_strength,
                  "reps":reps,"pass_n":passed,"rate":rate,
                  "wilson95":[lo,hi],
                  "mcse":math.sqrt(rate*(1-rate)/reps)
              }

          def classified_rate(family,n,rho,reps,seed,trend_strength=None):
              rng=np.random.default_rng(seed)
              year=np.arange(n,dtype=float)
              counts={"G1":0,"G1_G2":0,"G1_G3":0,"STRONG":0,"MODERATE_OR_STRONG":0}
              for _ in range(reps):
                  x,y=generate(rng,family,n,rho,trend_strength)
                  g1,_,_,_=primary(x,y)
                  g2=g3=False
                  if g1:
                      g2,_=deletion_guard(x,y)
                      g3,_,_=fl_year_guard(x,y,year)
                  counts["G1"]+=int(g1)
                  counts["G1_G2"]+=int(g1 and g2)
                  counts["G1_G3"]+=int(g1 and g3)
                  counts["STRONG"]+=int(g1 and g2 and g3)
                  counts["MODERATE_OR_STRONG"]+=int(g1 and (g2 or g3))
              out={
                  "family":family,"n":n,"rho":rho,
                  "trend_strength":trend_strength,"reps":reps,
                  "counts":counts,"rates":{},"wilson95":{}
              }
              for key,k in counts.items():
                  rate=k/reps
                  out["rates"][key]=rate
                  out["wilson95"][key]=wilson(k,reps)
              return out

          pa=C["b18_power_authorization"]

          results={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b18_exploratory_synthetic_power",
              "numpy_version":np.__version__,
              "scipy_version":scipy.__version__,
              "current_n":n_current,
              "inner_permutations":B,
              "primary_critical":{},
              "primary_sensitivity":[],
              "primary_n_sweep":[],
              "classification_current_n":[],
              "pathology_current_n":[],
              "f5_strong_false_pass_n_sweep":[],
              "historical_composition_read":False,
              "historical_capital_computed":False,
              "predictor_target_association_computed":False
          }

          # Critical primary cells at current n.
          crit_null=int(pa["critical_outer_reps"]["primary_null"])
          crit_power=int(pa["critical_outer_reps"]["primary_rho_0_60"])
          for j,fam in enumerate(["F1","F2","F3"],1):
              results["primary_critical"][f"{fam}_rho0"]=primary_rate(
                  fam,n_current,0.0,crit_null,
                  int(C["seeds"]["primary_null_base"])+j
              )
              results["primary_critical"][f"{fam}_rho060"]=primary_rate(
                  fam,n_current,0.60,crit_power,
                  int(C["seeds"]["primary_power_base"])+j
              )

          # rho sensitivity at current n.
          sens_reps=int(pa["noncritical_outer_reps"]["rho_sensitivity"])
          idx=0
          for fam in ["F1","F2","F3"]:
              for rho in [0.50,0.60,0.70]:
                  idx+=1
                  results["primary_sensitivity"].append(
                      primary_rate(
                          fam,n_current,rho,sens_reps,
                          int(C["seeds"]["sensitivity_base"])+idx
                      )
                  )

          # G1-only n sweep: this answers whether the exploratory SCREEN is
          # adequately powered; robustness gates classify a real C1 result.
          sweep_reps=int(pa["noncritical_outer_reps"]["n_sweep"])
          idx=0
          for n in [10,11,12,14,16,18,20,22,24]:
              for fam in ["F1","F2","F3"]:
                  idx+=1
                  results["primary_n_sweep"].append(
                      primary_rate(
                          fam,n,0.60,sweep_reps,
                          int(C["seeds"]["n_sweep_base"])+idx
                      )
                  )

          # Full classification decomposition at current n and meaningful rho.
          robust_reps=1200
          for j,fam in enumerate(["F1","F2","F3"],1):
              results["classification_current_n"].append(
                  classified_rate(
                      fam,n_current,0.60,robust_reps,
                      int(C["seeds"]["robustness_base"])+j
                  )
              )

          # Pathology/null robustness at current n.
          path_reps=int(pa["critical_outer_reps"]["strong_pathology"])
          results["pathology_current_n"].append(
              classified_rate(
                  "F4",n_current,0.0,path_reps,
                  int(C["seeds"]["robustness_base"])+100
              )
          )
          for j,q in enumerate([0.30,0.50,0.70],1):
              results["pathology_current_n"].append(
                  classified_rate(
                      "F5",n_current,0.0,path_reps,
                      int(C["seeds"]["robustness_base"])+100+j,
                      trend_strength=q
                  )
              )

          # Broader corrected-Freedman-Lane F5 stress, non-gating except the
          # current-n cells above. This checks trend strengths across n.
          f5_reps=int(pa["noncritical_outer_reps"]["f5_n_sweep"])
          idx=0
          for n in [10,11,12,14,16,18,20,22]:
              for q in [0.30,0.50,0.70]:
                  idx+=1
                  r=classified_rate(
                      "F5",n,0.0,f5_reps,
                      int(C["seeds"]["f5_sweep_base"])+idx,
                      trend_strength=q
                  )
                  results["f5_strong_false_pass_n_sweep"].append({
                      "n":n,
                      "trend_strength":q,
                      "reps":f5_reps,
                      "strong_rate":r["rates"]["STRONG"],
                      "strong_wilson95":r["wilson95"]["STRONG"],
                      "g1_rate":r["rates"]["G1"],
                      "g1_g3_rate":r["rates"]["G1_G3"]
                  })

          (O/"b18_power_results.json").write_text(
              json.dumps(results,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: synthetic-only B18 power run complete.")
          print(json.dumps(results["primary_critical"],indent=2))
          PY

      - name: Mechanically authorize or stop exploratory C1 screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b18")
          C=json.loads((O/"b18_config.json").read_text())
          R=json.loads((O/"b18_power_results.json").read_text())
          F=json.loads((O/"b18_freeze_hashes.json").read_text())
          P=C["b18_power_authorization"]

          assert hashlib.sha256((O/"b18_config.json").read_bytes()).hexdigest()==F["config_sha256"]
          assert R["current_n"]==C["cohort"]["class_n"]==11
          assert R["historical_composition_read"] is False
          assert R["historical_capital_computed"] is False
          assert R["predictor_target_association_computed"] is False

          checks={}

          power_map={
              "F1":"F1_normal",
              "F2":"F2_t4",
              "F3":"F3_skew_gamma"
          }
          for fam,label in power_map.items():
              actual=R["primary_critical"][f"{fam}_rho060"]["rate"]
              req=P["primary_power_min"][label]
              checks[f"{fam}_rho060_power"]={
                  "actual":actual,"required_min":req,"pass":actual>=req
              }

          null_map={
              "F1":"F1_normal",
              "F2":"F2_t4",
              "F3":"F3_skew_gamma"
          }
          for fam,label in null_map.items():
              cell=R["primary_critical"][f"{fam}_rho0"]
              ceiling=P["primary_null_false_pass_max"][label]
              point=cell["rate"]; upper=cell["wilson95"][1]
              ok=(point<=ceiling and upper<=ceiling+0.01)
              checks[f"{fam}_rho0_calibration"]={
                  "actual":point,
                  "wilson95_upper":upper,
                  "ceiling":ceiling,
                  "upper_tolerance":ceiling+0.01,
                  "pass":ok
              }

          strong_ceiling=P["strong_category_pathology_false_pass_max"]
          strong_ok=True
          pathology=[]
          for cell in R["pathology_current_n"]:
              if cell["family"]=="F4":
                  ceiling=strong_ceiling["F4_single_class"]
                  label="F4_single_class"
              else:
                  ceiling=strong_ceiling["F5_shared_trend_each_strength"]
                  label=f"F5_trend_{cell['trend_strength']}"
              point=cell["rates"]["STRONG"]
              upper=cell["wilson95"]["STRONG"][1]
              ok=(point<=ceiling and upper<=ceiling+0.01)
              strong_ok=strong_ok and ok
              pathology.append({
                  "label":label,
                  "actual_strong_false_pass":point,
                  "wilson95_upper":upper,
                  "ceiling":ceiling,
                  "upper_tolerance":ceiling+0.01,
                  "pass":ok
              })

          primary_ok=all(x["pass"] for k,x in checks.items())
          authorized=bool(primary_ok and strong_ok)

          # Determine smallest n in the G1-only synthetic sweep meeting all
          # exploratory power floors. This is descriptive; current-n authority
          # still uses the critical cells above.
          rows=R["primary_n_sweep"]
          by_n={}
          for row in rows:
              by_n.setdefault(row["n"],{})[row["family"]]=row["rate"]
          smallest=None
          for n in sorted(by_n):
              d=by_n[n]
              if (
                  d["F1"]>=P["primary_power_min"]["F1_normal"]
                  and d["F2"]>=P["primary_power_min"]["F2_t4"]
                  and d["F3"]>=P["primary_power_min"]["F3_skew_gamma"]
              ):
                  smallest=n
                  break

          decision=(
              "AUTHORIZE_B18_EXPLORATORY_C1_SCREEN_N11_NO_PRODUCTION_AUTHORITY"
              if authorized else
              "STOP_B18_EXPLORATORY_C1_SCREEN_UNDERPOWERED_OR_MISCALIBRATED"
          )

          auth={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b18_exploratory_authorization",
              "decision":decision,
              "current_n":11,
              "primary_power_and_null_checks":checks,
              "strong_category_pathology_checks":pathology,
              "primary_screen_calibrated":primary_ok,
              "strong_category_calibrated":strong_ok,
              "c1_exploratory_screen_authorized":authorized,
              "smallest_n_meeting_exploratory_primary_power_floors_in_noncritical_sweep":smallest,
              "c1_execution_count_authorized":1 if authorized else 0,
              "c1_strong_may_authorize_next_step_only":"Separate Layer-D/shadow-calibration study, never direct production.",
              "future_initial_shadow_cap_if_all_later_studies_pass":0.03,
              "historical_capital_values_computed":False,
              "predictor_target_association_computed":False,
              "c1_executed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "human_override_allowed":False
          }
          (O/"b18_authorization.json").write_text(json.dumps(auth,indent=2,sort_keys=True)+"\n")

          print(json.dumps(auth,indent=2))
          PY

