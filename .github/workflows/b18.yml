      - name: Prove B18 synthetic-only research mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b18")
          C=json.loads((O/"b18_config.json").read_text())
          A=json.loads((O/"b18_authorization.json").read_text())

          assert C["firewall"]["historical_projected_composition_read_by_power_stage"] is False
          assert C["firewall"]["historical_actual_composition_read_by_power_stage"] is False
          assert C["firewall"]["historical_capital_values_computed"] is False
          assert C["firewall"]["predictor_target_association_computed"] is False
          assert A["historical_capital_values_computed"] is False
          assert A["predictor_target_association_computed"] is False
          assert A["production_change_authorized"] is False

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b18/")
              for p in touched
          ),touched
          assert not any(
              p=="index.html"
              or p=="free-agent-board.html"
              or p.startswith(("data/","model/","scripts/"))
              for p in touched
          ),touched

          print("PASS: B18 is synthetic-only and research-only.")
          PY

      - name: Commit B18 preregistration and synthetic power result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B18."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/draft-capital-outlook-v1/b18/
          git diff --cached --check
          git commit -m "Freeze Draft Capital exploratory B18 and synthetic power"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B18 exploratory preregistration and synthetic-only power committed."
