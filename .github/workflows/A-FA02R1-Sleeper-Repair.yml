          old_bytes = old_contents.encode('utf-8')
          git_blob_sha = hashlib.sha1(f'blob {len(old_bytes)}\0'.encode() + old_bytes).hexdigest()
          mode = os.environ['MODE']

          if old_contents == new_contents:
              print('ALREADY APPLIED: sync-sleeper.yml is repaired; no changes necessary.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### A-FA02R1: already applied\nNo file changes needed.\n')
              raise SystemExit(0)
          if git_blob_sha != expected_baseline_git_sha:
              raise SystemExit(
                  'BASELINE CHANGED: refusing to overwrite a different workflow. '
                  f'Expected {expected_baseline_git_sha}, found {git_blob_sha}. '
                  'Re-review the current sync-sleeper.yml before applying.'
              )

          print('\n'.join(difflib.unified_diff(
              old_contents.splitlines(), new_contents.splitlines(),
              fromfile='sync-sleeper.yml (original)',
              tofile='sync-sleeper.yml (repair A-FA02R1)', lineterm=''
          )))
          if mode == 'apply':
              target.write_text(new_contents, encoding='utf-8')
              print('APPLY: replacement written; the next step commits this single workflow file.')
          elif mode == 'preview':
              print('PREVIEW ONLY: no files modified.')
          else:
              raise SystemExit(f'Unexpected mode: {mode}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'### A-FA02R1 {mode.upper()}\n')
              f.write('- Live free-agent/roster sync commits before optional Team Utility checks.\n')
              f.write('- Strict Team Utility diagnostics are retained independently.\n')
              f.write('- No FV or frozen-study logic changed.\n')
          PYCODE
      - name: Commit only the repaired Sleeper Maintenance workflow
        if: inputs.mode == 'apply'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -- .github/workflows/sync-sleeper.yml
          if git diff --cached --quiet; then
            echo "Already applied. No commit required."
          else
            git commit -m "A-FA02R1: decouple free-agent sync from Team Utility lineup gate"
            git push origin HEAD:main
          fi
