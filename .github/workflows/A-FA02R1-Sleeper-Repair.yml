      mode:
        description: 'Preview first; Apply updates sync-sleeper.yml only'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

