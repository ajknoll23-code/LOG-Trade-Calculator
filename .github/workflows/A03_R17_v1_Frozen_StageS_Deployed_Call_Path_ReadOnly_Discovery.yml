name: A03 R17 - Deployed Stage S Clock Path Read Only Discovery

# This workflow must NOT be interpreted as Stage S integration acceptance.
# It demonstrates the remaining live RB clock dependence with synthetic fixtures.
# No E2, B2, real player inputs, source authorization, or new FV prices.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a03-r17-read-only-stage-s-deployed-callpath
  cancel-in-progress: false

jobs:
  deployed-callpath-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact frozen R16-tested commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: 8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned deployed engine and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6'
          printf '%s  %s\n' 'af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78' index.html | sha256sum --check --status
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Stage ephemeral discovery verifier outside repository
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a03_r17_stage_s.js" <<'A03R17SCRIPT'
          #!/usr/bin/env node
          'use strict';
          /* A03 R17 v1: READ-ONLY discovery of deployed RB clock dependence.
           * Runs pinned index.html functions in an isolated Node evaluator.
           * Operates solely on synthetic identities injected into ephemeral objects.
           * Stubs render() to avoid DOM/network/UI side effects.
           * NEVER an integration acceptance, production price or browser validation.
           */
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const ENGINE_SHA='af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78';
          const COMMIT='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6';
          const args=process.argv.slice(2);
          if(args.length!==2||args[0]!=='--engine')throw Error('USAGE: --engine index.html');
          const html=fs.readFileSync(args[1],'utf8');
          if(sha(html)!==ENGINE_SHA)throw Error('HOLD_PINNED_DEPLOYED_ENGINE_HASH_CHANGED');
          const startTag='<script>\n/* ---------- Value engine ---------- */';
          const endTag="document.getElementById('resetBtn').addEventListener('click', clearCalculator);";
          const start=html.indexOf(startTag),end=html.indexOf(endTag,start);
          if(start<0||end<=start||html.indexOf(startTag,start+1)>=0)throw Error('HOLD_ENGINE_BOUNDARY');
          const source=html.slice(start+'<script>\n'.length,end);
          for(const needle of ['function fractionalAgeFromBirthDate(', 'function effectiveAgeMultiplier(',
           'function playerValue(', 'function displayPlayerAge(', 'function playerValueByKey(',
           'function addPlayerAsset(', 'function assetRowHTML(']){
           if(!source.includes(needle))throw Error('HOLD_REQUIRED_DEPLOYED_FUNCTION_MISSING:'+needle);
          }
          function frozenDate(iso){const ms=Date.parse(iso);if(!Number.isFinite(ms))throw Error('BAD_CLOCK');
           return class FrozenDate extends Date{constructor(...a){super(...(a.length?a:[ms]));}static now(){return ms;}};}
          const silent=Object.freeze({log(){},warn(){},error(){}});
          /* Source extraction excludes the DOM initialization at the bottom. All source-defined
           * functions stay original. Only render() is replaced with a no-op AFTER evaluation.
           * This is an isolated data-path test through addPlayerAsset, NOT a UI render test.
           */
          function liveEngine(clock){
           const body=source+'\nrender = function A03R17_NO_DOM_RENDER(){};\n'+
           'return {playerValue,displayPlayerAge,playerValueByKey,addPlayerAsset,assetRowHTML,'+
           'fractionalAgeFromBirthDate,rbContinuousAgeMultiplier,productionMultiplier,'+
           'normalizeName,PLAYER_DB,RB_BIRTH_DATE_DATA,PROD_MULT,POSITION_WEIGHT,state};';
           return (new Function('Date','console',body))(frozenDate(clock),silent);
          }
          const checks=[];
          function check(name,condition){checks.push({name,pass:!!condition});if(!condition)throw Error('HOLD_R17_ASSERTION:'+name);}
          /* No actual roster identity, no external data request and no persisted changes. */
          const rbName='a03 r17 synthetic running back 999999';
          const wrName='a03 r17 synthetic wide receiver 999999';
          const undatedRb='a03 r17 synthetic no birthdate 999999';
          const birthDate='2000-03-01';
          const referenceDate='2026-10-14';
          const clocks=['2026-10-14T19:00:00Z','2026-12-14T19:00:00Z','2031-06-01T19:00:00Z'];
          const samples=[];
          for(const clock of clocks){
           const X=liveEngine(clock);
           const key=X.normalizeName(rbName),wrKey=X.normalizeName(wrName),noDobKey=X.normalizeName(undatedRb);
           check('fixture_names_absent_'+clock,[key,wrKey,noDobKey].every(k=>
            !Object.prototype.hasOwnProperty.call(X.PLAYER_DB,k) &&
            !Object.prototype.hasOwnProperty.call(X.RB_BIRTH_DATE_DATA,k) &&
            !Object.prototype.hasOwnProperty.call(X.PROD_MULT,k)));
           // These writes occur ONLY in the ephemeral function-evaluator context.
           X.PLAYER_DB[key]={pos:'RB',age:26,role:'Starter',team:'SYNTHETIC_ONLY',birth_date:birthDate};
           X.RB_BIRTH_DATE_DATA[key]=birthDate;
           X.PROD_MULT[key]=0.7;
           X.PROD_MULT[wrKey]=0.7;
           X.PROD_MULT[noDobKey]=0.7;
           const rbValue=X.playerValue('RB',26,'Starter',rbName);
           const byKey=X.playerValueByKey(key);
           const displayAge=X.displayPlayerAge('RB',26,rbName);
           const wrValue=X.playerValue('WR',26,'Starter',wrName);
           const undatedValue=X.playerValue('RB',26,'Starter',undatedRb);
           const explicitAge=X.fractionalAgeFromBirthDate(birthDate,26,referenceDate);
           const originalAge=X.fractionalAgeFromBirthDate(birthDate,26);
           const explicitMultiplier=X.rbContinuousAgeMultiplier(explicitAge,'Starter',0.7,0.7);
           const added=X.addPlayerAsset('A',rbName,'RB',26,'Starter');
           const asset=X.state.A[X.state.A.length-1];
           check('real_addPlayerAsset_calls_playerValue_'+clock,added===true&&X.state.A.length===1&&
            asset&&asset.type==='player'&&asset.value===rbValue&&asset.name===rbName);
           check('real_playerValueByKey_matches_'+clock,byKey===rbValue);
           check('valid_finite_live_values_'+clock,[rbValue,wrValue,undatedValue,explicitAge,originalAge,explicitMultiplier].every(Number.isFinite));
           check('explicit_age_disagrees_only_with_clock_not_DOB_'+clock,explicitAge>=26&&explicitAge<27);
           samples.push({simulated_utc_clock:clock,rb_stored_fv_synthetic:rbValue,
            rb_lookup_fv_synthetic:byKey,rb_ui_age_string:displayAge,
            rb_implicit_age:originalAge,rb_explicit_reference_age:explicitAge,
            rb_explicit_reference_multiplier:explicitMultiplier,
            wr_control_synthetic:wrValue,rb_without_dob_control_synthetic:undatedValue,
            stored_asset_value_synthetic:asset.value});
          }
          const unique=arr=>new Set(arr).size;
          check('live_RB_value_is_implicit_clock_sensitive',unique(samples.map(x=>x.rb_stored_fv_synthetic))>1);
          check('live_RB_age_display_is_implicit_clock_sensitive',unique(samples.map(x=>x.rb_ui_age_string))>1);
          check('explicit_date_comparator_is_clock_invariant',unique(samples.map(x=>x.rb_explicit_reference_age))===1&&
           unique(samples.map(x=>x.rb_explicit_reference_multiplier))===1);
          check('WR_control_has_no_clock_drift',unique(samples.map(x=>x.wr_control_synthetic))===1);
          check('RB_without_DOB_control_has_no_clock_drift',unique(samples.map(x=>x.rb_without_dob_control_synthetic))===1);
          check('synthetic_trade_state_mirrors_playerValue',samples.every(x=>x.rb_stored_fv_synthetic===x.stored_asset_value_synthetic));
          /* This is a positive discovery of a known deployed issue, NOT a passing deployed fix. */
          const outcome={study:'A03_R17_V1',
           result:'PASS_READ_ONLY_DISCOVERY__DEPLOYED_INTEGRATION_REMAINS_HOLD',
           deployed_integration_gate:'HOLD_CLOCK_DEPENDENCY_CONFIRMED',
           engine:{repo:'ajknoll23-code/LOG-Trade-Calculator',commit:COMMIT,index_html_sha256:ENGINE_SHA,
            real_index_html_functions_executed:true,full_browser_or_DOM_render_executed:false},
           scope:'Frozen pinned deployed functions; synthetic-only fixture; isolated trade state; no network or real outcomes',
           findings:[{severity:'HOLD',code:'LIVE_RB_FV_WALLCLOCK_DEPENDENCY',
            call_chain:['addPlayerAsset','playerValue','effectiveAgeMultiplier','fractionalAgeFromBirthDate'],
            description:'Known-DOB RB valuation consults implicit current date rather than a captured as-of date.'},
            {severity:'HOLD',code:'LIVE_RB_AGE_DISPLAY_WALLCLOCK_DEPENDENCY',
            call_chain:['assetRowHTML','displayPlayerAge','fractionalAgeFromBirthDate'],
            description:'Displayed RB fractional age independently consults implicit current date.'}],
           samples,guards:checks,passed:checks.length,failed:0,
           real_player_entries_accessed:false,real_outcome_rows_accessed:false,
           production_files_modified:false,network_called:false,
           full_UI_acceptance:false,B2_approval:false,E2_access:false,
           new_FV_coefficients_authorized:false,new_A_prices_authorized:false,
           roleV2_pricing_authorized:false,production_release_authorized:false};
          process.stdout.write(JSON.stringify(outcome,null,2)+'\n');
          A03R17SCRIPT
          node --check "$RUNNER_TEMP/a03_r17_stage_s.js"
          printf '%s  %s\n' '2dd7e16d6c881eb6cc43c953fe3f2ab905229d0e60be7023e9a7e92ffc8c5240' "$RUNNER_TEMP/a03_r17_stage_s.js" | sha256sum --check --status

      - name: Run real pinned functions and verify HOLD discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/a03_r17_stage_s.js" --engine index.html > "$RUNNER_TEMP/a03-r17-stage-s-deployed-discovery.json"
          node - "$RUNNER_TEMP/a03-r17-stage-s-deployed-discovery.json" <<'A03R17ASSERT'
          const fs=require('node:fs');
          const f=process.argv[2];
          const x=JSON.parse(fs.readFileSync(f,'utf8'));
          function ok(b,message){if(!b)throw Error('HOLD_R17_JSON_ASSERTION:'+message);}
          ok(x.study==='A03_R17_V1','study');
          ok(x.result==='PASS_READ_ONLY_DISCOVERY__DEPLOYED_INTEGRATION_REMAINS_HOLD','status');
          ok(x.deployed_integration_gate==='HOLD_CLOCK_DEPENDENCY_CONFIRMED','gate');
          ok(x.engine?.index_html_sha256==='af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78','engine_sha');
          ok(x.engine?.commit==='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6','commit');
          ok(x.engine?.real_index_html_functions_executed===true,'real_functions');
          ok(x.engine?.full_browser_or_DOM_render_executed===false,'no_browser');
          ok(Array.isArray(x.samples)&&x.samples.length===3,'three_clocks');
          ok(Array.isArray(x.guards)&&x.guards.length===21&&x.passed===21&&x.failed===0&&x.guards.every(g=>g.pass===true),'guards');
          ok(Array.isArray(x.findings)&&x.findings.length===2&&x.findings.every(f=>f.severity==='HOLD'),'two_holds');
          const uniques=a=>new Set(a).size;
          ok(uniques(x.samples.map(s=>s.rb_stored_fv_synthetic))>1,'deployed_rb_value_drift_detected');
          ok(uniques(x.samples.map(s=>s.rb_ui_age_string))>1,'deployed_display_age_drift_detected');
          ok(uniques(x.samples.map(s=>s.rb_explicit_reference_age))===1,'comparator_stable');
          ok(uniques(x.samples.map(s=>s.wr_control_synthetic))===1,'WR_stable');
          ok(uniques(x.samples.map(s=>s.rb_without_dob_control_synthetic))===1,'RB_no_DOB_stable');
          for(const k of ['real_player_entries_accessed','real_outcome_rows_accessed','production_files_modified','network_called','full_UI_acceptance','B2_approval','E2_access','new_FV_coefficients_authorized','new_A_prices_authorized','roleV2_pricing_authorized','production_release_authorized'])ok(x[k]===false,'hold_flag_'+k);
          console.log('A03_R17_READ_ONLY_DISCOVERY_PASS_INTEGRATION_REMAINS_HOLD');
          A03R17ASSERT

      - name: Upload synthetic-only research discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: A03-R17-StageS-Live-Clock-Dependency-ReadOnly-Evidence
          path: ${{ runner.temp }}/a03-r17-stage-s-deployed-discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm no repository changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = '8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6'
