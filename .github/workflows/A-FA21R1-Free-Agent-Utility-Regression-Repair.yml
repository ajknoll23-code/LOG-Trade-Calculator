name: A-FA21R1 - Free Agent Utility V1 Regression Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required test dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Repair obsolete James Pearce stale-position assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validation/repo_regression_checks.py')
          source = path.read_text(encoding='utf-8')
          old = '    assert "james pearce" in names, "known stale-position audit case no longer surfaced"\n'
          replacement = '''    # A-ID03 fixed James Pearce Jr. (Sleeper 12585) from the stale LB bucket
              # to the independently verified DL bucket. The old live mismatch is now
              # expected to disappear; the synthetic stale-LB case remains covered by
              # dual_eligibility_pipeline.run_selftest().
              assert dual_eligibility_pipeline.load_trade_desk_positions().get("james pearce") == "DL", (
                  "A-ID03 approved James Pearce DL classification regressed"
              )
              assert "james pearce" not in names, "corrected James Pearce still flagged as stale"
          '''
          # Dedent the replacement to the established four-space function indentation.
          replacement = replacement.replace('\n              ', '\n    ')
          if source.count(old) == 1:
              path.write_text(source.replace(old, replacement), encoding='utf-8')
              print('Applied A-FA21R1 stale-assertion correction.')
          elif replacement in source:
              print('A-FA21R1 correction already present; no change needed.')
          else:
              raise SystemExit('Guard failed: regression source differs from audited version; no patch applied.')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = 'scripts/validation/repo_regression_checks.py'
          fi

      - name: Verify eligible-bucket regression safety
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validation/repo_regression_checks.py
          python3 scripts/validation/dual_eligibility_pipeline.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit isolated test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'free-agent-utility-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- scripts/validation/repo_regression_checks.py
          if git diff --cached --quiet; then
            echo 'Correction already present. Nothing to commit.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = 'scripts/validation/repo_regression_checks.py'
          git commit -m 'Fix stale Pearce eligibility regression after A-ID03 correction'
          test "$(git diff --name-only HEAD~1 HEAD)" = 'scripts/validation/repo_regression_checks.py'
          git push origin HEAD:main
