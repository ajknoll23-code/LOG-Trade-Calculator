name: CAL26 V1R70 - Same-Source Year0 Surplus and Dynasty Scale Boundary (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r70-samesource-year0-research
  cancel-in-progress: false
jobs:
  same-source-surplus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout read-only frozen research reference
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download exact R61 multi-year and frozen FV context
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R61_OWNER_REVIEW_518_SCALE_SCENARIOS_NOT_FV
        run-id: 40059837648
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r70-input/R61
    - name: Download exact R69 2026 single-source ROS holdout context
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R69_WEEK6_ROS_EMPIRICAL_HOLDOUT_RESEARCH_FV_HOLD
        run-id: 40098428241
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r70-input/R69
    - name: Compare like-scored 2026 full-year forecasts with replacement and dynasty FV (no repricing)
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_R70_engine.py\" <<'PY_R70_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"CAL26 R70: 2026 same-source ROS/replacement bridge. Research only, no pricing.\"\"\
        \"\nimport argparse,collections,csv,hashlib,json,math,pathlib,statistics\n\nPOS=('QB','RB','WR','TE','DL','LB','DB')\n\
        PIN={\n 'R69':{\n  'CAL26_V1R69_manifest.json':'6831b830ef06a16cbacbcb7793c941811d9e6b813c3ffb04282475f0e853b09b',\n\
        \  'CAL26_V1R69_518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv':'f97ed14bc1ee9eb393860520beb9c8cd0ed861d5e6c69e193f712c3a166f18c9',\n\
        \  'CAL26_V1R69_7position_2025_outer_ROS_calibration.csv':'043ff55bea86174c092b92642b07023195242942a95de9844ddb9eab0ff6034d'},\n\
        \ 'R61':{\n  'CAL26_V1R61_manifest.json':'5632c5d440882bfeedd411aa020ef289c3d2be15cfbbc22f26c83cb8db191923',\n\
        \  'CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv':'deb362dbc4718f4ecf4837a34d17a349b29f9fc04d2657cbd1543b9d864e2ae2'}\n\
        }\nEXPECTED={'R69':'WEEK6_ROS_CHRONOLOGICAL_HOLDOUT_RESEARCH_ONLY_FV_HOLD','R61':'TWO_HORIZON_OWNER_REVIEW_SCENARIO_NOT_FV__PRODUCTION_HOLD'}\n\
        \ndef req(ok,msg):\n if not ok:raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\n\
        def load(base,group):\n p=pathlib.Path(base);buf={}\n for name,pin in PIN[group].items():\n  data=(p/name).read_bytes()\n\
        \  if pin:req(sha(data)==pin,'PIN_DRIFT_'+group+'_'+name)\n  buf[name]=data\n m=json.loads(buf[f'CAL26_V1{group}_manifest.json'])\n\
        \ req(m.get('semantic_status')==EXPECTED[group],group+'_STATUS_CHANGE')\n req(m.get('production_change_authorized')\
        \ is False,group+'_PRODUCTION_CHANGED')\n if group=='R69':\n  req(m['n_2026_candidates']==518 and m['2026_observed_players']==495,'R69_SAMPLE_CHANGED')\n\
        \  req(m.get('future_2026_actual_weeks7_18_read') is False and m['cardinal_FV_calibration_complete']\
        \ is False,'R69_HOLD')\n  req(m.get('frozen_fullseason_projection_scoring_and_snapshot_vintage_certified')\
        \ is False,'R69_PROJECTION_VINTAGE_CHANGED')\n else:\n  req(m.get('n_full_projected_players')==518\
        \ and m.get('scenario_scale_empirically_calibrated') is False,'R61_SCALE_CONTRACT')\n rows={}\n for\
        \ name,data in buf.items():\n  if name.endswith('.csv'):\n   rows[name]=list(csv.DictReader(data.decode('utf-8-sig').splitlines()))\n\
        \ return m,rows\n\ndef fval(row,key,nullable=False):\n v=row.get(key,'')\n if nullable and (v is None\
        \ or str(v).strip()==''):return None\n x=float(v);req(math.isfinite(x), 'NONFINITE_'+key);return x\n\
        \ndef asrank(vals,measure,reverse=True):\n # Deterministic competition ranks with ties using full precision;\
        \ do not break ties alphabetically.\n ordered=sorted(vals,key=lambda x:(-measure(x) if reverse else\
        \ measure(x),x['name']))\n d={};last=None;rank=0\n for i,r in enumerate(ordered,1):\n  score=measure(r)\n\
        \  if last is None or score!=last:rank=i;last=score\n  d[r['name']]=rank\n return d\n\ndef spearman(a,b):\n\
        \ # Pearson correlation of rank vectors. Returns None on constant data.\n if len(a)<3:return None\n\
        \ x=sum(a)/len(a);y=sum(b)/len(b)\n xx=sum((v-x)**2 for v in a);yy=sum((v-y)**2 for v in b)\n return\
        \ sum((u-x)*(v-y) for u,v in zip(a,b))/(xx*yy)**.5 if xx>0 and yy>0 else None\n\ndef outcsv(path,rows,cols):\n\
        \ with path.open('w',newline='') as f:\n  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore',lineterminator='\\\
        n');w.writeheader();w.writerows(rows)\n\ndef run(args):\n m69,r69=load(args.r69,'R69');m61,r61=load(args.r61,'R61')\n\
        \ data=r69['CAL26_V1R69_518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv']\n old=r61['CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv']\n\
        \ hold=r69['CAL26_V1R69_7position_2025_outer_ROS_calibration.csv']\n req(len(data)==len(old)==518 and\
        \ len(hold)==7,'ROW_COUNT')\n k=lambda r:(r['name'].lower().strip(),r['position'])\n req(len(set(map(k,data)))==len(set(map(k,old)))==518,'DUPLICATE_IDENTITY')\n\
        \ b61={k(r):r for r in old};b69={k(r):r for r in data}\n req(set(b61)==set(b69),'R61_R69_IDENTITY_SET_MISMATCH')\n\
        \ bypos=collections.defaultdict(list);allrows=[];report=[]\n for a in data:\n  v=b61[k(a)];pos=a['position'];req(pos\
        \ in POS,'UNKNOWN_POSITION')\n  fv=fval(a,'frozen_FV_UNCHANGED');fv61=fval(v,'frozen_FV_REFERENCE_ONLY')\n\
        \  req(abs(fv-fv61)<.01,'FROZEN_FV_DRIFT_'+a['name'])\n  req(a['live_player_FV_or_index_changed']=='False'\
        \ and a['production_change_authorized']=='False','R69_ROW_WRITE_FLAG')\n  req(a['preseason_to_historical_LOG_transfer_validated']=='False','INVALID_SOURCE_MERGE')\n\
        \  raw=a['2026_week1_6_corrected_LOG_points'];active=bool(raw.strip())\n  obs=fval(a,'2026_week1_6_corrected_LOG_points')\
        \ if active else None\n  ros=fval(a,'2026_week7_18_preferred_holdout_gated_research_points',nullable=True)\n\
        \  full=fval(a,'2026_fullseason_corrected_actual_plus_research_ROS_POINTS',nullable=True)\n  ctrl=fval(a,'2026_week7_18_simple_YTD12_control_points',nullable=True)\n\
        \  req((obs is None)==(ros is None)==(full is None),'INCOMPLETE_2026_POINTS')\n  if obs is not None:\n\
        \   req(abs(full-obs-ros)<.002,'ROS_ADDITIVITY_'+a['name'])\n   req(-100<=obs<=900 and 0<=ros<=1000\
        \ and -100<=full<=1200,'POINTS_RANGE')\n  rank=int(v['lineup_reference_rank']);req(1<=rank<=85,'INVALID_REFERENCE_RANK')\n\
        \  req(a['2025_outer_position_model_accepted']=='True','2025_POSITION_HOLDOUT_NOT_WON')\n  row={'name':a['name'],'position':pos,'sleeper_id':a['sleeper_id'],\n\
        \    'frozen_FV_UNCHANGED':int(round(fv)),'R61_replacement_rank_assumption':rank,\n    '2026_week1_6_2026rule_scored_points':obs,\n\
        \    '2026_week7_18_validated_form_research_ROS_points':ros,\n    '2026_fullseason_single_source_research_points':full,\n\
        \    '2026_simple_YTD18_points':(obs+ctrl) if obs is not None else None,\n    'research_year0_surplus_above_2026_position_reference':None,\n\
        \    'research_year0_surplus_clipped_at_zero':None,\n    'same_position_2026_ROS_points_rank':None,'same_position_frozen_FV_rank':None,\n\
        \    'FV_rank_minus_2026_ROS_rank':None,\n    '2026_replacement_reference_points_NOT_VINTAGE_FROZEN':None,\n\
        \    '2026_frozen_preseason_projection_INCOMPATIBLE_POINTS':a['2026_frozen_fullseason_projection_SCORING_AND_VINTAGE_UNVERIFIED'],\n\
        \    'R61_H1_2027_surplus_model_RESEARCH_ONLY':v['2027_model_surplus_proxy'],\n    'R61_H2_2028_surplus_model_RESEARCH_ONLY':v['2028_model_surplus_proxy'],\n\
        \    'H1_H2_prospective_transfer_validated':False,\n    'player_specific_2026_forecast_vs_2025_actual_independently_validated':False,\n\
        \    'dynasty_age_role_and_durability_2026_forecast_integrated':False,\n    'cross_position_cardinal_scale_empirically_identified':False,\n\
        \    'FUNDAMENTAL_VALUE_CANDIDATE': '',\n    'production_change_authorized':False,\n    'eligibility':'NO_WEEK6_OBSERVATIONS_HOLD'\
        \ if obs is None else 'YEAR0_RESEARCH_ONLY_NO_FV'}\n  allrows.append(row);bypos[pos].append(row)\n\
        \ req(sum(r['2026_fullseason_single_source_research_points'] is not None for r in allrows)==495,'OBSERVED_COUNT')\n\
        \ h={r['position']:r for r in hold};req(set(h)==set(POS),'HOLDOUT_POSITION_COVERAGE')\n for pos in\
        \ POS:\n  p=bypos[pos];n=len(p);rk=set(r['R61_replacement_rank_assumption'] for r in p)\n  req(len(rk)==1,'MULTIPLE_R61_POSITION_REFERENCES_'+pos)\n\
        \  rank=rk.pop();valid=[x for x in p if x['2026_fullseason_single_source_research_points'] is not None]\n\
        \  req(len(valid)>=rank+3,'REFERENCE_OUTSIDE_OBSERVED_POOL_'+pos)\n  model=sorted(valid,key=lambda\
        \ r:(-r['2026_fullseason_single_source_research_points'],r['name']))\n  replacement=model[rank-1]['2026_fullseason_single_source_research_points']\n\
        \  req(replacement>0,'DEGENERATE_REPLACEMENT_'+pos)\n  rforecast=asrank(valid,lambda r:r['2026_fullseason_single_source_research_points'])\n\
        \  rfv=asrank(p,lambda r:r['frozen_FV_UNCHANGED'])\n  for row in p:\n   row['same_position_frozen_FV_rank']=rfv[row['name']]\n\
        \   if row['2026_fullseason_single_source_research_points'] is not None:\n    row['same_position_2026_ROS_points_rank']=rforecast[row['name']]\n\
        \    row['FV_rank_minus_2026_ROS_rank']=rfv[row['name']]-rforecast[row['name']]\n    surplus=row['2026_fullseason_single_source_research_points']-replacement\n\
        \    row['research_year0_surplus_above_2026_position_reference']=round(surplus,3)\n    row['research_year0_surplus_clipped_at_zero']=round(max(surplus,0),3)\n\
        \   row['2026_replacement_reference_points_NOT_VINTAGE_FROZEN']=round(replacement,3)\n  hpos=h[pos];req(hpos['fixed_model_beats_both_by_atleast1pct']=='True','HOLDOUT_GAIN_DRIFT_'+pos)\n\
        \  xrank=[row['same_position_2026_ROS_points_rank'] for row in valid];frank=[row['same_position_frozen_FV_rank']\
        \ for row in valid]\n  posreport={'position':pos,'2026_pool_players':n,'matched_2026_Week6_players':len(valid),\n\
        \   'R61_lineup_replacement_rank_assumption':rank,\n   '2026_same_source_replacement_points':round(replacement,3),\n\
        \   '2025_outer_holdout_N':int(hpos['2025_untouched_outer_week6_seen_n']),\n   '2025_ROS_model_gain_vs_YTD_MSE_pct':fval(hpos,'2025_outer_gain_vs_YTD_pct'),\n\
        \   '2026_count_positive_year0_surplus':sum(row['research_year0_surplus_clipped_at_zero']>0 for row\
        \ in valid),\n   '2026_ROS_rank_vs_frozen_FV_rank_spearman':round(spearman(xrank,frank),4),\n   'players_rank_disagreement_ge_10':sum(abs(row['FV_rank_minus_2026_ROS_rank'])>=10\
        \ for row in valid),\n   '2026_reference_is_assumption_not_empirically_calibrated':True,\n   'cross_position_FV_value_production_change_authorized':False}\n\
        \  report.append(posreport)\n req(len(allrows)==518 and len(report)==7,'FINAL_SCOPE')\n req(all(r['FUNDAMENTAL_VALUE_CANDIDATE']==''\
        \ and r['production_change_authorized'] is False for r in allrows),'ILLEGAL_FV_RELEASE')\n # Select\
        \ audit cases from rank disagreements, not price expectations. No player labels used to fit model.\n\
        \ audit=[r for r in allrows if r['FV_rank_minus_2026_ROS_rank'] is not None]\n audit.sort(key=lambda\
        \ r:(-abs(r['FV_rank_minus_2026_ROS_rank']),r['position'],r['name']))\n owner=audit[:40]\n dst=pathlib.Path(args.out);dst.mkdir(exist_ok=True,parents=True)\n\
        \ def shapenumbers(r):\n  out={}\n  for k,v in r.items():out[k]='' if v is None else v\n  return out\n\
        \ name1='CAL26_R70_518_single_source_2026_surplus_NO_FV.csv';name2='CAL26_R70_7_position_replacement_and_rank_decision.csv';name3='CAL26_R70_40_owner_research_diagnostics_NO_FV.csv';name4='CAL26_R70_decision.md'\n\
        \ outcsv(dst/name1,[shapenumbers(r) for r in allrows],list(allrows[0]))\n outcsv(dst/name2,report,list(report[0]))\n\
        \ outcsv(dst/name3,[shapenumbers(r) for r in owner],list(allrows[0]))\n # Never present model as a\
        \ validated multi-year dynasty ranking: it is year0 only and omits injury, age, role.\n md=['# CAL26\
        \ R70 \u2014 2026 same-source year-0 surplus and existing-FV ordinal mismatch','',\n '**Decision: YEAR0_SURPLUS_SAME_SOURCE__DYNASTY_FV_HOLD.**','',\n\
        \ '- Uses corrected Weeks 1\u20136 production plus 2025-out-of-sample-tested ROS model from R69, in\
        \ comparable reconstructed LOG-rule units.',\n '- Replacement rank is the **existing R61 roster-demand\
        \ assumption**, applied to the R69 same-source 2026 projected player distribution; the resulting replacement\
        \ **points are not calibrated market values**.',\n '- The R69 2026 projections are based on historical\
        \ 2024\u21922025 LOG-like scoring, whose historical official-score parity remains unverified. 2026\
        \ six-week rostered overlap passed 2620/2620.',\n '- Historical 2027/2028 proxies from R61 are carried\
        \ separately as *unverified transfer*. They are **not added** to current-year surplus.',\n '- Existing\
        \ FV is used only for **ordinal disagreement diagnostics**; no training targets, price multipliers,\
        \ percentile price remaps, or new FV values are created.',\n '- No age/role/injury-context ranking\
        \ is inferred from year-0; Bryce Young, Brian Burns and rookies cannot be dynasty repriced from this\
        \ calculation.',\n '- No sealed 2026 Weeks 7\u201318 results used, no live writes, no production FV\
        \ modifications.','',\n '| Pos | Matched / pool | Ref rank (assumed) | 2026 ref points | Holdout MSE\
        \ gain | Rank rho vs frozen FV | >=10 rank gaps |',\n '|---|---:|---:|---:|---:|---:|---:|']\n for\
        \ r in report:\n  md.append(f\"|{r['position']}|{r['matched_2026_Week6_players']}/{r['2026_pool_players']}|{r['R61_lineup_replacement_rank_assumption']}|{r['2026_same_source_replacement_points']:.1f}|{r['2025_ROS_model_gain_vs_YTD_MSE_pct']:+.1f}%|{r['2026_ROS_rank_vs_frozen_FV_rank_spearman']:.3f}|{r['players_rank_disagreement_ge_10']}|\"\
        )\n md+=['','**Next release-critical step:** add an age/availability/role-aware empirical multi-year\
        \ bridge *before* selecting any player FV deltas, then use existing documented FV scale as a fixed\
        \ production anchor (not a made-up point multiplier). Propose only reversible, owner-reviewed changes\
        \ after historical validation.', '']\n (dst/name4).write_text('\\n'.join(md))\n manifest={'workflow':'CAL26\
        \ V1R70','status':'YEAR0_SURPLUS_SAME_SOURCE__DYNASTY_FV_HOLD',\n  'n_2026_candidates':518,'n_2026_observed':495,'n_pos':7,\n\
        \  'source_artifacts':{'R69_run':40098428241,'R61_run':40059837648},\n  'all_positions_ROS_2025_outer_won':True,'preseason_snapshot_vintage_and_scoring_transfer_certified':False,\n\
        \  'historical_2024_2025_official_points_fully_certified':False,\n  'age_role_availability_future_season_model_integrated':False,'three_year_fv_calibrated':False,\n\
        \  'previously_frozen_prices_modified':False,'owner_market_values_as_training_targets':False,\n  'arbitrary_point_multiplier_used':False,'produced_new_FV_price_candidate':False,\n\
        \  'future_2026_actuals_read':False,'index_html_modified':False,'production_change_authorized':False,\n\
        \  'input_sha256':{g:{k:sha((pathlib.Path(getattr(args,g.lower()))/k).read_bytes()) for k in PIN[g]}\
        \ for g in PIN},\n  'output_sha256':{k:sha((dst/k).read_bytes()) for k in (name1,name2,name3,name4)}}\n\
        \ (dst/'CAL26_R70_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')\n\
        \ print('\\n'.join(md))\n print('CAL26_R70_GREEN_INVARIANTS n=518 observed=495 same_source_projection\
        \ yes new_prices=0')\n\ndef selftest():\n r=[{'name':'a','p':5},{'name':'b','p':7},{'name':'c','p':7}]\n\
        \ req(asrank(r,lambda x:x['p'])=={'b':1,'c':1,'a':3},'RANK_TIE_TEST')\n req(round(spearman([1,2,3],[3,2,1]),8)==-1,'SPEARMAN_TEST')\n\
        \ req(round(spearman([1,2,3],[1,2,3]),8)==1,'SPEARMAN_IDENTITY_TEST')\n print('SELFTEST_GREEN tied-ranks,\
        \ correlations, strict gates')\nif __name__=='__main__':\n ap=argparse.ArgumentParser();ap.add_argument('--r69');ap.add_argument('--r61');ap.add_argument('--out');ap.add_argument('--selftest',action='store_true');args=ap.parse_args()\n\
        \ if args.selftest:selftest()\n else:run(args)\nPY_R70_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_R70_engine.py\"\
        \npython \"$RUNNER_TEMP/CAL26_R70_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_R70_engine.py\"\
        \ \\\n  --r69 \"$RUNNER_TEMP/cal26-r70-input/R69\" \\\n  --r61 \"$RUNNER_TEMP/cal26-r70-input/R61\"\
        \ \\\n  --out \"$RUNNER_TEMP/cal26-r70-results\"\npython - \"$RUNNER_TEMP/cal26-r70-results\" <<'PY_R70_VERIFY'\n\
        import csv,hashlib,json,pathlib,sys\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R70_manifest.json').read_text())\n\
        assert m['status']=='YEAR0_SURPLUS_SAME_SOURCE__DYNASTY_FV_HOLD'\nassert m['n_2026_candidates']==518\
        \ and m['n_2026_observed']==495 and m['n_pos']==7\nassert m['all_positions_ROS_2025_outer_won'] is\
        \ True\nfor prohibited in ('three_year_fv_calibrated','produced_new_FV_price_candidate','arbitrary_point_multiplier_used','future_2026_actuals_read','index_html_modified','production_change_authorized','previously_frozen_prices_modified'):\n\
        \ assert m[prohibited] is False,prohibited\nfor name,digest in m['output_sha256'].items():\n assert\
        \ hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,name\nrows=list(csv.DictReader((p/'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv').open()))\n\
        assert len(rows)==518 and sum(r['eligibility']=='YEAR0_RESEARCH_ONLY_NO_FV' for r in rows)==495\nassert\
        \ all(r['FUNDAMENTAL_VALUE_CANDIDATE']=='' and r['production_change_authorized']=='False' for r in\
        \ rows)\nprint('CAL26_R70_REAL_ARTIFACT_GATES_GREEN_518_OBSERVED_495_NO_FV')\nPY_R70_VERIFY\ntest -z\
        \ \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r70-results/CAL26_R70_decision.md\" >> \"\
        $GITHUB_STEP_SUMMARY\"\n"
    - name: Upload R70 same-source year0 surplus research with full hold
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R70_SINGLE_SOURCE_YEAR0_SURPLUS_AND_SCALE_HOLD
        path: ${{ runner.temp }}/cal26-r70-results/
        retention-days: 60
        if-no-files-found: warn
