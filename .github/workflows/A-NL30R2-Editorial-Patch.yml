                          f'The contribution is supported by Sleeper’s starting-lineup list and player points. It is a substantial piece of a {margin:.2f}-point game, but not evidence that a different legal lineup would have changed the result.',
                          f'How much of {club}’s weekly production depended on that single verified starter?',
