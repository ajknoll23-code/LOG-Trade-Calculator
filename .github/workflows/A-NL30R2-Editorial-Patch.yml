name: A-NL30R2 - LOG Final Editorial Intelligence Review (Read Only)
run-name: A-NL30R2 W${{ inputs.war_week }}/W${{ inputs.aftermath_week }} - factual player stories + blind NL29 comparison

'on':
  workflow_dispatch:
    inputs:
      war_week:
        description: 'War Room week; one week after completed Aftermath week'
        required: true
        type: string
        default: '9'
      aftermath_week:
        description: 'Completed NFL Aftermath week'
        required: true
        type: string
        default: '8'

permissions:
  contents: read

concurrency:
  group: log-nl30-editorial-shadow-readonly
  cancel-in-progress: false

jobs:
  nl30-editorial-shadow:
    name: Both live editions, source integrity and blinded comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF renderer and inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'weasyprint==68.0' 'pymupdf==1.26.5'
      - name: Stage full NL30 engine in runner temp, run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/log_nl30_editorial.py" <<'NL30_ENGINE'
          #!/usr/bin/env python3
          """A-NL29R1: editorial polish with strict read-only PDF acceptance."""
          from __future__ import annotations
          import argparse
          import base64
          from collections import defaultdict
          from datetime import datetime, timezone
          from decimal import Decimal, ROUND_HALF_UP
          from html import escape
          import hashlib
          import json
          from pathlib import Path
          import re
          import statistics
          import time
          from urllib.request import Request, urlopen

          LEAGUE_ID = '1326679131051532288'
          SEASON = '2026'
          API = 'https://api.sleeper.app/v1/'


          def money(n):
              return str(Decimal(str(n)).quantize(Decimal('.01'), rounding=ROUND_HALF_UP))


          def get(path):
              for attempt in range(3):
                  try:
                      req = Request(API + path, headers={'User-Agent': 'LOG-NL24R1-Shadow/1.0'})
                      with urlopen(req, timeout=25) as response:
                          return json.load(response)
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(attempt + 1)


          def matchups(rows, team_ids, scored):
              if not isinstance(rows, list) or len(rows) != 12:
                  raise RuntimeError('Required: twelve Sleeper matchup records')
              groups = defaultdict(list)
              for row in rows:
                  if row.get('matchup_id') is None:
                      raise RuntimeError('Missing matchup id')
                  groups[str(row['matchup_id'])].append(row)
              if len(groups) != 6 or any(len(v) != 2 for v in groups.values()):
                  raise RuntimeError('Required: six complete head-to-head matchups')
              all_ids = [int(r['roster_id']) for group in groups.values() for r in group]
              if len(set(all_ids)) != 12 or set(all_ids) != set(team_ids):
                  raise RuntimeError('Duplicate or unexpected team IDs')
              games = []
              for group in groups.values():
                  a, b = sorted(group, key=lambda r: int(r['roster_id']))
                  if scored:
                      for row in (a, b):
                          raw = row.get('custom_points')
                          if raw is None:
                              raw = row.get('points')
                          if raw is None or not isinstance(raw, (int, float)) or raw < 0:
                              raise RuntimeError('Incomplete or invalid scored matchup')
                  games.append((a, b))
              return sorted(games, key=lambda pair: int(pair[0]['matchup_id']))


          def resolve_names(rosters, users):
              owners = {str(u.get('user_id')):u for u in users}
              names = {}
              for roster in rosters:
                  u = owners.get(str(roster.get('owner_id')), {})
                  name = ((u.get('metadata') or {}).get('team_name') or u.get('display_name')
                          or 'Team ' + str(roster.get('roster_id')))
                  names[int(roster['roster_id'])] = str(name).strip()
              if len(names) != 12 or len(set(names.values())) != 12:
                  raise RuntimeError('Required: twelve uniquely named teams')
              return names


          def score(row):
              val = row.get('custom_points')
              if val is None:
                  val = row.get('points')
              return Decimal(str(val))


          def snapshot(pre_week, post_week):
              if pre_week != post_week + 1:
                  raise RuntimeError('Comparison must use adjoining War Room and Aftermath weeks')
              state, league = get('state/nfl'), get('league/' + LEAGUE_ID)
              if str(state.get('season')) != SEASON or str(league.get('season')) != SEASON:
                  raise RuntimeError('2026 Sleeper season/league mismatch')
              if pre_week > int(state.get('week') or 0):
                  raise RuntimeError('Pregame week not available in current Sleeper season')
              names = resolve_names(get(f'league/{LEAGUE_ID}/rosters'), get(f'league/{LEAGUE_ID}/users'))
              hist = {rid: [] for rid in names}
              results = []
              standings_at = {}
              for week in range(1, pre_week+1):
                  raw = get(f'league/{LEAGUE_ID}/matchups/{week}')
                  games = matchups(raw, names, scored=week<pre_week)
                  if week < pre_week:
                      weekly = {}
                      for a,b in games:
                          ia,ib = int(a['roster_id']),int(b['roster_id'])
                          pa,pb = score(a), score(b)
                          hist[ia].append(pa); hist[ib].append(pb)
                          weekly[ia] = pa;weekly[ib] = pb
                      median = statistics.median(weekly.values())
                      results.append({'week':week, 'median':median, 'scores':weekly,
                          'pairs':[(int(a['roster_id']),int(b['roster_id'])) for a,b in games]})
                  else:
                      current_pairs = [(int(a['roster_id']),int(b['roster_id'])) for a,b in games]
              def standings(until):
                  rec = {i:{'wins':Decimal(0),'losses':Decimal(0),'ties':Decimal(0),'pf':Decimal(0)} for i in names}
                  for item in results[:until]:
                      pts,med = item['scores'],item['median']
                      for a,b in item['pairs']:
                          for x,y in ((a,b),(b,a)):
                              if pts[x]>pts[y]:rec[x]['wins']+=1
                              elif pts[x]<pts[y]:rec[x]['losses']+=1
                              else:rec[x]['ties']+=1
                      for rid,n in pts.items():
                          rec[rid]['pf']+=n
                          if n>med:rec[rid]['wins']+=1
                          elif n<med:rec[rid]['losses']+=1
                          else:rec[rid]['ties']+=1
                  order=sorted(rec,key=lambda i:(-rec[i]['wins'],-rec[i]['pf'],i))
                  return rec,{rid:k+1 for k,rid in enumerate(order)}
              before,rankbefore = standings(max(0,post_week-1))
              after,rankafter = standings(post_week)
              rows = []
              for ia,ib in current_pairs:
                  if len(hist[ia])!=post_week or len(hist[ib])!=post_week:
                      raise RuntimeError('Pregame features incomplete')
                  rows.append({'id_a':ia,'id_b':ib,'name_a':names[ia],'name_b':names[ib],
                    'scores_a':[float(x) for x in hist[ia]],'scores_b':[float(x) for x in hist[ib]],
                    'record_a':f"{int(after[ia]['wins'])}-{int(after[ia]['losses'])}-{int(after[ia]['ties'])}",
                    'record_b':f"{int(after[ib]['wins'])}-{int(after[ib]['losses'])}-{int(after[ib]['ties'])}",
                    'rank_a':rankafter[ia],'rank_b':rankafter[ib]})
              last = results[post_week-1]
              recap = []
              for ia,ib in last['pairs']:
                  pa,pb = last['scores'][ia], last['scores'][ib]
                  recap.append({'id_a':ia,'id_b':ib,'name_a':names[ia],'name_b':names[ib],
                      'score_a':money(pa),'score_b':money(pb),
                      'median_a':'W' if pa>last['median'] else 'L' if pa<last['median'] else 'T',
                      'median_b':'W' if pb>last['median'] else 'L' if pb<last['median'] else 'T',
                      'rank_delta_a':rankbefore[ia]-rankafter[ia],
                      'rank_delta_b':rankbefore[ib]-rankafter[ib],
                      'prior_rank_a':rankbefore[ia], 'prior_rank_b':rankbefore[ib],
                      'rank_a':rankafter[ia], 'rank_b':rankafter[ib]})
              stamp = datetime.now(timezone.utc).isoformat(timespec='seconds')
              return {'generated_at_utc':stamp,'season':SEASON,'league_id':LEAGUE_ID,
                'league':str(league.get('name') or 'League of Ordinary Gentlemen'),
                'war_week':pre_week,'aftermath_week':post_week,
                'war_games':rows,'after_games':recap,'median':money(last['median']),
                'standings_label':'Provisional reconstruction: combined H2H + median wins, then PF; official tie-break parity unconfirmed',
                'source':'Sleeper public league matchups, rosters and users; historical scored weeks 1-'+str(post_week),
                'snapshot_sha256':'will_be_computed_at_serialization'}


          def recent(a):
              return statistics.mean(a[-3:])



          # Editorial engine: public Sleeper snapshots, verifiable starter points and robust story selection.
          import argparse
          import math
          import os
          import sys
          from collections import Counter
          from itertools import product


          def logo_source(root):
              """Use the existing embedded LOG logo; never generate or substitute a new one."""
              path = root / 'index.html'
              if not path.is_file():
                  raise RuntimeError('Original LOG site logo source missing: index.html')
              m = re.search(r'<img\s+src="(data:image/png;base64,[^"]+)"[^>]*class="league-logo"', path.read_text(encoding='utf-8'), re.I)
              if not m:
                  raise RuntimeError('Original embedded LOG logo not found; refusing to replace')
              uri = m.group(1)
              raw = base64.b64decode(uri.split(',', 1)[1], validate=True)
              if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise RuntimeError('Invalid LOG logo bytes')
              return uri, hashlib.sha256(raw).hexdigest()


          def rostered_identity(root):
              """Identity-only data from actual league rosters, never the private scouting/FA board."""
              path = root / 'data' / 'league_rosters.json'
              if not path.is_file():
                  return {}
              raw = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(raw, dict) and raw.get('league_id') and str(raw['league_id']) != LEAGUE_ID:
                  return {}
              identities = {}
              for roster in raw.get('rosters', []) if isinstance(raw, dict) else []:
                  for key in ('starters', 'bench', 'taxi', 'reserve_ir'):
                      for p in roster.get(key) or []:
                          if isinstance(p, dict) and p.get('player_id') and p.get('name'):
                              identities[str(p['player_id'])] = {'name':str(p['name']), 'position':str(p.get('position') or '')}
              return identities


          def player_lenses(root, after_week, team_ids, fetcher=get):
              """Completed Sleeper starter points only. Unknown player identities are suppressed."""
              identities = rostered_identity(root)
              starts = defaultdict(lambda: defaultdict(list))
              last = defaultdict(list)
              if not identities:
                  return {'recent': {}, 'final': {}, 'data_status':'No verified league-roster identity cache; all player claims withheld'}
              for week in range(max(1, after_week-2), after_week+1):
                  rows = fetcher(f'league/{LEAGUE_ID}/matchups/{week}')
                  games = matchups(rows, team_ids, scored=True)
                  for pair in games:
                      for row in pair:
                          rid = int(row['roster_id'])
                          scores = row.get('players_points') or {}
                          if not isinstance(scores, dict):
                              continue
                          for pid in row.get('starters') or []:
                              pid = str(pid)
                              if pid not in identities:
                                  continue
                              val = scores.get(pid)
                              if isinstance(val, (int,float)) and math.isfinite(val):
                                  entry = {'player_id':pid,'name':identities[pid]['name'],
                                           'position':identities[pid]['position'], 'week':week,
                                           'points':round(float(val),2)}
                                  starts[rid][pid].append(entry)
                                  if week == after_week:
                                      last[rid].append(entry)
              recent,final = {},{}
              for rid in team_ids:
                  options = []
                  for pid, entries in starts[rid].items():
                      if len(entries) >= 2:
                          options.append({'name':entries[0]['name'],'position':entries[0]['position'],
                              'starts':len(entries),'total':round(sum(x['points'] for x in entries),2),
                              'weeks':[x['week'] for x in entries]})
                  options.sort(key=lambda x:(-x['total'],-x['starts'],x['name']))
                  if options:
                      recent[str(rid)] = options[0]
                  if last[rid]:
                      final[str(rid)] = sorted(last[rid],key=lambda x:(-x['points'],x['name']))[0]
              return {'recent':recent, 'final':final,
                      'data_status':f'Verified only against {len(identities)} known rostered player identities and Sleeper completed-week starter points'}


          def mean(a):
              return sum(a)/len(a) if a else 0.0


          def f2(x):
              return money(x)


          def records_parts(value):
              a=value.split('-')
              return int(a[0]),int(a[1]),int(a[2]) if len(a)>2 else 0


          def war_facts(g, week, players):
              a,b = g['scores_a'],g['scores_b']
              assert len(a)==len(b)==week-1 and len(a)>=3
              n = 3
              ra, rb = mean(a[-n:]),mean(b[-n:])
              prior_a,prior_b = mean(a[-6:-3]) if len(a)>=6 else None, mean(b[-6:-3]) if len(b)>=6 else None
              return {'game':g,'window':f'Weeks {week-3}–{week-1}', 'season_window':f'Weeks 1–{week-1}',
                  'ave_a':ra,'ave_b':rb,'gap':abs(ra-rb), 'range_a':max(a[-3:])-min(a[-3:]),
                  'range_b':max(b[-3:])-min(b[-3:]),'high_a':max(a[-3:]),'high_b':max(b[-3:]),
                  'low_a':min(a[-3:]),'low_b':min(b[-3:]),
                  'season_a':mean(a),'season_b':mean(b),'latest_a':a[-1],'latest_b':b[-1],
                  'latest_change_a':a[-1]-mean(a[-4:-1]) if len(a)>=4 else None,
                  'latest_change_b':b[-1]-mean(b[-4:-1]) if len(b)>=4 else None,
                  'prior_a':prior_a,'prior_b':prior_b,
                  'trend_a':ra-prior_a if prior_a is not None else None,
                  'trend_b':rb-prior_b if prior_b is not None else None,
                  'p_a':players['recent'].get(str(g['id_a'])),
                  'p_b':players['recent'].get(str(g['id_b'])),
                  'record_a':records_parts(g['record_a']), 'record_b':records_parts(g['record_b'])}


          def entry(angle,score,headline,lead,why,question,keys):
              return {'angle':angle,'priority':round(score,3),'headline':headline,'lead':lead,
                      'why':why,'question':question,'keys':keys}


          def pre_candidates(f):
              g=f['game'];a,b=g['name_a'],g['name_b'];avea,aveb=f['ave_a'],f['ave_b'];gap=f['gap']
              top=a if avea>=aveb else b;other=b if top==a else a
              topave=max(avea,aveb);otherave=min(avea,aveb)
              rank_a,rank_b=g['rank_a'],g['rank_b']
              wa,la,_=f['record_a'];wb,lb,_=f['record_b']
              window=f['window'];options=[]
              if (rank_a == 1 or rank_b == 1) and max(rank_a,rank_b) >= 4:
                  leader = a if rank_a == 1 else b
                  challenger = b if leader == a else a
                  leader_record = g['record_a'] if leader == a else g['record_b']
                  leader_average = avea if leader == a else aveb
                  other_average = aveb if leader == a else avea
                  under_last = f['latest_b'] if leader == a else f['latest_a']
                  options.append(entry('leader under challenge',183+min(gap,70)/5,
                      'The No. 1 Team Meets an Unsettled Challenger',
                      f'{leader} holds provisional first place at {leader_record} and has averaged {leader_average:.2f} over {window}. {challenger} enters after scoring {under_last:.2f} last week.',
                      f'The league leader’s advantage is {abs(leader_average-other_average):.2f} points per week in recent form. But the challenger has already posted weekly scores of its own; the real question is whether last week was a low point or a new baseline, not whether the top seed carries the better record.',
                      f'Can {challenger} approach its {other_average:.2f}-point recent average and make No. 1 defend that position?',
                      ['provisional_rank','combined_record','recent_means','latest_score']))
              if rank_a<=3 and rank_b<=3:
                  options.append(entry('title race',190+gap/5,'The Leaders Are About to Test Each Other',
                      f'This is a meeting of provisional No. {rank_a} {a} and No. {rank_b} {b}, carrying {g["record_a"]} and {g["record_b"]} combined H2H-and-median records.',
                      f'The standings make both contenders; {window} scoring gives {top} a {gap:.2f}-point weekly advantage ({topave:.2f} to {otherave:.2f}). The difference matters because the head-to-head result affects the two clubs competing near the top, regardless of which posts the larger weekly total.',
                      f'Watch whether {other} can exceed its recent {otherave:.2f}-point average; this is an observed baseline, not a point spread.',
                      ['rank_a','rank_b','record_a','record_b','ave_a','ave_b']))
              record_leader=a if wa>wb else b if wb>wa else None
              if record_leader and ((record_leader==a and aveb>=avea) or (record_leader==b and avea>=aveb)):
                  options.append(entry('record versus form',175+(15 if gap<=8 else 0), 'Records and Recent Form Disagree',
                      f'{record_leader} owns the better {g["record_a"] if record_leader==a else g["record_b"]} record, yet {top} has outscored its opponent on a weekly-average basis over {window}.',
                      f'The advantage is just {gap:.2f} points per game ({avea:.2f} for {a}; {aveb:.2f} for {b}). That puts the standings argument in tension with recent production without establishing a decisive favorite.',
                      'Which signal holds up this week: the longer-term record or the three-week scoring sample?',
                      ['records','ave_a','ave_b','window']))
              late=[(a,f['latest_change_a'],f['latest_a']),(b,f['latest_change_b'],f['latest_b'])]
              late=[x for x in late if x[1] is not None and x[1]<-22]
              if late:
                  falling,change,last=max(late,key=lambda x:abs(x[1]))
                  options.append(entry('recent reversal',155+min(abs(change),80)/4,f'{falling} Has a One-Week Question to Answer',
                      f'{falling} managed {last:.2f} last week, {abs(change):.2f} below its three preceding completed games.',
                      f'That deviation is more striking than the overall {gap:.2f}-point gap between the clubs’ latest three-week averages. It identifies a recent scoring swing, not a confirmed roster or health cause.',
                      f'Was the dip an outlier, or does {falling} stay below its prior three-game scoring level?',
                      ['latest','previous_three_mean','recent_means']))
              for label,other_name,trend,ave,prev in [(a,b,f['trend_a'],avea,f['prior_a']),(b,a,f['trend_b'],aveb,f['prior_b'])]:
                  if trend is not None and trend>=20:
                      options.append(entry('surging form',137+min(trend,60)/3,f'{label} Is Playing Above Its Earlier Pace',
                          f'{label} has raised its scoring average by {trend:.2f} points a game: {prev:.2f} across the previous three-week block versus {ave:.2f} in {window}.',
                          f'That improvement sharpens the test against {other_name}, whose latest three-week average is {mean(g["scores_b"][-3:]) if label==a else mean(g["scores_a"][-3:]):.2f}. A sustained change would matter more than any single spike.',
                          f'Can {label} maintain that newer scoring level for a fourth consecutive sample week?',
                          ['recent_three','previous_three']))
              diffrange=abs(f['range_a']-f['range_b'])
              if diffrange>=30:
                  steady=a if f['range_a']<f['range_b'] else b
                  variable=b if steady==a else a
                  variable_average = avea if variable==a else aveb
                  steady_average = aveb if variable==a else avea
                  range_interpretation = (
                      f'{variable} also holds the {gap:.2f}-point weekly scoring edge, so {steady} would benefit most if the higher-scoring team landed at the low end of its range.'
                      if variable==top else
                      f'{steady} has the {gap:.2f}-point weekly scoring advantage, while {variable} has needed much larger week-to-week swings to keep pace.')
                  options.append(entry('consistency versus volatility',135+min(diffrange,80)/4,'The Range of Outcomes Is the Real Story',
                      f'{steady} has stayed in a tighter three-week scoring band: {min(f["range_a"],f["range_b"]):.2f} points from high to low, compared with {max(f["range_a"],f["range_b"]):.2f} for {variable}.',
                      f'{range_interpretation} These are completed-week observations ({window}), not forecasts.',
                      f'Will {variable} resemble its {f["high_a"] if variable==a else f["high_b"]:.2f}-point recent high or its {f["low_a"] if variable==a else f["low_b"]:.2f}-point low?',
                      ['three_week_range_a','three_week_range_b','recent_averages']))
              if gap>=28:
                  lowmax=f['high_b'] if top==a else f['high_a']
                  highmin=f['low_a'] if top==a else f['low_b']
                  overlapping=lowmax>=highmin
                  options.append(entry('underdog path',132+min(gap,80)/3,'The Upset Has a Measurable Hurdle',
                      f'{other} trails {top} by {gap:.2f} points per game across {window}, a sizable gap in recent scoring.',
                      f'{other}’s best score in that stretch was {lowmax:.2f}; {top}’s worst was {highmin:.2f}. The observed three-week bands {"overlap" if overlapping else "do not overlap"}, making the upset route {"plausible within the recorded range" if overlapping else "outside the ranges seen in those three games"}.',
                      f'The decisive unknown is whether {other} can surpass its own recent peak or {top} drops below its recent floor.',
                      ['recent_means','three_week_highs','three_week_lows']))
              if gap<=10:
                  options.append(entry('fine margins',133-gap/2,'Not Much Separates These Two on Form',
                      f'Only {gap:.2f} points per week separate {a} ({avea:.2f}) and {b} ({aveb:.2f}) over {window}.',
                      f'That small observed gap deserves more attention than a bold prediction. The clubs may sit in different places in the provisional standings, but this narrower sample offers little scoring separation.',
                      'Will the next result create a clearer gap, or keep recent form close?',
                      ['ave_a','ave_b','window']))
              for key,who in [('p_a',a),('p_b',b)]:
                  p=f[key]
                  if p and p['total']>=55:
                      options.append(entry('starter contribution',124+p['total']/15,f'{who} Has a Verified Starter to Watch',
                          f'{p["name"]} contributed {p["total"]:.2f} points across {p["starts"]} verified starts for {who} in {window}.',
                          f'That is a known starter contribution, not a rest-of-season projection or a claim about future lineup decisions. {who} averaged {avea if who==a else aveb:.2f} points in the same period; the opponent averaged {aveb if who==a else avea:.2f}.',
                          f'If that level of starter scoring changes, how much of {who}’s recent advantage or deficit remains?',
                          ['players_points','starters','rostered_identity']))
              # Neutral facts are preferable to invented narratives where no honest tension clears the bar.
              options.append(entry('measured comparison',30,'The Scoreboard Leaves a Question Open',
                  f'{a} averaged {avea:.2f} points and {b} averaged {aveb:.2f} across {window}.',
                  'The current record and recent scoring sample describe different facets of the matchup, but neither alone proves an edge in the next game.',
                  'Another completed week will give a better basis for separating the teams.', ['ave_a','ave_b']))
              return options


          def after_facts(g, snapshot, premap, players):
              a,b=g['name_a'],g['name_b'];sa=float(g['score_a']);sb=float(g['score_b'])
              ra=pre_map_get(premap,g['id_a']);rb=pre_map_get(premap,g['id_b'])
              # Prior three completed weeks only (no Week 8 score leakage in expectation).
              aa=mean(ra[-4:-1]);bb=mean(rb[-4:-1]);mn=float(snapshot['median']);w=snapshot['aftermath_week']
              return {'game':g,'scores_a':ra,'scores_b':rb,'score_a':sa,'score_b':sb,'margin':abs(sa-sb),
                  'prior_a':aa,'prior_b':bb,'dev_a':sa-aa,'dev_b':sb-bb,'median':mn,
                  'source_pre':f'Weeks {w-3}–{w-1}','week':w,
                  'p_a':players['final'].get(str(g['id_a'])),'p_b':players['final'].get(str(g['id_b']))}


          def pre_map_get(premap,id_):
              r=premap.get(str(id_))
              if not isinstance(r,list) or len(r)<4:
                  raise RuntimeError(f'No complete prior score history for roster {id_}')
              return r


          def after_candidates(f):
