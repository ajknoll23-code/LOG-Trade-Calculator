          def _nl28_fact_edit(f, s, kind):
              s = dict(s)
              g = f['game']
              a, b = g['name_a'], g['name_b']
              angle = s['angle']
              voice = 'Ruthless Sports Radio'
              if kind == 'war':
                  aa, bb, gap = f['ave_a'], f['ave_b'], f['gap']
                  front = a if aa >= bb else b
                  back = b if front == a else a
                  high, low = max(aa, bb), min(aa, bb)
                  win_a = int(str(g['record_a']).split('-')[0])
                  win_b = int(str(g['record_b']).split('-')[0])
                  if angle == 'record versus form':
                      voice = 'Sophisticated Savage' if gap < 8 else voice
                      s['headline'] = f'{abs(win_a-win_b)} Games Apart. {gap:.2f} Points Apart.'
                      s['lead'] = (f'{a} enters at {g["record_a"]}; {b} at {g["record_b"]}. '
                                   f'Their recent three-week averages are {aa:.2f} and {bb:.2f}. '
                                   f'All that record separation bought somebody a {gap:.2f}-point weekly difference.')
                      s['why'] = (f'{front} has the narrow recent scoring advantage. The standings favor a different story '
                                  'than those last three scoreboards, and neither gets to cast the deciding vote before kickoff.')
                      s['takeaway'] = 'One résumé has more wins. The recent points refused to be impressed.'
                  elif angle == 'underdog path':
                      bh = f['high_b'] if back == b else f['high_a']
                      fl = f['low_a'] if front == a else f['low_b']
                      overlap = bh - fl
                      voice = 'Full League Roast' if gap >= 45 else voice
                      s['headline'] = f'{gap:.2f} Points a Week. The Underdog Has Homework.'
                      s['lead'] = (f'{back} has averaged {low:.2f} over {f["window"]}; {front} has averaged {high:.2f}. '
                                   f'That {gap:.2f}-point weekly gap is not a coin flip dressed up in football pads.')
                      if overlap >= 0:
                          s['why'] = (f'{back} reached {bh:.2f} once, while {front} fell to {fl:.2f} once. '
                                      f'Those completed-game ranges overlap by {overlap:.2f} points. '
                                      'It is a documented opening, not a dependable lifestyle.')
                          s['takeaway'] = 'The escape hatch exists. The front door is still locked by the numbers.'
                      else:
                          s['why'] = (f'{back} peaked at {bh:.2f}, and {front} bottomed at {fl:.2f} '
                                      f'across the same completed span. Even those extremes are {abs(overlap):.2f} points apart.')
                          s['takeaway'] = 'Even the best recent underdog week could not catch the favorite\'s worst.'
                  elif angle == 'recent reversal':
                      moves = [(a, f['latest_change_a'], f['latest_a']), (b, f['latest_change_b'], f['latest_b'])]
                      who, delta, latest = max((x for x in moves if x[1] is not None), key=lambda x: abs(x[1]))
                      previous = latest - delta
                      voice = 'Full League Roast' if delta < -45 else voice
                      s['headline'] = (f'{abs(delta):.2f} Points Went Missing. Questions Are Welcome.' if delta < 0
                                       else f'{delta:.2f} Points of Improvement. Now Prove It Again.')
                      s['lead'] = (f'{who} posted {latest:.2f} last week, {abs(delta):.2f} '
                                   f'{"below" if delta < 0 else "above"} its previous three-week average of {previous:.2f}. '
                                   'A trend chart can survive a surprise. Its reputation may need more work.')
                      s['why'] = (f'{who} now meets {b if who == a else a}. Their latest three-week scoring averages '
                                  f'differ by {gap:.2f} points. One strange Sunday changes the story, not the established arithmetic.')
                      s['takeaway'] = 'Nobody has explained that swing. The next box score gets the microphone.'
                  elif angle == 'title race':
                      s['headline'] = f'Nos. {g["rank_a"]} and {g["rank_b"]}. Only One Gets to Brag Monday.'
                      s['lead'] = (f'{a} and {b} are provisional Nos. {g["rank_a"]} and {g["rank_b"]}. '
                                   f'Their recent scoring averages are {aa:.2f} and {bb:.2f}; '
                                   f'{front} owns the {gap:.2f}-point weekly edge.')
                      s['why'] = ('The head-to-head result will affect the combined-record race. Each team also faces '
                                  'the median, which has never cared how impressive a provisional seed looks on paper.')
                      s['takeaway'] = 'A prestigious matchup is still settled by an extremely unprestigious scoreboard.'
                  elif angle == 'leader under challenge':
                      champ = a if g['rank_a'] == 1 else b
                      challenger = b if champ == a else a
                      champ_avg = aa if champ == a else bb
                      ch_avg = bb if champ == a else aa
                      voice = 'Full League Roast' if champ_avg - ch_avg >= 50 else voice
                      s['headline'] = f'No. 1 Is {abs(champ_avg-ch_avg):.2f} Points Ahead Per Week. Good Luck.'
                      s['lead'] = (f'{champ} is provisional No. 1, averaging {champ_avg:.2f} over {f["window"]}. '
                                   f'{challenger} has averaged {ch_avg:.2f}. This is a {abs(champ_avg-ch_avg):.2f}-point '
                                   'weekly challenge, not a ceremonial invitation to the throne room.')
                      s['why'] = (f'{challenger} did produce {f["high_b"] if challenger == b else f["high_a"]:.2f} '
                                  'in one recent game. That is a verified high, not a reason to pretend the wider gap disappeared.')
                      s['takeaway'] = 'The challenger needs to change the math, not the promotional material.'
                  elif angle == 'consistency versus volatility':
                      x, y = f['range_a'], f['range_b']
                      volatile = a if x > y else b
                      steady = b if volatile == a else a
                      s['headline'] = f'{max(x,y):.2f} Points of Whiplash. One Team Brought a Seat Belt.'
                      s['lead'] = (f'{volatile} has swung {max(x,y):.2f} points between its recent high and low. '
                                   f'{steady} swung {min(x,y):.2f}. That is a measurable difference in how these offenses arrive.')
                      s['why'] = (f'{front} still owns the recent scoring edge, {high:.2f} to {low:.2f}. '
                                  'A wide range means past volatility, not a forecast of next week\'s result.')
                      s['takeaway'] = 'Somebody is getting the roller coaster. The scoreboard sells tickets after kickoff.'
                  elif angle == 'fine margins':
                      voice = 'Sophisticated Savage'
                      s['headline'] = f'{gap:.2f} Points of Separation. Save the Victory Speech.'
                      s['lead'] = (f'{a} averaged {aa:.2f} over {f["window"]}; {b} averaged {bb:.2f}. '
                                   f'The gap is {gap:.2f}. An entire week of bravado is balanced on a rounding error.')
                      s['why'] = ('Those completed-game averages make this one genuinely close, regardless of how '
                                  'different the broader records may look.')
                      s['takeaway'] = 'The evidence is close. The trash talk, inevitably, will not be.'
              else:
                  sa, sb, margin, median = f['score_a'], f['score_b'], f['margin'], f['median']
                  winner = a if sa > sb else b if sb > sa else None
                  loser = b if winner == a else a
                  ws, ls = max(sa,sb), min(sa,sb)
                  week = f['week']
                  if angle == 'strong score in defeat' and winner:
                      voice = 'Full League Roast'
                      s['headline'] = f'{ls:.2f} Points. And Still a Loss.'
                      s['lead'] = (f'{loser} scored {ls:.2f}, cleared the Week {week} median by {ls-median:.2f}, '
                                   f'and still lost {ws:.2f}–{ls:.2f} to {winner}. '
                                   'That is an excellent score with a spectacularly inconvenient opponent.')
                      s['why'] = (f'{winner} scored {ws:.2f} and took the head-to-head win. Both teams beat the '
                                  f'{median:.2f} median; only one escaped with a full 2–0 week.')
                      s['takeaway'] = 'The offense did its job. The schedule handed it a receipt for second place.'
                  elif angle == 'win without median' and winner:
                      voice = 'Sophisticated Savage'
                      s['headline'] = f'{ws:.2f} Won the Game. The Median Was Unimpressed.'
                      s['lead'] = (f'{winner} beat {loser} {ws:.2f}–{ls:.2f}. The winning score was still '
                                   f'{median-ws:.2f} shy of the {median:.2f} league median. '
                                   'Someone gets a head-to-head victory and a second opinion they did not request.')
                      s['why'] = ('Both teams lost their median result. That turns the winner\'s week into 1–1, '
                                  'which is real credit for the win and no credit for the scoring standard.')
                      s['takeaway'] = 'The win counts. The league-wide comparison has declined to applaud.'
                  elif angle == 'pregame-baseline reversal' and winner:
                      moves = [(a,f['dev_a'],f['prior_a'],sa),(b,f['dev_b'],f['prior_b'],sb)]
                      who,delta,prior,actual = max(moves,key=lambda x:abs(x[1]))
                      s['headline'] = (f'{abs(delta):.2f} Points Better. Still {margin:.2f} Short.'
                                       if who == loser and delta > 0 else f'{abs(delta):.2f} Points Off Script.')
                      s['lead'] = (f'{who} scored {actual:.2f} in Week {week}, '
                                   f'{abs(delta):.2f} {"above" if delta > 0 else "below"} its '
                                   f'{prior:.2f}-point pregame scoring average. {winner} still won {ws:.2f}–{ls:.2f}.')
                      s['why'] = (f'The previous average comes from {f["source_pre"]}; the {margin:.2f}-point final '
                                  'margin comes from the completed matchup. Both statements survive inspection.')
                      s['takeaway'] = ('Improvement was real. So was the loss.' if who==loser and delta>0
                                       else 'The old trend can present its case to a scoreboard that already closed court.')
                  elif angle == 'form upset' and winner:
                      old_a, old_b = f['prior_a'], f['prior_b']
                      former = a if old_a >= old_b else b
                      voice = 'Full League Roast' if abs(old_a-old_b) >= 20 else voice
                      s['headline'] = f'The Form Chart Brought a Resume. {winner} Brought {ws:.2f}.'
                      s['lead'] = (f'{former} entered with the better {f["source_pre"]} average, '
                                   f'{max(old_a,old_b):.2f} to {min(old_a,old_b):.2f}. '
                                   f'Then {winner} won {ws:.2f}–{ls:.2f}. The trend had a great week right up until the actual game.')
                      s['why'] = (f'The result reversed a {abs(old_a-old_b):.2f}-point pregame scoring-form advantage. '
                                  'That is a result and a prior trend, not evidence of a published pregame prediction.')
                      s['takeaway'] = 'A fine-looking trend met an extremely uncooperative final score.'
                  elif angle == 'standings shock':
                      mover = a if abs(g['rank_delta_a']) >= abs(g['rank_delta_b']) else b
                      shift = g['rank_delta_a'] if mover==a else g['rank_delta_b']
                      start = g['prior_rank_a'] if mover==a else g['prior_rank_b']
                      end = g['rank_a'] if mover==a else g['rank_b']
                      points = sa if mover==a else sb
                      voice = 'Full League Roast' if shift <= -3 else voice
                      s['headline'] = f'{abs(shift)} Places in One Week. The Standings Found a Trapdoor.'
                      s['lead'] = (f'{mover} went from provisional No. {start} to No. {end} after Week {week}, '
                                   f'{abs(shift)} places {"up" if shift > 0 else "down"}. '
                                   f'A {points:.2f}-point week drove the reconstructed change.')
                      s['why'] = (f'{mover} finished {abs(points-median):.2f} '
                                  f'{"above" if points > median else "below" if points < median else "at"} '
                                  f'the {median:.2f} league median. Those ranks are provisional, not an official Sleeper tiebreak list.')
                      s['takeaway'] = ('Three places down is not a slip. That is an elevator with a missing floor.'
                                       if shift <= -3 else 'The reconstructed table moved faster than the excuses can travel.')
                  elif angle == 'large-weekly-margin' and winner:
                      voice = 'Full League Roast' if margin >= 100 else voice
                      s['headline'] = f'{margin:.2f} Points Apart. Are We Sure That Was the Same Game?'
                      s['lead'] = (f'{winner} scored {ws:.2f}; {loser} scored {ls:.2f}. '
                                   f'The {margin:.2f}-point margin is confirmed. The teams appear to have played different sports.')
                      s['why'] = (f'The winner cleared the {median:.2f} Week {week} median by {ws-median:.2f}; '
                                  f'the loser missed it by {median-ls:.2f}. This describes one completed matchup, '
                                  'not an unverified historical record.')
                      s['takeaway'] = 'One team brought a scoring offense. The other supplied the contrast.'
              # Preserve every underlying sourced fact in the original ledger; this is only a prose pass.
              # Distinctive hooks are tracked for review, but this is not an invented score or a vote.
              s['voice'] = voice
              s['tone'] = 'brash_evidence_led_clean'   # Original evidence gate remains authoritative.
              s['punchline'] = s['takeaway']
              s['joke_basis'] = s.get('joke_basis') or 'verified matchup and three-week scoring context'
              s['keys'] = list(dict.fromkeys(s['keys'] + ['nl28_fact_anchored_voice']))
              return s


          def _nl27_voice(f, s, kind):
              return _nl28_fact_edit(f, _NL28_PREVIOUS_VOICE(f, s, kind), kind)


          def render_html(heading, issue_sub, stories, logo, stamp, kind, layout_levels=None):
              html = _NL28_PREVIOUS_RENDER_HTML(heading, issue_sub, stories, logo, stamp, kind, layout_levels)
              # The varied structural treatments remain; boilerplate editorial-box labels do not.
              return (html.replace('<b>THE RECEIPT</b> ', '')
                          .replace('<b>THE VERDICT</b> ', '')
                          .replace('<b>WHY THIS MATTERS</b>', '')
                          .replace('Six games. Six receipts. The box scores brought enough attitude for everyone. No invented picks.',
                                   'Six matchups. Actual numbers. Uncomfortably direct conclusions.'))


          def nl28_balance_voices(war,after,warfacts,afterfacts):
              """Balance actual story labels toward 55/15/30 across both issues.

              A full roast is earned by an extreme verified result, never forced
              solely to satisfy a nominal percentage. Three of twelve is the
              nearest feasible roast allowance below 30%; two of twelve is the
              closest sophisticated-savage allocation to 15%.
              """
              entries = ([('war',s,f) for s,f in zip(war,warfacts)] +
                         [('after',s,f) for s,f in zip(after,afterfacts)])
              if len(entries)!=12:
                  raise RuntimeError('NL28 voice assignment requires 12 unique stories')
              def catastrophe(item):
                  kind,s,f=item
                  angle=s['angle']
                  if kind=='after' and angle=='large-weekly-margin' and f['margin']>=100:
                      return 250+f['margin']
                  if kind=='after' and angle=='standings shock':
                      g=f['game']
                      fall=max(0,-g['rank_delta_a'],-g['rank_delta_b'])
                      if fall>=3:return 220+10*fall
                  if kind=='war' and angle=='underdog path' and f['gap']>=45:
                      return 200+f['gap']
                  if kind=='war' and angle=='recent reversal':
                      falls=[v for v in (f['latest_change_a'],f['latest_change_b']) if v is not None]
                      if falls and min(falls)<=-45:return 110+abs(min(falls))
                  if kind=='war' and angle=='leader under challenge' and f['gap']>=50:
                      return 70+f['gap']
                  return 0
              full_candidates=sorted([(catastrophe(x),i) for i,x in enumerate(entries)
                                      if catastrophe(x)>0],reverse=True)
              roast_ids={i for _,i in full_candidates[:3]}
              dry_order={'record versus form':100,'win without median':96,
                         'fine margins':75,'strong score in defeat':68}
              savage_candidates=sorted([(dry_order.get(x[1]['angle'],0),i)
                                        for i,x in enumerate(entries) if i not in roast_ids
                                        and dry_order.get(x[1]['angle'],0)>0],reverse=True)
              savage_ids={i for _,i in savage_candidates[:2]}
              for i,(_,s,_) in enumerate(entries):
                  v=('Full League Roast' if i in roast_ids else
                     'Sophisticated Savage' if i in savage_ids else
                     'Ruthless Sports Radio')
                  s['voice']=v
              # The label must reflect the actual selection, not an automatic
              # full-roast designation whenever a single threshold is crossed.
              mix=Counter(s['voice'] for _,s,_ in entries)
              assert mix['Full League Roast']<=3 and mix['Sophisticated Savage']<=2
              assert mix['Ruthless Sports Radio']>=7


          def quality_report(stories,kind):
              result = _NL28_PREVIOUS_QUALITY(stories,kind)
              result['voice_targets_percent'] = {'Ruthless Sports Radio':55,'Sophisticated Savage':15,'Full League Roast':30}
              result['actual_voice_counts'] = dict(Counter(s['voice'] for s in stories))
              return result


          def nl28_segmented_render(heading,sub,stories,logo,stamp,kind,root,pdf):
              """Render cover and six matchups in isolation, audit, then merge; no page truncation."""
              import fitz
              from weasyprint import HTML
              levels = {}
              history = []
              for attempt in range(3):
                  html = render_html(heading,sub,stories,logo,stamp,kind,levels)
                  fragments = re.findall(r'<section class="(?:cover|game-page(?: compact)?(?: tight)?)">.*?</section>',html,re.S)
                  if len(fragments) != len(stories)+1:
                      raise RuntimeError(f'NL28 expected 1 cover + 6 story sections, got {len(fragments)}')
                  head = html.split('<body>',1)[0]+'<body>'
                  pdf_parts = []
                  spilling = []
                  for page_no, fragment in enumerate(fragments,1):
                      page_html = (head+fragment+'</body></html>')
                      page_html = page_html.replace('content:"LOG · " counter(page)', f'content:"LOG · {page_no}"')
                      single = fitz.open(stream=HTML(string=page_html,base_url=str(root)).write_pdf(),filetype='pdf')
                      if len(single) != 1:
                          if page_no == 1:
                              raise RuntimeError(f'NL28 cover needs {len(single)} pages. No silent trimming allowed.')
                          spilling.append(page_no-1)
                      pdf_parts.append(single)
                  if not spilling:
                      merged = fitz.open()
                      for single in pdf_parts:
                          merged.insert_pdf(single)
                      if len(merged) != 7:
                          raise RuntimeError(f'NL28 segmented merge generated {len(merged)} pages, not seven')
                      merged.save(str(pdf),garbage=3,deflate=True)
                      merged.close()
                      for single in pdf_parts:single.close()
                      return html,levels,history
                  for single in pdf_parts:single.close()
                  history.append({'attempt':attempt+1,'spilling_matchups':spilling})
                  if attempt == 2:
                      raise RuntimeError(f'NL28 cannot fit matchups without font reduction below gate: {spilling}')
                  for index in spilling:
                      levels[index] = levels.get(index,0)+1
              raise RuntimeError('Unreachable segmented PDF loop')


          def nl28_selftest():
              from tempfile import TemporaryDirectory
              import fitz
              smoke = []
              for n in range(1,7):
                  smoke.append({'name_a':f'Smoke {n} Alpha','name_b':f'Smoke {n} Beta',
                                'stats':[('FORM','220.12 / 188.03'),('RECORD','6-5 / 5-6')],
                                'player_note':None,'structure':['contrast','numbers','stakes'][n%3],
                                'lead':f'Team {n} has averaged 220.12 against its opponent\'s 188.03 recent points.',
                                'why':f'This is fact-checked storyline {n}, distinct from the other games.',
                                'takeaway':f'Story {n} has a different final sentence.',
                                'source':'Synthetic local test only','angle':f'angle {n}',
                                'headline':f'Unique NL28 Smoke Headline {n}'})
              logo='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO4BKuIAAAAASUVORK5CYII='
              with TemporaryDirectory() as d:
                  path=Path(d)/'nl28-smoke.pdf'
                  html,levels,log=nl28_segmented_render('War Room','2026 · Week 9 · test',smoke,logo,'test','war',Path(d),path)
                  with fitz.open(str(path)) as doc:
                      assert len(doc)==7, 'NL28 lost a page'
                      for n in range(1,7):
                          t=doc[n].get_text(sort=True)
                          # A narrow PDF line break is not a missing headline. Compare
                          # normalized Unicode alphanumerics just like verify_pdf().
                          assert _packed(f'Unique NL28 Smoke Headline {n}') in _packed(t), f'NL28 lost story {n}'
                          assert _packed('Synthetic local test only') in _packed(t), f'NL28 lost source {n}'
                          for j in range(1,7):
                              if j != n:
                                  assert _packed(f'Unique NL28 Smoke Headline {j}') not in _packed(t), f'NL28 mixed in story {j}'
                  assert html.count('<section class="game-page">')==6
              print('PASS NL28: six isolated matchup pages, complete cover, no spill or lost source')


          def selftest():
              _NL28_PREVIOUS_SELFTEST()
              nl28_selftest()


          # A-NL29R1: verified player fact in every story, within main body paragraphs 1 or 2.
          # This layer is appended to the immutable green NL28R2 engine in runner temp.
          import math as _nl29_math

          _NL29_LEGACY_QUALITY = quality_report
          _NL29_LEGACY_RENDER = render_html
          _NL29_LEGACY_SELFTEST = selftest
          _NL29_BANNED = (
              'as a verified week', 'this is completed production, not a projection',
              'improvement was real. so was the loss', 'the final score has the last word',
              'the scoreboard has the final word', 'the final score has entered the chat',
              'not a guarantee', 'the scoreboard brought receipts')
          _NL29_PRIMARY = {
              'win without median':'median split', 'strong score in defeat':'median split',
              'median divide':'median split', 'recent reversal':'form collapse/reversal',
              'pregame-baseline reversal':'form collapse/reversal', 'form upset':'form collapse/reversal',
              'surging form':'form collapse/reversal', 'large-weekly-margin':'large absolute margin',
              'record versus form':'record-vs-form divergence',
              'standings shock':'standings drop',
          }


          def nl29_primary_story(s):
              return _NL29_PRIMARY.get(s['angle'], 'standard mismatch')


          def nl29_collect_starters(root, after_week, team_ids, data, fixture_mode=False, fetcher=get):
              """Gather all weekly starter evidence, never infer the prior week's roster from a current roster.

              Real path: public Sleeper weekly roster_id, starters and players_points +
              league roster identity cache, optionally verified public Sleeper catalogue.
              Fixture path: artificial source rows with explicit synthetic provenance.
              """
              valid=set(int(x) for x in team_ids)
              by_week={}; exclusion=[]
              names=rostered_identity(root)
              source_names={pid:'league_rosters.json identity-only' for pid in names}
              if fixture_mode:
                  raw=data.get('_nl29_weekly_starters')
                  if not isinstance(raw, dict):
                      raise RuntimeError('NL29 fixture requires _nl29_weekly_starters of synthetic weekly rows')
              else:
                  raw=None
              ids_needed=set()
              for w in range(max(1,after_week-3), after_week+1):
                  if fixture_mode:
                      rows=raw.get(str(w))
                      if not isinstance(rows,list):raise RuntimeError(f'Synthetic NL29 fixture missing Week {w}')
                  else:
                      rows=fetcher(f'league/{LEAGUE_ID}/matchups/{w}')
                  if not isinstance(rows,list):raise RuntimeError(f'Week {w} Sleeper starter evidence unavailable')
                  games=matchups(rows,valid,scored=True)
                  weekly={}
                  for a,b in games:
                      for row in (a,b):
                          rid=int(row['roster_id'])
                          starters=row.get('starters')
                          pts=row.get('players_points')
                          if not isinstance(starters,list) or not isinstance(pts,dict):
                              raise RuntimeError(f'Week {w} roster {rid}: missing starters or players_points')
                          if len([x for x in starters if x not in (None,'0',0)])!=len(set(str(x) for x in starters if x not in (None,'0',0))):
                              raise RuntimeError(f'Week {w} roster {rid}: duplicate starter IDs')
                          verified=[]
                          for pid in starters:
                              if pid in (None,'0',0):
                                  exclusion.append({'week':w,'roster_id':rid,'reason':'empty lineup slot'})
                                  continue
                              p=str(pid)
                              score=pts.get(p)
                              if not isinstance(score,(int,float)) or not _nl29_math.isfinite(score):
                                  exclusion.append({'week':w,'roster_id':rid,'player_id':p,
                                                    'reason':'missing or non-finite weekly starter points'})
                                  continue
                              ids_needed.add(p)
                              verified.append({'player_id':p,'roster_id':rid,'week':w,
                                  'points':round(float(score),2),'source_endpoint':f'league/{LEAGUE_ID}/matchups/{w}',
                                  'evidence_fields':['roster_id','starters','players_points'],
                                  'data_mode':'SYNTHETIC_OFFLINE_FIXTURE' if fixture_mode else 'LIVE_SLEEPER'})
                          weekly[rid]=verified
                  if set(weekly)!=valid:raise RuntimeError(f'Incomplete verified starter roster coverage Week {w}')
                  by_week[w]=weekly
              if fixture_mode:
                  for row in data.get('_nl29_identity_fixture',[]):
                      names[str(row['player_id'])]={'name':str(row['name']),'position':str(row['position'])}
                      source_names[str(row['player_id'])]='SYNTHETIC_OFFLINE_FIXTURE'
              missing=ids_needed-set(names)
              if missing and not fixture_mode:
                  try:
                      catalogue=fetcher('players/nfl')
                      if not isinstance(catalogue,dict):raise ValueError('non-dict catalogue')
                      for p in missing:
                          row=catalogue.get(p) or {}
                          name=row.get('full_name') or ' '.join(str(row.get(x) or '').strip() for x in ('first_name','last_name')).strip()
                          pos=str(row.get('position') or '').strip()
                          if name and pos:
                              names[p]={'name':name,'position':pos}
                              source_names[p]='Sleeper players/nfl catalogue'
                  except Exception as exc:
                      exclusion.append({'reason':'Sleeper public catalogue failed; continuing with cache-mapped identities',
                                        'detail':str(exc)[:180]})
              profiles={}
              for w,teams in by_week.items():
                  profiles[w]={}
                  for rid, entries in teams.items():
                      keep=[]
                      for x in entries:
                          ident=names.get(x['player_id']) or {}
                          name=str(ident.get('name') or '').strip()
                          pos=str(ident.get('position') or '').strip().upper()
                          if not name or not pos:
                              exclusion.append({'week':w,'roster_id':rid,'player_id':x['player_id'],
                                                'reason':'identity/position not verifiable; excluded from prose'})
                              continue
                          keep.append({**x,'name':name,'position':pos,
                              'identity_source':source_names.get(x['player_id'],'unknown')})
                      profiles[w][rid]=keep
              # Require trustworthy, individually identified points for both teams in every sampled week.
              for w,teams in profiles.items():
                  for rid,entries in teams.items():
                      if not entries:
                          raise RuntimeError(f'NL29 MANDATORY SOURCE COVERAGE FAILED: W{w} roster={rid} has no named verified starter')
              return {'weeks':profiles,'exclusions':exclusion,'identity_count':len(names),
                      'source': 'Synthetic offline fixture' if fixture_mode else 'Public Sleeper weekly matchups plus player identities',
                      'fixture_test_not_live_evidence':bool(fixture_mode)}


          def nl29_legacy_lenses(profiles,post_week,team_ids):
              """Compatibility only: the full starter pool drives all new player selections."""
              rec={};last={}
              for rid in team_ids:
                  starts=defaultdict(list)
                  for week in range(max(1,post_week-2),post_week+1):
                      for p in profiles['weeks'][week][rid]:starts[p['player_id']].append(p)
                  options=[]
                  for entries in starts.values():
                      if len(entries)>=2:
                          options.append({'name':entries[0]['name'],'position':entries[0]['position'],
                                          'starts':len(entries), 'total':round(sum(p['points'] for p in entries),2),
                                          'weeks':[p['week'] for p in entries]})
                  if options: rec[str(rid)]=max(options,key=lambda p:(p['total'],p['starts']))
                  if profiles['weeks'][post_week][rid]:
                      last[str(rid)]=max(profiles['weeks'][post_week][rid],key=lambda p:p['points'])
              return {'recent':rec,'final':last,'data_status':'Full source-verified weekly starter pool; NL29 editorial chooses independently'}


          def nl29_candidates(f,s,kind,profiles):
              g=f['game'];a,b=g['name_a'],g['name_b'];post=profiles['post_week']
              candidates=[]
              for rid,team in ((g['id_a'],a),(g['id_b'],b)):
                  if kind=='after':
                      week=post; items=profiles['weeks'][week][rid]
                      team_total=float(f['score_a'] if rid==g['id_a'] else f['score_b'])
                      for p in items:
                          prev=[q['points'] for w in range(max(1,post-3),post)
                                for q in profiles['weeks'][w][rid] if q['player_id']==p['player_id']]
                          prior_mean=sum(prev)/len(prev) if prev else None
                          candidates.append({**p,'team':team,'team_total':team_total,
                              'share_pct':100*p['points']/team_total if team_total>0 else 0,
                              'prior_player_mean':prior_mean,
                              'player_swing':round(p['points']-prior_mean,2) if prior_mean is not None else None,
                              'week_span':[week],'starts_count':1,'is_recent_window':False})
                  else:
                      # War Room is backward-looking: W(week-3) through W(week-1), no future data.
                      weeks=list(range(post-2,post+1))
                      total=sum(g['scores_a'][-3:]) if rid==g['id_a'] else sum(g['scores_b'][-3:])
                      agg=defaultdict(list)
                      for w in weeks:
                          for p in profiles['weeks'][w][rid]:agg[p['player_id']].append(p)
                      for pid,entries in agg.items():
                          newest=max(entries,key=lambda x:x['week']); score=sum(x['points'] for x in entries)
                          prior=[q['points'] for w in range(max(1,post-3),post)
                                for q in profiles['weeks'][w][rid] if q['player_id']==pid]
                          prior_mean=sum(prior)/len(prior) if prior else None
                          current=[x['points'] for x in entries if x['week']==post]
                          swing=(current[0]-prior_mean) if prior_mean is not None and current else None
                          candidates.append({**newest,'team':team,'points':round(score,2),
                              'team_total':total,'share_pct':100*score/total if total>0 else 0,
                              'prior_player_mean':prior_mean,
                              'player_swing':round(swing,2) if swing is not None else None,
                              'latest_points':current[0] if current else None,
                              'week_span':weeks,'starts_count':len(entries),'is_recent_window':True,
                              'source_endpoints':[f'league/{LEAGUE_ID}/matchups/{x["week"]}' for x in entries]})
              return candidates


          def nl29_selection(f,s,kind,profiles,already_featured=None,disallow_raw_highest=False):
              candidates=nl29_candidates(f,s,kind,profiles)
              if not candidates:raise RuntimeError('NL29 mandatory player fact has no verified candidates')
              story=nl29_primary_story(s);g=f['game'];a,b=g['name_a'],g['name_b']
              scoring_high=a if (f['ave_a'] if kind=='war' else f['score_a']) >= (f['ave_b'] if kind=='war' else f['score_b']) else b
              low=b if scoring_high==a else a
              focus_team=low
              focus_direction=None
              winner_below_median=False
              if kind=='after':
                  mn=f['median'];sa=f['score_a'];sb=f['score_b']
                  missed={who for who,value,prior in ((a,sa,f['prior_a']),(b,sb,f['prior_b']))
                          if value<mn or prior-value>=40}
                  if s['angle']=='win without median':
                      # The winning team's missed median is the actual headline.
                      focus_team=scoring_high
                      missed={scoring_high}
                      winner_below_median=True
                  elif story=='standings drop':
                      focus_team=a if g['rank_delta_a']<=g['rank_delta_b'] else b
                  elif story=='form collapse/reversal':
                      if s['angle']=='form upset':
                          focus_team=a if f['prior_a']>=f['prior_b'] else b
                          focus_direction=-1
                      else:
                          focus_team=a if abs(f['dev_a'])>=abs(f['dev_b']) else b
                          focus_direction=1 if (f['dev_a'] if focus_team==a else f['dev_b'])>0 else -1
                  else:focus_team=low
              else:
                  missed={who for who,delta in ((a,f['latest_change_a']),(b,f['latest_change_b']))
                          if delta is not None and delta<=-40}
                  if story=='form collapse/reversal':
                      da=f['latest_change_a'] if f['latest_change_a'] is not None else 0
                      db=f['latest_change_b'] if f['latest_change_b'] is not None else 0
                      focus_team=a if abs(da)>=abs(db) else b
                      focus_direction=1 if (da if focus_team==a else db)>0 else -1
                  else:focus_team=low
              # Use ranked context, not a default 'highest raw scorer' rule.
              def rank(p):
                  main=p['position'] in ('QB','RB','WR')
                  swing=p['player_swing']
                  primary=(0,0,0)
                  rule='fallback: highest verified raw scorer'
                  # Special case: a win that misses median is about that WINNER's output,
                  # never about the irrelevant lowest point on the losing side.
                  if winner_below_median and p['team']!=scoring_high:
                      primary=(-1,0,0);rule='excluded: does not play for median-missing winner'
                  elif story=='form collapse/reversal' and p['team']==focus_team and swing is not None and focus_direction is not None and swing*focus_direction>0:
                      primary=(7,abs(swing),int(main))
                      rule=('largest relevant same-player rise on improving side' if focus_direction>0 else
                            'largest verified same-player decline on collapsing side')
                  elif story=='standings drop' and p['team']==focus_team and p['points']<=0:
                      primary=(7,abs(p['points'])+1,int(main));rule='zero/negative starter on team with standings decline'
                  elif story=='median split' and p['team'] in missed and p['points']<=0:
                      primary=(7,abs(p['points'])+1,int(main));rule='zero/negative starter on median-missing team'
                  elif winner_below_median and p['team']==scoring_high and main:
                      primary=(6,100-p['share_pct'],int(main));rule='low primary-position contribution by winner that missed median'
                  elif story in ('form collapse/reversal','standings drop') and p['team']==focus_team and main:
                      primary=(5,100-p['share_pct'],int(main));rule='primary-position share on central team-level scoring result'
                  elif story in ('large absolute margin','median split','standard mismatch') and p['team']==scoring_high:
                      primary=(4,p['share_pct'],int(main));rule='largest share of the winning/higher-scoring team total'
                  elif story=='record-vs-form divergence' and p['team']==scoring_high:
                      primary=(4,p['share_pct'],int(main));rule='player contribution to recent-form side of record/form disagreement'
                  elif swing is not None and abs(swing)>=15:
                      primary=(3,abs(swing),int(main));rule='verified same-player recent scoring swing'
                  elif p['team']==scoring_high:
                      primary=(2,p['share_pct'],int(main));rule='share of high-scoring team output'
                  return (primary[0],primary[1],primary[2],p['points']),rule
              ranked=sorted(candidates,key=lambda p:rank(p)[0],reverse=True)
              highest_raw=max(p['points'] for p in candidates)
              previous=already_featured or set()
              blocked=[]
              chosen=None
              for p in ranked:
                  if disallow_raw_highest and p['points']>=highest_raw-0.005:
                      blocked.append({'player_id':p['player_id'],'team':p['team'],
                          'reason':'raw highest scorer already featured in another matchup this edition'})
                      continue
                  key=(p['roster_id'],p['player_id'])
                  swing=p['player_swing']
                  extreme=False  # Same Week-8 evidence is not a new performance in Week-9 preview.
                  if key in previous and not extreme:
                      blocked.append({'player_id':p['player_id'],'team':p['team'],'reason':'already featured for team in prior edition without new extreme'})
                      continue
                  chosen=p;break
              if chosen is None:raise RuntimeError('NL29 repeated-feature guard exhausted all verified candidates')
              why=rank(chosen)[1]
              higher=[{'player_id':x['player_id'],'name':x['name'],'points':x['points'],
                       'reason_not_chosen':f'primary storyline {story}: {why} outranked raw points'}
                      for x in candidates if x['points']>chosen['points'] and x['player_id']!=chosen['player_id']]
              higher=sorted(higher,key=lambda x:x['points'],reverse=True)[:10]
              return chosen, {'primary_storyline':story, 'selection_reason':why,
                  'higher_raw_scorers_not_selected':higher,'repeat_feature_exclusions':blocked,
                  'candidate_count':len(candidates),
                  'featured_raw_highest':chosen['points']>=highest_raw-0.005}


          def nl29_player_sentence(f,s,kind,p,reason):
              """A specific player contribution serves the selected team-level tension.

              No counterfactual lineup or causal injury claims. Do not attribute a team
              shortfall to one starter merely because that starter scored fewer points.
              """
              g=f['game'];team=p['team'];points=p['points'];name=p['name'];pct=p['share_pct'];pos=p['position']
              if kind=='after':
                  base=f'{name} ({pos}) scored {points:.2f} for {team} in Week {p["week"]}, {pct:.1f}% of its {p["team_total"]:.2f}-point total.'
              else:
                  period=f'Weeks {p["week_span"][0]}–{p["week_span"][-1]}'
                  base=(f'{name} ({pos}) contributed {points:.2f} over {p["starts_count"]} starts for {team} '
                        f'in {period}, {pct:.1f}% of its scoring in that window.')
              story=nl29_primary_story(s)
              if story=='form collapse/reversal':
                  delta=p['player_swing']
                  if delta is not None and p.get('latest_points') is not None and kind=='war':
                      return (base+f' The latest start was {p["latest_points"]:.2f}, '
                              f'{abs(delta):.2f} {"below" if delta<0 else "above"} a '
                              f'{p["prior_player_mean"]:.2f}-point average in earlier starts. '
                              'That individual swing is measurable; the team-wide tumble still needs no invented explanation.')
                  if delta is not None and kind=='after':
                      return (base+f' That was {abs(delta):.2f} '
                              f'{"below" if delta<0 else "above"} a '
                              f'{p["prior_player_mean"]:.2f}-point prior-start average. '
                              'The form reversal is in the box score, not a theory about the locker room.')
                  return base+' This is one real contribution within the documented scoring reversal, not proof of its cause.'
              if story=='median split' and kind=='after':
                  mn=f['median'];score=p['team_total']
                  if score<mn:
                      return (base+f' The team still finished {mn-score:.2f} short of the league median. '
                              'The head-to-head victory came with a median loss attached; a split week is a funny kind of celebration.')
                  if s['angle']=='strong score in defeat':
                      other=g['name_b'] if team==g['name_a'] else g['name_a']
                      return (base+f' The other side, {other}, was in a game where both teams cleared '
                              'the median. Excellent opposition scoring did not come with a head-to-head exemption.')
                  return base+' The median added a second verdict to an already uncomfortable final.'
              if story=='large absolute margin' and kind=='after':
                  return (base+f' The final gap was {f["margin"]:.2f} points. '
                          'One starter owns a measurable share of the total; the losing side still has to live with the scoreboard.')
              if story=='standings drop' and kind=='after':
                  change=(g['rank_delta_a'] if team==g['name_a'] else g['rank_delta_b'])
                  if change<0:
                      return (base+f' That contribution arrived in a week when the team fell '
                              f'{abs(change)} places in the provisional table. The points and the drop are both on the record.')
                  return base+' The points are real, but the standings damage involved both head-to-head and median results.'
              if story=='record-vs-form divergence' and kind=='war':
                  return (base+f' The two teams are only {f["gap"]:.2f} points apart per week in recent form. '
                          'That starter output gives the scoring comparison an actual name while the combined records tell another story.')
              if kind=='war':
                  return (base+f' {team} sits in a matchup with a {f["gap"]:.2f}-point three-week scoring gap. '
                          'Those completed starter points are part of the comparison; they are not a forecast for kickoff.')
              return base+' The rest of the team total was spread across other starters; a single score does not establish the cause of the result.'


          def nl29_integrate(war,after,warfacts,aftfacts,profiles):
              if len(war)!=6 or len(after)!=6:raise RuntimeError('NL29 issue contains wrong number of stories')
              profiles['post_week']=aftfacts[0]['week']
              # First Aftermath W8, then War Room W9: block gratuitous repetition of a
              # featured player for the same team across adjacent editions.
              prior=set()
              for kind,stories,facts in (('after',after,aftfacts),('war',war,warfacts)):
                  highest_used=False
                  for s,f in zip(stories,facts):
                      p,decision=nl29_selection(f,s,kind,profiles,prior if kind=='war' else None,
                                                disallow_raw_highest=highest_used)
                      highest_used=highest_used or decision['featured_raw_highest']
                      fact=nl29_player_sentence(f,s,kind,p,decision['selection_reason'])
                      s['why']=fact
                      # No decorative player box; one verified player fact belongs to paragraph 2.
                      s['player_note']=None
                      s['nl29_selected']={**p,'selection':decision,'text':fact,'paragraph_index':2,
                           'source_verified':True,'citation':p['source_endpoint']}
                      s['primary_storyline']=decision['primary_storyline']
                      s['source']=s['source']+'; scored starter evidence W'+str(p['week'])
                      s['keys']=list(dict.fromkeys(s['keys']+['nl29_mandatory_verified_player_fact']))
                      # Fix NL28 generic closing patterns and banned phrases without
                      # rewriting the data-led headline or introducing new claims.
                      replacements={
                        'Improvement was real. So was the loss.':'The points went up. The standings offered no consolation prize.',
                        'The final score has the last word.':'The comfortable explanation lasted right up to the final.',
                        'One résumé has more wins. The recent points refused to be impressed.':'One résumé brought the wins. The latest scoring sample declined the invitation to agree.',
                      }
                      s['takeaway']=replacements.get(s['takeaway'],s['takeaway'])
                      s['punchline']=s['takeaway']
                      if kind=='after':prior.add((p['roster_id'],p['player_id']))
              return profiles


          def nl29_editorial_gate(stories,kind):
              if len(stories)!=6:raise RuntimeError('NL29 requires six complete stories')
              counts=Counter()
              for s in stories:
                  fact=s.get('nl29_selected')
                  if not fact or not fact.get('source_verified'):
                      raise RuntimeError('NL29 HARD FAIL: story lacks a verified player fact')
                  if fact['paragraph_index'] not in (1,2):
                      raise RuntimeError('NL29 HARD FAIL: player appears too late')
                  if fact['name'] not in (s['lead']+' '+s['why']):
                      raise RuntimeError('NL29 HARD FAIL: selected starter not in substantive story body')
                  if fact['name'] not in s['why']:
                      raise RuntimeError('NL29 HARD FAIL: player stat missing from second paragraph')
                  if f'{fact["points"]:.2f}' not in s['why']:
                      raise RuntimeError('NL29 HARD FAIL: selected player verified points absent')
                  if s['player_note'] is not None:
                      raise RuntimeError('NL29 HARD FAIL: player-info sidebar still present')
                  if s.get('primary_storyline')!=fact['selection']['primary_storyline']:
                      raise RuntimeError('NL29 HARD FAIL: player selection not tied to primary angle')
                  counts[fact['player_id']]+=1
                  body=(s['lead']+' '+s['why']+' '+s['takeaway']).casefold()
                  if any(term in body for term in _NL29_BANNED):
                      raise RuntimeError('NL29 HARD FAIL: banned editorial phrase in '+s['headline'])
                  if len(s['why'].split())>81 or len(s['lead'].split())>76:
                      raise RuntimeError('NL29 HARD FAIL: story too lengthy for mobile typography')
              # Absolute highest raw scorer may be featured only once per six-matchup issue.
              if sum(bool(s['nl29_selected']['selection']['featured_raw_highest']) for s in stories)>1:
                  raise RuntimeError('NL29 HARD FAIL: highest raw starter featured in more than one matchup')
              if len(set(s['takeaway'].casefold() for s in stories))<6:
                  raise RuntimeError('NL29 HARD FAIL: repeated closers')
              return {'mandatory_verified_player_facts':6,'featured_player_ids':[s['nl29_selected']['player_id'] for s in stories],
                  'storyline_types':dict(Counter(s['primary_storyline'] for s in stories)),
                  'player_stat_in_first_two_paragraphs':True,'max_player_callouts':1}


          def nl28_balance_voices(war,after,warfacts,aftfacts):
              """55/15/30 are editorial targets; roasts require verified catastrophic outcomes."""
              entries=([('war',s,f) for s,f in zip(war,warfacts)] +
                       [('after',s,f) for s,f in zip(after,aftfacts)])
              if len(entries)!=12:raise RuntimeError('NL29 needs 12 stories for voice decisions')
              for kind,s,f in entries:
                  roast=False
                  if kind=='after':
                      g=f['game'];mn=f['median']
                      roast=(f['margin']>=100 or min(f['dev_a'],f['dev_b'])<=-40 or
                             max(mn-f['score_a'],mn-f['score_b'])>=50 or
                             min(g['rank_delta_a'],g['rank_delta_b'])<=-3)
                  else:
                      roast=min(x for x in (f['latest_change_a'],f['latest_change_b']) if x is not None)<=-40
                  s['voice']='Full League Roast' if roast else ('Sophisticated Savage'
                       if s['angle'] in ('record versus form','fine margins','win without median') else 'Ruthless Sports Radio')
              # Never manufacture a catastrophe or change the primary data story just to hit 30%.
              assert all(s.get('voice') for _,s,_ in entries)


          def quality_report(stories,kind):
              editorial=nl29_editorial_gate(stories,kind)
              result=_NL29_LEGACY_QUALITY(stories,kind)
              return {**result,**editorial}


          def render_html(heading,issue_sub,stories,logo,stamp,kind,layout_levels=None):
              """Paragraph 2 is normal article prose in every rhetorical structure, never a sidebar."""
              html=_NL29_LEGACY_RENDER(heading,issue_sub,stories,logo,stamp,kind,layout_levels)
              html=re.sub(r'<div class="tag">[^<]*</div>', '', html)
              for s in stories:
                  fact=esc(s['why'])
                  boxed='<div class="contrast-note">'+fact+'</div>'
                  stakes='<div class="stakes-note"><p>'+fact+'</p></div>'
                  if boxed in html:
                      html=html.replace(boxed,'<p class="player-narrative">'+fact+'</p>',1)
                  elif stakes in html:
                      html=html.replace(stakes,'<p class="player-narrative">'+fact+'</p>',1)
                  else:
                      old='<p>'+fact+'</p>'
                      if old not in html:raise RuntimeError('NL29 player narrative not in a real body paragraph')
                      html=html.replace(old,'<p class="player-narrative">'+fact+'</p>',1)
              if re.search(r'<div class="tag">|<div class="contrast-note">|<div class="stakes-note">',html):
                  raise RuntimeError('NL29 failed to eliminate category/sidebar treatments')
              return html


          def nl29_cross_edition_gate(war,after):
