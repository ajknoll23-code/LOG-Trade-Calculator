name: Production V2 Phase 3 Baseline Normalization Audit

# Research-only denominator isolation. This does not mutate production.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-v2-phase3-baseline-normalization-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test Phase 3 audit
        run: python3 research/production-v2/production_v2_phase3_baseline_normalization_audit.py --selftest

      - name: Run Phase 3 denominator audit
        run: python3 research/production-v2/production_v2_phase3_baseline_normalization_audit.py --write

      - name: Verify exact reproducibility
        run: python3 research/production-v2/production_v2_phase3_baseline_normalization_audit.py --check

      - name: Print report
        run: cat research/production-v2/production_v2_phase3_baseline_normalization_audit.md

      - name: Research-only mutation safety check
        shell: bash
        run: |
          allowed="$(printf '%s\n' \
            research/production-v2/production_v2_phase3_baseline_normalization_audit.json \
            research/production-v2/production_v2_phase3_baseline_normalization_audit.md)"

          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sed '/^$/d' | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sort -u))"

          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by Phase 3:"
            echo "$unexpected"
            exit 1
          fi

          git add \
            research/production-v2/production_v2_phase3_baseline_normalization_audit.json \
            research/production-v2/production_v2_phase3_baseline_normalization_audit.md

          git diff --cached --check

          staged="$(git diff --cached --name-only | sort -u)"
          unexpected_staged="$(comm -23 <(printf '%s\n' "$staged") <(printf '%s\n' "$allowed" | sort -u))"
          if [ -n "$unexpected_staged" ]; then
            echo "Unexpected files staged:"
            echo "$unexpected_staged"
            exit 1
          fi

      - name: Commit Phase 3 audit
        shell: bash
        run: |
          git config user.name "production-v2-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No audit-output changes to commit."
          else
            git commit -m "Audit Production V2 baseline normalization"
            git push origin main
          fi
