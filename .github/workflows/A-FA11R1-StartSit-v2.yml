      - name: Install additive Start Sit workspace safely
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/a-fa11r1/install.py" | tee "$RUNNER_TEMP/a-fa11r1/installer-report.json"
      - name: Check JS syntax and fail-closed mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_workspace_v1.js
          node --check assets/fa_start_sit_v1.js
          git diff --check
          python3 - <<'PYCODE'
          import subprocess
          from pathlib import Path
          allowed={'free-agent-board.html','assets/fa_workspace_v1.js','assets/fa_start_sit_v1.js','assets/fa_start_sit_v1.css'}
          actual=set(subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines())
          paths={row[3:] for row in actual}
          if not paths.issubset(allowed):
              raise RuntimeError('Unsafe paths modified: '+repr(sorted(paths-allowed)))
          s=Path('free-agent-board.html').read_text(encoding='utf-8')
          js=Path('assets/fa_workspace_v1.js').read_text(encoding='utf-8')
          assert s.count('<!-- FA_START_SIT_V1_STYLE -->')==1 and s.count('<!-- FA_START_SIT_V1_SCRIPT -->')==1
          assert 'fa-ws-startsit-panel' in js and "key:'startsit'" in js
          assert '/* CANONICAL VALUATION SYNC' in s
          assert 'FA_MOBILE_POLISH_V1_STYLE' in s
          assert 'IDP_EARLY_V1_PANEL_START' in s
          assert 'IDP_WEEKLY_PUBLIC_V1_PANEL_START' in s
          assert not any('woellert' in p.lower() or 'idp-show' in p.lower() or 'private' in p.lower() for p in paths)
          print('PASS UI-only changed paths:', sorted(paths))
          print('PASS no paid-source data, player model, or canonical pricing file staged')
          PYCODE
          git diff --stat
      - name: Upload public-only preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-FA11R1-PUBLIC-UI-CHECKS
          path: ${{ runner.temp }}/a-fa11r1/installer-report.json
          if-no-files-found: warn
          retention-days: 21
      - name: Apply changes to main (public UI only)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html assets/fa_workspace_v1.js assets/fa_start_sit_v1.js assets/fa_start_sit_v1.css
          if git diff --cached --quiet; then
            echo 'Already installed; nothing to commit.'
          else
            git diff --cached --check
            git commit -m 'FA11: add private-import IDP start sit comparison workspace'
            git push origin HEAD:main
          fi
