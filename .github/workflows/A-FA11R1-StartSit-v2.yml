name: A-FA11R1 - IDP Start Sit Two Expert Comparison

# Public UI only. Paid ranking screenshots and derived subscriber rankings are
# deliberately NOT included in this workflow or repository. User imports the
# owner-only JSON into browser memory to compare 2-12 IDP players.
# Only additive workspace navigation and presentation files may change.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview verifies UI code and diffs; Apply commits public UI modules only"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  public-ui:
    name: Start Sit UI (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean checkout and dependent public modules
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          for path in free-agent-board.html assets/fa_workspace_v1.js assets/fa_mobile_polish_v1.js assets/idp_intel_v1.js data/free_agents.json data/my_roster.json data/league_rosters.json; do
            test -s "$path"
          done
