              raw=zlib.decompress(base64.b64decode(entry['base64_zlib']))
              digest=hashlib.sha256(raw).hexdigest()
              if digest!=entry['sha256']:
                  raise RuntimeError('Checksum mismatch in pinned public UI: '+path)
              out=(Path(os.environ['RUNNER_TEMP'])/'a-fa11r1'/'install.py') if path=='installer' else Path(path)
