      - name: Build durable closeout record
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json,math,os,shutil
          from pathlib import Path

          root=Path('/tmp/package-adjustment-v8-b4b')
          b3a=root/'b3a'
          b3b_dir=root/'b3b'
          repo=Path('research/package-adjustment-v8')

          science=json.loads((root/'science_verified.json').read_text())
          prod=json.loads((root/'production_guard.json').read_text())
          provenance=json.loads((root/'b3a_provenance.json').read_text())
          r=json.loads((b3a/'development_evaluation.json').read_text())
          c=json.loads((b3a/'dataset_commitment.json').read_text())
          d=json.loads((b3b_dir/'b3b_2v2_calibration_decomposition.json').read_text())

          assert science['decision']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert prod['status']=='PASS_PINNED_CONTROLLED_LIVE_V1_7_UNCHANGED'
          assert prod['production_behavior_unchanged'] is True
          assert provenance['guard_preceded_outcome_opening'] is True

          ln2=math.log(2.0)
          closeout={
            'schema_version':2,
            'study_id':'package-adjustment-v8-topology-split-multi-v-multi',
            'stage':'b4b_durable_scientific_stop_closeout',
            'status':'CLOSED_SCIENTIFIC_STOP',
            'operational_closeout_status':'GREEN_IF_WORKFLOW_COMPLETES',
            'scientific_decision':science['decision'],
            'scientific_interpretation':(
              'V8 found a strong developmental signal relative to a near-null raw-sum baseline on a deliberately '
              'near-balanced development catalog, but the frozen candidate failed preregistered topology safety gates. '
              'The candidate therefore cannot advance. V8 did not compare against production Package Adjustment V1.7.'
            ),
            'source_b3a':{
              **provenance,
              'dataset_sha256':c['dataset_sha256'],
              'accepted_voters':c['accepted_voters'],
              'accepted_ballots':c['accepted_ballots'],
            },
            'source_b3b':{
              'run_id':int(os.environ['B3B_RUN_ID']),
              'artifact_id':int(os.environ['B3B_ARTIFACT_ID']),
              'artifact_digest':os.environ['B3B_ARTIFACT_DIGEST'],
              'status':d['status'],
              'score_identity_2v2_all_challenges':d['score_identity_2v2_all_challenges'],
              'cross_application_identity_confirmed':d['cross_application_identity_confirmed'],
              'mechanism':d['mechanism'],
              'candidate_minus_c0_2v2':d['candidate_minus_c0_2v2'],
              'candidate_minus_c0_4v4':d['candidate_minus_c0_4v4'],
            },
            'development_signal_vs_raw_sum':{
              'c0_cv_loss':science['c0_cv_loss'],
              'candidate_cv_loss':science['candidate_cv_loss'],
              'improvement_vs_c0':science['improvement_vs_c0'],
              'natural_log_2_coinflip_loss':ln2,
              'c0_minus_coinflip_loss':science['c0_cv_loss']-ln2,
              'c0_beta_hit_lower_bound_all_folds':science['c0_beta_hit_lower_bound_all_folds'],
              'c0_beta_lower_bound':science['c0_beta_lower_bound'],
              'interpretation':(
                'In this deliberately near-balanced catalog, raw-sum differences carried negligible usable predictive '
                'signal. The beta lower-bound hit and near-coin-flip C0 loss support that narrow statement only. '
                'Beta magnitudes are not compared across C0 and C1 because their score scales differ.'
              ),
            },
            'frozen_gate_results':science['gates'],
            'topology_candidate_minus_c0':science['topology_candidate_minus_c0'],
            'reported_results_without_2v2_check':{
              'gate3_still_fails':science['reported_gate3_still_fails_if_2v2_disregarded'],
              'gate4_still_fails':science['reported_gate4_still_fails_if_2v2_disregarded'],
              '4v4_delta':science['reported_4v4_delta'],
              'interpretation':(
                'Under the frozen reported results, 4v4 alone exceeds both topology safety limits even if 2v2 is '
                'disregarded. No hypothetical five-topology refit was performed or implied.'
              ),
            },
            'production_v1_7':{
              'comparison_performed_in_v8':False,
              'behavior_unchanged_at_closeout':prod['production_behavior_unchanged'],
              'verification_status':prod['status'],
              'pinned_git_blob_sha':prod['pinned_git_blob_sha'],
            },
            'production_change_authorized':False,
            'v8_confirmation_authorized':False,
            'posthoc_rescue_model_authorized':False,
            'more_v8_voter_collection_required':False,
            'v9_candidate_or_threshold_selected_here':False,
            'future_research_policy':(
              'V8 is closed. Its opened outcomes may be used only for exploratory hypothesis generation and formal '
              'design sizing for a separately preregistered future study with fresh nonoverlapping evaluation data. '
              'They may not be relabeled as V8 confirmation or used to weaken V8 gates.'
            ),
          }

          closeout_json=repo/'package_adjustment_v8_scientific_closeout.json'
          closeout_md=repo/'package_adjustment_v8_scientific_closeout.md'
          closeout_json.write_text(json.dumps(closeout,indent=2,sort_keys=True)+'\n')

          topo=science['topology_candidate_minus_c0']
          lines=[
            '# Package Adjustment V8 — Durable Scientific Stop Closeout','',
            '**Operational status:** Green only if this workflow completes and commits this record.',
            f"**Scientific decision:** `{science['decision']}`",'',
            '## Interpretation','',
            '- V8 found a strong developmental signal **relative to a near-null raw-sum baseline** on this deliberately near-balanced catalog.',
            '- V8 did **not** compare C1 against production Package Adjustment V1.7.',
            '- The frozen C1 architecture failed preregistered topology safety gates and cannot advance.',
            '- Production V1.7 remains unchanged and no V8 production change is authorized.','',
            '## Overall frozen development result','',
            f"- C0 CV loss: **{science['c0_cv_loss']:.8f}**",
            f"- C1 CV loss: **{science['candidate_cv_loss']:.8f}**",
            f"- Improvement vs raw-sum C0: **{science['improvement_vs_c0']:.8f}**",
            f"- Coin-flip log loss ln(2): **{ln2:.8f}**",
            f"- C0 minus ln(2): **{science['c0_cv_loss']-ln2:+.8f}**",
            f"- Folds improved: **{science['folds_improved']} / 5**",
            f"- Bootstrap one-sided 95% UCB: **{science['bootstrap_one_sided_95_ucb']:.8f}**",
            f"- LOPO minimum improvement across {science['lopo_players']} players: **{science['lopo_minimum_improvement']:.8f}**",'',
            '## Topology deltas (candidate minus C0; negative is better)','',
          ]
          for t in ('2v2','2v3','2v4','3v3','3v4','4v4'):
              lines.append(f"- {t}: **{topo[t]:+.8f}**")

          lines += ['',
            '## 2v2 mechanism','',
            '- C0 and C1 2v2 package scores are exactly identical on all 10 frozen 2v2 challenges.',
            '- The frozen evaluator fits one pooled `beta` and `delta_left` per candidate/fold across all training topologies.',
            '- C1 therefore receives different 2v2 probabilities because its pooled nuisance calibration is influenced by its non-2v2 score family.',
            "- Cross-applying the nuisance fits reproduces the opposite model's 2v2 loss exactly.",
            f"- Reproduced 2v2 candidate-minus-C0 loss: **{d['candidate_minus_c0_2v2']:+.12f}**.",
            '- This is an architecture/scale-coherence failure, not a mismatch in the 2v2 score formula.','',
            '## Independent 4v4 stop','',
            f"- Frozen reported 4v4 candidate-minus-C0 loss: **{science['reported_4v4_delta']:+.12f}**.",
            '- Gate 3 permits at most +0.002 for each topology.',
            '- Gate 4 permits at most +0.010 worst-topology regression.',
            '- Under the frozen reported results, both gates still fail if 2v2 is disregarded.',
            '- This statement does **not** claim what a hypothetical five-topology refit would produce.','',
            '## C0 beta boundary','',
            '- C0 beta hit its preregistered lower bound of **0.05 in all five folds**.',
            '- Together with C0 loss near ln(2), this indicates negligible usable raw-sum signal **within this deliberately near-balanced catalog**.',
            '- Do not compare the numeric beta magnitudes of C0 and C1; their score scales differ.',
            '- The binding lower bound may slightly handicap C0 and therefore slightly overstate C1 improvement versus C0; it does not alter the STOP.','',
            '## Frozen gates','',
          ]
          for k,v in science['gates'].items():
              lines.append(f"- {'PASS' if v else 'FAIL'} — `{k}`")

          lines += ['',
            '## Production firewall','',
            f"- Pinned V1.7 verification: **{prod['status']}**",
            '- V8 comparison against V1.7: **NOT PERFORMED**',
            '- Production behavior changed by V8: **NO**',
            '- Production change authorized: **NO**',
            '- V8 confirmation authorized: **NO**',
            '- Post-hoc rescue authorized: **NO**','',
            '## Final status','',
            'V8 is scientifically closed. Future Package Adjustment work must be a separate preregistered study.',
          ]
          closeout_md.write_text('\n'.join(lines)+'\n')

          # Durable archival copies of the non-ballot evidence that would otherwise expire as Actions artifacts.
          shutil.copy2(b3a/'development_evaluation.json', repo/'development_evaluation.json')
          shutil.copy2(b3a/'dataset_commitment.json', repo/'dataset_commitment.json')
          shutil.copy2(b3a/'outcome_opening_manifest.json', repo/'outcome_opening_manifest.json')
          shutil.copy2(b3b_dir/'b3b_2v2_calibration_decomposition.json', repo/'b3b_2v2_calibration_decomposition.json')

          print('\n'.join(lines))
          PY

      - name: Commit durable non-ballot closeout evidence
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.json"
            "research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.md"
            "research/package-adjustment-v8/development_evaluation.json"
            "research/package-adjustment-v8/dataset_commitment.json"
            "research/package-adjustment-v8/outcome_opening_manifest.json"
            "research/package-adjustment-v8/b3b_2v2_calibration_decomposition.json"
          )

          # Fail closed if this workflow touched anything outside the six durable closeout files.
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
          mapfile -t allowed < <(printf '%s\n' "${files[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${allowed[@]}") <(printf '%s\n' "${changed[@]}"); then
            echo "ERROR: closeout touched files outside the exact durable allow-list, or an expected file is missing."
            exit 1
          fi

          git add -- "${files[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          if ! diff -u <(printf '%s\n' "${allowed[@]}") <(printf '%s\n' "${staged[@]}"); then
            echo "ERROR: staged closeout paths differ from exact durable allow-list."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close Package Adjustment V8 with durable scientific STOP record"
          git push origin HEAD:main

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: durable V8 closeout evidence committed to main."

      - name: Upload convenience closeout artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v8-b4b-durable-scientific-stop-closeout
          path: |
            research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.json
            research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.md
            research/package-adjustment-v8/development_evaluation.json
            research/package-adjustment-v8/dataset_commitment.json
            research/package-adjustment-v8/outcome_opening_manifest.json
            research/package-adjustment-v8/b3b_2v2_calibration_decomposition.json
          if-no-files-found: error
          retention-days: 30
