name: B4B Package Adjustment V8 - Durable Scientific Stop Closeout V3

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: package-adjustment-v8-durable-scientific-stop-closeout-v3
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

  SOURCE_RUN_ID: "37263931701"
  SOURCE_ARTIFACT_ID: "11325577076"
  SOURCE_ARTIFACT_DIGEST: "sha256:fbe1909ed03270614d0b91730516247e753716847e4e3b0bf4ae1511a2b9b889"
  SOURCE_DATASET_SHA256: "e6d4beaae2699bd9a029e3d9c53d680cd30f6c2aaf4d460e6aca64dc3d18106d"

  B3A_HEAD_SHA: "54f67f100e39059ec2a4423fc23c3294f8a18655"
  B3A_WORKFLOW_PATH: ".github/workflows/B3A-package-adjustment-v8-frozen-development-outcome-evaluator-v2-catalog-guard-repair.yml"
  B3A_WORKFLOW_BLOB_SHA: "22cce951d6ec82ea02e48abbc4347d3d769f2eaa"
  B3A_EVALUATOR_BLOB_SHA: "bef73c81bdff771f51b4f18bea011b30a71e9935"

  B3B_RUN_ID: "37265254640"
  B3B_ARTIFACT_ID: "11326177474"
  B3B_ARTIFACT_DIGEST: "sha256:b364a1a57b7635ee5306849096d7fb4792469c165a16cc04a1bdf013a07ad06c"

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install closeout dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V8 scientific contract
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v8/topology_split_preregistration_v1.json"]="0861346a483ed9938246fd04173408c47c012ee9"
            ["research/package-adjustment-v8/fixed50_protocol_amendment_v1.json"]="d2b931dc03acee62b10091f064737b125467b705"
            ["research/package-adjustment-v8/evaluation_protocol_v1.json"]="263db22eb41be6b458479d7fb76ad61f55b0bcd8"
            ["research/package-adjustment-v8/evaluation_engine_manifest_v1.json"]="6d49b1a1be4c3dd108820de9db7c370b0185a10b"
            ["research/package-adjustment-v8/evaluate_development_v1.py"]="bef73c81bdff771f51b4f18bea011b30a71e9935"
            ["research/package-adjustment-v8/development_catalog_manifest_v1.json"]="970d52eb39d093c27f6086ba018f62bd6d53217a"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/voting_integrity_contract_v1.json"]="203fd97e27e31413b5c18e3f8c7ecd6fd06cfeb8"
          )
          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen V8 artifact drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path('research/package-adjustment-v8')
          prereg=json.loads((d/'topology_split_preregistration_v1.json').read_text())
          proto=json.loads((d/'evaluation_protocol_v1.json').read_text())

          assert prereg['development_evaluation']['no_posthoc_rescue_model'] is True
          assert prereg['production_firewall']['automatic_production_change_authorized'] is False
          assert proto['if_fail']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert proto['production_change_authorized'] is False
          assert proto['no_posthoc_rescue_model'] is True

          expected_gates={
            'all_six_topologies_improve_or_within':0.002,
            'bootstrap_one_sided_95_ucb_lt':0.0,
            'combined_cv_improvement_min':0.005,
            'delta_left_zero_ranking_unchanged':True,
            'folds_improved_min':4,
            'leave_one_player_out_positive_every_player':True,
            'mathematical_invariants_pass':True,
            'worst_topology_regression_max':0.01,
          }
          assert proto['gates']==expected_gates
          print('PASS: original V8 scientific contract and stop rule remain frozen.')
          PY

      - name: Fetch exact B3A result and prove evaluator provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v8-b4b
          mkdir -p /tmp/package-adjustment-v8-b4b/b3a /tmp/package-adjustment-v8-b4b/b3b

          python3 - <<'PY'
          import base64,hashlib,io,json,os,zipfile
          from pathlib import Path
          from urllib.parse import quote
          import requests

          repo=os.environ['GITHUB_REPOSITORY']
          artifact_id=int(os.environ['SOURCE_ARTIFACT_ID'])
          run_id=int(os.environ['SOURCE_RUN_ID'])
          expected_digest=os.environ['SOURCE_ARTIFACT_DIGEST']
          head_sha=os.environ['B3A_HEAD_SHA']
          workflow_path=os.environ['B3A_WORKFLOW_PATH']
          workflow_blob=os.environ['B3A_WORKFLOW_BLOB_SHA']
          evaluator_blob=os.environ['B3A_EVALUATOR_BLOB_SHA']

          headers={
              'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
          }

          # Exact B3A run provenance.
          run=requests.get(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
              headers=headers,timeout=30,
          )
          run.raise_for_status()
          runj=run.json()
          assert runj['conclusion']=='success'
          assert runj['head_sha']==head_sha,(runj['head_sha'],head_sha)
          assert runj['name']=='B3A Package Adjustment V8 - Frozen Development Outcome Evaluator V2 Catalog Guard Repair'

          # Exact B3A artifact.
          meta=requests.get(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}',
              headers=headers,timeout=30,
          )
          meta.raise_for_status()
          a=meta.json()
          assert a['name']=='package-adjustment-v8-b3a-frozen-development-evaluation'
          assert a['workflow_run']['id']==run_id
          assert a.get('digest')==expected_digest,(a.get('digest'),expected_digest)
          assert not a.get('expired',False)

          r=requests.get(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
              headers=headers,timeout=60,
          )
          r.raise_for_status()
          data=r.content
          actual='sha256:'+hashlib.sha256(data).hexdigest()
          assert actual==expected_digest,(actual,expected_digest)

          z=zipfile.ZipFile(io.BytesIO(data))
          names=set(z.namelist())
          required={'development_evaluation.json','dataset_commitment.json','outcome_opening_manifest.json','report.md'}
          assert required.issubset(names),names
          assert 'frozen_opened_dataset.json' not in names
          for name in required:
              (Path('/tmp/package-adjustment-v8-b4b/b3a')/name).write_bytes(z.read(name))

          # The B3A opening manifest did not store a redundant evaluator SHA. Prove the
          # evaluator identity by pinning the exact workflow and evaluator at the exact run commit.
          wf=requests.get(
              f'https://api.github.com/repos/{repo}/contents/{quote(workflow_path, safe="/")}?ref={head_sha}',
              headers=headers,timeout=30,
          )
          wf.raise_for_status()
          wfj=wf.json()
          assert wfj['sha']==workflow_blob,(wfj['sha'],workflow_blob)
          wf_text=base64.b64decode(wfj['content']).decode()
          assert f'["research/package-adjustment-v8/evaluate_development_v1.py"]="{evaluator_blob}"' in wf_text
          assert wf_text.index('Guard pre-vote scientific contract and B2C #6 freeze provenance') < wf_text.index('Open only the frozen 50-voter dataset and build evaluator input')

          ev=requests.get(
              f'https://api.github.com/repos/{repo}/contents/research/package-adjustment-v8/evaluate_development_v1.py?ref={head_sha}',
              headers=headers,timeout=30,
          )
          ev.raise_for_status()
          assert ev.json()['sha']==evaluator_blob,(ev.json()['sha'],evaluator_blob)

          opening=json.loads((Path('/tmp/package-adjustment-v8-b4b/b3a')/'outcome_opening_manifest.json').read_text())
          assert opening['status']=='FROZEN_BEFORE_OUTCOME_OPENING'
          assert opening['evaluator']=='research/package-adjustment-v8/evaluate_development_v1.py'
          assert opening['evaluation_protocol']=='research/package-adjustment-v8/evaluation_protocol_v1.json'
          assert opening['human_vote_outcomes_read_to_create_this_manifest'] is False
          assert opening['posthoc_threshold_changes_allowed'] is False
          assert opening['posthoc_rescue_model_allowed'] is False
          assert opening['automatic_production_change_authorized'] is False

          provenance={
              'b3a_run_id':run_id,
              'b3a_run_head_sha':head_sha,
              'b3a_artifact_id':artifact_id,
              'b3a_artifact_digest':expected_digest,
              'b3a_workflow_path':workflow_path,
              'b3a_workflow_blob_sha':workflow_blob,
              'b3a_evaluator_path':opening['evaluator'],
              'b3a_evaluator_blob_sha':evaluator_blob,
              'guard_preceded_outcome_opening':True,
              'opening_manifest_created_outcome_blind':True,
          }
          Path('/tmp/package-adjustment-v8-b4b/b3a_provenance.json').write_text(
              json.dumps(provenance,indent=2,sort_keys=True)+'\n'
          )
          print('PASS: exact B3A artifact, run commit, workflow, and frozen evaluator provenance verified.')
          PY

      - name: Fetch and verify exact B3B decomposition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,io,json,math,os,zipfile
          from pathlib import Path
          import requests

          repo=os.environ['GITHUB_REPOSITORY']
          artifact_id=int(os.environ['B3B_ARTIFACT_ID'])
          run_id=int(os.environ['B3B_RUN_ID'])
          expected_digest=os.environ['B3B_ARTIFACT_DIGEST']
          headers={
              'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
          }

          run=requests.get(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
              headers=headers,timeout=30,
          )
          run.raise_for_status()
          runj=run.json()
          assert runj['conclusion']=='success'
          assert runj['name']=='B3B Package Adjustment V8 - Read-Only 2v2 Calibration Decomposition'

          meta=requests.get(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}',
              headers=headers,timeout=30,
          )
          meta.raise_for_status()
          a=meta.json()
          assert a['name']=='package-adjustment-v8-b3b-2v2-calibration-decomposition'
          assert a['workflow_run']['id']==run_id
          assert a.get('digest')==expected_digest,(a.get('digest'),expected_digest)
          assert not a.get('expired',False)

          r=requests.get(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
              headers=headers,timeout=60,
          )
          r.raise_for_status()
          data=r.content
          actual='sha256:'+hashlib.sha256(data).hexdigest()
          assert actual==expected_digest,(actual,expected_digest)

          z=zipfile.ZipFile(io.BytesIO(data))
          required={'b3b_2v2_calibration_decomposition.json','b3b_2v2_calibration_decomposition.md'}
          assert required.issubset(set(z.namelist())),z.namelist()
          for name in required:
              (Path('/tmp/package-adjustment-v8-b4b/b3b')/name).write_bytes(z.read(name))

          d=json.loads((Path('/tmp/package-adjustment-v8-b4b/b3b')/'b3b_2v2_calibration_decomposition.json').read_text())
          assert d['status']=='PASS_MECHANISM_CONFIRMED_SHARED_NUISANCE_CALIBRATION'
          assert d['scientific_decision_changed'] is False
          assert d['b3a_decision']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert d['score_identity_2v2_all_challenges'] is True
          assert d['score_identity_checked_challenges']==10
          assert d['cross_application_identity_confirmed'] is True
          assert math.isclose(d['candidate_minus_c0_2v2'],0.11357690451791291,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(d['candidate_minus_c0_4v4'],0.17081403548847707,rel_tol=0,abs_tol=1e-12)
          assert d['production_change_authorized'] is False
          assert d['posthoc_rescue_authorized'] is False
          assert len(d['fold_decomposition'])==5
          assert all(abs(x['c0_beta']-0.05)<1e-12 for x in d['fold_decomposition'])
          assert any(abs(x['c1_beta']-x['c0_beta'])>1e-6 for x in d['fold_decomposition'])

          print('PASS: exact B3B decomposition verified; shared-calibration mechanism confirmed.')
          PY

      - name: Validate scientific STOP including 4v4 independent failure
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json,math,os
          from pathlib import Path

          root=Path('/tmp/package-adjustment-v8-b4b')
          b3a=root/'b3a'
          b3b_dir=root/'b3b'

          r=json.loads((b3a/'development_evaluation.json').read_text())
          c=json.loads((b3a/'dataset_commitment.json').read_text())
          opening=json.loads((b3a/'outcome_opening_manifest.json').read_text())
          d=json.loads((b3b_dir/'b3b_2v2_calibration_decomposition.json').read_text())

          assert c['status']=='PASS_FROZEN_50_DATASET_OPENED'
          assert c['accepted_voters']==50
          assert c['accepted_ballots']==2000
          assert c['accepted_slots']==50
          assert c['dataset_sha256']==os.environ['SOURCE_DATASET_SHA256']
          assert c['post_freeze_v8_rows_ignored']==0
          assert c['outcomes_opened'] is True
          assert c['production_change_authorized'] is False

          assert opening['source_run_id']==37262731480
          assert opening['accepted_voters_exactly']==50
          assert opening['accepted_ballots_exactly']==2000
          assert opening['accepted_slots_exactly']=='1-50'

          assert r['decision']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert r['candidate']=='C1_TOPOLOGY_SPLIT_V6_TRANSFER'
          assert r['production_change_authorized'] is False
          assert r['confirmation_catalog_generated'] is False

          expected_gates={
            'combined_cv_improvement_ge_0_005':True,
            'folds_improved_ge_4':True,
            'all_6_topologies_improve_or_within_0_002':False,
            'worst_topology_regression_le_0_010':False,
            'bootstrap_one_sided_95_ucb_lt_0':True,
            'delta_left_zero_ranking_unchanged':True,
            'leave_one_player_out_positive_every_player':True,
            'mathematical_invariants_pass':True,
          }
          assert r['gates']==expected_gates,r['gates']

          expected_topology={
            '2v2':0.11357690451791291,
            '2v3':-0.4987874118540192,
            '2v4':-0.6205329861880511,
            '3v3':-0.06881322812565505,
            '3v4':-0.27133399425164023,
            '4v4':0.17081403548847707,
          }
          for k,v in expected_topology.items():
              assert math.isclose(r['topology_candidate_minus_c0'][k],v,rel_tol=0,abs_tol=1e-12),(k,r['topology_candidate_minus_c0'][k],v)

          scalars={
            'c0_cv_loss':0.6942343144226046,
            'candidate_cv_loss':0.4983882010204419,
            'improvement_vs_c0':0.19584611340216274,
            'worst_topology_regression':0.17081403548847707,
          }
          for k,v in scalars.items():
              assert math.isclose(r[k],v,rel_tol=0,abs_tol=1e-12),(k,r[k],v)
          assert r['folds_improved']==5
          assert math.isclose(r['bootstrap']['one_sided_95_ucb'],-0.1354998581121094,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(r['leave_one_player_out']['minimum_improvement_vs_c0'],0.17518961680852474,rel_tol=0,abs_tol=1e-12)
          assert r['leave_one_player_out']['all_positive'] is True
          assert r['leave_one_player_out']['players']==143

          # Explicitly establish that the frozen reported 4v4 result alone is sufficient
          # to keep both topology safety gates failed if 2v2 is disregarded. This is NOT
          # a hypothetical refit of a five-topology V8.
          without_2v2={
              k:v for k,v in r['topology_candidate_minus_c0'].items()
              if k!='2v2'
          }
          reported_gate3_without_2v2=all(v<=0.002+1e-12 for v in without_2v2.values())
          reported_gate4_without_2v2=max(without_2v2.values())<=0.010+1e-12
          assert reported_gate3_without_2v2 is False
          assert reported_gate4_without_2v2 is False
          assert math.isclose(without_2v2['4v4'],0.17081403548847707,rel_tol=0,abs_tol=1e-12)

          c0_beta_boundary_all_folds=all(abs(x['c0_beta']-0.05)<1e-12 for x in d['fold_decomposition'])
          assert c0_beta_boundary_all_folds

          science={
              'status':'PASS_SCIENTIFIC_STOP_REPRODUCED',
              'decision':r['decision'],
              'dataset_sha256':c['dataset_sha256'],
              'gates':r['gates'],
              'topology_candidate_minus_c0':r['topology_candidate_minus_c0'],
              'c0_cv_loss':r['c0_cv_loss'],
              'candidate_cv_loss':r['candidate_cv_loss'],
              'improvement_vs_c0':r['improvement_vs_c0'],
              'folds_improved':r['folds_improved'],
              'bootstrap_one_sided_95_ucb':r['bootstrap']['one_sided_95_ucb'],
              'lopo_minimum_improvement':r['leave_one_player_out']['minimum_improvement_vs_c0'],
              'lopo_players':r['leave_one_player_out']['players'],
              'b3b_2v2_mechanism_confirmed':True,
              'b3b_2v2_score_identity_confirmed':True,
              'b3b_cross_application_identity_confirmed':True,
              'reported_gate3_still_fails_if_2v2_disregarded':True,
              'reported_gate4_still_fails_if_2v2_disregarded':True,
              'reported_4v4_delta':without_2v2['4v4'],
              'five_topology_hypothetical_refit_performed':False,
              'c0_beta_hit_lower_bound_all_folds':True,
              'c0_beta_lower_bound':0.05,
              'production_v1_7_comparison_performed':False,
              'production_change_authorized':False,
              'posthoc_rescue_authorized':False,
          }
          (root/'science_verified.json').write_text(json.dumps(science,indent=2,sort_keys=True)+'\n')
          print('PASS: frozen V8 STOP reproduced; 4v4 independently preserves both failed topology safety gates under the reported results.')
          PY

      - name: Pin and verify deployed Package Adjustment V1.7
        shell: bash
        run: |
          set -euo pipefail

          declare -A PROD_BLOBS=(
            ["index.html"]="f7d10863e27ba7f427c140de9d4faf14a879e5cc"
            ["scripts/validation/check_package_adjustment_live.py"]="3c924d762f93fd93b9943afe090deda6a2b7d8a0"
            ["scripts/validation/package_adjustment_exact_live_oos.py"]="c9dd08b44176e4973c83c43dd2273948caf89447"
            ["scripts/validation/package_adjustment_exact_live_oos_v1_7.py"]="b40c905333d5d388ff73de9d564c12fe08c13ade"
            ["research/package-adjustment-production-candidate-v1/live_deployment.json"]="fb192d6d52ca302f9694adc3ae39c7f1047f6140"
            ["research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_7.json"]="857c1c0fd66ba596e8ef76ccd39d4ec1c00268a2"
            ["research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json"]="87bcc8408959e221dcf27877c1d784d6d3e552a4"
            ["research/package-adjustment-v6/production_candidate_v1.json"]="9abaf2c01890da3abb0d13ae4d57cb37b91a08e2"
            ["research/package-adjustment-v6/prospective_evaluation_v1.json"]="7fd2a07f3bd9b9214e1293d50b867c7f023ab2d1"
            ["research/package-adjustment-v6/production_review_v1.json"]="e39bff1ce541e093b2a9140e12716c24fbaffb86"
            ["research/package-adjustment-v6/prospective_exact_1800_frozen_v1.json"]="a9d78303aaa659aed9864e8090f53d9c2e36bd9b"
            ["research/package-adjustment-v6/package_vote_challenges_v6_prospective_v1.json"]="dd12608b1b5fee03da5965458d6e59284657dce3"
            [".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml"]="368488448f2770e4adc7bec7767e4a29b5098182"
          )

          for p in "${!PROD_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${PROD_BLOBS[$p]}" || {
              echo "ERROR: controlled-live V1.7 production artifact drift: $p expected=${PROD_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 scripts/validation/check_package_adjustment_live.py | tee /tmp/package-adjustment-v8-b4b/production_validator_output.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          output=Path('/tmp/package-adjustment-v8-b4b/production_validator_output.txt').read_text()
          assert output.strip(), 'production validator produced no output'
          assert 'PASS controlled-live Package Adjustment V1.7:' in output

          pinned={
            'index.html':'f7d10863e27ba7f427c140de9d4faf14a879e5cc',
            'scripts/validation/check_package_adjustment_live.py':'3c924d762f93fd93b9943afe090deda6a2b7d8a0',
            'scripts/validation/package_adjustment_exact_live_oos.py':'c9dd08b44176e4973c83c43dd2273948caf89447',
            'scripts/validation/package_adjustment_exact_live_oos_v1_7.py':'b40c905333d5d388ff73de9d564c12fe08c13ade',
            'research/package-adjustment-production-candidate-v1/live_deployment.json':'fb192d6d52ca302f9694adc3ae39c7f1047f6140',
            'research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_7.json':'857c1c0fd66ba596e8ef76ccd39d4ec1c00268a2',
