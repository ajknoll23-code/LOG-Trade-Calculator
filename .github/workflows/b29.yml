# PREFLIGHTED: B29_DRAFT_CAPITAL_OUTLOOK_V3_HISTORICAL_SOURCE_ONLY_ENUMERATION
name: B29 Draft Capital Outlook V3 - Historical Source Enumeration and N-K Selection

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preregister_b29_execution:
    name: Freeze B29 transport implementation before historical enumeration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Guard B28 pass and write B29 execution contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b29-contract
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          b27=json.loads(Path("research/draft-capital-outlook-v3/b27/b27_phase0a_preregistration.json").read_text())
          b28=json.loads(Path("research/draft-capital-outlook-v3/b28/b28_manifest.json").read_text())
          assert b28["decision"]=="PASS_B28_INSTRUMENT_VALIDATION_AUTHORIZE_B29_HISTORICAL_SOURCE_AUDIT"
          assert b28["instrument_validation_pass"] is True
          assert b28["K32_sensitivity"]>=0.95 and b28["K32_specificity"]>=0.95
          assert b28["K60_sensitivity"]>=0.95 and b28["K60_specificity"]>=0.95
          assert b28["b29_historical_source_audit_authorized"] is True
          assert b28["historical_candidate_enumeration_authorized"] is True
          assert b28["2027_candidate_enumeration_authorized"] is False
          assert b28["historical_actual_capital_open_authorized"] is False

          contract={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v3",
            "stage":"b29_execution_contract_frozen_before_historical_network_enumeration",
            "historical_years":b27["anchor_contract"]["historical_class_years"],
            "domains":b27["publisher_domain_frame_v1"]["domains"],
            "channels":[x["channel_id"] for x in b27["deterministic_enumeration_protocol"]["candidate_union_channels_in_order"]],
            "url_filter":b27["deterministic_enumeration_protocol"]["candidate_url_text_filter"],
            "candidate_K":b27["availability_only_nk_selection"]["candidate_K"],
            "candidate_N":b27["availability_only_nk_selection"]["candidate_N"],
            "minimum_historical_classes_required":b27["availability_only_nk_selection"]["minimum_historical_classes_required"],
            "http":{
              "user_agent":"LOG-Draft-Capital-Outlook-V3-B29/1.0 (+historical source-only audit; GitHub Actions)",
              "timeout_seconds":20,
              "index_timeout_seconds":35,
              "retry_delays_seconds":[0,2,6]
            },
            "limits":{
              "max_sitemap_documents_per_domain":120,
              "max_index_rows_per_domain_year":5000,
              "max_candidates_per_year":1500
            },
            "commoncrawl":{
              "max_index_distance_days":45,
              "max_indexes_per_year":3
            },
            "capture_priority":["WAYBACK_REPLAY_NEAREST_TO_ANCHOR","LIVE_HTTP_FALLBACK"],
            "transport_or_template_failure_policy":"UNRESOLVED_NOT_SOURCE_FAILURE",
            "candidate_truncation_policy":"UNRESOLVED_NOT_NEGATIVE_EVIDENCE",
            "nk_inference_policy":"Use positive lower bounds. If unresolved classes could change the first eligible K or largest eligible N, return INCONCLUSIVE rather than downgrade or stop.",
            "2027_enumeration_authorized":False,
            "player_identity_or_position_extraction_authorized":False,
            "historical_actual_capital_open_authorized":False,
            "predictor_target_association_authorized":False,
            "production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0
          }
          p=Path("/tmp/b29-contract/b29_execution_contract.json")
          p.write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          Path("/tmp/b29-contract/b29_execution_contract.sha256").write_text(f"{h}  {p.name}\n")
          print(json.dumps({"contract_sha256":h},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: b29-contract
          path: /tmp/b29-contract/
          if-no-files-found: error
          retention-days: 7

  enumerate_historical_years:
    name: Historical source-only enumeration ${{ matrix.year }}
    needs: preregister_b29_execution
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - uses: actions/download-artifact@v4
        with:
          name: b29-contract
          path: /tmp/b29-contract

      - name: Materialize frozen B29 scanner
        shell: bash
        env:
          B29_SCANNER_B64: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          p=Path("/tmp/b29_scanner.py")
          p.write_bytes(base64.b64decode(os.environ["B29_SCANNER_B64"]))
          compile(p.read_text(),str(p),"exec")
          print("scanner_sha256",__import__("hashlib").sha256(p.read_bytes()).hexdigest())
          PY

      - name: Enumerate and qualify historical source structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b29-year
          python3 /tmp/b29_scanner.py             --year "${{ matrix.year }}"             --contract /tmp/b29-contract/b29_execution_contract.json             --output "/tmp/b29-year/b29_${{ matrix.year }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: b29-year-${{ matrix.year }}
          path: /tmp/b29-year/
          if-no-files-found: error
          retention-days: 7

  reduce_b29:
    name: Reduce historical availability and freeze K-N selection
    needs: enumerate_historical_years
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - uses: actions/download-artifact@v4
        with:
          name: b29-contract
          path: /tmp/b29-contract

      - uses: actions/download-artifact@v4
        with:
          pattern: b29-year-*
          path: /tmp/b29-years
          merge-multiple: true

      - name: Reduce without opening outcomes or 2027
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v3/b29
          mkdir -p research/draft-capital-outlook-v3/b29/years

          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v3/b29")
          C=Path("/tmp/b29-contract/b29_execution_contract.json")
          contract=json.loads(C.read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          years=[]
          for y in contract["historical_years"]:
              p=Path(f"/tmp/b29-years/b29_{y}.json")
              assert p.is_file(),p
              j=json.loads(p.read_text())
              assert j["class_year"]==y
              assert j["2027_source_enumerated"] is False
              assert j["player_names_extracted"] is False
              assert j["player_positions_extracted"] is False
              assert j["historical_actual_capital_loaded"] is False
              assert j["predictor_target_association_computed"] is False
              assert j["production_change_authorized"] is False
              years.append(j)
              shutil.copy2(p,O/"years"/p.name)

          shutil.copy2(C,O/"b29_execution_contract.json")
          shutil.copy2("/tmp/b29-contract/b29_execution_contract.sha256",O/"b29_execution_contract.sha256")

          min_classes=int(contract["minimum_historical_classes_required"])
          unresolved={32:[],60:[]}
          counts={32:{},60:{}}
          for k in (60,32):
              for j in years:
                  c=int(j[f"independent_qualifying_count_K{k}"])
                  counts[k][j["class_year"]]=c
                  if j["unresolved_measurement_or_truncation"] and c < 5:
                      unresolved[k].append(j["class_year"])

          def support(k,n):
              return sorted(y for y,c in counts[k].items() if c>=n)

          # Select K in frozen priority order; unresolved evidence can block a downgrade.
          selected_k=None
          k_status={}
          for k in contract["candidate_K"]:
              confirmed=support(k,3)
              unresolved_possible=sorted(y for y in unresolved[k] if y not in confirmed)
              if len(confirmed)>=min_classes:
                  k_status[k]={"status":"SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":unresolved_possible}
                  selected_k=k
                  break
              if len(confirmed)+len(unresolved_possible)>=min_classes:
                  k_status[k]={"status":"INCONCLUSIVE","confirmed_classes":confirmed,"unresolved_possible_classes":unresolved_possible}
                  break
              k_status[k]={"status":"NOT_SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":unresolved_possible}

          selected_n=None
          decision=None
          n_status={}
          if selected_k is None:
              if any(v["status"]=="INCONCLUSIVE" for v in k_status.values()):
                  decision="INCONCLUSIVE_B29_HISTORICAL_ENUMERATION_REQUIRES_TRANSPORT_OR_TEMPLATE_COMPLETION"
              else:
                  decision="STOP_V3_B29_INSUFFICIENT_HISTORICAL_SOURCE_AVAILABILITY_KEEP_NEUTRAL_1_00"
          else:
              for n in contract["candidate_N"]:
                  confirmed=support(selected_k,n)
                  unresolved_possible=sorted(y for y in unresolved[selected_k] if y not in confirmed)
                  if len(confirmed)>=min_classes:
                      n_status[n]={"status":"SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":unresolved_possible}
                      selected_n=n
                      decision="PASS_B29_HISTORICAL_AVAILABILITY_SELECT_K_N_AUTHORIZE_B30_2027_SOURCE_FEASIBILITY"
                      break
                  if len(confirmed)+len(unresolved_possible)>=min_classes:
                      n_status[n]={"status":"INCONCLUSIVE","confirmed_classes":confirmed,"unresolved_possible_classes":unresolved_possible}
                      decision="INCONCLUSIVE_B29_HISTORICAL_ENUMERATION_REQUIRES_TRANSPORT_OR_TEMPLATE_COMPLETION"
                      break
                  n_status[n]={"status":"NOT_SUPPORTED","confirmed_classes":confirmed,"unresolved_possible_classes":unresolved_possible}
              if selected_n is None and decision is None:
                  decision="STOP_V3_B29_INSUFFICIENT_HISTORICAL_SOURCE_AVAILABILITY_KEEP_NEUTRAL_1_00"

          result={
            "schema_version":1,"study_id":"draft-capital-outlook-v3","stage":"b29_historical_source_only_reducer",
            "decision":decision,"selected_K":selected_k,"selected_N":selected_n,
            "minimum_historical_classes_required":min_classes,
            "K_status":k_status,"N_status":n_status,
            "per_year_summary":[{
                "class_year":j["class_year"],
                "K60":j["independent_qualifying_count_K60"],
                "K32":j["independent_qualifying_count_K32"],
                "unresolved":j["unresolved_measurement_or_truncation"],
                "candidate_count":j["candidate_url_count_evaluated"],
                "transport_warning_count":j["transport_warning_count"]
            } for j in years],
            "2027_candidate_enumerated":False,
            "player_identity_opened":False,"player_positions_opened":False,
            "historical_actual_capital_opened":False,
            "predictor_target_association_computed":False,
            "2027_class_scored":False,"production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0
          }
          rp=O/"b29_result.json"
          rp.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          b30=(decision=="PASS_B29_HISTORICAL_AVAILABILITY_SELECT_K_N_AUTHORIZE_B30_2027_SOURCE_FEASIBILITY")
          manifest={
            "schema_version":1,"study_id":"draft-capital-outlook-v3","stage":"b29_manifest",
            "b29_executed":True,"b29_execution_count_committed":1,
            "decision":decision,"selected_K":selected_k,"selected_N":selected_n,
            "b30_2027_source_feasibility_authorized":b30,
            "b29_completion_only_followup_authorized":decision.startswith("INCONCLUSIVE_"),
            "v3_stopped_for_historical_availability":decision.startswith("STOP_V3_"),
            "2027_candidate_enumeration_authorized":b30,
            "player_identity_open_authorized":False,"predictor_construction_authorized":False,
            "historical_actual_capital_open_authorized":False,
            "predictor_target_association_authorized":False,
            "2027_class_scoring_authorized":False,"production_change_authorized":False,
            "draft_capital_outlook_multiplier":1.0,
            "output_hashes":{
              "b29_execution_contract.json":sha(O/"b29_execution_contract.json"),
              "b29_result.json":sha(rp)
            }
          }
          mp=O/"b29_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          report=[
            "# Draft Capital Outlook V3 — B29 Historical Source-Only Enumeration","",
            f"Decision: **{decision}**","",
            f"- Selected K: **{selected_k if selected_k is not None else 'NONE'}**",
            f"- Selected N: **{selected_n if selected_n is not None else 'NONE'}**","",
            "Per-year lower-bound counts:"
          ]
          for j in years:
              report.append(f"- {j['class_year']}: K60={j['independent_qualifying_count_K60']}, K32={j['independent_qualifying_count_K32']}, unresolved={j['unresolved_measurement_or_truncation']}")
          report += ["","No 2027 source enumeration, player identity/position extraction, historical actual-capital outcome, association test, multiplier, or production change occurred in B29."]
          (O/"b29_report.md").write_text("\n".join(report)+"\n")

          files=[O/"b29_execution_contract.json",rp,mp,O/"b29_report.md"]
          (O/"b29_hashes.sha256").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Run repository regression after B29 artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/draft-capital-outlook-v3/b29"
          PRESERVE_DIR="$(mktemp -d)"
          PRESERVE_ARCHIVE="$PRESERVE_DIR/b29.tar"
          tar -C "$ROOT" -cf "$PRESERVE_ARCHIVE" .
          restore_b29() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$PRESERVE_ARCHIVE"
            rm -rf "$PRESERVE_DIR"
          }
          trap restore_b29 EXIT
          python3 scripts/validation/repo_regression_checks.py
          restore_b29
          trap - EXIT

      - name: Commit B29 source-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v3/b29
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No B29 changes to commit."
            exit 1
          fi
          git commit -m "B29 historical source-only enumeration for Draft Capital Outlook V3"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final clean-state confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B29 complete. Read the committed manifest for PASS, STOP, or INCONCLUSIVE."
