      - name: Run repository regression preserving B29 artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="research/draft-capital-outlook-v3/b29"; P="$(mktemp -d)"; A="$P/b29.tar"; tar -C "$ROOT" -cf "$A" .
          restore() { rm -rf "$ROOT"; mkdir -p "$ROOT"; tar -C "$ROOT" -xf "$A"; rm -rf "$P"; }
          trap restore EXIT; python3 scripts/validation/repo_regression_checks.py; restore; trap - EXIT
      - name: Commit B29 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v3/b29; git diff --cached --check
          if git diff --cached --quiet; then echo "No B29 changes to commit."; exit 1; fi
          git commit -m "B29 historical source enumeration V2 sharded"; git pull --rebase origin main; git push origin HEAD:main
      - name: Final clean-state confirmation
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B29 V2 sharded complete. Read committed manifest for PASS, STOP, or INCONCLUSIVE."
