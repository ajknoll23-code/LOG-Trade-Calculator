          assert m['status']=='PASS_B5C_CALIBRATION_INTEGRITY_AND_COVERAGE_DIAGNOSTICS_ONLY'
          for k in ['v9_candidate_selected','v9_architecture_frozen','v9_comparator_implementation_frozen','v9_primary_metric_frozen','v9_gate_frozen','v9_sample_size_frozen','v9_catalog_generated','v9_outcomes_exist_or_were_read','production_v1_7_predictions_read_on_v8_votes','production_change_authorized']:
            assert m[k] is False,(k,m[k])
          w=json.loads((d/'reconstruction_witness.json').read_text())
          assert w['dataset_sha256']=='e6d4beaae2699bd9a029e3d9c53d680cd30f6c2aaf4d460e6aca64dc3d18106d'
          assert w['raw_human_ballots_retained_in_durable_b5c_outputs'] is False
          print('PASS: B5C outputs validated; no human-level V8 rows remain and no V9/production authorization exists.')
          PY

      - name: Commit durable B5C diagnostic record to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b5c-calibration-diagnostics"
          mkdir -p "$DEST"
          ALLOW=(
            b5c_posterior_predictive_check.json
            b5c_joint_nuisance_draws.json
            b5c_effect_calibration_check.json
            b5c_uncertainty_coverage_check.json
            b5c_diagnostic_manifest.json
            b5c_report.md
            reconstruction_witness.json
            b5c_output_hashes.json
          )
          for f in "${ALLOW[@]}"; do cp "/tmp/package-adjustment-v9-b5c/$f" "$DEST/$f"; done

          test -z "$(find "$DEST" -maxdepth 1 -type f -printf '%f\n' | sort | comm -23 - <(printf '%s\n' "${ALLOW[@]}" | sort))"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "B5C durable outputs already identical; no commit needed."
