name: B5C Package Adjustment V9 - Calibration Integrity and Coverage Diagnostics

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b5c-calibration-integrity-coverage
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  V8_EXPECTED_DATASET_SHA256: "e6d4beaae2699bd9a029e3d9c53d680cd30f6c2aaf4d460e6aca64dc3d18106d"
  B5C_ANALYSIS_VERSION: "package-adjustment-v9-b5c-calibration-integrity-coverage-v2-point-fit-parity-repair"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" "numpy==2.3.3" "scipy==1.16.2"

      - name: Guard V8 closeout and exact B5A B5B planning records
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.json"]="7073583e2ad9c65757dd0c81a8741734cdbb7dc0"
            ["research/package-adjustment-v8/dataset_commitment.json"]="6911d06d8d977d4dd9ed79ccdc041be1290d588f"
            ["research/package-adjustment-v8/outcome_opening_manifest.json"]="3da9878197d6ce668f4215a446265b9736c9030e"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/development_voting_activation_manifest_v1.json"]="938bf754c90adeda8f3a5f863acfda8967c3818d"
            ["research/package-adjustment-v8/voting_randomization_schedule_v1.json"]="c499d85b8473798294eccfe9310ec9644c1db3fc"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_assignment_feasibility.json"]="7c6bd256911871f01af3fa2067729ee520f79f35"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_design_sizing_manifest.json"]="d71c6c5771de8d19c97f148ecf8e8bd52c014dc9"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_joint_gate_design_sizing.json"]="0cd038cd0f672fd3c024c2d75ac83342e0a7a68b"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_nuisance_estimation.json"]="cefd3a8c8a1a9beeeb8344ad3e81b224bb972d2e"
            ["research/package-adjustment-v9/b5a-design-sizing/reconstruction_witness.json"]="a252d4a3884c34afbecd4a40c18e7d3a217e9c04"
            ["research/package-adjustment-v9/b5b-strict-gate-boundary/b5b_strict_gate_boundary_audit.json"]="58bacf8a7b892aa24863248e6cb7baaa1fbd4046"
            ["research/package-adjustment-v9/b5b-strict-gate-boundary/b5b_report.md"]="605d1175805e336e255cc52a884027250c290574"
            ["research/package-adjustment-v9/b5b-strict-gate-boundary/b5b_output_hashes.json"]="97fec6cc508f346da524bed4f23251f5ad858cdf"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen/planning artifact drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          load=lambda p: json.loads(Path(p).read_text())
          close=load('research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.json')
          b5a=load('research/package-adjustment-v9/b5a-design-sizing/b5a_design_sizing_manifest.json')
          b5b=load('research/package-adjustment-v9/b5b-strict-gate-boundary/b5b_strict_gate_boundary_audit.json')

          assert close['scientific_decision']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert close['production_change_authorized'] is False
          assert b5a['status']=='PASS_B5A_DESIGN_SIZING_ONLY'
          assert b5a['v9_outcomes_exist_or_were_read'] is False
          assert b5a['v9_design_frozen'] is False
          assert b5a['production_change_authorized'] is False
          assert b5b['decision']=='STOP_STRICT_GATE_NOT_FEASIBLE_WITHIN_SEARCH_ENVELOPE'
          assert b5b['production_change_authorized'] is False
          assert b5b['minimum_qualifying_design_by_effect']['benefit_0p020'] is None
          assert b5b['minimum_qualifying_design_by_effect']['benefit_0p030'] is None
          assert b5b['minimum_qualifying_design_by_effect']['benefit_0p040'] is None

          # B5C is a diagnostic repair stage only. It cannot select a V9 candidate,
          # comparator implementation, final metric, final gate, sample size, or voting catalog.
          print('PASS: V8 closeout, B5A and B5B are exact; B5C remains diagnostic-only.')
          PY

      - name: Reconstruct exact frozen V8 semantic planning rows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b5c
          mkdir -p /tmp/package-adjustment-v9-b5c

          python3 - <<'PY'
          from __future__ import annotations
          import csv,hashlib,io,json,re
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path
          import requests

          D=Path('research/package-adjustment-v8')
          OUT=Path('/tmp/package-adjustment-v9-b5c')
          SHEET_URL=(
            'https://docs.google.com/spreadsheets/d/e/'
            '2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/'
            'pub?gid=458294959&single=true&output=csv'
          )
          VOTE_PREFIX='__pkgv8dev__|'
          SCHEMA_MARKER='__pkgv8dev_schema__|1'

          def load(n): return json.loads((D/n).read_text())
          def parse_utc(value):
            s=str(value or '').strip()
            if not s: return None
            if s.endswith('Z'): s=s[:-1]+'+00:00'
            try: dt=datetime.fromisoformat(s)
            except ValueError: return None
            if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
            return dt.astimezone(timezone.utc)

          act=load('development_voting_activation_manifest_v1.json')
          safe=load('package_vote_challenges_v8_development_v1.json')
          full=load('development_catalog_v1.json')
          sched=load('voting_randomization_schedule_v1.json')
          opening=load('outcome_opening_manifest.json')
          durable=load('dataset_commitment.json')

          safe_ch={str(c['id']):c for c in safe['challenges']}
          full_ch={str(c['id']):c for c in full['challenges']}
          assert set(safe_ch)==set(full_ch) and len(safe_ch)==40

          activation_cutoff=parse_utc(act['valid_ballot_start_utc']); assert activation_cutoff
          freeze_cutoff=parse_utc(opening['source_maturity_generated_at_utc']); assert freeze_cutoff
          reset_cutoffs={int(k):parse_utc(v) for k,v in opening['reset_cutoffs_utc'].items()}
          expected_hashes={str(k):v for k,v in opening['expected_voter_hash_by_slot'].items()}
          assert set(expected_hashes)=={str(i) for i in range(1,51)}

          resp=requests.get(SHEET_URL,timeout=30)
          resp.raise_for_status()
          source_rows=list(csv.DictReader(io.StringIO(resp.text)))
          current_sheet_sha=hashlib.sha256(resp.content).hexdigest()
          meta_re=re.compile(r'^__pkgv8dev_meta__\|([AB])\|([1-9]|[1-4][0-9]|50)\|([0-9]|[1-2][0-9]|3[0-9])$')

          reset_rows=defaultdict(list)
          structural=[]
          excluded=Counter()
          post_freeze=0

          for source_index,row in enumerate(source_rows):
            keep=str(row.get('keep') or '')
            if not keep.startswith(VOTE_PREFIX): continue
            ts=parse_utc(row.get('timestamp'))
            if ts is None:
              excluded['invalid_timestamp']+=1; continue
            if ts<=activation_cutoff:
              excluded['pre_activation_or_at_cutoff']+=1; continue
            if ts>freeze_cutoff:
              post_freeze+=1; continue
            voter=str(row.get('voter_roster_id') or '').strip()
            if not voter:
              excluded['missing_voter_id']+=1; continue

            payload=keep[len(VOTE_PREFIX):]
            cid,sep,choice_payload=payload.partition('|')
            if not sep:
              excluded['malformed_vote_transport']+=1; continue
            cid=cid.strip()
            if cid not in safe_ch:
              excluded['unknown_challenge_id']+=1; continue

            mm=meta_re.fullmatch(str(row.get('trade') or ''))
            if not mm:
              excluded['invalid_meta_transport']+=1; continue
            display_left=mm.group(1)
            slot=int(mm.group(2))
            display_order=int(mm.group(3))
            if str(row.get('cut') or '')!=SCHEMA_MARKER:
              excluded['invalid_schema_marker']+=1; continue
            spec=sched['slots'][str(slot)]
            if cid not in spec['challenge_order']:
              excluded['challenge_not_in_slot_schedule']+=1; continue
            if display_order!=spec['challenge_order'].index(cid):
              excluded['display_order_schedule_mismatch']+=1; continue
            if display_left!=spec['display_left_by_challenge'][cid]:
              excluded['display_left_schedule_mismatch']+=1; continue

            item={'timestamp':ts,'source_index':source_index,'voter':voter,'challenge_id':cid,
                  'display_left':display_left,'slot':slot,'display_order':display_order}
            cutoff=reset_cutoffs.get(slot)
            if cutoff is not None and ts<=cutoff:
              reset_rows[slot].append(item)
              excluded[f'slot{slot}_reset_pre_cutoff']+=1
              continue

            choice=choice_payload.strip()
            if choice not in {'A','B'}:
              excluded['invalid_choice_payload']+=1; continue
            item['choice']=choice
            structural.append(item)

          assert len(reset_rows[16])==80 and len({r['voter'] for r in reset_rows[16]})==2
          assert len(reset_rows[35])==42 and len({r['voter'] for r in reset_rows[35]})==1
          assert len(reset_rows[44])==41 and len({r['voter'] for r in reset_rows[44]})==1
          assert sorted(Counter(r['challenge_id'] for r in reset_rows[35]).values())==[1]*38+[2]*2
          assert sorted(Counter(r['challenge_id'] for r in reset_rows[44]).values())==[1]*39+[2]

          structural.sort(key=lambda r:(r['timestamp'],r['source_index']))
          assert len(structural)==2000
          by_voter=defaultdict(list)
          for r in structural: by_voter[r['voter']].append(r)
          assert len(by_voter)==50

          ballots=[]
          planning=[]
          seen_slots=set()
          observed={}

          for voter,rows in by_voter.items():
            assert len(rows)==40
            assert len({r['challenge_id'] for r in rows})==40
            slots={r['slot'] for r in rows}; assert len(slots)==1
            slot=next(iter(slots)); assert slot not in seen_slots; seen_slots.add(slot)
            ordered=sorted(rows,key=lambda r:r['display_order'])
            assert [r['display_order'] for r in ordered]==list(range(40))
            assert [r['challenge_id'] for r in ordered]==sched['slots'][str(slot)]['challenge_order']
            voter_hash=hashlib.sha256(('v8-maturity-voter|'+voter).encode()).hexdigest()[:16]
            assert voter_hash==expected_hashes[str(slot)]
            observed[str(slot)]=voter_hash

            for r in ordered:
              human_choice_left=(r['choice']==r['display_left'])
              ballots.append({
                'voter_cluster':voter_hash,
                'challenge_id':r['challenge_id'],
                'display_left':r['display_left'],
                'human_choice_left':human_choice_left,
              })

              c=full_ch[r['challenge_id']]
              rawA=float(c['side_A']['raw_fv']); rawB=float(c['side_B']['raw_fv'])
              if rawA>rawB: preferred='A'
              elif rawB>rawA: preferred='B'
              else: preferred='A'
              planning.append({
                'voter_cluster':voter_hash,
                'challenge_id':r['challenge_id'],
                'topology':c['topology'],
                'preferred_side':preferred,
                'preferred_displayed_left':r['display_left']==preferred,
                'human_chose_preferred':r['choice']==preferred,
              })

          assert seen_slots==set(range(1,51))
          assert observed==expected_hashes
          assert len(ballots)==len(planning)==2000
          by_ch=Counter(b['challenge_id'] for b in ballots)
          assert set(by_ch.values())=={50}
          for cid in safe_ch:
            lefts=Counter(b['display_left'] for b in ballots if b['challenge_id']==cid)
            assert lefts=={'A':25,'B':25}

          dataset={'schema_version':1,'study_id':act['study_id'],'ballots':ballots}
          dataset_bytes=(json.dumps(dataset,sort_keys=True,separators=(',',':'))+'\n').encode()
          dataset_sha=hashlib.sha256(dataset_bytes).hexdigest()
          assert dataset_sha==durable['dataset_sha256']=="e6d4beaae2699bd9a029e3d9c53d680cd30f6c2aaf4d460e6aca64dc3d18106d"

          (OUT/'v8_planning_rows.json').write_text(json.dumps(planning,separators=(',',':')))
          witness={
            'status':'PASS_EXACT_V8_DATASET_RECONSTRUCTED_FOR_B5C_DIAGNOSTICS_ONLY',
            'dataset_sha256':dataset_sha,
            'accepted_voters':50,
            'accepted_ballots':2000,
            'post_freeze_v8_rows_ignored':post_freeze,
            'current_sheet_sha256':current_sheet_sha,
            'sheet_sha256_at_maturity':durable['sheet_sha256_at_maturity'],
            'raw_human_ballots_retained_in_durable_b5c_outputs':False,
            'production_v1_7_predictions_read_on_v8_votes':False,
            'v9_candidate_performance_used':False,
          }
          (OUT/'reconstruction_witness.json').write_text(json.dumps(witness,indent=2,sort_keys=True)+'\n')
          print(json.dumps(witness,indent=2,sort_keys=True))
          PY

      - name: Run calibration integrity posterior predictive and coverage diagnostics
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/package-adjustment-v9-b5c/analyze_b5c.py <<'PY'
          from __future__ import annotations
          import hashlib,json,math,os
          from collections import Counter,defaultdict
          from pathlib import Path
          import numpy as np
          from scipy.optimize import minimize
          from scipy.special import expit
          from scipy.stats import t as student_t

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b5c')
          B5A=ROOT/'research/package-adjustment-v9/b5a-design-sizing'
          B5B=ROOT/'research/package-adjustment-v9/b5b-strict-gate-boundary'
          VERSION=os.environ['B5C_ANALYSIS_VERSION']
          SEED=2026100503
          TOPOLOGIES=['2v2','2v3','2v4','3v3','3v4','4v4']
          TOPO_INDEX={t:i for i,t in enumerate(TOPOLOGIES)}

          rows=json.loads((OUT/'v8_planning_rows.json').read_text())
          nuisance=json.loads((B5A/'b5a_nuisance_estimation.json').read_text())
          boundary=json.loads((B5B/'b5b_strict_gate_boundary_audit.json').read_text())

          voters=sorted({r['voter_cluster'] for r in rows})
          challenges=sorted({r['challenge_id'] for r in rows})
          assert len(voters)==50 and len(challenges)==40 and len(rows)==2000
          vmap={v:i for i,v in enumerate(voters)}
          cmap={c:i for i,c in enumerate(challenges)}
          ctop={r['challenge_id']:r['topology'] for r in rows}
          assert all(ctop[c] in TOPOLOGIES for c in challenges)

          vi=np.array([vmap[r['voter_cluster']] for r in rows],int)
          ci=np.array([cmap[r['challenge_id']] for r in rows],int)
          ti=np.array([TOPO_INDEX[r['topology']] for r in rows],int)
          x=np.array([1.0 if r['preferred_displayed_left'] else -1.0 for r in rows],float)
          y=np.array([1.0 if r['human_chose_preferred'] else 0.0 for r in rows],float)
          nc=len(challenges);nv=len(voters)

          def fit_crossed(weights=None,start=None):
            w=np.ones(len(y),float) if weights is None else np.asarray(weights,float)
            assert w.shape==(len(y),) and float(w.sum())>0
            rv=0.20; rc=1e-5; rd=1e-5
            def fg(par):
              ch=par[:nc];ve=par[nc:nc+nv];dl=par[-1]
              eta=ch[ci]+ve[vi]+dl*x
              p=expit(eta)
              nll=float(np.dot(w,np.logaddexp(0.0,eta)-y*eta))
              nll+=0.5*rv*float(np.dot(ve,ve))+0.5*rc*float(np.dot(ch,ch))+0.5*rd*dl*dl
              resid=w*(p-y)
              gch=np.bincount(ci,weights=resid,minlength=nc)+rc*ch
              gve=np.bincount(vi,weights=resid,minlength=nv)+rv*ve
              gdl=float(np.dot(resid,x)+rd*dl)
              return nll,np.concatenate([gch,gve,[gdl]])
            x0=np.zeros(nc+nv+1,float) if start is None else np.asarray(start,float)
            # Match the exact B5A point-fit optimizer contract for the unweighted baseline.
            # Weighted bootstrap refits retain the same objective with a deterministic Powell fallback.
            rr=minimize(lambda z:fg(z)[0],x0,jac=lambda z:fg(z)[1],method='L-BFGS-B',
                        options={'maxiter':2000,'ftol':1e-12})
            if not rr.success or not np.isfinite(rr.fun):
              rr=minimize(lambda z:fg(z)[0],x0,method='Powell',
                          options={'maxiter':3500,'xtol':1e-9,'ftol':1e-11})
            assert rr.success and np.all(np.isfinite(rr.x)),rr.message
            return rr.x.copy()

          fit=fit_crossed()
          ch_eff=fit[:nc].copy();voter_eff=fit[nc:nc+nv].copy();delta_left=float(fit[-1])
          voter_eff-=voter_eff.mean()
          topo_means={}
          centered=[]
          for t in TOPOLOGIES:
            vals=np.array([ch_eff[cmap[c]] for c in challenges if ctop[c]==t],float)
            topo_means[t]=float(vals.mean())
            centered.extend((vals-vals.mean()).tolist())
          sigma_ch=float(np.std(np.array(centered),ddof=1))
          sigma_v=float(np.std(voter_eff,ddof=1))
          durable_sigma_ch=float(nuisance['within_topology_challenge_effect_sd_point'])
          durable_sigma_v=float(nuisance['voter_random_effect_sd_point'])
          durable_delta_left=float(nuisance['left_bias_logit_point'])
          point_fit_parity={
            'recomputed_sigma_challenge':sigma_ch,
            'durable_b5a_sigma_challenge':durable_sigma_ch,
            'abs_diff_sigma_challenge':abs(sigma_ch-durable_sigma_ch),
            'relative_diff_sigma_challenge':abs(sigma_ch-durable_sigma_ch)/durable_sigma_ch,
            'recomputed_sigma_voter':sigma_v,
            'durable_b5a_sigma_voter':durable_sigma_v,
            'abs_diff_sigma_voter':abs(sigma_v-durable_sigma_v),
            'recomputed_delta_left':delta_left,
            'durable_b5a_delta_left':durable_delta_left,
            'abs_diff_delta_left':abs(delta_left-durable_delta_left),
            'contract':'same fixed dataset, objective, penalties and B5A L-BFGS-B stopping options; tight numerical parity guard',
          }
          # Optimizer coordinates are numerical estimates, not content hashes. Guard material drift
          # while allowing sub-basis-point solver variation that cannot alter the diagnostic question.
          assert point_fit_parity['relative_diff_sigma_challenge'] < 5e-4,point_fit_parity
          assert point_fit_parity['abs_diff_sigma_voter'] < 1e-3,point_fit_parity
          assert point_fit_parity['abs_diff_delta_left'] < 1e-3,point_fit_parity

          # ------------------------------------------------------------------
          # A. Posterior-predictive adequacy of the very large challenge SD.
          # Preserve the exact 50-voter x 40-challenge V8 left/right matrix.
          # ------------------------------------------------------------------
          obs_counts=np.bincount(ci,weights=y,minlength=nc)
          obs_share=obs_counts/50.0
          def share_metrics(s):
            s=np.asarray(s,float)
            return {
              'share_sd':float(np.std(s,ddof=1)),
              'mean_abs_distance_from_half':float(np.mean(np.abs(s-0.5))),
              'fraction_0_or_1':float(np.mean((s<=0.0)|(s>=1.0))),
              'fraction_le_0p02_or_ge_0p98':float(np.mean((s<=0.02)|(s>=0.98))),
              'fraction_le_0p10_or_ge_0p90':float(np.mean((s<=0.10)|(s>=0.90))),
              'fraction_0p20_to_0p80':float(np.mean((s>=0.20)&(s<=0.80))),
            }
          observed_metrics=share_metrics(obs_share)
          hist_edges=np.array([-1e-9,.02,.10,.20,.40,.60,.80,.90,.98,1.0000001])
          observed_hist=np.histogram(obs_share,bins=hist_edges)[0].tolist()

          ppc_rng=np.random.default_rng(SEED+101)
          PPC_REPS=3000
          ppc_variants={
            'b5a_p50_challenge_point_voter':float(nuisance['within_topology_challenge_sd_bootstrap_p50']),
            'b5a_point_challenge_point_voter':float(nuisance['within_topology_challenge_effect_sd_point']),
            'b5a_p90_challenge_point_voter':float(nuisance['within_topology_challenge_sd_bootstrap_p90']),
          }
          ppc={}
          c_top_index=np.array([TOPO_INDEX[ctop[c]] for c in challenges],int)
          top_mean_arr=np.array([topo_means[t] for t in TOPOLOGIES],float)
          for label,sig_ch in ppc_variants.items():
            vals={k:[] for k in observed_metrics}
            hist_sum=np.zeros(len(hist_edges)-1,float)
            for rep in range(PPC_REPS):
              dev=ppc_rng.normal(0.0,sig_ch,size=nc)
              vb=ppc_rng.normal(0.0,sigma_v,size=nv);vb-=vb.mean()
              eta=top_mean_arr[c_top_index][ci]+dev[ci]+vb[vi]+delta_left*x
              yy=ppc_rng.binomial(1,expit(eta)).astype(float)
              sh=np.bincount(ci,weights=yy,minlength=nc)/50.0
              mm=share_metrics(sh)
              for k,z in mm.items(): vals[k].append(z)
              hist_sum+=np.histogram(sh,bins=hist_edges)[0]
            summary={}
            for k,arr0 in vals.items():
              arr=np.asarray(arr0,float);obs=float(observed_metrics[k])
              summary[k]={
                'observed':obs,
                'predictive_mean':float(arr.mean()),
                'predictive_p2p5':float(np.quantile(arr,.025)),
                'predictive_p50':float(np.quantile(arr,.50)),
                'predictive_p97p5':float(np.quantile(arr,.975)),
                'observed_percentile_in_predictive':float(np.mean(arr<=obs)),
              }
            ppc[label]={
              'sigma_challenge':sig_ch,
              'sigma_voter':sigma_v,
              'replicates':PPC_REPS,
              'metrics':summary,
              'mean_histogram_counts':(hist_sum/PPC_REPS).tolist(),
            }

          point_ppc=ppc['b5a_point_challenge_point_voter']['metrics']
          inflation_flags=[]
          # If V8 is materially less extreme than the fitted logistic-normal model predicts,
          # the latent challenge SD may be inflated by quasi-separation.
          for k in ['share_sd','mean_abs_distance_from_half','fraction_le_0p10_or_ge_0p90']:
            q=float(point_ppc[k]['observed_percentile_in_predictive'])
            if q<0.025: inflation_flags.append(k)
          ppc_decision='POSSIBLE_CHALLENGE_SD_INFLATION_REQUIRES_REESTIMATION' if inflation_flags else 'NO_CLEAR_PPC_EVIDENCE_CHALLENGE_SD_IS_INFLATED'

          ppc_out={
            'analysis_version':VERSION,
            'status':'PASS_POSTERIOR_PREDICTIVE_DIAGNOSTIC_ONLY',
            'decision':ppc_decision,
            'inflation_flag_metrics':inflation_flags,
            'observed_vote_share_metrics':observed_metrics,
            'histogram_edges':hist_edges.tolist(),
            'observed_histogram_counts':observed_hist,
            'topology_challenge_intercepts_from_same_b5a_fit':topo_means,
            'b5a_point_fit_numerical_parity':point_fit_parity,
            'variants':ppc,
            'interpretation':'A flagged result means B5A/B5B latent challenge variance may be too extreme; it does not authorize replacing it without a separately documented estimator.',
          }

          # ------------------------------------------------------------------
          # B. Crossed bootstrap refits for JOINT nuisance assurance draws.
          # This addresses p90/p90 stress testing versus assurance integration.
          # ------------------------------------------------------------------
          boot_rng=np.random.default_rng(SEED+202)
          BOOT_REPS=500
          boot=[]
          ch_by_top={t:np.array([cmap[c] for c in challenges if ctop[c]==t],int) for t in TOPOLOGIES}
          for b in range(BOOT_REPS):
            cw=np.zeros(nc,int)
            for t in TOPOLOGIES:
              ids=ch_by_top[t]
              samp=boot_rng.choice(ids,size=len(ids),replace=True)
              cw+=np.bincount(samp,minlength=nc)
            vsamp=boot_rng.choice(np.arange(nv),size=nv,replace=True)
            vw=np.bincount(vsamp,minlength=nv)
            weights=cw[ci]*vw[vi]
            par=fit_crossed(weights=weights,start=fit)
            ch=par[:nc].copy();ve=par[nc:nc+nv].copy();dl=float(par[-1])
            pooled=[]
            for t in TOPOLOGIES:
              ids=ch_by_top[t]
              vals=np.repeat(ch[ids],cw[ids])
              if len(vals)>1:
                vals=vals-vals.mean(); pooled.extend(vals.tolist())
            vvals=np.repeat(ve,vw)
            if len(vvals): vvals=vvals-vvals.mean()
            sch=max(.03,float(np.std(np.asarray(pooled),ddof=1)))
            sv=max(0.0,float(np.std(vvals,ddof=1)))
            boot.append((sch,sv,dl))
          boot_arr=np.asarray(boot,float)
          assert boot_arr.shape==(BOOT_REPS,3)
          corr=float(np.corrcoef(boot_arr[:,0],boot_arr[:,1])[0,1])
          p90_ch=float(nuisance['within_topology_challenge_sd_bootstrap_p90'])
          p90_v=float(nuisance['voter_sd_bootstrap_p90'])
          joint_exceed=float(np.mean((boot_arr[:,0]>=p90_ch)&(boot_arr[:,1]>=p90_v)))
          joint_draws={
            'analysis_version':VERSION,
            'status':'PASS_CROSSED_BOOTSTRAP_JOINT_NUISANCE_DRAWS_ONLY',
            'bootstrap_replicates':BOOT_REPS,
            'method':'crossed challenge-within-topology x voter bootstrap; full penalized nuisance refit each replicate',
            'correlation_sigma_challenge_sigma_voter':corr,
            'b5a_p90_challenge':p90_ch,
            'b5a_p90_voter':p90_v,
            'fraction_jointly_at_or_above_b5a_p90_p90':joint_exceed,
            'quantiles':{
              'sigma_challenge':{q:float(np.quantile(boot_arr[:,0],float(q))) for q in ['0.10','0.50','0.80','0.90','0.95']},
              'sigma_voter':{q:float(np.quantile(boot_arr[:,1],float(q))) for q in ['0.10','0.50','0.80','0.90','0.95']},
              'delta_left':{q:float(np.quantile(boot_arr[:,2],float(q))) for q in ['0.10','0.50','0.80','0.90','0.95']},
            },
            'draws':[{'sigma_challenge':float(a),'sigma_voter':float(b),'delta_left':float(c)} for a,b,c in boot],
            'usage':'B5D may integrate assurance over these prespecified joint nuisance draws; p90/p90 remains a stress test, not the sole sizing basis.',
          }

          # ------------------------------------------------------------------
          # C. Full-response-process effect calibration audit of B5B labels.
          # Uses a fixed DIAGNOSTIC 60-voter/1440-ballot/4-vote canvas only.
          # This is not a V9 design selection.
          # ------------------------------------------------------------------
          comp_sd=float(boundary['calibration']['generic_comparator_noise_sd'])
          scen=boundary['calibration']['scenario_targets']
          calib_names=['benefit_0p020','benefit_0p030','benefit_0p040']
          for z in calib_names: assert z in scen

          def diagnostic_assignment(r):
            assert r in {2,4,6,8} and 240%r==0
            cpt=240//r
            n=60;half=r//2
            rec=[]
            # Exact fixed-burden diagnostic design:
            # - 60 voters x 24 ballots = 1440
            # - exactly 4 ballots/voter/topology
            # - every voter is left twice and right twice within every topology
            # - exactly r votes/challenge with r/2 left and r/2 right
            # Left and right stubs each traverse two complete 60-voter cycles;
            # the +30 offset prevents within-challenge voter duplication.
            for t in range(6):
              for j in range(cpt):
                for s in range(half):
                  q=j*half+s
                  base=(q+7*t) % n
                  rec.append((base,t,j,1))
                  rec.append(((base+30) % n,t,j,-1))
            vc=Counter(v for v,_,_,_ in rec); vt=Counter((v,t) for v,t,_,_ in rec)
            cj=Counter((t,j) for _,t,j,_ in rec); dup=Counter((v,t,j) for v,t,j,_ in rec)
            lr_ch=defaultdict(Counter); lr_v=defaultdict(Counter)
            for v,t,j,xx in rec:
              lr_ch[(t,j)][xx]+=1; lr_v[(v,t)][xx]+=1
            assert set(vc.values())=={24}; assert set(vt.values())=={4}; assert set(cj.values())=={r}; assert max(dup.values())==1
            assert all(z==Counter({-1:half,1:half}) for z in lr_ch.values())
            assert all(z==Counter({-1:2,1:2}) for z in lr_v.values())
            return rec,cpt

          def fit_nuisance(score,xx,yy):
            bounds=[(0.05,25.0),(-0.75,0.75)]
            def fg(z):
              beta,dl=float(z[0]),float(z[1])
              eta=beta*score+dl*xx
              p=expit(eta)
              loss=float(np.mean(np.logaddexp(0.0,eta)-yy*eta))
              resid=(p-yy)/len(yy)
              grad=np.array([float(np.dot(resid,score)),float(np.dot(resid,xx))])
              return loss,grad
            best=None
            for start in ([1.0,0.0],[0.2,0.0],[3.0,0.0],[10.0,0.0]):
              rr=minimize(lambda z:fg(z)[0],np.array(start,float),jac=lambda z:fg(z)[1],method='L-BFGS-B',bounds=bounds,options={'maxiter':1500,'ftol':1e-12})
              if best is None or (np.isfinite(rr.fun) and rr.fun<best.fun): best=rr
              if rr.success: return float(rr.x[0]),float(rr.x[1])
            rr2=minimize(lambda z:fg(z)[0],np.array(best.x,float),method='Powell',bounds=bounds,options={'maxiter':2500,'xtol':1e-9,'ftol':1e-11})
            assert rr2.success
            return float(rr2.x[0]),float(rr2.x[1])

          def logloss_eta(yy,eta): return np.logaddexp(0.0,eta)-yy*eta

          def oof_dloss(rec,cpt,taus,rng,sig_ch,sig_v,dl):
            n=60
            theta=rng.normal(0.0,sig_ch,size=(6,cpt))
            vb=rng.normal(0.0,sig_v,size=n);vb-=vb.mean()
            eps0=rng.normal(size=(6,cpt));eps1=rng.normal(size=(6,cpt))
            score0=theta+comp_sd*eps0
            score1=theta+np.asarray(taus)[:,None]*eps1
            v=np.array([q[0] for q in rec],int);tt=np.array([q[1] for q in rec],int);jj=np.array([q[2] for q in rec],int);xx=np.array([q[3] for q in rec],float)
            cid=tt*cpt+jj
            s0=score0[tt,jj];s1=score1[tt,jj]
            eta_true=theta[tt,jj]+vb[v]+dl*xx
            yy=rng.binomial(1,expit(eta_true)).astype(float)
            dloss=np.empty(len(yy),float)
            fold=(cid*2654435761 + 1013904223)%5
            for f in range(5):
              tr=fold!=f;te=~tr
              b0,l0=fit_nuisance(s0[tr],xx[tr],yy[tr]);b1,l1=fit_nuisance(s1[tr],xx[tr],yy[tr])
              dloss[te]=logloss_eta(yy[te],b1*s1[te]+l1*xx[te])-logloss_eta(yy[te],b0*s0[te]+l0*xx[te])
            return dloss,v,cid,tt

          rec4,cpt4=diagnostic_assignment(4)
          CAL_REPS=220
          calibration={}
          calib_rng=np.random.default_rng(SEED+303)
          draws=np.asarray(boot,float)
          for name in calib_names:
            targets=np.asarray(scen[name]['true_topology_loss_deltas'],float)
            taus=np.asarray(scen[name]['candidate_noise_sd_by_topology'],float)
            realized=[];by_top=[]
            for rep in range(CAL_REPS):
              d=draws[int(calib_rng.integers(0,len(draws)))]
              dl=float(d[2])
              dloss,_,_,tt=oof_dloss(rec4,cpt4,taus,calib_rng,float(d[0]),float(d[1]),dl)
              realized.append(float(dloss.mean()))
              by_top.append([float(dloss[tt==k].mean()) for k in range(6)])
            arr=np.asarray(realized,float);bt=np.asarray(by_top,float)
            labeled=float(targets.mean())
            mean=float(arr.mean())
            calibration[name]={
              'labeled_macro_delta_from_b5b_latent_calibration':labeled,
              'full_process_realized_macro_delta_mean':mean,
              'full_process_realized_macro_delta_mc_se':float(arr.std(ddof=1)/math.sqrt(len(arr))),
              'full_process_p10':float(np.quantile(arr,.10)),
              'full_process_p50':float(np.quantile(arr,.50)),
              'full_process_p90':float(np.quantile(arr,.90)),
              'realized_minus_labeled':mean-labeled,
              'absolute_relative_attenuation':float((abs(labeled)-abs(mean))/abs(labeled)) if labeled else None,
              'labeled_topology_deltas':targets.tolist(),
              'realized_topology_delta_means':bt.mean(axis=0).tolist(),
            }

          max_abs_rel=max(abs(float(v['absolute_relative_attenuation'])) for v in calibration.values())
          calibration_decision='MATERIAL_EFFECT_LABEL_MISMATCH_FULL_PROCESS_RECALIBRATION_REQUIRED' if max_abs_rel>0.10 else 'NO_MATERIAL_EFFECT_LABEL_MISMATCH_DETECTED'
          calibration_out={
            'analysis_version':VERSION,
            'status':'PASS_FULL_RESPONSE_EFFECT_CALIBRATION_DIAGNOSTIC_ONLY',
            'decision':calibration_decision,
            'diagnostic_canvas':{'voters':60,'ballots':1440,'votes_per_challenge':4,'challenges_per_topology':60,'frozen_for_v9':False},
            'assurance_nuisance_source':'B5C crossed-bootstrap joint draws',
            'response_process':['challenge effect','voter effect','left/right bias','Bernoulli vote','five-fold evaluator nuisance refit'],
            'scenarios':calibration,
            'candidate_or_production_v1_7_predictions_used':False,
            'generic_comparator_only':True,
          }

          # ------------------------------------------------------------------
          # D. Coverage / information-per-ballot audit at a fixed 60x24 burden.
          # R=2,4,6,8 trades repeats for independent challenges with equal ballots.
          # Null uses two equally accurate independent generic score systems.
          # ------------------------------------------------------------------
          def two_way_se(vals,voters_arr,challenges_arr):
            vals=np.asarray(vals,float);n=len(vals);mu=float(vals.mean());res=vals-mu
            uv=np.unique(voters_arr);uc=np.unique(challenges_arr)
            sv=np.array([res[voters_arr==g].sum() for g in uv])
            sc=np.array([res[challenges_arr==g].sum() for g in uc])
            tv=(len(uv)/(len(uv)-1))*float(np.dot(sv,sv)) if len(uv)>1 else 0.0
            tc=(len(uc)/(len(uc)-1))*float(np.dot(sc,sc)) if len(uc)>1 else 0.0
            tii=(n/(n-1))*float(np.dot(res,res)) if n>1 else 0.0
            return math.sqrt(max(0.0,(tv+tc-tii)/(n*n)))

          def challenge_unit_se(vals,cid0):
            ids=np.unique(cid0)
            means=np.array([float(np.mean(vals[cid0==g])) for g in ids],float)
            return float(np.std(means,ddof=1)/math.sqrt(len(means)))

          COV_REPS=260
          coverage={}
          cov_rng=np.random.default_rng(SEED+404)
          for r in [2,4,6,8]:
            rec,cpt=diagnostic_assignment(r)
            methods={'two_way_cluster_t':{'cover':[],'width':[],'top_cover':[],'top_width':[]},
                     'challenge_unit_t':{'cover':[],'width':[],'top_cover':[],'top_width':[]}}
            for rep in range(COV_REPS):
              d=draws[int(cov_rng.integers(0,len(draws)))]
              # Equal accuracy under the null: same generic score-noise SD on both systems.
              taus=np.full(6,comp_sd,float)
              dloss,v,cid0,tt=oof_dloss(rec,cpt,taus,cov_rng,float(d[0]),float(d[1]),float(d[2]))
              mu=float(dloss.mean())
              se_tw=two_way_se(dloss,v,cid0)
              se_ch=challenge_unit_se(dloss,cid0)
              crit_all=float(student_t.ppf(.95,max(2,6*cpt-1)))
              for key,se in [('two_way_cluster_t',se_tw),('challenge_unit_t',se_ch)]:
                u=mu+crit_all*se
                methods[key]['cover'].append(u>=0.0)
                methods[key]['width'].append(crit_all*se)
              for k in range(6):
                m=tt==k;crit=float(student_t.ppf(.95,max(2,cpt-1)))
                mt=float(dloss[m].mean())
                s1=two_way_se(dloss[m],v[m],cid0[m]);s2=challenge_unit_se(dloss[m],cid0[m])
                for key,se in [('two_way_cluster_t',s1),('challenge_unit_t',s2)]:
                  methods[key]['top_cover'].append(mt+crit*se>=0.0)
                  methods[key]['top_width'].append(crit*se)
            coverage[str(r)]={
              'votes_per_challenge':r,'challenges_per_topology':cpt,'total_challenges':6*cpt,
              'voters':60,'ballots':1440,'workload_per_voter':24,'replicates':COV_REPS,
              'methods':{
                key:{
                  'overall_one_sided_95_coverage':float(np.mean(z['cover'])),
                  'overall_mean_ucb_half_width':float(np.mean(z['width'])),
                  'topology_pooled_one_sided_95_coverage':float(np.mean(z['top_cover'])),
                  'topology_mean_ucb_half_width':float(np.mean(z['top_width'])),
                } for key,z in methods.items()
              }
            }

          coverage_out={
            'analysis_version':VERSION,
            'status':'PASS_COVERAGE_INFORMATION_DIAGNOSTIC_ONLY',
            'null_truth':'candidate and comparator generated with equal generic score-noise SD; true expected loss difference is zero by symmetry',
            'burden_fixed_for_comparison':{'voters':60,'ballots':1440,'workload_per_voter':24},
            'repeat_grid':[2,4,6,8],
            'results':coverage,
            'estimator_freeze_authorized':False,
            'note':'Challenge-unit and two-way cluster-t estimators are diagnostic candidates only. A final estimator must be selected prospectively by nominal coverage plus width, and B5D must revalidate it under the complete scenario suite.',
          }

          # Synthesis remains diagnostic. No threshold or design is selected here.
          manifest={
            'analysis_version':VERSION,
            'status':'PASS_B5C_CALIBRATION_INTEGRITY_AND_COVERAGE_DIAGNOSTICS_ONLY',
            'ppc_decision':ppc_decision,
            'effect_calibration_decision':calibration_decision,
            'joint_p90_p90_exceedance_fraction':joint_exceed,
            'v9_candidate_selected':False,
            'v9_architecture_frozen':False,
            'v9_comparator_implementation_frozen':False,
            'v9_primary_metric_frozen':False,
            'v9_gate_frozen':False,
            'v9_sample_size_frozen':False,
            'v9_catalog_generated':False,
            'v9_outcomes_exist_or_were_read':False,
            'production_v1_7_predictions_read_on_v8_votes':False,
            'production_change_authorized':False,
            'scientific_next_step':'B5D prospective operating-characteristic calibration only after reviewing B5C diagnostics; all six topologies remain the first attempted scope.',
          }

          def dump(name,obj):
            (OUT/name).write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          dump('b5c_posterior_predictive_check.json',ppc_out)
          dump('b5c_joint_nuisance_draws.json',joint_draws)
          dump('b5c_effect_calibration_check.json',calibration_out)
          dump('b5c_uncertainty_coverage_check.json',coverage_out)
          dump('b5c_diagnostic_manifest.json',manifest)

          lines=[
            '# Package Adjustment V9 — B5C Calibration Integrity and Coverage Diagnostics','',
            f"**Status:** `{manifest['status']}`",'',
            'B5C is a prospective diagnostic repair stage after B5B demonstrated that the original strict six-unpooled-UCB rule was infeasible. No V9 human outcomes exist and no candidate, final metric, gate, sample size, or catalog is frozen here.','',
            '## Posterior-predictive challenge-variance check','',
            f"Decision: `{ppc_decision}`",'',
            f"Observed challenge vote-share SD: {observed_metrics['share_sd']:.4f}",
            f"B5A point challenge SD: {sigma_ch:.4f}",
            f"Flag metrics: {', '.join(inflation_flags) if inflation_flags else 'none'}",'',
            '## Joint nuisance assurance','',
            f"Crossed-bootstrap refits: {BOOT_REPS}",
            f"Corr(sigma_challenge, sigma_voter): {corr:.3f}",
            f"Fraction jointly >= B5A p90/p90: {joint_exceed:.3f}",
            'The p90/p90 combination remains a stress test; B5D should integrate over joint nuisance draws for primary assurance.','',
            '## Full-response effect calibration','',
            f"Decision: `{calibration_decision}`",'',
          ]
          for name in calib_names:
            z=calibration[name]
            lines.append(f"- {name}: labeled {z['labeled_macro_delta_from_b5b_latent_calibration']:.4f}; realized {z['full_process_realized_macro_delta_mean']:.4f}; relative attenuation {z['absolute_relative_attenuation']:.1%}")
          lines += ['', '## Fixed-burden information / coverage diagnostic','', '| Votes/challenge | Challenges/topology | Two-way overall coverage | Two-way topo coverage | Challenge-unit overall coverage | Challenge-unit topo coverage |', '|---:|---:|---:|---:|---:|---:|']
          for r in [2,4,6,8]:
            z=coverage[str(r)];a=z['methods']['two_way_cluster_t'];b=z['methods']['challenge_unit_t']
            lines.append(f"| {r} | {z['challenges_per_topology']} | {a['overall_one_sided_95_coverage']:.3f} | {a['topology_pooled_one_sided_95_coverage']:.3f} | {b['overall_one_sided_95_coverage']:.3f} | {b['topology_pooled_one_sided_95_coverage']:.3f} |")
          lines += ['', '## Firewall','', '- No production V1.7 predictions were evaluated on V8 votes.', '- No V9 human outcomes exist or were read.', '- No candidate, comparator implementation, metric, gate, sample size, or catalog is frozen.', '- No production change is authorized.', '- All six topologies remain the primary scope for the next prospective simulation; three-topology scoping is a fallback, not a B5C decision.', '']
          (OUT/'b5c_report.md').write_text('\n'.join(lines))

          # Remove reconstructed human-level planning rows before any durable copy.
          (OUT/'v8_planning_rows.json').unlink()

          hash_names=['b5c_posterior_predictive_check.json','b5c_joint_nuisance_draws.json','b5c_effect_calibration_check.json','b5c_uncertainty_coverage_check.json','b5c_diagnostic_manifest.json','b5c_report.md','reconstruction_witness.json']
          hashes={n:hashlib.sha256((OUT/n).read_bytes()).hexdigest() for n in hash_names}
          dump('b5c_output_hashes.json',{'analysis_version':VERSION,'sha256':hashes})
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

          python3 /tmp/package-adjustment-v9-b5c/analyze_b5c.py

      - name: Validate B5C scientific firewall and durable output allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('/tmp/package-adjustment-v9-b5c')
          expected={
            'b5c_posterior_predictive_check.json',
            'b5c_joint_nuisance_draws.json',
            'b5c_effect_calibration_check.json',
            'b5c_uncertainty_coverage_check.json',
            'b5c_diagnostic_manifest.json',
            'b5c_report.md',
            'reconstruction_witness.json',
