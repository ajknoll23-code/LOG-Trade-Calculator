# QF11 V10 owner research only. No polling, no model or market mutation, no URLs issued.
name: QF11 V10 - Global Ballot Coherence and Owner Review (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF11_V10_INPUT: /tmp/qf11-v10-input
  QF11_V10_OUTPUT: /tmp/qf11-v10-output
jobs:
  research:
    name: Globally screen original 12 cleared plus up to 16 held KTC slots; never issue votes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout dispatched main read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin production and source identity files before archived review
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "STOP requires main"; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ "$(git hash-object index.html)" == "c83e3f68d11853c072017e6bd83bb1ad085f4a3e" ]] || { echo "STOP pinned source
        drift index.html"; exit 1; }

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == "829445174a77ceb4bb19dfd97a725e371d18efe8"
        ]] || { echo "STOP pinned source drift scripts/artifacts/generated/market_values.json"; exit 1; }

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == "9d007a7f053e15dcdc0f694563ca17bc47568e5f"
        ]] || { echo "STOP pinned source drift scripts/artifacts/generated/value_uncertainty.json"; exit 1; }

        [[ "$(git hash-object scripts/market/build_market_value.py)" == "a015d54785ce5fcb3b9f26bae0120b82693a6bd8" ]]
        || { echo "STOP pinned source drift scripts/market/build_market_value.py"; exit 1; }

        [[ "$(git hash-object scripts/market/ktc_pipeline.py)" == "b9612c73a91223397a4f49b384d8d86719ee8d79" ]] || {
        echo "STOP pinned source drift scripts/market/ktc_pipeline.py"; exit 1; }

        [[ "$(git hash-object scripts/validation/snapshot_values.py)" == "1efca4c35e910a95974c1bec0b06a106196618b3" ]]
        || { echo "STOP pinned source drift scripts/validation/snapshot_values.py"; exit 1; }

        [[ "$(git hash-object scripts/validation/repo_regression_checks.py)" == "5191e1160c966ed14401b70c86c6f63808e1265d"
        ]] || { echo "STOP pinned source drift scripts/validation/repo_regression_checks.py"; exit 1; }

        [[ "$(git hash-object scripts/identity_crosswalk.json)" == "3489c01c923474931f4db81e3dd338f437bfdf5f" ]] || {
        echo "STOP pinned source drift scripts/identity_crosswalk.json"; exit 1; }

        [[ "$(git hash-object data/players_cache.json)" == "216242d9f87a81c4d1532cca2468c90a52918c3d" ]] || { echo "STOP
        pinned source drift data/players_cache.json"; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || exit 1

        echo "QF11_V9_FROZEN_SOURCES_GREEN"'
    - name: Download immutable QF11 V9 held/source-screened matrix
      uses: actions/download-artifact@v4
      with:
        name: QF11-v9-RESEARCH-ONLY-ballot-decision-matrix
        run-id: 38273547246
        github-token: ${{ github.token }}
        path: /tmp/qf11-v10-input/v9
    - name: Download same-cohort QF11 V3 Fundamental Values for position checks
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v10-input/v3
    - name: Globally reconcile possible alternatives, keep original holds and owner approval
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/qf11-v10-global.py <<'QF11_V10_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"QF11 V10:\
        \ research-only global ballot alternatives, no voting issuance.\n\nInputs pinned from archived V9 and V3 results.\
        \ All proposed changes remain review-only.\n\"\"\"\nimport collections, hashlib, itertools, json, os, sys\nfrom\
        \ pathlib import Path\n\nROOT = Path.cwd()\nFIXTURE = '--fixture' in sys.argv\nSOURCE=Path(os.environ.get('QF11_V10_INPUT',\
        \ '/mnt/data/qf11_v10_fixture' if FIXTURE else '/tmp/qf11-v10-input'))\nOUTPUT=Path(os.environ.get('QF11_V10_OUTPUT','/mnt/data/qf11_v10_fixture_output'\
        \ if FIXTURE else '/tmp/qf11-v10-output'))\nOUTPUT.mkdir(parents=True,exist_ok=True)\nPINS={\n 'v9': ('v9/RESEARCH_ONLY_28_slot_decision_matrix.json','3064bdb107475fb2926b84212a5cad499f293b2bd08e735a1e7da44c564922ba'),\n\
        \ 'v9_summary':('v9/RESEARCH_ONLY_source_screen_summary.json','9ed1fc639978419464a2e29cd3cf7afa264e0bb6b79a641a771df044f011fe45'),\n\
        \ 'v3':('v3/PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json','19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc'),\n\
        }\nsource={}\nfor tag,(rel,sha) in PINS.items():\n p=SOURCE/rel\n actual=hashlib.sha256(p.read_bytes()).hexdigest()\n\
        \ assert actual==sha, f'STOP archived source hash drift {tag}: {actual}'\n source[tag]=json.loads(p.read_text())\n\
        v9=source['v9']; summary=source['v9_summary']; v3=source['v3']\nrows=v9['decision_matrix']; assert len(rows)==28\n\
        assert v9['summary']==summary\nassert summary['source_screened_review_only_slots']==12 and summary['held_slots']==16\n\
        assert summary['owner_approval'] is False and summary['voting_activated'] is False and summary['market_promotion_authorized']\
        \ is False\nassert v3['deployment_authorized'] is False and v3['research_only'] is True\nassert v3['source']['source_after_daily_cap_sha256']==summary['source_after_daily_cap_sha256']=='a0ed9f867883d9013cbee69a0136586a22223571f5f57d4f0627d5d77fd6d2b2'\n\
        players=v3['players']; assert len(players)==504\n\n# Ensure source-aligned current FV in actual GitHub checkout;\
        \ no FV revision.\nif not FIXTURE:\n sys.path.insert(0,str(ROOT))\n from scripts.validation import snapshot_values\n\
        \ current=snapshot_values.compute_all_values(snapshot_values.load_from_html(ROOT/'index.html'))\n for p,v in\
        \ players.items():\n  assert p in current and current[p]['value']==v['fundamental_value'] and current[p]['pos']==v['pos'],f'STOP\
        \ market cohort current FV center drift {p}'\n\ndef info(k):\n assert k in players,f'STOP unknown alternative\
        \ {k}'\n return players[k]['pos'],int(players[k]['fundamental_value'])\n\nclean=[];held=[];all_orig=collections.Counter();\
        \ seen_slots=set()\nfor s in rows:\n n=s['slot'];assert isinstance(n,int) and 1<=n<=28 and n not in seen_slots\n\
        \ seen_slots.add(n)\n tri=list(s['same_position_pair'])+[s['third_player']]\n assert len(set(tri))==3, f'STOP\
        \ duplicate player within original ballot {n}'\n assert all(info(k)[1]>0 for k in tri)\n assert info(tri[0])[0]==info(tri[1])[0]\
        \ and info(tri[0])[0]!=info(tri[2])[0]\n assert max(info(k)[1] for k in tri)/min(info(k)[1] for k in tri)<=1.30+1e-6\n\
        \ all_orig.update(tri)\n if s['status']=='SOURCE_SCREENED_REVIEW_ONLY':\n  assert s['hold_reasons']==[]\n  clean.append((s,tri))\n\
        \ else:\n  assert s['status']=='HOLD_MANUAL_ELIGIBILITY_OR_REPEAT' and s['hold_reasons']\n  held.append((s,tri))\n\
        assert len(clean)==12 and len(held)==16 and len(seen_slots)==28 and max(all_orig.values())<=2\n\n# Stage original\
        \ clear slate intact. Changing a clear slot is not within scope.\nbase_counts=collections.Counter(k for s,tri\
        \ in clean for k in tri)\nbase_pairs={tuple(sorted(tri[:2])) for s,tri in clean}\nassert len(base_pairs)==12\
        \ and max(base_counts.values())<=2\n\nTARGETED={'will anderson','micah parsons','byron young','james cook','malik\
        \ willis','trevor lawrence'}\n# This marker is for owner attention, NOT exclusion or consent.\n\ndef choices_for(s,orig):\n\
        \ strict=set(r.split(':',1)[1] for r in s['hold_reasons'] if r.startswith(('UNRESOLVED_SOURCE:','NOT_STRICTLY_SOURCE_VERIFIED:')))\n\
        \ if not strict:return [],'REPEAT_OR_OTHER_HOLD_NO_VERIFIED_REPLACEMENT'\n altmap={a['flagged_player']:[b['player']\
        \ for b in a['possible_substitutes']] for a in s['alternative_ideas_research_only']}\n if any(k not in altmap\
        \ or not altmap[k] for k in strict):return [],'MISSING_STRICT_ALTERNATIVE'\n idx={k:i for i,k in enumerate(orig)}\n\
        \ buckets=[[(k,None)] if k not in strict else [(k,b) for b in altmap[k]] for k in orig]\n valid=[]\n for pick\
        \ in itertools.product(*buckets):\n  rep={before:after for before,after in pick if after is not None}\n  keys=[rep.get(k,k)\
        \ for k in orig]\n  if len(set(keys))<3:continue\n  positions=[info(k)[0] for k in keys]\n  if positions[0]!=positions[1]\
        \ or positions[0]==positions[2]:continue\n  vals=[info(k)[1] for k in keys]\n  ratio=max(vals)/min(vals)\n  if\
        \ ratio>1.30+1e-6:continue\n  if any(rep[k] in orig for k in rep):continue\n  valid.append({'slot':s['slot'],'player_keys':keys,'pair':tuple(sorted(keys[:2])),'replacements':rep,'fv_spread_ratio':round(ratio,6),\n\
        \   'targeted_players_removed':sorted(TARGETED.intersection(rep)), 'hold_reasons_retained':list(s['hold_reasons'])})\n\
        \ return sorted(valid,key=lambda q:(len(q['targeted_players_removed']),len(q['replacements']),q['fv_spread_ratio'],q['player_keys'])),'OPTIONS_FOUND'\
        \ if valid else 'NO_COMPLETE_STRICT_ALTERNATIVE'\n\noptions={};diagnostics={}\nfor s,original in held:\n choices,reason=choices_for(s,original)\n\
        \ options[s['slot']]=choices\n diagnostics[s['slot']]={'reason':reason,'strict_joint_options':len(choices),'original':original,'hold_reasons':s['hold_reasons']}\n\
        \n# Pure-Python deterministic global branch-and-bound: maximize number of recoverable held slots,\n# then reduce\
        \ targeted-player removals, then value spread. No production action or ballot activation.\nordered=sorted(held,key=lambda\
        \ q:(len(options[q[0]['slot']])==0, len(options[q[0]['slot']]), q[0]['slot']))\nsearch_nodes=0;limit=300000;exhaustive=True;best_score=(-1,-10**9,-10**9);best={}\n\
        upper_bound=sum(bool(o) for o in options.values())\ndef visit(i,used,pairs,picked,targeted,spread_sum):\n global\
        \ search_nodes,exhaustive,best_score,best\n if best_score[0]==upper_bound:\n  exhaustive=False  # Maximum count\
        \ proven by independent upper bound; secondary order not exhausted\n  return\n search_nodes+=1\n if search_nodes>limit:\n\
        \  exhaustive=False;return\n count=len(picked)\n if count+(len(ordered)-i)<best_score[0]:return\n if i==len(ordered):\n\
        \  score=(count,-targeted,-round(spread_sum*1_000_000))\n  if score>best_score:\n   best_score=score;best=dict(picked)\n\
        \  return\n s,_=ordered[i];slot=s['slot']\n for opt in options[slot]:\n  if opt['pair'] in pairs:continue\n \
        \ if any(used[k]>=2 for k in opt['player_keys']):continue\n  for k in opt['player_keys']:used[k]+=1\n  pairs.add(opt['pair']);picked[slot]=opt\n\
        \  visit(i+1,used,pairs,picked,targeted+len(opt['targeted_players_removed']),spread_sum+opt['fv_spread_ratio'])\n\
        \  del picked[slot];pairs.remove(opt['pair'])\n  for k in opt['player_keys']:used[k]-=1\n  if not exhaustive:\
        \ return\n visit(i+1,used,pairs,picked,targeted,spread_sum)\nvisit(0,base_counts.copy(),set(base_pairs),{},0,0)\n\
        \n# Independently recheck global candidate, never relabel held as approved.\nfull=[{'slot':s['slot'],'original_player_keys':tri,'candidate_player_keys':tri,'proposed_replacements':{},'classification':'SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED','fv_spread_ratio':round(max(info(k)[1]\
        \ for k in tri)/min(info(k)[1] for k in tri),6),'requires_owner_review':True} for s,tri in clean]\nfor s,tri\
        \ in held:\n opt=best.get(s['slot'])\n full.append({'slot':s['slot'],'original_player_keys':tri,'candidate_player_keys':opt['player_keys']\
        \ if opt else None,'proposed_replacements':opt['replacements'] if opt else {},'classification':'OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY'\
        \ if opt else 'HOLD_UNRESOLVED','fv_spread_ratio':opt['fv_spread_ratio'] if opt else None,'original_hold_reasons':s['hold_reasons'],'requires_owner_review':True,'targeted_players_removed_in_shadow':opt['targeted_players_removed']\
        \ if opt else [],'unresolved_reason':None if opt else diagnostics[s['slot']]['reason']})\nfull.sort(key=lambda\
        \ r:r['slot'])\nassert len(full)==28\ncandidates=[r for r in full if r['candidate_player_keys']];global_counts=collections.Counter(k\
        \ for r in candidates for k in r['candidate_player_keys']);pair_list=[tuple(sorted(r['candidate_player_keys'][:2]))\
        \ for r in candidates]\nassert len(pair_list)==len(set(pair_list)), 'STOP duplicated chosen same-position pair'\n\
        assert max(global_counts.values())<=2 and len(candidates)==12+len(best)\nassert all(r['classification']=='SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED'\
        \ for r in full if r['slot'] in {s['slot'] for s,_ in clean})\nif exhaustive:\n assert best_score[0]==len(best)\n\
        summary_out={'status':'RESEARCH_ONLY_GLOBAL_BALLOT_ALLOCATION','workflow_green_does_not_approve_voting':True,'voting_activated':False,'market_or_model_promotion_authorized':False,'owner_approval':False,\n\
        \ 'original_source_screened_slots':12,'original_held_slots':16,'held_jointly_feasible_individually':sum(bool(o)\
        \ for o in options.values()),'held_jointly_selected_shadow':len(best),\n 'total_shadow_slots_including_existing_screened':len(candidates),'unresolved_held_slots':[r['slot']\
        \ for r in full if r['classification']=='HOLD_UNRESOLVED'],\n 'global_player_appearance_max':max(global_counts.values()),'global_unique_pairs':len(pair_list),'original_high_priority_players_removed_in_shadow':sorted({k\
        \ for r in full for k in r.get('targeted_players_removed_in_shadow',[])}),\n 'global_search_completed':exhaustive,'max_cardinality_proven':len(best)==upper_bound\
        \ or exhaustive,'secondary_objectives_proven':False,'global_search_nodes':search_nodes,'source_sha256':{k:sha\
        \ for k,(p,sha) in PINS.items()},'source_after_daily_cap_sha256':summary['source_after_daily_cap_sha256'],\n\
        \ 'no_voter_ids_or_ballots':True,'no_evidence_threshold_selected':True,'not_a_voter_ready_catalog':True}\n(OUTPUT/'RESEARCH_ONLY_v10_global_summary.json').write_text(json.dumps(summary_out,indent=2,sort_keys=True)+'\\\
        n')\n(OUTPUT/'RESEARCH_ONLY_v10_shadow_slate.json').write_text(json.dumps({'summary':summary_out,'slots':full,'unresolved_diagnostics':diagnostics},indent=2,sort_keys=True)+'\\\
        n')\nlines=['# QF11 V10 — Global catalog feasibility and owner adjudication','', '**RESEARCH ONLY — NOT A BALLOT\
        \ ISSUANCE OR OWNER APPROVAL.**','',\n f'- Untouched source-screened V9 slots: 12 / 28',f'- Optional jointly\
        \ consistent shadow substitutions: {len(best)} of 16 held slots',f'- Unresolved held slots: {summary_out[\"unresolved_held_slots\"\
        ]}',\n f'- Globally coordinated shadow slots: {len(candidates)} / 28',f'- Unique same-position pairs: {len(pair_list)}',f'-\
        \ Max per-player appearances: {max(global_counts.values())}',\n f'- High-priority players removed in *optional*\
        \ shadow proposals, never in model: {summary_out[\"original_high_priority_players_removed_in_shadow\"]}',f'-\
        \ Maximum feasible slot count proven: {summary_out[\"max_cardinality_proven\"]}; search nodes: {search_nodes}',\n\
        \ '','## Slot-by-slot owner review','','| Slot | Status | Original 3-way ballot | Optional shadow | Outstanding\
        \ review |','|---:|---|---|---|---|']\nfor r in full:\n a=' / '.join(r['original_player_keys']); b=' / '.join(r['candidate_player_keys'])\
        \ if r['candidate_player_keys'] else '**HELD**'\n issues='; '.join(r.get('original_hold_reasons',[])) if r['classification']!='SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED'\
        \ else 'Source-screened only; human review outstanding'\n lines.append(f'| {r[\"slot\"]:02d} | {r[\"classification\"\
        ]} | {a} | {b} | {issues} |')\nlines+=['','## Explicit governance boundaries','',\n 'All optional substitutions\
        \ are new research suggestions, not accepted player-identity resolutions.','The original held ballots remain\
        \ held. A proposed replacement of Will Anderson, Micah Parsons or any other target requires explicit owner review\
        \ before survey design.','No new voter URLs, ballots, poll issuance, vote counts, Market Values or trade values\
        \ have been published.','Independent human realism, positional eligibility, and voter-distribution review must\
        \ precede any authorization.']\n(OUTPUT/'RESEARCH_ONLY_v10_owner_review.md').write_text('\\n'.join(lines)+'\\\
        n')\nassert len(list(OUTPUT.iterdir()))==3\nfor f in OUTPUT.iterdir():\n txt=f.read_text()\n assert all(x not\
        \ in txt for x in ('voter_roster_id','sheet_url','raw_ballots')), 'STOP privacy leak'\nprint('QF11_V10_GLOBAL_OWNER_SHADOW_GREEN\
        \ '+json.dumps({k:summary_out[k] for k in ('original_source_screened_slots','original_held_slots','held_jointly_feasible_individually','held_jointly_selected_shadow','total_shadow_slots_including_existing_screened','unresolved_held_slots','global_player_appearance_max','global_unique_pairs','original_high_priority_players_removed_in_shadow','global_search_completed','max_cardinality_proven','global_search_nodes')},sort_keys=True))\n\
        print('QF11_V10_HOLD voting_activated=False owner_approval=False market_promotion_authorized=False')\n\nQF11_V10_SCRIPT\n\
        python3 -m py_compile /tmp/qf11-v10-global.py\npython3 /tmp/qf11-v10-global.py\n"
    - name: Rerun all 14 frozen model, market and production regression groups
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''QF11_V10_14_REPO_REGRESSIONS_GREEN'''
    - name: Verify immutable protected blobs, zero source writes and inactive owner gates
      shell: bash
      run: 'set -euo pipefail

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP HEAD drift''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP repository write''; git status --short; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected blob drift $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        python3 - <<''QF11_V10_HOLD''

        from pathlib import Path

        import json

        out=Path(''/tmp/qf11-v10-output'')

        assert {x.name for x in out.iterdir()}=={''RESEARCH_ONLY_v10_global_summary.json'',''RESEARCH_ONLY_v10_shadow_slate.json'',''RESEARCH_ONLY_v10_owner_review.md''}

        s=json.loads((out/''RESEARCH_ONLY_v10_global_summary.json'').read_text())

        assert s[''not_a_voter_ready_catalog''] and not s[''voting_activated''] and not s[''owner_approval'']

        assert s[''market_or_model_promotion_authorized''] is False and s[''original_held_slots'']==16

        assert s[''original_source_screened_slots'']==12 and s[''max_cardinality_proven''] is True

        assert s[''global_player_appearance_max'']<=2 and s[''global_unique_pairs'']==s[''total_shadow_slots_including_existing_screened'']

        assert s[''total_shadow_slots_including_existing_screened'']<=28

        print(''QF11_V10_ZERO_WRITE_AND_REVIEW_HOLD_GREEN all output research-only; no voter links, no values changed'')

        QF11_V10_HOLD

        '
    - name: Archive no-voter-URLs owner review and global shadow feasibility for seven days
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v10-RESEARCH-ONLY-global-owner-review
        path: /tmp/qf11-v10-output/
        retention-days: 7
        if-no-files-found: error
