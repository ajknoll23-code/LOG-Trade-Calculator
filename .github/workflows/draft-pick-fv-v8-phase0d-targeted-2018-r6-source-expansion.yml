name: Draft Pick FV V8 - Phase 0D Targeted 2018 R6 Source Expansion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0d-targeted-2018-r6-source-expansion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      candidate_count: ${{ steps.matrix.outputs.candidate_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download and verify frozen pre-outcome lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prep/p0a" "${RUNNER_TEMP}/prep/p0b" "${RUNNER_TEMP}/prep/p0c"

          # Phase 0A: frozen 6,203-candidate universe + frozen V7 identity engine/assets.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10894002488" --jq '.digest')" = \
            "sha256:bb24b4ea7378936ea1f8b9504e631f566218a3bdf20297d19d5fe7657de32d5d"
          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-prep" \
            -D "${RUNNER_TEMP}/prep/p0a"

          # Phase 0B: exact candidate dispositions and original transport ledger.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10925470604" --jq '.digest')" = \
            "sha256:189d986491c4dc5bfa78cc76fc738aba3b96b638004ff17baa6402218e9aaa7c"
          gh run download 36268881894 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0b-qualified-depth-feasibility-closeout" \
            -D "${RUNNER_TEMP}/prep/p0b"

          # Phase 0C V3: deterministic sharded closeout. This is the sole baseline for 0D.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10950012682" --jq '.digest')" = \
            "sha256:e5f1192466ca65a0f6874d75ca828618e6172babfa9b3d1cdbb966d3d65a5b7a"
          gh run download 36367917872 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0c-incremental-r6-rescue-v3-closeout" \
            -D "${RUNNER_TEMP}/prep/p0c"

          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = \
            "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/identity_crosswalk.json" | awk '{print $1}')" = \
            "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

      - name: Freeze Phase 0D contract and deterministic 2018 expansion universe
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode

          import requests

          ROOT=Path(os.environ["RUNNER_TEMP"])/"prep"
          P0A=ROOT/"p0a"
          P0B=ROOT/"p0b"
          P0C=ROOT/"p0c"
          YEAR=2018
          PRIOR_CAP=100
          EXPANDED_CAP=250
          SHARD_SIZE=16
          MAX_SHARDS=256
          TERMS=[
              "dynasty","superflex","super flex","2qb","2 qb","rookie",
              "idp","devy","empire","contract","salary","taxi",
              "fantasy","football","league",
          ]
          TARGET_CELLS=("r6_early","r6_mid","r6_late")

          def sha_text(values):
              return hashlib.sha256("\n".join(values).encode()).hexdigest()

          def load_engine(path: Path):
              spec=importlib.util.spec_from_file_location("v7_frozen_engine",path)
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot import frozen V7 engine")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          # Verify the exact source-only Phase 0C stop that authorizes 0D.
          s=json.loads((P0C/"v8_phase0c_incremental_r6_rescue.json").read_text())
          e=json.loads((P0C/"v8_phase0c_incremental_exact_evidence.json").read_text())
          assert s["decision"]=="STOP_AND_PREREGISTER_V8_PHASE0D_TARGETED_SOURCE_EXPANSION_BEFORE_OUTCOMES"
          assert s["candidate_universe_total_n"]==6203
          assert s["year_cells_passing"]==105
          assert s["all_year_cells_pass"] is False
          assert s["ordered_reducer_completion_order_invariance_pass"] is True
          assert s["transport"]["combined_distinct_unresolved_candidate_n"]==23
          assert s["transport"]["gate_pass"] is True
          assert s["historical_outcome_ingestion_authorized"] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert all(v is False for v in s["firewalls"].values())

          deficient=sorted(
              s["deficient_year_cells"],
              key=lambda x:(int(x["draft_year"]),x["cell"]),
          )
          assert deficient==[
              {"draft_year":2018,"cell":"r6_early","fully_usable_league_n":6,"shortfall":6},
              {"draft_year":2018,"cell":"r6_late","fully_usable_league_n":6,"shortfall":6},
              {"draft_year":2018,"cell":"r6_mid","fully_usable_league_n":6,"shortfall":6},
          ], deficient
          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False
          for cell in TARGET_CELLS:
              assert len(e["cell_membership_league_ids"][f"2018:{cell}"])==6

          # Exact original 2018 discovery universe. Every one is forbidden from 0D expansion.
          disc=json.loads((P0A/"discoveries"/"discovery_2018.json").read_text())
          prior_ids=[str(x) for x in disc["candidate_ids"]]
          assert len(prior_ids)==1059,len(prior_ids)
          assert len(set(prior_ids))==1059
          assert sha_text(prior_ids)==disc["candidate_ids_sha256"]
          prior=set(prior_ids)

          E=load_engine(P0A/"engine"/"build_r1_r6_source_identity_v7.py")
          ses=requests.Session()
          ses.headers["User-Agent"]="LOG-Draft-Pick-FV-V8-P0D-2018-Discovery/1.0"

          raw_counts={}
          capped_counts={}
          new_counts={}
          term_new={}
          union=set()
          for term in TERMS:
              # Search failure is fatal: an empty-on-error result would redefine the source frame.
              data=E.V.get_json(ses,E.V.api_url(YEAR,"leagueSearch",SEARCH=term))
              raw=sorted(set(str(x) for x in E.V.search_ids(data)))
              ranked=sorted(raw,key=lambda lid:(E.V.stable_hash(f"{YEAR}|{term}|{lid}"),lid))
              capped=ranked[:EXPANDED_CAP]
              new=[lid for lid in capped if lid not in prior]
              raw_counts[term]=len(raw)
              capped_counts[term]=len(capped)
              new_counts[term]=len(new)
              term_new[term]=new
              union.update(new)

          order=sorted(
              union,
              key=lambda lid:(E.V.stable_hash(f"{YEAR}|candidate|{lid}"),lid),
          )
          assert not (set(order)&prior)
          assert len(order)==len(set(order))
          assert len(order)<=len(TERMS)*EXPANDED_CAP
          if not order:
              raise RuntimeError("Phase 0D deterministic expansion produced zero new 2018 candidates")

          shard_n=(len(order)+SHARD_SIZE-1)//SHARD_SIZE
          assert shard_n<=MAX_SHARDS,(len(order),shard_n)
          matrix=[]
          for i in range(shard_n):
              lo=i*SHARD_SIZE
              hi=min(len(order),(i+1)*SHARD_SIZE)
              matrix.append({
                  "year":YEAR,
                  "shard":f"{i:03d}",
                  "start":lo+1,
                  "end":hi,
                  "slot":i%12,
              })

          contract={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase0d_targeted_2018_r6_source_expansion_preregistration",
              "status":"FROZEN_PRE_PHASE0D_CANDIDATE_PROBE_PRE_OUTCOME",
              "trigger":{
                  "phase0c_decision":s["decision"],
                  "year_cells_passing":105,
                  "remaining_deficient_year_cell_n":3,
                  "remaining_year":2018,
                  "remaining_cells":["r6_early","r6_mid","r6_late"],
                  "baseline_fully_usable_league_n_each":6,
                  "shortfall_each":6,
                  "source_only_evidence":True,
              },
              "frozen_baseline":{
                  "source":"Phase 0C V3 exact source/identity closeout",
                  "artifact_id":10950012682,
                  "artifact_zip_sha256":"e5f1192466ca65a0f6874d75ca828618e6172babfa9b3d1cdbb966d3d65a5b7a",
                  "all_non_target_year_cells_frozen":True,
                  "non_target_membership_may_change":False,
                  "target_membership_may_only_append_new_phase0d_sources":True,
              },
              "discovery_expansion":{
                  "provider":"MyFantasyLeague",
                  "year":2018,
                  "endpoint":"leagueSearch",
                  "search_terms":TERMS,
                  "search_terms_changed_from_v7":False,
                  "prior_per_term_cap":PRIOR_CAP,
                  "expanded_per_term_cap":EXPANDED_CAP,
                  "per_term_order":"SHA256(year|term|league_id), then league_id",
                  "candidate_union_order":"SHA256(year|candidate|league_id), then league_id",
                  "prior_2018_candidate_n":1059,
                  "all_prior_2018_candidates_explicitly_excluded":True,
                  "new_candidate_n":len(order),
                  "new_candidate_ids_sha256":sha_text(order),
                  "all_search_terms_executed_before_candidate_probe":True,
                  "search_failure_is_fatal":True,
                  "live_search_index_drift_recorded_not_hidden":True,
                  "early_stopping_in_discovery":False,
                  "new_search_terms_allowed":False,
                  "manual_candidate_addition_allowed":False,
                  "alternate_provider_allowed":False,
              },
              "selection_rule":{
                  "target_cells":["r6_early","r6_mid","r6_late"],
                  "minimum_fully_usable_leagues_per_cell":12,
                  "baseline_n_each":6,
                  "required_additional_n_each":6,
                  "replay_order":"exact frozen Phase 0D candidate union order",
                  "stop_rule":"ordered reducer stops immediately after all three 2018 R6 cells reach 12 fully usable leagues",
                  "outcome_dependent_selection":False,
                  "shards_collect_evidence_only":True,
                  "shards_may_not_select_sources":True,
                  "completion_order_may_not_affect_selection":True,
                  "prefetched_after_stop_excluded_from_selection":True,
              },
              "source_rule":{
                  "selected_draft_unit":"byte-identical frozen V7 extract_units + choose_unit",
                  "target_windows":{
                      "r6_early":[61,62,63,64],
                      "r6_mid":[65,66,67,68],
                      "r6_late":[69,70,71,72],
                  },
                  "earlier_round_completeness_required":False,
                  "all_four_slots_exactly_once":True,
                  "four_nonnull_distinct_mfl_player_ids":True,
                  "league_qualifier":"byte-identical frozen V7 12-team dynasty/proxy Superflex/2QB rookie-pool qualifier",
                  "obvious_mock_rejection":"byte-identical frozen V7 rule",
                  "contamination_scope":"exact target four-pick cell",
                  "four_of_four_identity_required":True,
                  "four_of_four_sleeper_ready_required":True,
                  "manual_rescue_allowed":False,
              },
              "execution":{
                  "mode":"deterministic_parallel_candidate_shards_then_ordered_reducer",
                  "shard_size":SHARD_SIZE,
                  "shard_n":shard_n,
                  "max_parallel":12,
                  "github_matrix_max":MAX_SHARDS,
              },
              "transport":{
                  "search_transport_failure":"fatal",
                  "candidate_endpoints_allowed":["draftResults","league","players"],
                  "candidate_transport_isolation":True,
                  "prior_combined_unresolved_candidate_n":23,
                  "maximum_combined_unresolved_candidate_n":62,
                  "prefetched_after_ordered_stop_excluded_from_scientific_transport_gate":True,
              },
              "firewalls":{
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
              },
              "pass_decision":"PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
              "fail_decision":"STOP_AND_PREREGISTER_V8_PHASE0E_SECOND_SOURCE_2018_R6_BEFORE_OUTCOMES",
          }

          plan={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0d_targeted_2018_r6_source_expansion_plan",
              "year":2018,
              "target_cells":["r6_early","r6_mid","r6_late"],
              "baseline_membership":{
                  cell:list(e["cell_membership_league_ids"][f"2018:{cell}"])
                  for cell in TARGET_CELLS
              },
              "prior_2018_candidate_ids":prior_ids,
              "prior_2018_candidate_ids_sha256":disc["candidate_ids_sha256"],
              "search_term_raw_unique_n":raw_counts,
              "search_term_counts_after_expanded_cap":capped_counts,
              "search_term_new_candidate_n":new_counts,
              "search_term_new_candidate_ids":term_new,
              "expansion_candidate_ids":order,
              "expansion_candidate_ids_sha256":sha_text(order),
              "expanded_per_term_cap":EXPANDED_CAP,
              "shard_size":SHARD_SIZE,
              "shard_count":shard_n,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }

          (ROOT/"v8_phase0d_contract.json").write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")
          (ROOT/"v8_phase0d_plan.json").write_text(json.dumps(plan,indent=2,sort_keys=True)+"\n")

          gh_out=Path(os.environ["GITHUB_OUTPUT"])
          with gh_out.open("a") as f:
              f.write("matrix="+json.dumps({"include":matrix},separators=(",",":"))+"\n")
              f.write(f"shard_count={shard_n}\n")
              f.write(f"candidate_count={len(order)}\n")

          print(json.dumps({
              "phase0c_year_cells_passing":105,
              "targets":{"r6_early":6,"r6_mid":6,"r6_late":6},
              "old_2018_candidate_n":1059,
              "expanded_cap_per_term":EXPANDED_CAP,
              "new_candidate_n":len(order),
              "shard_size":SHARD_SIZE,
              "shard_n":shard_n,
              "max_matrix_jobs":MAX_SHARDS,
              "raw_counts":raw_counts,
          },indent=2,sort_keys=True))
          PY

      - name: Write Phase 0D shard evidence probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/prep/phase0d_probe_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          import requests

          WINDOWS={
              "r6_early":(61,62,63,64),
              "r6_mid":(65,66,67,68),
              "r6_late":(69,70,71,72),
          }

          def sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def load_engine(path: Path):
              spec=importlib.util.spec_from_file_location("v7_frozen_engine",path)
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot import frozen V7 engine")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def parse_selected_unit(E,unit):
              raw=[x for x in E.V.as_list(unit.get("draftPick")) if isinstance(x,dict)]
              by_slot={}
              for i,p in enumerate(raw):
                  r=E.V.safe_int(p.get("round")); w=E.V.safe_int(p.get("pick"))
                  if r is None or w is None or r<1 or r>6 or w<1 or w>12:
                      continue
                  s=(r-1)*12+w
                  by_slot.setdefault(s,[]).append({
                      "overall_slot":s,
                      "round":r,
                      "within_round_pick":w,
                      "mfl_player_id":E.V.stable_id(p.get("player")),
                      "franchise_id":E.V.stable_id(
                          p.get("franchise") or p.get("franchise_id") or p.get("franchiseId")
                      ),
                      "raw_row_index":i,
                  })
              return by_slot

          def extract_window(by_slot,slots):
              rows=[]
              for s in slots:
                  xs=by_slot.get(s,[])
                  if len(xs)==0: return None,"missing_slot"
                  if len(xs)!=1: return None,"duplicate_slot"
                  rows.append(dict(xs[0]))
              pids=[x.get("mfl_player_id") for x in rows]
              if any(not x for x in pids): return None,"missing_player_id"
              if len(set(pids))!=4: return None,"duplicate_player_id"
              return rows,"structurally_complete"

          def selftest():
              class V:
                  @staticmethod
                  def as_list(x): return [] if x is None else (x if isinstance(x,list) else [x])
                  @staticmethod
                  def safe_int(x):
                      try: return int(x)
                      except Exception: return None
                  @staticmethod
                  def stable_id(x):
                      if x is None: return None
                      s=str(x).strip(); return s or None
              class E: pass
              E.V=V
              picks=[
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":3,"player":"603"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              rows,status=extract_window(parse_selected_unit(E,{"draftPick":picks}),WINDOWS["r6_early"])
              assert status=="structurally_complete"
              assert [x["mfl_player_id"] for x in rows]==["601","602","603","604"]
              print("PASS: Phase 0D shard probe self-test")

          def run(args):
              prep=Path(args.prep); out=Path(args.out)
              plan=json.loads((prep/"v8_phase0d_plan.json").read_text())
              contract=json.loads((prep/"v8_phase0d_contract.json").read_text())
              assert args.year==2018
              order=[str(x) for x in plan["expansion_candidate_ids"]]
              if args.start_index<1 or args.end_index>len(order) or args.start_index>args.end_index:
                  raise RuntimeError("invalid shard range")
              batch=order[args.start_index-1:args.end_index]
              prior=set(str(x) for x in plan["prior_2018_candidate_ids"])
              assert not (set(batch)&prior)

              E=load_engine(prep/"p0a"/"engine"/"build_r1_r6_source_identity_v7.py")
              frozen_fp=prep/"p0a"/"engine"/"identity_crosswalk.json"
              expected_fp="697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
              if sha(frozen_fp)!=expected_fp: raise RuntimeError("frozen crosswalk hash mismatch")
              E.FP_XWALK=frozen_fp
              idx,asset=E.load_indexes(
                  prep/"p0a"/"engine"/"db_playerids.csv",
                  prep/"p0a"/"engine"/"nflverse_players.csv",
                  prep/"p0a"/"engine"/"r1_r6_identity_asset_manifest_v7.json",
              )
              if asset["fantasypros_sleeper_crosswalk"]["sha256"]!=expected_fp:
                  raise RuntimeError("identity manifest mismatch")

              ses=requests.Session()
              ses.headers["User-Agent"]=f"LOG-Draft-Pick-FV-V8-P0D-2018-{args.shard_id}/1.0"
              records=[]; transport=[]

              for offset,lid in enumerate(batch):
                  scan_index=args.start_index+offset
                  rec={
                      "scan_index":scan_index,
                      "league_id":lid,
                      "draft_year":2018,
                      "cell_results":{},
                  }
                  stage="draftResults"
                  try:
                      units=E.V.extract_units(E.V.get_json(ses,E.V.api_url(2018,"draftResults",L=lid)))
                      chosen,reason,unit_summary=E.V.choose_unit(units)
                      rec["unit_selection_reason"]=str(reason)
                      if chosen is None:
                          rec["status"]="draft_unit_reject"
                          records.append(rec); continue

                      by=parse_selected_unit(E,chosen)
                      windows={}
                      for cell,slots in WINDOWS.items():
                          rows,status=extract_window(by,slots)
                          rec["cell_results"][cell]={"structural_status":status}
                          if rows is not None: windows[cell]=rows

                      if not windows:
                          rec["status"]="no_structural_r6_window"
                          records.append(rec); continue

                      stage="league"
                      lg=E.V.league_obj(E.V.get_json(ses,E.V.api_url(2018,"league",L=lid)))
                      if lg is None:
                          rec["qualification_status"]="league_missing"
                          rec["status"]="league_missing"
                          records.append(rec); continue
                      ok,q=E.V.qualifier(lg)
                      if not ok:
                          rec["qualification_status"]="qualifier_reject"
                          rec["qualification_reason"]=str(q)
                          rec["status"]="qualifier_reject"
                          records.append(rec); continue
                      if E.V.obvious_mock_name(lg.get("name")):
                          rec["qualification_status"]="obvious_mock_reject"
                          rec["status"]="obvious_mock_reject"
                          records.append(rec); continue
                      rec["qualification_status"]="qualified"
                      rec["format_source"]="phase0d_refetched_league"

                      pids=sorted({
                          str(x["mfl_player_id"])
                          for rows in windows.values() for x in rows
                      })
                      stage="players"
                      meta=E.V.league_scoped_players(ses,2018,lid,pids)

                      any_usable=False
                      for cell,rows in windows.items():
                          cr=[{"overall_slot":int(x["overall_slot"]),"mfl_player_id":str(x["mfl_player_id"])} for x in rows]
                          contam=E.V.classify_contamination(2018,cr,meta,idx)
                          if contam["positive_contamination"]:
                              rec["cell_results"][cell].update({
                                  "status":"contamination_reject",
                                  "positive_evidence":contam.get("positive_evidence",[]),
                              })
                              continue

                          resolved=[]
                          for row in rows:
                              pid=str(row["mfl_player_id"])
                              ident=E.V.resolve_identity(2018,pid,meta.get(pid),idx)
                              x={
                                  "draft_year":2018,
                                  "league_id":lid,
                                  "cell":cell,
                                  "overall_slot":int(row["overall_slot"]),
                                  "round":int(row["round"]),
                                  "within_round_pick":int(row["within_round_pick"]),
                                  "mfl_player_id":pid,
                                  "franchise_id":row.get("franchise_id"),
                              }
                              x.update(ident)
                              x["stable_player_key"]=E.V.stable_player_key(ident)
                              resolved.append(x)

                          if not all(bool(x["identity_resolved"]) for x in resolved):
                              rec["cell_results"][cell].update({"status":"identity_reject","occurrences":resolved})
                              continue
                          if not all(bool(x["outcome_ready_sleeper_id"]) for x in resolved):
                              rec["cell_results"][cell].update({"status":"sleeper_reject","occurrences":resolved})
                              continue
                          rec["cell_results"][cell].update({"status":"usable","occurrences":resolved})
                          any_usable=True

                      rec["status"]="usable_at_least_one_cell" if any_usable else "evaluated_no_usable_cell"
                      records.append(rec)

                  except E.GateError as exc:
                      if not E._v4_transport_exhaustion(exc): raise
                      u={
                          "draft_year":2018,
                          "league_id":lid,
                          "scan_index":scan_index,
                          "stage":stage,
                          "failure_class":E._v4_transport_class(str(exc)),
                          "error_fingerprint_sha256":hashlib.sha256(str(exc).encode()).hexdigest(),
                      }
                      transport.append(u)
                      rec["status"]="transport_unresolved"
                      rec["transport"]=u
                      records.append(rec)

              assert [x["league_id"] for x in records]==batch
              assert [int(x["scan_index"]) for x in records]==list(range(args.start_index,args.end_index+1))
              payload={
                  "schema_version":1,
                  "study_id":contract["study_id"],
                  "stage":"phase0d_targeted_2018_r6_candidate_shard",
                  "draft_year":2018,
                  "shard_id":args.shard_id,
                  "start_index":args.start_index,
                  "end_index":args.end_index,
                  "candidate_n":len(batch),
                  "records":records,
                  "transport_unresolved":transport,
                  "shards_collect_evidence_only":True,
                  "candidate_selection_performed":False,
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "production_change_authorized":False,
              }
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
              print(json.dumps({
                  "shard":args.shard_id,
                  "range":[args.start_index,args.end_index],
                  "candidate_n":len(batch),
                  "usable_candidate_n":sum(x["status"]=="usable_at_least_one_cell" for x in records),
                  "transport_unresolved_n":len(transport),
              },indent=2))

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--self-test",action="store_true")
              ap.add_argument("--year",type=int)
              ap.add_argument("--start-index",type=int)
              ap.add_argument("--end-index",type=int)
              ap.add_argument("--shard-id")
              ap.add_argument("--prep")
              ap.add_argument("--out")
              a=ap.parse_args()
              if a.self_test:
                  selftest(); return
              if None in (a.year,a.start_index,a.end_index,a.shard_id,a.prep,a.out):
                  ap.error("probe mode requires all shard arguments")
              run(a)

          if __name__=="__main__": main()
          PY
          chmod +x "${RUNNER_TEMP}/prep/phase0d_probe_v8.py"
          python3 "${RUNNER_TEMP}/prep/phase0d_probe_v8.py" --self-test

      - name: Validate frozen Phase 0D prep
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"prep"
          c=json.loads((p/"v8_phase0d_contract.json").read_text())
          q=json.loads((p/"v8_phase0d_plan.json").read_text())
          assert c["status"]=="FROZEN_PRE_PHASE0D_CANDIDATE_PROBE_PRE_OUTCOME"
          assert c["trigger"]["remaining_year"]==2018
          assert c["trigger"]["remaining_deficient_year_cell_n"]==3
          assert c["trigger"]["baseline_fully_usable_league_n_each"]==6
          assert c["trigger"]["shortfall_each"]==6
          assert c["discovery_expansion"]["search_terms_changed_from_v7"] is False
          assert c["discovery_expansion"]["prior_per_term_cap"]==100
          assert c["discovery_expansion"]["expanded_per_term_cap"]==250
          assert c["discovery_expansion"]["all_prior_2018_candidates_explicitly_excluded"] is True
          assert c["selection_rule"]["outcome_dependent_selection"] is False
          assert c["selection_rule"]["shards_may_not_select_sources"] is True
          assert c["transport"]["maximum_combined_unresolved_candidate_n"]==62
          assert all(v is False for v in c["firewalls"].values())
          assert q["year"]==2018
          assert len(q["prior_2018_candidate_ids"])==1059
          assert not (set(q["prior_2018_candidate_ids"]) & set(q["expansion_candidate_ids"]))
          assert q["shard_count"]<=256
          print(f"PASS: Phase 0D frozen; new candidates={len(q['expansion_candidate_ids'])}; shards={q['shard_count']}")
          PY

      - name: Upload frozen Phase 0D prep
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0d-targeted-2018-r6-prep
          path: ${{ runner.temp }}/prep/
          if-no-files-found: error
          retention-days: 30

  rescue_shards:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      YEAR: ${{ matrix.year }}
      SHARD: ${{ matrix.shard }}
      START_INDEX: ${{ matrix.start }}
      END_INDEX: ${{ matrix.end }}
      SLOT: ${{ matrix.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0D prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0d-targeted-2018-r6-prep
          path: ${{ runner.temp }}/prep

      - name: Probe deterministic Phase 0D candidate shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/diag"
          export MFL_TRANSPORT_DIAGNOSTIC_PATH="${RUNNER_TEMP}/diag/transport_${YEAR}_${SHARD}.jsonl"
          sleep "$(( SLOT * 3 ))"
          python3 "${RUNNER_TEMP}/prep/phase0d_probe_v8.py" \
            --year "$YEAR" \
            --start-index "$START_INDEX" \
            --end-index "$END_INDEX" \
            --shard-id "$SHARD" \
            --prep "${RUNNER_TEMP}/prep" \
            --out "${RUNNER_TEMP}/out/shard_${YEAR}_${SHARD}.json"

      - name: Upload Phase 0D shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0d-r6-shard-${{ matrix.year }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Phase 0D transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0d-r6-shard-diag-${{ matrix.year }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/diag/
          if-no-files-found: ignore
          retention-days: 30

  reduce:
    needs: [prepare, rescue_shards]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
      EXPECTED_CANDIDATE_COUNT: ${{ needs.prepare.outputs.candidate_count }}
    steps:
      - name: Download frozen Phase 0D prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0d-targeted-2018-r6-prep
          path: ${{ runner.temp }}/prep

      - name: Download all Phase 0D shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p0d-r6-shard-2018-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Deterministically reduce Phase 0D and close source gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assembled"
          python3 - <<'PY'
          from __future__ import annotations
          import json, os
          from collections import defaultdict, Counter
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          prep=root/"prep"; shards=root/"shards"; out=root/"assembled"
          contract=json.loads((prep/"v8_phase0d_contract.json").read_text())
          plan=json.loads((prep/"v8_phase0d_plan.json").read_text())
          p0c_summary=json.loads((prep/"p0c"/"v8_phase0c_incremental_r6_rescue.json").read_text())
          p0c=json.loads((prep/"p0c"/"v8_phase0c_incremental_exact_evidence.json").read_text())
          p0b=json.loads((prep/"p0b"/"v8_phase0b_qualified_depth_exact_evidence.json").read_text())

          expected_shards=int(os.environ["EXPECTED_SHARD_COUNT"])
          expected_candidates=int(os.environ["EXPECTED_CANDIDATE_COUNT"])
          docs=[]
          for p in sorted(shards.glob("shard_2018_*.json")):
              d=json.loads(p.read_text())
              for k in (
                  "candidate_selection_performed","historical_player_outcomes_read",
                  "holdout_2024_outcomes_read","holdout_2024_search_performed",
                  "market_or_ktc_values_read","package_vote_data_read",
                  "candidate_fit_performed","candidate_scores_computed",
                  "production_change_authorized",
              ):
                  assert d[k] is False,(p.name,k)
              assert d["shards_collect_evidence_only"] is True
              docs.append(d)
          assert len(docs)==expected_shards,(len(docs),expected_shards)

          order=[str(x) for x in plan["expansion_candidate_ids"]]
          assert len(order)==expected_candidates
          all_records=[r for d in docs for r in d["records"]]
          assert len(all_records)==expected_candidates,(len(all_records),expected_candidates)
          by_index={int(r["scan_index"]):r for r in all_records}
          assert len(by_index)==expected_candidates
          assert set(by_index)==set(range(1,expected_candidates+1))
          for i,lid in enumerate(order,1):
              assert str(by_index[i]["league_id"])==lid,(i,lid,by_index[i]["league_id"])

          targets=("r6_early","r6_mid","r6_late")
          baseline={cell:list(p0c["cell_membership_league_ids"][f"2018:{cell}"]) for cell in targets}
          assert {cell:len(v) for cell,v in baseline.items()}=={cell:6 for cell in targets}

          def replay(records):
              idx={int(r["scan_index"]):r for r in records}
              additions={cell:[] for cell in targets}
              occurrences=[]; attempts=[]; transport=[]; counts=Counter()
              def complete():
                  return all(len(baseline[cell])+len(additions[cell])>=12 for cell in targets)
              for scan_index,lid in enumerate(order,1):
                  if complete(): break
                  rec=idx[scan_index]
                  assert str(rec["league_id"])==lid
                  attempt={"scan_index":scan_index,"league_id":lid}
                  if rec["status"]=="transport_unresolved":
                      transport.append(rec["transport"])
                      attempt["status"]="transport_unresolved"; attempt["transport"]=rec["transport"]
                      attempts.append(attempt); counts["transport_unresolved"]+=1; continue
                  if rec["status"]=="draft_unit_reject":
                      attempt["status"]="draft_unit_reject"; attempts.append(attempt); counts["draft_unit_reject"]+=1; continue
                  if rec["status"]=="no_structural_r6_window":
                      attempt["status"]="no_structural_r6_window"; attempts.append(attempt); counts["no_structural_r6_window"]+=1; continue
                  if rec["status"] in {"league_missing","qualifier_reject","obvious_mock_reject"}:
                      attempt["status"]=rec["status"]
                      if "qualification_reason" in rec: attempt["reason"]=rec["qualification_reason"]
                      attempts.append(attempt); counts[rec["status"]]+=1; continue

                  added=[]
                  for cell in targets:
                      if len(baseline[cell])+len(additions[cell])>=12: continue
                      c=rec.get("cell_results",{}).get(cell,{})
                      if c.get("structural_status")!="structurally_complete":
                          counts[f"{cell}:structural_reject"]+=1; continue
                      status=c.get("status")
                      if status!="usable":
                          counts[f"{cell}:{status or 'unknown_reject'}"]+=1; continue
                      assert lid not in baseline[cell]
                      assert lid not in additions[cell]
                      rows=c["occurrences"]
                      assert len(rows)==4
                      assert len({int(x["overall_slot"]) for x in rows})==4
                      assert all(bool(x["identity_resolved"]) for x in rows)
                      assert all(bool(x["outcome_ready_sleeper_id"]) for x in rows)
                      additions[cell].append(lid)
                      occurrences.extend(rows)
                      added.append(cell)
                      counts[f"{cell}:rescued"]+=1
                  attempt["added_cells"]=added
                  attempt["status"]="rescued" if added else "evaluated_no_rescue"
                  attempts.append(attempt)

              final_counts={cell:len(baseline[cell])+len(additions[cell]) for cell in targets}
              return {
                  "additions":additions,
                  "occurrences":occurrences,
                  "attempts":attempts,
                  "transport":transport,
                  "counts":dict(sorted(counts.items())),
                  "final_counts":final_counts,
                  "success":all(v>=12 for v in final_counts.values()),
                  "last_scan_index":attempts[-1]["scan_index"] if attempts else 0,
              }

          canonical=replay(all_records)
          reversed_result=replay(list(reversed(all_records)))
          assert canonical==reversed_result,"completion-order invariance failed"

          # Start from exact Phase 0C full 108-cell evidence and append only 2018 R6 Phase 0D sources.
          memberships={k:list(v) for k,v in p0c["cell_membership_league_ids"].items()}
          provenance={k:dict(v) for k,v in p0c["cell_membership_provenance"].items()}
          occurrences={k:list(v) for k,v in p0c["occurrences"].items()}
          for cell,lids in canonical["additions"].items():
              key=f"2018:{cell}"
              for lid in lids:
                  assert lid not in memberships[key]
                  memberships[key].append(lid)
                  provenance[key][lid]="phase0d_targeted_2018_source_expansion"

          grouped=defaultdict(list)
          for row in canonical["occurrences"]:
              grouped[(int(row["draft_year"]),row["cell"],str(row["league_id"]))].append(row)
          for (y,cell,lid),rows in grouped.items():
              key=f"{y}:{cell}:{lid}"
              assert key not in occurrences
              assert len(rows)==4
              occurrences[key]=rows

          cells={}; deficient=[]
          for key,lids in sorted(memberships.items()):
              assert len(set(lids))==len(lids),key
              for lid in lids:
                  rows=occurrences[f"{key}:{lid}"]
                  assert len(rows)==4
                  assert len({int(x["overall_slot"]) for x in rows})==4
                  assert all(bool(x["identity_resolved"]) for x in rows)
                  assert all(bool(x["outcome_ready_sleeper_id"]) for x in rows)
              y=int(key.split(":")[0]); cell=key.split(":",1)[1]; n=len(lids)
              passed=n>=12
              if not passed:
                  deficient.append({"draft_year":y,"cell":cell,"fully_usable_league_n":n,"shortfall":12-n})
              cells[key]={
                  "draft_year":y,"cell":cell,"fully_usable_league_n":n,
                  "minimum_required":12,"source_gate_pass":passed,
                  "occurrence_n":n*4,"identity_coverage":1.0,"sleeper_ready_coverage":1.0,
                  "phase0d_added_league_n":sum(1 for lid in lids if provenance[key].get(lid)=="phase0d_targeted_2018_source_expansion"),
              }
          assert len(cells)==108

          prior_transport={(int(x["draft_year"]),str(x["league_id"])) for x in p0b["transport_unresolved"]}
          prior_transport |= {
              (int(x["draft_year"]),str(x["league_id"]))
              for x in p0c.get("rescue_transport_unresolved",[])
          }
          assert len(prior_transport)==p0c_summary["transport"]["combined_distinct_unresolved_candidate_n"]==23
          phase0d_transport={(2018,str(x["league_id"])) for x in canonical["transport"]}
          combined_transport=prior_transport|phase0d_transport
          transport_n=len(combined_transport)
          transport_gate=transport_n<=62

          passed_cells=sum(bool(x["source_gate_pass"]) for x in cells.values())
          all_pass=passed_cells==108 and not deficient
          source_gate_pass=all_pass and transport_gate and canonical["success"]
          decision=contract["pass_decision"] if source_gate_pass else contract["fail_decision"]

          summary={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0d_targeted_2018_r6_source_expansion_closeout",
              "decision":decision,
              "phase0c_year_cells_passing":105,
              "phase0d_target_year":2018,
              "phase0d_target_cells":list(targets),
              "phase0d_baseline_n_each":6,
              "phase0d_new_candidate_n":expected_candidates,
              "phase0d_shard_n":expected_shards,
              "phase0d_candidate_evidence_prefetched_n":len(all_records),
              "phase0d_ordered_replay_attempt_n":len(canonical["attempts"]),
              "phase0d_last_scan_index":canonical["last_scan_index"],
              "phase0d_completion_order_invariance_pass":True,
              "phase0d_rescue_additions":canonical["additions"],
              "phase0d_final_target_counts":canonical["final_counts"],
              "phase0d_attempt_status_counts":canonical["counts"],
              "year_cell_n":108,
              "year_cells_passing":passed_cells,
              "all_year_cells_pass":all_pass,
              "deficient_year_cells":deficient,
              "transport":{
                  "prior_distinct_unresolved_candidate_n":len(prior_transport),
                  "phase0d_replayed_prefix_unresolved_candidate_n":len(phase0d_transport),
                  "combined_distinct_unresolved_candidate_n":transport_n,
                  "maximum_allowed_candidate_n":62,
                  "prefetched_after_stop_excluded_from_gate":True,
                  "gate_pass":transport_gate,
              },
              "year_cell":cells,
              "firewalls":contract["firewalls"],
              "historical_outcome_ingestion_authorized":False,
              "holdout_2024_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":(
                  "draft-pick-fv-v8-phase1-incremental-source-identity-freeze"
                  if source_gate_pass else
                  "draft-pick-fv-v8-phase0e-second-source-2018-r6-preregistration"
              ),
          }
          exact={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0d_exact_source_identity_evidence",
              "decision":decision,
              "cell_membership_league_ids":memberships,
              "cell_membership_provenance":provenance,
              "occurrences":occurrences,
              "phase0d_attempts":canonical["attempts"],
              "phase0d_transport_unresolved":canonical["transport"],
              "phase0d_completion_order_invariance_pass":True,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }
          (out/"v8_phase0d_targeted_2018_r6_source_expansion.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          (out/"v8_phase0d_exact_source_identity_evidence.json").write_text(json.dumps(exact,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Draft Pick FV V8 — Phase 0D Targeted 2018 R6 Source Expansion",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- New deterministic 2018 expansion candidates: **{expected_candidates}**",
              f"- Shards: **{expected_shards}** at up to **{plan['shard_size']} candidates/shard**",
              f"- Ordered-replay candidates attempted: **{len(canonical['attempts'])}**",
              "- Completion-order invariance: **PASS**",
              f"- Final 2018 R6 Early / Mid / Late: **{canonical['final_counts']['r6_early']} / {canonical['final_counts']['r6_mid']} / {canonical['final_counts']['r6_late']}**",
              f"- Year-cells passing final source gate: **{passed_cells} / 108**",
              f"- Combined unresolved transport candidates: **{transport_n}**; cap **62**",
              "",
              "No historical NFL outcomes, 2024 outcomes, market/KTC values, package votes, candidate fits, candidate scores, or production values were read.",
          ]
          if deficient:
              lines += ["","## Remaining deficient cells","","| Year | Cell | Fully usable | Shortfall |","|---:|---|---:|---:|"]
              for x in deficient:
                  lines.append(f"| {x['draft_year']} | {x['cell']} | {x['fully_usable_league_n']} | {x['shortfall']} |")
          (out/"v8_phase0d_targeted_2018_r6_source_expansion.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Validate Phase 0D closeout firewalls and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"assembled"
          s=json.loads((out/"v8_phase0d_targeted_2018_r6_source_expansion.json").read_text())
          e=json.loads((out/"v8_phase0d_exact_source_identity_evidence.json").read_text())
          assert s["phase0c_year_cells_passing"]==105
          assert s["phase0d_target_year"]==2018
          assert s["phase0d_target_cells"]==["r6_early","r6_mid","r6_late"]
          assert s["phase0d_baseline_n_each"]==6
          assert s["phase0d_completion_order_invariance_pass"] is True
          assert s["year_cell_n"]==108
          assert len(s["year_cell"])==108
          assert s["transport"]["maximum_allowed_candidate_n"]==62
          assert s["transport"]["prefetched_after_stop_excluded_from_gate"] is True
          assert s["historical_outcome_ingestion_authorized"] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert all(v is False for v in s["firewalls"].values())
          assert e["phase0d_completion_order_invariance_pass"] is True
          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False
          assert s["decision"] in {
              "PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
              "STOP_AND_PREREGISTER_V8_PHASE0E_SECOND_SOURCE_2018_R6_BEFORE_OUTCOMES",
          }
          print("PASS: Phase 0D closeout is outcome-sealed, exact-order deterministic, and target-only.")
          PY

      - name: Upload Phase 0D closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0d-targeted-2018-r6-closeout
          path: ${{ runner.temp }}/assembled/
          if-no-files-found: error
          retention-days: 30
