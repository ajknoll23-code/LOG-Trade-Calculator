name: Package Adjustment NextGen V2 Filler Diversity Capacity Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-adjustment-nextgen-v2-filler-diversity-capacity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install audit dependencies
        run: python3 -m pip install requests pulp

      - name: Verify reviewed starting state
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          CAT="research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"

          test -f "$GEN"
          test -f "$CAT"
          test -f "$SPEC"
          test -z "$(git status --porcelain=v1)"

          GEN_SHA="$(sha256sum "$GEN" | awk '{print $1}')"
          SPEC_SHA="$(sha256sum "$SPEC" | awk '{print $1}')"

          test "$GEN_SHA" = "e2fee705d959b363a1844635f8dd0dba87f2b316644f97952028d653507158ee"
          test "$SPEC_SHA" = "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"

          python3 - <<'PY'
          import json
          from pathlib import Path

          cat = json.loads(Path(
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          ).read_text(encoding="utf-8"))

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["research_only"] is True
          assert cat["frozen"] is False
          assert cat["production_formula_enabled"] is False
          assert cat["automatic_production_change_allowed"] is False
          assert cat["catalog_diagnostics"]["challenge_count"] == 144
          print("PASS: current catalog remains unreleased and unfrozen.")
          PY

      - name: Verify production Package Adjustment before audit
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Enumerate filler candidate universe and optimize diverse subset
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import importlib.util
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          import pulp

          ROOT = Path.cwd()
          GEN_PATH = ROOT / "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          CAT_PATH = ROOT / "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          REPORT_PATH = Path("/tmp/package-adjustment-nextgen-v2-filler-diversity-capacity-audit.json")

          spec = importlib.util.spec_from_file_location("pkgnv2_generator", GEN_PATH)
          g = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(g)

          catalog = json.loads(CAT_PATH.read_text(encoding="utf-8"))
          values_doc = g.read_json(g.VALUES)
          rosters_doc = g.read_json(g.ROSTERS)
          players, unresolved, pos_counts = g.build_player_universe(values_doc, rosters_doc)
          player_lookup = {p["key"]: p for p in players}
          feasible_pairs = g.enumerate_feasible_8020_pairs(players)

          comparison_label = "80_20_vs_80_05x4"
          comparison = [
              row for row in g.FRAGMENTATION_COMPARISONS
              if row[0] == comparison_label
          ]
          assert len(comparison) == 1
          _label, shares_a, shares_b = comparison[0]

          # First recover the 73 totals proven by the prior audit to support at
          # least one complete valid joint trade. We independently recompute
          # them from the current reviewed generator.
          component_totals = []
          seen_totals = set()
          for row in feasible_pairs:
              total = float(row["total_fv"])
              code = round(total, 3)
              if code in seen_totals:
                  continue
              seen_totals.add(code)
              if g.component_window_matching_exists(players, total, shares_a, shares_b):
                  component_totals.append(total)
          component_totals.sort()
          assert len(component_totals) == 335

          original_limit = int(g.SIDE_CANDIDATE_LIMIT)
          g.SIDE_CANDIDATE_LIMIT = 96

          unique_candidates = {}

          def package_keys(assets):
              return tuple(sorted(p["key"] for p in assets))

          def canonical_signature(a_keys, b_keys):
              return tuple(sorted((a_keys, b_keys)))

          for idx, goal in enumerate(component_totals, 1):
              candidates_a = g.construct_side_candidates(
                  players, goal, shares_a, set(), Counter(), limit=96
              )
              candidates_b = g.construct_side_candidates(
                  players, goal, shares_b, set(), Counter(), limit=96
              )
              if not candidates_a or not candidates_b:
                  continue

              for assets_a in candidates_a:
                  keys_a_set = {p["key"] for p in assets_a}
                  total_a = sum(float(p["fv"]) for p in assets_a)
                  err_a = abs(total_a - goal) / goal
                  shares_actual_a = g.canonical_actual_shares(assets_a)
                  intended_a = tuple(sorted((float(s) for s in shares_a), reverse=True))
                  share_err_a = max(
                      abs(a - b) for a, b in zip(shares_actual_a, intended_a)
                  )

                  for assets_b in candidates_b:
                      keys_b_set = {p["key"] for p in assets_b}
                      if keys_a_set & keys_b_set:
                          continue

                      total_b = sum(float(p["fv"]) for p in assets_b)
                      mean_total = (total_a + total_b) / 2.0
                      if mean_total <= 0:
                          continue
                      pair_gap = abs(total_a - total_b) / mean_total
                      if pair_gap > g.MAX_PAIR_TOTAL_GAP + 1e-12:
                          continue

                      err_b = abs(total_b - goal) / goal
                      shares_actual_b = g.canonical_actual_shares(assets_b)
                      intended_b = tuple(sorted((float(s) for s in shares_b), reverse=True))
                      share_err_b = max(
                          abs(a - b) for a, b in zip(shares_actual_b, intended_b)
                      )

                      if err_a > g.MAX_SIDE_TARGET_ERROR + 1e-12:
                          continue
                      if err_b > g.MAX_SIDE_TARGET_ERROR + 1e-12:
                          continue
                      if share_err_a > g.MAX_COMPONENT_SHARE_ERROR + 1e-12:
                          continue
                      if share_err_b > g.MAX_COMPONENT_SHARE_ERROR + 1e-12:
                          continue

                      a_keys = package_keys(assets_a)
                      b_keys = package_keys(assets_b)
                      sig = canonical_signature(a_keys, b_keys)

                      quality = (
                          pair_gap,
                          max(err_a, err_b),
                          max(share_err_a, share_err_b),
                          err_a + err_b,
                          share_err_a + share_err_b,
                          abs(((total_a + total_b) / 2.0) - goal),
                      )

                      record = {
                          "signature": sig,
                          "goal_total_fv": float(goal),
                          "side_a_keys": a_keys,
                          "side_b_keys": b_keys,
                          "side_a_raw_fv": float(total_a),
                          "side_b_raw_fv": float(total_b),
                          "pair_total_gap_pct": float(pair_gap),
                          "quality": quality,
                      }

                      prior = unique_candidates.get(sig)
                      if prior is None or quality < prior["quality"]:
                          unique_candidates[sig] = record

              if idx % 50 == 0 or idx == len(component_totals):
                  print(
                      f"candidate-enumeration progress: {idx}/{len(component_totals)} "
                      f"component targets; {len(unique_candidates)} unique full trades"
                  )

          g.SIDE_CANDIDATE_LIMIT = original_limit

          candidates = list(unique_candidates.values())
          if not candidates:
              raise RuntimeError("no unique full-trade candidates found")

          # Stable compact IDs and incidence sets.
          candidates.sort(
              key=lambda r: (
                  r["quality"],
                  r["signature"],
                  r["goal_total_fv"],
              )
          )
          for i, row in enumerate(candidates):
              row["id"] = i
              row["asset_keys"] = tuple(sorted(
                  set(row["side_a_keys"]) | set(row["side_b_keys"])
              ))
              row["side_packages"] = (
                  tuple(row["side_a_keys"]),
                  tuple(row["side_b_keys"]),
              )

          asset_candidate_count = Counter()
          side_a_top_assets = Counter()
          side_b_top_assets = Counter()
          side_package_candidate_count = Counter()

          for row in candidates:
              for key in row["asset_keys"]:
                  asset_candidate_count[key] += 1

              a_assets = sorted(
                  (player_lookup[k] for k in row["side_a_keys"]),
                  key=lambda p: (-float(p["fv"]), p["key"]),
              )
              b_assets = sorted(
                  (player_lookup[k] for k in row["side_b_keys"]),
                  key=lambda p: (-float(p["fv"]), p["key"]),
              )
              side_a_top_assets[a_assets[0]["key"]] += 1
              side_b_top_assets[b_assets[0]["key"]] += 1

              for pkg in row["side_packages"]:
                  side_package_candidate_count[pkg] += 1

          forced_assets = sorted(
              key for key, count in asset_candidate_count.items()
              if count == len(candidates)
          )

          def player_row(key, count):
              p = player_lookup[key]
              return {
                  "key": key,
                  "name": p["name"],
                  "pos": p["pos"],
                  "fv": float(p["fv"]),
                  "candidate_count": int(count),
                  "candidate_share": float(count) / len(candidates),
              }

          prevalence = [
              player_row(key, count)
              for key, count in asset_candidate_count.most_common(25)
          ]

          top_a = [
              player_row(key, count)
              for key, count in side_a_top_assets.most_common()
          ]
          top_b = [
              player_row(key, count)
              for key, count in side_b_top_assets.most_common()
          ]

          # ------------------------------------------------------------------
          # Exact mixed-integer optimization:
          # Select exactly five unique full-trade candidates.
          #
          # Primary objective: minimize maximum player appearance count.
          # Secondary objective: with that optimum fixed, maximize distinct
          # assets represented.
          # Also run a stricter variant forbidding exact side-package reuse.
          # ------------------------------------------------------------------
          all_assets = sorted(asset_candidate_count)

          incidence = {
              key: [row["id"] for row in candidates if key in row["asset_keys"]]
              for key in all_assets
          }

          package_to_candidates = defaultdict(list)
          for row in candidates:
              for pkg in row["side_packages"]:
                  package_to_candidates[pkg].append(row["id"])

          def solve_subset(forbid_side_reuse):
              model = pulp.LpProblem("filler_diversity_primary", pulp.LpMinimize)
              x = {
                  row["id"]: pulp.LpVariable(f"x_{row['id']}", 0, 1, cat="Binary")
                  for row in candidates
              }
              z = pulp.LpVariable("max_appearance", lowBound=0, upBound=5, cat="Integer")

              model += z
              model += pulp.lpSum(x.values()) == 5

              for key, ids in incidence.items():
                  model += pulp.lpSum(x[i] for i in ids) <= z

              if forbid_side_reuse:
                  for pkg, ids in package_to_candidates.items():
                      if len(ids) > 1:
                          model += pulp.lpSum(x[i] for i in ids) <= 1

              solver = pulp.PULP_CBC_CMD(msg=False, timeLimit=120)
              status = model.solve(solver)
              if pulp.LpStatus[status] != "Optimal":
                  return {
                      "status": pulp.LpStatus[status],
                      "optimal": False,
                  }

              z_star = int(round(pulp.value(z)))

              # Secondary solve: maximize number of distinct assets, holding
              # the proven minimum max-appearance fixed.
              model2 = pulp.LpProblem("filler_diversity_secondary", pulp.LpMaximize)
              x2 = {
                  row["id"]: pulp.LpVariable(f"x2_{row['id']}", 0, 1, cat="Binary")
                  for row in candidates
              }
              y = {
                  key: pulp.LpVariable(f"y_{key}", 0, 1, cat="Binary")
                  for key in all_assets
              }

              model2 += pulp.lpSum(y.values())
              model2 += pulp.lpSum(x2.values()) == 5

              for key, ids in incidence.items():
                  appearance = pulp.lpSum(x2[i] for i in ids)
                  model2 += appearance <= z_star
                  model2 += y[key] <= appearance
                  model2 += appearance <= 5 * y[key]

              if forbid_side_reuse:
                  for pkg, ids in package_to_candidates.items():
                      if len(ids) > 1:
                          model2 += pulp.lpSum(x2[i] for i in ids) <= 1

              status2 = model2.solve(
                  pulp.PULP_CBC_CMD(msg=False, timeLimit=120)
              )
              if pulp.LpStatus[status2] != "Optimal":
                  return {
                      "status": pulp.LpStatus[status2],
                      "optimal": False,
                      "primary_min_max_appearance": z_star,
                  }

              selected_ids = sorted(
                  i for i, var in x2.items()
                  if pulp.value(var) is not None and pulp.value(var) > 0.5
              )
              selected = [candidates[i] for i in selected_ids]

              appearances = Counter()
              side_counts = Counter()
              for row in selected:
                  appearances.update(row["asset_keys"])
                  for pkg in row["side_packages"]:
                      side_counts[pkg] += 1

              selected_rows = []
              for row in selected:
                  selected_rows.append({
                      "goal_total_fv": row["goal_total_fv"],
                      "side_a": [
                          {
                              "name": player_lookup[k]["name"],
                              "pos": player_lookup[k]["pos"],
                              "fv": float(player_lookup[k]["fv"]),
                          }
                          for k in row["side_a_keys"]
                      ],
                      "side_b": [
                          {
                              "name": player_lookup[k]["name"],
                              "pos": player_lookup[k]["pos"],
                              "fv": float(player_lookup[k]["fv"]),
                          }
                          for k in row["side_b_keys"]
                      ],
                      "pair_total_gap_pct": row["pair_total_gap_pct"],
                  })

              return {
                  "status": "Optimal",
                  "optimal": True,
                  "forbid_exact_side_package_reuse": bool(forbid_side_reuse),
                  "minimum_possible_max_player_appearance": z_star,
                  "distinct_assets_in_best_secondary_solution": len(appearances),
                  "exact_side_reuse_count": sum(
                      max(0, count - 1) for count in side_counts.values()
                  ),
                  "player_appearances": [
                      {
                          "name": player_lookup[k]["name"],
                          "key": k,
                          "fv": float(player_lookup[k]["fv"]),
                          "count": int(count),
                      }
                      for k, count in appearances.most_common()
                  ],
                  "selected_challenges": selected_rows,
              }

          unconstrained_solution = solve_subset(False)
          no_side_reuse_solution = solve_subset(True)

          report = {
              "status": "audit_complete",
              "mutates_repository": False,
              "scientific_tolerances_changed": False,
              "comparison": comparison_label,
              "candidate_search": {
                  "component_window_target_count": len(component_totals),
                  "side_candidate_limit": 96,
                  "unique_full_trade_signature_count": len(candidates),
                  "unique_asset_count_across_candidate_universe": len(asset_candidate_count),
                  "unique_side_a_top_asset_count": len(side_a_top_assets),
                  "unique_side_b_top_asset_count": len(side_b_top_assets),
                  "forced_asset_count": len(forced_assets),
                  "forced_assets": [
                      player_row(key, len(candidates)) for key in forced_assets
                  ],
                  "top_asset_prevalence": prevalence,
                  "side_a_top_asset_distribution": top_a,
                  "side_b_top_asset_distribution": top_b,
                  "unique_side_package_count": len(side_package_candidate_count),
              },
              "five_row_diversity_capacity": {
                  "unconstrained_side_reuse": unconstrained_solution,
                  "forbid_exact_side_reuse": no_side_reuse_solution,
              },
          }

          REPORT_PATH.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("=== NEXTGEN V2 FILLER DIVERSITY CAPACITY AUDIT ===")
          print(json.dumps(report, indent=2, sort_keys=True))
          print("=== END FILLER DIVERSITY CAPACITY AUDIT ===")

          assert catalog["frozen"] is False
          assert catalog["research_only"] is True
          assert REPORT_PATH.is_file()
          PY

      - name: Upload filler diversity capacity report
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-filler-diversity-capacity-audit
          path: /tmp/package-adjustment-nextgen-v2-filler-diversity-capacity-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove audit wrote nothing to repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          git diff --exit-code
          git diff --cached --exit-code
          echo "PASS: filler diversity capacity audit made no repository changes."

      - name: Revalidate production Package Adjustment after audit
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
