name: B12 Draft Class Strength V2 - Top-60 Stable-Era Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6_V3_RUN_ID: "36648176714"

jobs:
  preregister:
    name: B12 freeze V2 top-60 stable-era target and null
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B12 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard B11 result and V1 non-authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-class-strength-v1")
          m=json.loads((D/"b11_top60_manifest.json").read_text())
          r=json.loads((D/"b11_top60_result.json").read_text())

          assert m["decision"]=="STOP_B11_TOP60_MANUAL_IDENTITY_REVIEW_REMAINS_TOP60_V2_PREREGISTRATION_STILL_ALLOWED"
          for name,expected in m["output_hashes"].items():
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          assert r["top60_target_n"]==6
          assert r["top60_recovered_n"]==0
          assert r["top60_remaining_n"]==6
          assert r["projected_v1_total_unresolved_n"]==29
          assert r["v1_b9_rerun_authorized"] is False
          assert r["top60_v2_preregistration_authorized"] is True
          assert r["top60_v2_execution_authorized"] is False
          assert r["formal_stage_b_test_run"] is False
          assert r["2027_class_scored"] is False
          assert r["production_change_authorized"] is False

          print("PASS: V1 remains blocked; B11 explicitly authorizes V2 preregistration only.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: repository regression baseline."

      - name: Download exact B6 pre-outcome population source
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36648176714
          name: dcs-b6-preoutcome-source
          path: /tmp/b12-preoutcome

      - name: Build outcome-blind V2 cohort and completeness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT=Path.cwd()
          V1=ROOT/"research/draft-class-strength-v1"
          V2=ROOT/"research/draft-class-strength-v2"
          SRC=Path("/tmp/b12-preoutcome")
          V2.mkdir(parents=True,exist_ok=True)

          pop=json.loads((SRC/"population_source_gate.json").read_text())
          YEARS=list(range(2014,2024))
          POS={"QB","RB","WR","TE"}

          rows=[]
          for r in pop["players"]:
              y=int(r["draft_year"])
              p="RB" if r["position"]=="FB" else r["position"]
              pick=int(r["draft_pick"])
              if y not in YEARS or p not in POS or not (1<=pick<=60):
                  continue
              rows.append({
                  "draft_year":y,
                  "draft_round":int(r["draft_round"]),
                  "draft_pick":pick,
                  "stable_id":r["stable_id"],
                  "gsis_id":r.get("gsis_id"),
                  "pfr_id":r.get("pfr_id"),
                  "sleeper_id":r.get("sleeper_id"),
                  "name":r.get("name"),
                  "position":p,
                  "birth_date":r.get("birth_date"),
              })

          rows=sorted(rows,key=lambda r:(r["draft_year"],r["draft_pick"],r["stable_id"]))
          assert rows

          by_year=defaultdict(list)
          for r in rows: by_year[r["draft_year"]].append(r)
          assert sorted(by_year)==YEARS

          identity_missing=[]
          stable_seen=set()
          sleeper_seen={}
          dup_stable=[]
          dup_sleeper=[]
          for r in rows:
              if not r["stable_id"] or not r["gsis_id"] or not r["pfr_id"] or not r["sleeper_id"]:
                  identity_missing.append(r)
              if r["stable_id"] in stable_seen:
                  dup_stable.append(r["stable_id"])
              stable_seen.add(r["stable_id"])
              sid=str(r["sleeper_id"])
              if sid in sleeper_seen and sleeper_seen[sid]!=r["stable_id"]:
                  dup_sleeper.append({
                      "sleeper_id":sid,
                      "stable_ids":[sleeper_seen[sid],r["stable_id"]],
                  })
              sleeper_seen[sid]=r["stable_id"]

          class_summary={}
          for y in YEARS:
              rr=by_year[y]
              bins={
                  "1_10":sum(1 for r in rr if 1<=r["draft_pick"]<=10),
                  "11_20":sum(1 for r in rr if 11<=r["draft_pick"]<=20),
                  "21_30":sum(1 for r in rr if 21<=r["draft_pick"]<=30),
                  "31_40":sum(1 for r in rr if 31<=r["draft_pick"]<=40),
                  "41_50":sum(1 for r in rr if 41<=r["draft_pick"]<=50),
                  "51_60":sum(1 for r in rr if 51<=r["draft_pick"]<=60),
              }
              class_summary[str(y)]={
                  "n":len(rr),
                  "positions":dict(sorted(Counter(r["position"] for r in rr).items())),
                  "draft_bins":bins,
                  "all_identity_complete":all(
                      r["stable_id"] and r["gsis_id"] and r["pfr_id"] and r["sleeper_id"]
                      for r in rr
                  ),
              }

          canonical=json.dumps(rows,sort_keys=True,separators=(",",":")).encode()
          cohort_sha=hashlib.sha256(canonical).hexdigest()
          gate_pass=not identity_missing and not dup_stable and not dup_sleeper

          snapshot={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b12_top60_stable_era_cohort_snapshot",
              "population_source":{
                  "source":"exact B6 V3 pre-outcome population source artifact",
                  "run_id":36648176714,
                  "artifact":"dcs-b6-preoutcome-source",
                  "file":"population_source_gate.json",
              },
              "population_rule":{
                  "years":YEARS,
                  "positions":["QB","RB","WR","TE"],
                  "fb_normalized_to":"RB",
                  "nfl_overall_pick_min":1,
                  "nfl_overall_pick_max":60,
                  "include_every_eligible_player":True,
                  "outcome_sorting":False,
                  "career_status_filter":False,
                  "retirement_filter":False,
                  "backfill":False,
              },
              "class_n":len(YEARS),
              "player_n":len(rows),
              "class_summary":class_summary,
              "identity_requirement":"100% stable_id + GSIS + PFR + Sleeper before any V2 outcome execution",
              "identity_missing_n":len(identity_missing),
              "identity_missing":identity_missing,
              "duplicate_stable_id_n":len(dup_stable),
              "duplicate_stable_ids":dup_stable,
              "duplicate_sleeper_collision_n":len(dup_sleeper),
              "duplicate_sleeper_collisions":dup_sleeper,
              "source_gate_pass":gate_pass,
              "cohort_sha256":cohort_sha,
              "cohort":rows,
              "outcomes_opened_by_b12":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }
          (V2/"b12_top60_stable_era_cohort_snapshot.json").write_text(
              json.dumps(snapshot,indent=2,sort_keys=True)+"\n"
          )

          if not gate_pass:
              raise SystemExit(
                  f"STOP_B12_SOURCE_GATE: missing={len(identity_missing)} "
                  f"dup_stable={len(dup_stable)} dup_sleeper={len(dup_sleeper)}"
              )

          print(f"PASS: B12 pre-outcome cohort complete: {len(rows)} players across 10 classes.")
          for y in YEARS:
              print(y,class_summary[str(y)])
          print("cohort_sha256",cohort_sha)
          PY

      - name: Freeze V2 scientific preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          V2=Path("research/draft-class-strength-v2")
          snap=json.loads((V2/"b12_top60_stable_era_cohort_snapshot.json").read_text())
          assert snap["source_gate_pass"] is True
          assert snap["class_n"]==10
          assert snap["identity_missing_n"]==0
          assert snap["duplicate_stable_id_n"]==0
          assert snap["duplicate_sleeper_collision_n"]==0

          contract={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b12_top60_stable_era_preregistration",
              "status":"FROZEN_BEFORE_V2_OUTCOME_EXECUTION",

              "scientific_status":{
                  "v2_is_new_post_v1_architecture":True,
                  "independent_confirmatory_test":False,
                  "post_hoc_architecture_reason":[
                      "V1 fixed-48 design was blocked by historical Sleeper identity coverage concentrated in 2010-2013.",
                      "User froze further identity-recovery effort to NFL top-60 picks.",
                      "B11 found no independent Sleeper-ID chain for the six unresolved top-60 retirees.",
                      "V2 therefore uses the stable-provider era 2014-2023 and a top-60 NFL-draft-capital population."
                  ],
                  "v1_result_may_not_be_reinterpreted_as_pass":True,
                  "b12_may_not_score_2027":True,
                  "b12_may_not_change_production":True,
              },

              "population":{
                  "years":list(range(2014,2024)),
                  "class_n":10,
                  "positions":["QB","RB","WR","TE"],
                  "fb_normalized_to":"RB",
                  "nfl_overall_pick_range":[1,60],
                  "include_all_eligible_players":True,
                  "career_status_filter_forbidden":True,
                  "retirement_filter_forbidden":True,
                  "outcome_sorting_forbidden":True,
                  "backfill_forbidden":True,
                  "cohort_sha256":snap["cohort_sha256"],
                  "player_n":snap["player_n"],
                  "identity_coverage_required":1.0,
                  "unresolved_players_allowed":0,
              },

              "outcome":{
                  "name":"H3.O2",
                  "definition":"Exact frozen B5/B6 H3.O2 three-season player-equivalent FV outcome.",
                  "provider":"Frozen Sleeper historical weekly NFL stats lineage already used by V1.",
                  "formula_changes_forbidden":True,
                  "position_weights_changes_forbidden":True,
                  "replacement_rank_changes_forbidden":True,
                  "age_curve_changes_forbidden":True,
                  "zero_production_rule_changes_forbidden":True,
              },

              "draft_capital_bins":{
                  "primary_bins":[[1,10],[11,20],[21,30],[31,40],[41,50],[51,60]],
                  "determined_from":"NFL overall draft pick only",
                  "outcome_independent":True,
                  "bin_changes_after_b12_forbidden":True,
              },

              "primary_class_score":{
                  "purpose":"Measure realized class quality relative to the amount and location of NFL top-60 draft capital invested in fantasy skill positions.",
                  "expected_player_value":{
                      "method":"leave-one-class-out arithmetic mean H3.O2 within the player's fixed 10-pick NFL draft-capital bin",
                      "position_conditioning":False,
                      "reason":"H3.O2 is already position-weighted/replacement-adjusted; avoiding position x bin sparsity preserves power.",
                  },
                  "expected_class_total":"sum the leave-one-class-out expected H3.O2 values for every fixed cohort player in that class",
                  "observed_class_total":"sum H3.O2 for every fixed cohort player in that class",
                  "class_log_strength":"ln(observed_class_total / expected_class_total)",
                  "primary_observed_statistic":"sample variance across the 10 class_log_strength values",
                  "free_class_level_slope_forbidden":True,
                  "outcome_based_player_selection_forbidden":True,
              },

              "primary_null":{
                  "name":"draft-capital-bin-preserving class-label permutation",
                  "permutations":50000,
                  "seed":20261006,
                  "algorithm":[
                      "Keep each class's exact number of cohort slots in every frozen 10-pick draft-capital bin.",
                      "Within each draft-capital bin, randomly permute the observed H3.O2 values across the fixed class/bin slots.",
                      "Recompute LOO expected totals, class log strengths, and the sample variance for each permutation."
                  ],
                  "one_sided_p":"(1 + count(null_variance >= observed_variance)) / (1 + permutations)",
                  "null_mean_variance":"arithmetic mean of the 50,000 null sample variances",
                  "excess_class_variance_ratio":"max(0, 1 - null_mean_variance / observed_variance)",
                  "position_or_outcome_based_reassignment_forbidden":True,
              },

              "bootstrap":{
                  "replicates":10000,
                  "seed":20261007,
                  "method":"resample whole players with replacement within each class x fixed draft-capital bin; preserve each class's observed bin counts; recompute class score and excess ratio",
                  "report_intervals":[0.80,0.95],
                  "primary_lower_bound":"80% bootstrap lower bound of excess_class_variance_ratio",
              },

              "formal_gate":{
                  "minimum_complete_classes":10,
                  "p_value_lt":0.10,
                  "excess_class_variance_ratio_gte":0.30,
                  "bootstrap_80_lower_gt":0.0,
                  "all_required":True,
                  "bridge_required":False,
              },

              "continuity_diagnostics_non_gating":{
                  "b6_option_d_2014_2023_correlation":{
                      "metrics":["Spearman","Pearson","sign agreement"],
                      "purpose":"plumbing/continuity diagnostic only",
                      "cannot_rescue_or_fail_primary_gate":True,
                  },
                  "position_preserving_null":{
                      "method":"secondary null preserving position plus broad NFL draft-capital bin when feasible",
                      "gating":False,
                  },
                  "leave_one_class_out_influence":{
                      "report_all_years":True,
                      "special_report_year":2017,
                      "gating":False,
                  },
                  "class_size_vs_score":{
                      "metrics":["Pearson","Spearman"],
                      "gating":False,
                  },
                  "qb_vs_non_qb":{
                      "gating":False,
                  },
              },

              "power":{
                  "seed":20261008,
                  "effect_sd_grid":[0.0,0.03,0.05,0.08,0.12],
                  "simulations_per_grid":2000,
                  "economic_reference_effect_sd":0.08,
                  "adequate_power_threshold":0.80,
                  "report":[
                      "all-gate power at each effect SD",
                      "false-pass rate at SD=0",
                      "grid-based MDE reaching >=80% all-gate power"
                  ],
                  "cannot_rescue_primary_failure":True,
              },

              "decision_policy":{
                  "pass":"PASS_B13_V2_TARGET_GATE_AUTHORIZE_PREDICTOR_SOURCE_FEASIBILITY_ONLY",
                  "fail_adequately_powered":"STOP_B13_V2_TARGET_NEGATIVE_NEUTRAL_1_00",
                  "fail_underpowered":"STOP_B13_V2_TARGET_UNDERPOWERED_NEUTRAL_1_00",
                  "production_authorized_on_pass":False,
                  "2027_scoring_authorized_on_pass":False,
                  "predictor_fitting_authorized_on_pass":False,
                  "predictor_source_feasibility_authorized_on_pass":True,
                  "reason":"B12/B13 V2 is a post-V1 architecture and cannot by itself justify production."
              },

              "finality":{
                  "after_b13_result_no_changes_allowed_to":[
                      "2014-2023 year window",
                      "NFL top-60 cutoff",
                      "QB/RB/WR/TE population",
                      "H3.O2 definition",
                      "10-pick draft-capital bins",
                      "primary class score",
                      "primary null",
                      "formal gate thresholds"
                  ],
                  "new_target_or_null_after_failure_forbidden":True,
              },

              "outcomes_opened_by_b12":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }

          (V2/"b12_top60_stable_era_preregistration.json").write_text(
              json.dumps(contract,indent=2,sort_keys=True)+"\n"
          )

          execution={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b12_b13_execution_contract",
              "preregistration_file":"b12_top60_stable_era_preregistration.json",
              "cohort_file":"b12_top60_stable_era_cohort_snapshot.json",
              "b13_must_hash_guard_both_inputs":True,
              "b13_must_reconstruct_exact_frozen_h3_o2":True,
              "b13_must_run_primary_before_non_gating_diagnostics":True,
              "b13_must_freeze_primary_verdict_before_power_or_diagnostics":True,
              "b13_may_not_modify_target_or_null":True,
              "b13_may_not_score_2027":True,
              "b13_may_not_change_production":True,
              "production_change_authorized":False,
          }
          (V2/"b12_b13_execution_contract.json").write_text(
              json.dumps(execution,indent=2,sort_keys=True)+"\n"
          )

          report=f"""# Draft Class Strength V2 — B12 Top-60 Stable-Era Preregistration
          
          ## Status
          
          B12 freezes a new V2 architecture before V2 outcome execution.
          
          This is **not** an independent confirmatory test. It follows the V1 identity-coverage failure and the user-frozen decision to stop spending research effort on lower-draft-capital retired players.
          
          ## Population
          
          - Seasons: 2014–2023
          - Positions: QB/RB/WR/TE (FB→RB)
          - NFL overall picks: 1–60 inclusive
          - Include every eligible player
          - No career-status or retirement filtering
          - No outcome sorting or backfill
          - Cohort SHA256: `{snap["cohort_sha256"]}`
          - Players: {snap["player_n"]}
          - Identity coverage: 100%
          
          ## Primary target
          
          For each class, sum frozen H3.O2 across the full top-60 skill-position cohort. Normalize that observed total by a leave-one-class-out expected total based only on six fixed NFL draft-capital bins: 1–10, 11–20, 21–30, 31–40, 41–50, 51–60.
          
          Class score = ln(observed total / expected total).
          
          ## Primary null
          
          50,000 permutations, seed 20261006. H3.O2 values are shuffled only within the six fixed NFL draft-capital bins while each class's exact bin-count skeleton is preserved.
          
          ## Gate
          
          All required:
          
          - p < 0.10
          - excess class variance ratio >= 0.30
          - 80% bootstrap lower bound > 0
          - all 10 classes complete
          
          Passing B13 authorizes predictor-source feasibility only. It does not authorize production or 2027 scoring.
          """
          (V2/"b12_top60_stable_era_preregistration_report.md").write_text(report)
          print("PASS: B12 V2 scientific contract frozen before outcome execution.")
          PY

      - name: Freeze B12 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          V2=Path("research/draft-class-strength-v2")
          names=[
              "b12_top60_stable_era_cohort_snapshot.json",
              "b12_top60_stable_era_preregistration.json",
              "b12_b13_execution_contract.json",
              "b12_top60_stable_era_preregistration_report.md",
          ]
          for n in names:
              assert (V2/n).is_file(),n

          p=json.loads((V2/"b12_top60_stable_era_preregistration.json").read_text())
          s=json.loads((V2/"b12_top60_stable_era_cohort_snapshot.json").read_text())
          e=json.loads((V2/"b12_b13_execution_contract.json").read_text())

          assert s["source_gate_pass"] is True
          assert s["class_n"]==10
          assert s["identity_missing_n"]==0
          assert p["population"]["years"]==list(range(2014,2024))
          assert p["population"]["nfl_overall_pick_range"]==[1,60]
          assert p["formal_gate"]["p_value_lt"]==0.10
          assert p["formal_gate"]["excess_class_variance_ratio_gte"]==0.30
          assert p["formal_gate"]["bootstrap_80_lower_gt"]==0.0
          assert p["primary_null"]["permutations"]==50000
          assert p["primary_null"]["seed"]==20261006
          assert p["bootstrap"]["replicates"]==10000
          assert p["bootstrap"]["seed"]==20261007
          assert p["scientific_status"]["independent_confirmatory_test"] is False
          assert p["decision_policy"]["production_authorized_on_pass"] is False
          assert p["decision_policy"]["2027_scoring_authorized_on_pass"] is False
          assert p["outcomes_opened_by_b12"] is False
          assert p["predictor_fit_performed"] is False
          assert p["2027_class_scored"] is False
          assert p["production_change_authorized"] is False
          assert e["b13_may_not_modify_target_or_null"] is True

          m={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b12_manifest",
              "decision":"PASS_B12_V2_TOP60_STABLE_ERA_PREREGISTRATION_FROZEN_B13_EXECUTION_NEXT",
              "output_hashes":{
                  n:hashlib.sha256((V2/n).read_bytes()).hexdigest()
                  for n in names
              },
              "cohort_sha256":s["cohort_sha256"],
              "player_n":s["player_n"],
              "class_n":10,
              "b13_execution_authorized":True,
              "predictor_source_feasibility_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }
          (V2/"b12_manifest.json").write_text(json.dumps(m,indent=2,sort_keys=True)+"\n")

          print(json.dumps(m,indent=2))
          PY

      - name: Run post-preregistration repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          echo "PASS: post-B12 repository regression."

      - name: Prove B12 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(p.startswith("research/draft-class-strength-v2/b12_") for p in touched),touched
          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B12 mutation scope is research-only.")
          PY

      - name: Commit frozen B12 preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B12."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-class-strength-v2/b12_top60_stable_era_cohort_snapshot.json \
            research/draft-class-strength-v2/b12_top60_stable_era_preregistration.json \
            research/draft-class-strength-v2/b12_b13_execution_contract.json \
            research/draft-class-strength-v2/b12_top60_stable_era_preregistration_report.md \
            research/draft-class-strength-v2/b12_manifest.json

          git commit -m "Preregister Draft Class Strength V2 top-60 stable-era target"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: B12 preregistration committed."
