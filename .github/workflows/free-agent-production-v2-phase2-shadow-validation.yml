      - name: Prove production firewall and exact research-only diff
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          sha256sum -c "${RUNNER_TEMP}/phase2-production-baseline.sha256"

          expected=(
            research/free-agent-production-v2/phase2_preregistration.json
            research/free-agent-production-v2/phase2_preregistration.md
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.py
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.json
            research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.md
            research/free-agent-production-v2/phase2_manifest.json
          )

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/free-agent-production-v2/phase2_preregistration.json",
              "research/free-agent-production-v2/phase2_preregistration.md",
              "research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.py",
              "research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.json",
              "research/free-agent-production-v2/free_agent_production_v2_phase2_shadow.md",
              "research/free-agent-production-v2/phase2_manifest.json",
          }

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          actual = set()
          for line in raw.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  "Phase 2 research-only diff mismatch.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(actual)}"
              )
          print("PASS: exactly six Phase 2 research artifacts changed.")
          PY

