      - name: Validate all records and verified Sleeper identity resolution
        shell: bash
        run: |
          python3 -m py_compile scripts/utilities/build_idp_usage_snapshot.py
          python3 scripts/utilities/build_idp_usage_snapshot.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/idp_usage_2026_season.json').read_text())
          assert d['schema_version']==1 and d['counts']['players']==436
          assert d['counts']['positions']=={'LB':75,'S':85,'CB':92,'ED':91,'DI':93} or d['counts']['positions']=={'LB':75,'ED':91,'DI':93,'S':85,'CB':92}
          assert sum(x['tackle_rate_pct'] is None for x in d['players'])==8
          assert all(x['defensive_snaps']>=200 for x in d['players'])
          # Data integrity: no accidental model/pricing writes.
          assert d['policy']=='READ_ONLY_RESEARCH_NOT_FV_OR_PROJECTION'
          md=Path('research/idp-opportunity/source/2026-11-09-idp-season-usage.csv')
          assert md.exists() and len(md.read_bytes())>20000
          Path('/tmp/idp_audit.txt').write_text(
              'Players: '+str(d['counts']['players'])+'\n'+
              'Identity statuses: '+str(d['counts']['identity_status'])+'\n'+
              'Median rates: '+str({k:v['median_tackle_rate_pct'] for k,v in d['baseline'].items()})+'\n')
          PY
      - name: Preview only intended file changes
        shell: bash
        run: |
          git add -N -- scripts/utilities/build_idp_usage_snapshot.py research/idp-opportunity/source/2026-11-09-idp-season-usage.csv data/idp_usage_2026_season.json
          # The owner CSV was provided with CRLF line endings. Preserve its exact bytes.
          # Accept CR-at-EOL without disabling detection of real trailing spaces/tabs.
          git -c core.whitespace=cr-at-eol diff --check
          git diff --stat -- scripts/utilities/build_idp_usage_snapshot.py research/idp-opportunity/source/2026-11-09-idp-season-usage.csv data/idp_usage_2026_season.json
          cat /tmp/idp_audit.txt
          echo 'A-FA04R2 preview complete. No files committed unless Apply was selected.'
      - name: Apply - commit only vetted source, importer and season JSON
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          git add -- research/idp-opportunity/source/2026-11-09-idp-season-usage.csv scripts/utilities/build_idp_usage_snapshot.py data/idp_usage_2026_season.json
          # Same CRLF-safe check for the staged Apply diff; source bytes remain unchanged.
          git -c core.whitespace=cr-at-eol diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-FA04R2: add source-pinned 2026 season IDP research data (no FV changes)'
          git push origin HEAD:main
