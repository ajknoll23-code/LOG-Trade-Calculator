                  "M0_predicted_choice_probability_computed": False,
                  "M2b_minus_M0_score_gap_computed": False,
                  "statistical_significance_used": False,
                  "production_modified": False,
              },
              "challenges": challenges,
          }
          OUT_CATALOG.write_text(json.dumps(catalog, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          md = f"""# Package Adjustment NextGen V2 — Prospective Catalog V1\n\n**Status: FROZEN PROSPECTIVE RESEARCH CATALOG — NOT YET ACTIVATED.**\n\n- Preregistration freeze commit: `{EXPECTED_PREREG_COMMIT}`\n- Generation seed: `{SEED}`\n- Fresh challenges: `{len(challenges)}`\n- Evaluation cells: `{len(cell_counts)}`\n- Family counts: `{dict(sorted(family_counts.items()))}`\n- Scale counts: `{dict(sorted(scale_counts.items()))}`\n- Fresh source-FV snapshot SHA-256: `{snapshot_sha}`\n- Exact first-wave trade overlap: `0`\n- Unique assets used: `{len(appearance)}`\n- Maximum player appearances: `{max(appearance.values())}` (cap `{MAX_APPEARANCE}`)\n- Fit-eligible challenges: `0`\n- All sides contain at least two player assets.\n- Frozen M2b was used only as a mathematical support/domain gate. No prediction magnitude, M0/M2b advantage, vote outcome, holdout outcome, or significance statistic was used to select challenges.\n- Production V1.6 is unchanged.\n- Prospective voting remains inactive; activation requires the separate preregistered workflow step.\n\n## Realized scale anchors\n\n### Core 2v2\n`{json.dumps(plan_summary(core_plans), sort_keys=True)}`\n\n### Fragmentation\n`{json.dumps(plan_summary(frag_plans), sort_keys=True)}`\n\n### Structural topology 3v3\n`{json.dumps(plan_summary(topology_plans), sort_keys=True)}`\n"""
          OUT_MD.write_text(md, encoding="utf-8")

          manifest = {
              "schema_version": 1,
