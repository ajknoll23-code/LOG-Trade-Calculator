      - name: Validate exact frozen outputs and file isolation
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          python3 - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          manifest = json.loads((d / "prospective_catalog_freeze_manifest_v1.json").read_text())
          catalog = json.loads((d / "package_vote_challenges_prospective_v1.json").read_text())
          prereg = json.loads((d / "prospective_time_holdout_preregistration_v1.json").read_text())
          first = json.loads((d / "package_vote_challenges_nextgen_v2.json").read_text())

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def sig(c):
              a = tuple(sorted(str(x["key"]) for x in c["side_a"]["assets"]))
              b = tuple(sorted(str(x["key"]) for x in c["side_b"]["assets"]))
              return tuple(sorted((a, b)))

          assert manifest["status"] == "frozen_prospective_catalog_v1_manifest"
          assert manifest["frozen"] is True
          assert manifest["challenge_count"] == 129
          assert manifest["evaluation_cell_count"] == 24
          assert manifest["first_wave_exact_trade_overlap_count"] == 0
          assert manifest["prospective_voting_activated"] is False
          assert manifest["outcomes_used_for_generation"] is False
          assert manifest["model_advantage_used_for_generation"] is False
          assert manifest["production_change_authorized"] is False
          assert manifest["automatic_production_promotion_allowed"] is False
          for item in manifest["artifacts"].values():
              assert sha(item["path"]) == item["sha256"]

          assert catalog["status"] == "frozen_prospective_research_catalog_v1"
          assert catalog["frozen"] is True
          assert catalog["catalog_id"] == prereg["fresh_prospective_catalog_contract"]["catalog_id"]
          assert len(catalog["challenges"]) == 129
          assert Counter(x["family"] for x in catalog["challenges"]) == Counter({
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          })
          assert Counter(x["scale_label"] for x in catalog["challenges"]) == Counter({
              "low": 43, "mid": 43, "high": 43,
          })
          assert all(x["fit_eligible"] is False for x in catalog["challenges"])
          assert all(x["evaluation_only"] is True for x in catalog["challenges"])
          assert all(x["side_a"]["asset_count"] >= 2 and x["side_b"]["asset_count"] >= 2 for x in catalog["challenges"])
          ps = {sig(x) for x in catalog["challenges"]}
          fs = {sig(x) for x in first["challenges"]}
          assert len(ps) == 129
          assert not (ps & fs)
          print("PASS: frozen prospective catalog satisfies the preregistered structural contract.")
          PY

          mapfile -t changed < <(git status --porcelain=v1 | awk '{print $2}' | sort)
          expected=(
            "$D/package_vote_challenges_prospective_v1.json"
            "$D/prospective_catalog_design_v1.md"
            "$D/prospective_catalog_freeze_manifest_v1.json"
            "$D/prospective_source_fv_snapshot_v1.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo "PASS: generation changed exactly the four intended research files."

      - name: Run full repository regressions before commit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Commit exactly the frozen prospective catalog
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"
          files=(
            "$D/package_vote_challenges_prospective_v1.json"
            "$D/prospective_catalog_design_v1.md"
            "$D/prospective_catalog_freeze_manifest_v1.json"
            "$D/prospective_source_fv_snapshot_v1.json"
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"

          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${files[@]}" | sort)
          test "${#staged[@]}" -eq 4
          test "$(printf '%s\n' "${staged[@]}")" = "$(printf '%s\n' "${expected[@]}")"

          git commit -m "Freeze NextGen V2 prospective catalog v1"
          git push origin HEAD:main

      - name: Verify freeze commit and production boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"

          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          expected="$(printf '%s\n' \
            'research/package-adjustment-nextgen-v2/package_vote_challenges_prospective_v1.json' \
            'research/package-adjustment-nextgen-v2/prospective_catalog_design_v1.md' \
            'research/package-adjustment-nextgen-v2/prospective_catalog_freeze_manifest_v1.json' \
            'research/package-adjustment-nextgen-v2/prospective_source_fv_snapshot_v1.json' | sort)"
          test "$changed" = "$expected"

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: prospective catalog frozen; voting still inactive; production V1.6 unchanged."
