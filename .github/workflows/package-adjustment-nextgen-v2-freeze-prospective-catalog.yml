              },
              "first_wave_exclusion": {
                  "catalog_path": FIRST_WAVE.relative_to(ROOT).as_posix(),
                  "catalog_sha256": sha256(FIRST_WAVE),
                  "first_wave_trade_signature_count": len(first_wave_sigs),
                  "prospective_trade_signature_count": len(prospective_sigs),
                  "exact_trade_signature_overlap_count": 0,
              },
              "candidate_domain_gate": {
                  "rule": prereg["fresh_prospective_catalog_contract"]["candidate_domain_gate_rule"],
                  "v_ref": v_ref,
                  "inverse_domain_max_normalized": inverse_domain_max,
                  "maximum_supported_asset_fv": domain_max_fv,
                  "prediction_magnitude_used_for_selection": False,
                  "model_advantage_used_for_selection": False,
              },
              "transport_reserved_not_activated": {
                  "vote_prefix": prereg["prospective_transport_and_sampling_contract"]["vote_prefix"],
                  "meta_prefix": prereg["prospective_transport_and_sampling_contract"]["meta_prefix"],
                  "schema_marker": prereg["prospective_transport_and_sampling_contract"]["schema_marker"],
              },
              "design": {
                  "all_player_assets_only": True,
                  "draft_picks_allowed": False,
                  "all_multi_piece_vs_multi_piece": True,
                  "values_hidden_from_voter": True,
                  "display_side_randomization_required_at_activation": True,
                  "maximum_player_appearance": MAX_APPEARANCE,
                  "realized_max_player_appearance": max(appearance.values()),
                  "scale_anchor_targets_raw_fv": TARGET_ANCHORS,
                  "core_scale_plan": plan_summary(core_plans),
                  "fragmentation_scale_plan": plan_summary(frag_plans),
                  "topology_scale_plan": plan_summary(topology_plans),
                  "construction_tolerances": {
                      "max_side_target_error": gen.MAX_SIDE_TARGET_ERROR,
