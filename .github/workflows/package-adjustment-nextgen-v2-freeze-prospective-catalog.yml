name: Package Adjustment NextGen V2 Freeze Prospective Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-freeze-prospective-catalog
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact trigger and clean tree
        env:
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test -z "$(git status --porcelain=v1)"
          echo "PASS: exact trigger commit checked out cleanly."

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install exact validation environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy==2.5.3" "scipy==1.18.1" "requests"
          python3 - <<'PY'
          import platform, numpy, scipy
          assert platform.python_version() == "3.13.15"
          assert numpy.__version__ == "2.5.3"
          assert scipy.__version__ == "1.18.1"
          print("PASS: exact Python/numpy/scipy environment available.")
          PY

      - name: Run frozen base generator self-test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3             research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py             --selftest

      - name: Guard frozen preregistration and pre-activation boundary
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          git merge-base --is-ancestor 0c20c3eb5bce74decfbb2c0ee62e38c4f3b3d3db HEAD
          git merge-base --is-ancestor 89384a03ff26faf1a67dd6dbaa9a9e4e23cd4b9b HEAD

          test "$(sha256sum "$D/prospective_time_holdout_preregistration_v1.json" | awk '{print $1}')" = \
            "f29be9b1e73d1d6ec1d9a365fb29a0458334d75a36be64694adfcc4eeb78bfd6"
          test "$(sha256sum "$D/prospective_time_holdout_preregistration_v1.md" | awk '{print $1}')" = \
            "934fdfaa767281eb4222a778d2231162a0273c4ce20e18e217a1170861176288"
          test "$(git hash-object "$D/prospective_time_holdout_preregistration_v1_manifest.json")" = \
            "330e268aa717712198f4398aefe08445f804a3c2"

          test ! -e "$D/prospective_source_fv_snapshot_v1.json"
          test ! -e "$D/package_vote_challenges_prospective_v1.json"
          test ! -e "$D/prospective_catalog_design_v1.md"
          test ! -e "$D/prospective_catalog_freeze_manifest_v1.json"

          # The prospective transport must not be active yet. The preregistration
          # and its freeze workflow may mention the reserved namespace, but live
          # browser / transport code may not.
          ! grep -Fq '__pkgnv2p1__|' index.html
          ! grep -Fq '__pkgnv2p1__|' scripts/market/ktc_pipeline.py
          ! grep -Fq '__pkgnv2p1_meta__|' index.html
          ! grep -Fq '__pkgnv2p1_meta__|' scripts/market/ktc_pipeline.py

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: preregistration frozen, prospective voting inactive, production unchanged."

      - name: Build and freeze fresh prospective catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import math
          import subprocess
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          D = ROOT / "research" / "package-adjustment-nextgen-v2"
          PREREG = D / "prospective_time_holdout_preregistration_v1.json"
          FIRST_WAVE = D / "package_vote_challenges_nextgen_v2.json"
          GEN_PATH = D / "generate_package_vote_challenges_nextgen_v2.py"
          VALUES = ROOT / "scripts" / "artifacts" / "generated" / "value_uncertainty.json"
          ROSTERS = ROOT / "data" / "league_rosters.json"
          PROMOTION = ROOT / "research" / "package-adjustment-v5" / "controlled_live_v1_6_promotion.json"
          WORKFLOW = ROOT / ".github" / "workflows" / "package-adjustment-nextgen-v2-freeze-prospective-catalog.yml"

          OUT_SNAPSHOT = D / "prospective_source_fv_snapshot_v1.json"
          OUT_CATALOG = D / "package_vote_challenges_prospective_v1.json"
          OUT_MD = D / "prospective_catalog_design_v1.md"
          OUT_MANIFEST = D / "prospective_catalog_freeze_manifest_v1.json"

          EXPECTED_PREREG_SHA = "f29be9b1e73d1d6ec1d9a365fb29a0458334d75a36be64694adfcc4eeb78bfd6"
          EXPECTED_PREREG_COMMIT = "0c20c3eb5bce74decfbb2c0ee62e38c4f3b3d3db"
          EXPECTED_PROD_SHA = "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7"
          SEED = 20260912
          TARGET_ANCHORS = {"low": 3940.0, "mid": 4740.0, "high": 5700.0}
          MAX_APPEARANCE = 11

          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def stable_rank(*parts) -> str:
              text = "|".join(str(x) for x in (SEED, *parts))
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          def git(*args: str) -> str:
              proc = subprocess.run(
                  ["git", *args], text=True, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, check=False,
              )
              if proc.returncode:
                  raise RuntimeError(f"git {' '.join(args)} failed: {proc.stderr.strip()}")
              return proc.stdout.strip()

          assert sha256(PREREG) == EXPECTED_PREREG_SHA
          assert subprocess.run(
              ["git", "merge-base", "--is-ancestor", EXPECTED_PREREG_COMMIT, "HEAD"]
          ).returncode == 0

          prereg = read_json(PREREG)
          first_wave = read_json(FIRST_WAVE)
          promotion = read_json(PROMOTION)

          assert prereg["status"] == "frozen_prospective_time_holdout_preregistration"
          assert prereg["frozen"] is True
          assert prereg["preregistered_before_prospective_catalog_generation"] is True
          assert prereg["preregistered_before_prospective_voting_activation"] is True
          assert prereg["fresh_prospective_catalog_contract"]["catalog_id"] == "pkgnv2-prospective-catalog-v1"
          assert prereg["fresh_prospective_catalog_contract"]["challenge_count"] == 129
          assert prereg["fresh_prospective_catalog_contract"]["evaluation_cell_count"] == 24
          assert prereg["fresh_prospective_catalog_contract"]["generation_seed"] == SEED
          assert prereg["fresh_prospective_catalog_contract"]["maximum_player_appearance"] == MAX_APPEARANCE
          assert prereg["fresh_prospective_catalog_contract"]["scale_anchor_targets_raw_fv"] == TARGET_ANCHORS
          assert prereg["fresh_prospective_catalog_contract"]["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert prereg["fresh_prospective_catalog_contract"]["scale_counts"] == {
              "high": 43, "low": 43, "mid": 43
          }
          assert prereg["fresh_prospective_catalog_contract"]["fit_eligible_challenges"] == 0
          assert prereg["fresh_prospective_catalog_contract"]["draft_picks_allowed"] is False
          assert prereg["fresh_prospective_catalog_contract"]["player_assets_only"] is True
          assert prereg["fresh_prospective_catalog_contract"]["exact_trade_signature_overlap_with_first_wave_catalog_allowed"] is False
          assert prereg["fresh_prospective_catalog_contract"]["duplicate_trade_signatures_within_prospective_catalog_allowed"] is False
          assert prereg["fresh_prospective_catalog_contract"]["values_visible_to_voter"] is False
          assert prereg["fresh_prospective_catalog_contract"]["all_challenges_evaluation_only"] is True
          assert prereg["fresh_prospective_catalog_contract"]["all_challenges_multi_piece_vs_multi_piece"] is True
          assert prereg["production_change_authorized"] is False
          assert prereg["automatic_production_promotion_allowed"] is False

          assert promotion["production_revision"] == "v1.6-v5-size2-composition-overlay"
          assert promotion["exact_live_formula_sha256"] == EXPECTED_PROD_SHA
          assert promotion["automatic_future_production_change_allowed"] is False
          assert first_wave["frozen"] is True
          assert len(first_wave["challenges"]) == 129

          spec = importlib.util.spec_from_file_location("pkgnv2_generator", GEN_PATH)
          gen = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(gen)

          values_doc = read_json(VALUES)
          rosters_doc = read_json(ROSTERS)
          all_players, unresolved, pos_counts = gen.build_player_universe(values_doc, rosters_doc)

          # Frozen M2b domain is used only as a binary support gate. Prediction
          # magnitudes and M2b-vs-M0 differences are never computed here.
          m2b = prereg["frozen_prediction_models"]["M2b"]
          v_ref = float(m2b["v_ref"])
          inverse_domain_max = float(m2b["inverse_domain_max_normalized"])
          domain_max_fv = v_ref * inverse_domain_max
          players = [p for p in all_players if float(p["fv"]) / v_ref <= inverse_domain_max + 1e-12]
          domain_excluded = [p for p in all_players if p not in players]
          if len(players) < 350:
              raise RuntimeError(f"too few domain-valid eligible players: {len(players)}")

          snapshot_time = datetime.now(timezone.utc).isoformat()
          snapshot = {
              "schema_version": 1,
              "status": "frozen_prospective_source_fv_snapshot",
              "frozen": True,
              "catalog_id": "pkgnv2-prospective-catalog-v1",
              "snapshot_taken_at_utc": snapshot_time,
              "snapshot_taken_after_preregistration_freeze": True,
              "preregistration_freeze_commit": EXPECTED_PREREG_COMMIT,
              "preregistration_sha256": EXPECTED_PREREG_SHA,
              "source_files": {
                  "value_uncertainty": {
                      "path": VALUES.relative_to(ROOT).as_posix(),
                      "sha256": sha256(VALUES),
                      "source_generated_at_utc": values_doc.get("generated_at_utc"),
                  },
                  "league_rosters": {
                      "path": ROSTERS.relative_to(ROOT).as_posix(),
                      "sha256": sha256(ROSTERS),
                  },
              },
              "eligibility": {
                  "definition": "rostered positive-FV non-kicker players resolved by frozen NextGen generator eligibility logic",
                  "eligible_before_candidate_domain_gate": len(all_players),
                  "candidate_domain_gate_only": True,
                  "candidate_domain_max_normalized": inverse_domain_max,
                  "candidate_v_ref": v_ref,
                  "candidate_domain_max_fv": domain_max_fv,
                  "excluded_by_candidate_domain_gate": len(domain_excluded),
                  "eligible_after_candidate_domain_gate": len(players),
                  "position_counts_after_gate": dict(sorted(Counter(p["pos"] for p in players).items())),
                  "unresolved_roster_entries": len(unresolved),
              },
              "players": [
                  {
                      "key": str(p["key"]),
                      "player_id": p.get("player_id"),
                      "name": p["name"],
                      "pos": p["pos"],
                      "team": p.get("team"),
                      "age": p.get("age"),
                      "fv": round(float(p["fv"]), 6),
                  }
                  for p in sorted(players, key=lambda x: str(x["key"]))
              ],
              "outcomes_or_model_advantage_used": False,
              "prospective_ballots_read": False,
          }
          OUT_SNAPSHOT.write_text(json.dumps(snapshot, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          snapshot_sha = sha256(OUT_SNAPSHOT)

          def trade_signature(challenge):
              side_a = tuple(sorted(str(a["key"]) for a in challenge["side_a"]["assets"]))
              side_b = tuple(sorted(str(a["key"]) for a in challenge["side_b"]["assets"]))
              return tuple(sorted((side_a, side_b)))

          first_wave_sigs = {trade_signature(c) for c in first_wave["challenges"]}
          if len(first_wave_sigs) != len(first_wave["challenges"]):
              raise RuntimeError("first-wave catalog unexpectedly contains duplicate exact trade signatures")

          # Deterministic, preregistered scale targets. Component-feasibility may
          # shift a realized anchor upward/downward, but the frozen target itself
          # never changes and outcomes never enter the calculation.
          def plans_from_feasible(feasible_totals, *, label):
              unique = sorted({round(float(x), 3) for x in feasible_totals})
              if len(unique) < 30:
                  raise RuntimeError(f"{label}: too few unique feasible totals: {len(unique)}")
              plans = {}
              used_anchors = set()
              for scale in ("low", "mid", "high"):
                  target = TARGET_ANCHORS[scale]
                  ranked = sorted(
                      unique,
                      key=lambda x: (abs(float(x) - target), stable_rank(label, scale, x), float(x)),
                  )
                  anchor = next((float(x) for x in ranked if float(x) not in used_anchors), None)
                  if anchor is None:
                      raise RuntimeError(f"{label}/{scale}: no unique realized anchor")
                  used_anchors.add(anchor)
                  goals = sorted(
                      unique,
                      key=lambda x: (
                          abs(float(x) - anchor),
                          stable_rank(label, scale, "goal", x),
                          float(x),
                      ),
                  )
                  plans[scale] = {
                      "target_anchor_total_fv": float(target),
                      "anchor_total_fv": float(anchor),
                      "candidate_goal_totals": [float(x) for x in goals],
                  }
              anchors = [plans[x]["anchor_total_fv"] for x in ("low", "mid", "high")]
              if not (anchors[0] < anchors[1] < anchors[2]):
                  raise RuntimeError(f"{label}: realized anchors not increasing: {anchors}")
              return plans

          feasible_pairs = gen.enumerate_feasible_8020_pairs(players)
          core_totals = [float(r["total_fv"]) for r in feasible_pairs]
          core_plans = plans_from_feasible(core_totals, label="core")

          frag_label, frag_a, frag_b = gen.FRAGMENTATION_COMPARISONS[0]
          frag_totals = []
          seen = set()
          for row in feasible_pairs:
              total = round(float(row["total_fv"]), 3)
              if total in seen:
                  continue
              seen.add(total)
              if gen.component_window_matching_exists(players, total, frag_a, frag_b):
                  frag_totals.append(total)
          frag_plans = plans_from_feasible(frag_totals, label=frag_label)

          topology_shares = sorted({
              float(s)
              for _label, a, b in gen.HOLDOUT_3V3_COMPARISONS
              for s in (a + b)
              if float(s) > 0
          })
          topology_candidates = set()
          for p in players:
              for share in topology_shares:
                  topology_candidates.add(round(float(p["fv"]) / share, 3))
          topology_totals = [
              total for total in sorted(topology_candidates)
              if all(
                  gen.component_window_matching_exists(players, total, a, b)
                  for _label, a, b in gen.HOLDOUT_3V3_COMPARISONS
              )
          ]
          topology_plans = plans_from_feasible(topology_totals, label="topology_3v3")

          appearance = Counter()
          used_trade_sigs = set(first_wave_sigs)
          prospective_sigs = set()
          side_occurrences = Counter()
          challenges = []
          cell_counts = Counter()

          def prospective_try_build(*, family, cell_id, scale_label, scale_info,
                                    shares_a, shares_b, treatment, rep_index):
              total_goal_candidates = scale_info["candidate_goal_totals"]
              rejection_counts = Counter()
              for candidate_limit in (64, 120, 180):
                  for total_goal in total_goal_candidates:
                      cand_a = gen.construct_side_candidates(
                          players, total_goal, shares_a, set(), appearance,
                          limit=candidate_limit,
                      )
                      cand_b = gen.construct_side_candidates(
                          players, total_goal, shares_b, set(), appearance,
                          limit=candidate_limit,
                      )
                      if not cand_a or not cand_b:
                          rejection_counts["missing_side_candidates"] += 1
                          continue
                      ranked = []
                      for assets_a in cand_a:
                          keys_a = {str(p["key"]) for p in assets_a}
                          total_a = sum(float(p["fv"]) for p in assets_a)
                          actual_a = gen.canonical_actual_shares(assets_a)
                          intended_a = tuple(sorted((float(x) for x in shares_a), reverse=True))
                          err_a = abs(total_a - total_goal) / total_goal
                          share_err_a = max(abs(a-b) for a, b in zip(actual_a, intended_a))

                          for assets_b in cand_b:
                              keys_b = {str(p["key"]) for p in assets_b}
                              if keys_a & keys_b:
                                  rejection_counts["same_asset_both_sides"] += 1
                                  continue
                              if any(appearance[k] >= MAX_APPEARANCE for k in keys_a | keys_b):
                                  rejection_counts["appearance_cap"] += 1
                                  continue

                              total_b = sum(float(p["fv"]) for p in assets_b)
                              mean_total = (total_a + total_b) / 2.0
                              if mean_total <= 0:
                                  continue
                              pair_gap = abs(total_a - total_b) / mean_total
                              if pair_gap > gen.MAX_PAIR_TOTAL_GAP + 1e-12:
                                  rejection_counts["pair_total_gap"] += 1
                                  continue

                              actual_b = gen.canonical_actual_shares(assets_b)
                              intended_b = tuple(sorted((float(x) for x in shares_b), reverse=True))
                              err_b = abs(total_b - total_goal) / total_goal
                              share_err_b = max(abs(a-b) for a, b in zip(actual_b, intended_b))

                              side_a_sig = tuple(sorted(keys_a))
                              side_b_sig = tuple(sorted(keys_b))
                              trade_sig = tuple(sorted((side_a_sig, side_b_sig)))
                              if trade_sig in used_trade_sigs:
                                  rejection_counts["first_wave_or_prospective_trade_overlap"] += 1
                                  continue

                              side_reuse = (
                                  side_occurrences[(family, cell_id, scale_label, side_a_sig)]
                                  + side_occurrences[(family, cell_id, scale_label, side_b_sig)]
                              )
                              reuse_counts = [appearance[k] for k in keys_a | keys_b]
                              rank = (
                                  side_reuse,
                                  max(reuse_counts, default=0),
                                  sum(reuse_counts),
                                  pair_gap,
                                  max(err_a, err_b),
                                  max(share_err_a, share_err_b),
                                  err_a + err_b,
                                  share_err_a + share_err_b,
                                  stable_rank(family, cell_id, scale_label, total_goal, trade_sig),
                                  trade_sig,
                              )
                              ranked.append((rank, assets_a, assets_b, trade_sig, total_goal))

                      if ranked:
                          ranked.sort(key=lambda row: row[0])
                          _rank, assets_a, assets_b, trade_sig, chosen_goal = ranked[0]
                          challenge_id = (
                              f"pkgnv2p1_{family}_{scale_label}_{cell_id}_r{rep_index:02d}"
                              .replace("/", "_")
                          )
                          c = gen.make_challenge(
                              challenge_id=challenge_id,
                              family=family,
                              cell_id=cell_id,
                              scale_label=scale_label,
                              scale_anchor=scale_info["anchor_total_fv"],
                              total_goal=chosen_goal,
                              shares_a=shares_a,
                              shares_b=shares_b,
                              assets_a=assets_a,
                              assets_b=assets_b,
                              split="prospective_time_holdout",
                              fit_eligible=False,
                              treatment=treatment,
                          )
                          c["experiment"] = "package_adjustment_nextgen_v2_prospective_v1"
                          c["evaluation_only"] = True
                          c["fit_eligible"] = False
                          c["model_selection_eligible"] = False
                          c["scale_anchor_target_raw_fv"] = TARGET_ANCHORS[scale_label]
                          return c, trade_sig
              return None, {
                  "family": family,
                  "cell_id": cell_id,
                  "scale_label": scale_label,
                  "candidate_goal_count": len(total_goal_candidates),
                  "rejection_counts": dict(sorted(rejection_counts.items())),
                  "max_current_appearance": max(appearance.values(), default=0),
              }

          def add_cell(*, family, cell_id, scale_label, scale_info,
                       shares_a, shares_b, reps, treatment):
              for rep in range(1, reps + 1):
                  c, sig_or_diag = prospective_try_build(
                      family=family, cell_id=cell_id, scale_label=scale_label,
                      scale_info=scale_info, shares_a=shares_a, shares_b=shares_b,
                      treatment=treatment, rep_index=rep,
                  )
                  if c is None:
                      raise RuntimeError(
                          f"underfilled prospective cell {family}/{scale_label}/{cell_id}: "
                          f"built {rep-1}/{reps}; diagnostics={sig_or_diag}"
                      )
                  sig = sig_or_diag
                  used_trade_sigs.add(sig)
                  prospective_sigs.add(sig)
                  challenges.append(c)
                  cell_counts[(family, scale_label, cell_id)] += 1
                  for side_name in ("side_a", "side_b"):
                      side_sig = tuple(sorted(str(a["key"]) for a in c[side_name]["assets"]))
                      side_occurrences[(family, cell_id, scale_label, side_sig)] += 1
                      for asset in c[side_name]["assets"]:
                          appearance[str(asset["key"])] += 1

          def reset_catalog_state():
              appearance.clear()
              used_trade_sigs.clear()
              used_trade_sigs.update(first_wave_sigs)
              prospective_sigs.clear()
              side_occurrences.clear()
              challenges.clear()
              cell_counts.clear()

          def build_core_scale(scale):
              info = core_plans[scale]
              for label, shares in gen.CORE_PROFILES:
                  add_cell(
                      family="core_concentration_2v2",
                      cell_id=f"core_{label}",
                      scale_label=scale,
                      scale_info=info,
                      shares_a=shares,
                      shares_b=gen.FLAT_PROFILE,
                      reps=6,
                      treatment=f"{gen.profile_label(shares)}_vs_{gen.profile_label(gen.FLAT_PROFILE)}",
                  )

          def build_fragmentation_scale(scale):
              add_cell(
                  family="fragmentation_filler",
                  cell_id=f"frag_{frag_label}",
                  scale_label=scale,
                  scale_info=frag_plans[scale],
                  shares_a=frag_a,
                  shares_b=frag_b,
                  reps=5,
                  treatment=f"{gen.profile_label(frag_a)}_vs_{gen.profile_label(frag_b)}",
              )

          def build_topology_scale(scale):
              for label, shares_a, shares_b in gen.HOLDOUT_3V3_COMPARISONS:
                  add_cell(
                      family="structural_topology_3v3",
                      cell_id=f"holdout_{label}",
                      scale_label=scale,
                      scale_info=topology_plans[scale],
                      shares_a=shares_a,
                      shares_b=shares_b,
                      reps=4,
                      treatment=f"{gen.profile_label(shares_a)}_vs_{gen.profile_label(shares_b)}",
                  )

          # Construction-order search is structural only. No outcomes,
          # predictions, model advantages, or significance statistics enter it.
          strategies = (
              ("sparse_first_frag_topology_core", (
                  ("frag", "low"), ("frag", "mid"), ("frag", "high"),
                  ("topology", "low"), ("topology", "mid"), ("topology", "high"),
                  ("core", "low"), ("core", "mid"), ("core", "high"),
              )),
              ("sparse_first_topology_frag_core", (
                  ("topology", "low"), ("topology", "mid"), ("topology", "high"),
                  ("frag", "low"), ("frag", "mid"), ("frag", "high"),
                  ("core", "low"), ("core", "mid"), ("core", "high"),
              )),
              ("scale_interleaved_sparse_first", (
                  ("frag", "low"), ("topology", "low"), ("core", "low"),
                  ("frag", "mid"), ("topology", "mid"), ("core", "mid"),
                  ("frag", "high"), ("topology", "high"), ("core", "high"),
              )),
              ("original_core_first_fallback", (
                  ("core", "low"), ("core", "mid"), ("core", "high"),
                  ("frag", "low"), ("frag", "mid"), ("frag", "high"),
                  ("topology", "low"), ("topology", "mid"), ("topology", "high"),
              )),
          )

          strategy_failures = []
          construction_strategy_id = None
          for strategy_id, sequence in strategies:
              reset_catalog_state()
              try:
                  for family_key, scale in sequence:
                      if family_key == "core":
                          build_core_scale(scale)
                      elif family_key == "frag":
                          build_fragmentation_scale(scale)
                      elif family_key == "topology":
                          build_topology_scale(scale)
                      else:
                          raise AssertionError(f"unknown family key: {family_key}")
                  construction_strategy_id = strategy_id
                  break
              except RuntimeError as exc:
                  strategy_failures.append({
                      "strategy_id": strategy_id,
                      "error": str(exc),
                      "built_challenges_before_failure": len(challenges),
                      "max_appearance_before_failure": max(
                          appearance.values(), default=0
                      ),
                  })

          if construction_strategy_id is None:
              raise RuntimeError(
                  "all deterministic prospective construction strategies failed: "
                  + json.dumps(strategy_failures, sort_keys=True)
              )

          # ----------------------------- frozen-contract validation
          assert len(challenges) == 129
          assert len(cell_counts) == 24
          assert all(v > 0 for v in cell_counts.values())
          family_counts = Counter(c["family"] for c in challenges)
          scale_counts = Counter(c["scale_label"] for c in challenges)
          assert dict(family_counts) == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert dict(scale_counts) == {"low": 43, "mid": 43, "high": 43}
          assert max(appearance.values()) <= MAX_APPEARANCE
          assert len(prospective_sigs) == 129
          assert not (prospective_sigs & first_wave_sigs)

          ids = [c["id"] for c in challenges]
          assert len(ids) == len(set(ids))
          player_lookup = {str(p["key"]): p for p in players}
          for c in challenges:
              assert c["split"] == "prospective_time_holdout"
              assert c["fit_eligible"] is False
              assert c["evaluation_only"] is True
              assert c["model_selection_eligible"] is False
              assert c["values_hidden_from_voter"] is True
              assert c["side_a"]["asset_count"] >= 2
              assert c["side_b"]["asset_count"] >= 2
              assert float(c["pair_total_gap_pct"]) <= gen.MAX_PAIR_TOTAL_GAP + 1e-8
              for side_name in ("side_a", "side_b"):
                  side = c[side_name]
                  assert float(side["target_total_error_pct"]) <= gen.MAX_SIDE_TARGET_ERROR + 1e-8
                  assert float(side["max_share_error"]) <= gen.MAX_COMPONENT_SHARE_ERROR + 1e-8
                  keys = [str(a["key"]) for a in side["assets"]]
                  assert len(keys) == len(set(keys))
                  for a in side["assets"]:
                      key = str(a["key"])
                      assert key in player_lookup
                      assert abs(float(a["fv"]) - float(player_lookup[key]["fv"])) <= 0.001
                      assert float(a["fv"]) / v_ref <= inverse_domain_max + 1e-12
              assert not (
                  {str(a["key"]) for a in c["side_a"]["assets"]}
                  & {str(a["key"]) for a in c["side_b"]["assets"]}
              )

          # Exact preregistered per-cell replication counts.
          for scale in ("low", "mid", "high"):
              for label, _shares in gen.CORE_PROFILES:
                  assert cell_counts[("core_concentration_2v2", scale, f"core_{label}")] == 6
              assert cell_counts[("fragmentation_filler", scale, f"frag_{frag_label}")] == 5
              for label, _a, _b in gen.HOLDOUT_3V3_COMPARISONS:
                  assert cell_counts[("structural_topology_3v3", scale, f"holdout_{label}")] == 4

          # Production V1.6's current overlay is not active on all-multi-v-multi
          # trades; this prospective design therefore preserves raw M0 scoring.
          assert all(
              c["side_a"]["asset_count"] >= 2 and c["side_b"]["asset_count"] >= 2
              for c in challenges
          )

          def plan_summary(plan):
              return {
                  scale: {
                      "target_anchor_raw_fv": TARGET_ANCHORS[scale],
                      "realized_anchor_raw_fv": round(float(plan[scale]["anchor_total_fv"]), 6),
                      "absolute_anchor_offset": round(
                          abs(float(plan[scale]["anchor_total_fv"]) - TARGET_ANCHORS[scale]), 6
                      ),
                  }
                  for scale in ("low", "mid", "high")
              }

          catalog = {
              "schema_version": 1,
              "status": "frozen_prospective_research_catalog_v1",
              "frozen": True,
              "catalog_id": "pkgnv2-prospective-catalog-v1",
              "research_only": True,
              "evaluation_only": True,
              "fit_eligible_challenges": 0,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "generated_after_preregistration_freeze": True,
              "generated_before_prospective_voting_activation": True,
