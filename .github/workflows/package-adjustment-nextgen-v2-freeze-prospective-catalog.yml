              "automatic_production_promotion_allowed": False,
          }
          OUT_MANIFEST.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          # Re-read exact frozen bytes and verify manifest digests.
          frozen_catalog = read_json(OUT_CATALOG)
          frozen_manifest = read_json(OUT_MANIFEST)
          assert frozen_catalog["frozen"] is True
          assert frozen_catalog["diagnostics"]["challenge_count"] == 129
          assert frozen_catalog["diagnostics"]["evaluation_cell_count"] == 24
          assert frozen_catalog["diagnostics"]["first_wave_exact_trade_overlap_count"] == 0
          assert frozen_catalog["generation_implementation_revision"] == 2
          assert frozen_catalog["pre_freeze_failure_run_id"] == 34671326156
          assert frozen_catalog["pre_freeze_failure_committed_catalog"] is False
          assert frozen_catalog["construction_strategy_id"] in {
