name: CAL26 V1R67 - Frozen Week6 TD Alias Scoring Repair and DL Exception Forensics (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r67-2026-w6-scoring-repair-shadow
  cancel-in-progress: false
jobs:
  official-scoring-repair-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: Read-only checkout with immutable scorer
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download R65 frozen player-source and alias audit
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R65_518_FROZEN_WEEK6_SCORING_EXCEPTION_AUDIT_FV_HOLD
        run-id: 40066140272
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r67-inputs/R65
    - name: Download R66 official league-scored 2620 player-week points
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R66_2026_W6_LEAGUE_SCORED_PLAYER_POINT_ADJUDICATION_FV_HOLD
        run-id: 40067207413
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r67-inputs/R66
    - name: Reconcile four supported TD aliases and isolate four unresolved DL scoring cases
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R67_engine.py\" <<'PY_CAL26_V1R67_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"CAL26 V1R67: isolated scoring repair experiment against 2026 weeks 1-6.\nOnly paired official\
        \ Sleeper matchup points are independent CHECKS of local score,\nnot independent NFL stat data. Never modifies\
        \ source scorer, repo, or FV.\n\"\"\"\nimport argparse, ast, collections, csv, hashlib, json, math, pathlib,\
        \ urllib.request\n\nR65_RUN=40066140272\nR66_RUN=40067207413\nPOSITIONS=('QB','RB','WR','TE','DL','LB','DB')\n\
        OLD_SCORER_PATH='research/roster-economics/historical_weekly_points_pipeline.py'\nOLD_SCORER_BLOB='d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace'\n\
        R65_ROW='CAL26_V1R65_518_scoring_exception_and_verified_replay_NOT_FV.csv'\nR65_ALIAS='CAL26_V1R65_source_alias_events_REVIEW.csv'\n\
        R66_DETAIL='CAL26_V1R66_player_week_official_differences.csv'\nR66_ALIAS='CAL26_V1R66_5_IDP_alias_official_adjudications.csv'\n\
        \ndef check(v,message):\n    if not v:raise AssertionError(message)\n\ndef sha(b):return hashlib.sha256(b).hexdigest()\n\
        \ndef gitblob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()\n\ndef readcsv(p):\n\
        \    with p.open(newline='',encoding='utf8') as f:return list(csv.DictReader(f))\n\ndef emitcsv(p,rows,cols):\n\
        \    with p.open('w',newline='',encoding='utf8') as f:\n        writer=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');writer.writeheader();writer.writerows(rows)\n\
        \ndef read_source(repo,fixture_mode=False):\n    b=(repo/OLD_SCORER_PATH).read_bytes()\n    check(fixture_mode\
        \ or gitblob(b)==OLD_SCORER_BLOB,'SCORER_SOURCE_GIT_BLOB_DRIFT')\n    tree=ast.parse(b)\n    methods=[x for x\
        \ in tree.body if isinstance(x,ast.FunctionDef) and x.name=='score_week']\n    check(len(methods)==1,'SOURCE_SCORER_MISSING')\n\
        \    ns={};exec(compile(ast.Module(body=methods,type_ignores=[]),'<frozen 2026 scorer>','exec'),ns)\n    old=ns['score_week'];check(abs(old({'idp_tkl_solo':2,'idp_tkl_ast':2})-4.5)<1e-8,'ORIGINAL_SCORER_SELFTEST')\n\
        \    return old\n\ndef load_pin(folder,name):\n    manifest=json.loads((folder/name).read_text())\n    pinned=manifest.get('outputs_sha256')\
        \ or manifest.get('output_sha256')\n    check(isinstance(pinned,dict) and len(pinned)>=3,'ARTIFACT_MANIFEST_OUTPUT_MISSING')\n\
        \    for fn,digest in pinned.items():check(sha((folder/fn).read_bytes())==digest,'INPUT_ARTIFACT_SHA_DRIFT:'+fn)\n\
        \    return manifest\n\ndef fetch(w,fixture=None):\n    check(w in range(1,7),'PROTECTED_WEEK_BLOCKED')\n   \
        \ if fixture is None:\n        url=f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{w}'\n        with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CAL26-V1R67-fixed-six-weeks-read-only'}),timeout=50)\
        \ as resp:\n            check(resp.status==200,'SOURCE_HTTP_STATUS');b=resp.read(35_000_000)\n    else:b=(fixture/f'stats_week{w}.json').read_bytes()\n\
        \    parsed=json.loads(b)\n    check(isinstance(parsed,dict),'SOURCE_RESPONSE_NOT_DICTIONARY')\n    return parsed,sha(b)\n\
        \ndef is_td_alias(s):\n    \"\"\"A 2026-only candidate, not a modification of historical scoring rules.\"\"\"\
        \n    alt=float(s.get('idp_def_td') or 0)\n    orig=float(s.get('idp_td') or 0)\n    check(alt>=0 and orig>=0\
        \ and alt<=4 and orig<=4,'TD_ALIAS_COUNT_INVALID')\n    # Alternative spelling is counted only when primary is\
        \ zero; otherwise no double count.\n    # If both exist and differ the case is blocked from automatic interpretation.\n\
        \    check(not (alt and orig and alt!=orig),'TD_ALIAS_SOURCE_CONFLICT')\n    return 6.*alt if alt and orig==0\
        \ else 0.\n\ndef diagnose(row,stats):\n    pid=row['sleeper_id'];w=int(row['week']);raw=stats[w].get(pid,{})\n\
        \    check(isinstance(raw,dict),'SOURCE_PLAYER_NOT_DICT')\n    nonzero={k:v for k,v in sorted(raw.items()) if\
        \ isinstance(v,(int,float)) and v!=0}\n    return raw,nonzero\n\ndef main(args):\n    r65=pathlib.Path(args.r65);r66=pathlib.Path(args.r66);repo=pathlib.Path(args.repo)\n\
        \    out=pathlib.Path(args.out);out.mkdir(parents=True,exist_ok=True)\n    fixture=pathlib.Path(args.fixtures)\
        \ if args.fixtures else None\n    m65=load_pin(r65,'CAL26_V1R65_manifest.json');m66=load_pin(r66,'CAL26_V1R66_manifest.json')\n\
        \    check(m65['semantic_status']=='SOURCE_REPLAY_IDENTICAL_ALIASES_UNVERIFIED__FV_HOLD' and m65['player_count']==518,'R65_FROZEN_CONTRACT')\n\
        \    check(m66['status']=='OFFICIAL_SCORE_COMPARISON_AVAILABLE__FIX_SCORING_BEFORE_FV' and m66['player_count']==518,'R66_FROZEN_CONTRACT')\n\
        \    check(m65['observed_unique_ids']==495 and m66['official_scored_player_weeks']>=75,'LOW_SOURCE_COVERAGE')\n\
        \    check(m66['source_week_range']==list(range(1,7)) and m65['source_weeks']==list(range(1,7)),'WEEK_RANGE_DRIFT')\n\
        \    check(not m65['production_change_authorized'] and not m66['production_change_authorized'],'PRODUCTION_CHANGED')\n\
        \    original=read_source(repo,fixture is not None)\n    players=readcsv(r65/R65_ROW);alias65=readcsv(r65/R65_ALIAS)\n\
        \    details=readcsv(r66/R66_DETAIL);alias66=readcsv(r66/R66_ALIAS)\n    check(len(players)==518 and len(alias65)==5\
        \ and len(alias66)==5,'EXPECTED_COHORT_DRIFT')\n    check(len(details)==int(m66['official_scored_player_weeks']),'OFFICIAL_WEEK_COUNT_DRIFT')\n\
        \    check(len({(x['sleeper_id'],x['week']) for x in details})==len(details),'DUPLICATED_OFFICIAL_REFERENCE')\n\
        \    check(all(x['production_change_authorized']=='False' for x in details),'OFFICIAL_DATA_RELEASE_TAINT')\n\
        \    stats={};sources=[]\n    for w in range(1,7):\n        stats[w],digest=fetch(w,fixture)\n        if fixture\
        \ is None:check(digest==m65['source_SHA256'][str(w)],'SOURCE_BYTE_PIN_DRIFT_'+str(w))\n        sources.append({'week':w,'stats_SHA256':digest,'matches_R65_frozen_digest':digest==m65['source_SHA256'][str(w)],'input_guard':'WEEKS_1_TO_6_ONLY'})\n\
        \    # Score all known, previously observed players: original same-source parity remains exact.\n    replay=[];\
        \ byid={r['sleeper_id']:r for r in players if r['sleeper_id']}\n    check(len(byid)>=495,'CANDIDATE_IDENTITY_DRIFT')\n\
        \    changes={}\n    for row in players:\n        pid=row['sleeper_id'];base=0.;delta=0.;weeks=[]\n        if\
        \ pid:\n            for w in range(1,7):\n                raw=stats[w].get(pid,{})\n                check(isinstance(raw,dict),'PLAYER_WEEK_NON_DICT')\n\
        \                if raw and float(raw.get('gp') or 0)>=1:\n                    base+=float(original(raw))\n \
        \                   add=is_td_alias(raw)\n                    delta+=add\n                    if add:weeks.append(f'{w}:{int(add)}')\n\
        \            check(row['R65_replay_same_source_scorer_points']!='','R65_PLAYER_SCORED_EMPTY')\n            check(abs(base-float(row['R65_replay_same_source_scorer_points']))<1e-4,'FROZEN_PLAYER_SCORE_REPLAY_DRIFT:'+row['name'])\n\
        \        else:check(row['R65_replay_same_source_scorer_points']=='','UNMATCHED_HAS_OLD_SCORE')\n        changes[pid]=delta\
        \ if pid else 0.\n        replay.append({'name':row['name'],'position':row['position'],'sleeper_id':pid,\n  \
        \        'frozen_FV_UNCHANGED':row['frozen_FV_REFERENCE_ONLY'],\n          'original_sixweek_points':round(base,4)\
        \ if pid else '',\n          'isolated_alias_correction_NOT_RELEASED':round(delta,4) if pid else '',\n      \
        \    '2026_sixweek_corrected_SCORING_SHADOW_NOT_FV':round(base+delta,4) if pid else '',\n          'alias_source_weeks':';'.join(weeks),\n\
        \          'official_scoring_complete_for_this_player':False,\n          'production_change_authorized':False})\n\
        \    # Official league score is applied only to overlapping player-week observations (no missing bench imputation).\n\
        \    result=[];forensic=[]; before_bad=0;after_bad=0; before_mse=0.;after_mse=0.\n    for row in details:\n \
        \       pid=row['sleeper_id'];pos=row['position'];w=int(row['week']);raw,nonzero=diagnose(row,stats)\n      \
        \  check(pid in byid and w in range(1,7),'OFFICIAL_ID_OR_WEEK_DRIFT')\n        observed=bool(raw) and float(raw.get('gp')\
        \ or 0)>=1\n        before=float(original(raw)) if observed else 0.\n        recorded=float(row['scorer_points_R65_original'])\n\
        \        check(abs(before-recorded)<1e-4,'R66_OFFICIAL_ROW_ORIGINAL_DRIFT')\n        official=float(row['league_scored_points']);orig_res=round(official-before,5)\n\
        \        check(abs(orig_res-float(row['official_minus_scorer_points']))<1e-4,'R66_OFFICIAL_DELTA_DRIFT')\n  \
        \      corr=is_td_alias(raw) if observed else 0.;proposed=before+corr;res=round(official-proposed,5)\n      \
        \  before_bad+=abs(orig_res)>.05;after_bad+=abs(res)>.05\n        before_mse+=orig_res**2;after_mse+=res**2\n\
        \        result.append({'week':w,'name':row['name'],'position':pos,'sleeper_id':pid,\n          'original_reconstructed_points':round(before,5),'official_2026_league_points':round(official,5),\n\
        \          'original_official_residual':orig_res,\n          'strict_td_field_alias_delta_NOT_RELEASED':round(corr,5),\n\
        \          'corrected_shadow_points_NOT_RELEASED':round(proposed,5),\n          'residual_after_td_alias':res,'resolved_0_05':abs(res)<=.05,\n\
        \          'production_change_authorized':False})\n        if abs(orig_res)>.05 or abs(res)>.05:\n          \
        \  relevant={k:v for k,v in nonzero.items() if (k.startswith('idp') or 'td' in k or 'sack' in k or 'blk' in k\
        \ or 'safety' in k or k.startswith('fum'))}\n            forensic.append({'week':w,'name':row['name'],'position':pos,'sleeper_id':pid,\n\
        \              'original_official_residual':orig_res,'strict_td_field_alias_delta':round(corr,5),\n         \
        \     'remaining_official_residual':res,'status':'RECONCILED_BY_SUPPORTED_TD_ALIAS' if abs(res)<=.05 else 'UNEXPLAINED_REQUIRES_SOURCE_AND_CATEGORY_ADJUDICATION',\n\
        \              'all_nonzero_source_stats_JSON':json.dumps(nonzero,sort_keys=True),\n              'defense_source_stats_JSON':json.dumps(relevant,sort_keys=True),\n\
        \              'production_change_authorized':False})\n    check(before_bad==int(m66['official_score_mismatched_weeks_gt_0_05']),'R66_MISMATCH_COUNT_DRIFT')\n\
        \    if fixture is None:\n        check(before_bad==8,'EXPECTED_EIGHT_RAW_DIFFERENCES')\n        check(sum(x['status']=='RECONCILED_BY_SUPPORTED_TD_ALIAS'\
        \ for x in forensic)==4,'EXPECTED_FOUR_SUPPORTED_ALIAS_RECONCILIATIONS')\n        check(after_bad==4,'EXPECTED_FOUR_UNRESOLVED_DL_MISMATCHES')\n\
        \    # True source attribution of four DL mismatches still unknown, and the one non-rostered alias cannot be\
        \ officially adjudicated.\n    check(after_bad<=before_bad,'TD_ALIAS_SCORER_WORSENED_OFFICIAL_AGREEMENT')\n \
        \   check(len(forensic)==before_bad,'ONE_FORENSIC_CASE_PER_MISMATCH')\n    cols=lambda rows:list(rows[0])\n \
        \   output={\n      'CAL26_V1R67_518_scoring_shadow_NOT_FV.csv':(replay,cols(replay)),\n      'CAL26_V1R67_official_overlap_before_after.csv':(result,cols(result)),\n\
        \      'CAL26_V1R67_8_exception_field_forensics.csv':(forensic,cols(forensic)),\n      'CAL26_V1R67_2026_week1_6_pinned_source_digest.csv':(sources,cols(sources))}\n\
        \    for fn,(data,fields) in output.items():emitcsv(out/fn,data,fields)\n    lines=['# CAL26 V1R67 \u2014 Exact-Six-Week\
        \ Scoring Correction Shadow / Official Adjudication','',\n      '**Decision: FIX_SUPPORTED_FOUR_IDP_TD_ALIASES_BUT_HOLD_UNRESOLVED_SCORING_AND_FV**','',\n\
        \      f'On {len(result)} official player-week comparisons, the original scorer has **{before_bad}** mismatches;\
        \ an isolated 2026 defensive-touchdown source alias lowers that to **{after_bad}**.',\n      f'Observed total\
        \ correction for 518-player candidate pool: {round(sum(changes.values()),3)} LOG points across six weeks. These\
        \ points are NOT FV and are NOT added to production.',\n      '', '## Remaining official mismatches (do not auto-correct)']\n\
        \    for x in forensic:\n        if abs(float(x['remaining_official_residual']))>.05:lines.append(f\"- {x['name']}\
        \ ({x['position']}), Week {x['week']}: residual {x['remaining_official_residual']} points\")\n    lines.extend(['','##\
        \ Interpretation','- The correction is provisional even when corroborated; official fantasy points can include\
        \ manual adjustments. Inspect source field diagnostics for remaining discrepancies.',\n      '- League-matchup\
        \ official points may be missing for unrostered players; no missing observations are treated as zero.',\n   \
        \   '- The 2026 scoring alias is explicitly NOT back-propagated to 2021\u20132025 historical scoring or the production\
        \ engine.',\n      '- No arbitrary 20x, no owner-desired price labels, no FV release, and no future week data;\
        \ only 2026 Week 1\u20136 API calls.',''])\n    (out/'CAL26_V1R67_decision.md').write_text('\\n'.join(lines))\n\
        \    manifest={'workflow':'CAL26 V1R67','status':'FOUR_TD_ALIAS_RECONCILED__FOUR_OFFICIAL_SCORING_EXCEPTIONS_OPEN__FV_HOLD',\n\
        \      'fixture':bool(fixture),'R65_run':R65_RUN,'R66_run':R66_RUN,\n      'players':len(players),'official_player_weeks':len(result),\n\
        \      'original_official_mismatch_count':before_bad,'post_alias_official_mismatch_count':after_bad,\n      'supported_alias_reconciliations':before_bad-after_bad,\n\
        \      'source_weeks':[1,2,3,4,5,6],'future_2026_week7_or_later_read':False,\n      'pricing_multiplier_applied':False,'production_change_authorized':False,\n\
        \      'price_scale_calibrated':False,'input_stats_byte_pins_verified':all(x['matches_R65_frozen_digest'] for\
        \ x in sources),\n      'output_sha256':{x:sha((out/x).read_bytes()) for x in list(output)+['CAL26_V1R67_decision.md']}}\n\
        \    (out/'CAL26_V1R67_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')\n    print('CAL26_V1R67_RECONCILIATION',json.dumps({k:manifest[k]\
        \ for k in ('official_player_weeks','original_official_mismatch_count','post_alias_official_mismatch_count','input_stats_byte_pins_verified','production_change_authorized')},sort_keys=True))\n\
        \ndef selftest():\n    check(is_td_alias({'idp_def_td':1,'idp_td':0})==6.,'IDP_ALIAS_SINGLE')\n    check(is_td_alias({'idp_def_td':1,'idp_td':1})==0.,'TD_ALIAS_DOUBLE_COUNT_GUARD')\n\
        \    check(is_td_alias({'idp_def_td':0,'idp_td':1})==0.,'TD_ORIG_NOT_DELETED')\n    try:is_td_alias({'idp_def_td':1,'idp_td':2})\n\
        \    except AssertionError:pass\n    else:raise AssertionError('CONFLICT_NOT_BLOCKED')\n    try:fetch(7)\n  \
        \  except AssertionError as e:check(str(e)=='PROTECTED_WEEK_BLOCKED','WEEK_GUARD_MESSAGE')\n    else:raise AssertionError('FUTURE_WEEK_NOT_BLOCKED')\n\
        \    print('R67_SELFTEST_GREEN source field aliases, no double counting, future-week shield')\n\nif __name__=='__main__':\n\
        \    ap=argparse.ArgumentParser()\n    for n in ('r65','r66','repo','out','fixtures'):ap.add_argument('--'+n)\n\
        \    ap.add_argument('--selftest',action='store_true');a=ap.parse_args()\n    if a.selftest:selftest()\n    else:main(a)\n\
        \nPY_CAL26_V1R67_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R67_engine.py\"\npython \"$RUNNER_TEMP/CAL26_V1R67_engine.py\"\
        \ --selftest\npython \"$RUNNER_TEMP/CAL26_V1R67_engine.py\" \\\n --r65 \"$RUNNER_TEMP/cal26-r67-inputs/R65\"\
        \ \\\n --r66 \"$RUNNER_TEMP/cal26-r67-inputs/R66\" \\\n --repo \"$GITHUB_WORKSPACE\" \\\n --out \"$RUNNER_TEMP/cal26-r67-results\"\
        \npython - \"$RUNNER_TEMP/cal26-r67-results\" <<'PY_CAL26_V1R67_VERIFY'\nimport csv,hashlib,json,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R67_manifest.json').read_text())\nassert m['fixture'] is\
        \ False and m['players']==518 and m['official_player_weeks']==2620\nassert m['original_official_mismatch_count']==8\
        \ and m['post_alias_official_mismatch_count']==4\nassert m['supported_alias_reconciliations']==4\nassert m['R65_run']==40066140272\
        \ and m['R66_run']==40067207413\nassert m['source_weeks']==[1,2,3,4,5,6] and m['input_stats_byte_pins_verified']\n\
        assert not m['future_2026_week7_or_later_read'] and not m['price_scale_calibrated']\nassert not m['pricing_multiplier_applied']\
        \ and not m['production_change_authorized']\nfor n,d in m['output_sha256'].items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==d,n\n\
        with (p/'CAL26_V1R67_518_scoring_shadow_NOT_FV.csv').open() as f:rows=list(csv.DictReader(f))\nassert len(rows)==518\
        \ and all(x['production_change_authorized']=='False' for x in rows)\nwith (p/'CAL26_V1R67_8_exception_field_forensics.csv').open()\
        \ as f:flags=list(csv.DictReader(f))\nassert len(flags)==8 and sum(x['status']=='RECONCILED_BY_SUPPORTED_TD_ALIAS'\
        \ for x in flags)==4\nassert sum(x['status']=='UNEXPLAINED_REQUIRES_SOURCE_AND_CATEGORY_ADJUDICATION' for x in\
        \ flags)==4\nprint('R67_REAL_SCORER_ALIAS_PARITY_AND_FOUR_REMAINING_FORENSICS_GREEN')\nPY_CAL26_V1R67_VERIFY\n\
        test -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r67-results/CAL26_V1R67_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: Upload shadow scoring patch and source-field forensics (no FV changes)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R67_OFFICIAL_SCORING_ALIAS_REPAIR_AND_DL_FORENSICS_FV_HOLD
        path: ${{ runner.temp }}/cal26-r67-results/
        retention-days: 60
        if-no-files-found: warn
