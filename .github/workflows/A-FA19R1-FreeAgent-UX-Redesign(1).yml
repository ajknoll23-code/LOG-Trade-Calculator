name: A-FA19R1 - Free Agent Board UX Redesign

# Public presentation code only. Existing valuation formulas, private IDP data,
# ranking evidence, and roster calculations are never modified or uploaded.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates the UI; Apply commits only approved design assets"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  experience-redesign:
    name: Free Agent Experience V3 (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install source-pinned, additive UX refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,zlib
          modules={'assets/fa_experience_v3.js': {'sha256': '1de640b403a2c39a59f997ec10bf0f8a691e8b4f8342cf55935fedce9b0a0f7f', 'payload': ''}, 'assets/fa_experience_v3.css': {'sha256': 'd1761aee1f8890838771777f8d311c3b1eacf12d953ca65641c98145a12630b7', 'payload': ''}}
          allowed={'free-agent-board.html',*modules}
          for name,rec in modules.items():
              dest=Path(name)
              content=zlib.decompress(base64.b64decode(rec['payload']))
              assert hashlib.sha256(content).hexdigest()==rec['sha256'],f'Payload hash mismatch: {name}'
              dest.parent.mkdir(exist_ok=True,parents=True)
              if dest.exists():
                  assert dest.read_bytes()==content,f'Conflicting existing module: {name}'
              else: dest.write_bytes(content)
              print(f'Verified {name} ({len(content)} bytes)')
          page=Path('free-agent-board.html')
          assert page.exists(),'Free Agent Board entrypoint not found'
          html=page.read_text('utf-8')
          required=['<!-- FA_WORKSPACE_V1_STYLE -->','<!-- FA_WORKSPACE_V1_SCRIPT -->',
                    '<!-- FA_MOBILE_POLISH_V1_SCRIPT -->','<!-- FA_START_SIT_V1_SCRIPT -->',
                    '<!-- FA_WOELLERT_MATCHUP_V1_SCRIPT -->','<!-- FA_DECISION_V2_SCRIPT -->',
                    'id="boardWrap"','class="privacy-note"','id="fa13ResearchPanel"',
                    'id="idpiPanel"','id="idpoPanel"','id="idptPanel"','id="idpePanel"']
          assert all(token in html for token in required),'Existing board structure changed: fail closed'
          assert html.count('</head>')==1 and html.count('</body>')==1,'Unexpected document structure'
          style='<!-- FA_EXPERIENCE_V3_STYLE --><link rel="stylesheet" href="assets/fa_experience_v3.css?v=1">'
          script='<!-- FA_EXPERIENCE_V3_SCRIPT --><script src="assets/fa_experience_v3.js?v=1" defer></script>'
          if style not in html:
              assert '<!-- FA_EXPERIENCE_V3_STYLE -->' not in html,'Conflicting style loader'
              html=html.replace('</head>',style+'\n</head>')
          if script not in html:
              assert '<!-- FA_EXPERIENCE_V3_SCRIPT -->' not in html,'Conflicting script loader'
              html=html.replace('</body>',script+'\n</body>')
          assert html.count(style)==html.count(script)==1,'Duplicate new module loader'
          assert html.index('FA_EXPERIENCE_V3_SCRIPT')>html.index('FA_DECISION_V2_SCRIPT'),'Redesign must load after existing UI code'
          page.write_text(html,'utf-8')
          print('PASS — additive board-only redesign, canonical valuation logic untouched')
          PYCODE

      - name: Validate syntax, file boundaries and privacy
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_experience_v3.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          h=Path('free-agent-board.html').read_text('utf-8')
          s=Path('assets/fa_experience_v3.js').read_text('utf-8')
          c=Path('assets/fa_experience_v3.css').read_text('utf-8')
          assert h.count('FA_EXPERIENCE_V3_STYLE')==h.count('FA_EXPERIENCE_V3_SCRIPT')==1
          for name in ['fa_experience_v3.js','fa_experience_v3.css']:
              assert h.count(name)==1
          for token in ['fa19PlayerQuery','fa19Privacy','fa19-experience','boardWrap','data-fa-workspace']:
              assert token in s or token in c
          for unsafe in ['LOG-W10-Macri','LOG-W10-Woellert','private-activation','subscriber_rank_data']:
              assert unsafe not in s and unsafe not in c
          assert 'fetch(' not in s,'Experience module unexpectedly accesses the network'
          assert 'indexedDB' not in s and 'localStorage' not in s, 'Redesign must not handle private data'
          status=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True)
          changed={row[3:] for row in status.splitlines() if len(row)>=4}
          allowed={'free-agent-board.html','assets/fa_experience_v3.js','assets/fa_experience_v3.css'}
          assert changed.issubset(allowed),f'Unexpected changed files: {changed-allowed}'
          print('PASS — allowlisted public UI files only; no private data, prices or models changed')
          PYCODE

      - name: Preview (no commit)
        if: inputs.mode == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          echo 'PREVIEW GREEN: no files committed or pushed.'
          git status --short
          git diff --stat
          echo '### Free Agent UX redesign — Preview' >> "$GITHUB_STEP_SUMMARY"
          echo '- Five compact, accessible workspaces' >> "$GITHUB_STEP_SUMMARY"
          echo '- Name/team search and streamlined mobile layout' >> "$GITHUB_STEP_SUMMARY"
          echo '- No canonical valuation, ranking, or private-data changes' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply (approved UI files only)
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git add -- free-agent-board.html assets/fa_experience_v3.js assets/fa_experience_v3.css
          if git diff --cached --quiet; then
            echo 'Already installed. No commit needed.'
            exit 0
          fi
          python3 - <<'PYCODE'
          import subprocess
          approved={'free-agent-board.html','assets/fa_experience_v3.js','assets/fa_experience_v3.css'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed and changed.issubset(approved),f'Unexpected staged files: {changed-approved}'
          print('Staged only approved public presentation files:',sorted(changed))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-FA19R1: improve free agent navigation, search and mobile readability'
          git push origin HEAD:main
          echo '### Free Agent UX redesign — Applied' >> "$GITHUB_STEP_SUMMARY"
          echo 'Presentation files committed. Verify GitHub Pages deployment before reviewing the live board.' >> "$GITHUB_STEP_SUMMARY"
