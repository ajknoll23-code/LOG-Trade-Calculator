name: Replacement Level V2 Phase 1 Baseline Audit

# Research-only inventory of replacement-level and positional-scale anchors.
# Does not change index.html, Production V2 frozen candidates, position weights,
# production multipliers, or any deployed player value.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  baseline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 1 self-test
        run: python3 research/replacement-level-v2/replacement_level_v2_phase1_audit.py --selftest

      - name: Build replacement-level baseline audit
        run: python3 research/replacement-level-v2/replacement_level_v2_phase1_audit.py --write

      - name: Verify Phase 1 guardrails and outputs
        run: python3 research/replacement-level-v2/replacement_level_v2_phase1_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/replacement-level-v2/replacement_level_v2_phase1_audit.json
          git add research/replacement-level-v2/replacement_level_v2_phase1_audit.md
          git diff --staged --quiet || git commit -m "Add Replacement Level V2 Phase 1 baseline audit"
          git push
