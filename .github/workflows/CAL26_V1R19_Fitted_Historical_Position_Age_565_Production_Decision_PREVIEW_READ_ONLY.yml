# CAL26 V1R19 — Pinned V1R18 evidence. Historical age signal is not a dynasty valuation model.
# Read-only decision preview. Never writes production code, AGE_CURVE constants or FV prices.
name: CAL26 V1R19 - Fitted Historical Position Age 565 Production Decision Preview READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r19-fitted-historical-age-read-only
  cancel-in-progress: false
jobs:
  historical_fitted_age_shadow:
    name: Pinned evidence and 565-player shadow review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main read only with no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify required branch and historical age evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s index.html
          test -s research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.json
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download exact green CAL26 V1R18 source run artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26_v1r18_pinned_source"
          gh run download 39821472958 \
            --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R18-565-Historical-Retention-Research-Read-Only \
            --dir "$RUNNER_TEMP/cal26_v1r18_pinned_source"
          test -s "$RUNNER_TEMP/cal26_v1r18_pinned_source/CAL26_V1R18_Manifest.json"
          test -s "$RUNNER_TEMP/cal26_v1r18_pinned_source/CAL26_V1R18_All_565_Two_Year_and_Six_Year_Shadow.csv"
          test -s "$RUNNER_TEMP/cal26_v1r18_pinned_source/CAL26_V1R18_14_QB_Owner_Review.csv"
      - name: Materialize and self-test pinned CAL26 V1R19 research engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r19_engine.py" <<'PY_CAL26_V1R19'
          #!/usr/bin/env python3
          """CAL26 V1R19: source-pinned, read-only historical position-age k50 counterfactual.
          Historical predictive performance is about future *fantasy points*, not dynasty FV.
          Do not use as a production or owner-approved price policy.
          """
          from __future__ import annotations
          import argparse,csv,hashlib,json,math,statistics
          from pathlib import Path
          from collections import Counter
          
          SOURCE_RUN=39821472958
          SOURCE_ARTIFACT='CAL26-V1R18-565-Historical-Retention-Research-Read-Only'
          EXPECTED_SOURCE_MANIFEST_SHA256='d53f8b88dcbab44673f77f7605f4f06dc923f5058c65df0e425bac67a2a9967f'
          HISTORICAL_MIN_N=25
          SHADOW_CLAMP=(0.45,1.50) # V1R18 visualization bounds ONLY
          SOURCE_PLAYER='CAL26_V1R18_All_565_Two_Year_and_Six_Year_Shadow.csv'
          SOURCE_QB='CAL26_V1R18_14_QB_Owner_Review.csv'
          
          def check(ok,msg):
              if not ok: raise AssertionError(msg)
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def rjson(p):return json.loads(Path(p).read_text(encoding='utf-8'))
          def rcsv(p):
              with Path(p).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def wcsv(p,records):
              check(bool(records),'EMPTY_CSV_'+str(p))
              with Path(p).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=list(records[0]),extrasaction='raise')
                  w.writeheader();w.writerows(records)
          def rnd(x):return math.floor(x+.5)
          def asbool(s):return s is True or str(s)=='True'
          
          def candidate(row,curves,refs):
              fv=int(row['current_fv']);pos=row['position'];age=str(row['age'])
              controlled=asbool(row['is_approved_owner_anchor']) or asbool(row['is_accepted_control'])
              if controlled:return (fv,1.0,0,'OWNER_PROTECTED_HOLD')
              if pos=='K':return (fv,1.0,0,'KICKER_NO_HISTORICAL_AGE_CURVE_HOLD')
              if not asbool(row['historical_support']):return (fv,1.0,int(row['historical_cell_n']),'V1R18_RETENTION_SUPPORT_HOLD')
              entry=curves.get(pos,{}).get(age)
              if entry is None:return (fv,1.0,0,'NO_K50_POSITION_AGE_COHORT_HOLD')
              n=int(entry['n']);base=curves.get(pos,{}).get(str(refs[pos]))
              if not base or n<HISTORICAL_MIN_N or int(base['n'])<HISTORICAL_MIN_N:
                  return (fv,1.0,n,'K50_SMALL_COHORT_HOLD')
              factor=float(entry['factor'])/float(base['factor'])
              check(math.isfinite(factor) and factor>0,'NONFINITE_K50_FACTOR_'+row['player'])
              f=max(SHADOW_CLAMP[0],min(SHADOW_CLAMP[1],factor))
              amount=rnd(int(row['no_age_shadow_fv'])*f)
              return (amount,round(f,6),n,'POSITION_AGE_K50_RESEARCH_COUNTERFACTUAL')
          
          def selftest():
              f={'QB':{'28':{'factor':.8,'n':150},'24':{'factor':1.0,'n':75},'40':{'factor':1.1,'n':3}}}
              base={'position':'QB','age':'24','current_fv':'5000','no_age_shadow_fv':'6000','historical_support':'True','historical_cell_n':'75','player':'test','is_approved_owner_anchor':'False','is_accepted_control':'False'}
              c,factor,n,status=candidate(base,f,{'QB':28})
              check(c==7500 and factor==1.25 and status.startswith('POSITION_AGE'),'NORMALIZED_FACTOR')
              b={**base,'is_approved_owner_anchor':'True'}
              check(candidate(b,f,{'QB':28})[0]==5000,'LOCK_BREACH')
              b={**base,'age':'40'}
              check(candidate(b,f,{'QB':28})[0]==5000,'SMALL_COHORT_NOT_HELD')
              b={**base,'age':'43'}
              check(candidate(b,f,{'QB':28})[0]==5000,'MISSING_COHORT_NOT_HELD')
              print('PASS CAL26 V1R19: reference normalization, protected anchors, no-data holds, small cells')
          
          def run(repo,source,out):
              source=Path(source);repo=Path(repo);out=Path(out)
              out.mkdir(parents=True,exist_ok=True)
              manifest_path=source/'CAL26_V1R18_Manifest.json'
              check(manifest_path.exists(),'V1R18_MANIFEST_MISSING')
              check(sha(manifest_path)==EXPECTED_SOURCE_MANIFEST_SHA256,'PINNED_SOURCE_MANIFEST_SHA_MISMATCH')
              sm=rjson(manifest_path)
              check(sm['players']==565 and sm['quarterbacks']==64,'V1R18_PLAYER_SCOPE_DRIFT')
              check(sm['historical_player_seasons']==14102,'HISTORICAL_14102_DRIFT')
              check(sm['production_authorized'] is False and sm['production_files_mutated']==0,'SOURCE_NOT_READ_ONLY')
              check(sm['approved_owner_15_unchanged'] and sm['protected_owner_18_unchanged'],'SOURCE_OWNER_LOCK_DRIFT')
              check(sm['six_year_validation']=='NOT_EMPIRICALLY_VALIDATED_HYPOTHETICAL_EXTENSION','SIX_YEAR_STATUS_DRIFT')
              for file,h in sm['files'].items():check(sha(source/file)==h,'SOURCE_DIGEST_DRIFT_'+file)
              hpath=repo/'research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.json'
              check(sha(hpath)==sm['historical_phase2_sha256'],'HISTORICAL_PHASE2_DIGEST_DRIFT')
              index=repo/'index.html';check(sha(index)==sm['canonical_index_sha256'],'PRODUCTION_INDEX_CHANGED_SINCE_PINNED_V1R18')
              hist=rjson(hpath)
              check(hist['deployment_authorized'] is False and hist['age_curve_change_authorized'] is False,'HISTORICAL_SOURCE_AUTHORIZATION_DRIFT')
              check(hist['historical_sample']['retention_rows']==14102,'HISTORICAL_TRAINING_ROW_DRIFT')
              check(hist['monitoring_leader']=='empirical_tier_age_k50','PHASE2_HISTORICAL_LEADER_DRIFT')
              k50=hist['full_sample_candidate_curves']['k50']['position_age']
              assert sm['reference_ages'] and set(k50)=={'QB','RB','WR','TE','DL','LB','DB'}
              src=rcsv(source/SOURCE_PLAYER)
              qb_src=rcsv(source/SOURCE_QB)
              check(len(src)==565 and len({r['player'] for r in src})==565,'SOURCE_565_PLAYER_DRIFT')
              check(Counter(r['position'] for r in src)['QB']==64,'SOURCE_64_QB_DRIFT')
              check(sum(asbool(r['is_approved_owner_anchor']) for r in src)==15,'SOURCE_15_OWNER_DRIFT')
              check(sum(asbool(r['is_accepted_control']) for r in src)==18,'SOURCE_18_CONTROL_DRIFT')
              check(len(qb_src)==14,'OWNER_QB_14_COUNT_DRIFT')
              outrows=[];lookups={}
              for r in src:
                  a,f,n,status=candidate(r,k50,sm['reference_ages'])
                  protected=asbool(r['is_approved_owner_anchor']) or asbool(r['is_accepted_control'])
                  check(not protected or a==int(r['current_fv']),'PROTECTED_MISMATCH_'+r['player'])
                  record={'player':r['player'],'position':r['position'],'age':r['age'],'role':r['role'],
                     'current_fv':r['current_fv'],'no_age_shadow_fv':r['no_age_shadow_fv'],
                     'retention_2yr_shadow_fv':r['empirical_y1_y2_shadow_fv'],
                     'unvalidated_six_year_scenario_fv':r['scenario_six_year_shadow_fv'],
                     'phase2_k50_position_age_shadow_fv':a,'phase2_k50_delta_vs_current':a-int(r['current_fv']),
                     'historical_k50_factor_normalized':f,'historical_k50_cell_n':n,
                     'historical_retention_cell_n':r['historical_cell_n'],
                     'historical_model_status':status,'is_approved_owner_anchor':r['is_approved_owner_anchor'],
                     'is_accepted_control':r['is_accepted_control'],'production_authorized':False}
                  outrows.append(record);lookups[r['player']]=record
              comparison=[]
              for q in qb_src:
                  r=lookups[q['player']];rv=int(q['review_comparison_fv']);kind=q['owner_rating'];cur=int(r['current_fv'])
                  check(kind in ('Too High','Too Low','Correct'),'UNKNOWN_QB_FEEDBACK')
                  one={'player':q['player'],'owner_rating_on_earlier_review':kind,
                       'earlier_review_price_not_a_target':rv,'current_fv':cur}
                  for key,label in [('no_age_shadow_fv','no_age'),('retention_2yr_shadow_fv','two_year_retention'),('unvalidated_six_year_scenario_fv','six_year_hypothetical'),('phase2_k50_position_age_shadow_fv','fitted_k50_counterfactual')]:
                      proposed=int(r[key]);delta=proposed-cur
                      # Only direction *relative to current*, never infer exact desired FV from prior review price.
                      direction=('improves' if (kind=='Too Low' and delta>0) or (kind=='Too High' and delta<0)
                                 else 'worsens' if (kind=='Too Low' and delta<0) or (kind=='Too High' and delta>0)
                                 else 'unchanged')
                      if kind=='Correct' and delta!=0:direction='moves_owner_correct_price'
                      one[label+'_fv']=proposed;one[label+'_owner_direction_vs_current']=direction
                  one['protected_owner_price']=asbool(r['is_approved_owner_anchor']) or asbool(r['is_accepted_control'])
                  one['earlier_review_fv_not_exact_target']=True
                  comparison.append(one)
              check(Counter(q['owner_rating_on_earlier_review'] for q in comparison)=={'Too Low':7,'Too High':5,'Correct':2},'QB_FEEDBACK_SCOPE_DRIFT')
              poss=[]
              for pos in ['QB','RB','WR','TE','DL','LB','DB','K']:
                  subset=[r for r in outrows if r['position']==pos]
                  if not subset:continue
                  d=[r['phase2_k50_delta_vs_current'] for r in subset]
                  poss.append({'position':pos,'players':len(subset),'changed':sum(x!=0 for x in d),
                               'up':sum(x>0 for x in d),'down':sum(x<0 for x in d),
                               'median_delta':statistics.median(d),'total_delta':sum(d),
                               'held_no_historical_support':sum('HOLD' in r['historical_model_status'] and 'OWNER_' not in r['historical_model_status'] for r in subset)})
              models={r['model']:r for r in hist['primary_model_summary']}
              for key in ['current_production_only','deployed_age_policy_proxy','empirical_tier_age_k50','empirical_position_age_k50']:
                  check(key in models,'PHASE2_MODEL_MISSING_'+key)
              k=models['empirical_position_age_k50'];nol=models['current_production_only'];old=models['deployed_age_policy_proxy']
              check(k['mae']<old['mae']<nol['mae'],'PHASE2_HISTORICAL_MAE_ORDER_DRIFT')
              wcsv(out/'CAL26_V1R19_All_565_Position_Age_K50_Shadow.csv',outrows)
              wcsv(out/'CAL26_V1R19_14_QB_Directional_Review.csv',comparison)
              wcsv(out/'CAL26_V1R19_Position_Impact.csv',poss)
              summary=['# CAL26 V1R19 — Evidence-to-production decision packet (READ ONLY)','','**No production pricing or AGE_CURVE deployment authorized.**','',
                f'- Pinned green source: CAL26 V1R18 run `{SOURCE_RUN}` / `{SOURCE_ARTIFACT}`.',
                '- Historical base years: 2015–2023, 14,102 player-seasons, leave-one-season-out evaluation.',
                '- Historical outcome is forward Y+1/Y+2 fantasy points per team game, not dynasty FV.',
                f"- Historical future-points MAE: no age {nol['mae']:.4f}, deployed age-policy proxy {old['mae']:.4f}, fitted position-age k50 {k['mae']:.4f}, fitted tier-age k50 {models['empirical_tier_age_k50']['mae']:.4f}.",
                '- The k50 **shadow FV** is a new, unvalidated ratio-to-reference-age application of fitted future-points factors. Historical model advantage does NOT validate this FV translation.',
                '- k50 cohort age n <25, missing ages, kicker, unsupported retention cohorts, and the 33 protected owner players are held unchanged.',
                '- The older QB feedback review prices are NOT exact requested target prices. Direction is judged against current FV, not numeric distance to review prices.',
                '- Do not use hypothetical six-year retention for production. It has no observed Year+3..Year+5 outcomes.',
                '', '## Current 565 player impact of fitted position-age k50 shadow',
                f"- Changed: {sum(r['phase2_k50_delta_vs_current']!=0 for r in outrows)}; increases {sum(r['phase2_k50_delta_vs_current']>0 for r in outrows)}, decreases {sum(r['phase2_k50_delta_vs_current']<0 for r in outrows)}.",
                '', '## Direction agreement with QB owner feedback (change vs current, not an FV target)', '']
              for label in ['no_age','two_year_retention','six_year_hypothetical','fitted_k50_counterfactual']:
                  counts=Counter(q[label+'_owner_direction_vs_current'] for q in comparison if q['owner_rating_on_earlier_review']!='Correct')
                  summary.append(f"- {label}: improves {counts['improves']}/12, worsens {counts['worsens']}/12, unchanged {counts['unchanged']}/12.")
              summary+=['', '## Recommendation',
                 'Do not remove age universally merely because some QB valuations are too low. Do not release the fitted k50 shadow as prices without confirming current dynasty-value behavior and owner directions. Review the exact player-level changes, select a single bounded candidate policy, then request explicit release approval.','',
                 '**Status: REVIEW_ONLY_NO_PRODUCTION_CHANGE.**']
              report='\n'.join(summary)+'\n'
              (out/'CAL26_V1R19_Decision_Report.md').write_text(report,encoding='utf8')
              hashes={p.name:sha(p) for p in out.iterdir() if p.is_file()}
              manifest={'status':'PASS_CAL26_V1R19_K50_AGE_POLICY_SHADOW_REVIEW_ONLY','source_green_run_id':SOURCE_RUN,
                'source_manifest_sha256':sha(manifest_path),'historical_phase2_sha256':sha(hpath),
                'players':565,'quarterbacks':64,'approved_prices_locked':15,'protected_controls_locked':18,
                'production_authorized':False,'production_files_mutated':0,'historical_predictive_score_is_not_dynasty_fv_validation':True,
                'k50_research_factor_clamp':list(SHADOW_CLAMP),'files':hashes}
              (out/'CAL26_V1R19_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf8')
              print(json.dumps({'status':manifest['status'],'players':565,'k50_changed':sum(r['phase2_k50_delta_vs_current']!=0 for r in outrows),'owner_protected':33}))
              print(report)
          
          if __name__=='__main__':
              p=argparse.ArgumentParser();p.add_argument('--selftest',action='store_true');p.add_argument('--repo',default='.');p.add_argument('--source');p.add_argument('--out');a=p.parse_args()
              if a.selftest:selftest()
              else:
                  check(a.source and a.out,'SOURCE_AND_OUTPUT_REQUIRED')
                  run(a.repo,a.source,a.out)
          PY_CAL26_V1R19
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r19_engine.py"
          python3 "$RUNNER_TEMP/cal26_v1r19_engine.py" --selftest
      - name: Compute fitted historical position age shadow and owner-feedback directions
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r19_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source "$RUNNER_TEMP/cal26_v1r18_pinned_source" \
            --out "$RUNNER_TEMP/CAL26_V1R19_Evidence"
      - name: Independently verify full scope hashes and read-only repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAL26_VERIFY'
          from pathlib import Path
          import csv,hashlib,json,os
          p=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R19_Evidence'
          m=json.loads((p/'CAL26_V1R19_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R19_K50_AGE_POLICY_SHADOW_REVIEW_ONLY'
          assert (m['players'],m['quarterbacks'],m['approved_prices_locked'],m['protected_controls_locked'])==(565,64,15,18)
          assert not m['production_authorized'] and not m['production_files_mutated']
          assert m['historical_predictive_score_is_not_dynasty_fv_validation']
          for f,h in m['files'].items():
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==h,f
          with (p/'CAL26_V1R19_All_565_Position_Age_K50_Shadow.csv').open() as f: rows=list(csv.DictReader(f))
          with (p/'CAL26_V1R19_14_QB_Directional_Review.csv').open() as f: qb=list(csv.DictReader(f))
          assert len(rows)==565 and len({r['player'] for r in rows})==565 and len(qb)==14
          for r in rows:
              if r['is_approved_owner_anchor']=='True' or r['is_accepted_control']=='True':
                  assert r['current_fv']==r['phase2_k50_position_age_shadow_fv']
          print('PASS V1R19 independent audit: 565, 64 QB, 33 locked, source pins, output digests')
          PY_CAL26_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS no production/repository writes'
      - name: Upload all read-only decision evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R19-565-Fitted-Historical-Age-Decision-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R19_Evidence
          if-no-files-found: warn
          retention-days: 60
