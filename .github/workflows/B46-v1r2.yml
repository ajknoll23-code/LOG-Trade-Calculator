name: B46 Fresh Week 5 Acceptance V1R2

# Engineering-only parent-evidence schema repair. Source V1R1 is blob-pinned.
# Acceptance gates, Week-5 cohort, owner-blind freeze protocol, and B45
# overrides are untouched; V1R1 historical protocol artifacts are preserved.
on:
  workflow_dispatch:
    inputs:
      attestation:
        description: Exact B46 V1R2 fresh Week-5 acceptance attestation
        required: true
        type: string

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE: research/player-role-v2
      OUT: /tmp/b46-v1r2
    steps:
      - name: Check out durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify frozen parent and initialize B46 V1R2 engineering repair
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/b46_v1r2_source_adapter.py" <<'PYB46ADAPTER'
          #!/usr/bin/env python3
          """Pinned source adapter for B46 V1R2 engineering-only repair.

          Executes the unchanged steps of the original B46 V1R1 study with an isolated
          output namespace, a corrected parent-evidence parameter, and a new evaluator
          SHA256 pin.  No outcome gate, score, threshold, or B45 override is changed.
          """
          import argparse
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          ORIGINAL = Path('.github/workflows/B46-v1r1.yml')
          SOURCE_BLOB = 'c49488c5c2b43dd67144c4de9b94d8f0eed97b95'
          OLD_EVAL_SHA = '737633ab521e0090eae1244f2eda0f58b215fcd2d3f613876c8a779cb7171740'
          NEW_EVAL_SHA = '11c5dad54549b9c84bed9cd38a1e65320eb0bdfd22927b4d2877f92c4aca8f42'
          OLD_ATTEST = 'I_CONFIRM_B46_V1R1_USES_FIXED_WEEK5_DATA_SLICED_THROUGH_WEEK5_WITH_A_FRESH_MAIN_ROSTER_SNAPSHOT_UNCHANGED_B44_GATES_AND_FROZEN_B45_R6_OVERRIDES_AND_A_PASS_ONLY_MAKES_B47_PRODUCTION_AUTHORIZATION_ELIGIBLE'
          NEW_ATTEST = OLD_ATTEST.replace('_V1R1_', '_V1R2_')
          STAGES = [
              'Install frozen scientific runtime',
              'Week 5 source-only readiness preflight and protocol freeze',
              'Build owner-blind Week 5 identity and shadow before roster parse',
              'Run fresh Week 5 owner-blind acceptance audit',
              'Verify durable B46 result',
              'Surface B46 scientific STOP as red',
          ]
          PREFLIGHT = STAGES[1]


          def replace_one(source, old, new):
              n=source.count(old)
              if n!=1:
                  raise SystemExit(f'B46_V1R2_SOURCE_REPAIR_CONTRACT_DRIFT count={n} marker={old[:90]!r}')
              return source.replace(old, new)


          def pinned_source():
              if not ORIGINAL.is_file():
                  raise SystemExit('B46_V1R2_FROZEN_PARENT_WORKFLOW_MISSING')
              actual=subprocess.check_output(['git','hash-object',str(ORIGINAL)],text=True).strip()
              if actual!=SOURCE_BLOB:
                  raise SystemExit(f'B46_V1R2_PARENT_WORKFLOW_BLOB_DRIFT expected={SOURCE_BLOB} actual={actual}')
              return ORIGINAL.read_text(encoding='utf-8')


          def stage_script(source, stage):
              if stage not in STAGES:
                  raise SystemExit('B46_V1R2_UNKNOWN_STAGE')
              token='      - name: '+stage+'\n'
              if source.count(token)!=1:
                  raise SystemExit(f'B46_V1R2_STAGE_NOT_UNIQUE {stage}')
              start=source.index(token)
              end=source.find('\n      - name: ',start+len(token))
              section=source[start:] if end<0 else source[start:end]
              run_marker='        run: |\n'
              if section.count(run_marker)!=1:
                  raise SystemExit(f'B46_V1R2_RUN_BLOCK_DRIFT {stage}')
              block=section.split(run_marker,1)[1]
              out=[]
              for line in block.splitlines(keepends=True):
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif line.strip()=='':
                      out.append('\n' if line.endswith('\n') else '')
                  else:
                      raise SystemExit(f'B46_V1R2_YAML_BLOCK_INDENT_DRIFT {stage}: {line[:90]!r}')
              script=''.join(out)
              if not script.startswith('set -euo pipefail\n') and stage != PREFLIGHT:
                  raise SystemExit(f'B46_V1R2_FAIL_CLOSED_BASH_DRIFT {stage}')
              if 'set -euo pipefail' not in script:
                  raise SystemExit('B46_V1R2_FAIL_CLOSED_BASH_MISSING')

              # Preserve the entire V1 acceptance procedure, including three durable
              # freeze points, while using a fresh V1R2 namespace. Old V1R1 protocol
              # artifacts remain immutable and historical.
              script=script.replace('player_role_v2_b46_v1_', 'player_role_v2_b46_v1r2_')
              script=script.replace('B46_V1_NAMESPACE_ALREADY_CONSUMED','B46_V1R2_NAMESPACE_ALREADY_CONSUMED')
              script=script.replace('B46_V1R1_COLLISION_ID_SET_DRIFT','B46_V1R2_COLLISION_ID_SET_DRIFT')

              if stage==PREFLIGHT:
                  script=replace_one(script,OLD_ATTEST,NEW_ATTEST)
                  script=replace_one(
                      script,
                      'def load_fresh_identity_inputs(repo: Path, cache: Path, b44, b42, v1, lineage, session):',
                      'def load_fresh_identity_inputs(repo: Path, cache: Path, b44, b42, v1, lineage, v1_evidence, session):',
                  )
                  script=replace_one(
                      script,
                      'for x in lineage["v1_evidence"].get("supplemental_collision_details", [])',
                      'for x in v1_evidence.get("supplemental_collision_details", [])',
                  )
                  script=replace_one(
                      script,
                      'inputs = load_fresh_identity_inputs(repo, cache, b44, b42, v1, lineage, session)',
                      'inputs = load_fresh_identity_inputs(repo, cache, b44, b42, v1, lineage, v1_evidence, session)',
                  )
                  script=replace_one(script,OLD_EVAL_SHA,NEW_EVAL_SHA)

                  # Verify the complete 75 KB materialized evaluator body *before*
                  # any Week 5 acceptance result is calculated or committed.
                  lines=script.splitlines(keepends=True)
                  start_mark='cat > "$BASE/player_role_v2_b46_v1r2_evaluator.py" <<\'PYB46\'\n'
                  if lines.count(start_mark)!=1 or lines.count('PYB46\n')!=1:
                      raise SystemExit('B46_V1R2_EVALUATOR_HEREDOC_BOUNDARY_DRIFT')
                  a=lines.index(start_mark)+1
                  b=lines.index('PYB46\n',a)
                  evaluator=''.join(lines[a:b]).encode('utf-8')
                  actual=hashlib.sha256(evaluator).hexdigest()
                  if actual!=NEW_EVAL_SHA:
                      raise SystemExit(f'B46_V1R2_EVALUATOR_SHA_MISMATCH expected={NEW_EVAL_SHA} actual={actual}')
                  if 'lineage["v1_evidence"]' in evaluator.decode():
                      raise SystemExit('B46_V1R2_OLD_SCHEMA_ERROR_PRESENT')

                  # Frozen reference-evidence check, independent of the Week 5 roster.
                  probe="""\npython3 - <<'PYB46SCHEMA'\nimport json\nfrom pathlib import Path\np=Path('research/player-role-v2/player_role_v2_b43_v1_evidence.json')\ne=json.loads(p.read_text(encoding='utf-8'))\nc=e.get('supplemental_collision_details')\nassert isinstance(c,list) and len(c)==2, 'B46_V1R2_PARENT_COLLISION_COUNT_DRIFT'\nids=[str(row['gsis_id']) for row in c]\nassert len(set(ids))==2 and all(ids), 'B46_V1R2_PARENT_COLLISION_IDS_DRIFT'\nprint('PASS: B46 V1R2 frozen parent evidence schema: two distinct collisions')\nPYB46SCHEMA\n"""
                  script=replace_one(script,
                      'python3 "$BASE/player_role_v2_b46_v1r2_evaluator.py" --selftest\n',
                      'python3 "$BASE/player_role_v2_b46_v1r2_evaluator.py" --selftest\n'+probe)

              if stage==STAGES[-2] and 'PASS_B46_V1_FRESH_WEEK_ACCEPTANCE' not in script:
                  raise SystemExit('B46_V1R2_PASS_RESULT_CHANGED')
              if 'player_role_v2_b46_v1_' in script:
                  raise SystemExit('B46_V1R2_OLD_NAMESPACE_NOT_ISOLATED')
              return script


          def check_parent_schema():
              # This is historical B43 evidence, NOT current outcome or owner data.
              p=Path('research/player-role-v2/player_role_v2_b43_v1_evidence.json')
              v=json.loads(p.read_text(encoding='utf-8'))
              collisions=v.get('supplemental_collision_details')
              if not isinstance(collisions,list) or len({str(e['gsis_id']) for e in collisions})!=2:
                  raise SystemExit('B46_V1R2_FROZEN_PARENT_COLLISION_SCHEMA_DRIFT')


          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument('--verify',action='store_true')
              ap.add_argument('--stage',choices=STAGES)
              args=ap.parse_args()
              original=pinned_source()
              check_parent_schema()
              if args.verify:
                  for stage in STAGES:
                      stage_script(original,stage)
                  print('PASS: B46 V1R2 pinned original source, all six stages, evaluator SHA256, schema repair, and namespace isolation.')
                  return
              if not args.stage:
                  raise SystemExit('B46_V1R2_STAGE_REQUIRED')
              sys.stdout.write(stage_script(original,args.stage))

          if __name__=='__main__':
              main()
          PYB46ADAPTER
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --verify

      - name: Install frozen scientific runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --stage 'Install frozen scientific runtime' > "$RUNNER_TEMP/b46_v1r2_stage.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/b46_v1r2_stage.sh"

      - name: Week 5 source-only readiness preflight and protocol freeze
        env:
          OWNER_ATTEST: ${{ inputs.attestation }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --stage 'Week 5 source-only readiness preflight and protocol freeze' > "$RUNNER_TEMP/b46_v1r2_stage.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/b46_v1r2_stage.sh"

      - name: Build owner-blind Week 5 identity and shadow before roster parse
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --stage 'Build owner-blind Week 5 identity and shadow before roster parse' > "$RUNNER_TEMP/b46_v1r2_stage.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/b46_v1r2_stage.sh"

      - name: Run fresh Week 5 owner-blind acceptance audit
        if: env.B46_PRE_ROSTER_STOP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --stage 'Run fresh Week 5 owner-blind acceptance audit' > "$RUNNER_TEMP/b46_v1r2_stage.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/b46_v1r2_stage.sh"

      - name: Verify durable B46 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --stage 'Verify durable B46 result' > "$RUNNER_TEMP/b46_v1r2_stage.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/b46_v1r2_stage.sh"

      - name: Surface B46 scientific STOP as red
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b46_v1r2_source_adapter.py" --stage 'Surface B46 scientific STOP as red' > "$RUNNER_TEMP/b46_v1r2_stage.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/b46_v1r2_stage.sh"

