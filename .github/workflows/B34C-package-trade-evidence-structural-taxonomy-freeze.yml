    - name: Commit taxonomy before any future trade can count
      id: freeze
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add \
          research/package-adjustment-v1/prospective/structural_heterogeneity_v1.py \
          research/package-adjustment-v1/prospective/structural_heterogeneity_development_v1.json \
          research/package-adjustment-v1/prospective/structural_heterogeneity_development_v1.md \
          research/package-adjustment-v1/prospective/future_trade_structural_taxonomy_v1.json

        git diff --cached --check
        git commit -m "Freeze future package-trade structural taxonomy"
        git push origin HEAD:main

        FREEZE_SHA="$(git rev-parse HEAD)"
        FREEZE_TIME="$(git show -s --format=%cI "$FREEZE_SHA")"

        echo "sha=$FREEZE_SHA" >> "$GITHUB_OUTPUT"
        echo "time=$FREEZE_TIME" >> "$GITHUB_OUTPUT"

        echo "First taxonomy freeze commit: $FREEZE_SHA"
        echo "First taxonomy freeze time: $FREEZE_TIME"
    - name: Write immutable prospective freeze anchor
      env:
        FREEZE_SHA: ${{ steps.freeze.outputs.sha }}
        FREEZE_TIME: ${{ steps.freeze.outputs.time }}
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        import os
        from datetime import datetime
        from pathlib import Path

        base = Path("research/package-adjustment-v1/prospective")
        taxonomy = json.loads(
            (base / "future_trade_structural_taxonomy_v1.json")
            .read_text(encoding="utf-8")
        )
        development = json.loads(
            (base / "structural_heterogeneity_development_v1.json")
            .read_text(encoding="utf-8")
        )

        sha = os.environ["FREEZE_SHA"].strip()
        stamp = os.environ["FREEZE_TIME"].strip()
        assert len(sha) == 40
        dt = datetime.fromisoformat(stamp)
        epoch_ms = int(dt.timestamp() * 1000)

        anchor = {
            "schema_version": 1,
            "study_id": "package-adjustment-v1",
            "status": "FUTURE_STRUCTURAL_TAXONOMY_FREEZE_ANCHORED",
            "taxonomy_file": (
                "research/package-adjustment-v1/prospective/"
                "future_trade_structural_taxonomy_v1.json"
            ),
            "first_freeze_commit_sha": sha,
            "first_freeze_commit_time": stamp,
            "first_freeze_commit_epoch_ms": epoch_ms,
            "future_trade_eligibility_rule": (
                "Sleeper transaction created_epoch_ms must be strictly greater than "
                "first_freeze_commit_epoch_ms, in addition to all frozen taxonomy rules."
            ),
            "existing_development_trade_ids": sorted(
                x["transaction_id"] for x in development["trades"]
            ),
            "existing_development_trade_count": 6,
            "existing_development_trades_may_count_future": False,
            "production_authorized": False,
            "lambda_fit_authorized": False,
        }

        (base / "future_trade_structural_taxonomy_v1.freeze_anchor.json").write_text(
            json.dumps(anchor, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        assert taxonomy["governance"][
            "future_eligibility_requires_transaction_after_freeze_anchor_commit"
        ] is True

        print("PASS: future trade cutover anchored to already-committed taxonomy.")
        print("Cutover commit:", sha)
        print("Cutover epoch ms:", epoch_ms)
        PY
    - name: Self-archive B34C and commit freeze anchor
      shell: bash
      run: |
        set -euo pipefail

        SRC=".github/workflows/$SELF_WORKFLOW"
        DST=".github/workflow-archive/completed-research/$SELF_WORKFLOW"

        test -f "$SRC"
        mkdir -p "$(dirname "$DST")"

        if test -e "$DST"; then
          test "$(sha256sum "$SRC" | awk '{print $1}')" = \
               "$(sha256sum "$DST" | awk '{print $1}')"
          rm "$SRC"
        else
          mv "$SRC" "$DST"
        fi

        git add \
          research/package-adjustment-v1/prospective/future_trade_structural_taxonomy_v1.freeze_anchor.json \
          "$SRC" "$DST"

        git diff --cached --check
        git commit -m "Anchor future package-trade taxonomy cutover"
        git push origin HEAD:main

        echo "PASS: B34C self-archived after successful freeze."
