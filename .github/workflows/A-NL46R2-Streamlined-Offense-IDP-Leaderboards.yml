      - name: Upload two newsletters and audit manifest (PREVIEW, NO PUBLICATION)
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL46R2-Week${{ inputs.war_week }}-Unit-Leaderboards-PREVIEW-${{ github.run_id }}
          path: nl46_output/
          if-no-files-found: error
          retention-days: 90
      - name: Summarize read-only integration
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NL46_SUMMARY'
          ## NL46R2 - Offense and IDP Powerhouses - PREVIEW ONLY
          - Verified, position-classified Sleeper starter points from NL45; all 12 teams and all completed weeks.
          - Appends two mobile-readable scoring pages to the V7 production War Room; preserves existing nine pages word-for-word.
          - Optional Aftermath is a SHADOW PREVIEW: original seven matchup pages untouched, plus two V7 and two scoring pages.
          - Includes separate offense and IDP leaderboards, previous-week movement, largest unit split and best single-week totals. The positional scoring leaders section has been removed.
          - Kickers are reported separately in audit totals, not mixed with offense or IDP.
          - No FA scouting, no calculator values, no newsletter email, no repository commit, and no publishing.
          NL46_SUMMARY
