name: A-NL46R2 - Offense and IDP Powerhouses (No Position Leaders)
run-name: A-NL46R2 - Simplified offense / IDP rankings for W${{ inputs.war_week }} newsletters
'on':
  workflow_dispatch:
    inputs:
      war_week:
        description: War Room week; last completed week is one earlier (W9 is from scores through W8)
        type: string
        required: true
        default: '9'
      include_aftermath:
        description: Include matching Aftermath shadow preview, with V7 rankings and offense/IDP pages
        type: boolean
        required: true
        default: true
      nl44_run_id:
        description: Optional exact successful NL44 V7 production run ID; blank auto-selects the matching week
        required: false
        type: string
        default: ''
      nl45_run_id:
        description: Optional exact successful NL45 scoring-audit run ID; blank auto-selects the matching week
        required: false
        type: string
        default: ''
      nl39_run_id:
        description: Optional exact successful NL39 source run ID; blank auto-selects latest matching week
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl46r2-editorial-readonly-${{ inputs.war_week }}
  cancel-in-progress: false
jobs:
  add-scoring-leaderboards:
    name: Validate exact week sources; append unit rankings without editing any existing pages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve exact approved newsletters and independently reconciled starter scores
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WAR_WEEK: ${{ inputs.war_week }}
          INCLUDE_AFTERMATH: ${{ inputs.include_aftermath }}
          NL44_ID: ${{ inputs.nl44_run_id }}
          NL45_ID: ${{ inputs.nl45_run_id }}
          NL39_ID: ${{ inputs.nl39_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'NL46_SOURCE'
          import json,os,re,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          war=int(os.environ['WAR_WEEK'])
          if war not in range(2,19):raise RuntimeError('War Room week must be 2-18')
          scored=war-1
          include=os.environ['INCLUDE_AFTERMATH'].lower()=='true'
          api='https://api.github.com/repos/'+repo
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'LOG-NL46R2-ReadOnly'}
          def get(path):
              request=urllib.request.Request(api+path,headers=headers)
              with urllib.request.urlopen(request,timeout=35) as r:return json.load(r)
          policies={
            'nl44':('.github/workflows/A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml',rf'(?<!\d)W0?{war}(?!\d)'),
            'nl45':('.github/workflows/A-NL45R1-Offense-IDP-Leaderboard-ReadOnly.yml',rf'\bWeek\s+0?{scored}(?!\d)'),
            'nl39':('.github/workflows/A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml',rf'(?<!\d)W0?{war}(?!\d)'),
          }
          def validate(r,path,regex):
              return (r.get('path')==path and r.get('head_branch')=='main' and
                r.get('event')=='workflow_dispatch' and r.get('status')=='completed' and
                r.get('conclusion')=='success' and
                bool(re.search(regex,str(r.get('display_title') or ''),re.I)))
          def choose(key,forced):
              path,regex=policies[key]
              if forced.strip():
                  if not forced.isdecimal():raise RuntimeError(key+' run ID must be numeric')
                  r=get('/actions/runs/'+forced)
                  if not validate(r,path,regex):raise RuntimeError(key+' specified run not successful for the exact week and source workflow')
              else:
                  # List only runs of the designated workflow, not arbitrary newsletter lookalikes.
                  fn=path.rsplit('/',1)[-1]
                  matches=[]
                  for page in (1,2,3):
                      x=get(f'/actions/workflows/{fn}/runs?event=workflow_dispatch&branch=main&per_page=100&page={page}')
                      matches.extend(t for t in x.get('workflow_runs',[]) if validate(t,path,regex))
                      if matches or len(x.get('workflow_runs',[]))<100:break
                  if not matches:raise RuntimeError(f'No successful {key} for W{war} (completed W{scored}). Run NL44/NL45'+('/NL39' if include else '')+' first.')
                  r=max(matches,key=lambda v:int(v['id']))
              rid=int(r['id'])
              art=get(f'/actions/runs/{rid}/artifacts?per_page=100')
              by_name={a['name']:a for a in art.get('artifacts',[]) if not a.get('expired')}
              expected={
                'nl44':f'LOG-W{war}-V7-WarRoom-RELEASE-{rid}',
                'nl45':f'LOG-NL45R1-Offense-IDP-Scoring-Through-W{scored}-{rid}',
                'nl39':f'LOG-NL39R1-Weekly-Newsroom-Shadow-{rid}',
              }[key]
              if expected not in by_name:raise RuntimeError(f'{key} expected nonexpired artifact missing: {expected}')
              return rid,expected
          results={}
          for key,forced in [('nl44',os.environ['NL44_ID']),('nl45',os.environ['NL45_ID'])]+([('nl39',os.environ['NL39_ID'])] if include else []):
              results[key]=choose(key,forced)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key,(id_,name) in results.items():
                  f.write(f'{key}_id={id_}\n{key}_name={name}\n')
          print('PASS: validated exact-week successful source artifacts',results,flush=True)
          NL46_SOURCE
      - name: Download owner-approved production V7 War Room
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.nl44_name }}
          run-id: ${{ steps.source.outputs.nl44_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl46_input/nl44
      - name: Download reconciled NL45 offense and IDP starter score audit
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.nl45_name }}
          run-id: ${{ steps.source.outputs.nl45_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl46_input/nl45
      - name: Download matching NL39 Aftermath source (optional preview only)
        if: ${{ inputs.include_aftermath }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.nl39_name }}
          run-id: ${{ steps.source.outputs.nl39_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl46_input/nl39
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5'
      - name: Validate source provenance and append two phone-readable leaderboard pages
        shell: bash
        env:
          WAR_WEEK: ${{ inputs.war_week }}
          INCLUDE_AFTERMATH: ${{ inputs.include_aftermath }}
          NL44_RUN: ${{ steps.source.outputs.nl44_id }}
          NL45_RUN: ${{ steps.source.outputs.nl45_id }}
        run: |
          set -euo pipefail
