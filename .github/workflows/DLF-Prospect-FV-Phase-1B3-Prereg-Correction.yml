name: DLF Prospect FV V1 - Phase 1B3 Pre-Outcome Preregistration Correction
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v1-phase1b3-prereg-correction
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE1B_GREEN_RUN_ID: '36086444581'
  PHASE1B_GREEN_ARTIFACT_ID: '10844305566'
  PHASE1B_GREEN_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1b-v2-identity-preregistration
  PHASE1B_GREEN_JSON_SHA256: 931a4f894e2c4f1d78b5b1e1be89461862e6ddaf1bc12a21b6eac2c034473f70
  PHASE1B_IDENTITY_SHA256: e8d79738530a73f15de0c52990e8f7fbf1e8d4f699448add0f5add11eaa093fb
  PHASE1B_FEATURE_SHA256: 7d0fee1ef881456570828f9a9c3efebdd827e2a2585238610043d4f271358e3f
  DLF_SEMANTIC_SHA256: 4dd07ea9180c11f7f3c80657dfe7274245a683fbb3b3eca2edb92c903c562414
  DLF_STRUCTURE_SHA256: 01e780ede9a21806e7f838ad735ee1c73f2f970766651b276aed9f6215769c10
jobs:
  freeze-corrected-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download exact green Phase 1B artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1B_GREEN_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1b-green
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1B_GREEN_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Freeze corrected preregistration
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"${RUNNER_TEMP}/dlf-phase1b3\"\npython3 - <<'PY'\nfrom __future__ import annotations\n\
        \nimport hashlib\nimport json\nimport os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nroot\
        \ = Path(os.environ[\"RUNNER_TEMP\"])\nsrc = root / \"phase1b-green\" / \"dlf_prospect_fv_v1_phase1b_identity_preregistration.json\"\
        \nout_dir = root / \"dlf-phase1b3\"\nout_dir.mkdir(parents=True, exist_ok=True)\n\nEXPECTED_JSON_SHA = os.environ[\"\
        PHASE1B_GREEN_JSON_SHA256\"]\nEXPECTED_IDENTITY_SHA = os.environ[\"PHASE1B_IDENTITY_SHA256\"]\nEXPECTED_FEATURE_SHA\
        \ = os.environ[\"PHASE1B_FEATURE_SHA256\"]\nEXPECTED_SEMANTIC_SHA = os.environ[\"DLF_SEMANTIC_SHA256\"]\nEXPECTED_STRUCTURE_SHA\
        \ = os.environ[\"DLF_STRUCTURE_SHA256\"]\n\ndef sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\
        \ndef canonical_json_bytes(obj) -> bytes:\n    return json.dumps(\n        obj, sort_keys=True, separators=(\",\"\
        , \":\"), ensure_ascii=False\n    ).encode(\"utf-8\")\n\nraw = src.read_bytes()\nactual = sha256_bytes(raw)\nif actual\
        \ != EXPECTED_JSON_SHA:\n    raise RuntimeError(\n        f\"green Phase 1B artifact SHA mismatch: expected={EXPECTED_JSON_SHA}\
        \ actual={actual}\"\n    )\n\nd = json.loads(raw)\n\nassert d[\"decision\"] == \"PASS_IDENTITY_AND_PREREGISTRATION_NO_OUTCOMES_READ\"\
        \nassert d[\"lineage\"][\"dlf_semantic_sha256\"] == EXPECTED_SEMANTIC_SHA\nassert d[\"lineage\"][\"dlf_structure_sha256\"\
        ] == EXPECTED_STRUCTURE_SHA\nassert d[\"identity\"][\"mapped_identity_sha256\"] == EXPECTED_IDENTITY_SHA\nassert d[\"\
        feature_freeze\"][\"sha256\"] == EXPECTED_FEATURE_SHA\n\nfw = d[\"firewalls\"]\nassert fw[\"weekly_nfl_outcomes_read\"\
        ] is False\nassert fw[\"model_fit_performed\"] is False\nassert fw[\"feature_selection_used_outcomes\"] is False\n\
        assert fw[\"current_fv_read_for_selection\"] is False\nassert fw[\"ktc_read\"] is False\nassert fw[\"dlf_adp_read\"\
        ] is False\nassert fw[\"dlf_rankings_read\"] is False\nassert fw[\"dlf_trade_values_read\"] is False\nassert fw[\"\
        production_change_authorized\"] is False\n\nidentity = d[\"identity\"]\nassert identity[\"gate\"][\"passed\"] is True\n\
        assert identity[\"mapped_rows\"] == 505\nassert identity[\"historical_drafted_rows\"] == 514\nassert identity[\"ambiguous_rows\"\
        ] == 0\nassert identity[\"overall_coverage_pct\"] == 98.25\n\nfor pos, rec in identity[\"coverage_by_position\"].items():\n\
        \    assert rec[\"coverage_pct\"] >= 90.0, (pos, rec)\nfor year, rec in identity[\"coverage_by_year\"].items():\n\
        \    assert rec[\"coverage_pct\"] >= 90.0, (year, rec)\n\nPOSITIONS = (\"QB\", \"RB\", \"WR\", \"TE\")\n\nPRIMARY_BASIC_ALLOW\
        \ = {\n    \"QB\": {\n        \"Career.CMP%\", \"Career.YPA\", \"Career.TD%\", \"Career.INT%\",\n        \"Career.RuYPG\"\
        , \"Best.CMP%\", \"Best.YPA\", \"Best.TD%\",\n        \"Best.INT%\", \"Best.RuYPG\",\n    },\n    \"RB\": {\n    \
        \    \"YPC\", \"YPTP\", \"Best Receptions\", \"Best Total Yards Y1/Y2\",\n    },\n    \"WR\": {\n        \"YPG\",\
        \ \"First.YPTPA\", \"Last.YPTPA\", \"Best.YPTPA\",\n        \"First.MSYards\", \"Last.MSYards\", \"Best.MSYards\"\
        ,\n    },\n    \"TE\": {\n        \"YPR\", \"YPG\", \"First.YPTPA\", \"Last.YPTPA\", \"Best.YPTPA\",\n        \"First.MSYards\"\
        , \"Last.MSYards\", \"Best.MSYards\",\n    },\n}\n\nPRIMARY_ATHLETIC_ALLOW = {\n    \"Weight\", \"Height\", \"BMI\"\
        , \"40-Dash\", \"Vertical\", \"Broad\"\n}\n\nHARD_QUARANTINE = {\n    \"BOY20\", \"BOA20\", \"BOY15\", \"BOA15\",\n\
        \    \"WaSS\", \"Burst Score\",\n    \"Markers\", \"Final.Grade\", \"Athleticism%\", \"Production%\",\n    \"Advanced.Markers\"\
        ,\n    \"First.PPG\", \"Last.PPG\", \"Best.PPG\", \"FPPG\",\n    \"Best.PPG.F4\", \"Best.YPTPA.F4\", \"Best.MSYards.F4\"\
        ,\n}\n\ndef eligible(pos: str, family: str) -> list[str]:\n    return list(d[\"feature_contract\"][pos][family][\"\
        eligible_features\"])\n\nprimary = {}\nsecondary = {}\n\nfor pos in POSITIONS:\n    old_prod = eligible(pos, \"production_primary\"\
        )\n    old_ath = eligible(pos, \"athletic_primary\")\n    old_adv = eligible(pos, \"advanced_secondary\")\n    old_derived\
        \ = eligible(pos, \"transparent_derived_primary\")\n\n    primary_basic = [f for f in old_prod if f in PRIMARY_BASIC_ALLOW[pos]]\n\
        \    primary_athletic = [f for f in old_ath if f in PRIMARY_ATHLETIC_ALLOW]\n\n    # Anything eligible in the old\
        \ production family but not on the basic\n    # allowlist is demoted to secondary diagnostics, never model selection.\n\
        \    secondary_diag = []\n    for f in old_prod + old_adv:\n        if f not in primary_basic and f not in HARD_QUARANTINE\
        \ and f not in secondary_diag:\n            secondary_diag.append(f)\n\n    # Derived breakout fields are explicitly\
        \ excluded, not merely demoted.\n    assert all(f in HARD_QUARANTINE for f in old_derived)\n\n    if len(primary_basic)\
        \ < 2:\n        raise RuntimeError(f\"{pos}: fewer than 2 primary basic features after correction\")\n\n    primary[pos]\
        \ = {\n        \"baseline\": d[\"preregistration\"][\"baseline_by_position\"][pos],\n        \"basic_production\"\
        : primary_basic,\n        \"raw_athletic\": primary_athletic,\n        \"all_primary_features\": primary_basic + primary_athletic,\n\
        \    }\n    secondary[pos] = secondary_diag\n\nfor pos in POSITIONS:\n    leaked = [f for f in primary[pos][\"all_primary_features\"\
        ] if f in HARD_QUARANTINE]\n    if leaked:\n        raise RuntimeError(f\"{pos}: quarantined feature leaked into primary\
        \ set: {leaked}\")\n\ncorrected_feature_payload = {\n    pos: {\n        \"basic_production_primary\": primary[pos][\"\
        basic_production\"],\n        \"raw_athletic_primary\": primary[pos][\"raw_athletic\"],\n        \"advanced_secondary_diagnostic_only\"\
        : secondary[pos],\n    }\n    for pos in POSITIONS\n}\ncorrected_feature_sha = sha256_bytes(canonical_json_bytes(corrected_feature_payload))\n\
        \nprereg = {\n    \"development_years\": [2018, 2019, 2020, 2021, 2022, 2023, 2024],\n    \"sealed_outcome_years\"\
        : [2025, 2026],\n    \"positions\": list(POSITIONS),\n    \"primary_target\": (\n        \"custom-scored first-two-NFL-season\
        \ points / scheduled team games; \"\n        \"same target as No-History/Rookie V2 Phase 2\"\n    ),\n    \"outer_validation\"\
        : \"leave one entire draft year out; 7 outer folds\",\n    \"primary_candidate_by_position\": primary,\n    \"candidate_estimator\"\
        : {\n        \"type\": \"ridge regression\",\n        \"alpha\": 10.0,\n        \"alpha_selection\": \"fixed before\
        \ outcomes; no tuning\",\n    },\n    \"preprocessing_inside_training_fold_only\": [\n        \"numeric median imputation\
        \ by position\",\n        \"one missingness indicator per DLF primary feature\",\n        \"z-score DLF primary features\
        \ using training-fold mean and standard deviation\",\n        \"drop only zero-variance DLF primary features using\
        \ training-fold inputs\",\n        \"held-out draft year contributes no preprocessing statistics\",\n    ],\n    \"\
        metrics\": {\n        \"primary\": \"MAE\",\n        \"secondary\": [\"RMSE\", \"Spearman\"],\n    },\n    \"paired_uncertainty\"\
        : {\n        \"method\": (\n            \"paired player-level bootstrap of absolute-error difference \"\n        \
        \    \"(candidate minus baseline)\"\n        ),\n        \"replicates\": 10000,\n        \"seed\": 20260925,\n   \
        \     \"confidence_interval\": \"95% percentile\",\n    },\n    \"primary_success_gate_all_required\": [\n       \
        \ \"pooled MAE relative improvement >= 2.0%\",\n        \"95% paired-bootstrap CI upper bound for candidate-minus-baseline\
        \ absolute error < 0\",\n        \"candidate MAE lower than baseline in at least 4 of 7 held-out draft-year folds\"\
        ,\n        \"no position MAE worsens by more than 5.0% relative\",\n        \"at least 2 of 4 positions improve MAE\"\
        ,\n    ],\n    \"secondary_metrics_cannot_rescue_primary_failure\": True,\n    \"advanced_secondary_cannot_select_or_rescue_v1\"\
        : True,\n    \"selection_firewall\": (\n        \"No current FV, KTC, DLF market values, DLF ADP, DLF rankings, \"\
        \n        \"DLF trade values, 2025 NFL outcomes, or 2026 NFL outcomes may \"\n        \"select or tune the candidate.\"\
        \n    ),\n    \"deployment_rule\": (\n        \"Passing historical Phase 1C only establishes incremental historical\
        \ signal; \"\n        \"it does not authorize FV deployment or a production blend weight.\"\n    ),\n}\n\nresult =\
        \ {\n    \"schema_version\": 1,\n    \"study_id\": \"dlf-prospect-fv-v1\",\n    \"phase\": \"1B3_preoutcome_preregistration_correction\"\
        ,\n    \"decision\": \"FREEZE_CORRECTED_PREREGISTRATION_NO_OUTCOMES_READ\",\n    \"generated_at_utc\": datetime.now(timezone.utc).isoformat(),\n\
        \    \"reason\": (\n        \"Pre-outcome correction to reduce model-selection freedom and quarantine \"\n       \
        \ \"derived breakout fields before Phase 1C opens historical outcomes.\"\n    ),\n    \"lineage\": {\n        \"green_phase1b_run_id\"\
        : int(os.environ[\"PHASE1B_GREEN_RUN_ID\"]),\n        \"green_phase1b_artifact_id\": int(os.environ[\"PHASE1B_GREEN_ARTIFACT_ID\"\
        ]),\n        \"green_phase1b_json_sha256\": EXPECTED_JSON_SHA,\n        \"dlf_semantic_sha256\": EXPECTED_SEMANTIC_SHA,\n\
        \        \"dlf_structure_sha256\": EXPECTED_STRUCTURE_SHA,\n        \"mapped_identity_sha256\": EXPECTED_IDENTITY_SHA,\n\
        \        \"original_feature_freeze_sha256\": EXPECTED_FEATURE_SHA,\n    },\n    \"identity_reused_without_change\"\
        : {\n        \"historical_drafted_rows\": identity[\"historical_drafted_rows\"],\n        \"mapped_rows\": identity[\"\
        mapped_rows\"],\n        \"unresolved_rows\": identity[\"unresolved_rows\"],\n        \"ambiguous_rows\": identity[\"\
        ambiguous_rows\"],\n        \"overall_coverage_pct\": identity[\"overall_coverage_pct\"],\n        \"coverage_by_position\"\
        : identity[\"coverage_by_position\"],\n        \"coverage_by_year\": identity[\"coverage_by_year\"],\n        \"mapped_identity_sha256\"\
        : identity[\"mapped_identity_sha256\"],\n    },\n    \"corrected_feature_freeze\": {\n        \"features\": corrected_feature_payload,\n\
        \        \"sha256\": corrected_feature_sha,\n        \"hard_quarantine\": sorted(HARD_QUARANTINE),\n    },\n    \"\
        preregistration\": prereg,\n    \"firewalls\": {\n        \"nfl_outcomes_read\": False,\n        \"model_fit_performed\"\
        : False,\n        \"outcome_based_feature_selection_performed\": False,\n        \"current_fv_read_for_selection\"\
        : False,\n        \"ktc_read\": False,\n        \"dlf_market_data_read\": False,\n        \"production_change_authorized\"\
        : False,\n    },\n}\n\nout_json = out_dir / \"dlf_prospect_fv_v1_phase1b3_preregistration_correction.json\"\nout_md\
        \ = out_dir / \"dlf_prospect_fv_v1_phase1b3_preregistration_correction.md\"\n\nout_json.write_text(json.dumps(result,\
        \ indent=2, sort_keys=True) + \"\\n\")\n\nmd = [\n    \"# DLF Prospect FV V1 \u2014 Phase 1B3 Pre-Outcome Preregistration\
        \ Correction\",\n    \"\",\n    \"**Decision:** `FREEZE_CORRECTED_PREREGISTRATION_NO_OUTCOMES_READ`\",\n    \"\",\n\
        \    \"## Identity retained unchanged\",\n    \"\",\n    f\"- Mapped: **{identity['mapped_rows']}/{identity['historical_drafted_rows']}\
        \ \"\n    f\"({identity['overall_coverage_pct']:.2f}%)**\",\n    f\"- Ambiguous: **{identity['ambiguous_rows']}**\"\
        ,\n    f\"- Identity SHA-256: `{EXPECTED_IDENTITY_SHA}`\",\n    \"\",\n    \"## Why this correction exists\",\n  \
        \  \"\",\n    \"The green Phase 1B source and identity work passed, but its original feature \"\n    \"freeze left\
        \ more candidate-model freedom than intended. This correction was \"\n    \"made before opening NFL outcomes.\",\n\
        \    \"\",\n    \"Breakout-derived fields (`BOY*` / `BOA*`) are now hard-quarantined. More \"\n    \"constructed advanced\
        \ metrics are diagnostic-only. The primary candidate is \"\n    \"limited to interpretable basic college production\
        \ plus raw athletic inputs.\",\n    \"\",\n    \"## Corrected primary features\",\n    \"\",\n]\nfor pos in POSITIONS:\n\
        \    md.append(f\"### {pos}\")\n    md.append(\n        \"- Basic production: \"\n        + \", \".join(f\"`{x}`\"\
        \ for x in primary[pos][\"basic_production\"])\n    )\n    md.append(\n        \"- Raw athletic: \"\n        + (\n\
        \            \", \".join(f\"`{x}`\" for x in primary[pos][\"raw_athletic\"])\n            if primary[pos][\"raw_athletic\"\
        ]\n            else \"_none_\"\n        )\n    )\n    md.append(\"\")\n\nmd.extend([\n    f\"Corrected feature-freeze\
        \ SHA-256: `{corrected_feature_sha}`\",\n    \"\",\n    \"## Phase 1C success gate\",\n    \"\",\n    \"All of the\
        \ following are required: >=2% pooled MAE improvement; paired \"\n    \"bootstrap 95% CI entirely below zero for candidate-minus-baseline\
        \ absolute \"\n    \"error; improvement in at least 4/7 held-out draft years; no position worse \"\n    \"by >5% MAE;\
        \ and at least 2/4 positions improve.\",\n    \"\",\n    \"Passing Phase 1C would establish historical incremental\
        \ signal only. It \"\n    \"would not authorize a production FV weight or deployment.\",\n])\n\nout_md.write_text(\"\
        \\n\".join(md) + \"\\n\")\n\nprint(json.dumps({\n    \"decision\": result[\"decision\"],\n    \"mapped_identity_sha256\"\
        : EXPECTED_IDENTITY_SHA,\n    \"identity_coverage_pct\": identity[\"overall_coverage_pct\"],\n    \"corrected_feature_freeze_sha256\"\
        : corrected_feature_sha,\n    \"primary_feature_counts\": {\n        pos: len(primary[pos][\"all_primary_features\"\
        ]) for pos in POSITIONS\n    },\n    \"secondary_diagnostic_counts\": {\n        pos: len(secondary[pos]) for pos\
        \ in POSITIONS\n    },\n    \"outcomes_read\": False,\n    \"model_fit_performed\": False,\n}, indent=2))\nPY"
    - name: Prove no repository changes
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: preregistration correction is outcome-blind and repo-clean.'
    - name: Upload corrected preregistration
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1b3-preregistration-correction
        path: ${{ runner.temp }}/dlf-phase1b3/
        if-no-files-found: error
        retention-days: 14
