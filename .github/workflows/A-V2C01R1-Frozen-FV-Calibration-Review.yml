name: A-V2C01R1 - Frozen FV Calibration Evidence Review (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-v2c01r1-review
  cancel-in-progress: false

jobs:
  evidence-review:
    name: Analyze aligned frozen evidence without model selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify clean working tree and production files before research
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum index.html free-agent-board.html > "$RUNNER_TEMP/v2c01-production-before.sha256"

      - name: Materialize review-only evidence inspector
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a_v2c01_r1.py" <<'PY_REVIEW'
          #!/usr/bin/env python3
          """A-V2C01R1: evidence-only calibration review of the seven already-frozen V2 studies.

          No fitting, retuning, source ingestion, production mutation, or winner selection.
          All metrics are as published by their native preregistered evaluators.
          """
          import csv
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          from datetime import datetime, timezone

          ROOT = Path("research")
          OUT = Path(os.environ["RUNNER_TEMP"]) / "v2c01-frozen-evidence-review"
          OUT.mkdir(parents=True, exist_ok=True)
          POSITION_ORDER = ("QB", "RB", "WR", "TE", "DL", "LB", "DB")
          SOURCES = {
              "production": "production-v2/production_v2_phase9_evaluation.json",
              "position_weight": "position-weight-v2/position_weight_v2_phase5_evaluation.json",
              "replacement": "replacement-level-v2/replacement_level_v2_phase5_evaluation.json",
              "age": "age-curve-v2/age_curve_v2_phase5_evaluation.json",
              "opportunity": "opportunity-v2/opportunity_v2_phase5_evaluation.json",
              "rookie": "no-history-v2/no_history_v2_phase3_evaluation.json",
              "durability": "durability-v2/durability_v2_phase5_evaluation.json",
              "apex": "cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.json",
              "program_status": "research-program-status-v1/research_program_status_v1_status.json",
          }


          def require(cond, message):
              if not cond:
                  raise RuntimeError("A_V2C01_" + message)


          def load(name):
              p = ROOT / SOURCES[name]
              data = p.read_bytes()
              obj = json.loads(data)
              return obj, {"path": str(p), "sha256": hashlib.sha256(data).hexdigest(),
                           "size_bytes": len(data)}


          def fmt(v, digits=4, signed=False):
              if v is None: return "—"
              if isinstance(v, float) and not math.isfinite(v): return "—"
              return (f"{v:+.{digits}f}" if signed else f"{v:.{digits}f}")


          def percent(v):
              return "—" if v is None else f"{100*v:.2f}%"


          def table(lines, cols, rows):
              lines.append("| " + " | ".join(cols) + " |")
              lines.append("|" + "|".join("---" for _ in cols) + "|")
              for row in rows:
                  lines.append("| " + " | ".join(str(x).replace("|", "\\|") for x in row) + " |")
              lines.append("")


          def comparison_rows(metrics, target, control_key="deployed_control"):
              ctrl = metrics[control_key]["overall"][target]
              result = []
              for name, payload in sorted(metrics.items()):
                  m = payload["overall"][target]
                  result.append({"variant": name, "spearman": m["spearman"],
                                 "delta_spearman": m["spearman"]-ctrl["spearman"],
                                 "pairwise": m["pairwise_ordering_accuracy"],
                                 "mae": m["minmax_normalized_mae"], "n": m["n"],
                                 "per_position": {
                                     pos: {"spearman": payload["by_position"][pos][target]["spearman"],
                                           "delta_spearman": payload["by_position"][pos][target]["spearman"]
                                               - metrics[control_key]["by_position"][pos][target]["spearman"],
                                           "n": payload["by_position"][pos][target]["n"]}
                                     for pos in POSITION_ORDER}}
                                 )
              return result


          def main():
              docs={}; hashes={}
              for key in SOURCES:
                  docs[key],hashes[key]=load(key)
              core=("production","position_weight","replacement","age","opportunity","rookie")
              weeks={}
              for key in core+("durability",):
                  d=docs[key]
                  w=d["completed_prefix_weeks"] if key=="production" else d["completed_consecutive_weeks_used"]
                  require(w and w==list(range(1,max(w)+1)), "NONCONSECUTIVE_"+key.upper())
                  require(d.get("deployment_authorized") is False, "DEPLOYMENT_PERMISSION_"+key.upper())
                  require(d["status"] in {"CALIBRATION_REVIEW_ELIGIBLE_NOT_DEPLOYMENT",
                                          "CALIBRATION_REVIEW_ELIGIBLE",
                                          "COLLECTION_ONLY_INTERIM_BYE_UNADJUSTED"}, "UNEXPECTED_STATUS_"+key.upper())
                  freeze=d.get("frozen_prediction_sha256") or d.get("frozen_candidate_sha256")
                  require(isinstance(freeze,str) and re.fullmatch(r"[0-9a-f]{64}",freeze), "MISSING_FROZEN_SHA_"+key.upper())
                  weeks[key]=w
              common=weeks["production"]
              require(all(weeks[key]==common for key in core+("durability",)), "OUTCOME_WEEK_MISALIGNMENT")
              require(len(common)>=8,"NOT_CALIBRATION_REVIEW_ELIGIBLE")

              result={"schema_version":1,"review_id":"A-V2C01R1",
                      "generated_at_utc":datetime.now(timezone.utc).isoformat(),
                      "completed_weeks":common,"native_evaluation_sources":hashes,
                      "calibration_review_only":True,"candidate_selection_authorized":False,
                      "parameter_refitting_performed":False,"new_statistical_gates_added":False,
                      "production_change_authorized":False,"not_a_cross_study_combined_candidate":True}
              lines=["# A-V2C01R1 — Frozen FV calibration evidence review", "",
                     "**Research-only diagnostic. No winner selection, no threshold changes, and no production authorization.**", "",
                     f"- Aligned completed NFL weeks: **{common}**.",
                     "- Evidence is re-read from committed native evaluator JSONs. Source SHA256 hashes are in the attached JSON.",
                     "- A high rank in the same observed window is not an independent holdout. Published paired bootstraps are descriptive, not corrected for searching 120 Production V2 variants.",
                     "- Seven studies are reviewed; Durability's full-season outcome is not yet available.","",
                     "## 1. Production V2 — independent windows and multiple-comparison caution", ""]

              prod=docs["production"]
              w=prod["windows"]
              a=w["weeks_1_to_4"];b=w["weeks_5_to_8"];c=w["weeks_1_to_8"]
              require(a["weeks"]==[1,2,3,4] and b["weeks"]==[5,6,7,8] and c["weeks"]==list(range(1,9)), "PROD_WINDOWS")
              require(len(a["top_variants"])>=10 and len(b["top_variants"])>=10, "PROD_TOP10_MISSING")
              topa={x["variant"] for x in a["top_variants"][:10]}
              topb={x["variant"] for x in b["top_variants"][:10]}
              actual=len(topa&topb)
              require(actual==prod["stability"]["top10_overlap_1_4_vs_5_8"],"PROD_OVERLAP_DISAGREEMENT")
              require(a["top_variants"][0]["variant"]!=b["top_variants"][0]["variant"],"PROD_WINNER_STABILITY_STATUS_CHANGED")
              rows=[]
              for label,sample in [("Weeks 1–4",a),("Weeks 5–8",b),("Weeks 1–8",c)]:
                  t=sample["top_variants"][0];control=sample["deployed_control_metrics"]["primary_prod_mult_vs_active_ppg"]
                  rows.append((label,t["variant"],fmt(t["primary"]["spearman"]),
                               fmt(control["spearman"]),fmt(t["primary_spearman_delta_vs_deployed"],signed=True),
                               str(sample["deployed_control_rank_among_121"])+"/121"))
              table(lines,["Evaluation window","Top frozen variant","Top ρ","Control ρ","Δρ","Control rank"],rows)
              lines += [f"- Top-10 overlap across independent 4-week windows: **{actual}/10**.",
                        "- Different winning variants across windows: **yes**. Do not choose a pooled Week-1–8 winner from the same evidence used for discovery.",
                        "- Only previously published top-five paired bootstrap intervals are reported; they do not eliminate the 120-variant selection issue.", ""]
              bstrap=[]
              for candidate, e in sorted(c["top5_paired_bootstrap_vs_deployed"].items()):
                  bstrap.append((candidate,fmt(e["observed_spearman_delta_vs_deployed"],signed=True),
                                  f"[{fmt(e['ci95'][0],signed=True)}, {fmt(e['ci95'][1],signed=True)}]",e["reps"]))
              table(lines,["Already-published top-five candidate","Δρ vs control","Unadjusted bootstrap 95% CI","Reps"],bstrap)
              prodrec={"top_10_overlap":actual,"tops_by_window":{k:v["top_variants"][0]["variant"] for k,v in w.items()},
                       "stability_claim_authorized":False,"candidate_selection_authorized":False}
              result["production"]=prodrec

              lines += ["## 2. Position Weight V2 — cross-position pair risk", ""]
              pw=docs["position_weight"]
              left=pw["variant_scores"]["deployed_control"]["cross_position_pairwise"]
              right=pw["variant_scores"]["bridge_50"]["cross_position_pairwise"]
              require(set(left["by_position_pair"])==set(right["by_position_pair"]),"POSITION_PAIR_SET_DRIFT")
              pair_rows=[];pos_neg=[]
              for pair in sorted(left["by_position_pair"]):
                  x=left["by_position_pair"][pair];y=right["by_position_pair"][pair]
                  require(x["comparable"]==y["comparable"],"POSITION_PAIR_N_CHANGED_"+pair.replace(" ","_"))
                  delta=y["accuracy"]-x["accuracy"]
                  if delta<0:pos_neg.append((pair,delta))
                  pair_rows.append((pair,x["comparable"],percent(x["accuracy"]),percent(y["accuracy"]),fmt(delta,signed=True)))
              overall_delta=right["accuracy"]-left["accuracy"]
              lines += [f"- Cross-position pairwise accuracy: **{percent(left['accuracy'])} → {percent(right['accuracy'])}**; absolute delta **{fmt(overall_delta,signed=True)}**.",
                        f"- Pair types with negative delta: **{len(pos_neg)}/{len(pair_rows)}**; this is a descriptive sign count, not a frozen promotion gate.",""]
              table(lines,["Pair","N","Control accuracy","Bridge-50 accuracy","Δ accuracy"],pair_rows)
              result["position_weight"]={"overall_accuracy_control":left["accuracy"],"overall_accuracy_bridge_50":right["accuracy"],
                                          "negative_pair_types":pos_neg,"all_pair_deltas":pair_rows}

              lines += ["## 3. Replacement Level V2 — position-specific error", ""]
              rep=docs["replacement"]["primary_active_game_ppg_relative_production"]["variants"]
              control=rep["legacy_control"]
              rep_rows=[];rep_detail={}
              for name,x in sorted(rep.items()):
                  negative=[];improved=[];changes={}
                  for pos in POSITION_ORDER:
                      baseline=control["by_position"][pos]["metrics"]["mae"]
                      value=x["by_position"][pos]["metrics"]["mae"]
                      delta=value-baseline
                      changes[pos]=delta
                      if delta>0:negative.append(pos)
                      if delta<0:improved.append(pos)
                  rec={"position_balanced_mae":x["position_balanced_mean_mae"],
                       "delta_mae_vs_control":x["position_balanced_mean_mae"]-control["position_balanced_mean_mae"],
                       "worse_positions":negative,"better_positions":improved,"position_mae_deltas":changes}
                  rep_detail[name]=rec
                  rep_rows.append((name,fmt(rec["position_balanced_mae"]),fmt(rec["delta_mae_vs_control"],signed=True),
                                   ", ".join(negative) or "none",", ".join(improved) or "none"))
              table(lines,["Frozen replacement family","Pos-balanced MAE","Δ MAE","Worse positions","Better positions"],rep_rows)
              lines += ["- A lower MAE is better. These alternatives have not been combined with Position Weight V2 or Production V2.",""]
              result["replacement"]=rep_detail

              for study,title in [("age","Age Curve V2"),("opportunity","Opportunity / Role Signal V2")]:
                  lines += ["## " + ("4." if study=="age" else "5.") + " " + title + " — by-position primary outcomes", ""]
                  d=docs[study]
                  variants=comparison_rows(d["metrics"],"value_vs_total_points")
                  rows=[]
                  for x in variants:
                      harmful=[p for p,v in x["per_position"].items() if v["delta_spearman"]<0]
                      rows.append((x["variant"],fmt(x["spearman"]),fmt(x["delta_spearman"],signed=True),
                                   fmt(x["mae"]),", ".join(harmful) or "none"))
                  table(lines,["Frozen variant","Primary ρ","Δρ vs control","Normalized MAE","Positions with lower ρ"],rows)
                  lines += ["- Primary target is total future points, not active-game production. A secondary improvement alone does not justify promotion.",""]
                  result[study]={"variant_results":variants}

              lines += ["## 6. Rookie / No-History V2 — primary versus secondary disagreement", ""]
              roo=docs["rookie"]
              baseline=roo["metrics"]["prospect_prior_weight_0.00"]
              rrows=[];rr={}
              for name,x in sorted(roo["metrics"].items()):
                  t=x["fundamental_value_vs_total_points"];z=x["fundamental_value_vs_active_ppg"]
                  base=baseline["fundamental_value_vs_total_points"]
                  rrows.append((name,fmt(t["spearman"]),fmt(t["spearman"]-base["spearman"],signed=True),
                                fmt(z["spearman"]),fmt(t["pairwise_ordering_accuracy"])))
                  rr[name]={"primary_total_points_spearman":t["spearman"],
                            "primary_delta_vs_zero_prior":t["spearman"]-base["spearman"],
                            "secondary_active_ppg_spearman":z["spearman"]}
              table(lines,["Prospect-prior weight","Total-points ρ","Δ primary ρ","Active-PPG ρ","Total-points pairwise"],rrows)
              lines += ["- The primary comparison remains against the frozen **zero-prior** control. No post-hoc switch to the active-PPG target.",""]
              result["rookie"]={"variant_results":rr}

              lines += ["## 7. Durability V2 — not evaluable for season-end authority", ""]
              durability=docs["durability"]
              require(durability["season_complete_authoritative_target_available"] is False,"DURABILITY_COMPLETION_CHANGED")
              lines += ["- Frozen status: `"+durability["status"]+"`.",
                        "- Full-season games-played / 17 is the required primary target; bye-unadjusted interim statistics are **non-authoritative**.",
                        "- Keep collecting. Do not promote or reject a durability candidate from the interim data.",""]
              result["durability"]={"season_complete_authoritative_target_available":False,
                                    "decision":"COLLECT_ONLY"}

              lines += ["## 8. Cross-study conflict and decision firewall", ""]
              apex=docs["apex"];program=docs["program_status"]
              lines += ["- Last committed cross-position apex reconciliation: `"+str(apex.get("decision",apex.get("status","unknown")))+"`.",
                        "- The old apex reconciliation references Week 1 and is not a new combined Week 9 evaluation.",
                        "- Combining the best results from separate studies would create a new, unvalidated model and could double-count structural adjustments.",
                        "- The Research Program Status report was generated at **"+str(program.get("generated_at_utc","unknown"))+"**; its Week-1 labels are superseded by the aligned Week-9 evidence here.",
                        "- This diagnostic uses existing evaluation files only. It does not compute a combined cross-study winner, new holdout significance, or promotion gate.",""]
              result["cross_study"]={"apex_prior_decision":apex.get("decision"),
                                     "program_status_last_generated_at_utc":program.get("generated_at_utc"),
                                     "combined_model_evaluated":False}
              lines += ["## Next authorized process (no release)", "",
                        "1. Preserve the candidate and evaluator freezes. Continue collection into Weeks 10–11 and formal stability review at Week 12+.",
                        "2. If a separate reconciled combination is proposed, preregister its composition, guardrails, and genuinely unopened confirmation sample **before** selecting any settings.",
                        "3. Keep Legacy FV V1, all production valuation components, Team Utility, Package Adjustment, and Market Value deployed settings unchanged.", ""]
              (OUT/"A-V2C01R1-Frozen-FV-Review.md").write_text("\n".join(lines),encoding="utf-8")
              (OUT/"A-V2C01R1-Frozen-FV-Review.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
              with (OUT/"A-V2C01R1-Source-Hashes.csv").open("w",newline="",encoding="utf-8") as f:
                  writer=csv.writer(f); writer.writerow(["study","path","sha256","size_bytes"])
                  for study,d in sorted(hashes.items()):writer.writerow([study,d["path"],d["sha256"],d["size_bytes"]])
              print(json.dumps({"status":"PASS_RESEARCH_ONLY_FROZEN_CALIBRATION_REVIEW",
                                "completed_week":common[-1],"top_10_production_overlap":actual,
                                "position_weight_negative_pairs":len(pos_neg),
                                "output_directory":str(OUT),"production_authorized":False},indent=2))


          if __name__=="__main__":
              main()
          PY_REVIEW
          python3 -m py_compile "$RUNNER_TEMP/a_v2c01_r1.py"

      - name: Review six calibration-eligible studies and durability
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/a_v2c01_r1.py"
          cat "$RUNNER_TEMP/v2c01-frozen-evidence-review/A-V2C01R1-Frozen-FV-Review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove production and repository remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/v2c01-production-before.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY_VERIFY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v2c01-frozen-evidence-review/A-V2C01R1-Frozen-FV-Review.json'
          x=json.loads(p.read_text())
          assert x['production_change_authorized'] is False
          assert x['candidate_selection_authorized'] is False
          assert x['parameter_refitting_performed'] is False
          assert x['not_a_cross_study_combined_candidate'] is True
          assert len(x['native_evaluation_sources'])==9
          print('PASS: read-only evidence, no candidate selection, production parity unchanged')
          PY_VERIFY

      - name: Upload immutable run-specific review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-V2C01R1-Frozen-FV-Evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/v2c01-frozen-evidence-review/
          if-no-files-found: warn
          retention-days: 90
