      - name: Prove exactly three intended research files changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v6/prospective_power_analysis_v1.json",
              "research/package-adjustment-v6/prospective_power_analysis_v1.md",
              "research/package-adjustment-v6/prospective_power_analysis_manifest_v1.json",
          }

          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          actual = {line[3:] for line in lines if line.strip()}

          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )

          print("PASS: only the three intended V6 power-analysis files changed.")
          PY

      - name: Upload V6 prospective power-analysis proof
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v6-prospective-power-analysis-proof
          path: |
            research/package-adjustment-v6/prospective_power_analysis_v1.json
            research/package-adjustment-v6/prospective_power_analysis_v1.md
            research/package-adjustment-v6/prospective_power_analysis_manifest_v1.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit frozen V6 power analysis to main
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          P="$D/prospective_power_analysis_v1.json"
          M="$D/prospective_power_analysis_v1.md"
          MAN="$D/prospective_power_analysis_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$P" "$M" "$MAN"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=("$P" "$M" "$MAN")
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          test "${#STAGED[@]}" -eq 3
          test "$(printf '%s\n' "${STAGED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m "Freeze Package Adjustment V6 prospective power analysis"
          git pull --rebase origin main

          test "$(git hash-object "$D/development_preregistration_v1.json")" = \
            "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/development_exact_700_frozen_v1.json")" = \
            "fd7097335bebae209bb380c121f44debf7d0cb82"
          test "$(git hash-object "$D/development_candidate_v1.json")" = \
            "446a176757919be3deef0659ac01e05884be4007"

          git push origin main
          echo "PASS: V6 prospective power analysis frozen; production remains V1.6."
