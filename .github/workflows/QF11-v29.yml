name: QF11 V29 - KTC V1 and V2 Market Research UI Stage Deployment
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: trade-desk-ktc-v2-ui-staging-deploy
  cancel-in-progress: false
jobs:
  deploy_ui_only:
    name: Rename KTC V1 and place disabled KTC V2 below mock-trade voting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main with deployment permissions
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Verify frozen source pins before UI work
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        [[ -f data/players_cache.json ]] || { echo STOP_MUTABLE_CACHE_MISSING; exit 1; }
        echo QF11_V29_FROZEN_SOURCE_PINS_GREEN
    - name: Apply exact KTC V1 name and stage KTC V2 after trade package voting
      run: "set -euo pipefail\npython3 - <<'QF11_V29_APPLY'\nimport hashlib\nimport json\nfrom pathlib\
        \ import Path\n\nsource=Path('index.html')\noriginal=source.read_text(encoding='utf-8')\nOLD_LABEL='<div\
        \ class=\"section-label\" style=\"margin-top:20px;\">Keep / Trade / Cut</div>'\nNEW_LABEL='<div\
        \ class=\"section-label\" style=\"margin-top:20px;\">KTC V1 \u2014 Keep / Trade / Cut</div>'\n\
        UI_BLOCK='<!-- QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_START: presentation only; no voting or respondent\
        \ collection -->\\n<style id=\"qf11-v29-ktc-v2-stage-style\">\\n  #qf11KtcV2Section { margin:24px\
        \ 0 12px; }\\n  #qf11KtcV2Section .qf11-v2-intro { display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;\
        \ }\\n  #qf11KtcV2Section .qf11-v2-pill { color:var(--gold,#e8bd73); border:1px solid currentColor;border-radius:99px;padding:4px\
        \ 9px;font-size:10px;font-weight:700;white-space:nowrap; }\\n  #qf11KtcV2Section .qf11-v2-legend\
        \ { margin:12px 0 5px; display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px; }\\\
        n  #qf11KtcV2Section .qf11-v2-role { border:1px solid var(--line,rgba(255,255,255,.16));border-radius:8px;padding:12px\
        \ 9px;background:rgba(255,255,255,.025); }\\n  #qf11KtcV2Section .qf11-v2-role strong { display:block;font-family:\\\
        'IBM Plex Mono\\',monospace;font-size:11px;letter-spacing:.03em;margin-bottom:4px; }\\n  #qf11KtcV2Section\
        \ .qf11-v2-role span { font-size:11px;color:var(--text-muted,var(--text-dim,#aab));line-height:1.4;\
        \ }\\n  #qf11KtcV2Section .qf11-v2-foot { margin:10px 0 2px; font-size:11px;color:var(--text-dim,#aab);line-height:1.5;\
        \ }\\n  @media(max-width:540px) { #qf11KtcV2Section .qf11-v2-legend { grid-template-columns:1fr;gap:6px;\
        \ } }\\n</style>\\n<script id=\"qf11-v29-ktc-v2-stage-runtime\">\\n/* QF11 V29: isolated presentation\
        \ section only. Do not introduce any collector or recording path here. */\\n(function () {\\n\
        \  \\'use strict\\';\\n  function install() {\\n    if (document.getElementById(\\'qf11KtcV2Section\\\
        ')) return;\\n    var packageVoting = document.getElementById(\\'packageVoteWrap\\');\\n    if\
        \ (!packageVoting || !packageVoting.parentNode) return;\\n    var section = document.createElement(\\\
        'section\\');\\n    section.id = \\'qf11KtcV2Section\\';\\n    section.setAttribute(\\'aria-label\\\
        ', \\'KTC V2 research preview, voting not yet available\\');\\n    section.innerHTML = `\\n  \
        \    <div class=\"section-label\" style=\"margin-top:20px;\">KTC V2 \u2014 Keep / Trade / Cut</div>\\\
        n      <div class=\"vote-help-card\">\\n        <div class=\"qf11-v2-intro\">\\n          <div\
        \ class=\"vote-help-label\">New dynasty ranking research</div>\\n          <span class=\"qf11-v2-pill\"\
        >COMING SOON \xB7 NOT COLLECTING VOTES</span>\\n        </div>\\n        <div class=\"vote-help-text\"\
        \ style=\"margin-top:8px;\">\\n          <strong>Rank three dynasty players based on your own\
        \ preference.</strong>\\n          KEEP is your favorite, TRADE is your second favorite, and CUT\
        \ is your least favorite.\\n          These are hypothetical rankings only \u2014 no real roster\
        \ moves occur.\\n        </div>\\n        <div class=\"qf11-v2-legend\" aria-label=\"How KTC V2\
        \ ranking works\">\\n          <div class=\"qf11-v2-role\"><strong>KEEP</strong><span>Your most\
        \ preferred player</span></div>\\n          <div class=\"qf11-v2-role\"><strong>TRADE</strong><span>Your\
        \ second-most preferred player</span></div>\\n          <div class=\"qf11-v2-role\"><strong>CUT</strong><span>Your\
        \ least preferred player</span></div>\\n        </div>\\n        <p class=\"qf11-v2-foot\">V2\
        \ is separate from KTC V1 and trade-package voting. The V2 ballot, independent response handling\
        \ and participant safeguards are still under review. V2 does not currently accept or save answers,\
        \ and it does not affect Market Value or Fundamental Value.</p>\\n      </div>`;\\n    packageVoting.insertAdjacentElement(\\\
        'afterend\\', section);\\n  }\\n  if (document.readyState === \\'loading\\') {\\n    document.addEventListener(\\\
        'DOMContentLoaded\\', install, {once:true});\\n  } else {\\n    install();\\n  }\\n})();\\n</script>\\\
        n<!-- QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_END -->'\nMARKER='QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_START'\n\
        \ndef require(ok,why):\n    if not ok: raise SystemExit('QF11_V29_STOP_'+why)\n\nrequire(MARKER\
        \ not in original,'PREEXISTING_STAGE')\nrequire(original.count(OLD_LABEL)==1,'V1_SECTION_ANCHOR_CHANGED')\n\
        require(original.count('id=\"ktcWrap\"')==1,'V1_CONTAINER_DRIFT')\nrequire(original.count('id=\"\
        packageVoteWrap\"')==1,'PACKAGE_CONTAINER_DRIFT')\nrequire(original.count(\"moveVoteSection(marketPane,\
        \ 'ktcWrap');\")==1,'MARKET_NAV_KTC_CHANGED')\nrequire(original.count(\"moveVoteSection(marketPane,\
        \ 'packageVoteWrap');\")==1,'MARKET_NAV_PACKAGE_CHANGED')\nrequire(original.count('function ktcSubmit()')==1,'ORIGINAL_V1_COLLECTOR_CHANGED')\n\
        require(original.count('</body>')==1,'END_BODY_DRIFT')\nrequire(original.index('id=\"ktcWrap\"\
        ') < original.index('id=\"packageVoteWrap\"'),'SOURCE_VOTE_ORDER_DRIFT')\n\nupdated=original.replace(OLD_LABEL,NEW_LABEL,1).replace('</body>',UI_BLOCK+'\\\
        n</body>',1)\nrequire(updated.replace(UI_BLOCK+'\\n','',1).replace(NEW_LABEL,OLD_LABEL,1)==original,'NONSCOPED_DIFF')\n\
        require(updated.count('id=\"qf11KtcV2Section\"')==0,'DYNAMIC_CONTAINER_COLLISION')\nrequire(updated.count('qf11KtcV2Section')\
        \ >= 3,'STAGE_MISSING')\nsource.write_text(updated,encoding='utf-8')\nPath('/tmp/qf11-v29-inline-ui.js').write_text(UI_BLOCK.split('<script\
        \ id=\"qf11-v29-ktc-v2-stage-runtime\">')[1].split('</script>')[0],encoding='utf-8')\nmanifest={\n\
        \ 'schema':'QF11_V29_MARKET_RESEARCH_UI_ONLY_DEPLOY',\n 'base_index_sha256':hashlib.sha256(original.encode()).hexdigest(),\n\
        \ 'modified_index_sha256':hashlib.sha256(updated.encode()).hexdigest(),\n 'changes':['Rename visible\
        \ existing KTC heading to KTC V1','Add KTC V2 below trade-package voting within Market Research','Disable\
        \ V2 collection and keep real study concealed'],\n 'v1_vote_submission_or_collection_modified':False,\n\
        \ 'package_vote_submission_modified':False,\n 'v2_vote_submission_enabled':False,\n 'v2_recruits_or_real_votes':0,\n\
        \ 'production_market_value_or_fv_changed':False,\n 'owner_requested_ui_only':True,\n}\nPath('/tmp/qf11-v29-ui-stage-manifest.json').write_text(json.dumps(manifest,indent=2)+'\\\
        n')\nprint('QF11_V29_SCOPED_MARKET_RESEARCH_UI_PATCH_GREEN '+json.dumps(manifest,sort_keys=True))\n\
        \nQF11_V29_APPLY\n"
    - name: Check isolated client code and prevent production data collection
      run: "set -euo pipefail\nnode --check /tmp/qf11-v29-inline-ui.js\npython3 - <<'PY'\nimport json\n\
        from pathlib import Path\ns=Path('/tmp/qf11-v29-inline-ui.js').read_text()\nraw=Path('index.html').read_text()\n\
        a=json.loads(Path('/tmp/qf11-v29-ui-stage-manifest.json').read_text())\nassert all(token not in\
        \ s for token in ('fetch(', 'XMLHttpRequest', 'WebSocket(', 'sendBeacon(', 'localStorage', 'sessionStorage',\
        \ 'document.cookie', 'eval(', 'KTC_SUBMIT_URL', 'ktcSubmit(', 'packageVoteSubmit('))\nassert 'packageVoting.insertAdjacentElement(\\\
        'afterend\\', section)' in s\nassert 'document.addEventListener(\\'DOMContentLoaded\\', install'\
        \ in s\nassert raw.count('KTC V1 \u2014 Keep / Trade / Cut')==1\nassert raw.count('KTC V2 \u2014\
        \ Keep / Trade / Cut')==1\nassert raw.count('QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_START')==1\n\
        assert 'NOT COLLECTING VOTES' in s\nassert a['v2_vote_submission_enabled'] is False\nprint('QF11_V29_NO_COLLECTOR_NO_NETWORK_NO_STORAGE_STAGE_GREEN')\n\
        PY\n"
    - name: Smoke test KTC V2 DOM placement after mock-trade voting
      run: "set -euo pipefail\nnode <<'QF11_V29_DOM'\nconst fs=require('fs'),vm=require('vm');\nconst\
        \ script=fs.readFileSync('/tmp/qf11-v29-inline-ui.js','utf8');\nlet added=null;\nconst packageWrap={parentNode:{},insertAdjacentElement(pos,element){added={pos,element}}};\n\
        const document={\n  readyState:'complete',\n  getElementById(id){return id==='packageVoteWrap'?packageWrap:null},\n\
        \  createElement(tag){if(tag!=='section')throw Error('unexpected element');return {id:'',innerHTML:'',attributes:{},setAttribute(k,v){this.attributes[k]=v}}}\n\
        };\nvm.runInNewContext(script,{document});\nif(!added || added.pos!=='afterend')throw Error('KTC\
        \ V2 not placed after package vote');\nif(added.element.id!=='qf11KtcV2Section')throw Error('wrong\
        \ V2 section ID');\nconst html=added.element.innerHTML;\nfor(const s of ['KTC V2 \u2014 Keep /\
        \ Trade / Cut','COMING SOON','NOT COLLECTING VOTES','KEEP','TRADE','CUT'])if(!html.includes(s))throw\
        \ Error('V2 content missing: '+s);\nif(/<button|<form|type=\"submit\"/.test(html))throw Error('unapproved\
        \ interactive collection');\nconsole.log('QF11_V29_MARKET_TAB_AFTER_PACKAGE_PLACEMENT_GREEN');\n\
        QF11_V29_DOM\n"
    - name: Run all 14 frozen repo regression groups and release selftests
      run: |
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V29_FROZEN_14_REGRESSIONS_GREEN
    - name: Prove exact two-site-presentation edits and no protected changes
      run: "set -euo pipefail\n[[ \"$(git diff --name-only | wc -l | tr -d ' ')\" == '1' ]] || { echo\
        \ STOP_EXTRA_MODIFIED_PATHS; exit 1; }\n[[ \"$(git diff --name-only)\" == 'index.html' ]] || {\
        \ echo STOP_UNAUTHORIZED_PATH_EDIT; exit 1; }\ngit diff --check\npython3 - <<'PY'\nimport subprocess\n\
        from pathlib import Path\nbase=subprocess.check_output(['git','show','HEAD:index.html'],text=True)\n\
        actual=Path('index.html').read_text()\nold='<div class=\"section-label\" style=\"margin-top:20px;\"\
        >Keep / Trade / Cut</div>'\nnew='<div class=\"section-label\" style=\"margin-top:20px;\">KTC V1\
        \ \u2014 Keep / Trade / Cut</div>'\nblock=actual.split('<!-- QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_START')[1].split('<!--\
        \ QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_END -->')[0]\nmarker='<!-- QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_START'+block+'<!--\
        \ QF11_V29_KTC_V2_MARKET_RESEARCH_STAGE_END -->'\nrestored=actual.replace(marker+'\\n','',1).replace(new,old,1)\n\
        assert restored==base,'STOP_NONSCOPED_PAGE_CHANGE'\nassert 'fetch(KTC_SUBMIT_URL' in actual\n\
        assert actual.count(\"moveVoteSection(marketPane, 'ktcWrap');\")==1\nassert actual.count(\"moveVoteSection(marketPane,\
        \ 'packageVoteWrap');\")==1\nprint('QF11_V29_ONLY_APPROVED_UI_DELTA_GREEN')\nPY\ncheck(){ [[ \"\
        $(git hash-object \"$1\")\" == \"$2\" ]] || { echo \"STOP_FROZEN_DRIFT: $1\"; exit 1; }; }\ncheck\
        \ scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8\ncheck\
        \ scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f\n\
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264\ncheck\
        \ scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79\necho QF11_V29_POST_STAGE_MODEL_PROTECTED_GREEN\n"
    - name: Archive UI-only deployment manifest
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v29-UI-ONLY-market-research-v1-v2-layout
        path: /tmp/qf11-v29-ui-stage-manifest.json
        retention-days: 7
        if-no-files-found: error
    - name: Commit and deploy only the approved index.html UI staging change
      run: |
        set -euo pipefail
        [[ "$(git diff --name-only)" == 'index.html' ]] || { echo STOP_UNEXPECTED_MODIFICATION; exit 1; }
        git fetch origin main --quiet
        [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo STOP_MAIN_ADVANCED_RETRY_LATER; exit 1; }
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- index.html
        [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo STOP_STAGED_PATH_DRIFT; exit 1; }
        git commit -m 'Market Research: label KTC V1 and stage KTC V2 below package voting'
        git push origin HEAD:refs/heads/main
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_AFTER_DEPLOY_DIRTY; exit 1; }
        echo "QF11_V29_UI_STAGE_DEPLOYED_GREEN $(git rev-parse HEAD)"
