# CAL26 V1R26: point-in-time QB production evidence comparison; NO FV model trained and NO pricing changes.
name: CAL26 V1R26 - Preseason QB Prospective Evidence Benchmark READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r26-preseason-qb-prospective-benchmark-read-only
  cancel-in-progress: false
jobs:
  benchmark:
    name: Reproduce 64 frozen QBs and evaluate preseason vs 6-week football outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm branch and clean repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download exact green V1R25R1 frozen 64 QB source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r25r1"
          gh run download 39890393453 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R25-Frozen-64-QB-Source-Feature-Assembly-READ-ONLY \
            --dir "$RUNNER_TEMP/cal26-v1r25r1"
          test -s "$RUNNER_TEMP/cal26-v1r25r1/CAL26_V1R25_Manifest.json"
          test -s "$RUNNER_TEMP/cal26-v1r25r1/CAL26_V1R25_Frozen_64_QB_Source_Features_READ_ONLY.csv"
      - name: Materialize immutable benchmark engine and regression-test six-week counts
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r26_benchmark.py" <<'PY_CAL26_V1R26_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R26: fixed accounting, QB preseason prospective benchmark; read only."""
          from __future__ import annotations
          import argparse,csv,hashlib,json,math,statistics
          from collections import Counter
          from pathlib import Path
          SRC_CSV='CAL26_V1R25_Frozen_64_QB_Source_Features_READ_ONLY.csv'
          EXPECTED_SOURCE_SHA='70960bd043d5bb56b9764efc59c1e5c14313d1233c2955376980d15c8d2a42c6'
          EXPECTED_V1R25_RUN=39890393453
          
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def number(s):
              if s is None or s=='': return None
              try:
                  v=float(s)
                  return v if math.isfinite(v) else None
              except (ValueError,TypeError):return None
          
          def ranks(xs):
              order=sorted(range(len(xs)),key=lambda i:xs[i]); ranks=[0.0]*len(xs)
              k=0
              while k<len(order):
                  j=k+1
                  while j<len(order) and xs[order[j]]==xs[order[k]]:j+=1
                  avg=(k+1+j)/2
                  for i in order[k:j]:ranks[i]=avg
                  k=j
              return ranks
          
          def spearman_pairs(rows, xkey, ykey='weeks_1_to_6_actual_ppg'):
              a=[(number(r[xkey]),number(r[ykey])) for r in rows]
              good=[(x,y) for x,y in a if x is not None and y is not None]
              if len(good)<5:return (len(good),None)
              x=ranks([v[0] for v in good]);y=ranks([v[1] for v in good]);
              mx=sum(x)/len(x);my=sum(y)/len(y)
              vx=sum((v-mx)**2 for v in x);vy=sum((v-my)**2 for v in y)
              if vx==0 or vy==0:return(len(good),None)
              return (len(good),sum((p-mx)*(q-my) for p,q in zip(x,y))/(vx*vy)**0.5)
          
          def run(source:Path,out:Path):
              csvpath=source/SRC_CSV
              assert sha(csvpath)==EXPECTED_SOURCE_SHA,'Source frozen feature file SHA drift'
              m=json.loads((source/'CAL26_V1R25_Manifest.json').read_text())
              assert m['files'][SRC_CSV]==EXPECTED_SOURCE_SHA
              assert m['counts']['qb_total']==64 and m['counts']['all_live_players']==565
              assert m['features_model_fitted'] is False and m['production_change_authorized'] is False
              with csvpath.open(newline='',encoding='utf-8') as f: records=list(csv.DictReader(f))
              assert len(records)==64 and len({r['canonical_name'] for r in records})==64
              assert Counter(r['owner_feedback_direction'] for r in records)=={'Too low':22,'Too high':18,'Correct':24}
              assert all(r['position']=='QB' for r in records)
              assert all(number(r['current_live_fv'])==number(r['frozen_owner_review_fv']) for r in records)
              assert all(r['source_ros_forecast_asof_week6']=='NOT_VERIFIED_FOR_QB' for r in records)
              assert all(r['dlf_2026_10_19_dynasty_sf_rank']=='' for r in records)
              games=[number(r['weeks_1_to_6_actual_games']) for r in records]
              assert all(g is None or (g>=0 and int(g)==g and g<=6) for g in games)
              has_game=[r for r in records if (number(r['weeks_1_to_6_actual_games']) or 0)>0]
              three=[r for r in records if (number(r['weeks_1_to_6_actual_games']) or 0)>=3]
              # These validate a real count regression: the predecessor used isinstance(x,int) on CSV strings/numeric floats.
              assert len(has_game)==43, f'Unexpected real-game coverage: {len(has_game)}'
              assert len(three)==32, f'Unexpected 3-game coverage: {len(three)}'
              assert m['counts']['has_week1to6_scored_games']==0,'Previous broken counter changed; review gate'
              # Period/case aliases were resolved upstream, not modified here.
              assert any(r['canonical_name']=='michael penix jr' for r in records)
              sources={
                'preseason_fantasypros':'preseason_2026_fantasypros_points',
                'preseason_sleeper':'preseason_2026_sleeper_points',
                'preseason_blended':'preseason_2026_blended_points',
                '2025_history_component':'historical_2025_component',
              }
              # For fair head-to-head compare forecast pairs on identical QBs (not varying cohorts).
              cohorts={
                'three_or_more_scored_games':three,
                'all_at_least_one_scored_game':has_game,
                'three_games_fp_sleeper_shared':[r for r in three if number(r['preseason_2026_fantasypros_points']) is not None and number(r['preseason_2026_sleeper_points']) is not None],
              }
              assert len(cohorts['three_games_fp_sleeper_shared'])>=8
              rows=[]
              for cohort, sub in cohorts.items():
                  for source_name,key in sources.items():
                      n,corr=spearman_pairs(sub,key)
                      rows.append({'cohort':cohort,'source':source_name,'available_n':n,'spearman_active_ppg':f'{corr:.6f}' if corr is not None else '', 'interpretation':'EARLY_6_WEEK_FOOTBALL_PRODUCTION_DIAGNOSTIC_ONLY'})
              # Frozen current FV includes in-season information; descriptive, NOT fair preseason backtest.
              descriptive_n, descriptive_corr=spearman_pairs(three,'current_live_fv')
              perplayer=[]
              for r in sorted(records,key=lambda z:-int(z['current_live_fv'])):
                  gam=number(r['weeks_1_to_6_actual_games']);ppg=number(r['weeks_1_to_6_actual_ppg'])
                  perplayer.append({
                    'canonical_name':r['canonical_name'],'feedback':r['owner_feedback_direction'],
                    'current_fv_descriptive_not_frozen_preseason':r['current_live_fv'],
                    'preseason_fantasypros_pts':r['preseason_2026_fantasypros_points'],
                    'preseason_sleeper_pts':r['preseason_2026_sleeper_points'],
                    'preseason_blend_pts':r['preseason_2026_blended_points'],
                    'historical_2025_component':r['historical_2025_component'],
                    'history_is_real':r['historical_2025_note']=='real',
                    'actual_w1_to_w6_games':int(gam) if gam is not None else '',
                    'actual_w1_to_w6_ppg':r['weeks_1_to_6_actual_ppg'],
                    'three_game_eligible':bool(gam is not None and gam>=3),
                    'qb_ros_forecast_present':False,'dynasty_rank_present_in_public_repo':False,
                    'model_fit_or_pricing_authorized':False,
                  })
              out.mkdir(parents=True,exist_ok=True)
              outbench='CAL26_V1R26_Preseason_Forward_vs_Observed_6_Week_Comparisons.csv'
              outplayers='CAL26_V1R26_64_QB_Forward_Benchmark_Audit.csv'
              for name,rs in [(outbench,rows),(outplayers,perplayer)]:
                  with (out/name).open('w',encoding='utf-8',newline='') as f:
                      w=csv.DictWriter(f,fieldnames=list(rs[0]));w.writeheader();w.writerows(rs)
              good=[]
              for r in rows:
                  if r['cohort']=='three_games_fp_sleeper_shared' and r['spearman_active_ppg']:
                      good.append((r['source'],r['available_n'],r['spearman_active_ppg']))
              report='CAL26_V1R26_Preseason_Source_Predictive_Audit_Report.md'
              lines=[
                 '# CAL26 V1R26 — Verified Preseason QB Predictive Evidence',
                 '', '**Decision: Early production signal audit only. No dynasty-FV fit, no pricing authorization.**',
                 '', '## Corrected coverage for frozen 2026 Weeks 1–6',
                 '',f'- Exact QB population: **{len(records)}**',
                 f'- QB with 1+ scored game: **{len(has_game)}** (predecessor report incorrectly showed zero)',
                 f'- QB with 3+ scored games: **{len(three)}**',
                 f'- QBs with 3+ games and both preseason projection sources: **{len(cohorts["three_games_fp_sleeper_shared"])}**',
                 '', '## Same-player comparison (3+ games, both preseason projection providers)',
                 '', '| Source | N | Spearman vs active PPG in Weeks 1–6 |', '|---|---:|---:|',
              ]+[f'| {x} | {n} | {rho} |' for x,n,rho in good]+[
                 '',f'- Contemporary FV vs 2026 observed active PPG: Spearman {descriptive_corr:.4f} (N={descriptive_n}); **not a true preseason forecast, must not be ranked as one**.',
                 '', '## Boundaries',
                 '', '- Preseason frozen forward projections use full-season point totals; the target here is observed active-game PPG. This is a **rank-order diagnostic**, not a points MAE or dynasty calibration.',
                 '- Small six-week samples, byes, uneven health, changing starting roles and incomplete source data can distort rankings.',
                 '- The `historical_2025_component` includes full position-mean shrinkage when actual history is missing; the CSV preserves provenance and does not interpret this as real history.',
                 '- The previous zero-games metric was caused by testing numeric objects for `int` after storage as decimal text/float. Corrected here with strict numeric parsing.',
                 '- No full-QB dated rest-of-season provider forecast was available in the frozen V1R25 dataset.',
                 '- Licensed DLF rankings remain in a **separate private owner-side file**; no proprietary ranking rows or false FantasyPros dynasty ECR populated in GitHub.',
                 '- 4for4 is not independently added as a second DLF dynasty vote.',
                 '- No coefficient, age premium, market price or player FV was fitted or changed.',
                 '', '## Next',
                 '', 'Use the retained DLF dynasty ranks privately alongside this verified production baseline; obtain distinct dated FantasyPros dynasty ECR and ROS forecasts before external-signal calibration. Compare against future held-out results.',
              ]
              (out/report).write_text('\n'.join(lines)+'\n',encoding='utf-8')
              manifest={
                'status':'PASS_CAL26_V1R26_READ_ONLY_PRESEASON_QB_PROSPECTIVE_BENCHMARK',
                'source_v1r25r1_run':EXPECTED_V1R25_RUN,
                'source_csv_sha256':EXPECTED_SOURCE_SHA,
                'source_manifest_sha256':sha(source/'CAL26_V1R25_Manifest.json'),
                'qb_count':64,'global_player_count':565,
                'qbs_with_any_2026_w1_w6_scored_games':43,'qbs_with_three_or_more_scored_games':32,
                'shared_cohort_size':len(cohorts['three_games_fp_sleeper_shared']),
                'correct_owner_feedback_controls':24,
                'production_change_authorized':False,'production_mutations':0,
                'fitted_model_coefficients':False,'private_dlf_rank_data_included':False,
                'files':{f:sha(out/f) for f in [outbench,outplayers,report]},
              }
              (out/'CAL26_V1R26_Manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n',encoding='utf-8')
              print(json.dumps({'status':manifest['status'],'counts':{'any':43,'three':32,'shared':manifest['shared_cohort_size']},'same_players':good},indent=2))
          
          def selftest():
            assert number('6.0')==6 and number('0.0')==0 and number('') is None
            assert not isinstance(number('6.0'),int), 'numeric cast regression'
            assert ranks([10,20,20,30])==[1.,2.5,2.5,4.]
            assert spearman_pairs([{'x':'1','y':'9'},{'x':'2','y':'8'},{'x':'3','y':'7'},{'x':'4','y':'6'},{'x':'5','y':'5'}],'x','y')[1]<-0.99
            assert spearman_pairs([{'x':'1','y':'1'}],'x','y')[1] is None
            print('PASS numeric coverage, correlation ties, sign, minimum cohort and zero absence');
          if __name__=='__main__':
            p=argparse.ArgumentParser();p.add_argument('--source',type=Path);p.add_argument('--out',type=Path);p.add_argument('--selftest',action='store_true');a=p.parse_args()
            if a.selftest:selftest()
            else:
              assert a.source and a.out
              run(a.source,a.out)
          PY_CAL26_V1R26_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r26_benchmark.py"
          python3 "$RUNNER_TEMP/cal26_v1r26_benchmark.py" --selftest
      - name: Compare frozen QB preseason forecasts to real Weeks 1 through 6 outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r26_benchmark.py" \
            --source "$RUNNER_TEMP/cal26-v1r25r1" \
            --out "$RUNNER_TEMP/CAL26_V1R26_Evidence"
      - name: Independently verify all 64 QBs 43 scored players and 32 established samples
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAL26_V1R26_VERIFY'
          import csv,hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R26_Evidence'
          m=json.loads((out/'CAL26_V1R26_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R26_READ_ONLY_PRESEASON_QB_PROSPECTIVE_BENCHMARK'
          assert (m['qb_count'],m['global_player_count'])==(64,565)
          assert (m['qbs_with_any_2026_w1_w6_scored_games'],m['qbs_with_three_or_more_scored_games'])==(43,32)
          assert m['source_v1r25r1_run']==39890393453 and m['correct_owner_feedback_controls']==24
          assert not m['production_change_authorized'] and m['production_mutations']==0
          assert not m['fitted_model_coefficients'] and not m['private_dlf_rank_data_included']
          for file,digest in m['files'].items():
              assert hashlib.sha256((out/file).read_bytes()).hexdigest()==digest, file
          with (out/'CAL26_V1R26_64_QB_Forward_Benchmark_Audit.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==64 and len({r['canonical_name'] for r in rows})==64
          assert sum(r['actual_w1_to_w6_games'] not in ('','0') for r in rows)==43
          assert sum(r['three_game_eligible']=='True' for r in rows)==32
          assert all(r['model_fit_or_pricing_authorized']=='False' for r in rows)
          with (out/'CAL26_V1R26_Preseason_Forward_vs_Observed_6_Week_Comparisons.csv').open(newline='') as f:
              metric=list(csv.DictReader(f))
          assert len(metric)==12
          print('PASS independent audit: 64 QBs, 43 active, 32 >=3 games, 12 metric rows, source digest matched, no pricing')
          PY_CAL26_V1R26_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS repository clean, no model updates'
      - name: Upload nonproprietary read-only QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R26-Preseason-QB-Prospective-Evidence-Benchmark-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R26_Evidence
          if-no-files-found: error
          retention-days: 60
