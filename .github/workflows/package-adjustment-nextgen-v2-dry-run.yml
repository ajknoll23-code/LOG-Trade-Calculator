name: Package Adjustment NextGen V2 Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-adjustment-nextgen-v2-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exact reviewed NextGen files
        shell: bash
        run: |
          set -euo pipefail

          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"
          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"

          test -f "$SPEC"
          test -f "$GEN"

          SPEC_SHA="$(sha256sum "$SPEC" | awk '{print $1}')"
          GEN_SHA="$(sha256sum "$GEN" | awk '{print $1}')"

          test "$SPEC_SHA" = "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"
          test "$GEN_SHA" = "d94ebd0d2f2779da788a1fe96853c10dcff625511e3e3ed1a2614e530c8304ab"

          echo "Spec SHA-256:      $SPEC_SHA"
          echo "Generator SHA-256: $GEN_SHA"
          echo "HEAD: $(git rev-parse HEAD)"

      - name: Verify production Package Adjustment is still exact-live V1.6
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Syntax check and generator self-test
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py")
          source = path.read_text(encoding="utf-8")
          compile(source, str(path), "exec")
          print("Python compile: PASS")
          PY

          PYTHONDONTWRITEBYTECODE=1 python3             research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py             --selftest

      - name: Dry run against current repository data
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 python3             research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py             --dry-run | tee /tmp/package_adjustment_nextgen_v2_dry_run.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/package_adjustment_nextgen_v2_dry_run.json")
          doc = json.loads(path.read_text(encoding="utf-8"))

          assert doc["status"] == "dry_run_passed"
          assert int(doc["challenge_count"]) > 0
          assert float(doc["v_ref"]) > 0

          family_counts = doc["family_counts"]
          assert int(family_counts.get("core_concentration_2v2", 0)) > 0
          assert int(family_counts.get("fragmentation_filler", 0)) > 0
          assert int(family_counts.get("structural_topology_3v3", 0)) > 0

          split_counts = doc["split_counts"]
          assert int(split_counts.get("train", 0)) > 0
          assert int(split_counts.get("structural_scale_holdout", 0)) > 0
          assert int(split_counts.get("structural_topology_holdout", 0)) > 0

          anchors = doc["scale_anchors"]
          low = float(anchors["low"])
          mid = float(anchors["mid"])
          high = float(anchors["high"])
          assert 0 < low < mid < high

          print("Dry-run JSON validation: PASS")
          print("Challenges:", doc["challenge_count"])
          print("V_REF:", doc["v_ref"])
          print("Scale anchors:", anchors)
          print("Family counts:", family_counts)
          print("Split counts:", split_counts)
          print("Skipped/underfilled cells:", doc["skipped_or_underfilled_cells"])
          PY

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Prove dry run wrote no research outputs
        shell: bash
        run: |
          set -euo pipefail

          test ! -e research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json
          test ! -e research/package-adjustment-nextgen-v2/challenge_catalog_design.md

          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

          echo "PASS: dry run changed no repository files."
