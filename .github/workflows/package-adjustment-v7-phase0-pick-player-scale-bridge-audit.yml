name: Package Adjustment V7 Phase 0 - Pick Player Scale Bridge Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  phase0-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard current V6 production and clean starting tree
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain=v1)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          live_path = Path(
              "research/package-adjustment-production-candidate-v1/"
              "live_deployment.json"
          )
          live = json.loads(live_path.read_text(encoding="utf-8"))

          assert live["status"] == "controlled_live"
          assert live["production_formula_enabled"] is True
          assert live["production_revision"] == "v1.7-v6-size3-c2-overlay"
          assert live["package_adjustment_candidate_id"] == (
              "package-adjustment-v6-c2-size3-overlay-candidate-v1"
          )
          assert live["draft_pick_value_consumer_changed"] is False
          assert live["fundamental_value_consumer_changed"] is False
          assert live["market_value_consumer_changed"] is False
          assert live["team_utility_consumer_changed"] is False
          assert live["audit_hardening"]["v6_size3_c2_overlay_enabled"] is True
          assert live["audit_hardening"]["v6_picks_excluded"] is True

          index = Path("index.html").read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_V1_7_V6_C2_SIZE3" in index
          assert "size3V6Q: 2.9897594788655337" in index
          assert "const PICK_BASE = {" in index
          assert "const YEAR_DISCOUNT = {" in index

          out_dir = Path("research/package-adjustment-v7")
          expected = [
              out_dir / "phase0_market_anchor_snapshot_v1.json",
              out_dir / "phase0_pick_player_scale_bridge_audit.py",
              out_dir / "phase0_pick_player_scale_bridge_v1.json",
              out_dir / "phase0_pick_player_scale_bridge_v1.md",
              out_dir / "phase0_pick_player_scale_bridge_manifest_v1.json",
          ]
          existing = [str(p) for p in expected if p.exists()]
          assert not existing, (
              "Phase 0 is freeze-once and refuses to overwrite existing artifacts: "
              + ", ".join(existing)
          )

          print("PASS: current production is V1.7/V6 and Phase 0 outputs do not exist.")
          PY

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Run repository regression suite before audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Freeze Phase 0 market anchors and audit code
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-v7"
          mkdir -p "$D"

          cat > "$D/phase0_market_anchor_snapshot_v1.json" <<'JSON'
