      - name: Verify production and repository regression after audit
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Prove Phase 0 touched research artifacts only
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          printf 'Changed/untracked paths:\n'
          printf '  %s\n' "${changed[@]}"

          expected=(
            "research/package-adjustment-v7/phase0_market_anchor_snapshot_v1.json"
            "research/package-adjustment-v7/phase0_pick_player_scale_bridge_audit.py"
            "research/package-adjustment-v7/phase0_pick_player_scale_bridge_manifest_v1.json"
            "research/package-adjustment-v7/phase0_pick_player_scale_bridge_v1.json"
            "research/package-adjustment-v7/phase0_pick_player_scale_bridge_v1.md"
          )

          test "${#changed[@]}" -eq "${#expected[@]}"

          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

          test -z "$(git diff --name-only -- index.html)"
          test -z "$(git diff --name-only -- \
            research/package-adjustment-production-candidate-v1/live_deployment.json)"

          echo "PASS: only the five frozen Phase 0 research artifacts changed."

      - name: Commit frozen Phase 0 audit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-v7/phase0_market_anchor_snapshot_v1.json \
            research/package-adjustment-v7/phase0_pick_player_scale_bridge_audit.py \
            research/package-adjustment-v7/phase0_pick_player_scale_bridge_manifest_v1.json \
            research/package-adjustment-v7/phase0_pick_player_scale_bridge_v1.json \
            research/package-adjustment-v7/phase0_pick_player_scale_bridge_v1.md

          git diff --cached --check

          # Refuse to freeze results against a stale base. If main moved while
          # this diagnostic was running, fail cleanly and rerun the workflow so
          # the bridge audit is recomputed against the new production state.
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          git commit -m "Freeze V7 Phase 0 pick-player scale bridge audit"
          git push origin HEAD:main
