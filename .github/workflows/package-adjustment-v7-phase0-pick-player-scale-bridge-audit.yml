              "overall_material_rule": "At least two of the three primary 2027 first-round bridge cases must be material in the same direction.",
              "primary_cases": ["2027_early_1st", "2027_mid_1st", "2027_late_1st"],
              "decision_if_material": "INVESTIGATE_DRAFT_PICK_TO_PLAYER_FV_BRIDGE_BEFORE_V7_PHASE1",
              "decision_if_not_material": "PROCEED_TO_V7_PHASE1_ASSET_TYPE_EXPERIMENT",
              "interpretation": "Diagnostic only. A material result identifies an upstream scale-bridge research problem; it does not authorize changing pick values or package adjustment."
