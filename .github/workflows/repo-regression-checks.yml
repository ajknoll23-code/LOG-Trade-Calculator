name: Repo Regression Checks

# Read-only safety suite for the cross-file invariants fixed in the 2026-08-28
# repository audit. No generated data is committed from this workflow.
on:
  workflow_dispatch: {}
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run focused self-tests
        run: |
          python3 scripts/snapshot_values.py --selftest
          python3 scripts/sync_sleeper.py --selftest
          python3 scripts/dual_eligibility_pipeline.py --selftest
          python3 scripts/team_field_refresh_pipeline.py --selftest
          python3 scripts/generate_player_positions.py --selftest

      - name: Run repository regression suite
        run: python3 scripts/repo_regression_checks.py
