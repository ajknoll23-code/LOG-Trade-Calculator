name: CAL26 V1R68 - Official 2026 Scoring Field Parity Closure (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r68-2026-week6-scoring-field-parity
  cancel-in-progress: false
jobs:
  verified-scoring-field-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Read-only checkout of pinned 2026 scoring rules
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download actual successful R67 source-pinned official scoring evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R67_OFFICIAL_SCORING_ALIAS_REPAIR_AND_DL_FORENSICS_FV_HOLD
        run-id: 40067998217
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r68-inputs/R67
    - name: Resolve blocked kick category and certify official scoring overlap parity
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R68_engine.py\" <<'PY_CAL26_V1R68_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"CAL26 V1R68: source-pinned adjudication of the four blocked-kick exceptions.\nRead-only.\
        \ Applies an evidence-only adjustment to R67 shadow rows, not repo\nscoring or FV. Official-scored coverage\
        \ is not all 518 players.\n\"\"\"\nimport argparse,csv,hashlib,json,math,pathlib,collections\n\nART='CAL26_R67_OFFICIAL_SCORING_ALIAS_REPAIR_AND_DL_FORENSICS_FV_HOLD'\n\
        R67_RUN=40067998217\nR67_MANIFEST='CAL26_V1R67_manifest.json'\nINPUT_ROWS='CAL26_V1R67_official_overlap_before_after.csv'\n\
        INPUT_FORENSICS='CAL26_V1R67_8_exception_field_forensics.csv'\nINPUT_PLAYERS='CAL26_V1R67_518_scoring_shadow_NOT_FV.csv'\n\
        SCORE_SETTINGS='data/trade_history.json'\nSCORE_BLOB='aa0ff2f2e839d3fc6aec67cfc6615c4130844ef3'\nSOURCE_R67_STATUS='FOUR_TD_ALIAS_RECONCILED__FOUR_OFFICIAL_SCORING_EXCEPTIONS_OPEN__FV_HOLD'\n\
        \n\ndef check(ok,msg):\n    if not ok:raise AssertionError(msg)\n\ndef digest(x):return hashlib.sha256(x).hexdigest()\n\
        \ndef gitblob(x):return hashlib.sha1(b'blob '+str(len(x)).encode()+b'\\0'+x).hexdigest()\n\ndef loadcsv(path):\n\
        \    with path.open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))\n\ndef savecsv(path,rs,fields):\n\
        \    with path.open('w',newline='',encoding='utf-8') as f:\n        w=csv.DictWriter(f,fields,extrasaction='ignore');w.writeheader();w.writerows(rs)\n\
        \ndef num(x):\n    y=float(x);check(math.isfinite(y),'NONFINITE_NUMBER');return y\n\ndef tag(x):return (str(x['sleeper_id']),int(x['week']))\n\
        \ndef read_pins(path):\n    m=json.loads((path/R67_MANIFEST).read_text())\n    check(m['status']==SOURCE_R67_STATUS\
        \ and m['players']==518 and m['official_player_weeks']==2620,'R67_CONTRACT_DRIFT')\n    check(m['original_official_mismatch_count']==8\
        \ and m['post_alias_official_mismatch_count']==4,'R67_MISMATCH_COUNTER_DRIFT')\n    check(m['source_weeks']==[1,2,3,4,5,6]\
        \ and m['input_stats_byte_pins_verified'],'R67_SOURCE_WEEK_OR_PIN_DRIFT')\n    check(not m['production_change_authorized']\
        \ and not m['price_scale_calibrated'],'R67_RELEASE_TAINT')\n    for n,sha in m['output_sha256'].items():\n\
        \        check(digest((path/n).read_bytes())==sha,'R67_OUTPUT_HASH_DRIFT:'+n)\n    return m\n\ndef load_scoring(repo,fixture):\n\
        \    b=(repo/SCORE_SETTINGS).read_bytes()\n    if not fixture:check(gitblob(b)==SCORE_BLOB,'LEAGUE_SCORING_BLOB_DRIFT')\n\
        \    d=json.loads(b)\n    years={str(x['season']):x['scoring_settings'] for x in d['seasons']}\n    check('2026'\
        \ in years,'MISSING_2026_LEAGUE_SCORING')\n    st=years['2026'];check(num(st['idp_blk_kick'])==6 and num(st['idp_def_td'])==6,'SCORING_SIX_POINT_RULE_CHANGED')\n\
        \    return {'2026_idp_blk_kick':st['idp_blk_kick'],'2026_idp_def_td':st['idp_def_td'],'league_source_sha1':gitblob(b)}\n\
        \ndef adjudicate(r,settings):\n    rows=loadcsv(r/INPUT_ROWS);forensic=loadcsv(r/INPUT_FORENSICS);players=loadcsv(r/INPUT_PLAYERS)\n\
        \    check(len(rows)==2620 and len(forensic)==8 and len(players)==518,'INPUT_COUNT_DRIFT')\n    check(len({tag(v)\
        \ for v in rows})==2620,'DUPLICATED_OFFICIAL_WEEK')\n    check(len({tag(v) for v in forensic})==8,'DUPLICATED_EXCEPTION')\n\
        \    check(all(x['production_change_authorized']=='False' for x in rows+forensic+players),'ARTIFACT_PRODUCTION_TAINT')\n\
        \    by_week={tag(v):v for v in rows}\n    known_kicks={};known_td={}\n    for f in forensic:\n        t=tag(f);check(t\
        \ in by_week,'MISSING_EXCEPTION_OFFICIAL_ROW')\n        raw=json.loads(f['all_nonzero_source_stats_JSON'])\n\
        \        official=by_week[t]\n        check(abs(num(f['remaining_official_residual'])-num(official['residual_after_td_alias']))<1e-7,'FORENSIC_OFFICIAL_DRIFT')\n\
        \        check(num(f['original_official_residual'])==6,'ORIGINAL_EXCEPTION_NOT_SIX')\n        if f['status']=='RECONCILED_BY_SUPPORTED_TD_ALIAS':\n\
        \            check(num(raw.get('idp_def_td',0))==1 and num(raw.get('idp_td',0))==0,'TD_SOURCE_FIELD_NOT_CORROBORATED')\n\
        \            check(num(f['remaining_official_residual'])==0 and num(official['strict_td_field_alias_delta_NOT_RELEASED'])==6,'TD_ALREADY_APPLIED_DRIFT')\n\
        \            known_td[t]=f\n        else:\n            check(f['status']=='UNEXPLAINED_REQUIRES_SOURCE_AND_CATEGORY_ADJUDICATION','UNKNOWN_EXCEPTION_CLASS')\n\
        \            check(f['position']=='DL' and num(raw.get('idp_blk_kick',0))==1,'BLOCKED_KICK_NOT_PRESENT')\n\
        \            check(num(raw.get('blk_kick',0))==0,'DOUBLE_COUNT_BLK_KICK')\n            check(num(raw.get('idp_def_td',0))==0\
        \ and num(raw.get('idp_td',0))==0,'DOUBLE_COUNT_DEF_TD')\n            check(num(f['remaining_official_residual'])==6\
        \ and num(official['strict_td_field_alias_delta_NOT_RELEASED'])==0,'BLOCKED_KICK_RESIDUAL_DRIFT')\n    \
        \        known_kicks[t]=f\n    check(len(known_td)==4 and len(known_kicks)==4,'EXPECTED_EIGHT_CATEGORIES')\n\
        \    ids={t[0] for t in known_kicks};check(len(ids)==4,'KICK_IDS_NOT_UNIQUE')\n    match=[];orig_bad=0;td_bad=0;final_bad=0\n\
        \    position=collections.Counter();err_by_position=collections.Counter()\n    for x in rows:\n        t=tag(x);official=num(x['official_2026_league_points']);orig=num(x['original_reconstructed_points']);post_td=num(x['corrected_shadow_points_NOT_RELEASED'])\n\
        \        d_td=num(x['strict_td_field_alias_delta_NOT_RELEASED']);corrected=post_td+(6 if t in known_kicks\
        \ else 0)\n        check(abs(orig+d_td-post_td)<.0001,'R67_INTERNAL_SUM_DRIFT')\n        resid=round(official-corrected,6)\n\
        \        o=abs(official-orig)>.05;a=abs(official-post_td)>.05;b=abs(resid)>.05\n        orig_bad+=o;td_bad+=a;final_bad+=b\n\
        \        position[x['position']]+=1;err_by_position[x['position']]+=b\n        match.append({'week':t[1],'name':x['name'],'position':x['position'],'sleeper_id':t[0],\n\
        \          'R67_original_scored':round(orig,5),'R67_TD_alias_delta':round(d_td,5),\n          '2026_blocked_kick_increment_NOT_RELEASED':6\
        \ if t in known_kicks else 0,\n          '2026_field_corrected_shadow_NOT_FV':round(corrected,5),'official_scored':round(official,5),\n\
        \          'post_correction_official_residual':resid,'official_parity_within_0_05':not b,'production_change_authorized':False})\n\
        \    check(orig_bad==8 and td_bad==4,'R67_ORIGINAL_COMPARISON_DRIFT')\n    check(final_bad==0,'OFFICIAL_PLAYER_WEEK_PARITY_NOT_2620_OF_2620')\n\
        \    known_by_pid=collections.defaultdict(list)\n    for (pid,w),f in known_kicks.items():known_by_pid[pid].append(w)\n\
        \    outputs=[]\n    for p in players:\n        sid=p['sleeper_id'];d=6*len(known_by_pid[sid]);pval=p['2026_sixweek_corrected_SCORING_SHADOW_NOT_FV']\n\
        \        out={\n         'name':p['name'],'position':p['position'],'sleeper_id':sid,\n         'frozen_FV_UNCHANGED':p['frozen_FV_UNCHANGED'],\n\
        \         'R67_original_sixweek_score':p['original_sixweek_points'],\n         '2026_TD_alias_correction_NOT_FV':p['isolated_alias_correction_NOT_RELEASED'],\n\
        \         '2026_official_verified_block_kick_correction_NOT_FV':round(d,4) if sid else '',\n         '2026_known_alias_plus_kick_shadow_NOT_FV':round(num(pval)+d,4)\
        \ if sid else '',\n         'official_block_kick_exception_weeks':';'.join(map(str,sorted(known_by_pid[sid]))),\n\
        \         'complete_all_sixweek_official_scoring_for_player_certified':False,\n         'production_change_authorized':False}\n\
        \        if sid:check(pval!='','OBSERVED_PLAYER_MISSING_SCORING')\n        outputs.append(out)\n    check(len(outputs)==518\
        \ and sum(num(p['2026_official_verified_block_kick_correction_NOT_FV']) for p in outputs if p['sleeper_id'])==24,'FOUR_KICKS_NOT_MAPPED_TO_518')\n\
        \    check(sum(num(p['2026_TD_alias_correction_NOT_FV']) for p in outputs if p['sleeper_id'])==30,'ORIGINAL_TD_ALIAS_CORRECTION_DRIFT')\n\
        \    exception=[]\n    for f in forensic:\n        t=tag(f);d=6 if t in known_kicks else 0\n        exception.append({'name':f['name'],'position':f['position'],'week':t[1],'sleeper_id':t[0],\n\
        \          'source_field':'idp_blk_kick' if d else 'idp_def_td',\n          '2026_league_scoring_weight':settings['2026_idp_blk_kick']\
        \ if d else settings['2026_idp_def_td'],\n          'extra_points_from_this_category':6,\n          'was_supported_by_independent_official_scoring':True,\n\
        \          'residual_after_all_supported_corrections':0,\n          'production_change_authorized':False})\n\
        \    summary=[{'position':pos,'official_player_weeks':position[pos],\n      'unresolved_official_mismatches_after_correction':err_by_position[pos],\n\
        \      'official_scoring_overlap_parity':err_by_position[pos]==0,'production_FV_reprice_authorized':False}\n\
        \      for pos in ['QB','RB','WR','TE','DL','LB','DB']]\n    return match,outputs,exception,summary\n\n\
        def main(args):\n    src=pathlib.Path(args.r67);out=pathlib.Path(args.out);out.mkdir(parents=True,exist_ok=True)\n\
        \    m=read_pins(src);settings=load_scoring(pathlib.Path(args.repo),bool(args.fixture))\n    match,players,exc,summ=adjudicate(src,settings)\n\
        \    files={\n     'CAL26_V1R68_2620_official_scoring_parity.csv':match,\n     'CAL26_V1R68_518_supported_scoring_adjustments_NOT_FV.csv':players,\n\
        \     'CAL26_V1R68_8_field_adjudications.csv':exc,\n     'CAL26_V1R68_7_position_official_score_parity.csv':summ}\n\
        \    for fn,rows in files.items():savecsv(out/fn,rows,list(rows[0]))\n    text=['# CAL26 V1R68 \u2014 2026\
        \ Week 1\u20136 official-scored parity closure','','**Decision: OFFICIAL_2620_OF_2620_SCORER_FIELD_PARITY_GREEN__NO_FV_RELEASE**','',\n\
        \      '- R67 compared 2,620 real official player-weeks and documented eight six-point gaps.',\n      '-\
        \ Four `idp_def_td` aliases were already supported by R67; the remaining four source records each contain\
        \ `idp_blk_kick = 1` and an official six-point residual.',\n      '- The **2026 LOG league scoring contract**\
        \ independently sets both `idp_def_td` and `idp_blk_kick` to six points.',\n      '- Applying only the eight\
        \ corroborated field events yields **2,620 / 2,620** official comparison parity within 0.05 points.',\n\
        \      '- R67 had 30 points of TD-alias shadow differences over 518 players; this adds **24** officially\
        \ corroborated blocked-kick points. Total documented candidate shadow adjustment = **54** points (not FV).',\n\
        \      '- This tests official **rostered player-week overlap** only, not every unrostered player or every\
        \ field in full NFL statistics.',\n      '- No 2026 Week 7+ data read; historical 2021\u20132025 scoring\
        \ remains separate from 2026 league rules.',\n      '- **Next: focus on scoring-compatible multi-year forecasts,\
        \ then the empirical 0\u201310,000 FV scale; no arbitrary per-point multiplier.**',\n      '- No source\
        \ code, index.html, prices, votes, roster data, or frozen FV is written.','']\n    (out/'CAL26_V1R68_decision.md').write_text('\\\
        n'.join(text))\n    manifest={'workflow':'CAL26 V1R68','status':'OFFICIAL_2620_OF_2620_FIELD_CORRECTIONS_PARITY_GREEN__FV_HOLD',\n\
        \      'r67_run':R67_RUN,'r67_artifact_name':ART,'fixture':bool(args.fixture),'official_comparisons':len(match),\n\
        \      'official_parity_passed':all(x['official_parity_within_0_05'] for x in match),\n      'post_all_field_alias_mismatches':0,'TD_alias_events_official_supported':4,\n\
        \      'blocked_kick_events_official_supported':4,'candidate_2026_shadow_total_adjustment_points':54,\n\
        \      '2026_scoring_contract_repo_git_blob':settings['league_source_sha1'],\n      'source_week_range':[1,2,3,4,5,6],'week7_or_later_read':False,\n\
        \      '2021_25_2026_scoring_equivalence_claimed':False,\n      'all_518_complete_official_scoring_claimed':False,'owner_targets_used':False,\n\
        \      'fundamental_value_scale_calibrated':False,'production_change_authorized':False,\n      'outputs_sha256':{f:digest((out/f).read_bytes())\
        \ for f in list(files)+['CAL26_V1R68_decision.md']}}\n    (out/'CAL26_V1R68_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\\
        n')\n    print('R68_OFFICIAL_FIELD_PARITY',json.dumps({'official_comparisons':len(match),'parity':manifest['official_parity_passed'],'blocked_kicks':4,'production':False}))\n\
        \ndef selftest():\n    f={'all_nonzero_source_stats_JSON':json.dumps({'idp_blk_kick':1})}\n    d=json.loads(f['all_nonzero_source_stats_JSON']);check(num(d.get('idp_blk_kick',0))==1\
        \ and not d.get('blk_kick'),'BLOCK_KICK_FIXTURE')\n    check(num('0.05')==.05,'NUMBER_SELFTEST')\n    try:check(False,'TAMPER_INJECTION')\n\
        \    except AssertionError as e:check(str(e)=='TAMPER_INJECTION','GUARD_NOT_THROWN')\n    else:raise AssertionError('GUARD_NOT_THROWN')\n\
        \    print('R68_SELFTEST_GREEN six-point blocked kick, number safety, fail-closed guard')\n\nif __name__=='__main__':\n\
        \    p=argparse.ArgumentParser();p.add_argument('--r67');p.add_argument('--repo');p.add_argument('--out');p.add_argument('--fixture',action='store_true');p.add_argument('--selftest',action='store_true');a=p.parse_args()\n\
        \    selftest() if a.selftest else main(a)\n\nPY_CAL26_V1R68_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R68_engine.py\"\
        \npython \"$RUNNER_TEMP/CAL26_V1R68_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_V1R68_engine.py\"\
        \  --r67 \"$RUNNER_TEMP/cal26-r68-inputs/R67\"  --repo \"$GITHUB_WORKSPACE\"  --out \"$RUNNER_TEMP/cal26-r68-results\"\
        \npython - \"$RUNNER_TEMP/cal26-r68-results\" <<'PY_CAL26_V1R68_VERIFY'\nimport csv,hashlib,json,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R68_manifest.json').read_text())\nassert not m['fixture']\
        \ and m['r67_run']==40067998217\nassert m['status']=='OFFICIAL_2620_OF_2620_FIELD_CORRECTIONS_PARITY_GREEN__FV_HOLD'\n\
        assert m['official_comparisons']==2620 and m['official_parity_passed'] and m['post_all_field_alias_mismatches']==0\n\
        assert m['TD_alias_events_official_supported']==4 and m['blocked_kick_events_official_supported']==4\nassert\
        \ m['candidate_2026_shadow_total_adjustment_points']==54\nassert m['source_week_range']==[1,2,3,4,5,6] and\
        \ not m['week7_or_later_read']\nassert m['2026_scoring_contract_repo_git_blob']=='aa0ff2f2e839d3fc6aec67cfc6615c4130844ef3'\n\
        assert not m['all_518_complete_official_scoring_claimed'] and not m['fundamental_value_scale_calibrated']\n\
        assert not m['production_change_authorized'] and not m['owner_targets_used']\nfor n,s in m['outputs_sha256'].items():assert\
        \ hashlib.sha256((p/n).read_bytes()).hexdigest()==s,n\nwith (p/'CAL26_V1R68_2620_official_scoring_parity.csv').open()\
        \ as f:r=list(csv.DictReader(f))\nassert len(r)==2620 and all(x['official_parity_within_0_05']=='True' for\
        \ x in r)\nwith (p/'CAL26_V1R68_518_supported_scoring_adjustments_NOT_FV.csv').open() as f:q=list(csv.DictReader(f))\n\
        assert len(q)==518 and all(x['production_change_authorized']=='False' for x in q)\nassert len({x['name']\
        \ for x in q})==518\nprint('R68_REAL_SCORING_2620_OF_2620_FIELD_PARITY_NO_FV_RELEASE')\nPY_CAL26_V1R68_VERIFY\n\
        test -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r68-results/CAL26_V1R68_decision.md\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload complete official category field parity research (no price writes)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R68_OFFICIAL_2620_OF_2620_2026_SCORING_FIELDS_FV_HOLD
        path: ${{ runner.temp }}/cal26-r68-results/
        retention-days: 60
        if-no-files-found: warn
