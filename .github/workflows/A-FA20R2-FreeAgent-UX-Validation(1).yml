name: A-FA20R2 - Free Agent Board Production UX Validation

# UI-only fixes with real-page browser tests. No paid/private data uploaded.
# Run PREVIEW first. APPLY commits only after every browser test is green.
# R2 repairs an environment-only R1 failure by pinning Ubuntu 24.04.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview tests without committing; Apply tests then commits only the two UI assets'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  fa20-ux:
    name: FA20 browser QA and safe UI patch (${{ inputs.mode }})
    # Pin supported OS: ubuntu-latest selected 26.04 on 2026-11-13,
    # but Playwright 1.57.0 does not support Chromium install on that image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply source-pinned FA20 UI patch in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, zlib
          modules = {'assets/fa_experience_v3.js': {'old_sha256': '1de640b403a2c39a59f997ec10bf0f8a691e8b4f8342cf55935fedce9b0a0f7f', 'new_sha256': '544285a0198ff1e191160564aa587d46c9d2fa961345bd2423be0c697bc2294d', 'payload_zlib_b64': ''}, 'assets/fa_experience_v3.css': {'old_sha256': 'd1761aee1f8890838771777f8d311c3b1eacf12d953ca65641c98145a12630b7', 'new_sha256': '89dd9beb6e5608049cc22b27896a2d30fa98ffbda1aced13c1040cf363d79238', 'payload_zlib_b64': ''}}
          expected_loaders = {'FA_EXPERIENCE_V3_STYLE','FA_EXPERIENCE_V3_SCRIPT',
                              'FA_WORKSPACE_V1_SCRIPT','FA_MOBILE_POLISH_V1_SCRIPT'}
          page = Path('free-agent-board.html')
          assert page.is_file(), 'Free Agent Board HTML not found'
          h = page.read_text('utf-8')
          for token in expected_loaders:
              assert h.count(token)==1, f'Missing/duplicate existing loader: {token}'
          assert 'assets/fa_experience_v3.js?v=1' in h and 'assets/fa_experience_v3.css?v=1' in h
          for name,rec in modules.items():
              target=Path(name)
              assert target.is_file(), f'Existing FA19 asset missing: {name}'
              original=target.read_bytes()
              original_hash=hashlib.sha256(original).hexdigest()
              assert original_hash in (rec['old_sha256'],rec['new_sha256']), (
                  f'FA19 asset changed since audit; refusing overwrite: {name} {original_hash}')
              updated=zlib.decompress(base64.b64decode(rec['payload_zlib_b64']))
              assert hashlib.sha256(updated).hexdigest()==rec['new_sha256'], f'Embedded payload invalid: {name}'
              if original_hash!=rec['new_sha256']:
                  target.write_bytes(updated)
                  print('PATCHED',name)
              else:print('ALREADY INSTALLED',name)
          assert page.read_text('utf-8')==h, 'HTML unexpectedly modified'
          print('PASS: source-pinned, two-asset UI-only FA20 patch')
          PYCODE

      - name: Validate syntax and strict read-only data/model boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_experience_v3.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,subprocess
          js=Path('assets/fa_experience_v3.js').read_text('utf-8')
          css=Path('assets/fa_experience_v3.css').read_text('utf-8')
          assert "selectedPosition=button.dataset.faPosition" in js, 'Combined search logic missing'
          assert 'No ${selectedPosition' in js, 'Scoped feedback missing'
          assert '.fa-ws-positions>button{flex:1 1 0;' in css, 'Mobile positions styling missing'
          assert '.filter-panel .toggle-btn.active' in css, 'LOG coverage toggle styling missing'
          for forbidden in ['fetch(', 'localStorage', 'indexedDB', 'XMLHttpRequest', 'navigator.sendBeacon']:
              assert forbidden not in js, f'UI module accesses private storage/network: {forbidden}'
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed = {'assets/fa_experience_v3.js','assets/fa_experience_v3.css'}
          assert changed.issubset(allowed), f'Unexpected changed tracked files: {changed-allowed}'
          assert not extra, f'Unexpected added files: {extra}'
          assert subprocess.run(['git','diff','--quiet','--','free-agent-board.html','index.html','data/']).returncode==0, 'Protected code/data modified'
          print('PASS: only source-pinned UI assets change; model, values, subscriber data and HTML untouched')
          PYCODE

      - name: Prepare Chromium browser test environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Run actual Free Agent Board browser checks (public data only)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fa20_live_tests.py <<'PYCODE'
          import json, os, re, sys, time, traceback
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from threading import Thread
          from urllib.parse import unquote, urlsplit
          from playwright.sync_api import sync_playwright

          ROOT = Path(os.environ.get('GITHUB_WORKSPACE', '.')).resolve()
          OUT = ROOT / 'fa20-artifacts'
          OUT.mkdir(exist_ok=True)
          results = []

          class Handler(SimpleHTTPRequestHandler):
              def log_message(self, *_): pass

          server = ThreadingHTTPServer(('127.0.0.1', 0), partial(Handler, directory=str(ROOT)))
          Thread(target=server.serve_forever, daemon=True).start()
          URL = f'http://127.0.0.1:{server.server_port}/free-agent-board.html'

          prefix = '/ajknoll23-code/LOG-Trade-Calculator/main/'
          def local_github(route):
              path = unquote(urlsplit(route.request.url).path)
              if path.startswith(prefix):
                  target = (ROOT / path[len(prefix):]).resolve()
                  if target.is_relative_to(ROOT) and target.is_file():
                      kind = 'application/json' if target.suffix == '.json' else 'text/plain'
                      route.fulfill(status=200, body=target.read_bytes(), headers={
                          'content-type':kind + '; charset=utf-8',
                          'access-control-allow-origin':'*',
                          'cache-control':'no-store'
                      })
                      return
              route.fulfill(status=404,body='',headers={'access-control-allow-origin':'*'})

          def record(name, detail='ok'):
              results.append({'test': name, 'result': 'PASS', 'detail': detail})
              print('PASS:', name, detail, flush=True)

          def insist(ok, description):
              if not ok: raise AssertionError(description)

          def main():
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
                  try:
                      for width in (360, 390, 430, 768, 1280):
                          ctx = browser.new_context(viewport={'width': width,'height': 900}, device_scale_factor=1,
                                                    reduced_motion='reduce')
                          ctx.route('https://raw.githubusercontent.com/**', local_github)
                          ctx.route('https://fonts.googleapis.com/**', lambda r: r.abort())
                          ctx.route('https://fonts.gstatic.com/**', lambda r: r.abort())
                          page = ctx.new_page()
                          page.goto(URL, wait_until='domcontentloaded',timeout=45000)
                          # The existing public-site password overlay is omitted in this
                          # isolated, local UI test. No credential or authentication is used.
                          page.evaluate("document.body.classList.remove('free-agent-locked');document.getElementById('freeAgentPasswordGate')?.remove()")
                          page.wait_for_function("document.querySelector('#faWorkspaceNav')?.dataset.fa19Ready==='true'", timeout=25000)
                          page.wait_for_function("!!document.querySelector('#boardWrap .row')", timeout=45000)
                          insist(page.locator('#faWorkspaceNav [role="tab"]').count()==5,'Five workspace tabs missing')
                          insist(page.locator('#fa19PlayerQuery').is_visible(),'Player search missing')
                          sizes = page.locator('#faWorkspaceNav [role="tab"]').evaluate_all(
                            '(els)=>els.map(x=>({left:x.getBoundingClientRect().left,right:x.getBoundingClientRect().right}))')
                          insist(all(t['left']>=-1 and t['right']<=width+2 for t in sizes),f'Tab clipped at {width}px: {sizes}')
                          over = page.evaluate('document.documentElement.scrollWidth - window.innerWidth')
                          insist(over<=2,f'Horizontal page overflow at {width}px: {over}')
                          if width<=430:
                              pos = page.locator('.fa-ws-positions [data-fa-position]').evaluate_all(
                               '(els)=>els.map(x=>({left:x.getBoundingClientRect().left,right:x.getBoundingClientRect().right}))')
                              insist(len(pos)==8 and all(x['left']>=-1 and x['right']<=width+2 for x in pos),
                                     f'Position buttons clipped at {width}px: {pos}')
                          record(f'{width}px mobile/desktop layout')
                          if width == 390:
                              privacy = page.locator('#fa19Privacy')
                              insist(privacy.count()==1 and 'password screen is not secure authentication' in privacy.text_content().lower(),
                                     'Original public-site caution missing')
                              for key, must in [('idp','#idpiPanel'),('trends','#idptPanel'),
                                                ('startsit','#fa-ws-startsit-panel'),('watch','#idpePanel'),('board','#boardWrap')]:
                                  page.locator(f'[data-fa-workspace="{key}"]').click()
                                  insist(page.locator(f'#fa-ws-{key}-panel').is_visible(),f'{key} workspace does not open')
                                  insist(page.locator(must).count()==1,f'{key} core module detached or duplicated')
                              record('All five workspace tabs, module identity, privacy disclosure')

                              initial = page.locator('#boardWrap > details').first.locator('.row').first
                              name = initial.locator('.row-title').inner_text().strip()
                              value = initial.locator('.row-val').inner_text().strip()
                              position = initial.locator('.row-meta').inner_text().strip().split(' · ')[0]
                              insist(position in ('QB','RB','WR','TE','DL','LB','DB'),f'Unknown sample position: {position}')
                              search = page.locator('#fa19PlayerQuery')
                              search.fill(name)
                              insist('match' in page.locator('#fa19PlayerFeedback').inner_text().lower(),'Name search returned no matches')
                              page.locator(f'[data-fa-position="{position}"]').click()
                              insist(search.input_value()==name,'Position switch erased active search')
                              # Specific row must remain visible in the selected native list.
                              selected_rows = page.locator('#boardWrap > details[open] .row:visible')
                              insist(selected_rows.count()>0 and any(
                                row.locator('.row-title').inner_text().strip()==name and
                                row.locator('.row-val').inner_text().strip()==value
                                for row in selected_rows.all()), 'Position + search combination lost player or changed value')
                              search.fill('__unlikely_search_string_20__')
                              insist('No ' in page.locator('#fa19PlayerFeedback').inner_text(), 'No-result feedback missing')
                              page.locator('#fa19SearchClear').click()
                              insist(not search.input_value(),'Clear button did not clear query')
                              record('Search + position combined, clear, player value unchanged')

                              page.locator('[data-fa-position="ALL"]').click()
                              search.fill(name)
                              page.locator('#allBtn').click()
                              insist(search.input_value()==name,'Coverage change wiped search')
                              insist(page.locator('#boardWrap > details[open] .row:visible').count()>0,
                                     'Search not preserved after coverage re-render')
                              active_style = page.locator('#allBtn').evaluate('(x)=>getComputedStyle(x).backgroundColor')
                              insist(active_style not in ('rgb(239, 239, 239)','rgb(255, 255, 255)','rgba(0, 0, 0, 0)'),
                                     f'Coverage buttons still native/un-styled: {active_style}')
                              record('Re-render preservation and LOG-styled coverage toggles')
                              search.fill('')
                              page.locator('[data-fa-workspace="watch"]').click()
                              insist(page.locator('#faMobileWatchNotice').count()==1,'Private watchlist notice missing')
                              page.locator('[data-fa-workspace="board"]').click()
                              page.screenshot(path=str(OUT/'phone-390.png'), full_page=False)
                          if width == 1280:
                              page.screenshot(path=str(OUT/'desktop-1280.png'), full_page=False)
                          ctx.close()
                  finally:
                      browser.close()

          try:
              main()
          except Exception as exc:
              results.append({'test':'fatal','result':'FAIL','detail':str(exc)})
              traceback.print_exc()
              (OUT/'report.json').write_text(json.dumps({'passed':False,'checks':results},indent=2))
              sys.exit(1)
          finally:
              server.shutdown()
          (OUT/'report.json').write_text(json.dumps({'passed':True,'checks':results,
              'note':'Local checkout with repo-backed public data. No private subscriber import, login or live Pages verification.'},indent=2))
          print('PASS — FA20 browser validation finished.',flush=True)
          PYCODE
          python /tmp/fa20_live_tests.py

      - name: Attach screenshot and test evidence (even if red)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA20R2-UX-Validation
          path: fa20-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Preview summary (never commits)
        if: inputs.mode == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          echo 'FA20 PREVIEW GREEN — no files committed.'
          git diff --stat
          echo '### FA20 Preview — Green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live checkout browser tests passed at 360/390/430/768/1280px' >> "$GITHUB_STEP_SUMMARY"
          echo '- All five workspaces, combined name/position search, re-render and privacy disclosure checked' >> "$GITHUB_STEP_SUMMARY"
          echo '- Only two presentation assets patched in temporary checkout; no commit' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence in artifact: FA20R2-UX-Validation' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply verified UI files only
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/fa_experience_v3.js assets/fa_experience_v3.css
          if git diff --cached --quiet; then
            echo 'FA20 already installed: no commit needed.'
            exit 0
          fi
          python3 - <<'PYCODE'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed and changed.issubset({'assets/fa_experience_v3.js','assets/fa_experience_v3.css'}), f'Unauthorized staged files: {changed}'
          print('PASS: only two permitted UI assets staged:',sorted(changed))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-FA20R2: validate and polish free agent mobile UX'
          git push origin HEAD:main
          echo '### FA20 Applied — Green' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser tests passed; two UI assets committed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Wait for GitHub Pages deploy; then verify your phone in the real browser' >> "$GITHUB_STEP_SUMMARY"
