name: Baseline Backtester

# Standalone from the reconstruction workflow on purpose -- this script
# needs no network access and only reads scripts/weekly_points_by_season.json,
# which is already committed to the repo from the last full reconstruction
# run. Re-running the whole multi-step pipeline just to test a backtester
# change would mean an unnecessary 2-season Sleeper re-fetch every time.
# If weekly_points_by_season.json is ever stale relative to what you want
# to test, run the "Historical Lineup & Start-Rate Analysis" workflow
# first, then this one.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test the correlation/split-finding logic before trusting real output
        run: python3 scripts/baseline_backtester.py --selftest

      - name: Run the backtest
        run: python3 scripts/baseline_backtester.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/baseline_backtest_results.json \
                  scripts/baseline_backtest_report.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run baseline backtester"
          git push
