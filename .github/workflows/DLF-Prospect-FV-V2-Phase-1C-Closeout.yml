name: DLF Prospect FV V2 - Phase 1C Closeout Freeze
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v2-phase1c-closeout
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  V2_PHASE1B_RUN_ID: '36091544445'
  V2_PHASE1B_ARTIFACT_ID: '10845712080'
  V2_PHASE1B_ARTIFACT_NAME: dlf-prospect-fv-v2-phase1b-development
  V2_PHASE1B_JSON_SHA256: ef90f2f9d98301bb069652d78f97701738d6e536a45fb49e7cc5fad40a08a522
  V2_PREDICTION_SHA256: 023738260c77e915a171127bb6e073ad1b7248ea0fe3aaf894d297e66d142848
  IDENTITY_SHA256: e8d79738530a73f15de0c52990e8f7fbf1e8d4f699448add0f5add11eaa093fb
  V2_FEATURE_SHA256: 5c60a0dde3ee3e3d5ec3b79db9ab3644d7b5989f50208ae432be112ebcbbbf0f
jobs:
  freeze-v2-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Guard V2 development workflow lineage
      shell: bash
      run: |-
        set -euo pipefail
        actual="$(git hash-object .github/workflows/DLF-Prospect-FV-V2-Phase-1B-Advanced-Development-Signal.yml)"
        expected='2fc12ed9476cfa29f921047480457d0d7af33947'
        test "$actual" = "$expected"
        echo "PASS lineage V2 development workflow $actual"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download exact V2 development artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.V2_PHASE1B_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1b
        repository: ${{ github.repository }}
        run-id: ${{ env.V2_PHASE1B_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Freeze V2 negative result and preserve holdout
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"${RUNNER_TEMP}/dlf-v2-closeout\"\npython3 - <<'PY'\nfrom __future__ import annotations\n\
        \nimport hashlib\nimport json\nimport os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nroot\
        \ = Path(os.environ[\"RUNNER_TEMP\"])\nsrc = root / \"phase1b\" / \"dlf_prospect_fv_v2_phase1b_development.json\"\n\
        out_dir = root / \"dlf-v2-closeout\"\nout_dir.mkdir(parents=True, exist_ok=True)\n\nEXPECTED_JSON_SHA = os.environ[\"\
        V2_PHASE1B_JSON_SHA256\"]\nEXPECTED_PRED_SHA = os.environ[\"V2_PREDICTION_SHA256\"]\nEXPECTED_IDENTITY_SHA = os.environ[\"\
        IDENTITY_SHA256\"]\nEXPECTED_FEATURE_SHA = os.environ[\"V2_FEATURE_SHA256\"]\n\nraw = src.read_bytes()\nactual = hashlib.sha256(raw).hexdigest()\n\
        if actual != EXPECTED_JSON_SHA:\n    raise RuntimeError(\n        f\"V2 Phase 1B artifact SHA mismatch: expected={EXPECTED_JSON_SHA}\
        \ actual={actual}\"\n    )\n\nd = json.loads(raw)\n\nassert d[\"decision\"] == \"STOP_V2_NO_INCREMENTAL_DEVELOPMENT_SIGNAL\"\
        \nassert d[\"confirmation_unlock\"] is False\nassert d[\"deployment_authorized\"] is False\nassert d[\"firewalls\"\
        ][\"nfl_2025_outcomes_downloaded_or_read\"] is False\nassert d[\"firewalls\"][\"nfl_2026_outcomes_downloaded_or_read\"\
        ] is False\nassert d[\"firewalls\"][\"current_fv_read_for_selection\"] is False\nassert d[\"firewalls\"][\"ktc_read\"\
        ] is False\nassert d[\"firewalls\"][\"dlf_market_data_read\"] is False\nassert d[\"firewalls\"][\"v1_basic_or_athletic_features_used\"\
        ] is False\nassert d[\"lineage\"][\"mapped_identity_sha256\"] == EXPECTED_IDENTITY_SHA\nassert d[\"lineage\"][\"v2_advanced_feature_sha256\"\
        ] == EXPECTED_FEATURE_SHA\nassert d[\"development\"][\"prediction_fingerprint_sha256\"] == EXPECTED_PRED_SHA\n\ngates\
        \ = d[\"development\"][\"gates\"]\nassert gates and all(v is False for v in gates.values())\n\npooled = d[\"development\"\
        ][\"pooled\"]\nbaseline_mae = float(pooled[\"baseline\"][\"mae\"])\ncandidate_mae = float(pooled[\"candidate\"][\"\
        mae\"])\nassert candidate_mae > baseline_mae\n\nby_pos = d[\"development\"][\"by_position\"]\nassert set(by_pos) ==\
        \ {\"QB\", \"WR\", \"TE\"}\nassert all(\n    float(v[\"candidate\"][\"mae\"]) >= float(v[\"baseline\"][\"mae\"])\n\
        \    for v in by_pos.values()\n)\n\nresult = {\n    \"schema_version\": 1,\n    \"study_id\": \"dlf-prospect-fv-v2-advanced-fundamentals\"\
        ,\n    \"phase\": \"1C_closeout_freeze\",\n    \"decision\": \"CLOSE_DLF_PROSPECT_FV_V2_NO_INCREMENTAL_SIGNAL\",\n\
        \    \"generated_at_utc\": datetime.now(timezone.utc).isoformat(),\n    \"lineage\": {\n        \"phase1b_run_id\"\
        : int(os.environ[\"V2_PHASE1B_RUN_ID\"]),\n        \"phase1b_artifact_id\": int(os.environ[\"V2_PHASE1B_ARTIFACT_ID\"\
        ]),\n        \"phase1b_json_sha256\": EXPECTED_JSON_SHA,\n        \"phase1b_prediction_fingerprint_sha256\": EXPECTED_PRED_SHA,\n\
        \        \"mapped_identity_sha256\": EXPECTED_IDENTITY_SHA,\n        \"v2_advanced_feature_sha256\": EXPECTED_FEATURE_SHA,\n\
        \    },\n    \"frozen_finding\": {\n        \"paired_prediction_n\": d[\"development\"][\"paired_prediction_n\"],\n\
        \        \"baseline_pooled_mae\": baseline_mae,\n        \"v2_candidate_pooled_mae\": candidate_mae,\n        \"relative_improvement\"\
        : d[\"development\"][\"pooled_mae_relative_improvement\"],\n        \"paired_bootstrap\": d[\"development\"][\"paired_bootstrap\"\
        ],\n        \"heldout_year_wins\": d[\"development\"][\"heldout_year_wins\"],\n        \"positions_improved\": d[\"\
        development\"][\"positions_improved\"],\n        \"all_preregistered_gates_passed\": False,\n        \"gates\": gates,\n\
        \        \"by_position\": by_pos,\n        \"by_year\": d[\"development\"][\"by_year\"],\n    },\n    \"scientific_conclusion\"\
        : {\n        \"direct_fv_hypotheses_rejected\": [\n            (\n                \"V1: basic DLF college production\
        \ plus raw athletic measurements \"\n                \"did not add out-of-sample signal beyond the existing rookie\
        \ baseline.\"\n            ),\n            (\n                \"V2: pre-outcome-frozen advanced QB/WR/TE DLF efficiency\
        \ and usage \"\n                \"metrics did not add out-of-sample signal beyond the existing rookie baseline.\"\n\
        \            ),\n        ],\n        \"recommended_dlf_role_now\": [\n            \"market/context layer using DLF\
        \ ADP, rankings, trade values, analyzer/finder outputs\",\n            \"external qualitative/context validation\"\
        ,\n            \"future exploratory research only if a materially new pre-specified data family becomes available\"\
        ,\n        ],\n        \"not_recommended_now\": [\n            \"direct DLF prospect-input contribution to Fundamental\
        \ Value\",\n            \"post-hoc tuning of V1 or V2 features/alpha after seeing development outcomes\",\n      \
        \      \"opening the 2024 temporal holdout merely to search for a rescue\",\n        ],\n        \"future_reopen_rule\"\
        : (\n            \"A future direct-FV DLF study should require a materially new data family or \"\n            \"\
        new historical sample and a new preregistration. It must not relabel V1/V2 \"\n            \"post-hoc tuning as confirmatory\
        \ evidence.\"\n        ),\n    },\n    \"preserved_assets\": {\n        \"2024_temporal_confirmation_opened\": False,\n\
        \        \"nfl_2025_outcomes_read\": False,\n        \"2024_holdout_status\": (\n            \"still untouched and\
        \ may be reserved for a genuinely new future hypothesis\"\n        ),\n    },\n    \"firewalls\": {\n        \"production_change_authorized\"\
        : False,\n        \"market_data_can_enter_fv\": False,\n        \"posthoc_v1_or_v2_rescue_authorized\": False,\n \
        \   },\n}\n\nout_json = out_dir / \"dlf_prospect_fv_v2_phase1c_closeout.json\"\nout_md = out_dir / \"dlf_prospect_fv_v2_phase1c_closeout.md\"\
        \nout_json.write_text(json.dumps(result, indent=2, sort_keys=True) + \"\\n\")\n\nmd = [\n    \"# DLF Prospect FV V2\
        \ \u2014 Phase 1C Closeout\",\n    \"\",\n    \"**Decision:** `CLOSE_DLF_PROSPECT_FV_V2_NO_INCREMENTAL_SIGNAL`\",\n\
        \    \"\",\n    f\"- Paired QB/WR/TE development prospects: **{result['frozen_finding']['paired_prediction_n']}**\"\
        ,\n    f\"- Baseline pooled MAE: **{baseline_mae:.6f}**\",\n    f\"- DLF V2 pooled MAE: **{candidate_mae:.6f}**\"\
        ,\n    f\"- Relative MAE change: **{100*result['frozen_finding']['relative_improvement']:.2f}%**\",\n    f\"- Held-out\
        \ year wins: **{result['frozen_finding']['heldout_year_wins']}/6**\",\n    f\"- Eligible positions improved: **{result['frozen_finding']['positions_improved']}/3**\"\
        ,\n    \"\",\n    \"All five preregistered V2 development gates failed. The sealed 2024 temporal \"\n    \"confirmation\
        \ remained unopened and 2025 weekly outcomes were never read.\",\n    \"\",\n    \"## Scientific conclusion\",\n \
        \   \"\",\n    \"Two distinct preregistered DLF prospect-input families have now failed to add \"\n    \"out-of-sample\
        \ signal beyond the existing rookie FV baseline:\",\n    \"\",\n    \"1. V1 basic production + raw athletic measurements\"\
        ,\n    \"2. V2 advanced QB/WR/TE efficiency + usage metrics\",\n    \"\",\n    \"The current evidence therefore does\
        \ **not** support a direct DLF prospect-input \"\n    \"contribution to Fundamental Value.\",\n    \"\",\n    \"##\
        \ Recommended DLF role\",\n    \"\",\n    \"- Market/context layer: ADP, rankings, trade values, Trade Analyzer/Finder\"\
        ,\n    \"- External qualitative/context validation\",\n    \"- New FV research only if a materially new data family\
        \ or new historical sample appears\",\n    \"\",\n    \"Do not post-hoc tune V1/V2 features or alpha and treat that\
        \ as confirmatory evidence.\",\n    \"\",\n    \"The 2024 temporal holdout remains untouched for a genuinely new future\
        \ hypothesis.\",\n]\nout_md.write_text(\"\\n\".join(md) + \"\\n\")\n\nprint(json.dumps({\n    \"decision\": result[\"\
        decision\"],\n    \"paired_prediction_n\": result[\"frozen_finding\"][\"paired_prediction_n\"],\n    \"baseline_mae\"\
        : baseline_mae,\n    \"v2_candidate_mae\": candidate_mae,\n    \"heldout_year_wins\": result[\"frozen_finding\"][\"\
        heldout_year_wins\"],\n    \"positions_improved\": result[\"frozen_finding\"][\"positions_improved\"],\n    \"2024_confirmation_opened\"\
        : False,\n    \"nfl_2025_outcomes_read\": False,\n    \"direct_dlf_prospect_fv_supported\": False,\n}, indent=2))\n\
        PY"
    - name: Prove closeout made no repository changes
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: V2 closeout is research-only and repo-clean.'
    - name: Upload V2 closeout
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v2-phase1c-closeout
        path: ${{ runner.temp }}/dlf-v2-closeout/
        if-no-files-found: error
        retention-days: 30
