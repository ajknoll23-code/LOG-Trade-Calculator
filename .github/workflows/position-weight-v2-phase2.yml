name: Position Weight V2 Phase 2 Ruleset Simulation

# Research-only current-rules structural lineup simulation.
# Validates the allocator against 2024/2025 observed starts, then fetches the
# current Sleeper roster_positions and reruns the same historical scoring
# samples under the 2026 slot structure.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  ruleset-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install requests

      - name: Phase 2 self-test
        run: python3 research/position-weight-v2/position_weight_v2_phase2_ruleset_simulation.py --selftest

      - name: Build Phase 2 current-rules simulation
        run: python3 research/position-weight-v2/position_weight_v2_phase2_ruleset_simulation.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/position-weight-v2/position_weight_v2_phase2_ruleset_simulation.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/position-weight-v2/position_weight_v2_phase2_ruleset_simulation.json
          git add research/position-weight-v2/position_weight_v2_phase2_ruleset_simulation.md
          git diff --staged --quiet || git commit -m "Add Position Weight V2 Phase 2 ruleset simulation"
          git push
