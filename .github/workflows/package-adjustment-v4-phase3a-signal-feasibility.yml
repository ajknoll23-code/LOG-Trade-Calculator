name: Package Adjustment V4 - Phase 3A Signal Feasibility

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V4 family
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$V4/package_adjustment_v4_phase3a_signal_feasibility.py")" = "2de713a2e55a077efe6cb7fbf20b796b183f4ae4"
          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase2_manifest.json")" = "ecc8e34baf909ead4cfafb24f90617c96de66b39"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py)" = "d58c8802c1133a97bae0ae0903dc421f27265b58"

          test ! -e "$V4/phase3a_signal_feasibility.json"
          test ! -e "$V4/phase3a_signal_feasibility.md"
          test ! -e "$V4/phase3a_signal_feasibility_manifest.json"

      - name: Verify production remains V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test feasibility generator
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3a_signal_feasibility.py --selftest

      - name: Run outcome-blind signal feasibility
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3a_signal_feasibility.py

      - name: Verify result boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          result = json.loads((d / "phase3a_signal_feasibility.json").read_text())
          manifest = json.loads((d / "phase3a_signal_feasibility_manifest.json").read_text())

          assert result["status"] in {
              "V4_FRESH_CONFIRMATION_SIGNAL_FEASIBLE",
              "V4_FRESH_CONFIRMATION_NOT_FEASIBLE_UNDER_FROZEN_ARCHITECTURE",
          }
          assert result["outcome_blind"] is True
          assert result["human_vote_outcomes_read"] is False
          assert result["model_fitting_performed"] is False
          assert result["candidate_family_changed"] is False
          assert result["production_change_authorized"] is False
          assert result["asset_universe"]["joe_mixon_present"] is False
          assert result["asset_universe"]["pick_years"] == [2027, 2028]
          assert len(result["groups"]) == 12
          assert manifest["human_vote_outcomes_read"] is False

          print("PASS: Phase 3A remained outcome-blind and production-neutral.")
          print("STATUS=" + result["status"])
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after feasibility
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Stage exact Phase 3A scope
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          git add             "$V4/phase3a_signal_feasibility.json"             "$V4/phase3a_signal_feasibility.md"             "$V4/phase3a_signal_feasibility_manifest.json"

          git diff --cached --check

          python3 - <<'PY'
          import subprocess
          expected = {
              "research/package-adjustment-v4-elite-fragmentation/phase3a_signal_feasibility.json",
              "research/package-adjustment-v4-elite-fragmentation/phase3a_signal_feasibility.md",
              "research/package-adjustment-v4-elite-fragmentation/phase3a_signal_feasibility_manifest.json",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Unexpected Phase 3A scope: {sorted(changed)}")
          print("PASS: exact three-file Phase 3A scope staged.")
          PY

      - name: Commit signal-feasibility result
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Audit Package Adjustment V4 signal feasibility"
          git pull --rebase origin main

          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main
          echo "V4_PHASE3A_STATUS=$V4_PHASE3A_STATUS"
          git log --oneline -1
