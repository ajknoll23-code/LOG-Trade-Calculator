name: A-FA23R1 - Two-Horizon IDP Waiver Evidence (Preview / Apply)
# Source-only research UX enhancement. Private subscriber projections remain browser-local.
# Preview must pass before Apply. No new FV/MV model, shared price, or expert data artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first; Apply only after a green preview'
        required: true
        type: choice
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  fa23-two-horizon:
    name: Private waiver research (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install SHA-pinned FA23 source in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,zlib
          modules = {'assets/fa_4for4_waiver_v1.js': {'old_sha256': 'cbc6b35b0058006597e7cad483bfd0d15173c320a10c12ae0b4395625468d65f', 'new_sha256': 'b1aa05e9623112e2ec9ba8e3dd75cad46d8614eae43f1663af0bbb1de371a439', 'payload_zlib_b64': ''}, 'assets/fa_4for4_waiver_v1.css': {'old_sha256': '66b4c2fd463d20ebcb8d89018895bee29421d4a585ab457cfab9603afd18fa24', 'new_sha256': '061f032dbf99eec32d6e9c2d9f6258cc0c0261e1a0f31a36748d8845e4b18eac', 'payload_zlib_b64': ''}}
          h=Path('free-agent-board.html').read_text(encoding='utf8')
          for marker in ('FA22_4FOR4_PRIVATE_STYLE','FA22_4FOR4_PRIVATE_SCRIPT','FA_WORKSPACE_V1_SCRIPT'):
              assert h.count(marker)==1, f'Missing/duplicate approved integration marker: {marker}'
          for path,record in modules.items():
              target=Path(path)
              assert target.is_file(),f'Missing deployed FA22 dependency: {path}'
              current=target.read_bytes()
              oldhash=hashlib.sha256(current).hexdigest()
              payload=zlib.decompress(base64.b64decode(record['payload_zlib_b64']))
              assert hashlib.sha256(payload).hexdigest()==record['new_sha256'],f'Corrupted FA23 payload: {path}'
              assert oldhash in (record['old_sha256'],record['new_sha256']), f'Source drift: {path}. Stop and review current repo.'
              if oldhash != record['new_sha256']:
                  target.write_bytes(payload)
                  print('Updated:',path)
              else:
                  print('Already FA23:',path)
          assert Path('free-agent-board.html').is_file()
          print('FA23 source-pinned, no HTML or data changes')
          PYCODE
      - name: Validate JS syntax, source boundaries and privacy
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_4for4_waiver_v1.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,re,subprocess
          js=Path('assets/fa_4for4_waiver_v1.js').read_text(encoding='utf-8')
          css=Path('assets/fa_4for4_waiver_v1.css').read_text(encoding='utf-8')
          html=Path('free-agent-board.html').read_text(encoding='utf-8')
          assert 'fa23Dynasty' in js and 'fa23Week' in js and 'fa23EvidenceStatus' in js
          assert 'weeklyEvidence' in js and 'o.week<selectedWeek' in js,'No-lookahead gating missing'
          assert 'local File input' in js and 'file.text()' in js,'Browser-local input removed'
          assert all(path in js for path in ('data/free_agents.json','data/idp_ros_2026_w09.json','data/idp_usage_2026_season.json','data/idp_weekly_2026_public.json'))
          assert all(token in html for token in ('FA22_4FOR4_PRIVATE_STYLE','FA22_4FOR4_PRIVATE_SCRIPT'))
          assert '.fa23-horizons' in css
          # Do not treat harmless comments mentioning localStorage as a storage operation.
          assert not re.search(r'\b(?:localStorage|indexedDB|XMLHttpRequest|sendBeacon)\s*(?:\.|\[|\()',js)
          assert 'api.4for4.com' not in js and 'fetch(root+' in js
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'assets/fa_4for4_waiver_v1.js','assets/fa_4for4_waiver_v1.css'}
          assert changed.issubset(allowed), f'Forbidden file modifications: {changed-allowed}'
          assert subprocess.run(['git','diff','--quiet','--','index.html','free-agent-board.html','data/','assets/fa_start_sit_v1.js','assets/idp_intel_v1.js']).returncode==0
          print('PASS: JS syntax, private memory-only import, four approved public GET sources, no valuation changes')
          PYCODE
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible Chromium
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test actual board with synthetic IDP evidence at six screen widths
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fa23_browser_qa.py <<'PYCODE'
          """FA23 browser QA, exclusively synthetic data. The real subscriber CSV NEVER enters CI."""
          import json,os
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from threading import Thread
          from playwright.sync_api import sync_playwright
          OUT=Path('fa23-qa-artifacts');OUT.mkdir(exist_ok=True)
          FA={'synced_at':1794604100.55,'league_id':'test-synthetic','count':4,'free_agents':[
           {'player_id':'TSTLB1','name':'QA Young Linebacker','team':'TEN','pos':'LB','raw_position':'LB','age':22},
           {'player_id':'TSTDL1','name':'QA Young Rusher','team':'HOU','pos':'DL','raw_position':'DE','age':24},
           {'player_id':'TSTDB1','name':'QA Veteran Safety','team':'ARI','pos':'DB','raw_position':'S','age':29},
           {'player_id':'TSTDB2','name':'QA Young Safety','team':'CAR','pos':'DB','raw_position':'S','age':23}]}
          ROS={'schema_version':1,'rank_policy':'FROZEN_SCREENSHOT_DISPLAY_ONLY','records':[
           {'sleeper_id':'TSTLB1','group':'LB','team':'TEN','rank':63},
           {'sleeper_id':'TSTDL1','group':'EDGE','team':'HOU','rank':33},
           {'sleeper_id':'TSTDB1','group':'S','team':'ARI','rank':15}]}
          USAGE={'schema_version':1,'source_received_date':'2026-11-09','source_week_range':'not_stated_in_csv','policy':'READ_ONLY_RESEARCH_NOT_FV_OR_PROJECTION','players':[
           {'sleeper_id':'TSTLB1','identity_status':'exact_name_team','team_at_source':'TEN','position':'LB','snaps_per_game':59.5,'tackle_rate_pct':15.2},
           {'sleeper_id':'TSTDL1','identity_status':'exact_name_team','team_at_source':'HOU','position':'ED','snaps_per_game':44,'tackle_rate_pct':5.1},
           {'sleeper_id':'TSTDB2','identity_status':'exact_name_team','team_at_source':'WRONG','position':'S','snaps_per_game':90,'tackle_rate_pct':90}
           ]+[{'sleeper_id':'NONSENSE'+str(i),'identity_status':'unmatched_identity'} for i in range(25)]}
          WEEKLY={'schema_version':1,'classification':'PUBLIC_SLEEPER_WEEKLY_IDP_EVIDENCE_NOT_PROJECTION_OR_BREAKOUT','season':2026,'last_completed_week':10,'players':[
           {'sleeper_id':'TSTLB1','team':'TEN','position':'LB','observations':[{'week':7,'defensive_snaps':40},{'week':8,'defensive_snaps':50},{'week':9,'defensive_snaps':68},{'week':10,'defensive_snaps':130}]},
           {'sleeper_id':'TSTDL1','team':'HOU','position':'DL','observations':[{'week':7,'defensive_snaps':60},{'week':8,'defensive_snaps':55},{'week':9,'defensive_snaps':52},{'week':10,'defensive_snaps':144}]},
           {'sleeper_id':'TSTDB2','team':'WRONG','position':'DB','observations':[{'week':7,'defensive_snaps':30},{'week':8,'defensive_snaps':35},{'week':9,'defensive_snaps':65}]}]}
          CSV=('"#","Player","Team","Opp","Group-Rank","Position-Rank","FF Pts","VOR"\n'
               '"1","QA Young Linebacker","TEN","NE","LB-1","LB-1","14.0","2.0"\n'
               '"2","QA Young Rusher","HOU","JAX","DL-1","DE-1","11.2","1.0"\n'
               '"3","QA Veteran Safety","ARI","SEA","DB-1","S-1","15.0","2.4"\n'
               '"4","QA Young Safety","CAR","NO","DB-2","S-2","12.4","0.8"\n')
          class Quiet(SimpleHTTPRequestHandler):
           def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(Path.cwd())))
          Thread(target=server.serve_forever,daemon=True).start()
          url=f'http://127.0.0.1:{server.server_port}/free-agent-board.html'
          results=[]
          try:
           with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
            for width in (320,360,390,430,768,1280):
             context=browser.new_context(viewport={'width':width,'height':900});page=context.new_page();bad=[];err=[]
             page.on('request',lambda req:bad.append([req.method,req.url]) if req.method not in ('GET','HEAD') else None)
             def mock(route):
              u=route.request.url
              d=FA if 'data/free_agents.json' in u else ROS if 'data/idp_ros_2026_w09.json' in u else USAGE if 'data/idp_usage_2026_season.json' in u else WEEKLY if 'data/idp_weekly_2026_public.json' in u else None
              if d is None:
                route.fulfill(status=404,body='{}',headers={'access-control-allow-origin':'*','content-type':'application/json'});return
              route.fulfill(status=200,body=json.dumps(d),headers={'access-control-allow-origin':'*','content-type':'application/json'})
             page.route('https://**/*',mock)
             page.goto(url,wait_until='domcontentloaded',timeout=45000)
             page.locator('#fa22WaiverLab').wait_for(state='attached',timeout=18000)
             assert page.locator('#faWorkspaceNav').count()==1 and page.locator('[data-fa-workspace]').count()==5
             # Test-only bypass of public password *overlay*; no user credential is accessed.
             page.evaluate("""() => {document.body.classList.remove('free-agent-locked');
              document.getElementById('freeAgentPasswordGate').style.display='none';
              document.getElementById('fa-ws-idp-tab').click();}""")
             assert page.locator('#fa-ws-idp-panel').is_visible()
             page.locator('#fa22Week').fill('10');page.locator('#fa22Scoring').select_option('log')
             page.locator('#fa22Files').set_input_files({'name':'fake_week10.csv','mimeType':'text/csv','buffer':CSV.encode()})
             page.locator('#fa22Import').click()
             page.wait_for_function("document.getElementById('fa22Status').textContent.includes('4 matched')",timeout=20000)
             page.wait_for_function("document.getElementById('fa23EvidenceStatus').textContent.includes('Weekly snaps: only')",timeout=20000)
             assert page.locator('.fa22-player').count()==4
             txt=page.locator('#fa22List').inner_text()
             assert 'raw snap change +23.0' in txt and 'W9' in txt and 'W10: 130' not in txt, 'Lookahead violation'
             assert '59.5 defensive snaps/game' in txt and '90.0 defensive snaps/game' not in txt, 'Bad identity join'
             assert page.evaluate("""() => {const e=document.getElementById('fa22WaiverLab');
              return e.getBoundingClientRect().right<=innerWidth+1 && e.scrollWidth<=e.clientWidth+2;}"""), 'Card overflow'
             page.locator('#fa23Dynasty').click()
             assert page.locator('#fa23Dynasty').get_attribute('aria-selected')=='true'
             assert page.locator('.fa22-player').count()==3 and 'QA Veteran Safety' not in page.locator('#fa22List').inner_text()
             page.locator('#fa22Focus').select_option('snap')
             assert page.locator('.fa22-player').count()==1 and 'QA Young Linebacker' in page.locator('#fa22List').inner_text()
             page.locator('#fa22Focus').select_option('both');assert page.locator('.fa22-player').count()==1
             page.locator('#fa23Week').click();assert page.locator('.fa22-player').count()==4
             page.locator('#fa22Focus').select_option('young');assert page.locator('.fa22-player').count()==3
             if width in (390,1280):
              page.locator('#fa22Focus').select_option('week')
              page.screenshot(path=str(OUT/f'FA23-synthetic-{width}.png'),full_page=False)
             page.locator('#fa22Week').fill('11');page.locator('#fa22Week').dispatch_event('change')
             assert page.locator('#fa22Results').is_hidden(), 'Stale private CSV after week changed'
             assert not bad, 'Unexpected private upload/non-GET request: '+str(bad)
             results.append({'viewport':width,'result':'PASS','synthetic_matched':4,'future_snap_leak':False,'non_get_requests':0})
             context.close()
            browser.close()
          finally:server.shutdown()
          (OUT/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          print('FA23 PASS: '+json.dumps(results))
          PYCODE
          python /tmp/fa23_browser_qa.py
      - name: Attach synthetic-only browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA23R1-Private-Waiver-Synthetic-QA
          path: fa23-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preview summary (no production writes)
        if: inputs.mode == 'preview'
        run: |
          echo 'PASS: preview only. No application source committed.'
          git status --short
      - name: Apply verified presentation-only changes
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/fa_4for4_waiver_v1.js assets/fa_4for4_waiver_v1.css
          if git diff --cached --quiet; then
            echo 'Already applied; no production changes.'
          else
            git commit -m 'FA23: add separate week and dynasty waiver evidence horizons (display only)'
            git push origin HEAD:main
          fi
          echo 'PASS: only FA22 presentation assets changed; no subscriber data, FV/MV or lineup engine changes.'
