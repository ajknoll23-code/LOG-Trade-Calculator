name: Refine Voting Sections UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine voting section copy and layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return source.replace(old, new, 1)

          # ------------------------------------------------------------
          # 1) Shared voting guidance / guest-access styles
          # ------------------------------------------------------------
          style_id = 'vote-guidance-ui-v2'
          if f'id="{style_id}"' not in text:
              style_lines = [
                  f'<style id="{style_id}">',
                  '/* VOTE_GUIDANCE_UI_V2 — presentation/copy only; no vote math changes. */',
                  '.vote-help-card{',
                  '  margin:0 0 10px;',
                  '  padding:10px 12px;',
                  '  border:1px solid var(--line);',
                  '  border-left:3px solid var(--gold);',
                  '  border-radius:9px;',
                  '  background:rgba(30,62,96,0.42);',
                  '}',
                  '.vote-help-card.package{ border-left-color:var(--violet); }',
                  '.vote-help-label{',
                  "  font-family:'IBM Plex Mono',monospace;",
                  '  font-size:9px;',
                  '  font-weight:700;',
                  '  letter-spacing:.09em;',
                  '  text-transform:uppercase;',
                  '  color:var(--text-muted);',
                  '  margin-bottom:4px;',
                  '}',
                  '.vote-help-text{',
                  '  color:var(--text-muted);',
                  '  font-size:12px;',
                  '  line-height:1.45;',
                  '}',
                  '.vote-help-text strong{ color:var(--text); }',
                  '.vote-access-card{',
                  '  display:grid;',
                  '  grid-template-columns:minmax(0,1fr) auto;',
                  '  align-items:center;',
                  '  gap:12px;',
                  '  padding:11px 12px;',
                  '  border:1px solid var(--line);',
                  '  border-radius:9px;',
                  '  background:var(--panel);',
                  '}',
                  '.vote-access-copy{ min-width:0; }',
                  '.vote-access-title{',
                  '  color:var(--text);',
                  '  font-size:12.5px;',
                  '  font-weight:700;',
                  '  margin-bottom:2px;',
                  '}',
                  '.vote-access-sub{',
                  '  color:var(--text-dim);',
                  '  font-size:11.5px;',
                  '  line-height:1.4;',
                  '}',
                  '.vote-guest-btn{',
                  '  appearance:none;',
                  '  border:1px solid rgba(235,98,97,.45);',
                  '  background:rgba(235,98,97,.08);',
                  '  color:var(--gold);',
                  "  font-family:'IBM Plex Mono',monospace;",
                  '  font-size:10.5px;',
                  '  font-weight:700;',
                  '  letter-spacing:.035em;',
                  '  padding:8px 11px;',
                  '  min-height:36px;',
                  '  border-radius:7px;',
                  '  cursor:pointer;',
                  '  white-space:nowrap;',
                  '}',
                  '.vote-guest-btn:active{',
                  '  background:var(--gold);',
                  '  color:var(--bg);',
                  '  border-color:var(--gold);',
                  '}',
                  '.vote-guest-status{',
                  '  display:flex;',
                  '  align-items:flex-start;',
                  '  justify-content:space-between;',
                  '  gap:10px;',
                  '  margin-bottom:10px;',
                  '  padding:9px 10px;',
                  '  border:1px solid var(--line);',
                  '  border-radius:8px;',
                  '  background:rgba(30,62,96,.32);',
                  '  color:var(--text-dim);',
                  '  font-size:11px;',
                  '  line-height:1.4;',
                  '}',
                  '.vote-guest-status strong{ color:var(--text); }',
                  '.vote-switch-link{',
                  '  appearance:none;',
                  '  border:0;',
                  '  background:none;',
                  '  padding:0;',
                  '  color:var(--gold);',
                  "  font-family:'IBM Plex Mono',monospace;",
                  '  font-size:9.5px;',
                  '  font-weight:600;',
                  '  cursor:pointer;',
                  '  white-space:nowrap;',
                  '}',
                  '@media(max-width:430px){',
                  '  .vote-help-card{ padding:9px 10px; }',
                  '  .vote-access-card{',
                  '    grid-template-columns:1fr;',
                  '    gap:9px;',
                  '  }',
                  '  .vote-guest-btn{',
                  '    width:100%;',
                  '    min-height:40px;',
                  '  }',
                  '  .vote-guest-status{',
                  '    display:block;',
                  '  }',
                  '  .vote-switch-link{',
                  '    display:block;',
                  '    margin-top:6px;',
                  '  }',
                  '}',
                  '</style>',
              ]
              style_block = "\n".join(style_lines) + "\n"
              if "</head>" not in text:
                  raise SystemExit("Could not find </head> for vote guidance styles")
              text = text.replace("</head>", style_block + "</head>", 1)

          # ------------------------------------------------------------
          # 2) Rename section + add persistent explanations
          # ------------------------------------------------------------
          old_sections = (
              '  <div class="section-label" style="margin-top:20px;">Keep / Trade / Cut</div>\n'
              '  <div id="ktcWrap"></div>\n\n'
              '  <div class="section-label" style="margin-top:20px;">Package Preference Research</div>\n'
              '  <div id="packageVoteWrap"></div>'
          )

          new_sections = (
              '  <div class="section-label" style="margin-top:20px;">Keep / Trade / Cut</div>\n'
              '  <div class="vote-help-card">\n'
              '    <div class="vote-help-label">What this vote does</div>\n'
              '    <div class="vote-help-text"><strong>Rank three players as Keep, Trade, or Cut.</strong> '
              'League-member votes help build the calculator\\'s Market Value rankings; guest votes are '
              'tracked separately as outside-market context. Player values stay hidden so the model '
              'doesn\\'t influence your choice.</div>\n'
              '  </div>\n'
              '  <div id="ktcWrap"></div>\n\n'
              '  <div class="section-label" style="margin-top:20px;">Trade Package Voting</div>\n'
              '  <div class="vote-help-card package">\n'
              '    <div class="vote-help-label">What this vote does</div>\n'
              '    <div class="vote-help-text"><strong>Choose the trade side you would rather receive.</strong> '
              'These votes help measure how much extra value a multi-player package needs to match a '
              'more concentrated asset. This is research-only and does not change the live trade result yet.</div>\n'
              '  </div>\n'
              '  <div id="packageVoteWrap"></div>'
          )

          text = replace_once(text, old_sections, new_sections, "section labels/info cards")

          # ------------------------------------------------------------
          # 3) Replace the KTC pre-auth state with one compact access card
          # ------------------------------------------------------------
          ktc_fn = text.index("function renderKTC(){")
          ktc_gate_start = text.index(
              "  if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){",
              ktc_fn,
          )
          ktc_gate_end = text.index("  const guestNote = ktcIsGuestMode()", ktc_gate_start)

          ktc_gate = (
              '  if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){\n'
              '    el.innerHTML = `\n'
              '      <div class="vote-access-card">\n'
              '        <div class="vote-access-copy">\n'
              '          <div class="vote-access-title">Ready to vote?</div>\n'
              '          <div class="vote-access-sub">League members: choose your team above so your own players stay out of the pool. Everyone else can vote as a guest.</div>\n'
              '        </div>\n'
              '        <button type="button" class="vote-guest-btn" onclick="ktcStartGuestMode()">Vote as a guest</button>\n'
              '      </div>\n'
              '    `;\n'
              '    return;\n'
              '  }\n\n'
          )
          text = text[:ktc_gate_start] + ktc_gate + text[ktc_gate_end:]

          # ------------------------------------------------------------
          # 4) Restyle/shorten the KTC guest-mode status banner
          # ------------------------------------------------------------
          guest_note_start = text.index("  const guestNote = ktcIsGuestMode()", ktc_fn)
          guest_note_end = text.index("  if(ktcVotesToday() >= KTC_DAILY_VOTE_LIMIT){", guest_note_start)

          guest_note = (
              '  const guestNote = ktcIsGuestMode()\n'
              '    ? `<div class="vote-guest-status">\n'
              '        <div><strong>Guest mode.</strong> Vote for this league\\'s scoring: half-PPR + 0.2 per rush attempt; IDP gives 1.5 per solo tackle, 3 per sack, 2 per QB hit and 3 per forced fumble.</div>\n'
              '        <button type="button" class="vote-switch-link" onclick="ktcExitGuestMode()">Use a league team instead</button>\n'
              '      </div>`\n'
              "    : '';\n\n"
          )
          text = text[:guest_note_start] + guest_note + text[guest_note_end:]

          # ------------------------------------------------------------
          # 5) Replace Package Voting pre-auth state with matching card
          # ------------------------------------------------------------
          pkg_fn = text.index("function renderPackageVote(){")
          pkg_gate_start = text.index(
              "  if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){",
              pkg_fn,
          )
          pkg_gate_end = text.index(
              "  if(packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT){",
              pkg_gate_start,
          )

          pkg_gate = (
              '  if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){\n'
              '    el.innerHTML = `\n'
              '      <div class="vote-access-card">\n'
              '        <div class="vote-access-copy">\n'
              '          <div class="vote-access-title">Ready to compare trades?</div>\n'
              '          <div class="vote-access-sub">League members: choose your team above so challenges avoid your roster. Everyone else can vote as a guest.</div>\n'
              '        </div>\n'
              '        <button type="button" class="vote-guest-btn" onclick="ktcStartGuestMode()">Vote as a guest</button>\n'
              '      </div>\n'
              '    `;\n'
              '    return;\n'
              '  }\n\n'
          )
          text = text[:pkg_gate_start] + pkg_gate + text[pkg_gate_end:]

          path.write_text(text, encoding="utf-8")
          print("Voting sections restyled and clarified.")
          PY

      - name: Verify voting UI contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")

          assert 'id="vote-guidance-ui-v2"' in text
          assert "Trade Package Voting" in text
          assert "Package Preference Research" not in text
          assert text.count("What this vote does") == 2
          assert "League-member votes help build the calculator's Market Value rankings" in text
          assert "research-only and does not change the live trade result yet" in text
          assert text.count('class="vote-guest-btn"') == 2
          assert "Ready to vote?" in text
          assert "Ready to compare trades?" in text
          assert "Guest mode." in text

          # Existing identity, transport and caps remain unchanged.
          assert "function ktcStartGuestMode(){" in text
          assert "renderPackageVote();" in text[text.index("function ktcStartGuestMode(){"):][:300]
          assert "__pkgv1__|${id}|${choice}" in text
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 10;" in text
          assert "const KTC_DAILY_VOTE_LIMIT = 20;" in text

          print("Voting UI contract verified.")
          PY

      - name: Run repo regression checks
        shell: bash
        run: |
          pip install requests
          python3 scripts/validation/repo_regression_checks.py

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/refine-voting-sections-ui.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "trade-desk-ui-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add -u .github/workflows/refine-voting-sections-ui.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Clarify and restyle voting sections"
          git push origin main
