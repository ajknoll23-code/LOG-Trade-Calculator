name: A-NL39R1 — Weekly Editorial + Approved Layout Integration (Shadow Only)
run-name: A-NL39R1 - Fresh NL36 writing + NL38R2 design - War Room W${{ inputs.war_week }}
'on':
  workflow_dispatch:
    inputs:
      war_week:
        description: Upcoming War Room NFL week (2-18); Aftermath uses the immediately preceding week
        required: true
        type: string
        default: '10'
      reuse_nl36_run_id:
        description: Optional successful NL36 source run ID for read-only replay; leave blank for new weekly generation
        required: false
        type: string
        default: ''
# Limited Actions write permission dispatches ONLY the existing NL36 editorial workflow.
# Neither source nor output newsletter is published, sent, archived as a pick, or committed.
permissions:
  contents: read
  actions: write
concurrency:
  group: log-nl39r1-weekly-shadow-${{ inputs.war_week }}
  cancel-in-progress: false
jobs:
  weekly-newsroom-shadow:
    name: Build NL36 weekly text, then NL38R2 design, strict QA and artifact preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WAR_WEEK: ${{ inputs.war_week }}
    steps:
      - name: Resolve approved NL36 editorial source, generating a fresh week by default
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_SOURCE_RUN: ${{ inputs.reuse_nl36_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'NL39_SOURCE'
          from __future__ import annotations
          import json, os, re, time, urllib.request, urllib.error, datetime

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          war=int(os.environ['WAR_WEEK'])
          reuse=os.environ.get('REUSE_SOURCE_RUN','').strip()
          if war not in range(2,19):
              raise SystemExit('FAIL: War Room week must be between 2 and 18 in the pinned 2026 season')
          after=war-1
          api=f'https://api.github.com/repos/{repo}'
          headers={'Authorization':f'Bearer {token}', 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'User-Agent':'LOG-NL39R1-Shadow'}

          def gh(method,endpoint,payload=None):
              body=json.dumps(payload).encode() if payload is not None else None
              h=dict(headers)
              if body is not None:h['Content-Type']='application/json'
              request=urllib.request.Request(api+endpoint, data=body, headers=h, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None

          def verify_run(run):
              label=run.get('display_title') or run.get('name') or ''
              pattern=rf'\bW0?{war}\s*/\s*W0?{after}\b'
              if (not re.search(pattern,label) or
                      run.get('path')!='.github/workflows/A-NL36R1.yml' or
                      run.get('head_branch')!='main' or
                      run.get('event')!='workflow_dispatch'):
                  raise RuntimeError(f'Incorrect source workflow or week pair, refusing stale/mismatched newsletter: id={run.get("id")}, title={label!r}, path={run.get("path")!r}')

          if reuse:
              if not re.fullmatch(r'\d+',reuse):raise RuntimeError('Optional source run ID must be a positive integer')
              run=gh('GET',f'/actions/runs/{int(reuse)}')
              verify_run(run)
              if run.get('status')!='completed' or run.get('conclusion')!='success':
                  raise RuntimeError('Provided NL36 source run did not succeed')
              run_id=int(reuse)
              print(f'REPLAY MODE: using matching successful NL36 W{war}/W{after} run #{run_id}')
          else:
              # The approved NL36 pipeline is dispatched unchanged; no copied / modified
              # prose generator, no repository or production-data write.
              # Fail before dispatch if Sleeper has not advanced to the desired War Room week.
              req=urllib.request.Request('https://api.sleeper.app/v1/state/nfl', headers={'User-Agent':'LOG-NL39R1-Shadow'})
              with urllib.request.urlopen(req,timeout=25) as response:state=json.load(response)
              if str(state.get('season'))!='2026' or int(state.get('week') or 0)<war:
                  raise RuntimeError(f'Sleeper not ready for requested pair W{war}/W{after}: state={state.get("season")}/{state.get("week")}')
              before=gh('GET','/actions/workflows/A-NL36R1.yml/runs?event=workflow_dispatch&branch=main&per_page=40')
              previous_ids={int(r['id']) for r in before.get('workflow_runs',[])}
              print(f'Dispatching unchanged NL36 editorial engine: War Room W{war}; completed Aftermath W{after}',flush=True)
              gh('POST','/actions/workflows/A-NL36R1.yml/dispatches',{'ref':'main','inputs':{'war_week':str(war),'aftermath_week':str(after)}})
              deadline=time.monotonic()+12*60
              run_id=None
              while time.monotonic()<deadline:
                  new=gh('GET','/actions/workflows/A-NL36R1.yml/runs?event=workflow_dispatch&branch=main&per_page=40')
                  matches=[]
                  for r in new.get('workflow_runs',[]):
                      if int(r['id']) in previous_ids:continue
                      try:verify_run(r)
                      except RuntimeError:continue
                      matches.append(r)
                  if len(matches)>1:
                      raise RuntimeError('Ambiguous NL36 runs matching this week pair; refusing to associate an unverified source')
                  if matches:
                      run_id=int(matches[0]['id'])
                      break
                  time.sleep(5)
              if run_id is None:raise RuntimeError('NL36 dispatched but no uniquely identified matching run appeared before timeout')
              while time.monotonic()<deadline:
                  run=gh('GET',f'/actions/runs/{run_id}')
                  verify_run(run)
                  status=run.get('status')
                  if status=='completed':
                      if run.get('conclusion')!='success':
                          raise RuntimeError(f'NL36R1 source run #{run_id} ended {run.get("conclusion")}; failing closed')
                      break
                  time.sleep(8)
              else:raise RuntimeError(f'NL36R1 source run #{run_id} not finished before timeout')

          art=gh('GET',f'/actions/runs/{run_id}/artifacts?per_page=100')
          expected=f'LOG-NL36R1-Final-Editorial-Shadow-{run_id}'
          found=[x for x in art.get('artifacts',[]) if x.get('name')==expected and not x.get('expired')]
          if len(found)!=1:raise RuntimeError(f'NL36 passed but missing/ambiguous source artifact {expected!r}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
              fh.write(f'run_id={run_id}\nwar_week={war}\nafter_week={after}\nsource_artifact_id={found[0]["id"]}\n')
          print(f'PASS: NL36 verified W{war}/W{after}, source run #{run_id}, artifact #{found[0]["id"]}')
          NL39_SOURCE
      - name: Download NL36 source artifact for the exact week pair
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL36R1-Final-Editorial-Shadow-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl36_input
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned renderer and inspectors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'weasyprint==68.0' 'pymupdf==1.26.5' 'beautifulsoup4==4.14.3'
      - name: Render dynamic weeks with approved NL38R2 adaptive layout (no copy edits)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/nl39_weekly_layout.py" <<'NL39_RENDERER'
          #!/usr/bin/env python3
          """NL38 design-only layout concept: one structured matchup per page, preserve NL36 copy.
          No live data, repo writes, or editorial changes.
          """
          from __future__ import annotations
          import argparse, html, json, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from weasyprint import HTML
          import fitz

          CSS='''
          @page {size:108mm 244mm; margin:7.5mm 7mm 11mm;
           @bottom-left {content:'LOG EDITORIAL SHADOW  •  NOT PUBLISHED';font:7.3pt Arial;color:#75858A}
           @bottom-right {content:'LOG  /  ' counter(page);font:7.3pt Arial;color:#75858A}}
          *{box-sizing:border-box}html,body{margin:0;padding:0;overflow-wrap:anywhere}
          body{color:#18374C;background:#FCFAF5;font:11.8pt/1.39 Georgia,'Times New Roman',serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
          .cover{break-after:page}.masthead{background:#112E46;color:#FFF9EE;border-bottom:3pt solid #BA6B5C;padding:4.7mm 4.5mm 4.5mm}
          .masthead-inner{display:flex;gap:3mm;align-items:center}.logo{height:13mm;width:13mm;object-fit:contain;flex:none}
          .eyebrow{font:700 8.2pt/1.2 Arial;color:#BC6D5E;letter-spacing:.8pt;text-transform:uppercase}.masthead .eyebrow{color:#EACDBB}
          h1{color:#FFF8EB;font:23pt/1.03 Georgia;margin:1mm 0 .6mm}.week-label{font:10pt Arial;color:#E1CFBF}
          .cover-main{padding:4.4mm 2.5mm 0}.cover-lead{font:15.3pt/1.13 Georgia;margin:1.8mm 0 2mm;color:#1A3950}
          .cover-deck{font:10.5pt/1.36 Georgia;margin:0 0 4mm}
          .index-title{font:700 8.6pt Arial;letter-spacing:1.1pt;color:#A55D53;text-transform:uppercase;margin:0 0 1.5mm}
          .index{margin:0;padding:0;list-style:none}.index li{display:flex;gap:2.4mm;padding:2.25mm .4mm;border-top:.7pt solid #CFD5D5;break-inside:avoid}
          .index-num{font:700 9.2pt Arial;color:#B66859;min-width:6mm}.index h3{font:700 10.5pt/1.2 Arial;margin:0;color:#1A374D}
          .index p{font:9.2pt/1.17 Arial;margin:.5mm 0 0;color:#607687}
          .cover-note{background:#EEEAE5;border-left:2.5pt solid #B66C5C;padding:2.4mm;margin:5mm 0 0;font:8.2pt/1.32 Arial;color:#506575}
          .match{break-before:page;break-inside:avoid}
          .topline{display:flex;justify-content:space-between;gap:3mm;border-bottom:.65pt solid #CCD2D2;padding:0 0 1.7mm;margin-bottom:3mm;font:700 8.3pt Arial;letter-spacing:1pt;text-transform:uppercase;color:#AF6359}
          .headline{font:19.2pt/1.11 Georgia;color:#16334A;margin:0 0 2.4mm;letter-spacing:-.2pt}
          .teams{font:700 11.3pt/1.26 Arial;color:#1D3D54;margin:0 0 3mm;padding-bottom:2.5mm;border-bottom:2pt solid #B76F60}
          .kicker{font:700 8.5pt/1.16 Arial;letter-spacing:1.05pt;text-transform:uppercase;color:#AA5F53;margin:0 0 1.4mm}
          .lead{background:#E7EEF0;border-left:2.5pt solid #B97969;padding:2.5mm 2.7mm 2.7mm;margin:0 0 3.8mm}
          .lead p{margin:0;font:12.0pt/1.40 Georgia;color:#19384E}
          .stats{margin:0 0 4mm}.stats-box{border-top:.6pt solid #CBD4D6;border-bottom:.6pt solid #CBD4D6}
          .stat{padding:1.5mm 0;display:flex;justify-content:space-between;gap:3mm;border-bottom:.5pt solid #DEE2E2}
          .stat:last-child{border-bottom:0}.stat-name{font:700 8.1pt/1.17 Arial;letter-spacing:.25pt;color:#637B88;max-width:48%}
          .stat-value{font:700 10.7pt/1.19 Arial;color:#23445A;text-align:right;max-width:50%}
          .analysis{border-top:.7pt solid #D4D9DA;padding-top:2.7mm;margin:0 0 3.5mm}
          .analysis p{font:11.8pt/1.41 Georgia;color:#1A394F;margin:0}
          .verdict{background:#F2EBE5;border-left:3pt solid #B56B5F;padding:3mm 3mm 3.2mm;margin:0 0 3.2mm}
          .verdict .kicker{color:#985347}.verdict p{font:700 12.5pt/1.4 Georgia;color:#17374E;margin:0}
          .source{border-top:.6pt solid #D7DADA;padding-top:1.6mm;margin:0;font:7.2pt/1.29 Arial;color:#718189}
          .source b{font-weight:700;color:#936459}
          .match.long .headline{font-size:18.7pt;margin-bottom:1.8mm}
          .match.long .teams{margin-bottom:2mm;padding-bottom:1.7mm}
          .match.long .lead{padding:2mm 2.5mm 2.1mm;margin-bottom:2.6mm}
          .match.long .lead p{font:11.8pt/1.35 Georgia}
          .match.long .stats{margin-bottom:2.8mm}
          .match.long .stat{padding:1.1mm 0}
          .match.long .analysis{padding-top:2.1mm;margin-bottom:2.6mm}
          .match.long .analysis p{font:11.6pt/1.34 Georgia}
          .match.long .verdict{padding:2.3mm 2.5mm 2.5mm;margin-bottom:2mm}
          .match.long .verdict p{font:700 12.3pt/1.34 Georgia}
          /* NL38R2: apply additional optical compression ONLY to a matchup that actually
             overflows on the active GitHub runner; no global body-text downsizing. */
          .match.tight .topline{padding-bottom:1mm;margin-bottom:1.8mm}
          .match.tight .headline{font:17.8pt/1.08 Georgia;margin:0 0 1.5mm}
          .match.tight .teams{font-size:10.9pt;margin-bottom:1.5mm;padding-bottom:1.4mm}
          .match.tight .kicker{font-size:8pt;line-height:1.1;margin-bottom:1mm}
          .match.tight .lead{padding:1.5mm 2mm;margin-bottom:2mm}
          .match.tight .lead p{font:11.2pt/1.28 Georgia}
          .match.tight .stats{margin-bottom:2mm}
          .match.tight .stat{padding:.8mm 0}
          .match.tight .stat-value{font-size:10.2pt}
          .match.tight .analysis{padding-top:1.3mm;margin-bottom:1.7mm}
          .match.tight .analysis p{font:11.1pt/1.28 Georgia}
          .match.tight .verdict{padding:1.8mm 2mm;margin-bottom:1.4mm}
          .match.tight .verdict p{font:700 11.7pt/1.27 Georgia}
          .match.tight .source{padding-top:1mm;line-height:1.21}
          .match.ultra .topline{margin-bottom:1.3mm}
          .match.ultra .headline{font:17.2pt/1.06 Georgia;margin:0 0 1.1mm}
          .match.ultra .teams{margin-bottom:1mm;padding-bottom:1mm}
          .match.ultra .lead{padding:1.1mm 1.8mm;margin-bottom:1.35mm}
          .match.ultra .lead p{font:10.9pt/1.24 Georgia}
          .match.ultra .stats{margin-bottom:1.4mm}
          .match.ultra .analysis{padding-top:1.1mm;margin-bottom:1.35mm}
          .match.ultra .analysis p{font:10.8pt/1.24 Georgia}
          .match.ultra .verdict{padding:1.4mm 1.8mm;margin-bottom:1.2mm}
          .match.ultra .verdict p{font:700 11.3pt/1.24 Georgia}

          '''

          def inside(x):return ''.join(str(z) for z in x.contents) if x else ''
          def norm(s):
              # A PDF line break after a hyphen may appear as 'full- lineup'; this is
              # text extraction normalization, not an editorial rewrite.
              return re.sub(r'(?<=\w)-\s+(?=\w)', '-', re.sub(r'\s+',' ',s).strip())

          def build(src:Path,dest:Path, week:int):
              soup=BeautifulSoup(src.read_text(encoding='utf-8'),'html.parser');games=soup.select('.game-page')
              if len(games)!=6:raise ValueError('Expected six matchups')
              kind='WarRoom' if 'WarRoom' in src.name else 'Aftermath'; wk=f"{week:02d}"
              title='The Weekly War Room' if kind=='WarRoom' else 'The Aftermath'; wkint=int(wk)
              logonode=soup.select_one('.masthead img');logo=logonode.get('src','') if logonode else ''
              idx=[];articles=[]; originals=[]
              for i,g in enumerate(games,1):
                  heading=g.select_one('h2');teams=g.select_one('.teams');body=g.select_one('.body');source=g.select_one('.source')
                  if not all((heading,teams,body,source)):raise RuntimeError(f'Missing story components {i}')
                  parts=body.find_all(recursive=False)
                  if len(parts)!=3:raise RuntimeError(f'{i}: bad narrative sections')
                  p=[norm(z.get_text(' ',strip=True)) for z in parts]; originals.append(p)
                  stats=g.select('.stats > div');
                  if len(stats)<2:raise RuntimeError(f'{i}: missing stats')
                  sh=''.join(f'<div class="stat"><div class="stat-name">{inside(z.select_one("span"))}</div><div class="stat-value">{inside(z.select_one("b"))}</div></div>' for z in stats)
                  h=html.escape(heading.get_text(' ',strip=True));t=html.escape(teams.get_text(' ',strip=True))
                  idx.append(f'<li><span class="index-num">{i:02d}</span><div><h3>{h}</h3><p>{t}</p></div></li>')
                  first='THE STAKES' if kind=='WarRoom' else 'WHAT HAPPENED'
                  second='PLAYER SPOTLIGHT' if kind=='WarRoom' else 'THE EVIDENCE'
                  third='MY PICK & FINAL WORD' if kind=='WarRoom' else 'THE FINAL VERDICT'
                  articles.append(f'''<article class="match{' long' if kind=='WarRoom' and i==4 else ''}">
                    <div class="topline"><span>MATCHUP {i:02d} / 06</span><span>{'WAR ROOM' if kind=='WarRoom' else 'AFTERMATH'} · WEEK {wkint}</span></div>
                    <h2 class="headline">{h}</h2><div class="teams">{t}</div>
                    <section class="lead"><h3 class="kicker">{first}</h3><p>{html.escape(p[0])}</p></section>
                    <section class="stats"><h3 class="kicker">AT A GLANCE</h3><div class="stats-box">{sh}</div></section>
                    <section class="analysis"><h3 class="kicker">{second}</h3><p>{html.escape(p[1])}</p></section>
                    <section class="verdict"><h3 class="kicker">{third}</h3><p>{html.escape(p[2])}</p></section>
                    <div class="source">{inside(source)}</div>
                  </article>''')
              cover=f'''<section class="cover"><header class="masthead"><div class="masthead-inner"><img class="logo" src="{logo}" /><div><div class="eyebrow">LEAGUE OF ORDINARY GENTLEMEN · EDITORIAL</div><h1>{title}</h1><div class="week-label">WEEK {wkint} / 2026</div></div></div></header>
                <div class="cover-main"><div class="eyebrow">SIX MATCHUPS · ONE SHARP READ</div><h2 class="cover-lead">All the attitude.<br/>None of the clutter.</h2><p class="cover-deck">The NL36 writing you approved, presented with sharper sections, larger type, and stronger final verdicts.</p>
                <h3 class="index-title">IN THIS ISSUE</h3><ol class="index">{''.join(idx)}</ol><div class="cover-note">DESIGN SHADOW • NOT PUBLISHED<br/>Content unchanged from the NL36 editorial edition.</div></div></section>'''
              path=dest/f'LOG-NL39R1-{kind}-W{wk}-Weekly-Integration-Shadow'
              # Font metrics differ between the local PDF builder and Ubuntu runners.
              # Start with the original layout, then tighten ONLY the specific matchup(s)
              # generating orphan overflow pages. Never claim a seven-page issue before
              # inspecting the actual rendered PDF on this very runner.
              tiers=[0,0,0,1 if kind=='WarRoom' else 0,0,0]
              fit_log=[]
              page=None
              for attempt in range(1,13):
                  items=[]
                  for j,article in enumerate(articles):
                      tier=tiers[j]
                      classes='match'+(' long' if tier>=1 else '')+(' tight' if tier>=2 else '')+(' ultra' if tier>=3 else '')
                      items.append(re.sub(r'<article class="match(?: long)?">',
                                          f'<article class="{classes}">',article,count=1))
                  page=f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>{CSS}</style></head><body>{cover}{''.join(items)}</body></html>'''
                  HTML(string=page,base_url=str(dest)).write_pdf(str(path.with_suffix('.pdf')))
                  with fitz.open(str(path.with_suffix('.pdf'))) as temp:
                      page_matchups=[]; previous=None; overflow=[]; encountered=[]
                      for pi,pg in enumerate(temp):
                          if pi==0:
                              continue
                          text=' '.join(pg.get_text().split())
                          match=re.search(r'MATCHUP\s+(\d{1,2})\s*/\s*06',text)
                          if match:
                              previous=int(match.group(1))
                              encountered.append(previous)
                          elif previous is not None:
                              overflow.append(previous)
                          else:
                              raise RuntimeError(f'{kind}: unidentified page {pi+1}, cannot assess overflow safely')
                          page_matchups.append(previous)
                      if encountered != list(range(1,7)):
                          raise RuntimeError(f'{kind}: missing/duplicate/out-of-order matchup headers: {encountered}')
                      fit_log.append({'pass':attempt,'pages':len(temp),'density':tiers.copy(),'overflow_matchups':sorted(set(overflow))})
                      if len(temp)==7 and not overflow:
                          break
                      if len(temp)<7 or not overflow:
                          raise RuntimeError(f'{kind}: unexpected pagination: {fit_log[-1]}')
                      for number in sorted(set(overflow)):
                          j=number-1
                          if tiers[j]>=3:
                              raise RuntimeError(f'{kind}: article {number} still overflows at best permitted readability: {fit_log}')
                          tiers[j]+=1
              else:
                  raise RuntimeError(f'{kind}: unable to fit one page per matchup after {len(fit_log)} attempts')
              path.with_suffix('.html').write_text(page,encoding='utf-8')
              doc=fitz.open(str(path.with_suffix('.pdf')))
              nall=norm(' '.join(x.get_text() for x in doc));missing=[]
              for i,pp in enumerate(originals,1):
                  for j,p in enumerate(pp,1):
                      words=norm(p).split();beg=' '.join(words[:min(5,len(words))]);end=' '.join(words[-min(5,len(words)):])
                      if beg not in nall:missing.append((i,j,'start',beg))
                      if end not in nall:missing.append((i,j,'end',end))
              if missing:raise RuntimeError(f'Text integrity failure: {missing}')
              widths=[round(x.rect.width,1) for x in doc];
              info={'kind':kind,'pages':len(doc),'pdf':str(path.with_suffix('.pdf')),'min_font_pt':min(round(s['size'],1) for p in doc for b in p.get_text('dict')['blocks'] for line in b.get('lines',[]) for s in line.get('spans',[]) if s['text'].strip()),'page_dims':[[round(p.rect.width,1),round(p.rect.height,1)] for p in doc],'chars_per_page':[len(p.get_text()) for p in doc],'text_integrity':'PASS', 'render_fit_log':fit_log, 'selected_density_tiers':tiers }
              return info

          if __name__=='__main__':
              ap=argparse.ArgumentParser();ap.add_argument('--source-dir',required=True);ap.add_argument('--output-dir',required=True);ap.add_argument('--war-week',required=True,type=int);a=ap.parse_args()
              out=Path(a.output_dir);out.mkdir(parents=True,exist_ok=True);src=Path(a.source_dir)
              assert 2 <= a.war_week <= 18
              info=[build(src/f'LOG-NL36R1-{k}-W{w:02d}-Editorial-Shadow.html',out,w) for k,w in [('WarRoom',a.war_week),('Aftermath',a.war_week-1)]]
              (out/'NL39R1-DESIGN-QA.json').write_text(json.dumps(info,indent=2),encoding='utf-8')
              print(json.dumps(info,indent=2))
          NL39_RENDERER
          python3 "$RUNNER_TEMP/nl39_weekly_layout.py" --source-dir nl36_input --output-dir nl39_output --war-week "$WAR_WEEK"
      - name: Independently verify source weeks, six full stories, exact copy and stats, seven pages
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.source_artifact_id }}
        run: |
          set -euo pipefail
          python3 - <<'NL39_VERIFY'
          import fitz, json, re, hashlib, os
          from pathlib import Path
          from bs4 import BeautifulSoup
          war=int(os.environ['WAR_WEEK']); after=war-1
          srcdir=Path('nl36_input'); outdir=Path('nl39_output')
          qa=json.loads((outdir/'NL39R1-DESIGN-QA.json').read_text())
          assert len(qa)==2 and {a['kind'] for a in qa}=={'WarRoom','Aftermath'}, 'Must render exactly two edition reports'
          manifest={'workflow':'A-NL39R1','edition':'2026','status':'SHADOW_ONLY_NOT_PUBLISHED','war_week':war,'aftermath_week':after,
                    'nl36_source_run_id':int(os.environ['SOURCE_RUN_ID']),
                    'nl36_source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
                    'renderer_algorithm':'approved NL38R2 adaptive per-match layout, week-parameterized',
                    'files':{},'qa':{}}
          for kind,wk in (('WarRoom',war),('Aftermath',after)):
              k=f'W{wk:02d}'
              result=next(x for x in qa if x['kind']==kind)
              assert result['pages']==7 and result['text_integrity']=='PASS'
              assert result['min_font_pt']>=7.0
              assert result['render_fit_log'][-1]['pages']==7
              assert not result['render_fit_log'][-1]['overflow_matchups']
              source=srcdir/f'LOG-NL36R1-{kind}-{k}-Editorial-Shadow.html'
              assert source.is_file(), f'Source {source} missing; refusing stale input'
              original=BeautifulSoup(source.read_text(encoding='utf-8'),'html.parser')
              games=original.select('.game-page')
              assert len(games)==6, f'{kind} must have exactly six matchups'
              pdf=outdir/f'LOG-NL39R1-{kind}-{k}-Weekly-Integration-Shadow.pdf'
              html=pdf.with_suffix('.html')
              assert pdf.is_file() and html.is_file(), f'Output {pdf} missing'
              with fitz.open(pdf) as doc:
                  assert len(doc)==7, f'{kind} requires one cover + six full matchups'
                  for i,g in enumerate(games,1):
                      t=' '.join(doc[i].get_text().split())
                      t=re.sub(r'(?<=\w)-\s+(?=\w)', '-', t)
                      assert f'MATCHUP {i:02d} / 06' in t, (kind,i,'page identity')
                      assert f'WEEK {wk}' in t.upper(), (kind,i,'week identity')
                      assert len(t)>380, (kind,i,'truncated/orphan page')
                      for part in g.select_one('.body').find_all(recursive=False):
                          text=' '.join(part.get_text(' ',strip=True).split())
                          assert text in t, (kind,i,'NL36 paragraph changed',text[:100])
                      for stat in g.select('.stats > div'):
                          value=' '.join(stat.select_one('b').get_text(' ',strip=True).split())
                          assert value in t, (kind,i,'NL36 stat lost',value)
                      assert 'SOURCE' in t, (kind,i,'provenance missing')
                  assert 'NOT PUBLISHED' in doc[0].get_text(), 'Shadow banner missing'
              manifest['files'][kind]={
                  'source_html_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                  'output_html_sha256':hashlib.sha256(html.read_bytes()).hexdigest(),
                  'output_pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
                  'pdf':pdf.name,'html':html.name,'pages':7,'matchups':6
              }
              manifest['qa'][kind]={'fit_tiers':result['selected_density_tiers'],'min_font_pt':result['min_font_pt'],'text_integrity':'PASS'}
              print(f'PASS: {kind} W{wk}: 7 pages, six separate matchups, every paragraph and stat preserved',flush=True)
          (outdir/'NL39R1-SOURCE-AND-PDF-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('PASS: weekly integrated source + approved NL36 copy + NL38R2 design, SHADOW ONLY')
          NL39_VERIFY
      - name: Upload two newsletter PDFs, HTML previews, QA and source manifest (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL39R1-Weekly-Newsroom-Shadow-${{ github.run_id }}
          path: nl39_output/
          retention-days: 90
          if-no-files-found: error
      - name: Write editorial shadow summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NL39_SUMMARY'
          ## NL39R1 — Weekly newsletter integration (SHADOW ONLY)
          - Live NL36 approved voice is generated each week (or matching historic run explicitly replayed).
          - NL38R2 approved design used unchanged except for safely parameterizing week labels and source filenames.
          - Exact historical source run ID and artifact tracked in the output manifest.
          - Each newsletter must contain six complete matchups, one cover, seven pages, and all source paragraphs and stats.
          - If Sleeper has not advanced, NL36 errors, weeks do not match, or renderer overflows: fail CLOSED.
          - No email, publication, pick archive, repository changes, or free-agent board exposure.
          - Manual weekly trigger only until a complete current-week trial and human approval.
          NL39_SUMMARY
