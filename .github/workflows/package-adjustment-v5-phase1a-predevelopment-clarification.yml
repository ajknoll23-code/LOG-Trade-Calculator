name: Package Adjustment V5 - Phase 1A Predevelopment Clarification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  clarify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V5 predevelopment state
        shell: bash
        run: |
          set -euo pipefail
          V5="research/package-adjustment-v5-liquid-picks"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V5/phase1_structural_preregistration.json")" = "97f4da97d35594c658ce7252fb5a0bf0e7a2a188"
          test "$(git hash-object "$V5/phase1_manifest.json")" = "cda5cf9bc10e90c9bd3920ab3907843fc272a4ad"
          test "$(git hash-object research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_research_closeout.json)" = "34ee736d4f0a47db2afaa14cc2b0b95cc428a874"
          test "$(git hash-object research/package-adjustment-v4-elite-fragmentation/phase3_confirmation_evaluation.json)" = "dc293d2e21b1f15e32ded441d64e29e544774251"
          test "$(git hash-object research/package-adjustment-v4-elite-fragmentation/phase3_confirmation_evaluation_manifest.json)" = "d86e12788f2ecfd4fce446e65831c66a7eb19009"

          test ! -e "$V5/phase1a_predevelopment_clarification.json"
          test ! -e "$V5/phase2_development_results.json"
          test ! -e "$V5/phase2_manifest.json"
          test ! -e "$V5/frozen_candidate.json"

      - name: Verify production remains V1.6 before clarification
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze predevelopment clarification without reading V4 ballots
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          v5 = root / "research/package-adjustment-v5-liquid-picks"
          prereg_path = v5 / "phase1_structural_preregistration.json"
          manifest_path = v5 / "phase1_manifest.json"
          out = v5 / "phase1a_predevelopment_clarification.json"

          prereg = json.loads(prereg_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          assert prereg["status"] == "FROZEN_BEFORE_SPENT_V4_DEVELOPMENT"
          assert prereg["frozen"] is True
          assert prereg["candidate_grid"]["candidate_count"] == 12
          assert prereg["candidate_grid"]["players_only_formula_frozen_to_v4_s75"] is True
          assert prereg["base_player_only_contract"]["players_only_trade_scores_must_equal_v4_s75_exactly"] is True
          assert prereg["phase2_spent_v4_development_plan"]["calibration"]["calibration_parameters_refit_inside_each_training_fold"] is True
          assert prereg["phase2_spent_v4_development_plan"]["development_nomination_gates"]["players_only_predictions_must_equal_v4_s75"] is True
          assert manifest["v4_individual_ballots_read_by_this_phase"] is False
          assert manifest["v4_aggregate_evaluation_only"] is True

          # Why clarification is necessary:
          # Candidate-specific calibration is re-fit over the full training fold.
          # Pick-containing rows can therefore change beta/delta_left even when the
          # underlying V5 structural score on every player-only row is exactly the
          # same as V4 s75. Requiring calibrated probabilities to be identical would
          # contradict the separately frozen "refit inside each training fold" rule.
          #
          # This clarification resolves only that internal wording conflict. It does
          # not change the architecture, candidate grid, score formula, thresholds,
          # cross-validation, controls, or confirmation gates.
          clarification = {
              "schema_version": 1,
              "study_id": "package-adjustment-v5-liquid-picks",
              "phase": "1A",
              "status": "FROZEN_PREDEVELOPMENT_CLARIFICATION",
              "frozen": True,
              "frozen_at_utc": datetime.now(timezone.utc).isoformat(),
              "research_only": True,
              "production_change_authorized": False,
              "v4_individual_ballots_read_by_this_phase": False,
              "v4_exact_600_outcomes_analyzed_by_this_phase": False,
              "reason": (
                  "The Phase 1 phrase 'players_only_predictions_must_equal_v4_s75' "
                  "conflicts literally with the separately frozen requirement that "
                  "candidate-specific logistic calibration parameters be refit inside "
                  "each training fold using all training rows. Pick-containing rows "
                  "can change beta/delta_left, so calibrated probabilities need not be "
                  "identical even when the underlying player-only structural score is "
                  "exactly unchanged."
              ),
              "authoritative_interpretation_for_phase2": {
                  "players_only_predictions_must_equal_v4_s75": (
                      "For development nomination, this means the uncalibrated "
                      "normalized effective-score delta produced by every V5 candidate "
                      "must equal the V4 s75 structural score delta exactly on every "
                      "players-only challenge before fold calibration. Calibrated OOF "
                      "probabilities are not required to be identical because beta and "
                      "delta_left are candidate-specific nuisance parameters refit on "
                      "all rows in each training fold."
                  ),
                  "equivalence_tolerance": 1e-12,
                  "candidate_specific_fold_calibration_remains_required": True,
                  "calibration_probability_link_unchanged": (
                      "logistic(beta * normalized_effective_score_delta + "
                      "delta_left * I(canonical_A_displayed_left))"
                  ),
              },
              "unchanged_frozen_contract": {
                  "candidate_count": 12,
                  "candidate_grid_changed": False,
                  "structural_hypothesis_changed": False,
                  "score_formula_changed": False,
                  "cross_validation_changed": False,
                  "calibration_model_changed": False,
                  "raw_control_changed": False,
                  "v4_s75_reference_changed": False,
                  "development_thresholds_changed": False,
                  "near_tie_rule_changed": False,
                  "fresh_confirmation_contract_changed": False,
                  "production_gate_changed": False,
              },
              "development_nomination_thresholds_retained_exactly": prereg[
                  "phase2_spent_v4_development_plan"
              ]["development_nomination_gates"],
              "near_tie_rule_retained_exactly": prereg[
                  "phase2_spent_v4_development_plan"
              ]["near_tie_rule"],
              "governance": {
                  "must_be_applied_before_any_v5_spent_v4_development_run": True,
                  "may_not_be_changed_after_phase2_outcomes_are_read": True,
                  "v4_exact_600_remains_spent_development_evidence_only": True,
                  "fresh_v5_confirmation_still_required_after_candidate_freeze": True,
              },
              "source_fingerprints": {
                  "phase1_preregistration_sha256": hashlib.sha256(
                      prereg_path.read_bytes()
                  ).hexdigest(),
                  "phase1_manifest_sha256": hashlib.sha256(
                      manifest_path.read_bytes()
                  ).hexdigest(),
              },
          }

          out.write_text(
              json.dumps(clarification, indent=2, sort_keys=True) + "\n"
          )
          print("V5_PHASE1A_STATUS=FROZEN_PREDEVELOPMENT_CLARIFICATION")
          PY

      - name: Verify clarification is narrow and predevelopment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "research/package-adjustment-v5-liquid-picks/"
              "phase1a_predevelopment_clarification.json"
          )
          d = json.loads(p.read_text())

          assert d["status"] == "FROZEN_PREDEVELOPMENT_CLARIFICATION"
          assert d["frozen"] is True
          assert d["production_change_authorized"] is False
          assert d["v4_individual_ballots_read_by_this_phase"] is False
          assert d["v4_exact_600_outcomes_analyzed_by_this_phase"] is False

          a = d["authoritative_interpretation_for_phase2"]
          assert a["equivalence_tolerance"] == 1e-12
          assert a["candidate_specific_fold_calibration_remains_required"] is True

          u = d["unchanged_frozen_contract"]
          assert u == {
              "calibration_model_changed": False,
              "candidate_count": 12,
              "candidate_grid_changed": False,
              "cross_validation_changed": False,
              "development_thresholds_changed": False,
              "fresh_confirmation_contract_changed": False,
              "near_tie_rule_changed": False,
              "production_gate_changed": False,
              "raw_control_changed": False,
              "score_formula_changed": False,
              "structural_hypothesis_changed": False,
              "v4_s75_reference_changed": False,
          }

          gates = d["development_nomination_thresholds_retained_exactly"]
          assert gates["minimum_improvement_vs_raw_control"] == 0.005
          assert gates["maximum_overall_log_loss_increase_vs_v4_s75"] == 0.005
          assert gates["minimum_positive_folds_vs_raw"] == 3
          assert gates["maximum_topology_x_asset_mix_regression_vs_raw"] == 0.02
          assert gates["three_v_three_includes_picks_regression_vs_raw_must_be_at_most"] == 0.02
          assert gates["players_only_predictions_must_equal_v4_s75"] is True

          assert d["near_tie_rule_retained_exactly"] == {
              "maximum_candidates_frozen": 2,
              "threshold_mean_log_loss": 0.001,
          }

          print(
              "PASS: V5 Phase 1A resolves only the structural-score/calibrated-"
              "probability wording conflict before development."
          )
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after clarification
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V5 Phase 1A workflow
        run: git rm .github/workflows/package-adjustment-v5-phase1a-predevelopment-clarification.yml

      - name: Stage exact Phase 1A scope
        shell: bash
        run: |
          set -euo pipefail

          git add research/package-adjustment-v5-liquid-picks/phase1a_predevelopment_clarification.json
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v5-liquid-picks/phase1a_predevelopment_clarification.json",
              ".github/workflows/package-adjustment-v5-phase1a-predevelopment-clarification.yml",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise RuntimeError(
                  f"Unexpected V5 Phase 1A scope: {sorted(changed)}"
              )
          print("PASS: exact two-file V5 Phase 1A scope staged.")
          PY

      - name: Commit frozen V5 predevelopment clarification
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Clarify Package Adjustment V5 predevelopment contract"
          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-v5-liquid-picks/phase1_structural_preregistration.json)" = "97f4da97d35594c658ce7252fb5a0bf0e7a2a188"
          test ! -e .github/workflows/package-adjustment-v5-phase1a-predevelopment-clarification.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "V5_PHASE1A_STATUS=FROZEN_PREDEVELOPMENT_CLARIFICATION"
          git log --oneline -1
