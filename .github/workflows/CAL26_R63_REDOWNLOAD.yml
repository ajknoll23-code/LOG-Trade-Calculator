name: CAL26 V1R63 - Chronological Week6 LOG Forecast Seven Positions (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r63-frozen-week6-historical-forecast
  cancel-in-progress: false
jobs:
  seven-position-week6-prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - name: Read-only repository checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download pinned R60 historical LOG scoring and source checksums
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R60_2021_25_SEVEN_POSITION_FUTURE_SURPLUS_RESEARCH_ONLY
        run-id: 40057944765
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r63-inputs/R60
    - name: Calculate chronological seven-position Week6 next-year holdout
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/cal26_v1r63_engine.py" <<'PY_CAL26_V1R63_ENGINE_FROZEN'
        #!/usr/bin/env python3
        """CAL26 V1R63: pinned LOG-scored Week6 -> following-season chronology, seven positions.
        Historical audit only. No 2026 stats, no market prices, no live outputs.
        """
        import argparse, ast, collections, csv, hashlib, io, json, math, pathlib, statistics, subprocess, sys, time, urllib.request, urllib.error
        ROOT='CAL26_V1R63'; POS=('QB','RB','WR','TE','DL','LB','DB')
        RUN_R60=40057944765
        SRC='research/roster-economics/historical_weekly_points_pipeline.py'
        ARCH='research/roster-economics/weekly_points_by_season.json'
        BLOBS={SRC:'d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace',ARCH:'ad8c2275042fba93cbbae20d6a0b8c27b4bcaf84'}
        INPUTS={'CAL26_V1R60_2021_25_historical_id_playerseason_rows.csv':'b93de295d84df948d1d4c00af21e791584b61f887f37e500d42a87cabd07613c',
        'CAL26_V1R60_historical_source_digest_ledger.csv':'ff7c47b1446875eddd2fb38c12a765419994217e71143c99dc90dc5ad58af63d',
        'CAL26_V1R60_35_season_pos_references.csv':'07e61e82998e8c3f9fe7b3ba990f7180c2a98ab0835ffc0d2c446fa55c788228'}
        MODEL=('ytd','recent3','blend50')
        def check(condition,code):
         if not condition:raise AssertionError(code)
        def digest(b):return hashlib.sha256(b).hexdigest()
        def num(t):
         x=float(t);check(math.isfinite(x),'NONFINITE_NUMBER');return x
        def csv_read(path):return list(csv.DictReader(path.open(newline='',encoding='utf-8-sig')))
        def csv_write(rows,columns=None):
         check(bool(rows),'EMPTY_OUTPUT');buf=io.StringIO(newline='');w=csv.DictWriter(buf,fieldnames=columns or list(rows[0]),lineterminator='\n');w.writeheader();w.writerows(rows);return buf.getvalue()
        def load(a):
         mpath=a.inputs/'CAL26_V1R60_manifest.json';check(mpath.is_file(),'MISSING_PINNED_R60_MANIFEST');man=json.loads(mpath.read_text())
         check(man['semantic_status']=='HISTORICAL_2021_25_SEVEN_POSITION_SURPLUS_HORIZONS__FV_HOLD' and man['fixture'] is False,'R60_NOT_REAL_FROZEN')
         check(man['sources']['2021_23_stats_endpoint_calls']==54 and man['no_2026_actuals_read'] and not man['production_change_authorized'],'R60_SOURCE_GUARD')
         ret={}
         for fn,expected in INPUTS.items():
          p=a.inputs/fn;check(p.is_file() and digest(p.read_bytes())==expected and man['output_sha256'][fn]==expected,'R60_PIN_DRIFT_'+fn)
          ret[fn]=csv_read(p)
         hist,ledger,ref=(ret[n] for n in INPUTS)
         check(len(hist)==8572 and len(ledger)==55 and len(ref)==35,'R60_INPUT_COUNTS_CHANGED')
         check(len({(x['season'],x['Sleeper_id']) for x in hist})==len(hist),'R60_DUPLICATE_SEASON_PID')
         return hist,ledger,ref,man

        def get_repo(repo,fixture=False):
         if fixture:
          return (lambda z:0.0),{'2024':{},'2025':{}},'SYNTHETIC_FIXTURE_NOT_REAL'
         for fn,sha in BLOBS.items():
          file=repo/fn;check(file.is_file(),'MISSING_REPO_'+fn)
          gitsha=subprocess.check_output(['git','hash-object','--',str(file)],text=True).strip()
          check(gitsha==sha,'REPO_SOURCE_DRIFT_'+fn)
         source_ast=ast.parse((repo/SRC).read_text());func=[x for x in source_ast.body if isinstance(x,ast.FunctionDef) and x.name=='score_week']
         check(len(func)==1,'MISSING_VERIFIED_LOG_SCORER')
         isolate=ast.fix_missing_locations(ast.Module(body=func,type_ignores=[]));ns={'__builtins__':{}}
         exec(compile(isolate,str(repo/SRC),'exec'),ns)
         archive=json.loads((repo/ARCH).read_text());check(set(archive['seasons'])=={'2024','2025'},'BAD_ARCHIVE_YEARS')
         return ns['score_week'],archive['seasons'],digest((repo/ARCH).read_bytes())

        def fetch(url):
         check(url.startswith('https://api.sleeper.app/v1/stats/nfl/regular/') and len(url.split('/'))==9 and url.split('/')[-2] in ('2021','2022','2023') and url.split('/')[-1] in ('1','2','3','4','5','6'),'UNAPPROVED_ENDPOINT')
         last=None
         for attempt in range(3):
          try:
           req=urllib.request.Request(url,headers={'User-Agent':'CAL26-V1R63-2021-23-frozen-week6','Accept':'application/json'})
           with urllib.request.urlopen(req,timeout=45) as response:
            check(response.status==200,'HISTORICAL_SOURCE_HTTP_STATUS');blob=response.read(12000000);check(len(blob)<12000000,'OVERSIZE_WEEK');return blob
          except (TimeoutError,OSError,urllib.error.URLError) as ex:
           last=ex;time.sleep(1+attempt)
         raise RuntimeError('PINNED_HISTORY_DOWNLOAD_FAILED '+url+' '+str(last))

        def build_features(a,hist,ledger,score,archive):
         base={(int(r['season']),r['Sleeper_id']):r for r in hist}
         week={};trace=[]
         if a.fixture:
          for (year,pid),row in base.items():
           if year>2024:continue
           # Synthetic timing regression only: months 7-18 are NOT sourced as Week1-6.
           total=max(0,num(row['actual_LOG_points']));q=(int(pid[-2:])%5 if pid[-2:].isdigit() else 2)
           for w in range(1,7):week[year,pid,w]=round(total*(.015+q*.003 + w*.0003),2)
          return week,[{'year':'fixture','week':'1-6','source':'SYNTHETIC_NOT_EVIDENCE','sha256':'NONE'}]
         expected={(int(x['year']),int(x['week'])):x for x in ledger if x['year'] in ('2021','2022','2023') and str(x['week']).isdigit() and int(x['week'])<=6}
         check(len(expected)==18,'MISSING_REAL_WEEK6_DIGESTS')
         for year in (2021,2022,2023):
          for w in range(1,7):
           e=expected[year,w];url=f'https://api.sleeper.app/v1/stats/nfl/regular/{year}/{w}'
           check(e['url']==url,'LEDGER_ENDPOINT_DRIFT');blob=fetch(url)
           check(digest(blob)==e['sha256'],'HISTORICAL_SOURCE_BYTES_CHANGED_'+str(year)+'_'+str(w))
           stats=json.loads(blob);check(isinstance(stats,dict),'BAD_WEEKLY_STAT_TYPE')
           matched=0
           for pid,s in stats.items():
            row=base.get((year,str(pid)))
            if row is None or row['position'] not in POS:continue
            if not isinstance(s,dict) or num(s.get('gp',0) or 0)<1:continue
            value=round(score(s),2);check(math.isfinite(value) and abs(value)<1000,'SCORE_BAD');week[year,str(pid),w]=value;matched+=1
           check(matched>=50,'HISTORICAL_WEEK_COVERAGE_TOO_LOW_'+str(year)+'_'+str(w))
           trace.append({'year':year,'week':w,'source':url,'sha256':digest(blob),'matched_eligible_players':matched})
           time.sleep(.2)
         for pid,s in archive['2024'].items():
          row=base.get((2024,str(pid)))
          if row is None or row['position'] not in POS:continue
          vals=s.get('weekly_points',{});check(isinstance(vals,dict),'BAD_ARCHIVE_ROW')
          for k,v in vals.items():
           check(k.isdigit() and 1<=int(k)<=18,'BAD_ARCHIVE_WEEK')
           if int(k)<=6:week[2024,str(pid),int(k)]=num(v)
          # Crucial stored archive vs R60 season totals parity for full source.
          total=sum(num(z) for z in vals.values())
          check(abs(total-num(row['actual_LOG_points']))<=.05,'ARCHIVE_R60_POINTS_PARITY_'+pid)
         check(sum(y==2024 for y,_,w in week)>150,'ARCHIVED_2024_WEEK6_COVERAGE_TOO_LOW')
         return week,trace

        def dataset(hist,week):
         byyear=collections.defaultdict(dict)
         for r in hist:
          if int(r['season']) in range(2021,2026):byyear[int(r['season'])][r['Sleeper_id']]=r
         cases=[]
         for origin in (2021,2022,2024):
          for pid,r in byyear[origin].items():
           p=r['position'];check(p in POS,'BAD_POSITION')
           target=byyear[origin+1].get(pid);surv=(target is not None and target['position']==p)
           y=max(0,num(target['actual_LOG_surplus_points'])) if surv else 0.
           six=sum(week.get((origin,pid,w),0) for w in range(1,7))/6
           last=sum(week.get((origin,pid,w),0) for w in range(4,7))/3
           check(-50<=six<200 and -100<=last<300,'EARLY_PPG_OUT_OF_RANGE')
           cases.append({'origin':origin,'pid':pid,'name':r['name'],'position':p,'week6_ppg_calendar':round(six,6),
            'last3_ppg_calendar':round(last,6),'blend50_ppg_calendar':round((six+last)/2,6),
            'next_year_real_LOG_surplus':y,'next_season_same_pos_or_present':surv,
            'model_feature_source':'actual_Weeks1_6_same_source_LOG_pinned','only_2021_22_fit_2024_outer':True})
         check(len(cases)>=3500 and len({(x['origin'],x['pid']) for x in cases})==len(cases),'CASE_COVERAGE_FAIL')
         return cases

        def feat(row,kind):
         if kind=='ytd':return row['week6_ppg_calendar']
         if kind=='recent3':return row['last3_ppg_calendar']
         return row['blend50_ppg_calendar']
        def fit(rows,kind):
         check(len(rows)>=30,'SAMPLE_TOO_SMALL');xs=[feat(x,kind) for x in rows];ys=[x['next_year_real_LOG_surplus'] for x in rows]
         mx=statistics.mean(xs);my=statistics.mean(ys);xx=sum((x-mx)**2 for x in xs);xy=sum((x-mx)*(y-my) for x,y in zip(xs,ys))
         b=max(0,min(200,xy/(xx+max(5, len(xs)/50))));a=max(0,my-b*mx)
         return a,b
        def pred(coef,row,model):
         return max(0,coef[0]+coef[1]*feat(row,model))
        def mse(rows,coef,kind):
         check(len(rows)>0,'EMPTY_SCORE');return sum((x['next_year_real_LOG_surplus']-pred(coef,x,kind))**2 for x in rows)/len(rows)
        def mae(rows,coef,kind):return sum(abs(x['next_year_real_LOG_surplus']-pred(coef,x,kind)) for x in rows)/len(rows)
        def compare(cases):
         rows=[];predictions=[]
         for p in POS:
          tr=[x for x in cases if x['origin']==2021 and x['position']==p]
          val=[x for x in cases if x['origin']==2022 and x['position']==p]
          tst=[x for x in cases if x['origin']==2024 and x['position']==p]
          check(min(map(len,(tr,val,tst)))>=35,'POSITION_COHORT_SMALL_'+p)
          candidates=[]
          for kind in MODEL:
           v=mse(val,fit(tr,kind),kind)
           candidates.append((v,kind))
          baseline_val=dict((kind,m) for m,kind in candidates)['ytd'];improvements={kind:round(100*(baseline_val-m)/baseline_val,4) if baseline_val>0 else 0 for m,kind in candidates}
          winning=min(candidates,key=lambda t:(round(t[0],12),MODEL.index(t[1])))[1]
          # Practical model selection needs >= 1% validation improvement over prior-year YTD.
          chosen=winning if winning!='ytd' and improvements[winning]>=1 else 'ytd'
          combined=tr+val
          chosen_fit=fit(combined,chosen);ytd_fit=fit(combined,'ytd')
          e=mse(tst,chosen_fit,chosen);b=mse(tst,ytd_fit,'ytd')
          mean_next=statistics.mean(x['next_year_real_LOG_surplus'] for x in combined)
          null=sum((x['next_year_real_LOG_surplus']-mean_next)**2 for x in tst)/len(tst)
          # Full-season 2024 outcome cannot enter predictor, only 2025 label enters evaluation.
          beats_ytd=e<b-1e-8;beats_null=e<null-1e-8
          status=('CHRONOLOGICAL_HOLDOUT_WIN_NO_PRICE' if beats_ytd and beats_null and chosen!='ytd' else
                  'YTD_CONTROL_OR_NO_VERIFIED_RECENCY_UPLIFT')
          rows.append({'position':p,'train_origin_2021_n':len(tr),'validation_origin_2022_n':len(val),'outer_origin_2024_n':len(tst),
           'embargo_origin_2023':True,'inner_2022_ytd_MSE':round(baseline_val,3),'inner_2022_recent3_gain_pct':improvements['recent3'],
           'inner_2022_blend_gain_pct':improvements['blend50'],'selected_on_2022':chosen,
           '2024_outer_model_MSE':round(e,3),'2024_outer_ytd_control_MSE':round(b,3),'2024_outer_mean_control_MSE':round(null,3),
           '2024_outer_model_MAE':round(mae(tst,chosen_fit,chosen),3),'2024_outer_ytd_control_MAE':round(mae(tst,ytd_fit,'ytd'),3),
           '2024_outer_MSE_gain_vs_YTD_pct':round(100*(b-e)/b,3) if b>0 else None,
           'outer_win_vs_YTD':beats_ytd,'outer_win_vs_mean':beats_null,'selected_signal_passes_gate':chosen!='ytd' and beats_ytd and beats_null,
           'fit_intercept_points':round(chosen_fit[0],5),'fit_slope_per_ppg':round(chosen_fit[1],5),
           'H1_only_not_three_year':True,'2026_FV_or_pricing_approved':False,'decision':status})
          for x in tst:
           predictions.append({'origin':2024,'Sleeper_id':x['pid'],'name':x['name'],'position':p,
            'week6_calendar_ppg':x['week6_ppg_calendar'],'last3_calendar_ppg':x['last3_ppg_calendar'],
            'selected_signal':chosen,'actual_2025_surplus':x['next_year_real_LOG_surplus'],
            'selected_pred_surplus':round(pred(chosen_fit,x,chosen),3),'ytd_pred_surplus':round(pred(ytd_fit,x,'ytd'),3),
            'trained_using_only_prior_completed_outcomes':True,'no_market_or_FV_price_used':True})
         check(len(rows)==7 and len(predictions)>=min(1000,len(cases)//3),'NO_OUTER_RESULTS')
         return rows,predictions

        def run(a):
         hist,ledger,ref,m=load(a)
         scorer,archive,ahash=get_repo(a.repo,a.fixture)
         weeks,trace=build_features(a,hist,ledger,scorer,archive)
         cases=dataset(hist,weeks)
         summary,outer=compare(cases)
         poswins=[x['position'] for x in summary if x['selected_signal_passes_gate']]
         report=['# CAL26 V1R63 — Scoring-consistent historical Week6 future-surplus forecasting',
         '**Decision: CHRONOLOGICAL_WEEK6_EVIDENCE_ONLY__FUTURE_FV_HOLD.** All seven positions. No arbitrary point multiplier or FV reprice.','',
         'Temporal contract: training origins 2021→2022; model selection on 2022→2023; final fit 2021+2022; independent test 2024 Week 6→2025 completed season. Origin 2023 intentionally embargoed. No 2026 Week 7+, 2026 outcomes or current pricing labels are loaded.','',
         'Source: official Sleeper 2021–23 Week1–6 weekly regular-season stats with each exact byte SHA matched against R60 source ledger; pinned repository 2024 weekly LOG scores and original exact LOG scorer. Future 2025 labels are strictly reserved for final holdout scoring.','',
         'Features are fixed **six-calendar-week** averages, missing player weeks zero; these must not be transported unchanged to the 2026 QB *team-game* features. Week 6 features never include second-half season totals or next-season outcomes. 2026 source scoring bonus parity remains missing.','',
         '## Truly chronological 2024 Week 6 → 2025 season outer test','|Pos|2024 holdout n|2022-selected signal|Outer model MSE|YTD MSE|Mean MSE|MSE gain vs YTD|Recency accepted?|','|---|---:|---|---:|---:|---:|---:|---:|---|']
         for r in summary:
          report.append(f"|{r['position']}|{r['outer_origin_2024_n']}|{r['selected_on_2022']}|{r['2024_outer_model_MSE']}|{r['2024_outer_ytd_control_MSE']}|{r['2024_outer_mean_control_MSE']}|{r['2024_outer_MSE_gain_vs_YTD_pct']}%|{r['selected_signal_passes_gate']}|")
         report+=['','## Governance',
         'No 2026 LOG-exact all-position projections have been shown equivalent to historical source scoring. This workflow does **not** transport historical fitted slopes to 2026, and does not determine a 0–10,000 FV cardinal scaling. Prior-year availability and 2026 role/opportunity changes need a separately validated transfer.','',
         f"**Chronological accepted recency signals:** {', '.join(poswins) if poswins else 'None — default YTD control'}.",
         f"**Source mode:** {'SYNTHETIC LOCAL TEST, NOT EVIDENCE' if a.fixture else 'REAL PINNED DATA'}.",'']
         pay={ROOT+'_7position_Week6_chronological_holdout.csv':csv_write(summary),ROOT+'_2024_Week6_outer_player_diagnostics_NOT_FV.csv':csv_write(outer),
              ROOT+'_decision.md':'\n'.join(report)}
         if trace:pay[ROOT+'_historical_Week6_source_digest.csv']=csv_write(trace)
         a.out.mkdir(parents=True,exist_ok=True)
         for name,contents in pay.items():(a.out/name).write_text(contents)
         qa={'workflow':'CAL26 V1R63 - Chronological Week6 LOG Forecast Seven Positions (Read Only)',
           'semantic_status':'HISTORICAL_WEEK6_CHRONOLOGICAL_SEVEN_POSITIONS__NO_2026_TRANSFER__FV_HOLD',
           'fixture':a.fixture,'n_positions':7,'n_2024_outer_players':len(outer),
           'train_origin_year':2021,'validation_origin_year':2022,'embargo_origin_year':2023,'outer_origin_year':2024,'outer_outcome_year':2025,
           'source_archive_digest':ahash,'frozen_repo_blobs':BLOBS,'pinned_R60_run_id':RUN_R60,
           'pinned_R60_real_sources_verified':True,'weekly_real_source_sha_matches_R60':not a.fixture,
           'n_2021_23_week_calls':0 if a.fixture else 18,'n_2026_realized_weeks_read':0,'protected_2026_week7_plus_read':False,
           'future_2026_weeks8_12_read':False,'owner_prices_used_as_fit':False,'market_values_used_as_fit':False,
           'same_scoring_2026_projection_transfer_validated':False,'calendar_week_features_cannot_be_equated_to_2026_team_game_features':True,
           'cross_position_cardinal_FV_scale_identified':False,'production_change_authorized':False,'index_html_modified':False,
           'accepted_recency_positions':poswins,'output_sha256':{n:digest(c.encode()) for n,c in pay.items()}}
         (a.out/(ROOT+'_manifest.json')).write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n')
         print(json.dumps({'status':qa['semantic_status'],'fixture':a.fixture,'2024_outer_n':len(outer),'accepted_recency':poswins,'no_price_changes':True}))

        def selftest():
         cases=[]
         for yr in (2021,2022,2024):
          for p in POS:
           for i in range(40):
            f=i/2;c={'origin':yr,'pid':str(i),'name':'Fixture','position':p,'week6_ppg_calendar':f,
             'last3_ppg_calendar':f*1.05,'blend50_ppg_calendar':f*1.025,
             'next_year_real_LOG_surplus':(10+f*6.1),'next_season_same_pos_or_present':True}
            cases.append(c)
         rows,outer=compare(cases)
         check(len(rows)==7 and len(outer)==280,'SELFTEST_ROWS');check(all(r['selected_on_2022'] in MODEL for r in rows),'SELFTEST_SELECTION')
         fitv=fit([x for x in cases if x['origin']==2021 and x['position']=='QB'],'ytd')
         check(0<=fitv[0] and fitv[1]>0,'FIT_TEST')
         print('R63_SELFTEST_GREEN chronological 2021 2022 2024 split, seven positions, scoring math and model comparators')
        if __name__=='__main__':
         ap=argparse.ArgumentParser();ap.add_argument('--inputs',type=pathlib.Path);ap.add_argument('--repo',type=pathlib.Path);ap.add_argument('--out',type=pathlib.Path);ap.add_argument('--fixture',action='store_true');ap.add_argument('--selftest',action='store_true');args=ap.parse_args()
         if args.selftest:selftest()
         else:check(args.inputs and args.repo and args.out,'REQUIRED_PATHS');run(args)
        PY_CAL26_V1R63_ENGINE_FROZEN
        python -m py_compile "$RUNNER_TEMP/cal26_v1r63_engine.py"
        python "$RUNNER_TEMP/cal26_v1r63_engine.py" --selftest
        python "$RUNNER_TEMP/cal26_v1r63_engine.py" \
          --inputs "$RUNNER_TEMP/cal26-v1r63-inputs/R60" \
          --repo "$GITHUB_WORKSPACE" \
          --out "$RUNNER_TEMP/cal26-v1r63-results"
        python - "$RUNNER_TEMP/cal26-v1r63-results" <<'PY_CAL26_V1R63_VERIFY'
        import csv,hashlib,json,pathlib,sys
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R63_manifest.json').read_text())
        assert m['semantic_status']=='HISTORICAL_WEEK6_CHRONOLOGICAL_SEVEN_POSITIONS__NO_2026_TRANSFER__FV_HOLD'
        assert m['fixture'] is False and m['n_positions']==7 and m['n_2024_outer_players']>=1000
        assert (m['train_origin_year'],m['validation_origin_year'],m['embargo_origin_year'],m['outer_origin_year'],m['outer_outcome_year'])==(2021,2022,2023,2024,2025)
        assert m['weekly_real_source_sha_matches_R60'] and m['n_2021_23_week_calls']==18
        assert m['n_2026_realized_weeks_read']==0 and m['protected_2026_week7_plus_read'] is False
        assert not m['future_2026_weeks8_12_read'] and not m['production_change_authorized']
        assert not m['owner_prices_used_as_fit'] and not m['market_values_used_as_fit']
        assert not m['same_scoring_2026_projection_transfer_validated'] and not m['cross_position_cardinal_FV_scale_identified']
        assert m['calendar_week_features_cannot_be_equated_to_2026_team_game_features']
        for name,expected in m['output_sha256'].items():
         assert hashlib.sha256((p/name).read_bytes()).hexdigest()==expected,name
        with (p/'CAL26_V1R63_7position_Week6_chronological_holdout.csv').open() as f:rows=list(csv.DictReader(f))
        assert len(rows)==7 and {x['position'] for x in rows}=={'QB','RB','WR','TE','DL','LB','DB'}
        assert all(x['embargo_origin_2023']=='True' and x['2026_FV_or_pricing_approved']=='False' for x in rows)
        with (p/'CAL26_V1R63_2024_Week6_outer_player_diagnostics_NOT_FV.csv').open() as f:players=list(csv.DictReader(f))
        assert len(players)==m['n_2024_outer_players'] and all(r['no_market_or_FV_price_used']=='True' for r in players)
        print('R63_REAL_CHRONOLOGICAL_SEVEN_POSITION_HOLDOUT_QA_NO_FV_CHANGE')
        PY_CAL26_V1R63_VERIFY
