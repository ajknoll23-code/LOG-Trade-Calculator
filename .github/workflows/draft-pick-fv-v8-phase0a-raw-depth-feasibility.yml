name: Draft Pick FV V8 - Phase 0A Raw Depth Feasibility

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen predecessor evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prep/engine" "${RUNNER_TEMP}/prep/discoveries" "${RUNNER_TEMP}/prep/v4-current" "${RUNNER_TEMP}/prep/v42"

          gh run download 36194461700 --repo "$GITHUB_REPOSITORY" \
            -n "v7-p2-candidate-isolation-engine" \
            -D "${RUNNER_TEMP}/prep/engine"

          gh run download 36194461700 --repo "$GITHUB_REPOSITORY" \
            -n "v7-p2-candidate-isolation-discoveries" \
            -D "${RUNNER_TEMP}/prep/discoveries"

          gh run download 36194461700 --repo "$GITHUB_REPOSITORY" \
            --pattern 'v7-p2-candidate-isolation-20*' \
            -D "${RUNNER_TEMP}/prep/v4-current"

          gh run download 36202621067 --repo "$GITHUB_REPOSITORY" \
            -n "v7-p2-source-feasibility-closeout-v4-2" \
            -D "${RUNNER_TEMP}/prep/v42"

          test "$(sha256sum "${RUNNER_TEMP}/prep/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
          test "$(sha256sum "${RUNNER_TEMP}/prep/engine/identity_crosswalk.json" | awk '{print $1}')" = "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

      - name: Freeze V8 Phase 0A contract and transport ledger
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/prep/v8_phase0a_raw_depth_contract.json" <<'JSON'
          {
            "candidate_universe": {
              "candidate_membership_changed": false,
              "candidate_order_changed": false,
              "new_league_search_allowed": false,
              "r25_batch_total_n": 251,
              "source_provider": "MyFantasyLeague",
              "total_n": 6203,
              "years": [
                2018,
                2019,
                2020,
                2021,
                2022,
                2023
              ]
            },
            "diagnostic_gate": {
              "fail_decision": "STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES",
              "meaning": "Impossibility screen only. Raw depth count below 12 makes a >=12 qualified cohort impossible; raw count >=12 does not itself qualify a source cohort.",
              "minimum_raw_depth_leagues_per_year_cell": 12,
              "pass_decision": "PROCEED_TO_V8_PHASE0B_QUALIFIED_DEPTH_FEASIBILITY"
            },
            "firewalls": {
              "candidate_fit_performed": false,
              "candidate_scores_computed": false,
              "candidate_selection_performed": false,
              "historical_player_outcomes_read": false,
              "holdout_2024_outcomes_read": false,
              "market_or_ktc_values_read": false,
              "package_vote_data_read": false,
              "production_change_authorized": false
            },
            "next_if_pass": "Run a separately frozen Phase 0B that applies league qualification, contamination, occurrence retention, identity, and Sleeper-readiness to the raw depth-supported cohorts.",
            "phase0a_scope": {
              "cell_endpoints": {
                "12": "r1_late",
                "16": "r2_early",
                "20": "r2_mid",
                "24": "r2_late",
                "28": "r3_early",
                "32": "r3_mid",
                "36": "r3_late",
                "4": "r1_early",
                "40": "r4_early",
                "44": "r4_mid",
                "48": "r4_late",
                "52": "r5_early",
                "56": "r5_mid",
                "60": "r5_late",
                "64": "r6_early",
                "68": "r6_mid",
                "72": "r6_late",
                "8": "r1_mid"
              },
              "contamination_classification_performed": false,
              "depth_rule": "A cell is raw-depth-supported only if every overall slot from 1 through that cell endpoint exists exactly once in the selected draft unit.",
              "identity_resolution_performed": false,
              "league_metadata_read": false,
              "league_scoped_player_metadata_read": false,
              "mfl_endpoint_allowed": "draftResults only",
              "raw_selected_draft_unit_only": true,
              "selected_draft_unit_rule": "same V7 deterministic choose_unit rule"
            },
            "predecessor": {
              "study_id": "draft-pick-fv-v7-r1-r6-full-scale-tail-continuity",
              "v7_closeout_decision": "STOP_V7_R1_R6_SOURCE_FEASIBILITY_INSUFFICIENT",
              "v7_closeout_run_id": 36202621067,
              "v7_outcomes_opened": false
            },
            "question": "Does the already-frozen 2018-2023 MFL candidate universe contain enough raw draft depth to make depth-specific R1-R6 source cohorts potentially feasible before league qualification or identity filtering?",
            "schema_version": 1,
            "stage": "phase0a_raw_depth_feasibility_preregistration",
            "status": "FROZEN_PRE_V8_SOURCE_REPROBE_PRE_OUTCOME",
            "study_id": "draft-pick-fv-v8-depth-specific-source-cohorts",
            "transport": {
              "candidate_level_transport_isolation": true,
              "reuse_v4_exhausted_transport_allowed_only_when_failure_stage_is_draftResults": true,
              "same_request_residual_router_preserved": true,
              "source_substitution_allowed": false
            }
          }
          JSON

          cat > "${RUNNER_TEMP}/prep/raw_depth_probe_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          import requests

          BATCH_SIZE = 25
          CELL_ENDPOINTS = {
              4:"r1_early", 8:"r1_mid", 12:"r1_late",
              16:"r2_early", 20:"r2_mid", 24:"r2_late",
              28:"r3_early", 32:"r3_mid", 36:"r3_late",
              40:"r4_early", 44:"r4_mid", 48:"r4_late",
              52:"r5_early", 56:"r5_mid", 60:"r5_late",
              64:"r6_early", 68:"r6_mid", 72:"r6_late",
          }

          def sha_text(values):
              return hashlib.sha256("\n".join(values).encode()).hexdigest()

          def load_engine(path: Path):
              spec = importlib.util.spec_from_file_location("v7_v4_engine", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot load frozen V4 engine")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def raw_depth_profile(E, unit):
              if unit is None:
                  return {
                      "max_complete_prefix_slot": 0,
                      "complete_cell_endpoints": [],
                      "source_missing_slots_1_72": list(range(1,73)),
                      "duplicate_slots_1_72": [],
                      "prefix_slots": [],
                      "raw_pick_rows_1_72_n": 0,
                  }

              raw = [x for x in E.V.as_list(unit.get("draftPick")) if isinstance(x, dict)]
              by_slot = {}
              row_n = 0
              for i, p in enumerate(raw):
                  r = E.V.safe_int(p.get("round"))
                  w = E.V.safe_int(p.get("pick"))
                  if r is None or w is None or r < 1 or r > 6 or w < 1 or w > 12:
                      continue
                  s = (r - 1) * 12 + w
                  row_n += 1
                  by_slot.setdefault(s, []).append({
                      "overall_slot": s,
                      "round": r,
                      "within_round_pick": w,
                      "mfl_player_id": E.V.stable_id(p.get("player")),
                      "franchise_id": E.V.stable_id(p.get("franchise") or p.get("franchise_id") or p.get("franchiseId")),
                      "raw_row_index": i,
                  })

              missing = [s for s in range(1,73) if s not in by_slot]
              duplicate = [
                  {"overall_slot": s, "row_count": len(by_slot[s])}
                  for s in sorted(by_slot)
                  if len(by_slot[s]) != 1
              ]

              prefix = 0
              for s in range(1,73):
                  if len(by_slot.get(s, [])) != 1:
                      break
                  prefix = s

              prefix_slots = [by_slot[s][0] for s in range(1, prefix + 1)]
              complete_endpoints = [e for e in sorted(CELL_ENDPOINTS) if e <= prefix]
              return {
                  "max_complete_prefix_slot": prefix,
                  "complete_cell_endpoints": complete_endpoints,
                  "source_missing_slots_1_72": missing,
                  "duplicate_slots_1_72": duplicate,
                  "prefix_slots": prefix_slots,
                  "raw_pick_rows_1_72_n": row_n,
              }

          def self_test():
              class V:
                  @staticmethod
                  def as_list(x):
                      if x is None: return []
                      return x if isinstance(x, list) else [x]
                  @staticmethod
                  def safe_int(x):
                      try: return int(x)
                      except Exception: return None
                  @staticmethod
                  def stable_id(x):
                      if x is None: return None
                      s = str(x).strip()
                      return s or None
              class E: pass
              E.V = V

              full_r1 = {"draftPick":[{"round":1,"pick":i,"player":str(100+i)} for i in range(1,13)]}
              a = raw_depth_profile(E, full_r1)
              assert a["max_complete_prefix_slot"] == 12
              assert a["complete_cell_endpoints"] == [4,8,12]

              dup = {"draftPick":[
                  *[{"round":1,"pick":i,"player":str(100+i)} for i in range(1,13)],
                  {"round":1,"pick":5,"player":"999"},
              ]}
              b = raw_depth_profile(E, dup)
              assert b["max_complete_prefix_slot"] == 4

              gap = {"draftPick":[
                  *[{"round":1,"pick":i,"player":str(100+i)} for i in range(1,13) if i != 9],
                  *[{"round":2,"pick":i,"player":str(200+i)} for i in range(1,13)],
              ]}
              c = raw_depth_profile(E, gap)
              assert c["max_complete_prefix_slot"] == 8
              assert c["complete_cell_endpoints"] == [4,8]
              print("PASS: raw depth profiler self-test")

          def run(args):
              prep = Path(args.prep)
              E = load_engine(prep / "engine" / "build_r1_r6_source_identity_v7.py")

              disc = json.loads((prep / "discoveries" / f"discovery_{args.year}.json").read_text())
              ids = [str(x) for x in disc["candidate_ids"]]
              assert sha_text(ids) == disc["candidate_ids_sha256"]

              known_rows = json.loads((prep / "known_transport_unresolved_v4.json").read_text())
              known = {
                  (int(x["draft_year"]), int(x["batch_index"]), str(x["league_id"])): x
                  for x in known_rows
              }

              batch_count = (len(ids) + BATCH_SIZE - 1) // BATCH_SIZE
              if args.batch_start < 0 or args.batch_end >= batch_count or args.batch_start > args.batch_end:
                  raise RuntimeError(f"invalid batch range {args.batch_start}..{args.batch_end} / {batch_count}")

              out_dir = Path(args.out_dir)
              out_dir.mkdir(parents=True, exist_ok=True)

              for b in range(args.batch_start, args.batch_end + 1):
                  lo = b * BATCH_SIZE
                  hi = min(len(ids), lo + BATCH_SIZE)
                  batch_ids = ids[lo:hi]
                  ses = requests.Session()
                  ses.headers["User-Agent"] = f"LOG-Draft-Pick-FV-V8-P0A-{args.year}-B{b:03d}/1.0"

                  rows = []
                  transport = []
                  for j, lid in enumerate(batch_ids, start=1):
                      prior = known.get((args.year, b, lid))
                      if prior is not None and prior.get("stage") == "draftResults":
                          u = {
                              "draft_year": args.year,
                              "batch_index": b,
                              "candidate_position_in_batch": j,
                              "league_id": lid,
                              "status": "transport_unresolved",
                              "stage": "draftResults",
                              "failure_class": prior.get("failure_class"),
                              "evidence_source": "v4_exhausted_transport_reused",
                          }
                          rows.append(u)
                          transport.append(u)
                          continue

                      try:
                          units = E.V.extract_units(E.V.get_json(ses, E.V.api_url(args.year, "draftResults", L=lid)))
                          chosen, reason, unit_summary = E.V.choose_unit(units)
                          if chosen is None:
                              rows.append({
                                  "draft_year": args.year,
                                  "batch_index": b,
                                  "candidate_position_in_batch": j,
                                  "league_id": lid,
                                  "status": "draft_unit_reject",
                                  "reason": str(reason),
                                  "unit_summary": unit_summary,
                                  "max_complete_prefix_slot": 0,
                                  "complete_cell_endpoints": [],
                              })
                              continue

                          prof = raw_depth_profile(E, chosen)
                          rows.append({
                              "draft_year": args.year,
                              "batch_index": b,
                              "candidate_position_in_batch": j,
                              "league_id": lid,
                              "status": "depth_observed",
                              "unit_selection_reason": str(reason),
                              "unit_summary": unit_summary,
                              **prof,
                          })
                      except E.GateError as exc:
                          if not E._v4_transport_exhaustion(exc):
                              raise
                          u = {
                              "draft_year": args.year,
                              "batch_index": b,
                              "candidate_position_in_batch": j,
                              "league_id": lid,
                              "status": "transport_unresolved",
                              "stage": "draftResults",
                              "failure_class": E._v4_transport_class(str(exc)),
                              "evidence_source": "v8_phase0a_exhausted_transport",
                              "error_fingerprint_sha256": hashlib.sha256(str(exc).encode()).hexdigest(),
                          }
                          rows.append(u)
                          transport.append(u)

                  if [x["league_id"] for x in rows] != batch_ids:
                      raise RuntimeError("candidate order/coverage mismatch")
                  if len(rows) != len(batch_ids) or len({x["league_id"] for x in rows}) != len(batch_ids):
                      raise RuntimeError("candidate exact-once violation")

                  payload = {
                      "schema_version": 1,
                      "study_id": "draft-pick-fv-v8-depth-specific-source-cohorts",
                      "stage": "phase0a_raw_depth_probe_batch",
                      "draft_year": args.year,
                      "batch_index": b,
                      "batch_count": batch_count,
                      "batch_size": BATCH_SIZE,
                      "candidate_start_index": lo,
                      "candidate_end_index_exclusive": hi,
                      "candidate_ids": batch_ids,
                      "candidate_ids_sha256": sha_text(batch_ids),
                      "candidate_results": rows,
                      "transport_unresolved_n": len(transport),
                      "historical_player_outcomes_read": False,
                      "holdout_2024_outcomes_read": False,
                      "league_metadata_read": False,
                      "league_scoped_player_metadata_read": False,
                      "identity_resolution_performed": False,
                      "candidate_fit_performed": False,
                      "production_change_authorized": False,
                  }
                  (out_dir / f"batch_{b:03d}.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
                  print(
                      f"{args.year} batch {b+1}/{batch_count}: candidates={len(batch_ids)} "
                      f"depth_observed={sum(x['status']=='depth_observed' for x in rows)} "
                      f"transport={len(transport)}",
                      flush=True,
                  )

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--self-test", action="store_true")
              ap.add_argument("--year", type=int)
              ap.add_argument("--batch-start", type=int)
              ap.add_argument("--batch-end", type=int)
              ap.add_argument("--prep")
              ap.add_argument("--out-dir")
              args = ap.parse_args()
              if args.self_test:
                  self_test()
                  return
              required = (args.year, args.batch_start, args.batch_end, args.prep, args.out_dir)
              if any(x is None for x in required):
                  ap.error("probe mode requires year, batch range, prep, and out-dir")
              run(args)

          if __name__ == "__main__":
              main()
          PY

          test "$(sha256sum "${RUNNER_TEMP}/prep/v8_phase0a_raw_depth_contract.json" | awk '{print $1}')" = "9ee954f6fc5088dc1fc7727d5b3a16b8756bb645b02b369328b244f5576367c8"
          test "$(sha256sum "${RUNNER_TEMP}/prep/raw_depth_probe_v8.py" | awk '{print $1}')" = "fafe83300ecff19557d1ca43de5337b6b8edd222e8eda121c86a46c50b750d8a"

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"prep"

          close=json.loads((root/"v42"/"phase2_source_feasibility_closeout_v4_2.json").read_text())
          assert close["decision"]=="STOP_V7_R1_R6_SOURCE_FEASIBILITY_INSUFFICIENT"
          assert close["outcome_ingestion_authorized"] is False
          assert close["firewalls"]["historical_player_outcomes_read"] is False
          assert close["firewalls"]["holdout_2024_outcomes_read"] is False

          total=0
          for y in range(2018,2024):
              d=json.loads((root/"discoveries"/f"discovery_{y}.json").read_text())
              ids=[str(x) for x in d["candidate_ids"]]
              assert hashlib.sha256("\n".join(ids).encode()).hexdigest()==d["candidate_ids_sha256"]
              total+=len(ids)
          assert total==6203,total

          unresolved=[]
          for p in (root/"v4-current").rglob("batch_*.json"):
              d=json.loads(p.read_text())
              unresolved.extend(d.get("transport_unresolved",[]))

          keys=[(int(x["draft_year"]),int(x["batch_index"]),str(x["league_id"])) for x in unresolved]
          assert len(keys)==len(set(keys))
          assert len(unresolved)==23,len(unresolved)
          unresolved=sorted(unresolved,key=lambda x:(int(x["draft_year"]),int(x["batch_index"]),int(x["candidate_position_in_batch"])))
          (root/"known_transport_unresolved_v4.json").write_text(json.dumps(unresolved,indent=2,sort_keys=True)+"\n")
          print(f"PASS: frozen candidate universe={total}; V4 known transport ledger={len(unresolved)}")
          PY

          python3 "${RUNNER_TEMP}/prep/raw_depth_probe_v8.py" --self-test

      - name: Upload frozen Phase 0A prep
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0a-raw-depth-prep
          path: ${{ runner.temp }}/prep/
          if-no-files-found: error
          retention-days: 30

  raw_depth:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - year: 2018
            start: 0
            end: 9
            slot: 0
          - year: 2018
            start: 10
            end: 19
            slot: 1
          - year: 2018
            start: 20
            end: 29
            slot: 2
          - year: 2018
            start: 30
            end: 39
            slot: 0
          - year: 2018
            start: 40
            end: 42
            slot: 1
          - year: 2019
            start: 0
            end: 9
            slot: 2
          - year: 2019
            start: 10
            end: 19
            slot: 0
          - year: 2019
            start: 20
            end: 29
            slot: 1
          - year: 2019
            start: 30
            end: 39
            slot: 2
          - year: 2019
            start: 40
            end: 40
            slot: 0
          - year: 2020
            start: 0
            end: 9
            slot: 1
          - year: 2020
            start: 10
            end: 19
            slot: 2
          - year: 2020
            start: 20
            end: 29
            slot: 0
          - year: 2020
            start: 30
            end: 39
            slot: 1
          - year: 2020
            start: 40
            end: 40
            slot: 2
          - year: 2021
            start: 0
            end: 9
            slot: 0
          - year: 2021
            start: 10
            end: 19
            slot: 1
          - year: 2021
            start: 20
            end: 29
            slot: 2
          - year: 2021
            start: 30
            end: 39
            slot: 0
          - year: 2021
            start: 40
            end: 41
            slot: 1
          - year: 2022
            start: 0
            end: 9
            slot: 2
          - year: 2022
            start: 10
            end: 19
            slot: 0
          - year: 2022
            start: 20
            end: 29
            slot: 1
          - year: 2022
            start: 30
            end: 39
            slot: 2
          - year: 2022
            start: 40
            end: 41
            slot: 0
          - year: 2023
            start: 0
            end: 9
            slot: 1
          - year: 2023
            start: 10
            end: 19
            slot: 2
          - year: 2023
            start: 20
            end: 29
            slot: 0
          - year: 2023
            start: 30
            end: 39
            slot: 1
          - year: 2023
            start: 40
            end: 41
            slot: 2
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      YEAR: ${{ matrix.year }}
      BATCH_START: ${{ matrix.start }}
      BATCH_END: ${{ matrix.end }}
      SLOT: ${{ matrix.slot }}
      MFL_TRANSPORT_DIAGNOSTIC_PATH: ${{ runner.temp }}/diag/transport.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0a-raw-depth-prep
          path: ${{ runner.temp }}/prep

      - name: Probe raw draft depth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/diag"
          sleep "$(( SLOT * 10 ))"
          python3 "${RUNNER_TEMP}/prep/raw_depth_probe_v8.py" \
            --year "$YEAR" \
            --batch-start "$BATCH_START" \
            --batch-end "$BATCH_END" \
            --prep "${RUNNER_TEMP}/prep" \
            --out-dir "${RUNNER_TEMP}/out"

      - name: Upload raw depth checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0a-raw-depth-${{ matrix.year }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0a-raw-depth-diag-${{ matrix.year }}-${{ matrix.start }}-${{ matrix.end }}
          path: ${{ runner.temp }}/diag/transport.jsonl
          if-no-files-found: ignore
          retention-days: 30

  assemble:
    needs: [prepare, raw_depth]
    if: always() && needs.prepare.result == 'success' && needs.raw_depth.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Download frozen prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0a-raw-depth-prep
          path: ${{ runner.temp }}/prep

      - name: Download all raw depth checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p0a-raw-depth-20*
          path: ${{ runner.temp }}/raw

      - name: Assemble exact candidate depth screen
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          prep=root/"prep"
          raw=root/"raw"
          out=root/"assembled"
          out.mkdir(exist_ok=True)

          contract=json.loads((prep/"v8_phase0a_raw_depth_contract.json").read_text())
          endpoints={int(k):v for k,v in contract["phase0a_scope"]["cell_endpoints"].items()}
          minimum=int(contract["diagnostic_gate"]["minimum_raw_depth_leagues_per_year_cell"])
          expected_batches={2018:43,2019:41,2020:41,2021:42,2022:42,2023:42}

          years=[]
          grand_n=0
          all_possible=True

          for y,n_batches in expected_batches.items():
              disc=json.loads((prep/"discoveries"/f"discovery_{y}.json").read_text())
              ids=[str(x) for x in disc["candidate_ids"]]
              seen={}

              for p in raw.rglob("batch_*.json"):
                  d=json.loads(p.read_text())
                  if int(d["draft_year"])!=y:
                      continue
                  b=int(d["batch_index"])
                  if b in seen:
                      raise AssertionError((y,b,"duplicate batch artifact"))
                  exp=ids[b*25:min(len(ids),(b+1)*25)]
                  assert d["candidate_ids"]==exp
                  assert d["candidate_ids_sha256"]==hashlib.sha256("\n".join(exp).encode()).hexdigest()
                  assert d["historical_player_outcomes_read"] is False
                  assert d["holdout_2024_outcomes_read"] is False
                  assert d["league_metadata_read"] is False
                  assert d["league_scoped_player_metadata_read"] is False
                  assert d["identity_resolution_performed"] is False
                  seen[b]=d

              assert set(seen)==set(range(n_batches)),(y,sorted(set(range(n_batches))-set(seen)))

              flattened=[]
              results=[]
              for b in range(n_batches):
                  d=seen[b]
                  flattened.extend(d["candidate_ids"])
                  results.extend(d["candidate_results"])

              assert flattened==ids
              assert [x["league_id"] for x in results]==ids
              assert len(results)==len(ids)==len({x["league_id"] for x in results})

              depth_counts={}
              for endpoint,cell in sorted(endpoints.items()):
                  c=sum(
                      1 for x in results
                      if x["status"]=="depth_observed" and int(x["max_complete_prefix_slot"])>=endpoint
                  )
                  depth_counts[cell]={
                      "cell_endpoint_slot":endpoint,
                      "raw_depth_supported_league_n":c,
                      "minimum_diagnostic_n":minimum,
                      "raw_impossibility_gate_pass":c>=minimum,
                  }
                  if c<minimum:
                      all_possible=False

              status=Counter(x["status"] for x in results)
              prefix_dist=Counter(
                  int(x.get("max_complete_prefix_slot",0))
                  for x in results
                  if x["status"]=="depth_observed"
              )
              years.append({
                  "draft_year":y,
                  "candidate_n":len(ids),
                  "status_counts":dict(sorted(status.items())),
                  "max_complete_prefix_distribution":{str(k):v for k,v in sorted(prefix_dist.items())},
                  "cell_raw_depth_feasibility":depth_counts,
              })
              grand_n+=len(ids)
              print(
                  f"PASS: {y} candidates={len(ids)} "
                  f"R1late={depth_counts['r1_late']['raw_depth_supported_league_n']} "
                  f"R3late={depth_counts['r3_late']['raw_depth_supported_league_n']} "
                  f"R6late={depth_counts['r6_late']['raw_depth_supported_league_n']}"
              )

          assert grand_n==6203
          decision=(
              contract["diagnostic_gate"]["pass_decision"]
              if all_possible
              else contract["diagnostic_gate"]["fail_decision"]
          )
          summary={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0a_raw_depth_feasibility_closeout",
              "decision":decision,
              "candidate_universe_total_n":6203,
              "exact_candidate_coverage":True,
              "raw_depth_impossibility_screen_pass":all_possible,
              "minimum_raw_depth_leagues_per_year_cell":minimum,
              "years":years,
              "firewalls":contract["firewalls"],
          }
          (out/"v8_phase0a_raw_depth_feasibility.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")

          md=[
              "# Draft Pick FV V8 — Phase 0A Raw Depth Feasibility",
              "",
              f"**Decision:** `{decision}`",
              "",
              "This is an impossibility screen only; no league qualification, identity, contamination, or NFL outcomes are used.",
              "",
              "| Year | R1 late | R2 late | R3 late | R4 late | R5 late | R6 late |",
              "|---:|---:|---:|---:|---:|---:|---:|",
          ]
          by={x["draft_year"]:x for x in years}
          for y in range(2018,2024):
              d=by[y]["cell_raw_depth_feasibility"]
              md.append(
                  f"| {y} | {d['r1_late']['raw_depth_supported_league_n']} | "
                  f"{d['r2_late']['raw_depth_supported_league_n']} | "
                  f"{d['r3_late']['raw_depth_supported_league_n']} | "
                  f"{d['r4_late']['raw_depth_supported_league_n']} | "
                  f"{d['r5_late']['raw_depth_supported_league_n']} | "
                  f"{d['r6_late']['raw_depth_supported_league_n']} |"
              )
          md += [
              "",
              f"Minimum diagnostic raw depth count per year-cell: **{minimum}**.",
              "",
              "If this passes, Phase 0B will apply the actual dynasty/SF/rookie qualification, contamination, retention, identity, and Sleeper-readiness gates while outcomes remain sealed.",
          ]
          (out/"v8_phase0a_raw_depth_feasibility.md").write_text("\n".join(md)+"\n")
          print("\n".join(md))
          PY

      - name: Upload Phase 0A closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0a-raw-depth-feasibility-closeout
          path: ${{ runner.temp }}/assembled/
          if-no-files-found: error
          retention-days: 30
