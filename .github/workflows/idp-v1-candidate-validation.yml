name: Validate IDP V1 Candidate Lineage

# Read-only validation of the canonical history extraction and the V1
# candidate strategies. This workflow never bakes index.html and never pushes.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/production_history_component.py"
      - "scripts/production_history_components.json"
      - "scripts/idp_v1_projection.py"
      - "scripts/idp_v1_*candidate.py"
      - "scripts/idp_v1_*candidate.json"
      - "scripts/validate_idp_v1_candidates.py"
      - "scripts/validate_idp_v1_final_deployment.py"
      - "scripts/prod_mult_pre_v1_baseline.json"
      - "scripts/ppg_results.json"
      - "scripts/durability_results.json"
      - "scripts/fantasypros_api_normalized_2026.json"
      - "scripts/sleeper_2026_idp_only.json"
      - "scripts/identity_crosswalk.json"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: idp-v1-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Canonical history self-test and regeneration
        run: |
          python3 scripts/production_history_component.py --selftest
          python3 scripts/production_history_component.py

      - name: V1 projection and candidate self-tests
        run: |
          python3 scripts/idp_v1_projection.py
          python3 scripts/idp_v1_production_candidate.py --selftest
          python3 scripts/idp_v1_isolated_projection_candidate.py --selftest
          python3 scripts/idp_v1_projection_only_candidate.py --selftest
          python3 scripts/idp_v1_model_delta_transport_candidate.py --selftest

      - name: Regenerate all candidate diagnostics
        run: |
          python3 scripts/idp_v1_production_candidate.py
          python3 scripts/idp_v1_isolated_projection_candidate.py
          python3 scripts/idp_v1_projection_only_candidate.py
          python3 scripts/idp_v1_model_delta_transport_candidate.py
          python3 scripts/validate_idp_v1_candidates.py
          python3 scripts/validate_idp_v1_final_deployment.py

      - name: Repository regression checks
        run: python3 scripts/repo_regression_checks.py

      - name: Verify committed generated diagnostics are current
        run: |
          git diff --exit-code -- \
            scripts/production_history_components.json \
            scripts/idp_v1_production_candidate.json \
            scripts/idp_v1_production_candidate_report.md \
            scripts/idp_v1_isolated_projection_candidate.json \
            scripts/idp_v1_isolated_projection_candidate_report.md \
            scripts/idp_v1_projection_only_candidate.json \
            scripts/idp_v1_projection_only_candidate_report.md \
            scripts/idp_v1_model_delta_transport_candidate.json \
            scripts/idp_v1_model_delta_transport_candidate_report.md \
            scripts/idp_v1_candidate_comparison.json \
            scripts/idp_v1_candidate_comparison_report.md \
            scripts/idp_v1_final_deployment_validation.json \
            scripts/idp_v1_final_deployment_validation.md \
            scripts/idp_v1_prod_mult_patch.json \
            scripts/idp_v1_prod_mult_patch_report.md \
            scripts/idp_v1_index_preview.patch
