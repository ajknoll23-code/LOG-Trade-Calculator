# QF10 V8 — exact-current FV uncertainty artifact review, no market refresh, no main production write.
# PASS creates review-only branch after all checks; branch promotion NOT included.
name: QF10 V8 - A6 Uncertainty-Only Review Candidate and 14-Group Guard
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  candidate:
    name: Regenerate only uncertainty evidence, validate and commit to NEW review branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout current main; repository writes limited to guarded review branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin approved source and two existing artifacts
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP non-main dispatch''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP checkout changed''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP dirty checkout''; exit 1; }

        git merge-base --is-ancestor d8a2be0bf1edb8d19e94e2edc5157062f95096f3 HEAD || { echo ''STOP QF9 ancestor missing''; exit 1;
        }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP unexpected protected drift $1"; exit 1; }; }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2

        pin scripts/artifacts/reports/value_uncertainty_report.md 8f0bd8c1059d23911de690a3a8f2c18c17d89194

        pin scripts/validation/build_value_uncertainty.py c70db15470704182c8790ebd24cc25c8fca6bd61

        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo ''PASS QF10 V8 frozen market/index and approved uncertainty builder pins''

        '
    - name: Canonical uncertainty builder and independent self-tests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/build_value_uncertainty.py --selftest

        python3 scripts/validation/snapshot_values.py --selftest

        '
    - name: Build uncertainty candidate using canonical engine; verify 565 centers and RB display coverage
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf10-v8.py <<'QF10_V8_PY'\nfrom __future__ import annotations\nimport json, math, sys\nfrom\
        \ collections import Counter\nfrom pathlib import Path\nroot=Path.cwd()\nassert (root/'index.html').is_file(), 'STOP wrong repo\
        \ root'\nfor p in ('scripts/validation','scripts/market'):\n    sys.path.insert(0,str(root/p))\nsys.path.insert(0,str(root))\n\
        from scripts.validation import snapshot_values\nfrom scripts.validation import build_value_uncertainty as builder\ncurrent=snapshot_values.compute_all_values(snapshot_values.load_from_html(root/'index.html'))\n\
        old=json.loads((root/'scripts/artifacts/generated/value_uncertainty.json').read_text())\nmarket=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())\n\
        assert len(current)==565, 'STOP canonical model population changed; inspect scope'\nassert old['range_semantics']=='sensitivity_envelope_v1_not_probability_interval'\n\
        assert market['scale_semantics']=='league_rank_quantile_mapped_to_trade_desk_points_v1'\n\n# Canonical, existing source engine,\
        \ no new FV formulas or uncertainty science.\nnew=builder.build_payload()\nassert new['method_version']==old['method_version'],\
        \ 'STOP uncertainty engine version drift'\nassert new['policy_sha256']==old['policy_sha256'], 'STOP uncertainty policy changed'\n\
        assert new['range_semantics']==old['range_semantics'], 'STOP changed range semantics'\nassert len(new['players'])==len(old['players'])==len(current)==565\n\
        assert set(new['players'])==set(current), 'STOP player universe changed'\n\ndef coverage(u):\n    data={'rb_total':0,'uncertainty_valid':0,'rb_uncertainty_valid':0,'rb_market_valid':0,'rb_both':0,'rb_uncertainty_only':0,'rb_neither':0}\n\
        \    for key, p in current.items():\n        fv=int(p['value']); pos=p['pos']; r=u['players'].get(key)\n        ok=bool(r and\
        \ r.get('center_value')==fv and r['range_low']<=fv<=r['range_high'] and r['relative_half_width']>=0)\n        if ok: data['uncertainty_valid']+=1\n\
        \        if pos!='RB':continue\n        data['rb_total']+=1\n        m=market['players'].get(key)\n        mok=bool(m and m.get('fundamental_value')==fv\
        \ and isinstance(m.get('market_value'),(float,int)) and m['market_value']>=0)\n        if ok:data['rb_uncertainty_valid']+=1\n\
        \        if mok:data['rb_market_valid']+=1\n        if mok and ok:data['rb_both']+=1\n        if ok and not mok:data['rb_uncertainty_only']+=1\n\
        \        if not ok and not mok:data['rb_neither']+=1\n    return data\n\nfor key,row in new['players'].items():\n    fv=int(current[key]['value'])\n\
        \    assert row['center_value']==fv, f'STOP FV center mismatch {key}'\n    assert row['range_semantics']==new['range_semantics'],\
        \ f'STOP row semantics changed {key}'\n    assert row['range_low']<=fv<=row['range_high'], f'STOP invalid envelope {key}'\n\
        \    assert math.isfinite(float(row['relative_half_width'])) and row['relative_half_width']>=0, f'STOP invalid width {key}'\n\
        \nbefore=coverage(old); after=coverage(new)\nassert after['uncertainty_valid']==565, 'STOP current FV center coverage incomplete'\n\
        assert before['rb_total']==after['rb_total']==97, 'STOP RB population drift'\nassert before['rb_market_valid']==after['rb_market_valid'],\
        \ 'STOP frozen market changed'\nassert after['rb_neither']==0, 'STOP RB uncovered after uncertainty refresh'\nassert after['rb_both']>=before['rb_both'],\
        \ 'STOP market+uncertainty display regressed'\nold_entries=old['players']; new_entries=new['players']\nmodified=sum(old_entries[k]!=new_entries[k]\
        \ for k in current)\ntier_changes=sum(old_entries[k].get('uncertainty_tier')!=new_entries[k].get('uncertainty_tier') for k in\
        \ current)\nwidth_changes=[round(float(new_entries[k]['relative_half_width'])-float(old_entries[k]['relative_half_width']),8)\
        \ for k in current]\nwidth_max=max(abs(d) for d in width_changes)\nprint('QF10_V8_UNCERTAINTY_PREVIEW '+json.dumps({\n 'previous':before,'candidate':after,'row_level_changes':modified,\n\
        \ 'uncertainty_tier_changes':tier_changes,'max_abs_relative_half_width_change':width_max,\n 'display_both_restored':after['rb_both']-before['rb_both'],\n\
        \ 'uncertainty_only_restored':after['rb_uncertainty_only']-before['rb_uncertainty_only'],\n 'new_ranges_not_probability_confidence_intervals':True,\n\
        \ 'saved_market_unchanged':True,'candidate_status':'REVIEW_ONLY_NOT_PRODUCTION'},sort_keys=True))\nassert modified>0, 'STOP\
        \ candidate no meaningful data changes; do not create redundant branch'\nbuilder.write_outputs(new)  # Canonical builder; ONLY\
        \ uncertainty JSON and report Markdown.\nassert json.loads((root/'scripts/artifacts/generated/value_uncertainty.json').read_text())==new\n\
        assert (root/'scripts/artifacts/reports/value_uncertainty_report.md').is_file()\nprint('QF10_V8_EXACT_CANONICAL_REVIEW_CANDIDATE_GREEN')\n\
        QF10_V8_PY\npython3 -m py_compile /tmp/qf10-v8.py\npython3 /tmp/qf10-v8.py\n"
    - name: Run all 14 production regression groups and frozen parity
      shell: bash
      run: 'set -euo pipefail

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''PASS QF10 V8 fourteen regression groups, frozen IDP, market, package, FA and TU gates''

        '
    - name: Verify exact two-file scope; no production changes
      shell: bash
      run: 'set -euo pipefail

        expected=$(printf ''scripts/artifacts/generated/value_uncertainty.json\nscripts/artifacts/reports/value_uncertainty_report.md'')

        actual=$(git diff --name-only | LC_ALL=C sort)

        [[ "$actual" == "$expected" ]] || { echo "STOP file allowlist drift: $actual"; exit 1; }

        [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo ''STOP unexpected untracked files''; exit 1; }

        [[ "$(git hash-object index.html)" == ''c83e3f68d11853c072017e6bd83bb1ad085f4a3e'' ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == ''829445174a77ceb4bb19dfd97a725e371d18efe8'' ]] ||
        exit 1

        git diff --check

        echo ''QF10_V8_REVIEW_PREFLIGHT_GREEN: exactly two derived uncertainty artifacts; unchanged FV, market and source policies''

        '
    - name: Create isolated review branch; never push main
      shell: bash
      run: "set -euo pipefail\nbranch='qf10-a6-uncertainty-v8-review-2026-10-11'\n[[ \"$(git rev-parse HEAD)\" == \"$GITHUB_SHA\" ]]\
        \ || { echo 'STOP checkout moved'; exit 1; }\ngit fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'\n[[ \"\
        $(git rev-parse origin/main)\" == \"$GITHUB_SHA\" ]] || { echo 'STOP concurrent main advance; rerun preflight'; exit 1; }\n\
        [[ -z \"$(git ls-remote --heads origin \"refs/heads/$branch\")\" ]] || { echo 'STOP review branch already exists, do not overwrite';\
        \ exit 1; }\nexpected=$(printf 'scripts/artifacts/generated/value_uncertainty.json\\nscripts/artifacts/reports/value_uncertainty_report.md')\n\
        [[ \"$(git diff --name-only | LC_ALL=C sort)\" == \"$expected\" ]] || { echo 'STOP changed file set'; exit 1; }\ngit switch\
        \ -c \"$branch\"\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add -- scripts/artifacts/generated/value_uncertainty.json scripts/artifacts/reports/value_uncertainty_report.md\n[[ \"$(git\
        \ diff --cached --name-only | LC_ALL=C sort)\" == \"$expected\" ]] || exit 1\ngit diff --cached --check\ngit commit -m 'QF10\
        \ A6: refreshed uncertainty display evidence \u2014 review only'\n[[ \"$(git rev-parse HEAD:index.html)\" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e'\
        \ ]] || exit 1\n[[ \"$(git rev-parse HEAD:scripts/artifacts/generated/market_values.json)\" == '829445174a77ceb4bb19dfd97a725e371d18efe8'\
        \ ]] || exit 1\ngit push origin \"HEAD:refs/heads/$branch\"\necho \"QF10_V8_REVIEW_BRANCH_GREEN branch=$branch sha=$(git rev-parse\
        \ HEAD) parent=$GITHUB_SHA\"\necho 'REVIEW ONLY: NOT PROMOTED to main. Owner must separately approve any future promotion.'\n"
