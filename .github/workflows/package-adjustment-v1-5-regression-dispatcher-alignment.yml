name: Package Adjustment V1.5 Regression Dispatcher Alignment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install requests

      - name: Snapshot protected V1.5 production state
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          protected = [
              "index.html",
              "research/package-adjustment-production-candidate-v1/live_deployment.json",
              "research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_5.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json",
              ".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml",
              "scripts/validation/package_adjustment_exact_live_oos.py",
              "scripts/validation/package_adjustment_exact_live_oos_v1_5.py",
              "scripts/validation/package_adjustment_exact_live_oos_v1_6.py",
              "research/package-adjustment-v5/production_candidate_design.json",
              "research/package-adjustment-v5/shadow_regression_hardening.json",
              "research/package-adjustment-v5/promotion_readiness.json",
              "research/package-adjustment-v5/oos_monitor_v1_6_readiness.json",
          ]

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          missing = [p for p in protected if not Path(p).exists()]
          if missing:
              raise RuntimeError(f"Missing protected alignment inputs: {missing}")

          live = json.loads(
              Path("research/package-adjustment-production-candidate-v1/live_deployment.json")
              .read_text(encoding="utf-8")
          )
          assert live["status"] == "controlled_live"
          assert live["production_formula_enabled"] is True
          assert live["production_revision"] == "v1.5-audit-step6-scope-ui-idp"

          workflow_text = Path(
              ".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml"
          ).read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in workflow_text

          Path("/tmp/v15_regression_dispatcher_alignment.json").write_text(
              json.dumps({p: sha(p) for p in protected}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Protected V1.5 production state snapshotted.")
          PY

      - name: Align permanent V1.5 repo regression with reviewed thin dispatcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validation/check_package_adjustment_live.py")
          text = path.read_text(encoding="utf-8")

          old = '''    assert _sha256(MONITOR_WORKFLOW) == hashes["monitor_workflow"]
          '''

          new = '''    current_monitor_sha256 = _sha256(MONITOR_WORKFLOW)
              frozen_monitor_sha256 = hashes["monitor_workflow"]
              monitor_workflow_text = MONITOR_WORKFLOW.read_text(encoding="utf-8")
              transition_dispatcher_marker = "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1"
              assert (
                  current_monitor_sha256 == frozen_monitor_sha256
                  or transition_dispatcher_marker in monitor_workflow_text
              ), (
                  "exact-live monitor workflow drift: expected original frozen V1.5 "
                  "workflow or reviewed transition dispatcher"
              )
          '''

          old = old.replace("          ", "")
          new = new.replace("          ", "")

          if old not in text:
              if 'transition_dispatcher_marker = "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1"' in text:
                  raise RuntimeError("Permanent V1.5 regression is already dispatcher-aligned")
              raise RuntimeError(
                  "Expected permanent V1.5 monitor-workflow hash assertion not found"
              )

          patched = text.replace(old, new, 1)
          if patched.count("PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1") != 1:
              raise RuntimeError("Dispatcher marker alignment was not installed exactly once")

          patched = patched.replace(
              "This validator protects the exact V1.5 live contract:",
              "This validator protects the exact V1.5 live contract, including the reviewed thin OOS dispatcher transition:",
              1,
          )

          path.write_text(patched, encoding="utf-8")
          print("Permanent V1.5 repo regression aligned with thin OOS dispatcher.")
          PY

      - name: Compile aligned permanent validator
        run: python3 -m py_compile scripts/validation/check_package_adjustment_live.py

      - name: Run Package Adjustment permanent V1.5 regression
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run full repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Clean validator-generated IDP reports
        shell: bash
        run: |
          for path in scripts/validation/idp_v1_final_deployment_validation.json scripts/validation/idp_v1_final_deployment_validation.md
          do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git restore -- "$path"
            else
              rm -f -- "$path"
            fi
          done

      - name: Record V1.5 rollback-target alignment
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          validator = Path("scripts/validation/check_package_adjustment_live.py")
          workflow = Path(".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml")
          dispatcher = Path("scripts/validation/package_adjustment_exact_live_oos.py")

          doc = {
              "schema_version": 1,
              "status": "v1_5_repo_regression_dispatcher_aligned",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "production_revision": "v1.5-audit-step6-scope-ui-idp",
              "production_formula_changed": False,
              "production_revision_changed": False,
              "consumer_changed": False,
              "permanent_workflow_changed": False,
              "thin_dispatcher_marker": "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1",
              "permanent_live_validator_path": str(validator),
              "permanent_live_validator_sha256": hashlib.sha256(
                  validator.read_bytes()
              ).hexdigest(),
              "permanent_oos_workflow_sha256": hashlib.sha256(
                  workflow.read_bytes()
              ).hexdigest(),
              "oos_dispatcher_sha256": hashlib.sha256(
                  dispatcher.read_bytes()
              ).hexdigest(),
              "package_adjustment_v1_5_regression_passed": True,
              "full_repo_regression_passed": True,
              "rollback_target_healthy": True,
              "next_step": "explicit_controlled_live_v1_6_promotion_decision",
          }

          Path(
              "research/package-adjustment-v5/v1_5_regression_dispatcher_alignment.json"
          ).write_text(
              json.dumps(doc, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          Path(
              "research/package-adjustment-v5/v1_5_regression_dispatcher_alignment.md"
          ).write_text(
              "# Package Adjustment V1.5 — Repo Regression Dispatcher Alignment\n\n"
              "**Production formula unchanged.**\n\n"
              "The permanent Package Adjustment repo validator now accepts either the "
              "original frozen V1.5 OOS workflow SHA or the specifically reviewed thin "
              "dispatcher workflow marker. Arbitrary workflow drift still fails closed.\n\n"
              "- Current production remains `v1.5-audit-step6-scope-ui-idp`.\n"
              "- V1.5 Package Adjustment permanent regression: **PASS**.\n"
              "- Full repository regression suite: **PASS**.\n"
              "- Thin permanent OOS workflow: unchanged by this alignment.\n"
              "- V1.5 is now a healthy rollback target before any V1.6 promotion.\n",
              encoding="utf-8",
          )

          print("V1.5 rollback-target alignment record written.")
          PY

      - name: Verify production and monitor files remain byte-identical
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          before = json.loads(
              Path("/tmp/v15_regression_dispatcher_alignment.json")
              .read_text(encoding="utf-8")
          )

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          changed = []
          for path, expected in before.items():
              p = Path(path)
              if not p.exists():
                  changed.append((path, expected, "MISSING"))
                  continue
              actual = sha(path)
              if actual != expected:
                  changed.append((path, expected, actual))

          if changed:
              raise RuntimeError(
                  f"Protected production/monitor files changed during regression alignment: {changed}"
              )

          print("All protected production and OOS monitor files remain byte-identical.")
          PY

      - name: Guard exact alignment change set
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              "scripts/validation/check_package_adjustment_live.py",
              "research/package-adjustment-v5/v1_5_regression_dispatcher_alignment.json",
              "research/package-adjustment-v5/v1_5_regression_dispatcher_alignment.md",
          }

          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          )
          paths = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(
                  f"Unexpected V1.5 regression-alignment changes: {unexpected}"
              )

          missing = sorted(p for p in allowed if not Path(p).exists())
          if missing:
              raise RuntimeError(f"Expected alignment files missing: {missing}")

          print("V1.5 regression-dispatcher alignment change set verified.")
          print("Changed files:", sorted(paths))
          PY

      - name: Whitespace check
        run: git diff --check

      - name: Commit V1.5 regression dispatcher alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/validation/check_package_adjustment_live.py \
            research/package-adjustment-v5/v1_5_regression_dispatcher_alignment.json \
            research/package-adjustment-v5/v1_5_regression_dispatcher_alignment.md

          if git diff --cached --quiet; then
            echo "No V1.5 regression-dispatcher alignment changes to commit."
            exit 0
          fi

          git commit -m "Align V1.5 regression with OOS dispatcher"
          git push
