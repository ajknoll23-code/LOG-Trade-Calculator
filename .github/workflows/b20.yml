# PREFLIGHTED: B20_LAYER_D_SHADOW_CALIBRATION_PREREGISTRATION
name: B20 Draft Capital Outlook V1 - Layer D Shadow Calibration Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b20_layer_d_shadow_calibration_preregistration:
    name: Freeze Layer D shadow calibration mapping and gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard exact B19 STRONG authority and B18 shadow ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          B18=D/"b18"
          B19=D/"b19"
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          cfgp=B18/"b18_config.json"
          resultp=B19/"c1_result.json"
          contractp=B19/"b19_execution_contract.json"
          tablep=B19/"historical_capital_table.csv"
          manifestp=B19/"b19_manifest.json"
          for p in (cfgp,resultp,contractp,tablep,manifestp):
              assert p.is_file(),p

          assert sha(cfgp)=="6c6706bd65059a8eb04ac66bf43a2a27810b93984ab90e336f3b9e1bd33b390e"
          assert sha(resultp)=="75bfbc0b396238f61caa6b0d1d3c963b0dc1df5ea555f4e1962986369bc6b4d0"
          assert sha(contractp)=="bd88d0def6fa79ef7d365f9fec3640dc3caa29b7d0c69ec26d6519b1c765f4c6"
          assert sha(tablep)=="104318a6efd9e9edc1eb29a37a7dc39891eb3e073e45f44a399cc95ac11a4883"

          cfg=json.loads(cfgp.read_text())
          r=json.loads(resultp.read_text())
          m=json.loads(manifestp.read_text())

          assert r["decision"]=="C1_STRONG"
          assert r["classification"]=="STRONG"
          assert r["G1"]["pass"] is True
          assert r["G2"]["pass"] is True
          assert r["G3"]["pass"] is True
          assert r["historical_class_years"]==list(range(2013,2024))
          assert r["historical_class_n"]==11
          assert r["direct_production_authority"] is False
          assert r["production_change_authorized"] is False
          assert r["2027_class_scored"] is False
          assert r["downstream_authority"]=="AUTHORIZE_SEPARATE_LAYER_D_SHADOW_CALIBRATION_STUDY_ONLY_NO_PRODUCTION"

          assert m["c1_executed"] is True
          assert m["c1_execution_count_committed"]==1
          assert m["classification"]=="STRONG"
          assert m["production_change_authorized"] is False
          assert m["2027_class_scored"] is False

          assert cfg["downstream_authority"]["maximum_future_initial_shadow_multiplier_deviation"]==0.03
          assert cfg["downstream_authority"]["production_change_authorized"] is False
          assert cfg["downstream_authority"]["2027_class_scored"] is False
          assert cfg["objective"]["model_or_target_shopping_after_c1_allowed"] is False
          assert cfg["objective"]["post_c1_gate_movement_allowed"] is False

          assert not (D/"b20").exists(), "B20 already committed; preregistration is immutable"
          print("PASS: B19 STRONG authority and B18 +/-3% maximum shadow ceiling verified.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B20 Layer D mapping and B21 acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b20
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b20"

          protocol={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b20_layer_d_shadow_calibration_preregistration",
            "decision":"PREREGISTER_LAYER_D_SHADOW_CALIBRATION_AUTHORIZE_B21_HISTORICAL_EXECUTION_ONLY",
            "authority_source":{
              "b19_decision":"C1_STRONG",
              "b19_classification":"STRONG",
              "b19_downstream_authority":"AUTHORIZE_SEPARATE_LAYER_D_SHADOW_CALIBRATION_STUDY_ONLY_NO_PRODUCTION",
              "b18_maximum_future_initial_shadow_multiplier_deviation":0.03
            },
            "epistemic_status":{
              "historical_predictor_target_association_already_opened_in_b19":True,
              "b20_claims_historical_outcome_blinding":False,
              "mapping_and_b21_gates_frozen_before_b21_calibration_metrics":True,
              "gate_or_mapping_tuning_after_b21_results_allowed":False,
              "c1_reinterpretation_or_gate_movement_allowed":False
            },
            "historical_calibration_cohort":{
              "class_years":list(range(2013,2024)),
              "class_n":11,
              "x":"ln(projected fantasy-relevant Rich Hill top-60 capital)",
              "y":"ln(actual fantasy-relevant Rich Hill top-60 capital)",
              "input_table":"research/draft-capital-outlook-v1/b19/historical_capital_table.csv",
              "input_table_sha256":"104318a6efd9e9edc1eb29a37a7dc39891eb3e073e45f44a399cc95ac11a4883"
            },
            "layer_d_mapping":{
              "scope":"single class-level research shadow multiplier only",
              "within_class_round_slot_or_position_shaping_allowed":False,
              "production_application_allowed":False,
              "fit_model":"OLS y=a+b*x with b=max(0, unconstrained OLS slope)",
              "neutral_projected_reference":"median x of the calibration training set",
              "outcome_scale":"sample standard deviation of y in the calibration training set using denominator n-1",
              "predicted_log_capital":"yhat(x)=a+b*x",
              "neutral_predicted_log_capital":"yhat(x0)=a+b*x0 where x0 is training median x",
              "standardized_shadow_score":"z=(yhat(x)-yhat(x0))/s_y",
              "score_clip":[-2.0,2.0],
              "percentage_points_per_score_unit":0.015,
              "multiplier_formula":"M(x)=1+0.015*clip(z,-2,2)",
              "hard_multiplier_bounds":[0.97,1.03],
              "neutral_multiplier":1.0,
              "interpretation":"A bounded research index translating the validated capital-composition forecast into a conservative class-wide shadow signal; not an empirically proven causal FV elasticity."
            },
            "b21_execution_protocol":{
              "execution_count_authorized":1,
              "historical_only":True,
              "2027_source_content_may_be_read":False,
              "2027_class_may_be_scored":False,
              "production_files_may_be_modified":False,
              "full_fit":"fit the frozen mapping on all 11 classes only after protocol/hash guards pass",
              "loo_fit":"for each held-out class, recompute a,b,x0,s_y using only the other 10 classes and score only the held-out x",
              "spearman_permutation_count":99999,
              "spearman_seed":200000,
              "spearman_p_value":"(1 + count(permuted rho >= observed rho)) / (B + 1)",
              "fixed_stability_grid":"the full-sample sorted-x order statistics at 1st, 3rd, 6th, 9th, and 11th positions; no interpolation",
              "deletion_stability":"delete each class, refit mapping on remaining 10, evaluate each deletion mapping on the same frozen full-sample stability grid"
            },
            "b21_acceptance_gates":{
              "D1_numerical_monotonicity":{
                "pass":"full-fit clipped slope b > 0; s_y > 0; all produced historical and grid multipliers finite and inside [0.97,1.03]"
              },
              "D2_loo_direction":{
                "target_direction":"sign(y_heldout - median(y_training))",
                "predicted_direction":"sign(M_heldout - 1.00)",
                "zero_rule":"If either side is exactly zero, agreement counts only when both are exactly zero.",
                "minimum_agreements":8,
                "denominator":11,
                "pass":"agreement_count >= 8"
              },
              "D3_loo_rank":{
                "statistic":"Spearman rho between the 11 LOO shadow multipliers and the 11 held-out y values",
                "alternative":"positive",
                "alpha":0.15,
                "permutations":99999,
                "seed":200000,
                "pass":"rho > 0 AND one-sided permutation p <= 0.15"
              },
              "D4_single_class_mapping_stability":{
                "metric":"maximum absolute multiplier difference between full-fit mapping and any single-class-deletion mapping over the frozen 5-point x grid",
                "maximum_absolute_difference":0.01,
                "pass":"max_abs_delta <= 0.01"
              },
              "D5_historical_saturation":{
                "definition":"full-fit historical multiplier exactly equals 0.97 or 1.03 after clipping",
                "maximum_saturated_classes":2,
                "denominator":11,
                "pass":"saturation_count <= 2"
              },
              "joint_pass":"D1 AND D2 AND D3 AND D4 AND D5"
            },
            "b21_decisions":{
              "pass":"PASS_LAYER_D_HISTORICAL_CALIBRATION_AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY",
              "fail":"STOP_LAYER_D_SHADOW_PATH_KEEP_DRAFT_CAPITAL_OUTLOOK_NEUTRAL_1_00",
              "invalid":"B21_INVALID_INTEGRITY_HASH_PROTOCOL_OR_NUMERICAL_FAILURE"
            },
            "downstream_boundary":{
              "b21_pass_authorizes_direct_2027_scoring":False,
              "b21_pass_authorizes_production":False,
              "b21_pass_authorizes":"a separate preregistration for exact 2027 source identity/comparability and one research-only shadow score",
              "maximum_possible_future_shadow_multiplier_deviation":0.03,
              "production_requires_additional_separate_evidence_and_authorization":True,
              "2027_class_scored":False,
              "production_change_authorized":False
            },
            "scientific_firewall":{
              "historical_shadow_multipliers_computed_in_b20":False,
              "b21_gate_metrics_computed_in_b20":False,
              "2027_source_content_read_in_b20":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
              "production_file_modified":False
            }
          }

          p=O/"b20_layer_d_preregistration.json"
          p.write_text(json.dumps(protocol,indent=2,sort_keys=True)+"\n")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (O/"b20_layer_d_preregistration.sha256").write_text(h+"  b20_layer_d_preregistration.json\n")
          print(json.dumps({"decision":protocol["decision"],"protocol_sha256":h},indent=2))
          PY

      - name: Audit B20 frozen protocol invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b20")
          p=O/"b20_layer_d_preregistration.json"
          P=json.loads(p.read_text())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          recorded=(O/"b20_layer_d_preregistration.sha256").read_text().split()[0]
          assert got==recorded

          assert P["decision"]=="PREREGISTER_LAYER_D_SHADOW_CALIBRATION_AUTHORIZE_B21_HISTORICAL_EXECUTION_ONLY"
          assert P["epistemic_status"]["b20_claims_historical_outcome_blinding"] is False
          assert P["epistemic_status"]["mapping_and_b21_gates_frozen_before_b21_calibration_metrics"] is True
          assert P["epistemic_status"]["gate_or_mapping_tuning_after_b21_results_allowed"] is False
          assert P["historical_calibration_cohort"]["class_years"]==list(range(2013,2024))
          assert P["historical_calibration_cohort"]["class_n"]==11

          M=P["layer_d_mapping"]
          assert M["score_clip"]==[-2.0,2.0]
          assert M["percentage_points_per_score_unit"]==0.015
          assert M["hard_multiplier_bounds"]==[0.97,1.03]
          assert M["neutral_multiplier"]==1.0
          assert M["within_class_round_slot_or_position_shaping_allowed"] is False
          assert M["production_application_allowed"] is False

          E=P["b21_execution_protocol"]
          assert E["execution_count_authorized"]==1
          assert E["historical_only"] is True
          assert E["2027_source_content_may_be_read"] is False
          assert E["2027_class_may_be_scored"] is False
          assert E["production_files_may_be_modified"] is False
          assert E["spearman_permutation_count"]==99999
          assert E["spearman_seed"]==200000

          G=P["b21_acceptance_gates"]
          assert G["D2_loo_direction"]["minimum_agreements"]==8
          assert G["D3_loo_rank"]["alpha"]==0.15
          assert G["D3_loo_rank"]["permutations"]==99999
          assert G["D4_single_class_mapping_stability"]["maximum_absolute_difference"]==0.01
          assert G["D5_historical_saturation"]["maximum_saturated_classes"]==2
          assert G["joint_pass"]=="D1 AND D2 AND D3 AND D4 AND D5"

          F=P["scientific_firewall"]
          assert F=={
            "2027_class_scored":False,
            "2027_source_content_read_in_b20":False,
            "b21_gate_metrics_computed_in_b20":False,
            "historical_shadow_multipliers_computed_in_b20":False,
            "production_change_authorized":False,
            "production_file_modified":False,
          }
          assert P["downstream_boundary"]["b21_pass_authorizes_direct_2027_scoring"] is False
          assert P["downstream_boundary"]["b21_pass_authorizes_production"] is False
          assert P["downstream_boundary"]["maximum_possible_future_shadow_multiplier_deviation"]==0.03
          print("PASS: B20 mapping, B21 gates, and scientific firewall are frozen exactly.")
          PY

      - name: Write B20 report and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b20")
          P=json.loads((O/"b20_layer_d_preregistration.json").read_text())
          ph=hashlib.sha256((O/"b20_layer_d_preregistration.json").read_bytes()).hexdigest()

          report=[
            "# Draft Capital Outlook V1 — B20 Layer D Shadow Calibration Preregistration",
            "",
            f"Decision: **{P['decision']}**",
            "",
            "## Authority entering B20",
            "- B19 C1 classification: STRONG.",
            "- Direct production authority: NO.",
            "- Maximum future initial shadow deviation inherited from B18: +/-3%.",
            "",
            "## Frozen Layer D mapping",
            "- One class-wide research-only multiplier; no slot/round/position shaping.",
            "- Fit historical log actual capital on log projected capital with nonnegative OLS slope.",
            "- Neutral point: training median projected log capital.",
            "- Scale: training sample SD of actual log capital.",
            "- Shadow score: predicted deviation from neutral divided by that SD.",
            "- Multiplier: 1 + 0.015 * clip(score, -2, +2).",
            "- Hard bounds: 0.97 to 1.03.",
            "",
            "## B21 frozen gates",
            "- D1: numerical validity and positive monotone full-fit slope.",
            "- D2: at least 8/11 LOO direction agreements.",
            "- D3: positive LOO Spearman rho with one-sided 99,999-permutation p <= 0.15.",
            "- D4: <=1.0 percentage-point max single-class-deletion mapping drift on the frozen five-point grid.",
            "- D5: no more than 2/11 historical classes saturated at the +/-3% cap.",
            "",
            "## Firewall",
            "- B20 computes no historical shadow multiplier and no B21 gate metric.",
            "- B20 reads no 2027 source content and scores no 2027 class.",
            "- A B21 pass still does not authorize direct 2027 scoring or production.",
            ""
          ]
          (O/"b20_report.md").write_text("\n".join(report))

          core=[
            "b20_layer_d_preregistration.json",
            "b20_layer_d_preregistration.sha256",
            "b20_report.md",
          ]
          hashes={n:hashlib.sha256((O/n).read_bytes()).hexdigest() for n in core}
          manifest={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b20_manifest",
            "decision":P["decision"],
            "protocol_sha256":ph,
            "output_hashes":hashes,
            "b21_historical_execution_authorized":True,
            "b21_execution_count_authorized":1,
            "historical_shadow_multipliers_computed":False,
            "b21_gate_metrics_computed":False,
            "2027_source_content_read":False,
            "2027_class_scored":False,
            "direct_production_authority":False,
            "production_change_authorized":False,
          }
          (O/"b20_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Verify research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          prefix="research/draft-capital-outlook-v1/b20/"
          status=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          ).splitlines()
          assert status, "expected B20 outputs"
          changed=[]
          for line in status:
              path=line[3:]
              if " -> " in path:
                  path=path.split(" -> ",1)[1]
              changed.append(path)
          bad=[p for p in changed if not p.startswith(prefix)]
          assert not bad,bad
          required={
            prefix+"b20_layer_d_preregistration.json",
            prefix+"b20_layer_d_preregistration.sha256",
            prefix+"b20_report.md",
            prefix+"b20_manifest.json",
          }
          assert required.issubset(set(changed)),(required,set(changed))
          print("PASS: only B20 research artifacts are mutated.")
          PY

      - name: Run repository regression after B20 without losing artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/b20-artifacts.tgz research/draft-capital-outlook-v1/b20
          git reset --hard HEAD
          git clean -fd
          python3 scripts/validation/repo_regression_checks.py
          tar -xzf /tmp/b20-artifacts.tgz
          test -d research/draft-capital-outlook-v1/b20

      - name: Final B20 reproducibility and firewall audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v1/b20")
          P=json.loads((O/"b20_layer_d_preregistration.json").read_text())
          M=json.loads((O/"b20_manifest.json").read_text())
          ph=hashlib.sha256((O/"b20_layer_d_preregistration.json").read_bytes()).hexdigest()
          assert ph==M["protocol_sha256"]
          for n,h in M["output_hashes"].items():
              assert hashlib.sha256((O/n).read_bytes()).hexdigest()==h,(n,h)
          assert M["b21_historical_execution_authorized"] is True
          assert M["b21_execution_count_authorized"]==1
          assert M["historical_shadow_multipliers_computed"] is False
          assert M["b21_gate_metrics_computed"] is False
          assert M["2027_source_content_read"] is False
          assert M["2027_class_scored"] is False
          assert M["direct_production_authority"] is False
          assert M["production_change_authorized"] is False
          assert P["scientific_firewall"]["production_file_modified"] is False

          status=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          ).splitlines()
          assert status
          assert all(line[3:].startswith("research/draft-capital-outlook-v1/b20/") for line in status),status
          print("PASS: B20 is reproducible, research-only, and authorizes exactly one historical B21 calibration execution.")
          PY

      - name: Commit B20 preregistration
        shell: bash
        env:
          START_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          test "$REMOTE_SHA" = "$START_SHA" || {
            echo "main moved during B20; refusing to commit against a changed baseline"
            echo "start=$START_SHA remote=$REMOTE_SHA"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v1/b20
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "B20: preregister Layer D shadow calibration"
          git push origin HEAD:main
