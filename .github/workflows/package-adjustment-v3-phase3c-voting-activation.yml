name: Package Adjustment V3 - Phase 3C Fresh Voting Activation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard exact Phase 3C activator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3c.py)" = "b12b52d6756bc6a5955ec177aa0427e8c71a0bbe"

      - name: Guard clean tree and frozen production/research
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e research/package-adjustment-v3-ktc-style/phase3_voting_release.json

          sha256sum             research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.json             research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration_manifest.json             research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.json             research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.md             research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog_manifest.json             research/package-adjustment-production-candidate-v1/live_deployment.json             > "${RUNNER_TEMP}/frozen_before.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Activator self-test
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3c.py --selftest

      - name: Activate fresh voting
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3c.py --activate

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", text, re.S | re.I)

          with tempfile.NamedTemporaryFile(
              "w", suffix=".js", delete=False, encoding="utf-8"
          ) as f:
              f.write("\n".join(scripts))
              path = f.name
          try:
              subprocess.run(["node", "--check", path], check=True)
          finally:
              os.unlink(path)

          print("PASS: index.html inline JavaScript syntax.")
          PY

      - name: KTC pipeline self-test
        run: python3 scripts/market/ktc_pipeline.py --selftest

      - name: Verify production still V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Post-activation repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Prove frozen inputs unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/frozen_before.sha256"

      - name: Guard exact activation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "research/package-adjustment-v3-ktc-style/phase3_voting_release.json",
              "scripts/market/ktc_pipeline.py",
              "scripts/validation/repo_regression_checks.py",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected Phase 3C changed-file set. "
                  f"Expected={sorted(expected)} Actual={sorted(actual)}"
              )

          print("PASS: exact Phase 3C activation scope.")
          PY

      - name: Commit fresh voting activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             index.html             research/package-adjustment-v3-ktc-style/phase3_voting_release.json             scripts/market/ktc_pipeline.py             scripts/validation/repo_regression_checks.py

          git diff --cached --check
          git commit -m "Activate Package Adjustment V3 fresh confirmation voting"
          git push origin HEAD:main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: V3 fresh confirmation voting active; production remains V1.6."
