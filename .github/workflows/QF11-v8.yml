name: QF11 V8 - Frozen Catalog Source-Aware Replacement Feasibility (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  research:
    name: Cross-verify archived ballots, classify source flags and suggest FV-comparable replacements; no activation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout dispatched main read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Protect unchanged QF10 source, identity crosswalk and published Market blobs
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "STOP requires main"; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ "$(git hash-object index.html)" == "c83e3f68d11853c072017e6bd83bb1ad085f4a3e" ]] || { echo "STOP pinned source
        drift index.html"; exit 1; }

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == "829445174a77ceb4bb19dfd97a725e371d18efe8"
        ]] || { echo "STOP pinned source drift scripts/artifacts/generated/market_values.json"; exit 1; }

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == "9d007a7f053e15dcdc0f694563ca17bc47568e5f"
        ]] || { echo "STOP pinned source drift scripts/artifacts/generated/value_uncertainty.json"; exit 1; }

        [[ "$(git hash-object scripts/market/build_market_value.py)" == "a015d54785ce5fcb3b9f26bae0120b82693a6bd8" ]] || {
        echo "STOP pinned source drift scripts/market/build_market_value.py"; exit 1; }

        [[ "$(git hash-object scripts/market/ktc_pipeline.py)" == "b9612c73a91223397a4f49b384d8d86719ee8d79" ]] || { echo
        "STOP pinned source drift scripts/market/ktc_pipeline.py"; exit 1; }

        [[ "$(git hash-object scripts/validation/snapshot_values.py)" == "1efca4c35e910a95974c1bec0b06a106196618b3" ]] ||
        { echo "STOP pinned source drift scripts/validation/snapshot_values.py"; exit 1; }

        [[ "$(git hash-object scripts/validation/repo_regression_checks.py)" == "5191e1160c966ed14401b70c86c6f63808e1265d"
        ]] || { echo "STOP pinned source drift scripts/validation/repo_regression_checks.py"; exit 1; }

        [[ "$(git hash-object scripts/identity_crosswalk.json)" == "3489c01c923474931f4db81e3dd338f437bfdf5f" ]] || { echo
        "STOP pinned source drift scripts/identity_crosswalk.json"; exit 1; }

        [[ "$(git hash-object data/players_cache.json)" == "216242d9f87a81c4d1532cca2468c90a52918c3d" ]] || { echo "STOP pinned
        source drift data/players_cache.json"; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || exit 1

        echo "QF11_V8_FROZEN_SOURCES_GREEN"'
    - name: Read exact V6 unactivated catalog archive (pinned artifact)
      uses: actions/download-artifact@v4
      with:
        name: QF11-v6-RESEARCH-ONLY-unactivated-vote-catalog
        run-id: 38255346352
        github-token: ${{ github.token }}
        path: /tmp/qf11-v8-sources/v6
    - name: Retrieve immutable V7 source cohort or eligibility artifact
      uses: actions/download-artifact@v4
      with:
        name: QF11-v7-RESEARCH-ONLY-eligibility-review
        run-id: 38258198738
        github-token: ${{ github.token }}
        path: /tmp/qf11-v8-sources/v7
    - name: Retrieve immutable V3 source cohort or eligibility artifact
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v8-sources/v3
    - name: Retrieve immutable V5 source cohort or eligibility artifact
      uses: actions/download-artifact@v4
      with:
        name: QF11-v5-RESEARCH-ONLY-full-voter-LOO
        run-id: 38207614774
        github-token: ${{ github.token }}
        path: /tmp/qf11-v8-sources/v5
    - name: Validate four source hashes and produce source-screened replacement proposals without activation
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf11-v8-research.py <<'QF11_V8_PY'\nfrom __future__ import annotations\nimport collections,\
        \ hashlib, json, re, sys\nfrom pathlib import Path\n\nROOT=Path.cwd()\nTEST='--fixture' in sys.argv\nBASE=Path('/tmp/qf11-v8-sources')\
        \ if not TEST else Path('/mnt/data/qf11_v8_fixture')\nOUTPUT=Path('/tmp/qf11-v8-output') if not TEST else Path('/mnt/data/qf11_v8_fixture_output')\n\
        OUTPUT.mkdir(parents=True,exist_ok=True)\nREQUIRED={\n  'v6':{'RESEARCH_ONLY_proposed_28_triplets_NOT_FOR_VOTERS.json':'627a6774170cccfef94be80ce8c892734de47c1b195e2298ca69fe85cb6154ec'},\n\
        \  'v7':{'RESEARCH_ONLY_28_slot_eligibility_review.json':'b920fe5396fd363ed45a99e8cd2bf7695de54e6b7cb86e41e2ba7996da84f2a5'},\n\
        \  'v3':{'PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json':'19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc'},\n\
        \  'v5':{'RESEARCH_ONLY_per_player_anonymous_influence.json':'a2e6b6117be069983ba0dbd448ed4f5087cc09f6df1b876b0d34d214e1aa7c9e'},\n\
        }\nreads={}\nfor part,files in REQUIRED.items():\n for name,expected in files.items():\n  p=BASE/part/name\n  actual=hashlib.sha256(p.read_bytes()).hexdigest()\n\
        \  assert actual==expected, f'STOP mismatched immutable {part}/{name}'\n  reads[part]=json.loads(p.read_text())\n\
        v6,v7,v3,v5=(reads[x] for x in ('v6','v7','v3','v5'))\nassert len(v6['catalog'])==len(v7['ballots'])==28\nassert len(v3['players'])==len(v5['players'])==504\n\
        assert v6['source_after_daily_cap_sha256']==v7['source_after_daily_cap_sha256']==v3['source']['source_after_daily_cap_sha256']==v5['source_after_daily_cap_sha256']=='a0ed9f867883d9013cbee69a0136586a22223571f5f57d4f0627d5d77fd6d2b2'\n\
        assert v6['status']=='PROPOSED_NOT_APPROVED_NOT_LAUNCHED'\nassert v7['decision']=='REVIEW_REQUIRED_NOT_APPROVED_NOT_FOR_VOTERS'\n\
        assert v7['catalog_activated'] is False and v7['approval_authorized'] is False\nassert v3['research_only'] is True\
        \ and v3['deployment_authorized'] is False\nassert v6['no_ballots_created_or_votes_collected'] is True\nassert v6['source_after_daily_cap_sha256']==v7['source_after_daily_cap_sha256']\n\
        assert v7['summary']['source_flagged_distinct_players']==18\nassert v7['summary']['unique_same_position_pairs']==16\n\
        assert v7['summary']['repeated_same_position_pair_exposures']==12\nassert v6['source_after_daily_cap_sha256']==v5['source_after_daily_cap_sha256']\n\
        \nif not TEST:\n sys.path.insert(0,str(ROOT))\n from scripts.validation import snapshot_values\n cfg=snapshot_values.load_from_html(ROOT/'index.html')\n\
        \ values=snapshot_values.compute_all_values(cfg)\n model={k:{'pos':v['pos'],'value':values[k]['value']} for k,v in\
        \ cfg['player_db'].items()}\n teams=dict(re.findall(r\"'([^']+)':\\{pos:'[A-Z]+',age:\\d+,role:'[^']+',team:'([^']*)'\"\
        ,(ROOT/'index.html').read_text()))\n crosswalk=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())\n\
        \ cache=json.loads((ROOT/'data/players_cache.json').read_text())\n if isinstance(cache,dict):cache=cache.get('players')\
        \ or cache.get('data') or cache\n cache_rows=list(cache.values()) if isinstance(cache,dict) else cache\nelse:\n #\
        \ Fixture exercises grouping, selection, output and privacy without external network or GitHub.\n model={k:{'pos':v['pos'],'value':v['fundamental_value']}\
        \ for k,v in v3['players'].items()}\n teams={k:'ZZ' for k in model}\n crosswalk=[{'name':k,'sleeper_id':str(i+1),'fp_position':p['pos'],'sleeper_pos':p['pos'],'fp_team':'ZZ','sleeper_team':'ZZ'}\
        \ for i,(k,p) in enumerate(v3['players'].items())]\n cache_rows=[{'player_id':str(i+1),'team':'ZZ','position':p['pos'],'status':'Active'}\
        \ for i,(k,p) in enumerate(v3['players'].items())]\n\ndef canonical(s):return re.sub('[^a-z0-9]','',str(s or '').lower())\n\
        def normpos(s):return {'DE':'DL','DT':'DL','NT':'DL','EDGE':'DL','OLB':'LB','ILB':'LB','MLB':'LB','CB':'DB','SS':'DB','FS':'DB','S':'DB','SAF':'DB'}.get(str(s\
        \ or '').upper(),str(s or '').upper())\ndef team(s):return {'JAX':'JAC','JAC':'JAC'}.get(str(s or '').upper(),str(s\
        \ or '').upper())\nbyname=collections.defaultdict(list)\nfor row in crosswalk:\n if isinstance(row,dict):byname[canonical(row.get('name'))].append(row)\n\
        byid={str(r.get('player_id') or r.get('id')):r for r in cache_rows if isinstance(r,dict) and (r.get('player_id') or\
        \ r.get('id'))}\n\ndef verified_player(k):\n if k not in model or k not in teams or k in ('joe mixon','aaron donald'):return\
        \ False\n xs=byname.get(canonical(k),[])\n ids={str(x.get('sleeper_id')) for x in xs if x.get('sleeper_id') is not\
        \ None}\n if len(ids)!=1 or len(xs)<1:return False\n sid=next(iter(ids));c=byid.get(sid)\n if not c or str(c.get('status')\
        \ or '').lower()!='active':return False\n if normpos(c.get('position'))!=model[k]['pos'] or team(c.get('team'))!=team(teams[k]):return\
        \ False\n for x in xs:\n  if normpos(x.get('fp_position'))!=model[k]['pos']:return False\n  if normpos(x.get('sleeper_pos'))!=model[k]['pos']:return\
        \ False\n  if team(x.get('fp_team'))!=team(teams[k]) or team(x.get('sleeper_team'))!=team(teams[k]):return False\n\
        \ return True\n\nold=v6['catalog']\nreview=v7['ballots']\nfor b,r in zip(old,review):\n assert b['slot']==r['slot']\
        \ and b['audit_pair_position']==r['pair_position']\n assert set(b['player_keys'])=={p['name'] for p in r['players']}\n\
        \ assert tuple(sorted(b['player_keys'][:2]))==tuple(r['anchored_pair'])\n for k in b['player_keys']:\n  assert k in\
        \ model and k in v3['players'] and k in v5['players'],f'STOP invalid model/market key {k}'\n  assert model[k]['value']==v3['players'][k]['fundamental_value'],f'STOP\
        \ stale FV {k}'\n  assert model[k]['pos']==v3['players'][k]['pos'],f'STOP stale position {k}'\n\nfirst_seen={}\nrepeated=[]\n\
        all_existing={k for b in old for k in b['player_keys']}\nfor b in old:\n pair=tuple(sorted(b['player_keys'][:2]))\n\
        \ if pair in first_seen:repeated.append(b['slot'])\n else:first_seen[pair]=b['slot']\nassert len(repeated)==12 and\
        \ len(all_existing)==56\n\n# The fixed source pool is the 504 V3 players; only source-exact, active,\n# team-matching\
        \ and position-matching alternatives may be suggested.\npool={k for k in v3['players'] if k not in all_existing and\
        \ verified_player(k)}\noptions=[];allocated=set();revised=[];unresolved=[]\nfor b in old:\n slot=b['slot'];keys=list(b['player_keys']);position=b['audit_pair_position']\n\
        \ before=tuple(sorted(keys[:2]));best=None\n if slot in repeated:\n  for endpoint in (0,1):\n   anchor=keys[1-endpoint];third=keys[2]\n\
        \   for cand in sorted(pool-allocated):\n    if model[cand]['pos']!=position or cand==anchor or model[cand]['value']<=0:continue\n\
        \    fv=[model[cand]['value'],model[anchor]['value'],model[third]['value']]\n    ratio=max(fv)/min(fv)\n    if ratio>1.30:continue\
        \ # FV comparability guard, NOT evidence-sufficiency threshold\n    sensitivity=v5['players'][cand].get('worst_abs_point_movement_same_universe_only')\n\
        \    sensitivity=float(sensitivity) if isinstance(sensitivity,(int,float)) else 0.0\n    obs=int(v3['players'][cand]['evidence'].get('same_position_pairwise_observations',0))\n\
        \    # Initial comparison fairness dominates; existing instability and low direct evidence are tie-breakers.\n   \
        \ score=(round(ratio,5),-min(sensitivity,2500),obs,cand,endpoint)\n    if best is None or score<best[0]:best=(score,cand,endpoint,ratio,obs,sensitivity)\n\
        \  if best is not None:\n   _,cand,endpoint,ratio,obs,sensitivity=best\n   keys[endpoint]=cand;allocated.add(cand)\n\
        \   options.append({'slot':slot,'original_pair':list(before),'replacement_key':cand,'replaced_key':b['player_keys'][endpoint],\
        \ 'new_pair':sorted(keys[:2]), 'full_ballot_fv_spread_ratio':round(ratio,4),'replacement_same_position_observations':obs,'replacement_max_fixed_universe_voter_deletion_fv_move':sensitivity,'source_verified_under_strict_2026_snapshot':True})\n\
        \  else:\n   unresolved.append({'slot':slot,'original_pair':list(before),'reason':'NO_SOURCE_CLEAN_SAME_POSITION_REPLACEMENT_WITHIN_1_30_FV_SPREAD'})\n\
        \ revised.append({'slot':slot,'audit_pair_position':position,'player_keys':keys,'research_only':True,'original_slot':slot,'replacement_suggested':slot\
        \ in {v['slot'] for v in options}})\n\nunique_pairs=len({tuple(sorted(b['player_keys'][:2])) for b in revised})\n\
        assert unique_pairs==16+len(options), 'STOP proposed replacements should each remove one duplicate'\nassert len(revised)==28\
        \ and set(x['slot'] for x in revised)==set(range(1,29))\ncounts=collections.Counter(k for b in revised for k in b['player_keys'])\n\
        assert max(counts.values())<=2 and not any(k in counts for k in ('joe mixon','aaron donald'))\nfor b in revised:\n\
        \ pos=b['audit_pair_position'];keys=b['player_keys']\n assert len(keys)==len(set(keys))==3\n assert model[keys[0]]['pos']==model[keys[1]]['pos']==pos\n\
        \ assert model[keys[2]]['pos']!=pos\n v=[model[k]['value'] for k in keys]\n assert max(v)/min(v)<=1.30\n\n# V7 discrepancies\
        \ reflect multiple types of evidence. The reports deliberately\n# do not automatically reclassify any player's source\
        \ position or team.\nflagged={}\nfor row in review:\n for p in row['players']:\n  if p['review_flags']:\n   flagged[p['name']]={'model_pos':p['model_pos'],'model_team':p['model_team'],'flags':p['review_flags'],'review_required':True}\n\
        assert len(flagged)==18\nalias_disagreements=[]\nsource_team_hold=[]\nsource_position_hold=[]\nname_unresolved=[]\n\
        for k,p in sorted(flagged.items()):\n flags=p['flags']\n if 'crosswalk_name_unresolved' in flags:name_unresolved.append(k)\n\
        \ if any('position' in s and 'disagrees' in s for s in flags):source_position_hold.append(k)\n if any('team' in s\
        \ and 'disagrees' in s for s in flags):\n  xr=next(x for b in review for x in b['players'] if x['name']==k)\n  if\
        \ all(team(a.get('sleeper_team'))==team(p['model_team']) for a in xr.get('source_crosswalk',[])) and all(team(a.get('fp_team'))==team(p['model_team'])\
        \ for a in xr.get('source_crosswalk',[])):\n   alias_disagreements.append(k)\n  else:source_team_hold.append(k)\n\n\
        out={\n 'status':'PRE_ACTIVATION_REPLACEMENT_FEASIBILITY_RESEARCH_ONLY',\n 'publication_authorized':False,'voting_activated':False,'owner_approval':False,\n\
        \ 'same_position_enough_data_threshold_selected':False,\n 'source_after_daily_cap_sha256':v6['source_after_daily_cap_sha256'],\n\
        \ 'inputs':{'V6_original_catalog':REQUIRED['v6'],'V7_identity_review':REQUIRED['v7'],'V3_cohort':REQUIRED['v3'],'V5_full_voter_LOO':REQUIRED['v5']},\n\
        \ 'original_pairs_distinct':16,'repeated_pair_exposures':12,\n 'strict_verified_alternative_player_pool':len(pool),\n\
        \ 'suggested_replacements':len(options),'unresolved_repeated_pair_slots':len(unresolved),\n 'new_unique_same_position_pairs':unique_pairs,\n\
        \ 'original_distinct_players':56,'candidate_distinct_players':len(counts),\n 'original_flagged_players':18,'flags_uncleared_by_source_discovery':True,\n\
        \ 'source_classification':{'team_alias_only_names':alias_disagreements,'team_conflict_hold_names':source_team_hold,'position_conflict_hold_names':source_position_hold,'name_unresolved_names':name_unresolved},\n\
        \ 'suggested_replacements_per_slot':options,'unresolved_slots':unresolved,\n}\n(OUTPUT/'RESEARCH_ONLY_replacement_feasibility_summary.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\\\
        n')\n(OUTPUT/'RESEARCH_ONLY_28_slot_candidate_NOT_APPROVED.json').write_text(json.dumps({'status':out['status'],'research_only':True,'voting_activated':False,'source_after_daily_cap_sha256':v6['source_after_daily_cap_sha256'],'catalog':revised},sort_keys=True,indent=2)+'\\\
        n')\nreport=[\n '# QF11 V8 — Source-aware KTC catalog feasibility (research only)',\n '', '**NOT APPROVED. DO NOT\
        \ DISTRIBUTE. NO VOTING ACTIVATED.**',\n '',f'- Original same-position distinct pairs: 16 of 28; duplicate exposures:\
        \ 12.',\n f'- Strictly source-verified eligible replacement pool, excluding 56 existing players: {len(pool)}.',\n\
        \ f'- Replacement suggestions within 1.30x FV spread: {len(options)}; unresolved: {len(unresolved)}.',\n f'- Candidate\
        \ unique pairs: {unique_pairs}/28; distinct players: {len(counts)}.',\n f'- Original players with identity/team/position\
        \ flags: 18, **none automatically cleared**.',\n '- Player source metadata is an identity/eligibility signal, not\
        \ a new valuation or authority for an IDP position change.',\n '- Team normalization JAC↔JAX is a code-alias diagnostic;\
        \ it does not resolve actual player-team movement.',\n '- FV spread <=1.30 is only matchup-comparability screening,\
        \ NOT approved data sufficiency or stable Market ranking.',\n '- New replacement keys are drawn from the same 504-player\
        \ market universe with exact active source ID/position/team confirmation.',\n '- Same cohort matches immutable archived\
        \ V3/V5, but the historical published October 7 market remains a different cohort.',\n '', '## Unresolved source review',\n\
        \ f'- Model/provider team conflict: {\", \".join(source_team_hold) or \"none\"}.',\n f'- Position convention conflict:\
        \ {\", \".join(source_position_hold) or \"none\"}.',\n f'- Missing exact-name crosswalk: {\", \".join(name_unresolved)\
        \ or \"none\"}.',\n f'- Code-only team alias: {\", \".join(alias_disagreements) or \"none\"}.',\n '', '## Suggested\
        \ replacements (not voter-ready)',\n]\nfor r in options:\n report.append(f'- Slot {r[\"slot\"]:02d}: replace {r[\"\
        replaced_key\"]} with {r[\"replacement_key\"]}; '+\n      f'pair {\" / \".join(r[\"new_pair\"])}; triplet FV spread\
        \ {r[\"full_ballot_fv_spread_ratio\"]:.3f}x; '+\n      f'prior same-position comparisons {r[\"replacement_same_position_observations\"\
        ]}.')\nreport += ['','## Unresolved duplicate pairs']\nreport.extend(f'- Slot {r[\"slot\"]:02d}: {r[\"reason\"]}'\
        \ for r in unresolved)\nreport+=['','## Decision','No catalog activation or Market Value refresh. Every new proposed\
        \ substitution needs realism/source review and owner approval.']\n(OUTPUT/'RESEARCH_ONLY_manual_review_notes.md').write_text('\\\
        n'.join(report)+'\\n')\nassert len(list(OUTPUT.iterdir()))==3\nfor p in OUTPUT.iterdir():\n t=p.read_text()\n assert\
        \ 'voter_roster_id' not in t and 'raw_ballots' not in t and 'sheet_url' not in t,'STOP privacy field exposure'\nprint('QF11_V8_FEASIBILITY_RESEARCH_GREEN\
        \ '+json.dumps({k:out[k] for k in ('strict_verified_alternative_player_pool','suggested_replacements','unresolved_repeated_pair_slots','new_unique_same_position_pairs','candidate_distinct_players','original_flagged_players')},sort_keys=True))\n\
        print('QF11_V8_SOURCE_REVIEW_HOLD '+json.dumps({k:len(v) for k,v in out['source_classification'].items()},sort_keys=True))\n\
        print('QF11_V8_OWNER_HOLD no voting activated, no value or production changes, no evidence sufficiency threshold authorized')\n\
        \nQF11_V8_PY\npython3 -m py_compile /tmp/qf11-v8-research.py\npython3 /tmp/qf11-v8-research.py\n"
    - name: Run all 14 unchanged regressions and frozen valuation/market production guards
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''QF11_V8_14_REPO_REGRESSIONS_GREEN'''
    - name: Prove zero repository writes, immutable source blobs and three research outputs
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_WRITES; exit 1; }

        [[ "$(git hash-object index.html)" == "c83e3f68d11853c072017e6bd83bb1ad085f4a3e" ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == "829445174a77ceb4bb19dfd97a725e371d18efe8"
        ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == "9d007a7f053e15dcdc0f694563ca17bc47568e5f"
        ]] || exit 1

        [[ "$(git hash-object scripts/market/build_market_value.py)" == "a015d54785ce5fcb3b9f26bae0120b82693a6bd8" ]] || exit
        1

        [[ "$(git hash-object scripts/market/ktc_pipeline.py)" == "b9612c73a91223397a4f49b384d8d86719ee8d79" ]] || exit 1

        [[ "$(git hash-object scripts/validation/snapshot_values.py)" == "1efca4c35e910a95974c1bec0b06a106196618b3" ]] ||
        exit 1

        [[ "$(git hash-object scripts/validation/repo_regression_checks.py)" == "5191e1160c966ed14401b70c86c6f63808e1265d"
        ]] || exit 1

        [[ "$(git hash-object scripts/identity_crosswalk.json)" == "3489c01c923474931f4db81e3dd338f437bfdf5f" ]] || exit 1

        [[ "$(git hash-object data/players_cache.json)" == "216242d9f87a81c4d1532cca2468c90a52918c3d" ]] || exit 1

        [[ "$(find /tmp/qf11-v8-output -maxdepth 1 -type f | wc -l)" -eq 3 ]] || exit 1

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        echo "QF11_V8_ZERO_WRITE_GREEN no ballot activation no market changes"

        python3 - <<''QF11_V8_END''

        import json

        from pathlib import Path

        d=Path(''/tmp/qf11-v8-output'')

