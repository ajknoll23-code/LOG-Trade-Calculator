name: Package Adjustment V6 Development Voting Reactivation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  reactivate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V6 state and current closed-V4 UI
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          ARCHIVE=".github/workflow-archive/completed-research/package-adjustment-v6-development-maturity-monitor.yml"
          ACTIVE=".github/workflows/package-adjustment-v6-development-maturity-monitor.yml"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          # Exact frozen V6 scientific inputs.
          test "$(git hash-object "$D/development_preregistration_v1.json")" = \
            "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/package_vote_challenges_v6.json")" = \
            "afc3f4e5a75f3599c11482361073c4bd9559e342"
          test "$(git hash-object "$D/development_catalog_v1_manifest.json")" = \
            "1e225a9f5153ea74d8aac5098d39debb9e99dc1c"
          test "$(git hash-object "$D/development_vote_release_v1.json")" = \
            "5e53ff9fdb795fff30ab6235a3a5ee969f313fd2"

          # Exact archived monitor we are restoring.
          test "$(git hash-object "$ARCHIVE")" = \
            "c615dfb41fe29fb3e2be2995df800a0467c4cda3"
          test ! -e "$ACTIVE"

          # This workflow was designed against the current closed-V4 page.
          # Abort rather than overwrite an unexpected concurrent UI change.
          test "$(git hash-object index.html)" = \
            "f1240480f5b573304a43aed1b349dc220027d241"

          grep -Fq "Package Adjustment V4 Fresh Confirmation: exact-600 evidence frozen; voting closed." index.html
          grep -Fq "const PACKAGE_VOTE_V4C1_RESEARCH_CLOSED = true;" index.html
          grep -Fq "__pkgv4c1__|" index.html

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          cfg = json.loads((d / "development_preregistration_v1.json").read_text())
          cat = json.loads((d / "package_vote_challenges_v6.json").read_text())
          man = json.loads((d / "development_catalog_v1_manifest.json").read_text())
          rel = json.loads((d / "development_vote_release_v1.json").read_text())

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert cfg["status"] == "frozen_v6_development_preregistration"
          assert cfg["frozen"] is True
          assert cfg["production_revision_must_remain"] == "v1.6-v5-size2-composition-overlay"

          stopping = cfg["development_maturity_and_stopping"]
          assert stopping["first_effective_vote_checkpoint"] == 600
          assert stopping["coverage_retry_increment"] == 100
          assert stopping["hard_cap_effective_votes"] == 800
          assert stopping["minimum_distinct_voters"] == 30
          assert stopping["minimum_effective_votes_per_cell"] == 15
          assert stopping["minimum_distinct_voters_per_cell"] == 10
          assert stopping["required_cell_count"] == 24
          assert stopping["daily_valid_vote_cap_per_voter"] == 20
          assert stopping["effective_lifetime_vote_cap_per_voter"] == 30
          assert stopping["outcome_blind_coverage_only"] is True

          assert cat["status"] == "frozen_package_adjustment_v6_development_catalog"
          assert cat["frozen"] is True
          assert cat["research_only"] is True
          assert len(cat["challenges"]) == 504
          assert len({c["research_cell"] for c in cat["challenges"]}) == 24

          assert man["catalog_sha256"] == sha256(d / "package_vote_challenges_v6.json")
          assert man["catalog_sha256"] == "f306da6cf396310be91c7e468703be8a9511dbff383508a75d81a17f7edf3a21"

          assert rel["status"] == "package_adjustment_v6_development_vote_release"
          assert rel["frozen"] is True
          assert rel["catalog_sha256"] == man["catalog_sha256"]
          assert rel["source_catalog_commit"] == "edcb76b353ff023e51d2ae31f02c8ddd3812e12a"
          assert rel["released_at_utc"] == "2026-09-15T05:13:39.413560+00:00"
          assert rel["production_revision"] == "v1.6-v5-size2-composition-overlay"
          assert rel["production_formula_changed"] is False
          assert rel["production_change_authorized"] is False

          print("PASS: frozen V6 development contract is intact.")
          PY

      - name: Verify production remains V1.6 before reactivation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Repository regressions before reactivation
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Reactivate exact frozen V6 voting blocks
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          INDEX = Path("index.html")
          SOURCE_COMMIT = "dd5a8117a89620e8beecb8fc4a1205426f46685c"

          current = INDEX.read_text(encoding="utf-8")
          historical = subprocess.check_output(
              ["git", "show", f"{SOURCE_COMMIT}:index.html"],
              text=True,
          )

          def extract(text, start_marker, end_marker, include_end=False):
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f"Missing start marker: {start_marker}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f"Missing end marker: {end_marker}")
              if include_end:
                  end += len(end_marker)
              return text[start:end], start, end

          # Replace only the package-vote constants block.
          cur_const, cur_const_start, cur_const_end = extract(
              current,
              "/* Package Adjustment V4 Fresh Confirmation: exact-600 evidence frozen; voting closed.",
              "let PACKAGE_VOTE_CHALLENGES = null;",
              include_end=False,
          )
          old_const, _, _ = extract(
              historical,
              "/* Package Adjustment V6 Development: frozen 1-vs-3 composition catalog.",
              "let PACKAGE_VOTE_CHALLENGES = null;",
              include_end=False,
          )

          if current.count(cur_const) != 1:
              raise RuntimeError("Current V4 constants block is not unique")
          patched = current[:cur_const_start] + old_const + current[cur_const_end:]

          # Replace only the package-vote function block. Everything before
          # packageVoteTodayKey() and everything from render() onward remains current.
          cur_fn, cur_fn_start, cur_fn_end = extract(
              patched,
              "function packageVoteTodayKey(){",
              "function render(){",
              include_end=False,
          )
          old_fn, _, _ = extract(
              historical,
              "function packageVoteTodayKey(){",
              "function render(){",
              include_end=False,
          )

          if patched.count(cur_fn) != 1:
              raise RuntimeError("Current package-vote function block is not unique")
          patched = patched[:cur_fn_start] + old_fn + patched[cur_fn_end:]

          required = [
              "Package Adjustment V6 Development: frozen 1-vs-3 composition catalog.",
              "package_votes_v6_development_v1_",
              "package_vote_recent_v6_development_v1",
              "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1",
              "__pkgv6__|${id}|${choice}",
              "__pkgv6_meta__|${left}",
              "__pkgv6_schema__|6",
              "f306da6cf396310be91c7e468703be8a9511dbff383508a75d81a17f7edf3a21",
              "2026-09-15T05:13:39.413560+00:00",
              "edcb76b353ff023e51d2ae31f02c8ddd3812e12a/research/package-adjustment-v6/package_vote_challenges_v6.json",
          ]
          for marker in required:
              if marker not in patched:
                  raise RuntimeError(f"Missing reactivated V6 marker: {marker}")

          forbidden = [
              "PACKAGE_VOTE_V4C1_RESEARCH_CLOSED",
              "PACKAGE_VOTE_V4C1_EXACT_CELL_SAMPLING_V1",
              "__pkgv4c1__|${id}|${choice}",
              "__pkgv4c1_meta__|${left}",
              "__pkgv4c1_schema__|1",
          ]
          for marker in forbidden:
              if marker in patched:
                  raise RuntimeError(f"Closed V4 package-vote marker remains: {marker}")

          # Preserve the original V6 validity cutoff so ballots collected during
          # the September 15 activation remain in the same preregistered study.
          if "const PACKAGE_VOTE_VALID_AFTER_UTC = '2026-09-15T05:13:39.413560+00:00';" not in patched:
              raise RuntimeError("V6 original validity cutoff was not preserved")

          INDEX.write_text(patched, encoding="utf-8")
          print("PASS: exact historical V6 voting blocks restored surgically.")
          PY

      - name: Restore V6 outcome-blind maturity monitor
        shell: bash
        run: |
          set -euo pipefail
          cp \
            .github/workflow-archive/completed-research/package-adjustment-v6-development-maturity-monitor.yml \
            .github/workflows/package-adjustment-v6-development-maturity-monitor.yml

          test "$(git hash-object .github/workflows/package-adjustment-v6-development-maturity-monitor.yml)" = \
            "c615dfb41fe29fb3e2be2995df800a0467c4cda3"

      - name: Verify reactivated V6 transport and sampling contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          ktc = Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          regression = Path("scripts/validation/repo_regression_checks.py").read_text(encoding="utf-8")

          assert "Package Adjustment V6 Development: frozen 1-vs-3 composition catalog." in html
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in html
          assert "const PACKAGE_VOTE_VALID_AFTER_UTC = '2026-09-15T05:13:39.413560+00:00';" in html
          assert "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" in html
          assert "__pkgv6__|${id}|${choice}" in html
          assert "__pkgv6_meta__|${left}" in html
          assert "__pkgv6_schema__|6" in html
          assert "doc.challenges.length !== 504" in html
          assert "cells.size !== 24" in html
          assert "n !== 21" in html

          assert '"__pkgv6__|"' in ktc
          assert '"__pkgv6__|"' in regression
          assert "check_package_sampling_contract" in regression
          assert "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" in regression

          assert "PACKAGE_VOTE_V4C1_RESEARCH_CLOSED" not in html
          assert "__pkgv4c1__|${id}|${choice}" not in html

          print("PASS: V6 vote transport and exact-cell sampling contract are active.")
          PY

      - name: Repository regressions after reactivation
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after reactivation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V6 reactivation workflow
        run: git rm .github/workflows/package-adjustment-v6-development-voting-reactivation.yml

      - name: Stage exact reactivation scope
        shell: bash
        run: |
          set -euo pipefail

          git add \
            index.html \
            .github/workflows/package-adjustment-v6-development-maturity-monitor.yml

          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              ".github/workflows/package-adjustment-v6-development-maturity-monitor.yml",
              ".github/workflows/package-adjustment-v6-development-voting-reactivation.yml",
          }

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"],
                  text=True,
              ).splitlines()
          )

          if changed != expected:
              raise RuntimeError(
                  f"Unexpected V6 reactivation scope: {sorted(changed)}"
              )

          print("PASS: exact V6 reactivation scope staged.")
          PY

      - name: Commit V6 development voting reactivation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Reactivate frozen Package Adjustment V6 development voting"
          git pull --rebase origin main

          D="research/package-adjustment-v6"

          test "$(git hash-object "$D/development_preregistration_v1.json")" = \
            "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/package_vote_challenges_v6.json")" = \
            "afc3f4e5a75f3599c11482361073c4bd9559e342"
          test "$(git hash-object "$D/development_catalog_v1_manifest.json")" = \
            "1e225a9f5153ea74d8aac5098d39debb9e99dc1c"
          test "$(git hash-object "$D/development_vote_release_v1.json")" = \
            "5e53ff9fdb795fff30ab6235a3a5ee969f313fd2"

          test "$(git hash-object .github/workflows/package-adjustment-v6-development-maturity-monitor.yml)" = \
            "c615dfb41fe29fb3e2be2995df800a0467c4cda3"
          test ! -e .github/workflows/package-adjustment-v6-development-voting-reactivation.yml

          grep -Fq "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" index.html
          grep -Fq '__pkgv6__|${id}|${choice}' index.html
          grep -Fq "2026-09-15T05:13:39.413560+00:00" index.html

          python3 scripts/validation/repo_regression_checks.py
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin main

          echo "PASS: frozen V6 development voting reactivated."
          echo "NEXT: run 'Package Adjustment V6 Development Maturity Monitor'."
          git log --oneline -1
