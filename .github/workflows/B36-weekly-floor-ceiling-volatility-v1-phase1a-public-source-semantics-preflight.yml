name: B36 Weekly Floor Ceiling Volatility V1 - Phase 1A Public Source Semantics Preflight
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SELF_WORKFLOW: B36-weekly-floor-ceiling-volatility-v1-phase1a-public-source-semantics-preflight.yml
  EXPECTED_B35_PREREG_BLOB_SHA: 7aae19e621fb991d74fef5d3ef64f491ca2ed931
  FOURFORFOUR_URL: https://www.4for4.com/nfl-dfs-floor-ceiling-projections
  YAHOO_RULES_URL: https://sports.yahoo.com/dailyfantasy/help/nfl/rules
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install source-preflight dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir   "requests>=2.32,<3"   "beautifulsoup4>=4.12,<5"
    - name: Verify exact B35 frozen prerequisite
      shell: bash
      run: |
        set -euo pipefail

        test "$(git hash-object research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase0_prereg.json)"   = "$EXPECTED_B35_PREREG_BLOB_SHA"

        python3 - <<'PY'
        import json
        from pathlib import Path

        p = Path(
            "research/weekly-floor-ceiling-volatility-v1/"
            "weekly_floor_ceiling_volatility_v1_phase0_prereg.json"
        )
        d = json.loads(p.read_text(encoding="utf-8"))

        assert d["status"] == "PREREGISTERED_SOURCE_CONTRACT_ONLY"
        assert d["outcome_association_opened"] is False
        assert d["production_change_authorized"] is False
        assert d["scope"]["scoring_lens"] == "HALF_PPR_ONLY"
        assert d["source_contract"]["primary_provider_candidate"] == "4for4"

        print("PASS: exact B35 preregistration verified.")
        PY
    - name: Snapshot production surfaces
      shell: bash
      run: |
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Fetch and classify public source semantics only
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from __future__ import annotations

        from datetime import datetime, timezone
        import hashlib
        import json
        import os
        from pathlib import Path
        import re

        import requests
        from bs4 import BeautifulSoup

        OUT = Path("research/weekly-floor-ceiling-volatility-v1")
        OUT.mkdir(parents=True, exist_ok=True)

        URL_4F4 = os.environ["FOURFORFOUR_URL"]
        URL_YAHOO = os.environ["YAHOO_RULES_URL"]

        session = requests.Session()
        session.headers.update({
            "User-Agent": (
                "Mozilla/5.0 (compatible; LOG-Trade-Calculator-Research/1.0; "
                "+source-semantics-preflight)"
            )
        })

        def fetch(url):
            r = session.get(url, timeout=30, allow_redirects=True)
            r.raise_for_status()
            raw = r.content
            text = BeautifulSoup(raw, "html.parser").get_text(" ", strip=True)
            text = re.sub(r"\s+", " ", text)
            return {
                "requested_url": url,
                "final_url": r.url,
                "status_code": r.status_code,
                "sha256": hashlib.sha256(raw).hexdigest(),
                "bytes": len(raw),
                "text": text,
            }

        def has_all(text, parts):
            low = text.lower()
            return all(p.lower() in low for p in parts)

        four = None
        yahoo = None
        errors = {}

        try:
            four = fetch(URL_4F4)
        except Exception as e:
            errors["4for4"] = f"{type(e).__name__}: {e}"

        try:
            yahoo = fetch(URL_YAHOO)
        except Exception as e:
            errors["yahoo"] = f"{type(e).__name__}: {e}"

        four_checks = {
            "page_identifies_floor_ceiling_product": False,
            "weekly_player_scope_documented": False,
            "yahoo_projection_variant_documented": False,
            "draftkings_projection_variant_documented": False,
            "fanduel_projection_variant_documented": False,
            "floor_85pct_at_least_semantics_documented": False,
            "ceiling_15pct_at_least_semantics_documented": False,
        }

        if four:
            t = four["text"]
            tl = t.lower()
            four_checks.update({
                "page_identifies_floor_ceiling_product": has_all(
                    t, ["floor", "ceiling", "projections"]
                ),
                "weekly_player_scope_documented": has_all(
                    t, ["every player", "every week"]
                ),
                "yahoo_projection_variant_documented": "yahoo" in tl,
                "draftkings_projection_variant_documented": "draftkings" in tl,
                "fanduel_projection_variant_documented": "fanduel" in tl,
                "floor_85pct_at_least_semantics_documented": (
                    "floor" in tl and "85% probability" in tl and "at least" in tl
                ),
                "ceiling_15pct_at_least_semantics_documented": (
                    "ceiling" in tl and "15% probability" in tl and "at least" in tl
                ),
            })

        yahoo_checks = {
            "nfl_scoring_page_identified": False,
            "receptions_half_point": False,
            "pass_yards_004": False,
            "pass_td_4": False,
            "interception_minus1": False,
            "rush_yards_01": False,
            "rush_td_6": False,
            "rec_yards_01": False,
            "rec_td_6": False,
            "fumble_lost_minus2": False,
            "two_point_2": False,
        }

        if yahoo:
            t = yahoo["text"].lower()
            yahoo_checks["nfl_scoring_page_identified"] = (
                "football lineup positions" in t and "scoring" in t
            )
            yahoo_checks["receptions_half_point"] = (
                "receptions" in t and re.search(r"receptions.{0,120}0\.5", t) is not None
            )
            yahoo_checks["pass_yards_004"] = (
                "passing yards" in t and re.search(r"passing yards.{0,120}0\.04", t) is not None
            )
            yahoo_checks["pass_td_4"] = (
                "passing touchdowns" in t
                and re.search(r"passing touchdowns.{0,120}\b4\b", t) is not None
            )
            yahoo_checks["interception_minus1"] = (
                "passing interceptions" in t
                and re.search(r"passing interceptions.{0,120}-1", t) is not None
            )
            yahoo_checks["rush_yards_01"] = (
                "rushing yards" in t and re.search(r"rushing yards.{0,120}0\.1", t) is not None
            )
            yahoo_checks["rush_td_6"] = (
                "rushing touchdowns" in t
                and re.search(r"rushing touchdowns.{0,120}\b6\b", t) is not None
            )
            yahoo_checks["rec_yards_01"] = (
                "receiving yards" in t
                and re.search(r"receiving yards.{0,120}0\.1", t) is not None
            )
            yahoo_checks["rec_td_6"] = (
                "receiving touchdowns" in t
                and re.search(r"receiving touchdowns.{0,120}\b6\b", t) is not None
            )
            yahoo_checks["fumble_lost_minus2"] = (
                "fumbles lost" in t and re.search(r"fumbles lost.{0,120}-2", t) is not None
            )
            yahoo_checks["two_point_2"] = (
                "two pt conversions" in t
                and re.search(r"two pt conversions.{0,120}\b2\b", t) is not None
            )

        four_core = all(four_checks.values())
        yahoo_half_ppr = yahoo_checks["receptions_half_point"]
        yahoo_core_scoring = all(yahoo_checks.values())

        if four_core and yahoo_half_ppr:
            decision = (
                "CONTINUE_TO_PRIVATE_SCHEMA_AND_SCORING_EQUIVALENCE_CHECK_YAHOO_CANDIDATE"
            )
        elif errors:
            decision = "BLOCKED_PUBLIC_DOCUMENTATION_TRANSPORT_NO_SOURCE_DECISION"
        else:
            decision = "STOP_4FOR4_SOURCE_PATH_BEFORE_OUTCOMES"

        summary = {
            "schema_version": 1,
            "study_id": "weekly-floor-ceiling-volatility-v1",
            "phase": "1A-public-semantics-preflight",
            "status": decision,
            "executed_at_utc": datetime.now(timezone.utc).isoformat(),
            "outcome_data_read": False,
            "player_level_floor_ceiling_rows_read": False,
            "production_change_authorized": False,
            "public_raw_html_committed": False,
            "source_transport_errors": errors,
            "fourforfour": {
                "url": URL_4F4,
                "transport": None if four is None else {
                    "final_url": four["final_url"],
                    "status_code": four["status_code"],
                    "sha256": four["sha256"],
                    "bytes": four["bytes"],
                },
                "checks": four_checks,
                "documented_semantics": {
                    "floor": (
                        "provider states approximately 85% probability of scoring at least "
                        "the floor"
                    ),
                    "ceiling": (
                        "provider states approximately 15% probability of scoring at least "
                        "the ceiling"
                    ),
                    "probability_semantics_frozen_as_provider_claim_not_yet_empirically_validated": True,
                },
            },
            "yahoo_dfs": {
                "url": URL_YAHOO,
                "transport": None if yahoo is None else {
                    "final_url": yahoo["final_url"],
                    "status_code": yahoo["status_code"],
                    "sha256": yahoo["sha256"],
                    "bytes": yahoo["bytes"],
                },
                "checks": yahoo_checks,
                "half_ppr_reception_scoring_verified": yahoo_half_ppr,
                "full_scoring_table_detected": yahoo_core_scoring,
            },
            "interpretation": {
                "4for4_explicit_weekly_floor_ceiling_product_exists": four_core,
                "yahoo_variant_is_half_ppr_on_receptions": yahoo_half_ppr,
                "yahoo_variant_is_exact_project_scoring_equivalent": False,
                "reason_exact_equivalence_not_claimed": (
                    "B35 froze only the HALF_PPR scoring family, not a complete target "
                    "scoring table. Private schema review must inspect the actual Yahoo "
                    "export and Phase 1B must freeze exact scoring/validation semantics "
                    "before outcomes."
                ),
                "private_schema_examined": False,
                "phase1a_final_pass_declared": False,
            },
            "next_if_continue": {
                "required_private_source": "4for4 Yahoo NFL Floor/Ceiling weekly export",
                "required_checks": [
                    "actual export contains explicit player-level floor and ceiling fields",
                    "week/snapshot timestamp is recoverable",
                    "QB/RB/WR/TE coverage is adequate",
                    "source scoring is explicitly Yahoo NFL scoring",
                    "no row-level licensed data is committed",
                ],
            },
        }

        json_path = (
            OUT
            / "weekly_floor_ceiling_volatility_v1_phase1a_public_semantics_preflight.json"
        )
        json_path.write_text(
            json.dumps(summary, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        md_lines = [
            "# Weekly Floor/Ceiling Volatility V1 — Phase 1A Public Semantics Preflight",
            "",
            f"**Decision:** `{decision}`",
            "",
            "This is not the final Phase 1A source/schema pass.",
            "",
            f"- 4for4 explicit weekly Floor/Ceiling product documented: `{four_core}`",
            (
                "- 4for4 Yahoo variant documented: "
                f"`{four_checks['yahoo_projection_variant_documented']}`"
            ),
            f"- Yahoo receptions = 0.5 points: `{yahoo_half_ppr}`",
            "- Private player-level schema examined: `False`",
            "- Final Phase 1A pass declared: `False`",
            "- Production authorized: `False`",
            "",
            (
                "Exact project-scoring equivalence is intentionally not claimed. "
                "If this preflight continues, the next step is private-schema inspection "
                "of the actual 4for4 Yahoo weekly Floor/Ceiling export."
            ),
            "Outcomes remain sealed.",
            "",
        ]

        (
            OUT
            / "weekly_floor_ceiling_volatility_v1_phase1a_public_semantics_preflight.md"
        ).write_text("\n".join(md_lines), encoding="utf-8")

        print(json.dumps({
            "decision": decision,
            "fourforfour_product_verified": four_core,
            "yahoo_half_ppr_receptions_verified": yahoo_half_ppr,
            "private_schema_examined": False,
            "outcomes_read": False,
            "production_authorized": False,
        }, indent=2))
        PY
    - name: Validate decision and scientific firewall
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        from pathlib import Path

        p = Path(
            "research/weekly-floor-ceiling-volatility-v1/"
            "weekly_floor_ceiling_volatility_v1_phase1a_public_semantics_preflight.json"
        )
        d = json.loads(p.read_text(encoding="utf-8"))

        assert d["status"] in {
            "CONTINUE_TO_PRIVATE_SCHEMA_AND_SCORING_EQUIVALENCE_CHECK_YAHOO_CANDIDATE",
            "BLOCKED_PUBLIC_DOCUMENTATION_TRANSPORT_NO_SOURCE_DECISION",
            "STOP_4FOR4_SOURCE_PATH_BEFORE_OUTCOMES",
        }
        assert d["outcome_data_read"] is False
        assert d["player_level_floor_ceiling_rows_read"] is False
        assert d["production_change_authorized"] is False
        assert d["public_raw_html_committed"] is False
        assert d["interpretation"]["private_schema_examined"] is False
        assert d["interpretation"]["phase1a_final_pass_declared"] is False
        assert d["interpretation"]["yahoo_variant_is_exact_project_scoring_equivalent"] is False

        if d["status"].startswith("CONTINUE_"):
            c = d["fourforfour"]["checks"]
            assert c["page_identifies_floor_ceiling_product"] is True
            assert c["yahoo_projection_variant_documented"] is True
            assert c["floor_85pct_at_least_semantics_documented"] is True
            assert c["ceiling_15pct_at_least_semantics_documented"] is True
            assert d["yahoo_dfs"]["half_ppr_reception_scoring_verified"] is True

        print("PASS: no final Phase 1A pass was fabricated.")
        PY

        test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
        test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
        test -z "$(git diff --name-only -- index.html free-agent-board.html)"
    - name: Run repository regression checks
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/repo_regression_checks.py
    - name: Commit B36 source-semantics preflight
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add research/weekly-floor-ceiling-volatility-v1
        git diff --cached --check
        git commit -m "Audit Weekly Floor Ceiling Volatility V1 public source semantics"
        git pull --rebase origin main
        git push origin main
    - name: Self-archive B36
      shell: bash
      run: |
        set -euo pipefail

        SRC=".github/workflows/$SELF_WORKFLOW"
        DST=".github/workflow-archive/completed-research/$SELF_WORKFLOW"

        test -f "$SRC"
        mkdir -p "$(dirname "$DST")"

        if test -e "$DST"; then
          test "$(sha256sum "$SRC" | awk '{print $1}')" =        "$(sha256sum "$DST" | awk '{print $1}')"
          rm "$SRC"
        else
          mv "$SRC" "$DST"
        fi

        git add "$SRC" "$DST"
        git diff --cached --check
        git commit -m "Archive B36 source-semantics preflight"
        git pull --rebase origin main
        git push origin main
    - name: Closeout
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        from pathlib import Path

        d = json.loads(
            Path(
                "research/weekly-floor-ceiling-volatility-v1/"
                "weekly_floor_ceiling_volatility_v1_phase1a_public_semantics_preflight.json"
            ).read_text(encoding="utf-8")
        )

        print("=== B36 COMPLETE ===")
        print("Decision:", d["status"])
        print(
            "4for4 product verified:",
            d["interpretation"]["4for4_explicit_weekly_floor_ceiling_product_exists"],
        )
        print(
            "Yahoo half-PPR reception scoring verified:",
            d["interpretation"]["yahoo_variant_is_half_ppr_on_receptions"],
        )
        print("Private schema examined: NO")
        print("Final Phase 1A pass: NO")
        print("Outcomes opened: NO")
        print("Production authorized: NO")
        PY
