# QF11 V14 research only. No voter distribution or production writes.
name: QF11 V14 - Conditional 28 Slot Global Feasibility and Owner Gate (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V14_ROOT: .
  QF11_V14_INPUT: /tmp/qf11-v14-input
  QF11_V14_OUTPUT: /tmp/qf11-v14-output
jobs:
  research:
    name: Test V13 TE redesigns with reserved held slots and identity-owner gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout immutable main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin immutable production and crosswalk inputs
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ -z "$(git status --porcelain)" ]] || { echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo QF11_V14_SOURCE_PINS_GREEN'
    - name: Download exact V13R1 Green constraint and identity evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v13-RESEARCH-ONLY-three-hold-constraint-attribution
        run-id: 38308161681
        github-token: ${{ github.token }}
        path: /tmp/qf11-v14-input/v13
    - name: Download exact V12 conditional 25-slot slate
      uses: actions/download-artifact@v4
      with:
        name: QF11-v12-RESEARCH-ONLY-conditional-priority-preservation
        run-id: 38299942270
        github-token: ${{ github.token }}
        path: /tmp/qf11-v14-input/v12
    - name: Download exact V11 priority identity decision evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v11-RESEARCH-ONLY-identity-priority-decision
        run-id: 38281366896
        github-token: ${{ github.token }}
        path: /tmp/qf11-v14-input/v11
    - name: Download exact V10 global source screen
      uses: actions/download-artifact@v4
      with:
        name: QF11-v10-RESEARCH-ONLY-global-owner-review
        run-id: 38279761923
        github-token: ${{ github.token }}
        path: /tmp/qf11-v14-input/v10
    - name: Download exact V3 same-cohort player values
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v14-input/v3
    - name: Verify protected model utility import from checkout
      shell: bash
      run: 'set -euo pipefail

        python3 -c ''from scripts.validation.snapshot_values import extract_object_body; print("QF11_V14_IMPORT_GREEN")'''
    - name: Recompute V13 choices and test conditional 26 and 28 slot global designs
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/qf11-v14-audit.py <<'QF11_V14_SCRIPT'\n#!/usr/bin/env python3\n\"\"\"Research-only\
        \ conditional joint design analysis; never issues votes or modifies model.\"\"\"\nimport collections,hashlib,json,os,re,sys\n\
        from pathlib import Path\nFIXTURE='--fixture' in sys.argv\nROOT=Path(os.getenv('QF11_V14_ROOT','.'))\nINPUT=Path(os.getenv('QF11_V14_INPUT','/mnt/data/qf11_v14_fixture/input'))\n\
        OUT=Path(os.getenv('QF11_V14_OUTPUT','/mnt/data/qf11_v14_fixture/output'))\nOUT.mkdir(parents=True,exist_ok=True)\n\
        PINS={\n 'v13_constraints':('v13/RESEARCH_ONLY_v13_constraint_diagnostics.json','546c93f4abfaaf9fcfa57e6096b85f7cf6d88b79999bff8e7a85e616d50fea3d'),\n\
        \ 'v13_identity':('v13/RESEARCH_ONLY_v13_identity_owner_matrix.json','163cfd79e33276bf1edec694c3407cb3366f9e294d5caaa9737875f6f04b0ab2'),\n\
        \ 'v12':('v12/RESEARCH_ONLY_v12_conditional_priority_slate.json','c30a9e9b5c0d8c44ac969d5f1b6e00d18b0a641be1873161b43cb79a2d52cd7c'),\n\
        \ 'v11':('v11/RESEARCH_ONLY_v11_identity_and_priority_matrix.json','3850b117dfcd5b0f0087573ffc399513f92b233de4e9960ba2e957d4c40f402a'),\n\
        \ 'v10':('v10/RESEARCH_ONLY_v10_shadow_slate.json','5d531e5ddaf97ff4aa6e2590b9b68680af56bde46f9c6b1528f9db7a2a08c62f'),\n\
        \ 'v3':('v3/PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json','19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc'),\n\
        }\nD={}\nfor key,(rel,sha) in PINS.items():\n p=INPUT/rel\n assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==sha,'STOP\
        \ SOURCE PIN '+key\n D[key]=json.loads(p.read_text())\nv13=D['v13_constraints'];v13ids=D['v13_identity'];v12=D['v12'];v11=D['v11'];v10=D['v10'];v3=D['v3']\n\
        assert v13['summary']['status']=='RESEARCH_ONLY_CONSTRAINT_ATTRIBUTION_NO_APPROVAL'\nassert v13['summary']['one_TE_retained_and_third_changed_count']==191\n\
        assert v13['summary']['original_slot11_zero_options_reproduced'] is True\nassert v13['summary']['conditional_existing_slots']==25\n\
        assert v12['summary']['v12_conditional_priority_preserving_slots']==25\nassert v12['summary']['original_unresolved_slots']==[5,11,21]\n\
        assert v12['summary']['v12_conditional_slots_without_identity_clearance']==[1,8,12,15]\nassert len(v12['slots'])==25\
        \ and len(v10['slots'])==28 and len(v3['players'])==504\nassert all(x['automatically_cleared'] is False for x in v13ids['identities'])\n\
        assert not any([v13['summary']['owner_approval'],v12['summary']['owner_approval'],v11['owner_approval'],v3['deployment_authorized']])\n\
        P=v3['players']\ndef inf(k):\n assert k in P, 'STOP MISSING FROZEN PLAYER '+k\n return P[k]\ndef ratio(names):\n vals=[inf(k)['fundamental_value']\
        \ for k in names]\n assert min(vals)>0\n return max(vals)/min(vals)\nbase={r['slot']:r['players'] for r in v12['slots']}\n\
        assert len(base)==25 and sorted(set(range(1,29))-set(base))==[5,11,21]\norig={k:v10['slots'][k-1]['original_player_keys']\
        \ for k in (5,21)}\nassert orig[5]==['byron young','will anderson','james cook']\nassert orig[21]==['jaylon carlies','jaylon\
        \ jones','isaac teslaa']\npriority={'byron young','malik willis','micah parsons','will anderson'}\nassert priority.issubset(set(k\
        \ for names in base.values() for k in names))\ndef check_slate(slots):\n count=collections.Counter(k for names in\
        \ slots.values() for k in names)\n pairs=[tuple(sorted(names[:2])) for names in slots.values()]\n if len(pairs)!=len(set(pairs))\
        \ or (count and max(count.values())>2):return False,'DUPLICATE_PAIR_OR_CAP'\n for slot,names in slots.items():\n \
        \ if len(names)!=3 or len(set(names))!=3:return False,'SHAPE'\n  if inf(names[0])['pos']!=inf(names[1])['pos'] or\
        \ inf(names[0])['pos']==inf(names[2])['pos']:return False,'POSITION'\n  if ratio(names)>1.30+1e-9:return False,'FV_SPREAD'\n\
        \ return True,'GREEN'\nok,msg=check_slate(base)\nassert ok,(msg,base)\n# Fixed 25 ballot slate is an identity-conditional\
        \ research design only.\n# Exact V13 screening: never fuzzy-associate players or silently reconcile roles.\ndef norm(x):return\
        \ re.sub(r'\\s+',' ',re.sub(r'[^a-z0-9 ]',' ',str(x or '').lower())).strip()\ndef team(x):\n x=str(x or '').upper()\n\
        \ return {'JAC':'JAX','WSH':'WAS','LA':'LAR'}.get(x,x)\nif not FIXTURE:\n from scripts.validation.snapshot_values\
        \ import extract_object_body\n C=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())\n body=extract_object_body((ROOT/'index.html').read_text(),'PLAYER_DB')\n\
        \ pattern=re.compile(r\"'([^']+)':\\{pos:'([A-Z]+)',age:\\d+,role:'[^']+',team:'([^']+)'\",re.M)\n M={k:{'pos':pos,'team':t}\
        \ for k,pos,t in pattern.findall(body)}\n assert isinstance(C,list) and len(C)>150 and len(M)>=500\nelse:\n # Local\
        \ smoke checks the exact archived 20 V13 illustrations, not full 191 recomputation.\n M={k:{'pos':v['pos'],'team':'ZZ'}\
        \ for k,v in P.items()}\n C=[{'name':k,'sleeper_id':'synthetic','fp_position':v['pos'],'sleeper_pos':v['pos'],'fp_team':'ZZ','sleeper_team':'ZZ'}\
        \ for k,v in P.items()]\nbyname=collections.defaultdict(list)\nfor r in C:\n if r.get('name'):byname[norm(r['name'])].append(r)\n\
        def strict(k):\n m=M.get(k)\n if not m or k not in P or inf(k)['pos']!=m['pos']:return False\n a=byname.get(norm(k),[])\n\
        \ if len(a)!=1:return False\n r=a[0]\n return bool(r.get('sleeper_id')) and r.get('fp_position')==m['pos'] and r.get('sleeper_pos')==m['pos']\
        \ and team(r.get('fp_team'))==team(m['team']) and team(r.get('sleeper_team'))==team(m['team'])\nocc=collections.Counter(k\
        \ for names in base.values() for k in names)\nused={tuple(sorted(names[:2])) for names in base.values()}\nstrict_tes=sorted(k\
        \ for k in P if inf(k)['pos']=='TE' and strict(k))\nstrict_thirds=sorted(k for k in P if inf(k)['pos']!='TE' and strict(k)\
        \ and k not in ('aaron donald','joe mixon'))\nassert FIXTURE or (len(strict_tes)==33 and len(strict_thirds)==280),'STOP\
        \ STRICT SOURCE SCREEN DRIFT'\noptions=[]\nfor retained in ('brock bowers','trey mcbride'):\n assert strict(retained)\n\
        \ for other in strict_tes:\n  if other in ('brock bowers','trey mcbride'):continue\n  pair=tuple(sorted([retained,other]))\n\
        \  if pair in used or occ[retained]>=2 or occ[other]>=2:continue\n  for third in strict_thirds:\n   if occ[third]>=2\
        \ or len({retained,other,third})!=3:continue\n   names=[retained,other,third]\n   if ratio(names)>1.30+1e-9:continue\n\
        \   extended={**base,11:names}\n   yes,reason=check_slate(extended)\n   assert yes,reason\n   # Reserve slots 5 and\
        \ 21 exactly as originally drafted but NOT source approved.\n   theoretical={**extended,**orig}\n   fits,reason=check_slate(theoretical)\n\
        \   options.append({'players':names,'kept_original_te':retained,'fv_ratio':round(ratio(names),6),\n     'third_position':inf(third)['pos'],'candidate_26_slot_globally_consistent':True,\n\
        \     'theoretical_28_slot_if_individual_identity_holds_cleared':fits,\n     'theoretical_failure_reason':None if\
        \ fits else reason,\n     'market_support_not_a_release_gate':{\n       'pair1_direct_ballots':inf(retained)['evidence']['direct_ballots'],\n\
        \       'pair2_direct_ballots':inf(other)['evidence']['direct_ballots'],\n       'third_direct_ballots':inf(third)['evidence']['direct_ballots']}})\n\
        options.sort(key=lambda o:(not o['theoretical_28_slot_if_individual_identity_holds_cleared'],o['fv_ratio'],o['kept_original_te'],o['players']))\n\
        if not FIXTURE:assert len(options)==191,'STOP V13 191 CANDIDATES DRIFT'\nelse:\n known={tuple(x['players']) for x\
        \ in v13['one_original_TE_retained_new_third_illustrations']}\n assert known and known.issubset({tuple(x['players'])\
        \ for x in options})\n# Descriptive, non-optimized shortlist; diversify retained original TE and cross-position role\
        \ where possible.\nselected=[];seen=set()\nfor original_te in ('brock bowers','trey mcbride'):\n for o in options:\n\
        \  if o['kept_original_te']!=original_te or not o['theoretical_28_slot_if_individual_identity_holds_cleared']:continue\n\
        \  token=(original_te,o['third_position'])\n  if token in seen:continue\n  seen.add(token);selected.append(o)\n  if\
        \ len([x for x in selected if x['kept_original_te']==original_te])>=7:break\ncounts={'baseline_conditional_slots':len(base),'full_research_pool_count':len(options),'v13_reported_full_pool':191,\n\
        \ 'can_add_slot_11_conditionally':bool(options),'conditional_26_slot_option_count':len(options),\n 'identity_dependent_theoretical_28_slot_option_count':sum(x['theoretical_28_slot_if_individual_identity_holds_cleared']\
        \ for x in options),\n 'source_held_original_slots':[5,21],'priority_source_held_existing_slots':[1,8,12,15],\n 'source_held_slots_not_approved':[5,21],\n\
        \ 'original_28_ballots_approved':False,'voting_activated':False,'owner_approval':False,\n 'market_or_fv_changed':False,'independent_voter_assignment_completed':False,\n\
        \ 'source_sha256':{k:v[1] for k,v in PINS.items()},\n 'scope_note':'Conditional geometric compatibility is not strict\
        \ source identity clearance, voter realism, stability proof or production authorization',\n 'fixture_only_not_live_source_screen':FIXTURE}\n\
        (OUT/'RESEARCH_ONLY_v14_global_conditional_summary.json').write_text(json.dumps(counts,sort_keys=True,indent=2)+'\\\
        n')\n(OUT/'RESEARCH_ONLY_v14_owner_choice_matrix.json').write_text(json.dumps({'research_only':True,\n 'all_global_26_candidates_no_owner_approval':options,\n\
        \ 'role_diversified_illustrations_not_recommendations':selected,\n 'unresolved_identity_evidence':v13ids['identities'],\n\
        \ 'original_held_slot_players':orig,\n 'requires_separate_approval_before_any_voter_release':True},sort_keys=True,indent=2)+'\\\
        n')\nnotes=['# QF11 V14 — Conditional 28-slot global feasibility / owner decision brief','',\n '**RESEARCH ONLY —\
        \ no voter deployment, no model/market changes, no identity clearance.**','',\n f\"- V12 source-bounded conditional\
        \ baseline: **25/28**; four priority-player slots still source held.\",\n f\"- Alternative TE matchup choices enumerated\
        \ under frozen V13 rules: **{len(options)}** (runner source tested: {not FIXTURE}).\",\n f\"- Conditionally addable\
        \ slot-11 options to reach **26/28**: **{len(options)}**.\",\n f\"- Choices still mechanically compatible with the\
        \ two original held slots 05 and 21, *if independently source cleared*: **{counts['identity_dependent_theoretical_28_slot_option_count']}**.\"\
        ,\n '- These are **not** 28 strictly source-cleared ballots. Slots 05/21 and priority original identities remain on\
        \ hold.',\n '- All original 25 slots remain unchanged; no valuation/scoring thresholds were selected.','',\n '## Slot\
        \ 11 owner design options (illustrations only, not selected)','',\n '| Keep original TE | Replacement TE | Cross-position\
        \ third | FV ratio | Conditional 28-fit |','|---|---|---|---:|---|']\nfor o in selected[:14]:\n p=o['players'];notes.append(f\"\
        | {p[0]} | {p[1]} | {p[2]} | {o['fv_ratio']:.3f} | {'yes' if o['theoretical_28_slot_if_individual_identity_holds_cleared']\
        \ else 'no'} |\")\nnotes+=['','## Unresolved identity / owner gates',\n '- Slot 05: Byron Young, Will Anderson, James\
        \ Cook; no suffix/position corrections authorized.',\n '- Slot 21: Jaylon Carlies and Jaylon Jones; position and stable\
        \ identity unresolved.',\n '- Other four priority holds: Will Anderson, Byron Young, Micah Parsons and Malik Willis\
        \ in slots 01/08/12/15.',\n '- Human review must decide player eligibility and ballot design, and independently review\
        \ randomized voter allocation before new surveys.',\n '- The earlier Oct 7 published Market Value source is separate;\
        \ do not backfill its provenance with this new cohort.',\n '- Original audit remains 13/20 closed.']\n(OUT/'RESEARCH_ONLY_v14_owner_review.md').write_text('\\\
        n'.join(notes)+'\\n')\nassert {p.name for p in OUT.iterdir()}=={'RESEARCH_ONLY_v14_global_conditional_summary.json','RESEARCH_ONLY_v14_owner_choice_matrix.json','RESEARCH_ONLY_v14_owner_review.md'}\n\
        print('QF11_V14_CONDITIONAL_GLOBAL_RESEARCH_GREEN '+json.dumps({k:counts[k] for k in ('baseline_conditional_slots','full_research_pool_count','conditional_26_slot_option_count','identity_dependent_theoretical_28_slot_option_count','voting_activated')},sort_keys=True))\n\
        \nQF11_V14_SCRIPT\npython3 /tmp/qf11-v14-audit.py\n"
    - name: Run all 14 frozen valuation regression groups and FA PA release selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V14_FROZEN_14_REGRESSIONS_GREEN'
    - name: Prove zero repo writes, exact protected blobs, and unresolved owner gate
      shell: bash
      run: "set -euo pipefail\n[[ \"$GITHUB_REF\" == \"refs/heads/main\" ]] || exit 1\n[[ \"$(git rev-parse HEAD)\" == \"\
        $GITHUB_SHA\" ]] || exit 1\n[[ -z \"$(git status --porcelain)\" ]] || { git status --short; echo STOP_REPO_WRITES;\
        \ exit 1; }\ncheck(){ [[ \"$(git hash-object \"$1\")\" == \"$2\" ]] || { echo \"STOP protected source drift: $1\"\
        ; exit 1; }; }\ncheck index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e\ncheck scripts/artifacts/generated/market_values.json\
        \ 829445174a77ceb4bb19dfd97a725e371d18efe8\ncheck scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f\n\
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f\ncheck data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d\n\
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8\ncheck scripts/market/ktc_pipeline.py\
        \ b9612c73a91223397a4f49b384d8d86719ee8d79\ncheck scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3\n\
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d\ncheck scripts/team_utility_projection_runtime.js\
        \ 1620edf05e56a56b4a874c71b32777a443422de5\ncheck free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa\n\
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633\npython3 - <<'QF11_V14_FINISH'\n\
        import json\nfrom pathlib import Path\np=Path('/tmp/qf11-v14-output')\nassert {x.name for x in p.iterdir()}=={\n 'RESEARCH_ONLY_v14_global_conditional_summary.json',\n\
        \ 'RESEARCH_ONLY_v14_owner_choice_matrix.json',\n 'RESEARCH_ONLY_v14_owner_review.md'}\ns=json.loads((p/'RESEARCH_ONLY_v14_global_conditional_summary.json').read_text())\n\
        assert s['baseline_conditional_slots']==25 and s['full_research_pool_count']==191\nassert s['conditional_26_slot_option_count']==191\n\
        assert s['identity_dependent_theoretical_28_slot_option_count']>=0\nassert s['owner_approval'] is False and s['voting_activated']\
        \ is False\nassert s['market_or_fv_changed'] is False and s['fixture_only_not_live_source_screen'] is False\nprint('QF11_V14_ZERO_WRITE_NO_OWNER_APPROVAL_GREEN')\n\
        QF11_V14_FINISH\n"
    - name: Archive read-only global option and owner-gate reports, 7 days
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v14-RESEARCH-ONLY-conditional-global-options
        path: /tmp/qf11-v14-output/
        retention-days: 7
        if-no-files-found: error
