          def _polish(f, selected, kind, largest_margin):
              """Keep NL25 angle selection; replace formulaic final copy with justified implications.

              No injury, roster-substitution, odds, or historical superlatives are inferred.
              """
              s = dict(selected)
              g = f['game']; a,b = g['name_a'],g['name_b']
              s['structure'] = {
                  'record versus form':'contrast','underdog path':'numbers',
                  'recent reversal':'narrative','title race':'stakes',
                  'consistency versus volatility':'numbers','leader under challenge':'stakes',
                  'strong score in defeat':'contrast','win without median':'stakes',
                  'pregame-baseline reversal':'narrative','form upset':'contrast',
                  'standings shock':'stakes','large-weekly-margin':'numbers',
                  'starter contribution':'narrative','fine margins':'numbers',
                  'surging form':'narrative','measured comparison':'contrast',
                  'measured outcome':'narrative','median divide':'contrast',
                  'verified player contribution':'narrative'
              }.get(s['angle'], 'narrative')
              s['takeaway'] = None
              s['player_note'] = None
              angle = s['angle']
              if kind == 'war':
                  w = f['window']; avga,avgb=f['ave_a'],f['ave_b']
                  leader = a if avga>=avgb else b
                  lagger = b if leader==a else a
                  if angle == 'record versus form':
                      gap=f['gap']; top=leader
                      s['headline'] = ('Unequal Records, Nearly Equal Scores' if gap < 5 else 'Records and Recent Form Point Different Ways')
                      s['lead'] = (f'{a} is {g["record_a"]}; {b} is {g["record_b"]}. '
                                   f'Yet in {w}, their weekly averages are {avga:.2f} and {avgb:.2f}.')
                      s['why'] = (f'{top} holds a {gap:.2f}-point observed edge. '
                                  + ('That is near-parity, not a meaningful separation from three games.' if gap < 5
                                     else 'The recent scoring order differs from the combined H2H-and-median record order; neither measure predicts this matchup on its own.'))
                      s['takeaway'] = ('The contrast is in the standings, not a decisive recent scoring gap.' if gap<5
                                        else 'The winner will supply a new data point in a small, conflicting sample.')
                  elif angle == 'underdog path':
                      high_low=f['high_b'] if leader==a else f['high_a']
                      lead_floor=f['low_a'] if leader==a else f['low_b']
                      overlap=high_low-lead_floor
                      s['headline'] = 'An Underdog Route Measured in Points'
                      s['lead'] = (f'{lagger} trails {leader} by {f["gap"]:.2f} points per week over {w}. '
                                   f'The three-game averages are {min(avga,avgb):.2f} and {max(avga,avgb):.2f}.')
                      if overlap>=0:
                          s['why'] = (f'The underdog’s best score was {high_low:.2f}; the other side’s low was {lead_floor:.2f}. '
                                      f'Those observed endpoints overlap by just {overlap:.2f} points.')
                          s['takeaway'] = 'There is a narrow route within the observed scores, but three games are not a win probability.'
                      else:
                          s['why'] = (f'The underdog’s best was {high_low:.2f}, still {abs(overlap):.2f} below '
                                      f'the opponent’s worst at {lead_floor:.2f}.')
                          s['takeaway'] = 'An upset would require a result outside one of these recent scoring bands.'
                  elif angle == 'recent reversal':
                      changes=[(a,f['latest_change_a'],f['latest_a']),(b,f['latest_change_b'],f['latest_b'])]
                      who,delta,score_ = max((x for x in changes if x[1] is not None),key=lambda x:abs(x[1]))
                      baseline=score_-delta
                      s['headline']='A One-Week Drop Changes the Picture' if delta<0 else 'A One-Week Jump Changes the Picture'
                      s['lead']=(f'{who} scored {score_:.2f} in Week {len(g["scores_a"])}. '
                                  f'That was {abs(delta):.2f} points {"below" if delta<0 else "above"} its prior three-week average of {baseline:.2f}.')
                      s['why']=(f'Its matchup with {b if who==a else a} now follows a pronounced single-week swing. '
                                 f'The clubs’ {w} averages differ by {f["gap"]:.2f}; that is a separate measure from the one-week change.')
                      s['takeaway']='The score is real; the cause of the swing is not established by these team totals.'
                  elif angle == 'title race':
                      top=leader; other=lagger; gap=f['gap']; topave=max(avga,avgb); otherave=min(avga,avgb)
                      s['headline']=f'No. {min(g["rank_a"],g["rank_b"])} Meets No. {max(g["rank_a"],g["rank_b"])}'
                      s['lead']=(f'{a} (provisional No. {g["rank_a"]}, {g["record_a"]}) meets '
                                 f'{b} (No. {g["rank_b"]}, {g["record_b"]}). '
                                 f'Both sit near the top of the reconstructed league table.')
                      s['why']=(f'{top} averaged {topave:.2f} across {w}, {gap:.2f} ahead of {other} at {otherave:.2f}. '
                                'The direct result adds a head-to-head win or loss; each club also faces a separate weekly median result.')
                      s['takeaway']='This is a standings confrontation with a measurable form gap, not a projected point spread.'
                  elif angle == 'consistency versus volatility':
                      steady=a if f['range_a']<f['range_b'] else b
                      wider=b if steady==a else a
                      small=min(f['range_a'],f['range_b']);large=max(f['range_a'],f['range_b'])
                      s['headline']='A Wide Scoring Band Meets a Narrower One'
                      s['lead']=(f'Over {w}, {steady} ranged {small:.2f} points from its high to its low. '
                                 f'{wider} covered {large:.2f} points across the same three games.')
                      s['why']=(f'{leader} still holds the {f["gap"]:.2f}-point weekly average advantage. '
                                'A wider observed range leaves more room for an unusually low week, but it also includes the higher ceiling.')
                      s['takeaway']='These are three-game high–low ranges, not statistical volatility estimates or forecasts.'
                  elif angle == 'leader under challenge':
                      top = a if g['rank_a']==1 else b
                      challenger=b if top==a else a
                      ta=avga if top==a else avgb;ca=avgb if top==a else avga
                      cr=g['record_a'] if top==a else g['record_b']
                      challenger_high=f['high_b'] if top==a else f['high_a']
                      s['headline']='The League Leader Gets a Scoring Test'
                      s['lead']=(f'{top} holds provisional No. 1 at {cr} and has averaged {ta:.2f} over {w}. '
                                 f'{challenger} averaged {ca:.2f}, a {abs(ta-ca):.2f}-point gap.')
                      s['why']=(f'{challenger} has reached {challenger_high:.2f} in a recent week, '
                                f'but that is still only a single observed high. The league leader’s record and scoring both provide context, not certainty.')
                      s['takeaway']='To challenge No. 1, the lower-scoring side needs a result above its recent typical output or a quieter week from the leader.'
                  else:
                      # Keep evidence-backed NL25 fallback, but remove its boilerplate question.
                      s['takeaway']='The available scores justify a comparison, not a confident forecast.'
              else:
                  sa,sb=f['score_a'],f['score_b'];w=f['week'];med=f['median'];margin=f['margin']
                  winner=a if sa>sb else b if sb>sa else None
                  loser=b if winner==a else a
                  ws=max(sa,sb);ls=min(sa,sb)
                  if angle == 'strong score in defeat':
                      s['headline']=f'{ls:.2f} Points, and Still a Loss'
                      s['lead']=(f'{loser} scored {ls:.2f}, exceeding the Week {w} league median of {med:.2f}, '
                                 f'yet lost {ws:.2f}–{ls:.2f} to {winner}.')
                      s['why']=(f'Both managers earned median wins; only {winner} gained the head-to-head win. '
                                'In a league that scores both results, a productive losing week is not a total loss.')
                      s['takeaway']='The schedule decided the head-to-head result; the median still rewarded the losing total.'
                  elif angle == 'win without median':
                      s['headline']='A Victory With Only Half the Reward'
                      s['lead']=(f'{winner} won {ws:.2f}–{ls:.2f}, but {ws:.2f} was '
                                 f'{med-ws:.2f} below the Week {w} league median.')
                      s['why']='A head-to-head win plus a median loss produces a 1–1 week, not the 2–0 outcome a higher score might have earned.'
                      s['takeaway']='The scoreboard says win; the combined-results standings record a split.'
                  elif angle == 'pregame-baseline reversal':
                      deviations=[(a,f['dev_a'],f['prior_a'],sa),(b,f['dev_b'],f['prior_b'],sb)]
                      who,delta,prior,actual=max(deviations,key=lambda x:abs(x[1]))
                      s['headline']='An Improved Score Was Not Enough' if delta>0 and who!=winner else 'The Recent Scoring Baseline Broke'
                      s['lead']=(f'{who} averaged {prior:.2f} in {f["source_pre"]}; Week {w} brought {actual:.2f}, '
                                 f'a {abs(delta):.2f}-point {"increase" if delta>0 else "decrease"}.')
                      s['why']=(f'The final was {winner} {ws:.2f}, {loser} {ls:.2f}. '
                                f'{"The improved output still left the team short." if delta>0 and who==loser else "The final diverged from the earlier three-game level."}')
                      s['takeaway']='A change in team total is verified; the player-level cause is not established.'
                  elif angle == 'form upset':
                      form_leader=a if f['prior_a']>=f['prior_b'] else b
                      s['headline']='The Recent-Form Leader Lost on the Field'
                      s['lead']=(f'{form_leader} entered Week {w} with the stronger {f["source_pre"]} scoring average: '
                                 f'{max(f["prior_a"],f["prior_b"]):.2f} to {min(f["prior_a"],f["prior_b"]):.2f}.')
                      s['why']=(f'{winner} won {ws:.2f}–{ls:.2f}, reversing that observed ordering by {margin:.2f} points. '
                                'This is a comparison to available pregame scores, not a claimed archived newsletter pick.')
                      s['takeaway']='The current result defeats the prior scoring pattern; one game does not establish a new trend.'
                  elif angle == 'standings shock':
                      mover=a if abs(g['rank_delta_a'])>=abs(g['rank_delta_b']) else b
                      delta=g['rank_delta_a'] if mover==a else g['rank_delta_b']
                      start=g['prior_rank_a'] if mover==a else g['prior_rank_b']
                      end=g['rank_a'] if mover==a else g['rank_b']
                      mover_points=sa if mover==a else sb
                      ht='loss' if mover!=winner else 'win' if winner else 'tie'
                      median_result=g['median_a'] if mover==a else g['median_b']
                      s['headline']=f'{mover} Moves {abs(delta)} Provisional Places'
                      s['lead']=(f'{mover} went from reconstructed No. {start} to No. {end} after Week {w}. '
                                 f'The {abs(delta)}-place change followed a {ht} to {winner if mover!=winner else loser}.')
                      s['why']=(f'{mover} scored {mover_points:.2f}, {"below" if mover_points<med else "above" if mover_points>med else "at"} '
                                f'the {med:.2f} league median; its median result was {median_result}. '
                                'Combined head-to-head and median results underpin the reconstructed movement.')
                      s['takeaway']='The ranking is provisional: official Sleeper tie-break order has not been verified.'
                  elif angle == 'large-weekly-margin':
                      s['headline']=(f'Week {w}’s Largest Margin' if abs(margin-largest_margin)<0.005
                                      else 'A Wide Week-Over-Week Margin')
                      s['lead']=(f'{winner} scored {ws:.2f}; {loser} had {ls:.2f}. '
                                 f'The {margin:.2f}-point margin was {"the largest of Week "+str(w)+"’s six games" if abs(margin-largest_margin)<0.005 else "a decisive Week "+str(w)+" result"}.')
                      s['why']=(f'{winner} finished {ws-med:.2f} above the {med:.2f} median, '
                                f'while {loser} finished {med-ls:.2f} below. Both ends of the distribution widened the result.')
                      s['takeaway']='This is a comparison within the six verified games, not a claim about all-time league history.'
                  else:
                      s['takeaway']='The observed outcome stands; stronger claims would require more evidence.'
              s['question'] = s['takeaway']
              s['keys'] = list(dict.fromkeys(list(s['keys']) + ['nl26_evidence_checked']))
              return s


          def _material_player(f, s, kind, retrieval):
              """Only add a starter when their scoring contribution connects to the selected story."""
              g=f['game']; a,b=g['name_a'],g['name_b']
              if kind=='war':
                  # Recent scoring contributions matter most for a concrete scoring-gap/leader discussion.
                  if s['angle'] not in ('leader under challenge','title race','starter contribution','surging form'):
                      return None
                  candidates=[]
                  for team,p,average in ((a,f.get('p_a'),f['ave_a']),(b,f.get('p_b'),f['ave_b'])):
                      if not p or not p.get('starts') or p['starts']<2:continue
                      total=float(p['total']); sample_total=average*3
                      if sample_total<=0:continue
                      share=total/sample_total
                      if total>=55 and share>=0.125:
                          candidates.append((team,p,share))
                  if not candidates:return None
                  # Prefer team central to the angle (leader or higher-scoring contender).
                  leader=a if f['ave_a']>=f['ave_b'] else b
                  team,p,share=max(candidates,key=lambda x:(x[0]==leader,x[2],float(x[1]['total'])))
                  return {'name':p['name'],'team':team,'points':f'{float(p["total"]):.2f}',
                    'period':f['window'],'contribution_share_pct':round(share*100,1),
                    'text':f'{p["name"]} scored {float(p["total"]):.2f} across {p["starts"]} verified starts for {team} ({share*100:.1f}% of its three-week points). This is completed production, not a projection.',
                    'source':f'Sleeper completed {f["window"]} starters + players_points'}
              if s['angle'] not in ('strong score in defeat','win without median','form upset','large-weekly-margin','verified player contribution'):
                  return None
              winner = a if f['score_a']>f['score_b'] else b if f['score_b']>f['score_a'] else None
              if winner is None:return None
              p = f['p_a'] if winner==a else f['p_b']
              total=f['score_a'] if winner==a else f['score_b']
              if not p or total<=0:return None
              pts=float(p['points']);share=pts/total
              # Do not add modest, tangential starter scores to force a player section.
              if pts<25 or share<0.115:return None
              return {'name':p['name'],'team':winner,'points':f'{pts:.2f}',
                'period':f'Week {f["week"]}','contribution_share_pct':round(share*100,1),
                'text':f'{p["name"]} supplied {pts:.2f} of {winner}’s {total:.2f} points ({share*100:.1f}%) as a verified Week {f["week"]} starter.',
                'source':f'Sleeper matchups/{f["week"]} starters + players_points'}



          def _nl27_voice(f, s, kind):
              """A factual comedy pass: roast box scores, not people. No invented picks, injuries or history.

              Every line below is assembled from checked public Sleeper scoring/standings facts.
              The punchline is commentary on those data, not an assertion of future outcomes.
              """
              s=dict(s)
              g=f['game']; a,b=g['name_a'],g['name_b'];angle=s['angle']
              if kind=='war':
                  window=f['window']; va,vb=f['ave_a'],f['ave_b'];gap=f['gap']
                  front=a if va>=vb else b;back=b if front==a else a
                  high=max(va,vb);low=min(va,vb)
                  if angle=='record versus form':
                      s['headline']='The Standings and the Scoreboard Need Couples Therapy'
                      s['lead']=(f'{a} carries a {g["record_a"]} combined record; {b} owns {g["record_b"]}. '
                                 f'Now for the inconvenient bit: {window} scoring averages are {va:.2f} and {vb:.2f}.')
                      s['why']=(f'{front} has the recent scoring edge by {gap:.2f} a week. '
                                'That is a three-game fact, not a reason to throw the season standings in the trash. '
                                'Still, those records are making a considerably louder argument than the most recent points.')
                      s['takeaway']=('A whole lot of record separation for only '+f'{gap:.2f}'+' recent points per week. The scoreboard brought receipts.')
                      s['joke_basis']='combined records versus verified three-week average gap'
                  elif angle=='underdog path':
                      back_high=f['high_b'] if back==b else f['high_a']
                      front_low=f['low_a'] if front==a else f['low_b']
                      overlap=back_high-front_low
                      s['headline']='The Underdog Needs More Than a Motivational Speech'
                      s['lead']=(f'{back} is chasing {front} by {gap:.2f} points per week across {window}. '
                                 f'That is {low:.2f} versus {high:.2f}; the mountain is not imaginary.')
                      if overlap>=0:
                          s['why']=(f'There is one narrow escape hatch in the evidence: {back} reached {back_high:.2f}, '
                                    f'while {front} fell to {front_low:.2f}. Their observed bands overlap by {overlap:.2f}. '
                                    'The underdog has a route; it is not exactly a six-lane highway.')
                          s['takeaway']='The upset scenario exists in the last three box scores. Nobody should mistake that for a guarantee.'
                      else:
                          s['why']=(f'In the last three games, {back} topped out at {back_high:.2f}; '
                                    f'{front} bottomed out at {front_low:.2f}. Even the best recent underdog week '
                                    f'fell {abs(overlap):.2f} short of the favorite\'s worst.')
                          s['takeaway']='The evidence gives the underdog no easy shortcut. Better bring an entirely new score.'
                      s['joke_basis']='recent average gap and overlap of observed three-game scoring bands'
                  elif angle=='recent reversal':
                      changes=[(a,f['latest_change_a'],f['latest_a']),(b,f['latest_change_b'],f['latest_b'])]
                      who,delta,latest=max((x for x in changes if x[1] is not None),key=lambda x:abs(x[1]))
                      past=latest-delta
                      s['headline']=('Last Week Filed a Formal Complaint' if delta<0 else 'Somebody Found the Turbo Button')
                      s['lead']=(f'{who} scored {latest:.2f} in Week {len(g["scores_a"])}—'
                                 f'{abs(delta):.2f} {"below" if delta<0 else "above"} its previous three-game average of {past:.2f}. '
                                 'That is quite the plot twist for one box score.')
                      s['why']=(f'{who} now draws {b if who==a else a}. The teams\' latest {window} scoring averages '
                                f'differ by {gap:.2f}. One dramatic week can shift the mood, but it cannot by itself '
                                'explain what happened or establish a new level of performance.')
                      s['takeaway']='The mood has changed. The cause is still an unsolved case, and one box score is a terrible detective.'
                      s['joke_basis']='latest score versus preceding three-game average'
                  elif angle=='title race':
                      r1=min(g['rank_a'],g['rank_b']);r2=max(g['rank_a'],g['rank_b'])
                      s['headline']=f'No. {r1} vs. No. {r2}: The Good Seats Just Got Uncomfortable'
                      s['lead']=(f'{a} and {b} meet at provisional Nos. {g["rank_a"]} and {g["rank_b"]}. '
                                 'This is the kind of matchup that makes the top of the standings look less like a throne and more like a waiting room.')
                      s['why']=(f'{front} averaged {high:.2f} over {window}; {back} averaged {low:.2f}, '
                                f'a {gap:.2f}-point weekly gap. The head-to-head result moves the combined-record race, '
                                'and both teams still have a separate median verdict to survive.')
                      s['takeaway']='Two contenders, one scoreboard, zero protection from the median. Prestige will not score a single point.'
                      s['joke_basis']='verified provisional top-three rankings and three-week scoring difference'
                  elif angle=='consistency versus volatility':
                      steady=a if f['range_a']<f['range_b'] else b;wild=b if steady==a else a
                      small=min(f['range_a'],f['range_b']);large=max(f['range_a'],f['range_b'])
                      s['headline']='A Sensible Sedan Meets a Scoring Roller Coaster'
                      s['lead']=(f'{steady} has moved {small:.2f} points from high to low over {window}. '
                                 f'{wild} has swung {large:.2f}. One scorecard needs a seat belt; the other mostly needs gas.')
                      s['why']=(f'{front} leads recent average scoring {high:.2f} to {low:.2f}, a {gap:.2f}-point advantage. '
                                'The ranges tell us how different the recent rides have been—not which team will hit a high or low next week.')
                      s['takeaway']='The big scoring swings are real. Please keep your arms inside the box score until the ride stops.'
                      s['joke_basis']='observed high-low ranges and three-week average scoring gap'
                  elif angle=='leader under challenge':
                      top=a if g['rank_a']==1 else b;other=b if top==a else a
                      tavg=va if top==a else vb;oavg=vb if top==a else va
                      r=g['record_a'] if top==a else g['record_b']
                      high_opp=f['high_b'] if top==a else f['high_a']
                      s['headline']='The Crown Is Shiny. The Scoring Gap Is Not Subtle.'
                      s['lead']=(f'{top} sits provisional No. 1 at {r}. Across {window}, '
                                 f'it averaged {tavg:.2f} while {other} averaged {oavg:.2f}. '
                                 f'That is a {abs(tavg-oavg):.2f}-point weekly difference—no need for a dramatic drumroll.')
                      s['why']=(f'{other} did reach {high_opp:.2f} in one of those three weeks. '
                                'That puts a real score on the challenger\'s resume, but it does not magically erase the leader\'s record. '
                                'A close fight needs the challenger above its usual recent pace, the leader below its own, or both.')
                      s['takeaway']='The top seed has the crown. The challenger has a calculator and some serious catching up to do.'
                      s['joke_basis']='top seed provisional record, observed recent averages and challenger peak'
                  elif angle=='surging form':
                      who=a if f.get('trend_a') is not None and (f.get('trend_a') or 0) >= (f.get('trend_b') or 0) else b
                      old=f['prior_a'] if who==a else f['prior_b'];new=va if who==a else vb
                      s['headline']='Someone Found the Gas Pedal'
                      s['lead']=(f'{who} has climbed from {old:.2f} per week in the earlier three-game block '
                                 f'to {new:.2f} over {window}. That is {new-old:.2f} more points a week. Not a subtle entrance.')
                      s['why']=(f'The opponent, {b if who==a else a}, averaged {vb if who==a else va:.2f} '
                                'over the same latest three weeks. The improvement is measurable; whether it continues is not.')
                      s['takeaway']='Three better weeks earn a raised eyebrow. A fourth earns an actual trend worth discussing.'
                      s['joke_basis']='two non-overlapping completed three-week scoring averages'
                  elif angle=='fine margins':
                      s['headline']='This Matchup Is Allergic to Separation'
                      s['lead']=(f'{a} averaged {va:.2f} across {window}. {b} averaged {vb:.2f}. '
                                 f'That {gap:.2f}-point gap is barely enough room for a victory speech.')
                      s['why']=('The recent scoring data offer a close comparison even if the full-season combined '
                                'records do not. There is no honest way to turn three weeks of near-parity into a confident pick.')
                      s['takeaway']='Save the bold predictions for somebody with a bigger scoring gap. These numbers refuse to cooperate.'
                      s['joke_basis']='three-week team averages separated by ten or fewer points'
                  elif angle=='starter contribution':
                      p=f.get('p_a') if f.get('p_a') and (not f.get('p_b') or f['p_a']['total']>=f['p_b']['total']) else f.get('p_b')
                      if p:
                          s['headline']=f'{p["name"]} Is Doing Plenty of Heavy Lifting'
                          s['lead']=(f'{p["name"]} posted {float(p["total"]):.2f} points across '
                                     f'{p["starts"]} verified starts in {window}. The math noticed.')
                          s['why']=(f'{a} and {b} have averaged {va:.2f} and {vb:.2f} over the same window. '
                                    'The starter total is a real contribution in that sample; it is not a guarantee of another big week.')
                          s['takeaway']='The player earned the spotlight. Everyone else still has to show up to the box score.'
                          s['joke_basis']='verified starter points and starts within last three completed weeks'
                  else:
                      s['headline']='The Numbers Showed Up. The Certainty Did Not.'
                      s['lead']=(f'{a} averaged {va:.2f}; {b} averaged {vb:.2f} in {window}. '
                                 f'The difference is {gap:.2f} points per week.')
                      s['why']='These are completed scores and a provisional ranking context, not hidden injury news or a predictive model.'
                      s['takeaway']='Anyone promising a lock from three box scores is selling confidence by the gallon.'
                      s['joke_basis']='verified completed team scoring averages'
              else:
                  sa,sb=f['score_a'],f['score_b'];margin=f['margin'];median=f['median'];week=f['week']
                  winner=a if sa>sb else b if sb>sa else 'neither';loser=b if winner==a else a
                  ws=max(sa,sb);ls=min(sa,sb)
                  if angle=='strong score in defeat':
                      s['headline']=f'{ls:.2f} Points and a Complimentary Loss'
                      s['lead']=(f'{loser} scored {ls:.2f}, {ls-median:.2f} above the Week {week} median, '
                                 f'and still lost to {winner} {ws:.2f}–{ls:.2f}. Imagine bringing {ls:.2f} points to a fight and getting the wrong opponent.')
                      s['why']=(f'{winner} earned the head-to-head win; both teams earned median wins. '
                                'That is the rare loss where the points did their job and the schedule took the rest of the afternoon off.')
                      s['takeaway']='A 1–1 week with a side of bad luck. The median said “nice work”; the matchup said “next.”'
                      s['joke_basis']='losing score above league median and verified head-to-head result'
                  elif angle=='win without median':
                      s['headline']='Won the Matchup. Lost the Median Argument.'
                      s['lead']=(f'{winner} beat {loser} {ws:.2f}–{ls:.2f}. Congratulations—'
                                 f'now read the fine print: {ws:.2f} finished {median-ws:.2f} below the Week {week} median.')
                      s['why']=(f'The head-to-head box score gave {winner} a win; the league median handed it a loss. '
                                'That is a 1–1 split week, not the clean 2–0 victory the final score might suggest.')
                      s['takeaway']='The trophy is real. So is the little asterisk from the median.'
                      s['joke_basis']='verified winner below weekly median and combined 1-1 outcome'
                  elif angle=='pregame-baseline reversal':
                      changes=[(a,f['dev_a'],f['prior_a'],sa),(b,f['dev_b'],f['prior_b'],sb)]
                      who,delta,prior,actual=max(changes,key=lambda x:abs(x[1]))
                      if delta>0 and who==loser:
                          s['headline']='Improvement: Confirmed. Victory: Still Denied.'
                          s['lead']=(f'{who} jumped from a {prior:.2f}-point average in {f["source_pre"]} '
                                     f'to {actual:.2f} in Week {week}, up {delta:.2f}. Better offense, same unpleasant ending.')
                      else:
                          s['headline']='The Pregame Scoring Baseline Took the Day Off'
                          s['lead']=(f'{who} scored {actual:.2f} after averaging {prior:.2f} in {f["source_pre"]}. '
                                     f'That is a {abs(delta):.2f}-point {"rise" if delta>0 else "drop"}; even the trend chart blinked.')
                      s['why']=(f'{winner} won {ws:.2f}–{ls:.2f}, a {margin:.2f}-point decision. '
                                'This is a comparison to the three weeks known before kickoff—not an invented newsletter prediction or an explanation of roster health.')
                      s['takeaway']='The scoreboard has the final word. The pregame average can file an appeal next week.'
                      s['joke_basis']='completed result versus pregame-knowable three-week mean'
                  elif angle=='form upset':
                      former=a if f['prior_a']>=f['prior_b'] else b
                      s['headline']='The Form Chart Would Like a Refund'
                      s['lead']=(f'{former} led scoring form in {f["source_pre"]}: '
                                 f'{max(f["prior_a"],f["prior_b"]):.2f} to {min(f["prior_a"],f["prior_b"]):.2f} per week. '
                                 f'Then {winner} won Week {week} {ws:.2f}–{ls:.2f}. Thanks for nothing, recent history.')
                      s['why']=(f'The {margin:.2f}-point victory ran against the three-week scoring order available before kickoff. '
                                'That is a genuine reversal of form, not evidence that anyone published a pick beforehand.')
                      s['takeaway']='The trend had a compelling opening statement. The box score cross-examined it in public.'
                      s['joke_basis']='pregame scoring-average leader lost verified H2H matchup'
                  elif angle=='standings shock':
                      mover=a if abs(g['rank_delta_a'])>=abs(g['rank_delta_b']) else b
                      shift=g['rank_delta_a'] if mover==a else g['rank_delta_b']
                      start=g['prior_rank_a'] if mover==a else g['prior_rank_b'];end=g['rank_a'] if mover==a else g['rank_b']
                      pts=sa if mover==a else sb
                      s['headline']='The Standings Just Pulled the Rug'
                      s['lead']=(f'{mover} went from provisional No. {start} to No. {end} after Week {week}—'
                                 f'{abs(shift)} places {"up" if shift>0 else "down"}. The table did not ask permission.')
                      s['why']=(f'{mover} scored {pts:.2f}, {abs(pts-median):.2f} '
                                f'{"above" if pts>median else "below" if pts<median else "at"} the Week {week} median of {median:.2f}. '
                                'Those combined head-to-head and median results drive the reconstructed movement; official tiebreak order is not confirmed.')
                      s['takeaway']='Three places in one week can make the standings feel like a trapdoor. Provisional, but painful.' if abs(shift)>=3 else 'That is a real reconstructed standings jolt, not a verified official tiebreak ranking.'
                      s['joke_basis']='reconstructed provisional standings movement and actual median result'
                  elif angle=='large-weekly-margin':
                      s['headline']=f'{margin:.2f} Points. Somebody Check the Scoreboard.'
                      s['lead']=(f'{winner} dropped {ws:.2f} on {loser}, which managed {ls:.2f}. '
                                 f'That is a {margin:.2f}-point gap—plenty of room to drive the team bus between the two scores.')
                      s['why']=(f'{winner} cleared the Week {week} median by {ws-median:.2f}; '
                                f'{loser} fell {median-ls:.2f} short. Both ends of the scoring range helped widen the gap. '
                                'This is a single verified weekly result, not an all-time league record claim.')
                      s['takeaway']='This one did not need a dramatic reenactment. The two totals already look like separate sports.'
                      s['joke_basis']='verified final winning margin and relative median positions'
                  elif angle=='median divide':
                      s['headline']='One Team Cleared the Bar. The Other Brought a Ladder.'
                      s['lead']=(f'{winner} posted {ws:.2f}, {ws-median:.2f} over the Week {week} median. '
                                 f'{loser} had {ls:.2f}, {median-ls:.2f} under. The median did not require a recount.')
                      s['why']=(f'The head-to-head margin was {margin:.2f}, and the median split the teams too. '
                                'Unlike a strong losing score, this matchup produced the same winner from both angles.')
                      s['takeaway']='The schedule and the median agreed. That does not happen to every losing manager.'
                      s['joke_basis']='opposing sides of verified weekly median and final matchup result'
                  elif angle=='verified player contribution':
                      named=[(a,f.get('p_a'),sa),(b,f.get('p_b'),sb)]
                      named=[x for x in named if x[1] and x[2]>0]
                      if named:
                          team,p,total=max(named,key=lambda x:x[1]['points'])
                          pct=float(p['points'])/total*100
                          s['headline']=f'{p["name"]} Brought the Receipts'
                          s['lead']=(f'{p["name"]} supplied {float(p["points"]):.2f} verified starter points for {team} '
                                     f'in Week {week}, {pct:.1f}% of its {total:.2f} total. Someone made sure the points counter was awake.')
                          s['why']=(f'{winner} still won the matchup {ws:.2f}–{ls:.2f}. '
                                    'That player contribution is verified, but it does not prove a different lineup would have changed the final.')
                          s['takeaway']='The individual box score gets a standing ovation. The team scoreboard still makes the rules.'
                      s['joke_basis']='verified starter contribution within completed Week score'
                  else:
                      s['headline']='The Final Score Has Entered the Chat'
                      s['lead']=(f'{winner} beat {loser} {ws:.2f}–{ls:.2f} in Week {week}. '
                                 f'The {margin:.2f}-point margin did not need creative arithmetic.')
                      s['why']=(f'Both teams entered with {f["source_pre"]} scoring averages of '
                                f'{f["prior_a"]:.2f} and {f["prior_b"]:.2f} in {a}-then-{b} order. '
                                'Those averages supply context; the final is the fact.')
                      s['takeaway']='The score does not tell us everything. It does, however, have excellent closing arguments.'
                      s['joke_basis']='verified final matchup and pregame-knowable three-week averages'
              s['tone']='brash_evidence_led_clean'
              s['punchline']=s['takeaway']
              s['keys']=list(dict.fromkeys(s['keys']+['nl27_voice_fact_lock']))
              return s

          def join_stories(facts,kind,players,retrieval=None):
              assert len(facts)==6
              candidate_groups=[pre_candidates(f) if kind=='war' else after_candidates(f) for f in facts]
              selected=allocate(candidate_groups)
              counts=Counter(x['angle'] for x in selected)
              if len(counts)<4 or max(counts.values())>2:
                  raise RuntimeError(f'NL27 editorial angle coverage failed: {dict(counts)}')
              maxmargin=max((f['margin'] for f in facts),default=0) if kind=='after' else 0
              stories=[]
              for f,c,options in zip(facts,selected,candidate_groups):
                  s=_polish(f,c,kind,maxmargin)
                  g=f['game'];s['name_a']=g['name_a'];s['name_b']=g['name_b']
                  s['stats']=make_stats(f,kind)
                  s['source']=(f'Sleeper matchup scores, {f["window"]}; reconstructed provisional rankings'
                               if kind=='war' else f'Sleeper matchups/{f["week"]} final + median; prior Weeks {f["week"]-3}–{f["week"]-1}')
                  s['player_note']=_material_player(f,s,kind,retrieval or 'not recorded')
                  s=_nl27_voice(f,s,kind)
                  s['all_candidates']=[{'angle':x['angle'],'priority':x['priority'],'keys':x['keys']} for x in options]
                  stories.append(s)
              return stories


          def render_html(heading,issue_sub,stories,logo,stamp,kind,layout_levels=None):
              layout_levels=layout_levels or {}
              cover_items=''.join(f'<div class="index-item"><b>{i:02d}</b><div><strong>{esc(s["name_a"])} / {esc(s["name_b"])}</strong><small>{esc(s["headline"])}</small></div></div>' for i,s in enumerate(stories,1))
              cover=f'''<section class="cover"><header class="masthead"><img src="{esc(logo)}" alt="Original LOG logo"><div><div class="brand">League of Ordinary Gentlemen</div><h1>{esc(heading)}</h1><div class="sub">{esc(issue_sub)}</div></div></header><div class="cover-main"><div class="eyebrow">In this issue</div><div class="cover-deck">Six games. Six receipts. The box scores brought enough attitude for everyone. No invented picks.</div>{cover_items}<div class="cover-note">Provisional standings · H2H plus median · Read-only editorial preview.</div></div></section>'''
              pages=[]
              for i,s in enumerate(stories,1):
                  stats=''.join(f'<div><span>{esc(k)}</span><b>{esc(v)}</b></div>' for k,v in s['stats'])
                  p=s.get('player_note')
                  player=(f'<div class="player"><b>Verified starter / {esc(p["period"])}</b><p>{esc(p["text"])}</p></div>' if p else '')
                  # Three genuine section structures, not the former lead/explanation/question on every card.
                  if s['structure']=='contrast':
                      body=f'<p class="lead">{esc(s["lead"])}</p><div class="contrast-note">{esc(s["why"])}</div><p class="takeaway"><b>THE RECEIPT</b> {esc(s["takeaway"])}</p>'
                  elif s['structure']=='numbers':
                      body=f'<div class="number-note"><span>NUMBERS THAT HURT</span><p>{esc(s["lead"])}</p></div><p>{esc(s["why"])}</p><p class="takeaway"><b>THE VERDICT</b> {esc(s["takeaway"])}</p>'
                  elif s['structure']=='stakes':
                      body=f'<p class="lead">{esc(s["lead"])}</p><div class="stakes-note"><b>WHY THIS MATTERS</b><p>{esc(s["why"])}</p></div><p class="takeaway">{esc(s["takeaway"])}</p>'
                  else:
                      body=f'<p class="lead">{esc(s["lead"])}</p><p>{esc(s["why"])}</p><div class="closing-line">{esc(s["takeaway"])}</div>'
                  pageclass="game-page"+(" compact" if layout_levels.get(i,0)>=1 else "")+(" tight" if layout_levels.get(i,0)>=2 else "")
                  pages.append(f'''<section class="{pageclass}"><div class="folio"><span>{i:02d} / SIX</span><span>{"WAR ROOM" if kind=="war" else "AFTERMATH"} · WEEK {issue_sub.split("Week ")[-1].split(" ·")[0]}</span></div><div class="tag">{esc(s['angle'])}</div><h2>{esc(s['headline'])}</h2><div class="teams">{esc(s['name_a'])}<span>VS.</span>{esc(s['name_b'])}</div><div class="stats">{stats}</div><div class="body {esc(s['structure'])}">{body}</div>{player}<div class="source"><b>SOURCE</b> {esc(s['source'])}; retrieved {esc(stamp)} UTC.{(' · Player: '+esc(p['source'])) if p else ''}</div></section>''')
              return '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
              @page { size:108mm 183mm; margin:8mm 8mm 12mm 8mm; @bottom-left {content:"EDITORIAL SHADOW · NOT PUBLISHED";font:7.5pt Arial;color:#657486} @bottom-right {content:"LOG · " counter(page);font:8pt Arial;color:#657486} }
              *{box-sizing:border-box} html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-wrap:anywhere}
              body{background:#F6F2E9;color:#162D44;font:11pt/1.38 Georgia,'Times New Roman',serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
              .cover{break-after:page;page-break-after:always;background:#FCF9F2}
              .masthead{background:#102C49;color:#FCF7E9;border-bottom:2.5pt solid #CC7768;display:flex;align-items:center;gap:3.5mm;padding:6mm 5mm}
              .masthead img{height:15mm;max-width:16mm;object-fit:contain;flex:none}
              .brand{font:8.2pt Arial;letter-spacing:1pt;text-transform:uppercase;color:#E6D8C8}
              h1{font:19pt/1.03 Georgia;margin:1.3mm 0 1.5mm;color:#FFF7E9}
              .sub{font:9pt Arial;color:#F2DDCA}
              .cover-main{padding:4mm 4mm 2mm}
              .eyebrow,.tag{font:bold 8.3pt Arial;letter-spacing:1.1px;text-transform:uppercase;color:#AC5C56}
              .cover-deck{font:10.5pt/1.4 Georgia;margin:2mm 0 4mm}
              .index-item{display:flex;align-items:baseline;gap:3mm;padding:1.35mm .3mm 1.35mm;border-bottom:1px solid #D8D5CE;break-inside:avoid}
              .index-item>b{font:bold 9pt Arial;color:#BA655A;min-width:5mm}
              .index-item strong{display:block;font:bold 9pt/1.2 Arial;color:#19334C}
              .index-item small{display:block;font:9pt/1.26 Georgia;color:#536878;margin-top:.4mm}
              .cover-note{font:8.3pt/1.33 Arial;color:#54667A;margin-top:2.4mm;padding:1.6mm 2mm;background:#ECEAE4;border-left:2pt solid #BA655A}
              .game-page{page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;padding:2.5mm 1.8mm 0;background:#FCF9F2}
              .game-page:last-child{page-break-after:auto;break-after:auto}
              .folio{display:flex;justify-content:space-between;font:bold 8pt/1.2 Arial;letter-spacing:.7pt;color:#9B5D55}
              .tag{margin:3mm 0 1.2mm;font-size:8.1pt}
              h2{font:15.3pt/1.1 Georgia;color:#142D46;margin:1.3mm 0 2mm}
              .teams{font:bold 9.2pt/1.28 Arial;color:#17344C;margin:1.3mm 0 2.4mm}
              .teams span{font:7.7pt Arial;color:#B26B60;padding:0 1.5mm}
              .stats{background:#E7EEF0;border-left:2pt solid #BE7164;padding:2mm 2.3mm;margin:2mm 0 3mm}
              .stats>div{display:flex;justify-content:space-between;gap:2mm;padding:.4mm 0}
              .stats span{font:7.8pt Arial;color:#586C7B}
              .stats b{font:bold 9pt Arial;text-align:right;color:#18364C}
