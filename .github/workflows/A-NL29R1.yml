          def editorial_md(title,week,stories,snapshot,kind):
              rows=[f'# {title} — Week {week} · A-NL29R1','',
                    'Status: READ-ONLY SHADOW · NOT PUBLISHED · NO ARCHIVED PREDICTIONS',
                    'Source retrieval UTC: '+snapshot['generated_at_utc'],
                    'Provisional combined H2H-and-median rankings; no verified official tie-break parity.',
                    'No player-level projections or injury/lineup counterfactuals are asserted.','']
              for i,s in enumerate(stories,1):
                  rows += [f'## {i:02d} — {s["name_a"]} vs {s["name_b"]}',
                           f'**Angle:** {s["angle"]} · **Structure:** {s["structure"]}',
                           f'### {s["headline"]}',s['lead'],'',s['why'],'',
                           f'**Editorial takeaway:** {s["takeaway"]}','']
                  p=s.get('player_note')
                  if p: rows += [f'**Verified starter:** {p["text"]}',f'**Player source:** {p["source"]}','']
                  rows += [f'**Source:** {s["source"]}; retrieved {snapshot["generated_at_utc"]} UTC.','']
              return '\n'.join(rows)


          def _norm(s):
              return ' '.join(unicodedata.normalize('NFKC',str(s)).replace('\xad','').replace('’',"'").split()).casefold()


          def _packed(s):
              return ''.join(ch for ch in unicodedata.normalize('NFKC',str(s)).casefold() if ch.isalnum())


          class _BodyText(HTMLParser):
              def __init__(self):super().__init__();self.parts=[];self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('style','script'):self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('style','script') and self.skip:self.skip-=1
              def handle_data(self,data):
                  if not self.skip:self.parts.append(data)


          def verify_pdf(path,stories,html,kind):
              import fitz
              doc=fitz.open(str(path))
              if len(doc)!=7:raise RuntimeError(f'NL27 PDF must be 7 pages: {path.name} rendered {len(doc)}')
              parsed=_BodyText();parsed.feed(html)
              page_report=[]
              pdf_all=_norm(' '.join(page.get_text(sort=True) for page in doc))
              for expected in (x['headline'] for x in stories):
                  if _packed(expected) not in _packed(pdf_all):raise RuntimeError(f'PDF lost headline: {expected}')
              for idx,page in enumerate(doc):
                  words=page.get_text('words');text=page.get_text(sort=True);norm=_norm(text)
                  if page.rect.width<300 or page.rect.width>313 or not 510<=page.rect.height<=530:
                      raise RuntimeError(f'Unexpected phone page geometry {page.rect}')
                  if len(norm)<(380 if idx==0 else 320):
                      raise RuntimeError(f'Near-empty PDF page {idx+1}: {len(norm)} characters')
                  bbox=[];minfont=100.0
                  for block in page.get_text('dict')['blocks']:
                      if 'lines' not in block:continue
                      for line in block['lines']:
                          for span in line['spans']:
                              if not span.get('text','').strip():continue
                              minfont=min(minfont,span['size'])
                              b=span['bbox'];bbox.append(b)
                              if b[0]<-0.7 or b[2]>page.rect.width+0.7 or b[1]<-0.7 or b[3]>page.rect.height+0.7:
                                  raise RuntimeError(f'Text outside PDF page {idx+1}: {span["text"][:60]!r} at {b}')
                              if span['size']<7.15:raise RuntimeError(f'Unacceptably small PDF font {span["size"]}pt on page {idx+1}')
                  if idx:
                      s=stories[idx-1]
                      required=[s['headline'],s['name_a'],s['name_b'],s['lead'],s['why'],s['takeaway'],s['source'],'SOURCE']
                      p=s.get('player_note')
                      if p:required += [p['name'],p['text'],p['source']]
                      for item in required:
                          if _packed(item) not in _packed(norm):
                              raise RuntimeError(f'Page {idx+1} missing story data {item[:88]!r}')
                      for other in stories:
                          if other is not s and _packed(other['headline']) in _packed(norm):
                              raise RuntimeError(f'Page {idx+1} contains a second matchup headline')
                  else:
                      for s in stories:
                          for item in (s['name_a'],s['name_b'],s['headline']):
                              if _packed(item) not in _packed(norm):
                                  raise RuntimeError(f'Cover missing index text {item[:50]}')
                  page_report.append({'page':idx+1,'role':'cover' if idx==0 else f'matchup_{idx:02d}',
                                      'characters':len(norm),'minimum_visible_font_pt':round(minfont,2),
                                      'text_spans':len(bbox),'verified_one_story_per_page':bool(idx)})
              for token in ('H2H_PLUS_MEDIAN_REPLAY_MATCHES_LIVE_RECORDS','historic-scale rout','all-time record',
                            'what to watch','what it means next','&lt;','&#x27;'):
                  if token.casefold() in pdf_all:raise RuntimeError(f'Leaked code or invalid rhetoric: {token}')
              if _norm(parsed.parts[0] if parsed.parts else '') == '':
                  raise RuntimeError('Empty HTML content')
              return {'pages':len(doc),'page_geometry':page_report,'html_pdf_verified':True,
                      'editorial_acceptance':'HUMAN_REVIEW_REQUIRED'}


          def overflow_story_indices(pdf,story_count):
              """Find source-only overflow pages from the numbered folio preceding each game.

              Never delete a page or suppress a citation. Increase layout density only
              for the specific overflowing game and then re-run complete PDF inspection.
              """
              import fitz
              doc=fitz.open(str(pdf))
              if len(doc)==story_count+1:return []
              if len(doc)<story_count+1:
                  raise RuntimeError('Unexpected lost PDF page; refusing to compact')
              spilled=[]
              active=None
              seen=[]
              for idx in range(1,len(doc)):
                  page_text=doc[idx].get_text(sort=True)
                  m=re.search(r'(?m)^\s*(\d{2})\s*/\s*SIX\b',page_text)
                  if m:
                      active=int(m.group(1))
                      if not 1<=active<=story_count or active in seen:
                          raise RuntimeError('Malformed or repeated matchup folio in PDF')
                      seen.append(active)
                  elif active is not None:
                      spilled.append(active)
                  else:
                      raise RuntimeError('Unattributed overflow page; refusing to compact')
              if sorted(seen)!=list(range(1,story_count+1)) or not spilled:
                  raise RuntimeError(f'Unexpected PDF pagination: {len(doc)} pages; folios {seen}')
              return sorted(set(spilled))


          def quality_report(stories,kind):
              angles=dict(Counter(s['angle'] for s in stories))
              structures=dict(Counter(s['structure'] for s in stories))
              headlines=[_norm(s['headline']) for s in stories]
              if len(set(headlines))!=6 or len(angles)<4 or max(angles.values())>2:
                  raise RuntimeError('Editorial headline/angle diversity gate failed')
              if len(structures)<3:raise RuntimeError(f'Need >=3 rhetorical structures, found {structures}')
              first=[_norm(s['lead'])[:38] for s in stories]
              ending=[_norm(s['takeaway']) for s in stories]
              assert all(s.get('joke_basis') and s.get('tone')=='brash_evidence_led_clean' for s in stories), 'Voice must be backed by observed statistics'
              if len(set(first))<5 or len(set(ending))<6:
                  raise RuntimeError('Repeated editorial leads or takeaways')
              for s in stories:
                  if not s['lead'] or not s['why'] or not s['takeaway']:
                      raise RuntimeError('Missing substantive story component')
                  if '?' in s['takeaway']:
                      raise RuntimeError('Generic closing questions are not editorial takeaways')
                  if len(s['lead'].split())>76 or len(s['why'].split())>81 or len(s['takeaway'].split())>45:
                      raise RuntimeError('Story too long for one phone page without shrinking typography')
                  if s['player_note'] and not s['player_note']['source']:
                      raise RuntimeError('Ungrounded player contribution')
              return {'unique_angles':len(angles),'angle_counts':angles,'rhetorical_structures':structures,
                      'headlines_unique':True,'lead_and_ending_duplicate_guard':True,
                      'player_notes_printed':sum(bool(s['player_note']) for s in stories),
                      'editorial_acceptance':'HUMAN_REVIEW_REQUIRED'}


