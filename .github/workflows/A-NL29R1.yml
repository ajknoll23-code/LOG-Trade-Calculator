                  f'Entering the week, the two clubs’ previous-three-week averages were {f["prior_a"]:.2f} and {f["prior_b"]:.2f}. The scoreboard now supplies one more observation, not a whole new trend.',
                  'More completed scores are needed to establish a durable change.',
                  ['final','prior_window']))
              return options


          def allocate(candidates, cap=2):
              """Global candidate assignment, not a per-card greedy headline template rotation."""
              order=sorted(range(len(candidates)),key=lambda i:(len(candidates[i]),i))
              best=[float('-inf'),None]
              def visit(n,used,chosen,points):
                  if n==len(order):
                      if points>best[0]:
                          best[0],best[1]=points,chosen.copy()
                      return
                  idx=order[n]
                  for c in sorted(candidates[idx],key=lambda x:-x['priority']):
                      if used[c['angle']]>=cap:continue
                      used[c['angle']]+=1;chosen[idx]=c
                      # Reward genuinely different leads; discourage thin fallback even if unique.
                      bonus=25 if used[c['angle']]==1 else 0
                      visit(n+1,used,chosen,points+c['priority']+bonus)
                      used[c['angle']]-=1;del chosen[idx]
              visit(0,defaultdict(int),{},0)
              if best[1] is None:
                  raise RuntimeError('No feasible editorial angle assignment')
              return [best[1][i] for i in range(len(candidates))]


          def make_stats(f,kind):
              g=f['game']
              if kind=='war':
                  return [('COMBINED RECORD',g['record_a']+' / '+g['record_b']),
                          ('3-WEEK AVG',f'{f["ave_a"]:.2f} / {f["ave_b"]:.2f}'),
                          ('PROVISIONAL RANK',f'#{g["rank_a"]} / #{g["rank_b"]}')]
              return [('FINAL',g['score_a']+' / '+g['score_b']),
                      ('WEEKLY MEDIAN',f'{f["median"]:.2f}'),
                      ('MEDIAN RESULTS',g['median_a']+' / '+g['median_b'])]


          def esc(x):return escape(str(x),quote=True)


          def fixture_load(path):
              data=json.loads(path.read_text(encoding='utf-8'))
              if len(data['war_games'])!=6 or len(data['after_games'])!=6:
                  raise RuntimeError('Invalid offline source fixture')
              return data


          # === NL28R2: evidence-first editorial polish, strict one-game-per-page PDF acceptance ===
