          WAR_WEEK: ${{ inputs.war_week }}
          AFTERMATH_WEEK: ${{ inputs.aftermath_week }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/log_nl29_editorial.py" \
            --root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/log-nl29-editorial" \
            --war-week "$WAR_WEEK" \
            --aftermath-week "$AFTERMATH_WEEK"
      - name: Independently validate factual player coverage and all 14 PDF pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'NL29_AUDIT'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'log-nl29-editorial'
          ledger=json.loads((out/'NL29R1-Editorial-Evidence-and-Decision-Ledger.json').read_text())
          players=json.loads((out/'NL29R1-Player-Provenance-and-Selection-Ledger.json').read_text())
          assert not players['fixture_test_not_live_evidence']
          assert players['mandatory_player_facts_passed']
          assert len(players['featured_stories'])==12
          assert all(x['narrative_paragraph'] in (1,2) and x['selected_player']['source_verified'] for x in players['featured_stories'])
          assert all(x['selected_player']['source_endpoint'].startswith('league/') for x in players['featured_stories'])
          assert not ledger['publication_authorized'] and not ledger['picks_archived']
          for kind in ('WarRoom','Aftermath'):
              q=ledger['quality'][kind]
              assert q['pages']==7 and q['mandatory_verified_player_facts']==6
              assert q['player_stat_in_first_two_paragraphs']
              assert q['max_player_callouts']==1
              assert q['html_pdf_verified']
              assert min(p['minimum_visible_font_pt'] for p in q['page_geometry'])>=7.15
              assert len(list(out.glob(f'*{kind}*.pdf')))==1
          assert len(list(out.glob('*.pdf')))==2
          print('PASS: NL29 live 12/12 player facts, two 7-page PDFs, no publication')
          NL29_AUDIT
      - name: Verify source checkout unchanged (read-only contract)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS: no repository writes, emails, picks archived, or production changes'
      - name: Upload shadow PDFs, full starter provenance, and editorial QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL29R1-Player-Story-Shadow-${{ github.run_id }}
          path: ${{ runner.temp }}/log-nl29-editorial/
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## A-NL29R1 — player-led factual newsletter shadow'
            echo '- A-NL28R2 frozen green baseline; changes only to reader-side editorial shadow'
            echo '- 12/12 stories must contain a named verified starter fact in the first two paragraphs'
            echo '- Primary storyline selected first, contextual player decision logged and audited'
            echo '- Voice targets: 55% Ruthless / 15% Sophisticated / 30% Roast; roast only when earned'
            echo '- One player callout per story; no category headers, fabricated injuries, roster swaps, projections or free agents'
            echo '- Both PDFs: 7 pages, cover and six full, non-overflowing matchup pages'
            echo '- Green does not mean published or approved for distribution'
          } >> "$GITHUB_STEP_SUMMARY"
