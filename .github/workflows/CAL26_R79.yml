        \ --porcelain --untracked-files=all)\"\ncat > \"$RUNNER_TEMP/CAL26_R79_engine.py\" <<'PY_R79_ENGINE'\n#!/usr/bin/env python3\n\
        \"\"\"CAL26 R78: dry-run exact native FV inversion for R77 review numbers, no release authorization.\"\"\"\nfrom __future__\
