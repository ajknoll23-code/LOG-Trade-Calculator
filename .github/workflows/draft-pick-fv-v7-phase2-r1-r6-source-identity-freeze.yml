# PREFLIGHTED: DRAFT_PICK_FV_V7_PHASE2_R1_R6_SOURCE_IDENTITY_FREEZE_V1
name: Draft Pick FV V7 - Phase 2 R1-R6 Source Identity Freeze

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      study_sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Guard exact V7 predecessor blobs and overwrite state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json"]="42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"
            ["research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_manifest_v7.json"]="d021a9573c1166618b0ded676effb96b0e0d6aca"
            ["research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json"]="e15e6d776f12784fa74c603f016e8ff7dd805311"
            ["research/draft-pick-fv-v6/r1_r4_source_identity_manifest_v6_1.json"]="256554007679f728b2e8483d16941fbb977e766d"
            ["research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py"]="a11215dcce9fccfa49b2b11095906a63b0843443"
            ["scripts/identity_crosswalk.json"]="ed34038ee0c711861616ed01219e458520c11867"
            ["index.html"]="ab60f7008a3e8dbc1a2e1eeb6904c9ccf0eb6d41"
          )
          for path in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$path")"
            test "$actual" = "${EXPECTED[$path]}" || {
              echo "ERROR: frozen Phase 2 predecessor drift: $path"
              echo "expected=${EXPECTED[$path]} actual=$actual"
              exit 1
            }
          done

          for p in \
            research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py \
            research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json \
            research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_source_catalog_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.md \
            research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json
          do
            test ! -e "$p"
          done

          python3 - <<'PY2'
          import json
          from pathlib import Path
          d=Path('research/draft-pick-fv-v7')
          p=json.loads((d/'r1_r6_full_scale_preregistration_v7.json').read_text())
          m=json.loads((d/'r1_r6_full_scale_preregistration_manifest_v7.json').read_text())
          assert p['status']=='FROZEN_PRE_V7_SOURCE_EXPANSION_PRE_OUTCOME'
          assert p['decision']=='FREEZE_V7_R1_R6_FULL_SCALE_PREREGISTRATION_SOURCE_FREEZE_NEXT'
          assert p['next_stage']=='draft-pick-fv-v7-phase2-r1-r6-source-identity-freeze'
          assert p['source_population']['development_source_gate']['minimum_full_R1_R6_leagues_per_year']==12
          assert p['source_population']['temporal_holdout_2024']['known_full_72_pick_league_n']==10
          assert p['source_population']['temporal_holdout_2024']['new_2024_search_allowed'] is False
          for k in ('candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','historical_source_expansion_performed','historical_player_outcomes_read_by_v7','holdout_2024_outcomes_read_by_v7','production_change_authorized'):
              assert m[k] is False
          print('PASS: exact V7 Phase 1 authorization state intact.')
          PY2

      - name: Freeze or reuse Phase 2 source implementation contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v7"
          J="$D/r1_r6_phase2_source_implementation_contract_v7.json"
          M="$D/r1_r6_phase2_source_implementation_contract_v7.md"
          X="$D/r1_r6_phase2_source_implementation_contract_manifest_v7.json"

          present=0
          for p in "$J" "$M" "$X"; do [ -e "$p" ] && present=$((present+1)); done
          if [ "$present" -eq 3 ]; then
            python3 - <<'PY2'
          import json
          from pathlib import Path
          d=Path('research/draft-pick-fv-v7')
          p=json.loads((d/'r1_r6_phase2_source_implementation_contract_v7.json').read_text())
          m=json.loads((d/'r1_r6_phase2_source_implementation_contract_manifest_v7.json').read_text())
          dec='FREEZE_V7_PHASE2_SOURCE_IMPLEMENTATION_CONTRACT_EXECUTION_AUTHORIZED'
          assert p['decision']==dec and m['decision']==dec
          assert p['status']=='FROZEN_PRE_PHASE2_SOURCE_SEARCH'
          assert p['scientific_contract_changed'] is False
          assert m['historical_source_search_performed'] is False
          assert m['holdout_2024_search_performed'] is False
          print('PASS: existing V7 Phase 2 source implementation contract reusable.')
          PY2
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$present" -eq 0 || { echo 'ERROR: partial Phase 2 implementation contract exists.'; exit 1; }

          python3 - <<'PY2'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          d=Path('research/draft-pick-fv-v7')
          pre=d/'r1_r6_full_scale_preregistration_v7.json'
          v6=Path('research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json')
          v6e=Path('research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py')
          fp=Path('scripts/identity_crosswalk.json')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def canon(o): return hashlib.sha256(json.dumps(o,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          generated=datetime.now(timezone.utc).isoformat(); dec='FREEZE_V7_PHASE2_SOURCE_IMPLEMENTATION_CONTRACT_EXECUTION_AUTHORIZED'
          obj={
            'schema_version':1,
            'study_id':'draft-pick-fv-v7-r1-r6-full-scale-tail-continuity',
            'stage':'phase2_source_implementation_contract',
            'status':'FROZEN_PRE_PHASE2_SOURCE_SEARCH',
            'generated_at_utc':generated,
            'decision':dec,
            'scientific_contract_changed':False,
            'historical_source_search_performed':False,
            'holdout_2024_search_performed':False,
            'historical_player_outcomes_read':False,
            'holdout_2024_outcomes_read':False,
            'candidate_fit_performed':False,
            'candidate_scores_computed':False,
            'candidate_selection_performed':False,
            'production_change_authorized':False,
            'implementation':{
              'historical_search_order':'for each 2018-2023 year, cap each frozen search term to 100 unique league IDs by SHA256(year|term|league_id), union all capped IDs with every V6 clean seed league, then probe the complete union ordered by SHA256(year|candidate|league_id); no early stopping',
              'search_transport_failure':'fatal red workflow condition; never reinterpret a failed request as an empty result',
              'missing_keeper_proxy':'keeperType missing is accepted as the frozen V6 validated historical proxy; explicit keeper/redraft/non-dynasty is rejected',
              'selected_draft_unit':'accept a single draft unit or the unique LEAGUE-type draft unit; reject ambiguous multi-unit leagues',
              'full_R1_R6_source_rule':'selected unit must expose every unique overall slot 1-72; later duplicate player selections do not remove source membership but the later duplicate occurrence is excluded and counted against retention',
              'historical_contamination_rule':'screen the selected unit slots 1-72; any explicit devy custom player or uniquely resolved NFL draft class different from target year rejects the whole league; diagnostic unknowns do not reject',
              'holdout_2024_reuse':'select exactly the ten already-frozen V6 clean leagues whose frozen selected-unit summary contains at least 72 picks; perform no 2024 leagueSearch and no replacement/substitution',
              'holdout_2024_contamination':'reuse the pre-outcome V6 clean classification; do not reselect, replace, or post-hoc contamination-filter the ten frozen leagues; only rebuild slots 1-72 and pre-outcome identity metadata',
              'identity_priority':['exact DynastyProcess MFL crosswalk','existing FantasyPros-to-Sleeper crosswalk with unique nflverse draft-class corroboration','nflverse name+position+class stable identity','unambiguous DynastyProcess name+position+class'],
              'identity_assets':'download/freeze one shared pre-search identity asset bundle in prepare; all year workers and 2024 worker use byte-identical assets',
              'minimum_outcome_ready_sleeper_coverage':0.95,
              'sleeper_ready_reason':'Sleeper historical weekly NFL stats is the frozen Phase 3 provider, so outcome-ready Sleeper mapping is an operational identity-readiness prerequisite, not an FV result',
              'weighting':'within each year and R1-R6 cell, each represented frozen league receives equal total weight and valid occurrences divide that league-cell weight; each development year targets 1/6 total macro weight',
            },
            'input_hashes':{
              pre.name:sha(pre),v6.name:sha(v6),v6e.name:sha(v6e),fp.name:sha(fp)
            },
          }
          jp=d/'r1_r6_phase2_source_implementation_contract_v7.json'; jp.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          mp=d/'r1_r6_phase2_source_implementation_contract_v7.md'; mp.write_text('\n'.join(['# Draft Pick FV V7 - Phase 2 Source Implementation Contract','',f'**Decision:** `{dec}`','','Frozen before any V7 historical source search. It resolves only operational details already required by the Phase 1 source and identity contract.','','- Historical union is exhaustive within the frozen per-term caps; no early stopping.','- Complete selected-unit slots 1-72 are required.','- Positive rookie-scope contamination anywhere in slots 1-72 rejects a historical development league.','- The ten already-frozen 2024 full-72 leagues are reused exactly; there is no new 2024 search or substitution.','- Identity assets are frozen once before source probing and shared by all workers.','- No NFL outcomes, candidate fitting, market data, or votes are read.','']))
          man={'schema_version':1,'study_id':obj['study_id'],'stage':obj['stage'],'status':obj['status'],'generated_at_utc':generated,'decision':dec,'scientific_contract_changed':False,'historical_source_search_performed':False,'holdout_2024_search_performed':False,'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,'candidate_fit_performed':False,'candidate_scores_computed':False,'candidate_selection_performed':False,'production_change_authorized':False,'contract_sha256':sha(jp),'contract_markdown_sha256':sha(mp),'canonical_contract_sha256':canon(obj)}
          (d/'r1_r6_phase2_source_implementation_contract_manifest_v7.json').write_text(json.dumps(man,indent=2,sort_keys=True)+'\n')
          print('PASS: V7 Phase 2 source implementation contract frozen before source search.')
          PY2
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Prove contract-only mutation scope
        if: steps.contract.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            "research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_manifest_v7.json"
            "research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json"
            "research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.md"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)

      - name: Run repository regression before contract freeze
        if: steps.contract.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py
          restore_tu; trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Commit source implementation contract before any source search
        if: steps.contract.outputs.created == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || { echo 'ERROR: origin/main moved before Phase 2 contract freeze.'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.md research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_manifest_v7.json
          git commit -m "Freeze Draft Pick FV V7 Phase 2 source contract"
          git push origin HEAD:main

      - name: Resolve exact Phase 2 study base
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "STUDY_SHA=$(git rev-parse HEAD)"

      - name: Write exact V7 Phase 2 engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/build_r1_r6_source_identity_v7.py" <<'PY2'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse, hashlib, importlib.util, json, math, time
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          import requests

          ROOT=Path.cwd(); V6=ROOT/'research/draft-pick-fv-v6'; V7=ROOT/'research/draft-pick-fv-v7'
          PRE=V7/'r1_r6_full_scale_preregistration_v7.json'
          PRE_MAN=V7/'r1_r6_full_scale_preregistration_manifest_v7.json'
          CONTRACT=V7/'r1_r6_phase2_source_implementation_contract_v7.json'
          CONTRACT_MAN=V7/'r1_r6_phase2_source_implementation_contract_manifest_v7.json'
          V6_SOURCE=V6/'r1_r4_source_catalog_v6_1.json'
          V6_SOURCE_MAN=V6/'r1_r4_source_identity_manifest_v6_1.json'
          V6_ENGINE=V6/'build_r1_r4_source_identity_v6_1.py'
          FP_XWALK=ROOT/'scripts/identity_crosswalk.json'
          OUT_SCRIPT=V7/'build_r1_r6_source_identity_v7.py'
          OUT_ASSET_MAN=V7/'r1_r6_identity_asset_manifest_v7.json'
          OUT_DEV=V7/'r1_r6_development_pick_identity_v7.jsonl'
          OUT_HOLD=V7/'r1_r6_holdout_2024_pick_identity_v7.jsonl'
          OUT_CAT=V7/'r1_r6_source_catalog_v7.json'
          OUT_SUM=V7/'r1_r6_source_identity_summary_v7.json'
          OUT_MD=V7/'r1_r6_source_identity_summary_v7.md'
          OUT_MAN=V7/'r1_r6_source_identity_manifest_v7.json'
          STUDY='draft-pick-fv-v7-r1-r6-full-scale-tail-continuity'
          YEARS=(2018,2019,2020,2021,2022,2023); HOLDOUT=2024
          MIN_COV=.95; MIN_DEV=12; MIN_HOLD=8; EXPECT_HOLD=10
          SEARCH_TERMS=('dynasty','superflex','super flex','2qb','2 qb','rookie','idp','devy','empire','contract','salary','taxi','fantasy','football','league')
          MAX_PER_TERM=100; CELLS=tuple(f'r{r}_{t}' for r in range(1,7) for t in ('early','mid','late'))
          DP_SHA='0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73'

          class GateError(RuntimeError): pass

          def now(): return datetime.now(timezone.utc).isoformat()
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def canon(o): return hashlib.sha256(json.dumps(o,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def writej(p,o): Path(p).write_text(json.dumps(o,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          def writejl(p,rows):
              with Path(p).open('w',encoding='utf-8') as f:
                  for x in rows: f.write(json.dumps(x,sort_keys=True,separators=(',',':'))+'\n')

          def import_v6():
              spec=importlib.util.spec_from_file_location('v6src',V6_ENGINE)
              if spec is None or spec.loader is None: raise GateError('cannot import V6 source engine')
              m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m

          V=import_v6()

          def cell_for(r,p):
              if r not in range(1,7): raise GateError(f'invalid round {r}')
              return f'r{r}_{V.tier_for_within(p)}'

          def canonical72(unit):
              if unit is None:
                  return {'slots':{},'source_missing_slots':list(range(1,73)),'invalid_occurrence_slots':list(range(1,73)),'duplicate_slots':[],'duplicate_players':[],'invalid_grid':[],'complete_unique_slot_grid':False}
              raw=[x for x in V.as_list(unit.get('draftPick')) if isinstance(x,dict)]
              slots={}; dups=[]; invalid=[]
              for i,p in enumerate(raw):
                  r=V.safe_int(p.get('round')); w=V.safe_int(p.get('pick'))
                  if r is None or w is None or r<1 or r>6 or w<1: continue
                  if w>12: invalid.append({'row_index':i,'round':r,'pick':w}); continue
                  s=(r-1)*12+w
                  if s in slots:
                      dups.append({'overall_slot':s,'first_row_index':slots[s]['raw_row_index'],'duplicate_row_index':i}); continue
                  slots[s]={'overall_slot':s,'round':r,'within_round_pick':w,'mfl_player_id':V.stable_id(p.get('player')),'franchise_id':V.stable_id(p.get('franchise') or p.get('franchise_id') or p.get('franchiseId')),'raw_row_index':i}
              source_missing=[s for s in range(1,73) if s not in slots]
              complete=not source_missing and not dups
              seen={}; dup_players=[]
              for s in sorted(slots):
                  pid=slots[s]['mfl_player_id']
                  if not pid: continue
                  if pid in seen:
                      dup_players.append({'mfl_player_id':pid,'first_slot':seen[pid],'removed_slot':s}); slots[s]['mfl_player_id']=None
                  else: seen[pid]=s
              invalid_occ=[s for s in range(1,73) if s not in slots or not slots[s].get('mfl_player_id')]
              return {'slots':slots,'source_missing_slots':source_missing,'invalid_occurrence_slots':invalid_occ,'duplicate_slots':dups,'duplicate_players':dup_players,'invalid_grid':invalid,'complete_unique_slot_grid':complete}

          def guard():
              pre=load(PRE); pm=load(PRE_MAN); c=load(CONTRACT); cm=load(CONTRACT_MAN); src=load(V6_SOURCE); sm=load(V6_SOURCE_MAN)
              assert pre['status']=='FROZEN_PRE_V7_SOURCE_EXPANSION_PRE_OUTCOME'
              assert pre['decision']=='FREEZE_V7_R1_R6_FULL_SCALE_PREREGISTRATION_SOURCE_FREEZE_NEXT'
              assert pre['next_stage']=='draft-pick-fv-v7-phase2-r1-r6-source-identity-freeze'
              for k in ('candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','historical_source_expansion_performed','historical_player_outcomes_read_by_v7','holdout_2024_outcomes_read_by_v7','production_change_authorized','year_discount_change_authorized'): assert pm[k] is False
              sp=pre['source_population']; exp=sp['development_expansion']; hold=sp['temporal_holdout_2024']
              assert tuple(exp['years'])==YEARS and tuple(exp['search_terms'])==SEARCH_TERMS and exp['max_results_per_term_per_year']==MAX_PER_TERM
              assert exp['search_must_not_read_player_outcomes'] is True and exp['after_freeze_additional_historical_search_allowed'] is False
              assert sp['development_source_gate']['minimum_full_R1_R6_leagues_per_year']==MIN_DEV
              assert hold['new_2024_search_allowed'] is False and hold['known_full_72_pick_league_n']==EXPECT_HOLD and hold['minimum_full_R1_R6_leagues']==MIN_HOLD
              for k in ('minimum_occurrence_retention','minimum_occurrence_identity_coverage','minimum_year_cell_retention','minimum_year_cell_identity_coverage','minimum_holdout_cell_retention','minimum_holdout_cell_identity_coverage'): assert pre['source_and_identity_contract'][k]==MIN_COV
              dec='FREEZE_V7_PHASE2_SOURCE_IMPLEMENTATION_CONTRACT_EXECUTION_AUTHORIZED'
              assert c['decision']==dec and cm['decision']==dec and c['scientific_contract_changed'] is False
              assert cm['historical_source_search_performed'] is False and cm['holdout_2024_search_performed'] is False
              impl=c['implementation']
              assert impl['missing_keeper_proxy']=='keeperType missing is accepted as the frozen V6 validated historical proxy; explicit keeper/redraft/non-dynasty is rejected'
              assert impl['holdout_2024_reuse']=='select exactly the ten already-frozen V6 clean leagues whose frozen selected-unit summary contains at least 72 picks; perform no 2024 leagueSearch and no replacement/substitution'
              assert impl['minimum_outcome_ready_sleeper_coverage']==MIN_COV
              assert src['status']=='FROZEN_SOURCE_IDENTITY_PASS' and src['development']['clean_league_n']==378 and src['temporal_holdout_2024']['clean_league_n']==41
              assert src['holdout_2024_outcomes_read'] is False and sm['holdout_2024_outcome_ingestion_authorized'] is False
              return pre,src

          def load_indexes(dp,nv,asset):
              a=load(asset)
              assert a['stage']=='v7_phase2_preoutcome_identity_asset_freeze'
              assert sha(dp)==a['dynastyprocess']['sha256']==DP_SHA
              assert sha(nv)==a['nflverse_players']['sha256']
              assert sha(FP_XWALK)==a['fantasypros_sleeper_crosswalk']['sha256']
              V.DP_SHA256=a['dynastyprocess']['sha256']; V.NV_SHA256=a['nflverse_players']['sha256']
              return V.load_identity_indexes(Path(dp),Path(nv),FP_XWALK),a

          def rows_for(year,lid,name,idp,origin,can,meta,idx,split):
              out=[]
              for s in range(1,73):
                  rec=can['slots'].get(s)
                  if not rec or not rec.get('mfl_player_id'): continue
                  ident=V.resolve_identity(year,rec['mfl_player_id'],meta.get(rec['mfl_player_id']),idx)
                  x={'draft_year':year,'league_id':lid,'league_name':name,'league_idp':bool(idp),'source_origin':origin,'overall_slot':s,'round':int(rec['round']),'within_round_pick':int(rec['within_round_pick']),'tier':V.tier_for_within(int(rec['within_round_pick'])),'cell':cell_for(int(rec['round']),int(rec['within_round_pick'])),'mfl_player_id':rec['mfl_player_id'],'franchise_id':rec['franchise_id'],'split':split,'source_occurrence_valid_v7':True}
                  x.update(ident); x['stable_player_key']=V.stable_player_key(ident); out.append(x)
              return out

          def diagnostics(rows,leagues,years,target):
              nlg=Counter(int(x['draft_year']) for x in leagues); repr_yc=defaultdict(set); lgc=Counter(); lgy=Counter(); repr_y=defaultdict(set)
