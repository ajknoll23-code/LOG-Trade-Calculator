              if a.selftest: selftest()
              elif a.guard: _,src=guard(); print(f'PASS: V7 Phase 2 guard; frozen_2024_full72={len(frozen_hold(src))}')
              elif a.historical_year is not None: historical(a.historical_year,Path(a.out),Path(a.dp),Path(a.nflverse),Path(a.asset_manifest))
              elif a.holdout_2024: holdout(Path(a.out),Path(a.dp),Path(a.nflverse),Path(a.asset_manifest))
              elif a.aggregate: aggregate(Path(a.partial_dir),Path(a.holdout_path),Path(a.asset_manifest))
              elif a.check: check()
              else: raise SystemExit('choose mode')

          if __name__=='__main__': main()
          PY2
          chmod +x "${RUNNER_TEMP}/build_r1_r6_source_identity_v7.py"

      - name: Preflight engine against frozen repo contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'build_r1_r6_source_identity_v7.py'
          compile(p.read_text(),str(p),'exec')
          print('PASS: V7 Phase 2 engine compiles without pyc.')
          PY2
          python3 "${RUNNER_TEMP}/build_r1_r6_source_identity_v7.py" --selftest
          python3 "${RUNNER_TEMP}/build_r1_r6_source_identity_v7.py" --guard
          python3 - <<'PY2'
          import os
          from pathlib import Path
          t=(Path(os.environ['RUNNER_TEMP'])/'build_r1_r6_source_identity_v7.py').read_text().lower()
          forbidden=['api.sleeper.app/v1/stats','/stats/nfl/','r1_r4_development_outcomes_dob_repaired','r1_r4_historical_scored_universe','prospective_trade_evidence']
          for token in forbidden: assert token not in t, token
          assert "leagueSearch".lower() in t
          assert "holdout_2024_search_performed':False".lower() in t
          print('PASS: no historical-NFL-outcome or 2024-search read path in Phase 2 engine.')
          PY2

      - name: Freeze one shared pre-search identity asset bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="${RUNNER_TEMP}/v7-phase2-assets"
          mkdir -p "$D"
          DP_URL="https://raw.githubusercontent.com/dynastyprocess/data/692c23d639542d6e9e94ba3898ed978a0b772724/files/db_playerids.csv"
          DP_SHA="0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
          curl -fL --retry 5 --retry-delay 4 "$DP_URL" -o "$D/db_playerids.csv"
          test "$(sha256sum "$D/db_playerids.csv" | awk '{print $1}')" = "$DP_SHA"

          curl -fsSL --retry 5 --retry-delay 4 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/nflverse/nflverse-data/releases/tags/players" \
            -o "$D/nflverse_release.json"

          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'v7-phase2-assets'
          obj=json.loads((d/'nflverse_release.json').read_text())
          assets=[x for x in obj.get('assets',[]) if x.get('name')=='players.csv']
          assert len(assets)==1, f'players.csv asset count={len(assets)}'
          a=assets[0]
          (d/'nflverse_asset_meta.json').write_text(json.dumps({k:a.get(k) for k in ('id','name','size','updated_at','digest','browser_download_url')},indent=2,sort_keys=True)+'\n')
          (d/'nflverse_url.txt').write_text(a['browser_download_url'])
          print(f"PASS: nflverse players asset id={a['id']} size={a['size']} digest={a.get('digest')}")
          PY2
          NV_URL="$(cat "$D/nflverse_url.txt")"
          curl -fL --retry 5 --retry-delay 4 "$NV_URL" -o "$D/nflverse_players.csv"

          python3 - <<'PY2'
          import csv, hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('.')
          d=Path(os.environ['RUNNER_TEMP'])/'v7-phase2-assets'
          meta=json.loads((d/'nflverse_asset_meta.json').read_text())
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          nv=d/'nflverse_players.csv'; dp=d/'db_playerids.csv'; fp=root/'scripts/identity_crosswalk.json'
          assert nv.stat().st_size==int(meta['size'])
          digest=meta.get('digest')
          if digest:
              assert digest.startswith('sha256:')
              assert sha(nv)==digest.split(':',1)[1]
          with dp.open(newline='',encoding='utf-8-sig') as f:
              cols=next(csv.reader(f))
          for c in ('mfl_id','gsis_id','sleeper_id','name','merge_name','position','draft_year','db_season'): assert c in cols
          with nv.open(newline='',encoding='utf-8-sig') as f:
              cols=next(csv.reader(f))
          for c in ('gsis_id','display_name','position','rookie_season'): assert c in cols
          out={
            'schema_version':1,'stage':'v7_phase2_preoutcome_identity_asset_freeze','frozen_at_utc':datetime.now(timezone.utc).isoformat(),'frozen_before_mfl_source_search':True,
            'dynastyprocess':{'url':'https://raw.githubusercontent.com/dynastyprocess/data/692c23d639542d6e9e94ba3898ed978a0b772724/files/db_playerids.csv','sha256':sha(dp)},
            'nflverse_players':{'release_tag':'players','asset_id':meta['id'],'size':meta['size'],'updated_at':meta['updated_at'],'api_digest':meta.get('digest'),'browser_download_url':meta['browser_download_url'],'sha256':sha(nv)},
            'fantasypros_sleeper_crosswalk':{'repo_path':'scripts/identity_crosswalk.json','git_blob_sha':'ed34038ee0c711861616ed01219e458520c11867','sha256':sha(fp)},
          }
          (d/'r1_r6_identity_asset_manifest_v7.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('PASS: one byte-frozen identity bundle prepared before MFL source search.')
          PY2

          cp "${RUNNER_TEMP}/build_r1_r6_source_identity_v7.py" "$D/build_r1_r6_source_identity_v7.py"

      - name: Upload engine and frozen identity assets
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-engine-assets
          path: |
            ${{ runner.temp }}/v7-phase2-assets/build_r1_r6_source_identity_v7.py
            ${{ runner.temp }}/v7-phase2-assets/db_playerids.csv
            ${{ runner.temp }}/v7-phase2-assets/nflverse_players.csv
            ${{ runner.temp }}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json
          if-no-files-found: error
          retention-days: 7

  historical:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2018, 2019, 2020, 2021, 2022, 2023]

    steps:
      - name: Check out exact Phase 2 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
      - name: Download engine and frozen identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets
      - name: Expand, contamination-screen, and freeze historical year
        shell: bash
        run: |
          set -euo pipefail
          Y="${{ matrix.year }}"; O="${RUNNER_TEMP}/historical-$Y"; mkdir -p "$O"
          python3 "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
            --historical-year "$Y" \
            --dp "${RUNNER_TEMP}/v7-phase2-assets/db_playerids.csv" \
            --nflverse "${RUNNER_TEMP}/v7-phase2-assets/nflverse_players.csv" \
            --asset-manifest "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" \
            --out "$O/year_$Y.json"
      - name: Validate historical year checkpoint
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          y=int(os.environ['YEAR']); p=Path(os.environ['RUNNER_TEMP'])/f'historical-{y}'/f'year_{y}.json'; d=json.loads(p.read_text())
          assert d['draft_year']==y
          assert d['discovery']['all_bounded_union_candidates_probed'] is True
          assert d['discovery']['early_stopping_used'] is False
          assert d['discovery']['search_errors']=={}
          assert d['historical_source_search_performed'] is True
          for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'): assert d[k] is False
          print(f"PASS: {y} checkpoint clean_full72={d['clean_full72_league_n']} count_gate={d['source_count_gate_pass']} identity_gate={d['source_identity_gate_pass']}")
          PY2
      - name: Upload historical year checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-historical-${{ matrix.year }}
          path: ${{ runner.temp }}/historical-${{ matrix.year }}/year_${{ matrix.year }}.json
          if-no-files-found: error
          retention-days: 7

  holdout_2024:
    needs: [prepare, historical]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out exact Phase 2 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
      - name: Download engine and frozen identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets
      - name: Extend only frozen 2024 full-72 cohort to R1-R6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/holdout"
          python3 "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
            --holdout-2024 \
            --dp "${RUNNER_TEMP}/v7-phase2-assets/db_playerids.csv" \
            --nflverse "${RUNNER_TEMP}/v7-phase2-assets/nflverse_players.csv" \
            --asset-manifest "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" \
            --out "${RUNNER_TEMP}/holdout/holdout_2024.json"
      - name: Validate frozen 2024 firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'holdout/holdout_2024.json').read_text())
          assert d['draft_year']==2024
          assert d['holdout_2024_search_performed'] is False
          assert d['holdout_2024_replacement_or_substitution_used'] is False
          assert d['holdout_2024_contamination_reclassification_used'] is False
          assert d['frozen_V6_full72_league_n']==10
          assert d['clean_full72_league_n']==10
          for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'): assert d[k] is False
          print(f"PASS: exact ten frozen 2024 full-72 leagues rebuilt; identity_gate={d['source_identity_gate_pass']}")
          PY2
      - name: Upload 2024 holdout checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-holdout-2024
          path: ${{ runner.temp }}/holdout/holdout_2024.json
          if-no-files-found: error
          retention-days: 7

  aggregate_and_freeze:
    needs: [prepare, historical, holdout_2024]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out exact Phase 2 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
      - name: Download engine and frozen identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets
      - name: Download historical checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: v7-phase2-historical-*
          path: ${{ runner.temp }}/v7-phase2-historical
          merge-multiple: true
      - name: Download 2024 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-holdout-2024
          path: ${{ runner.temp }}/v7-phase2-holdout
      - name: Aggregate and freeze Phase 2 source identity
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py
          cp "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json
          chmod +x research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py
          python3 research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py \
            --aggregate \
            --partial-dir "${RUNNER_TEMP}/v7-phase2-historical" \
            --holdout-path "${RUNNER_TEMP}/v7-phase2-holdout/holdout_2024.json" \
            --asset-manifest research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json
          python3 research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py --check

      - name: Prove exact research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            "research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py"
            "research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json"
            "research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl"
            "research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl"
            "research/draft-pick-fv-v7/r1_r6_source_catalog_v7.json"
            "research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json"
            "research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json"
            "research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.md"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)

      - name: Run production and repository regression
        shell: bash
        run: |
          set -euo pipefail
          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py
          restore_tu; trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Re-prove deployed Draft Pick contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          t=Path('index.html').read_text()
          expected=[
            "  1: {early:7500, mid:5854, late:5244},",
            "  2: {early:3906, mid:3624, late:3291},",
            "  3: {early:2692, mid:2682, late:2319},",
            "  4: {early:1972, mid:1831, late:1689},",
            "  5: {early:1414, mid:1250, late:1118},  // extrapolated — no KTC data",
            "  6: {early:1014, mid:853,  late:740},   // extrapolated — no KTC data",
            "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for x in expected: assert x in t, x
          print('PASS: deployed PICK_BASE/YEAR_DISCOUNT unchanged.')
          PY2

      - name: Commit frozen V7 Phase 2 artifacts
        shell: bash
        env:
          STUDY_SHA: ${{ needs.prepare.outputs.study_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STUDY_SHA" || { echo 'ERROR: origin/main moved during long Phase 2 source freeze.'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/draft-pick-fv-v7/build_r1_r6_source_identity_v7.py \
            research/draft-pick-fv-v7/r1_r6_identity_asset_manifest_v7.json \
            research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl \
            research/draft-pick-fv-v7/r1_r6_source_catalog_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json \
            research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.md
          git diff --cached --quiet && { echo 'ERROR: no Phase 2 artifacts staged.'; exit 1; }
          git commit -m "Freeze Draft Pick FV V7 Phase 2 source identity"
          git push origin HEAD:main
          echo 'PASS: V7 Phase 2 source/identity freeze committed.'
