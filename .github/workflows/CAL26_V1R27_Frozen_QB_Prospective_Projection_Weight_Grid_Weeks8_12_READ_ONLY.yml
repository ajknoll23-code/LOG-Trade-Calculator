# CAL26 V1R27 — read only. Future QB production-ranking experiment, never FV fitting.
name: CAL26 V1R27 - Frozen QB Prospective Projection Weight Grid Weeks 8-12 READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r27-prospective-freeze-readonly
  cancel-in-progress: false
jobs:
  preregister_qb_candidate_grid:
    name: Preregister 20 fixed forecast candidates for 31 real-history QBs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main read-only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm branch and no writes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download exact green V1R26 independently verified forecast audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26_v1r27_frozen_v1r26"
          gh run download 39959344906 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R26-Preseason-QB-Prospective-Evidence-Benchmark-Read-Only \
            --dir "$RUNNER_TEMP/cal26_v1r27_frozen_v1r26"
          test -s "$RUNNER_TEMP/cal26_v1r27_frozen_v1r26/CAL26_V1R26_64_QB_Forward_Benchmark_Audit.csv"
          test -s "$RUNNER_TEMP/cal26_v1r27_frozen_v1r26/CAL26_V1R26_Manifest.json"
      - name: Materialize fixed grid generator and verify mathematics
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r27_engine.py" <<'PY_CAL26_V1R27_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R27 fixed-grid prospective QB forecasting freeze, not dynasty FV repricing."""
          from __future__ import annotations
          import argparse
          import csv
          import hashlib
          import json
          import math
          from collections import Counter
          from pathlib import Path

          SOURCE_FILE = 'CAL26_V1R26_64_QB_Forward_Benchmark_Audit.csv'
          SOURCE_SHA = '8186a690a1187ea577ed39d7a4326086a3728ec57c3357949b803923e6fbd786'
          SOURCE_RUN = 39959344906
          SOURCE_ARTIFACT = 'CAL26-V1R26-Preseason-QB-Prospective-Evidence-Benchmark-Read-Only'
          FP_FRACTIONS = (0.00, 0.25, 0.50, 0.75, 1.00)
          HISTORY_FRACTIONS = (0.00, 0.25, 0.50, 0.75)
          FUTURE_HOLDOUT_WEEKS = (8, 9, 10, 11, 12)
          FUTURE_CONFIRMATION_WEEKS = (13, 14, 15, 16, 17, 18)


          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def load_csv(path: Path) -> list[dict[str, str]]:
              with path.open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))


          def as_float(x: str) -> float | None:
              if x in ('', None):
                  return None
              v = float(x)
              if not math.isfinite(v):
                  raise ValueError('Nonfinite source value')
              return v


          def validate_input(source: Path) -> list[dict[str, str]]:
              artifact = source / SOURCE_FILE
              if sha(artifact) != SOURCE_SHA:
                  raise AssertionError('V1R26 frozen source sha mismatch')
              m = json.loads((source / 'CAL26_V1R26_Manifest.json').read_text())
              if m['status'] != 'PASS_CAL26_V1R26_READ_ONLY_PRESEASON_QB_PROSPECTIVE_BENCHMARK':
                  raise AssertionError('Wrong source manifest status')
              if m['global_player_count'] != 565 or m['qb_count'] != 64 or m['correct_owner_feedback_controls'] != 24:
                  raise AssertionError('Wrong source population')
              if m['source_v1r25r1_run'] != 39890393453 or m['private_dlf_rank_data_included']:
                  raise AssertionError('Source lineage or licensing mismatch')
              if m['files'][SOURCE_FILE] != SOURCE_SHA:
                  raise AssertionError('Manifest/source digest mismatch')
              rows = load_csv(artifact)
              if len(rows) != 64 or len({r['canonical_name'] for r in rows}) != 64:
                  raise AssertionError('Not exactly 64 unique QB names')
              f = Counter(r['feedback'] for r in rows)
              if f != {'Too low': 22, 'Too high': 18, 'Correct': 24}:
                  raise AssertionError('Owner feedback count changed')
              return rows


          def source_cohort(rows: list[dict[str,str]]) -> tuple[list[dict], dict]:
              cohort, exclusions = [], Counter()
              for row in sorted(rows, key=lambda r: r['canonical_name']):
                  name = row['canonical_name']
                  fp = as_float(row['preseason_fantasypros_pts'])
                  sleeper = as_float(row['preseason_sleeper_pts'])
                  hist = as_float(row['historical_2025_component'])
                  provenance = row['history_is_real'] == 'True'
                  if fp is None or sleeper is None:
                      exclusions['missing_2026_preseason_source'] += 1
                      continue
                  if not provenance or hist is None:
                      exclusions['missing_real_historical_component'] += 1
                      continue
                  if min(fp,sleeper,hist) < 0:
                      raise AssertionError('Unexpected negative point projection')
                  cohort.append({'canonical_name': name,'preseason_fp_season_points': fp,
                                 'preseason_sleeper_season_points': sleeper,
                                 'historical_2025_season_component': hist,
                                 'history_lineage': 'real_history_with_frozen_shrinkage',
                                 'feedback_descriptive_not_used_for_fitting':row['feedback'],
                                 'preseason_projection_vintage':'frozen_before_2026_week_1',
                                 'historical_component_vintage':'frozen_before_2026_week_1',
                                 'model_fit':'False','fv_production_authorized':'False'})
              if len(cohort)!=31 or exclusions != {'missing_2026_preseason_source':31,'missing_real_historical_component':2}:
                  raise AssertionError(f'Unexpected fixed cohort/exclusions {len(cohort)} {dict(exclusions)}')
              return cohort, dict(sorted(exclusions.items()))


          def generate(rows: list[dict[str,str]]) -> tuple[list[dict], list[dict], dict]:
              cohort, excludes = source_cohort(rows)
              variants = []
              for histw in HISTORY_FRACTIONS:
                  for fpw in FP_FRACTIONS:
                      model_name = f'history_{int(histw*100):02d}_fp_{int(fpw*100):03d}_sleeper_{100-int(fpw*100):03d}'
                      vals = []
                      for player in cohort:
                          full_forward = fpw * player['preseason_fp_season_points']+(1-fpw)*player['preseason_sleeper_season_points']
                          pred = histw * player['historical_2025_season_component'] + (1-histw)*full_forward
                          vals.append({'candidate_id':model_name,'canonical_name':player['canonical_name'],
                                       'history_weight':histw,'forward_weight':1-histw,
                                       'fp_share_of_forward':fpw,'sleeper_share_of_forward':1-fpw,
                                       'preseason_frozen_season_point_index':round(pred,6),
                                       'evaluation_window':'2026_NFL_weeks_8_to_12',
                                       'future_outcome_used_for_fitting':'False',
                                       'dynasty_rank_or_owner_target_used_for_fitting':'False',
                                       'production_deploy_authorized':'False'})
                      vals.sort(key=lambda p:(-p['preseason_frozen_season_point_index'],p['canonical_name']))
                      for i,v in enumerate(vals,1):v['candidate_rank_in_fixed_cohort']=i
                      variants.extend(vals)
              if len(variants)!=620 or len({v['candidate_id'] for v in variants})!=20:
                  raise AssertionError('Candidate grid drift')
              return cohort, variants, excludes


          def to_csv(path: Path, rows: list[dict]) -> None:
              with path.open('w',newline='',encoding='utf-8') as f:
                  writer = csv.DictWriter(f,fieldnames=list(rows[0]));writer.writeheader();writer.writerows(rows)


          def selftest() -> None:
              # A mathematical separation proof: player feedback and W1-6 outcomes cannot enter predictions.
              toy = [{'canonical_name':f'qb-{i:02d}', 'preseason_fantasypros_pts':str(250+i),
                      'preseason_sleeper_pts':str(265+i*2), 'historical_2025_component':str(200+i),
                      'history_is_real':'True', 'feedback':'Correct', 'actual_w1_to_w6_ppg':str(i)} for i in range(31)]
              # Verify deterministic weighted arithmetic independently from production generator.
              fp,sl,h=300.0,200.0,150.0
              for hw in HISTORY_FRACTIONS:
                  for fw in FP_FRACTIONS:
                      p=hw*h+(1-hw)*(fw*fp+(1-fw)*sl)
                      assert 150 <= p <= 300
              for src in toy:
                  src['feedback']='Too high'
                  src['actual_w1_to_w6_ppg']='999999'
              # Strict date windows are defined before evaluation; no Weeks 1-7 outcomes loaded.
              assert FUTURE_HOLDOUT_WEEKS == tuple(range(8,13))
              assert len(HISTORY_FRACTIONS)*len(FP_FRACTIONS)==20
              print('PASS V1R27 forward weighting arithmetic and future holdout policy')


          def main(source: Path,out: Path) -> None:
              rows = validate_input(source)
              cohort, candidates, exclusions = generate(rows)
              out.mkdir(parents=True,exist_ok=True)
              a='CAL26_V1R27_31_QB_Preseason_Independent_Source_Cohort.csv'
              b='CAL26_V1R27_20_Candidates_620_Frozen_QB_Scores.csv'
              c='CAL26_V1R27_Prospective_Freeze_and_Selection_Protocol.md'
              to_csv(out/a,cohort);to_csv(out/b,candidates)
              lines=[
                  '# CAL26 V1R27 — Prospective QB Forecast Weight Freeze',
                  '',
                  '**Decision:** `FROZEN_CANDIDATES_ONLY_NO_MODEL_SELECTED_NO_PRODUCTION_CHANGE`.',
                  '',
                  '- Input source: exact green V1R26 artifact, run `39959344906`.',
                  '- Original observations: 64 QBs; same-player cohort: **31 QBs** with two frozen preseason sources and real historical lineage.',
                  '- Exclusions: 31 lack at least one provider; 2 more have no real historical production component.',
                  '- Prediction grid: **20 source-weighting candidates**, 31 fixed players each, **620 frozen candidate scores**.',
                  '- Historical component weight: 0%, 25%, 50%, 75%; remainder forward.',
                  '- Within forward, FantasyPros shares: 0%, 25%, 50%, 75%, 100%; Sleeper is the complement.',
                  '- Inputs are full-season-point *indices*. These are not genuine updated ROS forecasts, multi-year forecasts, or converted dynasty-FV points.',
                  '- **No 2026 Weeks 1–7 results used to select weights.** Previous six-week correlations are context, not fitted coefficients.',
                  '- Future primary evaluation: 2026 regular-season Weeks **8–12** active-game PPG Spearman, same eligible-QB cohort for every candidate.',
                  '- Report future sample size and source-missingness. Compare paired ordering, uncertainty, player-level exclusions and by-role strata before selecting any weights.',
                  '- Future confirmation (not used for selection): Weeks **13–18**. Exclude unfinished gameweeks, handle byes/injury without treating missing games as zero PPG.',
                  '- Comparison includes the 50/50 provider blend, with 0% history, and all other grid points; do not pick a retrospective winner from Weeks 1–6.',
                  '- Owner target ranges and 64 subjective owner ratings are **not** targets in this forecasting experiment.',
                  '- DLF October 19 ranks stay in a separately maintained private file; distinct FantasyPros full dynasty ECR remains unverified.',
                  '- 4for4 syndicated DLF dynasty ranks are not an independent second source; 4for4 statistical forecasts may be separately evaluated if independently timestamped.',
                  '- **Production write permissions: none. Pricing authority: none.**',
                  '',
                  '### Next analysis after the holdout',
                  'Only after measuring independent football forecasting quality should a dynasty-horizon model use vetted ROS, role, multi-year retention and distinct expert ranking features. '+
                  'Any mapping from football performance to FV points requires separate structural validation and owner approval.'
              ]
              (out/c).write_text('\n'.join(lines)+'\n',encoding='utf-8')
              m={'status':'PASS_CAL26_V1R27_FROZEN_FUTURE_ONLY_31_QB_20_CANDIDATES',
                 'source_v1r26_run':SOURCE_RUN,'source_v1r26_artifact':SOURCE_ARTIFACT,
                 'source_csv_sha256':SOURCE_SHA,'source_manifest_sha256':sha(source/'CAL26_V1R26_Manifest.json'),
                 'global_players_at_source':565,'original_qb_count':64,'same_cohort_qbs':31,'excluded':exclusions,
                 'candidate_models':20,'candidate_rows':620,'correct_owner_controls_at_source':24,
                 'holdout_weeks':list(FUTURE_HOLDOUT_WEEKS),'confirmation_weeks':list(FUTURE_CONFIRMATION_WEEKS),
                 'no_week_1_7_outcomes_used_to_fit':True,'calibration_weights_learned_from_data':False,
                 'private_rankings_ingested':False,'fv_price_changes':0,'production_change_authorized':False,
                 'files':{p:sha(out/p) for p in (a,b,c)}}
              (out/'CAL26_V1R27_Manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps({k:m[k] for k in ('status','same_cohort_qbs','candidate_models','candidate_rows','excluded')},sort_keys=True))

          if __name__=='__main__':
              parser=argparse.ArgumentParser();parser.add_argument('--source',type=Path);parser.add_argument('--out',type=Path);parser.add_argument('--selftest',action='store_true');args=parser.parse_args()
              if args.selftest:selftest()
              else:
                  assert args.source and args.out
                  main(args.source,args.out)
          PY_CAL26_V1R27_ENGINE
          python3 - <<'PY_COMPILE'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'cal26_v1r27_engine.py'
          compile(p.read_text(),str(p),'exec')
          print('PASS V1R27 Python compile')
          PY_COMPILE
          python3 "$RUNNER_TEMP/cal26_v1r27_engine.py" --selftest
      - name: Freeze 31 QB same-cohort 20-source-weight grid without using recent outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r27_engine.py" \
            --source "$RUNNER_TEMP/cal26_v1r27_frozen_v1r26" \
            --out "$RUNNER_TEMP/CAL26_V1R27_Frozen_Evidence"
      - name: Independently validate full grid source hashes and zero FV changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAL26_V1R27_VERIFY'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R27_Frozen_Evidence'
          m=json.loads((p/'CAL26_V1R27_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R27_FROZEN_FUTURE_ONLY_31_QB_20_CANDIDATES'
          assert (m['global_players_at_source'],m['original_qb_count'],m['same_cohort_qbs'])==(565,64,31)
          assert (m['candidate_models'],m['candidate_rows'],m['correct_owner_controls_at_source'])==(20,620,24)
          assert m['source_v1r26_run']==39959344906
          assert m['source_csv_sha256']=='8186a690a1187ea577ed39d7a4326086a3728ec57c3357949b803923e6fbd786'
          assert m['holdout_weeks']==[8,9,10,11,12] and m['confirmation_weeks']==[13,14,15,16,17,18]
          assert m['excluded']=={'missing_2026_preseason_source':31,'missing_real_historical_component':2}
          assert m['no_week_1_7_outcomes_used_to_fit'] and not m['calibration_weights_learned_from_data']
          assert not m['private_rankings_ingested'] and not m['production_change_authorized'] and m['fv_price_changes']==0
          for name,digest in m['files'].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,name
          with (p/'CAL26_V1R27_20_Candidates_620_Frozen_QB_Scores.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==620 and len({r['canonical_name'] for r in rows})==31
          assert len({r['candidate_id'] for r in rows})==20
          for candidate in {r['candidate_id'] for r in rows}:
              group=[r for r in rows if r['candidate_id']==candidate]
              assert len(group)==31 and set(int(r['candidate_rank_in_fixed_cohort']) for r in group)==set(range(1,32))
              assert all(r['future_outcome_used_for_fitting']=='False' and r['production_deploy_authorized']=='False' for r in group)
          print('PASS V1R27 64 in / 31 same cohort / 20 frozen candidates / 620 rows / 0 price changes')
          PY_CAL26_V1R27_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS working tree pristine; no production writes'
      - name: Upload read-only immutable forecast candidate grid
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R27-Frozen-QB-Prospective-20-Model-Grid-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R27_Frozen_Evidence
          if-no-files-found: error
          retention-days: 90
