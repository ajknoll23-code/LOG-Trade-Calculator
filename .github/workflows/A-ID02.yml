name: A - ID02 Exact Sleeper-ID UI Repair (Guarded)
run-name: A-ID02 ${{ inputs.mode }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: PREVIEW first; APPLY only after explicit owner approval
        required: true
        type: choice
        default: PREVIEW
        options: [PREVIEW, APPLY]
      preview_run_id:
        description: Successful A-ID02 PREVIEW GitHub run ID (APPLY only)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  identity-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ID02_MODE: ${{ inputs.mode }}
      ID02_PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
      ID02_OUT: /tmp/A-ID02-review
    steps:
      - name: Checkout current main without persisted write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned identity repair engine
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/id02_engine.py" <<'PY_ID02_ENGINE'
          #!/usr/bin/env python3
          '''ID02: immutable ID-based alias repair, patch limited to two UI files.
          PREVIEW does not write tracked files; APPLY pins and revalidates preview.
          '''
          import hashlib, json, os, pathlib, re, subprocess, sys, tempfile, difflib
          from collections import Counter
          ROOT = pathlib.Path('.')
          OUT = pathlib.Path(os.environ.get('ID02_OUT','/tmp/id02-review'))
          UI_FILES=('index.html','trade-desk-preview.html')
          AUDIT_ORIGINAL_SHA = {'index.html': 'f1066e35db2cd59c14093728437bd26607cd5263f981fae23f9d57b86cebf21b', 'trade-desk-preview.html': '7fb921aa7b79e72f390380e83e61491ef63e9aa0a60d2a210282556d087d84e8', 'data/league_rosters.json': '5bd0f2f30b736371cc2059c39c8a75e9305dc49178305bfe8c0e08debcce4f35', 'scripts/identity_crosswalk.json': 'cf42a72a90292783af18c96c000bb20e53112c989e510555fe22faa877f1ecf9'}
          EXPECTED = {'4037': {'name': 'chris godwin jr', 'key': 'chris godwin', 'pos': 'WR'}, '4199': {'name': 'aaron jones sr', 'key': 'aaron jones', 'pos': 'RB'}, '4971': {'name': 'derwin james jr', 'key': 'derwin james', 'pos': 'DB'}, '5017': {'name': 'jessie bates iii', 'key': 'jessie bates', 'pos': 'DB'}, '5030': {'name': 'harold landry iii', 'key': 'harold landry', 'pos': 'DL'}, '5847': {'name': 'dexter lawrence ii', 'key': 'dexter lawrence', 'pos': 'DL'}, '5872': {'name': 'deebo samuel sr', 'key': 'deebo samuel', 'pos': 'WR'}, '6131': {'name': 'mack wilson sr', 'key': 'mack wilson', 'pos': 'LB'}, '6819': {'name': 'michael pittman jr', 'key': 'michael pittman', 'pos': 'WR'}, '6888': {'name': 'antoine winfield jr', 'key': 'antoine winfield', 'pos': 'DB'}, '7543': {'name': 'travis etienne jr', 'key': 'travis etienne', 'pos': 'RB'}, '7553': {'name': 'kyle pitts sr', 'key': 'kyle pitts', 'pos': 'TE'}, '7672': {'name': 'ernest jones iv', 'key': 'ernest jones', 'pos': 'LB'}, '8138': {'name': 'james cook iii', 'key': 'james cook', 'pos': 'RB'}, '8151': {'name': 'kenneth walker iii', 'key': 'kenneth walker', 'pos': 'RB'}, '8154': {'name': 'brian robinson jr', 'key': 'brian robinson', 'pos': 'RB'}, '8308': {'name': 'derek stingley jr', 'key': 'derek stingley', 'pos': 'DB'}, '9229': {'name': 'anthony richardson sr', 'key': 'anthony richardson', 'pos': 'QB'}, '10219': {'name': 'chris rodriguez jr', 'key': 'chris rodriguez', 'pos': 'RB'}, '10883': {'name': 'will mcdonald iv', 'key': 'will mcdonald', 'pos': 'DL'}, '10892': {'name': 'will anderson jr', 'key': 'will anderson', 'pos': 'DL'}, '10897': {'name': 'tyrique stevenson sr', 'key': 'tyrique stevenson', 'pos': 'DB'}, '11628': {'name': 'marvin harrison jr', 'key': 'marvin harrison', 'pos': 'WR'}, '11631': {'name': 'brian thomas jr', 'key': 'brian thomas', 'pos': 'WR'}, '11655': {'name': 'tyrone tracy jr', 'key': 'tyrone tracy', 'pos': 'RB'}, '11668': {'name': 'byron murphy ii', 'key': 'byron murphy', 'pos': 'DL'}, '12495': {'name': 'ollie gordon ii', 'key': 'ollie gordon', 'pos': 'RB'}, '12506': {'name': 'harold fannin jr', 'key': 'harold fannin', 'pos': 'TE'}, '12519': {'name': 'luther burden iii', 'key': 'luther burden', 'pos': 'WR'}, '12544': {'name': 'lequint allen jr', 'key': 'lequint allen', 'pos': 'RB'}, '12588': {'name': 'kevin winston jr', 'key': 'kevin winston', 'pos': 'DB'}, '12617': {'name': 'demetrius knight jr', 'key': 'demetrius knight', 'pos': 'LB'}, '13276': {'name': 'omar cooper jr', 'key': 'omar cooper', 'pos': 'WR'}, '13298': {'name': 'kc concepcion jr', 'key': 'kc concepcion', 'pos': 'WR'}, '13305': {'name': 'mike washington jr', 'key': 'mike washington', 'pos': 'RB'}, '13317': {'name': 'ted hurst iii', 'key': 'ted hurst', 'pos': 'WR'}, '13340': {'name': 'rueben bain jr', 'key': 'rueben bain', 'pos': 'DL'}, '13365': {'name': 'anthony hill jr', 'key': 'anthony hill', 'pos': 'LB'}}
          HELD_IDS = {'13353': 'Chris Brazzell II', '12585': 'James Pearce Jr.'}
          # No unverified, collision-risk or incompatible-position aliases enter the patch.

          def hashbytes(b):return hashlib.sha256(b).hexdigest()
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def canon(s):return re.sub(r'\s+',' ',re.sub(r"[.'’\-]",'',str(s).lower())).strip()
          def jsstring(s):return json.dumps(s,ensure_ascii=True)

          def verify_sources():
            assert pathlib.Path('.github/workflows/A-ID02.yml').is_file(),'Wrong workflow tree'
            assert pathlib.Path('data/league_rosters.json').is_file()
            assert not git('status','--porcelain','--untracked-files=all'),'Repository dirty at start; stop'
            for path,sha in AUDIT_ORIGINAL_SHA.items():
              assert hashbytes(pathlib.Path(path).read_bytes())==sha,f'Source drift {path}; reconstruct audit before reattempt'
            assert git('branch','--show-current')=='main','Only main checkout supported'
            assert len(EXPECTED)==38 and set(EXPECTED).isdisjoint(HELD_IDS)
            db=json.loads(pathlib.Path('data/league_rosters.json').read_text())
            by_id={}
            for team in db['rosters']:
              for slot in ('starters','bench','taxi','reserve_ir'):
                for p in team.get(slot,[]):
                  pid=str(p['player_id']);assert pid not in by_id,f'Duplicate Sleeper ID {pid}'
                  by_id[pid]=p
            cross=json.loads(pathlib.Path('scripts/identity_crosswalk.json').read_text())
            for sid,spec in EXPECTED.items():
              x=by_id.get(sid)
              assert x is not None and canon(x['name'])==spec['name'],f'Sleeper name or ID drift for {sid}'
              assert x['position']==spec['pos'] or spec['pos'] in x.get('fantasy_positions',[]),f'Position drift {sid}'
              independent=[r for r in cross if str(r.get('sleeper_id'))==sid and canon(r.get('name',''))==spec['name'] and r.get('match_confidence')=='high' and r.get('requires_manual_review') is False]
              assert independent,f'No independently verified high-confidence crosswalk for {sid}'
            assert all(by_id.get(i) for i in HELD_IDS),'Held player disappeared; re-audit before proceeding'
            return {"league_players":len(by_id),"independent_id_matches":len(EXPECTED),"manual_holds":HELD_IDS}

          def curated_rows(source):
            a=source.index('const PLAYER_DB =')
            b=source.index('\n};',a)
            return dict((m.group(1),m.group(2)) for m in re.finditer(r"(?m)^\s*'([^']+)':\{pos:'([^']+)'",source[a:b]))

          def patch(source,page):
            original=source
            db=curated_rows(source)
            for sid,spec in EXPECTED.items():
              assert db.get(spec['key'])==spec['pos'],f'Curated DB missing or changed for {sid} in {page}'
            for sid in HELD_IDS:
              assert sid not in EXPECTED
            rows=['const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze({']
            for sid in sorted(EXPECTED,key=int):
              x=EXPECTED[sid]
              rows.append(f"  {jsstring(sid)}: Object.freeze({{synced:{jsstring(x['name'])},curated:{jsstring(x['key'])},pos:{jsstring(x['pos'])}}}),")
            rows+=['});','']
            old='''function resolveExistingKey(key){
            if(PLAYER_DB.hasOwnProperty(key)) return key;
            const alt = ALIASES[key] || ALIASES_REVERSE[key];
            if(alt && PLAYER_DB.hasOwnProperty(alt)) return alt;
            return key;
          }'''
            new='''/* A-ID02: exact Sleeper-ID verified alias map. Intentionally excludes
           * James Pearce Jr. (LB/DL disagreement) and Chris Brazzell II (no
           * independent high-confidence crosswalk). Never strip suffixes globally.
           * Existing curated records keep their position and production history.
           */
          '''+ '\n'.join(rows) + '''function resolveExistingKey(key, sleeperId=null){
            const id = sleeperId == null ? '' : String(sleeperId);
            const entry = Object.prototype.hasOwnProperty.call(A_ID02_VERIFIED_SLEEPER_IDENTITIES,id)
              ? A_ID02_VERIFIED_SLEEPER_IDENTITIES[id] : null;
            if(entry && key === entry.synced){
              const curated = PLAYER_DB[entry.curated];
              if(curated && curated.pos === entry.pos) return entry.curated;
              console.warn('A-ID02: held identity due to curated position drift for Sleeper ID',id);
            }
            if(PLAYER_DB.hasOwnProperty(key)) return key;
            const alt = ALIASES[key] || ALIASES_REVERSE[key];
            if(alt && PLAYER_DB.hasOwnProperty(alt)) return alt;
            return key;
          }'''
            assert source.count(old)==1,f'Resolver unknown or already patched in {page}'
            source=source.replace(old,new,1)
            legacy='resolveExistingKey(normalizeName(p.name))'
            needed=3 if page=='index.html' else 2
            assert source.count(legacy)==needed,f'Unexpected merge calls {page}'
            source=source.replace(legacy,'resolveExistingKey(normalizeName(p.name),p.player_id)')
            # No value engines, weights, market files, price anchors or JSON data touched.
            assert source.count('function playerValue(')==original.count('function playerValue(')==1
            assert source.count('const CAL26_FV_OWNER_ANCHORS')==original.count('const CAL26_FV_OWNER_ANCHORS')
            assert source.count('const PROD_MULT')==original.count('const PROD_MULT')
            return source

          def node_js_check(page,src):
            # Validate the complete main inline JavaScript syntax, not just the resolver.
            scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',src,flags=re.S|re.I)
            main=[x for x in scripts if 'function resolveExistingKey' in x]
            assert len(main)==1,f'Unable to isolate main script in {page}'
            with tempfile.NamedTemporaryFile(mode='w',suffix='.js',delete=True) as f:
              f.write(main[0]);f.flush()
              subprocess.run(['node','--check',f.name],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)

          def node_resolver_test(html):
            a=html.index('const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze(')
            b=html.index('\n/* Sleeper uses finer-grained position',a)
            block=html[a:b]
            # Isolate real patched resolver with a test PLAYER_DB and no browser context.
            test='''const assert=require('node:assert/strict');
          const EXPECTED=JSON.parse(process.argv[1]);
          const HELD=JSON.parse(process.argv[2]);
          const PLAYER_DB={};for(const v of Object.values(EXPECTED))PLAYER_DB[v.key]={pos:v.pos};
          const ALIASES={};const ALIASES_REVERSE={};
          '''+block+'''
          for(const [sid,row] of Object.entries(EXPECTED)){
           assert.equal(resolveExistingKey(row.name,sid),row.key,'Known ID must resolve canonical');
           assert.equal(resolveExistingKey(row.name,'99999999999'),row.name,'Wrong ID cannot match');
           assert.equal(resolveExistingKey(row.name+' changed',sid),row.name+' changed','Name drift cannot match');
           const old=PLAYER_DB[row.key].pos;
           PLAYER_DB[row.key].pos='UNKNOWN';
           assert.equal(resolveExistingKey(row.name,sid),row.name,'Position drift must fail closed');
           PLAYER_DB[row.key].pos=old;
          }
          for(const sid of Object.keys(HELD))assert.equal(Object.hasOwn(A_ID02_VERIFIED_SLEEPER_IDENTITIES,sid),false);
          assert.equal(resolveExistingKey('alex singleton','2617'),'alex singleton','Unmapped exact player must be untouched when in DB');
          console.log('ID02_NODE_VALIDATED_'+Object.keys(EXPECTED).length);
          '''
            # Preserve existing Alex Singleton canonical record as a separate regression.
            test=test.replace('const ALIASES={};',"PLAYER_DB['alex singleton']={pos:'LB'};const ALIASES={};")
            z=subprocess.run(['node','-e',test,json.dumps(EXPECTED),json.dumps(HELD_IDS)],check=True,capture_output=True,text=True)
            assert f'ID02_NODE_VALIDATED_{len(EXPECTED)}' in z.stdout
            return z.stdout.strip()

          def run():
            assert len(sys.argv)==2 and sys.argv[1] in ('PREVIEW','APPLY')
            mode=sys.argv[1]
            stats=verify_sources()
            prepared={};diffs=[]
            for path in UI_FILES:
              raw=pathlib.Path(path).read_text()
              out=patch(raw,path)
              node_js_check(path,out)
              prepared[path]=out
              diffs.extend(difflib.unified_diff(raw.splitlines(True),out.splitlines(True),fromfile='a/'+path,tofile='b/'+path))
            checks={'index.html':node_resolver_test(prepared['index.html']),'trade-desk-preview.html':node_resolver_test(prepared['trade-desk-preview.html'])}
            report={'schema':1,'status':'ID02_PREVIEW_VALIDATED_READ_ONLY','head_sha':git('rev-parse','HEAD'),'patch_scope':list(UI_FILES),'original_sha256':{p:hashbytes(pathlib.Path(p).read_bytes()) for p in UI_FILES},'patched_sha256':{p:hashbytes(prepared[p].encode()) for p in UI_FILES},'id_map':EXPECTED,'held_id':HELD_IDS,'checks':checks,'stats':stats,'production_pricing_formula_changes':False,'pricing_artifact_changes':False,'note':'Canonical live display values may move because an identity bug is corrected; no price formula or stored value updates.'}
            OUT.mkdir(parents=True,exist_ok=True)
            frozen=(json.dumps(report,sort_keys=True,indent=2,ensure_ascii=False)+'\n').encode()
            path=OUT/'ID02_Preview.json'
            path.write_bytes(frozen)
            (OUT/'ID02_diff.patch').write_text(''.join(diffs))
            lines=['# A-ID02 — Sleeper-ID canonical identity repair','',f'- Base: `{report["head_sha"]}`','- Audited mappings: **38**','- Explicitly held: **2** (James Pearce Jr.; Chris Brazzell II)','- Patch limited to `index.html` and `trade-desk-preview.html`','- Both personal and league ingestion paths plus index personal provenance resolver updated','- Zero price-engine changes or price artifact writes','- PREVIEW does not modify repository files','', '## Safeguards','', 'Each identity requires an exact Sleeper ID, exact normalized synced name, independent high-confidence crosswalk, and matching curated position. Wrong ID, changed name, or unexpected curated position fails closed; all existing nonmapped names retain the old resolver path.','', '## Node syntax and resolver tests','',*['- '+x for x in checks.values()],'','## Apply requirement','', 'APPLY requires matching successful preview run ID, unchanged main commit, exact generated patch hashes, owner permission and `WFC01_PUSH_TOKEN` (Contents+Workflows write).']
            (OUT/'ID02_Report.md').write_text('\n'.join(lines)+'\n')
            if mode=='PREVIEW':
              print(json.dumps({'status':report['status'],'base':report['head_sha'],'verified_ids':38,'held':2,'only_files':list(UI_FILES),'checks':checks},sort_keys=True));return
            assert os.environ.get('ID02_MODE')=='APPLY'
            priorpath=OUT/'ID02_Approved_Preview.json'
            assert priorpath.is_file(),'Missing approved preview manifest'
            prior=json.loads(priorpath.read_text())
            assert prior==report,'Source or exact patch changed since PREVIEW; stop'
            token=os.environ.get('WFC01_PUSH_TOKEN','')
            assert token,'Missing WFC01_PUSH_TOKEN'
            for name,html in prepared.items():pathlib.Path(name).write_text(html)
            staged=set(UI_FILES)
            git('add','--',*UI_FILES)
            changed=set(filter(None,git('diff','--cached','--name-only').splitlines()))
            assert changed==staged,f'Unexpected files staged: {changed}'
            assert not git('diff','--name-only'),'Unexpected unstaged files'
            git('diff','--cached','--check')
            git('config','user.name','github-actions[bot]')
            git('config','user.email','github-actions[bot]@users.noreply.github.com')
            git('commit','-m','A-ID02: repair 38 Sleeper-ID verified suffix identities in both UIs')
            branch='https://x-access-token:'+token+'@github.com/'+os.environ['GITHUB_REPOSITORY']+'.git'
            subprocess.run(['git','push',branch,'HEAD:main'],check=True)
            print(json.dumps({'status':'ID02_PATCH_PUSHED','commit':git('rev-parse','HEAD'),'verified_ids':38,'changed_files':list(UI_FILES)}))

          if __name__=='__main__':run()
          PY_ID02_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/id02_engine.py"
      - name: PREVIEW full identity and price-neutral regression checks
        if: inputs.mode == 'PREVIEW'
        run: python3 "$RUNNER_TEMP/id02_engine.py" PREVIEW
      - name: Upload immutable PREVIEW manifest, audit, and patch diff
        if: inputs.mode == 'PREVIEW'
        uses: actions/upload-artifact@v4
        with:
          name: A-ID02-Identity-Preview
          path: /tmp/A-ID02-review/
          retention-days: 30
      - name: APPLY verifies reviewed successful PREVIEW and permission
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$ID02_PREVIEW_RUN_ID" =~ ^[0-9]{7,15}$ ]] || { echo '::error::Supply green PREVIEW run ID'; exit 1; }
          test -n "$WFC01_PUSH_TOKEN" || { echo '::error::Missing WFC01_PUSH_TOKEN'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID02_PREVIEW_RUN_ID" --jq '[.conclusion,.event,.path,.head_sha,.display_title]|@tsv' > "$RUNNER_TEMP/id02_preview.tsv"
          IFS=$'\t' read -r result event path sha title < "$RUNNER_TEMP/id02_preview.tsv"
          test "$result" = success && test "$event" = workflow_dispatch && test "$path" = .github/workflows/A-ID02.yml && test "$sha" = "$(git rev-parse HEAD)" && test "$title" = 'A-ID02 PREVIEW' || { echo '::error::Missing matching successful ID02 PREVIEW'; exit 1; }
      - name: Download exact PREVIEW audit artifact
        if: inputs.mode == 'APPLY'
        uses: actions/download-artifact@v4
        with:
          name: A-ID02-Identity-Preview
          run-id: ${{ inputs.preview_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: /tmp/A-ID02-approved
      - name: Pin approved manifest and APPLY reviewed two-file UI patch
        if: inputs.mode == 'APPLY'
        shell: bash
        env:
          WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$ID02_OUT"
          cp /tmp/A-ID02-approved/ID02_Preview.json "$ID02_OUT/ID02_Approved_Preview.json"
          python3 "$RUNNER_TEMP/id02_engine.py" APPLY
      - name: Report status and scope
        if: always()
        shell: bash
        run: |
          if test -f "$ID02_OUT/ID02_Report.md"; then
            cat "$ID02_OUT/ID02_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No completed ID02 report; inspect job error logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
