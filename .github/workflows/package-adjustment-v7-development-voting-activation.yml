    - name: Activate frozen V7 voting transport
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |
        set -euo pipefail
        python3 research/package-adjustment-v7/activate_multi_vs_multi_voting_v1.py --write --base-sha "$BASE_SHA"
        python3 research/package-adjustment-v7/activate_multi_vs_multi_voting_v1.py --check
    - name: Prove exact activation scope
      shell: bash
      run: |2

        set -euo pipefail
        mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
        expected=(
          index.html
          research/package-adjustment-v7/activate_multi_vs_multi_voting_v1.py
          research/package-adjustment-v7/development_voting_activation_manifest_v1.json
          research/package-adjustment-v7/development_voting_activation_v1.md
          scripts/market/ktc_pipeline.py
        )
        diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
    - name: Test browser transport and regressions
      shell: bash
      run: |2

        set -euo pipefail
        cat > "${RUNNER_TEMP}/v7_vote_browser_test.js" <<'JS'
        const fs = require('fs');
        const text = fs.readFileSync('index.html','utf8');

        function extractFunction(name){
          const marker=`function ${name}(`;
          const start=text.indexOf(marker);
          if(start<0) throw new Error(`missing ${name}`);
          let i=text.indexOf('{',start),d=0,q=null,esc=false,line=false,block=false;
          for(let k=i;k<text.length;k++){
            const ch=text[k],n=text[k+1]||'';
            if(line){if(ch==='\n')line=false;continue;}
            if(block){if(ch==='*'&&n==='/'){block=false;k++;}continue;}
            if(q){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch===q)q=null;continue;}
            if(ch==='/'&&n==='/'){line=true;k++;continue;}
            if(ch==='/'&&n==='*'){block=true;k++;continue;}
            if(ch==="'"||ch==='"'||ch==='`'){q=ch;continue;}
            if(ch==='{')d++; else if(ch==='}'){d--;if(d===0)return text.slice(start,k+1);}
          }
          throw new Error(`unbalanced ${name}`);
        }

        const constants="const PACKAGE_VOTE_TOTAL_CHALLENGES=40;\nconst PACKAGE_VOTE_DAILY_LIMIT=40;";
        const funcs=[
          'packageVoteHash','packageVoteCompletedKey','packageVoteCompleted',
          'packageVoteTodayKey','packageVotesToday','packageVoteRecent',
          'packageVoteRemember','packageVoteSelectChallenge'
        ].map(extractFunction).join('\n');

        const store=new Map();
        global.localStorage={
          getItem:k=>store.has(k)?store.get(k):null,
          setItem:(k,v)=>store.set(k,String(v))
        };
        global.ktcCurrentVoterId=()=> 'test_voter';
        global.PACKAGE_VOTE_CHALLENGES=Array.from({length:40},(_,i)=>({id:`c${i+1}`}));
        eval(constants+'\n'+funcs);

        const first=[];
        for(let i=0;i<40;i++){
          const r=packageVoteSelectChallenge();
          if(!r) throw new Error('early exhaustion');
          if(first.includes(r.challenge.id)) throw new Error('repeat');
          if(!['A','B'].includes(r.left)) throw new Error('bad side');
          first.push(r.challenge.id);
          packageVoteRemember(r.challenge.id);
        }
        if(packageVoteSelectChallenge()!==null) throw new Error('did not exhaust');
        store.clear();
        const second=[];
        for(let i=0;i<40;i++){
          const r=packageVoteSelectChallenge();
          second.push(r.challenge.id);
          packageVoteRemember(r.challenge.id);
        }
        if(JSON.stringify(first)!==JSON.stringify(second)) throw new Error('order unstable');
        console.log('PASS 40 unique stable challenges');
        JS
        node "${RUNNER_TEMP}/v7_vote_browser_test.js"
        python3 scripts/market/ktc_pipeline.py --selftest
        python3 scripts/validation/check_package_adjustment_live.py

        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
        restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
        trap restore_tu EXIT
        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/repo_regression_checks.py
        restore_tu
        trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"
    - name: Commit voting activation
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |2

        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add \
          index.html \
          scripts/market/ktc_pipeline.py \
          research/package-adjustment-v7/activate_multi_vs_multi_voting_v1.py \
          research/package-adjustment-v7/development_voting_activation_manifest_v1.json \
          research/package-adjustment-v7/development_voting_activation_v1.md
        git diff --cached --quiet && { echo 'ERROR: no activation changes staged'; exit 1; }
        git commit -m "Activate Package Adjustment V7 development voting"

        git fetch origin main
        critical=(
          research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json
          research/package-adjustment-v7/phase1a_power_analysis_v1.json
          research/package-adjustment-v7/phase1a_power_and_catalog_manifest_v1.json
          research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py
          scripts/validation/check_package_adjustment_live.py
        )
        for p in "${critical[@]}"; do
          test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
            echo "ERROR: frozen V7 input changed during activation: $p"; exit 1;
          }
        done
        for p in index.html scripts/market/ktc_pipeline.py; do
          test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
            echo "ERROR: concurrent writer changed $p during activation"; exit 1;
          }
        done

        git rebase origin/main
        python3 research/package-adjustment-v7/activate_multi_vs_multi_voting_v1.py --check
        python3 scripts/market/ktc_pipeline.py --selftest
        python3 scripts/validation/check_package_adjustment_live.py
        node "${RUNNER_TEMP}/v7_vote_browser_test.js"
        git push origin HEAD:main
