# PREFLIGHTED: PACKAGE_ADJUSTMENT_V7_DEVELOPMENT_VOTING_ACTIVATION_V1
name: Package Adjustment V7 - Development Voting Activation
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture activation base
      id: base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install regression dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen V7 lineage
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        declare -A EXPECTED=(
          ["index.html"]="ab60f7008a3e8dbc1a2e1eeb6904c9ccf0eb6d41"
          ["scripts/market/ktc_pipeline.py"]="51ced0775fcd22c0ea200e4c02796aba5fcf858d"
          ["research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json"]="01823ce0f146fd09693b4585bf4948c3076bd9d3"
          ["research/package-adjustment-v7/phase1a_power_analysis_v1.json"]="7f908d437d8cea1b0c4561d114118b8fe94d8fa7"
          ["research/package-adjustment-v7/phase1a_power_and_catalog_manifest_v1.json"]="5d8e799cae4d3bbe4868c68562d42f9e83638377"
          ["research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py"]="8348b54f114e484d2858f1aa7a67189d0f921d28"
          ["scripts/validation/check_package_adjustment_live.py"]="3c924d762f93fd93b9943afe090deda6a2b7d8a0"
        )
        for p in "${!EXPECTED[@]}"; do
          a="$(git hash-object "$p")"
          test "$a" = "${EXPECTED[$p]}" || { echo "ERROR: predecessor drift $p expected=${EXPECTED[$p]} actual=$a"; exit 1; }
        done
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/market/ktc_pipeline.py --selftest
    - name: Write activation implementation
      shell: bash
      run: "set -euo pipefail\ncat > research/package-adjustment-v7/activate_multi_vs_multi_voting_v1.py <<'PY'\n#!/usr/bin/env\
        \ python3\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport json\nimport re\nfrom datetime\
        \ import datetime, timezone\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nD = ROOT / \"\
        research\" / \"package-adjustment-v7\"\nINDEX = ROOT / \"index.html\"\nKTC = ROOT / \"scripts/market/ktc_pipeline.py\"\
        \nPHASE1A = D / \"phase1a_power_and_catalog_manifest_v1.json\"\nPOWER = D / \"phase1a_power_analysis_v1.json\"\nCATALOG\
        \ = D / \"package_vote_challenges_v7_development_v1.json\"\nOUT_MAN = D / \"development_voting_activation_manifest_v1.json\"\
        \nOUT_MD = D / \"development_voting_activation_v1.md\"\n\nPREFIX = \"__pkgv7dev__|\"\nMETA_PREFIX = \"__pkgv7dev_meta__|\"\
        \nSCHEMA_MARKER = \"__pkgv7dev_schema__|1\"\nCATALOG_SHA256 = \"ddf1ad55a7f6b46a198e0855c7f2d1ae5346d5a1e8b88bb6e1a859076c2ac8dd\"\
        \n\ndef sha256(path: Path) -> str:\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\ndef read_json(path:\
        \ Path):\n    return json.loads(path.read_text(encoding=\"utf-8\"))\n\ndef replace_function(text: str, name: str,\
        \ replacement: str) -> str:\n    marker = f\"function {name}(\"\n    start = text.find(marker)\n    if start < 0:\n\
        \        raise RuntimeError(f\"missing JS function: {name}\")\n    brace = text.find(\"{\", start)\n    depth = 0\n\
        \    quote = None\n    escaped = False\n    line_comment = False\n    block_comment = False\n    i = brace\n    while\
        \ i < len(text):\n        ch = text[i]\n        nxt = text[i + 1] if i + 1 < len(text) else \"\"\n        if line_comment:\n\
        \            if ch == \"\\n\":\n                line_comment = False\n            i += 1\n            continue\n \
        \       if block_comment:\n            if ch == \"*\" and nxt == \"/\":\n                block_comment = False\n \
        \               i += 2\n                continue\n            i += 1\n            continue\n        if quote:\n  \
        \          if escaped:\n                escaped = False\n            elif ch == \"\\\\\":\n                escaped\
        \ = True\n            elif ch == quote:\n                quote = None\n            i += 1\n            continue\n\
        \        if ch == \"/\" and nxt == \"/\":\n            line_comment = True\n            i += 2\n            continue\n\
        \        if ch == \"/\" and nxt == \"*\":\n            block_comment = True\n            i += 2\n            continue\n\
        \        if ch in (\"'\", '\"', \"`\"):\n            quote = ch\n            i += 1\n            continue\n      \
        \  if ch == \"{\":\n            depth += 1\n        elif ch == \"}\":\n            depth -= 1\n            if depth\
        \ == 0:\n                return text[:start] + replacement.strip() + text[i + 1:]\n        i += 1\n    raise RuntimeError(f\"\
        unbalanced JS function: {name}\")\n\ndef validate_frozen_inputs():\n    p = read_json(PHASE1A)\n    power = read_json(POWER)\n\
        \    cat = read_json(CATALOG)\n\n    assert p[\"status\"] == \"FROZEN_PRE_VOTE_POWER_AND_CATALOG\"\n    assert p[\"\
        decision\"] == \"FREEZE_V7_PHASE1A_AT_40_VOTER_FIRST_CHECKPOINT\"\n    assert p[\"v7_votes_read\"] is False\n    assert\
        \ p[\"voting_activated\"] is False\n    assert p[\"selected_first_checkpoint_distinct_voters\"] == 40\n    assert\
        \ p[\"hard_cap_distinct_voters\"] == 50\n\n    assert power[\"status\"] == \"FROZEN_PRE_VOTE_POWER\"\n    assert power[\"\
        selected_first_checkpoint_distinct_voters\"] == 40\n    assert power[\"hard_cap_distinct_voters\"] == 50\n    assert\
        \ power[\"coverage_gate_at_or_after_first_checkpoint\"][\"minimum_distinct_voters_per_challenge\"] == 32\n    assert\
        \ power[\"v7_votes_read\"] is False\n\n    assert cat[\"status\"] == \"FROZEN_PRE_VOTE_DEVELOPMENT_CATALOG\"\n   \
        \ assert cat[\"frozen\"] is True\n    assert cat[\"released\"] is False\n    assert cat[\"voting_activated\"] is False\n\
        \    assert cat[\"v7_votes_read\"] is False\n    assert cat[\"candidate_fit_performed\"] is False\n    assert cat[\"\
        candidate_predictions_used_for_catalog_selection\"] is False\n    assert cat[\"challenge_count\"] == 40\n    assert\
        \ len(cat[\"challenges\"]) == 40\n    assert sha256(CATALOG) == CATALOG_SHA256\n\n    ids = [str(c[\"id\"]) for c\
        \ in cat[\"challenges\"]]\n    assert len(ids) == len(set(ids)) == 40\n    assert all(c[\"fv_visible_to_voter\"] is\
        \ False for c in cat[\"challenges\"])\n    assert all(c[\"candidate_prediction_used_for_selection\"] is False for\
        \ c in cat[\"challenges\"])\n\ndef constants_block(base_sha: str, activated: str) -> str:\n    return f'''/* Package\
        \ Adjustment V7 Development Voting.\nResearch only. Frozen 40-trade player-only multi-v-multi catalog.\nNo candidate\
        \ has been fit and production Package Adjustment remains V1.7. */\nconst PACKAGE_VOTE_CHALLENGES_URL = 'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/{base_sha}/research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json';\n\
        const PACKAGE_VOTE_CATALOG_SHA256 = '{CATALOG_SHA256}';\nconst PACKAGE_VOTE_DAILY_LIMIT = 40;\nconst PACKAGE_VOTE_TOTAL_CHALLENGES\
        \ = 40;\nconst PACKAGE_VOTE_VALID_AFTER_UTC = '{activated}';\nlet PACKAGE_VOTE_CHALLENGES = null;\nlet PACKAGE_VOTE_STATUS\
        \ = 'idle';\nlet packageVoteCurrent = null;'''\n\ndef functions():\n    return {\n\"packageVoteTodayKey\": r'''\n\
        function packageVoteHash(value){\nlet h = 2166136261 >>> 0;\nfor(let i = 0; i < String(value).length; i++){\nh ^=\
        \ String(value).charCodeAt(i);\nh = Math.imul(h, 16777619) >>> 0;\n}\nreturn h >>> 0;\n}\n\nfunction packageVoteCompletedKey(){\n\
        const voter = ktcCurrentVoterId() || 'unconfirmed';\nreturn `package_votes_v7dev_completed_${voter}`;\n}\n\nfunction\
        \ packageVoteCompleted(){\ntry {\nconst rows = JSON.parse(localStorage.getItem(packageVoteCompletedKey()) || '[]');\n\
        return Array.isArray(rows)\n  ? Array.from(new Set(rows.map(String))).slice(0, PACKAGE_VOTE_TOTAL_CHALLENGES)\n  :\
        \ [];\n} catch(e){\nreturn [];\n}\n}\n\nfunction packageVoteTodayKey(){\nconst voter = ktcCurrentVoterId() || 'unconfirmed';\n\
        return `package_votes_v7dev_${voter}_` + new Date().toISOString().slice(0,10);\n}''',\n\n\"packageVotesToday\": r'''\n\
        function packageVotesToday(){\nreturn parseInt(localStorage.getItem(packageVoteTodayKey()) || '0', 10);\n}''',\n\n\
        \"packageVoteRecent\": r'''\nfunction packageVoteRecent(){\nreturn packageVoteCompleted();\n}''',\n\n\"packageVoteRemember\"\
        : r'''\nfunction packageVoteRemember(id){\nconst completed = packageVoteCompleted();\nif(!completed.includes(String(id)))\
        \ completed.push(String(id));\nlocalStorage.setItem(\npackageVoteCompletedKey(),\nJSON.stringify(completed.slice(0,\
        \ PACKAGE_VOTE_TOTAL_CHALLENGES))\n);\n}''',\n\n\"packageVoteSelectChallenge\": r'''\nfunction packageVoteSelectChallenge(){\n\
        if(!PACKAGE_VOTE_CHALLENGES || PACKAGE_VOTE_CHALLENGES.length !== PACKAGE_VOTE_TOTAL_CHALLENGES) return null;\nconst\
        \ voter = ktcCurrentVoterId();\nif(!voter) return null;\n\nconst completed = new Set(packageVoteCompleted());\nconst\
        \ ordered = PACKAGE_VOTE_CHALLENGES.slice().sort((a,b) => {\nconst ha = packageVoteHash(`${voter}|order|${a.id}`);\n\
        const hb = packageVoteHash(`${voter}|order|${b.id}`);\nif(ha !== hb) return ha - hb;\nreturn String(a.id).localeCompare(String(b.id));\n\
        });\nconst challenge = ordered.find(c => !completed.has(String(c.id)));\nif(!challenge) return null;\n\nconst left\
        \ = (packageVoteHash(`${voter}|side|${challenge.id}`) & 1) === 0 ? 'A' : 'B';\nreturn { challenge, left };\n}''',\n\
        \n\"packageVoteEnsureLoaded\": r'''\nfunction packageVoteEnsureLoaded(){\nif(PACKAGE_VOTE_STATUS === 'loading' ||\
        \ PACKAGE_VOTE_STATUS === 'ready') return;\nPACKAGE_VOTE_STATUS = 'loading';\n\nfetch(PACKAGE_VOTE_CHALLENGES_URL,\
        \ {cache:'no-store'})\n.then(r => {\nif(!r.ok) throw new Error('HTTP ' + r.status);\nreturn r.json();\n})\n.then(doc\
        \ => {\nif(\ndoc.schema_version !== 1 ||\ndoc.study_id !== 'package-adjustment-v7-multi-v-multi' ||\ndoc.stage !==\
        \ 'phase1a_development_catalog' ||\ndoc.status !== 'FROZEN_PRE_VOTE_DEVELOPMENT_CATALOG' ||\ndoc.frozen !== true ||\n\
        doc.released !== false ||\ndoc.voting_activated !== false ||\ndoc.v7_votes_read !== false ||\ndoc.candidate_fit_performed\
        \ !== false ||\ndoc.candidate_predictions_used_for_catalog_selection !== false ||\ndoc.fv_visible_to_voter !== false\
        \ ||\nNumber(doc.challenge_count) !== 40 ||\n!Array.isArray(doc.challenges) ||\ndoc.challenges.length !== 40 ||\n\
        !doc.challenges.every(c =>\n  c &&\n  c.schema_version === 1 &&\n  c.experiment === 'package_adjustment_v7_multi_vs_multi_development'\
        \ &&\n  ['2v2','2v3','2v4','3v3','3v4','4v4'].includes(c.topology) &&\n  c.fv_visible_to_voter === false &&\n  c.candidate_prediction_used_for_selection\
        \ === false &&\n  c.side_A && Array.isArray(c.side_A.assets) &&\n  c.side_B && Array.isArray(c.side_B.assets) &&\n\
        \  c.side_A.assets.length >= 2 && c.side_A.assets.length <= 4 &&\n  c.side_B.assets.length >= 2 && c.side_B.assets.length\
        \ <= 4\n)\n){\nthrow new Error('unexpected frozen V7 development challenge catalog');\n}\nconst ids = new Set(doc.challenges.map(c\
        \ => String(c.id)));\nif(ids.size !== 40) throw new Error('v7_development_duplicate_challenge_ids');\n\nPACKAGE_VOTE_CHALLENGES\
        \ = doc.challenges;\nPACKAGE_VOTE_STATUS = 'ready';\npackageVoteCurrent = null;\nrenderPackageVote();\n})\n.catch(err\
        \ => {\nconsole.warn('Package Adjustment V7 development catalog load failed:', err);\nPACKAGE_VOTE_CHALLENGES = null;\n\
        PACKAGE_VOTE_STATUS = 'failed';\nrenderPackageVote();\n});\n}''',\n\n\"packageVoteAssetCard\": r'''\nfunction packageVoteAssetCard(p){\n\
        const age = (typeof p.age === 'number') ? ` &middot; ${p.age} y.o.` : '';\nconst team = p.team ? ` &middot; ${ktcTeamLabel(p.team)}`\
        \ : '';\nreturn `<div class=\"need-cell\" style=\"text-align:left;padding:10px;\">\n<div style=\"font-weight:600;font-size:14px;\"\
        >${escapeHtml(p.name)}</div>\n<div style=\"color:var(--text-dim);font-size:11px;\">${escapeHtml(p.pos)}${team}${age}</div>\n\
        </div>`;\n}''',\n\n\"packageVoteSubmit\": r'''\nfunction packageVoteSubmit(displaySide){\nif(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC))\
        \ return;\nif(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;\n\nconst left = packageVoteCurrent.left;\n\
        const choice = displaySide === 'L' ? left : (left === 'A' ? 'B' : 'A');\nconst id = String(packageVoteCurrent.challenge.id);\n\
        const voter = ktcCurrentVoterId();\nif(!voter) return;\nif(packageVoteCompleted().includes(id)) return;\n\nfetch(KTC_SUBMIT_URL,\
        \ {\nmethod: 'POST',\nheaders: { 'Content-Type': 'text/plain;charset=utf-8' },\nbody: JSON.stringify({\nvoterRosterId:\
        \ voter,\nkeep: `__pkgv7dev__|${id}|${choice}`,\ntrade: `__pkgv7dev_meta__|${left}`,\ncut: '__pkgv7dev_schema__|1',\n\
        }),\n}).catch(() => {});\n\nlocalStorage.setItem(packageVoteTodayKey(), String(packageVotesToday() + 1));\npackageVoteRemember(id);\n\
        packageVoteCurrent = packageVoteSelectChallenge();\nrenderPackageVote();\n}''',\n\n\"renderPackageVote\": r'''\nfunction\
        \ renderPackageVote(){\nconst el = document.getElementById('packageVoteWrap');\nif(!el) return;\n\nif(!(state.teamConfirmed\
        \ && MY_ROSTER_ID) && !ktcIsGuestMode()){\nel.innerHTML = `\n<div class=\"vote-access-card\">\n<div class=\"vote-access-copy\"\
        >\n<div class=\"vote-access-title\">Ready to compare trades?</div>\n<div class=\"vote-access-sub\">League members:\
        \ choose your team above to use your league voter identity. Everyone else can vote as a guest.</div>\n</div>\n<button\
        \ type=\"button\" class=\"vote-guest-btn\" onclick=\"ktcStartGuestMode()\">Vote as a guest</button>\n</div>`;\nreturn;\n\
        }\n\nif(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)){\nel.innerHTML = `<div style=\"color:var(--text-dim);font-size:13px;padding:8px\
        \ 0;\">\nV7 multi-package development voting opens at ${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.\n\
        </div>`;\nreturn;\n}\n\nconst completedCount = packageVoteCompleted().length;\nif(completedCount >= PACKAGE_VOTE_TOTAL_CHALLENGES){\n\
        el.innerHTML = `<div style=\"color:var(--green);font-size:13px;padding:8px 0;\">\nYou've completed all ${PACKAGE_VOTE_TOTAL_CHALLENGES}\
        \ V7 package comparisons. Thank you.\n</div>`;\nreturn;\n}\n\nif(PACKAGE_VOTE_STATUS === 'idle'){\npackageVoteEnsureLoaded();\n\
        el.innerHTML = `<div style=\"color:var(--text-dim);font-size:13px;padding:8px 0;\">Loading the frozen V7 multi-package\
        \ comparisons...</div>`;\nreturn;\n}\nif(PACKAGE_VOTE_STATUS === 'loading'){\nel.innerHTML = `<div style=\"color:var(--text-dim);font-size:13px;padding:8px\
        \ 0;\">Loading the frozen V7 multi-package comparisons...</div>`;\nreturn;\n}\nif(PACKAGE_VOTE_STATUS === 'failed'){\n\
        el.innerHTML = `<div style=\"color:var(--text-dim);font-size:13px;padding:8px 0;\">V7 package research is temporarily\
        \ unavailable. Normal KTC voting is unaffected.</div>`;\nreturn;\n}\n\nif(!packageVoteCurrent) packageVoteCurrent\
        \ = packageVoteSelectChallenge();\nif(!packageVoteCurrent){\nel.innerHTML = `<div style=\"color:var(--text-dim);font-size:13px;padding:8px\
        \ 0;\">No remaining V7 package comparison is available for this voter.</div>`;\nreturn;\n}\n\nconst c = packageVoteCurrent.challenge;\n\
        const canonicalA = c.side_A.assets.map(packageVoteAssetCard).join('');\nconst canonicalB = c.side_B.assets.map(packageVoteAssetCard).join('');\n\
        const leftIsA = packageVoteCurrent.left === 'A';\nconst leftHTML = leftIsA ? canonicalA : canonicalB;\nconst rightHTML\
        \ = leftIsA ? canonicalB : canonicalA;\n\nel.innerHTML = `\n<div style=\"border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text-dim);\"\
        >\n<b style=\"color:var(--text);\">Multi-package research:</b> Which side would you rather receive in this dynasty\
        \ trade?\nValues are intentionally hidden. Choose based on the assets themselves.\n</div>\n<div style=\"display:grid;grid-template-columns:1fr\
        \ 1fr;gap:8px;align-items:stretch;\">\n<div>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:5px;text-align:center;\"\
        >SIDE A</div>\n<div style=\"display:flex;flex-direction:column;gap:6px;\">${leftHTML}</div>\n<button class=\"tab-btn\"\
        \ style=\"width:100%;margin-top:8px;\" onclick=\"packageVoteSubmit('L')\">Choose Side A</button>\n</div>\n<div>\n\
        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--violet);margin-bottom:5px;text-align:center;\"\
        >SIDE B</div>\n<div style=\"display:flex;flex-direction:column;gap:6px;\">${rightHTML}</div>\n<button class=\"tab-btn\"\
        \ style=\"width:100%;margin-top:8px;\" onclick=\"packageVoteSubmit('R')\">Choose Side B</button>\n</div>\n</div>\n\
        <div style=\"color:var(--text-dim);font-size:10px;margin-top:8px;text-align:center;\">\n${completedCount} / ${PACKAGE_VOTE_TOTAL_CHALLENGES}\
        \ V7 comparisons completed &middot; order and display sides randomized per voter\n</div>`;\n}'''\n    }\n\ndef patch_index(text:\
        \ str, base_sha: str, activated: str) -> str:\n    start = text.find(\"/* Package Adjustment V6P1 Prospective Confirmation:\"\
        )\n    if start < 0:\n        raise RuntimeError(\"missing V6P1 package constants marker\")\n    end_marker = \"let\
        \ packageVoteCurrent = null;\"\n    end = text.find(end_marker, start)\n    if end < 0:\n        raise RuntimeError(\"\
        missing package vote constants end\")\n    end += len(end_marker)\n    text = text[:start] + constants_block(base_sha,\
        \ activated) + text[end:]\n\n    fn = functions()\n    for name in (\n        \"packageVoteTodayKey\",\"packageVotesToday\"\
        ,\"packageVoteRecent\",\n        \"packageVoteRemember\",\"packageVoteSelectChallenge\",\"packageVoteEnsureLoaded\"\
        ,\n        \"packageVoteAssetCard\",\"packageVoteSubmit\",\"renderPackageVote\",\n    ):\n        text = replace_function(text,\
        \ name, fn[name])\n\n    old_help = (\n        '<div class=\"vote-help-text\"><strong>Choose the trade side you would\
        \ rather receive.</strong> '\n        \"These votes help measure how much extra value a multi-player package needs\
        \ to match a more concentrated asset. \"\n        \"This is research-only and does not change the live trade result\
        \ yet.</div>\"\n    )\n    new_help = (\n        '<div class=\"vote-help-text\"><strong>Choose the trade side you\
        \ would rather receive.</strong> '\n        \"These V7 research votes test how asset concentration changes preference\
        \ when both sides contain multiple players. \"\n        \"Player values are hidden, and these votes do not change\
        \ the live trade result.</div>\"\n    )\n    if old_help not in text:\n        raise RuntimeError(\"package vote help\
        \ copy marker drift\")\n    return text.replace(old_help, new_help, 1)\n\ndef patch_ktc(text: str) -> str:\n    if\
        \ PREFIX in text:\n        raise RuntimeError(\"V7 development prefix already present before activation\")\n    m\
        \ = re.search(r'PACKAGE_VOTE_PREFIXES\\s*=\\s*\\((.*?)\\)\\n', text, flags=re.S)\n    if not m:\n        raise RuntimeError(\"\
        missing PACKAGE_VOTE_PREFIXES tuple\")\n    body = m.group(1).rstrip()\n    if not body.endswith(\",\"):\n       \
        \ body += \",\"\n    body += ' \"__pkgv7dev__|\",'\n    return text[:m.start(1)] + body + text[m.end(1):]\n\ndef write_manifest(base_sha:\
        \ str, activated: str):\n    cat = read_json(CATALOG)\n    power = read_json(POWER)\n    manifest = {\n        \"\
        schema_version\": 1,\n        \"study_id\": \"package-adjustment-v7-multi-v-multi\",\n        \"stage\": \"development_voting_activation\"\
        ,\n        \"status\": \"V7_DEVELOPMENT_VOTING_ACTIVATED\",\n        \"activated_at_utc\": activated,\n        \"\
        valid_ballot_start_utc\": activated,\n        \"research_only\": True,\n        \"production_change_authorized\":\
        \ False,\n        \"candidate_fit_performed\": False,\n        \"candidate_scores_read\": False,\n        \"v7_vote_outcomes_read_at_activation\"\
        : False,\n        \"source_catalog_commit\": base_sha,\n        \"catalog\": {\n            \"path\": \"research/package-adjustment-v7/package_vote_challenges_v7_development_v1.json\"\
        ,\n            \"sha256\": sha256(CATALOG),\n            \"challenge_count\": cat[\"challenge_count\"],\n        \
        \    \"topology_counts\": cat[\"diagnostics\"][\"topology_counts\"],\n            \"candidate_predictions_used_for_selection\"\
        : False,\n            \"fv_visible_to_voter\": False,\n        },\n        \"maturity_contract\": {\n            \"\
        first_checkpoint_distinct_voters\": power[\"selected_first_checkpoint_distinct_voters\"],\n            \"minimum_distinct_voters_per_challenge\"\
        : power[\"coverage_gate_at_or_after_first_checkpoint\"][\"minimum_distinct_voters_per_challenge\"],\n            \"\
        hard_cap_distinct_voters\": power[\"hard_cap_distinct_voters\"],\n            \"stopping_may_use_vote_direction\"\
        : False,\n            \"stopping_may_use_candidate_performance\": False,\n        },\n        \"transport\": {\n \
        \           \"vote_prefix\": PREFIX,\n            \"meta_prefix\": META_PREFIX,\n            \"schema_marker\": SCHEMA_MARKER,\n\
        \            \"canonical_choices\": [\"A\",\"B\"],\n            \"canonical_left_sides\": [\"A\",\"B\"],\n       \
        \     \"one_vote_per_voter_per_challenge_analysis_rule\": \"first valid post-activation row only\",\n            \"\
        browser_daily_limit\": 40,\n            \"all_40_one_session_supported\": True,\n        },\n        \"browser_sampling\"\
        : {\n            \"challenge_order\": \"deterministic pseudorandom permutation keyed by voter id; each of 40 shown\
