name: B49 V1 - Projected Production Bands Display Only Release

# Post-B48 presentation-only release. Independent Claude pre-run review required.
# B46/B47 frozen evidence remains frozen. Verify runs write no repository files.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify first. Deploy only after separate owner approval.
        required: true
        type: choice
        default: verify
        options:
          - verify
          - deploy
      attestation:
        description: Exact B49 display-only owner authorization (deploy only)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  b49_display_bands:
    name: B49 V1 frozen tier-to-display-band overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MODE: ${{ inputs.mode }}
      OWNER_ATTEST: ${{ inputs.attestation }}
    steps:
      - name: Checkout current main with frozen history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up standard Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Initialize temporary workspace and enforce authorization gate
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          printf 'B49_STAGE=%s/b49-stage\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$MODE" = verify -o "$MODE" = deploy
          if [ "$MODE" = deploy ]; then
            test "$OWNER_ATTEST" = 'I_AUTHORIZE_B49_V1_DISPLAY_ONLY_PRODUCTION_BAND_LABELS_WITH_NO_FROZEN_MODEL_OR_FV_CHANGES'
          else
            test -z "$OWNER_ATTEST"
          fi
          echo "B49_BASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install fixed B49 page renderer
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/b49_v1.py" <<'PYB49'
          #!/usr/bin/env python3
          """B49 V1 — deterministic, reversible presentation-only band label overlay."""
          import argparse
          import hashlib
          import json
          from pathlib import Path

          SOURCE_PAGE_SHA256 = '749d0381749496d34bac6e7d050253e7ea699ab5d00be6dd728ea2d1dfc98042'
          PINNED_GIT_BLOBS = {
              'player-role-v2.html': '6fe5997148868dac8efb9596220ccd00a28a5707',
              'data/player_role_v2_week5.json': '248912dfa0fede2b74824ec67df50c613f542f57',
              'research/player-role-v2/b47_v1_production_decision.json': '4707016a7e1690005281f0a711bb03b53d1166bf',
              'research/player-role-v2/player_role_v2_b46_v1r2_scientific_decision.json': 'e1951559d6c65056c61dc541ade470e135bdc84f',
              'research/player-role-v2/player_role_v2_b41e_tier_derivation_contract.json': 'c1961f0006813b346f2a59838152206e064b39dc',
              'research/player-role-v2/player_role_v2_b41c_model_development_preregistration.json': '669eb6ed92c6309029979bbfdf336d74885e6919',
              '.github/workflows/B48-v1-player-role-v2-meaning-identity-fullpool-fv-shadow-audit.yml': '1b8b2c6a6fb34a1d279193c7f23d3f8908a5db48',
          }
          ROLE_ORDER = ('Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite')
          DISPLAY = {
              'Speculative': 'Bottom Band',
              'Depth': 'Low Band',
              'Understudy': 'Lower-Middle Band',
              'Rotational': 'Middle Band',
              'Starter': 'Upper-Middle Band',
              'Every-Down': 'High Band',
              'Elite': 'Top Band',
          }
          MODELS = ('QB','RB','WR','TE','DL','LB','DB','K')
          PAGE_PATH = 'player-role-v2.html'
          MANIFEST_PATH = 'research/player-role-v2/b49_v1_display_label_manifest.json'
          DECISION_PATH = 'research/player-role-v2/b49_v1_display_label_decision.json'
          EXPLANATION = ("Seven ordered, position-specific bands of the model's forecast of a player's rank "
              "among same-position players in fantasy points per active game over the next four active games. "
              "Bands are not equal-sized. They do not indicate starting status, snap share, injury risk, "
              "dynasty value, or a calibrated probability.")
          JS_MAP = "const B49_BAND_LABELS=Object.freeze({" + ','.join(json.dumps(k)+':'+json.dumps(v) for k,v in DISPLAY.items()) + "});\n" + (
              "function b49Band(t){if(!Object.prototype.hasOwnProperty.call(B49_BAND_LABELS,t))throw new Error('Unknown frozen production band');return B49_BAND_LABELS[t]}\n")
          PATCHES = [
              ('<title>Player Role V2 · Week 5 | LOG Trade Desk</title>',
               '<title>Role V2 · Projected Production Bands · Week 5 | LOG Trade Desk</title>'),
              ('<h1>Player Role V2</h1>', '<h1>Player Role V2 · Projected Production Bands</h1>'),
              ('2026 NFL · through completed Week 5 · observational role signals, not live depth charts.',
               '2026 NFL · frozen Week 5 · relative projected production, not playing-time or dynasty-value tiers.'),
              ('<label>Role tier<select id="tier"><option value="">All roles</option></select></label>',
               '<label>Production band<select id="tier"><option value="">All bands</option></select></label>'),
              ('<div class="filters"><label>Search player',
               '<div class="note"><strong>What these bands mean.</strong> '+EXPLANATION+'</div>\n<div class="filters"><label>Search player'),
              ("let all=[];\nfor(const p of ['QB'", "let all=[];\n/* B49_PRODUCTION_BAND_DISPLAY_ONLY_BEGIN */\n"+JS_MAP+"/* B49_PRODUCTION_BAND_DISPLAY_ONLY_END */\nfor(const p of ['QB'"),
              ("o.value=t;o.textContent=t;tierSelect.appendChild(o)",
               "o.value=t;o.textContent=b49Band(t);tierSelect.appendChild(o)"),
              ("tier.textContent=p.role_tier;card.appendChild(tier)",
               "tier.textContent=b49Band(p.role_tier);card.appendChild(tier)"),
              ("all=d.players;\n  draw();", "if(!d.players.every(p=>Object.prototype.hasOwnProperty.call(B49_BAND_LABELS,p.role_tier)))throw new Error('Unknown frozen production band');\n  all=d.players;\n  draw();"),
              ('No new model fitting or outcome-based retuning occurred during B47.</footer>',
               'No new model fitting or outcome-based retuning occurred during B47. B49 changes display labels only.</footer>'),
          ]


          def gate(ok, message):
              if not ok:
                  raise RuntimeError('B49_STOP_' + message)


          def sha(data):
              return hashlib.sha256(data).hexdigest()


          def git_blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()


          def serialize(obj):
              return (json.dumps(obj, indent=2, sort_keys=True, ensure_ascii=False)+'\n').encode('utf-8')


          def render(old):
              gate(sha(old)==SOURCE_PAGE_SHA256,'UNEXPECTED_FROZEN_B47_SOURCE_PAGE_SHA256')
              text=old.decode('utf-8')
              gate('B49_PRODUCTION_BAND_DISPLAY_ONLY_BEGIN' not in text,'ALREADY_B49_LABELLED')
              for before,after in PATCHES:
                  gate(text.count(before)==1,'PATCH_ANCHOR_AMBIGUOUS_'+str(PATCHES.index((before,after))))
                  text=text.replace(before,after,1)
              out=text.encode('utf-8')
              # Every modified byte is reversibly attributable to a documented display replacement.
              restored=out.decode('utf8')
              for before,after in reversed(PATCHES):
                  gate(restored.count(after)==1,'REVERSE_PATCH_ANCHOR_AMBIGUOUS')
                  restored=restored.replace(after,before,1)
              gate(restored.encode('utf8')==old,'NOT_BYTE_REVERSIBLE')
              gate("p.role_tier===tierSelect.value" in text,'FILTER_MACHINE_ID_MUTATED')
              gate("fetch('./data/player_role_v2_week5.json',{cache:'no-store'})" in text,'FROZEN_SNAPSHOT_ROUTE_CHANGED')
              gate("tier.textContent=b49Band(p.role_tier)" in text,'DISPLAY_NOT_APPLIED')
              gate("o.value=t;o.textContent=b49Band(t)" in text,'FILTER_VALUES_CHANGED')
              gate("role_tier===tierSelect.value" not in text or "p.role_tier===tierSelect.value" in text,'FILTER_CONTRACT')
              return out


          def validate_sources(repo):
              for path,expected in PINNED_GIT_BLOBS.items():
                  f=repo/path
                  gate(f.is_file(),'MISSING_SOURCE_'+path)
                  gate(git_blob(f.read_bytes())==expected,'SOURCE_GIT_BLOB_CHANGED_'+path)
              d=json.loads((repo/'research/player-role-v2/b47_v1_production_decision.json').read_text())
              gate(d['production_change_authorized'] is True,'B47_NOT_DEPLOYED')
              gate(d['production_change_scope']=='STATIC_ROLE_EXPLORER_AND_SINGLE_TRADE_DESK_NAV_LINK_ONLY','B47_SCOPE_DRIFT')
              gate(d['production_fundamental_value_changed'] is False,'B47_FV_SCOPE_DRIFT')
              b46=json.loads((repo/'research/player-role-v2/player_role_v2_b46_v1r2_scientific_decision.json').read_text())
              gate(b46['result']=='PASS_B46_V1_FRESH_WEEK_ACCEPTANCE' and b46['all_primary_gates_pass'] is True,'FROZEN_B46_GATE')
              b41e=json.loads((repo/'research/player-role-v2/player_role_v2_b41e_tier_derivation_contract.json').read_text())
              b41c=json.loads((repo/'research/player-role-v2/player_role_v2_b41c_model_development_preregistration.json').read_text())
              gate(tuple(b41e['role_order'])==ROLE_ORDER and tuple(b41c['tier_policy']['role_labels'])==ROLE_ORDER,'FROZEN_TIER_ORDER_DRIFT')
              gate('next four active games' in b41c['frozen_target']['primary_target'],'TARGET_SEMANTICS_DRIFT')
              j=json.loads((repo/'data/player_role_v2_week5.json').read_text())
              gate(j['schema_version']==1 and j['season']==2026 and j['week']==5 and len(j['players'])==1450,'SNAPSHOT_SCHEMA_DRIFT')
              gate(set(p['role_tier'] for p in j['players'])==set(ROLE_ORDER),'MISSING_OR_UNKNOWN_TIER')
              gate(all(p['role_tier'] in DISPLAY for p in j['players']),'UNMAPPED_TIER')
              gate(len(set(str(p['sleeper_id']) for p in j['players']))==1450,'SNAPSHOT_IDENTITY_DRIFT')
              return j


          def build(repo,stage,mode):
              gate(mode in ('verify','deploy'),'INVALID_MODE')
              validate_sources(repo)
              gate(not (repo/MANIFEST_PATH).exists() and not (repo/DECISION_PATH).exists(),'B49_ALREADY_DEPLOYED')
              before=(repo/PAGE_PATH).read_bytes()
              page=render(before)
              manifest={
                  'study':'B49 V1','scope':'EXPLORER_DISPLAY_STRINGS_ONLY', 'source':'B47 V1 Week5 snapshot unchanged',
                  'frozen_tier_order':list(ROLE_ORDER),'proposed_display_band_labels':DISPLAY,
                  'snapshot_2026_week':5,'model_thresholds_changed':False,
                  'model_coefficients_changed':False,'fundamental_value_changed':False,'market_value_changed':False,
                  'package_adjustment_changed':False,'trade_verdict_changed':False,
                  'index_html_changed':False,'frozen_role_snapshot_changed':False,
                  'freeze_source_blobs':PINNED_GIT_BLOBS,
                  'source_page_sha256':sha(before),'renamed_page_sha256':sha(page),
                  'patch_count':len(PATCHES),'patch_is_byte_reversible':True,
                  'semantic_text':EXPLANATION,'production_band_probabilities_calibrated':False,
              }
              decision={'study':'B49 V1','classification':'DISPLAY_LABEL_ONLY_NOT_MODEL_OR_VALUATION_CHANGE',
                        'mode':mode,'production_display_label_change_authorized':mode=='deploy',
                        'fundamental_value_change_authorized':False,
                        'release_scope':'player-role-v2.html_PLUS_TWO_B49_RESEARCH_MANIFESTS_ONLY',
                        'next_step':'VERIFY_PAGES_AND_BROWSER_AFTER_DEPLOY_IF_AUTHORIZED',
                        'manifest_sha256':sha(serialize(manifest))}
              outputs={PAGE_PATH:page,MANIFEST_PATH:serialize(manifest),DECISION_PATH:serialize(decision)}
              for path,data in outputs.items():
                  dest=stage/path
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
              report={'result':'PASS_B49_V1_DISPLAY_ONLY_CANDIDATE','mode':mode,
                      'no_production_write_in_verify':mode=='verify',
                      'snapshot_players':1450,'renamed_tiers':len(ROLE_ORDER),
                      'changes_to_fv_or_trade_verdicts':False,
                      'output_hashes':{k:sha(v) for k,v in outputs.items()}}
              (stage/'b49_verification_report.json').write_bytes(serialize(report))
              return report


          def selftest():
              import ast
              sample=Path(__file__).parent / '_b49_source_page.html'
              if sample.exists():
                  content=sample.read_bytes()
                  gate(sha(content)==SOURCE_PAGE_SHA256,'SELFTEST_SOURCE_SHA')
                  page=render(content)
                  gate(sha(page)!=sha(content),'NO_CHANGE')
              gate(tuple(DISPLAY)==ROLE_ORDER,'DISPLAY_ORDER_DRIFT')
              gate(len(set(DISPLAY.values()))==7,'DISPLAY_DUPLICATE_NAMES')
              gate(DISPLAY['Rotational']=='Middle Band','HERBERT_LABEL_GATE')
              print('PASS: B49 model tier mapping is reversible and semantics-only.')


          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument('--repo',type=Path,default=Path('.'))
              ap.add_argument('--stage',type=Path)
              ap.add_argument('--mode',choices=('verify','deploy'),default='verify')
              ap.add_argument('--selftest',action='store_true')
              a=ap.parse_args()
              if a.selftest:
                  selftest();return
              gate(a.stage is not None,'STAGE_REQUIRED')
              a.stage.mkdir(parents=True,exist_ok=True)
              print(json.dumps(build(a.repo,a.stage,a.mode),indent=2,sort_keys=True))

          if __name__=='__main__':
              main()
          PYB49
          python3 -m py_compile "$RUNNER_TEMP/b49_v1.py"
          python3 "$RUNNER_TEMP/b49_v1.py" --selftest

      - name: Pin B46 B47 and B48 frozen sources and generate reversible page candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/b49_v1.py" --repo . --stage "$B49_STAGE" --mode "$MODE"
          test -f "$B49_STAGE/player-role-v2.html"
          test -f "$B49_STAGE/research/player-role-v2/b49_v1_display_label_manifest.json"
          test -f "$B49_STAGE/research/player-role-v2/b49_v1_display_label_decision.json"
          python3 - <<'PYAUDIT'
          import json,os
          from pathlib import Path
          s=Path(os.environ['B49_STAGE'])
          d=json.loads((s/'research/player-role-v2/b49_v1_display_label_decision.json').read_text())
          r=json.loads((s/'b49_verification_report.json').read_text())
          m=json.loads((s/'research/player-role-v2/b49_v1_display_label_manifest.json').read_text())
          assert r['result']=='PASS_B49_V1_DISPLAY_ONLY_CANDIDATE'
          assert r['changes_to_fv_or_trade_verdicts'] is False
          assert m['frozen_role_snapshot_changed'] is False
          assert m['fundamental_value_changed'] is False
          assert m['model_thresholds_changed'] is False
          assert m['model_coefficients_changed'] is False
          assert d['production_display_label_change_authorized'] is (os.environ['MODE']=='deploy')
          assert d['fundamental_value_change_authorized'] is False
          print('PASS: B49 exact release impact and authorization gates')
          PYAUDIT

      - name: Verify static browser JavaScript and no unsafe name rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYJS'
          import os,re
          from pathlib import Path
          old=Path('player-role-v2.html').read_text()
          new=(Path(os.environ['B49_STAGE'])/'player-role-v2.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',new,re.DOTALL)
          assert len(scripts)==1
          js=scripts[0]
          assert 'innerHTML' not in js
          assert 'tier.textContent=b49Band(p.role_tier)' in js
          assert 'o.value=t;o.textContent=b49Band(t)' in js
          assert 'p.role_tier===tierSelect.value' in js
          assert "fetch('./data/player_role_v2_week5.json',{cache:'no-store'})" in js
          assert 'B49_PRODUCTION_BAND_DISPLAY_ONLY_BEGIN' not in old
          assert 'B49_PRODUCTION_BAND_DISPLAY_ONLY_BEGIN' in new
          Path(os.environ['RUNNER_TEMP'],'b49_static.js').write_text(js)
          print('PASS: original model-tier filter keys preserved, names and bands textContent-only')
          PYJS
          node --check "$RUNNER_TEMP/b49_static.js"

      - name: Upload B49 scoped release candidate and verification report
        uses: actions/upload-artifact@v4
        with:
          name: B49-V1-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/b49-stage/
          if-no-files-found: error
          retention-days: 30

      - name: Commit exactly three authorized B49 display artifacts
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B49_BASE_COMMIT"
          test ! -e research/player-role-v2/b49_v1_display_label_manifest.json
          test ! -e research/player-role-v2/b49_v1_display_label_decision.json
          mapfile -t ALLOWED <<'EOFALLOWED'
          player-role-v2.html
          research/player-role-v2/b49_v1_display_label_decision.json
          research/player-role-v2/b49_v1_display_label_manifest.json
          EOFALLOWED
          for f in "${ALLOWED[@]}"; do
            mkdir -p "$(dirname "$f")"
            cp "$B49_STAGE/$f" "$f"
          done
          python3 - <<'PYBOUNDARY'
          import importlib.util,os,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('b49',Path(os.environ['RUNNER_TEMP'])/'b49_v1.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          before=subprocess.check_output(['git','show','HEAD:player-role-v2.html'])
          actual=Path('player-role-v2.html').read_bytes()
          assert actual==module.render(before), 'B49 unexpected release page change'
          assert module.sha(before)==module.SOURCE_PAGE_SHA256
          assert actual != before
          print('PASS: production HTML exactly equals reversible, audited B49 display-only replacement')
          PYBOUNDARY
          git add -- "${ALLOWED[@]}"
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' "${ALLOWED[@]}" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$B49_BASE_COMMIT"
          git config user.name b49-display-bands-bot
          git config user.email actions@users.noreply.github.com
          git commit -m 'B49 V1 display-only projected production band labels'
          git push origin HEAD:main
          echo 'B49: repository release committed; Pages and live browser checks are separate.'

      - name: Recheck committed B49 release and remote head
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          mapfile -t ALLOWED <<'EOFALLOWED'
          player-role-v2.html
          research/player-role-v2/b49_v1_display_label_decision.json
          research/player-role-v2/b49_v1_display_label_manifest.json
          EOFALLOWED
          for f in "${ALLOWED[@]}"; do cmp -s "$f" "$B49_STAGE/$f"; done
          python3 - <<'PYEND'
          import json
          from pathlib import Path
          d=json.loads(Path('research/player-role-v2/b49_v1_display_label_decision.json').read_text())
          assert d['production_display_label_change_authorized'] is True
          assert d['fundamental_value_change_authorized'] is False
          print('PASS: B49 scoped release durable, no FV adoption; verify GitHub Pages and browser separately')
          PYEND
