name: Durability V2 Phase 2 Candidate Evaluation

# Research-only cross-validated next-season availability evaluation.
# Does not change deployed durability, production history, or player values.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  candidate-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Phase 2 self-test
        run: python3 research/durability-v2/durability_v2_phase2_candidate_evaluation.py --selftest

      - name: Evaluate Durability V2 candidates
        run: python3 research/durability-v2/durability_v2_phase2_candidate_evaluation.py --write

      - name: Verify Phase 2 outputs
        run: python3 research/durability-v2/durability_v2_phase2_candidate_evaluation.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/durability-v2/durability_v2_phase2_candidate_evaluation.json
          git add research/durability-v2/durability_v2_phase2_candidate_evaluation.md
          git diff --staged --quiet || git commit -m "Add Durability V2 Phase 2 candidate evaluation"
          git push
