          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          p = root / "schedule_utility_v1_phase2b_zero_fill_validity_audit.json"
          a = json.loads(p.read_text(encoding="utf-8"))

          assert a["status"] in {
              "PASS_POSTRUN_ZERO_FILL_VALIDITY_STOP_ROBUST",
              "HOLD_V1_CLOSEOUT_POSTRUN_VALIDITY_CONCERN",
          }
          assert a["outcome_awareness"][
              "historical_outcomes_already_consumed_before_this_audit"
          ] is True
          assert a["outcome_awareness"]["audit_is_non_gating"] is True
          assert a["outcome_awareness"]["may_convert_v1_stop_to_pass"] is False
          assert a["outcome_awareness"]["may_authorize_phase3"] is False
          assert a["outcome_awareness"]["may_authorize_production"] is False
          assert a["outcome_awareness"][
              "may_retune_predictor_or_thresholds"
          ] is False
          assert a["frozen_b31"]["decision"] == (
              "STOP_RETROSPECTIVE_PREDICTIVE_VALIDATION"
          )
          assert a["production_change_authorized"] is False
          assert a["phase3_shadow_authorized"] is False
          assert a["v1_stop_can_be_reclassified_as_pass"] is False
          assert a["conclusion"]["original_b31_stop_remains_binding"] is True

          z = a["zero_fill_audit"]
          s = a["shared_weeks_4_16_symmetry"]
          sens = a["non_gating_sensitivities"]

          lines = [
              "# Schedule Utility V1 — Post-Run Zero-Fill Validity Audit",
              "",
              f"**Audit decision:** `{a['status']}`",
              "",
              "This is an outcome-aware, non-gating validity audit. "
              "It cannot convert the frozen B31 STOP into PASS.",
              "",
              "## Frozen B31 replay",
              "",
              f"- Exact primary replay matches B31: "
              f"`{a['source_replay']['replay_matches_frozen_b31']}`",
              f"- Replayed decision: "
              f"`{a['source_replay']['replayed_primary']['decision']}`",
              "",
              "## Zero-fill validity",
              "",
              f"- Target zero-fill records: `{z['target_zero_fill_record_count']}`",
              f"- QB/RB zero-fill keys: "
              f"`{z['distinct_qb_rb_target_zero_keys_across_scoring_modes']}`",
              f"- Frozen AMD-4 rule violations: `{z['rule_violation_count']}`",
              "",
              "## Predictor/target symmetry, Weeks 4-16",
              "",
              f"- Point mismatches: "
              f"`{s['target_vs_predictor_point_mismatch_count']}`",
              f"- Zero-fill identity mismatch groups: "
              f"`{s['zero_fill_identity_mismatch_group_count']}`",
              "",
              "## Non-gating sensitivities",
              "",
              f"- Excluding ALL target zero fills: "
              f"`{sens['exclude_all_target_zero_filled_rows'].get('decision')}`",
              f"- Excluding QB/RB target zero fills: "
              f"`{sens['exclude_qb_rb_target_zero_filled_rows'].get('decision')}`",
              f"- Both remain STOP: `{sens['both_remain_stop']}`",
              "",
              "## Governance",
              "",
              "- Original B31 STOP remains binding regardless of sensitivity results.",
              "- No Phase 3 authorization.",
              "- No production authorization.",
              "- No V1 retuning or threshold change.",
              "",
          ]

          # Public game/team zero-fill identities are safe to include.
          lines += ["## Zero-fill records", ""]
          for rec in z["records"]:
              lines.append(
                  f"- {rec['season']} W{rec['week']} {rec['game_id']} · "
                  f"{rec['offense_team']} · {rec['position']} · "
                  f"{rec['scoring_mode']} · AMD-4 pass="
                  f"{rec['all_frozen_amd4_checks_pass']}"
              )
          lines.append("")

          (root / "schedule_utility_v1_phase2b_zero_fill_validity_audit.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )

          print("Audit decision:", a["status"])
          print("B31 replay match:", a["source_replay"]["replay_matches_frozen_b31"])
          print("Zero-rule violations:", z["rule_violation_count"])
          print(
              "Shared point mismatches:",
              s["target_vs_predictor_point_mismatch_count"],
          )
          print("All-zero sensitivity:", sens[
              "exclude_all_target_zero_filled_rows"
          ].get("decision"))
          print("QB/RB-zero sensitivity:", sens[
              "exclude_qb_rb_target_zero_filled_rows"
          ].get("decision"))
          PY

      - name: Guard production and raw-data persistence
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
          test -z "$(git diff --name-only -- index.html free-agent-board.html)"

          if find research/schedule-utility-v1 -maxdepth 1 -type f \
            \( -name '*.csv' -o -name '*.csv.gz' -o -name '*.parquet' \) \
            -print -quit | grep -q .; then
            echo "Raw historical source leakage detected."
            exit 1
          fi

      - name: Commit frozen post-run validity audit
        shell: bash
        run: |
          set -euo pipefail

          git add \
            research/schedule-utility-v1/schedule_utility_v1_phase2b_zero_fill_validity_audit.py \
            research/schedule-utility-v1/schedule_utility_v1_phase2b_zero_fill_validity_audit.json \
            research/schedule-utility-v1/schedule_utility_v1_phase2b_zero_fill_validity_audit.md

          if git diff --cached --quiet; then
            echo "Post-run zero-fill audit already frozen; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Schedule Utility V1 post-run zero-fill validity audit"
          git push origin HEAD:main

      - name: Closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(
              Path(
                  "research/schedule-utility-v1/"
                  "schedule_utility_v1_phase2b_zero_fill_validity_audit.json"
              ).read_text(encoding="utf-8")
          )
          print("=== B32A COMPLETE ===")
          print("Scientific audit status:", a["status"])
          print(
              "Supports proceeding to B32 closeout:",
              a["conclusion"]["validity_audit_supports_closeout"],
          )
          print("Original B31 STOP remains binding: True")
          print("Phase 3 authorized: False")
          print("Production authorized: False")
          PY
