            --out /tmp/schedule-utility-v1/current-preflight.json

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          def sha(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          frozen = json.loads(
              Path("/tmp/schedule-utility-v1/frozen/preflight.json")
              .read_text(encoding="utf-8")
          )
          current = json.loads(
              Path("/tmp/schedule-utility-v1/current-preflight.json")
              .read_text(encoding="utf-8")
          )

          frozen_hashes = frozen["source_snapshot_sha256"]
          mismatched_stat_seasons = []
          for season in range(2015, 2026):
              path = (
                  f"/tmp/schedule-utility-v1/stats/"
                  f"stats_player_week_{season}.csv"
              )
              if sha(path) != frozen_hashes["stats_player_week"][str(season)]:
                  mismatched_stat_seasons.append(season)

          semantic_fields = [
              "status",
              "metric_id",
              "seasons",
              "target_weeks",
              "schedule_audit",
              "player_stat_ingestion_audit",
              "aggregate_completeness_audit",
              "predictor_availability",
              "predictor_availability_failures",
              "timestamp_firewall",
              "structural_centering_diagnostic",
              "next_phase",
          ]
          semantic_mismatches = [
              field for field in semantic_fields
              if current.get(field) != frozen.get(field)
          ]

          aliases = {
              "ARZ":"ARI","BLT":"BAL","CLV":"CLE","HST":"HOU","JAC":"JAX",
              "LA":"LAR","LAR":"LAR","OAK":"LV","SD":"LAC","STL":"LAR",
              "WSH":"WAS",
          }
          def canon(x):
              s = str(x or "").strip().upper()
              return aliases.get(s, s)

          games = {}
          with open(
              "/tmp/schedule-utility-v1/games.csv",
              encoding="utf-8-sig",
              newline="",
          ) as f:
              for row in csv.DictReader(f):
                  try:
                      season = int(row["season"])
                      week = int(row["week"])
                  except (TypeError, ValueError):
                      continue
                  if not (2015 <= season <= 2025):
                      continue
                  if str(row.get("game_type", "")).upper() != "REG":
                      continue
                  gid = str(row.get("game_id", "")).strip()
                  if gid:
                      games[gid] = {
                          "season": season,
                          "week": week,
                          "away": canon(row.get("away_team")),
                          "home": canon(row.get("home_team")),
                      }

          reconciliation = {
              "checked_rows": 0,
              "game_id_missing": 0,
              "season_week_mismatch": 0,
              "team_membership_mismatch": 0,
              "opponent_mismatch": 0,
          }
          for season in range(2015, 2026):
              path = (
                  f"/tmp/schedule-utility-v1/stats/"
                  f"stats_player_week_{season}.csv"
              )
              with open(path, encoding="utf-8-sig", newline="") as f:
                  for row in csv.DictReader(f):
                      try:
                          s = int(row["season"])
                          w = int(row["week"])
                      except (TypeError, ValueError):
                          continue
                      if s != season:
                          continue
                      if str(row.get("season_type", "")).upper() not in {
                          "REG", "REGULAR"
                      }:
                          continue

                      reconciliation["checked_rows"] += 1
                      gid = str(row.get("game_id", "")).strip()
                      g = games.get(gid)
                      if g is None:
                          reconciliation["game_id_missing"] += 1
                          continue
                      if g["season"] != s or g["week"] != w:
                          reconciliation["season_week_mismatch"] += 1

                      team = canon(row.get("recent_team") or row.get("team"))
                      if team not in {g["away"], g["home"]}:
                          reconciliation["team_membership_mismatch"] += 1
                          continue

                      opp = row.get("opponent_team")
                      if opp not in (None, ""):
                          expected = (
                              g["home"] if team == g["away"] else g["away"]
                          )
                          if canon(opp) != expected:
                              reconciliation["opponent_mismatch"] += 1

          reconciliation_failures = sum(
              reconciliation[k]
              for k in (
                  "game_id_missing",
                  "season_week_mismatch",
                  "team_membership_mismatch",
                  "opponent_mismatch",
              )
          )

          current_games_sha = sha("/tmp/schedule-utility-v1/games.csv")
          passed = (
              not mismatched_stat_seasons
              and not semantic_mismatches
              and reconciliation_failures == 0
              and current["status"] ==
                  "PASS_PREDICTOR_ONLY_PREFLIGHT_READY_TO_UNSEAL_PHASE2_TARGETS"
          )

          result = {
              "status": (
                  "PASS_CURRENT_SCHEDULE_SEMANTIC_REAUTHORIZATION"
                  if passed
                  else "STOP_CURRENT_SCHEDULE_SEMANTIC_REAUTHORIZATION"
              ),
              "current_games_sha256": current_games_sha,
              "previous_b31a_games_sha256":
                  "d5cd27ca83bdd58cff08e0e03637d726c3b3ca3741708e81727dcaa7194d86ef",
              "games_bytes_changed_again":
                  current_games_sha !=
                  "d5cd27ca83bdd58cff08e0e03637d726c3b3ca3741708e81727dcaa7194d86ef",
              "all_11_player_stat_files_match_b30":
                  not mismatched_stat_seasons,
              "player_stat_mismatch_seasons":
                  mismatched_stat_seasons,
              "semantic_mismatches": semantic_mismatches,
              "schedule_stat_reconciliation": reconciliation,
          }

          Path("/tmp/schedule-utility-v1/source-reauth.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))

          if not passed:
              raise SystemExit(
                  "Current nflverse schedule bytes are not semantically "
                  "equivalent to the frozen B30/B31 evaluation inputs."
              )
          PY

