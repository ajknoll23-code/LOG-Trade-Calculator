# PREFLIGHTED: B26_DRAFT_CAPITAL_OUTLOOK_V2_FORMAL_CLOSURE_AND_FROZEN_SOURCE_ARCHIVE
name: B26 Draft Capital Outlook V2 - Formal Closure and Frozen-Source Archival Preservation

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b26_v2_formal_closure_and_archive:
    name: Close V2 permanently at neutral 1.00 and archive only the frozen B25 sources
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install frozen archival dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard terminal V1 V2 evidence and frozen B25 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          V1=Path("research/draft-capital-outlook-v1/b23/b23_manifest.json")
          B24=Path("research/draft-capital-outlook-v2/b24/b24_manifest.json")
          B25=Path("research/draft-capital-outlook-v2/b25/b25_manifest.json")
          B25P=Path("research/draft-capital-outlook-v2/b25/b25_phase0b_preregistration.json")
          for p in (V1,B24,B25,B25P):
              assert p.is_file(), p

          v1=json.loads(V1.read_text())
          b24=json.loads(B24.read_text())
          b25=json.loads(B25.read_text())
          p25=json.loads(B25P.read_text())

          assert v1["decision"]=="STOP_2027_DRAFT_CAPITAL_OUTLOOK_SOURCE_PATH_KEEP_NEUTRAL_1_00"
          assert v1["2027_capital_scalar_computed"] is False
          assert v1["2027_shadow_multiplier_computed"] is False
          assert v1["2027_class_scored"] is False
          assert v1["production_change_authorized"] is False

          assert b24["decision"]=="STOP_EXACT_WALTER_PATH_AUTHORIZE_V2_PHASE0B_ENSEMBLE_K60_SOURCE_AUDIT"
          assert b24["same_source_k60_feasible"] is False
          assert b24["same_source_k32_fallback_available"] is False
          assert b24["v2_predictor_target_association_authorized"] is False
          assert b24["2027_class_scored"] is False
          assert b24["production_change_authorized"] is False

          assert b25["decision"]=="STOP_V2_ENSEMBLE_SOURCE_PATH_KEEP_NEUTRAL_NO_ARCHITECTURE"
          assert b25["frozen_source_count"]==5
          assert b25["distinct_publisher_count"]==5
          assert b25["structurally_feasible_source_count"]==2
          assert b25["all_five_sources_structurally_feasible"] is False
          assert b25["b26_phase0c_architecture_freeze_authorized"] is False
          assert b25["player_identity_open_authorized"] is False
          assert b25["predictor_construction_authorized"] is False
          assert b25["v2_predictor_target_association_authorized"] is False
          assert b25["2027_class_scoring_authorized"] is False
          assert b25["production_change_authorized"] is False

          contract=p25["source_selection_contract"]
          assert contract["selection_method"]=="FROZEN_EXACT_SOURCE_SET"
          assert contract["minimum_independent_publishers_required"]==5
          assert contract["minimum_explicit_picks_per_source"]==32
          assert contract["source_substitution_allowed"] is False
          assert contract["source_addition_allowed_after_network_access"] is False
          assert contract["source_removal_allowed_after_network_access"] is False
          assert len(p25["sources"])==5
          assert len({x["publisher_domain"] for x in p25["sources"]})==5
          assert "K60" in p25["objective"]
          assert "32 explicit pick numbers" in p25["feasibility_rule"]

          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          print(json.dumps({
              "v1_manifest_sha256":sha(V1),
              "b24_manifest_sha256":sha(B24),
              "b25_manifest_sha256":sha(B25),
              "b25_preregistration_sha256":sha(B25P),
              "b25_frozen_source_count":len(p25["sources"]),
          },indent=2))
          print("PASS: V1/V2 terminal evidence and the exact frozen B25 source contract are intact.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B26 closure record before archival source access
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/draft-capital-outlook-v2/b26
          mkdir -p research/draft-capital-outlook-v2/b26/archive

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v2/b26")
          V1=Path("research/draft-capital-outlook-v1/b23/b23_manifest.json")
          B24=Path("research/draft-capital-outlook-v2/b24/b24_manifest.json")
          B25=Path("research/draft-capital-outlook-v2/b25/b25_manifest.json")
          B25P=Path("research/draft-capital-outlook-v2/b25/b25_phase0b_preregistration.json")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          p25=json.loads(B25P.read_text())
          frozen_sources=[
              {
                  "source_id":s["source_id"],
                  "publisher":s["publisher"],
                  "author":s["author"],
                  "publication_date":s["publication_date"],
                  "publisher_domain":s["publisher_domain"],
                  "pages":[{"role":p["role"],"url":p["url"]} for p in s["pages"]],
              }
              for s in p25["sources"]
          ]

          closure={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v2",
            "stage":"b26_formal_closure_preregistered_before_archival_recapture",
            "closure_decision":"CLOSE_V2_PERMANENTLY_KEEP_NEUTRAL_1_00_AUTHORIZE_V3_PREREGISTRATION_ONLY",
            "v2_closed_permanently":True,
            "draft_capital_outlook_multiplier":1.00,
            "v2_architecture_freeze_authorized":False,
            "v2_player_identity_open_authorized":False,
            "v2_predictor_construction_authorized":False,
            "v2_predictor_target_association_authorized":False,
            "v2_2027_class_scoring_authorized":False,
            "v2_production_change_authorized":False,
            "v3_preregistration_authorized":True,
            "v3_new_source_discovery_authorized_before_preregistration":False,
            "terminal_evidence":{
              "v1_b23_manifest_sha256":sha(V1),
              "v2_b24_manifest_sha256":sha(B24),
              "v2_b25_manifest_sha256":sha(B25),
              "v2_b25_preregistration_sha256":sha(B25P),
            },
            "frozen_hierarchy_resolution":[
              {"priority":1,"path":"exact_Walter_same_source_K60","result":"NOT_FEASIBLE_B24"},
              {"priority":2,"path":"frozen_five_source_ensemble_path","result":"NOT_FEASIBLE_B25_2_OF_5"},
              {"priority":3,"path":"Walter_same_source_K32_fresh_construct","result":"NOT_AVAILABLE_B24"},
              {"priority":4,"path":"STOP","result":"REACHED"},
            ],
            "design_limitations_recorded_without_reopening_v2":[
              {
                "id":"B25_K60_GATE_DEPTH_MISMATCH",
                "fact":"B25 described/gated a K60 ensemble path while the frozen structural source requirement was 32 explicit picks per source.",
                "implication":"B25 did not establish picks 33-60 availability. This is a V2 design limitation and may not be repaired inside V2 after the result.",
              },
              {
                "id":"B25_EXACT_FIVE_SOURCE_AND_RULE",
                "fact":"B25 required all five named independent publishers with no additions, removals, or substitutions.",
                "implication":"The rule was intentionally anti-shopping but brittle. It may inform a prospectively preregistered V3 sampling-frame design only; it may not be relaxed retroactively in V2.",
              },
              {
                "id":"B25_SOURCE_FAILURES_MAY_MIX_WORLD_AND_INSTRUMENT_LIMITS",
                "fact":"B25 observed mixed failure signatures including access-policy, metadata-marker, and structural-detection failures.",
                "implication":"Fresh measurement work may be useful for V3 instrument design but has zero authority to change the frozen B25 verdict or reopen V2.",
              },
            ],
            "post_closure_archive_contract":{
              "purpose":"Preserve the five already-frozen B25 source URLs near the original anchor window for future instrument research.",
              "source_set":"EXACTLY_B25_FROZEN_SOURCE_SET",
              "source_additions_allowed":False,
              "source_substitutions_allowed":False,
              "source_removals_allowed":False,
              "player_identity_parsing_allowed":False,
              "pick_or_position_parsing_allowed":False,
              "author_or_date_reclassification_allowed":False,
              "b25_verdict_change_authorized":False,
              "v2_reopen_authorized":False,
              "capture_failures_change_closure_decision":False,
              "capture_modes":["raw_http_response","best_effort_headless_browser_dom"],
              "frozen_sources":frozen_sources,
            },
            "next_authorized_work":"B27_V3_PREREGISTRATION_ONLY_FREEZE_ENUMERATION_QUALIFICATION_N_K_SELECTION_RULES_BEFORE_NEW_SOURCE_DISCOVERY",
          }

          path=O/"b26_closure_preregistration.json"
          path.write_text(json.dumps(closure,indent=2,sort_keys=True)+"\n")
          h=sha(path)
          (O/"b26_closure_preregistration.sha256").write_text(f"{h}  {path.name}\n")
          print(json.dumps({"closure_preregistration_sha256":h,"frozen_source_count":len(frozen_sources)},indent=2))
          PY

      - name: Archive only the five frozen B25 sources with zero decision authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,shutil,subprocess,time
          from datetime import datetime,timezone
          from pathlib import Path
          import requests

          O=Path("research/draft-capital-outlook-v2/b26")
          A=O/"archive"
          C=json.loads((O/"b26_closure_preregistration.json").read_text())
          expected=(O/"b26_closure_preregistration.sha256").read_text().split()[0]
          sha_bytes=lambda b: hashlib.sha256(b).hexdigest()
          assert sha_bytes((O/"b26_closure_preregistration.json").read_bytes())==expected

          contract=C["post_closure_archive_contract"]
          assert contract["source_set"]=="EXACTLY_B25_FROZEN_SOURCE_SET"
          assert contract["source_additions_allowed"] is False
          assert contract["source_substitutions_allowed"] is False
          assert contract["source_removals_allowed"] is False
          assert contract["player_identity_parsing_allowed"] is False
          assert contract["pick_or_position_parsing_allowed"] is False
          assert contract["b25_verdict_change_authorized"] is False
          assert contract["v2_reopen_authorized"] is False
          assert contract["capture_failures_change_closure_decision"] is False

          sources=contract["frozen_sources"]
          assert len(sources)==5
          assert len({s["publisher_domain"] for s in sources})==5

          sess=requests.Session()
          sess.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B26-Archive/1.0 (+post-study archival capture; no bypass)",
              "Accept":"text/html,application/xhtml+xml;q=0.9,*/*;q=0.5",
              "Accept-Language":"en-US,en;q=0.9",
          })

          browser=None
          for candidate in ("google-chrome","google-chrome-stable","chromium","chromium-browser"):
              p=shutil.which(candidate)
              if p:
                  browser=p
                  break

          records=[]
          seen_urls=[]
          for src in sources:
              for page in src["pages"]:
                  url=page["url"]
                  assert url not in seen_urls, url
                  seen_urls.append(url)
                  key=f"{src['source_id']}__{page['role']}"
                  rec={
                      "source_id":src["source_id"],
                      "publisher":src["publisher"],
                      "author":src["author"],
                      "frozen_publication_date":src["publication_date"],
                      "publisher_domain":src["publisher_domain"],
                      "role":page["role"],
                      "requested_url":url,
                      "capture_started_at_utc":datetime.now(timezone.utc).isoformat(),
                      "raw_http":{},
                      "rendered_dom":{},
                      "scientific_authority":"ARCHIVAL_ONLY_ZERO_AUTHORITY_TO_CHANGE_B25_OR_REOPEN_V2",
                  }

                  response=None
                  last_error=None
                  for delay in (0,3,9):
                      if delay:
                          time.sleep(delay)
                      try:
                          r=sess.get(url,timeout=60,allow_redirects=True)
                          response=r
                          if r.status_code in {408,425,429} or 500<=r.status_code<=599:
                              last_error=f"HTTP {r.status_code}"
                              response=None
                              continue
                          break
                      except requests.RequestException as e:
                          last_error=f"{type(e).__name__}: {e}"

                  if response is None:
                      rec["raw_http"]={
                          "captured":False,
                          "error":last_error or "unknown retrieval failure",
                      }
                  else:
                      raw=response.content
                      raw_path=A/f"{key}__raw.html"
                      raw_path.write_bytes(raw)
                      rec["raw_http"]={
                          "captured":True,
                          "status_code":response.status_code,
                          "final_url":response.url,
                          "bytes":len(raw),
                          "sha256":sha_bytes(raw),
                          "path":str(raw_path),
                      }

                  if browser is None:
                      rec["rendered_dom"]={
                          "captured":False,
                          "error":"no supported Chromium/Chrome executable found on runner",
                      }
                  else:
                      try:
                          cmd=[
                              browser,
                              "--headless=new",
                              "--no-sandbox",
                              "--disable-dev-shm-usage",
                              "--disable-gpu",
                              "--dump-dom",
                              url,
                          ]
                          cp=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=75,check=False)
                          dom=cp.stdout
                          if cp.returncode==0 and dom.strip():
                              dom_path=A/f"{key}__rendered.html"
                              dom_path.write_bytes(dom)
                              rec["rendered_dom"]={
                                  "captured":True,
                                  "browser_executable":browser,
                                  "returncode":cp.returncode,
                                  "bytes":len(dom),
                                  "sha256":sha_bytes(dom),
                                  "path":str(dom_path),
                              }
                          else:
                              rec["rendered_dom"]={
                                  "captured":False,
                                  "browser_executable":browser,
                                  "returncode":cp.returncode,
                                  "error":cp.stderr.decode("utf-8","replace")[-2000:],
                              }
                      except Exception as e:
                          rec["rendered_dom"]={
                              "captured":False,
                              "browser_executable":browser,
                              "error":f"{type(e).__name__}: {e}",
                          }

                  rec["capture_finished_at_utc"]=datetime.now(timezone.utc).isoformat()
                  records.append(rec)

          assert len(seen_urls)==sum(len(s["pages"]) for s in sources)
          assert len(records)==len(seen_urls)

          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v2",
              "stage":"b26_post_closure_frozen_source_archive",
              "closure_preregistration_sha256":expected,
              "capture_scope":"EXACTLY_FROZEN_B25_URLS_NO_NEW_SOURCE_DISCOVERY",
              "frozen_source_count":len(sources),
              "frozen_page_count":len(records),
              "browser_executable":browser,
              "records":records,
              "content_parsing_performed":False,
              "player_identity_parsing_performed":False,
              "pick_or_position_parsing_performed":False,
              "b25_verdict_change_authorized":False,
              "v2_reopen_authorized":False,
              "capture_failures_change_closure_decision":False,
          }
          (O/"b26_archive_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          print(json.dumps({
              "frozen_source_count":len(sources),
              "frozen_page_count":len(records),
              "raw_captures":sum(bool(r["raw_http"].get("captured")) for r in records),
              "rendered_captures":sum(bool(r["rendered_dom"].get("captured")) for r in records),
              "browser_executable":browser,
              "closure_unchanged":True,
          },indent=2))
          PY

      - name: Finalize immutable V2 closure manifest and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          O=Path("research/draft-capital-outlook-v2/b26")
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          prereg=O/"b26_closure_preregistration.json"
          archive=O/"b26_archive_manifest.json"
          assert prereg.is_file(), prereg
          assert archive.is_file(), archive

          C=json.loads(prereg.read_text())
          A=json.loads(archive.read_text())
          expected=(O/"b26_closure_preregistration.sha256").read_text().split()[0]
          assert sha(prereg)==expected

          assert C["closure_decision"]=="CLOSE_V2_PERMANENTLY_KEEP_NEUTRAL_1_00_AUTHORIZE_V3_PREREGISTRATION_ONLY"
          assert C["v2_closed_permanently"] is True
          assert C["draft_capital_outlook_multiplier"]==1.00
          assert C["v2_architecture_freeze_authorized"] is False
          assert C["v2_player_identity_open_authorized"] is False
          assert C["v2_predictor_construction_authorized"] is False
          assert C["v2_predictor_target_association_authorized"] is False
          assert C["v2_2027_class_scoring_authorized"] is False
          assert C["v2_production_change_authorized"] is False
          assert C["v3_preregistration_authorized"] is True
          assert C["v3_new_source_discovery_authorized_before_preregistration"] is False

          assert A["closure_preregistration_sha256"]==expected
          assert A["capture_scope"]=="EXACTLY_FROZEN_B25_URLS_NO_NEW_SOURCE_DISCOVERY"
          assert A["frozen_source_count"]==5
          assert A["content_parsing_performed"] is False
          assert A["player_identity_parsing_performed"] is False
          assert A["pick_or_position_parsing_performed"] is False
          assert A["b25_verdict_change_authorized"] is False
          assert A["v2_reopen_authorized"] is False
          assert A["capture_failures_change_closure_decision"] is False

          report=[
              "# Draft Capital Outlook V2 — B26 Formal Closure",
              "",
              "Decision: **CLOSE V2 PERMANENTLY — KEEP DRAFT CAPITAL OUTLOOK NEUTRAL AT 1.00**",
              "",
              "V2 is scientifically closed. B26 is a closure-and-archive workflow, not a rescue attempt and not an architecture phase.",
              "",
              "## Frozen hierarchy resolution",
              "",
              "1. Exact Walter same-source K60 — **NOT FEASIBLE (B24)**",
              "2. Frozen five-source ensemble path — **NOT FEASIBLE (B25: 2/5 structurally feasible)**",
              "3. Walter same-source K32 fresh construct — **NOT AVAILABLE (B24)**",
              "4. STOP — **REACHED**",
              "",
              "## Final V2 authority",
              "",
              "- Draft Capital Outlook multiplier: **1.00**",
              "- V2 architecture freeze authorized: **NO**",
              "- V2 player identities may be opened: **NO**",
              "- V2 predictor construction authorized: **NO**",
              "- V2 predictor-target association authorized: **NO**",
              "- 2027 scoring under V2 authorized: **NO**",
              "- Production change under V2 authorized: **NO**",
              "- V3 preregistration authorized: **YES**",
              "- New-source discovery before V3 preregistration: **NO**",
              "",
              "## Recorded V2 design limitations",
              "",
              "- **B25 K60/depth mismatch:** B25's objective referenced a K60 ensemble, but its frozen structural feasibility rule required 32 explicit picks per source. It therefore did not establish picks 33–60 availability. This is recorded as a limitation and is not repaired post hoc.",
              "- **Exact-five-source brittleness:** B25 intentionally required all five named publishers with no additions, removals, or substitutions. V3 may prospectively replace this with an objective sampling frame, but V2 may not be relaxed retroactively.",
              "- **Mixed measurement/transport failures:** B25 failures may reflect a mixture of real source limitations and instrument/transport limitations. Fresh instrument research belongs to V3 and cannot alter B25 or reopen V2.",
              "",
              "## Post-closure archival capture",
              "",
              f"B26 attempted archival capture of exactly **{A['frozen_source_count']} frozen B25 sources / {A['frozen_page_count']} frozen pages**.",
              f"Raw HTTP captures succeeded for **{sum(bool(r['raw_http'].get('captured')) for r in A['records'])}/{A['frozen_page_count']}** pages.",
              f"Best-effort rendered DOM captures succeeded for **{sum(bool(r['rendered_dom'].get('captured')) for r in A['records'])}/{A['frozen_page_count']}** pages.",
              "These are post-B25 archival observations with **zero authority** to change the B25 verdict or reopen V2.",
              "",
              "## Next authorized step",
              "",
              "**B27 may preregister V3 only.** It must freeze the source-enumeration protocol, qualification rules, and N/K availability-selection rules before discovering any new 2027 sources.",
          ]
          report_path=O/"b26_closure_report.md"
          report_path.write_text("\n".join(report)+"\n")

          manifest={
              "schema_version":1,
              "study_id":"draft-capital-outlook-v2",
              "stage":"b26_manifest",
              "b26_executed":True,
              "b26_execution_count_committed":1,
              "decision":C["closure_decision"],
              "v2_closed_permanently":True,
              "draft_capital_outlook_multiplier":1.00,
              "v2_architecture_freeze_authorized":False,
              "v2_player_identity_open_authorized":False,
              "v2_predictor_construction_authorized":False,
              "v2_predictor_target_association_authorized":False,
              "v2_2027_class_scoring_authorized":False,
              "v2_production_change_authorized":False,
              "v3_preregistration_authorized":True,
              "v3_new_source_discovery_authorized_before_preregistration":False,
              "b25_k60_depth_mismatch_recorded":True,
              "post_closure_archive_can_change_b25":False,
              "post_closure_archive_can_reopen_v2":False,
              "output_hashes":{
                  "b26_closure_preregistration.json":sha(prereg),
                  "b26_archive_manifest.json":sha(archive),
                  "b26_closure_report.md":sha(report_path),
              },
          }
          mp=O/"b26_manifest.json"
          mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          hash_files=[prereg,archive,report_path,mp]
          (O/"b26_hashes.sha256").write_text("".join(f"{sha(p)}  {p.name}\n" for p in hash_files))
          print(json.dumps(manifest,indent=2))
          PY

      - name: Run repository regression after B26 closure artifacts
        shell: bash
        run: |
          set -euo pipefail

          ROOT="research/draft-capital-outlook-v2/b26"
          PRESERVE_DIR="$(mktemp -d)"
          PRESERVE_ARCHIVE="$PRESERVE_DIR/b26.tar"

          tar -C "$ROOT" -cf "$PRESERVE_ARCHIVE" .

          restore_b26() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$PRESERVE_ARCHIVE"
            rm -rf "$PRESERVE_DIR"
          }
          trap restore_b26 EXIT

          python3 scripts/validation/repo_regression_checks.py

          restore_b26
          trap - EXIT

      - name: Commit B26 formal closure and archival artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v2/b26
          git diff --cached --check -- . ':(exclude)research/draft-capital-outlook-v2/b26/archive/*.html'
          if git diff --cached --quiet; then
            echo "No B26 changes to commit."
            exit 1
          fi
          git commit -m "B26 formally close Draft Capital Outlook V2"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final clean-state confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "B26 complete. Draft Capital Outlook V2 is permanently closed at neutral 1.00; only V3 preregistration is authorized next."
