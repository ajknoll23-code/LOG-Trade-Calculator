name: CAL26 V1R73 - Live FV Empirical Peer Numerical Review (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r73-shadow-peer-numerical-fv
  cancel-in-progress: false
jobs:
  empirical-peer-fv-numerical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout immutable live FV JavaScript (read only)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Download verified R72 source artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R72_518_NATIVE_FV_FORMULA_REPLAY_AND_SENSITIVITY_FV_HOLD
        run-id: 40102341863
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r73-inputs/R72
    - name: Download verified R69 source artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R69_WEEK6_ROS_EMPIRICAL_HOLDOUT_RESEARCH_FV_HOLD
        run-id: 40098428241
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r73-inputs/R69
    - name: Download verified R64 source artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R64_2026_WEEK6_SEVEN_POSITION_LOG_OBSERVATIONS_FV_HOLD
        run-id: 40064881274
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r73-inputs/R64
    - name: Empirical no-arbitrary-scale peer numerical review; exact native JS shadow; reject drift
      shell: bash
      run: |-
        set -euo pipefail
        cat > "$RUNNER_TEMP/CAL26_R73_engine.py" <<'PY_R73_ENGINE'
        #!/usr/bin/env python3
        """CAL26 R73 empirical 2026-year0 peer-band shadow repricing, never deploy.
        The fit target is the deployed historical production-multiplier distribution,
        not verified dynasty market price or multi-year FV. This is a review aid ONLY.
        """
        import argparse,csv,hashlib,json,pathlib,re,subprocess,sys,collections,math,statistics,bisect
        ROOT=pathlib.Path
        R72_PIN='2ebce111316cdb578d0bd240e1858a4ac87e1b61543dff01fffc3b60e943d2b2'
        R69_PIN='f97ed14bc1ee9eb393860520beb9c8cd0ed861d5e6c69e193f712c3a166f18c9'
        R64_PIN='6de707a031044434b7d0a6078fb60f8b9a2cf98168e45a79f470e070f51fbe3a'
        INDEX_SHA='5630bb681dd8710f8e45bc5363488f358ce9ebe2'
        CONSTS=['POSITION_WEIGHT','AGE_CURVE','ROLE_MULT','PROD_MULT_DATA','NO_REAL_PRODUCTION_HISTORY','CAL22_LEGACY_MONOTONE_KEYS','RB_BIRTH_DATE_DATA','PLAYER_DB','CAL26_FV_OWNER_ANCHORS']
        FUNCS=['normalizeName','productionMultiplier','ageMultiplier','fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier','effectiveAgeMultiplier','playerValue']
        SCALARS=['QB_POST_PEAK_FLOOR','LB_POST_PEAK_DECAY_POWER']
        POS=('QB','RB','WR','TE','DL','LB','DB')
        def req(p,msg):
         if not p:raise AssertionError(msg)
        def sha(b):return hashlib.sha256(b).hexdigest()
        def blobsha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        def closing_brace(s,op):
         depth=0;i=op;state='code'
         while i<len(s):
          c=s[i];n=s[i+1] if i+1<len(s) else ''
          if state=='code':
           if c in "\"'`":state=c
           elif c=='/' and n=='/':state='line';i+=1
           elif c=='/' and n=='*':state='block';i+=1
           elif c=='{':depth+=1
           elif c=='}':
            depth-=1
            if depth==0:return i
          elif state=='line':
           if c=='\n':state='code'
          elif state=='block':
           if c=='*' and n=='/':state='code';i+=1
          elif c=='\\':i+=1
          elif c==state:state='code'
          i+=1
         raise AssertionError('UNBALANCED_SOURCE_BRACES')
        def extract_js(s,typ,name):
         if typ=='const':
          mat=re.search(r'(?m)^const '+re.escape(name)+r'\s*=\s*\{',s)
          req(mat is not None,'MISSING_CONST_'+name)
          end=closing_brace(s,mat.end()-1);req(s[end+1:end+2]==';','CONST_MISSING_SEMICOLON_'+name)
          return s[mat.start():end+2]+'\n'
         if typ=='scalar':
          mat=re.search(r'(?m)^const '+re.escape(name)+r'\s*=\s*[^;\n]+;',s)
          req(mat is not None,'MISSING_SCALAR_'+name);return mat.group()+'\n'
         mat=re.search(r'(?m)^function '+re.escape(name)+r'\(',s)
         req(mat is not None,'MISSING_FUNC_'+name)
         end=s.find('\n}',mat.end());req(end>mat.end(),'FUNC_END_'+name)
         return s[mat.start():end+2]+'\n'
        def js_bundle(s):
         pieces=[extract_js(s,'const',v) for v in CONSTS]+[extract_js(s,'scalar',v) for v in SCALARS]
         pieces += ['const PROD_MULT = PROD_MULT_DATA;\n']
         pieces += [extract_js(s,'func',v) for v in FUNCS]
         req('return Math.round(100 * pw * am * rm * 55);' in pieces[-1], 'PLAYER_VALUE_FORMULA_DRIFT')
         return '\n'.join(pieces)

        JS_RUNNER=r'''const fs = require('fs');
        const vm = require('vm');
        const obj = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
        const body = obj.bundle + `\nconst rows=${JSON.stringify(obj.rows)};\n`+`
        rows.map(row=>{
         let key=normalizeName(row.name);
         let p=PLAYER_DB[key];
         if(!p){const norm=q=>q.toLowerCase().replace(/[^a-z0-9]/g,'');
          const candidates=Object.keys(PLAYER_DB).filter(k=>norm(k)===norm(row.name)&&PLAYER_DB[k].pos===row.position);
          if(candidates.length!==1)throw Error('MISSING_KEY_'+row.name);
          key=candidates[0];p=PLAYER_DB[key];}
         if(p.pos!==row.position)throw Error('POS_MISMATCH_'+row.name);
         const before=playerValue(p.pos,p.age,p.role,key);
         const raw=Object.prototype.hasOwnProperty.call(PROD_MULT,key)?PROD_MULT[key]:null;
         const anchored=Object.prototype.hasOwnProperty.call(CAL26_FV_OWNER_ANCHORS,key) &&
          PLAYER_DB[key].pos===p.pos && PLAYER_DB[key].age===p.age && PLAYER_DB[key].role===p.role;
         let after=null;
         if(row.shadowRaw!==null && !anchored && raw!==null){
            PROD_MULT[key]=row.shadowRaw;
            after=playerValue(p.pos,p.age,p.role,key);
            PROD_MULT[key]=raw;
            if(playerValue(p.pos,p.age,p.role,key)!==before)throw Error('QUOTE_NOT_RESTORED_'+row.name);
         }
         return {name:row.name,position:p.pos,key,live:before,shadow:after,anchored,raw};
        });`;
        process.stdout.write(JSON.stringify(vm.runInNewContext(body,{}, {timeout:15000})));
        '''

        def fnum(v):
         try:return float(v)
         except (ValueError,TypeError):return None
        def parsebool(v):return str(v).lower()=='true'
        def read(p):return list(csv.DictReader(p.open(encoding='utf8',newline='')))
        def write(p,rows):
         if not rows:raise AssertionError('NO_ROWS_'+str(p))
         with p.open('w',encoding='utf8',newline='') as f:
          w=csv.DictWriter(f,fieldnames=list(rows[0]),lineterminator='\n');w.writeheader();w.writerows(rows)
        def pav(points):
         """Monotonic pool-adjacent-violators; equal-x blocks are pooled."""
         pts=sorted(points)
         blocks=[]
         for x,y in pts:
          if blocks and x==blocks[-1]['xmax']:
           b=blocks[-1];b['sum']+=y;b['n']+=1
          else:blocks.append(dict(xmin=x,xmax=x,n=1,sum=y))
          while len(blocks)>1 and blocks[-2]['sum']/blocks[-2]['n']>blocks[-1]['sum']/blocks[-1]['n']:
           b=blocks.pop();a=blocks[-1];a['sum']+=b['sum'];a['n']+=b['n'];a['xmax']=b['xmax']
         return blocks
        def predict(blocks,x):
         if not blocks:raise ValueError('NO_PEERS')
         for j,b in enumerate(blocks):
          v=b['sum']/b['n']
          if x<=b['xmax'] or j==len(blocks)-1:return v
          c=blocks[j+1]
          if x<c['xmin']:
           v1=c['sum']/c['n'];gap=c['xmin']-b['xmax']
           return v+(x-b['xmax'])/gap*(v1-v)
         raise AssertionError('ISOTONIC_PREDICT_RANGE')
        def selftest():
         b=pav([(1,.8),(2,.4),(3,.9),(4,.6),(5,1.2)])
         assert math.isclose(predict(b,1),.6) and math.isclose(predict(b,2),.6)
         assert math.isclose(predict(b,4),.75) and math.isclose(predict(b,5),1.2)
         assert predict(b,3.5)>=predict(b,2) and predict(b,3.5)<=predict(b,5)
         print('R73_SELFTEST_GREEN PAV_TIED_BLOCKS_MONOTONICITY_NO_FABRICATED_MULTIPLIER')
        def main(a):
         p72=ROOT(a.r72);p69=ROOT(a.r69);p64=ROOT(a.r64);repo=ROOT(a.repo);out=ROOT(a.out);out.mkdir(exist_ok=True,parents=True)
         x72=p72/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv'
         x69=p69/'CAL26_V1R69_518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv'
         x64=p64/'CAL26_V1R64_518_frozen_week6_2026_LOG_observations_NOT_FV.csv'
         for p,h in ((x72,R72_PIN),(x69,R69_PIN),(x64,R64_PIN)):
          req(a.fixture or sha(p.read_bytes())==h,'SOURCE_PIN_DRIFT_'+p.name)
         m=json.loads((p72/'CAL26_R72_manifest.json').read_text())
         req(m['n_players']==518 and m['n_owner_anchors']==15 and not m['production_change_authorized'] and m['formula_source_blob_sha1']==INDEX_SHA,'R72_MANIFEST_DRIFT')
         req(m['output_sha256'][x72.name]==sha(x72.read_bytes()),'R72_MANIFEST_CSV_MISMATCH')
         rr=read(x72);forecast=read(x69);obs=read(x64)
         req(len(rr)==len(forecast)==len(obs)==518,'UNIVERSE_NOT_518')
         def key(r):return (r['name'],r['position'])
         req(len({key(r) for r in rr})==518,'R72_DUPLICATE')
         ff={key(r):r for r in forecast};oo={key(r):r for r in obs}
         req(set(ff)==set(oo)=={key(r) for r in rr},'PLAYER_JOIN_DRIFT')
         source=(repo/'index.html').read_bytes()
         req(a.fixture or blobsha(source)==INDEX_SHA,'LIVE_FORMULA_GIT_BLOB_DRIFT')
         rows=[]
         for r in rr:
          o=oo[key(r)];f=ff[key(r)];pos=r['position']
          gp=int(o['played_weeks_gp']);score=fnum(f['2026_fullseason_corrected_actual_plus_research_ROS_POINTS'])
          raw=fnum(r['raw_production_multiplier_current']);anch=parsebool(r['owner_anchor_protects_quote'])
          req(parsebool(r['price_change_authorized'])==False and parsebool(f['production_change_authorized'])==False,'UNEXPECTED_PRICE_RELEASE')
          valid=score is not None and math.isfinite(score) and score>0 and raw is not None and 0.15<raw<1.55 and gp>=4 and not anch
          rows.append(dict(name=r['name'],position=pos,role=r['role'],age=r['age'],liveFV=int(r['exact_production_JS_replayed_FV']),raw=raw,score=score,gp=gp,anchored=anch,eligible=valid,referenceFV=int(r['frozen_reference_FV_UNCHANGED']),classification=r['six_week_availability_class']))
         req(sum(r['eligible'] for r in rows)>=200,'LOW_EMPIRICAL_REFERENCE_COVERAGE')
         cohorts={pos:[z for z in rows if z['eligible'] and z['position']==pos] for pos in POS}
         status=[];mapmodel={}
         for pos in POS:
          c=cohorts[pos];req(len(c)>=12,'POSITION_REFERENCE_TOO_THIN_'+pos)
          points=[(r['score'],r['raw']) for r in c]
          b=pav(points)
          predictions=[]
          for z in c:
           other=[(r['score'],r['raw']) for r in c if r is not z]
           pv=predict(pav(other),z['score'])
           predictions.append(abs(pv-z['raw']))
          mad=statistics.median(predictions)
          status.append(dict(position=pos,eligible_n=len(c),isotonic_blocks=len(b),LOO_abs_raw_mult_median=round(mad,4),target_source='INCUMBENT_LIVE_PROD_MULT_NOT_FUTURE_VALUE',out_of_time_price_calibration_validated=False,automatic_release=False))
          mapmodel[pos]=(b,mad,min(r['score'] for r in c),max(r['score'] for r in c))
         target=[]
         for r in rows:
          b,mad,lo,hi=mapmodel[r['position']]
          empirical=None;reason=''
          if r['anchored']:reason='OWNER_ANCHOR_PROTECTED'
          elif not r['eligible']:reason='NO_ELIGIBLE_GP4_UNCAPPED_PRODUCTION_PEER_REFERENCE'
          elif r['score']<lo or r['score']>hi:reason='OUTSIDE_POSITION_PEER_RANGE'
          else:
           pred=predict(pav([(q['score'],q['raw']) for q in cohorts[r['position']] if q is not r]),r['score'])
           # A peer-based empirical reference, NOT the new approved production-mult value.
           empirical=max(.15,min(1.55,pred))
           if abs(pred-r['raw'])<=2*mad:reason='INSIDE_LEAVE_ONE_OUT_PEER_NOISE_BAND'
           else:reason='PEER_REFERENCE_DIVERGENCE_REVIEW_ONLY'
          target.append({**r,'peer_raw_reference':empirical,'calibration_LOO_median_abs_dev':mad,'review_reason':reason})
         bundle=js_bundle(source.decode('utf8'))
         run_data=out/'run.json';script=out/'run.cjs'
         run_data.write_text(json.dumps(dict(bundle=bundle,rows=[dict(name=r['name'],position=r['position'],shadowRaw=r['peer_raw_reference']) for r in target])))
         script.write_text(JS_RUNNER)
         try:
          result=subprocess.run(['node',str(script),str(run_data)],capture_output=True,text=True,timeout=45)
          req(result.returncode==0,'LIVE_NODE_SHADOW_FAILED_'+result.stderr[:350]);outcomes=json.loads(result.stdout)
         finally:
          script.unlink(missing_ok=True);run_data.unlink(missing_ok=True)
         by={key(r):r for r in outcomes};req(len(by)==518,'NODE_SHADOW_BAD_N')
         final=[]
         for r in target:
          z=by[key(r)];req(z['live']==r['liveFV'],'NATIVE_JS_QUOTE_PARITY_DRIFT_'+r['name'])
          req(z['anchored']==r['anchored'],'ANCHOR_STATUS_DRIFT_'+r['name'])
          req((z['shadow'] is None)==(r['peer_raw_reference'] is None),'SHADOW_MISSING_'+r['name'])
          fv=z['shadow'];delta=fv-r['liveFV'] if fv is not None else None
          final.append({'name':r['name'],'position':r['position'],'age':r['age'],'role':r['role'],'games_played_6weeks':r['gp'],
           '2026_scoring_compatible_year0_forecast_points':r['score'] if r['score'] is not None else '',
           'live_JS_FV_BASELINE':r['liveFV'],'older_reference_FV_NOT_BASELINE':r['referenceFV'],
           'live_production_multiplier':round(r['raw'],6) if r['raw'] is not None else '',
           '2026_peer_implied_multiplier_EXPLORATORY':round(r['peer_raw_reference'],6) if r['peer_raw_reference'] is not None else '',
           'empirical_peer_current_multiplier_LOO_median_abs_deviation':round(r['calibration_LOO_median_abs_dev'],6),
           'exact_native_JS_peer_implied_FV_SHADOW':fv if fv is not None else '',
           'FV_shadow_minus_live_RESEARCH_NOT_APPROVED':delta if delta is not None else '',
           'reason':r['review_reason'],'owner_anchor_protected':r['anchored'],
           'multi_year_transfer_validated':False,'peer_target_is_current_mult_not_market_price':True,
           'FV_production_change_authorized':False})
         req(len(final)==518 and sum(r['owner_anchor_protected'] for r in final)==15,'FINAL_UNIVERSE_INVARIANT')
         # Candidate owner-review cards only: three per position maximum; no model-based production promotions.
         eligible=[r for r in final if r['reason']=='PEER_REFERENCE_DIVERGENCE_REVIEW_ONLY' and r['exact_native_JS_peer_implied_FV_SHADOW']!='']
         eligible.sort(key=lambda r:(-abs(r['FV_shadow_minus_live_RESEARCH_NOT_APPROVED']),r['position'],r['name']))
         cards=[];counts=collections.Counter()
         for r in eligible:
          if counts[r['position']]>=3:continue
          cards.append(r);counts[r['position']]+=1
          if len(cards)>=14:break
         if not cards:cards=sorted([r for r in final if r['exact_native_JS_peer_implied_FV_SHADOW']!=''],key=lambda z:-abs(z['FV_shadow_minus_live_RESEARCH_NOT_APPROVED']))[:7]
         write(out/'CAL26_R73_518_live_vs_empirical_peer_FV_SHADOW_NOT_PRODUCTION.csv',final)
         write(out/'CAL26_R73_7pos_no_arbitrary_scale_release_limits.csv',status)
         write(out/'CAL26_R73_owner_numerical_review_NO_APPROVED_PRICES.csv',cards)
         md=['# CAL26 V1R73 — numerical peer comparison on exact live pricing formula','',
         '**REJECTED for production pricing. Research shadow only; no live updates or validated 2027–2028 dynasty calibration.**','',
         'This study learns a monotonic within-position mapping of **2026 same-scored forecast points → currently deployed production multipliers** using other eligible peer players. It neither learns a new dollar-per-point coefficient nor proves incumbent production multipliers are correct.',
         "The current 2026 ROS points were validated in 2025 against outcome baselines, NOT against market prices, multi-season future values, or the current league's owner trades.",
         f'All 518 exact-JS live FV baselines replayed. {sum(r["eligible"] for r in rows)} non-anchored players with ≥4 games and uncapped multipliers furnished the reference; {len(cards)} shadow numerical owner cards produced.',
         f'All 15 anchored players are excluded. No low-GP player is priced based on a temporary absence.','',
         '| Position | Eligible peer n | LOO median abs multiplier residual |', '|---|---:|---:|']
         for z in status:md.append(f"| {z['position']} | {z['eligible_n']} | {z['LOO_abs_raw_mult_median']:.4f} |")
         md.extend(['','## Counterexamples demonstrating why direct Year0 peer repricing is unsafe (REJECTED)','',
         '| Player | Pos | Live FV | Empirical peer FV (unvalidated) | Delta |', '|---|---|---:|---:|---:|'])
         for z in cards:md.append(f"| {z['name']} | {z['position']} | {z['live_JS_FV_BASELINE']} | {z['exact_native_JS_peer_implied_FV_SHADOW']} | {z['FV_shadow_minus_live_RESEARCH_NOT_APPROVED']:+} |")
         md.extend(['','### Critical limitations','',
         '- These values are **REJECTED diagnostic peer-implied shadows**, not release-ready FV recommendations: fitted targets were LIVE PRODUCTION MULTIPLIERS, not actual future dynasty prices.',
         '- Empirical calibration is cross-sectional and could reinforce existing model biases; leave-one-out reduces self-fit but is not future-season price validation.',
         '- 2025-era current multipliers can reflect differences in scoring, age, source vintage, and positions. The 2026 forecast is a one-year measure; no dynasty continuation is priced by this method.',
         '- No output should be copied into `index.html`. Owner anchors and the live site remain unchanged.',
         '','**Next concrete task:** owner selects a few disagreement cards for true market/role and multi-year review; promote only after supporting independent price evidence, rather than imposing a blanket FV update.',''])
         (out/'CAL26_R73_decision.md').write_text('\n'.join(md)+'\n')
         names=['CAL26_R73_518_live_vs_empirical_peer_FV_SHADOW_NOT_PRODUCTION.csv','CAL26_R73_7pos_no_arbitrary_scale_release_limits.csv','CAL26_R73_owner_numerical_review_NO_APPROVED_PRICES.csv','CAL26_R73_decision.md']
         mm={'status':'CROSS_SECTIONAL_YEAR0_PEER_REPRICE_SHORTCUT_REJECTED_NOT_RELEASE_READY',
         'n':518,'n_eligible':sum(r['eligible'] for r in rows),'n_owner_anchors':15,'n_owner_review_cards':len(cards),
         'live_JS_FV_replay_verified':True,'no_future_2026_stats_accessed':True,'peer_target_is_live_raw_prod_multiplier_not_true_market_price':True,
         'price_mapper_rejected_for_production':True,'true_market_cardinal_validation':False,'2027_2028_dynasty_forecast_validated':False,'production_change_authorized':False,
         'pinned_live_index_git_blob':blobsha(source),'source_shas':{p.name:sha(p.read_bytes()) for p in (x72,x69,x64)},
         'output_sha256':{n:sha((out/n).read_bytes()) for n in names}}
         (out/'CAL26_R73_manifest.json').write_text(json.dumps(mm,indent=2,sort_keys=True)+'\n')
         print('R73_NUMERICAL_PEER_REVIEW_GREEN '+json.dumps({k:v for k,v in mm.items() if k not in ('source_shas','output_sha256')}))
        if __name__=='__main__':
         p=argparse.ArgumentParser();p.add_argument('--r72');p.add_argument('--r69');p.add_argument('--r64');p.add_argument('--repo');p.add_argument('--out');p.add_argument('--fixture',action='store_true');p.add_argument('--selftest',action='store_true');a=p.parse_args()
         if a.selftest:selftest()
         else:main(a)

        PY_R73_ENGINE
        python -m py_compile "$RUNNER_TEMP/CAL26_R73_engine.py"
        python "$RUNNER_TEMP/CAL26_R73_engine.py" --selftest
        python "$RUNNER_TEMP/CAL26_R73_engine.py" --r72 "$RUNNER_TEMP/cal26-r73-inputs/R72" --r69 "$RUNNER_TEMP/cal26-r73-inputs/R69" --r64 "$RUNNER_TEMP/cal26-r73-inputs/R64" --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/cal26-r73-results"
        python - "$RUNNER_TEMP/cal26-r73-results" <<'PY_R73_VERIFY'
        import pathlib,csv,hashlib,json,sys
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R73_manifest.json').read_text())
        assert m['status']=='CROSS_SECTIONAL_YEAR0_PEER_REPRICE_SHORTCUT_REJECTED_NOT_RELEASE_READY'
        assert m['n']==518 and m['n_owner_anchors']==15 and m['n_eligible']>=200
        assert m['n_owner_review_cards']>0 and m['live_JS_FV_replay_verified']
        assert m['no_future_2026_stats_accessed'] and not m['true_market_cardinal_validation']
        assert not m['production_change_authorized'] and not m['2027_2028_dynasty_forecast_validated'] and m['price_mapper_rejected_for_production']
        assert m['pinned_live_index_git_blob']=='5630bb681dd8710f8e45bc5363488f358ce9ebe2'
        for n,h in m['output_sha256'].items(): assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h
        with (p/'CAL26_R73_518_live_vs_empirical_peer_FV_SHADOW_NOT_PRODUCTION.csv').open() as f:r=list(csv.DictReader(f))
        assert len(r)==518 and all(x['FV_production_change_authorized']=='False' for x in r)
        assert sum(x['owner_anchor_protected']=='True' for x in r)==15
        print('R73_ACTUAL_JS_OWNER_REVIEW_NUMERICAL_SHADOW_NO_RELEASE_GREEN')
        PY_R73_VERIFY
        test -z "$(git status --porcelain)"
        cat "$RUNNER_TEMP/cal26-r73-results/CAL26_R73_decision.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload owner numerical shadow review (no production pricing edits)
      if: always()
