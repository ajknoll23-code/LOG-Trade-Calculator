name: QF11 V26 - Live KTC Collector Isolation and Comprehension Semantics Gate (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V26_REPO: .
  QF11_V26_V25: /tmp/qf11-v26-input/v25
  QF11_V26_OUTPUT: /tmp/qf11-v26-output
jobs:
  pilot_isolation_gate:
    name: SHA-pin V25 and test live collector isolation risks with synthetic comprehension checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin protected valuation files and existing live KTC aggregation route
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V26_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V26_PROTECTED_SOURCE_PINS_GREEN


        [[ "$(git hash-object .github/workflows/ktc-vote-aggregation.yml)" == "a6d08df00abc1760866c98757fd057b644a22264" ]] || { echo STOP_LIVE_KTC_AGGREGATOR_DRIFT;
        exit 1; }

        echo QF11_V26_LIVE_KTC_AGGREGATOR_PIN_GREEN

        '
    - name: Download exact V25 Green offline wording and gap research archive
      uses: actions/download-artifact@v4
      with:
        name: QF11-v25-RESEARCH-ONLY-offline-wording-instrument
        run-id: 38327139981
        github-token: ${{ github.token }}
        path: /tmp/qf11-v26-input/v25
    - name: SHA-verify V25 and inspect existing KTC ingestion without network submissions
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v26-output\ncat > /tmp/qf11-v26-audit.py <<'QF11_V26_SOURCE'\n#!/usr/bin/env python3\n\"\"\"\
        QF11 V26 evidence-only live-KTC isolation and proposed comprehension instrument QC.\nNever submits ballots, contacts participants, alters\
        \ repo files or grants approvals.\n\"\"\"\nimport hashlib\nimport itertools\nimport json\nimport os\nimport pathlib\nimport re\n\nROOT=pathlib.Path(os.environ.get('QF11_V26_REPO','.'))\n\
        SRC=pathlib.Path(os.environ.get('QF11_V26_V25','/tmp/qf11-v26-input/v25'))\nOUT=pathlib.Path(os.environ.get('QF11_V26_OUTPUT','/tmp/qf11-v26-output'))\n\
        PINS={\n 'RESEARCH_ONLY_v25_wording_instrument_DRAFT.json':'c62b2b52d73532fdd9b18e73403a4019d78da86c9c62567b9aed3d10647ba996',\n 'RESEARCH_ONLY_v25_preactivation_gaps.json':'b3c606669e9a855ab75c10483f4eecd3e5b18a7eb7ed56967e72021e6e662e2c',\n\
        \ 'RESEARCH_ONLY_v25_owner_instrument_review.md':'bf6668c949c4ec08458530f46382d76a744be7f8f735a18bb6092c7abe0d7dc1',\n 'RESEARCH_ONLY_v25_offline_preview.html':'8df75c9b47f2b80121fbea53da215d1f90635e8d069faaf73dfe105ade7ae8d8',\n\
        }\nfor name,sha in PINS.items():\n    p=SRC/name\n    assert p.is_file(),f'STOP_MISSING_V25_{name}'\n    assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,f'STOP_DRIFT_V25_{name}'\n\
        inst=json.loads((SRC/'RESEARCH_ONLY_v25_wording_instrument_DRAFT.json').read_text())\ngaps=json.loads((SRC/'RESEARCH_ONLY_v25_preactivation_gaps.json').read_text())\n\
        assert inst['schema']=='QF11_V25_OFFLINE_WORDING_QC_PROPOSAL'\nassert inst['status']=='DRAFT_NOT_APPROVED_FOR_RESPONDENT_DISPLAY'\nassert\
        \ inst['source_runs']=={'v23':38325685955,'v24':38326242398}\nassert len(inst['six_display_orders'])==6 and len(inst['comprehension_questionnaire_draft'])==4\n\
        TRIO=['Brock Bowers','Tyler Warren','TreVeyon Henderson']\nassert {tuple(a) for a in inst['six_display_orders']}==set(itertools.permutations(TRIO))\n\
        assert [q['id'] for q in inst['comprehension_questionnaire_draft']]==['Q1_NO_REAL_TRANSACTION','Q2_TRADE_MEANING','Q3_TIME_HORIZON','Q4_OPEN_ENDED']\n\
        assert [q['expected_option_index'] for q in inst['comprehension_questionnaire_draft'][:3]]==[1,1,0]\nassert inst['critical_failure_rule_change_proposed']\
        \ and not inst['owner_new_wording_approval']\nassert not inst['independent_human_semantic_qc'] and not inst['owner_pilot_activation_approved']\n\
        assert inst['actual_participants']==0 and inst['actual_votes']==0 and inst['production_changes']==0\nassert gaps['pilot_ready'] is False\
        \ and gaps['voter_links_enabled'] is False\nassert inst['candidate_scope']['optional_uncertified']==9 and len(inst['candidate_scope']['held_identities'])==7\n\
        \n# Checked-out production entry points are read-only observations. Their existence is not proof\n# that survey data ever flowed there;\
        \ it is evidence that route isolation must be designed.\nsite=(ROOT/'index.html').read_text()\nagg=(ROOT/'.github/workflows/ktc-vote-aggregation.yml').read_text()\n\
        pipeline=(ROOT/'scripts/market/ktc_pipeline.py').read_text()\nbuilder=(ROOT/'scripts/market/build_market_value.py').read_text()\nassert\
        \ re.search(r'const\\s+KTC_SUBMIT_URL\\s*=\\s*[\\'\\\"]https://script\\.google\\.com/macros/',site), 'STOP_KTC_COLLECTOR_EVIDENCE_DRIFT'\n\
        assert re.search(r'function\\s+ktcSubmit\\s*\\(',site) and 'fetch(KTC_SUBMIT_URL' in site, 'STOP_LIVE_SUBMISSION_EVIDENCE_DRIFT'\nassert\
        \ 'voterRosterId: ktcCurrentVoterId()' in site, 'STOP_LIVE_KTC_PAYLOAD_DRIFT'\nassert 'ktcVotesToday' in site and 'localStorage.setItem(ktcTodayKey()'\
        \ in site, 'STOP_LIVE_CLIENT_CAP_DRIFT'\nassert 'Refresh canonical KTC vote ratings' in agg and 'scripts/market/ktc_pipeline.py' in agg,\
        \ 'STOP_KTC_AGGREGATION_EVIDENCE_DRIFT'\nassert 'Rebuild deployed Market Value V2 from live votes' in agg and 'scripts/market/build_market_value.py\
        \ --write' in agg, 'STOP_MARKET_AGGREGATION_EVIDENCE_DRIFT'\nassert 'packageVote' in site and 'pkgv9slot' in site, 'STOP_PKG_V9_PATH_DRIFT'\n\
        assert 'selftest' in pipeline and 'selftest' in builder, 'STOP_MODEL_PIPELINE_DRIFT'\n\nquestions=inst['comprehension_questionnaire_draft']\n\
        def evaluate(answers):\n    # Synthetic-only reference scoring; untrusted free text NEVER automatically passes the pilot.\n    if len(answers)!=3:\
        \ return 'INVALID'\n    return 'NO_CRITICAL_MISUNDERSTANDING_IN_THREE_MC' if all(answers[i]==questions[i]['expected_option_index'] for\
        \ i in range(3)) else 'CRITICAL_STOP_SYNTHETIC'\nchecks={\n 'all_correct':evaluate((1,1,0)),\n 'actual_transaction_misunderstanding':evaluate((0,1,0)),\n\
        \ 'second_rank_misunderstanding':evaluate((1,0,0)),\n 'time_horizon_misunderstanding':evaluate((1,1,1)),\n 'multiple_misunderstandings':evaluate((0,0,1)),\n\
        \ 'incomplete':evaluate((1,1)),\n}\nassert checks['all_correct']=='NO_CRITICAL_MISUNDERSTANDING_IN_THREE_MC'\nassert all(v=='CRITICAL_STOP_SYNTHETIC'\
        \ for k,v in checks.items() if k not in ('all_correct','incomplete'))\nassert checks['incomplete']=='INVALID'\nreview={\n 'schema':'QF11_V26_LIVE_VOTER_TRANSPORT_ISOLATION_AND_SEMANTIC_GATE',\n\
        \ 'status':'READ_ONLY_EVIDENCE_REVIEW_BLOCKED_FOR_REAL_PILOT',\n 'source_v25_run':38327139981,\n 'source_v25_sha256':PINS,\n 'live_platform_observations':{\n\
        \   'normal_ktc_vote_submission_to_google_apps_script':True,\n   'normal_ktc_vote_aggregator_rebuilds_market_values':True,\n   'existing_package_vote_transport_is_a_different_study':True,\n\
        \   'pilot_safe_transport_proven':False,\n   'pilot_data_isolated_from_market_collector':False,\n   'unintended_market_ingestion_proven_absent':False,\n\
        \   'collector_server_code_independently_audited':False,\n },\n 'isolation_requirements_proposed':[\n   'Use an offline or separately\
        \ scoped consented pilot instrument, never ktcSubmit/KTC_SUBMIT_URL or package voting collector',\n   'Do not write pilot results to canonical\
        \ KTC or package vote datasets, vote collector sheets, or rating ingestion files',\n   'Before launch, independently prove transport endpoint\
        \ and exported data cannot flow into ktc-vote-aggregation or Market Value builders',\n   'Real participant dedup/order allocation and\
        \ stop-switch need independent implementation tests and owner release gate',\n ],\n 'proposed_semantic_questionnaire':{\n    'number_of_questions':4,'machine_scoreable':3,'needs_human_rubric':1,\n\
        \    'synthetic_mc_tests':checks,\n    'new_wording_owner_approved':False,\n    'replaces_original_rb_id_critical_trigger':True,\n   \
        \ 'prospective_stop_rule_amendment_approved':False,\n    'critical_stop_precedence_preserved_in_proposal':True,\n    'independent_human_semantic_qc_complete':False,\n\
        \    'notes':'A synthetic script can check answers but not prove real humans interpret wording correctly; Q4 requires human rubric',\n\
        \ },\n 'held_scope':{'original_excluded_slots':[1,5,8,12,15,21],'seven_identity_holds':inst['candidate_scope']['held_identities'],'optional_shadow_uncertified':9,'research_review_candidates':22},\n\
        \ 'release_controls':{'participants_contacted':0,'responses_collected':0,'voter_links_issued':0,'production_changed':0,'recruitment_authorized':False,'owner_pilot_activation_approved':False,'market_repricing_authorized':False},\n\
        \ 'recommendation':'OWNER_REVIEW_TWO_DESIGNS_NEXT: approve prospective wording amendment for preregistration only, and separately choose\
        \ isolated non-live implementation design; activation remains blocked',\n}\nOUT.mkdir(parents=True,exist_ok=True)\n(OUT/'RESEARCH_ONLY_v26_isolation_semantic_gate.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\\\
        n')\n(OUT/'RESEARCH_ONLY_v26_synthetic_question_checks.json').write_text(json.dumps(checks,indent=2,sort_keys=True)+'\\n')\nmd=[\n '#\
        \ QF11 V26 — Existing KTC transport isolation and semantics decision gate','',\n '**Research-only, no respondent exposure or production\
        \ changes. A GREEN workflow verifies observations and preserved blocks, not live pilot readiness.**','',\n '## Real infrastructure finding','',\n\
        \ '- Existing `index.html` `ktcSubmit()` submits normal KEEP/TRADE/CUT results to `KTC_SUBMIT_URL` (a Google Apps Script endpoint), and\
        \ the separate live aggregation workflow regenerates KTC ratings and deployed Market Values.',\n '- This does **not** prove hypothetical\
        \ pilot results already enter that collector; it proves the collector is a live production pathway that must not be reused without separate\
        \ isolation evidence.',\n '- Package V9 `pkgv9slot` is a different research transport and not an approved QF11 pilot backend.',\n '- The\
        \ Google Apps Script server-side collector code has not been independently reviewed here. No claim is made about its storage, deletion,\
        \ or submission guarantees.', '',\n '## Comprehension wording gate','',\n '- V25 has **four proposed questions**: three objective multiple-choice\
        \ items and one qualitative explanation.',\n '- Correct multiple-choice choices were tested synthetically, along with critical-failure\
        \ variants; these tests do **not** constitute human semantic review or questionnaire validation.',\n '- V25 proposes replacing the V23\
        \ RB-identification critical trigger. That is a **material prospective amendment still requiring owner approval**, independent human review,\
        \ and a versioned preregistration. Do not silently apply it.',\n '- Under the proposed protocol, any critical misunderstanding overrides\
        \ the 10/12 aggregate score. Ambiguous free text requires human adjudication; no auto-clear.', '',\n '## Required next decisions — no\
        \ new research sweep','',\n '1. Owner may authorize a **prospective wording amendment for preregistration only** (Q1–Q4 as V25 drafted),\
        \ subject to independent human QC; not participant display.',\n '2. Choose a fully isolated pilot-transport design that never calls the\
        \ normal `KTC_SUBMIT_URL` or Package V9 collector; implement consent, dedup, real random assignment, critical shutdown, privacy controls\
        \ and deletion verification before anyone is invited.',\n '3. Independent QC and **new explicit owner authorization** are required before\
        \ real participant contact. No market repricing on 12-person usability data.', '',\n '**Frozen scope:** 22 review candidates (12 unchanged,\
        \ 9 uncertified optional, 1 tentative trio); 6 original slots excluded; 7 identity holds remain. No voter, participant, or production\
        \ authorization.',\n]\n(OUT/'RESEARCH_ONLY_v26_owner_transport_decisions.md').write_text('\\n'.join(md)+'\\n')\nprint('QF11_V26_LIVE_COLLECTOR_ISOLATION_RESEARCH_GREEN\
        \ '+json.dumps({'source_files_verified':len(PINS),'display_orders':len(inst['six_display_orders']),'semantic_test_cases':len(checks),'pilot_isolation_proven':False,'independent_human_qc':False,'voting_authorized':False,'production_changes':0},sort_keys=True))\n\
        \nQF11_V26_SOURCE\npython3 /tmp/qf11-v26-audit.py\n"
    - name: Run all 14 frozen regression groups and FA PA selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V26_FROZEN_14_REGRESSIONS_GREEN

        '
    - name: Prove unresolved isolation semantic reviewer recruitment and Market gates
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''QF11_V26_PROOFS''

        from pathlib import Path

        import json,os

        p=Path(os.environ.get(''QF11_V26_OUTPUT'',''/tmp/qf11-v26-output''))

        x=json.loads((p/''RESEARCH_ONLY_v26_isolation_semantic_gate.json'').read_text())

        assert x[''status'']==''READ_ONLY_EVIDENCE_REVIEW_BLOCKED_FOR_REAL_PILOT''

        a=x[''live_platform_observations'']; b=x[''proposed_semantic_questionnaire'']; c=x[''release_controls'']

        assert a[''normal_ktc_vote_submission_to_google_apps_script''] and a[''normal_ktc_vote_aggregator_rebuilds_market_values'']

        assert not a[''pilot_safe_transport_proven''] and not a[''pilot_data_isolated_from_market_collector'']

        assert not a[''collector_server_code_independently_audited''] and not a[''unintended_market_ingestion_proven_absent'']

        assert not b[''new_wording_owner_approved''] and not b[''prospective_stop_rule_amendment_approved'']

        assert not b[''independent_human_semantic_qc_complete'']

        assert c[''participants_contacted'']==c[''responses_collected'']==c[''voter_links_issued'']==c[''production_changed'']==0

        assert c[''recruitment_authorized''] is c[''owner_pilot_activation_approved''] is c[''market_repricing_authorized''] is False

        assert len(x[''held_scope''][''seven_identity_holds''])==7 and x[''held_scope''][''optional_shadow_uncertified'']==9

        print(''QF11_V26_PROTECTED_LIVE_ISOLATION_AND_OWNER_DECISION_GATES_GREEN'')

        QF11_V26_PROOFS'
    - name: Recheck exact frozen blobs and no repository writes
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V26_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V26_PROTECTED_SOURCE_PINS_GREEN

        echo QF11_V26_ZERO_WRITE_GREEN


        [[ "$(git hash-object .github/workflows/ktc-vote-aggregation.yml)" == "a6d08df00abc1760866c98757fd057b644a22264" ]] || { echo STOP_AGGREGATOR_DRIFT;
        exit 1; }

        '
    - name: Archive read-only V26 transport and semantic owner decisions (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v26-RESEARCH-ONLY-transport-isolation-semantic-gate
        path: /tmp/qf11-v26-output/RESEARCH_ONLY_v26_*
        retention-days: 7
        if-no-files-found: error
