# QF10 V4R1: repairs the failed V4 /tmp import path; the original analysis and source pins stay unchanged.
# Prior run 38186698765 stopped before preview; no valuation, model, or artifact changes authorized.
name: QF10 V4R1 - Read-Only A6 Refresh Preview Import Repair
'on':
  workflow_dispatch: null
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
jobs:
  triage:
    name: Rebuild two display artifacts in memory and enforce V6 and no-history research scope
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout exact dispatched main, read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing repo HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Verify exact code and protected artifacts
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP non-main''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP checkout drift''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP dirty worktree''; exit 1; }

        git merge-base --is-ancestor d8a2be0bf1edb8d19e94e2edc5157062f95096f3 HEAD || { echo ''STOP QF9 baseline not ancestor'';
        exit 1; }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP source drift $1"; exit 1; }; }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/validation/build_value_uncertainty.py c70db15470704182c8790ebd24cc25c8fca6bd61

        pin research/package-adjustment-v6/production_review_v1.json e39bff1ce541e093b2a9140e12716c24fbaffb86

        pin research/no-history-v2/no_history_v2_phase3_evaluation.json b90cea102eb23147619318dbb009559a64a3d620

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        printf ''%s\n'' ''PASS QF10 V4 pinned production, both display builders, and strict research governance''

        '
    - name: Run no-write canonical market and uncertainty selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/market/build_market_value.py --selftest

        python3 scripts/validation/build_value_uncertainty.py --selftest

        '
    - name: Study current display-artifact refresh under strict scientific controls
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/log-qf10-v4.py <<'QF10_PY'\nfrom __future__ import annotations\nimport datetime\
        \ as dt\nimport json\nimport sys\nfrom pathlib import Path\n\nroot=Path.cwd()\nassert (root/'index.html').is_file()\
        \ and (root/'scripts'/'market'/'build_market_value.py').is_file(), 'STOP unexpected repository root'\nsys.path.insert(0,str(root))\
        \  # QF10 V4R1: /tmp script needs repository root for scripts namespace imports\nsys.path.insert(0,str(root/'scripts'/'validation'))\n\
        sys.path.insert(0,str(root/'scripts'/'market'))\nfrom scripts.market import build_market_value as market_builder\n\
        from scripts.validation import build_value_uncertainty as uncertainty_builder\nfrom scripts.validation import snapshot_values\n\
        \nmarket_saved=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())\nuncertainty_saved=json.loads((root/'scripts/artifacts/generated/value_uncertainty.json').read_text())\n\
        nohist=json.loads((root/'research/no-history-v2/no_history_v2_phase3_evaluation.json').read_text())\nv6_review=json.loads((root/'research/package-adjustment-v6/production_review_v1.json').read_text())\n\
        current=snapshot_values.compute_all_values(snapshot_values.load_from_html(root/'index.html'))\nassert len(current)==565,\
        \ f'STOP unexpected canonical population {len(current)}'\nassert market_saved['scale_semantics']=='league_rank_quantile_mapped_to_trade_desk_points_v1'\n\
        assert uncertainty_saved['range_semantics']=='sensitivity_envelope_v1_not_probability_interval'\n\n# A1 and A3:\
        \ explicit existing research constraints: no model change and no accidental extrapolation.\nassert nohist['status']=='EARLY_DIAGNOSTIC_ONLY'\
        \ and nohist['deployment_authorized'] is False\nassert nohist['completed_consecutive_week_count']<8, 'STOP research\
        \ readiness changed; re-review policy'\nscope=v6_review['proposed_conservative_production_scope']\nassert scope['trade_topology']=='exactly\
        \ one target player versus exactly three package players'\nassert scope['outside_scope_behavior']=='fail_closed_no_V6_adjustment'\n\
        assert 'packageAssets.length === 3 && packageValues.length === 3' in (root/'index.html').read_text()\nprint('QF10_V4_A1_GOVERNANCE\
        \ '+json.dumps({'status':nohist['status'],'completed_weeks':nohist['completed_consecutive_week_count'],'eligible_weeks_required_for_review':8,'model_change_authorized':False},sort_keys=True))\n\
        print('QF10_V4_A3_GOVERNANCE '+json.dumps({'frozen_v6_scope':scope['trade_topology'],'outside_scope':scope['outside_scope_behavior'],'four_player_extension_authorized':False,'model_change_authorized':False},sort_keys=True))\n\
        \n# Compute current model (authoritative FV) and both existing artifacts' as-deployed visibility.\ndef coverage(m,u):\n\
        \    all_rb=[key for key,v in current.items() if v.get('pos')=='RB']\n    rows={}\n    for key in all_rb:\n    \
        \    fv=current[key]['value']\n        mr=(m.get('players') or {}).get(key)\n        ur=(u.get('players') or {}).get(key)\n\
        \        mp=bool(mr is not None and mr.get('fundamental_value')==fv and isinstance(mr.get('market_value'),int |\
        \ float) and mr['market_value']>=0)\n        up=bool(ur is not None and ur.get('center_value')==fv and ur.get('range_low',1e99)<=fv<=ur.get('range_high',-1e99))\n\
        \        rows[key]=(mp,up)\n    return {'rb':len(all_rb),'both':sum(a and b for a,b in rows.values()),'market_only':sum(a\
        \ and not b for a,b in rows.values()),'uncertainty_only':sum(b and not a for a,b in rows.values()),'neither':sum(not\
        \ a and not b for a,b in rows.values())}\n\nbefore=coverage(market_saved,uncertainty_saved)\nassert before['rb']==97,\
        \ f'STOP unanticipated RB population {before}'\nprint('QF10_V4_LIVE_BEFORE '+json.dumps({'saved_market_utc':market_saved['generated_at_utc'],'saved_uncertainty_utc':uncertainty_saved['generated_at_utc'],'coverage':before},sort_keys=True))\n\
        \n# Recreate uncertainty IN MEMORY; neither --write nor a tracked filesystem mutation.\nunc_rebuild=uncertainty_builder.build_payload()\n\
        assert unc_rebuild['range_semantics']==uncertainty_saved['range_semantics']\nassert len(unc_rebuild['players'])==len(uncertainty_saved['players'])==565\n\
        uc=coverage(market_saved,unc_rebuild)\nprint('QF10_V4_UNCERTAINTY_SHADOW '+json.dumps({'status':'REBUILT_IN_MEMORY_ONLY','covered':len(unc_rebuild['players']),'coverage_with_dated_market':uc,'saved_source_was':uncertainty_saved['generated_at_utc']},sort_keys=True))\n\
        \n# The Market rebuild uses the CURRENT live public vote sheet. If the external\n# source is unavailable, report\
        \ NOT_READY rather than inventing a market result.\ntry:\n    market_shadow=market_builder.build_payload(None)\n\
        except Exception as exc:\n    print('QF10_V4_MARKET_SHADOW '+json.dumps({'status':'NOT_READY_LIVE_SOURCE_UNAVAILABLE','error_type':type(exc).__name__,'reason':str(exc)[:300],'note':'No\
        \ refresh promoted; source availability must be repaired or retried'},sort_keys=True))\nelse:\n    assert market_shadow['method_version']==market_saved['method_version'],'STOP\
        \ market method drift'\n    assert market_shadow['policy_sha256']==market_saved['policy_sha256'],'STOP market weighting\
        \ policy drift'\n    assert market_shadow['scale_semantics']==market_saved['scale_semantics'],'STOP market scale\
        \ drift'\n    assert market_shadow['source']['mode']=='live_sheet','STOP not current live source'\n    assert len(market_shadow['players'])>=100,'STOP\
        \ insufficient live voting coverage'\n    after=coverage(market_shadow,unc_rebuild)\n    old=coverage(market_saved,uncertainty_saved)\n\
        \    sample_keys=set(market_shadow['players']) & set(market_saved['players'])\n    value_deltas=[abs(market_shadow['players'][k]['market_value']-market_saved['players'][k]['market_value'])\
        \ for k in sample_keys]\n    print('QF10_V4_MARKET_SHADOW '+json.dumps({'status':'PREVIEW_ONLY_NOT_PROMOTED','source_raw_rows':market_shadow['source'].get('raw_sheet_row_count'),'market_players':len(market_shadow['players']),'vote_quality':market_shadow['market_quality'],'common_players':len(sample_keys),'max_abs_market_value_change':max(value_deltas,default=0),'old_live_coverage':old,'candidate_coverage_with_uncertainty':after,'fully_restored_rbs':after['both']-old['both'],'no_model_change_authorized':True},sort_keys=True))\n\
        \nprint('QF10_V4R1_READ_ONLY_GREEN research_preview_only=True no_source_writes=True no_model_changes=True')\nQF10_PY\n\
        python3 -m py_compile /tmp/log-qf10-v4.py\npython3 /tmp/log-qf10-v4.py"
    - name: Run existing repo regressions, no policy change
      shell: bash
      run: 'set -euo pipefail

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        '
    - name: Prove read-only outcome and exact shipped file hashes
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP repo changed''; exit 1; }

        [[ "$(git hash-object index.html)" == ''c83e3f68d11853c072017e6bd83bb1ad085f4a3e'' ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == ''829445174a77ceb4bb19dfd97a725e371d18efe8''
        ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == ''24c9f63881cc768a18d412172f04e5a263a4abc2''
        ]] || exit 1

        echo ''QF10_V4R1_ZERO_WRITE_GREEN: no model or artifact writes, no commit, no branch and no promotion''

        '
