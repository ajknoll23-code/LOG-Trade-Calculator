name: Team Utility Bench Weight Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-utility-bench-weight-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Stage-1 synthetic self-test
        run: python3 research/team-utility/team_utility_bench_weight_audit.py --selftest

      - name: Run historical bench-utilization calibration
        run: python3 research/team-utility/team_utility_bench_weight_audit.py --write

      - name: Verify deterministic audit outputs
        run: python3 research/team-utility/team_utility_bench_weight_audit.py --check

      - name: Show audit summary
        run: cat research/team-utility/team_utility_bench_weight_audit.md

      - name: Validate diff
        run: |
          git diff --check
          git status --short

      - name: Commit audit outputs
        shell: bash
        run: |
          git config user.name "team-utility-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/team-utility/team_utility_bench_weight_audit.json
          git add research/team-utility/team_utility_bench_weight_audit.md

          if git diff --cached --quiet; then
            echo "Audit outputs already current; nothing to commit."
          else
            git commit -m "Audit Team Utility bench weight"
            git push origin main
          fi
