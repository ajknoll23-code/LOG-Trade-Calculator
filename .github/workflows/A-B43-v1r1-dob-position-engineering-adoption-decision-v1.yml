name: B43 V1R1 - DOB_POSITION Engineering Adoption Decision V1

on:
  workflow_dispatch:
    inputs:
      adoption_attestation:
        description: Exact engineering-adoption attestation
        required: true
        type: string

permissions:
  contents: write

jobs:
  commit-adoption-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify frozen V1R1 lineage and materialize adoption decision
        shell: bash
        env:
          ADOPTION_ATTEST: ${{ inputs.adoption_attestation }}
        run: |
          set -euo pipefail
          test "$ADOPTION_ATTEST" = 'I_CONFIRM_B43_V1R1_ENGINEERING_ADOPTION_DECISION_REVIEWED_AND_V1R1_STOP_PRESERVED'
          BASE='research/player-role-v2'
          TARGET="$BASE/player_role_v2_b43_v1r1_rule_adoption_decision.json"
          EXPECTED_SHA='4f62fe0416626a780538288bcedd36cf0ef95b73d3a2802340fbfc31a38ca095'
          INDEX_SHA_BEFORE="$(sha256sum index.html | awk '{print $1}')"
          FA_SHA_BEFORE="$(sha256sum free-agent-board.html | awk '{print $1}')"

          python3 - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          base=Path('research/player-role-v2')
          expected={
            'player_role_v2_b43_v1_identity_bridge_evaluator.py':'44e2585dbb84a7c62b274b5ed0bc63d1881b4e48e940e65ad04a5c8905475bab',
            'player_role_v2_b43_v1_preregistration.json':'cd5c70d6fd8fb46b302855039c2161e14bb4491dc367e04ba9d641c665adeecd',
            'player_role_v2_b43_v1_identity_bridge.csv':'3fdc85e18a4e705d15afcf8d93b742343c57aaa2c909f3e8fd40faf2ebbf8fcc',
            'player_role_v2_b43_v1_evidence.json':'adfcd3593a01961c1624148ef8ca2cb8d10c6e000ca05fa19a4baa208ba3102a',
            'player_role_v2_b43_v1_scientific_decision.json':'fa50ef0b58145da5edbf7805a8f4cfd7c54b464754ee04e59c5822072f6eb3f9',
            'player_role_v2_b43_v4r2_preregistration.json':'e224b7a4d7c8566bd8ca0e3b9eebad67debae26706ca4ee610e8dd779f028738',
          }
          for rel,sha in expected.items():
              p=base/rel
              assert p.exists(), rel
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==sha,(rel,actual,sha)
          e=json.loads((base/'player_role_v2_b43_v1_evidence.json').read_text())
          d=json.loads((base/'player_role_v2_b43_v1_scientific_decision.json').read_text())
          v4=json.loads((base/'player_role_v2_b43_v4r2_preregistration.json').read_text())
          assert d['result']=='SCIENTIFIC_STOP_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FAILED'
          rs=e['reference_validation']['rule_stats']['DOB_POSITION']
          assert (rs['comparisons'],rs['correct'],rs['conflicts'])==(1243,1243,0)
          pop=e['current_owner_blind_population']
          assert (pop['supplemental_proposal_count'],pop['supplemental_accepted_count'],pop['supplemental_collision_count'])==(78,76,2)
          assert v4['objective_respecification']['population_coverage_gate_removed'] is True
          assert v4['objective_respecification']['B44_gates_unchanged'] is True
          print('PASS: frozen V1R1 evidence and prospective V4R2 objective lineage verified.')
          PYVERIFY

          if [ -f "$TARGET" ]; then
            test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECTED_SHA"
            echo "PASS: exact adoption decision already committed; no-op."
            exit 0
          fi

          cat > "$TARGET" <<'JSON'
          {
            "B43_V1R1_scientific_stop_preserved": true,
            "B44_is_the_acceptance_test": true,
            "V1R1_frozen_artifacts": {
              "evaluator": {
                "path": "research/player-role-v2/player_role_v2_b43_v1_identity_bridge_evaluator.py",
                "sha256": "44e2585dbb84a7c62b274b5ed0bc63d1881b4e48e940e65ad04a5c8905475bab"
              },
              "evidence": {
                "path": "research/player-role-v2/player_role_v2_b43_v1_evidence.json",
                "sha256": "adfcd3593a01961c1624148ef8ca2cb8d10c6e000ca05fa19a4baa208ba3102a"
              },
              "identity_bridge_csv": {
                "path": "research/player-role-v2/player_role_v2_b43_v1_identity_bridge.csv",
                "sha256": "3fdc85e18a4e705d15afcf8d93b742343c57aaa2c909f3e8fd40faf2ebbf8fcc"
              },
              "preregistration": {
                "path": "research/player-role-v2/player_role_v2_b43_v1_preregistration.json",
                "sha256": "cd5c70d6fd8fb46b302855039c2161e14bb4491dc367e04ba9d641c665adeecd"
              },
              "scientific_decision": {
                "path": "research/player-role-v2/player_role_v2_b43_v1_scientific_decision.json",
                "sha256": "fa50ef0b58145da5edbf7805a8f4cfd7c54b464754ee04e59c5822072f6eb3f9"
              }
            },
            "V1R1_known_pair_evidence": {
              "comparisons": 1243,
              "conflicts": 0,
              "correct": 1243
            },
            "V1R1_target_population_evidence": {
              "accepted": 76,
              "collision_quarantined": 2,
              "proposals": 78
            },
            "adopted_rule": "DOB_POSITION",
            "adopted_rule_definition": "exact canonical-name match + exact nonmissing birth date (unique among same-name, compatible-position Sleeper candidates after the conflicting-birth-date veto) + compatible position family",
            "adopted_rule_source": {
              "git_blob_sha": "a8ed8f93d869fd747288d0e5fbb78514b6ba5282",
              "path": "research/player-role-v2/player_role_v2_b43_v1_identity_bridge_evaluator.py"
            },
            "collision_disclosure": "B43 V2R1's strict classifier treated the 2 V1R1 collisions as rule conflicts (not provable duplicate identities). They remain quarantined and are never mapped.",
            "decided_after_B43_V1R1_result_was_known": true,
            "production_change_authorized": false,
            "rationale": "B43's population-coverage screen was an underived proxy (removed prospectively in V4R2). DOB_POSITION is the only tested identity signal that reaches the thin-ID tail, with 1243/1243 known-pair precision. Acceptance is decided by B44 on new data under unchanged gates.",
            "rules_not_adopted": [
              "NFL_TEAM_POSITION",
              "UNIQUE_NAME_POSITION"
            ],
            "schema_version": 1,
            "status": "ENGINEERING_ADOPTION_DECISION_NOT_A_B43_PASS"
          }
          JSON
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECTED_SHA"

          python3 - <<'PYDECISION'
          import json
          from pathlib import Path
          p=json.loads(Path('research/player-role-v2/player_role_v2_b43_v1r1_rule_adoption_decision.json').read_text())
          assert p['status']=='ENGINEERING_ADOPTION_DECISION_NOT_A_B43_PASS'
          assert p['B43_V1R1_scientific_stop_preserved'] is True
          assert p['adopted_rule']=='DOB_POSITION'
          assert p['rules_not_adopted']==['NFL_TEAM_POSITION','UNIQUE_NAME_POSITION']
          assert p['V1R1_known_pair_evidence']=={'comparisons':1243,'correct':1243,'conflicts':0}
          assert p['V1R1_target_population_evidence']=={'proposals':78,'accepted':76,'collision_quarantined':2}
          assert p['B44_is_the_acceptance_test'] is True
          assert p['production_change_authorized'] is False
          print('PASS: engineering adoption decision preserves V1R1 STOP.')
          PYDECISION

          git add "$TARGET"
          test "$(git diff --cached --name-only)" = "$TARGET"
          git config user.name 'player-role-v2-adoption-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Record B43 V1R1 DOB_POSITION engineering adoption decision'
          git fetch origin main
          git rebase origin/main
          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA_BEFORE"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA_BEFORE"
          git push origin HEAD:main

      - name: Verify durable adoption decision
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          TARGET='research/player-role-v2/player_role_v2_b43_v1r1_rule_adoption_decision.json'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = '4f62fe0416626a780538288bcedd36cf0ef95b73d3a2802340fbfc31a38ca095'
          echo 'PASS: B43 V1R1 DOB_POSITION engineering adoption decision is durable.'
