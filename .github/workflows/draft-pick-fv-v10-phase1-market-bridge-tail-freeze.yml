name: Draft Pick FV V10 - Phase 1 Market Bridge + Tail Freeze

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: draft-pick-fv-v10-phase1-market-bridge-tail
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  V8_P2_RUN_ID: '36469782185'
  V8_P2_ARTIFACT_NAME: 'v8-p2-historical-outcome-harvest-closeout'

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install scientific dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.3.5"

      - name: Guard frozen V10 Phase 0 and rolled-back production baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          prereg=D/"v10_phase0_expected_value_preregistration.json"
          ktc=D/"v10_ktc_market_benchmark_freeze.json"
          audit=D/"v10_phase0_expected_value_construct_audit.json"
          manifest=D/"v10_phase0_expected_value_construct_audit_manifest.json"

          expected_sha256={
              prereg:"c9af7c3e69b81f292e7be5ca977597a30d3ea3f4f442f6f96282596ee6cebba0",
              ktc:"c76dd7579c415b544f31c4ae8a4e5714dda822d46cd989936279d6d84daed606",
              audit:"d4b4bfcc8446a4f612e6a6f39a73242498b292ad71dece073639c4ed7a0f138e",
          }
          for p,want in expected_sha256.items():
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want,(str(p),want,got)

          p0=json.loads(prereg.read_text())
          a=json.loads(audit.read_text())
          m=json.loads(manifest.read_text())
          k=json.loads(ktc.read_text())

          assert p0["study_id"]=="draft-pick-fv-v10-ex-ante-expected-value"
          assert p0["stage"]=="phase0_preregistration"
          assert p0["status"]=="FROZEN_BEFORE_V10_EXPECTED_VALUE_AUDIT"
          assert p0["core_estimator"]["candidate_id"]=="V10_C1_CLASS_BALANCED_DIRECT_EV"
          assert p0["production_change_authorized"] is False
          assert p0["scientific_partition"]["year_discount"]=="SEPARATE_STUDY_NOT_FIT_OR_CHANGED_IN_V10_CORE_TAIL_STUDY"
          assert a["decision"]=="ADVANCE_V10_TO_PHASE1_UNDER_FROZEN_EXPECTED_VALUE_CONTRACT"
          assert a["phase0_integrity_pass"] is True
          assert a["production_change_authorized"] is False
          assert a["year_discount_changed"] is False
          assert a["raw_monotonicity"]["pass"] is True
          assert a["ktc_construct_audit"]["fit_or_rescale_using_ktc"] is False
          assert a["ktc_construct_audit"]["all_production_construct_gates_pass_on_raw_C1"] is False
          assert m["decision"]=="ADVANCE_V10_TO_PHASE1_UNDER_FROZEN_EXPECTED_VALUE_CONTRACT"
          assert m["production_change_authorized"] is False
          assert k["fit_policy"].startswith("KTC is external construct/scale validation only")

          expected_c0=[
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          for name in ("index.html","free-agent-board.html"):
              t=Path(name).read_text(encoding="utf-8")
              mm=pat.search(t); assert mm,name
              vals=list(map(float,re.findall(r"(?:early|mid|late):([0-9.]+)",mm.group(0))))
              assert vals==list(map(float,expected_c0)),(name,vals)
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in t

          print("PASS: Phase 0 is exact and production is still the rolled-back C0 baseline.")
          PY

      - name: Freeze Phase 1 market-translation and tail contract before calibration
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v10"
          P="$D/v10_phase1_market_bridge_tail_preregistration.json"
          M="$D/v10_phase1_market_bridge_tail_preregistration.md"

          if [[ -e "$P" || -e "$M" ]]; then
            echo "Existing Phase 1 preregistration detected; validating instead of rewriting."
          else
            python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v10")

          obj={
            "schema_version":1,
            "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
            "stage":"phase1_market_bridge_tail_preregistration",
            "status":"FROZEN_AFTER_PHASE0_SCALE_DIAGNOSTIC_BEFORE_PHASE1_CALIBRATION",
            "decision":"FREEZE_V10_PHASE1_SEPARATE_FUNDAMENTAL_AND_MARKET_TRANSLATION_LAYERS",
            "scientific_interpretation":{
              "phase0_finding":"Raw class-balanced expected-value FV had perfect rank agreement with KTC but a nearly uniform absolute scale gap across all 12 R1-R4 cells.",
              "response":"Do not alter or refit the frozen fundamental estimator. Introduce a separately labeled market-translation layer with one global degree of freedom.",
              "evidence_status":"This market bridge is exposed development calibration motivated by Phase 0. It is not a fresh confirmatory validation result."
            },
            "fundamental_core":{
              "candidate_id":"V10_C1_CLASS_BALANCED_DIRECT_EV",
              "source":"v10_phase0_expected_value_construct_audit.json",
              "immutable":True,
              "ktc_fit_allowed":False,
              "rounds":[1,2,3,4]
            },
            "market_translation":{
              "candidate_id":"V10_M1_SINGLE_GLOBAL_LOG_SCALE",
              "purpose":"Translate frozen ex-ante Fundamental Value into the market-equivalent accounting scale used for tradable draft-pick values without changing relative fundamental shape.",
              "formula":"m = exp(mean_cell(log(KTC_2027_combined_cell / frozen_core_FV_cell))); market_cell = frozen_core_FV_cell * m",
              "parameters":1,
              "fit_cells":"all 12 R1-R4 cells",
              "round_specific_parameters_forbidden":True,
              "tier_specific_parameters_forbidden":True,
              "tradesourced_and_crowdsourced_role":"external disagreement band and robustness diagnostics only; central fit uses combined series",
              "validation":{
                "leave_one_cell_out_log_scale_cross_validation":True,
                "median_abs_log_error_le":0.08,
                "max_abs_log_error_le":0.15,
                "post_bridge_trade_to_crowd_band_fraction_ge":0.75,
                "spearman_with_combined_ge":0.90,
                "central_multiplier_between_trade_and_crowd_global_multipliers":True
              }
            },
            "market_tail":{
              "candidate_id":"V10_MT1_R3_R4_MARKET_DECAY_EXTRAPOLATION",
              "reason":"Phase 0 showed historical R4->R5 and R5->R6 expected-player outcomes are sparse/noisy and do not form a stable declining market curve. KTC itself stops at Round 4.",
              "formula":"d_market = geometric mean over early/mid/late of KTC combined R4/R3 ratios; R5_tier = market_R4_tier*d_market; R6_tier = R5_tier*d_market",
              "parameters":1,
              "preserve_round4_tier_proportions":True,
              "robustness":{
                "combined_decay_must_lie_between_trade_and_crowd_decay":True,
                "decay_must_be_strictly_between_zero_and_one":True
              },
              "interpretation":"Rounds 5-6 are explicitly market-tail extrapolation, not KTC-observed cells and not independently fitted fundamental cells."
            },
            "historical_tail_diagnostic":{
              "required":True,
              "source":"exact V8 2018-2023 H3 O2 development corpus",
              "purpose":"Recompute R3->R4, R4->R5, and R5->R6 expected-player transition behavior and preserve it as a diagnostic proving why direct late-round outcome ratios are not used as market-tail prices.",
              "may_change_market_tail_formula":False
            },
            "candidate_output":{
              "R1_R4":"frozen fundamental core multiplied by one global market multiplier",
              "R5_R6":"market-translated R4 tier values followed by the single frozen market-tail decay",
              "production_candidate_only_if_all_phase1_gates_pass":True,
              "automatic_production_mutation":False
            },
            "production_gates":[
              "all 18 candidate values are positive",
              "all 18 candidate values are monotone nonincreasing in canonical R1-early through R6-late order",
              "market bridge LOCO median absolute log error <= 0.08",
              "market bridge LOCO maximum absolute log error <= 0.15",
              "at least 75% of R1-R4 cells lie inside the tradesourced-to-crowdsourced band after the one-parameter bridge",
              "market bridge central multiplier lies between trade-only and crowd-only global multipliers",
              "market tail decay lies strictly between 0 and 1",
              "market tail combined decay lies between trade-only and crowd-only R3->R4 aggregate decays"
            ],
            "forbidden":[
              "change the frozen Phase 0 fundamental R1-R4 estimator",
              "fit separate market multipliers by round or tier",
              "use KTC to refit player-outcome Fundamental Value",
              "fit six independent R5/R6 cells",
              "use noisy historical R4->R5 or R5->R6 expected-player ratios as direct market prices",
              "fit or change YEAR_DISCOUNT",
              "change player valuation",
              "change Package Adjustment",
              "change Team Utility",
              "mutate production PICK_BASE in Phase 1"
            ],
            "next_stage_if_pass":"V10 Phase 2 Production-Candidate Audit and Engineering Bridge",
            "production_change_authorized":False
          }

          (d/"v10_phase1_market_bridge_tail_preregistration.json").write_text(
              json.dumps(obj,indent=2,sort_keys=True)+"\n"
          )
          (d/"v10_phase1_market_bridge_tail_preregistration.md").write_text(
              "# Draft Pick FV V10 — Phase 1 Market Bridge + Tail Preregistration\n\n"
              "Phase 0 froze the fundamental expected-value shape and exposed a nearly uniform "
              "absolute scale gap versus KTC. Phase 1 therefore keeps the fundamental estimator "
              "unchanged and tests exactly one global market-translation multiplier. Rounds 5–6 "
              "are a separately labeled market-tail extrapolation using the observed KTC R3→R4 "
              "decay, because KTC stops at Round 4 and the historical expected-player tail is "
              "too noisy to serve as a direct market-price curve.\n"
          )
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$P" "$M"
            git commit -m "Freeze Draft Pick FV V10 Phase 1 market bridge and tail contract"

            BASE_SHA="${{ steps.base.outputs.sha }}"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
              echo "ERROR: origin/main moved before Phase 1 preregistration freeze."
              exit 1
            }
            git push origin HEAD:main
          fi

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("research/draft-pick-fv-v10")
          p=d/"v10_phase1_market_bridge_tail_preregistration.json"
          x=json.loads(p.read_text())
          assert x["decision"]=="FREEZE_V10_PHASE1_SEPARATE_FUNDAMENTAL_AND_MARKET_TRANSLATION_LAYERS"
          assert x["fundamental_core"]["immutable"] is True
          assert x["fundamental_core"]["ktc_fit_allowed"] is False
          assert x["market_translation"]["parameters"]==1
          assert x["market_tail"]["parameters"]==1
          assert x["production_change_authorized"] is False
          print("PHASE1_PREREG_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          echo "prereg_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download exact exposed V8 development corpus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/v10-v8-p2"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          gh run download "$V8_P2_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$V8_P2_ARTIFACT_NAME" \
            --dir "$OUT"

          test -f "$OUT/v8_phase2_development_outcomes.jsonl"
          test "$(sha256sum "$OUT/v8_phase2_development_outcomes.jsonl" | awk '{print $1}')" = \
            "45306800ce32f3aa20d6d4697e14c846311962b7f6fe3e54e596213370644850"

          echo "PASS: exact frozen 2018-2023 development corpus recovered."

      - name: Run Phase 1 market bridge and tail engine
        shell: bash
        env:
          DEV_ROWS: ${{ runner.temp }}/v10-v8-p2/v8_phase2_development_outcomes.jsonl
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, math, os
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          import numpy as np

          D=Path("research/draft-pick-fv-v10")
          P0=json.loads((D/"v10_phase0_expected_value_construct_audit.json").read_text())
          KTC=json.loads((D/"v10_ktc_market_benchmark_freeze.json").read_text())
          PRE=json.loads((D/"v10_phase1_market_bridge_tail_preregistration.json").read_text())

          CELLS=[
              "r1_early","r1_mid","r1_late",
              "r2_early","r2_mid","r2_late",
              "r3_early","r3_mid","r3_late",
              "r4_early","r4_mid","r4_late",
          ]
          TIERS=("early","mid","late")
          YEARS=tuple(range(2018,2024))
          EPS=1e-12

          core={c:float(P0["core_raw_expected_value"][c]) for c in CELLS}
          combined={c:float(KTC["2027"]["combined"][c]) for c in CELLS}
          trade={c:float(KTC["2027"]["tradesourced"][c]) for c in CELLS}
          crowd={c:float(KTC["2027"]["crowdsourced"][c]) for c in CELLS}

          def gmean(xs):
              xs=[float(x) for x in xs]
              assert xs and min(xs)>0
              return float(math.exp(sum(math.log(x) for x in xs)/len(xs)))

          def spearman(a,b):
              # No tied values in the frozen 12-cell vectors.
              ka=sorted(a,key=lambda k:a[k])
              kb=sorted(b,key=lambda k:b[k])
              ra={k:i for i,k in enumerate(ka)}
              rb={k:i for i,k in enumerate(kb)}
              x=np.asarray([ra[k] for k in CELLS],dtype=float)
              y=np.asarray([rb[k] for k in CELLS],dtype=float)
              return float(np.corrcoef(x,y)[0,1])

          def multiplier(ref):
              return gmean(ref[c]/core[c] for c in CELLS)

          m_comb=multiplier(combined)
          m_trade=multiplier(trade)
          m_crowd=multiplier(crowd)
          market_core={c:core[c]*m_comb for c in CELLS}

          loco=[]
          for held in CELLS:
              train=[c for c in CELLS if c!=held]
              m=gmean(combined[c]/core[c] for c in train)
              pred=core[held]*m
              loco.append({
                  "held_out_cell":held,
                  "multiplier":m,
                  "prediction":pred,
                  "actual":combined[held],
                  "abs_log_error":abs(math.log(pred/combined[held])),
                  "ratio":pred/combined[held],
              })
          loco_errors=[x["abs_log_error"] for x in loco]

          inside={
              c: min(trade[c],crowd[c])-EPS <= market_core[c] <= max(trade[c],crowd[c])+EPS
              for c in CELLS
          }
          band_fraction=sum(inside.values())/len(CELLS)
          post_ratios={c:market_core[c]/combined[c] for c in CELLS}
          post_abs_log={c:abs(math.log(post_ratios[c])) for c in CELLS}

          def r34_decay(series):
              return gmean(
                  series[f"r4_{t}"]/series[f"r3_{t}"]
                  for t in TIERS
              )

          d_comb=r34_decay(combined)
          d_trade=r34_decay(trade)
          d_crowd=r34_decay(crowd)

          # Recompute exact historical expected-player transition diagnostics.
          rows=[]
          with Path(os.environ["DEV_ROWS"]).open() as f:
              for line in f:
                  if line.strip():
                      rows.append(json.loads(line))
          assert len(rows)==24970

          by_year_cell={}
          for y in YEARS:
              for rnd in range(1,7):
                  for tier in TIERS:
                      c=f"r{rnd}_{tier}"
                      xs=[
                          r for r in rows
                          if int(r["draft_year"])==y
                          and r["cell"]==c
                          and r.get("primary_o2_ready") is True
                          and r.get("H3",{}).get("O2") is not None
                      ]
                      assert xs,(y,c)
                      w=np.asarray([float(r["development_fit_weight_v8"]) for r in xs],dtype=float)
                      w=w/w.sum()
                      v=np.asarray([float(r["H3"]["O2"]) for r in xs],dtype=float)
                      by_year_cell[(y,c)]=float(np.dot(w,v))

          yearly_round={}
          transitions={"r3_to_r4":{},"r4_to_r5":{},"r5_to_r6":{}}
          for y in YEARS:
              yearly_round[y]={}
              for rnd in range(1,7):
                  yearly_round[y][rnd]=float(np.mean([
                      by_year_cell[(y,f"r{rnd}_{tier}")]
                      for tier in TIERS
                  ]))
              transitions["r3_to_r4"][str(y)]=yearly_round[y][4]/yearly_round[y][3]
              transitions["r4_to_r5"][str(y)]=yearly_round[y][5]/yearly_round[y][4]
              transitions["r5_to_r6"][str(y)]=yearly_round[y][6]/yearly_round[y][5]

          historical_summary={}
          for name,vals in transitions.items():
              x=list(vals.values())
              historical_summary[name]={
                  "yearly":vals,
                  "arithmetic_mean":float(np.mean(x)),
                  "geometric_mean":gmean(x),
                  "min":min(x),
                  "max":max(x),
              }

          # Preserve the exact Phase-0 transition result as an independent parity check.
          for name in ("r3_to_r4","r4_to_r5","r5_to_r6"):
              want=float(P0["tail_transition_diagnostics"][name]["geometric_mean"])
              got=float(historical_summary[name]["geometric_mean"])
              assert abs(got-want)<=1e-12,(name,want,got)

          # Market tail is deliberately derived only from the last observed KTC round transition.
          r4_market={
              tier:market_core[f"r4_{tier}"]
              for tier in TIERS
          }
          r5_market={tier:r4_market[tier]*d_comb for tier in TIERS}
          r6_market={tier:r5_market[tier]*d_comb for tier in TIERS}

          candidate={
              **market_core,
              **{f"r5_{t}":r5_market[t] for t in TIERS},
              **{f"r6_{t}":r6_market[t] for t in TIERS},
          }
          canonical=[
              "r1_early","r1_mid","r1_late",
              "r2_early","r2_mid","r2_late",
              "r3_early","r3_mid","r3_late",
              "r4_early","r4_mid","r4_late",
              "r5_early","r5_mid","r5_late",
              "r6_early","r6_mid","r6_late",
          ]
          vals=[candidate[c] for c in canonical]
          positive=min(vals)>0
          monotone=all(vals[i]>=vals[i+1]-1e-9 for i in range(len(vals)-1))

          gates={
              "loco_median_abs_log_error_le_0_08":
                  float(np.median(loco_errors))<=0.08+EPS,
              "loco_max_abs_log_error_le_0_15":
                  max(loco_errors)<=0.15+EPS,
              "post_bridge_band_fraction_ge_0_75":
                  band_fraction>=0.75-EPS,
              "post_bridge_spearman_ge_0_90":
                  spearman(market_core,combined)>=0.90-EPS,
              "central_multiplier_between_trade_and_crowd":
                  min(m_trade,m_crowd)-EPS <= m_comb <= max(m_trade,m_crowd)+EPS,
              "market_tail_decay_strictly_between_0_and_1":
                  0.0<d_comb<1.0,
              "combined_tail_decay_between_trade_and_crowd":
                  min(d_trade,d_crowd)-EPS <= d_comb <= max(d_trade,d_crowd)+EPS,
              "candidate_all_positive":positive,
              "candidate_all_18_monotone":monotone,
          }
          all_pass=all(gates.values())

          result={
              "schema_version":1,
              "study_id":"draft-pick-fv-v10-ex-ante-expected-value",
              "stage":"phase1_market_bridge_tail_evaluation",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "decision":(
                  "FREEZE_V10_PHASE1_MARKET_TRANSLATED_PICK_CURVE_AUTHORIZE_PHASE2_AUDIT"
                  if all_pass else
                  "STOP_V10_PHASE1_MARKET_BRIDGE_OR_TAIL_GATE"
              ),
              "phase0_fundamental_core_unchanged":True,
              "fundamental_core":core,
              "market_bridge":{
                  "candidate_id":"V10_M1_SINGLE_GLOBAL_LOG_SCALE",
                  "combined_multiplier":m_comb,
                  "tradesourced_multiplier":m_trade,
                  "crowdsourced_multiplier":m_crowd,
                  "parameters":1,
                  "leave_one_cell_out":loco,
                  "loco_median_abs_log_error":float(np.median(loco_errors)),
                  "loco_max_abs_log_error":max(loco_errors),
                  "post_bridge_band_fraction":band_fraction,
                  "post_bridge_inside_trade_crowd_band":inside,
                  "post_bridge_ratios_to_combined":post_ratios,
                  "post_bridge_absolute_log_ratios":post_abs_log,
                  "post_bridge_spearman":spearman(market_core,combined),
                  "ktc_used_to_refit_fundamental_core":False,
                  "ktc_used_for_separate_market_translation":True,
              },
              "market_tail":{
                  "candidate_id":"V10_MT1_R3_R4_MARKET_DECAY_EXTRAPOLATION",
                  "combined_decay":d_comb,
                  "tradesourced_decay":d_trade,
                  "crowdsourced_decay":d_crowd,
                  "r5":r5_market,
                  "r6":r6_market,
                  "ktc_observed_rounds":[1,2,3,4],
                  "r5_r6_are_extrapolated":True,
              },
              "historical_expected_player_tail_diagnostic":historical_summary,
              "production_candidate_values":candidate,
              "gates":gates,
              "all_phase1_gates_pass":all_pass,
              "production_change_authorized":False,
              "year_discount_changed":False,
              "next_stage":(
                  "Draft Pick FV V10 - Phase 2 Production-Candidate Audit and Engineering Bridge"
                  if all_pass else None
              ),
          }

          (D/"v10_phase1_market_bridge_tail_evaluation.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          md=[
              "# Draft Pick FV V10 — Phase 1 Market Bridge + Tail Evaluation",
              "",
              f"**Decision:** `{result['decision']}`",
              "",
              "The frozen Phase-0 fundamental R1–R4 expected-value curve was not changed. "
              "A separate one-parameter market translation was estimated from the frozen 2027 KTC combined curve.",
              "",
              "## Market bridge",
              "",
              f"- Global combined multiplier: **{m_comb:.6f}**",
              f"- Tradesourced-only multiplier: **{m_trade:.6f}**",
              f"- Crowdsourced-only multiplier: **{m_crowd:.6f}**",
              f"- LOCO median absolute log error: **{float(np.median(loco_errors)):.4f}**",
              f"- LOCO maximum absolute log error: **{max(loco_errors):.4f}**",
              f"- Cells inside trade↔crowd band: **{sum(inside.values())}/{len(CELLS)}**",
              "",
              "## Market tail",
              "",
              f"- Combined KTC R3→R4 geometric decay: **{d_comb:.6f}**",
              f"- Tradesourced decay: **{d_trade:.6f}**",
              f"- Crowdsourced decay: **{d_crowd:.6f}**",
              "- R5 and R6 remain explicit extrapolations; KTC does not provide those rounds.",
              "",
              "## Candidate values",
              "",
              "| Cell | Candidate |",
              "|---|---:|",
          ]
          for c in canonical:
              md.append(f"| {c} | {candidate[c]:.1f} |")
          md += [
              "",
              "## Historical tail diagnostic",
              "",
              f"- Historical expected-player R3→R4 geometric ratio: **{historical_summary['r3_to_r4']['geometric_mean']:.4f}**",
              f"- Historical expected-player R4→R5 geometric ratio: **{historical_summary['r4_to_r5']['geometric_mean']:.4f}**",
              f"- Historical expected-player R5→R6 geometric ratio: **{historical_summary['r5_to_r6']['geometric_mean']:.4f}**",
              "",
              "These late-round outcome ratios are preserved as diagnostics only and do not directly set market prices.",
              "",
              f"All Phase-1 gates pass: **{all_pass}**",
              "",
              "No production values changed. YEAR_DISCOUNT, player valuation, Package Adjustment, and Team Utility remain untouched.",
          ]
          (D/"v10_phase1_market_bridge_tail_evaluation.md").write_text("\n".join(md)+"\n")

          frozen={
              "schema_version":1,
              "decision":result["decision"],
              "candidate_id":"V10_C1_PLUS_M1_PLUS_MT1",
              "fundamental_core_candidate_id":"V10_C1_CLASS_BALANCED_DIRECT_EV",
              "market_bridge_candidate_id":"V10_M1_SINGLE_GLOBAL_LOG_SCALE",
              "market_tail_candidate_id":"V10_MT1_R3_R4_MARKET_DECAY_EXTRAPOLATION",
              "global_market_multiplier":m_comb,
              "market_tail_decay":d_comb,
              "values":candidate,
              "all_phase1_gates_pass":all_pass,
              "production_change_authorized":False,
              "year_discount_changed":False,
          }
          (D/"v10_phase1_frozen_production_candidate.json").write_text(
              json.dumps(frozen,indent=2,sort_keys=True)+"\n"
          )

          print("DECISION="+result["decision"])
          print(f"GLOBAL_MARKET_MULTIPLIER={m_comb:.12f}")
          print(f"MARKET_TAIL_DECAY={d_comb:.12f}")
          print(f"LOCO_MEDIAN_LOG_ERROR={float(np.median(loco_errors)):.12f}")
          print(f"LOCO_MAX_LOG_ERROR={max(loco_errors):.12f}")
          print(f"BAND_FRACTION={band_fraction:.12f}")
          print("ALL_GATES_PASS="+str(all_pass))
          PY

      - name: Validate Phase 1 result and freeze manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-pick-fv-v10")
          result=json.loads((D/"v10_phase1_market_bridge_tail_evaluation.json").read_text())
          frozen=json.loads((D/"v10_phase1_frozen_production_candidate.json").read_text())

          expected="FREEZE_V10_PHASE1_MARKET_TRANSLATED_PICK_CURVE_AUTHORIZE_PHASE2_AUDIT"
          assert result["decision"]==expected,result["decision"]
          assert result["all_phase1_gates_pass"] is True
          assert all(result["gates"].values())
          assert result["phase0_fundamental_core_unchanged"] is True
          assert result["market_bridge"]["parameters"]==1
          assert result["market_bridge"]["ktc_used_to_refit_fundamental_core"] is False
          assert result["market_bridge"]["ktc_used_for_separate_market_translation"] is True
          assert result["market_tail"]["r5_r6_are_extrapolated"] is True
          assert result["production_change_authorized"] is False
          assert result["year_discount_changed"] is False
          assert frozen["decision"]==expected
          assert frozen["all_phase1_gates_pass"] is True
          assert frozen["production_change_authorized"] is False

          files=[
              "v10_phase1_market_bridge_tail_preregistration.json",
              "v10_phase1_market_bridge_tail_preregistration.md",
              "v10_phase1_market_bridge_tail_evaluation.json",
              "v10_phase1_market_bridge_tail_evaluation.md",
              "v10_phase1_frozen_production_candidate.json",
          ]
          manifest={
              "schema_version":1,
              "decision":expected,
              "files":{
                  name:hashlib.sha256((D/name).read_bytes()).hexdigest()
                  for name in files
              },
              "production_change_authorized":False,
              "year_discount_changed":False,
          }
          (D/"v10_phase1_market_bridge_tail_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Phase 1 candidate and exact manifest frozen.")
          PY

      - name: Prove production still unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected=[
              7500,5854,5244,
              3906,3624,3291,
              2692,2682,2319,
              1972,1831,1689,
              1414,1250,1118,
              1014,853,740,
          ]
          pat=re.compile(r"const PICK_BASE = \{.*?\n\};",re.S)
          for p in ("index.html","free-agent-board.html"):
              text=Path(p).read_text(encoding="utf-8")
              m=pat.search(text); assert m
              got=list(map(float,re.findall(r"(?:early|mid|late):([0-9.]+)",m.group(0))))
              assert got==list(map(float,expected)),(p,got)
              assert "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };" in text
          print("PASS: Phase 1 is research-only; production remains exact C0.")
          PY

      - name: Commit Phase 1 frozen result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v10/v10_phase1_market_bridge_tail_preregistration.json \
            research/draft-pick-fv-v10/v10_phase1_market_bridge_tail_preregistration.md \
            research/draft-pick-fv-v10/v10_phase1_market_bridge_tail_evaluation.json \
            research/draft-pick-fv-v10/v10_phase1_market_bridge_tail_evaluation.md \
            research/draft-pick-fv-v10/v10_phase1_frozen_production_candidate.json \
            research/draft-pick-fv-v10/v10_phase1_market_bridge_tail_manifest.json

          if git diff --cached --quiet; then
            echo "No Phase 1 changes to commit."
            exit 0
          fi

          git commit -m "Complete Draft Pick FV V10 Phase 1 market bridge and tail freeze"

          PREREG_HEAD="${{ steps.freeze.outputs.prereg_head }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PREREG_HEAD" || {
            echo "ERROR: origin/main moved after Phase 1 preregistration freeze."
            exit 1
          }

          git push origin HEAD:main
          echo "PASS: frozen V10 Phase 1 result committed to main."
