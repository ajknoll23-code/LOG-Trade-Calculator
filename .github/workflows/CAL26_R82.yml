# CAL26 R82. Read-only; no FV calibration is claimed. No GitHub writes.
name: CAL26 V1R82 - Frozen Two-Year Football Utility and FV Scale Identification (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r82-football-utility-price-scale-hold
  cancel-in-progress: false
jobs:
  frozen-football-economics-no-fv-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout exact released FV source, without write token
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Use Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download pinned verified R62 evidence read only
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R62_EMPIRICAL_SCALE_IDENTIFICATION_AND_QB_WEEK6_RESEARCH_ONLY
        run-id: 40062932051
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r82-in/R62
    - name: Download pinned verified R63 evidence read only
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R63_SEVEN_POSITION_CHRONOLOGICAL_WEEK6_FV_HOLD
        run-id: 40064045458
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r82-in/R63
    - name: Download pinned verified R70 evidence read only
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R70_SINGLE_SOURCE_YEAR0_SURPLUS_AND_SCALE_HOLD
        run-id: 40099257160
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r82-in/R70
    - name: Download pinned verified R72 evidence read only
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R72_518_NATIVE_FV_FORMULA_REPLAY_AND_SENSITIVITY_FV_HOLD
        run-id: 40102341863
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r82-in/R72
    - name: Download pinned verified R74 evidence read only
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R74_CHRONOLOGICAL_NEXT_SEASON_SURPLUS_FV_HOLD
        run-id: 40106627943
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r82-in/R74
    - name: Compute historical-uncertainty two-year football utility; refuse invented cardinal FV prices
      shell: bash
      run: "set -euo pipefail\n# Exact deployed reference: if source changes, no extrapolation to modified release.\ntest \"$(git hash-object\
        \ index.html)\" = \"5630bb681dd8710f8e45bc5363488f358ce9ebe2\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\n\
        cat > \"$RUNNER_TEMP/CAL26_R82_engine.py\" <<'PY_R82_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 R82 -- historically anchored\
        \ 2026+2027 surplus utility, NOT a price estimator.\n\nResearch-only. Single frozen as-of-2026 Week6 cohort. All read-only.\
        \ Cross-year\nsurplus additivity and 2027 discount are explicitly *scenario conventions*,\nnot economically calibrated Fundamental\
        \ Value. No 2028 data or market price fitting.\n\"\"\"\nimport argparse,collections,csv,hashlib,json,math,pathlib,statistics\n\
        P=pathlib.Path\nPOS=('QB','RB','WR','TE','DL','LB','DB')\nFOCUS=('drake maye','malik nabers','bryce young','cj stroud','puka\
        \ nacua')\nPIN={\n 'R62':{'CAL26_V1R62_decision.md':'80bf81e60c082e3f0aab6c5d6e2b652c7368fede239222e8bc36507dd399f9f4'},\n 'R63':{'CAL26_V1R63_2024_Week6_outer_player_diagnostics_NOT_FV.csv':'954798f3d4a27b14fe47a2b58b14e750ee942172b2896e27f84f7d5e877aab5d','CAL26_V1R63_7position_Week6_chronological_holdout.csv':'1d5c5cafa85d2a449c27e9bc96cbc90c3bcfd25004626518588f94781c802345'},\n\
        \ 'R70':{'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv':'7ae5ffdd2fa9603df74cb6fe768af7889f8c96f22abb297c50013622ed964699','CAL26_R70_7_position_replacement_and_rank_decision.csv':'00b888e0cfe86af4031509df8b474b6dac2a1e0faa47a1238fc71ccca8a85634'},\n\
        \ 'R72':{'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv':'2ebce111316cdb578d0bd240e1858a4ac87e1b61543dff01fffc3b60e943d2b2'},\n\
        \ 'R74':{'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv':'2e3e3bcd005fcaa1480b2200893c5b4c3548a1b3be2dd0ce8fdb8af9d0d8b50b','CAL26_R74_7position_chronological_transition_risk.csv':'de552a013876b60c9d5a1b84db0d400ffb1f5e74b275af55ee761fa9b7f19c17'},\n\
        }\ndef chk(cond,msg):\n if not cond:raise AssertionError(msg)\ndef digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()\n\
        def rows(p):\n with p.open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))\ndef ix(rr):\n out={}\n for r in\
        \ rr:\n  k=(r['name'].strip().lower(),r['position'])\n  chk(k not in out,'DUPLICATE_ID '+str(k));out[k]=r\n return out\ndef\
        \ num(v,label):\n try:x=float(v)\n except (TypeError,ValueError):raise AssertionError('BAD_NUMERIC_'+label+'='+str(v))\n chk(math.isfinite(x),'NONFINITE_'+label);return\
        \ x\ndef maybe(v):\n if v is None or str(v).strip()=='':return None\n return num(v,'OPTIONAL')\ndef qtl(rr,q):\n a=sorted(rr)\n\
        \ if not a:return None\n v=(len(a)-1)*q;k=int(v);f=v-k\n return a[k]*(1-f)+a[min(k+1,len(a)-1)]*f\ndef round3(v):return '' if\
        \ v is None else round(v,3)\ndef csvout(p,rr):\n chk(bool(rr),'EMPTY_OUTPUT_'+p.name)\n with p.open('w',newline='',encoding='utf-8')\
        \ as f:\n  w=csv.DictWriter(f,fieldnames=list(rr[0]),lineterminator='\\n');w.writeheader();w.writerows(rr)\ndef main(a):\n roots={k:P(getattr(a,k.lower()))\
        \ for k in PIN};out=P(a.out);out.mkdir(parents=True,exist_ok=True)\n pinned={}\n for k,files in PIN.items():\n  for fn,expected\
        \ in files.items():\n   p=roots[k]/fn;chk(p.is_file(),'MISSING_SOURCE_'+k+'/'+fn)\n   h=digest(p)\n   if expected:chk(h==expected,'FROZEN_SOURCE_SHA_DRIFT_'+fn)\n\
        \   pinned[k+'/'+fn]=h\n assessment=(roots['R62']/'CAL26_V1R62_decision.md').read_text(encoding='utf-8')\n chk('CARDINAL_FV_NOT_IDENTIFIED'\
        \ in assessment and '79 trades, 0 clean 1-player vs 1-player no-pick trades' in assessment,'MARKET_SCALE_GOVERNANCE_DRIFT')\n\
        \ chk('No 15\xD7/20\xD7/25\xD7 multipliers' in assessment,'ARBITRARY_MULTIPLIER_GATE_DRIFT')\n yr0=ix(rows(roots['R70']/'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv'))\n\
        \ yr1=ix(rows(roots['R74']/'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv'))\n live=ix(rows(roots['R72']/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv'))\n\
        \ chk(len(yr0)==len(yr1)==len(live)==518,'PLAYER_UNIVERSE_NOT_518')\n chk(set(yr0)==set(yr1)==set(live),'PLAYER_IDENTITY_MISMATCH')\n\
        \ h0=rows(roots['R63']/'CAL26_V1R63_2024_Week6_outer_player_diagnostics_NOT_FV.csv')\n hmeta=rows(roots['R63']/'CAL26_V1R63_7position_Week6_chronological_holdout.csv')\n\
        \ h74=rows(roots['R74']/'CAL26_R74_7position_chronological_transition_risk.csv')\n refs=rows(roots['R70']/'CAL26_R70_7_position_replacement_and_rank_decision.csv')\n\
        \ chk(len(h0)==1698 and len(hmeta)==len(h74)==len(refs)==7,'HISTORICAL_COUNT_OR_REFERENCE_POSITION')\n chk({r['position'] for\
        \ r in hmeta}=={r['position'] for r in h74}=={r['position'] for r in refs}==set(POS),'POSITION_REFERENCE_UNIVERSE_DRIFT')\n\
        \ ref={r['position']:r for r in refs};m63={r['position']:r for r in hmeta};m74={r['position']:r for r in h74}\n hist=collections.defaultdict(list)\n\
        \ for r in h0:\n  chk(r['origin']=='2024' and r['trained_using_only_prior_completed_outcomes']=='True' and r['no_market_or_FV_price_used']=='True','HISTORICAL_LEAK_GUARD')\n\
        \  p=r['position'];chk(p in POS,'UNKNOWN_HIST_POS')\n  pred=num(r['ytd_pred_surplus'],'H1_CTRL');truth=num(r['actual_2025_surplus'],'H1_ACTUAL')\n\
        \  chk(pred>=0 and truth>=0,'NEGATIVE_HISTORICAL_SURPLUS')\n  hist[p].append((pred,truth))\n position=[]\n for p in POS:\n \
        \ obs=hist[p];n=len(obs);chk(n==int(m63[p]['outer_origin_2024_n'])==int(m74[p]['historical_2024_to_2025_H1_n']),'H1_HISTORICAL_COHORT_MISMATCH_'+p)\n\
        \  errors=[true-pred for pred,true in obs];mse=statistics.mean(e*e for e in errors);mae=statistics.mean(abs(e) for e in errors)\n\
        \  chk(abs(mse-num(m74[p]['historical_2024_to_2025_2021trained_YTD_MSE'],'MSE'))<.12,'H1_HISTORICAL_MSE_DRIFT_'+p)\n  chk(abs(mae-num(m74[p]['historical_absolute_error_mean'],'MAE'))<.02,'H1_HISTORICAL_MAE_DRIFT_'+p)\n\
        \  chk(ref[p]['2026_reference_is_assumption_not_empirically_calibrated']=='True','REPLACEMENT_ASSUMPTION_GATE_'+p)\n  chk(m63[p]['H1_only_not_three_year']=='True'\
        \ and m63[p]['2026_FV_or_pricing_approved']=='False','UNAUTHORIZED_HORIZON_'+p)\n  position.append({'position':p,'2024_to_2025_outer_test_n':n,'2024_to_2025_H1_frozen_control_MAE_points':round3(mae),'H1_frozen_control_RMSE_points':round3(math.sqrt(mse)),'residual_p10_points':round3(qtl(errors,.1)),'residual_p90_points':round3(qtl(errors,.9)),'H1_historical_source_is_2026_rule_retrospective':True,'2026_replacement_reference_points_ASSUMPTION':ref[p]['2026_same_source_replacement_points'],'2026_replacement_rank_ASSUMPTION':ref[p]['R61_lineup_replacement_rank_assumption'],'2027_future_actual_available':False,'2028_two_year_future_forecast_validated':False,'FV_cardinal_scale_identified':False})\n\
        \ chk(sum(x['2024_to_2025_outer_test_n'] for x in position)==1698,'OUTER_TEST_SUM')\n allrec=[];eligible=collections.defaultdict(list)\n\
        \ for (name,p),r in sorted(yr0.items()):\n  u=yr1[name,p];v=live[name,p]\n  chk(u['FV_production_change_authorized']=='False'\
        \ and u['2027_actual_future_outcome_known']=='False' and u['2028_H2_independent_future_outcome_certified']=='False' and u['H1_is_next_season_surplus_not_FV']=='True','R74_FUTURE_OUTCOME_LEAK_OR_PRICE_AUTH_'+name)\n\
        \  chk(r['production_change_authorized']=='False' and r['cross_position_cardinal_scale_empirically_identified']=='False','R70_SCALE_CLAIM_DRIFT_'+name)\n\
        \  original_price=int(num(u['live_JS_FV_UNCHANGED'],'LIVE_R74'))\n  replay_price=int(num(v['exact_production_JS_replayed_FV'],'LIVE_R72'))\n\
        \  chk(original_price==replay_price,'LIVE_FV_DRIFT_'+name)\n  gp=int(num(u['games_played_through_2026_week6'],'GP'))\n  h0val=maybe(u['2026_year0_replacement_surplus_RESEARCH'])\n\
        \  r70val=maybe(r['research_year0_surplus_above_2026_position_reference'])\n  if h0val is not None and r70val is not None:chk(abs(h0val-r70val)<.02,'YEAR0_CONTINUITY_DRIFT_'+name)\n\
        \  h1val=maybe(u['2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH'])\n  low=maybe(u['2027_H1_residual_p10_lower_RESEARCH_NOT_PROBABILISTIC'])\n\
        \  high=maybe(u['2027_H1_residual_p90_upper_RESEARCH_NOT_PROBABILISTIC'])\n  if h1val is not None:\n   chk(h0val is not None,'H1_WITHOUT_H0_'+name)\n\
        \   chk(low is not None and high is not None and low<=h1val+.001 and h1val<=high+.001,'H1_ENVELOPE_INVALID_'+name)\n  if gp<4:label='LOW_GP_OR_MISSING_2026_EVIDENCE_NOT_PRICEABLE'\n\
        \  elif h0val is None or h1val is None:label='H1_MODEL_MISSING_NO_PRICE'\n  else:label='SCENARIO_ONLY_GP4PLUS_NOT_PRICE'\n \
        \ elig=label.startswith('SCENARIO_')\n  base=max(0,h0val) if h0val is not None else None\n  # Scenario weights are disclosed\
        \ conventions, not optimized or learned weights.\n  central=base+.75*h1val if elig else None\n  lower=base+.75*low if elig else\
        \ None\n  upper=base+.75*high if elig else None\n  outcome={'name':name,'position':p,'age':u['age'],'role':u['role'],'2026_week1_6_GP':gp,'reliability_gate':label,'live_FV_REFERENCE_ONLY':original_price,'owner_price_anchor_protected':u['owner_price_anchor_protected'],'2026_H0_surplus_points_RESEARCH':round3(h0val),'2027_H1_surplus_points_RESEARCH':round3(h1val),'2027_H1_historical_residual_p10_scenario':round3(low),'2027_H1_historical_residual_p90_scenario':round3(high),'H0_only_nonnegative_scenario_points':round3(base),'H0_plus_0p75_H1_sensitivity_points_NOT_FV':round3(central),'H0_plus_1p00_H1_sensitivity_points_NOT_FV':round3(base+h1val\
        \ if elig else None),'H0_plus_0p75_H1_lower_residual_scenario_NOT_CI':round3(lower),'H0_plus_0p75_H1_upper_residual_scenario_NOT_CI':round3(upper),'same_eligible_position_pool_utility_rank':'','same_eligible_position_pool_live_FV_rank':'','utility_minus_live_rank_same_pool':'','H2_2028_excluded_no_qualified_prospective_validation':True,'discount_0p75_is_scenario_not_estimated':True,'cardinal_LOG_FV_per_surplus_point_identified':False,'estimated_new_FV':'','production_price_change_authorized':False}\n\
        \  allrec.append(outcome)\n  if elig:eligible[p].append(outcome)\n chk(sum(x['owner_price_anchor_protected']=='True' for x in\
        \ allrec)==15,'OWNER_ANCHOR_COUNT_DRIFT')\n # Position ranks computed only within same GP4+ forecast-eligible pool to avoid\
        \ comparing unlike cohorts.\n for p,cohort in eligible.items():\n  def rank_group(key):\n   sorted_group=sorted(cohort,key=lambda\
        \ x:(-float(x[key]),x['name']))\n   return {id(r):i+1 for i,r in enumerate(sorted_group)}\n  cr=rank_group('H0_plus_0p75_H1_sensitivity_points_NOT_FV');lr=rank_group('live_FV_REFERENCE_ONLY')\n\
        \  for rr in cohort:\n   rr['same_eligible_position_pool_utility_rank']=cr[id(rr)];rr['same_eligible_position_pool_live_FV_rank']=lr[id(rr)]\n\
        \   rr['utility_minus_live_rank_same_pool']=lr[id(rr)]-cr[id(rr)]\n  report=next(x for x in position if x['position']==p)\n\
        \  report['2026_GP4plus_utility_scenario_eligible_count']=len(cohort)\n for e in position:e.setdefault('2026_GP4plus_utility_scenario_eligible_count',0)\n\
        \ cards=[]\n byname={x['name']:x for x in allrec}\n for name in FOCUS:\n  chk(name in byname,'MISSING_FOCUS_'+name)\n  row=byname[name]\n\
        \  cards.append({'player':name,'position':row['position'],'age':row['age'],'live_FV_REFERENCE_ONLY':row['live_FV_REFERENCE_ONLY'],'2026_replacement_surplus_pts':row['2026_H0_surplus_points_RESEARCH'],'2027_next_season_surplus_pts':row['2027_H1_surplus_points_RESEARCH'],'H0_plus_0p75_H1_scenario_pts_NOT_FV':row['H0_plus_0p75_H1_sensitivity_points_NOT_FV'],'scenario_residual_low_NOT_CI':row['H0_plus_0p75_H1_lower_residual_scenario_NOT_CI'],'scenario_residual_high_NOT_CI':row['H0_plus_0p75_H1_upper_residual_scenario_NOT_CI'],'rank_in_GP4plus_position_scenario':row['same_eligible_position_pool_utility_rank'],'rank_in_same_pool_live_FV':row['same_eligible_position_pool_live_FV_rank'],'status':row['reliability_gate'],'owner_Maye_5500_numerical_approval_used_as_model_label':False,'owner_Nabers_5500_HOLD_used_as_model_label':False,'proposed_new_FV':'','FV_scale_independently_identified':False,'production_change_authorized':False})\n\
        \ outfile='CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv'\n csvout(out/outfile,allrec)\n csvout(out/'CAL26_R82_5_FOCUS_MULTIYEAR_ECONOMICS_NOT_FV.csv',cards)\n\
        \ csvout(out/'CAL26_R82_7_POSITION_CHRONOLOGY_AND_SCALE_GATES.csv',position)\n totaleligible=sum(len(x) for x in eligible.values())\n\
        \ decision=['# CAL26 V1R82 \u2014 empirical multi-year FV readiness and price-scale identification','',\n '**Decision: TWO-YEAR\
        \ FOOTBALL-UTILITY SCENARIOS COMPLETE; ABSOLUTE FV PRICE SCALE UNIDENTIFIED; NO DEPLOYMENT.**','',\n f'- Frozen 2026 Week6 player\
        \ universe: {len(allrec)}; scenario-eligible (4+ GP and available H0/H1): {totaleligible}; 2024\u21922025 truly chronological\
        \ H1 holdout observations: {len(h0)}.',\n '- 2026 surplus: R70 LOG-scored single-source projected 2026 fantasy points versus\
        \ position-specific REPLACEMENT ASSUMPTION (not independently calibrated).',\n '- 2027 H1: R74 2021-trained historical YTD control,\
        \ tested only on 2024 Week6\u21922025 historical outcomes. That scoring is retrospectively translated to 2026 rules and is not\
        \ guaranteed 2027-calibrated.',\n '- H0 + H1 in league fantasy points is conditional on replacement-reference consistency across\
        \ years. 0.75 weighting is illustrative sensitivity, NOT a validated discount factor. The zero-weight and full-weight cases\
        \ bracket it.',\n '- H1 residual p10/p90 are historical diagnostic scenarios NOT forecast prediction intervals. Future uncertainty\
        \ could differ.',\n '- 2028 H2 is deliberately excluded: no qualified independent two-year-ahead outcome model; age/role/availability\
        \ are shown as review context, not quantitatively calibrated longevity assumptions.',\n '- Absolute LOG FV scale is NOT identified:\
        \ R62 counted 79 league trades but zero clean single-player no-pick trades. Existing FV, owners\\' preferred Maye/Nabers values,\
        \ and DLF prices are NOT scale calibration labels.',\n '- Same-position rankings compare only the identical GP4+ H0/H1 eligible\
        \ pool; no cross-position cardinal trade equivalence.',\n '- There is no FV-per-surplus multiplier, no numeric FV candidate,\
        \ no price adjustment, no owner-approval inference, and no live writes. R81 staging remains ON HOLD.','',\n '## Five players:\
        \ conditional utility is NOT FV', '',\n '| Player | Live FV (reference) | 2026 H0 surplus | 2027 H1 surplus | H0 + 0.75\xD7\
        H1 (scenario pts) | Utility rank in same-pool | Live FV rank in same pool |',\n '|---|---:|---:|---:|---:|---:|---:|']\n for\
        \ c in cards:\n  decision.append('| {} | {} | {} | {} | {} | {} | {} |'.format(c['player'],c['live_FV_REFERENCE_ONLY'],c['2026_replacement_surplus_pts'],c['2027_next_season_surplus_pts'],c['H0_plus_0p75_H1_scenario_pts_NOT_FV'],c['rank_in_GP4plus_position_scenario'],c['rank_in_same_pool_live_FV']))\n\
        \ decision+=['','## What must be identified to justify actual Fundamental Value',\n '1. A source-consistent, historical, position-specific\
        \ 2028 continuation model with chronology and survival/availability validation; not a copy-forward H1 assumption.',\n '2. Empirically\
        \ defensible multi-season survival and discount choices, with career/age context appropriate to each role and position.',\n\
        \ '3. A declared economic unit or independent cardinal scale (trade/pick utility with dated quotes, roster replacement economics,\
        \ or owner-explicit normalized units) **distinct from Market Value**; 2026 FV reference cannot validate itself.',\n '4. Cross-position\
        \ roster economics and risk sensitivity validated before deploying any new FV formula.','',\n '## Historical H1 uncertainty',\
        \ '',\n '| Position | n | MAE points | RMSE points | 2026 4+ GP utility eligible |','|---|---:|---:|---:|---:|']\n for p in\
        \ position:decision.append(f\"| {p['position']} | {p['2024_to_2025_outer_test_n']} | {p['2024_to_2025_H1_frozen_control_MAE_points']}\
        \ | {p['H1_frozen_control_RMSE_points']} | {p['2026_GP4plus_utility_scenario_eligible_count']} |\")\n (out/'CAL26_R82_decision.md').write_text('\\\
        n'.join(decision)+'\\n',encoding='utf-8')\n result={'workflow':'CAL26_V1R82','status':'FOOTBALL_UTILITY_MEASURABLE_CARDINAL_FV_SCALE_NOT_IDENTIFIED','players':518,'focus_players':list(FOCUS),'h1_chronological_2024_to_2025_observations':1698,'two_year_scenario_eligible_gp4plus':totaleligible,'live_owner_anchors_preserved':15,'no_owner_target_fit':True,'2028_future_continuation_validated':False,'FV_per_point_identified':False,'two_year_discount_weight_learned':False,'cross_position_exchange_rate_identified':False,'production_changes':0,'price_release_authorized':False,'licensed_private_DLF_used':False,'files_sha256':{s:digest(out/s)\
        \ for s in [outfile,'CAL26_R82_5_FOCUS_MULTIYEAR_ECONOMICS_NOT_FV.csv','CAL26_R82_7_POSITION_CHRONOLOGY_AND_SCALE_GATES.csv','CAL26_R82_decision.md']},'source_sha256':pinned}\n\
        \ (out/'CAL26_R82_manifest.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\\n',encoding='utf-8')\n print('CAL26_R82_RESEARCH_COMPLETE_NO_FV_PRICE',json.dumps({k:v\
        \ for k,v in result.items() if k not in ['files_sha256','source_sha256']}))\ndef selftest():\n chk(qtl([0,10],.1)==1 and qtl([1,2,3],.5)==2,'QUANTILE_SELFTEST')\n\
        \ for x in (float('inf'),float('nan')):\n  try:num(str(x),'TEST');raise AssertionError('NONFINITE_NOT_REJECTED')\n  except AssertionError\
        \ as e:\n   if 'NONFINITE_NOT_REJECTED' in str(e):raise\n chk(round3(None)=='' and round3(1.234567)==1.235,'ROUNDING_SELFTEST')\n\
        \ print('R82_SELFTEST_GREEN')\nif __name__=='__main__':\n a=argparse.ArgumentParser()\n for k in PIN:a.add_argument('--'+k.lower())\n\
