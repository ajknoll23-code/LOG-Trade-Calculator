              }
              all_assigned.extend(order_ids)

          assert all(next_idx[t] == N_PER_TOPO for t in TOPO), next_idx
          assert len(all_assigned) == TOTAL_BALLOTS and len(set(all_assigned)) == TOTAL_BALLOTS
          assert set(all_assigned) == set(challenge_by_id)

          # Global orientation audit.
          orientation_global = {}
          for t in TOPO:
