                          v9_left += int(slot['display_left_by_challenge'][cid] == challenge_by_id[cid]['v9_favored_side'])
              assert v9_left == 120
              orientation_global[t] = {'v9_left': v9_left, 'v9_right': N_PER_TOPO - v9_left}

