      - name: Preserve B8 freeze outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v9-b8-human-catalog-assignment-freeze-v3-validator-literal-repair
          path: /tmp/package-adjustment-v9-b8/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit durable B8 freeze
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b8-human-catalog-assignment-freeze"
          test ! -e "$DEST" || { echo "ERROR: B8 durable directory already exists in checkout."; exit 1; }

          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b8/b8_*.json "$DEST/"
          cp /tmp/package-adjustment-v9-b8/b8_report.md "$DEST/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Freeze Package Adjustment V9 B8 human catalog and assignment"

          for attempt in 1 2 3; do
            git fetch origin main
            if git cat-file -e "origin/main:$DEST/b8_manifest.json" 2>/dev/null; then
              echo "ERROR: B8 durable directory appeared on main during this run; refusing to overwrite one-shot freeze."
              exit 1
            fi
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ERROR: push failed after 3 attempts; B8 outputs remain preserved in the artifact and voting is NOT authorized until the durable freeze is committed."
          exit 1

