name: B8 Package Adjustment V9 - Human Catalog and Voter Assignment Freeze V3 Validator Literal Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b8-human-catalog-assignment-freeze
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B8_ANALYSIS_VERSION: "package-adjustment-v9-b8-human-catalog-assignment-freeze-v2-session-eligibility-repair"

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up exact B7 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install pinned B7 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" \
            "scipy==1.16.2"

      - name: Guard B7 PASS, exact binding lineage, production comparator, and one-shot status
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          DEST="research/package-adjustment-v9/b8-human-catalog-assignment-freeze"
          test ! -e "$DEST" || {
            echo "ERROR: B8 durable output directory already exists; B8 is one-shot."
            exit 1
          }

          declare -A EXPECTED_BLOBS=(
            [".github/workflows/B7-package-adjustment-v9-independent-oc-confirmation-and-final-prospective-freeze-v2-estimator-anchor-catalog-binding-repair.yml"]="4008bd8a56411e2235b8e4ae05899366b1b1bf72"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_estimator_parity.json"]="3a9576b6f262a12f9b38978d0827130ed4d22d92"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_lineage_audit.json"]="58c18826f7a727e41bca1122e6883f0828644c29"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_manifest.json"]="32f052c0e8be89303500fd1353d025a1fc0ad162"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_operating_characteristics.json"]="64eab5fe58aaac73fd38476405743c66d9ef7b2d"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_output_hashes.json"]="85059e44ad43638f4a45501fb21219e44459f5de"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_preregistered_protocol.json"]="1d7b6fe63a94846ce628e8dab705bb1143b756ba"
            ["research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze/b7_report.md"]="31481b8d320de5e3f386b92190a7c094a768e028"
            ["research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment/b6d_current_player_fv_snapshot.json"]="45d41e2c419c5f9a280fad9ba4b16266b9ba3279"
            ["research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment/b6d_manifest.json"]="c0fb06353e3be04b8f854ff0150074161ecd899e"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen B7/B6D lineage drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY1'
          import hashlib,json,subprocess
          from pathlib import Path

          def load(p): return json.loads(Path(p).read_text())
          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          B7=Path('research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze')
          B6D=Path('research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment')
          m=load(B7/'b7_manifest.json')
          l=load(B7/'b7_lineage_audit.json')
          e=load(B7/'b7_estimator_parity.json')
          h=load(B7/'b7_output_hashes.json')
          snap=load(B6D/'b6d_current_player_fv_snapshot.json')

          expected_content={
            'b7_estimator_parity.json':'d99d9a44b921e54e3063d0eabe1f8ebfc8f4b4fc275a70f77f95f8a04c89d5de',
            'b7_lineage_audit.json':'f5a166e10574b562d9b6347b2d711d13973758190bd67477c41e8b825600834a',
            'b7_manifest.json':'31b5d1e21c03602947e3309d0ed953bf1f5722e6597dda9ee303eea20f6539f1',
            'b7_operating_characteristics.json':'6cc5b995fe3e0a8a9e1260b92e809ac779fb04ac7c45aa6299a3f3d7350229d6',
            'b7_preregistered_protocol.json':'d2816ab027821fa4b0fa1fcf9364554881b54747a59d92874124406c464e7fbe',
            'b7_report.md':'26f788790931c8ec8328532a1a9316a2585ed6aacb5e5aef90fadf798bc409d9',
          }
          assert h==expected_content,(h,expected_content)
          for n,s in expected_content.items():
            assert sha256(B7/n)==s,(n,sha256(B7/n),s)

          assert m['decision']=='PASS_B7_OC_CONFIRMATION_AUTHORIZE_B8_CATALOG_FREEZE'
          assert m['status']=='PASS_B7_INDEPENDENT_OC_CONFIRMATION_COMPLETE'
          assert m['primary_power_gate_passed'] is True
          assert m['safety_gate_passed'] is True
          assert m['b8_catalog_freeze_authorized'] is True
          assert m['human_catalog_generated'] is False
          assert m['human_voting_authorized'] is False
          assert m['human_outcomes_exist_or_were_read'] is False
          assert m['production_change_authorized'] is False
          assert m['v9_eligible_topologies']==['2v3','3v3','3v4','4v4']
          assert m['v1_7_only_topologies']==['2v2','2v4']
          assert m['sample_size_per_topology']==240 and m['total_ballots']==960 and m['voters']==40
          assert e['status']=='PASS_EXACT_B6_ESTIMATOR_PARITY'
          assert e['anchored_to_guarded_b6_source'] is True and e['max_abs_difference']==0.0
          assert l['status']=='PASS_B7_LINEAGE_AND_TRANSIENT_CATALOG_RECONSTRUCTION'
          assert l['b8_bound_witness']==1
          assert l['b8_bound_catalog_signature_set_sha256']=='dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62'
          assert l['persisted_b6d_snapshot_sha256']=='540e1bb3608850e69fb2244fc8a873c6d4c0b7fbb1bb733deca78d7dca97555a'
          assert sha256(B6D/'b6d_current_player_fv_snapshot.json')==l['persisted_b6d_snapshot_sha256']

          # Production comparator implementation cannot drift between B7 and the B8 freeze.
          for p in ('index.html','scripts/validation/snapshot_values.py'):
            expected=snap['source_files'][p]['git_blob']
            actual=subprocess.check_output(['git','hash-object',p],text=True).strip()
            assert actual==expected,(p,expected,actual)

          print('PASS: exact B7 scientific PASS/binding, B6D source, and production comparator lineage guarded for B8.')
          PY1

      - name: Regenerate bound witness and freeze B8 human catalog, assignment, evaluator, and transport contract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b8
          mkdir -p /tmp/package-adjustment-v9-b8

          cat > /tmp/package-adjustment-v9-b8/analyze_b8.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import platform
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path

          import numpy as np
          import scipy
          from scipy.optimize import Bounds, LinearConstraint, milp
          from scipy.sparse import coo_matrix

          ROOT = Path('.')
          OUT = Path('/tmp/package-adjustment-v9-b8')
          VERSION = os.environ.get('B8_ANALYSIS_VERSION', 'package-adjustment-v9-b8-human-catalog-assignment-freeze-v2-session-eligibility-repair')

          B7 = ROOT / 'research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze'
          B6D = ROOT / 'research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment'
          OLD_CATALOG = ROOT / 'research/package-adjustment-v8/development_catalog_v1.json'

          B7_BOUND_CATALOG_SHA256 = 'dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62'
          B8_ASSIGNMENT_SEED = 2026100508
          STUDY_ID = 'package-adjustment-v9-discordant-human-validation'
          TOPO = ['2v3', '3v3', '3v4', '4v4']
          Q = 2.9897594788655337
          THETA_MIN = 0.60
          POWER_ALT = 0.65
          FAIR = 0.07
          FWER_ALPHA = 0.05
          VOTERS = 40
          BALLOTS_PER_VOTER = 24
          BALLOTS_PER_TOPO_PER_VOTER = 6
          N_PER_TOPO = 240
          TOTAL_BALLOTS = 960

          MIN_PLAYER_FV = 2500
          SIZE2_MIN_FV = 3000
          RAW_RATIO_MIN = 0.75
          SIDE_MIN_TOTAL = {2: 7000, 3: 9000, 4: 11500}
          SIDE_PROFILES = {
              2: [(0.50, 0.50), (0.60, 0.40), (0.70, 0.30)],
              3: [(0.34, 0.33, 0.33), (0.45, 0.33, 0.22), (0.55, 0.30, 0.15), (0.65, 0.20, 0.15)],
              4: [(0.25, 0.25, 0.25, 0.25), (0.35, 0.28, 0.22, 0.15), (0.45, 0.25, 0.18, 0.12), (0.55, 0.18, 0.15, 0.12)],
          }
          NEAREST_LIMIT = 64
          PROFILE_VARIANTS = 32
          PER_ANCHOR_CANDIDATES = 24
          PROBE_MULTIPLIER = 6
          RESERVOIR_CAP_PER_TOPOLOGY = 5000
          WITNESS_TIME_LIMIT_SECONDS = 900


          def load(p):
              return json.loads(Path(p).read_text())


          def sha256_file(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()


          def canonical_sha(obj):
              return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()


          def h64(s):
              return int(hashlib.sha256(s.encode()).hexdigest()[:16], 16)


          def canonical_side(keys):
              return '|'.join(sorted(keys))


          def canonical_trade(a, b):
              return '||'.join(sorted((canonical_side(a), canonical_side(b))))


          # Bind the future human-data evaluator to the exact guarded B6 scalar estimator
          # identity already verified by B7. Reading this upstream metadata occurs before
          # any B8 challenge identity is regenerated.
          b7_estimator_parity_pre = load(B7 / 'b7_estimator_parity.json')
          assert b7_estimator_parity_pre['status'] == 'PASS_EXACT_B6_ESTIMATOR_PARITY'
          assert b7_estimator_parity_pre['anchored_to_guarded_b6_source'] is True
          B6_ESTIMATOR_SOURCE_SHA256 = b7_estimator_parity_pre['b6_function_source_sha256']
          assert isinstance(B6_ESTIMATOR_SOURCE_SHA256, str) and len(B6_ESTIMATOR_SOURCE_SHA256) == 64

          # B8 protocol is frozen before regenerating witness 1 or creating any challenge identity.
          protocol = {
              'analysis_version': VERSION,
              'status': 'PREREGISTERED_B8_HUMAN_CATALOG_AND_ASSIGNMENT_FREEZE',
              'study_id': STUDY_ID,
              'purpose': 'Regenerate the exact B7-bound witness-1 catalog, persist the 960 human challenges, freeze a 40-slot balanced assignment, and freeze the later human-outcome evaluator before any voting begins.',
              'b7_bound_catalog_signature_set_sha256': B7_BOUND_CATALOG_SHA256,
              'candidate_id': 'V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q',
              'q': Q,
              'theta_min': THETA_MIN,
              'power_alternative': POWER_ALT,
              'fair_band': FAIR,
              'familywise_alpha': FWER_ALPHA,
              'retained_topologies': TOPO,
              'v1_7_only_topologies': ['2v2', '2v4'],
              'catalog': {
                  'source': 'persisted B6D player/FV snapshot only',
                  'generator': 'exact B7 witness-1 source-frame generator and zero-objective Tier-C MILP',
                  'selected_challenges_per_topology': N_PER_TOPO,
                  'total_challenges': TOTAL_BALLOTS,
                  'candidate_predictions_used_for_selection': True,
                  'reason_candidate_predictions_are_used': 'The frozen estimand is conditional on true V9 vs V1.7 non-fair verdict discordance.',
                  'exact_v8_development_trade_overlap_allowed': False,
                  'tier_c_caps': {
                      'max_player_appearances_per_topology': 48,
                      'max_player_appearances_global': 96,
                      'max_exact_side_bundle_reuse_per_topology': 12,
                  },
                  'joe_mixon_allowed': False,
                  'voter_safe_catalog_must_exclude': ['fv', 'raw_fv', 'v9_score', 'v9_favored_side', 'v1_7_favored_side', 'trade_signature', 'candidate_score'],
              },
              'assignment': {
                  'seed': B8_ASSIGNMENT_SEED,
                  'voter_slots': VOTERS,
                  'ballots_per_slot': BALLOTS_PER_VOTER,
                  'ballots_per_topology_per_slot': BALLOTS_PER_TOPO_PER_VOTER,
                  'votes_per_challenge': 1,
                  'challenge_reuse_across_slots': False,
                  'left_right_balance': 'within every slot x topology: exactly 3 V9-favored-side-left and 3 V9-favored-side-right',
                  'display_position_topology_balance': 'within each of 24 display positions across 40 slots, every topology appears exactly 10 times',
                  'randomization_method': 'ten random 24-position base topology sequences, each containing six of every topology; each base is expanded to four slots using a cyclic topology-label rotation. Challenges are independently seed-shuffled within topology and consumed once.',
                  'seed_reroll_allowed': False,
              },
              'attrition': {
                  'complete_slot_required': True,
                  'incomplete_voter_partial_ballots_excluded': True,
                  'replacement_voter_receives_identical_24_challenge_slot': True,
                  'replacement_voter_uses_new_session_id': True,
                  'slot_reassignment_changes_not_allowed': True,
                  'early_stop_before_40_complete_slots': False,
              },
              'response_eligibility': {
                  'row_validity': 'a row is valid only if its challenge_id belongs to its slot schedule, canonical_left equals the frozen schedule display_left for that slot/challenge, display_order equals the frozen position, clicked_display_L_or_R is consistent with canonical_choice and canonical_left, and utc_iso8601_timestamp is a parseable UTC timestamp',
                  'session_validity': 'a session is invalid if any row is invalid, if it contains rows for more than one slot, or if any challenge is voted more than once within the session',
                  'complete_session': 'a valid session containing exactly one vote for each of its slot\'s 24 challenges',
                  'accepted_session_per_slot': 'the complete session with the earliest final-vote timestamp; if complete sessions tie on final-vote timestamp, the lexicographically smallest session_id wins; every other session for that slot (partial or complete, earlier or later) is excluded and recorded',
                  'replacement': 'a replacement voter receives the identical slot URL and a new session_id; no challenge moves between slots',
                  'maturity': 'analysis opens only when all 40 slots have exactly one accepted session (960 rows); no early opening',
                  'all_exclusions_outcome_blind': 'every eligibility decision above uses only identifiers, timestamps, schedule consistency and completeness, never the choice made',
                  'voter_eligibility': 'one person per slot; people who have seen V9 research artifacts, model verdicts or this study design (including the project owner and reviewers) are ineligible',
                  'voter_instruction': 'judge each trade on your own dynasty valuation without consulting any trade calculator or value chart',
              },
              'frozen_outcome_evaluator': {
                  'estimand': 'theta_t = P(manager chooses V9 verdict | V9 and V1.7 give opposite non-fair verdicts, topology t)',
                  'outcome': '1 iff canonical human choice equals the frozen V9-favored side for that challenge',
                  'left_covariate': '+1 iff V9-favored side was displayed left; -1 otherwise',
                  'estimator': 'direct LPM intercept with centered left/right covariate',
                  'estimator_implementation': 'guarded B6 cluster_lpm, general scalar form',
                  'estimator_source_sha256': B6_ESTIMATOR_SOURCE_SHA256,
                  'standard_error': 'CR1 voter-cluster robust',
                  'cr1_small_sample_factor': 'G/(G-1) * (N-1)/(N-k)',
                  'reference_distribution': 'Student t with G-1 degrees of freedom',
                  'null': 'theta_t <= 0.50',
                  'multiplicity': 'Holm step-down across exactly m=4 retained topologies',
                  'activation': 'Holm rejects AND theta_hat_t >= 0.60',
                  'log_loss': 'secondary only; cannot activate or rescue a topology',
                  'topology_router': 'each retained topology activates independently; non-activated retained topologies and all 2v2/2v4 remain V1.7',
                  'changed_from_b6_b7': False,
              },
              'transport_contract': {
                  'base_route': 'index.html#market-research',
                  'slot_query_parameter': 'pkgv9slot',
                  'slot_url_shape': 'index.html?pkgv9slot=<1..40>#market-research',
                  'vote_prefix': '__pkgv9val__|',
                  'keep_format': '__pkgv9val__|<challenge_id>|<canonical_choice_A_or_B>|<clicked_display_L_or_R>|<session_id>|<utc_iso8601_timestamp>',
                  'meta_prefix': '__pkgv9val_meta__|',
                  'trade_format': '__pkgv9val_meta__|<challenge_id>|<canonical_left_A_or_B>|<slot_1_to_40>|<display_order_0_to_23>|<session_id>',
                  'session_id_rule': 'random >=128-bit identifier generated client-side when a slot session starts; never reused across sessions or slots',
                  'timestamp_rule': 'utc_iso8601_timestamp is recorded for every vote row and must parse as UTC; session final-vote timestamp is the maximum valid row timestamp; exact ties are resolved by lexicographic session_id as frozen in response_eligibility',
                  'canonical_side_labels_visible_to_voter': False,
                  'schema_marker': '__pkgv9val_schema__|1',
                  'normal_ktc_ratings_consume_v9_rows': False,
                  'transport_activated_by_b8': False,
              },
              'human_outcomes_exist_or_were_read': False,
              'production_change_authorized': False,
          }
          OUT.mkdir(parents=True, exist_ok=True)
          (OUT / 'b8_preregistered_protocol.json').write_text(json.dumps(protocol, indent=2, sort_keys=True) + '\n')

          # Guard B7 PASS and its binding promise inside the analysis process too.
          b7_manifest = load(B7 / 'b7_manifest.json')
          b7_lineage = load(B7 / 'b7_lineage_audit.json')
          b7_protocol = load(B7 / 'b7_preregistered_protocol.json')
          b7_estimator_parity = load(B7 / 'b7_estimator_parity.json')
          b6d_source = load(B6D / 'b6d_current_player_fv_snapshot.json')
          assert b7_manifest['decision'] == 'PASS_B7_OC_CONFIRMATION_AUTHORIZE_B8_CATALOG_FREEZE'
          assert b7_manifest['b8_catalog_freeze_authorized'] is True
          assert b7_manifest['primary_power_gate_passed'] is True
          assert b7_manifest['safety_gate_passed'] is True
          assert b7_manifest['human_catalog_generated'] is False
          assert b7_manifest['human_voting_authorized'] is False
          assert b7_manifest['production_change_authorized'] is False
          assert b7_manifest['v9_eligible_topologies'] == TOPO
          assert b7_lineage['b8_bound_witness'] == 1
          assert b7_lineage['b8_bound_catalog_signature_set_sha256'] == B7_BOUND_CATALOG_SHA256
          assert b7_protocol['b8_catalog_binding']['rule'].startswith('B8 human catalog must regenerate transient witness 1')
          assert b7_estimator_parity['b6_function_source_sha256'] == B6_ESTIMATOR_SOURCE_SHA256
          assert b7_estimator_parity['b6_function_name'] == 'cluster_lpm'
          assert b6d_source['status'] == 'FROZEN_B6D_CANDIDATE_BLIND_CURRENT_PLAYER_FV_SOURCE'
          assert b6d_source['player_count'] == 528
          assert b6d_source['draft_picks_included'] is False
          assert b6d_source['market_values_used'] is False

          # Record the exact runtime/toolchain used to regenerate the B7-bound witness.
          try:
              import scipy.optimize._highspy._core as highs_core
              highs_version = f"{highs_core.HIGHS_VERSION_MAJOR}.{highs_core.HIGHS_VERSION_MINOR}.{highs_core.HIGHS_VERSION_PATCH}"
          except Exception:
              highs_version = 'unavailable'
          toolchain = {
              'python_version': platform.python_version(),
              'python_implementation': platform.python_implementation(),
              'numpy_version': np.__version__,
              'scipy_version': scipy.__version__,
              'highs_version': highs_version,
              'platform': platform.platform(),
              'expected_python_version_from_successful_b7_runner': '3.13.15',
              'expected_numpy_version': '2.3.3',
              'expected_scipy_version': '1.16.2',
          }
          assert toolchain['python_version'] == '3.13.15', toolchain
          assert toolchain['numpy_version'] == '2.3.3', toolchain
          assert toolchain['scipy_version'] == '1.16.2', toolchain

          # Exact B7/B6D candidate-frame reconstruction.
          def candidate_score(fvs):
              n = len(fvs)
              return (n ** (1.0 - 1.0 / Q)) * (sum(float(v) ** Q for v in fvs) ** (1.0 / Q))


          def verdict(a, b):
              d = abs(float(a) - float(b)) / max(float(a), float(b), 1.0)
              if d < FAIR - 1e-15:
                  return None, d
              return ('A' if a > b else 'B'), d


          def strength_bucket(x):
              if x < .10:
                  return '7-10%'
              if x < .15:
                  return '10-15%'
              return '15%+'


          old = load(OLD_CATALOG)
          old_sigs = {
              canonical_trade([x['key'] for x in ch['side_A']['assets']], [x['key'] for x in ch['side_B']['assets']])
              for ch in old['challenges']
          }
          assert len(old_sigs) == 40

          eligible = [dict(p) for p in b6d_source['players'] if int(p['fv']) >= MIN_PLAYER_FV]
          eligible.sort(key=lambda p: (int(p['fv']), p['key']))
          meta_by_key = {p['key']: p for p in eligible}


          def nearest(source, desired, used):
              rows = [p for p in source if p['key'] not in used]
              rows.sort(key=lambda p: (abs(int(p['fv']) - desired), p['key']))
              return rows[:NEAREST_LIMIT]


          def make_side(rows, size):
              fvs = [int(p['fv']) for p in rows]
              total = sum(fvs)
              keys = tuple(sorted(p['key'] for p in rows))
              score = candidate_score(fvs)
              return {
                  'keys': keys,
                  'keyset': frozenset(keys),
                  'raw': total,
                  'score': score,
                  'mult': score / total,
                  'apex': max(fvs),
                  'min_fv': min(fvs),
                  'min_share': min(v / total for v in fvs),
                  'signature': canonical_side(keys),
              }


          def build_pool(size):
              source = [p for p in eligible if size != 2 or int(p['fv']) >= SIZE2_MIN_FV]
              out = {}
              for anchor in source:
                  for profile in SIDE_PROFILES[size]:
                      goal = int(anchor['fv']) / profile[0]
                      for variant in range(PROFILE_VARIANTS):
                          chosen = [anchor]
                          used = {anchor['key']}
                          for i in range(1, size):
                              rows = nearest(source, goal * profile[i], used)
                              if not rows:
                                  chosen = []
                                  break
                              pick = rows[(variant * (2 * i + 1) + i * 7) % len(rows)]
                              chosen.append(pick)
                              used.add(pick['key'])
                          if len(chosen) != size:
                              continue
                          side = make_side(chosen, size)
                          if side['raw'] < SIDE_MIN_TOTAL[size] or side['apex'] < 4000 or side['min_share'] < 0.10 - 1e-12:
                              continue
                          if size == 2 and side['min_fv'] < SIZE2_MIN_FV:
                              continue
                          out.setdefault(side['signature'], side)
              return sorted(out.values(), key=lambda s: (s['raw'], s['signature']))


          pools = {n: build_pool(n) for n in (2, 3, 4)}
          expected_pool = {2: 7827, 3: 12521, 4: 13037}
          assert {n: len(pools[n]) for n in pools} == expected_pool, ({n: len(pools[n]) for n in pools}, expected_pool)


          def reservoir_add(heap, bysig, cand):
              import heapq
              sig = cand['trade_signature']
              if sig in bysig:
                  return
              rank = h64(sig)
              item = (-rank, sig)
              if len(heap) < RESERVOIR_CAP_PER_TOPOLOGY:
                  heapq.heappush(heap, item)
                  bysig[sig] = cand
              elif item > heap[0]:
                  _, old_sig = heapq.heapreplace(heap, item)
                  bysig.pop(old_sig, None)
                  bysig[sig] = cand


          def probe_positions(idx, a_signature):
              m = len(idx)
              cap = PER_ANCHOR_CANDIDATES * PROBE_MULTIPLIER
              if m <= cap:
                  return idx.tolist()
              start = h64(a_signature) % m
              step = max(1, m // cap)
              out = []
              seen = set()
              for j in range(cap * 3):
                  z = int(idx[(start + j * step) % m])
                  if z not in seen:
                      seen.add(z)
                      out.append(z)
                      if len(out) >= cap:
                          break
              return out


          def build_reservoir(topo):
              na, nb = map(int, topo.split('v'))
              A = pools[na]
              B = pools[nb]
              order = np.argsort(np.asarray([s['raw'] for s in B], float), kind='stable')
              B = [B[int(i)] for i in order]
              b_raw = np.asarray([s['raw'] for s in B], float)
              b_score = np.asarray([s['score'] for s in B], float)
              Aorder = sorted(A, key=lambda s: (-abs(s['mult'] - 1.0), h64(s['signature'])))
              heap = []
              bysig = {}
              for a in Aorder:
                  lo = np.searchsorted(b_raw, RAW_RATIO_MIN * a['raw'], side='left')
                  hi = np.searchsorted(b_raw, a['raw'] / RAW_RATIO_MIN, side='right')
                  if hi <= lo:
                      continue
                  rr = b_raw[lo:hi]
                  ss = b_score[lo:hi]
                  case1 = (rr <= (1.0 - FAIR) * a['raw'] + 1e-12) & (ss >= a['score'] / (1.0 - FAIR) - 1e-12)
                  case2 = (rr >= a['raw'] / (1.0 - FAIR) - 1e-12) & (ss <= (1.0 - FAIR) * a['score'] + 1e-12)
                  idx = np.flatnonzero(case1 | case2)
                  if idx.size == 0:
                      continue
                  accepted = 0
                  for local_z in probe_positions(idx, a['signature']):
                      b = B[lo + int(local_z)]
                      if a['keyset'] & b['keyset']:
                          continue
                      sig = canonical_trade(a['keys'], b['keys'])
                      if sig in old_sigs:
                          continue
                      raw_side, raw_margin = verdict(a['raw'], b['raw'])
                      v9_side, v9_margin = verdict(a['score'], b['score'])
                      if raw_side is None or v9_side is None or raw_side == v9_side:
                          continue
                      reservoir_add(heap, bysig, {
                          'topology': topo,
                          'trade_signature': sig,
                          'trade_hash': hashlib.sha256(sig.encode()).hexdigest(),
                          'player_keys': tuple(sorted(a['keyset'] | b['keyset'])),
                          'side_signatures': tuple(sorted((a['signature'], b['signature']))),
                          'side_a_keys': tuple(a['keys']),
                          'side_b_keys': tuple(b['keys']),
                          'side_a_raw': int(a['raw']),
                          'side_b_raw': int(b['raw']),
                          'side_a_score': float(a['score']),
                          'side_b_score': float(b['score']),
                          'v9_side': v9_side,
                          'raw_side': raw_side,
                          'raw_margin': float(raw_margin),
                          'v9_margin': float(v9_margin),
                          'strength_bucket': strength_bucket(min(raw_margin, v9_margin)),
                      })
                      accepted += 1
                      if accepted >= PER_ANCHOR_CANDIDATES:
                          break
              return sorted(bysig.values(), key=lambda c: c['trade_hash'])


          five = ['2v3', '2v4', '3v3', '3v4', '4v4']
          reservoirs = {t: build_reservoir(t) for t in five}
          expected_res = {'2v3': 3812, '2v4': 256, '3v3': 5000, '3v4': 5000, '4v4': 5000}
          actual_res = {t: len(reservoirs[t]) for t in five}
          assert actual_res == expected_res, (actual_res, expected_res)

          # Exact witness-1 solve: same selected_pool ordering, constraints, zero objective and MILP options as B7.
          selected_pool = [c for t in TOPO for c in reservoirs[t]]
          target = N_PER_TOPO
          caps = {'per_topology_player_cap': 48, 'global_player_cap': 96, 'side_reuse_cap': 12}
          idx_by_topo = defaultdict(list)
          idx_by_tp = defaultdict(list)
          idx_by_player = defaultdict(list)
          idx_by_tside = defaultdict(list)
          for i, c in enumerate(selected_pool):
              t = c['topology']
              idx_by_topo[t].append(i)
              for p in c['player_keys']:
                  idx_by_tp[(t, p)].append(i)
                  idx_by_player[p].append(i)
              for s in c['side_signatures']:
                  idx_by_tside[(t, s)].append(i)

          rows = []

          def add_row(indices, lo, hi):
              rows.append((tuple(indices), float(lo), float(hi)))

          for t in TOPO:
              add_row(idx_by_topo[t], target, target)
          for inds in idx_by_tp.values():
              add_row(inds, -np.inf, caps['per_topology_player_cap'])
          for inds in idx_by_player.values():
              add_row(inds, -np.inf, caps['global_player_cap'])
          for inds in idx_by_tside.values():
              if len(inds) > caps['side_reuse_cap']:
                  add_row(inds, -np.inf, caps['side_reuse_cap'])

          row = []
          col = []
          data = []
          lb = []
          ub = []
          for r, (inds, lo, hi) in enumerate(rows):
              for j in inds:
                  row.append(r)
                  col.append(j)
                  data.append(1.0)
              lb.append(lo)
              ub.append(hi)
          A = coo_matrix((data, (row, col)), shape=(len(rows), len(selected_pool))).tocsr()
          res = milp(
              np.zeros(len(selected_pool), dtype=float),
              integrality=np.ones(len(selected_pool), dtype=int),
              bounds=Bounds(np.zeros(len(selected_pool)), np.ones(len(selected_pool))),
              constraints=LinearConstraint(A, np.asarray(lb), np.asarray(ub)),
              options={'time_limit': WITNESS_TIME_LIMIT_SECONDS, 'presolve': True},
          )
          if res.x is None or not np.all(np.isfinite(res.x)):
              raise RuntimeError(f'B8 could not regenerate B7 witness 1; status={res.status} message={res.message}')
          chosen_idx = [i for i, x in enumerate(res.x) if x > 0.5]
          assert len(chosen_idx) == TOTAL_BALLOTS
          chosen = [selected_pool[i] for i in chosen_idx]
          signature_payload = '\n'.join(sorted(f"{c['topology']}|{c['trade_signature']}" for c in chosen))
          regenerated_sha = hashlib.sha256(signature_payload.encode()).hexdigest()
          assert regenerated_sha == B7_BOUND_CATALOG_SHA256, (regenerated_sha, B7_BOUND_CATALOG_SHA256)
          assert all('joe mixon' not in c['player_keys'] for c in chosen), 'Joe Mixon is prohibited from the B8 human catalog'
          assert not any(c['trade_signature'] in old_sigs for c in chosen)

          bytop = {t: [c for c in chosen if c['topology'] == t] for t in TOPO}
          assert all(len(bytop[t]) == N_PER_TOPO for t in TOPO)
          global_pc = Counter()
          topo_pc = defaultdict(Counter)
          side_pc = defaultdict(Counter)
          for c in chosen:
              for p in c['player_keys']:
                  global_pc[p] += 1
                  topo_pc[c['topology']][p] += 1
              for s in c['side_signatures']:
                  side_pc[c['topology']][s] += 1
          assert max(global_pc.values()) <= 96
          assert max(max(v.values()) for v in topo_pc.values()) <= 48
          assert max(max(v.values()) for v in side_pc.values()) <= 12

          # Persist the exact human catalog. IDs are deterministic and model-neutral.
          chosen_sorted = sorted(chosen, key=lambda c: (TOPO.index(c['topology']), c['trade_hash']))
          full_challenges = []
          safe_challenges = []
          challenge_by_id = {}
          for seq, c in enumerate(chosen_sorted, start=1):
              cid = f'pkgv9val_{seq:04d}'

              def full_asset(key):
