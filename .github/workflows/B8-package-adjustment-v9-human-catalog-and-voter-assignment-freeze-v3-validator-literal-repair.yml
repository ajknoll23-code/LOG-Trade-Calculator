      - name: Validate B8 freeze contract and no-outcome firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import hashlib,json
          from collections import Counter
          from pathlib import Path

          D=Path('/tmp/package-adjustment-v9-b8')
          load=lambda n:json.loads((D/n).read_text())
          sha=lambda n:hashlib.sha256((D/n).read_bytes()).hexdigest()

          p=load('b8_preregistered_protocol.json')
          full=load('b8_human_catalog_full_evaluator.json')
          safe=load('b8_voter_safe_challenges.json')
          sched=load('b8_voter_assignment_schedule.json')
          ev=load('b8_frozen_human_outcome_evaluator.json')
          tr=load('b8_voting_transport_contract.json')
          a=load('b8_catalog_assignment_audit.json')
          m=load('b8_manifest.json')
          h=load('b8_output_hashes.json')

          bound='dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62'
          topo=['2v3','3v3','3v4','4v4']
          assert p['status']=='PREREGISTERED_B8_HUMAN_CATALOG_AND_ASSIGNMENT_FREEZE'
          assert p['b7_bound_catalog_signature_set_sha256']==bound
          assert p['assignment']['seed']==2026100508 and p['assignment']['seed_reroll_allowed'] is False
          assert p['human_outcomes_exist_or_were_read'] is False
          assert p['production_change_authorized'] is False

          assert full['status']=='FROZEN_B8_FULL_EVALUATOR_CATALOG'
          assert safe['status']=='FROZEN_B8_VOTER_SAFE_CATALOG'
          assert full['catalog_signature_set_sha256']==bound
          assert full['challenge_count']==safe['challenge_count']==960
          assert len({c['id'] for c in full['challenges']})==960
          assert [c['id'] for c in full['challenges']]==[c['id'] for c in safe['challenges']]
          assert Counter(c['topology'] for c in full['challenges'])==Counter({t:240 for t in topo})
          assert not any(a0['key']=='joe mixon' for c in full['challenges'] for s in ('side_A','side_B') for a0 in c[s]['assets'])

          forbidden={'fv','raw_fv','v9_score','v9_favored_side','v1_7_favored_side','trade_signature','candidate_score'}
          def scan(o):
            out=set()
            if isinstance(o,dict):
              for k,v in o.items():out.add(k);out|=scan(v)
            elif isinstance(o,list):
              for v in o:out|=scan(v)
            return out
          assert not (scan(safe)&forbidden),(scan(safe)&forbidden)

          byid={c['id']:c for c in full['challenges']}
          assert sched['status']=='FROZEN_B8_VOTER_ASSIGNMENT_SCHEDULE'
          assert sched['seed']==2026100508
          assert sched['accepted_voter_slots']==40 and sched['challenges_per_slot']==24
          assert set(sched['slots'])=={str(i) for i in range(1,41)}
          allids=[]
          position=[Counter() for _ in range(24)]
          for slot in sched['slots'].values():
            ids=slot['challenge_order']
            assert len(ids)==len(set(ids))==24
            ct=Counter(byid[x]['topology'] for x in ids)
            assert ct==Counter({t:6 for t in topo}),ct
            for j,cid in enumerate(ids):position[j][byid[cid]['topology']]+=1
            for t in topo:
              local=[cid for cid in ids if byid[cid]['topology']==t]
              v9left=sum(slot['display_left_by_challenge'][cid]==byid[cid]['v9_favored_side'] for cid in local)
              assert v9left==3,(slot['accepted_voter_slot'],t,v9left)
            allids+=ids
          assert len(allids)==len(set(allids))==960 and set(allids)==set(byid)
          assert all(c==Counter({t:10 for t in topo}) for c in position),position

          assert ev['status']=='FROZEN_B8_HUMAN_OUTCOME_EVALUATOR'
          assert ev['catalog_signature_set_sha256']==bound
          assert ev['accepted_complete_voter_slots_exactly']==40
          assert ev['accepted_ballots_exactly']==960
          assert ev['outcome_opening_before_40_complete_slots_allowed'] is False
          assert ev['production_change_authorized'] is False
          assert set(ev['challenge_truth'])==set(byid)
          assert tr['status']=='FROZEN_B8_VOTING_TRANSPORT_CONTRACT_NOT_YET_DEPLOYED'
          assert tr['transport_activated_by_b8'] is False
          assert tr['slot_query_parameter']=='pkgv9slot'
          assert tr['vote_prefix']=='__pkgv9val__|'
          assert tr['schema_marker']=='__pkgv9val_schema__|1'
          assert '<session_id>' in tr['keep_format'] and '<session_id>' in tr['trade_format']
          assert '<clicked_display_L_or_R>' in tr['keep_format'] and '<utc_iso8601_timestamp>' in tr['keep_format']
          assert '<challenge_id>' in tr['trade_format']
          assert 'lexicographically smallest session_id' in p['response_eligibility']['accepted_session_per_slot']
          assert 'must parse as UTC' in tr['timestamp_rule']
          assert tr['canonical_side_labels_visible_to_voter'] is False
          assert ev['response_eligibility']==p['response_eligibility']==tr['response_eligibility']
          assert 'earliest' in p['response_eligibility']['accepted_session_per_slot']
          assert 'never the choice made' in p['response_eligibility']['all_exclusions_outcome_blind']
          assert ev['frozen_inference']['estimator_implementation']=='guarded B6 cluster_lpm, general scalar form'
          assert ev['frozen_inference']['estimator_source_sha256']==p['frozen_outcome_evaluator']['estimator_source_sha256']
          assert len(ev['frozen_inference']['estimator_source_sha256'])==64

          # Defense in depth: recompute Tier-C caps and side-disjointness from persisted full catalog.
          global_pc=Counter(); topo_pc={t:Counter() for t in topo}; side_pc={t:Counter() for t in topo}
          for c in full['challenges']:
            akeys=[x['key'] for x in c['side_A']['assets']]
            bkeys=[x['key'] for x in c['side_B']['assets']]
            assert len(akeys)==len(set(akeys))==c['side_A']['asset_count']
            assert len(bkeys)==len(set(bkeys))==c['side_B']['asset_count']
            assert set(akeys).isdisjoint(bkeys)
            for k in set(akeys+bkeys):
              global_pc[k]+=1; topo_pc[c['topology']][k]+=1
            for keys in (akeys,bkeys):
              sig='|'.join(sorted(keys)); side_pc[c['topology']][sig]+=1
          assert max(global_pc.values())<=96
          assert max(max(v.values()) for v in topo_pc.values())<=48
          assert max(max(v.values()) for v in side_pc.values())<=12

          assert a['status']=='PASS_B8_CATALOG_AND_ASSIGNMENT_AUDIT'
          assert a['binding_match'] is True
          assert a['regenerated_catalog_signature_set_sha256']==bound
          assert a['exact_v8_development_trade_overlap_count']==0
          assert a['joe_mixon_occurrences']==0
          assert a['all_challenges_assigned_once'] is True and a['position_balance_exact'] is True
          assert a['toolchain']['python_version']=='3.13.15'
          assert a['toolchain']['numpy_version']=='2.3.3'
          assert a['toolchain']['scipy_version']=='1.16.2'

          assert m['status']=='PASS_B8_HUMAN_CATALOG_AND_ASSIGNMENT_FREEZE_COMPLETE'
          assert m['decision']=='PASS_B8_CATALOG_AND_ASSIGNMENT_FREEZE_AUTHORIZE_HUMAN_VOTING_TRANSPORT_DEPLOYMENT'
          assert m['catalog_signature_set_sha256']==bound and m['b7_binding_match'] is True
          assert m['human_catalog_generated'] is True
          assert m['human_voting_authorized'] is True
          assert 'durably committed on main' in m['human_voting_authorization_effective_only_if']
          assert 'artifact-only copies do not authorize voting' in m['human_voting_authorization_effective_only_if']
          assert m['voting_transport_activated'] is False
          assert m['human_outcomes_exist_or_were_read'] is False
          assert m['production_change_authorized'] is False
          assert m['frozen_evaluator_committed_with_catalog'] is True
          assert m['v9_eligible_topologies']==topo and m['v1_7_only_topologies']==['2v2','2v4']

          for n,s in h.items():
            assert sha(n)==s,(n,sha(n),s)
          assert m['output_sha256']=={n:h[n] for n in m['output_sha256']}
          print('PASS: B8 exact B7-bound catalog, assignment balance, voter-safe firewall, frozen evaluator/transport, and durable hashes validated.')
