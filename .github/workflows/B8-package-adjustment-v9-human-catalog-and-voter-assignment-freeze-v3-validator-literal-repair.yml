          assert [x['id'] for x in full_challenges] == [x['id'] for x in safe_challenges]

          # Explicit safe-catalog leakage audit.
          forbidden_safe_keys = {'fv', 'raw_fv', 'v9_score', 'v9_favored_side', 'v1_7_favored_side', 'trade_signature', 'candidate_score'}
          def scan_keys(obj):
              out = set()
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      out.add(k)
                      out |= scan_keys(v)
              elif isinstance(obj, list):
                  for v in obj:
                      out |= scan_keys(v)
              return out
          assert not (scan_keys(safe_catalog) & forbidden_safe_keys), scan_keys(safe_catalog) & forbidden_safe_keys

          # Freeze assignment with no seed shopping. Each challenge is used exactly once.
          rng = np.random.default_rng(B8_ASSIGNMENT_SEED)
          ids_by_topo = {t: [c['id'] for c in full_challenges if c['topology'] == t] for t in TOPO}
          for t in TOPO:
              ids_by_topo[t] = list(np.asarray(ids_by_topo[t], dtype=object)[rng.permutation(N_PER_TOPO)])

          topo_index = {t: i for i, t in enumerate(TOPO)}
          slot_topology_orders = []
          for group in range(10):
              base = np.asarray([t for t in TOPO for _ in range(6)], dtype=object)
              rng.shuffle(base)
              for rot in range(4):
                  mapped = [TOPO[(topo_index[str(t)] + rot) % 4] for t in base]
                  assert Counter(mapped) == {t: 6 for t in TOPO}
                  slot_topology_orders.append(mapped)
          assert len(slot_topology_orders) == VOTERS

          # Exact position balance: each topology appears 10 times in every one of the 24 positions.
          position_counts = []
          for pos in range(BALLOTS_PER_VOTER):
              c = Counter(slot_topology_orders[s][pos] for s in range(VOTERS))
              assert c == {t: 10 for t in TOPO}, (pos, c)
              position_counts.append(dict(sorted(c.items())))

          next_idx = {t: 0 for t in TOPO}
          slots = {}
          all_assigned = []
          slot_player_repeat_max = 0
          slot_unique_player_min = 999
          for slot_idx, topo_order in enumerate(slot_topology_orders, start=1):
              order_ids = []
              for t in topo_order:
                  j = next_idx[t]
                  cid = ids_by_topo[t][j]
                  next_idx[t] += 1
                  order_ids.append(cid)
              assert len(order_ids) == BALLOTS_PER_VOTER and len(set(order_ids)) == BALLOTS_PER_VOTER

              display_left = {}
              v9_left_bool = {}
              for t in TOPO:
                  local = [cid for cid in order_ids if challenge_by_id[cid]['topology'] == t]
                  assert len(local) == 6
                  perm = rng.permutation(6)
                  v9_left_local = {local[int(i)] for i in perm[:3]}
                  for cid in local:
                      ch = challenge_by_id[cid]
                      is_v9_left = cid in v9_left_local
                      left = ch['v9_favored_side'] if is_v9_left else ch['v1_7_favored_side']
                      assert left in {'A', 'B'}
                      display_left[cid] = left
                      v9_left_bool[cid] = bool(is_v9_left)
                  assert sum(v9_left_bool[cid] for cid in local) == 3

              pc = Counter()
              for cid in order_ids:
                  ch = challenge_by_id[cid]
                  for side in ('side_A', 'side_B'):
                      for a in ch[side]['assets']:
                          pc[a['key']] += 1
              slot_player_repeat_max = max(slot_player_repeat_max, max(pc.values()))
              slot_unique_player_min = min(slot_unique_player_min, len(pc))

              slots[str(slot_idx)] = {
                  'accepted_voter_slot': slot_idx,
                  'challenge_order': order_ids,
