name: Age Curve V2 Phase 2 Candidate Evaluation

# Research-only out-of-sample evaluation of historical age-retention candidates.
# This workflow does NOT change index.html, AGE_CURVE, Production V2,
# Market Value, or any deployed player value.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  candidate-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Phase 2 self-test
        run: python3 research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.py --selftest

      - name: Build out-of-sample age-curve candidate evaluation
        run: python3 research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.py --write

      - name: Verify Phase 2 guardrails and outputs
        run: python3 research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.json
          git add research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.md
          git diff --staged --quiet || git commit -m "Add Age Curve V2 Phase 2 candidate evaluation"
          git push
