           'workflow_path':'.github/workflows/B55-v1r1.yml','workflow_sha256':sha(workflow.read_bytes()),
           'closeout_json_sha256':EXPECTED_JSON_SHA,'closeout_md_sha256':EXPECTED_MD_SHA,
           'source_blobs_checked':PINS,'occurrence_rows_read':False,'h3_o2_read':False,
           'market_read':False,'holdout_2024_read':False,'production_change_authorized':False
          }
          MAN.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          check(sha(J.read_bytes())==EXPECTED_JSON_SHA and sha(M.read_bytes())==EXPECTED_MD_SHA,'WRITE_HASH_MISMATCH')
          print('CLOSEOUT_READY_FOR_SCOPE_PROOF')
          PY
      - name: Prove exact write scope and commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          A=research/exact-rookie-slot-curve-v1/preopening_governance_closeout_v1.json
          B=research/exact-rookie-slot-curve-v1/preopening_governance_closeout_v1.md
          C=research/exact-rookie-slot-curve-v1/preopening_governance_closeout_manifest_v1.json
          if [ -n "$(git status --porcelain)" ]; then
            git add "$A" "$B" "$C"
            FOUND="$(git diff --cached --name-only | sort)"
            WANT="$(printf '%s\n' "$A" "$B" "$C" | sort)"
            test "$FOUND" = "$WANT"
            test -z "$(git ls-files --others --exclude-standard)"
            git -c core.whitespace=-trailing-space diff --cached --check
            git commit -m "research: close Exact Rookie Slot V1 before source opening"
            git push origin HEAD:main
          fi
          test -z "$(git status --porcelain)"
          echo 'B55 CLOSEOUT FREEZE: operational pass, governance STOP, no empirical source opening.'
