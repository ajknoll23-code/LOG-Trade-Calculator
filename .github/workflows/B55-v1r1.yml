           manifest=json.loads(MAN.read_text());check(manifest['decision']==json.loads(EXPECTED_JSON)['decision'],'MANIFEST_DECISION_DRIFT')
           check(manifest['closeout_json_sha256']==EXPECTED_JSON_SHA and manifest['closeout_md_sha256']==EXPECTED_MD_SHA,'MANIFEST_HASH_DRIFT')
           check(manifest['source_blobs_checked']==PINS,'MANIFEST_SOURCE_PIN_DRIFT')
           check(manifest['workflow_sha256']==sha((ROOT/'.github/workflows/B55-v1r1.yml').read_bytes()),'MANIFEST_WORKFLOW_DRIFT')
           check(manifest['occurrence_rows_read'] is False and manifest['h3_o2_read'] is False and manifest['production_change_authorized'] is False,'MANIFEST_FIREWALL_DRIFT')
