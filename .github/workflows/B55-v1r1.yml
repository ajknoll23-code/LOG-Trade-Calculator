          EXPECTED_JSON='{\n  "basis": "B52 sets provider/format maximum source share 0.60. Frozen V6/V7 eligible source was MyFantasyLeague only. No explicit pre-B52 provider/format concentration justification was found in the enumerated frozen source-protocol files and inspected V8 source workflows. V8 Phase0J exception is for 2018 Round 6 minimum source membership, not provider/format concentration.",\n  "closure_kind": "GOVERNANCE_DESIGN_CERTAIN_NOT_EMPIRICAL_PHASE0A",\n  "decision": "STOP_EXACT_SLOT_V1_RETAIN_V10_OR_PREREGISTER_SEPARATE_LOWER_RESOLUTION_STUDY",\n  "evidence": {\n    "b52_freeze_commit": "4b58551b4f4813b59ef558a27c8fa1452a0bb43c",\n    "b52_prereg_sha256": "0f2d49eeac7c59027073924a03095eca349f2737eb8229202e52d8a06953fc15",\n    "b53_contract_md_sha256": "f504abb04ef82724525005f73433e539ad476d0e141b1f589141c3d3a2867fbc",\n    "b53_contract_sha256": "61314b546bee65daae03ac4d09a6c0deb1d7b29eebbf440402d2548b199cd9bc",\n    "b53_precision_freeze_commit": "b72b5265e7f2129b28152effac512876e69a0d29",\n    "b53_simulation_code_sha256": "3a3475377a1c0f68f12bbfd4f490a08f71b1c9244616a1d1c476198e62920d4c",\n    "source_search_scope": "bounded text-only inspection of V6/V7 source files, V8 Phase0A-0J and Phase1 source workflows (including revisions), and V8.1 carryforward prereg; only the listed verified_git_blob_pins are pinned, other workflow inspections are not independently pinned; not a repo-wide waiver certification",\n    "v6_source_freeze_commit": "d0934f56016979159b9864be02e83530ce1e0ff1",\n    "v7_source_freeze_commit": "589b26a997ebabe20260494a723855d28b468490",\n    "verified_git_blob_pins": {\n      ".github/workflow-archive/completed-research/draft-pick-fv-v8-phase0j-source-availability-amendment.yml": "6afe4bee49c64b384f1de40d9b49e818397f7823",\n      ".github/workflow-archive/completed-research/draft-pick-fv-v8-phase1-1-position-retention-hardening.yml": "835c87fd33d2f7100c6a25dbaefbcb5e4a1d38c7",\n      ".github/workflow-archive/completed-research/draft-pick-fv-v8-phase1-incremental-source-identity-freeze.yml": "7685841e5a458657e9777a017b3023ce02658e0f",\n      ".github/workflows/B52-v1r1-exact-rookie-slot-curve-v1-phase0-preregistration-freeze.yml": "985ea93909d8f9921cf0735155309d713f048062",\n      ".github/workflows/B53-v1r2.yml": "9cad19b191ffba1c2659d5e6cd69e09c8c40c8d7",\n      "research/draft-pick-fv-v6/structural_continuity_preoutcome_amendment_v6_1.json": "574c7645c6afa4c8272b0ac1bd77319b6d680de0",\n      "research/draft-pick-fv-v6/structural_continuity_preregistration_v6.json": "87c25b5390f75707934deb6d28b5513e6c93cf25",\n      "research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json": "42e4fa45d3a0715be281dd3cdf90ba13d1b418ff",\n      "research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json": "80a28c10ca3fb416631ec7352a3dc6d466f5c66d",\n      "research/exact-rookie-slot-curve-v1/phase0_preregistration.json": "dd1eae5007115a35c9a19bf5669b2ba5809f45b7",\n      "research/exact-rookie-slot-curve-v1/phase0_preregistration_manifest.json": "f716cf8f8da1e61b6dc79ba7a27a7e4c83ade84c",\n      "research/exact-rookie-slot-curve-v1/phase0a_precision_contract.json": "fd5f1e92ce404b864e00d4279b49d942dcc9c822",\n      "research/exact-rookie-slot-curve-v1/phase0a_precision_contract.md": "a7d34739c171211b9942e750e1a866a1b5016b37",\n      "research/exact-rookie-slot-curve-v1/phase0a_precision_manifest.json": "dd4d9f4d6cd807f00f18c7341a184a80c3d7b839",\n      "research/exact-rookie-slot-curve-v1/phase0a_precision_simulation.py": "f4995b9b6415e8719d792140111eb08151774862"\n    }\n  },\n  "h3_o2_outcomes_read": false,\n  "holdout_2024_read": false,\n  "market_data_read": false,\n  "not_claimed": [\n    "exact-slot predictive performance",\n    "B54 Phase0A empirical gate result",\n    "the 2024 holdout result",\n    "production authorization"\n  ],\n  "permitted_next": "A separately preregistered V2 single-provider-cohort study, with explicit external-validity limits, may be reviewed before any corpus opening; no automatic inheritance of B52 scientific GO.",\n  "phase0a_occurrence_rows_read": false,\n  "preopening_source_concentration": {\n    "b52_share_cap": 0.6,\n    "format": "12-team Superflex/2QB dynasty rookie drafts",\n    "format_basis": "DECLARED_COHORT_NOT_ROW_OBSERVED",\n    "preexisting_explicit_provider_concentration_exception_cited": false,\n    "provider": "MyFantasyLeague",\n    "provider_share_by_design": 1.0\n  },\n  "production_change_authorized": false,\n  "schema_version": 1,\n  "stage": "preopening_governance_closeout",\n  "study_id": "exact-rookie-slot-curve-v1",\n  "subdecision": "SCIENTIFIC_STOP_BEFORE_OCCURRENCE_READ",\n  "superseded_unfrozen_development": [\n    "B54_source_audit_v4_review.py",\n    "B54_Source_Definitions_Decision_V3.md"\n  ],\n  "v10_unchanged": true\n}\n'
          EXPECTED_MD="# B55 — Exact Rookie Slot Curve V1 — Pre-opening Governance Closeout\n\n**Decision:** `STOP_EXACT_SLOT_V1_RETAIN_V10_OR_PREREGISTER_SEPARATE_LOWER_RESOLUTION_STUDY`\n\n**Subdecision:** `SCIENTIFIC_STOP_BEFORE_OCCURRENCE_READ`\n\n**Type:** Documented governance / design-certain STOP. **Not** an empirical B54 Phase 0A scientific result.\n\n## Basis\n\nB52's frozen `phase0_source_support_gates.concentration.provider_or_format_cluster_share_max` is **0.60**. Its only allowable exception is an *already-frozen source-weighting contract justifying the excess*. The frozen V6/V7 preregistrations define the eligible MyFantasyLeague, 12-team Superflex/2QB dynasty rookie-draft cohort, with weight balancing by year, cell, league and occurrence—not by provider or format. No explicit pre-B52 justification for exceeding the **provider/format concentration cap** was identified in the reviewed source-protocol evidence.\n\nThe V8 Phase 0J **2018 Round 6 source-availability exception** permits six eligible league groups where twelve were otherwise required. It addresses a different minimum-source gate; it is **not** a provider/format concentration waiver.\n\nFor a single-provider source, provider share is 100% by cohort design. This is **not** an observed result from opening the 24,970 source rows. Format is a *declared cohort property*, not independently measured per occurrence. No attempt was made to circumvent B52 by redefining the cluster unit or excluding the concentration gate.\n\n## Evidence discipline\n\n- B52 prereg SHA-256: `0f2d49eeac7c59027073924a03095eca349f2737eb8229202e52d8a06953fc15` (freeze commit `4b58551b4f4813b59ef558a27c8fa1452a0bb43c`).\n- B53 precision freeze commit: `b72b5265e7f2129b28152effac512876e69a0d29`.\n- Verified historical source and workflow **git blob** pins are recorded in the sibling JSON. The V6 and V7 freeze commits are checked as ancestors of the B52 freeze commit, and their pinned blobs are verified at their respective commits and at B52.\n- Search inspected V6 structural prereg and pre-outcome amendment, V7 prereg and implementation contract, V8 Phase 0–1 source workflows (with several revisions), and the V8.1 carryforward prereg. Only the individually enumerated source files and workflows in the sibling JSON are Git-blob-pinned; the other workflow inspections are not independent historical content pins. No claim of exhaustive search of *all* repository history is made.\n- No raw historical occurrence rows, H3/O2 outcomes, Package V9 votes, KTC/market evidence or 2024 holdout outcomes were opened for B54.\n\n## Decision consequences\n\n1. **Keep Draft Pick FV V10 deployed** and do not modify its values, runtime, or frozen release.\n2. **Exact Slot V1 is closed at governance stage.** Neither source qualification nor exact-slot predictive performance has been evaluated on new data. Do not portray this as a failed exact-slot model.\n3. B54 source engine V4 and definitions V3 remain **unfrozen / withdrawn**, not eligible for upload or run as V1.\n4. A successor, if pursued, must have a **new V2 preregistration** that explicitly limits results to the single-provider 12-team Superflex/2QB cohort and states the loss of external validity. No B52 threshold is retroactively modified. No numeric support, league-concentration or precision threshold may be loosened in a successor. Any other design change must be justified from non-row evidence in the V2 preregistration and reviewed before any corpus read.\n5. The 2024 holdout remains sealed until its original maturity gate, no earlier than `2027-01-12T00:00:00Z`.\n6. Source artifact `10990665019` expires `2026-10-28T18:42:26Z`; expiry does not authorize opening or copying it outside a separately reviewed custody workflow.\n\nNo production authorization results from this closure.\n"
          
          def run(*args):
           return subprocess.check_output(args,text=True,stderr=subprocess.STDOUT).strip()
          def check(cond,message):
