name: FantasyPros Offense Pipeline

# Replaces the manually-transcribed FantasyPros offensive projection
# totals with a real, automated fetch of FantasyPros' live pages, scored
# under this league's exact real formula instead of FantasyPros' own
# "Standard Scoring" total -- confirmed real, quantified gap (up to ~24%
# understatement for a workhorse RB) from the missing 0.2-per-rush-
# attempt bonus this league uniquely awards. See the script's own
# docstring for the full verification history.
#
# OUTPUT-ONLY, same pattern as every other pipeline workflow in this
# project: commits scripts/fantasypros_offense_pipeline_output.json but
# does NOT touch index.html or the live prod_mult values. Review the
# output (especially the safety-check pass/fail on player counts) before
# using it anywhere downstream.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasypros-offense-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test before trusting real output
        run: python3 scripts/fantasypros_offense_pipeline.py --selftest

      - name: Run the pipeline
        run: python3 scripts/fantasypros_offense_pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fantasypros_offense_pipeline_output.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run FantasyPros offense pipeline"
          git push
