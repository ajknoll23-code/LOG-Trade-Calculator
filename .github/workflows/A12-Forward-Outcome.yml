name: A - FA12R1 Frozen Week 9-12 Matched Forward Outcomes (Read Only)

# FA11R1 locked 2026 Week9-12 protocol. Read-only. Selected completed week ONLY.
# Before Sleeper advances beyond selected week: WAIT_NFL_WEEK_NOT_FINAL, no scores fetched.
# Post-week: score fixed FA08/FA09/FA11 pair identities with canonical LOG scorer.
# Do not infer prediction success from workflow green or unbalanced control comparisons.
on:
  workflow_dispatch:
    inputs:
      week:
        description: '2026 completed NFL week to evaluate (9-12 only). Before it is final, report WAIT.'
        required: true
        type: choice
        default: '9'
        options:
          - '9'
          - '10'
          - '11'
          - '12'

permissions:
  contents: read

concurrency:
  group: a-fa12r1-forward-research-read-only
  cancel-in-progress: false

jobs:
  postorigin:
    name: Assess immutable watched/control pairs without changing production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main (read only)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all three frozen pre-origin registries have unchanged Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git hash-object research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json)" = 'f5d005b6a37a33444be76ec28e6b6a98174af47b'
          test "$(git hash-object research/free-agent-opportunity/forward-registrations/2026-W09_FA09R1_frozen_42_matched_controls.json)" = '100b934aaa4aeaebd0a10944d88d37e0e499fdc8'
          test "$(git hash-object research/free-agent-opportunity/forward-registrations/2026-W09_FA11R1_prospective_evaluation_contract.json)" = '35647dc81da1fc9dceab0d27d6fe461dcae0dd22'
          test "$(sha256sum scripts/model/ppg_pipeline.py | cut -d' ' -f1)" = 'fc46a464986ffe5096d80e04b29c10919285e345907e78b542965e8246713cf4'
      - name: Score only a completed future week under the fixed prospective plan
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa12r1
          EVALUATION_WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          cat > "$REPORT_DIR/A_FA12R1_engine.py" <<'PYCODE'
          #!/usr/bin/env python3
          """FA12R1: first true post-registration single-week matched LOG outcome audit.
          Read-only, immutable FA08/FA09/FA11, state-gated on Sleeper advancing beyond week.
          No predictions, valuation or board changes, no re-matching or outcome-tuned tiers.
          """
          import argparse, ast, csv, hashlib, json, os, statistics, sys, time
          from pathlib import Path
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          OUT=Path(os.environ.get('REPORT_DIR','/tmp/a-fa12r1'))
          ROOT='research/free-agent-opportunity/forward-registrations/'
          WATCH=ROOT+'2026-W09_FA08R1_frozen_42_shadow_watch.json'
          CONTROL=ROOT+'2026-W09_FA09R1_frozen_42_matched_controls.json'
          CONTRACT=ROOT+'2026-W09_FA11R1_prospective_evaluation_contract.json'
          PINNED={'FA08':'f5d005b6a37a33444be76ec28e6b6a98174af47b','FA09':'100b934aaa4aeaebd0a10944d88d37e0e499fdc8','FA11':'35647dc81da1fc9dceab0d27d6fe461dcae0dd22'}
          SCORER='scripts/model/ppg_pipeline.py'
          EXPECTED_SCORER_SHA='fc46a464986ffe5096d80e04b29c10919285e345907e78b542965e8246713cf4'
          SCORING_FIELDS={'pass_yd','pass_td','pass_2pt','pass_int','rush_yd','rush_att','rush_td','rush_2pt','rec_yd','rec','rec_td','rec_2pt','fum_lost','fum_rec_td','idp_tkl_solo','idp_tkl_ast','idp_tkl_loss','idp_sack','sack','idp_qb_hit','idp_int','int','idp_fum_rec','idp_ff','idp_safety','blk_kick','idp_td','idp_pass_def','st_td','st_ff','st_fum_rec'}
          TIERS=('PRIMARY_LE_10_SNAPS','SECONDARY_LE_20_SNAPS','WEAK_GT_20_SNAPS')

          def digest(data):return hashlib.sha256(data).hexdigest()
          def numeric(val):
              if isinstance(val,bool) or not isinstance(val,(float,int)) or not (-1e10<float(val)<1e10): return None
              return float(val)
          def load_scoring_function():
              data=Path(SCORER).read_bytes(); d=digest(data)
              if d!=EXPECTED_SCORER_SHA:raise RuntimeError('CANONICAL_LOG_SCORER_SHA_DRIFT: protected scorer changed; do not score silently')
              tree=ast.parse(data,filename=SCORER)
              fns=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='score_week']
              if len(fns)!=1:raise RuntimeError('score_week missing/duplicate')
              fns[0].decorator_list=[]; ns={};exec(compile(ast.fix_missing_locations(ast.Module(body=fns,type_ignores=[])),SCORER,'exec'),ns)
              fn=ns['score_week']
              checks=[({},0),({'pass_yd':300,'pass_td':2},22),({'rush_att':10,'rush_yd':100},14),({'idp_tkl_solo':4,'idp_tkl_ast':2},7.5),({'idp_sack':2,'idp_qb_hit':1},10)]
              for v,expected in checks:
                  if abs(float(fn(v))-expected)>0.00001:raise RuntimeError('LOG scoring fixture changed')
              return fn,d

          def verify(w,c,p):
              if w.get('classification')!='FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION':raise ValueError('FA08 classification drift')
              if c.get('classification')!='PROSPECTIVE_RESEARCH_CONTROLS_NOT_PREDICTIVE_ACCURACY':raise ValueError('FA09 classification drift')
              if p.get('classification')!='RESEARCH_ONLY_PRE_OUTCOME_ANALYSIS_PLAN_NOT_MODEL_VALIDATION':raise ValueError('FA11 classification drift')
              if p.get('evaluation_weeks')!=[9,10,11,12] or p.get('primary_group')!='PRIMARY_LE_10_SNAPS' or p.get('primary_group_size')!=30:raise ValueError('Evaluation contract changed')
              if any(x.get('pricing_changes_authorized') is not False for x in (w,c,p)):raise ValueError('Unexpected pricing authorization')
              if p.get('future_week9_plus_data_retrieved') is not False or p.get('cohorts_not_reselected') is not True:raise ValueError('Protocol future outcome use drift')
              a=w.get('players',[]); b=c.get('pairs',[]); e=p.get('pairs',[])
              if len(a)!=42 or len(b)!=42 or len(e)!=42:raise ValueError('Pair count wrong')
              wa={str(x['player_id']):x for x in a}; ids=set()
              if len(wa)!=42:raise ValueError('Duplicate watch ID')
              controls=set();cmpairs={}
              for r in b:
                  wid,cid=str(r['watch_id']),str(r['control_id']);controls.add(cid);ids.update((wid,cid));cmpairs[wid]=r
                  if wid not in wa or wa[wid]['name']!=r['watch_name'] or r['position']!=wa[wid]['position']:raise ValueError('FA08/FA09 identity changed')
              if len(controls)!=42 or len(ids)!=84 or len(cmpairs)!=42:raise ValueError('Duplicate/overlap IDs')
              pkeys=set();groups=Counter()
              for x in e:
                  wid,cid=str(x['watch_id']),str(x['control_id']);pkeys.add(wid)
                  r=cmpairs.get(wid)
                  if not r or str(r['control_id'])!=cid or r['comparability_tier']!=x['comparability_tier'] or x['comparability_tier'] not in TIERS:raise ValueError('Frozen pair membership or strata changed')
                  if r['position']!=x['position'] or wa[wid]['name']!=x['watch_name'] or r['control_name']!=x['control_name']:raise ValueError('Frozen identity mismatch')
                  groups[x['comparability_tier']]+=1
              if pkeys!=set(wa) or groups!=Counter({'PRIMARY_LE_10_SNAPS':30,'SECONDARY_LE_20_SNAPS':3,'WEAK_GT_20_SNAPS':9}):raise ValueError('Incorrect immutable group labels')
              for k,path in [('FA08',WATCH),('FA09',CONTROL),('FA11',CONTRACT)]:
                  if not Path(path).is_file():raise ValueError(f'Missing frozen {k}')
              return e

          def fetch_json(url):
              last=None
              for n in range(3):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'LOG-FA12R1-Research/1.0','Accept':'application/json'}),timeout=45) as f:blob=f.read(22_000_000)
                      return json.loads(blob), {'url':url,'sha256':digest(blob),'downloaded_utc':datetime.now(timezone.utc).isoformat(),'bytes':len(blob)}
                  except Exception as exc:last=exc;time.sleep(n+1)
              raise RuntimeError(f'Source fetch failed at {url}: {last}')

          def readiness(state,week):
              season=str(state.get('season') or ''); phase=str(state.get('season_type') or '').lower(); current=state.get('week')
              if season!='2026':return False,'SLEEPER_STATE_SEASON_NOT_2026'
              if not isinstance(current,int):return False,'SLEEPER_STATE_WEEK_UNRECOGNIZED'
              if phase=='regular':return (current>week),'STATE_NOT_ADVANCED_PAST_REQUESTED_WEEK' if current<=week else 'WEEK_FINISHED_STATE_ADVANCED'
              if phase in ('post','postseason') and week<=12:return True,'REGULAR_SEASON_OVER'
              return False,'SLEEPER_SEASON_PHASE_NOT_READY'

          def score(row,scorer):
              if not isinstance(row,dict):return None,'NO_STATS_ROW'
              gp=numeric(row.get('gp'))
              if gp is None:return None,'GP_UNREPORTED'
              if gp<1:return None,'CONFIRMED_NO_PARTICIPATION' # never impute 0 for a DNP
              for k in SCORING_FIELDS:
                  if k in row and row[k] is not None and numeric(row[k]) is None:return None,'NONNUMERIC_SCORE_FIELD'
              try:
                  val=float(scorer(row))
                  if not (-1e8<val<1e8):raise ValueError('score out of range')
              except (ValueError,TypeError,KeyError,ZeroDivisionError):return None,'SCORE_ERROR'
              return round(val,3),'CONFIRMED_GP_SCORED'

          def analyze(pairs,stats,scorer,week,manifest,state_info,state_meta):
              rows=[]
              for p in pairs:
                  wid,cid=str(p['watch_id']),str(p['control_id'])
                  w,sw=score(stats.get(wid),scorer);c,sc=score(stats.get(cid),scorer)
                  good=w is not None and c is not None
                  baseline=p['preorigin_watch_minus_control_ppg']
                  if baseline is not None and not isinstance(baseline,(int,float)):raise ValueError('Baseline difference not numeric')
                  delta=round(w-c,3) if good else None
                  rows.append({'evaluation_week':week,'match_tier':p['comparability_tier'],'preorigin_balance_diagnostic':p['preorigin_balance_diagnostic'],
                     'watch_lane':p['watch_lane'],'position':p['position'],'watch_id':wid,'watch_name':p['watch_name'],'control_id':cid,'control_name':p['control_name'],
                     'watch_status':sw,'control_status':sc,'both_confirmed_gp':good,'watch_LOG_pts':w,'control_LOG_pts':c,
                     'paired_watch_minus_control_pts':delta,'baseline_paired_mean_diff':baseline,
                     'paired_baseline_adjusted_sensitivity':round(delta-baseline,3) if good and baseline is not None else None})
              assert len(rows)==42
              tiers={}
              for name in TIERS:
                  subset=[x for x in rows if x['match_tier']==name];scored=[x for x in subset if x['both_confirmed_gp']];vals=[x['paired_watch_minus_control_pts'] for x in scored]
                  tiers[name]={'pairs_total':len(subset),'eligible_pair_weeks':len(scored),'excluded_pair_weeks':len(subset)-len(scored),
                     'mean_paired_LOG_points_per_common_played_week':round(statistics.mean(vals),3) if vals else None,
                     'median_paired_LOG_point_diff':round(statistics.median(vals),3) if vals else None,
                     'positive_pairs':sum(v>0 for v in vals),'negative_pairs':sum(v<0 for v in vals),'tied_pairs':sum(v==0 for v in vals),
                     'mean_baseline_adjusted_sensitivity':round(statistics.mean(x['paired_baseline_adjusted_sensitivity'] for x in scored if x['paired_baseline_adjusted_sensitivity'] is not None),3) if any(x['paired_baseline_adjusted_sensitivity'] is not None for x in scored) else None}
              statuses=Counter(x['watch_status'] for x in rows);controls=Counter(x['control_status'] for x in rows)
              out={'status':'WEEK_OUTCOME_DESCRIPTIVE_NOT_VALIDATED' if tiers[TIERS[0]]['eligible_pair_weeks'] else 'NO_PRIMARY_ELIGIBLE_PAIRS_NO_ADVANTAGE_ESTIMATE',
                  'classification':'FROZEN_FORWARD_RESEARCH_OUTCOME_NOT_CAUSAL_OR_PRICING_VALIDATION',
                  'week':week,'season':2026,'created_at_utc':datetime.now(timezone.utc).isoformat(),
                  'primary_metric':'equal-weight mean among eligible pairs of watch minus control LOG points, BOTH with confirmed GP',
                  'primary_original_total_pairs':30,'source_nfl_state':state_info,'source_nfl_state_manifest':state_meta,
                  'weekly_stats_source_manifest':manifest,'future_week_used_only_as_outcome':True,'tiers':tiers,
                  'watch_status_counts':dict(statuses),'control_status_counts':dict(controls),
                  'source_FA11_blob':PINNED['FA11'],'source_FA08_blob':PINNED['FA08'],'source_FA09_blob':PINNED['FA09'],
                  'week9_kickoff_pre_registration_certified':False,
                  'pricing_changes_authorized':False,'live_board_changes_authorized':False,'predictive_calibration_established':False,
                  'limitations':['No re-selection, re-matching or post-hoc criteria changes','Only one completed week; Week9-12 primary study is NOT complete',
                                 'No confirmation of roster acquisition utility or comparative waiver cost','Only both-confirmed-games pair-weeks enter numeric headline; DNP remains missing, not zero',
                                 'This may introduce a healthy-survivor selection effect; confirmed DNP reports are preserved',
                                 'Source may be revised retroactively; raw SHA256, scorer and retrieval time retained',
                                 'Original registration carries week9_first_kickoff_before_registration_certified=false; do not overclaim registration timestamp verification']}
              return rows,out

          def write(rows,report):
              OUT.mkdir(parents=True,exist_ok=True)
              (OUT/'A_FA12R1_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              if rows:
                  with (OUT/'A_FA12R1_pair_week_outcomes.csv').open('w',newline='') as f:
                      writer=csv.DictWriter(f,fieldnames=list(rows[0]));writer.writeheader();writer.writerows(rows)
              lines=[f'# A FA12R1 — Week {report["week"]} forward shadow LOG outcome audit','',
                f'**Status:** {report["status"]}. Research-only, no production effects.','',
                'Never confuse a successful workflow with evidence of positive predictive performance.','']
              if 'tiers' in report:
                  lines.extend(['| Original match tier | Total | Both played | Mean LOG point difference | Baseline-adjusted sensitivity |','|---|---:|---:|---:|---:|'])
                  for k,v in report['tiers'].items():lines.append(f'| {k} | {v["pairs_total"]} | {v["eligible_pair_weeks"]} | {v["mean_paired_LOG_points_per_common_played_week"]} | {v["mean_baseline_adjusted_sensitivity"]} |')
                  lines.extend(['','## Source SHA256','',f'`{report["weekly_stats_source_manifest"]["sha256"]}`'])
                  lines.extend(['','## Missingness','',f'- Watched: {report["watch_status_counts"]}',f'- Controls: {report["control_status_counts"]}'])
              else:lines.extend(['**No stats endpoint queried.** Sleeper has not advanced past this week. This is a successful readiness check, not a scored result.'])
              lines.extend(['','## Limits','']+['- '+str(v) for v in report['limitations']]+[''])
              (OUT/'A_FA12R1_report.md').write_text('\n'.join(lines))

          def selftest():
              assert readiness({'season':'2026','season_type':'regular','week':9},9)==(False,'STATE_NOT_ADVANCED_PAST_REQUESTED_WEEK')
              assert readiness({'season':'2026','season_type':'regular','week':10},9)[0]
              assert score(None,lambda r:3)==(None,'NO_STATS_ROW')
              assert score({'gp':0},lambda r:3)==(None,'CONFIRMED_NO_PARTICIPATION')
              assert score({'gp':1},lambda r:3)==(3.,'CONFIRMED_GP_SCORED')
              assert score({'gp':1,'idp_sack':'x'},lambda r:3)==(None,'NONNUMERIC_SCORE_FIELD')
              pairs=[];stats={}
              for i in range(42):
                  pairs.append({'watch_id':str(i),'control_id':str(i+42),'watch_name':'W','control_name':'C','position':'LB',
                   'comparability_tier':TIERS[0] if i<30 else TIERS[1] if i<33 else TIERS[2],
                   'preorigin_balance_diagnostic':'SNAP_AND_PTS_APPROX_BALANCED','watch_lane':'DYNASTY_STASH','preorigin_watch_minus_control_ppg':2})
                  stats[str(i)]={'gp':1,'rec':1};stats[str(i+42)]={'gp':1,'rec':0}
              rows,report=analyze(pairs,stats,lambda r:r['rec'],9,{'sha256':'demo'}, {}, {})
              assert report['tiers'][TIERS[0]]['mean_paired_LOG_points_per_common_played_week']==1
              assert report['tiers'][TIERS[0]]['mean_baseline_adjusted_sensitivity']==-1
              stats['0']={'gp':0};stats['42']={'gp':1,'rec':4}
              _,r=analyze(pairs,stats,lambda r:r.get('rec',0),9,{'sha256':'demo'}, {}, {})
              assert r['tiers'][TIERS[0]]['eligible_pair_weeks']==29
              for i in range(30):stats[str(i)]={'gp':0}
              _,r=analyze(pairs,stats,lambda r:r.get('rec',0),9,{'sha256':'demo'}, {}, {})
              assert r['tiers'][TIERS[0]]['mean_paired_LOG_points_per_common_played_week'] is None
              print('PASS FA12R1 source-state gate, DNP not zero, 42 fixed pairs, primary metric, source digest cases')

          def main():
              ap=argparse.ArgumentParser();ap.add_argument('--selftest',action='store_true');a=ap.parse_args()
              if a.selftest:return selftest()
              week=int(os.environ.get('EVALUATION_WEEK','9'))
              if week not in (9,10,11,12):raise ValueError('Only preregistered weeks 9-12')
              w=json.loads(Path(WATCH).read_text());c=json.loads(Path(CONTROL).read_text());p=json.loads(Path(CONTRACT).read_text());pairs=verify(w,c,p)
              scorer,sha=load_scoring_function()
              state,meta=fetch_json('https://api.sleeper.app/v1/state/nfl')
              ready,reason=readiness(state,week)
              state_info={'season':state.get('season'),'season_type':state.get('season_type'),'current_week':state.get('week'),
                   'reason':reason,'scorer_sha256':sha}
              if not ready:
                  report={'status':'WAIT_NFL_WEEK_NOT_FINAL','classification':'RESEARCH_READINESS_ONLY_NO_OUTCOME',
                   'week':week,'season':2026,'created_at_utc':datetime.now(timezone.utc).isoformat(),
                   'source_nfl_state':state_info,'source_nfl_state_manifest':meta,'pricing_changes_authorized':False,'live_board_changes_authorized':False,
                   'limitations':['No Week 9+ stats were queried because the week readiness guard did not pass.','Re-run only once Sleeper advances past the selected completed week.']}
                  write([],report);print(f'FA12R1_WAIT: week {week} is not final according to Sleeper state. No outcome accessed');return
              raw,manifest=fetch_json(f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}')
              if not isinstance(raw,dict) or len(raw)<200:raise RuntimeError('Unexpected or empty weekly Sleeper data; do not silently score')
              rows,report=analyze(pairs,raw,scorer,week,manifest,state_info,meta)
              report['canonical_LOG_scorer_sha256']=sha
              write(rows,report)
              print('FA12R1_FORWARD_OUTCOME_AUDIT',json.dumps({'week':week,'status':report['status'],'primary':report['tiers'][TIERS[0]]},sort_keys=True))

          if __name__=='__main__':main()
          PYCODE
          python3 -m py_compile "$REPORT_DIR/A_FA12R1_engine.py"
          python3 "$REPORT_DIR/A_FA12R1_engine.py" --selftest
          python3 "$REPORT_DIR/A_FA12R1_engine.py"
          test -z "$(git status --porcelain)"
      - name: Upload read-only per-pair reports (even if a data source is unavailable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA12R1_2026_W09_W12_FIXED_PAIR_FUTURE_OUTCOMES
          path: |
            ${{ runner.temp }}/a-fa12r1/A_FA12R1_report.json
            ${{ runner.temp }}/a-fa12r1/A_FA12R1_report.md
            ${{ runner.temp }}/a-fa12r1/A_FA12R1_pair_week_outcomes.csv
          if-no-files-found: warn
          retention-days: 90
