name: Set Package V3 Daily Limit 20

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch V3 daily vote limit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Browser/UI cap.
          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          old = "const PACKAGE_VOTE_DAILY_LIMIT = 10;"
          new = "const PACKAGE_VOTE_DAILY_LIMIT = 20;"
          count = text.count(old)
          if count != 1:
              raise RuntimeError(
                  f"Expected exactly one V3 UI daily-limit declaration, found {count}"
              )
          text = text.replace(old, new, 1)
          index.write_text(text, encoding="utf-8")

          # Aggregation-side enforcement.
          pipeline = Path("scripts/market/package_vote_v3_pipeline.py")
          text = pipeline.read_text(encoding="utf-8")
          old = "MAX_VOTES_PER_VOTER_PER_DAY = 10"
          new = "MAX_VOTES_PER_VOTER_PER_DAY = 20"
          count = text.count(old)
          if count != 1:
              raise RuntimeError(
                  f"Expected exactly one V3 aggregation daily-limit declaration, found {count}"
              )
          text = text.replace(old, new, 1)

          # Update V3 self-test so it still verifies the configured cap.
          old = "for i in range(15)]"
          new = "for i in range(25)]"
          if text.count(old) == 1:
              text = text.replace(old, new, 1)

          old = "assert len(capped) == 10 and dropped == 5"
          new = "assert len(capped) == 20 and dropped == 5"
          if text.count(old) == 1:
              text = text.replace(old, new, 1)

          pipeline.write_text(text, encoding="utf-8")

          print("V3 browser daily limit: 20")
          print("V3 aggregation daily cap: 20")
          print("V3 lifetime effective cap remains 30")
          PY

      - name: Verify V3 limit and isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in index
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 10;" not in index

          pipeline = Path("scripts/market/package_vote_v3_pipeline.py").read_text(encoding="utf-8")
          assert "MAX_VOTES_PER_VOTER_PER_DAY = 20" in pipeline
          assert "VOTER_EFFECTIVE_LIFETIME_CAP = 30.0" in pipeline
          assert 'PREFIX = "__pkgv3__|"' in pipeline

          # Historical pipelines must not be edited by this patch.
          v2 = Path("scripts/market/package_vote_v2_pipeline.py").read_text(encoding="utf-8")
          assert "MAX_VOTES_PER_VOTER_PER_DAY = 10" in v2

          ktc = Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          assert '"__pkgv3__|"' in ktc

          print("V3 20-vote daily limit contract verified.")
          PY

      - name: Run V3 self-test
        run: python3 scripts/market/package_vote_v3_pipeline.py --selftest

      - name: Commit daily-limit change
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add scripts/market/package_vote_v3_pipeline.py

          if git diff --cached --quiet; then
            echo "No V3 daily-limit changes."
            exit 0
          fi

          git commit -m "Raise Package V3 daily vote limit to 20"
          git pull --rebase origin main
          git push origin main
