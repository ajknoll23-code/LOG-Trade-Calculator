              "weighting": "Within each year/cell, begin from the frozen V10 occurrence weights. Aggregate occurrence mass by stable rookie identity before calculating Kish n_eff. For slot n_eff, aggregate only occurrences at that slot; for cell n_eff, aggregate all occurrences in the cell.",
              "year_keys_exact": [
