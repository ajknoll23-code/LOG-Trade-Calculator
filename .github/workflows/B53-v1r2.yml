name: B53 Precision Freeze R2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  freeze-precision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen B52 and V10 uncertainty lineage
        shell: bash
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"

          test "$(git rev-parse HEAD:research/exact-rookie-slot-curve-v1/phase0_preregistration.json)" =             "dd1eae5007115a35c9a19bf5669b2ba5809f45b7"
          test "$(git rev-parse HEAD:research/exact-rookie-slot-curve-v1/phase0_preregistration_manifest.json)" =             "f716cf8f8da1e61b6dc79ba7a27a7e4c83ade84c"
          test "$(git rev-parse HEAD:.github/workflows/B52-v1r1-exact-rookie-slot-curve-v1-phase0-preregistration-freeze.yml)" =             "985ea93909d8f9921cf0735155309d713f048062"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v10/v10_phase0_expected_value_construct_audit.json)" =             "5adbdfe3209aa47a024faa81892361855c5164d5"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          b52 = Path("research/exact-rookie-slot-curve-v1/phase0_preregistration.json")
          assert hashlib.sha256(b52.read_bytes()).hexdigest() ==               "0f2d49eeac7c59027073924a03095eca349f2737eb8229202e52d8a06953fc15"

          p = json.loads(b52.read_text())
          assert p["status"] == "FROZEN_BEFORE_EXACT_SLOT_SOURCE_DIAGNOSTICS"
          assert p["phase0_source_support_gates"]["whole_curve"]["precision_simulation_required"] is True
          assert p["phase0_source_support_gates"]["whole_curve"]["precision_simulation_policy"] == (
              "The Phase 0A precision-simulation code and pass criterion must exist in a separate reviewed commit "
              "before any occurrence corpus is materialized or read. Record that code hash in the Phase 0A manifest. "
              "The simulation may tighten/STOP but may not loosen any B52 support threshold."
          )

          v10 = json.loads(
              Path(
                  "research/draft-pick-fv-v10/"
                  "v10_phase0_expected_value_construct_audit.json"
              ).read_text()
          )
          expected = {"r1_early": 0.12547775272652636, "r1_late": 0.11536344904846066, "r1_mid": 0.08964958673986265, "r2_early": 0.15672885555662544, "r2_late": 0.0881602265444507, "r2_mid": 0.12089238389604343, "r3_early": 0.07571374015349391, "r3_late": 0.05045519673520441, "r3_mid": 0.042028607517138036, "r4_early": 0.10839902626833031, "r4_late": 0.14125121692338954, "r4_mid": 0.1558464226904636}
          actual = {
              k: float(v10["core_uncertainty"][k]["relative_95_halfwidth"])
              for k in expected
          }
          for k, value in expected.items():
              assert abs(actual[k] - value) <= 1e-15, (k, actual[k], value)

          print("PASS: B52 and frozen V10 aggregate uncertainty lineage verified.")
          PY

          sha256sum             index.html             free-agent-board.html             model/releases/draft-pick-fv-v10/release.json             research/exact-rookie-slot-curve-v1/phase0_preregistration.json             > "${RUNNER_TEMP}/protected.sha256"

      - name: Preflight repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Resolve precision-contract namespace
        shell: bash
        run: |
          set -euo pipefail

          ROOT="research/exact-rookie-slot-curve-v1"
          A="$ROOT/phase0a_precision_contract.json"
          B="$ROOT/phase0a_precision_simulation.py"
          C="$ROOT/phase0a_precision_contract.md"
          D="$ROOT/phase0a_precision_manifest.json"

          count=0
          for p in "$A" "$B" "$C" "$D"; do
            if test -e "$p"; then count=$((count+1)); fi
          done

          if test "$count" -ne 0 && test "$count" -ne 4; then
            echo "PARTIAL_PHASE0A_PRECISION_NAMESPACE"
            exit 2
          fi

          if test "$count" -eq 4; then
            echo "ALREADY_FROZEN=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_FROZEN=false" >> "$GITHUB_ENV"
          fi

      - name: Write frozen precision contract and code
        if: env.ALREADY_FROZEN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ROOT="research/exact-rookie-slot-curve-v1"

          cat > "$ROOT/phase0a_precision_contract.json" <<'JSON'
