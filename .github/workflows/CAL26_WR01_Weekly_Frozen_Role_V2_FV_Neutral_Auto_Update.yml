          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Independently check 565-FV parity, candidate CSV, snapshot and receipt
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CHECK'
          import csv,hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'cal26-weekly-review'
          receipt=json.loads((out/'release_receipt.json').read_text())
          state=json.loads((out/'latest_observation.json').read_text())
          with (out/'CAL26_Weekly_All_565_Role_Decisions.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          with (out/'CAL26_Weekly_Auto_Upgrades.csv').open(newline='') as f:
              upgrades=list(csv.DictReader(f))
          assert receipt['status']=='PASS_CAL26_WEEKLY_ROLE_RELEASE_CANDIDATE'
          assert receipt['model_retrained'] is False
          assert receipt['player_count']==565 and len(rows)==565 and len(state['players'])==565
          assert len(upgrades)==receipt['candidate_role_updates']
          assert len({r['player'] for r in rows})==565
          assert all(int(r['old_fv'])==int(r['new_fv']) for r in rows)
          assert receipt['live_fv_change_count']==0 and receipt['auto_downward_revisions']==0
          assert receipt['auto_large_upgrades']==0 and receipt['production_price_write'] is False
          assert receipt['completed_week']==state['completed_week']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(out/'index.html')==receipt['after_index_sha256']
          assert sha(out/'free-agent-board.html')==receipt['after_board_sha256']
          print('PASS independent weekly source and all 565 live FV parity checks')
          PY_CHECK
          cat "$RUNNER_TEMP/cal26-weekly-review/CAL26_Weekly_Review.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Automatically deploy only weekly FV-neutral stable +1/+2 upgrades and checkpoint previous week
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.mode == 'AUTO_SAFE_FV_NEUTRAL'
        shell: bash
        run: |
          set -euo pipefail
