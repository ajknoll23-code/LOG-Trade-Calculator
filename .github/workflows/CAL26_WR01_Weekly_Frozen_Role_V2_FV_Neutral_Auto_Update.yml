          python - <<'PY_STAGE'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'cal26-weekly-review'
          receipt=json.loads((out/'release_receipt.json').read_text())
          week=receipt['completed_week']
          assert receipt['release_mode']=='AUTO_SAFE_FV_NEUTRAL'
          assert receipt['player_count']==565 and receipt['live_fv_change_count']==0
          assert receipt['auto_downward_revisions']==receipt['auto_large_upgrades']==0
          assert receipt['production_price_write'] is False
          rel=Path(f'model/role-weekly-v1/receipts/2026-week-{week:02d}.json')
          assert not rel.exists(),f'Week {week} was already committed'
          state=Path('model/role-weekly-v1/latest_observation.json')
          snapshot=Path(f'model/role-weekly-v1/snapshots/2026-week-{week:02d}.json')
          assert not snapshot.exists(), 'Week snapshot already exists'
          for src,dest in [('release_receipt.json',rel),('latest_observation.json',state),('latest_observation.json',snapshot)]:
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(out/src,dest)
          changes=receipt['candidate_role_updates']
          if changes:
              for p in ('index.html','free-agent-board.html'):
                  shutil.copyfile(out/p,Path(p))
          expected={rel.as_posix(),state.as_posix(),snapshot.as_posix()}
          if changes: expected|={'index.html','free-agent-board.html'}
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,('EXPECTED_CHANGED_PATHS_MISMATCH',actual,expected)
          print(f'PASS staging Week {week}: {changes} FV-neutral role upgrades; 565 exact FV prices')
