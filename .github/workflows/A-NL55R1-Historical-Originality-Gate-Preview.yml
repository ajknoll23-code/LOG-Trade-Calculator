name: A-NL55R1 - Historical Originality Gate Preview (Read-Only)
run-name: A-NL55R1 - Test release blocks against verified NL54R2 history
'on':
  workflow_dispatch:
    inputs:
      nl54r2_run_id:
        description: Successful NL54R2 source audit run ID. Defaults to verified November 10 audit.
        required: true
        type: string
        default: '42862307444'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl55r1-preview
  cancel-in-progress: false
jobs:
  preview:
    name: Validate historical evidence and simulate blocked/allowed release decisions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the exact NL54R2 source run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ inputs.nl54r2_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK_SOURCE'
          import json, os, re, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          rid=os.environ['AUDIT_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]{5,19}',rid):
              raise SystemExit('Invalid NL54R2 run ID (positive decimal required)')
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28',
                   'User-Agent':'LOG-NL55R1-Originality-Gate-Preview'}
          base='https://api.github.com/repos/'+repo
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as f:return json.load(f)
          run=get('/actions/runs/'+rid)
          if (run.get('path')!='.github/workflows/A-NL54R2-Historical-Originality-Archive-Repair.yml'
              or run.get('head_branch')!='main'
              or run.get('status')!='completed'
              or run.get('conclusion')!='success'
              or run.get('event')!='workflow_dispatch'):
              raise SystemExit('Requested run is not a successful approved NL54R2 inventory on main')
          expected='LOG-NL54R2-Historical-Originality-PREVIEW-'+rid
          artifacts=get('/actions/runs/'+rid+'/artifacts?per_page=100').get('artifacts',[])
          valid=[x for x in artifacts if x.get('name')==expected and not x.get('expired')]
          if len(valid)!=1:raise SystemExit('Source NL54R2 report artifact unavailable or ambiguous')
          print('PASS: authenticated approved NL54R2 source run',rid, 'artifact ID',valid[0]['id'])
          PY_CHECK_SOURCE
      - name: Download the trusted NL54R2 historical audit report
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL54R2-Historical-Originality-PREVIEW-${{ inputs.nl54r2_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.nl54r2_run_id }}
          github-token: ${{ github.token }}
          path: nl54_source/
      - name: Restore checksum-pinned NL55R1 gate engine
