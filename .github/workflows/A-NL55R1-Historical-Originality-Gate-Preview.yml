      - name: Run negative control and evidence-integrity regression suite
        shell: bash
        run: python3 "$RUNNER_TEMP/nl55r1.py" --self-test
      - name: Simulate release gates against approved archive evidence (no publication)
        shell: bash
        env:
          AUDIT_RUN_ID: ${{ inputs.nl54r2_run_id }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/nl55r1.py" \
            --audit-report nl54_source/NL54R2-PREVIEW.json \
            --repo "$GITHUB_REPOSITORY" \
            --audit-run-id "$AUDIT_RUN_ID" \
            --output nl55r1_output
          test -s nl55r1_output/NL55R1-GATE-PREVIEW.json
          test -s nl55r1_output/NL55R1-GATE-PREVIEW.md
      - name: Upload audit gate preview (not a published newsletter)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL55R1-Originality-Gate-PREVIEW-${{ github.run_id }}
          path: nl55r1_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Show exact gate decisions and coverage
        if: always()
        shell: bash
        run: |
          if test -s nl55r1_output/NL55R1-GATE-PREVIEW.md; then
            cat nl55r1_output/NL55R1-GATE-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Gate preview failed; NO release authorization exists.' >> "$GITHUB_STEP_SUMMARY"
          fi
