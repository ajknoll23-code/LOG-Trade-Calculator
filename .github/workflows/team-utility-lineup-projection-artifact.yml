name: Team Utility Lineup Projection Artifact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Self-test canonical IDP projection
        run: python3 scripts/model/idp_v1_projection.py

      - name: Self-test Team Utility projection builder
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --selftest

      - name: Build refreshed Team Utility lineup projections
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --write

      - name: Show validation report
        run: cat scripts/artifacts/reports/team_utility_lineup_projection_report.md

      - name: Verify deterministic artifact
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Commit projection artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/artifacts/generated/team_utility_lineup_projections.json \
            scripts/artifacts/reports/team_utility_lineup_projection_report.md

          if git diff --cached --quiet; then
            echo "No Team Utility projection-artifact changes to commit."
            exit 0
          fi

          git commit -m "Build Team Utility lineup projections"
          git push
