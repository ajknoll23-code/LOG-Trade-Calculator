      - name: Validate audit result contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/idp-dl-lb-structural-audit-v1")
          r=json.loads((D/"audit_result.json").read_text())
          assert r["status"]=="AUDIT_COMPLETE"
          assert r["production_change_authorized"] is False
          assert r["production_changed"] is False
          assert r["candidate_fit_performed"] is False
          assert r["player_specific_override_authorized"] is False
          assert r["scope"]["dl_player_count"]>=50
          assert r["scope"]["lb_player_count"]>=50
          assert r["scope"]["migrated_dl_count"]>=15
          assert r["lineage_transport_audit"]["identity_verified_for_all_candidates"] is True
          assert len(r["lineage_transport_audit"]["all_migrated_rows"])==r["scope"]["migrated_candidate_count"]
          assert r["brian_burns"]["current_live_fv"]>0
          assert r["prospective_context"]["production_v2"]["deployment_authorized"] is False
          assert r["prospective_context"]["replacement_level_v2"]["deployment_authorized"] is False
          assert r["prospective_context"]["position_weight_v2"]["deployment_authorized"] is False
          print("PASS: audit result contract validated.")
          PY

      - name: Freeze audit manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          D=Path("research/idp-dl-lb-structural-audit-v1")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          result=json.loads((D/"audit_result.json").read_text())
          files=["audit_contract.json","audit_result.json","audit_report.md"]
          m={
              "schema_version":1,
              "study_id":"idp-dl-lb-structural-integrity-audit-v1",
              "decision":result["decision"],
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "files":{f:sha(D/f) for f in files},
              "production_change_authorized":False,
              "production_changed":False
          }
          (D/"manifest.json").write_text(
              json.dumps(m,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: audit manifest frozen.")
          PY

      - name: Prove research-only commit scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/idp-dl-lb-structural-audit-v1/audit_contract.json",
              "research/idp-dl-lb-structural-audit-v1/audit_result.json",
              "research/idp-dl-lb-structural-audit-v1/audit_report.md",
              "research/idp-dl-lb-structural-audit-v1/manifest.json",
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          for forbidden in (
              "index.html","free-agent-board.html","trade-desk-preview.html"
          ):
              assert forbidden not in touched
          print("PASS: audit is research-only; production untouched.")
          PY

      - name: Commit DL-LB audit artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during audit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/idp-dl-lb-structural-audit-v1/
          git diff --cached --quiet && {
            echo "ERROR: no audit artifacts staged."
            exit 1
          }
          git commit -m "Complete IDP DL-LB structural integrity audit V1"
          git push origin HEAD:main

          test "$(git status --porcelain)" = ""
          echo "PASS: audit artifacts committed; production unchanged."
