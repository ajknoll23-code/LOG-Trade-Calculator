name: Package Adjustment NextGen V2 Restart Prospective Voting — 30 Daily

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-restart-prospective-voting-30-daily
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard exact repaired prospective state
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain=v1)"

          git merge-base --is-ancestor c844dba575f779feb7b48f30f597dd31572c632c HEAD

          test "$(git hash-object index.html)" = \
            "d2406e1f77c8a80d6ea31e4a868b55f72839f2a5"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = \
            "3d44e567270e597b5543e739feb716b5111d1eec"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = \
            "fa3c366b0a6fc9db1fef448184c4ff6072a634dd"

          test -e "$D/prospective_voting_activation_manifest_v1.json"
          test -e "$D/prospective_voting_activation_ui_repair_v1.json"
          test ! -e "$D/prospective_voting_restart_30_daily_v1.json"
          test ! -e "$D/prospective_voting_restart_30_daily_v1.md"

          grep -Fq "const PACKAGE_VOTE_DAILY_LIMIT = 20;" index.html
          grep -Fq "const PACKAGE_VOTE_VALID_AFTER_UTC = '2026-09-12T05:01:14.788516+00:00';" index.html
          grep -Fq "package_votes_nextgen_v2_prospective_v1_" index.html
          grep -Fq "__pkgnv2p1__|" index.html
          grep -Fq "package_vote_challenges_prospective_v1.json" index.html
          grep -Fq "function ktcCurrentVoterId()" index.html
          grep -Fq "function renderKTC()" index.html

          echo "RESTART_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PASS: exact repaired prospective state confirmed."

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "requests==2.34.2"
          python3 - <<'PY'
          import platform, requests
          assert platform.python_version() == "3.13.15"
          assert requests.__version__ == "2.34.2"
          print("PASS: exact restart audit environment available.")
          PY

      - name: Outcome-blind audit of rows to invalidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          import os
          import requests

          url = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )
          response = requests.get(url, timeout=30)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          prospective_rows = [
              row for row in rows
              if str(row.get("keep") or "").startswith("__pkgnv2p1__|")
          ]
          voter_ids = {
              str(row.get("voter_roster_id") or "").strip()
              for row in prospective_rows
              if str(row.get("voter_roster_id") or "").strip()
          }

          if not prospective_rows:
              raise RuntimeError(
                  "Expected at least one pre-restart prospective row, but found zero. "
                  "Refusing because the restart provenance would be inaccurate."
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"INVALIDATED_PROSPECTIVE_ROW_COUNT={len(prospective_rows)}\n")
              f.write(f"INVALIDATED_PROSPECTIVE_VOTER_COUNT={len(voter_ids)}\n")

          print(
              "PASS: outcome-blind audit found "
              f"{len(prospective_rows)} prospective rows from "
              f"{len(voter_ids)} voter identities to invalidate."
          )
          PY

      - name: Freeze replacement valid-ballot cutoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          recorded = datetime.now(timezone.utc)
          restart_cutoff = recorded + timedelta(minutes=10)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"RESTART_RECORDED_AT_UTC={recorded.isoformat()}\n")
              f.write(f"RESTART_VALID_BALLOT_START_UTC={restart_cutoff.isoformat()}\n")

          print("Restart recorded at:", recorded.isoformat())
          print("Replacement valid-ballot start:", restart_cutoff.isoformat())
          PY

      - name: Patch browser to 30 daily with fresh daily counter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          cutoff = os.environ["RESTART_VALID_BALLOT_START_UTC"]

          replacements = {
              "const PACKAGE_VOTE_DAILY_LIMIT = 20;":
                  "const PACKAGE_VOTE_DAILY_LIMIT = 30;",
              "const PACKAGE_VOTE_VALID_AFTER_UTC = '2026-09-12T05:01:14.788516+00:00';":
                  f"const PACKAGE_VOTE_VALID_AFTER_UTC = '{cutoff}';",
              "return 'package_votes_nextgen_v2_prospective_v1_' + new Date().toISOString().slice(0,10);":
                  "return 'package_votes_nextgen_v2_prospective_v1_restart30_' + "
                  "new Date().toISOString().slice(0,10);",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected exactly one browser anchor for {old!r}; got {count}")
              text = text.replace(old, new, 1)

          assert "PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2" in text
          assert "core_concentration_2v2: 0.625" in text
          assert "fragmentation_filler: 0.125" in text
          assert "structural_topology_3v3: 0.25" in text
          assert "const selectedCellKey = cells[Math.floor(Math.random() * cells.length)];" in text
          assert "const recent = new Set(packageVoteRecent());" in text
          assert text.index("const selectedCellKey =") < text.index(
              "const recent = new Set(packageVoteRecent());"
          )
          assert "left: Math.random() < 0.5 ? 'A' : 'B'" in text
          assert "function packageVoteEligibleChallenges()" not in text
          assert "__pkgnv2p1__|${id}|${choice}" in text
          assert "__pkgnv2p1_meta__|${left}" in text
          assert "__pkgnv2p1_schema__|1" in text
          assert "package_vote_challenges_prospective_v1.json" in text

          for needle in (
              "function ktcTeamLabel(abbr)",
              "function ktcCurrentVoterId()",
              "function ktcEligiblePool()",
              "function renderKTC()",
          ):
              assert needle in text

          path.write_text(text, encoding="utf-8")
          print("PASS: browser set to 30/day with fresh daily counter namespace.")
          PY

      - name: Freeze formal prospective restart amendment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          D = Path("research/package-adjustment-nextgen-v2")
          out = D / "prospective_voting_restart_30_daily_v1.json"
          md = D / "prospective_voting_restart_30_daily_v1.md"

          if out.exists() or md.exists():
              raise RuntimeError("restart amendment already exists")

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          payload = {
              "schema_version": 1,
              "status": "frozen_prospective_restart_amendment_30_daily",
              "amendment_id": "pkgnv2-prospective-restart-30-daily-v1",
              "research_only": True,
              "reason": (
                  "User-intended per-voter cap was 30/day and 30 lifetime. "
                  "The initial prospective activation incorrectly retained the "
                  "first-wave 20/day browser/preregistration daily cap."
              ),
              "timing": {
                  "amendment_made_after_any_prospective_rows_existed": True,
                  "restart_recorded_at_utc": os.environ["RESTART_RECORDED_AT_UTC"],
                  "replacement_valid_ballot_start_utc":
                      os.environ["RESTART_VALID_BALLOT_START_UTC"],
                  "previous_valid_ballot_start_utc":
                      "2026-09-12T05:01:14.788516+00:00",
              },
              "invalidated_pre_restart_evidence": {
                  "rule": (
                      "Every row in the __pkgnv2p1__| namespace with timestamp "
                      "at or before replacement_valid_ballot_start_utc is permanently "
                      "ineligible for canonical prospective evidence."
                  ),
                  "raw_rows_observed_before_restart":
                      int(os.environ["INVALIDATED_PROSPECTIVE_ROW_COUNT"]),
                  "distinct_voter_identities_observed_before_restart":
                      int(os.environ["INVALIDATED_PROSPECTIVE_VOTER_COUNT"]),
                  "choice_fields_inspected": False,
                  "rows_physically_deleted": False,
                  "rows_retained_only_for_audit_trail": True,
              },
              "superseding_evidence_rules": {
                  "daily_valid_vote_cap_per_voter": 30,
                  "effective_lifetime_cap_per_voter": 30.0,
                  "minimum_distinct_voters": 30,
                  "minimum_effective_votes_per_cell": 15.0,
                  "minimum_distinct_voters_per_cell": 10,
                  "exact_checkpoints_effective_votes": [900, 1000],
                  "first_checkpoint_effective_votes": 900,
                  "hard_cap_effective_votes": 1000,
                  "stopping_is_coverage_only": True,
              },
              "unchanged_scientific_contract": {
                  "catalog_id": "pkgnv2-prospective-catalog-v1",
                  "catalog_sha256":
                      "2af809a194e79d847fe9438366f8b379b907e86d99945d7a6a5fab3e4428a36e",
                  "vote_prefix": "__pkgnv2p1__|",
                  "meta_prefix": "__pkgnv2p1_meta__|",
                  "schema_marker": "__pkgnv2p1_schema__|1",
                  "sampling_schedule_id": "equal_cell_via_family_weights_v1",
                  "cell_probability": 1 / 24,
                  "voter_roster_filtering_allowed": False,
                  "recent_memory_scope": "within_already_selected_cell_only",
                  "adaptive_sampling_from_outcomes_allowed": False,
                  "adaptive_sampling_from_model_performance_allowed": False,
                  "candidate_id": "pkgnv2-m2b-v1",
                  "model_refitting_or_tuning_authorized": False,
              },
              "browser": {
                  "daily_limit": 30,
                  "daily_counter_namespace":
                      "package_votes_nextgen_v2_prospective_v1_restart30_",
                  "index_sha256": sha("index.html"),
              },
              "production": {
                  "revision": "v1.6-v5-size2-composition-overlay",
                  "production_change_authorized": False,
                  "automatic_production_promotion_allowed": False,
                  "production_formula_changed": False,
              },
              "analysis_requirement": (
                  "All future maturity/evaluation code MUST apply this amendment "
                  "after the original preregistration and activation manifests. "
                  "Pre-restart prospective rows must never enter effective-vote "
                  "counts, cell coverage, bootstrap, log loss, or model comparison."
              ),
          }

          out.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md_text = (
              "# Package Adjustment NextGen V2 — Prospective Restart Amendment: 30/Day\n\n"
              "**Status: FROZEN RESTART AMENDMENT — production V1.6 unchanged.**\n\n"
              "The initial prospective activation retained a 20-vote daily cap even though\n"
              "the intended prospective rule was **30 votes/day and 30 effective votes\n"
              "lifetime per voter**.\n\n"
              "To preserve a clean prospective study:\n\n"
              "- **All existing prospective rows before the replacement cutoff are invalidated.**\n"
              "- Their choices were **not inspected**.\n"
              "- Raw rows remain in the transport only as an audit trail; they do not count.\n"
              f"- Replacement valid-ballot start: `{payload['timing']['replacement_valid_ballot_start_utc']}`\n"
              "- Daily valid vote cap per voter: **30**\n"
              "- Effective lifetime cap per voter: **30**\n"
              "- Minimum distinct voters: **30**\n"
              "- First checkpoint: **900 effective votes**\n"
              "- Backup/hard cap: **1000 effective votes**\n"
              "- Every one of the 24 cells still requires **≥15 effective votes and ≥10 voters**.\n"
              "- Catalog, M2b parameters, equal-cell sampler, transport namespace, and\n"
              "  production V1.6 are unchanged.\n"
          )
          md.write_text(md_text, encoding="utf-8")

          print("PASS: formal 30/day restart amendment frozen.")
          PY

      - name: Validate browser and amendment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          cutoff = os.environ["RESTART_VALID_BALLOT_START_UTC"]

          assert "const PACKAGE_VOTE_DAILY_LIMIT = 30;" in text
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" not in text
          assert f"const PACKAGE_VOTE_VALID_AFTER_UTC = '{cutoff}';" in text
          assert "package_votes_nextgen_v2_prospective_v1_restart30_" in text
          assert "PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2" in text
          assert "__pkgnv2p1__|${id}|${choice}" in text

          amendment = json.loads(
              Path(
                  "research/package-adjustment-nextgen-v2/"
                  "prospective_voting_restart_30_daily_v1.json"
              ).read_text()
          )
          assert amendment["status"] == "frozen_prospective_restart_amendment_30_daily"
          assert amendment["timing"]["replacement_valid_ballot_start_utc"] == cutoff
          assert amendment["invalidated_pre_restart_evidence"]["choice_fields_inspected"] is False
          assert amendment["invalidated_pre_restart_evidence"]["raw_rows_observed_before_restart"] >= 1
          assert amendment["superseding_evidence_rules"]["daily_valid_vote_cap_per_voter"] == 30
          assert amendment["superseding_evidence_rules"]["effective_lifetime_cap_per_voter"] == 30.0
          assert amendment["superseding_evidence_rules"]["minimum_distinct_voters"] == 30
          assert amendment["superseding_evidence_rules"]["first_checkpoint_effective_votes"] == 900

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              re.S | re.I,
          )
          Path("/tmp/index-inline.js").write_text(
              "\n".join(scripts),
              encoding="utf-8",
          )

          expected = {
              "index.html",
              "research/package-adjustment-nextgen-v2/"
              "prospective_voting_restart_30_daily_v1.json",
              "research/package-adjustment-nextgen-v2/"
              "prospective_voting_restart_30_daily_v1.md",
          }
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).splitlines()
          paths = {row[3:] for row in rows if row.strip()}
          assert paths == expected, sorted(paths)

          print("PASS: exact three-file restart boundary verified.")
          PY

          node --check /tmp/index-inline.js
          git diff --check

      - name: Protect frozen catalog candidate backend and production
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          git diff --exit-code -- scripts/market/ktc_pipeline.py
          git diff --exit-code -- scripts/validation/repo_regression_checks.py

          git diff --exit-code -- "$D/package_vote_challenges_prospective_v1.json"
          git diff --exit-code -- "$D/prospective_catalog_freeze_manifest_v1.json"
          git diff --exit-code -- "$D/prospective_time_holdout_preregistration_v1.json"
          git diff --exit-code -- "$D/prospective_time_holdout_preregistration_v1_manifest.json"
          git diff --exit-code -- "$D/prospective_voting_activation_manifest_v1.json"
          git diff --exit-code -- "$D/prospective_voting_activation_ui_repair_v1.json"
          git diff --exit-code -- "$D/research_candidate_m2b_v1.json"
          git diff --exit-code -- "$D/model_fit_beta_amended_v1_results.json"
          git diff --exit-code -- research/package-adjustment-production-candidate-v1

          echo "PASS: frozen catalog/model/backend/production files untouched."

      - name: Run full repository regressions before restart commit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Commit and push 30-daily prospective restart
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add research/package-adjustment-nextgen-v2/prospective_voting_restart_30_daily_v1.json
          git add research/package-adjustment-nextgen-v2/prospective_voting_restart_30_daily_v1.md

          staged=( $(git diff --cached --name-only) )
          test "${#staged[@]}" -eq 3

          git commit -m "Restart NextGen V2 prospective voting at 30 daily"
          echo "RESTART_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          git push origin HEAD:main

      - name: Wait until replacement valid-ballot start
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          from datetime import datetime, timezone

          target = datetime.fromisoformat(os.environ["RESTART_VALID_BALLOT_START_UTC"])
          seconds = max(0.0, (target - datetime.now(timezone.utc)).total_seconds())
          if seconds:
              print(f"Waiting {seconds:.1f}s for replacement valid-ballot start...")
              time.sleep(seconds + 1.0)

          assert datetime.now(timezone.utc) > target
          print("PASS: replacement valid-ballot start has passed.")
          PY

      - name: Final post-push restart verification
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain=v1)"

          python3 - <<'PY'
          import csv
          import io
          import json
          import os
          import requests
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          commit = os.environ["RESTART_COMMIT"]
          cutoff = datetime.fromisoformat(os.environ["RESTART_VALID_BALLOT_START_UTC"])

          raw_url = (
              "https://raw.githubusercontent.com/ajknoll23-code/"
              f"LOG-Trade-Calculator/{commit}/index.html"
          )
          response = requests.get(raw_url, timeout=30)
          response.raise_for_status()
          pushed = response.text

          assert "const PACKAGE_VOTE_DAILY_LIMIT = 30;" in pushed
          assert "package_votes_nextgen_v2_prospective_v1_restart30_" in pushed
          assert os.environ["RESTART_VALID_BALLOT_START_UTC"] in pushed
          assert "__pkgnv2p1__|${id}|${choice}" in pushed
          assert "function ktcCurrentVoterId()" in pushed
          assert "function renderKTC()" in pushed

          sheet = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )
          response = requests.get(sheet, timeout=30)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          pre_or_at_cutoff = 0
          post_cutoff = 0
          for row in rows:
              if not str(row.get("keep") or "").startswith("__pkgnv2p1__|"):
                  continue
              raw_ts = str(row.get("timestamp") or "").strip()
              if raw_ts.endswith("Z"):
                  raw_ts = raw_ts[:-1] + "+00:00"
              ts = datetime.fromisoformat(raw_ts)
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=timezone.utc)
              ts = ts.astimezone(timezone.utc)
              if ts <= cutoff:
                  pre_or_at_cutoff += 1
              else:
                  post_cutoff += 1

          amendment = json.loads(
              Path(
                  "research/package-adjustment-nextgen-v2/"
                  "prospective_voting_restart_30_daily_v1.json"
              ).read_text()
          )
          assert amendment["timing"]["replacement_valid_ballot_start_utc"] == cutoff.isoformat()
          assert amendment["superseding_evidence_rules"]["daily_valid_vote_cap_per_voter"] == 30
          assert amendment["superseding_evidence_rules"]["effective_lifetime_cap_per_voter"] == 30.0

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["RESTART_BASE_SHA"], commit],
              text=True,
          ).splitlines()
          expected = sorted([
              "index.html",
              "research/package-adjustment-nextgen-v2/prospective_voting_restart_30_daily_v1.json",
              "research/package-adjustment-nextgen-v2/prospective_voting_restart_30_daily_v1.md",
          ])
          assert sorted(changed) == expected, changed

          print(f"PASS: {pre_or_at_cutoff} prospective rows are permanently pre-restart/invalid.")
          print(f"INFO: {post_cutoff} rows currently fall after the replacement cutoff.")
          print("PASS: pushed 30/day restart is exact.")
          print("VALID PROSPECTIVE VOTING IS OPEN AT 30/DAY, 30 LIFETIME.")
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py
