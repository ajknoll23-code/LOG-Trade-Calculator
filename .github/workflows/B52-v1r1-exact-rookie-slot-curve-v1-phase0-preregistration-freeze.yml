              "estimand": "E[H3.O2 outcome | overall rookie pick], using the frozen V8/V10 occurrence and class weighting estimand",
              "point_estimation": "Preserve V10's exact weighting estimand at the cell level. Within each training-set draft class and V10 cell, normalize frozen development_fit_weight_v8 over retained occurrences exactly as V10. Give each training-set draft class equal total cell weight (1/Nclasses). Exact-slot values are the conditional weighted means induced by those class/cell weights; this preserves equal class macro weight without pretending repeated league selections are independent.",
              "repeated_rookie_rule": "Repeated league selections remain occurrence-weighted in the point estimand but must be clustered by stable rookie identity for uncertainty; repeated selections are not independent outcomes.",
              "historical_source_mapping": {
