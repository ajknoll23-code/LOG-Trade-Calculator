              "h3_maturity_not_before_utc": "2027-01-12T00:00:00Z",
              "additional_open_guard": "Do not read any 2024 H3 outcome row until the 2026 regular season including Week 18 is complete, the full frozen H3 outcome source is available, and a pre-outcome 2024 source/weight contract compatible with overall picks 1-48 is frozen.",
              "physical_firewall": "Phase 0A and Phase 1 inputs must be physically filtered to 2018-2023 and assert no 2024+ outcome row is materialized. Reading any 2024 outcome row before holdout maturity is a governance breach.",
