                "phase0a_required_assertion": "Every retained R1-R4 occurrence must satisfy the frozen 12-pick source mapping and its stored V10 cell must equal the cell implied by overall_slot. If the historical V10 cell assignment is not exactly a union of the listed overall-pick slots, STOP before outcomes.",
                "runtime_separation": "This historical source mapping does not authorize a 12-team assumption for future user leagues. Runtime exact-slot lookup must use a known overall pick or the league's actual draft size/order.",
                "cells": {
