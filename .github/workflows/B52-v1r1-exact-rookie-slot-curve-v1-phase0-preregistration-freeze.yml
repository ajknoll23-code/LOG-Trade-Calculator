name: B52 Exact Rookie Slot Curve V1 - Phase 0 Preregistration Freeze V1R1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  freeze-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard V10 production lineage and exact-slot TODO
        shell: bash
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json)" = \
            "42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v10/v10_todo.json)" = \
            "d7b1af72ce904c0f5690d248803e1abc5dd0465e"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v10/v10_phase0_expected_value_preregistration.json)" = \
            "011c2d52acf2e2e77d728b07678e4d435cd869f8"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v10/v10_phase0_expected_value_construct_audit.json)" = \
            "5adbdfe3209aa47a024faa81892361855c5164d5"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v10/v10_phase1_market_bridge_tail_evaluation.json)" = \
            "02bde20477ea0e37bf8930996059ea6c53fc146e"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v10/v10_phase2_5_frozen_production_candidate.json)" = \
            "e28940df100e233d9cb1793244d57f65700a51e6"

          test "$(git rev-parse HEAD:model/releases/draft-pick-fv-v10/release.json)" = \
            "0b22d5dcd7f224db3c806ab5b0adf2ccda9ea81e"

          python3 - <<'PY'
          import json
          from pathlib import Path

          todo = json.loads(
              Path("research/draft-pick-fv-v10/v10_todo.json").read_text()
          )
          item = next(
              x for x in todo["items"]
              if x["id"] == "exact-rookie-slot-curve-v1"
          )
          assert item["status"] == "TODO_POST_V10"
          assert item["constraints"] == [
              "derive from historical rookie outcomes before consulting market residuals",
              "enforce monotonicity across exact slots",
              "do not infer an exact slot for future picks whose order is unknown",
              "validate against independent market/trade evidence before production",
          ]

          v7 = json.loads(
              Path(
                  "research/draft-pick-fv-v7/"
                  "r1_r6_full_scale_preregistration_v7.json"
              ).read_text()
          )
          assert v7["cell_definition"]["required_pick_slots"] == (
              "overall slots 1-72 inclusive"
          )
          assert v7["cell_definition"]["tiers"] == {
              "early": "within-round picks 1-4",
              "late": "within-round picks 9-12",
              "mid": "within-round picks 5-8",
          }

          release = json.loads(
              Path("model/releases/draft-pick-fv-v10/release.json").read_text()
          )
          assert release["production_change_authorized"] is True
          assert release["candidate_id"] == "V10_C1_PLUS_M1_PLUS_MT2_PLUS_YD2"
          assert release["exact_slot_followup"]["status"] == "TODO_POST_V10"
          assert abs(
              float(release["pick_base_values"]["r5_early"])
              - 1394.2378677715392
          ) < 1e-12
          assert float(release["year_discount"]["2027"]) == 1.0

          p0 = json.loads(
              Path(
                  "research/draft-pick-fv-v10/"
                  "v10_phase0_expected_value_construct_audit.json"
              ).read_text()
          )
          assert p0["core_estimator_id"] == "V10_C1_CLASS_BALANCED_DIRECT_EV"
          assert p0["phase0_integrity_pass"] is True

          p1 = json.loads(
              Path(
                  "research/draft-pick-fv-v10/"
                  "v10_phase1_market_bridge_tail_evaluation.json"
              ).read_text()
          )
          assert p1["phase0_fundamental_core_unchanged"] is True
          assert p1["market_bridge"]["candidate_id"] == "V10_M1_SINGLE_GLOBAL_LOG_SCALE"
          assert p1["market_bridge"]["ktc_used_to_refit_fundamental_core"] is False
          assert abs(
              float(p1["market_bridge"]["combined_multiplier"])
              - 2.24417411952795
          ) < 1e-12

          print(
              "PASS: V7 source-cell mapping, V10 closed production lineage, "
              "bridge constant, R5 PICK_BASE, and 2027 discount verified."
          )
          PY

          sha256sum \
            index.html \
            free-agent-board.html \
            model/releases/draft-pick-fv-v10/release.json \
            research/draft-pick-fv-v10/v10_todo.json \
            > "${RUNNER_TEMP}/protected.sha256"

      - name: Preflight repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Resolve preregistration namespace
        shell: bash
        run: |
          set -euo pipefail

          OUT="research/exact-rookie-slot-curve-v1"
          A="$OUT/phase0_preregistration.json"
          B="$OUT/phase0_preregistration.md"
          C="$OUT/phase0_preregistration_manifest.json"

          count=0
          for p in "$A" "$B" "$C"; do
            if test -e "$p"; then
              count=$((count+1))
            fi
          done

          if test "$count" -ne 0 && test "$count" -ne 3; then
            echo "PARTIAL_PREREGISTRATION_NAMESPACE"
            exit 2
          fi

          if test "$count" -eq 3; then
            echo "ALREADY_FROZEN=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_FROZEN=false" >> "$GITHUB_ENV"
          fi

      - name: Write frozen Phase 0 preregistration
        if: env.ALREADY_FROZEN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p research/exact-rookie-slot-curve-v1

          cat > research/exact-rookie-slot-curve-v1/phase0_preregistration.json <<'JSON'
          {
            "schema_version": 1,
            "study_id": "exact-rookie-slot-curve-v1",
            "stage": "phase0_preregistration",
            "status": "FROZEN_BEFORE_EXACT_SLOT_SOURCE_DIAGNOSTICS",
            "objective": "Test whether historical rookie-draft evidence supports a monotone exact overall-pick Fundamental Value curve for overall picks 1-48 without using market data to fit or select the historical estimator.",
            "production_change_authorized": false,
            "scientific_design_change_authorized_after_freeze": false,
            "v10_lineage": {
              "production_release_id": "draft-pick-fv-v10-production-release-v2",
              "production_candidate_id": "V10_C1_PLUS_M1_PLUS_MT2_PLUS_YD2",
              "fundamental_core_estimator_id": "V10_C1_CLASS_BALANCED_DIRECT_EV",
              "market_bridge_candidate_id": "V10_M1_SINGLE_GLOBAL_LOG_SCALE",
              "market_bridge_multiplier": 2.24417411952795,
              "v10_todo_git_blob": "d7b1af72ce904c0f5690d248803e1abc5dd0465e",
              "v10_phase0_prereg_git_blob": "011c2d52acf2e2e77d728b07678e4d435cd869f8",
              "v10_phase0_audit_git_blob": "5adbdfe3209aa47a024faa81892361855c5164d5",
              "v10_phase1_market_bridge_git_blob": "02bde20477ea0e37bf8930996059ea6c53fc146e",
              "v10_phase2_5_candidate_git_blob": "e28940df100e233d9cb1793244d57f65700a51e6",
              "v10_release_git_blob": "0b22d5dcd7f224db3c806ab5b0adf2ccda9ea81e",
              "v7_source_prereg_git_blob": "42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"
            },
            "scope": {
              "historical_development_classes": [
                2018,
                2019,
                2020,
                2021,
                2022,
                2023
              ],
              "primary_overall_pick_axis": {
                "first": 1,
                "last": 48,
                "count": 48
              },
              "display_rounds": [
                1,
                2,
                3,
                4
              ],
              "rounds_5_6": "OUT_OF_SCOPE_RETAIN_FROZEN_V10_TAIL",
              "year_discount": "OUT_OF_SCOPE_RETAIN_FROZEN_V10_YEAR_DISCOUNT",
              "historical_source_round_size": 12,
              "historical_source_round_size_role": "Frozen development-source fact used to recover overall pick; not a runtime assumption for future leagues."
            },
            "axis_and_estimand": {
