              .footer{display:none}
              </style></head><body><header class="masthead"><img src="''' + esc(logo) + '''" alt="LOG original logo"><div><div class="brand">League of Ordinary Gentlemen</div><h1>''' + esc(heading) + '''</h1><div class="sub">''' + esc(issue_sub) + '''</div></div></header><div class="intro"><div class="eyebrow">This issue · six games, six independent stories</div><p>Six evidence-led matchups. Provisional standings are unofficial; recent scoring is not a calibrated prediction.</p>''' + contents + '''</div>''' + ''.join(cards) + '''<footer class="footer">READ-ONLY SHADOW · Retrieved ''' + esc(stamp) + ''' UTC · Team records count H2H plus league median. Recent form describes completed games, not a calibrated prediction. No published or backfilled picks. Original logo. Independent editorial approval required.</footer></body></html>'''
          
          
          def editorial_md(title,week,stories,snapshot,kind):
              rows=[f'# {title} — Week {week} · A-NL25R1', '',
                    'Status: READ-ONLY EDITORIAL PREVIEW · NOT PUBLISHED · NOT AN ARCHIVED PICK',
                    f'Sleeper retrieval UTC: {snapshot["generated_at_utc"]}',
                    'Source: public Sleeper weekly matchup scores and, where available, verified starters/players_points.',
                    'Standings: provisional reconstruction only. The retrospective form figures are not calibrated odds.', '']
              for i,s in enumerate(stories,1):
                  rows += [f'## {i:02d} — {s["name_a"]} vs {s["name_b"]}',f'ANGLE: {s["angle"]}',
                           f'### {s["headline"]}',s['lead'],'',s['why'],'',f'**{("What to watch" if kind=="war" else "What it means next")}:** {s["question"]}', '']
                  if s['player_note']:
                      rows += [f'**Starter evidence:** {s["player_note"]["text"]}',f'**Starter source:** {s["player_note"]["source"]}', '']
                  rows += [f'**Source:** {s["source"]}', '']
              return '\n'.join(rows)
          
          
          def normalize_text(s):return ' '.join(s.replace('\xad','').split())
          
          
          def verify_pdf(path,stories):
              import fitz
              doc=fitz.open(str(path))
              if not doc:raise RuntimeError('PDF has no pages')
              content=normalize_text(' '.join(page.get_text() for page in doc))
              for s in stories:
                  if normalize_text(s['headline']) not in content:
                      raise RuntimeError(f'PDF missing headline {s["headline"]}')
              for p in doc:
                  if p.rect.width>313 or p.rect.height>540 or p.rect.width<290:
                      raise RuntimeError(f'PDF page size not phone-readable: {p.rect}')
                  for blk in p.get_text('blocks'):
                      if len(blk)>=4 and (blk[0]<-1 or blk[2]>p.rect.width+1 or blk[1]<-1 or blk[3]>p.rect.height+1):
                          raise RuntimeError(f'PDF text exceeds page geometry: {p.rect} {blk[:4]}')
              if 'H2H_PLUS_MEDIAN_REPLAY_MATCHES_LIVE_RECORDS' in content:
                  raise RuntimeError('Internal diagnostic token leaked')
              doc.close()
              return {'pages':len(fitz.open(str(path))),'characters':len(content)}
          
          
          def quality_report(stories,kind):
              counts=dict(Counter(s['angle'] for s in stories))
              heads=[s['headline'].casefold().strip() for s in stories]
              if len(set(heads))!=6:raise RuntimeError('Duplicate headlines')
              if len(counts)<4 or max(counts.values())>2:
                  raise RuntimeError('Editorial diversity gate failed')
              for s in stories:
                  if not s['lead'] or not s['why'] or not s['question'] or not s['keys']:
                      raise RuntimeError('Story missing evidence-oriented argumentative anatomy')
                  if 'both teams will try to build momentum' in (s['lead']+' '+s['why']).lower():
                      raise RuntimeError('NL24 synthetic filler appeared')
                  if kind=='after' and 'margin'==s['angle']:
                      raise RuntimeError('Aftermath only restates score')
              return {'unique_angle_count':len(counts),'angle_counts':counts,'headlines_unique':True,
                      'editorial_acceptance':'HUMAN_REVIEW_REQUIRED','automated_checks_not_equivalent_to_editorial_quality':True}
          
          
          def fixture_load(path):
              data=json.loads(path.read_text(encoding='utf-8'))
              if len(data['war_games'])!=6 or len(data['after_games'])!=6:
                  raise RuntimeError('Invalid offline source fixture')
              return data
          
          
          def execute(out,root,war_week,after_week,fixture=None):
              if war_week!=after_week+1 or not 4<=after_week<=17:
                  raise RuntimeError('Must compare adjacent weeks and have at least three completed history games')
              out.mkdir(parents=True,exist_ok=True)
              data=fixture_load(fixture) if fixture else snapshot(war_week,after_week)
              if data['war_week']!=war_week or data['aftermath_week']!=after_week:
                  raise RuntimeError('Fixture or requested weeks do not agree')
              # This run writes only to the Runner's temporary artifact directory.
              team_ids={g['id_a'] for g in data['war_games']} | {g['id_b'] for g in data['war_games']}
              if len(team_ids)!=12:raise RuntimeError('Exactly twelve teams in War Room required')
              if len({g['id_a'] for g in data['after_games']}|{g['id_b'] for g in data['after_games']})!=12:
                  raise RuntimeError('Exactly twelve teams in Aftermath required')
              if fixture:
                  players={'recent':{},'final':{},'data_status':'Offline fixture contains no authenticated player starter evidence'}
              else:
                  players=player_lenses(root,after_week,team_ids)
              fwar=[war_facts(g,war_week,players) for g in data['war_games']]
              hist={str(g['id_a']):g['scores_a'] for g in data['war_games']}
              hist.update({str(g['id_b']):g['scores_b'] for g in data['war_games']})
              faft=[after_facts(g,data,hist,players) for g in data['after_games']]
              war=join_stories(fwar,'war',players);after=join_stories(faft,'after',players)
              logo,logo_hash=logo_source(root)
              from weasyprint import HTML
              checks={}
              for tag,title,week,stories,kind in [('WarRoom','The Weekly War Room',war_week,war,'war'),
                                                   ('Aftermath','The Aftermath',after_week,after,'after')]:
                  stem=f'LOG-NL25R1-{tag}-W{week:02d}-Editorial-Shadow'
                  q=quality_report(stories,kind)
                  (out/(stem+'.md')).write_text(editorial_md(title,week,stories,data,kind),encoding='utf-8')
                  html=render_html(title,f'2026 · Week {week} · editorial intelligence study',stories,logo,data['generated_at_utc'],kind)
                  (out/(stem+'.html')).write_text(html,encoding='utf-8')
                  if any(token in html.lower() for token in ('unrostered players to investigate','best free agents','free agent watch')):
                      raise RuntimeError('Prohibited player availability content in HTML')
                  pdf=out/(stem+'.pdf')
                  HTML(string=html,base_url=str(root)).write_pdf(str(pdf))
                  checks[tag]={**q,**verify_pdf(pdf,stories)}
              ledger={'editorial_model':'A-NL25R1','season':SEASON,'war_week':war_week,'aftermath_week':after_week,
                   'source':'Public Sleeper league weekly matchup API; cached roster identities only for named player contributions',
                   'source_retrieval_utc':data['generated_at_utc'],
                   'source_snapshot_sha256':hashlib.sha256(json.dumps(data,sort_keys=True).encode()).hexdigest(),
                   'logo_sha256':logo_hash,'players':players['data_status'],
                   'fixture_test_not_live_evidence':bool(fixture),
                   'publication_authorized':False,'picks_archived':False,'manual_editorial_approval_required':True,
                   'privacy_guards':['do not read private FA boards','no recommendations for unrostered players','no email','no repo writes','no FV/MV changes'],
                   'quality':checks,
                   'war':[{'pair':[s['name_a'],s['name_b']],'angle':s['angle'],'head':s['headline'],
                           'selected_evidence_keys':s['keys'],'candidates':s['all_candidates'],
                           'starter_evidence':s['player_note']} for s in war],
                   'after':[{'pair':[s['name_a'],s['name_b']],'angle':s['angle'],'head':s['headline'],
                           'selected_evidence_keys':s['keys'],'candidates':s['all_candidates'],
                           'starter_evidence':s['player_note']} for s in after]}
              (out/'NL25R1-Editorial-Evidence-and-Decision-Ledger.json').write_text(json.dumps(ledger,indent=2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
              (out/'NL25R1-EDITORIAL-QA.md').write_text('''# NL25R1 Editorial Quality Report
          
          - **Workflow status:** automated checks only; human editorial approval still required.
          - **No publication, email, pick-archive write, or calculator update.**
          - **Privacy:** no private FA/scouting/4for4 board is read or published.
          - **Method:** global angle assignment (max twice per edition), evidence-backed lead/meaning/question, score-and-median parity, optional verified starter facts.
          - **Important limitation:** original premium NL19 PDFs are not packaged as comparison baselines. The NL24 paper trail is provided in the source review but is not asserted to be a genuine approved older edition. Compare rendered PDFs manually against the approved premium design before release.
          - **Forecasting:** no calibrated pick probabilities or retrospective made-up picks.
          - **Reader caution:** preliminary provisional standings order remains unofficial until tie-break parity independently established.
          
          ## Automated counts
          
          ```json
          ''' +json.dumps(checks,indent=2,ensure_ascii=False)+'''
          ```
          
          ## Required manual acceptance
          
          Review all twelve headlines, all twelve bodies, source claims, player names, app font readability on phone, unchanged original LOG branding, paragraphs with distinctive voice, and prior premium design continuity. This file is **not editorial signoff**.
          ''',encoding='utf-8')
              (out/'ACCEPTANCE.txt').write_text('PASS: 6 War Room + 6 Aftermath; at least 4 distinct lead angles per issue; <=2 repeated angles; public source facts; no unrostered player ranks; logo preserved; PDF geometry and text checked. MANUAL EDITORIAL APPROVAL STILL REQUIRED.\n',encoding='utf-8')
              print('PASS: NL25R1 read-only editorial shadow. Automated diversity, evidence, privacy and PDF geometry checks passed; human editorial review required.')
          
          
          def selftest():
              assert f2(Decimal('668.53')-Decimal('439.58'))=='228.95'
              sample={'game':{'name_a':'Alpha','name_b':'Bravo','rank_a':1,'rank_b':2,
                    'record_a':'14-2-0','record_b':'12-4-0', 'scores_a':[180]*8,'scores_b':[195]*8,
                    'id_a':1,'id_b':2},'window':'Weeks 6–8','season_window':'Weeks 1–8',
                    'ave_a':180,'ave_b':195,'gap':15,'range_a':0,'range_b':0,'high_a':180,'high_b':195,
                    'low_a':180,'low_b':195,'season_a':180,'season_b':195,'latest_a':180,'latest_b':195,
                    'latest_change_a':0,'latest_change_b':0,'prior_a':180,'prior_b':195,
                    'trend_a':0,'trend_b':0,'p_a':None,'p_b':None,'record_a':(14,2,0),'record_b':(12,4,0)}
              assert any(c['angle']=='title race' for c in pre_candidates(sample))
              assert any(c['angle']=='measured comparison' for c in pre_candidates(sample))
              assert esc('<respectable team name>')=='&lt;respectable team name&gt;'
              chosen=allocate([[entry(f'angle{i}',100+i,'T','L','W','Q',['x']) for i in range(6)] for _ in range(6)])
              assert len({x['angle'] for x in chosen})>=3
              print('PASS: independent NL25R1 selftest for records, rounding, markup, angles and global assignment')
          
          
          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--out',type=Path)
              p.add_argument('--root',type=Path,default=Path.cwd())
              p.add_argument('--war-week',type=int,default=9)
              p.add_argument('--aftermath-week',type=int,default=8)
              p.add_argument('--fixture',type=Path)
              p.add_argument('--selftest',action='store_true')
              args=p.parse_args()
              if args.selftest:selftest()
              else:execute(args.out,args.root,args.war_week,args.aftermath_week,args.fixture)
          PY
          python3 -m py_compile "$RUNNER_TEMP/log_nl25_editorial.py"
          python3 "$RUNNER_TEMP/log_nl25_editorial.py" --selftest
      - name: Render premium War Room and Aftermath shadow previews
        shell: bash
        env:
          WAR_WEEK: ${{ inputs.war_week }}
          AFTERMATH_WEEK: ${{ inputs.aftermath_week }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/log_nl25_editorial.py" \
            --root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/log-nl25-editorial" \
            --war-week "$WAR_WEEK" \
            --aftermath-week "$AFTERMATH_WEEK"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'log-nl25-editorial'
          files=list(root.glob('*.pdf'))
          assert len(files)==2,files
          doc=json.loads((root/'NL25R1-Editorial-Evidence-and-Decision-Ledger.json').read_text())
          assert doc['publication_authorized'] is False
          assert doc['picks_archived'] is False
          assert doc['manual_editorial_approval_required'] is True
          assert len(doc['war'])==6 and len(doc['after'])==6
          assert all(x['unique_angle_count']>=4 for x in doc['quality'].values())
          assert all(max(x['angle_counts'].values())<=2 for x in doc['quality'].values())
          print('PASS: 2 premium PDFs, 12 evidence-led stories, 4+ distinct angles per issue; manual acceptance still required')
          PY
      - name: Verify no repository writes or released predictions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS: checkout remains immutable; no email, no picks archival, no newsletter release'
      - name: Upload read-only PDFs, text, evidence ledger, and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL25R1-Premium-Editorial-Shadow-${{ github.run_id }}
          path: ${{ runner.temp }}/log-nl25-editorial/
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## A-NL25R1 Premium Editorial Intelligence Shadow'
            echo '- Six War Room preview stories plus six Week-before Aftermath recaps'
            echo '- Different verified lead angles selected globally; ≥4 distinct per edition, ≤2 repetitions per angle'
            echo '- Public Sleeper results, H2H and median, pregame-only form comparisons, optional verified starter points'
            echo '- Original LOG site logo, ivory/navy/coral styling, phone-width PDFs with independent text geometry checks'
            echo '- Source/evidence ledger and manual editorial approval requirement in artifact'
            echo '- No email, no picks/archive writes, no publishing or changes to FV/MV and frozen research'
          } >> "$GITHUB_STEP_SUMMARY"
