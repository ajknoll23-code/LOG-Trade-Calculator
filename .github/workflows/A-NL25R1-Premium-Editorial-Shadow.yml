                     {player}<div class="evidence">SOURCE · {esc(s['source'])}</div>
                     </section>''')
              # The six-game index functions as a contents rail, not a forced full-page cover.
              return '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
              <style>
              @page {size:108mm 183mm; margin:8mm 8mm 12mm 8mm; @bottom-right {content:"LOG · " counter(page); color:#5A6B7A;font:9pt Arial;} @bottom-left {content:"EDITORIAL SHADOW · NOT PUBLISHED";color:#7A8590;font:7.5pt Arial;}}
              *{box-sizing:border-box} html,body{margin:0;padding:0;max-width:100%;overflow-wrap:anywhere;}
              body{background:#F6F2E9;color:#152B42;font:11pt/1.48 Georgia,'Times New Roman',serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
              .masthead{background:#102C49;color:#F8F2E9;padding:5mm 5mm 4mm;border-bottom:2.5pt solid #CD7568;display:flex;gap:3mm;align-items:center;}
              .masthead img{width:13mm;height:auto;max-height:15mm;object-fit:contain;flex:none}
              .brand{font:8.6pt/1.3 Arial;letter-spacing:1.2px;text-transform:uppercase;color:#E7D8CA}
              h1{font:19pt/1.05 Georgia,serif;margin:1mm 0 1mm;color:#FFF7E9;overflow-wrap:anywhere}
              .sub{font:9.5pt/1.35 Arial;color:#E8DCCB}
              .intro{padding:3.4mm 4mm 2.4mm;border-bottom:1px solid #C5C9CB}
              .eyebrow{font:bold 8.7pt Arial;letter-spacing:1.2px;text-transform:uppercase;color:#BA665F}
              .intro p{font:9pt/1.35 Georgia;margin:1.4mm 0 1.8mm}
              .index-item{display:flex;gap:2.5mm;align-items:baseline;padding:1mm 0;border-bottom:1px solid #DBD8D0;break-inside:avoid}
              .index-item>span{font:bold 8.8pt Arial;color:#C36D62;min-width:6mm}
              .index-item strong{display:block;font:bold 9pt/1.24 Arial;color:#142D47}
              .index-item small{font:8.7pt/1.2 Georgia;color:#5C6972;display:block}
              .matchup{padding:5mm 3.5mm 4mm;border-bottom:2px solid #C7D0D1;break-inside:avoid;page-break-inside:avoid;background:#FDFBF7}
              .matchup:nth-of-type(even){background:#FAF7F1}
              .card-top{display:flex;justify-content:space-between;align-items:center;gap:2mm;font:bold 8.5pt Arial;letter-spacing:1.1px;text-transform:uppercase}
              .edition-code{color:#B9675A}.lens{color:#526779;font-weight:normal;letter-spacing:.3px;text-align:right}
              h2{font:16pt/1.17 Georgia,serif;margin:2.2mm 0 2mm;color:#142D47;overflow-wrap:anywhere}
              .teams{font:bold 9.5pt/1.42 Arial,sans-serif;color:#1C344B;margin-bottom:2.5mm;overflow-wrap:anywhere}
              .teams span{display:inline-block;font:7.6pt Arial;letter-spacing:.5px;color:#BC6C5F;margin:0 2mm}
              .stat-strip{background:#E9EEF0;padding:2.4mm 2.3mm;margin:2.3mm 0 3mm;border-left:2px solid #B9675A}
              .stat-strip>div{display:flex;justify-content:space-between;gap:2mm;margin:.5mm 0}
              .stat-strip span{font:7.5pt/1.15 Arial;letter-spacing:.5px;color:#536477}
              .stat-strip b{font:bold 9pt/1.15 Arial;color:#17344C;text-align:right}
              .matchup p{margin:1.5mm 0 2.2mm;orphans:2;widows:2}
              .lead{font-weight:bold;color:#122F48}
              .question{padding:2.8mm 3.1mm;border-left:2.4pt solid #C46B60;background:#EEE9E1;margin:2.5mm 0 2mm}
              .question b{font:bold 7.5pt Arial;letter-spacing:1.1px;color:#9F554C}
              .question p{font:10pt/1.4 Georgia;margin:1.2mm 0 0}
              .player{font:9.6pt/1.37 Georgia;background:#F1EEE8;padding:2.3mm;margin-top:2mm}
              .player b{font:bold 8.4pt Arial;color:#1A4660}
