      - name: Prove exact scope and frozen-study preservation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          release=json.loads(
              Path('model/releases/fourforfour-offense-live-role-r1-v1/release.json')
              .read_text(encoding='utf-8')
          )
          assert release['release_id']=='fourforfour-offense-live-role-r1-v1'
          assert release['signal_count']==22
          assert release['raw_prod_mult_changed_count']==22
          assert release['signal_direction_counts']=={'positive':9,'negative':13}
          assert release['signal_by_position']=={'QB':1,'RB':3,'TE':5,'WR':13}
          assert release['policy']['raw_prod_mult_cap']==0.005
          assert release['green_shadow_impact']['bounded_live_role_safety_gate_pass'] is True
          assert release['frozen_opportunity_v2_modified'] is False
          assert release['private_row_level_4for4_output_persisted'] is False
          assert release['row_level_snap_output_persisted'] is False

          # Frozen Opportunity V2 files must remain byte-identical to HEAD.
          for p in (
              'research/opportunity-v2/opportunity_v2_phase3_shadow_audit.json',
              'research/opportunity-v2/opportunity_v2_phase5_frozen_candidates.json',
          ):
              if subprocess.check_output(['git','hash-object',p],text=True).strip() != (
                  'd3066303b476fd244870a8c0dbd80d584eb8d7f7'
                  if 'phase3' in p else
                  '7d4286e2eb5904f0df385827daeffd9c2a1357b2'
              ):
                  raise RuntimeError(f'frozen Opportunity V2 file changed: {p}')

          forbidden={
              'player','player_name','sleeper_id','source_player_name',
              'signals','players','candidate_overrides','raw_snap_rows',
          }
          def walk(v,p='$'):
              if isinstance(v,dict):
                  for k,c in v.items():
                      if k in forbidden:
                          raise RuntimeError(f'forbidden row-level key at {p}.{k}')
                      walk(c,f'{p}.{k}')
              elif isinstance(v,list):
                  for i,c in enumerate(v):
                      walk(c,f'{p}[{i}]')
          walk(release)
          print('PASS: R1 release aggregate-only and Opportunity V2 untouched.')
          PY

          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort)
