          python3 - <<'PY'
          import base64,re
          from pathlib import Path

          o1=Path('.github/workflows/fourforfour-offense-v1-phase-o1-shadow.yml').read_text(encoding='utf-8')
          m1=re.search(r"cat > /tmp/fourforfour-offense-phase-o1\.py\.b64 <<'B64'\n(.*?)\n\s*B64",o1,re.S)
          if not m1:
              raise RuntimeError('unable to extract O1 embedded script')
          base=base64.b64decode(
              ''.join(x.strip() for x in m1.group(1).splitlines()),
              validate=True,
          ).decode('utf-8')

          r1=Path('.github/workflows/fourforfour-offense-v1-live-role-r1-shadow.yml').read_text(encoding='utf-8')
          m2=re.search(r"cat > /tmp/live-role-r1-append\.py\.b64 <<'B64'\n(.*?)\n\s*B64",r1,re.S)
          if not m2:
              raise RuntimeError('unable to extract exact R1 shadow script')
          role=base64.b64decode(
              ''.join(x.strip() for x in m2.group(1).splitlines()),
              validate=True,
          ).decode('utf-8')

          tail=base64.b64decode(
              ''.join(
                  x.strip()
                  for x in Path('/tmp/live-role-r1-deploy-tail.py.b64')
                  .read_text(encoding='ascii').splitlines()
              ),
              validate=True,
          ).decode('utf-8')

          combined=base+'\n\n'+role+'\n\n'+tail+'\n'
          compile(combined,'/tmp/live-role-r1-deploy.py','exec')
          Path('/tmp/live-role-r1-deploy.py').write_text(combined,encoding='utf-8')
          PY

          python3 /tmp/live-role-r1-deploy.py

