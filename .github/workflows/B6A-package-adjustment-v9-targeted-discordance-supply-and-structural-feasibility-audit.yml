name: B6A Package Adjustment V9 - Targeted Discordance Supply and Structural Feasibility Audit

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b6a-targeted-discordance-supply
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6A_ANALYSIS_VERSION: "package-adjustment-v9-b6a-targeted-discordance-supply-v1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3"

      - name: Guard exact B6 PASS and source-only lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json"]="8fb47e28595bed2b667ed8a6e29cbe9d52aaf670"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_discordance_generator_audit.json"]="b0d0cf48b918aebe204557ad27fdf16dca0aaa82"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_operating_characteristics.json"]="1d79a7d2e704546c636cc4405ef8d13daeb7598f"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_oracle_rule_diagnostic.json"]="73c9169fe097b2194016cb2e1666f3176c9eb137"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_preregistered_protocol.json"]="0beffd4b2455a6e101acf3523d09955fa82eb77f"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_report.md"]="b3696815a0b1a7d4dbc9e71da3f1459059a9f798"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json"]="81cee2e1242ee05259cb68639efad80c704647f9"
            ["research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json"]="945bfb8f504bf62cba46464e1940126fd7a528e8"
            ["research/package-adjustment-v8/generate_development_catalog_v1.py"]="eaf39ecb21acaafa71fc393f2ed4c8b497bf12d0"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v6/production_candidate_v1.json"]="9abaf2c01890da3abb0d13ae4d57cb37b91a08e2"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: durable source drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY1'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          b6=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json')
          freeze=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json')
          supply=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_discordance_generator_audit.json')
          snap=load('research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json')
          assert b6['status']=='PASS_B6_TOPOLOGY_SPECIFIC_DISCORDANCE_INFORMATION_LIMIT_AUDIT_ONLY'
          assert b6['decision']=='PASS_PREFERRED_BURDEN_FEASIBLE'
          assert b6['minimum_qualifying_design']['voters']==30
          assert b6['minimum_qualifying_design']['ballots']==720
          assert b6['minimum_qualifying_design']['challenges_per_topology']==120
          assert b6['v9_human_outcomes_exist_or_were_read'] is False
          assert b6['v9_human_catalog_generated'] is False
          assert b6['production_change_authorized'] is False
          assert freeze['candidate_id']=='V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q'
          assert abs(float(freeze['q'])-2.9897594788655337)<1e-15
          assert abs(float(freeze['theta_min'])-0.60)<1e-15
          assert abs(float(freeze['fair_band_relative_difference'])-0.07)<1e-15
          assert abs(float(freeze['familywise_harmful_activation_alpha'])-0.05)<1e-15
          assert supply['status']=='STOP_ZERO_DISCORDANCE_IN_AT_LEAST_ONE_TOPOLOGY_SOURCE_AUDIT'
          assert any(r['topology']=='2v4' and r['discordant_trials']==0 for r in supply['rows'])
          assert snap['player_count']==472
          assert snap['draft_picks_included'] is False
          assert snap['market_values_used'] is False
          print('PASS: exact B6 statistical PASS, B6 source-supply STOP, frozen V9 candidate/estimand, and full pre-V8 472-player FV snapshot guarded.')
          PY1

      - name: Run targeted source-only discordance supply audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b6a
          mkdir -p /tmp/package-adjustment-v9-b6a

          cat > /tmp/package-adjustment-v9-b6a/analyze_b6a.py <<'PY2'
          from __future__ import annotations
          import bisect, hashlib, json, math, os
          from collections import Counter
          from pathlib import Path
          import numpy as np

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b6a')
          VERSION=os.environ['B6A_ANALYSIS_VERSION']
          B6=ROOT/'research/package-adjustment-v9/b6-discordance-information-limit'
          V7=ROOT/'research/package-adjustment-v7'
          V8=ROOT/'research/package-adjustment-v8'

          TOPOLOGIES=['2v2','2v3','2v4','3v3','3v4','4v4']
          Q=2.9897594788655337
          FAIR=0.07
          RAW_RATIO_MIN=0.75
          SUPPLY_TARGET=120
          RESERVE_TARGET=240
          SEARCH_CAP=600
          MIN_PLAYER_FV=2500
          SIZE2_MIN_FV=3000
          SIDE_MIN_TOTAL={2:7000,3:9000,4:11500}
          SIDE_PROFILES={
            2:[(0.50,0.50),(0.60,0.40),(0.70,0.30)],
            3:[(0.34,0.33,0.33),(0.45,0.33,0.22),(0.55,0.30,0.15),(0.65,0.20,0.15)],
            4:[(0.25,0.25,0.25,0.25),(0.35,0.28,0.22,0.15),(0.45,0.25,0.18,0.12),(0.55,0.18,0.15,0.12)],
          }
          NEAREST_LIMIT=40
          PROFILE_VARIANTS=24

          def load(p): return json.loads(Path(p).read_text())
          def canonical_side(keys): return '|'.join(sorted(keys))
          def canonical_trade(a,b): return '||'.join(sorted((canonical_side(a),canonical_side(b))))
          def h64(s): return int(hashlib.sha256(s.encode()).hexdigest()[:16],16)
          def candidate_score(fvs):
            n=len(fvs)
            return (n**(1.0-1.0/Q))*(sum(float(v)**Q for v in fvs)**(1.0/Q))
          def verdict(a,b):
            hi=max(float(a),float(b),1.0)
            d=abs(float(a)-float(b))/hi
            if d < FAIR-1e-15: return None,d
            return ('A' if a>b else 'B'),d
          def m_from_shares(shares):
            n=len(shares)
            return (n**(1.0-1.0/Q))*(sum(float(x)**Q for x in shares)**(1.0/Q))

          b6_manifest=load(B6/'b6_screen_manifest.json')
          b6_freeze=load(B6/'b6_candidate_and_estimand_freeze.json')
          b6_supply=load(B6/'b6_discordance_generator_audit.json')
          snap=load(V7/'phase1a_player_fv_snapshot_v1.json')
          old=load(V8/'development_catalog_v1.json')
          assert b6_manifest['decision']=='PASS_PREFERRED_BURDEN_FEASIBLE'
          assert b6_supply['status']=='STOP_ZERO_DISCORDANCE_IN_AT_LEAST_ONE_TOPOLOGY_SOURCE_AUDIT'
          assert int(b6_manifest['minimum_qualifying_design']['challenges_per_topology'])==SUPPLY_TARGET
          assert len(snap['players'])==472

          # ---------------------------------------------------------------
          # PREREGISTERED B6A CONTRACT
          # ---------------------------------------------------------------
          # This is source-only challenge-supply research. It may use the
          # already-frozen B6 V9 formula and production V1.7 semantics to
          # locate disagreements, because discordance is the prospective
          # sampling frame. It may NOT read any V8 human outcomes, V8
          # candidate performance, or V9 human outcomes. It does NOT create
          # the future human catalog. It only proves (or fails to prove) that
          # enough realistic, fresh, discrete challenges exist.
          PROTOCOL={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B6A_TARGETED_DISCORDANCE_SUPPLY_AUDIT_ONLY',
            'candidate_id':b6_freeze['candidate_id'],
            'q':Q,
            'theta_min':0.60,
            'fair_band':FAIR,
            'familywise_alpha':0.05,
            'required_unique_discordant_challenges_per_topology':SUPPLY_TARGET,
            'reserve_diagnostic_target_per_topology':RESERVE_TARGET,
            'search_cap_per_topology':SEARCH_CAP,
            'source_snapshot':'research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json',
            'source_snapshot_player_count':472,
            'source_snapshot_is_pre_v8':True,
            'source_snapshot_candidate_blind':True,
            'realism_contract':{
              'minimum_player_fv':MIN_PLAYER_FV,
              'size2_minimum_player_fv':SIZE2_MIN_FV,
              'side_min_total':SIDE_MIN_TOTAL,
              'side_apex_minimum':4000,
              'minimum_asset_share':0.10,
              'minimum_raw_sum_ratio':RAW_RATIO_MIN,
              'side_profiles':SIDE_PROFILES,
              'profile_neighbor_limit':NEAREST_LIMIT,
              'deterministic_profile_variants':PROFILE_VARIANTS,
              'note':'B6A expands deterministic search breadth only; scientific candidate, fair band, theta, topology scope, and human decision rule are unchanged.',
            },
            'freshness_rule':'exclude every exact canonical trade signature already present in the V8 development catalog',
            'human_catalog_generated':False,
            'human_outcomes_read':False,
            'v8_outcomes_read':False,
            'production_change_authorized':False,
          }
          proto_bytes=(json.dumps(PROTOCOL,sort_keys=True,separators=(',',':'))+'\n').encode()
          PROTOCOL_SHA=hashlib.sha256(proto_bytes).hexdigest()
          (OUT/'b6a_preregistered_supply_protocol.json').write_text(json.dumps(PROTOCOL,indent=2,sort_keys=True)+'\n')

          # Old V8 trade signatures are used only for non-overlap exclusion.
          old_sigs=set()
          for ch in old['challenges']:
            old_sigs.add(canonical_trade([x['key'] for x in ch['side_A']['assets']],[x['key'] for x in ch['side_B']['assets']]))
          assert len(old_sigs)==int(old['challenge_count'])==40

          players=[dict(p) for p in snap['players'] if int(p['fv'])>=MIN_PLAYER_FV and p.get('pos') in {'QB','RB','WR','TE','DL','LB','DB'}]
          players.sort(key=lambda p:(int(p['fv']),p['key']))
          assert len(players)>0

          def nearest(source,desired,used):
            rows=[p for p in source if p['key'] not in used]
            rows.sort(key=lambda p:(abs(int(p['fv'])-desired),p['key']))
            return rows[:NEAREST_LIMIT]

          def make_side(rows,size):
            fvs=[int(p['fv']) for p in rows]
            total=sum(fvs)
            shares=[x/total for x in fvs]
            keys=tuple(sorted(p['key'] for p in rows))
            return {
              'keys':keys,
              'keyset':frozenset(keys),
              'raw':total,
              'score':candidate_score(fvs),
              'mult':candidate_score(fvs)/total,
              'apex':max(fvs),
              'min_fv':min(fvs),
              'min_share':min(shares),
              'signature':canonical_side(keys),
            }

          def build_pool(size):
            source=[p for p in players if size!=2 or int(p['fv'])>=SIZE2_MIN_FV]
            out={}; reject=Counter()
            for anchor in source:
              for profile in SIDE_PROFILES[size]:
                goal=int(anchor['fv'])/profile[0]
                for variant in range(PROFILE_VARIANTS):
                  chosen=[anchor]; used={anchor['key']}
                  for i in range(1,size):
                    rows=nearest(source,goal*profile[i],used)
                    if not rows:
                      chosen=[]; reject['no_nearby']+=1; break
                    # Co-prime-ish deterministic stepping expands search without randomness.
                    idx=(variant*(2*i+1)+i*7)%len(rows)
                    pick=rows[idx]
                    chosen.append(pick); used.add(pick['key'])
                  if len(chosen)!=size: continue
                  s=make_side(chosen,size)
                  if s['raw']<SIDE_MIN_TOTAL[size]: reject['side_total_below_min']+=1; continue
                  if s['apex']<4000: reject['apex_below_4000']+=1; continue
                  if s['min_share']<0.10-1e-12: reject['asset_share_below_10pct']+=1; continue
                  if size==2 and s['min_fv']<SIZE2_MIN_FV: reject['size2_below_3000']+=1; continue
                  out.setdefault(s['signature'],s)
            rows=sorted(out.values(),key=lambda s:(s['raw'],s['signature']))
            return rows,dict(reject)

          pools={}; pool_diag={}
          for n in [2,3,4]:
            pools[n],rej=build_pool(n)
            pool_diag[str(n)]={'side_count':len(pools[n]),'rejections':rej,'min_raw':min(s['raw'] for s in pools[n]),'max_raw':max(s['raw'] for s in pools[n]),'min_multiplier':min(s['mult'] for s in pools[n]),'max_multiplier':max(s['mult'] for s in pools[n])}
            assert len(pools[n])>0

          # Mathematical possibility under the broad frozen realism constraint
          # min asset share >= .10. This is deliberately separate from the
          # discrete frozen-player supply test.
          max_mult={}
          for n in [2,3,4]:
            shares=[1.0-(n-1)*0.10]+[0.10]*(n-1)
            max_mult[n]=m_from_shares(shares)
          reversal_ratio_needed=1.0/((1.0-FAIR)**2)
          structural=[]
          for topo in TOPOLOGIES:
            na,nb=map(int,topo.split('v'))
            max_ratio=max(max_mult[na],max_mult[nb])
            possible=max_ratio+1e-12>=reversal_ratio_needed
            structural.append({'topology':topo,'minimum_multiplier_ratio_for_opposite_nonfair_verdicts':reversal_ratio_needed,'maximum_theoretical_multiplier_ratio_under_min_share_0p10':max_ratio,'structurally_possible':bool(possible)})
          STRUCTURAL_ALL=all(x['structurally_possible'] for x in structural)

          def strength_bucket(x):
            if x < .10: return '7-10%'
            if x < .15: return '10-15%'
            return '15%+'

          def targeted_search(topo):
            na,nb=map(int,topo.split('v'))
            A=pools[na]; B=pools[nb]
            b_raw=np.asarray([s['raw'] for s in B],float)
            b_score=np.asarray([s['score'] for s in B],float)
            order=np.argsort(b_raw,kind='stable')
            B=[B[int(i)] for i in order]
            b_raw=b_raw[order]; b_score=b_score[order]

            # Extremal multipliers first find rare reversal geometry quickly,
            # then deterministic hash prevents profile-order artifacts.
            Aorder=sorted(A,key=lambda s:(-abs(s['mult']-1.0),h64(s['signature'])))
            found={}; old_overlap=0; shared_player_reject=0; examined_windows=0
            for a in Aorder:
              lo=np.searchsorted(b_raw,RAW_RATIO_MIN*a['raw'],side='left')
              hi=np.searchsorted(b_raw,a['raw']/RAW_RATIO_MIN,side='right')
              if hi<=lo: continue
              rr=b_raw[lo:hi]; ss=b_score[lo:hi]
              # Case 1: raw A wins non-fair, V9 B wins non-fair.
              case1=(rr <= (1.0-FAIR)*a['raw']+1e-12) & (ss >= a['score']/(1.0-FAIR)-1e-12)
              # Case 2: raw B wins non-fair, V9 A wins non-fair.
              case2=(rr >= a['raw']/(1.0-FAIR)-1e-12) & (ss <= (1.0-FAIR)*a['score']+1e-12)
              idx=np.flatnonzero(case1|case2)
              examined_windows+=1
              if idx.size==0: continue
              # Stronger disagreements first only for audit efficiency; final
              # catalog selection is NOT performed here.
              ranked=[]
              for z in idx.tolist():
                b=B[lo+int(z)]
                if a['keyset'] & b['keyset']:
                  shared_player_reject+=1; continue
                sig=canonical_trade(a['keys'],b['keys'])
                if sig in old_sigs:
                  old_overlap+=1; continue
                raw_side,raw_margin=verdict(a['raw'],b['raw'])
                v9_side,v9_margin=verdict(a['score'],b['score'])
                if raw_side is None or v9_side is None or raw_side==v9_side: continue
                quality=(-min(raw_margin,v9_margin),h64(sig))
                ranked.append((quality,b,sig,raw_side,v9_side,raw_margin,v9_margin))
              ranked.sort(key=lambda x:x[0])
              for _,b,sig,raw_side,v9_side,raw_margin,v9_margin in ranked:
                if sig in found: continue
                found[sig]={
                  'signature_hash':hashlib.sha256(sig.encode()).hexdigest(),
                  'player_keys':tuple(sorted(a['keyset']|b['keyset'])),
                  'raw_sum_ratio_min_over_max':min(a['raw'],b['raw'])/max(a['raw'],b['raw']),
                  'candidate_multiplier_ratio_max_over_min':max(a['mult'],b['mult'])/min(a['mult'],b['mult']),
                  'raw_margin':raw_margin,
                  'v9_margin':v9_margin,
                  'raw_favored':raw_side,
                  'v9_favored':v9_side,
                }
                if len(found)>=SEARCH_CAP: break
              if len(found)>=SEARCH_CAP: break
            rows=list(found.values())
            rows.sort(key=lambda r:r['signature_hash'])

            # Deterministic diversity-oriented hypothetical selection proves
            # the required 120 trades can be drawn without committing a human
            # catalog or exposing challenge identities.
            selected=[]; counts=Counter(); remaining=list(rows)
            while remaining and len(selected)<SUPPLY_TARGET:
              best_i=None;best_key=None
              for i,r in enumerate(remaining):
                pcs=[counts[k] for k in r['player_keys']]
                key=(max(pcs+[0])+1,sum(pcs),-sum(1 for k in r['player_keys'] if counts[k]==0),r['signature_hash'])
                if best_key is None or key<best_key:
                  best_key=key;best_i=i
              r=remaining.pop(best_i);selected.append(r)
              for k in r['player_keys']: counts[k]+=1
            strength=Counter(strength_bucket(min(r['raw_margin'],r['v9_margin'])) for r in rows)
            result={
              'topology':topo,
              'side_A_pool_size':len(A),
              'side_B_pool_size':len(B),
              'qualifying_unique_trade_count_lower_bound':len(rows),
              'search_capped':len(rows)>=SEARCH_CAP,
              'required_supply':SUPPLY_TARGET,
              'reserve_target':RESERVE_TARGET,
              'meets_required_supply':len(rows)>=SUPPLY_TARGET,
              'meets_reserve_target':len(rows)>=RESERVE_TARGET,
              'v8_exact_overlap_rejections':old_overlap,
              'within_trade_shared_player_rejections':shared_player_reject,
              'search_windows_examined':examined_windows,
              'discordance_strength_counts':dict(strength),
              'hypothetical_120_diversity':None,
              'planning_signature_digest':hashlib.sha256(('\n'.join(r['signature_hash'] for r in rows)).encode()).hexdigest(),
            }
            if len(selected)==SUPPLY_TARGET:
              vals=list(counts.values())
              result['hypothetical_120_diversity']={
                'distinct_players':len(counts),
                'maximum_player_appearances':max(vals),
                'median_player_appearances':float(np.median(vals)),
                'p90_player_appearances':float(np.quantile(vals,.90)),
              }
            return result

          rows=[targeted_search(t) for t in TOPOLOGIES]
          all_supply=all(r['meets_required_supply'] for r in rows)
          all_reserve=all(r['meets_reserve_target'] for r in rows)

          # The exact 30-voter / 4-challenges-per-topology assignment is
          # combinatorially feasible iff there are 120 unique challenges per
          # topology: 30 * 4 = 120, one ballot per challenge.
          assignment={
            'voters':30,
            'ballots_per_voter':24,
            'ballots_per_voter_per_topology':4,
            'unique_challenges_per_topology_required':120,
            'one_vote_per_challenge':True,
            'total_ballots':720,
            'exact_assignment_feasible_from_supply':bool(all_supply),
            'future_display_orientation':'B7 must freeze exact randomization; B6A does not assign challenge sides.',
          }

          if not STRUCTURAL_ALL:
            decision='STOP_STRUCTURAL_DISCORDANCE_IMPOSSIBLE_IN_AT_LEAST_ONE_TOPOLOGY'
          elif all_supply:
            decision='PASS_TARGETED_SOURCE_SUPPLY_FEASIBLE'
          else:
            decision='CONDITIONAL_SOURCE_SPACE_FEASIBLE_BUT_FROZEN_SNAPSHOT_SHORTFALL'

          structural_out={
            'analysis_version':VERSION,
            'status':'PASS_B6A_STRUCTURAL_FEASIBILITY_DIAGNOSTIC_ONLY' if STRUCTURAL_ALL else 'STOP_STRUCTURAL_FEASIBILITY_FAILED',
            'fair_band':FAIR,
            'raw_sum_ratio_minimum':RAW_RATIO_MIN,
            'minimum_asset_share':0.10,
            'normalized_lq_max_multiplier_by_asset_count':max_mult,
            'rows':structural,
            'all_topologies_structurally_possible':STRUCTURAL_ALL,
          }
          supply_out={
            'analysis_version':VERSION,
            'status':'PASS_B6A_DISCRETE_SUPPLY_AUDIT_ONLY',
            'source_snapshot_player_count':len(snap['players']),
            'eligible_player_count_after_minimum_fv_and_position_filters':len(players),
            'side_pool_diagnostics':pool_diag,
            'rows':rows,
            'all_topologies_meet_120_required':all_supply,
            'all_topologies_meet_240_reserve':all_reserve,
            'assignment_feasibility':assignment,
            'future_human_catalog_generated':False,
          }
          manifest={
            'analysis_version':VERSION,
            'status':'PASS_B6A_TARGETED_DISCORDANCE_SUPPLY_AND_STRUCTURAL_FEASIBILITY_AUDIT_ONLY',
            'decision':decision,
            'protocol_sha256':PROTOCOL_SHA,
            'b6_statistical_design_remains_passed':True,
            'b6_minimum_qualifying_design':b6_manifest['minimum_qualifying_design'],
            'all_topologies_structurally_possible':STRUCTURAL_ALL,
            'all_topologies_meet_required_discrete_supply':all_supply,
            'all_topologies_meet_reserve_supply':all_reserve,
            'v9_final_evaluator_frozen':False,
            'v9_human_catalog_generated':False,
            'v9_human_outcomes_exist_or_were_read':False,
            'production_change_authorized':False,
            'next_if_pass':'Run B7 independent high-rep operating-characteristic confirmation and full prospective evaluator/generator freeze. Do not generate the human catalog before B7 passes.',
            'next_if_conditional':'Do not loosen science. Run a separately preregistered candidate-blind/current-source supply expansion or explicit product-scope amendment before B7.',
            'next_if_structural_stop':'Stop this V9 discordance architecture for the affected topology; any scope or science change must be prospectively declared.',
          }

          report=[]
          report.append('# Package Adjustment V9 — B6A Targeted Discordance Supply and Structural Feasibility Audit')
          report.append('')
          report.append(f"**Decision:** `{decision}`")
          report.append('')
          report.append('B6 already showed that the topology-specific discordance test is statistically feasible. B6A asks the separate practical question: can the frozen source space actually supply 120 fresh, realistic, unique V9-vs-V1.7 disagreements per topology?')
          report.append('')
          report.append('## Frozen scientific contract')
          report.append(f'- Candidate: `{b6_freeze["candidate_id"]}`')
          report.append(f'- q: `{Q}`')
          report.append('- theta_min: `0.60`')
          report.append('- familywise alpha: `0.05` via Holm')
          report.append('- fair band: `7%`')
          report.append('- B6 preferred design: 30 voters / 720 ballots / 120 unique challenges per topology')
          report.append('')
          report.append('## Targeted discrete supply')
          report.append('| Topology | Unique discordant supply lower bound | >=120 | >=240 reserve | Distinct players in hypothetical 120 | Max appearances |')
          report.append('|---|---:|---|---|---:|---:|')
          for r in rows:
            d=r['hypothetical_120_diversity'] or {}
            label=(f">={r['qualifying_unique_trade_count_lower_bound']}" if r['search_capped'] else str(r['qualifying_unique_trade_count_lower_bound']))
            report.append(f"| {r['topology']} | {label} | {'yes' if r['meets_required_supply'] else 'no'} | {'yes' if r['meets_reserve_target'] else 'no'} | {d.get('distinct_players','—')} | {d.get('maximum_player_appearances','—')} |")
          report.append('')
          report.append('## Structural feasibility')
          for r in structural:
            report.append(f"- {r['topology']}: {'possible' if r['structurally_possible'] else 'IMPOSSIBLE'} under the broad frozen min-share geometry; max multiplier ratio {r['maximum_theoretical_multiplier_ratio_under_min_share_0p10']:.3f} vs {r['minimum_multiplier_ratio_for_opposite_nonfair_verdicts']:.3f} required.")
          report.append('')
          report.append('## Firewall')
          report.append('- No V8 human outcomes or V8 candidate performance were read.')
          report.append('- No V9 human outcomes exist or were read.')
          report.append('- No human challenge catalog was generated; only counts, hashes, and anonymous diversity diagnostics are durable.')
          report.append('- Exact V8 challenge signatures were excluded from the feasible supply.')
          report.append('- Production V1.7 remains unchanged and no production change is authorized.')

          (OUT/'b6a_structural_feasibility.json').write_text(json.dumps(structural_out,indent=2,sort_keys=True)+'\n')
          (OUT/'b6a_discrete_supply_audit.json').write_text(json.dumps(supply_out,indent=2,sort_keys=True)+'\n')
          (OUT/'b6a_supply_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          (OUT/'b6a_report.md').write_text('\n'.join(report)+'\n')

          names=['b6a_preregistered_supply_protocol.json','b6a_structural_feasibility.json','b6a_discrete_supply_audit.json','b6a_supply_manifest.json','b6a_report.md']
          hashes={n:hashlib.sha256((OUT/n).read_bytes()).hexdigest() for n in names}
          (OUT/'b6a_output_hashes.json').write_text(json.dumps({'analysis_version':VERSION,'sha256':hashes},indent=2,sort_keys=True)+'\n')

          print(json.dumps({'decision':decision,'supply':[{k:r[k] for k in ['topology','qualifying_unique_trade_count_lower_bound','search_capped','meets_required_supply','meets_reserve_target']} for r in rows]},indent=2))
          PY2

          python3 /tmp/package-adjustment-v9-b6a/analyze_b6a.py

      - name: Validate B6A firewall and durable output contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import hashlib,json
          from pathlib import Path
          out=Path('/tmp/package-adjustment-v9-b6a')
          load=lambda n: json.loads((out/n).read_text())
          p=load('b6a_preregistered_supply_protocol.json')
          s=load('b6a_structural_feasibility.json')
          d=load('b6a_discrete_supply_audit.json')
          m=load('b6a_supply_manifest.json')
          h=load('b6a_output_hashes.json')
          assert p['human_catalog_generated'] is False
          assert p['human_outcomes_read'] is False
          assert p['v8_outcomes_read'] is False
          assert p['production_change_authorized'] is False
          assert d['future_human_catalog_generated'] is False
          assert m['v9_human_catalog_generated'] is False
          assert m['v9_human_outcomes_exist_or_were_read'] is False
          assert m['production_change_authorized'] is False
          assert m['v9_final_evaluator_frozen'] is False
          assert m['decision'] in {
            'PASS_TARGETED_SOURCE_SUPPLY_FEASIBLE',
            'CONDITIONAL_SOURCE_SPACE_FEASIBLE_BUT_FROZEN_SNAPSHOT_SHORTFALL',
            'STOP_STRUCTURAL_DISCORDANCE_IMPOSSIBLE_IN_AT_LEAST_ONE_TOPOLOGY',
          }
          assert len(d['rows'])==6 and len(s['rows'])==6
          assert d['assignment_feasibility']['voters']==30
          assert d['assignment_feasibility']['unique_challenges_per_topology_required']==120
          for name,digest in h['sha256'].items():
            assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest
          print('PASS: B6A source-only firewall, decision vocabulary, supply accounting, and hashes validated.')
          PY3

      - name: Commit durable B6A planning record
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b6a-targeted-discordance-supply"
          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b6a/b6a_preregistered_supply_protocol.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6a/b6a_structural_feasibility.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6a/b6a_discrete_supply_audit.json "$DEST/"
