name: DLF Prospect FV V1 - Phase 1D Closeout Freeze
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v1-phase1d-closeout
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE1C_RUN_ID: '36088555685'
  PHASE1C_ARTIFACT_ID: '10844693746'
  PHASE1C_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1c-development
  PHASE1C_JSON_SHA256: 9a2e175e7a536912e4978ff1baa7a8518180e9757764b3442292ddecc629beec
  PHASE1C_PREDICTION_SHA256: 3337acb9e4372c789cace2e6b50fa3e8138f3171d7ce16731c985fb600df5b40
  IDENTITY_SHA256: e8d79738530a73f15de0c52990e8f7fbf1e8d4f699448add0f5add11eaa093fb
  FEATURE_SHA256: afad7d90c7dfed050186c78c270f66b89d70749e627c458575fcfffdc25543b4
jobs:
  freeze-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Guard Phase 1C workflow lineage
      shell: bash
      run: |-
        set -euo pipefail
        actual="$(git hash-object .github/workflows/DLF-Phase-1C-Historical-Incremental-Signal-V2.yml)"
        expected='8456e0efdc1a19b5f42fcc0850f482defb6cdd92'
        test "$actual" = "$expected"
        echo "PASS lineage Phase1C workflow $actual"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download exact Phase 1C development artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1C_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1c
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1C_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Freeze V1 negative result and preserve holdout
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"${RUNNER_TEMP}/dlf-phase1d\"\npython3 - <<'PY'\nfrom __future__ import annotations\n\
        import hashlib, json, os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nroot = Path(os.environ[\"\
        RUNNER_TEMP\"])\nsrc = root / \"phase1c\" / \"dlf_prospect_fv_v1_phase1c_development.json\"\nout_dir = root / \"dlf-phase1d\"\
        \nout_dir.mkdir(parents=True, exist_ok=True)\n\nEXPECTED_JSON_SHA = os.environ[\"PHASE1C_JSON_SHA256\"]\nEXPECTED_PRED_SHA\
        \ = os.environ[\"PHASE1C_PREDICTION_SHA256\"]\nEXPECTED_IDENTITY_SHA = os.environ[\"IDENTITY_SHA256\"]\nEXPECTED_FEATURE_SHA\
        \ = os.environ[\"FEATURE_SHA256\"]\n\nraw = src.read_bytes()\nactual = hashlib.sha256(raw).hexdigest()\nif actual\
        \ != EXPECTED_JSON_SHA:\n    raise RuntimeError(\n        f\"Phase 1C development artifact SHA mismatch: expected={EXPECTED_JSON_SHA}\
        \ actual={actual}\"\n    )\n\nd = json.loads(raw)\nassert d[\"decision\"] == \"STOP_NO_INCREMENTAL_DEVELOPMENT_SIGNAL\"\
        \nassert d[\"confirmation_unlock\"] is False\nassert d[\"deployment_authorized\"] is False\nassert d[\"firewalls\"\
        ][\"nfl_2025_outcomes_downloaded_or_read\"] is False\nassert d[\"firewalls\"][\"nfl_2026_outcomes_downloaded_or_read\"\
        ] is False\nassert d[\"firewalls\"][\"current_fv_read_for_selection\"] is False\nassert d[\"firewalls\"][\"ktc_read\"\
        ] is False\nassert d[\"firewalls\"][\"dlf_market_data_read\"] is False\nassert d[\"firewalls\"][\"advanced_secondary_used\"\
        ] is False\nassert d[\"lineage\"][\"mapped_identity_sha256\"] == EXPECTED_IDENTITY_SHA\nassert d[\"lineage\"][\"feature_freeze_sha256\"\
        ] == EXPECTED_FEATURE_SHA\nassert d[\"development\"][\"prediction_fingerprint_sha256\"] == EXPECTED_PRED_SHA\n\ngates\
        \ = d[\"development\"][\"gates\"]\nassert set(gates.values()) == {False}, gates\n\npooled = d[\"development\"][\"\
        pooled\"]\nbaseline_mae = float(pooled[\"baseline\"][\"mae\"])\ncandidate_mae = float(pooled[\"candidate\"][\"mae\"\
        ])\nassert candidate_mae > baseline_mae\n\nby_pos = d[\"development\"][\"by_position\"]\nassert all(\n    float(v[\"\
        candidate\"][\"mae\"]) >= float(v[\"baseline\"][\"mae\"])\n    for v in by_pos.values()\n)\n\nresult = {\n    \"schema_version\"\
        : 1,\n    \"study_id\": \"dlf-prospect-fv-v1\",\n    \"phase\": \"1D_closeout_freeze\",\n    \"decision\": \"CLOSE_DLF_PROSPECT_FV_V1_NO_INCREMENTAL_SIGNAL\"\
        ,\n    \"generated_at_utc\": datetime.now(timezone.utc).isoformat(),\n    \"lineage\": {\n        \"phase1c_run_id\"\
        : int(os.environ[\"PHASE1C_RUN_ID\"]),\n        \"phase1c_artifact_id\": int(os.environ[\"PHASE1C_ARTIFACT_ID\"]),\n\
        \        \"phase1c_json_sha256\": EXPECTED_JSON_SHA,\n        \"phase1c_prediction_fingerprint_sha256\": EXPECTED_PRED_SHA,\n\
        \        \"mapped_identity_sha256\": EXPECTED_IDENTITY_SHA,\n        \"feature_freeze_sha256\": EXPECTED_FEATURE_SHA,\n\
        \    },\n    \"frozen_finding\": {\n        \"paired_prediction_n\": d[\"development\"][\"paired_prediction_n\"],\n\
        \        \"baseline_pooled_mae\": baseline_mae,\n        \"v1_candidate_pooled_mae\": candidate_mae,\n        \"relative_improvement\"\
        : d[\"development\"][\"pooled_mae_relative_improvement\"],\n        \"paired_bootstrap\": d[\"development\"][\"paired_bootstrap\"\
        ],\n        \"heldout_year_wins\": d[\"development\"][\"heldout_year_wins\"],\n        \"positions_improved\": d[\"\
        development\"][\"positions_improved\"],\n        \"all_preregistered_gates_passed\": False,\n        \"gates\": gates,\n\
        \        \"by_position\": by_pos,\n        \"by_year\": d[\"development\"][\"by_year\"],\n    },\n    \"interpretation\"\
        : {\n        \"v1_hypothesis_rejected\": (\n            \"Basic DLF college production plus raw athletic measurements,\
        \ used as \"\n            \"a fixed additive residual-ridge correction to the existing rookie \"\n            \"baseline,\
        \ did not provide incremental historical FV signal.\"\n        ),\n        \"not_tested_by_v1\": [\n            \"\
        advanced position-specific DLF efficiency and usage metrics\",\n            \"DLF-derived player archetypes built\
        \ from transparent raw metrics\",\n            \"nonlinear interactions among frozen advanced metrics\",\n       \
        \ ],\n        \"not_authorized_for_fv\": [\n            \"DLF ADP\",\n            \"DLF rankings\",\n            \"\
        DLF trade values or trade analyzer outputs\",\n            \"DLF market sentiment\",\n            \"opaque composite\
        \ grades without a separate transparent validation study\",\n        ],\n        \"future_study_rule\": (\n      \
        \      \"Any DLF V2 is a new hypothesis. V1 thresholds/features may not be \"\n            \"retroactively altered\
        \ or rerun as confirmatory evidence. The untouched \"\n            \"2024 temporal confirmation cohort remains preserved\
        \ for a separately \"\n            \"preregistered V2 study.\"\n        ),\n    },\n    \"firewalls\": {\n       \
        \ \"2024_temporal_confirmation_opened\": False,\n        \"nfl_2025_outcomes_read\": False,\n        \"production_change_authorized\"\
        : False,\n        \"market_data_can_enter_fv\": False,\n    },\n}\n\nout_json = out_dir / \"dlf_prospect_fv_v1_phase1d_closeout.json\"\
        \nout_md = out_dir / \"dlf_prospect_fv_v1_phase1d_closeout.md\"\nout_json.write_text(json.dumps(result, indent=2,\
        \ sort_keys=True) + \"\\n\")\n\nmd = [\n    \"# DLF Prospect FV V1 \u2014 Phase 1D Closeout\",\n    \"\",\n    \"\
        **Decision:** `CLOSE_DLF_PROSPECT_FV_V1_NO_INCREMENTAL_SIGNAL`\",\n    \"\",\n    f\"- Paired development prospects:\
        \ **{result['frozen_finding']['paired_prediction_n']}**\",\n    f\"- Baseline pooled MAE: **{baseline_mae:.6f}**\"\
        ,\n    f\"- DLF V1 pooled MAE: **{candidate_mae:.6f}**\",\n    f\"- Relative MAE change: **{100*result['frozen_finding']['relative_improvement']:.2f}%**\"\
        ,\n    f\"- Held-out year wins: **{result['frozen_finding']['heldout_year_wins']}/6**\",\n    f\"- Positions improved:\
        \ **{result['frozen_finding']['positions_improved']}/4**\",\n    \"\",\n    \"All five preregistered development gates\
        \ failed. The sealed 2024 temporal \"\n    \"confirmation remained unopened, and 2025 weekly outcomes were never read.\"\
        ,\n    \"\",\n    \"## What V1 rejects\",\n    \"\",\n    \"V1 rejects the specific hypothesis that basic DLF college\
        \ production plus raw \"\n    \"athletic measurements add useful linear residual signal beyond the existing \"\n \
        \   \"rookie FV baseline.\",\n    \"\",\n    \"## What V1 did not test\",\n    \"\",\n    \"- Advanced position-specific\
        \ DLF efficiency and usage metrics\",\n    \"- Transparent archetypes derived from those raw metrics\",\n    \"- Separately\
        \ preregistered nonlinear advanced-metric interactions\",\n    \"\",\n    \"Those require a new DLF V2 study. The\
        \ 2024 temporal cohort remains untouched \"\n    \"and available as the decisive holdout.\",\n    \"\",\n    \"DLF\
        \ ADP, rankings, trade values, trade-analyzer outputs, and other market \"\n    \"sentiment remain outside Fundamental\
        \ Value.\",\n]\nout_md.write_text(\"\\n\".join(md) + \"\\n\")\n\nprint(json.dumps({\n    \"decision\": result[\"decision\"\
        ],\n    \"paired_prediction_n\": result[\"frozen_finding\"][\"paired_prediction_n\"],\n    \"baseline_mae\": baseline_mae,\n\
        \    \"v1_candidate_mae\": candidate_mae,\n    \"heldout_year_wins\": result[\"frozen_finding\"][\"heldout_year_wins\"\
        ],\n    \"positions_improved\": result[\"frozen_finding\"][\"positions_improved\"],\n    \"2024_confirmation_opened\"\
        : False,\n    \"nfl_2025_outcomes_read\": False,\n    \"v2_allowed_as_new_hypothesis\": True,\n}, indent=2))\nPY"
    - name: Prove closeout made no repository changes
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: V1 closeout is research-only and repo-clean.'
    - name: Upload V1 closeout
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1d-closeout
        path: ${{ runner.temp }}/dlf-phase1d/
        if-no-files-found: error
        retention-days: 30
