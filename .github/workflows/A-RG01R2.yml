name: A - RG01R2 Regression Repair

# A narrowly scoped identity-display repair for the regression audit.
# PREVIEW proves the live Sleeper audit and the full repository regression suite.
# APPLY commits only the audited alias source, refreshed audit, successor-lineage guard, and CI workflow.
# This workflow must not reprice players or change the production calculator.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first; APPLY only after green
        required: true
        type: choice
        default: PREVIEW
        options:
          - PREVIEW
          - APPLY

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  guarded-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPAIR_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Guard baseline and apply ID-specific audit patch locally
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import json

          src_path = Path('scripts/validation/dual_eligibility_pipeline.py')
          audit_path = Path('scripts/artifacts/generated/dual_eligibility_results.json')
          source = src_path.read_text(encoding='utf-8')
          historical = json.loads(audit_path.read_text(encoding='utf-8'))
          assert isinstance(historical, list) and len(historical) >= 250

          # The current regression is that the previously audited SID 12585
          # disappeared following Sleeper's display-name suffix change.
          assert 'james pearce' not in {
              r.get('player') for r in historical
              if r.get('current_position_is_eligible') is False
          }, 'Already repaired: audit contains the James Pearce mismatch'
          assert 'travis hunter' in {
              r.get('player') for r in historical
              if r.get('current_position_is_eligible') is False
          }, 'Historical Travis Hunter control missing; stop for review'
          assert "'james pearce':{pos:'LB'" in Path('index.html').read_text(encoding='utf-8'), (
              'Model position changed; stop before using old mismatch expectation'
          )

          anchor = '\ndef eligible_buckets(fantasy_positions):\n'
          assert source.count(anchor) == 1, 'Source contract changed: helper anchor'
          helper = '''
          # Audited, ID-specific display-name bridge. The source's stable Sleeper ID
          # 12585 was previously "James Pearce" and is now "James Pearce Jr".
          # Do not strip suffixes globally or merge other people by name.
          def audited_trade_desk_name(sleeper_id, source_name):
              key = normalize_name(source_name)
              if str(sleeper_id) == "12585" and key == "james pearce jr":
                  return "james pearce"
              return key
          
          '''
          source = source.replace(anchor, '\n' + helper + 'def eligible_buckets(fantasy_positions):\n')

          # The collision pre-scan also needs the Sleeper ID. RG01 changed
          # its lookup to use `pid` but left this first loop over values() --
          # hence the UnboundLocalError before its synthetic self-test ran.
          pre_scan = '    for p in player_index.values():\n'
          assert source.count(pre_scan) == 1, 'Source contract changed: collision pre-scan'
          source = source.replace(
              pre_scan,
              '    for pid, p in player_index.items():\n',
              1,
          )
          assert source.count('    for pid, p in player_index.items():\n') == 2, (
              'Expected both collision pre-scan and player processing to have Sleeper IDs'
          )
          exact_lookup = 'key = normalize_name(name)'
          assert source.count(exact_lookup) == 2, 'Source contract changed: lookup sites'
          source = source.replace(exact_lookup, 'key = audited_trade_desk_name(pid, name)')
          assert source.count('key = audited_trade_desk_name(pid, name)') == 2

          marker = '    print("dual_eligibility_pipeline self-test passed.")'
          assert source.count(marker) == 1, 'Source contract changed: selftest marker'
          extra_tests = '''    # Regression: the same audited Sleeper ID now includes a Jr suffix.
              pearce = analyze_player_index({
                  "12585": {"full_name": "James Pearce Jr", "team": "ATL",
                            "position": "DL", "fantasy_positions": ["DL"]},
              }, {"james pearce": "LB"})
              assert len(pearce) == 1, pearce
              assert pearce[0]["sleeper_id"] == "12585"
              assert pearce[0]["player"] == "james pearce"
              assert pearce[0]["current_position_is_eligible"] is False
              assert pearce[0]["eligible_buckets"] == ["DL"]
              # No generic suffix removal or ID substitution is allowed.
              unrelated = analyze_player_index({
                  "99999": {"full_name": "James Pearce Jr", "team": "ATL",
                            "position": "DL", "fantasy_positions": ["DL"]},
              }, {"james pearce": "LB"})
              assert unrelated == [], unrelated
              # Two individuals sharing a canonical name must not be collapsed.
              collision = analyze_player_index({
                  "12585": {"full_name": "James Pearce Jr", "team": "ATL",
                            "position": "DL", "fantasy_positions": ["DL"]},
                  "99999": {"full_name": "James Pearce", "team": "ATL",
                            "position": "DL", "fantasy_positions": ["DL"]},
              }, {"james pearce": "LB"})
              assert collision == [], collision
          '''
          source = source.replace(marker, extra_tests + '\n' + marker)
          compile(source, str(src_path), 'exec')
          src_path.write_text(source, encoding='utf-8')
          print('PASS: SID 12585 alias and both ID-aware lookup loops patched; model and pricing unchanged')
          PY_PATCH
          python3 scripts/validation/dual_eligibility_pipeline.py --selftest

      - name: Replace obsolete live-hash IDP gate with frozen-release lineage proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CI_PATCH'
          from pathlib import Path
          target=Path('.github/workflows/repo-regression-checks.yml')
          old=target.read_text(encoding='utf-8')
          needle="      - name: Validate deployed IDP V1\n        run: python3 scripts/validation/validate_idp_v1_final_deployment.py\n"
          replacement="      - name: Validate frozen IDP V1 and approved successor lineage\n        run: python3 scripts/validation/validate_idp_successor_lineage.py\n"
          assert old.count(needle)==1, 'CI workflow changed; require fresh audit'
          target.write_text(old.replace(needle,replacement),encoding='utf-8')
          assert target.read_text().count('validate_idp_successor_lineage.py')==1
          print('PASS: retired stale live-CAL02 hash check, replaced with immutable release integrity audit')
          PY_CI_PATCH
          mkdir -p scripts/validation
          cat > scripts/validation/validate_idp_successor_lineage.py <<'PY_RELEASE_GUARD'
          #!/usr/bin/env python3
          """Successor-aware historical IDP release-integrity audit.
          
          This validates frozen V1/CAL02/CAL15/CAL22 evidence and the current
          canonical value population without requiring later approved production
          multipliers to equal a prior release's deployed-table SHA.
          
          For frozen IDP V1 model-delta and exact-preservation invariants, the
          adjacent repo_regression_checks.py suite is also required by CI.
          """
          from __future__ import annotations
          
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path
          
          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT / "scripts" / "validation"))
          import snapshot_values  # noqa: E402
          
          
          def doc(path: str):
              return json.loads((ROOT / path).read_text(encoding="utf-8"))
          
          
          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def require_digest(value: str, label: str) -> None:
              assert isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value), label
          
          
          def run():
              # Immutable original IDP V1 evidence, never regenerated from current sources.
              baseline = doc("model/releases/idp-v1/prod_mult_pre_v1_baseline.json")
              patch = doc("model/releases/idp-v1/idp_v1_prod_mult_patch.json")
              bridge = doc("model/releases/idp-v1/idp_v1_model_delta_transport_candidate.json")
              assert baseline["entry_count"] == len(baseline["values"]) == 823
              assert len(bridge["players"]) == 404
              assert patch["changed_entry_count"] == len(patch["entries"])
              assert len({row["key"] for row in patch["entries"]}) == len(patch["entries"])
              assert all(row["key"] in baseline["values"] for row in patch["entries"])
          
              # CAL02 is an immutable historical layer; its deployed SHA is NOT
              # the expected SHA for today's later CAL15/CAL22/CAL26 model.
              cal02 = doc("model/releases/cal02-dl-residual-reset-v1/release.json")
              assert cal02["release_id"] == "cal02-migrated-dl-lineage-residual-reset-v1"
              assert cal02["scope"]["old_releases_rewritten"] is False
              assert cal02["scope"]["market_method_changed"] is False
              frozen_path = ROOT / cal02["frozen_candidate_path"]
              assert frozen_path.is_file(), "Missing original CAL02 frozen candidate"
              assert sha(frozen_path) == cal02["frozen_candidate_sha256"], "CAL02 frozen candidate SHA drift"
              frozen = json.loads(frozen_path.read_text(encoding="utf-8"))
              assert set(cal02["players"]) == set(frozen["players"])
              assert len(cal02["players"]) == 21
              for key, record in cal02["players"].items():
                  f = frozen["players"][key]
                  assert f["position"] == "DL", (key, "CAL02 position drift")
                  assert abs(float(record["old_raw_prod_mult"]) - float(f["control"]["raw_prod_mult"])) < 1e-10, key
                  assert abs(float(record["new_raw_prod_mult"]) - float(f["c0_reset"]["raw_prod_mult"])) < 1e-10, key
              for name in ("deployed_prod_mult_canonical_sha256", "legacy_prod_mult_canonical_sha256"):
                  require_digest(cal02[name], name)
          
              # Approved later history is checked for its own immutable shape and
              # provenance, without claiming its once-live digest is the current digest.
              cal15 = doc("model/releases/cal15-idp-2026-horizon-bounded-v1/release.json")
              assert cal15["release_id"] == "cal15-idp-2026-horizon-bounded-v1"
              assert cal15["changed_players"] == len(cal15["changed_rows"]) == 175
              assert len({r["player"] for r in cal15["changed_rows"]}) == 175
              assert all(r["player"] in baseline["values"] for r in cal15["changed_rows"])
              for name in ("base_index_sha256", "candidate_index_sha256"):
                  require_digest(cal15[name], name)
              assert cal15["base_index_sha256"] != cal15["candidate_index_sha256"]
          
              cal22 = doc("model/releases/cal22-legacy-048-raw-floor-continuity-v1/release.json")
              assert cal22["release_id"] == "cal22-legacy-048-raw-floor-continuity-v1"
              assert cal22["guard_key_count"] == len(set(cal22["frozen_keys"])) == 48
              assert cal22["no_current_price_changes"] is True
              assert cal22["market_value_untouched"] is True
              for name in ("base_index_sha256", "candidate_index_sha256"):
                  require_digest(cal22[name], name)
          
              cfg = snapshot_values.load_from_html(ROOT / "index.html")
              values = snapshot_values.compute_all_values(cfg)
              assert len(values) == len(cfg["player_db"]) == 565
              assert set(cal22["frozen_keys"]) <= set(cfg["player_db"])
              assert set(cfg["prod_mult"]) == set(baseline["values"]), "PROD_MULT key population unexpectedly changed"
              print("PASS historical IDP V1 frozen original: 823 multipliers, 404 candidate IDPs")
              print("PASS CAL02 frozen SHA and 21 historical reset rows (without comparing to later live hash)")
              print("PASS CAL15 175 historical successor rows; CAL22 48 immutable no-repricing guards")
              print("PASS current canonical FV population: 565; no production mutation")
          
          
          if __name__ == "__main__":
              run()
          PY_RELEASE_GUARD
          python3 -m py_compile scripts/validation/validate_idp_successor_lineage.py
          python3 scripts/validation/validate_idp_successor_lineage.py

      - name: Refresh live Sleeper audit and assert both mismatch controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/dual_eligibility_pipeline.py
          python3 - <<'PY_AUDIT'
          import json
          from pathlib import Path
          rows=json.loads(Path('scripts/artifacts/generated/dual_eligibility_results.json').read_text())
          assert isinstance(rows,list) and len(rows)>=250, len(rows)
          keys=[(str(r.get('sleeper_id')),r.get('player')) for r in rows]
          assert len(set(keys))==len(keys), 'Duplicate identity rows in refreshed audit'
          mismatch={r.get('player'):r for r in rows if r.get('current_position_is_eligible') is False}
          assert 'james pearce' in mismatch, f'James Pearce missing: {sorted(mismatch)}'
          jp=mismatch['james pearce']
          assert str(jp['sleeper_id'])=='12585', jp
          assert jp['current_trade_desk_position']=='LB', jp
          assert jp['eligible_buckets']==['DL'], jp
          assert jp['team']=='ATL', jp
          assert 'travis hunter' in mismatch, f'Travis Hunter control missing: {sorted(mismatch)}'
          assert all('recommended_bucket' not in r for r in rows), 'Retired economic recommendation returned'
          print('PASS: current Sleeper SID 12585 maps to model James Pearce; DL-only vs model LB remains flagged')
          print('PASS: Travis Hunter review retained; refreshed audit rows=',len(rows))
          PY_AUDIT

      - name: Run full regression suite and downstream checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maintenance/refresh_repo_derived_state.py --check
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/repo_regression_checks.py
          node scripts/validation/role_band_inline_regression.js
          python3 scripts/validation/validate_idp_successor_lineage.py
          python3 - <<'PY_JS'
          import os,re,pathlib,subprocess,tempfile
          for filename in ('index.html','free-agent-board.html'):
              source=pathlib.Path(filename).read_text(encoding='utf-8')
              parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',source,re.S|re.I)
              fd,path=tempfile.mkstemp(suffix='.js');os.close(fd)
              try:
                  pathlib.Path(path).write_text('\n'.join(parts),encoding='utf-8')
                  subprocess.run(['node','--check',path],check=True)
              finally:
                  pathlib.Path(path).unlink(missing_ok=True)
              print('PASS inline JS:',filename)
          PY_JS

      - name: Execute actual repo CI self-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/snapshot_values.py --selftest
          python3 scripts/validation/build_value_uncertainty.py --selftest
          python3 scripts/market/build_market_value.py --selftest
          python3 scripts/validation/capture_model_history.py --selftest
          python3 scripts/validation/capture_realized_outcomes.py --selftest
          python3 scripts/validation/evaluate_model_history.py --selftest
          python3 scripts/validation/evaluate_market_history.py --selftest
          python3 scripts/sync/sync_sleeper.py --selftest
          python3 scripts/validation/dual_eligibility_pipeline.py --selftest
          python3 scripts/maintenance/team_field_refresh_pipeline.py --selftest
          python3 scripts/utilities/generate_player_positions.py --selftest
          python3 scripts/sync/sync_free_agent_valuation.py --selftest
          python3 scripts/maintenance/refresh_repo_derived_state.py --selftest
          python3 scripts/projections/filter_sleeper_idp_only.py --selftest
          python3 scripts/projections/sleeper_projections_pipeline.py --selftest
          python3 scripts/market/draft_slot_projection_pipeline.py --selftest

      - name: Enforce strictly scoped regression-repair changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SCOPE'
          import subprocess
          permitted={
             'scripts/validation/dual_eligibility_pipeline.py',
             'scripts/artifacts/generated/dual_eligibility_results.json',
             'scripts/validation/validate_idp_successor_lineage.py',
             '.github/workflows/repo-regression-checks.yml',
          }
          result=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True)
          changed={line[3:] for line in result.splitlines() if line.strip()}
          assert changed==permitted, f'Unexpected working tree changes: {sorted(changed)}'
          print('PASS source scope:',sorted(changed))
          PY_SCOPE
          git diff --exit-code -- index.html free-agent-board.html \
            scripts/validation/repo_regression_checks.py \
            scripts/validation/capture_realized_outcomes.py \
            scripts/validation/build_value_uncertainty.py \
            scripts/validation/validate_idp_v1_final_deployment.py

      - name: APPLY audited alias and successor-aware CI guard
        if: env.REPAIR_MODE == 'APPLY'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- scripts/validation/dual_eligibility_pipeline.py \
            scripts/artifacts/generated/dual_eligibility_results.json \
            scripts/validation/validate_idp_successor_lineage.py \
            .github/workflows/repo-regression-checks.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No change to commit'; exit 1; }
          git commit -m 'RG01R2: repair Pearce ID audit and successor-aware regression lineage'
          git push origin HEAD:main
          echo 'PASS APPLY: exact four-file alias and successor-aware CI repair committed.' >> "$GITHUB_STEP_SUMMARY"

      - name: PREVIEW report
        if: env.REPAIR_MODE == 'PREVIEW'
        run: |
          echo 'PASS PREVIEW: James Pearce alias, full regression suite, and successor IDP release guard validated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No files committed; rerun APPLY after review.' >> "$GITHUB_STEP_SUMMARY"
