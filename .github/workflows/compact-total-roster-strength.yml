name: Compact Total Roster Strength

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked live Trade Desk
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_INDEX_BLOB="bc7dda20fec3bb5ea45364ad270ea6d6da49a173"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"

          echo "Expected index.html blob: $EXPECTED_INDEX_BLOB"
          echo "Actual index.html blob:   $ACTUAL_INDEX_BLOB"

          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-pre-compact-roster-strength-v1
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Compact Total Roster Strength UI
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "COMPACT_ROSTER_STRENGTH_UI_V1"

          if marker in text:
              raise SystemExit(
                  f"{marker} already present; refusing to double-apply."
              )

          required = [
              '<div class="section-label" style="margin-top:20px;">Total Roster Strength</div>',
              'id="rosterStrengthWrap"',
              "function renderRosterStrength()",
              "function toggleRosterStrengthTeam(rosterId)",
          ]

          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Total Roster Strength structure changed; missing: "
                  + ", ".join(missing)
              )

          # Preserve every pre-existing script block byte-for-byte.
          original_scripts = re.findall(
              r"<script(?:\s[^>]*)?>.*?</script>",
              text,
              flags=re.S | re.I,
          )

          css = r'''
          <style id="compact-roster-strength-styles">
          /* COMPACT_ROSTER_STRENGTH_UI_V1
             Presentation only. Ranking, totals and expansion logic remain
             the existing production implementation. */

          .ui2-roster-strength-shell{
            margin-top:18px;
            border:1px solid var(--line);
            border-radius:12px;
            background:var(--panel);
            box-shadow:var(--ui2-soft-shadow);
            overflow:hidden;
          }

          .ui2-roster-strength-shell > summary{
            position:relative;
            min-height:58px;
            display:grid;
            align-items:center;
            gap:3px;
            padding:11px 44px 11px 14px;
            list-style:none;
            cursor:pointer;
            user-select:none;
          }

          .ui2-roster-strength-shell > summary::-webkit-details-marker{
            display:none;
          }

          .ui2-roster-strength-shell > summary::after{
            content:'+';
            position:absolute;
            right:16px;
            top:50%;
            transform:translateY(-50%);
            color:var(--text-dim);
            font-size:20px;
            font-weight:400;
          }

          .ui2-roster-strength-shell[open] > summary::after{
            content:'−';
            color:var(--gold);
          }

          .ui2-roster-strength-shell[open] > summary{
            border-bottom:1px solid var(--line);
          }

          .ui2-roster-strength-title{
            color:var(--text);
            font-family:'Inter',sans-serif;
            font-size:12px;
            font-weight:800;
            letter-spacing:.025em;
            text-transform:uppercase;
          }

          .ui2-roster-strength-sub{
            color:var(--text-dim);
            font-family:'IBM Plex Mono',monospace;
            font-size:8.5px;
            line-height:1.3;
            letter-spacing:.04em;
          }

          .ui2-roster-strength-shell > .section-label{
            display:none!important;
          }

          .ui2-roster-strength-shell #rosterStrengthWrap{
            display:grid;
            gap:6px;
            padding:8px 10px 10px;
          }

          .ui2-roster-strength-shell #rosterStrengthWrap > .need-cell{
            padding:7px 9px!important;
            border-radius:8px!important;
          }

          .ui2-roster-strength-shell #rosterStrengthWrap > .need-cell > div:first-child{
            margin-bottom:3px!important;
          }

          .ui2-roster-strength-shell #rosterStrengthWrap > .need-cell > div:first-child > div{
            font-size:12px!important;
          }

          .ui2-roster-strength-shell #rosterStrengthWrap > .need-cell > div:nth-child(2){
            height:5px!important;
          }

          .ui2-roster-strength-shell #rosterStrengthWrap > .need-cell > div:last-child{
            margin-top:2px!important;
            font-size:8px!important;
          }

          @media(max-width:720px){
            .ui2-roster-strength-shell{
              margin-top:10px;
            }

            .ui2-roster-strength-shell > summary{
              min-height:54px;
              padding:10px 42px 10px 13px;
            }

            .ui2-roster-strength-shell #rosterStrengthWrap{
              gap:5px;
              padding:7px 8px 8px;
            }

            .ui2-roster-strength-shell #rosterStrengthWrap > .need-cell{
              padding:6px 8px!important;
            }
          }
          </style>
          '''

          js = r'''
          <script id="compact-roster-strength-runtime">
          /* COMPACT_ROSTER_STRENGTH_UI_V1 — presentation only. */
          (function () {
            'use strict';

            function init() {
              if (
                document.documentElement.dataset.compactRosterStrength === '1'
              ) return;

              document.documentElement.dataset.compactRosterStrength = '1';

              const wrap = document.getElementById('rosterStrengthWrap');
              if (!wrap) {
                console.error(
                  'Compact roster strength: #rosterStrengthWrap missing.'
                );
                return;
              }

              let label = wrap.previousElementSibling;

              if (
                !label ||
                !label.classList.contains('section-label') ||
                !/Total Roster Strength/i.test(label.textContent || '')
              ) {
                label = Array.from(
                  document.querySelectorAll('.section-label')
                ).find(node =>
                  /Total Roster Strength/i.test(node.textContent || '')
                ) || null;
              }

              if (!label) {
                console.error(
                  'Compact roster strength: section label missing.'
                );
                return;
              }

              if (wrap.closest('.ui2-roster-strength-shell')) return;

              const shell = document.createElement('details');
              shell.className = 'ui2-roster-strength-shell';

              const summary = document.createElement('summary');
              summary.innerHTML =
                '<span class="ui2-roster-strength-title">' +
                  'Total Roster Strength' +
                '</span>' +
                '<span class="ui2-roster-strength-sub">' +
                  'League rankings · tap to view all teams' +
                '</span>';

              label.parentNode.insertBefore(shell, label);
              shell.appendChild(summary);
              shell.appendChild(label);
              shell.appendChild(wrap);
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded',
                init,
                { once:true }
              );
            } else {
              init();
            }
          })();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text or "</body>" not in text:
              raise RuntimeError("index.html missing closing head/body tags")

          text = text.replace("</head>", css + "\n</head>", 1)
          text = text.replace("</body>", js + "\n</body>", 1)

          # All original scripts must still exist byte-for-byte after this
          # presentation-only addition.
          missing_scripts = [
              i for i, block in enumerate(original_scripts)
              if block not in text
          ]

          if missing_scripts:
              raise RuntimeError(
                  "Existing production script blocks changed: "
                  + str(missing_scripts)
              )

          if text.count(marker) != 2:
              raise RuntimeError(
                  f"Unexpected {marker} count: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")

          print(
              f"PASS preserved {len(original_scripts)} production "
              "script blocks byte-for-byte"
          )
          print("PASS compact Total Roster Strength UI appended")
          PY

      - name: Validate compact UI JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          match = re.search(
              r'<script id="compact-roster-strength-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )

          if not match:
              raise SystemExit("Compact roster-strength runtime missing")

          css = re.search(
              r'<style id="compact-roster-strength-styles">(.*?)</style>',
              html,
              flags=re.S,
          )

          if not css:
              raise SystemExit("Compact roster-strength styles missing")

          required = [
              "ui2-roster-strength-shell",
              "Total Roster Strength",
              "rosterStrengthWrap",
          ]

          missing = [
              token for token in required
              if token not in match.group(1) and token not in css.group(1)
          ]

          if missing:
              raise SystemExit(f"Compact UI missing: {missing}")

          for label, block in [
              ("CSS", css.group(1)),
              ("JS", match.group(1)),
          ]:
              bad = [
                  i for i, line in enumerate(block.splitlines(), 1)
                  if line != line.rstrip()
              ]
              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at lines {bad[:10]}"
                  )
              print(f"PASS {label} whitespace")

          out = Path("/tmp/compact-roster-strength.js")
          out.write_text(match.group(1), encoding="utf-8")
          print(out)
          PY

          node --check /tmp/compact-roster-strength.js

      - name: Validate existing runtime self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Commit compact roster strength
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "index.html"

          if git diff --cached --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi

          git commit -m "Compact Total Roster Strength"
          git push origin HEAD:main
