name: Package Adjustment NextGen V2 Correct Sampling Contract

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install regression dependency
        run: python3 -m pip install requests

      - name: Guard exact flawed activation state
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object index.html)" = "9fb40880ac165032879d37ec319bc81093696578"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = "01e2672c736b1258029d572f325f182ee2c2888d"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = "4ba63030d751f0e790f7e4e10ce9296e03482d61"
          test "$(git hash-object "$D/voting_activation_manifest.json")" = "6e9faf81e7ee186f770d0629164a269b6c51da58"

          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"
          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"

          test ! -e "$D/voting_sampling_correction_manifest.json"
          test ! -e "$D/voting_sampling_correction.md"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          activation = json.loads((d / "voting_activation_manifest.json").read_text())
          maturity = json.loads((d / "evidence_maturity_plan.json").read_text())

          assert activation["released_at_utc"] == "2026-09-11T14:15:44.570861+00:00"
          assert activation["voting_activated"] is True
          assert activation["production_formula_changed"] is False
          assert "exclude challenges containing a player" in activation["sampling"]["self_interest_filter"]
          assert maturity["sampling"]["schedule_id"] == "equal_cell_via_family_weights_v1"
          assert abs(maturity["sampling"]["cell_probability"] - 1/24) < 1e-15

          index = Path("index.html").read_text()
          start = index.index("function packageVoteTodayKey(){")
          end = index.index("\nfunction render(){", start)
          block = index[start:end]
          assert "function packageVoteOwnPlayers()" in block
          assert "function packageVoteEligibleChallenges()" in block
          assert "own.has(" in block
          print("PASS: exact sampling defect reproduced before correction.")
          PY

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify production before correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Audit pre-correction transport volume without outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          import os
          from datetime import datetime, timezone
          import requests

          url = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )
          vote_prefix = "__pkg" + "nv2__|"
          initial_release = datetime.fromisoformat("2026-09-11T14:15:44.570861+00:00")

          response = requests.get(url, timeout=30)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          count = 0
          invalid_timestamp = 0
          for row in rows:
              if not str(row.get("keep") or "").startswith(vote_prefix):
                  continue
              raw = str(row.get("timestamp") or "").strip()
              if raw.endswith("Z"):
                  raw = raw[:-1] + "+00:00"
              try:
                  ts = datetime.fromisoformat(raw)
                  if ts.tzinfo is None:
                      ts = ts.replace(tzinfo=timezone.utc)
                  ts = ts.astimezone(timezone.utc)
              except ValueError:
                  invalid_timestamp += 1
                  continue
              if ts > initial_release:
                  count += 1

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PRE_CORRECTION_TRANSPORT_ROWS={count}\n")
              f.write(f"PRE_CORRECTION_INVALID_TIMESTAMPS={invalid_timestamp}\n")

          print("Outcome-blind pre-correction NextGen transport row count:", count)
          print("Outcome-blind invalid timestamp count:", invalid_timestamp)
          PY

      - name: Set conservative corrected valid-ballot cutoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          valid_after = now + timedelta(minutes=10)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"CORRECTION_RECORDED_AT_UTC={now.isoformat()}\n")
              f.write(f"CORRECTED_VALID_BALLOT_START_UTC={valid_after.isoformat()}\n")
          print("Correction recorded at:", now.isoformat())
          print("Valid NextGen ballot collection begins at:", valid_after.isoformat())
          PY

      - name: Patch exact family-cell sampling contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          valid_after = os.environ["CORRECTED_VALID_BALLOT_START_UTC"]

          header_token = "const PACKAGE_VOTE_RECENT_MEMORY = 20;"
          if text.count(header_token) != 1:
              raise RuntimeError(f"header token count={text.count(header_token)}")
          text = text.replace(
              header_token,
              header_token + f"\nconst PACKAGE_VOTE_VALID_AFTER_UTC = '{valid_after}';",
              1,
          )

          start = text.index("function packageVoteOwnPlayers(){")
          end = text.index("function packageVoteEnsureLoaded(){", start)

          corrected = r"""/* PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2
             Frozen schedule is unconditional with respect to voter roster:
             family -> exact experimental cell -> challenge within that cell.
             Recent-memory is applied only AFTER the cell is selected, so it
             cannot alter family or cell probability. Vote outcomes never
             affect sampling. */
          function packageVoteWeightedFamily(families){
            let total = 0;
            for(const family of families) total += Number(PACKAGE_VOTE_FAMILY_WEIGHTS[family] || 0);
            if(total <= 0) return null;
            let draw = Math.random() * total;
            for(const family of families){
              draw -= Number(PACKAGE_VOTE_FAMILY_WEIGHTS[family] || 0);
              if(draw <= 0) return family;
            }
            return families[families.length - 1] || null;
          }

          function packageVoteSelectChallenge(){
            if(!PACKAGE_VOTE_CHALLENGES || !PACKAGE_VOTE_CHALLENGES.length) return null;

            const byFamily = new Map();
            for(const c of PACKAGE_VOTE_CHALLENGES){
              if(!Object.prototype.hasOwnProperty.call(PACKAGE_VOTE_FAMILY_WEIGHTS, c.family)) continue;
              if(!byFamily.has(c.family)) byFamily.set(c.family, []);
              byFamily.get(c.family).push(c);
            }

            const families = Array.from(byFamily.keys()).sort();
            const family = packageVoteWeightedFamily(families);
            if(!family) return null;

            const familyPool = byFamily.get(family);
            const byCell = new Map();
            for(const c of familyPool){
              const cellKey = `${c.family}|${c.cell_id}|${c.scale_label}|${c.split}`;
              if(!byCell.has(cellKey)) byCell.set(cellKey, []);
              byCell.get(cellKey).push(c);
            }

            const cells = Array.from(byCell.keys()).sort();
            if(!cells.length) return null;
            const selectedCellKey = cells[Math.floor(Math.random() * cells.length)];
            const cellPool = byCell.get(selectedCellKey);

            const recent = new Set(packageVoteRecent());
            let challengePool = cellPool.filter(c => !recent.has(c.id));
            if(!challengePool.length) challengePool = cellPool;

            const challenge = challengePool[Math.floor(Math.random() * challengePool.length)];
            return { challenge, left: Math.random() < 0.5 ? 'A' : 'B' };
          }

          """
          text = text[:start] + corrected + text[end:]

          submit_fn = "function packageVoteSubmit(displaySide){"
          submit_guard = "if(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;"
          submit_start = text.index(submit_fn)
          guard_pos = text.index(submit_guard, submit_start)
          submit_end = text.index("\n}", submit_start)
          if not (submit_start < guard_pos < submit_end):
              raise RuntimeError("submit guard is outside packageVoteSubmit")
          cutoff_guard = "if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)) return;\n"
          if cutoff_guard in text[submit_start:submit_end]:
              raise RuntimeError("submit cutoff guard already present unexpectedly")
          text = text[:guard_pos] + cutoff_guard + text[guard_pos:]

          old_copy = "League members: choose your team above so challenges avoid your roster. Everyone else can vote as a guest."
          new_copy = "League members: choose your team above to use your league voter identity. Everyone else can vote as a guest."
          if text.count(old_copy) != 1:
              raise RuntimeError("package vote access copy anchor changed")
          text = text.replace(old_copy, new_copy, 1)

          render_fn = "function renderPackageVote(){"
          daily_gate = "if(packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT){"
          render_start = text.index(render_fn)
          daily_pos = text.index(daily_gate, render_start)
          render_end = text.index("\nfunction render(){", render_start)
          if not (render_start < daily_pos < render_end):
              raise RuntimeError("daily package-vote gate is outside renderPackageVote")
          render_cutoff = (
              "if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)){\n"
              "el.innerHTML = `<div style=\"color:var(--text-dim);font-size:13px;padding:8px 0;\">\n"
              "NextGen research sampling was corrected before evidence collection. "
              "Valid voting opens at ${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.\n"
              "</div>`;\n"
              "return;\n"
              "}\n\n"
          )
          if "Valid voting opens at" in text[render_start:render_end]:
              raise RuntimeError("render cutoff already present unexpectedly")
          text = text[:daily_pos] + render_cutoff + text[daily_pos:]

          path.write_text(text, encoding="utf-8")
          print("PASS: exact unconditional family/cell sampling patched.")
          PY

      - name: Add permanent sampling-contract regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validation/repo_regression_checks.py")
          text = path.read_text(encoding="utf-8")

          marker = "\ndef check_index_js_syntax():\n"
          if text.count(marker) != 1:
              raise RuntimeError("index syntax regression insertion anchor changed")

          new_check = r"""
          def check_nextgen_package_sampling_contract():
              text = INDEX.read_text(encoding="utf-8")
              start = text.index("function packageVoteTodayKey(){")
              end = text.index("\nfunction render(){", start)
              block = text[start:end]

              assert "PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2" in block
              assert "function packageVoteOwnPlayers()" not in block
              assert "function packageVoteEligibleChallenges()" not in block
              assert "own.has(" not in block
              assert "const byFamily = new Map();" in block
              assert "const cellKey = `${c.family}|${c.cell_id}|${c.scale_label}|${c.split}`;" in block
              assert "const selectedCellKey = cells[Math.floor(Math.random() * cells.length)];" in block
              assert "let challengePool = cellPool.filter(c => !recent.has(c.id));" in block
              assert "if(!challengePool.length) challengePool = cellPool;" in block
              assert "left: Math.random() < 0.5 ? 'A' : 'B'" in block
              assert "Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)" in block

              cell_idx = block.index("const selectedCellKey =")
              recent_idx = block.index("const recent = new Set(packageVoteRecent());")
              assert cell_idx < recent_idx, "recent filtering must occur only after cell selection"

              assert "core_concentration_2v2: 0.625" in text
              assert "fragmentation_filler: 0.125" in text
              assert "structural_topology_3v3: 0.25" in text

              print("PASS NextGen V2 exact family/cell sampling contract: no voter-roster filtering; recent-memory post-cell only")

          """
          text = text.replace(marker, "\n" + new_check + "def check_index_js_syntax():\n", 1)

          old_list = "        check_package_adjustment_live.validate,\n        check_index_js_syntax,"
          new_list = "        check_package_adjustment_live.validate,\n        check_nextgen_package_sampling_contract,\n        check_index_js_syntax,"
          if text.count(old_list) != 1:
              raise RuntimeError(f"regression main-list anchor count={text.count(old_list)}")
          text = text.replace(old_list, new_list, 1)

          path.write_text(text, encoding="utf-8")
          print("PASS: permanent NextGen sampling-contract regression added.")
          PY

      - name: Create correction provenance records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import textwrap
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          manifest_path = d / "voting_sampling_correction_manifest.json"
          md_path = d / "voting_sampling_correction.md"

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          observed = int(os.environ["PRE_CORRECTION_TRANSPORT_ROWS"])
          invalid_ts = int(os.environ["PRE_CORRECTION_INVALID_TIMESTAMPS"])
          valid_start = os.environ["CORRECTED_VALID_BALLOT_START_UTC"]
          recorded = os.environ["CORRECTION_RECORDED_AT_UTC"]

          manifest = {
              "schema_version": 1,
              "status": "nextgen_v2_sampling_contract_corrected_before_valid_evidence",
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_change_allowed": False,
              "production_formula_changed": False,
              "original_activation": {
                  "commit_sha": "8c8f6ad829e7d8dcc1d30396a6b1864ae3188aeb",
                  "workflow_run_id": 34609048356,
                  "released_at_utc": "2026-09-11T14:15:44.570861+00:00",
                  "defect": (
                      "V5-derived voter-roster and global recent-history filtering "
                      "occurred before family/cell selection, so unconditional "
                      "1/24 experimental-cell probability was not guaranteed."
                  ),
              },
              "correction_recorded_at_utc": recorded,
              "valid_ballot_start_utc": valid_start,
              "validity_rule": (
                  "Every NextGen transport row with timestamp earlier than or equal to "
                  "valid_ballot_start_utc is excluded from canonical evidence regardless "
                  "of content or outcome."
              ),
              "outcome_blind_audit": {
                  "choice_fields_inspected": False,
                  "pre_correction_transport_rows_observed_at_patch_time": observed,
                  "invalid_timestamp_rows_observed_at_patch_time": invalid_ts,
              },
              "sampling": {
                  "schedule_id": "equal_cell_via_family_weights_v1",
                  "voter_roster_filtering_allowed": False,
                  "family_probabilities": {
                      "core_concentration_2v2": 0.625,
                      "fragmentation_filler": 0.125,
                      "structural_topology_3v3": 0.25,
                  },
                  "cell_probability": 1 / 24,
                  "selection_order": [
                      "family",
                      "cell_uniform_within_selected_family",
                      "challenge_uniform_within_selected_cell",
                      "display_side_randomized",
                  ],
                  "recent_memory_scope": "within_already_selected_cell_only",
                  "adaptive_sampling_from_vote_outcomes_allowed": False,
                  "fv_visible_to_voter": False,
              },
              "anchors": {
                  "canonical_challenge_payload_sha256": "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab",
                  "catalog_sha256": "953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5",
                  "maturity_plan_sha256": "52a032e85f9b7989fd48fb2ae927b8af79e3a1a3cd221a3da08d0ac9381c519e",
                  "model_fit_preregistration_sha256": "4b8793c8de50d45c2d5ac6423013ee34d127982fc0492e933f5dc6a6ef6aaf98",
                  "production_exact_live_formula_sha256": "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7",
              },
              "corrected_browser": {"path": "index.html", "sha256": sha("index.html")},
              "permanent_regression": {
                  "path": "scripts/validation/repo_regression_checks.py",
                  "sha256": sha("scripts/validation/repo_regression_checks.py"),
              },
              "ktc_transport_isolation_unchanged": {
                  "path": "scripts/market/ktc_pipeline.py",
                  "sha256": sha("scripts/market/ktc_pipeline.py"),
              },
              "original_activation_record_preserved": True,
              "next_required_step": "monitor_only_ballots_after_valid_ballot_start_utc_against_frozen_maturity_gates",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")

          md = f"""
          # Package Adjustment NextGen V2 — Sampling Contract Correction

          **Status: CORRECTED BEFORE VALID EVIDENCE — production V1.6 unchanged.**

          Post-run verification of activation run `34609048356` found that the browser
          inherited V5 voter-roster filtering and applied recent-history filtering before
          family/cell selection. That could change the intended experimental-cell probabilities.

          No vote outcome was inspected to make this correction.

          Corrected sampling is family → cell → challenge → randomized display. Voter roster
          never changes package-research eligibility. Recent-history avoidance operates only
          within the already-selected cell.

          Original activation: `2026-09-11T14:15:44.570861+00:00`
          Corrected valid-ballot start: `{valid_start}`

          Every NextGen transport row at or before that corrected start is excluded without
          regard to choice. The browser also refuses submissions until then.

          Outcome-blind transport rows observed when correction ran: **{observed}**.
          The timestamp cutoff—not this count—defines canonical validity.

          Frozen catalog, maturity plan, fitter/model preregistration, historical V3/V4/V5
          evidence, KTC transport isolation, and production V1.6 are unchanged.
          """
          md_path.write_text(textwrap.dedent(md).strip() + "\n")

          print("PASS: correction provenance recorded without outcome inspection.")
          print("Corrected valid-ballot start:", valid_start)
          PY

      - name: Validate corrected contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          c = json.loads((d / "voting_sampling_correction_manifest.json").read_text())
          a = json.loads((d / "voting_activation_manifest.json").read_text())

          assert c["status"] == "nextgen_v2_sampling_contract_corrected_before_valid_evidence"
          assert c["production_formula_changed"] is False
          assert c["outcome_blind_audit"]["choice_fields_inspected"] is False
          assert c["sampling"]["voter_roster_filtering_allowed"] is False
          assert abs(c["sampling"]["cell_probability"] - 1/24) < 1e-15
          assert c["sampling"]["recent_memory_scope"] == "within_already_selected_cell_only"
          assert c["valid_ballot_start_utc"] == os.environ["CORRECTED_VALID_BALLOT_START_UTC"]
          assert datetime.fromisoformat(c["valid_ballot_start_utc"]) > datetime.fromisoformat(a["released_at_utc"])

          index = Path("index.html").read_text()
          start = index.index("function packageVoteTodayKey(){")
          end = index.index("\nfunction render(){", start)
          block = index[start:end]
          assert "PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2" in block
          assert "function packageVoteOwnPlayers()" not in block
          assert "function packageVoteEligibleChallenges()" not in block
          assert "own.has(" not in block
          assert block.index("const selectedCellKey =") < block.index("const recent = new Set(packageVoteRecent());")
          assert c["valid_ballot_start_utc"] in index
          print("PASS: corrected browser contract is exact and outcome-independent.")
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, re.S | re.I)
          Path("/tmp/index-inline.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/index-inline.js

      - name: Verify exact correction change boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "scripts/validation/repo_regression_checks.py",
              "research/package-adjustment-nextgen-v2/voting_sampling_correction_manifest.json",
              "research/package-adjustment-nextgen-v2/voting_sampling_correction.md",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          paths = {row[3:] for row in rows if row.strip()}
          if paths != expected:
              raise RuntimeError(f"unexpected correction changes: {sorted(paths)}")
          print("PASS: exactly four correction files changed.")
          PY
          git diff --check

      - name: Protect frozen evidence and transport
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          test "$(git hash-object scripts/market/ktc_pipeline.py)" = "01e2672c736b1258029d572f325f182ee2c2888d"
          test "$(git hash-object "$D/voting_activation_manifest.json")" = "6e9faf81e7ee186f770d0629164a269b6c51da58"

          git diff --exit-code -- research/package-adjustment-v3
          git diff --exit-code -- research/package-adjustment-v4
          git diff --exit-code -- research/package-adjustment-v5
          git diff --exit-code -- "$D/package_vote_challenges_nextgen_v2.json"
          git diff --exit-code -- "$D/catalog_freeze_manifest.json"
          git diff --exit-code -- "$D/challenge_catalog_design.md"
          git diff --exit-code -- "$D/generate_package_vote_challenges_nextgen_v2.py"
          git diff --exit-code -- "$D/package_adjustment_nextgen_v2_research_spec.md"
          git diff --exit-code -- "$D/evidence_maturity_plan.json"
          git diff --exit-code -- "$D/evidence_maturity_plan.md"
          git diff --exit-code -- "$D/evidence_maturity_plan_manifest.json"
          git diff --exit-code -- "$D/model_fit_preregistration.json"
          git diff --exit-code -- "$D/model_fit_preregistration.md"
          git diff --exit-code -- "$D/model_fit_preregistration_manifest.json"
          git diff --exit-code -- "$D/fit_package_adjustment_nextgen_v2.py"
          git diff --exit-code -- research/package-adjustment-production-candidate-v1

          echo "PASS: frozen evidence, original activation provenance, and KTC isolation untouched."

      - name: Run full regressions after correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit sampling correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add scripts/validation/repo_regression_checks.py
          git add research/package-adjustment-nextgen-v2/voting_sampling_correction_manifest.json
          git add research/package-adjustment-nextgen-v2/voting_sampling_correction.md

          git commit -m "Correct NextGen V2 voting sampling contract"
          echo "CORRECTION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove committed correction and production invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          expected = sorted([
              "index.html",
              "scripts/validation/repo_regression_checks.py",
              "research/package-adjustment-nextgen-v2/voting_sampling_correction_manifest.json",
              "research/package-adjustment-nextgen-v2/voting_sampling_correction.md",
          ])
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["CORRECTION_COMMIT"]],
              text=True,
          ).splitlines()
          assert sorted(changed) == expected, changed
          print("PASS: committed correction changed exactly four reviewed files.")
          PY

          test -z "$(git status --porcelain=v1)"
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Push corrected sampling contract
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          echo "Correction commit: $CORRECTION_COMMIT"
          echo "Corrected valid-ballot start: $CORRECTED_VALID_BALLOT_START_UTC"
          git log --oneline -1
