name: Package Adjustment NextGen V2 Activate Prospective Voting

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-activate-prospective-voting
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact dispatch and frozen activation boundary
        env:
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test -z "$(git status --porcelain=v1)"

          git merge-base --is-ancestor 0c20c3eb5bce74decfbb2c0ee62e38c4f3b3d3db HEAD
          git merge-base --is-ancestor 8a606392bd2ce68cdec4c27abfab0d0bf4137b51 HEAD

          test "$(sha256sum "$D/prospective_time_holdout_preregistration_v1.json" | awk '{print $1}')" = \
            "f29be9b1e73d1d6ec1d9a365fb29a0458334d75a36be64694adfcc4eeb78bfd6"
          test "$(sha256sum "$D/package_vote_challenges_prospective_v1.json" | awk '{print $1}')" = \
            "2af809a194e79d847fe9438366f8b379b907e86d99945d7a6a5fab3e4428a36e"
          test "$(sha256sum "$D/prospective_catalog_design_v1.md" | awk '{print $1}')" = \
            "387595159955ea6b8abe79566332526fadc3ae07edd2cf7ce669fc58a72e2b5c"
          test "$(sha256sum "$D/prospective_source_fv_snapshot_v1.json" | awk '{print $1}')" = \
            "99534477e8509c0124b3eebb64cb9668e175952d6e9484d330a7375cc33e2803"
          test "$(sha256sum "$D/prospective_catalog_freeze_manifest_v1.json" | awk '{print $1}')" = \
            "d93ebc829bebc94fb4a1d97f88725d95f4482d4dddc2516d67cf541883354fd2"

          test "$(git hash-object index.html)" = \
            "2f22eac81ae3efac14afa62baa5698d66185e32e"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = \
            "01e2672c736b1258029d572f325f182ee2c2888d"

          test ! -e "$D/prospective_voting_activation_manifest_v1.json"
          test ! -e "$D/prospective_voting_activation_v1.md"

          ! grep -Fq '__pkgnv2p1__|' index.html
          ! grep -Fq '__pkgnv2p1__|' scripts/market/ktc_pipeline.py
          ! grep -Fq '__pkgnv2p1__|' scripts/validation/repo_regression_checks.py

          grep -Fq '__pkgnv2__|' index.html
          grep -Fq '__pkgnv2__|' scripts/market/ktc_pipeline.py

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PASS: exact frozen prospective activation boundary confirmed."

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "requests==2.34.2"
          python3 - <<'PY'
          import platform
          import requests
          assert platform.python_version() == "3.13.15"
          assert requests.__version__ == "2.34.2"
          print("PASS: exact activation validation environment available.")
          PY

      - name: Validate prospective preregistration and frozen catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          D = Path("research/package-adjustment-nextgen-v2")
          prereg = json.loads((D / "prospective_time_holdout_preregistration_v1.json").read_text())
          catalog = json.loads((D / "package_vote_challenges_prospective_v1.json").read_text())
          manifest = json.loads((D / "prospective_catalog_freeze_manifest_v1.json").read_text())

          assert prereg["status"] == "frozen_prospective_time_holdout_preregistration"
          assert prereg["frozen"] is True
          assert prereg["candidate_id"] == "pkgnv2-m2b-v1"
          assert prereg["production_change_authorized"] is False
          assert prereg["automatic_production_promotion_allowed"] is False

          sampling = prereg["prospective_transport_and_sampling_contract"]
          assert sampling["vote_prefix"] == "__pkgnv2p1__|"
          assert sampling["meta_prefix"] == "__pkgnv2p1_meta__|"
          assert sampling["schema_marker"] == "__pkgnv2p1_schema__|1"
          assert sampling["sampling_schedule_id"] == "equal_cell_via_family_weights_v1"
          assert sampling["family_probabilities"] == {
              "core_concentration_2v2": 0.625,
              "fragmentation_filler": 0.125,
              "structural_topology_3v3": 0.25,
          }
          assert abs(sampling["cell_probability"] - 1 / 24) < 1e-15
          assert sampling["voter_roster_may_filter_challenge_eligibility"] is False
          assert sampling["recent_history_scope"] == "within_already_selected_cell_only"
          assert sampling["adaptive_sampling_from_outcomes_allowed"] is False
          assert sampling["adaptive_sampling_from_model_performance_allowed"] is False

          maturity = prereg["prospective_evidence_maturity_and_stopping"]
          assert maturity["daily_valid_vote_cap_per_voter"] == 20
          assert maturity["prospective_effective_lifetime_cap_per_voter"] == 30.0
          assert maturity["minimum_distinct_voters"] == 30
          assert maturity["minimum_effective_votes_per_cell"] == 15.0
          assert maturity["minimum_distinct_voters_per_cell"] == 10
          assert maturity["exact_checkpoints_effective_votes"] == [900, 1000]
          assert maturity["first_checkpoint_effective_votes"] == 900
          assert maturity["hard_cap_effective_votes"] == 1000
          assert maturity["monitor_must_be_outcome_blind"] is True

          assert catalog["status"] == "frozen_prospective_research_catalog_v1"
          assert catalog["frozen"] is True
          assert catalog["catalog_id"] == "pkgnv2-prospective-catalog-v1"
          assert catalog["research_only"] is True
          assert catalog["evaluation_only"] is True
          assert catalog["fit_eligible_challenges"] == 0
          assert catalog["production_change_authorized"] is False
          assert catalog["automatic_production_promotion_allowed"] is False
          assert catalog["generated_before_prospective_voting_activation"] is True

          rows = catalog["challenges"]
          assert len(rows) == 129
          assert all(c["experiment"] == "package_adjustment_nextgen_v2_prospective_v1" for c in rows)
          assert all(c["split"] == "prospective_time_holdout" for c in rows)
          assert all(c["fit_eligible"] is False for c in rows)
          assert all(c["evaluation_only"] is True for c in rows)
          assert all(c["model_selection_eligible"] is False for c in rows)
          assert all(c["values_hidden_from_voter"] is True for c in rows)

          families = Counter(c["family"] for c in rows)
          scales = Counter(c["scale_label"] for c in rows)
          cells = {(c["family"], c["cell_id"], c["scale_label"], c["split"]) for c in rows}
          assert families == Counter({
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          })
          assert scales == Counter({"low": 43, "mid": 43, "high": 43})
          assert len(cells) == 24

          family_cells = Counter(f for f, _cell, _scale, _split in cells)
          assert family_cells == Counter({
              "core_concentration_2v2": 15,
              "fragmentation_filler": 3,
              "structural_topology_3v3": 6,
          })
          for family, n_cells in family_cells.items():
              assert abs(sampling["family_probabilities"][family] / n_cells - 1 / 24) < 1e-15

          assert catalog["diagnostics"]["challenge_count"] == 129
          assert catalog["diagnostics"]["evaluation_cell_count"] == 24
          assert catalog["diagnostics"]["max_asset_appearance"] == 11
          assert catalog["diagnostics"]["first_wave_exact_trade_overlap_count"] == 0
          assert catalog["scientific_isolation"]["first_wave_vote_outcomes_read"] is False
          assert catalog["scientific_isolation"]["spent_structural_holdout_outcomes_read"] is False
          assert catalog["scientific_isolation"]["prospective_vote_outcomes_read"] is False
          assert catalog["scientific_isolation"]["M2b_predicted_choice_probability_computed"] is False
          assert catalog["scientific_isolation"]["M2b_minus_M0_score_gap_computed"] is False

          assert manifest["status"] == "frozen_prospective_catalog_v1_manifest"
          assert manifest["frozen"] is True
          assert manifest["challenge_count"] == 129
          assert manifest["evaluation_cell_count"] == 24
          assert manifest["fit_eligible_challenges"] == 0
          assert manifest["first_wave_exact_trade_overlap_count"] == 0
          assert manifest["prospective_voting_activated"] is False
          assert manifest["production_change_authorized"] is False

          print("PASS: frozen 129-challenge prospective catalog and 30-voter/900-vote preregistration verified.")
          PY

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Audit prospective transport namespace before activation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          import os
          import requests

          url = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )
          prefix = "__pkgnv2p1__|"

          response = requests.get(url, timeout=30)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          prospective_rows = sum(
              1 for row in rows
              if str(row.get("keep") or "").startswith(prefix)
          )

          if prospective_rows != 0:
              raise RuntimeError(
                  "prospective namespace already contains rows before activation: "
                  f"{prospective_rows}"
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PREACTIVATION_PROSPECTIVE_ROWS={prospective_rows}\n")

          print("PASS: outcome-blind preactivation prospective transport rows = 0.")
          PY

      - name: Freeze prospective valid-ballot start
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone

          recorded = datetime.now(timezone.utc)
          valid_start = recorded + timedelta(minutes=10)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"ACTIVATION_RECORDED_AT_UTC={recorded.isoformat()}\n")
              f.write(f"PROSPECTIVE_VALID_BALLOT_START_UTC={valid_start.isoformat()}\n")

          print("Activation recorded at:", recorded.isoformat())
          print("Valid prospective ballot collection begins at:", valid_start.isoformat())
          PY

      - name: Patch prospective browser slot and KTC transport isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          index_path = Path("index.html")
          ktc_path = Path("scripts/market/ktc_pipeline.py")
          reg_path = Path("scripts/validation/repo_regression_checks.py")

          cutoff = os.environ["PROSPECTIVE_VALID_BALLOT_START_UTC"]

          text = index_path.read_text(encoding="utf-8")
          start_marker = "/* Package Adjustment NextGen V2: frozen multi-v-multi research catalog."
          if text.count(start_marker) != 1:
              raise RuntimeError(
                  f"active package-vote header anchor count={text.count(start_marker)}"
              )
          start = text.index(start_marker)
          end = text.index("\nfunction render(){", start)

          active_before = text[start:end]
          assert "PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2" in active_before
          assert "function packageVoteOwnPlayers()" not in active_before
          assert "function packageVoteEligibleChallenges()" not in active_before
          assert "own.has(" not in active_before
          assert "__pkgnv2__|" in active_before
          assert "__pkgnv2p1__|" not in active_before
          assert "package_vote_challenges_nextgen_v2.json" in active_before
          assert active_before.index("const selectedCellKey =") < active_before.index(
              "const recent = new Set(packageVoteRecent());"
          )

          prospective = r'''/* Package Adjustment NextGen V2 Prospective V1: frozen time-holdout catalog.
          Research-only prospective validation. Production Package Adjustment remains V1.6. */
          const PACKAGE_VOTE_CHALLENGES_URL = 'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/8a606392bd2ce68cdec4c27abfab0d0bf4137b51/research/package-adjustment-nextgen-v2/package_vote_challenges_prospective_v1.json';
          const PACKAGE_VOTE_CATALOG_SHA256 = '2af809a194e79d847fe9438366f8b379b907e86d99945d7a6a5fab3e4428a36e';
          const PACKAGE_VOTE_DAILY_LIMIT = 20;
          const PACKAGE_VOTE_RECENT_MEMORY = 20;
          const PACKAGE_VOTE_VALID_AFTER_UTC = '%%VALID_START%%';
          const PACKAGE_VOTE_FAMILY_WEIGHTS = Object.freeze({
          core_concentration_2v2: 0.625,
          fragmentation_filler: 0.125,
          structural_topology_3v3: 0.25,
          });
          let PACKAGE_VOTE_CHALLENGES = null;
          let PACKAGE_VOTE_STATUS = 'idle';
          let packageVoteCurrent = null;
          
          function packageVoteTodayKey(){
          return 'package_votes_nextgen_v2_prospective_v1_' + new Date().toISOString().slice(0,10);
          }
          
          function packageVotesToday(){
          return parseInt(localStorage.getItem(packageVoteTodayKey()) || '0', 10);
          }
          
          function packageVoteRecent(){
          try { return JSON.parse(localStorage.getItem('package_vote_recent_nextgen_v2_prospective_v1') || '[]'); }
          catch(e){ return []; }
          }
          
          function packageVoteRemember(id){
          const recent = packageVoteRecent().concat([id]).slice(-PACKAGE_VOTE_RECENT_MEMORY);
          localStorage.setItem('package_vote_recent_nextgen_v2_prospective_v1', JSON.stringify(recent));
          }
          
          /* PACKAGE_VOTE_NEXTGEN_V2_EXACT_CELL_SAMPLING_V2
             Frozen prospective schedule is unconditional with respect to voter roster:
             family -> exact experimental cell -> challenge within that cell.
             Recent-memory is applied only AFTER the cell is selected, so it
             cannot alter family or cell probability. Vote outcomes and model
             performance never affect sampling. */
          function packageVoteWeightedFamily(families){
          let total = 0;
          for(const family of families) total += Number(PACKAGE_VOTE_FAMILY_WEIGHTS[family] || 0);
          if(total <= 0) return null;
          let draw = Math.random() * total;
          for(const family of families){
          draw -= Number(PACKAGE_VOTE_FAMILY_WEIGHTS[family] || 0);
          if(draw <= 0) return family;
          }
          return families[families.length - 1] || null;
          }
          
          function packageVoteSelectChallenge(){
          if(!PACKAGE_VOTE_CHALLENGES || !PACKAGE_VOTE_CHALLENGES.length) return null;
          
          const byFamily = new Map();
          for(const c of PACKAGE_VOTE_CHALLENGES){
          if(!Object.prototype.hasOwnProperty.call(PACKAGE_VOTE_FAMILY_WEIGHTS, c.family)) continue;
          if(!byFamily.has(c.family)) byFamily.set(c.family, []);
          byFamily.get(c.family).push(c);
          }
          
          const families = Array.from(byFamily.keys()).sort();
          const family = packageVoteWeightedFamily(families);
          if(!family) return null;
          
          const familyPool = byFamily.get(family);
          const byCell = new Map();
          for(const c of familyPool){
          const cellKey = `${c.family}|${c.cell_id}|${c.scale_label}|${c.split}`;
          if(!byCell.has(cellKey)) byCell.set(cellKey, []);
          byCell.get(cellKey).push(c);
          }
          
          const cells = Array.from(byCell.keys()).sort();
          if(!cells.length) return null;
          const selectedCellKey = cells[Math.floor(Math.random() * cells.length)];
          const cellPool = byCell.get(selectedCellKey);
          
          const recent = new Set(packageVoteRecent());
          let challengePool = cellPool.filter(c => !recent.has(c.id));
          if(!challengePool.length) challengePool = cellPool;
          
          const challenge = challengePool[Math.floor(Math.random() * challengePool.length)];
          return { challenge, left: Math.random() < 0.5 ? 'A' : 'B' };
          }
          
          function packageVoteEnsureLoaded(){
          if(PACKAGE_VOTE_STATUS === 'loading' || PACKAGE_VOTE_STATUS === 'ready') return;
          PACKAGE_VOTE_STATUS = 'loading';
          fetch(PACKAGE_VOTE_CHALLENGES_URL, {cache:'no-store'})
          .then(r => {
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
          })
          .then(doc => {
          if(
          doc.schema_version !== 1 ||
          doc.status !== 'frozen_prospective_research_catalog_v1' ||
          doc.frozen !== true ||
          doc.catalog_id !== 'pkgnv2-prospective-catalog-v1' ||
          doc.research_only !== true ||
          doc.evaluation_only !== true ||
          doc.fit_eligible_challenges !== 0 ||
          doc.production_change_authorized !== false ||
          doc.automatic_production_promotion_allowed !== false ||
          !doc.diagnostics ||
          Number(doc.diagnostics.challenge_count) !== 129 ||
          Number(doc.diagnostics.evaluation_cell_count) !== 24 ||
          Number(doc.diagnostics.max_asset_appearance) > 11 ||
          Number(doc.diagnostics.first_wave_exact_trade_overlap_count) !== 0 ||
          !doc.scientific_isolation ||
          doc.scientific_isolation.prospective_vote_outcomes_read !== false ||
          doc.scientific_isolation.M2b_minus_M0_score_gap_computed !== false ||
          !Array.isArray(doc.challenges) ||
          doc.challenges.length !== 129 ||
          !doc.challenges.every(c =>
            c &&
            c.experiment === 'package_adjustment_nextgen_v2_prospective_v1' &&
            c.split === 'prospective_time_holdout' &&
            c.fit_eligible === false &&
            c.evaluation_only === true &&
            c.model_selection_eligible === false &&
            c.values_hidden_from_voter === true &&
            c.side_a && Array.isArray(c.side_a.assets) && c.side_a.assets.length >= 2 &&
            c.side_b && Array.isArray(c.side_b.assets) && c.side_b.assets.length >= 2
          )
          ){
          throw new Error('unexpected NextGen V2 prospective frozen challenge catalog');
          }
          
          const cells = new Set(
            doc.challenges.map(c => `${c.family}|${c.cell_id}|${c.scale_label}|${c.split}`)
          );
          if(cells.size !== 24) throw new Error('prospective_catalog_cell_count');
          
          PACKAGE_VOTE_CHALLENGES = doc.challenges;
          PACKAGE_VOTE_STATUS = 'ready';
          packageVoteCurrent = null;
          renderPackageVote();
          })
          .catch(err => {
          console.warn('Package Adjustment NextGen V2 prospective load failed:', err);
          PACKAGE_VOTE_CHALLENGES = null;
          PACKAGE_VOTE_STATUS = 'failed';
          renderPackageVote();
          });
          }
          
          function packageVoteAssetCard(p){
          const age = (typeof p.age === 'number') ? ` &middot; ${p.age} y.o.` : '';
          const team = p.team ? ` &middot; ${ktcTeamLabel(p.team)}` : '';
          return `<div class="need-cell" style="text-align:left;padding:10px;">
          <div style="font-weight:600;font-size:14px;">${escapeHtml(p.name)}</div>
          <div style="color:var(--text-dim);font-size:11px;">${escapeHtml(p.pos)}${team}${age}</div>
          </div>`;
          }
          
          function packageVoteSubmit(displaySide){
          if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)) return;
          if(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;
          
          const left = packageVoteCurrent.left;
          const choice = displaySide === 'L' ? left : (left === 'A' ? 'B' : 'A');
          const id = packageVoteCurrent.challenge.id;
          const voter = ktcCurrentVoterId();
          if(!voter) return;
          
          fetch(KTC_SUBMIT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
          voterRosterId: voter,
          keep: `__pkgnv2p1__|${id}|${choice}`,
          trade: `__pkgnv2p1_meta__|${left}`,
          cut: '__pkgnv2p1_schema__|1',
          }),
          }).catch(() => {});
          
          localStorage.setItem(packageVoteTodayKey(), String(packageVotesToday() + 1));
          packageVoteRemember(id);
          packageVoteCurrent = packageVoteSelectChallenge();
          renderPackageVote();
          }
          
          function renderPackageVote(){
          const el = document.getElementById('packageVoteWrap');
          if(!el) return;
          
          if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){
          el.innerHTML = `
          <div class="vote-access-card">
          <div class="vote-access-copy">
          <div class="vote-access-title">Ready to compare trades?</div>
          <div class="vote-access-sub">League members: choose your team above to use your league voter identity. Everyone else can vote as a guest.</div>
          </div>
          <button type="button" class="vote-guest-btn" onclick="ktcStartGuestMode()">Vote as a guest</button>
          </div>
          `;
          return;
          }
          
          if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          Prospective research voting opens at ${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.
          </div>`;
          return;
          }
          
          if(packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          You've completed today's ${PACKAGE_VOTE_DAILY_LIMIT} package research votes. Thank you.
          </div>`;
          return;
          }
          
          if(PACKAGE_VOTE_STATUS === 'idle'){
          packageVoteEnsureLoaded();
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen prospective package comparisons...</div>`;
          return;
          }
          if(PACKAGE_VOTE_STATUS === 'loading'){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen prospective package comparisons...</div>`;
          return;
          }
          if(PACKAGE_VOTE_STATUS === 'failed'){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Prospective package research is temporarily unavailable. Normal KTC voting is unaffected.</div>`;
          return;
          }
          
          if(!packageVoteCurrent) packageVoteCurrent = packageVoteSelectChallenge();
          if(!packageVoteCurrent){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">No prospective package comparison is available right now.</div>`;
          return;
          }
          
          const c = packageVoteCurrent.challenge;
          const sideAHTML = c.side_a.assets.map(packageVoteAssetCard).join('');
          const sideBHTML = c.side_b.assets.map(packageVoteAssetCard).join('');
          const leftIsA = packageVoteCurrent.left === 'A';
          const leftHTML = leftIsA ? sideAHTML : sideBHTML;
          const rightHTML = leftIsA ? sideBHTML : sideAHTML;
          
          el.innerHTML = `
          <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text-dim);">
          <b style="color:var(--text);">Research question:</b> Which side would you rather have in a dynasty trade?
          Values are intentionally hidden. Vote on the assets themselves.
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;">
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:5px;text-align:center;">SIDE A</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${leftHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('L')">Choose Side A</button>
          </div>
          <div>
