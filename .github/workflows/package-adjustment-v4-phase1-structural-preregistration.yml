name: Package Adjustment V4 - Phase 1 Structural Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard V3 closure and fresh V4 surface
        shell: bash
        run: |
          set -euo pipefail

          V3="research/package-adjustment-v3-ktc-style"
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V3/package_adjustment_v3_research_closeout.json")" = "dbf43b5444bb1b1d8f6c3b71af72d259662801a7"
          test "$(git hash-object "$V3/package_adjustment_v3_research_closeout_manifest.json")" = "c3e940e337891abe81e5d4cb41096721762ea108"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          closeout = json.loads((d / "package_adjustment_v3_research_closeout.json").read_text())
          manifest = json.loads((d / "package_adjustment_v3_research_closeout_manifest.json").read_text())

          assert closeout["status"] == "research_closed_no_successor_candidate"
          assert closeout["closed"] is True
          assert closeout["successor_candidate_exists"] is False
          assert closeout["production_change_authorized"] is False
          assert closeout["production_revision_retained"] == "v1.6-v5-size2-composition-overlay"
          assert closeout["confirmation_evidence"]["spent_development_evidence_for_future_cycles"] is True
          assert closeout["confirmation_evidence"]["may_not_be_reused_as_fresh_confirmation"] is True
          assert closeout["governance"]["do_not_tune_gamma_on_the_same_600_votes"] is True
          assert closeout["governance"]["future_package_adjustment_research_must_be_new_cycle"] is True

          assert manifest["closed"] is True
          assert manifest["successor_candidate_exists"] is False
          assert manifest["fresh_v3_voting_authorized"] is False

          print("PASS: V3 is closed and its exact-600 evidence is spent development-only evidence.")
          PY

          # No V3 workflow may still be active.
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'package-adjustment-v3-*' -print)"

          # These cross-cycle package workflows intentionally remain.
          test -f .github/workflows/package-adjustment-audit-step4-exact-live-oos.yml
          test -f .github/workflows/prospective-trade-evidence-capture.yml

          # Phase 1 must precede any V4 spent-evidence development analysis.
          test ! -e "$V4/phase1_structural_preregistration.json"
          test ! -e "$V4/phase1_structural_preregistration.md"
          test ! -e "$V4/phase1_manifest.json"
          test ! -e "$V4/phase2_development_results.json"
          test ! -e "$V4/frozen_candidate.json"

      - name: Verify production remains V1.6 before V4 preregistration
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze V4 structural hypothesis before development analysis
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          d = Path("research/package-adjustment-v4-elite-fragmentation")
          d.mkdir(parents=True, exist_ok=True)

          out_json = d / "phase1_structural_preregistration.json"
          out_md = d / "phase1_structural_preregistration.md"
          out_manifest = d / "phase1_manifest.json"

          for path in (out_json, out_md, out_manifest):
              if path.exists():
                  raise RuntimeError(f"Refusing to overwrite frozen V4 Phase 1 artifact: {path}")

          # Frozen grid chosen before reading V3 ballot outcomes for V4 development.
          stud_strengths = [0.25, 0.50, 0.75]
          second_piece_discounts = [0.10, 0.25, 0.40]
          third_plus_discounts = [0.30, 0.50, 0.70]

          grid = []
          for stud in stud_strengths:
              for second in second_piece_discounts:
                  for third in third_plus_discounts:
                      if third < second:
                          continue
                      grid.append({
                          "id": (
                              f"elite-frag-s{int(round(stud*100)):02d}"
                              f"-p2{int(round(second*100)):02d}"
                              f"-p3{int(round(third*100)):02d}"
                          ),
                          "stud_strength": stud,
                          "second_piece_discount": second,
                          "third_plus_discount": third,
                      })

          assert len(grid) == 24

          generated = datetime.now(timezone.utc).isoformat()

          prereg = {
              "schema_version": 1,
              "study_id": "package-adjustment-v4-elite-fragmentation",
              "phase": 1,
              "status": "FROZEN_BEFORE_SPENT_EVIDENCE_DEVELOPMENT",
              "frozen": True,
              "research_only": True,
              "new_independent_research_cycle": True,
              "production_change_authorized": False,
              "production_revision_must_remain": "v1.6-v5-size2-composition-overlay",
              "hypothesis": {
                  "name": "elite_anchor_plus_ranked_fragmentation",
                  "reason": (
                      "V3 showed that a single global power exponent carried only a tiny "
                      "held-out advantage over raw addition. V4 tests a structurally "
                      "different KTC-style mechanism: an explicit premium for the best "
                      "asset plus explicit discounts for lesser package pieces."
                  ),
                  "not_a_gamma_rescue": True,
                  "not_a_global_power_transform": True,
                  "fixed_value_scale_apex": 10000.0,
                  "side_definition": {
                      "sort": "asset FV descending: v1 >= v2 >= v3 ...",
                      "raw_total_T": "sum(v_i)",
                      "elite_factor_e": "clamp(v1 / 10000, 0, 1)",
                      "premium_P": (
                          "e * (stud_strength*v1 "
                          "- second_piece_discount*v2 "
                          "- third_plus_discount*sum(v_i for i>=3))"
                      ),
                      "effective_score_E": "T + P",
                      "missing_terms": "v2=0 and/or third-plus sum=0 when absent",
                  },
                  "package_adjustment_display": {
                      "one_for_one_policy": "always zero package adjustment",
                      "stronger_side": "side with greater effective_score_E",
                      "relative_premium": "P_stronger - P_weaker",
                      "display_adjustment": "max(0, relative_premium)",
                      "identity": (
                          "When display_adjustment is positive, adjusted raw-total "
                          "difference equals the effective-score difference."
                      ),
                  },
                  "interpretation": {
                      "stud_strength": (
                          "Absolute elite-anchor premium on the best asset; grows with "
                          "v1/10000 rather than applying the same curvature to every asset."
                      ),
                      "second_piece_discount": (
                          "Discount applied to the second-best piece when paired with an "
                          "elite anchor."
                      ),
                      "third_plus_discount": (
                          "Stronger fragmentation discount for third and later pieces."
                      ),
                  },
              },
              "candidate_grid": {
                  "stud_strengths": stud_strengths,
                  "second_piece_discounts": second_piece_discounts,
                  "third_plus_discounts": third_plus_discounts,
                  "constraint": "third_plus_discount >= second_piece_discount",
                  "candidate_count": len(grid),
                  "candidates": grid,
                  "no_continuous_parameter_optimization": True,
                  "no_gamma_parameter": True,
              },
              "hard_invariants_required_for_development_eligibility": [
                  "one_for_one_package_adjustment_is_zero",
                  "side_swap_symmetry",
                  "asset_order_invariance",
                  "finite_effective_scores",
                  "finite_nonnegative_display_adjustment",
                  "positive_effective_score_monotonicity_under_asset_value_increase",
                  "adding_a_positive_piece_cannot_reduce_effective_side_score",
                  "tiny_piece_continuity",
                  "second_piece_effective_weight_remains_positive",
                  "third_plus_piece_effective_weight_remains_positive",
                  "draft_picks_supported_as_first_class_assets",
                  "explicit_player_exclusion_policy_enforced",
                  "draft_pick_year_policy_2027_2028_only_enforced",
                  "multi_vs_multi_supported",
              ],
              "stress_test_protocol": {
                  "deterministic_seed": 20260919,
                  "cases_per_shape": 500,
                  "shapes": [
                      "1v2", "1v3", "2v2", "2v3", "3v3", "3v4",
                      "4v6", "5v6", "6v6", "1v10"
                  ],
                  "all_hard_invariants_must_pass": True,
              },
              "asset_eligibility": {
                  "players": {
                      "positions_allowed": ["QB", "RB", "WR", "TE", "DL", "LB", "DB"],
                      "must_have_positive_fv": True,
                      "must_be_currently_rostered": True,
                      "explicitly_excluded_players": [
                          "Joe Mixon"
                      ],
                      "retired_players_allowed": False,
                      "policy_note": (
                          "Joe Mixon is explicitly excluded from V4 generated trades. "
                          "Phase 2 and every later V4 catalog generator must apply this "
                          "exclusion before candidate/challenge construction."
                      ),
                  },
                  "draft_picks": {
                      "years_allowed": [2027, 2028],
                      "rounds_allowed": [1, 2, 3, 4],
                      "slots_allowed": ["early", "mid", "late"],
                      "2029_and_later_allowed": False,
                      "policy_note": (
                          "V4 research intentionally excludes 2029+ picks because those "
                          "assets are too remote to represent realistic current trade demand."
                      ),
                  },
                  "eligibility_is_frozen_for_v4_cycle": True,
              },
              "development_evidence_governance": {
                  "v3_exact_600_votes": (
                      "spent development evidence allowed only after this Phase 1 "
                      "preregistration is committed"
                  ),
                  "v3_exact_600_may_be_fresh_confirmation": False,
                  "nextgen_exact_900_vote_dataset": "spent_and_prohibited",
                  "five_ktc_examples": (
                      "development-only numeric/behavioral diagnostic; not fit target, "
                      "not candidate-selection tiebreaker, never fresh confirmation"
                  ),
                  "eight_historical_league_trades": (
                      "topology/scope anchors only; accepted trade does not mean fair"
                  ),
                  "future_real_trade_evidence": (
                      "may remain observational topology evidence; not a substitute "
                      "for fresh human confirmation"
                  ),
              },
              "phase2_development_plan": {
                  "evidence": "frozen V3 exact-600 ballots, development-only",
                  "models_compared": [
                      "raw-additive-control-g1.00",
                      "v3-reference-power-g2.15",
                      "24 frozen V4 elite-fragmentation candidates",
                  ],
                  "score_probability_link": (
                      "logistic(beta * normalized_effective_score_delta "
                      "+ delta_left * I(canonical_A_displayed_left))"
                  ),
                  "normalized_effective_score_delta": "(E_A-E_B)/(abs(E_A)+abs(E_B))",
                  "beta_constraint": "beta > 0 via beta=exp(log_beta)",
                  "left_bias_parameter": "delta_left",
                  "cross_validation": "5-fold grouped by frozen voter cluster",
                  "calibration_parameters_refit_inside_each_training_fold": True,
                  "primary_metric": "mean held-out weighted log loss",
                  "candidate_selection": "lowest mean held-out log loss among invariant-passing V4 candidates",
                  "development_nomination_gates": {
                      "must_beat_raw_control_log_loss": True,
                      "must_beat_v3_g2_15_reference_log_loss": True,
                      "minimum_positive_folds_vs_raw": 3,
                      "maximum_topology_x_asset_mix_regression_vs_raw": 0.02,
                  },
                  "near_tie_rule": {
                      "threshold_mean_log_loss": 0.0005,
                      "action": (
                          "If runner-up is within 0.0005 of the best and also passes "
                          "all development gates, freeze both as a two-candidate V4 "
                          "confirmation family. Otherwise freeze only the best."
                      ),
                      "maximum_candidates_frozen": 2,
                  },
                  "if_no_candidate_passes": (
                      "Close V4 development without fresh voting; do not tune a new "
                      "grid against the same spent V3 outcomes."
                  ),
              },
              "fresh_confirmation_contract_if_candidate_frozen": {
                  "fresh_evidence_required": True,
                  "v3_600_votes_count": False,
                  "nextgen_900_votes_count": False,
                  "new_vote_namespace": "__pkgv4c1__",
                  "asset_pool": {
                      "players": (
                          "currently rostered, positive-FV QB/RB/WR/TE/DL/LB/DB; "
                          "Joe Mixon explicitly excluded; retired players prohibited"
                      ),
                      "picks": "2027-2028 rounds 1-4, early/mid/late variants only",
                      "2029_or_later_picks_prohibited": True,
                  },
                  "topologies": ["1v2", "1v3", "2v2", "2v3", "3v3", "3v4"],
                  "asset_mix_groups": ["players_only", "includes_picks"],
                  "challenge_strata": [
                      "candidate_vs_raw_disagreement",
                      "balanced_broad"
                  ],
                  "research_cell_design": "6 topologies x 2 asset mixes x 2 strata = 24 cells",
                  "challenges_per_cell": 10,
                  "challenge_count": 240,
                  "known_five_ktc_examples_excluded_exactly": True,
                  "known_eight_historical_trades_excluded_exactly": True,
                  "candidate_identity_hidden_from_voters": True,
                  "model_predictions_hidden_from_voters": True,
                  "asset_values_hidden_from_voters": True,
                  "display_side_randomization_required": True,
                  "balanced_broad_stratum_must_not_require_model_disagreement": True,
                  "maturity": {
                      "daily_valid_vote_cap_per_voter": 20,
                      "effective_lifetime_vote_cap_per_voter": 30,
                      "exact_effective_vote_checkpoints": [600, 700, 800],
                      "minimum_distinct_voters": 30,
                      "minimum_effective_votes_per_cell": 15,
                      "minimum_distinct_voters_per_cell": 10,
                      "stop_rule": (
                          "Stop at first exact checkpoint where every coverage gate "
                          "passes; hard stop unresolved at 800 otherwise."
                      ),
                      "outcome_blind_until_exact_checkpoint_freeze": True,
                  },
                  "evaluation": {
                      "primary_metric": "5-fold voter-grouped held-out log loss",
                      "raw_additive_control_required": True,
                      "candidate_selection_if_two_frozen": (
                          "lowest mean held-out log loss; unresolved if best-vs-runner-up "
                          "gap < 0.002"
                      ),
                      "deployment_gates": {
                          "minimum_log_loss_improvement_vs_raw_control": 0.005,
                          "challenge_cluster_bootstrap_favorable_fraction_vs_raw": 0.90,
                          "maximum_topology_x_asset_mix_log_loss_regression_vs_raw": 0.03,
                          "all_24_cells_coverage_required": True,
                      },
                      "production_change_if_any_gate_fails": False,
                      "automatic_production_promotion_allowed": False,
                  },
              },
              "operational_boundaries": {
                  "phase1_reads_v3_ballot_outcomes": False,
                  "phase1_fits_parameters": False,
                  "phase1_selects_candidate": False,
                  "phase1_changes_production": False,
                  "v4_workflows_must_be_new_files": True,
                  "v3_workflows_must_not_be_restored_for_v4": True,
              },
              "next_action": (
                  "Run V4 Phase 2 development exactly once against the spent V3 "
                  "exact-600 evidence using this frozen 24-candidate structural grid."
              ),
          }

          out_json.write_text(
              json.dumps(prereg, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = """# Package Adjustment V4 — Phase 1 Structural Preregistration

          **Status:** `FROZEN_BEFORE_SPENT_EVIDENCE_DEVELOPMENT`

          V4 is a new research cycle. Production remains
          `v1.6-v5-size2-composition-overlay`.

          ## New structural hypothesis

          V4 does **not** continue the V3 gamma search.

          Each side is sorted by FV. The best asset receives an explicit
          elite-anchor premium that grows with `v1 / 10000`; the second piece is
          discounted; third-and-later pieces receive a stronger fragmentation
          discount.

          The frozen candidate grid has **24 discrete configurations** covering
          three stud strengths, three second-piece discounts, and three third-plus
          discounts under `third_plus_discount >= second_piece_discount`.

          ## Asset eligibility

          V4 generated trades use currently rostered, positive-FV
          QB/RB/WR/TE/DL/LB/DB assets. **Joe Mixon is explicitly excluded** and
          retired players are not eligible for V4 challenge generation.

          Draft picks are limited to **2027 and 2028, rounds 1-4,
          early/mid/late**. **2029 and later picks are prohibited** from V4
          development and fresh-confirmation catalogs.

          ## Development

          Only after this preregistration is committed may the spent V3 exact-600
          ballots be read for V4 development. They are development evidence only.

          Phase 2 compares raw addition, the frozen V3 `g2.15` reference, and all
          invariant-passing V4 candidates with five-fold voter-grouped held-out
          log loss. No continuous optimization and no gamma parameter are allowed.

          A candidate must beat both raw addition and the V3 reference, improve in
          at least 3/5 folds versus raw, and avoid >0.02 topology×asset-mix
          regression. At most two near-tied candidates may be frozen.

          ## Fresh confirmation

          Any nominated V4 candidate still requires completely fresh human votes.
          The fresh catalog will contain 24 cells spanning six topologies, two
          asset mixes, and both targeted-disagreement and broad-balanced strata.

          The V3 600 votes and the older 900-vote study cannot count toward V4
          confirmation.

          Final deployment gates remain strict: >=0.005 held-out log-loss
          improvement versus raw, >=0.90 challenge-cluster bootstrap favorable
          fraction, <=0.03 maximum topology×asset-mix regression, and full 24-cell
          coverage.

          This phase does not read human outcomes, fit a model, select a candidate,
          or alter production.
          """
          out_md.write_text(
              "\n".join(line.strip() for line in md.splitlines()).strip() + "\n",
              encoding="utf-8",
          )

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "schema_version": 1,
              "status": "package_adjustment_v4_phase1_structural_preregistration_manifest",
              "frozen": True,
              "generated_at_utc": generated,
              "production_change_authorized": False,
              "production_revision_retained": "v1.6-v5-size2-composition-overlay",
              "v3_outcomes_read": False,
              "parameter_fit_performed": False,
              "candidate_selected": False,
              "candidate_grid_count": 24,
              "source_closeout": {
                  "path": "research/package-adjustment-v3-ktc-style/package_adjustment_v3_research_closeout.json",
                  "git_blob_sha": "dbf43b5444bb1b1d8f6c3b71af72d259662801a7",
              },
              "outputs": {
                  "preregistration": {
                      "path": str(out_json),
                      "sha256": sha256(out_json),
                  },
                  "summary": {
                      "path": str(out_md),
                      "sha256": sha256(out_md),
                  },
              },
              "next_action": "Run Package Adjustment V4 Phase 2 spent-evidence development.",
          }
          out_manifest.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: V4 structural hypothesis frozen before spent-evidence development.")
          print("V4_CANDIDATE_GRID_COUNT=24")
          PY

      - name: Verify exact Phase 1 boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          prereg = json.loads((d / "phase1_structural_preregistration.json").read_text())
          manifest = json.loads((d / "phase1_manifest.json").read_text())

          assert prereg["status"] == "FROZEN_BEFORE_SPENT_EVIDENCE_DEVELOPMENT"
          assert prereg["frozen"] is True
          assert prereg["new_independent_research_cycle"] is True
          assert prereg["production_change_authorized"] is False
          assert prereg["hypothesis"]["not_a_gamma_rescue"] is True
          assert prereg["hypothesis"]["not_a_global_power_transform"] is True
          assert prereg["candidate_grid"]["candidate_count"] == 24
          assert len(prereg["candidate_grid"]["candidates"]) == 24
          assert prereg["asset_eligibility"]["players"]["explicitly_excluded_players"] == ["Joe Mixon"]
          assert prereg["asset_eligibility"]["players"]["retired_players_allowed"] is False
          assert prereg["asset_eligibility"]["draft_picks"]["years_allowed"] == [2027, 2028]
          assert prereg["asset_eligibility"]["draft_picks"]["2029_and_later_allowed"] is False
          assert prereg["fresh_confirmation_contract_if_candidate_frozen"]["asset_pool"]["2029_or_later_picks_prohibited"] is True
          assert prereg["operational_boundaries"]["phase1_reads_v3_ballot_outcomes"] is False
          assert prereg["operational_boundaries"]["phase1_fits_parameters"] is False
          assert prereg["operational_boundaries"]["phase1_selects_candidate"] is False
          assert prereg["fresh_confirmation_contract_if_candidate_frozen"]["challenge_count"] == 240

          assert manifest["v3_outcomes_read"] is False
          assert manifest["parameter_fit_performed"] is False
          assert manifest["candidate_selected"] is False

          expected = {
              "research/package-adjustment-v4-elite-fragmentation/phase1_structural_preregistration.json",
              "research/package-adjustment-v4-elite-fragmentation/phase1_structural_preregistration.md",
              "research/package-adjustment-v4-elite-fragmentation/phase1_manifest.json",
          }
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          changed = {row[3:] for row in status if len(row) >= 4}
          if changed != expected:
              raise RuntimeError(f"Unexpected V4 Phase 1 scope: {sorted(changed)}")

          print("PASS: exactly three V4 preregistration files changed; no evidence analysis occurred.")
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after preregistration
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Commit frozen V4 Phase 1 preregistration
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v4-elite-fragmentation"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$D/phase1_structural_preregistration.json" \
            "$D/phase1_structural_preregistration.md" \
            "$D/phase1_manifest.json"

          git diff --cached --check
          git commit -m "Preregister Package Adjustment V4 structural study"
          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_research_closeout.json)" = "dbf43b5444bb1b1d8f6c3b71af72d259662801a7"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_research_closeout_manifest.json)" = "c3e940e337891abe81e5d4cb41096721762ea108"

          # V3 workflows must stay deleted.
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'package-adjustment-v3-*' -print)"

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "PACKAGE_ADJUSTMENT_V4_PHASE1=FROZEN_BEFORE_SPENT_EVIDENCE_DEVELOPMENT"
          echo "PRODUCTION_REVISION=v1.6-v5-size2-composition-overlay"
          git log --oneline -1
