name: A-NL62R1 - Protected Editorial JSON to Verified PDF (Preview Only)
run-name: A-NL62R1 - W10/W9 verified editorial handoff, no release
'on':
  workflow_dispatch:
    inputs:
      private_editorial_repo:
        description: Owner-controlled PRIVATE repo containing releases/2026/W10-W09 (not a public repo)
        required: true
        type: string
        default: 'ajknoll23-code/LOG-Newsletter-Private'
      war_week:
        description: Pinned validation week; W10 War Room and W9 Aftermath
        required: true
        type: string
        default: '10'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl62r1-protected-editorial-test
  cancel-in-progress: false
jobs:
  protected-integration:
    name: Manually approved private editorial -> 2 PDF adapters -> post-render identity gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: newsletter-release
    steps:
      - name: Checkout public reviewed integration code (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse absent private environment token
        shell: bash
        env:
          TOKEN_EXISTS: ${{ secrets.LOG_PRIVATE_EDITORIAL_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_EXISTS" != 'true' ]; then
            echo 'Missing LOG_PRIVATE_EDITORIAL_READ_TOKEN. Configure it as a secret of the protected newsletter-release Environment.' >&2
            exit 1
          fi
      - name: Validate exact approved source runs on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY_RUNS'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          runs={
             43117576037:'.github/workflows/A-NL59R1-Approved-Editorial-Fingerprint-Archive-PREVIEW.yml',
             42837956712:'.github/workflows/A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml',
             42838026515:'.github/workflows/A-NL45R1-Offense-IDP-Leaderboard-ReadOnly.yml'
          }
          for rid,path in runs.items():
              u=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'LOG-NL62R1-Approved-Identity'})
              with urllib.request.urlopen(req,timeout=25) as f:r=json.load(f)
              if r.get('path')!=path or r.get('head_branch')!='main' or r.get('conclusion')!='success':
                  raise SystemExit(f'Source run failed attestation: {rid}')
              print('Validated upstream successful run',rid)
          PY_VERIFY_RUNS
      - name: Verify approved editorial repository is truly private
        shell: bash
        env:
          PRIVATE_REPO: ${{ inputs.private_editorial_repo }}
          PRIVATE_TOKEN: ${{ secrets.LOG_PRIVATE_EDITORIAL_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY_PRIVATE_VISIBILITY'
          import json,os,re,urllib.request
          repo=os.environ['PRIVATE_REPO']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo):
              raise SystemExit('Invalid private repository name')
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}',headers={
              'Authorization':'Bearer '+os.environ['PRIVATE_TOKEN'],
              'Accept':'application/vnd.github+json','User-Agent':'LOG-NL62R1-Private-Source'})
          with urllib.request.urlopen(req,timeout=25) as f:data=json.load(f)
          if data.get('private') is not True or data.get('visibility')=='public':
              raise SystemExit('REFUSING TO READ EDITORIAL MATERIAL FROM A PUBLIC REPOSITORY')
          print('PASS: approved source repository is private')
          PY_PRIVATE_VISIBILITY
      - name: Checkout approved articles and PDFs from PRIVATE source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.private_editorial_repo }}
          token: ${{ secrets.LOG_PRIVATE_EDITORIAL_READ_TOKEN }}
          ref: main
          path: .private-editorial
          sparse-checkout: |
            releases/2026/W10-W09
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Download immutable owner-approved NL59 fingerprints
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL59R1-EDITORIAL-FINGERPRINTS-43117576037
          run-id: 43117576037
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl62_sources/nl59
      - name: Download immutable NL44 production V7 evidence
        uses: actions/download-artifact@v4
        with:
          name: LOG-W10-V7-WarRoom-RELEASE-42837956712
          run-id: 42837956712
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl62_sources/nl44
      - name: Download immutable NL45 starter scoring evidence
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL45R1-Offense-IDP-Scoring-Through-W9-42838026515
          run-id: 42838026515
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl62_sources/nl45
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5'
      - name: Run private article JSON to PDF renderer and after-render gate
        shell: bash
        env:
          WAR_WEEK: ${{ inputs.war_week }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/newsletters/nl59_fingerprint_engine.py scripts/newsletters/nl61_private_contract.py scripts/newsletters/nl58_score_validator.py scripts/newsletters/nl62_renderer.py scripts/newsletters/nl62_integrate.py
          python3 scripts/newsletters/nl62_integrate.py \
            --private .private-editorial/releases/2026/W10-W09 \
            --ledger nl62_sources/nl59/NL59R1-FINGERPRINT-LEDGER.json \
            --data-root nl62_sources \
            --war-week "$WAR_WEEK" \
            --nl44-run-id 42837956712 \
            --nl45-run-id 42838026515 \
            --out nl62_report
          test -s nl62_report/NL62R1-PROTECTED-INTEGRATION.json
          if grep -q '"release_authorized": true' nl62_report/NL62R1-PROTECTED-INTEGRATION.json; then
            echo 'Unsafe release authorization detected' >&2
            exit 1
          fi
      - name: Upload hashes-only QA (never upload private content or PDFs)
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL62R1-PROTECTED-INTEGRATION-PREVIEW-${{ github.run_id }}
          path: nl62_report/
          retention-days: 90
          if-no-files-found: error
      - name: Summarize preview outcome and blockers
        shell: bash
        run: |
          cat nl62_report/NL62R1-PROTECTED-INTEGRATION.md >> "$GITHUB_STEP_SUMMARY"
          echo 'NO PDF RELEASE. No owner-signed historical cold-start exception. NL47 production remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
