                      )
              if non_idp_diffs:
                  raise AssertionError(f"non-IDP final values changed: {non_idp_diffs[:10]}")
          '''
          new_nonidp = '''    # After the approved offense successor, QB/RB/WR/TE may move.
              # K and all other non-IDP positions remain strict exact holds.
              non_idp_diffs = []
              offense_successor_value_changes = 0
              for key, old in old_values.items():
                  if old["pos"] in IDP_POSITIONS:
                      continue
                  if current_values[key]["value"] == old["value"]:
                      continue
                  if offense_release is not None and old["pos"] in OFFENSE_POSITIONS:
                      offense_successor_value_changes += 1
                      continue
                  non_idp_diffs.append(
                      (key, old["value"], current_values[key]["value"])
                  )
              if non_idp_diffs:
                  raise AssertionError(
                      f"unexpected non-IDP final values changed outside approved offense successor: "
                      f"{non_idp_diffs[:10]}"
                  )
          '''
          if old_nonidp not in text:
              raise RuntimeError('non-IDP invariance block anchor missing')
          text = text.replace(old_nonidp, new_nonidp, 1)

          result_anchor = '''        "provisional_4for4_changed_entry_count": (
                      int(provisional_release.get("raw_prod_mult_changed_count", 0))
                      if provisional_release is not None else 0
                  ),
          '''
          result_insert = result_anchor + '''        "provisional_4for4_offense_overlay_active": offense_release is not None,
                  "provisional_4for4_offense_changed_entry_count": (
                      int(offense_release.get("raw_prod_mult_changed_count", 0))
                      if offense_release is not None else 0
                  ),
                  "provisional_4for4_offense_eligible_count": (
                      int(offense_release.get("eligible_count", 0))
                      if offense_release is not None else 0
                  ),
                  "provisional_4for4_offense_green_shadow_sha256": (
                      offense_release.get("green_shadow_aggregate_contract_sha256")
                      if offense_release is not None else None
                  ),
                  "offense_successor_final_value_changes": offense_successor_value_changes,
          '''
          if result_anchor not in text:
              raise RuntimeError('validator result anchor missing')
          text = text.replace(result_anchor, result_insert, 1)

          report_anchor = '''        f"- Provisional 4for4 changed PROD_MULT entries: **{result['provisional_4for4_changed_entry_count']}**",
          '''
          report_insert = report_anchor + '''        f"- Provisional 4for4 offense 10% successor active: **{result['provisional_4for4_offense_overlay_active']}**",
                  f"- Provisional 4for4 offense eligible players: **{result['provisional_4for4_offense_eligible_count']}**",
                  f"- Provisional 4for4 offense changed PROD_MULT entries: **{result['provisional_4for4_offense_changed_entry_count']}**",
                  f"- Provisional 4for4 offense final-value changes: **{result['offense_successor_final_value_changes']}**",
          '''
          if report_anchor not in text:
              raise RuntimeError('validator report anchor missing')
          text = text.replace(report_anchor, report_insert, 1)

          old_release_note = '- Offense values are confirmed unchanged.'
          new_release_note = (
              '- Offense values are unchanged through IDP V1/Position Lineage/IDP 4for4; '
              'when the approved 4for4 offense successor is active, its full-table hash '
              'and aggregate release contract are validated separately.'
          )
          if old_release_note not in text:
              raise RuntimeError('validator release-attribution anchor missing')
          text = text.replace(old_release_note, new_release_note, 1)

          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          print('PASS: permanent successor validator extended for 4for4 offense 10% layer.')
          PY
          python3 /tmp/patch-offense-successor-validator.py
          python3 -m py_compile scripts/validation/validate_idp_v1_final_deployment.py

