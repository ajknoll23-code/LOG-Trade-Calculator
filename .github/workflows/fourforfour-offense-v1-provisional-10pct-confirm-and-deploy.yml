name: 4for4 Offense V1 - Provisional 10% Confirm and Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  offense-provisional-10pct-confirm-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Pin exact green shadow and current successor base
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git blob drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
            echo "PASS git-blob $path $actual"
          }

          check_blob 4cd06b20687b74a4b5cc8747f63605891db061bd .github/workflows/fourforfour-offense-v1-phase-o1-shadow.yml
          check_blob 3a13379cb6827bec7f412ec25a9163d8897ef975 index.html
          check_blob e0b5bd34e63aaf36a86bde7ccee15ec3500639c5 free-agent-board.html
          check_blob d115ece8ba7e1552b99f18c053c1c9141da47a2b scripts/validation/validate_idp_v1_final_deployment.py
          check_blob 2333c23fdf51abe8f44b6a9f29952fe509e7501d scripts/validation/repo_regression_checks.py
          check_blob 7feec5c3318d03aab0808353f23a4bb381eb4a3c scripts/sync/sync_free_agent_valuation.py
          check_blob bf03ccc46a6219e5d3d7e465faac9e1665dd94c6 scripts/validation/validate_free_agent_valuation_parity.py
          check_blob bd06f66facb602d36307e0f9e88db013a3576726 research/production-v2/production_v2_phase1_audit.py
          check_blob 1efca4c35e910a95974c1bec0b06a106196618b3 scripts/validation/snapshot_values.py
          check_blob b01b938abbfec224c30604b1e34dc5bb9a94ccf0 scripts/model/production_history_component.py
          check_blob b2affac777de89fca88301a07b16f39482c8dcdd scripts/projections/build_team_utility_lineup_projections.py
          check_blob f89cd9b45d32048fddcba036560a65f65ca9cf55 scripts/fantasypros_api_normalized_2026.json
          check_blob ce38aa08adbad4aca3f64b409eb32b96a6705565 scripts/sleeper_2026_projections.json
          check_blob 509319dae9b529af0ad6ba7ead7d48f4d7598d74 scripts/artifacts/generated/sleeper_2026_raw_categories.json
          check_blob 94fa8e916396403eece890fcfed8221ad4cf1b58 scripts/identity_crosswalk.json
          check_blob 586651a5e27f72de78a6cc49343ee8881395ff91 scripts/ppg_results.json
          check_blob 17dfa0970365e90296acc9bb4d406aa65c23bdf4 scripts/durability_results.json
          check_blob 3f316d8d83e1d3b72cfcdb8b24cb683770abc2b4 scripts/model/ppg_pipeline.py
          check_blob fa1c4a5862c51f20ae3dc38edb4a45852457b979 model/releases/fourforfour-idp-provisional-10pct-v1/release.json

          python3 research/production-v2/production_v2_phase1_audit.py --selftest
          python3 scripts/validation/validate_idp_v1_final_deployment.py
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          git diff --exit-code -- .

          echo 'PASS: exact green O1 shadow and current production successor base pinned.'

      - name: Decode exact private 4for4 offense export
        shell: bash
        run: |
          set -euo pipefail

          for var in FOURFORFOUR_OFFENSE_GZ_B64_PART1 FOURFORFOUR_OFFENSE_GZ_B64_PART2 FOURFORFOUR_OFFENSE_GZ_B64_PART3; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret $var is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-fourforfour-offense-v1/input
          printf '%s%s%s' \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-offense-v1/input/offense.csv
          chmod 600 /tmp/log-fourforfour-offense-v1/input/offense.csv

          echo '488f8b7bf74b5e30ed515c7cde4b2049d1af6ad0d953ae7f78fd82561293af11  /tmp/log-fourforfour-offense-v1/input/offense.csv' \
            | sha256sum --check --strict

          echo 'PASS: exact private 4for4 offense export verified.'

