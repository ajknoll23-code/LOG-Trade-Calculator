      - name: Prove exact deployment scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('model/releases/fourforfour-offense-provisional-10pct-v1/release.json')
          release = json.loads(path.read_text(encoding='utf-8'))

          assert release['release_id'] == 'fourforfour-offense-provisional-10pct-v1'
          assert release['green_shadow_aggregate_contract_sha256'] == '17396075883e56f4eff39d574fd0c2011e742a787b91404b37b7470133b143a5'
          assert release['private_input_sha256'] == '488f8b7bf74b5e30ed515c7cde4b2049d1af6ad0d953ae7f78fd82561293af11'
          assert release['private_row_level_4for4_output_persisted'] is False
          assert release['realized_outcomes_used'] is False
          assert release['eligible_count'] == 274
          assert release['raw_prod_mult_changed_count'] == 237
          assert release['eligible_by_position'] == {'QB':48,'RB':82,'TE':38,'WR':106}
          assert release['raw_prod_mult_changed_by_position'] == {'QB':42,'RB':70,'TE':33,'WR':92}
          assert release['green_shadow_impact']['bounded_provisional_safety_gate_pass'] is True

          forbidden = {
              'player', 'player_name', 'source_player_name', 'sleeper_id',
              'fantasypros_id', 'pid', 'source_row_sha256',
              'raw_category_season_totals', 'raw_stats_used',
              'candidate_overrides', 'players',
          }
          def walk(v, p='$'):
              if isinstance(v, dict):
                  for k, child in v.items():
                      if k in forbidden:
                          raise RuntimeError(f'forbidden row-level release key at {p}.{k}')
                      walk(child, f'{p}.{k}')
              elif isinstance(v, list):
                  for i, child in enumerate(v):
                      walk(child, f'{p}[{i}]')
          walk(release)
          print('PASS: offense successor release manifest is aggregate-only.')
          PY

          mapfile -t changed < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            "free-agent-board.html"
            "index.html"
            "model/releases/fourforfour-offense-provisional-10pct-v1/release.json"
            "scripts/validation/validate_idp_v1_final_deployment.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if [ "${#changed[@]}" -ne "${#expected_sorted[@]}" ]; then
            echo 'ERROR: deployment changed an unexpected number of files.' >&2
            printf 'Changed files:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          for i in "${!expected_sorted[@]}"; do
            if [ "${changed[$i]}" != "${expected_sorted[$i]}" ]; then
              echo 'ERROR: deployment file scope mismatch.' >&2
              printf 'Changed files:\n%s\n' "${changed[*]}" >&2
              exit 1
            fi
          done

          echo 'PASS: exactly four intended offense successor artifacts changed.'
          printf '%s\n' "${changed[@]}"

