      - name: Regression and read-only proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md
          if ! git diff --quiet -- .; then
            echo 'ERROR: confidence C1 modified tracked files.' >&2
            git diff -- .
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'ERROR: confidence C1 created repo files.' >&2
            git status --porcelain --untracked-files=all
            exit 1
          fi
          echo 'PASS: confidence C1 left repository unchanged.'

      - name: Destroy private working data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-offense-v1
          rm -f /tmp/confidence-c1-append.py.b64 /tmp/confidence-c1.py
          echo 'PASS: private 4for4 working data destroyed.'
