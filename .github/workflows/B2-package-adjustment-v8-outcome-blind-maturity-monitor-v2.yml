name: B2 Package Adjustment V8 - Outcome-Blind Maturity Monitor V2

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-adjustment-v8-development-maturity-monitor-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install monitor dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V8 voting contract and live transport semantics
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          # Only immutable V8 research-contract artifacts are blob-pinned.
          # Shared runtime files are checked semantically below so unrelated,
          # approved production deployments (for example Draft Pick FV V10)
          # cannot create a false monitor failure.
          declare -A EXPECTED=(
            ["research/package-adjustment-v8/development_voting_activation_manifest_v1.json"]="938bf754c90adeda8f3a5f863acfda8967c3818d"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/voting_randomization_schedule_v1.json"]="c499d85b8473798294eccfe9310ec9644c1db3fc"
            ["research/package-adjustment-v8/voting_integrity_contract_v1.json"]="203fd97e27e31413b5c18e3f8c7ecd6fd06cfeb8"
            ["research/package-adjustment-v8/validate_voting_dataset_v1.py"]="aaab7e8e4f8eb66a9a57503d8185c0bf77acba71"
          )
          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: frozen V8 contract drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          act=json.loads((d/"development_voting_activation_manifest_v1.json").read_text())
          cat=json.loads((d/"package_vote_challenges_v8_development_v1.json").read_text())
          sched=json.loads((d/"voting_randomization_schedule_v1.json").read_text())
          integrity=json.loads((d/"voting_integrity_contract_v1.json").read_text())

          assert act["status"]=="V8_DEVELOPMENT_VOTING_ACTIVATED"
          assert act["research_only"] is True
          assert act["candidate_fit_performed"] is False
          assert act["candidate_scores_read"] is False
          assert act["v8_vote_outcomes_read_at_activation"] is False
          assert act["production_change_authorized"] is False
          assert act["accepted_complete_voters_exactly"]==50
          assert act["accepted_ballots_exactly"]==2000
          assert act["challenges_per_voter"]==40
          assert act["accepted_voter_slots_exactly_1_to_50"] is True
          assert act["early_stop_before_50"] is False
          assert act["left_right_balance_each_challenge"]=="25/25"

          assert act["catalog_sha256"]==hashlib.sha256(
              (d/"package_vote_challenges_v8_development_v1.json").read_bytes()
          ).hexdigest()
          assert act["schedule_sha256"]==hashlib.sha256(
              (d/"voting_randomization_schedule_v1.json").read_bytes()
          ).hexdigest()

          assert cat["status"]=="FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED"
          assert cat["voting_activated"] is False
          assert cat["challenge_count"]==40

          assert sched["status"]=="FROZEN_PRE_VOTE"
          assert sched["accepted_voter_slots"]==50
          assert sched["challenges"]==40
          assert sched["left_right_balance_per_challenge"]=={"A_left":25,"B_left":25}
          assert sched["v8_votes_read"] is False

          assert integrity["status"]=="FROZEN_PRE_VOTE"
          assert integrity["accepted_voters"]==50
          assert integrity["accepted_ballots"]==2000
          assert integrity["challenges_per_voter"]==40
          assert integrity["complete_session_required"] is True
          assert integrity["incomplete_sessions_count_toward_maturity"] is False
          assert integrity["duplicate_ballots_allowed"] is False
          assert integrity["early_stop_before_50"] is False
          assert integrity["maturity_monitor_outcome_blind"] is True

          # Shared/live files: validate only the V8 transport contract we need.
          html=Path("index.html").read_text(encoding="utf-8")
          for token in (
              "Package Adjustment V8 Development Voting.",
              "__pkgv8dev__|",
              "__pkgv8dev_meta__|",
              "__pkgv8dev_schema__|1",
              "const PACKAGE_VOTE_TOTAL_SLOTS = 50;",
              "pkgv8slot",
          ):
              assert token in html, token

          ktc=Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          assert '"__pkgv8dev__|"' in ktc

          reg=Path("scripts/validation/repo_regression_checks.py").read_text(encoding="utf-8")
          assert '"__pkgv8dev__|"' in reg
          assert "PASS V8 frozen 50-slot package sampling contract:" in reg

          print("PASS: frozen V8 contract exact; current live V8 transport semantics intact.")
          PY

          python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test fixed-50 outcome-blind maturity arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter,defaultdict

          IDS=[f"c{i:02d}" for i in range(40)]
          SLOTS=set(range(1,51))

          def assess(rows):
              by_voter=defaultdict(list)
              pair_counts=Counter()
              for r in rows:
                  by_voter[r["voter"]].append(r)
                  pair_counts[(r["voter"],r["cid"])]+=1

              complete=[]
              invalid=[]
              for voter,vr in by_voter.items():
                  slots={r["slot"] for r in vr}
                  reasons=[]
                  if len(slots)!=1:
                      reasons.append("multiple_slots")
                  if any(pair_counts[(voter,cid)]>1 for cid in IDS):
                      reasons.append("duplicate_voter_challenge")
                  if len(vr)!=40:
                      reasons.append("not_exactly_40_rows")
                  if {r["cid"] for r in vr}!=set(IDS):
                      reasons.append("challenge_set_mismatch")
                  if reasons:
                      invalid.append((voter,reasons))
                      continue
                  slot=next(iter(slots))
                  if slot not in SLOTS:
                      invalid.append((voter,["slot_out_of_range"]))
                      continue
                  ordered=sorted(vr,key=lambda x:x["order"])
                  if [r["order"] for r in ordered]!=list(range(40)):
                      invalid.append((voter,["order_not_0_to_39"]))
                      continue
                  complete.append((voter,slot))

              slot_to_voters=defaultdict(list)
              for voter,slot in complete:
                  slot_to_voters[slot].append(voter)
              collisions={s:v for s,v in slot_to_voters.items() if len(v)>1}
              accepted_slots={s for s,v in slot_to_voters.items() if len(v)==1}
              mature=(accepted_slots==SLOTS and not collisions and len(complete)==50)
              return mature,accepted_slots,collisions,invalid

          rows=[]
          for slot in range(1,51):
              voter=f"v{slot}"
              for order,cid in enumerate(IDS):
                  rows.append({"voter":voter,"slot":slot,"cid":cid,"order":order})

          m,slots,collisions,invalid=assess(rows)
          assert m and slots==SLOTS and not collisions and not invalid
          assert assess(rows[:-1])[0] is False
          assert assess(list(rows)+[dict(rows[0])])[0] is False

          collision=list(rows)
          collision.extend(
              {"voter":"other","slot":1,"cid":cid,"order":order}
              for order,cid in enumerate(IDS)
          )
          assert assess(collision)[0] is False
          assert 1 in assess(collision)[2]

          multislot=list(rows)
          multislot[0]=dict(multislot[0],slot=2)
          assert assess(multislot)[0] is False

          print("PASS: fixed-50 maturity arithmetic self-test.")
          PY

      - name: Build outcome-blind maturity report
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v8-development-maturity
          mkdir -p /tmp/package-adjustment-v8-development-maturity

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import re
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          import requests

          ROOT=Path.cwd()
          D=ROOT/"research/package-adjustment-v8"
          OUT=Path("/tmp/package-adjustment-v8-development-maturity")

          SHEET_URL=(
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def parse_utc(value):
              s=str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s=s[:-1]+"+00:00"
              try:
                  dt=datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt=dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          act=load(D/"development_voting_activation_manifest_v1.json")
          cat=load(D/"package_vote_challenges_v8_development_v1.json")
          sched=load(D/"voting_randomization_schedule_v1.json")

          assert act["status"]=="V8_DEVELOPMENT_VOTING_ACTIVATED"
          assert act["v8_vote_outcomes_read_at_activation"] is False
          assert act["candidate_fit_performed"] is False
          assert act["candidate_scores_read"] is False
          assert act["production_change_authorized"] is False
          assert act["accepted_complete_voters_exactly"]==50
          assert act["accepted_ballots_exactly"]==2000
          assert act["early_stop_before_50"] is False

          VOTE_PREFIX="__pkgv8dev__|"
          SCHEMA_MARKER="__pkgv8dev_schema__|1"
          cutoff=parse_utc(act["valid_ballot_start_utc"])
          assert cutoff is not None

          challenges={str(c["id"]):c for c in cat["challenges"]}
          assert len(challenges)==40
          challenge_ids=set(challenges)
          expected_slots=set(range(1,51))

          # Confirm this monitor uses the same published Sheet source as KTC transport.
          ktc_text=(ROOT/"scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          assert f'SHEET_CSV_URL = "{SHEET_URL}"' in ktc_text
          assert '"__pkgv8dev__|"' in ktc_text

          generated_at=datetime.now(timezone.utc)
          resp=requests.get(SHEET_URL,timeout=30)
          resp.raise_for_status()
          source_bytes=resp.content
          source_rows=list(csv.DictReader(io.StringIO(resp.text)))
          sheet_sha256=hashlib.sha256(source_bytes).hexdigest()

          # A/B display token is validated but intentionally not retained.
          meta_re=re.compile(
              r"^__pkgv8dev_meta__\|[AB]\|"
              r"([1-9]|[1-4][0-9]|50)\|"
              r"([0-9]|[1-2][0-9]|3[0-9])$"
          )

          excluded=Counter()
          structural=[]
          raw_namespace_rows=0

          for source_index,row in enumerate(source_rows):
              keep=str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue
              raw_namespace_rows+=1

              ts=parse_utc(row.get("timestamp"))
              if ts is None:
                  excluded["invalid_timestamp"]+=1
                  continue
              if ts<=cutoff:
                  excluded["pre_activation_or_at_cutoff"]+=1
                  continue
              if ts>generated_at:
                  excluded["future_timestamp"]+=1
                  continue

              voter=str(row.get("voter_roster_id") or "").strip()
              if not voter:
                  excluded["missing_voter_id"]+=1
                  continue

              # OUTCOME-BLIND: read only challenge id before the first delimiter.
              # The A/B human choice payload after it is never parsed or stored.
              payload=keep[len(VOTE_PREFIX):]
              challenge_id,sep,_ignored_choice_payload=payload.partition("|")
              if not sep:
                  excluded["malformed_vote_transport"]+=1
                  continue
              challenge_id=challenge_id.strip()
              if challenge_id not in challenges:
                  excluded["unknown_challenge_id"]+=1
                  continue

              meta=str(row.get("trade") or "")
              mm=meta_re.fullmatch(meta)
              if not mm:
                  excluded["invalid_meta_transport"]+=1
                  continue
              slot=int(mm.group(1))
              display_order=int(mm.group(2))

              if str(row.get("cut") or "")!=SCHEMA_MARKER:
                  excluded["invalid_schema_marker"]+=1
                  continue

              spec=sched["slots"][str(slot)]
              if challenge_id not in spec["challenge_order"]:
                  excluded["challenge_not_in_slot_schedule"]+=1
                  continue
              expected_order=spec["challenge_order"].index(challenge_id)
              if display_order!=expected_order:
                  excluded["display_order_schedule_mismatch"]+=1
                  continue

              structural.append({
                  "timestamp":ts,
                  "source_index":source_index,
                  "voter":voter,
                  "challenge_id":challenge_id,
                  "slot":slot,
                  "display_order":display_order,
              })

          structural.sort(key=lambda r:(r["timestamp"],r["source_index"]))

          by_voter=defaultdict(list)
          pair_counts=Counter()
          for r in structural:
              by_voter[r["voter"]].append(r)
              pair_counts[(r["voter"],r["challenge_id"])]+=1

          session_rows=[]
          complete_sessions=[]
          incomplete_sessions=[]
          invalid_sessions=[]

          for voter,rows in by_voter.items():
              reasons=[]
              slots={r["slot"] for r in rows}
              if len(slots)!=1:
                  reasons.append("multiple_slots")
              duplicate_n=sum(
                  1 for cid in challenge_ids
                  if pair_counts[(voter,cid)]>1
              )
              if duplicate_n:
                  reasons.append("duplicate_voter_challenge")
              if len(rows)!=40:
                  reasons.append("not_exactly_40_structural_rows")
              observed={r["challenge_id"] for r in rows}
              if observed!=challenge_ids:
                  reasons.append("challenge_set_mismatch")

              slot=next(iter(slots)) if len(slots)==1 else None
              if slot is not None:
                  spec=sched["slots"][str(slot)]
                  by_order=sorted(rows,key=lambda r:r["display_order"])
                  if [r["display_order"] for r in by_order]!=list(range(40)):
                      reasons.append("display_order_not_exactly_0_to_39")
                  elif [r["challenge_id"] for r in by_order]!=spec["challenge_order"]:
                      reasons.append("challenge_order_schedule_mismatch")

              voter_hash=hashlib.sha256(
                  ("v8-maturity-voter|"+voter).encode()
              ).hexdigest()[:16]

              record={
                  "voter_hash":voter_hash,
                  "slot":slot,
                  "structural_row_count":len(rows),
                  "unique_challenge_count":len(observed),
                  "duplicate_challenge_count":duplicate_n,
                  "complete":not reasons,
                  "invalid_reasons":reasons,
              }
              session_rows.append(record)

              if not reasons:
                  complete_sessions.append((voter,slot))
              elif (
                  "multiple_slots" in reasons
                  or "duplicate_voter_challenge" in reasons
                  or "display_order_not_exactly_0_to_39" in reasons
                  or "challenge_order_schedule_mismatch" in reasons
              ):
                  invalid_sessions.append(record)
              else:
                  incomplete_sessions.append(record)

          slot_to_voters=defaultdict(list)
          for voter,slot in complete_sessions:
              slot_to_voters[slot].append(voter)

          slot_collisions={
              str(slot):len(voters)
              for slot,voters in sorted(slot_to_voters.items())
              if len(voters)>1
          }
          accepted_slots={
              slot for slot,voters in slot_to_voters.items()
              if len(voters)==1
          }

          accepted_complete_voters=len(accepted_slots)
          accepted_ballots=accepted_complete_voters*40
          missing_slots=sorted(expected_slots-accepted_slots)

          if invalid_sessions:
              decision="HOLD_INVALID_SESSION_STRUCTURE"
          elif slot_collisions:
              decision="HOLD_SLOT_COLLISION"
          elif accepted_slots==expected_slots and len(complete_sessions)==50:
              decision="STOP_AND_FREEZE_EXACT_50_COMPLETE_VOTERS"
          else:
              decision="CONTINUE_TO_EXACT_50_COMPLETE_VOTERS"

          report={
              "schema_version":2,
              "study_id":act["study_id"],
              "stage":"development_outcome_blind_maturity_monitor_v2",
              "status":decision,
              "decision":decision,
              "generated_at_utc":generated_at.isoformat(),
              "outcome_blind":True,
              "human_choice_payload_read":False,
              "human_choice_payload_stored":False,
              "human_choice_payload_counted":False,
              "candidate_scores_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
              "display_side_value_retained":False,
              "contract":{
                  "accepted_complete_voters_exactly":50,
                  "accepted_ballots_exactly":2000,
                  "challenges_per_voter":40,
                  "accepted_voter_slots_exactly_1_to_50":True,
                  "complete_session_required":True,
                  "incomplete_sessions_count_toward_maturity":False,
                  "duplicate_ballots_allowed":False,
                  "early_stop_before_50":False,
                  "left_right_balance_each_challenge":"25/25",
              },
              "source":{
                  "sheet_sha256":sheet_sha256,
                  "source_csv_row_count":len(source_rows),
                  "raw_v8_namespace_rows":raw_namespace_rows,
                  "structurally_valid_rows":len(structural),
                  "activation_cutoff_utc":cutoff.isoformat(),
              },
              "exclusions":dict(sorted(excluded.items())),
              "current":{
                  "distinct_structural_voters":len(by_voter),
                  "complete_session_voters_before_slot_collision_filter":len(complete_sessions),
                  "accepted_complete_voters":accepted_complete_voters,
                  "accepted_ballots":accepted_ballots,
                  "completed_unique_slots":len(accepted_slots),
                  "missing_slot_count":len(missing_slots),
                  "missing_slots":missing_slots,
                  "incomplete_session_count":len(incomplete_sessions),
                  "invalid_session_count":len(invalid_sessions),
                  "slot_collision_count":len(slot_collisions),
                  "slot_collisions":slot_collisions,
              },
              "sessions":sorted(
                  session_rows,
                  key=lambda r:(
                      r["slot"] if r["slot"] is not None else 999,
                      r["voter_hash"],
                  )
              ),
          }

          serialized=json.dumps(report,sort_keys=True).lower()
          for forbidden in (
              "human_choice_left",
              "canonical_choice",
              "side_a_votes",
              "side_b_votes",
              "choice_pct",
              "winner_model",
              "candidate_log_loss",
              "candidate_minus",
              "selected_candidate",
              "fit_parameter",
          ):
              assert forbidden not in serialized,forbidden

          (OUT/"maturity.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )

          lines=[
              "# Package Adjustment V8 — Outcome-Blind Development Maturity V2",
              "",
              f"**Decision:** `{decision}`",
              "",
              "**Human A/B vote choice was not parsed, stored, counted, compared, or serialized.**",
              "",
              f"- Accepted complete voters: **{accepted_complete_voters} / 50**",
              f"- Accepted ballots represented by complete slots: **{accepted_ballots} / 2000**",
              f"- Completed unique voter slots: **{len(accepted_slots)} / 50**",
              f"- Missing slots: **{len(missing_slots)}**",
              f"- Incomplete sessions: **{len(incomplete_sessions)}**",
              f"- Invalid sessions: **{len(invalid_sessions)}**",
              f"- Slot collisions: **{len(slot_collisions)}**",
              "",
          ]
          if missing_slots:
              lines.append("Missing slot numbers: "+", ".join(map(str,missing_slots)))
              lines.append("")
          if slot_collisions:
              lines.append("Collided slots: "+", ".join(
                  f"{s} ({n} complete voters)" for s,n in slot_collisions.items()
              ))
              lines.append("")
          lines += [
              "## Isolation",
              "",
              "- Human A/B choice payload is ignored after extracting challenge id.",
              "- Display-side value is not retained.",
              "- Slot/display-order metadata are checked only against the frozen schedule.",
              "- No evaluator, candidate score, model fit, or production result is opened.",
              "- Incomplete sessions do not count toward maturity.",
              "- Duplicate voter/challenge rows fail the session closed.",
              "- Maturity requires exactly one complete accepted voter on every frozen slot 1–50.",
              "",
          ]
          (OUT/"maturity.md").write_text("\n".join(lines),encoding="utf-8")

          print(json.dumps({
              "decision":decision,
              "accepted_complete_voters":accepted_complete_voters,
              "accepted_ballots":accepted_ballots,
              "completed_unique_slots":len(accepted_slots),
              "missing_slot_count":len(missing_slots),
              "incomplete_session_count":len(incomplete_sessions),
              "invalid_session_count":len(invalid_sessions),
              "slot_collision_count":len(slot_collisions),
              "human_choice_payload_read":False,
              "candidate_scores_read":False,
          },indent=2))
          PY

      - name: Prove report is outcome-blind and fixed-50 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path("/tmp/package-adjustment-v8-development-maturity/maturity.json").read_text())

          assert d["outcome_blind"] is True
          assert d["human_choice_payload_read"] is False
          assert d["human_choice_payload_stored"] is False
          assert d["human_choice_payload_counted"] is False
          assert d["candidate_scores_read"] is False
          assert d["candidate_fit_performed"] is False
          assert d["production_change_authorized"] is False
          assert d["display_side_value_retained"] is False

          assert d["contract"]=={
              "accepted_complete_voters_exactly":50,
              "accepted_ballots_exactly":2000,
              "challenges_per_voter":40,
              "accepted_voter_slots_exactly_1_to_50":True,
              "complete_session_required":True,
              "incomplete_sessions_count_toward_maturity":False,
              "duplicate_ballots_allowed":False,
              "early_stop_before_50":False,
              "left_right_balance_each_challenge":"25/25",
          }

          if d["decision"]=="STOP_AND_FREEZE_EXACT_50_COMPLETE_VOTERS":
              assert d["current"]["accepted_complete_voters"]==50
              assert d["current"]["accepted_ballots"]==2000
              assert d["current"]["completed_unique_slots"]==50
              assert d["current"]["missing_slot_count"]==0
              assert d["current"]["incomplete_session_count"]==0
              assert d["current"]["invalid_session_count"]==0
              assert d["current"]["slot_collision_count"]==0

          print("PASS: report is outcome-blind and cannot stop before exact 50 complete slots.")
          PY

      - name: Upload V8 maturity report
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v8-development-maturity-v2
          path: /tmp/package-adjustment-v8-development-maturity
          if-no-files-found: error
          retention-days: 30
