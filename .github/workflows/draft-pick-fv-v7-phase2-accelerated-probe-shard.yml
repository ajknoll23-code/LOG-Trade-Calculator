              "def _throttle():\n    global _LAST_MFL_REQUEST_AT\n    elapsed=time.monotonic()-_LAST_MFL_REQUEST_AT\n    if elapsed < MFL_MIN_INTERVAL:\n        time.sleep(MFL_MIN_INTERVAL-elapsed)\n    _LAST_MFL_REQUEST_AT=time.monotonic()\n\ndef _request_once(session,url):\n    current=url; seen=set()\n    for hop in range(MFL_MAX_REDIRECTS+1):\n        _throttle()\n        r=session.get(current,timeout=(25,90),allow_redirects=False)"
            ),
          ]
          for old,new in replacements:
              n=t.count(old); assert n==1,(old[:100],n); t=t.replace(old,new,1)
          p.write_text(t); compile(t,str(p),'exec')

          def fhash(text,name):
              tree=ast.parse(text)
              node=next(x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name==name)
              seg=ast.get_source_segment(text,node)
              return hashlib.sha256(seg.encode()).hexdigest()
          for fn in ('mfl_get_json','probe_batch','aggregate_year','holdout'):
              assert fhash(original,fn)==fhash(t,fn),fn
          assert fhash(original,'_throttle')!=fhash(t,'_throttle')
          assert fhash(original,'_request_once')!=fhash(t,'_request_once')
          assert "request_start_to_request_start" in t
          print('PASS: only pacing clock + accelerated lineage changed; selection, retries, probe, aggregation and holdout logic unchanged.')
          PY2

      - name: Preflight accelerated engine
        shell: bash
        run: |
          set -euo pipefail
          E="${RUNNER_TEMP}/v7-phase2-r25-assets/build_r1_r6_source_identity_v7.py"
          python3 "$E" --selftest
          python3 "$E" --guard
          python3 - <<'PY2'
          import ast, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'v7-phase2-r25-assets/build_r1_r6_source_identity_v7.py'
          t=p.read_text(); lo=t.lower()
          forbidden=['api.sleeper.app/v1/stats','/stats/nfl/','r1_r4_development_outcomes_dob_repaired','r1_r4_historical_scored_universe','prospective_trade_evidence']
          for token in forbidden: assert token not in lo,token
          assert 'batch_size=25' in lo and 'mfl_min_interval=5.0' in lo and 'mfl_retries=12' in lo
          assert "_last_mfl_request_at=time.monotonic()" in lo
          req=t[t.index('def _request_once'):t.index('def mfl_get_json')]
          assert '_LAST_MFL_REQUEST_AT=time.monotonic()' not in req
          print('PASS: accelerated engine uses >=5s request-start spacing and unchanged retry/cooldown contract.')
          PY2

      - name: Copy exact frozen discoveries into current-run bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v7-phase2-r25-discoveries"
          cp "${RUNNER_TEMP}/prior-discoveries"/discovery_*.json "${RUNNER_TEMP}/v7-phase2-r25-discoveries/"
          test "$(find "${RUNNER_TEMP}/v7-phase2-r25-discoveries" -maxdepth 1 -type f -name 'discovery_*.json' | wc -l)" -eq 6

      - name: Upload patched engine and exact identity assets
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-accelerated-engine-assets
          overwrite: true
          path: |
            ${{ runner.temp }}/v7-phase2-r25-assets/build_r1_r6_source_identity_v7.py
            ${{ runner.temp }}/v7-phase2-r25-assets/db_playerids.csv
            ${{ runner.temp }}/v7-phase2-r25-assets/nflverse_players.csv
            ${{ runner.temp }}/v7-phase2-r25-assets/r1_r6_identity_asset_manifest_v7.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact six frozen discovery checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          overwrite: true
          path: ${{ runner.temp }}/v7-phase2-r25-discoveries/discovery_*.json
          if-no-files-found: error
          retention-days: 14


  plan_shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      years_csv: ${{ steps.plan.outputs.years_csv }}
      reused_count: ${{ steps.plan.outputs.reused_count }}
      missing_count: ${{ steps.plan.outputs.missing_count }}

    steps:
      - name: Download current-attempt frozen discovery bundle
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/discoveries

      - name: Download exact three green checkpoints from cancelled R25 run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10830973334,10830739613,10832554808
          path: ${{ runner.temp }}/prior-r25-probes
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36052205794

      - name: Revalidate exact prior greens and build shard chunk matrix
        id: plan
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os, re
          from pathlib import Path

          shard=os.environ['SHARD']
          shard_years={'A':(2018,2021),'B':(2019,2022),'C':(2020,2023)}
          assert shard in shard_years
          years=shard_years[shard]
          root=Path(os.environ['RUNNER_TEMP'])
          disc=root/'discoveries'; prior=root/'prior-r25-probes'
          frozen={}
          for y in range(2018,2024):
              d=json.loads((disc/f'discovery_{y}.json').read_text())
              ids=list(d['candidate_ids'])
              assert hashlib.sha256('\n'.join(ids).encode()).hexdigest()==d['candidate_ids_sha256']
              frozen[y]=ids

          expected_artifacts={
              (2018,1):('10830973334','490b591ccafbb81155e415cad97ff3f1e64f0a8198f2cda9c3101b18525fd091'),
              (2018,2):('10830739613','2abce7b910c0f3d18a4d39ac62a1a523c4779cd54e065fb41c6753440ac3bc07'),
              (2018,4):('10832554808','fdd18c0ca8e2abe5c8c1217f7ba12f27bfea1a68d1f639142b03bfc0a35475d8'),
          }
          reusable=set()
          rx=re.compile(r'^v7-p2-r25-probe-(20(?:18|19|20|21|22|23))-(\d+)$')
          dirs=[p for p in prior.iterdir() if p.is_dir()]
          assert len(dirs)==3,dirs
          for adir in sorted(dirs):
              m=rx.match(adir.name); assert m,adir.name
              y=int(m.group(1)); b=int(m.group(2)); key=(y,b)
              assert key in expected_artifacts,key
              files=list(adir.glob('batch_*.json')); assert len(files)==1,(adir,files)
              raw=files[0].read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected_artifacts[key][1]
              d=json.loads(raw); ids=frozen[y]
              expected=ids[b*25:min(len(ids),(b+1)*25)]
              assert d['draft_year']==y and d['batch_index']==b and d['batch_size']==25
              assert d['candidate_ids']==expected
              assert hashlib.sha256('\n'.join(expected).encode()).hexdigest()==d['candidate_ids_sha256']
              assert d['historical_source_search_performed'] is False
              for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
                  assert d[k] is False
              reusable.add(key)
          assert reusable==set(expected_artifacts)

          include=[]; missing_n=0; reused_in_shard=0; CHUNK=5
          for y in years:
              n=math.ceil(len(frozen[y])/25)
              yr_reuse={b for yy,b in reusable if yy==y}
              reused_in_shard += len(yr_reuse)
              missing=[b for b in range(n) if b not in yr_reuse]
              missing_n += len(missing)
              for ci in range(0,len(missing),CHUNK):
                  bs=missing[ci:ci+CHUNK]
                  include.append({'year':y,'chunk':ci//CHUNK,'batches':','.join(map(str,bs))})
          expected_total=sum(math.ceil(len(frozen[y])/25) for y in years)
          assert reused_in_shard+missing_n==expected_total
          matrix=json.dumps({'include':include},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix='+matrix+'\n')
              f.write('years_csv='+','.join(map(str,years))+'\n')
              f.write(f'reused_count={reused_in_shard}\n')
              f.write(f'missing_count={missing_n}\n')
          print(f'PASS: shard {shard} years={years}; reusable={reused_in_shard}; missing={missing_n}; chunks={len(include)}.')
          PY2

  probe:
    needs: [prepare, plan_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan_shard.outputs.matrix) }}

    steps:
      - name: Check out exact accelerated study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download current-attempt accelerated engine and identity assets
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-accelerated-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets

      - name: Download current-attempt frozen discoveries
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/discoveries

      - name: Preflight exact shard chunk
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          BATCHES: ${{ matrix.batches }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from pathlib import Path
          y=int(os.environ['YEAR']); bs=[int(x) for x in os.environ['BATCHES'].split(',') if x]
          assert 1<=len(bs)<=5 and len(bs)==len(set(bs))
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'discoveries'/f'discovery_{y}.json').read_text())
          ids=list(d['candidate_ids']); n=math.ceil(len(ids)/25)
          assert hashlib.sha256('\n'.join(ids).encode()).hexdigest()==d['candidate_ids_sha256']
          for b in bs: assert 0<=b<n and ids[b*25:min(len(ids),(b+1)*25)]
          print(f'PASS: shard chunk year={y} batches={bs}.')
          PY2

      - name: Probe exact missing R25 chunk
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          BATCHES: ${{ matrix.batches }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          Y="$YEAR"; mkdir -p "${RUNNER_TEMP}/probe"
          IFS=',' read -ra BS <<< "$BATCHES"
          case "$SHARD" in A) OFFSET=0;; B) OFFSET=2;; C) OFFSET=4;; *) exit 2;; esac
          sleep "$OFFSET"
          first_done=0
          for B in "${BS[@]}"; do
            if [ "$first_done" -eq 1 ]; then sleep 5; fi
            PAD="$(printf '%03d' "$B")"
            echo "=== Probe shard=$SHARD year=$Y batch=$B ==="
            python3 "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
              --probe-year "$Y" \
              --batch-index "$B" \
              --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json" \
              --dp "${RUNNER_TEMP}/v7-phase2-assets/db_playerids.csv" \
              --nflverse "${RUNNER_TEMP}/v7-phase2-assets/nflverse_players.csv" \
              --asset-manifest "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" \
              --out "${RUNNER_TEMP}/probe/batch_$PAD.json"
            first_done=1
          done

      - name: Validate shard chunk checkpoints
        if: success()
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          BATCHES: ${{ matrix.batches }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, math, os
          from pathlib import Path
          y=int(os.environ['YEAR']); bs=[int(x) for x in os.environ['BATCHES'].split(',') if x]
          root=Path(os.environ['RUNNER_TEMP']); frozen=json.loads((root/'discoveries'/f'discovery_{y}.json').read_text())
          ids=list(frozen['candidate_ids']); n=math.ceil(len(ids)/25)
          for b in bs:
              p=root/'probe'/f'batch_{b:03d}.json'; d=json.loads(p.read_text()); expected=ids[b*25:min(len(ids),(b+1)*25)]
              assert d['draft_year']==y and d['batch_index']==b and d['batch_count']==n and d['batch_size']==25
              assert d['candidate_ids']==expected
              assert hashlib.sha256('\n'.join(expected).encode()).hexdigest()==d['candidate_ids_sha256']
              assert d['historical_source_search_performed'] is False
              for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
                  assert d[k] is False
          print(f'PASS: shard chunk validated year={y} batches={bs}.')
          PY2

      - name: Upload shard chunk checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-p2-shard-${{ inputs.shard }}-probe-${{ matrix.year }}-${{ matrix.chunk }}
          overwrite: true
          path: ${{ runner.temp }}/probe/batch_*.json
          if-no-files-found: warn
          retention-days: 14

  aggregate_shard:
    needs: [prepare, plan_shard, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out exact accelerated study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.study_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install engine dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download current-attempt accelerated engine
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-accelerated-engine-assets
          path: ${{ runner.temp }}/v7-phase2-assets

      - name: Download current-attempt frozen discoveries
        uses: actions/download-artifact@v4
        with:
          name: v7-phase2-r25-frozen-discoveries
          path: ${{ runner.temp }}/discoveries

      - name: Download all shard probe artifacts across attempts
        uses: actions/download-artifact@v4
        with:
          pattern: v7-p2-shard-${{ inputs.shard }}-probe-*
          path: ${{ runner.temp }}/new
          merge-multiple: false

      - name: Download exact three prior green checkpoints
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10830973334,10830739613,10832554808
          path: ${{ runner.temp }}/prior-r25-probes
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36052205794

      - name: Merge exact-once coverage and aggregate shard years
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/years" "${RUNNER_TEMP}/assembled"
          python3 - <<'PY2'
          import hashlib, json, math, os, re, shutil
          from pathlib import Path
          shard=os.environ['SHARD']; years={'A':(2018,2021),'B':(2019,2022),'C':(2020,2023)}[shard]
          root=Path(os.environ['RUNNER_TEMP']); discroot=root/'discoveries'; newroot=root/'new'; prior=root/'prior-r25-probes'
          prior_by={}
          rx=re.compile(r'^v7-p2-r25-probe-(20(?:18|19|20|21|22|23))-(\d+)$')
          for adir in prior.iterdir():
              if not adir.is_dir(): continue
              m=rx.match(adir.name); assert m,adir.name
              y=int(m.group(1)); b=int(m.group(2)); fs=list(adir.glob('batch_*.json')); assert len(fs)==1
              prior_by[(y,b)]=fs[0]
          assert set(prior_by)=={(2018,1),(2018,2),(2018,4)}

          for y in years:
              disc=json.loads((discroot/f'discovery_{y}.json').read_text()); ids=list(disc['candidate_ids']); n=math.ceil(len(ids)/25)
              out=root/'assembled'/str(y); out.mkdir(parents=True,exist_ok=True)
              candidates=[]
              if y==2018: candidates += [prior_by[(2018,b)] for b in (1,2,4)]
              candidates += sorted(newroot.rglob('batch_*.json'))
              seen={}
              for p in candidates:
                  d=json.loads(p.read_text()); yy=int(d['draft_year']); b=int(d['batch_index'])
                  if yy!=y: continue
                  expected=ids[b*25:min(len(ids),(b+1)*25)]
                  assert d['batch_size']==25 and d['candidate_ids']==expected
                  assert hashlib.sha256('\n'.join(expected).encode()).hexdigest()==d['candidate_ids_sha256']
                  if b in seen:
                      assert p.read_bytes()==seen[b].read_bytes(),f'non-identical duplicate {y}/{b}'
                      continue
                  seen[b]=p; shutil.copy2(p,out/f'batch_{b:03d}.json')
              missing=sorted(set(range(n))-set(seen)); extra=sorted(set(seen)-set(range(n)))
              assert not missing and not extra,f'year={y} missing={missing} extra={extra}'
              flat=[]
              for b in range(n):
                  d=json.loads((out/f'batch_{b:03d}.json').read_text()); flat.extend(d['candidate_ids'])
              assert flat==ids and len(flat)==len(set(flat))
              print(f'PASS: shard {shard} year {y} exact-once coverage {len(ids)} candidates / {n} batches.')
          PY2

          IFS=',' read -ra YS <<< "${{ needs.plan_shard.outputs.years_csv }}"
          for Y in "${YS[@]}"; do
            python3 "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" \
              --aggregate-year "$Y" \
              --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json" \
              --batch-dir "${RUNNER_TEMP}/assembled/$Y" \
              --out "${RUNNER_TEMP}/years/year_$Y.json"
          done

      - name: Validate shard year outputs and write manifest
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          STUDY_SHA: ${{ needs.prepare.outputs.study_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); shard=os.environ['SHARD']
          years={'A':(2018,2021),'B':(2019,2022),'C':(2020,2023)}[shard]
          repo=Path.cwd(); d=repo/'research/draft-pick-fv-v7'; out=root/'years'
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for y in years:
              obj=json.loads((out/f'year_{y}.json').read_text())
              assert obj['draft_year']==y
              assert obj['discovery']['all_bounded_union_candidates_probed'] is True
              assert obj['discovery']['early_stopping_used'] is False
              assert obj['discovery']['search_errors']=={}
              for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
                  assert obj[k] is False
          man={
            'schema_version':1,'study_id':'draft-pick-fv-v7-r1-r6-full-scale-tail-continuity',
            'stage':'phase2_accelerated_probe_shard','shard':shard,'years':list(years),
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),'study_sha':os.environ['STUDY_SHA'],
            'source_slow_r25_run_id':36052205794,
            'reused_green_batches':['2018/1','2018/2','2018/4'] if 2018 in years else [],
            'accelerated_contract_sha256':sha(d/'r1_r6_phase2_accelerated_probe_resume_v7.json'),
            'accelerated_contract_manifest_sha256':sha(d/'r1_r6_phase2_accelerated_probe_resume_manifest_v7.json'),
            'engine_sha256':sha(root/'v7-phase2-assets/build_r1_r6_source_identity_v7.py'),
            'identity_asset_manifest_sha256':sha(root/'v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json'),
            'year_output_sha256':{str(y):sha(out/f'year_{y}.json') for y in years},
            'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,
            'candidate_fit_performed':False,'candidate_scores_computed':False,
            'candidate_selection_performed':False,'production_change_authorized':False,
          }
          (out/f'shard_{shard}_manifest.json').write_text(json.dumps(man,indent=2,sort_keys=True)+'\n')
          print(f'PASS: shard {shard} outputs validated and manifested.')
          PY2

      - name: Package shard engine for finalizer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/years/engine"
          cp "${RUNNER_TEMP}/v7-phase2-assets/build_r1_r6_source_identity_v7.py" "${RUNNER_TEMP}/years/engine/"
          cp "${RUNNER_TEMP}/v7-phase2-assets/db_playerids.csv" "${RUNNER_TEMP}/years/engine/"
          cp "${RUNNER_TEMP}/v7-phase2-assets/nflverse_players.csv" "${RUNNER_TEMP}/years/engine/"
          cp "${RUNNER_TEMP}/v7-phase2-assets/r1_r6_identity_asset_manifest_v7.json" "${RUNNER_TEMP}/years/engine/"

      - name: Upload completed shard years
        uses: actions/upload-artifact@v4
        with:
          name: v7-p2-accelerated-shard-${{ inputs.shard }}-years
          overwrite: true
          path: ${{ runner.temp }}/years
          if-no-files-found: error
          retention-days: 14

