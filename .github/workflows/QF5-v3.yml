# QF5 V3 — A7-F02 production gate for the exact successful V2R1 3-file review commit.
# DEFAULT mode=preflight is READ ONLY. Separate explicit owner-run promote required.
# Does NOT regenerate private inputs or re-estimate player values. Reviewed artifact is immutable.
name: QF5 V3 - Identity Production Preflight and Explicit Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight is READ ONLY; promote writes the approved three files to main'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'Promotion ONLY: type PROMOTE_QF5_R1B_THREE_FILES_TO_MAIN; blank for preflight'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF5_TMP: /tmp/log-qf5-v3
  QF5_MAIN_BASE: '7fc8dc9edba246ab88915851d1f70b3ef0b8f1b7'
  QF5_REVIEW_BRANCH: 'qf5-a7f02-v2r1-r1b-review-2026-10-11'
  QF5_REVIEW_SHA: '24cd5e7e9537ce61c165b74bb47f80a9c2345d07'
  QF5_WORKFLOW_PATH: '.github/workflows/QF5-v3.yml'
  QF5_APPROVED_SCRIPT: '.github/workflows/QF5-v2r1.yml'
  QF5_APPROVED_INDEX_BLOB: '2666f7f8b167e48b7d1571ab527450b521d32c75'
  QF5_CANDIDATE_BOARD_BLOB: '975efe51091a2315475678a9db0842b05c4fc3aa'
  QF5_CANDIDATE_VALIDATOR_BLOB: 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
  QF5_CANDIDATE_UTILITY_BLOB: '557b8010082a87113ecf9d5574af108f3044a1e7'

jobs:
  production-preflight:
    name: Read-only exact candidate validation (never pushes to main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact workflow-dispatch main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install already-reviewed validation/browser dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Fail-closed source, branch, ancestry and owner authorization gates
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP: only main may dispatch'; exit 1; }
          [[ "${RELEASE_MODE}" == preflight || "${RELEASE_MODE}" == promote ]] || { echo 'STOP: invalid mode'; exit 1; }
          if [[ "${RELEASE_MODE}" == promote ]]; then
            [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF5_R1B_THREE_FILES_TO_MAIN' ]] || { echo 'STOP: missing owner authorization'; exit 1; }
          else
            [[ -z "${RELEASE_CONFIRMATION}" ]] || { echo 'STOP: preflight confirmation must be blank'; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP: dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF5_REVIEW_BRANCH}:refs/remotes/origin/${QF5_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP: main moved'; exit 1; }
          [[ "$(git rev-parse origin/${QF5_REVIEW_BRANCH})" == "${QF5_REVIEW_SHA}" ]] || { echo 'STOP: review branch moved'; exit 1; }
          [[ "$(git rev-parse "${QF5_REVIEW_SHA}^")" == "${QF5_MAIN_BASE}" ]] || { echo 'STOP: review ancestry moved'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          run=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          baseline='7fc8dc9edba246ab88915851d1f70b3ef0b8f1b7'
          review='24cd5e7e9537ce61c165b74bb47f80a9c2345d07'
          # This preflight deliberately expires if Sleeper/Utility refreshes after review.
          # Deploying old rank cohorts onto a refreshed snapshot is unsafe.
          protected={
            'index.html':'2666f7f8b167e48b7d1571ab527450b521d32c75',
            'free-agent-board.html':'700c52db74c05b1122b4f0a48cf082243d98b0a7',
            'scripts/validation/validate_free_agent_valuation_parity.py':'bf03ccc46a6219e5d3d7e465faac9e1665dd94c6',
            'data/free_agent_utility_v1.json':'ab662a8c235e9302d60d3667c6f505aa2ecb2fe9',
            'data/free_agents.json':'7b36b98e8bbdd5fdd7ea23120d8ab62accb65b40',
            'scripts/projections/build_free_agent_utility_v1.py':'c1fb62c1c04b4b539fa74bff4ee038ec1a4cccc1',
            'scripts/validation/validate_free_agent_utility_v1.py':'bc30ff0bec940e06e8a358f7dc797434463b4684',
            'research/free-agent-utility-v1/free_agent_utility_v1_phase1.py':'1bb87f685c00e51a488a0c21510ccdca452e6b72',
            'scripts/identity_crosswalk.json':'3489c01c923474931f4db81e3dd338f437bfdf5f',
            'model/releases/free-agent-production-v2/release.json':'75c9665c0493d8ac4900479b6802c807aaa45633',
          }
          for path,blob in protected.items():
            assert run('hash-object',path)==blob, f'STOP baseline blob drift: {path}'
            assert run('rev-parse',f'{baseline}:{path}')==blob, f'STOP baseline commit mismatch: {path}'
          expected_review={
            'free-agent-board.html':'975efe51091a2315475678a9db0842b05c4fc3aa',
            'scripts/validation/validate_free_agent_valuation_parity.py':'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc',
            'data/free_agent_utility_v1.json':'557b8010082a87113ecf9d5574af108f3044a1e7',
          }
          for path,blob in expected_review.items():
            assert run('rev-parse',f'{review}:{path}')==blob, f'STOP reviewed candidate changed: {path}'
          allowed=set(expected_review)
          assert set(run('diff','--name-only',baseline,review).splitlines())==allowed,'STOP: review changed other files'
          assert set(run('diff','--name-only',baseline,'HEAD').splitlines())=={'.github/workflows/QF5-v3.yml'},'STOP: unexpected main changes since review parent; re-review required'
          assert run('hash-object','.github/workflows/QF5-v2r1.yml')==run('rev-parse',f'{baseline}:.github/workflows/QF5-v2r1.yml'),'STOP: original successful test code drifted'
          assert '0621d68292fe088f5b948849eea2027c537534e2' in run('rev-list','HEAD').splitlines(),'STOP: missing QF4 lineage'
          print('PASS exact approved candidate, public source freshness, unchanged frozen model, one-file workflow upload')
          PY
      - name: Install exact V2R1 acceptance harness and capture baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          wf=Path('.github/workflows/QF5-v2r1.yml').read_text(encoding='utf-8')
          targets=['Install baseline/candidate acceptance harness only in runner temporary directory',
                   'Full protected regressions and independent hold-mutation test',
                   'Real headless Chrome browser utility and identity UI smoke']
          tmp=Path('/tmp/log-qf5-v3');tmp.mkdir(mode=0o700,exist_ok=True)
          for i,name in enumerate(targets):
            heading='      - name: '+name+'\n'
            assert wf.count(heading)==1,f'Original step not unique: {name}'
            rest=wf.split(heading,1)[1]
            assert '        run: |\n' in rest
            rest=rest.split('        run: |\n',1)[1]
            body=rest.split('\n      - name: ',1)[0]
            lines=body.splitlines()
            assert len(lines)>10 and all(not x.strip() or x.startswith('          ') for x in lines)
            text='\n'.join(x[10:] if x.strip() else '' for x in lines)+'\n'
            if i==0: assert "python3 \"${QF5_TMP}/acceptance.py\" baseline" in text
            if i==1: assert "python3 \"${QF5_TMP}/acceptance.py\" mutation" in text
            if i==2: assert 'webdriver.Chrome' in text
            p=tmp/f'reviewed_{i}.sh'
            p.write_text(text,encoding='utf-8')
            subprocess.run(['bash','-n',str(p)],check=True)
          print('PASS reused all three exact green V2R1 acceptance scripts without modification')
          PY
          bash "${QF5_TMP}/reviewed_0.sh"
      - name: Stage exactly three reviewed files in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          for p in free-agent-board.html scripts/validation/validate_free_agent_valuation_parity.py data/free_agent_utility_v1.json; do
            git show "${QF5_REVIEW_SHA}:${p}" > "${p}"
          done
          [[ "$(git hash-object free-agent-board.html)" == "${QF5_CANDIDATE_BOARD_BLOB}" ]] || exit 1
          [[ "$(git hash-object scripts/validation/validate_free_agent_valuation_parity.py)" == "${QF5_CANDIDATE_VALIDATOR_BLOB}" ]] || exit 1
          [[ "$(git hash-object data/free_agent_utility_v1.json)" == "${QF5_CANDIDATE_UTILITY_BLOB}" ]] || exit 1
          [[ "$(git hash-object index.html)" == "${QF5_APPROVED_INDEX_BLOB}" ]] || exit 1
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'free-agent-board.html','scripts/validation/validate_free_agent_valuation_parity.py','data/free_agent_utility_v1.json'}
          assert paths==expected,f'STOP changed file set {paths}'
          print('PASS only exact three reviewed files staged locally')
          PY
          git diff --check
      - name: Recheck full candidate and preregistered bounded Utility rank deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 "${QF5_TMP}/acceptance.py" candidate
          python3 "${QF5_TMP}/acceptance.py" artifact
      - name: Rerun identical successful V2R1 full regressions and negative mutation
        shell: bash
        run: |
          set -euo pipefail
          bash "${QF5_TMP}/reviewed_1.sh"
      - name: Rerun identical real Chrome browser acceptance and stale fallback
        shell: bash
        run: |
          set -euo pipefail
          bash "${QF5_TMP}/reviewed_2.sh"
      - name: Final read-only integrity gate and completion
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object free-agent-board.html)" == "${QF5_CANDIDATE_BOARD_BLOB}" ]] || exit 1
          [[ "$(git hash-object scripts/validation/validate_free_agent_valuation_parity.py)" == "${QF5_CANDIDATE_VALIDATOR_BLOB}" ]] || exit 1
          [[ "$(git hash-object data/free_agent_utility_v1.json)" == "${QF5_CANDIDATE_UTILITY_BLOB}" ]] || exit 1
          [[ "$(git hash-object index.html)" == "${QF5_APPROVED_INDEX_BLOB}" ]] || exit 1
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'free-agent-board.html','scripts/validation/validate_free_agent_valuation_parity.py','data/free_agent_utility_v1.json'}
          print('QF5 V3 PREFLIGHT GREEN: exact approved 3-file review candidate, no deployment')
          PY
      - name: Clean up disposable acceptance tests
        if: always()
        shell: bash
        run: rm -rf /tmp/log-qf5-v3

  explicitly-confirmed-promotion:
    name: Promote exact three files only on separately confirmed run
    needs: production-preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout same main commit just preflighted
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Recheck owner confirmation and immutability; commit three files atomically
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF5_R1B_THREE_FILES_TO_MAIN' ]] || { echo 'STOP: no exact owner consent'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF5_REVIEW_BRANCH}:refs/remotes/origin/${QF5_REVIEW_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP: main moved after preflight'; exit 1; }
          [[ "$(git rev-parse origin/${QF5_REVIEW_BRANCH})" == "${QF5_REVIEW_SHA}" ]] || exit 1
          [[ "$(git rev-parse "${QF5_REVIEW_SHA}^")" == "${QF5_MAIN_BASE}" ]] || exit 1
          python3 - <<'PY'
          import subprocess
          run=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          original={
            'index.html':'2666f7f8b167e48b7d1571ab527450b521d32c75',
            'free-agent-board.html':'700c52db74c05b1122b4f0a48cf082243d98b0a7',
            'scripts/validation/validate_free_agent_valuation_parity.py':'bf03ccc46a6219e5d3d7e465faac9e1665dd94c6',
            'data/free_agent_utility_v1.json':'ab662a8c235e9302d60d3667c6f505aa2ecb2fe9',
            'data/free_agents.json':'7b36b98e8bbdd5fdd7ea23120d8ab62accb65b40',
            'scripts/projections/build_free_agent_utility_v1.py':'c1fb62c1c04b4b539fa74bff4ee038ec1a4cccc1',
            'scripts/validation/validate_free_agent_utility_v1.py':'bc30ff0bec940e06e8a358f7dc797434463b4684',
            'research/free-agent-utility-v1/free_agent_utility_v1_phase1.py':'1bb87f685c00e51a488a0c21510ccdca452e6b72',
            'scripts/identity_crosswalk.json':'3489c01c923474931f4db81e3dd338f437bfdf5f',
            'model/releases/free-agent-production-v2/release.json':'75c9665c0493d8ac4900479b6802c807aaa45633',
          }
          for path,blob in original.items():
            assert run('hash-object',path)==blob,f'STOP main source/data drift since preflight: {path}'
          expected={
            'free-agent-board.html':'975efe51091a2315475678a9db0842b05c4fc3aa',
            'scripts/validation/validate_free_agent_valuation_parity.py':'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc',
            'data/free_agent_utility_v1.json':'557b8010082a87113ecf9d5574af108f3044a1e7',
          }
          for path,blob in expected.items():
            assert run('rev-parse',f'24cd5e7e9537ce61c165b74bb47f80a9c2345d07:{path}')==blob,'STOP candidate hash changed'
          assert set(run('diff','--name-only','7fc8dc9edba246ab88915851d1f70b3ef0b8f1b7','HEAD').splitlines())=={'.github/workflows/QF5-v3.yml'},'STOP main changed beyond preflight source'
          assert set(run('diff','--name-only','7fc8dc9edba246ab88915851d1f70b3ef0b8f1b7','24cd5e7e9537ce61c165b74bb47f80a9c2345d07').splitlines())==set(expected),'STOP candidate file list drift'
          print('PASS reverified all original/main and exact reviewed candidate hashes')
          PY
          for p in free-agent-board.html scripts/validation/validate_free_agent_valuation_parity.py data/free_agent_utility_v1.json; do
            git show "${QF5_REVIEW_SHA}:${p}" > "${p}"
          done
          [[ "$(git hash-object index.html)" == "${QF5_APPROVED_INDEX_BLOB}" ]] || exit 1
          [[ "$(git hash-object free-agent-board.html)" == "${QF5_CANDIDATE_BOARD_BLOB}" ]] || exit 1
          [[ "$(git hash-object scripts/validation/validate_free_agent_valuation_parity.py)" == "${QF5_CANDIDATE_VALIDATOR_BLOB}" ]] || exit 1
          [[ "$(git hash-object data/free_agent_utility_v1.json)" == "${QF5_CANDIDATE_UTILITY_BLOB}" ]] || exit 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html scripts/validation/validate_free_agent_valuation_parity.py data/free_agent_utility_v1.json
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert paths=={'free-agent-board.html','scripts/validation/validate_free_agent_valuation_parity.py','data/free_agent_utility_v1.json'},f'STOP staged diff {paths}'
          print('PASS exact 3-file atomic staging')
          PY
          git diff --cached --check
          git commit -m 'QF5 A7-F02: promote SID-scoped identity, validator and utility cohort'
          git push origin HEAD:refs/heads/main
          echo "QF5 PROMOTED TO MAIN: $(git rev-parse HEAD)"
          echo "reviewed candidate: ${QF5_REVIEW_SHA}; files=3; canonical index preserved"
