            r77_build(args.r74,args.r72,args.r76,args.out,os.environ.get('CAL26_DLF_SF_CSV_B64',''))

        if __name__=='__main__':r77_main()
        PY_R77_ENGINE
        python -m py_compile "$RUNNER_TEMP/CAL26_R77_engine.py"
        python "$RUNNER_TEMP/CAL26_R77_engine.py" --selftest
        python "$RUNNER_TEMP/CAL26_R77_engine.py" \
          --r74 "$RUNNER_TEMP/cal26-r77-in/R74" \
          --r72 "$RUNNER_TEMP/cal26-r77-in/R72" \
          --r76 "$RUNNER_TEMP/cal26-r77-in/R76" \
          --out "$RUNNER_TEMP/cal26-r77-results"
        python - "$RUNNER_TEMP/cal26-r77-results" <<'PY_R77_VERIFY'
        import csv,hashlib,json,pathlib,sys
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R77_manifest.json').read_text())
        assert m['run']=='CAL26_V1R77' and m['status']=='OWNER_16_NUMERICAL_MARKET_SHADOW_REVIEW_ONLY'
        assert m['player_count']==518 and m['owner_card_count']==16 and m['owner_price_anchors_protected']==15
        assert m['production_price_changes']==0 and m['all_live_quotes_unchanged']
        assert m['2026_evidence_review_supported_positions']==['QB','WR']
        assert not m['private_market_values_exported'] and not m['private_provider_match_membership_exported']
        assert not m['private_raw_provider_rows_exported'] and not m['private_player_learned_DLF_prices_exported']
        assert not m['no_market_time_holdout'] is False and m['no_2026_week7plus_actuals']
        assert m['review_cap_percent_is_nonempirical_governance_not_fv_fit']==8.0
        for name,digest in m['output_sha256'].items():
            assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest, name
        with (p/'CAL26_R77_518_2026_ONLY_OWNER_FV_SHADOW_NO_RELEASE.csv').open() as f: rows=list(csv.DictReader(f))
        with (p/'CAL26_R77_16_CONSERVATIVE_OWNER_PRICING_CARDS_NOT_APPROVED.csv').open() as f: cards=list(csv.DictReader(f))
        with (p/'CAL26_R77_7position_PRIVATE_2026_ONLY_OOF_SUPPORT_AGGREGATE.csv').open() as f: agg=list(csv.DictReader(f))
        assert len(rows)==518 and len(cards)==16 and len(agg)==7
        assert {r['position'] for r in agg}=={'QB','RB','WR','TE','DL','LB','DB'}
        assert sum(r['owner_anchor_protected']=='True' for r in rows)==15
        assert all(r['production_price_change_authorized']=='False' and r['can_auto_apply']=='False' for r in rows)
        assert all(r['position'] in ('QB','WR') and r['owner_anchor_protected']=='False' for r in cards)
        for r in rows:
            o=float(r['live_native_JS_FV_UNCHANGED']);s=r['8pct_risk_cap_shadow_FV_FOR_OWNER_REVIEW_ONLY']
            if s!='': assert abs(float(s)/o-1)<=0.080001
        assert not any(r['private_provider_identity_match_exported']=='True' for r in rows)
        print('R77_REAL_SOURCE_AND_NO_RELEASE_VERIFIED','owner_cards',len(cards),'supported_QB_WR')
        PY_R77_VERIFY
        test -z "$(git status --porcelain)"
        cat "$RUNNER_TEMP/cal26-r77-results/CAL26_R77_decision.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload licensed-safe owner numerical shadow (no private provider rows or production FV)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R77_16_OWNER_QB_WR_2026_SHADOW_PROTECTED_FV_HOLD
        path: ${{ runner.temp }}/cal26-r77-results/
        retention-days: 60
        if-no-files-found: error
