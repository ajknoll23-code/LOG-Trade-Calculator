            for pos in POS:
                rec={'position':pos,'private_cohort_n':0,'baseline_OOF_MAE':'','live_plus_2026_OOF_MAE':'',
                     'gain_vs_live_pct':'','gain_mean_abs_log_error':'',
                     'paired_bootstrap_95CI_low':'','paired_bootstrap_95CI_high':'',
                     'paired_2026_improvement_positive':False,
                     '2027_feature_used':False,'2026_signal_review_eligible':False,
                     'independent_chronological_DLF_market_holdout':False,
                     'DLF_native_values_converted_to_LOG_FV':False,'production_FV_change':False,
                     'decision':'NO_INDEPENDENT_IDP_NUMERIC_MARKET' if pos not in DLF_POS else 'INSUFFICIENT_PRIVATE_MATCHES'}
                cc=cohorts.get(pos,[]);n=len(cc);rec['private_cohort_n']=n
                if pos not in DLF_POS or n<20:agg.append(rec);continue
                ea=oof_errors(cc,['live']);eb=oof_errors(cc,['live','y0']);mean_a=statistics.mean(ea);mean_b=statistics.mean(eb)
                ci_low,ci_hi=paired_ci(ea,eb,pos,'CAL26_R77_2026_ONLY_BOOTSTRAP',B=2000)
                supported=ci_low>0 and mean_b<mean_a and pos not in R77_HOLD
                rec.update({'baseline_OOF_MAE':round(mean_a,6), 'live_plus_2026_OOF_MAE':round(mean_b,6),
                    'gain_vs_live_pct':round(100*(1-mean_b/mean_a),2),
                    'gain_mean_abs_log_error':round(mean_a-mean_b,6),
                    'paired_bootstrap_95CI_low':ci_low, 'paired_bootstrap_95CI_high':ci_hi,
                    'paired_2026_improvement_positive':ci_low>0,
                    '2026_signal_review_eligible':supported,
                    'decision':'QB_WR_2026_MARKET_REVIEW_ONLY_NOT_FV' if supported else 'NOT_SUPPORTED_FOR_OWNER_PRICE_REVIEW'})
                agg.append(rec)
                if not supported:continue
                # Learn production surprise beyond what live FV already captures.
                # Residualize the LOG-scored 2026 surplus using price alone, WITHOUT DLF labels.
                # Market labels then estimate whether residualized 2026 evidence matters to price.
                xi=np.array([r['live'] for r in cc]); zi=np.array([r['y0'] for r in cc]);
                scaler0=StandardScaler().fit(xi[:,None])
                residual_model=Ridge(alpha=5.0).fit(scaler0.transform(xi[:,None]),zi)
                resid=zi-residual_model.predict(scaler0.transform(xi[:,None]))
                X=np.column_stack([xi,resid]);scale=StandardScaler().fit(X)
                market=Ridge(alpha=5.0).fit(scale.transform(X),np.array([r['target'] for r in cc]))
                beta_live=float(market.coef_[0]/scale.scale_[0]); gamma_surprise=float(market.coef_[1]/scale.scale_[1])
                chk(math.isfinite(beta_live) and beta_live>0.1,'UNUSABLE_MARKET_LIVE_PRICE_COEFFICIENT')
                chk(math.isfinite(gamma_surprise),'BAD_PRODUCTION_SURPRISE_MARKET_EFFECT')
                params[pos]={'res_model':residual_model,'res_scaler':scaler0,'beta':beta_live,'gamma':gamma_surprise,
                             'coefficient':gamma_surprise/beta_live,'n':n}
            chk([r['position'] for r in agg]==list(POS),'AGG_ORDER')
            return agg,params

