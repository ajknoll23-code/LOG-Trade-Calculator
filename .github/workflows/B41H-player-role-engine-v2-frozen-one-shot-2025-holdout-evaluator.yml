            test "$(sha256sum "$CONTRACT" | awk '{print $1}')" = '3c1887fa8fbddcbf6bf063fcc4cc41995c1122111c042f40b155d721fb85bfc9'
          else
            cp /tmp/b41h_expected_freeze.json "$CONTRACT"
          fi

      - name: Install exact evaluator runtime and run implementation self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'numpy==2.5.3'             'pandas==2.3.3'             'scipy==1.18.1'             'requests>=2.32,<3'
          python research/player-role-v2/player_role_v2_b41h_one_shot_holdout_evaluator.py --self-test

      - name: Commit immutable B41H evaluator freeze before any 2025 access
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/player-role-v2'
          git fetch origin main
          git rebase origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             "$BASE/player_role_v2_b41h_one_shot_holdout_evaluator.py"             "$BASE/player_role_v2_b41h_evaluator_freeze.json"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'B41H evaluator implementation already frozen identically.'
          else
            git commit -m 'Freeze Player Role V2 B41H one-shot 2025 evaluator'
            git push origin HEAD:main
          fi

      - name: Verify immutable evaluator history and determine B41C3 eligibility
        id: eligibility
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PYGATE'
          from pathlib import Path
          import hashlib, json, os, subprocess

          base = Path('research/player-role-v2')
          script = base / 'player_role_v2_b41h_one_shot_holdout_evaluator.py'
          freeze = base / 'player_role_v2_b41h_evaluator_freeze.json'
          if hashlib.sha256(script.read_bytes()).hexdigest() != '5adf8692cba41165ac84bb86c3b76c55c217c00562367f33c644b11854cbd634':
              raise RuntimeError('B41H_EVALUATOR_SHA_DRIFT')
          if hashlib.sha256(freeze.read_bytes()).hexdigest() != '3c1887fa8fbddcbf6bf063fcc4cc41995c1122111c042f40b155d721fb85bfc9':
              raise RuntimeError('B41H_FREEZE_CONTRACT_SHA_DRIFT')

          # The evaluator and its freeze contract must have exactly one content-changing commit:
          # their original pre-holdout introduction. Any later edit closes this frozen path.
          for p in [script, freeze]:
              commits = subprocess.check_output(
                  ['git', 'log', '--format=%H', '--', str(p)], text=True
              ).splitlines()
              if len(commits) != 1:
                  raise RuntimeError(f'B41H_FROZEN_IMPLEMENTATION_HISTORY_CHANGED {p} commits={len(commits)}')

          # Never permit a second scientific evaluation.
          for p in [
              base / 'player_role_v2_b41h_holdout_evidence.json',
              base / 'player_role_v2_b41h_scientific_decision.json',
              base / 'player_role_v2_b41h_scored_holdout_rows.csv',
          ]:
              if p.exists():
                  raise RuntimeError(f'B41H_ONE_SHOT_EVIDENCE_ALREADY_EXISTS_REFUSE_RERUN {p.name}')

          c3_path = base / 'player_role_v2_b41c3_scientific_decision.json'
          if not c3_path.exists():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('eligible=false\n')
                  f.write('status=AWAITING_B41C3\n')
              print('B41H evaluator is frozen. B41C3 has not run yet; 2025 remains sealed.')
              raise SystemExit(0)

          c3_evidence = base / 'player_role_v2_b41c3_week4_scorer_validation.json'
          if not c3_evidence.exists():
              raise RuntimeError('B41H_B41C3_EVIDENCE_MISSING')

          # B41C3 evidence/decision must still be the single immutable commit produced by B41C3.
          for p in [c3_path, c3_evidence]:
              commits = subprocess.check_output(
                  ['git', 'log', '--format=%H', '--', str(p)], text=True
              ).splitlines()
              if len(commits) != 1:
                  raise RuntimeError(f'B41H_B41C3_HISTORY_CHANGED {p.name} commits={len(commits)}')

          c3 = json.loads(c3_path.read_text())
          if c3.get('result') != 'PASS_UNTOUCHED_WEEK4_SCORER_CONFIRMATION':
              raise RuntimeError(f"B41H_B41C3_NOT_PASS result={c3.get('result')}")
          if c3.get('eligible_for_2025_holdout_evaluation') is not True:
              raise RuntimeError('B41H_B41C3_NOT_ELIGIBLE_FOR_2025')
          if c3.get('2025_holdout_opened') is not False:
              raise RuntimeError('B41H_B41C3_ALREADY_OPENED_2025')
          if c3.get('frozen_scorer_sha256') != 'cbc8548eb0dac7d6f8a95717925487e746605627f674c0a04637771c21e54e6b':
              raise RuntimeError('B41H_B41C3_SCORER_SHA_DRIFT')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('eligible=true\n')
              f.write('status=B41C3_PASS_2025_OPEN_AUTHORIZED\n')
          print('PASS: B41C3 confirmatory scorer gate passed. B41H may now open 2025 exactly once.')
          PYGATE

      - name: Safe closeout while awaiting B41C3
        if: steps.eligibility.outputs.eligible != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'B41H evaluator implementation is frozen and committed.'
          echo 'B41C3 has not authorized 2025 access. No 2025 request was made.'
          echo 'Result: EVALUATOR_FROZEN_AWAITING_B41C3'

      - name: Execute exact one-shot untouched 2025 holdout evaluation
        id: evaluate
        if: steps.eligibility.outputs.eligible == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/player-role-v2-b41h
          mkdir -p /tmp/player-role-v2-b41h
          python research/player-role-v2/player_role_v2_b41h_one_shot_holdout_evaluator.py             --repo .             --out-dir /tmp/player-role-v2-b41h

      - name: Preserve all B41H evidence before scientific closeout
        if: steps.eligibility.outputs.eligible == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          BASE='research/player-role-v2'
          OUT='/tmp/player-role-v2-b41h'
          git fetch origin main
          git reset --hard origin/main

          shopt -s nullglob
          files=("$OUT"/player_role_v2_b41h_*)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No B41H output files were created.' >&2
            exit 1
          fi
          for src in "${files[@]}"; do
            cp "$src" "$BASE/$(basename "$src")"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BASE"/player_role_v2_b41h_*
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'B41H evidence already committed identically.'
          else
            git commit -m 'Record Player Role V2 B41H untouched 2025 holdout evidence'
            git push origin HEAD:main
          fi

      - name: B41H scientific closeout
        if: steps.eligibility.outputs.eligible == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PYCLOSE'
          import json
          from pathlib import Path

          base = Path('research/player-role-v2')
          decision = base / 'player_role_v2_b41h_scientific_decision.json'
          abort = base / 'player_role_v2_b41h_operational_abort.json'

          if decision.exists():
              d = json.loads(decision.read_text())
              print(json.dumps(d, indent=2, sort_keys=True))
              if d.get('result') == 'PASS_UNTOUCHED_2025_HOLDOUT_VALIDATION':
                  print('B41H SCIENTIFIC PASS. B42 is still required; production remains unauthorized.')
                  raise SystemExit(0)
              raise SystemExit('B41H SCIENTIFIC STOP — evidence preserved; do not deploy this V2 version.')

          if abort.exists():
              a = json.loads(abort.read_text())
              print(json.dumps(a, indent=2, sort_keys=True))
              raise SystemExit('B41H operational transport abort — same frozen evaluator may be rerun; no retuning permitted.')

          raise SystemExit('B41H evaluator failed without a scientific decision; inspect committed holdout-open witness and logs.')
          PYCLOSE
