name: Fix Trade Desk UI21 Add Controls

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked files
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PREVIEW_BLOB="db73eb7b7f2faf174576c48427227cf20e7fa291"
          EXPECTED_INDEX_BLOB="0f587dcb9740d0986acc705b305cdaa6217c0ae9"

          ACTUAL_PREVIEW_BLOB="$(git hash-object trade-desk-preview.html)"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"

          echo "Expected preview: $EXPECTED_PREVIEW_BLOB"
          echo "Actual preview:   $ACTUAL_PREVIEW_BLOB"
          echo "Expected index:   $EXPECTED_INDEX_BLOB"
          echo "Actual index:     $ACTUAL_INDEX_BLOB"

          test "$ACTUAL_PREVIEW_BLOB" = "$EXPECTED_PREVIEW_BLOB"
          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-preview-pre-ui21-add-controls-fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Add render-safe Player and Draft Pick controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade-desk-preview.html")
          text = path.read_text(encoding="utf-8")

          marker = "UI21_ADD_CONTROLS_RENDER_FIX_V1"

          if marker in text:
              raise SystemExit(f"{marker} already present; refusing to double-apply.")

          required = [
              "TRADE_DESK_UI21_SIMPLIFY_V1",
              'id="sidesWrap"',
              'class="add-controls"',
              "function setTab(",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Preview structure changed; missing required hooks: "
                  + ", ".join(missing)
              )

          css = r'''
          <style id="ui21-add-controls-render-fix-styles">
          /* UI21_ADD_CONTROLS_RENDER_FIX_V1
             The Trade Desk redraws side markup after state changes. These
             launcher controls are therefore re-attached after every redraw. */

          .ui21-add-asset-toggle{
            display:none!important;
          }

          .ui21-add-launcher{
            display:grid!important;
            grid-template-columns:1fr 1fr;
            gap:8px;
            width:100%;
          }

          .ui21-add-launcher-btn{
            min-height:40px;
            padding:8px 10px;
            border:1px solid var(--line-strong);
            border-radius:8px;
            background:var(--panel-alt);
            color:var(--text-muted);
            font-family:'Inter',sans-serif;
            font-size:10px;
            font-weight:800;
            letter-spacing:.035em;
            text-transform:uppercase;
            cursor:pointer;
          }

          .ui21-add-launcher-btn:hover{
            color:var(--text);
            border-color:rgba(201,206,210,.34);
          }

          .side-a .ui21-add-launcher-btn.is-active{
            border-color:var(--gold);
            background:var(--gold);
            color:#fff;
          }

          .side-b .ui21-add-launcher-btn.is-active{
            border-color:var(--violet);
            background:var(--violet);
            color:var(--bg);
          }

          /* The new two-button launcher replaces the original tab row. */
          .side .add-controls > .tab-row{
            display:none!important;
          }

          /* Closed: launcher only. */
          .side:not(.ui21-add-open) .add-controls > :not(.ui21-add-launcher){
            display:none!important;
          }

          /* Open: launcher + the selected form. */
          .side.ui21-add-open .add-controls{
            padding-top:10px!important;
          }

          .side.ui21-add-open .ui21-add-launcher{
            margin-bottom:10px;
          }

          @media(max-width:430px){
            .ui21-add-launcher{
              gap:7px;
            }

            .ui21-add-launcher-btn{
              min-height:42px;
              padding:8px 7px;
              font-size:9.5px;
            }
          }
          </style>
          '''

          js = r'''
          <script id="ui21-add-controls-render-fix-runtime">
          /* UI21_ADD_CONTROLS_RENDER_FIX_V1 — UI only. */
          (function () {
            'use strict';

            function init() {
              if (document.documentElement.dataset.ui21AddControlsFix === '1') return;
              document.documentElement.dataset.ui21AddControlsFix = '1';

              const sides = document.getElementById('sidesWrap');
              if (!sides) {
                console.error('UI2.1 add-controls fix: #sidesWrap missing.');
                return;
              }

              const openMode = { A:null, B:null };
              let scheduled = false;

              function sideNode(letter) {
                return sides.querySelector(letter === 'A' ? '.side-a' : '.side-b');
              }

              function ensureLauncher(letter) {
                const side = sideNode(letter);
                if (!side) return;

                const controls = side.querySelector('.add-controls');
                if (!controls) return;

                /* Remove the superseded one-button launcher if it survived
                   a render. */
                controls.querySelectorAll('.ui21-add-asset-toggle').forEach(node => {
                  node.remove();
                });

                let launcher = controls.querySelector('.ui21-add-launcher');

                if (!launcher) {
                  launcher = document.createElement('div');
                  launcher.className = 'ui21-add-launcher';
                  launcher.setAttribute('role', 'group');
                  launcher.setAttribute(
                    'aria-label',
                    'Add an asset to Side ' + letter
                  );

                  const player = document.createElement('button');
                  player.type = 'button';
                  player.className = 'ui21-add-launcher-btn';
                  player.dataset.ui21Side = letter;
                  player.dataset.ui21Mode = 'player';
                  player.textContent = '+ Player';

                  const pick = document.createElement('button');
                  pick.type = 'button';
                  pick.className = 'ui21-add-launcher-btn';
                  pick.dataset.ui21Side = letter;
                  pick.dataset.ui21Mode = 'pick';
                  pick.textContent = '+ Draft Pick';

                  launcher.appendChild(player);
                  launcher.appendChild(pick);
                  controls.insertBefore(launcher, controls.firstChild);
                }

                const mode = openMode[letter];
                side.classList.toggle('ui21-add-open', Boolean(mode));

                launcher.querySelectorAll('.ui21-add-launcher-btn').forEach(btn => {
                  const active = btn.dataset.ui21Mode === mode;
                  btn.classList.toggle('is-active', active);
                  btn.setAttribute('aria-pressed', active ? 'true' : 'false');
                });
              }

              function ensureAll() {
                scheduled = false;
                ensureLauncher('A');
                ensureLauncher('B');
              }

              function scheduleEnsure() {
                if (scheduled) return;
                scheduled = true;
                requestAnimationFrame(ensureAll);
              }

              sides.addEventListener('click', event => {
                const launcherBtn = event.target.closest('.ui21-add-launcher-btn');

                if (launcherBtn && sides.contains(launcherBtn)) {
                  event.preventDefault();

                  const letter = launcherBtn.dataset.ui21Side;
                  const mode = launcherBtn.dataset.ui21Mode;

                  if (!letter || !mode) return;

                  if (openMode[letter] === mode) {
                    openMode[letter] = null;
                    scheduleEnsure();
                    return;
                  }

                  openMode[letter] = mode;

                  if (typeof window.setTab === 'function') {
                    window.setTab(letter, mode);
                  } else {
                    console.error('UI2.1 add-controls fix: setTab() unavailable.');
                  }

                  scheduleEnsure();
                  return;
                }

                /* After a player/pick is submitted, collapse the form again.
                   The underlying add handler remains completely unchanged. */
                const addButton = event.target.closest('.add-btn');
                if (addButton && sides.contains(addButton)) {
                  const side = addButton.closest('.side');
                  const letter = side && side.classList.contains('side-a') ? 'A'
                    : (side && side.classList.contains('side-b') ? 'B' : null);

                  if (letter) {
                    openMode[letter] = null;
                    setTimeout(scheduleEnsure, 0);
                  }
                }
              });

              if (typeof MutationObserver !== 'undefined') {
                new MutationObserver(scheduleEnsure).observe(sides, {
                  childList:true,
                  subtree:true
                });
              }

              ensureAll();
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init, { once:true });
            } else {
              init();
            }
          })();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text or "</body>" not in text:
              raise RuntimeError("Preview missing closing head/body tags")

          text = text.replace("</head>", css + "\n</head>", 1)
          text = text.replace("</body>", js + "\n</body>", 1)

          if text.count(marker) != 2:
              raise RuntimeError(
                  f"Unexpected {marker} count after patch: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")
          print("PASS render-safe + Player / + Draft Pick controls appended")
          PY

      - name: Validate fix JavaScript and UI hooks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("trade-desk-preview.html").read_text(encoding="utf-8")

          match = re.search(
              r'<script id="ui21-add-controls-render-fix-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )
          if not match:
              raise SystemExit("Add-controls fix runtime missing")

          required = [
              "ui21-add-launcher",
              "+ Player",
              "+ Draft Pick",
              "MutationObserver",
              "window.setTab",
          ]
          missing = [token for token in required if token not in match.group(1)]
          if missing:
              raise SystemExit(f"Add-controls runtime missing: {missing}")

          for label, pattern in [
              (
                  "CSS",
                  r'<style id="ui21-add-controls-render-fix-styles">(.*?)</style>'
              ),
              (
                  "JS",
                  r'<script id="ui21-add-controls-render-fix-runtime">(.*?)</script>'
              ),
          ]:
              block = re.search(pattern, html, flags=re.S)
              if not block:
                  raise SystemExit(f"{label} block missing")
              bad = [
                  i for i, line in enumerate(block.group(1).splitlines(), 1)
                  if line != line.rstrip()
              ]
              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at relative lines {bad[:10]}"
                  )
              print(f"PASS {label} whitespace")

          out = Path("/tmp/ui21-add-controls-fix.js")
          out.write_text(match.group(1), encoding="utf-8")
          print(out)
          PY

          node --check /tmp/ui21-add-controls-fix.js

      - name: Validate existing runtime guards
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Verify production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0f587dcb9740d0986acc705b305cdaa6217c0ae9"
          git diff --exit-code -- index.html

      - name: Commit preview fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trade-desk-preview.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "trade-desk-preview.html"

          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi

          git commit -m "Fix Trade Desk UI2 add controls"
          git push origin HEAD:main
