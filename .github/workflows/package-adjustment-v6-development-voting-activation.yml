name: Package Adjustment V6 Development Voting Activation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen V6 preregistration and unreleased catalog
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/development_preregistration_v1.json")" = \
            "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/development_preregistration_v1.md")" = \
            "8aa2bca3e17a5b5092687f55566c581fcb113261"
          test "$(git hash-object "$D/development_preregistration_v1_manifest.json")" = \
            "f088b43799428bfc13cbf7d2fa5fad2efacc20b2"

          test "$(git hash-object "$D/generate_package_vote_challenges_v6.py")" = \
            "948c44c3813e6599a9a20c784fd4c65836b17e2c"
          test "$(git hash-object "$D/package_vote_challenges_v6.json")" = \
            "afc3f4e5a75f3599c11482361073c4bd9559e342"
          test "$(git hash-object "$D/development_catalog_v1_manifest.json")" = \
            "1e225a9f5153ea74d8aac5098d39debb9e99dc1c"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = \
            "fa3c366b0a6fc9db1fef448184c4ff6072a634dd"

          test ! -e "$D/development_vote_release_v1.json"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")

          cfg = json.loads((d / "development_preregistration_v1.json").read_text())
          cat = json.loads((d / "package_vote_challenges_v6.json").read_text())
          man = json.loads((d / "development_catalog_v1_manifest.json").read_text())

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert cfg["status"] == "frozen_v6_development_preregistration"
          assert cfg["frozen"] is True
          assert cfg["production_revision_must_remain"] == "v1.6-v5-size2-composition-overlay"
          assert cfg["development_maturity_and_stopping"]["first_effective_vote_checkpoint"] == 600
          assert cfg["development_maturity_and_stopping"]["hard_cap_effective_votes"] == 800
          assert cfg["development_maturity_and_stopping"]["daily_valid_vote_cap_per_voter"] == 20
          assert cfg["development_maturity_and_stopping"]["effective_lifetime_vote_cap_per_voter"] == 30

          assert cat["status"] == "frozen_package_adjustment_v6_development_catalog"
          assert cat["frozen"] is True
          assert cat["released"] is False
          assert cat["voting_activated"] is False
          assert cat["research_only"] is True
          assert cat["production_formula_enabled"] is False
          assert cat["candidate_predictions_used_for_catalog_selection"] is False
          assert cat["exact_motivating_trade_included"] is False
          assert len(cat["challenges"]) == 504
          assert len({c["research_cell"] for c in cat["challenges"]}) == 24
          assert len({c["target"]["key"] for c in cat["challenges"]}) == 21

          assert man["status"] == "frozen_v6_development_catalog_manifest"
          assert man["catalog_sha256"] == sha256(d / "package_vote_challenges_v6.json")
          assert man["catalog_sha256"] == "f306da6cf396310be91c7e468703be8a9511dbff383508a75d81a17f7edf3a21"
          assert man["challenge_count"] == 504
          assert man["target_count"] == 21
          assert man["research_cell_count"] == 24
          assert man["candidate_predictions_used"] is False
          assert man["released"] is False
          assert man["voting_activated"] is False
          assert man["development_votes_collected"] is False
          assert man["model_fit_performed"] is False
          assert man["production_change_authorized"] is False

          print("PASS: V6 catalog is exact, frozen, unreleased, and unused.")
          PY

      - name: Verify production remains V1.6 before activation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Activate frozen V6 development voting
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          D = ROOT / "research/package-adjustment-v6"
          INDEX = ROOT / "index.html"
          KTC_PIPE = ROOT / "scripts/market/ktc_pipeline.py"
          REGRESSION = ROOT / "scripts/validation/repo_regression_checks.py"
          RELEASE = D / "development_vote_release_v1.json"

          CFG = D / "development_preregistration_v1.json"
          CATALOG = D / "package_vote_challenges_v6.json"
          CATALOG_MANIFEST = D / "development_catalog_v1_manifest.json"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cfg = json.loads(CFG.read_text(encoding="utf-8"))
          cat = json.loads(CATALOG.read_text(encoding="utf-8"))
          cat_man = json.loads(CATALOG_MANIFEST.read_text(encoding="utf-8"))

          source_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          released_at = datetime.now(timezone.utc).isoformat()

          assert cat_man["catalog_sha256"] == sha256(CATALOG)
          assert cat_man["catalog_sha256"] == "f306da6cf396310be91c7e468703be8a9511dbff383508a75d81a17f7edf3a21"

          text = INDEX.read_text(encoding="utf-8")

          constants_pattern = re.compile(
              r"/\* Package Adjustment NextGen V2 Prospective V1: frozen time-holdout catalog\.\n"
              r"Research-only prospective validation\. Production Package Adjustment remains V1\.6\. \*/\n"
              r"const PACKAGE_VOTE_CHALLENGES_URL = .*?\n"
              r"const PACKAGE_VOTE_CATALOG_SHA256 = .*?\n"
              r"const PACKAGE_VOTE_DAILY_LIMIT = .*?\n"
              r"const PACKAGE_VOTE_RECENT_MEMORY = .*?\n"
              r"const PACKAGE_VOTE_VALID_AFTER_UTC = .*?\n"
              r"const PACKAGE_VOTE_FAMILY_WEIGHTS = Object\.freeze\(\{\n"
              r".*?"
              r"\}\);\n"
              r"let PACKAGE_VOTE_CHALLENGES = null;",
              re.S,
          )

          raw_url = (
              "https://raw.githubusercontent.com/ajknoll23-code/"
              f"LOG-Trade-Calculator/{source_commit}/"
              "research/package-adjustment-v6/package_vote_challenges_v6.json"
          )

          replacement_constants = f"""/* Package Adjustment V6 Development: frozen 1-vs-3 composition catalog.
          Research-only development evidence. Production Package Adjustment remains V1.6. */
          const PACKAGE_VOTE_CHALLENGES_URL = '{raw_url}';
          const PACKAGE_VOTE_CATALOG_SHA256 = '{cat_man["catalog_sha256"]}';
          const PACKAGE_VOTE_DAILY_LIMIT = 20;
          const PACKAGE_VOTE_RECENT_MEMORY = 24;
          const PACKAGE_VOTE_VALID_AFTER_UTC = '{released_at}';
          let PACKAGE_VOTE_CHALLENGES = null;"""

          text2, n = constants_pattern.subn(replacement_constants, text, count=1)
          if n != 1:
              raise RuntimeError(f"Expected exactly one old package-vote constants block; replaced {n}")

          functions_pattern = re.compile(
              r"function packageVoteTodayKey\(\)\{.*?\n\}\nfunction render\(\)\{",
              re.S,
          )

          new_functions = r"""function packageVoteTodayKey(){
          return 'package_votes_v6_development_v1_' + new Date().toISOString().slice(0,10);
          }

          function packageVotesToday(){
          return parseInt(localStorage.getItem(packageVoteTodayKey()) || '0', 10);
          }

          function packageVoteRecent(){
          try { return JSON.parse(localStorage.getItem('package_vote_recent_v6_development_v1') || '[]'); }
          catch(e){ return []; }
          }

          function packageVoteRemember(id){
          const recent = packageVoteRecent().concat([id]).slice(-PACKAGE_VOTE_RECENT_MEMORY);
          localStorage.setItem('package_vote_recent_v6_development_v1', JSON.stringify(recent));
          }

          /* PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1
             Frozen V6 development schedule:
             1) select one of the 24 preregistered research cells uniformly;
             2) select a challenge uniformly within that selected cell, preferring one
                outside recent-memory when available;
             3) randomize which canonical side (Target or Package) is displayed left.
             Recent-memory is applied only AFTER the research cell is selected, so it
             cannot alter the cell probability. Vote outcomes and candidate predictions
             never affect sampling. */
          function packageVoteSelectChallenge(){
          if(!PACKAGE_VOTE_CHALLENGES || !PACKAGE_VOTE_CHALLENGES.length) return null;

          const byCell = new Map();
          for(const c of PACKAGE_VOTE_CHALLENGES){
          if(!c || typeof c.research_cell !== 'string') continue;
          if(!byCell.has(c.research_cell)) byCell.set(c.research_cell, []);
          byCell.get(c.research_cell).push(c);
          }

          const cells = Array.from(byCell.keys()).sort();
          if(cells.length !== 24) return null;

          const selectedCell = cells[Math.floor(Math.random() * cells.length)];
          const cellPool = byCell.get(selectedCell);
          if(!cellPool || !cellPool.length) return null;

          const recent = new Set(packageVoteRecent());
          let challengePool = cellPool.filter(c => !recent.has(c.id));
          if(!challengePool.length) challengePool = cellPool;

          const challenge = challengePool[Math.floor(Math.random() * challengePool.length)];
          return { challenge, left: Math.random() < 0.5 ? 'T' : 'P' };
          }

          function packageVoteEnsureLoaded(){
          if(PACKAGE_VOTE_STATUS === 'loading' || PACKAGE_VOTE_STATUS === 'ready') return;
          PACKAGE_VOTE_STATUS = 'loading';

          fetch(PACKAGE_VOTE_CHALLENGES_URL, {cache:'no-store'})
          .then(r => {
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
          })
          .then(doc => {
          if(
          doc.schema_version !== 6 ||
          doc.status !== 'frozen_package_adjustment_v6_development_catalog' ||
          doc.frozen !== true ||
          doc.released !== false ||
          doc.voting_activated !== false ||
          doc.research_only !== true ||
          doc.consumer_changed !== false ||
          doc.production_formula_enabled !== false ||
          doc.production_revision_retained !== 'v1.6-v5-size2-composition-overlay' ||
          doc.candidate_predictions_used_for_catalog_selection !== false ||
          doc.exact_motivating_trade_included !== false ||
          !doc.catalog_diagnostics ||
          Number(doc.catalog_diagnostics.challenge_count) !== 504 ||
          Number(doc.catalog_diagnostics.target_count) !== 21 ||
          Number(doc.catalog_diagnostics.research_cell_count) !== 24 ||
          Number(doc.catalog_diagnostics.motivating_trade_matches) !== 0 ||
          !Array.isArray(doc.challenges) ||
          doc.challenges.length !== 504 ||
          !doc.challenges.every(c =>
            c &&
            c.schema_version === 6 &&
            c.experiment === 'package_adjustment_v6_three_player_composition_development' &&
            typeof c.research_cell === 'string' &&
            c.target && Number(c.target.fv) > 0 &&
            Array.isArray(c.package) && c.package.length === 3 &&
            Number(c.package_size) === 3 &&
            c.package.every(p => p && Number(p.fv) > 0 && Number(p.fv) < Number(c.target.fv)) &&
            c.component_profile &&
            Array.isArray(c.component_profile.actual_package_shares) &&
            c.component_profile.actual_package_shares.length === 3
          )
          ){
          throw new Error('unexpected frozen V6 development challenge catalog');
          }

          const cells = new Set(doc.challenges.map(c => c.research_cell));
          if(cells.size !== 24) throw new Error('v6_development_catalog_cell_count');

          const perCell = new Map();
          for(const c of doc.challenges){
          perCell.set(c.research_cell, Number(perCell.get(c.research_cell) || 0) + 1);
          }
          if(Array.from(perCell.values()).some(n => n !== 21)){
          throw new Error('v6_development_catalog_cell_balance');
          }

          PACKAGE_VOTE_CHALLENGES = doc.challenges;
          PACKAGE_VOTE_STATUS = 'ready';
          packageVoteCurrent = null;
          renderPackageVote();
          })
          .catch(err => {
          console.warn('Package Adjustment V6 development catalog load failed:', err);
          PACKAGE_VOTE_CHALLENGES = null;
          PACKAGE_VOTE_STATUS = 'failed';
          renderPackageVote();
          });
          }

          function packageVoteAssetCard(p){
          const age = (typeof p.age === 'number') ? ` &middot; ${p.age} y.o.` : '';
          const team = p.team ? ` &middot; ${ktcTeamLabel(p.team)}` : '';
          return `<div class="need-cell" style="text-align:left;padding:10px;">
          <div style="font-weight:600;font-size:14px;">${escapeHtml(p.name)}</div>
          <div style="color:var(--text-dim);font-size:11px;">${escapeHtml(p.pos)}${team}${age}</div>
          </div>`;
          }

          function packageVoteSubmit(displaySide){
          if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)) return;
          if(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;

          const left = packageVoteCurrent.left;
          const choice = displaySide === 'L' ? left : (left === 'T' ? 'P' : 'T');
          const id = packageVoteCurrent.challenge.id;
          const voter = ktcCurrentVoterId();
          if(!voter) return;

          fetch(KTC_SUBMIT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
          voterRosterId: voter,
          keep: `__pkgv6__|${id}|${choice}`,
          trade: `__pkgv6_meta__|${left}`,
          cut: '__pkgv6_schema__|6',
          }),
          }).catch(() => {});

          localStorage.setItem(packageVoteTodayKey(), String(packageVotesToday() + 1));
          packageVoteRemember(id);
          packageVoteCurrent = packageVoteSelectChallenge();
          renderPackageVote();
          }

          function renderPackageVote(){
          const el = document.getElementById('packageVoteWrap');
          if(!el) return;

          if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){
          el.innerHTML = `
          <div class="vote-access-card">
          <div class="vote-access-copy">
          <div class="vote-access-title">Ready to compare trades?</div>
          <div class="vote-access-sub">League members: choose your team above to use your league voter identity. Everyone else can vote as a guest.</div>
          </div>
          <button type="button" class="vote-guest-btn" onclick="ktcStartGuestMode()">Vote as a guest</button>
          </div>
          `;
          return;
          }

          if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          V6 development voting opens at ${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.
          </div>`;
          return;
          }

          if(packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          You've completed today's ${PACKAGE_VOTE_DAILY_LIMIT} package research votes. Thank you.
          </div>`;
          return;
          }

          if(PACKAGE_VOTE_STATUS === 'idle'){
          packageVoteEnsureLoaded();
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen V6 development comparisons...</div>`;
          return;
          }
          if(PACKAGE_VOTE_STATUS === 'loading'){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen V6 development comparisons...</div>`;
          return;
          }
          if(PACKAGE_VOTE_STATUS === 'failed'){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">V6 package research is temporarily unavailable. Normal KTC voting is unaffected.</div>`;
          return;
          }

          if(!packageVoteCurrent) packageVoteCurrent = packageVoteSelectChallenge();
          if(!packageVoteCurrent){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">No V6 package comparison is available right now.</div>`;
          return;
          }

          const c = packageVoteCurrent.challenge;
          const targetHTML = packageVoteAssetCard(c.target);
          const packageHTML = c.package.map(packageVoteAssetCard).join('');
          const leftIsTarget = packageVoteCurrent.left === 'T';
          const leftHTML = leftIsTarget ? targetHTML : packageHTML;
          const rightHTML = leftIsTarget ? packageHTML : targetHTML;

          el.innerHTML = `
          <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text-dim);">
          <b style="color:var(--text);">Research question:</b> Which side would you rather receive in a dynasty trade?
          Values are intentionally hidden. Vote on the players themselves.
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;">
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:5px;text-align:center;">SIDE A</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${leftHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('L')">Choose Side A</button>
          </div>
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--violet);margin-bottom:5px;text-align:center;">SIDE B</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${rightHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('R')">Choose Side B</button>
          </div>
          </div>
          <div style="color:var(--text-dim);font-size:10px;margin-top:8px;text-align:center;">
          ${packageVotesToday()} / ${PACKAGE_VOTE_DAILY_LIMIT} package votes today &middot; display sides randomized
          </div>
          `;
          }
          """

          text3, n = functions_pattern.subn(
              new_functions + "\nfunction render(){",
              text2,
              count=1,
          )
          if n != 1:
              raise RuntimeError(f"Expected exactly one package-vote function block; replaced {n}")

          INDEX.write_text(text3, encoding="utf-8")

          pipe = KTC_PIPE.read_text(encoding="utf-8")
          old_prefix = '"__pkgnv2p1__|")'
          new_prefix = '"__pkgnv2p1__|", "__pkgv6__|")'
          if pipe.count(old_prefix) != 1:
              raise RuntimeError("Could not uniquely locate KTC reserved package prefix tuple")
          pipe = pipe.replace(old_prefix, new_prefix, 1)

          old_comment = (
              "# Package Preference Voting V1-V5 plus NextGen V2 first-wave and prospective V1\n"
              "# share transport only. Remove all reserved row families before normal KTC\n"
          )
          new_comment = (
              "# Package Preference Voting V1-V6 plus NextGen V2 first-wave and prospective V1\n"
              "# share transport only. Remove all reserved row families before normal KTC\n"
          )
          if old_comment not in pipe:
              raise RuntimeError("Expected KTC package-vote transport comment not found")
          pipe = pipe.replace(old_comment, new_comment, 1)

          KTC_PIPE.write_text(pipe, encoding="utf-8")

          # repo_regression_checks.py intentionally keeps the complete package
          # transport prefix family under an exact permanent contract.
          regression = REGRESSION.read_text(encoding="utf-8")
          old_expected = (
              '        "__pkgnv2__|",\n'
              '        "__pkgnv2p1__|",\n'
              '    )\n'
          )
          new_expected = (
              '        "__pkgnv2__|",\n'
              '        "__pkgnv2p1__|",\n'
              '        "__pkgv6__|",\n'
              '    )\n'
          )
          if regression.count(old_expected) != 1:
              raise RuntimeError(
                  "Could not uniquely locate expected package-vote prefix tuple "
                  "in repo_regression_checks.py"
              )
          regression = regression.replace(old_expected, new_expected, 1)
          REGRESSION.write_text(regression, encoding="utf-8")

          release = {
              "schema_version": 1,
              "release_id": "package-adjustment-v6-development-voting-v1",
              "status": "package_adjustment_v6_development_vote_release",
              "frozen": True,
              "research_only": True,
              "released_at_utc": released_at,
              "source_catalog_commit": source_commit,
              "catalog_sha256": cat_man["catalog_sha256"],
              "catalog_blob_sha": "afc3f4e5a75f3599c11482361073c4bd9559e342",
              "catalog_challenge_count": 504,
              "catalog_target_count": 21,
              "catalog_research_cell_count": 24,
              "browser_catalog_url": raw_url,
              "browser_index_sha256_after_activation": sha256(INDEX),
              "ktc_pipeline_sha256_after_activation": sha256(KTC_PIPE),
              "repo_regression_checks_sha256_after_activation": sha256(REGRESSION),
              "transport": {
                  "keep_prefix": "__pkgv6__|",
                  "meta_prefix": "__pkgv6_meta__|",
                  "schema_marker": "__pkgv6_schema__|6",
                  "canonical_choices": ["T", "P"],
                  "canonical_left_sides": ["T", "P"],
              },
              "sampling": {
                  "research_cell_selection": "uniform_across_all_24_frozen_cells",
                  "challenge_selection_within_selected_cell": (
                      "uniform_after_recent_memory_filter; fallback_to_full_cell_if_all_recent"
                  ),
                  "recent_memory_count": 24,
                  "recent_memory_applied_after_cell_selection": True,
                  "display_side_randomized": True,
                  "values_hidden_from_voter": True,
                  "candidate_predictions_used": False,
              },
              "voter_protections": {
                  "browser_daily_vote_limit": 20,
                  "analysis_daily_valid_vote_cap_per_voter": 20,
                  "analysis_effective_lifetime_vote_cap_per_voter": 30,
                  "browser_cap_is_not_analysis_enforcement_boundary": True,
              },
              "development_stopping_contract": {
                  "outcome_blind_coverage_only": True,
                  "first_effective_vote_checkpoint": 600,
                  "coverage_retry_increment": 100,
                  "hard_cap_effective_votes": 800,
                  "minimum_distinct_voters": 30,
                  "minimum_effective_votes_per_cell": 15,
                  "minimum_distinct_voters_per_cell": 10,
                  "required_cell_count": 24,
                  "effect_direction_may_change_stopping": False,
                  "significance_may_change_stopping": False,
              },
              "scientific_isolation": {
                  "exact_motivating_trade_in_catalog": False,
                  "candidate_predictions_used_to_build_catalog": False,
                  "development_vote_outcomes_read_at_release": False,
                  "model_fit_performed_at_release": False,
                  "candidate_selected_at_release": False,
                  "fresh_confirmation_started": False,
              },
              "production_revision": "v1.6-v5-size2-composition-overlay",
              "production_formula_changed": False,
              "fundamental_value_consumer_changed": False,
              "market_value_consumer_changed": False,
              "draft_pick_value_consumer_changed": False,
              "team_utility_consumer_changed": False,
              "trade_verdict_consumer_changed": False,
              "automatic_production_change_allowed": False,
              "production_change_authorized": False,
          }

          RELEASE.write_text(
              json.dumps(release, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: V6 development voting activation files written.")
          print("Release UTC:", released_at)
          print("Pinned catalog commit:", source_commit)
          print("Catalog SHA256:", cat_man["catalog_sha256"])
          PY

      - name: Validate V6 browser and transport activation
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/market/ktc_pipeline.py

          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          D = Path("research/package-adjustment-v6")
          index = Path("index.html").read_text(encoding="utf-8")
          pipe = Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          regression = Path("scripts/validation/repo_regression_checks.py").read_text(encoding="utf-8")
          rel = json.loads((D / "development_vote_release_v1.json").read_text())
          cat = json.loads((D / "package_vote_challenges_v6.json").read_text())

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert rel["status"] == "package_adjustment_v6_development_vote_release"
          assert rel["frozen"] is True
          assert rel["research_only"] is True
          assert rel["catalog_sha256"] == sha256(D / "package_vote_challenges_v6.json")
          assert rel["catalog_challenge_count"] == 504
          assert rel["catalog_research_cell_count"] == 24
          assert rel["production_revision"] == "v1.6-v5-size2-composition-overlay"
          assert rel["production_formula_changed"] is False
          assert rel["production_change_authorized"] is False
          assert rel["scientific_isolation"]["development_vote_outcomes_read_at_release"] is False
          assert rel["scientific_isolation"]["model_fit_performed_at_release"] is False

          assert "__pkgv6__|" in index
          assert "__pkgv6_meta__|" in index
          assert "__pkgv6_schema__|6" in index
          assert "package_votes_v6_development_v1_" in index
          assert "package_vote_recent_v6_development_v1" in index
          assert "doc.status !== 'frozen_package_adjustment_v6_development_catalog'" in index
          assert "c.package.map(packageVoteAssetCard)" in index
          assert "packageVoteCurrent.left === 'T'" in index
          assert "PACKAGE_VOTE_DAILY_LIMIT = 20" in index
          assert rel["released_at_utc"] in index
          assert rel["source_catalog_commit"] in index
          assert rel["catalog_sha256"] in index

          assert "`__pkgnv2p1__|${id}|${choice}`" not in index

          match = re.search(r"PACKAGE_VOTE_PREFIXES\s*=\s*\((.*?)\)", pipe, re.S)
          assert match
          assert '"__pkgv6__|"' in match.group(1)

          expected_match = re.search(
              r"expected_package_prefixes\s*=\s*\((.*?)\)",
              regression,
              re.S,
          )
          assert expected_match
          assert '"__pkgv6__|"' in expected_match.group(1)
          assert rel["repo_regression_checks_sha256_after_activation"] == sha256(
              Path("scripts/validation/repo_regression_checks.py")
          )

          assert cat["released"] is False
          assert cat["voting_activated"] is False
          assert cat["candidate_predictions_used_for_catalog_selection"] is False
          assert cat["exact_motivating_trade_included"] is False

          print("PASS: V6 browser emits isolated research rows and frozen catalog remains immutable.")
          PY

      - name: Verify production still remains V1.6
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Run repo regression checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Prove only release, browser research UI, and transport isolation changed
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all \
              | sed 's/^?? //' \
              | sed 's/^ M //' \
              | sort
          )

          printf '%s\n' "${changed[@]}"

          expected=(
            "index.html"
            "research/package-adjustment-v6/development_vote_release_v1.json"
            "scripts/market/ktc_pipeline.py"
            "scripts/validation/repo_regression_checks.py"
          )

          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Commit V6 development voting activation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            research/package-adjustment-v6/development_vote_release_v1.json \
            scripts/market/ktc_pipeline.py \
