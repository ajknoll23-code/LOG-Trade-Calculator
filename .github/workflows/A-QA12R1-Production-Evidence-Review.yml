name: A-QA12 - Evidence Based Fallback FV Triage (Read Only)
run-name: A-QA12 72-player multi-source price contradiction read-only review

'on':
  workflow_dispatch:
    inputs:
      qa11_run_id:
        description: A-QA11 green source-evidence run ID
        required: true
        type: string
        default: '41087547822'

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa12-multisource-evidence-readonly
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA11_RUN_ID: ${{ inputs.qa11_run_id }}
      QA12_IN: /tmp/a-qa12-qa11
      QA12_OUT: /tmp/a-qa12-out
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact successful QA11 upstream run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$QA11_RUN_ID" =~ ^[0-9]{7,15}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA11_RUN_ID" > "$RUNNER_TEMP/qa12_qa11_run.json"
          python3 - <<'PY_VERIFY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'qa12_qa11_run.json').read_text())
          check={'status':'completed','conclusion':'success','event':'workflow_dispatch',
              'path':'.github/workflows/A-QA11.yml',
              'display_title':'A-QA11 B46 role versus fantasy slot FV shadow',
              'head_branch':'main'}
          for k,v in check.items():assert r.get(k)==v,(k,r.get(k))
          assert r.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY']
          PY_VERIFY
      - name: Download exact QA11 shadow evidence
        uses: actions/download-artifact@v4
        with:
          name: A-QA11-B46-Independent-Role-Shadow
          run-id: ${{ inputs.qa11_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/a-qa12-qa11
      - name: Pin original source and verify B46 file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SHA'
          import json,os,pathlib,re
          m=json.loads((pathlib.Path(os.environ['QA12_IN'])/'QA11_Manifest.json').read_text())
          assert m['status']=='QA11_B46_ROLE_EVIDENCE_SHADOW_READ_ONLY'
          sha=m['source_git_sha']; assert re.fullmatch('[a-f0-9]{40}',sha)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'qa12_source_sha').write_text(sha)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('QA12_SOURCE_SHA='+sha+'\n')
          PY_SHA
          git fetch --depth=1 origin "$(cat "$RUNNER_TEMP/qa12_source_sha")"
          git checkout --detach "$(cat "$RUNNER_TEMP/qa12_source_sha")"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/qa12_source_sha")"
          python3 - <<'PY_HASH'
          import hashlib,json,os,pathlib
          m=json.loads((pathlib.Path(os.environ['QA12_IN'])/'QA11_Manifest.json').read_text())
          p=pathlib.Path('data/player_role_v2_week5.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['b46_source_file_sha256']
          PY_HASH
      - name: Create multi-source stable-ID evidence and manual review queue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA12_OUT"
          cat > "$RUNNER_TEMP/qa12_engine.py" <<'PY_QA12'
          #!/usr/bin/env python3
          """QA12: constrained, read-only evidence triangulation; never computes replacement FV."""
          import csv, collections, datetime, hashlib, json, math, os
          from pathlib import Path

          OUT=Path(os.environ['QA12_OUT']);OUT.mkdir(parents=True,exist_ok=True)
          SRC=Path(os.environ['QA12_IN'])

          def load_json(p):
              if not p.is_file():raise RuntimeError(f'Missing evidence {p}')
              return json.loads(p.read_text(encoding='utf-8'))
          def stop(s):raise RuntimeError('QA12 SOURCE/DECISION STOP: '+s)
          def num(x):
              if isinstance(x,bool) or not isinstance(x,(int,float)) or not math.isfinite(x):return None
              return float(x)
          def percentile(value,reference):
              if value is None or not reference:return None
              low=sum(v<value for v in reference)
              eq=sum(v==value for v in reference)
              return round(100*(low+eq/2)/len(reference),1)
          def rank(value,reference):
              return 1+sum(v>value for v in reference)

          manifest=load_json(SRC/'QA11_Manifest.json')
          required={
              'status':'QA11_B46_ROLE_EVIDENCE_SHADOW_READ_ONLY',
              'qa10_run':'41084608509','qa08_run':'41072676062',
              'cohort':72,'exact_baseline_parity':72,'b46_source_week':5,
              'b46_calibrated':False,'b46_price_adjustments_authorized':False,
              'b46_matches':61,'role_sensitive_disagreement':24,
              'new_roles_assigned':0,'new_fv_proposed':0,
              'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repo_mutations':0
          }
          for k,v in required.items():
              if manifest.get(k)!=v:stop(f'QA11 upstream contract drift: {k}: {manifest.get(k)}')
          assert manifest['role_agreement_counts']=={
              'B46_MISSING':5,'B46_POSITION_MISMATCH_HOLD':6,
              'DISAGREE':52,'MATCH':9
          }
          assert manifest['source_git_sha']==os.environ['QA12_SOURCE_SHA']
          cohort=load_json(SRC/'QA11_Shadow72.json')
          if len(cohort)!=72 or len({str(c['sleeper_id']) for c in cohort})!=72:stop('Nonunique QA11 cohort')
          if not all(c['baseline_parity']=='EXACT' and c['applied_change']=='NONE' and c['proposed_new_fv']=='' for c in cohort):
              stop('QA11 price/replay contract violated')
          shadow_sha=hashlib.sha256((SRC/'QA11_Shadow72.json').read_bytes()).hexdigest()

          projections=load_json(Path('scripts/artifacts/generated/team_utility_lineup_projections.json'))
          if projections.get('purpose')!='Team Utility starter selection only; never Fundamental Value':
              stop('2026 projection source policy changed')
          if projections.get('season')!=2026 or projections.get('identity')!='stable Sleeper player_id':
              stop('Unexpected 2026 projection identity/season')
          if not isinstance(projections.get('players'),dict):stop('Expected projection player map')
          proj_map=projections['players']
          valid_positions=('QB','RB','WR','TE','DL','LB','DB')
          proj_peers=collections.defaultdict(list)
          for sid,p in proj_map.items():
              if str(p.get('sleeper_id'))!=str(sid):stop('Projection player ID mismatch: '+sid)
              pos=p.get('pos');value=num(p.get('projection'))
              if pos in valid_positions and value is not None and value>=0:
                  proj_peers[pos].append(value)
          if any(len(proj_peers[p])<30 for p in valid_positions):stop('Too few complete projection peers')

          historical=load_json(Path('scripts/ppg_results.json'))
          if not isinstance(historical,list):stop('Expected historical PPG list')
          hist_by_id=collections.defaultdict(list);hist_peers=collections.defaultdict(list)
          for p in historical:
              sid=str(p.get('sleeper_id') or '')
              if sid:hist_by_id[sid].append(p)
              pos=p.get('pos');games=p.get('games_played');ppg=num(p.get('true_ppg'))
              if pos in valid_positions and isinstance(games,int) and games>=5 and ppg is not None and ppg>=0:
                  hist_peers[pos].append(ppg)

          rows=[]
          for c in cohort:
              sid=str(c['sleeper_id']);pos=c['position'];fv=int(c['published_fv']);age=float(c['age'])
              if pos not in valid_positions+('K',):stop('Unexpected cohort position '+str(pos))
              if fv!=int(c['baseline_fv']):stop('Unreconciled FV '+sid)
              original_projection=c.get('projection_points_CONTEXT_ONLY')
              srcproj=proj_map.get(sid)
              projstatus='MISSING';value=None;percent=None;prank=None;provider='';peer_n=0
              if pos=='K':projstatus='K_EXCLUDED_BY_TEAM_UTILITY_POLICY'
              elif srcproj is None:projstatus='NO_PROJECTION'
              elif srcproj.get('pos')!=pos:projstatus='POSITION_MISMATCH_HOLD'
              else:
                  value=num(srcproj.get('projection'))
                  if value is None or value<0:projstatus='PROJECTION_INVALID_HOLD'
                  else:
                      projstatus='POSITION_MATCHED_CONTEXT_ONLY'
                      peer=proj_peers[pos];peer_n=len(peer)
                      percent=percentile(value,peer);prank=rank(value,peer)
                      provider=srcproj.get('source','')
                      if original_projection is None or abs(float(original_projection)-value)>1e-6:
                          stop('QA11 projection source has changed '+c['player'])
              h_candidates=hist_by_id.get(sid,[])
              h_exact=[h for h in h_candidates if h.get('pos')==pos]
              hstatus='NOT_FOUND';games=None;ppg=None;histpercent=None;hist_n=0
              if pos=='K':hstatus='K_POSITION_POLICY_HOLD'
              elif len(h_exact)>1:hstatus='DUPLICATED_HISTORY_HOLD'
              elif len(h_exact)==1:
                  h=h_exact[0];games=h.get('games_played');ppg=num(h.get('true_ppg'))
                  if ppg is None or not isinstance(games,int):hstatus='INVALID_HISTORY_HOLD'
                  elif games<5:hstatus='THIN_HISTORY_FIVE_GAME_FLOOR'
                  elif len(hist_peers[pos])<20:hstatus='POSITION_REFERENCE_TOO_THIN'
                  else:
                      hstatus='COMPARABLE_FIVE_PLUS_GAMES'
                      histpercent=percentile(ppg,hist_peers[pos]);hist_n=len(hist_peers[pos])
              elif h_candidates:hstatus='POSITION_MISMATCH_HOLD'
              if pos=='K':decision='K_SCORING_HOLD'
              elif projstatus!='POSITION_MATCHED_CONTEXT_ONLY':decision='PROJECTION_OR_IDENTITY_HOLD'
              elif c['role_agreement']=='B46_POSITION_MISMATCH_HOLD':decision='INDEPENDENT_ROLE_POSITION_HOLD'
              elif age<=24 and fv>=3500 and percent<=35:
                  decision='YOUNG_UPSIDE_REVIEW_NO_REPRICE'
              elif fv>=3500 and percent<=25 and histpercent is not None and histpercent<=35:
                  decision='DUAL_SOURCE_PRICE_CONFLICT_REVIEW'
              elif fv>=3500 and percent<=25 and histpercent is not None and histpercent>=60:
                  decision='FORWARD_HISTORY_DIVERGENCE_REVIEW'
              elif fv>=3500 and percent<=25:
                  decision='LOW_FORWARD_PROJECTION_HISTORY_THIN'
              elif fv>=3500 and histpercent is not None and histpercent<=25 and percent<=50:
                  decision='HISTORY_LOW_PROJECTION_MID_REVIEW'
              elif age<=24 and c['role_agreement'] in ('B46_MISSING','B46_POSITION_MISMATCH_HOLD'):
                  decision='YOUNG_CONTEXT_HOLD'
              else:decision='MONITOR_NO_DIRECT_EVIDENCE_CONFLICT'
              if c['role_agreement']=='B46_POSITION_MISMATCH_HOLD' and decision!='K_SCORING_HOLD':
                  decision='INDEPENDENT_ROLE_POSITION_HOLD'
              # Triage descriptions, not pricing coefficients; do not divide/proportionalize FV by projection.
              obj={
                 'sleeper_id':sid,'player':c['player'],'position':pos,'age':age,
                 'current_fv_UNCHANGED':fv,'legacy_fantasy_slot_role':c['legacy_role'],
                 'b46_week5_tier_UNCALIBRATED':c['b46_role_observed'],
                 'b46_status':c['role_agreement'],'b46_active_games_week5':c['b46_games'],
                 '2026_projection_points_CONTEXT_ONLY':value,'2026_projection_source':provider,
                 '2026_projection_identity_status':projstatus,
                 '2026_same_position_percentile_CONTEXT_ONLY':percent,
                 '2026_same_position_rank_CONTEXT_ONLY':prank,
                 '2026_same_position_population':peer_n,
                 'historical_games':games,'historical_true_ppg':ppg,
                 'historical_ppg_status':hstatus,
                 'historical_same_position_percentile_CONTEXT_ONLY':histpercent,
                 'historical_reference_players':hist_n,
                 'role_sensitive':bool(c['role_sensitive']),
                 'triage_only':decision,
                 'prospect_protection':'YOUNG_DYNASTY_CONTEXT_REQUIRED' if age<=24 else 'MULTI_YEAR_ROLE_AND_DYNASTY_CONTEXT_REQUIRED',
                 'independent_dynasty_market_checked':'NO',
                 'replacement_fv':'','new_role':'','production_change':'NONE',
              }
              rows.append(obj)
          assert len(rows)==72
          counts=collections.Counter(r['triage_only'] for r in rows)
          priority={
              'DUAL_SOURCE_PRICE_CONFLICT_REVIEW':0,
              'FORWARD_HISTORY_DIVERGENCE_REVIEW':1,
              'LOW_FORWARD_PROJECTION_HISTORY_THIN':2,
              'HISTORY_LOW_PROJECTION_MID_REVIEW':3,
              'YOUNG_UPSIDE_REVIEW_NO_REPRICE':4,
              'INDEPENDENT_ROLE_POSITION_HOLD':5,
              'PROJECTION_OR_IDENTITY_HOLD':6,
              'K_SCORING_HOLD':7,
              'YOUNG_CONTEXT_HOLD':8,
              'MONITOR_NO_DIRECT_EVIDENCE_CONFLICT':9,
          }
          rows.sort(key=lambda r:(priority.get(r['triage_only'],99),-r['current_fv_UNCHANGED'],r['player']))
          with (OUT/'QA12_All72_Evidence_Triage.csv').open('w',encoding='utf-8',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          (OUT/'QA12_All72_Evidence_Triage.json').write_text(json.dumps(rows,indent=2,allow_nan=False)+'\n')

          def asnum(x):return 'N/A' if x is None else f'{x:,.1f}'
          summary=[
          '# A-QA12 — Multi-Source Fallback FV Contradiction Triage (Read Only)','',
          '**NO FV REPLACEMENTS, NO ROLE CHANGES, NO PRODUCTION RELEASE.**','',
          '## Source boundaries and caveats','',
          '- Reuses the 72/72 exact QA11 historical live-FV replay. All current values unchanged.',
          '- 2026 projections are a **Team Utility-only** source; relative percentile is **audit context, never an FV equation**.',
          '- `scripts/ppg_results.json` is a historical scoring observation. Games below five are thin; season attribution is not established by this file alone.',
          '- Uses all correctly positioned 2026 projection peers, and five-plus-game historical scoring peers, per position.',
          '- The frozen B46 Week 5 roles are uncalibrated and not authorized for direct FV changes.',
          '- Young prospects (24 and under), missing sources, K scoring, and DL/LB source-position mismatches are held rather than discounted.',
          '- These flags identify *questions for human review*, not validated injury-adjusted dynasty prices.',
          '', '## Review queue','', '| Disposition | Players |','|---|---:|']
          for k,n in sorted(counts.items(),key=lambda kv:(priority.get(kv[0],99),kv[0])):
              summary.append(f'| {k} | {n} |')
          summary+=['', '## Leading cases — projection and historical production context','',
              '| Player | Pos | FV | 2026 proj. | Pos. pct. | Hist. games | Hist. pct. | Review status |',
              '|---|---|---:|---:|---:|---:|---:|---|']
          for r in rows[:22]:
              summary.append('| '+' | '.join([
                r['player'].replace('|','/'),r['position'],f"{r['current_fv_UNCHANGED']:,}",
                asnum(r['2026_projection_points_CONTEXT_ONLY']),asnum(r['2026_same_position_percentile_CONTEXT_ONLY']),
                str(r['historical_games']) if r['historical_games'] is not None else 'N/A',
                asnum(r['historical_same_position_percentile_CONTEXT_ONLY']),
                r['triage_only']])+' |')
          summary+=['', '## Why this is not a repricing model','',
          '1. A low single-season projection alone cannot quantify intrinsic dynasty FV; rookies, injury recoveries, and future opportunity require separate treatment.',
          '2. Percentiles across projected points and production history are not a calibrated market-value conversion.',
          '3. A role-only counterfactual is not a price recommendation, and using B46 tiers directly would sometimes **increase** exaggerated values.',
          '4. Numerical corrections require independent multi-year NFL opportunity, dynasty-market evidence, and out-of-sample calibration.',
          '5. Future PREVIEW and APPLY still require separate explicit owner decisions.',
          '', '## Audit artifacts','',
          '- `QA12_All72_Evidence_Triage.csv` and JSON: exact stable-ID evidence, position peer ranks, source quality and holds.',
          '- `QA12_Manifest.json`: pinned SHA, dataset checksums, counts and zero-change proof.',
          '',f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",'']
          (OUT/'QA12_Report.md').write_text('\n'.join(summary),encoding='utf-8')
          check_files=[Path('scripts/artifacts/generated/team_utility_lineup_projections.json'),
              Path('scripts/ppg_results.json'),SRC/'QA11_Shadow72.json']
          outputs={
           'status':'QA12_MULTISOURCE_PRICE_CONTRADICTION_TRIAGE_READ_ONLY',
           'qa11_run_id':os.environ['QA11_RUN_ID'],
           'source_git_sha':manifest['source_git_sha'],
           'cohort':72,'exact_baseline_parity':72,'role_sensitive_disagreements':24,
           'source_qa11_shadow_sha256':shadow_sha,
           'input_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in check_files},
           'triage_counts':dict(sorted(counts.items())),
           'new_roles_assigned':0,'new_fv_proposed':0,
           'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,'repo_mutations':0,
           'read_only':True,'explicit_release_authorization':False,
           'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          (OUT/'QA12_Manifest.json').write_text(json.dumps(outputs,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'cohort':72,'source':manifest['source_git_sha'],'counts':outputs['triage_counts'],'release':False}))
          PY_QA12
          python3 -m py_compile "$RUNNER_TEMP/qa12_engine.py"
          python3 "$RUNNER_TEMP/qa12_engine.py"
      - name: Verify zero production changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY_RELEASE'
          import json,os,pathlib
          out=pathlib.Path(os.environ['QA12_OUT'])
          m=json.loads((out/'QA12_Manifest.json').read_text())
          assert m['status']=='QA12_MULTISOURCE_PRICE_CONTRADICTION_TRIAGE_READ_ONLY'
          assert m['cohort']==72 and m['exact_baseline_parity']==72
          assert m['read_only'] and not m['explicit_release_authorization']
          assert all(m[k]==0 for k in ('fv_changes','fv_plus_changes','mv_changes','repo_mutations','new_roles_assigned','new_fv_proposed'))
          PY_RELEASE
      - name: Upload QA12 read-only audit outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA12-Production-Projection-Evidence
          path: /tmp/a-qa12-out/
          retention-days: 30
          if-no-files-found: error
      - name: Print mobile-friendly review
        if: always()
        shell: bash
        run: |
          if test -f "$QA12_OUT/QA12_Report.md"; then
            cat "$QA12_OUT/QA12_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA12 did not complete evidence audit; production left unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
