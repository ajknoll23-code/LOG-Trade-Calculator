name: B38 Weekly Floor Ceiling Volatility V1 - Prospective-Only Preregistration and Week 4 Freeze
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SELF_WORKFLOW: B38-weekly-floor-ceiling-volatility-v1-prospective-only-prereg-week4-freeze.yml
  EXPECTED_B37_RESULT_BLOB_SHA: abce415131e695fed2486febb3d95daa9a48ae80
  EXPECTED_B37_AUDITOR_BLOB_SHA: dccc91d3f85918d598b17ac719e08ed5f4acc322
  SNAPSHOT_BUILDER_SHA256: 5d7ebae759c8b96f541825985995d3b743b3fe8a4a6e989018455d7c706d87af
  NEXTDYNE_URL: https://www.nextdyne.io/tools/dynasty-weekly-projections
jobs:
  preregister_and_freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install predictor-freeze dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir   "requests>=2.32,<3"   "beautifulsoup4>=4.12,<5"
    - name: Verify exact B37 feasibility prerequisite
      shell: bash
      run: |
        set -euo pipefail

        test "$(git hash-object research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json)"   = "$EXPECTED_B37_RESULT_BLOB_SHA"
        test "$(git hash-object research/weekly-floor-ceiling-volatility-v1/weekly_floor_ceiling_volatility_v1_nextdyne_source_audit.py)"   = "$EXPECTED_B37_AUDITOR_BLOB_SHA"

        python3 - <<'PY'
        import json
        from pathlib import Path

        base = Path("research/weekly-floor-ceiling-volatility-v1")
        d = json.loads(
            (base / "weekly_floor_ceiling_volatility_v1_phase1a_nextdyne_source_feasibility.json")
            .read_text(encoding="utf-8")
        )

        assert d["status"] == (
            "PASS_NEXTDYNE_CURRENT_SNAPSHOT_FEASIBILITY_"
            "PROSPECTIVE_ONLY_DESIGN_REVIEW_REQUIRED"
        )
        assert all(d["hard_gates"].values())
        assert d["coverage"]["valid_band_rows"] == 707
        assert d["historical_archive"][
            "reproducible_full_historical_snapshot_archive_proven"
        ] is False
        assert d["historical_archive"]["retrospective_phase_authorized"] is False
        assert d["governance"]["realized_player_outcome_association_opened"] is False
        assert d["governance"]["production_change_authorized"] is False

        root = base / "prospective-snapshots"
        assert not (root / "2026-W04.json").exists()
        assert not (root / "2026-W04.manifest.json").exists()

        print("PASS: exact B37 scientific prerequisite verified.")
        PY
    - name: Snapshot production surfaces
      shell: bash
      run: |
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Freeze B38 protocol and predictor implementation before source capture
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from __future__ import annotations

