name: A - FA11R1 Pre-Week9 Matched Free Agent Forward Evaluation Contract (Guarded)

# Pre-register a prospective research plan BEFORE future Week9+ outcomes.
# The 42 watch/control pairs and prior LOG scoring remain immutable.
# Preview only creates a downloadable report. Apply adds precisely one JSON
# research contract; it cannot modify any valuation model, live board, or source.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: preview
        description: Preview or freeze exactly one research-only evaluation contract
        options:
          - preview
          - apply

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  contract:
    name: Verify fixed Week9 watch and controls, then preregister outcome comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main for guarded research-only contract
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify previously frozen registry blobs and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          W='research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json'
          C='research/free-agent-opportunity/forward-registrations/2026-W09_FA09R1_frozen_42_matched_controls.json'
          test "$(git hash-object "$W")" = 'f5d005b6a37a33444be76ec28e6b6a98174af47b'
          test "$(git hash-object "$C")" = '100b934aaa4aeaebd0a10944d88d37e0e499fdc8'
          test -f scripts/model/ppg_pipeline.py
          echo 'PASS original watch/control frozen membership unchanged'

      - name: Download immutable FA10R1 source report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/a-fa11r1
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          gh run download 40572720556 --repo "$GITHUB_REPOSITORY" --name A_FA10R1_PRE_ORIGIN_42_PAIR_LOG_SCORE_BASELINE --dir "$REPORT_DIR"
          echo '07275af5a745cbe9a05d2cd99bc2cb00c4eec7ab417f65a9daab38da4fd6e889  '"$REPORT_DIR/A_FA10R1_pair_baselines.csv" | sha256sum -c -
          echo 'a56d66ee27a13cae723108eb4f6c69f749b016cb7c029d52a574a0eb7edf005f  '"$REPORT_DIR/A_FA10R1_baseline_report.json" | sha256sum -c -

      - name: Replay exact 42-pair baseline and build prospective contract
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa11r1
        run: |
          set -euo pipefail
          cat > "$REPORT_DIR/A_FA11R1_engine.py" <<'PYCODE'
          #!/usr/bin/env python3
          """FA11R1: deterministic frozen 2026 W09 matched evaluation contract.

          No post-origin retrieval, scoring, predictions, live-board or valuations modifications.
          """
          from __future__ import annotations
          import argparse,csv,hashlib,json,math,os
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path

          WPATH=Path('research/free-agent-opportunity/forward-registrations/2026-W09_FA08R1_frozen_42_shadow_watch.json')
          CPATH=Path('research/free-agent-opportunity/forward-registrations/2026-W09_FA09R1_frozen_42_matched_controls.json')
          WATCH_GIT_BLOB='f5d005b6a37a33444be76ec28e6b6a98174af47b'
          CONTROL_GIT_BLOB='100b934aaa4aeaebd0a10944d88d37e0e499fdc8'
          FA10_CSV_SHA='07275af5a745cbe9a05d2cd99bc2cb00c4eec7ab417f65a9daab38da4fd6e889'
          FA10_JSON_SHA='a56d66ee27a13cae723108eb4f6c69f749b016cb7c029d52a574a0eb7edf005f'
          FA10_RUN_ID=40572720556
          DEST='research/free-agent-opportunity/forward-registrations/2026-W09_FA11R1_prospective_evaluation_contract.json'
          TIER_COUNTS={'PRIMARY_LE_10_SNAPS':30,'SECONDARY_LE_20_SNAPS':3,'WEAK_GT_20_SNAPS':9}
          FLAGS={'SNAP_AND_PTS_APPROX_BALANCED':21,'SNAP_CLOSE_PTS_IMBALANCED':9,'WEAK_SNAP_CONTROL':12}


          def digest(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def num(x):
              try:
                  y=float(x)
                  assert math.isfinite(y)
                  return y
              except (ValueError,TypeError,AssertionError):raise AssertionError(f'Nonfinite or missing baseline number: {x!r}')

          def compile_contract(watch,controls,source,rows,now):
              assert watch['classification']=='FROZEN_RESEARCH_WATCH_NOT_CALIBRATED_PREDICTION'
              assert controls['classification']=='PROSPECTIVE_RESEARCH_CONTROLS_NOT_PREDICTIVE_ACCURACY'
              assert watch['registered_for_week']==controls['evaluation_start_week']==9
              assert watch['registered_for_season']==controls['registered_season']==2026
              assert watch['usage_and_scoring_feature_weeks']==[5,6,7]
              assert controls['feature_weeks']==[5,6,7]
              assert watch['future_outcomes_used_as_features'] is False and controls['future_outcomes_used'] is False
              assert watch['predictive_accuracy_established'] is False and controls['predictive_accuracy_established'] is False
              assert watch['pricing_changes_authorized'] is False and controls['pricing_changes_authorized'] is False
              assert controls['source_FA08_git_blob']==WATCH_GIT_BLOB
              assert source['source_FA08_git_blob']==WATCH_GIT_BLOB
              assert source['source_FA09_git_blob']==CONTROL_GIT_BLOB
              assert source['status']=='BASELINE_RESEARCH_COMPLETE' and source['future_2026_week9_plus_accessed'] is False
              assert source['complete_pair_preorigin_scoring']==42 and source['watch_score_source_drift_pairs']==0
              assert source['source_scorer']=='scripts/model/ppg_pipeline.py'
              assert source['all_weekly_sources_same_as_FA07_R1'] is False
              assert len(watch['players'])==len(controls['pairs'])==len(rows)==42

              bywatch={str(p['player_id']):p for p in watch['players']}
              bycontrol={str(p['watch_id']):p for p in controls['pairs']}
              assert len(bywatch)==len(bycontrol)==42
              unique_controls={str(p['control_id']) for p in controls['pairs']}
              assert len(unique_controls)==42 and not (set(bywatch)&unique_controls)
              assert sum(TIER_COUNTS.values())==42
              assert Counter(p['comparability_tier'] for p in controls['pairs'])==TIER_COUNTS
              assert Counter(r['preorigin_balance_diagnostic'] for r in rows)==FLAGS
              assert Counter(r['comparability_tier'] for r in rows)==TIER_COUNTS

              records=[]
              for row in rows:
                  sid=str(row['watch_id']);cid=str(row['control_id']);p=bycontrol.get(sid);w=bywatch.get(sid)
                  assert p is not None and w is not None
                  assert cid==str(p['control_id']) and p['comparability_tier']==row['comparability_tier']
                  assert p['watch_name']==row['watch_name']==w['name']
                  assert p['control_name']==row['control_name']
                  assert p['position']==row['position']==w['position']
                  assert p['watch_lane']==row['watch_lane']==w['shadow_lane']
                  assert row['both_have_complete_w5_w7_scores']=='True'
                  assert row['watch_scoring_changed_vs_frozen_FA08']=='False'
                  assert row['missing_status_watch']==row['missing_status_control']==''
                  assert abs(num(row['abs_week7_snap_gap'])-num(p['abs_w7_snap_gap']))<.001
                  pre_diff=num(row['watch_preorigin_three_week_avg'])-num(row['control_preorigin_three_week_avg'])
                  assert abs(pre_diff-num(row['watch_minus_control_preorigin_avg']))<=.0015
                  assert abs(num(row['watch_week7_pts'])-num(w['week7_LOG_pts']))<.001
                  assert row['preorigin_balance_diagnostic'] in FLAGS
                  records.append({
                    'position':row['position'],'watch_id':sid,'control_id':cid,'watch_name':row['watch_name'],
                    'control_name':row['control_name'],'watch_lane':row['watch_lane'],
                    'young_screen':row['young_screen']=='True',
                    'comparability_tier':row['comparability_tier'],
                    'preorigin_balance_diagnostic':row['preorigin_balance_diagnostic'],
                    'week7_snap_gap_abs':num(row['abs_week7_snap_gap']),
                    'watch_preorigin_w5_w7_log_ppg':num(row['watch_preorigin_three_week_avg']),
                    'control_preorigin_w5_w7_log_ppg':num(row['control_preorigin_three_week_avg']),
                    'preorigin_watch_minus_control_ppg':num(row['watch_minus_control_preorigin_avg']),
                    'watch_w7_LOG_pts':num(row['watch_week7_pts']),
                    'control_w7_LOG_pts':num(row['control_week7_pts']),
                  })
              assert len({x['watch_id'] for x in records})==42
              assert len({x['control_id'] for x in records})==42
              records.sort(key=lambda p:(['PRIMARY_LE_10_SNAPS','SECONDARY_LE_20_SNAPS','WEAK_GT_20_SNAPS'].index(p['comparability_tier']), p['position'],p['watch_id']))
              manifest={
                'schema_version':1,'study':'A FA11R1 pre-outcome prospective evaluation contract for FA08/FA09 Week9 shadow study',
                'classification':'RESEARCH_ONLY_PRE_OUTCOME_ANALYSIS_PLAN_NOT_MODEL_VALIDATION',
                'registered_at_utc':now.astimezone(timezone.utc).isoformat(timespec='seconds'),
                'evaluation_season':2026,'evaluation_weeks':[9,10,11,12],
                'future_week9_plus_data_retrieved':False,
                'source_league_waivers_frozen_preorigin_week9':True,
                'week9_first_kickoff_before_registration_certified':False,
                'cohorts_not_reselected':True,
                'primary_group':'PRIMARY_LE_10_SNAPS',
                'primary_group_size':30,
                'primary_estimand':{
                  'metric':'mean_paired_forward_LOG_points_difference_per_played_week',
                  'population':'30 fixed PRIMARY_LE_10_SNAPS pairs',
                  'observation_unit':'pair-week with verified game participation and numeric LOG-scored records for BOTH players',
                  'pair_weighting':'First average all observed eligible future weeks within each pair; then equally weight the eligible pairs',
                  'formula':'mean_over_eligible_pairs(mean_over_common_played_weeks(watch_points - control_points))',
                  'positive_interpretation':'watched players scored more LOG points than matched alternatives during qualifying future game-weeks',
                  'missing_data':'No positive GP => missing, never zero. Confirmed DNP/IR separate availability outcome, not an assumed 0. Missing API record never 0.',
                  'no_eligible_pairs_behavior':'Do not calculate advantage or claim success',
                  'no_eligible_weeks_per_pair':'Exclude from primary numeric estimate; report excluded pair counts explicitly',
                  'minimum_coverage_reporting':'Report eligible pair count, player-week and pair-week coverage, GP presence and missingness by position and watch lane; no performance threshold gates invented',
                },
                'secondary_descriptive_estimands':[
                  'The same forward paired LOG points metric within each of the three original snap-quality tiers, kept SEPARATE; no all-42 pooled headline.',
                  'Paired mean difference minus original preorigin W5-W7 paired difference; descriptive baseline-adjusted sensitivity, not causal proof.',
                  'Positive, negative and tied pair rates, conditioned on common played future weeks, with denominator printed.',
                  'Separate descriptive comparisons by young/veteran lane and position where sample count permits; no overgeneralizing small cells.',
                  'Week-by-week versus aggregate scores, coverage, confirmed missed games and source-level timestamped changes.',
                  'Future watch-list value changes or pickup utility are NOT proven by fantasy points alone.',
                ],
                'frozen_counts':{'watch':42,'controls':42,'snap_close_primary':30,'secondary_snap':3,'weak_snap':9,
                                 'scoring_balanced':21,'snap_close_pts_imbalanced':9,'weak_control':12},
                'source':{
                  'FA08_registry_path':str(WPATH),'FA08_git_blob':WATCH_GIT_BLOB,
                  'FA09_registry_path':str(CPATH),'FA09_git_blob':CONTROL_GIT_BLOB,
                  'FA10_run_id':FA10_RUN_ID,'FA10_csv_sha256':FA10_CSV_SHA,'FA10_report_json_sha256':FA10_JSON_SHA,
                  'league_scorer_path':source['source_scorer'],'league_scorer_sha256':source['source_scorer_sha256'],
                  'source_weekly_manifest':source['source_weekly_manifest'],
                  'week7_archived_Sleeper_source_drift_seen':True,
                  'watch_scorer_drift_pairs':0,
                },
                'future_outcome_policy':[
                  'Do not evaluate Week9 before relevant NFL games conclude and weekly Sleeper scores are available.',
                  'Do not modify original FA08 or FA09 members, score thresholds, matching, preorigin PPG, feature weeks, or study contract after outcome observed.',
                  'Do not use 2026 Week9+ data as features or replace frozen waiver identities with a refreshed waiver cache.',
                  'If Sleeper source or scoring code changes, retain input digests and report any paired scoring drift; never silently change prior baseline.',
                  'A transparent retrospective study of participants is not automatically a verified profitable fantasy pickup policy.',
                  'Report all 42 fixed pairs and primary/secondary/weak strata even when outcomes are incomplete or unfavorable.',
                ],
                'pricing_changes_authorized':False,'live_board_changes_authorized':False,
                'predicted_probabilities_available':False,'predictive_accuracy_established':False,
                'immutable_repository_target':DEST,
                'pairs':records,
              }
              return manifest


          def selftest():
              # Small isolated schema/identity/association checks; real 42-pair contract is validated on execution.
              p={'watch_id':'A','control_id':'B','watch_name':'Player A','control_name':'Player B', 'comparability_tier':'PRIMARY_LE_10_SNAPS'}
              a=[p]; assert len({x['watch_id'] for x in a})==len(a)
              assert not ({p['watch_id'] for p in a}&{p['control_id'] for p in a})
              assert abs((9.0-7.0)-2.0)<1e-12
              assert sum(TIER_COUNTS.values())==42 and sum(FLAGS.values())==42
              print('PASS FA11R1 synthetic pair identity, pre-origin-diff, missingness plan and fixed group-count guards')


          def main():
              parser=argparse.ArgumentParser();parser.add_argument('--selftest',action='store_true');parser.add_argument('--source-dir');parser.add_argument('--output-dir'); args=parser.parse_args()
              if args.selftest:return selftest()
              assert args.source_dir and args.output_dir
              source=Path(args.source_dir);out=Path(args.output_dir);out.mkdir(parents=True,exist_ok=True)
              csvfile=source/'A_FA10R1_pair_baselines.csv';jsonfile=source/'A_FA10R1_baseline_report.json'
              assert digest(csvfile)==FA10_CSV_SHA,'FA10 matched pairs artifact drift'
              assert digest(jsonfile)==FA10_JSON_SHA,'FA10 research metadata drift'
              watch=json.loads(WPATH.read_text()); controls=json.loads(CPATH.read_text()); meta=json.loads(jsonfile.read_text()); rows=list(csv.DictReader(csvfile.open()))
              contract=compile_contract(watch,controls,meta,rows,datetime.now(timezone.utc))
              (out/'A_FA11R1_evaluation_contract.json').write_text(json.dumps(contract,indent=2,sort_keys=True)+'\n')
              with (out/'A_FA11R1_fixed_pairs.csv').open('w',newline='') as f:
                  keys=list(contract['pairs'][0]);w=csv.DictWriter(f,fieldnames=keys);w.writeheader();w.writerows(contract['pairs'])
              md=['# A FA11R1 — Frozen Pre-Week9 Forward Evaluation Contract', '',
                  '**Research only — NO future observations used, no predicted player breakout probabilities, no production changes.**','',
                  '## Confirmed pre-origin foundation','',
                  '- 42 watched players / 42 distinct controls; 30 primary close-snap pairs; 3 secondary and 9 weak pairs kept separate.',
                  '- 21 reasonable baseline snap + scoring pairs; 9 close-snap fantasy-imbalanced; 12 weak snap controls.',
                  '- Weeks 5–7 are the only usage and score features. Evaluation planned for Weeks 9–12; Week 8 intentionally not used in this frozen study.',
                  '- Archived Sleeper Week7 raw source changed between FA07 and FA10. Scored watched-player drift remained zero; keep all source SHA-256 identifiers.','',
                  '## Primary metric', '',
                  'For each of the original 30 primary pairs, compare exact LOG fantasy points only on future weeks where both have confirmed game participation and scored records. Average eligible weeks within each pair, then average pairs equally. Print coverage and excluded-pair counts.', '',
                  '## Other disclosures', '',
                  '- Never fill an absent source row or unconfirmed GP with a fabricated zero. Track confirmed DNP separately.',
                  '- Publish all three original snap-match strata; do not cherry-pick successful controls or change membership.',
                  '- Show baseline-adjusted differences only as sensitivity analysis; not causal treatment effects.',
                  '- Week9 first kickoff timing has not been independently certified by this job.',
                  '- Next measurement should occur only when post-week9 data actually exists. No future fetch happens in this workflow.','',
                  f'**Immutable apply target:** `{DEST}`','']
              (out/'A_FA11R1_report.md').write_text('\n'.join(md))
              print('FA11R1_PRE_OUTCOME_PROTOCOL_PASS',json.dumps({'pairs':len(contract['pairs']),'primary':30,'balanced':21,'future_outcomes_accessed':False}))

          if __name__=='__main__':main()
          PYCODE
          python3 "$REPORT_DIR/A_FA11R1_engine.py" --selftest
          python3 "$REPORT_DIR/A_FA11R1_engine.py" --source-dir "$REPORT_DIR" --output-dir "$REPORT_DIR"
          python3 -m json.tool "$REPORT_DIR/A_FA11R1_evaluation_contract.json" >/dev/null
          test -z "$(git status --porcelain)"

      - name: Upload research-only evaluation contract and complete fixed comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA11R1_W09_PREOUTCOME_MATCHED_EVALUATION_PLAN
          path: |
            ${{ runner.temp }}/a-fa11r1/A_FA11R1_evaluation_contract.json
            ${{ runner.temp }}/a-fa11r1/A_FA11R1_fixed_pairs.csv
            ${{ runner.temp }}/a-fa11r1/A_FA11R1_report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Apply one immutable Week 9 forward evaluation research contract
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa11r1
        run: |
          set -euo pipefail
          p='research/free-agent-opportunity/forward-registrations/2026-W09_FA11R1_prospective_evaluation_contract.json'
          test ! -e "$p" || { echo 'Contract already frozen; refuse overwrite'; exit 1; }
          test -z "$(git status --porcelain)"
          mkdir -p "$(dirname "$p")"
          cp "$REPORT_DIR/A_FA11R1_evaluation_contract.json" "$p"
          test "$(git ls-files --others --exclude-standard)" = "$p" || { echo 'Unexpected untracked files'; exit 1; }
          git add -- "$p"
          test "$(git diff --cached --name-only)" = "$p"
          git diff --cached --check
          git config user.name 'a-fa11-shadow-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'A FA11R1: freeze preregistered Week9 matched free-agent evaluation contract (research only)'
          git push origin HEAD:main
          echo 'PASS research-only Week9 evaluation contract committed, no production changes'

      - name: Preview-only result
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'PASS preview only. Use mode=apply once to freeze the fixed evaluation contract.'
