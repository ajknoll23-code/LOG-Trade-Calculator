name: Package Adjustment NextGen V2 Commit Maturity Plan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependency
        run: python3 -m pip install requests

      - name: Guard exact frozen catalog and preregistration boundary
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/challenge_catalog_design.md")" = "2ff9ab79043d9bf91f825575fe404c0ccc0ea11e"
          test "$(git hash-object "$D/generate_package_vote_challenges_nextgen_v2.py")" = "8d4746d00b57187a74b8add75ff7b72fc5a9342d"
          test "$(git hash-object "$D/package_adjustment_nextgen_v2_research_spec.md")" = "6dca31266a0e22a750f0a15f6aaf87a6648fb77a"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"

          test ! -e "$D/evidence_maturity_plan.json"
          test ! -e "$D/evidence_maturity_plan.md"
          test ! -e "$D/evidence_maturity_plan_manifest.json"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          manifest = json.loads((d / "catalog_freeze_manifest.json").read_text())

          assert manifest["status"] == "frozen_package_adjustment_nextgen_v2_catalog"
          assert manifest["frozen"] is True
          assert manifest["released_to_voters"] is False
          assert manifest["voting_activated"] is False
          assert manifest["production_change_authorized"] is False
          assert manifest["activation"]["authorized"] is False
          assert manifest["activation"]["maturity_plan_committed"] is False
          assert manifest["challenge_count"] == 129
          assert manifest["canonical_challenge_payload_sha256"] == (
              "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab"
          )
          assert manifest["catalog"]["sha256"] == (
              "953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5"
          )

          cat = json.loads((d / "package_vote_challenges_nextgen_v2.json").read_text())
          assert cat["status"] == "frozen_package_adjustment_nextgen_v2"
          assert cat["frozen"] is True
          assert cat["freeze"]["voting_activated"] is False
          assert cat["freeze"]["production_change_authorized"] is False

          canonical = json.dumps(
              cat["challenges"],
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == (
              manifest["canonical_challenge_payload_sha256"]
          )

          diag = cat["catalog_diagnostics"]
          assert diag["challenge_count"] == 129
          assert diag["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert diag["split_counts"] == {
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
              "train": 75,
          }

          print("PASS: exact frozen preregistration boundary confirmed.")
          PY

      - name: Verify production before maturity-plan commit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Create immutable evidence maturity plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import textwrap
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          plan_json = d / "evidence_maturity_plan.json"
          plan_md = d / "evidence_maturity_plan.md"
          plan_manifest = d / "evidence_maturity_plan_manifest.json"

          source = {
              "workflow_run_id": 34563171372,
              "workflow_head_sha": "3021b1a2a0325a2835190e3b177749957a4497d4",
              "artifact_id": 10185046287,
              "artifact_zip_sha256": (
                  "a806dd4e1aa362a9bf02caa732f6b6e6b7565cca1ef5e48de565cb7c1734241d"
              ),
              "simulation_seed": 20260911,
              "simulation_trials_per_scenario": 20000,
              "historical_unique_voter_union": 36,
              "historical_phase_votes": {"V3": 300, "V4": 300, "V5": 600},
              "historical_phase_voters": {"V3": 15, "V4": 15, "V5": 30},
              "historical_observed_ballots_per_voter": 20,
          }

          plan = {
              "schema_version": 1,
              "status": "preregistered_before_nextgen_voting",
              "research_only": True,
              "voting_activated": False,
              "production_change_authorized": False,
              "automatic_gate_relaxation_allowed": False,
              "frozen_evidence": {
                  "challenge_count": 129,
                  "experimental_cell_count": 24,
                  "training_cell_count": 13,
                  "structural_scale_holdout_cell_count": 5,
                  "structural_topology_holdout_cell_count": 6,
                  "canonical_challenge_payload_sha256": (
                      "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab"
                  ),
                  "frozen_catalog_sha256": (
                      "953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5"
                  ),
              },
              "planning_evidence": source,
              "sampling": {
                  "schedule_id": "equal_cell_via_family_weights_v1",
                  "selection_order": [
                      "family",
                      "cell_uniform_within_selected_family",
                      "challenge_uniform_within_selected_cell",
                      "display_side_randomized",
                  ],
                  "family_probabilities": {
                      "core_concentration_2v2": 0.625,
                      "fragmentation_filler": 0.125,
                      "structural_topology_3v3": 0.25,
                  },
                  "cell_probability": 1.0 / 24.0,
                  "adaptive_sampling_from_vote_outcomes_allowed": False,
                  "fv_visible_to_voter": False,
                  "display_left_probability": 0.5,
              },
              "voter_protections": {
                  "daily_valid_nextgen_vote_cap": 20,
                  "primary_evidence_effective_lifetime_cap": 20,
                  "reason_for_20_vote_effective_cap": (
                      "all V3/V4/V5 phase records observed exactly 20 ballots per voter; "
                      "the power/coverage simulation was therefore run at 20 ballots per voter, "
                      "and the stricter cap limits dependence on repeat-voter volume"
                  ),
                  "voter_identity_retained_for_cluster_inference": True,
                  "timestamp_retained": True,
              },
              "primary_maturity_checkpoint": {
                  "minimum_valid_effective_votes": 800,
                  "minimum_distinct_voters": 40,
                  "minimum_valid_effective_votes_per_each_of_24_cells": 15,
                  "minimum_distinct_voters_per_each_of_24_cells": 10,
                  "all_four_conditions_required": True,
                  "simulation_support_at_40_voters_800_votes": {
                      "probability_all_cells_at_least_15_votes": 0.9978,
                      "conservative_lower_bound_probability_all_cells_at_least_10_distinct_voters": (
                          0.9998095936565122
                      ),
                      "p10_minimum_votes_in_any_cell": 19,
                      "median_minimum_votes_in_any_cell": 23,
                      "expected_votes_per_cell": 33.33333333333333,
                      "expected_distinct_voters_per_cell": 22.92377464923388,
                  },
              },
              "stopping_rule": {
                  "outcome_direction_may_affect_stopping": False,
                  "significance_may_affect_stopping": False,
                  "agreement_with_production_may_affect_stopping": False,
                  "first_evaluation_checkpoint_valid_votes": 800,
                  "if_coverage_not_mature_continue_in_fixed_vote_increments": 100,
                  "hard_collection_cap_valid_effective_votes": 1200,
                  "stop_as_mature": (
                      "stop at the first preregistered checkpoint at or above 800 valid "
                      "effective votes where all maturity coverage conditions are satisfied"
                  ),
                  "stop_as_coverage_unresolved": (
                      "if 1200 valid effective votes are reached and any required coverage "
                      "condition remains unsatisfied, stop collection, label the affected "
                      "cell/family coverage-unresolved, and do not relax gates"
                  ),
              },
              "primary_uncertainty": {
                  "statistic": (
                      "90_percent_percentile_interval_from_nonparametric_voter_cluster_bootstrap"
                  ),
                  "resampling_unit": "voter",
                  "all_ballots_for_resampled_voter_move_together": True,
                  "primary_model_comparison_metric": "held_out_log_loss",
                  "effect_direction_required_for_maturity": False,
                  "confidence_interval_excluding_zero_required_for_maturity": False,
                  "exact_fit_and_bootstrap_implementation_must_be_frozen_before_activation": True,
              },
              "holdout_protection": {
                  "train_split_fit_eligible": True,
                  "structural_scale_holdout_fit_eligible": False,
                  "structural_topology_holdout_fit_eligible": False,
                  "holdouts_may_be_used_for_hyperparameter_selection": False,
                  "holdouts_may_be_used_for_knot_selection": False,
                  "holdouts_may_be_used_for_regularization_selection": False,
                  "prospective_time_holdout_required_after_candidate_freeze": True,
                  "prospective_time_holdout_used_for_model_selection": False,
              },
              "unresolved_definition": {
                  "cell_coverage_unresolved_at_hard_cap_if": (
                      "valid_effective_votes_below_15_or_distinct_voters_below_10"
                  ),
                  "family_coverage_unresolved_if": (
                      "any_required_cell_in_family_is_coverage_unresolved"
                  ),
                  "outcome_ambiguity_policy": (
                      "ambiguous or tied model evidence is reported as inferentially unresolved; "
                      "it does not justify outcome-contingent extension of vote collection"
                  ),
                  "gate_changes_after_nextgen_outcomes_require_new_preregistered_revision": True,
              },
              "remaining_pre_activation_requirement": {
                  "model_fit_preregistration_frozen": False,
                  "must_freeze_before_activation": [
                      "M2a parameter fit",
                      "M2b spline parameterization",
                      "knot rule",
                      "regularization",
                      "optimizer",
                      "choice likelihood",
                      "bootstrap implementation and draw count",
                      "model-selection rule",
                      "solver tolerance",
                  ],
              },
          }

          plan_json.write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = """
          # Package Adjustment NextGen V2 — Evidence Maturity Plan

          **Status: PREREGISTERED BEFORE NEXTGEN VOTING — RESEARCH ONLY. VOTING IS NOT ACTIVATED. PRODUCTION V1.6 IS UNCHANGED.**

          ## Frozen evidence anchor

          - Frozen challenges: **129**
          - Realized experimental cells: **24**
          - Training cells: **13**
          - Structural scale holdout cells: **5**
          - Structural topology holdout cells: **6**
          - Canonical challenge payload SHA-256: `fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab`
          - Frozen catalog SHA-256: `953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5`

          ## Planning evidence

          This plan was fixed before any NextGen voting outcome existed.

          The read-only maturity-planning audit was GitHub Actions run `34563171372`,
          artifact `10185046287`, artifact ZIP SHA-256
          `a806dd4e1aa362a9bf02caa732f6b6e6b7565cca1ef5e48de565cb7c1734241d`.

          Historical participation showed 300 / 300 / 600 counted votes in V3 / V4 / V5,
          with 15 / 15 / 30 voters and **36 unique pseudonymous voters across the three snapshots**.
          Every historical phase record contained exactly 20 votes per voter.

          ## Frozen sampling schedule

          Use `equal_cell_via_family_weights_v1`.

          Family is selected first:

          - core 2v2: **62.5%**
          - fragmentation: **12.5%**
          - structural 3v3: **25%**

          Cell is then sampled uniformly within the selected family, which gives every one of
          the 24 frozen cells probability **1/24**. Challenge ID is sampled uniformly within
          the selected cell. Display side is randomized 50/50. FV remains hidden.

          Sampling may not adapt to interim vote outcomes.

          ## Voter protection

          - Daily valid NextGen cap: **20**
          - Primary-evidence effective lifetime cap: **20**
          - Voter identity and timestamp are retained for clustered inference.

          The 20-vote effective cap matches the actual historical per-phase participation used
          in the simulation and is stricter than the prior 30-vote effective lifetime ceiling.

          ## Primary evidence-maturity gate

          The first maturity checkpoint is **800 valid effective votes**.

          At that checkpoint all of the following must be true:

          1. at least **800** valid effective votes;
          2. at least **40 distinct voters**;
          3. every one of the 24 cells has at least **15 valid effective votes**;
          4. every one of the 24 cells has at least **10 distinct voters**.

          Under the preregistered equal-cell schedule, the 20,000-draw planning simulation at
          40 voters / 800 votes produced:

          - P(all 24 cells have at least 15 votes): **0.9978**
          - conservative lower bound P(all 24 cells have at least 10 distinct voters): **0.9998096**
          - 10th-percentile minimum votes in any cell: **19**
          - median minimum votes in any cell: **23**

          ## Stopping rule

          Stopping is based only on preregistered coverage, never on whether the observed effect
          is favorable, statistically significant, or agrees with production V1.6.

          If the coverage gate is not satisfied at 800 valid effective votes, continue under the
          same frozen sampling schedule in fixed **100-vote** increments.

          The hard collection cap is **1200 valid effective votes**.

          If any required coverage gate is still unsatisfied at 1200, stop collection and mark the
          affected cell and family **coverage-unresolved**. Gates may not be relaxed.

          ## Primary uncertainty statistic

          Primary uncertainty is a **90% percentile interval from a nonparametric voter-cluster
          bootstrap**. Voter is the resampling unit and all ballots from a resampled voter move
          together. Primary model comparison remains **held-out log loss**.

          Maturity does not require the interval to exclude zero. Ambiguous model evidence is a
          scientifically valid unresolved result and does not trigger outcome-contingent sampling.

          ## Holdout protection

          - Training split: fit eligible.
          - Structural scale holdout: never used for fitting or tuning.
          - Structural topology holdout: never used for fitting or tuning.
          - Neither structural holdout may select knots, regularization, or hyperparameters.
          - After a candidate is frozen, a later prospective-time window is required and is not
            used for model selection.

          ## Unresolved evidence

          At the 1200-vote hard cap, a cell is coverage-unresolved if it has fewer than 15 valid
          effective votes or fewer than 10 distinct voters. A family is coverage-unresolved if any
          required cell in that family is coverage-unresolved.

          Outcome ambiguity is different from coverage failure: tied or uncertain model evidence
          is reported as inferentially unresolved rather than extending collection because the
          result is inconvenient.

          ## Remaining requirement before voting activation

          This maturity plan does **not** activate voting.

          Before activation, a separate frozen model-fit preregistration must define the exact M2a
          fit, M2b spline parameterization, knot rule, regularization, optimizer, choice likelihood,
          bootstrap implementation and draw count, model-selection rule, and solver tolerance.
          """

          plan_md.write_text(
              textwrap.dedent(md).strip() + "\n",
              encoding="utf-8",
          )

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "schema_version": 1,
              "status": "committed_evidence_maturity_plan",
              "voting_activated": False,
              "production_change_authorized": False,
              "plan_json": {
                  "path": plan_json.as_posix(),
                  "sha256": sha256(plan_json),
              },
              "plan_markdown": {
                  "path": plan_md.as_posix(),
                  "sha256": sha256(plan_md),
              },
              "source_maturity_planning_audit": source,
              "frozen_catalog_anchor": {
                  "canonical_challenge_payload_sha256": (
                      "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab"
                  ),
                  "catalog_sha256": (
                      "953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5"
                  ),
              },
              "next_required_step": (
                  "freeze_exact_model_fit_preregistration_before_voting_activation"
              ),
          }
          plan_manifest.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: evidence maturity plan created.")
          print("Plan JSON SHA-256:", sha256(plan_json))
          print("Plan Markdown SHA-256:", sha256(plan_md))
          print("Plan manifest SHA-256:", sha256(plan_manifest))
          PY

      - name: Validate committed plan semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          p = json.loads((d / "evidence_maturity_plan.json").read_text())
          m = json.loads((d / "evidence_maturity_plan_manifest.json").read_text())

          assert p["status"] == "preregistered_before_nextgen_voting"
          assert p["voting_activated"] is False
          assert p["production_change_authorized"] is False
          assert p["automatic_gate_relaxation_allowed"] is False

          assert p["sampling"]["schedule_id"] == "equal_cell_via_family_weights_v1"
          assert p["sampling"]["family_probabilities"] == {
              "core_concentration_2v2": 0.625,
              "fragmentation_filler": 0.125,
              "structural_topology_3v3": 0.25,
          }
          assert abs(p["sampling"]["cell_probability"] - 1/24) < 1e-15
          assert p["sampling"]["adaptive_sampling_from_vote_outcomes_allowed"] is False

          vp = p["voter_protections"]
          assert vp["daily_valid_nextgen_vote_cap"] == 20
          assert vp["primary_evidence_effective_lifetime_cap"] == 20

          g = p["primary_maturity_checkpoint"]
          assert g["minimum_valid_effective_votes"] == 800
          assert g["minimum_distinct_voters"] == 40
          assert g["minimum_valid_effective_votes_per_each_of_24_cells"] == 15
          assert g["minimum_distinct_voters_per_each_of_24_cells"] == 10
          assert g["all_four_conditions_required"] is True
          assert g["simulation_support_at_40_voters_800_votes"][
              "probability_all_cells_at_least_15_votes"
          ] == 0.9978
          assert g["simulation_support_at_40_voters_800_votes"][
              "conservative_lower_bound_probability_all_cells_at_least_10_distinct_voters"
          ] > 0.9998

          stop = p["stopping_rule"]
          assert stop["outcome_direction_may_affect_stopping"] is False
          assert stop["significance_may_affect_stopping"] is False
          assert stop["agreement_with_production_may_affect_stopping"] is False
          assert stop["first_evaluation_checkpoint_valid_votes"] == 800
          assert stop["if_coverage_not_mature_continue_in_fixed_vote_increments"] == 100
          assert stop["hard_collection_cap_valid_effective_votes"] == 1200

          assert p["primary_uncertainty"]["resampling_unit"] == "voter"
          assert p["primary_uncertainty"]["primary_model_comparison_metric"] == "held_out_log_loss"
          assert p["primary_uncertainty"][
              "confidence_interval_excluding_zero_required_for_maturity"
          ] is False

          h = p["holdout_protection"]
          assert h["structural_scale_holdout_fit_eligible"] is False
          assert h["structural_topology_holdout_fit_eligible"] is False
          assert h["holdouts_may_be_used_for_hyperparameter_selection"] is False
          assert h["prospective_time_holdout_required_after_candidate_freeze"] is True

          assert p["remaining_pre_activation_requirement"][
              "model_fit_preregistration_frozen"
          ] is False

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert m["plan_json"]["sha256"] == sha(d / "evidence_maturity_plan.json")
          assert m["plan_markdown"]["sha256"] == sha(d / "evidence_maturity_plan.md")
          assert m["voting_activated"] is False
          assert m["production_change_authorized"] is False
          assert m["next_required_step"] == (
              "freeze_exact_model_fit_preregistration_before_voting_activation"
          )

          print("PASS: maturity-plan gates and fingerprints are internally consistent.")
          PY

      - name: Verify exact change boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/evidence_maturity_plan.json",
              "research/package-adjustment-nextgen-v2/evidence_maturity_plan.md",
              "research/package-adjustment-nextgen-v2/evidence_maturity_plan_manifest.json",
          }

          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          assert paths == expected, (paths, expected)

          print("PASS: exactly three new maturity-plan files await commit.")
          PY

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Revalidate production before commit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Commit evidence maturity plan
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-nextgen-v2/evidence_maturity_plan.json \
            research/package-adjustment-nextgen-v2/evidence_maturity_plan.md \
            research/package-adjustment-nextgen-v2/evidence_maturity_plan_manifest.json

          git commit -m "Preregister NextGen V2 evidence maturity plan"
          echo "PLAN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove frozen evidence remained byte-identical
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"

          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/challenge_catalog_design.md")" = "2ff9ab79043d9bf91f825575fe404c0ccc0ea11e"
          test "$(git hash-object "$D/generate_package_vote_challenges_nextgen_v2.py")" = "8d4746d00b57187a74b8add75ff7b72fc5a9342d"
          test "$(git hash-object "$D/package_adjustment_nextgen_v2_research_spec.md")" = "6dca31266a0e22a750f0a15f6aaf87a6648fb77a"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"

          test -z "$(git status --porcelain=v1)"
          echo "PASS: frozen catalog/spec/generator/design/manifest remained byte-identical."

      - name: Final production guard
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Push maturity-plan preregistration
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          echo "Maturity-plan commit: $PLAN_COMMIT"
          git log --oneline -1
