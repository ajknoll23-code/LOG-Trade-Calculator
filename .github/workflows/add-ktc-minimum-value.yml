name: Add KTC Minimum Value

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-floor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked live Trade Desk
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_INDEX_BLOB="97a448c95f03776b941c45c3cc42ee63ae92a255"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"

          echo "Expected index.html blob: $EXPECTED_INDEX_BLOB"
          echo "Actual index.html blob:   $ACTUAL_INDEX_BLOB"

          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-pre-ktc-min-value-v1
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Add 1250 normal-voting floor
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "KTC_MIN_MODEL_VALUE"
          if marker in text:
              raise SystemExit(
                  f"{marker} already exists; refusing to double-apply."
              )

          constants_old = (
              "const KTC_DAILY_VOTE_LIMIT = 20; // matches "
              "MAX_VOTES_PER_VOTER_PER_DAY in ktc_pipeline.py -- keep these in sync\n"
              "const KTC_RECENT_MEMORY = 40; // how many recently-shown player keys to avoid repeating"
          )

          constants_new = (
              "const KTC_DAILY_VOTE_LIMIT = 20; // matches "
              "MAX_VOTES_PER_VOTER_PER_DAY in ktc_pipeline.py -- keep these in sync\n"
              "const KTC_RECENT_MEMORY = 40; // how many recently-shown player keys to avoid repeating\n"
              "const KTC_MIN_MODEL_VALUE = 1250; // normal voting only; frozen validation queue is intentionally exempt"
          )

          eligibility_old = (
              "    const val = playerValueByKey(key);\n"
              "    if(val && val > 0) pool.push({ key, pos: info.pos, value: val, "
              "team: info.team || null, age: info.age ?? null, pts2025: "
              "info.pts2025 ?? null, proj2026: info.proj2026 ?? null });"
          )

          eligibility_new = (
              "    const val = playerValueByKey(key);\n"
              "    if(val && val >= KTC_MIN_MODEL_VALUE) pool.push({ key, pos: "
              "info.pos, value: val, team: info.team || null, age: "
              "info.age ?? null, pts2025: info.pts2025 ?? null, proj2026: "
              "info.proj2026 ?? null });"
          )

          if text.count(constants_old) != 1:
              raise RuntimeError(
                  "Expected KTC constants block not found exactly once"
              )

          if text.count(eligibility_old) != 1:
              raise RuntimeError(
                  "Expected normal KTC eligibility rule not found exactly once"
              )

          validation_fn = re.search(
              r"function ktcValidationEligible\(key, myPlayers, recent\)\{.*?\n\}",
              text,
              flags=re.S,
          )
          if not validation_fn:
              raise RuntimeError("ktcValidationEligible() not found")
          validation_before = validation_fn.group(0)

          validation_select = re.search(
              r"if\(KTC_VALIDATION_QUEUE_ACTIVE.*?\n\s*\}",
              text,
              flags=re.S,
          )
          if not validation_select:
              raise RuntimeError("Validation queue selection block not found")
          validation_select_before = validation_select.group(0)

          text = text.replace(constants_old, constants_new, 1)
          text = text.replace(eligibility_old, eligibility_new, 1)

          validation_fn_after = re.search(
              r"function ktcValidationEligible\(key, myPlayers, recent\)\{.*?\n\}",
              text,
              flags=re.S,
          )
          validation_select_after = re.search(
              r"if\(KTC_VALIDATION_QUEUE_ACTIVE.*?\n\s*\}",
              text,
              flags=re.S,
          )

          if not validation_fn_after or validation_fn_after.group(0) != validation_before:
              raise RuntimeError(
                  "Frozen validation eligibility changed unexpectedly"
              )

          if (
              not validation_select_after
              or validation_select_after.group(0) != validation_select_before
          ):
              raise RuntimeError(
                  "Frozen validation queue selection changed unexpectedly"
              )

          if text.count("KTC_MIN_MODEL_VALUE") != 2:
              raise RuntimeError(
                  "KTC minimum value should appear exactly twice "
                  "(declaration + normal pool filter)"
              )

          if "val > 0) pool.push" in text:
              raise RuntimeError(
                  "Old positive-value-only normal KTC rule still present"
              )

          path.write_text(text, encoding="utf-8")

          print("PASS normal KTC voting floor = 1250")
          print("PASS frozen validation eligibility unchanged")
          print("PASS frozen validation queue selection unchanged")
          PY

      - name: Validate KTC patch
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          required = [
              "const KTC_MIN_MODEL_VALUE = 1250;",
              "val >= KTC_MIN_MODEL_VALUE",
              "function ktcValidationEligible(key, myPlayers, recent)",
              "KTC_VALIDATION_QUEUE_ACTIVE",
          ]

          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f"KTC patch missing expected tokens: {missing}")

          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              html,
              flags=re.S | re.I,
          )

          ktc_scripts = [
              script for script in scripts
              if "function ktcEligiblePool()" in script
          ]

          if len(ktc_scripts) != 1:
              raise SystemExit(
                  f"Expected one KTC script block, found {len(ktc_scripts)}"
              )

          out = Path("/tmp/ktc-inline.js")
          out.write_text(ktc_scripts[0], encoding="utf-8")
          print(out)
          PY

          node --check /tmp/ktc-inline.js
          git diff --check

      - name: Validate existing runtime self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Commit KTC floor only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "index.html"

          if git diff --cached --quiet; then
            echo "No KTC changes to commit."
            exit 0
          fi

          git diff --cached --check
          git commit -m "Add 1250 minimum value to normal KTC voting"
          git push origin HEAD:main
