            .td-reorg-shell .log-app-nav-item{font-size:9.5px;gap:5px;padding:0 9px;}
            .td-reorg-shell .log-app-nav-icon{font-size:8px;}
            .td-reorg-shell .log-app-brand-sub{max-width:42vw;}
            .td-pane-heading{margin-top:0;}
          }'''
              js = r'''/* TRADE_DESK_NAV_REORG_V1 — DOM organization only; model math untouched. */
          (function () {
            'use strict';

            const TAB_HASH = {
              build: 'build-trade',
              market: 'market-research',
              team: 'team-research'
            };
            const LEGACY_TEAM_HASHES = new Set([
              'needsWrap','fullRosterDetails','findTargetsWrap','leadersWrap','rosterStrengthWrap','rosterStrengthTopSection'
            ]);
            const LEGACY_MARKET_HASHES = new Set(['ktcWrap','packageVoteWrap']);

            function sectionLabel(text) {
              return Array.from(document.querySelectorAll('.section-label')).find(node =>
                (node.textContent || '').trim().toLowerCase() === text.toLowerCase()
              ) || null;
            }

            function appendIf(parent, node) {
              if (parent && node && node.parentNode !== parent) parent.appendChild(node);
            }

            function makePane(tab, eyebrow, title, copy) {
              const pane = document.createElement('section');
              pane.className = 'td-tab-pane';
              pane.dataset.tab = tab;
              pane.id = 'tdPane-' + tab;
              pane.hidden = tab !== 'build';
              pane.innerHTML =
                '<div class="td-pane-heading">' +
                  '<div class="td-pane-eyebrow">' + eyebrow + '</div>' +
                  '<h2>' + title + '</h2>' +
                  '<p>' + copy + '</p>' +
                '</div>';
              return pane;
            }

            function moveLabeledTarget(pane, targetId) {
              const target = document.getElementById(targetId);
              if (!target) return;
              const label = target.previousElementSibling;
              if (label && label.classList.contains('section-label')) appendIf(pane, label);
              appendIf(pane, target);
            }

            function moveVoteSection(pane, targetId) {
              const target = document.getElementById(targetId);
              if (!target) return;
              const help = target.previousElementSibling;
              const label = help && help.previousElementSibling;
              if (label && label.classList.contains('section-label')) appendIf(pane, label);
              if (help && help.classList.contains('vote-help-card')) appendIf(pane, help);
              appendIf(pane, target);
            }

            function moveTradeTargets(pane) {
              const target = document.getElementById('findTargetsWrap');
              if (!target) return;
              const copy = target.previousElementSibling;
              const label = copy && copy.previousElementSibling;
              if (label && label.classList.contains('section-label')) appendIf(pane, label);
              if (copy && copy.tagName === 'P') appendIf(pane, copy);
              appendIf(pane, target);
            }

            function findMethodology(wrap) {
              return Array.from(wrap.querySelectorAll('details')).find(node => {
                const summary = node.querySelector(':scope > summary');
                return summary && /^How values are calculated/i.test((summary.textContent || '').trim());
              }) || null;
            }

            function buildShell(sourceHeader) {
              let shell = document.querySelector('.log-app-shell');
              if (!shell) {
                shell = document.createElement('div');
                document.body.insertBefore(shell, document.body.firstChild);
              }
              shell.className = 'log-app-shell td-reorg-shell';

              const sourceLogo = sourceHeader && sourceHeader.querySelector('.league-logo');
              const logoSrc = sourceLogo ? sourceLogo.getAttribute('src') : '';
              shell.innerHTML =
                '<div class="log-app-topbar">' +
                  '<img class="log-app-logo" alt="League of Ordinary Gentlemen logo">' +
                  '<div class="log-app-brand">' +
                    '<div class="log-app-brand-title">L.O.G. Dynasty Trade Calculator</div>' +
                    '<div class="log-app-brand-sub">League of Ordinary Gentlemen · IDP Dynasty</div>' +
                  '</div>' +
                  '<div class="log-app-context">' +
                    '<div class="log-app-status" id="tdReorgModelStatus">' +
                      '<span class="log-app-status-dot"></span>' +
                      '<span class="log-app-status-text">Syncing</span>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="log-app-nav">' +
                  '<nav class="log-app-nav-inner" aria-label="Primary">' +
                    '<button type="button" class="log-app-nav-item" data-td-tab="build">' +
                      '<span class="log-app-nav-icon">◆</span><span>Build Trade</span>' +
                    '</button>' +
                    '<button type="button" class="log-app-nav-item" data-td-tab="market">' +
                      '<span class="log-app-nav-icon">◈</span><span>Market Research</span>' +
                    '</button>' +
                    '<button type="button" class="log-app-nav-item" data-td-tab="team">' +
                      '<span class="log-app-nav-icon">▦</span><span>Team Research</span>' +
                    '</button>' +
                    '<a class="log-app-nav-item" href="free-agent-board.html">' +
                      '<span class="log-app-nav-icon">＋</span><span>Free Agents</span><span class="td-private-badge">PRIVATE</span>' +
                    '</a>' +
                  '</nav>' +
                '</div>';

              const logo = shell.querySelector('.log-app-logo');
              if (logo && logoSrc) logo.setAttribute('src', logoSrc);
              return shell;
            }

            function mirrorModelStatus() {
              const source = document.getElementById('liveStatus');
              const dest = document.getElementById('tdReorgModelStatus');
              if (!source || !dest) return;

              const sourceDot = source.querySelector('.live-dot');
              const text = dest.querySelector('.log-app-status-text');
              const isLive = !!(sourceDot && sourceDot.classList.contains('ok'));
              const isFail = !!(sourceDot && sourceDot.classList.contains('fail'));

              dest.classList.toggle('is-live', isLive);
              dest.classList.toggle('is-fail', isFail);
              if (text) text.textContent = isLive ? 'LIVE MODEL' : (isFail ? 'MODEL OFFLINE' : 'SYNCING');
            }

            function init() {
              if (document.documentElement.dataset.tradeDeskNavReorg === '1') return;

              const wrap = document.querySelector('.wrap');
              const sourceHeader = wrap && wrap.querySelector(':scope > header');
              const sides = document.getElementById('sidesWrap');
              const meter = document.querySelector('.meter-wrap');
              const ktc = document.getElementById('ktcWrap');
              const packageVote = document.getElementById('packageVoteWrap');
              const needs = document.getElementById('needsWrap');
              const roster = document.getElementById('rosterStrengthWrap');

              if (!wrap || !sourceHeader || !sides || !meter || !ktc || !packageVote || !needs || !roster) {
                console.error('Trade Desk navigation reorg: required page anchors are missing.');
                return;
              }

              document.documentElement.dataset.tradeDeskNavReorg = '1';
              sourceHeader.classList.add('td-reorg-source-header');
              buildShell(sourceHeader);

              const globalContext = document.createElement('div');
              globalContext.className = 'td-reorg-global-context';
              globalContext.id = 'tdReorgGlobalContext';
              const teamPicker = document.getElementById('teamPickerWrap');
              if (teamPicker) globalContext.appendChild(teamPicker);
              sourceHeader.insertAdjacentElement('afterend', globalContext);

              const tabs = document.createElement('main');
              tabs.className = 'td-reorg-tabs';
              tabs.id = 'tdReorgTabs';
              globalContext.insertAdjacentElement('afterend', tabs);

              const buildPane = makePane(
                'build',
                'Trade Calculator',
                'Build Trade',
                'Build both sides, compare live trade value and review the model verdict.'
              );
              const marketPane = makePane(
                'market',
                'League Market',
                'Market Research',
                'Cast Keep / Trade / Cut and package votes that provide independent market evidence.'
              );
              const teamPane = makePane(
                'team',
                'Roster Intelligence',
                'Team Research',
                'See roster strength, identify needs, inspect full rosters and find trade targets.'
              );
              tabs.append(buildPane, marketPane, teamPane);

              /* Build Trade: calculator and its analysis only. */
              const tradeLabel = sectionLabel('Trade Sides');
              const tradeActions = tradeLabel && tradeLabel.nextElementSibling;
              if (tradeLabel) tradeLabel.classList.add('td-reorg-hidden-section-label');

              const guide = document.querySelector('.value-label-guide');
              const kicker = document.querySelector('.ui2-workspace-kicker');
              const workspace = sides.closest('.ui2-trade-workspace') || sides;
              appendIf(buildPane, guide);
              appendIf(buildPane, tradeLabel);
              appendIf(buildPane, tradeActions);
              appendIf(buildPane, kicker);
              appendIf(buildPane, workspace);

              ['sensitivityWrap','packageAdjustmentWrap'].forEach(id => appendIf(buildPane, document.getElementById(id)));
              appendIf(buildPane, document.querySelector('.package-rules'));

              const impact = document.getElementById('tradeImpactWrap');
              const impactShell = impact && (impact.closest('.ui21-team-impact') || impact);
              appendIf(buildPane, impactShell);

              const advanced = document.querySelector('.ui21-advanced');
              if (advanced) {
                appendIf(buildPane, advanced);
              } else {
                appendIf(buildPane, document.getElementById('maulingWrap'));
                appendIf(buildPane, findMethodology(wrap));
              }

              /* Market Research: voting only. */
              moveVoteSection(marketPane, 'ktcWrap');
              moveVoteSection(marketPane, 'packageVoteWrap');

              /* Team Research: roster intelligence and trade discovery. */
              const strengthSection = document.getElementById('rosterStrengthTopSection');
              if (strengthSection) {
                strengthSection.classList.add('td-team-research-strength');
                appendIf(teamPane, strengthSection);
              } else {
                moveLabeledTarget(teamPane, 'rosterStrengthWrap');
              }
              moveLabeledTarget(teamPane, 'needsWrap');
              appendIf(teamPane, document.getElementById('fullRosterDetails'));
              moveTradeTargets(teamPane);
              moveLabeledTarget(teamPane, 'leadersWrap');

              function syncGlobalContext() {
                const picker = document.getElementById('teamPickerWrap');
                const visible = !!(picker && getComputedStyle(picker).display !== 'none');
                globalContext.classList.toggle('is-visible', visible);
              }

              function tabFromHash() {
                const raw = (location.hash || '').replace(/^#/, '');
                if (raw === TAB_HASH.build) return 'build';
                if (raw === TAB_HASH.market) return 'market';
                if (raw === TAB_HASH.team) return 'team';
                if (LEGACY_TEAM_HASHES.has(raw)) return 'team';
                if (LEGACY_MARKET_HASHES.has(raw)) return 'market';
                return 'build';
              }

              function activate(tab, updateHash) {
                const resolved = ['build','market','team'].includes(tab) ? tab : 'build';
                document.documentElement.dataset.tradeDeskTab = resolved;

                tabs.querySelectorAll('.td-tab-pane').forEach(pane => {
                  const active = pane.dataset.tab === resolved;
                  pane.hidden = !active;
                  pane.setAttribute('aria-hidden', active ? 'false' : 'true');
                });

                document.querySelectorAll('[data-td-tab]').forEach(button => {
                  const active = button.dataset.tdTab === resolved;
                  button.classList.toggle('is-active', active);
                  button.setAttribute('aria-current', active ? 'page' : 'false');
                });

                if (updateHash) {
                  const next = '#' + TAB_HASH[resolved];
                  if (location.hash !== next) history.pushState(null, '', next);
                }

                requestAnimationFrame(() => window.scrollTo({ top:0, behavior:'auto' }));
              }

              document.querySelectorAll('[data-td-tab]').forEach(button => {
                button.addEventListener('click', () => activate(button.dataset.tdTab, true));
              });

              window.addEventListener('popstate', () => activate(tabFromHash(), false));
              window.addEventListener('hashchange', () => activate(tabFromHash(), false));

              mirrorModelStatus();
              syncGlobalContext();

              const liveStatus = document.getElementById('liveStatus');
              if (liveStatus && typeof MutationObserver !== 'undefined') {
                new MutationObserver(mirrorModelStatus).observe(liveStatus, {
                  childList:true, subtree:true, attributes:true, characterData:true
                });
              }
              if (teamPicker && typeof MutationObserver !== 'undefined') {
                new MutationObserver(syncGlobalContext).observe(teamPicker, {
                  attributes:true, attributeFilter:['style','class']
                });
              }

              activate(tabFromHash(), false);
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init, { once:true });
            } else {
              init();
            }
          })();'''

              if text.count("</head>") != 1 or text.count("</body>") != 1:
                  raise RuntimeError("Expected exactly one </head> and </body> anchor")

              text = text.replace(
                  "</head>",
                  f'<style id="trade-desk-nav-reorg-styles">\n{css}\n</style>\n</head>',
                  1,
              )
              text = text.replace(
                  "</body>",
                  f'<script id="trade-desk-nav-reorg-runtime">\n{js}\n</script>\n</body>',
                  1,
              )
              INDEX.write_text(text, encoding="utf-8")
              print("Installed Trade Desk navigation reorganization.")

          final = INDEX.read_text(encoding="utf-8")
          for token in [
              MARKER,
              CSS_MARKER,
              "Build Trade",
              "Market Research",
              "Team Research",
              "free-agent-board.html",
              "PRIVATE",
              "tdPane-build",
              "tdPane-market",
              "tdPane-team",
              "moveVoteSection(marketPane, 'ktcWrap')",
              "moveVoteSection(marketPane, 'packageVoteWrap')",
              "moveLabeledTarget(teamPane, 'needsWrap')",
              "moveTradeTargets(teamPane)",
              "moveLabeledTarget(teamPane, 'leadersWrap')",
          ]:
              if token not in final:
                  raise RuntimeError(f"Post-patch navigation marker missing: {token}")

          print("Trade Desk navigation static validation PASS.")

          PY

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for match in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, flags=re.S | re.I):
              attrs, body = match.group(1), match.group(2)
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              if body.strip():
                  scripts.append(body)

          if not scripts:
              raise RuntimeError('No inline scripts found')

          with tempfile.TemporaryDirectory(prefix='td-nav-js-') as td:
              for idx, script in enumerate(scripts):
                  path = Path(td) / f'inline-{idx}.js'
                  path.write_text(script, encoding='utf-8')
                  proc = subprocess.run(['node', '--check', str(path)], capture_output=True, text=True)
                  if proc.returncode != 0:
                      raise RuntimeError(f'Inline script {idx} failed syntax check:\n{proc.stderr or proc.stdout}')
          print(f'JavaScript syntax PASS ({len(scripts)} inline scripts).')
          PY

      - name: Revalidate Package Adjustment and repository
        run: |
          python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Guard changed-file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {'index.html'}
          out = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          )
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise RuntimeError(f'Navigation reorg changed unexpected files: {unexpected}')
          print('Changed-file scope PASS:', sorted(changed))
          PY

          git diff --quiet -- .github/workflows || {
            echo "::error::A workflow file changed during the run."
            exit 1
          }

      - name: Ensure remote main did not move during validation
        shell: bash
        run: |
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::origin/main moved during validation. Refusing to commit an unvalidated rebase."
            echo "Validated base: $local_sha"
            echo "Current origin/main: $remote_sha"
            exit 1
          fi

      - name: Commit UI-only navigation reorganization
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Navigation reorganization already installed; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html

          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "index.html" ]; then
            echo "::error::Unexpected staged files: $staged"
            exit 1
          fi

          git commit -m "Reorganize Trade Desk into research tabs"
          git push origin HEAD:main
