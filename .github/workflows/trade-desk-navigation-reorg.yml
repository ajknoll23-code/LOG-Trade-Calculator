            font-size:6.5px;
            letter-spacing:.07em;
            line-height:1;
          }
          .td-reorg-source-header{display:none!important;}
          .ui2-preview-notice{display:none!important;}
          .td-reorg-global-context{
            display:none;
            margin:0 0 14px;
            padding:12px;
            border:1px solid var(--line);
            border-radius:10px;
            background:rgba(22,50,79,.78);
          }
          .td-reorg-global-context.is-visible{display:block;}
          .td-reorg-global-context #teamPickerWrap{margin-top:0!important;}
          .td-reorg-tabs{width:100%;}
          .td-tab-pane[hidden]{display:none!important;}
          .td-tab-pane{
            animation:tdTabIn .14s ease-out;
          }
          @keyframes tdTabIn{
            from{opacity:.45;transform:translateY(3px)}
            to{opacity:1;transform:none}
          }
          .td-pane-heading{
            margin:4px 0 16px;
            padding:0 0 14px;
            border-bottom:1px solid var(--line);
          }
          .td-pane-eyebrow{
            margin-bottom:5px;
            color:var(--gold);
            font-family:'IBM Plex Mono',monospace;
