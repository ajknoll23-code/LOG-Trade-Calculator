name: Trade Desk Navigation Reorg

# One-time UI-only organizer. Commits index.html only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  reorganize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install requests

      - name: Verify current Package Adjustment UI baseline
        run: |
          python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check
          python3 scripts/validation/check_package_adjustment_live.py

      - name: Apply Trade Desk tab reorganization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          INDEX = Path("index.html")
          EXPECTED_GIT_BLOB = "c58f0c6468adf8c52d38e528b1076772c92c2e88"
          MARKER = "TRADE_DESK_NAV_REORG_V1"
          CSS_MARKER = "TRADE_DESK_NAV_REORG_V1_CSS"


          def git_blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()


          data = INDEX.read_bytes()
          text = data.decode("utf-8")

          required = [
              "PACKAGE_ADJUSTMENT_V1_6_UI_REDESIGN",
              "PACKAGE_ADJUSTMENT_V1_6_ADJUSTED_SIDE_TOTAL_UI",
              'id="sidesWrap"',
              'id="ktcWrap"',
              'id="packageVoteWrap"',
              'id="needsWrap"',
              'id="fullRosterDetails"',
              'id="findTargetsWrap"',
              'id="leadersWrap"',
              'id="rosterStrengthWrap"',
              'id="teamPickerWrap"',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(f"Required Trade Desk anchors missing: {missing}")

          if MARKER in text and CSS_MARKER in text:
              print("Trade Desk navigation reorg already installed; no patch needed.")
          else:
              actual = git_blob_sha(data)
              if actual != EXPECTED_GIT_BLOB:
                  raise RuntimeError(
                      f"index.html source drifted: expected git blob {EXPECTED_GIT_BLOB}, got {actual}"
                  )

              css = r'''/* TRADE_DESK_NAV_REORG_V1_CSS — presentation/navigation only. */
          .log-app-shell.td-reorg-shell{
