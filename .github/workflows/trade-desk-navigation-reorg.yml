            font-weight:600;
            letter-spacing:.12em;
            text-transform:uppercase;
          }
          .td-pane-heading h2{
            margin:0 0 6px;
            color:var(--text);
            font-family:'Anton',sans-serif;
            font-size:29px;
            line-height:1;
            text-transform:uppercase;
            letter-spacing:.01em;
          }
          .td-pane-heading p{
            margin:0;
            max-width:62ch;
            color:var(--text-muted);
            font-size:12.5px;
            line-height:1.5;
          }
          .td-tab-pane .ui2-workspace-kicker{display:none!important;}
          .td-reorg-hidden-section-label{display:none!important;}
          #rosterStrengthTopSection.td-team-research-strength{
            margin:0 0 18px!important;
            padding:0!important;
            border:0!important;
          }
          #rosterStrengthTopSection.td-team-research-strength > .section-label{
            margin-top:0!important;
          }
          .td-tab-pane .section-label:first-of-type{margin-top:10px;}
          html[data-trade-desk-tab='market'] .ui2-mobile-summary,
          html[data-trade-desk-tab='team'] .ui2-mobile-summary{display:none!important;}
          @media (max-width:760px){
            .td-reorg-shell .log-app-topbar,
            .td-reorg-shell .log-app-nav-inner{
              width:min(100% - 22px, 1180px);
            }
            .td-reorg-shell .log-app-topbar{
              min-height:58px;
              gap:10px;
              padding:7px 0;
            }
            .td-reorg-shell .log-app-logo{width:38px;height:38px;}
            .td-reorg-shell .log-app-brand-title{font-size:14px;}
            .td-reorg-shell .log-app-brand-sub{max-width:46vw;font-size:8px;}
            .td-reorg-shell .log-app-status{min-height:25px;padding:0 8px;font-size:7.5px;}
            .td-reorg-shell .log-app-nav-inner{min-height:42px;}
            .td-reorg-shell .log-app-nav-item{padding:0 11px;font-size:10.5px;}
