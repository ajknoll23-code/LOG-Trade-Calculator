name: Fix Player Value Card Layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked live Trade Desk
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_INDEX_BLOB="16010ba78f08b4fe8b77fa8ba86b408fd5138e99"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"

          echo "Expected index.html blob: $EXPECTED_INDEX_BLOB"
          echo "Actual index.html blob:   $ACTUAL_INDEX_BLOB"

          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-pre-player-value-layout-v1
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Fix player value card layout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "PLAYER_VALUE_CARD_LAYOUT_V1"

          if marker in text:
              raise SystemExit(
                  f"{marker} already present; refusing to double-apply."
              )

          required = [
              "PLAYER_VALUE_LABEL_CLARITY_V1",
              'class="asset-value-stack"',
              'class="asset-range',
              'class="asset-market"',
              'class="ui2-workspace-title"',
              "guide.className = 'value-label-guide'",
          ]

          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Expected live value-card hooks missing: "
                  + ", ".join(missing)
              )

          original_scripts = re.findall(
              r"<script(?:\s[^>]*)?>.*?</script>",
              text,
              flags=re.S | re.I,
          )

          css = r'''
          <style id="player-value-card-layout-styles">
          /* PLAYER_VALUE_CARD_LAYOUT_V1
             Presentation only. No value, range, market, trade-total,
             verdict or Team Utility calculations change. */

          .asset-row{
            grid-template-columns:38px minmax(0,1fr) auto!important;
            grid-template-rows:auto auto!important;
            align-items:center!important;
          }

          .asset-row .asset-info{
            grid-column:2!important;
            grid-row:1!important;
            min-width:0!important;
          }

          .asset-row .asset-right{
            grid-column:3!important;
            grid-row:1!important;
            align-self:center!important;
            min-width:0!important;
          }

          .asset-row .asset-value-stack{
            min-width:0!important;
            align-items:flex-end!important;
          }

          .asset-row .asset-title{
            max-width:none!important;
            min-width:0!important;
            white-space:nowrap!important;
            overflow:hidden!important;
            text-overflow:ellipsis!important;
          }

          .asset-row .asset-meta{
            min-width:0!important;
            line-height:1.35!important;
          }

          .player-value-details{
            grid-column:2 / -1!important;
            grid-row:2!important;
            display:flex!important;
            flex-wrap:wrap!important;
            align-items:center!important;
            gap:4px 6px!important;
            min-width:0!important;
            margin-top:2px!important;
          }

          .player-value-details .asset-range,
          .player-value-details .asset-market{
            display:inline-block!important;
            max-width:100%!important;
            width:auto!important;
            white-space:normal!important;
            line-height:1.25!important;
            margin:0!important;
          }

          .value-label-guide{
            margin:8px 0 12px!important;
            scroll-margin-top:150px;
          }

          @media(max-width:720px){
            .asset-row{
              grid-template-columns:36px minmax(0,1fr) auto!important;
              gap:8px!important;
            }

            .asset-row .asset-title{
              font-size:13px!important;
            }

            .asset-row .asset-value{
              font-size:13.5px!important;
            }

            .player-value-details{
              grid-column:2 / -1!important;
              gap:3px 5px!important;
            }

            .player-value-details .asset-range,
            .player-value-details .asset-market{
              font-size:8px!important;
            }

            .value-label-guide{
              margin:7px 0 10px!important;
            }
          }
          </style>
          '''

          js = r'''
          <script id="player-value-card-layout-runtime">
          /* PLAYER_VALUE_CARD_LAYOUT_V1 — presentation only. */
          (function () {
            'use strict';

            function placeGuide() {
              const guide = document.querySelector('.value-label-guide');
              const kicker = document.querySelector('.ui2-workspace-kicker');

              if (!guide || !kicker) return;

              if (kicker.nextElementSibling !== guide) {
                kicker.insertAdjacentElement('afterend', guide);
              }

              const summary = guide.querySelector('summary');
              if (summary) {
                summary.textContent = 'ⓘ Value Guide';
              }
            }

            function layoutRow(row) {
              if (!row || row.dataset.valueCardLayout === '1') return;

              const stack = row.querySelector('.asset-value-stack');
              if (!stack) return;

              const range = stack.querySelector('.asset-range');
              const market = stack.querySelector('.asset-market');

              if (!range && !market) {
                row.dataset.valueCardLayout = '1';
                return;
              }

              let details = row.querySelector('.player-value-details');

              if (!details) {
                details = document.createElement('div');
                details.className = 'player-value-details';
                row.appendChild(details);
              }

              if (range && range.parentNode !== details) {
                details.appendChild(range);
              }

              if (market && market.parentNode !== details) {
                details.appendChild(market);
              }

              row.dataset.valueCardLayout = '1';
            }

            function refresh() {
              placeGuide();

              document
                .querySelectorAll('#sidesWrap .asset-row')
                .forEach(layoutRow);
            }

            let scheduled = false;

            function scheduleRefresh() {
              if (scheduled) return;

              scheduled = true;

              requestAnimationFrame(() => {
                scheduled = false;
                refresh();
              });
            }

            function init() {
              refresh();

              const sides = document.getElementById('sidesWrap');

              if (
                sides &&
                typeof MutationObserver !== 'undefined'
              ) {
                new MutationObserver(scheduleRefresh).observe(sides, {
                  childList:true,
                  subtree:true
                });
              }
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded',
                init,
                { once:true }
              );
            } else {
              init();
            }
          })();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text or "</body>" not in text:
              raise RuntimeError("index.html missing closing head/body tags")

          text = text.replace("</head>", css + "\n</head>", 1)
          text = text.replace("</body>", js + "\n</body>", 1)

          missing_scripts = [
              i for i, block in enumerate(original_scripts)
              if block not in text
          ]

          if missing_scripts:
              raise RuntimeError(
                  "Existing production script blocks changed: "
                  + str(missing_scripts)
              )

          if text.count(marker) != 2:
              raise RuntimeError(
                  f"Unexpected {marker} count: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")

          print(
              f"PASS preserved {len(original_scripts)} existing production "
              "script blocks byte-for-byte"
          )
          print("PASS player detail lines moved out of value column")
          print("PASS Value Guide moved below Build Trade title")
          PY

      - name: Validate layout JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          js = re.search(
              r'<script id="player-value-card-layout-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )

          css = re.search(
              r'<style id="player-value-card-layout-styles">(.*?)</style>',
              html,
              flags=re.S,
          )

          if not js or not css:
              raise SystemExit("Player-value layout blocks missing")

          required_js = [
              "player-value-details",
              "asset-range",
              "asset-market",
              "ui2-workspace-kicker",
              "ⓘ Value Guide",
          ]

          required_css = [
              "grid-template-columns:38px minmax(0,1fr) auto",
              "grid-column:2 / -1",
              ".player-value-details",
          ]

          missing_js = [
              token for token in required_js
              if token not in js.group(1)
          ]

          missing_css = [
              token for token in required_css
              if token not in css.group(1)
          ]

          if missing_js:
              raise SystemExit(f"Layout JS missing: {missing_js}")

          if missing_css:
              raise SystemExit(f"Layout CSS missing: {missing_css}")

          for label, block in [
              ("CSS", css.group(1)),
              ("JS", js.group(1)),
          ]:
              bad = [
                  i for i, line in enumerate(block.splitlines(), 1)
                  if line != line.rstrip()
              ]

              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at lines {bad[:10]}"
                  )

              print(f"PASS {label} whitespace")

          out = Path("/tmp/player-value-card-layout.js")
          out.write_text(js.group(1), encoding="utf-8")
          print(out)
          PY

          node --check /tmp/player-value-card-layout.js

      - name: Validate existing runtime self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Commit layout fix only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "index.html"

          if git diff --cached --quiet; then
            echo "No layout changes to commit."
            exit 0
          fi

          git commit -m "Fix player value card layout"
          git push origin HEAD:main
