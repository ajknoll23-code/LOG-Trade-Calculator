name: Package Adjustment NextGen V2 M3 Development Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard spent evidence and unused M3 preregistration surface
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          CFG="$D/m3_development_preregistration_v1.json"
          MD="$D/m3_development_preregistration_v1.md"
          MAN="$D/m3_development_preregistration_v1_manifest.json"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/prospective_exact_900_frozen_v1.json")" = \
            "e0a6e80d98c19b9fa672b863844e4541817dbc88"
          test "$(git hash-object "$D/prospective_m2b_vs_m0_evaluation_v1.json")" = \
            "dc41bc6080bc2a36f122b2a3f9e555a328a778c7"
          test "$(git hash-object "$D/prospective_m2b_vs_m0_evaluation_manifest_v1.json")" = \
            "19eba3fb5cdca83c9f118f9fd12b5ffd2f54beff"
          test "$(git hash-object "$D/prospective_m2b_failure_diagnostic_v1.json")" = \
            "8197ce1eefb127dd17b9029084a701e47e6306a5"
          test "$(git hash-object "$D/prospective_m2b_failure_diagnostic_v1.md")" = \
            "5e294febfc7ebb2cfa8fde00322c6b592a95433f"
          test "$(git hash-object "$D/research_candidate_m2b_v1.json")" = \
            "1560124540e1104fdc4f4e9f367d984b46921cb9"

          test ! -e "$CFG"
          test ! -e "$MD"
          test ! -e "$MAN"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          ev = json.loads((d / "prospective_m2b_vs_m0_evaluation_v1.json").read_text())
          diag = json.loads((d / "prospective_m2b_failure_diagnostic_v1.json").read_text())

          assert ev["status"] == "prospective_validation_failed_research_only"
          assert ev["production_candidate_eligible"] is False
          assert ev["production_revision_unchanged"] == "v1.6-v5-size2-composition-overlay"
          assert diag["status"] == "completed_posthoc_failure_diagnostic_research_only"
          assert diag["candidate_created_or_tuned"] is False
          assert diag["model_refit_or_parameter_tuning_performed"] is False
          assert diag["spent_evidence_only"] is True

          families = diag["diagnostics"]["by_family"]
          assert families["core_concentration_2v2"]["equal_cell_macro_improvement_M0_minus_M2b"] > 0
          assert families["fragmentation_filler"]["equal_cell_macro_improvement_M0_minus_M2b"] < -0.005
          assert families["structural_topology_3v3"]["equal_cell_macro_improvement_M0_minus_M2b"] > 0

          print("PASS: M2b failed prospectively and the exact 900-vote evidence is now spent development evidence.")
          PY

      - name: Verify production remains V1.6 before preregistration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze M3 development plan before fitting
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          D = Path("research/package-adjustment-nextgen-v2")
          CFG = D / "m3_development_preregistration_v1.json"
          MD = D / "m3_development_preregistration_v1.md"
          MAN = D / "m3_development_preregistration_v1_manifest.json"

          DATA = D / "prospective_exact_900_frozen_v1.json"
          CATALOG = D / "package_vote_challenges_prospective_v1.json"
          CANDIDATE = D / "research_candidate_m2b_v1.json"
          EVAL = D / "prospective_m2b_vs_m0_evaluation_v1.json"
          EVAL_MAN = D / "prospective_m2b_vs_m0_evaluation_manifest_v1.json"
          DIAG = D / "prospective_m2b_failure_diagnostic_v1.json"
          DIAG_MD = D / "prospective_m2b_failure_diagnostic_v1.md"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          generated = datetime.now(timezone.utc).isoformat()

          cfg = {
              "schema_version": 1,
              "plan_id": "pkgnv2-m3-development-prereg-v1",
              "status": "frozen_m3_development_preregistration",
              "frozen": True,
              "generated_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "automatic_production_promotion_allowed": False,
              "production_revision_must_remain": "v1.6-v5-size2-composition-overlay",
              "purpose": (
                  "Freeze the M3 development candidate classes, fitting procedure, "
                  "cross-validation, model-selection rules, and governance before "
                  "using the spent 900-vote prospective evidence for any M3 fitting."
              ),
              "evidence_classification": {
                  "prospective_exact_900_is_spent_development_evidence": True,
                  "may_inform_m3_design_and_fitting": True,
                  "may_not_count_as_fresh_m3_confirmation": True,
                  "m2b_one_time_prospective_evaluation_consumed": True,
                  "future_m3_production_eligibility_requires_fresh_prospective_holdout": True,
                  "raw_ballots": 960,
                  "effective_votes": 900.0,
                  "voter_clusters": 30,
                  "challenge_count": 129,
                  "cell_count": 24,
              },
              "diagnostic_basis": {
                  "combined_improvement_m0_minus_m2b": 0.0019264215202068335,
                  "required_combined_improvement_that_failed": 0.005,
                  "bootstrap_favorable_fraction_m2b_vs_m0": 0.9612,
                  "family_equal_cell_macro_improvement_m0_minus_m2b": {
                      "core_concentration_2v2": 0.00792933601352186,
                      "fragmentation_filler": -0.02683649519035325,
                      "structural_topology_3v3": 0.0013005936421998099,
                  },
                  "design_conclusion": (
                      "M3 must permit data-supported package adjustment where signal exists "
                      "while shrinking toward raw-FV M0 in unsupported or harmful contexts."
                  ),
              },
              "production_computable_features_only": {
                  "research_family_label_allowed_in_scoring": False,
                  "research_scale_label_allowed_in_scoring": False,
                  "challenge_id_allowed_in_scoring": False,
                  "human_vote_outcome_allowed_in_scoring": False,
                  "allowed_trade_features": [
                      "side_asset_raw_fv_values",
                      "raw_side_totals",
                      "mean_raw_side_total",
                      "asset_count_each_side",
                      "absolute_asset_count_difference",
                      "maximum_asset_count",
                      "top_asset_share_each_side",
                      "maximum_top_asset_share",
                      "absolute_top_share_difference",
                  ],
              },
              "shared_score_components": {
                  "M0_side_score": "sum(asset_fv)",
                  "M2b_side_score": (
                      "frozen normalized convex monotone piecewise-linear spline "
                      "equivalent-value score from pkgnv2-m2b-v1"
                  ),
                  "M3_trade_gate_alpha": "bounded in [0,1] and identical for both sides of one trade",
                  "M3_side_score": (
                      "M0_side_score + alpha(trade_features) * "
                      "(M2b_side_score - M0_side_score)"
                  ),
                  "v_ref": 5401.0,
              },
              "candidate_classes": {
                  "M3a": {
                      "name": "scale_gated_m0_m2b_shrinkage",
                      "gate_linear_predictor": (
                          "a0 + softplus(a_scale_raw) * log(mean_raw_side_total / 5401)"
                      ),
                      "alpha": "sigmoid(gate_linear_predictor)",
                      "free_gate_parameters": ["a0", "a_scale_raw"],
                      "complexity_rank": 1,
                  },
                  "M3b": {
                      "name": "scale_topology_gated_m0_m2b_shrinkage",
                      "gate_linear_predictor": (
                          "a0 + softplus(a_scale_raw) * log(mean_raw_side_total / 5401) "
                          "- softplus(a_unequal_raw) * I(asset_count_A != asset_count_B) "
                          "- softplus(a_extra_raw) * max(0, max(asset_count_A, asset_count_B) - 2)"
                      ),
                      "alpha": "sigmoid(gate_linear_predictor)",
                      "free_gate_parameters": [
                          "a0",
                          "a_scale_raw",
                          "a_unequal_raw",
                          "a_extra_raw",
                      ],
                      "complexity_rank": 2,
                  },
                  "M3c": {
                      "name": "scale_topology_concentration_gated_m0_m2b_shrinkage",
                      "gate_linear_predictor": (
                          "M3b gate + softplus(a_concentration_raw) * "
                          "(maximum_top_asset_share - 0.5)"
                      ),
                      "alpha": "sigmoid(gate_linear_predictor)",
                      "free_gate_parameters": [
                          "a0",
                          "a_scale_raw",
                          "a_unequal_raw",
                          "a_extra_raw",
                          "a_concentration_raw",
                      ],
                      "complexity_rank": 3,
                  },
              },
              "prediction_model": {
                  "choice_probability": (
                      "logistic(beta * (ScoreA - ScoreB) / 5401 "
                      "+ delta_left * I(canonical_A_displayed_left))"
                  ),
                  "beta_parameterization": "beta = exp(log_beta)",
                  "beta_and_delta_refit_for_each_training_fold": True,
                  "M0_development_baseline_refits_beta_and_delta_on_same_training_fold": True,
                  "M2b_reference_refits_beta_and_delta_on_same_training_fold": True,
              },
              "optimizer": {
                  "method": "scipy_L-BFGS-B",
                  "objective": "equal_cell_macro_mean_weighted_log_loss_on_training_challenges",
                  "bounds": {
                      "a0": [-8.0, 8.0],
                      "raw_gate_coefficients": [-8.0, 8.0],
                      "log_beta": [-8.0, 8.0],
                      "delta_left": [-2.0, 2.0],
                  },
                  "multistart_count_per_model_per_fit": 7,
                  "deterministic_multistart_seed": 20260915,
                  "boundary_tolerance": 1e-6,
              },
              "cross_validation": {
                  "method": "deterministic_stratified_grouped_challenge_4_fold",
                  "fold_count": 4,
                  "grouping_unit": "challenge_id",
                  "all_ballots_for_one_challenge_stay_in_same_fold": True,
                  "stratification_unit": "research_cell",
                  "assignment": (
                      "Within each frozen cell, order challenge IDs by "
                      "sha256('pkgnv2-m3-cv-v1|' + challenge_id), then assign round-robin "
                      "to folds 0..3."
                  ),
                  "voter_weights": (
                      "Use already-frozen original ballot weights; do not reapply caps inside folds."
                  ),
                  "validation_metric": "equal_cell_macro_mean_weighted_log_loss",
                  "required_validation_coverage": (
                      "Every validation fold must contain at least one held-out challenge "
                      "from every one of the 24 cells."
                  ),
              },
              "development_model_selection": {
                  "baseline": "M0_development_baseline",
                  "references": ["M2b_refit_beta_delta", "M3a", "M3b", "M3c"],
                  "combined_cv_improvement_definition": (
                      "M0_development_baseline_cv_loss - candidate_cv_loss"
                  ),
                  "minimum_combined_cv_improvement": 0.003,
                  "maximum_family_cv_regression": 0.003,
                  "minimum_folds_with_positive_combined_improvement": 3,
                  "family_safety_metrics": [
                      "core_concentration_2v2",
                      "fragmentation_filler",
                      "structural_topology_3v3",
                  ],
                  "all_eligibility_conditions_required": True,
                  "selection_rule": (
                      "Among eligible M3 candidates, find the lowest combined CV loss. "
                      "If a simpler eligible candidate is within 0.001 absolute log loss "
                      "of that best candidate, select the simplest; otherwise select the best."
                  ),
                  "if_no_m3_candidate_qualifies": (
                      "Stop development with no M3 candidate."
                  ),
                  "m2b_is_reference_only_and_cannot_be_reselected": True,
              },
              "full_development_refit_after_selection": {
                  "allowed_only_after_cross_validated_model_class_selection": True,
                  "refit_selected_class_on_all_spent_900_effective_votes": True,
                  "same_objective_and_bounds_as_preregistered_fit": True,
                  "frozen_result_status_if_successful": "m3_frozen_research_candidate",
                  "production_candidate": False,
                  "production_change_authorized": False,
                  "parameters_may_not_change_after_candidate_freeze": True,
              },
              "fresh_prospective_requirement": {
                  "required_before_any_production_eligibility": True,
                  "candidate_and_parameters_must_be_frozen_first": True,
                  "fresh_catalog_must_be_generated_after_candidate_freeze": True,
                  "fresh_catalog_may_not_be_selected_using_candidate_predictions_or_future_outcomes": True,
                  "fresh_voting_must_begin_after_catalog_and_evaluation_preregistration_freeze": True,
                  "spent_900_votes_may_not_be_reused_for_confirmation": True,
                  "automatic_production_promotion_allowed": False,
                  "separate_human_approved_production_decision_required_even_after_pass": True,
              },
              "future_prospective_gate_floor": {
                  "minimum_combined_log_loss_improvement_vs_frozen_M0": 0.005,
                  "maximum_absolute_regression_each_preregistered_family": 0.005,
                  "minimum_voter_cluster_bootstrap_favorable_fraction": 0.80,
                  "bootstrap_must_use_fixed_frozen_candidate_predictions": True,
                  "no_refitting_inside_bootstrap": True,
              },
              "required_sequence_after_this_freeze": [
                  "implement_exact_preregistered_M3_fitter",
                  "run_4_fold_grouped_challenge_cross_validation_on_spent_evidence",
                  "select_at_most_one_M3_model_class_under_frozen_rules",
                  "if_eligible_refit_selected_class_on_all_spent_development_evidence",
                  "freeze_M3_research_candidate_parameters",
                  "preregister_fresh_M3_prospective_holdout_before_catalog_generation_or_voting",
                  "generate_and_freeze_fresh_unseen_challenge_catalog",
                  "activate_fresh_voting",
                  "freeze_first_mature_checkpoint_outcome_blind",
                  "evaluate_frozen_M3_vs_frozen_M0_once",
                  "if_pass_then_separate_human_approved_production_decision",
              ],
          }

          CFG.write_text(json.dumps(cfg, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          md_lines = [
              "# NextGen V2 M3 Development Preregistration",
              "",
              "**Status:** `frozen_m3_development_preregistration`",
              "",
              "This freezes the M3 development rules before any M3 fitting. The existing 900-effective-vote prospective dataset is now spent development evidence only. Production remains `v1.6-v5-size2-composition-overlay`.",
              "",
              "## Model idea",
              "",
              "M3 does not apply M2b universally. It learns a bounded trade-level shrinkage gate:",
              "",
              "`M3 side score = M0 side score + alpha(trade) * (M2b side score - M0 side score)`",
              "",
              "`alpha` is identical for both sides of the trade and uses only production-computable trade features.",
              "",
              "### Candidate classes",
              "- **M3a:** scale gate.",
              "- **M3b:** scale + asset-count topology gate.",
              "- **M3c:** scale + topology + concentration gate.",
              "",
              "Research family labels, research scale labels, challenge IDs, and human outcomes are forbidden as scoring inputs.",
              "",
              "## Development validation",
              "",
              "Use deterministic 4-fold grouped challenge cross-validation. All ballots for one challenge stay together, and challenge assignment is stratified within each of the 24 research cells.",
              "",
              "An M3 class is eligible only if:",
              "- combined CV improvement versus refit M0 is at least **0.003**;",
              "- no research family regresses by more than **0.003**;",
              "- at least **3 of 4** folds improve;",
              "- optimization completes without a material boundary solution.",
              "",
              "If multiple candidates qualify, prefer the simpler one if it is within **0.001** log loss of the best eligible candidate.",
              "",
              "## Governance",
              "",
              "If one class qualifies, refit only that selected class on all spent development evidence and freeze its parameters. It remains research-only.",
              "",
              "The 900-vote dataset can never be reused as fresh M3 confirmation. A new candidate freeze, new prospective preregistration, fresh catalog, and fresh votes are required before production eligibility can be reconsidered.",
              "",
              "No automatic production promotion is allowed.",
          ]
          md = "\n".join(md_lines) + "\n"
          MD.write_text(md, encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "status": "frozen_m3_development_preregistration_manifest",
              "frozen": True,
              "generated_at_utc": generated,
              "research_only": True,
              "production_change_authorized": False,
              "model_fit_performed": False,
              "candidate_selected": False,
              "source_artifacts": {
                  "spent_dataset": {
                      "path": str(DATA),
                      "git_blob_sha": "e0a6e80d98c19b9fa672b863844e4541817dbc88",
                      "sha256": sha256(DATA),
                  },
                  "prospective_catalog": {
                      "path": str(CATALOG),
                      "git_blob_sha": "b338b18291c5058c5a2b941e1293322e2e70ea8c",
                      "sha256": sha256(CATALOG),
                  },
                  "failed_m2b_evaluation": {
                      "path": str(EVAL),
                      "git_blob_sha": "dc41bc6080bc2a36f122b2a3f9e555a328a778c7",
                      "sha256": sha256(EVAL),
                  },
                  "failure_diagnostic": {
                      "path": str(DIAG),
                      "git_blob_sha": "8197ce1eefb127dd17b9029084a701e47e6306a5",
                      "sha256": sha256(DIAG),
                  },
                  "failure_diagnostic_markdown": {
                      "path": str(DIAG_MD),
                      "git_blob_sha": "5e294febfc7ebb2cfa8fde00322c6b592a95433f",
                      "sha256": sha256(DIAG_MD),
                  },
                  "frozen_m2b_candidate": {
                      "path": str(CANDIDATE),
                      "git_blob_sha": "1560124540e1104fdc4f4e9f367d984b46921cb9",
                      "sha256": sha256(CANDIDATE),
                  },
              },
              "artifacts_created": {
                  "config": {"path": str(CFG), "sha256": sha256(CFG)},
                  "methodology": {"path": str(MD), "sha256": sha256(MD)},
              },
              "next_action": (
                  "Implement and run the exact preregistered M3 development fitter."
              ),
          }
          MAN.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          print("PASS: M3 development plan frozen before fitting.")
          PY

      - name: Verify frozen M3 preregistration contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          cfg_path = d / "m3_development_preregistration_v1.json"
          md_path = d / "m3_development_preregistration_v1.md"
          man_path = d / "m3_development_preregistration_v1_manifest.json"

          cfg = json.loads(cfg_path.read_text())
          man = json.loads(man_path.read_text())

          assert cfg["status"] == "frozen_m3_development_preregistration"
          assert cfg["frozen"] is True
          assert cfg["research_only"] is True
          assert cfg["production_change_authorized"] is False
          assert set(cfg["candidate_classes"]) == {"M3a", "M3b", "M3c"}
          assert cfg["cross_validation"]["fold_count"] == 4
          assert cfg["cross_validation"]["grouping_unit"] == "challenge_id"
          assert cfg["development_model_selection"]["minimum_combined_cv_improvement"] == 0.003
          assert cfg["development_model_selection"]["maximum_family_cv_regression"] == 0.003
          assert cfg["development_model_selection"]["minimum_folds_with_positive_combined_improvement"] == 3
          assert cfg["fresh_prospective_requirement"]["required_before_any_production_eligibility"] is True
          assert cfg["fresh_prospective_requirement"]["spent_900_votes_may_not_be_reused_for_confirmation"] is True
          assert man["model_fit_performed"] is False
          assert man["candidate_selected"] is False

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert man["artifacts_created"]["config"]["sha256"] == sha256(cfg_path)
          assert man["artifacts_created"]["methodology"]["sha256"] == sha256(md_path)

          expected = {str(cfg_path), str(md_path), str(man_path)}
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          if paths != expected:
              raise RuntimeError(f"unexpected changed paths: {sorted(paths)}")

          print("PASS: exact M3 preregistration contract and three-file boundary verified.")
          PY

          git diff --check

      - name: Run repository regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/repo_regression_checks.py

      - name: Re-prove production and research-only boundary
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json",
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.md",
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1_manifest.json",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          if paths != expected:
              raise RuntimeError(f"regressions changed unexpected paths: {sorted(paths)}")
          print("PASS: production remains V1.6 and only M3 preregistration files changed.")
          PY

      - name: Upload M3 preregistration proof
        uses: actions/upload-artifact@v4
        with:
          name: pkgnv2-m3-development-prereg-v1
          path: |
            research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json
            research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.md
            research/package-adjustment-nextgen-v2/m3_development_preregistration_v1_manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit M3 development preregistration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json \
            research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.md \
            research/package-adjustment-nextgen-v2/m3_development_preregistration_v1_manifest.json

          git commit -m "Freeze NextGen V2 M3 development preregistration"

      - name: Rebase safely and verify committed boundary
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-nextgen-v2/prospective_m2b_failure_diagnostic_v1.json)" = \
            "8197ce1eefb127dd17b9029084a701e47e6306a5"
          test "$(git hash-object research/package-adjustment-nextgen-v2/prospective_m2b_vs_m0_evaluation_v1.json)" = \
            "dc41bc6080bc2a36f122b2a3f9e555a328a778c7"

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json",
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.md",
              "research/package-adjustment-nextgen-v2/m3_development_preregistration_v1_manifest.json",
          }
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only", parent, head], text=True).splitlines()
          )
          if changed != expected:
              raise RuntimeError(f"rebased commit changed unexpected paths: {sorted(changed)}")
          if subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).strip():
              raise RuntimeError("working tree not clean after rebase")
          print("PASS: rebased preregistration commit still contains exactly three intended files.")
          PY

      - name: Push preregistration to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          git log --oneline -1
