name: Fix Team Utility Roster Cap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch Team Utility legal-roster enforcement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          bench_anchor = """const TU_BENCH_WEIGHT = 0.15; // unvalidated guess, flagged as such in the
            // design doc -- the single most likely constant in this whole feature
            // to need real recalibration once it produces outputs someone reacts to,
            // the same way the Hutchinson/Moehrig gut-check caught the position
            // weights. Not derived from anything; a starting point, not an answer.
          """

          bench_replacement = bench_anchor + r"""
          /* Legal active-roster constraint.
             2026 Sleeper settings = 17 starters + 24 bench = 41 active roster
             spots. Taxi and reserve/IR are separate pools and are deliberately
             excluded from active-roster Team Utility.

             This is a roster-specific constraint, NOT a package-value penalty.
             It prevents 1-for-many trades from receiving free extra bench slots. */
          const TU_ACTIVE_ROSTER_LIMIT = 41;

          function tuActiveRosterKeys(){
            const team = LEAGUE_ROSTERS && LEAGUE_ROSTERS[MY_ROSTER_ID];
            if(team && Array.isArray(team.players)){
              const active = team.players
                .filter(p => p.slot === 'starters' || p.slot === 'bench')
                .map(p => p.key);
              if(active.length) return active;
            }

            /* Fallback/live personal sync ordering is starters -> bench -> taxi,
               so the first 41 keys are the active roster when league-wide slot
               metadata is temporarily unavailable. */
            return MY_ROSTER.slice(0, Math.min(TU_ACTIVE_ROSTER_LIMIT, MY_ROSTER.length));
          }
          """
          replace_once(bench_anchor, bench_replacement, "insert legal-roster constants")

          lineup_return = """  return { starters, bench: remaining };
          }

          function tuSum(list){
          """

          lineup_replacement = r"""  return { starters, bench: remaining };
          }

          /* Joint legal-roster optimizer for the current Team Utility objective.

             First optimize the best possible starting lineup from the complete
             post-trade pool. Those starters must be retained. Because every
             remaining player receives the same positive bench coefficient
             (TU_BENCH_WEIGHT), the exact utility-maximizing legal roster is then
             completed by keeping the highest-Fundamental-Value remaining bench
             players until the active-roster limit is reached.

             Any remaining players are the implied cuts. This avoids a heuristic
             "drop the lowest raw player first" pass while remaining equivalent to
             joint optimization under the deployed V1 utility formula. */
          function tuOptimizeLegalRoster(players, rosterLimit = TU_ACTIVE_ROSTER_LIMIT){
            const unconstrained = tuOptimizeLineup(players);
            const starters = unconstrained.starters.slice();
            const benchCapacity = Math.max(0, rosterLimit - starters.length);
            const sortedBench = unconstrained.bench.slice().sort((a,b) => b.value - a.value);
            const bench = sortedBench.slice(0, benchCapacity);
            const cuts = sortedBench.slice(benchCapacity);

            return {
              starters,
              bench,
              cuts,
              rosterLimit,
              rosterSize: starters.length + bench.length,
              overflow: cuts.length,
            };
          }

          function tuSum(list){
          """
          replace_once(lineup_return, lineup_replacement, "insert legal-roster optimizer")

          players_loop = """function tuPlayersFromKeys(keys){
            const out = [];
            for(const key of keys){
              const info = PLAYER_DB[key];
          """
          players_loop_replacement = """function tuPlayersFromKeys(keys){
            const out = [];
            for(const key of [...new Set(keys)]){
              const info = PLAYER_DB[key];
          """
          replace_once(players_loop, players_loop_replacement, "deduplicate Team Utility player keys")

          old_calc = """function calculateTeamUtility(preRosterKeys, postRosterKeys){
            const pre = tuOptimizeLineup(tuPlayersFromKeys(preRosterKeys));
            const post = tuOptimizeLineup(tuPlayersFromKeys(postRosterKeys));
            const lineupDelta = tuSum(post.starters) - tuSum(pre.starters);
            const benchDelta = tuSum(post.bench) - tuSum(pre.bench);
            return {
              teamUtility: Math.round((1 - TU_BENCH_WEIGHT) * lineupDelta + TU_BENCH_WEIGHT * benchDelta),
              lineupDelta: Math.round(lineupDelta),
              benchDelta: Math.round(benchDelta),
            };
          }
          """

          new_calc = """function calculateTeamUtility(preRosterKeys, postRosterKeys){
            const pre = tuOptimizeLegalRoster(tuPlayersFromKeys(preRosterKeys));
            const post = tuOptimizeLegalRoster(tuPlayersFromKeys(postRosterKeys));
            const lineupDelta = tuSum(post.starters) - tuSum(pre.starters);
            const benchDelta = tuSum(post.bench) - tuSum(pre.bench);
            return {
              teamUtility: Math.round((1 - TU_BENCH_WEIGHT) * lineupDelta + TU_BENCH_WEIGHT * benchDelta),
              lineupDelta: Math.round(lineupDelta),
              benchDelta: Math.round(benchDelta),
              postCuts: post.cuts.map(p => p.key),
              preCuts: pre.cuts.map(p => p.key),
              postRosterSize: post.rosterSize,
              rosterLimit: post.rosterLimit,
            };
          }
          """
          replace_once(old_calc, new_calc, "replace Team Utility core with legal-roster optimizer")

          old_trade_impact = """function calculateTradeImpact(currentRosterKeys, outgoingKeys, incomingKeys){
            const postRosterKeys = currentRosterKeys
              .filter(k => !outgoingKeys.includes(k))
              .concat(incomingKeys);

            const utility = calculateTeamUtility(currentRosterKeys, postRosterKeys);

            const outgoingValue = tuSum(tuPlayersFromKeys(outgoingKeys));
            const incomingValue = tuSum(tuPlayersFromKeys(incomingKeys));

            return {
              teamUtility: utility.teamUtility,
              lineupDelta: utility.lineupDelta,
              benchDelta: utility.benchDelta,
              fundamentalValueDelta: Math.round(incomingValue - outgoingValue),
            };
          }
          """

          new_trade_impact = """function calculateTradeImpact(currentRosterKeys, outgoingKeys, incomingKeys){
            const postRosterKeys = currentRosterKeys
              .filter(k => !outgoingKeys.includes(k))
              .concat(incomingKeys);

            const utility = calculateTeamUtility(currentRosterKeys, postRosterKeys);

            const outgoingValue = tuSum(tuPlayersFromKeys(outgoingKeys));
            const incomingValue = tuSum(tuPlayersFromKeys(incomingKeys));

            return {
              teamUtility: utility.teamUtility,
              lineupDelta: utility.lineupDelta,
              benchDelta: utility.benchDelta,
              fundamentalValueDelta: Math.round(incomingValue - outgoingValue),
              postCuts: utility.postCuts,
              postRosterSize: utility.postRosterSize,
              rosterLimit: utility.rosterLimit,
            };
          }
          """
          replace_once(old_trade_impact, new_trade_impact, "extend trade impact with implied cuts")

          old_teamutil_call = """  const teamUtil = calculateTeamUtility(MY_ROSTER, afterRoster);
            const tuColor = teamUtil.teamUtility >= 0 ? 'var(--green)' : 'var(--red)';
          """

          new_teamutil_call = """  /* Team Utility uses the ACTIVE roster only. Taxi and IR remain separate
             pools and cannot silently become free active bench depth. */
            const tuBeforeRoster = tuActiveRosterKeys();
            const tuOutKeys = outgoing
              .map(a => normalizeName(a.name))
              .filter(k => tuBeforeRoster.includes(k));
            const tuIncomingKeys = incoming.map(a => normalizeName(a.name));
            const tuAfterPool = tuBeforeRoster
              .filter(k => !tuOutKeys.includes(k))
              .concat(tuIncomingKeys);
            const teamUtil = calculateTeamUtility(tuBeforeRoster, tuAfterPool);
            const tuColor = teamUtil.teamUtility >= 0 ? 'var(--green)' : 'var(--red)';
          """
          replace_once(old_teamutil_call, new_teamutil_call, "use active legal roster in Trade Impact")

          old_package_note = """  let packageNote = '';
            if(outgoing.length !== incoming.length){
              const giving = outgoing.length, getting = incoming.length;
              if(giving > getting){
                packageNote = `<div style="color:var(--text-dim);margin-top:4px;">Consolidation: giving up ${giving} players for ${getting} — frees up ${giving-getting} roster spot${giving-getting>1?'s':''}, no replacement assumed.</div>`;
              } else {
                packageNote = `<div style="color:var(--text-dim);margin-top:4px;">Expansion: receiving ${getting} players for ${giving} — uses ${getting-giving} additional roster spot${getting-giving>1?'s':''}.</div>`;
              }
            }
          """

          new_package_note = """  let packageNote = '';
            if(outgoing.length !== incoming.length){
              const giving = outgoing.length, getting = incoming.length;
              if(giving > getting){
                packageNote = `<div style="color:var(--text-dim);margin-top:4px;">Consolidation: giving up ${giving} players for ${getting} — frees up ${giving-getting} active roster spot${giving-getting>1?'s':''}.</div>`;
              } else {
                const projectedCuts = (teamUtil.postCuts || []).map(titleCase);
                const extraSlots = getting - giving;
                if(projectedCuts.length){
                  packageNote = `<div style="color:var(--text-dim);margin-top:4px;">Expansion: receiving ${getting} players for ${giving}. Legal-roster optimizer projects ${projectedCuts.length} cut${projectedCuts.length>1?'s':''}: <span style="color:var(--amber);">${projectedCuts.map(escapeHtml).join(', ')}</span>.</div>`;
                } else {
                  packageNote = `<div style="color:var(--text-dim);margin-top:4px;">Expansion: receiving ${getting} players for ${giving} — uses ${extraSlots} additional active roster spot${extraSlots>1?'s':''}; no cut required at current occupancy.</div>`;
                }
              }
            }
          """
          replace_once(old_package_note, new_package_note, "show legal-roster cut decisions")

          required = [
              "const TU_ACTIVE_ROSTER_LIMIT = 41;",
              "function tuActiveRosterKeys(){",
              "function tuOptimizeLegalRoster(players, rosterLimit = TU_ACTIVE_ROSTER_LIMIT){",
              "const pre = tuOptimizeLegalRoster(tuPlayersFromKeys(preRosterKeys));",
              "const post = tuOptimizeLegalRoster(tuPlayersFromKeys(postRosterKeys));",
              "postCuts: post.cuts.map(p => p.key)",
              "const tuBeforeRoster = tuActiveRosterKeys();",
              "Legal-roster optimizer projects",
          ]
          for needle in required:
              if needle not in text:
                  raise RuntimeError(f"missing required patched contract: {needle}")

          path.write_text(text, encoding="utf-8")
          print("Patched index.html Team Utility legal-roster enforcement.")
          PY

      - name: Run synthetic roster-cap contract test
        shell: bash
        run: |
          python3 - <<'PY'
          def legal(starters, bench, limit):
              bench = sorted(bench, reverse=True)
              cap = max(0, limit - len(starters))
              return bench[:cap], bench[cap:]

          kept, cuts = legal([100, 90], [80, 70, 60, 50], 4)
          assert kept == [80, 70], (kept, cuts)
          assert cuts == [60, 50], (kept, cuts)

          kept, cuts = legal([120, 100], [95, 80, 70], 4)
          assert kept == [95, 80]
          assert cuts == [70]

          kept, cuts = legal([120, 100], [80], 4)
          assert kept == [80]
          assert cuts == []

          print("Synthetic legal-roster contract test passed.")
          PY

      - name: JavaScript syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise RuntimeError("No inline script blocks found in index.html")
          Path("/tmp/trade-desk-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s).")
          PY
          node --check /tmp/trade-desk-inline.js

      - name: Run repo regression checks
        shell: bash
        run: |
          pip install requests
          python3 scripts/validation/repo_regression_checks.py

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/fix-team-utility-roster-cap.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "trade-desk-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add -u .github/workflows/fix-team-utility-roster-cap.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Enforce legal roster size in Team Utility"
          git push origin main
