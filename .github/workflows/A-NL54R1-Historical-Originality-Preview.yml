      - name: Run mandatory preview regression tests
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/nl54_engine.py" --self-test
      - name: Inventory approved PDF archives and compare the newest two editions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_PAGES: ${{ inputs.history_run_pages }}
        run: |
          set -euo pipefail
          mkdir -p nl54_output
          python "$RUNNER_TEMP/nl54_engine.py" \
            --repo "$GITHUB_REPOSITORY" --max-pages "$HISTORY_PAGES" \
            --out-dir nl54_output
          test -s nl54_output/NL54-PREVIEW.json
          test -s nl54_output/NL54-PREVIEW.md
          echo 'PASS: read-only preview complete; green DOES NOT authorize publication.'
      - name: Upload archive inventory and originality findings (no repo edits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL54R1-Historical-Originality-PREVIEW-${{ github.run_id }}
          path: nl54_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Show coverage and next-step summary
        if: always()
        shell: bash
        run: |
          if test -f nl54_output/NL54-PREVIEW.md; then
            cat nl54_output/NL54-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NL54 inventory failed before producing a report. Inspect failed step logs; no release was made.' >> "$GITHUB_STEP_SUMMARY"
          fi
