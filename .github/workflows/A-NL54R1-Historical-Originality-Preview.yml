name: A-NL54R1 - Historical Newsletter Originality Inventory (Read-Only Preview)
run-name: A-NL54R1 - Preview four-edition history for both LOG newsletters
'on':
  workflow_dispatch:
    inputs:
      history_run_pages:
        description: GitHub release-run pages to inspect (1-12; 4 recommended). Read-only.
        required: true
        type: string
        default: '4'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl54r1-historical-originality-preview
  cancel-in-progress: false
jobs:
  audit:
    name: Inventory approved editions and compare verified matchup prose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF text inspector
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pymupdf==1.26.5'
