name: A13 Identity V2 Phase 20 Final Pair Stable-ID Shadow

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase20-final-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact post-A12 production baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          a12=json.loads(
              (D/"identity_v2_phase19_batch4_deployment_confirmation.json").read_text()
          )
          assert a12["decision"]=="PASS_IDENTITY_V2_PHASE19_BATCH4_THREE_PLAYER_DEPLOYED"
          assert a12["deployed_mapping_count"]==3
          assert a12["changed_fpids"]==["16787","24181","26411"]
          assert a12["manual_review_count_before"]==5
          assert a12["manual_review_count_after"]==2
          assert a12["jonah_elliss_remains_held"] is True
          assert a12["full_repo_regression_passed"] is True
          assert a12["successor_resolver_exact_scope_passed"] is True

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          manual={
              str(r["fantasypros_id"]):r
              for r in rows if r.get("requires_manual_review") is True
          }
          assert set(manual)=={"26157","26440"},sorted(manual)

          devin=manual["26440"]
          assert devin["name"]=="Devin Culp"
          assert devin["fp_position"]=="TE"
          assert devin["sleeper_id"] is None
          assert str(devin["candidate_sleeper_id"])=="11820"
          assert devin["sleeper_pos"]=="TE"
          assert devin["match_method"]=="unique_name_position_team_unavailable"

          jonah=manual["26157"]
          assert jonah["name"]=="Jonah Elliss"
          assert jonah["fp_position"]=="LB"
          assert jonah["fp_team"]=="DEN"
          assert jonah["sleeper_id"] is None
          assert jonah["candidate_sleeper_id"] is None
          assert jonah["match_method"]=="name_found_position_incompatible"

          by={str(r["fantasypros_id"]):r for r in rows}
          deployed={
              "26313":"11760","27959":"13457","28290":"13482","26964":"12412",
              "15697":"3369","18557":"6111","20080":"8159",
              "16427":"4040","25668":"11210","26397":"11821",
              "18168":"5781","22887":"12532","23957":"11921",
              "16787":"4435","24181":"8500","26411":"11802"
          }
          for fpid,sid in deployed.items():
              assert str(by[fpid].get("sleeper_id"))==sid,(fpid,by[fpid])
              assert by[fpid].get("requires_manual_review") is False

          phase8=json.loads(
              (D/"identity_v2_phase8_external_evidence.json").read_text()
          )
          ext={str(r["fantasypros_id"]):r for r in phase8["rows"]}
          assert ext["26440"]["name"]=="Devin Culp"
          assert ext["26440"]["external_position"]=="TE"
          assert ext["26157"]["name"]=="Jonah Elliss"
          assert ext["26157"]["external_position"]=="OLB"
          assert "Active Denver Broncos" in ext["26157"]["external_team_or_status"]

          print("PASS: exact post-A12 two-row manual universe guarded.")
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

          sha256sum \
            scripts/identity_crosswalk.json \
            scripts/projections/resolve_fantasypros_sleeper_identity.py \
            scripts/artifacts/reports/identity_collision_report.md \
            scripts/artifacts/generated/team_utility_lineup_projections.json \
            scripts/artifacts/reports/team_utility_lineup_projection_report.md \
            > "${RUNNER_TEMP}/a13-production-immutable.sha256"

      - name: Freeze A13 final-pair preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/identity-v2")
          outputs=[
              D/"identity_v2_phase20_final_pair_preregistration.json",
              D/"identity_v2_phase20_final_pair_context_snapshot.json",
              D/"identity_v2_phase20_final_pair_second_source_snapshot.json",
              D/"identity_v2_phase20_final_pair_direct_candidate_crosswalk.json",
              D/"identity_v2_phase20_final_pair_control_refresh_crosswalk.json",
              D/"identity_v2_phase20_final_pair_seeded_refresh_crosswalk.json",
              D/"identity_v2_phase20_final_pair_adjudication.json",
              D/"identity_v2_phase20_final_pair_adjudication.md",
              D/"identity_v2_phase20_final_pair_manifest.json",
          ]
          for p in outputs:
              assert not p.exists(),f"refusing to overwrite {p}"

          prereg={
              "schema_version":1,
              "study_id":"identity-v2-phase20-final-pair-stable-id-shadow",
              "status":"FROZEN_BEFORE_SECOND_SOURCE_READ",
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "deployment_authorized":False,
              "scope":"Exact two remaining post-A12 manual-review rows only.",
              "targets":{
                  "26440":{
                      "name":"Devin Culp",
                      "fantasypros_position":"TE",
                      "candidate_sleeper_id":"11820",
                      "candidate_origin":"Already frozen in the post-A12 production crosswalk."
                  },
                  "26157":{
                      "name":"Jonah Elliss",
                      "fantasypros_position":"LB",
                      "candidate_sleeper_id":"11714",
                      "candidate_origin":"Pre-second-source hypothesis frozen from the current Sleeper projection row: exact normalized name Jonah Elliss, team DEN, Sleeper position DE."
                  }
              },
              "second_source":{
                  "provider":"DynastyProcess/nflverse ffverse player-ID bridge",
                  "url":"https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv"
              },
              "stable_identity_pass_rule":[
                  "Exactly one independent second-source row by frozen FantasyPros ID.",
                  "Exactly one independent second-source row by frozen Sleeper ID.",
                  "The FantasyPros-ID and Sleeper-ID lookups resolve to the same source row.",
                  "Normalized player name matches the frozen player name.",
                  "GSIS stable ID is present.",
                  "PFR stable ID is present."
              ],
              "devin_context_rule":[
                  "Post-A12 production already has exactly one same-name/same-position candidate: Sleeper 11820.",
                  "FantasyPros position is TE and frozen Sleeper candidate position is TE.",
                  "Prior Tampa Bay transaction drift is not used to select the ID; only the independent stable-ID bridge may promote it."
              ],
              "jonah_context_rule":[
                  "FantasyPros currently classifies Jonah Elliss as LB for DEN.",
                  "Current Sleeper projection data contains exact-name Jonah Elliss at SID 11714, team DEN, position DE.",
                  "Frozen official Broncos evidence lists Jonah Elliss as OLB.",
                  "The LB/DE/OLB disagreement is treated as position taxonomy, not proof of identity.",
                  "Only an exact independent FPID<->SID stable-ID bridge may promote SID 11714.",
                  "No global LB/DL/EDGE compatibility rule may be relaxed."
              ],
              "shadow_rule":"Only individually passing rows may enter the direct and successor shadow.",
              "successor_rule":"The existing production stable-ID preservation mechanism must preserve each passing exact pair without changing any nonpassing FPID.",
              "next_step_rule":"A green shadow may authorize only a separate A14 exact-scope deployment of the passing subset. Phase 20 itself cannot change production.",
              "production_change_authorized":False
          }
          (D/"identity_v2_phase20_final_pair_preregistration.json").write_text(
              json.dumps(prereg,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A13 final-pair preregistration frozen before second-source read.")
          PY

      - name: Freeze current contextual evidence for the final pair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path

          D=Path("research/identity-v2")
          prod=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          projections=json.loads(Path("scripts/sleeper_2026_projections.json").read_text())
          phase8=json.loads((D/"identity_v2_phase8_external_evidence.json").read_text())

          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",str(s or "").lower()).strip()

          by_fpid={
              str(r["fantasypros_id"]):r
              for r in prod if r.get("fantasypros_id") not in (None,"")
          }
          ext={str(r["fantasypros_id"]):r for r in phase8["rows"]}

          jonah_projection=[
              r for r in projections
              if str(r.get("sleeper_id") or "")=="11714"
          ]
          assert len(jonah_projection)==1,jonah_projection
          jp=jonah_projection[0]
          assert norm(jp.get("player"))==norm("Jonah Elliss")
          assert str(jp.get("team") or "")=="DEN"
          assert str(jp.get("pos") or "")=="DE"

          same_name_jonah=[
              r for r in projections if norm(r.get("player"))==norm("Jonah Elliss")
          ]
          assert len(same_name_jonah)==1,same_name_jonah

          d=by_fpid["26440"]
          j=by_fpid["26157"]
          assert str(d.get("candidate_sleeper_id"))=="11820"
          assert d.get("sleeper_pos")=="TE"
          assert d.get("requires_manual_review") is True
          assert j.get("candidate_sleeper_id") is None
          assert j.get("requires_manual_review") is True

          assert ext["26440"]["external_position"]=="TE"
          assert ext["26157"]["external_position"]=="OLB"
          assert ext["26157"]["evidence_type"]=="official_team_roster_position"

          # Neither proposed SID may already be authoritative for another FPID.
          for sid in ("11820","11714"):
              owners=[
                  str(r["fantasypros_id"]) for r in prod
                  if str(r.get("sleeper_id") or "")==sid
                  and r.get("requires_manual_review") is False
              ]
              assert not owners,(sid,owners)

          snapshot={
              "schema_version":1,
              "study_id":"identity-v2-phase20-final-pair-stable-id-shadow",
              "status":"FROZEN_PRE_SECOND_SOURCE_CONTEXT",
              "production_manual_fpids":["26157","26440"],
              "devin_culp":{
                  "fantasypros_id":"26440",
                  "candidate_sleeper_id":"11820",
                  "production_row":d,
                  "official_external_evidence":ext["26440"]
              },
              "jonah_elliss":{
                  "fantasypros_id":"26157",
                  "hypothesized_sleeper_id":"11714",
                  "production_row":j,
                  "current_sleeper_projection_row":jp,
                  "same_name_projection_count":len(same_name_jonah),
                  "official_external_evidence":ext["26157"]
              },
              "source_hashes":{
                  "identity_crosswalk_sha256":hashlib.sha256(
                      Path("scripts/identity_crosswalk.json").read_bytes()
                  ).hexdigest(),
                  "sleeper_2026_projections_sha256":hashlib.sha256(
                      Path("scripts/sleeper_2026_projections.json").read_bytes()
                  ).hexdigest(),
                  "phase8_external_evidence_sha256":hashlib.sha256(
                      (D/"identity_v2_phase8_external_evidence.json").read_bytes()
                  ).hexdigest()
              },
              "production_change_authorized":False
          }
          (D/"identity_v2_phase20_final_pair_context_snapshot.json").write_text(
              json.dumps(snapshot,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: final-pair context frozen; Jonah SID 11714 hypothesis fixed before second-source read.")
          PY

      - name: Fetch independent stable-ID bridge and classify both rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,io,json,re,requests
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          prereg=json.loads(
              (D/"identity_v2_phase20_final_pair_preregistration.json").read_text()
          )
          context=json.loads(
              (D/"identity_v2_phase20_final_pair_context_snapshot.json").read_text()
          )
          url=prereg["second_source"]["url"]

          resp=requests.get(
              url,
              timeout=30,
              headers={"User-Agent":"LOG-Trade-Calculator-Identity-V2-A13"}
          )
          resp.raise_for_status()
          raw=resp.content
          rows=list(csv.DictReader(io.StringIO(raw.decode("utf-8"))))
          assert rows

          required={
              "fantasypros_id","sleeper_id","gsis_id","pfr_id",
              "name","position","db_season"
          }
          assert required<=set(rows[0]),sorted(required-set(rows[0]))

          def clean(v):
              v=(v or "").strip()
              return None if v in ("","NA","N/A","null","None") else v

          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",str(s or "").lower()).strip()

          results={}
          source_rows={}

          for fpid,spec in prereg["targets"].items():
              sid=spec["candidate_sleeper_id"]
              fp_rows=[r for r in rows if clean(r.get("fantasypros_id"))==fpid]
              sid_rows=[r for r in rows if clean(r.get("sleeper_id"))==sid]

              same_row=(
                  len(fp_rows)==1 and len(sid_rows)==1
                  and fp_rows[0]==sid_rows[0]
              )
              row=fp_rows[0] if len(fp_rows)==1 else None

              stable_identity_gates={
                  "exact_one_by_fantasypros_id":len(fp_rows)==1,
                  "exact_one_by_sleeper_id":len(sid_rows)==1,
                  "same_second_source_row":same_row,
                  "normalized_name_match":bool(
                      row and norm(clean(row.get("name")))==norm(spec["name"])
                  ),
                  "gsis_id_present":bool(
                      row and clean(row.get("gsis_id"))
                      and clean(row.get("gsis_id")).startswith("00-")
                  ),
                  "pfr_id_present":bool(row and clean(row.get("pfr_id")))
              }
              stable_pass=all(stable_identity_gates.values())

              source_row=None
              if row:
                  source_row={
                      k:clean(row.get(k))
                      for k in (
                          "fantasypros_id","sleeper_id","gsis_id","pfr_id",
                          "espn_id","sportradar_id","mfl_id","name",
                          "position","team","db_season"
                      )
                  }

              if fpid=="26440":
                  d=context["devin_culp"]
                  context_gates={
                      "production_candidate_sid_is_11820":
                          str(d["production_row"].get("candidate_sleeper_id"))=="11820",
                      "fantasypros_position_te":
                          d["production_row"].get("fp_position")=="TE",
                      "frozen_sleeper_candidate_position_te":
                          d["production_row"].get("sleeper_pos")=="TE",
                      "official_evidence_identifies_devin_culp":
                          d["official_external_evidence"].get("name")=="Devin Culp"
                  }
                  contextual_pass=all(context_gates.values())
                  passed=stable_pass and contextual_pass
                  classification=(
                      "PASS_STABLE_ID_CORROBORATION"
                      if passed
                      else "HOLD_FINAL_PAIR_STABLE_ID_NOT_ESTABLISHED"
                  )
              else:
                  j=context["jonah_elliss"]
                  context_gates={
                      "fantasypros_position_lb":
                          j["production_row"].get("fp_position")=="LB",
                      "fantasypros_team_den":
                          j["production_row"].get("fp_team")=="DEN",
                      "current_sleeper_sid_11714":
                          str(j["current_sleeper_projection_row"].get("sleeper_id"))=="11714",
                      "current_sleeper_exact_name":
                          norm(j["current_sleeper_projection_row"].get("player"))
                          ==norm("Jonah Elliss"),
                      "current_sleeper_team_den":
                          j["current_sleeper_projection_row"].get("team")=="DEN",
                      "current_sleeper_position_de":
                          j["current_sleeper_projection_row"].get("pos")=="DE",
                      "official_broncos_position_olb":
                          j["official_external_evidence"].get("external_position")=="OLB",
                      "only_one_current_sleeper_projection_name_match":
                          j["same_name_projection_count"]==1
                  }
                  contextual_pass=all(context_gates.values())
                  passed=stable_pass and contextual_pass
                  classification=(
                      "PASS_STABLE_ID_IDENTITY_TAXONOMY_DIVERGENCE_RESOLVED_BY_EXACT_ID_BRIDGE"
                      if passed
                      else "HOLD_JONAH_ELLISS_IDENTITY_OR_TAXONOMY_EVIDENCE_INCOMPLETE"
                  )

              results[fpid]={
                  "name":spec["name"],
                  "candidate_sleeper_id":sid,
                  "stable_identity_gates":stable_identity_gates,
                  "context_gates":context_gates,
                  "stable_identity_passed":stable_pass,
                  "context_passed":contextual_pass,
                  "passed":passed,
                  "classification":classification,
                  "second_source_row":source_row
              }
              source_rows[fpid]={
                  "fpid_match_count":len(fp_rows),
                  "sid_match_count":len(sid_rows),
                  "second_source_row":source_row
              }

          snapshot={
              "schema_version":1,
              "study_id":"identity-v2-phase20-final-pair-stable-id-shadow",
              "status":"FROZEN_SECOND_SOURCE_SNAPSHOT",
              "captured_at_utc":datetime.now(timezone.utc).isoformat(),
              "source_url":url,
              "source_sha256":hashlib.sha256(raw).hexdigest(),
              "source_row_count":len(rows),
              "targets":source_rows,
              "production_change_authorized":False
          }
          (D/"identity_v2_phase20_final_pair_second_source_snapshot.json").write_text(
              json.dumps(snapshot,indent=2,sort_keys=True)+"\n"
          )
          (D/"identity_v2_phase20_final_pair_classification.tmp.json").write_text(
              json.dumps(results,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              fpid:{
                  "name":r["name"],
                  "passed":r["passed"],
                  "classification":r["classification"],
                  "second_source_position":(
                      r["second_source_row"] or {}
                  ).get("position")
              }
              for fpid,r in results.items()
          },indent=2))
          PY

      - name: Build exact passing-subset direct and successor shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import copy,hashlib,importlib.util,json,subprocess
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          prereg=json.loads(
              (D/"identity_v2_phase20_final_pair_preregistration.json").read_text()
          )
          classified=json.loads(
              (D/"identity_v2_phase20_final_pair_classification.tmp.json").read_text()
          )
          prod_path=Path("scripts/identity_crosswalk.json")
          resolver_path=Path("scripts/projections/resolve_fantasypros_sleeper_identity.py")
          prod=json.loads(prod_path.read_text())

          direct_path=D/"identity_v2_phase20_final_pair_direct_candidate_crosswalk.json"
          control_path=D/"identity_v2_phase20_final_pair_control_refresh_crosswalk.json"
          seeded_path=D/"identity_v2_phase20_final_pair_seeded_refresh_crosswalk.json"
          out_path=D/"identity_v2_phase20_final_pair_adjudication.json"
          md_path=D/"identity_v2_phase20_final_pair_adjudication.md"

          passing=sorted(
              fpid for fpid,r in classified.items() if r["passed"] is True
          )
          held=sorted(set(prereg["targets"])-set(passing))

          def index(rows,label):
              out={}
              for r in rows:
                  fpid=r.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  assert fpid not in out,(label,"duplicate FPID",fpid)
                  out[fpid]=r
              return out

          def canon(r):
              return json.dumps(r,sort_keys=True,separators=(",",":"))

          def changed(a,b):
              aa=index(a,"A"); bb=index(b,"B")
              assert set(aa)==set(bb)
              return sorted(k for k in aa if canon(aa[k])!=canon(bb[k]))

          def collisions(rows):
              by=defaultdict(list)
              for r in rows:
                  sid=r.get("sleeper_id")
                  fpid=r.get("fantasypros_id")
                  if sid in (None,"") or fpid in (None,"") or r.get("requires_manual_review"):
                      continue
                  by[str(sid)].append(str(fpid))
              return {sid:fpids for sid,fpids in by.items() if len(fpids)>1}

          spec=importlib.util.spec_from_file_location("identity_resolver",resolver_path)
          assert spec is not None and spec.loader is not None
          resolver=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(resolver)

          fp_doc=resolver.read_json(resolver.FP_PATH)
          totals=resolver.read_json(resolver.SLEEPER_TOTAL_PATH)
          raw=resolver.read_json(resolver.SLEEPER_RAW_PATH)
          teams=resolver.read_json(resolver.TEAM_REFRESH_PATH)
          meta=resolver.build_sleeper_metadata(totals,raw,teams)

          prod_idx=index(prod,"production")
          assert sum(bool(r.get("requires_manual_review")) for r in prod)==2

          direct=copy.deepcopy(prod)
          direct_idx=index(direct,"direct")

          methods={
              "26440":"phase20_final_pair_stable_id_corroboration",
              "26157":"phase20_final_pair_stable_id_taxonomy_divergence_corroboration"
          }

          for fpid in passing:
              target=prereg["targets"][fpid]
              sid=target["candidate_sleeper_id"]
              row=direct_idx[fpid]
              assert row["requires_manual_review"] is True
              assert row["sleeper_id"] in (None,"")

              row["sleeper_id"]=sid
              row["candidate_sleeper_id"]=sid
              row["requires_manual_review"]=False
              row["match_confidence"]="high"
              row["match_method"]=methods[fpid]

              m=meta.get(sid,{})
              if m.get("sleeper_team") not in (None,""):
                  row["sleeper_team"]=m["sleeper_team"]
              if m.get("sleeper_pos") not in (None,""):
                  row["sleeper_pos"]=m["sleeper_pos"]
              if m.get("sleeper_fantasy_positions") is not None:
                  row["sleeper_fantasy_positions"]=m["sleeper_fantasy_positions"]

          direct_changed=changed(prod,direct)
          direct_gates={
              "changed_scope_equals_passing_subset":direct_changed==passing,
              "manual_count_reduced_exactly":
                  sum(bool(r.get("requires_manual_review")) for r in direct)
                  ==2-len(passing),
              "held_rows_byte_identical":
                  all(canon(prod_idx[x])==canon(direct_idx[x]) for x in held),
              "all_nonpassing_rows_byte_identical":
                  all(
                      canon(prod_idx[x])==canon(direct_idx[x])
                      for x in prod_idx if x not in passing
                  ),
              "passing_pairs_authoritative":
                  all(
                      str(direct_idx[x].get("sleeper_id"))
                      ==prereg["targets"][x]["candidate_sleeper_id"]
                      and direct_idx[x].get("requires_manual_review") is False
                      for x in passing
                  ),
              "no_authoritative_sid_collision":not collisions(direct)
          }
          assert all(direct_gates.values()),direct_gates
          direct_path.write_text(json.dumps(direct,indent=2,sort_keys=True)+"\n")

          control=resolver.build_production_crosswalk(
              fp_doc,totals,raw,teams,prod
          )
          seeded=resolver.build_production_crosswalk(
              fp_doc,totals,raw,teams,direct
          )
          control_path.write_text(json.dumps(control,indent=2,sort_keys=True)+"\n")
          seeded_path.write_text(json.dumps(seeded,indent=2,sort_keys=True)+"\n")

          c=index(control,"control")
          s=index(seeded,"seeded")
          successor_changed=changed(control,seeded)

          successor_gates={
              "seeded_vs_control_scope_equals_passing_subset":
                  successor_changed==passing,
              "all_passing_pairs_survive_successor":
                  all(
                      str(s[x].get("sleeper_id"))
                      ==prereg["targets"][x]["candidate_sleeper_id"]
                      and s[x].get("requires_manual_review") is False
                      for x in passing
                  ),
              "all_nonpassing_rows_identical_between_arms":
                  all(canon(c[x])==canon(s[x]) for x in c if x not in passing),
              "no_authoritative_sid_collision":not collisions(seeded)
          }

          if "26157" in passing:
              successor_gates["jonah_exact_sid_survives_position_change"] = (
                  str(s["26157"].get("sleeper_id"))=="11714"
                  and s["26157"].get("requires_manual_review") is False
                  and s["26157"].get("match_method")
                     =="previous_authoritative_stable_id_preserved_position_changed"
              )

          assert all(successor_gates.values()),successor_gates

          live_source_drift=changed(prod,control)

          if passing==["26157","26440"]:
              decision=(
                  "PASS_IDENTITY_V2_PHASE20_FINAL_PAIR_SHADOW_"
                  "AUTHORIZE_A14_EXACT_SCOPE_FINAL_TWO_DEPLOYMENT"
              )
          elif passing:
              decision=(
                  "PASS_IDENTITY_V2_PHASE20_FINAL_PAIR_SHADOW_"
                  "AUTHORIZE_A14_EXACT_SCOPE_PASSING_SUBSET_ONLY"
              )
          else:
              decision=(
                  "STOP_IDENTITY_V2_PHASE20_FINAL_PAIR_NO_ROW_CLEARED_STABLE_ID_GATES"
              )

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase20-final-pair-stable-id-shadow",
              "status":"FINAL_PAIR_SHADOW_COMPLETE",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "deployment_authorized":False,
              "manual_review_count_before":2,
              "passing_fpids":passing,
              "held_fpids":held,
              "manual_review_count_if_deployed":2-len(passing),
              "per_player":classified,
              "direct_shadow_gates":direct_gates,
              "successor_shadow_gates":successor_gates,
              "successor_changed_fpids":successor_changed,
              "live_source_drift_vs_frozen_production":live_source_drift,
              "jonah_taxonomy_policy":{
                  "global_position_compatibility_relaxed":False,
                  "identity_selected_by_position":False,
                  "identity_requires_exact_second_source_fpid_sid_bridge":True,
                  "existing_stable_id_preservation_used_after_seed":True
              },
              "next_step":(
                  "Build A14 as a separate exact-scope deployment for only the passing FPIDs."
                  if passing
                  else "Stop. Keep both rows on manual review."
              )
          }
          out_path.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 20 — Final Pair Stable-ID Shadow",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- Passing FPIDs: {', '.join(passing) if passing else 'None'}",
              f"- Held FPIDs: {', '.join(held) if held else 'None'}",
              f"- Manual review if passing subset were deployed: **2 → {2-len(passing)}**",
              f"- Direct exact-scope shadow: **{'PASS' if all(direct_gates.values()) else 'FAIL'}**",
              f"- Successor exact-scope shadow: **{'PASS' if all(successor_gates.values()) else 'FAIL'}**",
              "- Global LB/DL compatibility relaxed: **No**",
              "- Production changed in A13: **No**",
              "",
              "## Player classifications"
          ]
          for fpid in ("26440","26157"):
              r=classified[fpid]
              lines.append(
                  f"- {r['name']} (FPID `{fpid}` → SID `{r['candidate_sleeper_id']}`): "
                  f"`{r['classification']}`"
              )
          md_path.write_text("\n".join(lines).rstrip()+"\n")

          print(json.dumps({
              "decision":decision,
              "passing_fpids":passing,
              "held_fpids":held,
              "manual_review_count_if_deployed":2-len(passing),
              "successor_changed_fpids":successor_changed,
              "live_source_drift_count":len(live_source_drift)
          },indent=2))
          PY

      - name: Write A13 manifest and prove production unchanged
        shell: bash
        run: |
          set -euo pipefail

          rm -f research/identity-v2/identity_v2_phase20_final_pair_classification.tmp.json

          sha256sum -c "${RUNNER_TEMP}/a13-production-immutable.sha256"

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          files=[
              "identity_v2_phase20_final_pair_preregistration.json",
              "identity_v2_phase20_final_pair_context_snapshot.json",
              "identity_v2_phase20_final_pair_second_source_snapshot.json",
              "identity_v2_phase20_final_pair_direct_candidate_crosswalk.json",
              "identity_v2_phase20_final_pair_control_refresh_crosswalk.json",
              "identity_v2_phase20_final_pair_seeded_refresh_crosswalk.json",
              "identity_v2_phase20_final_pair_adjudication.json",
              "identity_v2_phase20_final_pair_adjudication.md",
          ]
          for f in files:
              assert (D/f).exists(),f

          result=json.loads(
              (D/"identity_v2_phase20_final_pair_adjudication.json").read_text()
          )
          manifest={
              "schema_version":1,
              "study_id":result["study_id"],
              "decision":result["decision"],
              "research_only":True,
              "production_change_authorized":False,
              "passing_fpids":result["passing_fpids"],
              "held_fpids":result["held_fpids"],
              "manual_review_count_if_deployed":result["manual_review_count_if_deployed"],
              "files":{f:sha(D/f) for f in files}
          }
          (D/"identity_v2_phase20_final_pair_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A13 manifest written; production artifacts remain byte-identical.")
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove exact A13 research-only file scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/identity-v2/identity_v2_phase20_final_pair_preregistration.json",
              "research/identity-v2/identity_v2_phase20_final_pair_context_snapshot.json",
              "research/identity-v2/identity_v2_phase20_final_pair_second_source_snapshot.json",
              "research/identity-v2/identity_v2_phase20_final_pair_direct_candidate_crosswalk.json",
              "research/identity-v2/identity_v2_phase20_final_pair_control_refresh_crosswalk.json",
              "research/identity-v2/identity_v2_phase20_final_pair_seeded_refresh_crosswalk.json",
              "research/identity-v2/identity_v2_phase20_final_pair_adjudication.json",
              "research/identity-v2/identity_v2_phase20_final_pair_adjudication.md",
              "research/identity-v2/identity_v2_phase20_final_pair_manifest.json",
          }

          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          unexpected=touched-allowed
          missing=allowed-touched
          if unexpected:
              raise SystemExit(
                  "Unexpected A13 file changes: "+", ".join(sorted(unexpected))
              )
          if missing:
              raise SystemExit(
                  "Missing A13 research files: "+", ".join(sorted(missing))
              )
          print("PASS: A13 touched exactly nine research-only files.")
          PY

          git diff --check

      - name: Commit A13 research freeze
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A13."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase20_final_pair_preregistration.json \
            research/identity-v2/identity_v2_phase20_final_pair_context_snapshot.json \
            research/identity-v2/identity_v2_phase20_final_pair_second_source_snapshot.json \
            research/identity-v2/identity_v2_phase20_final_pair_direct_candidate_crosswalk.json \
            research/identity-v2/identity_v2_phase20_final_pair_control_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase20_final_pair_seeded_refresh_crosswalk.json \
            research/identity-v2/identity_v2_phase20_final_pair_adjudication.json \
            research/identity-v2/identity_v2_phase20_final_pair_adjudication.md \
            research/identity-v2/identity_v2_phase20_final_pair_manifest.json

          git diff --cached --check
          git commit -m "Freeze Identity V2 Phase 20 final-pair stable-ID shadow"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A13 final-pair research shadow committed cleanly."
