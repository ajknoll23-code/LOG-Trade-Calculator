      - name: Execute strict W10 full PDF build (outputs never uploaded or released)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/nl58.py" \
            --nl57-preview nl58_sources/nl57 \
            --input nl58_input \
            --work "$RUNNER_TEMP/nl58_dry_run" \
            --report nl58_qa
          python3 - <<'NL58_REVIEW_CANDIDATE'
          from pathlib import Path
          import hashlib,yaml,json
          src=Path('nl58_qa/NL58R1-FULL-DRY-RUN.json')
          report=json.loads(src.read_text())
          if report['status']!='DRY_RUN_PASSED_NOT_APPROVED_FOR_PRODUCTION' or report['release_authorized'] is not False:
            raise RuntimeError('Dry run did not return expected NON-PUBLICATION status')
          candidate=Path('${{ runner.temp }}/nl58_dry_run/A-NL47R1-NL58-VERIFIED-CANDIDATE-DO-NOT-DEPLOY.yml')
          source=candidate.read_text()
          obj=yaml.safe_load(source)
          if obj['name']!='A-NL47R1 - LOG Approved Weekly Newsletters (One Run)':
            raise RuntimeError('NL47 workflow name drift')
          if obj['permissions']!={'contents':'read','actions':'write'}:
            raise RuntimeError('NL47 original permissions drift')
          if hashlib.sha256(candidate.read_bytes()).hexdigest()!=report['nl58_candidate_sha256']:
            raise RuntimeError('NL58 candidate mismatch')
          print('PASS: exact candidate YAML valid and SHA-pinned; PRODUCTION NOT MODIFIED')
          NL58_REVIEW_CANDIDATE
          cp "$RUNNER_TEMP/nl58_dry_run/A-NL47R1-NL58-VERIFIED-CANDIDATE-DO-NOT-DEPLOY.yml" nl58_qa/
          test ! -f nl58_qa/LOG-W10-War-Room-V7-Offense-IDP-Final.pdf
          test ! -f nl58_qa/LOG-W09-Aftermath-V7-Offense-IDP-Final.pdf
      - name: Upload read-only QA report and DO NOT DEPLOY candidate (no PDFs)
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL58R1-FULL-DRY-RUN-PREVIEW-${{ github.run_id }}
          path: nl58_qa/
          retention-days: 90
          if-no-files-found: error
      - name: Display verified conclusions and remaining release blockers
        shell: bash
        run: |
          cat nl58_qa/NL58R1-FULL-DRY-RUN.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'GREEN means the dry run works, NOT that NL47 may publish. NL55 still blocks until history and approved copy are integrated.' >> "$GITHUB_STEP_SUMMARY"
