name: A-NL58R1 - NL47 Full Two-Edition Dry Run (No Publication)
run-name: A-NL58R1 - Prove W10 NL47 patch on real source artifacts without release
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl58r1-full-render-preview
  cancel-in-progress: false
jobs:
  dry-run:
    name: Verify fixed NL47 renderer, build PDFs only in runner temp, publish QA proof only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four exact successful upstream runs on main (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'NL58_RUN_PREFLIGHT'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          sources={
            43109541817:'.github/workflows/A-NL57R1-NL47-Article-Identity-Repair-PREVIEW.yml',
            42837666274:'.github/workflows/A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml',
            42837956712:'.github/workflows/A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml',
            42838026515:'.github/workflows/A-NL45R1-Offense-IDP-Leaderboard-ReadOnly.yml',
          }
          for rid,path in sources.items():
            url=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
            req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28','User-Agent':'LOG-NL58R1-ReadOnly'})
            with urllib.request.urlopen(req,timeout=20) as res:r=json.load(res)
            if not (r.get('status')=='completed' and r.get('conclusion')=='success'
                    and r.get('head_branch')=='main' and r.get('path')==path):
              raise RuntimeError(f'Unapproved source run {rid}: '+str((r.get('status'),r.get('conclusion'),r.get('head_branch'),r.get('path'))))
            print('PASS validated source run',rid,path,flush=True)
          NL58_RUN_PREFLIGHT
      - name: Download immutable NL57 candidate (not production)
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL57R1-NL47-REPAIR-PREVIEW-43109541817
          run-id: '43109541817'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl58_sources/nl57
      - name: Download exact source NL39 War Room and Aftermath
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL39R1-Weekly-Newsroom-Shadow-42837666274
          run-id: '42837666274'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl58_input/nl39
      - name: Download exact NL44 frozen V7 War Room
        uses: actions/download-artifact@v4
        with:
          name: LOG-W10-V7-WarRoom-RELEASE-42837956712
          run-id: '42837956712'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl58_input/nl44
      - name: Download exact NL45 Week 9 offense and IDP evidence
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL45R1-Offense-IDP-Scoring-Through-W9-42838026515
          run-id: '42838026515'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl58_input/nl45
      - name: Install pinned PDF reader and YAML inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5' 'PyYAML==6.0.2'
