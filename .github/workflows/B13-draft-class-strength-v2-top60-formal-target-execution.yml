name: B13 Draft Class Strength V2 - Top-60 Formal Target Execution

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6_V3_RUN_ID: "36648176714"
  B6_V3_HEAD_SHA: "3ea325cde6e37c5d3bf63c180f9a79ac045a19cb"

jobs:
  formal_execution:
    name: B13 execute frozen V2 target/null
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B13 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact B12 preregistration and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path("research/draft-class-strength-v2")
          m=json.loads((D/"b12_manifest.json").read_text())
          p=json.loads((D/"b12_top60_stable_era_preregistration.json").read_text())
          s=json.loads((D/"b12_top60_stable_era_cohort_snapshot.json").read_text())
          e=json.loads((D/"b12_b13_execution_contract.json").read_text())

          assert m["decision"]=="PASS_B12_V2_TOP60_STABLE_ERA_PREREGISTRATION_FROZEN_B13_EXECUTION_NEXT"
          assert m["b13_execution_authorized"] is True
          assert m["class_n"]==10
          assert m["player_n"]==188
          assert m["cohort_sha256"]=="1a70070d07c8fd5c9fca0ce0437ebec18a8ee0e8d43bd148705e142f5e581efc"

          expected_hashes={
              "b12_b13_execution_contract.json":"dd92d789548fddbe40cdbf8a4b09f2ffe8c3b3320a8c4cb282a7019f32d8517a",
              "b12_top60_stable_era_cohort_snapshot.json":"31d8426a66f9a41494abf54be727521cf94a28b2b9d1a65d2072170577219fad",
              "b12_top60_stable_era_preregistration.json":"ed07c17fdab8ed431e1e8e1f6a40b60efb0c1b51c0ffe25ef3d03a0135a70734",
              "b12_top60_stable_era_preregistration_report.md":"734f3378dd40b6a2ba883a325daa337396795ae1565323fad7965bbbd7b8b372",
          }
          assert m["output_hashes"]==expected_hashes
          for name,expected in expected_hashes.items():
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          assert p["status"]=="FROZEN_BEFORE_V2_OUTCOME_EXECUTION"
          assert p["population"]["years"]==list(range(2014,2024))
          assert p["population"]["nfl_overall_pick_range"]==[1,60]
          assert p["population"]["player_n"]==188
          assert p["population"]["identity_coverage_required"]==1.0
          assert p["population"]["unresolved_players_allowed"]==0
          assert p["primary_null"]["permutations"]==50000
          assert p["primary_null"]["seed"]==20261006
          assert p["bootstrap"]["replicates"]==10000
          assert p["bootstrap"]["seed"]==20261007
          assert p["power"]["seed"]==20261008
          assert p["formal_gate"]["p_value_lt"]==0.10
          assert p["formal_gate"]["excess_class_variance_ratio_gte"]==0.30
          assert p["formal_gate"]["bootstrap_80_lower_gt"]==0.0
          assert p["scientific_status"]["independent_confirmatory_test"] is False
          assert p["outcomes_opened_by_b12"] is False
          assert p["2027_class_scored"] is False
          assert p["production_change_authorized"] is False

          assert s["source_gate_pass"] is True
          assert s["class_n"]==10
          assert s["player_n"]==188
          assert len(s["cohort"])==188
          assert s["identity_missing_n"]==0
          assert s["duplicate_stable_id_n"]==0
          assert s["duplicate_sleeper_collision_n"]==0
          assert all(r["birth_date"] for r in s["cohort"])
          assert e["b13_must_hash_guard_both_inputs"] is True
          assert e["b13_must_reconstruct_exact_frozen_h3_o2"] is True
          assert e["b13_must_run_primary_before_non_gating_diagnostics"] is True
          assert e["b13_must_freeze_primary_verdict_before_power_or_diagnostics"] is True
          assert e["b13_may_not_modify_target_or_null"] is True
          assert e["b13_may_not_score_2027"] is True
          assert e["b13_may_not_change_production"] is True

          print("PASS: exact B12 V2 preregistration and cohort hashes guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: repository regression baseline."

      - name: Freeze exact B13 execution details before outcomes are opened
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b13-method
          python3 - <<'PY'
          import json
          from pathlib import Path

          method={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b13_execution_method_freeze",
              "frozen_before_outcome_artifact_download":True,
              "primary_target_and_null_source":"Exact B12 preregistration; no changes.",

              "h3_reconstruction":{
                  "lineage_commit":"3ea325cde6e37c5d3bf63c180f9a79ac045a19cb",
                  "season_artifact_run_id":36648176714,
                  "required_seasons":list(range(2014,2026)),
                  "formula":"Exact B6 V3 H3.O2 reconstruction from frozen B5/V5 contracts and B6 season artifacts.",
                  "replay_validation":"Every overlap with saved B6 2014-2023 top48 H3.O2 must agree to relative tolerance 1e-10.",
                  "minimum_overlap_total":50,
                  "minimum_overlap_each_class":1,
              },

              "draft_bin_function":{
                  "bins":[[1,10],[11,20],[21,30],[31,40],[41,50],[51,60]],
                  "labels":["1_10","11_20","21_30","31_40","41_50","51_60"],
              },

              "primary_permutation":{
                  "replicates":50000,
                  "seed":20261006,
                  "assignment":"Independently shuffle the observed H3.O2 values within each frozen draft-capital bin across the fixed 188 class/bin slots.",
                  "score_recomputed_each_replicate":True,
                  "p_value":"add-one one-sided P(null sample variance >= observed sample variance)",
                  "null_mean":"arithmetic mean of all 50,000 null variances",
                  "excess_ratio":"max(0, 1-null_mean_variance/observed_variance)",
              },

              "bootstrap":{
                  "replicates":10000,
                  "seed":20261007,
                  "sampling":"Within every class x frozen draft-capital bin cell, resample whole players with replacement to the original cell count.",
                  "class_scores_recomputed_each_replicate":True,
                  "null_reference":"The frozen 50,000-permutation primary null mean variance is held fixed across bootstrap replicates.",
                  "excess_ratio_each_replicate":"max(0, 1-primary_null_mean_variance/bootstrap_observed_variance)",
                  "intervals":{
                      "80_percent":[0.10,0.90],
                      "95_percent":[0.025,0.975],
                  },
                  "gate":"80% lower quantile must be strictly > 0.",
              },

              "primary_verdict_freeze":{
                  "must_be_written_before_power_or_non_gating_diagnostics":True,
                  "pass_requires":[
                      "10 complete classes",
                      "p < 0.10",
                      "excess_class_variance_ratio >= 0.30",
                      "80% bootstrap lower > 0"
                  ],
              },

              "power_diagnostic":{
                  "seed":20261008,
                  "effect_sd_grid":[0.0,0.03,0.05,0.08,0.12],
                  "simulations_per_grid":2000,
                  "method":"Class-score-level Monte Carlo calibrated to the frozen primary null score vectors.",
                  "algorithm":[
                      "Sample one 10-class score vector from the primary permutation null.",
                      "Draw 10 iid Normal(0,effect_sd) class effects and mean-center them.",
                      "Add effects to the sampled null score vector.",
                      "Evaluate p and excess-ratio gates against the frozen primary null variance distribution.",
                      "Evaluate the bootstrap-lower gate with 200 resamples of the 10 synthetic class scores; use the frozen primary null mean variance."
                  ],
                  "power_bootstrap_replicates_per_simulation":200,
                  "interpretation":"Approximate diagnostic only; cannot rescue a primary failure. It only labels a neutral failure as adequately powered vs underpowered.",
                  "adequate_power_threshold":0.80,
                  "economic_reference_effect_sd":0.08,
              },

              "non_gating_diagnostics":{
                  "continuity_to_b6_2014_2023":["Pearson","Spearman","sign agreement"],
                  "class_size_vs_score":["Pearson","Spearman"],
                  "leave_one_class_out_influence":"Recompute V2 scores/variance after dropping each class.",
                  "position_preserving_null":{
                      "replicates":10000,
                      "seed":20261009,
                      "broad_bins":[[1,20],[21,40],[41,60]],
                      "strata":"position x broad NFL draft-capital bin",
                  },
                  "qb_vs_non_qb":"Report per-class QB/non-QB H3 totals and correlations with class score.",
                  "cannot_change_primary_verdict":True,
              },

              "decision_policy":{
                  "primary_pass":"PASS_B13_V2_TARGET_GATE_AUTHORIZE_PREDICTOR_SOURCE_FEASIBILITY_ONLY",
                  "primary_fail_and_power_at_008_gte_080":"STOP_B13_V2_TARGET_NEGATIVE_NEUTRAL_1_00",
                  "primary_fail_and_power_at_008_lt_080":"STOP_B13_V2_TARGET_UNDERPOWERED_NEUTRAL_1_00",
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False,
              },

              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }

          p=Path("/tmp/b13-method/b13_execution_method_freeze.json")
          p.write_text(json.dumps(method,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "frozen_before_outcomes":True,
              "primary_permutations":50000,
              "bootstrap_replicates":10000,
              "power_grid":method["power_diagnostic"]["effect_sd_grid"],
          },indent=2))
          PY

      - name: Freeze old B6 H3 lineage files before outcome download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b13-lineage
          git cat-file -e "$B6_V3_HEAD_SHA^{commit}"
          git show "$B6_V3_HEAD_SHA:research/draft-class-strength-v1/b5_option_d_historical_fundamental_target_preregistration.json" > /tmp/b13-lineage/b5_prereg.json
          git show "$B6_V3_HEAD_SHA:research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json" > /tmp/b13-lineage/v5_bridge.json
          git show "$B6_V3_HEAD_SHA:scripts/validation/snapshot_values.py" > /tmp/b13-lineage/snapshot_values.py
          python3 -m py_compile /tmp/b13-lineage/snapshot_values.py
          test -s /tmp/b13-lineage/b5_prereg.json
          test -s /tmp/b13-lineage/v5_bridge.json
          echo "PASS: exact old B6 H3 lineage frozen locally."

      - name: Download exact B6 season artifacts 2010-2025
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ajknoll23-code/LOG-Trade-Calculator
          run-id: 36648176714
          pattern: dcs-b6-season-*
          merge-multiple: true
          path: /tmp/b13-seasons

      - name: Validate frozen season artifact panel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("/tmp/b13-seasons")
          required=list(range(2014,2026))
          for y in required:
              p=D/f"season_{y}.json"
              assert p.is_file(),p
              a=json.loads(p.read_text())
              assert a["season"]==y
              assert a["provider"]=="Sleeper historical weekly NFL stats"
              assert a["availability_pass"] is True,(y,a.get("missing_required_weeks"),a.get("transport_errors"))
              assert a["production_change_authorized"] is False
              assert a["2027_class_scored"] is False
              assert isinstance(a["players"],dict) and a["players"],y
          print(f"PASS: all {len(required)} required frozen season artifacts 2014-2025 are available.")
          PY

      - name: Reconstruct exact H3.O2 and validate B6 replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import math
          import statistics
          from collections import defaultdict
          from datetime import date
          from pathlib import Path

          ROOT=Path.cwd()
          V2=ROOT/"research/draft-class-strength-v2"
          V1=ROOT/"research/draft-class-strength-v1"
          SD=Path("/tmp/b13-seasons")
          LD=Path("/tmp/b13-lineage")
          OUT=Path("/tmp/b13-work");OUT.mkdir(parents=True,exist_ok=True)

          cohort=json.loads((V2/"b12_top60_stable_era_cohort_snapshot.json").read_text())["cohort"]
          assert len(cohort)==188
          assert all(r["birth_date"] and r["sleeper_id"] for r in cohort)

          pre=json.loads((LD/"b5_prereg.json").read_text())
          v5=json.loads((LD/"v5_bridge.json").read_text())
          old_panel=json.loads((V1/"b6_option_d_historical_target_panel.json").read_text())

          spec=importlib.util.spec_from_file_location("b13_frozen_age",LD/"snapshot_values.py")
          age_mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(age_mod)

          h3=pre["h3o2_value_contract"]
          bridge=v5["frozen_scale_bridge"]
          weights={k:float(v) for k,v in h3["position_weights_primary_subset"].items()}
          ranks={k:int(v) for k,v in h3["replacement_ranks_primary_subset"].items()}
          prod=bridge["production_transform"]
          age_cfg={
              "age_curve":bridge["age_curve"],
              "qb_post_peak_floor":float(bridge["qb_post_peak_floor"]),
              "lb_post_peak_decay_power":float(bridge["lb_post_peak_decay_power"]),
          }
          base=float(h3["o2_scale"]["base_scale"])
          assert set(weights)=={"QB","RB","WR","TE"}
          assert set(ranks)=={"QB","RB","WR","TE"}

          arts={}
          for s in range(2014,2026):
              p=SD/f"season_{s}.json"
              a=json.loads(p.read_text())
              assert a["availability_pass"] is True
              arts[s]=a

          def clamp(v,lo,hi): return max(lo,min(hi,v))
          def sched(s): return 17 if s>=2021 else 16
          def age_sep1(b,s):
              d=date.fromisoformat(str(b)[:10]);a=date(s,9,1)
              return a.year-d.year-((a.month,a.day)<(d.month,d.day))

          # Exact B6 replacement-level construction using the full provider player universe.
          baselines={}
          for s,a in arts.items():
              by=defaultdict(list)
              for sid,r in a["players"].items():
                  p=r.get("season_position")
                  if p not in weights or int(r["games"])<3:
                      continue
                  by[p].append((float(r["season_total"])/int(r["games"]),str(sid)))
              bb={}
              for p in weights:
                  arr=sorted(by[p],key=lambda x:(-x[0],x[1]))
                  rank=ranks[p]
                  assert len(arr)>=rank,(s,p,len(arr),rank)
                  bb[p]={
                      "rank":rank,
                      "replacement_ppg":arr[rank-1][0],
                      "eligible_n":len(arr),
                  }
              baselines[s]=bb

          players=[]
          for row in cohort:
              y=int(row["draft_year"]);p=row["position"];sid=str(row["sleeper_id"]);birth=row["birth_date"]
              req=[y,y+1,y+2]
              assert all(s in baselines and arts[s]["availability_pass"] for s in req)
              annual=[]
              for s in req:
                  rec=arts[s]["players"].get(sid)
                  games=int(rec["games"]) if rec else 0
                  total=float(rec["season_total"]) if rec else 0.0
                  denom=float(baselines[s][p]["replacement_ppg"])*sched(s)
                  realized=(
                      float(prod["zero_games_override"])
                      if games==0 else
                      clamp(
                          float(prod["intercept"])+float(prod["slope"])*(total/denom),
                          float(prod["floor"]),
                          float(prod["ceiling"]),
                      )
                  )
                  age=age_sep1(birth,s)
                  am=float(age_mod.age_multiplier(p,age,"Starter",realized,realized,age_cfg))
                  annual_fv=base*weights[p]*am*realized
                  annual.append({
                      "season":s,
                      "games":games,
                      "season_total":total,
                      "replacement_ppg":baselines[s][p]["replacement_ppg"],
                      "realized_prod_mult":realized,
                      "age":age,
                      "age_multiplier":am,
                      "annual_player_equivalent_fv":annual_fv,
                  })
              o2=statistics.fmean(a["annual_player_equivalent_fv"] for a in annual)
              players.append({
                  **row,
                  "draft_bin":(
                      "1_10" if row["draft_pick"]<=10 else
                      "11_20" if row["draft_pick"]<=20 else
                      "21_30" if row["draft_pick"]<=30 else
                      "31_40" if row["draft_pick"]<=40 else
                      "41_50" if row["draft_pick"]<=50 else
                      "51_60"
                  ),
                  "H3_O2":o2,
                  "annual":annual,
              })

          assert len(players)==188
          assert all(math.isfinite(float(r["H3_O2"])) and float(r["H3_O2"])>=0 for r in players)

          # Replay saved B6 H3.O2 values for every overlapping player.
          old={}
          for y in range(2014,2024):
              for r in old_panel["classes"][str(y)]["top48_players"]:
                  old[(y,r["stable_id"])]=float(r["H3_O2"])

          overlap_by_year=defaultdict(int)
          diffs=[]
          for r in players:
              key=(int(r["draft_year"]),r["stable_id"])
              if key not in old:
                  continue
              a=float(r["H3_O2"]);b=old[key]
              rel=abs(a-b)/max(1.0,abs(b))
              diffs.append(rel)
              overlap_by_year[int(r["draft_year"])]+=1
              assert rel<=1e-10,(r["name"],key,a,b,rel)

          assert len(diffs)>=50,len(diffs)
          assert all(overlap_by_year[y]>=1 for y in range(2014,2024)),dict(overlap_by_year)

          payload={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b13_h3_o2_panel",
              "player_n":len(players),
              "class_n":10,
              "years":list(range(2014,2024)),
              "h3_lineage_commit":"3ea325cde6e37c5d3bf63c180f9a79ac045a19cb",
              "b6_replay_overlap_n":len(diffs),
              "b6_replay_overlap_by_year":dict(sorted(overlap_by_year.items())),
              "b6_replay_max_relative_error":max(diffs) if diffs else None,
              "baselines":baselines,
              "players":players,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }
          (OUT/"b13_h3_o2_panel.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "player_n":188,
              "replay_overlap_n":len(diffs),
              "replay_max_relative_error":max(diffs),
          },indent=2))
          PY

      - name: Execute frozen primary target null and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import bisect
          import json
          import math
          import random
          import statistics
          from collections import defaultdict
          from pathlib import Path

          V2=Path("research/draft-class-strength-v2")
          W=Path("/tmp/b13-work")
          method=json.loads(Path("/tmp/b13-method/b13_execution_method_freeze.json").read_text())
          panel=json.loads((W/"b13_h3_o2_panel.json").read_text())
          pre=json.loads((V2/"b12_top60_stable_era_preregistration.json").read_text())

          YEARS=list(range(2014,2024))
          BINS=["1_10","11_20","21_30","31_40","41_50","51_60"]
          rows=panel["players"]
          assert len(rows)==188

          # Fixed slot table in deterministic order.
          slots=[]
          for y in YEARS:
              yy=sorted(
                  [r for r in rows if int(r["draft_year"])==y],
                  key=lambda r:(int(r["draft_pick"]),str(r["stable_id"]))
              )
              for r in yy:
                  slots.append({
                      "year":y,
                      "bin":r["draft_bin"],
                      "stable_id":r["stable_id"],
                      "name":r["name"],
                      "position":r["position"],
                      "draft_pick":int(r["draft_pick"]),
                      "h3":float(r["H3_O2"]),
                  })
          assert len(slots)==188

          def scores_from_values(values, years=YEARS, active_indices=None):
              if active_indices is None:
                  active_indices=range(len(slots))
              by_yb=defaultdict(list)
              total_by_y=defaultdict(float)
              counts_by_yb=defaultdict(int)
              for i in active_indices:
                  sl=slots[i]
                  y=sl["year"];b=sl["bin"];v=float(values[i])
                  by_yb[(y,b)].append(v)
                  total_by_y[y]+=v
                  counts_by_yb[(y,b)]+=1
              years=list(years)
              # LOO expectation per year/bin from all other active classes.
              bin_values_other={}
              for y in years:
                  for b in BINS:
                      vals=[]
                      for oy in years:
                          if oy==y:continue
                          vals.extend(by_yb.get((oy,b),[]))
                      assert vals,(y,b)
                      bin_values_other[(y,b)]=statistics.fmean(vals)
              expected={}
              score={}
              for y in years:
                  exp=0.0
                  for b in BINS:
                      exp+=counts_by_yb.get((y,b),0)*bin_values_other[(y,b)]
                  obs=total_by_y[y]
                  assert obs>0 and exp>0,(y,obs,exp)
                  expected[y]=exp
                  score[y]=math.log(obs/exp)
              return score,dict(total_by_y),expected

          values=[s["h3"] for s in slots]
          obs_scores,obs_totals,obs_expected=scores_from_values(values)
          observed_variance=statistics.variance(obs_scores[y] for y in YEARS)

          # Primary permutation: shuffle observed values only within each frozen bin.
          idx_by_bin={b:[i for i,s in enumerate(slots) if s["bin"]==b] for b in BINS}
          vals_by_bin={b:[values[i] for i in idx_by_bin[b]] for b in BINS}

          rng=random.Random(int(pre["primary_null"]["seed"]))
          N=int(pre["primary_null"]["permutations"])
          null_variances=[]
          null_score_vectors=[]
          exceed=0
          work=list(values)

          for _ in range(N):
              for b in BINS:
                  arr=list(vals_by_bin[b])
                  rng.shuffle(arr)
                  for i,v in zip(idx_by_bin[b],arr):
                      work[i]=v
              sc,_,_=scores_from_values(work)
              vec=[sc[y] for y in YEARS]
              var=statistics.variance(vec)
              null_variances.append(var)
              null_score_vectors.append(vec)
              if var>=observed_variance:
                  exceed+=1

          p_value=(1+exceed)/(1+N)
          null_mean=statistics.fmean(null_variances)
          excess_ratio=max(0.0,1.0-null_mean/observed_variance) if observed_variance>0 else 0.0

          # Player-level cell bootstrap with fixed primary-null mean reference.
          cell_indices=defaultdict(list)
          for i,s in enumerate(slots):
              cell_indices[(s["year"],s["bin"])].append(i)

          brng=random.Random(int(pre["bootstrap"]["seed"]))
          BR=int(pre["bootstrap"]["replicates"])
          boot_ratios=[]
          boot_variances=[]
          for _ in range(BR):
              boot=list(values)
              for key,inds in cell_indices.items():
                  source=[values[i] for i in inds]
                  for i in inds:
                      boot[i]=source[brng.randrange(len(source))]
              sc,_,_=scores_from_values(boot)
              v=statistics.variance(sc[y] for y in YEARS)
              boot_variances.append(v)
              boot_ratios.append(max(0.0,1.0-null_mean/v) if v>0 else 0.0)

          def quantile(xs,q):
              a=sorted(float(x) for x in xs)
              if not a:return None
              pos=(len(a)-1)*q
              lo=int(math.floor(pos));hi=int(math.ceil(pos))
              if lo==hi:return a[lo]
              return a[lo]*(hi-pos)+a[hi]*(pos-lo)

          boot80=[quantile(boot_ratios,0.10),quantile(boot_ratios,0.90)]
          boot95=[quantile(boot_ratios,0.025),quantile(boot_ratios,0.975)]

          gate_components={
              "complete_classes":len(YEARS)>=int(pre["formal_gate"]["minimum_complete_classes"]),
              "p_value":p_value<float(pre["formal_gate"]["p_value_lt"]),
              "excess_ratio":excess_ratio>=float(pre["formal_gate"]["excess_class_variance_ratio_gte"]),
              "bootstrap_80_lower":boot80[0]>float(pre["formal_gate"]["bootstrap_80_lower_gt"]),
          }
          primary_pass=all(gate_components.values())

          classes={}
          for y in YEARS:
              classes[str(y)]={
                  "cohort_n":sum(1 for s in slots if s["year"]==y),
                  "observed_h3_total":obs_totals[y],
                  "loo_expected_h3_total":obs_expected[y],
                  "class_log_strength":obs_scores[y],
                  "class_multiplier":math.exp(obs_scores[y]),
                  "draft_bin_counts":{
                      b:sum(1 for s in slots if s["year"]==y and s["bin"]==b)
                      for b in BINS
                  },
              }

          # Crucial: freeze the primary verdict before any power/diagnostics step.
          frozen={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b13_primary_gate_frozen",
              "primary_verdict_frozen_before_power_and_diagnostics":True,
              "primary_pass":primary_pass,
              "gate_components":gate_components,
              "class_n":10,
              "player_n":188,
              "classes":classes,
              "observed_variance":observed_variance,
              "primary_null":{
                  "replicates":N,
                  "seed":int(pre["primary_null"]["seed"]),
                  "null_mean_variance":null_mean,
                  "p_value":p_value,
                  "exceed_n":exceed,
                  "variance_quantiles":{
                      "50":quantile(null_variances,0.50),
                      "90":quantile(null_variances,0.90),
                      "95":quantile(null_variances,0.95),
                      "99":quantile(null_variances,0.99),
                  },
              },
              "excess_class_variance_ratio":excess_ratio,
              "bootstrap":{
                  "replicates":BR,
                  "seed":int(pre["bootstrap"]["seed"]),
                  "excess_ratio_80_interval":boot80,
                  "excess_ratio_95_interval":boot95,
                  "observed_variance_80_interval":[
                      quantile(boot_variances,0.10),
                      quantile(boot_variances,0.90),
                  ],
                  "null_mean_reference_held_fixed":True,
              },
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }
          (W/"b13_primary_gate_frozen.json").write_text(json.dumps(frozen,indent=2,sort_keys=True)+"\n")

          # Internal Monte Carlo state only; persisted to /tmp for power, not committed.
          state={
              "null_variances":null_variances,
              "null_score_vectors":null_score_vectors,
              "primary_null_mean":null_mean,
          }
          (W/"b13_primary_monte_carlo_state.json").write_text(json.dumps(state,separators=(",",":")))

          print(json.dumps({
              "primary_pass":primary_pass,
              "observed_variance":observed_variance,
              "null_mean_variance":null_mean,
              "p_value":p_value,
              "excess_ratio":excess_ratio,
              "bootstrap_80":boot80,
              "gate_components":gate_components,
          },indent=2))
          PY

