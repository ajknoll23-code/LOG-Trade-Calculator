      - name: Run frozen power diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import bisect
          import json
          import math
          import random
          import statistics
          from pathlib import Path

          W=Path("/tmp/b13-work")
          method=json.loads(Path("/tmp/b13-method/b13_execution_method_freeze.json").read_text())
          primary=json.loads((W/"b13_primary_gate_frozen.json").read_text())
          state=json.loads((W/"b13_primary_monte_carlo_state.json").read_text())

          null_vars=sorted(float(x) for x in state["null_variances"])
          null_vecs=[[float(v) for v in row] for row in state["null_score_vectors"]]
          null_mean=float(state["primary_null_mean"])
          N=len(null_vars)
          assert N==50000 and len(null_vecs)==50000

          cfg=method["power_diagnostic"]
          rng=random.Random(int(cfg["seed"]))
          sims=int(cfg["simulations_per_grid"])
          b_reps=int(cfg["power_bootstrap_replicates_per_simulation"])

          def p_from_var(v):
              i=bisect.bisect_left(null_vars,v)
              ge=N-i
              return (1+ge)/(1+N)

          def ratio(v):
              return max(0.0,1.0-null_mean/v) if v>0 else 0.0

          def q10(xs):
              a=sorted(xs)
              pos=(len(a)-1)*0.10
              lo=int(math.floor(pos));hi=int(math.ceil(pos))
              if lo==hi:return a[lo]
              return a[lo]*(hi-pos)+a[hi]*(pos-lo)

          grid={}
          for sd in cfg["effect_sd_grid"]:
              passes=0
              comp={"p":0,"ratio":0,"boot":0}
              for _ in range(sims):
                  base=list(null_vecs[rng.randrange(len(null_vecs))])
                  effects=[rng.gauss(0.0,float(sd)) for _ in range(10)]
                  em=statistics.fmean(effects)
                  effects=[x-em for x in effects]
                  syn=[a+b for a,b in zip(base,effects)]
                  v=statistics.variance(syn)
                  pg=p_from_var(v)<0.10
                  rg=ratio(v)>=0.30

                  br=[]
                  for _b in range(b_reps):
                      bs=[syn[rng.randrange(10)] for _j in range(10)]
                      bv=statistics.variance(bs)
                      br.append(ratio(bv))
                  bg=q10(br)>0.0

                  comp["p"]+=int(pg);comp["ratio"]+=int(rg);comp["boot"]+=int(bg)
                  passes+=int(pg and rg and bg)

              grid[str(sd)]={
                  "effect_sd":float(sd),
                  "simulations":sims,
                  "all_gate_power":passes/sims,
                  "component_pass_rates":{k:v/sims for k,v in comp.items()},
              }

          ref=str(cfg["economic_reference_effect_sd"])
          ref_power=grid[ref]["all_gate_power"]
          mde=None
          for sd in cfg["effect_sd_grid"]:
              if grid[str(sd)]["all_gate_power"]>=float(cfg["adequate_power_threshold"]):
                  mde=float(sd);break

          out={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b13_power_diagnostic",
              "method":"class_score_level_null_calibrated_monte_carlo",
              "approximate_diagnostic":True,
              "cannot_rescue_primary_failure":True,
              "seed":int(cfg["seed"]),
              "simulations_per_grid":sims,
              "power_bootstrap_replicates_per_simulation":b_reps,
              "grid":grid,
              "false_pass_rate_sd_0":grid["0.0"]["all_gate_power"],
              "economic_reference_effect_sd":float(cfg["economic_reference_effect_sd"]),
              "economic_reference_all_gate_power":ref_power,
              "adequate_power_threshold":float(cfg["adequate_power_threshold"]),
              "adequately_powered_at_reference":ref_power>=float(cfg["adequate_power_threshold"]),
              "grid_mde_80":mde,
              "primary_pass_was_already_frozen":primary["primary_pass"],
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }
          (W/"b13_power_diagnostic.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - name: Run non-gating diagnostics after primary freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import math
          import random
          import statistics
          from collections import defaultdict
          from pathlib import Path

          W=Path("/tmp/b13-work")
          V1=Path("research/draft-class-strength-v1")
          primary=json.loads((W/"b13_primary_gate_frozen.json").read_text())
          panel=json.loads((W/"b13_h3_o2_panel.json").read_text())
          old=json.loads((V1/"b6_option_d_historical_target_panel.json").read_text())

          YEARS=list(range(2014,2024))
          BINS=["1_10","11_20","21_30","31_40","41_50","51_60"]
          rows=panel["players"]

          def pearson(xs,ys):
              mx=statistics.fmean(xs);my=statistics.fmean(ys)
              num=sum((x-mx)*(y-my) for x,y in zip(xs,ys))
              den=math.sqrt(sum((x-mx)**2 for x in xs)*sum((y-my)**2 for y in ys))
              return num/den if den else None

          def ranks(xs):
              order=sorted(range(len(xs)),key=lambda i:(xs[i],i))
              out=[0.0]*len(xs);i=0
              while i<len(order):
                  j=i
                  while j+1<len(order) and xs[order[j+1]]==xs[order[i]]:
                      j+=1
                  r=(i+j+2)/2
                  for k in range(i,j+1):out[order[k]]=r
                  i=j+1
              return out

          def spearman(xs,ys): return pearson(ranks(xs),ranks(ys))

          new=[primary["classes"][str(y)]["class_log_strength"] for y in YEARS]
          oldv=[old["classes"][str(y)]["class_log_strength"] for y in YEARS]
          sign=sum(
              (a==0 and b==0) or (a>0 and b>0) or (a<0 and b<0)
              for a,b in zip(new,oldv)
          )/len(YEARS)

          sizes=[primary["classes"][str(y)]["cohort_n"] for y in YEARS]

          # Recompute score framework for leave-one-class-out influence.
          def bin_of(pick):
              return (
                  "1_10" if pick<=10 else "11_20" if pick<=20 else
                  "21_30" if pick<=30 else "31_40" if pick<=40 else
                  "41_50" if pick<=50 else "51_60"
              )

          def calc(active_years, values_by_stable):
              byyb=defaultdict(list);tot=defaultdict(float);cnt=defaultdict(int)
              for r in rows:
                  y=int(r["draft_year"])
                  if y not in active_years:continue
                  b=bin_of(int(r["draft_pick"]))
                  v=float(values_by_stable[r["stable_id"]])
                  byyb[(y,b)].append(v);tot[y]+=v;cnt[(y,b)]+=1
              scores={}
              for y in active_years:
                  exp=0.0
                  for b in BINS:
                      others=[]
                      for oy in active_years:
                          if oy!=y:others.extend(byyb.get((oy,b),[]))
                      if cnt.get((y,b),0):
                          assert others,(y,b)
                          exp+=cnt[(y,b)]*statistics.fmean(others)
                  scores[y]=math.log(tot[y]/exp)
              return scores

          values={r["stable_id"]:float(r["H3_O2"]) for r in rows}
          influence={}
          for drop in YEARS:
              yy=[y for y in YEARS if y!=drop]
              sc=calc(yy,values)
              influence[str(drop)]={
                  "remaining_class_n":len(yy),
                  "variance":statistics.variance(sc.values()),
                  "scores":{str(y):sc[y] for y in yy},
              }

          # Position x broad-draft-bin preserving secondary null.
          def broad(pick):
              return "1_20" if pick<=20 else ("21_40" if pick<=40 else "41_60")

          slots=sorted(rows,key=lambda r:(int(r["draft_year"]),int(r["draft_pick"]),str(r["stable_id"])))
          strata=defaultdict(list)
          for i,r in enumerate(slots):
              strata[(r["position"],broad(int(r["draft_pick"])))].append(i)

          basevals=[float(r["H3_O2"]) for r in slots]
          srng=random.Random(20261009)
          secvars=[]
          for _ in range(10000):
              vv=list(basevals)
              for _,inds in strata.items():
                  arr=[basevals[i] for i in inds]
                  srng.shuffle(arr)
                  for i,v in zip(inds,arr):vv[i]=v
              mapped={slots[i]["stable_id"]:vv[i] for i in range(len(slots))}
              sc=calc(YEARS,mapped)
              secvars.append(statistics.variance(sc.values()))

          obsvar=float(primary["observed_variance"])
          secp=(1+sum(v>=obsvar for v in secvars))/(1+len(secvars))
          secmean=statistics.fmean(secvars)
          secr=max(0.0,1.0-secmean/obsvar) if obsvar>0 else 0.0

          qb=[]
          for y in YEARS:
              q=sum(float(r["H3_O2"]) for r in rows if int(r["draft_year"])==y and r["position"]=="QB")
              nq=sum(float(r["H3_O2"]) for r in rows if int(r["draft_year"])==y and r["position"]!="QB")
              qb.append({
                  "year":y,
                  "qb_h3_total":q,
                  "nonqb_h3_total":nq,
                  "qb_share":q/(q+nq) if q+nq else 0.0,
                  "class_log_strength":primary["classes"][str(y)]["class_log_strength"],
              })

          diag={
              "schema_version":1,
              "study_id":"draft-class-strength-v2",
              "stage":"b13_non_gating_diagnostics",
              "all_diagnostics_non_gating":True,
              "primary_verdict_was_frozen_before_diagnostics":True,
              "continuity_to_b6_2014_2023":{
                  "pearson":pearson(new,oldv),
                  "spearman":spearman(new,oldv),
                  "sign_agreement":sign,
              },
              "class_size_vs_score":{
                  "pearson":pearson(sizes,new),
                  "spearman":spearman(sizes,new),
              },
              "leave_one_class_out_influence":influence,
              "position_x_broad_bin_null":{
                  "replicates":10000,
                  "seed":20261009,
                  "null_mean_variance":secmean,
                  "p_value":secp,
                  "excess_ratio":secr,
              },
              "qb_vs_nonqb":{
                  "classes":qb,
                  "qb_share_vs_class_score_pearson":pearson(
                      [r["qb_share"] for r in qb],
                      [r["class_log_strength"] for r in qb],
                  ),
                  "qb_share_vs_class_score_spearman":spearman(
                      [r["qb_share"] for r in qb],
                      [r["class_log_strength"] for r in qb],
                  ),
              },
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False,
          }
          (W/"b13_non_gating_diagnostics.json").write_text(json.dumps(diag,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "continuity":diag["continuity_to_b6_2014_2023"],
              "class_size_vs_score":diag["class_size_vs_score"],
              "secondary_null":diag["position_x_broad_bin_null"],
          },indent=2))
          PY

