name: A-FA25R1 - Multi-Source Waiver Recommendation Intelligence (Preview / Apply)
# FA25 is a display-only upgrade of FA24. No private expert tables, paid CSVs, or FV/MV changes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run Preview first. Apply only after a green Preview."
        required: true
        type: choice
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  fa25-recommendation-research:
    name: Evidence-based waiver recommendations (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable production baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage source-pinned FA25 presentation and synthetic test files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,zlib
          payload = {
            'assets/fa_multisource_targets_v1.js': {'sha256':'dddb66d6c1ba82d00699b6e65e78d5bd81dc7e3100b6c27f6c692645aecb0cb1','zlib_b64':''},
            'assets/fa_multisource_targets_v1.css': {'sha256':'9af4bcc6fbe5505c0598a15370a76a4826c5719f276ba378f16aaf261454e65c','zlib_b64':''},
            '/tmp/fa25q/fixture.html': {'sha256':'b2b51620d7c6dac61a0b9cb08b09ca48f38fba89d6272c8a08f126cec7fefa0a','zlib_b64':''},
            '/tmp/fa25q/qa_fa24.py': {'sha256':'f8cc4f8d74237e8ac2b9198d3ca2090624a8f79ccbaae6456c5eff1b8b36e390','zlib_b64':''},
            '/tmp/fa25q/qa_fa25.py': {'sha256':'73660f9029eace13b6dafb145e50d1aaf624d7d6369c81b561b917b1ec18867d','zlib_b64':''},
            '/tmp/fa25q/qa_fa25_board.py': {'sha256':'5158aec4923f614fb323bc520c925842eeecbe7e131a50460a77e900da01e43f','zlib_b64':''},
            '/tmp/fa25q/fa_multisource_targets_v1.js': {'sha256':'dddb66d6c1ba82d00699b6e65e78d5bd81dc7e3100b6c27f6c692645aecb0cb1','zlib_b64':''},
            '/tmp/fa25q/fa_multisource_targets_v1.css': {'sha256':'9af4bcc6fbe5505c0598a15370a76a4826c5719f276ba378f16aaf261454e65c','zlib_b64':''},
          }
          old = {'assets/fa_multisource_targets_v1.js': '3e5e051fdbf1b349a1f294ee2bdd57fe03c1aa6a8d0531550b3f997ac44333a5', 'assets/fa_multisource_targets_v1.css': 'a44236a77fdd59e5b8b7f9bc0b576d479d1ffe088cb9871873b0c5e9d22ad019'}
          page=Path('free-agent-board.html')
          assert page.is_file(), 'Production Free Agent Board not found'
          html=page.read_text('utf-8')
          for token in ['FA24_MULTI_SOURCE_STYLE','FA24_MULTI_SOURCE_SCRIPT','FA22_4FOR4_PRIVATE_SCRIPT']:
              assert html.count(token)==1,'Expected prior integration missing/duplicate: '+token
          for name,item in payload.items():
              path=Path(name)
              data=zlib.decompress(base64.b64decode(item['zlib_b64']))
              assert hashlib.sha256(data).hexdigest()==item['sha256'],'Bad embedded payload: '+name
              path.parent.mkdir(parents=True,exist_ok=True)
              if name in old:
                  assert path.exists(),'Expected FA24 source missing: '+name
                  oldsum=hashlib.sha256(path.read_bytes()).hexdigest()
                  assert oldsum in (old[name],item['sha256']),'FA24 source diverged; manual review required: '+name
                  if oldsum != item['sha256']:path.write_bytes(data)
              else:path.write_bytes(data)
          print('PASS: staged FA25 UI changes, source-pinned and idempotent')
          PYCODE
      - name: Guard JavaScript validity, read-only privacy and restricted diff
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_multisource_targets_v1.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          js=Path('assets/fa_multisource_targets_v1.js').read_text('utf-8')
          html=Path('free-agent-board.html').read_text('utf-8')
          assert 'FA25R1' in js and 'function diagnose(' in js and 'fa25Category' in js
          assert js.count('fetch(')==1,'Unexpected additional network operation'
          assert 'const ROOT = \x27https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/main/\x27' in js
          for forbidden in ['XMLHttpRequest','sendBeacon','navigator.sendBeacon','localStorage','eval(','new Function(','.put(', 'window.location=']:
              assert forbidden not in js, 'Unexpected private storage, transmission or execution: '+forbidden
          assert "db.transaction(storeName,'readonly')" in js and 'req.transaction.abort()' in js
          assert "FA24_MULTI_SOURCE_SCRIPT" in html and "FA24_MULTI_SOURCE_STYLE" in html
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'assets/fa_multisource_targets_v1.js','assets/fa_multisource_targets_v1.css'}
          assert (changes|extra).issubset(allowed),'Unauthorized source change: '+str((changes|extra)-allowed)
          assert subprocess.run(['git','diff','--quiet','--','free-agent-board.html','index.html','data/','assets/fa_start_sit_v1.js','assets/fa_4for4_waiver_v1.js','assets/idp_intel_v1.js']).returncode==0
          print('PASS: no changes to values, historical studies, private subscription data or core lineup logic')
          PYCODE
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Chromium test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Verify multi-source categories, no-lookahead, privacy and mobile browser UI
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/fa25q/qa_fa25.py
      - name: Smoke test actual Free Agent Board with synthetic sources
        shell: bash
        env:
          FA25_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python /tmp/fa25q/qa_fa25_board.py
      - name: Upload synthetic-only browser evidence (even if red)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA25R1-Synthetic-Waiver-QA
          path: /tmp/fa25q/qa-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preview confirmation (no writes)
        if: ${{ inputs.mode == 'preview' }}
        run: |
          echo "FA25 preview passed. No source changes committed."
          echo "Next: rerun this workflow in Apply mode."
      - name: Apply only the verified FA25 UI source changes
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/fa_multisource_targets_v1.js assets/fa_multisource_targets_v1.css
          if git diff --cached --quiet; then
            echo "FA25 already applied. No source modifications."
          else
            git commit -m 'FA25: explain independent weekly waiver signals and opportunity risks'
            git push origin HEAD:main
          fi
          echo "FA25 applied: display-only, no subscription data or FV/MV writes."
