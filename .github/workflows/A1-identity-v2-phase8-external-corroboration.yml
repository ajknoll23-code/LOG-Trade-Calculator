name: A1 Identity V2 Phase 8 Refreshed External Corroboration Freeze

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase8:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact Phase 7 freeze and production state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          p7=D/"identity_v2_phase7_current_manual_review_refresh.json"
          m7=D/"identity_v2_phase7_manifest.json"

          r=json.loads(p7.read_text())
          m=json.loads(m7.read_text())

          assert r["decision"]=="PASS_IDENTITY_V2_PHASE7_AUTHORIZE_PHASE8_EXTERNAL_CORROBORATION"
          assert r["status"]=="CURRENT_MANUAL_REVIEW_REFRESH_FROZEN"
          assert r["current_manual_review_count"]==15
          assert r["persistent_phase2_hold_count"]==6
          assert r["new_manual_since_phase2_count"]==9
          assert all(r["hard_gates"].values())
          assert r["production_change_authorized"] is False
          assert r["production_crosswalk_mutated"] is False

          assert m["current_manual_review_count"]==15
          assert m["production_change_authorized"] is False
          assert m["production_changed"] is False
          assert hashlib.sha256(p7.read_bytes()).hexdigest()==(
              m["files"]["identity_v2_phase7_current_manual_review_refresh.json"]
          )

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          current={
              str(x["fantasypros_id"]):x
              for x in rows if x.get("requires_manual_review") is True
          }
          assert set(current)=={
              "15697","16427","16787","18168","18557",
              "20080","22887","23957","24181","25668",
              "26157","26397","26411","26440","26964"
          }

          print("PASS: exact Phase 7 frozen universe and current production state guarded.")
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Freeze Phase 8 preregistration and refreshed external evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          paths=[
              D/"identity_v2_phase8_preregistration.json",
              D/"identity_v2_phase8_external_evidence.json",
              D/"identity_v2_phase8_refreshed_external_corroboration.json",
              D/"identity_v2_phase8_refreshed_external_corroboration.md",
              D/"identity_v2_phase8_manifest.json",
          ]
          for p in paths:
              assert not p.exists(),f"refusing to overwrite {p}"

          prereg={
              "schema_version":1,
              "study_id":"identity-v2-phase8-refreshed-external-corroboration",
              "status":"FROZEN_BEFORE_CLASSIFICATION",
              "research_only":True,
              "production_change_authorized":False,
              "production_crosswalk_mutation_allowed":False,
              "scope":"The exact 15 current manual-review rows frozen by Phase 7.",
              "classification_rules":{
                  "official_release_waiver_ufa_or_departure_without_verified_new_destination":
                      "EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD",
                  "official_current_team_status_but_provider_candidate_team_missing":
                      "EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING",
                  "official_hybrid_position_does_not_resolve_provider_taxonomy":
                      "EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS"
              },
              "promotion_guardrails":[
                  "No external transaction/status evidence selects a Sleeper ID by itself.",
                  "Name plus position alone is still insufficient for production mapping.",
                  "A missing Sleeper team cannot be silently replaced by an external team inside the production resolver.",
                  "Hybrid OLB/EDGE evidence does not force LB or DL taxonomy.",
                  "Phase 8 cannot mutate scripts/identity_crosswalk.json."
              ],
              "next_step_rule":"Only a separately preregistered Phase 9 may investigate stable-ID or second-source corroboration for rows whose current team is independently established. Source-drift and free-agent rows remain held.",
              "expected_row_count":15
          }

          evidence={
              "schema_version":1,
              "study_id":"identity-v2-phase8-refreshed-external-corroboration",
              "status":"FROZEN_REFRESHED_EXTERNAL_EVIDENCE",
              "evidence_as_of":"2026-09-29",
              "research_only":True,
              "production_change_authorized":False,
              "rows":[
                {
                  "fantasypros_id":"18557","name":"Jake Browning",
                  "external_position":"QB",
                  "external_team_or_status":"Released by Tampa Bay on 2026-08-30; no verified later club destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.buccaneers.com/news/jake-browning-chris-braswell-among-cuts-as-bucs-get-roster-down-to-53",
                  "source_note":"Buccaneers officially released veteran QB Jake Browning at final cuts."
                },
                {
                  "fantasypros_id":"20080","name":"Desmond Ridder",
                  "external_position":"QB",
                  "external_team_or_status":"NFL player page lists UFA for 2026.",
                  "evidence_type":"official_nfl_player_status",
                  "source_url":"https://www.nfl.com/players/desmond-ridder/stats/logs/2026/",
                  "source_note":"NFL.com marks Ridder as UFA."
                },
                {
                  "fantasypros_id":"23957","name":"Xavier Weaver",
                  "external_position":"WR",
                  "external_team_or_status":"Arizona waived Weaver with an injury settlement on 2026-09-01; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.azcardinals.com/team/transactions/",
                  "source_note":"Cardinals transaction log records Weaver waived with injury settlement."
                },
                {
                  "fantasypros_id":"26440","name":"Devin Culp",
                  "external_position":"TE",
                  "external_team_or_status":"Tampa Bay signed Culp to practice squad on 2026-08-31 and released him on 2026-09-02.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.buccaneers.com/team/transactions/",
                  "source_note":"Buccaneers transaction log confirms the practice-squad add then release."
                },
                {
                  "fantasypros_id":"26157","name":"Jonah Elliss",
                  "external_position":"OLB",
                  "external_team_or_status":"Active Denver Broncos outside linebacker.",
                  "evidence_type":"official_team_roster_position",
                  "source_url":"https://www.denverbroncos.com/team/players-roster/jonah-elliss/career",
                  "source_note":"Denver officially lists Elliss as OLB; this remains a hybrid taxonomy label."
                },
                {
                  "fantasypros_id":"15697","name":"Elandon Roberts",
                  "external_position":"LB",
                  "external_team_or_status":"Pittsburgh released Roberts on 2026-08-30 after signing him earlier in August; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.steelers.com/news/steelers-make-moves-to-get-to-initial-2026-53-man-roster",
                  "source_note":"Steelers final-cut announcement lists LB Elandon Roberts among released veterans."
                },
                {
                  "fantasypros_id":"26964","name":"Terrell Jennings",
                  "external_position":"RB",
                  "external_team_or_status":"New England Patriots Reserve/Injured.",
                  "evidence_type":"official_team_roster_and_transaction",
                  "source_url":"https://www.patriots.com/team/transactions/2026",
                  "source_note":"Patriots placed Jennings on injured reserve on 2026-08-13; current official roster continues to list him on Reserve/Injured."
                },
                {
                  "fantasypros_id":"16427","name":"JuJu Smith-Schuster",
                  "external_position":"WR",
                  "external_team_or_status":"New York Giants terminated Smith-Schuster's contract on 2026-08-18; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.giants.com/news/najee-harris-signed-juju-smith-schuster-released-roster-move-steelers-chargers",
                  "source_note":"Giants officially released Smith-Schuster."
                },
                {
                  "fantasypros_id":"26397","name":"Tahj Washington",
                  "external_position":"WR",
                  "external_team_or_status":"Philadelphia waived Washington on 2026-08-30 after signing him on 2026-08-27; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.philadelphiaeagles.com/team/transactions/",
                  "source_note":"Eagles transaction log records both signing and final-cut waiver."
                },
                {
                  "fantasypros_id":"25668","name":"Malik Heath",
                  "external_position":"WR",
                  "external_team_or_status":"Atlanta's 2026 team preview lists Heath as an offseason departure; no verified current club destination in this freeze.",
                  "evidence_type":"official_team_departure",
                  "source_url":"https://www.atlantafalcons.com/news/falcons-2026-training-camp-preview-wide-receivers",
                  "source_note":"Falcons official preview lists Malik Heath among offseason departures."
                },
                {
                  "fantasypros_id":"22887","name":"Ja'Corey Brooks",
                  "external_position":"WR",
                  "external_team_or_status":"Washington released Brooks on 2026-06-02; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.commanders.com/team/transactions/",
                  "source_note":"Commanders transaction log records the release."
                },
                {
                  "fantasypros_id":"18168","name":"Malik Turner",
                  "external_position":"WR",
                  "external_team_or_status":"San Francisco released Turner on 2026-08-30; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.49ers.com/news/49ers-announce-moves-for-initial-53-man-roster-x1231",
                  "source_note":"49ers final roster cuts list Malik Turner among released players."
                },
                {
                  "fantasypros_id":"26411","name":"Tejhaun Palmer",
                  "external_position":"WR",
                  "external_team_or_status":"New England claimed Palmer on 2026-08-04 and released him on 2026-08-30; no verified later destination in this freeze.",
                  "evidence_type":"official_team_transaction",
                  "source_url":"https://www.patriots.com/team/transactions/2026",
                  "source_note":"Patriots transaction log captures both claim and final release."
                },
                {
                  "fantasypros_id":"16787","name":"Anthony Firkser",
                  "external_position":"TE",
                  "external_team_or_status":"Detroit released Firkser from injured reserve with an injury settlement on 2026-08-10; no verified later destination in this freeze.",
                  "evidence_type":"official_nfl_transaction_roundup",
                  "source_url":"https://www.nfl.com/news/nfl-news-roundup-latest-league-updates-from-monday-aug-10",
                  "source_note":"NFL.com transaction roundup records Firkser released from Detroit IR with injury settlement."
                },
                {
                  "fantasypros_id":"24181","name":"John FitzPatrick",
                  "external_position":"TE",
                  "external_team_or_status":"NFL player page lists UFA for 2026.",
                  "evidence_type":"official_nfl_player_status",
                  "source_url":"https://www.nfl.com/players/john-fitzpatrick/stats/logs/2026/",
                  "source_note":"NFL.com marks FitzPatrick as UFA."
                }
              ]
          }

          (D/"identity_v2_phase8_preregistration.json").write_text(
              json.dumps(prereg,indent=2,sort_keys=True)+"\n"
          )
          (D/"identity_v2_phase8_external_evidence.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Phase 8 preregistration and refreshed external evidence frozen.")
          PY

      - name: Classify exact 15-row current manual-review universe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib,json,subprocess
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          P7=D/"identity_v2_phase7_current_manual_review_refresh.json"
          PR=D/"identity_v2_phase8_preregistration.json"
          EV=D/"identity_v2_phase8_external_evidence.json"
          CROSS=Path("scripts/identity_crosswalk.json")

          p7=json.loads(P7.read_text())
          prereg=json.loads(PR.read_text())
          evidence=json.loads(EV.read_text())
          cross=json.loads(CROSS.read_text())

          manual={
              str(r["fantasypros_id"]):r
              for r in cross if r.get("requires_manual_review") is True
          }
          ev={str(r["fantasypros_id"]):r for r in evidence["rows"]}

          assert len(manual)==15
          assert len(ev)==15
          assert set(manual)==set(ev)
          assert set(manual)=={
              x["fantasypros_id"]
              for x in p7["persistent_phase2_holds"]
          } | {
              x["fantasypros_id"]
              for x in p7["new_manual_since_phase2"]
          }

          rows=[]
          for fpid in sorted(manual):
              cur=manual[fpid]
              ext=ev[fpid]
              assert cur["name"]==ext["name"],(fpid,cur["name"],ext["name"])

              if fpid=="26157":
                  classification="EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS"
                  assert ext["external_position"]=="OLB"
                  assert cur["match_method"]=="name_found_position_incompatible"
              elif fpid=="26964":
                  classification="EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING"
                  assert ext["external_position"]=="RB"
                  assert cur["fp_position"]=="RB"
                  assert cur["candidate_sleeper_id"]=="12412"
                  assert cur.get("sleeper_team") in (None,"")
              else:
                  classification="EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD"
                  assert cur["match_method"]=="unique_name_position_team_unavailable"

              rows.append({
                  "fantasypros_id":fpid,
                  "name":cur["name"],
                  "fp_position":cur["fp_position"],
                  "fp_team":cur.get("fp_team"),
                  "candidate_sleeper_id":cur.get("candidate_sleeper_id"),
                  "sleeper_team":cur.get("sleeper_team"),
                  "sleeper_pos":cur.get("sleeper_pos"),
                  "current_match_method":cur["match_method"],
                  "external_position":ext["external_position"],
                  "external_team_or_status":ext["external_team_or_status"],
                  "evidence_type":ext["evidence_type"],
                  "source_url":ext["source_url"],
                  "classification":classification,
                  "production_mapping_authorized":False
              })

          counts=Counter(r["classification"] for r in rows)
          assert counts=={
              "EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD":13,
              "EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING":1,
              "EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS":1
          },counts

          phase9_research_candidates=[
              r for r in rows
              if r["classification"]=="EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING"
          ]
          assert [r["fantasypros_id"] for r in phase9_research_candidates]==["26964"]

          decision="PASS_IDENTITY_V2_PHASE8_FREEZE_AUTHORIZE_PHASE9_SECOND_SOURCE_ID_CORROBORATION_TERRELL_JENNINGS_ONLY"

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase8-refreshed-external-corroboration",
              "status":"REFRESHED_EXTERNAL_CORROBORATION_FROZEN",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "production_crosswalk_mutated":False,
              "reviewed_row_count":len(rows),
              "classification_counts":dict(sorted(counts.items())),
              "rows":rows,
              "phase9_second_source_identity_candidate_fpids":["26964"],
              "phase9_candidate_guardrail":"Terrell Jennings is not approved for production mapping. Phase 9 may only seek stable-ID/second-source corroboration tying FPID 26964 to Sleeper SID 12412 without using name alone.",
              "persistent_taxonomy_holds":["26157"],
              "source_drift_holds":sorted(
                  r["fantasypros_id"] for r in rows
                  if r["classification"]=="EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD"
              ),
              "hard_gates":{
                  "exact_15_rows_reviewed":len(rows)==15,
                  "external_evidence_scope_exact":set(manual)==set(ev),
                  "classification_counts_exact":counts=={
                      "EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD":13,
                      "EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING":1,
                      "EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS":1
                  },
                  "only_terrell_jennings_advances_to_second_source_research":
                      [r["fantasypros_id"] for r in phase9_research_candidates]==["26964"],
                  "jonah_elliss_remains_held":any(
                      r["fantasypros_id"]=="26157"
                      and r["classification"]=="EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS"
                      for r in rows
                  ),
                  "no_production_mapping_authorized":all(
                      r["production_mapping_authorized"] is False for r in rows
                  ),
                  "production_unchanged":True
              },
              "next_step_rule":"Phase 9 may research only whether an independent stable-ID source can link Terrell Jennings FPID 26964 to Sleeper SID 12412. The other 14 rows remain held. No production deployment is authorized."
          }
          assert all(result["hard_gates"].values())

          out=D/"identity_v2_phase8_refreshed_external_corroboration.json"
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 8 — Refreshed External Corroboration",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Rows reviewed: **15/15**",
              "- Source-drift/free-agent holds: **13**",
              "- Current team known but provider-team evidence missing: **1** (Terrell Jennings)",
              "- Position-taxonomy ambiguity: **1** (Jonah Elliss)",
              "- Production mappings authorized: **0**",
              "",
              "## Classification",
              "",
              "| FPID | Player | Classification | External status |",
              "|---|---|---|---|"
          ]
          for r in rows:
              lines.append(
                  f"| {r['fantasypros_id']} | {r['name']} | "
                  f"`{r['classification']}` | {r['external_team_or_status']} |"
              )
          lines += [
              "",
              "Terrell Jennings advances only to a second-source stable-ID corroboration study. His current team evidence does not itself authorize mapping Sleeper SID 12412.",
              "",
              "Jonah Elliss remains held because Denver's official OLB taxonomy is hybrid and does not scientifically resolve FantasyPros LB versus Sleeper DL.",
              ""
          ]
          (D/"identity_v2_phase8_refreshed_external_corroboration.md").write_text(
              "\n".join(lines)+"\n"
          )
          print("\n".join(lines[:18]))
          PY

      - name: Validate Phase 8 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          r=json.loads(
              (D/"identity_v2_phase8_refreshed_external_corroboration.json").read_text()
          )

          assert r["decision"]==(
              "PASS_IDENTITY_V2_PHASE8_FREEZE_AUTHORIZE_PHASE9_"
              "SECOND_SOURCE_ID_CORROBORATION_TERRELL_JENNINGS_ONLY"
          )
          assert r["reviewed_row_count"]==15
          assert r["classification_counts"]=={
              "EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING":1,
              "EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS":1,
              "EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD":13
          }
          assert r["phase9_second_source_identity_candidate_fpids"]==["26964"]
          assert r["persistent_taxonomy_holds"]==["26157"]
          assert all(r["hard_gates"].values())
          assert r["production_change_authorized"] is False
          assert r["production_crosswalk_mutated"] is False
          print("PASS: Phase 8 result contract validated.")
          PY

      - name: Freeze Phase 8 manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          D=Path("research/identity-v2")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=json.loads(
              (D/"identity_v2_phase8_refreshed_external_corroboration.json").read_text()
          )
          files=[
              "identity_v2_phase8_preregistration.json",
              "identity_v2_phase8_external_evidence.json",
              "identity_v2_phase8_refreshed_external_corroboration.json",
              "identity_v2_phase8_refreshed_external_corroboration.md"
          ]
          m={
              "schema_version":1,
              "study_id":"identity-v2-phase8-refreshed-external-corroboration",
              "decision":r["decision"],
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "files":{f:sha(D/f) for f in files},
              "production_change_authorized":False,
              "production_changed":False
          }
          (D/"identity_v2_phase8_manifest.json").write_text(
              json.dumps(m,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: Phase 8 manifest frozen.")
          PY

      - name: Prove research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/identity-v2/identity_v2_phase8_preregistration.json",
              "research/identity-v2/identity_v2_phase8_external_evidence.json",
              "research/identity-v2/identity_v2_phase8_refreshed_external_corroboration.json",
              "research/identity-v2/identity_v2_phase8_refreshed_external_corroboration.md",
              "research/identity-v2/identity_v2_phase8_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "scripts/identity_crosswalk.json" not in touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: Phase 8 is research-only.")
          PY

      - name: Postflight regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit Phase 8 research artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during Phase 8."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase8_preregistration.json \
            research/identity-v2/identity_v2_phase8_external_evidence.json \
            research/identity-v2/identity_v2_phase8_refreshed_external_corroboration.json \
            research/identity-v2/identity_v2_phase8_refreshed_external_corroboration.md \
            research/identity-v2/identity_v2_phase8_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no Phase 8 artifacts staged."
            exit 1
          }

          git commit -m "Freeze Identity V2 Phase 8 refreshed external corroboration"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: Phase 8 committed; production unchanged."
