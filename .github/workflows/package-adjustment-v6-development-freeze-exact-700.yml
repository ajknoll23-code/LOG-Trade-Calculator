      - name: Prove exactly two intended research files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v6/development_exact_700_frozen_v1.json",
              "research/package-adjustment-v6/development_exact_700_freeze_manifest_v1.json",
          }
          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          actual = {line[3:] for line in lines if line.strip()}
          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )
          print("PASS: only the two intended frozen V6 research files changed.")
          PY

      - name: Upload exact-700 freeze proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v6-development-exact-700-freeze-proof
          path: |
            research/package-adjustment-v6/development_exact_700_frozen_v1.json
            research/package-adjustment-v6/development_exact_700_freeze_manifest_v1.json
            /tmp/package_adjustment_v6_exact_700_freeze_report.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact-700 V6 development freeze to main
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          DATA="$D/development_exact_700_frozen_v1.json"
          MANIFEST="$D/development_exact_700_freeze_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$DATA" "$MANIFEST"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=("$DATA" "$MANIFEST")
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#STAGED[@]}" -eq 2
          test "$(printf '%s\n' "${STAGED[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m "Freeze Package Adjustment V6 development evidence at exact 700"
          git pull --rebase origin main

          test "$(git hash-object "$D/development_preregistration_v1.json")" = "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/development_vote_release_v1.json")" = "5e53ff9fdb795fff30ab6235a3a5ee969f313fd2"
          test "$(git hash-object "$D/package_vote_challenges_v6.json")" = "afc3f4e5a75f3599c11482361073c4bd9559e342"

          mapfile -t COMMITTED < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "${#COMMITTED[@]}" -eq 2
          test "$(printf '%s\n' "${COMMITTED[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git push origin main
          echo "PASS: exact-700 V6 development evidence frozen and committed to main."
