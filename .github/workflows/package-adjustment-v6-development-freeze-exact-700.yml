name: Package Adjustment V6 Development Freeze Exact 700

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install freeze dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen V6 contract and unused freeze surface
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          DATA="$D/development_exact_700_frozen_v1.json"
          MANIFEST="$D/development_exact_700_freeze_manifest_v1.json"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/development_preregistration_v1.json")" = "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/development_vote_release_v1.json")" = "5e53ff9fdb795fff30ab6235a3a5ee969f313fd2"
          test "$(git hash-object "$D/package_vote_challenges_v6.json")" = "afc3f4e5a75f3599c11482361073c4bd9559e342"

          test ! -e "$DATA"
          test ! -e "$MANIFEST"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          prereg = json.loads((d / "development_preregistration_v1.json").read_text())
          release = json.loads((d / "development_vote_release_v1.json").read_text())
          catalog = json.loads((d / "package_vote_challenges_v6.json").read_text())

          assert prereg["status"] == "frozen_v6_development_preregistration"
          assert prereg["frozen"] is True
          seq = prereg["required_sequence_after_this_freeze"]
          assert seq[4] == "freeze_exact_development_evidence"
          assert seq[5] == "implement_C0_C1_C2_C4_C5_evaluator_with_shared_probability_layer"

          stop = prereg["development_maturity_and_stopping"]
          assert stop["outcome_blind_coverage_only"] is True
          assert stop["first_effective_vote_checkpoint"] == 600
          assert stop["coverage_retry_increment"] == 100
          assert stop["hard_cap_effective_votes"] == 800
          assert stop["minimum_distinct_voters"] == 30
          assert stop["minimum_effective_votes_per_cell"] == 15
          assert stop["minimum_distinct_voters_per_cell"] == 10
          assert stop["required_cell_count"] == 24
          assert stop["daily_valid_vote_cap_per_voter"] == 20
          assert stop["effective_lifetime_vote_cap_per_voter"] == 30

          assert release["status"] == "package_adjustment_v6_development_vote_release"
          assert release["frozen"] is True
          assert release["production_revision"] == "v1.6-v5-size2-composition-overlay"
          assert release["production_change_authorized"] is False
          assert release["catalog_challenge_count"] == 504
          assert release["catalog_research_cell_count"] == 24
          assert release["catalog_target_count"] == 21
          assert release["transport"]["keep_prefix"] == "__pkgv6__|"
          assert release["transport"]["meta_prefix"] == "__pkgv6_meta__|"
          assert release["transport"]["schema_marker"] == "__pkgv6_schema__|6"
          assert release["transport"]["canonical_choices"] == ["T", "P"]
          assert release["transport"]["canonical_left_sides"] == ["T", "P"]

          assert catalog["catalog_diagnostics"]["challenge_count"] == 504
          assert catalog["catalog_diagnostics"]["research_cell_count"] == 24
          assert catalog["catalog_diagnostics"]["target_count"] == 21
          assert len(catalog["challenges"]) == 504
          assert all(c["schema_version"] == 6 for c in catalog["challenges"])

          print("PASS: frozen V6 contract is unchanged and exact-700 freeze surface is unused.")
          PY

      - name: Verify production remains V1.6 before freeze
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Freeze exact 700-effective-vote development checkpoint
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          D = Path("research/package-adjustment-v6")
          DATA_PATH = D / "development_exact_700_frozen_v1.json"
          MANIFEST_PATH = D / "development_exact_700_freeze_manifest_v1.json"
          REPORT_PATH = Path("/tmp/package_adjustment_v6_exact_700_freeze_report.md")

          SHEET_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          MATURITY_RUN_ID = 35578750108
          MATURITY_ARTIFACT_ID = 10629610338
          MATURITY_ARTIFACT_ZIP_SHA256 = "6fc0b726437bc9a8054e488ffacad7d09f8fc2e327a03cd4ef23a047c41a4767"
          MATURITY_ANCHOR_UTC = "2026-09-21T08:36:21.821054+00:00"
          MATURITY_HEAD_SHA = "4af5db9d86158a291ded28a96449fe9b7c489956"

          EXPECTED_ANCHORED_RAW_NAMESPACE_ROWS = 739
          EXPECTED_ANCHORED_VALID_POST_DAILY_CAP = 739
          EXPECTED_ANCHORED_EFFECTIVE = 709.0
          EXPECTED_ANCHORED_DISTINCT_VOTERS = 34
          EXPECTED_ANCHORED_DISTINCT_CHALLENGES = 386
          EXPECTED_ANCHORED_CELLS_OBSERVED = 24
          EXPECTED_ANCHORED_CELLS_PASSING = 24
          EXPECTED_ANCHORED_MIN_CELL_EFFECTIVE = 22.5
          EXPECTED_ANCHORED_MIN_CELL_VOTERS = 15

          EXPECTED_CP600_DISTINCT_VOTERS = 29
          EXPECTED_CP600_CELLS_PASSING = 24
          EXPECTED_CP600_MIN_CELL_EFFECTIVE = 16.5
          EXPECTED_CP600_MIN_CELL_VOTERS = 13

          EXPECTED_CP700_DISTINCT_VOTERS = 34
          EXPECTED_CP700_CELLS_PASSING = 24
          EXPECTED_CP700_MIN_CELL_EFFECTIVE = 21.5
          EXPECTED_CP700_MIN_CELL_VOTERS = 15

          prereg_path = D / "development_preregistration_v1.json"
          release_path = D / "development_vote_release_v1.json"
          catalog_path = D / "package_vote_challenges_v6.json"

          prereg = json.loads(prereg_path.read_text())
          release = json.loads(release_path.read_text())
          catalog_doc = json.loads(catalog_path.read_text())

          stop = prereg["development_maturity_and_stopping"]
          transport = release["transport"]

          VOTE_PREFIX = transport["keep_prefix"]
          META_PREFIX = transport["meta_prefix"]
          SCHEMA_MARKER = transport["schema_marker"]
          DAILY_CAP = int(stop["daily_valid_vote_cap_per_voter"])
          LIFETIME_CAP = int(stop["effective_lifetime_vote_cap_per_voter"])
          MIN_VOTERS = int(stop["minimum_distinct_voters"])
          MIN_CELL_EFFECTIVE = float(stop["minimum_effective_votes_per_cell"])
          MIN_CELL_VOTERS = int(stop["minimum_distinct_voters_per_cell"])

          def parse_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          cutoff = parse_utc(release["released_at_utc"])
          maturity_anchor = parse_utc(MATURITY_ANCHOR_UTC)
          assert cutoff is not None and maturity_anchor is not None
          assert maturity_anchor > cutoff

          challenges = {c["id"]: c for c in catalog_doc["challenges"]}
          assert len(challenges) == 504

          cell_meta = {}
          for challenge in challenges.values():
              key = challenge["research_cell"]
              meta = {
                  "research_cell": key,
                  "composition_profile": challenge["component_profile"]["label"],
                  "apex_piece_to_target_target": float(challenge["apex_piece_to_target_target"]),
              }
              if key in cell_meta:
                  assert cell_meta[key] == meta
              else:
                  cell_meta[key] = meta
          assert len(cell_meta) == 24

          frozen_at = datetime.now(timezone.utc)
          response = requests.get(SHEET_URL, timeout=30)
          response.raise_for_status()
          content_type = str(response.headers.get("content-type") or "").lower()
          if "text/html" in content_type or "<html" in response.text[:500].lower():
              raise RuntimeError("sheet export returned HTML instead of CSV")

          sheet_sha256 = hashlib.sha256(response.content).hexdigest()
          rows = list(csv.DictReader(io.StringIO(response.text)))
          if not rows:
              raise RuntimeError("sheet export contains no data rows")

          required_columns = {"timestamp", "voter_roster_id", "keep", "trade", "cut"}
          missing_columns = required_columns - set(rows[0].keys())
          if missing_columns:
              raise RuntimeError(f"sheet missing required columns: {sorted(missing_columns)}")

          total_namespace_rows_at_fetch = 0
          anchored_namespace_rows = 0
          rows_after_maturity_anchor = 0
          anchored_excluded = Counter()
          structurally_valid = []

          for source_index, row in enumerate(rows):
              keep = str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue
              total_namespace_rows_at_fetch += 1

              ts = parse_utc(row.get("timestamp"))
              if ts is None:
                  anchored_excluded["invalid_timestamp"] += 1
                  continue
              if ts > maturity_anchor:
                  rows_after_maturity_anchor += 1
                  continue

              anchored_namespace_rows += 1

              if ts <= cutoff:
                  anchored_excluded["pre_release_or_at_cutoff"] += 1
                  continue

              voter = str(row.get("voter_roster_id") or "").strip()
              if not voter:
                  anchored_excluded["missing_voter_id"] += 1
                  continue

              payload = keep[len(VOTE_PREFIX):]
              if "|" not in payload:
                  anchored_excluded["malformed_vote_transport"] += 1
                  continue
              challenge_id = payload.split("|", 1)[0].strip()
              if challenge_id not in challenges:
                  anchored_excluded["unknown_challenge_id"] += 1
                  continue

              trade = str(row.get("trade") or "")
              if not trade.startswith(META_PREFIX):
                  anchored_excluded["invalid_meta_namespace"] += 1
                  continue

              cut = str(row.get("cut") or "")
              if cut != SCHEMA_MARKER:
                  anchored_excluded["invalid_schema_marker"] += 1
                  continue

              structurally_valid.append({
                  "timestamp": ts,
                  "timestamp_raw": str(row.get("timestamp") or ""),
                  "source_index": source_index,
                  "source_row_number": source_index + 2,
                  "voter": voter,
                  "challenge_id": challenge_id,
                  "keep_raw": keep,
                  "trade_raw": trade,
                  "cut_raw": cut,
              })

          structurally_valid.sort(key=lambda r: (r["timestamp"], r["source_index"]))

          daily_counts = Counter()
          valid = []
          for row in structurally_valid:
              day = row["timestamp"].date().isoformat()
              key = (row["voter"], day)
              if daily_counts[key] >= DAILY_CAP:
                  anchored_excluded["daily_cap_excess"] += 1
                  continue
              daily_counts[key] += 1
              valid.append(row)

          def snapshot(rows_subset):
              voter_counts = Counter(r["voter"] for r in rows_subset)
              weights = {
                  voter: min(1.0, LIFETIME_CAP / count)
                  for voter, count in voter_counts.items()
              }

              per_cell_effective = {key: 0.0 for key in cell_meta}
              per_cell_voters = {key: set() for key in cell_meta}
              challenge_ids = set()

              for row in rows_subset:
                  challenge = challenges[row["challenge_id"]]
                  key = challenge["research_cell"]
                  weight = weights[row["voter"]]
                  per_cell_effective[key] += weight
                  per_cell_voters[key].add(row["voter"])
                  challenge_ids.add(row["challenge_id"])

              cells = []
              for key in sorted(cell_meta):
                  eff = per_cell_effective[key]
                  voters = len(per_cell_voters[key])
                  meta = cell_meta[key]
                  cells.append({
                      **meta,
                      "effective_votes": round(float(eff), 6),
                      "distinct_voters": voters,
                      "effective_vote_gate_pass": eff + 1e-12 >= MIN_CELL_EFFECTIVE,
                      "voter_gate_pass": voters >= MIN_CELL_VOTERS,
                      "cell_gate_pass": (
                          eff + 1e-12 >= MIN_CELL_EFFECTIVE
                          and voters >= MIN_CELL_VOTERS
                      ),
                  })

              effective_total = sum(min(count, LIFETIME_CAP) for count in voter_counts.values())
              return {
                  "raw_post_daily_cap_ballots": len(rows_subset),
                  "effective_votes": round(float(effective_total), 6),
                  "distinct_voters": len(voter_counts),
                  "distinct_challenges": len(challenge_ids),
                  "cells_observed": sum(c["effective_votes"] > 0 for c in cells),
                  "cells_passing_both_gates": sum(c["cell_gate_pass"] for c in cells),
                  "minimum_cell_effective_votes": round(min(c["effective_votes"] for c in cells), 6),
                  "minimum_cell_distinct_voters": min(c["distinct_voters"] for c in cells),
                  "coverage_gates_pass": (
                      len(voter_counts) >= MIN_VOTERS
                      and all(c["cell_gate_pass"] for c in cells)
                  ),
                  "cells": cells,
              }

          def exact_checkpoint_prefix(threshold):
              counts = Counter()
              running = 0
              for idx, row in enumerate(valid):
                  voter = row["voter"]
                  before = min(counts[voter], LIFETIME_CAP)
                  counts[voter] += 1
                  after = min(counts[voter], LIFETIME_CAP)
                  running += after - before
                  if running == threshold:
                      return valid[: idx + 1]
                  if running > threshold:
                      raise RuntimeError(f"effective count skipped exact checkpoint {threshold}")
              return None

          anchored_current = snapshot(valid)

          assert anchored_namespace_rows == EXPECTED_ANCHORED_RAW_NAMESPACE_ROWS
          assert len(valid) == EXPECTED_ANCHORED_VALID_POST_DAILY_CAP
          assert anchored_current["effective_votes"] == EXPECTED_ANCHORED_EFFECTIVE
          assert anchored_current["distinct_voters"] == EXPECTED_ANCHORED_DISTINCT_VOTERS
          assert anchored_current["distinct_challenges"] == EXPECTED_ANCHORED_DISTINCT_CHALLENGES
          assert anchored_current["cells_observed"] == EXPECTED_ANCHORED_CELLS_OBSERVED
          assert anchored_current["cells_passing_both_gates"] == EXPECTED_ANCHORED_CELLS_PASSING
          assert anchored_current["minimum_cell_effective_votes"] == EXPECTED_ANCHORED_MIN_CELL_EFFECTIVE
          assert anchored_current["minimum_cell_distinct_voters"] == EXPECTED_ANCHORED_MIN_CELL_VOTERS
          assert not anchored_excluded, anchored_excluded

          cp600_rows = exact_checkpoint_prefix(600)
          cp700_rows = exact_checkpoint_prefix(700)
          if cp600_rows is None or cp700_rows is None:
              raise RuntimeError("required exact checkpoint prefix could not be reconstructed")

          cp600 = snapshot(cp600_rows)
          cp700 = snapshot(cp700_rows)

          assert cp600["effective_votes"] == 600.0
          assert cp600["distinct_voters"] == EXPECTED_CP600_DISTINCT_VOTERS
          assert cp600["cells_passing_both_gates"] == EXPECTED_CP600_CELLS_PASSING
          assert cp600["minimum_cell_effective_votes"] == EXPECTED_CP600_MIN_CELL_EFFECTIVE
          assert cp600["minimum_cell_distinct_voters"] == EXPECTED_CP600_MIN_CELL_VOTERS
          assert cp600["coverage_gates_pass"] is False

          assert cp700["effective_votes"] == 700.0
          assert cp700["distinct_voters"] == EXPECTED_CP700_DISTINCT_VOTERS
          assert cp700["cells_observed"] == 24
          assert cp700["cells_passing_both_gates"] == EXPECTED_CP700_CELLS_PASSING
          assert cp700["minimum_cell_effective_votes"] == EXPECTED_CP700_MIN_CELL_EFFECTIVE
          assert cp700["minimum_cell_distinct_voters"] == EXPECTED_CP700_MIN_CELL_VOTERS
          assert cp700["coverage_gates_pass"] is True

          voter_counts = Counter(r["voter"] for r in cp700_rows)
          frozen_weights = {
              voter: min(1.0, LIFETIME_CAP / count)
              for voter, count in voter_counts.items()
          }

          voter_cluster_map = {}
          ballots = []
          source_commitment_rows = []

          for ordinal, row in enumerate(cp700_rows, start=1):
              voter = row["voter"]
              if voter not in voter_cluster_map:
                  voter_cluster_map[voter] = f"v{len(voter_cluster_map) + 1:02d}"

              payload = row["keep_raw"][len(VOTE_PREFIX):]
              challenge_id, sep, choice = payload.partition("|")
              if not sep or challenge_id != row["challenge_id"] or choice not in {"T", "P"}:
                  raise RuntimeError(f"invalid frozen response token at source row {row['source_row_number']}")

              display_left = row["trade_raw"][len(META_PREFIX):]
              if display_left not in {"T", "P"}:
                  raise RuntimeError(f"invalid frozen display orientation at source row {row['source_row_number']}")

              challenge = challenges[challenge_id]
              cluster = voter_cluster_map[voter]
              weight = float(frozen_weights[voter])

              ballots.append({
                  "ordinal": ordinal,
                  "source_row_number": row["source_row_number"],
                  "timestamp_utc": row["timestamp"].isoformat(),
                  "voter_cluster": cluster,
                  "challenge_id": challenge_id,
                  "research_cell": challenge["research_cell"],
                  "composition_profile": challenge["component_profile"]["label"],
                  "apex_piece_to_target_target": float(challenge["apex_piece_to_target_target"]),
                  "frozen_ballot_weight": weight,
                  "human_choice": choice,
                  "display_left": display_left,
                  "package_preferred": choice == "P",
                  "package_displayed_left": display_left == "P",
              })

              source_commitment_rows.append({
                  "source_index": row["source_index"],
                  "timestamp_raw": row["timestamp_raw"],
                  "voter": voter,
                  "keep": row["keep_raw"],
                  "trade": row["trade_raw"],
                  "cut": row["cut_raw"],
              })

          assert len(voter_cluster_map) == EXPECTED_CP700_DISTINCT_VOTERS
          assert abs(sum(b["frozen_ballot_weight"] for b in ballots) - 700.0) < 1e-8

          source_commitment_sha256 = hashlib.sha256(
              json.dumps(
                  source_commitment_rows,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
          ).hexdigest()

          dataset = {
              "schema_version": 1,
              "status": "frozen_exact_700_v6_development_evidence",
              "frozen": True,
              "research_only": True,
              "production_changed": False,
              "model_evaluation_performed": False,
              "checkpoint_selection_outcome_blind": True,
              "checkpoint_effective_votes": 700,
              "valid_ballot_start_utc": cutoff.isoformat(),
              "maturity_anchor_utc": maturity_anchor.isoformat(),
              "ballot_weight_rule": "min(1,30/valid_post_daily_cap_V6_ballot_count_for_voter)",
              "raw_checkpoint_ballot_count": len(ballots),
              "distinct_voter_clusters": len(voter_cluster_map),
              "frozen_effective_votes": 700.0,
              "ballots": ballots,
          }

          dataset_text = json.dumps(dataset, indent=2, sort_keys=True) + "\n"
          DATA_PATH.write_text(dataset_text, encoding="utf-8")
          dataset_sha256 = hashlib.sha256(dataset_text.encode("utf-8")).hexdigest()

          def file_sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "schema_version": 1,
              "status": "frozen_exact_700_v6_development_evidence_manifest",
              "frozen": True,
              "research_only": True,
              "production_change_authorized": False,
              "model_evaluation_performed": False,
              "frozen_at_utc": frozen_at.isoformat(),
              "github_source_commit": os.environ.get("GITHUB_SHA"),
              "maturity_anchor": {
                  "workflow_run_id": MATURITY_RUN_ID,
                  "artifact_id": MATURITY_ARTIFACT_ID,
                  "artifact_zip_sha256": MATURITY_ARTIFACT_ZIP_SHA256,
                  "head_sha": MATURITY_HEAD_SHA,
                  "status": "STOP_AND_FREEZE_AT_700",
                  "generated_at_utc": maturity_anchor.isoformat(),
                  "raw_v6_namespace_rows": EXPECTED_ANCHORED_RAW_NAMESPACE_ROWS,
                  "valid_post_daily_cap_ballots": EXPECTED_ANCHORED_VALID_POST_DAILY_CAP,
                  "effective_votes": EXPECTED_ANCHORED_EFFECTIVE,
                  "distinct_voters": EXPECTED_ANCHORED_DISTINCT_VOTERS,
                  "distinct_challenges": EXPECTED_ANCHORED_DISTINCT_CHALLENGES,
                  "cells_observed": EXPECTED_ANCHORED_CELLS_OBSERVED,
                  "cells_passing_both_gates": EXPECTED_ANCHORED_CELLS_PASSING,
                  "minimum_cell_effective_votes": EXPECTED_ANCHORED_MIN_CELL_EFFECTIVE,
                  "minimum_cell_distinct_voters": EXPECTED_ANCHORED_MIN_CELL_VOTERS,
              },
              "frozen_contract": {
                  "preregistration": {
                      "path": str(prereg_path),
                      "git_blob_sha": "81f20cb8afd78f624153c3337377f56ebf8115ae",
                      "sha256": file_sha256(prereg_path),
                  },
                  "vote_release": {
                      "path": str(release_path),
                      "git_blob_sha": "5e53ff9fdb795fff30ab6235a3a5ee969f313fd2",
                      "sha256": file_sha256(release_path),
                  },
                  "development_catalog": {
                      "path": str(catalog_path),
                      "git_blob_sha": "afc3f4e5a75f3599c11482361073c4bd9559e342",
                      "sha256": file_sha256(catalog_path),
                  },
              },
              "source_sheet": {
                  "sha256_at_freeze_fetch": sheet_sha256,
                  "total_csv_data_rows_at_fetch": len(rows),
                  "v6_namespace_rows_at_fetch": total_namespace_rows_at_fetch,
                  "v6_rows_after_maturity_anchor_ignored": rows_after_maturity_anchor,
                  "anchored_v6_namespace_rows": anchored_namespace_rows,
                  "anchored_excluded_row_counts": dict(sorted(anchored_excluded.items())),
                  "anchored_valid_post_daily_cap_ballots": len(valid),
                  "frozen_checkpoint_source_commitment_sha256": source_commitment_sha256,
              },
              "checkpoint_600": {
                  "effective_votes": cp600["effective_votes"],
                  "distinct_voters": cp600["distinct_voters"],
                  "distinct_challenges": cp600["distinct_challenges"],
                  "cells_passing_both_gates": cp600["cells_passing_both_gates"],
                  "minimum_cell_effective_votes": cp600["minimum_cell_effective_votes"],
                  "minimum_cell_distinct_voters": cp600["minimum_cell_distinct_voters"],
                  "coverage_gates_pass": cp600["coverage_gates_pass"],
              },
              "checkpoint_700": {
                  "effective_votes": cp700["effective_votes"],
                  "raw_post_daily_cap_ballots": cp700["raw_post_daily_cap_ballots"],
                  "distinct_voters": cp700["distinct_voters"],
                  "distinct_challenges": cp700["distinct_challenges"],
                  "cells_observed": cp700["cells_observed"],
                  "cells_passing_both_gates": cp700["cells_passing_both_gates"],
                  "minimum_cell_effective_votes": cp700["minimum_cell_effective_votes"],
                  "minimum_cell_distinct_voters": cp700["minimum_cell_distinct_voters"],
                  "coverage_gates_pass": cp700["coverage_gates_pass"],
                  "post_checkpoint_anchored_valid_rows_excluded": len(valid) - len(cp700_rows),
                  "cells": cp700["cells"],
              },
              "dataset": {
                  "path": str(DATA_PATH),
                  "sha256": dataset_sha256,
                  "byte_length": len(dataset_text.encode("utf-8")),
                  "raw_ballot_count": len(ballots),
                  "effective_vote_count": 700.0,
                  "voter_cluster_count": len(voter_cluster_map),
                  "contains_human_choice": True,
                  "contains_display_orientation": True,
                  "contains_model_predictions": False,
                  "contains_model_performance_statistics": False,
                  "contains_raw_voter_identifiers": False,
              },
              "next_action": (
                  "Implement the preregistered C0/C1/C2/C4/C5 evaluator with the shared probability layer, "
                  "then run grouped challenge CV and property tests using only this frozen development dataset."
              ),
          }

          MANIFEST_PATH.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          report = "\n".join([
              "# Package Adjustment V6 Exact-700 Development Freeze",
              "",
              "**Status:** `FROZEN_EXACT_700`",
              "",
              f"- Maturity run: **{MATURITY_RUN_ID}**",
              f"- Maturity anchor: `{maturity_anchor.isoformat()}`",
              f"- Frozen raw checkpoint ballots: **{len(ballots)}**",
              "- Frozen effective votes: **700.00**",
              f"- Distinct voter clusters: **{len(voter_cluster_map)}**",
              f"- Distinct challenges in checkpoint: **{cp700['distinct_challenges']}**",
              "- Cells passing both gates: **24 / 24**",
              f"- Minimum cell effective votes: **{cp700['minimum_cell_effective_votes']:.2f}**",
              f"- Minimum cell voters: **{cp700['minimum_cell_distinct_voters']}**",
              f"- Anchored valid rows after checkpoint excluded: **{len(valid) - len(cp700_rows)}**",
              f"- Later V6 rows after maturity anchor ignored: **{rows_after_maturity_anchor}**",
              f"- Frozen dataset SHA-256: `{dataset_sha256}`",
              f"- Source commitment SHA-256: `{source_commitment_sha256}`",
              "",
              "No C0/C1/C2/C4/C5 prediction, loss, model comparison, candidate fit, or significance test was computed.",
              "",
              "Next action: implement and run the preregistered development evaluator using only the committed frozen exact-700 dataset.",
              "",
          ])
          REPORT_PATH.write_text(report, encoding="utf-8")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(report)

          print(report)
          PY

      - name: Verify freeze artifacts contain no model evaluation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          data_path = d / "development_exact_700_frozen_v1.json"
          manifest_path = d / "development_exact_700_freeze_manifest_v1.json"
          data = json.loads(data_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          assert data["frozen"] is True
          assert data["checkpoint_selection_outcome_blind"] is True
          assert data["model_evaluation_performed"] is False
          assert data["checkpoint_effective_votes"] == 700
          assert data["frozen_effective_votes"] == 700.0
          assert data["distinct_voter_clusters"] == 34
          assert abs(sum(x["frozen_ballot_weight"] for x in data["ballots"]) - 700.0) < 1e-8
          assert {x["human_choice"] for x in data["ballots"]} <= {"T", "P"}
          assert {x["display_left"] for x in data["ballots"]} <= {"T", "P"}
          assert len({x["voter_cluster"] for x in data["ballots"]}) == 34

          assert manifest["status"] == "frozen_exact_700_v6_development_evidence_manifest"
          assert manifest["model_evaluation_performed"] is False
          assert manifest["checkpoint_600"]["coverage_gates_pass"] is False
          assert manifest["checkpoint_700"]["coverage_gates_pass"] is True
          assert manifest["checkpoint_700"]["cells_passing_both_gates"] == 24
          assert manifest["dataset"]["sha256"] == hashlib.sha256(data_path.read_bytes()).hexdigest()
          assert manifest["dataset"]["contains_model_predictions"] is False
          assert manifest["dataset"]["contains_model_performance_statistics"] is False
          assert manifest["dataset"]["contains_raw_voter_identifiers"] is False

          data_text = data_path.read_text().lower()
          for token in [
              '"c0_prediction"',
              '"c1_prediction"',
              '"c2_prediction"',
              '"c4_prediction"',
              '"c5_prediction"',
              "log_loss",
              "bootstrap",
              "model_winner",
              "candidate_selected",
              "significance",
          ]:
              assert token not in data_text, token

          print("PASS: exact-700 V6 development evidence is frozen; no model evaluation was performed.")
          PY

