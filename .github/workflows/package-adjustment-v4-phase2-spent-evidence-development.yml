name: Package Adjustment V4 - Phase 2 Spent-Evidence Development

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "scipy==1.16.2" "requests==2.34.2"

      - name: Guard frozen V4 Phase 1 and spent V3 evidence
        shell: bash
        run: |
          set -euo pipefail

          V4="research/package-adjustment-v4-elite-fragmentation"
          V3="research/package-adjustment-v3-ktc-style"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V4/package_adjustment_v4_phase2_develop.py")" = "f3a2e2ca1be164ad535a09d93d2fd0f2c070a4aa"
          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/phase1_manifest.json")" = "37fff17e89237aad3e40539a4835b5eaf5163781"

          test "$(git hash-object "$V3/phase3_confirmation_catalog.json")" = "3d4615e590697341ee8c27785d8b22e16b82ac44"
          test "$(git hash-object "$V3/phase3_exact_600_frozen.json")" = "bf4779cadbfefdb694c1d028d876b2bad819ee88"
          test "$(git hash-object "$V3/package_adjustment_v3_research_closeout.json")" = "dbf43b5444bb1b1d8f6c3b71af72d259662801a7"

          test "$(git hash-object .github/workflows/package-adjustment-v4-phase1-structural-preregistration.yml)" = "eed59be8494e50d3d3daca66f0274935354c022d"

          test ! -e "$V4/phase2_development_results.json"
          test ! -e "$V4/phase2_development_summary.md"
          test ! -e "$V4/phase2_manifest.json"
          test ! -e "$V4/frozen_candidate.json"

      - name: Verify production remains V1.6 before development
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test V4 structural evaluator
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase2_develop.py --selftest

      - name: Run one-time spent-evidence development
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase2_develop.py

      - name: Verify V4 Phase 2 result boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          result = json.loads((d / "phase2_development_results.json").read_text())
          manifest = json.loads((d / "phase2_manifest.json").read_text())

          allowed = {
              "V4_DEVELOPMENT_CANDIDATE_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION",
              "V4_DEVELOPMENT_CLOSED_NO_CANDIDATE",
          }
          assert result["status"] in allowed
          assert result["production_change_authorized"] is False
          assert result["production_revision_unchanged"] == "v1.6-v5-size2-composition-overlay"
          assert result["spent_evidence_filter"]["source_frozen_ballots"] == 600
          assert result["spent_evidence_filter"]["eligible_ballots"] == 428
          assert result["spent_evidence_filter"]["excluded_ballots"] == 172
          assert result["spent_evidence_filter"]["eligible_distinct_voters"] == 30
          assert result["spent_evidence_filter"]["eligible_distinct_challenges"] == 161
          assert result["spent_evidence_filter"]["eligibility_applied_before_outcome_interpretation"] is True
          assert result["spent_evidence_filter"]["joe_mixon_or_invalid_pick_rows_are_not_used_for_model_selection"] is True
          assert result["spent_evidence_filter"]["no_reweighting_after_filter"] is True
          assert result["continuous_parameter_optimization_performed"] is False
          assert result["gamma_tuning_performed"] is False
          assert result["spent_v3_votes_may_count_as_fresh_confirmation"] is False
          assert result["hard_invariant_candidate_count"] > 0

          assert manifest["production_change_authorized"] is False
          assert manifest["eligible_development_ballots"] == 428
          assert manifest["excluded_development_ballots"] == 172
          assert manifest["development_status"] == result["status"]

          frozen = d / "frozen_candidate.json"
          if result["status"] == "V4_DEVELOPMENT_CANDIDATE_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION":
              assert frozen.exists()
              fc = json.loads(frozen.read_text())
              assert fc["status"] == "FROZEN_V4_CONFIRMATION_FAMILY"
              assert 1 <= fc["family_count"] <= 2
              assert fc["family_count"] == result["frozen_confirmation_family_count"]
              assert fc["fresh_confirmation_required"] is True
              assert fc["fresh_vote_namespace_reserved"] == "__pkgv4c1__"
              assert fc["v3_spent_votes_count_for_confirmation"] is False
              assert fc["asset_eligibility"]["players"]["explicitly_excluded_players"] == ["Joe Mixon"]
              assert fc["asset_eligibility"]["draft_picks"]["years_allowed"] == [2027, 2028]
          else:
              assert not frozen.exists()
              assert result["frozen_confirmation_family_count"] == 0
              assert result["fresh_confirmation_required"] is False

          print("PASS: V4 Phase 2 result obeys frozen development and eligibility contract.")
          print("STATUS=" + result["status"])
          print("FROZEN_FAMILY=" + ",".join(result["frozen_confirmation_family_ids"]))
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after development
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed V4 development workflows from active Actions
        shell: bash
        run: |
          set -euo pipefail

          git rm             .github/workflows/package-adjustment-v4-phase1-structural-preregistration.yml             .github/workflows/package-adjustment-v4-phase2-spent-evidence-development.yml

          echo "PASS: completed V4 Phase 1 and Phase 2 workflows removed from active Actions."
          echo "Future V4 confirmation, if authorized, must use new workflow files."

      - name: Stage exact Phase 2 scope
        shell: bash
        run: |
          set -euo pipefail

          V4="research/package-adjustment-v4-elite-fragmentation"

          git add             "$V4/phase2_development_results.json"             "$V4/phase2_development_summary.md"             "$V4/phase2_manifest.json"

          if test -e "$V4/frozen_candidate.json"; then
            git add "$V4/frozen_candidate.json"
          fi

          git diff --cached --check

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          result = json.loads((d / "phase2_development_results.json").read_text())

          expected = {
              "research/package-adjustment-v4-elite-fragmentation/phase2_development_results.json",
              "research/package-adjustment-v4-elite-fragmentation/phase2_development_summary.md",
              "research/package-adjustment-v4-elite-fragmentation/phase2_manifest.json",
              ".github/workflows/package-adjustment-v4-phase1-structural-preregistration.yml",
              ".github/workflows/package-adjustment-v4-phase2-spent-evidence-development.yml",
          }
          if result["frozen_confirmation_family_count"] > 0:
              expected.add(
                  "research/package-adjustment-v4-elite-fragmentation/frozen_candidate.json"
              )

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise RuntimeError(
                  f"Unexpected V4 Phase 2 staged scope: {sorted(changed)}"
              )

          print(f"PASS: exact V4 Phase 2 scope staged ({len(changed)} files).")
          PY

      - name: Commit immutable V4 Phase 2 development result
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Develop Package Adjustment V4 structural candidates"
          git pull --rebase origin main

          V4="research/package-adjustment-v4-elite-fragmentation"

          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/phase1_manifest.json")" = "37fff17e89237aad3e40539a4835b5eaf5163781"

          test ! -e .github/workflows/package-adjustment-v4-phase1-structural-preregistration.yml
          test ! -e .github/workflows/package-adjustment-v4-phase2-spent-evidence-development.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "V4_PHASE2_STATUS=$V4_PHASE2_STATUS"
          echo "V4_PHASE2_FROZEN_FAMILY_COUNT=$V4_PHASE2_FROZEN_FAMILY_COUNT"
          git log --oneline -1
