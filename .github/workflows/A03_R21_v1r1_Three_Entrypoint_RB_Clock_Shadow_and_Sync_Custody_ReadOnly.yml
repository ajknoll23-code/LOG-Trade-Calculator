name: A03 R21 - Three Entrypoint RB Clock Shadow and Sync Custody Read Only

# SYNTHETIC READ-ONLY DISCOVERY ONLY. No production as-of is selected.
# No committed application file, roster, model coefficient or price is changed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a03-r21-pinned-three-entrypoint-clock-discovery
  cancel-in-progress: false

jobs:
  pinned-three-entrypoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen A03 R16-R20 engine and entrypoint baseline
        uses: actions/checkout@v4
        with:
          ref: 8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6
          fetch-depth: 1
          persist-credentials: false

      - name: Pin Node 22.16.0 for reproducible research
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Fail closed on checkout drift or working tree differences
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6'
          printf '%s  %s\n' 'af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78' index.html | sha256sum --check --status
          test "$(git hash-object free-agent-board.html)" = '975efe51091a2315475678a9db0842b05c4fc3aa'
          test "$(git hash-object trade-desk-preview.html)" = 'd50715af625fcf8306e04b62fbf0fa025c9126b2'
          test "$(git hash-object scripts/sync/sync_free_agent_valuation.py)" = '7feec5c3318d03aab0808353f23a4bb381eb4a3c'
          test "$(git hash-object scripts/validation/validate_free_agent_valuation_parity.py)" = 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute canonical free-agent-board generator parity check without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/sync/sync_free_agent_valuation.py --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Stage ephemeral read-only R21 verifier outside checked-out repository
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a03-r21-three-entrypoints.js" <<'A03R21_VERIFIER'
          #!/usr/bin/env node
          'use strict';
          /* A03 R21 v1: pinned, read-only multi-entrypoint clock dependency discovery.
           * This does NOT choose a production as-of date and does NOT change live values.
           * All valuations are synthetic fixtures; real player source definitions are loaded.
           * --selftest only runs local surrogate pages; only --engine on pinned sources is acceptance.
           */
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha256=s=>crypto.createHash('sha256').update(s).digest('hex');
          function blobSha(s){const b=Buffer.from(s,'utf8');return crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');}
          const PIN={commit:'8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6',
           'index.html':{blob:'bb6ebc51f71565a3735ed0d060dca94ec68dadef',sha256:'af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78'},
           'free-agent-board.html':{blob:'975efe51091a2315475678a9db0842b05c4fc3aa'},
           'trade-desk-preview.html':{blob:'d50715af625fcf8306e04b62fbf0fa025c9126b2'},
           'scripts/sync/sync_free_agent_valuation.py':{blob:'7feec5c3318d03aab0808353f23a4bb381eb4a3c'},
           'scripts/validation/validate_free_agent_valuation_parity.py':{blob:'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'}
          };
          const argv=process.argv.slice(2);
          if(argv.length!==6||!['--engine','--selftest'].includes(argv[0]))throw Error('USAGE --engine|--selftest index.html free-agent-board.html trade-desk-preview.html sync_generator.py parity_validator.py');
          const selftest=argv[0]==='--selftest';
          const paths=['index.html','free-agent-board.html','trade-desk-preview.html','scripts/sync/sync_free_agent_valuation.py','scripts/validation/validate_free_agent_valuation_parity.py'];
          const raw={};
          for(let i=0;i<paths.length;i++){
           const file=paths[i],v=fs.readFileSync(argv[i+1],'utf8');
           if(!selftest&&blobSha(v)!==PIN[file].blob)throw Error('HOLD_PINNED_BLOB_DRIFT:'+file);
           if(!selftest&&PIN[file].sha256&&sha256(v)!==PIN[file].sha256)throw Error('HOLD_PINNED_SHA_DRIFT:'+file);
           raw[file]=v;
          }
          const guards=[];
          function check(id,b){if(guards.some(g=>g.id===id))throw Error('HOLD_DUP_GUARD:'+id);const result=!!b;guards.push({id,pass:result});if(!result)throw Error('HOLD_R21_'+id);}
          function exactly(s,v,n){return s.split(v).length-1===n;}
          const start='<script>\n';
          const marker={
           'index.html':'/* ---------- Value engine ---------- */',
           'free-agent-board.html':'/* CANONICAL VALUATION SYNC — 2026-08-28',
           'trade-desk-preview.html':'/* ---------- Value engine ---------- */'};
          const tail={
           'index.html':"document.getElementById('resetBtn').addEventListener('click', clearCalculator);",
           'free-agent-board.html':'loadFreeAgents();',
           'trade-desk-preview.html':"document.getElementById('resetBtn').addEventListener('click', clearCalculator);"};
          const sources={},rewritten={},callsiteCounts={};
          const beforeAge='const fractionalAge = fractionalAgeFromBirthDate(birthDate, age);';
          const beforeDisplay='const precise = fractionalAgeFromBirthDate(dob, age);';
          const afterAge='const fractionalAge = fractionalAgeFromBirthDate(birthDate, age, A03R21_ASOF);';
          const afterDisplay='const precise = fractionalAgeFromBirthDate(dob, age, A03R21_ASOF);';
          for(const file of Object.keys(marker)){
           const content=raw[file],a=content.indexOf(start+marker[file]),b=content.indexOf(tail[file],a);
           if(a<0||b<a||content.indexOf(start+marker[file],a+1)!==-1||content.indexOf(tail[file],b+1)!==-1)throw Error('HOLD_SOURCE_BOUNDARY:'+file);
           const source=content.slice(a+start.length,b);
           const expected=file==='index.html'?2:1;
           if(!exactly(source,beforeAge,1)||!exactly(source,beforeDisplay,file==='index.html'?1:0))throw Error('HOLD_UNEXPECTED_ASOF_CALLS:'+file);
           if(!exactly(source,'function fractionalAgeFromBirthDate(',1)||!exactly(source,'function effectiveAgeMultiplier(',1)||!exactly(source,'function playerValue(',1))throw Error('HOLD_VALUATION_FUNCTIONS_MISSING:'+file);
           if(!source.includes('const now = asOfDate ? new Date(`${asOfDate}T00:00:00Z`) : new Date();'))throw Error('HOLD_ORIGINAL_CLOCK_DEPENDENCY_MISSING:'+file);
           const final=source.replace(beforeAge,afterAge).replace(beforeDisplay,afterDisplay);
           if(final===source||final.includes(beforeAge)||final.includes(beforeDisplay))throw Error('HOLD_REWRITE_FAILURE:'+file);
           sources[file]=source;rewritten[file]=final;callsiteCounts[file]=expected;
          }
          check('pinned_main_engine_bounded_and_parsed',sources['index.html'].length>1000);
          check('pinned_free_agent_board_bounded_and_parsed',sources['free-agent-board.html'].length>1000);
          check('pinned_trade_preview_bounded_and_parsed',sources['trade-desk-preview.html'].length>1000);
          check('exact_four_implicit_asof_callsites',Object.values(callsiteCounts).reduce((a,b)=>a+b,0)===4);
          check('main_has_separate_display_age_clock_path',sources['index.html'].includes(beforeDisplay));
          check('free_agent_has_independent_value_clock_path',sources['free-agent-board.html'].includes(beforeAge));
          check('preview_has_independent_value_clock_path',sources['trade-desk-preview.html'].includes(beforeAge));
          check('shadow_in_memory_rewrites_only_named_callsites',Object.keys(sources).every(k=>rewritten[k].includes(afterAge)&&!rewritten[k].includes(beforeAge)&& (k==='index.html'?rewritten[k].includes(afterDisplay):true)));
          const generator=raw['scripts/sync/sync_free_agent_valuation.py'];
          const validator=raw['scripts/validation/validate_free_agent_valuation_parity.py'];
          check('free_agent_sync_generator_points_to_both_canonical_pages',generator.includes('INDEX_PATH')&&generator.includes('BOARD_PATH')&&generator.includes('index.html')&&generator.includes('free-agent-board.html'));
          check('free_agent_sync_has_check_and_write_modes',generator.includes('"--check"')&&generator.includes('"--write"')&&generator.includes('BOARD_PATH.write_text'));
          check('free_agent_parity_validator_present',validator.includes('sync_free_agent_valuation')&&validator.includes('INDEX')&&validator.includes('BOARD'));
          const net={fetch:0,xhr:0};
          function denyFetch(){net.fetch++;throw Error('HOLD_NETWORK_FETCH');}
          class DenyXHR{constructor(){net.xhr++;throw Error('HOLD_NETWORK_XHR');}}
          const silent={log(){},warn(){},error(){}};
          function frozenDate(iso){const ms=Date.parse(iso);if(!Number.isFinite(ms))throw Error('HOLD_TEST_CLOCK');
           return class FrozenDate extends Date{constructor(...a){super(...(a.length?a:[ms]));}static now(){return ms}};}
          const clocks=['2026-10-14T19:00:00Z','2026-12-14T19:00:00Z','2031-06-01T19:00:00Z'];
          const asOfs=['2026-10-14','2026-12-14'];
          const fake='r21 synthetic no real player 881009';
          const fakeNoDob='r21 synthetic no dob 881010';
          const fakeWR='r21 synthetic wr control 881011';
          function evaluation(file,clock,asof){
           const src=asof?`const A03R21_ASOF=${JSON.stringify(asof)};\n${rewritten[file]}`:sources[file];
           const body=src+'\nreturn {playerValue,normalizeName,PLAYER_DB,RB_BIRTH_DATE_DATA,PROD_MULT,displayPlayerAge:(typeof displayPlayerAge === "function" ? displayPlayerAge : null)};';
           // No DOM/network globals. Page entrypoints are never invoked; only their function definitions load.
           const X=new Function('Date','console','fetch','XMLHttpRequest','document','window','localStorage',body)(frozenDate(clock),silent,denyFetch,DenyXHR,undefined,undefined,undefined);
           for(const [name,pos,dob] of [[fake,'RB','2000-03-01'],[fakeNoDob,'RB',null],[fakeWR,'WR',null]]){
            const k=X.normalizeName(name);
            if(Object.hasOwn(X.PLAYER_DB,k)||Object.hasOwn(X.RB_BIRTH_DATE_DATA,k)||Object.hasOwn(X.PROD_MULT,k))throw Error('HOLD_SYNTHETIC_ID_COLLISION:'+file);
            X.PLAYER_DB[k]={pos,age:26,role:'Starter',team:'SYNTHETIC',...(dob?{birth_date:dob}:{})};
            if(dob)X.RB_BIRTH_DATE_DATA[k]=dob;
            X.PROD_MULT[k]=0.7;
           }
           const rb=X.playerValue('RB',26,'Starter',fake);
           const noDob=X.playerValue('RB',26,'Starter',fakeNoDob);
           const wr=X.playerValue('WR',26,'Starter',fakeWR);
           if(![rb,noDob,wr].every(n=>Number.isFinite(n)&&n>0))throw Error('HOLD_INVALID_SYNTHETIC_FV:'+file);
           const age=X.displayPlayerAge?X.displayPlayerAge('RB',26,fake):null;
           return {rb,noDob,wr,age};
          }
          const measured={};
          for(const file of Object.keys(sources)){
           const original=clocks.map(clock=>evaluation(file,clock,null));
           const shadows=asOfs.map(date=>clocks.map(clock=>evaluation(file,clock,date)));
           measured[file]={original_rb_values:original.map(x=>x.rb),shadow_rb_values:shadows.map(a=>a.map(x=>x.rb)),
           original_display_age:original.map(x=>x.age),shadow_display_age:shadows.map(a=>a.map(x=>x.age)),
           no_dob_values:original.map(x=>x.noDob),wr_values:original.map(x=>x.wr)};
           const slug=file.replace(/[^a-z]/g,'_');
           check('original_live_clock_drift_'+slug,new Set(original.map(x=>x.rb)).size>1);
           check('shadow_clock_invariance_'+slug,shadows.every(rows=>new Set(rows.map(x=>x.rb)).size===1));
           check('matched_date_parity_'+slug,shadows.every((rows,i)=>rows[0].rb===original[clocks.findIndex(c=>c.startsWith(asOfs[i]))].rb));
           check('valuation_date_progression_'+slug,shadows[0][0].rb!==shadows[1][0].rb);
           check('no_dob_and_wr_control_stability_'+slug,new Set(original.map(x=>x.noDob)).size===1&&new Set(original.map(x=>x.wr)).size===1);
          }
          check('across_surface_rb_parity_for_synthetic_fixture',clocks.every((_,i)=>new Set(Object.values(measured).map(x=>x.original_rb_values[i])).size===1));
          check('main_page_display_age_clock_drift',new Set(measured['index.html'].original_display_age).size>1);
          check('main_page_shadow_display_age_invariance',measured['index.html'].shadow_display_age.every(a=>new Set(a).size===1));
          check('no_network_attempts',net.fetch===0&&net.xhr===0);
          const count=guards.length;
          const report={study:'A03_R21_V1',mode:selftest?'LOCAL_SURROGATE_NOT_ACCEPTANCE':'PINNED_THREE_ENTRYPOINT_CLOCK_DISCOVERY_READ_ONLY',
           result:'PASS_MULTI_ENTRYPOINT_DISCOVERY__LIVE_PATCH_AND_PROVENANCE_HOLD',
           pinned:{commit:PIN.commit,blob_sha1:Object.fromEntries(paths.map(x=>[x,PIN[x].blob])),full_pin_verified:!selftest},
           coverage:{surfaces:Object.keys(sources),original_synthetic_evaluations:3*clocks.length*3,shadow_synthetic_evaluations:3*asOfs.length*clocks.length*3,
           implicit_asof_callsites:callsiteCounts},measured,guards,passed:count,failed:0,network_attempts:net,
           evidence:{read_only:true,synthetic_only:true,real_player_fv_computed:false,real_player_source_definitions_loaded:true,
           production_asof_selected:false,production_pricing_changed:false,production_files_modified:false,
           free_agent_board_is_generator_managed:true,
           remaining_holds:['OWNER_APPROVED_ASOF_AND_PROVENANCE','LIVE_PATCH','FREE_AGENT_GENERATOR_SYNC_AND_RUNTIME_PARITY','UI_BROWSER_ACCEPTANCE','REAL_ROSTER_SHADOW','TRADE_EPOCH_DEPLOYMENT','E2','B2','ROLEV2_PRICE_OFF','PRODUCTION_RELEASE']}};
          console.log(JSON.stringify(report,null,2));
          A03R21_VERIFIER
          printf '%s  %s\n' '8cf53a110fc96815cefd98a98a58d42ae6772abc0d499b8301439876a20acbfe' "$RUNNER_TEMP/a03-r21-three-entrypoints.js" | sha256sum --check --status
          node --check "$RUNNER_TEMP/a03-r21-three-entrypoints.js"

      - name: Execute pinned real functions under simulated clocks and validate discovery evidence
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/a03-r21-three-entrypoints.js" --engine \
            index.html free-agent-board.html trade-desk-preview.html \
            scripts/sync/sync_free_agent_valuation.py \
            scripts/validation/validate_free_agent_valuation_parity.py \
            > "$RUNNER_TEMP/a03-r21-three-entrypoints-evidence.json"
          node - "$RUNNER_TEMP/a03-r21-three-entrypoints-evidence.json" <<'A03R21_ASSERT'
          'use strict';
          const fs=require('node:fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const hard=(ok,label)=>{if(!ok)throw Error('HOLD_R21_ACCEPTANCE_'+label);};
          hard(r.study==='A03_R21_V1','study');
          hard(r.mode==='PINNED_THREE_ENTRYPOINT_CLOCK_DISCOVERY_READ_ONLY','engine_mode');
          hard(r.result==='PASS_MULTI_ENTRYPOINT_DISCOVERY__LIVE_PATCH_AND_PROVENANCE_HOLD','scope_result');
          hard(r.pinned?.commit==='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6','commit');
          hard(r.pinned?.full_pin_verified===true,'pinned_source');
          const ordered=['index.html','free-agent-board.html','trade-desk-preview.html'];
          hard(JSON.stringify(r.coverage?.surfaces)===JSON.stringify(ordered),'surface_list');
          hard(r.coverage?.original_synthetic_evaluations===27,'original_grid');
          hard(r.coverage?.shadow_synthetic_evaluations===54,'shadow_grid');
          hard(JSON.stringify(r.coverage?.implicit_asof_callsites)===JSON.stringify({'index.html':2,'free-agent-board.html':1,'trade-desk-preview.html':1}),'callsite_count');
          hard(r.passed===30&&r.failed===0&&Array.isArray(r.guards)&&r.guards.length===30,'guard_count');
          hard(new Set(r.guards.map(x=>x.id)).size===30&&r.guards.every(x=>x.pass===true),'guard_integrity');
          const m=r.measured||{};
          for(const file of ordered){
            hard(Array.isArray(m[file]?.original_rb_values)&&m[file].original_rb_values.length===3,'original_'+file);
            hard(new Set(m[file].original_rb_values).size>1,'live_drift_'+file);
            hard(Array.isArray(m[file]?.shadow_rb_values)&&m[file].shadow_rb_values.length===2,'shadow_'+file);
            hard(m[file].shadow_rb_values.every(rows=>Array.isArray(rows)&&rows.length===3&&rows.every(x=>x===rows[0])),'shadow_clock_invariance_'+file);
            hard(m[file].shadow_rb_values[0][0]===m[file].original_rb_values[0]&&m[file].shadow_rb_values[1][0]===m[file].original_rb_values[1],'matched_parity_'+file);
          }
          hard(ordered.every(file=>m[file].original_rb_values.join(',')===m[ordered[0]].original_rb_values.join(',')),'cross_page_synthetic_parity');
          hard(r.network_attempts?.fetch===0&&r.network_attempts?.xhr===0,'network');
          const e=r.evidence||{};
          hard(e.read_only===true&&e.synthetic_only===true&&e.real_player_fv_computed===false,'research_only');
          hard(e.real_player_source_definitions_loaded===true,'no_pretend_absent_data');
          hard(e.production_asof_selected===false&&e.production_pricing_changed===false&&e.production_files_modified===false,'no_promotion');
          hard(e.free_agent_board_is_generator_managed===true,'generator_custody');
          for(const hold of ['OWNER_APPROVED_ASOF_AND_PROVENANCE','LIVE_PATCH','FREE_AGENT_GENERATOR_SYNC_AND_RUNTIME_PARITY','UI_BROWSER_ACCEPTANCE','REAL_ROSTER_SHADOW','TRADE_EPOCH_DEPLOYMENT','E2','B2','ROLEV2_PRICE_OFF','PRODUCTION_RELEASE'])
            hard(e.remaining_holds?.includes(hold),'hold_'+hold);
          console.log('R21 PINNED REAL-ENGINE READ-ONLY DISCOVERY ACCEPTANCE: PASS');
          A03R21_ASSERT

      - name: Publish synthetic-only research evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: A03-R21-Three-Entrypoint-RB-Clock-ReadOnly-Evidence
          path: ${{ runner.temp }}/a03-r21-three-entrypoints-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Ensure no files in the checkout were changed by this research
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
