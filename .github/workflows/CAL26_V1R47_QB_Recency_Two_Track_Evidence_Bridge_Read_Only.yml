        \    desc=[]\n    desc.extend(['# CAL26 V1R47 — R45 numerical QB reference meets R46 recency forecast','',\n\
        \      '**Status: EVIDENCE_JOINED_RECENCY_NUMERIC_PRICE_HOLD.** The two research tracks are preserved;\
        \ production unchanged.','',\n      '## Actual empirical training decision (R46, Week 6)',\n      f\"\
        Established QBs: 50% last 3 **team games** + 50% previous-season points/team game; 2023–2025 held-out\
        \ MAE gain vs YTD {prior_select['test_relative_mae_gain_vs_ytd_pct']}% (79 observations).\",\n    \
        \  'QBs without usable previous-season baseline: train-selected 25% recent + 75% YTD **lost** to pure\
