name: CAL26 V1R47 - R45R1 R46 QB Recency Two-Track Evidence Bridge (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r47-qb-two-track-readonly
  cancel-in-progress: false
jobs:
  qb-two-track-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout pinned read-only evidence
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Use Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Join verified R45R1/R46 artifacts with pre-holdout 2026 NFL QB recency
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/cal26_v1r47_engine.py\" <<'PY_CAL26_V1R47_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"CAL26 V1R47: integrate R45R1 QB FV reference with R46 validated week-six recency signal.\n\
        PRODUCTION HOLD: no model mutation; 2026 weeks <=6 only; no numeric 2026 recency FV quote.\n\"\"\"\n\
        from __future__ import annotations\nimport argparse,collections,csv,datetime,hashlib,io,json,math,os,re,subprocess,sys,tempfile,time,unicodedata,urllib.error,urllib.request,zipfile\n\
        from pathlib import Path\n\nROOT='https://api.github.com/repos'\nRUNS={45:{'run':40027833230,'artifact':12534025370,'zip_sha':'02b023e4ec2c8e4e5ab6de8232c20bb24d996a5e5cc3d43acb128b88c9e20724','manifest':'CAL26_V1R45_manifest.json'},46:{'run':40027917152,'artifact':12533926105,'zip_sha':'54e1cd089005fadc6e902cf714397b42c55f324989e07fe2ce309ada184a9cca','manifest':'CAL26_V1R46_manifest.json'}}\n\
        P2='research/production-v2/production_v2_phase2_preseason_baseline.json'; P2_SHA='ed5025134ca5992b460fa8b850033f82d7ea450f'\n\
        P5='research/opportunity-v2/opportunity_v2_phase5_evaluation.json'; P5_SHA='7055b9d0e01befcba9fbe05cc72db86846c91f7b'\n\
        QB_FOCUS=['bryce young','jayden daniels','cj stroud','caleb williams','drake maye']\nNFL_SOURCE='https://github.com/nflverse/nflverse-data/releases/download/stats_player/'\n\
        OUT='CAL26_V1R47'\n\n\ndef check(v,why):\n    if not v:raise AssertionError(why)\ndef sha(b):return\
        \ hashlib.sha256(b).hexdigest()\ndef blob_sha(path,repo):return subprocess.check_output(['git','hash-object','--',path],cwd=repo,text=True).strip()\n\
        def write_csv(rows,fields):\n    t=io.StringIO(newline='');w=csv.DictWriter(t,fieldnames=fields,extrasaction='ignore',lineterminator='\\\
        n');w.writeheader()\n    for row in rows:w.writerow({k:row.get(k,'') for k in fields})\n    return\
        \ t.getvalue()\ndef csv_read(b):return list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))\ndef\
        \ norm(s):\n    s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode('ascii').lower()\n\
        \    s=re.sub(r'[^a-z0-9 ]','',s)\n    s=' '.join(s.split())\n    # NFLverse commonly lists trailing\
        \ Jr / II; admit suffix only if name remains unique in the match set.\n    return re.sub(r' (jr|sr|ii|iii|iv)$','',s)\n\
        class CrossHostSafeRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,req,fp,code,msg,headers,newurl):\n\
        \        next_req=super().redirect_request(req,fp,code,msg,headers,newurl)\n        if next_req and\
        \ urllib.parse.urlsplit(newurl).netloc!=urllib.parse.urlsplit(req.full_url).netloc:\n            next_req.remove_header('Authorization')\n\
        \            next_req.remove_header('X-Github-Api-Version')\n        return next_req\n\ndef fetch_zip(repo,s,token):\n\
        \    check(bool(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)),'REPO_INVALID')\n    check(bool(token),'GH_TOKEN_REQUIRED')\n\
        \    req=urllib.request.Request(f'{ROOT}/{repo}/actions/artifacts/{s[\"artifact\"]}/zip',headers={'Authorization':'Bearer\
        \ '+token,'Accept':'application/vnd.github+json','User-Agent':'CAL26-R47-ReadOnly'})\n    with urllib.request.build_opener(CrossHostSafeRedirect()).open(req,timeout=65)\
        \ as f: b=f.read(3_000_001)\n    check(b.startswith(b'PK\\x03\\x04') and len(b)<3_000_000,'ARTIFACT_NOT_ZIP')\n\
        \    return b\n\ndef unpack(b):\n    check(b.startswith(b'PK\\x03\\x04'),'NOT_ZIP')\n    files={}\n\
        \    with zipfile.ZipFile(io.BytesIO(b)) as z:\n        check(len(z.infolist())<20,'TOO_MANY_ARCHIVE_ENTRIES')\n\
        \        for f in z.infolist():\n            name=f.filename\n            check(not f.is_dir() and\
        \ '/' not in name and '\\\\' not in name and '..' not in name,'UNSAFE_ARCHIVE_PATH')\n            check(f.file_size<200_000,'OVERSIZE_ARCHIVE_MEMBER')\n\
        \            check(name not in files,'DUPLICATE_MEMBER')\n            files[name]=z.read(name)\n  \
        \  return files\n\ndef artifact_load(repo,token,fixtures=None):\n    loaded={};prov={}\n    for n,s\
        \ in RUNS.items():\n        data=(Path(fixtures)/f'r{n}.zip').read_bytes() if fixtures else fetch_zip(repo,s,token)\n\
        \        check(sha(data)==s['zip_sha'],f'R{n}_ARCHIVE_SHA_DRIFT')\n        files=unpack(data)\n   \
        \     check(s['manifest'] in files,f'R{n}_MANIFEST_MISSING')\n        m=json.loads(files[s['manifest']]);expected=m.get('output_sha256')\n\
        \        check(isinstance(expected,dict) and expected,f'R{n}_MISSING_HASH_MANIFEST')\n        check(set(files)==set(expected)|{s['manifest']},f'R{n}_CONTENTS_DRIFT')\n\
        \        for name,digest in expected.items():check(sha(files[name])==digest,f'R{n}_FILE_CHANGED_{name}')\n\
        \        if n==45:check(m['semantic_status']=='NUMERIC_POSITION_CONSERVING_QB_SHADOW_REFERENCE_ONLY_NOT_CALIBRATED'\
        \ and m['number_of_QBs']==54 and not m['production_mutation_authorized'],'R45_INVALID')\n        if\
        \ n==46:check(m['semantic_status']=='RECENCY_BACKTEST_COMPLETE_RESEARCH_ONLY_PRODUCTION_HOLD' and m['test_seasons']==[2023,2024,2025]\
        \ and m['train_seasons']==[2017,2018,2019,2020,2021,2022] and not m['2026_actuals_read'],'R46_INVALID')\n\
        \        loaded[n]=(files,m)\n        prov[str(n)]={'run_id':s['run'],'artifact_id':s['artifact'],'artifact_zip_sha256':sha(data)}\n\
        \    return loaded,prov\n\ndef public_download(year,assets_dir,offline=False):\n    p=assets_dir/f'stats_player_week_{year}.csv'\n\
        \    if offline:check(p.exists(),f'FIXTURE_{year}_MISSING');b=p.read_bytes()\n    elif p.exists():b=p.read_bytes()\n\
        \    else:\n        url=NFL_SOURCE+f'stats_player_week_{year}.csv'\n        err=None\n        for i\
        \ in range(3):\n            try:\n                req=urllib.request.Request(url,headers={'User-Agent':'CAL26-V1R47-NFLverse-ReadOnly'})\n\
        \                with urllib.request.urlopen(req,timeout=90) as r:b=r.read(18_000_001)\n          \
        \      check(500<len(b)<18_000_000,f'WEEKLY_SOURCE_SIZE_{year}')\n                p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);break\n\
        \            except Exception as e:\n                err=e\n                if i<2:time.sleep(i+1)\n\
        \        else:raise RuntimeError(f'WEEKLY_SOURCE_DOWNLOAD_FAILED_{year}_{err}')\n    check(b'player_id'\
        \ in b[:2500] and b'fantasy_points' in b[:2500],f'WEEKLY_SOURCE_INVALID_{year}')\n    return b\n\n\
        def parse_season(b,year,cutoff=None):\n    r=csv.DictReader(io.StringIO(b.decode('utf-8-sig')))\n \
        \   req={'player_id','player_display_name','season','season_type','week','team','position','attempts','fantasy_points'}\n\
        \    check(req.issubset(r.fieldnames or []),f'WEEKLY_COLUMNS_{year}_{req-set(r.fieldnames or [])}')\n\
        \    teams=collections.defaultdict(set);by_id=collections.defaultdict(list);n=0;future_rows=0\n   \
        \ for line in r:\n        if line['season_type']!='REG':continue\n        yr=int(line['season']);check(yr==year,'YEAR_MISMATCH')\n\
        \        week=int(line['week']);check(1<=week<=18,'WEEK_INVALID')\n        if cutoff and week>cutoff:\n\
        \            future_rows+=1\n            continue  # For 2026 we do NOT parse points or names after\
        \ week six\n        team=(line.get('team') or '').strip()\n        if team:teams[team].add(week)\n\
        \        if line.get('position')!='QB':continue\n        pid=line.get('player_id')\n        if not\
        \ pid or not team:continue\n        p=float(line['fantasy_points'] or 0);attempts=float(line['attempts']\
        \ or 0)\n        check(math.isfinite(p) and math.isfinite(attempts) and attempts>=0 and p>-100,'INVALID_STATS')\n\
        \        by_id[pid].append({'week':week,'team':team,'pts':p,'attempts':attempts,'name':line.get('player_display_name')\
        \ or pid})\n        n+=1\n    if cutoff:check(max([w for z in teams.values() for w in z],default=0)==cutoff,'2026_WEEK6_DATA_INCOMPLETE')\n\
        \    else:check(len(teams)>=25 and max([w for z in teams.values() for w in z],default=0)>=17,'PRIOR_SEASON_INCOMPLETE')\n\
        \    check(len(teams)>=25 and len(by_id)>=25,'SOURCE_QB_COVERAGE_LOW')\n    for pid,rs in by_id.items():\n\
        \        rs.sort(key=lambda x:x['week'])\n        check(len({r['week'] for r in rs})==len(rs),'DUPLICATE_QB_WEEK')\n\
        \    return dict(by_id),teams,{'year':year,'qb_count':len(by_id),'qb_rows_parsed':n,'future_week_rows_skipped_without_parsing_player_stats':future_rows,'team_count':len(teams),'latest_included_week':cutoff\
        \ or max(w for a in teams.values() for w in a)}\n\ndef live_qb_features(p25,t25,p26,t26):\n    rows=[];name_collisions=collections.defaultdict(set)\n\
        \    for pid,rs in p26.items():\n        seen=rs # already limited to <=6\n        at=sum(r['attempts']\
        \ for r in seen);g10=sum(r['attempts']>=10 for r in seen)\n        if at<80 or g10<3:continue\n   \
        \     games=sorted(x for x in t26[seen[-1]['team']] if x<=6)\n        if len(games)<3:continue\n  \
        \      rswk={r['week']:r for r in seen}\n        ytd=sum(r['pts'] for r in seen)/len(games)\n     \
        \   last3=sum(rswk[w]['pts'] for w in games[-3:] if w in rswk)/3\n        prior=None\n        prev=p25.get(pid)\n\
        \        if prev and sum(r['attempts'] for r in prev)>=80 and len(prev)>=3:\n            nteam=prev[-1]['team']\n\
        \            g=t25.get(nteam,set())\n            if len(g)>=12:prior=sum(r['pts'] for r in prev)/len(g)\n\
        \        # For no-prior strata, held-out R46 training choice lost to ytd: use held-out winner ytd.\n\
        \        rec=0.5*last3+0.5*prior if prior is not None else ytd\n        breakout=bool(prior is not\
        \ None and prior>=1 and last3>=1.25*prior and last3>=prior+3)\n        name=norm(seen[-1]['name'])\n\
        \        rows.append({'name':name,'nflverse_display_name':seen[-1]['name'],'nflverse_id':pid,'current_team':seen[-1]['team'],'observed_games':len(games),'pass_attempts':int(at),'has_usable_2025_prior':prior\
        \ is not None,'recent3_std_ppg':round(last3,4),'ytd_std_ppg':round(ytd,4),'prior2025_std_ppg':round(prior,4)\
        \ if prior is not None else None,'week6_R46_heldout_selected_std_ROS_ppg':round(rec,4),'recency_weight':0.5\
        \ if prior is not None else 0.,'prior_weight':0.5 if prior is not None else 0.,'ytd_weight':0. if prior\
        \ is not None else 1.,'week6_historical_breakout_flag':breakout,'breakout_rule':'recent3 >=125% prior\
        \ and >=prior+3' if prior is not None else 'NA_NO_PRIOR'})\n        name_collisions[name].add(pid)\n\
        \    check(len(rows)>=15,'ELIGIBLE_QB_POOL_TOO_SMALL')\n    for nm,ids in name_collisions.items():check(len(ids)==1,f'NONUNIQUE_NAME_{nm}')\n\
        \    return {x['name']:x for x in rows}\n\ndef make_report(repo,fixtures,assets,offline):\n    loaded,artifact_prov=artifact_load(repo,os.environ.get('GH_TOKEN',''),fixtures)\n\
        \    f45,m45=loaded[45];f46,m46=loaded[46]\n    vals=csv_read(f45['CAL26_V1R45_54_QB_reference_reallocation.csv'])\n\
        \    focus_rows=[x for x in vals if x['scenario']=='base_equal_year_weights']\n    check(len(focus_rows)==54\
        \ and len({x['name'] for x in focus_rows})==54,'R45_BASE_54_QB_DRIFT')\n    methods=csv_read(f46['CAL26_V1R46_selected_weights_and_holdout.csv'])\n\
        \    check(len(methods)==6,'R46_SIX_STRATA_REQUIRED')\n    prior_select=next(x for x in methods if\
        \ x['cutoff']=='6' and x['prior_season_available']=='True')\n    no_prior=next(x for x in methods if\
        \ x['cutoff']=='6' and x['prior_season_available']=='False')\n    check(tuple(float(prior_select[k])\
        \ for k in ('recent_three_weight','season_to_date_weight','previous_year_weight'))==(.5,0.,.5),'R46_PRIOR_METHOD_DRIFT')\n\
        \    check(prior_select['test_model_beats_ytd']=='True' and no_prior['test_model_beats_ytd']=='False','R46_MODEL_SELECTION_DRIFT')\n\
        \    check(abs(float(prior_select['test_relative_mae_gain_vs_ytd_pct'])-7.3385)<.0001,'R46_PRIOR_HOLDOUT_GAIN_DRIFT')\n\
        \    rr=Path(repo)\n    if not offline:\n        check(blob_sha(P2,rr)==P2_SHA,'P2_GIT_BLOB_DRIFT')\n\
        \        check(blob_sha(P5,rr)==P5_SHA,'P5_GIT_BLOB_DRIFT')\n    p2=json.loads((rr/P2).read_text());p5=json.loads((rr/P5).read_text())\n\
        \    check(len(p2['frozen_players'])==549 and p2['production_mutation_authorized'] is False,'P2_GUARD_DRIFT')\n\
        \    check(p5['completed_consecutive_weeks_used']==[1,2,3,4,5,6] and not p5['deployment_authorized'],'P5_WEEKS_GUARD_DRIFT')\n\
        \    b25=public_download(2025,assets,offline);b26=public_download(2026,assets,offline)\n    if not\
        \ offline:check(sha(b25)==m46['source_sha256']['2025'],'2025_R46_ORIGINAL_SOURCE_DRIFT')\n    p25,t25,s25=parse_season(b25,2025)\n\
        \    p26,t26,s26=parse_season(b26,2026,cutoff=6)\n    live=live_qb_features(p25,t25,p26,t26)\n    c=[];miss=[]\n\
        \    for v in focus_rows:\n        name=v['name'];n=norm(name)\n        f=p2['frozen_players'].get(name)\n\
        \        check(f and f['pos']=='QB' and float(v['projection'])==float(f['canonical_forward_2026_points']),'P2_R45_QB_PROJECTION_DRIFT')\n\
        \        o=p5['realized_player_outcomes'].get(name)\n        q=live.get(n)\n        if not q:miss.append(name)\n\
        \        c.append({'name':name,'age':int(v['age']),'frozen_september_FV':int(v['frozen_FV']),'R45R1_reference_only_FV':int(v['quantile_reallocated_FV_reference_points']),'R45R1_delta_NOT_APPROVED':int(v['points_delta_NOT_APPROVED']),'R45R1_shadow_rank':int(v['shadow_rank']),'2026_frozen_preseason_points':float(v['projection']),'weeks1_6_LOG_active_ppg_OBSERVATION_ONLY':round(o['active_ppg'],4)\
        \ if o and o['active_ppg'] is not None else None,'weeks1_6_LOG_active_games_OBSERVATION_ONLY':o['active_games']\
        \ if o else None,'R46_2026_week6_qualifies':q is not None,**(q or {}),'future_holdout_read':False,'numerical_recency_FV_calibrated':False,'production_change_authorized':False})\n\
        \    check(len(c)==54 and len({x['name'] for x in c})==54,'QB_BOARD_CARDINALITY')\n    check(all(x['future_holdout_read']\
        \ is False and x['numerical_recency_FV_calibrated'] is False for x in c),'PROD_HOLD')\n    have=[x\
