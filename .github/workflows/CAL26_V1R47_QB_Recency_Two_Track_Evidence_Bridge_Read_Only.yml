        \    have_fore=sorted(have,key=lambda x:(-x['week6_R46_heldout_selected_std_ROS_ppg'],x['name']))\n\
        \    prer={r['name']:i+1 for i,r in enumerate(have_pre)}\n    fr={r['name']:i+1 for i,r in enumerate(have_fore)}\n\
        \    for r in c:\n        if r['name'] in prer:\n            r['preseason_rank_among_eligible_R46_QBs']=prer[r['name']]\n\
        \            r['R46_2026_ROS_rank_among_eligible_QBs']=fr[r['name']]\n            r['R46_rank_difference_vs_preseason']=prer[r['name']]-fr[r['name']]\n\
        \        else:\n            r['preseason_rank_among_eligible_R46_QBs']=None\n            r['R46_2026_ROS_rank_among_eligible_QBs']=None\n\
        \            r['R46_rank_difference_vs_preseason']=None\n    fields=['name','age','frozen_september_FV','R45R1_reference_only_FV','R45R1_delta_NOT_APPROVED','R45R1_shadow_rank','2026_frozen_preseason_points','weeks1_6_LOG_active_ppg_OBSERVATION_ONLY','weeks1_6_LOG_active_games_OBSERVATION_ONLY','R46_2026_week6_qualifies','nflverse_display_name','nflverse_id','current_team','observed_games','pass_attempts','has_usable_2025_prior','recent3_std_ppg','ytd_std_ppg','prior2025_std_ppg','week6_R46_heldout_selected_std_ROS_ppg','recency_weight','prior_weight','ytd_weight','week6_historical_breakout_flag','preseason_rank_among_eligible_R46_QBs','R46_2026_ROS_rank_among_eligible_QBs','R46_rank_difference_vs_preseason','future_holdout_read','numerical_recency_FV_calibrated','production_change_authorized']\n\
        \    out={f'{OUT}_54_QB_two_track_evidence.csv':write_csv(c,fields)}\n    focus=[x for x in c if x['name']\
