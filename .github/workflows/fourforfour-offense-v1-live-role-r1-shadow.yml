      - name: Run repository regression and prove read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md

          if ! git diff --quiet -- .; then
            echo 'ERROR: live-role R1 modified tracked files.' >&2
            git diff -- .
            exit 1
          fi
          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: live-role R1 staged files.' >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'ERROR: live-role R1 created repository files.' >&2
            git status --porcelain --untracked-files=all
            exit 1
          fi
          echo 'PASS: live-role R1 left repository unchanged.'

      - name: Destroy private and row-level working data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-offense-v1
          rm -f /tmp/live-role-r1-append.py.b64 /tmp/live-role-r1.py
          echo 'PASS: private 4for4 and row-level snap working data destroyed.'
