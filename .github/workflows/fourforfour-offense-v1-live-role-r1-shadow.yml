name: 4for4 Offense V1 - Live Role R1 Shadow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-role-r1-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Pin current deployed stack and frozen Opportunity V2 study
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            expected="$1"
            path="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git blob drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
          }

          check_blob e631e223a99f5640a46a100e2e136b0c657dd811 index.html
          check_blob 0ca9d5601707a3553fa23723c7cfc7c00b789050 scripts/validation/validate_idp_v1_final_deployment.py
          check_blob 11beeb67bdb5af132c42cd1cf84b9a0d8283a22b model/releases/fourforfour-offense-provisional-10pct-v1/release.json
          check_blob d3066303b476fd244870a8c0dbd80d584eb8d7f7 research/opportunity-v2/opportunity_v2_phase3_shadow_audit.json
          check_blob 7d4286e2eb5904f0df385827daeffd9c2a1357b2 research/opportunity-v2/opportunity_v2_phase5_frozen_candidates.json
          check_blob 4cd06b20687b74a4b5cc8747f63605891db061bd .github/workflows/fourforfour-offense-v1-phase-o1-shadow.yml
          check_blob bd06f66facb602d36307e0f9e88db013a3576726 research/production-v2/production_v2_phase1_audit.py
          check_blob 1efca4c35e910a95974c1bec0b06a106196618b3 scripts/validation/snapshot_values.py

          python3 scripts/validation/validate_idp_v1_final_deployment.py
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md
          git diff --exit-code -- .

          echo 'PASS: production stack and frozen Opportunity V2 study pinned.'

      - name: Decode private 4for4 offense export
        shell: bash
        run: |
          set -euo pipefail
          for var in FOURFORFOUR_OFFENSE_GZ_B64_PART1 FOURFORFOUR_OFFENSE_GZ_B64_PART2 FOURFORFOUR_OFFENSE_GZ_B64_PART3; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret $var missing." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-fourforfour-offense-v1/input
          printf '%s%s%s' \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-offense-v1/input/offense.csv
          chmod 600 /tmp/log-fourforfour-offense-v1/input/offense.csv
          echo '488f8b7bf74b5e30ed515c7cde4b2049d1af6ad0d953ae7f78fd82561293af11  /tmp/log-fourforfour-offense-v1/input/offense.csv' | sha256sum --check --strict

      - name: Download authoritative completed Week 1 snap counts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/nflverse/nflverse-data/releases/download/snap_counts/snap_counts_2026.csv \
            -o /tmp/log-fourforfour-offense-v1/input/snap_counts_2026.csv
          test -s /tmp/log-fourforfour-offense-v1/input/snap_counts_2026.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('/tmp/log-fourforfour-offense-v1/input/snap_counts_2026.csv')
          with p.open(newline='',encoding='utf-8-sig') as fh:
              rows=list(csv.DictReader(fh))
          required={'season','week','game_type','player','position','team','offense_pct'}
          missing=required-set(rows[0] if rows else [])
          if missing:
              raise RuntimeError(f'missing snap columns: {sorted(missing)}')
          w1=[r for r in rows if str(r.get('season'))=='2026' and str(r.get('week'))=='1' and str(r.get('game_type') or '').upper()=='REG']
          if len(w1)<500:
              raise RuntimeError(f'Week1 snap data unexpectedly sparse: {len(w1)}')
          print(f'PASS: authoritative Week1 snap rows available: {len(w1)}')
          PY

