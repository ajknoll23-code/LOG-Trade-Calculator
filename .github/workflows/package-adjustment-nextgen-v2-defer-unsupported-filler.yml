name: Package Adjustment NextGen V2 Defer Unsupported Filler

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-defer-unsupported-filler
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependency
        run: python3 -m pip install requests

      - name: Capture pre-run base
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Pre-run base: $(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"

      - name: Verify exact reviewed starting state
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"
          CAT="research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"

          test -f "$GEN"
          test -f "$SPEC"
          test -f "$CAT"

          test "$(sha256sum "$GEN" | awk '{print $1}')" = "e2fee705d959b363a1844635f8dd0dba87f2b316644f97952028d653507158ee"
          test "$(sha256sum "$SPEC" | awk '{print $1}')" = "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"

          python3 - <<'PY'
          import json
          from pathlib import Path

          cat = json.loads(Path(
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          ).read_text(encoding="utf-8"))

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["research_only"] is True
          assert cat["frozen"] is False
          assert cat["production_formula_enabled"] is False
          assert cat["automatic_production_change_allowed"] is False
          assert cat["exact_live_formula_sha256_at_generation"] == "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7"
          assert cat["generator_sha256"] == "e2fee705d959b363a1844635f8dd0dba87f2b316644f97952028d653507158ee"
          assert cat["research_spec"]["sha256"] == "e07734799c1b8da6a335fd8c568ccdbc7fb813562b8680073aa99613f36cb2fc"
          assert cat["catalog_diagnostics"]["challenge_count"] == 144
          assert cat["catalog_diagnostics"]["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 30,
              "structural_topology_3v3": 24,
          }
          assert cat["catalog_diagnostics"]["skipped_or_underfilled_cells"] == []

          old_filler = [
              c for c in cat["challenges"]
              if c["cell_id"] == "frag_80_20_vs_80_05x4"
          ]
          assert len(old_filler) == 15
          assert all(c["values_hidden_from_voter"] is True for c in old_filler)

          print("PASS: exact unreleased 144-row pre-correction catalog confirmed.")
          PY

      - name: Verify production baseline before correction
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Patch preregistration and generator
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          gen_path = Path("research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py")
          spec_path = Path("research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md")

          gen = gen_path.read_text(encoding="utf-8")
          spec = spec_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              return text.replace(old, new, 1)

          old_comparisons = (
              'FRAGMENTATION_COMPARISONS = (\n'
              '    ("80_20_vs_80_10_10", (0.80, 0.20), (0.80, 0.10, 0.10)),\n'
              '    ("80_20_vs_80_05x4", (0.80, 0.20), (0.80, 0.05, 0.05, 0.05, 0.05)),\n'
              ')\n'
          )
          new_comparisons = (
              'FRAGMENTATION_COMPARISONS = (\n'
              '    ("80_20_vs_80_10_10", (0.80, 0.20), (0.80, 0.10, 0.10)),\n'
              ')\n'
              'DEFERRED_FRAGMENTATION_COMPARISONS = (\n'
              '    {\n'
              '        "label": "80_20_vs_80_05x4",\n'
              '        "side_a": (0.80, 0.20),\n'
              '        "side_b": (0.80, 0.05, 0.05, 0.05, 0.05),\n'
              '        "status": "deferred_pre_freeze",\n'
              '        "reason": (\n'
              '            "frozen player universe forces unavoidable player-identity "\n'
              '            "confounding; see research spec section 17.1"\n'
              '        ),\n'
              '    },\n'
              ')\n'
          )
          gen = replace_once(
              gen, old_comparisons, new_comparisons,
              "active/deferred fragmentation comparison block"
          )

          old_design = (
              '            "fragmentation_comparisons": [\n'
              '                {"label": label, "side_a": list(a), "side_b": list(b)}\n'
              '                for label, a, b in FRAGMENTATION_COMPARISONS\n'
              '            ],\n'
              '            "structural_holdout_comparisons": [\n'
          )
          new_design = (
              '            "fragmentation_comparisons": [\n'
              '                {"label": label, "side_a": list(a), "side_b": list(b)}\n'
              '                for label, a, b in FRAGMENTATION_COMPARISONS\n'
              '            ],\n'
              '            "deferred_fragmentation_comparisons": [\n'
              '                {\n'
              '                    "label": row["label"],\n'
              '                    "side_a": list(row["side_a"]),\n'
              '                    "side_b": list(row["side_b"]),\n'
              '                    "status": row["status"],\n'
              '                    "reason": row["reason"],\n'
              '                }\n'
              '                for row in DEFERRED_FRAGMENTATION_COMPARISONS\n'
              '            ],\n'
              '            "structural_holdout_comparisons": [\n'
          )
          gen = replace_once(
              gen, old_design, new_design,
              "catalog deferred-fragmentation metadata"
          )

          old_markdown_head = (
              'def design_markdown(catalog):\n'
              '    d = catalog["catalog_diagnostics"]\n'
              '    vref = catalog["v_ref"]\n'
              '    lines = [\n'
          )
          new_markdown_head = (
              'def design_markdown(catalog):\n'
              '    d = catalog["catalog_diagnostics"]\n'
              '    vref = catalog["v_ref"]\n'
              '    deferred_labels = ", ".join(\n'
              '        row["label"]\n'
              '        for row in catalog["design"]["deferred_fragmentation_comparisons"]\n'
              '    )\n'
              '    lines = [\n'
          )
          gen = replace_once(
              gen, old_markdown_head, new_markdown_head,
              "design markdown deferred label setup"
          )

          old_markdown_line = (
              '        f"- Pick cells active: `{catalog[\'pick_cells\'][\'active\']}`",\n'
          )
          new_markdown_line = (
              '        f"- Pick cells active: `{catalog[\'pick_cells\'][\'active\']}`",\n'
              '        f"- Deferred fragmentation comparisons: `{deferred_labels or \'none\'}`",\n'
          )
          gen = replace_once(
              gen, old_markdown_line, new_markdown_line,
              "design markdown deferred summary"
          )

          old_selftest = (
              '    assert set(frag_plans) == {label for label, _a, _b in FRAGMENTATION_COMPARISONS}\n'
          )
          new_selftest = (
              '    assert set(frag_plans) == {label for label, _a, _b in FRAGMENTATION_COMPARISONS}\n'
              '    assert {label for label, _a, _b in FRAGMENTATION_COMPARISONS} == {"80_20_vs_80_10_10"}\n'
              '    assert {row["label"] for row in DEFERRED_FRAGMENTATION_COMPARISONS} == {"80_20_vs_80_05x4"}\n'
          )
          gen = replace_once(
              gen, old_selftest, new_selftest,
              "selftest active/deferred fragmentation assertions"
          )

          spec_marker = (
              "M4 earns an explicit roster term only if observed preferences show a stable residual "
              "piece-count effect beyond M2's prediction.\n\n"
              "---\n\n"
              "# 18. Low-value filler stress family\n"
          )

          spec_replacement = (
              "M4 earns an explicit roster term only if observed preferences show a stable residual "
              "piece-count effect beyond M2's prediction.\n\n"
              "## 17.1 Pre-freeze frozen-snapshot support decision\n\n"
              "No NextGen V2 voting had been activated and no NextGen V2 votes had been collected when "
              "this decision was made. The generated catalog was still unreleased and `frozen: false`.\n\n"
              "Three read-only audits were run against the same frozen player-FV and league-roster "
              "snapshot. The preregistered construction tolerances were not changed.\n\n"
              "1. **Scale-integrity audit.** For `80/20 vs 80/5/5/5/5`, the original non-overlapping "
              "low and middle bands produced zero complete valid ballots even when the side-candidate "
              "search limit was increased from 24 to 48 to 96. The high band produced five ballots at "
              "the normal limit of 24. The `80/20 vs 80/10/10` comparison produced five ballots in all "
              "three bands at the normal limit.\n"
              "2. **Joint-feasibility audit.** Of 335 component-window-feasible candidate totals for "
              "`80/20 vs 80/5/5/5/5`, only 73 were fully joint-trade constructible. All 73 were between "
              "10,231 and 11,109 FV. Nearest-rank 25th/50th/75th percentile anchors on that true support "
              "were 10,757 / 10,891 / 11,000, a low-to-high span of only 243 FV (about 2.26%). A full "
              "15-ballot simulation across those narrow strata used Jahmyr Gibbs in 15/15 ballots and "
              "Bijan Robinson in 15/15 ballots.\n"
              "3. **Diversity-capacity audit.** At a side-candidate limit of 96, the valid candidate "
              "universe contained 463 unique full-trade signatures. Bijan Robinson appeared in 463/463. "
              "Exact mixed-integer optimization selecting five ballots proved that the minimum possible "
              "maximum player appearance was 5/5 even when exact side-package reuse was forbidden.\n\n"
              "This is a frozen-input support limitation, not evidence about voter preference.\n\n"
              "Therefore, for this frozen first-wave catalog:\n\n"
              "- `80/20 vs 80/10/10` remains active at low / middle / high scale.\n"
              "- `80/20 vs 80/5/5/5/5` is **deferred and inactive**. It is excluded from the voting "
              "catalog and from model fitting.\n"
              "- the deferred comparison may be reconsidered only under a newly frozen asset universe "
              "(including verified production pick FV if later available) and a new preregistered "
              "support/diversity audit;\n"
              "- the 2.5% side-total, component-share, and pair-total tolerances remain unchanged;\n"
              "- no vote outcomes were consulted, so this is a pre-freeze design correction rather than "
              "outcome-contingent experiment editing.\n\n"
              "---\n\n"
              "# 18. Low-value filler stress family\n"
          )
          spec = replace_once(
              spec, spec_marker, spec_replacement,
              "research spec pre-freeze filler support amendment"
          )

          gen_path.write_text(gen, encoding="utf-8")
          spec_path.write_text(spec, encoding="utf-8")

          print("PASS: generator now activates only 80/20 vs 80/10/10.")
          print("PASS: 80/5/5/5/5 is explicitly deferred in generator metadata and preregistration.")
          PY

          python3 -m py_compile research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py

      - name: Verify patch boundaries before commit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True,
          ).splitlines())
          assert changed == expected, (changed, expected)
          print("PASS: only generator + preregistration changed before first commit.")
          PY

      - name: Run patched generator self-test
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py --selftest

      - name: Commit support decision and generator
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md

          python3 - <<'PY'
          import subprocess
          expected = {
              "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md",
          }
          staged = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          assert staged == expected, (staged, expected)
          PY

          git commit -m "Defer unsupported NextGen V2 80/5 filler family"
          echo "SUPPORT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Live dry run before overwriting catalog
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          python3 "$GEN" --dry-run > /tmp/pkgnv2-dry-run.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path("/tmp/pkgnv2-dry-run.json").read_text(encoding="utf-8"))

          assert d["status"] == "dry_run_passed"
          assert d["challenge_count"] == 129
          assert d["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert d["split_counts"] == {
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
              "train": 75,
          }
          assert d["skipped_or_underfilled_cells"] == 0
          assert set(d["fragmentation_scale_anchors"]) == {"80_20_vs_80_10_10"}
          assert d["diversity"]["rank_version"] == 3

          print("PASS: dry run = 129 rows, 90/15/24 families, 75/30/24 splits, zero underfilled.")
          PY

      - name: Regenerate corrected unreleased catalog
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py --force

      - name: Validate corrected catalog and scale integrity
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path.cwd()
          cat_path = root / "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          gen_path = root / "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          spec_path = root / "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"

          cat = json.loads(cat_path.read_text(encoding="utf-8"))
          challenges = cat["challenges"]
          diag = cat["catalog_diagnostics"]

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["research_only"] is True
          assert cat["frozen"] is False
          assert cat["production_formula_enabled"] is False
          assert cat["automatic_production_change_allowed"] is False
          assert cat["production_revision_at_generation"] == "v1.6-v5-size2-composition-overlay"
          assert cat["exact_live_formula_sha256_at_generation"] == "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7"
          assert cat["generator_sha256"] == sha256(gen_path)
          assert cat["research_spec"]["sha256"] == sha256(spec_path)

          assert diag["challenge_count"] == 129
          assert diag["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert diag["split_counts"] == {
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
              "train": 75,
          }
          assert diag["scale_counts"] == {
              "high": 43,
              "low": 43,
              "mid": 43,
          }
          assert diag["skipped_or_underfilled_cells"] == []

          active = cat["design"]["fragmentation_comparisons"]
          deferred = cat["design"]["deferred_fragmentation_comparisons"]
          assert [row["label"] for row in active] == ["80_20_vs_80_10_10"]
          assert len(deferred) == 1
          assert deferred[0]["label"] == "80_20_vs_80_05x4"
          assert deferred[0]["status"] == "deferred_pre_freeze"
          assert "player-identity confounding" in deferred[0]["reason"]

          frag = [c for c in challenges if c["family"] == "fragmentation_filler"]
          assert len(frag) == 15
          assert {c["cell_id"] for c in frag} == {"frag_80_20_vs_80_10_10"}
          assert {c["treatment"] for c in frag} == {"80_20_vs_80_10_10"}
          assert not any("80_5_5_5_5" in c["treatment"] for c in challenges)
          assert not any(c["cell_id"] == "frag_80_20_vs_80_05x4" for c in challenges)

          by_scale = defaultdict(list)
          for c in frag:
              by_scale[c["scale_label"]].append(c)
          assert {k: len(v) for k, v in by_scale.items()} == {
              "low": 5, "mid": 5, "high": 5
          }

          anchors = cat["design"]["fragmentation_scale_anchors"]["80_20_vs_80_10_10"]
          low_mid = (float(anchors["low"]) + float(anchors["mid"])) / 2.0
          mid_high = (float(anchors["mid"]) + float(anchors["high"])) / 2.0

          low_goals = [float(c["goal_total_fv"]) for c in by_scale["low"]]
          mid_goals = [float(c["goal_total_fv"]) for c in by_scale["mid"]]
          high_goals = [float(c["goal_total_fv"]) for c in by_scale["high"]]

          assert all(x <= low_mid for x in low_goals), (low_goals, low_mid)
          assert all(low_mid < x <= mid_high for x in mid_goals), (mid_goals, low_mid, mid_high)
          assert all(x > mid_high for x in high_goals), (high_goals, mid_high)

          assert all(c["values_hidden_from_voter"] is True for c in challenges)
          assert all(
              c["fit_eligible"] is False
              for c in challenges
              if c["split"] != "train"
          )

          appearances = Counter()
          for c in frag:
              for side in ("side_a", "side_b"):
                  appearances.update(a["key"] for a in c[side]["assets"])

          max_frag_appearance = max(appearances.values(), default=0)
          unique_frag_assets = len(appearances)

          print("PASS: unsupported 80/5x4 ballots are absent and explicitly deferred.")
          print("PASS: surviving 80/10/10 has five non-overlapping ballots at low/mid/high.")
          print(f"Surviving fragmentation diversity: unique_assets={unique_frag_assets}, max_appearance={max_frag_appearance}")
          print("Overall diversity:", json.dumps(diag["diversity"], sort_keys=True))
          PY

      - name: Run repository regression suite
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Revalidate production Package Adjustment
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Verify only catalog outputs remain uncommitted
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True,
          ).splitlines())
          assert changed == expected, (changed, expected)
          print("PASS: only the two generated outputs remain to commit.")
          PY

      - name: Commit regenerated catalog
        shell: bash
        run: |
          set -euo pipefail

          git add research/package-adjustment-nextgen-v2/challenge_catalog_design.md research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
          }
          staged = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"],
              text=True,
          ).splitlines())
          assert staged == expected, (staged, expected)
          PY

          git commit -m "Regenerate NextGen V2 catalog after filler support review"

      - name: Prove total changed-file boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          expected = {
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
              "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md",
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
          }

          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"],
              text=True,
          ).splitlines())
          assert changed == expected, (changed, expected)

          assert subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).strip() == ""

          print("PASS: exactly four intended NextGen research files changed across the two commits.")
          PY

      - name: Final production guard
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Push two reviewed research commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          echo "Pushed:"
          git log --oneline -2
