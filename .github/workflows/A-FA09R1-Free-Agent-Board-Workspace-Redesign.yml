name: A-FA09R1 - Free Agent Board Workspace Redesign

# Presentation only. Rearranges existing DOM nodes without changing the canonical
# valuation engine, player values, IDP evidence, original IDs or browser-local imports.
# Preview reports changes; Apply commits only explicitly allowed UI files.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates the layout; Apply commits only navigation, styles and markup references"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  free-agent-organization:
    name: Free Agent Board organization (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm starting state and required UI
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -s free-agent-board.html
          test -s assets/idp_early_v1.js
          test -s assets/idp_weekly_radar_v1.js
          test -s assets/idp_opportunity_v1.js
          test -s assets/idp_intel_v1.js
          test -s data/idp_weekly_2026_public.json
