      - name: Validate JavaScript and safe additive installer
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_workspace_v1.js
          python3 - <<'PYAST'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/utilities/install_fa_workspace_v1.py').read_text(encoding='utf-8'))
          print('PASS Python installer syntax')
          PYAST
          python3 scripts/utilities/install_fa_workspace_v1.py
          python3 scripts/utilities/install_fa_workspace_v1.py
          git diff --check
      - name: Assert only four presentation files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          allowed={
              'free-agent-board.html',
              'assets/fa_workspace_v1.js',
              'assets/fa_workspace_v1.css',
              'scripts/utilities/install_fa_workspace_v1.py',
          }
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          paths={entry[3:] for entry in changed if len(entry)>3}
          if paths-allowed or not paths:
              raise RuntimeError('Unsafe/unexpected modifications: '+repr(sorted(paths)))
          html=Path('free-agent-board.html').read_text(encoding='utf-8')
          for x in ['<!-- FA_WORKSPACE_V1_STYLE -->','<!-- FA_WORKSPACE_V1_SCRIPT -->',
                    '<div id="boardWrap"></div>','id="idptPanel"',
                    '<!-- IDP_EARLY_V1_PANEL_START -->','<!-- IDP_INTEL_V1_PANEL_START -->',
                    '<!-- IDP_OPPORTUNITY_V1_PANEL_START -->','<script>\n/* CANONICAL VALUATION SYNC']:
              if html.count(x)!=1:
                  raise RuntimeError('Missing/duplicated original feature '+repr(x))
          if 'Private tool — kept local, never hosted or shared.' in html:
              raise RuntimeError('Misleading hosting/privacy claim still present')
          report={
              'workflow':'A-FA09R1',
              'mode':'${{ inputs.mode }}',
