name: CAL26 V1R9 - Owner Anchored 565 Player FV Shadow First Pricing Wave READ ONLY

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r9-owner-pricing-shadow-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  owner_anchored_fv_shadow:
    name: Exact 565 FV baseline, 13 owner-corroborated numeric pilot prices; production read only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout live production pricing inputs read only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python stdlib evaluator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned CAL26 V1R6 green 565 live price baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r9-source"
          gh run download 39645378760 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R6-Week6-Stable-Roles-Exact-FV-Shadow-READ-ONLY \
            --dir "$RUNNER_TEMP/cal26-v1r9-source"
          python3 - <<'PY_BASE'
          import os,hashlib,json
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'cal26-v1r9-source'
          expected={
            'CAL26_V1R6_All_565_Role_to_Live_FV_Impact.csv':'79171761c5578908c2d650f374e5f78ecebd4900944f7d824d022763767d0737',
            'CAL26_V1R6_Manifest.json':'6945d759795a49fd61eb1d6f2e16bb0beab7536f53a93111c0456a8268e220ac',
          }
          for rel,sha in expected.items():
            p=base/rel
            assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==sha,rel
          print('PASS exact green V1R6 565-player source')
          PY_BASE

      - name: Restore exact 80 owner's feedback with frozen content hash
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26-v1r9-owner-input.gz.b64" <<'CAL26_OWNER80_INPUT'
          
          CAL26_OWNER80_INPUT
          python3 - <<'PY_OWNER'
          from pathlib import Path
          import os,base64,gzip,hashlib,csv,io
          root=Path(os.environ['RUNNER_TEMP'])
          raw=gzip.decompress(base64.b64decode((root/'cal26-v1r9-owner-input.gz.b64').read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=='58f95a38b7ea0900d9655a88eedb59c0e1b39cd075e3a43c58d61ac3cbd46dde'
          r=list(csv.DictReader(io.StringIO(raw.decode('utf-8'))))
          assert len(r)==80 and len({(x['player'],x['position']) for x in r})==80
          (root/'cal26-v1r9-owner-feedback.csv').write_bytes(raw)
          print('PASS exactly 80 original owner rating rows, 18 accepted, hash pinned')
          PY_OWNER

      - name: Materialize and independently syntax-check owner-anchored FV engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r9_pricing_engine.py" <<'PY_CAL26_V1R9_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R9: owner-anchored 565-player price shadow, never a production edit.
          
          Source feedback concerns historical CAL26 *proposals*, not current live FV.
          Uses exact owner-accepted numeric companions only; 20% / 1000-point pilot
          bounds are conservative review triage, not statistical accuracy estimates.
          """
          import argparse, csv, hashlib, json, math, re, sys
          from collections import Counter
          from pathlib import Path
          
          OWNER_SHA='58f95a38b7ea0900d9655a88eedb59c0e1b39cd075e3a43c58d61ac3cbd46dde'
          BASE_SHA='79171761c5578908c2d650f374e5f78ecebd4900944f7d824d022763767d0737'
          BASE_MANIFEST_SHA='6945d759795a49fd61eb1d6f2e16bb0beab7536f53a93111c0456a8268e220ac'
          RELEASE_INDEX_SHA='ba004cfd250d9def3e1a83ea596b2aa411dc9b6fc50fa742836542ee832b986d'
          RELEASE_BOARD_SHA='768343bbaeba1fc8099016ed8d4bbe2ef8faad5504a8cf2d26497c6a11488c44'
          OWNER_COLUMNS=['player','position','current_fv','cal26_proposed_fv','cal26_rating','fv_plus_votes','fv_plus_votes_rating','market_value','market_rating','owner_lower_strict_gt','owner_upper_strict_lt']
          OUTPUT_COLS=['player','position','live_role','live_fv','cal26_proposed_fv_from_80','cal26_owner_rating','fv_plus_votes','fv_plus_votes_owner_rating','market_value','market_owner_rating','owner_lower_strict_gt','owner_upper_strict_lt','owner_anchor_value','owner_anchor_source','owner_anchor_count','pilot_candidate_fv','pilot_delta','pilot_percent','pilot_action','release_review_reason','original_cal26_proposal_status','role_price_impact_hold','accepted_proposal_price_protected','current_live_fv_preserved','unreviewed_no_proposal_invented','peer_rank_before','peer_rank_if_pilot']
          
          def require(cond,msg):
              if not cond: raise AssertionError('CAL26_V1R9_'+str(msg))
          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def rows(path):
              with Path(path).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def write(path, items, columns=OUTPUT_COLS):
              with Path(path).open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=columns,extrasaction='ignore');w.writeheader();w.writerows(items)
          def price(value):
              s=str(value if value is not None else '').strip()
              return int(float(s)) if s else None
          def truth(s):return str(s).strip().lower() in ('true','1')
          def owner_key(r):return (r['player'].casefold().strip(),r['position'])
          def value_rank(prices, key, pos):
              val=prices[key][0]
              return 1+sum(1 for p,(fv,position) in prices.items() if p!=key and position==pos and fv>val)
          
          def analyze(source, feedback, repo, out, allow_fixture=False):
              source=Path(source);feedback=Path(feedback);repo=Path(repo);out=Path(out);out.mkdir(parents=True,exist_ok=True)
              base_path=source/'CAL26_V1R6_All_565_Role_to_Live_FV_Impact.csv'
              man_path=source/'CAL26_V1R6_Manifest.json'
              require(sha(base_path)==BASE_SHA,'PINNED_565_CSV_SHA_DRIFT')
              require(sha(man_path)==BASE_MANIFEST_SHA,'PINNED_SOURCE_MANIFEST_SHA_DRIFT')
              require(sha(feedback)==OWNER_SHA,'OWNER_FEEDBACK_SHA_DRIFT')
              man=json.loads(man_path.read_text())
              require(man['status']=='PASS_CAL26_V1R6_ROLE_TO_EXACT_FV_SHADOW_ONLY' and man['output_player_count']==565,'BASE_MANIFEST_DRIFT')
              require(man['role_changed_nonzero_fv']==12 and man['accepted_fv_controls_count']==18,'BASE_COUNTS_WRONG')
              owner=rows(feedback);all_players=rows(base_path)
              require(len(owner)==80 and len({owner_key(r) for r in owner})==80,'OWNER_80_IDENTITY')
              require(all(all(k in r for k in OWNER_COLUMNS) for r in owner),'OWNER_SCHEMA')
              require(Counter(r['cal26_rating'] for r in owner)=={'Low':60,'Correct':18,'High':2},'OWNER_RATINGS_CHANGED')
              require(len(all_players)==565 and len({owner_key(r) for r in all_players})==565,'565_UNIQUE')
              require(sum(truth(r['protect_accepted_fv']) for r in all_players)==18,'FROZEN_OWNER_CONTROLS_COUNT')
              require(sum(truth(r['cal26_proposal_available']) for r in all_players)==80,'80_REVIEWED_PROPOSAL_COUNT')
              require(sum(r['cal26_v1r6_action']=='STABLE_STANDARD_SHADOW_PRICED' and int(r['raw_role_only_fv_delta'])!=0 for r in all_players)==12,'12_ROLE_PRICE_HOLDS_DRIFT')
              require(all(r['production_files_changed']=='False' for r in all_players),'SOURCE_NOT_READ_ONLY')
              o={owner_key(r):r for r in owner};a={owner_key(r):r for r in all_players}
              require(set(o).issubset(a),'FEEDBACK_PLAYERS_NOT_IN_LIVE_565')
              for k,r in o.items():
                  b=a[k];require(int(r['current_fv'])==int(b['live_fv_exact']),'OWNER_CURRENT_FV_DRIFT_'+str(k))
                  require(int(r['cal26_proposed_fv'])==int(b['cal26_proposed_fv_unchanged']),'OWNER_PROPOSAL_DRIFT_'+str(k))
                  require(truth(b['protect_accepted_fv'])==(r['cal26_rating']=='Correct'),'ACCEPTED_PRICE_CONTROL_DRIFT_'+str(k))
              # The production role-only release must have identical actual quoted prices.
              idx=repo/'index.html';board=repo/'free-agent-board.html'
              if not allow_fixture:
                  require(sha(idx)==RELEASE_INDEX_SHA,'PRODUCTION_INDEX_SHA_DRIFT_AFTER_V1R8')
                  require(sha(board)==RELEASE_BOARD_SHA,'PRODUCTION_BOARD_SHA_DRIFT_AFTER_V1R8')
                  release=json.loads((repo/'model/releases/cal26-v1r8-role-v2-98-week6-fv-neutral-2026-10-21-v1/release.json').read_text())
                  require(release['affected_role_count']==98 and release['live_fv_change_count']==0,'NOT_VERIFIED_RELEASE')
                  sys.path.insert(0,str(repo/'scripts/validation'))
                  import snapshot_values as sv
                  current=sv.compute_all_values(sv.load_from_html(idx))
                  require(len(current)==565,'LIVE_565_VALUE_COUNT_DRIFT')
                  for k,b in a.items():
                      real=current.get(k[0]);require(real is not None,'LIVE_MISSING_'+k[0])
                      require(real['pos']==k[1],'LIVE_POSITION_CHANGED_'+k[0])
                      require(real['value']==int(b['live_fv_exact']),'LIVE_FV_DRIFT_'+k[0])
              # Use post-V1R8 roles rather than stale V1R6 roles in exported comparison.
              html=idx.read_text(encoding='utf-8')
              live_roles={ (name.casefold(),pos):role for name,pos,role in re.findall(
                  r"^ '([^']+)':\{pos:'([A-Z]+)',age:\d+,role:'([^']+)'",html,re.M)}
              require(len(live_roles)==565 and set(live_roles)==set(a),'LIVE_565_PLAYER_ROLE_PARSE_FAILED')
              prices={k:(int(b['live_fv_exact']),k[1]) for k,b in a.items()}
              result=[];pilot=[];manual=[];role_holds=[];stats=Counter()
              for k,b in sorted(a.items()):
                  old=int(b['live_fv_exact']);p=k[1];f=o.get(k)
                  anchor='';source_name='';nc=0;action='NO_OWNER_FEEDBACK_PRICE_UNCHANGED' if f is None else 'NO_DIRECT_OWNER_CORRECT_PRICE_ANCHOR';reason='';pilot_target=None
                  accepted=bool(f and f['cal26_rating']=='Correct')
                  if accepted:
                      action='OWNER_ACCEPTED_CAL26_PROPOSAL_PROTECTED';reason='Owner rated existing CAL26 proposal Correct; not permission to replace current FV'
                  elif f and f['cal26_rating']=='High':
                      action='HIGH_RATED_PROPOSAL_NEGATIVE_CONTROL';reason='No numeric companion rated Correct; needs downward price review, not an invented target'
                  elif f and f['cal26_rating']=='Low':
                      anchors=[]
                      if f['fv_plus_votes_rating']=='Correct':anchors.append(('FV+Votes',price(f['fv_plus_votes'])))
                      if f['market_rating']=='Correct' and f['market_value']:anchors.append(('Market Value',price(f['market_value'])))
                      nc=len(anchors)
                      lower=price(f['owner_lower_strict_gt']);upper=price(f['owner_upper_strict_lt'])
                      # If a companion is rated correct, it must be strictly above all lower-rated
                      # anchors and below all higher-rated anchors; otherwise no strong target.
                      valid=[(label,v) for label,v in anchors if v is not None and v>int(f['cal26_proposed_fv'])
                              and (lower is None or v>lower) and (upper is None or v<upper) and v>old]
                      if valid:
                          source_name,anchor=min(valid,key=lambda x:(x[1]-old,x[1],x[0]))
                          delta=anchor-old
                          if delta<=1000 and delta/old<=0.20:
                              action='PILOT_OWNER_CORROBORATED_REVIEW_REQUIRED';pilot_target=anchor
                              reason='Owner rated this exact companion price Correct; candidate also improves a CAL26 proposal rated Low'
                          else:
                              action='LARGER_OWNER_CORROBORATED_MOVE_REVIEW';reason='Correct companion exists but proposed FV change exceeds 20% or 1000 FV pilot triage limit'
                      else:
                          action='LOW_PROPOSAL_NO_ELIGIBLE_NUMERIC_ANCHOR';reason='Direction is known, but no reviewed companion price passes live FV and all owner ordinal bounds'
                  elif f:
                      require(False,'UNKNOWN_OWNER_RATING')
                  isrole=(b['cal26_v1r6_action']=='STABLE_STANDARD_SHADOW_PRICED' and int(b['raw_role_only_fv_delta'])!=0)
                  if isrole:stats['role_sensitive_records']+=1
                  if accepted:stats['accepted_controls']+=1
                  if f:stats['owner_reviewed']+=1
                  stats[action]+=1
                  record={
                      'player':k[0],'position':p,'live_role':live_roles[k],'live_fv':old,
                      'cal26_proposed_fv_from_80':f['cal26_proposed_fv'] if f else '',
                      'cal26_owner_rating':f['cal26_rating'] if f else 'NOT_REVIEWED',
                      'fv_plus_votes':f['fv_plus_votes'] if f else '',
                      'fv_plus_votes_owner_rating':f['fv_plus_votes_rating'] if f else '',
                      'market_value':f['market_value'] if f else '',
                      'market_owner_rating':f['market_rating'] if f else '',
                      'owner_lower_strict_gt':f['owner_lower_strict_gt'] if f else '',
                      'owner_upper_strict_lt':f['owner_upper_strict_lt'] if f else '',
                      'owner_anchor_value':anchor,'owner_anchor_source':source_name,'owner_anchor_count':nc,
                      'pilot_candidate_fv':pilot_target if pilot_target else '',
                      'pilot_delta':(pilot_target-old) if pilot_target else 0,
                      'pilot_percent':f'{100*(pilot_target-old)/old:.2f}' if pilot_target else '',
                      'pilot_action':action,'release_review_reason':reason,
                      'original_cal26_proposal_status':'AVAILABLE_OWNER_REVIEWED' if f else 'NOT_AVAILABLE_DO_NOT_INVENT',
                      'role_price_impact_hold':str(isrole),'accepted_proposal_price_protected':str(accepted),
                      'current_live_fv_preserved':'True','unreviewed_no_proposal_invented':str(f is None),
                      'peer_rank_before':value_rank(prices,k,p),
                      'peer_rank_if_pilot':None,
                  }
                  if pilot_target:
                      scenario=dict(prices);scenario[k]=(pilot_target,p)
                      record['peer_rank_if_pilot']=value_rank(scenario,k,p)
                      pilot.append(record)
                  if action.startswith(('LOW_','LARGER_','HIGH_')):manual.append(record)
                  if isrole:role_holds.append(record)
                  result.append(record)
              require(len(result)==565 and len(pilot)==13 and stats['accepted_controls']==18 and stats['owner_reviewed']==80,'PRIMARY_COHORT_COUNTS_CHANGED')
              require(stats['role_sensitive_records']==12,'ROLE_PRICE_MOVERS_COUNT_WRONG')
              require(sum(int(r['unreviewed_no_proposal_invented']=='True') for r in result)==485,'UNREVIEWED_EXACT_485')
              require(not any(r['accepted_proposal_price_protected']=='True' and r['pilot_candidate_fv'] for r in result),'OWNER_CORRECT_MODIFIED')
              require(len(set(r['player'] for r in pilot))==13,'DUPLICATED_PILOT')
              require(all(int(r['pilot_delta'])>0 for r in pilot),'NONPOSITIVE_FIRST_WAVE')
              write(out/'CAL26_V1R9_565_Player_Owner_Anchor_Pricing_Shadow.csv',result)
              write(out/'CAL26_V1R9_13_Pilot_Owner_Corroborated_FV_Candidates.csv',sorted(pilot,key=lambda x:(x['position'],x['player'])))
              write(out/'CAL26_V1R9_Review_And_Held_Price_Cases.csv',manual)
              write(out/'CAL26_V1R9_12_Role_Price_Sensitivity_Holds.csv',role_holds)
              summary={
                  'status':'PASS_CAL26_V1R9_565_PLAYER_OWNER_ANCHORED_FV_SHADOW',
                  'production_changed':False,'production_price_released':False,
                  'cal26_feedback_is_rating_of_proposed_not_live_fv':True,
                  'frozen_live_source_week':6,'model_retrained':False,
                  'source_565_sha256':sha(base_path),'owner_feedback_sha256':sha(feedback),
                  'exact_current_production_source_verified':not allow_fixture,
                  'owner_feedback_count':80,'owner_cal26_low':60,'owner_cal26_correct_protected':18,'owner_cal26_high':2,
                  'unreviewed_unchanged_count':485,'pilot_count':len(pilot),
                  'pilot_delta_fv_total':sum(int(r['pilot_delta']) for r in pilot),
                  'pilot_absolute_uplift_limited_pct':20,'pilot_absolute_uplift_limited_points':1000,
                  'pilot_is_approval_not_accuracy':True,'role_price_movers_held':len(role_holds),
                  'action_counts':dict(sorted((k,v) for k,v in stats.items() if k not in ('owner_reviewed','accepted_controls','role_sensitive_records'))),
                  'artifact_sha256':{},
              }
              for f in out.glob('*.csv'):summary['artifact_sha256'][f.name]=sha(f)
              (out/'CAL26_V1R9_Manifest.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
              notes=['# CAL26 V1R9 — Owner-corroborated pricing shadow, 565 players','',
                     '**Research candidate, no production prices changed.**','',
                     'Feedback rated **CAL26 proposed FV** (not necessarily the existing live FV). The 80 players were selected by the owner; this is not a random holdout.',
                     '18 owner-accepted CAL26 proposals are protected from calibration; no unreviewed player was assigned an invented CAL26 proposal.',
                     '25 Low-rated proposed values have at least one FV+Votes or Market Value quote rated Correct; 13 meet the strict pilot-selection rules. Others remain in manual review.',
                     'Pilot: exact companion quote rated Correct, strictly above both the Low-rated CAL26 proposed FV and all recorded Low bounds; below any High bound; above current FV; <= 20% and <= 1000 FV increase.',
                     'The 20% / 1000 FV limits are **engineering triage constraints, not measured model accuracy or owner-selected point targets**.',
                     'The 12 separately held role-based mechanical price effects remain held. None is automatically applied.',
                     '', '## First-wave numeric candidates for explicit owner review',
                     '', '| Player | Pos | Live FV | Proposed shadow FV | Delta | Owner-rated Correct source |',
                     '|---|---|---:|---:|---:|---|']
              for r in sorted(pilot,key=lambda x:-int(x['pilot_delta'])):
                  notes.append(f"| {r['player'].title()} | {r['position']} | {int(r['live_fv']):,} | {int(r['pilot_candidate_fv']):,} | +{int(r['pilot_delta']):,} | {r['owner_anchor_source']} |")
              notes+=['','## Decision rule','',
                      'This pilot is owner-corroborated but not an unbiased accuracy estimate, and is NOT a general increase to 565 players. Consider owner approval or targeted changes after inspecting player context.',
                      'A real production integration must preserve all accepted price controls and unrelated inputs, update main index and synchronized free-agent board together, and verify exact 565 live prices after the proposed update.','']
              (out/'CAL26_V1R9_Review.md').write_text('\n'.join(notes),encoding='utf-8')
              print(json.dumps(summary,indent=2))
          
          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--source',required=True);p.add_argument('--feedback',required=True)
              p.add_argument('--repo',required=True);p.add_argument('--out',required=True)
              p.add_argument('--fixture',action='store_true')
              x=p.parse_args()
              analyze(x.source,x.feedback,x.repo,x.out,x.fixture)
          PY_CAL26_V1R9_ENGINE
          python3 - <<'PY_ENGINE'
          from pathlib import Path
          import os,hashlib,ast
          p=Path(os.environ['RUNNER_TEMP'])/'cal26_v1r9_pricing_engine.py'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8c8fb4cbac8b4da7fb2b0e96f5eaf88edee63c4f326b6b43ff353cb3357f5e3f'
          ast.parse(p.read_text())
          print('PASS V1R9 engine source SHA and Python AST')
          PY_ENGINE

      - name: Execute 565-player fixture, validate 13 pilot records and tamper failure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r9_pricing_engine.py" \
            --source "$RUNNER_TEMP/cal26-v1r9-source" \
            --feedback "$RUNNER_TEMP/cal26-v1r9-owner-feedback.csv" \
            --repo . --out "$RUNNER_TEMP/cal26-v1r9-fixture" --fixture
          python3 - <<'PY_NEGATIVE'
          import csv,json,os,subprocess,sys,tempfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          man=json.loads((root/'cal26-v1r9-fixture/CAL26_V1R9_Manifest.json').read_text())
          assert man['pilot_count']==13 and man['owner_cal26_correct_protected']==18
          assert man['owner_feedback_count']==80 and man['unreviewed_unchanged_count']==485
          assert man['role_price_movers_held']==12
          with (root/'cal26-v1r9-fixture/CAL26_V1R9_13_Pilot_Owner_Corroborated_FV_Candidates.csv').open() as f:
            x=list(csv.DictReader(f))
          assert len(x)==13 and len({row['player'] for row in x})==13
          assert all(0<int(xr['pilot_delta'])<=1000 and 0<float(xr['pilot_percent'])<=20 for xr in x)
          with tempfile.TemporaryDirectory(prefix='cal26-v1r9-negative-') as tmp:
            bad=Path(tmp)/'tampered_feedback.csv'
            text=(root/'cal26-v1r9-owner-feedback.csv').read_text()
            bad.write_text(text.replace('Fernando Mendoza','Fernando MendozaTampered',1))
            p=subprocess.run([sys.executable,str(root/'cal26_v1r9_pricing_engine.py'),'--source',str(root/'cal26-v1r9-source'),
              '--feedback',str(bad),'--repo','.', '--out',str(Path(tmp)/'out'),'--fixture'],capture_output=True,text=True)
            assert p.returncode!=0 and 'OWNER_FEEDBACK_SHA_DRIFT' in p.stderr,p.stderr
          print('PASS 565/80/18/485/13/12 fixture, per-player cap, negative tamper evidence check')
          PY_NEGATIVE

      - name: Verify against CURRENT canonical production FV for all 565 and publish shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r9_pricing_engine.py" \
            --source "$RUNNER_TEMP/cal26-v1r9-source" \
            --feedback "$RUNNER_TEMP/cal26-v1r9-owner-feedback.csv" \
            --repo . --out "$RUNNER_TEMP/cal26-v1r9-output"

      - name: Independently check release scope, source lock and untouched production files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_FINAL'
          import os,json,hashlib,csv
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'cal26-v1r9-output'
          m=json.loads((r/'CAL26_V1R9_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R9_565_PLAYER_OWNER_ANCHORED_FV_SHADOW'
          assert m['exact_current_production_source_verified'] is True
          assert m['production_changed'] is False and m['production_price_released'] is False
          assert m['pilot_count']==13 and m['owner_cal26_correct_protected']==18 and m['unreviewed_unchanged_count']==485
          assert m['role_price_movers_held']==12
          for name,dig in m['artifact_sha256'].items():
            assert hashlib.sha256((r/name).read_bytes()).hexdigest()==dig,name
          with (r/'CAL26_V1R9_565_Player_Owner_Anchor_Pricing_Shadow.csv').open() as f:x=list(csv.DictReader(f))
          assert len(x)==565 and sum(a['pilot_candidate_fv']!='' for a in x)==13
          assert sum(a['accepted_proposal_price_protected']=='True' for a in x)==18
          assert sum(a['unreviewed_no_proposal_invented']=='True' for a in x)==485
          assert all(a['current_live_fv_preserved']=='True' for a in x)
