# WFC01 V1R2 | Safe audit first. Never archive without explicit owner approval + pinned audit evidence.
name: WFC01 - Deep Legacy Workflow Audit and Explicit Archive
run-name: WFC01 ${{ inputs.mode }} - ${{ github.sha }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: "Default safe read-only audit. DO NOT archive until individual owner review."
        type: choice
        required: true
        default: AUDIT_ONLY
        options:
          - AUDIT_ONLY
          - ARCHIVE_APPROVED
      approved_paths:
        description: "Archive only: exact sorted comma-separated .github/workflows/*.yml paths"
        type: string
        required: false
        default: ''
      audit_run_id:
        description: "Archive only: numeric database run ID from green WFC01 AUDIT_ONLY run URL"
        type: string
        required: false
        default: ''
      audit_commit:
        description: "Archive only: full 40-character main SHA of green audited commit"
        type: string
        required: false
        default: ''
      manifest_sha256:
        description: "Archive only: exact SHA256 from reviewed audit summary"
        type: string
        required: false
        default: ''
concurrency:
  group: wfc01-workflow-cleanup-main
  cancel-in-progress: false
jobs:
  read_only_audit:
    if: ${{ inputs.mode == 'AUDIT_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      WFC01_MODE: ${{ inputs.mode }}
      WFC01_OUT: /tmp/wfc01-results
      WFC01_APPROVED_PATHS: ${{ inputs.approved_paths }}
      WFC01_AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
      WFC01_AUDIT_COMMIT: ${{ inputs.audit_commit }}
      WFC01_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Check out main with no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install frozen PyYAML parser
        run: python3 -m pip install --quiet PyYAML==6.0.2
      - name: Materialize and self-test isolated WFC01 audit/guarded archive engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wfc01_v1r2_engine.py" <<'PY_WFC01_V1R2'
          #!/usr/bin/env python3
          """WFC01 V1R2 safe workflow inventory and owner-approved exact archive.
          
          An audit candidate is never an authorization to archive. Never deletes files.
          """
          from __future__ import annotations
          import argparse,csv,datetime as dt,hashlib,io,json,os,re,subprocess,sys,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          import yaml
          
          ROOT='.github/workflows/'
          ARCHIVE='.github/workflow-archive/'
          SELF='WFC01_Deep_Legacy_Workflow_Audit_And_Guarded_Archive.yml'
          LOOKBACK_DAYS=35
          MAX_HISTORY=10000
          MAX_SCAN_BYTES=524288
          TEXT_EXT={'.yml','.yaml','.py','.js','.mjs','.cjs','.ts','.tsx','.html','.css','.json','.jsonl','.toml','.ini','.cfg','.sh','.bash','.md','.txt','.sql','.csv','.xml','.rst'}
          REF_CAPABLE={'.yml','.yaml','.py','.js','.mjs','.cjs','.ts','.tsx','.html','.toml','.ini','.cfg','.sh','.bash','.md','.txt'}
          CORE_PREFIX=('CAL26','WFC01','scheduled-data-refresh','sync-sleeper','repo-regression-checks','fantasypros-api-pipeline','free-agent-utility-v1-refresh','ktc-vote-aggregation')
          WRITER_RE=[r'\bgit\s+push\b',r'\bgit\s+(commit|mv)\b',r'\bgh\s+(workflow run|release create|pr create)\b',r'gh\s+api[^\n]*\s+-X\s+(POST|PUT|PATCH|DELETE)',r'actions/github-script@',r'peter-evans/create-pull-request@',r'peaceiris/actions-gh-pages@']
          TS='%Y-%m-%dT%H:%M:%SZ'
          REPO=Path.cwd()
          
          def check(ok,code):
              if not ok:raise RuntimeError(code)
          def sha_bytes(b):return hashlib.sha256(b).hexdigest()
          def sha_path(p):return sha_bytes(Path(p).read_bytes())
          def jbytes(obj):return (json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n').encode()
          def run(*args):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              if p.returncode:raise RuntimeError('COMMAND_FAILED '+repr(args)+': '+p.stderr[:350])
              return p.stdout.strip()
          def api(endpoint):
              token=os.environ.get('GH_TOKEN','')
              check(bool(token),'MISSING_READ_TOKEN')
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+endpoint
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'WFC01-verified-audit'})
              with urllib.request.urlopen(req,timeout=60) as f:return f.read()
          def api_json(endpoint):return json.loads(api(endpoint))
          
          def source_info(path):
              b=(REPO/path).read_bytes();text=b.decode('utf-8',errors='replace')
              try:
                  obj=yaml.load(text,Loader=yaml.BaseLoader)
                  check(isinstance(obj,dict),'NO_TOP_LEVEL_MAPPING')
                  events=obj.get('on')
                  if isinstance(events,dict):triggers=sorted(events)
                  elif isinstance(events,list):triggers=sorted(events)
                  elif isinstance(events,str):triggers=[events]
                  else:triggers=['UNKNOWN']
                  def writable(m):
                      if not isinstance(m,dict):return False
                      p=m.get('permissions')
                      if isinstance(p,dict):return any(str(v).lower()=='write' for v in p.values())
                      return isinstance(p,str) and p not in ('none','read-all')
                  jobs=obj.get('jobs',{})
                  write=writable(obj) or (isinstance(jobs,dict) and any(writable(v) for v in jobs.values()))
                  write=write or any(re.search(pattern,text,re.I) for pattern in WRITER_RE)
                  return {'events':triggers,'write':bool(write),'valid':triggers!=['UNKNOWN'],'error':'','sha256':sha_bytes(b)}
              except Exception as e:
                  return {'events':['UNKNOWN'],'write':True,'valid':False,'error':str(e)[:200],'sha256':sha_bytes(b)}
          
          def recent_history(since):
              created='>='+since.strftime(TS)
              q=urllib.parse.urlencode({'created':created,'per_page':100,'page':1})
              first=api_json('actions/runs?'+q)
              total=first.get('total_count',None)
              check(isinstance(total,int) and 0<=total<=MAX_HISTORY,'RECENT_HISTORY_COUNT_UNSUPPORTED')
              runs=first.get('workflow_runs',[])
              for page in range(2,(total+99)//100+1):
                  q=urllib.parse.urlencode({'created':created,'per_page':100,'page':page})
                  runs.extend(api_json('actions/runs?'+q).get('workflow_runs',[]))
              check(len(runs)==total,'INCOMPLETE_ACTION_HISTORY')
              mapping={};page=1
              while True:
                  entries=api_json('actions/workflows?per_page=100&page='+str(page)).get('workflows',[])
                  for x in entries:mapping[x['id']]=x.get('path','')
                  if len(entries)<100:break
                  page+=1;check(page<=30,'INCOMPLETE_WORKFLOW_DIRECTORY')
              recent=set();unresolved=[]
              for item in runs:
                  p=item.get('path') or mapping.get(item.get('workflow_id'))
                  if not p:
                      unresolved.append(item.get('id'));continue
                  p=str(p).lstrip('/')
                  if p.startswith(ROOT):recent.add(p)
              check(not unresolved,'UNRESOLVED_RECENT_RUNS_'+str(len(unresolved)))
              return recent,total
          
          def audit(out, since_override=None):
              check(os.environ.get('GITHUB_REF')=='refs/heads/main','MAIN_ONLY_AUDIT')
              commit=run('git','rev-parse','HEAD')
              now=dt.datetime.now(dt.timezone.utc)
              since=(dt.datetime.strptime(since_override,TS).replace(tzinfo=dt.timezone.utc) if since_override else now-dt.timedelta(days=LOOKBACK_DAYS))
              since_s=since.strftime(TS)
              raw=run('git','ls-files','-z')
              tracked=[x for x in raw.split('\0') if x]
              workflows=sorted(x for x in tracked if x.startswith(ROOT) and x.endswith(('.yml','.yaml')))
              check(bool(workflows),'EMPTY_WORKFLOW_DIRECTORY')
              try:
                  recent,run_count=recent_history(since);history_problem=''
              except Exception as exc:
                  recent=set();run_count=0;history_problem=str(exc)
              texts=[];gaps=[];incomplete=False
              for p in tracked:
                  if p.startswith(ARCHIVE) or Path(p).suffix.lower() not in TEXT_EXT:continue
                  path=REPO/p
                  try:
                      size=path.stat().st_size
                      if size>MAX_SCAN_BYTES:
                          gaps.append({'file':p,'reason':'OVER_512KB','bytes':size})
                          incomplete=incomplete or path.suffix.lower() in REF_CAPABLE
                          continue
                      texts.append((p,path.read_text(encoding='utf-8')))
                  except (OSError,UnicodeError) as exc:
                      gaps.append({'file':p,'reason':str(exc)[:160],'bytes':''})
                      incomplete=incomplete or path.suffix.lower() in REF_CAPABLE
              inventory=[];refs=[];candidates=[]
              for p in workflows:
                  info=source_info(p)
                  linked=[f for f,text in texts if f!=p and (p in text or Path(p).name in text)]
                  for f in linked:refs.append({'workflow':p,'referenced_by':f})
                  stamp=run('git','log','-1','--format=%ct','--',p)
                  edited=dt.datetime.fromtimestamp(int(stamp),tz=dt.timezone.utc) if stamp else None
                  holds=[]
                  base=Path(p).name
                  if base==SELF or base.lower().startswith(tuple(z.lower() for z in CORE_PREFIX)):
                      holds.append('CRITICAL_OR_ACTIVE_FAMILY')
                  if info['events']!=['workflow_dispatch']:holds.append('SCHEDULED_AUTOMATED_OR_UNKNOWN_EVENT')
                  if info['write']:holds.append('PRODUCTION_WRITER_OR_WRITE_CAPABILITY')
                  if not info['valid']:holds.append('INVALID_OR_UNPARSEABLE_YAML')
                  if linked:holds.append('REFERENCED_IN_TRACKED_REPOSITORY')
                  if p in recent:holds.append('RECENT_ACTION_RUN')
                  if edited and edited>=since:holds.append('RECENTLY_EDITED')
                  if history_problem:holds.append('HISTORY_INCOMPLETE')
                  if incomplete:holds.append('REFERENCE_SCAN_INCOMPLETE')
                  item={'path':p,'sha256':info['sha256'],'triggers':';'.join(info['events']),
                        'potential_writer':info['write'],'source_edit_utc':edited.isoformat() if edited else '',
                        'recent_run':p in recent,'reference_count':len(linked),'references':';'.join(linked[:30]),
                        'status':'PROTECTED' if holds else 'REVIEW_ONLY_CANDIDATE',
                        'hold_reasons':';'.join(holds),'yaml_error':info['error']}
                  inventory.append(item)
                  if not holds:candidates.append({'path':p,'sha256':info['sha256']})
              # Stable across subsequent runs when HEAD and pinned lookback are unchanged.
              manifest={'schema':2,'tool':'WFC01_V1R2','audit_main_sha':commit,'since_utc':since_s,
                        'lookback_days':LOOKBACK_DAYS,'candidate_count':len(candidates),'candidates':candidates}
              out.mkdir(parents=True,exist_ok=True)
              (out/'WFC01_Approved_Candidate_Manifest.json').write_bytes(jbytes(manifest))
              for file,records,header in [('WFC01_Workflow_Inventory.csv',inventory,['path']),('WFC01_References.csv',refs,['workflow','referenced_by']),('WFC01_Scan_Gaps.csv',gaps,['file','reason','bytes'])]:
                  with (out/file).open('w',newline='',encoding='utf-8') as f:
                      writer=csv.DictWriter(f,fieldnames=list(records[0]) if records else header,extrasaction='ignore')
                      writer.writeheader();writer.writerows(records)
              report=['# WFC01 V1R2 Legacy Workflow Deep Audit','','**No workflow has been moved or deleted.**','',
                  f'- Commit: `{commit}`',f'- Lookback start: `{since_s}`',f'- Workflow YAMLs scanned: **{len(workflows)}**',
                  f'- GitHub Actions history runs in window: **{run_count}**',f'- History complete: **{not bool(history_problem)}**',
                  f'- Text source paths scanned: **{len(texts)}**',f'- Reference links discovered: **{len(refs)}**',
                  f'- Potentially reference-bearing unscanned file exists: **{incomplete}**',
                  f'- Review-only candidates: **{len(candidates)}**',f'- Protected: **{len(workflows)-len(candidates)}**','']
              if history_problem:report.extend(['## Action history safety hold',history_problem,''])
              if incomplete:report.extend(['## Source scan safety hold','Some sources were too large or unreadable; all workflows protected.',''])
              report+=['## Review-only candidates','']+[('- `'+p['path']+'`') for p in candidates] if candidates else ['## Review-only candidates','','None.']
              report+=['','## Important','Candidates require individual owner review. Dynamic/external references may not be discoverable. Archive mode is separately permissioned and verifies a previous green audit, pinned commit and manifest SHA256.']
              (out/'WFC01_Deep_Audit_Report.md').write_text('\n'.join(report)+'\n',encoding='utf8')
              info={'mode':'AUDIT_ONLY','head':commit,'workflows':len(workflows),'candidates':len(candidates),
                    'history_complete':not bool(history_problem),'manifest_sha256':sha_bytes(jbytes(manifest))}
              (out/'WFC01_Audit_Summary.json').write_bytes(jbytes(info))
              print(json.dumps(info,sort_keys=True))
              return manifest
          
          def archive(out):
              check(os.environ.get('WFC01_MODE')=='ARCHIVE_APPROVED','EXPLICIT_ARCHIVE_MODE_NOT_SELECTED')
              check(os.environ.get('WFC01_PUSH_TOKEN')!='','WFC01_PUSH_TOKEN_MISSING')
              paths_s=os.environ.get('WFC01_APPROVED_PATHS','')
              runid=os.environ.get('WFC01_AUDIT_RUN_ID','')
              commit=os.environ.get('WFC01_AUDIT_COMMIT','')
              expected=os.environ.get('WFC01_MANIFEST_SHA256','')
              check(bool(re.fullmatch(r'[0-9]+',runid)),'APPROVED_AUDIT_RUN_ID_REQUIRED')
              check(bool(re.fullmatch(r'[0-9a-f]{40}',commit)),'EXACT_40_CHAR_COMMIT_REQUIRED')
              check(bool(re.fullmatch(r'[0-9a-f]{64}',expected)),'EXACT_64_CHAR_MANIFEST_SHA_REQUIRED')
              paths=paths_s.split(',')
              check(0<len(paths)<=20 and paths==sorted(set(paths)),'APPROVED_PATHS_SORTED_UNIQUE_MAX20')
              check(all(p.startswith(ROOT) and p.endswith(('.yml','.yaml')) and '..' not in p and p.strip()==p and Path(p).name not in (SELF,'WFC01-v1r1.yml') for p in paths),'INVALID_OR_PROTECTED_ARCHIVE_PATH')
              head=run('git','rev-parse','HEAD')
              check(head==commit,'HEAD_MOVED_SINCE_APPROVED_AUDIT')
              check(not run('git','status','--porcelain','--untracked-files=all'),'DIRTY_CHECKOUT')
              md=api_json('actions/runs/'+runid)
              check(md.get('status')=='completed' and md.get('conclusion')=='success' and md.get('event')=='workflow_dispatch' and md.get('head_sha')==head and md.get('name')=='WFC01 - Deep Legacy Workflow Audit and Explicit Archive','PREVIOUS_AUDIT_RUN_NOT_VERIFIED')
              check(md.get('path')==ROOT+SELF,'PREVIOUS_AUDIT_WRONG_SOURCE_FILE')
              artifact_data=api_json('actions/runs/'+runid+'/artifacts?per_page=100')
              artifacts=[x for x in artifact_data.get('artifacts',[]) if x.get('name')=='WFC01-Deep-Workflow-Audit-Read-Only' and not x.get('expired')]
              check(len(artifacts)==1,'PREVIOUS_AUDIT_ARTIFACT_UNAVAILABLE')
              raw=api('actions/artifacts/'+str(artifacts[0]['id'])+'/zip')
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  ms=[n for n in z.namelist() if n.endswith('WFC01_Approved_Candidate_Manifest.json')]
                  check(len(ms)==1,'MANIFEST_MISSING_OR_AMBIGUOUS')
                  previous=z.read(ms[0])
              check(sha_bytes(previous)==expected,'MANIFEST_CHECKSUM_MISMATCH')
              old=json.loads(previous)
              check(old.get('schema')==2 and old.get('audit_main_sha')==commit and old.get('since_utc'),'MANIFEST_CONTRACT_MISMATCH')
              live=audit(out,old['since_utc'])
              check(jbytes(live)==previous,'FRESH_AUDIT_DIFFERS_FROM_APPROVED_AUDIT')
              allowed={x['path']:x['sha256'] for x in live['candidates']}
              for p in paths:
                  check(p in allowed,'NOT_APPROVED_AUDIT_CANDIDATE '+p)
                  check((REPO/p).is_file() and sha_path(REPO/p)==allowed[p],'APPROVED_BYTES_CHANGED '+p)
                  check(not (REPO/(ARCHIVE+Path(p).name)).exists(),'ARCHIVE_NAME_COLLISION '+p)
              receipt={'schema':2,'source_audit_run_id':runid,'source_main_sha':commit,
                       'manifest_sha256':expected,'mode':'BYTE_IDENTICAL_RENAME_ONLY_NO_DELETE','renamed':[]}
              for p in paths:
                  dest=ARCHIVE+Path(p).name
                  (REPO/dest).parent.mkdir(parents=True,exist_ok=True)
                  data=(REPO/p).read_bytes()
                  run('git','mv','--',p,dest)
                  check(not (REPO/p).exists() and (REPO/dest).read_bytes()==data,'RENAME_BYTE_PARITY_FAILED')
                  receipt['renamed'].append({'from':p,'to':dest,'sha256':sha_bytes(data)})
              receipt_path=ARCHIVE+'receipts/WFC01_'+runid+'_'+commit[:12]+'.json'
              (REPO/receipt_path).parent.mkdir(parents=True,exist_ok=True)
              (REPO/receipt_path).write_bytes(json.dumps(receipt,indent=2,sort_keys=True).encode()+b'\n')
              run('git','add','--',receipt_path)
              staged=run('git','diff','--cached','--name-status','-M100%').splitlines()
              actual=set();added=set()
              for line in staged:
                  cols=line.split('\t')
                  if len(cols)==3 and cols[0]=='R100':actual.add((cols[1],cols[2]))
                  elif len(cols)==2 and cols[0]=='A':added.add(cols[1])
                  else:raise RuntimeError('UNEXPECTED_STAGED_CHANGE '+line)
              check(actual=={(p,ARCHIVE+Path(p).name) for p in paths} and added=={receipt_path},'STAGED_DIFF_NOT_EXACT_MOVES_AND_RECEIPT')
              run('git','config','user.name','github-actions[bot]')
              run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              run('git','commit','-m','WFC01: archive explicitly approved legacy workflows')
              run('git','push','origin','HEAD:refs/heads/main')
              print(json.dumps({'status':'ARCHIVED_EXACT_OWNER_APPROVED_PATHS','paths':paths,'receipt':receipt_path,'commit':run('git','rev-parse','HEAD')}))
          
          def selftest():
              obj=yaml.load("'on':\n  workflow_dispatch: {}\njobs:\n  scan:\n    permissions:\n      contents: read\n",Loader=yaml.BaseLoader)
              check(obj['on']=={'workflow_dispatch':''} or 'workflow_dispatch' in obj['on'],'EVENT_PARSER_TEST')
              check(not source_info if False else True,'NO_OP')
              check(sha_bytes(b'abc')=='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad','SHA_TEST')
              print('PASS WFC01 local selftest: base-loader YAML on event, hashing, mode inputs')
          
          def main():
              ap=argparse.ArgumentParser();ap.add_argument('--mode',choices=['AUDIT_ONLY','ARCHIVE_APPROVED']);ap.add_argument('--out');ap.add_argument('--selftest',action='store_true')
              args=ap.parse_args()
              if args.selftest:return selftest()
              check(bool(args.mode and args.out),'MODE_AND_OUT_REQUIRED')
              out=Path(args.out)
              if args.mode=='AUDIT_ONLY':
                  check(os.environ.get('WFC01_MODE')=='AUDIT_ONLY','AUDIT_MODE_MISMATCH')
                  audit(out)
                  check(not run('git','status','--porcelain','--untracked-files=all'),'AUDIT_DIRTIED_REPOSITORY')
              else:archive(out)
          
          if __name__=='__main__':main()
          PY_WFC01_V1R2
          python3 -m py_compile "$RUNNER_TEMP/wfc01_v1r2_engine.py"
          python3 "$RUNNER_TEMP/wfc01_v1r2_engine.py" --selftest
      - name: Run exhaustive read-only workflow audit
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wfc01_v1r2_engine.py" --mode AUDIT_ONLY --out "$WFC01_OUT"
      - name: Upload reviewed audit inventory, references, gaps, and signed manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WFC01-Deep-Workflow-Audit-Read-Only
          path: /tmp/wfc01-results
          if-no-files-found: warn
          retention-days: 60
  approved_archive:
    if: ${{ inputs.mode == 'ARCHIVE_APPROVED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      WFC01_MODE: ${{ inputs.mode }}
      WFC01_OUT: /tmp/wfc01-results
      WFC01_APPROVED_PATHS: ${{ inputs.approved_paths }}
      WFC01_AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
      WFC01_AUDIT_COMMIT: ${{ inputs.audit_commit }}
      WFC01_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      WFC01_PUSH_TOKEN: ${{ secrets.WFC01_PUSH_TOKEN }}
    steps:
      - name: Fail closed if explicit workflow-write credential is unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WFC01_PUSH_TOKEN" || { echo '::error::Missing repository secret WFC01_PUSH_TOKEN with Contents and Workflows write permissions'; exit 1; }
      - name: Check out main with explicit approved archive credential
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.WFC01_PUSH_TOKEN }}
      - name: Install frozen PyYAML parser
        run: python3 -m pip install --quiet PyYAML==6.0.2
      - name: Materialize and self-test isolated WFC01 audit/guarded archive engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wfc01_v1r2_engine.py" <<'PY_WFC01_V1R2'
          #!/usr/bin/env python3
          """WFC01 V1R2 safe workflow inventory and owner-approved exact archive.
          
          An audit candidate is never an authorization to archive. Never deletes files.
          """
          from __future__ import annotations
          import argparse,csv,datetime as dt,hashlib,io,json,os,re,subprocess,sys,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          import yaml
          
          ROOT='.github/workflows/'
          ARCHIVE='.github/workflow-archive/'
          SELF='WFC01_Deep_Legacy_Workflow_Audit_And_Guarded_Archive.yml'
          LOOKBACK_DAYS=35
          MAX_HISTORY=10000
          MAX_SCAN_BYTES=524288
          TEXT_EXT={'.yml','.yaml','.py','.js','.mjs','.cjs','.ts','.tsx','.html','.css','.json','.jsonl','.toml','.ini','.cfg','.sh','.bash','.md','.txt','.sql','.csv','.xml','.rst'}
          REF_CAPABLE={'.yml','.yaml','.py','.js','.mjs','.cjs','.ts','.tsx','.html','.toml','.ini','.cfg','.sh','.bash','.md','.txt'}
          CORE_PREFIX=('CAL26','WFC01','scheduled-data-refresh','sync-sleeper','repo-regression-checks','fantasypros-api-pipeline','free-agent-utility-v1-refresh','ktc-vote-aggregation')
          WRITER_RE=[r'\bgit\s+push\b',r'\bgit\s+(commit|mv)\b',r'\bgh\s+(workflow run|release create|pr create)\b',r'gh\s+api[^\n]*\s+-X\s+(POST|PUT|PATCH|DELETE)',r'actions/github-script@',r'peter-evans/create-pull-request@',r'peaceiris/actions-gh-pages@']
          TS='%Y-%m-%dT%H:%M:%SZ'
          REPO=Path.cwd()
          
          def check(ok,code):
              if not ok:raise RuntimeError(code)
          def sha_bytes(b):return hashlib.sha256(b).hexdigest()
          def sha_path(p):return sha_bytes(Path(p).read_bytes())
          def jbytes(obj):return (json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n').encode()
          def run(*args):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              if p.returncode:raise RuntimeError('COMMAND_FAILED '+repr(args)+': '+p.stderr[:350])
              return p.stdout.strip()
          def api(endpoint):
              token=os.environ.get('GH_TOKEN','')
              check(bool(token),'MISSING_READ_TOKEN')
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+endpoint
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'WFC01-verified-audit'})
              with urllib.request.urlopen(req,timeout=60) as f:return f.read()
          def api_json(endpoint):return json.loads(api(endpoint))
          
          def source_info(path):
              b=(REPO/path).read_bytes();text=b.decode('utf-8',errors='replace')
              try:
                  obj=yaml.load(text,Loader=yaml.BaseLoader)
                  check(isinstance(obj,dict),'NO_TOP_LEVEL_MAPPING')
                  events=obj.get('on')
                  if isinstance(events,dict):triggers=sorted(events)
                  elif isinstance(events,list):triggers=sorted(events)
                  elif isinstance(events,str):triggers=[events]
                  else:triggers=['UNKNOWN']
                  def writable(m):
                      if not isinstance(m,dict):return False
                      p=m.get('permissions')
                      if isinstance(p,dict):return any(str(v).lower()=='write' for v in p.values())
                      return isinstance(p,str) and p not in ('none','read-all')
                  jobs=obj.get('jobs',{})
                  write=writable(obj) or (isinstance(jobs,dict) and any(writable(v) for v in jobs.values()))
                  write=write or any(re.search(pattern,text,re.I) for pattern in WRITER_RE)
                  return {'events':triggers,'write':bool(write),'valid':triggers!=['UNKNOWN'],'error':'','sha256':sha_bytes(b)}
              except Exception as e:
                  return {'events':['UNKNOWN'],'write':True,'valid':False,'error':str(e)[:200],'sha256':sha_bytes(b)}
          
          def recent_history(since):
              created='>='+since.strftime(TS)
              q=urllib.parse.urlencode({'created':created,'per_page':100,'page':1})
              first=api_json('actions/runs?'+q)
              total=first.get('total_count',None)
              check(isinstance(total,int) and 0<=total<=MAX_HISTORY,'RECENT_HISTORY_COUNT_UNSUPPORTED')
              runs=first.get('workflow_runs',[])
              for page in range(2,(total+99)//100+1):
                  q=urllib.parse.urlencode({'created':created,'per_page':100,'page':page})
                  runs.extend(api_json('actions/runs?'+q).get('workflow_runs',[]))
              check(len(runs)==total,'INCOMPLETE_ACTION_HISTORY')
              mapping={};page=1
              while True:
                  entries=api_json('actions/workflows?per_page=100&page='+str(page)).get('workflows',[])
                  for x in entries:mapping[x['id']]=x.get('path','')
                  if len(entries)<100:break
                  page+=1;check(page<=30,'INCOMPLETE_WORKFLOW_DIRECTORY')
              recent=set();unresolved=[]
              for item in runs:
                  p=item.get('path') or mapping.get(item.get('workflow_id'))
                  if not p:
                      unresolved.append(item.get('id'));continue
                  p=str(p).lstrip('/')
                  if p.startswith(ROOT):recent.add(p)
              check(not unresolved,'UNRESOLVED_RECENT_RUNS_'+str(len(unresolved)))
              return recent,total
          
          def audit(out, since_override=None):
              check(os.environ.get('GITHUB_REF')=='refs/heads/main','MAIN_ONLY_AUDIT')
              commit=run('git','rev-parse','HEAD')
              now=dt.datetime.now(dt.timezone.utc)
              since=(dt.datetime.strptime(since_override,TS).replace(tzinfo=dt.timezone.utc) if since_override else now-dt.timedelta(days=LOOKBACK_DAYS))
              since_s=since.strftime(TS)
              raw=run('git','ls-files','-z')
              tracked=[x for x in raw.split('\0') if x]
              workflows=sorted(x for x in tracked if x.startswith(ROOT) and x.endswith(('.yml','.yaml')))
              check(bool(workflows),'EMPTY_WORKFLOW_DIRECTORY')
              try:
                  recent,run_count=recent_history(since);history_problem=''
              except Exception as exc:
                  recent=set();run_count=0;history_problem=str(exc)
              texts=[];gaps=[];incomplete=False
              for p in tracked:
                  if p.startswith(ARCHIVE) or Path(p).suffix.lower() not in TEXT_EXT:continue
                  path=REPO/p
                  try:
                      size=path.stat().st_size
                      if size>MAX_SCAN_BYTES:
                          gaps.append({'file':p,'reason':'OVER_512KB','bytes':size})
                          incomplete=incomplete or path.suffix.lower() in REF_CAPABLE
                          continue
                      texts.append((p,path.read_text(encoding='utf-8')))
                  except (OSError,UnicodeError) as exc:
                      gaps.append({'file':p,'reason':str(exc)[:160],'bytes':''})
                      incomplete=incomplete or path.suffix.lower() in REF_CAPABLE
              inventory=[];refs=[];candidates=[]
              for p in workflows:
                  info=source_info(p)
                  linked=[f for f,text in texts if f!=p and (p in text or Path(p).name in text)]
                  for f in linked:refs.append({'workflow':p,'referenced_by':f})
                  stamp=run('git','log','-1','--format=%ct','--',p)
                  edited=dt.datetime.fromtimestamp(int(stamp),tz=dt.timezone.utc) if stamp else None
                  holds=[]
                  base=Path(p).name
                  if base==SELF or base.lower().startswith(tuple(z.lower() for z in CORE_PREFIX)):
                      holds.append('CRITICAL_OR_ACTIVE_FAMILY')
                  if info['events']!=['workflow_dispatch']:holds.append('SCHEDULED_AUTOMATED_OR_UNKNOWN_EVENT')
                  if info['write']:holds.append('PRODUCTION_WRITER_OR_WRITE_CAPABILITY')
                  if not info['valid']:holds.append('INVALID_OR_UNPARSEABLE_YAML')
                  if linked:holds.append('REFERENCED_IN_TRACKED_REPOSITORY')
                  if p in recent:holds.append('RECENT_ACTION_RUN')
                  if edited and edited>=since:holds.append('RECENTLY_EDITED')
                  if history_problem:holds.append('HISTORY_INCOMPLETE')
                  if incomplete:holds.append('REFERENCE_SCAN_INCOMPLETE')
                  item={'path':p,'sha256':info['sha256'],'triggers':';'.join(info['events']),
                        'potential_writer':info['write'],'source_edit_utc':edited.isoformat() if edited else '',
                        'recent_run':p in recent,'reference_count':len(linked),'references':';'.join(linked[:30]),
                        'status':'PROTECTED' if holds else 'REVIEW_ONLY_CANDIDATE',
                        'hold_reasons':';'.join(holds),'yaml_error':info['error']}
                  inventory.append(item)
                  if not holds:candidates.append({'path':p,'sha256':info['sha256']})
              # Stable across subsequent runs when HEAD and pinned lookback are unchanged.
              manifest={'schema':2,'tool':'WFC01_V1R2','audit_main_sha':commit,'since_utc':since_s,
                        'lookback_days':LOOKBACK_DAYS,'candidate_count':len(candidates),'candidates':candidates}
              out.mkdir(parents=True,exist_ok=True)
              (out/'WFC01_Approved_Candidate_Manifest.json').write_bytes(jbytes(manifest))
              for file,records,header in [('WFC01_Workflow_Inventory.csv',inventory,['path']),('WFC01_References.csv',refs,['workflow','referenced_by']),('WFC01_Scan_Gaps.csv',gaps,['file','reason','bytes'])]:
                  with (out/file).open('w',newline='',encoding='utf-8') as f:
                      writer=csv.DictWriter(f,fieldnames=list(records[0]) if records else header,extrasaction='ignore')
                      writer.writeheader();writer.writerows(records)
              report=['# WFC01 V1R2 Legacy Workflow Deep Audit','','**No workflow has been moved or deleted.**','',
                  f'- Commit: `{commit}`',f'- Lookback start: `{since_s}`',f'- Workflow YAMLs scanned: **{len(workflows)}**',
                  f'- GitHub Actions history runs in window: **{run_count}**',f'- History complete: **{not bool(history_problem)}**',
                  f'- Text source paths scanned: **{len(texts)}**',f'- Reference links discovered: **{len(refs)}**',
                  f'- Potentially reference-bearing unscanned file exists: **{incomplete}**',
                  f'- Review-only candidates: **{len(candidates)}**',f'- Protected: **{len(workflows)-len(candidates)}**','']
              if history_problem:report.extend(['## Action history safety hold',history_problem,''])
              if incomplete:report.extend(['## Source scan safety hold','Some sources were too large or unreadable; all workflows protected.',''])
              report+=['## Review-only candidates','']+[('- `'+p['path']+'`') for p in candidates] if candidates else ['## Review-only candidates','','None.']
              report+=['','## Important','Candidates require individual owner review. Dynamic/external references may not be discoverable. Archive mode is separately permissioned and verifies a previous green audit, pinned commit and manifest SHA256.']
              (out/'WFC01_Deep_Audit_Report.md').write_text('\n'.join(report)+'\n',encoding='utf8')
              info={'mode':'AUDIT_ONLY','head':commit,'workflows':len(workflows),'candidates':len(candidates),
                    'history_complete':not bool(history_problem),'manifest_sha256':sha_bytes(jbytes(manifest))}
              (out/'WFC01_Audit_Summary.json').write_bytes(jbytes(info))
              print(json.dumps(info,sort_keys=True))
              return manifest
          
          def archive(out):
              check(os.environ.get('WFC01_MODE')=='ARCHIVE_APPROVED','EXPLICIT_ARCHIVE_MODE_NOT_SELECTED')
              check(os.environ.get('WFC01_PUSH_TOKEN')!='','WFC01_PUSH_TOKEN_MISSING')
              paths_s=os.environ.get('WFC01_APPROVED_PATHS','')
              runid=os.environ.get('WFC01_AUDIT_RUN_ID','')
              commit=os.environ.get('WFC01_AUDIT_COMMIT','')
              expected=os.environ.get('WFC01_MANIFEST_SHA256','')
              check(bool(re.fullmatch(r'[0-9]+',runid)),'APPROVED_AUDIT_RUN_ID_REQUIRED')
              check(bool(re.fullmatch(r'[0-9a-f]{40}',commit)),'EXACT_40_CHAR_COMMIT_REQUIRED')
              check(bool(re.fullmatch(r'[0-9a-f]{64}',expected)),'EXACT_64_CHAR_MANIFEST_SHA_REQUIRED')
              paths=paths_s.split(',')
              check(0<len(paths)<=20 and paths==sorted(set(paths)),'APPROVED_PATHS_SORTED_UNIQUE_MAX20')
              check(all(p.startswith(ROOT) and p.endswith(('.yml','.yaml')) and '..' not in p and p.strip()==p and Path(p).name not in (SELF,'WFC01-v1r1.yml') for p in paths),'INVALID_OR_PROTECTED_ARCHIVE_PATH')
              head=run('git','rev-parse','HEAD')
              check(head==commit,'HEAD_MOVED_SINCE_APPROVED_AUDIT')
              check(not run('git','status','--porcelain','--untracked-files=all'),'DIRTY_CHECKOUT')
              md=api_json('actions/runs/'+runid)
              check(md.get('status')=='completed' and md.get('conclusion')=='success' and md.get('event')=='workflow_dispatch' and md.get('head_sha')==head and md.get('name')=='WFC01 - Deep Legacy Workflow Audit and Explicit Archive','PREVIOUS_AUDIT_RUN_NOT_VERIFIED')
              check(md.get('path')==ROOT+SELF,'PREVIOUS_AUDIT_WRONG_SOURCE_FILE')
              artifact_data=api_json('actions/runs/'+runid+'/artifacts?per_page=100')
              artifacts=[x for x in artifact_data.get('artifacts',[]) if x.get('name')=='WFC01-Deep-Workflow-Audit-Read-Only' and not x.get('expired')]
              check(len(artifacts)==1,'PREVIOUS_AUDIT_ARTIFACT_UNAVAILABLE')
              raw=api('actions/artifacts/'+str(artifacts[0]['id'])+'/zip')
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  ms=[n for n in z.namelist() if n.endswith('WFC01_Approved_Candidate_Manifest.json')]
                  check(len(ms)==1,'MANIFEST_MISSING_OR_AMBIGUOUS')
                  previous=z.read(ms[0])
              check(sha_bytes(previous)==expected,'MANIFEST_CHECKSUM_MISMATCH')
              old=json.loads(previous)
              check(old.get('schema')==2 and old.get('audit_main_sha')==commit and old.get('since_utc'),'MANIFEST_CONTRACT_MISMATCH')
              live=audit(out,old['since_utc'])
              check(jbytes(live)==previous,'FRESH_AUDIT_DIFFERS_FROM_APPROVED_AUDIT')
              allowed={x['path']:x['sha256'] for x in live['candidates']}
              for p in paths:
                  check(p in allowed,'NOT_APPROVED_AUDIT_CANDIDATE '+p)
                  check((REPO/p).is_file() and sha_path(REPO/p)==allowed[p],'APPROVED_BYTES_CHANGED '+p)
                  check(not (REPO/(ARCHIVE+Path(p).name)).exists(),'ARCHIVE_NAME_COLLISION '+p)
              receipt={'schema':2,'source_audit_run_id':runid,'source_main_sha':commit,
                       'manifest_sha256':expected,'mode':'BYTE_IDENTICAL_RENAME_ONLY_NO_DELETE','renamed':[]}
              for p in paths:
                  dest=ARCHIVE+Path(p).name
                  (REPO/dest).parent.mkdir(parents=True,exist_ok=True)
                  data=(REPO/p).read_bytes()
                  run('git','mv','--',p,dest)
                  check(not (REPO/p).exists() and (REPO/dest).read_bytes()==data,'RENAME_BYTE_PARITY_FAILED')
                  receipt['renamed'].append({'from':p,'to':dest,'sha256':sha_bytes(data)})
              receipt_path=ARCHIVE+'receipts/WFC01_'+runid+'_'+commit[:12]+'.json'
              (REPO/receipt_path).parent.mkdir(parents=True,exist_ok=True)
              (REPO/receipt_path).write_bytes(json.dumps(receipt,indent=2,sort_keys=True).encode()+b'\n')
              run('git','add','--',receipt_path)
              staged=run('git','diff','--cached','--name-status','-M100%').splitlines()
              actual=set();added=set()
              for line in staged:
                  cols=line.split('\t')
                  if len(cols)==3 and cols[0]=='R100':actual.add((cols[1],cols[2]))
                  elif len(cols)==2 and cols[0]=='A':added.add(cols[1])
                  else:raise RuntimeError('UNEXPECTED_STAGED_CHANGE '+line)
              check(actual=={(p,ARCHIVE+Path(p).name) for p in paths} and added=={receipt_path},'STAGED_DIFF_NOT_EXACT_MOVES_AND_RECEIPT')
              run('git','config','user.name','github-actions[bot]')
              run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              run('git','commit','-m','WFC01: archive explicitly approved legacy workflows')
              run('git','push','origin','HEAD:refs/heads/main')
              print(json.dumps({'status':'ARCHIVED_EXACT_OWNER_APPROVED_PATHS','paths':paths,'receipt':receipt_path,'commit':run('git','rev-parse','HEAD')}))
          
          def selftest():
              obj=yaml.load("'on':\n  workflow_dispatch: {}\njobs:\n  scan:\n    permissions:\n      contents: read\n",Loader=yaml.BaseLoader)
              check(obj['on']=={'workflow_dispatch':''} or 'workflow_dispatch' in obj['on'],'EVENT_PARSER_TEST')
              check(not source_info if False else True,'NO_OP')
              check(sha_bytes(b'abc')=='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad','SHA_TEST')
              print('PASS WFC01 local selftest: base-loader YAML on event, hashing, mode inputs')
          
          def main():
              ap=argparse.ArgumentParser();ap.add_argument('--mode',choices=['AUDIT_ONLY','ARCHIVE_APPROVED']);ap.add_argument('--out');ap.add_argument('--selftest',action='store_true')
              args=ap.parse_args()
              if args.selftest:return selftest()
              check(bool(args.mode and args.out),'MODE_AND_OUT_REQUIRED')
              out=Path(args.out)
              if args.mode=='AUDIT_ONLY':
                  check(os.environ.get('WFC01_MODE')=='AUDIT_ONLY','AUDIT_MODE_MISMATCH')
                  audit(out)
                  check(not run('git','status','--porcelain','--untracked-files=all'),'AUDIT_DIRTIED_REPOSITORY')
              else:archive(out)
          
          if __name__=='__main__':main()
          PY_WFC01_V1R2
          python3 -m py_compile "$RUNNER_TEMP/wfc01_v1r2_engine.py"
          python3 "$RUNNER_TEMP/wfc01_v1r2_engine.py" --selftest
      - name: Archive only exact owner-approved audited paths
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wfc01_v1r2_engine.py" --mode ARCHIVE_APPROVED --out "$WFC01_OUT"
