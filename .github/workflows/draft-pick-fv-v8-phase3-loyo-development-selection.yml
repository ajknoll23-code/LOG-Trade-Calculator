              print("2024_HOLDOUT_ROOKIE_OUTCOMES_READ=false"); print("PRODUCTION_CHANGE_AUTHORIZED=false")
          
          
          def selftest() -> None:
              x=pava_decreasing([10,12,9,8,6],[1,1,1,1,1],1)
              assert all(x[i]>=x[i+1]-1e-12 for i in range(len(x)-1))
              assert np.allclose(c3_coeff("r6_late"),np.asarray([1,-1,-2,-2,-2],dtype=float))
              assert at_bound(0.1,(0.1,1.25))["at_hard_bound"]
              assert not at_bound(0.5,(0.1,1.25))["at_hard_bound"]
              base={"r1_early":10,"r1_mid":9,"r1_late":8,"r2_early":7,"r2_mid":6,"r2_late":5,"r3_early":4,"r3_mid":3.5,"r3_late":3,"r4_early":2.8,"r4_mid":2.6,"r4_late":2.4,"r5_early":2.2,"r5_mid":2,"r5_late":1.8,"r6_early":1.6,"r6_mid":1.4,"r6_late":1.2}
              assert structural(base)["structural_gate_pass"]
              print("PASS: V8 Phase 3 LOYO engine self-test")
          
          
          def check_outputs(args: argparse.Namespace) -> None:
              out=Path(args.out_dir); r=load(out/"v8_phase3_loyo_development_selection.json"); m=load(out/"v8_phase3_loyo_development_selection_manifest.json")
              allowed={"PASS_V8_PHASE3_LOYO_DEVELOPMENT_WINNER_FROZEN_2024_H2_AUTHORIZED_NEXT_STAGE","STOP_NO_V8_R1_R6_DEVELOPMENT_CANDIDATE"}
              if r["decision"] not in allowed or m["decision"]!=r["decision"]: raise GateError("unexpected Phase 3 decision")
              if r["holdout_2024_rookie_outcomes_read"] is not False or r["holdout_2024_outcomes_remain_sealed"] is not True: raise GateError("2024 holdout firewall failure")
              for k in ("market_or_ktc_values_read","package_vote_data_read","year_discount_fit_or_changed","production_change_authorized"):
                  if r[k] is not False: raise GateError(f"Phase 3 firewall violation: {k}")
              if bool(r["selected_candidate"]) != bool(m["final_candidate_frozen"]): raise GateError("candidate freeze mismatch")
              for name,expected in m["output_hashes"].items():
                  if sha(out/name)!=expected: raise GateError(f"output hash mismatch {name}")
              print("PASS: V8 Phase 3 frozen outputs validated")
          
          
          def main() -> None:
