name: Draft Pick FV V8 - Phase 3 LOYO Development Selection

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: draft-pick-fv-v8-phase3-loyo-development-selection
  cancel-in-progress: false

jobs:
  phase3_loyo:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install frozen numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir             "numpy==2.3.5"             "scipy==1.17.0"

      - name: Verify frozen V7 candidate and selection contract
        shell: bash
        run: |
          set -euo pipefail

          PREREG="research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json"

          test "$(git rev-parse HEAD:$PREREG)" =             "42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path("research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json")
          d=json.loads(p.read_text())

          assert d["status"]=="FROZEN_PRE_V7_SOURCE_EXPANSION_PRE_OUTCOME"
          assert d["production_change_authorized"] is False

          assert d["development_selection"]["method"]=="leave-one-draft-class-out cross-validation"
          assert d["development_selection"]["bootstrap"]["replicates"]==10000
          assert d["development_selection"]["bootstrap"]["seed"]==20260924
          assert d["development_selection"]["complexity_order_for_within_1pct_tie"]==[
              "C1_GLOBAL_SCALE_R1_R6",
              "C3_SMOOTH_ADDITIVE_R1_R6",
              "C2_ROUNDWISE_RESCALE_R1_R6",
              "C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6",
          ]
          assert d["development_selection"]["winner_pool"]==[
              "C1_GLOBAL_SCALE_R1_R6",
              "C3_SMOOTH_ADDITIVE_R1_R6",
              "C2_ROUNDWISE_RESCALE_R1_R6",
              "C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6",
          ]

          assert d["candidate_families"]["C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6"]["alpha_grid"]==[
              6,12,24,48,96,192,384,768,1536
          ]

          assert d["frozen_deployed_baseline"]["pick_base_2027"]=={
              "1":{"early":7500,"mid":5854,"late":5244},
              "2":{"early":3906,"mid":3624,"late":3291},
              "3":{"early":2692,"mid":2682,"late":2319},
              "4":{"early":1972,"mid":1831,"late":1689},
              "5":{"early":1414,"mid":1250,"late":1118},
              "6":{"early":1014,"mid":853,"late":740},
          }
          assert d["frozen_deployed_baseline"]["YEAR_DISCOUNT_fit_or_change_allowed"] is False

          print("PASS: frozen V7 candidate families, gates, baseline, bootstrap and tie order verified.")
          PY

      - name: Download exact Phase 1.1 and Phase 2 artifacts
        shell: bash
        run: |
          set -euo pipefail
          P1="${RUNNER_TEMP}/p1_1"
          P2="${RUNNER_TEMP}/p2"
          mkdir -p "$P1" "$P2"

          P1_RUN_ID="36467064097"
          P1_ARTIFACT_ID="10990665019"
          P1_DIGEST="sha256:6d480ea3fbb5db254e3271b9c400d62e136bb34877aff6b181ca5ed7252247b0"

          P2_RUN_ID="36469782185"
          P2_ARTIFACT_ID="10991550072"
          P2_DIGEST="sha256:850b20bef3eea86fcc5a06f75642433b15220ee8da7a6a0acab2d26b71795021"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${P1_ARTIFACT_ID}" --jq '.digest // ""')" = "$P1_DIGEST"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${P2_ARTIFACT_ID}" --jq '.digest // ""')" = "$P2_DIGEST"

          gh run download "$P1_RUN_ID"             --repo "$GITHUB_REPOSITORY"             -n "v8-p1-1-position-retention-hardening"             -D "$P1"

          gh run download "$P2_RUN_ID"             --repo "$GITHUB_REPOSITORY"             -n "v8-p2-historical-outcome-harvest-closeout"             -D "$P2"

      - name: Verify exact upstream scientific inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          p1=Path(os.environ["RUNNER_TEMP"])/"p1_1"
          p2=Path(os.environ["RUNNER_TEMP"])/"p2"

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          s1=json.loads((p1/"v8_phase1_1_position_retention_hardening.json").read_text())
          m1=json.loads((p1/"v8_phase1_1_position_retention_hardening_manifest.json").read_text())
          s2=json.loads((p2/"v8_phase2_historical_outcome_summary.json").read_text())
          m2=json.loads((p2/"v8_phase2_historical_outcome_manifest.json").read_text())

          assert s1["decision"]=="PROCEED_TO_V8_PHASE2_HISTORICAL_OUTCOME_HARVEST"
          assert m1["decision"]==s1["decision"]
          assert m1["retained_occurrence_n"]==24970
          assert m1["retained_unique_target_n"]==929
          assert m1["source_membership_group_n"]==6247
          assert m1["all_108_year_cells_pass"] is True
          assert m1["historical_player_outcomes_read"] is False
          assert m1["holdout_2024_outcomes_read"] is False
          assert m1["candidate_fit_performed"] is False
          assert m1["production_change_authorized"] is False
          assert sha(p1/"v8_phase1_1_position_retention_occurrences.jsonl")==m1["retained_occurrences_sha256"]

          assert s1["retention"]["all_108_year_cells_pass"] is True
          assert s1["retention"]["minimum_year_cell_retention"]>=0.95
          assert s1["identity"]["retained_identity_coverage"]>=0.95
          assert s1["identity"]["retained_sleeper_ready_coverage"]>=0.95
          assert s1["identity"]["all_retained_positions_supported"] is True
          assert s1["sparse_2018_r6_occurrence_n"]==72

          controls=s1["sparse_cell_controls"]
          assert controls["label_2018_r6_as_source_sparse_in_all_research_artifacts"] is True
          assert controls["no_hyperparameter_or_model_choice_may_be_tuned_to_improve_2018_r6"] is True
          assert controls["primary_model_uses_frozen_global_weighting_contract"] is True
          assert controls["preproduction_sensitivity_required"] is True
          assert controls["required_sensitivity_runs"]==[
              "primary_fit_with_frozen_2018_r6",
              "fit_excluding_all_2018_r6_occurrences",
              "six_leave_one_source_league_out_2018_r6_variants",
          ]
          assert controls["sensitivity_results_must_be_reported_before_production"] is True
          assert controls["sensitivity_results_may_not_change_source_membership"] is True

          assert s2["decision"]=="PROCEED_TO_V8_PHASE3_LOYO_DEVELOPMENT_SELECTION"
          assert m2["decision"]==s2["decision"]
          assert m2["status"]=="HISTORICAL_OUTCOME_HARVEST_PASS"
          assert m2["outcome_readiness_gate_pass"] is True
          assert m2["retained_pick_occurrence_n"]==24970
          assert m2["unique_outcome_identity_n"]==929
          assert s2["development_outcome_occurrence_n"]==24970
          assert s2["holdout_2024_pick_identity_file_read"] is False
          assert s2["holdout_2024_rookie_outcomes_scored"] is False
          assert s2["holdout_2024_pick_outcomes_remain_sealed"] is True
          assert s2["market_or_ktc_values_read"] is False
          assert s2["package_vote_data_read"] is False
          assert s2["candidate_fit_performed"] is False
          assert s2["candidate_scores_computed"] is False
          assert s2["candidate_selection_performed"] is False
          assert s2["production_change_authorized"] is False

          for name, expected in m2["output_hashes"].items():
              assert sha(p2/name)==expected,(name,sha(p2/name),expected)

          assert sum(1 for line in (p2/"v8_phase2_development_outcomes.jsonl").open() if line.strip())==24970
          assert all(v["pass"] is True for v in s2["outcome_readiness_gate"]["by_year_cell"].values())

          print("PASS: exact Phase 1.1 and Phase 2 artifacts verified; 2024 rookie holdout remains sealed.")
          PY

      - name: Build Phase 3 LOYO engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/v8_phase3_loyo.py" <<'PY'
          from __future__ import annotations
          
          import argparse
          import hashlib
          import json
          import math
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Callable
          
          import numpy as np
          from scipy.optimize import linprog
          from scipy.sparse import coo_matrix, csr_matrix, vstack
          
          YEARS = tuple(range(2018, 2024))
          H4_YEARS = tuple(range(2018, 2023))
          TIERS = ("early", "mid", "late")
          CELLS = tuple(f"r{r}_{t}" for r in range(1, 7) for t in TIERS)
          WINNER_ORDER = (
              "C1_GLOBAL_SCALE_R1_R6",
              "C3_SMOOTH_ADDITIVE_R1_R6",
              "C2_ROUNDWISE_RESCALE_R1_R6",
              "C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6",
          )
          ALPHAS = (6, 12, 24, 48, 96, 192, 384, 768, 1536)
          BOOT_REPS = 10000
          BOOT_SEED = 20260924
          BOUND_REL_TOL = 1e-6
          LP_OBJ_TOL_REL = 1e-9
          LEX_FIX_REL_TOL = 5e-8
          LEX_FIX_ABS_TOL = 5e-7
          EPS = 1e-12
          
          
          class GateError(RuntimeError):
              pass
          
          
          def now() -> str:
              return datetime.now(timezone.utc).isoformat()
          
          
          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def load(path: Path) -> dict[str, Any]:
              return json.loads(path.read_text(encoding="utf-8"))
          
          
          def clean(obj: Any) -> Any:
              if isinstance(obj, float):
                  if not math.isfinite(obj):
                      raise GateError("non-finite output")
                  return round(obj, 10)
              if isinstance(obj, np.floating):
                  return clean(float(obj))
              if isinstance(obj, np.integer):
                  return int(obj)
              if isinstance(obj, dict):
                  return {str(k): clean(v) for k, v in obj.items()}
              if isinstance(obj, (list, tuple)):
                  return [clean(v) for v in obj]
              return obj
          
          
          def write_json(path: Path, obj: Any) -> None:
              path.write_text(json.dumps(clean(obj), indent=2, sort_keys=True) + "\n", encoding="utf-8")
          
          
          def read_jsonl(path: Path) -> list[dict[str, Any]]:
              rows: list[dict[str, Any]] = []
              with path.open(encoding="utf-8") as f:
                  for n, line in enumerate(f, 1):
                      if not line.strip():
                          continue
                      try:
                          obj = json.loads(line)
                      except json.JSONDecodeError as exc:
                          raise GateError(f"{path}:{n}: invalid JSONL") from exc
                      if not isinstance(obj, dict):
                          raise GateError(f"{path}:{n}: row is not object")
                      rows.append(obj)
              return rows
          
          
          def finite(v: Any) -> bool:
              return isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(float(v))
          
          
          def outcome(row: dict[str, Any], horizon: str, field: str) -> float | None:
              h = row.get(horizon)
              if not isinstance(h, dict) or h.get("mature") is not True:
                  return None
              v = h.get(field)
              return float(v) if finite(v) else None
          
          
          def cell_round(cell: str) -> int:
              return int(cell[1])
          
          
          def cell_tier(cell: str) -> str:
              return cell.split("_", 1)[1]
          
          
          def baseline_cells(pre: dict[str, Any]) -> dict[str, float]:
              table = pre["frozen_deployed_baseline"]["pick_base_2027"]
              return {f"r{r}_{t}": float(table[str(r)][t]) for r in range(1, 7) for t in TIERS}
          
          
          def structural(values: dict[str, float]) -> dict[str, Any]:
              seq = [float(values[c]) for c in CELLS]
              positive = all(v > 0.0 for v in seq)
              mono = all(seq[i] >= seq[i + 1] - 1e-8 for i in range(len(seq) - 1))
              return {
                  "all_18_positive": positive,
                  "all_18_monotone_nonincreasing": mono,
                  "minimum_cell_value": min(seq),
                  "structural_gate_pass": positive and mono,
              }
          
          
          def validate_prereg(pre: dict[str, Any]) -> None:
              if pre["status"] != "FROZEN_PRE_V7_SOURCE_EXPANSION_PRE_OUTCOME":
                  raise GateError("V7 preregistration status drift")
              if pre["development_selection"]["method"] != "leave-one-draft-class-out cross-validation":
                  raise GateError("LOYO method drift")
              if tuple(pre["development_selection"]["complexity_order_for_within_1pct_tie"]) != WINNER_ORDER:
                  raise GateError("candidate complexity order drift")
              if int(pre["development_selection"]["bootstrap"]["replicates"]) != BOOT_REPS:
                  raise GateError("bootstrap replicate drift")
              if int(pre["development_selection"]["bootstrap"]["seed"]) != BOOT_SEED:
                  raise GateError("bootstrap seed drift")
              if tuple(pre["candidate_families"]["C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6"]["alpha_grid"]) != ALPHAS:
                  raise GateError("C4 alpha-grid drift")
              if pre["structural_constraints"]["all_18_cells_monotone_nonincreasing_in_slot_order"] is not True:
                  raise GateError("structural monotonicity contract drift")
              if pre["structural_constraints"]["all_18_cells_strictly_positive"] is not True:
                  raise GateError("structural positivity contract drift")
              if pre["frozen_deployed_baseline"]["YEAR_DISCOUNT_fit_or_change_allowed"] is not False:
                  raise GateError("YEAR_DISCOUNT firewall drift")
          
          
          def validate_phase_inputs(
              rows: list[dict[str, Any]],
              p2s: dict[str, Any],
              p2m: dict[str, Any],
              p1s: dict[str, Any],
              p1m: dict[str, Any],
          ) -> dict[str, Any]:
              if p2s["decision"] != "PROCEED_TO_V8_PHASE3_LOYO_DEVELOPMENT_SELECTION":
                  raise GateError("Phase 2 did not authorize Phase 3")
              if p2m["decision"] != p2s["decision"]:
                  raise GateError("Phase 2 summary/manifest decision mismatch")
              if p2m["outcome_readiness_gate_pass"] is not True:
                  raise GateError("Phase 2 outcome readiness gate failed")
              for obj in (p2s, p2m):
                  for key in ("candidate_fit_performed", "candidate_scores_computed", "candidate_selection_performed", "production_change_authorized"):
                      if obj.get(key) is not False:
                          raise GateError(f"Phase 2 firewall drift: {key}")
              if p2s["holdout_2024_pick_identity_file_read"] is not False:
                  raise GateError("2024 holdout pick identity was read")
              if p2s["holdout_2024_rookie_outcomes_scored"] is not False:
                  raise GateError("2024 holdout rookie outcomes were scored")
              if p2s["holdout_2024_pick_outcomes_remain_sealed"] is not True:
                  raise GateError("2024 holdout is not sealed")
              if p2s["market_or_ktc_values_read"] is not False or p2s["package_vote_data_read"] is not False:
                  raise GateError("market/vote leakage before Phase 3")
          
              if p1s["decision"] != "PROCEED_TO_V8_PHASE2_HISTORICAL_OUTCOME_HARVEST":
                  raise GateError("Phase 1.1 decision drift")
              if p1m["decision"] != p1s["decision"]:
                  raise GateError("Phase 1.1 summary/manifest mismatch")
              retention = p1s["retention"]
              if retention["all_108_year_cells_pass"] is not True:
                  raise GateError("Phase 1.1 retention gate drift")
              if float(retention["minimum_year_cell_retention"]) < 0.95 - EPS:
                  raise GateError("Phase 1.1 minimum retention below 95%")
              identity = p1s["identity"]
              if float(identity["retained_identity_coverage"]) < 0.95 - EPS:
                  raise GateError("Phase 1.1 retained identity coverage below 95%")
              if float(identity["retained_sleeper_ready_coverage"]) < 0.95 - EPS:
                  raise GateError("Phase 1.1 Sleeper-ready coverage below 95%")
              if identity["all_retained_positions_supported"] is not True:
                  raise GateError("Phase 1.1 retained position support drift")
              controls = p1s["sparse_cell_controls"]
              required_controls = {
                  "label_2018_r6_as_source_sparse_in_all_research_artifacts": True,
                  "no_hyperparameter_or_model_choice_may_be_tuned_to_improve_2018_r6": True,
                  "primary_model_uses_frozen_global_weighting_contract": True,
                  "preproduction_sensitivity_required": True,
                  "sensitivity_results_must_be_reported_before_production": True,
                  "sensitivity_results_may_not_change_source_membership": True,
              }
              for k, v in required_controls.items():
                  if controls.get(k) is not v:
                      raise GateError(f"sparse-control drift: {k}")
              if controls.get("required_sensitivity_runs") != [
                  "primary_fit_with_frozen_2018_r6",
                  "fit_excluding_all_2018_r6_occurrences",
                  "six_leave_one_source_league_out_2018_r6_variants",
              ]:
                  raise GateError("sparse sensitivity-run contract drift")
          
              if len(rows) != 24970:
                  raise GateError(f"development denominator drift: {len(rows)}")
              if int(p2s["development_outcome_occurrence_n"]) != len(rows):
                  raise GateError("Phase 2 occurrence count mismatch")
              if int(p2s["unique_outcome_identity_n"]) != 929:
                  raise GateError("unique outcome identity drift")
          
              seen: set[tuple[int, str, int]] = set()
              year_cell_leagues: dict[tuple[int, str], set[str]] = defaultdict(set)
              sum_all = 0.0
              sum_year = defaultdict(float)
              sum_cell = defaultdict(float)
              sum_year_cell = defaultdict(float)
              sparse_n = 0
              for r in rows:
                  y = int(r["draft_year"])
                  c = str(r["cell"])
                  if y not in YEARS or c not in CELLS:
                      raise GateError(f"invalid development row {y}/{c}")
                  key = (y, str(r["source_league_key"]), int(r["overall_slot"]))
                  if key in seen:
                      raise GateError(f"duplicate retained occurrence {key}")
                  seen.add(key)
                  if r.get("historical_player_outcomes_read") is not True:
                      raise GateError("development row missing historical outcome read marker")
                  w = r.get("development_fit_weight_v8")
                  if not finite(w) or float(w) <= 0:
                      raise GateError("invalid V8 development weight")
                  w = float(w)
                  sum_all += w
                  sum_year[y] += w
                  sum_cell[c] += w
                  sum_year_cell[(y, c)] += w
                  year_cell_leagues[(y, c)].add(str(r["source_league_key"]))
                  if r.get("source_sparse_2018_r6") is True:
                      sparse_n += 1
                      if y != 2018 or cell_round(c) != 6:
                          raise GateError("sparse marker outside 2018 R6")
                  if r.get("primary_o2_ready") is True:
                      if outcome(r, "H3", "O2") is None:
                          raise GateError("primary O2-ready row lacks H3 O2")
                      if not r.get("stable_player_key"):
                          raise GateError("O2-ready row lacks stable player key")
          
              if not math.isclose(sum_all, 1.0, rel_tol=0, abs_tol=1e-10):
                  raise GateError(f"V8 weights do not sum to 1: {sum_all}")
              for y in YEARS:
                  if not math.isclose(sum_year[y], 1/6, rel_tol=0, abs_tol=1e-10):
                      raise GateError(f"year weight drift {y}: {sum_year[y]}")
              for c in CELLS:
                  if not math.isclose(sum_cell[c], 1/18, rel_tol=0, abs_tol=1e-10):
                      raise GateError(f"cell weight drift {c}: {sum_cell[c]}")
              for y in YEARS:
                  for c in CELLS:
                      if not math.isclose(sum_year_cell[(y,c)], 1/108, rel_tol=0, abs_tol=1e-10):
                          raise GateError(f"year-cell weight drift {y}/{c}: {sum_year_cell[(y,c)]}")
                      n = len(year_cell_leagues[(y,c)])
                      required = 6 if (y == 2018 and cell_round(c) == 6) else 12
                      if n < required:
                          raise GateError(f"V8 amended source gate failure {y}/{c}: {n} < {required}")
              if sparse_n != 72:
                  raise GateError(f"sparse 2018 R6 occurrence drift: {sparse_n}")
          
              if not all(v["pass"] is True for v in p2s["outcome_readiness_gate"]["by_year_cell"].values()):
                  raise GateError("Phase 2 readiness cell gate drift")
          
              return {
                  "development_occurrence_n": len(rows),
                  "unique_stable_player_year_n": len({(int(r["draft_year"]), str(r["stable_player_key"])) for r in rows}),
                  "minimum_retention": float(retention["minimum_year_cell_retention"]),
                  "retained_identity_coverage": float(identity["retained_identity_coverage"]),
                  "retained_sleeper_ready_coverage": float(identity["retained_sleeper_ready_coverage"]),
                  "sparse_2018_r6_occurrence_n": sparse_n,
                  "source_league_counts": {f"{y}:{c}": len(year_cell_leagues[(y,c)]) for y in YEARS for c in CELLS},
              }
          
          
          def weighted_rows(
              rows: list[dict[str, Any]],
              years: tuple[int, ...],
              horizon: str,
              field: str,
              *,
              require_h3_o2: bool = False,
          ) -> list[dict[str, Any]]:
              chosen: list[dict[str, Any]] = []
              sums = defaultdict(float)
              counts = defaultdict(int)
              yset = set(years)
              for r in rows:
                  y = int(r["draft_year"])
                  if y not in yset:
                      continue
                  val = outcome(r, horizon, field)
                  if val is None:
                      continue
                  if require_h3_o2 and outcome(r, "H3", "O2") is None:
                      continue
                  if horizon == "H3" and field == "O2" and r.get("primary_o2_ready") is not True:
                      continue
                  key = (y, str(r["cell"]))
                  w = float(r["development_fit_weight_v8"])
                  sums[key] += w
                  counts[key] += 1
                  x = dict(r)
                  x["_target"] = float(val)
                  x["_raw_w"] = w
                  chosen.append(x)
          
              for y in years:
                  for c in CELLS:
                      if counts[(y,c)] <= 0 or sums[(y,c)] <= 0:
                          raise GateError(f"zero support {horizon}/{field} {y}:{c}")
              share = 1.0 / len(years) / len(CELLS)
              check = defaultdict(float)
              for x in chosen:
                  key = (int(x["draft_year"]), str(x["cell"]))
                  x["_w"] = share * x["_raw_w"] / sums[key]
                  check[key] += x["_w"]
              for y in years:
                  for c in CELLS:
                      if not math.isclose(check[(y,c)], share, rel_tol=0, abs_tol=1e-12):
                          raise GateError(f"weight normalization failure {horizon}/{field} {y}:{c}")
              return chosen
          
          
          def fit_lad(
              rows: list[dict[str, Any]],
              param_names: tuple[str, ...],
              param_bounds: tuple[tuple[float, float], ...],
              coeff_fn: Callable[[dict[str, Any]], np.ndarray],
              structural_A: list[list[float]],
              structural_b: list[float],
          ) -> tuple[dict[str, float], float]:
              """Exact weighted-LAD LP on the frozen objective.
          
              HiGHS is deterministic for the pinned SciPy build.  We intentionally do not
              add a secondary objective: V7 preregistered the LAD objective and parameter
              bounds, but no scientific lexicographic objective.  This also avoids the
              numerical infeasibility that the older V6 multi-solve tie-break encountered.
              """
              p = len(param_names)
              n = len(rows)
              c = np.zeros(p+n, dtype=float)
              for i, r in enumerate(rows):
                  c[p+i] = float(r["_w"])
          
              rr: list[int] = []
              cc: list[int] = []
              dd: list[float] = []
              bub: list[float] = []
              rowno = 0
              for i, r in enumerate(rows):
                  a = np.asarray(coeff_fn(r), dtype=float)
                  if a.shape != (p,):
                      raise GateError("LAD coefficient-shape mismatch")
                  y = float(r["_target"])
                  for j, val in enumerate(a):
                      if val != 0.0:
                          rr.append(rowno); cc.append(j); dd.append(float(val))
                  rr.append(rowno); cc.append(p+i); dd.append(-1.0); bub.append(y); rowno += 1
                  for j, val in enumerate(a):
                      if val != 0.0:
                          rr.append(rowno); cc.append(j); dd.append(float(-val))
                  rr.append(rowno); cc.append(p+i); dd.append(-1.0); bub.append(-y); rowno += 1
              for a, b in zip(structural_A, structural_b):
                  if len(a) != p:
                      raise GateError("structural coefficient length mismatch")
                  for j, val in enumerate(a):
                      if float(val) != 0.0:
                          rr.append(rowno); cc.append(j); dd.append(float(val))
                  bub.append(float(b)); rowno += 1
          
              A_base = coo_matrix((np.asarray(dd), (rr,cc)), shape=(rowno,p+n)).tocsr()
              b_base = np.asarray(bub, dtype=float)
              bounds = [tuple(map(float,b)) for b in param_bounds] + [(0,None)]*n
              res = linprog(c, A_ub=A_base, b_ub=b_base, bounds=bounds, method="highs")
              if not res.success:
                  raise GateError(f"LAD primary LP failed: {res.message}")
              return ({name: float(res.x[i]) for i,name in enumerate(param_names)}, float(res.fun))
          
          def c0_values(pre: dict[str, Any]) -> dict[str, float]:
              return baseline_cells(pre)
          
          
          def compress_lad_rows(rows: list[dict[str, Any]]) -> list[dict[str, Any]]:
              """Exact compression for cell-constant predictions.
          
              Every fitted family predicts one value per production cell. Rows that share
              the same cell and target therefore contribute identical absolute residuals;
              summing their normalized weights preserves the LAD objective exactly while
              reducing the LP by roughly an order of magnitude.
              """
              grouped: dict[tuple[str, float], float] = defaultdict(float)
              for r in rows:
                  grouped[(str(r["cell"]), float(r["_target"]))] += float(r["_w"])
              out=[]
              for (cell,target),w in sorted(grouped.items(), key=lambda kv:(kv[0][0],kv[0][1])):
                  out.append({"cell":cell,"_target":target,"_w":w})
              if not math.isclose(sum(float(r["_w"]) for r in out), sum(float(r["_w"]) for r in rows), rel_tol=0, abs_tol=1e-12):
                  raise GateError("LAD compression weight drift")
              return out
          
          
          def c1_fit(rows: list[dict[str, Any]], pre: dict[str, Any]) -> dict[str, Any]:
              rows = compress_lad_rows(rows)
              fam = pre["candidate_families"]["C1_GLOBAL_SCALE_R1_R6"]
              bounds = (tuple(map(float, fam["bounds"]["k"])),)
              base = c0_values(pre)
              def coeff(r: dict[str, Any]) -> np.ndarray:
                  return np.asarray([base[str(r["cell"])]], dtype=float)
              params, obj = fit_lad(rows, ("k",), bounds, coeff, [], [])
              vals = {c: base[c]*params["k"] for c in CELLS}
              return {"parameters": params, "r1_r6_values": vals, "training_weighted_mae": obj, "structural": structural(vals)}
          
          
          def c2_fit(rows: list[dict[str, Any]], pre: dict[str, Any]) -> dict[str, Any]:
              rows = compress_lad_rows(rows)
              cid = "C2_ROUNDWISE_RESCALE_R1_R6"
              fam = pre["candidate_families"][cid]
              names = tuple(f"k{i}" for i in range(1,7))
              bounds = tuple(tuple(map(float, fam["bounds"][n])) for n in names)
              base = c0_values(pre)
              def coeff(r: dict[str, Any]) -> np.ndarray:
                  a = np.zeros(6)
                  rnd = cell_round(str(r["cell"]))
                  a[rnd-1] = base[str(r["cell"])]
                  return a
              A: list[list[float]] = []
              b: list[float] = []
              for rnd in range(1,6):
                  a = [0.0]*6
                  a[rnd-1] = -base[f"r{rnd}_late"]
                  a[rnd] = base[f"r{rnd+1}_early"]
                  A.append(a); b.append(0.0)
              params, obj = fit_lad(rows, names, bounds, coeff, A, b)
              vals = {c: base[c]*params[f"k{cell_round(c)}"] for c in CELLS}
              return {"parameters": params, "r1_r6_values": vals, "training_weighted_mae": obj, "structural": structural(vals)}
          
          
          def c3_coeff(cell: str) -> np.ndarray:
              rnd = cell_round(cell)
              tier_idx = {"early":0.0,"mid":1.0,"late":2.0}[cell_tier(cell)]
              return np.asarray([
                  1.0,
                  -1.0 if rnd >= 2 else 0.0,
                  -float(max(min(rnd-2,2),0)),
                  -float(max(rnd-4,0)),
                  -tier_idx,
              ], dtype=float)
          
          
          def c3_values(params: dict[str, float]) -> dict[str, float]:
              p = np.asarray([params["A"],params["s12"],params["s234"],params["s56"],params["tier_step"]],dtype=float)
              return {c: float(c3_coeff(c) @ p) for c in CELLS}
          
          
          def c3_fit(rows: list[dict[str, Any]], pre: dict[str, Any]) -> dict[str, Any]:
              rows = compress_lad_rows(rows)
              cid = "C3_SMOOTH_ADDITIVE_R1_R6"
              fam = pre["candidate_families"][cid]
              names = ("A","s12","s234","s56","tier_step")
              bounds = tuple(tuple(map(float,fam["bounds"][n])) for n in names)
              def coeff(r: dict[str, Any]) -> np.ndarray:
                  return c3_coeff(str(r["cell"]))
              A: list[list[float]] = []
              b: list[float] = []
              # Generic adjacent-cell monotonicity across the complete 18-cell sequence.
              for i in range(len(CELLS)-1):
                  a = (c3_coeff(CELLS[i+1]) - c3_coeff(CELLS[i])).tolist()
                  A.append(a); b.append(0.0)
              # Strict positivity operationalized with the same 1-point structural floor as C4.
              A.append((-c3_coeff(CELLS[-1])).tolist()); b.append(-1.0)
              params, obj = fit_lad(rows, names, bounds, coeff, A, b)
              vals = c3_values(params)
              return {"parameters": params, "r1_r6_values": vals, "training_weighted_mae": obj, "structural": structural(vals)}
          
          
          def pava_decreasing(values: list[float], weights: list[float], lower: float) -> list[float]:
              blocks: list[list[float]] = []
              for i,(v,w) in enumerate(zip(values,weights)):
                  if w <= 0:
                      raise GateError("nonpositive PAVA weight")
                  blocks.append([float(i),float(i),float(w),float(v)])
                  while len(blocks) >= 2 and blocks[-2][3] < blocks[-1][3] - 1e-12:
                      b2=blocks.pop(); b1=blocks.pop(); wt=b1[2]+b2[2]
                      mean=(b1[2]*b1[3]+b2[2]*b2[3])/wt
                      blocks.append([b1[0],b2[1],wt,mean])
              out=[0.0]*len(values)
              for start,end,_w,mean in blocks:
                  m=max(float(lower),float(mean))
                  for i in range(int(start),int(end)+1): out[i]=m
              if not all(out[i] >= out[i+1]-1e-10 for i in range(len(out)-1)):
                  raise GateError("PAVA monotonicity failure")
              if min(out) < lower-1e-10:
                  raise GateError("PAVA lower-floor failure")
              return out
          
          
          def c4_from_train(
              sample: list[dict[str, Any]],
              train_years: tuple[int, ...],
              pre: dict[str, Any],
              alpha: int,
              *,
              c3_prior_fit: dict[str, Any] | None = None,
          ) -> dict[str, Any]:
              prior_fit = c3_prior_fit if c3_prior_fit is not None else c3_fit(sample, pre)
              prior = prior_fit["r1_r6_values"]
              by_year_slot: dict[tuple[int,int], list[dict[str,Any]]] = defaultdict(list)
              for r in sample:
                  y=int(r["draft_year"]); slot=int(r["overall_slot"])
                  if y in train_years: by_year_slot[(y,slot)].append(r)
              slot_mean: dict[int,float] = {}
              nobs: dict[int,int] = {}
              shrunk: list[float] = []
              pava_weights: list[float] = []
              for slot in range(1,73):
                  year_means=[]; total_n=0
                  for y in train_years:
                      xs=by_year_slot[(y,slot)]
                      if not xs: raise GateError(f"C4 zero exact-slot support {y}/slot{slot}")
                      sw=sum(float(x["_raw_w"]) for x in xs)
                      if sw <= 0: raise GateError("C4 nonpositive exact-slot weight")
                      year_means.append(sum(float(x["_raw_w"])*float(x["_target"]) for x in xs)/sw)
                      total_n += len(xs)
                  mean=sum(year_means)/len(year_means)
                  rnd=(slot-1)//12+1; within=(slot-1)%12+1
                  tier="early" if within<=4 else "mid" if within<=8 else "late"
                  pv=prior[f"r{rnd}_{tier}"]
                  sh=(total_n*mean+alpha*pv)/(total_n+alpha)
                  slot_mean[slot]=mean; nobs[slot]=total_n; shrunk.append(sh); pava_weights.append(float(total_n+alpha))
              slots=pava_decreasing(shrunk,pava_weights,1.0)
              vals: dict[str,float]={}
              for rnd in range(1,7):
                  for tier,lo in (("early",1),("mid",5),("late",9)):
                      ids=[(rnd-1)*12+p for p in range(lo,lo+4)]
                      vals[f"r{rnd}_{tier}"]=sum(slots[s-1] for s in ids)/4.0
              return {
                  "parameters":{"alpha":int(alpha),"c3_prior_parameters":prior_fit["parameters"]},
                  "r1_r6_values":vals,
                  "exact_slot_values":{str(i+1):slots[i] for i in range(72)},
                  "year_balanced_exact_slot_means":{str(k):v for k,v in slot_mean.items()},
                  "exact_slot_observed_occurrence_n":{str(k):int(v) for k,v in nobs.items()},
                  "structural":structural(vals),
              }
          
          
          def fit_sample(rows: list[dict[str, Any]], years: tuple[int, ...]) -> list[dict[str, Any]]:
              return weighted_rows(rows, years, "H3", "O2")
          
          
          def cell_mae_for_year(
              rows: list[dict[str, Any]],
              year: int,
              values: dict[str,float],
              *,
              horizon: str="H3",
              require_h3_o2: bool=False,
          ) -> dict[str,float]:
              xs=weighted_rows(rows,(year,),horizon,"O2",require_h3_o2=require_h3_o2)
              err=defaultdict(float); wt=defaultdict(float)
              for x in xs:
                  c=str(x["cell"]); w=float(x["_w"])
                  err[c]+=w*abs(float(values[c])-float(x["_target"])); wt[c]+=w
              out={}
              for c in CELLS:
                  if wt[c] <= 0: raise GateError(f"zero MAE weight {year}/{horizon}/{c}")
                  out[c]=err[c]/wt[c]
              return out
          
          
          def mae_for_year(rows: list[dict[str,Any]], year:int, values:dict[str,float], *, horizon:str="H3", require_h3_o2:bool=False) -> float:
              d=cell_mae_for_year(rows,year,values,horizon=horizon,require_h3_o2=require_h3_o2)
              return sum(d.values())/len(CELLS)
          
          
          def normalized_shape(values: dict[str,float]) -> dict[str,float]:
              m=sum(float(values[c]) for c in CELLS)/len(CELLS)
              if m<=0: raise GateError("nonpositive normalized-shape mean")
              return {c:float(values[c])/m for c in CELLS}
          
          
          def o1_shape_error_for_year(rows:list[dict[str,Any]], year:int, values:dict[str,float]) -> float:
              xs=weighted_rows(rows,(year,),"H3","O1")
              by=defaultdict(float); wt=defaultdict(float)
              for x in xs:
                  c=str(x["cell"]); w=float(x["_w"]); by[c]+=w*float(x["_target"]); wt[c]+=w
              target={c:by[c]/wt[c] for c in CELLS}
              a=normalized_shape(target); b=normalized_shape(values)
              return sum(abs(a[c]-b[c]) for c in CELLS)/len(CELLS)
          
          
          def score_predictions(rows:list[dict[str,Any]], predictions:dict[str,dict[int,dict[str,float]]]) -> dict[str,Any]:
              scores={}
              for cid, by_year in predictions.items():
                  h3_by={str(y):mae_for_year(rows,y,by_year[y]) for y in YEARS}
                  h2_by={str(y):mae_for_year(rows,y,by_year[y],horizon="H2",require_h3_o2=True) for y in YEARS}
                  h4_by={str(y):mae_for_year(rows,y,by_year[y],horizon="H4",require_h3_o2=True) for y in H4_YEARS}
                  o1_by={str(y):o1_shape_error_for_year(rows,y,by_year[y]) for y in YEARS}
                  round_err=defaultdict(list); tail=[]
                  for y in YEARS:
                      d=cell_mae_for_year(rows,y,by_year[y])
                      for rnd in range(1,7):
                          round_err[rnd].append(sum(d[f"r{rnd}_{t}"] for t in TIERS)/3.0)
                      tail.append(sum(d[c] for c in CELLS if cell_round(c)>=5)/6.0)
                  scores[cid]={
                      "loyo_h3_o2_macro_mae":sum(h3_by.values())/len(YEARS),
                      "h3_o2_mae_by_heldout_class":h3_by,
                      "loyo_h2_o2_macro_mae":sum(h2_by.values())/len(h2_by),
                      "h2_o2_mae_by_heldout_class":h2_by,
                      "loyo_mature_h4_o2_macro_mae":sum(h4_by.values())/len(h4_by),
                      "mature_h4_o2_mae_by_heldout_class":h4_by,
                      "loyo_h3_o1_normalized_shape_error":sum(o1_by.values())/len(o1_by),
                      "h3_o1_shape_error_by_heldout_class":o1_by,
                      "h3_o2_round_macro_mae":{str(r):sum(xs)/len(xs) for r,xs in round_err.items()},
                      "h3_o2_r5_r6_combined_macro_mae":sum(tail)/len(tail),
                  }
              return scores
          
          
          def at_bound(value:float,bounds:tuple[float,float]) -> dict[str,Any]:
              lo,hi=map(float,bounds); scale=max(1.0,abs(lo),abs(hi),abs(hi-lo)); tol=BOUND_REL_TOL*scale
              dlo=abs(float(value)-lo); dhi=abs(float(value)-hi)
              return {"value":float(value),"lower":lo,"upper":hi,"absolute_tolerance":tol,"at_lower":dlo<=tol,"at_upper":dhi<=tol,"at_hard_bound":dlo<=tol or dhi<=tol}
          
          
          def boundary_diagnostic(cid:str, fit:dict[str,Any], pre:dict[str,Any]) -> dict[str,Any]:
              fams=pre["candidate_families"]
              if cid=="C1_GLOBAL_SCALE_R1_R6":
                  checks={"k":at_bound(fit["parameters"]["k"],tuple(fams[cid]["bounds"]["k"]))}
                  return {"pass":not checks["k"]["at_hard_bound"],"parameter_checks":checks}
              if cid=="C2_ROUNDWISE_RESCALE_R1_R6":
                  checks={n:at_bound(fit["parameters"][n],tuple(fams[cid]["bounds"][n])) for n in (f"k{i}" for i in range(1,7))}
                  return {"pass":not any(v["at_hard_bound"] for v in checks.values()),"parameter_checks":checks}
              if cid=="C3_SMOOTH_ADDITIVE_R1_R6":
                  checks={n:at_bound(fit["parameters"][n],tuple(fams[cid]["bounds"][n])) for n in ("A","s12","s234","s56","tier_step")}
                  return {"pass":not any(v["at_hard_bound"] for v in checks.values()),"parameter_checks":checks}
              if cid=="C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6":
                  prior=fit["parameters"]["c3_prior_parameters"]; c3f=fams["C3_SMOOTH_ADDITIVE_R1_R6"]
                  checks={n:at_bound(prior[n],tuple(c3f["bounds"][n])) for n in ("A","s12","s234","s56","tier_step")}
                  alpha=int(fit["parameters"]["alpha"]); edge=alpha in (ALPHAS[0],ALPHAS[-1])
                  return {"pass":not edge and not any(v["at_hard_bound"] for v in checks.values()),"parameter_checks":checks,"selected_alpha":alpha,"alpha_grid_edge":edge}
              raise GateError(f"unsupported boundary diagnostic {cid}")
          
          
          def bootstrap_draws(rows:list[dict[str,Any]]) -> dict[int,dict[str,Any]]:
              rng=np.random.default_rng(BOOT_SEED); out={}; ci={c:i for i,c in enumerate(CELLS)}
              for y in YEARS:
                  xs=[r for r in rows if int(r["draft_year"])==y and r.get("primary_o2_ready") is True and outcome(r,"H3","O2") is not None]
                  clusters=sorted({str(r["stable_player_key"]) for r in xs}); cidx={c:i for i,c in enumerate(clusters)}
                  W=np.zeros((len(clusters),len(CELLS)))
                  for r in xs: W[cidx[str(r["stable_player_key"])],ci[str(r["cell"])]] += float(r["development_fit_weight_v8"])
                  ncl=len(clusters); probs=np.full(ncl,1.0/ncl); accepted=[]; need=BOOT_REPS; attempts=0
                  while need>0:
                      attempts+=1
                      if attempts>40: raise GateError(f"bootstrap valid-draw exhaustion {y}")
                      batch=max(need+500,2000); M=rng.multinomial(ncl,probs,size=batch); den=M@W; good=np.all(den>0,axis=1)
                      if np.any(good):
                          take=M[good][:need]; accepted.append(take); need-=len(take)
                  M=np.vstack(accepted)[:BOOT_REPS]
                  out[y]={"clusters":clusters,"cluster_index":cidx,"W":W,"M":M,"valid_draw_n":int(M.shape[0])}
              return out
          
          
          def bootstrap_candidate(rows:list[dict[str,Any]],draws:dict[int,dict[str,Any]],pred:dict[int,dict[str,float]],c0:dict[str,float]) -> dict[str,Any]:
              ci={c:i for i,c in enumerate(CELLS)}; year_diffs=[]
              for y in YEARS:
                  d=draws[y]; ncl=len(d["clusters"]); EC=np.zeros((ncl,len(CELLS))); E0=np.zeros((ncl,len(CELLS)))
                  for r in rows:
                      if int(r["draft_year"])!=y or r.get("primary_o2_ready") is not True: continue
                      yy=outcome(r,"H3","O2")
                      if yy is None: continue
                      i=d["cluster_index"][str(r["stable_player_key"])]; j=ci[str(r["cell"])]; w=float(r["development_fit_weight_v8"])
                      EC[i,j]+=w*abs(float(pred[y][str(r["cell"])])-yy); E0[i,j]+=w*abs(float(c0[str(r["cell"])])-yy)
                  M=d["M"]; den=M@d["W"]
                  if np.any(den<=0): raise GateError("bootstrap zero denominator")
                  cand=(M@EC)/den; base=(M@E0)/den; year_diffs.append(np.mean(cand-base,axis=1))
              diffs=np.mean(np.vstack(year_diffs),axis=0)
              return {"replicates":BOOT_REPS,"seed":BOOT_SEED,"paired":True,"cluster":"stable player identity within draft class","quantity":"candidate minus C0 LOYO H3 O2 macro MAE","mean_difference":float(np.mean(diffs)),"median_difference":float(np.median(diffs)),"one_sided_upper_95":float(np.quantile(diffs,0.95,method="linear")),"min":float(np.min(diffs)),"max":float(np.max(diffs))}
          
          
          def fit_fold_families(rows:list[dict[str,Any]],pre:dict[str,Any]) -> tuple[dict[str,dict[int,dict[str,float]]],dict[str,dict[int,Any]],dict[str,Any]]:
              preds={cid:{} for cid in ("C0_DEPLOYED",)+WINNER_ORDER}; fits={cid:{} for cid in WINNER_ORDER}
              c0=c0_values(pre)
              for y in YEARS: preds["C0_DEPLOYED"][y]=dict(c0)
              for hold in YEARS:
                  train=tuple(y for y in YEARS if y!=hold); sample=fit_sample(rows,train)
                  f1=c1_fit(sample,pre); f2=c2_fit(sample,pre); f3=c3_fit(sample,pre)
                  for cid,fit in (("C1_GLOBAL_SCALE_R1_R6",f1),("C2_ROUNDWISE_RESCALE_R1_R6",f2),("C3_SMOOTH_ADDITIVE_R1_R6",f3)):
                      if not fit["structural"]["structural_gate_pass"]: raise GateError(f"{cid} structural fit failure in holdout {hold}")
                      fits[cid][hold]=fit; preds[cid][hold]=fit["r1_r6_values"]
          
              alpha_results={}; alpha_fold_fits={}
              for alpha in ALPHAS:
                  alpha_fold_fits[alpha]={}; alpha_pred={}
                  for hold in YEARS:
                      train=tuple(y for y in YEARS if y!=hold); sample=fit_sample(rows,train)
                      fit=c4_from_train(sample,train,pre,alpha,c3_prior_fit=fits["C3_SMOOTH_ADDITIVE_R1_R6"][hold])
                      if not fit["structural"]["structural_gate_pass"]: raise GateError(f"C4 structural fit failure alpha={alpha} hold={hold}")
                      alpha_fold_fits[alpha][hold]=fit; alpha_pred[hold]=fit["r1_r6_values"]
                  h3={str(y):mae_for_year(rows,y,alpha_pred[y]) for y in YEARS}
                  alpha_results[alpha]={"loyo_h3_o2_macro_mae":sum(h3.values())/len(YEARS),"by_heldout_class":h3}
              best=min(alpha_results[a]["loyo_h3_o2_macro_mae"] for a in ALPHAS)
              near=[a for a in ALPHAS if alpha_results[a]["loyo_h3_o2_macro_mae"] <= best*1.01+EPS]
              selected_alpha=max(near)
              fits["C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6"]=alpha_fold_fits[selected_alpha]
              for hold in YEARS: preds["C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6"][hold]=alpha_fold_fits[selected_alpha][hold]["r1_r6_values"]
              diag={"grid":list(ALPHAS),"results":{str(a):alpha_results[a] for a in ALPHAS},"best_macro_mae":best,"within_1pct_of_best":near,"selected_alpha":selected_alpha,"selected_alpha_is_grid_edge":selected_alpha in (ALPHAS[0],ALPHAS[-1])}
              return preds,fits,diag
          
          
          def full_data_fits(rows:list[dict[str,Any]],pre:dict[str,Any],selected_alpha:int) -> dict[str,Any]:
              sample=fit_sample(rows,YEARS); f1=c1_fit(sample,pre); f2=c2_fit(sample,pre); f3=c3_fit(sample,pre); f4=c4_from_train(sample,YEARS,pre,selected_alpha,c3_prior_fit=f3)
              return {"C1_GLOBAL_SCALE_R1_R6":f1,"C2_ROUNDWISE_RESCALE_R1_R6":f2,"C3_SMOOTH_ADDITIVE_R1_R6":f3,"C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6":f4}
          
          
          def relative(new:float,base:float) -> float:
              if abs(base)<=EPS: raise GateError("zero baseline metric")
              return new/base-1.0
          
          
          def build_eligibility(
              rows:list[dict[str,Any]], pre:dict[str,Any], scores:dict[str,Any], fold_fits:dict[str,dict[int,Any]], full:dict[str,Any], alpha_diag:dict[str,Any], bootstrap:dict[str,Any], p1s:dict[str,Any], p2s:dict[str,Any]
          ) -> dict[str,Any]:
              c0=scores["C0_DEPLOYED"]; out={}
              retention=p1s["retention"]; source_ok=True
              for y in YEARS:
                  for c in CELLS:
                      # Source counts are validated before fitting; source_ok is explicit in the gate ledger.
                      pass
              all_retention=retention["all_108_year_cells_pass"] is True and float(retention["minimum_year_cell_retention"])>=0.95-EPS
              identity=p1s["identity"]
              identity_ok=float(identity["retained_identity_coverage"])>=0.95-EPS and float(identity["retained_sleeper_ready_coverage"])>=0.95-EPS and identity["all_retained_positions_supported"] is True
              all_readiness=all(v["pass"] is True for v in p2s["outcome_readiness_gate"]["by_year_cell"].values())
              for cid in WINNER_ORDER:
                  s=scores[cid]
                  improvement=(c0["loyo_h3_o2_macro_mae"]-s["loyo_h3_o2_macro_mae"])/c0["loyo_h3_o2_macro_mae"]
                  yrrel={str(y):relative(s["h3_o2_mae_by_heldout_class"][str(y)],c0["h3_o2_mae_by_heldout_class"][str(y)]) for y in YEARS}
                  improved_n=sum(v<0 for v in yrrel.values()); worst=max(yrrel.values())
                  o1rel=relative(s["loyo_h3_o1_normalized_shape_error"],c0["loyo_h3_o1_normalized_shape_error"])
                  h2rel=relative(s["loyo_h2_o2_macro_mae"],c0["loyo_h2_o2_macro_mae"])
                  h4rel=relative(s["loyo_mature_h4_o2_macro_mae"],c0["loyo_mature_h4_o2_macro_mae"])
                  round_rel={str(r):relative(s["h3_o2_round_macro_mae"][str(r)],c0["h3_o2_round_macro_mae"][str(r)]) for r in range(1,7)}
                  tailrel=relative(s["h3_o2_r5_r6_combined_macro_mae"],c0["h3_o2_r5_r6_combined_macro_mae"])
                  bdiag=boundary_diagnostic(cid,full[cid],pre)
                  gates={
                      "loyo_h3_o2_improvement_ge_5pct":improvement>=0.05-EPS,
                      "improves_at_least_5_of_6_heldout_classes":improved_n>=5,
                      "worst_heldout_class_relative_regression_le_10pct":worst<=0.10+EPS,
                      "paired_cluster_bootstrap_upper95_lt_0":bootstrap[cid]["one_sided_upper_95"]<0.0,
                      "h3_o1_shape_regression_vs_C0_le_2pct":o1rel<=0.02+EPS,
                      "h2_o2_regression_vs_C0_le_2pct":h2rel<=0.02+EPS,
                      "mature_h4_o2_regression_vs_C0_le_2pct":h4rel<=0.02+EPS,
                      "no_individual_round_h3_o2_regression_worse_than_5pct":max(round_rel.values())<=0.05+EPS,
                      "combined_r5_r6_h3_o2_regression_le_2pct":tailrel<=0.02+EPS,
                      "all_fold_fits_structurally_valid":all(fold_fits[cid][y]["structural"]["structural_gate_pass"] for y in YEARS),
                      "final_diagnostic_fit_structurally_valid":full[cid]["structural"]["structural_gate_pass"] is True,
                      "v8_amended_source_gate_pass":source_ok,
                      "development_occurrence_retention_ge_95pct":all_retention,
                      "development_occurrence_identity_coverage_ge_95pct":identity_ok,
                      "every_development_year_cell_retention_ge_95pct":all_retention,
                      "every_development_year_cell_identity_coverage_ge_95pct":identity_ok,
                      "every_development_year_cell_outcome_readiness_ge_95pct":all_readiness,
                      "no_forbidden_holdout_market_vote_leakage":p2s["holdout_2024_pick_identity_file_read"] is False and p2s["holdout_2024_rookie_outcomes_scored"] is False and p2s["market_or_ktc_values_read"] is False and p2s["package_vote_data_read"] is False,
                      "no_hard_numeric_bound_saturation":bdiag["pass"] is True,
                  }
                  if cid=="C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6":
                      gates["c4_selected_alpha_not_grid_edge"]=int(alpha_diag["selected_alpha"]) not in (ALPHAS[0],ALPHAS[-1])
                  eligible=all(gates.values())
                  out[cid]={
                      "eligible":eligible,
                      "loyo_h3_o2_improvement_vs_C0":improvement,
                      "heldout_class_relative_mae_vs_C0":yrrel,
                      "improved_heldout_class_n":improved_n,
                      "worst_heldout_class_relative_regression":worst,
                      "o1_shape_relative_regression_vs_C0":o1rel,
                      "h2_o2_relative_regression_vs_C0":h2rel,
                      "mature_h4_o2_relative_regression_vs_C0":h4rel,
                      "round_h3_o2_relative_regression_vs_C0":round_rel,
                      "combined_r5_r6_h3_o2_relative_regression_vs_C0":tailrel,
                      "bootstrap":bootstrap[cid],
                      "boundary_saturation":bdiag,
                      "gates":gates,
                  }
              return out
          
          
          def select_candidate(pre:dict[str,Any],scores:dict[str,Any],eligibility:dict[str,Any]) -> str|None:
              eligible=[cid for cid in WINNER_ORDER if eligibility[cid]["eligible"]]
              if not eligible: return None
              best=min(scores[c]["loyo_h3_o2_macro_mae"] for c in eligible)
              near=[c for c in eligible if scores[c]["loyo_h3_o2_macro_mae"]<=best*1.01+EPS]
              order={c:i for i,c in enumerate(WINNER_ORDER)}; near.sort(key=lambda c:order[c]); return near[0]
          
          
          def fit_selected(rows:list[dict[str,Any]],pre:dict[str,Any],selected:str,selected_alpha:int) -> dict[str,Any]:
              sample=fit_sample(rows,YEARS)
              if selected=="C1_GLOBAL_SCALE_R1_R6": return c1_fit(sample,pre)
              if selected=="C2_ROUNDWISE_RESCALE_R1_R6": return c2_fit(sample,pre)
              if selected=="C3_SMOOTH_ADDITIVE_R1_R6": return c3_fit(sample,pre)
              if selected=="C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6":
                  prior=c3_fit(sample,pre); return c4_from_train(sample,YEARS,pre,selected_alpha,c3_prior_fit=prior)
              raise GateError(f"unknown selected family {selected}")
          
          
          def sparse_sensitivity(rows:list[dict[str,Any]],pre:dict[str,Any],selected:str|None,selected_alpha:int,primary_fit:dict[str,Any]|None) -> dict[str,Any]:
              controls={
                  "used_for_candidate_family_selection":False,
                  "used_for_hyperparameter_selection":False,
                  "source_membership_changed":False,
                  "primary_fit_includes_frozen_2018_r6":True,
              }
              if selected is None or primary_fit is None:
                  return {"status":"SKIPPED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE","controls":controls,"runs":[]}
          
              runs=[]
              primary_vals=primary_fit["r1_r6_values"]
              def run_variant(name:str,filtered:list[dict[str,Any]],removed:dict[str,Any]) -> None:
                  fit=fit_selected(filtered,pre,selected,selected_alpha)
                  vals=fit["r1_r6_values"]
                  diffs={c:float(vals[c])-float(primary_vals[c]) for c in CELLS}
                  rels={c:(float(vals[c])/float(primary_vals[c])-1.0) for c in CELLS}
                  runs.append({"name":name,"removed":removed,"remaining_occurrence_n":len(filtered),"fit":fit,"cell_absolute_delta_vs_primary":diffs,"cell_relative_delta_vs_primary":rels,"max_abs_relative_cell_delta":max(abs(v) for v in rels.values())})
          
              no_r6=[r for r in rows if not (int(r["draft_year"])==2018 and cell_round(str(r["cell"]))==6)]
              run_variant("fit_excluding_all_2018_r6_occurrences",no_r6,{"2018_r6_occurrences_removed":sum(1 for r in rows if int(r["draft_year"])==2018 and cell_round(str(r["cell"]))==6)})
          
              # The frozen source exception is six leagues per 2018-R6 year-cell, but the exact
              # membership sets are cell-specific.  The six LOLO variants therefore align the
              # sorted membership index independently inside each of the three R6 cells.  This
              # creates exactly six preregistered variants without altering source membership.
              memberships={c:sorted({str(r["source_league_key"]) for r in rows if int(r["draft_year"])==2018 and str(r["cell"])==c}) for c in ("r6_early","r6_mid","r6_late")}
              if not all(len(v)==6 for v in memberships.values()):
                  raise GateError(f"2018 R6 LOLO membership width drift: { {k:len(v) for k,v in memberships.items()} }")
              for idx in range(6):
                  removed_by_cell={c:memberships[c][idx] for c in memberships}
                  filtered=[r for r in rows if not (int(r["draft_year"])==2018 and str(r["cell"]) in removed_by_cell and str(r["source_league_key"])==removed_by_cell[str(r["cell"])])]
                  run_variant(f"2018_r6_leave_one_source_index_out_{idx+1}",filtered,{"membership_index":idx+1,"removed_source_league_by_cell":removed_by_cell})
              return {"status":"COMPLETED_AFTER_PRIMARY_SELECTION","controls":controls,"variant_count":len(runs),"runs":runs}
          
          
          def main_fit(args: argparse.Namespace) -> None:
              pre=load(Path(args.prereg)); validate_prereg(pre)
              p2=Path(args.phase2_dir); p1=Path(args.phase1_dir); out=Path(args.out_dir); out.mkdir(parents=True,exist_ok=True)
              p2s=load(p2/"v8_phase2_historical_outcome_summary.json"); p2m=load(p2/"v8_phase2_historical_outcome_manifest.json")
              p1s=load(p1/"v8_phase1_1_position_retention_hardening.json"); p1m=load(p1/"v8_phase1_1_position_retention_hardening_manifest.json")
              for name, expected in p2m["output_hashes"].items():
                  path=p2/name
                  if not path.exists() or sha(path)!=expected:
                      raise GateError(f"Phase 2 artifact hash drift: {name}")
              p1_rows=p1/"v8_phase1_1_position_retention_occurrences.jsonl"
              if sha(p1_rows)!=p1m["retained_occurrences_sha256"]:
                  raise GateError("Phase 1.1 retained-occurrence artifact hash drift")
              dev=p2/"v8_phase2_development_outcomes.jsonl"; rows=read_jsonl(dev)
              input_diag=validate_phase_inputs(rows,p2s,p2m,p1s,p1m)
          
              preds,fold_fits,alpha_diag=fit_fold_families(rows,pre)
              scores=score_predictions(rows,preds)
              full=full_data_fits(rows,pre,int(alpha_diag["selected_alpha"]))
              draws=bootstrap_draws(rows)
              bootstrap={cid:bootstrap_candidate(rows,draws,preds[cid],c0_values(pre)) for cid in WINNER_ORDER}
              eligibility=build_eligibility(rows,pre,scores,fold_fits,full,alpha_diag,bootstrap,p1s,p2s)
              selected=select_candidate(pre,scores,eligibility)
              final_fit=fit_selected(rows,pre,selected,int(alpha_diag["selected_alpha"])) if selected else None
              if selected:
                  diag=full[selected]
                  if clean(final_fit["parameters"]) != clean(diag["parameters"]):
                      raise GateError("selected final refit parameter mismatch vs performance-blind full-data diagnostic")
                  for c in CELLS:
