                  "v8_source_availability_amendment_preserved":True,
                  "development_outcomes_read":True,
                  "holdout_2024_pick_identity_file_read":False,
                  "holdout_2024_rookie_outcomes_read":False,
                  "holdout_2024_outcomes_remain_sealed":True,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "year_discount_fit_or_changed":False,
                  "production_change_authorized":False,
                  "automatic_production_promotion_allowed":False,
                  "candidate_fit_performed":True,
                  "candidate_scores_computed":True,
                  "candidate_selection_performed":True,
                  "input_diagnostics":input_diag,
                  "folds":pre["development_selection"]["folds"],
                  "candidate_scores":scores,
                  "c4_alpha_selection":alpha_diag,
                  "bootstrap_results":bootstrap,
                  "full_data_boundary_diagnostics":{cid:boundary_diagnostic(cid,full[cid],pre) for cid in WINNER_ORDER},
                  "eligibility_gate_results":eligibility,
                  "eligible_candidates":eligible_ids,
                  "selected_candidate":selected,
                  "winner_rule":pre["development_selection"]["winner_rule"],
                  "final_candidate_frozen":selected is not None,
                  "final_candidate":({"candidate_id":selected,"parameters":final_fit["parameters"],"r1_r6_values":final_fit["r1_r6_values"],"structural":final_fit["structural"],"exact_slot_values":final_fit.get("exact_slot_values")} if selected else None),
                  "sparse_2018_r6_sensitivity_completed_after_selection":sensitivity["status"]=="COMPLETED_AFTER_PRIMARY_SELECTION",
                  "sparse_2018_r6_sensitivity_used_for_selection":False,
                  "2024_H2_outcome_open_authorized_next_stage":selected is not None,
                  "next_stage":"draft-pick-fv-v8-phase4-2024-h2-temporal-confirmation" if selected else "draft-pick-fv-v8-phase3-closeout-no-development-candidate",
                  "input_hashes":{
                      Path(args.prereg).name:sha(Path(args.prereg)),
                      "v8_phase1_1_position_retention_hardening.json":sha(p1/"v8_phase1_1_position_retention_hardening.json"),
                      "v8_phase1_1_position_retention_hardening_manifest.json":sha(p1/"v8_phase1_1_position_retention_hardening_manifest.json"),
                      "v8_phase2_development_outcomes.jsonl":sha(dev),
                      "v8_phase2_historical_outcome_summary.json":sha(p2/"v8_phase2_historical_outcome_summary.json"),
                      "v8_phase2_historical_outcome_manifest.json":sha(p2/"v8_phase2_historical_outcome_manifest.json"),
                  },
              }
              result_path=out/"v8_phase3_loyo_development_selection.json"; boot_path=out/"v8_phase3_loyo_bootstrap.json"; cand_path=out/"v8_phase3_frozen_development_candidate.json"; sens_path=out/"v8_phase3_sparse_2018_r6_sensitivity.json"; md_path=out/"v8_phase3_loyo_development_selection.md"; man_path=out/"v8_phase3_loyo_development_selection_manifest.json"
              write_json(result_path,result)
              write_json(boot_path,{"schema_version":1,"stage":"phase3_paired_cluster_bootstrap","generated_at_utc":generated,"replicates":BOOT_REPS,"seed":BOOT_SEED,"paired":True,"cluster":"stable player identity within draft class","candidate_fit_performed_inside_bootstrap":False,"out_of_fold_predictions_held_fixed":True,"results":bootstrap})
              write_json(cand_path,{"schema_version":1,"stage":"phase3_frozen_development_candidate","generated_at_utc":generated,"decision":decision,"selected_candidate":selected,"eligible_candidates":eligible_ids,"candidate_parameters_frozen_before_2024_outcome_access":selected is not None,"candidate":result["final_candidate"],"holdout_2024_outcomes_read":False,"production_change_authorized":False,"next_stage":result["next_stage"]})
              write_json(sens_path,sensitivity)
              lines=["# Draft Pick FV V8 — Phase 3 LOYO Development Selection","",f"**Decision:** `{decision}`","","| Candidate | LOYO H3 O2 MAE | Improvement vs C0 | Eligible |","|---|---:|---:|---|"]
              for cid in ("C0_DEPLOYED",)+WINNER_ORDER:
                  s=scores[cid]
                  if cid=="C0_DEPLOYED": imp=0.0; elig="BASELINE"
                  else: imp=eligibility[cid]["loyo_h3_o2_improvement_vs_C0"]; elig="YES" if eligibility[cid]["eligible"] else "NO"
                  lines.append(f"| {cid} | {s['loyo_h3_o2_macro_mae']:.2f} | {imp:.2%} | {elig} |")
              lines += ["","## C4 shrinkage","",f"- Selected alpha: **{alpha_diag['selected_alpha']}**",f"- Grid-edge alpha: **{'Yes' if alpha_diag['selected_alpha_is_grid_edge'] else 'No'}**","","## Selection","",(f"Frozen development winner: **{selected}**." if selected else "No preregistered V7 candidate family passed every V8 Phase 3 development gate."),"","## 2018 R6 source-sparse control","",f"- Primary fit used frozen 2018 R6: **Yes**",f"- Sensitivity used for model/hyperparameter selection: **No**",f"- Sensitivity status: **{sensitivity['status']}**",f"- Sensitivity variants: **{len(sensitivity.get('runs',[]))}**","","## Firewalls","","- 2024 holdout rookie outcomes read: **No**","- KTC/current market values read: **No**","- Package-vote evidence read: **No**","- YEAR_DISCOUNT changed: **No**","- Production change authorized: **No**",""]
              md_path.write_text("\n".join(lines),encoding="utf-8")
              manifest={"schema_version":1,"study_id":result["study_id"],"stage":result["stage"],"status":result["status"],"generated_at_utc":generated,"decision":decision,"candidate_fit_performed":True,"candidate_scores_computed":True,"candidate_selection_performed":True,"selected_candidate":selected,"eligible_candidate_n":len(eligible_ids),"final_candidate_frozen":selected is not None,"holdout_2024_outcomes_read":False,"2024_H2_outcome_open_authorized_next_stage":selected is not None,"production_change_authorized":False,"sparse_2018_r6_sensitivity_status":sensitivity["status"],"next_stage":result["next_stage"],"input_hashes":result["input_hashes"],"output_hashes":{result_path.name:sha(result_path),boot_path.name:sha(boot_path),cand_path.name:sha(cand_path),sens_path.name:sha(sens_path),md_path.name:sha(md_path)}}
              write_json(man_path,manifest)
              print(f"DECISION={decision}"); print(f"ELIGIBLE={eligible_ids}"); print(f"SELECTED={selected}")
              for cid in ("C0_DEPLOYED",)+WINNER_ORDER: print(cid,f"H3_MAE={scores[cid]['loyo_h3_o2_macro_mae']:.6f}")
