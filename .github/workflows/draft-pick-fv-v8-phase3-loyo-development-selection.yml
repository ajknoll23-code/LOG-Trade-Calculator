          python3 "${RUNNER_TEMP}/v8_phase3_loyo.py"             --check             --out-dir "$OUT"

      - name: Independent Phase 3 closeout audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"p3"
          r=json.loads((out/"v8_phase3_loyo_development_selection.json").read_text())
          m=json.loads((out/"v8_phase3_loyo_development_selection_manifest.json").read_text())
          s=json.loads((out/"v8_phase3_sparse_2018_r6_sensitivity.json").read_text())

          allowed={
              "PASS_V8_PHASE3_LOYO_DEVELOPMENT_WINNER_FROZEN_2024_H2_AUTHORIZED_NEXT_STAGE",
              "STOP_NO_V8_R1_R6_DEVELOPMENT_CANDIDATE",
          }
          assert r["decision"] in allowed
          assert m["decision"]==r["decision"]

          assert r["study_id"]=="draft-pick-fv-v8-depth-specific-source-cohorts"
          assert r["candidate_fit_performed"] is True
          assert r["candidate_scores_computed"] is True
          assert r["candidate_selection_performed"] is True
          assert r["holdout_2024_pick_identity_file_read"] is False
          assert r["holdout_2024_rookie_outcomes_read"] is False
          assert r["holdout_2024_outcomes_remain_sealed"] is True
          assert r["market_or_ktc_values_read"] is False
          assert r["package_vote_data_read"] is False
          assert r["year_discount_fit_or_changed"] is False
          assert r["production_change_authorized"] is False
          assert r["automatic_production_promotion_allowed"] is False
          assert r["sparse_2018_r6_sensitivity_used_for_selection"] is False

          expected_candidates={
              "C0_DEPLOYED",
              "C1_GLOBAL_SCALE_R1_R6",
              "C2_ROUNDWISE_RESCALE_R1_R6",
              "C3_SMOOTH_ADDITIVE_R1_R6",
              "C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6",
          }
          assert set(r["candidate_scores"])==expected_candidates
          assert set(r["eligibility_gate_results"])==expected_candidates-{"C0_DEPLOYED"}
          assert len(r["c4_alpha_selection"]["results"])==9

          selected=r["selected_candidate"]
          assert bool(selected)==bool(r["final_candidate_frozen"])
          assert bool(selected)==bool(r["2024_H2_outcome_open_authorized_next_stage"])
          assert bool(selected)==bool(m["final_candidate_frozen"])
          assert bool(selected)==bool(m["2024_H2_outcome_open_authorized_next_stage"])

          if selected is not None:
              assert selected in r["eligible_candidates"]
              assert r["eligibility_gate_results"][selected]["eligible"] is True
              assert r["final_candidate"]["structural"]["structural_gate_pass"] is True
              assert s["status"]=="COMPLETED_AFTER_PRIMARY_SELECTION"
              assert s["variant_count"]==7
              assert len(s["runs"])==7
          else:
              assert r["eligible_candidates"]==[]
              assert s["status"]=="SKIPPED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE"

          def walk(x):
              if isinstance(x,float):
                  assert math.isfinite(x)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)

          walk(r)
          walk(s)

          print("PASS: Phase 3 scientific closeout is internally consistent and research-only.")
          print("DECISION =",r["decision"])
          print("SELECTED =",selected)
          print("ELIGIBLE =",r["eligible_candidates"])
          print("C4_ALPHA =",r["c4_alpha_selection"]["selected_alpha"])
          PY

      - name: Upload Phase 3 frozen research artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-p3-loyo-development-selection
          path: |
            ${{ runner.temp }}/p3/v8_phase3_loyo_development_selection.json
            ${{ runner.temp }}/p3/v8_phase3_loyo_development_selection_manifest.json
            ${{ runner.temp }}/p3/v8_phase3_loyo_development_selection.md
            ${{ runner.temp }}/p3/v8_phase3_loyo_bootstrap.json
            ${{ runner.temp }}/p3/v8_phase3_frozen_development_candidate.json
            ${{ runner.temp }}/p3/v8_phase3_sparse_2018_r6_sensitivity.json
            ${{ runner.temp }}/v8_phase3_loyo.py
          if-no-files-found: error
          retention-days: 30
