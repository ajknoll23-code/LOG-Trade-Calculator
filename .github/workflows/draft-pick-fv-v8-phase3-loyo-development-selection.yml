                          raise GateError(f"selected final refit value mismatch {c}")
                  if not final_fit["structural"]["structural_gate_pass"]:
                      raise GateError("selected final fit structurally invalid")
          
              sensitivity=sparse_sensitivity(rows,pre,selected,int(alpha_diag["selected_alpha"]),final_fit)
              decision=("PASS_V8_PHASE3_LOYO_DEVELOPMENT_WINNER_FROZEN_2024_H2_AUTHORIZED_NEXT_STAGE" if selected else pre["development_selection"]["none_eligible"].replace("V7","V8"))
              generated=now(); eligible_ids=[c for c in WINNER_ORDER if eligibility[c]["eligible"]]
              result={
                  "schema_version":1,
                  "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
                  "stage":"phase3_loyo_development_selection",
