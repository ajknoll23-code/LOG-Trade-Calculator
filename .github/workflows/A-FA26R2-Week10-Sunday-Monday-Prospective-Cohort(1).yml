name: A-FA26R2 - Week 10 Sunday-Monday Prospective Cohort Repair
# One 2026 Week 10 Thursday game already occurred. This freezes only still-upcoming games.
# Exact calendar: WAS@NYG Thu Nov 12; Sun Nov 15 first kickoff 14:30 UTC; four NFL byes.
# Public code only. All private scores, expert rankings and frozen snapshots remain browser-local.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first. Apply only after preview passes.
        required: true
        default: preview
        type: choice
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  fa26-week10-partial:
    name: Week 10 pregame subset validation (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage source-pinned FA26R2 Week 10 exclusion update
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/fa26r2_patch.py <<'PYCODE'
          from pathlib import Path
          import subprocess
          p=Path('assets/fa_validation_v1.js')
          assert p.exists(), 'Missing FA26 validation module'
          original_hash=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert original_hash=='3d34a8140a3d119c7858975fa0bf9e5600919a7f', f'FA26 source drift: {original_hash}; review required'
          s=p.read_text('utf-8')

          def replace_once(old,new):
              global s
              n=s.count(old)
              assert n==1, f'Expected exactly one patch anchor, got {n}: {old[:110]!r}'
              s=s.replace(old,new,1)

          replace_once("const GROUPS=['DL','LB','DB'];", """const GROUPS=['DL','LB','DB'];
           // FA26R2 fixed 2026 W10 calendar: Thu WAS@NYG already played; CHI/DEN/PHI/TB on bye.
           // The comparison universe excludes all six teams for BOTH FA25 and 4for4 cohorts.
           const W10_EXCLUDED=Object.freeze(['WAS','NYG','CHI','DEN','PHI','TB']);
           const W10_SUNDAY_FIRST_KICKOFF_UTC='2026-11-15T14:30:00Z';
           const W10_CUTOFF_MS=Date.parse(W10_SUNDAY_FIRST_KICKOFF_UTC);
           const W10_RULE='THURSDAY_AND_BYE_TEAMS_EXCLUDED';
           function validWeek10Rule(p){
             if(p?.week!==10)return true;
             const rule=p.partial_week;
             return rule?.mode===W10_RULE &&
               rule.first_remaining_kickoff_utc===W10_SUNDAY_FIRST_KICKOFF_UTC &&
               Array.isArray(rule.excluded_teams) &&
               rule.excluded_teams.join('|')===W10_EXCLUDED.join('|');
           }
           function studyCandidates(snap){
             const p=snap.payload;
             // Invalid/legacy W10 captures are never silently treated as validated partial cohorts.
             if(!validWeek10Rule(p))return [];
             return p.week===10 ? p.candidates.filter(c=>!W10_EXCLUDED.includes(c.team)) : p.candidates;
           }
          """)
          replace_once("Array.isArray(p.candidates)&&p.candidates.length>=1&&p.candidates.length<=6000&&", "Array.isArray(p.candidates)&&p.candidates.length>=1&&p.candidates.length<=6000&&\n    validWeek10Rule(p)&&")
          replace_once("return snap.payload.candidates.filter(r=>r.group===group &&", "return studyCandidates(snap).filter(r=>r.group===group &&")
          replace_once("const snapshot=frozen.payload.candidates;", "const snapshot=studyCandidates(frozen);")
          replace_once("If any games already started, this is a partial/exploratory capture, not a clean full-week prospective test.",
          "For Week 10, Thursday WAS/NYG and the four bye teams CHI/DEN/PHI/TB are excluded from <strong>both</strong> comparison methods. Freeze before Sunday Nov 15 at 9:30 a.m. Eastern (7:30 a.m. Arizona). This is a prospective Sunday–Monday subset, not a full-week study; do not freeze if any other games have begun.")
          replace_once("const payload=read();if(!payload)", "const sourcePayload=read();if(!sourcePayload)")
          replace_once("if(payload.season!==2026||payload.week!==w||!validInt(w,10,18)||", "if(sourcePayload.season!==2026||sourcePayload.week!==w||!validInt(w,10,18)||")
          replace_once("!Array.isArray(payload.candidates)||payload.candidates.length<1)", "!Array.isArray(sourcePayload.candidates)||sourcePayload.candidates.length<1)")
          replace_once("if(!isNum(payload.free_agent_sync_unix)||(Date.now()/1000-payload.free_agent_sync_unix)>72*3600)", "if(!isNum(sourcePayload.free_agent_sync_unix)||(Date.now()/1000-sourcePayload.free_agent_sync_unix)>72*3600)")
          replace_once("if(!validInt(payload.observed_last_completed_week,5,18)||payload.observed_last_completed_week>=w)", "if(!validInt(sourcePayload.observed_last_completed_week,5,18)||sourcePayload.observed_last_completed_week>=w)")
          replace_once("     try{\n       if(await dbRead(snapshotKey(w)))", """     if(w===10&&Date.now()>=W10_CUTOFF_MS){say('Week 10 Sunday/Monday subset cutoff has passed (Sunday 9:30 a.m. ET). A new freeze would include started games; use a later week instead.',true);return;}
               const payload=w===10 ? {...sourcePayload,partial_week:{mode:W10_RULE,
                 excluded_teams:[...W10_EXCLUDED],first_remaining_kickoff_utc:W10_SUNDAY_FIRST_KICKOFF_UTC,
                 excluded_reason:'Nov 12 WAS @ NYG completed before capture; CHI DEN PHI TB on Week 10 bye',
                 study_scope:'W10 games scheduled November 15-16 only'}} : sourcePayload;
               try{
                 if(await dbRead(snapshotKey(w)))""")
          replace_once("Week ${w} locally frozen once · ${payload.candidates.length} IDPs · SHA", "Week ${w} locally frozen once · ${studyCandidates(record).length} eligible of ${payload.candidates.length} IDPs${w===10?' (Thu WAS/NYG + bye teams excluded)':''} · SHA")
          replace_once("Frozen W${w} · ${data.payload.candidates.length} IDPs · captured", "Frozen W${w} · ${studyCandidates(data).length} eligible of ${data.payload.candidates.length} IDPs${w===10?' (Thu WAS/NYG + bye teams excluded)':''} · captured")
          replace_once("<div class=\"fa26-report-head\"><strong>Frozen Week ${w} evaluation</strong>", "<div class=\"fa26-report-head\"><strong>Frozen Week ${w} evaluation${w===10?' · Sunday–Monday only (Thu & byes excluded)':''}</strong>")
          # No storage overwrite, network upload, or alteration to valuation/FA25 code.
          p.write_text(s,'utf-8')
          assert s.count('W10_EXCLUDED')>=4
          print('FA26R2 PATCHED: Week 10 excludes Thursday and bye teams from all validation cohorts')
          PYCODE
          python3 /tmp/fa26r2_patch.py
      - name: Validate syntax, privacy, and restricted write-set
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_validation_v1.js
          git diff --check
          python3 - <<'PYCODE'
          import subprocess
          from pathlib import Path
          p=Path('assets/fa_validation_v1.js'); s=p.read_text('utf-8')
          old=subprocess.check_output(['git','show','HEAD:assets/fa_validation_v1.js'],text=True)
          assert 'W10_EXCLUDED' in s and 'studyCandidates(snap)' in s
          assert 'Sunday–Monday only' in s and '2026-11-15T14:30:00Z' in s
          assert s.count('W10_EXCLUDED')>=4
          # Browser-private storage and public GET calls have not been expanded.
          assert s.count('fetch(')==old.count('fetch(')
          assert s.count('indexedDB.open(')==old.count('indexedDB.open(')
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed).issubset({'assets/fa_validation_v1.js'}),changed
          for critical in ['assets/fa_multisource_targets_v1.js','assets/fa_4for4_waiver_v1.js','free-agent-board.html','data/','config.json']:
            assert subprocess.run(['git','diff','--quiet','--',critical],check=False).returncode==0,critical
          print('PASS: source pinned, JS valid, Thursday/byes excluded, no paid data or model modifications')
          PYCODE
      - name: Prepare browser environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        shell: bash
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser test Thursday and bye exclusions in both cohorts
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/fa26r2_browser.py <<'PYCODE'
          import json, threading, time
          from pathlib import Path
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright

          OUT=Path('fa26r2-qa-artifacts');OUT.mkdir(exist_ok=True)
          GROUPS=['DL','LB','DB']
          teams=['WAS','NYG','CHI','DEN','PHI','TB','HOU','LAC','MIA','BUF','PIT','CLE','ARI','LV']
          players=[]
          for gi,g in enumerate(GROUPS):
           for j,team in enumerate(teams):
            players.append(dict(id=str(880000+gi*100+j),name=f'Synthetic {g} {j}',team=team,group=g,
               weekly_category='starter',weekly_order=0,weekly_top=2,four_points=24-j*.35,
               four_group_rank=j+1,prev_week=9,prev_snaps=40,utility_rank=j+1,injury=None))
          payload=dict(schema_version=1,season=2026,week=10,scoring='log',observed_last_completed_week=9,
           free_agent_sync_unix=1794604100,candidates=players)
          # Real snapshot is allowed before remaining Sunday games, no paid contents in fixture.
          fixture='''<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/fa_validation_v1.css"></head><body>
          <div id="fa-ws-idp-panel"><input id="fa24Week" type="number" value="10"><div id="fa24Lab"></div></div>
          <script>window.LOG_FA26_READ=()=>JSON.parse(document.getElementById('fake').textContent);</script>
          <script id="fake" type="application/json">'''+json.dumps(payload).replace('<','\\u003c')+'''</script>
          <script src="/assets/fa_validation_v1.js"></script></body></html>'''
          Path('fa26r2-fixture.html').write_text(fixture,encoding='utf-8')
          class Quiet(SimpleHTTPRequestHandler):
           def log_message(self,*a):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),Quiet);port=server.server_port
          threading.Thread(target=server.serve_forever,daemon=True).start()
          results=[]
          try:
           with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True)
            for width in [320,360,390,430,768,1280]:
             context=browser.new_context(viewport={'width':width,'height':800},accept_downloads=True)
             context.add_init_script('Date.now=()=>Date.parse("2026-11-14T04:00:00Z")')
             page=context.new_page()
             page.goto(f'http://127.0.0.1:{port}/fa26r2-fixture.html',wait_until='domcontentloaded')
             page.locator('#fa26Confirm').check()
             page.locator('#fa26Capture').click()
             page.wait_for_function("document.getElementById('fa26Status').textContent.includes('eligible of')",timeout=12000)
             status=page.locator('#fa26Status').inner_text()
             assert '24 eligible of 42' in status,status
             assert 'Thu WAS/NYG + bye teams excluded' in status,status
             data=page.evaluate('''async () => {
              const db=await new Promise((resolve,reject)=>{
                const q=indexedDB.open('LOG_Private_FA26_ProspectiveValidation_v1');
                q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
              });
              const frozen=await new Promise((resolve,reject)=>{
                const q=db.transaction('snapshots','readonly').objectStore('snapshots').get('2026-W10');
                q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
              });db.close();return frozen;
             }''')
             assert data['payload']['partial_week']['excluded_teams']==['WAS','NYG','CHI','DEN','PHI','TB']
             assert len(data['payload']['candidates'])==42,'Snapshot must preserve complete original pool'
             assert len(data['sha256'])==64
             # Only actual outcomes for eligible teams; excluded teams are present to catch leakage.
             outcome={'schema_version':1,'season':2026,
                'classification':'PUBLIC_SLEEPER_WEEKLY_IDP_EVIDENCE_NOT_PROJECTION_OR_BREAKOUT',
                'last_completed_week':10,
                'source_manifest':[{'week':10,'response_sha256':'a'*64}],
                'players':[{'sleeper_id':r['id'],'observations':[{'week':10,'defensive_snaps':50}]} for r in players]}
             page.route('https://raw.githubusercontent.com/**',lambda route:route.fulfill(status=200,content_type='application/json',body=json.dumps(outcome)))
             page.locator('#fa26Evaluate').click()
             page.wait_for_function("document.getElementById('fa26OutStatus').textContent.includes('public defensive snaps loaded')",timeout=12000)
             report=page.locator('#fa26Report').inner_text()
             assert 'Sunday–Monday only (Thu & byes excluded)' in report,report
             table=page.locator('#fa26Report table').first
             trs=table.locator('tbody tr')
             assert trs.count()==3
             for g,i in zip(GROUPS,range(3)):
                assert trs.nth(i).locator('td').first.inner_text()=='8',g+trs.nth(i).inner_text()
                assert '50.0 vs 50.0' in trs.nth(i).inner_text(),g+trs.nth(i).inner_text()
             cat=page.locator('#fa26Report table').nth(1).locator('tbody tr').first
             assert cat.locator('td').first.inner_text()=='24',cat.inner_text()
             if width in (390,1280):page.screenshot(path=str(OUT/f'FA26R2-week10-{width}.png'),full_page=False)
             results.append(dict(width=width,snapshotted=42,eligible=24,excluded=18,baseline_per_group=8,pass_test=True))
             context.close()
            # Capture after Sunday first kickoff must be blocked.
            context=browser.new_context(viewport={'width':390,'height':800})
            context.add_init_script('Date.now=()=>Date.parse("2026-11-15T15:00:00Z")')
            page=context.new_page();page.goto(f'http://127.0.0.1:{port}/fa26r2-fixture.html',wait_until='domcontentloaded')
            page.locator('#fa26Confirm').check();page.locator('#fa26Capture').click()
            page.wait_for_function("document.getElementById('fa26Status').textContent.includes('cutoff has passed')",timeout=12000)
            results.append({'late_capture':'blocked','pass_test':True})
            context.close();browser.close()
          finally:server.shutdown()
          (OUT/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          print('FA26R2 browser QA passed: '+json.dumps(results))
          PYCODE
          python /tmp/fa26r2_browser.py
      - name: Upload synthetic QA artifacts (no subscriber data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA26R2-Week10-Synthetic-QA
          path: fa26r2-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Confirm preview did not deploy
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'PASS — preview only; production files unchanged.'
      - name: Deploy verified FA26R2 UI change
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f fa26r2-fixture.html
          rm -rf fa26r2-qa-artifacts
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'assets/fa_validation_v1.js' || test -z "$changed"
          if git diff --quiet; then
            echo 'Already deployed — no changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- assets/fa_validation_v1.js
            git commit -m 'FA26R2: partial Week 10 prospective cohort excludes played game and byes'
            git push origin HEAD:main
          fi
          echo 'PASS: private FA26 research logic only; no valuation or source dataset changes.'
