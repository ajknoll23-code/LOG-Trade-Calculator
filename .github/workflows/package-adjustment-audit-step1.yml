name: Package Adjustment Audit Step 1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Step 1 padding-invariance hardening
        run: |
          echo '' | base64 --decode > /tmp/package_audit_step1.py
          python3 /tmp/package_audit_step1.py

      - name: Run live JavaScript adversarial tests
        run: |
          echo '' | base64 --decode > /tmp/package_audit_step1.js
          node /tmp/package_audit_step1.js

      - name: Verify Step 1 static contract
        run: |
          echo '' | base64 --decode > /tmp/package_audit_step1_verify.py
          python3 /tmp/package_audit_step1_verify.py

      - name: Commit Step 1 hardening
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add research/package-adjustment-production-candidate-v1/live_deployment.json
          git add research/package-adjustment-production-candidate-v1/audit_clean_plan.md

          if git diff --cached --quiet; then
            echo "No Step 1 changes."
            exit 0
          fi

          git commit -m "Harden Package Adjustment tiny padding behavior"
          git pull --rebase origin main
          git push origin main
