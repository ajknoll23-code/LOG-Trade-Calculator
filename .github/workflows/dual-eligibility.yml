name: Dual Eligibility Check

# Manual-trigger-only. Go to Actions tab, select "Dual Eligibility Check"
# in the left sidebar, click "Run workflow".
#
# Output: scripts/dual_eligibility_results.json, committed back to the
# repo automatically. Lists every IDP player Sleeper's own data considers
# eligible at more than one position bucket (DL/LB/DB), and which of
# their eligible buckets carries the highest POSITION_WEIGHT in this
# league's rules.
#
# This does NOT change PLAYER_DB or index.html by itself -- it's a
# reference list to check PLAYER_DB's current tags against by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-dual-eligibility-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run dual eligibility pipeline
        run: python3 scripts/validation/dual_eligibility_pipeline.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/dual_eligibility_results.json
          git diff --staged --quiet || git commit -m "Update dual eligibility results"
          git push
