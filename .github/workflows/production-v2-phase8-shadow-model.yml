name: Production V2 Phase 8 Shadow Model

# Final pre-season architecture consolidation. Research only.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-v2-phase8-shadow-model
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test Phase 8 shadow model
        run: python3 research/production-v2/production_v2_phase8_shadow_model.py --selftest

      - name: Build consolidated shadow model
        run: python3 research/production-v2/production_v2_phase8_shadow_model.py --write

      - name: Verify semantic reproducibility
        run: python3 research/production-v2/production_v2_phase8_shadow_model.py --check

      - name: Print report
        run: cat research/production-v2/production_v2_phase8_shadow_model.md

      - name: Research-only mutation safety check
        shell: bash
        run: |
          allowed="$(printf '%s\n' \
            research/production-v2/production_v2_phase8_shadow_model.json \
            research/production-v2/production_v2_phase8_shadow_model.md)"

          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sed '/^$/d' | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sort -u))"

          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by Phase 8:"
            echo "$unexpected"
            exit 1
          fi

          git add \
            research/production-v2/production_v2_phase8_shadow_model.json \
            research/production-v2/production_v2_phase8_shadow_model.md

          git diff --cached --check

          staged="$(git diff --cached --name-only | sort -u)"
          unexpected_staged="$(comm -23 <(printf '%s\n' "$staged") <(printf '%s\n' "$allowed" | sort -u))"
          if [ -n "$unexpected_staged" ]; then
            echo "Unexpected files staged:"
            echo "$unexpected_staged"
            exit 1
          fi

      - name: Commit Phase 8 shadow model
        shell: bash
        run: |
          git config user.name "production-v2-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No shadow-output changes to commit."
          else
            git commit -m "Build Production V2 shadow model"
            git push origin main
          fi
