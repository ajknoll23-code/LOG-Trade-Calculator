# QF4 V1R1: Audit A4-F02 security-sensitive untrusted HTML output encoding.
# Review-only; manual dispatch, no deployment to main or Pages.
# Input: exact QF3 production index blob; FAIL CLOSED on any source drift.
# Escapes only HTML text/attribute sinks. Trusted markup/valuation frozen.
name: QF4 V1R1 - Safe Untrusted HTML Review Branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf4-review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_BRANCH: qf4-a4f02-v1r1-review-2026-10-10
      ORIGINAL_INDEX_BLOB: d831dd65efa1e68d2e69899a9736fce3a37c1db6
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact triggering main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression dependency
        run: python3 -m pip install requests
      - name: Fail-closed QF3 production source and review branch preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || { git status --short; exit 1; }
          [[ "$(git hash-object index.html)" == "${ORIGINAL_INDEX_BLOB}" ]] || { echo 'STOP source drift; QF3 production was changed'; exit 1; }
          if git ls-remote --exit-code --heads origin "${REVIEW_BRANCH}" >/dev/null; then
            echo 'STOP existing review branch; do not overwrite'; exit 1
          fi
          echo 'PASS pinned QF3 production baseline and unused review branch'
      - name: Apply exact sink-only encoding patches to index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          TARGET = Path('index.html')
          ORIGINAL_BLOB = 'd831dd65efa1e68d2e69899a9736fce3a37c1db6'
          raw = TARGET.read_bytes()
          def git_blob(b):
              return hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()
          assert git_blob(raw) == ORIGINAL_BLOB, f'FAIL CLOSED: production source drift: {git_blob(raw)}'
          original = raw.decode('utf-8')
          source = original
          edits = []
          def change(ticket, old, new, count=1):
              global source
              found = source.count(old)
              assert found == count, f'FAIL CLOSED {ticket}: expected {count} occurrences; found {found}'
              assert old != new
              source = source.replace(old, new)
              edits.append((ticket, old, new, count))

          # Sink-local HTML output encoding. Preserve trusted tags, styles, model formulas.
          change('A4-F02: escaped Sleeper sync error detail',
                 'failed (${err.message})',
                 "failed (${escapeHtml(String(err && err.message || 'unknown error'))})", 2)
          change('A4-F02: team-picker roster id attribute',
                 '<option value="${t.id}">${escapeHtml(t.name)}</option>',
                 '<option value="${escapeHtml(String(t.id))}">${escapeHtml(t.name)}</option>')
          change('A4-F02: player display names in roster and search surfaces',
                 '${titleCase(r.key)}', '${escapeHtml(titleCase(r.key))}', 3)
          change('A4-F02: player display names in leaders, strength and voting',
                 '${titleCase(p.key)}', '${escapeHtml(titleCase(p.key))}', 3)
          change('A4-F02: weakest-team best player display',
                 "titleCase(t.best.key) + ' (' + t.best.val.toLocaleString() + ')'",
                 "escapeHtml(titleCase(t.best.key)) + ' (' + t.best.val.toLocaleString() + ')'")
          change('A4-F02: buried-player role text',
                 "\u00b7 ${r.role} \u00b7 ${r.slot === 'taxi'", "\u00b7 ${escapeHtml(r.role)} \u00b7 ${r.slot === 'taxi'")
          change('A4-F02: roster strength header team name',
                 '${t.teamName}${isMe ?', '${escapeHtml(t.teamName)}${isMe ?')
          change('A4-F02: roster strength key attribute not inline JS interpolation',
                 '''onclick="toggleRosterStrengthTeam('${t.rosterId}')"''',
                 '''data-roster-id="${escapeHtml(String(t.rosterId))}" onclick="toggleRosterStrengthTeam(this.dataset.rosterId)"''')
          change('A4-F02: roster strength breakdown position',
                 '(${p.pos})</span></span>', '(${escapeHtml(p.pos)})</span></span>')
          change('A4-F02: roster strength pick source text',
                 '''${p.season} Round ${p.round} <span style="opacity:0.7;">${pickSlotLabel(p.season, p.slot)}</span>''',
                 '''${escapeHtml(p.season)} Round ${escapeHtml(p.round)} <span style="opacity:0.7;">${escapeHtml(pickSlotLabel(p.season, p.slot))}</span>''')
          change('A4-F02: status injury fallback text',
                 '''${sev.label}</span>`;''', '''${escapeHtml(sev.label)}</span>`;''')
          change('A4-F02: trade asset plain name label',
                 '''<div class="asset-title">${a.name}${confBadge}</div>''',
                 '''<div class="asset-title">${escapeHtml(a.name)}${confBadge}</div>''')
          change('A4-F02: trade asset untrusted meta position and role',
                 '''`${a.pos} \u00b7 Age ${displayPlayerAge(a.pos, a.age, a.name)} \u00b7 ${a.role}${tag}${inj}`''',
                 '''`${escapeHtml(a.pos)} \u00b7 Age ${displayPlayerAge(a.pos, a.age, a.name)} \u00b7 ${escapeHtml(a.role)}${tag}${inj}`''')
          change('A4-F02: roster tap keys use safe data-key not JS string literal',
                 '''onclick="addPlayerFromRoster('${r.key}')"''',
                 '''data-key="${escapeHtml(r.key)}" onclick="addPlayerFromRoster(this.dataset.key)"''', 2)
          change('A4-F02: roster player roles use HTML text encoding',
                 '${r.info.role}${injuryBadge', '${escapeHtml(r.info.role)}${injuryBadge', 2)
          change('A4-F02: roster player position meta text',
                 '${r.info.pos} \u00b7 Age ${displayPlayerAge',
                 '${escapeHtml(r.info.pos)} \u00b7 Age ${displayPlayerAge')
          change('A4-F02: full-roster player position meta text',
                 '''${r.info.pos}${r.info.team ? ' \u00b7 ' + escapeHtml(r.info.team)''',
                 '''${escapeHtml(r.info.pos)}${r.info.team ? ' \u00b7 ' + escapeHtml(r.info.team)''')
          change('A4-F02: KTC voting buttons use encoded dataset player key',
                 '''onclick="ktcAssignRole('${p.key}','${role}')"''',
                 '''data-player-key="${escapeHtml(p.key)}" onclick="ktcAssignRole(this.dataset.playerKey,'${role}')"''')
          change('A4-F02: KTC player-card position text',
                 '''${p.pos}${(typeof p.age === 'number') ? ' &middot; '+p.age+' y.o.' : ''}''',
                 '''${escapeHtml(p.pos)}${(typeof p.age === 'number') ? ' &middot; '+p.age+' y.o.' : ''}''')
          change('A4-F02: KTC/team label text safe across all vote cards',
                 'ktcTeamLabel(p.team)', 'escapeHtml(ktcTeamLabel(p.team))', 3)

          # Check unchanged canonical science and intentionally protected V8/V9 ballot protocols.
          assert len(edits) == 20, f'Expected 20 independent scoped edits, got {len(edits)}'
          assert source.count('/* QF3_A3_F01_DUPLICATE_PLAYER_GUARD_V1') == 1
          assert source.count('TEAM_IMPACT_UI_RETIRED_V1') == original.count('TEAM_IMPACT_UI_RETIRED_V1')
          assert source.count('const PACKAGE_ADJUSTMENT_PRODUCTION_V1') == original.count('const PACKAGE_ADJUSTMENT_PRODUCTION_V1') == 1
          assert source.count('const YEAR_DISCOUNT =') == original.count('const YEAR_DISCOUNT =') == 1
          assert source.count('function playerValue(') == original.count('function playerValue(') == 1
          assert 'QF4_A4_F02_SINK_ENCODING_V1' not in original
          source = source.replace('/* ---------- Rendering ---------- */',
           '''/* QF4_A4_F02_SINK_ENCODING_V1 — context-correct HTML text and attribute encoding.
              Never HTML-encode trusted layout markup or scientific/valuation inputs. */
          /* ---------- Rendering ---------- */''', 1)
          assert source != original
          # Every replacement must reverse cleanly with no collateral edits.
          reversed_source = source.replace('/* QF4_A4_F02_SINK_ENCODING_V1 — context-correct HTML text and attribute encoding.\n    Never HTML-encode trusted layout markup or scientific/valuation inputs. */\n','',1)
          for ticket, old, new, count in reversed(edits):
              assert reversed_source.count(new) == count, f'Cannot reverse exactly: {ticket}'
              reversed_source = reversed_source.replace(new, old)
          assert reversed_source == original, 'Unexpected unreviewed diff beyond explicit sink patches'
          TARGET.write_text(source, encoding='utf-8')
          print('QF4 A4-F02 PATCH PASS:', len(edits), 'scoped sink changes; index.html only')
          for ticket, old, new, count in edits: print(f'  {ticket}: {count} replacement(s)')
          PY
      - name: Run hostile input behavior fixtures and protected-source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          o=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          assert s != o
          assert s.count('QF4_A4_F02_SINK_ENCODING_V1') == 1
          assert s.count('QF3_A3_F01_DUPLICATE_PLAYER_GUARD_V1') == 1
          assert 'TEAM_IMPACT_UI_RETIRED_V1' in s
          assert 'data-key="${escapeHtml(r.key)}" onclick="addPlayerFromRoster(this.dataset.key)"' in s
          assert 'data-player-key="${escapeHtml(p.key)}" onclick="ktcAssignRole(this.dataset.playerKey,' in s
          assert 'data-roster-id="${escapeHtml(String(t.rosterId))}"' in s
          assert '<div class="asset-title">${escapeHtml(a.name)}${confBadge}</div>' in s
          assert '<div style="font-weight:600;font-size:14px;">${escapeHtml(t.teamName)}' in s
          assert '${escapeHtml(sev.label)}</span>`;' in s
          assert s.count('escapeHtml(ktcTeamLabel(p.team))') == 3
          assert 'function tradeAlreadyHasPlayer(' in s
          assert 'function pickValue(round, slot, year)' in s
          for key in ('PICK_BASE','YEAR_DISCOUNT','POSITION_WEIGHT','AGE_CURVE','ROLE_MULT','PROD_MULT_DATA','PLAYER_DB','RB_BIRTH_DATE_DATA'):
              pattern=rf'const {key}\s*=\s*\{{[\s\S]*?\}};'
              a=re.search(pattern,o)
              b=re.search(pattern,s)
              assert a and b and a.group()==b.group(),f'Frozen {key} differs'
          # Shared FA valuation core must remain byte-identical to reviewed QF3.
          from sys import path as sys_path
          sys_path.insert(0,'scripts')
          from sync import sync_free_agent_valuation as sync
          assert sync._extract_core(o)[2] == sync._extract_core(s)[2], 'Changed canonical valuation core'
          assert sync._extract_const_object(o,'PLAYER_DB')[2] == sync._extract_const_object(s,'PLAYER_DB')[2]
          assert sync._extract_const_object(o,'RB_BIRTH_DATE_DATA')[2] == sync._extract_const_object(s,'RB_BIRTH_DATE_DATA')[2]
          assert sync._extract_alias_region(o)[2] == sync._extract_alias_region(s)[2]
          assert sync._extract_function(o,'normalizeName')[2] == sync._extract_function(s,'normalizeName')[2]

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          assert scripts
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf8') as f:
              f.write('\n'.join(scripts)); fulljs=f.name
          try: subprocess.run(['node','--check',fulljs],check=True)
          finally: Path(fulljs).unlink(missing_ok=True)

          def func(name):
              # These helpers use one-line opening braces; close at line boundary.
              match=re.search(r'function '+re.escape(name)+r'\([^\n]*\)\{[\s\S]*?\n\}',s)
              assert match, name
              return match.group()

          js=r'''
          const assert = require('node:assert/strict');
          let state={A:[],B:[],myTeamSide:'A',teamConfirmed:true,rosterStrengthExpanded:null,targetScanRun:true,targetFilter:'DL'};
          let MY_ROSTER_ID='42';
          let PLAYER_DB={};let MY_ROSTER=[];let LEAGUE_ROSTERS={};
          const elements={};
          const document={getElementById(id){if(!elements[id])elements[id]={innerHTML:'',style:{display:'none'}};return elements[id];}};
          let warn='<img src=x onerror="globalThis.__xss=1">';
          let attack='Moe & <svg onload="globalThis.__xss=1"> " \' \u0026lt;';
          let attr='55\' onmouseover=\'globalThis.__xss=1';
          let uid=()=> 'safe123';
          const PICK_BASE={},YEAR_DISCOUNT={};
          const PROD_MULT={hasOwnProperty:()=>false};
          const packageUiHeadshotHTML=()=>'';
          const valueUncertaintyRangeHTML=()=>'';
          const marketValueHTML=()=>'';
          const getConfidence=()=>({tier:'Low',factors:['fixture']});
          const displayPlayerAge=(pos,age)=>String(age);
          const dataQualityFlag=()=>'';
          const playerValueByKey=()=>1200;
          const ktcTeamLabel=(x)=>String(x);
          const pickSlotLabel=(season,slot)=>slot;
          let findBuriedTalent=()=>[{key:attack,team:attack,pos:'DL',age:27,role:attack,slot:'bench',val:1200}];
          let findWeakestTeams=()=>[{team:attack,qualityCount:1,top3:100,best:{key:attack,val:1200}}];
          let computeRosterStrength=()=>[{rosterId:attr,teamName:attack,total:1200,players:[{key:attack,pos:attack,val:1200}],picks:[{season:2027,round:2,slot:attack,value:300}],picksTotal:300}];
          const SLOT_ORDER=['bench'],SLOT_LABELS={bench:'Bench'};
          const tu=()=>{};
          '''
          js+='\n'.join(func(n) for n in ['escapeHtml','titleCase','injuryBadge','assetRowHTML','renderNeedsPosList','renderFindTargets','renderRosterStrength','populateTeamPicker','packageVoteAssetCard','packageV9AssetCard','renderFullRoster'])
          js+=r'''
          let outputs={};
          outputs.asset=assetRowHTML('A',{type:'player',name:attack,pos:attack,role:attack,age:24,value:1200,id:'safe123',dataDriven:false,injury:warn});
          state.rosterStrengthExpanded=attr;
          LEAGUE_ROSTERS={[attr]:{team_name:attack,players:[]}}; // fixture prerequisite: roster panel only renders after league sync
          renderRosterStrength();outputs.strength=elements.rosterStrengthWrap.innerHTML;
          MY_ROSTER=[attack];PLAYER_DB[attack]={pos:'DL',age:22,role:attack,injury:warn,team:attack};
          outputs.needs=renderNeedsPosList('DL');
          LEAGUE_ROSTERS={'x':{team_name:attack,players:[]}};
          renderFindTargets();outputs.targets=elements.findTargetsWrap.innerHTML;
          LEAGUE_ROSTERS={[attr]:{team_name:attack,players:[{key:attack,slot:'bench'}]}};
          populateTeamPicker();outputs.picker=elements.teamPicker.innerHTML;
          MY_ROSTER_ID=attr;
          renderFullRoster();outputs.roster=elements.fullRosterWrap.innerHTML;
          outputs.injury=injuryBadge(warn);
          outputs.vote=packageVoteAssetCard({name:attack,pos:attack,team:attack});
          outputs.v9=packageV9AssetCard({name:attack,pos:attack,team:attack});
          // Actual escaping helper must be idempotent only when handling pre-escaped markup is intended:
          // raw user text uses one escape, preserving visible ampersands and angle brackets.
          assert.equal(escapeHtml('<>&\"\''),'&lt;&gt;&amp;&quot;&#39;');
          assert.equal(escapeHtml(attack).includes('<svg'),false);
          console.log(JSON.stringify({attack,attr,warn,outputs}));
          '''
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); harness=f.name
          try:
              result=subprocess.run(['node',harness],capture_output=True,text=True)
              assert result.returncode==0, f'Node hostile-output fixtures failed: {result.stderr[:2000]}'
              out=json.loads(result.stdout)
          finally: Path(harness).unlink(missing_ok=True)
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True);self.tags=[];self.attrs=[];self.text=[]
              def handle_starttag(self,tag,attrs):
                  self.tags.append(tag);self.attrs.extend([(tag,k,v) for k,v in attrs])
              def handle_data(self,data): self.text.append(data)
          for label,output in out['outputs'].items():
              p=Check();p.feed(output)
              assert 'svg' not in p.tags and 'script' not in p.tags, f'Injected active tag in {label}'
              assert not any(k in ('onmouseover','onerror','onload','onfocus','srcdoc') for _,k,_ in p.attrs),f'Injected handler in {label}'
              assert not any(t=='img' for t in p.tags), f'Injected image in {label}'
              if label in ('asset','strength','needs','targets','picker','roster','vote','v9'):
                  assert ('<svg' in ''.join(p.text) or '<img' in ''.join(p.text) or '\'' in ''.join(p.text)), f'User content lost in {label}'
              if label in ('strength','needs','roster'):
                  assert any(k in ('data-key','data-roster-id') for _,k,_ in p.attrs),f'Data attribute missing in {label}'
          assert 'data-key="' in out['outputs']['roster']
          assert 'this.dataset.key' in out['outputs']['roster']
          assert 'this.dataset.rosterId' in out['outputs']['strength']
          print('PASS QF4: hostile input output encoding, full JS syntax, safe data attributes and preserved FA core')
          PY
      - name: Run full repository IDP FA and package regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as v
          result=v.validate_deployment()
          assert result['actual_changed_entry_count']==320, 'IDP release drift'
          print('PASS frozen IDP approved 320 change count')
          PY
      - name: Publish isolated review branch ONLY after green gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only)" == 'index.html' ]] || { git status --short; exit 1; }
          git diff --check
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo 'STOP main advanced during test'; exit 1; }
          if git ls-remote --exit-code --heads origin "${REVIEW_BRANCH}" >/dev/null; then
            echo 'STOP review branch appeared during test'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${REVIEW_BRANCH}"
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || exit 1
          git diff --cached --check
          git commit -m 'QF4 A4-F02: encode untrusted UI text and safe roster/vote handlers'
          git push --force-with-lease="refs/heads/${REVIEW_BRANCH}:" origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          echo "QF4 V1R1 REVIEW GREEN: ${REVIEW_BRANCH} commit=$(git rev-parse HEAD) index_blob=$(git hash-object index.html)"
          echo 'Production main/Pages unchanged; separate owner-controlled preflight and promotion required.'
