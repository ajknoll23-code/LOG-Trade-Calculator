      - name: Validate frozen bridge result and licensing firewall
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import statistics
          from pathlib import Path

          root = Path("research/schedule-utility-v1")
          p = root / "schedule_utility_v1_phase1e_b_private_bridge.json"
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["study_id"] == "schedule-utility-v1"
          assert d["phase"] == "1E-B"
          assert d["status"] == "PASS_PRIVATE_SOURCE_BRIDGE"
          assert d["metric_id"] == "LOG-SAPA-V1"
          assert d["frozen_log_sapa_sha256"] == (
              "9ab4ec5b21ef9ef57e476e861a7293dbc886b9bc9d7cc5f0bd5cc982cc729ee6"
          )
          assert d["phase1e_a_freeze_commit"] == (
              "b484f096516f858772953c438f084e0a69b250c0"
          )
          assert d["phase1e_a_public_predictor_git_blob_sha1"] == (
              "cf1ed116aebb6803747898e7b1cfd76c5b70e451"
          )

          recompute_sha = hashlib.sha256(
              (root / "schedule_utility_v1_phase1e_b_private_bridge_recompute.py")
              .read_bytes()
          ).hexdigest()
          assert d["private_bridge_method"]["recompute_script_sha256"] == recompute_sha
          assert recompute_sha == "0aea755513a2d43b3979baf71f38e99a03d0a7ec0f0c04c67dba03f7e6830f8f"

          assert d["private_bridge_method"]["provider_source_hashes_verified"] is True
          assert d["private_bridge_method"]["provider_rows_committed"] is False
          assert d["private_bridge_method"]["provider_team_values_committed"] is False
          assert d["private_bridge_method"]["secondary_diagnostics_are_gate_inputs"] is False

          expected_hashes = {'afpa_half': '57c1a228ae849496092ac8404be33072d974a6eb0c251646e58b579b0892b430', 'qb_half': 'd054b074162cfe748e22c4ce00dd3bf07aee97f3eaf04cd4c737be46c5d18b47', 'rb_half': '1f54c87762ddfff9a47e7219c1e6ea48f4905507f37e119dfaf55c3b49b22f75', 'wr_half': 'c3ae5f0af52beaa3a258785b4dbbf63ca21dcf73847a067f1daa9391db9279e4', 'te_half': 'cfae6b10a1eb6dc428004c2a599f85f4d5ab86499d3585e40e260adc03ddd325', 'rb_ppr': 'cda98824bc3a1f79ccc016a93e31da80c6c477eac1e5281536acc005979856b3', 'wr_ppr': 'ef323c774adcc680944ee2db8414f598eb96b714d09ec44263ba3a49309c8d4d', 'te_ppr': 'cdab088a1a128305acfd7820edf2c19241135a24be1a0f852dd9b8a7cdc1894f'}
          assert d["private_source_hashes"] == expected_hashes

          gate = d["frozen_gate"]
          assert gate == {
              "median_spearman_at_least": 0.6,
              "cells_at_or_above_0_50_at_least": 6,
              "no_cell_below": 0.3,
          }

          expected_cells = [
              "QB_HALF", "RB_HALF", "WR_HALF", "TE_HALF",
              "RB_PPR", "WR_PPR", "TE_PPR",
          ]
          assert set(d["cell_results"]) == set(expected_cells)

          rhos = []
          for cell in expected_cells:
              payload = d["cell_results"][cell]
              assert set(payload) == {
                  "spearman",
                  "coverage",
                  "mean_abs_rank_difference",
                  "max_abs_rank_difference",
                  "easiest_quartile_overlap_of_8",
                  "hardest_quartile_overlap_of_8",
              }
              assert payload["coverage"] == 32
              assert 0 <= payload["easiest_quartile_overlap_of_8"] <= 8
              assert 0 <= payload["hardest_quartile_overlap_of_8"] <= 8
              rhos.append(float(payload["spearman"]))

          median = statistics.median(rhos)
          count50 = sum(r >= 0.50 for r in rhos)
          minimum = min(rhos)

          assert abs(median - d["summary"]["median_spearman"]) < 1e-12
          assert count50 == d["summary"]["cells_at_or_above_0_50"]
          assert abs(minimum - d["summary"]["minimum_cell_spearman"]) < 1e-12
          assert d["summary"]["all_7_cells_coverage_32"] is True
          assert d["summary"]["pass"] is True

          assert median >= gate["median_spearman_at_least"]
          assert count50 >= gate["cells_at_or_above_0_50_at_least"]
          assert minimum >= gate["no_cell_below"]

          firewall = d["outcome_firewall"]
          assert firewall["historical_eval_stat_rows_2015_2025_read"] is False
          assert firewall["historical_target_outcomes_2015_2025_opened"] is False
          assert firewall["phase2_outcome_test_authorized"] is False
          assert firewall["phase2_preregistration_authorized"] is True
          assert d["production_change_authorized"] is False
          assert d["next_phase"]["phase"] == "2A"
          assert d["next_phase"]["outcomes_may_be_opened_before_phase2a_freeze"] is False

          # Freeze artifact must not contain provider team-level values.
          nfl_teams = {
              "ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE",
              "DAL","DEN","DET","GB","HOU","IND","JAX","KC",
              "LAC","LAR","LV","MIA","MIN","NE","NO","NYG",
              "NYJ","PHI","PIT","SEA","SF","TB","TEN","WAS",
          }

          def walk_keys(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield str(key)
                      yield from walk_keys(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk_keys(child)

          assert not (set(walk_keys(d)) & nfl_teams)

          print(
              "PASS: private bridge aggregate freeze validated; "
              "provider row-level values absent; outcomes remain sealed."
          )
          PY

      - name: Prove zero production mutation
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"

          git diff --check

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"
          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "PASS: zero production mutation."

