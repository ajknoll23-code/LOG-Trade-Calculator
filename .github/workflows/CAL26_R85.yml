# CAL26 R85: deterministic pooled league lineup marginal utility. NO production writes.
# Does not require R84, so R84 may finish independently.
name: CAL26 V1R85 - Joint FLEX Superflex IDP Lineup Marginal Utility (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r85-pooled-lineup-utility-readonly
  cancel-in-progress: false
jobs:
  pooled-lineup-economics-no-fv-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned live FV and 2026 league scoring read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen green R74 H0 and H1 evidence
        uses: actions/download-artifact@v4
        with:
          name: CAL26_R74_CHRONOLOGICAL_NEXT_SEASON_SURPLUS_FV_HOLD
          run-id: 40106627943
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-r85-in/R74
      - name: Download frozen green R82 multi-year source
        uses: actions/download-artifact@v4
        with:
          name: CAL26_R82_2026_2027_SURPLUS_UTILITY_SCALE_UNIDENTIFIED_FV_HOLD
          run-id: 40136427921
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-r85-in/R82
      - name: Exact joint lineup optimization, Hungarian optimality check and read-only research report
        shell: bash
        run: |
          set -euo pipefail
          # Pin production JS and authoritative 2026 Sleeper scoring/roster positions.
          test "$(git hash-object index.html)" = "5630bb681dd8710f8e45bc5363488f358ce9ebe2"
          test "$(git hash-object research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json)" = "8e350fc927417d2f8afceb5b42545e48e3622fff"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/cal26-r85-out"
          cat > "$RUNNER_TEMP/CAL26_R85_engine.py" <<'PY_R85_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R85: seven-position joint-slot opportunity-cost shadow, not FV.
          No calibration, no league win-probability claims, no 2026 post-Week6 outcomes.
          K excluded because no verified K projection cohort exists. Primary position only.
          """
          import argparse, collections, csv, hashlib, json, math, pathlib, random
          P=pathlib.Path
          POS=('QB','RB','WR','TE','DL','LB','DB')
          FOCUS=('drake maye','malik nabers','bryce young','cj stroud','puka nacua')
          PIN={
           'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv':'2e3e3bcd005fcaa1480b2200893c5b4c3548a1b3be2dd0ce8fdb8af9d0d8b50b',
           'CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv':'147a4fb61409540ba75b9238766f4d5e2fa920a8356b51434fc456f6ae8c4f47',
           'CAL26_R82_7_POSITION_CHRONOLOGY_AND_SCALE_GATES.csv':'5913d667e9798c0ac72b8dfab875520169296e5e0134d3009059f83da39a6ffa',
          }
          SLOT_EXPECT={'QB':1,'RB':2,'WR':2,'TE':1,'FLEX':1,'SUPER_FLEX':1,'K':1,'DL':2,'LB':2,'DB':2,'IDP_FLEX':2}
          BASE_SLOTS={'QB':12,'RB':24,'WR':24,'TE':12,'DL':24,'LB':24,'DB':24}
          FLEX_RULES={'FLEX':(('RB','WR','TE'),12),'SUPER_FLEX':(('QB','RB','WR','TE'),12),'IDP_FLEX':(('DL','LB','DB'),24)}
          SLOT_ALLOWED={**{k:(k,) for k in BASE_SLOTS},**{k:v[0] for k,v in FLEX_RULES.items()}}

          def ok(v,code):
           if not v: raise AssertionError(code)
          def sha(f):return hashlib.sha256(P(f).read_bytes()).hexdigest()
          def readrows(f):
           with P(f).open(newline='',encoding='utf-8') as h:return list(csv.DictReader(h))
          def wr(f,data):
           ok(data,'EMPTY_OUTPUT_'+str(f))
           with P(f).open('w',newline='',encoding='utf-8') as h:
            w=csv.DictWriter(h,fieldnames=list(data[0]),lineterminator='\n');w.writeheader();w.writerows(data)
          def fnum(s,tag):
           try:x=float(s)
           except (ValueError,TypeError):raise AssertionError('INVALID_FLOAT_'+tag)
           ok(math.isfinite(x),'NONFINITE_'+tag)
           return x

          def get_eligible(players):
           return {k:v for k,v in players.items() if v['eligible']}

          def solve_greedy(players,field,exclude=None):
           """Optimal maximum-expected-points assignment under position-bucket eligibility.
           Dedicated quotas taken first via exchange principle; FLEX then SUPER_FLEX;
           IDP_FLEX independent. Superflex can use leftover nonQB, and selecting
           top eligible nonQBs for FLEX cannot lower the optimal total.
           """
           selected={};unused={k:v for k,v in players.items() if k!=exclude}
           def take(slot,positions,n):
            arr=sorted(((k,v) for k,v in unused.items() if v['position'] in positions),key=lambda z:(-z[1][field],z[0]))
            ok(len(arr)>=n,'INSUFFICIENT_ELIGIBLE_'+slot)
            for key,row in arr[:n]:
             ok(key not in selected,'DOUBLE_SELECTED')
             selected[key]=slot;unused.pop(key)
           for slot,n in BASE_SLOTS.items():take(slot,(slot,),n)
           for slot,(positions,n) in FLEX_RULES.items():take(slot,positions,n)
           ok(len(selected)==192,'WRONG_MODELED_SLOT_COUNT')
           objective=sum(players[k][field] for k in selected)
           return objective,selected

          def solve_hungarian(players,field):
           """Independent rectangular Hungarian optimal assignment, not used for valuation.
           Exact maximum under the same position bucket constraints, 192 slots.
           """
           ids=sorted(players)
           nslots=[]
           for s,n in BASE_SLOTS.items():nslots.extend([s]*n)
           for s,(_,n) in FLEX_RULES.items():nslots.extend([s]*n)
           n=len(nslots);m=len(ids)
           ok(m>=n,'HUNGARIAN_PLAYER_SHORTFALL')
           # Rectangular min-cost assignment, positive costs avoid issues with floating potentials.
           weights=[float(players[k][field]) for k in ids]
           maxw=max(weights);forbidden=maxw+1e6
           cost=[[maxw-weights[j] if players[ids[j]]['position'] in SLOT_ALLOWED[s] else forbidden for j in range(m)] for s in nslots]
           u=[0.0]*(n+1);v=[0.0]*(m+1);p=[0]*(m+1);way=[0]*(m+1)
           for i in range(1,n+1):
            p[0]=i;j0=0;mins=[float('inf')]*(m+1);used=[False]*(m+1)
            while True:
             used[j0]=True;i0=p[j0];delta=float('inf');j1=0
             cc=cost[i0-1]
             for j in range(1,m+1):
              if not used[j]:
               val=cc[j-1]-u[i0]-v[j]
               if val < mins[j]:mins[j]=val;way[j]=j0
               if mins[j] < delta-1e-9 or (abs(mins[j]-delta)<=1e-9 and (j1==0 or j<j1)):
                delta=mins[j];j1=j
             for j in range(m+1):
              if used[j]:u[p[j]]+=delta;v[j]-=delta
              else:mins[j]-=delta
             j0=j1
             if p[j0]==0:break
            while True:
             j1=way[j0];p[j0]=p[j1];j0=j1
             if j0==0:break
           selected={}
           for j in range(1,m+1):
            if p[j]:
             s=nslots[p[j]-1];k=ids[j-1];ok(players[k]['position'] in SLOT_ALLOWED[s],'HUNGARIAN_ILLEGAL_ASSIGNMENT')
             selected[k]=s
           ok(len(selected)==n,'HUNGARIAN_NOT_FULL')
           return sum(players[k][field] for k in selected)

          def marginal(players,field):
           total,selected=solve_greedy(players,field)
           deltas={k:0.0 for k in players}
           for k in selected:
            reduced,_=solve_greedy(players,field,exclude=k)
            val=total-reduced
            ok(val >= -1e-6,'NEGATIVE_VALUE_OF_ADDITIONAL_PLAYER')
            deltas[k]=max(0.0,val)
           return total,selected,deltas

          def selftest():
           # A trivial exact counterfactual: QB dedicated 1, RB dedicated 1 and SF 1
           # is tested by full size base in main; small toy tests ensure deterministic, nonnegative values.
           ok(SLOT_ALLOWED['SUPER_FLEX']==('QB','RB','WR','TE'),'SUPERFLEX_ELIGIBILITY')
           ok(SLOT_ALLOWED['IDP_FLEX']==('DL','LB','DB'),'IDP_FLEX_ELIGIBILITY')
           ok(sum(BASE_SLOTS.values())+sum(v[1] for v in FLEX_RULES.values())==192,'SLOTS_TOTAL')
           print('R85_SELFTEST_GREEN league-wide quota arithmetic and slot eligibility')

          def run(a):
           root74=P(a.r74);root82=P(a.r82);out=P(a.out);out.mkdir(parents=True,exist_ok=True)
           sources={
             'r74':root74/'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv',
             'r82':root82/'CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv',
             'gates':root82/'CAL26_R82_7_POSITION_CHRONOLOGY_AND_SCALE_GATES.csv',
           }
           for p in sources.values():ok(p.is_file() and sha(p)==PIN[p.name],'FROZEN_INPUT_DRIFT_'+p.name)
           snap=json.loads(P(a.snapshot).read_text())
           ok(str(snap['league_id'])=='1326679131051532288' and str(snap['season'])=='2026','LEAGUE_ID_OR_YEAR_DRIFT')
           slots=collections.Counter(q for q in snap['roster_positions'] if q!='BN')
           ok(dict(slots)==SLOT_EXPECT and len(snap['roster_positions'])==37,'LEAGUE_SLOT_DRIFT')
           scores=snap['scoring_settings']
           ok(scores['rec']==0.5 and scores['rush_att']==.2 and scores['idp_tkl_solo']==1.5 and scores['idp_blk_kick']==6.0,'SCORING_DRIFT')
           rs74=readrows(sources['r74']);rs82=readrows(sources['r82']);rr=readrows(sources['gates'])
           ok(len(rs74)==len(rs82)==518 and len(rr)==7,'INPUT_COUNT_DRIFT')
           def bykey(rows):
            q={}
            for r in rows:
             key=(r['name'],r['position']);ok(key not in q,'DUPLICATE_KEY');q[key]=r
            return q
           h74=bykey(rs74);h82=bykey(rs82);ok(set(h74)==set(h82),'NAME_POSITION_JOIN_DRIFT')
           references={r['position']:fnum(r['2026_replacement_reference_points_ASSUMPTION'],r['position']) for r in rr}
           ok(set(references)==set(POS),'MISSING_POSITION_REFERENCE')
           allplayers={}
           for key,x in h74.items():
            r=h82[key];p=x['position'];gp=int(x['games_played_through_2026_week6']);eligible=(gp>=4)
            ok(gp==int(r['2026_week1_6_GP']),'GP_DRIFT_'+str(key))
            h0=fnum(x['2026_fullseason_LOG_points_RESEARCH'],'H0_'+str(key)) if x['2026_fullseason_LOG_points_RESEARCH'] else None
            y0=fnum(r['2026_H0_surplus_points_RESEARCH'],'H0_SURPLUS') if r['2026_H0_surplus_points_RESEARCH'] else None
            if eligible:ok(h0 is not None and y0 is not None,'ELIGIBLE_MISSING_H0_'+str(key))
            if h0 is not None and y0 is not None:ok(abs(h0-references[p]-y0)<=0.003,'H0_REFERENCE_NOT_COHERENT_'+str(key))
            y1=float(r['2027_H1_surplus_points_RESEARCH']) if r['2027_H1_surplus_points_RESEARCH'] else None
            if eligible:ok(y1 is not None and math.isfinite(y1) and y1>=0,'H1_ELIGIBLE_EMPTY_'+str(key))
            ok(eligible ==(r['reliability_gate']=='SCENARIO_ONLY_GP4PLUS_NOT_PRICE'),'R82_ELIGIBILITY_DRIFT')
            val=fnum(x['live_JS_FV_UNCHANGED'],'LIVE_REFERENCE')
            ok(val == fnum(r['live_FV_REFERENCE_ONLY'],'LIVE_REF_JOIN'), 'FV_REF_DRIFT')
            allplayers[key]={
              'name':x['name'],'position':p,'gp':gp,'age':r['age'],'role':r['role'],
              'eligible':eligible,'h0':h0,'h1_synth':(references[p]+y1 if y1 is not None else None),
              'h0_surplus':y0,'h1_surplus':y1,'fv':int(val),'owner_anchor':r['owner_price_anchor_protected']=='True'}
           eligible=get_eligible(allplayers)
           ok(len(eligible)==389,'ELIGIBLE_COHORT_NOT_FROZEN_389')
           bypos=collections.Counter(row['position'] for row in eligible.values())
           for p,need in BASE_SLOTS.items():ok(bypos[p]>=need+1,'REPLACEMENT_COHORT_TOO_SHALLOW_'+p)
           # Independent Hungarian dual verification of full joint assignment for both horizons.
           # 2027 forecast is only a synthetic point-translation scenario, NOT an independent raw 2027 scoring projection.
           full0,selected0,deltas0=marginal(eligible,'h0')
           full1,selected1,deltas1=marginal(eligible,'h1_synth')
           opt0=solve_hungarian(eligible,'h0');opt1=solve_hungarian(eligible,'h1_synth')
           ok(abs(full0-opt0)<=1e-5,'H0_NOT_GLOBAL_OPTIMUM')
           ok(abs(full1-opt1)<=1e-5,'H1_SCENARIO_NOT_GLOBAL_OPTIMUM')
           ok(all(abs(d)<=1e-8 for k,d in deltas0.items() if k not in selected0),'H0_BENCH_IMPACT')
           ok(all(abs(d)<=1e-8 for k,d in deltas1.items() if k not in selected1),'H1_BENCH_IMPACT')
           # The profile is a pooled ideal 12-team selection, not actual competing team rosters.
           srows=[]
           for s in [*BASE_SLOTS,*FLEX_RULES]:
            n=BASE_SLOTS.get(s,FLEX_RULES.get(s,((),0))[1]);parts=SLOT_ALLOWED[s]
            srows.append({'slot':s,'league_slots':n,'eligible_primary_position_buckets':','.join(parts),
              'selected_2026_count':sum(v==s for v in selected0.values()),
              'selected_2027_reconstructed_scenario_count':sum(v==s for v in selected1.values()),
              '2026_selected_total_points':round(sum(eligible[k]['h0'] for k,v in selected0.items() if v==s),3),
              '2027_scenario_selected_total_points':round(sum(eligible[k]['h1_synth'] for k,v in selected1.items() if v==s),3),
              'model_limit':'Primary position only; K excluded (12 fixed slots), no individual team ownership constraints'})
           pr=[]
           for key,row in sorted(allplayers.items()):
            d0=deltas0.get(key);d1=deltas1.get(key)
            pr.append({'name':row['name'],'position':row['position'],'age':row['age'],'role':row['role'],'GP_through_2026_Week6':row['gp'],
              'H0_2026_fullseason_scenario_points':round(row['h0'],3) if row['h0'] is not None else '','H1_2027_surplus_historical_projection_points':round(row['h1_surplus'],3) if row['h1_surplus'] is not None else '',
              'H1_2027_reconstructed_total_points_UNVALIDATED':round(row['h1_synth'],3) if row['h1_synth'] is not None else '',
              'H0_GP4plus_eligible':row['eligible'],'H0_optimized_slot':selected0.get(key,''),'H0_lineup_removal_loss_points_NOT_FV':round(d0,3) if d0 is not None else '',
              'H1_experimental_slot':selected1.get(key,''),'H1_synthetic_lineup_removal_loss_NOT_FV':round(d1,3) if d1 is not None else '',
              'H0_plus_0p60_H1_marginal_sensitivity_NOT_FV':round(d0+.6*d1,3) if d0 is not None else '',
              'H0_plus_0p75_H1_marginal_sensitivity_NOT_FV':round(d0+.75*d1,3) if d0 is not None else '',
              'H0_plus_0p90_H1_marginal_sensitivity_NOT_FV':round(d0+.9*d1,3) if d0 is not None else '',
              'live_JS_FV_REFERENCE_ONLY':row['fv'],'owner_anchor_protected':row['owner_anchor'],
              'FV_per_points_identified':False,'independent_cross_position_trading_value_identified':False,
              'current_league_manager_rosters_optimized':False,'dual_eligibility_included':False,
              'new_FV':'','production_writes_authorized':False})
           focuses=[r for r in pr if r['name'] in FOCUS];ok(len(focuses)==5,'MISSING_FOCUS')
           # Detect unexpectedly extreme concentration of replacement loss; never force a price.
           summary=[
           '# CAL26 V1R85 — frozen 2026 league-wide pooled slot optimizer (RESEARCH ONLY)','',
           '**Decision: NOT FV. No price recommendation and no live changes.**','',
           '- Frozen league: 12 teams; 17 slots/team (16 non-K modeled), with both offensive FLEX and SUPER_FLEX and two IDP_FLEX slots/team. K is reserved but excluded from the optimization because this frozen cohort contains no K forecasts.',
           '- Frozen 518 seven-position player universe; 389 GP>=4 players eligible in this **selected healthy/currently observed** test; the other 129 are held out, NOT valued at zero for dynasty.',
           '- Objective: maximize sum of projected full-season player fantasy points across 192 pooled league starting slots, with exactly one slot per player, all required dedicated slots, and coupled FLEX, SUPER_FLEX, and IDP_FLEX eligibility.',
           '- Objective cross-check: independent rectangular Hungarian assignment matched the specialized deterministic quota optimizer in both horizons.',
           '- Player opportunity cost = pooled optimal total MINUS optimal total after removing that player; unit is 2026 league fantasy points, not FV or market trade value.',
           '- 2027 projected point totals are **constructed** from 2027 R74 historical surrogate surplus + 2026 R82 assumed position-specific replacement anchor; the cross-position resulting opportunity costs are exploratory scenarios and NOT 2027 calibrated estimates.',
           '- This is a single pooled ideal league roster, NOT optimization of the actual 12 separate team rosters. All players have ONLY their primary position bucket; verified fantasy multi-eligibility has not been imported. K is excluded. Dynasty stash/bench and injured player option value are NOT measured.',
           '- Forecast H0 inputs already contain minutes/games/role effects: DO NOT multiply by a second starter or games factor.',
           '- 2027 discount coefficients (0.6/0.75/0.9) are sensitivity choices; not validated rates. Historical RMSE/forecast censoring still applies; 2028 remains excluded.',
           '- Maye 5,500 remains provisional owner pricing decision, explicitly **not** an input. Nabers HOLD; both production values unchanged.',
           '',
           f'**Full 2026 modeled lineup objective:** {full0:.3f} season fantasy points (Hungarian independently: {opt0:.3f})',
           f'**Synthetic 2027 lineup objective:** {full1:.3f} conditional points (Hungarian independently: {opt1:.3f})','',
           '## Five owner focus players (lineup removal cost, not FV)','',
           '| Player | Current FV reference | 2026 optimized slot | 2026 removal-loss points | 2027 synthetic removal-loss points | 2026 + 0.75×2027 scenario |',
           '|---|---:|---|---:|---:|---:|']
           for r in focuses:
            summary.append('| '+r['name']+' | '+str(r['live_JS_FV_REFERENCE_ONLY'])+' | '+(r['H0_optimized_slot'] or 'Bench')+' | '+str(r['H0_lineup_removal_loss_points_NOT_FV'])+' | '+str(r['H1_synthetic_lineup_removal_loss_NOT_FV'])+' | '+str(r['H0_plus_0p75_H1_marginal_sensitivity_NOT_FV'])+' |')
           summary+=['','## Narrow interpretation','',
           '- This repairs **structural FLEX coupling** that was missing from R82, but results are still contingent on a truncated GP>=4 cohort and assumed 2026 full-season total forecasts.',
           '- A player with zero pooled marginal starting-lineup value can still have substantial dynasty option value. This ranking is not sufficient for age, risk, future production, pick or IDP values.',
           '- The model cannot identify the cardinal scale c for FV. Do not multiply marginal season points by an arbitrary ratio or fit against existing FV or a DLF trade quote.',
           '- Next decision: validate exact individual team/dual eligibility and publish a labeled research-only utility overlay or agree an openly declared FV display convention separately. No 2026 week7+ outcomes or 2028 forecast are read.']
           outs={'CAL26_R85_518_PLAYER_POOLED_LINEUP_MARGINAL_UTILITY_NOT_FV.csv':pr,
                 'CAL26_R85_10_STARTER_SLOT_ASSIGNMENT_AUDIT.csv':srows,
                 'CAL26_R85_5_FOCUS_TWO_YEAR_LINEUP_UTILITY_NOT_FV.csv':focuses}
           for fn,rows in outs.items():wr(out/fn,rows)
           (out/'CAL26_R85_decision.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
           manifest={'model':'CAL26_V1R85_JOINT_LINEUP_REPLACEMENT','decision':'RESEARCH_ONLY_NO_FV_SCALE_OR_DEPLOY',
            'league_id':snap['league_id'],'frozen_season':2026,'source_sha256':{p.name:sha(p) for p in sources.values()},
            'players':len(allplayers),'eligible':len(eligible),'excluded_lowGP':len(allplayers)-len(eligible),
            'modeled_nonK_slots':192,'unmodeled_fixed_K_slots':12,
            'H0_2026_optimal_total':round(full0,5),'H0_hungarian_independent':round(opt0,5),
            'H1_synthetic_optimal_total':round(full1,5),'H1_hungarian_independent':round(opt1,5),
            'multi_position_player_eligibility_verified':False,'team_by_team_lineups_optimized':False,
            '2027_raw_forecast_independently_frozen':False,'H1_is_synthetic_reconstruction':True,
            'FV_scale_identified':False,'2028_included':False,'owner_maye_target_used':False,'production_write_count':0,
            'files_sha256':{fn:sha(out/fn) for fn in [*outs,'CAL26_R85_decision.md']}}
           (out/'CAL26_R85_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
           ok(len(pr)==518 and len(srows)==10 and len(focuses)==5,'REPORT_COUNT_DRIFT')
           print('R85_JOINT_SLOT_FV_HOLD_GREEN',json.dumps({k:v for k,v in manifest.items() if k not in ('files_sha256','source_sha256')}))

          def main():
           parser=argparse.ArgumentParser();parser.add_argument('--selftest',action='store_true');parser.add_argument('--r74');parser.add_argument('--r82');parser.add_argument('--snapshot');parser.add_argument('--out');a=parser.parse_args()
           if a.selftest:selftest();return
           ok(all((a.r74,a.r82,a.snapshot,a.out)),'MISSING_ARGS');run(a)
          if __name__=='__main__':main()
          PY_R85_ENGINE
          python -m py_compile "$RUNNER_TEMP/CAL26_R85_engine.py"
          python "$RUNNER_TEMP/CAL26_R85_engine.py" --selftest
          python "$RUNNER_TEMP/CAL26_R85_engine.py" \
            --r74 "$RUNNER_TEMP/cal26-r85-in/R74" \
            --r82 "$RUNNER_TEMP/cal26-r85-in/R82" \
            --snapshot "research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json" \
            --out "$RUNNER_TEMP/cal26-r85-out"
          python - "$RUNNER_TEMP/cal26-r85-out" <<'PY_R85_VERIFY'
          import csv,hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R85_manifest.json').read_text())
          assert m['model']=='CAL26_V1R85_JOINT_LINEUP_REPLACEMENT' and m['players']==518
          assert m['eligible']==389 and m['excluded_lowGP']==129
          assert m['modeled_nonK_slots']==192 and m['unmodeled_fixed_K_slots']==12
          assert abs(m['H0_2026_optimal_total']-m['H0_hungarian_independent'])<1e-5
          assert abs(m['H1_synthetic_optimal_total']-m['H1_hungarian_independent'])<1e-5
          assert not m['FV_scale_identified'] and not m['owner_maye_target_used'] and m['production_write_count']==0
          assert not m['2027_raw_forecast_independently_frozen'] and m['H1_is_synthetic_reconstruction']
          assert not m['multi_position_player_eligibility_verified'] and not m['team_by_team_lineups_optimized']
          for n,hash0 in m['files_sha256'].items():
           assert (p/n).is_file() and hashlib.sha256((p/n).read_bytes()).hexdigest()==hash0,n
          with (p/'CAL26_R85_518_PLAYER_POOLED_LINEUP_MARGINAL_UTILITY_NOT_FV.csv').open() as h:a=list(csv.DictReader(h))
          assert len(a)==518 and len({(x['name'],x['position']) for x in a})==518
          assert all(x['new_FV']=='' and x['production_writes_authorized']=='False' for x in a)
          with (p/'CAL26_R85_10_STARTER_SLOT_ASSIGNMENT_AUDIT.csv').open() as h:s=list(csv.DictReader(h))
          assert len(s)==10 and sum(int(x['league_slots']) for x in s)==192
          assert all(x['selected_2026_count']==x['league_slots'] and x['selected_2027_reconstructed_scenario_count']==x['league_slots'] for x in s)
          with (p/'CAL26_R85_5_FOCUS_TWO_YEAR_LINEUP_UTILITY_NOT_FV.csv').open() as h:f=list(csv.DictReader(h))
          assert {x['name'] for x in f}=={'drake maye','malik nabers','bryce young','cj stroud','puka nacua'}
          print('CAL26_R85_PINNED_LEAGUE_LINEUP_OPTIMALITY_NO_FV_RELEASE_GREEN')
          PY_R85_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          cat "$RUNNER_TEMP/cal26-r85-out/CAL26_R85_decision.md" >> "$GITHUB_STEP_SUMMARY"
