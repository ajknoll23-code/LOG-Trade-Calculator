name: Free Agent Utility V1 - Closeout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  archive-completed-free-agent-utility-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cleanup dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "PyYAML==6.0.2" requests

      - name: Guard exact completed-workflow lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          import yaml

          targets = {
              "free-agent-utility-v1-phase1-private-shadow.yml":
                  "2c2b310935ac52f38d1a6a0179395a6829be231b",
              "free-agent-utility-v1-phase2-delta-transport-shadow.yml":
                  "7b6b68ec74fbc78d3d3372d3e7ea82d132a9d032",
              "free-agent-utility-v1-phase3-bounded-candidate.yml":
                  "89f326b68458468eb6240fb46fa915083b685b48",
              "free-agent-utility-v1-phase4-production-candidate-shadow.yml":
                  "840e73bf8a864da0f6b0a3889351b7d242705df9",
              "free-agent-utility-v1-deploy.yml":
                  "871e7e7c1fa7dce16ef6f39a5b30813d19ac4ca5",
          }

          refresh_name = "free-agent-utility-v1-refresh.yml"
          refresh_sha = "d115df51d15f923ee7ffb3cc14ff5af1fb22d0f3"

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")

          def blob_sha(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def triggers(path):
              doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML: {path}")
              value = doc.get("on")
              if isinstance(value, str):
                  return {value}
              if isinstance(value, list):
                  return set(map(str, value))
              if isinstance(value, dict):
                  return set(map(str, value))
              raise SystemExit(f"Unknown trigger structure: {path}")

          for name, expected in targets.items():
              src = workflow_dir / name
              dst = archive_dir / name
              if not src.exists():
                  raise SystemExit(f"Expected active completed workflow missing: {src}")
              if dst.exists():
                  raise SystemExit(f"Archive destination already exists: {dst}")
              actual = blob_sha(src)
              if actual != expected:
                  raise SystemExit(
                      f"SHA drift for {name}: expected={expected} actual={actual}"
                  )
              if triggers(src) != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Refusing to archive non-manual workflow: {name} "
                      f"triggers={sorted(triggers(src))}"
                  )

          refresh = workflow_dir / refresh_name
          if not refresh.exists():
              raise SystemExit("Production refresh workflow is missing")
          actual_refresh = blob_sha(refresh)
          if actual_refresh != refresh_sha:
              raise SystemExit(
                  f"Production refresh SHA drift: expected={refresh_sha} "
                  f"actual={actual_refresh}"
              )
          refresh_triggers = triggers(refresh)
          if refresh_triggers != {"workflow_run", "workflow_dispatch"}:
              raise SystemExit(
                  "Production refresh trigger contract changed: "
                  f"{sorted(refresh_triggers)}"
              )

          # Production state must already exist before we remove deployment scaffolding.
          utility = json.loads(
              Path("data/free_agent_utility_v1.json").read_text(encoding="utf-8")
          )
          if utility.get("policy_id") != "phase3-selected-15pct-cap040":
              raise SystemExit("Unexpected production Free Agent Utility V1 policy")
          if len(utility.get("players", [])) != 408:
              raise SystemExit("Unexpected production utility row count")
          if "FREE_AGENT_UTILITY_V1_BOARD_INTEGRATION" not in Path(
              "free-agent-board.html"
          ).read_text(encoding="utf-8"):
              raise SystemExit("Production board integration marker missing")

          print("PASS: five completed manual-only workflows are exact and archive-safe.")
          print("PASS: production Refresh workflow is exact and protected.")
          print("PASS: deployed utility artifact and board integration exist.")
          PY

      - name: Archive completed Free Agent Utility V1 workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflow-archive/completed-research

          git mv \
            .github/workflows/free-agent-utility-v1-phase1-private-shadow.yml \
            .github/workflow-archive/completed-research/free-agent-utility-v1-phase1-private-shadow.yml

          git mv \
            .github/workflows/free-agent-utility-v1-phase2-delta-transport-shadow.yml \
            .github/workflow-archive/completed-research/free-agent-utility-v1-phase2-delta-transport-shadow.yml

          git mv \
            .github/workflows/free-agent-utility-v1-phase3-bounded-candidate.yml \
            .github/workflow-archive/completed-research/free-agent-utility-v1-phase3-bounded-candidate.yml

          git mv \
            .github/workflows/free-agent-utility-v1-phase4-production-candidate-shadow.yml \
            .github/workflow-archive/completed-research/free-agent-utility-v1-phase4-production-candidate-shadow.yml

          git mv \
            .github/workflows/free-agent-utility-v1-deploy.yml \
            .github/workflow-archive/completed-research/free-agent-utility-v1-deploy.yml

      - name: Merge archive manifest and README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          archive_dir = Path(".github/workflow-archive/completed-research")
          manifest_path = archive_dir / "archive_manifest.json"
          readme_path = archive_dir / "README.md"

          names = [
              "free-agent-utility-v1-phase1-private-shadow.yml",
              "free-agent-utility-v1-phase2-delta-transport-shadow.yml",
              "free-agent-utility-v1-phase3-bounded-candidate.yml",
              "free-agent-utility-v1-phase4-production-candidate-shadow.yml",
              "free-agent-utility-v1-deploy.yml",
          ]

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          entries = list(data.get("archive_entries", []))
          deleted = list(data.get("deleted_obsolete_workflows", []))

          def blob_sha(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          by_original = {row["original_path"]: row for row in entries}

          for name in names:
              path = archive_dir / name
              doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              on = doc.get("on") if isinstance(doc, dict) else None
              if isinstance(on, str):
                  trigger_set = {on}
              elif isinstance(on, list):
                  trigger_set = set(map(str, on))
              elif isinstance(on, dict):
                  trigger_set = set(map(str, on))
              else:
                  raise SystemExit(f"Cannot parse triggers for archived {name}")

              if trigger_set != {"workflow_dispatch"}:
                  raise SystemExit(
                      f"Archived workflow unexpectedly not manual-only: {name}"
                  )

              original = f".github/workflows/{name}"
              row = {
                  "original_path": original,
                  "archive_path": str(path),
                  "git_blob_sha": blob_sha(path),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "triggers": ["workflow_dispatch"],
              }

              existing = by_original.get(original)
              if existing and existing.get("sha256") != row["sha256"]:
                  raise SystemExit(f"Archive manifest conflict for {original}")
              by_original[original] = row

          entries = [by_original[k] for k in sorted(by_original)]

          actual_yaml = sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )
          manifest_yaml = sorted(
              Path(row["archive_path"]).name for row in entries
          )
          if actual_yaml != manifest_yaml:
              raise SystemExit(
                  "Archive inventory mismatch after Free Agent Utility closeout"
              )

          protected = set(data.get("protected_active_workflows", []))
          protected.add("free-agent-utility-v1-refresh.yml")

          out = {
              "schema_version": data.get("schema_version", 4),
              "archive_workflow_n": len(entries),
              "protected_active_workflow_n": len(protected),
              "protected_active_workflows": sorted(protected),
              "archive_entries": entries,
              "deleted_obsolete_workflows": deleted,
          }
          manifest_path.write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual-only research and deployment workflows are moved out of "
              "'.github/workflows' so they no longer clutter the Actions workflow list. "
              "Scheduled, reusable, and still-open research workflows remain active.",
              "",
              "Archived files are preserved byte-for-byte. Their original paths, Git blob "
              "SHAs, and SHA-256 hashes are recorded in 'archive_manifest.json'.",
              "",
              "A very small number of files may be deleted instead of archived only when "
              "they are exact SHA-pinned obsolete duplicates with an identified successor. "
              "Those deletions are also recorded in the manifest.",
              "",
              f"Archive refreshed: {datetime.now(timezone.utc).isoformat()}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              "",
          ]
          lines.extend(f"- {name}" for name in actual_yaml)

          if deleted:
              lines.extend(["", "## Deleted obsolete duplicates", ""])
              for row in deleted:
                  lines.append(
                      f"- {Path(row['path']).name} — {row['reason']}"
                  )
          lines.append("")
          readme_path.write_text("\n".join(lines), encoding="utf-8")

          print(f"PASS: archive manifest now tracks {len(entries)} workflows.")
          print("PASS: Free Agent Utility V1 Refresh added to protected active workflows.")
          PY

      - name: Prove only production Refresh remains active for Free Agent Utility V1
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_dir = Path(".github/workflows")
          active = sorted(
              p.name for p in workflow_dir.iterdir()
              if p.is_file()
              and p.suffix in {".yml", ".yaml"}
              and p.name.startswith("free-agent-utility-v1-")
          )

          expected = [
              "free-agent-utility-v1-closeout.yml",
              "free-agent-utility-v1-refresh.yml",
          ]
          if active != expected:
              raise SystemExit(
                  f"Unexpected Free Agent Utility V1 active workflows: {active}"
              )

          # Production files and implementation must not have changed.
          protected_paths = [
              "data/free_agent_utility_v1.json",
              "free-agent-board.html",
              "scripts/projections/build_free_agent_utility_v1.py",
              "scripts/validation/validate_free_agent_utility_v1.py",
              ".github/workflows/free-agent-utility-v1-refresh.yml",
          ]
          subprocess.run(
              ["git", "diff", "--exit-code", "--", *protected_paths],
              check=True,
          )

          print("PASS: only Refresh plus this one-time closeout workflow remain active.")
          print("PASS: deployed production state is untouched.")
          PY

      - name: Run full repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Remove this one-time closeout workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/free-agent-utility-v1-closeout.yml

          test -f .github/workflows/free-agent-utility-v1-refresh.yml

          python3 - <<'PY'
          from pathlib import Path

          active = sorted(
              p.name for p in Path(".github/workflows").iterdir()
              if p.is_file()
              and p.suffix in {".yml", ".yaml"}
              and p.name.startswith("free-agent-utility-v1-")
          )
          if active != ["free-agent-utility-v1-refresh.yml"]:
              raise SystemExit(
                  "Closeout failed: unexpected Free Agent Utility V1 workflows remain "
                  + repr(active)
              )
          print("PASS: only production Refresh remains active for Free Agent Utility V1.")
          PY

      - name: Guard exact closeout scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected_suffixes = {
              ".github/workflows/free-agent-utility-v1-phase1-private-shadow.yml",
              ".github/workflows/free-agent-utility-v1-phase2-delta-transport-shadow.yml",
              ".github/workflows/free-agent-utility-v1-phase3-bounded-candidate.yml",
              ".github/workflows/free-agent-utility-v1-phase4-production-candidate-shadow.yml",
              ".github/workflows/free-agent-utility-v1-deploy.yml",
              ".github/workflows/free-agent-utility-v1-closeout.yml",
              ".github/workflow-archive/completed-research/free-agent-utility-v1-phase1-private-shadow.yml",
              ".github/workflow-archive/completed-research/free-agent-utility-v1-phase2-delta-transport-shadow.yml",
              ".github/workflow-archive/completed-research/free-agent-utility-v1-phase3-bounded-candidate.yml",
              ".github/workflow-archive/completed-research/free-agent-utility-v1-phase4-production-candidate-shadow.yml",
              ".github/workflow-archive/completed-research/free-agent-utility-v1-deploy.yml",
              ".github/workflow-archive/completed-research/archive_manifest.json",
              ".github/workflow-archive/completed-research/README.md",
          }

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )

          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  before, after = path.split(" -> ", 1)
                  touched.add(before)
                  touched.add(after)
              else:
                  touched.add(path)

          unexpected = sorted(touched - expected_suffixes)
          if unexpected:
              raise SystemExit(
                  "Unexpected closeout changes: " + ", ".join(unexpected)
              )

          print("PASS: closeout touched only workflow/archive organization.")
          PY

      - name: Commit Free Agent Utility V1 closeout
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive

          git diff --cached --quiet && {
            echo "ERROR: nothing staged"
            exit 1
          }

          git pull --rebase --autostash origin main
          python3 scripts/validation/repo_regression_checks.py

          test -f .github/workflows/free-agent-utility-v1-refresh.yml
          test ! -f .github/workflows/free-agent-utility-v1-deploy.yml
          test ! -f .github/workflows/free-agent-utility-v1-phase1-private-shadow.yml
          test ! -f .github/workflows/free-agent-utility-v1-phase2-delta-transport-shadow.yml
          test ! -f .github/workflows/free-agent-utility-v1-phase3-bounded-candidate.yml
          test ! -f .github/workflows/free-agent-utility-v1-phase4-production-candidate-shadow.yml
          test ! -f .github/workflows/free-agent-utility-v1-closeout.yml

          git commit -m "Archive completed Free Agent Utility V1 workflows"
          git push origin HEAD:main
