name: Package Adjustment V8 - Development Voting Activation V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture activation base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact frozen V8 lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["index.html"]="de2c0954d068a07ebf137cec6d3b61719ee48425"
            ["scripts/market/ktc_pipeline.py"]="dde0dab26820a8494f72b64b721f1971508053dc"
            ["scripts/validation/repo_regression_checks.py"]="eca0c9278b457a95e08ef015c9482944dc523a33"
            ["scripts/validation/check_package_adjustment_live.py"]="3c924d762f93fd93b9943afe090deda6a2b7d8a0"
            ["research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json"]="8258fe8ca41d6ccef16529ea9ade9da19d3ca2e2"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v8/development_catalog_audit_v1.json"]="9c9d6303ed27f26ab36b273fa99942be2a75e7c0"
            ["research/package-adjustment-v8/development_catalog_manifest_v1.json"]="970d52eb39d093c27f6086ba018f62bd6d53217a"
            ["research/package-adjustment-v8/catalog_selection_certificate_v1.json"]="15f361b655042e281ba8454df75f9d0217c636f5"
            ["research/package-adjustment-v8/evaluate_development_v1.py"]="bef73c81bdff771f51b4f18bea011b30a71e9935"
            ["research/package-adjustment-v8/evaluation_protocol_v1.json"]="263db22eb41be6b458479d7fb76ad61f55b0bcd8"
            ["research/package-adjustment-v8/evaluation_fold_assignment_v1.json"]="c9551211d4369d8234321e98223111cabee28d82"
            ["research/package-adjustment-v8/evaluation_harness_selftest_v1.json"]="ff8d6791a7cbb911bb73f55ce5f41e96d82e8162"
            ["research/package-adjustment-v8/evaluation_engine_manifest_v1.json"]="6d49b1a1be4c3dd108820de9db7c370b0185a10b"
            ["research/package-adjustment-v8/player_status_audit_v1.json"]="3f4bbeaefaba1f80a7a79b7171f8bd697d16b058"
            ["research/package-adjustment-v8/voting_randomization_schedule_v1.json"]="c499d85b8473798294eccfe9310ec9644c1db3fc"
            ["research/package-adjustment-v8/voting_integrity_contract_v1.json"]="203fd97e27e31413b5c18e3f8c7ecd6fd06cfeb8"
            ["research/package-adjustment-v8/validate_voting_dataset_v1.py"]="aaab7e8e4f8eb66a9a57503d8185c0bf77acba71"
            ["research/package-adjustment-v8/pre_vote_operational_hardening_manifest_v1.json"]="3b0956e1ff5d15e85e915cca4f5c6ec081228565"
          )
          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: frozen V8 lineage drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          d=Path("research/package-adjustment-v8")

          def load(name):
              return json.loads((d/name).read_text())

          def sha(name):
              return hashlib.sha256((d/name).read_bytes()).hexdigest()

          cat=load("package_vote_challenges_v8_development_v1.json")
          audit=load("development_catalog_audit_v1.json")
          em=load("evaluation_engine_manifest_v1.json")
          pv=load("pre_vote_operational_hardening_manifest_v1.json")
          sched=load("voting_randomization_schedule_v1.json")
          vc=load("voting_integrity_contract_v1.json")
          status=load("player_status_audit_v1.json")

          assert sha("package_vote_challenges_v8_development_v1.json")=="23f0213d0f5f5fbb984d70b0f9c0b5193eca649d12c055cacbe05a75b962dda9"
          assert sha("voting_randomization_schedule_v1.json")=="2db9b5826113916cc19833bc1bb0227ffd8047b7e040ebee92dcb77dcd68c51c"
          assert sha("voting_integrity_contract_v1.json")=="84bac52c482acb32a76dad7d437730b9ff3e264f021d8675a4063e061292ac7c"
          assert sha("player_status_audit_v1.json")=="85e910b398d5f47d126b9aeff4fbfca9ae11ae3754fa2c8210fec26e96da615e"

          assert cat["status"]=="FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED"
          assert cat["voting_activated"] is False
          assert cat["challenge_count"]==40
          assert len(cat["challenges"])==40
          assert all(
              "fv" not in p
              for c in cat["challenges"]
              for side in ("side_A","side_B")
              for p in c[side]["assets"]
          )

          assert audit["all_hard_gates_pass"] is True
          assert audit["freshness"]["unique_side_package_count"]==80
          assert audit["freshness"]["repeated_exact_side_package_count"]==0

          assert em["status"]=="PASS"
          assert em["v8_votes_read"] is False
          assert em["production_change_authorized"] is False

          assert pv["status"]=="PASS_PRE_VOTE_HARDENING"
          assert pv["voting_activated"] is False
          assert pv["v8_votes_read"] is False
          assert pv["production_change_authorized"] is False
          assert pv["balanced_randomization_frozen"] is True
          assert pv["voting_integrity_validator_frozen"] is True
          assert pv["production_multi_v_multi_remains_fail_closed"] is True

          assert status["status"]=="PASS_CURRENT_ROSTER_STATUS"
          assert status["resolved_players"]==143
          assert status["invalid_current_status_players"]==[]
          assert status["team_drift_count"]==0

          assert sched["status"]=="FROZEN_PRE_VOTE"
          assert sched["accepted_voter_slots"]==50
          assert sched["challenges"]==40
          assert set(map(int,sched["slots"]))==set(range(1,51))
          assert sched["left_right_balance_per_challenge"]=={"A_left":25,"B_left":25}
          assert sched["v8_votes_read"] is False

          ids={c["id"] for c in cat["challenges"]}
          for slot in range(1,51):
              s=sched["slots"][str(slot)]
              assert s["accepted_voter_slot"]==slot
              assert len(s["challenge_order"])==40
              assert set(s["challenge_order"])==ids
              assert set(s["display_left_by_challenge"])==ids

          for cid in ids:
              sides=[sched["slots"][str(slot)]["display_left_by_challenge"][cid] for slot in range(1,51)]
              assert sides.count("A")==25 and sides.count("B")==25

          assert vc["status"]=="FROZEN_PRE_VOTE"
          assert vc["accepted_voters"]==50
          assert vc["accepted_ballots"]==2000
          assert vc["challenges_per_voter"]==40
          assert vc["accepted_voter_slots_exactly_1_to_50"] is True
          assert vc["left_right_balance_each_challenge"]=="25/25"
          assert vc["early_stop_before_50"] is False
          assert vc["maturity_monitor_outcome_blind"] is True

          print("PASS: exact V8 pre-vote lineage and 50-slot schedule verified.")
          PY

          python3 scripts/validation/check_package_adjustment_live.py

      - name: Apply V8 voting activation
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib,json,os,re,textwrap
          from datetime import datetime,timezone
          from pathlib import Path

          root=Path(".")
          d=root/"research/package-adjustment-v8"
          index=root/"index.html"
          ktc=root/"scripts/market/ktc_pipeline.py"
          reg=root/"scripts/validation/repo_regression_checks.py"
          base_sha=os.environ["BASE_SHA"]

          cat_path=d/"package_vote_challenges_v8_development_v1.json"
          sched_path=d/"voting_randomization_schedule_v1.json"
          status_path=d/"player_status_audit_v1.json"

          cat=json.loads(cat_path.read_text())
          sched=json.loads(sched_path.read_text())
          status=json.loads(status_path.read_text())
          activated=datetime.now(timezone.utc).isoformat()

          rawbase=(
              "https://raw.githubusercontent.com/"
              "ajknoll23-code/LOG-Trade-Calculator/"
              f"{base_sha}/research/package-adjustment-v8"
          )

          def replace_function(text,name,replacement):
              marker=f"function {name}("
              start=text.find(marker)
              if start<0: raise RuntimeError(f"missing JS function: {name}")
              brace=text.find("{",start)
              depth=0;quote=None;escaped=False;line=False;block=False;i=brace
              while i<len(text):
                  ch=text[i];n=text[i+1] if i+1<len(text) else ""
                  if line:
                      if ch=="\n": line=False
                      i+=1;continue
                  if block:
                      if ch=="*" and n=="/": block=False;i+=2;continue
                      i+=1;continue
                  if quote:
                      if escaped: escaped=False
                      elif ch=="\\": escaped=True
                      elif ch==quote: quote=None
                      i+=1;continue
                  if ch=="/" and n=="/": line=True;i+=2;continue
                  if ch=="/" and n=="*": block=True;i+=2;continue
                  if ch in ("'",'"',"`"): quote=ch;i+=1;continue
                  if ch=="{": depth+=1
                  elif ch=="}":
                      depth-=1
                      if depth==0:
                          return text[:start]+replacement.strip()+text[i+1:]
                  i+=1
              raise RuntimeError(f"unbalanced JS function: {name}")

          text=index.read_text(encoding="utf-8")
          start=text.find("/* Package Adjustment V7 Development Voting.")
          if start<0: raise RuntimeError("missing V7 activation marker")
          end_marker="let packageVoteCurrent = null;"
          end=text.find(end_marker,start)
          if end<0: raise RuntimeError("missing V7 constants end")
          end+=len(end_marker)

          constants=f'''/* Package Adjustment V8 Development Voting.
          Research only. Exact frozen 50-slot schedule: 50 complete voters x 40.
          FV/candidate scores are hidden. Production Package Adjustment remains V1.7. */
          const PACKAGE_VOTE_CHALLENGES_URL = '{rawbase}/package_vote_challenges_v8_development_v1.json';
          const PACKAGE_VOTE_SCHEDULE_URL = '{rawbase}/voting_randomization_schedule_v1.json';
          const PACKAGE_VOTE_CATALOG_SHA256 = '23f0213d0f5f5fbb984d70b0f9c0b5193eca649d12c055cacbe05a75b962dda9';
          const PACKAGE_VOTE_SCHEDULE_SHA256 = '2db9b5826113916cc19833bc1bb0227ffd8047b7e040ebee92dcb77dcd68c51c';
          const PACKAGE_VOTE_DAILY_LIMIT = 40;
          const PACKAGE_VOTE_TOTAL_CHALLENGES = 40;
          const PACKAGE_VOTE_TOTAL_SLOTS = 50;
          const PACKAGE_VOTE_VALID_AFTER_UTC = '{activated}';
          let PACKAGE_VOTE_CHALLENGES = null;
          let PACKAGE_VOTE_SCHEDULE = null;
          let PACKAGE_VOTE_STATUS = 'idle';
          let packageVoteCurrent = null;'''
          text=text[:start]+constants+text[end:]

          hstart=text.find("function packageVoteHash(value){")
          hend=text.find("function packageVotesToday(){",hstart)
          if hstart<0 or hend<0: raise RuntimeError("missing V7 package helper prelude")
          helpers=r'''function packageVoteSlotStorageKey(){
          const voter = ktcCurrentVoterId() || 'unconfirmed';
          return `package_votes_v8dev_slot_${voter}`;
          }

          function packageVoteSlotConflictKey(){
          const voter = ktcCurrentVoterId() || 'unconfirmed';
          return `package_votes_v8dev_slot_conflict_${voter}`;
          }

          function packageVoteAssignedSlot(){
          const voter = ktcCurrentVoterId();
          if(!voter) return null;
          const raw = new URLSearchParams(window.location.search).get('pkgv8slot');
          const fromUrl = raw !== null && /^[0-9]+$/.test(raw) ? Number(raw) : null;
          const validUrl = Number.isInteger(fromUrl) && fromUrl >= 1 && fromUrl <= PACKAGE_VOTE_TOTAL_SLOTS;
          const key = packageVoteSlotStorageKey();
          const storedRaw = localStorage.getItem(key);
          const stored = storedRaw && /^[0-9]+$/.test(storedRaw) ? Number(storedRaw) : null;
          const validStored = Number.isInteger(stored) && stored >= 1 && stored <= PACKAGE_VOTE_TOTAL_SLOTS;
          if(validUrl && validStored && fromUrl !== stored){
            localStorage.setItem(packageVoteSlotConflictKey(), `${stored}|${fromUrl}`);
            return null;
          }
          if(validUrl){
            localStorage.setItem(key,String(fromUrl));
            localStorage.removeItem(packageVoteSlotConflictKey());
            return fromUrl;
          }
          if(validStored) return stored;
          return null;
          }

          function packageVoteSlotConflict(){
          return localStorage.getItem(packageVoteSlotConflictKey());
          }

          function packageVoteCompletedKey(){
          const voter = ktcCurrentVoterId() || 'unconfirmed';
          const slot = packageVoteAssignedSlot() || 'none';
          return `package_votes_v8dev_completed_${voter}_slot_${slot}`;
          }

          function packageVoteCompleted(){
          try {
            const rows = JSON.parse(localStorage.getItem(packageVoteCompletedKey()) || '[]');
            return Array.isArray(rows)
              ? Array.from(new Set(rows.map(String))).slice(0,PACKAGE_VOTE_TOTAL_CHALLENGES)
              : [];
          } catch(e){ return []; }
          }

          function packageVoteTodayKey(){
          const voter = ktcCurrentVoterId() || 'unconfirmed';
          const slot = packageVoteAssignedSlot() || 'none';
          return `package_votes_v8dev_${voter}_slot_${slot}_` + new Date().toISOString().slice(0,10);
          }

          '''
          text=text[:hstart]+helpers+text[hend:]

          replacements={
          "packageVotesToday":r'''function packageVotesToday(){
          return parseInt(localStorage.getItem(packageVoteTodayKey()) || '0',10);
          }''',
          "packageVoteRecent":r'''function packageVoteRecent(){
          return packageVoteCompleted();
          }''',
          "packageVoteRemember":r'''function packageVoteRemember(id){
          const completed=packageVoteCompleted();
          if(!completed.includes(String(id))) completed.push(String(id));
          localStorage.setItem(packageVoteCompletedKey(),JSON.stringify(completed.slice(0,PACKAGE_VOTE_TOTAL_CHALLENGES)));
          }''',
          "packageVoteSelectChallenge":r'''function packageVoteSelectChallenge(){
          if(!PACKAGE_VOTE_CHALLENGES || !PACKAGE_VOTE_SCHEDULE || !PACKAGE_VOTE_SCHEDULE.slots) return null;
          const voter=ktcCurrentVoterId();
          const slot=packageVoteAssignedSlot();
          if(!voter || !slot) return null;
          const spec=PACKAGE_VOTE_SCHEDULE.slots[String(slot)];
          if(!spec || Number(spec.accepted_voter_slot)!==slot) return null;
          const completed=new Set(packageVoteCompleted());
          const id=spec.challenge_order.find(cid=>!completed.has(String(cid)));
          if(!id) return null;
          const challenge=PACKAGE_VOTE_CHALLENGES.find(c=>String(c.id)===String(id));
          if(!challenge) return null;
          const left=spec.display_left_by_challenge[String(id)];
          if(left!=='A' && left!=='B') return null;
          const displayOrder=spec.challenge_order.indexOf(String(id));
          if(displayOrder<0 || displayOrder>=40) return null;
          return {challenge,left,slot,displayOrder};
          }''',
          "packageVoteEnsureLoaded":r'''function packageVoteEnsureLoaded(){
          if(PACKAGE_VOTE_STATUS==='loading' || PACKAGE_VOTE_STATUS==='ready') return;
          PACKAGE_VOTE_STATUS='loading';
          Promise.all([
            fetch(PACKAGE_VOTE_CHALLENGES_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('catalog HTTP '+r.status);return r.json();}),
            fetch(PACKAGE_VOTE_SCHEDULE_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('schedule HTTP '+r.status);return r.json();})
          ])
          .then(([doc,sched])=>{
            if(
              doc.schema_version!==1 ||
              doc.study_id!=='package-adjustment-v8-topology-split-multi-v-multi' ||
              doc.stage!=='phase1c_voter_safe_development_catalog' ||
              doc.status!=='FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED' ||
              doc.voting_activated!==false ||
              Number(doc.challenge_count)!==40 ||
              !Array.isArray(doc.challenges) ||
              doc.challenges.length!==40 ||
              !doc.challenges.every(c=>
                c && c.schema_version===1 &&
                c.experiment==='package_adjustment_v8_topology_split_development' &&
                ['2v2','2v3','2v4','3v3','3v4','4v4'].includes(c.topology) &&
                c.side_A && Array.isArray(c.side_A.assets) &&
                c.side_B && Array.isArray(c.side_B.assets) &&
                c.side_A.assets.every(p=>p && !('fv' in p) && p.key && p.name && p.pos && p.team) &&
                c.side_B.assets.every(p=>p && !('fv' in p) && p.key && p.name && p.pos && p.team)
              )
            ) throw new Error('unexpected frozen V8 voter-safe catalog');

            const ids=new Set(doc.challenges.map(c=>String(c.id)));
            if(ids.size!==40) throw new Error('duplicate V8 challenge ids');
            if(
              sched.schema_version!==1 ||
              sched.study_id!==doc.study_id ||
              sched.stage!=='phase1f_balanced_randomization_schedule' ||
              sched.status!=='FROZEN_PRE_VOTE' ||
              Number(sched.accepted_voter_slots)!==50 ||
              Number(sched.challenges)!==40 ||
              sched.v8_votes_read!==false ||
              !sched.slots ||
              Object.keys(sched.slots).length!==50
            ) throw new Error('unexpected frozen V8 schedule');

            for(let slot=1;slot<=50;slot++){
              const spec=sched.slots[String(slot)];
              if(
                !spec ||
                Number(spec.accepted_voter_slot)!==slot ||
                !Array.isArray(spec.challenge_order) ||
                spec.challenge_order.length!==40 ||
                new Set(spec.challenge_order.map(String)).size!==40 ||
                !spec.challenge_order.every(cid=>ids.has(String(cid))) ||
                !spec.display_left_by_challenge
              ) throw new Error('invalid V8 schedule slot '+slot);
            }
            PACKAGE_VOTE_CHALLENGES=doc.challenges;
            PACKAGE_VOTE_SCHEDULE=sched;
            PACKAGE_VOTE_STATUS='ready';
            packageVoteCurrent=null;
            renderPackageVote();
          })
          .catch(err=>{
            console.warn('Package Adjustment V8 development voting load failed:',err);
            PACKAGE_VOTE_CHALLENGES=null;
            PACKAGE_VOTE_SCHEDULE=null;
            PACKAGE_VOTE_STATUS='failed';
            renderPackageVote();
          });
          }''',
          "packageVoteAssetCard":r'''function packageVoteAssetCard(p){
          const team=p.team ? ` &middot; ${ktcTeamLabel(p.team)}` : '';
          return `<div class="need-cell" style="text-align:left;padding:10px;">
          <div style="font-weight:600;font-size:14px;">${escapeHtml(p.name)}</div>
          <div style="color:var(--text-dim);font-size:11px;">${escapeHtml(p.pos)}${team}</div>
          </div>`;
          }''',
          "packageVoteSubmit":r'''function packageVoteSubmit(displaySide){
          if(Date.now()<Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)) return;
          if(!packageVoteCurrent || packageVotesToday()>=PACKAGE_VOTE_DAILY_LIMIT) return;
          const left=packageVoteCurrent.left;
          const choice=displaySide==='L' ? left : (left==='A' ? 'B' : 'A');
          const id=String(packageVoteCurrent.challenge.id);
          const voter=ktcCurrentVoterId();
          const slot=packageVoteCurrent.slot;
          const displayOrder=packageVoteCurrent.displayOrder;
          if(!voter || !Number.isInteger(slot) || slot<1 || slot>50) return;
          if(!Number.isInteger(displayOrder) || displayOrder<0 || displayOrder>=40) return;
          if(packageVoteAssignedSlot()!==slot) return;
          if(packageVoteCompleted().includes(id)) return;

          fetch(KTC_SUBMIT_URL,{
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify({
              voterRosterId:voter,
              keep:`__pkgv8dev__|${id}|${choice}`,
              trade:`__pkgv8dev_meta__|${left}|${slot}|${displayOrder}`,
              cut:'__pkgv8dev_schema__|1'
            })
          }).catch(()=>{});

          localStorage.setItem(packageVoteTodayKey(),String(packageVotesToday()+1));
          packageVoteRemember(id);
          packageVoteCurrent=packageVoteSelectChallenge();
          renderPackageVote();
          }''',
          "renderPackageVote":r'''function renderPackageVote(){
          const el=document.getElementById('packageVoteWrap');
          if(!el) return;

          if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){
            el.innerHTML=`
            <div class="vote-access-card">
            <div class="vote-access-copy">
            <div class="vote-access-title">Ready to compare trades?</div>
            <div class="vote-access-sub">League members: choose your team above. Everyone else can vote as a guest. V8 research also requires the assigned slot link you were sent.</div>
            </div>
            <button type="button" class="vote-guest-btn" onclick="ktcStartGuestMode()">Vote as a guest</button>
            </div>`;
            return;
          }

          const slot=packageVoteAssignedSlot();
          if(!slot){
            const conflict=packageVoteSlotConflict();
            el.innerHTML=`<div style="border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text-dim);font-size:13px;">
            <b style="color:var(--text);">V8 research link required.</b><br>
            ${conflict
              ? 'This voter is already locked to a different V8 research slot. Use the original assigned link.'
              : 'Open the voter-specific link containing ?pkgv8slot=1 through ?pkgv8slot=50. Each slot may be assigned to only one accepted voter.'}
            </div>`;
            return;
          }

          if(Date.now()<Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)){
            el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">V8 development voting opens at ${new Date(PACKAGE_VOTE_VALID_AFTER_UTC).toLocaleString()}.</div>`;
            return;
          }

          const completedCount=packageVoteCompleted().length;
          if(completedCount>=PACKAGE_VOTE_TOTAL_CHALLENGES){
            el.innerHTML=`<div style="color:var(--green);font-size:13px;padding:8px 0;">You've completed all ${PACKAGE_VOTE_TOTAL_CHALLENGES} V8 comparisons for research slot ${slot}. Thank you.</div>`;
            return;
          }

          if(PACKAGE_VOTE_STATUS==='idle'){
            packageVoteEnsureLoaded();
            el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen V8 schedule for slot ${slot}...</div>`;
            return;
          }
          if(PACKAGE_VOTE_STATUS==='loading'){
            el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen V8 schedule for slot ${slot}...</div>`;
            return;
          }
          if(PACKAGE_VOTE_STATUS==='failed'){
            el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">V8 package research is temporarily unavailable. Normal KTC voting is unaffected.</div>`;
            return;
          }

          if(!packageVoteCurrent) packageVoteCurrent=packageVoteSelectChallenge();
          if(!packageVoteCurrent){
            el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">No remaining V8 comparison is available for research slot ${slot}.</div>`;
            return;
          }

          const c=packageVoteCurrent.challenge;
          const canonicalA=c.side_A.assets.map(packageVoteAssetCard).join('');
          const canonicalB=c.side_B.assets.map(packageVoteAssetCard).join('');
          const leftIsA=packageVoteCurrent.left==='A';
          const leftHTML=leftIsA ? canonicalA : canonicalB;
          const rightHTML=leftIsA ? canonicalB : canonicalA;

          el.innerHTML=`
          <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text-dim);">
          <b style="color:var(--text);">V8 multi-package research:</b> Which side would you rather receive in this dynasty trade?
          Values are intentionally hidden. Choose based on the assets themselves.
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;">
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:5px;text-align:center;">SIDE A</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${leftHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('L')">Choose Side A</button>
          </div>
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--violet);margin-bottom:5px;text-align:center;">SIDE B</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${rightHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('R')">Choose Side B</button>
          </div>
          </div>
          <div style="color:var(--text-dim);font-size:10px;margin-top:8px;text-align:center;">
          ${completedCount} / ${PACKAGE_VOTE_TOTAL_CHALLENGES} V8 comparisons completed &middot; research slot ${slot} &middot; exact frozen order/display schedule
          </div>`;
          }'''
          }

          for name,replacement in replacements.items():
              text=replace_function(text,name,replacement)

          old_help=(
              '<div class="vote-help-text"><strong>Choose the trade side you would rather receive.</strong> '
              "These V7 research votes test how asset concentration changes preference when both sides contain multiple players. "
              "Player values are hidden, and these votes do not change the live trade result.</div>"
          )
          new_help=(
              '<div class="vote-help-text"><strong>Choose the trade side you would rather receive.</strong> '
              "V8 research tests topology-specific package effects using a frozen 50-voter schedule. "
              "Player values are hidden, and these votes do not change the live trade result.</div>"
          )
          if old_help not in text: raise RuntimeError("package vote help copy drift")
          text=text.replace(old_help,new_help,1)
          index.write_text(text,encoding="utf-8")

          # Reserve V8 rows from normal KTC aggregation.
          ktext=ktc.read_text(encoding="utf-8")
          if "__pkgv8dev__|" in ktext: raise RuntimeError("V8 prefix already present")
          m=re.search(r'PACKAGE_VOTE_PREFIXES\s*=\s*\((.*?)\)\n',ktext,flags=re.S)
          if not m: raise RuntimeError("PACKAGE_VOTE_PREFIXES not found")
          body=m.group(1).rstrip()
          if not body.endswith(","): body+=","
          body+=' "__pkgv8dev__|",'
          ktext=ktext[:m.start(1)]+body+ktext[m.end(1):]
          ktc.write_text(ktext,encoding="utf-8")

          # Update permanent repo regression contracts to V8.
          rtext=reg.read_text(encoding="utf-8")
          old='''        "__pkgv7dev__|",
              )'''
          new='''        "__pkgv7dev__|",
                  "__pkgv8dev__|",
              )'''
          if old not in rtext: raise RuntimeError("expected prefix tuple drift")
          rtext=rtext.replace(old,new,1)

          rstart=rtext.index("def check_package_sampling_contract():")
          rend=rtext.index("\ndef check_index_js_syntax():",rstart)
          check=textwrap.dedent(r'''
          def check_package_sampling_contract():
              text = INDEX.read_text(encoding="utf-8")
              start = text.index("function packageVoteSlotStorageKey(){")
              end = text.index("\nfunction render(){", start)
              block = text[start:end]

              assert "Package Adjustment V8 Development Voting." in text
              assert "function packageVoteAssignedSlot(){" in block
              assert "new URLSearchParams(window.location.search).get('pkgv8slot')" in block
              assert "package_votes_v8dev_slot_" in block
              assert "package_votes_v8dev_slot_conflict_" in block
              assert "if(validUrl && validStored && fromUrl !== stored)" in block
              assert "const spec=PACKAGE_VOTE_SCHEDULE.slots[String(slot)];" in block
              assert "const id=spec.challenge_order.find(cid=>!completed.has(String(cid)));" in block
              assert "const left=spec.display_left_by_challenge[String(id)];" in block
              assert "const displayOrder=spec.challenge_order.indexOf(String(id));" in block
              assert "Math.random()" not in block

              assert "doc.study_id!=='package-adjustment-v8-topology-split-multi-v-multi'" in block
              assert "doc.stage!=='phase1c_voter_safe_development_catalog'" in block
              assert "doc.status!=='FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED'" in block
              assert "doc.voting_activated!==false" in block
              assert "sched.stage!=='phase1f_balanced_randomization_schedule'" in block
              assert "sched.status!=='FROZEN_PRE_VOTE'" in block
              assert "Number(sched.accepted_voter_slots)!==50" in block
              assert "!('fv' in p)" in block

              assert "const PACKAGE_VOTE_DAILY_LIMIT = 40;" in text
              assert "const PACKAGE_VOTE_TOTAL_CHALLENGES = 40;" in text
              assert "const PACKAGE_VOTE_TOTAL_SLOTS = 50;" in text
              assert "research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json" in text
              assert "research/package-adjustment-v8/voting_randomization_schedule_v1.json" in text
              assert "__pkgv8dev__|" in text
              assert "__pkgv8dev_meta__|" in text
              assert "__pkgv8dev_schema__|1" in text
              assert "trade:`__pkgv8dev_meta__|${left}|${slot}|${displayOrder}`" in block
              assert "package_votes_v8dev_completed_" in text

              assert "packageVoteHash(`${voter}|order|${a.id}`)" not in block
              assert "packageVoteHash(`${voter}|side|${challenge.id}`)" not in block

              print(
                  "PASS V8 frozen 50-slot package sampling contract: exact slot order, "
                  "25/25 display balance, slot-bound transport, FV/candidate blind"
              )
          ''')
          rtext=rtext[:rstart]+check+rtext[rend:]
          reg.write_text(rtext,encoding="utf-8")

          # Activation manifest + operator slot-link sheet.
          manifest={
              "schema_version":1,
              "study_id":"package-adjustment-v8-topology-split-multi-v-multi",
              "stage":"development_voting_activation",
              "status":"V8_DEVELOPMENT_VOTING_ACTIVATED",
              "activated_at_utc":activated,
              "valid_ballot_start_utc":activated,
              "research_only":True,
              "production_change_authorized":False,
              "candidate_fit_performed":False,
              "candidate_scores_read":False,
              "v8_vote_outcomes_read_at_activation":False,
              "source_activation_base_commit":base_sha,
              "catalog_sha256":"23f0213d0f5f5fbb984d70b0f9c0b5193eca649d12c055cacbe05a75b962dda9",
              "schedule_sha256":"2db9b5826113916cc19833bc1bb0227ffd8047b7e040ebee92dcb77dcd68c51c",
              "player_status_sha256":"85e910b398d5f47d126b9aeff4fbfca9ae11ae3754fa2c8210fec26e96da615e",
              "accepted_complete_voters_exactly":50,
              "accepted_ballots_exactly":2000,
              "challenges_per_voter":40,
              "accepted_voter_slots_exactly_1_to_50":True,
              "early_stop_before_50":False,
              "slot_assignment":"explicit unique URL suffix ?pkgv8slot=1..50; voter identity locked to first slot used",
              "left_right_balance_each_challenge":"25/25",
              "vote_prefix":"__pkgv8dev__|",
              "meta_prefix":"__pkgv8dev_meta__|",
              "schema_marker":"__pkgv8dev_schema__|1",
              "transport_keep_format":"__pkgv8dev__|<challenge_id>|<canonical_choice_A_or_B>",
              "transport_trade_format":"__pkgv8dev_meta__|<canonical_left_A_or_B>|<slot_1_to_50>|<display_order_0_to_39>",
              "normal_ktc_ratings_consume_v8_rows":False,
              "production_package_adjustment_remains_v1_7":True,
              "next_action":"Assign each intended voter one unique slot link and collect complete 40-ballot sessions. Use only an outcome-blind maturity monitor until all 50 slots are complete."
          }
          (d/"development_voting_activation_manifest_v1.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          (d/"development_voting_activation_v1.md").write_text(
              "# Package Adjustment V8 — Development Voting Activation\n\n"
              f"Activated: `{activated}`\n\n"
              "- Research only; production remains V1.7.\n"
              "- 40 frozen player-only multi-v-multi challenges.\n"
              "- Exact maturity: 50 complete voters × 40 = 2,000 ballots.\n"
              "- Each challenge is A-left 25 times and B-left 25 times across slots 1–50.\n"
              "- Give each intended voter one unique `?pkgv8slot=N` link.\n"
              "- A voter is locked to the first valid slot used in that browser identity.\n"
              "- FV and candidate scores remain hidden.\n"
              "- No early stop and no outcome reading before exact maturity.\n"
          )
          links=[
              "# Package Adjustment V8 — Voter Slot Links",
              "",
              "Append exactly one suffix to the deployed calculator URL. Assign each slot to one intended voter.",
              "",
          ]+[f"- Slot {i}: `?pkgv8slot={i}`" for i in range(1,51)]
          (d/"development_voting_slot_links_v1.md").write_text("\n".join(links)+"\n")

          print(json.dumps({
              "status":manifest["status"],
              "activated_at_utc":activated,
              "slots":50,
              "challenges":40,
              "ballots_at_maturity":2000,
              "production_change_authorized":False
          },indent=2))
          PY

      - name: Prove exact activation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            index.html
            research/package-adjustment-v8/development_voting_activation_manifest_v1.json
            research/package-adjustment-v8/development_voting_activation_v1.md
            research/package-adjustment-v8/development_voting_slot_links_v1.md
            scripts/market/ktc_pipeline.py
            scripts/validation/repo_regression_checks.py
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)
          git diff --check

      - name: Test V8 slot-bound browser transport
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/v8_vote_browser_test.js" <<'JS'
          const fs=require('fs');
          const text=fs.readFileSync('index.html','utf8');

          function extractFunction(name){
            const marker=`function ${name}(`;
            const start=text.indexOf(marker);
            if(start<0) throw new Error(`missing ${name}`);
            let i=text.indexOf('{',start),d=0,q=null,esc=false,line=false,block=false;
            for(let k=i;k<text.length;k++){
              const ch=text[k],n=text[k+1]||'';
              if(line){if(ch==='\n')line=false;continue;}
              if(block){if(ch==='*'&&n==='/'){block=false;k++;}continue;}
              if(q){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch===q)q=null;continue;}
              if(ch==='/'&&n==='/'){line=true;k++;continue;}
              if(ch==='/'&&n==='*'){block=true;k++;continue;}
              if(ch==="'"||ch==='"'||ch==='`'){q=ch;continue;}
              if(ch==='{')d++; else if(ch==='}'){d--;if(d===0)return text.slice(start,k+1);}
            }
            throw new Error(`unbalanced ${name}`);
          }

          const constants=[
            "const PACKAGE_VOTE_TOTAL_CHALLENGES=40;",
            "const PACKAGE_VOTE_TOTAL_SLOTS=50;"
          ].join('\n');

          const funcs=[
            'packageVoteSlotStorageKey','packageVoteSlotConflictKey',
            'packageVoteAssignedSlot','packageVoteSlotConflict',
            'packageVoteCompletedKey','packageVoteCompleted',
            'packageVoteTodayKey','packageVotesToday',
            'packageVoteRecent','packageVoteRemember',
            'packageVoteSelectChallenge'
          ].map(extractFunction).join('\n');

          const store=new Map();
          global.localStorage={
            getItem:k=>store.has(k)?store.get(k):null,
            setItem:(k,v)=>store.set(k,String(v)),
            removeItem:k=>store.delete(k)
          };
          global.ktcCurrentVoterId=()=> 'test_voter';
          global.window={location:{search:'?pkgv8slot=7'}};

          global.PACKAGE_VOTE_CHALLENGES=Array.from({length:40},(_,i)=>({id:`c${i+1}`}));
          const ids=PACKAGE_VOTE_CHALLENGES.map(x=>x.id);
          global.PACKAGE_VOTE_SCHEDULE={slots:{
            "7":{
              accepted_voter_slot:7,
              challenge_order:ids.slice().reverse(),
              display_left_by_challenge:Object.fromEntries(ids.map((id,i)=>[id,i%2===0?'A':'B']))
            }
          }};

          eval(constants+'\n'+funcs);

          if(packageVoteAssignedSlot()!==7) throw new Error('slot assignment failed');
          const expected=ids.slice().reverse();
          for(let i=0;i<40;i++){
            const r=packageVoteSelectChallenge();
            if(!r) throw new Error('early exhaustion');
            if(r.slot!==7) throw new Error('slot drift');
            if(r.challenge.id!==expected[i]) throw new Error('order drift');
            if(r.displayOrder!==i) throw new Error('display order drift');
            if(r.left!==PACKAGE_VOTE_SCHEDULE.slots["7"].display_left_by_challenge[r.challenge.id]){
              throw new Error('left side drift');
            }
            packageVoteRemember(r.challenge.id);
          }
          if(packageVoteSelectChallenge()!==null) throw new Error('did not exhaust');

          window.location.search='?pkgv8slot=8';
          if(packageVoteAssignedSlot()!==null) throw new Error('slot reassignment accepted');
          if(!packageVoteSlotConflict()) throw new Error('slot conflict not recorded');

          console.log('PASS V8 exact slot-bound 40-challenge browser schedule');
          JS

          node "${RUNNER_TEMP}/v8_vote_browser_test.js"

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/market/ktc_pipeline.py --selftest
          python3 scripts/validation/check_package_adjustment_live.py

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
          restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
          trap restore_tu EXIT
          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/repo_regression_checks.py
          restore_tu
          trap - EXIT
          git diff --exit-code -- "$TU_JSON" "$TU_MD"

      - name: Commit V8 development voting activation
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            scripts/market/ktc_pipeline.py \
            scripts/validation/repo_regression_checks.py \
            research/package-adjustment-v8/development_voting_activation_manifest_v1.json \
            research/package-adjustment-v8/development_voting_activation_v1.md \
            research/package-adjustment-v8/development_voting_slot_links_v1.md

          git diff --cached --quiet && {
            echo "ERROR: no V8 activation changes staged"
            exit 1
          }
          git commit -m "Activate Package Adjustment V8 development voting"

          git fetch origin main

          critical=(
            research/package-adjustment-v8/package_vote_challenges_v8_development_v1.json
            research/package-adjustment-v8/development_catalog_v1.json
            research/package-adjustment-v8/development_catalog_audit_v1.json
            research/package-adjustment-v8/development_catalog_manifest_v1.json
            research/package-adjustment-v8/catalog_selection_certificate_v1.json
            research/package-adjustment-v8/evaluate_development_v1.py
            research/package-adjustment-v8/evaluation_protocol_v1.json
            research/package-adjustment-v8/evaluation_fold_assignment_v1.json
            research/package-adjustment-v8/evaluation_harness_selftest_v1.json
            research/package-adjustment-v8/evaluation_engine_manifest_v1.json
            research/package-adjustment-v8/player_status_audit_v1.json
            research/package-adjustment-v8/voting_randomization_schedule_v1.json
            research/package-adjustment-v8/voting_integrity_contract_v1.json
            research/package-adjustment-v8/validate_voting_dataset_v1.py
            research/package-adjustment-v8/pre_vote_operational_hardening_manifest_v1.json
            scripts/validation/check_package_adjustment_live.py
          )
          for p in "${critical[@]}"; do
            test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
              echo "ERROR: frozen V8 input changed during activation: $p"
              exit 1
            }
          done

          for p in index.html scripts/market/ktc_pipeline.py scripts/validation/repo_regression_checks.py; do
            test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
              echo "ERROR: concurrent writer changed activation surface: $p"
              exit 1
            }
          done

          git rebase origin/main

          node "${RUNNER_TEMP}/v8_vote_browser_test.js"
          python3 scripts/market/ktc_pipeline.py --selftest
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          git push origin HEAD:main
