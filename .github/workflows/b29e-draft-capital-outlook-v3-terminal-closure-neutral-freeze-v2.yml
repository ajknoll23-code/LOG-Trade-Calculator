name: B29E Draft Capital Outlook V3 - Terminal Closure Only - Neutral 1.00 Freeze V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b29e-draft-capital-outlook-v3-terminal-closure
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CLOSURE_DIR: research/draft-capital-outlook-v3/b29e-closure

jobs:
  terminal-closure:
    name: Freeze V1-V3 terminal lineage and neutral 1.00 conclusion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up frozen Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Freeze closure contract before reading lineage manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dco-v3-terminal-closure
          mkdir -p /tmp/dco-v3-terminal-closure
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = {
              "schema_version": 1,
              "study_family": "draft-capital-outlook",
              "stage": "b29e_terminal_closure_only",
              "purpose": "administrative_scientific_closure_only",
              "b29e_is_rescue_or_completion_cycle": False,
              "scientific_semantics_change_authorized": False,
              "additional_source_search_authorized": False,
              "additional_b29_completion_cycle_authorized": False,
              "b30_2027_source_feasibility_authorized": False,
              "2027_candidate_enumeration_authorized": False,
              "2027_class_scoring_authorized": False,
              "player_identity_open_authorized": False,
              "predictor_construction_authorized": False,
              "historical_actual_capital_open_authorized": False,
              "predictor_target_association_authorized": False,
              "production_change_authorized": False,
              "terminal_multiplier": 1.0,
              "terminal_decision": "CLOSE_DRAFT_CAPITAL_OUTLOOK_V1_V2_V3_KEEP_NEUTRAL_1_00_NO_PRODUCTION_CHANGE",
              "required_lineage": {
                  "v1_b21": {
                      "path": "research/draft-capital-outlook-v1/b21/b21_manifest.json",
                      "git_blob": "664969da9598afce88b490b751a8a879e1ea4ed1",
                      "decision": "PASS_LAYER_D_HISTORICAL_CALIBRATION_AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY"
                  },
                  "v1_b23": {
                      "path": "research/draft-capital-outlook-v1/b23/b23_manifest.json",
                      "git_blob": "12a5333b5353f1e4a42c42ac6defd7d68b9339ad",
                      "decision": "STOP_2027_DRAFT_CAPITAL_OUTLOOK_SOURCE_PATH_KEEP_NEUTRAL_1_00"
                  },
                  "v2_b24": {
                      "path": "research/draft-capital-outlook-v2/b24/b24_manifest.json",
                      "git_blob": "50ae72e8393b9ed910be1a79df9f4e7ad9cf71e4",
                      "decision": "STOP_EXACT_WALTER_PATH_AUTHORIZE_V2_PHASE0B_ENSEMBLE_K60_SOURCE_AUDIT"
                  },
                  "v2_b25": {
                      "path": "research/draft-capital-outlook-v2/b25/b25_manifest.json",
                      "git_blob": "d9462d0cd5a93d0d9b143a67ce9da8dc88cd7ff0",
                      "decision": "STOP_V2_ENSEMBLE_SOURCE_PATH_KEEP_NEUTRAL_NO_ARCHITECTURE"
                  },
                  "v2_b26": {
                      "path": "research/draft-capital-outlook-v2/b26/b26_manifest.json",
                      "git_blob": "48e6be26eb0f502b28605aabab02889266a846d2",
                      "decision": "CLOSE_V2_PERMANENTLY_KEEP_NEUTRAL_1_00_AUTHORIZE_V3_PREREGISTRATION_ONLY"
                  },
                  "v3_b27": {
                      "path": "research/draft-capital-outlook-v3/b27/b27_manifest.json",
                      "git_blob": "9de47e7cf852d30438e893df1fb01a715080a0d8",
                      "decision": "FREEZE_V3_METHODS_AUTHORIZE_B28_INSTRUMENT_VALIDATION_ONLY"
                  },
                  "v3_b28": {
                      "path": "research/draft-capital-outlook-v3/b28/b28_manifest.json",
                      "git_blob": "a8fef063973f9da19feb150ae8063efe9b16f166",
                      "decision": "PASS_B28_INSTRUMENT_VALIDATION_AUTHORIZE_B29_HISTORICAL_SOURCE_AUDIT"
                  },
                  "v3_b29": {
                      "path": "research/draft-capital-outlook-v3/b29/b29_manifest.json",
                      "git_blob": "2ecd9fc1d6c0a12173969c14bc43640878df4db8",
                      "decision": "INCONCLUSIVE_B29_HISTORICAL_ENUMERATION_REQUIRES_TRANSPORT_OR_TEMPLATE_COMPLETION"
                  },
                  "v3_b29c": {
                      "path": "research/draft-capital-outlook-v3/b29c/b29c_manifest.json",
                      "git_blob": "5e6bb9a4da88370a2096a8b659a60cd6183ca2cc",
                      "decision": "PASS_B29C_GAP_CLASSIFICATION_ONLY_NO_SCIENCE_DECISION"
                  },
                  "v3_b29d_manifest": {
                      "path": "research/draft-capital-outlook-v3/b29d/b29d_manifest.json",
                      "git_blob": "45fe4ad56a78cd7e125726a8f80694671e0a4385",
                      "decision": "STOP_V3_B29D_SOURCE_INSTRUMENT_INFEASIBLE_KEEP_NEUTRAL_1_00"
                  },
                  "v3_b29d_result": {
                      "path": "research/draft-capital-outlook-v3/b29d/b29d_result.json",
                      "git_blob": "c3414013ad9793f2c7570971c1bb26b82470f661",
                      "decision": "STOP_V3_B29D_SOURCE_INSTRUMENT_INFEASIBLE_KEEP_NEUTRAL_1_00"
                  }
              }
          }

          p = Path("/tmp/dco-v3-terminal-closure/b29e_closure_contract.json")
          p.write_text(json.dumps(contract, indent=2, sort_keys=True) + "\n")
          print(json.dumps(contract, indent=2, sort_keys=True))
          PY

      - name: Validate frozen V1-V3 lineage and build terminal closure artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          contract_path = Path("/tmp/dco-v3-terminal-closure/b29e_closure_contract.json")
          contract = json.loads(contract_path.read_text())
          closure = Path(os.environ["CLOSURE_DIR"])

          def load(path):
              p = Path(path)
              assert p.is_file(), f"missing required lineage file: {p}"
              return json.loads(p.read_text())

          def git_blob(path):
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          # Fail closed on source drift. These are Git blob identities of the exact
          # source manifests/results reviewed before this documentation-only closeout.
          lineage = {}
          for key, spec in contract["required_lineage"].items():
              actual_blob = git_blob(spec["path"])
              assert actual_blob == spec["git_blob"], (
                  f"lineage drift for {key}: expected {spec['git_blob']} got {actual_blob}"
              )
              obj = load(spec["path"])
              assert obj["decision"] == spec["decision"], (
                  f"decision drift for {key}: {obj.get('decision')}"
              )
              lineage[key] = {
                  "path": spec["path"],
                  "git_blob": actual_blob,
                  "sha256": sha256(spec["path"]),
                  "decision": obj["decision"]
              }

          b21 = load(contract["required_lineage"]["v1_b21"]["path"])
          b23 = load(contract["required_lineage"]["v1_b23"]["path"])
          b24 = load(contract["required_lineage"]["v2_b24"]["path"])
          b25 = load(contract["required_lineage"]["v2_b25"]["path"])
          b26 = load(contract["required_lineage"]["v2_b26"]["path"])
          b27 = load(contract["required_lineage"]["v3_b27"]["path"])
          b28 = load(contract["required_lineage"]["v3_b28"]["path"])
          b29 = load(contract["required_lineage"]["v3_b29"]["path"])
          b29c = load(contract["required_lineage"]["v3_b29c"]["path"])
          b29d = load(contract["required_lineage"]["v3_b29d_manifest"]["path"])
          b29dr = load(contract["required_lineage"]["v3_b29d_result"]["path"])

          # V1: historical calibration was exploratory/research-only and did not
          # authorize production. The 2027 source path then terminated with zero
          # feasible sources and the neutral path retained.
          assert b21["joint_pass"] is True
          assert b21["direct_production_authority"] is False
          assert b21["production_change_authorized"] is False
          assert b21["2027_source_content_read"] is False
          assert b21["2027_class_scored"] is False
          assert b23["feasible_source_count"] == 0
          assert b23["selected_source_id"] is None
          assert b23["2027_capital_scalar_computed"] is False
          assert b23["2027_class_scored"] is False
          assert b23["2027_shadow_multiplier_computed"] is False
          assert b23["production_change_authorized"] is False

          # V2: same-source Walter K60/K32 path failed feasibility; the frozen
          # five-source ensemble had only 2/5 structurally feasible sources; V2
          # then closed permanently at neutral 1.00 without architecture/model fit.
          assert b24["same_source_k60_feasible"] is False
          assert b24["same_source_k32_fallback_available"] is False
          assert b24["architecture_freeze_authorized"] is False
          assert b24["v2_predictor_target_association_authorized"] is False
          assert b24["production_change_authorized"] is False
          assert b25["frozen_source_count"] == 5
          assert b25["distinct_publisher_count"] == 5
          assert b25["structurally_feasible_source_count"] == 2
          assert b25["all_five_sources_structurally_feasible"] is False
          assert b25["b26_phase0c_architecture_freeze_authorized"] is False
          assert b25["predictor_construction_authorized"] is False
          assert b25["v2_predictor_target_association_authorized"] is False
          assert b25["production_change_authorized"] is False
          assert b26["v2_closed_permanently"] is True
          assert b26["draft_capital_outlook_multiplier"] == 1.0
          assert b26["v2_architecture_freeze_authorized"] is False
          assert b26["v2_predictor_construction_authorized"] is False
          assert b26["v2_predictor_target_association_authorized"] is False
          assert b26["v2_production_change_authorized"] is False
          assert b26["v3_preregistration_authorized"] is True
          assert b26["v3_new_source_discovery_authorized_before_preregistration"] is False

          # V3: methods were frozen first, the extraction instrument passed its
          # synthetic/fixture validation, and only historical source feasibility
          # was authorized. Outcomes, identities, associations, and production
          # remained closed throughout.
          assert b27["candidate_K"] == [60, 32]
          assert b27["candidate_N"] == [5, 4, 3]
          assert b27["minimum_historical_classes_required"] == 10
          assert b27["draft_capital_outlook_multiplier"] == 1.0
          assert b27["b28_instrument_validation_authorized"] is True
          assert b27["b29_historical_source_audit_authorized"] is False
          assert b27["historical_actual_capital_open_authorized"] is False
          assert b27["predictor_target_association_authorized"] is False
          assert b27["production_change_authorized"] is False

          assert b28["instrument_validation_pass"] is True
          assert b28["K60_sensitivity"] == 1.0
          assert b28["K60_specificity"] == 1.0
          assert b28["K32_sensitivity"] == 1.0
          assert b28["K32_specificity"] == 1.0
          assert b28["fixture_count"] == 30
          assert b28["b29_historical_source_audit_authorized"] is True
          assert b28["2027_candidate_enumeration_authorized"] is False
          assert b28["historical_actual_capital_open_authorized"] is False
          assert b28["predictor_target_association_authorized"] is False
          assert b28["production_change_authorized"] is False

          # Initial B29 remained inconclusive after exact recovery of all 448
          # evaluation buckets; B29C could classify gaps only and authorized only
          # a completion-repair design, not a science decision or B30.
          assert b29["total_eval_buckets"] == 448
          assert b29["completed_eval_buckets_reused"] == 445
          assert b29["eval_buckets_recovered"] == 3
          assert b29["b29_completion_only_followup_authorized"] is True
          assert b29["selected_K"] is None
          assert b29["selected_N"] is None
          assert b29["b30_2027_source_feasibility_authorized"] is False
          assert b29["historical_actual_capital_open_authorized"] is False
          assert b29["predictor_target_association_authorized"] is False
          assert b29["production_change_authorized"] is False
          assert b29c["completion_repair_design_authorized"] is True
          assert b29c["scientific_semantics_changed"] is False
          assert b29c["b30_2027_source_feasibility_authorized"] is False
          assert b29c["2027_candidate_enumeration_authorized"] is False
          assert b29c["historical_actual_capital_open_authorized"] is False
          assert b29c["predictor_target_association_authorized"] is False
          assert b29c["production_change_authorized"] is False

          # B29D exhausted the single preregistered 4x completion cycle and is the
          # terminal V3 source-feasibility result. No post-hoc K/N, B30, outcome,
          # association, or production path is authorized.
          assert b29d["b29d_executed"] is True
          assert b29d["b29d_execution_count_committed"] == 1
          assert b29d["completion_cycle"] == 1
          assert b29d["maximum_completion_cycles"] == 1
          assert b29d["completion_expansion_factor"] == 4
          assert b29d["scientific_semantics_changed"] is False
          assert b29d["additional_b29_completion_authorized"] is False
          assert b29d["selected_K"] is None
          assert b29d["selected_N"] is None
          assert b29d["v3_stopped"] is True
          assert b29d["b30_2027_source_feasibility_authorized"] is False
          assert b29d["2027_candidate_enumeration_authorized"] is False
          assert b29d["2027_class_scoring_authorized"] is False
          assert b29d["player_identity_open_authorized"] is False
          assert b29d["predictor_construction_authorized"] is False
          assert b29d["historical_actual_capital_open_authorized"] is False
          assert b29d["predictor_target_association_authorized"] is False
          assert b29d["production_change_authorized"] is False
          assert b29d["draft_capital_outlook_multiplier"] == 1.0

          assert b29dr["minimum_historical_classes_required"] == 10
          assert b29dr["completion_cycle"] == 1
          assert b29dr["maximum_completion_cycles"] == 1
          assert b29dr["additional_completion_cycle_authorized"] is False
          assert b29dr["selected_K"] is None
          assert b29dr["selected_N"] is None
          assert b29dr["K_status"]["60"]["status"] == "UNRESOLVED_AFTER_FINAL_COMPLETION"
          assert b29dr["K_status"]["60"]["confirmed_classes"] == []
          assert b29dr["N_status"] == {}
          assert b29dr["2027_candidate_enumerated"] is False
          assert b29dr["historical_actual_capital_opened"] is False
          assert b29dr["predictor_target_association_computed"] is False
          assert b29dr["production_change_authorized"] is False
          assert b29dr["draft_capital_outlook_multiplier"] == 1.0

          # Cross-check B29D's own content hashes before creating closure.
          b29d_contract_path = Path("research/draft-capital-outlook-v3/b29d/b29d_completion_contract.json")
          b29d_result_path = Path("research/draft-capital-outlook-v3/b29d/b29d_result.json")
          assert sha256(b29d_contract_path) == b29d["output_hashes"]["b29d_completion_contract.json"]
          assert sha256(b29d_result_path) == b29d["output_hashes"]["b29d_result.json"]

          if closure.exists():
              # Idempotent rerun support after a successful prior commit: never
              # overwrite or increment the scientific closure. Verify and exit.
              existing = load(closure / "b29e_manifest.json")
              assert existing["decision"] == contract["terminal_decision"]
              assert existing["b29e_execution_count_committed"] == 1
              assert existing["draft_capital_outlook_multiplier"] == 1.0
              assert existing["production_change_authorized"] is False
              print("B29E terminal closure already committed exactly once; verified idempotently.")
              with open(os.environ["GITHUB_ENV"], "a") as envf:
                  envf.write("B29E_ALREADY_CLOSED=true\n")
              raise SystemExit(0)

          closure.mkdir(parents=True)
          (closure / "b29e_closure_contract.json").write_bytes(contract_path.read_bytes())

          snapshot = {
              "schema_version": 1,
              "stage": "b29e_lineage_snapshot",
              "study_family": "draft-capital-outlook",
              "lineage": lineage,
              "v1": {
                  "historical_calibration_joint_pass": True,
                  "historical_calibration_production_authority": False,
                  "terminal_source_decision": b23["decision"],
                  "terminal_feasible_source_count": b23["feasible_source_count"]
              },
              "v2": {
                  "same_source_k60_feasible": b24["same_source_k60_feasible"],
                  "same_source_k32_fallback_available": b24["same_source_k32_fallback_available"],
                  "ensemble_frozen_source_count": b25["frozen_source_count"],
                  "ensemble_structurally_feasible_source_count": b25["structurally_feasible_source_count"],
                  "closed_permanently": b26["v2_closed_permanently"],
                  "terminal_multiplier": b26["draft_capital_outlook_multiplier"]
              },
              "v3": {
                  "frozen_candidate_K": b27["candidate_K"],
                  "frozen_candidate_N": b27["candidate_N"],
                  "minimum_historical_classes_required": b27["minimum_historical_classes_required"],
                  "instrument_validation_pass": b28["instrument_validation_pass"],
                  "initial_b29_total_eval_buckets": b29["total_eval_buckets"],
                  "b29c_science_decision": False,
                  "b29d_completion_cycle": b29d["completion_cycle"],
                  "b29d_maximum_completion_cycles": b29d["maximum_completion_cycles"],
                  "b29d_completion_expansion_factor": b29d["completion_expansion_factor"],
                  "b29d_selected_K": b29d["selected_K"],
                  "b29d_selected_N": b29d["selected_N"],
                  "b29d_decision": b29d["decision"],
                  "b30_authorized": b29d["b30_2027_source_feasibility_authorized"]
              }
          }
          snapshot_path = closure / "b29e_lineage_snapshot.json"
          snapshot_path.write_text(json.dumps(snapshot, indent=2, sort_keys=True) + "\n")

          manifest = {
              "schema_version": 1,
              "study_family": "draft-capital-outlook",
              "stage": "b29e_terminal_closure_manifest",
              "decision": contract["terminal_decision"],
              "b29e_executed": True,
              "b29e_execution_count_committed": 1,
              "b29e_is_rescue_or_completion_cycle": False,
              "v1_closed_at_neutral": True,
              "v2_closed_permanently_at_neutral": True,
              "v3_stopped_terminally_at_b29d": True,
              "draft_capital_outlook_multiplier": 1.0,
              "scientific_semantics_changed": False,
              "additional_source_search_authorized": False,
              "additional_b29_completion_cycle_authorized": False,
              "b30_2027_source_feasibility_authorized": False,
              "2027_candidate_enumeration_authorized": False,
              "2027_class_scoring_authorized": False,
              "player_identity_open_authorized": False,
              "predictor_construction_authorized": False,
              "historical_actual_capital_open_authorized": False,
              "predictor_target_association_authorized": False,
              "production_change_authorized": False,
              "future_work_authorized_by_this_closure": False,
              "source_terminal_decision": b29d["decision"],
              "selected_K": None,
              "selected_N": None,
              "output_hashes": {}
          }

          manifest_path = closure / "b29e_manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")

          report = [
              "# Draft Capital Outlook — V1 to V3 Terminal Closure",
              "",
              f"Decision: **{contract['terminal_decision']}**",
              "",
              "## Final scientific state",
              "",
              "- Draft Capital Outlook multiplier: **1.00 (neutral)**",
              "- Production change authorized: **NO**",
              "- B30 / 2027 source feasibility authorized: **NO**",
              "- Additional B29 completion cycles authorized: **NO**",
              "- Historical actual draft-capital outcomes opened in V3: **NO**",
              "- Predictor-target association computed in V3: **NO**",
              "- 2027 class scored in V3: **NO**",
              "- B29E is documentation/closure only; it is **not** a rescue or completion cycle.",
              "",
              "## V1",
              "",
              "B21's historical calibration passed its then-frozen Layer D gates, but explicitly had no direct production authority and did not read or score 2027. The subsequent V1 2027 source-feasibility path ended at B23 with zero feasible sources, no selected source, no 2027 scalar/shadow multiplier, and no production authorization. V1 therefore retained the neutral 1.00 path.",
              "",
              "## V2",
              "",
              "V2 moved source feasibility ahead of architecture/association work. B24 found the exact same-source Walter K60 path infeasible and no same-source K32 fallback. B25's frozen five-publisher ensemble found only 2 of 5 sources structurally feasible, so architecture freeze, predictor construction, player identity, 2027 scoring, predictor-target association, and production remained unauthorized. B26 permanently closed V2 at multiplier 1.00 and authorized only a separately preregistered V3.",
              "",
              "## V3",
              "",
              "B27 froze the V3 methods before historical source evaluation: K candidates 60 then 32, N candidates 5/4/3, and at least 10 historical classes required. B28 validated the frozen extraction instrument on 30 fixtures with sensitivity and specificity of 1.00 for both K60 and K32, authorizing historical source audit only.",
              "",
              "B29's recovered execution remained inconclusive after all 448 evaluation buckets were accounted for (445 reused + 3 recovered), authorizing only completion work. B29C classified the remaining gaps without making a science decision and authorized only a completion-repair design.",
              "",
              "B29D then used the single preregistered final completion cycle with a uniform 4x operational expansion. It still could not support a K/N instrument under the frozen rule: selected K = NONE, selected N = NONE, and K60 remained unresolved after final completion. The terminal B29D decision was STOP_V3_B29D_SOURCE_INSTRUMENT_INFEASIBLE_KEEP_NEUTRAL_1_00.",
              "",
              "## Closure rule",
              "",
              "This closeout does not alter any scientific threshold, source, instrument, K/N candidate, historical result, or production value. It does not authorize a B29 rescue, B30, outcome opening, predictor fit, association test, 2027 score, or multiplier change. Any future Draft Capital Outlook investigation would require a separately authorized and preregistered new study/version; nothing further is authorized by this closure.",
              ""
          ]
          report_path = closure / "b29e_report.md"
          report_path.write_text("\n".join(report))

          # Finalize manifest hashes after the other outputs exist. Do not hash the
          # manifest into itself; hashes cover contract, snapshot, and report.
          manifest["output_hashes"] = {
              "b29e_closure_contract.json": sha256(closure / "b29e_closure_contract.json"),
              "b29e_lineage_snapshot.json": sha256(snapshot_path),
              "b29e_report.md": sha256(report_path)
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")

          hash_targets = [
              closure / "b29e_closure_contract.json",
              snapshot_path,
              manifest_path,
              report_path
          ]
          (closure / "b29e_hashes.sha256").write_text(
              "".join(f"{sha256(p)}  {p.name}\n" for p in hash_targets)
          )

          with open(os.environ["GITHUB_ENV"], "a") as envf:
              envf.write("B29E_ALREADY_CLOSED=false\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Verify terminal closure invariants and hashes
        if: ${{ env.B29E_ALREADY_CLOSED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CLOSURE_DIR"])
          contract = json.loads((root / "b29e_closure_contract.json").read_text())
          manifest = json.loads((root / "b29e_manifest.json").read_text())
          snapshot = json.loads((root / "b29e_lineage_snapshot.json").read_text())

          assert contract["b29e_is_rescue_or_completion_cycle"] is False
          assert contract["additional_b29_completion_cycle_authorized"] is False
          assert contract["terminal_multiplier"] == 1.0
          assert contract["production_change_authorized"] is False

          assert manifest["decision"] == contract["terminal_decision"]
          assert manifest["b29e_execution_count_committed"] == 1
          assert manifest["b29e_is_rescue_or_completion_cycle"] is False
          assert manifest["draft_capital_outlook_multiplier"] == 1.0
          assert manifest["v1_closed_at_neutral"] is True
          assert manifest["v2_closed_permanently_at_neutral"] is True
          assert manifest["v3_stopped_terminally_at_b29d"] is True
          assert manifest["selected_K"] is None
          assert manifest["selected_N"] is None

          for key in (
              "scientific_semantics_changed",
              "additional_source_search_authorized",
              "additional_b29_completion_cycle_authorized",
              "b30_2027_source_feasibility_authorized",
              "2027_candidate_enumeration_authorized",
              "2027_class_scoring_authorized",
              "player_identity_open_authorized",
              "predictor_construction_authorized",
              "historical_actual_capital_open_authorized",
              "predictor_target_association_authorized",
              "production_change_authorized",
              "future_work_authorized_by_this_closure"
          ):
              assert manifest[key] is False, (key, manifest[key])

          assert snapshot["v2"]["ensemble_frozen_source_count"] == 5
          assert snapshot["v2"]["ensemble_structurally_feasible_source_count"] == 2
          assert snapshot["v3"]["frozen_candidate_K"] == [60, 32]
          assert snapshot["v3"]["frozen_candidate_N"] == [5, 4, 3]
          assert snapshot["v3"]["minimum_historical_classes_required"] == 10
          assert snapshot["v3"]["b29d_completion_cycle"] == 1
          assert snapshot["v3"]["b29d_maximum_completion_cycles"] == 1
          assert snapshot["v3"]["b29d_completion_expansion_factor"] == 4
          assert snapshot["v3"]["b29d_selected_K"] is None
          assert snapshot["v3"]["b29d_selected_N"] is None
          assert snapshot["v3"]["b30_authorized"] is False

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          for line in (root / "b29e_hashes.sha256").read_text().splitlines():
              expected, name = line.split("  ", 1)
              assert sha(root / name) == expected, name

          assert sha(root / "b29e_closure_contract.json") == manifest["output_hashes"]["b29e_closure_contract.json"]
          assert sha(root / "b29e_lineage_snapshot.json") == manifest["output_hashes"]["b29e_lineage_snapshot.json"]
          assert sha(root / "b29e_report.md") == manifest["output_hashes"]["b29e_report.md"]
          print("PASS: B29E terminal closure is internally consistent and neutral at 1.00.")
          PY

      - name: Run repository regression while preserving closure artifacts
        if: ${{ env.B29E_ALREADY_CLOSED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$CLOSURE_DIR"
          P="$(mktemp -d)"
          A="$P/b29e-closure.tar"
          tar -C "$ROOT" -cf "$A" .
          restore() {
            rm -rf "$ROOT"
            mkdir -p "$ROOT"
            tar -C "$ROOT" -xf "$A"
            rm -rf "$P"
          }
          trap restore EXIT
          python3 scripts/validation/repo_regression_checks.py
          restore
          trap - EXIT

      - name: Commit terminal closure artifacts exactly once
        if: ${{ env.B29E_ALREADY_CLOSED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CLOSURE_DIR"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No B29E closure changes to commit."
            exit 1
          fi
          git commit -m "B29E close Draft Capital Outlook V1-V3 at neutral 1.00"
          git pull --rebase origin main

          # Revalidate immutable lineage identities after rebasing onto the newest
          # main so concurrent unrelated commits cannot silently alter our basis.
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          c=json.loads(Path("research/draft-capital-outlook-v3/b29e-closure/b29e_closure_contract.json").read_text())
          for key,spec in c["required_lineage"].items():
              actual=subprocess.check_output(["git","hash-object",spec["path"]],text=True).strip()
              assert actual==spec["git_blob"], f"post-rebase lineage drift: {key}"
          print("PASS: post-rebase lineage identities unchanged.")
          PY

          git push origin HEAD:main

      - name: Final clean-state and terminal-state confirmation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["CLOSURE_DIR"])/"b29e_manifest.json"
          m=json.loads(p.read_text())
          assert m["decision"]=="CLOSE_DRAFT_CAPITAL_OUTLOOK_V1_V2_V3_KEEP_NEUTRAL_1_00_NO_PRODUCTION_CHANGE"
          assert m["draft_capital_outlook_multiplier"]==1.0
          assert m["production_change_authorized"] is False
          assert m["b30_2027_source_feasibility_authorized"] is False
          assert m["additional_b29_completion_cycle_authorized"] is False
          print("B29E terminal closure complete: V1-V3 closed at neutral 1.00; no production change authorized.")
          PY
