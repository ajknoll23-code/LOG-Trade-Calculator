# QF10 V9: staged uncertainty-only refresh; frozen market and actual FV never updated.
# PRE-FLIGHT DEFAULT. Promotion requires independent later owner-confirmed dispatch.
name: QF10 V9 - Uncertainty-Only Independent Preflight and Owner Promotion
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: preflight = read-only; promote = owner-confirmed two-file push after re-running QA
        type: choice
        required: true
        default: preflight
        options:
        - preflight
        - promote
      confirmation:
        description: 'For promote only enter exact: PROMOTE_QF10_A6_UNCERTAINTY_TWO_FILES_TO_MAIN'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF10_REVIEW_BRANCH: qf10-a6-uncertainty-v8-review-2026-10-11
  QF10_REVIEW_SHA: 09dea229ce87f83551ffe93a0cc00eaf691def29
  QF10_REVIEW_PARENT: 9b281e52b79b5dbaa5d632675a8689c51e8363b4
  QF10_MODE: ${{ inputs.mode }}
  QF10_CONFIRMATION: ${{ inputs.confirmation }}
jobs:
  preflight:
    name: Independently validate immutable review files and runtime display with 14 regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout exact main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Independently validate review SHA, parent, exact 2-file scope and all protected blobs
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'STOP non-main dispatch'; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP main checkout mismatch'; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
        git fetch --no-tags origin '+refs/heads/qf10-a6-uncertainty-v8-review-2026-10-11:refs/remotes/origin/qf10-a6-uncertainty-v8-review-2026-10-11' '+refs/heads/main:refs/remotes/origin/main'
        [[ "$(git rev-parse origin/qf10-a6-uncertainty-v8-review-2026-10-11)" == "$QF10_REVIEW_SHA" ]] || { echo 'STOP review branch moved'; exit 1; }
        [[ "$(git show -s --format=%P "$QF10_REVIEW_SHA")" == "$QF10_REVIEW_PARENT" ]] || { echo 'STOP reviewed parent mismatch'; exit 1; }
        git merge-base --is-ancestor "$QF10_REVIEW_PARENT" HEAD || { echo 'STOP review parent not in main lineage'; exit 1; }
        expected=$(printf '%s\n' 'scripts/artifacts/generated/value_uncertainty.json' 'scripts/artifacts/reports/value_uncertainty_report.md')
        [[ "$(git diff --name-only "$QF10_REVIEW_PARENT" "$QF10_REVIEW_SHA")" == "$expected" ]] || { echo 'STOP review changed file scope'; exit 1; }
        [[ "$(git diff --numstat "$QF10_REVIEW_PARENT" "$QF10_REVIEW_SHA")" == $'153\t153\tscripts/artifacts/generated/value_uncertainty.json'$'\n'$'3\t3\tscripts/artifacts/reports/value_uncertainty_report.md' ]] || { echo 'STOP unexpected review diff size'; exit 1; }
        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP pinned source drift: $1"; exit 1; }; }
        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2
        pin scripts/artifacts/reports/value_uncertainty_report.md 8f0bd8c1059d23911de690a3a8f2c18c17d89194
        pin scripts/validation/build_value_uncertainty.py c70db15470704182c8790ebd24cc25c8fca6bd61
        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        [[ "$(git rev-parse "$QF10_REVIEW_SHA:scripts/artifacts/generated/value_uncertainty.json")" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || { echo 'STOP reviewed uncertainty JSON blob mismatch'; exit 1; }
        [[ "$(git rev-parse "$QF10_REVIEW_SHA:scripts/artifacts/reports/value_uncertainty_report.md")" == '76aa6b31ba632b8d4f86ca8f5e3a90d76ea00f78' ]] || { echo 'STOP reviewed report blob mismatch'; exit 1; }
        echo 'QF10_V9_PINNED_REVIEW_GREEN main dispatch and exact two-file review verified'
    - name: Stage immutable reviewed artifacts in disposable checkout, never main
      shell: bash
      run: |
        set -euo pipefail
        git show "$QF10_REVIEW_SHA:scripts/artifacts/generated/value_uncertainty.json" > scripts/artifacts/generated/value_uncertainty.json
        git show "$QF10_REVIEW_SHA:scripts/artifacts/reports/value_uncertainty_report.md" > scripts/artifacts/reports/value_uncertainty_report.md
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/reports/value_uncertainty_report.md)" == '76aa6b31ba632b8d4f86ca8f5e3a90d76ea00f78' ]] || exit 1
        expected=$(printf '%s\n' 'scripts/artifacts/generated/value_uncertainty.json' 'scripts/artifacts/reports/value_uncertainty_report.md')
        [[ "$(git diff --name-only)" == "$expected" ]] || { echo 'STOP candidate scope changed'; exit 1; }
        [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo 'STOP untracked files found'; exit 1; }
        git diff --check
        echo 'QF10_V9_EXACT_STAGING_GREEN only the two approved uncertainty blobs staged in checkout'
    - name: Independently inspect 565 player centers, 52 RB-only changes and preserved sensitivity semantics
      shell: bash
      run: |
        set -euo pipefail
        cat >/tmp/qf10-v9-data.py <<'QF10_V9_PY'
        from __future__ import annotations
        import hashlib,json, math, subprocess, sys
        from pathlib import Path
        root=Path.cwd()
        sys.path.insert(0,str(root))
        sys.path.insert(0,str(root/'scripts/validation'))
        from scripts.validation import snapshot_values
        old=json.loads(subprocess.check_output(['git','show', '9b281e52b79b5dbaa5d632675a8689c51e8363b4:scripts/artifacts/generated/value_uncertainty.json'],text=True))
        new=json.loads((root/'scripts/artifacts/generated/value_uncertainty.json').read_text())
        market=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())
        current=snapshot_values.compute_all_values(snapshot_values.load_from_html(root/'index.html'))
        assert len(new['players']) == len(old['players']) == len(current) == 565, 'STOP player universe changed'
        assert set(old['players']) == set(new['players']) == set(current), 'STOP identity changed'
        assert new['schema_version'] == old['schema_version'] == 1
        assert new['method_version'] == old['method_version'] == 'sensitivity-envelope-v1'
        assert new['range_semantics'] == old['range_semantics'] == 'sensitivity_envelope_v1_not_probability_interval'
        assert new['policy_sha256'] == old['policy_sha256']
        for k in ('counts','position_cohorts','policy'):
            assert new[k] == old[k], f'STOP uncertainty governance metadata changed {k}'
        assert set(new) == set(old), 'STOP metadata key set changed'
        assert {k for k in old if new[k] != old[k]} == {'generated_at_utc','source_file_sha256','players'}, 'STOP unreviewed top-level change'
        for k,oldhash in old['source_file_sha256'].items():
            if k != 'index_html':
                assert new['source_file_sha256'][k] == oldhash, f'STOP upstream data changed {k}'
        assert new['source_file_sha256']['index_html'] == hashlib.sha256((root/'index.html').read_bytes()).hexdigest(), 'STOP candidate derived from other HTML'
        assert new['generated_at_utc'] > old['generated_at_utc'], 'STOP date lineage reversal'
        changed=[]
        for k,row in new['players'].items():
            past=old['players'][k]
            assert set(row) == set(past), f'STOP schema keys {k}'
            assert row['pos'] == current[k]['pos'], f'STOP position mismatch {k}'
            assert row['center_value'] == current[k]['value'], f'STOP stale candidate FV center {k}'
            assert row['range_low'] <= row['center_value'] <= row['range_high'], f'STOP invalid sensitivity envelope {k}'
            assert math.isfinite(float(row['relative_half_width'])) and 0 <= row['relative_half_width'] <= 1, f'STOP invalid relative width {k}'
            if row != past:
                assert row['pos'] == 'RB', f'STOP non-RB source value change {k}'
                keys = {f for f in row if row[f] != past[f]}
                assert 'center_value' in keys and keys <= {'center_value','range_low','range_high'}, f'STOP other signal, tier or width changed {k} {keys}'
                assert abs(row['center_value']-past['center_value']) <= 20, f'STOP unexpected shift {k}'
                changed.append(k)
        assert len(changed) == 52, f'STOP expected exactly 52 RB changes, got {len(changed)}'
        rb=[k for k,x in current.items() if x['pos']=='RB']
        assert len(rb) == 97, 'STOP 97 canonical RB count drift'
        valid=lambda data,k: data['players'].get(k,{}).get('center_value')==current[k]['value']
        old_n=sum(valid(old,k) for k in current)
        new_n=sum(valid(new,k) for k in current)
        old_r=sum(valid(old,k) for k in rb)
        new_r=sum(valid(new,k) for k in rb)
        assert (old_n,new_n,old_r,new_r) == (513,565,45,97), f'STOP unexpected coverage {old_n,new_n,old_r,new_r}'
        markt=sum(market['players'].get(k,{}).get('fundamental_value') == current[k]['value'] for k in rb)
        assert markt == 33, f'STOP held market coverage unexpectedly changed {markt}'
        report=(root/'scripts/artifacts/reports/value_uncertainty_report.md').read_text()
        assert 'These ranges are not probability confidence intervals' in report, 'STOP sensitivity semantics disclosure lost'
        assert 'Method: `sensitivity-envelope-v1`' in report, 'STOP report method drift'
        Path('/tmp/qf10-v9-ui-centers.json').write_text(json.dumps({k:v['value'] for k,v in current.items()},sort_keys=True))
        print('QF10_V9_INDEPENDENT_DATA_GREEN '+json.dumps({'row_changes':len(changed),'changed_positions':['RB'],'range_widths_or_tiers_changed':False,'old_center_matches':old_n,'new_center_matches':new_n,'old_rb_matches':old_r,'new_rb_matches':new_r,'rb_market_kept_matches':markt,'frozen_market_unchanged':True},sort_keys=True))
        QF10_V9_PY
        python3 -m py_compile /tmp/qf10-v9-data.py
        python3 /tmp/qf10-v9-data.py
    - name: Exercise actual production UI lookup and range renderer for all 565 players
      shell: bash
      run: |
        set -euo pipefail
        cat >/tmp/qf10-v9-render.js <<'QF10_V9_JS'
        "use strict";
        const fs=require('node:fs');
        const vm=require('node:vm');
        const assert=require('node:assert/strict');
        const cp=require('node:child_process');
        const html=fs.readFileSync('index.html','utf8');
        const candidate=JSON.parse(fs.readFileSync('scripts/artifacts/generated/value_uncertainty.json','utf8'));
        const before=JSON.parse(cp.execFileSync('git',['show','9b281e52b79b5dbaa5d632675a8689c51e8363b4:scripts/artifacts/generated/value_uncertainty.json'],{encoding:'utf8'}));
        const centers=JSON.parse(fs.readFileSync('/tmp/qf10-v9-ui-centers.json','utf8'));
        function extract(begin,end){const i=html.indexOf(begin);assert(i>=0,`Missing ${begin}`);assert.equal(html.indexOf(begin,i+begin.length),-1,`Ambiguous ${begin}`);const j=html.indexOf(end,i+begin.length);assert(j>i,`Missing end ${end}`);return html.slice(i,j)}
        const normalize=extract('function normalizeName(s){','function titleCase(');
        const fn=extract('function valueUncertaintyForPlayer(name, centerValue){','function valueUncertaintyRangeHTML(');
        const range=extract('function valueUncertaintyRangeHTML(name, centerValue){','/* TRADE_ROBUSTNESS_V1_UI_SHADOW');
        function gate(payload){
          const ctx=vm.createContext({VALUE_UNCERTAINTY:payload,escapeHtml: (x)=>String(x).replace(/[&<>"']/g,(ch)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))});
          vm.runInContext(normalize+fn+range,ctx,{timeout:3000});
          const getter=vm.runInContext('valueUncertaintyForPlayer',ctx);
          const renderer=vm.runInContext('valueUncertaintyRangeHTML',ctx);
          let passed=0, rbpassed=0;
          for(const [key,center] of Object.entries(centers)){
            const got=getter(key,center);
            const isValid=got!==null;
            if(isValid){
              assert.equal(got.center_value,center);
              passed++;
              if(candidate.players[key].pos==='RB')rbpassed++;
              const out=renderer(key,center);
              assert(out.includes('Fund. range') && out.includes('tier-'));
            }else{
              assert.equal(renderer(key,center),'');
            }
          }
          return {passed,rbpassed};
        }
        const old=gate(before),next=gate(candidate);
        assert.equal(old.passed,513);assert.equal(old.rbpassed,45);
        assert.equal(next.passed,565);assert.equal(next.rbpassed,97);
        console.log('QF10_V9_ACTUAL_UI_RUNTIME_GREEN '+JSON.stringify({old,next,marketUnchanged:true}));
        QF10_V9_JS
        node --check /tmp/qf10-v9-render.js
        node /tmp/qf10-v9-render.js
    - name: Run all 14 regressions and frozen science guards
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/build_value_uncertainty.py --selftest
        python3 scripts/validation/snapshot_values.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo 'QF10_V9_ALL_14_REPO_REGRESSIONS_GREEN frozen FV, IDP, PA, FA, TU, voter market retained'
    - name: Final zero-write review scope proof
      shell: bash
      run: |
        set -euo pipefail
        expected=$(printf '%s\n' 'scripts/artifacts/generated/value_uncertainty.json' 'scripts/artifacts/reports/value_uncertainty_report.md')
        [[ "$(git diff --name-only)" == "$expected" ]] || { echo 'STOP unapproved source changes'; exit 1; }
        [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo 'STOP untracked files'; exit 1; }
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/reports/value_uncertainty_report.md)" == '76aa6b31ba632b8d4f86ca8f5e3a90d76ea00f78' ]] || exit 1
        [[ "$(git hash-object index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || exit 1
        git diff --check
        echo 'QF10_V9_INDEPENDENT_PREFLIGHT_GREEN two frozen-reviewed uncertainty blobs; no pushes or production mutations'
  promote:
    name: Explicit separate owner confirmation; promote exact two files only
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote' && inputs.confirmation == 'PROMOTE_QF10_A6_UNCERTAINTY_TWO_FILES_TO_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
    - name: Checkout same dispatch HEAD with non-force write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: true
    - name: Recheck main lease, unchanged review branch and exact two-file scope
      shell: bash
      run: |
        set -euo pipefail
        [[ "$QF10_MODE" == 'promote' && "$QF10_CONFIRMATION" == 'PROMOTE_QF10_A6_UNCERTAINTY_TWO_FILES_TO_MAIN' ]] || { echo 'STOP missing exact owner confirmation'; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP checkout at other head'; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
        git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/qf10-a6-uncertainty-v8-review-2026-10-11:refs/remotes/origin/qf10-a6-uncertainty-v8-review-2026-10-11'
        [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved after preflight'; exit 1; }
        [[ "$(git rev-parse origin/qf10-a6-uncertainty-v8-review-2026-10-11)" == "$QF10_REVIEW_SHA" ]] || { echo 'STOP candidate branch moved after preflight'; exit 1; }
        [[ "$(git show -s --format=%P "$QF10_REVIEW_SHA")" == "$QF10_REVIEW_PARENT" ]] || exit 1
        [[ "$(git hash-object index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == '24c9f63881cc768a18d412172f04e5a263a4abc2' ]] || { echo 'STOP base uncertainty changed'; exit 1; }
        [[ "$(git hash-object scripts/artifacts/reports/value_uncertainty_report.md)" == '8f0bd8c1059d23911de690a3a8f2c18c17d89194' ]] || exit 1
        expected=$(printf '%s\n' 'scripts/artifacts/generated/value_uncertainty.json' 'scripts/artifacts/reports/value_uncertainty_report.md')
        [[ "$(git diff --name-only "$QF10_REVIEW_PARENT" "$QF10_REVIEW_SHA")" == "$expected" ]] || { echo 'STOP review scope drift'; exit 1; }
        git show "$QF10_REVIEW_SHA:scripts/artifacts/generated/value_uncertainty.json" > scripts/artifacts/generated/value_uncertainty.json
        git show "$QF10_REVIEW_SHA:scripts/artifacts/reports/value_uncertainty_report.md" > scripts/artifacts/reports/value_uncertainty_report.md
        [[ "$(git diff --name-only)" == "$expected" ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || exit 1
        [[ "$(git hash-object scripts/artifacts/reports/value_uncertainty_report.md)" == '76aa6b31ba632b8d4f86ca8f5e3a90d76ea00f78' ]] || exit 1
        git diff --check
        echo 'QF10_V9_OWNER_PROMOTION_READY exact two approved files, protected main lease, no model files staged'
    - name: Commit only reviewed uncertainty JSON and report and non-force push main
      shell: bash
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- scripts/artifacts/generated/value_uncertainty.json scripts/artifacts/reports/value_uncertainty_report.md
        expected=$(printf '%s\n' 'scripts/artifacts/generated/value_uncertainty.json' 'scripts/artifacts/reports/value_uncertainty_report.md')
        [[ "$(git diff --cached --name-only)" == "$expected" ]] || { echo 'STOP staged other files'; exit 1; }
        git diff --cached --check
        git commit -m 'QF10 A6: refresh uncertainty envelopes for current deployed FV centers'
        [[ "$(git rev-parse HEAD:scripts/artifacts/generated/value_uncertainty.json)" == '9d007a7f053e15dcdc0f694563ca17bc47568e5f' ]] || exit 1
        [[ "$(git rev-parse HEAD:scripts/artifacts/reports/value_uncertainty_report.md)" == '76aa6b31ba632b8d4f86ca8f5e3a90d76ea00f78' ]] || exit 1
        [[ "$(git rev-parse HEAD:index.html)" == 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e' ]] || exit 1
        [[ "$(git rev-parse HEAD:scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || exit 1
        # Git push is non-force and fails rather than overwrite a competing main edit.
        git push origin HEAD:refs/heads/main
        echo "QF10_V9_PRODUCTION_PROMOTION_GREEN main=$(git rev-parse HEAD) uncertainty='9d007a7f053e15dcdc0f694563ca17bc47568e5f' report='76aa6b31ba632b8d4f86ca8f5e3a90d76ea00f78'"
        echo 'Verify Pages deployment separately; no market or Fundamental Value policy was modified.'
