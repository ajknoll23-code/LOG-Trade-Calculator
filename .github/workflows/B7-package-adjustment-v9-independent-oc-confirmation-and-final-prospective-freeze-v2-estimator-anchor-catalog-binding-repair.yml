      - name: Validate B7 decision and scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import hashlib,json
          from pathlib import Path
          D=Path('/tmp/package-adjustment-v9-b7')
          load=lambda n:json.loads((D/n).read_text())

          p=load('b7_preregistered_protocol.json')
          e=load('b7_estimator_parity.json')
          l=load('b7_lineage_audit.json')
          o=load('b7_operating_characteristics.json')
          m=load('b7_manifest.json')
          h=load('b7_output_hashes.json')

          assert p['theta_min']==m['theta_min']==0.60
          assert p['power_alternative']==m['power_alternative']==0.65
          assert p['fair_band']==m['fair_band']==0.07
          assert p['familywise_alpha']==m['familywise_alpha']==0.05
          assert p['retained_topologies']==m['v9_eligible_topologies']==['2v3','3v3','3v4','4v4']
          assert m['v1_7_only_topologies']==['2v2','2v4']
          assert m['holm_m']==4
          assert m['sample_size_per_topology']==240
          assert m['total_ballots']==960
          assert m['voters']==40
          assert m['frozen_b6_inference_preserved'] is True
          assert m['b5c_joint_nuisance_primary_preserved'] is True
          assert m['directional_voter_stress_triggered'] is False
          assert e['status']=='PASS_EXACT_B6_ESTIMATOR_PARITY'
          assert e['anchored_to_guarded_b6_source'] is True
          assert e['b6_function_name']=='cluster_lpm'
          assert l['reservoir_counts_match_b6d'] is True
          assert l['b8_bound_witness']==1
          assert len(l['b8_bound_catalog_signature_set_sha256'])==64
          assert l['witness_max_pairwise_challenge_overlap']==480
          ws=l['transient_witness_summaries']; assert len(ws)==3
          assert ws[0]['overlap_with_earlier_witnesses']==[]
          assert all(all(int(x)<=480 for x in w['overlap_with_earlier_witnesses']) for w in ws[1:])
          assert l['candidate_or_challenge_identities_written_durably'] is False
          assert p['human_catalog_generated'] is False
          assert p['human_voting_authorized'] is False
          assert p['human_outcomes_exist_or_were_read'] is False
          assert p['production_change_authorized'] is False
          assert m['human_catalog_generated'] is False
          assert m['human_voting_authorized'] is False
          assert m['human_outcomes_exist_or_were_read'] is False
          assert m['production_change_authorized'] is False

          allowed={
            'PASS_B7_OC_CONFIRMATION_AUTHORIZE_B8_CATALOG_FREEZE',
            'STOP_B7_PRIMARY_POWER_AND_SAFETY_GATES_FAIL',
            'STOP_B7_PRIMARY_POWER_GATE_FAILS',
            'STOP_B7_HARMFUL_ACTIVATION_SAFETY_GATE_FAILS',
          }
          assert m['decision'] in allowed
          if m['decision']=='PASS_B7_OC_CONFIRMATION_AUTHORIZE_B8_CATALOG_FREEZE':
            assert m['primary_power_gate_passed'] is True
            assert m['safety_gate_passed'] is True
            assert m['b8_catalog_freeze_authorized'] is True
          else:
            assert m['b8_catalog_freeze_authorized'] is False

          for n,s in h.items():
            actual=hashlib.sha256((D/n).read_bytes()).hexdigest()
            assert actual==s,(n,actual,s)
          print('PASS: B7 decision contract, hashes, no-outcomes firewall, and B8 authorization semantics validated.')
          PY3

      - name: Preserve B7 outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b7-v2-independent-oc-confirmation
          path: /tmp/package-adjustment-v9-b7/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit durable B7 record
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze"
          test ! -e "$DEST" || { echo "ERROR: B7 durable directory already exists in checkout."; exit 1; }

          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b7/b7_preregistered_protocol.json "$DEST/"
          cp /tmp/package-adjustment-v9-b7/b7_estimator_parity.json "$DEST/"
          cp /tmp/package-adjustment-v9-b7/b7_lineage_audit.json "$DEST/"
          cp /tmp/package-adjustment-v9-b7/b7_operating_characteristics.json "$DEST/"
          cp /tmp/package-adjustment-v9-b7/b7_manifest.json "$DEST/"
          cp /tmp/package-adjustment-v9-b7/b7_report.md "$DEST/"
          cp /tmp/package-adjustment-v9-b7/b7_output_hashes.json "$DEST/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Record Package Adjustment V9 B7 V2 independent OC confirmation"

          for attempt in 1 2 3; do
            git fetch origin main
            if git cat-file -e "origin/main:$DEST/b7_manifest.json" 2>/dev/null; then
              echo "ERROR: B7 durable directory appeared on main during this run; refusing to overwrite one-shot result."
              exit 1
            fi
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ERROR: push failed after 3 attempts; B7 outputs remain preserved in the artifact."
          exit 1

      - name: Final status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY4'
          import json
