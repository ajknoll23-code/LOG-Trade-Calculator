name: B7 Package Adjustment V9 - Independent OC Confirmation and Final Prospective Freeze V2 Estimator Anchor Catalog Binding Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b7-independent-oc-confirmation
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B7_ANALYSIS_VERSION: "package-adjustment-v9-b7-independent-oc-confirmation-final-freeze-v2-estimator-anchor-catalog-binding-repair"

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned confirmation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" \
            "scipy==1.16.2"

      - name: Guard exact B6 B6D B5C lineage and one-shot status
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          DEST="research/package-adjustment-v9/b7-independent-oc-confirmation-final-freeze"
          test ! -e "$DEST" || {
            echo "ERROR: B7 durable output directory already exists; B7 is one-shot."
            exit 1
          }

          declare -A EXPECTED_BLOBS=(
            [".github/workflows/B6-package-adjustment-v9-topology-specific-discordance-information-limit-audit-v2-blob-guard-repair.yml"]="0cf55d4f70e4da0885a181eaf1961118edca7cdd"
            [".github/workflows/B6D-package-adjustment-v9-candidate-blind-current-source-expansion-and-scope-amendment-v3-current-fv-authority-repair.yml"]="92a631ae7ef368e3b3ff6037c84e935d5fc77430"
            [".github/workflows/B5C-package-adjustment-v9-calibration-integrity-and-coverage-diagnostics.yml"]="0a46ec12f3ae0c41e1d816a5951ba7c595ab3bdc"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_preregistered_protocol.json"]="0beffd4b2455a6e101acf3523d09955fa82eb77f"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json"]="8fb47e28595bed2b667ed8a6e29cbe9d52aaf670"
            ["research/package-adjustment-v9/b5c-calibration-diagnostics/b5c_joint_nuisance_draws.json"]="8c2422b9dd37bd84a2bfed2994d024236bd4e4a1"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen lineage drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY1'
          import hashlib,json,subprocess
          from pathlib import Path

          def load(p): return json.loads(Path(p).read_text())
          def sha256(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          D=Path('research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment')
          expected_sha={
            'b6d_current_player_fv_snapshot.json':'540e1bb3608850e69fb2244fc8a873c6d4c0b7fbb1bb733deca78d7dca97555a',
            'b6d_manifest.json':'44c1581a064175d1631ab4bb15d4c7e7c3781f1751c00b805fe80f3f462d07ac',
            'b6d_preregistered_source_scope_protocol.json':'b4dda222fb56153fcbf886f0be3799f5e5e7b46d8b374992f8faf8484f6f949a',
            'b6d_report.md':'5e2aa01c4f3d16df6f53db30c412262ede8b50ac2cd84c05770ce899d5f607c0',
            'b6d_scope_capacity_feasibility.json':'fa9755a90c753ae1f834dbbe283c671be025e4d4baa5a1770cc109850e28b9bf',
            'b6d_source_expansion_audit.json':'a7cf75c4b2aa792afe824d995c1ffa3a0956f81b02c1e4344bbe977f4420267c',
          }
          for n,s in expected_sha.items():
            actual=sha256(D/n)
            assert actual==s,(n,actual,s)

          b6=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_preregistered_protocol.json')
          b6d=load(D/'b6d_manifest.json')
          snap=load(D/'b6d_current_player_fv_snapshot.json')
          assert b6['activation_rule']['estimator']=='direct linear-probability intercept with centered left/right covariate; CR1 voter-cluster robust SE'
          assert b6['activation_rule']['null']=='theta_t <= 0.5'
          assert b6['activation_rule']['one_sided_raw_p_values'] is True
          assert b6['activation_rule']['additional_point_requirement']=='theta_hat_t >= 0.60'
          assert b6d['decision']=='PASS_FOUR_TOPOLOGY_SCOPE_AMENDMENT_DROP_2V4_240_TIER_C_RATE_FEASIBLE'
          assert b6d['b7_authorized'] is True
          assert b6d['v9_eligible_topologies']==['2v3','3v3','3v4','4v4']
          assert b6d['v1_7_only_topologies']==['2v2','2v4']
          assert b6d['human_catalog_generated'] is False
          assert b6d['human_voting_authorized'] is False
          assert b6d['human_outcomes_exist_or_were_read'] is False
          assert b6d['production_change_authorized'] is False

          # B7 uses the persisted B6D snapshot, never a refreshed FV frame.
          assert snap['status']=='FROZEN_B6D_CANDIDATE_BLIND_CURRENT_PLAYER_FV_SOURCE'
          assert snap['player_count']==528
          assert snap['draft_picks_included'] is False
          assert snap['market_values_used'] is False

          # Current comparator implementation must not have drifted since the B6D source freeze.
          for p in ('index.html','scripts/validation/snapshot_values.py'):
            expected=snap['source_files'][p]['git_blob']
            actual=subprocess.check_output(['git','hash-object',p],text=True).strip()
            assert actual==expected,(p,expected,actual)

          # Verify the B5C voter nuisance was estimated on a semantic raw/V1.7-preferred
          # direction, not on an arbitrary A/B label. Under V9/V1.7 discordance,
          # y_V9=1-y_raw and x_V9=-x_raw, preserving nuisance variances and delta_left.
          txt=Path('.github/workflows/B5C-package-adjustment-v9-calibration-integrity-and-coverage-diagnostics.yml').read_text()
          required=[
            "rawA=float(c['side_A']['raw_fv']); rawB=float(c['side_B']['raw_fv'])",
            "'human_chose_preferred':r['choice']==preferred",
            "x=np.array([1.0 if r['preferred_displayed_left'] else -1.0 for r in rows],float)",
            "y=np.array([1.0 if r['human_chose_preferred'] else 0.0 for r in rows],float)",
          ]
          for needle in required:
            assert needle in txt,needle
          print('PASS: B7 exact B6/B6D/B5C lineage, frozen source, comparator, and nuisance-direction semantics guarded.')
          PY1

      - name: Run independent high-rep B7 operating-characteristic confirmation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b7
          mkdir -p /tmp/package-adjustment-v9-b7

          cat > /tmp/package-adjustment-v9-b7/analyze_b7.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import textwrap
          from collections import Counter, defaultdict
          from itertools import combinations
          from pathlib import Path

          import numpy as np
          from numpy.polynomial.hermite import hermgauss
          from scipy.optimize import Bounds, LinearConstraint, milp
          from scipy.sparse import coo_matrix
          from scipy.special import expit
          from scipy.stats import beta as beta_dist
          from scipy.stats import binom
          from scipy.stats import t as student_t

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b7')
          VERSION=os.environ['B7_ANALYSIS_VERSION']

          B6=ROOT/'research/package-adjustment-v9/b6-discordance-information-limit'
          B5C=ROOT/'research/package-adjustment-v9/b5c-calibration-diagnostics'
          B6D=ROOT/'research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment'
          OLD_CATALOG=ROOT/'research/package-adjustment-v8/development_catalog_v1.json'

          SEED=2026100507
          TOPO=['2v3','3v3','3v4','4v4']
          COUNTS={'2v3':(2,3),'3v3':(3,3),'3v4':(3,4),'4v4':(4,4)}
          Q=2.9897594788655337
          THETA_MIN=0.60
          POWER_ALT=0.65
          FAIR=0.07
          FWER_ALPHA=0.05

          VOTERS=40
          BALLOTS_PER_VOTER=24
          BALLOTS_PER_TOPO_PER_VOTER=6
          N_PER_TOPO=240
          TOTAL_BALLOTS=960
          MC_REPS=10000
          WITNESS_COUNT=3
          MAX_WITNESS_OVERLAP=int(0.5*N_PER_TOPO*len(TOPO))
          PLAYER_STRESS_SDS=[0.25,0.50]
          TARGETS_PRIMARY=[0.45,0.50,0.55,0.60,0.625,0.65,0.70]

          MIN_PLAYER_FV=2500
          SIZE2_MIN_FV=3000
          RAW_RATIO_MIN=0.75
          SIDE_MIN_TOTAL={2:7000,3:9000,4:11500}
          SIDE_PROFILES={
            2:[(0.50,0.50),(0.60,0.40),(0.70,0.30)],
            3:[(0.34,0.33,0.33),(0.45,0.33,0.22),(0.55,0.30,0.15),(0.65,0.20,0.15)],
            4:[(0.25,0.25,0.25,0.25),(0.35,0.28,0.22,0.15),(0.45,0.25,0.18,0.12),(0.55,0.18,0.15,0.12)],
          }
          NEAREST_LIMIT=64
          PROFILE_VARIANTS=32
          PER_ANCHOR_CANDIDATES=24
          PROBE_MULTIPLIER=6
          RESERVOIR_CAP_PER_TOPOLOGY=5000
          WITNESS_TIME_LIMIT_SECONDS=900

          def load(p): return json.loads(Path(p).read_text())
          def sha256_file(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def h64(s): return int(hashlib.sha256(s.encode()).hexdigest()[:16],16)
          def canonical_side(keys): return '|'.join(sorted(keys))
          def canonical_trade(a,b): return '||'.join(sorted((canonical_side(a),canonical_side(b))))

          b6_protocol=load(B6/'b6_preregistered_protocol.json')
          b6_freeze=load(B6/'b6_candidate_and_estimand_freeze.json')
          b5c_draws=load(B5C/'b5c_joint_nuisance_draws.json')
          b6d_manifest=load(B6D/'b6d_manifest.json')
          b6d_source=load(B6D/'b6d_current_player_fv_snapshot.json')
          b6d_audit=load(B6D/'b6d_source_expansion_audit.json')
          b6d_feas=load(B6D/'b6d_scope_capacity_feasibility.json')

          assert b6d_manifest['b7_authorized'] is True
          assert b6d_manifest['v9_eligible_topologies']==TOPO
          assert b6d_manifest['v1_7_only_topologies']==['2v2','2v4']
          assert b6d_feas['results']['four_topology_drop_2v4']['240']['feasible'] is True
          assert int(b6d_feas['authorization_target_per_topology'])==N_PER_TOPO
          assert abs(float(b6_freeze['q'])-Q)<1e-15
          assert abs(float(b6_freeze['theta_min'])-THETA_MIN)<1e-15
          assert abs(float(b6_freeze['fair_band_relative_difference'])-FAIR)<1e-15
          assert abs(float(b6_freeze['familywise_harmful_activation_alpha'])-FWER_ALPHA)<1e-15

          draws=np.asarray([
            [float(d['sigma_challenge']),float(d['sigma_voter']),float(d['delta_left'])]
            for d in b5c_draws['draws']
          ],dtype=float)
          assert draws.shape==(500,3)
          assert np.all(draws[:,:2]>0)

          # ------------------------------------------------------------------
          # Freeze the B7 contract BEFORE regenerating any transient candidate
          # identities or computing any B7 operating characteristic.
          # ------------------------------------------------------------------
          protocol={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B7_INDEPENDENT_OC_CONFIRMATION_FINAL_PROSPECTIVE_FREEZE',
            'seed':SEED,
            'candidate_id':'V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q',
            'formula':'S(side)=n**(1-1/q) * (sum(v_i**q))**(1/q)',
            'q':Q,
            'theta_min':THETA_MIN,
            'theta_min_role':'minimum observed product-relevant edge / decision value; not the power alternative',
            'power_alternative':POWER_ALT,
            'power_alternative_reason':'0.65 is prospectively separated from the 0.60 decision boundary and represents about two-thirds manager preference for V9 on true discordances; it was fixed before B7 simulation and before any V9 human outcomes.',
            'fair_band':FAIR,
            'familywise_alpha':FWER_ALPHA,
            'retained_topologies':TOPO,
            'v1_7_only_topologies':['2v2','2v4'],
            'design':{
              'voters':VOTERS,
              'ballots_per_voter':BALLOTS_PER_VOTER,
              'ballots_per_topology_per_voter':BALLOTS_PER_TOPO_PER_VOTER,
              'unique_challenges_per_topology':N_PER_TOPO,
              'total_unique_ballots':TOTAL_BALLOTS,
              'votes_per_challenge':1,
              'left_right_balance':'exactly 3 V9-left and 3 V9-right within every voter x topology cell',
            },
            'frozen_inference':{
              'estimator':'direct linear-probability intercept with centered V9-left/right covariate',
              'standard_error':'CR1 voter-cluster robust',
              'cr1_small_sample_factor':'G/(G-1) * (N-1)/(N-k)',
              'reference_distribution':'Student t with G-1 voter-cluster degrees of freedom',
              'null':'theta_t <= 0.50',
              'one_sided_raw_p_values':True,
              'multiplicity':'Holm step-down across exactly m=4 retained topologies',
              'activation':'Holm rejects AND theta_hat_t >= 0.60',
              'changed_from_b6':False,
            },
            'primary_nuisance_model':{
              'source':'exact 500 B5C crossed-bootstrap joint nuisance draws',
              'components':['sigma_challenge','sigma_voter','delta_left'],
              'replicate_usage':'each draw used exactly 20 times over 10,000 replicates, with deterministic seed-shuffled order',
              'full_process_calibration':'for each draw and labeled theta, solve latent intercept so marginal P(choose V9), integrating challenge + voter effects and balanced left/right, equals labeled theta',
              'directional_voter_stress_triggered':False,
              'direction_reason':'B5C modeled choice of raw/V1.7-preferred side; on V9/V1.7 discordance, complementing outcome and side orientation preserves sigma_challenge, sigma_voter, and delta_left semantics.',
            },
            'player_dependence_stress':{
              'formal_power_gate':False,
              'formal_safety_gate':True,
              'uncalibrated_logit_sd_values':PLAYER_STRESS_SDS,
              'application':'global per-player random effect shared across topology catalogs; sign is positive for a player on V9-favored side and negative on V1.7-favored side',
              'catalogs':'three transient materially distinct Tier-C-feasible 240/topology MILP witnesses regenerated only from the persisted B6D snapshot; every later witness may overlap any earlier witness in at most 480 of 960 challenges; challenge/player identities are never durably written',
              'formal_safety_evaluation':'player-dependence safety is gated separately for every witness x player-SD combination; witness averaging cannot mask an unsafe catalog structure',
              'failure_meaning':'STOP; any remedy is a separately declared amendment',
            },
            'power_gate':{
              'scenario':'all four retained topologies have true theta=0.65 under primary B5C joint nuisance model',
              'criterion':'for every topology, one-sided 95% Clopper-Pearson lower bound on activation probability >= 0.80',
            },
            'safety_gate':{
              'null_theta':0.50,
              'alternative_theta':0.65,
              'configurations':'all 15 nonempty subsets of the four retained topologies assigned theta=0.50, with remaining topologies theta=0.65',
              'models':['B5C primary','player SD 0.25 stress','player SD 0.50 stress'],
              'criterion':'for every configuration under every model, one-sided 95% Clopper-Pearson upper bound on P(any theta=0.50 topology activates) <= 0.05',
            },
            'harmful_theta_0p45_grid':'same 15 subset configurations, descriptive only because theta=0.50 is the monotone worst case within H0',
            'boundary_theta_0p60':{
              'zero_nuisance_floor_check':'theta_hat>=0.60 frequency must lie in the exact 99.9% Monte Carlo acceptance interval around Binomial(n=240,p=.60) floor probability',
              'frozen_activation_rate':'descriptive; no 80% gate at the decision boundary',
              'nuisance_models':'descriptive',
            },
            'descriptive_curve':[0.55,0.60,0.625,0.70],
            'monte_carlo':{
              'replicates_per_model':MC_REPS,
              'activation_rate_bounds':'one-sided 95% Clopper-Pearson',
              'independent_seed_from_b6':True,
              'independent_vectorized_estimator_implementation_verified_against_exact B6 scalar code before simulation':True,
            },
            'b8_catalog_binding':{
              'rule':'B8 human catalog must regenerate transient witness 1 using this exact persisted B6D snapshot, generator, constraints, pinned SciPy/HiGHS implementation and zero objective, then match the witness-1 catalog signature-set SHA256 recorded in b7_lineage_audit.json before assignment. Any mismatch is operational RED.',
              'hash_payload':'sorted lines of topology|canonical_trade_signature joined by newline; only the SHA256 is durable, never challenge identities',
              'witnesses_2_3_role':'materially distinct robustness structures, each <=50% challenge overlap with every earlier witness',
              'max_pairwise_challenge_overlap':MAX_WITNESS_OVERLAP,
            },
            'b8_if_pass':{
              'authorized':True,
              'scope':'human catalog + voter-assignment freeze only',
              'randomization':'frozen seed; 6 challenges/topology/voter; exact 3/3 V9-left/right balance',
              'attrition':'replacement voter receives identical 24-challenge slot; partial ballots from incomplete voter excluded and recorded',
              'voting_starts_only_after_b8_freeze_committed':True,
            },
            'human_catalog_generated':False,
            'human_voting_authorized':False,
            'human_outcomes_exist_or_were_read':False,
            'v8_outcomes_used_beyond_frozen_b5c_nuisance_draws':False,
            'production_change_authorized':False,
          }
          (OUT/'b7_preregistered_protocol.json').write_text(json.dumps(protocol,indent=2,sort_keys=True)+'\n')

          # ------------------------------------------------------------------
          # Estimator parity: independent vectorized B7 implementation must
          # reproduce the exact scalar B6 CR1/t procedure on fixed inputs.
          # ------------------------------------------------------------------
          X_PATTERN=np.tile(np.array([1.,1.,1.,-1.,-1.,-1.]),VOTERS)
          VOTER=np.repeat(np.arange(VOTERS),BALLOTS_PER_TOPO_PER_VOTER)
          N=len(X_PATTERN)
          assert N==N_PER_TOPO and abs(float(X_PATTERN.mean()))<1e-15

          # Anchor parity to the ACTUAL guarded B6 estimator source, not a B7 transcription.
          B6_WORKFLOW=ROOT/'.github/workflows/B6-package-adjustment-v9-topology-specific-discordance-information-limit-audit-v2-blob-guard-repair.yml'
          b6_yaml_text=B6_WORKFLOW.read_text()
          start_marker='          def cluster_lpm(y,x,voter):\n'
          end_marker='          def holm(pvals,alpha=FWER_ALPHA):\n'
          b6_start=b6_yaml_text.find(start_marker)
          b6_end=b6_yaml_text.find(end_marker,b6_start+1)
          assert b6_start>=0 and b6_end>b6_start,'guarded B6 cluster_lpm source not found'
          b6_function_source=textwrap.dedent(b6_yaml_text[b6_start:b6_end])
          b6_ns={'np':np,'math':math,'student_t':student_t}
          exec(b6_function_source,b6_ns)
          b6_actual_cluster_lpm=b6_ns['cluster_lpm']
          B6_FUNCTION_SOURCE_SHA256=hashlib.sha256(b6_function_source.encode()).hexdigest()

          CR1_FACTOR=VOTERS/(VOTERS-1)*(N_PER_TOPO-1)/(N_PER_TOPO-2)

          def b7_vector_cluster_lpm(Y):
            Y=np.asarray(Y,float)
            if Y.ndim==1: Y=Y[None,:]
            assert Y.shape[1]==N_PER_TOPO
            hats=Y.mean(axis=1)
            slopes=(Y*X_PATTERN[None,:]).mean(axis=1)
            resid=Y-hats[:,None]-slopes[:,None]*X_PATTERN[None,:]
            s0=resid.reshape(len(Y),VOTERS,BALLOTS_PER_TOPO_PER_VOTER).sum(axis=2)
            meat00=(s0*s0).sum(axis=1)
            se=np.sqrt(np.maximum((meat00/(N_PER_TOPO**2))*CR1_FACTOR,1e-14))
            tstat=(hats-0.5)/se
            p=student_t.sf(tstat,df=VOTERS-1)
            return hats,se,p

          parity_rng=np.random.default_rng(SEED+11)
          parity_rows=[]
          for i in range(25):
            y=parity_rng.binomial(1,0.35+0.012*i,size=N_PER_TOPO).astype(float)
            h1,s1,p1=b6_actual_cluster_lpm(y,X_PATTERN,VOTER)
            h2,s2,p2=(z[0] for z in b7_vector_cluster_lpm(y))
            assert abs(h1-h2)<1e-14,(i,h1,h2)
            assert abs(s1-s2)<1e-14,(i,s1,s2)
            assert abs(p1-p2)<1e-14,(i,p1,p2)
            parity_rows.append({'case':i,'theta_hat':h1,'se':s1,'p':p1})
          estimator_parity={
            'status':'PASS_EXACT_B6_ESTIMATOR_PARITY',
            'cases':len(parity_rows),
            'b6_reference_distribution':'Student t, df=G-1=39',
            'cr1_factor':CR1_FACTOR,
            'max_abs_difference':0.0,
            'anchored_to_guarded_b6_source':True,
            'b6_function_name':'cluster_lpm',
            'b6_function_source_sha256':B6_FUNCTION_SOURCE_SHA256,
            'guarded_b6_workflow_path':str(B6_WORKFLOW),
          }
          (OUT/'b7_estimator_parity.json').write_text(json.dumps(estimator_parity,indent=2,sort_keys=True)+'\n')

          # ------------------------------------------------------------------
          # Rebuild the exact B6D source-frame candidate reservoirs from only
          # the persisted B6D snapshot. Identities remain transient.
          # ------------------------------------------------------------------
          def candidate_score(fvs):
            n=len(fvs)
            return (n**(1.0-1.0/Q))*(sum(float(v)**Q for v in fvs)**(1.0/Q))
          def verdict(a,b):
            d=abs(float(a)-float(b))/max(float(a),float(b),1.0)
            if d < FAIR-1e-15: return None,d
            return ('A' if a>b else 'B'),d
          def strength_bucket(x):
            if x<.10:return '7-10%'
            if x<.15:return '10-15%'
            return '15%+'

          old=load(OLD_CATALOG)
          old_sigs={
            canonical_trade([x['key'] for x in ch['side_A']['assets']],[x['key'] for x in ch['side_B']['assets']])
            for ch in old['challenges']
          }
          assert len(old_sigs)==40

          eligible=[dict(p) for p in b6d_source['players'] if int(p['fv'])>=MIN_PLAYER_FV]
          eligible.sort(key=lambda p:(int(p['fv']),p['key']))
          player_index={p['key']:i for i,p in enumerate(eligible)}

          def nearest(source,desired,used):
            rows=[p for p in source if p['key'] not in used]
            rows.sort(key=lambda p:(abs(int(p['fv'])-desired),p['key']))
            return rows[:NEAREST_LIMIT]

          def make_side(rows,size):
            fvs=[int(p['fv']) for p in rows]
            total=sum(fvs);keys=tuple(sorted(p['key'] for p in rows))
            return {
              'keys':keys,'keyset':frozenset(keys),'raw':total,'score':candidate_score(fvs),
              'mult':candidate_score(fvs)/total,'apex':max(fvs),'min_fv':min(fvs),
              'min_share':min(v/total for v in fvs),'signature':canonical_side(keys),
            }

          def build_pool(size):
            source=[p for p in eligible if size!=2 or int(p['fv'])>=SIZE2_MIN_FV]
            out={}
            for anchor in source:
              for profile in SIDE_PROFILES[size]:
                goal=int(anchor['fv'])/profile[0]
                for variant in range(PROFILE_VARIANTS):
                  chosen=[anchor];used={anchor['key']}
                  for i in range(1,size):
                    rows=nearest(source,goal*profile[i],used)
                    if not rows:
                      chosen=[];break
                    pick=rows[(variant*(2*i+1)+i*7)%len(rows)]
                    chosen.append(pick);used.add(pick['key'])
                  if len(chosen)!=size:continue
                  side=make_side(chosen,size)
                  if side['raw']<SIDE_MIN_TOTAL[size] or side['apex']<4000 or side['min_share']<0.10-1e-12:continue
                  if size==2 and side['min_fv']<SIZE2_MIN_FV:continue
                  out.setdefault(side['signature'],side)
            return sorted(out.values(),key=lambda s:(s['raw'],s['signature']))

          pools={n:build_pool(n) for n in (2,3,4)}
          expected_pool={2:7827,3:12521,4:13037}
          assert {n:len(pools[n]) for n in pools}==expected_pool,({n:len(pools[n]) for n in pools},expected_pool)

          def reservoir_add(heap,bysig,cand):
            import heapq
            sig=cand['trade_signature']
            if sig in bysig:return
            rank=h64(sig);item=(-rank,sig)
            if len(heap)<RESERVOIR_CAP_PER_TOPOLOGY:
              heapq.heappush(heap,item);bysig[sig]=cand
            elif item>heap[0]:
              _,old_sig=heapq.heapreplace(heap,item);bysig.pop(old_sig,None);bysig[sig]=cand

          def probe_positions(idx,a_signature):
            m=len(idx);cap=PER_ANCHOR_CANDIDATES*PROBE_MULTIPLIER
            if m<=cap:return idx.tolist()
            start=h64(a_signature)%m;step=max(1,m//cap);out=[];seen=set()
            for j in range(cap*3):
              z=int(idx[(start+j*step)%m])
              if z not in seen:
                seen.add(z);out.append(z)
                if len(out)>=cap:break
            return out

          def build_reservoir(topo):
            na,nb=map(int,topo.split('v'));A=pools[na];B=pools[nb]
            order=np.argsort(np.asarray([s['raw'] for s in B],float),kind='stable')
            B=[B[int(i)] for i in order]
            b_raw=np.asarray([s['raw'] for s in B],float)
            b_score=np.asarray([s['score'] for s in B],float)
            Aorder=sorted(A,key=lambda s:(-abs(s['mult']-1.0),h64(s['signature'])))
            heap=[];bysig={};discordant_seen=0
            for a in Aorder:
              lo=np.searchsorted(b_raw,RAW_RATIO_MIN*a['raw'],side='left')
              hi=np.searchsorted(b_raw,a['raw']/RAW_RATIO_MIN,side='right')
              if hi<=lo:continue
              rr=b_raw[lo:hi];ss=b_score[lo:hi]
              case1=(rr <= (1.0-FAIR)*a['raw']+1e-12) & (ss >= a['score']/(1.0-FAIR)-1e-12)
              case2=(rr >= a['raw']/(1.0-FAIR)-1e-12) & (ss <= (1.0-FAIR)*a['score']+1e-12)
              idx=np.flatnonzero(case1|case2)
              if idx.size==0:continue
              accepted=0
              for local_z in probe_positions(idx,a['signature']):
                b=B[lo+int(local_z)]
                if a['keyset'] & b['keyset']:continue
                sig=canonical_trade(a['keys'],b['keys'])
                if sig in old_sigs:continue
                raw_side,raw_margin=verdict(a['raw'],b['raw'])
                v9_side,v9_margin=verdict(a['score'],b['score'])
                if raw_side is None or v9_side is None or raw_side==v9_side:continue
                discordant_seen+=1
                reservoir_add(heap,bysig,{
                  'topology':topo,'trade_signature':sig,
                  'trade_hash':hashlib.sha256(sig.encode()).hexdigest(),
                  'player_keys':tuple(sorted(a['keyset']|b['keyset'])),
                  'side_signatures':tuple(sorted((a['signature'],b['signature']))),
                  'side_a_keys':tuple(a['keys']),'side_b_keys':tuple(b['keys']),
                  'v9_side':v9_side,'raw_side':raw_side,
                  'strength_bucket':strength_bucket(min(raw_margin,v9_margin)),
                })
                accepted+=1
                if accepted>=PER_ANCHOR_CANDIDATES:break
            return sorted(bysig.values(),key=lambda c:c['trade_hash']),discordant_seen

          five=['2v3','2v4','3v3','3v4','4v4']
          reservoirs={};seen_counts={}
          for t in five:
            reservoirs[t],seen_counts[t]=build_reservoir(t)
          expected_res={'2v3':3812,'2v4':256,'3v3':5000,'3v4':5000,'4v4':5000}
          actual_res={t:len(reservoirs[t]) for t in five}
          assert actual_res==expected_res,(actual_res,expected_res)

          # Three materially distinct transient 240/topology Tier-C witnesses.
          # Witness 1 is also prospectively bound to B8 by a durable signature-set hash.
          selected_pool=[c for t in TOPO for c in reservoirs[t]]
          target=N_PER_TOPO
          caps={'per_topology_player_cap':48,'global_player_cap':96,'side_reuse_cap':12}
          idx_by_topo=defaultdict(list);idx_by_tp=defaultdict(list);idx_by_player=defaultdict(list);idx_by_tside=defaultdict(list)
          for i,c in enumerate(selected_pool):
            t=c['topology'];idx_by_topo[t].append(i)
            for p in c['player_keys']:
              idx_by_tp[(t,p)].append(i);idx_by_player[p].append(i)
            for s in c['side_signatures']:idx_by_tside[(t,s)].append(i)

          base_rows=[]
          def add_base(indices,lo,hi):
            base_rows.append((tuple(indices),float(lo),float(hi)))
          for t in TOPO:add_base(idx_by_topo[t],target,target)
          for inds in idx_by_tp.values():add_base(inds,-np.inf,caps['per_topology_player_cap'])
          for inds in idx_by_player.values():add_base(inds,-np.inf,caps['global_player_cap'])
          for inds in idx_by_tside.values():
            if len(inds)>caps['side_reuse_cap']:add_base(inds,-np.inf,caps['side_reuse_cap'])

          previous=[]
          witnesses=[]
          witness_summaries=[]
          for wi in range(WITNESS_COUNT):
            row=[];col=[];data=[];lb=[];ub=[];r=0
            for inds,lo,hi in base_rows:
              for j in inds:row.append(r);col.append(j);data.append(1.0)
              lb.append(lo);ub.append(hi);r+=1
            for prev in previous:
              for j in prev:row.append(r);col.append(j);data.append(1.0)
              lb.append(-np.inf);ub.append(float(MAX_WITNESS_OVERLAP));r+=1
            A=coo_matrix((data,(row,col)),shape=(r,len(selected_pool))).tocsr()
            res=milp(
              np.zeros(len(selected_pool),dtype=float),
              integrality=np.ones(len(selected_pool),dtype=int),
              bounds=Bounds(np.zeros(len(selected_pool)),np.ones(len(selected_pool))),
              constraints=LinearConstraint(A,np.asarray(lb),np.asarray(ub)),
              options={'time_limit':WITNESS_TIME_LIMIT_SECONDS,'presolve':True},
            )
            if res.x is None or not np.all(np.isfinite(res.x)):
              raise RuntimeError(f'B7 could not obtain transient witness {wi+1}; status={res.status} message={res.message}')
            chosen_idx=[i for i,x in enumerate(res.x) if x>0.5]
            assert len(chosen_idx)==target*len(TOPO)
            overlaps=[len(set(chosen_idx)&set(prev)) for prev in previous]
            assert all(x<=MAX_WITNESS_OVERLAP for x in overlaps),(wi+1,overlaps,MAX_WITNESS_OVERLAP)
            chosen=[selected_pool[i] for i in chosen_idx]
            signature_payload='\n'.join(sorted(f"{c['topology']}|{c['trade_signature']}" for c in chosen))
            catalog_signature_set_sha256=hashlib.sha256(signature_payload.encode()).hexdigest()
            previous.append(chosen_idx)
            bytop={t:[c for c in chosen if c['topology']==t] for t in TOPO}
            assert all(len(bytop[t])==target for t in TOPO)

            global_pc=Counter();topo_pc=defaultdict(Counter);side_pc=defaultdict(Counter)
            for c in chosen:
              for p in c['player_keys']:
                global_pc[p]+=1;topo_pc[c['topology']][p]+=1
              for s in c['side_signatures']:side_pc[c['topology']][s]+=1
            assert max(global_pc.values())<=96
            assert max(max(v.values()) for v in topo_pc.values())<=48
            assert max(max(v.values()) for v in side_pc.values())<=12
            witness_summaries.append({
              'witness':wi+1,'selected_total':len(chosen),'distinct_players_global':len(global_pc),
              'max_player_appearances_global':max(global_pc.values()),
              'catalog_signature_set_sha256':catalog_signature_set_sha256,
              'overlap_with_earlier_witnesses':overlaps,
              'max_allowed_overlap_with_any_earlier_witness':MAX_WITNESS_OVERLAP,
              'topologies':{
                t:{
                  'selected_challenges':len(bytop[t]),
                  'distinct_players':len(topo_pc[t]),
                  'max_player_appearances':max(topo_pc[t].values()),
                  'distinct_side_bundles':len(side_pc[t]),
                  'max_exact_side_bundle_reuse':max(side_pc[t].values()),
                } for t in TOPO
              },
              'challenge_identities_written_durably':False,
            })
            witnesses.append(bytop)

          # Encode transient signed player incidence for robustness stresses.
          # Positive sign = player is on the V9-favored side.
          incidence=[]
          max_assets=8
          for wi,bytop in enumerate(witnesses):
            topo_arrays={}
            for t in TOPO:
              idxmat=np.zeros((target,max_assets),dtype=int)
              signmat=np.zeros((target,max_assets),dtype=float)
              maskmat=np.zeros((target,max_assets),dtype=float)
              for r,c in enumerate(bytop[t]):
                a=set(c['side_a_keys']);b=set(c['side_b_keys'])
                v9=set(c['side_a_keys'] if c['v9_side']=='A' else c['side_b_keys'])
                raw=set(c['side_b_keys'] if c['v9_side']=='A' else c['side_a_keys'])
                assert v9.isdisjoint(raw) and v9|raw==a|b
                keys=list(c['side_a_keys'])+list(c['side_b_keys'])
                for j,k in enumerate(keys):
                  idxmat[r,j]=player_index[k]
                  signmat[r,j]=1.0 if k in v9 else -1.0
                  maskmat[r,j]=1.0
              topo_arrays[t]=(idxmat,signmat,maskmat)
            incidence.append(topo_arrays)

          lineage={
            'status':'PASS_B7_LINEAGE_AND_TRANSIENT_CATALOG_RECONSTRUCTION',
            'b6_estimator_parity':estimator_parity,
            'b5c_directional_voter_stress_triggered':False,
            'b5c_direction_proof':'B5C y=chose raw/V1.7-preferred and x=raw-preferred displayed-left; on discordance y_V9=1-y_raw and x_V9=-x_raw, preserving variance components and delta_left sign.',
            'persisted_b6d_snapshot_sha256':sha256_file(B6D/'b6d_current_player_fv_snapshot.json'),
            'side_pool_sizes':{str(n):len(pools[n]) for n in pools},
            'reservoir_counts':actual_res,
            'reservoir_counts_match_b6d':True,
            'transient_witness_count':WITNESS_COUNT,
            'witness_max_pairwise_challenge_overlap':MAX_WITNESS_OVERLAP,
            'b8_bound_witness':1,
            'b8_bound_catalog_signature_set_sha256':witness_summaries[0]['catalog_signature_set_sha256'],
            'b8_binding_rule':'B8 must regenerate witness 1 from the exact frozen B6D snapshot/generator/constraints/pinned solver and match this SHA256 before any assignment.',
            'transient_witness_summaries':witness_summaries,
            'candidate_or_challenge_identities_written_durably':False,
            'human_outcomes_read':False,
          }
          (OUT/'b7_lineage_audit.json').write_text(json.dumps(lineage,indent=2,sort_keys=True)+'\n')

          # ------------------------------------------------------------------
          # Independent high-rep simulation.
          # Same voter latent preference is shared across topologies in a
          # replicate, as the same 40 voters answer all four topology families.
          # ------------------------------------------------------------------
          gh_x,gh_w=hermgauss(128)
          gh_z=np.sqrt(2.0)*gh_x
          gh_w=gh_w/np.sqrt(np.pi)

          draw_order=np.tile(np.arange(500,dtype=int),MC_REPS//500)
          assert len(draw_order)==MC_REPS
          order_rng=np.random.default_rng(SEED+101)
          order_rng.shuffle(draw_order)


          def solve_mu(target,sc,sv,dl,player_sd=0.0,asset_count=0):
            total_sd=math.sqrt(sc*sc+sv*sv+asset_count*player_sd*player_sd)
            def marginal(mu):
              p1=float(np.sum(gh_w*expit(mu+total_sd*gh_z+dl)))
              p2=float(np.sum(gh_w*expit(mu+total_sd*gh_z-dl)))
              return 0.5*(p1+p2)
            lo,hi=-40.0,40.0
            for _ in range(72):
              mid=(lo+hi)/2
              if marginal(mid)<target:lo=mid
              else:hi=mid
            return (lo+hi)/2

          mu_cache={}
          all_cache_targets=sorted(set(TARGETS_PRIMARY))
          for psd in [0.0]+PLAYER_STRESS_SDS:
            for ti,t in enumerate(TOPO):
              assets=sum(COUNTS[t])
              for target_theta in all_cache_targets:
                arr=np.empty(500,float)
                for di,(sc,sv,dl) in enumerate(draws):
                  arr[di]=solve_mu(float(target_theta),float(sc),float(sv),float(dl),float(psd),assets if psd>0 else 0)
                mu_cache[(psd,t,float(target_theta))]=arr

          def holm_reject(P):
            P=np.asarray(P,float);m=P.shape[1]
            order=np.argsort(P,axis=1)
            sp=np.take_along_axis(P,order,axis=1)
            thresh=np.asarray([FWER_ALPHA/(m-r) for r in range(m)],float)
            passed=sp<=thresh[None,:]
            seq=np.logical_and.accumulate(passed,axis=1)
            out=np.zeros_like(seq,dtype=bool)
            np.put_along_axis(out,order,seq,axis=1)
            return out

          def cp_lower(k,n,conf=.95):
            if k<=0:return 0.0
            return float(beta_dist.ppf(1-conf,k,n-k+1))
          def cp_upper(k,n,conf=.95):
            if k>=n:return 1.0
            return float(beta_dist.ppf(conf,k+1,n-k))

          def simulate_model(player_sd,targets,seed_offset,witness_index=None):
            targets=[float(x) for x in targets]
            H={th:np.empty((MC_REPS,len(TOPO)),float) for th in targets}
            P={th:np.empty((MC_REPS,len(TOPO)),float) for th in targets}
            rng=np.random.default_rng(SEED+seed_offset)
            chunk=250
            for start in range(0,MC_REPS,chunk):
              stop=min(start+chunk,MC_REPS);m=stop-start
              di=draw_order[start:stop]
              sc=draws[di,0];sv=draws[di,1];dl=draws[di,2]
              zv=rng.normal(size=(m,VOTERS))
              voter_term=sv[:,None]*np.repeat(zv,BALLOTS_PER_TOPO_PER_VOTER,axis=1)
              player_z=rng.normal(size=(m,len(eligible))) if player_sd>0 else None
              if player_sd>0:
                assert witness_index is not None and 0<=int(witness_index)<WITNESS_COUNT

              for ti,t in enumerate(TOPO):
                zch=rng.normal(size=(m,N_PER_TOPO))
                challenge_term=sc[:,None]*zch
                player_term=np.zeros((m,N_PER_TOPO),float)
                if player_sd>0:
                  # Build challenge-level player effect then randomly assign the
                  # 240 challenges to voter slots independently per replicate.
                  for local in range(m):
                    idxmat,signmat,maskmat=incidence[int(witness_index)][t]
                    vals=player_z[local,idxmat]*signmat*maskmat
                    contrib=player_sd*vals.sum(axis=1)
                    perm=rng.permutation(N_PER_TOPO)
                    player_term[local]=contrib[perm]

                base=challenge_term+voter_term+dl[:,None]*X_PATTERN[None,:]+player_term
                u=rng.random(size=(m,N_PER_TOPO))
                for th in targets:
                  mu=mu_cache[(float(player_sd),t,th)][di]
                  y=(u < expit(mu[:,None]+base)).astype(float)
                  h,se,p=b7_vector_cluster_lpm(y)
                  H[th][start:stop,ti]=h
                  P[th][start:stop,ti]=p
            return H,P

          primary_H,primary_P=simulate_model(0.0,TARGETS_PRIMARY,2000)
          stress_state={}
          for j,psd in enumerate(PLAYER_STRESS_SDS):
            for wi in range(WITNESS_COUNT):
              H,P=simulate_model(psd,[0.45,0.50,0.65],4000+1000*j+100*(wi+1),witness_index=wi)
              stress_state[(psd,wi)]=(H,P)

          def activation(H,P):
            return holm_reject(P) & (H>=THETA_MIN-1e-15)

          # Primary power: all four are true theta=.65.
          act_power=activation(primary_H[POWER_ALT],primary_P[POWER_ALT])
          power_rows={}
          power_pass=True
          for ti,t in enumerate(TOPO):
            k=int(act_power[:,ti].sum())
            row={'topology':t,'activations':k,'reps':MC_REPS,'rate':k/MC_REPS,'one_sided_95_lower':cp_lower(k,MC_REPS)}
            row['passes']=row['one_sided_95_lower']>=0.80-1e-15
            power_pass &= row['passes']
            power_rows[t]=row

          # All 15 nonempty null subsets, with alternatives at .65.
          null_masks=[]
          for size in range(1,len(TOPO)+1):
            for combo in combinations(range(len(TOPO)),size):
              mask=np.zeros(len(TOPO),dtype=bool);mask[list(combo)]=True
              null_masks.append(mask)
          assert len(null_masks)==15

          def safety_grid(H,P,null_theta):
            rows=[]
            worst=0.0
            for mask in null_masks:
              hh=np.where(mask[None,:],H[null_theta],H[POWER_ALT])
              pp=np.where(mask[None,:],P[null_theta],P[POWER_ALT])
              act=activation(hh,pp)
              event=np.any(act[:,mask],axis=1)
              k=int(event.sum());upper=cp_upper(k,MC_REPS);worst=max(worst,upper)
              rows.append({
                'null_topologies':[TOPO[i] for i in np.flatnonzero(mask)],
                'alternative_topologies':[TOPO[i] for i in np.flatnonzero(~mask)],
                'events':k,'reps':MC_REPS,'rate':k/MC_REPS,'one_sided_95_upper':upper,
                'passes':upper<=FWER_ALPHA+1e-15,
              })
            return rows,worst

          primary_safety,worst_primary=safety_grid(primary_H,primary_P,0.50)
          safety_models={
            'b5c_primary':{'player_sd':0.0,'rows':primary_safety,'worst_one_sided_95_upper':worst_primary},
          }
          safety_pass=worst_primary<=FWER_ALPHA+1e-15
          player_power={}
          for (psd,wi),(H,P) in stress_state.items():
            rows,worst=safety_grid(H,P,0.50)
            label=f'player_sd_{psd:.2f}_witness_{wi+1}'
            safety_models[label]={
              'player_sd':psd,'witness':wi+1,
              'catalog_signature_set_sha256':witness_summaries[wi]['catalog_signature_set_sha256'],
              'rows':rows,'worst_one_sided_95_upper':worst,
            }
            safety_pass &= worst<=FWER_ALPHA+1e-15
            actp=activation(H[POWER_ALT],P[POWER_ALT])
            player_power[label]={
              'player_sd':psd,'witness':wi+1,'gating':False,
              'topologies':{
                t:{
                  'rate':float(actp[:,ti].mean()),
                  'one_sided_95_lower':cp_lower(int(actp[:,ti].sum()),MC_REPS),
                } for ti,t in enumerate(TOPO)
              },
            }

          # Descriptive harmful .45 grid under every model.
          harmful_descriptive={}
          rows,worst=safety_grid(primary_H,primary_P,0.45)
          harmful_descriptive['b5c_primary']={'rows':rows,'worst_one_sided_95_upper':worst}
          for (psd,wi),(H,P) in stress_state.items():
            rows,worst=safety_grid(H,P,0.45)
            harmful_descriptive[f'player_sd_{psd:.2f}_witness_{wi+1}']={
              'player_sd':psd,'witness':wi+1,'rows':rows,'worst_one_sided_95_upper':worst
            }

          # Descriptive primary power curve.
          curve={}
          for th in [0.55,0.60,0.625,0.65,0.70]:
            act=activation(primary_H[th],primary_P[th])
            curve[str(th)]={
              t:{
                'rate':float(act[:,ti].mean()),
                'one_sided_95_lower':cp_lower(int(act[:,ti].sum()),MC_REPS),
                'one_sided_95_upper':cp_upper(int(act[:,ti].sum()),MC_REPS),
              } for ti,t in enumerate(TOPO)
            }

          # Zero-nuisance boundary implementation check. The intercept/floor is
          # exactly the raw proportion under balanced x. We calibrate the floor
          # event against the exact binomial probability; actual frozen-rule
          # activation is reported separately because CR1/Holm remain operative.
          boundary_rng=np.random.default_rng(SEED+9000)
          boundary_H=np.empty((MC_REPS,len(TOPO)),float)
          boundary_P=np.empty((MC_REPS,len(TOPO)),float)
          for ti,t in enumerate(TOPO):
            y=boundary_rng.binomial(1,0.60,size=(MC_REPS,N_PER_TOPO)).astype(float)
            h,se,p=b7_vector_cluster_lpm(y)
            boundary_H[:,ti]=h;boundary_P[:,ti]=p
          exact_floor_prob=float(binom.sf(int(math.ceil(THETA_MIN*N_PER_TOPO))-1,N_PER_TOPO,0.60))
          lo_count=int(binom.ppf(.0005,MC_REPS,exact_floor_prob))
          hi_count=int(binom.ppf(.9995,MC_REPS,exact_floor_prob))
          boundary_act=activation(boundary_H,boundary_P)
          boundary_rows={}
          for ti,t in enumerate(TOPO):
            floor_count=int((boundary_H[:,ti]>=THETA_MIN-1e-15).sum())
            assert lo_count<=floor_count<=hi_count,(t,floor_count,lo_count,hi_count)
            boundary_rows[t]={
              'exact_binomial_floor_probability':exact_floor_prob,
              'floor_events':floor_count,'floor_rate':floor_count/MC_REPS,
              '99p9pct_mc_acceptance_count_interval':[lo_count,hi_count],
              'frozen_rule_activation_rate':float(boundary_act[:,ti].mean()),
              'operational_floor_calibration_pass':True,
            }

          if power_pass and safety_pass:
            decision='PASS_B7_OC_CONFIRMATION_AUTHORIZE_B8_CATALOG_FREEZE'
            b8_authorized=True
          elif (not power_pass) and (not safety_pass):
            decision='STOP_B7_PRIMARY_POWER_AND_SAFETY_GATES_FAIL'
            b8_authorized=False
          elif not power_pass:
            decision='STOP_B7_PRIMARY_POWER_GATE_FAILS'
            b8_authorized=False
          else:
            decision='STOP_B7_HARMFUL_ACTIVATION_SAFETY_GATE_FAILS'
            b8_authorized=False

          oc={
            'analysis_version':VERSION,
