          import base64
          from pathlib import Path

          phase2a = Path('.github/workflows/fourforfour-idp-v1-phase2a.yml').read_text(encoding='utf-8')
          base_marker = "cat > /tmp/fourforfour-phase2a.py.b64 <<'B64'"
          b0 = phase2a.find(base_marker)
          if b0 < 0:
              raise RuntimeError('Phase 2A reconstruction marker missing')
          b0 = phase2a.find('\n', b0) + 1
          b1 = phase2a.find('\n          B64', b0)
          if b1 < 0:
              raise RuntimeError('Phase 2A reconstruction terminator missing')
          base_encoded = ''.join(line.strip() for line in phase2a[b0:b1].splitlines())
          base_script = base64.b64decode(base_encoded, validate=True).decode('utf-8')

          shadow = Path('.github/workflows/fourforfour-idp-v1-provisional-10pct-shadow-freeze.yml').read_text(encoding='utf-8')
          shadow_marker = "cat > /tmp/fourforfour-provisional-append.py.b64 <<'B64'"
          s0 = shadow.find(shadow_marker)
          if s0 < 0:
              raise RuntimeError('green shadow append marker missing')
          s0 = shadow.find('\n', s0) + 1
          s1 = shadow.find('\n          B64', s0)
          if s1 < 0:
              raise RuntimeError('green shadow append terminator missing')
          shadow_encoded = ''.join(line.strip() for line in shadow[s0:s1].splitlines())
          shadow_script = base64.b64decode(shadow_encoded, validate=True).decode('utf-8')

          deploy_script = base64.b64decode(
              Path('/tmp/fourforfour-provisional-deploy-tail.py.b64').read_text(encoding='ascii'),
              validate=False,
          ).decode('utf-8')

          combined = base_script + '\n\n' + shadow_script + '\n\n' + deploy_script + '\n'
          compile(combined, '/tmp/fourforfour-provisional-deploy.py', 'exec')
          Path('/tmp/fourforfour-provisional-deploy.py').write_text(combined, encoding='utf-8')
          PY

          python3 /tmp/fourforfour-provisional-deploy.py

      - name: Upgrade permanent IDP validator for provisional successor layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validation/validate_idp_v1_final_deployment.py')
          text = path.read_text(encoding='utf-8')

          if 'FOURFORFOUR_PROVISIONAL_RELEASE =' in text:
              raise RuntimeError('validator already contains provisional 4for4 successor support')

          if 'import hashlib\n' not in text:
              text = text.replace('import json\n', 'import hashlib\nimport json\n', 1)

          const_anchor = (
              'POSITION_LINEAGE_RELEASE = REPO_ROOT / "model" / "releases" / '
              '"idp-position-lineage-v1" / "release.json"\n'
          )
          if const_anchor not in text:
              raise RuntimeError('validator Position Lineage constant anchor missing')
          text = text.replace(
              const_anchor,
              const_anchor
              + 'FOURFORFOUR_PROVISIONAL_RELEASE = REPO_ROOT / "model" / "releases" / '
                '"fourforfour-idp-provisional-10pct-v1" / "release.json"\n',
              1,
          )

          helper_anchor = '''def validate_deployment():\n'''
          helper = '''def canonical_prod_mult_hash(values):\n    payload = json.dumps(\n        {k: float(values[k]) for k in sorted(values)},\n        sort_keys=True,\n        separators=(",", ":"),\n    ).encode("utf-8")\n    return hashlib.sha256(payload).hexdigest()\n\n\n'''
          if helper_anchor not in text:
              raise RuntimeError('validator function anchor missing')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_block = '''    current_mismatches = []\n    for key in baseline:\n        if abs(current[key] - expected_current[key]) > 1e-12:\n            current_mismatches.append((key, expected_current[key], current[key]))\n    if current_mismatches:\n        raise AssertionError(\n            "live PROD_MULT does not match V1 + approved successor stack: "\n            f"{current_mismatches[:10]}"\n        )\n'''
          new_block = '''    provisional_release = None\n    if FOURFORFOUR_PROVISIONAL_RELEASE.exists():\n        provisional_release = json.load(\n            open(FOURFORFOUR_PROVISIONAL_RELEASE, encoding="utf-8")\n        )\n        if provisional_release.get("release_id") != "fourforfour-idp-provisional-10pct-v1":\n            raise AssertionError(\n                "unexpected provisional 4for4 release_id: "\n                f"{provisional_release.get('release_id')}"\n            )\n        expected_policy_fp = (\n            "8cf918c3c1d254ebf84dbff3a755375ceae9b7afe095233a921f7579180863d7"\n        )\n        if provisional_release.get("policy_fingerprint_sha256") != expected_policy_fp:\n            raise AssertionError("provisional 4for4 policy fingerprint drifted")\n        if provisional_release.get("outcome_data_used") is not False:\n            raise AssertionError("provisional 4for4 release used outcome data")\n        if provisional_release.get("week2_realized_outcomes_read") is not False:\n            raise AssertionError("provisional 4for4 release read Week 2 outcomes")\n\n        reconstructed_base_hash = canonical_prod_mult_hash(expected_current)\n        if (\n            provisional_release.get("base_prod_mult_canonical_sha256")\n            != reconstructed_base_hash\n        ):\n            raise AssertionError(\n                "provisional 4for4 base hash does not match reconstructed V1 + Position Lineage stack"\n            )\n\n        live_hash = canonical_prod_mult_hash(current)\n        if (\n            provisional_release.get("deployed_prod_mult_canonical_sha256")\n            != live_hash\n        ):\n            raise AssertionError(\n                "live PROD_MULT does not match frozen provisional 4for4 successor hash"\n            )\n        if int(provisional_release.get("prod_mult_entry_count", -1)) != len(current):\n            raise AssertionError("provisional 4for4 PROD_MULT entry count drifted")\n        if int(provisional_release.get("raw_prod_mult_changed_count", 0)) <= 0:\n            raise AssertionError("provisional 4for4 release has no recorded production changes")\n    else:\n        current_mismatches = []\n        for key in baseline:\n            if abs(current[key] - expected_current[key]) > 1e-12:\n                current_mismatches.append((key, expected_current[key], current[key]))\n        if current_mismatches:\n            raise AssertionError(\n                "live PROD_MULT does not match V1 + approved successor stack: "\n                f"{current_mismatches[:10]}"\n            )\n'''
          if old_block not in text:
              raise RuntimeError('validator current-stack integrity block anchor missing')
          text = text.replace(old_block, new_block, 1)

          result_anchor = '''        "position_lineage_overlay_active": lineage_release is not None,\n'''
          result_insert = '''        "position_lineage_overlay_active": lineage_release is not None,\n        "provisional_4for4_overlay_active": provisional_release is not None,\n        "provisional_4for4_policy_fingerprint_sha256": (\n            provisional_release.get("policy_fingerprint_sha256")\n            if provisional_release is not None else None\n        ),\n        "provisional_4for4_changed_entry_count": (\n            int(provisional_release.get("raw_prod_mult_changed_count", 0))\n            if provisional_release is not None else 0\n        ),\n'''
          if result_anchor not in text:
              raise RuntimeError('validator result anchor missing')
          text = text.replace(result_anchor, result_insert, 1)

          verdict_old = '**PASS — the live `index.html` PROD_MULT table exactly matches the approved model-delta transport deployment.**'
          verdict_new = '**PASS — the live `index.html` PROD_MULT table exactly matches the approved IDP V1 release and all recognized successor layers.**'
          if verdict_old not in text:
              raise RuntimeError('validator report verdict anchor missing')
          text = text.replace(verdict_old, verdict_new, 1)

          report_anchor = '''        f"- Position Lineage V1 successor active: **{result['position_lineage_overlay_active']}**",\n'''
          report_insert = '''        f"- Position Lineage V1 successor active: **{result['position_lineage_overlay_active']}**",\n        f"- Provisional 4for4 10% successor active: **{result['provisional_4for4_overlay_active']}**",\n        f"- Provisional 4for4 changed PROD_MULT entries: **{result['provisional_4for4_changed_entry_count']}**",\n'''
          if report_anchor not in text:
              raise RuntimeError('validator report successor anchor missing')
          text = text.replace(report_anchor, report_insert, 1)

          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          print('PASS: permanent IDP validator upgraded for provisional 4for4 successor layer.')
          PY

      - name: Synchronize canonical free-agent valuation surface
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync/sync_free_agent_valuation.py --write
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py

      - name: Validate deployed successor stack and full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_idp_v1_final_deployment.py
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          for filename in ('index.html', 'free-agent-board.html'):
              text = pathlib.Path(filename).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
              js = '\n'.join(scripts)
              fd, path = tempfile.mkstemp(suffix='.js')
              os.close(fd)
              try:
                  pathlib.Path(path).write_text(js, encoding='utf-8')
                  subprocess.run(['node', '--check', path], check=True)
              finally:
                  pathlib.Path(path).unlink(missing_ok=True)
              print(f'PASS {filename} inline JavaScript syntax')
          PY

          # The validator's human-readable reports are runtime diagnostics, not
          # part of this successor release. Keep the commit aggregate-only.
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md

      - name: Prove exact deployment scope before commit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(
              Path('model/releases/fourforfour-idp-provisional-10pct-v1/release.json')
              .read_text(encoding='utf-8')
