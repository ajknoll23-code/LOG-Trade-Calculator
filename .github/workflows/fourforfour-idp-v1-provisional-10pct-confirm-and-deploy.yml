      - name: Commit and push provisional 10 percent production release
        shell: bash
        run: |
          set -euo pipefail

          # The shared writer concurrency group prevents scheduled-data races;
          # still fail closed if main somehow advanced during this run.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'ERROR: origin/main advanced during deployment; refusing stale push.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            index.html \
            free-agent-board.html \
            scripts/validation/validate_idp_v1_final_deployment.py \
            model/releases/fourforfour-idp-provisional-10pct-v1/release.json

          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            free-agent-board.html \
            index.html \
            model/releases/fourforfour-idp-provisional-10pct-v1/release.json \
            scripts/validation/validate_idp_v1_final_deployment.py | sort)"
          if [ "$staged" != "$expected" ]; then
            echo 'ERROR: staged deployment scope mismatch.' >&2
            printf 'Staged files:\n%s\n' "$staged" >&2
            exit 1
          fi

