name: B8 Draft Class Strength V1 - Stage B Fixed-Cohort Preregistration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  preregister:
    name: B8 freeze Stage B architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B8 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard B7 Stage A pass and B6 lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          D = Path("research/draft-class-strength-v1")

          a = json.loads((D / "b7_stage_a_result.json").read_text())
          am = json.loads((D / "b7_stage_a_manifest.json").read_text())
          auto = json.loads((D / "b7_stage_a_null_autopsy.json").read_text())
          cov = json.loads((D / "b7_stage_a_fixed_cohort_coverage_audit.json").read_text())

          assert a["decision"] == (
              "PASS_B7_STAGE_A_DEFECT_CONFIRMED_AUTHORIZE_STAGE_B_PREREGISTRATION"
          )
          assert a["b6_exact_replay_pass"] is True
          assert a["size_driven_share"] >= 0.40
          assert abs(a["size_driven_share"] - 0.47521803149856) < 1e-15
          assert a["stage_b_preregistration_authorized"] is True
          assert a["stage_b_execution_authorized"] is False
          assert a["predictor_fit_performed"] is False
          assert a["2027_class_scored"] is False
          assert a["production_change_authorized"] is False

          for name, expected in am["output_hashes"].items():
              got = hashlib.sha256((D / name).read_bytes()).hexdigest()
              assert got == expected, (name, expected, got)

          assert auto["permutations"] == 50000
          assert auto["seed"] == 20260930
          assert abs(auto["ready_count_vs_null_mean_pearson"] - 0.9922692582040307) < 1e-15
          assert cov["population_definition"].startswith("first 48 NFL-drafted")
          assert cov["gating_authority"] is False

          # Preserve the exact B5/B6 outcome-value lineage.
          b5 = json.loads(
              (D / "b5_option_d_historical_fundamental_target_preregistration.json").read_text()
          )
          assert b5["historical_range_contract"]["candidate_years"] == list(range(2010, 2024))
          assert b5["h3o2_value_contract"]["change_from_v10_value_function_authorized"] is False
          assert b5["2027_class_scored"] is False
          assert b5["production_change_authorized"] is False

          print("PASS: B7 Stage A authorized preregistration only; B5/B6 lineage guarded.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: repository regression baseline."

      - name: Freeze Stage B fixed cohort rank-stratified test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          D = ROOT / "research/draft-class-strength-v1"

          b5 = json.loads(
              (D / "b5_option_d_historical_fundamental_target_preregistration.json").read_text()
          )
          a = json.loads((D / "b7_stage_a_result.json").read_text())
          cov = json.loads((D / "b7_stage_a_fixed_cohort_coverage_audit.json").read_text())

          prereg = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b8_stage_b_fixed_cohort_preregistration",
              "status": "FROZEN_BEFORE_STAGE_B_EXECUTION",
              "decision": "FREEZE_B8_STAGE_B_FIXED_COHORT_RANK_STRATIFIED_FINAL_AUDIT",
              "authorization_lineage": {
                  "b7_stage_a_decision": a["decision"],
                  "b7_size_driven_share": a["size_driven_share"],
                  "b7_size_driven_share_gate": a["size_driven_share_gate"],
                  "stage_b_preregistration_authorized": True,
                  "stage_b_execution_authorized_by_b7": False,
                  "b8_purpose": (
                      "Freeze the only permitted final Stage B architecture before "
                      "any Stage B outcome analysis."
                  ),
              },
              "finality_policy": {
                  "this_is_final_v1_target_null_audit": True,
                  "if_stage_b_fails": (
                      "Close Draft Class Strength V1 at neutral multiplier 1.00. "
                      "No additional target, null, metric, class-window, or subgroup "
                      "may be tried on 2010-2023 to rescue V1."
                  ),
                  "if_stage_b_passes": (
                      "Authorize predictor-source feasibility only. Do not deploy or "
                      "score 2027."
                  ),
              },
              "years": list(range(2010, 2024)),
              "positions": ["QB", "RB", "WR", "TE"],
              "position_mapping": {
                  "FB": "RB",
                  "all_other_positions": "unchanged",
              },
              "cohort_contract": {
                  "players_per_class": 48,
                  "total_players": 672,
                  "selection": (
                      "For each NFL Draft year 2010-2023, sort all NFL-drafted "
                      "QB/RB/WR/TE players by overall NFL draft pick ascending and "
                      "freeze the first 48."
                  ),
                  "selection_information_time": "NFL draft-day information only",
                  "outcome_sorting_forbidden": True,
                  "backfill_player_49_if_missing_forbidden": True,
                  "fantasy_rookie_adp_used": False,
                  "ktc_used": False,
              },
              "registry_identity_contract": {
                  "primary_registry": "nflverse historical NFL draft picks",
                  "stable_identity_priority": ["gsis_id", "pfr_id"],
                  "sleeper_id_may_be_used_for_outcome_lookup": True,
                  "sleeper_coverage_may_define_population": False,
                  "manual_resolution_allowed": True,
                  "manual_resolution_must_be_identity_only": True,
                  "manual_resolution_may_not_use_fantasy_success_to_choose_identity": True,
                  "h3o2_equivalence_check_overlap_tolerance_relative": 0.01,
                  "equivalence_failure_action": (
                      "Fix identity/plumbing only. H3.O2 constants may not change."
                  ),
              },
              "outcome_contract": {
                  "metric": "H3.O2",
                  "reuse_b5_h3o2_value_contract_exactly": True,
                  "source_lineage_file": b5["h3o2_value_contract"]["source_lineage_file"],
                  "provider": b5["h3o2_value_contract"]["provider"],
                  "o2_scale": b5["h3o2_value_contract"]["o2_scale"],
                  "position_weights_primary_subset":
                      b5["h3o2_value_contract"]["position_weights_primary_subset"],
                  "replacement_ranks_primary_subset":
                      b5["h3o2_value_contract"]["replacement_ranks_primary_subset"],
                  "change_from_v10_value_function_authorized": False,
              },
              "missing_outcome_contract": {
                  "resolution_sequence": [
                      "1. Resolve stable identity using approved identity-only sources.",
                      "2. Determine whether seasons 1-3 contain qualifying NFL production using the frozen provider.",
                      "3. Verified zero qualifying production receives exactly the value returned by the frozen H3.O2 function for zero qualifying production.",
                      "4. A player with qualifying production but unresolved identity is UNRESOLVED and must undergo manual identity review.",
                  ],
                  "max_unresolved_fraction_after_manual_review": 0.02,
                  "max_unresolved_n_equivalent_for_672": 13,
                  "primary_if_unresolved_remain": (
                      "Assign the frozen H3.O2 zero/floor outcome implied by the "
                      "existing function; do not hand-select a value."
                  ),
                  "sensitivity_if_unresolved_remain": (
                      "Assign the median H3.O2 among resolved players in the same "
                      "position and frozen skill-pick rank bin: 1-6, 7-12, 13-24, "
                      "25-48."
                  ),
                  "verdict_flip_between_primary_and_sensitivity": "INCONCLUSIVE_TREATED_AS_FAIL",
                  "unresolved_above_2_percent": "FAIL_AND_CLOSE",
                  "no_backfill": True,
              },
              "target_contract": {
                  "class_total": "sum of H3.O2 for all fixed 48 cohort players",
                  "class_log_strength": (
                      "log(class total / arithmetic mean of all other eligible class totals)"
                  ),
                  "observed_statistic": "sample variance of 14 class_log_strength values",
                  "leave_one_class_out_baseline": True,
              },
              "primary_null_contract": {
                  "name": "skill_pick_rank_stratified_permutation",
                  "definition": (
                      "For each skill-position pick rank k=1..48 independently, "
                      "permute the 14 observed H3.O2 values across the 14 draft "
                      "classes. Reconstruct each class total and leave-one-out "
                      "class_log_strength after all 48 ranks are permuted."
                  ),
                  "preserves": [
                      "exactly 48 players per class",
                      "each skill-pick rank's empirical H3.O2 distribution",
                      "every class's one observation at each skill-pick rank",
                  ],
                  "destroys": "association between draft class and realized H3.O2 conditional on skill-pick rank",
                  "permutations": 50000,
                  "seed": 20261003,
                  "p_value": (
                      "(1 + number of permuted variances >= observed variance) / 50001"
                  ),
                  "one_sided": True,
              },
              "excess_variance_ratio_contract": {
                  "name": "excess_class_variance_ratio",
                  "formula": "max(0, 1 - mean(primary_null_variance) / observed_variance)",
                  "b6_name_reliability_retired": True,
              },
              "bootstrap_contract": {
                  "replicates": 10000,
                  "seed": 20261004,
                  "primary": (
                      "Resample the fixed cohort within each class using the exact "
                      "Stage B bootstrap implementation frozen in the execution workflow; "
                      "preserve class size 48 and report excess-class-variance ratio."
                  ),
                  "intervals": [0.80, 0.95],
              },
              "pass_gate": {
                  "minimum_complete_classes": 10,
                  "permutation_p_lt": 0.10,
                  "excess_class_variance_ratio_ge": 0.30,
                  "excess_ratio_80pct_lower_bound_gt": 0.0,
                  "all_required": True,
              },
              "bridge_contract": {
                  "years": [2018, 2019, 2020, 2021, 2022, 2023],
                  "reference": "B3 old SF-cell class log-strength",
                  "metrics": [
                      "Spearman rank correlation",
                      "Pearson correlation",
                      "above/below-neutral sign agreement",
                  ],
                  "supportive_gate": {
                      "spearman_ge": 0.60,
                      "pearson_ge": 0.50,
                      "sign_agreement_ge_fraction": 0.6666666666666666,
                  },
                  "required_for_stage_b_pass": True,
              },
              "power_contract": {
                  "purpose": (
                      "Determine whether a Stage B failure had adequate power to "
                      "detect economically meaningful class-level effects."
                  ),
                  "simulation_base": "rank-stratified null-generated data",
                  "injected_log_effect_sd_grid": [0.03, 0.05, 0.08, 0.12],
                  "simulations_per_grid_point": 2000,
                  "seed": 20261005,
                  "pass_definition": "meets all three primary Stage B signal gates",
                  "economically_relevant_log_sd": 0.08,
                  "adequate_power_threshold": 0.80,
                  "s0_false_pass_rate_required_to_report": True,
                  "minimum_detectable_log_sd_at_80pct_power_required_to_report": True,
                  "power_does_not_rescue_primary_failure": True,
                  "failure_label_if_power_ge_80pct_at_0_08": "PERMANENT_CLOSE_ADEQUATELY_POWERED_NEGATIVE",
                  "failure_label_if_power_lt_80pct_at_0_08": "CLOSE_UNDERPOWERED_REVISIT_ONLY_WITH_NEW_MATURE_CLASSES",
              },
              "non_gating_diagnostics": {
                  "gating_authority": False,
                  "items": [
                      "outcome-sorted top48 of a fixed first72 drafted-skill cohort",
                      "fixed-cohort bucket totals for ranks 1-6, 7-12, 13-24, 25-48",
                      "QB versus non-QB decomposition",
                      "leave-2017-out",
                      "uncapped three-year VORP-style alternative outcome metric",
                      "era-block null 2010-2016 versus 2017-2023",
                      (
                          "position x broad skill-pick-rank-bin permutation using "
                          "bins 1-6, 7-12, 13-24, 25-48"
                      ),
                  ],
                  "diagnostics_cannot_change_primary_verdict": True,
              },
              "stage_b_decision_table": {
                  "pass_all_primary_gates_and_bridge": (
                      "AUTHORIZE_PREDICTOR_SOURCE_FEASIBILITY_ONLY"
                  ),
                  "fail_with_power_at_0_08_ge_80pct": (
                      "PERMANENT_CLOSE_DRAFT_CLASS_STRENGTH_V1_NEUTRAL_1_00"
                  ),
                  "fail_with_power_at_0_08_lt_80pct": (
                      "CLOSE_AS_UNDERPOWERED_NEUTRAL_1_00_REVISIT_ONLY_AFTER_2024_2026_MATURE"
                  ),
                  "missing_outcome_sensitivity_flips_verdict": (
                      "INCONCLUSIVE_TREATED_AS_FAIL"
                  ),
                  "more_than_2pct_unresolved": "FAIL_AND_CLOSE",
              },
              "frozen_after_b8": [
                  "years 2010-2023",
                  "48-player cohort",
                  "NFL draft-order cohort selection",
                  "H3.O2 value function",
                  "missing-outcome rules",
                  "sample-variance statistic",
                  "rank-stratified primary null",
                  "50000 primary permutations",
                  "primary seed 20261003",
                  "10000 bootstrap replicates",
                  "bootstrap seed 20261004",
                  "pass thresholds",
                  "2018-2023 bridge gates",
                  "power grid and 2000 simulations per point",
                  "power seed 20261005",
                  "economically relevant log SD 0.08",
                  "1.00 neutral default",
              ],
              "forbidden": [
                  "open 2027 features or score 2027",
                  "fit predictor models before Stage B primary verdict",
                  "change H3.O2 after seeing Stage B",
                  "change the 48-player cohort after seeing Stage B",
                  "replace unresolved players with player 49 or later",
                  "change the rank-stratified null after seeing Stage B",
                  "change primary thresholds after seeing Stage B",
                  "promote any non-gating diagnostic to primary after results",
                  "use KTC or fantasy rookie ADP to fit fundamental class talent",
                  "modify production values",
                  "run another rescue target/null on 2010-2023 if Stage B fails",
              ],
              "stage_b_execution_authorized": False,
              "predictor_fit_performed": False,
              "2027_features_read": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }

          coverage_snapshot = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b8_fixed_cohort_missingness_snapshot",
              "source": "B7 Stage A fixed-cohort coverage audit",
              "years": list(range(2010, 2024)),
              "first48_ready": {
                  y: {
                      "ready_n": cov["coverage"][str(y)]["first48_h3_o2_ready_n"],
                      "missing_n": cov["coverage"][str(y)]["first48_not_h3_o2_ready_n"],
                      "missing_share": cov["coverage"][str(y)]["first48_not_h3_o2_ready_share"],
                  }
                  for y in range(2010, 2024)
              },
              "snapshot_is_diagnostic_not_permission_to_change_rules": True,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }

          execution_contract = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b8_stage_b_execution_contract",
              "decision": "STAGE_B_EXECUTION_REQUIRES_SEPARATE_B9_WORKFLOW",
              "ordered_steps": [
                  "1. Guard B8 artifacts and hashes.",
                  "2. Freeze exact first-48 cohort from NFL draft registry before outcomes.",
                  "3. Complete identity-only manual resolution and audit unresolved fraction.",
                  "4. Recompute exact frozen H3.O2 for all 672 cohort slots.",
                  "5. Enforce equivalence on overlapping previously scored players.",
                  "6. Apply frozen missing-outcome primary rule and sensitivity rule if needed.",
                  "7. Construct fixed-cohort class totals and observed variance.",
                  "8. Run 50,000 skill-pick-rank-stratified permutations with seed 20261003.",
                  "9. Compute excess class variance ratio and 10,000 bootstrap interval with seed 20261004.",
                  "10. Run the frozen 2018-2023 bridge.",
                  "11. Run power simulations on s={0.03,0.05,0.08,0.12}, 2,000 each, seed 20261005.",
                  "12. Run non-gating diagnostics only after primary verdict is frozen.",
                  "13. Apply decision table. No rescue analysis is authorized.",
              ],
              "stage_b_execution_authorized_by_this_workflow": False,
              "predictor_fit_performed": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }

          report = "\n".join([
              "# Draft Class Strength V1 — B8 Stage B Preregistration",
              "",
              "**Decision:** `FREEZE_B8_STAGE_B_FIXED_COHORT_RANK_STRATIFIED_FINAL_AUDIT`",
              "",
              "B7 Stage A confirmed the B6 size-driven null defect: 47.52% of the",
              "B6 null variance was attributable to variance in class-specific null means,",
              "above the frozen 40% gate.",
              "",
              "Stage B is the final permitted V1 target/null audit.",
              "",
              "Primary cohort: first 48 NFL-drafted QB/RB/WR/TE players in each class,",
              "2010–2023, ordered by NFL overall draft pick. Exactly 672 cohort slots.",
              "",
              "Primary null: independently permute H3.O2 across classes at each fixed",
              "skill-pick rank 1–48. 50,000 permutations.",
              "",
              "No Stage B outcomes are analyzed in B8. A separate B9 execution workflow",
              "is required.",
              "",
              "No predictors, 2027 scoring, or production changes are authorized.",
              "",
          ])

          artifacts = {
              "b8_stage_b_fixed_cohort_preregistration.json": prereg,
              "b8_fixed_cohort_missingness_snapshot.json": coverage_snapshot,
              "b8_stage_b_execution_contract.json": execution_contract,
          }
          for name, obj in artifacts.items():
              (D / name).write_text(
                  json.dumps(obj, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          (D / "b8_stage_b_preregistration_report.md").write_text(
              report,
              encoding="utf-8",
          )

          outputs = [D / name for name in artifacts] + [
              D / "b8_stage_b_preregistration_report.md"
          ]
          manifest = {
              "schema_version": 1,
              "study_id": "draft-class-strength-v1",
              "stage": "b8_manifest",
              "decision": "PASS_B8_STAGE_B_PREREGISTRATION_FROZEN_B9_EXECUTION_NEXT",
              "output_hashes": {
                  p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in outputs
              },
              "stage_b_execution_authorized": False,
              "predictor_fit_performed": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
              "next_stage": "B9 Stage B fixed-cohort formal execution",
          }
          (D / "b8_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "decision": manifest["decision"],
              "cohort_players_per_class": 48,
              "total_cohort_slots": 672,
              "primary_permutations": 50000,
              "bootstrap_replicates": 10000,
              "power_grid": [0.03, 0.05, 0.08, 0.12],
              "stage_b_execution_authorized": False,
              "2027_class_scored": False,
              "production_change_authorized": False,
          }, indent=2))
          PY

      - name: Validate B8 frozen final-audit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          D = Path("research/draft-class-strength-v1")
          p = json.loads((D / "b8_stage_b_fixed_cohort_preregistration.json").read_text())
          x = json.loads((D / "b8_stage_b_execution_contract.json").read_text())
          m = json.loads((D / "b8_manifest.json").read_text())

          assert p["decision"] == "FREEZE_B8_STAGE_B_FIXED_COHORT_RANK_STRATIFIED_FINAL_AUDIT"
          assert p["years"] == list(range(2010, 2024))
          assert p["cohort_contract"]["players_per_class"] == 48
          assert p["cohort_contract"]["total_players"] == 672
          assert p["cohort_contract"]["outcome_sorting_forbidden"] is True
          assert p["cohort_contract"]["backfill_player_49_if_missing_forbidden"] is True

          assert p["primary_null_contract"]["permutations"] == 50000
          assert p["primary_null_contract"]["seed"] == 20261003
          assert p["bootstrap_contract"]["replicates"] == 10000
          assert p["bootstrap_contract"]["seed"] == 20261004

          assert p["pass_gate"] == {
              "minimum_complete_classes": 10,
              "permutation_p_lt": 0.10,
              "excess_class_variance_ratio_ge": 0.30,
              "excess_ratio_80pct_lower_bound_gt": 0.0,
              "all_required": True,
          }

          assert p["power_contract"]["injected_log_effect_sd_grid"] == [0.03, 0.05, 0.08, 0.12]
          assert p["power_contract"]["simulations_per_grid_point"] == 2000
          assert p["power_contract"]["economically_relevant_log_sd"] == 0.08
          assert p["power_contract"]["adequate_power_threshold"] == 0.80

          assert p["bridge_contract"]["required_for_stage_b_pass"] is True
          assert p["non_gating_diagnostics"]["gating_authority"] is False
          assert p["finality_policy"]["this_is_final_v1_target_null_audit"] is True

          assert p["stage_b_execution_authorized"] is False
          assert p["predictor_fit_performed"] is False
          assert p["2027_class_scored"] is False
          assert p["production_change_authorized"] is False
          assert x["stage_b_execution_authorized_by_this_workflow"] is False

          assert m["decision"] == "PASS_B8_STAGE_B_PREREGISTRATION_FROZEN_B9_EXECUTION_NEXT"
          assert m["stage_b_execution_authorized"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          for name, expected in m["output_hashes"].items():
              got = hashlib.sha256((D / name).read_bytes()).hexdigest()
              assert got == expected, (name, expected, got)

          all_text = "\n".join(
              p.read_text(encoding="utf-8")
              for p in D.glob("b8_*")
              if p.is_file()
          ).lower()
          assert '"stage_b_execution_authorized": true' not in all_text
          assert '"predictor_fit_performed": true' not in all_text
          assert '"2027_class_scored": true' not in all_text
          assert '"production_change_authorized": true' not in all_text

          print("PASS: B8 Stage B preregistration frozen and execution remains blocked.")
          PY

      - name: Prove B8 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = [line[3:] for line in raw.splitlines() if line.strip()]
          assert touched
          assert all(
              p.startswith("research/draft-class-strength-v1/b8_")
              for p in touched
          ), touched
          assert not any(p.startswith(("model/", "scripts/", "data/")) for p in touched)
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched

          print("PASS: B8 mutation scope is research-only.")
          PY

      - name: Commit frozen B8 preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B8 preregistration."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-class-strength-v1/b8_stage_b_fixed_cohort_preregistration.json \
