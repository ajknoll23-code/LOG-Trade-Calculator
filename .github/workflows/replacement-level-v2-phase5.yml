name: Replacement Level V2 Phase 5 Prospective Evaluator

# FROZEN prospective research only.
#
# Freezes the Replacement Level V2 candidate families before Week 1, then
# grades only completed future 2026 evidence. Existing frozen predictions are
# immutable and are preserved on every scheduled run.
#
# No deployed replacement rank, Production V2 input, POSITION_WEIGHT,
# PM-transform coefficient, global scale, or other frozen experiment is changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 2'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 5 self-test
        run: python3 research/replacement-level-v2/replacement_level_v2_phase5_prospective_evaluator.py --selftest

      - name: Freeze if needed and evaluate completed future weeks
        run: python3 research/replacement-level-v2/replacement_level_v2_phase5_prospective_evaluator.py --freeze --write

      - name: Verify frozen/evaluation guardrails
        run: python3 research/replacement-level-v2/replacement_level_v2_phase5_prospective_evaluator.py --check

      - name: Commit prospective research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/replacement-level-v2/replacement_level_v2_phase5_frozen_candidates.json
          git add research/replacement-level-v2/replacement_level_v2_phase5_evaluation.json
          git add research/replacement-level-v2/replacement_level_v2_phase5_evaluation.md
          git diff --staged --quiet || git commit -m "Update Replacement Level V2 Phase 5 prospective research"
          git push
