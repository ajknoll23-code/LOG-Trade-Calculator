# CAL26 V1R25. Explicitly no trained model, rankings ingestion or price change.
name: CAL26 V1R25 - Frozen QB Evidence Feature Assembly READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r25-evidence-features-read-only
  cancel-in-progress: false
jobs:
  feature_freeze:
    name: Join frozen preseason and Weeks 1-6 with all 64 owner rated QBs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main without persisted write access
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Check branch and source availability
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s research/production-v2/production_v2_phase2_preseason_baseline.json
          test -s research/opportunity-v2/opportunity_v2_phase5_evaluation.json
          test -s scripts/validation/snapshot_values.py
          test -s index.html
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download exact successful V1R22 64 QB owner evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r22-frozen"
          gh run download 39844927734 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R22-All-64-QB-Owner-Driver-Review-Read-Only \
            --dir "$RUNNER_TEMP/cal26-v1r22-frozen"
          test -s "$RUNNER_TEMP/cal26-v1r22-frozen/CAL26_V1R22_Manifest.json"
          test -s "$RUNNER_TEMP/cal26-v1r22-frozen/CAL26_V1R22_64_QB_Full_Feedback_Independent_Driver_Audit_READ_ONLY.csv"
      - name: Materialize immutable feature builder and run self-test
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r25_feature_engine.py" <<'PY_CAL26_V1R25'
          #!/usr/bin/env python3
          """CAL26 V1R25 frozen 64-QB evidence features; not a price-fitting experiment."""
          from __future__ import annotations
          import argparse, csv, hashlib, importlib.util, json, math
          from pathlib import Path
          from collections import Counter
          
          SOURCE_FILE = 'CAL26_V1R22_64_QB_Full_Feedback_Independent_Driver_Audit_READ_ONLY.csv'
          
          
          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          
          def jload(p):
              return json.loads(Path(p).read_text(encoding='utf-8'))
          
          def clean(s):
              return ' '.join(str(s).strip().lower().split())
          
          def fmt(v):
              if v is None: return ''
              if isinstance(v,float):
                  if not math.isfinite(v):return ''
                  return round(v,6)
              return v
          
          def join_row(r, preseason, outcomes, live):
              key=clean(r['player'])
              pre=preseason.get(key,{})
              actual=outcomes.get(key,{})
              lv=live.get(key)
              # Unknown feature stays blank rather than being treated as a zero forecast.
              result={
                  'player':r['player'],
                  'canonical_name':key,
                  'owner_feedback_direction':r['feedback'],
                  'frozen_owner_review_fv':r['current_fv_frozen'],
                  'current_live_fv':lv['value'] if lv else '',
                  'live_vs_frozen_delta':(lv['value']-int(r['current_fv_frozen'])) if lv else '',
                  'position':'QB',
                  'age':r['age'],
                  'role':r['role'],
                  'owner_protected':r['is_protected'],
                  'live_prod_mult':fmt(lv['prod_mult']) if lv else '',
                  'live_age_mult':fmt(lv['age_mult']) if lv else '',
                  'production_evidence_type':r['production_evidence_type'],
                  'historical_2025_component':fmt(pre.get('history_component_2025')),
                  'historical_2025_note':pre.get('history_note',''),
                  'preseason_2026_fantasypros_points':fmt(pre.get('fantasypros_2026_points')),
                  'preseason_2026_sleeper_points':fmt(pre.get('sleeper_2026_points')),
                  'preseason_2026_blended_points':fmt(pre.get('canonical_forward_2026_points')),
                  'preseason_forward_source':pre.get('forward_source',''),
                  'preseason_sleeper_id':pre.get('sleeper_id',''),
                  'weeks_1_to_6_actual_games':actual.get('active_games',''),
                  'weeks_1_to_6_actual_ppg':fmt(actual.get('active_ppg')),
                  'weeks_1_to_6_actual_total_points':fmt(actual.get('total_points')),
                  'source_ros_forecast_asof_week6':'NOT_VERIFIED_FOR_QB',
                  'ros_projected_remaining_points':'',
                  'dlf_2026_10_19_dynasty_sf_rank':'',
                  'fantasypros_2026_10_14_dynasty_sf_rank':'',
                  'fourforfour_dynasty_independent_signal':'NO_DLF_SYNDICATED',
                  'model_value':'',
                  'training_or_pricing_authorized':'False',
              }
              return result
          
          def selftest():
              row={'player':'Example QB','feedback':'Too low','current_fv_frozen':'1000','age':'24','role':'Starter','is_protected':'False','production_evidence_type':'REAL_PRODUCTION_DATA'}
              live={'example qb':{'value':1000,'prod_mult':.8,'age_mult':.9}}
              a=join_row(row,{'example qb':{'history_component_2025':120.5,'fantasypros_2026_points':300.0,'sleeper_2026_points':None}}, {'example qb':{'active_games':4,'active_ppg':20.5}}, live)
              assert a['preseason_2026_fantasypros_points']==300.0 and a['preseason_2026_sleeper_points']==''
              assert a['weeks_1_to_6_actual_games']==4 and a['ros_projected_remaining_points']==''
              assert a['dlf_2026_10_19_dynasty_sf_rank']=='' and a['model_value']==''
              assert a['live_vs_frozen_delta']==0 and a['training_or_pricing_authorized']=='False'
              print('PASS selftest: source separation, strict missingness, no invented ROS/ranks/prices')
          
          def main(repo:Path,source:Path,out:Path):
              repo=repo.resolve();source=source.resolve();out=out.resolve()
              assert (repo/'index.html').is_file()
              audit=jload(source/'CAL26_V1R22_Manifest.json')
              assert audit['status']=='PASS_CAL26_V1R22_READ_ONLY_64_QB_EVIDENCE'
              assert audit['feedback_n']==64 and audit['feedback_counts']=={'Too low':22,'Too high':18,'Correct':24}
              assert sha(source/SOURCE_FILE)==audit['files'][SOURCE_FILE]
              with (source/SOURCE_FILE).open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
              assert len(rows)==64 and len({clean(r['player']) for r in rows})==64
          
              pre_path=repo/'research/production-v2/production_v2_phase2_preseason_baseline.json'
              opp_path=repo/'research/opportunity-v2/opportunity_v2_phase5_evaluation.json'
              prep=jload(pre_path);opp=jload(opp_path)
              assert prep['phase']=='Production V2 Phase 2A'
              assert prep.get('calibration_claim_authorized') is False
              assert opp['status']=='EARLY_DIAGNOSTIC_ONLY' and opp['completed_consecutive_weeks_used']==[1,2,3,4,5,6]
              pre={clean(k):v for k,v in prep['frozen_players'].items()}
              outcomes={clean(k):v for k,v in opp['realized_player_outcomes'].items()}
          
              script=repo/'scripts/validation/snapshot_values.py'
              sp=importlib.util.spec_from_file_location('cal26_v1r25_live_values',script)
              mod=importlib.util.module_from_spec(sp);sp.loader.exec_module(mod)
              live=mod.compute_all_values(mod.load_from_html(repo/'index.html'))
              assert len(live)==565, f'Expected 565 canonical players; found {len(live)}'
              assert sum(x['pos']=='QB' for x in live.values())==64
              features=[join_row(r,pre,outcomes,live) for r in rows]
              assert all(r['current_live_fv']!='' for r in features), 'Unmapped current QB name; do not guess aliases'
              assert sum(r['owner_feedback_direction']=='Correct' for r in features)==24
              assert audit['protected_global_prices']==33, 'Production control manifest drift'
              counts={
                  'qb_total':len(features),
                  'all_live_players':len(live),
                  'owner_feedback_counts':dict(Counter(r['owner_feedback_direction'] for r in features)),
                  'has_2025_history_component':sum(r['historical_2025_component']!='' for r in features),
                  'has_2026_preseason_fantasypros':sum(r['preseason_2026_fantasypros_points']!='' for r in features),
                  'has_2026_preseason_sleeper':sum(r['preseason_2026_sleeper_points']!='' for r in features),
                  'has_2026_preseason_any':sum(r['preseason_2026_blended_points']!='' for r in features),
                  'has_week1to6_scored_games':sum(isinstance(r['weeks_1_to_6_actual_games'],int) and r['weeks_1_to_6_actual_games']>0 for r in features),
                  'verified_full_qb_ros_snapshots':0,
                  'ingested_dlf_dynasty_ranks':0,
                  'ingested_fp_dynasty_ecr_ranks':0,
                  'incorrectly_counted_4for4_as_independent_dlf':0,
                  'live_price_changed_vs_review_snapshot':sum(r['live_vs_frozen_delta']!=0 for r in features),
              }
              out.mkdir(parents=True,exist_ok=True)
              table='CAL26_V1R25_Frozen_64_QB_Source_Features_READ_ONLY.csv'
              with (out/table).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=list(features[0]));w.writeheader();w.writerows(sorted(features,key=lambda x:(-int(x['frozen_owner_review_fv']),x['canonical_name'])))
              report='CAL26_V1R25_Evidence_Source_Readiness_Report.md'
              lines=[
                  '# CAL26 V1R25 — 64-QB Evidence Source Feature Freeze','',
                  '**Status:** `SOURCE_FEATURES_ASSEMBLED_NOT_A_FITTED_VALUATION_MODEL`. **No production changes.**','',
                  '## Observed counts','',
                  '| Check | Observed |','|---|---:|',
              ]+[f'| {k.replace("_"," ")} | {v} |' for k,v in counts.items() if isinstance(v,int)]+[
                  '','## Limitations and next action','',
                  '- Historical 2025 component and preseason forecasts are **frozen source features**, not newly calibrated weights.',
                  '- 2026 Weeks 1–6 performance is **observed outcome evidence**, not a rest-of-season forecast.',
                  '- No verified full-QB ROS provider vintage was ingested. CAL14 is an IDP-only sensitivity using proportional forecast attribution.',
                  '- DLF 2026-10-19 dynasty ranks exist in the user Library, not in the repository runner. Import licensed ranks privately.',
                  '- FantasyPros dynasty ECR is a different product from the existing FantasyPros stat-projection API data. Obtain a dated rank snapshot.',
                  '- 4for4 published dynasty superflex ranks are DLF-syndicated: do not count as a second independent ranking source.',
                  '- Before model fitting, acquire timestamped ROS and authorized rank features, then use point-in-time training/validation windows rather than owner-target-derived multipliers.',
                  '- This run writes only a downloadable artifact. It does not fit models, suggest exact price coefficients, or modify production files.',
              ]
              (out/report).write_text('\n'.join(lines)+'\n',encoding='utf-8')
              manifest={
                  'status':'PASS_SOURCE_FEATURE_FREEZE_WITH_UNVERIFIED_EXTERNAL_GAPS',
                  'method':'CAL26_V1R25_FROZEN_QB_FEATURES_V1','counts':counts,
                  'source_v1r22_run':39844927734,
                  'source_git_files_sha256':{str(p.relative_to(repo)):sha(p) for p in [pre_path,opp_path,script,repo/'index.html']},
                  'v1r22_input_manifest_sha256':sha(source/'CAL26_V1R22_Manifest.json'),
                  'features_model_fitted':False,'production_change_authorized':False,
                  'rank_license_policy':'Never commit private DLF or 4for4 row-level data to public repo',
                  'files':{p:sha(out/p) for p in [table,report]},
              }
              (out/'CAL26_V1R25_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps({'status':manifest['status'],'counts':counts},sort_keys=True))
          
          if __name__=='__main__':
              p=argparse.ArgumentParser();p.add_argument('--repo',type=Path);p.add_argument('--source',type=Path);p.add_argument('--out',type=Path);p.add_argument('--selftest',action='store_true');a=p.parse_args()
              if a.selftest:selftest()
              else:
                  assert a.repo and a.source and a.out,'Required --repo --source --out'
                  main(a.repo,a.source,a.out)
          PY_CAL26_V1R25
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r25_feature_engine.py"
          python3 "$RUNNER_TEMP/cal26_v1r25_feature_engine.py" --selftest
      - name: Build real 64 QB historical and preseason feature matrix read only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r25_feature_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source "$RUNNER_TEMP/cal26-v1r22-frozen" \
            --out "$RUNNER_TEMP/CAL26_V1R25_Evidence"
      - name: Independently check scope source digests and no fabricated ranks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAL26_VERIFY'
          from pathlib import Path
          import os,json,csv,hashlib
          p=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R25_Evidence'
          m=json.loads((p/'CAL26_V1R25_Manifest.json').read_text())
          assert m['status']=='PASS_SOURCE_FEATURE_FREEZE_WITH_UNVERIFIED_EXTERNAL_GAPS'
          assert m['features_model_fitted'] is False
          assert m['production_change_authorized'] is False
          c=m['counts']
          assert c['qb_total']==64 and c['all_live_players']==565
          assert c['owner_feedback_counts']=={'Too low':22,'Too high':18,'Correct':24}
          assert c['verified_full_qb_ros_snapshots']==0
          assert c['ingested_dlf_dynasty_ranks']==0 and c['ingested_fp_dynasty_ecr_ranks']==0
          for n,h in m['files'].items():
              assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          with (p/'CAL26_V1R25_Frozen_64_QB_Source_Features_READ_ONLY.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==64 and len({r['canonical_name'] for r in rows})==64
          assert all(not r['model_value'] and not r['ros_projected_remaining_points'] for r in rows)
          assert all(not r['dlf_2026_10_19_dynasty_sf_rank'] for r in rows)
          assert all(r['training_or_pricing_authorized']=='False' for r in rows)
          print('PASS: 565 live parity, 64 owner-rated QBs, real observed features, no invented ROS/ranks, zero prices')
          PY_CAL26_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS checkout pristine and read only'
      - name: Upload nonproprietary source features and provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R25-Frozen-64-QB-Source-Feature-Assembly-READ-ONLY
          path: ${{ runner.temp }}/CAL26_V1R25_Evidence
          if-no-files-found: error
          retention-days: 60
