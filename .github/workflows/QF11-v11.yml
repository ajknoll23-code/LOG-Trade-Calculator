# QF11 V11: source identity adjudication only; nothing sent to voters, nothing committed.
name: QF11 V11 - Priority Player Identity and Owner Decision Gate (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF11_V11_INPUT: /tmp/qf11-v11-input
  QF11_V11_OUTPUT: /tmp/qf11-v11-output
  QF11_V11_ROOT: .
jobs:
  review:
    name: Reconcile priority player identity, 25 vs 21 owner choices, and three held ballots
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout exact main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin exact deployed model, current crosswalk and frozen market sources
      shell: bash
      run: |-
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "STOP non-main dispatch"; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ -z "$(git status --porcelain)" ]] || exit 1
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP drift $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        echo QF11_V11_IMMUTABLE_SOURCES_GREEN
    - name: Download immutable QF11 V10 global owner review (no ballots)
      uses: actions/download-artifact@v4
      with:
        name: QF11-v10-RESEARCH-ONLY-global-owner-review
        run-id: 38279761923
        github-token: ${{ github.token }}
        path: /tmp/qf11-v11-input/v10
    - name: Download immutable QF11 V7 original eligibility review
      uses: actions/download-artifact@v4
      with:
        name: QF11-v7-RESEARCH-ONLY-eligibility-review
        run-id: 38258198738
        github-token: ${{ github.token }}
        path: /tmp/qf11-v11-input/v7
    - name: Audit exact archive hashes and distinguish priority identity vs substitution
      shell: bash
      run: |-
        set -euo pipefail
        cat > /tmp/qf11-v11-audit.py <<'QF11_V11_SCRIPT'
        #!/usr/bin/env python3
        """QF11 V11: archived V7/V10 owner review and current crosswalk reconciliation; never activates voting."""
        import collections, hashlib, json, os, re
        from pathlib import Path

        HERE = Path(os.environ.get('QF11_V11_INPUT','/mnt/data/qf11_v11_fixture'))
        OUT = Path(os.environ.get('QF11_V11_OUTPUT','/mnt/data/qf11_v11_fixture_output'))
        ROOT = Path(os.environ.get('QF11_V11_ROOT','.'))
        OUT.mkdir(parents=True,exist_ok=True)
        PIN={
         'v10_summary':('v10/RESEARCH_ONLY_v10_global_summary.json','5bf143f201733bb7cc36c07232b1544d95c80e7a625f1df849b3d86074dc4884'),
         'v10_slate':('v10/RESEARCH_ONLY_v10_shadow_slate.json','5d531e5ddaf97ff4aa6e2590b9b68680af56bde46f9c6b1528f9db7a2a08c62f'),
         'v7':('v7/RESEARCH_ONLY_28_slot_eligibility_review.json','b920fe5396fd363ed45a99e8cd2bf7695de54e6b7cb86e41e2ba7996da84f2a5'),
        }
        src={}
        for name,(path,sha) in PIN.items():
         p=HERE/path
         assert hashlib.sha256(p.read_bytes()).hexdigest()==sha, f'STOP immutable archive drift {name}'
         src[name]=json.loads(p.read_text())
        summary=src['v10_summary']; slate=src['v10_slate'];review=src['v7']
        assert slate['summary']==summary and len(slate['slots'])==28 and len(review['ballots'])==28
        assert summary['total_shadow_slots_including_existing_screened']==25
        assert summary['original_source_screened_slots']==12 and summary['original_held_slots']==16
        assert summary['unresolved_held_slots']==[5,11,21]
        assert summary['max_cardinality_proven'] and not summary['secondary_objectives_proven'] and not summary['global_search_completed']
        assert not summary['owner_approval'] and not summary['voting_activated'] and not summary['market_or_model_promotion_authorized']
        assert review['approval_authorized'] is False and review['catalog_activated'] is False
        crosswalk=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())
        assert isinstance(crosswalk,list) and len(crosswalk)>0

        def norm(name):
         return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9 ]',' ',str(name or '').lower())).strip()
        def stripped(name):
         words=norm(name).split()
         while len(words)>1 and words[-1] in ('jr','sr','ii','iii','iv'):
          words.pop()
         return ' '.join(words)
        def team(t):
         t=str(t or '').upper()
         return {'JAC':'JAX','WSH':'WAS','LA':'LAR'}.get(t,t)

        by_name=collections.defaultdict(list)
        by_stripped=collections.defaultdict(list)
        for rec in crosswalk:
         name=rec.get('name')
         if name:
          by_name[norm(name)].append(rec)
          by_stripped[stripped(name)].append(rec)

        slot_by_id={b['slot']:b for b in review['ballots']}
        assert len(slot_by_id)==28
        name_evidence={}
        for ballot in review['ballots']:
         for p in ballot['players']:
          k=p['name']
          if k in name_evidence:
           assert p['model_pos']==name_evidence[k]['model_pos'] and p['model_team']==name_evidence[k]['model_team'],f'STOP contradictory model evidence for {k}'
          else:name_evidence[k]=p

        PRIORITY=['will anderson','micah parsons','byron young','malik willis']
        KEYS=PRIORITY+['james cook','jaylon carlies','jaylon jones','trevor lawrence','brock bowers','trey mcbride']
        record=[]
        for key in KEYS:
         e=name_evidence.get(key)
         assert e,f'STOP required identity not in V7 {key}'
         exact=by_name.get(norm(key),[])
         suffix=by_stripped.get(stripped(key),[])
         use=exact or suffix
         match_type='EXACT_NAME_CROSSWALK' if exact else ('SUFFIX_NAME_CANDIDATE_NOT_APPROVED' if suffix else 'NO_NAME_LINK')
         # Never convert suffix similarity, provider position, or franchise-code normalization into approval.
         links=[{'name':r.get('name'), 'fp_position':r.get('fp_position'), 'fp_team':r.get('fp_team'),
                 'sleeper_id_present':bool(r.get('sleeper_id')), 'sleeper_pos':r.get('sleeper_pos'),
                 'sleeper_team':r.get('sleeper_team'), 'method':r.get('match_method')}
                for r in use]
         flagged=e.get('review_flags',[])
         code_only=bool(flagged) and all(f in ('cached_sleeper_team_disagrees_with_model','fp_team_disagrees_with_model_team','sleeper_team_disagrees_with_model_team') for f in flagged) and all(team(r.get('fp_team'))==team(e['model_team']) and team(r.get('sleeper_team'))==team(e['model_team']) for r in use if r.get('fp_team') and r.get('sleeper_team')) and bool(use)
         r={'player':key,'in_original_v7':True,'name_resolution_class':match_type,
            'crosswalk_match_count':len(use),'source_evidence':links[:4], 'model_position':e['model_pos'],
            'model_team':e['model_team'],'v7_review_flags':flagged,
            'team_code_alias_only_candidate':code_only,'fully_source_cleared':not bool(flagged),
            'final_decision':'REQUIRES_EXPLICIT_OWNER_REVIEW',
            'ballot_issuance_authorized':False}
         record.append(r)

        slots=slate['slots']
        seen=set();seen_pairs=set();counts=collections.Counter(); target_removed=set()
        for s in slots:
         n=s['slot']; assert n not in seen;seen.add(n)
         assert s['requires_owner_review'] is True
         assert s['classification'] in ('SOURCE_SCREENED_REVIEW_ONLY_UNCHANGED','OPTIONAL_SOURCE_SCREENED_SHADOW_ONLY','HOLD_UNRESOLVED')
         if s['candidate_player_keys']:
          a=s['candidate_player_keys'];assert len(a)==3 and len(set(a))==3
          counts.update(a)
          pair=tuple(sorted(a[:2]));assert pair not in seen_pairs
          seen_pairs.add(pair)
          target_removed.update(s.get('targeted_players_removed_in_shadow',[]))
        assert seen==set(range(1,29)) and len(seen_pairs)==25 and max(counts.values())==2
        assert set(target_removed)==set(summary['original_high_priority_players_removed_in_shadow'])==set(PRIORITY)

        removed_slots=[{'slot':s['slot'],'removed_priority':s['targeted_players_removed_in_shadow'],
                        'original':s['original_player_keys'],'optional_shadow':s['candidate_player_keys']}
                       for s in slots if s.get('targeted_players_removed_in_shadow')]
        assert len(removed_slots)==4, f'STOP unexpected number of priority-removal ballots: {len(removed_slots)}'
        retain_priority=[s for s in slots if s['candidate_player_keys'] and not s.get('targeted_players_removed_in_shadow')]
        assert len(retain_priority)==21 and all(s['classification']!='HOLD_UNRESOLVED' for s in retain_priority)

        unresolved=[{'slot':s['slot'],'original':s['original_player_keys'],
                     'hold_reasons':s['original_hold_reasons'],
                     'source_resolution_required':True,'allowed_voting':False}
                    for s in slots if s['classification']=='HOLD_UNRESOLVED']
        assert [s['slot'] for s in unresolved]==[5,11,21]

        payload={'status':'RESEARCH_ONLY_IDENTITY_AND_TARGET_PRESERVATION_ADJUDICATION',
         'original_slots':28,'original_source_screened_slots':12,
         'optional_coherent_shadow_slots':25, 'priority_reservation_shadow_slots':len(retain_priority),
         'priority_removal_slots_in_optional_shadow':removed_slots,
         'unresolved_slots':unresolved,'identity_evidence':record,
         'secondary_objective_not_proven':True, 'max_cardinality_proven_under_existing_V9_choices':True,
         'no_alias_auto_approval':True, 'owner_approval':False, 'voting_activated':False,
         'publication_authorized':False,'market_or_model_change_authorized':False,
         'note':'Candidate name linkage is not identity resolution; V7 team and position conflicts remain held.',
         'source_hashes':{k:v for k,(p,v) in PIN.items()}}
        (OUT/'RESEARCH_ONLY_v11_identity_and_priority_matrix.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
        lines=['# QF11 V11 — Priority-player identity and ballot preservation review','',
         '**RESEARCH ONLY. No voting, valuations, identity fixes or owner approvals.**','',
         '## Catalog options','',
         '- Full optional V10 mechanical shadow: 25 of 28 slots, but removes 4 priority players.','- Priority-preserving restricted shadow: 21 of 28 slots; excludes the four optional priority-removal slots from consideration, and does NOT clear the original held ballots.','- Untouched V9 source-screened originals: 12 of 28 slots.','- Three fully held original slots: 5, 11 and 21.','',
         '## Four high-priority player removals in optional V10 shadow','',
         '| Slot | Target displaced | Original ballot | Optional V10 ballot |','|---:|---|---|---|']
        for s in removed_slots:lines.append(f"| {s['slot']} | {', '.join(s['removed_priority'])} | {' / '.join(s['original'])} | {' / '.join(s['optional_shadow'])} |")
        lines+=['','## Identity adjudication evidence','',
         '| Player | Crosswalk link | Model pos/team | Source flags | Action |','|---|---|---|---|---|']
        for r in record:
         flags=', '.join(r['v7_review_flags']) or 'No V7 flags'
         lines.append(f"| {r['player']} | {r['name_resolution_class']} ({r['crosswalk_match_count']}) | {r['model_position']}/{r['model_team']} | {flags} | HOLD: owner review |")
        lines+=['','## Three held ballots','']
        for s in unresolved:lines.append(f"- Slot {s['slot']}: {' / '.join(s['original'])}; reasons: {'; '.join(s['hold_reasons'])}")
        lines+=['','## Conditions before a voter-ready catalog','',
         'Verify player identity using stable IDs and authoritative positional/roster evidence; adjudicate code aliases separately from real team changes; separately redesign repeated Bowers–McBride comparisons; preserve scientific target coverage; obtain an independent realism review and explicit owner permission before any poll issuance.','',
         'All QF11 source artifacts remain research only. Frozen published Market Values and the model must not change.']
        (OUT/'RESEARCH_ONLY_v11_owner_decision_notes.md').write_text('\n'.join(lines)+'\n')
        assert {p.name for p in OUT.iterdir()}=={'RESEARCH_ONLY_v11_identity_and_priority_matrix.json','RESEARCH_ONLY_v11_owner_decision_notes.md'}
        for p in OUT.iterdir():
         t=p.read_text()
         assert all(v not in t for v in ('voter_roster_id','sheet_url','raw_ballots')),'STOP voter private data leak'
        print('QF11_V11_PRIORITY_IDENTITY_REVIEW_GREEN '+json.dumps({'catalog_slots':28,'optional_v10_shadow':25,'priority_reservation_shadow':len(retain_priority),'priority_displacements':sorted(target_removed),'unresolved_slots':[s['slot'] for s in unresolved],'specific_identity_rows':len(record),'published_market_unchanged':True,'voting_activated':False},sort_keys=True))
        QF11_V11_SCRIPT
        python3 -m py_compile /tmp/qf11-v11-audit.py
        python3 /tmp/qf11-v11-audit.py
    - name: Run unchanged 14 repository regression groups plus FA and PA selftests
      shell: bash
      run: |-
        set -euo pipefail
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V11_ALL_14_REGRESSIONS_GREEN
    - name: Recheck source pins, zero writes and owner/no-poll gates
      shell: bash
      run: |-
        set -euo pipefail
        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "STOP non-main dispatch"; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ -z "$(git status --porcelain)" ]] || exit 1
        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP drift $1"; exit 1; }; }
        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        echo QF11_V11_IMMUTABLE_SOURCES_GREEN
        python3 - <<'QF11_V11_FINISH'
        from pathlib import Path
        import json
        p=Path('/tmp/qf11-v11-output')
        expected={'RESEARCH_ONLY_v11_identity_and_priority_matrix.json','RESEARCH_ONLY_v11_owner_decision_notes.md'}
        assert {x.name for x in p.iterdir()}==expected,'STOP unexpected outputs'
        s=json.loads((p/'RESEARCH_ONLY_v11_identity_and_priority_matrix.json').read_text())
        assert s['optional_coherent_shadow_slots']==25 and s['priority_reservation_shadow_slots']==21
        assert [x['slot'] for x in s['unresolved_slots']]==[5,11,21]
        assert not s['owner_approval'] and not s['voting_activated'] and not s['publication_authorized']
        assert not s['market_or_model_change_authorized'] and s['no_alias_auto_approval']
        print('QF11_V11_REVIEW_ONLY_HOLD_GREEN research output only, no voter activation or source writes')
        QF11_V11_FINISH
    - name: Archive research-only owner decision evidence (7-day expiration)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v11-RESEARCH-ONLY-identity-priority-decision
        path: /tmp/qf11-v11-output/
        retention-days: 7
        if-no-files-found: error
