name: Package Adjustment V3 - Phase 3D Outcome-Blind Maturity Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install monitor dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard exact maturity monitor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3d_maturity.py)" = "22d1a76ad12c78affa92e2ca16cdd968a343e8b4"

      - name: Guard live V3C1 release and frozen research
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.json)" =             "19966121899d41bdbc754a6a260758cf175b12e2"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.json)" =             "3d4615e590697341ee8c27785d8b22e16b82ac44"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog_manifest.json)" =             "6ecd25f01b758a5ea5bd69f513f775c55fc84d4c"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_voting_release.json)" =             "ae62546cbff5974d895cf43931819b15e7c3a222"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          rel = json.loads((d / "phase3_voting_release.json").read_text())
          assert rel["status"] == "FRESH_CONFIRMATION_VOTING_ACTIVE"
          assert rel["valid_after_utc"] == "2026-09-19T04:47:39.111810+00:00"
          assert rel["vote_namespace"] == "__pkgv3c1__"
          assert rel["catalog_challenge_count"] == 240
          assert rel["research_cell_count"] == 24
          assert rel["challenges_per_cell"] == 10
          assert rel["production_change_authorized"] is False

          html = Path("index.html").read_text(encoding="utf-8")
          assert "PACKAGE_VOTE_V3C1_EXACT_CELL_SAMPLING_V1" in html
          assert "__pkgv3c1__|${id}|${choice}" in html
          assert "__pkgv3c1_meta__|${left}" in html
          assert "__pkgv3c1_schema__|1" in html

          print("PASS: live V3C1 voting release verified.")
          PY

      - name: Verify production remains V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Monitor self-test
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3d_maturity.py --selftest

      - name: Build outcome-blind maturity report
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3d_maturity.py

      - name: Verify aggregate-only output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("/tmp/package-adjustment-v3-phase3d-maturity")
          result = json.loads((out / "phase3d_maturity.json").read_text())
          text = (out / "phase3d_maturity.json").read_text()

          assert result["outcome_blind"] is True
          assert result["model_evaluation_performed"] is False
          assert result["candidate_predictions_read"] is False
          assert result["vote_response_tokens_read"] is False
          assert result["display_orientation_tokens_read"] is False
          assert result["production_changed"] is False
          assert result["contract"]["exact_checkpoints_effective_votes"] == [600, 700, 800]
          assert len(result["current"]["cells"]) == 24

          for token in (
              '"voter_id"',
              '"voter_roster_id"',
              '"choice"',
              '"choice_side"',
              '"displayed_left"',
              '"keep"',
              '"trade"',
              '"cut"',
          ):
              assert token not in text, token

          print("PASS: Phase 3D report is aggregate-only and outcome-blind.")
          PY

      - name: Upload maturity report artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v3-phase3d-maturity
          path: /tmp/package-adjustment-v3-phase3d-maturity/
          if-no-files-found: error
          retention-days: 14

      - name: Final read-only proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: Phase 3D monitor changed no repository files."
