name: Position Weight V2 Phase 3 Historical Calibration

# Research-only historical cross-position utility calibration.
# Tests training-derived POSITION_WEIGHT shrinkage across all four frozen
# Replacement Level V2 families. Global scale is re-fit on training data per
# fold so it cannot select the winning relative weight family.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  historical-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 3 self-test
        run: python3 research/position-weight-v2/position_weight_v2_phase3_historical_calibration.py --selftest

      - name: Build Phase 3 historical calibration
        run: python3 research/position-weight-v2/position_weight_v2_phase3_historical_calibration.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/position-weight-v2/position_weight_v2_phase3_historical_calibration.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/position-weight-v2/position_weight_v2_phase3_historical_calibration.json
          git add research/position-weight-v2/position_weight_v2_phase3_historical_calibration.md
          git diff --staged --quiet || git commit -m "Add Position Weight V2 Phase 3 historical calibration"
          git push
