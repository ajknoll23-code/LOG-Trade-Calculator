      - name: Licensing leak guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '[0-9]+\.[0-9]+@?[A-Z]{2,3}'             research/schedule-utility-v1/schedule_utility_v1_phase1b_audit.json             research/schedule-utility-v1/schedule_utility_v1_phase1b_audit.md; then
            echo "Possible row-level provider matchup leakage detected."
            exit 1
          fi
          echo "PASS: Phase 1B public artifacts contain aggregate-only provider information."

      - name: Prove zero production mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"

          git diff --check
          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"

          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi
          echo "PASS: zero production mutation."

      - name: Commit frozen Phase 1B artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add             research/schedule-utility-v1/schedule_utility_v1_phase1b_private_audit.py             research/schedule-utility-v1/schedule_utility_v1_phase1b_audit.json             research/schedule-utility-v1/schedule_utility_v1_phase1b_audit.md

          if git diff --cached --quiet; then
