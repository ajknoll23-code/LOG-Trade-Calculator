name: CAL26 V1R72 - Exact Live FV Formula Replay and Numerical Sensitivity (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r72-native-js-fv-formula-frozen
  cancel-in-progress: false
jobs:
  native-fv-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Read-only checkout exact deployed index
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Download actual R71 player and live-context evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R71_LIVE_FORMULA_518_PLAYER_CONTEXT_AND_OWNER_REVIEW_FV_HOLD
        run-id: 40101193335
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r72-inputs/R71
    - name: Execute deployed native JS playerValue exactly and report stress only
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_R72_engine.py\" <<'PY_R72_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 R72: exact deployed JS FV formula replay, local numerical sensitivity, no reprice authorization.\"\"\"\nimport argparse,csv,hashlib,json,pathlib,re,subprocess,sys,collections,math\nROOT=pathlib.Path\nPINS={'CAL26_R71_manifest.json':'32a7b1bdad17ec0d282f405a4d80aa292f5d04384e38bbcfcc44bdd393a24b61','CAL26_R71_518_live_age_role_availability_context_NO_FV.csv':'7ff13d35ae284886e96e7ec0fd7396a1107e5426570fac9c82c2b605268dd17a'}\nINDEX_SHA='5630bb681dd8710f8e45bc5363488f358ce9ebe2'\nCONSTS=['POSITION_WEIGHT','AGE_CURVE','ROLE_MULT','PROD_MULT_DATA','NO_REAL_PRODUCTION_HISTORY','CAL22_LEGACY_MONOTONE_KEYS','RB_BIRTH_DATE_DATA','PLAYER_DB','CAL26_FV_OWNER_ANCHORS']\nFUNCS=['normalizeName','productionMultiplier','ageMultiplier','fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier','effectiveAgeMultiplier','playerValue']\nSCALARS=['QB_POST_PEAK_FLOOR','LB_POST_PEAK_DECAY_POWER']\n\
        POS=('QB','RB','WR','TE','DL','LB','DB')\ndef req(p,msg):\n if not p:raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\ndef blobsha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()\ndef closing_brace(s,op):\n depth=0;i=op;state='code'\n while i<len(s):\n  c=s[i];n=s[i+1] if i+1<len(s) else ''\n  if state=='code':\n   if c in \"\\\"'`\":state=c\n   elif c=='/' and n=='/':state='line';i+=1\n   elif c=='/' and n=='*':state='block';i+=1\n   elif c=='{':depth+=1\n   elif c=='}':\n    depth-=1\n    if depth==0:return i\n  elif state=='line':\n   if c=='\\n':state='code'\n  elif state=='block':\n   if c=='*' and n=='/':state='code';i+=1\n  elif c=='\\\\':i+=1\n  elif c==state:state='code'\n  i+=1\n raise AssertionError('UNBALANCED_SOURCE_BRACES')\ndef extract_js(s,typ,name):\n if typ=='const':\n  mat=re.search(r'(?m)^const '+re.escape(name)+r'\\s*=\\s*\\{',s)\n  req(mat is not None,'MISSING_CONST_'+name)\n  end=closing_brace(s,mat.end()-1);req(s[end+1:end+2]==';','CONST_MISSING_SEMICOLON_'+name)\n\
        \  return s[mat.start():end+2]+'\\n'\n if typ=='scalar':\n  mat=re.search(r'(?m)^const '+re.escape(name)+r'\\s*=\\s*[^;\\n]+;',s)\n  req(mat is not None,'MISSING_SCALAR_'+name);return mat.group()+'\\n'\n mat=re.search(r'(?m)^function '+re.escape(name)+r'\\(',s)\n req(mat is not None,'MISSING_FUNC_'+name)\n end=s.find('\\n}',mat.end());req(end>mat.end(),'FUNC_END_'+name)\n return s[mat.start():end+2]+'\\n'\ndef js_bundle(s):\n pieces=[extract_js(s,'const',v) for v in CONSTS]+[extract_js(s,'scalar',v) for v in SCALARS]\n pieces += ['const PROD_MULT = PROD_MULT_DATA;\\n']\n pieces += [extract_js(s,'func',v) for v in FUNCS]\n req('return Math.round(100 * pw * am * rm * 55);' in pieces[-1], 'PLAYER_VALUE_FORMULA_DRIFT')\n return '\\n'.join(pieces)\nNODE_RUNNER=r'''const fs = require('fs');\nconst vm = require('vm');\nconst obj = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));\nconst fixture = obj.fixture === true;\nconst body = obj.bundle + `\\nconst cal26Rows = ${JSON.stringify(obj.rows)};\\\
        n` + `\ncal26Rows.map(row => {\n  const name = row.name;\n  let key = normalizeName(name);\n  let x = PLAYER_DB[key];\n  if(!x){\n    const norm = q => q.toLowerCase().replace(/[^a-z0-9]/g,'');\n    const candidates = Object.keys(PLAYER_DB).filter(k => norm(k)===norm(name) && PLAYER_DB[k].pos===row.position);\n    if(candidates.length!==1) throw Error('NO_UNAMBIGUOUS_DB_PLAYER_'+name);\n    key=candidates[0];x=PLAYER_DB[key];\n  }\n  const quoteName = key;\n  if (x.pos !== row.position) throw Error('POS_MISMATCH_'+name);\n  const age = x.age, role = x.role;\n  const before = playerValue(x.pos,age,role,quoteName);\n  const raw = Object.prototype.hasOwnProperty.call(PROD_MULT,key) ? PROD_MULT[key] : null;\n  const rm = productionMultiplier(quoteName,role);\n  const am = effectiveAgeMultiplier(x.pos,age,role,quoteName,rm,raw);\n  const ownerAnchorActive = Object.prototype.hasOwnProperty.call(CAL26_FV_OWNER_ANCHORS,key) &&\n       PLAYER_DB[key].pos === x.pos && PLAYER_DB[key].age ===\
        \ age && PLAYER_DB[key].role === role;\n  const withoutOwnerAnchor = Math.round(100 * (POSITION_WEIGHT[x.pos]??1) * am * rm * 55);\n  let plus1pct = null, minus1pct = null;\n  if (raw !== null) {\n    PROD_MULT[key] = raw*1.01;\n    plus1pct = playerValue(x.pos,age,role,quoteName);\n    PROD_MULT[key] = raw*0.99;\n    minus1pct = playerValue(x.pos,age,role,quoteName);\n    PROD_MULT[key] = raw;\n    if(playerValue(x.pos,age,role,quoteName)!==before)throw Error('PROD_MUTATION_RESTORE_'+key);\n  }\n  return {name,production_canonical_key:key,position:x.pos,age,role,raw_prod_mult:raw,effective_prod_mult:rm,age_mult:am,\n      position_weight:POSITION_WEIGHT[x.pos],deployed_js_formula_replay_FV:before,\n      owner_anchor_active:ownerAnchorActive,without_anchor_formula_fv:withoutOwnerAnchor,\n      plus_1pct_raw_prod_mult_FV_STRESS:plus1pct,minus_1pct_raw_prod_mult_FV_STRESS:minus1pct};\n});`;\nconst result = vm.runInNewContext(body, {}, {timeout: 15000, filename: 'pinned-index.js'});\n\
        process.stdout.write(JSON.stringify(result));\n'''\ndef writecsv(p,rows):\n with p.open('w',newline='',encoding='utf8') as f:\n  w=csv.DictWriter(f,list(rows[0]),extrasaction='ignore',lineterminator='\\n');w.writeheader();w.writerows(rows)\ndef main(args):\n inp=ROOT(args.r71);repo=ROOT(args.repo);out=ROOT(args.out);out.mkdir(parents=True,exist_ok=True)\n for f,h in PINS.items():\n  b=(inp/f).read_bytes();req(args.fixture or sha(b)==h,'R71_INPUT_SHA_DRIFT_'+f)\n m=json.loads((inp/'CAL26_R71_manifest.json').read_text());req(m['status']=='LIVE_FORMULA_CONTEXT_JOIN__FUTURE_PRODUCTION_TRANSFER_FV_HOLD' and m['player_count']==518 and not m['production_change_authorized'],'R71_RELEASE_CONTRACT')\n rows=list(csv.DictReader((inp/'CAL26_R71_518_live_age_role_availability_context_NO_FV.csv').open()))\n req(len(rows)==518 and all(x['price_change_authorized']=='False' for x in rows),'R71_ROWS_INVALID')\n b=(repo/'index.html').read_bytes()\n req(args.fixture or blobsha(b)==INDEX_SHA,'PRODUCTION_INDEX_BLOB_DRIFT')\n\
        \ program=js_bundle(b.decode('utf8'))\n jpath=out/'node_inputs.json';jpath.write_text(json.dumps({'bundle':program,'rows':[{'name':x['name'],'position':x['position']} for x in rows],'fixture':args.fixture}))\n script=out/'node_runner.cjs';script.write_text(NODE_RUNNER)\n res=subprocess.run(['node',str(script),str(jpath)],capture_output=True,text=True,timeout=25)\n jpath.unlink(missing_ok=True);script.unlink(missing_ok=True)\n req(res.returncode==0,'NODE_REPLAY_FAILURE_'+res.stderr[:500])\n replay=json.loads(res.stdout);req(len(replay)==518,'LIVE_REPLAY_COVERAGE_INVALID')\n by={(r['name'],r['position']):r for r in replay};records=[]\n for x in rows:\n  z=by[(x['name'],x['position'])];fv=int(x['frozen_FV_REFERENCE_UNCHANGED']);native=int(z['deployed_js_formula_replay_FV']);gap=native-fv\n  raw=z['raw_prod_mult'];minor=z['minus_1pct_raw_prod_mult_FV_STRESS'];plus=z['plus_1pct_raw_prod_mult_FV_STRESS']\n  rec={'name':x['name'],'position':x['position'],'age':z['age'],'role':z['role'],\n\
        \   'production_canonical_key':z['production_canonical_key'],\n   'frozen_reference_FV_UNCHANGED':fv,'exact_production_JS_replayed_FV':native,'reference_minus_live_replay_FV':fv-native,\n   'replayed_quote_diff_over_5pts':abs(gap)>5,'owner_anchor_protects_quote':z['owner_anchor_active'],\n   'underlying_unanchored_live_formula_FV':z['without_anchor_formula_fv'],\n   'raw_production_multiplier_current':raw if raw is not None else '',\n   'effective_production_multiplier_current':z['effective_prod_mult'],\n   'position_weight_current':z['position_weight'],'age_multiplier_current':round(z['age_mult'],8),\n   'plus_1pct_raw_production_mult_FV_MATH_STRESS_ONLY':plus if plus is not None else '',\n   'minus_1pct_raw_production_mult_FV_MATH_STRESS_ONLY':minor if minor is not None else '',\n   '1pct_raw_mult_sensitivity_nonzero':False if plus is None else plus!=native or minor!=native,\n   '2026_ROS_scoring_compatible_year0_forecast_POINTS_NOT_FV':x['R70_2026_full_year_research_POINTS'],\n\
        \   'six_week_availability_class':x['classification'],\n   'R61_H1_H2_unvalidated':x['R61_has_H1_H2_UNVALIDATED'],\n   'no_2026_2027_fv_conversion_validated':True,'actual_proposed_new_price':'','price_change_authorized':False}\n  records.append(rec)\n req(len(records)==518 and sum(r['owner_anchor_protects_quote'] for r in records)==15,'ANCHOR_REPLAY_DRIFT')\n req(all(r['actual_proposed_new_price']=='' and not r['price_change_authorized'] for r in records),'PRICE_BLOCKED')\n # No assertion of parity: the existing frozen quote may differ from the live formula; diagnose rather than suppress.\n posrows=[]\n for pos in POS:\n  a=[x for x in records if x['position']==pos]\n  posrows.append({'position':pos,'players':len(a),'abs_replay_quote_delta_over5':sum(x['replayed_quote_diff_over_5pts'] for x in a),\n    'mean_abs_frozen_live_gap':round(sum(abs(x['reference_minus_live_replay_FV']) for x in a)/len(a),2),\n    'owner_anchors':sum(x['owner_anchor_protects_quote'] for x in a),\n    'players_with_measurable_native_plus_minus_1pct_effect':sum(x['1pct_raw_mult_sensitivity_nonzero']\
        \ for x in a),\n    'price_change_authorized':False})\n review=sorted(records,key=lambda r:(not r['replayed_quote_diff_over_5pts'],-abs(r['reference_minus_live_replay_FV']),r['name']))[:40]\n reports={'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv':records,\n 'CAL26_R72_7_position_live_replay_parity.csv':posrows,\n 'CAL26_R72_40_quote_diagnostic_review_NOT_FV_PROPOSALS.csv':review}\n for n,r in reports.items():writecsv(out/n,r)\n count=sum(x['replayed_quote_diff_over_5pts'] for x in records)\n lines=['# CAL26 V1R72 \u2014 exact deployed JavaScript FV formula replay','',\n '**Research only. No quote writes, no 20\xD7 proxy, no new production multiplier fitted.**','',\n f'Git blob pinned: `{blobsha(b)}`. Players: 518; owner-anchored: 15.',\n f'Frozen reference vs exact JS recomputation differed by >5 FV points for **{count}** players. **Differences are a diagnostic, not price recommendations.**','',\n '| Position | Players | Replayed quote differences >5\
        \ | Anchored |',\n '|---|---:|---:|---:|']\n for x in posrows:lines.append(f\"| {x['position']} | {x['players']} | {x['abs_replay_quote_delta_over5']} | {x['owner_anchors']} |\")\n lines+=['','## Interpretation','',\n 'This executes the original pinned `playerValue` function and related production, age, RB interpolation, and owner-anchor logic in a Node VM. It uses source `PLAYER_DB` and `PROD_MULT` exactly as deployed.',\n 'The \xB11% multiplier sensitivity is an **instrumental finite-difference calculation**, not an empirical pricing forecast, proposed adjustment, or a recommended multiplier.',\n 'The Week6-to-ROS model supplies 2026 single-season LOG point expectations; a reliable ROS-to-PROD_MULT update equation and multi-season value identification do not yet exist.',\n 'The 15 exact-price owner anchors override standard formula changes. They require separate decision if ever touched.',\n 'An absent player, an old projection or a temporary production drought cannot independently\
        \ justify a value cut.',\n 'No updates to `index.html`, market values, owner anchors or FV.','',\n '**Next measurable step:** backtest a specific future-scoring and production-multiplier update rule out-of-time; only then submit an explicit limited candidate price diff for owner approval.','']\n (out/'CAL26_R72_decision.md').write_text('\\n'.join(lines))\n names=[*reports,'CAL26_R72_decision.md']\n manifest={'semantic_status':'EXACT_PRODUCTION_JS_REPLAY_AND_NATIVE_MULT_SENSITIVITY__PRICE_HOLD',\n  'n_players':518,'n_owner_anchors':15,'n_replay_reference_differences_gt5':count,\n  'formula_source_blob_sha1':blobsha(b),'base_quote_native_js_replayed':True,\n  'plus_minus_1pct_stress_is_not_validated_price_model':True,\n  'future_2026_actual_stats_read':False,'market_votes_as_labels':False,\n  'model_to_live_production_multiplier_calibrated':False,'production_change_authorized':False,'no_index_writes':True,\n  'output_sha256':{n:sha((out/n).read_bytes()) for n in names}}\n (out/'CAL26_R72_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\\
        n')\n print(json.dumps({k:v for k,v in manifest.items() if k!='output_sha256'},indent=2));return manifest\n\ndef selftest():\n fake='''const POSITION_WEIGHT = {QB:1.3,RB:.89,WR:1,TE:.82,DL:.93,LB:1.12,DB:.87};\nconst AGE_CURVE = { QB:{peakStart:26,peakEnd:33,floor:35},RB:{peakStart:23,peakEnd:25,floor:30} \n};\nconst ROLE_MULT = { Elite:1.4,'Every-Down':1.15\n};\nconst PROD_MULT_DATA = {'bryce young':.75\n};\nconst NO_REAL_PRODUCTION_HISTORY = {\n};\nconst CAL22_LEGACY_MONOTONE_KEYS = {\n};\nconst RB_BIRTH_DATE_DATA = {\n};\nconst PLAYER_DB = {'bryce young':{pos:'QB',age:25,role:'Every-Down'}\n};\nconst CAL26_FV_OWNER_ANCHORS = {\n};\nconst QB_POST_PEAK_FLOOR = .546;\nconst LB_POST_PEAK_DECAY_POWER = .5;\nfunction normalizeName(s){\nreturn s.trim().toLowerCase().replace(/[.'\u2019-]/g,'').replace(/\\\\s+/g,' ');\n}\nfunction productionMultiplier(n,r){\nreturn PROD_MULT[normalizeName(n)]??ROLE_MULT[r];\n}\nfunction ageMultiplier(pos, age, role, realProduction, rawProduction){\nreturn\
        \ 1;\n}\nfunction fractionalAgeFromBirthDate(b,f){\nreturn f;\n}\nfunction rbMonotoneAgeAnchor(a,r,p,q){\nreturn 1;\n}\nfunction rbContinuousAgeMultiplier(a,r,p,q){\nreturn 1;\n}\nfunction effectiveAgeMultiplier(pos,age,role,name,r,raw){\nreturn 1;\n}\nfunction playerValue(pos, age, role, name){\nconst key=normalizeName(name);const pw=POSITION_WEIGHT[pos];const rm=productionMultiplier(name,role);const rawRm=PROD_MULT[key]??null;const am=effectiveAgeMultiplier(pos,age,role,name,rm,rawRm);return Math.round(100 * pw * am * rm * 55);\n}'''\n bundle=js_bundle(fake)\n p=ROOT('/tmp/r72-selftest');p.mkdir(exist_ok=True)\n (p/'test.json').write_text(json.dumps({'bundle':bundle,'rows':[{'name':'bryce young','position':'QB'}],'fixture':True}))\n (p/'runner.cjs').write_text(NODE_RUNNER)\n r=subprocess.run(['node',str(p/'runner.cjs'),str(p/'test.json')],capture_output=True,text=True)\n req(r.returncode==0,'JS_FIXTURE_FAIL_'+r.stderr[:300]);a=json.loads(r.stdout)[0]\n req(a['deployed_js_formula_replay_FV']==5363,'JS_FORMULA_NUMERICAL_TEST')\n\
        \ req(a['plus_1pct_raw_prod_mult_FV_STRESS']>a['deployed_js_formula_replay_FV']>a['minus_1pct_raw_prod_mult_FV_STRESS'],'FINITE_DIFF_TEST')\n print('R72_SELFTEST_GREEN exact native JS path, anchored layout, multiplier finite differences')\nif __name__=='__main__':\n p=argparse.ArgumentParser();p.add_argument('--r71');p.add_argument('--repo');p.add_argument('--out');p.add_argument('--fixture',action='store_true');p.add_argument('--selftest',action='store_true');a=p.parse_args()\n if a.selftest:selftest()\n else:main(a)\n\nPY_R72_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_R72_engine.py\"\npython \"$RUNNER_TEMP/CAL26_R72_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_R72_engine.py\" --r71 \"$RUNNER_TEMP/cal26-r72-inputs/R71\" --repo \"$GITHUB_WORKSPACE\" --out \"$RUNNER_TEMP/cal26-r72-results\"\npython - \"$RUNNER_TEMP/cal26-r72-results\" <<'PY_R72_VERIFY'\nimport pathlib,csv,hashlib,json,sys\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R72_manifest.json').read_text())\n\
        assert m['semantic_status']=='EXACT_PRODUCTION_JS_REPLAY_AND_NATIVE_MULT_SENSITIVITY__PRICE_HOLD'\nassert m['n_players']==518 and m['n_owner_anchors']==15\nassert m['formula_source_blob_sha1']=='5630bb681dd8710f8e45bc5363488f358ce9ebe2'\nassert m['base_quote_native_js_replayed'] and not m['model_to_live_production_multiplier_calibrated']\nassert m['plus_minus_1pct_stress_is_not_validated_price_model']\nassert not m['production_change_authorized'] and m['no_index_writes'] and not m['market_votes_as_labels']\nfor name,d in m['output_sha256'].items():\n assert hashlib.sha256((p/name).read_bytes()).hexdigest()==d,(name,'SHA_MISMATCH')\nwith (p/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv').open() as f:rr=list(csv.DictReader(f))\nassert len(rr)==518 and sum(x['owner_anchor_protects_quote']=='True' for x in rr)==15\nassert all(x['actual_proposed_new_price']=='' and x['price_change_authorized']=='False' for x in rr)\nassert not (p/'node_inputs.json').exists()\
        \ and not (p/'node_runner.cjs').exists()\nprint('R72_REAL_LIVE_JS_REPLAY_PINNED_AND_NO_FV_CHANGE_GREEN')\nPY_R72_VERIFY\ntest -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r72-results/CAL26_R72_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload 518 native quote-replay evidence (no proposed prices)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R72_518_NATIVE_FV_FORMULA_REPLAY_AND_SENSITIVITY_FV_HOLD
        path: ${{ runner.temp }}/cal26-r72-results/
        retention-days: 60
        if-no-files-found: warn
