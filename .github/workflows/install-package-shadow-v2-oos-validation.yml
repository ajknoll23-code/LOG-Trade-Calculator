name: Install Package Shadow V2 OOS Validation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write prospective evaluator
        run: |
          echo '' | base64 --decode > scripts/validation/evaluate_package_adjustment_shadow_v2_prospective.py

      - name: Compile and self-test evaluator
        run: |
          python3 -m py_compile scripts/validation/evaluate_package_adjustment_shadow_v2_prospective.py
          python3 scripts/validation/evaluate_package_adjustment_shadow_v2_prospective.py --selftest

      - name: Freeze current Shadow V2 candidate exactly once
        run: |
          echo '' | base64 --decode > /tmp/freeze_shadow_v2_oos.py
          python3 /tmp/freeze_shadow_v2_oos.py

      - name: Initialize prospective OOS validation
        run: |
          python3 scripts/validation/evaluate_package_adjustment_shadow_v2_prospective.py --write
          python3 scripts/validation/evaluate_package_adjustment_shadow_v2_prospective.py --check

      - name: Patch prospective capture workflow
        run: |
          echo '' | base64 --decode > /tmp/patch_prospective_workflow.py
          python3 /tmp/patch_prospective_workflow.py

      - name: Verify installation
        run: |
          echo '' | base64 --decode > /tmp/verify_shadow_v2_oos.py
          python3 /tmp/verify_shadow_v2_oos.py

      - name: Commit prospective validation harness
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add scripts/validation/evaluate_package_adjustment_shadow_v2_prospective.py
          git add research/package-adjustment-shadow-v2/prospective/
          git add .github/workflows/prospective-trade-evidence-capture.yml

          if git diff --cached --quiet; then
            echo "No prospective validation installation changes."
            exit 0
          fi

          git commit -m "Install Package Adjustment Shadow V2 OOS validation"
          git pull --rebase origin main
          git push origin main
