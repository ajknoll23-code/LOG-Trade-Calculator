name: Draft Pick FV V8 - Phase 0I Fleaflicker Draft Scope and R6 Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download and verify exact frozen lineage and identity assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "${RUNNER_TEMP}/lineage/p0a" \
            "${RUNNER_TEMP}/lineage/p0d" \
            "${RUNNER_TEMP}/lineage/p0h1" \
            "${RUNNER_TEMP}/out"

          # Phase 0A exact pre-outcome identity assets.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10894002488" --jq '.digest // ""')" = \
            "sha256:bb24b4ea7378936ea1f8b9504e631f566218a3bdf20297d19d5fe7657de32d5d"
          gh run download 36207166693 \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-prep" \
            -D "${RUNNER_TEMP}/lineage/p0a"

          # Exact MFL baseline: 2018 R6 remains 6/6/6.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10952656904" --jq '.digest // ""')" = \
            "sha256:0c24659a7e085f47876227349c884060714f6efbdc90ef680c26750c4359f1a6"
          gh run download 36378357894 \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0d-targeted-2018-r6-closeout" \
            -D "${RUNNER_TEMP}/lineage/p0d"

          # Corrected Fleaflicker metadata qualification: exactly 8 authorized leagues.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10984970846" --jq '.digest // ""')" = \
            "sha256:a4aed5683f3ebe7ae8e0798aff7e76dcca5a0318959c915af58cdc8819b5cd85"
          gh run download 36453748942 \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0h1-fleaflicker-rules-schema-correction" \
            -D "${RUNNER_TEMP}/lineage/p0h1"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"lineage"
          p0a=root/"p0a"
          p0d=root/"p0d"
          p0h1=root/"p0h1"

          man=json.loads((p0a/"engine"/"r1_r6_identity_asset_manifest_v7.json").read_text())
          assert man["stage"]=="v7_phase2_preoutcome_identity_asset_freeze"
          assert hashlib.sha256((p0a/"engine"/"db_playerids.csv").read_bytes()).hexdigest()==\
              "0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
          assert hashlib.sha256((p0a/"engine"/"nflverse_players.csv").read_bytes()).hexdigest()==\
              "4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
          assert hashlib.sha256((p0a/"engine"/"identity_crosswalk.json").read_bytes()).hexdigest()==\
              "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

          s=json.loads((p0d/"v8_phase0d_targeted_2018_r6_source_expansion.json").read_text())
          e=json.loads((p0d/"v8_phase0d_exact_source_identity_evidence.json").read_text())
          assert s["decision"]=="STOP_AND_PREREGISTER_V8_PHASE0E_SECOND_SOURCE_2018_R6_BEFORE_OUTCOMES"
          assert s["phase0d_final_target_counts"]=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }
          assert s["year_cells_passing"]==105
          assert s["historical_outcome_ingestion_authorized"] is False
          assert e["historical_player_outcomes_read"] is False

          h=json.loads((p0h1/"v8_phase0h1_fleaflicker_rules_schema_correction.json").read_text())
          assert h["decision"]=="PROCEED_TO_V8_PHASE0I_FLEAFLICKER_DRAFT_SCOPE_AND_R6_PROBE"
          assert h["candidate_n"]==46
          assert h["candidate_ids_sha256"]=="4d2a4420a7ab49314b0b1240e48c81cf979138d9eadd172715949182e015ba0f"
          assert h["prequalified_metadata_only_league_n"]==8
          assert h["prequalified_metadata_only_league_ids"]==[
              "89683","187110","326323","334232",
              "200615","190844","173472","191246",
          ]
          assert h["minimum_required_for_phase0i"]==6
          assert h["unresolved"]["combined_n"]==0
          assert h["fleaflicker_draft_board_read"] is False
          assert h["fleaflicker_draft_pick_read"] is False
          assert h["historical_player_outcomes_read"] is False
          assert h["holdout_2024_outcomes_read"] is False
          assert h["production_change_authorized"] is False

          print("PASS: exact Phase 0I authorization, 6/6/6 baseline, and frozen identity assets verified.")
          PY

      - name: Probe exact eight Fleaflicker leagues and deterministically reduce R6
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import time
          import unicodedata
          from collections import Counter, defaultdict
          from pathlib import Path
          from typing import Any

          import requests

          ROOT=Path(os.environ["RUNNER_TEMP"])
          LINEAGE=ROOT/"lineage"
          P0A=LINEAGE/"p0a"
          P0D=LINEAGE/"p0d"
          P0H1=LINEAGE/"p0h1"
          OUT=ROOT/"out"

          YEAR=2018
          API_BASE="https://www.fleaflicker.com/api"
          ENDPOINT="FetchLeagueDraftBoard"

          TARGETS={
              "r6_early":(61,62,63,64),
              "r6_mid":(65,66,67,68),
              "r6_late":(69,70,71,72),
          }

          REQUIRED_TOTAL_PER_CELL=12
          BASELINE_N_EACH=6
          REQUIRED_ADDITIONAL_PER_CELL=6

          # Frozen before any board call.
          DRAFT_NUMBERS=(1,2,3,4,5,6)
          ROOKIE_SCOPE_SLOT_MIN=1
          ROOKIE_SCOPE_SLOT_MAX=72
          MIN_ROOKIE_SCOPE_CLASSIFICATION_COVERAGE=0.95
          MIN_ROOKIE_SCOPE_RESOLVED_N=math.ceil(
              (ROOKIE_SCOPE_SLOT_MAX-ROOKIE_SCOPE_SLOT_MIN+1)
              * MIN_ROOKIE_SCOPE_CLASSIFICATION_COVERAGE
          )
          assert MIN_ROOKIE_SCOPE_RESOLVED_N==69

          # With exactly eight candidate leagues and six needed, at most two
          # entire leagues can remain transport/schema unresolved.
          MAX_UNRESOLVED_LEAGUES=2

          SENTINELS={"","0","0000","----","NA","N/A","NULL","NONE","NAN"}

          def stable_id(x: Any):
              s=str(x or "").strip()
              if not s or s.upper() in SENTINELS:
                  return None
              return s

          def safe_int(x: Any):
              try:
                  s=str(x).strip()
              except Exception:
                  return None
              if not re.fullmatch(r"[+-]?\d+",s):
                  return None
              try:
                  return int(s)
              except ValueError:
                  return None

          def clean_name(x: Any) -> str:
              s=str(x or "").strip()
              if "," in s:
                  bits=[z.strip() for z in s.split(",",1)]
                  if len(bits)==2 and bits[0] and bits[1]:
                      s=bits[1]+" "+bits[0]
              s=unicodedata.normalize("NFKD",s)
              s="".join(ch for ch in s if not unicodedata.combining(ch))
              s=s.lower()
              s=re.sub(r"\b(jr|sr|ii|iii|iv|v)\b\.?"," ",s)
              s=s.replace("'","").replace("’","")
              s=re.sub(r"[^a-z0-9]+"," ",s)
              return re.sub(r"\s+"," ",s).strip()

          def norm_position(x: Any) -> str:
              s=str(x or "").strip().upper()
              return {
                  "DE":"DL","DT":"DL","NT":"DL","EDGE":"DL",
                  "ILB":"LB","OLB":"LB",
                  "CB":"DB","S":"DB","FS":"DB","SS":"DB",
              }.get(s,s)

          def unique_by_stable(rows,fields):
              stable={}
              for row in rows:
                  key=tuple(row.get(f) for f in fields)
                  if not any(key):
                      continue
                  stable[key]=row
              return next(iter(stable.values())) if len(stable)==1 else None

          def sha_ids(values):
              return hashlib.sha256("\n".join(str(x) for x in values).encode()).hexdigest()

          def canonical_sha(obj):
              return hashlib.sha256(
                  json.dumps(obj,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
              ).hexdigest()

          # -------- Frozen identity indexes --------
          dp_path=P0A/"engine"/"db_playerids.csv"
          nv_path=P0A/"engine"/"nflverse_players.csv"
          fp_path=P0A/"engine"/"identity_crosswalk.json"

          dp_by_name_pos_year=defaultdict(list)
          dp_by_gsis=defaultdict(list)
          class_years_by_name_pos=defaultdict(set)

          with dp_path.open(newline="",encoding="utf-8-sig") as f:
              reader=csv.DictReader(f)
              required={"gsis_id","sleeper_id","name","merge_name","position","draft_year"}
              assert required.issubset(reader.fieldnames or []),required-set(reader.fieldnames or [])
              for row in reader:
                  rec={
                      "gsis_id":stable_id(row.get("gsis_id")),
                      "sleeper_id":stable_id(row.get("sleeper_id")),
                      "name":stable_id(row.get("name")),
                      "merge_name":stable_id(row.get("merge_name")),
                      "position":stable_id(row.get("position")),
                      "draft_year":safe_int(row.get("draft_year")),
                  }
                  nm=clean_name(rec["merge_name"] or rec["name"])
                  pos=norm_position(rec["position"])
                  dy=rec["draft_year"]
                  if nm and pos and dy is not None:
                      dp_by_name_pos_year[(nm,pos,int(dy))].append(rec)
                      class_years_by_name_pos[(nm,pos)].add(int(dy))
                  if rec["gsis_id"]:
                      dp_by_gsis[rec["gsis_id"]].append(rec)

          nv_by_name_pos_year=defaultdict(list)
          with nv_path.open(newline="",encoding="utf-8-sig") as f:
              reader=csv.DictReader(f)
              required={"gsis_id","display_name","position","rookie_season"}
              assert required.issubset(reader.fieldnames or []),required-set(reader.fieldnames or [])
              for row in reader:
                  gsis=stable_id(row.get("gsis_id"))
                  name=stable_id(row.get("display_name"))
                  pos_raw=stable_id(row.get("position"))
                  rookie=safe_int(row.get("rookie_season"))
                  nm=clean_name(name)
                  pos=norm_position(pos_raw)
                  if gsis and nm and pos and rookie is not None:
                      rec={
                          "gsis_id":gsis,
                          "name":name,
                          "position":pos_raw,
                          "draft_year":int(rookie),
                      }
                      nv_by_name_pos_year[(nm,pos,int(rookie))].append(rec)
                      class_years_by_name_pos[(nm,pos)].add(int(rookie))

          fp_obj=json.loads(fp_path.read_text())
          assert isinstance(fp_obj,list)
          fp_by_name_pos=defaultdict(list)
          for row in fp_obj:
              if not isinstance(row,dict):
                  continue
              sid=stable_id(row.get("sleeper_id"))
              nm=clean_name(row.get("name"))
              pos=norm_position(row.get("fp_position") or row.get("sleeper_pos"))
              if sid and nm and pos and not row.get("requires_manual_review",False):
                  fp_by_name_pos[(nm,pos)].append({
                      "sleeper_id":sid,
                      "name":row.get("name"),
                      "position":row.get("fp_position") or row.get("sleeper_pos"),
                  })

          def sleeper_for_gsis(gsis):
              if not gsis:
                  return None
              ids={
                  row["sleeper_id"]
                  for row in dp_by_gsis.get(gsis,[])
                  if row.get("sleeper_id")
              }
              return next(iter(ids)) if len(ids)==1 else None

          def resolve_current_year_identity(name,pos_raw):
              nm=clean_name(name)
              pos=norm_position(pos_raw)
              key=(nm,pos,YEAR)

              nv=unique_by_stable(
                  nv_by_name_pos_year.get(key,[]),
                  ("gsis_id",),
              )
              fp=unique_by_stable(
                  fp_by_name_pos.get((nm,pos),[]),
                  ("sleeper_id",),
              )
              if fp is not None and nv is not None:
                  return {
                      "identity_resolved":True,
                      "outcome_ready_sleeper_id":True,
                      "identity_method":"fantasypros_sleeper_crosswalk_nflverse_class_corroborated",
                      "gsis_id":nv["gsis_id"],
                      "sleeper_id":fp["sleeper_id"],
                      "identity_draft_class":YEAR,
                      "normalized_name":nm,
                      "normalized_position":pos,
                  }

              if nv is not None:
                  sid=sleeper_for_gsis(nv["gsis_id"])
                  return {
                      "identity_resolved":True,
                      "outcome_ready_sleeper_id":bool(sid),
                      "identity_method":"nflverse_name_position_draft_class",
                      "gsis_id":nv["gsis_id"],
                      "sleeper_id":sid,
                      "identity_draft_class":YEAR,
                      "normalized_name":nm,
                      "normalized_position":pos,
                  }

              dp=unique_by_stable(
                  dp_by_name_pos_year.get(key,[]),
                  ("gsis_id","sleeper_id"),
              )
              if dp is not None:
                  return {
                      "identity_resolved":True,
                      "outcome_ready_sleeper_id":bool(dp.get("sleeper_id")),
                      "identity_method":"dynastyprocess_name_position_draft_class",
                      "gsis_id":dp.get("gsis_id"),
                      "sleeper_id":dp.get("sleeper_id"),
                      "identity_draft_class":YEAR,
                      "normalized_name":nm,
                      "normalized_position":pos,
                  }

              return {
                  "identity_resolved":False,
                  "outcome_ready_sleeper_id":False,
                  "identity_method":"unresolved_current_year",
                  "gsis_id":None,
                  "sleeper_id":None,
                  "identity_draft_class":None,
                  "normalized_name":nm,
                  "normalized_position":pos,
              }

          def classify_draft_class(name,pos_raw):
              nm=clean_name(name)
              pos=norm_position(pos_raw)
              years=sorted(class_years_by_name_pos.get((nm,pos),set()))
              if len(years)==1:
                  return {
                      "class_status":"unique",
                      "identity_draft_class":years[0],
                      "candidate_draft_years":years,
                  }
              if len(years)>1:
                  return {
                      "class_status":"ambiguous",
                      "identity_draft_class":None,
                      "candidate_draft_years":years,
                  }
              return {
                  "class_status":"unresolved",
                  "identity_draft_class":None,
                  "candidate_draft_years":[],
              }

          # -------- Fleaflicker draft-board parser --------
          def get_any(obj,*keys):
              if not isinstance(obj,dict):
                  return None
              for k in keys:
                  if k in obj:
                      return obj[k]
              return None

          def parse_board(obj,draft_number):
              raw=get_any(obj,"orderedSelections","ordered_selections")
              if raw is None:
                  raw=[]
              if not isinstance(raw,list):
                  return {
                      "draft_number":draft_number,
                      "status":"schema_unrecognized",
                      "top_level_keys":sorted(str(k) for k in obj.keys()),
                      "rows":[],
                  }

              rows=[]
              for raw_index,sel in enumerate(raw):
                  if not isinstance(sel,dict):
                      continue

                  slot=get_any(sel,"slot")
                  player=get_any(sel,"player")
                  team=get_any(sel,"team")

                  pro=get_any(player or {},"proPlayer","pro_player")
                  if not isinstance(pro,dict):
                      pro={}

                  overall=safe_int(get_any(slot or {},"overall"))
                  round_no=safe_int(get_any(slot or {},"round"))
                  within=safe_int(get_any(slot or {},"slot","pick"))

                  name=get_any(pro,"nameFull","name_full","name")
                  position=get_any(pro,"position")
                  flea_player_id=stable_id(get_any(pro,"id"))

                  rows.append({
                      "raw_index":raw_index,
                      "overall_slot":overall,
                      "round":round_no,
                      "within_round_pick":within,
                      "fleaflicker_player_id":flea_player_id,
                      "player_name":stable_id(name),
                      "position":stable_id(position),
                      "franchise_id":stable_id(get_any(team or {},"id")),
                      "franchise_name":stable_id(get_any(team or {},"name")),
                  })

              board={
                  "draft_number":draft_number,
                  "status":"observed",
                  "top_level_keys":sorted(str(k) for k in obj.keys()),
                  "row_n":len(rows),
                  "rows":rows,
              }
              board["board_signature_sha256"]=canonical_sha([
                  {
                      "overall_slot":x["overall_slot"],
                      "round":x["round"],
                      "within_round_pick":x["within_round_pick"],
                      "fleaflicker_player_id":x["fleaflicker_player_id"],
                      "player_name":x["player_name"],
                      "position":x["position"],
                  }
                  for x in rows
              ])
              return board

          def structural_72(board):
              rows=board["rows"]
              by_slot=defaultdict(list)
              for x in rows:
                  s=x.get("overall_slot")
                  if isinstance(s,int) and 1<=s<=72:
                      by_slot[s].append(x)

              missing=[s for s in range(1,73) if len(by_slot.get(s,[]))==0]
              duplicate=[s for s in range(1,73) if len(by_slot.get(s,[]))>1]
              grid_bad=[]
              ordered=[]
              for s in range(1,73):
                  xs=by_slot.get(s,[])
                  if len(xs)!=1:
                      continue
                  x=xs[0]
                  expected_round=(s-1)//12+1
                  expected_within=(s-1)%12+1
                  if x["round"]!=expected_round or x["within_round_pick"]!=expected_within:
                      grid_bad.append({
                          "overall_slot":s,
                          "observed_round":x["round"],
                          "observed_within":x["within_round_pick"],
                          "expected_round":expected_round,
                          "expected_within":expected_within,
                      })
                  ordered.append(x)

              return {
                  "full_72":not missing and not duplicate and not grid_bad and len(ordered)==72,
                  "missing_slots":missing,
                  "duplicate_slots":duplicate,
                  "grid_mismatch":grid_bad,
                  "ordered_rows":ordered,
              }

          def rookie_scope(board):
              st=structural_72(board)
              if not st["full_72"]:
                  return {
                      "pass":False,
                      "reason":"not_structural_full_72",
                      "structural":st,
                      "classified_n":0,
                      "same_year_n":0,
                      "contamination_n":0,
                      "unresolved_n":72,
                      "coverage":0.0,
                      "classifications":[],
                  }

              classifications=[]
              counts=Counter()
              contamination=[]
              for x in st["ordered_rows"]:
                  c=classify_draft_class(x["player_name"],x["position"])
                  row={
                      "overall_slot":x["overall_slot"],
                      "player_name":x["player_name"],
                      "position":x["position"],
                      **c,
                  }
                  classifications.append(row)
                  if c["class_status"]=="unique":
                      counts["classified"]+=1
                      if c["identity_draft_class"]==YEAR:
                          counts["same_year"]+=1
                      else:
                          counts["contamination"]+=1
                          contamination.append(row)
                  else:
                      counts["unresolved"]+=1

              coverage=counts["classified"]/72
              passed=(
                  counts["classified"]>=MIN_ROOKIE_SCOPE_RESOLVED_N
                  and counts["contamination"]==0
              )
              reason=(
                  "strong_same_year_rookie_scope"
                  if passed else
                  (
                      "resolved_non_2018_contamination"
                      if counts["contamination"]>0 else
                      "insufficient_draft_classification_coverage"
                  )
              )
              return {
                  "pass":passed,
                  "reason":reason,
                  "structural":st,
                  "classified_n":counts["classified"],
                  "same_year_n":counts["same_year"],
                  "contamination_n":counts["contamination"],
                  "unresolved_n":72-counts["classified"],
                  "coverage":coverage,
                  "minimum_resolved_n":MIN_ROOKIE_SCOPE_RESOLVED_N,
                  "minimum_coverage":MIN_ROOKIE_SCOPE_CLASSIFICATION_COVERAGE,
                  "contamination":contamination,
                  "classifications":classifications,
              }

          def target_cell_results(board):
              st=structural_72(board)
              by_slot={
                  x["overall_slot"]:x
                  for x in st["ordered_rows"]
              } if st["full_72"] else {}

              out={}
              for cell,slots in TARGETS.items():
                  occurrences=[]
                  if not st["full_72"]:
                      out[cell]={
                          "status":"structural_reject",
                          "slots":list(slots),
                          "occurrences":[],
                      }
                      continue

                  for s in slots:
                      x=by_slot[s]
                      ident=resolve_current_year_identity(
                          x["player_name"],
                          x["position"],
                      )
                      occurrences.append({
                          "source_provider":"Fleaflicker",
                          "draft_year":YEAR,
                          "cell":cell,
                          "overall_slot":s,
                          "round":x["round"],
                          "within_round_pick":x["within_round_pick"],
                          "fleaflicker_player_id":x["fleaflicker_player_id"],
                          "player_name":x["player_name"],
                          "position":x["position"],
                          "franchise_id":x["franchise_id"],
                          "franchise_name":x["franchise_name"],
                          **ident,
                      })

                  sleeper_ids=[
                      x["sleeper_id"] for x in occurrences
                      if x.get("sleeper_id")
                  ]
                  usable=(
                      len(occurrences)==4
                      and all(x["identity_resolved"] for x in occurrences)
                      and all(x["identity_draft_class"]==YEAR for x in occurrences)
                      and all(x["outcome_ready_sleeper_id"] for x in occurrences)
                      and len(sleeper_ids)==4
                      and len(set(sleeper_ids))==4
                  )
                  out[cell]={
                      "status":"usable" if usable else "identity_reject",
                      "slots":list(slots),
                      "occurrences":occurrences,
                  }
              return out

          def parser_selftest():
              selections=[]
              for s in range(1,73):
                  selections.append({
                      "team":{"id":1,"name":"T"},
                      "slot":{
                          "round":(s-1)//12+1,
                          "slot":(s-1)%12+1,
                          "overall":s,
                      },
                      "player":{
                          "proPlayer":{
                              "id":10000+s,
                              "nameFull":f"Player {s}",
                              "position":"WR",
                              "proTeamAbbreviation":"X",
                          }
                      },
                  })
              b=parse_board({"orderedSelections":selections},1)
              st=structural_72(b)
              assert b["status"]=="observed"
              assert b["row_n"]==72
              assert st["full_72"]
              assert st["ordered_rows"][60]["overall_slot"]==61

              snake=parse_board({
                  "ordered_selections":[{
                      "team":{"id":2},
                      "slot":{"round":1,"slot":1,"overall":1},
                      "player":{"pro_player":{"id":1,"name_full":"X","position":"QB"}},
                  }]
              },2)
              assert snake["row_n"]==1
              assert snake["rows"][0]["player_name"]=="X"

              print("PASS: Phase 0I Fleaflicker draft-board parser self-test.")

          parser_selftest()

          # -------- Exact authorized candidate order --------
          h=json.loads((P0H1/"v8_phase0h1_fleaflicker_rules_schema_correction.json").read_text())
          candidate_ids=list(h["prequalified_metadata_only_league_ids"])
          assert candidate_ids==[
              "89683","187110","326323","334232",
              "200615","190844","173472","191246",
          ]
          assert len(candidate_ids)==8

          # -------- Fetch all preregistered boards before reduction --------
          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Pick-FV-V8-P0I-Fleaflicker-DraftScope-R6/1.0",
              "Accept":"application/json,*/*;q=0.8",
          })

          def fetch_board(lid,draft_number):
              url=f"{API_BASE}/{ENDPOINT}"
              last=None
              for attempt in range(6):
                  try:
                      r=session.get(
                          url,
                          params={
                              "sport":"NFL",
                              "league_id":int(lid),
                              "season":YEAR,
                              "draft_number":draft_number,
                          },
                          timeout=35,
                      )
                      if r.status_code in {404}:
                          return {"_phase0i_no_draft_http_status":404}
                      if r.status_code in {429,500,502,503,504}:
                          raise requests.HTTPError(f"HTTP {r.status_code}",response=r)
                      r.raise_for_status()
                      obj=r.json()
                      if not isinstance(obj,dict):
                          raise RuntimeError("non-object draft board JSON")
                      time.sleep(0.20)
                      return obj
                  except Exception as exc:
                      last=exc
                      if attempt==5:
                          break
                      time.sleep(min(2**attempt,12))
              raise RuntimeError(
                  f"Fleaflicker board transport exhausted lid={lid} "
                  f"draft_number={draft_number}: {type(last).__name__}: {last}"
              )

          evidence=[]
          for scan_index,lid in enumerate(candidate_ids,1):
              rec={
                  "scan_index":scan_index,
                  "league_id":lid,
                  "provider_league_id":f"fleaflicker:{lid}",
                  "draft_number_evidence":[],
                  "status":"evaluated",
              }
              transport_error=None
              seen_signatures=set()

              for draft_number in DRAFT_NUMBERS:
                  try:
                      obj=fetch_board(lid,draft_number)
                  except Exception as exc:
                      transport_error={
                          "draft_number":draft_number,
                          "failure_class":"fleaflicker_draft_board_transport_exhausted",
                          "error_fingerprint_sha256":
                              hashlib.sha256(str(exc).encode()).hexdigest(),
                      }
                      break

                  if obj.get("_phase0i_no_draft_http_status")==404:
                      rec["draft_number_evidence"].append({
                          "draft_number":draft_number,
                          "status":"no_draft_http_404",
                      })
                      continue

                  board=parse_board(obj,draft_number)
                  if board["status"]=="schema_unrecognized":
                      rec["draft_number_evidence"].append(board)
                      continue

                  if board["row_n"]==0:
                      rec["draft_number_evidence"].append({
                          "draft_number":draft_number,
                          "status":"empty_board",
                          "top_level_keys":board["top_level_keys"],
                          "row_n":0,
                          "board_signature_sha256":board["board_signature_sha256"],
                      })
                      continue

                  if board["board_signature_sha256"] in seen_signatures:
                      rec["draft_number_evidence"].append({
                          "draft_number":draft_number,
                          "status":"duplicate_board_signature",
                          "board_signature_sha256":board["board_signature_sha256"],
                          "row_n":board["row_n"],
                      })
                      continue

                  seen_signatures.add(board["board_signature_sha256"])
                  scope=rookie_scope(board)
                  cells=target_cell_results(board)
                  rec["draft_number_evidence"].append({
                      "draft_number":draft_number,
                      "status":"unique_board",
                      "row_n":board["row_n"],
                      "top_level_keys":board["top_level_keys"],
                      "board_signature_sha256":board["board_signature_sha256"],
                      "rookie_scope":{
                          k:v for k,v in scope.items()
                          if k!="classifications" and k!="structural"
                      },
                      "structural":{
                          "full_72":scope["structural"]["full_72"],
                          "missing_slots":scope["structural"]["missing_slots"],
                          "duplicate_slots":scope["structural"]["duplicate_slots"],
                          "grid_mismatch":scope["structural"]["grid_mismatch"],
                      },
                      "cell_results":cells,
                  })

              if transport_error is not None:
                  rec["status"]="transport_unresolved"
                  rec["transport"]=transport_error
                  evidence.append(rec)
                  continue

              passing=[
                  x for x in rec["draft_number_evidence"]
                  if x.get("status")=="unique_board"
                  and x.get("rookie_scope",{}).get("pass") is True
              ]
              passing=sorted(passing,key=lambda x:int(x["draft_number"]))
              if not passing:
                  rec["status"]="no_strong_rookie_scope_r6_draft"
                  evidence.append(rec)
                  continue

              selected=passing[0]
              rec["status"]="rookie_scope_draft_selected"
              rec["selected_draft_number"]=selected["draft_number"]
              rec["selected_board_signature_sha256"]=selected["board_signature_sha256"]
              rec["selected_rookie_scope"]=selected["rookie_scope"]
              rec["cell_results"]=selected["cell_results"]
              evidence.append(rec)

          assert len(evidence)==8
          assert [x["league_id"] for x in evidence]==candidate_ids

          # -------- Ordered reducer; prefetched evidence cannot change order --------
          p0d_summary=json.loads(
              (P0D/"v8_phase0d_targeted_2018_r6_source_expansion.json").read_text()
          )
          p0d_exact=json.loads(
              (P0D/"v8_phase0d_exact_source_identity_evidence.json").read_text()
          )

          baseline={
              cell:list(p0d_exact["cell_membership_league_ids"][f"2018:{cell}"])
              for cell in TARGETS
          }
          assert {k:len(v) for k,v in baseline.items()}=={
              "r6_early":6,"r6_mid":6,"r6_late":6,
          }

          non_target_before={
              k:list(v)
              for k,v in p0d_exact["cell_membership_league_ids"].items()
              if k not in {f"2018:{cell}" for cell in TARGETS}
          }
          non_target_hash_before=canonical_sha(non_target_before)
          assert len(non_target_before)==105

          additions={cell:[] for cell in TARGETS}
          selected_occurrences=[]
          attempts=[]
          unresolved_leagues=[]
          status_counts=Counter()

          def all_complete():
              return all(
                  len(baseline[cell])+len(additions[cell])>=REQUIRED_TOTAL_PER_CELL
                  for cell in TARGETS
              )

          for rec in evidence:
              if all_complete():
                  break

              lid=rec["league_id"]
              attempt={
                  "scan_index":rec["scan_index"],
                  "league_id":lid,
                  "status":rec["status"],
              }

              if rec["status"]=="transport_unresolved":
                  unresolved_leagues.append(lid)
                  attempt["transport"]=rec["transport"]
                  attempts.append(attempt)
                  status_counts["transport_unresolved"]+=1
                  continue

              if rec["status"]!="rookie_scope_draft_selected":
                  attempts.append(attempt)
                  status_counts[rec["status"]]+=1
                  continue

              source_id=f"fleaflicker:{lid}:draft:{rec['selected_draft_number']}"
              added=[]
              for cell in TARGETS:
                  if len(baseline[cell])+len(additions[cell])>=REQUIRED_TOTAL_PER_CELL:
                      continue
                  c=rec["cell_results"][cell]
                  if c["status"]!="usable":
                      status_counts[f"{cell}:{c['status']}"]+=1
                      continue

                  assert source_id not in additions[cell]
                  rows=[]
                  for row in c["occurrences"]:
                      x=dict(row)
                      x.update({
                          "league_id":source_id,
                          "native_league_id":lid,
                          "draft_number":rec["selected_draft_number"],
                          "identity_resolved":True,
                          "outcome_ready_sleeper_id":True,
                          "source_occurrence_valid_v8":True,
                      })
                      rows.append(x)

                  assert len(rows)==4
                  assert len({x["overall_slot"] for x in rows})==4
                  assert all(x["identity_draft_class"]==YEAR for x in rows)
                  assert all(x["sleeper_id"] for x in rows)
                  assert len({x["sleeper_id"] for x in rows})==4

                  additions[cell].append(source_id)
                  selected_occurrences.extend(rows)
                  added.append(cell)
                  status_counts[f"{cell}:rescued"]+=1

              attempt.update({
                  "selected_draft_number":rec["selected_draft_number"],
                  "source_id":source_id,
                  "rookie_scope":rec["selected_rookie_scope"],
                  "added_cells":added,
              })
              attempt["status"]="rescued" if added else "evaluated_no_rescue"
              attempts.append(attempt)

          final_counts={
              cell:len(baseline[cell])+len(additions[cell])
              for cell in TARGETS
          }

          unresolved_gate=len(set(unresolved_leagues))<=MAX_UNRESOLVED_LEAGUES
          source_success=all(v>=REQUIRED_TOTAL_PER_CELL for v in final_counts.values())
          pass_gate=source_success and unresolved_gate

          decision=(
              "PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE"
              if pass_gate else
              "STOP_AND_PREREGISTER_V8_PHASE0J_FOURTH_PROVIDER_OR_SOURCE_GATE_REVIEW_BEFORE_OUTCOMES"
          )

          # -------- Exact mixed-source evidence; mutate target 3 only --------
          memberships={
              k:list(v)
              for k,v in p0d_exact["cell_membership_league_ids"].items()
          }
          provenance={
              k:dict(v)
              for k,v in p0d_exact["cell_membership_provenance"].items()
          }
          occurrences={
              k:list(v)
              for k,v in p0d_exact["occurrences"].items()
          }

          for cell,lids in additions.items():
              key=f"2018:{cell}"
              for source_id in lids:
                  assert source_id not in memberships[key]
                  memberships[key].append(source_id)
                  provenance[key][source_id]="phase0i_fleaflicker_third_provider"

          grouped=defaultdict(list)
          for row in selected_occurrences:
              grouped[(row["cell"],row["league_id"])].append(row)

          for (cell,source_id),rows in grouped.items():
              key=f"2018:{cell}:{source_id}"
              assert key not in occurrences
              assert len(rows)==4
              occurrences[key]=rows

          non_target_after={
              k:list(v)
              for k,v in memberships.items()
              if k not in {f"2018:{cell}" for cell in TARGETS}
          }
          non_target_hash_after=canonical_sha(non_target_after)
          assert non_target_hash_after==non_target_hash_before
          assert non_target_after==non_target_before

          cells={}
          deficient=[]
          for key,lids in sorted(memberships.items()):
              n=len(lids)
              passed=n>=12
              cells[key]={
                  "draft_year":int(key.split(":")[0]),
                  "cell":key.split(":",1)[1],
                  "fully_usable_league_n":n,
                  "minimum_required":12,
                  "source_gate_pass":passed,
                  "occurrence_n":n*4,
              }
              if not passed:
                  deficient.append({
                      "draft_year":int(key.split(":")[0]),
                      "cell":key.split(":",1)[1],
                      "fully_usable_league_n":n,
                      "shortfall":12-n,
                  })

          assert len(cells)==108
          passed_cells=sum(x["source_gate_pass"] for x in cells.values())

          summary={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase0i_fleaflicker_draft_scope_r6_probe_closeout",
              "decision":decision,
              "phase0h1_run_id":36453748942,
              "phase0h1_artifact_id":10984970846,
              "phase0h1_artifact_digest":
                  "sha256:a4aed5683f3ebe7ae8e0798aff7e76dcca5a0318959c915af58cdc8819b5cd85",
              "candidate_league_n":8,
              "candidate_league_ids":candidate_ids,
              "candidate_league_ids_sha256":sha_ids(candidate_ids),
              "draft_numbers_probed":list(DRAFT_NUMBERS),
              "rookie_scope_rule":{
                  "slots":[1,72],
                  "structural_full_72_required":True,
                  "minimum_classification_coverage":
                      MIN_ROOKIE_SCOPE_CLASSIFICATION_COVERAGE,
                  "minimum_classified_n":MIN_ROOKIE_SCOPE_RESOLVED_N,
                  "resolved_non_2018_contamination_allowed_n":0,
                  "classification_sources":[
                      "frozen DynastyProcess draft_year",
                      "frozen nflverse rookie_season",
                  ],
                  "outcome_data_used":False,
              },
              "target_identity_rule":{
                  "all_four_slots_exactly_once":True,
                  "all_four_same_year_identity_required":True,
                  "all_four_outcome_ready_sleeper_id_required":True,
                  "all_four_distinct_sleeper_ids_required":True,
              },
              "prefetched_candidate_evidence_n":len(evidence),
              "ordered_replay_attempt_n":len(attempts),
              "ordered_replay_attempts":attempts,
              "candidate_status_counts":dict(sorted(status_counts.items())),
              "phase0i_additions":additions,
              "phase0i_final_target_counts":final_counts,
              "year_cell_n":108,
              "year_cells_passing":passed_cells,
              "all_year_cells_pass":passed_cells==108 and not deficient,
              "deficient_year_cells":deficient,
              "transport":{
                  "ordered_replay_unresolved_distinct_league_n":
                      len(set(unresolved_leagues)),
                  "maximum_allowed_unresolved_league_n":MAX_UNRESOLVED_LEAGUES,
                  "gate_pass":unresolved_gate,
                  "prefetched_after_stop_excluded_from_gate":True,
              },
              "non_target_105_cells_frozen_hash_before":non_target_hash_before,
              "non_target_105_cells_frozen_hash_after":non_target_hash_after,
              "non_target_105_cells_unchanged":True,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "holdout_2024_search_performed":False,
              "market_or_ktc_values_read":False,
              "package_vote_data_read":False,
              "candidate_fit_performed":False,
              "candidate_scores_computed":False,
              "production_change_authorized":False,
              "next_stage":(
                  "draft-pick-fv-v8-phase1-incremental-source-identity-freeze"
                  if pass_gate else
                  "PREREGISTER_V8_PHASE0J_FOURTH_PROVIDER_OR_SOURCE_GATE_REVIEW_BEFORE_OUTCOMES"
              ),
          }

          exact={
              "schema_version":1,
              "study_id":summary["study_id"],
              "stage":"phase0i_exact_mixed_source_identity_evidence",
              "decision":decision,
              "cell_membership_league_ids":memberships,
              "cell_membership_provenance":provenance,
              "occurrences":occurrences,
              "phase0i_candidate_evidence":evidence,
              "phase0i_ordered_replay_attempts":attempts,
              "phase0i_additions":additions,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }

          (OUT/"v8_phase0i_fleaflicker_draft_scope_r6_probe.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          (OUT/"v8_phase0i_exact_mixed_source_identity_evidence.json").write_text(
              json.dumps(exact,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0I Fleaflicker Draft Scope and R6 Probe",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Frozen Fleaflicker candidates: **8**",
              f"- Ordered-replay leagues attempted: **{len(attempts)}**",
              f"- Fleaflicker additions Early / Mid / Late: **{len(additions['r6_early'])} / {len(additions['r6_mid'])} / {len(additions['r6_late'])}**",
              f"- Final 2018 R6 Early / Mid / Late: **{final_counts['r6_early']} / {final_counts['r6_mid']} / {final_counts['r6_late']}**",
              f"- Year-cells passing source gate: **{passed_cells} / 108**",
              f"- Ordered-replay transport unresolved leagues: **{len(set(unresolved_leagues))}**; cap **{MAX_UNRESOLVED_LEAGUES}**",
              "- Non-target 105-cell freeze: **PASS**",
              "",
              "Rookie scope requires a structurally complete 72-pick draft, at least 95% frozen draft-class classification coverage (69/72), and zero resolved non-2018 players.",
              "Every accepted R6 target cell additionally requires four exact same-year identities with four distinct outcome-ready Sleeper IDs.",
              "",
              "No historical NFL outcomes, 2024 holdout outcomes, market/KTC values, package votes, candidate fits, candidate scores, or production values were read.",
          ]
          if deficient:
              lines += [
                  "",
                  "## Remaining deficient cells",
                  "",
                  "| Year | Cell | Fully usable | Shortfall |",
                  "|---:|---|---:|---:|",
              ]
              for x in deficient:
                  lines.append(
                      f"| {x['draft_year']} | {x['cell']} | "
                      f"{x['fully_usable_league_n']} | {x['shortfall']} |"
                  )

          (OUT/"v8_phase0i_fleaflicker_draft_scope_r6_probe.md").write_text(
              "\n".join(lines)+"\n"
          )
          print("\n".join(lines))
          PY

      - name: Validate Phase 0I closeout and firewalls
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"out"
          s=json.loads((out/"v8_phase0i_fleaflicker_draft_scope_r6_probe.json").read_text())
          e=json.loads((out/"v8_phase0i_exact_mixed_source_identity_evidence.json").read_text())

          assert s["candidate_league_n"]==8
          assert s["candidate_league_ids"]==[
              "89683","187110","326323","334232",
              "200615","190844","173472","191246",
          ]
          assert s["draft_numbers_probed"]==[1,2,3,4,5,6]
          assert s["rookie_scope_rule"]["structural_full_72_required"] is True
          assert s["rookie_scope_rule"]["minimum_classification_coverage"]==0.95
          assert s["rookie_scope_rule"]["minimum_classified_n"]==69
          assert s["rookie_scope_rule"]["resolved_non_2018_contamination_allowed_n"]==0
          assert s["rookie_scope_rule"]["outcome_data_used"] is False
          assert s["target_identity_rule"]["all_four_slots_exactly_once"] is True
          assert s["target_identity_rule"]["all_four_same_year_identity_required"] is True
          assert s["target_identity_rule"]["all_four_outcome_ready_sleeper_id_required"] is True
          assert s["target_identity_rule"]["all_four_distinct_sleeper_ids_required"] is True
          assert s["prefetched_candidate_evidence_n"]==8
          assert s["year_cell_n"]==108
          assert s["transport"]["maximum_allowed_unresolved_league_n"]==2
          assert s["transport"]["prefetched_after_stop_excluded_from_gate"] is True
          assert s["non_target_105_cells_unchanged"] is True
          assert s["non_target_105_cells_frozen_hash_before"]==\
              s["non_target_105_cells_frozen_hash_after"]

          for key in (
              "historical_player_outcomes_read",
              "holdout_2024_outcomes_read",
              "holdout_2024_search_performed",
              "market_or_ktc_values_read",
              "package_vote_data_read",
              "candidate_fit_performed",
              "candidate_scores_computed",
              "production_change_authorized",
          ):
              assert s[key] is False,(key,s[key])

          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False

          assert s["decision"] in {
              "PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
              "STOP_AND_PREREGISTER_V8_PHASE0J_FOURTH_PROVIDER_OR_SOURCE_GATE_REVIEW_BEFORE_OUTCOMES",
          }

          if s["decision"]=="PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE":
              assert s["phase0i_final_target_counts"]=={
                  "r6_early":12,"r6_mid":12,"r6_late":12,
              }
              assert s["year_cells_passing"]==108
              assert s["all_year_cells_pass"] is True
              assert not s["deficient_year_cells"]
              assert all(len(s["phase0i_additions"][cell])==6 for cell in (
                  "r6_early","r6_mid","r6_late"
              ))
              assert s["transport"]["gate_pass"] is True
              assert s["next_stage"]=="draft-pick-fv-v8-phase1-incremental-source-identity-freeze"

          print("PASS: Phase 0I is exact-order deterministic, source-only, 105-cell frozen, and outcome sealed.")
          PY

      - name: Upload Phase 0I closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0i-fleaflicker-draft-scope-r6-probe-closeout
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
