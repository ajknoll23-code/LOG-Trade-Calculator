name: Package Adjustment V6 Development Maturity Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install monitor dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard frozen V6 development contract
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/development_preregistration_v1.json")" = \
            "81f20cb8afd78f624153c3337377f56ebf8115ae"
          test "$(git hash-object "$D/package_vote_challenges_v6.json")" = \
            "afc3f4e5a75f3599c11482361073c4bd9559e342"
          test "$(git hash-object "$D/development_catalog_v1_manifest.json")" = \
            "1e225a9f5153ea74d8aac5098d39debb9e99dc1c"
          test "$(git hash-object "$D/development_vote_release_v1.json")" = \
            "5e53ff9fdb795fff30ab6235a3a5ee969f313fd2"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          cfg = json.loads((d / "development_preregistration_v1.json").read_text())
          cat = json.loads((d / "package_vote_challenges_v6.json").read_text())
          man = json.loads((d / "development_catalog_v1_manifest.json").read_text())
          rel = json.loads((d / "development_vote_release_v1.json").read_text())

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          rules = cfg["development_maturity_and_stopping"]
          assert cfg["status"] == "frozen_v6_development_preregistration"
          assert cfg["frozen"] is True
          assert rules["outcome_blind_coverage_only"] is True
          assert rules["first_effective_vote_checkpoint"] == 600
          assert rules["coverage_retry_increment"] == 100
          assert rules["hard_cap_effective_votes"] == 800
          assert rules["minimum_distinct_voters"] == 30
          assert rules["minimum_effective_votes_per_cell"] == 15
          assert rules["minimum_distinct_voters_per_cell"] == 10
          assert rules["required_cell_count"] == 24
          assert rules["daily_valid_vote_cap_per_voter"] == 20
          assert rules["effective_lifetime_vote_cap_per_voter"] == 30
          assert rules["effect_direction_may_change_stopping"] is False
          assert rules["significance_may_change_stopping"] is False

          assert cat["status"] == "frozen_package_adjustment_v6_development_catalog"
          assert cat["frozen"] is True
          assert cat["research_only"] is True
          assert len(cat["challenges"]) == 504
          assert len({c["research_cell"] for c in cat["challenges"]}) == 24

          assert man["catalog_sha256"] == sha256(d / "package_vote_challenges_v6.json")
          assert man["catalog_sha256"] == "f306da6cf396310be91c7e468703be8a9511dbff383508a75d81a17f7edf3a21"

          assert rel["status"] == "package_adjustment_v6_development_vote_release"
          assert rel["frozen"] is True
          assert rel["research_only"] is True
          assert rel["catalog_sha256"] == man["catalog_sha256"]
          assert rel["catalog_challenge_count"] == 504
          assert rel["catalog_research_cell_count"] == 24
          assert rel["sampling"]["research_cell_selection"] == "uniform_across_all_24_frozen_cells"
          assert rel["sampling"]["recent_memory_applied_after_cell_selection"] is True
          assert rel["sampling"]["display_side_randomized"] is True
          assert rel["sampling"]["values_hidden_from_voter"] is True
          assert rel["transport"]["keep_prefix"] == "__pkgv6__|"
          assert rel["transport"]["meta_prefix"] == "__pkgv6_meta__|"
          assert rel["transport"]["schema_marker"] == "__pkgv6_schema__|6"
          assert rel["voter_protections"]["analysis_daily_valid_vote_cap_per_voter"] == 20
          assert rel["voter_protections"]["analysis_effective_lifetime_vote_cap_per_voter"] == 30
          assert rel["production_revision"] == "v1.6-v5-size2-composition-overlay"
          assert rel["production_formula_changed"] is False
          assert rel["production_change_authorized"] is False

          html = Path("index.html").read_text(encoding="utf-8")
          assert "Package Adjustment V6 Development: frozen 1-vs-3 composition catalog." in html
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in html
          assert f"const PACKAGE_VOTE_VALID_AFTER_UTC = '{rel['released_at_utc']}';" in html
          assert "__pkgv6__|${id}|${choice}" in html
          assert "__pkgv6_meta__|${left}" in html
          assert "__pkgv6_schema__|6" in html
          assert "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" in html

          ktc = Path("scripts/market/ktc_pipeline.py").read_text(encoding="utf-8")
          assert '"__pkgv6__|"' in ktc

          regression = Path("scripts/validation/repo_regression_checks.py").read_text(encoding="utf-8")
          assert '"__pkgv6__|"' in regression
          assert "check_package_sampling_contract" in regression
          assert "PACKAGE_VOTE_V6_EXACT_CELL_SAMPLING_V1" in regression

          print("PASS: frozen V6 release and active sampling contract confirmed.")
          PY

      - name: Verify production remains V1.6
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test outcome-blind checkpoint arithmetic
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from collections import Counter

          DAILY_CAP = 20
          LIFETIME_CAP = 30

          def daily_cap(rows):
              counts = Counter()
              out = []
              for row in rows:
                  key = (row["voter"], row["day"])
                  if counts[key] >= DAILY_CAP:
                      continue
                  counts[key] += 1
                  out.append(row)
              return out

          def effective_total(rows):
              counts = Counter(r["voter"] for r in rows)
              return sum(min(n, LIFETIME_CAP) for n in counts.values())

          def checkpoint_prefix(rows, threshold):
              counts = Counter()
              running = 0
              for idx, row in enumerate(rows):
                  voter = row["voter"]
                  before = min(counts[voter], LIFETIME_CAP)
                  counts[voter] += 1
                  after = min(counts[voter], LIFETIME_CAP)
                  running += after - before
                  if running == threshold:
                      return rows[:idx + 1]
                  if running > threshold:
                      raise AssertionError("effective count skipped integer checkpoint")
              return None

          rows = []
          # 30 voters x 20 day-1 + 10 day-2 = 900 raw-valid/effective ballots.
          for voter in range(30):
              for i in range(20):
                  rows.append({"voter": f"v{voter}", "day": "2026-09-15"})
              for i in range(10):
                  rows.append({"voter": f"v{voter}", "day": "2026-09-16"})

          valid = daily_cap(rows)
          assert len(valid) == 900
          assert effective_total(valid) == 900
          assert checkpoint_prefix(valid, 600) is not None
          assert checkpoint_prefix(valid, 700) is not None
          assert checkpoint_prefix(valid, 800) is not None

          # A 31st lifetime vote from a voter does not advance effective count.
          extra = valid + [{"voter": "v0", "day": "2026-09-17"}]
          assert effective_total(extra) == 900

          print("PASS: V6 20/day, 30/lifetime, 600/700/800 checkpoint arithmetic.")
          PY

      - name: Build outcome-blind V6 maturity report
        shell: bash
        run: |
          set -euo pipefail

          OUT="/tmp/package-adjustment-v6-development-maturity"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          D = Path("research/package-adjustment-v6")
          OUT = Path("/tmp/package-adjustment-v6-development-maturity")

          SHEET_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          cfg = json.loads((D / "development_preregistration_v1.json").read_text())
          catalog_doc = json.loads((D / "package_vote_challenges_v6.json").read_text())
          release = json.loads((D / "development_vote_release_v1.json").read_text())

          rules = cfg["development_maturity_and_stopping"]
          transport = release["transport"]

          VOTE_PREFIX = transport["keep_prefix"]
          META_PREFIX = transport["meta_prefix"]
          SCHEMA_MARKER = transport["schema_marker"]

          DAILY_CAP = int(rules["daily_valid_vote_cap_per_voter"])
          LIFETIME_CAP = int(rules["effective_lifetime_vote_cap_per_voter"])
          MIN_VOTERS = int(rules["minimum_distinct_voters"])
          MIN_CELL_EFFECTIVE = float(rules["minimum_effective_votes_per_cell"])
          MIN_CELL_VOTERS = int(rules["minimum_distinct_voters_per_cell"])
          REQUIRED_CELL_COUNT = int(rules["required_cell_count"])
          FIRST_CHECKPOINT = int(rules["first_effective_vote_checkpoint"])
          RETRY_INCREMENT = int(rules["coverage_retry_increment"])
          HARD_CAP = int(rules["hard_cap_effective_votes"])
          CHECKPOINTS = list(range(FIRST_CHECKPOINT, HARD_CAP + 1, RETRY_INCREMENT))
          assert CHECKPOINTS == [600, 700, 800]

          def parse_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          cutoff = parse_utc(release["released_at_utc"])
          assert cutoff is not None

          challenges = {c["id"]: c for c in catalog_doc["challenges"]}
          assert len(challenges) == 504

          cell_meta = {}
          for challenge in challenges.values():
              key = challenge["research_cell"]
              meta = {
                  "research_cell": key,
                  "composition_profile": challenge["component_profile"]["label"],
                  "apex_piece_to_target_target": float(
                      challenge["apex_piece_to_target_target"]
                  ),
              }
              if key in cell_meta:
                  assert cell_meta[key] == meta
              else:
                  cell_meta[key] = meta

          assert len(cell_meta) == REQUIRED_CELL_COUNT == 24

          generated_at = datetime.now(timezone.utc)
          response = requests.get(SHEET_URL, timeout=30)
          response.raise_for_status()
          sheet_sha256 = hashlib.sha256(response.content).hexdigest()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          excluded = Counter()
          raw_v6_rows = 0
          structurally_valid = []

          for source_index, row in enumerate(rows):
              keep = str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue

              raw_v6_rows += 1

              ts = parse_utc(row.get("timestamp"))
              if ts is None:
                  excluded["invalid_timestamp"] += 1
                  continue
              if ts <= cutoff:
                  excluded["pre_release_or_at_cutoff"] += 1
                  continue
              if ts > generated_at:
                  excluded["future_timestamp"] += 1
                  continue

              voter = str(row.get("voter_roster_id") or "").strip()
              if not voter:
                  excluded["missing_voter_id"] += 1
                  continue

              # OUTCOME-BLIND: read only the challenge ID before the final
              # response token. The T/P choice itself is never parsed.
              payload = keep[len(VOTE_PREFIX):]
              if "|" not in payload:
                  excluded["malformed_vote_transport"] += 1
                  continue
              challenge_id = payload.split("|", 1)[0].strip()
              if challenge_id not in challenges:
                  excluded["unknown_challenge_id"] += 1
                  continue

              # Check namespace only. Do not parse the randomized left-side token.
              meta = str(row.get("trade") or "")
              if not meta.startswith(META_PREFIX):
                  excluded["invalid_meta_namespace"] += 1
                  continue

              if str(row.get("cut") or "") != SCHEMA_MARKER:
                  excluded["invalid_schema_marker"] += 1
                  continue

              structurally_valid.append({
                  "timestamp": ts,
                  "source_index": source_index,
                  "voter": voter,
                  "challenge_id": challenge_id,
              })

          structurally_valid.sort(
              key=lambda r: (r["timestamp"], r["source_index"])
          )

          # Enforce preregistered 20 valid ballots per voter per UTC day.
          daily_counts = Counter()
          valid = []
          for row in structurally_valid:
              day = row["timestamp"].date().isoformat()
              key = (row["voter"], day)
              if daily_counts[key] >= DAILY_CAP:
                  excluded["daily_cap_excess"] += 1
                  continue
              daily_counts[key] += 1
              valid.append(row)

          def snapshot(rows_subset):
              voter_counts = Counter(r["voter"] for r in rows_subset)
              weights = {
                  voter: min(1.0, LIFETIME_CAP / count)
                  for voter, count in voter_counts.items()
              }

              per_cell_effective = {key: 0.0 for key in cell_meta}
              per_cell_voters = {key: set() for key in cell_meta}
              challenge_ids = set()

              for row in rows_subset:
                  challenge = challenges[row["challenge_id"]]
                  key = challenge["research_cell"]
                  weight = weights[row["voter"]]
                  per_cell_effective[key] += weight
                  per_cell_voters[key].add(row["voter"])
                  challenge_ids.add(row["challenge_id"])

              effective_total = sum(
                  min(count, LIFETIME_CAP)
                  for count in voter_counts.values()
              )

              cells = []
              for key in sorted(cell_meta):
                  eff = per_cell_effective[key]
                  voters = len(per_cell_voters[key])
                  meta = cell_meta[key]
                  cells.append({
                      **meta,
                      "effective_votes": round(eff, 6),
                      "distinct_voters": voters,
                      "effective_vote_gate_pass": (
                          eff + 1e-12 >= MIN_CELL_EFFECTIVE
                      ),
                      "voter_gate_pass": voters >= MIN_CELL_VOTERS,
                      "cell_gate_pass": (
                          eff + 1e-12 >= MIN_CELL_EFFECTIVE
                          and voters >= MIN_CELL_VOTERS
                      ),
                  })

              distinct_voters = len(voter_counts)
              coverage_pass = (
                  distinct_voters >= MIN_VOTERS
                  and all(c["cell_gate_pass"] for c in cells)
              )

              return {
                  "raw_post_daily_cap_ballots": len(rows_subset),
                  "effective_votes": round(float(effective_total), 6),
                  "distinct_voters": distinct_voters,
                  "distinct_challenges": len(challenge_ids),
                  "cells_observed": sum(
                      c["effective_votes"] > 0 for c in cells
                  ),
                  "cells_passing_both_gates": sum(
                      c["cell_gate_pass"] for c in cells
                  ),
                  "minimum_cell_effective_votes": round(
                      min(c["effective_votes"] for c in cells), 6
                  ),
                  "minimum_cell_distinct_voters": min(
                      c["distinct_voters"] for c in cells
                  ),
                  "coverage_gates_pass": coverage_pass,
                  "cells": cells,
              }

          def exact_checkpoint_prefix(threshold):
              # After daily capping, each accepted row advances lifetime-capped
              # effective count by exactly 1 until that voter reaches 30,
              # then by 0. Exact integer checkpoints are therefore reconstructable
              # without reading any response direction.
              counts = Counter()
              running = 0

              for idx, row in enumerate(valid):
                  voter = row["voter"]
                  before = min(counts[voter], LIFETIME_CAP)
                  counts[voter] += 1
                  after = min(counts[voter], LIFETIME_CAP)
                  running += after - before

                  if running == threshold:
                      return valid[:idx + 1]
                  if running > threshold:
                      raise RuntimeError(
                          f"effective count skipped exact checkpoint {threshold}"
                      )
              return None

          current = snapshot(valid)

          checkpoint_reports = {}
          for checkpoint in CHECKPOINTS:
              prefix = exact_checkpoint_prefix(checkpoint)
              checkpoint_reports[str(checkpoint)] = (
                  None if prefix is None else snapshot(prefix)
              )

          cp600 = checkpoint_reports["600"]
          cp700 = checkpoint_reports["700"]
          cp800 = checkpoint_reports["800"]

          if cp600 is not None and cp600["coverage_gates_pass"]:
              status = "STOP_AND_FREEZE_AT_600"
              stop_checkpoint = 600
              next_action = (
                  "Stop collecting. Freeze the exact 600-effective-vote "
                  "development checkpoint before any candidate fitting."
              )
          elif cp700 is not None and cp700["coverage_gates_pass"]:
              status = "STOP_AND_FREEZE_AT_700"
              stop_checkpoint = 700
              next_action = (
                  "The exact 600 checkpoint did not qualify, but 700 did. "
                  "Stop collecting and freeze the exact 700-effective-vote "
                  "development checkpoint before any candidate fitting."
              )
          elif cp800 is not None:
              stop_checkpoint = 800
              if cp800["coverage_gates_pass"]:
                  status = "STOP_AND_FREEZE_AT_800"
                  next_action = (
                      "Earlier checkpoints did not qualify. Stop collecting and "
                      "freeze the exact 800-effective-vote hard-cap checkpoint "
                      "before any candidate fitting."
                  )
              else:
                  status = "STOP_UNRESOLVED_AT_HARD_CAP_800"
                  next_action = (
                      "Stop collecting. The 800-effective-vote hard cap was "
                      "reached without all preregistered coverage gates. "
                      "V6 development is unresolved and no candidate may be fit."
                  )
          elif cp700 is not None:
              status = "CONTINUE_TO_EXACT_800"
              stop_checkpoint = None
              next_action = (
                  "The exact 600 and 700 checkpoints failed at least one "
                  "coverage gate. Continue to the exact 800 hard cap."
              )
          elif cp600 is not None:
              status = "CONTINUE_TO_EXACT_700"
              stop_checkpoint = None
              next_action = (
                  "The exact 600 checkpoint failed at least one coverage gate. "
                  "Continue to the exact 700 checkpoint."
              )
          else:
              status = "COLLECT_TO_EXACT_600"
              stop_checkpoint = None
              next_action = (
                  "Continue collecting until the exact 600-effective-vote "
                  "development checkpoint."
              )

          result = {
              "schema_version": 1,
              "status": status,
              "generated_at_utc": generated_at.isoformat(),
              "research_only": True,
              "outcome_blind": True,
              "model_evaluation_performed": False,
              "model_predictions_read": False,
              "vote_response_tokens_read": False,
              "display_orientation_tokens_read": False,
              "production_changed": False,
              "source": {
                  "sheet_sha256": sheet_sha256,
                  "total_sheet_rows": len(rows),
                  "raw_v6_namespace_rows": raw_v6_rows,
              },
              "contract": {
                  "valid_ballot_start_utc": cutoff.isoformat(),
                  "daily_valid_vote_cap_per_voter": DAILY_CAP,
                  "effective_lifetime_cap_per_voter": LIFETIME_CAP,
                  "ballot_weight_rule": (
                      "min(1,30/valid_post_daily_cap_V6_ballot_count_for_voter)"
                  ),
                  "minimum_distinct_voters": MIN_VOTERS,
                  "minimum_effective_votes_per_cell": MIN_CELL_EFFECTIVE,
                  "minimum_distinct_voters_per_cell": MIN_CELL_VOTERS,
                  "required_cell_count": REQUIRED_CELL_COUNT,
                  "exact_checkpoints_effective_votes": CHECKPOINTS,
                  "hard_cap_effective_votes": HARD_CAP,
              },
              "excluded_row_counts": dict(sorted(excluded.items())),
              "current": current,
              "exact_checkpoints": checkpoint_reports,
              "stop_checkpoint": stop_checkpoint,
              "next_action": next_action,
          }

          # Persist aggregate-only output. Never persist voter IDs, raw transport
          # fields, response direction, or randomized display orientation.
          forbidden_keys = {
              "voter",
              "voter_id",
              "voter_roster_id",
              "keep",
              "trade",
              "cut",
              "response",
              "response_token",
              "choice",
              "choice_side",
              "displayed_left",
              "left_side",
              "ballots",
          }

          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in forbidden_keys:
                          raise RuntimeError(
                              f"forbidden persisted outcome/identity key: {key}"
                          )
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(result)

          (OUT / "v6_development_maturity.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Package Adjustment V6 Development Maturity Monitor",
              "",
              f"**Status:** `{status}`",
              "",
              f"- Generated: `{generated_at.isoformat()}`",
              f"- Valid-ballot cutoff: `{cutoff.isoformat()}`",
              f"- Raw V6 namespace rows: **{raw_v6_rows}**",
              f"- Valid post-daily-cap ballots: **{current['raw_post_daily_cap_ballots']}**",
              f"- Effective votes: **{current['effective_votes']:.2f}**",
              f"- Distinct voters: **{current['distinct_voters']} / {MIN_VOTERS}**",
              f"- Distinct challenges observed: **{current['distinct_challenges']} / 504**",
              f"- Cells observed: **{current['cells_observed']} / 24**",
              f"- Cells passing both gates now: **{current['cells_passing_both_gates']} / 24**",
              f"- Minimum cell effective votes now: **{current['minimum_cell_effective_votes']:.2f} / {MIN_CELL_EFFECTIVE:.0f}**",
              f"- Minimum cell distinct voters now: **{current['minimum_cell_distinct_voters']} / {MIN_CELL_VOTERS}**",
              "",
              "## Exact checkpoint status",
              "",
          ]

          for checkpoint in CHECKPOINTS:
              cp = checkpoint_reports[str(checkpoint)]
              if cp is None:
                  lines.append(f"- **{checkpoint}: not reached**")
              else:
                  verdict = "PASS" if cp["coverage_gates_pass"] else "FAIL"
                  lines.append(
                      f"- **{checkpoint}: {verdict}** — "
                      f"{cp['distinct_voters']} voters; "
                      f"{cp['cells_passing_both_gates']}/24 cells pass; "
                      f"min cell {cp['minimum_cell_effective_votes']:.2f} effective / "
                      f"{cp['minimum_cell_distinct_voters']} voters"
                  )

          lines.extend([
              "",
              "## Current 24-cell coverage",
              "",
              "| Composition | Apex/Target | Effective | Voters | Gate |",
              "|---|---:|---:|---:|---|",
          ])

          for cell in current["cells"]:
              gate = "PASS" if cell["cell_gate_pass"] else "WAIT"
              lines.append(
                  f"| {cell['composition_profile']} | "
                  f"{cell['apex_piece_to_target_target']:.2f} | "
                  f"{cell['effective_votes']:.2f} | "
                  f"{cell['distinct_voters']} | {gate} |"
              )

          if excluded:
              lines.extend(["", "## Excluded rows", ""])
              for reason, count in sorted(excluded.items()):
                  lines.append(f"- `{reason}`: **{count}**")

          lines.extend([
              "",
              "## Next action",
              "",
              next_action,
              "",
              "> Outcome-blind monitor: no T/P response direction, randomized "
              "display orientation, candidate prediction, loss, significance, "
              "or model-performance statistic is read or reported.",
          ])

          md = "\n".join(lines) + "\n"
          (OUT / "v6_development_maturity.md").write_text(
              md,
              encoding="utf-8",
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(md)

          print(md)
          print("V6_DEVELOPMENT_MONITOR_STATUS=" + status)
          PY

      - name: Verify report has no outcome or voter-level leakage
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("/tmp/package-adjustment-v6-development-maturity")
          result = json.loads((out / "v6_development_maturity.json").read_text())
          md = (out / "v6_development_maturity.md").read_text()

          assert result["outcome_blind"] is True
          assert result["model_evaluation_performed"] is False
          assert result["model_predictions_read"] is False
          assert result["vote_response_tokens_read"] is False
          assert result["display_orientation_tokens_read"] is False
          assert result["production_changed"] is False

          assert result["contract"]["daily_valid_vote_cap_per_voter"] == 20
          assert result["contract"]["effective_lifetime_cap_per_voter"] == 30
          assert result["contract"]["exact_checkpoints_effective_votes"] == [600, 700, 800]
          assert len(result["current"]["cells"]) == 24

          forbidden = [
              '"voter_id"',
              '"voter_roster_id"',
              '"choice"',
              '"choice_side"',
              '"displayed_left"',
              '"keep"',
              '"trade"',
              '"cut"',
          ]
          json_text = (out / "v6_development_maturity.json").read_text()
          for token in forbidden:
              assert token not in json_text, token

          lower_md = md.lower()
          for token in (
              "c2 log loss",
              "c4 log loss",
              "c5 log loss",
              "candidate wins",
              "bootstrap favorable",
              "package preferred",
              "target preferred",
          ):
              assert token not in lower_md, token

          print("PASS: V6 maturity report is aggregate-only and outcome-blind.")
          PY

      - name: Upload maturity report artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v6-development-maturity
          path: /tmp/package-adjustment-v6-development-maturity/
          if-no-files-found: error
          retention-days: 14

      - name: Final read-only repository verification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/validation/check_package_adjustment_live.py
          echo "PASS: V6 maturity monitor changed no repository files."
