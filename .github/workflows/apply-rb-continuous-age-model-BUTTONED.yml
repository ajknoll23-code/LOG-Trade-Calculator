name: Apply RB Continuous Age Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python3 -m pip install requests

      - name: Verify deployment environment
        run: |
          python3 --version
          node --version
          python3 -c "import requests; print('requests', requests.__version__)"

      - name: Self-test production patch
        run: python3 scripts/maintenance/apply_rb_continuous_age_model.py --selftest

      - name: Apply continuous RB age model
        run: python3 scripts/maintenance/apply_rb_continuous_age_model.py --apply

      - name: Test Sleeper data layer
        run: python3 scripts/sync/sync_sleeper.py --selftest

      - name: Test valuation snapshot port
        run: python3 scripts/validation/snapshot_values.py --selftest

      - name: Normalize deterministic derived artifacts
        run: |
          python3 scripts/maintenance/refresh_repo_derived_state.py --selftest
          python3 scripts/maintenance/refresh_repo_derived_state.py --write
          python3 scripts/maintenance/refresh_repo_derived_state.py --check

      - name: Validate free-agent canonical valuation sync
        run: |
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py

      - name: Run full repository regression checks
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Validate inline index JavaScript syntax
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          text = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, re.S | re.I)
          js = "\n".join(scripts)

          fd, path = tempfile.mkstemp(suffix=".js")
          os.close(fd)
          try:
              pathlib.Path(path).write_text(js, encoding="utf-8")
              subprocess.run(["node", "--check", path], check=True)
          finally:
              pathlib.Path(path).unlink(missing_ok=True)

          print("PASS index.html inline JavaScript syntax")
          PY

      - name: Show production diff summary
        run: |
          git status --short
          git diff --stat

      - name: Commit production deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            free-agent-board.html \
            scripts/sync/sync_sleeper.py \
            scripts/validation/snapshot_values.py \
            scripts/validation/repo_regression_checks.py \
            scripts/artifacts/generated/player_positions.json \
            data/league_rosters.json \
            data/my_roster.json \
            data/free_agents.json

          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi

          git commit -m "Deploy continuous RB age valuation"
          git push
