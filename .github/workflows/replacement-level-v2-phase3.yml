name: Replacement Level V2 Phase 3 Current-Board Shadow

# Research-only blast-radius audit.
# Changes one replacement-rank position at a time in shadow calculations only.
# No deployed values, position weights, transform, scale, or frozen experiment
# is modified.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 3 self-test
        run: python3 research/replacement-level-v2/replacement_level_v2_phase3_shadow_audit.py --selftest

      - name: Build Phase 3 current-board shadow
        run: python3 research/replacement-level-v2/replacement_level_v2_phase3_shadow_audit.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/replacement-level-v2/replacement_level_v2_phase3_shadow_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/replacement-level-v2/replacement_level_v2_phase3_shadow_audit.json
          git add research/replacement-level-v2/replacement_level_v2_phase3_shadow_audit.md
          git diff --staged --quiet || git commit -m "Add Replacement Level V2 Phase 3 shadow audit"
          git push
