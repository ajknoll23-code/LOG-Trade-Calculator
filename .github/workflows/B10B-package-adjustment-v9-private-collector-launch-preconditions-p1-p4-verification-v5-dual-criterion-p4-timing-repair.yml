name: B10B Package Adjustment V9 - Private Collector Launch Preconditions P1-P4 Verification V5 Dual-Criterion P4 Timing Repair

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b10b-private-collector-p1-p4
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  B10B_VERSION: package-adjustment-v9-b10b-private-collector-launch-preconditions-p1-p4-verification-v5-dual-criterion-p4-timing-repair
  B9_DEPLOY_COMMIT: 5cbd7b3dae663dfbeb9f9766dc3f972303af9de1
  B9_INDEX_SHA256: d5280c19d5d846292ff06088968ac55fe87b47bbb78925d423d39899d845be51
  B9_KTC_SHA256: d14eb2fc53c088f11b241dc7e797c07dcdf15953431aae7b736ee0ed7e5f2c6d
  B8_FREEZE_COMMIT: 2ff1ca2a6ea440f2e1a4c390ae974a9666e9912a
  B8_CATALOG_SIGNATURE: dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62
  B10B_V2_STOP_COMMIT: c0ed01da4635f6718c6ada52fe4ecf1bb3e9f0b8
  B10B_V4_STOP_COMMIT: a968b6c6e6b304f38fd21e1ed185d7a7727fb99d
  B10B_V4_WORKFLOW_SHA256: 4cb32fe3bfcdcfe2e86dea1f7ae2068f756ff10969a90d6757896f33b6d854fa
  B10B_V3_WORKFLOW_SHA256: ec407768e2026cafc76623f34e49da66b85cb3134369d201380263ff47d3c12e
  LIVE_PAGE_BASE: https://ajknoll23-code.github.io/LOG-Trade-Calculator/index.html
  PUBLIC_KTC_CSV: https://docs.google.com/spreadsheets/d/e/2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/pub?gid=458294959&single=true&output=csv
  COLLECTOR_URL: https://script.google.com/macros/s/AKfycbynz6A8jNOQonJhHtZW7DEx36PYTBXi_klXnacKF7I4kACPbTJIA5YFjY5ILxqpwgm8aw/exec
  PRIVATE_V9_SPREADSHEET_ID: 1F9FVasO1nSRJO4IBMwA9sq1OCPxoVMfW_DRD3fNhr7c
  PRIVATE_V9_SHEET_GID: '529225599'
  PRIVATE_V9_EXPORT: https://docs.google.com/spreadsheets/d/1F9FVasO1nSRJO4IBMwA9sq1OCPxoVMfW_DRD3fNhr7c/export?format=csv&gid=529225599
  PRIVATE_V9_GVIZ: https://docs.google.com/spreadsheets/d/1F9FVasO1nSRJO4IBMwA9sq1OCPxoVMfW_DRD3fNhr7c/gviz/tq?tqx=out:csv&gid=529225599

jobs:
  private-launch-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Guard exact B9 deployment and one-shot B10B scope
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v5"
          test ! -e "$DEST" || { echo "ERROR: B10B V5 durable output already exists."; exit 1; }
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(sha256sum index.html | cut -d' ' -f1)" = "$B9_INDEX_SHA256" || { echo "ERROR: B9 deployed index.html drifted."; exit 1; }
          test "$(sha256sum scripts/market/ktc_pipeline.py | cut -d' ' -f1)" = "$B9_KTC_SHA256" || { echo "ERROR: B9 KTC isolation source drifted."; exit 1; }
          test "$(sha256sum .github/workflows/B10B-package-adjustment-v9-private-collector-launch-preconditions-p1-p4-verification-v3-stale-element-browser-click-repair.yml | cut -d' ' -f1)" = "$B10B_V3_WORKFLOW_SHA256" || { echo "ERROR: B10B V3 workflow drifted from exact failed-run source."; exit 1; }
          test "$(sha256sum .github/workflows/B10B-package-adjustment-v9-private-collector-launch-preconditions-p1-p4-verification-v4-p4-network-retry-repair.yml | cut -d' ' -f1)" = "$B10B_V4_WORKFLOW_SHA256" || { echo "ERROR: B10B V4 workflow drifted from exact timing-stop source."; exit 1; }

          python3 - <<'PY1'
          import json, os
          from pathlib import Path
          p=Path('research/package-adjustment-v9/b9-voting-transport-launch-parity/b9_manifest.json')
          m=json.loads(p.read_text())
          assert m['status']=='PASS_B9_FROZEN_VOTING_TRANSPORT_DEPLOYMENT_READY_URL_DISTRIBUTION_CONDITIONAL'
          assert m['decision']=='PASS_B9_LAUNCH_PARITY_DEPLOY_TRANSPORT_URL_DISTRIBUTION_CONDITIONAL_ON_P1_TO_P6'
          assert m['human_voting_transport_activated'] is True
          assert m['human_voting_url_distribution_authorized']=='CONDITIONAL_ON_B9_URL_DISTRIBUTION_PRECONDITIONS_P1_TO_P6'
          assert m['human_outcome_analysis_authorized'] is False
          assert m['human_outcomes_exist_or_were_read'] is False
          assert m['production_v9_activation_authorized'] is False
          assert m['production_change_authorized'] is False
          assert m['b8_freeze_commit']==os.environ['B8_FREEZE_COMMIT']
          assert m['b8_catalog_signature_set_sha256']==os.environ['B8_CATALOG_SIGNATURE']
          assert m['patched_index_sha256']==os.environ['B9_INDEX_SHA256']
          assert m['patched_ktc_pipeline_sha256']==os.environ['B9_KTC_SHA256']
          assert len(m['url_distribution_preconditions'])==6

          # Bind V3 to the exact V2 operational STOP. V2 proved the live HTML
          # bytes/hash and private preflight were clean, then stopped before any
          # sentinel POST solely on Selenium stale-element click handling.
          v2p=Path('research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4/b10b_probe_result.json')
          v2=json.loads(v2p.read_text())
          assert v2['analysis_version']=='package-adjustment-v9-b10b-private-collector-launch-preconditions-p1-p4-verification-v2-publish-to-web-privacy-repair'
          assert v2['decision']=='STOP_B10B_P1_LIVE_BROWSER_PARITY_FAILED_NO_SENTINEL_POSTED'
          assert v2['p1_live_html_http_status']==200
          assert v2['p1_live_html_exact_sha256_match'] is True
          assert v2['p1_live_browser_hash_verified'] is False
          assert v2['p2_private_collector_acceptance'] is False
          assert v2['preexisting_public_real_v9_rows']==0
          assert v2['preexisting_public_launchtest_rows']==0
          assert 'probe_session_id_sha256' not in v2
          assert 'StaleElementReferenceException' in v2['p1_browser_diagnostics']['error']
          assert v2['human_outcomes_read'] is False
          assert v2['human_voting_url_distribution_authorized'] is False
          # Bind V5 to the exact durable V4 timing-only STOP. V4 passed P1-P3,
          # obtained 91 successful public-CSV observations with zero request errors,
          # and failed closed only because its deadline expired before observation 96.
          v4p=Path('research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v4/b10b_probe_result.json')
          v4=json.loads(v4p.read_text())
          assert v4['analysis_version']=='package-adjustment-v9-b10b-private-collector-launch-preconditions-p1-p4-verification-v4-p4-network-retry-repair'
          assert v4['decision']=='STOP_B10B_P4_PUBLIC_CSV_OBSERVABILITY_INSUFFICIENT'
          assert v4['p1_live_browser_hash_verified'] is True
          assert v4['p2_private_collector_acceptance'] is True
          assert v4['p3_ktc_isolation'] is True
          assert v4['p4_public_csv_successful_reads']==91
          assert v4['p4_public_csv_request_error_count']==0
          assert v4['p4_private_destination_anonymously_readable'] is False
          assert v4['p4_private_destination_gviz_readable'] is False
          assert v4['human_outcomes_read'] is False
          assert v4['human_voting_url_distribution_authorized'] is False
          print('PASS: exact B9 state, V2 stale-element STOP, and V4 timing-only STOP guarded for B10B V5.')
          PY1

          for n in b10b_probe_result.json b10b_report.md b10b_output_hashes.json; do
            a="$(git show "$B10B_V2_STOP_COMMIT:research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4/$n" | sha256sum | cut -d' ' -f1)"
            b="$(sha256sum "research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4/$n" | cut -d' ' -f1)"
            test "$a" = "$b" || { echo "ERROR: durable B10B V2 STOP file drifted from stop commit: $n"; exit 1; }
          done

          for n in b10b_probe_result.json b10b_report.md b10b_output_hashes.json; do
            a="$(git show "$B10B_V4_STOP_COMMIT:research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v4/$n" | sha256sum | cut -d' ' -f1)"
            b="$(sha256sum "research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v4/$n" | cut -d' ' -f1)"
            test "$a" = "$b" || { echo "ERROR: durable B10B V4 STOP file drifted from stop commit: $n"; exit 1; }
          done

          for n in b9_manifest.json b9_transport_parity_audit.json b9_preregistered_protocol.json; do
            a="$(git show "$B9_DEPLOY_COMMIT:research/package-adjustment-v9/b9-voting-transport-launch-parity/$n" | sha256sum | cut -d' ' -f1)"
            b="$(sha256sum "research/package-adjustment-v9/b9-voting-transport-launch-parity/$n" | cut -d' ' -f1)"
            test "$a" = "$b" || { echo "ERROR: durable B9 file drifted from deploy commit: $n"; exit 1; }
          done

      - name: Install live probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir selenium==4.35.0 requests==2.32.5
          command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || { echo "ERROR: no Chrome/Chromium on runner"; exit 1; }

      - name: Run live private-collector P1-P4 verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b10b
          mkdir -p /tmp/package-adjustment-v9-b10b
          python3 - <<'PY2'
          from __future__ import annotations
          import ast, csv, hashlib, io, json, os, re, secrets, shutil, time
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          OUT=Path('/tmp/package-adjustment-v9-b10b')
          live=os.environ['LIVE_PAGE_BASE']
          public_csv=os.environ['PUBLIC_KTC_CSV']
          collector=os.environ['COLLECTOR_URL']
          private_export=os.environ['PRIVATE_V9_EXPORT']
          private_gviz=os.environ['PRIVATE_V9_GVIZ']

          result={
            'analysis_version':os.environ['B10B_VERSION'],
            'study_id':'package-adjustment-v9-discordant-human-validation',
            'status':'B10B_PRIVATE_COLLECTOR_LIVE_PROBE_EXECUTED',
            'b9_deploy_commit':os.environ['B9_DEPLOY_COMMIT'],
            'b8_freeze_commit':os.environ['B8_FREEZE_COMMIT'],
            'b8_catalog_signature_set_sha256':os.environ['B8_CATALOG_SIGNATURE'],
            'private_v9_spreadsheet_id_sha256':hashlib.sha256(os.environ['PRIVATE_V9_SPREADSHEET_ID'].encode()).hexdigest(),
            'private_v9_sheet_gid':os.environ['PRIVATE_V9_SHEET_GID'],
            'human_outcomes_read':False,
            'production_change_authorized':False,
            'human_voting_url_distribution_authorized':False,
            'probe_is_invalid_by_design':True,
            'probe_slot':0,
            'probe_challenge_id':'pkgv9val_LAUNCHTEST',
          }

          def write_stop(decision, **extra):
            result.update(extra)
            result['decision']=decision
            result['all_p1_to_p4_passed']=False
            result['human_voting_url_distribution_authorized']=False
            result['next_if_stop']='Do not send voter URLs. Repair the failed launch precondition, then run a fresh versioned preflight.'
            (OUT/'b10b_probe_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
            report=[
              '# Package Adjustment V9 — B10B Private Collector Launch Preconditions P1–P4','',
              f'**Decision:** `{decision}`','',
              f"- P1 live browser parity/hash verification: `{result.get('p1_live_browser_hash_verified')}`",
              f"- P2 private collector persistence confirmed: `{result.get('p2_private_collector_acceptance')}`",
              f"- P3 KTC isolation guard: `{result.get('p3_ktc_isolation')}`",
              f"- P4 no public outcome exposure: `{result.get('p4_no_public_outcome_exposure')}`",
              '',
              '**No real voter slot is ever used. The only POST is invalid slot 0 / `pkgv9val_LAUNCHTEST`.**','',
              'B10B never authorizes voter URL distribution, outcome analysis, or V9 production activation.'
            ]
            (OUT/'b10b_report.md').write_text('\n'.join(report)+'\n')
            print('B10B decision:',decision)
            raise SystemExit(0)

          # Pre-flight public safety: real V9 rows may not already exist publicly.
          pre=requests.get(public_csv,params={'b10b_pre':str(time.time_ns())},timeout=30)
          pre.raise_for_status()
          pre_rows=list(csv.DictReader(io.StringIO(pre.text)))
          headers=list(pre_rows[0].keys()) if pre_rows else []
          required_headers=['timestamp','voter_roster_id','keep','trade','cut']
          result['public_csv_headers']=headers
          if not all(h in headers for h in required_headers):
            write_stop('STOP_B10B_PUBLIC_CSV_SCHEMA_MISMATCH',p1_live_browser_hash_verified=False,p2_private_collector_acceptance=False,p3_ktc_isolation=False,p4_no_public_outcome_exposure=False)
          real_public=[r for r in pre_rows if str(r.get('keep') or '').startswith('__pkgv9val__|') and 'pkgv9val_LAUNCHTEST' not in str(r.get('keep') or '')]
          prior_launch=[r for r in pre_rows if str(r.get('keep') or '').startswith('__pkgv9val__|pkgv9val_LAUNCHTEST|')]
          result['preexisting_public_real_v9_rows']=len(real_public)
          result['preexisting_public_launchtest_rows']=len(prior_launch)
          if real_public:
            write_stop('STOP_B10B_PREEXISTING_PUBLIC_REAL_V9_ROWS',p1_live_browser_hash_verified=False,p2_private_collector_acceptance=False,p3_ktc_isolation=False,p4_no_public_outcome_exposure=False)

          # Private destination must not be anonymously exportable even before the sentinel.
          pe=requests.get(private_export,params={'b10b_private_pre':str(time.time_ns())},timeout=30,allow_redirects=True)
          pe_text=pe.text[:5000]
          private_header='timestamp,voter_roster_id,keep,trade,cut'
          private_anonymous_csv=(pe.status_code==200 and private_header in pe_text.replace('\r',''))
          gv=requests.get(private_gviz,params={'b10b_gviz_pre':str(time.time_ns())},timeout=30,allow_redirects=True)
          gv_text=gv.text[:5000]
          gviz_readable=(gv.status_code==200 and 'voter_roster_id' in gv_text and 'keep' in gv_text)
          result['p4_private_destination_anonymous_export_status']=pe.status_code
          result['p4_private_destination_gviz_status']=gv.status_code
          result['p4_private_destination_anonymously_readable']=private_anonymous_csv
          result['p4_private_destination_gviz_readable']=gviz_readable
          if private_anonymous_csv or gviz_readable:
            write_stop('STOP_B10B_P4_PRIVATE_DESTINATION_PUBLICLY_READABLE',p1_live_browser_hash_verified=False,p2_private_collector_acceptance=False,p3_ktc_isolation=False,p4_no_public_outcome_exposure=False)

          # P1: exact live Pages bytes + real browser B8 artifact hash verification.
          marker='PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START'
          page_ready=False
          last_status=None
          for _ in range(24):
            try:
              r=requests.get(live,params={'pkgv9slot':'1','b10b_cache':str(time.time_ns())},timeout=20)
              last_status=r.status_code
              if r.status_code==200 and marker in r.text and hashlib.sha256(r.content).hexdigest()==os.environ['B9_INDEX_SHA256']:
                page_ready=True
                break
            except Exception:
              pass
            time.sleep(5)
          result['p1_live_html_http_status']=last_status
          result['p1_live_html_exact_sha256_match']=page_ready

          p1=False
          browser_diag={}
          if page_ready:
            driver=None
            try:
              from selenium import webdriver
              from selenium.webdriver.chrome.options import Options
              from selenium.webdriver.support.ui import WebDriverWait
              opts=Options()
              opts.add_argument('--headless=new')
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument('--disable-gpu')
              opts.add_argument('--window-size=1280,1000')
              chrome=shutil.which('google-chrome') or shutil.which('chromium')
              if chrome: opts.binary_location=chrome
              driver=webdriver.Chrome(options=opts)
              driver.get(live+'?pkgv9slot=1&b10b_browser='+str(time.time_ns())+'#market-research')
              wait=WebDriverWait(driver,30)
              browser_phase='wait_confirm_button'

              # V2 stored a Selenium WebElement and the page re-rendered between
              # discovery and click, producing StaleElementReferenceException.
              # V3 locates and clicks the button atomically inside one browser JS
              # execution, so no WebElement reference survives a DOM re-render.
              wait.until(lambda d: d.execute_script("""
                return Array.from(document.querySelectorAll('button')).some(function(b){
                  var t=(b.textContent||'').replace(/\\s+/g,' ').trim();
                  return t.indexOf('I Confirm')>=0 && t.indexOf('Begin 24 Trades')>=0 && !b.disabled;
                });
              """))
              browser_phase='atomic_confirm_click'
              click_result=driver.execute_script("""
                var buttons=Array.from(document.querySelectorAll('button'));
                for (var i=0;i<buttons.length;i++) {
                  var b=buttons[i];
                  var t=(b.textContent||'').replace(/\\s+/g,' ').trim();
                  if (t.indexOf('I Confirm')>=0 && t.indexOf('Begin 24 Trades')>=0 && !b.disabled) {
                    b.click();
                    return {clicked:true,text:t};
                  }
                }
                return {clicked:false,text:null};
              """)
              if not click_result or click_result.get('clicked') is not True:
                raise RuntimeError('confirm button disappeared before atomic click')

              browser_phase='wait_package_ready'
              wait.until(lambda d: d.execute_script("return (function(){try{return eval('PACKAGE_V9_STATUS')}catch(e){return 'unavailable'}})();")=='ready')
              browser_phase='wait_vote_ui'
              wait.until(lambda d: 'Choose Left Side' in d.page_source and 'Choose Right Side' in d.page_source)
              browser_phase='collect_browser_diag'
              browser_diag=driver.execute_script("""
                return {
                  status:(function(){try{return eval('PACKAGE_V9_STATUS')}catch(e){return 'unavailable'}})(),
                  b8:(function(){try{return eval('PACKAGE_V9_B8_COMMIT')}catch(e){return null}})(),
                  safe:(function(){try{return eval('PACKAGE_V9_SAFE_SHA256')}catch(e){return null}})(),
                  sched:(function(){try{return eval('PACKAGE_V9_SCHEDULE_SHA256')}catch(e){return null}})(),
                  contract:(function(){try{return eval('PACKAGE_V9_CONTRACT_SHA256')}catch(e){return null}})()
                };
              """)
              browser_diag['confirm_click']=click_result
              browser_diag['phase']='complete'
              p1=(browser_diag.get('status')=='ready' and browser_diag.get('b8')==os.environ['B8_FREEZE_COMMIT'])
            except Exception as e:
              browser_diag={'phase':locals().get('browser_phase','browser_start'),'error':type(e).__name__+': '+str(e)[:800]}
              p1=False
            finally:
              if driver:
                try: driver.quit()
                except Exception: pass
          result['p1_browser_diagnostics']=browser_diag
          result['p1_live_browser_hash_verified']=bool(p1)
          if not p1:
            write_stop('STOP_B10B_P1_LIVE_BROWSER_PARITY_FAILED_NO_SENTINEL_POSTED',p2_private_collector_acceptance=False,p3_ktc_isolation=False,p4_no_public_outcome_exposure=False)

          # P2: exactly one invalid slot-0 sentinel, then positive persistence proof
          # from the sentinel-only private confirmation endpoint.
          session=secrets.token_hex(24)  # 192-bit
          ts=datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          vote=f'__pkgv9val__|pkgv9val_LAUNCHTEST|A|L|{session}|{ts}'
          meta=f'__pkgv9val_meta__|pkgv9val_LAUNCHTEST|A|0|0|{session}'
          schema='__pkgv9val_schema__|1'
          envelope=f'__pkgv9val_session__|0|{session}'
          payload={'voterRosterId':envelope,'keep':vote,'trade':meta,'cut':schema}
          canonical='\n'.join([envelope,vote,meta,schema])
          expected_hash=hashlib.sha256(canonical.encode()).hexdigest()
          result['probe_session_id_sha256']=hashlib.sha256(session.encode()).hexdigest()
          result['probe_field_sha256_expected']=expected_hash

          post=requests.post(collector,data=json.dumps(payload,separators=(',',':')),headers={'Content-Type':'text/plain;charset=utf-8'},timeout=30,allow_redirects=True)
          result['p2_post_http_status']=post.status_code

          private_found=False
          private_diag=None
          for _ in range(80):  # up to ~10 minutes
            try:
              q=requests.get(collector,params={'mode':'v9_launchtest_status','session':session,'b10b_status':str(time.time_ns())},timeout=30,allow_redirects=True)
              if q.status_code==200:
                private_diag=q.json()
                if private_diag.get('ok') is True and private_diag.get('found') is True:
                  private_found=(private_diag.get('count')==1 and private_diag.get('field_sha256')==expected_hash)
                  if private_found: break
            except Exception:
              pass
            time.sleep(7.5)
          result['p2_private_confirmation_response']=private_diag
          result['p2_private_collector_acceptance']=bool(private_found)
          if not private_found:
            write_stop('STOP_B10B_P2_PRIVATE_COLLECTOR_PERSISTENCE_NOT_CONFIRMED',p3_ktc_isolation=False,p4_no_public_outcome_exposure=False)

          # P3: exact KTC predicate excludes sentinel before daily cap; package_transport_rows
          # remains diagnostic-only inside ktc_pipeline.main.
          src=Path('scripts/market/ktc_pipeline.py').read_text()
          tree=ast.parse(src)
          selected=[]
          for node in tree.body:
            if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='PACKAGE_VOTE_PREFIXES' for t in node.targets): selected.append(node)
            if isinstance(node,ast.FunctionDef) and node.name=='is_package_vote_row': selected.append(node)
          ns={}
          exec(compile(ast.Module(body=selected,type_ignores=[]),'<b10b_ktc_isolation>','exec'),ns)
          pred=ns['is_package_vote_row']
          synthetic={'keep':vote,'trade':meta,'cut':schema,'voter_roster_id':envelope,'timestamp':ts}
          prefix_ok=(pred(synthetic) is True)
          split='rows = [r for r in all_rows if not is_package_vote_row(r)]'
          cap='rows = apply_daily_cap(rows)'
          before_cap=(split in src and cap in src and src.index(split)<src.index(cap))
          main_node=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='main')
          parents={child:parent for parent in ast.walk(main_node) for child in ast.iter_child_nodes(parent)}
          package_loads=[n for n in ast.walk(main_node) if isinstance(n,ast.Name) and n.id=='package_transport_rows' and isinstance(n.ctx,ast.Load)]
          usage_ok=True
          usage_shapes=[]
          for n in package_loads:
            p=parents.get(n)
            shape=type(p).__name__ if p else 'None'
            usage_shapes.append(shape)
            if isinstance(p,ast.If) and p.test is n:
              continue
            if isinstance(p,ast.Call) and isinstance(p.func,ast.Name) and p.func.id=='len':
              continue
            usage_ok=False
          # Also fail closed if the symbol is referenced in any other Python source file.
          other_refs=[]
          for f in Path('scripts').rglob('*.py'):
            if f.as_posix()=='scripts/market/ktc_pipeline.py': continue
            txt=f.read_text(errors='ignore')
            if 'package_transport_rows' in txt:
              other_refs.append(f.as_posix())
          p3=bool(prefix_ok and before_cap and usage_ok and not other_refs)
          result['p3_ktc_isolation']=p3
          result['p3_prefix_predicate_passed']=prefix_ok
          result['p3_split_before_daily_cap']=before_cap
          result['p3_package_transport_rows_usage_shapes']=usage_shapes
          result['p3_package_transport_rows_other_repo_refs']=other_refs
          if not p3:
            write_stop('STOP_B10B_P3_KTC_ISOLATION_FAILED',p4_no_public_outcome_exposure=False)

          # P4: because P2 positively proved storage in the private destination,
          # absence from the public published KTC CSV is now meaningful. V4 proved
          # the network-retry design but exposed a timing arithmetic bug: 96 reads
          # spaced 15 seconds apart plus HTTP latency could not reliably fit inside
          # a 26-minute deadline. V5 strengthens the evidence rule instead of
          # weakening it: require BOTH >=96 successful public observations AND a
          # full >=24-minute elapsed observation window. Poll every 12 seconds and
          # allow 30 minutes total headroom. Transport failures never count.
          public_hit=None
          public_successful_reads=0
          public_request_errors=[]
          p4_started=time.monotonic()
          p4_min_elapsed_seconds=24*60
          p4_deadline=p4_started+(30*60)
          while time.monotonic() < p4_deadline:
            try:
              rr=requests.get(public_csv,params={'b10b_public':str(time.time_ns())},timeout=30)
              rr.raise_for_status()
              rows=list(csv.DictReader(io.StringIO(rr.text)))
              public_successful_reads+=1
              for row in rows:
                if str(row.get('keep') or '')==vote:
                  public_hit=row
                  break
              if public_hit:
                break
              elapsed=time.monotonic()-p4_started
              if public_successful_reads >= 96 and elapsed >= p4_min_elapsed_seconds:
                break
              time.sleep(12)
            except requests.RequestException as e:
              public_request_errors.append(type(e).__name__+': '+str(e)[:240])
              time.sleep(5)

          p4_elapsed_seconds=time.monotonic()-p4_started
          result['p4_public_csv_successful_reads']=public_successful_reads
          result['p4_public_csv_request_error_count']=len(public_request_errors)
          result['p4_public_csv_request_errors_tail']=public_request_errors[-10:]
          result['p4_public_observation_elapsed_seconds']=round(p4_elapsed_seconds,3)
          result['p4_public_observation_minimum_seconds']=p4_min_elapsed_seconds
          result['p4_public_observation_required_successful_reads']=96
          if not public_hit and (public_successful_reads < 96 or p4_elapsed_seconds < p4_min_elapsed_seconds):
            write_stop('STOP_B10B_P4_PUBLIC_CSV_OBSERVABILITY_INSUFFICIENT',p4_no_public_outcome_exposure=False)

          # Re-check anonymous readability of the private destination after write.
          # Retry transient HTTP transport failures, but fail closed if neither
          # endpoint can be observed after repeated attempts.
          def get_retry(url, params, attempts=5):
            last=None
            for i in range(attempts):
              try:
                return requests.get(url,params=params,timeout=30,allow_redirects=True)
              except requests.RequestException as e:
                last=e
                time.sleep(2*(i+1))
            raise last

          try:
            pe2=get_retry(private_export,{'b10b_private_post':str(time.time_ns())})
            pe2_text=pe2.text[:5000]
            private_anonymous_after=(pe2.status_code==200 and private_header in pe2_text.replace('\r',''))
            gv2=get_retry(private_gviz,{'b10b_gviz_post':str(time.time_ns())})
            gv2_text=gv2.text[:5000]
            gviz_readable_after=(gv2.status_code==200 and 'voter_roster_id' in gv2_text and 'keep' in gv2_text)
          except requests.RequestException as e:
            result['p4_private_postcheck_error']=type(e).__name__+': '+str(e)[:500]
            write_stop('STOP_B10B_P4_PRIVATE_ENDPOINT_OBSERVABILITY_INSUFFICIENT',p4_no_public_outcome_exposure=False)

          result['p4_public_sentinel_found']=bool(public_hit)
          result['p4_private_destination_anonymously_readable_after']=private_anonymous_after
          result['p4_private_destination_gviz_status_after']=gv2.status_code
          result['p4_private_destination_gviz_readable_after']=gviz_readable_after
          p4=bool(not public_hit and public_successful_reads>=96 and p4_elapsed_seconds>=p4_min_elapsed_seconds and not private_anonymous_after and not gviz_readable_after)
          result['p4_no_public_outcome_exposure']=p4
          if not p4:
            write_stop('STOP_B10B_P4_PUBLIC_V9_OUTCOME_EXPOSURE_ROUTE_CONFIRMED')

          decision='PASS_B10B_P1_TO_P4_PRIVATE_COLLECTOR_VERIFIED'
          result['decision']=decision
          result['all_p1_to_p4_passed']=True
          result['human_voting_url_distribution_authorized']=False
          result['next_if_pass']='Proceed to P5 outcome-blind monitoring freeze and P6 committed launch checklist. B10B alone does not authorize voter URLs.'
          (OUT/'b10b_probe_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          report=[
            '# Package Adjustment V9 — B10B Private Collector Launch Preconditions P1–P4','',
            f'**Decision:** `{decision}`','',
            '- P1 live browser parity/hash verification: `True`',
            '- P2 private collector persistence confirmed by sentinel-only endpoint: `True`',
            '- P3 KTC isolation guard: `True`',
            '- P4 sentinel absent through >=96 successful public KTC CSV observations spanning >=24 minutes; private destination blocked through both export and gviz anonymous-read paths: `True`','',
            '**No real voter slot was used. Only invalid slot 0 / `pkgv9val_LAUNCHTEST` was submitted.**','',
            'Real voter URLs remain unauthorized until P5 and P6 are completed and committed.'
          ]
          (OUT/'b10b_report.md').write_text('\n'.join(report)+'\n')
          print('B10B decision:',decision)
          PY2

      - name: Validate B10B result and freeze durable diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import hashlib,json,os
          from pathlib import Path
          OUT=Path('/tmp/package-adjustment-v9-b10b')
          r=json.loads((OUT/'b10b_probe_result.json').read_text())
          assert r['study_id']=='package-adjustment-v9-discordant-human-validation'
          assert r['b9_deploy_commit']==os.environ['B9_DEPLOY_COMMIT']
          assert r['b8_freeze_commit']==os.environ['B8_FREEZE_COMMIT']
          assert r['b8_catalog_signature_set_sha256']==os.environ['B8_CATALOG_SIGNATURE']
          assert r['human_outcomes_read'] is False
          assert r['production_change_authorized'] is False
          assert r['human_voting_url_distribution_authorized'] is False
          assert r['probe_slot']==0 and r['probe_challenge_id']=='pkgv9val_LAUNCHTEST'
          assert r['probe_is_invalid_by_design'] is True
          allowed={
            'STOP_B10B_PUBLIC_CSV_SCHEMA_MISMATCH',
            'STOP_B10B_PREEXISTING_PUBLIC_REAL_V9_ROWS',
            'STOP_B10B_P4_PRIVATE_DESTINATION_PUBLICLY_READABLE',
            'STOP_B10B_P1_LIVE_BROWSER_PARITY_FAILED_NO_SENTINEL_POSTED',
            'STOP_B10B_P2_PRIVATE_COLLECTOR_PERSISTENCE_NOT_CONFIRMED',
            'STOP_B10B_P3_KTC_ISOLATION_FAILED',
            'STOP_B10B_P4_PUBLIC_V9_OUTCOME_EXPOSURE_ROUTE_CONFIRMED',
            'STOP_B10B_P4_PUBLIC_CSV_OBSERVABILITY_INSUFFICIENT',
            'STOP_B10B_P4_PRIVATE_ENDPOINT_OBSERVABILITY_INSUFFICIENT',
            'PASS_B10B_P1_TO_P4_PRIVATE_COLLECTOR_VERIFIED',
          }
          assert r['decision'] in allowed,r['decision']
          if r['decision']=='PASS_B10B_P1_TO_P4_PRIVATE_COLLECTOR_VERIFIED':
            assert r['all_p1_to_p4_passed'] is True
            assert r['p1_live_browser_hash_verified'] is True
            assert r['p2_private_collector_acceptance'] is True
            assert r['p3_ktc_isolation'] is True
            assert r['p4_no_public_outcome_exposure'] is True
            assert r['p4_public_csv_successful_reads'] >= 96
            assert r['p4_public_observation_required_successful_reads']==96
            assert r['p4_public_observation_elapsed_seconds'] >= 24*60
            assert r['p4_public_observation_minimum_seconds']==24*60
          else:
            assert r['all_p1_to_p4_passed'] is False
          h={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(OUT.iterdir()) if p.is_file()}
          (OUT/'b10b_output_hashes.json').write_text(json.dumps(h,indent=2,sort_keys=True)+'\n')
          print('PASS: B10B diagnostic validated:',r['decision'])
          PY3

          DEST="research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v5"
          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b10b/b10b_probe_result.json "$DEST/"
          cp /tmp/package-adjustment-v9-b10b/b10b_report.md "$DEST/"
          cp /tmp/package-adjustment-v9-b10b/b10b_output_hashes.json "$DEST/"

      - name: Preserve B10B outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v9-b10b-private-collector-p1-p4-v5
          if-no-files-found: warn
          retention-days: 90
          path: |
            /tmp/package-adjustment-v9-b10b/b10b_probe_result.json
            /tmp/package-adjustment-v9-b10b/b10b_report.md
            /tmp/package-adjustment-v9-b10b/b10b_output_hashes.json

      - name: Commit durable B10B diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v5
          git diff --cached --quiet && { echo "ERROR: no B10B diagnostic to commit"; exit 1; }
          git commit -m "Record Package Adjustment V9 B10B V5 private collector preflight"
          git push origin HEAD:main

      - name: Final B10B status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY4'
          import json
          from pathlib import Path
          r=json.loads(Path('research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v5/b10b_probe_result.json').read_text())
          print('B10B decision:',r['decision'])
          print('P1:',r.get('p1_live_browser_hash_verified'))
          print('P2:',r.get('p2_private_collector_acceptance'))
          print('P3:',r.get('p3_ktc_isolation'))
          print('P4:',r.get('p4_no_public_outcome_exposure'))
          if r['decision']!='PASS_B10B_P1_TO_P4_PRIVATE_COLLECTOR_VERIFIED':
            raise SystemExit('B10B STOP: real voter URLs remain unauthorized. See durable diagnostic decision above.')
          print('PASS: P1-P4 private collector preflight passed. Continue to P5/P6; URLs remain unauthorized.')
          PY4
