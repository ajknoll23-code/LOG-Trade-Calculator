name: B41A Player Role Engine V2 - Scientific Preregistration and Historical Source Feasibility

'on':
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}

jobs:
  preregister_and_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests>=2.32,<3"

      - name: Snapshot production surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Freeze scientific preregistration before any predictor-target modeling
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          mkdir -p "$BASE"

          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          base = Path("research/player-role-v2")
          out = base / "player_role_v2_b41a_scientific_preregistration.json"

          prereg = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41A-scientific-preregistration-and-source-feasibility",
              "status": "PREREGISTERED_BEFORE_ANY_MODEL_FIT_OR_TARGET_ASSOCIATION",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),

              "problem_definition": {
                  "purpose": (
                      "Replace hand-curated player role labels with an owner-blind, "
                      "empirically derived forward-looking role state that summarizes "
                      "near-term NFL opportunity and fantasy contribution."
                  ),
                  "role_is_not": [
                      "dynasty market value",
                      "team ownership",
                      "roster slot on a fantasy team",
                      "injury punishment",
                      "a manually assigned reputation label",
                  ],
                  "production_use_constraint": (
                      "No player role, role multiplier, ranking total, or player FV may "
                      "change until the historical model has been developed, frozen, "
                      "and passed untouched holdout validation."
                  ),
              },

              "population": {
                  "seasons_available_for_candidate_research": [2019, 2020, 2021, 2022, 2023, 2024, 2025],
                  "development_seasons": [2019, 2020, 2021, 2022, 2023, 2024],
                  "untouched_holdout_season": 2025,
                  "positions": ["QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"],
                  "unit": "player x origin week",
                  "minimum_origin_week": 4,
                  "latest_origin_week": 14,
                  "regular_season_only": True,
              },

              "target_architecture": {
                  "primary_target": (
                      "next-4-active-game league-scored fantasy points per game, "
                      "converted to an origin-week within-position percentile"
                  ),
                  "active_game_definition": (
                      "game in which the player is active and has documented offensive, "
                      "defensive, or special-teams participation; injury absences are not "
                      "automatically treated as zero-role games"
                  ),
                  "minimum_future_active_games": 2,
                  "secondary_target": (
                      "next-4-active-game mean snap-share percentile within position, "
                      "for positions where offensive/defensive snap share is meaningful"
                  ),
                  "sensitivity_horizons": [2, 6],
                  "primary_horizon_fixed_at": 4,
                  "reason_for_horizon": (
                      "Four active games is preregistered as a compromise between weekly "
                      "noise and season-long staleness. Two- and six-game horizons are "
                      "sensitivity analyses only and cannot replace the primary result."
                  ),
              },

              "candidate_predictor_families": {
                  "playing_time": [
                      "most recent completed-game snap share",
                      "last-3-active-game mean snap share",
                      "season-to-date active-game mean snap share",
                      "last-3 minus prior-3 snap-share trend",
                  ],
                  "opportunity": {
                      "QB": [
                          "pass attempts per active game",
                          "designed+rushing attempts per active game where available",
                      ],
                      "RB": [
                          "carries per active game",
                          "targets per active game",
                          "team carry share where derivable",
                          "team target share where derivable",
                      ],
                      "WR": [
                          "targets per active game",
                          "team target share",
                          "receiving air-yards share where available",
                      ],
                      "TE": [
                          "targets per active game",
                          "team target share",
                          "receiving air-yards share where available",
                      ],
                      "DL": [
                          "defensive snap share",
                          "tackles, sacks, TFL, QB hits and pressures where available",
                      ],
                      "LB": [
                          "defensive snap share",
                          "tackles, assists, TFL, sacks and QB hits where available",
                      ],
                      "DB": [
                          "defensive snap share",
                          "tackles, assists, passes defended and interceptions where available",
                      ],
                      "K": [
                          "field-goal attempts",
                          "extra-point attempts",
                      ],
                  },
                  "realized_production": [
                      "most recent active-game fantasy points",
                      "last-3-active-game league-scored PPG",
                      "season-to-date active-game league-scored PPG",
                      "last-3 versus prior-3 production trend",
                  ],
                  "forward_projection": [
                      (
                          "historical week-specific Sleeper projection only if B41A proves "
                          "the source can be reconstructed without known outcome leakage"
                      ),
                      (
                          "historical week-specific FantasyPros projection only if B41A proves "
                          "the source can be reconstructed without known outcome leakage"
                      ),
                  ],
              },

              "projection_provenance_rule": {
                  "historical_projection_features_default_status": "INELIGIBLE_UNTIL_PROVEN",
                  "requirement": (
                      "A historical projection source may enter development only if the "
                      "workflow can establish it is genuinely week-specific and does not "
                      "contain realized outcomes. If capture-time/as-of provenance is not "
                      "sufficiently defensible, projection features remain outside the "
                      "historical fitted model and may be evaluated only prospectively."
                  ),
                  "no_silent_substitution": True,
              },

              "feature_normalization": {
                  "rule": (
                      "Continuous signals are converted to within-position, origin-week "
                      "percentiles before model fitting unless a later preregistered phase "
                      "demonstrates a scientific reason not to do so."
                  ),
                  "owner_identity_used": False,
                  "dynasty_team_used": False,
                  "fantasy_roster_slot_used": False,
              },

              "model_development_plan": {
                  "cross_validation": (
                      "Leave-one-season-out cross-validation across 2019-2024 development seasons."
                  ),
                  "candidate_models": [
                      {
                          "name": "best_single_signal_baseline",
                          "purpose": "minimum credible benchmark",
                      },
                      {
                          "name": "nonnegative_linear_rank_model",
                          "purpose": (
                              "learn nonnegative signal weights from historical data; "
                              "weights are estimated, not hand assigned"
                          ),
                      },
                      {
                          "name": "monotonic_nonlinear_challenger",
                          "purpose": (
                              "allow stable nonlinearities while constraining higher usage/"
                              "production/projection signals from perversely lowering predicted role"
                          ),
                      },
                  ],
                  "selection_metric_primary": (
                      "mean absolute error of predicted versus realized future "
                      "within-position target percentile"
                  ),
                  "selection_metric_secondary": "Spearman rank correlation",
                  "complexity_rule": (
                      "Use a one-standard-error style rule: if a simpler candidate is "
                      "statistically indistinguishable from the best development candidate, "
                      "select the simpler candidate."
                  ),
                  "no_2025_holdout_access_during_selection": True,
              },

              "tier_derivation_plan": {
                  "role_order": [
                      "Speculative",
                      "Depth",
                      "Understudy",
                      "Rotational",
                      "Starter",
                      "Every-Down",
                      "Elite",
                  ],
                  "thresholds_hand_assigned": False,
                  "method": (
                      "After the winning continuous role score is frozen from development "
                      "data, derive exactly seven ordered contiguous score intervals using "
                      "development out-of-fold predictions only. Boundaries will be chosen "
                      "algorithmically to maximize separation in the primary future target "
                      "subject to minimum-cell-size and monotonicity constraints."
                  ),
                  "minimum_development_share_per_tier": 0.05,
                  "thresholds_frozen_before_2025_holdout": True,
              },

              "untouched_holdout_validation": {
                  "season": 2025,
                  "primary_tests": [
                      (
                          "paired season/week-cluster bootstrap comparison of absolute "
                          "prediction error versus the best single-signal baseline"
                      ),
                      (
                          "bootstrap confidence interval for pooled Spearman association "
                          "between frozen role score and future target"
                      ),
                      (
                          "ordered role tiers must show non-decreasing future production "
                          "on holdout data"
                      ),
                      (
                          "for snap-relevant positions, ordered role tiers must show "
                          "non-decreasing future snap share on holdout data"
                      ),
                  ],
                  "no_threshold_retuning_after_holdout_opened": True,
                  "no_weight_retuning_after_holdout_opened": True,
                  "failure_consequence": (
                      "No production deployment. A failed holdout closes this version or "
                      "requires a new preregistered model version with a new untouched test."
                  ),
              },

              "post_validation_production_plan": {
                  "weekly_schedule": "Tuesday after the previous NFL week is complete",
                  "weekly_job_retrains_model": False,
                  "weekly_job_behavior": (
                      "Apply frozen model weights, transformations, and tier thresholds to "
                      "fresh completed-week data. Weekly runs may update player roles but may "
                      "not refit the model."
                  ),
                  "future_retraining": (
                      "Requires a separately versioned research workflow and new preregistration."
                  ),
                  "B42_owner_blind_parity_audit_required_after_refresh": True,
              },

              "governance": {
                  "player_roles_changed": False,
                  "role_multipliers_changed": False,
                  "fundamental_values_changed": False,
                  "league_rankings_changed": False,
                  "index_html_changed": False,
                  "production_change_authorized": False,
              },
          }

          out.write_text(
              json.dumps(prereg, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("B41A preregistration written:", out)
          print("STATUS:", prereg["status"])
          print("PRODUCTION CHANGE AUTHORIZED: false")
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("research/player-role-v2/player_role_v2_b41a_scientific_preregistration.json")
              .read_text(encoding="utf-8")
          )
          assert p["status"] == "PREREGISTERED_BEFORE_ANY_MODEL_FIT_OR_TARGET_ASSOCIATION"
          assert p["population"]["untouched_holdout_season"] == 2025
          assert p["tier_derivation_plan"]["thresholds_hand_assigned"] is False
          assert p["model_development_plan"]["no_2025_holdout_access_during_selection"] is True
          assert p["untouched_holdout_validation"]["no_threshold_retuning_after_holdout_opened"] is True
          assert p["post_validation_production_plan"]["weekly_job_retrains_model"] is False
          assert p["governance"]["production_change_authorized"] is False
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$BASE/player_role_v2_b41a_scientific_preregistration.json"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Preregistration already frozen."
          else
            git commit -m "Preregister Player Role V2 scientific model development"
            git push origin HEAD:main
          fi

      - name: Probe historical objective-data sources without fitting any model
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          mkdir -p /tmp/player-role-v2-source-probe

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          from datetime import datetime, timezone
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import requests

          OUT = Path("/tmp/player-role-v2-source-probe")
          OUT.mkdir(parents=True, exist_ok=True)

          SEASONS = list(range(2019, 2026))
          SAMPLE_PROJECTION_WEEKS = [4, 8, 12]
          UA = {"User-Agent": "LOG-Trade-Calculator-player-role-v2-source-feasibility"}

          def sha256_bytes(b: bytes) -> str:
              return hashlib.sha256(b).hexdigest()

          def fetch_bytes(url: str, timeout: int = 120) -> bytes:
              r = requests.get(url, timeout=timeout, headers=UA)
              r.raise_for_status()
              return r.content

          def inspect_csv_bytes(payload: bytes) -> dict:
              text = payload.decode("utf-8-sig", errors="strict")
              reader = csv.DictReader(io.StringIO(text))
              headers = list(reader.fieldnames or [])
              n = 0
              sample = None
              for row in reader:
                  n += 1
                  if sample is None:
                      sample = row
              return {
                  "headers": headers,
                  "row_count": n,
                  "first_row_nonempty_fields": sorted(
                      [k for k, v in (sample or {}).items() if str(v or "").strip()]
                  ),
              }

          result = {
              "schema_version": 1,
              "study_id": "player-role-v2",
              "phase": "B41A-source-feasibility",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "model_fit_performed": False,
              "predictor_target_association_computed": False,
              "sources": {},
          }

          # 1) nflverse weekly player statistics, historical seasons.
          stats_summary = {}
          required_identity = {"season", "week", "player_id", "player_name", "position"}
          required_opportunity_any = {"attempts", "carries", "targets"}
          for season in SEASONS:
              url = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_player/stats_player_week_{season}.csv"
              )
              payload = fetch_bytes(url)
              meta = inspect_csv_bytes(payload)
              headers = set(meta["headers"])
              identity_ok = required_identity.issubset(headers)
              opportunity_fields = sorted(required_opportunity_any & headers)
              stats_summary[str(season)] = {
                  "url": url,
                  "sha256": sha256_bytes(payload),
                  "row_count": meta["row_count"],
                  "header_count": len(meta["headers"]),
                  "identity_columns_ok": identity_ok,
                  "opportunity_fields_present": opportunity_fields,
                  "has_fantasy_points": "fantasy_points" in headers,
                  "has_ppr_fantasy_points": "fantasy_points_ppr" in headers,
                  "has_receiving_air_yards": "receiving_air_yards" in headers,
                  "has_receiving_epa": "receiving_epa" in headers,
                  "headers": meta["headers"],
              }
              if not identity_ok or meta["row_count"] < 1000:
                  raise RuntimeError(
                      f"stats_player source failed feasibility for {season}: "
                      f"rows={meta['row_count']} identity_ok={identity_ok}"
                  )
          result["sources"]["nflverse_weekly_player_stats"] = {
              "status": "PASS",
              "seasons": stats_summary,
          }

          # 2) nflverse PFR snap counts, historical seasons.
          snap_summary = {}
          snap_required = {
              "season", "week", "player", "pfr_player_id", "position", "team",
              "offense_snaps", "offense_pct", "defense_snaps", "defense_pct",
          }
          for season in SEASONS:
              url = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"snap_counts/snap_counts_{season}.csv"
              )
              payload = fetch_bytes(url)
              meta = inspect_csv_bytes(payload)
              headers = set(meta["headers"])
              required_ok = snap_required.issubset(headers)
              snap_summary[str(season)] = {
                  "url": url,
                  "sha256": sha256_bytes(payload),
                  "row_count": meta["row_count"],
                  "required_columns_ok": required_ok,
                  "headers": meta["headers"],
              }
              if not required_ok or meta["row_count"] < 1000:
                  raise RuntimeError(
                      f"snap-count source failed feasibility for {season}: "
                      f"rows={meta['row_count']} required_ok={required_ok}"
                  )
          result["sources"]["nflverse_snap_counts"] = {
              "status": "PASS",
              "seasons": snap_summary,
          }

          # 3) Sleeper historical weekly projection endpoint.
          # This is a FEASIBILITY probe only. It does not make the projections
          # eligible for model fitting because the endpoint does not itself
          # establish an immutable historical capture timestamp.
          sleeper_summary = {}
          for season in (2019, 2021, 2023, 2025):
              season_rows = {}
              for week in SAMPLE_PROJECTION_WEEKS:
                  url = (
                      "https://api.sleeper.app/v1/projections/nfl/regular/"
                      f"{season}/{week}"
                  )
                  r = requests.get(url, timeout=60, headers=UA)
                  if r.status_code != 200:
                      season_rows[str(week)] = {
                          "http_status": r.status_code,
                          "usable_response": False,
                      }
                      continue
                  try:
                      data = r.json()
                  except Exception:
                      season_rows[str(week)] = {
                          "http_status": r.status_code,
                          "usable_response": False,
                          "reason": "non-json response",
                      }
                      continue
                  count = len(data) if isinstance(data, dict) else 0
                  season_rows[str(week)] = {
                      "http_status": r.status_code,
                      "usable_response": isinstance(data, dict) and count >= 50,
                      "player_count": count,
                      "response_sha256": sha256_bytes(r.content),
                      "capture_timestamp_provided_by_source": False,
                  }
              sleeper_summary[str(season)] = season_rows

          sleeper_any = any(
              week_meta.get("usable_response")
              for season_meta in sleeper_summary.values()
              for week_meta in season_meta.values()
          )
          result["sources"]["sleeper_historical_weekly_projections"] = {
              "endpoint_response_status": "PASS" if sleeper_any else "FAIL",
              "historical_model_eligibility": "INELIGIBLE_PENDING_AS_OF_PROVENANCE",
              "reason": (
                  "Week-specific historical responses can be probed, but the endpoint "
                  "does not provide an immutable pregame capture timestamp in this probe. "
                  "No historical projection signal may enter model fitting yet."
              ),
              "samples": sleeper_summary,
          }

          # 4) FantasyPros historical weekly projection API.
          # Again: endpoint availability alone is not enough for leakage-safe eligibility.
          fp_key = os.environ.get("FANTASYPROS_API_KEY", "").strip()
          fp_summary = {}
          if not fp_key:
              result["sources"]["fantasypros_historical_weekly_projections"] = {
                  "endpoint_response_status": "NOT_PROBED_NO_SECRET",
                  "historical_model_eligibility": "INELIGIBLE_PENDING_AS_OF_PROVENANCE",
                  "reason": "FANTASYPROS_API_KEY not available to this workflow.",
              }
          else:
              for season in (2019, 2021, 2023, 2025):
                  season_rows = {}
                  for week in (4, 8):
                      url = (
                          "https://api.fantasypros.com/public/v2/json/nfl/"
                          f"{season}/projections?position=RB&week={week}&scoring=HALF"
                      )
                      r = requests.get(
                          url,
                          timeout=60,
                          headers={
                              **UA,
                              "x-api-key": fp_key,
                          },
                      )
                      meta = {"http_status": r.status_code}
                      if r.status_code == 200:
                          try:
                              data = r.json()
                          except Exception:
                              data = {}
                          players = data.get("players") or []
                          meta.update({
                              "usable_response": (
                                  str(data.get("season")) == str(season)
                                  and str(data.get("week")) == str(week)
                                  and len(players) >= 20
                              ),
                              "claimed_season": data.get("season"),
                              "claimed_week": data.get("week"),
                              "player_count": len(players),
                              "response_sha256": sha256_bytes(r.content),
                              "capture_timestamp_provided_by_source": False,
                          })
                      else:
                          meta["usable_response"] = False
                      season_rows[str(week)] = meta
                  fp_summary[str(season)] = season_rows

              fp_any = any(
                  week_meta.get("usable_response")
                  for season_meta in fp_summary.values()
                  for week_meta in season_meta.values()
              )
              result["sources"]["fantasypros_historical_weekly_projections"] = {
                  "endpoint_response_status": "PASS" if fp_any else "FAIL",
                  "historical_model_eligibility": "INELIGIBLE_PENDING_AS_OF_PROVENANCE",
                  "reason": (
                      "The API may provide season/week-specific historical projections, "
                      "but endpoint identity alone does not prove the values are an immutable "
                      "pregame snapshot. Historical use remains blocked pending provenance."
                  ),
                  "samples": fp_summary,
              }

          # Overall scientific source decision.
          objective_ok = (
              result["sources"]["nflverse_weekly_player_stats"]["status"] == "PASS"
              and result["sources"]["nflverse_snap_counts"]["status"] == "PASS"
          )

          result["decision"] = {
              "objective_historical_development_path_feasible": objective_ok,
              "historical_projection_features_admitted": False,
              "next_phase_if_pass": (
                  "B41B historical cohort construction and leakage audit using "
                  "objective usage + production signals only, while separately "
                  "continuing projection provenance research"
              ),
              "production_change_authorized": False,
          }

          out = OUT / "player_role_v2_b41a_source_feasibility.json"
          out.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Player Role V2 — B41A Historical Source Feasibility",
              "",
              f"- Checked at: `{result['checked_at_utc']}`",
              "- Model fit performed: **No**",
              "- Predictor-target association computed: **No**",
              "",
              "## Objective historical sources",
              "",
              f"- nflverse weekly player stats 2019–2025: **{result['sources']['nflverse_weekly_player_stats']['status']}**",
              f"- nflverse snap counts 2019–2025: **{result['sources']['nflverse_snap_counts']['status']}**",
              "",
              "## Historical projections",
              "",
              (
                  "- Sleeper historical weekly projection endpoint: "
                  f"**{result['sources']['sleeper_historical_weekly_projections']['endpoint_response_status']}**; "
                  "model eligibility remains **blocked pending as-of provenance**."
              ),
          ]
          fp = result["sources"]["fantasypros_historical_weekly_projections"]
          lines.append(
              "- FantasyPros historical weekly projection endpoint: "
              f"**{fp['endpoint_response_status']}**; model eligibility remains "
              "**blocked pending as-of provenance**."
          )
          lines += [
              "",
              "## Decision",
              "",
              (
                  "- Objective usage + production development path feasible: "
                  f"**{objective_ok}**"
              ),
              "- Historical projection features admitted now: **False**",
              "- Production change authorized: **False**",
              "",
              "No hand-set signal percentages or role thresholds were created in B41A.",
              "",
          ]
          (OUT / "player_role_v2_b41a_source_feasibility.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print(json.dumps(result["decision"], indent=2))
          PY

      - name: Validate B41A firewall and commit source-feasibility artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"

          git fetch origin main
          git rebase origin/main

          cp /tmp/player-role-v2-source-probe/player_role_v2_b41a_source_feasibility.json \
            "$BASE/player_role_v2_b41a_source_feasibility.json"
          cp /tmp/player-role-v2-source-probe/player_role_v2_b41a_source_feasibility.md \
            "$BASE/player_role_v2_b41a_source_feasibility.md"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("research/player-role-v2/player_role_v2_b41a_scientific_preregistration.json")
              .read_text(encoding="utf-8")
          )
          f = json.loads(
              Path("research/player-role-v2/player_role_v2_b41a_source_feasibility.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "PREREGISTERED_BEFORE_ANY_MODEL_FIT_OR_TARGET_ASSOCIATION"
          assert p["tier_derivation_plan"]["thresholds_hand_assigned"] is False
          assert p["model_development_plan"]["no_2025_holdout_access_during_selection"] is True

          assert f["model_fit_performed"] is False
          assert f["predictor_target_association_computed"] is False
          assert f["decision"]["historical_projection_features_admitted"] is False
          assert f["decision"]["production_change_authorized"] is False
