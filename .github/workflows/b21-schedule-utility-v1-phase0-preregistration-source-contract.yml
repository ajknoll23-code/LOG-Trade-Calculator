name: B21 Schedule Utility V1 - Phase 0 Preregistration and Source Contract

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: b21-schedule-utility-v1-phase0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Snapshot production before research write
        shell: bash
        run: |
          set -euo pipefail
          echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "REGRESSION_SHA=$(sha256sum scripts/validation/repo_regression_checks.py | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Write frozen Schedule Utility V1 Phase 0 preregistration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/schedule-utility-v1

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(".")
          out = root / "research" / "schedule-utility-v1"
          json_path = out / "schedule_utility_v1_phase0_prereg.json"
          md_path = out / "schedule_utility_v1_phase0_prereg.md"

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          prereg = {
              "schema_version": 1,
              "study_id": "schedule-utility-v1",
              "phase": 0,
              "status": "PREREGISTERED_SOURCE_CONTRACT_ONLY",
              "generated_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "production_change_authorized": False,
              "outcome_association_opened": False,
              "player_fv_change_authorized": False,
              "draft_pick_fv_change_authorized": False,
              "package_adjustment_change_authorized": False,
              "team_utility_change_authorized": False,
              "trade_verdict_change_authorized": False,
              "market_value_change_authorized": False,
              "primary_purpose": (
                  "Display-only schedule context for near-term, rest-of-season, "
                  "and fantasy-playoff matchup difficulty. Schedule Utility is a "
                  "separate decision-support lens and is not part of Fundamental Value."
              ),
              "source_contract": {
                  "primary_provider": "4for4",
                  "primary_inputs": ["aFPA", "Hot Spots"],
                  "licensed_private_source": True,
                  "raw_provider_rows_may_be_committed": False,
                  "row_level_provider_output_may_be_committed": False,
                  "public_artifacts_must_be_aggregate_or_derived_only": True,
                  "required_capture_metadata": [
                      "source_capture_utc",
                      "season",
                      "source_week_or_as_of_week",
                      "team_or_defense",
                      "opponent",
                      "position_bucket",
                      "metric_name",
                      "metric_value_or_grade",
                  ],
                  "position_buckets": ["QB", "RB", "WR", "TE"],
                  "idp_in_scope_v1": False,
                  "fail_closed_on_missing_or_ambiguous_identity": True,
                  "fail_closed_on_missing_schedule_match": True,
              },
              "architecture": {
                  "unit_of_analysis": "player-team-position-week",
                  "schedule_join_key": "NFL team + opponent + week + position bucket",
                  "windows": {
                      "near_term": {
                          "definition": "next 3 scheduled games",
                          "single_composite_authorized": True,
                      },
                      "rest_of_season": {
                          "definition": (
                              "all remaining fantasy-relevant regular-season games "
                              "excluding configured fantasy-playoff weeks"
                          ),
                          "single_composite_authorized": True,
                      },
                      "fantasy_playoffs": {
                          "definition": (
                              "explicit configured league playoff weeks only; "
                              "no hard-coded playoff weeks if league configuration is absent"
                          ),
                          "single_composite_authorized": True,
                      },
                  },
                  "window_blending": {
                      "one_overall_schedule_score_authorized": False,
                      "reason": (
                          "Near-term, ROS, and playoff utility answer different decisions "
                          "and must remain separately visible in V1."
                      ),
                  },
                  "direction": "positive = easier/more favorable; negative = harder/less favorable",
                  "normalization": (
                      "Within position bucket and source snapshot only. "
                      "No cross-position raw-scale comparison."
                  ),
                  "missing_data_policy": "show unavailable; never impute neutral matchup",
                  "confidence_policy": (
                      "coverage/source freshness may be displayed, but no probability "
                      "or calibrated confidence claim without separate validation"
                  ),
              },
              "identity_policy": {
                  "player_identity_source": "current production canonical identity",
                  "schedule_utility_attaches_via_team_and_position_not_name_fuzzy_match": True,
                  "team_field_must_be_current": True,
                  "multi_position_players": (
                      "use the deployed valuation/eligibility bucket selected by current "
                      "production identity rules; do not choose the easiest matchup bucket"
                  ),
              },
              "scientific_sequence": [
                  {
                      "phase": "1A",
                      "name": "private source ingestion feasibility",
                      "outcomes_allowed": False,
                      "goal": (
                          "prove 4for4 aFPA/Hot Spots can be captured, normalized, "
                          "joined to schedule, and summarized without licensing leakage"
                      ),
                  },
                  {
                      "phase": "1B",
                      "name": "coverage and disagreement audit",
                      "outcomes_allowed": False,
                      "goal": (
                          "measure coverage, source freshness, position/team gaps, and "
                          "aFPA-vs-Hot-Spots agreement before any outcome test"
                      ),
                  },
                  {
                      "phase": "2",
                      "name": "retrospective predictive validation",
                      "outcomes_allowed": True,
                      "goal": (
                          "test whether preregistered schedule signals predict future "
                          "player fantasy production after controlling for baseline role/value"
                      ),
                  },
                  {
                      "phase": "3",
                      "name": "prospective shadow",
                      "outcomes_allowed": True,
                      "goal": (
                          "freeze live weekly schedule scores before games and evaluate "
                          "only subsequently realized weeks"
                      ),
                  },
                  {
                      "phase": "4",
                      "name": "display-only production consideration",
                      "outcomes_allowed": True,
                      "goal": (
                          "consider UI promotion only if validation is positive; "
                          "no FV blending is authorized by V1"
                      ),
                  },
              ],
              "success_criteria_policy": {
                  "no_threshold_tuning_in_phase0": True,
                  "no_source_weight_tuning_before_phase2": True,
                  "no_directional_claim_from_coverage_alone": True,
                  "production_promotion_requires_separate_explicit_gate": True,
              },
              "current_production_anchors": {
                  "index_sha256_at_prereg": sha(root / "index.html"),
                  "free_agent_board_sha256_at_prereg": sha(root / "free-agent-board.html"),
                  "repo_regression_validator_sha256_at_prereg": sha(
                      root / "scripts" / "validation" / "repo_regression_checks.py"
                  ),
              },
          }

          if json_path.exists():
              existing = json.loads(json_path.read_text(encoding="utf-8"))
              frozen_keys = (
                  "study_id",
                  "phase",
                  "production_change_authorized",
                  "outcome_association_opened",
                  "source_contract",
                  "architecture",
                  "identity_policy",
                  "scientific_sequence",
                  "success_criteria_policy",
              )
              for key in frozen_keys:
                  if existing.get(key) != prereg.get(key):
                      raise RuntimeError(f"existing Phase 0 prereg drifted at key: {key}")
              print("PASS: existing Schedule Utility V1 Phase 0 preregistration is scientifically identical.")
          else:
              json_path.write_text(
                  json.dumps(prereg, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              md_lines = [
                  "# Schedule Utility V1 — Phase 0 Preregistration",
                  "",
                  "**Status:** `PREREGISTERED_SOURCE_CONTRACT_ONLY`",
                  "",
                  "This phase freezes the Schedule Utility architecture before any predictor-target association is computed.",
                  "",
                  "## V1 purpose",
                  "",
                  "Schedule Utility is a display-only decision-support lens for:",
                  "",
                  "- next 3 games",
                  "- rest of fantasy regular season",
                  "- explicitly configured fantasy playoff weeks",
                  "",
                  "It does not change Fundamental Value, draft-pick value, Package Adjustment, Team Utility, Market Value, or the Trade Verdict.",
                  "",
                  "## Primary source contract",
                  "",
                  "- Provider: **4for4**",
                  "- Signals: **aFPA + Hot Spots**",
                  "- Raw/licensed provider rows remain private.",
                  "- Public repository artifacts may contain only aggregate or safely derived output.",
                  "- V1 offensive position buckets: **QB / RB / WR / TE**",
                  "- IDP schedule utility is **out of scope for V1**.",
                  "- Missing or ambiguous joins fail closed.",
                  "",
                  "## Frozen architecture",
                  "",
                  "- Unit: player-team-position-week.",
                  "- Join schedule context through current team + opponent + week + position.",
                  "- Near-term, ROS, and playoff scores remain separate.",
                  "- No single blended overall schedule score in V1.",
                  "- Positive means easier/more favorable; negative means harder/less favorable.",
                  "- Normalize only within position and source snapshot.",
                  "- Never impute missing schedule data as neutral.",
                  "- Multi-position players cannot be assigned whichever bucket creates the easiest matchup.",
                  "",
                  "## Scientific sequence",
                  "",
                  "1. **1A:** private-source ingestion feasibility — outcomes sealed.",
                  "2. **1B:** coverage/disagreement audit — outcomes sealed.",
                  "3. **2:** retrospective predictive validation.",
                  "4. **3:** prospective weekly shadow.",
                  "5. **4:** display-only production consideration.",
                  "",
                  "No FV blending is authorized by this preregistration.",
                  "",
              ]
              md_path.write_text("\n".join(md_lines), encoding="utf-8")
              print("PASS: wrote new frozen Schedule Utility V1 Phase 0 preregistration.")

          print(json.dumps({
              "decision": "PASS_SCHEDULE_UTILITY_V1_PHASE0_PREREGISTRATION",
              "production_change_authorized": False,
              "outcome_association_opened": False,
          }, indent=2))
          PY

      - name: Validate Phase 0 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("research/schedule-utility-v1/schedule_utility_v1_phase0_prereg.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["study_id"] == "schedule-utility-v1"
          assert d["phase"] == 0
          assert d["production_change_authorized"] is False
          assert d["outcome_association_opened"] is False
          assert d["player_fv_change_authorized"] is False
          assert d["team_utility_change_authorized"] is False
          assert d["trade_verdict_change_authorized"] is False

          src = d["source_contract"]
          assert src["primary_provider"] == "4for4"
          assert src["primary_inputs"] == ["aFPA", "Hot Spots"]
          assert src["raw_provider_rows_may_be_committed"] is False
          assert src["row_level_provider_output_may_be_committed"] is False
          assert src["position_buckets"] == ["QB", "RB", "WR", "TE"]
          assert src["idp_in_scope_v1"] is False

          arch = d["architecture"]
          assert arch["window_blending"]["one_overall_schedule_score_authorized"] is False
          assert arch["missing_data_policy"].startswith("show unavailable")

          seq = d["scientific_sequence"]
          assert [x["phase"] for x in seq] == ["1A", "1B", "2", "3", "4"]
          assert seq[0]["outcomes_allowed"] is False
          assert seq[1]["outcomes_allowed"] is False

          print("PASS: Schedule Utility V1 Phase 0 contract validated.")
          PY

      - name: Prove zero production mutation
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
          test "$(sha256sum scripts/validation/repo_regression_checks.py | awk '{print $1}')" = "$REGRESSION_SHA"

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')"
          echo "$CHANGED"

          if [ -n "$CHANGED" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                research/schedule-utility-v1/*) ;;
                *) echo "Unexpected non-research mutation: $path"; exit 1 ;;
              esac
            done <<< "$CHANGED"
          fi

          git diff --check
          echo "PASS: Phase 0 touched research/schedule-utility-v1 only."

      - name: Commit frozen Phase 0 research artifact
        shell: bash
        run: |
          set -euo pipefail

          git add \
            research/schedule-utility-v1/schedule_utility_v1_phase0_prereg.json \
            research/schedule-utility-v1/schedule_utility_v1_phase0_prereg.md

          if git diff --cached --quiet; then
            echo "Phase 0 already frozen; no commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Schedule Utility V1 Phase 0 preregistration"
          git push origin HEAD:main

      - name: Closeout summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## B21 Schedule Utility V1 — Phase 0"
            echo
            echo "- Decision: **PASS_SCHEDULE_UTILITY_V1_PHASE0_PREREGISTRATION**"
            echo "- Production change: **NONE**"
            echo "- Outcome association opened: **NO**"
            echo "- Source contract: **4for4 aFPA + Hot Spots**"
            echo "- V1 scope: **QB / RB / WR / TE**"
            echo "- Outputs remain separate: **Near-term / ROS / Playoffs**"
            echo "- Next phase: **1A private-source ingestion feasibility**"
          } >> "$GITHUB_STEP_SUMMARY"
