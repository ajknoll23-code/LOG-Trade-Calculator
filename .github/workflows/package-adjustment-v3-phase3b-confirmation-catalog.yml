name: Package Adjustment V3 - Phase 3B Fresh Confirmation Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard exact frozen Phase 3A contract and generator
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.json)" = \
            "19966121899d41bdbc754a6a260758cf175b12e2"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.md)" = \
            "b50cb6507da20c956930424a2d75be39ecb0d290"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration_manifest.json)" = \
            "df63773385e982ff7bfdfc0d042159e2ed957679"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3b.py)" = \
            "8ee4e8bb1abfb9e01797322a4710e9cd34e33ce5"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          cfg = json.loads(
              (d / "phase3_confirmation_preregistration.json")
              .read_text(encoding="utf-8")
          )
          man = json.loads(
              (d / "phase3_confirmation_preregistration_manifest.json")
              .read_text(encoding="utf-8")
          )

          assert cfg["status"] == "FROZEN_FRESH_CONFIRMATION_PREREGISTRATION"
          assert cfg["frozen"] is True
          assert cfg["catalog_design"]["research_cell_count"] == 24
          assert cfg["catalog_design"]["challenge_count"] == 240
          assert cfg["catalog_design"]["challenges_per_cell"] == 10
          assert cfg["catalog_design"]["new_vote_namespace"] == "__pkgv3c1__"
          assert cfg["candidate_family_fingerprint_sha256"] == \
              "c8610b7ac74631ed87cf52490f8368cfd3805034725cdb59fbed0d76a3b885ed"

          assert man["catalog_generated"] is False
          assert man["voting_activated"] is False
          assert man["human_vote_outcomes_read"] is False
          assert man["old_900_vote_dataset_read"] is False

          print("PASS: Phase 3A frozen contract verified.")
          PY

      - name: Guard unused Phase 3B output surface
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v3-ktc-style"
          test ! -e "$D/phase3_confirmation_catalog.json"
          test ! -e "$D/phase3_confirmation_catalog.md"
          test ! -e "$D/phase3_confirmation_catalog_manifest.json"

          sha256sum \
            index.html \
            research/package-adjustment-production-candidate-v1/live_deployment.json \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md \
            > "${RUNNER_TEMP}/protected_before.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Generator self-test
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3b.py --selftest

      - name: Generate frozen fresh-confirmation catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3b.py --generate
          cat research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.md

      - name: Validate frozen catalog exactly
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          doc = json.loads(
              (d / "phase3_confirmation_catalog.json")
              .read_text(encoding="utf-8")
          )
          man = json.loads(
              (d / "phase3_confirmation_catalog_manifest.json")
              .read_text(encoding="utf-8")
          )

          assert doc["status"] == "frozen_unreleased_fresh_confirmation_catalog"
          assert doc["frozen"] is True
          assert doc["released"] is False
          assert doc["voting_activated"] is False
          assert doc["research_only"] is True
          assert doc["consumer_changed"] is False
          assert doc["production_formula_enabled"] is False
          assert doc["production_revision_retained"] == "v1.6-v5-size2-composition-overlay"
          assert doc["vote_namespace_reserved"] == "__pkgv3c1__"
          assert doc["old_900_vote_dataset_read"] is False
          assert doc["human_vote_outcomes_read"] is False

          challenges = doc["challenges"]
          assert len(challenges) == 240
          assert len({c["id"] for c in challenges}) == 240

          cells = Counter(c["research_cell"] for c in challenges)
          assert len(cells) == 24
          assert set(cells.values()) == {10}

          topologies = Counter(c["topology"] for c in challenges)
          assert topologies == {
              "1v2": 40,
              "1v3": 40,
              "2v2": 40,
              "2v3": 40,
              "3v3": 40,
              "3v4": 40,
          }

          mixes = Counter(c["asset_mix"] for c in challenges)
          assert mixes == {
              "players_only": 120,
              "includes_picks": 120,
          }

          bands = Counter(c["disagreement_band"] for c in challenges)
          assert bands == {
              "g201_vs_g215": 120,
              "g215_vs_g230": 120,
          }

          for c in challenges:
              assert c["schema_version"] == 1
              assert c["experiment"] == "package_adjustment_v3_fresh_confirmation"
              assert len(c["side_a"]) == c["side_a_count"]
              assert len(c["side_b"]) == c["side_b_count"]
              ids = [a["id"] for a in c["side_a"] + c["side_b"]]
              assert len(ids) == len(set(ids))
              assert 0.80 <= float(c["raw_side_total_ratio"]) <= 1.25
              if c["asset_mix"] == "players_only":
                  assert all(
                      a["kind"] == "player"
                      for a in c["side_a"] + c["side_b"]
                  )
              else:
                  kinds = {
                      a["kind"]
                      for a in c["side_a"] + c["side_b"]
                  }
                  assert "player" in kinds and "pick" in kinds

          diag = doc["catalog_diagnostics"]
          assert diag["known_ktc_examples_in_selected_catalog"] == 0
          assert diag["historical_trade_matches_in_selected_catalog"] == 0

          assert man["catalog_generated"] is True
          assert man["voting_activated"] is False
          assert man["production_change_authorized"] is False
          assert man["old_900_vote_dataset_read"] is False
          assert man["human_vote_outcomes_read"] is False

          print("PASS: exact 240-challenge frozen fresh-confirmation catalog.")
          PY

      - name: Prove production remains byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/protected_before.sha256"

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Guard exact Phase 3B scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.json",
              "research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.md",
              "research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected Phase 3B changed-file set. "
                  f"Expected={sorted(expected)} Actual={sorted(actual)}"
              )

          print("PASS: exact Phase 3B research-only scope.")
          PY

      - name: Commit frozen catalog
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.json \
            research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog.md \
            research/package-adjustment-v3-ktc-style/phase3_confirmation_catalog_manifest.json

          git diff --cached --check
          git commit -m "research: freeze package adjustment v3 confirmation catalog"
          git push origin HEAD:main

      - name: Final proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: fresh confirmation catalog frozen; voting still inactive; production unchanged."
