name: Package Adjustment V4 - Phase 3D Maturity Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: package-adjustment-v4-phase3d-maturity
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install monitor dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V4 confirmation inputs
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$V4/package_adjustment_v4_phase3d_maturity.py")" = "6247e3caab529656d56524c8bc45a84ec7b6d602"
          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog_manifest.json")" = "9e23647b9e877b4b20c1f2ff52ec01ecf7db8fb7"
          test "$(git hash-object "$V4/phase3c_voting_release.json")" = "32fcdfed8216334fb4773595f09c883bc8333e0d"

          grep -Fq "__pkgv4c1__|" index.html
          grep -Fq "__pkgv4c1__|" scripts/market/ktc_pipeline.py

      - name: Maturity monitor self-test
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3d_maturity.py --selftest

      - name: Run outcome-blind V4 maturity monitor
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3d_maturity.py

      - name: Verify aggregate-only monitor output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/package-adjustment-v4-phase3d-maturity/phase3d_maturity.json")
          result = json.loads(p.read_text())

          allowed = {
              "COLLECT_TO_EXACT_600",
              "CONTINUE_TO_EXACT_700",
              "CONTINUE_TO_EXACT_800",
              "STOP_AND_FREEZE_AT_600",
              "STOP_AND_FREEZE_AT_700",
              "STOP_AND_FREEZE_AT_800",
              "STOP_UNRESOLVED_AT_HARD_CAP_800",
          }
          assert result["status"] in allowed
          assert result["study_id"] == "package-adjustment-v4-elite-fragmentation"
          assert result["phase"] == "3D"
          assert result["outcome_blind"] is True
          assert result["model_evaluation_performed"] is False
          assert result["candidate_predictions_read"] is False
          assert result["vote_response_tokens_read"] is False
          assert result["display_orientation_tokens_read"] is False
          assert result["production_changed"] is False
          assert result["contract"]["exact_checkpoints_effective_votes"] == [600,700,800]
          assert result["contract"]["required_cell_count"] == 24
          assert len(result["current"]["cells"]) == 24

          forbidden = {
              "voter", "voter_id", "voter_roster_id",
              "keep", "trade", "cut", "response",
              "choice", "choice_side", "displayed_left",
              "left_side", "ballots",
          }

          def walk(v):
              if isinstance(v, dict):
                  assert not (set(v) & forbidden), set(v) & forbidden
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)

          walk(result)
          print("PASS: V4 maturity output is aggregate-only and outcome-blind.")
          print("V4_PHASE3D_STATUS=" + result["status"])
          PY

      - name: Prove repository remained read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: maturity monitor made no repository changes."

      - name: Upload maturity snapshot
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v4-phase3d-maturity-${{ github.run_id }}
          path: /tmp/package-adjustment-v4-phase3d-maturity/
          if-no-files-found: error
          retention-days: 30
