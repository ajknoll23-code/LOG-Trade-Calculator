name: Package Adjustment V3 - Phase 2 Candidate Family

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard frozen Phase 1 lineage and exact Phase 2 evaluator
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase1.py)" = "fccf42fc8fd98aae3bd03653d0ac591e535147ea"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase1_architecture_audit.json)" = "54b241c1ee9260b76121ee4243c4c46ebcdb53b1"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase1_preregistration.json)" = "10d61ece1033a922802216d50d7a8fcb64610d0d"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py)" = "d58c8802c1133a97bae0ae0903dc421f27265b58"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("research/package-adjustment-v3-ktc-style/phase1_architecture_audit.json")
              .read_text(encoding="utf-8")
          )
          assert p["decision"] == "PASS_V3_PHASE1_ARCHITECTURE_REPLACEMENT_JUSTIFIED"
          assert p["production_change_authorized"] is False
          assert p["governance"]["old_900_votes_used_for_fit"] is False
          assert p["governance"]["old_900_votes_used_for_selection"] is False
          assert p["historical_league_trade_anchors"]["verified_trade_count"] == 8
          print("PASS: frozen Phase 1 lineage verified.")
          PY

      - name: Guard clean production baseline
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          sha256sum             index.html             research/package-adjustment-production-candidate-v1/live_deployment.json             scripts/validation/package_adjustment_exact_live_oos.py             scripts/validation/package_adjustment_exact_live_oos_v1_6.py             > "${RUNNER_TEMP}/production_before.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Freeze Phase 2 preregistration
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py --preregister

      - name: Phase 2 evaluator self-test
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py --selftest

      - name: Evaluate candidate family
        shell: bash
        run: |
          set -euo pipefail
          python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py --evaluate
          cat research/package-adjustment-v3-ktc-style/phase2_candidate_family.md

      - name: Enforce frozen family decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("research/package-adjustment-v3-ktc-style/phase2_candidate_family.json")
              .read_text(encoding="utf-8")
          )

          assert p["decision"] == "PASS_V3_PHASE2_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION"
          assert p["production_change_authorized"] is False
          assert p["governance"]["old_900_vote_dataset_read"] is False
          assert p["governance"]["old_900_vote_dataset_used_for_fit"] is False
          assert p["governance"]["old_900_vote_dataset_used_for_selection"] is False
          assert p["fresh_confirmation_family_ids"] == [
              "power-g2.01",
              "power-g2.15",
              "power-g2.30",
          ]
          assert p["development_reference_candidate_id"] == "power-g2.01"
          assert p["asset_universe"]["pick_variant_count"] == 72

          eligible = [
              row for row in p["candidate_results"]
              if row["eligible_for_fresh_confirmation"]
          ]
          assert len(eligible) == 3
          assert all(row["hard_invariants"]["pass"] for row in eligible)
          assert all(
              row["hard_invariants"]["stress_case_count"] == 2000
              for row in eligible
          )

          print("PASS: three-candidate family frozen for fresh confirmation.")
          PY

      - name: Prove production byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/production_before.sha256"

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Guard exact research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v3-ktc-style/phase2_preregistration.json",
              "research/package-adjustment-v3-ktc-style/phase2_preregistration.md",
              "research/package-adjustment-v3-ktc-style/phase2_candidate_family.json",
              "research/package-adjustment-v3-ktc-style/phase2_candidate_family.md",
              "research/package-adjustment-v3-ktc-style/phase2_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected Phase 2 changed-file set. "
                  f"Expected={sorted(expected)} Actual={sorted(actual)}"
              )

          print("PASS: exact Phase 2 research-only scope.")
          PY

      - name: Commit frozen Phase 2 research
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/package-adjustment-v3-ktc-style/phase2_preregistration.json
          git add research/package-adjustment-v3-ktc-style/phase2_preregistration.md
          git add research/package-adjustment-v3-ktc-style/phase2_candidate_family.json
          git add research/package-adjustment-v3-ktc-style/phase2_candidate_family.md
          git add research/package-adjustment-v3-ktc-style/phase2_manifest.json

          git diff --cached --check
          git commit -m "research: package adjustment v3 candidate family phase 2"
          git push origin HEAD:main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: Phase 2 family frozen; production unchanged."
