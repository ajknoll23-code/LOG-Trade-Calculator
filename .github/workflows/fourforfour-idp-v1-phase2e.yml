name: 4for4 IDP V1 - Phase 2E Prospective Scorer Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-scorer-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Verify frozen research lineage
        shell: bash
        run: |
          set -euo pipefail
          check_sha256() {
            local path="$1" expected="$2" actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: SHA256 drift for $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          }
          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git blob drift for $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          }
          check_sha256 scripts/fantasypros_api_normalized_2026.json 3da23f6168576c789de86690fc059d0a33b2b0bb096ace2ec4eb9ba0d94237cb
          check_sha256 scripts/artifacts/generated/sleeper_2026_raw_categories.json ee577f745416d375938fbdbdf28f1dfbf9f304f6c9d5cedc62733b12c52cb4e0
          check_sha256 scripts/identity_crosswalk.json 9ba70abae4f5f1946471b7cf3827db0a4c9cb7967b131c2c33d0073e692126eb
          check_blob scripts/projections/fourforfour_projection_pipeline.py 50dddd078eec10b955c29f3f5fab239b56f19438
          check_blob scripts/model/idp_v1_projection.py d25c46243184d031651a80bda26cbdc05aa50419
          check_blob .github/workflows/fourforfour-idp-v1-phase2c.yml 1aa5c166ac7ca5de96cf2ee2591722775009dc29
          check_blob .github/workflows/fourforfour-idp-v1-phase2d.yml 975b62dc96dab38bc8f2a12a20488ba1d46f5e15
          echo 'PASS: Phase 2B/2C/2D lineage and frozen source snapshots are exact.'
          echo 'PHASE2E_SCORER_SHA256=f34d2cbe42a78efa40e8d10d2666dbdf53332fddb419aa7322de6c1ab4c3b5c0'

      - name: Decode and verify private 4for4 inputs outside repository
        shell: bash
        run: |
          set -euo pipefail
          for var in FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            if [ -z "${!var:-}" ]; then echo "ERROR: missing $var" >&2; exit 1; fi
          done
          install -d -m 700 /tmp/log-fourforfour-idp-v1/input /tmp/log-fourforfour-idp-v1/output
          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc > /tmp/log-fourforfour-idp-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc > /tmp/log-fourforfour-idp-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc > /tmp/log-fourforfour-idp-v1/input/db.csv
          chmod 600 /tmp/log-fourforfour-idp-v1/input/*.csv
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/dl.csv | awk '{print $1}')" = a8ae4a3dc3ed7e24e102e9416467826dd93441cc6b18c0589ed8345aeca977f6
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/lb.csv | awk '{print $1}')" = 957e3c03b604302d259393d3cd3c637d03ff15b6a51812bb23cc0d10830a8321
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/db.csv | awk '{print $1}')" = 7bc8fb440f171bc65ab82e4c2cf1ed88e4b53a6f64868461ac8a96cb08d9b079
          echo 'PASS: private 4for4 source exact.'

      - name: Rebuild frozen private normalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/fourforfour_projection_pipeline.py \
            --dl /tmp/log-fourforfour-idp-v1/input/dl.csv \
            --lb /tmp/log-fourforfour-idp-v1/input/lb.csv \
            --db /tmp/log-fourforfour-idp-v1/input/db.csv \
            --output-dir /tmp/log-fourforfour-idp-v1/output/private \
            --public-summary /tmp/log-fourforfour-idp-v1/output/aggregate-summary.json \
            > /tmp/log-fourforfour-idp-v1/output/pipeline.stdout.txt

      - name: Reuse green Phase 2C and 2D code and freeze prospective scorer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, re, textwrap
          from pathlib import Path

          p2c = Path('.github/workflows/fourforfour-idp-v1-phase2c.yml').read_text(encoding='utf-8')
          m = re.search(r"cat > /tmp/fourforfour-phase2c\.py\.b64 <<'B64'\n(.*?)\n\s*B64", p2c, re.S)
          if not m:
              raise SystemExit('ERROR: unable to extract Phase 2C script')
          payload = ''.join(line.strip() for line in m.group(1).splitlines())
          script = base64.b64decode(payload).decode('utf-8')

          p2d = Path('.github/workflows/fourforfour-idp-v1-phase2d.yml').read_text(encoding='utf-8')
          m2 = re.search(r"cat >> /tmp/fourforfour-phase2d\.py <<'PY'\n(.*?)\n\s*PY", p2d, re.S)
          if not m2:
              raise SystemExit('ERROR: unable to extract Phase 2D semantics block')
          script += '\n' + textwrap.dedent(m2.group(1)) + '\n'
          Path('/tmp/fourforfour-phase2e.py').write_text(script, encoding='utf-8')
          PY

          cat >> /tmp/fourforfour-phase2e.py <<'PY'
          # ------------------------------------------------------------------
          # Phase 2E: freeze the prospective scorer implementation before the
          # calibration window is complete. This phase reads Week 1 only through
          # its inherited Phase 2C/2D audit. It MUST NOT read Weeks 2+ outcomes.
          # ------------------------------------------------------------------
          EXPECTED_PHASE2E_SCORER_FP = 'f34d2cbe42a78efa40e8d10d2666dbdf53332fddb419aa7322de6c1ab4c3b5c0'

          if phase2d_fp != EXPECTED_PHASE2D_SEMANTICS_FP:
              raise RuntimeError(f'Phase 2D semantics drifted: {phase2d_fp}')

          phase2e_contract = {'schema_version': 1, 'study': 'fourforfour-idp-v1-phase2e-prospective-scorer-freeze', 'parent_phase2b_methodology_fingerprint_sha256': 'f807a276cbe0be89f944a5ebacdc4143b592d3efc425a173f78030abff968c9f', 'parent_phase2c_audit_contract_fingerprint_sha256': '0ec64c7e3cc54ac2279ac21f6f1baa48b18d0e873f45c88786e6cfcc7622dded', 'parent_phase2d_semantics_contract_fingerprint_sha256': 'c4d2707a231917b15282b4599de91b4f32f14743b864cd341d1cb4184c3ad609', 'primary_population': 'frozen_453_three_source_cohort_with_outcome_identity_missingness_reported_not_silently_dropped', 'prediction_transform': 'provider_common_core_LOG_points_to_within_position_midrank_percentile_then_weighted_sum', 'percentile_formula': '(midrank_ascending_minus_1)/(n_minus_1); higher_projection_is_higher_percentile', 'incumbent_benchmark': 'canonical_IDP_V1_common_core_formula_excluding_TFL_QBH_then_same_within_position_percentile', 'candidate_grid': {'step': 0.1, 'sum_to': 1.0, 'minimum_fourforfour_weight': 0.1, 'candidate_count': 55}, 'common_core_log_scoring': {'solo_tackles': 1.5, 'assisted_tackles': 0.75, 'sacks': 3.0, 'interceptions': 6.0, 'passes_defended': 3.0, 'forced_fumbles': 3.0, 'fumble_recoveries': 4.0, 'defensive_tds': 6.0}, 'realized_stat_mapping': {'solo_tackles': ['def_tackles_solo', 'def_tackles_with_assist'], 'assisted_tackles': 'def_tackle_assists', 'sacks': 'def_sacks', 'interceptions': 'def_interceptions', 'passes_defended': 'def_pass_defended', 'forced_fumbles': 'def_fumbles_forced', 'fumble_recoveries': 'fumble_recovery_opp', 'defensive_tds': 'def_tds'}, 'intention_to_treat': 'all_outcome_identity_resolved_frozen_cohort_players_remain_in_each_window; nonparticipation_contributes_zero_realized_points', 'zero_imputation': 'positive_defensive_snaps_plus_missing_stats_row_is_zero_tracked_points; no_snap_no_event_also_contributes_zero_to_cumulative_intention_to_treat_target', 'calibration_window': [2, 3, 4, 5, 6], 'holdout_window': [7, 8, 9, 10], 'confirmation_window_if_needed': [11, 12, 13, 14], 'realized_target': 'cumulative_common_core_LOG_points_over_entire_window', 'primary_metric': 'macro_mean_DL_LB_DB_Spearman', 'secondary_metrics': ['overall_Spearman', 'macro_mean_top_quartile_overlap', 'per_position_Spearman_delta_vs_incumbent'], 'top_quartile_rule': 'ceil(n/4)_highest_prediction_keys_compared_with_ceil(n/4)_highest_realized_keys_per_position; overlap_fraction_denominator_is_realized_top_quartile_size', 'calibration_selection_rule': 'highest_macro_position_Spearman_then_higher_macro_top_quartile_overlap_then_lexicographic_weights_fourforfour_fantasypros_sleeper', 'outcome_embargo_for_this_phase': 'read_Week1_semantics_only;_do_not_read_Weeks2plus_outcomes', 'future_calibration_gate': 'select_exactly_one_candidate_only_after_complete_Weeks2_to_6_outcomes_are_available', 'production_changes': False, 'incumbent_no_signal_rule': 'assign_zero_common_core_points_and_preserve_frozen_cohort; do_not_use_production_old_projection_fallback_because_primary_study_is_common_core_only'}
          phase2e_fp = canonical_hash(phase2e_contract)
          if phase2e_fp != EXPECTED_PHASE2E_SCORER_FP:
              raise RuntimeError(f'Phase 2E scorer fingerprint mismatch: {phase2e_fp}')

          import sys
          sys.path.insert(0, str(REPO / 'scripts'))
          from model import idp_v1_projection

          PRIMARY_BUCKETS = ('DL', 'LB', 'DB')
          PRIMARY_COMMON = {
              'solo_tackles': {'4for4':'idp_tkl_solo','sleeper':'idp_tkl_solo','fantasypros':'def_tackle','weight':1.5},
              'assisted_tackles': {'4for4':'idp_tkl_ast','sleeper':'idp_tkl_ast','fantasypros':'def_assist','weight':0.75},
              'sacks': {'4for4':'idp_sack','sleeper':'sack','fantasypros':'def_sack','weight':3.0},
              'interceptions': {'4for4':'idp_int','sleeper':'int','fantasypros':'def_int','weight':6.0},
              'passes_defended': {'4for4':'idp_pass_def','sleeper':'idp_pass_def','fantasypros':'def_pd','weight':3.0},
              'forced_fumbles': {'4for4':'idp_ff','sleeper':'idp_ff','fantasypros':'def_ff','weight':3.0},
              'fumble_recoveries': {'4for4':'idp_fum_rec','sleeper':'idp_fum_rec','fantasypros':'def_fr','weight':4.0},
              'defensive_tds': {'4for4':'idp_td','sleeper':'idp_td','fantasypros':'def_td','weight':6.0},
          }

          def p2e_source_stats(sid, source):
              if source == '4for4':
                  return fourforfour_by_sid[sid].get('raw_category_season_totals') or {}
              if source == 'sleeper':
                  return sleeper_by_sid[sid].get('raw_category_season_totals') or {}
              if source == 'fantasypros':
                  return fp_by_sid[sid].get('raw_stats_used') or {}
              raise KeyError(source)

          def p2e_provider_points(sid, source):
              stats = p2e_source_stats(sid, source)
              total = 0.0
              for meta in PRIMARY_COMMON.values():
                  value = finite_number(stats.get(meta[source]))
                  if value is None:
                      raise RuntimeError(f'non-numeric primary projection field source={source}')
                  total += value * meta['weight']
              return total

          def p2e_midrank_percentiles(score_by_sid, sids):
              if len(sids) < 2:
                  raise RuntimeError('position bucket too small for percentile transform')
              ordered = sorted(sids, key=lambda sid: (score_by_sid[sid], sid))
              out = {}
              i = 0
              n = len(ordered)
              while i < n:
                  j = i + 1
                  while j < n and score_by_sid[ordered[j]] == score_by_sid[ordered[i]]:
                      j += 1
                  midrank = ((i + 1) + j) / 2.0
                  pct = (midrank - 1.0) / (n - 1.0)
                  for k in range(i, j):
                      out[ordered[k]] = pct
                  i = j
              return out

          def p2e_incumbent_common_core(sid):
              fp = p2e_source_stats(sid, 'fantasypros')
              sl = p2e_source_stats(sid, 'sleeper')
              fp_active = idp_v1_projection.has_meaningful_fp_signal(fp)
              sl_active = idp_v1_projection.has_meaningful_sleeper_signal(sl)
              if not fp_active and not sl_active:
                  # Frozen primary cohort is source-row based, not positive-signal based.
                  # For the common-core prospective benchmark, an incumbent with no
                  # meaningful FP/Sleeper V1 signal contributes zero prediction points.
                  # Do not use the production old-projection fallback here because that
                  # value is not decomposable into the preregistered common-core categories.
                  return 0.0

              def v(stats, key):
                  return float(stats.get(key, 0) or 0)

              fp_solo, fp_ast = v(fp,'def_tackle'), v(fp,'def_assist')
              sl_solo, sl_ast = v(sl,'idp_tkl_solo'), v(sl,'idp_tkl_ast')
              fp_total, sl_total = fp_solo + fp_ast, sl_solo + sl_ast
              if fp_total > 0 and sl_total > 0:
                  total = 0.5 * fp_total + 0.5 * sl_total
                  share = 0.4 * (fp_solo/fp_total) + 0.6 * (sl_solo/sl_total)
                  solo = total * share
                  ast = total - solo
                  points = solo * 1.5 + ast * 0.75
              elif fp_total > 0:
                  points = fp_solo * 1.5 + fp_ast * 0.75
              elif sl_total > 0:
                  points = sl_solo * 1.5 + sl_ast * 0.75
              else:
                  points = 0.0

              for fk, sk, mult in (
                  ('def_sack','sack',3.0), ('def_int','int',6.0),
                  ('def_pd','idp_pass_def',3.0), ('def_ff','idp_ff',3.0),
                  ('def_fr','idp_fum_rec',4.0), ('def_td','idp_td',6.0),
              ):
                  fv, sv = v(fp,fk), v(sl,sk)
                  if fp_active and sl_active:
                      x = 0.5 * fv + 0.5 * sv
                  elif fp_active:
                      x = fv
                  else:
                      x = sv
                  points += x * mult
              return points

          def p2e_rankdata(values):
              order = sorted(range(len(values)), key=lambda i: values[i])
              ranks = [0.0] * len(values)
              i = 0
              while i < len(order):
                  j = i + 1
                  while j < len(order) and values[order[j]] == values[order[i]]:
                      j += 1
                  avg = (i + 1 + j) / 2.0
                  for k in range(i, j):
                      ranks[order[k]] = avg
                  i = j
              return ranks

          def p2e_pearson(xs, ys):
              if len(xs) != len(ys) or len(xs) < 2:
                  return None
              mx, my = statistics.mean(xs), statistics.mean(ys)
              dx, dy = [x-mx for x in xs], [y-my for y in ys]
              den = math.sqrt(sum(x*x for x in dx) * sum(y*y for y in dy))
              if den <= 0:
                  return None
              return sum(x*y for x,y in zip(dx,dy)) / den

          def p2e_spearman(xs, ys):
              return p2e_pearson(p2e_rankdata(xs), p2e_rankdata(ys))

          def p2e_top_quartile_overlap(pred_by_sid, realized_by_sid, sids):
              import math as _math
              q = max(1, _math.ceil(len(sids) / 4.0))
              pred_top = set(sorted(sids, key=lambda x: (-pred_by_sid[x], x))[:q])
              real_top = set(sorted(sids, key=lambda x: (-realized_by_sid[x], x))[:q])
              return len(pred_top & real_top) / q

          def p2e_candidate_grid():
              rows = []
              for f4i in range(1, 11):
                  for fpi in range(0, 11-f4i):
                      sli = 10 - f4i - fpi
                      rows.append({'fourforfour':f4i/10,'fantasypros':fpi/10,'sleeper':sli/10})
              return rows

          def p2e_select_candidate(metric_rows):
              # Exact Phase 2B rule: higher macro Spearman, then higher macro top-Q,
              # then lexicographic (fourforfour, fantasypros, sleeper) weights.
              return max(
                  metric_rows,
                  key=lambda r: (
                      r['macro_position_spearman'],
                      r['macro_top_quartile_overlap'],
                      r['weights']['fourforfour'],
                      r['weights']['fantasypros'],
                      r['weights']['sleeper'],
                  ),
              )

          # Synthetic scorer tests freeze directionality/ties before prospective outcomes.
          assert p2e_spearman([1,2,3,4],[1,2,3,4]) > 0.999999
          assert p2e_spearman([1,2,3,4],[4,3,2,1]) < -0.999999
          _test_pct = p2e_midrank_percentiles({'a':1,'b':2,'c':2,'d':4}, ['a','b','c','d'])
          assert abs(_test_pct['a'] - 0.0) < 1e-12
          assert abs(_test_pct['b'] - 0.5) < 1e-12 and abs(_test_pct['c'] - 0.5) < 1e-12
          assert abs(_test_pct['d'] - 1.0) < 1e-12
          assert len(p2e_candidate_grid()) == 55
          _test_sel = p2e_select_candidate([
              {'macro_position_spearman':0.5,'macro_top_quartile_overlap':0.6,'weights':{'fourforfour':0.1,'fantasypros':0.4,'sleeper':0.5}},
              {'macro_position_spearman':0.5,'macro_top_quartile_overlap':0.6,'weights':{'fourforfour':0.2,'fantasypros':0.1,'sleeper':0.7}},
          ])
          assert _test_sel['weights']['fourforfour'] == 0.2

          primary_sids = sorted(overlap_all3)
          if len(primary_sids) != 453:
              raise RuntimeError(f'Phase 2E primary cohort drift: {len(primary_sids)}')
          by_bucket_sids = {b: [sid for sid in primary_sids if fourforfour_by_sid[sid]['source_bucket'] == b] for b in PRIMARY_BUCKETS}
          expected_bucket_counts = {'DL':172,'LB':109,'DB':172}
          if {b:len(v) for b,v in by_bucket_sids.items()} != expected_bucket_counts:
              raise RuntimeError('Phase 2E primary position cohort drift')

          incumbent_no_signal_by_position = {}
          for bucket, sids in by_bucket_sids.items():
              no_signal = 0
              for sid in sids:
                  fp = p2e_source_stats(sid, 'fantasypros')
                  sl = p2e_source_stats(sid, 'sleeper')
                  if (
                      not idp_v1_projection.has_meaningful_fp_signal(fp)
                      and not idp_v1_projection.has_meaningful_sleeper_signal(sl)
                  ):
                      no_signal += 1
              incumbent_no_signal_by_position[bucket] = no_signal
          incumbent_no_signal_rows = sum(incumbent_no_signal_by_position.values())

          provider_points = {src:{} for src in ('4for4','fantasypros','sleeper')}
          incumbent_points = {}
          for sid in primary_sids:
              for src in provider_points:
                  provider_points[src][sid] = p2e_provider_points(sid, src)
              incumbent_points[sid] = p2e_incumbent_common_core(sid)

          provider_pct = {src:{} for src in provider_points}
          incumbent_pct = {}
          for bucket, sids in by_bucket_sids.items():
              for src in provider_points:
                  provider_pct[src].update(p2e_midrank_percentiles(provider_points[src], sids))
              incumbent_pct.update(p2e_midrank_percentiles(incumbent_points, sids))

          candidates = p2e_candidate_grid()
          candidate_signals = []
          for weights in candidates:
              vals = {}
              for sid in primary_sids:
                  vals[sid] = (
                      weights['fourforfour'] * provider_pct['4for4'][sid]
                      + weights['fantasypros'] * provider_pct['fantasypros'][sid]
                      + weights['sleeper'] * provider_pct['sleeper'][sid]
                  )
              candidate_signals.append((weights, vals))

          def p2e_hash_signal(vals):
              payload = [[sid, round(vals[sid],12)] for sid in sorted(vals)]
              return hashlib.sha256(json.dumps(payload,separators=(',',':')).encode()).hexdigest()

          # Freeze scorer-only aggregate diagnostics; never print private row data.
          phase2e_result = {
              'schema_version': 1,
              'study': 'fourforfour-idp-v1-phase2e-prospective-scorer-freeze',
              'status': 'PASS_PROSPECTIVE_SCORER_FROZEN_NO_CALIBRATION_OUTCOMES_READ',
              'research_only': True,
              'production_changes': False,
              'phase2b_methodology_fingerprint_sha256': EXPECTED_PHASE2B_METHOD_FP,
              'phase2c_audit_contract_fingerprint_sha256': EXPECTED_PHASE2C_CONTRACT_FP,
              'phase2d_semantics_contract_fingerprint_sha256': EXPECTED_PHASE2D_SEMANTICS_FP,
              'phase2e_scorer_contract_fingerprint_sha256': phase2e_fp,
              'primary_cohort_rows': len(primary_sids),
              'primary_by_position': expected_bucket_counts,
              'incumbent_no_signal_rows': incumbent_no_signal_rows,
              'incumbent_no_signal_by_position': incumbent_no_signal_by_position,
              'incumbent_no_signal_treatment': 'zero_common_core_prediction_points_preserve_frozen_cohort',
              'outcome_identity_resolved_rows': len(cohort_gsis_by_sid),
              'outcome_identity_unresolved_rows': len(primary_sids) - len(cohort_gsis_by_sid),
              'candidate_count': len(candidates),
              'incumbent_signal_sha256': p2e_hash_signal(incumbent_pct),
              'candidate_signal_set_sha256': hashlib.sha256(
                  json.dumps(
                      [[w, p2e_hash_signal(v)] for w,v in candidate_signals],
                      sort_keys=True, separators=(',',':')
                  ).encode()
              ).hexdigest(),
              'scorer_selftests_passed': True,
              'guardrails': {
                  'week2_plus_outcomes_read': False,
                  'calibration_scoring_performed': False,
                  'candidate_weight_selection_performed': False,
                  'holdout_outcomes_read': False,
                  'row_level_4for4_data_reported': False,
              },
              'next_gate': 'after_Weeks2_to_6_are_complete_run_frozen_calibration_evaluator_and_freeze_one_candidate_before_Week7_outcomes',
          }
          assert_no_forbidden_keys(phase2e_result)
          (ROOT / 'phase2e-scorer-freeze.json').write_text(json.dumps(phase2e_result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('PASS: Phase 2E prospective scorer frozen; no Weeks 2+ outcomes read.')
          print(json.dumps(phase2e_result,indent=2,sort_keys=True))
          PY
          python3 -m py_compile /tmp/fourforfour-phase2e.py
          python3 /tmp/fourforfour-phase2e.py

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove Phase 2E made no repository changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo 'ERROR: Phase 2E modified tracked files.' >&2
            git diff -- .
            exit 1
          fi
