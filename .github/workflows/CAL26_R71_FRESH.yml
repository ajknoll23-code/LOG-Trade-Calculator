name: CAL26 V1R71 - Live FV Age Role Availability Bridge and Owner Review (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r71-live-fv-context-bridge
  cancel-in-progress: false
jobs:
  production-age-role-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout pinned production formula without write permission
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download exact R70 same-source player and existing FV evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R70_SINGLE_SOURCE_YEAR0_SURPLUS_AND_SCALE_HOLD
        run-id: 40099257160
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r71-inputs/R70
    - name: Research-only live pricing formula context and absence guardrails
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_R71_engine.py\" <<'PY_R71_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 R71: production formula context + 2026 value review; no FV prices.\"\"\"\nimport argparse, collections, csv, hashlib, json, pathlib, re, sys, unicodedata\n\nR70_FILES={\n 'CAL26_R70_manifest.json':'536af845f29b644d549ffb86ae631754aabfa9d29c89feb6d2aebfb0daaa596c',\n 'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv':'7ae5ffdd2fa9603df74cb6fe768af7889f8c96f22abb297c50013622ed964699',\n 'CAL26_R70_7_position_replacement_and_rank_decision.csv':'00b888e0cfe86af4031509df8b474b6dac2a1e0faa47a1238fc71ccca8a85634',\n}\nINDEX_GIT_BLOB_SHA='5630bb681dd8710f8e45bc5363488f358ce9ebe2'\nPOS=('QB','RB','WR','TE','DL','LB','DB')\nROLES={'Elite','Every-Down','Starter','Rotational','Understudy','Depth','Speculative'}\nREVIEW_PRIORITY={'ABSENCE_OR_INSUFFICIENT_SEASON_SIGNAL':0,'CONFLICTING_DYNASTY_AND_YEAR0':1,'ROLE_AGE_CONFLICT':2,'TWO_YEAR_FUTURE_TRANSFER_UNVERIFIED':3,'CONTEXT_REVIEW':4}\n\
        \ndef req(b,m):\n if not b: raise AssertionError(m)\ndef sha(b): return hashlib.sha256(b).hexdigest()\ndef blobsha(b):return hashlib.sha1(f'blob {len(b)}\\0'.encode()+b).hexdigest()\ndef norm(s):\n s=unicodedata.normalize('NFKD',str(s)).lower();return ' '.join(re.findall('[a-z0-9]+',s))\ndef write_csv(p,rows,fields):\n with p.open('w',newline='',encoding='utf8') as f:\n  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore',lineterminator='\\n');w.writeheader();w.writerows(rows)\ndef load_r70(folder,fixture):\n for f,h in R70_FILES.items():\n  b=(folder/f).read_bytes()\n  if h and not fixture:req(sha(b)==h,'INPUT_PIN_DRIFT_'+f)\n m=json.loads((folder/'CAL26_R70_manifest.json').read_text())\n req(m['status']=='YEAR0_SURPLUS_SAME_SOURCE__DYNASTY_FV_HOLD','R70_WRONG_STATUS')\n req(m['n_2026_candidates']==518 and m['n_2026_observed']==495,'R70_POOL_DRIFT')\n req(not m['production_change_authorized'] and not m['produced_new_FV_price_candidate'],'R70_PRICE_VIOLATION')\n a=list(csv.DictReader((folder/'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv').open()))\n\
        \ req(len(a)==518 and len({(norm(r['name']),r['position']) for r in a})==518,'R70_ROW_DRIFT')\n q=list(csv.DictReader((folder/'CAL26_R70_7_position_replacement_and_rank_decision.csv').open()))\n req(len(q)==7 and {x['position'] for x in q}==set(POS),'POSITION_DRIFT')\n req(all(r['FUNDAMENTAL_VALUE_CANDIDATE']=='' and r['production_change_authorized']=='False' for r in a),'NO_PRICE_POLICY')\n return a,q\n\ndef parse_repo(indexbytes,fixture):\n if not fixture:req(blobsha(indexbytes)==INDEX_GIT_BLOB_SHA,'INDEX_GIT_BLOB_DRIFT')\n s=indexbytes.decode('utf8')\n start=s.index('const PLAYER_DB = {');end=s.index('\\n};',start)\n text=s[start:end]\n pat=r'^\\s*[\\'\\\"]([^\\'\\\"]+)[\\'\\\"]\\s*:\\s*\\{([^{}]*)\\}'\n data={}\n for mat in re.finditer(pat,text,re.M):\n  n=norm(mat[1]);v=mat[2]\n  def txt(key):\n   z=re.search(r'(?<![a-zA-Z_])'+key+r'\\s*:\\s*[\\'\\\"]([^\\'\\\"]+)[\\'\\\"]',v)\n   return z[1] if z else ''\n  def val(key):\n   z=re.search(r'(?<![a-zA-Z_])'+key+r'\\s*:\\s*(-?\\\
        d+(?:\\.\\d+)?)',v)\n   return float(z[1]) if z else None\n  if n in data:raise AssertionError('PLAYER_DB_DUPLICATE_'+n)\n  data[n]={'position':txt('pos'),'age':val('age'),'role':txt('role'),'team':txt('team'),'injury':txt('injury'),'2025_legacy_pts':val('pts2025'),'2026_old_preseason':val('proj2026')}\n req(len(data)>510,'PLAYER_DB_PARSE_FAILURE')\n anchorstart=s.index('const CAL26_FV_OWNER_ANCHORS = {');anchorend=s.index('\\n};',anchorstart)\n anchors={norm(n):int(v) for n,v in re.findall(r\"'([^']+)'\\s*:\\s*(\\d+)\",s[anchorstart:anchorend])}\n req(len(anchors)>=10,'ANCHORS_PARSE_FAILURE')\n req('function playerValue(pos, age, role, name)' in s and 'return Math.round(100 * pw * am * rm * 55);' in s,'LIVE_FV_FORMULA_CHANGED')\n req('const pw = POSITION_WEIGHT[pos] ?? 1.0;' in s and 'const rm = productionMultiplier(name || \\'\\', role);' in s and 'effectiveAgeMultiplier(pos, age, role, name, rm, rawRm)' in s,'LIVE_FV_FORMULA_INPUT_CHANGED')\n return data,anchors\n\ndef make(r70,repo,out,fixture):\n\
        \ inputs,positions=load_r70(r70,fixture)\n data,anchors=parse_repo((repo/'index.html').read_bytes(),fixture)\n output=[];unknown=[]\n for x in inputs:\n  name=x['name'];pos=x['position'];p=data.get(norm(name))\n  if p is None or p['position']!=pos:\n   unknown.append(name);p=None\n  role=p['role'] if p else ''\n  age=p['age'] if p else None\n  fv=int(x['frozen_FV_UNCHANGED']);req(0<=fv<=20000,'BAD_FROZEN_FV')\n  projected=float(x['2026_fullseason_single_source_research_points']) if x['2026_fullseason_single_source_research_points'] else None\n  ytd=float(x['2026_week1_6_2026rule_scored_points']) if x['2026_week1_6_2026rule_scored_points'] else None\n  surplus=float(x['research_year0_surplus_above_2026_position_reference']) if x['research_year0_surplus_above_2026_position_reference'] else None\n  gap=int(x['FV_rank_minus_2026_ROS_rank']) if x['FV_rank_minus_2026_ROS_rank'] else None\n  has_future=bool(x['R61_H1_2027_surplus_model_RESEARCH_ONLY'] and x['R61_H2_2028_surplus_model_RESEARCH_ONLY'])\n\
        \  pinned_anchor=norm(name) in anchors\n  # An absence in the first six calendar weeks alone is NOT a dynasty decline signal.\n  no_observation=ytd is None or ytd<=0.001\n  low_observation=(ytd is not None and ytd<12 and fv>=3000)\n  old2025=p['2025_legacy_pts'] if p else None\n  high_prior=old2025 is not None and old2025>=180\n  if no_observation or (low_observation and high_prior):\n   reason='ABSENCE_OR_INSUFFICIENT_SEASON_SIGNAL'\n  elif gap is not None and abs(gap)>=20:\n   reason='CONFLICTING_DYNASTY_AND_YEAR0'\n  elif p and role in ('Elite','Every-Down') and surplus is not None and surplus<0:\n   reason='ROLE_AGE_CONFLICT'\n  elif not has_future:\n   reason='TWO_YEAR_FUTURE_TRANSFER_UNVERIFIED'\n  else:reason='CONTEXT_REVIEW'\n  # Auditable gates -- no one-year performance automatism or unvalidated future transport.\n  gates={'observed_week6':ytd is not None,'role_and_age_known':p is not None and age is not None and role in ROLES,\n         'age_role_availability_model_historically_validated':False,'future_season_transport_validated':False,\n\
        \         'production_to_FV_existing_formula_source_mapping_validated':False}\n  next_step=('VALIDATE_INJURY_AND_SNAP_OPPORTUNITY' if reason=='ABSENCE_OR_INSUFFICIENT_SEASON_SIGNAL'\n             else 'EXAMINE_DYNASTY_HORIZON_AND_ROLE' if reason in ('CONFLICTING_DYNASTY_AND_YEAR0','ROLE_AGE_CONFLICT')\n             else 'VALIDATE_FUTURE_PRODUCTION_AND_FORMULA_MAPPER')\n  output.append({'name':name,'position':pos,'sleeper_id':x['sleeper_id'],\n    'frozen_FV_REFERENCE_UNCHANGED':fv,'repo_age':age if age is not None else '',\n    'repo_role':role,'repo_team':p['team'] if p else '',\n    'repo_injury_tag_UNVERIFIED_CURRENT':p['injury'] if p else '',\n    'repo_2025_points_VINTAGE_AND_SCORING_INCOMPATIBLE':old2025 if old2025 is not None else '',\n    'repo_2026_preseason_projection_VINTAGE_AND_SCORING_INCOMPATIBLE':p['2026_old_preseason'] if p and p['2026_old_preseason'] is not None else '',\n    'R70_2026_observed_SixWeek_POINTS':ytd if ytd is not None else '',\n    'R70_2026_full_year_research_POINTS':projected\
        \ if projected is not None else '',\n    'R70_2026_year0_surplus_NOT_DYNASTY':surplus if surplus is not None else '',\n    'R70_FV_minus_year0_rank_gap':gap if gap is not None else '',\n    'R61_has_H1_H2_UNVALIDATED':has_future,'R61_H1_H2_transport_validated':False,\n    'production_live_owner_anchor_if_canonical':pinned_anchor,\n    'production_live_owner_anchor_VALUE_CONTEXT_ONLY':anchors.get(norm(name),'') if pinned_anchor else '',\n    'classification':reason,'next_required_evidence':next_step,\n    'current_week_absence_sufficient_to_cut_FV':False,\n    'proposed_FV_change':'','price_change_authorized':False,\n    'live_price_formula_directly_recomputed':False,\n    'owner_review_priority':REVIEW_PRIORITY[reason]})\n req(len(output)==518,'OUTPUT_518_REQUIRED')\n # Avoid inventing source metadata, but permit missing names for manual identity repair.\n req(len(output)-len(unknown)>=450,'INSUFFICIENT_DEPLOYED_PLAYER_CONTEXT_COVERAGE')\n counts=collections.Counter(x['classification']\
        \ for x in output)\n order=sorted(output,key=lambda r:(int(r['owner_review_priority']),-abs(int(r['R70_FV_minus_year0_rank_gap'])) if r['R70_FV_minus_year0_rank_gap']!='' else 0,-int(r['frozen_FV_REFERENCE_UNCHANGED']),r['name']))\n # Spread owner cards across all seven positions, not just the largest gap (no value changes).\n chosen=[];seen=set()\n for pos in POS:\n  candidates=[r for r in order if r['position']==pos]\n  for z in candidates[:4]:\n   chosen.append(z);seen.add((z['name'],z['position']))\n for z in order:\n  if len(chosen)>=40:break\n  if (z['name'],z['position']) not in seen:chosen.append(z);seen.add((z['name'],z['position']))\n req(len(chosen)==40 and {x['position'] for x in chosen}==set(POS),'REVIEW_COVERAGE')\n posrows=[]\n for pos in POS:\n  rows=[r for r in output if r['position']==pos]\n  posrows.append({'position':pos,'n':len(rows),'production_age_role_matched':sum(r['repo_age']!='' for r in rows),\n   'production_owner_anchor_overlap':sum(r['production_live_owner_anchor_if_canonical']\
        \ for r in rows),\n   'no_or_zero_ytd':sum(r['R70_2026_observed_SixWeek_POINTS']=='' or float(r['R70_2026_observed_SixWeek_POINTS'])==0 for r in rows),\n   'abs_rank_gap_gte20':sum(r['R70_FV_minus_year0_rank_gap']!='' and abs(int(r['R70_FV_minus_year0_rank_gap']))>=20 for r in rows),\n   'any_FV_delta_authorized':False})\n out.mkdir(parents=True,exist_ok=True)\n names={'CAL26_R71_518_live_age_role_availability_context_NO_FV.csv':output,\n 'CAL26_R71_40_owner_review_NEXT_EVIDENCE_NO_FV.csv':chosen,\n 'CAL26_R71_7_position_release_gate.csv':posrows}\n for fname,rows in names.items():write_csv(out/fname,rows,list(rows[0]))\n notes=['# CAL26 R71 \u2014 production age, role, availability and year-0 source bridge','',\n '**Decision: FROZEN_FV_PRESERVED__NO_EMPIRICAL_FUTURE_TRANSPORT_OR_PRICE_MAPPING.**','',\n 'R70 year-0 forecasts are not dynasty valuations. This review joins the exact deployed PLAYER_DB age, role, team and injury tag to research forecast rows, but no live player age/role\
        \ or new FV was calculated or changed.','',\n f'Production index Git blob: `{blobsha((repo/\"index.html\").read_bytes())}`.',\n f'Full pool: {len(output)}; matched 2026 observations: {sum(r[\"R70_2026_observed_SixWeek_POINTS\"]!=\"\" for r in output)}; PLAYER_DB matched: {len(output)-len(unknown)}.',\n f'Canonical in-code owner exact price anchor keys: {len(anchors)}, overlaps: {sum(r[\"production_live_owner_anchor_if_canonical\"] for r in output)}.',\n 'These exact-match owner anchors execute in deployed playerValue when canonical player age and role match. Do not confuse anchored player quotations with general formula output.',\n '', '## Release-critical constraints','',\n '- No arbitrary points\u2192FV multiplier or within-position percentile price remap used.',\n '- The active deployed formula is `round(100*positionWeight*effectiveAgeMultiplier*productionMultiplier*55)` with conditional owner overrides. A new source-to-productionMultiplier mapper has **not** been validated.',\n\
        \ '- Index historical `pts2025` and `proj2026` are legacy source/context only; never added to R70 LOG-scored points.',\n '- Week1-6 zero points, a missing observation, or a current injury tag is **not** evidence of zero dynasty value. Verify snap/opportunity and availability before considering changes.',\n '- R61 H1 and H2 historical proxies remain non-transport-validated; role and age alone cannot justify applying them numerically.',\n '- Market votes and owner desired prices are not training labels in this study.',\n '- No unobserved 2026 weeks 7+ read; no direct live FV candidate produced; index.html is read-only.',\n '', '## Classification counts','']\n for k in sorted(counts):notes.append(f'- {k}: {counts[k]}')\n notes+=['','## Priority sample (not proposals)','', '| Name | Pos | FV unchanged | Age | Role | Six-week pts | Year-0 FV rank gap | Review |', '|---|---|---:|---:|---|---:|---:|---|']\n for z in chosen[:20]:notes.append('| '+ ' | '.join(str(z[k]) for k in ('name','position','frozen_FV_REFERENCE_UNCHANGED','repo_age','repo_role','R70_2026_observed_SixWeek_POINTS','R70_FV_minus_year0_rank_gap','classification'))+'\
        \ |')\n notes+=['','**Next measurable gate:** backtest a scoring-compatible, age/availability-aware player-specific future production update, then map it through the deployed productionMultiplier mechanism in a read-only side-by-side replay; reject any change that cannot be compared to the current production formula without new arbitrary conversion.', '']\n (out/'CAL26_R71_decision.md').write_text('\\n'.join(notes),encoding='utf8')\n files=[*names,'CAL26_R71_decision.md']\n manifest={'status':'LIVE_FORMULA_CONTEXT_JOIN__FUTURE_PRODUCTION_TRANSFER_FV_HOLD',\n 'R70_run_id':40099257160,'source_blob_sha1':blobsha((repo/'index.html').read_bytes()),\n 'player_count':len(output),'matched_production_player_context':len(output)-len(unknown),\n 'owner_cards':len(chosen),'positions':7,'owner_anchors_in_code':len(anchors),\n 'owner_anchor_players_in_R70':sum(x['production_live_owner_anchor_if_canonical'] for x in output),\n 'gates':{'age_role_availability_future_surplus_validated':False,'prediction_to_live_production_multiplier_validated':False,'candidate_prices_generated':False},\n\
        \ 'no_future_2026_stats_read':True,'no_live_writes':True,'production_change_authorized':False,\n 'output_sha256':{n:sha((out/n).read_bytes()) for n in files}}\n (out/'CAL26_R71_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')\n print(json.dumps({k:v for k,v in manifest.items() if k not in ('output_sha256',)},indent=2))\n return manifest\n\ndef test():\n req(norm('Amon-Ra St. Brown')==norm('amonra st brown') or norm('Amon-Ra St. Brown')=='amon ra st brown','NORM_CHECK')\n example='const PLAYER_DB = {\\n'+''.join(\" 'player %s':{pos:'%s',age:25,role:'Elite',team:'ABC',pts2025:200.0},\\n\"%(n,p) for n,p in enumerate(POS*80))+ '\\n};\\nconst CAL26_FV_OWNER_ANCHORS = {\\n'+''.join(\" 'player %d':1000,\\n\"%i for i in range(15))+'\\n};\\nfunction playerValue(pos, age, role, name) { const pw = POSITION_WEIGHT[pos] ?? 1.0; const rm = productionMultiplier(name || \\'\\', role); const am = effectiveAgeMultiplier(pos, age, role, name, rm, rawRm); return Math.round(100\
        \ * pw * am * rm * 55); }'\n db,a=parse_repo(example.encode(),True)\n req(len(db)==560 and len(a)==15,'PARSER_FIXTURE');req(db['player 0']['role']=='Elite','PARSER_VALUE')\n print('R71_SELFTEST_GREEN live formula parser, age/role source, owner anchored names')\nif __name__=='__main__':\n ap=argparse.ArgumentParser();ap.add_argument('--r70');ap.add_argument('--repo');ap.add_argument('--out');ap.add_argument('--fixture',action='store_true');ap.add_argument('--selftest',action='store_true');a=ap.parse_args()\n if a.selftest:test()\n else:make(pathlib.Path(a.r70),pathlib.Path(a.repo),pathlib.Path(a.out),a.fixture)\n\nPY_R71_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_R71_engine.py\"\npython \"$RUNNER_TEMP/CAL26_R71_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_R71_engine.py\" --r70 \"$RUNNER_TEMP/cal26-r71-inputs/R70\" --repo \"$GITHUB_WORKSPACE\" --out \"$RUNNER_TEMP/cal26-r71-results\"\npython - \"$RUNNER_TEMP/cal26-r71-results\" <<'PY_R71_VERIFY'\nimport csv,hashlib,json,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/\"CAL26_R71_manifest.json\").read_text())\nassert m[\"status\"]==\"LIVE_FORMULA_CONTEXT_JOIN__FUTURE_PRODUCTION_TRANSFER_FV_HOLD\"\nassert m[\"player_count\"]==518 and m[\"owner_cards\"]==40 and m[\"positions\"]==7\nassert m[\"matched_production_player_context\"]>=450 and m[\"owner_anchors_in_code\"]>=10\nassert not m[\"production_change_authorized\"] and m[\"no_future_2026_stats_read\"] and m[\"no_live_writes\"]\nassert not any(m[\"gates\"].values())\nfor name,d in m[\"output_sha256\"].items():\n assert hashlib.sha256((p/name).read_bytes()).hexdigest()==d,(name,\"SHA_MISMATCH\")\nr=list(csv.DictReader((p/\"CAL26_R71_518_live_age_role_availability_context_NO_FV.csv\").open()))\nassert len(r)==518 and all(x[\"price_change_authorized\"]==\"False\" and x[\"proposed_FV_change\"]==\"\" for x in r)\nprint(\"CAL26_R71_LIVE_FORMULA_RESEARCH_ONLY_NO_PRICE_CHANGE_GREEN\")\nPY_R71_VERIFY\ntest -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r71-results/CAL26_R71_decision.md\"\
        \ >> \"$GITHUB_STEP_SUMMARY\""
    - name: Upload 518 production-context cards and owner review, no writes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_R71_LIVE_FORMULA_518_PLAYER_CONTEXT_AND_OWNER_REVIEW_FV_HOLD
        path: ${{ runner.temp }}/cal26-r71-results/
        retention-days: 60
        if-no-files-found: warn
