name: Activate Package Voting V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: pip install requests numpy

      - name: Materialize Package Preference V2 research files
        shell: bash
        run: |
          mkdir -p research/package-adjustment-v2
          mkdir -p scripts/market
          mkdir -p scripts/validation

          echo '' | base64 --decode > research/package-adjustment-v2/generate_package_vote_challenges_v2.py
          echo '' | base64 --decode > scripts/market/package_vote_v2_pipeline.py
          echo '' | base64 --decode > scripts/market/package_vote_v2_fit_diagnostics.py
          echo '' | base64 --decode > .github/workflows/package-vote-aggregation.yml
          echo '' | base64 --decode > scripts/validation/activate_v2_patch.py

          chmod +x research/package-adjustment-v2/generate_package_vote_challenges_v2.py
          chmod +x scripts/market/package_vote_v2_pipeline.py
          chmod +x scripts/market/package_vote_v2_fit_diagnostics.py

      - name: Generate frozen V2 matched challenge catalog
        shell: bash
        run: |
          python3 research/package-adjustment-v2/generate_package_vote_challenges_v2.py --selftest
          python3 research/package-adjustment-v2/generate_package_vote_challenges_v2.py

      - name: Activate V2 browser collection and KTC isolation
        shell: bash
        run: python3 scripts/validation/activate_v2_patch.py

      - name: Validate V2 research code
        shell: bash
        run: |
          python3 -m py_compile             research/package-adjustment-v2/generate_package_vote_challenges_v2.py             scripts/market/package_vote_v2_pipeline.py             scripts/market/package_vote_v2_fit_diagnostics.py

          python3 scripts/market/package_vote_v2_pipeline.py --selftest
          python3 scripts/market/package_vote_v2_fit_diagnostics.py --selftest

      - name: Run repository regression checks
        shell: bash
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Remove one-time activation files
        shell: bash
        run: |
          rm -f scripts/validation/activate_v2_patch.py
          rm -f .github/workflows/activate-package-vote-v2.yml

      - name: Commit Package Preference V2
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add scripts/market/ktc_pipeline.py
          git add scripts/market/package_vote_v2_pipeline.py
          git add scripts/market/package_vote_v2_fit_diagnostics.py
          git add research/package-adjustment-v2/generate_package_vote_challenges_v2.py
          git add research/package-adjustment-v2/package_vote_challenges_v2.json
          git add .github/workflows/package-vote-aggregation.yml
          git add -A .github/workflows/activate-package-vote-v2.yml

          if git diff --cached --quiet; then
            echo "No V2 changes to commit."
            exit 0
          fi

          git commit -m "Add matched Package Preference V2 research"
          git pull --rebase origin main
          git push origin main
