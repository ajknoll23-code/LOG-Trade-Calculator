name: A2 Identity V2 Phase 9 Terrell Jennings Stable-ID Corroboration

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase9:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact A1 Phase 8 authorization
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          p=D/"identity_v2_phase8_refreshed_external_corroboration.json"
          m=D/"identity_v2_phase8_manifest.json"

          r=json.loads(p.read_text())
          manifest=json.loads(m.read_text())

          assert r["decision"]==(
              "PASS_IDENTITY_V2_PHASE8_FREEZE_AUTHORIZE_PHASE9_"
              "SECOND_SOURCE_ID_CORROBORATION_TERRELL_JENNINGS_ONLY"
          )
          assert r["phase9_second_source_identity_candidate_fpids"]==["26964"]
          assert r["persistent_taxonomy_holds"]==["26157"]
          assert r["classification_counts"]=={
              "EXTERNAL_CURRENT_TEAM_KNOWN_PROVIDER_TEAM_MISSING":1,
              "EXTERNAL_POSITION_TAXONOMY_REMAINS_AMBIGUOUS":1,
              "EXTERNAL_SOURCE_DRIFT_SUPPORTS_HOLD":13
          }
          assert all(r["hard_gates"].values())
          assert r["production_change_authorized"] is False
          assert r["production_crosswalk_mutated"] is False

          assert hashlib.sha256(p.read_bytes()).hexdigest()==(
              manifest["files"][
                  "identity_v2_phase8_refreshed_external_corroboration.json"
              ]
          )
          assert manifest["production_change_authorized"] is False
          assert manifest["production_changed"] is False

          rows=json.loads(Path("scripts/identity_crosswalk.json").read_text())
          by={str(x["fantasypros_id"]):x for x in rows}
          tj=by["26964"]
          assert tj["name"]=="Terrell Jennings"
          assert tj["fp_position"]=="RB"
          assert tj["requires_manual_review"] is True
          assert tj["sleeper_id"] is None
          assert str(tj["candidate_sleeper_id"])=="12412"
          assert tj["match_method"]=="unique_name_position_team_unavailable"

          print("PASS: exact Phase 8 authorization and current held Terrell Jennings row guarded.")
          PY

          python3 scripts/projections/resolve_fantasypros_sleeper_identity.py --selftest
          python3 scripts/validation/repo_regression_checks.py

      - name: Freeze A2 preregistration before reading second source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path

          D=Path("research/identity-v2")
          paths=[
              D/"identity_v2_phase9_preregistration.json",
              D/"identity_v2_phase9_second_source_snapshot.json",
              D/"identity_v2_phase9_stable_id_corroboration.json",
              D/"identity_v2_phase9_stable_id_corroboration.md",
              D/"identity_v2_phase9_manifest.json"
          ]
          for p in paths:
              assert not p.exists(),f"refusing to overwrite {p}"

          prereg={
              "schema_version":1,
              "study_id":"identity-v2-phase9-terrell-jennings-stable-id-corroboration",
              "status":"FROZEN_BEFORE_SECOND_SOURCE_READ",
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "production_crosswalk_mutation_allowed":False,
              "target":{
                  "name":"Terrell Jennings",
                  "fantasypros_id":"26964",
                  "candidate_sleeper_id":"12412",
                  "position":"RB"
              },
              "second_source":{
                  "provider":"DynastyProcess fantasy player ID database, exposed through nflverse ffverse player IDs",
                  "url":"https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv",
                  "required_columns":[
                      "fantasypros_id","sleeper_id","gsis_id","pfr_id",
                      "espn_id","name","position","db_season"
                  ]
              },
              "hard_pass_rule":[
                  "Exactly one second-source row has fantasypros_id 26964.",
                  "Exactly one second-source row has sleeper_id 12412.",
                  "Those lookups resolve to the exact same row.",
                  "The common row name normalizes exactly to terrell jennings.",
                  "The common row position is RB.",
                  "The common row has a non-missing GSIS stable identifier.",
                  "The common row has a non-missing PFR stable identifier.",
                  "No other current manual-review identity is read or promoted."
              ],
              "fail_closed_rule":"Any missing, duplicate, contradictory, or differently linked target row stops Phase 9.",
              "decision_if_pass":"FREEZE_TERRELL_JENNINGS_FPID26964_SID12412_AS_EVIDENCE_BACKED_IDENTITY_CANDIDATE_AUTHORIZE_PHASE10_SHADOW",
              "decision_if_fail":"STOP_TERRELL_JENNINGS_IDENTITY_CORROBORATION",
              "production_change_authorized":False
          }
          (D/"identity_v2_phase9_preregistration.json").write_text(
              json.dumps(prereg,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A2 preregistration frozen before second-source read.")
          PY

      - name: Fetch independent player-ID bridge and freeze exact evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,io,json,requests
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          prereg=json.loads((D/"identity_v2_phase9_preregistration.json").read_text())
          url=prereg["second_source"]["url"]

          resp=requests.get(
              url,
              timeout=30,
              headers={"User-Agent":"LOG-Trade-Calculator-Identity-V2-Phase9"}
          )
          resp.raise_for_status()
          raw=resp.content
          text=raw.decode("utf-8")
          rows=list(csv.DictReader(io.StringIO(text)))

          required=set(prereg["second_source"]["required_columns"])
          assert rows, "second-source CSV is empty"
          assert required<=set(rows[0]),(
              "second-source schema missing columns",
              sorted(required-set(rows[0]))
          )

          def clean(v):
              v=(v or "").strip()
              return None if v in ("","NA","N/A","null","None") else v

          fp_rows=[r for r in rows if clean(r.get("fantasypros_id"))=="26964"]
          sid_rows=[r for r in rows if clean(r.get("sleeper_id"))=="12412"]

          assert len(fp_rows)==1,("fantasypros_id cardinality",len(fp_rows))
          assert len(sid_rows)==1,("sleeper_id cardinality",len(sid_rows))
          assert fp_rows[0]==sid_rows[0],"FPID and SID resolve to different second-source rows"

          r=fp_rows[0]
          frozen={
              "schema_version":1,
              "study_id":"identity-v2-phase9-terrell-jennings-stable-id-corroboration",
              "status":"FROZEN_SECOND_SOURCE_SNAPSHOT",
              "captured_at_utc":datetime.now(timezone.utc).isoformat(),
              "source_url":url,
              "source_sha256":hashlib.sha256(raw).hexdigest(),
              "source_row_count":len(rows),
              "target_lookup_cardinality":{
                  "fantasypros_id_26964":len(fp_rows),
                  "sleeper_id_12412":len(sid_rows)
              },
              "target_row":{
                  "fantasypros_id":clean(r.get("fantasypros_id")),
                  "sleeper_id":clean(r.get("sleeper_id")),
                  "gsis_id":clean(r.get("gsis_id")),
                  "pfr_id":clean(r.get("pfr_id")),
                  "espn_id":clean(r.get("espn_id")),
                  "sportradar_id":clean(r.get("sportradar_id")),
                  "mfl_id":clean(r.get("mfl_id")),
                  "name":clean(r.get("name")),
                  "merge_name":clean(r.get("merge_name")),
                  "position":clean(r.get("position")),
                  "team":clean(r.get("team")),
                  "birthdate":clean(r.get("birthdate")),
                  "college":clean(r.get("college")),
                  "db_season":clean(r.get("db_season"))
              },
              "production_change_authorized":False
          }

          (D/"identity_v2_phase9_second_source_snapshot.json").write_text(
              json.dumps(frozen,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: exact independent second-source target row frozen.")
          print(json.dumps(frozen["target_row"],indent=2,sort_keys=True))
          PY

      - name: Evaluate stable-ID corroboration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path

          D=Path("research/identity-v2")
          prereg=json.loads((D/"identity_v2_phase9_preregistration.json").read_text())
          snap=json.loads((D/"identity_v2_phase9_second_source_snapshot.json").read_text())
          cross=json.loads(Path("scripts/identity_crosswalk.json").read_text())

          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",str(s or "").lower()).strip()

          row=snap["target_row"]
          target=prereg["target"]
          current=next(
              x for x in cross
              if str(x["fantasypros_id"])==target["fantasypros_id"]
          )

          gates={
              "exact_one_row_by_fantasypros_id":
                  snap["target_lookup_cardinality"]["fantasypros_id_26964"]==1,
              "exact_one_row_by_sleeper_id":
                  snap["target_lookup_cardinality"]["sleeper_id_12412"]==1,
              "direct_pair_matches_preregistered_target":
                  row["fantasypros_id"]=="26964"
                  and row["sleeper_id"]=="12412",
              "name_exact_after_normalization":
                  norm(row["name"])=="terrell jennings",
              "position_exact_rb":
                  row["position"]=="RB",
              "gsis_stable_id_present":
                  bool(row["gsis_id"]) and row["gsis_id"].startswith("00-"),
              "pfr_stable_id_present":
                  bool(row["pfr_id"]),
              "current_crosswalk_target_still_held":
                  current["requires_manual_review"] is True
                  and current["sleeper_id"] is None
                  and str(current["candidate_sleeper_id"])=="12412",
              "no_production_mutation":True
          }

          passed=all(gates.values())
          decision=(
              prereg["decision_if_pass"]
              if passed else prereg["decision_if_fail"]
          )

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase9-terrell-jennings-stable-id-corroboration",
              "status":"COMPLETE",
              "decision":decision,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "research_only":True,
              "production_change_authorized":False,
              "production_crosswalk_mutated":False,
              "target":{
                  "fantasypros_id":"26964",
                  "sleeper_id":"12412",
                  "name":"Terrell Jennings",
                  "position":"RB"
              },
              "independent_second_source":{
                  "provider":"DynastyProcess/nflverse ffverse player-ID bridge",
                  "source_sha256":snap["source_sha256"],
                  "source_row_count":snap["source_row_count"],
                  "row":row
              },
              "hard_gates":gates,
              "interpretation":(
                  "The independent cross-platform ID database directly binds FantasyPros ID 26964 and Sleeper ID 12412 on one unique Terrell Jennings RB row with additional GSIS and PFR stable identifiers. This supports an evidence-backed production-candidate shadow, not direct deployment."
                  if passed else
                  "The independent ID bridge did not satisfy the preregistered exact stable-ID corroboration contract. The identity remains held."
              ),
              "phase10_authorized":bool(passed),
              "phase10_scope":"Terrell Jennings FPID 26964 -> Sleeper SID 12412 only",
              "production_change_authorized":False
          }
          (D/"identity_v2_phase9_stable_id_corroboration.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Identity V2 Phase 9 — Terrell Jennings Stable-ID Corroboration",
              "",
              f"**Decision:** `{decision}`",
              "",
              f"- FantasyPros ID: **{row['fantasypros_id']}**",
              f"- Sleeper ID: **{row['sleeper_id']}**",
              f"- GSIS ID: **{row['gsis_id']}**",
              f"- PFR ID: **{row['pfr_id']}**",
              f"- ESPN ID: **{row['espn_id']}**",
              f"- Name: **{row['name']}**",
              f"- Position: **{row['position']}**",
              "",
              result["interpretation"],
              "",
              "No production mapping is changed by Phase 9.",
              ""
          ]
          (D/"identity_v2_phase9_stable_id_corroboration.md").write_text(
              "\n".join(lines)+"\n"
          )

          if not passed:
              raise SystemExit(
                  "SCIENTIFIC STOP: second-source corroboration failed frozen gates"
              )
          print("\n".join(lines))
          PY

      - name: Validate A2 result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          D=Path("research/identity-v2")
          r=json.loads((D/"identity_v2_phase9_stable_id_corroboration.json").read_text())

          assert r["decision"]==(
              "FREEZE_TERRELL_JENNINGS_FPID26964_SID12412_AS_"
              "EVIDENCE_BACKED_IDENTITY_CANDIDATE_AUTHORIZE_PHASE10_SHADOW"
          )
          assert r["target"]=={
              "fantasypros_id":"26964",
              "sleeper_id":"12412",
              "name":"Terrell Jennings",
              "position":"RB"
          }
          assert all(r["hard_gates"].values())
          assert r["phase10_authorized"] is True
          assert r["production_change_authorized"] is False
          assert r["production_crosswalk_mutated"] is False
          print("PASS: A2 stable-ID corroboration contract validated.")
          PY

      - name: Freeze A2 manifest
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          D=Path("research/identity-v2")
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          r=json.loads((D/"identity_v2_phase9_stable_id_corroboration.json").read_text())
          files=[
              "identity_v2_phase9_preregistration.json",
              "identity_v2_phase9_second_source_snapshot.json",
              "identity_v2_phase9_stable_id_corroboration.json",
              "identity_v2_phase9_stable_id_corroboration.md"
          ]
          m={
              "schema_version":1,
              "study_id":"identity-v2-phase9-terrell-jennings-stable-id-corroboration",
              "decision":r["decision"],
              "workflow_run_id":os.environ["RUN_ID"],
              "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
              "files":{f:sha(D/f) for f in files},
              "phase10_authorized":r["phase10_authorized"],
              "production_change_authorized":False,
              "production_changed":False
          }
          (D/"identity_v2_phase9_manifest.json").write_text(
              json.dumps(m,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: A2 manifest frozen.")
          PY

      - name: Prove research-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed={
              "research/identity-v2/identity_v2_phase9_preregistration.json",
              "research/identity-v2/identity_v2_phase9_second_source_snapshot.json",
              "research/identity-v2/identity_v2_phase9_stable_id_corroboration.json",
              "research/identity-v2/identity_v2_phase9_stable_id_corroboration.md",
              "research/identity-v2/identity_v2_phase9_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          assert touched==allowed,(sorted(touched),sorted(allowed))
          assert "scripts/identity_crosswalk.json" not in touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: A2 is research-only.")
          PY

      - name: Postflight regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit A2 research artifacts
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A2."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/identity-v2/identity_v2_phase9_preregistration.json \
            research/identity-v2/identity_v2_phase9_second_source_snapshot.json \
            research/identity-v2/identity_v2_phase9_stable_id_corroboration.json \
            research/identity-v2/identity_v2_phase9_stable_id_corroboration.md \
            research/identity-v2/identity_v2_phase9_manifest.json

          git diff --cached --quiet && {
            echo "ERROR: no A2 artifacts staged."
            exit 1
          }

          git commit -m "Freeze Identity V2 Phase 9 Terrell Jennings stable-ID corroboration"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A2 committed; production unchanged."
