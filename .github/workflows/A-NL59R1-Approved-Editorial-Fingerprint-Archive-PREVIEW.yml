      - name: Confirm original/revised issue hashes, run adversarial regression tests and build audit report
        shell: bash
        run: |
          set -euo pipefail
          cd nl59_work
          python3 nl59_gate_preview.py --ledger LOG-NL59R1-Originality-Fingerprint-Ledger.json --out ../nl59_output
          test -s ../nl59_output/NL59R1-GATE-PREVIEW.json
          test -s ../nl59_output/NL59R1-FINGERPRINT-LEDGER.json
      - name: Upload HASH-ONLY archive and QA report (no newsletter PDFs)
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL59R1-EDITORIAL-FINGERPRINTS-${{ github.run_id }}
          path: nl59_output/
          retention-days: 90
          if-no-files-found: error
      - name: Show verified two-edition history and explicit missing-history blockers
        if: always()
        shell: bash
        run: |
          if test -s nl59_output/NL59R1-GATE-PREVIEW.md; then
            cat nl59_output/NL59R1-GATE-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NL59 source/QA incomplete. NO publication permitted." >> "$GITHUB_STEP_SUMMARY"
          fi
