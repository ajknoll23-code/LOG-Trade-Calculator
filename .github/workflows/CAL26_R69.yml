name: CAL26 V1R69 - Week6 ROS Chronological Forecast Holdout and 2026 Point Bridge (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r69-week6-ros-timeholdout
  cancel-in-progress: false
jobs:
  week6-ros-forecast-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Checkout repo historical archive (read only)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download exact R61 frozen 518 full-season projection context
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R61_OWNER_REVIEW_518_SCALE_SCENARIOS_NOT_FV
        run-id: 40059837648
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r69-inputs/R61
    - name: Download R64 frozen Week6 identity and observation contract
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R64_2026_WEEK6_SEVEN_POSITION_LOG_OBSERVATIONS_FV_HOLD
        run-id: 40064881274
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r69-inputs/R64
    - name: Download R68 official 2620-point parity scoring corrections
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R68_OFFICIAL_2620_OF_2620_2026_SCORING_FIELDS_FV_HOLD
        run-id: 40068647293
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r69-inputs/R68
    - name: Fit 2024 only, evaluate 2025 outer, score 2026 Week6 ROS research
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R69_engine.py\" <<'PY_CAL26_R69_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"CAL26 V1R69: one-year REST-OF-2026 scoring-compatible forecast feasibility.\n\nResearch-only:\
        \ frozen historical 2024 fit, untouched historical 2025 outer test,\nthen 2026 Week1-6 observations from\
        \ R68. Frozen 2026 full-season projection\nremains separate, unconverted, and NEVER used to train or label\
        \ the forecast.\nHistorical per-week scored archives are not official-player-week parity certified.\n\"\"\
        \"\nimport argparse,csv,hashlib,json,math,pathlib,statistics,sys,collections\n\nPOS=('QB','RB','WR','TE','DL','LB','DB')\n\
        ARTIFACTS={\n 'R61': {'manifest':('CAL26_V1R61_manifest.json','5632c5d440882bfeedd411aa020ef289c3d2be15cfbbc22f26c83cb8db191923'),'rows':('CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv','deb362dbc4718f4ecf4837a34d17a349b29f9fc04d2657cbd1543b9d864e2ae2')},\n\
        \ 'R64': {'manifest':('CAL26_V1R64_manifest.json','58ee081efdbdf6251c57c7acf753bde933e4fb9010c24deab32f4fa2e0c84fec'),'rows':('CAL26_V1R64_518_frozen_week6_2026_LOG_observations_NOT_FV.csv','6de707a031044434b7d0a6078fb60f8b9a2cf98168e45a79f470e070f51fbe3a')},\n\
        \ 'R68': {'manifest':('CAL26_V1R68_manifest.json','2d6da93358b9cb31c1f5761f067a4eff21ab30ece7d8eab6021827b0c68689a6'),'rows':('CAL26_V1R68_518_supported_scoring_adjustments_NOT_FV.csv','d3d6d3842362f6f69a7f17fb8781c0bc71686bd9b4f576a8e30230f89d85c7cd')}\n\
        }\nARCHIVE_REL='research/roster-economics/weekly_points_by_season.json'\nARCHIVE_GIT_BLOB='ad8c2275042fba93cbbae20d6a0b8c27b4bcaf84'\n\
        \ndef req(ok,msg):\n if not ok:raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\n\
        def gsha(b):return hashlib.sha1(('blob '+str(len(b))+'\\0').encode()+b).hexdigest()\ndef load_csv(p):\n\
        \ with p.open(newline='',encoding='utf-8-sig') as f:return list(csv.DictReader(f))\ndef emit_csv(p,rows,cols):\n\
        \ with p.open('w',newline='',encoding='utf-8') as f:\n  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore',lineterminator='\\\
        n');w.writeheader();w.writerows(rows)\ndef num(x,default=None):\n if x in ('',None):return default\n f=float(x);req(math.isfinite(f),'NONFINITE_NUMBER');return\
        \ f\ndef key(row):return (str(row['name']).strip().lower(),str(row['position']).strip())\ndef inputs(root):\n\
        \ ret={};digests={}\n for group,items in ARTIFACTS.items():\n  folder=root/group; ret[group]={};digests[group]={}\n\
        \  for role,(name,digest) in items.items():\n   b=(folder/name).read_bytes();req(sha(b)==digest,f'{group}_{role}_DIGEST_DRIFT')\n\
        \   ret[group][role]=json.loads(b) if role=='manifest' else load_csv(folder/name)\n   digests[group][role]=digest\n\
        \ req(len(ret['R61']['rows'])==len(ret['R64']['rows'])==len(ret['R68']['rows'])==518,'FROZEN_518_MISSING')\n\
        \ for g in ret:\n  rows=ret[g]['rows'];req(len({key(x) for x in rows})==518,f'{g}_DUPLICATES')\n  req(set(map(key,rows))==set(map(key,ret['R61']['rows'])),f'{g}_JOIN_DRIFT')\n\
        \  req(all(x.get('production_change_authorized')=='False' for x in rows),f'{g}_PRODUCTION_MUTATION')\n req(ret['R61']['manifest']['n_full_projected_players']==518\
        \ and ret['R61']['manifest']['n_frozen_player_FV_untouched']==549,'R61_FREEZE_DRIFT')\n req(ret['R64']['manifest']['source_weeks']==[1,2,3,4,5,6]\
        \ and not ret['R64']['manifest']['2026_week7_or_later_fetched'],'R64_PROTECTED_WEEK_DRIFT')\n req(ret['R68']['manifest']['official_comparisons']==2620\
        \ and ret['R68']['manifest']['post_all_field_alias_mismatches']==0 and ret['R68']['manifest']['official_parity_passed']\
        \ is True,'R68_PARITY_NOT_CLOSED')\n return ret,digests\n\ndef load_history(repo,fixture):\n b=(repo/ARCHIVE_REL).read_bytes()\n\
        \ if not fixture:req(gsha(b)==ARCHIVE_GIT_BLOB,'HISTORICAL_ARCHIVE_GIT_BLOB_DRIFT')\n root=json.loads(b)\n\
        \ req(isinstance(root,dict) and isinstance(root.get('seasons'),dict),'BAD_HISTORICAL_ARCHIVE_SCHEMA')\n\
        \ yrs=root['seasons'];req('2024' in yrs and '2025' in yrs,'HISTORICAL_YEARS_MISSING')\n ret={};reject=collections.Counter()\n\
        \ for y in ('2024','2025'):\n  byid=yrs[y];req(isinstance(byid,dict) and len(byid)>50,'SMALL_HISTORICAL_UNIVERSE')\n\
        \  ret[y]=collections.defaultdict(list)\n  for pid,r in byid.items():\n   pos=str(r.get('pos_bucket','')).upper();pos={'DE':'DL','DT':'DL','CB':'DB','S':'DB','OLB':'LB','ILB':'LB','SS':'DB','FS':'DB'}.get(pos,pos)\n\
        \   if pos not in POS:continue\n   weeks=r.get('weekly_points');req(isinstance(weeks,dict),'BAD_HISTORICAL_WEEKLY_POINTS')\n\
        \   arr={}\n   for k,v in weeks.items():\n    w=int(k);req(1<=w<=18,'HISTORICAL_POSTSEASON_LEAK');val=num(v)\n\
        \    req(-150<=val<=150,'IMPOSSIBLE_HISTORICAL_WEEK_POINT');arr[w]=val\n   # prediction must be on the information-available\
        \ Week6 universe only:\n   if not any(k<=6 for k in arr):reject[y]+=1;continue\n   ytd=sum(arr.get(w,0)\
        \ for w in range(1,7));last3=sum(arr.get(w,0) for w in range(4,7));ros=sum(arr.get(w,0) for w in range(7,19))\n\
        \   ret[y][pos].append({'pid':str(pid),'x':ytd/6,'last3':last3/3,'y':ros,'ytd':ytd})\n  for pos in POS:req(len(ret[y][pos])>=20,f'{y}_{pos}_HISTORICAL_COHORT_SMALL')\n\
        \ return ret,{'archive_sha256':sha(b),'archive_git_blob':gsha(b),'historical_entries_2024':sum(len(v) for\
        \ v in ret['2024'].values()),'historical_entries_2025':sum(len(v) for v in ret['2025'].values()),'excluded_late_entrants':dict(reject),'archive_generated_at':str(root.get('generated_at','NOT_STATED'))}\n\
        \ndef train(rows):\n n=len(rows);mx=sum(r['x'] for r in rows)/n;my=sum(r['y'] for r in rows)/n\n sxx=sum((r['x']-mx)**2\
        \ for r in rows);sxy=sum((r['x']-mx)*(r['y']-my) for r in rows)\n variance=sxx/n\n lam=20*variance  # fixed\
        \ 20 virtual sample equivalents; not selected on 2025 outcomes\n slope=max(0.,min(18.,sxy/(sxx+lam))) if\
        \ sxx>1e-12 else 0.\n return {'n':n,'x_mean':mx,'ros_mean':my,'slope':slope,'ridge_equivalent_n':20}\ndef\
        \ predict(model,x):return max(0,model['ros_mean']+model['slope']*(x-model['x_mean']))\ndef mse(actual,pred):return\
        \ sum((a-b)**2 for a,b in zip(actual,pred))/len(actual)\ndef mae(actual,pred):return sum(abs(a-b) for a,b\
        \ in zip(actual,pred))/len(actual)\ndef calibrate(history):\n out=[];models={}\n for pos in POS:\n  fit=history['2024'][pos];test=history['2025'][pos];m=train(fit)\n\
        \  truth=[x['y'] for x in test];pred=[predict(m,x['x']) for x in test]\n  ytd=[max(0,12*x['x']) for x in\
        \ test];mean=[m['ros_mean']]*len(test);recent=[max(0,12*x['last3']) for x in test]\n  err=mse(truth,pred);e_ytd=mse(truth,ytd);e_mean=mse(truth,mean);e_recent=mse(truth,recent)\n\
        \  req(min(err,e_ytd,e_mean,e_recent)>=0,'NEGATIVE_MSE')\n  # Holdout is used only to ACCEPT/REJECT this\
        \ preregistered fixed estimator.\n  # It is not used to change fitting, slope, weights, or coefficients.\n\
        \  win=len(test)>=30 and err <= .99*min(e_ytd,e_mean)\n  models[pos]={'fit':m,'eligible':win,'test_n':len(test)}\n\
        \  out.append({'position':pos,'2024_train_week6_seen_n':len(fit),'2025_untouched_outer_week6_seen_n':len(test),\n\
        \   '2024_fixed_model_slope_ROS_points_per_week6_ppg':round(m['slope'],6),\n   '2025_outer_fitted_MSE':round(err,5),'2025_outer_YTD12_MSE':round(e_ytd,5),\n\
        \   '2025_outer_2024positionmean_MSE':round(e_mean,5),'2025_outer_last3x12_MSE_DIAGNOSTIC':round(e_recent,5),\n\
        \   '2025_outer_fitted_MAE':round(mae(truth,pred),5),\n   '2025_outer_gain_vs_YTD_pct':round(100*(e_ytd-err)/e_ytd,3)\
        \ if e_ytd else '',\n   '2025_outer_gain_vs_positionmean_pct':round(100*(e_mean-err)/e_mean,3) if e_mean\
        \ else '',\n   'fixed_model_beats_both_by_atleast1pct':win,\n   'evaluation_status':'2025_OUTER_ACCEPTED_FOR_2026_ROS_RESEARCH'\
        \ if win else 'YTD_BASELINE_ONLY_MODEL_NOT_VALIDATED',\n   'exact_2024_25_Sleeper_official_scoring_certified':False,\n\
        \   'three_year_outcome_validated':False,'production_FV_authorized':False})\n return out,models\n\ndef run(args):\n\
        \ out=pathlib.Path(args.out);out.mkdir(parents=True,exist_ok=True)\n fixture=bool(args.fixture)\n inp,pins=inputs(pathlib.Path(args.inputs));history,historyaudit=load_history(pathlib.Path(args.repo),fixture)\n\
        \ decisions,models=calibrate(history)\n a=inp['R61']['rows'];b={key(r):r for r in inp['R64']['rows']};c={key(r):r\
        \ for r in inp['R68']['rows']}\n rows=[]\n for v in a:\n  ident=key(v);rr=b[ident];z=c[ident];pos=v['position'];model=models[pos];fv=v['frozen_FV_REFERENCE_ONLY']\n\
        \  req(rr['frozen_FV_UNCHANGED']==fv and z['frozen_FV_UNCHANGED']==fv,'LIVE_FV_QUOTE_DRIFT')\n  req(rr['sleeper_id']==z['sleeper_id'],'R64_R68_IDENTITY_MISMATCH')\n\
        \  observed=rr['identity_status']=='OBSERVED_UNIQUE_ID' and num(rr['stats_weeks_seen'],0)>0 and z['sleeper_id']!=''\n\
        \  actual=num(z['2026_known_alias_plus_kick_shadow_NOT_FV']) if observed else None\n  if observed:req(actual\
        \ is not None,'OBSERVED_SCORE_BLANK')\n  x=actual/6 if observed else None\n  baseline=max(0,12*x) if observed\
        \ else None\n  fitted=predict(model['fit'],x) if observed else None\n  chosen=fitted if model['eligible']\
        \ else baseline\n  estimated_total=actual+chosen if observed else None\n  # Same-unit 2026 (corrected actual\
        \ + forecast ROS) is separate from\n  # source-unverified 2026 frozen full-season projections, which are\
        \ NEVER averaged.\n  label=('2026_ROS_FIXED_MODEL_2025_HOLDOUT_ACCEPTED_RESEARCH_ONLY' if model['eligible']\
        \ else\n    '2026_ROS_YTD_EXTRAPOLATION_CONTROL_ONLY') if observed else 'NO_VERIFIED_WEEK6_SCORE_NO_ROS_QUOTE'\n\
        \  rows.append({'name':v['name'],'position':pos,'sleeper_id':z['sleeper_id'],\n   'frozen_FV_UNCHANGED':fv,\n\
        \   '2026_week1_6_corrected_LOG_points':round(actual,4) if observed else '',\n   '2026_week1_6_calendar_ppg':round(x,4)\
        \ if observed else '',\n   '2026_week7_18_simple_YTD12_control_points':round(baseline,3) if observed else\
        \ '',\n   '2026_week7_18_fixed_2024_model_points_RESEARCH':round(fitted,3) if observed else '',\n   '2026_week7_18_preferred_holdout_gated_research_points':round(chosen,3)\
        \ if observed else '',\n   '2026_fullseason_corrected_actual_plus_research_ROS_POINTS':round(estimated_total,3)\
        \ if observed else '',\n   '2026_frozen_fullseason_projection_SCORING_AND_VINTAGE_UNVERIFIED':v['projected_2026_points_NOT_EXACT_LOG'],\n\
        \   'preseason_to_historical_LOG_transfer_validated':False,\n   '2025_outer_position_model_accepted':model['eligible'],\n\
        \   '2026_ROS_research_status':label,\n   '2026_H1_or_H2_multi_year_FV_calibrated':False,\n   '2026_fullseason_estimate_NOT_FV':True,\n\
        \   'live_player_FV_or_index_changed':False,'production_change_authorized':False})\n req(len(rows)==518\
        \ and len({key(r) for r in rows})==518,'FINAL_518_INCOMPLETE')\n # Preview top 30 by 2026 estimate, NOT\
        \ price, plus user-requested breakout / elite identifiers if available\n preview=sorted((r for r in rows\
        \ if r['2026_fullseason_corrected_actual_plus_research_ROS_POINTS']!=''),\n  key=lambda r:float(r['2026_fullseason_corrected_actual_plus_research_ROS_POINTS']),reverse=True)[:25]\n\
        \ names=['bryce young','caleb williams','drake maye','jayden daniels','cj stroud','puka nacua','brian burns','myles\
        \ garrett']\n ids={r['name'].lower() for r in preview}\n for n in names:\n  hits=[r for r in rows if r['name'].lower().replace('.','')==n.replace('.','')]\n\
        \  if hits and hits[0]['name'].lower() not in ids:preview.append(hits[0]);ids.add(hits[0]['name'].lower())\n\
        \ prefix='CAL26_V1R69_'\n names={\n  'rows':prefix+'518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv',\n\
        \  'positions':prefix+'7position_2025_outer_ROS_calibration.csv',\n  'review':prefix+'owner_ROS_review_NOT_FV.csv',\n\
        \  'decision':prefix+'decision.md'}\n emit_csv(out/names['rows'],rows,list(rows[0]))\n emit_csv(out/names['positions'],decisions,list(decisions[0]))\n\
        \ emit_csv(out/names['review'],preview,list(rows[0]))\n n_accepted=sum(x['fixed_model_beats_both_by_atleast1pct']\
        \ for x in decisions)\n n_covered=sum(x['2026_week1_6_corrected_LOG_points']!='' for x in rows)\n md=['#\
        \ CAL26 V1R69 \u2014 Week 6 ROS forecast: chronological holdout and scoring-compatible research bridge','',\n\
        \  '**Decision: WEEK6_2026_REST12_ROS_HISTORICAL_HOLDOUT__FV_HOLD.**','',\n  f'- Historical player pool:\
        \ 2024 early-six-week cohorts {historyaudit[\"historical_entries_2024\"]}; 2025 outer holdout {historyaudit[\"\
        historical_entries_2025\"]}.',\n  f'- Approved fixed 2024-trained ROS estimators on untouched 2025: **{n_accepted}/7\
        \ positions**. Non-winners use a simple YTD calendar extrapolation as a control, not a certified model.',\n\
        \  f'- Corrected 2026 Week1\u20136 research-scored observations available: **{n_covered}/518**; 2026 Week7+\
        \ actuals never fetched.',\n  '- The frozen 2026 frozen full-season projection uses a **different, uncertified\
        \ scoring basis** and is displayed separately; not blended or treated as identical points.',\n  '- Historical\
        \ 2024/25 player-week archive is **not independently official-score-certified**. It has scoring-provenance\
        \ uncertainty separate from the 2026 official roster overlap parity.',\n  '- This estimates the remaining\
        \ 12 calendar weeks (bye/injury included as zero), not 12 games played.',\n  '- No three-year career model\
        \ or 0\u201310,000 FV scale is identified by this ROS backtest.',\n  '- Does not use market prices or owner\
        \ expected prices as training labels. No arbitrary point-to-FV multiplier.',\n  '- No production FV, scores,\
        \ or index.html modified. Next step should investigate source-consistent 2026 preseason/ROS projection transfer\
        \ and candidate price calibration.',\n  '', '|Position|2025 holdout N|Model vs both controls|2025 model\
        \ MSE|YTD MSE|Historical mean MSE|', '|---|---:|---|---:|---:|---:|']\n for r in decisions:md.append(f\"\
        |{r['position']}|{r['2025_untouched_outer_week6_seen_n']}|{'PASS' if r['fixed_model_beats_both_by_atleast1pct']\
        \ else 'HOLD'}|{r['2025_outer_fitted_MSE']}|{r['2025_outer_YTD12_MSE']}|{r['2025_outer_2024positionmean_MSE']}|\"\
        )\n (out/names['decision']).write_text('\\n'.join(md)+'\\n')\n manifest={'workflow':'CAL26 V1R69','semantic_status':'WEEK6_ROS_CHRONOLOGICAL_HOLDOUT_RESEARCH_ONLY_FV_HOLD','fixture':fixture,\n\
        \  'historical_time_split':{'train_year':2024,'outer_untouched_year':2025},\n  'fixed_model_2025_holdout_wins_positions':[r['position']\
        \ for r in decisions if r['fixed_model_beats_both_by_atleast1pct']],\n  '2026_observed_players':n_covered,'n_2026_candidates':518,'n_2026_frozen_player_prices_preserved':549,\n\
        \  'market_prices_used_as_labels':False,'owner_target_prices_used_as_labels':False,\n  'arb_point_multiplier_used':False,'future_2026_actual_weeks7_18_read':False,\n\
        \  'frozen_fullseason_projection_scoring_and_snapshot_vintage_certified':False,\n  'historical_2024_25_official_Sleeper_scorer_parity_certified':False,\n\
        \  'cardinal_FV_calibration_complete':False,'production_change_authorized':False,'index_html_modified':False,\n\
        \  'pinned_artifacts':pins,'archive':historyaudit,\n  'output_sha256':{filename:sha((out/filename).read_bytes())\
        \ for filename in names.values()}}\n (out/(prefix+'manifest.json')).write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\\\
        n')\n print(json.dumps({'status':manifest['semantic_status'],'fixture':fixture,'covered':n_covered,'accepted_positions':manifest['fixed_model_2025_holdout_wins_positions'],'rows':len(rows),'preview':len(preview)},sort_keys=True))\n\
        \ndef selftest():\n r=[{'x':1.0,'y':4.0},{'x':2.0,'y':7.0},{'x':3.0,'y':10.0}]*12\n m=train(r);req(m['n']==36\
        \ and 0<m['slope']<3,'RIDGE_TEST')\n req(predict(m,0)>=0 and predict(m,10)>predict(m,1),'PREDICT_TEST')\n\
        \ req(not set(('2026','2027'))<=set(('2024','2025')),'FUTURE_SOURCE_TEST')\n print('R69_SELFTEST_GREEN fixed\
        \ ridge, no future source, no price multiplier')\nif __name__=='__main__':\n pa=argparse.ArgumentParser();pa.add_argument('--inputs');pa.add_argument('--repo');pa.add_argument('--out');pa.add_argument('--fixture',action='store_true');pa.add_argument('--selftest',action='store_true');a=pa.parse_args()\n\
        \ if a.selftest:selftest()\n else:run(a)\n\nPY_CAL26_R69_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R69_engine.py\"\
        \npython \"$RUNNER_TEMP/CAL26_V1R69_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_V1R69_engine.py\"\
        \ \\\n --inputs \"$RUNNER_TEMP/cal26-r69-inputs\" \\\n --repo \"$GITHUB_WORKSPACE\" \\\n --out \"$RUNNER_TEMP/cal26-r69-results\"\
        \npython - \"$RUNNER_TEMP/cal26-r69-results\" <<'PY_CAL26_R69_CHECK'\nimport csv,hashlib,json,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R69_manifest.json').read_text())\nassert m['semantic_status']=='WEEK6_ROS_CHRONOLOGICAL_HOLDOUT_RESEARCH_ONLY_FV_HOLD'\n\
        assert not m['fixture'] and m['n_2026_candidates']==518 and m['n_2026_frozen_player_prices_preserved']==549\n\
        assert m['historical_time_split']=={'train_year':2024,'outer_untouched_year':2025}\nassert not m['future_2026_actual_weeks7_18_read']\
        \ and not m['production_change_authorized'] and not m['index_html_modified']\nassert not m['market_prices_used_as_labels']\
        \ and not m['owner_target_prices_used_as_labels'] and not m['arb_point_multiplier_used']\nassert not m['cardinal_FV_calibration_complete']\n\
        for fname,digest in m['output_sha256'].items():assert hashlib.sha256((p/fname).read_bytes()).hexdigest()==digest,fname\n\
        with (p/'CAL26_V1R69_518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv').open() as f: rows=list(csv.DictReader(f))\n\
        assert len(rows)==518 and len({(r['name'],r['position']) for r in rows})==518\nassert all(r['production_change_authorized']=='False'\
        \ and r['live_player_FV_or_index_changed']=='False' for r in rows)\nwith (p/'CAL26_V1R69_7position_2025_outer_ROS_calibration.csv').open()\
        \ as f: decisions=list(csv.DictReader(f))\nassert len(decisions)==7 and {r['position'] for r in decisions}=={'QB','RB','WR','TE','DL','LB','DB'}\n\
        assert all(int(r['2025_untouched_outer_week6_seen_n'])>=20 for r in decisions)\nprint('R69_REAL_2025_OUTER_HOLDOUT_AND_2026_WEEK6_RESEARCH_GREEN_FV_HOLD')\n\
        PY_CAL26_R69_CHECK\ntest -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r69-results/CAL26_V1R69_decision.md\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload 2026 ROS forecast review no FV change
      if: always()
      uses: actions/upload-artifact@v4
