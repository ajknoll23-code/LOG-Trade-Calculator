name: Historical Lineup Reconstruction (2024-2025)

# Manual only, same as lineup-history-availability-check.yml -- this hits
# 2 seasons x up to 18 weeks x matchups + a full player-pool fetch, so it
# shouldn't run on every push. Writes scripts/historical_lineup_demand.json
# and commits it so the data is available for the next analysis step
# without needing to re-run this on every follow-up chat.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run reconstruction
        run: python3 scripts/historical_lineup_reconstruction.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/historical_lineup_demand.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Reconstruct 2024-2025 historical weekly lineup demand"
          git push
