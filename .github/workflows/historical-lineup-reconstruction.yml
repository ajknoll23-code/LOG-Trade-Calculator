name: Historical Lineup & Start-Rate Analysis (2024-2025)

# Manual only, same as lineup-history-availability-check.yml -- this hits
# 2 seasons x up to 18 weeks x matchups, 2 seasons x 18 weeks of full
# league-wide weekly stats, plus 2 full player-pool fetches, so it
# shouldn't run on every push. Chains all three roster-economics scripts
# in dependency order and commits every output so the data is available
# for the next chat/analysis step without re-running this each time.
#
# 2026-08-26 UPDATE: now runs steps 5-6 (weekly points pipeline + start-
# rate curve analysis) after the lineup reconstruction, not just step 1-2.
# The reconstruction step's bench-capture update means this MUST be re-run
# in full (not resumed from an old historical_lineup_demand.json) for the
# start-rate curves to be meaningful -- see start_rate_curve_analysis.py's
# docstring for why it hard-fails if no "benched" records are present.
#
# 2026-08-27 UPDATE: added the robustness-checks step (effective demand,
# coverage ranks, rosterability vs. startability, bin-width sensitivity,
# bootstrap, dual-eligibility consistency), per the external technical
# review of the start-rate-curve findings. This step itself needs no
# network access (it only reprocesses files the earlier steps already
# produced) -- it's included here purely so the output gets committed
# automatically, not because it needs anything this workflow provides.
#
# 2026-08-27 UPDATE 2: added the DB-bootstrap sanity-check step -- a
# targeted follow-up verifying whether DB's bootstrap median (28) vs.
# full-data crossing (40) discrepancy is a real bug or expected small-
# sample bootstrap behavior. Also needs no network access; included here
# for the same reason as the step above -- this project's workflows are
# the only way results get back to a person (no interactive terminal),
# so every diagnostic that produces a real answer needs to end up in a
# committed file, not just a workflow log.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Step 1-2 -- Reconstruct weekly lineups (dedicated + bench)
        run: python3 scripts/historical_lineup_reconstruction.py

      - name: Data prerequisite -- Weekly scored points, full NFL universe
        run: python3 scripts/historical_weekly_points_pipeline.py

      - name: Self-test the curve/zone logic before trusting real output
        run: python3 scripts/start_rate_curve_analysis.py --selftest

      - name: Step 5-6 -- Start-rate curves and replacement zones
        run: python3 scripts/start_rate_curve_analysis.py

      - name: Self-test the robustness-check logic before trusting real output
        run: python3 scripts/roster_economics_robustness_checks.py --selftest

      - name: Robustness checks A/B/C + effective demand + coverage ranks
        run: python3 scripts/roster_economics_robustness_checks.py

      - name: DB bootstrap sanity check (closing item before backtester)
        run: python3 scripts/db_bootstrap_sanity_check.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/historical_lineup_demand.json \
                  scripts/weekly_points_by_season.json \
                  scripts/start_rate_curves.json \
                  scripts/start_rate_curve_report.md \
                  scripts/roster_economics_robustness.json \
                  scripts/roster_economics_robustness_report.md \
                  scripts/db_bootstrap_sanity_check_report.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Reconstruct 2024-2025 lineups + start-rate curve analysis + robustness checks + DB bootstrap sanity check"
          git push
