name: 4for4 IDP V1 - Provisional 10% Shadow Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisional-10pct-shadow-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Verify frozen code/methodology contract and capture current public sources
        shell: bash
        run: |
          set -euo pipefail

          expect_blob() {
            local file="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:$file")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: git blob drift for $file" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
          }

          # These three public projection/identity artifacts are intentionally
          # refreshed by the scheduled data workflow. Do NOT pin them to the
          # older Phase 2A byte hashes. The shadow compares incumbent V1 and
          # the provisional 10% overlay against the SAME current snapshots, so
          # ordinary provider refresh movement cannot masquerade as a 4for4
          # effect. Record their run-time hashes in the Actions log instead.
          for file in \
            scripts/fantasypros_api_normalized_2026.json \
            scripts/artifacts/generated/sleeper_2026_raw_categories.json \
            scripts/identity_crosswalk.json
          do
            test -s "$file" || { echo "ERROR: missing/empty current source $file" >&2; exit 1; }
            echo "CURRENT_SOURCE_SHA256 $file $(sha256sum "$file" | awk '{print $1}')"
          done

          # Freeze the code/release lineage that defines how the shadow is
          # interpreted. If any of these change, rebuild this harness instead
          # of silently running a different model.
          expect_blob scripts/projections/fourforfour_projection_pipeline.py \
            50dddd078eec10b955c29f3f5fab239b56f19438
          expect_blob scripts/model/idp_v1_projection.py \
            d25c46243184d031651a80bda26cbdc05aa50419
          expect_blob scripts/validation/snapshot_values.py \
            1efca4c35e910a95974c1bec0b06a106196618b3
          expect_blob scripts/sync/sync_free_agent_valuation.py \
            7feec5c3318d03aab0808353f23a4bb381eb4a3c
          expect_blob scripts/validation/validate_idp_v1_final_deployment.py \
            df167f6377c405c5d76154e580027803c9b687bd
          expect_blob model/releases/idp-v1/idp_v1_model_delta_transport_candidate.json \
            e96767c04cde5c210441a4d581fe40f29f245db8
          expect_blob .github/workflows/fourforfour-idp-v1-phase2a.yml \
            ab72ea257ec0006a9664d70d2bce5d0e757013b2

          expect_blob .github/workflows/fourforfour-idp-v1-phase2b.yml \
            3536ffb98c5798833129a323ec6cc16729bbb73e

          echo 'PASS: frozen code/methodology contract matches Phase 2A/2B; current public source hashes captured.'
          echo 'PROVISIONAL_POLICY_SHA256=8cf918c3c1d254ebf84dbff3a755375ceae9b7afe095233a921f7579180863d7'

      - name: Confirm current deployed IDP successor stack before shadowing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/validate_idp_v1_final_deployment.py
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py

      - name: Decode private 4for4 inputs outside repository
        shell: bash
        run: |
          set -euo pipefail

          for var in FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret ${var} is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-fourforfour-idp-v1/input
          install -d -m 700 /tmp/log-fourforfour-idp-v1/output

          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/db.csv

          chmod 600 /tmp/log-fourforfour-idp-v1/input/*.csv

          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/dl.csv | awk '{print $1}')" = \
            a8ae4a3dc3ed7e24e102e9416467826dd93441cc6b18c0589ed8345aeca977f6
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/lb.csv | awk '{print $1}')" = \
            957e3c03b604302d259393d3cd3c637d03ff15b6a51812bb23cc0d10830a8321
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/db.csv | awk '{print $1}')" = \
            7bc8fb440f171bc65ab82e4c2cf1ed88e4b53a6f64868461ac8a96cb08d9b079

          echo 'PASS: exact frozen private 4for4 inputs verified.'

      - name: Rebuild private 4for4 normalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/fourforfour_projection_pipeline.py \
            --dl /tmp/log-fourforfour-idp-v1/input/dl.csv \
            --lb /tmp/log-fourforfour-idp-v1/input/lb.csv \
            --db /tmp/log-fourforfour-idp-v1/input/db.csv \
            --output-dir /tmp/log-fourforfour-idp-v1/output/private \
            --public-summary /tmp/log-fourforfour-idp-v1/output/aggregate-summary.json \
            > /tmp/log-fourforfour-idp-v1/output/pipeline.stdout.txt

