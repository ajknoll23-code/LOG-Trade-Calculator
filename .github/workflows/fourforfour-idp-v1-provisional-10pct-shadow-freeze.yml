          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/fourforfour-idp-v1-phase2a.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/fourforfour-phase2a.py.b64 <<'B64'"
          start = workflow.find(marker)
          if start < 0:
              raise RuntimeError('Phase 2A embedded reconstruction marker missing')
          start = workflow.find('\n', start) + 1
          end = workflow.find('\n          B64', start)
          if end < 0:
              raise RuntimeError('Phase 2A embedded reconstruction terminator missing')
          encoded = ''.join(line.strip() for line in workflow[start:end].splitlines())
          base_script = base64.b64decode(encoded, validate=True).decode('utf-8')
          append_script = base64.b64decode(
              Path('/tmp/fourforfour-provisional-append.py.b64').read_text(encoding='ascii'),
              validate=False,
          ).decode('utf-8')
          combined = base_script + '\n\n' + append_script + '\n'
          compile(combined, '/tmp/fourforfour-provisional-shadow.py', 'exec')
          Path('/tmp/fourforfour-provisional-shadow.py').write_text(combined, encoding='utf-8')
          PY

          python3 /tmp/fourforfour-provisional-shadow.py

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove shadow made no repository changes
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .; then
            echo 'ERROR: provisional 10% shadow modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi
          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: provisional 10% shadow staged repository changes.' >&2
            git diff --cached -- .
            exit 1
          fi
          echo 'PASS: shadow and regressions left repository byte-clean.'

      - name: Destroy private 4for4 inputs and row-level outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-idp-v1
          rm -f /tmp/fourforfour-provisional-append.py.b64
          rm -f /tmp/fourforfour-provisional-shadow.py
          echo 'PASS: private 4for4 inputs and row-level outputs removed from runner.'
