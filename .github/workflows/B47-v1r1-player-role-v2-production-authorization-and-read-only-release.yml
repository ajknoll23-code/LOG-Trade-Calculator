          assert decision['production_role_v2_valuation_adapter_enabled'] is False
          assert decision['production_fundamental_value_changed'] is False
          assert decision['production_market_value_changed'] is False
          assert decision['production_package_adjustment_changed'] is False
          assert decision['production_roster_optimizer_changed'] is False
          assert decision['production_trade_verdict_changed'] is False
          print('PASS: B47 V1 release gates and impact boundaries.')
          PYAUDIT

      - name: Smoke test static Role V2 browser JavaScript
        shell: bash
        run: |
