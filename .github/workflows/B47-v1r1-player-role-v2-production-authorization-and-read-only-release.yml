name: B47 Player Role V2 Production Authorization and Read Only Release V1R1

# B47 V1: consume *frozen* B46 V1R2 artifacts, no retraining and no model updates.
# Safe scope: a read-only role explorer, its immutable Week-5 JSON, one reversible
# Trade Desk navigation link and release manifests. NO FV/MV/Package/Utility edits.
# Default mode verifies only. 'deploy' requires explicit exact owner attestation.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify first; deploy only after reviewing artifact
        required: true
        type: choice
        default: verify
        options:
          - verify
          - deploy
      attestation:
        description: Exact B47 V1 display-only production authorization (deploy only)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  b47_release:
    name: B47 V1 evidence integrity and scoped release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MODE: ${{ inputs.mode }}
      OWNER_ATTEST: ${{ inputs.attestation }}
      B47_STAGE: ${{ runner.temp }}/b47-stage
      B47_CHECK: ${{ runner.temp }}/b47-postcheck
    steps:
      - name: Check out current durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python (stdlib-only verification)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Enforce mode, branch and production-authorization contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$MODE" = 'verify' -o "$MODE" = 'deploy'
          if [ "$MODE" = 'deploy' ]; then
            test "$OWNER_ATTEST" = 'I_AUTHORIZE_B47_V1_DISPLAY_ONLY_PLAYER_ROLE_V2_WEEK5_DEPLOYMENT_WITH_NO_FV_MV_PACKAGE_ADJUSTMENT_TEAM_UTILITY_OR_TRADE_VERDICT_CHANGES'
          else
            test -z "$OWNER_ATTEST" || echo 'VERIFY_ONLY: provided attestation is ignored; nothing will be committed.'
          fi
          echo "B47_BASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install pinned in-workflow B47 V1 builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/b47_v1_builder.py" <<'PYB47'
          #!/usr/bin/env python3
          """B47 V1 — frozen Week-5 Role V2 display-only release builder.
          
          NO source model training, retuning, roster reads or value calculation here.
          Authorizes a standalone inspectable read-only snapshot, not a change to FV.
          """
          import argparse
          import csv
          import hashlib
          import html
          import io
          import json
          import math
          import os
          import re
          import sys
          from collections import Counter
          from pathlib import Path
          
          BASE = Path('research/player-role-v2')
          FROZEN = 'player_role_v2_b46_v1r2_'
          EXPECTED_GIT_BLOBS = {
              'scientific_decision.json': 'e1951559d6c65056c61dc541ade470e135bdc84f',
              'owner_blind_evidence.json': '14ebb0d5449b56d15cc88922980f086e416d7fcc',
              'shadow.csv': '6d4f8d4d9e663655d7255bd23a5c365d00ae55d8',
              'role_eligibility.csv': '2301d1d8bf1422ed41942f4c50f30c16ee9a2466',
              'shadow_witness.json': '2f29e3f47cfc611596d4034c9106f87e25dbb59e',
              'protocol.json': '8ff36568d204f15c16989f5532c23490d62ceba2',
              'source_preflight.json': '4d5895ba6e267de7daa01d791bab8202170d6f49',
              'identity_validation.json': '4fd2b9c05f58971d3a7a845c0a26a1b68ce0730c',
          }
          EVAL_SHA = '11c5dad54549b9c84bed9cd38a1e65320eb0bdfd22927b4d2877f92c4aca8f42'
          LINK = '''          /* B47_V1_DISPLAY_ONLY_LINK_START */
                    '<a class="log-app-nav-item" href="player-role-v2.html" id="b47-role-v2-link" title="Player Role V2 Week 5: research signal, no FV changes">' +
                      '<span class="log-app-nav-icon">◇</span><span>Role V2</span>' +
                    '</a>' +
                    /* B47_V1_DISPLAY_ONLY_LINK_END */
          '''
          ANCHOR = '''          '<a class="log-app-nav-item" href="free-agent-board.html">' +
                      '<span class="log-app-nav-icon">＋</span><span>Free Agents</span><span class="td-private-badge">PRIVATE</span>' +
                    '</a>' +
          '''
          DISPLAY_PATH = Path('player-role-v2.html')
          SNAPSHOT_PATH = Path('data/player_role_v2_week5.json')
          DECISION_PATH = BASE / 'b47_v1_production_decision.json'
          MANIFEST_PATH = BASE / 'b47_v1_release_manifest.json'
          ALLOWED = [Path('index.html'), DISPLAY_PATH, SNAPSHOT_PATH, DECISION_PATH, MANIFEST_PATH]
          TIERS = ('Elite','Every-Down','Starter','Rotational','Understudy','Depth','Speculative')
          POSITIONS = ('QB','RB','WR','TE','DL','LB','DB','K')
          
          
          def gate(condition, message):
              if not condition:
                  raise RuntimeError('B47_FAIL_CLOSED_' + message)
          
          
          def payload(obj):
              return (json.dumps(obj, sort_keys=True, indent=2, ensure_ascii=False, allow_nan=False) + '\n').encode('utf-8')
          
          
          def sha(bs):
              return hashlib.sha256(bs).hexdigest()
          
          
          def blob_id(bs):
              return hashlib.sha1(b'blob ' + str(len(bs)).encode() + b'\0' + bs).hexdigest()
          
          
          def load_json(bs):
              return json.loads(bs.decode('utf-8'))
          
          
          def rows(bs):
              return list(csv.DictReader(io.StringIO(bs.decode('utf-8'), newline='')))
          
          
          def require_sha(expected, actual, tag):
              gate(actual == expected, f'{tag}_SHA_DRIFT_EXPECTED_{expected}_ACTUAL_{actual}')
          
          
          def validate_source(repo):
              original = {}
              for suffix, expected_blob in EXPECTED_GIT_BLOBS.items():
                  path = repo / BASE / (FROZEN + suffix)
                  gate(path.is_file(), 'MISSING_B46_' + suffix)
                  bs = path.read_bytes()
                  require_sha(expected_blob, blob_id(bs), 'B46_BLOB_' + suffix)
                  original[suffix] = bs
              decision = load_json(original['scientific_decision.json'])
              evidence = load_json(original['owner_blind_evidence.json'])
              witness = load_json(original['shadow_witness.json'])
              protocol = load_json(original['protocol.json'])
              source = load_json(original['source_preflight.json'])
              identity = load_json(original['identity_validation.json'])
          
              gate(decision.get('result') == 'PASS_B46_V1_FRESH_WEEK_ACCEPTANCE', 'SCIENTIFIC_PASS_MISSING')
              gate(decision.get('classification') == 'PROSPECTIVE_FRESH_WEEK_ACCEPTANCE_AFTER_WEEK4_REMEDIATION', 'NOT_FRESH_VALIDATION')
              gate(decision.get('target_week') == 5 and decision.get('fresh_week') is True, 'WRONG_TARGET_WEEK')
              gate(decision.get('all_primary_gates_pass') is True, 'B46_PRIMARY_GATES')
              gate(decision.get('eligible_for_separate_production_authorization') is True, 'B46_PRODUCTION_INELIGIBLE')
              gate(decision.get('production_change_authorized') is False and decision.get('production_model_deployed') is False, 'B46_REINTERPRETED')
              gate(decision.get('team_count') == 12 and decision.get('minimum_team_role_coverage') == 1 and decision.get('coverage_range') == 0, 'B46_TEAM_SCOPE')
              gate(decision.get('structural_role_changes') == 0, 'B46_ROLE_INVARIANCE')
              require_sha(decision['evidence_sha256'], sha(original['owner_blind_evidence.json']), 'B46_EVIDENCE')
              gate(evidence.get('all_primary_gates_pass') is True and evidence.get('fresh_week') is True, 'B46_EVIDENCE_GATES')
              gate(all(v is True for v in evidence.get('primary_gates',{}).values()) and len(evidence['primary_gates']) >= 20, 'B46_GATE_MATRIX')
              gate(len(evidence.get('team_results',[])) == 12, 'B46_OPAQUE_TEAM_COUNT')
              gate(evidence.get('supported_position_roster_player_count') == 545, 'ROSTERED_COHORT_DRIFT')
              gate(evidence.get('roster_name_availability') == 1 and evidence.get('participant_confirmation_rate') == 1, 'DATA_INTEGRITY')
              gate(sum(int(x['role_eligible_supported_position_players']) for x in evidence['team_results']) == 495, 'ELIGIBLE_COHORT_DRIFT')
              gate(all(x['role_coverage'] == 1 and x['fallback_role_count'] == 0 for x in evidence['team_results']), 'TEAM_COVERAGE_FALLBACK')
              gate(evidence.get('structural_counterfactual',{}).get('comparisons') == 23760 and evidence['structural_counterfactual'].get('role_changes') == 0 and evidence['structural_counterfactual'].get('pass') is True, 'COUNTERFACTUAL')
              gate(evidence.get('B45_roster_binding',{}).get('all_three_checked') is True and evidence['B45_roster_binding'].get('pass') is True, 'B45_REPAIR_INTEGRITY')
              gate(evidence.get('B44W4_historical_stop_preserved') is True and evidence.get('B46W4_same_week_pass_preserved_but_not_counted_as_fresh_validation') is True, 'HISTORICAL_EVIDENCE_REWRITTEN')
              gate(evidence.get('identity_validation',{}).get('DOB_POSITION_reference_validation',{}).get('comparisons') == 1293 and evidence['identity_validation']['DOB_POSITION_reference_validation'].get('conflicts') == 0, 'DOB_PRECISION')
              gate(evidence['identity_validation'].get('DOB_POSITION_quarantined_count') == 2 and evidence['identity_validation'].get('B45_effective_override_count') == 3, 'IDENTITY_POLICY')
              gate(identity.get('owner_or_roster_context_used') is False and identity.get('DOB_POSITION_all_hard_precision_gates_pass') is True, 'IDENTITY_REVIEW')
              gate(witness.get('roster_assignment_semantics_parsed_before_shadow_freeze') is False, 'OWNER_BLIND_VIOLATION')
              gate(witness.get('model_or_tier_retuning_performed') is False, 'RETUNING_VIOLATION')
              gate(witness.get('target_week') == 5 and witness.get('evaluator_sha256') == EVAL_SHA, 'FREEZE_WITNESS')
              gate(protocol.get('status') == 'FROZEN_BEFORE_FRESH_WEEK_ROLE_COVERAGE_OR_TEAM_METRIC', 'PROTOCOL_FREEZE')
              gate(protocol.get('evaluator_sha256') == EVAL_SHA, 'PROTOCOL_EVALUATOR_DRIFT')
              gate(protocol.get('source_slice_contract',{}).get('origin_week') == 5 and protocol['source_slice_contract'].get('sleeper_weeks_used') == [1,2,3,4,5], 'PROTOCOL_WEEK_SLICE')
              gate(protocol.get('production_change_authorized') is False and protocol.get('production_model_deployed') is False, 'PROTOCOL_REWRITTEN')
              gate(source.get('source_readiness_all_pass') is True and source.get('week5_snap_game_count') == 15, 'SOURCE_COMPLETENESS')
              gate(source.get('target_week') == 5 and source.get('analysis_never_uses_week_after_target') is True, 'SOURCE_FUTURE_LEAK')
              require_sha(protocol['source_preflight_sha256'], sha(original['source_preflight.json']), 'PREFLIGHT_PROTOCOL')
              require_sha(evidence['source_preflight_sha256'], sha(original['source_preflight.json']), 'PREFLIGHT_EVIDENCE')
              require_sha(evidence['protocol_sha256'], sha(original['protocol.json']), 'PROTOCOL_EVIDENCE')
              require_sha(evidence['shadow_sha256'], sha(original['shadow.csv']), 'SHADOW_EVIDENCE')
              require_sha(witness['shadow_sha256'], sha(original['shadow.csv']), 'SHADOW_WITNESS')
              require_sha(evidence['role_eligibility_sha256'], sha(original['role_eligibility.csv']), 'ELIGIBILITY_EVIDENCE')
              require_sha(evidence['identity_validation_sha256'], sha(original['identity_validation.json']), 'IDENTITY_EVIDENCE')
              return original, decision, evidence
          
          
          def release_rows(original):
              eligible = rows(original['role_eligibility.csv'])
              frozen = rows(original['shadow.csv'])
              gate(len(eligible) == 1460 and len(frozen) == 1450, 'ROLE_MODEL_POPULATION')
              pairs = {}
              for r in eligible:
                  key=(r['gsis_id'], r['sleeper_id'])
                  gate(key not in pairs,'ELIGIBILITY_KEY_DUPLICATE')
                  pairs[key]=r
              published=[]
              sleeper_ids=set()
              identities=Counter()
              for r in frozen:
                  sid = r['sleeper_id']
                  key = (r['gsis_id'], sid)
                  gate(sid and sid not in sleeper_ids and key in pairs, 'SHADOW_IDENTITY_NOT_UNIQUE_OR_UNMAPPED')
                  sleeper_ids.add(sid)
                  counterpart = pairs[key]
                  position = r['position']
                  tier = r['role_tier']
                  gate(position in POSITIONS and tier in TIERS, 'INVALID_ROLE_OR_POSITION')
                  gate(counterpart['position'] == position, 'SOURCE_POSITION_DRIFT')
                  gate(r['origin_week'] == '5' and counterpart['origin_week'] == '5', 'SOURCE_WEEK_DRIFT')
                  gate(r['confidence_status'] == 'NOT_CALIBRATED_B42_DOES_NOT_INVENT_CONFIDENCE_THRESHOLDS', 'CALIBRATION_MISSTATEMENT')
                  gate(r['identity_source'] in ('STABLE_CROSSWALK','DOB_POSITION_OVERLAY','B45_VERIFIED_OVERRIDE'), 'IDENTITY_SOURCE')
                  gate(counterpart['identity_source'] == r['identity_source'], 'IDENTITY_LAYER_DRIFT')
                  gate(counterpart['identity_mapped'] == 'True', 'UNMAPPED_ELIGIBILITY')
                  source_name = counterpart['player_name'].strip()
                  gate(bool(source_name) and len(source_name)<=100, 'INVALID_PUBLIC_PLAYER_NAME')
                  games=int(r['prior_active_games'])
                  gate(1 <= games <= 5, 'INVALID_ACTIVE_GAME_EVIDENCE')
                  missing=int(r['frozen_feature_missing_count_before_imputation'])
                  count=int(r['frozen_feature_count'])
                  gate(0 <= missing <= count and count > 0, 'MODEL_MISSINGNESS')
                  score=float(r['model_score'])
                  gate(math.isfinite(score) and 0 <= score <= 1, 'MODEL_SCORE_OUT_OF_RANGE')
                  identities[r['identity_source']]+=1
                  published.append({'sleeper_id':sid,'name':source_name,'position':position,'role_tier':tier,'active_games':games,'source':'B46 Week 5 frozen model','confidence':'Not calibrated'})
              gate(identities == {'STABLE_CROSSWALK':1363,'DOB_POSITION_OVERLAY':84,'B45_VERIFIED_OVERRIDE':3}, 'IDENTITY_LAYER_TOTALS')
              published.sort(key=lambda x:(POSITIONS.index(x['position']),x['name'].casefold(),x['sleeper_id']))
              return published, dict(identities)
          
          
          PAGE = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Player Role V2 · Week 5 | LOG Trade Desk</title>
          <style>
          :root{color-scheme:dark;--bg:#0E2841;--panel:#16324F;--edge:#38536b;--text:#F8FAFC;--muted:#B5C4D6;--red:#EB6261;--amber:#E8B84B;--green:#3FCB7C}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
          main{width:min(980px,calc(100% - 28px));margin:24px auto 70px}a{color:#ffb5b3}h1{font-size:clamp(27px,5vw,40px);margin:8px 0}h2{font-size:18px}
          .kicker{letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--red);font-weight:700}.sub{color:var(--muted)}
          header{border-bottom:1px solid var(--edge);padding-bottom:18px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}
          .stat,.note,.filters,.card{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:15px}.stat strong{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
          .note{border-left:3px solid var(--amber);color:var(--muted);font-size:13px}.note strong{color:var(--text)}
          .filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:18px 0}label{display:grid;gap:5px;color:var(--muted);font-size:12px}
          input,select{width:100%;padding:11px;border:1px solid #5b7185;border-radius:8px;background:#0d253d;color:var(--text);font:inherit}
          .status{font-size:13px;color:var(--muted);min-height:25px}.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.card{padding:13px;min-width:0}
          .card strong{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:7px}.tier{display:inline-block;padding:2px 7px;border-radius:12px;background:#2a4964;color:#cce0f2;font-size:11px;font-weight:700;margin-top:7px}
          footer{font-size:12px;color:var(--muted);border-top:1px solid var(--edge);margin-top:28px;padding-top:15px}
          @media(max-width:600px){.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.rows{grid-template-columns:1fr}}
          </style></head><body><main>
          <header><div class="kicker">League of Ordinary Gentlemen · Frozen study output</div><h1>Player Role V2</h1>
          <p class="sub">2026 NFL · through completed Week 5 · observational role signals, not live depth charts.</p>
          <a href="./index.html">← Back to Trade Desk</a></header>
          <div class="summary"><div class="stat"><strong>1,450</strong><span>Model-scored players across NFL</span></div>
          <div class="stat"><strong>495 / 495</strong><span>Eligible rostered league players covered</span></div>
          <div class="stat"><strong>12 / 12</strong><span>Teams passed the Week 5 acceptance</span></div>
          <div class="stat"><strong>0</strong><span>Fallback roles used in B46</span></div></div>
          <div class="note"><strong>Read-only release.</strong> These frozen tiers are research output and do not modify Fundamental Value, Market Value, Package Adjustment, roster optimization, or trade verdicts. 545 rostered players were in supported positions; 495 met the Week 5 role-evidence eligibility requirements. The others do not receive invented tiers. Roles have <strong>no calibrated confidence probabilities</strong>, and model inputs include imputed missing cells. This is a dated snapshot, not an automated weekly refresh.</div>
          <div class="filters"><label>Search player<input id="search" placeholder="Enter a player name" autocomplete="off"></label>
          <label>Position<select id="position"><option value="">All positions</option></select></label>
          <label>Role tier<select id="tier"><option value="">All roles</option></select></label></div>
          <p class="status" role="status" id="status">Loading frozen Week 5 roles…</p><div class="rows" id="results" aria-live="polite"></div>
          <footer>Research source: B46 Fresh Week 5 Acceptance V1R2 · 13 October 2026. This page uses the SHA-pinned B46 model artifact. No new model fitting or outcome-based retuning occurred during B47.</footer>
          </main><script>
          'use strict';
          const input=document.getElementById('search');
          const posSelect=document.getElementById('position');
          const tierSelect=document.getElementById('tier');
          const status=document.getElementById('status');
          const results=document.getElementById('results');
          let all=[];
          for(const p of ['QB','RB','WR','TE','DL','LB','DB','K']){const o=document.createElement('option');o.value=p;o.textContent=p;posSelect.appendChild(o)}
          for(const t of ['Elite','Every-Down','Starter','Rotational','Understudy','Depth','Speculative']){const o=document.createElement('option');o.value=t;o.textContent=t;tierSelect.appendChild(o)}
          function draw(){
            const query=input.value.trim().toLocaleLowerCase();
            const matches=all.filter(p=>(!query||p.name.toLocaleLowerCase().includes(query))&&(!posSelect.value||p.position===posSelect.value)&&(!tierSelect.value||p.role_tier===tierSelect.value));
            status.textContent=matches.length.toLocaleString()+' matching players · showing '+Math.min(matches.length,100)+' (refine search for more)';
            const fragment=document.createDocumentFragment();
            for(const p of matches.slice(0,100)){
              const card=document.createElement('article');card.className='card';
              const name=document.createElement('strong');name.textContent=p.name;card.appendChild(name);
              const tier=document.createElement('div');tier.className='tier';tier.textContent=p.role_tier;card.appendChild(tier);
              const meta=document.createElement('div');meta.className='meta';meta.textContent=p.position+' · '+p.active_games+' active games · confidence not calibrated';card.appendChild(meta);
              fragment.appendChild(card);
            }
            results.replaceChildren(fragment);
          }
          for(const el of [input,posSelect,tierSelect])el.addEventListener(el===input?'input':'change',draw);
          fetch('./data/player_role_v2_week5.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Snapshot unavailable ('+r.status+')');return r.json()}).then(d=>{
            if(d.schema_version!==1||d.season!==2026||d.week!==5||!Array.isArray(d.players)||d.players.length!==1450)throw new Error('Frozen snapshot schema mismatch');
            all=d.players;
            draw();
          }).catch(e=>{status.textContent='Role snapshot could not be verified. Trade Desk values are unchanged.';results.replaceChildren();console.warn('B47 role explorer unavailable:',e.message)});
          </script></body></html>
          '''
          
          
          def homepage_bytes(repo):
              original=(repo / 'index.html').read_bytes()
              page=original.decode('utf-8')
              gate(page.count(ANCHOR)==1, 'TRADE_DESK_NAV_ANCHOR_MISSING_OR_AMBIGUOUS')
              gate(page.count('function buildShell(')==1 and page.index('function buildShell(')<page.index(ANCHOR)<page.index('const logo = shell.querySelector'), 'ANCHOR_NOT_IN_VISIBLE_SHELL_BUILDER')
              gate('<script' in page and 'const PLAYER_DB = {' in page and 'function playerValue(' in page, 'TRADE_DESK_MODEL_UNRECOGNIZED')
              if 'B47_V1_DISPLAY_ONLY_LINK_START' in page:
                  gate(page.count(LINK)==1, 'EXISTING_B47_LINK_DRIFT')
                  gate(page.replace(LINK,'',1).count(ANCHOR)==1, 'EXISTING_B47_LINK_INVALID')
                  return original, original, 'already-linked'
              changed=page.replace(ANCHOR,ANCHOR+LINK,1)
              gate(changed.replace(LINK,'',1)==page, 'TRADE_DESK_BYTE_REVERSIBILITY')
              gate(changed.count('B47_V1_DISPLAY_ONLY_LINK_START')==1, 'TRADE_DESK_INJECTION_COUNT')
              return original, changed.encode('utf-8'), 'new-link'
          
          
          def make_release(repo, stage):
              # A verification artifact is a candidate, never an authorization.
              mode=os.environ.get('MODE')
              gate(mode in ('verify','deploy'), 'MODE_NOT_VERIFIED')
              release_authorized=(mode == 'deploy')
              original, decision, evidence=validate_source(repo)
              player_rows, identities=release_rows(original)
              gate(len(player_rows)==1450, 'RELEASE_POPULATION_DRIFT')
              snapshot={
                  'schema_version':1,'study_id':'player-role-v2','season':2026,'week':5,
                  'publication_scope':'DISPLAY_ONLY_FROZEN_PROSPECTIVE_ROLE_SNAPSHOT',
                  'score_or_confidence_probability_calibrated':False,
                  'valuation_adjustments_authorized':False,
                  'total_rostered_supported_position_players':545,
                  'eligible_rostered_players':495,
                  'eligible_rostered_coverage':1,
                  'source_b46_evidence_sha256':decision['evidence_sha256'],
                  'source_shadow_sha256':evidence['shadow_sha256'],
                  'players':player_rows,
              }
              outputs={SNAPSHOT_PATH:payload(snapshot),DISPLAY_PATH:PAGE.encode('utf-8')}
              old_html,new_html,link_state=homepage_bytes(repo)
              outputs[Path('index.html')]=new_html
              manifest={
                  'schema_version':1,'release':'B47_V1_DISPLAY_ONLY','study_id':'player-role-v2',
                  'frozen_target_week':5,'source_protocol':'B46-v1r2','source_b46_git_blobs':EXPECTED_GIT_BLOBS,
                  'all_scientific_gates_pass':True,'role_shadow_players':1450,
                  'rostered_supported_position_players':545,'rostered_eligible_coverage':'495/495',
                  'identity_resolution_counts':identities,
                  'confidence_calibration':'NOT_CALIBRATED',
                  'model_or_tier_retuning_performed':False,
                  'changes_to_FV_MV_package_adjustment_or_trade_verdicts':False,
                  'index_change_scope':'ONE_REVERSIBLE_DISPLAY_ONLY_LINK',
                  'role_snapshot_sha256':sha(outputs[SNAPSHOT_PATH]),
                  'role_page_sha256':sha(outputs[DISPLAY_PATH]),
                  'release_authorization_state': 'OWNER_ATTESTED_DEPLOY' if release_authorized else 'VERIFY_ONLY_NOT_AUTHORIZED',
                  'index_sha256_before_link':sha(old_html if link_state=='new-link' else old_html.replace(LINK.encode('utf-8'),b'',1)),
                  'index_sha256_with_link':sha(new_html),
              }
              outputs[MANIFEST_PATH]=payload(manifest)
              authorization={
                  'schema_version':1,'release':'B47_V1_DISPLAY_ONLY',
                  'classification':'DISPLAY_ONLY_RELEASE_AUTHORIZED_NOT_FUNDAMENTAL_VALUE_ADOPTION' if release_authorized else 'DISPLAY_ONLY_RELEASE_CANDIDATE_NOT_AUTHORIZED',
                  'scientific_source':'PASS_B46_V1_FRESH_WEEK_ACCEPTANCE',
                  'frozen_week':5,
                  'production_change_authorized':release_authorized,
                  'production_change_scope':'STATIC_ROLE_EXPLORER_AND_SINGLE_TRADE_DESK_NAV_LINK_ONLY',
                  'production_role_v2_valuation_adapter_enabled':False,
                  'production_fundamental_value_changed':False,
                  'production_market_value_changed':False,
                  'production_package_adjustment_changed':False,
                  'production_roster_optimizer_changed':False,
                  'production_trade_verdict_changed':False,
                  'confidence_probabilities_presented':False,
                  'automatic_weekly_refresh_enabled':False,
                  'b46_evidence_sha256':decision['evidence_sha256'],
                  'release_manifest_sha256':sha(outputs[MANIFEST_PATH]),
                  'github_pages_live_verification':'NOT_ESTABLISHED_BY_REPOSITORY_COMMIT',
                  'deployment_next_step':'VERIFY_PAGES_BUILD_AND_BROWSER_SMOKE_TEST',
              }
              outputs[DECISION_PATH]=payload(authorization)
              for rel,bs in outputs.items():
                  out=stage/rel
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(bs)
              report={'status':'PASS_B47_V1_RELEASE_CANDIDATE_VERIFIED','mode':'display-only',
                      'source_b46_scientific_pass':True,'published_model_rows':len(player_rows),
                      'rostered_eligible_coverage':'495/495', 'live_index_link':link_state,
                  'production_change_authorized':release_authorized,
                      'files':{str(rel):sha(bs) for rel,bs in outputs.items()},
                      'production_fv_role_adapter_enabled':False,
                      'scientific_thresholds_retuned':False,'owner_roster_data_published':False}
              (stage/'b47_verification_report.json').write_bytes(payload(report))
              return report,outputs
          
          
          def verify_published(repo,stage):
              _, outputs=make_release(repo,stage)
              for rel,expected in outputs.items():
                  path=repo/rel
                  gate(path.is_file(), 'DEPLOYMENT_FILE_MISSING_'+str(rel))
                  gate(path.read_bytes()==expected, 'DEPLOYMENT_FILE_MISMATCH_'+str(rel))
              return True
          
          
          def selftest():
              test=b'Example'
              gate(blob_id(test)==hashlib.sha1(b'blob 7\0Example').hexdigest(),'BLOB_HASH_CONTRACT')
              gate(sha(test)==hashlib.sha256(test).hexdigest(),'CONTENT_HASH_CONTRACT')
              gate(ANCHOR.count('free-agent-board.html')==1,'ANCHOR_CONTRACT')
              gate('fetch(\'./data/player_role_v2_week5.json\'' in PAGE,'PAGE_SNAPSHOT_ROUTE')
              gate('textContent=p.name' in PAGE and 'innerHTML' not in PAGE,'ESCAPING_AND_DOM_RENDER_CONTRACT')
              gate('score' not in str({'fields':['name','position','role_tier']}),'PUBLIC_INTERFACE_CONTRACT')
              print('PASS: B47 V1 built-in tests, deterministic hash helpers, safe DOM binding, scope policy')
          
          
          def main():
              p=argparse.ArgumentParser()
              p.add_argument('--repo',type=Path,default=Path('.'))
              p.add_argument('--stage',type=Path)
              p.add_argument('--selftest',action='store_true')
              p.add_argument('--verify-deployed',action='store_true')
              a=p.parse_args()
              if a.selftest:
                  selftest();return
              gate(a.stage is not None,'STAGE_REQUIRED')
              a.stage.mkdir(parents=True,exist_ok=True)
              if a.verify_deployed:
                  verify_published(a.repo,a.stage)
                  print('PASS: B47 release published at expected paths; exact output bytes verified')
              else:
                  report,_=make_release(a.repo,a.stage)
                  print(json.dumps(report,sort_keys=True,indent=2))
          
          if __name__=='__main__':
              main()
          PYB47
          python3 -m py_compile "$RUNNER_TEMP/b47_v1_builder.py"
          python3 "$RUNNER_TEMP/b47_v1_builder.py" --selftest

      - name: Verify frozen B46 and prepare deterministic release candidate
