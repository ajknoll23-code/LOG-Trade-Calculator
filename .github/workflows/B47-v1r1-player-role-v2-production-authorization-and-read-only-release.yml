      - name: Upload B47 candidate and scientific verification report
        uses: actions/upload-artifact@v4
        with:
          name: B47-V1-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/b47-stage/
          if-no-files-found: error
          retention-days: 30

      - name: Publish only explicitly authorized read-only release files
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          # No overwrite or silent redeploy: each B47 V1 activation is one-shot.
          test ! -e player-role-v2.html
          test ! -e data/player_role_v2_week5.json
          test ! -e research/player-role-v2/b47_v1_production_decision.json
          test ! -e research/player-role-v2/b47_v1_release_manifest.json
          test "$(git rev-parse HEAD)" = "$B47_BASE_COMMIT"
          mapfile -t ALLOWED <<'EOFALLOWED'
          data/player_role_v2_week5.json
          index.html
          player-role-v2.html
          research/player-role-v2/b47_v1_production_decision.json
          research/player-role-v2/b47_v1_release_manifest.json
          EOFALLOWED
          for f in "${ALLOWED[@]}"; do
            mkdir -p "$(dirname "$f")"
            cp "$B47_STAGE/$f" "$f"
          done
          python3 "$RUNNER_TEMP/b47_v1_builder.py" --repo . --stage "$B47_CHECK" --verify-deployed
          git add -- "${ALLOWED[@]}"
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' "${ALLOWED[@]}" | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --check
          # Python generated exact original homepage + ONE link, preserving JS bytes.
          python3 - <<'PYCOMMIT'
          import subprocess
          from pathlib import Path
          before=subprocess.check_output(['git','show','HEAD:index.html'])
          after=Path('index.html').read_bytes()
          snippet=("          /* B47_V1_DISPLAY_ONLY_LINK_START */\n"
           "          '<a class=\"log-app-nav-item\" href=\"player-role-v2.html\" id=\"b47-role-v2-link\" title=\"Player Role V2 Week 5: research signal, no FV changes\">' +\n"
           "            '<span class=\"log-app-nav-icon\">◇</span><span>Role V2</span>' +\n"
           "          '</a>' +\n"
           "          /* B47_V1_DISPLAY_ONLY_LINK_END */\n").encode("utf-8")
          assert after.count(snippet)==1, 'B47 expected exactly one link addition'
          assert after.replace(snippet,b'',1)==before, 'B47 disallowed homepage mutation'
          print('PASS: no existing HTML/JS/CSS/math bytes changed')
          PYCOMMIT
          git config user.name 'b47-player-role-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$B47_BASE_COMMIT"
          git commit -m 'B47 V1 authorized display-only Player Role V2 Week-5 release'
          git push origin HEAD:main
          echo 'B47: read-only release committed; Pages deployment must be checked separately.'

      - name: Recheck durable post-deployment bytes
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          python3 "$RUNNER_TEMP/b47_v1_builder.py" --repo . --stage "$B47_CHECK" --verify-deployed
          python3 - <<'PYEND'
