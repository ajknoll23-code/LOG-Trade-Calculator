name: 4for4 IDP V1 - Phase 2D Realized Stat Semantics Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realized-stat-semantics-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Verify frozen Phase 2B and green Phase 2C contract
        shell: bash
        run: |
          set -euo pipefail

          check_sha256() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: SHA256 drift for $path: $actual" >&2
              exit 1
            fi
          }

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: Git blob drift for $path" >&2
              echo "expected=$expected" >&2
              echo "actual=$actual" >&2
              exit 1
            fi
          }

          check_sha256 scripts/fantasypros_api_normalized_2026.json \
            3da23f6168576c789de86690fc059d0a33b2b0bb096ace2ec4eb9ba0d94237cb
          check_sha256 scripts/artifacts/generated/sleeper_2026_raw_categories.json \
            ee577f745416d375938fbdbdf28f1dfbf9f304f6c9d5cedc62733b12c52cb4e0
          check_sha256 scripts/identity_crosswalk.json \
            9ba70abae4f5f1946471b7cf3827db0a4c9cb7967b131c2c33d0073e692126eb

          check_blob scripts/projections/fourforfour_projection_pipeline.py \
            50dddd078eec10b955c29f3f5fab239b56f19438
          check_blob scripts/model/idp_v1_projection.py \
            d25c46243184d031651a80bda26cbdc05aa50419
          check_blob .github/workflows/fourforfour-idp-v1-phase2c.yml \
            1aa5c166ac7ca5de96cf2ee2591722775009dc29

          echo 'PASS: frozen Phase 2B inputs and green Phase 2C workflow are exact.'
          echo 'PHASE2B_METHOD_SHA256=f807a276cbe0be89f944a5ebacdc4143b592d3efc425a173f78030abff968c9f'
          echo 'PHASE2C_AUDIT_SHA256=0ec64c7e3cc54ac2279ac21f6f1baa48b18d0e873f45c88786e6cfcc7622dded'
          echo 'PHASE2D_SEMANTICS_SHA256=c4d2707a231917b15282b4599de91b4f32f14743b864cd341d1cb4184c3ad609'

      - name: Decode and verify private 4for4 inputs outside repository
        shell: bash
        run: |
          set -euo pipefail

          for var in FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret ${var} is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-fourforfour-idp-v1/input
          install -d -m 700 /tmp/log-fourforfour-idp-v1/output

          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-fourforfour-idp-v1/input/db.csv
          chmod 600 /tmp/log-fourforfour-idp-v1/input/*.csv

          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/db.csv | awk '{print $1}')" = \
            7bc8fb440f171bc65ab82e4c2cf1ed88e4b53a6f64868461ac8a96cb08d9b079
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/dl.csv | awk '{print $1}')" = \
            a8ae4a3dc3ed7e24e102e9416467826dd93441cc6b18c0589ed8345aeca977f6
          test "$(sha256sum /tmp/log-fourforfour-idp-v1/input/lb.csv | awk '{print $1}')" = \
            957e3c03b604302d259393d3cd3c637d03ff15b6a51812bb23cc0d10830a8321

          echo 'PASS: private 4for4 inputs match the frozen study source.'

      - name: Rebuild frozen private 4for4 normalized snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/fourforfour_projection_pipeline.py \
            --dl /tmp/log-fourforfour-idp-v1/input/dl.csv \
            --lb /tmp/log-fourforfour-idp-v1/input/lb.csv \
            --db /tmp/log-fourforfour-idp-v1/input/db.csv \
            --output-dir /tmp/log-fourforfour-idp-v1/output/private \
            --public-summary /tmp/log-fourforfour-idp-v1/output/aggregate-summary.json \
            > /tmp/log-fourforfour-idp-v1/output/pipeline.stdout.txt

      - name: Reuse green Phase 2C audit and freeze realized-stat semantics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/fourforfour-idp-v1-phase2c.yml').read_text(encoding='utf-8')
          match = re.search(
              r"cat > /tmp/fourforfour-phase2c\.py\.b64 <<'B64'\n(.*?)\n\s*B64",
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('ERROR: unable to extract frozen Phase 2C embedded audit script')
          payload = ''.join(line.strip() for line in match.group(1).splitlines())
          script = base64.b64decode(payload)
          Path('/tmp/fourforfour-phase2d.py').write_bytes(script)
          PY

          cat >> /tmp/fourforfour-phase2d.py <<'PY'

          # ------------------------------------------------------------------
          # Phase 2D: freeze realized defensive-stat and participation semantics.
          # Week 1 remains methodology-only. No provider predictions are compared
          # with outcomes and no candidate weight is selected or tuned here.
          # ------------------------------------------------------------------
          EXPECTED_PHASE2C_CONTRACT_FP = (
              '0ec64c7e3cc54ac2279ac21f6f1baa48b18d0e873f45c88786e6cfcc7622dded'
          )
          EXPECTED_PHASE2D_SEMANTICS_FP = (
              'c4d2707a231917b15282b4599de91b4f32f14743b864cd341d1cb4184c3ad609'
          )

          if phase2c_contract_fp != EXPECTED_PHASE2C_CONTRACT_FP:
              raise RuntimeError(
                  f'Phase 2C contract drifted: {phase2c_contract_fp}'
              )

          phase2d_contract = {
              'schema_version': 1,
              'study': 'fourforfour-idp-v1-phase2d-realized-stat-semantics-freeze',
              'parent_phase2b_methodology_fingerprint_sha256': EXPECTED_PHASE2B_METHOD_FP,
              'parent_phase2c_audit_contract_fingerprint_sha256': EXPECTED_PHASE2C_CONTRACT_FP,
              'audit_week': 1,
              'audit_week_usage': 'semantic_freeze_only_no_predictive_evaluation',
              'realized_stat_mapping': {
                  'solo_tackle_equivalent': [
                      'def_tackles_solo',
                      'def_tackles_with_assist',
                  ],
                  'assisted_tackle': 'def_tackle_assists',
                  'sack': 'def_sacks',
                  'tackle_for_loss': 'def_tackles_for_loss',
                  'qb_hit': 'def_qb_hits',
                  'interception': 'def_interceptions',
                  'pass_defended': 'def_pass_defended',
                  'forced_fumble': 'def_fumbles_forced',
                  'fumble_recovery': 'fumble_recovery_opp',
                  'safety': 'def_safeties',
                  'defensive_touchdown': 'def_tds',
              },
              'tackle_semantics_basis': (
                  'nflfastR_official_primary_tackle_equals_solo_plus_'
                  'tackle_with_assist_and_assist_is_def_tackle_assists'
              ),
              'fumble_recovery_semantics_basis': (
                  'defensive_recovery_is_opponent_fumble_recovery_only'
              ),
              'participation_rule': (
                  'include_if_positive_defensive_snaps_or_any_tracked_'
                  'defensive_outcome_nonzero'
              ),
              'missing_stats_row_rule': (
                  'if_positive_defensive_snaps_and_no_stats_row_impute_'
                  'all_tracked_defensive_outcomes_zero'
              ),
              'nonparticipant_rule': (
                  'exclude_if_no_positive_defensive_snaps_and_no_nonzero_'
                  'tracked_defensive_outcome'
              ),
              'unbridged_participation_rule': (
                  'stats_nonzero_can_establish_participation_without_pfr_'
                  'bridge_otherwise_exclude_unknown'
              ),
              'prohibited_week1_uses': [
                  'projection_accuracy_comparison',
                  'candidate_weight_tuning',
                  'candidate_selection',
              ],
              'calibration_weeks': [2, 3, 4, 5, 6],
              'holdout_weeks': [7, 8, 9, 10],
              'confirmation_weeks_if_needed': [11, 12, 13, 14],
          }
          phase2d_fp = canonical_hash(phase2d_contract)
          if phase2d_fp != EXPECTED_PHASE2D_SEMANTICS_FP:
              raise RuntimeError(
                  f'Phase 2D semantics fingerprint mismatch: {phase2d_fp}'
              )

          required_semantic_fields = {
              'def_tackles_solo',
              'def_tackles_with_assist',
              'def_tackle_assists',
              'def_tackles_for_loss',
              'def_fumbles_forced',
              'def_sacks',
              'def_qb_hits',
              'def_interceptions',
              'def_pass_defended',
              'def_tds',
              'def_safeties',
              'fumble_recovery_opp',
          }
          missing_semantic_fields = sorted(required_semantic_fields - set(stats_fields))
          if missing_semantic_fields:
              raise RuntimeError(
                  f'Phase 2D required realized-stat fields missing: '
                  f'{missing_semantic_fields}'
              )

          # Own-team fumble recoveries are intentionally excluded from IDP FR.
          if 'fumble_recovery_own' not in stats_fields:
              raise RuntimeError(
                  'Phase 2D requires own-recovery field to verify FR distinction'
              )

          tracked_outcome_fields = sorted(required_semantic_fields)

          def row_has_tracked_defensive_event(row):
              if not row:
                  return False
              for field in tracked_outcome_fields:
                  value = finite_number(row.get(field))
                  if value is not None and abs(value) > 1e-12:
                      return True
              return False

          participants = 0
          zero_imputed_stats_rows = 0
          excluded_nonparticipants = 0
          stats_established_participation_without_positive_snap = 0
          stats_rows_without_positive_snap_and_without_defensive_event = 0
          unresolved_participation_without_pfr_bridge = 0
          stats_rows_present = 0
          positive_snap_rows = 0

          primary_tackle_total = 0.0
          assisted_tackle_total = 0.0
          opponent_fumble_recovery_total = 0.0
          own_fumble_recovery_total = 0.0

          for gsis in cohort_gsis_set:
              stat_matches = week1_stats_by_gsis.get(gsis, [])
              stat_row = stat_matches[0] if stat_matches else None
              if stat_row is not None:
                  stats_rows_present += 1

              pfr = pfr_by_gsis.get(gsis)
              snap_matches = week1_snaps_by_pfr.get(pfr, []) if pfr else []
              defense_snaps = None
              if snap_matches:
                  defense_snaps = finite_number(snap_matches[0].get('defense_snaps'))
              positive_snap = defense_snaps is not None and defense_snaps > 0
              if positive_snap:
                  positive_snap_rows += 1

              has_defensive_event = row_has_tracked_defensive_event(stat_row)
              participant = positive_snap or has_defensive_event

              if participant:
                  participants += 1
                  if stat_row is None:
                      # Frozen rule: participation proven by defensive snaps means
                      # an absent weekly stat row represents zero tracked outcomes.
                      zero_imputed_stats_rows += 1
                  elif has_defensive_event and not positive_snap:
                      stats_established_participation_without_positive_snap += 1
              else:
                  excluded_nonparticipants += 1
                  if stat_row is not None:
                      stats_rows_without_positive_snap_and_without_defensive_event += 1
                  if pfr is None and stat_row is None:
                      unresolved_participation_without_pfr_bridge += 1

              if stat_row is not None:
                  primary_tackle_total += (
                      (finite_number(stat_row.get('def_tackles_solo')) or 0.0)
                      + (finite_number(stat_row.get('def_tackles_with_assist')) or 0.0)
                  )
                  assisted_tackle_total += (
                      finite_number(stat_row.get('def_tackle_assists')) or 0.0
                  )
                  opponent_fumble_recovery_total += (
                      finite_number(stat_row.get('fumble_recovery_opp')) or 0.0
                  )
                  own_fumble_recovery_total += (
                      finite_number(stat_row.get('fumble_recovery_own')) or 0.0
                  )

          if participants < 350:
              raise RuntimeError(
                  f'Phase 2D Week-1 participation cohort unexpectedly low: '
                  f'{participants}/439 resolved GSIS identities'
              )
          if zero_imputed_stats_rows > 75:
              raise RuntimeError(
                  f'Phase 2D zero-imputation diagnostic unexpectedly large: '
                  f'{zero_imputed_stats_rows}'
              )
          if len(pfr_by_gsis) / max(1, len(cohort_gsis_set)) < 0.95:
              raise RuntimeError(
                  'Phase 2D GSIS->PFR participation bridge fell below 95%'
              )

          phase2d_result = {
              'schema_version': 1,
              'study': 'fourforfour-idp-v1-phase2d-realized-stat-semantics-freeze',
              'status': 'PASS_REALIZED_STAT_SEMANTICS_FROZEN',
              'research_only': True,
              'production_changes': False,
              'phase2b_methodology_fingerprint_sha256': EXPECTED_PHASE2B_METHOD_FP,
              'phase2c_audit_contract_fingerprint_sha256': EXPECTED_PHASE2C_CONTRACT_FP,
              'phase2d_semantics_contract_fingerprint_sha256': phase2d_fp,
              'frozen_realized_stat_mapping': phase2d_contract['realized_stat_mapping'],
              'frozen_participation_contract': {
                  'participation_rule': phase2d_contract['participation_rule'],
                  'missing_stats_row_rule': phase2d_contract['missing_stats_row_rule'],
                  'nonparticipant_rule': phase2d_contract['nonparticipant_rule'],
                  'unbridged_participation_rule': phase2d_contract['unbridged_participation_rule'],
              },
              'week1_semantics_diagnostics': {
                  'resolved_gsis_identity_rows': len(cohort_gsis_set),
                  'gsis_to_pfr_unique_bridge_rows': len(pfr_by_gsis),
                  'stats_rows_present': stats_rows_present,
                  'positive_defensive_snap_rows': positive_snap_rows,
                  'included_participant_rows': participants,
                  'zero_imputed_positive_snap_no_stats_rows': zero_imputed_stats_rows,
                  'stats_event_participants_without_positive_snap': (
                      stats_established_participation_without_positive_snap
                  ),
                  'excluded_nonparticipant_rows': excluded_nonparticipants,
                  'stats_rows_excluded_no_snap_no_defensive_event': (
                      stats_rows_without_positive_snap_and_without_defensive_event
                  ),
                  'unbridged_no_stats_participation_unknown_rows': (
                      unresolved_participation_without_pfr_bridge
                  ),
                  'aggregate_primary_tackle_events': primary_tackle_total,
                  'aggregate_assisted_tackle_events': assisted_tackle_total,
                  'aggregate_opponent_fumble_recoveries': opponent_fumble_recovery_total,
                  'aggregate_own_fumble_recoveries_excluded_from_idp_fr': (
                      own_fumble_recovery_total
                  ),
              },
              'guardrails': {
                  'week1_used_for_predictive_evaluation': False,
                  'week1_used_for_candidate_weight_tuning': False,
                  'candidate_weight_selection_performed': False,
                  'performance_scoring_performed': False,
                  'future_week_outcomes_read': False,
                  'row_level_4for4_data_reported': False,
              },
              'next_gate': (
                  'implement frozen Week 2-6 prospective calibration scorer '
                  'without changing any outcome semantics'
              ),
          }

          assert_no_forbidden_keys(phase2d_result)
          phase2d_path = ROOT / 'phase2d-semantics-freeze.json'
          phase2d_path.write_text(
              json.dumps(phase2d_result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print('PASS: Phase 2D realized-stat semantics and participation rules frozen.')
          print(json.dumps(phase2d_result, indent=2, sort_keys=True))
          PY

          python3 -m py_compile /tmp/fourforfour-phase2d.py
          python3 /tmp/fourforfour-phase2d.py

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove Phase 2D made no repository changes
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- .; then
            echo 'ERROR: Phase 2D modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi

          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: Phase 2D staged repository changes.' >&2
            git diff --cached -- .
            exit 1
          fi

          echo 'PASS: Phase 2D and regressions left the repository unchanged.'

      - name: Destroy private inputs and row-level outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-fourforfour-idp-v1
          rm -f /tmp/fourforfour-phase2d.py
          echo 'PASS: private provider inputs and row-level outputs removed from runner.'
