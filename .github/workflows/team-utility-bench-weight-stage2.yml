name: Team Utility Bench Weight Stage 2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-utility-bench-weight-stage2
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Stage-2 synthetic self-test
        run: python3 research/team-utility/team_utility_bench_weight_stage2.py --selftest

      - name: Run 2026 roster decision-sensitivity audit
        run: python3 research/team-utility/team_utility_bench_weight_stage2.py --write

      - name: Verify deterministic Stage-2 outputs
        run: python3 research/team-utility/team_utility_bench_weight_stage2.py --check

      - name: Show Stage-2 report
        run: cat research/team-utility/team_utility_bench_weight_stage2.md

      - name: Validate diff
        run: |
          git diff --check
          git status --short

      - name: Commit Stage-2 outputs
        shell: bash
        run: |
          git config user.name "team-utility-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/team-utility/team_utility_bench_weight_stage2.json
          git add research/team-utility/team_utility_bench_weight_stage2.md

          if git diff --cached --quiet; then
            echo "Stage-2 outputs already current; nothing to commit."
          else
            git commit -m "Validate Team Utility bench weight"
            git push origin main
          fi
