    - name: Run 2018-2023 development LOYO only
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/phase1c-development"
        python3 "${RUNNER_TEMP}/dlf_phase1c_core.py" \
          --mode development \
          --repo-root "${GITHUB_WORKSPACE}" \
          --b4 "${RUNNER_TEMP}/phase1b4/dlf_prospect_fv_v1_phase1b4_temporal_implementation_freeze.json" \
          --out-dir "${RUNNER_TEMP}/phase1c-development"
    - name: Expose sealed confirmation unlock
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        RESULT="${RUNNER_TEMP}/phase1c-development/dlf_prospect_fv_v1_phase1c_development.json"
        test -f "$RESULT"
        PASS="$(python3 - "$RESULT" <<'PY'
        import json, sys
        d=json.load(open(sys.argv[1]))
        print("true" if d["confirmation_unlock"] is True else "false")
        PY
        )"
        echo "development_pass=${PASS}" >> "$GITHUB_OUTPUT"
        echo "development_pass=${PASS}"
    - name: Prove development made no repository changes
      if: always()
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: Phase 1C development is research-only and repo-clean.'
    - name: Upload development result and exact engine
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1c-development
        path: |-
          ${{ runner.temp }}/phase1c-development/
          ${{ runner.temp }}/dlf_phase1c_core.py
        if-no-files-found: warn
        retention-days: 14
  sealed-2024-confirmation:
    needs: development
    if: ${{ needs.development.outputs.development_pass == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install frozen research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.3.3' 'openpyxl==3.1.5' 'requests==2.34.2'
    - name: Guard frozen B4 and canonical outcome implementation
      shell: bash
      run: |
        set -euo pipefail
        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: frozen lineage drift for $path" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "PASS lineage $path $actual"
        }
        check_blob db96c7097ea7799359674b6afd96c7729a4b3a1d \
          .github/workflows/DLF-Prospect-FV-Phase-1B4-Temporal-Implementation-Freeze.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: frozen B4 and canonical rookie-prior implementation lineage are exact.'
    - name: Download exact Phase 1B4 artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1B4_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1b4
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1B4_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Download passing development artifact
      uses: actions/download-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1c-development
        path: ${{ runner.temp }}/dev-artifact
    - name: Verify exact Phase 1C engine and stage development result
      shell: bash
      run: |-
        set -euo pipefail
        test -f "${RUNNER_TEMP}/dev-artifact/dlf_phase1c_core.py"
        printf '%s  %s\n' "$PHASE1C_CORE_SHA256" "${RUNNER_TEMP}/dev-artifact/dlf_phase1c_core.py" | sha256sum --check --strict
        cp "${RUNNER_TEMP}/dev-artifact/dlf_phase1c_core.py" "${RUNNER_TEMP}/dlf_phase1c_core.py"
        mkdir -p "${RUNNER_TEMP}/phase1c-development"
        cp "${RUNNER_TEMP}/dev-artifact/phase1c-development/dlf_prospect_fv_v1_phase1c_development.json" "${RUNNER_TEMP}/phase1c-development/dlf_prospect_fv_v1_phase1c_development.json"
        python3 -m py_compile "${RUNNER_TEMP}/dlf_phase1c_core.py"
    - name: Open 2025 outcomes only after development unlock and test 2024
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/phase1c-confirmation"
        python3 "${RUNNER_TEMP}/dlf_phase1c_core.py" \
          --mode confirmation \
          --repo-root "${GITHUB_WORKSPACE}" \
          --b4 "${RUNNER_TEMP}/phase1b4/dlf_prospect_fv_v1_phase1b4_temporal_implementation_freeze.json" \
          --development "${RUNNER_TEMP}/phase1c-development/dlf_prospect_fv_v1_phase1c_development.json" \
          --out-dir "${RUNNER_TEMP}/phase1c-confirmation"
    - name: Prove confirmation made no repository changes
      if: always()
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: sealed confirmation is research-only and repo-clean.'
    - name: Upload sealed 2024 confirmation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1c-2024-confirmation
        path: ${{ runner.temp }}/phase1c-confirmation/
        if-no-files-found: warn
        retention-days: 14
