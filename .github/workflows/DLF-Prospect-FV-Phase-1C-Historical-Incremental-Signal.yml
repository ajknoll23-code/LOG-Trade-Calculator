name: DLF Prospect FV V1 - Phase 1C Historical Incremental Signal
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v1-phase1c-historical-incremental-signal
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE1B4_RUN_ID: '36087476448'
  PHASE1B4_ARTIFACT_ID: '10844446702'
  PHASE1B4_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1b4-temporal-implementation-freeze
  PHASE1B4_JSON_SHA256: f47eea49b6d2d494e042725acd8443d09e3de673224b389e9794ba26fb3f587d
  DLF_SEMANTIC_SHA256: 4dd07ea9180c11f7f3c80657dfe7274245a683fbb3b3eca2edb92c903c562414
  DLF_STRUCTURE_SHA256: 01e780ede9a21806e7f838ad735ee1c73f2f970766651b276aed9f6215769c10
  IDENTITY_SHA256: e8d79738530a73f15de0c52990e8f7fbf1e8d4f699448add0f5add11eaa093fb
  FEATURE_SHA256: afad7d90c7dfed050186c78c270f66b89d70749e627c458575fcfffdc25543b4
  DLF_WORKBOOK_URL: https://docs.google.com/spreadsheets/d/1fwDTd1WnlvPEPGVW8N3Z4zuA0Bft8whkMZTRbMvGDmM/export?format=xlsx
  NFLVERSE_PLAYERS_URL: https://github.com/nflverse/nflverse-data/releases/download/players/players.csv
  NFLVERSE_WEEKLY_TEMPLATE: https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_{season}.csv
  PHASE1C_CORE_SHA256: 03eec13db44c38c241fa303c46a8a4a116e0703b988a9db1cecca88592d31fe2
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      development_pass: ${{ steps.gate.outputs.development_pass }}
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install frozen research dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.3.3' 'openpyxl==3.1.5' 'requests==2.34.2'
    - name: Guard frozen B4 and canonical outcome implementation
      shell: bash
      run: |
        set -euo pipefail
        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: frozen lineage drift for $path" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "PASS lineage $path $actual"
        }
        check_blob db96c7097ea7799359674b6afd96c7729a4b3a1d \
          .github/workflows/DLF-Prospect-FV-Phase-1B4-Temporal-Implementation-Freeze.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: frozen B4 and canonical rookie-prior implementation lineage are exact.'
    - name: Download exact Phase 1B4 artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1B4_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1b4
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1B4_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Create verify and self-test frozen Phase 1C engine
      shell: bash
      run: "set -euo pipefail\ncat > \"${RUNNER_TEMP}/dlf_phase1c_core.py\" <<'PY'\n#!/usr/bin/env python3\nfrom __future__\
        \ import annotations\n\nimport argparse\nimport csv\nimport hashlib\nimport importlib.util\nimport io\nimport json\n\
        import math\nimport os\nimport re\nimport statistics\nimport time\nimport unicodedata\nfrom collections import Counter,\
        \ defaultdict\nfrom datetime import date, datetime, time as dtime, timezone\nfrom pathlib import Path\nfrom typing\
        \ import Any\n\nimport numpy as np\nimport openpyxl\nimport requests\n\n\nDEV_DRAFT_YEARS = tuple(range(2018, 2024))\n\
        CONFIRM_DRAFT_YEAR = 2024\nPOSITIONS = (\"QB\", \"RB\", \"WR\", \"TE\")\nRIDGE_ALPHA = 10.0\nEPS = 1e-12\nBOOTSTRAP_REPS\
        \ = 10_000\nBOOTSTRAP_SEED = 20260925\n\n\ndef sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\
        \n\ndef canonical_json_bytes(obj: Any) -> bytes:\n    return json.dumps(\n        obj,\n        sort_keys=True,\n\
        \        separators=(\",\", \":\"),\n        ensure_ascii=False,\n    ).encode(\"utf-8\")\n\n\ndef now_utc() -> str:\n\
        \    return datetime.now(timezone.utc).isoformat()\n\n\ndef clean(v: Any) -> str:\n    return \"\" if v is None else\
        \ str(v).strip()\n\n\ndef finite_or_none(v: Any) -> float | None:\n    if v is None or v == \"\" or isinstance(v,\
        \ bool):\n        return None\n    if isinstance(v, (int, float)):\n        x = float(v)\n        return x if math.isfinite(x)\
        \ else None\n    s = str(v).strip().replace(\",\", \"\").replace(\"%\", \"\")\n    try:\n        x = float(s)\n  \
        \  except ValueError:\n        return None\n    return x if math.isfinite(x) else None\n\n\ndef intish(v: Any) ->\
        \ int | None:\n    x = finite_or_none(v)\n    if x is None:\n        return None\n    n = int(round(x))\n    return\
        \ n if abs(x - n) < 1e-9 else None\n\n\ndef stable_scalar(v: Any):\n    if v is None:\n        return None\n    if\
        \ isinstance(v, bool):\n        return {\"t\": \"bool\", \"v\": v}\n    if isinstance(v, int):\n        return {\"\
        t\": \"int\", \"v\": str(v)}\n    if isinstance(v, float):\n        if not math.isfinite(v):\n            raise RuntimeError(f\"\
        non-finite workbook numeric value: {v!r}\")\n        if v == 0:\n            v = 0.0\n        return {\"t\": \"num\"\
        , \"v\": format(v, \".15g\")}\n    if isinstance(v, (datetime, date, dtime)):\n        return {\"t\": \"date\", \"\
        v\": v.isoformat()}\n    s = str(v).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n    return {\"\
        t\": \"str\", \"v\": s}\n\n\n# This intentionally reproduces the exact normalization used by the green\n# Phase 1B\
        \ identity freeze. Do not \"improve\" it inside Phase 1C.\ndef norm_name(value: Any) -> str:\n    s = unicodedata.normalize(\"\
        NFKD\", str(value or \"\"))\n    s = \"\".join(ch for ch in s if not unicodedata.combining(ch))\n    s = s.casefold().replace(\"\
        \u2019\", \"'\")\n    s = re.sub(r\"[^a-z0-9 ]+\", \" \", s)\n    toks = [t for t in s.split() if t]\n    while toks\
        \ and toks[-1] in {\"jr\", \"sr\", \"ii\", \"iii\", \"iv\", \"v\"}:\n        toks.pop()\n    return \" \".join(toks)\n\
        \n\ndef norm_pos(pos: Any, group: Any = \"\") -> str | None:\n    p = clean(pos).upper()\n    g = clean(group).upper()\n\
        \    if g in POSITIONS:\n        return g\n    if p in POSITIONS:\n        return p\n    return None\n\n\ndef load_module(repo_root:\
        \ Path):\n    path = repo_root / \"research\" / \"no-history-v2\" / \"no_history_v2_phase2_prospect_prior.py\"\n \
        \   spec = importlib.util.spec_from_file_location(\"nhv2\", path)\n    if spec is None or spec.loader is None:\n \
        \       raise RuntimeError(f\"cannot import canonical prospect-prior module: {path}\")\n    mod = importlib.util.module_from_spec(spec)\n\
        \    spec.loader.exec_module(mod)\n    if mod.METHOD_VERSION != \"no-history-rookie-v2-phase2-prospect-prior-v1\"\
        :\n        raise RuntimeError(f\"unexpected canonical method version: {mod.METHOD_VERSION}\")\n    return mod\n\n\n\
        def download_bytes(url: str, *, expect_zip: bool = False, attempts: int = 6) -> bytes:\n    last = None\n    for attempt\
        \ in range(1, attempts + 1):\n        try:\n            r = requests.get(\n                url,\n                timeout=(20,\
        \ 120),\n                allow_redirects=True,\n                headers={\n                    \"User-Agent\": \"\
        LOG-Trade-Calculator DLF FV research/1.0\",\n                    \"Cache-Control\": \"no-cache\",\n              \
        \      \"Pragma\": \"no-cache\",\n                },\n            )\n            r.raise_for_status()\n          \
        \  data = r.content\n            if len(data) < 1000:\n                raise RuntimeError(f\"download unexpectedly\
        \ small: {len(data)} bytes\")\n            if expect_zip and not data.startswith(b\"PK\"):\n                raise\
        \ RuntimeError(\n                    f\"expected XLSX/ZIP payload; content-type={r.headers.get('content-type')!r}\"\
        \n                )\n            return data\n        except Exception as exc:\n            last = exc\n         \
        \   if attempt == attempts:\n                raise\n            wait = min(30, 5 * attempt)\n            print(\n\
        \                f\"download attempt {attempt}/{attempts} failed: \"\n                f\"{type(exc).__name__}: {exc};\
        \ sleeping {wait}s\"\n            )\n            time.sleep(wait)\n    raise RuntimeError(last)\n\n\ndef inspect_workbook(path:\
        \ Path) -> dict[str, Any]:\n    raw = path.read_bytes()\n    if len(raw) < 10_000:\n        raise RuntimeError(f\"\
        DLF workbook unexpectedly small: {len(raw)} bytes\")\n    if not raw.startswith(b\"PK\"):\n        raise RuntimeError(\"\
        DLF workbook is not XLSX/ZIP\")\n\n    wb = openpyxl.load_workbook(path, read_only=True, data_only=True)\n    semantic_sheets\
        \ = []\n    sheet_reports = []\n    all_positions = Counter()\n    all_years = Counter()\n    total_rows = 0\n\n \
        \   for ws in wb.worksheets:\n        preview = []\n        for row in ws.iter_rows(\n            min_row=1,\n   \
        \         max_row=min(ws.max_row or 15, 15),\n            values_only=True,\n        ):\n            preview.append(list(row))\n\
        \n        header_row = None\n        raw_headers = None\n        for i, row in enumerate(preview, 1):\n          \
        \  texts = [clean(v) for v in row]\n            if {\"Year\", \"Position\", \"Player\"}.issubset(set(texts)):\n  \
        \              header_row = i\n                raw_headers = texts\n                break\n\n        if header_row\
        \ is None or raw_headers is None:\n            sheet_reports.append({\n                \"sheet\": ws.title,\n    \
        \            \"relevant\": False,\n                \"reason\": \"no Year/Position/Player header in first 15 rows\"\
        ,\n            })\n            continue\n\n        last_named = max(i for i, h in enumerate(raw_headers) if h)\n \
        \       headers = raw_headers[: last_named + 1]\n        named = [h for h in headers if h]\n        if len(named)\
        \ != len(set(named)):\n            raise RuntimeError(f\"{ws.title}: duplicate named headers detected\")\n\n     \
        \   index = {h: i for i, h in enumerate(headers) if h}\n        for required in (\"Year\", \"Position\", \"Player\"\
        ):\n            if required not in index:\n                raise RuntimeError(f\"{ws.title}: missing required header\
        \ {required}\")\n\n        semantic_rows = []\n        pos_counts = Counter()\n        year_counts = Counter()\n\n\
        \        for values in ws.iter_rows(min_row=header_row + 1, values_only=True):\n            vals = list(values[: len(headers)])\n\
        \            if len(vals) < len(headers):\n                vals += [None] * (len(headers) - len(vals))\n\n       \
        \     year = intish(vals[index[\"Year\"]])\n            player = clean(vals[index[\"Player\"]])\n            position\
        \ = clean(vals[index[\"Position\"]]).upper()\n            if year is None or not player:\n                continue\n\
        \n            semantic_rows.append([stable_scalar(v) for v in vals])\n            pos_counts[position] += 1\n    \
        \        year_counts[year] += 1\n\n        if not semantic_rows:\n            raise RuntimeError(f\"{ws.title}: prospect\
        \ header found but zero rows\")\n\n        semantic_sheets.append({\n            \"sheet\": ws.title,\n          \
        \  \"header_row\": header_row,\n            \"headers\": headers,\n            \"rows\": semantic_rows,\n        })\n\
        \        sheet_reports.append({\n            \"sheet\": ws.title,\n            \"relevant\": True,\n            \"\
        header_row\": header_row,\n            \"row_count\": len(semantic_rows),\n            \"year_min\": min(year_counts),\n\
        \            \"year_max\": max(year_counts),\n            \"year_counts\": dict(sorted(year_counts.items())),\n  \
        \          \"position_counts\": dict(sorted(pos_counts.items())),\n            \"column_count\": len(named),\n   \
        \         \"columns\": named,\n        })\n        total_rows += len(semantic_rows)\n        all_positions.update(pos_counts)\n\
        \        all_years.update(year_counts)\n\n    if not semantic_sheets:\n        raise RuntimeError(\"no relevant DLF\
        \ prospect sheets discovered\")\n\n    semantic_payload = {\n        \"format_version\": 1,\n        \"relevant_sheets_in_workbook_order\"\
        : semantic_sheets,\n    }\n    structure = {\n        \"worksheet_names\": wb.sheetnames,\n        \"relevant_sheet_count\"\
        : len(semantic_sheets),\n        \"prospect_row_count_across_relevant_sheets\": total_rows,\n        \"position_counts_across_relevant_sheets\"\
        : dict(sorted(all_positions.items())),\n        \"year_min\": min(all_years),\n        \"year_max\": max(all_years),\n\
        \        \"sheets\": sheet_reports,\n    }\n    return {\n        \"raw_sha256\": sha256_bytes(raw),\n        \"semantic_sha256\"\
        : sha256_bytes(canonical_json_bytes(semantic_payload)),\n        \"structure_sha256\": sha256_bytes(canonical_json_bytes(structure)),\n\
        \        \"structure\": structure,\n    }\n\n\ndef verify_b4(path: Path) -> dict[str, Any]:\n    raw = path.read_bytes()\n\
        \    expected_sha = os.environ[\"PHASE1B4_JSON_SHA256\"]\n    actual = sha256_bytes(raw)\n    if actual != expected_sha:\n\
        \        raise RuntimeError(\n            f\"Phase 1B4 artifact SHA mismatch: expected={expected_sha} actual={actual}\"\
        \n        )\n    b4 = json.loads(raw)\n    if b4[\"decision\"] != \"FREEZE_TEMPORALLY_CLEAN_PHASE1C_IMPLEMENTATION_NO_OUTCOMES_READ\"\
        :\n        raise RuntimeError(\"Phase 1B4 decision mismatch\")\n\n    lineage = b4[\"lineage\"]\n    if lineage[\"\
        dlf_semantic_sha256\"] != os.environ[\"DLF_SEMANTIC_SHA256\"]:\n        raise RuntimeError(\"B4 DLF semantic lineage\
        \ mismatch\")\n    if lineage[\"dlf_structure_sha256\"] != os.environ[\"DLF_STRUCTURE_SHA256\"]:\n        raise RuntimeError(\"\
        B4 DLF structure lineage mismatch\")\n    if lineage[\"mapped_identity_sha256\"] != os.environ[\"IDENTITY_SHA256\"\
        ]:\n        raise RuntimeError(\"B4 identity lineage mismatch\")\n    if lineage[\"corrected_feature_freeze_sha256\"\
        ] != os.environ[\"FEATURE_SHA256\"]:\n        raise RuntimeError(\"B4 feature lineage mismatch\")\n\n    fw = b4[\"\
        firewalls\"]\n    for key in (\n        \"nfl_outcomes_read\",\n        \"nfl_2025_outcomes_read\",\n        \"model_fit_performed\"\
        ,\n        \"outcome_based_feature_selection_performed\",\n        \"production_change_authorized\",\n    ):\n   \
        \     if fw[key] is not False:\n            raise RuntimeError(f\"B4 firewall violated before Phase 1C: {key}\")\n\
        \n    c = b4[\"corrected_preregistration\"]\n    if c[\"development_draft_years\"] != list(DEV_DRAFT_YEARS):\n   \
        \     raise RuntimeError(\"B4 development draft-year contract mismatch\")\n    if c[\"sealed_temporal_confirmation\"\
        ][\"draft_year\"] != CONFIRM_DRAFT_YEAR:\n        raise RuntimeError(\"B4 confirmation year mismatch\")\n    if c[\"\
        candidate_implementation\"][\"ridge\"][\"alpha\"] != RIDGE_ALPHA:\n        raise RuntimeError(\"B4 ridge alpha mismatch\"\
        )\n    if c[\"candidate_implementation\"][\"ridge\"][\"fit_intercept\"] is not False:\n        raise RuntimeError(\"\
        B4 ridge intercept contract mismatch\")\n    return b4\n\n\ndef parse_dlf_rows(workbook_path: Path) -> list[dict[str,\
        \ Any]]:\n    wb = openpyxl.load_workbook(workbook_path, read_only=True, data_only=True)\n    rows = []\n\n    for\
        \ pos in POSITIONS:\n        if pos not in wb.sheetnames:\n            raise RuntimeError(f\"missing DLF sheet {pos}\"\
        )\n        ws = wb[pos]\n\n        header_row = None\n        headers = None\n        for ri, values in enumerate(\n\
        \            ws.iter_rows(min_row=1, max_row=min(ws.max_row or 15, 15), values_only=True),\n            1,\n     \
        \   ):\n            hs = [clean(v) for v in values]\n            if {\"Year\", \"Position\", \"Player\"}.issubset(set(hs)):\n\
        \                header_row = ri\n                headers = hs\n                break\n        if header_row is None\
        \ or headers is None:\n            raise RuntimeError(f\"{pos}: unable to locate DLF header\")\n\n        last_named\
        \ = max(i for i, h in enumerate(headers) if h)\n        headers = headers[: last_named + 1]\n        index = {h: i\
        \ for i, h in enumerate(headers) if h}\n        for required in (\"Year\", \"Position\", \"Player\", \"DOB\", \"Round\"\
        , \"Overall\"):\n            if required not in index:\n                raise RuntimeError(f\"{pos}: missing identity\
        \ field {required}\")\n\n        for values in ws.iter_rows(min_row=header_row + 1, values_only=True):\n         \
        \   vals = list(values[: len(headers)])\n            if len(vals) < len(headers):\n                vals += [None]\
        \ * (len(headers) - len(vals))\n\n            year = intish(vals[index[\"Year\"]])\n            player = clean(vals[index[\"\
        Player\"]])\n            row_pos = clean(vals[index[\"Position\"]]).upper()\n            if year is None or not player\
        \ or row_pos != pos:\n                continue\n\n            rows.append({\n                \"year\": year,\n   \
        \             \"pos\": pos,\n                \"player\": player,\n                \"norm\": norm_name(player),\n \
        \               \"dob\": clean(vals[index[\"DOB\"]])[:10],\n                \"pick\": intish(vals[index[\"Overall\"\
        ]]),\n                \"round\": intish(vals[index[\"Round\"]]),\n                \"values\": {\n                \
        \    h: vals[i] if i < len(vals) else None\n                    for h, i in index.items()\n                },\n  \
        \          })\n\n    return rows\n\n\ndef build_identity_indexes(nfl_rows: list[dict[str, Any]]):\n    exact = defaultdict(list)\n\
        \    by_dob = defaultdict(list)\n    by_name = defaultdict(list)\n\n    for r in nfl_rows:\n        year = intish(r.get(\"\
        draft_year\"))\n        pick = intish(r.get(\"draft_pick\"))\n        pos = norm_pos(r.get(\"position\"), r.get(\"\
        position_group\"))\n        name = clean(r.get(\"display_name\"))\n        gsis = clean(r.get(\"gsis_id\"))\n    \
        \    if year is None or pick is None or pos not in POSITIONS or not name or not gsis:\n            continue\n\n  \
        \      rec = {\n            \"gsis_id\": gsis,\n            \"norm\": norm_name(name),\n            \"year\": year,\n\
        \            \"pos\": pos,\n            \"pick\": pick,\n            \"dob\": clean(r.get(\"birth_date\"))[:10],\n\
        \        }\n        exact[(rec[\"norm\"], year, pos, pick)].append(rec)\n        by_name[(rec[\"norm\"], year, pos)].append(rec)\n\
        \        if rec[\"dob\"]:\n            by_dob[(rec[\"dob\"], year, pos, pick)].append(rec)\n\n    return exact, by_dob,\
        \ by_name\n\n\ndef resolve_id(row, exact, by_dob, by_name):\n    key = (row[\"norm\"], row[\"year\"], row[\"pos\"\
        ], row[\"pick\"])\n    cands = exact.get(key, [])\n    if len(cands) == 1:\n        return cands[0], \"name_year_pos_pick\"\
        , False\n    if len(cands) > 1:\n        return None, None, True\n\n    if row[\"dob\"]:\n        cands = by_dob.get((row[\"\
        dob\"], row[\"year\"], row[\"pos\"], row[\"pick\"]), [])\n        if len(cands) == 1:\n            return cands[0],\
        \ \"dob_year_pos_pick\", False\n        if len(cands) > 1:\n            return None, None, True\n\n    cands = by_name.get((row[\"\
        norm\"], row[\"year\"], row[\"pos\"]), [])\n    agreeing = [c for c in cands if c[\"pick\"] == row[\"pick\"]]\n  \
        \  if len(agreeing) == 1:\n        return agreeing[0], \"name_year_pos_unique_with_pick_agreement\", False\n    if\
        \ len(agreeing) > 1:\n        return None, None, True\n    return None, None, False\n\n\ndef reconstruct_frozen_identity(\n\
        \    dlf_rows: list[dict[str, Any]],\n    nfl_rows: list[dict[str, Any]],\n) -> list[dict[str, Any]]:\n    exact,\
        \ by_dob, by_name = build_identity_indexes(nfl_rows)\n\n    hist = [\n        r for r in dlf_rows\n        if 2018\
        \ <= r[\"year\"] <= 2024\n        and r[\"pick\"] is not None\n        and 1 <= r[\"pick\"] <= 300\n    ]\n    mapped\
        \ = []\n    ambiguous = []\n    unresolved = []\n\n    for r in hist:\n        chosen, method, is_ambiguous = resolve_id(r,\
        \ exact, by_dob, by_name)\n        if is_ambiguous:\n            ambiguous.append(r)\n            continue\n     \
        \   if chosen is None:\n            unresolved.append(r)\n            continue\n        mapped.append({\n        \
        \    **r,\n            \"gsis_id\": chosen[\"gsis_id\"],\n            \"match_method\": method,\n        })\n\n  \
        \  if len(mapped) != 505 or len(ambiguous) != 0:\n        raise RuntimeError(\n            f\"frozen identity reconstruction\
        \ changed: mapped={len(mapped)} \"\n            f\"ambiguous={len(ambiguous)} unresolved={len(unresolved)}\"\n   \
        \     )\n\n    lines = sorted(\n        f\"{r['year']}|{r['pos']}|{r['pick']}|{r['gsis_id']}\"\n        for r in mapped\n\
        \    )\n    identity_sha = sha256_bytes((\"\\n\".join(lines) + \"\\n\").encode())\n    if identity_sha != os.environ[\"\
        IDENTITY_SHA256\"]:\n        raise RuntimeError(\n            f\"frozen identity SHA mismatch: expected={os.environ['IDENTITY_SHA256']}\
        \ \"\n            f\"actual={identity_sha}\"\n        )\n    return mapped\n\n\ndef read_csv_bytes(data: bytes) ->\
        \ list[dict[str, str]]:\n    text = data.decode(\"utf-8-sig\")\n    rows = list(csv.DictReader(io.StringIO(text)))\n\
        \    if not rows:\n        raise RuntimeError(\"downloaded CSV contained zero rows\")\n    return rows\n\n\ndef fit_feature_transform(\n\
        \    train_rows: list[dict[str, Any]],\n    features: list[str],\n) -> dict[str, Any]:\n    transform = {\"features\"\
        : [], \"active_columns\": []}\n\n    for f in features:\n        raw = [finite_or_none(r[\"dlf_values\"].get(f)) for\
        \ r in train_rows]\n        present = [x for x in raw if x is not None]\n        if not present:\n            raise\
        \ RuntimeError(f\"frozen primary feature has no training observations: {f}\")\n\n        med = float(statistics.median(present))\n\
        \        imputed = np.asarray([med if x is None else float(x) for x in raw], dtype=float)\n        miss = np.asarray([1.0\
        \ if x is None else 0.0 for x in raw], dtype=float)\n\n        value_mean = float(np.mean(imputed))\n        value_std\
        \ = float(np.std(imputed))\n        miss_mean = float(np.mean(miss))\n        miss_std = float(np.std(miss))\n\n \
        \       spec = {\n            \"feature\": f,\n            \"median\": med,\n            \"value_mean\": value_mean,\n\
        \            \"value_std\": value_std,\n            \"missing_mean\": miss_mean,\n            \"missing_std\": miss_std,\n\
