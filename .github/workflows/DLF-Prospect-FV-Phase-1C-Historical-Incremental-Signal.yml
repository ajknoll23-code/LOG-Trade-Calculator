        ]:\n        f = spec[\"feature\"]\n        raw = [finite_or_none(r[\"dlf_values\"].get(f)) for r in rows]\n      \
        \  imputed = np.asarray(\n            [spec[\"median\"] if x is None else float(x) for x in raw],\n            dtype=float,\n\
        \        )\n        miss = np.asarray([1.0 if x is None else 0.0 for x in raw], dtype=float)\n\n        if spec[\"\
