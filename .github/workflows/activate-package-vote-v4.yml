name: Activate Package Voting V4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: pip install requests numpy

      - name: Write Package Voting V4 research code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          files = {
              "research/package-adjustment-v4/generate_package_vote_challenges_v4.py": "",
              "scripts/market/package_vote_v4_pipeline.py": "",
              "scripts/market/package_vote_v4_fit_diagnostics.py": "",
          }

          for path, encoded in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))
              print("Wrote", p)
          PY

      - name: Compile and self-test V4 code
        run: |
          python3 -m py_compile research/package-adjustment-v4/generate_package_vote_challenges_v4.py
          python3 -m py_compile scripts/market/package_vote_v4_pipeline.py
          python3 -m py_compile scripts/market/package_vote_v4_fit_diagnostics.py
          python3 research/package-adjustment-v4/generate_package_vote_challenges_v4.py --selftest
          python3 scripts/market/package_vote_v4_pipeline.py --selftest
          python3 scripts/market/package_vote_v4_fit_diagnostics.py --selftest

      - name: Freeze V4 three-player extension catalog
        run: python3 research/package-adjustment-v4/generate_package_vote_challenges_v4.py

      - name: Switch browser package voting from V3 to V4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "/* Package Preference Voting V3: indifference calibration; shared transport only. */",
                  "/* Package Preference Voting V4: 3-player indifference extension; shared transport only. */",
                  1,
              ),
              (
                  "research/package-adjustment-v3/package_vote_challenges_v3.json",
                  "research/package-adjustment-v4/package_vote_challenges_v4.json",
                  1,
              ),
              ("'package_votes_v3_'", "'package_votes_v4_'", 1),
              ("'package_vote_recent_v3'", "'package_vote_recent_v4'", 3),
              (
                  "doc.status !== 'frozen_package_preference_v3'",
                  "doc.status !== 'frozen_package_preference_v4'",
                  1,
              ),
              ("doc.challenges.length < 140", "doc.challenges.length < 70", 1),
              (
                  "keep: `__pkgv3__|${id}|${choice}`",
                  "keep: `__pkgv4__|${id}|${choice}`",
                  1,
              ),
              (
                  "trade: `__pkgv3_meta__|${left}`",
                  "trade: `__pkgv4_meta__|${left}`",
                  1,
              ),
              ("cut: '__pkgv3_schema__|3'", "cut: '__pkgv4_schema__|4'", 1),
          ]

          for old, new, expected_count in replacements:
              count = text.count(old)
              if count != expected_count:
                  raise RuntimeError(
                      f"index patch expected {expected_count} occurrence(s) of {old!r}, found {count}"
                  )
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          print("Switched Trade Package Voting UI to V4.")
          PY

      - name: Isolate V4 rows from normal KTC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/market/ktc_pipeline.py")
          text = path.read_text(encoding="utf-8")

          old = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|")'
          new = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|")'
          if text.count(old) != 1:
              raise RuntimeError("unexpected PACKAGE_VOTE_PREFIXES declaration")
          text = text.replace(old, new, 1)

          old_comment = "# Package Preference Voting V1/V2/V3 shares transport only. Remove all"
          if old_comment in text:
              text = text.replace(
                  old_comment,
                  "# Package Preference Voting V1/V2/V3/V4 shares transport only. Remove all",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("Added V4 KTC transport isolation.")
          PY

      - name: Verify KTC isolation self-test
        run: python3 scripts/market/ktc_pipeline.py --selftest

      - name: Initialize V4 aggregation outputs
        run: python3 scripts/market/package_vote_v4_pipeline.py

      - name: Verify V4 activation contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(
              Path("research/package-adjustment-v4/package_vote_challenges_v4.json").read_text()
          )
          assert catalog["status"] == "frozen_package_preference_v4"
          assert catalog["frozen"] is True
          assert catalog["consumer_changed"] is False
          assert catalog["production_formula_enabled"] is False
          assert len(catalog["challenges"]) >= 70
          assert catalog["catalog_diagnostics"]["target_count"] >= 14
          assert set(map(float, catalog["design"]["ratio_targets"])) == {1.75, 1.85, 1.95, 2.05, 2.15}
          assert catalog["design"]["package_sizes"] == [3]
          assert abs(float(catalog["design"]["v3_overlap_ratio"]) - 1.85) < 1e-9

          by_target = {}
          for c in catalog["challenges"]:
              by_target.setdefault(c["target"]["key"], []).append(c)
              assert int(c["package_size"]) == 3
              assert len(c["package"]) == 3
              assert all(float(p["fv"]) < float(c["target_fv"]) for p in c["package"])
          for target, rows in by_target.items():
              assert len(rows) == 5, (target, len(rows))

          result = json.loads(
              Path("research/package-adjustment-v4/package_vote_v4_results.json").read_text()
          )
          assert result["status"] == "research_only"
          assert result["consumer_changed"] is False
          assert result["market_value_consumer_changed"] is False
          assert result["fundamental_value_consumer_changed"] is False
          assert result["team_utility_consumer_changed"] is False
          assert result["package_adjustment_shadow_v1_consumer_changed"] is False
          assert result["production_formula_enabled"] is False
          assert result["summary"]["raw_vote_count"] == 0

          index = Path("index.html").read_text()
          assert "package-adjustment-v4/package_vote_challenges_v4.json" in index
          assert "__pkgv4__|${id}|${choice}" in index
          assert "__pkgv4_meta__|${left}" in index
          assert "__pkgv4_schema__|4" in index
          assert "package_votes_v4_" in index
          assert "package_vote_recent_v4" in index
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in index

          ktc = Path("scripts/market/ktc_pipeline.py").read_text()
          for marker in ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|"):
              assert f'"{marker}"' in ktc

          shadow = json.loads(
              Path("research/package-adjustment-shadow-v1/package_adjustment_shadow_v1.json").read_text()
          )
          assert shadow["status"] == "research_only_shadow"
          assert shadow["consumer_changed"] is False
          assert shadow["trade_verdict_consumer_changed"] is False

          print("Package Voting V4 activation contract verified.")
          print("Challenges:", len(catalog["challenges"]))
          print("Targets:", catalog["catalog_diagnostics"]["target_count"])
          print("Ratio counts:", catalog["catalog_diagnostics"]["ratio_counts"])
          PY

      - name: Commit V4 activation
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v4/
          git add scripts/market/package_vote_v4_pipeline.py
          git add scripts/market/package_vote_v4_fit_diagnostics.py
          git add scripts/market/ktc_pipeline.py
          git add index.html

          if git diff --cached --quiet; then
            echo "No V4 activation changes."
            exit 0
          fi

          git commit -m "Activate Package Voting V4 three-player extension"
          git pull --rebase origin main
          git push origin main
