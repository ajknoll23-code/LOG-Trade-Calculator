name: Package Adjustment V4 - Phase 3B Confirmation Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard frozen V4 evidence and exact source snapshot
        shell: bash
        run: |
          set -euo pipefail

          V4="research/package-adjustment-v4-elite-fragmentation"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V4/package_adjustment_v4_phase3b_catalog.py")" = "563c0c0bb5c73927fc1da0b4d11dc581a82183b9"
          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase2_manifest.json")" = "ecc8e34baf909ead4cfafb24f90617c96de66b39"
          test "$(git hash-object "$V4/phase3a_signal_feasibility.json")" = "020561dd0dabf4ea11bb7895945ea8c4a7b0f7ce"
          test "$(git hash-object "$V4/phase3a_signal_feasibility_manifest.json")" = "53a4bdf4068bd1eba8d27a0afc43c758edab190b"

          test "$(git hash-object index.html)" = "52e1ee216eaf03e06723080f307e4f0086565264"
          test "$(git hash-object data/league_rosters.json)" = "6eb6ccc8b81119c6a9dde6b1f66f6c18946e423a"
          test "$(git hash-object data/trade_history.json)" = "69f78b30cd475aa9736e643e68bf5045e53a708d"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py)" = "d58c8802c1133a97bae0ae0903dc421f27265b58"
          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase1.py)" = "fccf42fc8fd98aae3bd03653d0ac591e535147ea"

          test ! -e "$V4/phase3b_confirmation_catalog.json"
          test ! -e "$V4/phase3b_confirmation_catalog.md"
          test ! -e "$V4/phase3b_confirmation_catalog_manifest.json"

      - name: Verify production remains V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test frozen catalog generator
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3b_catalog.py --selftest

      - name: Generate frozen unreleased V4 catalog
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3b_catalog.py --generate

      - name: Verify exact catalog contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          doc = json.loads((d / "phase3b_confirmation_catalog.json").read_text())
          manifest = json.loads((d / "phase3b_confirmation_catalog_manifest.json").read_text())

          assert doc["status"] == "frozen_unreleased_fresh_confirmation_catalog"
          assert doc["frozen"] is True
          assert doc["released"] is False
          assert doc["voting_activated"] is False
          assert doc["research_only"] is True
          assert doc["production_formula_enabled"] is False
          assert doc["production_revision_retained"] == "v1.6-v5-size2-composition-overlay"
          assert doc["vote_namespace_reserved"] == "__pkgv4c1__"
          assert doc["human_vote_outcomes_read"] is False
          assert doc["old_v3_600_vote_dataset_read"] is False
          assert len(doc["challenges"]) == 240

          cells = Counter(c["research_cell"] for c in doc["challenges"])
          assert len(cells) == 24
          assert set(cells.values()) == {10}

          topology = Counter(c["topology"] for c in doc["challenges"])
          mix = Counter(c["asset_mix"] for c in doc["challenges"])
          strata = Counter(c["challenge_stratum"] for c in doc["challenges"])
          assert set(topology.values()) == {40}
          assert mix == Counter({"players_only": 120, "includes_picks": 120})
          assert strata == Counter({
              "candidate_vs_raw_disagreement": 120,
              "balanced_broad": 120,
          })

          diag = doc["catalog_diagnostics"]
          assert diag["known_ktc_examples_in_selected_catalog"] == 0
          assert diag["historical_trade_matches_in_selected_catalog"] == 0
          assert diag["joe_mixon_occurrences"] == 0
          assert diag["invalid_pick_year_occurrences"] == 0

          for c in doc["challenges"]:
              assert 0.80 <= float(c["raw_side_total_ratio"]) <= 1.25
              assert c["topology"] in {"1v2","1v3","2v2","2v3","3v3","3v4"}
              assert c["asset_mix"] in {"players_only","includes_picks"}
              assert c["challenge_stratum"] in {
                  "candidate_vs_raw_disagreement","balanced_broad"
              }
              for a in c["side_a"] + c["side_b"]:
                  assert a["name"].casefold() != "joe mixon"
                  if a["kind"] == "pick":
                      assert int(a["year"]) in {2027, 2028}

          assert manifest["frozen"] is True
          assert manifest["released"] is False
          assert manifest["voting_activated"] is False
          assert manifest["human_vote_outcomes_read"] is False
          assert manifest["production_change_authorized"] is False

          print("PASS: exact frozen 240-challenge V4 catalog contract verified.")
          PY

      - name: Run repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after catalog freeze
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed Phase 3A and 3B workflows from active Actions
        shell: bash
        run: |
          set -euo pipefail
          git rm             .github/workflows/package-adjustment-v4-phase3a-signal-feasibility.yml             .github/workflows/package-adjustment-v4-phase3b-confirmation-catalog.yml
          echo "PASS: completed V4 Phase 3A/3B workflows removed from active Actions."

      - name: Stage exact V4 Phase 3B scope
        shell: bash
        run: |
          set -euo pipefail

          V4="research/package-adjustment-v4-elite-fragmentation"
          git add             "$V4/phase3b_confirmation_catalog.json"             "$V4/phase3b_confirmation_catalog.md"             "$V4/phase3b_confirmation_catalog_manifest.json"

          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v4-elite-fragmentation/phase3b_confirmation_catalog.json",
              "research/package-adjustment-v4-elite-fragmentation/phase3b_confirmation_catalog.md",
              "research/package-adjustment-v4-elite-fragmentation/phase3b_confirmation_catalog_manifest.json",
              ".github/workflows/package-adjustment-v4-phase3a-signal-feasibility.yml",
              ".github/workflows/package-adjustment-v4-phase3b-confirmation-catalog.yml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Unexpected V4 Phase 3B scope: {sorted(changed)}")
          print("PASS: exact five-file V4 Phase 3B catalog/cleanup scope staged.")
          PY

      - name: Commit frozen unreleased V4 catalog
        shell: bash
        run: |
          set -euo pipefail

          V4="research/package-adjustment-v4-elite-fragmentation"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Freeze Package Adjustment V4 confirmation catalog"
          git pull --rebase origin main

          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase3a_signal_feasibility.json")" = "020561dd0dabf4ea11bb7895945ea8c4a7b0f7ce"
          test ! -e .github/workflows/package-adjustment-v4-phase3a-signal-feasibility.yml
          test ! -e .github/workflows/package-adjustment-v4-phase3b-confirmation-catalog.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "V4_PHASE3B_STATUS=frozen_unreleased_fresh_confirmation_catalog"
          git log --oneline -1
