name: Durability V2 Phase 1 Availability Audit

# Research-only historical availability audit.
# Does not change deployed durability, production history, or player values.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  availability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Phase 1 self-test
        run: python3 research/durability-v2/durability_v2_phase1_availability_audit.py --selftest

      - name: Build Durability V2 Phase 1 audit
        run: python3 research/durability-v2/durability_v2_phase1_availability_audit.py --write

      - name: Verify Phase 1 outputs
        run: python3 research/durability-v2/durability_v2_phase1_availability_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/durability-v2/durability_v2_phase1_availability_audit.json
          git add research/durability-v2/durability_v2_phase1_availability_audit.md
          git diff --staged --quiet || git commit -m "Add Durability V2 Phase 1 availability audit"
          git push
