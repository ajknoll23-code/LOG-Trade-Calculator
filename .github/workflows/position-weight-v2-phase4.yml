name: Position Weight V2 Phase 4 Current-Board Shadow

# Research-only POSITION_WEIGHT blast-radius audit.
# Shadows 50%, 75%, and 100% bridges toward the Phase-3 empirical candidate.
# All other valuation inputs and all frozen prospective experiments remain fixed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  current-board-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 4 self-test
        run: python3 research/position-weight-v2/position_weight_v2_phase4_current_board_shadow.py --selftest

      - name: Build Phase 4 current-board shadow
        run: python3 research/position-weight-v2/position_weight_v2_phase4_current_board_shadow.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/position-weight-v2/position_weight_v2_phase4_current_board_shadow.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/position-weight-v2/position_weight_v2_phase4_current_board_shadow.json
          git add research/position-weight-v2/position_weight_v2_phase4_current_board_shadow.md
          git diff --staged --quiet || git commit -m "Add Position Weight V2 Phase 4 current-board shadow"
          git push
