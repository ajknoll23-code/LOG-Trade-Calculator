    - name: Archive V24 synthetic-only QC matrix for owner review (7 days)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v24-RESEARCH-ONLY-synthetic-pilot-qc
        path: /tmp/qf11-v24-output/RESEARCH_ONLY_v24_*
        retention-days: 7
        if-no-files-found: error
