name: QF11 V24 - Synthetic Pilot Assignment and Critical Stop Independent QC (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V24_INPUT: /tmp/qf11-v24-input
  QF11_V24_OUTPUT: /tmp/qf11-v24-output
jobs:
  synthetic_qc:
    name: SHA-verify V23 and exercise 12 synthetic allocations and fail-closed pilot logic
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin protected frozen inputs while only observing the mutable Sleeper cache
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V24_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V24_PROTECTED_SOURCE_PINS_GREEN

        '
    - name: Download exact QF11 V23 Green approved-amendment evidence
      uses: actions/download-artifact@v4
      with:
        name: QF11-v23-RESEARCH-ONLY-approved-amendment-QC
        run-id: 38325685955
        github-token: ${{ github.token }}
        path: /tmp/qf11-v24-input
    - name: SHA-pin V23 protocol and run synthetic 12-response failure-mode harness
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v24-output\ncat > /tmp/qf11-v24-harness.py <<'QF11_V24_SOURCE'\n#!/usr/bin/env python3\n\"\"\
        \"QF11 V24: evidence-pinned research-only synthetic pilot instrument QA.\n\nNo communication, network, recruitment, sampling of human\
        \ data, project file edits,\nmarket promotion, consent capture, votes or real respondent assignment.\n\"\"\"\nfrom __future__ import annotations\n\
        \nfrom collections import Counter\nimport hashlib\nimport itertools\nimport json\nimport os\nfrom pathlib import Path\nimport random\n\
        \nINPUT = Path(os.environ.get('QF11_V24_INPUT', '/tmp/qf11-v24-input'))\nOUT = Path(os.environ.get('QF11_V24_OUTPUT', '/tmp/qf11-v24-output'))\n\
        EXPECTED = {\n    'RESEARCH_ONLY_v23_prospective_protocol_amendment.json': '7014ab5d890ce71496932174a5f7b01fbba26cfb1b63f731c196d2d48a3cf861',\n\
        \    'RESEARCH_ONLY_v23_unchanged_catalog_scope.json': '56e98848bf6341dfcc2cd0ed14bdec8f0fae819e13afb78fbff0e62bdb9f7694',\n    'RESEARCH_ONLY_v23_independent_qc_handoff.md':\
        \ '4a7eb3c61f894f94b46e05525966fe3c9dee6cd91a8183225d4646b30383aa6d',\n}\nfor name, sha in EXPECTED.items():\n    p = INPUT / name\n \
        \   assert p.is_file(), 'STOP_MISSING_V23_ARCHIVE_' + name\n    assert hashlib.sha256(p.read_bytes()).hexdigest() == sha, 'STOP_V23_ARCHIVE_SHA_DRIFT_'\
        \ + name\n\np = json.loads((INPUT / 'RESEARCH_ONLY_v23_prospective_protocol_amendment.json').read_text())\nc = json.loads((INPUT / 'RESEARCH_ONLY_v23_unchanged_catalog_scope.json').read_text())\n\
        assert p['schema'] == 'QF11_V23_PROSPECTIVE_PILOT_PROTOCOL_AMENDMENT'\nassert p['status'] == 'OWNER_APPROVED_RESEARCH_AMENDMENT_PREREG_ONLY_NOT_PILOT_ACTIVATION'\n\
        assert p['study_class'] == 'USABILITY_COMPREHENSION_ONLY_NOT_MARKET_CALIBRATION'\nassert p['source_v21_run'] == 38324067358 and p['source_v22_run']\
        \ == 38324741333\nassert p['owner_approval_scope']['single_trio_research_protocol_amendment_approved'] is True\nassert p['owner_approval_scope']['critical_stop_precedence_amendment_approved']\
        \ is True\nfor key in ('pilot_recruitment_approved','real_respondent_display_approved','voter_issuance_approved','market_value_promotion_approved','independent_review_completed','consent_text_approved_for_use'):\n\
        \    assert p['owner_approval_scope'][key] is False, 'STOP_INVALID_OWNER_SCOPE_' + key\nfor key in ('participants_contacted','participant_results_collected','votes_ingested','identity_holds_cleared'):\n\
        \    assert p['fail_closed'][key] == 0\nfor key in ('recruitment_enabled','voter_links_created','ballots_issued','market_value_changed','production_change_authorized','catalog_issuance_approved','independent_qc_completed'):\n\
        \    assert p['fail_closed'][key] is False\nassert p['prospective_stop_amendment']['precedence'] == 'INDIVIDUAL_CRITICAL_STOP_OVERRIDES_ALL_AGGREGATE_THRESHOLDS'\n\
        assert p['held_scope']['original_excluded_slots'] == [1,5,8,12,15,21]\nassert len(p['held_scope']['seven_identity_holds']) == 7\nassert\
        \ p['held_scope']['optional_shadow_rows_uncertified'] == 9\nassert p['one_trio_research_source_status'] == 'OWNER_TENTATIVE_RESEARCH_ONLY_PILOT_REALISM_OPEN'\n\
        assert p['eligibility_and_data_policy_draft']['recruitment_blocked'] is True\nassert p['sample_plan']['live_assignment_implemented'] is\
        \ False\n\nTRIO = ['Brock Bowers', 'Tyler Warren', 'TreVeyon Henderson']\nassert [(x['name'],x['position']) for x in p['one_trio']] ==\
        \ [('Brock Bowers','TE'),('Tyler Warren','TE'),('TreVeyon Henderson','RB')]\nORDERS = p['sample_plan']['display_orders']\nassert len(ORDERS)\
        \ == 6 and len({tuple(x) for x in ORDERS}) == 6\nassert {tuple(x) for x in ORDERS} == set(itertools.permutations(TRIO))\nassert p['sample_plan']['design_n']\
        \ == 12 and p['sample_plan']['two_independent_per_order'] is True\nassert p['prospective_stop_amendment']['noncritical_design_feedback_only']['rb_identification_minimum']\
        \ == '10/12'\nassert p['prospective_stop_amendment']['noncritical_design_feedback_only']['equal_horizon_and_semantics_minimum'] == '10/12'\n\
        assert 'same dynasty time horizon' in p['display_wording']['context_text']\nassert all(f'{name} — {pos}' in p['display_wording']['identity_label']\
        \ for name,pos in [('Brock Bowers','TE'),('Tyler Warren','TE'),('TreVeyon Henderson','RB')])\n\n# Ensure V23 archived 22-slot research\
        \ slate has not been silently promoted or altered.\nassert '22' in (INPUT / 'RESEARCH_ONLY_v23_independent_qc_handoff.md').read_text()\n\
        assert len(c.get('proposed_catalog_for_review',[])) == 22 or c.get('candidate_review_count') == 22, 'STOP_UNEXPECTED_V23_CATALOG_FORMAT'\n\
        \n# SYNTHETIC ONLY: construct six balanced ordering cells with two mock, fake people per cell.\nsynthetic_slots = [(i, slot) for i in\
        \ range(6) for slot in range(2)]\nrandom.Random(23024).shuffle(synthetic_slots)\nassignments = [dict(fake_id=f'SIMULATED_{j+1:02d}', order_index=i+1,\
        \ display_order=ORDERS[i], simulated_only=True) for j,(i,_) in enumerate(synthetic_slots)]\nassert len(assignments)==12 and len({a['fake_id']\
        \ for a in assignments})==12\nassert Counter(a['order_index'] for a in assignments) == Counter({k:2 for k in range(1,7)})\nagain = [(i,\
        \ k) for i in range(6) for k in range(2)]\nrandom.Random(23024).shuffle(again)\nassert synthetic_slots == again, 'STOP_NON_DETERMINISTIC_SYNTHETIC_ASSIGNMENT'\n\
        \n# Synthetic state machine: never exposed to participants. Consent, duplicate, order, cap, critical stop.\nclass SyntheticPilot:\n  \
        \  def __init__(self):\n        self.completed=[]\n        self.identities=set()\n        self.counts=Counter()\n        self.stopped=False\n\
        \        self.stop_reason=None\n\n    def submit(self, fake_id, order_index, *, consent, adult, knows_dynasty, critical=False, rb_correct=True,\
        \ semantics_correct=True):\n        assert fake_id.startswith('SIMULATED_'), 'STOP_NON_SYNTHETIC_ID'\n        if self.stopped: return\
        \ 'BLOCKED_STOP'\n        if len(self.completed)>=12: return 'BLOCKED_CAP'\n        if not consent: return 'BLOCKED_NO_CONSENT'\n    \
        \    if not adult or not knows_dynasty: return 'BLOCKED_ELIGIBILITY'\n        if fake_id in self.identities: return 'BLOCKED_DUPLICATE'\n\
        \        if order_index not in range(1,7): return 'BLOCKED_INVALID_ORDER'\n        if self.counts[order_index]>=2: return 'BLOCKED_ORDER_QUOTA'\n\
        \        self.identities.add(fake_id)\n        self.counts[order_index]+=1\n        self.completed.append(dict(fake_id=fake_id,order=order_index,critical=critical,rb_correct=rb_correct,semantics_correct=semantics_correct))\n\
        \        if critical:\n            self.stopped=True\n            self.stop_reason='CRITICAL_INCIDENT_STOP_AND_QUARANTINE'\n         \
        \   return self.stop_reason\n        return 'SIMULATED_COMPLETION'\n\n    def decision(self):\n        if self.stopped: return 'CRITICAL_HOLD_NOT_APPROVED'\n\
        \        if len(self.completed)!=12: return 'INCOMPLETE_NOT_APPROVED'\n        rb=sum(x['rb_correct'] for x in self.completed)\n     \
        \   meanings=sum(x['semantics_correct'] for x in self.completed)\n        return 'USABILITY_FEEDBACK_ELIGIBLE_FOR_HUMAN_REVIEW_ONLY' if\
        \ rb>=10 and meanings>=10 else 'AGGREGATE_THRESHOLD_NOT_MET'\n\nall_good=SyntheticPilot()\nfor a in assignments:\n    assert all_good.submit(a['fake_id'],a['order_index'],consent=True,adult=True,knows_dynasty=True)=='SIMULATED_COMPLETION'\n\
        assert all_good.decision()=='USABILITY_FEEDBACK_ELIGIBLE_FOR_HUMAN_REVIEW_ONLY'\nassert all_good.submit('SIMULATED_EXTRA',1,consent=True,adult=True,knows_dynasty=True)=='BLOCKED_CAP'\n\
        \ndup=SyntheticPilot(); first=assignments[0]\nassert dup.submit(first['fake_id'],first['order_index'],consent=True,adult=True,knows_dynasty=True)=='SIMULATED_COMPLETION'\n\
        assert dup.submit(first['fake_id'],first['order_index'],consent=True,adult=True,knows_dynasty=True)=='BLOCKED_DUPLICATE'\nassert dup.submit('SIMULATED_NO_CONSENT',first['order_index'],consent=False,adult=True,knows_dynasty=True)=='BLOCKED_NO_CONSENT'\n\
        assert dup.submit('SIMULATED_MINOR',first['order_index'],consent=True,adult=False,knows_dynasty=True)=='BLOCKED_ELIGIBILITY'\nassert dup.submit('SIMULATED_BAD_ORDER',7,consent=True,adult=True,knows_dynasty=True)=='BLOCKED_INVALID_ORDER'\n\
        assert dup.submit('SIMULATED_FILL',first['order_index'],consent=True,adult=True,knows_dynasty=True)=='SIMULATED_COMPLETION'\nassert dup.submit('SIMULATED_EXCEED',first['order_index'],consent=True,adult=True,knows_dynasty=True)=='BLOCKED_ORDER_QUOTA'\n\
        \ncritical=SyntheticPilot()\nfor ix,a in enumerate(assignments):\n    out=critical.submit(a['fake_id'],a['order_index'],consent=True,adult=True,knows_dynasty=True,critical=(ix==9),rb_correct=True,semantics_correct=True)\n\
        \    if ix==9: assert out=='CRITICAL_INCIDENT_STOP_AND_QUARANTINE'\n    elif ix>9: assert out=='BLOCKED_STOP'\n    else: assert out=='SIMULATED_COMPLETION'\n\
        assert critical.decision()=='CRITICAL_HOLD_NOT_APPROVED'\nassert len(critical.completed)==10\n\nlow=SyntheticPilot()\nfor ix,a in enumerate(assignments):\n\
        \    low.submit(a['fake_id'],a['order_index'],consent=True,adult=True,knows_dynasty=True,rb_correct=(ix<9),semantics_correct=True)\nassert\
        \ low.decision()=='AGGREGATE_THRESHOLD_NOT_MET'\n\n# Functional QC verdicts must not imply actual independent human signoff or activation.\n\
        findings=[\n {'key':'SOURCE_AND_SCOPE','status':'SYNTHETIC_PASS','detail':'V23 source digests verified; seven held identities, six excluded\
        \ slots and nine shadow ballots still held'},\n {'key':'ORDER_AND_DEDUP_HARNESS','status':'SYNTHETIC_PASS','detail':'Six exact permutations\
        \ x two synthetic slots, duplicates, quota, consent and eligibility tested; no real assignment system exists'},\n {'key':'CRITICAL_STOP_PRECEDENCE','status':'SYNTHETIC_PASS','detail':'One\
        \ synthetic critical issue blocked further completions, even with aggregate responses otherwise above threshold'},\n {'key':'AGGREGATE_THRESHOLD','status':'SYNTHETIC_PASS','detail':'10/12\
        \ used for usability review only after 12 synthetic completions and zero critical incidents'},\n {'key':'WORDING_SEMANTIC_INDEPENDENT_QC','status':'OPEN_HUMAN_QC','detail':'Keep/Trade/Cut\
        \ labels, same-horizon instructions, exact comprehension questions and one RB visibly labeled in the prompt could cue RB identification;\
        \ independent review required'},\n {'key':'REAL_RANDOMIZATION_DEDUP_IMPLEMENTATION','status':'NOT_IMPLEMENTED','detail':'Simulated allocation\
        \ is not an approved live assignment, deduplication or secure consent application'},\n {'key':'CONSENT_PRIVACY_RETENTION_IMPLEMENTATION','status':'NOT_IMPLEMENTED','detail':'Consent\
        \ wording, actual deletion at 30 days, access control and privacy handling remain drafts'},\n {'key':'CRITICAL_INCIDENT_OPERATIONS','status':'NOT_IMPLEMENTED','detail':'Production-stop/quarantine\
        \ and versioned resumption cannot be inferred from simulated logic'},\n {'key':'STUDY_POWER_AND_MARKET_CALIBRATION','status':'NOT_APPROVED','detail':'N=12\
        \ single-trio usability is not a market-value or ballot-order bias effectiveness study'},\n]\nOUT.mkdir(parents=True,exist_ok=True)\n\
        summary={\n 'schema':'QF11_V24_SYNTHETIC_PILOT_PREACTIVATION_QC',\n 'status':'RESEARCH_ONLY_SYNTHETIC_PASS_ACTIVATION_NOT_APPROVED',\n\
        \ 'source_run':38325685955,\n 'source_v23_digests':EXPECTED,\n 'one_trio':TRIO,\n 'orders':6,\n 'synthetic_order_balance':dict(sorted(Counter(x['order_index']\
        \ for x in assignments).items())),\n 'simulation_count':12,\n 'synthetic_checks':{'balanced_order_allocation':True,'duplicate_rejected':True,'no_consent_rejected':True,'ineligible_rejected':True,'order_quota_enforced':True,'global_cap_enforced':True,'critical_incident_precedence':True,'aggregate_fail_test':True,'valid_twelve_no_critical_requires_human_review':True},\n\
        \ 'findings':findings,\n 'open_human_or_implementation_gates':sum(x['status'] not in ('SYNTHETIC_PASS',) for x in findings),\n 'owner_activation_approved':False,'independent_human_qc_completed':False,'live_randomizer_deployed':False,\n\
        \ 'real_participants_contacted':0,'actual_votes':0,'identity_holds_cleared':0,'production_changes':0,\n 'no_real_human_data':True,'market_calibration_permitted':False\n\
        }\n(OUT/'RESEARCH_ONLY_v24_synthetic_qc_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\\n')\n# Never write synthetic\
        \ fake IDs or even a paper assignment list to the archived package.\nbrief=['# QF11 V24 — Synthetic independent pilot-preactivation quality\
        \ review','',\n'**Green means automated dry-run checks passed. It does NOT mean independent human review or pilot authorization.**','',\n\
        '## Immutable research scope',\n'- Single trio: Brock Bowers (TE) / Tyler Warren (TE) / TreVeyon Henderson (RB).',\n'- Six display permutations,\
        \ two synthetic order slots each, 12 synthetic completions.',\n'- Seven identity holds, original slots 1/5/8/12/15/21 and nine optional\
        \ substitutions remain held.',\n'- All evidence pinned to actual V23 Green run 38325685955.',\n'', '## What was functionally dry-run tested',\n\
        '- No consent, under-age/ineligible simulated participants, duplicate IDs and order-quota overfill correctly rejected.',\n'- A synthetic\
        \ critical misunderstanding stopped further collection, regardless of aggregate comprehension responses.',\n'- Synthetic 10/12 criteria\
        \ produced usability-review eligibility, never scientific or production pass.',\n'', '## Independent-review / implementation gates still\
        \ open',\n]\nfor item in findings:\n if item['status']!='SYNTHETIC_PASS':brief.append(f\"- **{item['key']} — {item['status']}:** {item['detail']}\"\
        )\nbrief+=['','## Important measurement issue',\n'Because the draft prompt explicitly marks TreVeyon Henderson as RB, asking participants\
        \ to identify the RB may measure reading a visible label rather than understanding the study. Independent review must determine whether\
        \ this check is informative and how to avoid leading items.',\n'', '## Strict authorization boundary',\n'No participant contact, no actual\
        \ consent, no live survey links, no votes or active assignment, no Market Value promotion or other production changes; owner must separately\
        \ authorize an approved, implemented pilot after external/human QC.','']\n(OUT/'RESEARCH_ONLY_v24_independent_qc_gate.md').write_text('\\\
        n'.join(brief))\nprint('QF11_V24_SYNTHETIC_PREACTIVATION_GREEN '+json.dumps({'synthetic_responses':12,'display_orders':6,'open_gates':summary['open_human_or_implementation_gates'],'participants_contacted':0,'voting':False,'production_changes':0},sort_keys=True))\n\
        \nQF11_V24_SOURCE\npython3 /tmp/qf11-v24-harness.py"
    - name: Run all 14 frozen regression groups and FA PA production selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo QF11_V24_FROZEN_14_REGRESSIONS_GREEN

        '
    - name: Fail closed on any real pilot, privacy or Market Value release claims
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''QF11_V24_GATE''

        import json

        from pathlib import Path

        x=json.loads(Path(''/tmp/qf11-v24-output/RESEARCH_ONLY_v24_synthetic_qc_summary.json'').read_text())

        assert x[''schema'']==''QF11_V24_SYNTHETIC_PILOT_PREACTIVATION_QC''

        assert x[''status'']==''RESEARCH_ONLY_SYNTHETIC_PASS_ACTIVATION_NOT_APPROVED''

        assert x[''simulation_count'']==12 and x[''orders'']==6

        assert len(x[''synthetic_checks''])==9 and all(x[''synthetic_checks''].values())

        assert x[''open_human_or_implementation_gates'']>=5

        assert x[''owner_activation_approved''] is False

        assert x[''independent_human_qc_completed''] is False

        assert x[''live_randomizer_deployed''] is False

        assert x[''real_participants_contacted'']==0 and x[''actual_votes'']==0 and x[''production_changes'']==0

        assert x[''identity_holds_cleared'']==0 and x[''market_calibration_permitted''] is False

        assert x[''no_real_human_data''] is True

        print(''QF11_V24_SYNTHETIC_QC_HOLDS_NO_LIVE_STUDY_GREEN'')

        QF11_V24_GATE'
    - name: Recheck protected source digests and clean read-only main
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V24_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

