# QF11 V40r1: repairs ONLY a false-positive guard in the V39 test replay.
# Safety, source pins, test coverage, and owner-only no-deployment policy unchanged.
# QF11 V40 — NO GOOGLE CALLS OR REAL PARTICIPANTS; NO SOURCE/PRODUCTION WRITES.
name: QF11 V40r1 - KTC V2 Batch Replay Guard Repair (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v40r1-batched-ktc-v2-existing-project-kit
  cancel-in-progress: false
jobs:
  batch_review:
    name: Replay 116 synthetic tests and build existing-project Code.gs; no Google calls
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - name: Checkout exact main commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install read-only audit dependencies
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests PyYAML
    - name: Pin V39 green collector plus immutable production inputs
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo STOP_NON_MAIN; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_COMMIT_DRIFT; exit 1; }
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_WORKTREE_DRIFT; exit 1; }
        check(){ [[ -f "$1" && "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PIN_DRIFT_$1"; exit 1; }; }
        check .github/workflows/QF11-v39.yml 30d05380c405fbd4caf1252e7b1dbafa3929be03
        check research/ktc-v2-isolated/collector.gs ced5f95d3e34023d37b95cf7029c94ccdcdca483
        check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a
        check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d
        check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7
        check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860
        check research/ktc-v2-isolated/client-bridge.js a7dd731fd013c0ce7e547eb05ae8c825e85ccd9b
        check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167
        check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28
        check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }
        echo QF11_V40_V39_AND_PRODUCTION_SOURCE_PINS_GREEN
    - name: Replay 29 V39 retention tests and 75 KTC tests with frozen regressions
      run: |
        set -euo pipefail
        mkdir -p /tmp/qf11-v40
        python3 - <<'PYEXTRACT'
        from pathlib import Path
        import yaml
        w=yaml.safe_load(Path('.github/workflows/QF11-v39.yml').read_text())
        steps=w['jobs']['batch_hardening']['steps']
        matches=[s['run'] for s in steps if s.get('name','').startswith('Run 17 prior plus 12 new synthetic')]
        assert len(matches)==1,'STOP_V39_29_CHECK_REPLAY_NOT_FOUND'
        s=matches[0]
        assert s.count('node /tmp/qf11-v39/retention_audit.js')==1
        assert s.count('node /tmp/qf11-v39/hardening_tests.js')==1
        # V40r1: V39 intentionally tests absence of ScriptApp.newTrigger in the
        # collector. A literal ScriptApp. text ban incorrectly rejected that test.
        assert 'git push' not in s and 'curl ' not in s
        assert "assert(!source.includes('ScriptApp.newTrigger('))" in s, 'STOP_NO_NEGATIVE_TRIGGER_TEST'
        Path('/tmp/qf11-v40/replay-v39.sh').write_text(s)
        PYEXTRACT
        bash /tmp/qf11-v40/replay-v39.sh
        node research/ktc-v2-isolated/collector.test.js
        node research/ktc-v2-isolated/client-bridge.test.js
        node research/ktc-v2-isolated/frame-host.test.js
        python3 scripts/validation/snapshot_values.py --selftest
        python3 scripts/market/build_market_value.py --selftest
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        echo QF11_V40_V39_29_PLUS_FROZEN_75_AND_PRODUCTION_REGRESSIONS_GREEN
    - name: Generate single combined Code.gs for existing private Apps Script only
      run: |
        set -euo pipefail
        mkdir -p /tmp/qf11-v40
        cat > /tmp/qf11-v40/v40_helpers.gs <<'QF11V40HELPER'
        /** QF11 V40: owner-operated, disabled-only read-only verification functions.
         * Do NOT set any approval flag true or create a trigger in these functions.
         */
        function qf11v2VerifyDisabledSetup() {
          var props=PropertiesService.getScriptProperties();
          var flags=[
            'QF11_V2_ENABLED','QF11_V2_HALTED','QF11_V2_CLOSED',
            'QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED',
            'QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED',
            'QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'
          ];
          flags.forEach(function(key) {
            if(props.getProperty(key)!=='false')throw new Error('STOP_DISABLED_FLAG_'+key);
          });
          var sheet=qf11v2Sheet_(props);
          if(sheet.getLastRow()!==1)throw new Error('STOP_NONEMPTY_PILOT_RESPONSES');
          Logger.log('PASS: Existing KTC V2 project disabled, isolated sheet schema valid, responses empty.');
          return true;
        }
        function qf11v2VerifyLockedInterface() {
          var props=PropertiesService.getScriptProperties();
          if(props.getProperty('QF11_V2_ENABLED')!=='false')throw new Error('STOP_NOT_DISABLED');
          var page=doGet({});
          if(page.getContent().indexOf('KTC V2 is not accepting pilot responses.')===-1)throw new Error('STOP_INTERFACE_EXPOSED');
          if(qf11v33Bootstrap('SYNTHETIC_BAD_INVITE').status!=='DISABLED')throw new Error('STOP_INVITATIONS_OPEN');
          if(qf11v33Submit({}).status!=='DISABLED')throw new Error('STOP_RPC_OPEN');
          var post=JSON.parse(doPost({postData:{contents:'{}'}}).getContent());
          if(post.status!=='DISABLED')throw new Error('STOP_DIRECT_POST_OPEN');
          Logger.log('PASS: Existing KTC V2 website, invitations, Google RPC, and direct POST are disabled.');
          return true;
        }
        function qf11v2InspectDeletionTrigger() {
          // Status inventory only: no trigger installed, removed, or executed here.
          // A present trigger does NOT prove it executes or satisfies a 30-day ceiling.
          var list=ScriptApp.getProjectTriggers();
          var n=list.filter(function(x){return x.getHandlerFunction()==='purgeExpiredQF11V2Rows';}).length;
          Logger.log(n===1 ? 'INFO: One deletion trigger exists; execution unverified.' : 'BLOCKER: Expected exactly one deletion trigger; count is '+n+'.');
          return n===1;
        }
        QF11V40HELPER
        cat > /tmp/qf11-v40/build_kit.py <<'QF11V40BUILD'
        from pathlib import Path
        import hashlib,json,subprocess
        out=Path('/tmp/qf11-v40');out.mkdir(exist_ok=True,parents=True)
        root=Path('research/ktc-v2-isolated')
        collector=(root/'collector.gs').read_text()
        host=(root/'frame-host.gs').read_text()
        helper=Path('/tmp/qf11-v40/v40_helpers.gs').read_text()
        assert collector.count('function doPost(')==1
        assert collector.count('function purgeExpiredQF11V2Rows(')==1
        assert collector.count("if(!qf11v2IntakeAuthorized_(props))")==2
        assert 'V39: halt BEFORE attempting any deletion' in collector
        assert 'V39: fail closed if the purge trigger failed' in collector
        assert host.count('function doGet(')==1
        assert host.count('function qf11v33Submit(')==1
        assert not any(k in collector+host+helper for k in ['QF11_V2_HMAC_SECRET=', 'script.google.com/macros/s/AKfy'])
        code=('/* QF11 V40 EXISTING PRIVATE GOOGLE APPS SCRIPT Code.gs\n'
              ' * SOURCE SYNC KIT ONLY. No new Apps Script project or sheet.\n'
              ' * Keep all nine gating flags literal false. Do not enable pilot.\n'
              ' * V39 retention protections included; V33 iframe host unchanged.\n'
              ' */\n\n'+collector.rstrip()+'\n\n'+host.rstrip()+'\n\n'+helper.rstrip()+'\n')
        assert code.count('function doGet(')==1 and code.count('function doPost(')==1
        assert code.count('function qf11v2VerifyDisabledSetup(')==1
        assert code.count('function qf11v2VerifyLockedInterface(')==1
        assert code.count('function qf11v2InspectDeletionTrigger(')==1
        p=out/'QF11-V40-EXISTING-PROJECT-Code.gs.txt'
        p.write_text(code)
        manifest={
         'schema':'QF11_V40_EXISTING_PROJECT_CODE_SYNC_V1',
         'generator_git_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
         'code_gs_sha256':hashlib.sha256(code.encode()).hexdigest(),
         'collector_blob_sha':subprocess.check_output(['git','hash-object',str(root/'collector.gs')],text=True).strip(),
         'frame_host_blob_sha':subprocess.check_output(['git','hash-object',str(root/'frame-host.gs')],text=True).strip(),
         'v39_retention_hardening_included':True,'existing_google_code_automatically_updated':False,
         'new_google_project_created':False,'google_sheet_modified':False,'real_google_calls':0,
         'real_votes_written':0,'production_valuation_changed':False,'owner_authorized_live_study':False,
         'deletion_trigger_present_in_actual_google_project_verified':False,
         'deletion_trigger_actual_execution_verified':False,
         'real_htmlservice_iframe_origin_and_rpc_verified':False,
         'independent_consent_wording_and_moderator_review_completed':False,
         'decision':'SOURCE_KIT_VALIDATION_ONLY_LIVE_PILOT_BLOCKED'
        }
        (out/'source-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
        print('QF11_V40_COMBINED_CODE_GS_PREPARED',manifest['code_gs_sha256'])
        QF11V40BUILD
        python3 /tmp/qf11-v40/build_kit.py
        node --check < /tmp/qf11-v40/QF11-V40-EXISTING-PROJECT-Code.gs.txt
    - name: Smoke-test combined Code.gs disabled-only and trigger inventory mocks
      run: |
        set -euo pipefail
        cat > /tmp/qf11-v40/smoke.js <<'QF11V40SMOKE'
        // QF11 V40: generated Code.gs tested under entirely local synthetic Google mocks.
        'use strict';
        const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
        const src=fs.readFileSync('/tmp/qf11-v40/QF11-V40-EXISTING-PROJECT-Code.gs.txt','utf8');
        const HEADERS=['received_utc','delete_due_utc','schema','slot','display_order','token_hmac','keep','trade','cut','q1','q2','q3','review_status'];
        const FLAGS=['QF11_V2_ENABLED','QF11_V2_HALTED','QF11_V2_CLOSED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'];
        let n=0;
        function check(label,fn){fn();n++;console.log('PASS '+label)}
        function fixture(){
         const cfg=Object.fromEntries(FLAGS.map(k=>[k,'false']));
         cfg.QF11_V1_SHEET_ID='SYNTHETIC_V1';cfg.QF11_V2_SHEET_ID='SYNTHETIC_V2';cfg.QF11_V2_SEPARATE_SHEET_VERIFIED='YES';
         let rows=[HEADERS.slice()],triggers=[],visits=[],messages=[];
         const env={
           PropertiesService:{getScriptProperties:()=>({getProperty:k=>cfg[k]??null,setProperty:(k,v)=>{cfg[k]=String(v)}})},
           SpreadsheetApp:{openById:id=>{visits.push(id);assert.equal(id,'SYNTHETIC_V2');return {getSheetByName:name=>{assert.equal(name,'Responses');return {getLastRow:()=>rows.length,getRange:()=>({getValues:()=>[HEADERS.slice()]})}}}}},
           ScriptApp:{getProjectTriggers:()=>triggers},
           HtmlService:{createHtmlOutput:s=>({getContent:()=>s})},
           ContentService:{MimeType:{JSON:'application/json'},createTextOutput:s=>({getContent:()=>s,setMimeType(){return this}})},
           Logger:{log:x=>messages.push(x)},Date,JSON,Object,Array,String,Number,Set,Error,Math
         };
         vm.createContext(env);vm.runInContext(src,env,{timeout:5000});
         return {cfg,env,rows,triggers,visits,messages};
        }
        check('disabled setup passes with empty isolated response sheet',()=>{const a=fixture();assert.equal(a.env.qf11v2VerifyDisabledSetup(),true);assert.deepEqual(a.visits,['SYNTHETIC_V2'])});
        check('disabled read-only interface verifier blocks all four channels',()=>{const a=fixture();assert.equal(a.env.qf11v2VerifyLockedInterface(),true);assert.equal(a.rows.length,1)});
        check('every one of nine flags must be false for strict setup verifier',()=>{for(const f of FLAGS){const a=fixture();a.cfg[f]='true';assert.throws(()=>a.env.qf11v2VerifyDisabledSetup(),/STOP_DISABLED_FLAG_/);assert.equal(a.rows.length,1)}});
        check('missing flag blocks verifier',()=>{const a=fixture();delete a.cfg.QF11_V2_PRIVACY_DELETION_VERIFIED;assert.throws(()=>a.env.qf11v2VerifyDisabledSetup(),/STOP_DISABLED_FLAG_/)});
        check('nonempty response sheet blocks disabled state verification',()=>{const a=fixture();a.rows.push(['synthetic']);assert.throws(()=>a.env.qf11v2VerifyDisabledSetup(),/STOP_NONEMPTY_PILOT_RESPONSES/)});
        check('V1 and V2 same spreadsheet blocks isolation attestation',()=>{const a=fixture();a.cfg.QF11_V1_SHEET_ID='SYNTHETIC_V2';assert.throws(()=>a.env.qf11v2VerifyDisabledSetup(),/SAME_AS_PRODUCTION_KTC_V1_SHEET/)});
        check('read-only deletion trigger inspection reports absent trigger honestly',()=>{const a=fixture();assert.equal(a.env.qf11v2InspectDeletionTrigger(),false);assert.equal(a.triggers.length,0)});
        check('one synthetic trigger only reports presence not performance',()=>{const a=fixture();a.triggers.push({getHandlerFunction:()=> 'purgeExpiredQF11V2Rows'});assert.equal(a.env.qf11v2InspectDeletionTrigger(),true);assert(a.messages.some(x=>x.includes('execution unverified')))});
        check('duplicate purge triggers fail trigger inventory',()=>{const a=fixture();a.triggers.push({getHandlerFunction:()=> 'purgeExpiredQF11V2Rows'},{getHandlerFunction:()=> 'purgeExpiredQF11V2Rows'});assert.equal(a.env.qf11v2InspectDeletionTrigger(),false)});
        check('disabled Code.gs cannot claim submission success',()=>{const a=fixture();assert.equal(JSON.parse(a.env.doPost({postData:{contents:'{}'}}).getContent()).status,'DISABLED');assert.equal(a.rows.length,1)});
        check('source has exactly one each GET POST and purge handler',()=>{for(const f of ['doGet','doPost','purgeExpiredQF11V2Rows','qf11v33Bootstrap','qf11v33Submit'])assert.equal((src.match(new RegExp('function '+f+'\\(', 'g'))||[]).length,1)});
        check('generated kit contains V39 retention protections and never auto-installs triggers',()=>{assert(src.includes('V39: halt BEFORE attempting any deletion'));assert(src.includes('V39: fail closed if the purge trigger failed'));assert(!src.includes('ScriptApp.newTrigger('));assert(!src.includes('KTC_SUBMIT_URL'))});
        assert.equal(n,12);
        fs.writeFileSync('/tmp/qf11-v40/generated-code-smoke.json',JSON.stringify({schema:'QF11_V40_GENERATED_CODE_SYNTHETIC_V1',passed:n,google_calls:0,votes_written:0,real_deployment_untested:true},null,2)+'\n');
        console.log('QF11_V40_12_GENERATED_CODE_GS_SYNTHETIC_TESTS_GREEN');
        QF11V40SMOKE
        node /tmp/qf11-v40/smoke.js
    - name: Compile batched transport privacy consent retention and authorization findings
      run: |
        set -euo pipefail
        cat > /tmp/qf11-v40/review.py <<'QF11V40REVIEW'
        from pathlib import Path
        import json
        base=Path('/tmp/qf11-v40')
        c=Path('research/ktc-v2-isolated/collector.gs').read_text()
        f=Path('research/ktc-v2-isolated/frame-host.gs').read_text()
        h=Path('research/ktc-v2-isolated/pilot-frame.html').read_text()
        p=Path('index.html').read_text()
        assert 'document.referrer' in h and 'window.self!==window.top' in h
        assert 'setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)' in f
        assert 'google.script.run.withSuccessHandler' in h
        assert 'market_values.json' not in f and 'KTC_SUBMIT_URL' not in c
        assert 'QF11_V30_KTC_V2_INTERACTIVE_DEMO_END' in p
        assert c.count('function purgeExpiredQF11V2Rows(')==1
        assert '30*24*3600*1000' in c
        # The diagnostics are REQUIRED HUMAN REVIEWS, not fake automated approval.
        findings=[
         {'id':'CODE_SYNC','status':'PENDING_MANUAL_OWNER_ACTION','finding':'GitHub V39 collector differs from previously installed Google Code.gs until owner replaces existing project source; workflow does not deploy.'},
         {'id':'IFRAME','status':'BLOCKED_LIVE_PROOF','finding':'HTML iframe uses document.referrer plus ALLOWALL; synthetic Chromium tests cannot prove real Google HtmlService iframe origin, clickjacking resistance, or private-owner access.'},
         {'id':'RPC','status':'BLOCKED_LIVE_PROOF','finding':'google.script.run is mocked in browser tests; owner-only real Google RPC success/failure and uncertain acknowledgment remain unverified.'},
         {'id':'RETENTION','status':'BLOCKED_LIVE_PROOF','finding':'V39 synthetic deletion passes do not prove an installed operational trigger or a strict <=30-day deletion maximum, nor deletion of exports, logs, invite allowlist, Q4 notes.'},
         {'id':'WORDING_AND_CONSENT','status':'HUMAN_REVIEW_REQUIRED','finding':'Ballot, consent, Q1-Q4 wording, Q4 review rubric, age/experience screening and privacy disclosure are not independently approved by software.'},
         {'id':'OWNER_AUTHORIZATION','status':'NOT_AUTHORIZED','finding':'No owner permission for recruitment, participant voting, Market Value calibration or production coefficient changes.'},
         {'id':'ISOLATION','status':'SOURCE_ONLY_VERIFIED','finding':'Generated kit has no live V1 collection endpoint or V1 spreadsheet write path; actual Google project and sheet permissions still need independent operator verification.'}
        ]
        review={'schema':'QF11_V40_BATCHED_LAUNCH_GATE_REVIEW_V1','decision':'GREEN_SOURCE_KIT_ONLY__NO_LIVE_PILOT',
                'synthetic_tests_total':116,'prior_v39_retention_tests':29,'prior_ktc_tests':75,'new_generated_code_tests':12,
                'real_google_calls':0,'real_votes_written':0,'production_model_changes':0,
                'existing_google_code_updated_by_workflow':False,'owner_launch_approval':False,
                'blocker_count':sum(x['status'] not in ('SOURCE_ONLY_VERIFIED',) for x in findings),
                'findings':findings}
        (base/'readiness.json').write_text(json.dumps(review,indent=2)+'\n')
        instructions="""# QF11 V40 — Existing private project only (source sync, no activation)

        This workflow creates a kit but does **not** update Google Apps Script, edit a spreadsheet, install a trigger, issue invitations, or enable responses. There is no requirement to create another project.

        ## One future source-sync operation in EXISTING project

        1. In your existing private KTC V2 Google Apps Script, replace **Code.gs** with the entire text of `QF11-V40-EXISTING-PROJECT-Code.gs.txt`. Do not alter `pilot-frame.html`. Save. Ensure all nine safety flags remain literal `false`.
        2. Run `qf11v2VerifyDisabledSetup()` and `qf11v2VerifyLockedInterface()` from that existing project. Both must log PASS. Stop if either fails. These functions are disabled-only and read-only.
        3. Optional read-only inventory: run `qf11v2InspectDeletionTrigger()` to report whether exactly one expiry purge trigger exists. Presence does **not** prove it executes successfully, or that retention is no more than 30 days.
        4. Only after both disabled verifier functions pass, update your **existing** private web app deployment to a new version, retaining owner-only access and Execute as me. Verify it still says **KTC V2 is not accepting pilot responses.**

        **Never** change the seven approval flags to true based on this kit. Do not run participant traffic. Do not submit invitations or votes. Do not create another Apps Script project or spreadsheet.

        ## Remaining actual-environment approvals

        - Independently review official parent frame, referrer and clickjacking policy. `ALLOWALL` and a client-only referrer check are not authentication or proven frame security.
        - Verify owner-only actual Google HtmlService RPC acknowledgment with synthetic nonparticipant testing; no votes or live collection until independent review.
        - Inspect the retention trigger, test safe nonparticipant deletion, and independently attest logs/exports/invite allowlist/moderator-Q4 cleanup. A daily trigger by itself cannot establish a hard 30-day maximum.
        - Approve consent, participant eligibility, Q1–Q4 wording, Q4 scoring and moderator incident SOP.
        - Obtain separate explicit owner authorization for any real pilot; treat the 12-person pilot as instrument research only, never Market Value calibration evidence.

        ## Decision

        A green V40 run means only that code generation, synthetic tests and frozen regressions passed. It does NOT certify these real-environment or human gates.
        """
        (base/'OWNER-INSTRUCTIONS.md').write_text(instructions)
        md=['# QF11 V40 — Consolidated Readiness Report','', '**Decision:** GREEN SOURCE KIT ONLY; LIVE STUDY BLOCKED','', 'All synthetic suites rerun: 29 V39 privacy cases + 75 historical KTC checks + 12 combined Code.gs smoke tests = **116**.','', 'Frozen valuation and production regressions executed separately.','']
        for fnd in findings:md.extend([f"## {fnd['id']} — {fnd['status']}",fnd['finding'],''])
        md.append('No Google calls, live votes, production changes or real project deployments occurred.')
        (base/'CONSOLIDATED-READINESS.md').write_text('\n'.join(md)+'\n')
        print('QF11_V40_BATCH_REVIEW_GENERATED__LIVE_BLOCKED')
        QF11V40REVIEW
        python3 /tmp/qf11-v40/review.py
        [[ -z "$(git status --porcelain)" ]] || { echo STOP_REPO_MUTATED; exit 1; }
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_HEAD_CHANGED; exit 1; }
        echo QF11_V40_116_SYNTHETIC_TESTS_AND_GATES_REVIEWED__NO_REAL_PILOT
    - name: Upload one source-sync and readiness audit kit
      uses: actions/upload-artifact@v4
      with:
        name: QF11-V40r1-CONSOLIDATED-EXISTING-PROJECT-KIT
        path: |-
          /tmp/qf11-v40/QF11-V40-EXISTING-PROJECT-Code.gs.txt
