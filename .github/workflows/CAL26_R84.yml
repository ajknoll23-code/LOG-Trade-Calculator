# Claude review follow-up. Model A live unchanged, no price release.
name: CAL26 V1R84 - Claude Calibration Audit and Two-Origin H2 Robustness (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r84-claude-two-origin-audit-readonly
  cancel-in-progress: false
jobs:
  independent-review-audit-no-price-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Read-only checkout pinned production and 2026 league specification
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Fetch frozen historical 2021-2025 R60
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R60_2021_25_SEVEN_POSITION_FUTURE_SURPLUS_RESEARCH_ONLY
        run-id: 40057944765
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r84-in/R60
    - name: Fetch frozen verified R82 same-pool player rankings
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R82_2026_2027_SURPLUS_UTILITY_SCALE_UNIDENTIFIED_FV_HOLD
        run-id: 40136427921
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r84-in/R82
    - name: Fetch verified R83 H2 2023-origin reference
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R83_H2_POSITION_SURVIVAL_AND_2028_PROXY_FV_HOLD
        run-id: 40138134084
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r84-in/R83
    - name: Check Claude critiques, league lineup slots, paired bootstrap H2 origin robustness
      shell: bash
      run: "set -euo pipefail\ntest \"$(git hash-object index.html)\" = \"5630bb681dd8710f8e45bc5363488f358ce9ebe2\"\ntest \"$(git hash-object research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json)\" = \"8e350fc927417d2f8afceb5b42545e48e3622fff\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\ncat > \"$RUNNER_TEMP/CAL26_R84_engine.py\" <<'PY_R84_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 R84: 2026 slot provenance, exact R82 rank identity, and H2 two-origin robustness.\nResearch-only: no prices, deploy, multi-year validated V or holdout use.\n\"\"\"\nimport argparse,collections,csv,hashlib,json,math,pathlib,random,statistics\nP=pathlib.Path\nPOS=('QB','RB','WR','TE','DL','LB','DB')\nPIN={\n 'CAL26_V1R60_2021_25_historical_id_playerseason_rows.csv':'b93de295d84df948d1d4c00af21e791584b61f887f37e500d42a87cabd07613c',\n 'CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv':'147a4fb61409540ba75b9238766f4d5e2fa920a8356b51434fc456f6ae8c4f47',\n 'CAL26_R83_7_POSITION_H2_SURVIVAL_AND_ACCURACY.csv':'e1fca53dabc55b840fc262fdfefde927eddb45f457b986450aa7a13618ba41ac'\n\
        }\nSLOT_EXPECT={'QB':1,'RB':2,'WR':2,'TE':1,'FLEX':1,'SUPER_FLEX':1,'K':1,'DL':2,'LB':2,'DB':2,'IDP_FLEX':2}\n\ndef require(cond,code):\n if not cond: raise AssertionError(code)\n\ndef rows(path):\n with path.open(encoding='utf-8',newline='') as f:return list(csv.DictReader(f))\n\ndef write(path,rs):\n require(bool(rs),'EMPTY_ROWS')\n with path.open('w',encoding='utf-8',newline='') as f:\n  w=csv.DictWriter(f,fieldnames=list(rs[0]));w.writeheader();w.writerows(rs)\n\ndef sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()\n\ndef metric(a):return statistics.mean(a)\n\ndef lin_fit(train):\n xs=[v[0] for v in train];ys=[v[1] for v in train];mx=metric(xs);my=metric(ys)\n den=sum((x-mx)**2 for x in xs)\n require(den>1e-7,'DEGENERATE_TRAIN')\n slope=sum((x-mx)*(y-my) for x,y in zip(xs,ys))/den\n return slope,my-slope*mx,my\n\ndef bootstrap_paired(y,pred,baseline,pos,origin,salt,nrep=4000):\n n=len(y);diff=[(base-actual)**2-(est-actual)**2 for base,est,actual in zip(baseline,pred,y)]\n\
        \ rng=random.Random(84000+origin*53+sum(ord(x) for x in pos)*17+salt)\n out=[]\n for _ in range(nrep):\n  out.append(sum(diff[rng.randrange(n)] for __ in range(n))/n)\n out.sort()\n return round(out[int(nrep*0.025)],5),round(out[int(nrep*0.975)-1],5)\n\ndef run(a):\n srcs={'hist':P(a.r60)/'CAL26_V1R60_2021_25_historical_id_playerseason_rows.csv',\n       'r82':P(a.r82)/'CAL26_R82_518_TWO_YEAR_SURPLUS_UTILITY_SCENARIOS_NOT_FV.csv',\n       'r83':P(a.r83)/'CAL26_R83_7_POSITION_H2_SURVIVAL_AND_ACCURACY.csv'}\n for key,path in srcs.items():\n  require(path.exists(),'MISSING_'+key)\n  require(sha(path)==PIN[path.name],'FROZEN_SOURCE_DRIFT_'+path.name)\n snapshot=P(a.snapshot)\n j=json.loads(snapshot.read_text())\n require(j['league_id']=='1326679131051532288' and str(j['season'])=='2026','WRONG_2026_LEAGUE')\n counts=collections.Counter(x for x in j['roster_positions'] if x!='BN')\n require(dict(counts)==SLOT_EXPECT and len(j['roster_positions'])==37,'2026_STARTER_RULES_DRIFT')\n require(j['scoring_settings']['rec']==0.5\
        \ and j['scoring_settings']['idp_blk_kick']==6.0 and j['scoring_settings']['idp_tkl_solo']==1.5 and j['scoring_settings']['rush_att']==0.2,'2026_SCORING_RULES_DRIFT')\n # Shared FLEX and IDP_FLEX create coupled replacement; position rank+1 is not sufficient.\n slots=[]\n for slot in SLOT_EXPECT:\n  eligible= {'FLEX':'RB,WR,TE','SUPER_FLEX':'QB,RB,WR,TE','IDP_FLEX':'DL,LB,DB'}.get(slot,slot)\n  slots.append({'slot':slot,'per_team':SLOT_EXPECT[slot],'league_teams':12,'league_required_slots':SLOT_EXPECT[slot]*12,'eligible_position_buckets':eligible,'source':'FROZEN_2026_SLEEPER_RULES','K_horizon_model_supported':False if slot=='K' else ''})\n # Confirm R82 ranks truly use same cohort; an apparent rank disagreement is not a pool mismatch.\n current=rows(srcs['r82']);require(len(current)==518,'R82_UNIVERSE_DRIFT')\n ranks=[]\n for p in POS:\n  cohort=[r for r in current if r['position']==p and r['same_eligible_position_pool_utility_rank']!='']\n  require(len(cohort)>20,'SPARSE_R82_POOL_'+p)\n\
        \  for key in ('same_eligible_position_pool_utility_rank','same_eligible_position_pool_live_FV_rank'):\n   observed=sorted(int(r[key]) for r in cohort)\n   require(observed==list(range(1,len(cohort)+1)),'R82_SAME_POOL_RANK_INVALID_'+p+'_'+key)\n  ranks.append({'position':p,'identical_eligibility_pool_n':len(cohort),'min_utility_rank':1,'max_utility_rank':len(cohort),'min_live_FV_rank':1,'max_live_FV_rank':len(cohort),'pool_identity_check':'PASS','note':'Different rank numbers do NOT imply different pools'})\n for name,p,ur,vr in [('drake maye','QB',6,10),('malik nabers','WR',7,23),('bryce young','QB',10,18),('cj stroud','QB',5,21),('puka nacua','WR',12,1)]:\n  focus=next(x for x in current if x['name']==name and x['position']==p)\n  require(int(focus['same_eligible_position_pool_utility_rank'])==ur and int(focus['same_eligible_position_pool_live_FV_rank'])==vr,'FOCUS_RANK_DRIFT_'+name)\n hist=rows(srcs['hist']);require(len(hist)==8572,'HISTORICAL_SOURCE_DRIFT')\n lookup={}\n for\
        \ r in hist:\n  yr=int(r['season']);key=(yr,r['Sleeper_id'],r['position']);require(key not in lookup,'DUPLICATE_HISTORICAL_KEY')\n  lookup[key]=r\n historic_r83={x['position']:x for x in rows(srcs['r83'])}\n output=[]\n for p in POS:\n  for testorigin in (2022,2023):\n   train=[];test=[]\n   for r in hist:\n    origin=int(r['season'])\n    if r['position']!=p or origin not in (2021,2022,2023) or origin>testorigin:continue\n    future=lookup.get((origin+2,r['Sleeper_id'],p))\n    x=float(r['actual_LOG_surplus_points']);y=float(future['actual_LOG_surplus_points']) if future else 0.0\n    require(math.isfinite(x) and math.isfinite(y) and x>=0 and y>=0,'INVALID_POINTS')\n    (train if origin<testorigin else test).append((x,y,r['Sleeper_id']))\n   require(len(train)>=20 and len(test)>=20,'INSUFFICIENT_ORIGIN_COHORT')\n   slope,intercept,prior=lin_fit(train)\n   actual=[q[1] for q in test];model=[max(0,slope*q[0]+intercept) for q in test]\n   sticky=[q[0] for q in test];meanpred=[prior]*len(test)\n\
        \   mse=metric([(z-y)**2 for z,y in zip(model,actual)])\n   sticky_mse=metric([(z-y)**2 for z,y in zip(sticky,actual)])\n   prior_mse=metric([(z-y)**2 for z,y in zip(meanpred,actual)])\n   if testorigin==2023:\n    r=historic_r83[p]\n    require(len(test)==int(r['H2_origin_2023_to_2025_holdout_n']),'R83_H2_N_MISMATCH_'+p)\n    require(abs(mse-float(r['H2_holdout_model_MSE']))<=.025,'R83_H2_MODEL_REPLAY_DRIFT_'+p)\n    require(abs(sticky_mse-float(r['H2_holdout_sticky_MSE']))<=.025,'R83_H2_STICKY_DRIFT_'+p)\n    require(abs(prior_mse-float(r['H2_holdout_trainmean_MSE']))<=.025,'R83_H2_MEAN_DRIFT_'+p)\n   st_low,st_hi=bootstrap_paired(actual,model,sticky,p,testorigin,51)\n   mn_low,mn_hi=bootstrap_paired(actual,model,meanpred,p,testorigin,77)\n   output.append({'position':p,'test_origin_year':testorigin,'test_outcome_year':testorigin+2,\n     'train_origin_years':','.join(str(t) for t in range(2021,testorigin)),\n     'train_n':len(train),'test_n':len(test),'model_H2_MSE':round(mse,4),'sticky_H2_MSE':round(sticky_mse,4),'train_mean_H2_MSE':round(prior_mse,4),\n\
        \     'model_minus_sticky_MSE_improvement_pct':round((sticky_mse-mse)*100/sticky_mse,2),'model_minus_mean_MSE_improvement_pct':round((prior_mse-mse)*100/prior_mse,2),\n     'bootstrap_sticky_gain_MSE_CI95_lower':st_low,'bootstrap_sticky_gain_MSE_CI95_upper':st_hi,\n     'bootstrap_mean_gain_MSE_CI95_lower':mn_low,'bootstrap_mean_gain_MSE_CI95_upper':mn_hi,\n     'model_beats_both_point_baselines':mse<sticky_mse and mse<prior_mse,\n     'positive_gain_both_bootstrap_bounds':st_low>0 and mn_low>0,\n     'genuinely_point_in_time_validated':False,\n     'retrospective_origin_split_limitation':'H2 train outcome years may exceed heldout test origin year',\n     'missing_future_as_zero_is_censoring_assumption':True,\n     'forecast_transport_to_2026_Week6_validated':False})\n bypos={}\n for p in POS:\n  d=[x for x in output if x['position']==p]\n  bypos[p]=all(x['model_beats_both_point_baselines'] and x['positive_gain_both_bootstrap_bounds'] for x in d)\n out=P(a.out);out.mkdir(parents=True,exist_ok=True)\n\
        \ f1='CAL26_R84_2026_LEAGUE_SLOT_AND_FLEX_ELIGIBILITY_AUDIT.csv';f2='CAL26_R84_R82_SAME_POOL_RANK_CORRECTION.csv';f3='CAL26_R84_TWO_ORIGIN_H2_BOOTSTRAP_SKILL_RESEARCH_ONLY.csv'\n write(out/f1,slots);write(out/f2,ranks);write(out/f3,output)\n lines=['# CAL26 R84 \u2014 Claude review adjudication and H2 robustness (read only)','',\n '**Decision: NO PRICE RELEASE, no new FV model scale and no 2028 forecast authorized.**','',\n '## Verified corrections','',\n '- **2026 lineup/scoring spec exists** as `research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json` in the repo; 12 teams, 17 starters/team: 1 QB, 2 RB, 2 WR, 1 TE, 1 FLEX, 1 SUPER_FLEX, 1 K, 2 DL, 2 LB, 2 DB, 2 IDP_FLEX.',\n '- **R82 rankings are on the SAME eligible pool by position.** Claude inferred incorrectly that rank columns use different denominators.',\n '- An absolute LOG FV conversion from surplus remains unidentified. No arbitrary `FV = c * V` has been calibrated.',\n '- **Simple `k[p]+1` position replacement\
        \ cannot fully model shared FLEX/SUPER_FLEX/IDP_FLEX competition.** Optimize lineup slots jointly using genuine player eligibility; do not silently impose a greedy positional ranking.',\n '- **Conditional games \xD7 starter share \xD7 PPG may double-count availability** if frozen seasonal projections already price expected games or role. Define each input conditionality first.',\n '- Historic R83 and this two-origin test are **not genuinely point-in-time forecasts**: the 2021\u21922023 future label was unavailable at the 2022 origin, and the 2022\u21922024 label was unavailable at the 2023 origin.',\n '- Missing same-position observations are not equivalent to verified retirement or lost rosterability. R60 targets missing outcomes as zero; baseline comparisons inherit this data-censoring convention.',\n '', '## Retrospective two-origin H2 stability with paired bootstrap intervals','',\n '| Position | 2022-origin model beats both | 2023-origin model beats both | Lower bounds positive\
        \ in both folds vs both baselines | Exploratory two-fold support |','|---|---|---|---|---|']\n for p in POS:\n  d=[x for x in output if x['position']==p]\n  lines.append('| '+p+' | '+('YES' if d[0]['model_beats_both_point_baselines'] else 'NO')+' | '+('YES' if d[1]['model_beats_both_point_baselines'] else 'NO')+' | '+('YES' if all(x['positive_gain_both_bootstrap_bounds'] for x in d) else 'NO')+' | '+('YES' if bypos[p] else 'NO')+' |')\n lines+=['','**Interpretation:** 4,000 within-position resamples of heldout player records, fixed deterministic seed, exploratory 95% percentile intervals on paired MSE gain. Both folds are retrospective origin holdouts, not prospective date-vintage forecasts. No 2026 Weeks 7+ labels used.',\n '', '## Next production-path decision','',\n 'Build a joint 2026 lineup replacement optimization using this pinned scoring and roster snapshot, with forecast vintage and availability semantics pinned. Until a price numeraire is chosen, report `V` in fantasy points\
        \ above replacement and transparent within-position ranks only. Preserve Maye 5,500 as owner-provisional, Nabers HOLD, Model A live, Model B research-only.','']\n (out/'CAL26_R84_decision.md').write_text('\\n'.join(lines))\n names=[f1,f2,f3,'CAL26_R84_decision.md'];manifest={'workflow':'CAL26_V1R84','status':'CLAUDE_REVIEW_CHECKED_TWO_ORIGIN_RETROSPECTIVE_H2_HOLD',\n   'historical_rows':len(hist),'current_players':len(current),'two_origin_test_rows':sum(x['test_n'] for x in output),\n   'position_count':7,'folds':2,'team_count':12,'required_starters_per_team':sum(SLOT_EXPECT.values()),\n   'same_pool_rank_parity_verified':True,'scoring_snapshot_from_repo':True,'retrospective_origin_split_not_true_point_in_time':True,\n   'historical_missing_future_as_zero_is_assumption':True,'absolute_FV_scale_identified':False,'production_changes':0,\n   'owner_maye_5500_is_provisional':True,'owner_nabers_hold':True,\n   'exploratory_positions_twofold_supported':[p for p in POS if bypos[p]],'output_sha256':{n:sha(out/n)\
        \ for n in names}}\n (out/'CAL26_R84_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')\n print('R84_COMPLETE_NO_RELEASE',json.dumps({k:v for k,v in manifest.items() if k!='output_sha256'}))\n\ndef selftest():\n train=[(1.,5.,'a'),(2.,7.,'b'),(3.,9.,'c')];s,b,m=lin_fit(train)\n require(abs(s-2.)<1e-9 and abs(b-3.)<1e-9 and abs(m-7.)<1e-9,'SELFTEST_FIT')\n low,high=bootstrap_paired([10.,20.],[10.,20.],[0.,0.],'QB',2022,33,300)\n require(low>0 and high>=low,'SELFTEST_BOOTSTRAP')\n print('R84_SELFTEST_GREEN')\n\nif __name__=='__main__':\n a=argparse.ArgumentParser()\n for k in ('r60','r82','r83','snapshot','out'):a.add_argument('--'+k)\n a.add_argument('--selftest',action='store_true');v=a.parse_args()\n if v.selftest:selftest()\n else:\n  require(all(getattr(v,k) for k in ('r60','r82','r83','snapshot','out')),'MISSING_ARGS')\n  run(v)\nPY_R84_ENGINE\npython3 -m py_compile \"$RUNNER_TEMP/CAL26_R84_engine.py\"\npython3 \"$RUNNER_TEMP/CAL26_R84_engine.py\"\
        \ --selftest\npython3 \"$RUNNER_TEMP/CAL26_R84_engine.py\" \\\n  --r60 \"$RUNNER_TEMP/cal26-r84-in/R60\" \\\n  --r82 \"$RUNNER_TEMP/cal26-r84-in/R82\" \\\n  --r83 \"$RUNNER_TEMP/cal26-r84-in/R83\" \\\n  --snapshot research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json \\\n  --out \"$RUNNER_TEMP/cal26-r84-out\"\npython3 - \"$RUNNER_TEMP/cal26-r84-out\" <<'PY_R84_VERIFY'\nimport csv,json,hashlib,pathlib,sys\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R84_manifest.json').read_text())\nassert m['status']=='CLAUDE_REVIEW_CHECKED_TWO_ORIGIN_RETROSPECTIVE_H2_HOLD'\nassert m['historical_rows']==8572 and m['current_players']==518 and m['team_count']==12\nassert m['position_count']==7 and m['folds']==2 and m['required_starters_per_team']==17\nassert m['same_pool_rank_parity_verified'] and m['retrospective_origin_split_not_true_point_in_time']\nassert m['historical_missing_future_as_zero_is_assumption']\nassert m['owner_maye_5500_is_provisional'] and m['owner_nabers_hold']\n\
        assert not m['absolute_FV_scale_identified'] and m['production_changes']==0\nfor name,h in m['output_sha256'].items():\n assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h,name\nwith (p/'CAL26_R84_TWO_ORIGIN_H2_BOOTSTRAP_SKILL_RESEARCH_ONLY.csv').open() as f:r=list(csv.DictReader(f))\nassert len(r)==14 and {z['test_origin_year'] for z in r}=={'2022','2023'}\nassert all(z['genuinely_point_in_time_validated']=='False' and z['forecast_transport_to_2026_Week6_validated']=='False' for z in r)\nwith (p/'CAL26_R84_R82_SAME_POOL_RANK_CORRECTION.csv').open() as f:ranks=list(csv.DictReader(f))\nassert len(ranks)==7 and sum(int(z['identical_eligibility_pool_n']) for z in ranks)==389\nprint('R84_PINNED_SOURCE_AND_GOVERNANCE_GREEN',m['exploratory_positions_twofold_supported'])\nPY_R84_VERIFY\ntest -z \"$(git status --porcelain --untracked-files=all)\"\ncat \"$RUNNER_TEMP/cal26-r84-out/CAL26_R84_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Publish private-safe retrospective robustness no pricing changes
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CAL26_R84_CLAUDE_REVIEW_TWO_ORIGIN_H2_ROBUSTNESS_FV_HOLD
        path: ${{ runner.temp }}/cal26-r84-out/
        retention-days: 60
        if-no-files-found: warn
