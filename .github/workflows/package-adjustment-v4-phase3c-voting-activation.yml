name: Package Adjustment V4 - Phase 3C Voting Activation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact pre-activation state
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase2_manifest.json")" = "ecc8e34baf909ead4cfafb24f90617c96de66b39"
          test "$(git hash-object "$V4/phase3a_signal_feasibility.json")" = "020561dd0dabf4ea11bb7895945ea8c4a7b0f7ce"
          test "$(git hash-object "$V4/phase3a_signal_feasibility_manifest.json")" = "53a4bdf4068bd1eba8d27a0afc43c758edab190b"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog_manifest.json")" = "9e23647b9e877b4b20c1f2ff52ec01ecf7db8fb7"
          test "$(git hash-object index.html)" = "52e1ee216eaf03e06723080f307e4f0086565264"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = "58dd9a7f306b765d4f245decf609fa231c320f6e"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = "33b948d6220cc2597452d229fc3705e198ed70c4"
          test ! -e "$V4/phase3c_voting_release.json"

      - name: Verify V1.6 before activation
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Activate V4 fresh-confirmation voting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import re
          import subprocess
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          d = Path('research/package-adjustment-v4-elite-fragmentation')
          index = Path('index.html')
          ktc_pipe = Path('scripts/market/ktc_pipeline.py')
          regression = Path('scripts/validation/repo_regression_checks.py')
          catalog_path = d / 'phase3b_confirmation_catalog.json'
          manifest_path = d / 'phase3b_confirmation_catalog_manifest.json'
          family_path = d / 'frozen_candidate.json'
          prereg_path = d / 'phase1_structural_preregistration.json'
          feasibility_path = d / 'phase3a_signal_feasibility.json'
          release_path = d / 'phase3c_voting_release.json'

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_blob(path):
              return subprocess.check_output(['git','hash-object',str(path)], text=True).strip()

          def canonical_hash(obj):
              return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(',',':')).encode()).hexdigest()

          prereg = json.loads(prereg_path.read_text())
          family = json.loads(family_path.read_text())
          feasibility = json.loads(feasibility_path.read_text())
          catalog = json.loads(catalog_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          contract = prereg['fresh_confirmation_contract_if_candidate_frozen']
          assert contract['new_vote_namespace'] == '__pkgv4c1__'
          assert contract['challenge_count'] == 240
          assert contract['challenges_per_cell'] == 10
          assert contract['maturity']['exact_effective_vote_checkpoints'] == [600,700,800]
          assert contract['maturity']['minimum_distinct_voters'] == 30
          assert contract['maturity']['minimum_effective_votes_per_cell'] == 15
          assert contract['maturity']['minimum_distinct_voters_per_cell'] == 10

          assert family['status'] == 'FROZEN_V4_CONFIRMATION_FAMILY'
          assert family['family_count'] == 2
          assert family['fresh_vote_namespace_reserved'] == '__pkgv4c1__'
          assert family['asset_eligibility']['players']['explicitly_excluded_players'] == ['Joe Mixon']
          assert family['asset_eligibility']['draft_picks']['years_allowed'] == [2027, 2028]

          assert feasibility['status'] == 'V4_FRESH_CONFIRMATION_SIGNAL_FEASIBLE'
          assert feasibility['human_vote_outcomes_read'] is False
          assert feasibility['all_12_groups_operationally_feasible'] is True

          assert catalog['status'] == 'frozen_unreleased_fresh_confirmation_catalog'
          assert catalog['frozen'] is True
          assert catalog['released'] is False
          assert catalog['voting_activated'] is False
          assert catalog['production_formula_enabled'] is False
          assert catalog['production_revision_retained'] == 'v1.6-v5-size2-composition-overlay'
          assert catalog['vote_namespace_reserved'] == '__pkgv4c1__'
          assert catalog['human_vote_outcomes_read'] is False
          assert catalog['old_v3_600_vote_dataset_read'] is False
          assert catalog['old_nextgen_900_vote_dataset_read'] is False
          assert len(catalog['challenges']) == 240
          diag = catalog['catalog_diagnostics']
          assert diag['research_cell_count'] == 24
          assert diag['challenges_per_cell'] == 10
          assert diag['joe_mixon_occurrences'] == 0
          assert diag['invalid_pick_year_occurrences'] == 0
          assert diag['known_ktc_examples_in_selected_catalog'] == 0
          assert diag['historical_trade_matches_in_selected_catalog'] == 0
          assert diag['stratum_counts'] == {'balanced_broad':120,'candidate_vs_raw_disagreement':120}
          assert sha256(catalog_path) == 'e887d60d468a167ed6ea4c2802f526a929365b644697cfd7e09201b85a6c3627'
          assert manifest['frozen'] is True and manifest['released'] is False
          assert manifest['voting_activated'] is False

          cells = Counter(c['research_cell'] for c in catalog['challenges'])
          assert len(cells) == 24 and set(cells.values()) == {10}
          for c in catalog['challenges']:
              assert c['experiment'] == 'package_adjustment_v4_fresh_confirmation'
              for a in c['side_a'] + c['side_b']:
                  assert a['name'].casefold() != 'joe mixon'
                  if a['kind'] == 'pick':
                      assert int(a['year']) in {2027, 2028}

          source_commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          valid_after = datetime.now(timezone.utc).isoformat()
          raw_url = (
              'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/'
              + source_commit
              + '/research/package-adjustment-v4-elite-fragmentation/phase3b_confirmation_catalog.json'
          )

          # Patch V3-closed browser consumer into V4C1 active consumer.
          text = index.read_text()
          old_start = '/* Package Adjustment V3 Fresh Confirmation: frozen all-asset disagreement catalog.'
          start = text.find(old_start)
          end_marker = 'const PACKAGE_VOTE_V3C1_RESEARCH_CLOSED = true;'
          end = text.find(end_marker, start)
          assert start >= 0 and end >= 0
          end += len(end_marker)

          constants = (
              '/* Package Adjustment V4 Fresh Confirmation: frozen 24-cell catalog.\n'
              'Research-only confirmation evidence. Production Package Adjustment remains V1.6. */\n'
              f"const PACKAGE_VOTE_CHALLENGES_URL = '{raw_url}';\n"
              "const PACKAGE_VOTE_CATALOG_SHA256 = 'e887d60d468a167ed6ea4c2802f526a929365b644697cfd7e09201b85a6c3627';\n"
              'const PACKAGE_VOTE_DAILY_LIMIT = 20;\n'
              'const PACKAGE_VOTE_RECENT_MEMORY = 24;\n'
              f"const PACKAGE_VOTE_VALID_AFTER_UTC = '{valid_after}';\n"
              'let PACKAGE_VOTE_CHALLENGES = null;\n'
              "let PACKAGE_VOTE_STATUS = 'idle';\n"
              'let packageVoteCurrent = null;'
          )
          text = text[:start] + constants + text[end:]

          replacements = [
              ("package_votes_v3c1_", "package_votes_v4c1_"),
              ("package_vote_recent_v3c1", "package_vote_recent_v4c1"),
              ("PACKAGE_VOTE_V3C1_EXACT_CELL_SAMPLING_V1", "PACKAGE_VOTE_V4C1_EXACT_CELL_SAMPLING_V1"),
              ("doc.vote_namespace_reserved !== '__pkgv3c1__'", "doc.vote_namespace_reserved !== '__pkgv4c1__'"),
              ("doc.old_900_vote_dataset_read !== false ||", "doc.old_v3_600_vote_dataset_read !== false ||\ndoc.old_nextgen_900_vote_dataset_read !== false ||"),
              ("c.experiment === 'package_adjustment_v3_fresh_confirmation'", "c.experiment === 'package_adjustment_v4_fresh_confirmation'"),
              ("['g201_vs_g215','g215_vs_g230'].includes(c.disagreement_band)", "['candidate_vs_raw_disagreement','balanced_broad'].includes(c.challenge_stratum)"),
              ("const bandCounts = new Map();", "const stratumCounts = new Map();"),
              ("bandCounts.set(c.disagreement_band, Number(bandCounts.get(c.disagreement_band) || 0) + 1);", "stratumCounts.set(c.challenge_stratum, Number(stratumCounts.get(c.challenge_stratum) || 0) + 1);"),
              ("if(bandCounts.get('g201_vs_g215') !== 120 || bandCounts.get('g215_vs_g230') !== 120){\nthrow new Error('v3c1_catalog_disagreement_balance');\n}", "if(stratumCounts.get('candidate_vs_raw_disagreement') !== 120 || stratumCounts.get('balanced_broad') !== 120){\nthrow new Error('v4c1_catalog_stratum_balance');\n}"),
              ("throw new Error('unexpected frozen V3 confirmation challenge catalog');", "throw new Error('unexpected frozen V4 confirmation challenge catalog');"),
              ("v3c1_catalog_cell_count", "v4c1_catalog_cell_count"),
              ("v3c1_catalog_cell_balance", "v4c1_catalog_cell_balance"),
              ("v3c1_catalog_topology_balance", "v4c1_catalog_topology_balance"),
              ("v3c1_catalog_asset_mix_balance", "v4c1_catalog_asset_mix_balance"),
              ("Package Adjustment V3 confirmation catalog load failed:", "Package Adjustment V4 confirmation catalog load failed:"),
              ("`__pkgv3c1__|${id}|${choice}`", "`__pkgv4c1__|${id}|${choice}`"),
              ("`__pkgv3c1_meta__|${left}`", "`__pkgv4c1_meta__|${left}`"),
              ("'__pkgv3c1_schema__|1'", "'__pkgv4c1_schema__|1'"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError('Expected browser token missing: ' + old)
              text = text.replace(old, new, 1)

          # Strengthen frozen-catalog browser validation for V4 eligibility.
          old_diag = (
              'Number(doc.catalog_diagnostics.historical_trade_matches_in_selected_catalog) !== 0 ||\n'
              '!Array.isArray(doc.challenges) ||'
          )
          new_diag = (
              'Number(doc.catalog_diagnostics.historical_trade_matches_in_selected_catalog) !== 0 ||\n'
              'Number(doc.catalog_diagnostics.joe_mixon_occurrences) !== 0 ||\n'
              'Number(doc.catalog_diagnostics.invalid_pick_year_occurrences) !== 0 ||\n'
              '!Array.isArray(doc.challenges) ||'
          )
          assert old_diag in text
          text = text.replace(old_diag, new_diag, 1)

          old_asset = (
              "typeof a.name === 'string' &&\n"
              "    a.name.length > 0 &&\n"
              "    Number(a.fv) > 0"
          )
          new_asset = (
              "typeof a.name === 'string' &&\n"
              "    a.name.length > 0 &&\n"
              "    a.name.toLowerCase() !== 'joe mixon' &&\n"
              "    Number(a.fv) > 0 &&\n"
              "    (a.kind !== 'pick' || [2027,2028].includes(Number(a.year)))"
          )
          assert old_asset in text
          text = text.replace(old_asset, new_asset, 1)

          # Remove the V3 closed-submit guard and closed-render branch.
          text = text.replace('if(PACKAGE_VOTE_V3C1_RESEARCH_CLOSED) return;\n', '', 1)
          closed_pattern = re.compile(
              r"/\* PACKAGE_VOTE_V3C1_RESEARCH_CLOSED_V1.*?\*/\n"
              r"if\(PACKAGE_VOTE_V3C1_RESEARCH_CLOSED\)\{.*?\n\}\n\n",
              re.S,
          )
          text, n = closed_pattern.subn('', text, count=1)
          if n != 1:
              raise RuntimeError(f'Expected one V3 closed render block; removed {n}')

          index.write_text(text)

          # Extend KTC/Market Value transport isolation before V4 votes can exist.
          pipe = ktc_pipe.read_text()
          old_prefix = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|", "__pkgv5__|", "__pkgnv2__|", "__pkgnv2p1__|", "__pkgv6__|", "__pkgv3c1__|")'
          new_prefix = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|", "__pkgv5__|", "__pkgnv2__|", "__pkgnv2p1__|", "__pkgv6__|", "__pkgv3c1__|", "__pkgv4c1__|")'
          assert pipe.count(old_prefix) == 1
          pipe = pipe.replace(old_prefix, new_prefix, 1)
          pipe = pipe.replace(
              '# Package Preference Voting V1-V6, NextGen V2, and V3 fresh confirmation\n# share transport only.',
              '# Package Preference Voting V1-V6, NextGen V2, plus V3/V4 fresh confirmation\n# share transport only.',
              1,
          )
          ktc_pipe.write_text(pipe)

          # Update exact regression prefix family and sampling contract.
          reg = regression.read_text()
          old_tail = (
              '        "__pkgv6__|",\n'
              '        "__pkgv3c1__|",\n'
              '    )'
          )
          new_tail = (
              '        "__pkgv6__|",\n'
              '        "__pkgv3c1__|",\n'
              '        "__pkgv4c1__|",\n'
              '    )'
          )
          assert reg.count(old_tail) == 1
          reg = reg.replace(old_tail, new_tail, 1)

          start = reg.index('def check_package_sampling_contract():')
          end = reg.index('\ndef check_index_js_syntax():', start)
          block = '''def check_package_sampling_contract():
              text = INDEX.read_text(encoding="utf-8")
              start = text.index("function packageVoteTodayKey(){")
              end = text.index("\\nfunction render(){", start)
              block = text[start:end]
          
              assert "PACKAGE_VOTE_V4C1_EXACT_CELL_SAMPLING_V1" in block
              assert "PACKAGE_VOTE_V3C1_RESEARCH_CLOSED" not in block
              assert "function packageVoteOwnPlayers()" not in block
              assert "function packageVoteEligibleChallenges()" not in block
              assert "own.has(" not in block
              assert "const byCell = new Map();" in block
              assert "const cells = Array.from(byCell.keys()).sort();" in block
              assert "if(cells.length !== 24) return null;" in block
              assert "if(!cellPool || cellPool.length !== 10) return null;" in block
              assert "const selectedCell = cells[Math.floor(Math.random() * cells.length)];" in block
              assert "let challengePool = cellPool.filter(c => !recent.has(c.id));" in block
              assert "left: Math.random() < 0.5 ? 'A' : 'B'" in block
              assert "Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)" in block
              assert block.index("const selectedCell =") < block.index("const recent = new Set(packageVoteRecent());")
          
              assert "Package Adjustment V4 Fresh Confirmation: frozen 24-cell catalog." in text
              assert "const PACKAGE_VOTE_DAILY_LIMIT = 20;" in text
              assert "__pkgv4c1__|" in text
              assert "__pkgv4c1_meta__|" in text
              assert "__pkgv4c1_schema__|1" in text
              assert "package_votes_v4c1_" in block
              assert "package_vote_recent_v4c1" in block
              assert "doc.challenges.length !== 240" in block
              assert "cells.size !== 24" in block
              assert "n !== 10" in block
              assert "topologyCounts.size !== 6" in block
              assert "mixCounts.get('players_only') !== 120" in block
              assert "stratumCounts.get('candidate_vs_raw_disagreement') !== 120" in block
              assert "stratumCounts.get('balanced_broad') !== 120" in block
              assert "Number(doc.catalog_diagnostics.joe_mixon_occurrences) !== 0" in block
              assert "Number(doc.catalog_diagnostics.invalid_pick_year_occurrences) !== 0" in block
              assert "a.name.toLowerCase() !== 'joe mixon'" in block
              assert "[2027,2028].includes(Number(a.year))" in block
          
              print("PASS V4C1 exact 24-cell fresh-confirmation sampling contract")
          
          '''
          regression.write_text(reg[:start] + block + reg[end:])

          # Prove transport isolation AST after patch.
          tree = ast.parse(ktc_pipe.read_text())
          prefixes = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'PACKAGE_VOTE_PREFIXES':
                          prefixes = ast.literal_eval(node.value)
                          break
              if prefixes is not None:
                  break
          assert '__pkgv3c1__|' in prefixes
          assert '__pkgv4c1__|' in prefixes

          release = {
              'schema_version': 1,
              'study_id': 'package-adjustment-v4-elite-fragmentation',
              'phase': '3C',
              'status': 'FRESH_CONFIRMATION_VOTING_ACTIVE',
              'source_commit_before_activation': source_commit,
              'valid_after_utc': valid_after,
              'vote_namespace': '__pkgv4c1__',
              'vote_meta_namespace': '__pkgv4c1_meta__',
              'vote_schema_marker': '__pkgv4c1_schema__|1',
              'catalog_git_blob': git_blob(catalog_path),
              'catalog_sha256': sha256(catalog_path),
              'catalog_challenge_fingerprint_sha256': canonical_hash(catalog['challenges']),
              'candidate_family_fingerprint_sha256': catalog['candidate_family_fingerprint_sha256'],
              'frozen_candidate_ids': [c['id'] for c in family['candidate_family']],
              'catalog_challenge_count': 240,
              'research_cell_count': 24,
              'challenges_per_cell': 10,
              'targeted_challenge_count': 120,
              'broad_balanced_challenge_count': 120,
              'daily_client_vote_limit': 20,
              'recent_memory': 24,
              'display_side_randomization': True,
              'values_hidden_from_voter_ui': True,
              'candidate_identity_hidden_from_voter_ui': True,
              'candidate_predictions_hidden_from_voter_ui': True,
              'joe_mixon_excluded': True,
              'pick_years_allowed': [2027, 2028],
              'old_v3_600_vote_rows_count_for_this_study': False,
              'old_nextgen_900_vote_rows_count_for_this_study': False,
              'normal_ktc_transport_isolation_extended': True,
              'frozen_catalog_mutated': False,
              'production_change_authorized': False,
              'production_revision_retained': 'v1.6-v5-size2-composition-overlay',
          }
          release_path.write_text(json.dumps(release, indent=2, sort_keys=True) + '\n')

          print('PASS: V4C1 browser voting activated from frozen catalog.')
          print('VALID_AFTER_UTC=' + valid_after)
          PY

      - name: Verify activation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, json, re
          from pathlib import Path
          d = Path('research/package-adjustment-v4-elite-fragmentation')
          release = json.loads((d / 'phase3c_voting_release.json').read_text())
          assert release['status'] == 'FRESH_CONFIRMATION_VOTING_ACTIVE'
          assert release['vote_namespace'] == '__pkgv4c1__'
          assert release['vote_meta_namespace'] == '__pkgv4c1_meta__'
          assert release['vote_schema_marker'] == '__pkgv4c1_schema__|1'
          assert release['catalog_challenge_count'] == 240
          assert release['research_cell_count'] == 24
          assert release['targeted_challenge_count'] == 120
          assert release['broad_balanced_challenge_count'] == 120
          assert release['joe_mixon_excluded'] is True
          assert release['pick_years_allowed'] == [2027, 2028]
          assert release['production_change_authorized'] is False

          text = Path('index.html').read_text()
          assert 'PACKAGE_VOTE_V4C1_EXACT_CELL_SAMPLING_V1' in text
          assert '__pkgv4c1__|' in text
          assert '__pkgv4c1_meta__|' in text
          assert '__pkgv4c1_schema__|1' in text
          assert 'PACKAGE_VOTE_V3C1_RESEARCH_CLOSED' not in text
          m = re.search(r"const PACKAGE_VOTE_VALID_AFTER_UTC = '([^']+)';", text)
          assert m and m.group(1) == release['valid_after_utc']

          tree = ast.parse(Path('scripts/market/ktc_pipeline.py').read_text())
          prefixes = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'PACKAGE_VOTE_PREFIXES':
                          prefixes = ast.literal_eval(node.value)
                          break
              if prefixes is not None:
                  break
          assert '__pkgv3c1__|' in prefixes
          assert '__pkgv4c1__|' in prefixes
          print('PASS: V4C1 activation and KTC transport isolation verified.')
          PY

      - name: KTC transport self-test
        run: python3 scripts/market/ktc_pipeline.py --selftest

      - name: Run full repository regressions
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after activation
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed activation workflow
        run: git rm .github/workflows/package-adjustment-v4-phase3c-voting-activation.yml

      - name: Stage exact activation scope
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"
          git add index.html scripts/market/ktc_pipeline.py scripts/validation/repo_regression_checks.py "$V4/phase3c_voting_release.json"
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'index.html',
              'scripts/market/ktc_pipeline.py',
              'scripts/validation/repo_regression_checks.py',
              'research/package-adjustment-v4-elite-fragmentation/phase3c_voting_release.json',
              '.github/workflows/package-adjustment-v4-phase3c-voting-activation.yml',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if changed != expected:
              raise RuntimeError(f'Unexpected V4 Phase 3C scope: {sorted(changed)}')
          print('PASS: exact five-file V4 activation scope staged.')
          PY

      - name: Commit V4 voting activation
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Activate Package Adjustment V4 confirmation voting"
          git pull --rebase origin main
          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test ! -e .github/workflows/package-adjustment-v4-phase3c-voting-activation.yml
          python3 scripts/market/ktc_pipeline.py --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin main
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('research/package-adjustment-v4-elite-fragmentation/phase3c_voting_release.json').read_text())
          print('V4_PHASE3C_STATUS=' + release['status'])
          print('V4_VALID_AFTER_UTC=' + release['valid_after_utc'])
          PY
          git log --oneline -1
