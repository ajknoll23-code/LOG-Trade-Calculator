name: Free Agent Utility V1 - Regression Guard Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Verify exact stale guard and legitimate V9 transport
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python3 - <<'PY'
          import ast
          from pathlib import Path

          reg_path = Path("scripts/validation/repo_regression_checks.py")
          ktc_path = Path("scripts/market/ktc_pipeline.py")
          reg = reg_path.read_text(encoding="utf-8")
          ktc = ktc_path.read_text(encoding="utf-8")

          tree = ast.parse(ktc)
          package_prefixes = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "PACKAGE_VOTE_PREFIXES":
                          package_prefixes = ast.literal_eval(node.value)
                          break
              if package_prefixes is not None:
                  break

          assert package_prefixes is not None, "PACKAGE_VOTE_PREFIXES not found"
          assert "__pkgv9val__|" in package_prefixes, (
              "V9 package validation prefix is not active in ktc_pipeline.py"
          )

          stale = "\n".join([
              '        "__pkgv7dev__|",',
              '        "__pkgv8dev__|",',
              '    )',
          ])
          patched = "\n".join([
              '        "__pkgv7dev__|",',
              '        "__pkgv8dev__|",',
              '        "__pkgv9val__|",',
              '    )',
          ])

          assert reg.count(stale) == 1, (
              "Expected exact stale regression guard not found once. "
              "Refusing unexpected repository state."
          )
          assert patched not in reg, "Regression guard already patched"

          print("PASS: exact stale regression guard confirmed.")
          print("PASS: __pkgv9val__| is a legitimate active package-vote transport prefix.")
          PY

      - name: Patch only V9 reserved prefix expectation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validation/repo_regression_checks.py")
          text = path.read_text(encoding="utf-8")

          old = "\n".join([
              '        "__pkgv7dev__|",',
              '        "__pkgv8dev__|",',
              '    )',
          ])
          new = "\n".join([
              '        "__pkgv7dev__|",',
              '        "__pkgv8dev__|",',
              '        "__pkgv9val__|",',
              '    )',
          ])

          assert text.count(old) == 1, "stale expected-prefix block count != 1"
          patched = text.replace(old, new, 1)
          assert patched.count('"__pkgv9val__|"') == 1, (
              "patched regression file must contain exactly one V9 prefix expectation"
          )
          path.write_text(patched, encoding="utf-8")
          print("PASS: added __pkgv9val__| to permanent package-vote isolation regression guard.")
          PY

          python3 -m py_compile scripts/validation/repo_regression_checks.py
          git diff --check
          git diff -- scripts/validation/repo_regression_checks.py

          CHANGED="$(git status --porcelain=v1 --untracked-files=all | awk '{print substr($0,4)}' | sort)"
          test "$CHANGED" = "scripts/validation/repo_regression_checks.py"

      - name: Run full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit operational regression repair
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "free-agent-utility-repair-bot"
          git config user.email "actions@users.noreply.github.com"

          git add scripts/validation/repo_regression_checks.py
          CHANGED="$(git diff --cached --name-only | sort)"
          test "$CHANGED" = "scripts/validation/repo_regression_checks.py"

          git commit -m "Repair package vote regression guard for V9 validation transport"

          git fetch origin main
          git rebase origin/main

          CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          test "$CHANGED" = "scripts/validation/repo_regression_checks.py"

          git push origin HEAD:main
          echo "PASS: regression guard repaired and committed to main."
