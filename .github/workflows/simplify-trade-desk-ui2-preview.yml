name: Simplify Trade Desk UI2 Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked preview and production
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PREVIEW_BLOB="0e00af09175462c7eb4a4724e6c50a997e7d9ebf"
          EXPECTED_INDEX_BLOB="0f587dcb9740d0986acc705b305cdaa6217c0ae9"

          ACTUAL_PREVIEW_BLOB="$(git hash-object trade-desk-preview.html)"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"

          echo "Expected preview: $EXPECTED_PREVIEW_BLOB"
          echo "Actual preview:   $ACTUAL_PREVIEW_BLOB"
          echo "Expected index:   $EXPECTED_INDEX_BLOB"
          echo "Actual index:     $ACTUAL_INDEX_BLOB"

          test "$ACTUAL_PREVIEW_BLOB" = "$EXPECTED_PREVIEW_BLOB"
          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve pre-simplification rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-preview-pre-ui21-simplification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Apply UI2.1 simplification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("trade-desk-preview.html")
          text = path.read_text(encoding="utf-8")

          marker = "TRADE_DESK_UI21_SIMPLIFY_V1"

          if marker in text:
              raise SystemExit(f"{marker} already present; refusing to double-apply.")

          required = [
              "TRADE_DESK_UI2_FULL_COPY_PREVIEW_V1",
              'id="sidesWrap"',
              'class="meter-wrap"',
              "trade-impact",
              "THE MAULING METER",
              "HOW VALUES ARE CALCULATED",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError(
                  "Preview structure changed; required UI2.1 hooks are missing: "
                  + ", ".join(missing)
              )

          css = r'''
          <style id="trade-desk-ui21-simplify-styles">
          /* TRADE_DESK_UI21_SIMPLIFY_V1
             Presentation / information hierarchy only. */

          .ui2-workspace-title{
            font-size:18px!important;
          }

          .ui2-workspace-help{
            display:none!important;
          }

          /* The old mobile sticky verdict repeated the same answer. */
          .ui2-mobile-summary{
            display:none!important;
          }

          /* One answer card, after the assets on mobile. */
          .meter-wrap::before{
            content:'TRADE RESULT'!important;
          }

          .ui21-add-asset-toggle{
            width:100%;
            min-height:38px;
            border:1px dashed var(--line-strong);
            border-radius:8px;
            background:rgba(255,255,255,.025);
            color:var(--text-muted);
            font-family:'Inter',sans-serif;
            font-size:10px;
            font-weight:800;
            letter-spacing:.045em;
            text-transform:uppercase;
            cursor:pointer;
          }

          .ui21-add-asset-toggle:hover{
            color:var(--text);
            border-color:rgba(235,98,97,.34);
            background:rgba(235,98,97,.045);
          }

          .side.ui21-add-open .ui21-add-asset-toggle{
            margin-bottom:10px;
            border-style:solid;
            color:var(--text);
          }

          /* Keep the forms out of the way until Add Asset is explicitly opened. */
          .side:not(.ui21-add-open) .add-controls > :not(.ui21-add-asset-toggle){
            display:none!important;
          }

          .ui21-team-impact,
          .ui21-advanced{
            margin-top:11px!important;
            border:1px solid var(--line)!important;
            border-radius:12px!important;
            background:var(--panel)!important;
            box-shadow:var(--ui2-soft-shadow)!important;
            overflow:hidden;
          }

          .ui21-team-impact > summary,
          .ui21-advanced > summary{
            position:relative;
            min-height:51px;
            display:grid;
            align-items:center;
            gap:4px 10px;
            padding:10px 42px 10px 13px;
            list-style:none;
            cursor:pointer;
            user-select:none;
          }

          .ui21-team-impact > summary::-webkit-details-marker,
          .ui21-advanced > summary::-webkit-details-marker{
            display:none;
          }

          .ui21-team-impact > summary::after,
          .ui21-advanced > summary::after{
            content:'+';
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            color:var(--text-dim);
            font-size:18px;
            font-weight:400;
          }

          .ui21-team-impact[open] > summary::after,
          .ui21-advanced[open] > summary::after{
            content:'−';
            color:var(--gold);
          }

          .ui21-team-impact[open] > summary,
          .ui21-advanced[open] > summary{
            border-bottom:1px solid var(--line);
          }

          .ui21-summary-label{
            color:var(--text);
            font-family:'Inter',sans-serif;
            font-size:12px;
            font-weight:800;
          }

          .ui21-summary-value{
            color:var(--text-muted);
            font-family:'IBM Plex Mono',monospace;
            font-size:9px;
            line-height:1.35;
          }

          .ui21-summary-value.is-negative{
            color:var(--red);
          }

          .ui21-summary-value.is-positive{
            color:var(--green);
          }

          .ui21-team-impact .trade-impact{
            margin:0!important;
            border:0!important;
            border-radius:0!important;
            box-shadow:none!important;
            background:rgba(4,14,24,.10)!important;
          }

          .ui21-advanced-body{
            display:grid;
            gap:10px;
            padding:10px;
            background:rgba(4,14,24,.10);
          }

          .ui21-advanced-body > *{
            margin:0!important;
          }

          @media(max-width:720px){
            .wrap{
              padding-bottom:38px!important;
            }

            .ui2-workspace-kicker{
              margin-top:2px!important;
              margin-bottom:8px!important;
            }

            .ui2-workspace-eyebrow{
              display:none!important;
            }

            .ui2-workspace-title{
              font-size:17px!important;
            }

            .ui2-trade-workspace{
              gap:10px!important;
            }

            /* Critical flow change:
               Side A -> Side B -> one Trade Result. */
            .ui2-trade-workspace>#sidesWrap{
              order:1!important;
            }

            .ui2-trade-workspace>.meter-wrap{
              order:2!important;
              padding:14px 13px!important;
            }

            .meter-verdict{
              font-size:24px!important;
            }

            .meter-sub{
              margin-bottom:10px!important;
            }

            .side{
              border-radius:12px!important;
            }

            .side-head{
              min-height:53px!important;
              padding:11px 12px 9px!important;
            }

            .asset-list{
              padding:8px!important;
            }

            .asset-row{
              min-height:51px!important;
              padding:8px!important;
            }

            .add-controls{
              padding:8px!important;
            }

            .ui21-team-impact,
            .ui21-advanced{
              margin-top:10px!important;
            }
          }
          </style>
          '''

          js = r'''
          <script id="trade-desk-ui21-simplify-runtime">
          /* TRADE_DESK_UI21_SIMPLIFY_V1 — presentation only. */
          (function () {
            'use strict';

            function init() {
              if (document.documentElement.dataset.tradeDeskUi21 === '1') return;
              document.documentElement.dataset.tradeDeskUi21 = '1';

              const wrap = document.querySelector('.wrap');
              const sides = document.getElementById('sidesWrap');
              const meter = document.querySelector('.meter-wrap');

              if (!wrap || !sides || !meter) {
                console.error('UI2.1: required trade workspace nodes are missing.');
                return;
              }

              const title = document.querySelector('.ui2-workspace-title');
              if (title) title.textContent = 'Build Trade';

              /* -------- Compact Add Asset controls -------- */
              function installAddToggle(side) {
                if (!side || side.querySelector('.ui21-add-asset-toggle')) return;

                const controls = side.querySelector('.add-controls');
                if (!controls) return;

                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = 'ui21-add-asset-toggle';
                toggle.textContent = '+ Add Asset';

                toggle.addEventListener('click', () => {
                  const opening = !side.classList.contains('ui21-add-open');
                  side.classList.toggle('ui21-add-open', opening);
                  toggle.textContent = opening ? '− Close Asset Form' : '+ Add Asset';
                });

                controls.insertBefore(toggle, controls.firstChild);

                const assetList = side.querySelector('.asset-list');
                if (assetList && typeof MutationObserver !== 'undefined') {
                  let previousCount = assetList.querySelectorAll('.asset-row').length;

                  new MutationObserver(() => {
                    const nextCount = assetList.querySelectorAll('.asset-row').length;
                    if (nextCount > previousCount) {
                      side.classList.remove('ui21-add-open');
                      toggle.textContent = '+ Add Asset';
                    }
                    previousCount = nextCount;
                  }).observe(assetList, { childList:true, subtree:true });
                }
              }

              installAddToggle(sides.querySelector('.side-a'));
              installAddToggle(sides.querySelector('.side-b'));

              /* -------- Compact Team Impact -------- */
              const impact = document.querySelector('.trade-impact');

              if (impact && !impact.closest('.ui21-team-impact')) {
                const shell = document.createElement('details');
                shell.className = 'ui21-team-impact';

                const summary = document.createElement('summary');
                summary.innerHTML =
                  '<span class="ui21-summary-label">Team Impact</span>' +
                  '<span class="ui21-summary-value" id="ui21ImpactSnapshot">' +
                    'View lineup effect' +
                  '</span>';

                impact.parentNode.insertBefore(shell, impact);
                shell.appendChild(summary);
                shell.appendChild(impact);

                const snapshot = document.getElementById('ui21ImpactSnapshot');

                function refreshImpactSummary() {
                  if (!snapshot) return;

                  const raw = (impact.innerText || '')
                    .replace(/\s+/g, ' ')
                    .trim();

                  const utilityMatch = raw.match(
                    /Team Utility:\s*([+\-−]?\s*\d[\d,]*)/i
                  );

                  const depthMatch = raw.match(
                    /\b(QB|RB|WR|TE|DL|LB|DB|K):\s*.*?\(([^)]+)\)/i
                  );

                  const parts = [];

                  if (utilityMatch) {
                    const utility = utilityMatch[1].replace(/\s+/g, '');
                    parts.push('Lineup ' + utility);

                    snapshot.classList.toggle(
                      'is-negative',
                      /^[-−]/.test(utility)
                    );
                    snapshot.classList.toggle(
                      'is-positive',
                      /^\+/.test(utility)
                    );
                  } else {
                    snapshot.classList.remove('is-negative', 'is-positive');
                  }

                  if (depthMatch) {
                    parts.push(
                      depthMatch[1].toUpperCase() + ' ' + depthMatch[2].trim()
                    );
                  }

                  snapshot.textContent =
                    parts.length ? parts.join(' · ') : 'View lineup effect';
                }

                refreshImpactSummary();

                if (typeof MutationObserver !== 'undefined') {
                  new MutationObserver(refreshImpactSummary).observe(impact, {
                    childList:true,
                    subtree:true,
                    characterData:true
                  });
                }
              }

              /* -------- Advanced Analysis --------
                 Keep the information available, but stop making it compete
                 with the primary trade verdict. */
              function directChildByText(needle) {
                const normalized = needle.toUpperCase();

                for (const child of Array.from(wrap.children)) {
                  if ((child.textContent || '').toUpperCase().includes(normalized)) {
                    return child;
                  }
                }

                const all = Array.from(
                  wrap.querySelectorAll('section,details,div')
                );

                const hit = all.find(el =>
                  (el.textContent || '').toUpperCase().includes(normalized)
                );

                if (!hit) return null;

                let node = hit;
                while (node.parentElement && node.parentElement !== wrap) {
                  node = node.parentElement;
                }
                return node.parentElement === wrap ? node : null;
              }

              const mauling = directChildByText('THE MAULING METER');
              const methodology = directChildByText('HOW VALUES ARE CALCULATED');

              const advancedItems = [mauling, methodology]
                .filter(Boolean)
                .filter((node, index, arr) => arr.indexOf(node) === index);

              if (advancedItems.length) {
                const advanced = document.createElement('details');
                advanced.className = 'ui21-advanced';

                const summary = document.createElement('summary');
                summary.innerHTML =
                  '<span class="ui21-summary-label">Advanced Analysis</span>' +
                  '<span class="ui21-summary-value">' +
                    'Mauling meter, methodology & model detail' +
                  '</span>';

                const body = document.createElement('div');
                body.className = 'ui21-advanced-body';

                const impactShell = document.querySelector('.ui21-team-impact');
                const anchor = impactShell || meter.closest('.ui2-trade-workspace');

                if (anchor && anchor.parentNode) {
                  anchor.insertAdjacentElement('afterend', advanced);
                } else {
                  wrap.appendChild(advanced);
                }

                advanced.appendChild(summary);
                advanced.appendChild(body);

                advancedItems.forEach(node => {
                  if (node !== advanced && !advanced.contains(node)) {
                    body.appendChild(node);
                  }
                });
              }
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init, { once:true });
            } else {
              init();
            }
          })();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text or "</body>" not in text:
              raise RuntimeError("Preview is missing closing head/body tags")

          text = text.replace("</head>", css + "\n</head>", 1)
          text = text.replace("</body>", js + "\n</body>", 1)

          if text.count(marker) != 2:
              # Marker intentionally appears once in CSS comment and once in JS comment.
              raise RuntimeError(
                  f"Unexpected {marker} marker count: {text.count(marker)}"
              )

          path.write_text(text, encoding="utf-8")
          print("PASS UI2.1 simplification applied")
          PY

      - name: Validate UI2.1 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("trade-desk-preview.html").read_text(encoding="utf-8")
          match = re.search(
              r'<script id="trade-desk-ui21-simplify-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )

          if not match:
              raise SystemExit("UI2.1 runtime block not found")

          out = Path("/tmp/trade-desk-ui21.js")
          out.write_text(match.group(1), encoding="utf-8")

          for label, block in [
              (
                  "UI2.1 CSS",
                  re.search(
                      r'<style id="trade-desk-ui21-simplify-styles">(.*?)</style>',
                      html,
                      flags=re.S,
                  ).group(1)
              ),
              ("UI2.1 JS", match.group(1)),
          ]:
              bad = [
                  i for i, line in enumerate(block.splitlines(), 1)
                  if line != line.rstrip()
              ]
              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at relative lines {bad[:10]}"
                  )
              print(f"PASS {label} whitespace")

          print(out)
          PY

          node --check /tmp/trade-desk-ui21.js

      - name: Validate existing runtime guards
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Verify production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0f587dcb9740d0986acc705b305cdaa6217c0ae9"
          git diff --exit-code -- index.html

      - name: Commit simplified preview only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trade-desk-preview.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "trade-desk-preview.html"

          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi

          git commit -m "Simplify Trade Desk UI2 preview"
          git push origin HEAD:main
