name: Package Adjustment Audit Step 9 Final Signoff

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repo regression dependency
        run: pip install requests

      - name: Run permanent Package Adjustment validator
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run full repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Final adversarial audit and sign-off bookkeeping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile

          ROOT = Path(".")
          BASE = ROOT / "research/package-adjustment-production-candidate-v1"
          LIVE = BASE / "live_deployment.json"
          PLAN = BASE / "audit_clean_plan.md"
          STEP7 = BASE / "audit_step7_permanent_regression.json"
          V1_4 = BASE / "prospective/release_manifest.json"
          V1_5 = BASE / "prospective/release_manifest_v1_5.json"
          OOS = BASE / "prospective/exact_live_oos_validation.json"
          FREEZE = BASE / "prelaunch-vote-freeze/manifest.json"
          INDEX = ROOT / "index.html"
          VALIDATOR = ROOT / "scripts/validation/check_package_adjustment_live.py"
          REGRESSION = ROOT / "scripts/validation/repo_regression_checks.py"
          BUILDER = ROOT / "scripts/market/build_package_adjustment_shadow_v2.py"
          WORKFLOWS = ROOT / ".github/workflows"
          STEP9_WORKFLOW = WORKFLOWS / "package-adjustment-audit-step9-final-signoff.yml"

          OUT8_JSON = BASE / "audit_step8_workflow_cleanup.json"
          OUT8_MD = BASE / "audit_step8_workflow_cleanup.md"
          OUT9_JSON = BASE / "audit_step9_final_signoff.json"
          OUT9_MD = BASE / "audit_step9_final_signoff.md"

          EXPECTED_POSITIONS = ["QB", "RB", "WR", "TE", "DL", "LB", "DB"]

          REMOVED_WORKFLOWS = [
              "package-vote-aggregation-v3-shadow.yml",
              "install-package-shadow-v2-oos-validation.yml",
              "fix-package-adjustment-live-copy.yml",
              "activate-package-adjustment-controlled-live.yml",
              "validate-package-adjustment-production-candidate.yml",
              "package-adjustment-audit-step1.yml",
              "package-adjustment-audit-step2-analysis.yml",
              "package-adjustment-audit-step2-hardening.yml",
              "package-adjustment-audit-step3-analysis.yml",
              "package-adjustment-audit-step3-hardening.yml",
              "package-adjustment-audit-step5-vote-freeze.yml",
              "package-adjustment-audit-step6-analysis.yml",
              "package-adjustment-audit-step6-hardening.yml",
              "package-adjustment-audit-step7-permanent-regression.yml",
              "activate-package-vote-v3-fixed.yml",
              "activate-package-vote-v4.yml",
              "build-package-adjustment-shadow-v2.yml",
              "set-package-v3-daily-limit-20.yml",
          ]

          STEADY_STATE_WORKFLOWS = [
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "package-vote-aggregation-v3.yml",
              "prospective-trade-evidence-capture.yml",
              "repo-regression-checks.yml",
          ]


          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))


          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def canonical(obj):
              return json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=True)


          def assert_token(text, token, label):
              assert token in text, f"{label} missing token: {token}"


          required = [
              LIVE, PLAN, STEP7, V1_4, V1_5, OOS, FREEZE, INDEX,
              VALIDATOR, REGRESSION, BUILDER, STEP9_WORKFLOW,
          ]
          for path in required:
              assert path.exists(), f"missing final-audit artifact: {path}"

          live = read_json(LIVE)
          v1_4 = read_json(V1_4)
          v1_5 = read_json(V1_5)
          oos = read_json(OOS)
          freeze = read_json(FREEZE)
          step7 = read_json(STEP7)
          formula_before = canonical(live["formula"])

          assert live["status"] == "controlled_live"
          assert live["production_formula_enabled"] is True
          assert live["production_revision"] == "v1.5-audit-step6-scope-ui-idp"
          assert live["monitoring_release_id"] == v1_5["release_id"]
          assert live["exact_live_prospective_monitoring"] is True
          assert live["formula"]["supported_player_positions"] == EXPECTED_POSITIONS
          assert live["fundamental_value_consumer_changed"] is False
          assert live["market_value_consumer_changed"] is False
          assert live["draft_pick_value_consumer_changed"] is False
          assert live["team_utility_consumer_changed"] is False
          assert live["trade_verdict_consumer_changed"] is True

          assert v1_5["frozen"] is True
          assert v1_5["status"] == "exact_live_oos_release_manifest"
          assert v1_5["release_id"] == "package-adjustment-exact-live-v1.5-step6-realignment"
          assert v1_5["production_revision_at_release"] == live["production_revision"]
          assert v1_5["production_status"] == "controlled_live"
          assert v1_5["methodology"]["automatic_production_change_allowed"] is False
          assert v1_5["methodology"]["supported_player_positions"] == EXPECTED_POSITIONS
          assert v1_5["methodology"]["unsupported_positions_fail_closed"] is True
          assert v1_5["methodology"]["unsupported_composition_fails_closed"] is True

          assert v1_4["frozen"] is True
          assert v1_4["release_id"] == "package-adjustment-exact-live-v1.4-step4"
          assert sha256(V1_4) == v1_5["previous_release_manifest_sha256"]
          assert v1_5["supersedes_for_active_monitoring"] == v1_4["release_id"]

          assert freeze["frozen"] is True
          assert freeze["status"] == "package_adjustment_prelaunch_vote_evidence_freeze"
          assert step7["status"] == "package_adjustment_audit_step7_permanent_regression"
          assert step7["production_formula_changed"] is False
          assert step7["repo_regression_group_count_after"] == 13
          assert step7["repo_regression_hook"] == "check_package_adjustment_live.validate"

          for name in REMOVED_WORKFLOWS:
              assert not (WORKFLOWS / name).exists(), f"obsolete workflow still present: {name}"
          for name in STEADY_STATE_WORKFLOWS:
              assert (WORKFLOWS / name).exists(), f"required active workflow missing: {name}"

          def package_related(name):
              return (
                  name.startswith("package-adjustment-")
                  or name.startswith("package-vote-")
                  or name in {"prospective-trade-evidence-capture.yml", "repo-regression-checks.yml"}
              )

          actual_package_related = sorted(
              p.name for p in WORKFLOWS.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"} and package_related(p.name)
          )
          expected_during_step9 = sorted(STEADY_STATE_WORKFLOWS + [STEP9_WORKFLOW.name])
          assert actual_package_related == expected_during_step9, (
              "unexpected Package Adjustment workflow inventory: "
              f"{actual_package_related} != {expected_during_step9}"
          )

          vote_workflow = (WORKFLOWS / "package-vote-aggregation-v3.yml").read_text(encoding="utf-8")
          assert_token(vote_workflow, "cron: '23 11 * * *'", "V4 vote workflow")
          assert_token(vote_workflow, "scripts/market/package_vote_v4_pipeline.py", "V4 vote workflow")
          assert "scripts/market/package_vote_v3_pipeline.py" not in vote_workflow
          assert_token(vote_workflow, "scripts/market/build_package_adjustment_shadow_v2.py", "V4 vote workflow")

          builder_text = BUILDER.read_text(encoding="utf-8")
          assert_token(builder_text, "PRELAUNCH_VOTE_FREEZE", "Shadow V2 builder")
          assert_token(builder_text, "Shadow V2 rebuild from post-launch vote evidence is disabled.", "Shadow V2 builder")

          capture_workflow = (WORKFLOWS / "prospective-trade-evidence-capture.yml").read_text(encoding="utf-8")
          assert_token(capture_workflow, "cron: '30 16 * * *'", "prospective capture")
          assert_token(capture_workflow, "capture_prospective_trade_evidence.py --write", "prospective capture")
          for token in (
              'requires_snapshot_strictly_before_trade',
              'post_trade_values_never_substituted',
              'future_pick_default_tier_without_signal',
          ):
              assert_token(capture_workflow, token, "prospective capture")

          monitor_workflow = (WORKFLOWS / "package-adjustment-audit-step4-exact-live-oos.yml")
          monitor_text = monitor_workflow.read_text(encoding="utf-8")
          assert_token(monitor_text, "cron: '0 17 * * *'", "exact-live OOS monitor")
          assert sha256(monitor_workflow) == v1_5["release_artifact_sha256"]["monitor_workflow"]

          repo_workflow = (WORKFLOWS / "repo-regression-checks.yml").read_text(encoding="utf-8")
          assert_token(repo_workflow, "scripts/validation/repo_regression_checks.py", "repo regression workflow")
          regression_text = REGRESSION.read_text(encoding="utf-8")
          assert_token(regression_text, "import check_package_adjustment_live", "repo regression checker")
          assert_token(regression_text, "check_package_adjustment_live.validate,", "repo regression checker")

          assert oos["status"] == "controlled_live_exact_formula_prospective_oos_monitoring"
          assert oos["release"]["release_id"] == v1_5["release_id"]
          assert oos["release"]["exact_live_formula_sha256"] == v1_5["exact_live_formula_sha256"]
          assert oos["methodology"]["supported_player_positions"] == EXPECTED_POSITIONS
          assert oos["methodology"]["only_pretrade_fv_snapshots"] is True
          assert oos["methodology"]["only_trades_strictly_after_release_cutoff"] is True
          assert oos["methodology"]["automatic_production_change_allowed"] is False
          assert oos["automatic_production_change_allowed"] is False
          assert oos["consumer_changed"] is False
          assert oos["fundamental_value_consumer_changed"] is False
          assert oos["market_value_consumer_changed"] is False
          assert oos["draft_pick_value_consumer_changed"] is False
          assert oos["team_utility_consumer_changed"] is False

          maturity = bool(oos["summary"]["evidence_maturity_gates"]["all_passed"])
          supported_oos = int(oos["summary"]["supported_oos_trade_count"])
          distinct_targets = int(oos["summary"]["distinct_target_count"])

          sys.path.insert(0, str((ROOT / "scripts/validation").resolve()))
          import check_package_adjustment_live as pa

          index_text = INDEX.read_text(encoding="utf-8")
          parts = [
              pa._extract_package_adjustment_config(index_text),
              pa._extract_function(index_text, "packageAdjustmentSize2Multiplier"),
              pa._extract_function(index_text, "packageAdjustmentAssessment"),
              pa._extract_function(index_text, "packageAdjustmentForTrade"),
              pa._extract_function(index_text, "sideTotal"),
              pa._extract_function(index_text, "tradeVerdictTotals"),
          ]

          harness = r"""
          let state = {A:[], B:[]};
          function player(pos, value, name='P'){ return {type:'player', pos, value, name}; }
          function pick(value=1000){ return {type:'pick', value, name:'Pick'}; }
          function assess(a,b){ state = {A:a, B:b}; return packageAdjustmentAssessment(); }
          function check(cond, msg){ if(!cond) throw new Error(msg); }
          function close(a,b,msg){ if(Math.abs(Number(a)-Number(b)) > 1e-7) throw new Error(`${msg}: ${a} != ${b}`); }
          function shares2(largestShare, total=5000){ return [total*largestShare, total*(1-largestShare)]; }
          function shares3(a,b,c,total=5000){ return [total*a, total*b, total*c]; }

          let r, vals, base, totals;
          const S2_MIN = 0.5044104156375697;
          const S2_MAX = 0.5230278884462152;
          const S3_LMAX = 0.4696171986399035;
          const S3_SMIN = 0.2120186203977994;

          vals = shares2(S2_MAX - 1e-8);
          r = assess([player('QB',5000)], [player('RB',vals[0]),player('WR',vals[1])]);
          check(r.status === 'applied', 'size2 just-inside upper boundary must apply');

          vals = shares2(S2_MAX + 1e-8);
          r = assess([player('QB',5000)], [player('RB',vals[0]),player('WR',vals[1])]);
          check(r.status === 'unsupported', 'size2 just-outside upper boundary must fail closed');
          check(r.reason === 'size2_composition_outside_frozen_v3_envelope', 'size2 upper reason');

          vals = shares2(S2_MIN + 1e-8);
          r = assess([player('QB',5000)], [player('RB',vals[0]),player('WR',vals[1])]);
          check(r.status === 'applied', 'size2 just-inside lower boundary must apply');

          vals = shares2(S2_MIN - 1e-8);
          r = assess([player('QB',5000)], [player('RB',vals[0]),player('WR',vals[1])]);
          check(r.status === 'unsupported', 'size2 just-outside lower boundary must fail closed');
          check(r.reason === 'size2_composition_outside_frozen_v3_envelope', 'size2 lower reason');

          let l = S3_LMAX - 1e-8, s = 0.22, m = 1-l-s;
          vals = shares3(l,m,s);
          r = assess([player('DL',5000)], [player('LB',vals[0]),player('DB',vals[1]),player('WR',vals[2])]);
          check(r.status === 'applied', 'size3 just-inside largest upper boundary must apply');

          l = S3_LMAX + 1e-8; s = 0.22; m = 1-l-s;
          vals = shares3(l,m,s);
          r = assess([player('DL',5000)], [player('LB',vals[0]),player('DB',vals[1]),player('WR',vals[2])]);
          check(r.status === 'unsupported', 'size3 just-outside largest upper boundary must fail closed');
          check(r.reason === 'size3_composition_outside_frozen_v4_envelope', 'size3 largest reason');

          l = 0.45; s = S3_SMIN + 1e-8; m = 1-l-s;
          vals = shares3(l,m,s);
          r = assess([player('QB',5000)], [player('RB',vals[0]),player('WR',vals[1]),player('TE',vals[2])]);
          check(r.status === 'applied', 'size3 just-inside smallest lower boundary must apply');

          l = 0.45; s = S3_SMIN - 1e-8; m = 1-l-s;
          vals = shares3(l,m,s);
          r = assess([player('QB',5000)], [player('RB',vals[0]),player('WR',vals[1]),player('TE',vals[2])]);
          check(r.status === 'unsupported', 'size3 just-outside smallest lower boundary must fail closed');
          check(r.reason === 'size3_composition_outside_frozen_v4_envelope', 'size3 smallest reason');

          r = assess([player('QB',5000)], [player('RB',2550),player('WR',2450),player('DB',299.9999)]);
          check(r.status === 'applied', 'sub-6% piece must remain tiny');
          check(r.packageAdjustment.meaningfulCount === 2, 'sub-6% piece must not change size');
          close(r.packageAdjustment.rawPackageFv, 5299.9999, 'tiny FV must remain raw');

          r = assess([player('QB',5000)], [player('RB',2550),player('WR',2450),player('DB',300)]);
          check(r.status === 'unsupported', 'exactly-6% third piece is meaningful and must be classified');
          check(r.reason === 'size3_composition_outside_frozen_v4_envelope', 'exact threshold reason');

          r = assess([player('QB',5000)], [player('RB',2550),player('WR',2450)]);
          base = r.packageAdjustment;
          r = assess([player('QB',5000)], [player('RB',2550),player('WR',2450),player('DB',50),player('TE',60),player('LB',70),player('DL',80)]);
          check(r.status === 'applied', 'many tiny pieces must preserve size2 support');
          check(r.packageAdjustment.meaningfulCount === 2, 'many tinies must not change size');
          close(r.packageAdjustment.adjustment, base.adjustment, 'many tinies cannot change premium');
          close(r.packageAdjustment.rawPackageFv, 5260, 'many tinies must remain in raw FV');

          r = assess([player('QB',5000)], [player('RB',2250),player('WR',1650),player('TE',1100),player('DB',300)]);
          check(r.status === 'unsupported', 'fourth exactly-6% piece must fail closed');
          check(r.reason === 'more_than_three_meaningful_players', 'fourth threshold reason');

          r = assess([player('DB',5000)], [player('RB',2250),player('LB',1650),player('WR',1100)]);
          check(r.status === 'applied', 'mixed offense/IDP size3 must apply');

          r = assess([player('QB',5000)], [player('RB',2550),player('K',2450)]);
          check(r.status === 'unsupported' && r.reason === 'unsupported_position', 'K must fail closed');

          r = assess([player('QB',5000)], [player('RB',2550),pick(2450)]);
          check(r.status === 'unsupported' && r.reason === 'player_only_scope', 'pick must fail closed');

          r = assess([player('RB',2550),player('WR',2450)], [player('QB',5000)]);
          check(r.status === 'applied', 'reverse valid size2 must apply');
          totals = tradeVerdictTotals();
          close(totals.A, 5000, 'reverse package side must remain raw');
          close(totals.B, 5000 + r.packageAdjustment.adjustment, 'reverse target side must get premium');

          process.stdout.write(JSON.stringify({status:'PASS', cases:16}));
          """

          js = "\n\n".join(parts) + "\n" + harness
          with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as fh:
              fh.write(js)
              tmp = fh.name
          try:
              proc = subprocess.run(["node", tmp], capture_output=True, text=True, check=False)
              if proc.returncode != 0:
                  raise AssertionError("Final adversarial live-JS suite failed.\nSTDOUT:\n" + proc.stdout + "\nSTDERR:\n" + proc.stderr)
              js_result = json.loads(proc.stdout)
          finally:
              os.unlink(tmp)
          assert js_result["status"] == "PASS"
          assert js_result["cases"] == 16

          now = datetime.now(timezone.utc).isoformat()
          hardening = live.setdefault("audit_hardening", {})
          hardening["workflow_cleanup_complete"] = True
          hardening["step8_gate_complete"] = True
          hardening["final_adversarial_audit_passed"] = True
          hardening["controlled_live_signoff_complete"] = True
          hardening["audit_clean_complete"] = True
          hardening["step9_gate_complete"] = True
          hardening["prospective_oos_maturity_pending"] = not maturity
          live["last_audit_hardening_at_utc"] = now

          assert canonical(live["formula"]) == formula_before, "Step 9 changed live formula"
          assert live["production_revision"] == "v1.5-audit-step6-scope-ui-idp"
          assert live["status"] == "controlled_live"
          LIVE.write_text(json.dumps(live, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          plan = PLAN.read_text(encoding="utf-8")
          assert "Status: IN PROGRESS" in plan
          assert "- [ ] Step 8 — Obsolete/duplicate workflow cleanup" in plan
          assert "- [ ] Step 9 — Final adversarial audit and production sign-off" in plan

          step8_block = "\n".join([
              "- [x] Step 8 — Obsolete/duplicate workflow cleanup",
              "  - Removed duplicate scheduled Shadow V1 aggregation and obsolete one-time activation/install/audit workflows.",
              "  - Retained only the active V1.5 OOS monitor, prospective evidence capture, current V4/post-launch vote aggregation, and permanent repo regression workflow.",
              "  - No Package Adjustment formula or consumer behavior changed during cleanup.",
          ])
          step9_block = "\n".join([
              "- [x] Step 9 — Final adversarial audit and production sign-off",
              "  - Permanent 13-group repo regression suite and an independent 16-case live-JS boundary/adversarial suite passed.",
              "  - Frozen V1.4/V1.5 release lineage, pre-launch evidence freeze, exact-live monitor hash, scope guards, and consumer isolation were re-verified.",
              "  - Production remains controlled-live at revision v1.5; no formula value changed.",
              "  - Prospective OOS maturity remains a monitoring gate and is not overstated as calibration validation until its evidence thresholds pass.",
          ])
          plan = plan.replace("Status: IN PROGRESS", "Status: COMPLETE", 1)
          plan = plan.replace("- [ ] Step 8 — Obsolete/duplicate workflow cleanup", step8_block, 1)
          plan = plan.replace("- [ ] Step 9 — Final adversarial audit and production sign-off", step9_block, 1)
          PLAN.write_text(plan, encoding="utf-8")

          step8 = {
              "schema_version": 1,
              "status": "package_adjustment_audit_step8_workflow_cleanup",
              "generated_at_utc": now,
              "production_revision": live["production_revision"],
              "production_formula_changed": False,
              "removed_workflow_count": len(REMOVED_WORKFLOWS),
              "removed_workflows": REMOVED_WORKFLOWS,
              "steady_state_workflows": STEADY_STATE_WORKFLOWS,
              "transient_step9_workflow_present_during_audit": STEP9_WORKFLOW.name,
              "duplicate_scheduled_package_vote_workflow_removed": True,
              "active_v4_postlaunch_aggregation_retained": True,
              "active_prospective_capture_retained": True,
              "active_exact_live_oos_monitor_retained": True,
              "permanent_repo_regression_retained": True,
          }
          OUT8_JSON.write_text(json.dumps(step8, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          OUT8_MD.write_text(
              "\n".join([
                  "# Package Adjustment Step 8 — Workflow Cleanup",
                  "",
                  f"Generated: {now}",
                  "",
                  f"- Removed `{len(REMOVED_WORKFLOWS)}` obsolete/duplicate Package Adjustment workflows.",
                  "- Removed the duplicate scheduled Shadow V1 vote aggregation path.",
                  "- Retained the V1.5 exact-live OOS monitor.",
                  "- Retained prospective trade-evidence capture.",
                  "- Retained current V4/post-launch vote aggregation (legacy filename `package-vote-aggregation-v3.yml`).",
                  "- Retained the permanent repository regression workflow.",
                  "- No Package Adjustment formula or consumer behavior changed.",
                  "",
                  "The Step 9 workflow is intentionally transient and should be deleted after its successful final run.",
                  "",
              ]) + "\n",
              encoding="utf-8",
          )

          limitations = []
          if not maturity:
              limitations.append(
                  "Prospective exact-live OOS evidence maturity gates have not yet passed. "
                  "This sign-off verifies implementation, scope, release lineage, monitoring integrity, "
                  "and fail-closed behavior; it does not claim prospective calibration validation."
              )

          step9 = {
              "schema_version": 1,
              "status": "package_adjustment_final_adversarial_audit_pass",
              "generated_at_utc": now,
              "signoff": "controlled_live_production_signoff_complete",
              "production_status": live["status"],
              "production_revision": live["production_revision"],
              "production_formula_changed": False,
              "exact_live_formula_sha256": v1_5["exact_live_formula_sha256"],
              "release_id": v1_5["release_id"],
              "supported_player_positions": EXPECTED_POSITIONS,
              "permanent_repo_regression_group_count": 13,
              "independent_live_js_adversarial_cases": js_result["cases"],
              "workflow_cleanup_removed_count": len(REMOVED_WORKFLOWS),
              "steady_state_package_adjustment_workflows": STEADY_STATE_WORKFLOWS,
              "consumer_isolation": {
                  "fundamental_value_changed": False,
                  "market_value_changed": False,
                  "draft_pick_value_changed": False,
                  "team_utility_changed": False,
                  "trade_verdict_changed": True,
              },
              "prospective_oos": {
                  "supported_oos_trade_count": supported_oos,
                  "distinct_target_count": distinct_targets,
                  "evidence_maturity_all_passed": maturity,
                  "prospective_calibration_validated": maturity,
                  "automatic_production_change_allowed": False,
              },
              "known_limitations": limitations,
              "recommendation": (
                  "Retain controlled-live V1.5 unchanged and continue prospective OOS monitoring. "
                  "Any future recalibration or promotion requires a separate human-reviewed evidence decision."
              ),
          }
          OUT9_JSON.write_text(json.dumps(step9, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          limit_lines = ["- None."] if not limitations else [f"- {x}" for x in limitations]
          OUT9_MD.write_text(
              "\n".join([
                  "# Package Adjustment Step 9 — Final Adversarial Audit & Sign-off",
                  "",
                  f"Generated: {now}",
                  "",
                  "## Result",
                  "",
                  "**PASS — controlled-live production sign-off complete.**",
                  "",
                  f"- Production revision: `{live['production_revision']}`",
                  f"- Exact-live formula SHA256: `{v1_5['exact_live_formula_sha256']}`",
                  "- Package Adjustment formula changed in Step 9: `False`",
                  "- Permanent repository regression groups: `13`",
