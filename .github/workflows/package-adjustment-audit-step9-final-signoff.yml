      - name: Verify only allowed Step 8/9 artifacts changed
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              "research/package-adjustment-production-candidate-v1/live_deployment.json",
              "research/package-adjustment-production-candidate-v1/audit_clean_plan.md",
              "research/package-adjustment-production-candidate-v1/audit_step8_workflow_cleanup.json",
              "research/package-adjustment-production-candidate-v1/audit_step8_workflow_cleanup.md",
              "research/package-adjustment-production-candidate-v1/audit_step9_final_signoff.json",
              "research/package-adjustment-production-candidate-v1/audit_step9_final_signoff.md",
          }
          rows = [
              x for x in subprocess.check_output(
                  ["git", "status", "--porcelain=v1"], text=True
              ).splitlines()
              if x.strip()
          ]
          paths = set()
          for row in rows:
              path = row[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(f"Unexpected Step 9 file changes: {unexpected}")

          expected = set(allowed)
          missing = sorted(expected - paths)
          if missing:
              raise RuntimeError(f"Expected Step 8/9 artifacts not changed/created: {missing}")

          print("Allowed Step 8/9 artifact set verified.")
          PY

