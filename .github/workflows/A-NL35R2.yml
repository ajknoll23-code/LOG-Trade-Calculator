        def nl35_mood(s,f,kind):
            """A witnessed outcome, or an explicitly opinionated preview, never fake motive."""
            a,b=s['name_a'],s['name_b'];angle=s['angle'];p=s['nl30_facts'][0]
            team=p['team'];g=f['game']
            if kind=='after':
                high=a if f['score_a']>=f['score_b'] else b
                low=b if high==a else a
                hi=max(f['score_a'],f['score_b']);lo=min(f['score_a'],f['score_b'])
                if angle=='strong score in defeat':
                    return (f'{low} walked in with {lo:.2f} and got handed a loss anyway. '
                            f'{high} put up {hi:.2f}. Somebody call the scheduling department; this was a mugging with a scoreboard.')
                if angle=='win without median':
                    return (f'{high} beat {low} with {hi:.2f} and still missed the league median. '
                            'The head-to-head win counts, but the victory lap should probably be held indoors.')
                if angle=='pregame-baseline reversal':
                    return (f'{high} took the win over {low}. The pregame numbers brought a story; '
                            'the final scoreboard showed up with a flamethrower.')
                if angle=='form upset':
                    return (f'{high} got the win and {low} got the privilege of explaining its '
                            'beautiful pregame narrative to a scoreboard that does not care.')
                if angle=='standings shock':
                    swing={a:g['rank_delta_a'],b:g['rank_delta_b']}
                    mover=max(swing,key=lambda t:abs(swing[t]))
                    verb='climbed' if swing[mover]>0 else 'fell' if swing[mover]<0 else 'held position'
                    return (f'{high} finished ahead of {low}, and {mover} {verb} in the provisional standings. '
                            'One game brought the scoreboard and the league table into the same group chat.')
                if angle=='large-weekly-margin':
                    return (f'{f["margin"]:.2f} points separated {high} from {low}. '
                            'That is not a close game with bad luck. That is a smoking crater with a matchup ID.')
                return (f'{high} beat {low} and the numbers are final. One owner gets a win; '
                        'the other gets a week of group-chat notifications.')
            avga,avgb=f['ave_a'],f['ave_b'];gap=f['gap']
            front=a if avga>=avgb else b;back=b if front==a else a
            if angle=='record versus form':
                return (f'{front} has the hotter recent scoring. {back} might prefer to discuss records, '
                        'but this preview is not a résumé workshop.')
            if angle=='underdog path':
                return (f'{back} is walking into a matchup with {front} carrying the recent scoring edge. '
                        'Confidence is free. Unfortunately, so is getting embarrassed.')
            if angle=='recent reversal':
                return (f'{a} and {b} meet with last week still hanging over the room. '
                        'One rough outing is a warning; showing up with the same act again would be a comedy special.')
            if angle=='title race':
                return (f'{a} and {b} have the rankings to make this appointment matter. '
                        'Finally, a matchup where both teams have a reason to talk big—and a chance to regret it.')
            if angle=='consistency versus volatility':
                return (f'{a} and {b} have been turning recent scores into an amusement park. '
                        'The thrilling part is not knowing which version shows up. The terrifying part is pretending you do.')
            if angle=='leader under challenge':
                lead=a if g['rank_a']==1 else b if g['rank_b']==1 else front
                challenger=b if lead==a else a
                return (f'{lead} gets another chance to remind the league why it sits on top. '
                        f'{challenger} gets a chance to be more than a volunteer for the demonstration.')
            return (f'{a} faces {b}. Somebody will be bragging afterward; at least one of them should probably wait.')


        def nl35_starter_sentence(s,f,kind,index):
            """Different observed syntactic forms, each a fully verified starter fact."""
            p=s['nl30_facts'][0];name=p['name'];team=p['team'];a=s['name_a'];b=s['name_b']
            pos=p['position'];value=p['points'];other=b if team==a else a
            slot=index%6
            if kind=='after':
                total=f['score_a'] if team==a else f['score_b']
                opposing=f['score_b'] if team==a else f['score_a']
                templates=[
                  f'{name} gave {team} {value:.2f} at {pos} inside its {total:.2f}-point total; {other} finished at {opposing:.2f}.',
                  f'With {value:.2f} from {name} at {pos}, {team} finished at {total:.2f} against {other}’s {opposing:.2f}.',
                  f'For {team}, {name} at {pos} contributed {value:.2f} as the club posted {total:.2f}; {other} posted {opposing:.2f}.',
                  f'The real starter receipt is {name}: {value:.2f} from {pos} during {team}’s {total:.2f} against {other}’s {opposing:.2f}.',
                  f'{team} finished on {total:.2f}, and {name} supplied {value:.2f} at {pos} while {other} put up {opposing:.2f}.',
                  f'From {pos}, {name} delivered {value:.2f} for {team} in a {total:.2f}-point outing; the rival ended at {opposing:.2f}.',
                ]
                return templates[slot]
            latest=p.get('latest_points')
            if latest is None:latest=p['nl32_current_week_points']
            anchor=p['nl32_anchor_week']
            teamlast=f['latest_a'] if team==a else f['latest_b']
            count=p['starts_count'];plural='start' if count==1 else 'starts'
            return [
                f'{name} put up {value:.2f} across {count} verified {plural} for {team}, including {latest:.2f} in Week {anchor} as the team last scored {teamlast:.2f}.',
                f'On {team}’s side, {name} has {value:.2f} over {count} completed {plural}; Week {anchor} brought {latest:.2f} alongside a team result of {teamlast:.2f}.',
                f'The {team} evidence starts with {name}: {value:.2f} in {count} verified {plural}, including {latest:.2f} in Week {anchor} when the club posted {teamlast:.2f}.',
                f'At {pos}, {name} contributed {value:.2f} in {count} starts for {team}; its latest team score was {teamlast:.2f}, with {latest:.2f} from that starter in Week {anchor}.',
                f'Last week {team} scored {teamlast:.2f}; across {count} actual starts {name} has produced {value:.2f}, including {latest:.2f} from Week {anchor}.',
                f'Across {count} verified {team} starts, {name} delivered {value:.2f}, including {latest:.2f} in Week {anchor} as the team reached {teamlast:.2f}.',
            ][slot]


        def nl35_new_decimal(s,f,kind,lead,p2):
            """Fresh exact verified decimal in paragraph two, with a contextual source.
            Do not fabricate precision or remove the required first/second-paragraph fact.
            """
