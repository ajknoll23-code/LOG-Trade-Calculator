        def nl32r3_distinct_p2(stories,facts,kind):
            """Fix collisions BEFORE the original binary editorial gate, not after it.

            Canonical text (with teams, players, numbers masked) AND 8-word opening
            sequences are unique. A collision gets a substantive replacement only if
            all early evidence constraints remain satisfied. Otherwise fail closed.
            """
            used=set(); openings=set(); changes=[]
            for idx,(story,fact) in enumerate(zip(stories,facts),1):
                before=story['why']; paragraph=before
                key=nl32_canon(paragraph,story); beginning=tuple(key.split()[:8])
                if key in used or beginning in openings:
                    for style in range(8):
                        candidate=nl32r3_alternative_p2(story,fact,kind,style)
                        ck=nl32_canon(candidate,story); cp=tuple(ck.split()[:8])
                        if ck in used or cp in openings:continue
                        if len(candidate.split())>81:continue
                        if any(term in candidate.casefold() for term in _NL30_BANNED):continue
                        if not (nl31_numeric_literals(candidate)-nl31_numeric_literals(story['lead'])):continue
                        if not all(p['name'] in candidate and f'{p["points"]:.2f}' in candidate
                                   for p in story['nl30_facts']):continue
                        paragraph=candidate;key=ck;beginning=cp
                        break
                    else:
                        raise RuntimeError(f'NL35R2 no source-supported unique P2 for {kind} matchup {idx}')
                    story['why']=paragraph
                    story['nl32_editorial_evidence']['paragraph2_canonical_pattern']=key
                    story['nl32_editorial_evidence']['p2_revised_for_uniqueness']=True
                    changes.append((kind,idx,before,paragraph))
                else:
                    story['nl32_editorial_evidence']['p2_revised_for_uniqueness']=False
                used.add(key);openings.add(beginning)
            if len(used)!=len(stories) or len(openings)!=len(stories):
                raise RuntimeError('NL35R2 global P2 diversity hard fail')
            return changes


        _NL35R2_PREVIOUS_APPLY = nl32_apply_editorial

        def nl32_apply_editorial(war,after,warfacts,aftfacts,profiles):
            decision=_NL35R2_PREVIOUS_APPLY(war,after,warfacts,aftfacts,profiles)
            modifications=[]
            modifications.extend(nl32r3_distinct_p2(war,warfacts,'war'))
            modifications.extend(nl32r3_distinct_p2(after,aftfacts,'after'))
            decision['nl32r3_unique_p2_rewrites']=[{'edition':k,'matchup':i} for k,i,*_ in modifications] if isinstance(decision,dict) else None
            return decision


        def nl32_gate(stories,facts,kind):
            # Keep EVERY NL31/NL30/NL29 inherited hard gate; additions are stricter.
            result=_NL32_ORIGINAL_GATE(stories,facts,kind)
            ps=[];cs=[]
            for idx,(s,f) in enumerate(zip(stories,facts),1):
                for p in s['nl30_facts']:
                    if p['player_id'] in _NL32_EXCLUDED_PLAYER_IDS or p['name'].casefold() in _NL32_EXCLUDED_NAMES:
                        raise RuntimeError('NL32 forbidden player in reader edition')
                    if not p.get('nl32_current_week_started'):
                        raise RuntimeError(f'NL32 {kind} {idx}: player did not start completed Week {p["nl32_anchor_week"]}')
                    if p['nl32_current_week_source']!=f'league/{LEAGUE_ID}/matchups/{p["nl32_anchor_week"]}':
                        raise RuntimeError('NL32 invalid weekly source anchor')
                    if kind=='after' and p['nl32_anchor_week']!=f['week']:
                        raise RuntimeError('NL32 Aftermath starter not on same game week')
                    if kind=='war' and p['nl32_anchor_week']!=len(f['game']['scores_a']):
                        raise RuntimeError('NL32 War Room starter absent from most recently completed week')
                combined=' '.join((s['headline'],s['lead'],s['why'],s['takeaway'])).casefold()
                for bad in ('athan kaliakmanis','athan kalianakis',
                            'those are related observations, not a one-player verdict',
                            'points vanished. the starter log has a name',
                            'points below form. the starter report is worse'):
                    if bad in combined:raise RuntimeError(f'NL32 banned phrase/player leaked in {kind} {idx}')
                extra=nl31_numeric_literals(s['why'])-nl31_numeric_literals(s['lead'])
                if not extra:raise RuntimeError(f'NL32 no new verified paragraph-two numbers {kind} {idx}')
                ps.append(nl32_canon(s['why'],s));cs.append(nl32_canon(s['takeaway'],s))
            if len(set(ps))!=len(ps):raise RuntimeError(f'NL32 duplicate second-paragraph skeleton in {kind}: '+repr([(i+1,x[:130]) for i,x in enumerate(ps)]))
            if len(set(cs))!=len(cs):raise RuntimeError(f'NL32 duplicate closer skeleton in {kind}')
            # More than exact duplicates: repeated first-clause formulas also fail.
            prefixes=[tuple(z.split()[:8]) for z in ps]
            if len(set(prefixes))!=len(prefixes):
                raise RuntimeError(f'NL32 duplicate second-paragraph opening skeleton in {kind}')
            result['nl32_anchor_week_player_facts']=len(stories)
            result['nl32_unique_paragraph2_skeletons']=len(set(ps))
            result['nl32_unique_closer_skeletons']=len(set(cs))
            result['nl32_excluded_ineligible_player_calls']=0
            return result


        def nl32_cross_edition_gate(war,after):
            # Prohibit copying a recap's paragraph or closer into the preview.
            a_ps={nl32_canon(s['why'],s) for s in after}
            a_cs={nl32_canon(s['takeaway'],s) for s in after}
            for i,s in enumerate(war,1):
                if nl32_canon(s['why'],s) in a_ps:
                    raise RuntimeError(f'NL32 copied Aftermath paragraph template into WarRoom #{i}')
                if nl32_canon(s['takeaway'],s) in a_cs:
                    raise RuntimeError(f'NL32 copied Aftermath closing template into WarRoom #{i}')
            return True


