                return (f'Records are louder than the last three weeks, but {gap:.2f} '
                        f'points per week is the verified difference between {a} and {b} right now.')
            if idx==1:
                plan=s['nl30_plan'];drop=plan.get('drop')
                focus=plan.get('focus') or p['team'];
                if drop is None:
                    return (f'Across the recent completed weeks {lead} averaged {max(avga,avgb):.2f}; '
                            f'{tail} averaged {min(avga,avgb):.2f}. That {gap:.2f}-point difference '
                            'belongs to the form sheet, not to a presumed next result.')
                return (f'The recent {gap:.2f}-point edge belongs to {lead}; '
                        f'{focus} is also carrying a {float(drop):.2f}-point slide from its prior pace. '
                        'Those are separate concerns, not a score prediction.')
            if idx==2:
                plan=s['nl30_plan'];drop=plan.get('drop');
                focus=plan.get('focus') or p['team']
                if drop is None:
                    return (f'The three-week form picture is {avga:.2f} for {a} and {avgb:.2f} for {b}; '
                            f'it has a {gap:.2f}-point difference. Neither club has a result assigned in advance.')
                return (f'A completed-week total of {plan.get("total",f["latest_a"] if focus==a else f["latest_b"]):.2f} '
                        f'left {focus} {float(drop):.2f} below its earlier pace. '
                        f'The {gap:.2f}-point recent opponent gap is a different question.')
            if idx==3:
                seasona=sum(g['scores_a'])/len(g['scores_a']);seasonb=sum(g['scores_b'])/len(g['scores_b'])
                return (f'{lead} has {gap:.2f} more points per week across the recent window; '
                        f'its season-long separation from {tail} is {abs(seasona-seasonb):.2f}. '
                        'The rankings set the stage, not the finish.')
            if idx==4:
                ra=max(g['scores_a'][-3:])-min(g['scores_a'][-3:]);rb=max(g['scores_b'][-3:])-min(g['scores_b'][-3:]);
                return (f'One volatility ledger shows {ra:.2f} for {a} and {rb:.2f} for {b}; '
                        f'the {gap:.2f}-point three-week average gap tells a separate story.')
            plan=s['nl30_plan'];drop=plan.get('drop');focus=plan.get('focus') or p['team'];
            if drop is None:
                return (f'The last three weeks put {lead} at {max(avga,avgb):.2f} against '
                        f'{min(avga,avgb):.2f} from {tail}. The observed spread: {gap:.2f} per week.')
            return (f'There is a {gap:.2f}-point gap in recent scoring averages, '
                    f'and {focus} also fell {float(drop):.2f} off its prior form. '
                    f'That is the statistical backdrop—not a forecast of Week {p["nl32_anchor_week"]+1}.')


        def nl32_canon(text, story, full=False):
            t=text.casefold()
            for name in (story['name_a'],story['name_b']):
                t=t.replace(name.casefold(),'TEAM')
            for p in story.get('nl30_facts',[]):
                t=t.replace(p['name'].casefold(),'PLAYER')
            t=re.sub(r'(?<!\w)[+-]?\d+(?:\.\d+)?%?', 'N',t)
            t=re.sub(r'\b(?:qb|rb|wr|te|lb|dl|db|idp|k)\b','POSITION',t)
            t=re.sub(r'\s+',' ',t).strip()
            if not full:
                # canonicalize punctuation while preserving ordering of rhetorical parts.
                t=re.sub(r'[^a-zA-Z ]',' ',t)
                t=re.sub(r'\s+',' ',t).strip()
            return t


        def nl32_apply_editorial(war,after,warfacts,aftfacts,profiles):
            decision=_NL32_ORIGINAL_APPLY(war,after,warfacts,aftfacts,profiles)
            for kind,stories,facts in (('war',war,warfacts),('after',after,aftfacts)):
                for idx,(s,f) in enumerate(zip(stories,facts)):
                    if any(p['player_id'] in _NL32_EXCLUDED_PLAYER_IDS for p in s['nl30_facts']):
                        raise RuntimeError('NL32 excluded Athan despite eligible starter filter')
                    for p in s['nl30_facts']:
                        if not p.get('nl32_current_week_started'):
                            raise RuntimeError('NL32 featured starter lacks completed-week participation proof')
                    s['why']=nl32_p2(s,f,kind,idx)
                    ending=nl32_closer(s,f,kind,idx)
                    if s['nl30_structure']=='Autopsy':
                        claim=s['nl30_plan'].get('drop') or s['nl30_plan'].get('provisional_drop')
                        if claim is not None and not any(t in ending for t in (f'{float(claim):.2f}',str(claim))):
                            focus=s['nl30_plan'].get('focus') or s['nl30_facts'][0]['team']
                            # Use a distinct compact evidence-grounded close, not a
                            # generic appended sentence or a silent gate relaxation.
                            if kind=='war':
                                variants=(
                                  f'{focus} owns the {float(claim):.2f}-point recent decline; the opponent’s form is a separate question.',
                                  f'Before a new matchup, {focus} carries a {float(claim):.2f}-point team shortfall—not a one-player prognosis.',
                                  f'The verified {float(claim):.2f}-point slide belongs to {focus}’s full lineup, not one box-score entry.',
                                  f'What needs explaining is {focus}’s {float(claim):.2f}-point decline from its previous production level.',
                                  f'Among the recent numbers, {float(claim):.2f} is the scoring dip recorded by {focus} as a team.',
                                  f'For {focus}, the gap from its old form is {float(claim):.2f}; the Week {s["nl30_facts"][0]["nl32_anchor_week"]+1} result is still unwritten.')
                            else:
                                variants=(
                                  f'{focus} finished {float(claim):.2f} short of its prior pace; the matchup loss is a second outcome.',
                                  f'One {float(claim):.2f}-point form drop defines {focus}’s Week {f["week"]} total, beyond any individual stat line.',
                                  f'The {float(claim):.2f}-point decline was a whole-team problem for {focus}, even with a singled-out starter.',
                                  f'{focus} faces a {float(claim):.2f}-point collapse from its baseline, not a one-receiver explanation.',
                                  f'Standings aside, the recorded {float(claim):.2f}-point slide came from {focus}’s complete lineup.',
                                  f'The measurable {float(claim):.2f}-point form deficit belongs to {focus}, not one player alone.')
                            ending=variants[idx]
                    s['takeaway']=ending
                    s['punchline']=ending
                    s['keys']=list(dict.fromkeys(s['keys']+['nl32_completed_week_lineup_anchor',
                        'nl32_no_duplicate_p2_or_closer', 'nl32_no_explanatory_overclaim']))
                    s['nl32_editorial_evidence']={
                        'anchor_week':profiles['post_week'],
                        'must_start_in_anchor_week':True,
                        'selected_player':s['nl30_facts'][0]['name'],
                        'selected_id':s['nl30_facts'][0]['player_id'],
                        'source_endpoint':s['nl30_facts'][0]['nl32_current_week_source'],
                        'featured_in_completed_week_starters':True,
                        'completed_week_starter_points':s['nl30_facts'][0]['nl32_current_week_points'],
                        'current_week_player_identity_not_inferred_from_roster':True,
                        'primary_storyline':s['primary_storyline'],
                        'player_context_not_sole_cause':True,
                        'paragraph2_canonical_pattern':nl32_canon(s['why'],s),
                        'closer_canonical_pattern':nl32_canon(s['takeaway'],s),
                        'nl29_editorial_control_unchanged':True,
                    }
            return decision


