                    e['closer_fingerprint']=nl33_copy_fingerprint(s['takeaway'],s)
                    s['nl33_editorial_evidence']['paragraph_two_adds']=e['paragraph_two_added_values']
                    s['nl33_editorial_evidence']['paragraph_2_shape']=e['paragraph_2_fingerprint']
                    s['nl33_editorial_evidence']['closing_shape']=e['closer_fingerprint']
