        # NL35R2: an editorial correction pass over the green NL30 PDF/provenance engine.
        # The NL29 control is generated from the same cached Sleeper responses.
        _NL31_PREVIOUS_SENTENCES = nl30_sentences_preserving_player

        def nl30_sentences_preserving_player(text, player_name):
            # Preserve all player initials (including an opponent's name in a two-player
            # story), not solely the currently asserted player. Keep punctuation after
            # a full sentence as a genuine boundary; no joining unrelated claims.
            markers={}
            def protect(m):
                key=f'NL31INITIALSTOKEN{len(markers)}Q'
                markers[key]=m.group(0)
                return key
            safe=re.sub(r'(?<!\w)(?:[A-Z]\.){1,4}(?=\s+[A-Z])',protect,text)
            safe=safe.replace('No. ', 'NoDOT ')
            chunks=_NL31_PREVIOUS_SENTENCES(safe,player_name.replace('J.K.','J K ').replace('A.J.','A J ') if False else player_name)
            # The name protection inside the inherited function is harmless when its
            # initial punctuation has already been tokenized globally.
            return [part.replace('NoDOT ','No. ').translate({}) if not markers else
                    _nl31_restore_tokens(part,markers) for part in chunks]

        def _nl31_restore_tokens(text, markers):
            text=text.replace('NoDOT ','No. ')
            for key,value in markers.items():text=text.replace(key,value)
            return text

        _NL31_PREVIOUS_SELECT = nl30_select
        _NL31_PREVIOUS_APPLY = nl30_apply_editorial
        _NL31_PREVIOUS_GATE = nl30_gate

        _NL31_BANNED_HEADLINES = (
            re.compile(r'points below form\s*\.\s*the starter report is worse',re.I),
            re.compile(r'points vanished\s*\.\s*the starter log has a name',re.I),
        )
        _NL31_BANNED_COPY = (
            re.compile(r'accounted for\s+\d+(?:\.\d+)?%\s+alongside a team result',re.I),
            re.compile(r'the starter report is worse',re.I),
            re.compile(r'the starter log has a name',re.I),
            re.compile(r'that starter accounted for',re.I),
            re.compile(r'one line on .* report card',re.I),
            re.compile(r'a small starter contribution meets a very public team total',re.I),
            re.compile(r'those completed starter points are part of the comparison',re.I),
        )
        _NL31_SKILL = {'QB':5,'RB':4,'WR':4,'TE':3}


        def nl30_select(f,story,kind,profiles,plan,prior,disallow_raw_highest,required_team=None,additional=False):
            """Prioritize relevant QB/RB/WR/TE production, with no fabricated causation.

            Preserve the same-source roster evidence and the NL30 hard exclusions.
            A K or IDP may feature only when it actually wins the objective relevance
            comparison; its contribution must never be described as sole cause.
            """
            current,decision=_NL31_PREVIOUS_SELECT(f,story,kind,profiles,plan,prior,
                            disallow_raw_highest,required_team=required_team,additional=additional)
            if current is None: return current,decision
            label=story['nl30_planned_structure']
            if label not in ('Autopsy','Demolition') or additional: return current,decision
            g=f['game'];team=required_team or plan.get('focus')
            if label=='Demolition':team=plan['winner']
            eligible=[]
            candidates=nl29_candidates(f,story,kind,profiles)
            maxraw=max(p['points'] for p in candidates)
            for p in candidates:
                if p['team']!=team:continue
                if (p['roster_id'],p['player_id']) in prior:continue
                if disallow_raw_highest and p['points']>=maxraw-0.005:continue
                if additional and (p['roster_id'],p['player_id']) in story.get('_selected_keys',set()):continue
                grade=_NL31_SKILL.get(p['position'],0)
                swing=p.get('player_swing')
                if label=='Autopsy':
                    if p['position'] in ('K','P','PK'):continue
                    # A documented player decline or a low scoring skill starter
                    # is preferable to a marginal kicker with an eye-catching swing.
                    if grade and swing is not None and swing<=-8:
                        tier=6; strength=abs(swing)
                    elif grade and p['points']<=0:
                        tier=5; strength=10
                    elif grade and p['share_pct']<=5:
                        tier=4; strength=5-p['share_pct']
                    elif grade and swing is not None and swing<=-4:
                        tier=3; strength=abs(swing)
                    elif not grade and swing is not None and swing<=-15 and p['points']<=0:
                        tier=2;strength=abs(swing)
                    else:continue
                    eligible.append(((tier,grade,strength,-p['share_pct']),p))
                else:
                    # On a blowout, meaningful winning-team offensive share is more
                    # explanatory than selecting the highest IDP point total.
                    if p['share_pct']<8:continue
                    eligible.append(((_NL31_SKILL.get(p['position'],0)>0,
                                      p['share_pct'],grade,p['points']),p))
            if not eligible and label=='Autopsy' and current['position'] in ('K','P','PK'):
                # A kicker can be the largest raw swing but still have little
                # explanatory connection to an entire team collapse. Pick the most
                # relevant available skill starter instead and default to factual
                # contribution language if the structure's standard cannot be met.
                viable=[p for p in candidates if p['team']==team and _NL31_SKILL.get(p['position'],0)>0
                        and (p['roster_id'],p['player_id']) not in prior
                        and not(disallow_raw_highest and p['points']>=maxraw-0.005)]
                if viable:
                    viable.sort(key=lambda p: (p.get('player_swing') is not None and p['player_swing']<0,
                                 abs(min(0,p.get('player_swing') or 0)),
                                 -p['share_pct'],_NL31_SKILL.get(p['position'],0)),reverse=True)
                    eligible=[((0,0,0,0),viable[0])]
            if not eligible:return current,decision
            eligible.sort(key=lambda x:x[0],reverse=True)
            chosen=eligible[0][1]
            if label=='Autopsy':
                current_skill=_NL31_SKILL.get(current['position'],0)
                chosen_skill=_NL31_SKILL.get(chosen['position'],0)
                # Do not replace one meaningful skill performance merely to rotate names.
                if current_skill and (current.get('player_swing') is not None and current['player_swing']<=-8 or current['points']<=0):
                    chosen=current
                elif chosen_skill==0 and current_skill>0:chosen=current
            if chosen['player_id']==current['player_id'] and chosen['roster_id']==current['roster_id']:
                decision['nl31_selection_review']='Existing player passed contextual skill-position evidence check'
                return current,decision
            reason=('documented primary-position contribution/decline on collapsing team; '
                    'low-explanatory kicker or peripheral IDP avoided; skill fact must not imply sole cause' if label=='Autopsy'
                    else 'material verified winning-side share with primary-position preference')
            higher=[{'name':q['name'],'player_id':q['player_id'],'points':q['points'],
                     'reason_not_chosen':reason}
                    for q in sorted(candidates,key=lambda q:-q['points'])
                    if q['points']>chosen['points']+0.005]
            result={**decision,'selection_reason':reason,
                    'higher_raw_scorers_not_selected':higher[:10],
                    'featured_raw_highest':chosen['points']>=maxraw-0.005,
                    'nl31_selection_review':f'Replaced {current["name"]} ({current["position"]}); {reason}'}
            return chosen,result


        def nl31_numeric_literals(text):
            # Counts two-decimal actual scoring facts, not bare weeks or ranking numbers.
            return set(re.findall(r'(?<![\w])\d+\.\d{2}\b',text))


        def nl31_headline_shape(title):
            s=re.sub(r'\d+(?:\.\d+)?','N',title.casefold())
            return re.sub(r'\s+',' ',s).strip()


        def nl31_paragraph_two(s,f,kind,idx):
            """A storyline-specific, source-backed argument, not a generic player box.

            Exact team scores and player shares are from the current immutable Sleeper
            snapshot. A low-scoring starter is never represented as sole cause.
            """
            p=s['nl30_facts'][0];name=p['name'];team=p['team'];pos=p['position']
            number=f'{p["points"]:.2f}';share=f'{p["share_pct"]:.1f}'
            structure=s['nl30_structure']
            if kind=='after':
                a,b=f['game']['name_a'],f['game']['name_b']
                total=f['score_a'] if team==a else f['score_b']
                other=f['score_b'] if team==a else f['score_a']
                margin=f['margin'];med=f['median'];team_dev=f['dev_a'] if team==a else f['dev_b']
                prior=p.get('prior_player_mean')
                if structure=='Autopsy':
                    if prior is not None and p.get('player_swing') is not None and p['player_swing']<=-4:
                        return (f'{name} had averaged {prior:.2f} points in earlier starts, then posted {number} at {pos} in Week {f["week"]}. '
                                f'The individual change was {abs(p["player_swing"]):.2f}; {team} finished {abs(team_dev):.2f} '
                                f'points {"below" if team_dev<0 else "above"} its earlier team pace. Those are related observations, not a one-player verdict.')
                    if team_dev<0:
                        return (f'The {number}-point contribution from {name} was {share}% of {team}’s {total:.2f}. '
                                f'That team also fell {abs(team_dev):.2f} below its earlier scoring pace; '
                                'one starter’s low score does not explain the entire gap.')
                    return (f'{name} finished with {number} at {pos}, {share}% of {team}’s {total:.2f} total. '
                            f'The league median stood at {med:.2f}; those standings consequences belong to the whole lineup.')
                if structure=='Heist':
                    difference=abs(other-total);over=total-med
                    if total>med:
                        return (f'{name} put up {number} at {pos}, accounting for {share}% of {team}’s '
                                f'{total:.2f}. The median was {med:.2f}, which this lineup cleared by {over:.2f}; '
                                f'{other:.2f} from the other sideline still won it by {difference:.2f}. '
                                'That is a brutal opponent result, not a one-player indictment.')
                    return (f'{name} delivered {number} at {pos} ({share}% of {team}’s team scoring). '
                            f'{team} won its matchup by {difference:.2f}, then came up {abs(over):.2f} '
                            f'short of the {med:.2f} median. A head-to-head win and a missed median '
                            'can coexist; the starter did not single-handedly determine either outcome.')
                if structure=='Turning Point':
                    swing=p.get('player_swing');prior=p.get('prior_player_mean')
                    if swing is None or prior is None: raise RuntimeError('NL31 turning point lacks verified individual baseline')
                    return (f'{name} scored {number} at {pos}, compared with {prior:.2f} in prior starts '
                            f'({swing:+.2f}), while {team} moved {team_dev:+.2f} points from its previous scoring pace. '
                            f'Those movements were in the same direction; the {margin:.2f}-point final margin '
                            'reflects both complete lineups, not a single starter.')
                if structure=='Demolition':
                    return (f'On the winning side, {name} produced {number} at {pos}—{share}% '
                            f'of {team}’s {total:.2f} total. The victory margin was {margin:.2f}; '
                            'the margin reflects every starter on both teams, not one player alone.')
                # Default, Heavyweight and record/form scenarios: name the side and
                # supply a distinct opponent or median number not already in paragraph 1.
                if len(s['nl30_facts'])==2:
                    q=s['nl30_facts'][1]
                    return (f'{name} supplied {number} ({share}% of {team}’s points); '
                            f'{q["name"]} supplied {q["points"]:.2f} for {q["team"]} '
                            f'({q["share_pct"]:.1f}% of its team total). The team scoring gap was {margin:.2f}; '
                            'both starters can be credited with contributions, not with deciding the entire result alone.')
                return (f'{name} scored {number} for {team} ({share}% of its {total:.2f}). '
                        f'Across the matchup, {other:.2f} was the other team’s total and {margin:.2f} '
                        'was the difference. A useful player-level detail does not replace the whole-score explanation.')
            a,b=f['game']['name_a'],f['game']['name_b']
            avga,avgb=f['ave_a'],f['ave_b'];gap=f['gap']
            team_avg=avga if team==a else avgb;opp_avg=avgb if team==a else avga
            if len(s['nl30_facts'])==2:
                q=s['nl30_facts'][1]
                return (f'For {team}, {name} supplied {number} across {p["starts_count"]} starts '
                        f'({share}% of {team}’s three-week scoring). Across the same completed window, '
                        f'{q["name"]} delivered {q["points"]:.2f} for {q["team"]} '
                        f'({q["share_pct"]:.1f}% of team scoring). Their teams’ recent averages differ by {gap:.2f} per week; '
                        'this is evidence on both sides, not a next-week projection.')
            if structure=='Autopsy':
                latest=p.get('latest_points');swing=p.get('player_swing');prior=p.get('prior_player_mean')
                angle=s.get('angle','')
                if angle=='consistency versus volatility':
                    ra=max(f['game']['scores_a'][-3:])-min(f['game']['scores_a'][-3:])
                    rb=max(f['game']['scores_b'][-3:])-min(f['game']['scores_b'][-3:])
                    context=(f'Across those weeks, {a} had a {ra:.2f}-point high-to-low range; '
                             f'{b} had {rb:.2f}.')
                elif angle in ('underdog path','leader under challenge'):
                    context=(f'The opponent matchup still features {avga:.2f} versus {avgb:.2f} '
                             f'in recent team averages, a {gap:.2f}-point weekly gap.')
                else:context='That is one lineup contribution, not the entire explanation.'
                if latest is not None and swing is not None and prior is not None:
                    return (f'{name} supplied {number} across {p["starts_count"]} starts in {team}’s team scoring; last week’s '
                            f'{latest:.2f} compared with {prior:.2f} in earlier starts ({swing:+.2f}). '
                            f'{team} scored {f["latest_a"] if team==a else f["latest_b"]:.2f} in that completed week. '
                            +context)
                return (f'{name} supplied {number} over {p["starts_count"]} starts, {share}% '
                        f'of {team}’s recent scoring. {team} averaged {team_avg:.2f} '
                        f'and {b if team==a else a} averaged {opp_avg:.2f}. '+context)
            if structure=='Fraud Alert':
                return (f'{name} accounted for {share}% of {team}’s last three scoring weeks '
                        f'with {number} across {p["starts_count"]} starts. '
                        f'The teams are separated by {gap:.2f} in recent average points, '
                        'which is a narrower comparison than their full-season records.')
            if structure=='Turning Point':
                swing=p.get('player_swing');prior=p.get('prior_player_mean');latest=p.get('latest_points')
                if swing is None or latest is None or prior is None:raise RuntimeError('NL31 missing backward-looking swing evidence')
                return (f'{name} supplied {number} over {p["starts_count"]} starts in team scoring, moving from an earlier {prior:.2f} average to {latest:.2f} '
                        f'last week ({swing:+.2f}), as {team} moved from {s["nl30_plan"]["baseline"]:.2f} '
                        f'to {s["nl30_plan"]["total"]:.2f}. That parallel change concerns completed weeks only; '
                        f'{opp_avg:.2f} is the opponent’s recent scoring average.')
            angle=s.get('angle','')
            if angle=='underdog path':
                return (f'The {gap:.2f}-point form deficit has actual starters behind it: '
                        f'{name} registered {number} in {p["starts_count"]} starts for {team} '
                        f'({share}% of its scoring). {team} averaged {team_avg:.2f}, while '
                        f'{b if team==a else a} was at {opp_avg:.2f}. It is the three-week '
                        'comparison that looks daunting, not a claim about next Sunday.')
            if angle=='consistency versus volatility':
                ra=max(f['game']['scores_a'][-3:])-min(f['game']['scores_a'][-3:])
                rb=max(f['game']['scores_b'][-3:])-min(f['game']['scores_b'][-3:])
                return (f'{name} contributed {number} over {p["starts_count"]} starts for {team} '
                        f'({share}% of the team’s window). But the matchup’s more revealing '
                        f'contrast is the scoring range: {a} varied by {ra:.2f}, '
                        f'{b} by {rb:.2f}. One player’s total cannot account for all that volatility.')
            if angle=='leader under challenge':
                return (f'{name} put {number} into {team}’s recent total, a {share}% share '
                        f'across {p["starts_count"]} starts. The broader race is {team_avg:.2f} '
                        f'per week for {team} against {opp_avg:.2f} for {b if team==a else a}. '
                        f'That {gap:.2f}-point separation is earned production, not a coronation.')
            return (f'{name} supplied {number} over {p["starts_count"]} starts for {team} '
                    f'({share}% of its three-week total). {team} averaged {team_avg:.2f}; '
                    f'{b if team==a else a} averaged {opp_avg:.2f}. The {gap:.2f}-point '
                    'form gap is a team-level result, not a one-player explanation.')


        def nl31_apply_editorial(war,after,warfacts,aftfacts,profiles):
            # Preserve NL29's more quotable six-story headline variety as the default.
            originals={(kind,i):s['headline'] for kind,stories in (('war',war),('after',after))
                       for i,s in enumerate(stories)}
            _NL31_PREVIOUS_APPLY(war,after,warfacts,aftfacts,profiles)
            for kind,stories,facts in (('war',war,warfacts),('after',after,aftfacts)):
                for idx,(s,f) in enumerate(zip(stories,facts)):
                    title=originals[(kind,idx)]
                    if any(p.search(title) for p in _NL31_BANNED_HEADLINES):
                        raise RuntimeError(f'NL31 underlying NL29 headline already contains forbidden template {idx+1}')
                    s['headline']=title
                    s['why']=nl31_paragraph_two(s,f,kind,idx)
                    # Repair overly mechanical NL30 opening clauses without changing the
                    # starter, points, comparison or the required syntactic-opening ID.
                    s['lead']=s['lead'].replace('That is the number that deserves attention.',
                          'The bad week has an actual starter score attached to it.')
                    s['lead']=s['lead'].replace('A small starter contribution meets a very public team total.',
                          'The individual number is conspicuous; the team-wide deficit is larger.')
                    s['lead']=re.sub(r'was one line on (.+?)’s (\d+\.\d+)-point report card\.',
                          r'was a single contributor to \1’s \2-point team total.',s['lead'])
                    # Preserve factual close, using its structure-specific shortfall.
                    s['punchline']=s['takeaway']
                    s['keys']=list(dict.fromkeys(s['keys']+['nl31_fact_rationale','nl31_no_repeated_skeletons']))
                    s['nl31_editorial_evidence']={
                        'baseline_edition':'NL29R1',
                        'headline_preserved_from_nl29':True,
                        'primary_storyline':s['primary_storyline'],
                        'selected_player':s['nl30_facts'][0]['name'],
                        'skill_position':s['nl30_facts'][0]['position'],
                        'second_player':s['nl30_facts'][1]['name'] if len(s['nl30_facts'])==2 else None,
                        'player_claim_limited_to_contribution':True,
                        'player_selection_reason':s['nl30_decisions'][0]['selection_reason'],
                        'paragraph_2_extra_numbers':sorted(nl31_numeric_literals(s['why'])-nl31_numeric_literals(s['lead'])),
                    }
            return {'revision':'NL35R2','control':'NL29R1','comparison':'same-source Week 8/Week 9',
                    'no_automated_quality_score':True}


        def nl31_gate(stories,facts,kind):
            for index,story in enumerate(stories,1):
