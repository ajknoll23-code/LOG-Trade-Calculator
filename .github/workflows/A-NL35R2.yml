            # response cache. Every raw response is reused; no asynchronous data drift.
            cache={};original_get=globals()['get'];original_snapshot=globals()['snapshot']
            def caching_get(path):
                if path not in cache:cache[path]=original_get(path)
                return _nl30_copy.deepcopy(cache[path])
            source_snapshot=[None]
            def shared_snapshot(w,a):
                if source_snapshot[0] is None:source_snapshot[0]=original_snapshot(w,a)
                return _nl30_copy.deepcopy(source_snapshot[0])
            globals()['get']=caching_get
            globals()['snapshot']=shared_snapshot
            try:
                _NL30_NL29_EXECUTE(baseline,root,war_week,after_week,fixture)
                globals()['_NL32_CHALLENGER_ONLY']=True  # never affect NL29 control
                data=fixture_load(fixture) if fixture else shared_snapshot(war_week,after_week)
