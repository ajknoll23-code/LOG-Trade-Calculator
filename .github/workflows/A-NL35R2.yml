            if nl31_numeric_literals(p2)-used:return p2
            a,b=s['name_a'],s['name_b'];team=s['nl30_facts'][0]['team']
            if kind=='after':
                med=f['median'];margin=f['margin']
                for val,txt in ((margin,f'The final margin was {margin:.2f}.'),
                                (med,f'The league median sat at {med:.2f}.')):
                    if f'{val:.2f}' not in used:return p2+' '+txt
            else:
                gap=f['gap'];aavg=f['ave_a'];bavg=f['ave_b']
                for val,txt in ((gap,f'The completed three-week average gap is {gap:.2f}.'),
                                (aavg,f'{a} has averaged {aavg:.2f} in that window.'),
                                (bavg,f'{b} has averaged {bavg:.2f} in that window.')):
                    if f'{val:.2f}' not in used:return p2+' '+txt
            raise RuntimeError('NL35 cannot find independent numerical evidence for paragraph two')


        def nl35_autopsy_receipt(kind,index,team,delta):
            """Six independent receipts per edition; verified change, never player blame.

