        def nl30_create_blind_package(out,baseline,live_ledger,data):
            """Same-source paired editions with an unblinding key kept OUT of reviewer folder."""
            blind=out/'BLIND-REVIEW-SEND-TO-GROK';blind.mkdir(parents=True,exist_ok=True)
            # Labels are deterministic only within this source snapshot; version names are
            # omitted from all review-facing file names and ledgers.
            baseline_is_a=bool(int(hashlib.sha256(json.dumps(data['war_games'],sort_keys=True).encode()).hexdigest()[:2],16)%2)
            map_={'A':('NL29R1',baseline) if baseline_is_a else ('NL35R2',out),
                  'B':('NL35R2',out) if baseline_is_a else ('NL29R1',baseline)}
            ref=[]
            for label,(version,srcdir) in map_.items():
                for edition,week in (('WarRoom',data['war_week']),('Aftermath',data['aftermath_week'])):
                    matches=list(srcdir.glob(f'LOG-{version}-{edition}-W{week:02d}-Editorial-Shadow.pdf'))
                    if len(matches)!=1:raise RuntimeError('NL30 blind: missing baseline or new PDF '+version+' '+edition)
                    _nl30_shutil.copy2(matches[0],blind/f'Issue-{label}-{edition}-W{week:02d}.pdf')
                    matchesmd=list(srcdir.glob(f'LOG-{version}-{edition}-W{week:02d}-Editorial-Shadow.md'))
                    if len(matchesmd)!=1:raise RuntimeError('NL30 blind: missing edition Markdown')
                    # Do not copy metadata containing explicit implementation version.
                    if version=='NL35R2':
                        body=matchesmd[0].read_text()
                    else:
                        body=matchesmd[0].read_text()
                        body=re.sub(r' · A-NL29R1', '',body)
                        body=re.sub(r'\*\*Angle:\*\* [^\n]+\n','',body)
                    (blind/f'Issue-{label}-{edition}-W{week:02d}.md').write_text(body,encoding='utf-8')
                if version=='NL35R2':
                    stories=live_ledger['featured_stories']
                    coverage=live_ledger
                else:
                    prior=json.loads((baseline/'NL29R1-Player-Provenance-and-Selection-Ledger.json').read_text())
                    coverage=prior
                    stories=[]
                    for row in prior['featured_stories']:
                        p=row['selected_player']
                        stories.append({'edition':row['edition'],'matchup_index':row['matchup_index'],
                            'teams':row['teams'],'primary_storyline':row['primary_storyline'],
                            'featured_starters':[{'name':p['name'],'player_id':p['player_id'],'points':p['points'],
                              'position':p['position'],'team':p['team'],'weeks':p['week_span'],
                              'share_pct':round(p['share_pct'],3),'source_endpoint':p['source_endpoint'],
                              'identity_source':p['identity_source'],'selection_reason':p['selection']['selection_reason'],
                              'higher_scorers_passed_over':row['reason_higher_scorers_passed_over']} ]})
                (blind/f'Issue-{label}-Verified-Player-Selection-Ledger.json').write_text(json.dumps({
                    'edition_label':label,'model_version':'WITHHELD_FOR_BLIND_REVIEW',
                    'source_type':'public Sleeper verified team and starter scores',
                    'source_is_live':not live_ledger['fixture_test_not_live_evidence'],
                    'verified_weekly_starter_counts':coverage['full_weekly_starter_coverage'],
                    'verified_identity_count':coverage['identity_count'],
                    'excluded_unverifiable_starter_count':len(coverage['excluded_unverifiable_entries']),
                    'stories':stories},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
                ref.append({'label':label,'implementation':version})
            instructions='''# Blind Editorial Comparison — War Room W{war} / Aftermath W{aft}

        Review Issues A and B **without opening the editor-only unblinding key**. Both are generated from the same source snapshot and historical starter evidence. If `SOURCE IS SYNTHETIC` appears below, these are software smoke tests, **not a real editorial competition**.

        **SOURCE IS {mode}.** Both have six matchup articles per issue, no private free-agent information, no invented injury news, no lineup counterfactuals and no projections. The attached anonymized selection ledgers explain why players were featured or higher raw scorers passed over. The internal writing structures are not audience-facing labels.

        Judge whether the jokes land, whether the roasts are direct and brash without invented owner actions, and whether any full issue deserves to be forwarded in the group chat. Excessive statistics and repetitive cautionary caveats are editorial weaknesses.

        Judge whether the jokes land, whether the roasts are direct and brash without invented owner actions, and whether any full issue deserves to be forwarded in the group chat. Excessive statistics and repetitive cautionary caveats are editorial weaknesses.

        For each issue, assign human editorial ratings (0–20) for **Humor, Roster Specificity, Originality, Football Insight, Readability** (total out of 100). Also note unsupported cause-and-effect, repeated rhetorical structures, player facts detached from the main argument, and any unearned Full League Roast. Do **not** treat 85/100 as an automated gate or manufacture a winner from minor differences.

        Blindly select the better *War Room* and *Aftermath* separately, then name 3 strongest and 3 weakest passages with precise repair instructions. Explain whether the winner would be forwarded to owners. Compare only what can be verified from provided artifacts; rankings are reconstructed and provisional.

        No newsletter is authorized for publication by this package. Editorial approval remains with the league owner.
        '''.format(war=data['war_week'],aft=data['aftermath_week'],mode='SYNTHETIC_OFFLINE_FIXTURE' if live_ledger['fixture_test_not_live_evidence'] else 'LIVE_SLEEPER')
            (blind/'GROK-BLIND-REVIEW-INSTRUCTIONS.md').write_text(instructions,encoding='utf-8')
            (out/'EDITOR-ONLY-UNBLIND-KEY.json').write_text(json.dumps({'mapping':ref,
                'do_not_send_to_blind_reviewer':True,'source_fixture':live_ledger['fixture_test_not_live_evidence']},indent=2)+'\n')
