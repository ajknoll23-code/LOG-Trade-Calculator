        def nl30_execute(out,root,war_week,after_week,fixture=None):
            if war_week!=after_week+1 or not 4<=after_week<=17:raise RuntimeError('NL30 requires adjacent NFL weeks')
            out.mkdir(parents=True,exist_ok=True)
            baseline=out/'BASELINE-NL29R1';baseline.mkdir(exist_ok=True)
