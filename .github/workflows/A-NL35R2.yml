        def nl30_storyline(f,s,kind):
            """One primary verified tension, classified before player selection.

            The structure must earn its behavioral constraints; otherwise use ordinary
            Ruthless Sports Radio. Nothing here projects future football performance.
            """
            g=f['game'];a,b=g['name_a'],g['name_b']
            if kind=='after':
                sa,sb=f['score_a'],f['score_b'];med=f['median'];margin=f['margin']
                high=a if sa>=sb else b;low=b if high==a else a
                winner=high;loser=low;hs=max(sa,sb);ls=min(sa,sb)
                gaps=[(a, f['dev_a'], sa, f['prior_a']),(b, f['dev_b'], sb, f['prior_b'])]
                worst=min(gaps,key=lambda x:x[1])
                drops=[(a,g['rank_delta_a']),(b,g['rank_delta_b'])]
                falling=min(drops,key=lambda x:x[1])
                # Explicitly ranked by severity, not synthetic editorial distribution.
                possibilities=[]
                if margin>=100:
                    possibilities.append((2.0+margin/100, 'Demolition',{'focus':winner,'margin':margin,'winner':winner,'loser':loser}))
                if worst[1]<=-40:
                    possibilities.append((2.0+abs(worst[1])/40,'Autopsy',{'focus':worst[0],'drop':abs(worst[1]),'baseline':worst[3],'total':worst[2]}))
                if falling[1]<=-3:
                    possibilities.append((2.0+abs(falling[1])/3,'Autopsy',{'focus':falling[0],'provisional_drop':abs(falling[1]),'total':sa if falling[0]==a else sb}))
                if ls>med:
                    # Team was above league median but still lost to an even higher opponent.
                    possibilities.append((1.5+(ls-med)/40,'Heist',{'focus':loser,'total':ls,'other_total':hs,'median':med,'mode':'strong_losing_score'}))
                elif hs<med:
                    possibilities.append((1.4+(med-hs)/40,'Heist',{'focus':winner,'total':hs,'other_total':ls,'median':med,'mode':'winner_below_median'}))
                improved=max(gaps,key=lambda x:x[1])
                if improved[1]>=20:
                    possibilities.append((1.2+improved[1]/60,'Turning Point',{'focus':improved[0],'baseline':improved[3],'total':improved[2],'direction':1,'change':improved[1]}))
                # A form collapse smaller than roast threshold can still merit an autopsy,
                # if strongly material and a verified player also declined.
                if worst[1]<=-25:
                    possibilities.append((1.1+abs(worst[1])/60,'Autopsy',{'focus':worst[0],'drop':abs(worst[1]),'baseline':worst[3],'total':worst[2]}))
                if g['rank_a']<=3 and g['rank_b']<=3:
                    possibilities.append((1.0,'Heavyweight',{'focus':None}))
                # Do not invent an upset from standings alone; label only verified results.
                if s['angle']=='form upset':
                    old_leader=a if f['prior_a']>f['prior_b'] else b
                    new_winner=winner
                    if old_leader!=new_winner:
                        possibilities.append((1.45,'Turning Point',{'focus':loser,'baseline':f['prior_a'] if loser==a else f['prior_b'],
                                                  'total':ls,'direction':-1,'change':(f['dev_a'] if loser==a else f['dev_b'])}))
            else:
                avga,avgb=f['ave_a'],f['ave_b'];gap=f['gap'];margin=None
                front=a if avga>=avgb else b;back=b if front==a else a
                da=f.get('latest_change_a') or 0;db=f.get('latest_change_b') or 0
                falling=min([(a,da),(b,db)],key=lambda x:x[1])
                rising=max([(a,da),(b,db)],key=lambda x:x[1])
                possibilities=[]
                if falling[1]<=-25:
                    who=falling[0]
                    val=f['latest_a'] if who==a else f['latest_b']
                    possibilities.append((1.8+abs(falling[1])/40,'Autopsy',{'focus':who,'drop':abs(falling[1]),'baseline':val-falling[1],
                                  'total':val,'week':len(f['game']['scores_a'])}))
                if s['angle']=='record versus form':
                    ra,rb=f['record_a'][0],f['record_b'][0]
                    record_leader=a if ra>=rb else b
                    if (ra!=rb and (record_leader!=front or gap<=5)):
                        possibilities.append((1.8+(abs(ra-rb)/8),'Fraud Alert',{'focus':record_leader,'form_leader':front,
                                                        'record_leader':record_leader,'gap':gap}))
                if g['rank_a']<=3 and g['rank_b']<=3:
                    possibilities.append((1.65,'Heavyweight',{'focus':None}))
                if rising[1]>=20:
                    who=rising[0];val=f['latest_a'] if who==a else f['latest_b']
                    possibilities.append((1.25+rising[1]/80,'Turning Point',{'focus':who,'baseline':val-rising[1],
                                                       'total':val,'direction':1,'change':rising[1],
                                                       'week':len(f['game']['scores_a'])}))
            # 6 labels are planning labels only; fallback has no forced structure.
            possibilities.sort(key=lambda z:-z[0])
            return possibilities[0][1:] if possibilities else ('Ruthless Sports Radio', {'focus':None})


        def nl30_qualified_roast(f,kind):
            """Exact closed eligibility list; no discretion or extra subjective exceptions."""
            if kind=='after':
                g=f['game']
                reasons={
                    'margin_100': f['margin']>=100,
                    'form_drop_40': min(f['dev_a'],f['dev_b'])<=-40,
                    'median_miss_50': max(f['median']-f['score_a'],f['median']-f['score_b'])>=50,
                    'provisional_drop_3': min(g['rank_delta_a'],g['rank_delta_b'])<=-3,
                }
            else:
                ds=[d for d in (f.get('latest_change_a'),f.get('latest_change_b')) if d is not None]
                reasons={'form_drop_40':bool(ds) and min(ds)<=-40}
            return [k for k,v in reasons.items() if v]


        def nl30_select(f,story,kind,profiles,plan,prior,disallow_raw_highest,required_team=None,additional=False):
            """Select source-checked starter(s) that satisfy the structure's causal restraint.

            Fail-closed fallback to neutral Ruthless structure if a named structure has
            no qualifying player. Never substitute speculative roster-change context.
            """
            candidates=nl29_candidates(f,story,kind,profiles)
            if not candidates:raise RuntimeError('NL30 HARD FAIL: no actual named starter for matchup')
            g=f['game'];a,b=g['name_a'],g['name_b']
            focus=required_team or plan.get('focus')
            if kind=='after':
                hs=a if f['score_a']>=f['score_b'] else b
            else:hs=a if f['ave_a']>=f['ave_b'] else b
            structural=story['nl30_planned_structure']
            if structural=='Demolition':focus=hs
            if structural=='Heist':focus=plan['focus']
            if structural=='Fraud Alert':focus=plan['form_leader']
            if structural=='Turning Point':focus=plan['focus']
            if structural=='Autopsy':focus=plan['focus']
            if required_team:focus=required_team
            eligible=[p for p in candidates if (p['team']==focus if focus else True)]
            if not eligible:return None,None
            # Required order is context, participation share, documented decline, fallback raw.
            def relevance(p):
                main=p['position'] in ('QB','RB','WR')
                swing=p.get('player_swing')
                if structural=='Autopsy':
                    # Most severe verified negative swing on central team, or worst actual
                    # contribution on the side that fell, favoring QB/RB/WR as directed.
                    if swing is not None and swing<=-10:
                        return (9, abs(swing),int(main),-p['points']), 'large same-starter decline on the collapsing side'
                    if p['points']<=0:return (8,0,int(main),-p['points']), 'zero/negative starter during team collapse'
                    if main:return (5,100-p['share_pct'],int(main),-p['points']), 'low primary-position starter share during team shortfall'
                    return (3,100-p['share_pct'],0,-p['points']), 'low starter share during team shortfall'
                if structural=='Turning Point':
                    direction=plan['direction']
                    if swing is not None and swing*direction>=7:
                        return (10,abs(swing),int(main),p['points']), 'same-player scoring change in team direction'
                    return (0,0,0,0),'no matching directional player change'
                if structural=='Demolition':
                    return (8 if p['share_pct']>=8 else 0,p['share_pct'],int(main),p['points']), ('material winning-team scoring share' if p['share_pct']>=8 else 'insufficient winning-team share')
                if structural=='Fraud Alert':
                    return (6,p['share_pct'],int(main),p['points']), 'verified recent-window scoring on side of record/form contrast'
                if structural=='Heist':
                    return (7,p['share_pct'],int(main),p['points']), 'verified scoring on the wrong-side-of-schedule or median team'
                if structural=='Heavyweight':
                    return (7,p['share_pct'],int(main),p['points']), 'verified scoring share for one of the two contenders'
                # Default Ruthless: select a contextual player over a random low IDP.
                return (4,p['share_pct'],int(main),p['points']),'verified starting contribution to team-level scoring tension'
            sorted_pool=sorted(eligible,key=lambda p:relevance(p)[0],reverse=True)
            maxraw=max(p['points'] for p in candidates)
            for p in sorted_pool:
                rank,reason=relevance(p)
                if rank[0]==0:continue
                if (p['roster_id'],p['player_id']) in prior:continue
                if disallow_raw_highest and p['points']>=maxraw-.005:continue
                if additional and (p['roster_id'],p['player_id']) in story.get('_selected_keys',set()):continue
                higher=[{'name':q['name'],'player_id':q['player_id'],'points':q['points'],
                         'reason_not_chosen':reason+' outranked raw scoring'}
                        for q in sorted(candidates,key=lambda q:-q['points']) if q['points']>p['points']+.005]
                return p,{'selection_reason':reason,'higher_raw_scorers_not_selected':higher[:10],
                          'candidate_count':len(candidates),'featured_raw_highest':p['points']>=maxraw-.005,
                          'structural_rule':structural,'source_week_span':p['week_span']}
            return None,None


        def nl30_choose_intro(candidates, used):
            for shape,text in candidates:
                if shape not in used:
                    used.add(shape)
                    return shape,text
            raise RuntimeError('NL30 HARD FAIL: no distinct syntactic opener available for six stories')


        def nl30_base_player_text(p,kind):
            if kind=='after':
                return (f'{p["name"]} ({p["position"]}) scored {p["points"]:.2f} for {p["team"]} in Week {p["week"]}'
                        f' ({p["share_pct"]:.1f}% of its {p["team_total"]:.2f}-point total)')
            return (f'{p["name"]} ({p["position"]}) supplied {p["points"]:.2f} over '
                    f'{p["starts_count"]} starts in Weeks {p["week_span"][0]}–{p["week_span"][-1]}'
                    f' for {p["team"]} ({p["share_pct"]:.1f}% of its three-week scoring)')


        def nl30_compose(f,s,kind,structure,plan,selected,second,used_shapes):
            """Each structure has one enforceable writing behavior beyond a stylistic label."""
            g=f['game'];a,b=g['name_a'],g['name_b'];p=selected;team=p['team'];pos=p['position']
            fact=nl30_base_player_text(p,kind)
            if kind=='after':
                sa,sb=f['score_a'],f['score_b']; med=f['median']; margin=f['margin']
                winner=a if sa>=sb else b;loser=b if winner==a else a
                top=max(sa,sb); bottom=min(sa,sb)
                score=p['team_total']
            else:
                avga,avgb=f['ave_a'],f['ave_b']; gap=f['gap']
                front=a if avga>=avgb else b;back=b if front==a else a
            if structure=='Autopsy':
                if kind=='after':
                    focus=plan['focus']; total=f['score_a'] if focus==a else f['score_b']
                    baseline=plan.get('baseline')
                    shortfall=(f'{abs(baseline-total):.2f} below its earlier three-week average of {baseline:.2f}' if baseline is not None and baseline>total
                               else f'{med-total:.2f} below the {med:.2f} league median' if total<med else
                               f'down {plan.get("provisional_drop",0)} provisional places')
                    openers=[('player_name_start',f'{p["name"]} gave {focus} just {p["points"]:.2f} points from a starting {pos} spot in a {total:.2f}-point team week. That is the number that deserves attention.'),
                             ('with_player_start',f'With just {p["points"]:.2f} from {p["name"]} at {pos}, {focus} finished Week {f["week"]} at {total:.2f}. A small starter contribution meets a very public team total.'),
                             ('player_score_start',f'{p["points"]:.2f} points from {p["name"]} ({pos}) was one line on {focus}’s {total:.2f}-point report card.'),
                             ('starter_position_start',f'At {pos}, {p["name"]} supplied {p["points"]:.2f} while {focus} closed Week {f["week"]} at {total:.2f}.')]
                    why=(f'That starter accounted for {p["share_pct"]:.1f}% of {focus}’s total, alongside a team result {shortfall}. '
                         f'The {margin:.2f}-point head-to-head margin shows why the damage extended beyond one position.')
                    takeaway=f'{focus} can argue about the opponent; it cannot argue away a team total {shortfall}.'
                else:
                    focus=plan['focus'];last=plan['total']; drop=plan['drop']
                    cur=p.get('latest_points')
                    here=(f'{cur:.2f} in Week {p["week_span"][-1]}' if cur is not None else f'{p["points"]:.2f} across the recent window')
                    openers=[('player_name_start',f'{p["name"]} delivered {here} for {focus}, part of the same week its total fell to {last:.2f}.'),
                             ('with_player_start',f'With {here} from {p["name"]}, {focus} posted {last:.2f} last week.'),
                             ('player_score_start',f'{here} from {p["name"]} is the player-side receipt in {focus}’s latest {last:.2f}-point outing.'),
                             ('starter_position_start',f'At {pos}, {p["name"]} supplied {here} during {focus}’s {drop:.2f}-point fall from its earlier scoring pace.')]
                    why=(f'{fact}; the team total sat {drop:.2f} below its preceding three-game average of {plan["baseline"]:.2f}. '
                         f'{p["name"]} also had a {abs(p.get("player_swing") or 0):.2f}-point recent starter swing; '
                         'the two declines are both on the record.')
                    takeaway=f'{focus} enters the next matchup carrying a {drop:.2f}-point last-week shortfall, not a certificate of recovery.'
            elif structure=='Heist':
                focus=plan['focus'];value=plan['total'];other=plan['other_total']
                if plan['mode']=='strong_losing_score':
                    outcome=f'still lost {other:.2f}–{value:.2f}'
                    inequality=f'{value-med:.2f} above the {med:.2f} median'
                    final=f'{focus} cleared the median by {value-med:.2f}; the schedule rewarded it with a loss anyway.'
                else:
                    outcome=f'won its matchup but lost the median result'
                    inequality=f'{med-value:.2f} below the {med:.2f} median'
                    final=f'{focus} gets the head-to-head win. The median still took the other point.'
                openers=[('team_score_start',f'{focus} posted {value:.2f} points and {outcome}. A scoreboard can be both generous and cruel.'),
                         ('score_start',f'{value:.2f} points from {focus}: {outcome}. That result needs no fictitious roster explanation.'),
                         ('even_with_start',f'Even with {value:.2f} from {focus}, the week ended badly in the comparison that mattered: it {outcome}.'),
                         ('opponent_score_start',f'Against a {other:.2f}-point opponent result, {focus} supplied {value:.2f} and {outcome}.')]
                why=(f'{fact}; that made {p["share_pct"]:.1f}% of the score on the team that was '
                     f'{inequality}, but it could not change the head-to-head or median verdict.')
                takeaway=final
            elif structure=='Heavyweight':
                if second is None:raise RuntimeError('NL30 HEAVYWEIGHT requires one player for each team')
                ranka,rankb=g['rank_a'],g['rank_b']
                openers=[('ranking_pair_start',f'No. {ranka} {a} meets No. {rankb} {b}. This time the top of the table has to settle its argument on the field.'),
                         ('two_contenders_start',f'Two contenders occupy provisional Nos. {ranka} and {rankb}: {a} and {b}. Neither can send a résumé in place of a score.'),
                         ('team_dual_start',f'{a} and {b} arrive holding provisional ranks {ranka} and {rankb}. Prestige has an actual opponent this week.'),
                         ('at_rank_start',f'At provisional Nos. {ranka} and {rankb}, {a} and {b} finally get a head-to-head test of their scoring form.')]
                secondtxt=nl30_base_player_text(second,kind)
                why=(f'{fact}, while {secondtxt}. Their individual shares put real starters on both sides of the fight; '
                     f'the verified team scoring comparison is {abs(f["ave_a"]-f["ave_b"]):.2f} points per week.' if kind=='war'
                     else f'{fact}, while {secondtxt}. The final matchup margin was {margin:.2f}; both starters were part of the recorded totals.')
                if kind=='war':
                    recent=abs(f['ave_a']-f['ave_b'])
                    long_a=sum(g['scores_a'])/len(g['scores_a']);long_b=sum(g['scores_b'])/len(g['scores_b'])
                    season_gap=abs(long_a-long_b)
                    bigger=('three-week form gap' if recent>season_gap+0.005 else 'season-to-date scoring gap' if season_gap>recent+0.005 else 'neither gap')
                    takeaway=(f'{bigger.capitalize()} is larger: {recent:.2f} per week recently versus {season_gap:.2f} over the season.'
                             if bigger!='neither gap' else f'The recent and season-long production gaps are effectively equal at {recent:.2f} points per week.')
                else:
                    prior_gap=abs(f['prior_a']-f['prior_b']);final_gap=abs(sa-sb)
                    label='pregame three-week production gap' if prior_gap>final_gap else 'actual final-score gap' if final_gap>prior_gap else 'neither gap'
                    takeaway=f'The {label} is larger: {prior_gap:.2f} before kickoff versus {final_gap:.2f} in the final.' if label!='neither gap' else f'The pregame form gap and final margin both measured {final_gap:.2f} points.'
            elif structure=='Fraud Alert':
                ra=g['record_a'];rb=g['record_b'];gap=f['gap'];front=a if f['ave_a']>=f['ave_b'] else b
                focus=plan['record_leader']; rec=ra if focus==a else rb
                openers=[('record_first_start',f'{rec} is {focus}’s combined record. The last three weeks have been far less impressed: {a} averaged {f["ave_a"]:.2f}; {b} averaged {f["ave_b"]:.2f}.'),
                         ('rank_first_start',f'No. {g["rank_a"] if focus==a else g["rank_b"]} {focus} enters with the superior record, yet the latest scoring gap is only {gap:.2f} per week.'),
                         ('team_record_start',f'{focus} owns the {rec} résumé. Across Weeks {f["window"].split("Weeks ")[-1]}, recent scoring tells a smaller story: {gap:.2f} points a week.'),
                         ('at_record_start',f'At {rec}, {focus} has the record advantage. {front} owns the {gap:.2f}-point recent scoring edge.')]
                why=(f'{fact}; that is an actual recent starter contribution on the scoring side of the disagreement. '
                     f'The two teams are separated by {gap:.2f} per week across {f["window"]}, despite their combined-record gap.')
                takeaway=f'{focus} has the better résumé. The {gap:.2f}-point recent scoring margin has declined to certify it.'
            elif structure=='Demolition':
                focus=plan['winner'];loser=plan['loser'];margin=f['margin']
                openers=[('margin_numeric_start',f'{margin:.2f} points separated {focus} and {loser}. The final was {top:.2f}–{bottom:.2f}; this was not a photo finish.'),
                         ('by_margin_start',f'By {margin:.2f} points, {focus} dismantled {loser}: {top:.2f}–{bottom:.2f}.'),
                         ('a_margin_start',f'A {margin:.2f}-point margin is the first fact on the docket. {focus} delivered {top:.2f} and {loser} {bottom:.2f}.'),
                         ('margin_colon_start',f'Margin: {margin:.2f}. Winner: {focus}, {top:.2f}–{bottom:.2f} over {loser}.')]
                why=(f'{fact}; that share belongs to the winning side of a {margin:.2f}-point demolition. '
                     'The remaining margin reflects the whole lineup, not one player alone.')
                takeaway=f'{focus} supplied the high score. {loser} supplied a {margin:.2f}-point reminder that there were two teams in the matchup.'
            elif structure=='Turning Point':
                focus=plan['focus'];before=plan['baseline'];now=plan['total'];change=now-before
                period=(f'Week {f["week"]}' if kind=='after' else f'Week {len(g["scores_a"])}')
                openers=[('from_baseline_start',f'From {before:.2f} to {now:.2f}: {focus} changed its scoring pace by {abs(change):.2f} points in {period}.'),
                         ('baseline_numeric_start',f'{before:.2f} was {focus}’s prior three-game average. {period} delivered {now:.2f}, a {abs(change):.2f}-point change.'),
                         ('before_week_start',f'Before {period}, {focus} averaged {before:.2f}. Then came {now:.2f}, {abs(change):.2f} points {"higher" if change>0 else "lower"}.'),
                         ('week_baseline_start',f'{period} changed {focus}’s recent scoring comparison: {before:.2f} previously, {now:.2f} in the completed game.')]
                swing=p.get('player_swing')
                if swing is None or swing*change<=0:
                    raise RuntimeError('NL30 TURNING POINT player did not change in direction of team')
                why=(f'{fact}; {p["name"]} also moved {abs(swing):.2f} points {"up" if swing>0 else "down"} '
                     f'while the team changed {abs(change):.2f} in the same direction. '
                     'The two changes are verifiable; they are not a substitute for the full team box score.')
                takeaway=(f'{focus} improved by {change:.2f} points and still lost by {margin:.2f}; better is not the same as enough.'
                           if kind=='after' and change>0 and focus==loser else
                          f'{focus} moved {abs(change):.2f} points {"above" if change>0 else "below"} its earlier scoring pace. That is the new result to account for.')
            else:
                structure='Ruthless Sports Radio'
                if kind=='after':
                    openers=[('final_score_start',f'{winner} beat {loser} {top:.2f}–{bottom:.2f}. The {margin:.2f}-point result was earned on the scoreboard.'),
                             ('week_result_start',f'Week {f["week"]} ended {top:.2f}–{bottom:.2f} for {winner} over {loser}.'),
                             ('team_defeat_start',f'{loser} posted {bottom:.2f} against {winner}’s {top:.2f}. That is a {margin:.2f}-point contrast.'),
                             ('the_margin_start',f'The {margin:.2f}-point decision belongs to {winner}, {top:.2f}–{bottom:.2f}.')]
                    why=(f'{fact}; that share belongs to one side of a {margin:.2f}-point head-to-head result. '
                         f'{winner} outscored {loser} {top:.2f}–{bottom:.2f}; the median produced its own result.')
                    takeaway=f'{winner} banked the head-to-head victory. {loser} has a {margin:.2f}-point deficit to explain.'
                else:
                    openers=[('weekly_gap_start',f'{gap:.2f} points separate {a} and {b} per week in recent scoring. The records may look different; the totals are not identical.'),
                             ('recent_window_start',f'Across {f["window"]}, {a} averaged {avga:.2f} and {b} averaged {avgb:.2f}.'),
                             ('team_average_start',f'{a} owns a {avga:.2f}-point recent average; {b} arrives at {avgb:.2f}.'),
                             ('in_window_start',f'In the three completed weeks before kickoff, the teams were separated by {gap:.2f} points a game.')]
                    why=(f'{fact}; those points are part of {p["team"]}’s side of a {gap:.2f}-point weekly form gap. '
                         f'{a} averaged {avga:.2f}, {b} averaged {avgb:.2f} in the same three completed weeks.')
                    takeaway=f'The {gap:.2f}-point observed gap favors {front} in form, not by executive decree.'
            shape,lead=nl30_choose_intro(openers,used_shapes)
            if structure=='Autopsy':
                if shape=='player_name_start':
                    takeaway=(f'The {abs(plan.get("drop",plan.get("provisional_drop",0))):.2f}-point shortfall belongs to {plan["focus"]},'
                              ' not to a convenient single-player excuse.' if 'drop' in plan else
                              f'{plan["focus"]} still owns a {plan.get("provisional_drop",0)}-place reconstructed standings fall.')
                elif shape=='with_player_start':
                    takeaway=(f'{plan["focus"]} finished {abs(plan.get("drop",0)):.2f} points off its previous pace.'
                              if 'drop' in plan else f'The provisional {plan.get("provisional_drop",0)}-place slide is the part that cannot be edited.')
            if structure=='Ruthless Sports Radio':
                if kind=='war':
                    takeaway={
                        'weekly_gap_start':f'{front} is ahead by {gap:.2f} per recent week. The gap, unlike the applause, is measurable.',
                        'recent_window_start':f'{a} and {b} have {gap:.2f} points of recent separation to sort out on the field.',
                        'team_average_start':f'The three-game edge is {gap:.2f}; {front} earned it by scoring, not by a résumé.',
                        'in_window_start':f'{front} brings the {gap:.2f}-point recent advantage, which is context rather than a pregame verdict.',
                    }.get(shape,takeaway)
                else:
                    takeaway={
                        'final_score_start':f'{winner} collected the result. The losing margin for {loser} was {margin:.2f}, and it still counts.',
                        'week_result_start':f'The head-to-head score is settled; {loser} is left with {margin:.2f} points to make up in the comparison.',
                        'team_defeat_start':f'{loser} surrendered {margin:.2f} points of margin to {winner}. There is no tiebreak to hide behind.',
                        'the_margin_start':f'{winner} held the {margin:.2f}-point edge; {loser} did not have an answer in the final total.',
                    }.get(shape,takeaway)
            return {'lead':lead,'why':why,'takeaway':takeaway,'structure':structure,'opening_shape':shape}


        def nl30_headline(f,s,kind,structure,plan,player):
            """Match the audience-facing headline to the newly selected primary fact."""
            g=f['game'];a,b=g['name_a'],g['name_b']
            if structure=='Autopsy':
                if 'provisional_drop' in plan:
                    return f'{plan["provisional_drop"]} Places Down. {player["name"]} Scored {player["points"]:.2f}.'
                if kind=='after':
                    return f'{plan["drop"]:.2f} Points Below Form. The Starter Report Is Worse.'
                return f'{plan["drop"]:.2f} Points Vanished. The Starter Log Has a Name.'
            if structure=='Heist':
                return (f'{plan["total"]:.2f} Points. And Still a Loss.' if plan['mode']=='strong_losing_score'
                        else f'Won the Matchup. Missed the Median by {plan["median"]-plan["total"]:.2f}.')
            if structure=='Heavyweight':
                return f'No. {g["rank_a"]} vs No. {g["rank_b"]}. Both Sides Brought Starters.'
            if structure=='Fraud Alert':
                diff=abs(f['record_a'][0]-f['record_b'][0])
                return f'{diff} Wins Apart. Just {f["gap"]:.2f} Points of Recent Difference.'
            if structure=='Demolition':
                return f'{f["margin"]:.2f} Points Apart. The Winning Lineup Has Receipts.'
            if structure=='Turning Point':
                delta=plan['total']-plan['baseline']
                return f'{abs(delta):.2f} Points {"Up" if delta>0 else "Down"}. The Starter Scores Agree.'
            return s['headline']


        def nl30_apply_editorial(war,after,warfacts,aftfacts,profiles):
            profiles['post_week']=aftfacts[0]['week']
            prior=set(); decisions=[]
            for kind,stories,facts in (('after',after,aftfacts),('war',war,warfacts)):
                used=set();highest_used=False
                for idx,(s,f) in enumerate(zip(stories,facts),1):
                    structure,plan=nl30_storyline(f,s,kind)
                    s['nl30_planned_structure']=structure
                    # If structure is unearned, downgrade to default voice, never force it.
                    p,decision=nl30_select(f,s,kind,profiles,plan,prior if kind=='war' else set(),highest_used)
                    if p is None and structure!='Ruthless Sports Radio':
                        structure='Ruthless Sports Radio'
                        plan={'focus':None,'fallback_from':s['nl30_planned_structure']}
                        s['nl30_planned_structure']=structure
                        p,decision=nl30_select(f,s,kind,profiles,plan,prior if kind=='war' else set(),highest_used)
                    if p is None:raise RuntimeError('NL30 HARD FAIL: mandatory verified player fact could not be selected')
                    other=None;otherdecision=None
                    if structure=='Heavyweight':
                        g=f['game'];otherteam=g['name_b'] if p['team']==g['name_a'] else g['name_a']
                        other,otherdecision=nl30_select(f,s,kind,profiles,plan,prior if kind=='war' else set(),highest_used or decision['featured_raw_highest'],required_team=otherteam,additional=True)
                        if other is None:
                            structure='Ruthless Sports Radio'
                            s['nl30_planned_structure']=structure
                            plan={'focus':None,'fallback_from':'Heavyweight, no second verified distinct starter'}
                    if structure=='Autopsy':
                        # If lowest contribution is not material to a verified shortfall, default to
                        # non-special Ruthless rather than naming a forced analytical category.
                        relevant=(p.get('player_swing') is not None and p['player_swing']<=-10) or p['points']<=0 or (p['position'] in ('QB','RB','WR') and p['share_pct']<=5)
                        if not relevant:
                            structure='Ruthless Sports Radio';s['nl30_planned_structure']=structure;plan={'focus':None,'fallback_from':'unearned autopsy'}
                    try:
                        prose=nl30_compose(f,s,kind,structure,plan,p,other,used)
                    except RuntimeError as exc:
                        if structure=='Ruthless Sports Radio':raise
                        structure='Ruthless Sports Radio';s['nl30_planned_structure']=structure
                        prose=nl30_compose(f,s,kind,structure,{'focus':None,'fallback_from':str(exc)[:120]},p,None,used)
                        other=None
                    s.update(lead=prose['lead'],why=prose['why'],takeaway=prose['takeaway'],punchline=prose['takeaway'])
                    s['headline']=nl30_headline(f,s,kind,structure,plan,p)
                    s['structure']={'Autopsy':'narrative','Heist':'contrast','Heavyweight':'stakes',
                                    'Fraud Alert':'numbers','Demolition':'numbers','Turning Point':'narrative',
                                    'Ruthless Sports Radio':'contrast'}[structure]
                    s['player_note']=None
                    s['nl30_structure']=structure
                    s['nl30_plan']=plan
                    s['nl30_opening_shape']=prose['opening_shape']
                    s['nl30_facts']=[p]+([other] if other else [])
                    s['nl30_decisions']=[decision]+([otherdecision] if other else [])
                    s['primary_storyline']={'Autopsy':'form collapse/reversal' if 'provisional_drop' not in plan else 'standings drop',
                        'Heist':'median split','Heavyweight':'standard mismatch','Fraud Alert':'record-vs-form divergence',
                        'Demolition':'large absolute margin','Turning Point':'form collapse/reversal',
                        'Ruthless Sports Radio':nl29_primary_story(s)}[structure]
                    s['nl29_selected']={**p,'paragraph_index':1 if structure=='Autopsy' else 2,
                        'source_verified':True,'selection':{'primary_storyline':s['primary_storyline'],**decision}}
                    s['keys']=list(dict.fromkeys(s['keys']+['nl30_player_integrated','nl30_structure_gate']))
                    s['source']+='; NFL scored starter provenance: '+', '.join(
                        'W'+str(x['week']) for x in s['nl30_facts'])
                    reasons=nl30_qualified_roast(f,kind)
                    s['nl30_roast_reasons']=reasons
                    s['voice']='Full League Roast' if reasons else ('Sophisticated Savage'
                        if structure=='Fraud Alert' else 'Ruthless Sports Radio')
                    if structure=='Ruthless Sports Radio' and reasons:
                        # An extreme outcome is eligible for roast but not mandatory; no forced quota.
                        s['voice']='Full League Roast'
                    highest_used |= bool(decision['featured_raw_highest'])
                    if otherdecision:highest_used |= bool(otherdecision['featured_raw_highest'])
                    if kind=='after':prior.update((x['roster_id'],x['player_id']) for x in s['nl30_facts'])
                    decisions.append({'kind':kind,'index':idx,'structure':structure,'player':p['name'],
                                      'second_player':other['name'] if other else None,'voice':s['voice']})
            return decisions



        def nl30_closer_key(sentence, story):
            """Exactly the same canonicalization used by the strict reviewer-facing gate."""
            t=sentence.casefold()
            for name in (story['name_a'],story['name_b']):
                t=t.replace(name.casefold(),'team')
            t=re.sub(r'\d+(?:\.\d+)?','N',t)
            return re.sub(r'\s+',' ',t)


        def nl30_distinct_closers(stories, facts, kind):
            """Repair genuinely duplicated editorial closers using ONLY measured game facts.

            Leave the primary argument/mandatory paragraph-one-or-two player fact alone.
            Never weaken the downstream canonical-duplicate hard gate. The repair itself
            fails closed when none of the factual alternatives is defensible and distinct.
            """
            used=set()
            edits=[]
            for index,(s,f) in enumerate(zip(stories,facts),1):
                old=s['takeaway']
                key=nl30_closer_key(old,s)
                if key not in used:
                    used.add(key)
                    continue
                plan=s['nl30_plan'];structure=s['nl30_structure']
                a=s['name_a']; b=s['name_b']; options=[]
                if kind=='war':
                    gap=f['gap']; avg_a=f['ave_a']; avg_b=f['ave_b']
                    leader=a if avg_a>=avg_b else b
                    trailer=b if leader==a else a
                    if structure=='Autopsy' and 'drop' in plan:
                        focus=plan['focus'];before=plan['baseline'];after=plan['total'];drop=plan['drop']
                        options=[
                            f'From {before:.2f} to {after:.2f}: {focus} has a {drop:.2f}-point scoring decline to account for before this matchup.',
                            f'The previous {before:.2f} pace and last week\'s {after:.2f} are {drop:.2f} apart. That is {focus}\'s documented form problem.',
                            f'A {drop:.2f}-point drop belongs to the complete {focus} lineup, not to one convenient starter excuse.',
                            f'What changed for {focus}? Its most recent team total is {after:.2f}, which sits {drop:.2f} below the earlier baseline.',
                            f'The standings are one conversation; {focus}\'s {drop:.2f}-point slide from its own scoring pace is another.',
                            f'That {drop:.2f}-point shortfall is an actual completed-week result, not a scouting opinion about {focus}.',
                        ]
                    if structure=='Heavyweight':
                        options=[
                            f'{leader} owns the {gap:.2f}-point recent edge. A top-of-the-table matchup has a measured form leader, not a preassigned winner.',
                            f'Recently it has been {avg_a:.2f} for {a} and {avg_b:.2f} for {b}. The {gap:.2f}-point spread is the part worth debating.',
                        ]
                    if structure=='Fraud Alert':
                        options=[
                            f'Records earned their place in the table. The {gap:.2f}-point gap in recent scoring puts {leader} ahead in this narrower test.',
                            f'{trailer} has the record argument; {leader} has the recent scoring answer, with {gap:.2f} points per week between them.',
                        ]
                    if structure=='Turning Point':
                        focus=plan['focus'];baseline=plan['baseline'];total=plan['total'];delta=abs(total-baseline)
                        options=[
                            f'The same {focus} squad moved from {baseline:.2f} to {total:.2f}. That {delta:.2f}-point change deserves more attention than its label.',
                            f'Across the completed numbers, {focus}\'s {delta:.2f}-point swing is significant without pretending it predicts the next total.',
                        ]
                    options.extend([
                        f'{leader} has the higher recent scoring average at {max(avg_a,avg_b):.2f}. {trailer} has the {gap:.2f}-point measured gap to explain.',
                        f'Three completed weeks tell us {avg_a:.2f} for {a} and {avg_b:.2f} for {b}. The coming score is not part of that record yet.',
                        f'On recent production alone, {leader} leads by {gap:.2f} a week. Reputation cannot add points to the documented average.',
                        f'{trailer} trails in three-week scoring by {gap:.2f}; the record reflects performance already banked, not a forecast.',
                        f'{a} and {b} enter with a {gap:.2f}-point form separation. It is real evidence and still not a final score.',
                        f'It takes no imaginary lineup decision to see the {gap:.2f}-point observed advantage held by {leader}.',
                    ])
                else:
                    sa=f['score_a'];sb=f['score_b'];margin=f['margin'];med=f['median']
                    winner=a if sa>=sb else b;loser=b if winner==a else a
                    high=max(sa,sb);low=min(sa,sb)
                    if structure=='Autopsy':
                        focus=plan['focus']
                        if 'drop' in plan:
                            drop=float(plan['drop']);base=plan.get('baseline')
                            options.extend([
                                f'The {drop:.2f}-point form shortfall belongs to the entire {focus} lineup. An isolated starter does not explain the whole loss.',
                                f'{focus} needs to explain a {drop:.2f}-point fall from its preceding pace, not just the head-to-head result.',
                                f'A {drop:.2f}-point drop in team scoring is its own piece of evidence, regardless of which starter gets the scrutiny.',
                                f'The previous scoring comparison left {focus} a {drop:.2f}-point deficit against its own baseline.',
                            ])
                        if 'provisional_drop' in plan:
                            fall=int(plan['provisional_drop'])
                            options.extend([
                                f'{focus} moved down {fall} provisional standings positions. The reconstructed table is not offering a recount.',
                                f'{fall} places disappeared from {focus}\'s provisional ranking; one low starter score is only part of that explanation.',
                                f'The {fall}-place standings fall is the league-wide consequence, not merely a bad line on a box score.',
                            ])
                    elif structure=='Heist':
                        focus=plan['focus'];value=plan['total'];other=plan['other_total']
                        if plan['mode']=='strong_losing_score':
                            options.extend([
                                f'{focus} beat the {med:.2f} median with {value:.2f}, and the opponent still posted {other:.2f}. Strong is not the same as victorious.',
                                f'The week rewarded {focus}\'s {value:.2f} with an above-median finish and a head-to-head loss. That is an expensive contrast.',
                                f'Against {other:.2f} across the field, {value:.2f} simply was not enough. {focus} found the opponent that could prove it.',
                            ])
                        else:
                            options.extend([
                                f'{focus} won the opponent comparison at {value:.2f}; the {med:.2f} median recorded a different outcome.',
                                f'A head-to-head point belonged to {focus}. The median point did not, with {value:.2f} below {med:.2f}.',
                                f'That {value:.2f}-point win bought one standings point, not both. The median remained at {med:.2f}.',
                            ])
                    elif structure=='Demolition':
                        options.extend([
                            f'The {margin:.2f}-point margin is bigger than a single player contribution. {winner} won it across a full starting lineup.',
                            f'{winner} finished at {high:.2f}; {loser} at {low:.2f}. That {margin:.2f}-point separation was the actual contest.',
                            f'One player can dominate a box score, but {winner}\'s {margin:.2f}-point advantage is the team result that matters.',
                        ])
                    elif structure=='Turning Point':
                        focus=plan['focus'];base=plan['baseline'];total=plan['total'];delta=abs(total-base)
                        options.extend([
                            f'{focus} moved from {base:.2f} to {total:.2f}. The {delta:.2f}-point change is documented, whatever the result says.',
                            f'The old pace was {base:.2f}; the new Week {f["week"]} score was {total:.2f}. {focus} has an actual {delta:.2f}-point swing.',
                        ])
                    options.extend([
                        f'At {high:.2f}–{low:.2f}, {winner} held the head-to-head result and {loser} bore the {margin:.2f}-point difference.',
                        f'No one starter produced the entire {margin:.2f}-point separation. {winner} received the win on the sum of all starters.',
                        f'The {med:.2f}-point median is one comparison; the {margin:.2f}-point result between {winner} and {loser} is another.',
                        f'{loser}\'s {low:.2f} left a {margin:.2f}-point deficit to {winner}. This was a lineup-level difference.',
                        f'{winner} built {high:.2f}; {loser} finished at {low:.2f}. The difference was measurable without inventing a lineup fix.',
                        f'The final was {high:.2f} to {low:.2f}. A {margin:.2f}-point margin is too large to explain by rhetoric.',
                    ])
                for candidate in options:
                    ck=nl30_closer_key(candidate,s)
                    if ck in used or len(candidate.split())>45:
                        continue
                    if any(bad in candidate.casefold() for bad in _NL30_BANNED):
                        continue
                    if _packed(candidate) in _packed(s['lead']+' '+s['why']):
                        continue
                    s['takeaway']=candidate
                    s['punchline']=candidate
                    s['nl30_closer_rewrite_reason']='Canonical duplicate in live article; rephrased with verified matchup context'
                    edits.append({'issue':kind,'index':index,'structure':structure,'before':old,'after':candidate})
                    used.add(ck)
                    break
                else:
                    raise RuntimeError(f'NL30 HARD FAIL: no evidence-grounded distinct closer for {kind} story {index}')
            return edits


        def nl30_sentences_preserving_player(text, player_name):
            """Keep punctuation within verified full player names intact while finding
            ordinary sentence boundaries; never waive the same-sentence consequence
            requirement or join unrelated clauses to make unsupported copy pass.

            A protected full name is replaced only during segmentation, then restored
            byte-for-byte, so an abbreviated first/last name cannot be torn in half.
            """
            sentinel='NL30VERIFIEDPLAYERNAMEPLACEHOLDER'
            if sentinel in text or sentinel in player_name:
                raise RuntimeError('NL30 hard gate sentence marker collision')
            safe=text.replace(player_name,sentinel)
            return [piece.replace(sentinel,player_name)
                    for piece in re.split(r'(?<=[.!?])\s+',safe)]


        def nl30_gate(stories,facts,kind):
            if len(stories)!=6 or len(facts)!=6:raise RuntimeError('NL30 six-story contract failed')
            openers=set();highest_count=0
            report=[]
            for i,(s,f) in enumerate(zip(stories,facts),1):
                label=s['nl30_structure']; players=s['nl30_facts']; lead=s['lead']; why=s['why']; ending=s['takeaway']
                if not 1<=len(players)<=2:raise RuntimeError(f'NL30 WIP: player coverage invalid story {i}')
                if label=='Heavyweight' and len(players)!=2:raise RuntimeError('NL30 HEAVYWEIGHT must profile both teams')
                g=f['game'];plan=s['nl30_plan']
                if label=='Heavyweight' and {p['team'] for p in players}!={g['name_a'],g['name_b']}:
                    raise RuntimeError('NL30 HEAVYWEIGHT missing player from either side')
                if label=='Autopsy':
                    if players[0]['name'] not in lead or not any(f'{v:.2f}' in lead for v in (players[0]['points'],players[0].get('latest_points') if players[0].get('latest_points') is not None else players[0]['points'])):
                        raise RuntimeError('NL30 AUTOPSY must open with worst relevant starter score')
                    claim=(plan.get('drop') or plan.get('provisional_drop'))
                    if claim is not None and not any(t in ending for t in (f'{float(claim):.2f}',str(claim))):
                        raise RuntimeError('NL30 AUTOPSY closer must name the shortfall')
                if label=='Heist':
                    if plan['focus']!=players[0]['team'] or f'{plan["total"]:.2f}' not in lead:
                        raise RuntimeError('NL30 HEIST must open on affected team total and use that team starter')
                if label=='Fraud Alert' and not players[0]['is_recent_window']:
                    raise RuntimeError('NL30 FRAUD ALERT player must be from verified recent form window')
                if label=='Demolition':
                    if f'{f["margin"]:.2f}' not in lead or players[0]['team']!=plan['winner'] or players[0]['share_pct']<8:
                        raise RuntimeError('NL30 DEMOLITION needs margin-first and material winning starter share')
                if label=='Turning Point':
                    if not all(f'{x:.2f}' in lead for x in (plan['baseline'],plan['total'])) or                 players[0].get('player_swing') is None or                 players[0]['player_swing']*plan['direction']<=0:
                        raise RuntimeError('NL30 TURNING POINT must show baseline and directionally matching starter')
                if label=='Ruthless Sports Radio' and not s['nl30_roast_reasons'] and s['voice']!='Ruthless Sports Radio':
                    raise RuntimeError('NL30 fallback did not use Ruthless Sports Radio')
                if len(players)>1 and label!='Heavyweight':raise RuntimeError('NL30 second player cannot be decorative')
                if not s.get('nl30_opening_shape') or s['nl30_opening_shape'] in openers:
                    raise RuntimeError('NL30 HARD FAIL: duplicate syntactic opening shape')
                openers.add(s['nl30_opening_shape'])
                if any(z in (lead+' '+why+' '+ending).casefold() for z in _NL30_BANNED):
                    raise RuntimeError(f'NL30 banned editorial phrase in {s["headline"]}')
                if s['voice']=='Full League Roast' and not s['nl30_roast_reasons']:
                    raise RuntimeError('NL30 HARD FAIL: unearned Full League Roast')
                if not s['nl30_roast_reasons'] and s['voice'] not in ('Ruthless Sports Radio','Sophisticated Savage'):
                    raise RuntimeError('NL30 HARD FAIL: improper default voice')
                if len(lead.split())>76 or len(why.split())>81 or len(ending.split())>45:
                    raise RuntimeError('NL30 story too long for readable mobile typography')
                # Paragraph 2 is an independent fact/contrast, not a paraphrase of paragraph 1.
                nums=lambda t:set(re.findall(r'(?<![\w])\d+(?:\.\d+)?',t))
                if not (nums(why)-nums(lead)):
                    raise RuntimeError(f'NL30 HARD FAIL: paragraph 2 missing independent number in story {i}')
                if _packed(ending) in _packed(lead+' '+why):
                    raise RuntimeError('NL30 HARD FAIL: closing only restates the lead')
                for p in players:
                    score=f'{p["points"]:.2f}'
                    first_two=lead+' '+why
                    if p['name'] not in first_two or score not in first_two:
                        raise RuntimeError('NL30 HARD FAIL: player and points not in paragraph 1 or 2')
                    # The same sentence must include a verified matchup consequence; the
                    # consequence may be a team total, margin, median, or rank contrast.
                    context=(f'{f["score_a"]:.2f}',f'{f["score_b"]:.2f}',f'{f["median"]:.2f}',f'{f["margin"]:.2f}') if kind=='after' else (
                            f'{f["ave_a"]:.2f}',f'{f["ave_b"]:.2f}',f'{f["gap"]:.2f}', f'{f["latest_a"]:.2f}', f'{f["latest_b"]:.2f}')
                    # Do not break a sentence inside an NFL player's initials.
                    # For example, "J.K. Dobbins (RB) scored 2.70 ..." is ONE
                    # sentence: an ordinary punctuation split incorrectly turns it
                    # into "J.K." and "Dobbins ...", falsely failing this hard gate.
                    sentences=nl30_sentences_preserving_player(first_two,p['name'])
                    if not any(p['name'] in sentence and score in sentence and
                               (any(v in sentence for v in context) or any(k in sentence.lower() for k in
                                 ('team','median','margin','shortfall','gap','collapse','standings','matchup','total','scoring','pace','opponent','loss'))) for sentence in sentences):
                        raise RuntimeError(
                            f'NL30 HARD FAIL: player fact sentence lacks story consequence; '
                            f'edition={kind}, matchup={i}, structure={label}, featured={p["name"]!r}, '
                            f'points={score}; parsed_sentences={sentences!r}')
                    if not p['source_endpoint'].startswith('league/') or p['data_mode']!='LIVE_SLEEPER' and p['data_mode']!='SYNTHETIC_OFFLINE_FIXTURE':
                        raise RuntimeError('NL30 invalid starter provenance')
                    if kind=='war' and max(p['week_span'])>=f['window'].split('–')[-1].__len__()+1000:
                        pass  # preserved below is the actual strictly checked cap
                    if kind=='war' and max(p['week_span'])>len(f['game']['scores_a']):
                        raise RuntimeError('NL30 WAR: used a post-preview player fact')
                highest_count+=sum(bool(d['featured_raw_highest']) for d in s['nl30_decisions'])
                # Player evidence can never be the sole-cause explanation of a team score.
                if any(t in (lead+' '+why).lower() for t in ('would have won if','should have started','bench instead','caused the loss')):
                    raise RuntimeError('NL30 unsupported lineup or sole-cause claim')
                if re.search(r'\b(PREGAME-BASELINE REVERSAL|STANDINGS SHOCK|RECORD VERSUS FORM|UNDERDOG PATH)\b', lead+' '+why,re.I):
                    raise RuntimeError('NL30 internal category leaked to reader')
                report.append({'matchup':i,'opening_shape':s['nl30_opening_shape'],
                               'structure_internal_only':label,'voice':s['voice'],
                               'players':[p['name'] for p in players],
                               'paragraph_2_new_verified_numbers':sorted(nums(why)-nums(lead))})
            if highest_count>1:raise RuntimeError('NL30 highest-raw starter repeated more than once per issue')
            # Binary guard against template closers with changed names/numbers only.
            canon=[]
            for s in stories:
                t=s['takeaway'].casefold()
                for name in (s['name_a'],s['name_b']):t=t.replace(name.casefold(),'team')
                t=re.sub(r'\d+(?:\.\d+)?','N',t)
                t=re.sub(r'\s+',' ',t)
                canon.append(t)
            if len(set(canon))!=len(canon):
                raise RuntimeError('NL30 HARD FAIL: duplicated closing template after masking teams and scores')
            return {'mandatory_facts':6,'hard_gate_result':'PASS',
                    'openings_unique':True,'featured_highest_raw_count':highest_count,
                    'voice_counts':dict(Counter(s['voice'] for s in stories)),
                    'stories':report}


        def nl30_html(heading,sub,stories,logo,stamp,kind,layout_levels=None):
            html=_NL30_NL29_RENDER(heading,sub,stories,logo,stamp,kind,layout_levels)
            html=html.replace('<span>NUMBERS THAT HURT</span>','')
            return html


        def nl30_markdown(title,week,stories,data,kind):
            lines=[f'# {title} — Week {week}', '', 'EDITORIAL SHADOW · NOT PUBLISHED',
                   'Verified completed Sleeper starter scores; provisional H2H+median standings.','']
            for i,s in enumerate(stories,1):
                lines += [f'## {i:02d}. {s["headline"]}',f'**{s["name_a"]} vs. {s["name_b"]}**',
                          '',s['lead'],'',s['why'],'',s['takeaway'],'',
                          f'*Source:* {s["source"]}; retrieved {data["generated_at_utc"]} UTC.','']
            return '\n'.join(lines)+'\n'


        def nl30_story_ledger(stories,kind):
            result=[]
            for idx,s in enumerate(stories,1):
                items=[]
                for p,d in zip(s['nl30_facts'],s['nl30_decisions']):
                    items.append({'player_id':p['player_id'],'name':p['name'],'position':p['position'],
                        'roster_id':p['roster_id'],'team':p['team'],'points':p['points'],
                        'share_pct':round(p['share_pct'],3),'weeks':p['week_span'],
                        'player_swing':p.get('player_swing'),'prior_player_mean':p.get('prior_player_mean'),
                        'source_endpoint':p['source_endpoint'],'source_endpoints':p.get('source_endpoints',[]),
                        'identity_source':p['identity_source'],'source_verified':True,
                        'nl32_current_week_started':p.get('nl32_current_week_started',False),
                        'nl32_anchor_week':p.get('nl32_anchor_week'),
                        'nl32_current_week_source':p.get('nl32_current_week_source'),
                        'nl32_current_week_points':p.get('nl32_current_week_points'),
                        'selection_reason':d['selection_reason'],
                        'higher_scorers_passed_over':d['higher_raw_scorers_not_selected']})
                result.append({'edition':kind,'matchup_index':idx,'teams':[s['name_a'],s['name_b']],
