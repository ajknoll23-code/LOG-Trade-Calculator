        def nl29_candidates(f, s, kind, profiles):
            """During NL32 challenger only, anchor ALL features to actual W8 starters.

            Historical W5-7 points can explain a player's W8 swing, but a player who
            started W6 and was not in W8 `starters` is not a participant in the
            completed W8 matchup and must not serve as the W8 storyline's featured fact.
            """
            pool = _NL32_ORIGINAL_CANDIDATES(f, s, kind, profiles)
            if not _NL32_CHALLENGER_ONLY:
                return pool   # exact original NL29 control, same-source snapshot
            post = int(profiles['post_week'])
            if post not in profiles['weeks']:
                raise RuntimeError('NL32 source failure: missing completed anchor week')
            current = {(int(rid), str(p['player_id'])):p
                       for rid, roster in profiles['weeks'][post].items()
                       for p in roster}
            filtered=[]
            for p in pool:
                k=(int(p['roster_id']),str(p['player_id']))
                if k not in current: continue
                if k[1] in _NL32_EXCLUDED_PLAYER_IDS or p['name'].strip().casefold() in _NL32_EXCLUDED_NAMES:continue
                evidence=current[k]
                if evidence['week']!=post or evidence['source_endpoint']!=f'league/{LEAGUE_ID}/matchups/{post}':
                    raise RuntimeError('NL32 source failure: current-week starter anchor lacks the exact weekly endpoint')
                # The prior-week series may be cited only for the same ID, never by
                # treating an inactive/bench zero as a completed weekly starter score.
                if kind=='war' and (p.get('latest_points') is None or abs(p['latest_points']-evidence['points'])>0.011):
                    raise RuntimeError('NL32 source failure: latest individual points are not the completed-week starters score')
                if kind=='after' and (p['week']!=post or abs(p['points']-evidence['points'])>0.011):
                    raise RuntimeError('NL32 source failure: Aftermath starter is not the completed-week starter')
                filtered.append({**p,'nl32_anchor_week':post,'nl32_current_week_source':evidence['source_endpoint'],
                                 'nl32_current_week_started':True,
                                 'nl32_current_week_points':evidence['points'],
                                 'nl32_starter_status_evidence':'starters[] intersection players_points from exact weekly matchup'})
            return filtered


