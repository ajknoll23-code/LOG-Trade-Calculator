            _nl30_shutil.make_archive(str(out/'SEND-TO-GROK-BLIND-COMPARISON'),'zip',root_dir=blind)
            return blind


        def nl30_inherited_quality(stories, kind):
            """Preserve NL28/NL29 factual/headline gates, adapting only the obsolete
            presentation-structure diversity check to NL30's observed syntax.

            NL28 used `structure` to select one of four PDF body layouts. NL30
            deliberately selects an EVIDENCE-EARNED storyline independently of
            its six unique grammatical opener shapes. A real week's games can
            legitimately produce only narrative/contrast body layouts. Forcing
            a third category just to appease the old counter would violate the
            NL30 fallback requirement. Count ACTUAL generated opening patterns
            instead, leaving the six-story unique-opening hard gate intact.
            """
            if len(stories)!=6:
                raise RuntimeError('NL30 inherited QA: expected six stories')
            angles=dict(Counter(s['angle'] for s in stories))
            layouts=dict(Counter(s['structure'] for s in stories))
            shapes=dict(Counter(s.get('nl30_opening_shape') for s in stories))
            headlines=[_norm(s['headline']) for s in stories]
            if len(set(headlines))!=6 or len(angles)<4 or max(angles.values())>2:
                raise RuntimeError('NL30 inherited QA: editorial headline/angle diversity failed')
            if None in shapes or len(shapes)<3:
                raise RuntimeError(f'NL30 inherited QA: insufficient observed rhetorical opening shapes: {shapes}')
            if len(shapes)!=6:
                raise RuntimeError('NL30 inherited QA: every story must have a unique syntactic opening shape')
            first=[_norm(s['lead'])[:38] for s in stories]
            ending=[_norm(s['takeaway']) for s in stories]
            if not all(s.get('joke_basis') and s.get('tone')=='brash_evidence_led_clean' for s in stories):
                raise RuntimeError('NL30 inherited QA: observed jokes must be supported by source statistics')
            if len(set(first))<5 or len(set(ending))<6:
                raise RuntimeError('NL30 inherited QA: repeated editorial leads or takeaways')
            for index,s in enumerate(stories,1):
                if not s['lead'] or not s['why'] or not s['takeaway']:
                    raise RuntimeError(f'NL30 inherited QA: story {index} missing substantive component')
                if '?' in s['takeaway']:
                    raise RuntimeError(f'NL30 inherited QA: story {index} ends in generic question')
                if len(s['lead'].split())>76 or len(s['why'].split())>81 or len(s['takeaway'].split())>45:
                    raise RuntimeError(f'NL30 inherited QA: story {index} overflows mobile type budget')
                if s.get('player_note') and not s['player_note'].get('source'):
                    raise RuntimeError(f'NL30 inherited QA: story {index} has ungrounded player note')
            return {'unique_angles':len(angles),'angle_counts':angles,
                    'rhetorical_structures':shapes,
                    'nl30_actual_syntactic_opening_shapes':shapes,
                    'nl30_actual_pdf_body_layouts':layouts,
                    'headlines_unique':True,'lead_and_ending_duplicate_guard':True,
                    'player_notes_printed':sum(bool(s.get('player_note')) for s in stories),
                    'editorial_acceptance':'HUMAN_REVIEW_REQUIRED',
                    'nl30_legacy_compatibility':'All legacy fact/voice/length/angle/headline gates retained; syntax diversity checked on actual NL30 opener shapes, not evidence-dependent visual body layout count.'}


        def nl30_r4_legacy_gate_regression():
            # Reproduce exact live failure distribution: five narrative PDF bodies,
            # one contrast, but SIX distinct real syntactic opening patterns.
            rows=[]
            for i in range(6):
                rows.append(dict(angle=f'angle-{i}',structure='narrative' if i<5 else 'contrast',
                    nl30_opening_shape=f'observed_distinct_opener_{i}',
                    headline=f'Unique factual headline {i}',
                    lead=f'Unique lead {i} includes actual team scoring and a {i+10}.00 point gap.',
                    why=f'The verified player contributed {i+15}.00 points and the team scored {200+i}.00.',
                    takeaway=f'Team {i} finished with a measurable {50+i}.00 point difference.',
                    joke_basis=f'verified team scoring {i}',tone='brash_evidence_led_clean',
                    player_note=None))
            legacy_layouts=Counter(s['structure'] for s in rows)
            assert dict(legacy_layouts)=={'narrative':5,'contrast':1}
            proof=nl30_inherited_quality(rows,'war')
            assert len(proof['rhetorical_structures'])==6
            assert proof['nl30_actual_pdf_body_layouts']==dict(legacy_layouts)
            # Prove the revised gate fails closed on actually duplicated syntax.
            rows[1]['nl30_opening_shape']=rows[0]['nl30_opening_shape']
            try: nl30_inherited_quality(rows,'war')
            except RuntimeError as ex: assert 'syntactic opening shape' in str(ex)
            else: raise AssertionError('NL35R2 must reject duplicate syntactic openings')
            print('PASS NL35R2: actual 5 narrative + 1 contrast layout accepted with 6 distinct observed openers; duplicate syntax rejected')

        def nl30_robust_cover_render(heading,sub,stories,logo,stamp,kind,root,pdf):
            """Independently fit the live cover BEFORE merging with six verified stories.

            The 2026 Week-9 live cover had long team names/headlines and was two
            pages on GitHub's font/layout environment, although the NL29 baseline
            and synthetic fixture covered one. Use modest, cover-only CSS spacing
            stages. All content, story facts, and reader font-size gates remain.
            A failed third stage remains a hard failure, never a dropped cover item.
            """
            # From restrained to tighter spacing; always 8pt+ visible text, keep the
            # original logo/heading, all six matchup index rows and provenance note.
            css_levels=[
                """.cover .masthead{padding:4mm 4mm;gap:2.8mm}
                .cover .masthead img{height:14mm;max-width:14mm}
                .cover .cover-main{padding:2.4mm 3mm 1mm}
                .cover .cover-deck{font:10.2pt/1.33 Georgia;margin:1.2mm 0 2.5mm}
                .cover .index-item{padding:.7mm .2mm;gap:2.3mm}
                .cover .index-item small{font:9pt/1.2 Georgia;margin-top:.15mm}
                .cover .cover-note{margin-top:1.5mm;padding:1.2mm 1.8mm}""",
                """.cover .masthead{padding:3mm 3.3mm;gap:2.3mm}
                .cover .masthead img{height:13.5mm;max-width:14mm}
                .cover .cover-main{padding:1.5mm 2.8mm .5mm}
                .cover .cover-deck{font:10pt/1.27 Georgia;margin:.7mm 0 1.5mm}
                .cover .index-item{padding:.25mm .2mm;gap:2mm}
                .cover .index-item strong{font:bold 8.9pt/1.16 Arial}
                .cover .index-item small{font:8.9pt/1.14 Georgia;margin-top:0}
                .cover .cover-note{margin-top:1mm;padding:1mm 1.4mm}""",
                """.cover .masthead{padding:2.5mm 3mm;gap:2mm}
                .cover .masthead img{height:13mm;max-width:13mm}
                .cover h1{font:18pt/1.02 Georgia;margin:1mm 0}
                .cover .cover-main{padding:1mm 2.5mm .3mm}
                .cover .cover-deck{font:9.7pt/1.22 Georgia;margin:.4mm 0 1mm}
                .cover .index-item{padding:.1mm .15mm;gap:1.8mm}
                .cover .index-item strong{font:bold 8.7pt/1.1 Arial}
                .cover .index-item small{font:8.7pt/1.10 Georgia;margin-top:0}
                .cover .cover-note{font:8pt/1.2 Arial;margin-top:.6mm;padding:.7mm 1.2mm}""",
            ]
            original_render=globals()['render_html']
            last_cover_error=None
            for stage,style in enumerate(css_levels):
                def render_with_cover_fit(*args,**kwargs):
                    html=original_render(*args,**kwargs)
                    if html.count('</style>')!=1 or '<section class="cover">' not in html:
                        raise RuntimeError('NL30 cover: unexpected HTML structure; do not modify content')
                    return html.replace('</style>', '\n/* NL30 verified cover-fit stage '+str(stage)+' */\n'+style+'\n</style>',1)
                globals()['render_html']=render_with_cover_fit
                try:
                    html,levels,layout=nl28_segmented_render(heading,sub,stories,logo,stamp,kind,root,pdf)
                    # PDF was verified by the inherited renderer. Confirm all six
                    # cover entries survived and this fit is represented in the HTML.
                    if html.count('class="index-item"')!=6:
                        raise RuntimeError('NL30 cover did not preserve all six matchup entries')
                    return html,levels,layout+[{'cover_fit_stage':stage,'cover_css_tested':stage+1}]
                except RuntimeError as exc:
                    if not str(exc).startswith('NL28 cover needs '):
                        raise
                    last_cover_error=str(exc)
                finally:
                    globals()['render_html']=original_render
            raise RuntimeError(f'NL30 cover cannot fit with 8pt+ readable typography: {last_cover_error}')


