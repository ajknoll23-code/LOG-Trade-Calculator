                    # The ranking drop itself is provisional: don't exaggerate it.
                    return f'{a} vs. {b}: The Standings Just Pulled the Fire Alarm'
                return _NL35_AFTER_HEADLINES.get(angle,f'{a} and {b}: The Scoreboard Is Not Taking Appeals')
            return _NL35_WAR_HEADLINES.get(angle,f'{a} and {b}: Somebody Is About to Have a Long Monday')


        def nl32_apply_editorial(war,after,warfacts,aftfacts,profiles):
            decisions=_NL35_PREVIOUS_APPLY(war,after,warfacts,aftfacts,profiles)
            for kind,stories,facts in (('after',after,aftfacts),('war',war,warfacts)):
                counts=Counter(x['angle'] for x in stories)
                for index,(s,f) in enumerate(zip(stories,facts)):
                    duplicated=counts[s['angle']]>1
                    lead,why,closer=nl35_write(s,f,kind,index,duplicated)
                    s['lead']=lead;s['why']=why;s['takeaway']=closer;s['punchline']=closer
                    s['headline']=nl35_headline(s,f,kind,index)
                    if duplicated:
                        s['headline']=f'{s["name_a"]} vs. {s["name_b"]}: '+s['headline']
                    s['nl35_editorial_evidence']={
                        'voice_mix_percent':NL35_VOICE,'writing_priority':'ROAST > OPINION > VERIFIED STATS',
                        'verified_featured_player':s['nl30_facts'][0]['name'],
                        'week_relative_starter_anchor':s['nl30_facts'][0]['nl32_anchor_week'],
                        'reader_line_roast':'lead + second paragraph punch + closer',
                        'source_backed_contrasts':sorted(nl31_numeric_literals(why)-nl31_numeric_literals(lead)),
                        'human_approval':'PENDING'}
                    s['keys']=list(dict.fromkeys(s['keys']+['nl35_brash_roast_75_15_10']))
                    # Keep cumulative audit ledgers in sync with the REAL rendered text.
                    extra=sorted(nl31_numeric_literals(why)-nl31_numeric_literals(lead))
                    for key in ('nl31_editorial_evidence','nl32_editorial_evidence','nl33_editorial_evidence','nl34_editorial_evidence'):
                        if key not in s:raise RuntimeError('NL35 lost inherited provenance ledger '+key)
                    s['nl31_editorial_evidence']['paragraph_2_extra_numbers']=extra
                    s['nl32_editorial_evidence']['paragraph2_canonical_pattern']=nl32_canon(why,s)
                    s['nl32_editorial_evidence']['closer_canonical_pattern']=nl32_canon(closer,s)
                    s['nl33_editorial_evidence']['paragraph_two_adds']=extra
                    s['nl33_editorial_evidence']['paragraph_2_shape']=nl33_copy_fingerprint(why,s)
                    s['nl33_editorial_evidence']['closing_shape']=nl33_copy_fingerprint(closer,s)
                    s['nl34_editorial_evidence']['paragraph_two_added_values']=extra
                    s['nl34_editorial_evidence']['paragraph_2_fingerprint']=nl33_copy_fingerprint(why,s)
                    s['nl34_editorial_evidence']['closer_fingerprint']=nl33_copy_fingerprint(closer,s)
            nl34_duplicate_guard(war,after)
            return decisions


        def nl32_gate(stories,facts,kind):
            for s in stories:
                if 'nl35_editorial_evidence' in s:
                    extra=sorted(nl31_numeric_literals(s['why'])-nl31_numeric_literals(s['lead']))
                    s['nl35_editorial_evidence']['source_backed_contrasts']=extra
                    s['nl31_editorial_evidence']['paragraph_2_extra_numbers']=extra
                    s['nl32_editorial_evidence']['paragraph2_canonical_pattern']=nl32_canon(s['why'],s)
                    s['nl32_editorial_evidence']['closer_canonical_pattern']=nl32_canon(s['takeaway'],s)
                    s['nl33_editorial_evidence']['paragraph_two_adds']=extra
                    s['nl33_editorial_evidence']['paragraph_2_shape']=nl33_copy_fingerprint(s['why'],s)
                    s['nl33_editorial_evidence']['closing_shape']=nl33_copy_fingerprint(s['takeaway'],s)
                    s['nl34_editorial_evidence']['paragraph_two_added_values']=extra
                    s['nl34_editorial_evidence']['paragraph_2_fingerprint']=nl33_copy_fingerprint(s['why'],s)
                    s['nl34_editorial_evidence']['closer_fingerprint']=nl33_copy_fingerprint(s['takeaway'],s)
            result=_NL35_PREVIOUS_GATE(stories,facts,kind)
            for i,s in enumerate(stories,1):
                e=s.get('nl35_editorial_evidence')
                if e is None or e['voice_mix_percent']!=NL35_VOICE:
                    raise RuntimeError(f'NL35 missing exact 75/15/10 voice specification {kind} {i}')
                if not e['source_backed_contrasts']:
                    raise RuntimeError(f'NL35 second paragraph missing fresh verified fact {kind} {i}')
                # Check that real, visible reader copy—not just a metadata label—has
                # multiple editorial punch lines, and a declared opinion for previews.
                if kind=='war' and not s['takeaway'].startswith('My pick:'):
                    raise RuntimeError(f'NL35 War Room missing explicitly opinionated pick {i}')
                if len(s['why'].split())>81 or len(s['takeaway'].split())>45:
                    raise RuntimeError(f'NL35 joke overflow: retain facts and fail the build {kind} {i}')
            result['nl35_75_15_10_voice']=NL35_VOICE
            result['nl35_human_review_pending']=True
            return result


        def nl32_cross_edition_gate(war,after):
            _NL35_PREVIOUS_CROSS(war,after)
            return nl34_duplicate_guard(war,after)


        def nl35_selftest():
            assert sum(NL35_VOICE.values())==100
            assert NL35_VOICE=={'roasting_trash_talk_attitude':75,'bold_matchup_opinions':15,'verified_statistics':10}
            assert len(set(_NL35_AFTER_HEADLINES.values()))==len(_NL35_AFTER_HEADLINES)
            assert len(set(_NL35_WAR_HEADLINES.values()))==len(_NL35_WAR_HEADLINES)
            for s in (_NL35_AFTER_ENDINGS, _NL35_WAR_ENDINGS):
                assert len(s)==6
            # Regression: live Aftermath #2/#4 shared a stock Autopsy clause.
            # Shape-masking must see six distinct clauses even without player names.
            for kind in ('after','war'):
                fake={'name_a':'TEST A','name_b':'TEST B','nl30_facts':[{'name':'TEST PLAYER','team':'TEST A'}]}
                shapes=[nl34_sentence_fingerprint(nl35_autopsy_receipt(kind,i,'TEST A','34.55'),fake)
                        for i in range(6)]
                assert len(set(shapes))==6, f'NL35 Autopsy repeated masked {kind} clause'
            assert nl34_sentence_fingerprint(nl35_autopsy_receipt('after',1,'TEAM A','34.55'),fake) != \
                   nl34_sentence_fingerprint(nl35_autopsy_receipt('after',3,'TEAM B','56.05'),fake), \
                   'NL35 real Aftermath #2/#4 duplicate regression'
            print('PASS NL35R2: 75/15/10 editorial priority, 12 roast angles, explicit preview opinion, retained inherited hard gates')

        _NL35_PREVIOUS_SELFTEST=selftest

        def selftest():
            _NL35_PREVIOUS_SELFTEST()
            nl35_selftest()


        if __name__=='__main__':
            p=argparse.ArgumentParser()
            p.add_argument('--out',type=Path)
            p.add_argument('--root',type=Path,default=Path.cwd())
            p.add_argument('--war-week',type=int,default=9)
            p.add_argument('--aftermath-week',type=int,default=8)
            p.add_argument('--fixture',type=Path)
            p.add_argument('--selftest',action='store_true')
            args=p.parse_args()
            if args.selftest:selftest()
            else:nl30_execute(args.out,args.root,args.war_week,args.aftermath_week,args.fixture)
        NL30_ENGINE
        python3 -m py_compile "$RUNNER_TEMP/log_nl35r2_editorial.py"
        python3 "$RUNNER_TEMP/log_nl35r2_editorial.py" --selftest
    - name: Build NL29 control and NL35R2 BRASH challenger from one live Week 8/9 snapshot
      shell: bash
      env:
        WAR_WEEK: ${{ inputs.war_week }}
        AFTERMATH_WEEK: ${{ inputs.aftermath_week }}
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/log_nl35r2_editorial.py" \
          --root "$GITHUB_WORKSPACE" \
          --out "$RUNNER_TEMP/log-nl30-editorial" \
          --war-week "$WAR_WEEK" \
          --aftermath-week "$AFTERMATH_WEEK"
    - name: Independently verify live starter facts, 75/15/10 voice, PDFs and blinded package
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'NL30_INDEPENDENT_QA'
        import json,os,pathlib,re,zipfile
        import fitz
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'log-nl30-editorial'
        x=json.loads((root/'NL35R2-Player-Provenance-and-Selection-Ledger.json').read_text(encoding='utf-8'))
        assert x['model']=='A-NL35R2'
        assert x['fixture_test_not_live_evidence'] is False, 'Synthetic output cannot pass live acceptance'
        assert x['publication_authorized'] is False and x['picks_archived'] is False
        assert x['private_free_agents_read'] is False and x['automatic_85_point_gate'] is False
        assert x['human_editorial_review']=='PENDING'
        assert x['unqualified_roasts']==0
        assert len(x['featured_stories'])==12
        assert sum(len(r['featured_starters']) for r in x['featured_stories'])>=12
        assert x['nl32_starter_anchor_verified'] is True
        assert x['nl32_featured_anchor_week']==x['aftermath_week']
        assert len(x['nl32_editorial_evidence'])==12
        assert len(x['nl33_editorial_evidence'])==12
        assert len(x['nl34_editorial_evidence'])==12, 'missing NL35 audit of 12 feature choices'
        assert x['nl35_voice_mix_percent']=={'roasting_trash_talk_attitude':75,'bold_matchup_opinions':15,'verified_statistics':10}
        assert len(x['nl35_editorial_evidence'])==12 and all(z['human_approval']=='PENDING' for z in x['nl35_editorial_evidence'])
        assert all(z['source_backed_contrasts'] for z in x['nl35_editorial_evidence'])
        assert all(x['quality'][k]['nl35_75_15_10_voice']==x['nl35_voice_mix_percent'] for k in ('WarRoom','Aftermath'))
        assert all(d['paragraph_two_added_values'] for d in x['nl34_editorial_evidence'])
        assert all(d['selection_audits'] and all(a['highest_eligible_player_id']==a['chosen_player_id']
          and a['candidate_count']>=1 for a in d['selection_audits']) for d in x['nl34_editorial_evidence'])
        assert all(d['human_review_pending'] for d in x['nl34_editorial_evidence'])
        assert all(x['quality'][k]['nl34_unique_story_arguments']==6 and
                   x['quality'][k]['nl34_explanatory_selections_audited']==6 for k in ('WarRoom','Aftermath'))
        assert all(e['paragraph_two_adds'] for e in x['nl33_editorial_evidence'])
        assert all(e['same_source_NL29_control_untouched'] is True for e in x['nl33_editorial_evidence'])
        assert all(e['human_review_pending'] is True for e in x['nl33_editorial_evidence'])
        assert all(x['quality'][k]['nl33_distinct_p2_and_closers']==6 for k in ('WarRoom','Aftermath'))
        assert x['nl32_excluded_player_ids']==['13557']
        for r in x['featured_stories']:
            players=r['featured_starters']
            assert all(p.get('nl32_current_week_started') is True and p.get('nl32_anchor_week')==x['aftermath_week'] for p in players)
            assert all(p['player_id'] not in x['nl32_excluded_player_ids'] for p in players)
            assert all(p['nl32_current_week_source'].endswith('/matchups/'+str(x['aftermath_week'])) for p in players)
            assert 1<=len(players)<=2
            if r['internal_structure']=='Heavyweight':
                assert len(players)==2 and len({p['team'] for p in players})==2
            assert r['opening_shape']
            if r['voice']=='Full League Roast':assert r['roast_thresholds_met']
            text=' '.join(r['narrative_paragraphs'])
            assert 'athan kaliakmanis' not in text.casefold()
            for p in players:
                assert p['name'] in text and f"{p['points']:.2f}" in text
                assert p['source_endpoint'].startswith('league/') and p['source_verified']
                assert p['selection_reason'] and 'higher_scorers_passed_over' in p
                if r['edition']=='WarRoom':assert max(p['weeks'])<x['war_week']
        for kind,w in [('WarRoom',x['war_week']),('Aftermath',x['aftermath_week'])]:
            q=x['quality'][kind]
            assert q['hard_gate_result']=='PASS' and q['openings_unique']
            assert q['mandatory_facts']==6 and q['pages']==7 and q['html_pdf_verified']
            assert len(q['page_geometry'])==7
            assert min(p['minimum_visible_font_pt'] for p in q['page_geometry'])>=7.15
            path=root/f'LOG-NL35R2-{kind}-W{w:02d}-Editorial-Shadow.pdf'
            md=(root/f'LOG-NL35R2-{kind}-W{w:02d}-Editorial-Shadow.md').read_text(encoding='utf-8')
            if kind=='WarRoom':
                assert md.count('My pick:')==6, 'each preview must publicly take a side'
            assert 'EDITORIAL SHADOW' in md and 'NOT PUBLISHED' in md
            base=root/'BASELINE-NL29R1'/f'LOG-NL29R1-{kind}-W{w:02d}-Editorial-Shadow.pdf'
            for pdf in (path,base):
                assert pdf.is_file()
                with fitz.open(pdf) as d:
                    assert len(d)==7, (pdf,len(d))
                    assert all(len(p.get_text())>320 for p in d)
            assert len([r for r in x['featured_stories'] if r['edition']==kind])==6
        reviewer=root/'SEND-TO-GROK-BLIND-COMPARISON.zip'
        assert reviewer.exists() and reviewer.stat().st_size>100000
        with zipfile.ZipFile(reviewer) as z:
            names=z.namelist()
            assert len([n for n in names if n.endswith('.pdf')])==4
            assert len([n for n in names if n.endswith('.json')])==2
            assert not any('NL29' in n or 'NL30' in n or 'UNBLIND' in n for n in names)
            assert 'GROK-BLIND-REVIEW-INSTRUCTIONS.md' in names
        assert (root/'EDITOR-ONLY-UNBLIND-KEY.json').is_file()
        print('PASS: NL30 live 12/12 player-led stories; 2x7 verified pages; same-source NL29 baseline; anonymized blind package; no publication')
        NL30_INDEPENDENT_QA
    - name: Prove no repository files were modified
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        git diff --exit-code
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'PASS: read-only; no publishing, pick archiving, mail, production or free-agent changes'
    - name: Upload both source-comparable PDF editions, evidence and blind review ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LOG-NL35R2-Final-Editorial-Shadow-${{ github.run_id }}
        path: ${{ runner.temp }}/log-nl30-editorial/
        if-no-files-found: warn
        retention-days: 90
    - name: Summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cat >> "$GITHUB_STEP_SUMMARY" <<'NL35R2_SUMMARY'
        ## NL35R2 — BRASH SHADOW ONLY: 75% roast, 15% bold opinion, 10% statistics
        - NL29 control unchanged; NL35 challenger is roast-first and source-backed.
