        def render_html(heading, issue_sub, stories, logo, stamp, kind, layout_levels=None):
            html = _NL28_PREVIOUS_RENDER_HTML(heading, issue_sub, stories, logo, stamp, kind, layout_levels)
            # The varied structural treatments remain; boilerplate editorial-box labels do not.
            return (html.replace('<b>THE RECEIPT</b> ', '')
                        .replace('<b>THE VERDICT</b> ', '')
                        .replace('<b>WHY THIS MATTERS</b>', '')
                        .replace('Six games. Six receipts. The box scores brought enough attitude for everyone. No invented picks.',
                                 'Six matchups. Actual numbers. Uncomfortably direct conclusions.'))


        def nl28_balance_voices(war,after,warfacts,afterfacts):
            """Balance actual story labels toward 55/15/30 across both issues.

            A full roast is earned by an extreme verified result, never forced
            solely to satisfy a nominal percentage. Three of twelve is the
            nearest feasible roast allowance below 30%; two of twelve is the
            closest sophisticated-savage allocation to 15%.
            """
            entries = ([('war',s,f) for s,f in zip(war,warfacts)] +
                       [('after',s,f) for s,f in zip(after,afterfacts)])
            if len(entries)!=12:
                raise RuntimeError('NL28 voice assignment requires 12 unique stories')
            def catastrophe(item):
                kind,s,f=item
                angle=s['angle']
                if kind=='after' and angle=='large-weekly-margin' and f['margin']>=100:
                    return 250+f['margin']
                if kind=='after' and angle=='standings shock':
                    g=f['game']
                    fall=max(0,-g['rank_delta_a'],-g['rank_delta_b'])
                    if fall>=3:return 220+10*fall
                if kind=='war' and angle=='underdog path' and f['gap']>=45:
                    return 200+f['gap']
                if kind=='war' and angle=='recent reversal':
                    falls=[v for v in (f['latest_change_a'],f['latest_change_b']) if v is not None]
                    if falls and min(falls)<=-45:return 110+abs(min(falls))
                if kind=='war' and angle=='leader under challenge' and f['gap']>=50:
                    return 70+f['gap']
                return 0
            full_candidates=sorted([(catastrophe(x),i) for i,x in enumerate(entries)
                                    if catastrophe(x)>0],reverse=True)
            roast_ids={i for _,i in full_candidates[:3]}
            dry_order={'record versus form':100,'win without median':96,
                       'fine margins':75,'strong score in defeat':68}
            savage_candidates=sorted([(dry_order.get(x[1]['angle'],0),i)
                                      for i,x in enumerate(entries) if i not in roast_ids
                                      and dry_order.get(x[1]['angle'],0)>0],reverse=True)
            savage_ids={i for _,i in savage_candidates[:2]}
            for i,(_,s,_) in enumerate(entries):
                v=('Full League Roast' if i in roast_ids else
                   'Sophisticated Savage' if i in savage_ids else
                   'Ruthless Sports Radio')
                s['voice']=v
            # The label must reflect the actual selection, not an automatic
            # full-roast designation whenever a single threshold is crossed.
            mix=Counter(s['voice'] for _,s,_ in entries)
            assert mix['Full League Roast']<=3 and mix['Sophisticated Savage']<=2
            assert mix['Ruthless Sports Radio']>=7


        def quality_report(stories,kind):
            result = _NL28_PREVIOUS_QUALITY(stories,kind)
            result['voice_targets_percent'] = {'Ruthless Sports Radio':55,'Sophisticated Savage':15,'Full League Roast':30}
            result['actual_voice_counts'] = dict(Counter(s['voice'] for s in stories))
            return result


        def nl28_segmented_render(heading,sub,stories,logo,stamp,kind,root,pdf):
            """Render cover and six matchups in isolation, audit, then merge; no page truncation."""
            import fitz
            from weasyprint import HTML
            levels = {}
            history = []
            for attempt in range(3):
                html = render_html(heading,sub,stories,logo,stamp,kind,levels)
                fragments = re.findall(r'<section class="(?:cover|game-page(?: compact)?(?: tight)?)">.*?</section>',html,re.S)
                if len(fragments) != len(stories)+1:
                    raise RuntimeError(f'NL28 expected 1 cover + 6 story sections, got {len(fragments)}')
                head = html.split('<body>',1)[0]+'<body>'
                pdf_parts = []
                spilling = []
                for page_no, fragment in enumerate(fragments,1):
                    page_html = (head+fragment+'</body></html>')
                    page_html = page_html.replace('content:"LOG · " counter(page)', f'content:"LOG · {page_no}"')
                    single = fitz.open(stream=HTML(string=page_html,base_url=str(root)).write_pdf(),filetype='pdf')
                    if len(single) != 1:
                        if page_no == 1:
                            raise RuntimeError(f'NL28 cover needs {len(single)} pages. No silent trimming allowed.')
                        spilling.append(page_no-1)
                    pdf_parts.append(single)
                if not spilling:
                    merged = fitz.open()
                    for single in pdf_parts:
                        merged.insert_pdf(single)
                    if len(merged) != 7:
                        raise RuntimeError(f'NL28 segmented merge generated {len(merged)} pages, not seven')
                    merged.save(str(pdf),garbage=3,deflate=True)
                    merged.close()
                    for single in pdf_parts:single.close()
                    return html,levels,history
                for single in pdf_parts:single.close()
                history.append({'attempt':attempt+1,'spilling_matchups':spilling})
                if attempt == 2:
                    raise RuntimeError(f'NL28 cannot fit matchups without font reduction below gate: {spilling}')
                for index in spilling:
                    levels[index] = levels.get(index,0)+1
            raise RuntimeError('Unreachable segmented PDF loop')


        def nl28_selftest():
            from tempfile import TemporaryDirectory
            import fitz
            smoke = []
            for n in range(1,7):
                smoke.append({'name_a':f'Smoke {n} Alpha','name_b':f'Smoke {n} Beta',
                              'stats':[('FORM','220.12 / 188.03'),('RECORD','6-5 / 5-6')],
                              'player_note':None,'structure':['contrast','numbers','stakes'][n%3],
                              'lead':f'Team {n} has averaged 220.12 against its opponent\'s 188.03 recent points.',
                              'why':f'This is fact-checked storyline {n}, distinct from the other games.',
                              'takeaway':f'Story {n} has a different final sentence.',
                              'source':'Synthetic local test only','angle':f'angle {n}',
                              'headline':f'Unique NL28 Smoke Headline {n}'})
            logo='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO4BKuIAAAAASUVORK5CYII='
            with TemporaryDirectory() as d:
                path=Path(d)/'nl28-smoke.pdf'
                html,levels,log=nl28_segmented_render('War Room','2026 · Week 9 · test',smoke,logo,'test','war',Path(d),path)
                with fitz.open(str(path)) as doc:
                    assert len(doc)==7, 'NL28 lost a page'
                    for n in range(1,7):
                        t=doc[n].get_text(sort=True)
                        # A narrow PDF line break is not a missing headline. Compare
                        # normalized Unicode alphanumerics just like verify_pdf().
                        assert _packed(f'Unique NL28 Smoke Headline {n}') in _packed(t), f'NL28 lost story {n}'
                        assert _packed('Synthetic local test only') in _packed(t), f'NL28 lost source {n}'
                        for j in range(1,7):
                            if j != n:
                                assert _packed(f'Unique NL28 Smoke Headline {j}') not in _packed(t), f'NL28 mixed in story {j}'
                assert html.count('<section class="game-page">')==6
            print('PASS NL28: six isolated matchup pages, complete cover, no spill or lost source')


        def selftest():
