            sentence: different angles produced the same masked closer for #2 and #4.
            No hard gate is relaxed; this makes the written evidence genuinely varied.
            """
            if kind=='after':
                variants=[
                  f' The full {team} scoring swing was {delta} points; good luck trying to dress that up as a normal Tuesday.',
                  f' Call it a win or a loss, but the {delta}-point form change for {team} is a box-score receipt nobody can shred.',
                  f' Nobody on {team} gets to pin the entire {delta}-point team change on one unfortunate starter.',
                  f' A {delta}-point move in {team}’s total belongs to the whole lineup. The scoreboard is not accepting scapegoats.',
                  f' Explain away the entire {team} lineup moving {delta} points if you like; the numbers already made their statement.',
                  f' For {team}, the audited difference was {delta} points. That is a team-level performance, not a one-man circus.',
                ]
            elif kind=='war':
                variants=[
                  f' Last week {team} shifted {delta} points against earlier form; the next opponent gets to read that receipt.',
                  f' A {delta}-point team-form move for {team} is on the record, even if the upcoming game writes a different ending.',
                  f' The previous {team} scoring swing measured {delta} points. Consider the pregame sales pitch officially challenged.',
                  f' Before anyone crowns {team}, remember its verified {delta}-point team-form change, not a fictional future result.',
                  f' That {delta}-point change belongs to the full {team} lineup; the next week has yet to cast its vote.',
                  f' In the completed scoring window, {team} moved {delta} points from its earlier pace. My opinion can wait for kickoff.',
                ]
