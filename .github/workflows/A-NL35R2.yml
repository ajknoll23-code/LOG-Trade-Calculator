                   'nl32_editorial_evidence':{}}
                return s,f
            left,lf=two_after(1,'Collapsing Team','Player One',190.0,9.64,155.45,180.20)
            right,rf=two_after(5,'Other Collapsing Team','Player Six',205.0,3.30,165.60,192.90)
            left['why']=nl32_p2(left,lf,'after',1)
            right['why']=nl32_p2(right,rf,'after',5)
            assert nl32_canon(left['why'],left)!=nl32_canon(right['why'],right), 'six-slot rotation regression'
            # Also simulate a collision despite the six-slot layout; it must be
            # repaired without making the original gate lenient.
            right['why']=left['why'].replace('Collapsing Team','Other Collapsing Team').replace('Player One','Player Six')
            assert nl32_canon(left['why'],left)==nl32_canon(right['why'],right)
            repaired=nl32r3_distinct_p2([left,right],[lf,rf],'after')
            assert len(repaired)==1 and repaired[0][1]==2
            assert nl32_canon(left['why'],left)!=nl32_canon(right['why'],right)
            for s,f in ((left,lf),(right,rf)):
                assert len(s['why'].split())<=81
                assert nl31_numeric_literals(s['why'])-nl31_numeric_literals(s['lead'])
                assert any(s['nl30_facts'][0]['name'] in sent and
                           f'{s["nl30_facts"][0]["points"]:.2f}' in sent and
                           (s['nl30_facts'][0]['team'] in sent or any(k in sent for k in (f'{f["score_a"]:.2f}',f'{f["score_b"]:.2f}',f'{f["median"]:.2f}',f'{f["margin"]:.2f}')))
                           for sent in nl30_sentences_preserving_player(s['lead']+' '+s['why'],s['nl30_facts'][0]['name']))
            print('PASS NL35R2: exact live Aftermath 2/6 rotated P2 failure prevented; collision repaired using real values')
            print('PASS NL35R2: actual live Tyler Huntley fact and team consequence share a sentence across every Autopsy variant')
            print('PASS NL35R2: real W8 starter membership required, W6-only Athan excluded; legacy control unchanged')


        _NL32_LEGACY_SELFTEST = selftest

        def selftest():
            _NL32_LEGACY_SELFTEST()
            nl32_selftest()


        # NL35R2: decisive editorial pass, strictly on the already verified source rows.
        # Only challenger prose/selection changes; NL29 baseline executes first and is immutable.
        _NL33_PREVIOUS_SELECTOR = nl30_select
        _NL33_PREVIOUS_APPLY = nl32_apply_editorial
        _NL33_PREVIOUS_GATE = nl32_gate
        _NL33_PREVIOUS_CROSS_GATE = nl32_cross_edition_gate


        def nl33_explanatory_rank(p, structure):
            """Evidence-first relevance: documented trend, actual weekly contribution, position."""
            pos=p['position']; skill=pos in ('QB','RB','WR','TE')
            delta=p.get('player_swing'); last=p.get('latest_points')
            if last is None:last=p['points']
            share=p['share_pct']
            if structure=='Autopsy':
                if skill and delta is not None and delta<=-12: tier=8
                elif skill and delta is not None and delta<=-8: tier=7
                elif skill and last<=0: tier=6
                elif skill and share<5: tier=5
                elif skill and delta is not None and delta<=-4: tier=4
                elif skill: tier=3
                elif delta is not None and delta<=-15: tier=2
                else: tier=1
                return (tier, abs(min(0,delta or 0)), int(pos=='QB'), -last)
            if structure=='Turning Point':
                return (int(skill),abs(delta or 0),p['share_pct'],int(pos=='QB'))
            return (int(skill),int(p['share_pct']>=8),p['share_pct'],int(pos=='QB'))


        def nl30_select(f,story,kind,profiles,plan,prior,disallow_raw_highest,required_team=None,additional=False):
            """The best eligible contributor may appear in both AFTER and WAR; relevance wins.

            Historical anecdotes about bench players remain forbidden by nl29_candidates.
            Preserve both-side Heavyweight selections, including material IDP performers.
            """
            safe_prior=set() if (_NL32_CHALLENGER_ONLY and kind=='war') else prior
            chosen,decision=_NL33_PREVIOUS_SELECTOR(f,story,kind,profiles,plan,safe_prior,
                disallow_raw_highest,required_team=required_team,additional=additional)
            if not _NL32_CHALLENGER_ONLY or chosen is None:return chosen,decision
            structure=story['nl30_planned_structure']
            if additional or (structure=='Heavyweight' and chosen['share_pct']>=8):
                decision={**decision,'nl33_explanatory_audit':'verified material two-sided evidence retained'}
                return chosen,decision
            if structure not in ('Autopsy','Ruthless Sports Radio'):
                decision={**decision,'nl33_explanatory_audit':'original evidence-earnt structure preserved'}
                return chosen,decision
            pool=nl29_candidates(f,story,kind,profiles)
            team=required_team or plan.get('focus') or chosen['team']
            maxraw=max(p['points'] for p in pool)
            alternatives=[p for p in pool if p['team']==team and
                (p['roster_id'],p['player_id']) not in safe_prior and
                (not disallow_raw_highest or p['points']<maxraw-.005)]
            if not alternatives:return chosen,decision
            alternatives.sort(key=lambda p:nl33_explanatory_rank(p,structure),reverse=True)
            best=alternatives[0]
            original_rank=nl33_explanatory_rank(chosen,structure)
            best_rank=nl33_explanatory_rank(best,structure)
            # A very small rank fluctuation cannot justify gratuitous cast rotation.
            if best_rank<=original_rank or (best['player_id']==chosen['player_id'] and
                                            best['roster_id']==chosen['roster_id']):
                decision={**decision,'nl33_explanatory_audit':'highest explanatory option already selected',
                          'nl33_candidate_rank':list(original_rank)}
                return chosen,decision
            # A high-share IDP is allowed to beat a weak skill contribution when the
            # defensive performance really is the central verified evidence.
            if chosen['position'] not in ('QB','RB','WR','TE','K','PK','P') and chosen['share_pct']>=15:
                decision={**decision,'nl33_explanatory_audit':'material IDP contributor retained at >=15% share'}
                return chosen,decision
            reason=('Most explanatory *verified completed-week starter*: documented individual trend '
                    'outranks isolated low totals; position relevance breaks ties. '
                    'Player score is a limited contribution, never the sole cause.')
            higher=[{'name':p['name'],'player_id':p['player_id'],'points':p['points'],
                     'reason_not_chosen':'smaller contextual signal for the primary storyline'}
                     for p in sorted(pool,key=lambda x:-x['points']) if p['points']>best['points']+.005]
            return best,{**decision,'selection_reason':reason,
                'nl33_explanatory_audit':f'{chosen["name"]} replaced by {best["name"]}: stronger verified trend',
                'nl33_candidate_rank':list(best_rank),
                'higher_raw_scorers_not_selected':higher[:10],
                'featured_raw_highest':best['points']>=maxraw-.005,
                'source_week_span':best['week_span']}


        def nl33_verified_p2(s,f,kind,idx):
            """Six editorially distinct evidence-led arguments per edition.

            Numeric comparisons are already source-backed by war_facts/after_facts and
            nl29 current-week starter intersection. No speculation about the new week.
            """
            p=s['nl30_facts'][0];name=p['name'];team=p['team'];pos=p['position']
            pts=p['points']; prior=p.get('prior_player_mean'); delta=p.get('player_swing')
            g=f['game'];a,b=g['name_a'],g['name_b'];other=b if team==a else a
            if kind=='after':
                total=f['score_a'] if team==a else f['score_b']; other_total=f['score_b'] if team==a else f['score_a']
                margin=f['margin']; med=f['median'];dev=f['dev_a'] if team==a else f['dev_b']
                if len(s['nl30_facts'])==2:
                    q=s['nl30_facts'][1]
                    return (f'Put {team}’s {total:.2f} beside {other}’s {other_total:.2f}: '
                      f'{name} contributed {pts:.2f} for {team}, while {q["name"]} returned '
                      f'{q["points"]:.2f} for {q["team"]} in the {margin:.2f}-point matchup. '
                      'Neither is a substitute for the two complete starting lineups.')
                if idx==0:
                    return (f'{name} supplied {pts:.2f} at {pos}—{p["share_pct"]:.1f}% of '
                      f'{team}’s {total:.2f}. The league median stood at {med:.2f}; '
                      f'{other} still posted {other_total:.2f}. The unusual part of this loss is the opponent, not a missing individual score.')
                if idx==1 and prior is not None and delta is not None:
                    return (f'{name} entered Week {f["week"]} with a {prior:.2f} earlier-start average '
                      f'but delivered {pts:.2f} for {team} in its {total:.2f} team finish. '
                      f'That {delta:+.2f} individual change sits inside a {abs(dev):.2f}-point '
                      'team form shift; the final score still belongs to the complete lineup.')
                if idx==2 and prior is not None and delta is not None:
                    return (f'After a {prior:.2f} prior-start average, {name} produced {pts:.2f} '
                      f'for {team} in a {total:.2f} finish ({delta:+.2f} individually). '
                      f'{team} also moved {dev:+.2f} from its earlier pace; that team change '
                      f'left a {margin:.2f}-point final gap to {other}.')
                if idx==3 and prior is not None and delta is not None:
                    return (f'The {pts:.2f} from {name} at {pos} came after {prior:.2f} '
                      f'in earlier starts ({delta:+.2f}); {team} finished at {total:.2f}, '
                      f'{abs(dev):.2f} {"below" if dev<0 else "above"} its own previous pace. '
                      'This points toward the slump without pretending to itemize every missing point.')
                if idx==4:
                    return (f'The completed result had {team} putting up {total:.2f} '
                      f'against {other} at {other_total:.2f}. {name} logged {pts:.2f} at {pos} '
                      f'within that {total:.2f}-point roster, and the {margin:.2f} margin '
                      'is not something one roster spot can explain alone.')
                if idx==5 and prior is not None and delta is not None:
                    return (f'On the {total:.2f}-point side of a {margin:.2f}-point game, '
                      f'{name} posted {pts:.2f} for {team}, versus a previous {prior:.2f} '
                      f'average ({delta:+.2f}). {other} scored {other_total:.2f}; '
                      'the gulf is real even after isolating that one striking starter change.')
                return (f'{name} contributed {pts:.2f} for {team} in a {total:.2f}-point finish. '
                      f'{other} had {other_total:.2f}, the median was {med:.2f}, and the final '
                      f'margin reached {margin:.2f}; the whole roster generated that result.')
            # War Room: cumulative verified starts plus latest completed week; never
            # infer that a player will be started or score a given number next week.
            avg=f['ave_a'] if team==a else f['ave_b'];opp_avg=f['ave_b'] if team==a else f['ave_a']
            gap=f['gap']; latest=f['latest_a'] if team==a else f['latest_b']
            recent=p.get('latest_points');cnt=p['starts_count'];anchor=p['nl32_anchor_week']
            if len(s['nl30_facts'])==2:
                q=s['nl30_facts'][1]
                return (f'The top-table conversation has two actual starter lines: '
                  f'{name} supplied {pts:.2f} over {cnt} verified starts for {team} '
                  f'(recent team average {avg:.2f}); {q["name"]} added '
                  f'{q["points"]:.2f} for {q["team"]} in its {opp_avg:.2f}-average side. '
                  f'The observed difference is {gap:.2f} per week, not a Week {anchor+1} score.')
            if idx==0:
                return (f'For {team}, {name} contributed {pts:.2f} across {cnt} verified '
                  f'starts inside a {avg:.2f}-point recent team average. {other} averaged '
                  f'{opp_avg:.2f}; their {gap:.2f}-point separation is far thinner than '
                  'the observed team-average comparison; the records remain a separate matter.')
            if idx==1:
                detail=(f', including {recent:.2f} in completed Week {anchor}' if recent is not None else '')
                trend=(f' against {prior:.2f} in earlier starts' if prior is not None else '')
                return (f'The recent form table puts {team} in a {gap:.2f}-point gap, '
                  f'after its last total of {latest:.2f}. {name} logged {pts:.2f} across '
                  f'{cnt} actual {"start" if cnt==1 else "starts"}{detail}{trend} for a team averaging '
                  f'{avg:.2f}; one player cannot settle next week’s result.')
            if idx==2:
                trend=(f' from a prior {prior:.2f} average' if prior is not None else '')
                last=(f'{recent:.2f}' if recent is not None else f'{pts:.2f}')
                return (f'The most recent checkpoint: {team} managed {latest:.2f}. '
                  f'{name} registered {pts:.2f} over {cnt} verified starts, including '
                  f'{last} in Week {anchor}{trend}; the same team averaged {avg:.2f} '
                  f'over the recent window against {opp_avg:.2f} for {other}.')
            if idx==4:
                ra=max(g['scores_a'][-3:])-min(g['scores_a'][-3:])
                rb=max(g['scores_b'][-3:])-min(g['scores_b'][-3:])
                return (f'The ranges are {ra:.2f} for {a} and {rb:.2f} for {b} '
                  f'over the past three completed games. {name} supplied {pts:.2f} '
                  f'across {cnt} confirmed starts for {team}, whose recent average was '
                  f'{avg:.2f}; volatility here is recorded at the whole-team level.')
            if idx==5:
                trend=(f' after a {prior:.2f} previous-start average' if prior is not None else '')
                last=(f'{recent:.2f}' if recent is not None else f'{pts:.2f}')
                return (f'The latest scoring ledger lists {other} at {opp_avg:.2f} against '
                  f'{avg:.2f} for {team}. {name} totaled {pts:.2f} in {cnt} verified '
                  f'{"start" if cnt==1 else "starts"} for {team}, with {last} in completed Week {anchor}{trend}; '
                  f'the resulting team-average gap is {gap:.2f}.')
            return (f'{name} contributed {pts:.2f} across {cnt} verified starts for '
              f'{team}, part of a {avg:.2f}-point team average; {other} averaged '
              f'{opp_avg:.2f}. The {gap:.2f}-point gap reports what happened, '
              f'not which side will score more in Week {anchor+1}.')


        def nl33_closer(s,f,kind,idx):
            """A different editorial payoff for each matchup; scores are never invented."""
            a=s['name_a'];b=s['name_b'];g=f['game']
            if kind=='after':
                sa=f['score_a'];sb=f['score_b'];hi=max(sa,sb);lo=min(sa,sb)
                winner=a if sa>=sb else b; loser=b if winner==a else a
                med=f['median'];margin=f['margin'];p=s['nl30_facts'][0];team=p['team'];total=sa if team==a else sb
                plan=s['nl30_plan'];claim=plan.get('drop') or plan.get('provisional_drop')
                if s['nl30_structure']=='Autopsy' and claim is not None:
                    if 'provisional_drop' in plan:
                        return (f'The provisional table moved {team} down {int(claim)} spots. '
                           f'Its {total:.2f} was measured against {med:.2f} at the median—'
                           'not the kind of week a standings position can disguise.')
                    endings=(
                        f'{team} took a {float(claim):.2f}-point step back from its previous pace; the final {margin:.2f}-point loss did not need a second explanation.',
                        f'The {float(claim):.2f}-point form decline is the full lineup’s problem. One poor starter total makes a vivid receipt, not the invoice.',
                        f'An honest autopsy starts with the {float(claim):.2f}-point team slide, then considers the {hi:.2f}–{lo:.2f} final. The numbers are related, not identical.',
                        f'Last week’s {total:.2f} is {float(claim):.2f} off the old team pace. The individual stat is evidence, not a verdict.',
                        f'{team} has {float(claim):.2f} fewer points than its previous benchmark and a finished {margin:.2f}-point result to absorb.',
                        f'Put {float(claim):.2f} under “lost team form.” Put {margin:.2f} under “actual game margin.” Different columns, same tough week.')
                    return endings[idx]
                if idx==0:
                    if lo>med:
                        return (f'{loser} cleared a {med:.2f} median and still saw '
                          f'{winner} reach {hi:.2f}. That is less a scoring failure than a disastrous appointment.')
                    return (f'{winner} reached {hi:.2f} while {loser} stopped at {lo:.2f}. '
                        f'The {med:.2f} median supplies a second verdict on those same finished scores.')
                if idx==2:
                    dev=f['dev_a'] if team==a else f['dev_b']
                    movement='an improvement' if dev>0 else 'a retreat'
                    return (f'A {dev:+.2f} change in {team}’s form records {movement}; '
                         f'{winner} still banked the {margin:.2f}-point winning margin. '
                         'That before-and-after comparison is not the head-to-head score.')
                if idx==5:
                    return (f'{hi:.2f} against {lo:.2f} produced a {margin:.2f}-point canyon. '
                        f'{winner} built one side of it; {loser} built the other.')
                options=(
                 f'Head-to-head belonged to {winner} at {hi:.2f}; the median line remained at {med:.2f}. Two different tests, both scored.',
                 f'The team at {lo:.2f} lost to {hi:.2f}. The final margin of {margin:.2f} covers every starter on both sides.',
                 f'{winner} collected a {margin:.2f}-point victory. Individual swings belong in the explanation, not in place of the outcome.',
                 f'From {lo:.2f} to {hi:.2f}: the scoreboard wrote the full {margin:.2f}-point difference, whatever any single player did.',
                 f'The median stood at {med:.2f}, {winner} scored {hi:.2f}, and {loser} answered with {lo:.2f}. There is no extra column for excuses.',
                 f'One matchup finished {hi:.2f}–{lo:.2f}. The {margin:.2f}-point result has a full roster attached to each side.' )
                return options[idx]
            # Every preview closer speaks only about completed results.
            gap=f['gap'];avga=f['ave_a'];avgb=f['ave_b']
            front=a if avga>=avgb else b;back=b if front==a else a
            plan=s['nl30_plan'];drop=plan.get('drop');focus=plan.get('focus') or s['nl30_facts'][0]['team']
            if s['nl30_structure']=='Autopsy' and drop is not None:
                texts=(
                 f'From the old pace to the last result, {focus} dropped {float(drop):.2f}. That is the assignment—without inventing an upcoming score.',
                 f'The {float(drop):.2f}-point slide is already in {focus}’s books. The {gap:.2f}-point gap to {front} is a separate opponent problem.',
                 f'{focus} has a {float(drop):.2f}-point form bill to explain. Its last score exists; the next one does not.',
                 f'The two ledgers say {float(drop):.2f} below prior form for {focus} and {gap:.2f} apart in recent team averages. Both are history.',
                 f'Call it volatility if you like; {focus} still fell {float(drop):.2f} from its previous team pace. No single starter owns the entire chart.',
                 f'The {float(drop):.2f}-point change is real for {focus}; the upcoming matchup is not yet a score in the ledger.')
                return texts[idx]
            options=(
              f'The records disagree with the tiny {gap:.2f}-point recent average gap. This is a matchup with an argument, not a finished score.',
              f'Across the last three completed weeks, {front} averaged {max(avga,avgb):.2f} to {back}’s {min(avga,avgb):.2f}. The {gap:.2f}-point edge is the evidence.',
              f'Last-week numbers are history. The {gap:.2f}-point gap between {a} and {b} is a preview detail, not a Week {s["nl30_facts"][0]["nl32_anchor_week"]+1} result.',
              f'Nos. {g["rank_a"]} and {g["rank_b"]} are separated by {gap:.2f} recent points a week. Standings create stakes; neither has won the next game.',
              f'{a} swung by {max(g["scores_a"][-3:])-min(g["scores_a"][-3:]):.2f} and {b} by {max(g["scores_b"][-3:])-min(g["scores_b"][-3:]):.2f}. A scorecard this volatile makes predictions cheap and evidence valuable.',
              f'{front} holds the {gap:.2f}-point form advantage; {back} is still permitted to show up and play the game. No trophy has been awarded for recent averages.')
            return options[idx]


        def nl33_copy_fingerprint(text,story):
            """Mask names, points, roster positions; compare both full shapes and openings."""
            return nl32_canon(text,story)


        def nl33_apply_copy(war,after,warfacts,aftfacts,profiles):
            decisions=_NL33_PREVIOUS_APPLY(war,after,warfacts,aftfacts,profiles)
            for kind,stories,facts in (('after',after,aftfacts),('war',war,warfacts)):
                for ix,(s,f) in enumerate(zip(stories,facts)):
                    old_p2=s['why'];old_close=s['takeaway']
                    s['why']=nl33_verified_p2(s,f,kind,ix)
                    s['takeaway']=nl33_closer(s,f,kind,ix)
                    s['punchline']=s['takeaway']
                    s['nl33_editorial_evidence']={
                        'completed_week':profiles['post_week'],
                        'first_starter_source':s['nl30_facts'][0]['nl32_current_week_source'],
                        'better_explanatory_choice':s['nl30_decisions'][0].get('nl33_explanatory_audit','inherited audited selection'),
                        'primary_storyline':s['primary_storyline'],
                        'paragraph_two_adds':sorted(nl31_numeric_literals(s['why'])-nl31_numeric_literals(s['lead'])),
                        'paragraph_2_shape':nl33_copy_fingerprint(s['why'],s),
                        'closing_shape':nl33_copy_fingerprint(s['takeaway'],s),
                        'changes':{'paragraph_two':old_p2!=s['why'],'closer':old_close!=s['takeaway']},
                        'same_source_NL29_control_untouched':True,
                        'human_review_pending':True,
                    }
                    s['keys']=list(dict.fromkeys(s['keys']+['nl33_story_specific_coda','nl33_verified_starter_hierarchy']))
                nl32r3_distinct_p2(stories,facts,kind)
                # Ledgers must reflect exactly the final, rendered paragraphs after any
                # collision repair; no stale NL31/NL32 proof strings.
                for story in stories:
                    fresh=sorted(nl31_numeric_literals(story['why'])-nl31_numeric_literals(story['lead']))
                    story['nl33_editorial_evidence']['paragraph_two_adds']=fresh
                    story['nl33_editorial_evidence']['paragraph_2_shape']=nl33_copy_fingerprint(story['why'],story)
                    story['nl33_editorial_evidence']['closing_shape']=nl33_copy_fingerprint(story['takeaway'],story)
                    story['nl32_editorial_evidence']['paragraph2_canonical_pattern']=nl32_canon(story['why'],story)
                    story['nl32_editorial_evidence']['closer_canonical_pattern']=nl32_canon(story['takeaway'],story)
                    story['nl31_editorial_evidence']['paragraph_2_extra_numbers']=fresh
            return decisions


        def nl32_apply_editorial(war,after,warfacts,aftfacts,profiles):
            return nl33_apply_copy(war,after,warfacts,aftfacts,profiles)


        def nl32_gate(stories,facts,kind):
            result=_NL33_PREVIOUS_GATE(stories,facts,kind)
            ps=[];cs=[];pp=[];cp=[]
            for idx,s in enumerate(stories,1):
                p2=nl33_copy_fingerprint(s['why'],s);close=nl33_copy_fingerprint(s['takeaway'],s)
                ps.append(p2);cs.append(close)
                pp.append(tuple(p2.split()[:10]));cp.append(tuple(close.split()[:10]))
                if len(s['nl30_facts'])==2 and not all(p['name'] in s['why'] for p in s['nl30_facts']):
                    raise RuntimeError(f'NL33 {kind} {idx} two-sided verified production lost in second paragraph')
                if any(x in (s['why']+' '+s['takeaway']).casefold() for x in (
                    'those are related observations, not a one-player verdict',
                    'accounted for y% alongside',
                    'the starter log has a name',
                    'the starter report is worse')):
                    raise RuntimeError(f'NL33 {kind} {idx} copied a banned stock structure')
                evidence=s.get('nl33_editorial_evidence')
                if not evidence or not evidence['paragraph_two_adds']:
                    raise RuntimeError(f'NL33 {kind} {idx} missing source-linked new paragraph-two evidence')
            if any(len(set(xs))!=len(xs) for xs in (ps,cs,pp,cp)):
                raise RuntimeError(f'NL33 {kind} has a duplicated P2 or closer skeleton after masking facts')
            result['nl33_distinct_p2_and_closers']=6
            result['nl33_binary_review_not_85_gate']=True
            return result


        def nl32_cross_edition_gate(war,after):
            _NL33_PREVIOUS_CROSS_GATE(war,after)
            for attr in ('why','takeaway'):
                past={tuple(nl33_copy_fingerprint(s[attr],s).split()[:10]) for s in after}
                for idx,s in enumerate(war,1):
                    key=tuple(nl33_copy_fingerprint(s[attr],s).split()[:10])
                    if key in past:
                        raise RuntimeError(f'NL33 copied Aftermath {attr} opening into War Room matchup {idx}')
            return True


        def nl33_selftest():
            # Actual previous NL32 issue: the systematic W8-verified contributor is
            # allowed to repeat across Aftermath/WarRoom if it is the best explanation.
            g={'name_a':'Just Run Power','name_b':'Toddy2times',
               'scores_a':[180.0,176.0,141.34], 'scores_b':[230.0,232.0,237.3],
