        def nl30_select(f,story,kind,profiles,plan,prior,disallow_raw_highest,required_team=None,additional=False):
            chosen,decision=_NL32_PREVIOUS_SELECT(f,story,kind,profiles,plan,prior,
                                disallow_raw_highest,required_team=required_team,additional=additional)
            if not _NL32_CHALLENGER_ONLY or chosen is None:
                return chosen,decision
            if chosen['position'] in _NL32_OFFENSE:
                return chosen,decision
            structure=story['nl30_planned_structure']
            if structure in ('Autopsy','Demolition'):
                # The inherited contextual swing/share selector already checks these.
                return chosen,decision
            if structure=='Heavyweight' and chosen['share_pct']>=8:
                # A material linebacker contribution in an IDP contender game is valid.
                return chosen,decision
            if chosen['position'] not in ('K','P','PK') and chosen['share_pct']>=8:
                # Explain material IDP contribution rather than pretending it does not exist.
                return chosen,decision
            raw=nl29_candidates(f,story,kind,profiles)
            team=required_team or chosen['team']
            alternatives=[]
            for p in raw:
                if p['team']!=team or p['position'] not in _NL32_OFFENSE:continue
                if (p['roster_id'],p['player_id']) in prior:continue
                if disallow_raw_highest and p['points']>=max(q['points'] for q in raw)-0.005:continue
                sw=p.get('player_swing')
                if structure=='Turning Point' and (sw is None or sw*plan.get('direction',1)<7):continue
                if structure=='Fraud Alert' and not p.get('is_recent_window'):continue
                # A verified skill-position contribution with material team share,
                # or a documented W8 swing, is preferable to a peripheral contribution.
                if p['share_pct']<5 and (sw is None or abs(sw)<8):continue
                explanatory=(abs(sw) if sw is not None and (structure=='Turning Point' or sw<0) else 0)
                alternatives.append(((int(p['share_pct']>=8), explanatory,
                                      p['share_pct'],_NL32_OFFENSE[p['position']]),p))
            if not alternatives:return chosen,decision
            alternatives.sort(key=lambda x:x[0],reverse=True)
            p=alternatives[0][1]
            if p['player_id']==chosen['player_id']:return chosen,decision
            reason=('current-week confirmed offensive starter, material verified share or '
                    'documented swing; selected ahead of a peripheral specialist with '
                    'lower explanatory value; no sole-cause claim')
            higher=[{'name':q['name'],'player_id':q['player_id'],'points':q['points'],
                     'reason_not_chosen':reason}
                    for q in sorted(raw,key=lambda q:-q['points']) if q['points']>p['points']+.005]
            revised={**decision,'selection_reason':reason,
                  'higher_raw_scorers_not_selected':higher[:10],
                  'featured_raw_highest':p['points']>=max(q['points'] for q in raw)-.005,
                  'nl32_replaced_low_explanatory_specialist':chosen['name'],
                  'source_week_span':p['week_span']}
            return p,revised


