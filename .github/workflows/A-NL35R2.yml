        # NL35R2: factual editorial angles replace numbered paraphrase rotation.
        # Base NL29 control remains frozen; all selection and prose changes are challenger-only.
        _NL34_BEFORE_SELECT = nl30_select
        _NL34_BEFORE_APPLY = nl32_apply_editorial
        _NL34_BEFORE_GATE = nl32_gate
        _NL34_BEFORE_CROSS_GATE = nl32_cross_edition_gate

        _NL34_SKILL = {'QB':4,'RB':3,'WR':3,'TE':2}

        def nl34_relevance(p,structure,kind,focus,plan,angle=None):
            """Absolute relevance across genuinely eligible source-verified starters.
            Only comparisons within one evidenced storyline are meaningful; do not
            equate a kicker's extreme with a complete 50-point team scoring drop.
            """
            skill=_NL34_SKILL.get(p['position'],0)
            recent=p.get('latest_points')
            if recent is None:recent=p['points']
            swing=p.get('player_swing')
            decline=max(0,-swing) if swing is not None else 0
            gain=max(0,swing) if swing is not None else 0
            if structure=='Autopsy':
                return (int(bool(skill)),int(decline>=8),int(decline>=4),
                        round(decline,3),int(recent<=0),skill,-recent)
            if angle in ('large-weekly-margin','recent reversal','underdog path','leader under challenge','consistency versus volatility'):
                return (int(bool(skill)),int(decline>=8),round(decline,3),int(recent<=0),-recent,skill)
            if structure=='Turning Point':
                direction=plan.get('direction',1)
                aligned=(swing or 0)*direction
                return (int(bool(skill)),int(aligned>=7),round(aligned,3),skill,p['share_pct'])
            if structure=='Heavyweight':
                return (int(p['share_pct']>=15),int(bool(skill)),p['share_pct'],skill,p['points'])
            if structure=='Demolition':
                return (int(bool(skill)),int(p['share_pct']>=8),p['share_pct'],skill,p['points'])
            if structure in ('Heist','Fraud Alert'):
                return (int(bool(skill)),int(p['share_pct']>=8),p['share_pct'],skill,p['points'])
            return (int(bool(skill)),int(p['share_pct']>=8),p['share_pct'],skill,
                    round(abs(swing or 0),3))


        def nl30_select(f,story,kind,profiles,plan,prior,disallow_raw_highest,required_team=None,additional=False):
            chosen,decision=_NL34_BEFORE_SELECT(f,story,kind,profiles,plan,prior,
                disallow_raw_highest,required_team=required_team,additional=additional)
            if not _NL32_CHALLENGER_ONLY or chosen is None:return chosen,decision
            structure=story['nl30_planned_structure']
            team=required_team or plan.get('focus') or chosen['team']
            if structure=='Demolition':team=plan['winner']
            if structure=='Heist':team=plan['focus']
            if structure=='Fraud Alert':team=plan['form_leader']
            if structure=='Turning Point':team=plan['focus']
            # Both-sides contender player selection can legitimately include a
            # material IDP (the Okereke/Hubbard comparison); additional is audited too.
            options=nl29_candidates(f,story,kind,profiles)
            high=max(x['points'] for x in options)
            eligible=[]
            for p in options:
                if p['team']!=team:continue
                if (p['roster_id'],p['player_id']) in prior:continue
                if disallow_raw_highest and p['points']>=high-.005:continue
                if additional and (p['roster_id'],p['player_id']) in story.get('_selected_keys',set()):continue
                swing=p.get('player_swing')
                if structure=='Turning Point' and (swing is None or swing*plan.get('direction',1)<7):continue
                if structure=='Demolition' and p['share_pct']<8:continue
                if structure=='Heavyweight' and p['share_pct']<8:continue
                if structure=='Fraud Alert' and not p.get('is_recent_window',True):continue
                eligible.append(p)
            if not eligible:
                # Inherited selector was able to pick an eligible fact under its own
                # exact structural constraints, so preserve it and audit that boundary.
                eligible=[chosen]
            # Autopsy: low-scoring kicker/IDP may only be used if no verified offense
            # remains; otherwise offense outranks raw arithmetic magnitude.
            ranked=sorted(eligible,key=lambda p:(nl34_relevance(p,structure,kind,team,plan,story.get('angle')),
                str(p['player_id'])),reverse=True)
            best=ranked[0]
            # Meaningful heavyweight defensive share is a legitimate two-sided input.
            # Compare all eligible facts objectively and record why a choice survived.
            if structure=='Heavyweight' and chosen['share_pct']>=15 and chosen['position'] not in ('K','P','PK'):
                best=chosen
            score=nl34_relevance(best,structure,kind,team,plan,story.get('angle'))
            decision={**decision,
               'selection_reason':'Highest explanatory verified participant for this storyline, subject to structural and highest-scorer exclusions; not causal attribution',
               'nl34_audit':{'structural_lens':structure,'focus_team':team,
                    'candidate_count':len(eligible),'chosen_rank':list(score),
                    'ranked_names':[p['name'] for p in ranked[:7]],
                    'highest_eligible_player_id':str(best['player_id']),
                    'chosen_player_id':str(best['player_id']),
                    'skill_preferred':best['position'] in _NL34_SKILL,
                    'limited_explanation':best['position'] not in _NL34_SKILL,
                    'source_anchor_week':int(profiles['post_week'])},
               'featured_raw_highest':best['points']>=high-.005,
               'source_week_span':best['week_span']}
            return best,decision


        def nl34_second(s,f,kind,index):
            """Angle-specific contrasts, never prose chosen merely from article index.
            Exact numerical values originate only in source-verified player and game rows.
            The first complete sentence must tie the player figure to a team consequence.
            """
            angle=s['angle'];p=s['nl30_facts'][0];q=s['nl30_facts'][1] if len(s['nl30_facts'])>1 else None
            a=s['name_a'];b=s['name_b'];name=p['name'];team=p['team'];opp=b if team==a else a
            pts=p['points'];pos=p['position'];sw=p.get('player_swing');prior=p.get('prior_player_mean')
            if kind=='after':
                total=f['score_a'] if team==a else f['score_b'];other=f['score_b'] if team==a else f['score_a']
                dev=f['dev_a'] if team==a else f['dev_b'];med=f['median'];margin=f['margin']
                anchor=f['week'];share=p['share_pct']
                history=(f'prior-start average of {prior:.2f}' if prior is not None else f'{share:.1f}% of the team total')
                movement=(f'{sw:+.2f} change' if sw is not None else f'{pts:.2f}-point contribution')
                if angle=='strong score in defeat':
                    return (f'{name} earned {pts:.2f} at {pos} within {team}’s {total:.2f} points, '
                      f'good for {share:.1f}% of its starters’ score; {opp} still produced {other:.2f}. '
                      f'Against a {med:.2f} league median, the opponent’s total is the part that deserves the double-take.')
                if angle=='win without median':
                    victor=a if f['score_a']>=f['score_b'] else b
                    return (f'{name} returned {pts:.2f} for {team}’s {total:.2f}-point lineup after a '
                      f'{history}. {victor} won the game {max(f["score_a"],f["score_b"]):.2f} '
                      f'to {min(f["score_a"],f["score_b"]):.2f}; the league median of '
                      f'{med:.2f} is a separate test from that head-to-head victory.')
                if angle=='pregame-baseline reversal':
                    victor=a if f['score_a']>=f['score_b'] else b
                    return (f'{name} logged {pts:.2f} at {pos} as {team} moved {dev:+.2f} '
                      f'from its earlier scoring pace; the starter’s own movement was {movement}. '
                      f'The full score was {max(f["score_a"],f["score_b"]):.2f} to '
                      f'{min(f["score_a"],f["score_b"]):.2f} for {victor}, a {margin:.2f}-point decision.')
                if angle=='form upset':
                    return (f'{name} gave {team} {pts:.2f} at {pos} during a {abs(dev):.2f}-point '
                      f'{"drop" if dev<0 else "increase"} in team form; the player had a {history}. '
                      f'{opp} scored {other:.2f} against {total:.2f}, so the individual swing ({movement}) '
                      'is an important detail, not a substitute for the result.')
                if angle=='standings shock':
                    return (f'{name} scored {pts:.2f} from {pos} in {team}’s {total:.2f}, '
                      f'while {opp} assembled {other:.2f}. The {margin:.2f}-point separation '
                      f'crossed a {med:.2f} league median; no single lineup slot accounts for a standings swing.')
                if angle=='large-weekly-margin':
                    return (f'{name} posted {pts:.2f} for {team} in a {total:.2f}-point finish, '
                      f'after a {history}; across the field, {opp} scored {other:.2f}. '
                      f'That {margin:.2f}-point gulf involves the entire starting roster, '
                      f'not simply the {movement} in one box-score row.')
                # Future unknown angles receive a verified fallback; duplicate gates
                # will fail if the edition cannot generate six distinct arguments.
                return nl33_verified_p2(s,f,kind,index)
            avg=f['ave_a'] if team==a else f['ave_b'];other_avg=f['ave_b'] if team==a else f['ave_a']
            latest=f['latest_a'] if team==a else f['latest_b'];other_latest=f['latest_b'] if team==a else f['latest_a']
            gap=f['gap'];cnt=p['starts_count'];recent=p.get('latest_points');anchor=p['nl32_anchor_week']
            window=f'{cnt} verified {"start" if cnt==1 else "starts"}'
            last_str=f'{recent:.2f} in completed Week {anchor}' if recent is not None else f'{pts:.2f} over the verified sample'
            if q is not None:
                return (f'{name} contributed {pts:.2f} across {window} on {team}’s '
                  f'{avg:.2f}-average side; {q["name"]} supplied {q["points"]:.2f} '
                  f'for {q["team"]} on the {other_avg:.2f}-average side. '
                  f'The actual {gap:.2f} recent separation is the rivalry’s evidence, not a future points total.')
            if angle=='record versus form':
                return (f'{name} supplied {pts:.2f} across {window} for {team}, '
                  f'whose recent average is {avg:.2f} against {other_avg:.2f} for {opp}. '
                  f'That {gap:.2f}-point form gap is much narrower than the difference in their combined records.')
            if angle=='underdog path':
                return (f'The underdog’s form has a named starter: {name} totaled {pts:.2f} across '
                  f'{window} for {team}, including {last_str} as the team last scored {latest:.2f}. '
                  f'Its {avg:.2f} three-week average trails {opp}’s {other_avg:.2f} by {gap:.2f}.')
            if angle=='recent reversal':
                return (f'{name} registered {pts:.2f} across {window} for {team}, '
                  f'with {last_str} alongside the club’s latest {latest:.2f}. '
                  f'{opp} last managed {other_latest:.2f}; the most recent totals sit '
                  f'{abs(latest-other_latest):.2f} apart, versus {gap:.2f} across their three-week averages.')
            if angle=='consistency versus volatility':
                ra=max(f['game']['scores_a'][-3:])-min(f['game']['scores_a'][-3:]);rb=max(f['game']['scores_b'][-3:])-min(f['game']['scores_b'][-3:])
                return (f'{name} recorded {pts:.2f} across {window} for {team}, '
                  f'which averaged {avg:.2f} during the same window. '
                  f'The larger uncertainty belongs to full teams: {a}’s three-score range is '
                  f'{ra:.2f}, {b}’s {rb:.2f}. Those are swings in completed outcomes, not volatility assigned to one player.')
            if angle=='leader under challenge':
                return (f'{name} banked {pts:.2f} across {window} for {team}, '
                  f'including {last_str} alongside {team}’s latest {latest:.2f}. '
                  f'{a} enters from rank {f["game"]["rank_a"]} with a {f["ave_a"]:.2f} recent average; '
                  f'{b} stands {f["game"]["rank_b"]} at {f["ave_b"]:.2f}, '
                  f'a {gap:.2f}-point history gap, not a settled Week {anchor+1} matchup.')
            return nl33_verified_p2(s,f,kind,index)


        def nl34_finish(s,f,kind,index):
            """One earned question or consequence per actual storyline, not six cliches."""
            angle=s['angle'];a=s['name_a'];b=s['name_b'];p=s['nl30_facts'][0];team=p['team']
            if kind=='after':
                sa=f['score_a'];sb=f['score_b'];hi=max(sa,sb);lo=min(sa,sb);gap=f['margin'];med=f['median']
                winner=a if sa>=sb else b;loser=b if winner==a else a
                if angle=='strong score in defeat':
                    return (f'{loser} cleared the {med:.2f} median and still lost. '
                        f'At {hi:.2f}, {winner} turned a very good scoring week into a very bad draw for someone else.') if lo>med else (
                        f'{winner} reached {hi:.2f}; {loser} stopped at {lo:.2f}. '
                        'The same individual contribution can coexist with an opponent-driven loss.')
                if angle=='win without median':
                    return (f'{winner} beat {loser} by {gap:.2f}, '
                        f'but its {hi:.2f} did not clear the {med:.2f} league median. '
                        'There are victories that still deserve a hard look at the standings.') if hi<med else (
                        f'The {gap:.2f}-point win belongs to {winner}. '
                        f'The {med:.2f} median gives this finish a second comparison beyond the final.')
                if angle=='pregame-baseline reversal':
                    focus=s['nl30_facts'][0]['team']
                    dev=f['dev_a'] if focus==a else f['dev_b']
                    movement='rose' if dev>0 else 'fell'
                    return (f'{focus} {movement} {abs(dev):.2f} against its old scoring pace; '
                        f'the finished {gap:.2f}-point margin belongs to {winner}. '
                        'Form and final score are two different verdicts.')
                if angle=='form upset':
                    dev=f['dev_a'] if team==a else f['dev_b']
                    return (f'The {abs(dev):.2f}-point form {"slide" if dev<0 else "change"} '
                        f'belongs on {team}’s chart. The {gap:.2f}-point final margin '
                        'belongs on the scoreboard. That distinction is the whole argument.')
                if angle=='standings shock':
                    places=s['nl30_plan'].get('provisional_drop')
                    if places is not None:
                        return (f'{team} fell {int(places)} places on the provisional table '
                            f'after a {lo:.2f}-point outing. The {med:.2f} median offers no sympathy.')
                    return (f'The table will reflect a {gap:.2f}-point decision. '
                        f'{team}’s {sa if team==a else sb:.2f} leaves nothing hypothetical to argue about.')
                if angle=='large-weekly-margin':
                    return (f'{winner} finished at {hi:.2f}, {loser} at {lo:.2f}. '
                        f'The {gap:.2f}-point distance is a whole-lineup result; '
                        'one dramatic starter number cannot carry that load.')
                return nl33_closer(s,f,kind,index)
            avga=f['ave_a'];avgb=f['ave_b'];gap=f['gap'];g=f['game'];front=a if avga>=avgb else b
            if angle=='record versus form':
                return (f'The last three scores leave {gap:.2f} between these clubs per week. '
                     'The win-loss columns make them strangers; that narrow scoring gap makes them neighbors.')
            if angle=='underdog path':
                return (f'{front} owns the {gap:.2f}-point recent edge. '
                     'An upset would have to be written next week, not inferred from an old box score.')
            if angle=='recent reversal':
                latest_gap=abs(f['latest_a']-f['latest_b'])
                interpretation=('two different ways to size up this meeting' if abs(latest_gap-gap)>=5
                                else 'two time windows telling a similar story')
                return (f'The latest score gap is {latest_gap:.2f}; the three-week gap '
                     f'is {gap:.2f}. These are {interpretation}.')
            if angle=='title race':
                return (f'Ranks {g["rank_a"]} and {g["rank_b"]} get a direct test. '
                     f'The {gap:.2f}-point average separation is real; the result remains unplayed.')
            if angle=='consistency versus volatility':
                ra=max(g['scores_a'][-3:])-min(g['scores_a'][-3:]);rb=max(g['scores_b'][-3:])-min(g['scores_b'][-3:])
                return (f'A {ra:.2f}-point range versus {rb:.2f} is not a forecast. '
                     'It is an excellent reason to distrust the neatness of a single average.')
            if angle=='leader under challenge':
                leader=a if g['rank_a']<=g['rank_b'] else b
                challenger=b if leader==a else a
                lr=g['rank_a'] if leader==a else g['rank_b']
                cr=g['rank_b'] if leader==a else g['rank_a']
                return (f'{front} brings the stronger recent form, {gap:.2f} points per week ahead. '
                     f'No. {cr} {challenger} still gets its chance at No. {lr} {leader}; '
                     'the preview cannot score that game for either side.')
            return nl33_closer(s,f,kind,index)


        def nl34_required_autopsy_context(s,kind,close):
            """Never delete the fact needed by the original NL30 autopsy gate."""
            if s['nl30_structure']!='Autopsy':return close
            plan=s['nl30_plan'];claim=plan.get('drop') or plan.get('provisional_drop')
            if claim is None or any(x in close for x in (f'{float(claim):.2f}',str(claim))):return close
            name=plan.get('focus') or s['nl30_facts'][0]['team']
            angle=s['angle'];number=f'{float(claim):.2f}'
            endings={
              'win without median':f' Meanwhile, {name} was {number} off its previous team pace.',
              'form upset':f' The earlier team scoring change measured {number}.',
              'large-weekly-margin':f' {name} also ended {number} below its earlier team pace.',
              'standings shock':(f' {name} also shifted {int(claim)} provisional positions.' if plan.get('provisional_drop') is not None else f' {name} changed {number} points from its previous scoring pace.'),
              'underdog path':f' {name} arrives after a {number}-point team decline.',
              'recent reversal':f' The previous team-form deficit was {number} points.',
              'consistency versus volatility':f' {name} also fell {number} from its earlier pace.',
              'leader under challenge':f' {name} had also slipped {number} from prior team form.'}
            return close+endings.get(angle,f' {name} has a measured {number} change from its previous team form.')


        def nl34_sentence_fingerprint(sentence,story):
            return nl33_copy_fingerprint(sentence,story)


        def nl34_duplicate_guard(war,after):
            """Hard ban on all sentence-shape copies, not only full paragraphs or prefix.
            Includes cross-edition closers AND every sentence in P2 and closer.
            Small common connective sentences ignored only when under eight tokens.
            """
            for kind,stories in (('after',after),('war',war)):
                seen={'why':{},'takeaway':{}}
                for ix,s in enumerate(stories,1):
                    for key in ('why','takeaway'):
                        all_text=nl33_copy_fingerprint(s[key],s)
                        if all_text in seen[key]:
                            raise RuntimeError(f'NL34 duplicate {key} shape {kind} #{ix} and #{seen[key][all_text]}')
                        seen[key][all_text]=ix
                for field in ('why','takeaway'):
                    # Compare complete canonical sentence shapes across distinct stories.
                    seq=[]
                    for ix,s in enumerate(stories,1):
                        sentences=nl30_sentences_preserving_player(s[field],s['nl30_facts'][0]['name'])
                        for sent in sentences:
                            mask=nl34_sentence_fingerprint(sent,s)
                            if len(mask.split())>=8:seq.append((ix,mask))
                    for i,(ix,x) in enumerate(seq):
                        for j,y in seq[i+1:]:
                            if ix!=j and x==y:raise RuntimeError(f'NL34 repeated {field} sentence shape {kind} #{ix}/#{j}')
            # Compare every reader-facing sentence, not merely the second paragraph's
            # first ten words. A recycled Aftermath close cannot turn up as a preview
            # opener, nor can its first sentence be disguised as a War Room second P.
            aft=set()
            for s in after:
                for field in ('lead','why','takeaway'):
                    for sent in nl30_sentences_preserving_player(s[field],s['nl30_facts'][0]['name']):
                        z=nl34_sentence_fingerprint(sent,s)
                        if len(z.split())>=8:aft.add(z)
            for ix,s in enumerate(war,1):
                for field in ('lead','why','takeaway'):
                    for sent in nl30_sentences_preserving_player(s[field],s['nl30_facts'][0]['name']):
                        z=nl34_sentence_fingerprint(sent,s)
                        if len(z.split())>=8 and z in aft:
                            raise RuntimeError(f'NL34 copied Aftermath sentence shape into War Room {field} #{ix}')
            return True


        def nl32_apply_editorial(war,after,warfacts,aftfacts,profiles):
            decision=_NL34_BEFORE_APPLY(war,after,warfacts,aftfacts,profiles)
            for kind,stories,facts in (('after',after,aftfacts),('war',war,warfacts)):
                for ix,(s,f) in enumerate(zip(stories,facts)):
                    orig=(s['why'],s['takeaway'])
                    s['why']=nl34_second(s,f,kind,ix)
                    s['takeaway']=nl34_required_autopsy_context(s,kind,nl34_finish(s,f,kind,ix))
                    s['punchline']=s['takeaway']
                    for p,d in zip(s['nl30_facts'],s['nl30_decisions']):
                        audit=d.get('nl34_audit')
                        if not audit or str(p['player_id'])!=audit['highest_eligible_player_id']:
                            raise RuntimeError('NL34 chosen starter missing top-ranked relevance audit')
                        if audit['limited_explanation'] and p['position'] in ('K','P','PK') and s['nl30_structure']=='Autopsy':
                            raise RuntimeError('NL34 low-explanatory kicker cannot anchor team collapse')
                    fresh=sorted(nl31_numeric_literals(s['why'])-nl31_numeric_literals(s['lead']))
                    s['nl34_editorial_evidence']={
                        'lens':s['angle'],'paragraph_two_added_values':fresh,
                        'primary_featured_starter':s['nl30_facts'][0]['name'],
                        'starter_week_source':s['nl30_facts'][0]['nl32_current_week_source'],
                        'selection_audits':[d['nl34_audit'] for d in s['nl30_decisions']],
                        'paragraph_2_fingerprint':nl33_copy_fingerprint(s['why'],s),
                        'closer_fingerprint':nl33_copy_fingerprint(s['takeaway'],s),
                        'reader_prose_differentiated':orig!=(s['why'],s['takeaway']),
                        'same_week_8_9_control_read_only':True,
                        'human_review_pending':True}
                    # Reflect only final reader copy in all ledgers.
                    s['nl33_editorial_evidence']['paragraph_two_adds']=fresh
                    s['nl33_editorial_evidence']['paragraph_2_shape']=nl33_copy_fingerprint(s['why'],s)
                    s['nl33_editorial_evidence']['closing_shape']=nl33_copy_fingerprint(s['takeaway'],s)
                    s['nl32_editorial_evidence']['paragraph2_canonical_pattern']=nl32_canon(s['why'],s)
