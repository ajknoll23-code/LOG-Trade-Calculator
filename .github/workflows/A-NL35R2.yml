        def _nl28_fact_edit(f, s, kind):
            s = dict(s)
            g = f['game']
            a, b = g['name_a'], g['name_b']
            angle = s['angle']
            voice = 'Ruthless Sports Radio'
            if kind == 'war':
                aa, bb, gap = f['ave_a'], f['ave_b'], f['gap']
                front = a if aa >= bb else b
                back = b if front == a else a
                high, low = max(aa, bb), min(aa, bb)
                win_a = int(str(g['record_a']).split('-')[0])
                win_b = int(str(g['record_b']).split('-')[0])
                if angle == 'record versus form':
                    voice = 'Sophisticated Savage' if gap < 8 else voice
                    s['headline'] = f'{abs(win_a-win_b)} Games Apart. {gap:.2f} Points Apart.'
                    s['lead'] = (f'{a} enters at {g["record_a"]}; {b} at {g["record_b"]}. '
                                 f'Their recent three-week averages are {aa:.2f} and {bb:.2f}. '
                                 f'All that record separation bought somebody a {gap:.2f}-point weekly difference.')
                    s['why'] = (f'{front} has the narrow recent scoring advantage. The standings favor a different story '
                                'than those last three scoreboards, and neither gets to cast the deciding vote before kickoff.')
                    s['takeaway'] = 'One résumé has more wins. The recent points refused to be impressed.'
                elif angle == 'underdog path':
                    bh = f['high_b'] if back == b else f['high_a']
                    fl = f['low_a'] if front == a else f['low_b']
                    overlap = bh - fl
                    voice = 'Full League Roast' if gap >= 45 else voice
                    s['headline'] = f'{gap:.2f} Points a Week. The Underdog Has Homework.'
                    s['lead'] = (f'{back} has averaged {low:.2f} over {f["window"]}; {front} has averaged {high:.2f}. '
                                 f'That {gap:.2f}-point weekly gap is not a coin flip dressed up in football pads.')
                    if overlap >= 0:
                        s['why'] = (f'{back} reached {bh:.2f} once, while {front} fell to {fl:.2f} once. '
                                    f'Those completed-game ranges overlap by {overlap:.2f} points. '
                                    'It is a documented opening, not a dependable lifestyle.')
                        s['takeaway'] = 'The escape hatch exists. The front door is still locked by the numbers.'
                    else:
                        s['why'] = (f'{back} peaked at {bh:.2f}, and {front} bottomed at {fl:.2f} '
                                    f'across the same completed span. Even those extremes are {abs(overlap):.2f} points apart.')
                        s['takeaway'] = 'Even the best recent underdog week could not catch the favorite\'s worst.'
                elif angle == 'recent reversal':
                    moves = [(a, f['latest_change_a'], f['latest_a']), (b, f['latest_change_b'], f['latest_b'])]
                    who, delta, latest = max((x for x in moves if x[1] is not None), key=lambda x: abs(x[1]))
                    previous = latest - delta
                    voice = 'Full League Roast' if delta < -45 else voice
                    s['headline'] = (f'{abs(delta):.2f} Points Went Missing. Questions Are Welcome.' if delta < 0
                                     else f'{delta:.2f} Points of Improvement. Now Prove It Again.')
                    s['lead'] = (f'{who} posted {latest:.2f} last week, {abs(delta):.2f} '
                                 f'{"below" if delta < 0 else "above"} its previous three-week average of {previous:.2f}. '
                                 'A trend chart can survive a surprise. Its reputation may need more work.')
                    s['why'] = (f'{who} now meets {b if who == a else a}. Their latest three-week scoring averages '
                                f'differ by {gap:.2f} points. One strange Sunday changes the story, not the established arithmetic.')
                    s['takeaway'] = 'Nobody has explained that swing. The next box score gets the microphone.'
                elif angle == 'title race':
                    s['headline'] = f'Nos. {g["rank_a"]} and {g["rank_b"]}. Only One Gets to Brag Monday.'
                    s['lead'] = (f'{a} and {b} are provisional Nos. {g["rank_a"]} and {g["rank_b"]}. '
                                 f'Their recent scoring averages are {aa:.2f} and {bb:.2f}; '
                                 f'{front} owns the {gap:.2f}-point weekly edge.')
                    s['why'] = ('The head-to-head result will affect the combined-record race. Each team also faces '
                                'the median, which has never cared how impressive a provisional seed looks on paper.')
                    s['takeaway'] = 'A prestigious matchup is still settled by an extremely unprestigious scoreboard.'
                elif angle == 'leader under challenge':
                    champ = a if g['rank_a'] == 1 else b
                    challenger = b if champ == a else a
                    champ_avg = aa if champ == a else bb
                    ch_avg = bb if champ == a else aa
                    voice = 'Full League Roast' if champ_avg - ch_avg >= 50 else voice
                    s['headline'] = f'No. 1 Is {abs(champ_avg-ch_avg):.2f} Points Ahead Per Week. Good Luck.'
                    s['lead'] = (f'{champ} is provisional No. 1, averaging {champ_avg:.2f} over {f["window"]}. '
                                 f'{challenger} has averaged {ch_avg:.2f}. This is a {abs(champ_avg-ch_avg):.2f}-point '
                                 'weekly challenge, not a ceremonial invitation to the throne room.')
                    s['why'] = (f'{challenger} did produce {f["high_b"] if challenger == b else f["high_a"]:.2f} '
                                'in one recent game. That is a verified high, not a reason to pretend the wider gap disappeared.')
                    s['takeaway'] = 'The challenger needs to change the math, not the promotional material.'
                elif angle == 'consistency versus volatility':
                    x, y = f['range_a'], f['range_b']
                    volatile = a if x > y else b
                    steady = b if volatile == a else a
                    s['headline'] = f'{max(x,y):.2f} Points of Whiplash. One Team Brought a Seat Belt.'
                    s['lead'] = (f'{volatile} has swung {max(x,y):.2f} points between its recent high and low. '
                                 f'{steady} swung {min(x,y):.2f}. That is a measurable difference in how these offenses arrive.')
                    s['why'] = (f'{front} still owns the recent scoring edge, {high:.2f} to {low:.2f}. '
                                'A wide range means past volatility, not a forecast of next week\'s result.')
                    s['takeaway'] = 'Somebody is getting the roller coaster. The scoreboard sells tickets after kickoff.'
                elif angle == 'fine margins':
                    voice = 'Sophisticated Savage'
                    s['headline'] = f'{gap:.2f} Points of Separation. Save the Victory Speech.'
                    s['lead'] = (f'{a} averaged {aa:.2f} over {f["window"]}; {b} averaged {bb:.2f}. '
                                 f'The gap is {gap:.2f}. An entire week of bravado is balanced on a rounding error.')
                    s['why'] = ('Those completed-game averages make this one genuinely close, regardless of how '
                                'different the broader records may look.')
                    s['takeaway'] = 'The evidence is close. The trash talk, inevitably, will not be.'
            else:
                sa, sb, margin, median = f['score_a'], f['score_b'], f['margin'], f['median']
                winner = a if sa > sb else b if sb > sa else None
                loser = b if winner == a else a
                ws, ls = max(sa,sb), min(sa,sb)
                week = f['week']
                if angle == 'strong score in defeat' and winner:
                    voice = 'Full League Roast'
                    s['headline'] = f'{ls:.2f} Points. And Still a Loss.'
                    s['lead'] = (f'{loser} scored {ls:.2f}, cleared the Week {week} median by {ls-median:.2f}, '
                                 f'and still lost {ws:.2f}–{ls:.2f} to {winner}. '
                                 'That is an excellent score with a spectacularly inconvenient opponent.')
                    s['why'] = (f'{winner} scored {ws:.2f} and took the head-to-head win. Both teams beat the '
                                f'{median:.2f} median; only one escaped with a full 2–0 week.')
                    s['takeaway'] = 'The offense did its job. The schedule handed it a receipt for second place.'
                elif angle == 'win without median' and winner:
                    voice = 'Sophisticated Savage'
                    s['headline'] = f'{ws:.2f} Won the Game. The Median Was Unimpressed.'
                    s['lead'] = (f'{winner} beat {loser} {ws:.2f}–{ls:.2f}. The winning score was still '
                                 f'{median-ws:.2f} shy of the {median:.2f} league median. '
                                 'Someone gets a head-to-head victory and a second opinion they did not request.')
                    s['why'] = ('Both teams lost their median result. That turns the winner\'s week into 1–1, '
                                'which is real credit for the win and no credit for the scoring standard.')
                    s['takeaway'] = 'The win counts. The league-wide comparison has declined to applaud.'
                elif angle == 'pregame-baseline reversal' and winner:
                    moves = [(a,f['dev_a'],f['prior_a'],sa),(b,f['dev_b'],f['prior_b'],sb)]
                    who,delta,prior,actual = max(moves,key=lambda x:abs(x[1]))
                    s['headline'] = (f'{abs(delta):.2f} Points Better. Still {margin:.2f} Short.'
                                     if who == loser and delta > 0 else f'{abs(delta):.2f} Points Off Script.')
                    s['lead'] = (f'{who} scored {actual:.2f} in Week {week}, '
                                 f'{abs(delta):.2f} {"above" if delta > 0 else "below"} its '
                                 f'{prior:.2f}-point pregame scoring average. {winner} still won {ws:.2f}–{ls:.2f}.')
                    s['why'] = (f'The previous average comes from {f["source_pre"]}; the {margin:.2f}-point final '
                                'margin comes from the completed matchup. Both statements survive inspection.')
                    s['takeaway'] = ('Improvement was real. So was the loss.' if who==loser and delta>0
                                     else 'The old trend can present its case to a scoreboard that already closed court.')
                elif angle == 'form upset' and winner:
                    old_a, old_b = f['prior_a'], f['prior_b']
                    former = a if old_a >= old_b else b
                    voice = 'Full League Roast' if abs(old_a-old_b) >= 20 else voice
                    s['headline'] = f'The Form Chart Brought a Resume. {winner} Brought {ws:.2f}.'
                    s['lead'] = (f'{former} entered with the better {f["source_pre"]} average, '
                                 f'{max(old_a,old_b):.2f} to {min(old_a,old_b):.2f}. '
                                 f'Then {winner} won {ws:.2f}–{ls:.2f}. The trend had a great week right up until the actual game.')
                    s['why'] = (f'The result reversed a {abs(old_a-old_b):.2f}-point pregame scoring-form advantage. '
                                'That is a result and a prior trend, not evidence of a published pregame prediction.')
                    s['takeaway'] = 'A fine-looking trend met an extremely uncooperative final score.'
                elif angle == 'standings shock':
                    mover = a if abs(g['rank_delta_a']) >= abs(g['rank_delta_b']) else b
                    shift = g['rank_delta_a'] if mover==a else g['rank_delta_b']
                    start = g['prior_rank_a'] if mover==a else g['prior_rank_b']
                    end = g['rank_a'] if mover==a else g['rank_b']
                    points = sa if mover==a else sb
                    voice = 'Full League Roast' if shift <= -3 else voice
                    s['headline'] = f'{abs(shift)} Places in One Week. The Standings Found a Trapdoor.'
                    s['lead'] = (f'{mover} went from provisional No. {start} to No. {end} after Week {week}, '
                                 f'{abs(shift)} places {"up" if shift > 0 else "down"}. '
                                 f'A {points:.2f}-point week drove the reconstructed change.')
                    s['why'] = (f'{mover} finished {abs(points-median):.2f} '
                                f'{"above" if points > median else "below" if points < median else "at"} '
                                f'the {median:.2f} league median. Those ranks are provisional, not an official Sleeper tiebreak list.')
                    s['takeaway'] = ('Three places down is not a slip. That is an elevator with a missing floor.'
                                     if shift <= -3 else 'The reconstructed table moved faster than the excuses can travel.')
                elif angle == 'large-weekly-margin' and winner:
                    voice = 'Full League Roast' if margin >= 100 else voice
                    s['headline'] = f'{margin:.2f} Points Apart. Are We Sure That Was the Same Game?'
                    s['lead'] = (f'{winner} scored {ws:.2f}; {loser} scored {ls:.2f}. '
                                 f'The {margin:.2f}-point margin is confirmed. The teams appear to have played different sports.')
                    s['why'] = (f'The winner cleared the {median:.2f} Week {week} median by {ws-median:.2f}; '
                                f'the loser missed it by {median-ls:.2f}. This describes one completed matchup, '
                                'not an unverified historical record.')
                    s['takeaway'] = 'One team brought a scoring offense. The other supplied the contrast.'
            # Preserve every underlying sourced fact in the original ledger; this is only a prose pass.
            # Distinctive hooks are tracked for review, but this is not an invented score or a vote.
            s['voice'] = voice
            s['tone'] = 'brash_evidence_led_clean'   # Original evidence gate remains authoritative.
            s['punchline'] = s['takeaway']
            s['joke_basis'] = s.get('joke_basis') or 'verified matchup and three-week scoring context'
            s['keys'] = list(dict.fromkeys(s['keys'] + ['nl28_fact_anchored_voice']))
            return s


        def _nl27_voice(f, s, kind):
