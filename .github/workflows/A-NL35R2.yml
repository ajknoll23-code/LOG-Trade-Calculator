            # Score relative to strictly pregame three-week recent form; not a retroactive prediction.
            dev_options=[(a,f['dev_a'],f['prior_a'],sa),(b,f['dev_b'],f['prior_b'],sb)]
            loud=max(dev_options,key=lambda t:abs(t[1]))
            if abs(loud[1])>=25:
                who,change,prior,actual=loud
                options.append(entry('pregame-baseline reversal',165+min(abs(change),100)/7,'The Pre-Week Baseline Did Not Hold',
                    f'Before Week {w}, {who} averaged {prior:.2f} points in {pweek}. It scored {actual:.2f} in this game, a {abs(change):.2f}-point {"surge" if change>0 else "drop"} against that available-before-kickoff baseline.',
                    (f'Even that improvement was not enough to beat {win}, which scored {winner_score:.2f}; the {margin:.2f}-point defeat was not simply a continuation of {who}’s earlier low-scoring run.' if change>0 and who!=win else f'That {"jump" if change>0 else "shortfall"} changed the scoring picture in a {margin:.2f}-point final. It is a descriptive baseline comparison, not a claim that the newsletter archived a pick.'),
                    f'Which is the better guide for {who} next week: the preceding average or this single result?',
                    ['pregame_scores','final_scores','baseline_gap']))
            if win!='neither':
                prior_winner=a if f['prior_a']>f['prior_b'] else b
                if prior_winner!=win and abs(f['prior_a']-f['prior_b'])>=10:
                    options.append(entry('form upset',170,'The Recent-Form Favorite Lost',
                        f'{prior_winner} led the {pweek} scoring averages, {f["prior_a"]:.2f} to {f["prior_b"]:.2f} in {a}-then-{b} order. Week {w} produced the opposite result: {win} won {winner_score:.2f} to {loser_score:.2f}.',
                        f'The outcome cut against the scoring trend that was knowable beforehand. The {margin:.2f}-point final margin shows the reversal clearly without pretending a formal newsletter prediction was published.',
                        f'Will {win} establish a higher baseline, or was the reversal a single-week event?',
