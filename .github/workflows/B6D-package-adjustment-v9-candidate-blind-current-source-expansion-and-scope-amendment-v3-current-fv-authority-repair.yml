name: B6D Package Adjustment V9 - Candidate-Blind Current-Source Expansion and Scope Amendment V3 Current-FV Authority Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b6d-current-source-expansion-scope-amendment
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6D_ANALYSIS_VERSION: "package-adjustment-v9-b6d-current-source-expansion-scope-amendment-v3-current-fv-authority-repair"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" \
            "scipy==1.16.2"

      - name: Guard B6C scientific diagnosis and frozen upstream lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          OUTDIR="research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment"
          test ! -e "$OUTDIR" || {
            echo "ERROR: B6D durable output directory already exists; this source/scope amendment is one-shot."
            exit 1
          }

          declare -A EXPECTED_BLOBS=(
            [".github/workflows/B6B-package-adjustment-v9-five-topology-discordant-catalog-diversity-feasibility-audit.yml"]="d446e21821305fda29b7d89f8b160943675012eb"
            [".github/workflows/B6C-package-adjustment-v9-catalog-diversity-bottleneck-boundary-audit-v3-feasibility-objective-repair.yml"]="48565c593220694882607efcc14a3dec775697da"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_breadth_reservoir_audit.json"]="f40408f447e3073be9fe34c0f6692d6b3cb574ea"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_diversity_feasibility.json"]="9a132c41ab2bd3bddc2f7aee557d99cb2c9b2e3d"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_manifest.json"]="04f8c7c2276ab07cc985291a236151646a1aa236"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_preregistered_diversity_protocol.json"]="c9bc86ae7232cdd6db658bf7cd68cb1c04559357"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_scope_amendment.json"]="09239d4e792f66d8c5440cf67abd5803ba09c70f"
            ["research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_report.md"]="b907311eef04b3a4db7304792589a71e991c8e24"
            ["research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_constraint_boundary_results.json"]="59b46d8fa3717fb9ad75399aa193398f13187070"
            ["research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_manifest.json"]="d9b49f1908841a5754b3e21f8bddee6c053f1665"
            ["research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_output_hashes.json"]="eca7b95a686ae566b1f4714bdf41d0bf32d5c8ab"
            ["research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_preregistered_boundary_protocol.json"]="99a680f0e46794837cf8ace72fc7f1ad61358539"
            ["research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_report.md"]="3cc5eab950c058fa696b4f3cb1181207303c47d5"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json"]="8fb47e28595bed2b667ed8a6e29cbe9d52aaf670"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json"]="81cee2e1242ee05259cb68639efad80c704647f9"
            ["research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json"]="945bfb8f504bf62cba46464e1940126fd7a528e8"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: upstream durable source drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY1'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())

          b6=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json')
          b6b=load('research/package-adjustment-v9/b6b-five-topology-diversity-feasibility/b6b_manifest.json')
          b6c=load('research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_manifest.json')
          diag=load('research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair/b6c_constraint_boundary_results.json')

          assert b6['decision']=='PASS_PREFERRED_BURDEN_FEASIBLE'
          assert b6b['decision']=='STOP_NO_DIVERSE_FIVE_TOPOLOGY_CATALOG_FEASIBLE'
          assert b6c['decision']=='DIAGNOSE_BROAD_RELAXATION_ONLY_SOURCE_EXPANSION_OR_SCOPE_REDUCTION_REQUIRED'
          assert b6c['b7_authorized'] is False
          assert b6c['human_catalog_generated'] is False
          assert b6c['human_outcomes_exist_or_were_read'] is False
          assert b6c['production_change_authorized'] is False
          assert b6c['v9_eligible_topologies']==['2v3','2v4','3v3','3v4','4v4']
          assert b6c['v1_7_only_topologies']==['2v2']
          assert abs(float(b6c['q'])-2.9897594788655337)<1e-15
          assert abs(float(b6c['theta_min'])-.60)<1e-15
          assert abs(float(b6c['fair_band'])-.07)<1e-15
          assert abs(float(b6c['familywise_alpha'])-.05)<1e-15
          assert diag['baseline_tier_c_reproduced_as_proven_infeasible'] is True
          assert diag['direct_2v4_concentration_diagnostic']['reservoir_count']==127
          assert diag['direct_2v4_concentration_diagnostic']['unavoidable_appearances_of_most_frequent_player_in_any_120_subset_lower_bound']==47
          drops={x['dropped_topology']:x for x in diag['drop_one_topology_diagnostics']}
          assert drops['2v4']['feasible'] is True
          assert all((t=='2v4') or (drops[t]['feasible'] is False) for t in drops)
          assert diag['envelopes']['modest']['feasible'] is False
          assert diag['envelopes']['aggressive_diagnostic_only']['feasible'] is False
          assert diag['envelopes']['broad_sanity_only']['feasible'] is True
          print('PASS: exact B6C diagnosis guarded. B7 remains blocked until this prospective B6D amendment passes.')
          PY1

      - name: Run prospective current-source expansion and topology-scope amendment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b6d
          mkdir -p /tmp/package-adjustment-v9-b6d

          cat > /tmp/package-adjustment-v9-b6d/analyze_b6d.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import math
          import os
          import re
          import subprocess
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import numpy as np
          from scipy.optimize import Bounds, LinearConstraint, milp
          from scipy.sparse import coo_matrix

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b6d')
          VERSION=os.environ.get('B6D_ANALYSIS_VERSION','package-adjustment-v9-b6d-current-source-expansion-scope-amendment-v3-current-fv-authority-repair')

          B6C=ROOT/'research/package-adjustment-v9/b6c-diversity-bottleneck-boundary-v3-feasibility-objective-repair'
          OLD_SNAPSHOT=ROOT/'research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json'
          OLD_CATALOG=ROOT/'research/package-adjustment-v8/development_catalog_v1.json'
          INDEX=ROOT/'index.html'
          VALUES=ROOT/'scripts/artifacts/generated/value_uncertainty.json'
          ROSTERS=ROOT/'data/league_rosters.json'
          FREE_AGENTS=ROOT/'data/free_agents.json'
          LAST_SYNC=ROOT/'data/last_synced.json'
          SNAPSHOT_VALUES=ROOT/'scripts/validation/snapshot_values.py'

          FIVE=['2v3','2v4','3v3','3v4','4v4']
          FOUR=['2v3','3v3','3v4','4v4']
          FALLBACK_INITIAL=['2v2']
          TARGET_GRID=[120,180,240]
          SOLVE_ORDER=[240,120,180]
          AUTHORIZATION_TARGET=240

          Q=2.9897594788655337
          THETA_MIN=0.60
          FAIR=0.07
          FWER_ALPHA=0.05

          MIN_PLAYER_FV=2500
          SIZE2_MIN_FV=3000
          RAW_RATIO_MIN=0.75
          SIDE_MIN_TOTAL={2:7000,3:9000,4:11500}
          SIDE_PROFILES={
            2:[(0.50,0.50),(0.60,0.40),(0.70,0.30)],
            3:[(0.34,0.33,0.33),(0.45,0.33,0.22),(0.55,0.30,0.15),(0.65,0.20,0.15)],
            4:[(0.25,0.25,0.25,0.25),(0.35,0.28,0.22,0.15),(0.45,0.25,0.18,0.12),(0.55,0.18,0.15,0.12)],
          }

          # Prospectively broaden the deterministic source-frame search. These are fixed
          # before the current source snapshot is built and before any V9 challenge exists.
          NEAREST_LIMIT=64
          PROFILE_VARIANTS=32
          PER_ANCHOR_CANDIDATES=24
          PROBE_MULTIPLIER=6
          RESERVOIR_CAP_PER_TOPOLOGY=5000
          JOINT_TIME_LIMIT_SECONDS=1200

          POSITIONS=('QB','RB','WR','TE','DL','LB','DB')
          POS_MAP={
            'QB':'QB','RB':'RB','WR':'WR','TE':'TE',
            'DL':'DL','DE':'DL','DT':'DL',
            'LB':'LB','OLB':'LB','ILB':'LB',
            'DB':'DB','CB':'DB','S':'DB','SS':'DB','FS':'DB',
          }

          def load(p): return json.loads(Path(p).read_text())
          def sha256_file(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def canonical_sha(obj):
            return hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          def norm(v):
            s=str(v or '').strip().lower()
            s=re.sub(r"[.'’\-]",'',s)
            return re.sub(r'\s+',' ',s).strip()
          def finite(v):
            try: x=float(v)
            except (TypeError,ValueError): return None
            return x if math.isfinite(x) else None
          def git_blob(p):
            return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          def git_head():
            return subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def canonical_side(keys): return '|'.join(sorted(keys))
          def canonical_trade(a,b): return '||'.join(sorted((canonical_side(a),canonical_side(b))))
          def h64(s): return int(hashlib.sha256(s.encode()).hexdigest()[:16],16)
          def candidate_score(fvs):
            n=len(fvs)
            return (n**(1.0-1.0/Q))*(sum(float(v)**Q for v in fvs)**(1.0/Q))
          def verdict(a,b):
            hi=max(float(a),float(b),1.0)
            d=abs(float(a)-float(b))/hi
            if d < FAIR-1e-15: return None,d
            return ('A' if a>b else 'B'),d
          def strength_bucket(x):
            if x<.10: return '7-10%'
            if x<.15: return '10-15%'
            return '15%+'

          # Preregister the amendment before opening/rebuilding the current source frame.
          protocol={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B6D_CURRENT_SOURCE_AND_SCOPE_AMENDMENT',
            'purpose':'Use a fresh candidate-blind current calculator FV source and a broader deterministic source-frame search before deciding whether five topologies can be retained or 2v4 must prospectively remain on V1.7.',
            'upstream_b6c_decision':'DIAGNOSE_BROAD_RELAXATION_ONLY_SOURCE_EXPANSION_OR_SCOPE_REDUCTION_REQUIRED',
            'candidate_id':'V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q',
            'q':Q,
            'theta_min':THETA_MIN,
            'fair_band':FAIR,
            'familywise_alpha':FWER_ALPHA,
            'one_vote_per_unique_challenge':True,
            'efficacy_science_changed':False,
            'v2_operational_failure_repair':'V2 stopped before candidate generation because asynchronous value_uncertainty center_value was incorrectly required to exactly equal current runtime live FV; V3 changes source-integrity plumbing only, not candidate/science/decision rules.',
            'initial_scope':FIVE,
            'prospective_fallback_scope_if_needed':FOUR,
            'initial_v1_7_only_topologies':FALLBACK_INITIAL,
            'source_rule':{
              'valuation_source':'current checked-out index.html through scripts/validation/snapshot_values.py',
              'fv_source_of_truth':'current checked-out index.html through scripts/validation/snapshot_values.py at workflow runtime',
              'value_uncertainty_role':'identity/position and stale-center diagnostic cross-check only; center_value is not an FV authority because the artifact is generated asynchronously and RB values continuously age with date',
              'availability_universe':'union of every current league-rostered player plus current free_agents entries with status Active',
              'rostered_status_policy':'retain rostered assets across transient injury/status flags, but exclude explicit Retired status',
              'free_agent_status_policy':'require status Active',
              'positions_included':['QB','RB','WR','TE','DL','LB','DB'],
              'idp_inclusion_continuity':'DL/LB/DB were already present in the frozen V7 source; this is not a topology/population expansion',
              'normalized_name_collision_policy':'detect across source player_ids, live PLAYER_DB keys, and value_uncertainty keys; exclude ambiguous normalized names before FV matching',
              'draft_picks_included':False,
              'market_values_used':False,
              'external_network_refresh_inside_workflow':False,
              'freeze_before_candidate_generation':True,
            },
            'source_frame_search':{
              'minimum_player_fv':MIN_PLAYER_FV,
              'size2_minimum_player_fv':SIZE2_MIN_FV,
              'minimum_raw_sum_ratio':RAW_RATIO_MIN,
              'side_min_total':SIDE_MIN_TOTAL,
              'side_apex_minimum':4000,
              'minimum_asset_share':0.10,
              'side_profiles':SIDE_PROFILES,
              'profile_neighbor_limit':NEAREST_LIMIT,
              'deterministic_profile_variants':PROFILE_VARIANTS,
              'accepted_candidates_per_anchor_cap':PER_ANCHOR_CANDIDATES,
              'qualifying_window_probe_multiplier':PROBE_MULTIPLIER,
              'deterministic_reservoir_cap_per_topology':RESERVOIR_CAP_PER_TOPOLOGY,
              'exact_v8_trade_overlap_excluded':True,
            },
            'diversity_contract':{
              'interpretation':'Preserve B6B Tier C concentration RATES rather than accepting B6C broad relaxation.',
              'max_player_per_topology_rate':0.20,
              'max_player_global_rate_of_all_selected_challenges':0.10,
              'max_exact_side_bundle_reuse_rate_per_topology':0.05,
              'at_120':{'max_player_per_topology':24,'five_scope_global_cap':60,'side_reuse_cap':6},
            },
            'target_grid_per_topology':TARGET_GRID,
            'authorization_capacity_target_per_retained_topology':AUTHORIZATION_TARGET,
            'decision_rules_ordered':[
              'If FIVE topologies are feasible at 240 challenges/topology under Tier-C rates, retain all five and authorize B7 over five hypotheses.',
              'Else if FOUR topologies after prospectively dropping 2v4 are feasible at 240/topology under the same rates, freeze four-topology scope and authorize B7 over four hypotheses.',
              'Else STOP: do not run B7; current source still cannot support the required diverse high-information study.',
            ],
            'targets_120_and_180_role':'diagnostic capacity only; they cannot override a failed 240 authorization gate',
            'solver_certainty_contract':{
              'FEASIBLE':'finite incumbent independently satisfies every hard constraint; optimality not required',
              'PROVEN_INFEASIBLE':'HiGHS status 2 with no feasible incumbent',
              'UNKNOWN_TIMEOUT':'status 1 with no feasible incumbent; operational failure, not scientific infeasibility',
              'UNKNOWN_OTHER':'all other unresolved states; operational failure, not scientific infeasibility',
              'joint_time_limit_seconds':JOINT_TIME_LIMIT_SECONDS,
            },
            'human_catalog_generated':False,
            'human_voting_authorized':False,
            'human_outcomes_read':False,
            'v8_candidate_performance_read':False,
            'production_change_authorized':False,
          }
          (OUT/'b6d_preregistered_source_scope_protocol.json').write_text(json.dumps(protocol,indent=2,sort_keys=True)+'\n')

          # Guard the B6C result again inside the analysis process.
          b6c=load(B6C/'b6c_manifest.json')
          b6c_diag=load(B6C/'b6c_constraint_boundary_results.json')
          assert b6c['decision']=='DIAGNOSE_BROAD_RELAXATION_ONLY_SOURCE_EXPANSION_OR_SCOPE_REDUCTION_REQUIRED'
          assert b6c['b7_authorized'] is False
          assert b6c['human_outcomes_exist_or_were_read'] is False
          b6c_drops={x['dropped_topology']:x for x in b6c_diag['drop_one_topology_diagnostics']}
          assert b6c_drops['2v4']['feasible'] is True
          assert all((t=='2v4') or (b6c_drops[t]['feasible'] is False) for t in b6c_drops)

          # Build the current candidate-blind source snapshot.
          spec=importlib.util.spec_from_file_location('snapshot_values_b6d',SNAPSHOT_VALUES)
          snapmod=importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(snapmod)
          cfg=snapmod.load_from_html(INDEX)
          live_raw=snapmod.compute_all_values(cfg)
          vu=load(VALUES)
          rosters=load(ROSTERS)
          free_agents=load(FREE_AGENTS)
          old_snapshot=load(OLD_SNAPSHOT)

          # Normalize each valuation namespace explicitly and detect collisions before matching.
          # Ambiguous normalized names are excluded conservatively; they are never silently merged.
          live_buckets=defaultdict(list)
          for raw_key,row in live_raw.items():
            key=norm(raw_key)
            if key: live_buckets[key].append((str(raw_key),row))
          vu_buckets=defaultdict(list)
          for raw_name,row in (vu.get('players') or {}).items():
            key=norm(raw_name)
            if key: vu_buckets[key].append((str(raw_name),row))

          source_name_ids=defaultdict(set)
          source_rows=[]
          for team in rosters.get('rosters') or []:
            for slot in ('starters','bench','taxi','reserve_ir'):
              for raw in team.get(slot) or []:
                key=norm(raw.get('name'))
                if not key: continue
                pid=str(raw.get('player_id') or '').strip()
                identity=pid or f"noid|{key}|{raw.get('team')}|{raw.get('position')}"
                source_name_ids[key].add(identity)
                source_rows.append(('rostered',key,raw))
          for raw in free_agents.get('free_agents') or []:
            if str(raw.get('status') or '').strip().lower()!='active':
              continue
            key=norm(raw.get('name'))
            if not key: continue
            pid=str(raw.get('player_id') or '').strip()
            identity=pid or f"noid|{key}|{raw.get('team')}|{raw.get('pos') or raw.get('raw_position')}"
            source_name_ids[key].add(identity)
            source_rows.append(('free_agent',key,raw))

          ambiguous_names=(
            {k for k,v in live_buckets.items() if len(v)>1}
            | {k for k,v in vu_buckets.items() if len(v)>1}
            | {k for k,ids in source_name_ids.items() if len(ids)>1}
          )
          live={k:v[0][1] for k,v in live_buckets.items() if k not in ambiguous_names and len(v)==1}

          vu_idx={}
          for key,bucket in vu_buckets.items():
            if key in ambiguous_names or len(bucket)!=1:
              continue
            row=bucket[0][1]
            val=finite(row.get('center_value'))
            pos=POS_MAP.get(str(row.get('pos') or '').upper())
            if val is not None and val>0 and pos in POSITIONS:
              vu_idx[key]={'fv':int(round(val)),'pos':pos}

          avail={}
          for origin,key,raw in source_rows:
            if key in ambiguous_names:
              continue
            if origin=='rostered' and str(raw.get('status') or '').strip().lower()=='retired':
              continue
            if key in avail:
              # Same player_id can legitimately appear only once; source_name_ids already guards
              # against distinct players sharing this normalized name. Prefer rostered metadata.
              if avail[key]['origin']=='rostered' or origin!='rostered':
                continue
            avail[key]={
              'key':key,
              'name':str(raw.get('name') or key),
              'team':raw.get('team'),
              'age':raw.get('age'),
              'status':raw.get('status'),
              'player_id':raw.get('player_id'),
              'origin':origin,
            }

          # index.html, evaluated through the checked-in snapshot_values port at run time,
          # is the authoritative current FV source. value_uncertainty.json is asynchronous
          # and therefore cannot be an exact center-value veto: RB FVs continuously age by
          # date and the uncertainty artifact may have been generated on an earlier date.
          # We still use value_uncertainty as an identity/position integrity cross-check and
          # persist all center-value deltas for auditability.
          players={}
          vu_missing=[]
          position_mismatches=[]
          fv_crosscheck=[]
          for key,meta in avail.items():
            if key not in live:
              continue
            live_val=int(live[key]['value'])
            pos=POS_MAP.get(str(live[key].get('pos') or '').upper())
            if pos not in POSITIONS or live_val<=0:
              continue

            vu_row=vu_idx.get(key)
            if vu_row is None:
              vu_missing.append(key)
            else:
              if vu_row['pos']!=pos:
                position_mismatches.append((key,pos,vu_row['pos']))
              vu_val=int(vu_row['fv'])
              fv_crosscheck.append({
                'key':key,
                'pos':pos,
                'live_fv':live_val,
                'value_uncertainty_center_value':vu_val,
                'delta_live_minus_artifact':live_val-vu_val,
                'abs_delta':abs(live_val-vu_val),
              })

            players[key]={
              **meta,
              'pos':pos,
              'fv':live_val,
            }

          if position_mismatches:
            raise RuntimeError(f'value_uncertainty/live position mismatch examples={position_mismatches[:20]} count={len(position_mismatches)}')

          current_players=sorted(players.values(),key=lambda p:(-int(p['fv']),p['key']))
          if len(current_players)<350:
            raise RuntimeError(f'too few current source players from live calculator source: {len(current_players)}')

          fv_mismatches=[x for x in fv_crosscheck if x['abs_delta']>0]
          fv_mismatches.sort(key=lambda x:(-x['abs_delta'],x['key']))
          fv_crosscheck_summary={
            'artifact_generated_at_utc':vu.get('generated_at_utc'),
            'shared_player_count':len(fv_crosscheck),
            'artifact_missing_for_live_source_count':len(vu_missing),
            'artifact_missing_for_live_source_examples':sorted(vu_missing)[:25],
            'center_value_mismatch_count':len(fv_mismatches),
            'center_value_exact_match_count':len(fv_crosscheck)-len(fv_mismatches),
            'max_abs_delta':max((x['abs_delta'] for x in fv_crosscheck),default=0),
            'mismatch_count_by_position':dict(sorted(Counter(x['pos'] for x in fv_mismatches).items())),
            'top_abs_delta_examples':fv_mismatches[:25],
            'interpretation':'diagnostic only; current runtime live FV is authoritative and asynchronous uncertainty center_value differences do not exclude players',
          }
          pos_counts=Counter(p['pos'] for p in current_players)
          if any(pos_counts[p]<20 for p in POSITIONS):
            raise RuntimeError(f'insufficient current-source position coverage: {dict(pos_counts)}')

          old_keys={p['key'] for p in old_snapshot['players']}
          new_keys={p['key'] for p in current_players}
          source_commit=git_head()
          source_files={
            str(INDEX):{'git_blob':git_blob(INDEX),'sha256':sha256_file(INDEX)},
            str(VALUES):{'git_blob':git_blob(VALUES),'sha256':sha256_file(VALUES)},
            str(ROSTERS):{'git_blob':git_blob(ROSTERS),'sha256':sha256_file(ROSTERS)},
            str(FREE_AGENTS):{'git_blob':git_blob(FREE_AGENTS),'sha256':sha256_file(FREE_AGENTS)},
            str(LAST_SYNC):{'git_blob':git_blob(LAST_SYNC),'sha256':sha256_file(LAST_SYNC)},
            str(SNAPSHOT_VALUES):{'git_blob':git_blob(SNAPSHOT_VALUES),'sha256':sha256_file(SNAPSHOT_VALUES)},
          }
          snapshot={
            'analysis_version':VERSION,
            'status':'FROZEN_B6D_CANDIDATE_BLIND_CURRENT_PLAYER_FV_SOURCE',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':source_commit,
            'source_files':source_files,
            'last_synced':load(LAST_SYNC),
            'draft_picks_included':False,
            'market_values_used':False,
            'human_outcomes_read':False,
            'v8_candidate_performance_read':False,
            'player_count':len(current_players),
            'ambiguous_normalized_name_exclusion_count':len(ambiguous_names),
            'ambiguous_normalized_names_excluded':sorted(ambiguous_names),
            'value_uncertainty_center_crosscheck':fv_crosscheck_summary,
            'rostered_count':sum(p['origin']=='rostered' for p in current_players),
            'active_free_agent_count':sum(p['origin']=='free_agent' for p in current_players),
            'position_counts':dict(sorted(pos_counts.items())),
            'old_v7_snapshot_player_count':len(old_keys),
            'overlap_with_old_v7_snapshot':len(new_keys & old_keys),
            'new_vs_old_v7_snapshot_count':len(new_keys-old_keys),
            'old_v7_players_not_in_current_source_count':len(old_keys-new_keys),
            'players':current_players,
          }
          snapshot['canonical_player_source_sha256']=canonical_sha(snapshot['players'])
          (OUT/'b6d_current_player_fv_snapshot.json').write_text(json.dumps(snapshot,indent=2,sort_keys=True)+'\n')

          # Candidate generation begins only after the current source snapshot is durable in /tmp.
          old=load(OLD_CATALOG)
          old_sigs=set()
          for ch in old['challenges']:
            old_sigs.add(canonical_trade([x['key'] for x in ch['side_A']['assets']],[x['key'] for x in ch['side_B']['assets']]))
          assert len(old_sigs)==40

          eligible=[dict(p) for p in current_players if int(p['fv'])>=MIN_PLAYER_FV and p['pos'] in POSITIONS]
          eligible.sort(key=lambda p:(int(p['fv']),p['key']))
          if len(eligible)<100:
            raise RuntimeError(f'too few FV-eligible players for source-frame build: {len(eligible)}')

          def nearest(source,desired,used):
            rows=[p for p in source if p['key'] not in used]
            rows.sort(key=lambda p:(abs(int(p['fv'])-desired),p['key']))
            return rows[:NEAREST_LIMIT]

          def make_side(rows,size):
            fvs=[int(p['fv']) for p in rows]
            total=sum(fvs)
            shares=[x/total for x in fvs]
            keys=tuple(sorted(p['key'] for p in rows))
            score=candidate_score(fvs)
            return {
              'keys':keys,'keyset':frozenset(keys),'raw':total,'score':score,
              'mult':score/total,'apex':max(fvs),'min_fv':min(fvs),
              'min_share':min(shares),'signature':canonical_side(keys),
            }

          def build_pool(size):
            source=[p for p in eligible if size!=2 or int(p['fv'])>=SIZE2_MIN_FV]
            out={}
            for anchor in source:
              for profile in SIDE_PROFILES[size]:
                goal=int(anchor['fv'])/profile[0]
                for variant in range(PROFILE_VARIANTS):
                  chosen=[anchor]; used={anchor['key']}
                  for i in range(1,size):
                    rows=nearest(source,goal*profile[i],used)
                    if not rows:
                      chosen=[]; break
                    idx=(variant*(2*i+1)+i*7)%len(rows)
                    pick=rows[idx]
                    chosen.append(pick); used.add(pick['key'])
                  if len(chosen)!=size: continue
                  side=make_side(chosen,size)
                  if side['raw']<SIDE_MIN_TOTAL[size] or side['apex']<4000 or side['min_share']<0.10-1e-12:
                    continue
                  if size==2 and side['min_fv']<SIZE2_MIN_FV:
                    continue
                  out.setdefault(side['signature'],side)
            return sorted(out.values(),key=lambda s:(s['raw'],s['signature']))

          pools={n:build_pool(n) for n in (2,3,4)}
          if any(not pools[n] for n in pools):
            raise RuntimeError(f"empty side pool sizes={ {n:len(pools[n]) for n in pools} }")

          def reservoir_add(heap,bysig,cand):
            import heapq
            sig=cand['trade_signature']
            if sig in bysig: return
            rank=h64(sig)
            item=(-rank,sig)
            if len(heap)<RESERVOIR_CAP_PER_TOPOLOGY:
              heapq.heappush(heap,item); bysig[sig]=cand
            elif item>heap[0]:
              _,old_sig=heapq.heapreplace(heap,item)
              bysig.pop(old_sig,None); bysig[sig]=cand

          def probe_positions(idx,a_signature):
            m=len(idx)
            cap=PER_ANCHOR_CANDIDATES*PROBE_MULTIPLIER
            if m<=cap:
              return idx.tolist()
            start=h64(a_signature)%m
            step=max(1,m//cap)
            out=[]; seen=set()
            for j in range(cap*3):
              z=int(idx[(start+j*step)%m])
              if z not in seen:
                seen.add(z); out.append(z)
                if len(out)>=cap: break
            return out

          def build_reservoir(topo):
            import heapq
            na,nb=map(int,topo.split('v'))
            A=pools[na]; B=pools[nb]
            order=np.argsort(np.asarray([s['raw'] for s in B],float),kind='stable')
            B=[B[int(i)] for i in order]
            b_raw=np.asarray([s['raw'] for s in B],float)
            b_score=np.asarray([s['score'] for s in B],float)
            Aorder=sorted(A,key=lambda s:(-abs(s['mult']-1.0),h64(s['signature'])))
            heap=[]; bysig={}; windows=0; raw_qual=0; shared_rej=0; old_rej=0; discordant_seen=0
            for a in Aorder:
              lo=np.searchsorted(b_raw,RAW_RATIO_MIN*a['raw'],side='left')
              hi=np.searchsorted(b_raw,a['raw']/RAW_RATIO_MIN,side='right')
              if hi<=lo: continue
              rr=b_raw[lo:hi]; ss=b_score[lo:hi]
              case1=(rr <= (1.0-FAIR)*a['raw']+1e-12) & (ss >= a['score']/(1.0-FAIR)-1e-12)
              case2=(rr >= a['raw']/(1.0-FAIR)-1e-12) & (ss <= (1.0-FAIR)*a['score']+1e-12)
              idx=np.flatnonzero(case1|case2); windows+=1
              if idx.size==0: continue
              accepted_for_anchor=0
              for local_z in probe_positions(idx,a['signature']):
                b=B[lo+int(local_z)]
                raw_qual+=1
                if a['keyset'] & b['keyset']:
                  shared_rej+=1; continue
                sig=canonical_trade(a['keys'],b['keys'])
                if sig in old_sigs:
                  old_rej+=1; continue
                raw_side,raw_margin=verdict(a['raw'],b['raw'])
                v9_side,v9_margin=verdict(a['score'],b['score'])
                if raw_side is None or v9_side is None or raw_side==v9_side:
                  continue
                discordant_seen+=1
                cand={
                  'topology':topo,
                  'trade_signature':sig,
                  'trade_hash':hashlib.sha256(sig.encode()).hexdigest(),
                  'player_keys':tuple(sorted(a['keyset']|b['keyset'])),
                  'side_signatures':tuple(sorted((a['signature'],b['signature']))),
                  'strength_bucket':strength_bucket(min(raw_margin,v9_margin)),
                  'raw_margin':float(raw_margin),
                  'v9_margin':float(v9_margin),
                }
                reservoir_add(heap,bysig,cand)
                accepted_for_anchor+=1
                if accepted_for_anchor>=PER_ANCHOR_CANDIDATES:
                  break
            rows=sorted(bysig.values(),key=lambda c:c['trade_hash'])
            return rows,{
              'topology':topo,
              'reservoir_count':len(rows),
              'search_windows_examined':windows,
              'probed_qualifying_pairs':raw_qual,
              'discordant_candidates_seen_before_reservoir_hash_cap':discordant_seen,
              'shared_player_rejections':shared_rej,
              'v8_overlap_rejections':old_rej,
              'distinct_players_in_reservoir':len({p for c in rows for p in c['player_keys']}),
              'distinct_side_bundles_in_reservoir':len({s for c in rows for s in c['side_signatures']}),
              'strength_counts':dict(Counter(c['strength_bucket'] for c in rows)),
            }

          reservoirs={}; reservoir_rows=[]
          for topo in FIVE:
            reservoirs[topo],row=build_reservoir(topo)
            reservoir_rows.append(row)

          all_cands=[c for topo in FIVE for c in reservoirs[topo]]

          def caps_for(scope,target):
            return {
              'per_topology_player_cap':int(round(.20*target)),
              'global_player_cap':int(round(.10*target*len(scope))),
              'side_reuse_cap':int(round(.05*target)),
            }

          def classify_result(res):
            has_incumbent=bool(res.x is not None and np.all(np.isfinite(res.x)))
            if has_incumbent:
              return 'FEASIBLE'
            if int(res.status)==2:
              return 'PROVEN_INFEASIBLE'
            if int(res.status)==1:
              return 'UNKNOWN_TIMEOUT'
            return 'UNKNOWN_OTHER'

          def solve(scope,target):
            scope=list(scope)
            selected_pool=[c for c in all_cands if c['topology'] in scope]
            counts=Counter(c['topology'] for c in selected_pool)
            if any(counts[t]<target for t in scope):
              return {
                'scope':scope,'target_per_topology':target,'outcome':'INFEASIBLE_WITHIN_PREREGISTERED_SEARCH_FRAME',
                'feasible':False,'proven_infeasible':True,'solver_status':None,
                'proof_scope':'preregistered_search_frame_only',
                'reason':'one or more preregistered topology reservoirs contain fewer candidates than target',
                'reservoir_counts':dict(counts),'caps':caps_for(scope,target),
              }

            cands=selected_pool; N=len(cands); caps=caps_for(scope,target)
            idx_by_topo=defaultdict(list); idx_by_tp=defaultdict(list); idx_by_player=defaultdict(list); idx_by_tside=defaultdict(list)
            for i,c in enumerate(cands):
              t=c['topology']; idx_by_topo[t].append(i)
              for p in c['player_keys']:
                idx_by_tp[(t,p)].append(i); idx_by_player[p].append(i)
              for s in c['side_signatures']:
                idx_by_tside[(t,s)].append(i)

            row=[]; col=[]; data=[]; lb=[]; ub=[]; r=0
            def add(indices,lo,hi):
              nonlocal r
              for j in indices:
                row.append(r); col.append(j); data.append(1.0)
              lb.append(float(lo)); ub.append(float(hi)); r+=1

            for t in scope: add(idx_by_topo[t],target,target)
            for inds in idx_by_tp.values(): add(inds,-np.inf,caps['per_topology_player_cap'])
            for inds in idx_by_player.values(): add(inds,-np.inf,caps['global_player_cap'])
            for inds in idx_by_tside.values():
              if len(inds)>caps['side_reuse_cap']:
                add(inds,-np.inf,caps['side_reuse_cap'])

            A=coo_matrix((data,(row,col)),shape=(r,N)).tocsr()
            lc=LinearConstraint(A,np.asarray(lb),np.asarray(ub))
            # Pure feasibility problem. A zero objective makes every feasible incumbent optimal;
            # do not spend solver time proving an irrelevant hash-ranked optimum.
            objective=np.zeros(N,dtype=float)
            res=milp(
              objective,
              integrality=np.ones(N,dtype=int),
              bounds=Bounds(np.zeros(N),np.ones(N)),
              constraints=lc,
              options={'time_limit':JOINT_TIME_LIMIT_SECONDS,'presolve':True},
            )
            outcome=classify_result(res)
            if outcome.startswith('UNKNOWN'):
              raise RuntimeError(f'B6D unresolved MILP scope={scope} target={target} status={res.status} message={res.message}')
            out={
              'scope':scope,'target_per_topology':target,'caps':caps,
              'outcome':outcome,'feasible':outcome=='FEASIBLE','proven_infeasible':outcome.startswith('PROVEN_INFEASIBLE'),
              'solver_status':int(res.status),'solver_message':str(res.message),
              'variable_count':N,'constraint_count':r,'time_limit_seconds':JOINT_TIME_LIMIT_SECONDS,
            }
            if outcome!='FEASIBLE':
              return out

            chosen=[cands[i] for i,x in enumerate(res.x) if x>0.5]
            expected=target*len(scope)
            if len(chosen)!=expected:
              raise RuntimeError(f'feasible incumbent selected {len(chosen)} != expected {expected}')
            per_topo=Counter(c['topology'] for c in chosen)
            assert all(per_topo[t]==target for t in scope)
            global_pc=Counter(); topo_pc=defaultdict(Counter); side_count=defaultdict(Counter)
            for c in chosen:
              t=c['topology']
              for p in c['player_keys']:
                global_pc[p]+=1; topo_pc[t][p]+=1
              for s in c['side_signatures']:
                side_count[t][s]+=1
            assert max(global_pc.values())<=caps['global_player_cap']
            assert max(max(v.values()) for v in topo_pc.values())<=caps['per_topology_player_cap']
            assert max(max(v.values()) for v in side_count.values())<=caps['side_reuse_cap']
            out['witness_summary']={
              'challenge_identities_written_durably':False,
              'selected_total':len(chosen),
              'distinct_players_global':len(global_pc),
              'max_player_appearances_global':max(global_pc.values()),
              'topologies':{
                t:{
                  'selected_challenges':target,
                  'distinct_players':len(topo_pc[t]),
                  'max_player_appearances':max(topo_pc[t].values()),
                  'distinct_side_bundles':len(side_count[t]),
                  'max_exact_side_bundle_reuse':max(side_count[t].values()),
                } for t in scope
              },
            }
            return out

          feasibility={'five_topology':{},'four_topology_drop_2v4':{}}
          # Run the decisive 240/topology gates first; 120/180 remain diagnostics only.
          for target in SOLVE_ORDER:
            feasibility['five_topology'][str(target)]=solve(FIVE,target)
            feasibility['four_topology_drop_2v4'][str(target)]=solve(FOUR,target)

          five_auth=feasibility['five_topology'][str(AUTHORIZATION_TARGET)]['feasible']
          four_auth=feasibility['four_topology_drop_2v4'][str(AUTHORIZATION_TARGET)]['feasible']
          if five_auth:
            decision='PASS_FIVE_TOPOLOGY_CURRENT_SOURCE_240_TIER_C_RATE_FEASIBLE'
            final_scope=FIVE
            v1_7_only=['2v2']
            scope_change='NONE_KEEP_FIVE'
            b7_authorized=True
          elif four_auth:
            decision='PASS_FOUR_TOPOLOGY_SCOPE_AMENDMENT_DROP_2V4_240_TIER_C_RATE_FEASIBLE'
            final_scope=FOUR
            v1_7_only=['2v2','2v4']
            scope_change='DROP_2V4_TO_V1_7_FOR_V9'
            b7_authorized=True
          else:
            decision='STOP_CURRENT_SOURCE_AND_FOUR_TOPOLOGY_SCOPE_CANNOT_SUPPORT_240_TIER_C_RATE'
            final_scope=None
            v1_7_only=None
            scope_change='NO_AUTHORIZED_SCOPE'
            b7_authorized=False

          source_audit={
            'analysis_version':VERSION,
            'status':'PASS_B6D_CANDIDATE_BLIND_CURRENT_SOURCE_AUDIT_ONLY',
            'source_commit':source_commit,
            'current_snapshot_player_count':len(current_players),
            'eligible_player_count_fv_ge_2500':len(eligible),
            'old_v7_snapshot_player_count':len(old_keys),
            'overlap_with_old_v7_snapshot':len(new_keys & old_keys),
            'new_vs_old_v7_snapshot_count':len(new_keys-old_keys),
            'old_v7_players_not_in_current_source_count':len(old_keys-new_keys),
            'position_counts':dict(sorted(pos_counts.items())),
            'ambiguous_normalized_name_exclusion_count':len(ambiguous_names),
            'ambiguous_normalized_names_excluded':sorted(ambiguous_names),
            'value_uncertainty_center_crosscheck':fv_crosscheck_summary,
            'side_pool_sizes':{str(n):len(pools[n]) for n in pools},
            'reservoir_rows':reservoir_rows,
            'candidate_identities_written_durably':False,
            'human_outcomes_read':False,
          }
          feas_out={
            'analysis_version':VERSION,
            'status':'PASS_B6D_SOURCE_SCOPE_FEASIBILITY_AUDIT_ONLY',
            'decision':decision,
            'target_grid_per_topology':TARGET_GRID,
            'authorization_target_per_topology':AUTHORIZATION_TARGET,
            'tier_c_rate_contract':protocol['diversity_contract'],
            'five_topology_scope':FIVE,
            'four_topology_scope_if_2v4_dropped':FOUR,
            'results':feasibility,
            'final_scope_if_pass':final_scope,
            'v1_7_only_topologies_if_pass':v1_7_only,
            'challenge_identities_written_durably':False,
          }
          manifest={
            'analysis_version':VERSION,
            'status':'PASS_B6D_CURRENT_SOURCE_EXPANSION_AND_SCOPE_AMENDMENT_COMPLETE',
            'decision':decision,
            'source_snapshot_frozen':True,
            'source_commit':source_commit,
            'source_player_count':len(current_players),
            'eligible_player_count':len(eligible),
            'candidate_formula_unchanged':True,
            'q':Q,'theta_min':THETA_MIN,'fair_band':FAIR,'familywise_alpha':FWER_ALPHA,
            'tier_c_rate_contract_preserved':True,
            'authorization_capacity_target_per_topology':AUTHORIZATION_TARGET,
            'scope_change':scope_change,
            'v9_eligible_topologies':final_scope,
            'v1_7_only_topologies':v1_7_only,
            'b7_authorized':b7_authorized,
            'b7_requirement':'Independent high-rep operating-characteristic confirmation must prospectively gate per-topology power and harmful-activation FWER over exactly the frozen retained topology family before any human catalog is generated.',
            'human_catalog_generated':False,
            'human_voting_authorized':False,
            'human_outcomes_exist_or_were_read':False,
            'v8_candidate_performance_read':False,
            'production_change_authorized':False,
          }

          report=[]
          report.append('# Package Adjustment V9 — B6D Candidate-Blind Current-Source Expansion and Scope Amendment')
          report.append('')
          report.append(f'**Decision:** `{decision}`')
          report.append('')
          report.append('B6D is the prospective amendment required by B6C. It does not weaken q, theta_min=.60, the 7% fair band, Holm FWER=.05, or the Tier-C concentration rates.')
          report.append('')
          report.append('## Current candidate-blind source freeze')
          report.append(f'- Source commit: `{source_commit}`')
          report.append(f'- Current matched player source: **{len(current_players)}** players')
          report.append(f'- FV >= 2500 candidate-frame players: **{len(eligible)}**')
          report.append(f'- Old V7 source: {len(old_keys)} players; overlap {len(new_keys & old_keys)}; new current-source players {len(new_keys-old_keys)}; old-only {len(old_keys-new_keys)}.')
          report.append('- Source = current rostered players (excluding explicit Retired status) plus active league free agents; current runtime index.html FV is authoritative.')
          report.append(f"- value_uncertainty center-value cross-check is diagnostic only: artifact generated {vu.get('generated_at_utc')}; {len(fv_mismatches)} shared-player center mismatches; max absolute delta {fv_crosscheck_summary['max_abs_delta']}.")
          report.append(f'- Ambiguous normalized-name exclusions: **{len(ambiguous_names)}**; collisions are excluded rather than merged.')
          report.append('- QB/RB/WR/TE/DL/LB/DB scope is continuous with V7; IDP is not newly introduced by B6D.')
          report.append('- No draft picks and no market values are used.')
          report.append('')
          report.append('## Discordant breadth reservoirs')
          report.append('| Topology | Reservoir | Distinct players | Distinct sides | Discordant seen before cap |')
          report.append('|---|---:|---:|---:|---:|')
          for r in reservoir_rows:
            report.append(f"| {r['topology']} | {r['reservoir_count']} | {r['distinct_players_in_reservoir']} | {r['distinct_side_bundles_in_reservoir']} | {r['discordant_candidates_seen_before_reservoir_hash_cap']} |")
          report.append('')
          report.append('## Tier-C-rate feasibility')
          report.append('| Scope | Target/topology | Per-topology player cap | Global player cap | Side reuse cap | Feasible |')
          report.append('|---|---:|---:|---:|---:|---|')
          for label in ('five_topology','four_topology_drop_2v4'):
            for target in TARGET_GRID:
              x=feasibility[label][str(target)]; caps=x['caps']
              report.append(f"| {label} | {target} | {caps['per_topology_player_cap']} | {caps['global_player_cap']} | {caps['side_reuse_cap']} | {'yes' if x['feasible'] else 'no'} |")
          report.append('')
          report.append('## Prospective scope decision')
          if b7_authorized:
            report.append(f"- Frozen B7 V9 topology family: `{', '.join(final_scope)}`")
            report.append(f"- V1.7-only topology family: `{', '.join(v1_7_only)}`")
            report.append('- B7 is authorized as an **independent operating-characteristic confirmation only**. Human voting and human catalog generation remain unauthorized.')
          else:
            report.append('- B7 remains blocked. Do not generate a V9 human catalog.')
          report.append('')
          report.append('## Firewall')
          report.append('- No V9 human outcomes exist or are read.')
          report.append('- No V8 candidate performance is read.')
          report.append('- No selected challenge identities are written durably; MILP witnesses remain transient.')
          report.append('- Production Package Adjustment V1.7 is unchanged.')

          (OUT/'b6d_source_expansion_audit.json').write_text(json.dumps(source_audit,indent=2,sort_keys=True)+'\n')
          (OUT/'b6d_scope_capacity_feasibility.json').write_text(json.dumps(feas_out,indent=2,sort_keys=True)+'\n')
          (OUT/'b6d_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          (OUT/'b6d_report.md').write_text('\n'.join(report)+'\n')

          names=[
            'b6d_preregistered_source_scope_protocol.json',
            'b6d_current_player_fv_snapshot.json',
            'b6d_source_expansion_audit.json',
            'b6d_scope_capacity_feasibility.json',
            'b6d_manifest.json',
            'b6d_report.md',
          ]
          hashes={name:sha256_file(OUT/name) for name in names}
          (OUT/'b6d_output_hashes.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')

          print(json.dumps({
            'decision':decision,
            'source_player_count':len(current_players),
            'eligible_player_count':len(eligible),
            'reservoir_counts':{r['topology']:r['reservoir_count'] for r in reservoir_rows},
            'five_240_feasible':five_auth,
            'four_240_feasible':four_auth,
            'final_scope':final_scope,
            'b7_authorized':b7_authorized,
          },indent=2))
          PY2

          python3 /tmp/package-adjustment-v9-b6d/analyze_b6d.py

      - name: Validate B6D durable decision contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import json
          from pathlib import Path
          D=Path('/tmp/package-adjustment-v9-b6d')
          load=lambda n: json.loads((D/n).read_text())
          p=load('b6d_preregistered_source_scope_protocol.json')
          s=load('b6d_current_player_fv_snapshot.json')
          a=load('b6d_source_expansion_audit.json')
          f=load('b6d_scope_capacity_feasibility.json')
          m=load('b6d_manifest.json')

          assert p['q']==m['q']==2.9897594788655337
          assert p['theta_min']==m['theta_min']==0.60
          assert p['fair_band']==m['fair_band']==0.07
          assert p['familywise_alpha']==m['familywise_alpha']==0.05
          assert p['human_catalog_generated'] is False
          assert p['human_voting_authorized'] is False
          assert p['human_outcomes_read'] is False
          assert m['human_catalog_generated'] is False
          assert m['human_voting_authorized'] is False
          assert m['human_outcomes_exist_or_were_read'] is False
          assert m['v8_candidate_performance_read'] is False
          assert m['production_change_authorized'] is False
          assert m['source_snapshot_frozen'] is True
          assert s['source_commit']==m['source_commit']
          assert s['draft_picks_included'] is False
          assert s['market_values_used'] is False
          assert s['human_outcomes_read'] is False
          assert a['candidate_identities_written_durably'] is False
          assert f['challenge_identities_written_durably'] is False

          allowed={
            'PASS_FIVE_TOPOLOGY_CURRENT_SOURCE_240_TIER_C_RATE_FEASIBLE',
            'PASS_FOUR_TOPOLOGY_SCOPE_AMENDMENT_DROP_2V4_240_TIER_C_RATE_FEASIBLE',
            'STOP_CURRENT_SOURCE_AND_FOUR_TOPOLOGY_SCOPE_CANNOT_SUPPORT_240_TIER_C_RATE',
          }
          assert m['decision'] in allowed
          five=f['results']['five_topology']['240']['feasible']
          four=f['results']['four_topology_drop_2v4']['240']['feasible']
          if m['decision']=='PASS_FIVE_TOPOLOGY_CURRENT_SOURCE_240_TIER_C_RATE_FEASIBLE':
            assert five is True
            assert m['v9_eligible_topologies']==['2v3','2v4','3v3','3v4','4v4']
            assert m['v1_7_only_topologies']==['2v2']
            assert m['b7_authorized'] is True
          elif m['decision']=='PASS_FOUR_TOPOLOGY_SCOPE_AMENDMENT_DROP_2V4_240_TIER_C_RATE_FEASIBLE':
            assert five is False and four is True
            assert m['v9_eligible_topologies']==['2v3','3v3','3v4','4v4']
            assert m['v1_7_only_topologies']==['2v2','2v4']
            assert m['b7_authorized'] is True
          else:
            assert five is False and four is False
            assert m['v9_eligible_topologies'] is None
            assert m['b7_authorized'] is False
          print('PASS: B6D source freeze, scope fork, no-outcomes firewall, and B7 authorization contract validated.')
          PY3

      - name: Preserve B6D outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6d-v3-outputs
          path: /tmp/package-adjustment-v9-b6d/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit durable B6D record
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment"

          # The scientific source lineage is the source_commit frozen in the B6D manifest.
          # A later unrelated main update may be rebased underneath the output commit without
          # changing the source data B6D actually analyzed.
          SRC_COMMIT="$(python3 -c "import json;print(json.load(open('/tmp/package-adjustment-v9-b6d/b6d_manifest.json'))['source_commit'])")"
          test "$SRC_COMMIT" = "$(git rev-parse HEAD)" || {
            echo "ERROR: manifest source_commit does not match the checked-out analysis source."
            exit 1
          }
          test ! -e "$DEST" || { echo "ERROR: B6D durable directory already exists in checkout."; exit 1; }

          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b6d/b6d_preregistered_source_scope_protocol.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6d/b6d_current_player_fv_snapshot.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6d/b6d_source_expansion_audit.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6d/b6d_scope_capacity_feasibility.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6d/b6d_manifest.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6d/b6d_report.md "$DEST/"
          cp /tmp/package-adjustment-v9-b6d/b6d_output_hashes.json "$DEST/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Record Package Adjustment V9 B6D source expansion and scope amendment V2"

          for attempt in 1 2 3; do
            git fetch origin main
            if git cat-file -e "origin/main:$DEST/b6d_manifest.json" 2>/dev/null; then
              echo "ERROR: B6D durable directory appeared on main during this run; refusing to overwrite a one-shot result."
              exit 1
            fi
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ERROR: push failed after 3 attempts; B6D outputs are preserved in the b6d-v3-outputs artifact."
          exit 1

      - name: Final status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY4'
          import json
          from pathlib import Path
          p=Path('research/package-adjustment-v9/b6d-current-source-expansion-scope-amendment/b6d_manifest.json')
          m=json.loads(p.read_text())
          print('B6D DECISION:',m['decision'])
          print('B7 AUTHORIZED:',m['b7_authorized'])
          print('V9 ELIGIBLE TOPOLOGIES:',m['v9_eligible_topologies'])
          print('V1.7-ONLY TOPOLOGIES:',m['v1_7_only_topologies'])
          print('SOURCE PLAYER COUNT:',m['source_player_count'])
          print('PRODUCTION CHANGE AUTHORIZED:',m['production_change_authorized'])
          PY4
