name: Free Agent Utility V1 - Phase 1 Private 4for4 Shadow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  private-fourforfour-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
      FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}
      FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
      FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
      FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Pin preregistered Phase 1 code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = "50578ae5b0b10c093d9f11215251fb7fdf3ff091"
          test "$(git hash-object research/free-agent-utility-v1/phase1_preregistration.json)" = "c54bde014bade87e46e40f959e142fda2c643334"
          test ! -e research/free-agent-utility-v1/phase1_shadow_summary.json
          test ! -e research/free-agent-utility-v1/phase1_shadow_summary.md

      - name: Self-test Phase 1 study
        shell: bash
        run: |
          set -euo pipefail
          python3 research/free-agent-utility-v1/free_agent_utility_v1_phase1.py --selftest

      - name: Decode private 4for4 sources outside repository
        shell: bash
        run: |
          set -euo pipefail

          for var in \
            FOURFORFOUR_OFFENSE_GZ_B64_PART1 \
            FOURFORFOUR_OFFENSE_GZ_B64_PART2 \
            FOURFORFOUR_OFFENSE_GZ_B64_PART3 \
            FOURFORFOUR_DL_GZ_B64 \
            FOURFORFOUR_LB_GZ_B64 \
            FOURFORFOUR_DB_GZ_B64
          do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: required GitHub Actions secret $var is missing or empty." >&2
              exit 1
            fi
          done

          install -d -m 700 /tmp/log-free-agent-utility-v1/input

          printf '%s%s%s' \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1/input/offense.csv

          printf '%s' "$FOURFORFOUR_DL_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" | base64 --decode | gzip -dc \
            > /tmp/log-free-agent-utility-v1/input/db.csv

          chmod 600 /tmp/log-free-agent-utility-v1/input/*.csv

      - name: Run preregistered private shadow
        shell: bash
        run: |
          set -euo pipefail
          python3 research/free-agent-utility-v1/free_agent_utility_v1_phase1.py \
            --offense /tmp/log-free-agent-utility-v1/input/offense.csv \
            --dl /tmp/log-free-agent-utility-v1/input/dl.csv \
            --lb /tmp/log-free-agent-utility-v1/input/lb.csv \
            --db /tmp/log-free-agent-utility-v1/input/db.csv \
            --write

      - name: Validate aggregate-only output contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("research/free-agent-utility-v1/phase1_shadow_summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["status"] == "PASS_PHASE1_PRIVATE_SHADOW_COMPLETE"
          assert d["research_only"] is True
          assert d["production_changes"] is False
          assert d["production_authorized"] is False
          assert d["realized_outcomes_read"] is False
          assert d["private_row_level_4for4_output_persisted"] is False
          assert d["player_level_derived_4for4_output_persisted"] is False
          assert d["methodology"]["primary_fourforfour_weight"] == 0.25

          forbidden_top_level = {
              "rows", "players", "player_rows", "player_scores",
              "provider_rows", "fourforfour_rows"
          }
          assert not (forbidden_top_level & set(d))

          def walk(obj, path=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      lk = str(k).lower()
                      if lk in {
                          "player_name", "sleeper_id", "provider_rank",
                          "fourforfour_rank", "fourforfour_points"
                      }:
                          raise RuntimeError(f"forbidden player-level field at {path}/{k}")
                      walk(v, f"{path}/{k}")
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      walk(v, f"{path}/{i}")

          walk(d)
          print("PASS: persisted output is aggregate-only.")
          PY

      - name: Run repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove production remained untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html free-agent-board.html
          git diff --exit-code -- scripts/model scripts/sync scripts/validation
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_free_agent_valuation_parity.py

      - name: Guard exact write scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              "research/free-agent-utility-v1/phase1_shadow_summary.json",
              "research/free-agent-utility-v1/phase1_shadow_summary.md",
          }
          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = {line[3:] for line in out.splitlines() if line.strip()}
          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit("Unexpected Phase 1 changes: " + ", ".join(unexpected))
          if touched != allowed:
              raise SystemExit(
                  f"Expected exactly two Phase 1 outputs; got {sorted(touched)}"
              )
          print("PASS: exact Phase 1 write scope.")
          PY

      - name: Commit aggregate Phase 1 shadow only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/free-agent-utility-v1/phase1_shadow_summary.json \
            research/free-agent-utility-v1/phase1_shadow_summary.md

          git pull --rebase --autostash origin main
          python3 scripts/validation/repo_regression_checks.py
          git diff --cached --exit-code -- index.html free-agent-board.html

          git commit -m "Freeze Free Agent Utility V1 Phase 1 shadow"
          git push origin HEAD:main

      - name: Destroy private provider inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/log-free-agent-utility-v1
          echo "PASS: private 4for4 inputs destroyed."
