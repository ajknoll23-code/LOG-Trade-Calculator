name: B6B Package Adjustment V9 - Five-Topology Discordant Catalog Diversity Feasibility Audit

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b6b-five-topology-diversity-feasibility
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B6B_ANALYSIS_VERSION: "package-adjustment-v9-b6b-five-topology-diversity-feasibility-v1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" \
            "scipy==1.16.2"

      - name: Guard exact B6 and B6A lineage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json"]="8fb47e28595bed2b667ed8a6e29cbe9d52aaf670"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_preregistered_protocol.json"]="0beffd4b2455a6e101acf3523d09955fa82eb77f"
            ["research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json"]="81cee2e1242ee05259cb68639efad80c704647f9"
            ["research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_discrete_supply_audit.json"]="41589ccb2312682420edbe2cec8d348a874aba82"
            ["research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_preregistered_supply_protocol.json"]="77d5797773ec5895e23241e1abffb7f0f8b52af1"
            ["research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_report.md"]="44001092a0aadf5defd253b6918a33cb4346c78a"
            ["research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_structural_feasibility.json"]="7ee88795cc27d9fccfaee439ceb33f561e9636d1"
            ["research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_supply_manifest.json"]="a271b9e3cf77e318bc7235be2fa9433b36e3c308"
            ["research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json"]="945bfb8f504bf62cba46464e1940126fd7a528e8"
            ["research/package-adjustment-v8/development_catalog_v1.json"]="6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
            ["research/package-adjustment-v8/generate_development_catalog_v1.py"]="eaf39ecb21acaafa71fc393f2ed4c8b497bf12d0"
            ["research/package-adjustment-v6/production_candidate_v1.json"]="9abaf2c01890da3abb0d13ae4d57cb37b91a08e2"
            ["scripts/validation/check_package_adjustment_live.py"]="3c924d762f93fd93b9943afe090deda6a2b7d8a0"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: durable source drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 scripts/validation/check_package_adjustment_live.py

          python3 - <<'PY1'
          import json
          from pathlib import Path
          load=lambda p: json.loads(Path(p).read_text())
          b6=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_screen_manifest.json')
          freeze=load('research/package-adjustment-v9/b6-discordance-information-limit/b6_candidate_and_estimand_freeze.json')
          b6a=load('research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_supply_manifest.json')
          supply=load('research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_discrete_supply_audit.json')
          structural=load('research/package-adjustment-v9/b6a-targeted-discordance-supply/b6a_structural_feasibility.json')
          snap=load('research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json')
          assert b6['decision']=='PASS_PREFERRED_BURDEN_FEASIBLE'
          assert b6['status']=='PASS_B6_TOPOLOGY_SPECIFIC_DISCORDANCE_INFORMATION_LIMIT_AUDIT_ONLY'
          assert b6['v9_human_catalog_generated'] is False
          assert b6['v9_human_outcomes_exist_or_were_read'] is False
          assert freeze['candidate_id']=='V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q'
          assert abs(float(freeze['q'])-2.9897594788655337)<1e-15
          assert abs(float(freeze['theta_min'])-.60)<1e-15
          assert abs(float(freeze['fair_band_relative_difference'])-.07)<1e-15
          assert b6a['decision']=='CONDITIONAL_SOURCE_SPACE_FEASIBLE_BUT_FROZEN_SNAPSHOT_SHORTFALL'
          assert b6a['all_topologies_structurally_possible'] is True
          assert b6a['v9_human_catalog_generated'] is False
          assert b6a['v9_human_outcomes_exist_or_were_read'] is False
          assert structural['all_topologies_structurally_possible'] is True
          rows={r['topology']:r for r in supply['rows']}
          assert rows['2v2']['qualifying_unique_trade_count_lower_bound']==0
          for t in ['2v3','2v4','3v3','3v4','4v4']:
            assert rows[t]['qualifying_unique_trade_count_lower_bound']>=600
          assert snap['player_count']==472
          assert snap['draft_picks_included'] is False
          assert snap['market_values_used'] is False
          print('PASS: exact B6 statistical PASS, B6A conditional source result, five-topology abundant supply, and zero-supply 2v2 bottleneck guarded.')
          PY1

      - name: Run five-topology catalog diversity feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b6b
          mkdir -p /tmp/package-adjustment-v9-b6b
          cat > /tmp/package-adjustment-v9-b6b/analyze_b6b.py <<'PY2'
          from __future__ import annotations
          import hashlib, heapq, json, math, os
          from collections import Counter, defaultdict
          from itertools import combinations
          from pathlib import Path
          import numpy as np
          from scipy.optimize import Bounds, LinearConstraint, milp
          from scipy.sparse import coo_matrix
          
          ROOT=Path('.')
          OUT=Path(os.environ.get('B6B_OUT','/tmp/package-adjustment-v9-b6b'))
          OUT.mkdir(parents=True,exist_ok=True)
          VERSION=os.environ.get('B6B_ANALYSIS_VERSION','package-adjustment-v9-b6b-five-topology-diversity-feasibility-v1')
          B6=ROOT/'research/package-adjustment-v9/b6-discordance-information-limit'
          B6A=ROOT/'research/package-adjustment-v9/b6a-targeted-discordance-supply'
          V7=ROOT/'research/package-adjustment-v7'
          V8=ROOT/'research/package-adjustment-v8'
          
          ALL_TOPOLOGIES=['2v2','2v3','2v4','3v3','3v4','4v4']
          TOPOLOGIES=['2v3','2v4','3v3','3v4','4v4']
          FALLBACK_TOPOLOGY='2v2'
          Q=2.9897594788655337
          FAIR=0.07
          THETA_MIN=0.60
          FWER_ALPHA=0.05
          RAW_RATIO_MIN=0.75
          TARGET=120
          VOTERS=30
          BALLOTS_PER_TOPOLOGY_PER_VOTER=4
          TOTAL_BALLOTS=TARGET*len(TOPOLOGIES)
          MIN_PLAYER_FV=2500
          SIZE2_MIN_FV=3000
          SIDE_MIN_TOTAL={2:7000,3:9000,4:11500}
          SIDE_PROFILES={
            2:[(0.50,0.50),(0.60,0.40),(0.70,0.30)],
            3:[(0.34,0.33,0.33),(0.45,0.33,0.22),(0.55,0.30,0.15),(0.65,0.20,0.15)],
            4:[(0.25,0.25,0.25,0.25),(0.35,0.28,0.22,0.15),(0.45,0.25,0.18,0.12),(0.55,0.18,0.15,0.12)],
          }
          NEAREST_LIMIT=40
          PROFILE_VARIANTS=24
          PER_ANCHOR_CANDIDATES=8
          RESERVOIR_CAP_PER_TOPOLOGY=2000
          SIDE_REUSE_CAP=6
          DIVERSITY_TIERS=[
            {'id':'A','label':'preferred','max_player_per_topology':12,'max_player_global':30},
            {'id':'B','label':'moderate','max_player_per_topology':18,'max_player_global':45},
            {'id':'C','label':'minimum','max_player_per_topology':24,'max_player_global':60},
          ]
          
          
          def load(p): return json.loads(Path(p).read_text())
          def canonical_side(keys): return '|'.join(sorted(keys))
          def canonical_trade(a,b): return '||'.join(sorted((canonical_side(a),canonical_side(b))))
          def h64(s): return int(hashlib.sha256(s.encode()).hexdigest()[:16],16)
          def sha256_bytes(b): return hashlib.sha256(b).hexdigest()
          def candidate_score(fvs):
            n=len(fvs)
            return (n**(1.0-1.0/Q))*(sum(float(v)**Q for v in fvs)**(1.0/Q))
          def verdict(a,b):
            hi=max(float(a),float(b),1.0)
            d=abs(float(a)-float(b))/hi
            if d < FAIR-1e-15: return None,d
            return ('A' if a>b else 'B'),d
          
          def bucket(x):
            if x<.10: return '7-10%'
            if x<.15: return '10-15%'
            return '15%+'
          
          b6=load(B6/'b6_screen_manifest.json')
          freeze=load(B6/'b6_candidate_and_estimand_freeze.json')
          b6a=load(B6A/'b6a_supply_manifest.json')
          b6a_supply=load(B6A/'b6a_discrete_supply_audit.json')
          snap=load(V7/'phase1a_player_fv_snapshot_v1.json')
          old=load(V8/'development_catalog_v1.json')
          assert b6['decision']=='PASS_PREFERRED_BURDEN_FEASIBLE'
          assert b6a['decision']=='CONDITIONAL_SOURCE_SPACE_FEASIBLE_BUT_FROZEN_SNAPSHOT_SHORTFALL'
          assert b6a['all_topologies_structurally_possible'] is True
          rows0={r['topology']:r for r in b6a_supply['rows']}
          assert rows0['2v2']['qualifying_unique_trade_count_lower_bound']==0
          for t in TOPOLOGIES:
            assert rows0[t]['qualifying_unique_trade_count_lower_bound']>=600
          assert freeze['candidate_id']=='V9_SCALE_COHERENT_NORMALIZED_LQ_V6_Q'
          assert abs(float(freeze['q'])-Q)<1e-15
          assert abs(float(freeze['theta_min'])-THETA_MIN)<1e-15
          assert abs(float(freeze['fair_band_relative_difference'])-FAIR)<1e-15
          assert len(snap['players'])==472
          
          # Prospective five-topology scope amendment. This is based only on source-space
          # geometry/supply, not on human outcomes or V8 candidate performance.
          SCOPE={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B6B_FIVE_TOPOLOGY_SCOPE_AMENDMENT',
            'v9_eligible_topologies':TOPOLOGIES,
            'hard_fallback_topologies':[FALLBACK_TOPOLOGY],
            'fallback_behavior':'2v2 remains production Package Adjustment V1.7 / raw-FV fail-closed behavior; V9 makes no production claim for 2v2.',
            'rationale':'B6A found zero discrete 2v2 V9-vs-V1.7 opposite non-fair verdicts in the broad frozen 472-player pre-V8 snapshot, while each other topology had at least 600. B6A separately established that 2v2 reversal is mathematically possible, so this is a source-space/product-scope amendment, not an efficacy conclusion.',
            'candidate_id':freeze['candidate_id'],
            'q':Q,
            'theta_min':THETA_MIN,
            'fair_band':FAIR,
            'familywise_alpha':FWER_ALPHA,
            'future_multiplicity':'Holm step-down across exactly the five V9-eligible topologies; B7 must independently confirm operating characteristics under this five-hypothesis family.',
            'human_outcomes_used':False,
            'v8_candidate_performance_used':False,
            'production_change_authorized':False,
            'change_requires_new_amendment':True,
          }
          
          PROTOCOL={
            'analysis_version':VERSION,
            'status':'PREREGISTERED_B6B_CATALOG_DIVERSITY_FEASIBILITY_ONLY',
            'scope_amendment_status':SCOPE['status'],
            'eligible_topologies':TOPOLOGIES,
            'fallback_topology':FALLBACK_TOPOLOGY,
            'target_unique_challenges_per_topology':TARGET,
            'target_total_challenges':TOTAL_BALLOTS,
            'future_voters':VOTERS,
            'future_ballots_per_voter':TOTAL_BALLOTS//VOTERS,
            'future_ballots_per_topology_per_voter':BALLOTS_PER_TOPOLOGY_PER_VOTER,
            'future_votes_per_challenge':1,
            'candidate_id':freeze['candidate_id'],
            'q':Q,
            'theta_min':THETA_MIN,
            'fair_band':FAIR,
            'familywise_alpha':FWER_ALPHA,
            'source_snapshot':'research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json',
            'source_snapshot_is_pre_v8':True,
            'freshness_rule':'exclude every exact canonical V8 development-catalog trade signature',
            'reservoir_generation':{
              'minimum_player_fv':MIN_PLAYER_FV,
              'size2_minimum_player_fv':SIZE2_MIN_FV,
              'minimum_raw_sum_ratio':RAW_RATIO_MIN,
              'side_min_total':SIDE_MIN_TOTAL,
              'side_apex_minimum':4000,
              'minimum_asset_share':0.10,
              'side_profiles':SIDE_PROFILES,
              'profile_neighbor_limit':NEAREST_LIMIT,
              'deterministic_profile_variants':PROFILE_VARIANTS,
              'candidate_probes_per_anchor_side':PER_ANCHOR_CANDIDATES,
              'deterministic_reservoir_cap_per_topology':RESERVOIR_CAP_PER_TOPOLOGY,
              'note':'Unlike B6A first-hit counting, B6B scans every anchor side and retains a deterministic breadth reservoir so one anchor package cannot dominate the feasibility witness.',
            },
            'diversity_tiers':DIVERSITY_TIERS,
            'exact_side_bundle_reuse_cap_per_topology':SIDE_REUSE_CAP,
            'tier_interpretation':{
              'A':'preferred: any player <=10% of challenges within a topology and <=5% of the full 600-challenge experiment',
              'B':'moderate fallback: <=15% within topology and <=7.5% globally',
              'C':'minimum fallback: <=20% within topology and <=10% globally',
            },
            'selection_method':'joint binary MILP: exactly 120 challenges per topology, player caps by tier, global player cap, and exact-side-bundle reuse cap; feasibility witness is transient and challenge identities are not written durably',
            'future_human_catalog_generated':False,
            'human_outcomes_read':False,
            'v8_human_outcomes_read':False,
            'production_change_authorized':False,
          }
          
          (OUT/'b6b_scope_amendment.json').write_text(json.dumps(SCOPE,indent=2,sort_keys=True)+'\n')
          (OUT/'b6b_preregistered_diversity_protocol.json').write_text(json.dumps(PROTOCOL,indent=2,sort_keys=True)+'\n')
          
          old_sigs=set()
          for ch in old['challenges']:
            old_sigs.add(canonical_trade([x['key'] for x in ch['side_A']['assets']],[x['key'] for x in ch['side_B']['assets']]))
          assert len(old_sigs)==40
          
          players=[dict(p) for p in snap['players'] if int(p['fv'])>=MIN_PLAYER_FV and p.get('pos') in {'QB','RB','WR','TE','DL','LB','DB'}]
          players.sort(key=lambda p:(int(p['fv']),p['key']))
          
          
          def nearest(source,desired,used):
            rows=[p for p in source if p['key'] not in used]
            rows.sort(key=lambda p:(abs(int(p['fv'])-desired),p['key']))
            return rows[:NEAREST_LIMIT]
          
          def make_side(rows,size):
            fvs=[int(p['fv']) for p in rows]
            total=sum(fvs); shares=[x/total for x in fvs]
            keys=tuple(sorted(p['key'] for p in rows))
            score=candidate_score(fvs)
            return {'keys':keys,'keyset':frozenset(keys),'raw':total,'score':score,'mult':score/total,
                    'apex':max(fvs),'min_fv':min(fvs),'min_share':min(shares),'signature':canonical_side(keys)}
          def build_pool(size):
            source=[p for p in players if size!=2 or int(p['fv'])>=SIZE2_MIN_FV]
            out={}
            for anchor in source:
              for profile in SIDE_PROFILES[size]:
                goal=int(anchor['fv'])/profile[0]
                for variant in range(PROFILE_VARIANTS):
                  chosen=[anchor]; used={anchor['key']}
                  for i in range(1,size):
                    rows=nearest(source,goal*profile[i],used)
                    if not rows: chosen=[]; break
                    idx=(variant*(2*i+1)+i*7)%len(rows)
                    pick=rows[idx]; chosen.append(pick); used.add(pick['key'])
                  if len(chosen)!=size: continue
                  s=make_side(chosen,size)
                  if s['raw']<SIDE_MIN_TOTAL[size] or s['apex']<4000 or s['min_share']<0.10-1e-12: continue
                  if size==2 and s['min_fv']<SIZE2_MIN_FV: continue
                  out.setdefault(s['signature'],s)
            return sorted(out.values(),key=lambda s:(s['raw'],s['signature']))
          
          pools={n:build_pool(n) for n in [2,3,4]}
          assert all(pools[n] for n in pools)
          
          # Retain the lowest deterministic signature hashes after scanning every anchor.
          # This is an outcome-blind breadth sample from the generated discordance frame.
          def reservoir_add(heap, bysig, cand):
            sig=cand['trade_signature']
            if sig in bysig: return
            rank=h64(sig)
            item=(-rank,sig)
            if len(heap)<RESERVOIR_CAP_PER_TOPOLOGY:
              heapq.heappush(heap,item); bysig[sig]=cand
            elif item>heap[0]:
              _,old_sig=heapq.heapreplace(heap,item)
              bysig.pop(old_sig,None); bysig[sig]=cand
          
          def probe_positions(idx,a_signature):
            m=len(idx)
            if m<=PER_ANCHOR_CANDIDATES*4: return idx.tolist()
            probe=min(m,PER_ANCHOR_CANDIDATES*4)
            start=h64(a_signature)%m
            step=max(1,m//probe)
            out=[]; seen=set()
            for j in range(probe*2):
              z=int(idx[(start+j*step)%m])
              if z not in seen:
                seen.add(z); out.append(z)
                if len(out)>=probe: break
            return out
          
          def build_reservoir(topo):
            na,nb=map(int,topo.split('v'))
            A=pools[na]; B=pools[nb]
            order=np.argsort(np.asarray([s['raw'] for s in B],float),kind='stable')
            B=[B[int(i)] for i in order]
            b_raw=np.asarray([s['raw'] for s in B],float)
            b_score=np.asarray([s['score'] for s in B],float)
            # Scan high-multiplier contrast first, but scan ALL anchors; reservoir hash is final breadth filter.
            Aorder=sorted(A,key=lambda s:(-abs(s['mult']-1.0),h64(s['signature'])))
            heap=[]; bysig={}; windows=0; raw_qual=0; shared_rej=0; old_rej=0
            for a in Aorder:
              lo=np.searchsorted(b_raw,RAW_RATIO_MIN*a['raw'],side='left')
              hi=np.searchsorted(b_raw,a['raw']/RAW_RATIO_MIN,side='right')
              if hi<=lo: continue
              rr=b_raw[lo:hi]; ss=b_score[lo:hi]
              case1=(rr <= (1.0-FAIR)*a['raw']+1e-12) & (ss >= a['score']/(1.0-FAIR)-1e-12)
              case2=(rr >= a['raw']/(1.0-FAIR)-1e-12) & (ss <= (1.0-FAIR)*a['score']+1e-12)
              idx=np.flatnonzero(case1|case2); windows+=1
              if idx.size==0: continue
              accepted_for_anchor=0
              for local_z in probe_positions(idx,a['signature']):
                b=B[lo+int(local_z)]
                raw_qual+=1
                if a['keyset'] & b['keyset']:
                  shared_rej+=1; continue
                sig=canonical_trade(a['keys'],b['keys'])
                if sig in old_sigs:
                  old_rej+=1; continue
                raw_side,raw_margin=verdict(a['raw'],b['raw'])
                v9_side,v9_margin=verdict(a['score'],b['score'])
                if raw_side is None or v9_side is None or raw_side==v9_side: continue
                cand={
                  'topology':topo,
                  'trade_signature':sig,
                  'trade_hash':hashlib.sha256(sig.encode()).hexdigest(),
                  'player_keys':tuple(sorted(a['keyset']|b['keyset'])),
                  'side_signatures':tuple(sorted((a['signature'],b['signature']))),
                  'strength_bucket':bucket(min(raw_margin,v9_margin)),
                  'raw_margin':float(raw_margin),'v9_margin':float(v9_margin),
                }
                reservoir_add(heap,bysig,cand)
                accepted_for_anchor+=1
                if accepted_for_anchor>=PER_ANCHOR_CANDIDATES: break
            rows=sorted(bysig.values(),key=lambda c:c['trade_hash'])
            return rows,{'topology':topo,'reservoir_count':len(rows),'search_windows_examined':windows,
                         'probed_qualifying_pairs':raw_qual,'shared_player_rejections':shared_rej,
                         'v8_overlap_rejections':old_rej,'distinct_players_in_reservoir':len({p for c in rows for p in c['player_keys']}),
                         'distinct_side_bundles_in_reservoir':len({s for c in rows for s in c['side_signatures']}),
                         'strength_counts':dict(Counter(c['strength_bucket'] for c in rows))}
          
          reservoirs={}; reservoir_diag=[]
          for topo in TOPOLOGIES:
            reservoirs[topo],diag=build_reservoir(topo)
            reservoir_diag.append(diag)
            if len(reservoirs[topo])<TARGET:
              raise RuntimeError(f'B6B broad reservoir unexpectedly has <{TARGET} candidates for {topo}: {len(reservoirs[topo])}')
          
          # Joint MILP for player diversity and exact side-bundle reuse.
          all_cands=[]
          for topo in TOPOLOGIES:
            all_cands.extend(reservoirs[topo])
          N=len(all_cands)
          player_universe=sorted({p for c in all_cands for p in c['player_keys']})
          
          # Pre-index candidates.
          idx_by_topo=defaultdict(list); idx_by_tp=defaultdict(list); idx_by_player=defaultdict(list); idx_by_tside=defaultdict(list)
          for i,c in enumerate(all_cands):
            t=c['topology']; idx_by_topo[t].append(i)
            for p in c['player_keys']:
              idx_by_tp[(t,p)].append(i); idx_by_player[p].append(i)
            for s in c['side_signatures']:
              idx_by_tside[(t,s)].append(i)
          
          
          def solve_tier(tier):
            row=[]; col=[]; data=[]; lb=[]; ub=[]; labels=[]
            r=0
            def add(indices,lo,hi,label):
              nonlocal r
              for j in indices:
                row.append(r); col.append(j); data.append(1.0)
              lb.append(float(lo)); ub.append(float(hi)); labels.append(label); r+=1
            for t in TOPOLOGIES:
              add(idx_by_topo[t],TARGET,TARGET,f'topology_exact:{t}')
            for (t,p),inds in idx_by_tp.items():
              add(inds,-np.inf,tier['max_player_per_topology'],f'player_topology:{t}:{p}')
            for p,inds in idx_by_player.items():
              add(inds,-np.inf,tier['max_player_global'],f'player_global:{p}')
            for (t,s),inds in idx_by_tside.items():
              if len(inds)>SIDE_REUSE_CAP:
                add(inds,-np.inf,SIDE_REUSE_CAP,f'side_reuse:{t}:{s}')
            A=coo_matrix((data,(row,col)),shape=(r,N)).tocsr()
            lc=LinearConstraint(A,np.asarray(lb),np.asarray(ub))
            # Tiny deterministic objective favors lower trade hashes but feasibility dominates.
            c=np.asarray([(int(x['trade_hash'][:12],16)/(16**12))*1e-7 for x in all_cands],float)
            res=milp(c,integrality=np.ones(N,dtype=int),bounds=Bounds(np.zeros(N),np.ones(N)),constraints=lc,
                     options={'time_limit':300,'mip_rel_gap':0.0,'presolve':True})
            feasible=bool(res.x is not None and np.all(np.isfinite(res.x)) and res.status in (0,1))
            out={'tier':tier,'feasible':feasible,'solver_status':int(res.status),'solver_message':str(res.message),
                 'variable_count':N,'constraint_count':r}
            if not feasible: return out,None
            chosen=[all_cands[i] for i,x in enumerate(res.x) if x>0.5]
            if len(chosen)!=TOTAL_BALLOTS:
              raise RuntimeError(f'MILP selected {len(chosen)} != {TOTAL_BALLOTS}')
            # Validate hard constraints independently and summarize anonymously.
            per_topo=Counter(c['topology'] for c in chosen)
            assert all(per_topo[t]==TARGET for t in TOPOLOGIES)
            global_pc=Counter(); topo_pc=defaultdict(Counter); side_count=defaultdict(Counter); strength=defaultdict(Counter)
            for c0 in chosen:
              t=c0['topology']; strength[t][c0['strength_bucket']]+=1
              for p in c0['player_keys']:
                global_pc[p]+=1; topo_pc[t][p]+=1
              for s in c0['side_signatures']: side_count[t][s]+=1
            assert max(global_pc.values())<=tier['max_player_global']
            assert max(max(v.values()) for v in topo_pc.values())<=tier['max_player_per_topology']
            assert max(max(v.values()) for v in side_count.values())<=SIDE_REUSE_CAP
            topo_summary={}
            for t in TOPOLOGIES:
              vals=list(topo_pc[t].values()); sides=list(side_count[t].values())
              topo_summary[t]={
                'selected_challenges':TARGET,
                'distinct_players':len(topo_pc[t]),
                'max_player_appearances':max(vals),
                'median_player_appearances':float(np.median(vals)),
                'p90_player_appearances':float(np.quantile(vals,.90)),
                'distinct_side_bundles':len(side_count[t]),
                'max_exact_side_bundle_reuse':max(sides),
                'strength_counts':dict(strength[t]),
              }
            gvals=list(global_pc.values())
            out['witness_summary']={
              'selected_total':len(chosen),
              'distinct_players_global':len(global_pc),
              'max_player_appearances_global':max(gvals),
              'median_player_appearances_global':float(np.median(gvals)),
              'p90_player_appearances_global':float(np.quantile(gvals,.90)),
              'topologies':topo_summary,
              'challenge_identities_written_durably':False,
            }
            return out,chosen
          
          results=[]; chosen=None; winning=None
          for tier in DIVERSITY_TIERS:
            rr,cc=solve_tier(tier); results.append(rr)
            if rr['feasible']:
              winning=tier; chosen=cc; break
          
          if winning is None:
            decision='STOP_NO_DIVERSE_FIVE_TOPOLOGY_CATALOG_FEASIBLE'
          elif winning['id']=='A':
            decision='PASS_PREFERRED_DIVERSITY_FEASIBLE'
          else:
            decision='CONDITIONAL_RELAXED_DIVERSITY_FEASIBLE_REQUIRES_B7_PLAYER_STRESS'
          
          # Generic 30-voter assignment-count proof; no actual selected challenge IDs or display order saved.
          assignment={
            'voters':VOTERS,
            'eligible_topologies':TOPOLOGIES,
            'challenges_per_topology':TARGET,
            'ballots_per_voter_per_topology':BALLOTS_PER_TOPOLOGY_PER_VOTER,
            'ballots_per_voter':TOTAL_BALLOTS//VOTERS,
            'total_ballots':TOTAL_BALLOTS,
            'one_vote_per_unique_challenge':True,
            'two_v9_left_two_v9_right_per_voter_topology_possible':True,
            'count_identity':VOTERS*BALLOTS_PER_TOPOLOGY_PER_VOTER==TARGET,
            'actual_randomization_schedule_generated':False,
          }
          assert assignment['count_identity']
          
          reservoir_out={
            'analysis_version':VERSION,
            'status':'PASS_B6B_BREADTH_RESERVOIR_AUDIT_ONLY',
            'eligible_player_count':len(players),
            'side_pool_sizes':{str(n):len(pools[n]) for n in pools},
            'rows':reservoir_diag,
            'all_five_topologies_have_at_least_120':all(d['reservoir_count']>=TARGET for d in reservoir_diag),
            'actual_human_catalog_generated':False,
          }
          feas_out={
            'analysis_version':VERSION,
            'status':'PASS_B6B_DIVERSITY_FEASIBILITY_AUDIT_ONLY',
            'decision':decision,
            'tiers_attempted':results,
            'winning_tier':winning,
            'assignment_count_feasibility':assignment,
            'scope':TOPOLOGIES,
            'hard_fallback_topology':FALLBACK_TOPOLOGY,
            'actual_human_catalog_generated':False,
          }
          manifest={
            'analysis_version':VERSION,
            'status':'PASS_B6B_FIVE_TOPOLOGY_CATALOG_DIVERSITY_FEASIBILITY_AUDIT_ONLY',
            'decision':decision,
            'scope_amendment_frozen_for_b7_path':True,
            'v9_eligible_topologies':TOPOLOGIES,
            'v1_7_only_topologies':[FALLBACK_TOPOLOGY],
            'candidate_formula_unchanged':True,
            'q':Q,'theta_min':THETA_MIN,'fair_band':FAIR,'familywise_alpha':FWER_ALPHA,
            'five_topology_target':{'voters':VOTERS,'ballots':TOTAL_BALLOTS,'challenges_per_topology':TARGET,'ballots_per_voter':TOTAL_BALLOTS//VOTERS},
            'winning_diversity_tier':winning,
            'v9_final_evaluator_frozen':False,
            'v9_human_catalog_generated':False,
            'v9_human_outcomes_exist_or_were_read':False,
            'production_change_authorized':False,
            'next_if_pass':'Run B7 independent high-rep five-topology operating-characteristic confirmation and full prospective evaluator/generator/randomization freeze. Do not generate human voting catalog until B7 passes.',
            'next_if_conditional':'Run B7 only with explicit player-dependence stress and Monte Carlo confidence-bound PASS rules; no human catalog until that confirmation passes.',
            'next_if_stop':'Do not generate V9 human catalog. Reconsider source diversity, topology scope, or a prospectively declared small science amendment; never rescue after human outcomes.',
          }
          
          report=[]
          report.append('# Package Adjustment V9 — B6B Five-Topology Discordant Catalog Diversity Feasibility Audit')
          report.append('')
          report.append(f'**Decision:** `{decision}`')
          report.append('')
          report.append('B6 proved the discordance-based inferential design can be efficient. B6A proved that five topologies have abundant discrete discordance supply but 2v2 has none in the broad frozen 472-player source. B6B therefore prospectively narrows the V9 claim to five topologies, leaves 2v2 permanently on V1.7 for this V9 path, and asks whether 120 unique challenges per eligible topology can be selected without one player or exact package side dominating the experiment.')
          report.append('')
          report.append('## Frozen V9 scope for the B7 path')
          report.append('- V9 eligible: `2v3`, `2v4`, `3v3`, `3v4`, `4v4`')
          report.append('- V1.7-only fallback: `2v2`')
          report.append('- No threshold relaxation: q, theta_min=.60, fair band=7%, and familywise alpha=.05 are unchanged.')
          report.append('- B7 must recompute Holm/OC behavior over exactly five hypotheses before any human catalog exists.')
          report.append('')
          report.append('## Breadth reservoir')
          report.append('| Topology | Reservoir | Distinct players | Distinct sides | 7-10% | 10-15% | 15%+ |')
          report.append('|---|---:|---:|---:|---:|---:|---:|')
          for d in reservoir_diag:
            sc=d['strength_counts']
            report.append(f"| {d['topology']} | {d['reservoir_count']} | {d['distinct_players_in_reservoir']} | {d['distinct_side_bundles_in_reservoir']} | {sc.get('7-10%',0)} | {sc.get('10-15%',0)} | {sc.get('15%+',0)} |")
          report.append('')
          report.append('## Diversity tiers')
          report.append('| Tier | Per-topology player cap | Global player cap | Exact side reuse cap | Feasible |')
          report.append('|---|---:|---:|---:|---|')
          for rr in results:
            t=rr['tier']
            report.append(f"| {t['id']} ({t['label']}) | {t['max_player_per_topology']} | {t['max_player_global']} | {SIDE_REUSE_CAP} | {'yes' if rr['feasible'] else 'no'} |")
          if winning:
            w=next(r for r in results if r['tier']['id']==winning['id'])['witness_summary']
            report.append('')
            report.append(f"Winning tier: **{winning['id']} ({winning['label']})**. Global distinct players: {w['distinct_players_global']}; maximum global appearances: {w['max_player_appearances_global']}.")
            report.append('')
            report.append('| Topology | Distinct players | Max player appearances | Max exact side reuse |')
            report.append('|---|---:|---:|---:|')
            for t in TOPOLOGIES:
              z=w['topologies'][t]
              report.append(f"| {t} | {z['distinct_players']} | {z['max_player_appearances']} | {z['max_exact_side_bundle_reuse']} |")
          report.append('')
          report.append('## Future assignment count')
          report.append(f'- 30 voters × 20 ballots = {TOTAL_BALLOTS} unique votes.')
          report.append('- Each voter: exactly four challenges per eligible topology; future randomization can place V9 left twice/right twice within each voter × topology.')
          report.append('- B6B does not generate challenge identities, voter assignments, or display randomization.')
          report.append('')
          report.append('## Firewall')
          report.append('- No V8 human outcomes or V8 candidate performance are used.')
          report.append('- No V9 human outcomes exist or are read.')
          report.append('- The feasibility witness exists only in memory and is discarded; durable outputs contain anonymous aggregate diagnostics only.')
          report.append('- Production V1.7 remains unchanged and no production change is authorized.')
          
          (OUT/'b6b_breadth_reservoir_audit.json').write_text(json.dumps(reservoir_out,indent=2,sort_keys=True)+'\n')
          (OUT/'b6b_diversity_feasibility.json').write_text(json.dumps(feas_out,indent=2,sort_keys=True)+'\n')
          (OUT/'b6b_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          (OUT/'b6b_report.md').write_text('\n'.join(report)+'\n')
          
          names=['b6b_scope_amendment.json','b6b_preregistered_diversity_protocol.json','b6b_breadth_reservoir_audit.json','b6b_diversity_feasibility.json','b6b_manifest.json','b6b_report.md']
          hashes={n:hashlib.sha256((OUT/n).read_bytes()).hexdigest() for n in names}
          (OUT/'b6b_output_hashes.json').write_text(json.dumps({'analysis_version':VERSION,'sha256':hashes},indent=2,sort_keys=True)+'\n')
          print(json.dumps({'decision':decision,'winning_tier':winning,'reservoir_counts':{d['topology']:d['reservoir_count'] for d in reservoir_diag}},indent=2))
          PY2
          python3 /tmp/package-adjustment-v9-b6b/analyze_b6b.py

      - name: Validate B6B firewall and output contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import hashlib,json
          from pathlib import Path
          out=Path('/tmp/package-adjustment-v9-b6b')
          load=lambda n: json.loads((out/n).read_text())
          scope=load('b6b_scope_amendment.json')
          proto=load('b6b_preregistered_diversity_protocol.json')
          res=load('b6b_breadth_reservoir_audit.json')
          div=load('b6b_diversity_feasibility.json')
          m=load('b6b_manifest.json')
          h=load('b6b_output_hashes.json')
          eligible=['2v3','2v4','3v3','3v4','4v4']
          assert scope['v9_eligible_topologies']==eligible
          assert scope['hard_fallback_topologies']==['2v2']
          assert scope['human_outcomes_used'] is False
          assert scope['v8_candidate_performance_used'] is False
          assert scope['production_change_authorized'] is False
          assert proto['eligible_topologies']==eligible
          assert proto['fallback_topology']=='2v2'
          assert proto['target_unique_challenges_per_topology']==120
          assert proto['target_total_challenges']==600
          assert proto['future_voters']==30
          assert proto['future_ballots_per_voter']==20
          assert proto['human_outcomes_read'] is False
          assert proto['v8_human_outcomes_read'] is False
          assert proto['future_human_catalog_generated'] is False
          assert res['all_five_topologies_have_at_least_120'] is True
          assert len(res['rows'])==5
          assert div['assignment_count_feasibility']['total_ballots']==600
          assert div['assignment_count_feasibility']['actual_randomization_schedule_generated'] is False
          assert m['decision'] in {
            'PASS_PREFERRED_DIVERSITY_FEASIBLE',
            'CONDITIONAL_RELAXED_DIVERSITY_FEASIBLE_REQUIRES_B7_PLAYER_STRESS',
            'STOP_NO_DIVERSE_FIVE_TOPOLOGY_CATALOG_FEASIBLE',
          }
          assert m['v9_final_evaluator_frozen'] is False
          assert m['v9_human_catalog_generated'] is False
          assert m['v9_human_outcomes_exist_or_were_read'] is False
          assert m['production_change_authorized'] is False
          if m['decision']=='PASS_PREFERRED_DIVERSITY_FEASIBLE':
            assert m['winning_diversity_tier']['id']=='A'
          if m['decision']=='CONDITIONAL_RELAXED_DIVERSITY_FEASIBLE_REQUIRES_B7_PLAYER_STRESS':
            assert m['winning_diversity_tier']['id'] in {'B','C'}
          if m['decision']=='STOP_NO_DIVERSE_FIVE_TOPOLOGY_CATALOG_FEASIBLE':
            assert m['winning_diversity_tier'] is None
          for name,digest in h['sha256'].items():
            assert hashlib.sha256((out/name).read_bytes()).hexdigest()==digest
          print('PASS: B6B five-topology scope amendment, diversity feasibility, no-human-catalog firewall, and hashes validated.')
          PY3

      - name: Commit durable B6B planning record
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b6b-five-topology-diversity-feasibility"
          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b6b/b6b_scope_amendment.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6b/b6b_preregistered_diversity_protocol.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6b/b6b_breadth_reservoir_audit.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6b/b6b_diversity_feasibility.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6b/b6b_manifest.json "$DEST/"
          cp /tmp/package-adjustment-v9-b6b/b6b_report.md "$DEST/"
          cp /tmp/package-adjustment-v9-b6b/b6b_output_hashes.json "$DEST/"

          git add "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No B6B durable changes to commit."
          else
            git commit -m "Record Package Adjustment V9 B6B five-topology diversity feasibility"
            git push origin HEAD:main
          fi

