              'joint_pass_power_min':POWER_TARGET,
              'null_false_pass_max':NULL_FALSE_PASS_MAX,
              'unsafe_topology_detection_min':UNSAFE_DETECTION_MIN,
            },
            'preferred_human_burden_envelope':{
              'max_voters':PREFERRED_MAX_VOTERS,
              'max_ballots':PREFERRED_MAX_BALLOTS,
              'workload_per_voter':WORKLOAD,
            },
            'conservative_nuisance_source':'B5A p90 challenge and voter SDs',
            'simulation_reps_per_design_scenario':REPS,
            'tested_challenges_per_topology':CPT_GRID,
            'tested_votes_per_challenge':R_GRID,
            'tested_topology_margins':MARGINS,
            'calibration':calibration,
            'principal_margin_0p010_results':principal,
            'all_results':results,
            'minimum_qualifying_design_primary_effect':minimum,
            'minimum_qualifying_design_by_effect':minimum_by_effect,
            'assignment_grid':assignment_summary,
            'optimizer_diagnostics':dict(sorted(OPT_DIAGNOSTICS.items())),
            'v9_candidate_selected':False,
            'v9_architecture_frozen':False,
            'v9_comparator_frozen':False,
            'v9_gate_changed_or_frozen':False,
            'v9_human_design_frozen':False,
            'v9_outcomes_exist_or_were_read':False,
            'production_change_authorized':False,
            'required_next_step_if_strict_infeasible':'Independently review whether a hierarchical topology-safety gate with an unpooled worst-topology backstop is scientifically preferable; preregister that rule before simulating it. Do not weaken gates post hoc and do not generate a V9 voting catalog yet.',
            'required_next_step_if_strict_feasible':'Review burden and effect assumptions, then preregister/freeze the exact V9 candidate architecture, exact V1.7 comparator semantics, evaluator, final strict gates, and one design before any fresh human outcomes.',
          }

          lines=[
            '# Package Adjustment V9 — B5B Strict Joint-Gate Feasibility Boundary Audit','',
            f"**Decision:** `{boundary_decision}`",'',
            'B5B keeps the strict overall + six unpooled topology UCB rule intact. It does not select a V9 candidate, change a gate, or authorize voting/production.','',
            '## Why B5B exists','',
            '- B5A was operationally/scientifically green as a planning workflow, but its principal 0.020-benefit scenario had 0% joint PASS across every tested design.',
            '- B5A\'s 0.050 scenario was not usable because random topology perturbations repeatedly fell outside the generic calibration support.',
            '- B5B fixes only that synthetic calibration defect and extends the sample-burden search.','',
            '## Primary boundary criterion','',
            f'- True macro mean log-loss benefit: **0.020**',
            f'- Joint PASS power target: **{POWER_TARGET:.0%}**',
            f'- Null false-PASS ceiling: **{NULL_FALSE_PASS_MAX:.0%}**',
            f'- Unsafe-topology detection floor: **{UNSAFE_DETECTION_MIN:.0%}**',
            f'- Principal topology NI margin: **0.010**',
            f'- Preferred burden ceiling: **{PREFERRED_MAX_VOTERS} voters / {PREFERRED_MAX_BALLOTS} ballots / {WORKLOAD} ballots per voter**','',
            '## Principal strict-rule results','',
            '| C/topology | Votes/challenge | Voters | Ballots | P(.02 PASS) | P(.03 PASS) | P(.04 PASS) | Null false PASS | Unsafe detection | Preferred burden |',
            '|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|',
          ]
          for x in principal:
            lines.append(
              f"| {x['challenges_per_topology']} | {x['votes_per_challenge']} | {x['voters']} | {x['total_ballots']} | "
              f"{x['benefit_0p020_joint_pass_rate']:.3f} | {x['benefit_0p030_joint_pass_rate']:.3f} | "
              f"{x['benefit_0p040_joint_pass_rate']:.3f} | {x['null_joint_pass_rate']:.3f} | "
              f"{x['unsafe_detection_rate']:.3f} | {'yes' if x['preferred_burden_envelope'] else 'no'} |"
