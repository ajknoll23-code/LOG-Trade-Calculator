          hashes={}
          for n in ('b5b_strict_gate_boundary_audit.json','b5b_report.md'):
            hashes[n]=hashlib.sha256((OUT/n).read_bytes()).hexdigest()
          dump('b5b_output_hashes.json',{'analysis_version':VERSION,'sha256':hashes})
          print(json.dumps({
            'status':audit['status'],
            'decision':boundary_decision,
            'minimum_primary_design':minimum,
            'optimizer_diagnostics':audit['optimizer_diagnostics'],
            'output_hashes':hashes,
          },indent=2,sort_keys=True))
          PY

          python3 /tmp/package-adjustment-v9-b5b/analyze_b5b.py

      - name: Validate B5B scientific firewall and internal consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/package-adjustment-v9-b5b')
          a=json.loads((p/'b5b_strict_gate_boundary_audit.json').read_text())
          assert a['status']=='PASS_B5B_STRICT_GATE_BOUNDARY_AUDIT_COMPLETE'
          assert a['decision'] in {
            'PASS_STRICT_GATE_FEASIBLE_WITHIN_PREFERRED_BURDEN_ENVELOPE',
            'PASS_STRICT_GATE_FEASIBLE_ONLY_ABOVE_PREFERRED_BURDEN_ENVELOPE',
            'STOP_STRICT_GATE_NOT_FEASIBLE_WITHIN_SEARCH_ENVELOPE',
          }
          assert a['strict_rule_held_fixed']['principal_topology_ni_margin']==0.010
          assert a['planning_acceptance_targets']=={
            'joint_pass_power_min':0.8,
            'null_false_pass_max':0.05,
            'primary_true_macro_mean_logloss_benefit':0.02,
            'unsafe_topology_detection_min':0.95,
          }
          assert a['calibration']['all_prespecified_targets_inside_support'] is True
          assert a['calibration']['production_v1_7_predictions_read'] is False
          assert a['v9_candidate_selected'] is False
          assert a['v9_architecture_frozen'] is False
          assert a['v9_comparator_frozen'] is False
          assert a['v9_gate_changed_or_frozen'] is False
          assert a['v9_human_design_frozen'] is False
          assert a['v9_outcomes_exist_or_were_read'] is False
          assert a['production_change_authorized'] is False
          assert len(a['principal_margin_0p010_results'])==16
          assert all(x['benefit_0p020_n']==160 for x in a['principal_margin_0p010_results'])
          assert all(x['benefit_0p030_n']==160 for x in a['principal_margin_0p010_results'])
          assert all(x['benefit_0p040_n']==160 for x in a['principal_margin_0p010_results'])
          assert all(x['null_n']==160 for x in a['principal_margin_0p010_results'])
          assert all(x['unsafe_one_topology_n']==160 for x in a['principal_margin_0p010_results'])
          print('PASS: B5B boundary audit is internally consistent and remains planning-only.')
          PY

      - name: Commit durable B5B boundary record to main
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b5b-strict-gate-boundary"
          mkdir -p "$DEST"
          ALLOW=(
            b5b_strict_gate_boundary_audit.json
            b5b_report.md
            b5b_output_hashes.json
          )
          for f in "${ALLOW[@]}"; do
            cp "/tmp/package-adjustment-v9-b5b/$f" "$DEST/$f"
          done
          test "$(find "$DEST" -maxdepth 1 -type f | wc -l)" -eq 3

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${ALLOW[@]/#/$DEST/}"

          staged="$(git diff --cached --name-only)"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              "$DEST/b5b_strict_gate_boundary_audit.json"|\
              "$DEST/b5b_report.md"|\
              "$DEST/b5b_output_hashes.json") ;;
              *) echo "ERROR: unexpected staged file: $f"; exit 1 ;;
            esac
          done <<< "$staged"

          if git diff --cached --quiet; then
            echo "B5B durable boundary record already identical on main; no commit needed."
            exit 0
          fi
          git commit -m "Record Package Adjustment V9 B5B strict gate boundary audit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload convenience artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v9-b5b-strict-gate-boundary
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/package-adjustment-v9-b5b/b5b_strict_gate_boundary_audit.json
            /tmp/package-adjustment-v9-b5b/b5b_report.md
            /tmp/package-adjustment-v9-b5b/b5b_output_hashes.json
