name: B5B Package Adjustment V9 - Strict Joint-Gate Feasibility Boundary Audit

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b5b-strict-joint-gate-feasibility-boundary
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B5B_ANALYSIS_VERSION: "package-adjustment-v9-b5b-strict-gate-boundary-v1"

jobs:
  audit-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned planning dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.3" "scipy==1.16.2"

      - name: Guard V8 closeout and exact B5A durable planning record
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED_BLOBS=(
            ["research/package-adjustment-v8/package_adjustment_v8_scientific_closeout.json"]="7073583e2ad9c65757dd0c81a8741734cdbb7dc0"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_assignment_feasibility.json"]="7c6bd256911871f01af3fa2067729ee520f79f35"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_design_sizing_manifest.json"]="d71c6c5771de8d19c97f148ecf8e8bd52c014dc9"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_joint_gate_design_sizing.json"]="0cd038cd0f672fd3c024c2d75ac83342e0a7a68b"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_nuisance_estimation.json"]="cefd3a8c8a1a9beeeb8344ad3e81b224bb972d2e"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_output_hashes.json"]="228b24355706e75e26c6a1665e2638f962f62dd1"
            ["research/package-adjustment-v9/b5a-design-sizing/b5a_report.md"]="695f19ca08c8295ba0898a9a3b107fb14e1e960c"
            ["research/package-adjustment-v9/b5a-design-sizing/reconstruction_witness.json"]="a252d4a3884c34afbecd4a40c18e7d3a217e9c04"
          )

          for p in "${!EXPECTED_BLOBS[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED_BLOBS[$p]}" || {
              echo "ERROR: frozen/planning artifact drift: $p expected=${EXPECTED_BLOBS[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          v8=Path('research/package-adjustment-v8')
          b5a=Path('research/package-adjustment-v9/b5a-design-sizing')
          load=lambda p: json.loads(p.read_text())

          close=load(v8/'package_adjustment_v8_scientific_closeout.json')
          mani=load(b5a/'b5a_design_sizing_manifest.json')
          sizing=load(b5a/'b5a_joint_gate_design_sizing.json')
          nuisance=load(b5a/'b5a_nuisance_estimation.json')
          witness=load(b5a/'reconstruction_witness.json')

          assert close['scientific_decision']=='STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION'
          assert close['production_change_authorized'] is False
          assert mani['status']=='PASS_B5A_DESIGN_SIZING_ONLY'
          assert mani['uses_opened_v8_outcomes_only_for_nuisance_estimation'] is True
          assert mani['uses_v8_candidate_performance_to_choose_v9_architecture'] is False
          assert mani['reads_production_v1_7_predictions_on_v8_votes'] is False
          assert mani['v9_outcomes_exist_or_were_read'] is False
          assert mani['v9_design_frozen'] is False
          assert mani['production_change_authorized'] is False
          assert sizing['status']=='PASS_PLANNING_ONLY_NO_V9_DESIGN_FROZEN'
          assert sizing['v9_candidate_selected'] is False
          assert sizing['v9_architecture_frozen'] is False
          assert sizing['v9_design_frozen'] is False
          assert sizing['v9_gates_frozen'] is False
          assert sizing['production_change_authorized'] is False
          assert nuisance['status']=='PASS_NUISANCE_ESTIMATION_ONLY'
          assert witness['status']=='PASS_EXACT_V8_DATASET_RECONSTRUCTED_FOR_NUISANCE_ONLY'
          assert witness['dataset_sha256']=='e6d4beaae2699bd9a029e3d9c53d680cd30f6c2aaf4d460e6aca64dc3d18106d'

          principal=sizing['principal_planning_slice_margin_0_010_floor_0_005']
          assert len(principal)==8
          assert all(x['good_min_joint_pass_rate']==0.0 for x in principal)
          assert all(x['good_mod_n']==0 and x['good_mod_joint_pass_rate'] is None for x in principal)
          lo,hi=sizing['generic_comparator_calibration']['achievable_expected_candidate_minus_comparator_logloss_delta_range']
          assert lo < -0.05 and hi > 0.02

          # B5B is explicitly a boundary audit. It must not weaken or select a V9 gate,
          # architecture, candidate, comparator implementation, or human-vote design.
          print('PASS: exact B5A planning result and V8 closeout guarded; B5B remains synthetic boundary analysis only.')
          PY

      - name: Run strict joint-gate feasibility boundary simulation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b5b
          mkdir -p /tmp/package-adjustment-v9-b5b

          cat > /tmp/package-adjustment-v9-b5b/analyze_b5b.py <<'PY'
          from __future__ import annotations
          import hashlib,json,math,os
          from collections import Counter,defaultdict
          from pathlib import Path
          import numpy as np
          from scipy.optimize import minimize, minimize_scalar
          from scipy.special import expit
          from scipy.stats import t as student_t

          ROOT=Path('.')
          B5A=ROOT/'research/package-adjustment-v9/b5a-design-sizing'
          OUT=Path('/tmp/package-adjustment-v9-b5b')
          VERSION=os.environ['B5B_ANALYSIS_VERSION']
          SEED=2026100502
          TOPOLOGIES=['2v2','2v3','2v4','3v3','3v4','4v4']

          nuisance=json.loads((B5A/'b5a_nuisance_estimation.json').read_text())
          b5a_sizing=json.loads((B5A/'b5a_joint_gate_design_sizing.json').read_text())

          # Conservative planning variance: use B5A's 90th-percentile nuisance scales.
          SIGMA_CH=float(nuisance['within_topology_challenge_sd_bootstrap_p90'])
          SIGMA_V=float(nuisance['voter_sd_bootstrap_p90'])
          DELTA_LEFT=float(nuisance['left_bias_logit_point'])
          DELTA_LEFT_SE=float(nuisance['left_bias_logit_planning_se_conservative'])

          # Keep the B5A generic comparator assumption fixed. No production V1.7 predictions are read.
          COMPARATOR_NOISE_SD=float(b5a_sizing['generic_comparator_calibration']['comparator_noise_sd'])

          # Boundary search deliberately extends beyond B5A's 30 challenges/topology ceiling.
          # No design here is frozen for human voting.
          CPT_GRID=[24,30,36,42,48,60,72,90]
          R_GRID=[6,8]
          WORKLOAD=24
          REPS=160
          MARGINS=[0.005,0.010,0.020]
          OVERALL_FLOOR=0.005

          # Practical targets are fixed before simulation. Deterministic zero-mean topology
          # deviations avoid B5A's accidental out-of-support random good_mod targets.
          DEV_PATTERN=np.array([-1.0,-0.6,-0.2,0.2,0.6,1.0],dtype=float)
          SCENARIOS={
            'benefit_0p020': {'mean':-0.020,'heterogeneity_half_range':0.004},
            'benefit_0p030': {'mean':-0.030,'heterogeneity_half_range':0.006},
            'benefit_0p040': {'mean':-0.040,'heterogeneity_half_range':0.008},
            'null': None,
            'unsafe_one_topology': None,
          }

          POWER_TARGET=0.80
          NULL_FALSE_PASS_MAX=0.05
          UNSAFE_DETECTION_MIN=0.95
          PREFERRED_MAX_VOTERS=60
          PREFERRED_MAX_BALLOTS=1440

          def assignment_for(cpt,r,seed):
            total=6*cpt*r
            if r%2 or total%WORKLOAD:
              return None,{'reason':'divisibility_or_even_left_right_failure'}
            n=total//WORKLOAD
            k=WORKLOAD//6
            if n<r or k>cpt:
              return None,{'reason':'degree_failure'}
            rng=np.random.default_rng(seed)
            best=None;best_diag=None;best_score=None
            # All candidates satisfy the hard exact constraints; search only improves
            # voter left/right balance and pairwise overlap diagnostics.
            for trial in range(120):
              rec=[]
              for ti in range(6):
                perm=rng.permutation(n)
                off=int(rng.integers(0,n))
                for j in range(cpt):
                  sorder=rng.permutation(r)
                  for rank,s in enumerate(sorder):
                    v=int(perm[(j*r+int(s)+off)%n])
                    x=1 if rank<r//2 else -1
                    rec.append((v,ti,j,x))
              vc=Counter(v for v,_,_,_ in rec)
              vt=Counter((v,t) for v,t,_,_ in rec)
              cj=Counter((t,j) for _,t,j,_ in rec)
              dup=Counter((v,t,j) for v,t,j,_ in rec)
              lr=defaultdict(Counter)
              for v,t,j,x in rec: lr[(t,j)][x]+=1
              hard=(set(vc.values())=={WORKLOAD} and set(vt.values())=={k} and
                    set(cj.values())=={r} and max(dup.values())==1 and
                    all(z==Counter({-1:r//2,1:r//2}) for z in lr.values()))
              if not hard: continue
              left_by_v=Counter()
              sets=[set() for _ in range(n)]
              for v,t,j,x in rec:
                left_by_v[v]+=x; sets[v].add((t,j))
              max_imb=max(abs(left_by_v[v]) for v in range(n))
              overlaps=[]
              for a in range(n):
                for b in range(a+1,n): overlaps.append(len(sets[a]&sets[b]))
              overlap_range=(max(overlaps)-min(overlaps)) if overlaps else 0
              overlap_sd=float(np.std(overlaps)) if overlaps else 0.0
              score=(max_imb,overlap_range,overlap_sd)
              if best_score is None or score<best_score:
                best_score=score;best=rec
                best_diag={
                  'hard_constraints_exact':True,
                  'max_abs_voter_left_minus_right':int(max_imb),
                  'pairwise_overlap_range':int(overlap_range),
                  'pairwise_overlap_sd':overlap_sd,
                  'trials':trial+1,
                }
            if best is None:
              return None,{'reason':'generator_failed_core_exact_assignment'}
            return best,best_diag

          assignment_cache={}
          assignment_summary=[]
          for cpt in CPT_GRID:
            for r in R_GRID:
              rec,diag=assignment_for(cpt,r,SEED+cpt*100+r)
              if rec is None:
                assignment_summary.append({
                  'challenges_per_topology':cpt,'votes_per_challenge':r,
                  'total_challenges':6*cpt,'total_ballots':6*cpt*r,
                  'voters':None,'workload_per_voter':WORKLOAD,
                  'classification':'INFEASIBLE','diagnostics':diag,
                })
                continue
              n=6*cpt*r//WORKLOAD
              assignment_cache[(cpt,r)]=rec
              assignment_summary.append({
                'challenges_per_topology':cpt,'votes_per_challenge':r,
                'total_challenges':6*cpt,'total_ballots':6*cpt*r,
                'voters':n,'workload_per_voter':WORKLOAD,
                'classification':'CORE_EXACT',
                'preferred_burden_envelope':n<=PREFERRED_MAX_VOTERS and 6*cpt*r<=PREFERRED_MAX_BALLOTS,
                'diagnostics':diag,
              })

          for cpt in CPT_GRID:
            for r in R_GRID:
              assert (cpt,r) in assignment_cache,(cpt,r)

          # Generative calibration. The comparator is generic and fixed at the B5A noise SD.
          # Unlike B5A, the candidate noise grid includes tau=0 and spans both better and worse
          # models so every prespecified target is checked for support before any simulation.
          CAL_RNG=np.random.default_rng(SEED+19)
          M=240000
          theta_cal=CAL_RNG.normal(0.0,SIGMA_CH,size=M)
          ptrue=expit(theta_cal)
          e0=CAL_RNG.normal(size=M)
          e1=CAL_RNG.normal(size=M)

          def optimum_expected_loss(z):
            def f(beta):
              q=np.clip(expit(beta*z),1e-12,1-1e-12)
              return float(np.mean(-(ptrue*np.log(q)+(1-ptrue)*np.log(1-q))))
            rr=minimize_scalar(f,bounds=(0.05,25.0),method='bounded',options={'xatol':1e-7})
            assert rr.success
            return float(rr.fun),float(rr.x)

          base_loss,base_beta=optimum_expected_loss(theta_cal+COMPARATOR_NOISE_SD*e0)
          tau_grid=np.linspace(0.0,3.25,220)
          delta_grid=[]
          for tau in tau_grid:
            ll,_=optimum_expected_loss(theta_cal+float(tau)*e1)
            delta_grid.append(ll-base_loss)
          delta_grid=np.array(delta_grid,float)
          # Expected loss must worsen as score noise increases. MC wiggles are removed only
          # for inversion; raw range remains recorded.
          delta_mono=np.maximum.accumulate(delta_grid)

          def tau_for_target(target):
            target=float(target)
            lo=float(delta_mono[0]);hi=float(delta_mono[-1])
            if target<lo-1e-7 or target>hi+1e-7:
              raise ValueError(f'target {target} outside calibration support [{lo},{hi}]')
            return float(np.interp(target,delta_mono,tau_grid))

          scenario_targets={}
          for name,spec in SCENARIOS.items():
            if name=='null':
              targets=np.zeros(6,float)
            elif name=='unsafe_one_topology':
              targets=np.full(6,-0.030,float)
              targets[0]=0.020
            else:
              targets=float(spec['mean'])+DEV_PATTERN*float(spec['heterogeneity_half_range'])
            taus=np.array([tau_for_target(x) for x in targets],float)
            scenario_targets[name]={
              'true_topology_loss_deltas':targets.tolist(),
              'candidate_noise_sd_by_topology':taus.tolist(),
              'true_macro_mean_loss_delta':float(targets.mean()),
            }

          OPT_DIAGNOSTICS=Counter()
          def fit_nuisance(score,x,y):
            bounds=[(0.05,25.0),(-0.75,0.75)]
            def fg(z):
              beta,dl=float(z[0]),float(z[1])
              eta=beta*score+dl*x
              p=expit(eta)
              loss=float(np.logaddexp(0.0,eta).sum()-np.dot(y,eta))
              res=p-y
              grad=np.array([float(np.dot(res,score)),float(np.dot(res,x))])
              return loss,grad
            best=None
            for start in (np.array([1.0,0.0]),np.array([0.2,0.0]),np.array([5.0,0.0])):
              rr=minimize(lambda z:fg(z)[0],start,jac=lambda z:fg(z)[1],method='L-BFGS-B',
                          bounds=bounds,options={'maxiter':300,'ftol':1e-12,'gtol':1e-8,'maxls':50})
              if np.isfinite(rr.fun) and np.all(np.isfinite(rr.x)) and (best is None or rr.fun<best.fun):
                best=rr
              if rr.success:
                OPT_DIAGNOSTICS['lbfgsb_success']+=1
                return float(rr.x[0]),float(rr.x[1])
            x0=np.array(best.x if best is not None else [1.0,0.0],float)
            rr2=minimize(lambda z:fg(z)[0],x0,method='Powell',bounds=bounds,
                         options={'maxiter':2000,'xtol':1e-10,'ftol':1e-12})
            if rr2.success and np.isfinite(rr2.fun) and np.all(np.isfinite(rr2.x)):
              if best is not None and float(best.fun)<=float(rr2.fun)+1e-10:
                OPT_DIAGNOSTICS['lbfgsb_finite_status_fallback']+=1
                return float(best.x[0]),float(best.x[1])
              OPT_DIAGNOSTICS['powell_fallback_success']+=1
              return float(rr2.x[0]),float(rr2.x[1])
            OPT_DIAGNOSTICS['all_solvers_failed']+=1
            raise RuntimeError('all bounded nuisance solvers failed')

          def logloss_from_eta(y,eta):
            return np.logaddexp(0.0,eta)-y*eta

          def two_way_se(vals,voters_arr,challenges_arr):
            vals=np.asarray(vals,float);n=len(vals);mu=float(vals.mean());res=vals-mu
            uv=np.unique(voters_arr);uc=np.unique(challenges_arr)
            sv=np.array([res[voters_arr==g].sum() for g in uv])
            sc=np.array([res[challenges_arr==g].sum() for g in uc])
            tv=(len(uv)/(len(uv)-1))*float(np.dot(sv,sv)) if len(uv)>1 else 0.0
            tc=(len(uc)/(len(uc)-1))*float(np.dot(sc,sc)) if len(uc)>1 else 0.0
            ti=(n/(n-1))*float(np.dot(res,res)) if n>1 else 0.0
            return math.sqrt(max(0.0,(tv+tc-ti)/(n*n)))

          def simulate_one(cpt,r,scenario,rep):
            rec=assignment_cache[(cpt,r)]
            n=6*cpt*r//WORKLOAD
            scenario_offset={'benefit_0p020':0,'benefit_0p030':200000,'benefit_0p040':400000,'null':600000,'unsafe_one_topology':800000}[scenario]
            rng=np.random.default_rng(SEED*1000000+cpt*10000+r*1000+scenario_offset+rep)
            dl=float(rng.normal(DELTA_LEFT,DELTA_LEFT_SE))
            targets=np.array(scenario_targets[scenario]['true_topology_loss_deltas'],float)
            taus=np.array(scenario_targets[scenario]['candidate_noise_sd_by_topology'],float)

            theta=rng.normal(0.0,SIGMA_CH,size=(6,cpt))
            voter_b=rng.normal(0.0,SIGMA_V,size=n)
            eps0=rng.normal(size=(6,cpt));eps1=rng.normal(size=(6,cpt))
            score0=theta+COMPARATOR_NOISE_SD*eps0
            score1=theta+taus[:,None]*eps1

            v=np.array([q[0] for q in rec],int)
            ti=np.array([q[1] for q in rec],int)
            j=np.array([q[2] for q in rec],int)
            x=np.array([q[3] for q in rec],float)
            cid=ti*cpt+j
            latent=theta[ti,j]+voter_b[v]+dl*x
            yy=rng.binomial(1,expit(latent)).astype(float)
            s0=score0[ti,j];s1=score1[ti,j]

            fold=(j+2*ti)%5
            dloss=np.empty(len(rec),float)
            for f in range(5):
              tr=fold!=f;te=~tr
              b0,l0=fit_nuisance(s0[tr],x[tr],yy[tr])
              b1,l1=fit_nuisance(s1[tr],x[tr],yy[tr])
              dloss[te]=(logloss_from_eta(yy[te],b1*s1[te]+l1*x[te])-
                         logloss_from_eta(yy[te],b0*s0[te]+l0*x[te]))

            overall=float(dloss.mean())
            se_all=two_way_se(dloss,v,cid)
            df_all=max(2,min(n-1,6*cpt-1))
            ucb_all=overall+float(student_t.ppf(.95,df_all))*se_all
            topo=[]
            for z,t in enumerate(TOPOLOGIES):
              m=ti==z
              mean=float(dloss[m].mean())
              se=two_way_se(dloss[m],v[m],cid[m])
              ucb=mean+float(student_t.ppf(.95,max(2,cpt-1)))*se
              topo.append({'topology':t,'mean':mean,'ucb95':ucb,'true_target_delta':float(targets[z])})
            return {'overall_mean':overall,'overall_ucb95':ucb_all,'topologies':topo}

          raw=defaultdict(list)
          for cpt in CPT_GRID:
            for r in R_GRID:
              for scenario in SCENARIOS:
                for rep in range(REPS):
                  raw[(cpt,r,scenario)].append(simulate_one(cpt,r,scenario,rep))

          results=[]
          for cpt in CPT_GRID:
            for r in R_GRID:
              n=6*cpt*r//WORKLOAD
              ballots=6*cpt*r
              ad=next(x for x in assignment_summary if x['challenges_per_topology']==cpt and x['votes_per_challenge']==r)
              for margin in MARGINS:
                row={
                  'challenges_per_topology':cpt,'total_challenges':6*cpt,
                  'votes_per_challenge':r,'workload_per_voter':WORKLOAD,
                  'voters':n,'total_ballots':ballots,'topology_ni_margin':margin,
                  'overall_minimum_mean_benefit':OVERALL_FLOOR,
                  'assignment_classification':ad['classification'],
                  'preferred_burden_envelope':n<=PREFERRED_MAX_VOTERS and ballots<=PREFERRED_MAX_BALLOTS,
                }
                for scenario in SCENARIOS:
                  sims=raw[(cpt,r,scenario)]
                  passes=[]
                  for s in sims:
                    overall_pass=(s['overall_ucb95']<0.0 and s['overall_mean']<=-OVERALL_FLOOR)
                    topo_pass=all(x['ucb95']<margin for x in s['topologies'])
                    passes.append(overall_pass and topo_pass)
                  rate=float(np.mean(passes))
                  row[scenario+'_n']=len(sims)
                  row[scenario+'_joint_pass_rate']=rate
                row['unsafe_detection_rate']=1.0-row['unsafe_one_topology_joint_pass_rate']
                results.append(row)

          principal=[x for x in results if abs(x['topology_ni_margin']-0.010)<1e-12]
          principal.sort(key=lambda x:(x['total_ballots'],x['voters']))

          def qualifies(x,effect_key='benefit_0p020'):
            return (x[effect_key+'_joint_pass_rate']>=POWER_TARGET and
                    x['null_joint_pass_rate']<=NULL_FALSE_PASS_MAX and
                    x['unsafe_detection_rate']>=UNSAFE_DETECTION_MIN)

          qualifying=[x for x in principal if qualifies(x)]
          preferred=[x for x in qualifying if x['preferred_burden_envelope']]
          if preferred:
            boundary_decision='PASS_STRICT_GATE_FEASIBLE_WITHIN_PREFERRED_BURDEN_ENVELOPE'
            minimum=min(preferred,key=lambda x:(x['total_ballots'],x['voters']))
          elif qualifying:
            boundary_decision='PASS_STRICT_GATE_FEASIBLE_ONLY_ABOVE_PREFERRED_BURDEN_ENVELOPE'
            minimum=min(qualifying,key=lambda x:(x['total_ballots'],x['voters']))
          else:
            boundary_decision='STOP_STRICT_GATE_NOT_FEASIBLE_WITHIN_SEARCH_ENVELOPE'
            minimum=None

          # Report minimum designs for stronger effects without changing the primary 0.020 target.
          minimum_by_effect={}
          for effect in ('benefit_0p020','benefit_0p030','benefit_0p040'):
            qs=[x for x in principal if qualifies(x,effect)]
            minimum_by_effect[effect]=min(qs,key=lambda x:(x['total_ballots'],x['voters'])) if qs else None

          calibration={
            'sigma_challenge_p90':SIGMA_CH,
            'sigma_voter_p90':SIGMA_V,
            'left_bias_point':DELTA_LEFT,
            'left_bias_se_used_for_simulation':DELTA_LEFT_SE,
            'generic_comparator_noise_sd':COMPARATOR_NOISE_SD,
            'generic_comparator_optimal_beta_large_sample':base_beta,
            'calibration_support_candidate_minus_comparator_logloss':[float(delta_mono[0]),float(delta_mono[-1])],
            'raw_calibration_support':[float(delta_grid.min()),float(delta_grid.max())],
            'scenario_targets':scenario_targets,
            'all_prespecified_targets_inside_support':True,
            'production_v1_7_predictions_read':False,
          }

          audit={
            'analysis_version':VERSION,
            'status':'PASS_B5B_STRICT_GATE_BOUNDARY_AUDIT_COMPLETE',
            'decision':boundary_decision,
            'planning_only':True,
