name: PPG Validation (Top 30)

# Manual-trigger-only workflow -- this is a one-off validation run, not a
# recurring job like the main roster sync. Go to the Actions tab in
# GitHub, select "PPG Validation (Top 30)" in the left sidebar, click
# "Run workflow", then click the green "Run workflow" button that appears.
# Once it finishes (should take 1-2 minutes -- it's fetching 17 weeks of
# real stats plus the full player index), click into the run, click the
# "run-ppg-pipeline" job, then the "Run PPG pipeline" step to see the
# printed results table directly in the log. No terminal, no local
# Python install, nothing to download.

on:
  workflow_dispatch:

jobs:
  run-ppg-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run PPG pipeline
        run: python3 scripts/ppg_pipeline.py
