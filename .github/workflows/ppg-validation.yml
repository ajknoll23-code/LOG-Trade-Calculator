name: PPG Validation (Full Player Database)

# Manual-trigger-only workflow -- this is a validation/data-generation run,
# not a recurring job like the main roster sync. Go to the Actions tab in
# GitHub, select "PPG Validation (Full Player Database)" in the left
# sidebar, click "Run workflow", then confirm. Should take 1-2 minutes --
# it's fetching 18 weeks of real stats plus the full player index, then
# scoring all ~553 players in the tool's database.
#
# The full per-player results (games played, true PPG, dilution %, weeks
# played) get written to scripts/ppg_results.json and committed back to
# the repo automatically -- the log only shows a summary (top 15 by
# dilution, top 15 by PPG), since a 553-row table wouldn't be scannable in
# a log. Look at the committed JSON file directly for any specific player
# not in those two summary lists.

on:
  workflow_dispatch:

# Needed to commit ppg_results.json back to the repo -- the default
# checkout token is read-only otherwise.
permissions:
  contents: write

jobs:
  run-ppg-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run PPG pipeline
        run: python3 scripts/ppg_pipeline.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ppg_results.json
          git diff --staged --quiet || git commit -m "Update PPG validation results"
          git push
