      - name: Commit exact-1800 V6P1 prospective freeze to main
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v6"
          DATA="$D/prospective_exact_1800_frozen_v1.json"
          MANIFEST="$D/prospective_exact_1800_freeze_manifest_v1.json"

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$DATA" "$MANIFEST"

          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          EXPECTED=("$DATA" "$MANIFEST")
          mapfile -t EXPECTED_SORTED < <(
            printf '%s\n' "${EXPECTED[@]}" | sort
          )

          test "${#STAGED[@]}" -eq 2
          test "$(printf '%s\n' "${STAGED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git commit -m \
            "Freeze Package Adjustment V6P1 prospective evidence at exact 1800"

          git pull --rebase origin main

          test "$(git hash-object "$D/prospective_preregistration_v1.json")" = \
            "d0000c9f42c7be11a8d49d0029993a28fabebc73"
          test "$(git hash-object "$D/package_vote_challenges_v6_prospective_v1.json")" = \
            "dd12608b1b5fee03da5965458d6e59284657dce3"
          test "$(git hash-object "$D/prospective_feasibility_amendment_v1.json")" = \
            "48cafa8ca85c9488f864e8eca6a8882f3e09b3ed"
          test "$(git hash-object "$D/prospective_feasibility_amendment_manifest_v1.json")" = \
            "6fb69d64b31c104b43666734b46599f9ed49abcd"
          test "$(git hash-object "$D/prospective_voting_activation_manifest_v1.json")" = \
            "faf5a5153d2bf2e7bd867aec5d4a96ec227ac679"

          mapfile -t COMMITTED < <(
            git diff-tree --no-commit-id --name-only -r HEAD | sort
          )

          test "${#COMMITTED[@]}" -eq 2
          test "$(printf '%s\n' "${COMMITTED[@]}")" = \
            "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"

          git push origin main

          echo \
            "PASS: exact-1800 V6P1 prospective evidence frozen and committed to main."
