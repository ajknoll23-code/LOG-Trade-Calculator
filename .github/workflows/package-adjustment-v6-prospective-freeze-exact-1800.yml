      - name: Verify freeze artifacts contain no model evaluation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          data_path = d / "prospective_exact_1800_frozen_v1.json"
          manifest_path = d / "prospective_exact_1800_freeze_manifest_v1.json"

          data = json.loads(data_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          assert data["status"] == "frozen_exact_1800_v6p1_prospective_evidence"
          assert data["frozen"] is True
          assert data["checkpoint_selection_outcome_blind"] is True
          assert data["model_evaluation_performed"] is False
          assert data["checkpoint_effective_votes"] == 1800
          assert data["frozen_effective_votes"] == 1800.0
          assert data["raw_checkpoint_ballot_count"] == 1800
          assert data["distinct_voter_clusters"] == 45
          assert len(data["ballots"]) == 1800

          assert abs(
              sum(x["frozen_ballot_weight"] for x in data["ballots"])
              - 1800.0
          ) < 1e-12
          assert {
              x["human_choice"] for x in data["ballots"]
          } <= {"T", "P"}
          assert {
              x["display_left"] for x in data["ballots"]
          } <= {"T", "P"}

          cluster_counts = Counter(
              x["voter_cluster"] for x in data["ballots"]
          )
          assert len(cluster_counts) == 45
          assert set(cluster_counts.values()) == {40}

          assert manifest["status"] == (
              "frozen_exact_1800_v6p1_prospective_evidence_manifest"
          )
          assert manifest["model_evaluation_performed"] is False
          assert manifest["maturity_anchor"]["status"] == (
              "STOP_AND_FREEZE_AT_1800"
          )
          assert manifest["maturity_anchor"]["workflow_run_id"] == 35773127876
          assert manifest["checkpoint_1800"]["coverage_gates_pass"] is True
          assert manifest["checkpoint_1800"]["cells_passing_both_gates"] == 24
          assert manifest["checkpoint_1800"]["effective_votes"] == 1800.0
          assert manifest["dataset"]["sha256"] == hashlib.sha256(
              data_path.read_bytes()
          ).hexdigest()
          assert manifest["dataset"]["contains_model_predictions"] is False
          assert manifest["dataset"][
              "contains_model_performance_statistics"
          ] is False
          assert manifest["dataset"]["contains_raw_voter_identifiers"] is False
          assert manifest["dataset"]["contains_raw_source_timestamps"] is False

          data_text = data_path.read_text().lower()
          for token in [
              '"c1_prediction"',
              '"c2_prediction"',
              '"c1_log_loss"',
              '"c2_log_loss"',
              '"d_overall"',
              '"bootstrap"',
              '"confidence_bound"',
              '"significance"',
              '"model_winner"',
              '"candidate_selected"',
          ]:
              assert token not in data_text, token

          print(
              "PASS: exact-1800 V6P1 prospective evidence is frozen with "
              "anonymized voter clusters; no model evaluation was performed."
          )
          PY

