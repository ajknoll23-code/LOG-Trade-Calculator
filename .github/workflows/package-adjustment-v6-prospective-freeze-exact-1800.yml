      - name: Prove exactly two intended research files changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v6/prospective_exact_1800_frozen_v1.json",
              "research/package-adjustment-v6/prospective_exact_1800_freeze_manifest_v1.json",
          }

          lines = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          ).splitlines()

          actual = {line[3:] for line in lines if line.strip()}
          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )

          print(
              "PASS: only the two intended frozen V6P1 research files changed."
          )
          PY

