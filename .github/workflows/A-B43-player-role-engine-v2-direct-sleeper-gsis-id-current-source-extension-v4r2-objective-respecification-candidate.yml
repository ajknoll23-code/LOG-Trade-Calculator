name: B43 Player Role Engine V2 - Direct Sleeper GSIS-ID Current-Source Extension V4R2 Objective Re-Specification Candidate

'on':
  workflow_dispatch:
    inputs:
      independent_review_and_freeze_attestation:
        description: 'Confirm exact B43 V4R2 workflow was independently reviewed and no B43 V4R2 identity result was viewed before its criteria freeze'
        required: true
        type: choice
        options:
          - I_CONFIRM_EXACT_B43_V4R2_WAS_INDEPENDENTLY_REVIEWED_AND_NO_B43_V4R2_IDENTITY_RESULT_WAS_VIEWED_BEFORE_FREEZE

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  BASE: research/player-role-v2
  OUT: /tmp/player-role-v2-b43-v4r2

jobs:
  direct-sleeper-gsis-id-source-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out current durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install identity-study runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'requests==2.34.2'
          python3 - <<'PYRUNTIME'
          import importlib.metadata as md
          assert md.version('requests') == '2.34.2'
          print('PASS: B43 V4R2 requests runtime pinned at 2.34.2')
          PYRUNTIME

      - name: Verify B42 through B43 V3R2 STOP lineage and protect production
        shell: bash
        env:
          ATTEST: ${{ inputs.independent_review_and_freeze_attestation }}
        run: |
          set -euo pipefail
          test "$ATTEST" = 'I_CONFIRM_EXACT_B43_V4R2_WAS_INDEPENDENTLY_REVIEWED_AND_NO_B43_V4R2_IDENTITY_RESULT_WAS_VIEWED_BEFORE_FREEZE'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$OUT"
          echo "MAIN_AT_START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
          python3 - <<'PYPREFLIGHT'
          import json, subprocess
          from pathlib import Path
          base=Path('research/player-role-v2')
          expected_blobs={
              'player_role_v2_b42_v4_role_eligibility.csv':'4e34b42fcbf6009211bdb26e6ba81d47a738c133',
              'player_role_v2_b42_v4_owner_blind_evidence.json':'bee0df96c06f9104424b9f2eaf7fb6cc5189dbc6',
              'player_role_v2_b42_v4_scientific_decision.json':'9c5657dc571a7fa49cb46e9eb6086b2f740e6674',
              'frozen_inputs/players_b41i_snapshot.csv':'fb4ebad425db5bead98644365a4165cd06eee8e3',
              'player_role_v2_b41g_holdout_validation_preregistration.json':'5a4f6a8bfac3eeb0640c1e2ab7aced316fe9afa5',
              'player_role_v2_b43_v1_scientific_decision.json':'7ac85332f35b7c40fcf859b53db09a9e4c1fd9c8',
              'player_role_v2_b43_v2r1_evidence.json':'082920d770c51779fe6f7f1bf4ca3f0b7616495d',
              'player_role_v2_b43_v2r1_scientific_decision.json':'271ec5c552c2caa78d68cb65dba16befabc3361c',
              'player_role_v2_b43_v3r2_preregistration.json':'c73778f889f6e3da58998f9e8a302c74f48e9f8e',
              'player_role_v2_b43_v3r2_identity_bridge_evaluator.py':'e9a1689eccbf7df04797ad075430b44e41060d28',
              'player_role_v2_b43_v3r2_sleeper_espn_identity_snapshot.csv':'96e50730c3b236413ebe76be6c04015b333eeb5b',
              'player_role_v2_b43_v3r2_identity_bridge.csv':'459969d4ae06fc74cdd4caecd697aa7eb8d357c9',
              'player_role_v2_b43_v3r2_evidence.json':'433ebe3cb78a05b98e48398142543fe895c2ef26',
              'player_role_v2_b43_v3r2_report.md':'803f715663395ef45f4cda3f155ed1d90aa13c44',
              'player_role_v2_b43_v3r2_scientific_decision.json':'b161add7a5312017ef1839aa9e636789308bee7e',
          }
          for rel,expected in expected_blobs.items():
              p=base/rel
              if not p.exists(): raise RuntimeError(f'B43_V4R2_PARENT_MISSING {rel}')
              actual=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              if actual!=expected: raise RuntimeError(f'B43_V4R2_PARENT_BLOB_DRIFT {rel} expected={expected} actual={actual}')
          
          b42=json.loads((base/'player_role_v2_b42_v4_scientific_decision.json').read_text())
          assert b42['result']=='SCIENTIFIC_STOP_B42_V4_OWNER_BLIND_ROLE_PARITY_FAILED'
          assert b42['production_change_authorized'] is False and b42['production_model_deployed'] is False
          v1=json.loads((base/'player_role_v2_b43_v1_scientific_decision.json').read_text())
          assert v1['result']=='SCIENTIFIC_STOP_B43_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FAILED'
          v2=json.loads((base/'player_role_v2_b43_v2r1_scientific_decision.json').read_text())
          assert v2['result']=='SCIENTIFIC_STOP_B43_V2R1_OWNER_BLIND_IDENTITY_BRIDGE_FEASIBILITY_FAILED'
          assert v2['eligible_for_B44_owner_blind_reaudit'] is False
          v3=json.loads((base/'player_role_v2_b43_v3r2_scientific_decision.json').read_text())
          assert v3['result']=='SCIENTIFIC_STOP_B43_V3R2_EXACT_ESPN_ID_BRIDGE_FAILED'
          assert v3['all_primary_gates_pass'] is False
          assert v3['eligible_for_B44_owner_blind_reaudit'] is False
          assert v3['supplemental_accepted_count']==0
          v3e=json.loads((base/'player_role_v2_b43_v3r2_evidence.json').read_text())
          assert v3e['current_owner_blind_population']['eligible_gsis_rows']==1398
          assert v3e['reference_validation']['comparisons']==382
          assert v3e['current_owner_blind_population']['provisional_exact_espn_proposal_count']==0
          assert v3e['production_change_authorized'] is False and v3e['production_model_deployed'] is False
          
          for rel in [
              'player_role_v2_b43_v4_preregistration.json',
              'player_role_v2_b43_v4_identity_bridge_evaluator.py',
              'player_role_v2_b43_v4_sleeper_gsis_identity_snapshot.csv',
              'player_role_v2_b43_v4_identity_bridge.csv',
              'player_role_v2_b43_v4_evidence.json',
              'player_role_v2_b43_v4_report.md',
              'player_role_v2_b43_v4_scientific_decision.json',
          ]:
              if (base/rel).exists(): raise RuntimeError(f'B43_V4R2_BLOCKED_V4_ARTIFACT_EXISTS_REFUSE_RUN {rel}')
          for rel in [
              'player_role_v2_b43_v4r1_preregistration.json',
              'player_role_v2_b43_v4r1_identity_bridge_evaluator.py',
              'player_role_v2_b43_v4r1_sleeper_gsis_identity_snapshot.csv',
              'player_role_v2_b43_v4r1_identity_bridge.csv',
              'player_role_v2_b43_v4r1_evidence.json',
              'player_role_v2_b43_v4r1_report.md',
              'player_role_v2_b43_v4r1_scientific_decision.json',
          ]:
              if (base/rel).exists(): raise RuntimeError(f'B43_V4R2_BLOCKED_V4R1_ARTIFACT_EXISTS_REFUSE_RUN {rel}')
          for rel in [
              'player_role_v2_b43_v4r2_preregistration.json',
              'player_role_v2_b43_v4r2_identity_bridge_evaluator.py',
              'player_role_v2_b43_v4r2_sleeper_gsis_identity_snapshot.csv',
              'player_role_v2_b43_v4r2_identity_bridge.csv',
              'player_role_v2_b43_v4r2_evidence.json',
              'player_role_v2_b43_v4r2_report.md',
              'player_role_v2_b43_v4r2_scientific_decision.json',
          ]:
              if (base/rel).exists(): raise RuntimeError(f'B43_V4R2_ONE_SHOT_ARTIFACT_ALREADY_EXISTS_REFUSE_RERUN {rel}')
          print('PASS: B42/B43 STOP lineage verified; B43 V4R2 namespace unused; production protected.')
          PYPREFLIGHT

      - name: Materialize and hash B43 V4R2 criteria before any V4R2 identity result
        shell: bash
        run: |
          set -euo pipefail
          EVALUATOR="$BASE/player_role_v2_b43_v4r2_identity_bridge_evaluator.py"
          PREREG="$BASE/player_role_v2_b43_v4r2_preregistration.json"
          cat > "$EVALUATOR" <<'PY_B43_V4R2_EVALUATOR'
          #!/usr/bin/env python3
          from __future__ import annotations
          
          import argparse
          import csv
          import hashlib
          import io
          import json
          import re
          import tempfile
          import time
          import unicodedata
          from collections import Counter, defaultdict
          from pathlib import Path
          
          import requests
          
          SUPPORTED_MODEL_POSITIONS = {"QB", "RB", "WR", "TE", "K", "DL", "LB", "DB"}
          MISSING = {"", "na", "nan", "none", "null", "n/a"}
          SUFFIX_TOKENS = {"jr", "sr", "ii", "iii", "iv", "v"}
          REFERENCE_MIN_COMPARISONS = 500
          FORMER_POPULATION_COVERAGE_GATE = 0.995
          EXPECTED_STABLE_CROSSWALK_SHA256 = "de241875e4ae91d43bbc7fbff682521da2abc9535028f952a35cb3305106c0a5"
          EXPECTED_B41I_SHA256 = "d531dcff2d3ff681f02210d314f6e9f16c671c0beefa85fd311a55363675d4cc"
          EXPECTED_B42_ELIGIBILITY_SHA256 = "fb1e12405eec27cf8d512f1abcbba58232d8957b84e6c515ac4025382c218f34"
          
          
          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()
          
          
          def sha256_file(path: Path) -> str:
              return sha256_bytes(path.read_bytes())
          
          
          def clean(value) -> str:
              x = str(value if value is not None else "").strip()
              return "" if x.casefold() in MISSING else x
          
          
          def parse_numeric_id(value) -> str | None:
              x = clean(value)
              if not x:
                  return None
              if re.fullmatch(r"\d+\.0+", x):
                  x = x.split(".", 1)[0]
              return x if re.fullmatch(r"\d+", x) else None
          
          
          def canonical_name(value) -> str:
              x = clean(value)
              if not x:
                  return ""
              x = unicodedata.normalize("NFKD", x)
              x = "".join(ch for ch in x if not unicodedata.combining(ch))
              x = x.casefold()
              x = re.sub(r"[^a-z0-9]+", " ", x)
              tokens = [t for t in x.split() if t]
              while tokens and tokens[-1] in SUFFIX_TOKENS:
                  tokens.pop()
              out=[]
              i=0
              while i < len(tokens):
                  if len(tokens[i]) == 1:
                      j=i
                      initials=[]
                      while j < len(tokens) and len(tokens[j]) == 1:
                          initials.append(tokens[j]); j += 1
                      if len(initials) >= 2:
                          out.append("".join(initials)); i=j; continue
                  out.append(tokens[i]); i += 1
              return " ".join(out)
          
          
          def position_family(value) -> str:
              p = clean(value).upper()
              if p == "QB": return "QB"
              if p in {"RB", "HB", "FB"}: return "RB"
              if p == "WR": return "WR"
              if p == "TE": return "TE"
              if p in {"K", "PK"}: return "K"
              if p in {"DL", "DE", "DT", "NT", "ED", "EDGE", "LB", "ILB", "OLB"}: return "FRONT7"
              if p in {"DB", "CB", "S", "FS", "SS"}: return "DB"
              return ""
          
          
          def row_name(row: dict) -> str:
              return clean(row.get("display_name")) or clean(row.get("full_name")) or clean(row.get("football_name"))
          
          
          def write_json(path: Path, payload: dict) -> None:
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          
          
          def source_get(session: requests.Session, url: str) -> bytes:
              last=None
              for attempt in range(4):
                  try:
                      r=session.get(url, timeout=45)
                      r.raise_for_status()
                      return r.content
                  except Exception as e:
                      last=e
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"B43_V4R2_SOURCE_FETCH_FAILED url={url} error={last}")
          
          
          def load_csv_bytes(data: bytes) -> list[dict]:
              return list(csv.DictReader(io.StringIO(data.decode("utf-8-sig"))))
          
          
          def load_crosswalk_bytes(data: bytes):
              rows=load_csv_bytes(data)
              if not rows or not {"gsis_id","sleeper_id"}.issubset(rows[0]):
                  raise RuntimeError("B43_V4R2_CROSSWALK_SCHEMA")
              exact={}
              inverse={}
              missing_gsis=0
              for row in rows:
                  sid=parse_numeric_id(row.get("sleeper_id"))
                  g=clean(row.get("gsis_id"))
                  if sid and not g:
                      missing_gsis += 1
                  if not sid or not g:
                      continue
                  if g in exact and exact[g] != sid:
                      raise RuntimeError(f"B43_V4R2_AMBIGUOUS_GSIS_CROSSWALK gsis={g}")
                  if sid in inverse and inverse[sid] != g:
                      raise RuntimeError(f"B43_V4R2_AMBIGUOUS_SLEEPER_CROSSWALK sleeper={sid}")
                  exact[g]=sid
                  inverse[sid]=g
              return exact,inverse,{"exact_pair_count":len(exact),"rows_with_sleeper_id_but_missing_gsis":missing_gsis}
          
          
          def load_b41i(path: Path):
              if sha256_file(path) != EXPECTED_B41I_SHA256:
                  raise RuntimeError("B43_V4R2_B41I_SHA_DRIFT")
              rows=list(csv.DictReader(path.open(encoding="utf-8-sig", newline="")))
              if not rows:
                  raise RuntimeError("B43_V4R2_B41I_EMPTY")
              required={"gsis_id","position","birth_date"}
              missing=required-set(rows[0])
              if missing:
                  raise RuntimeError(f"B43_V4R2_B41I_REQUIRED_COLUMNS_MISSING {sorted(missing)}")
              by_gsis={}
              for r in rows:
                  g=clean(r.get("gsis_id"))
                  if not g:
                      continue
                  if g in by_gsis:
                      raise RuntimeError(f"B43_V4R2_DUPLICATE_B41I_GSIS {g}")
                  nm=row_name(r)
                  by_gsis[g]={
                      "gsis_id":g,
                      "name":nm,
                      "name_key":canonical_name(nm),
                      "position_family":position_family(r.get("position") or r.get("position_group")),
                      "birth_date":clean(r.get("birth_date")),
                  }
              return by_gsis, rows[0].keys()
          
          
          def load_current(base: Path, b41i_by_gsis: dict):
              p=base/"player_role_v2_b42_v4_role_eligibility.csv"
              if sha256_file(p) != EXPECTED_B42_ELIGIBILITY_SHA256:
                  raise RuntimeError("B43_V4R2_B42_ELIGIBILITY_SHA_DRIFT")
              rows=list(csv.DictReader(p.open(encoding="utf-8-sig", newline="")))
              current=[]
              for r in rows:
                  g=clean(r.get("gsis_id"))
                  model_pos=clean(r.get("position"))
                  if not g or model_pos not in SUPPORTED_MODEL_POSITIONS:
                      continue
                  meta=b41i_by_gsis.get(g,{})
                  name=clean(r.get("player_name")) or clean(meta.get("name"))
                  current.append({
                      "gsis_id":g,
                      "player_name":name,
                      "name_key":canonical_name(name),
                      "model_position":model_pos,
                      "position_family":position_family(model_pos),
                      "birth_date":clean(meta.get("birth_date")),
                  })
              if len({x["gsis_id"] for x in current}) != len(current):
                  raise RuntimeError("B43_V4R2_DUPLICATE_CURRENT_GSIS")
              return current
          
          
          def sleeper_records_from_payload(data: bytes):
              raw=json.loads(data.decode("utf-8"))
              if not isinstance(raw,dict):
                  raise RuntimeError("B43_V4R2_SLEEPER_PAYLOAD_NOT_OBJECT")
              records=[]
              for key,obj in raw.items():
                  if not isinstance(obj,dict):
                      continue
                  sid=parse_numeric_id(obj.get("player_id")) or parse_numeric_id(key)
                  if not sid:
                      continue
                  gsis=clean(obj.get("gsis_id"))
                  full=clean(obj.get("full_name"))
                  if not full:
                      full=" ".join(x for x in [clean(obj.get("first_name")),clean(obj.get("last_name"))] if x).strip()
                  records.append({
                      "sleeper_id":sid,
                      "gsis_id":gsis,
                      "full_name":full,
                      "name_key":canonical_name(full),
                      "position":clean(obj.get("position")),
                      "position_family":position_family(obj.get("position")),
                      "birth_date":clean(obj.get("birth_date")),
                      "nfl_team":clean(obj.get("team")).upper(),
                      "status":clean(obj.get("status")),
                  })
              return raw,records
          
          
          def candidate_by_gsis(row: dict, sleeper_by_gsis: dict[str,list[dict]]):
              gid=clean(row.get("gsis_id"))
              if not gid:
                  return None
              # A duplicated direct GSIS claim in Sleeper is inconsistent source data and fails closed
              # before any name, position, or DOB filtering.
              raw=sleeper_by_gsis.get(gid,[])
              if len(raw) != 1:
                  return None
              x=raw[0]
              if x["gsis_id"] != gid:
                  return None
              if not x["position_family"] or x["position_family"] != row["position_family"]:
                  return None
              if not x["name_key"] or x["name_key"] != row["name_key"]:
                  return None
              row_bd=clean(row.get("birth_date"))
              sleeper_bd=clean(x.get("birth_date"))
              if row_bd and sleeper_bd and row_bd != sleeper_bd:
                  return None
              return x
          
          
          def current_source_supersession_safe(current_row: dict, candidate: dict, old_gsis: str, current_gsis_set: set[str]) -> bool:
              # A validated, direct current Sleeper GSIS claim may supersede only a historical inverse
              # claim whose old GSIS is outside the frozen current-eligible population. The old crosswalk
              # is never rewritten; this applies only to the current bridge overlay.
              if not old_gsis or old_gsis == current_row["gsis_id"]:
                  return False
              if old_gsis in current_gsis_set:
                  return False
              if clean(candidate.get("gsis_id")) != current_row["gsis_id"]:
                  return False
              if candidate.get("name_key") != current_row.get("name_key"):
                  return False
              if candidate.get("position_family") != current_row.get("position_family"):
                  return False
              row_bd=clean(current_row.get("birth_date"))
              sleeper_bd=clean(candidate.get("birth_date"))
              # Overriding an existing historical stable claim requires positive,
              # independent DOB confirmation. Missing DOB is not enough.
              if not row_bd or not sleeper_bd or row_bd != sleeper_bd:
                  return False
              return True
          
          
          def protocol_payload() -> dict:
              return {
                  "schema_version":1,
                  "study_id":"player-role-v2",
                  "phase":"B43-v4r2-objective-respecification-direct-sleeper-gsis-id-current-source-extension",
                  "status":"FROZEN_BEFORE_B43_V4R2_IDENTITY_RESULTS",
                  "motivation":(
                      "B43 V3R2 reached a valid scientific STOP because exact ESPN IDs produced only 382 known-pair trials and zero target-population supplements. "
                      "B43 V4R2 prospectively re-specifies the B43 objective before any V4R1/V4R2 identity result: population-wide coverage is descriptive only, while the exact direct-Sleeper-GSIS precision safeguards remain hard gates and B44 retains the unchanged rostered acceptance gates."
                  ),
                  "scientific_boundary":{
                      "B42_B43V1_B43V2R1_B43V3R2_results_are_prior_observed_evidence":True,
                      "B43_V4R2_is_post_stop_remediation_not_independent_confirmation":True,
                      "B43_V4R1_was_approved_but_never_run_and_produced_no_identity_result":True,
                      "B43_V4_was_blocked_pre_run_and_produced_no_identity_result":True,
                      "B43_may_not_parse_or_use_league_rosters":True,
                      "B43_may_not_use_owner_identity_or_fantasy_roster_partition":True,
                      "player_specific_exceptions_allowed":False,
                      "role_model_or_tier_changes_allowed":False,
                      "B42_or_B43_miss_lists_may_not_be_hard_coded":True,
                  },
                  "owner_objective":"Players on fantasy rosters must be correctly identified and receive roles; deep depth players matching is not a product requirement.",
                  "objective_respecification":{
                      "date":"2026-10-07",
                      "made_before_any_B43_V4R1_or_V4R2_identity_result":True,
                      "population_coverage_gate_removed":True,
                      "replacement_threshold_introduced":False,
                      "rationale":"The 99.5% population coverage screen was an underived proxy for B44. B44's unchanged rostered per-team gates (>=98% per team, <=2pp range) are the actual acceptance test.",
                      "precision_gates_unchanged_and_hard":True,
                      "B44_gates_unchanged":True,
                      "prior_same_population_stops":["B43_V1","B43_V2R1","B43_V3R2"],
                  },
                  "sources":{
                      "current_population":"exact frozen B42 V4 owner-blind role-eligibility artifact",
                      "current_identity_truth":"exact frozen B41I nflverse players.csv snapshot for canonical name, position family, and DOB contradiction safeguards",
                      "reference_pairs":"B41G-pinned DynastyProcess GSIS<->Sleeper crosswalk, used only as known-pair validation truth and historical inverse evidence",
                      "candidate_sleeper_identity_source":"newly frozen https://api.sleeper.app/v1/players/nfl bytes; Sleeper object's gsis_id is the direct current identifier",
                  },
                  "matching_rule":(
                      "GSIS_ID_EXACT: frozen current GSIS ID must equal Sleeper object's nonmissing gsis_id exactly; that GSIS ID must occur on exactly one raw Sleeper player record before filtering; "
                      "the candidate must also match canonical name and compatible position family, and a conflicting nonmissing birth date vetoes the match"
                  ),
                  "dob_contradiction_veto":True,
                  "duplicate_sleeper_gsis_id_policy":"Any GSIS ID represented by more than one raw Sleeper player record is ambiguous and cannot produce a candidate, even if later filtering would leave one match.",
                  "position_compatibility":"QB exact; RB/HB/FB -> RB; WR exact; TE exact; K/PK -> K; DL/DE/DT/NT/ED/EDGE/LB/ILB/OLB -> FRONT7; DB/CB/S/FS/SS -> DB",
                  "historical_inverse_supersession":{
                      "specified_after_B43_V3R2_and_prior_identity_stops":True,
                      "may_override_historical_stable_inverse_claim_for_current_overlay_only":True,
                      "requirements":[
                          "the exact GSIS rule is independently eligible under at least 500 known-pair comparisons with zero conflicts",
                          "the old stable GSIS claimant is outside the frozen B42 current-eligible population",
                          "the unique Sleeper candidate directly exposes the current GSIS ID",
                          "the Sleeper candidate matches the frozen current player's canonical name and compatible position family",
                          "the frozen B41I current identity and the Sleeper candidate both have nonmissing birth dates and those birth dates are exactly equal",
                          "no second current-eligible GSIS row claims the same Sleeper ID",
                      ],
                      "historical_stable_crosswalk_is_not_mutated":True,
                      "supersession_applies_only_to_current_bridge_overlay":True,
                      "a_historical_inverse_claim_by_another_current_player_is_never_superseded":True,
