                  fields=["sleeper_id","gsis_id","full_name","name_key","position","position_family","birth_date","nfl_team","status"]
                  w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
                  for x in sorted(sleeper_records,key=lambda z:(int(z["sleeper_id"]),z["name_key"])):
                      w.writerow({k:x.get(k,"") or "" for k in fields})
          
              bridge=out/"player_role_v2_b43_v4r2_identity_bridge.csv"
