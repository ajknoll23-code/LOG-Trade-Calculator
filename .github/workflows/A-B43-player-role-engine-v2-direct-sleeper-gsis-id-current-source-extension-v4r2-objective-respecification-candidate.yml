          def evaluate_core(current: list[dict], stable: dict[str,str], stable_inverse: dict[str,str], sleeper_records: list[dict], reference_min: int):
              current_set={x["gsis_id"] for x in current}
              sleeper_by_id={x["sleeper_id"]:x for x in sleeper_records}
              sleeper_by_gsis=defaultdict(list)
              for x in sleeper_records:
                  if x["gsis_id"]:
                      sleeper_by_gsis[x["gsis_id"]].append(x)
              duplicate_sleeper_gsis_ids={g:v for g,v in sleeper_by_gsis.items() if len(v)>1}
          
              comparisons=correct=conflicts=0
              conflict_details=[]
              birth_date_comparable=birth_date_agree=birth_date_disagree=0
              for row in current:
                  ref_sid=stable.get(row["gsis_id"])
                  if not ref_sid:
                      continue
                  ref_record=sleeper_by_id.get(ref_sid)
                  if ref_record:
                      nfl_bd=clean(row.get("birth_date")); sleeper_bd=clean(ref_record.get("birth_date"))
                      if nfl_bd and sleeper_bd:
                          birth_date_comparable += 1
                          if nfl_bd == sleeper_bd: birth_date_agree += 1
                          else: birth_date_disagree += 1
                  pred=candidate_by_gsis(row,sleeper_by_gsis)
                  if not pred:
                      continue
                  comparisons += 1
                  if pred["sleeper_id"] == ref_sid:
                      correct += 1
                  else:
                      conflicts += 1
                      conflict_details.append({"gsis_id":row["gsis_id"],"predicted_sleeper_id":pred["sleeper_id"],"reference_sleeper_id":ref_sid})
          
              rule_eligible=bool(comparisons>=reference_min and conflicts==0)
          
              provisional=[]
              for row in current:
                  g=row["gsis_id"]
                  if g in stable:
                      continue
                  pred=candidate_by_gsis(row,sleeper_by_gsis)
                  if not pred:
                      continue
                  provisional.append({
                      "gsis_id":g,
                      "sleeper_id":pred["sleeper_id"],
                      "source_gsis_id":pred["gsis_id"],
                      "rule":"GSIS_ID_EXACT",
                      "name_key":row["name_key"],
                      "model_position":row["model_position"],
                      "position_family":row["position_family"],
                      "stable_conflict_gsis":"",
                      "historical_inverse_supersession":False,
                      "birth_date":row.get("birth_date") or "",
                  })
          
              sid_counts=Counter(x["sleeper_id"] for x in provisional)
              row_by_gsis={x["gsis_id"]:x for x in current}
              accepted=[]
              supersessions=[]
              unadjudicated=[]
              for x in provisional:
                  if sid_counts[x["sleeper_id"]] != 1:
                      unadjudicated.append({**x,"reason":"current_current_sleeper_collision"})
                      continue
                  old=stable_inverse.get(x["sleeper_id"])
                  if old and old!=x["gsis_id"]:
                      current_row=row_by_gsis[x["gsis_id"]]
                      candidate=sleeper_by_id[x["sleeper_id"]]
                      if current_source_supersession_safe(current_row,candidate,old,current_set):
                          y=dict(x)
                          y["stable_conflict_gsis"]=old
                          y["historical_inverse_supersession"]=True
                          accepted.append(y)
                          supersessions.append({"gsis_id":x["gsis_id"],"sleeper_id":x["sleeper_id"],"old_stable_gsis":old})
                      else:
                          unadjudicated.append({**x,"reason":"historical_inverse_collision_not_safe_to_supersede","old_stable_gsis":old})
                      continue
                  accepted.append(x)
          
              if not rule_eligible:
                  accepted=[]
                  supersessions=[]
          
              if len({x["gsis_id"] for x in accepted}) != len(accepted):
                  raise RuntimeError("B43_V4R2_ACCEPTED_GSIS_NOT_ONE_TO_ONE")
              if len({x["sleeper_id"] for x in accepted}) != len(accepted):
                  raise RuntimeError("B43_V4R2_ACCEPTED_SLEEPER_NOT_ONE_TO_ONE")
              for x in accepted:
                  if x["source_gsis_id"] != x["gsis_id"]:
                      raise RuntimeError("B43_V4R2_ACCEPTED_SOURCE_GSIS_MISMATCH")
                  old=stable_inverse.get(x["sleeper_id"])
                  if old and old!=x["gsis_id"] and not x["historical_inverse_supersession"]:
                      raise RuntimeError("B43_V4R2_UNADJUDICATED_STABLE_CONFLICT_ENTERED_BRIDGE")
          
              base_mapped=sum(1 for x in current if x["gsis_id"] in stable)
              accepted_gsis={x["gsis_id"] for x in accepted}
              combined=sum(1 for x in current if x["gsis_id"] in stable or x["gsis_id"] in accepted_gsis)
              coverage=combined/len(current)
              gates={
                  "no_roster_or_owner_context":True,
                  "minimum_exact_gsis_reference_comparisons":comparisons>=reference_min,
                  "zero_exact_gsis_reference_conflicts":conflicts==0,
                  "exact_gsis_rule_independently_validated":rule_eligible,
                  "zero_unadjudicated_identity_conflicts":len(unadjudicated)==0,
                  "minimum_supplemental_mapping_count":len(accepted)>=1,
              }
              return {
                  "sleeper_by_gsis":sleeper_by_gsis,
                  "duplicate_sleeper_gsis_ids":duplicate_sleeper_gsis_ids,
                  "comparisons":comparisons,"correct":correct,"conflicts":conflicts,"conflict_details":conflict_details,
                  "birth_date_comparable":birth_date_comparable,"birth_date_agree":birth_date_agree,"birth_date_disagree":birth_date_disagree,
                  "rule_eligible":rule_eligible,
                  "provisional":provisional,"accepted":accepted,"supersessions":supersessions,"unadjudicated":unadjudicated,
                  "base_mapped":base_mapped,"combined":combined,"coverage":coverage,"gates":gates,"all_pass":all(gates.values()),
              }
          
          
          def write_result_outputs(out: Path, current: list[dict], sleeper_records: list[dict], core: dict, source_integrity: dict, cross_audit: dict) -> dict:
              out.mkdir(parents=True,exist_ok=True)
              snap=out/"player_role_v2_b43_v4r2_sleeper_gsis_identity_snapshot.csv"
