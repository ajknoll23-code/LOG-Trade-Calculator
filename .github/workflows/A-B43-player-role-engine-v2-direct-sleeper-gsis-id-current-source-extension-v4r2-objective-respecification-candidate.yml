          def run_selftest():
              assert canonical_name("Generic Player Jr.") == "generic player"
              assert canonical_name("A. J. Example") == canonical_name("AJ Example")
              assert parse_numeric_id("1234.0") == "1234"
              assert parse_numeric_id("NA") is None
              row={"gsis_id":"GNEW","player_name":"AJ Example","name_key":"aj example","model_position":"DB","position_family":"DB","birth_date":"2001-02-03"}
              one={"GNEW":[{"sleeper_id":"7","gsis_id":"GNEW","full_name":"A.J. Example","name_key":"aj example","position":"CB","position_family":"DB","birth_date":"2001-02-03","nfl_team":"ARI","status":"Active"}]}
              assert candidate_by_gsis(row,one)["sleeper_id"]=="7"
              duplicate={"GNEW":[one["GNEW"][0],{"sleeper_id":"8","gsis_id":"GNEW","full_name":"Different Person","name_key":"different person","position":"WR","position_family":"WR","birth_date":"1999-01-01","nfl_team":"ARI","status":"Inactive"}]}
              assert candidate_by_gsis(row,duplicate) is None
              dob={"GNEW":[{**one["GNEW"][0],"birth_date":"1998-09-09"}]}
              assert candidate_by_gsis(row,dob) is None
              assert current_source_supersession_safe(row,one["GNEW"][0],"GOLD",{"GNEW"}) is True
              assert current_source_supersession_safe(row,one["GNEW"][0],"GOLD",{"GNEW","GOLD"}) is False
              missing_dob_candidate={**one["GNEW"][0],"birth_date":""}
              assert candidate_by_gsis(row,{"GNEW":[missing_dob_candidate]})["sleeper_id"]=="7"
              assert current_source_supersession_safe(row,missing_dob_candidate,"GOLD",{"GNEW"}) is False
              assert current_source_supersession_safe(row,dob["GNEW"][0],"GOLD",{"GNEW"}) is False
          
              current=[
                  {"gsis_id":"G1","player_name":"One","name_key":"one","model_position":"QB","position_family":"QB","birth_date":"2000-01-01"},
                  {"gsis_id":"G2","player_name":"Two","name_key":"two","model_position":"WR","position_family":"WR","birth_date":"2001-01-01"},
                  {"gsis_id":"G3","player_name":"Three","name_key":"three","model_position":"DB","position_family":"DB","birth_date":"2002-01-01"},
              ]
              records=[
                  {"sleeper_id":"11","gsis_id":"G1","full_name":"One","name_key":"one","position":"QB","position_family":"QB","birth_date":"2000-01-01","nfl_team":"A","status":"Active"},
                  {"sleeper_id":"12","gsis_id":"G2","full_name":"Two","name_key":"two","position":"WR","position_family":"WR","birth_date":"2001-01-01","nfl_team":"B","status":"Active"},
                  {"sleeper_id":"13","gsis_id":"G3","full_name":"Three","name_key":"three","position":"CB","position_family":"DB","birth_date":"2002-01-01","nfl_team":"C","status":"Active"},
              ]
              stable={"G1":"11","G2":"12"}; inverse={"11":"G1","12":"G2"}
              core=evaluate_core(current,stable,inverse,records,reference_min=2)
              assert core["all_pass"] is True and len(core["accepted"])==1 and core["coverage"]==1.0
              # Objective-respecification test: all hard precision gates can PASS even when
              # population coverage is below the former 0.995 screen.
              current_low=current + [
                  {"gsis_id":"G4","player_name":"Four","name_key":"four","model_position":"RB","position_family":"RB","birth_date":"2003-01-01"},
                  {"gsis_id":"G5","player_name":"Five","name_key":"five","model_position":"TE","position_family":"TE","birth_date":"2004-01-01"},
              ]
              low=evaluate_core(current_low,stable,inverse,records,reference_min=2)
              assert low["all_pass"] is True
              assert low["coverage"] < FORMER_POPULATION_COVERAGE_GATE
              assert "minimum_base_plus_supplemental_current_eligible_coverage" not in low["gates"]
              with tempfile.TemporaryDirectory() as td:
                  evidence=write_result_outputs(Path(td),current_low,records,low,{"synthetic":True}, {"synthetic":True})
                  assert evidence["all_primary_gates_pass"] is True
                  assert evidence["result"]=="PASS_B43_V4R2_DIRECT_SLEEPER_GSIS_BRIDGE_FROZEN_FOR_B44_REAUDIT"
                  assert evidence["population_coverage_descriptive"]["combined_coverage"] < FORMER_POPULATION_COVERAGE_GATE
                  assert evidence["population_coverage_descriptive"]["used_as_primary_gate"] is False
                  assert evidence["population_coverage_descriptive"]["former_gate_threshold"] == FORMER_POPULATION_COVERAGE_GATE
                  assert evidence["population_coverage_descriptive"]["removed_by_prospective_owner_objective_amendment"] is True
                  assert (Path(td)/"player_role_v2_b43_v4r2_evidence.json").exists()
                  assert (Path(td)/"player_role_v2_b43_v4r2_report.md").exists()
                  assert (Path(td)/"player_role_v2_b43_v4r2_scientific_decision.json").exists()
              sample=b"gsis_id,sleeper_id\nNA,100\n,101\nG1,102\n"
              exact,inv,audit=load_crosswalk_bytes(sample)
              assert exact=={"G1":"102"} and inv=={"102":"G1"} and audit["rows_with_sleeper_id_but_missing_gsis"]==2
              print("PASS B43 V4R2 evaluator self-test")
          
          
          def source_preflight(repo: Path, out: Path, session: requests.Session):
              base=repo/"research/player-role-v2"
              b41i=base/"frozen_inputs/players_b41i_snapshot.csv"
              if sha256_file(b41i)!=EXPECTED_B41I_SHA256:
                  raise RuntimeError("B43_V4R2_B41I_SHA_DRIFT")
              with b41i.open(encoding="utf-8-sig",newline="") as f:
                  reader=csv.reader(f); header=next(reader,None)
              if not header or not {"gsis_id","position","birth_date"}.issubset(set(header)):
                  raise RuntimeError("B43_V4R2_B41I_IDENTITY_SCHEMA_MISSING")
          
              prereg=json.loads((base/"player_role_v2_b41g_holdout_validation_preregistration.json").read_text())
              commit=prereg["frozen_inputs"]["stable_id_crosswalk_commit"]
