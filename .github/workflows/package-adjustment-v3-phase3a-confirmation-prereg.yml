name: Package Adjustment V3 - Phase 3A Fresh Confirmation Preregistration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard frozen Phase 2 candidate family
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase2.py)" = \
            "d58c8802c1133a97bae0ae0903dc421f27265b58"

          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase2_candidate_family.json)" = \
            "a43f4998a0f2dc80eb50078d9a599c2bea77464c"

          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase2_preregistration.json)" = \
            "93139c9b9fdd4dbd06700e1b15d6783769eb98d5"

          test "$(git hash-object research/package-adjustment-v3-ktc-style/phase2_manifest.json)" = \
            "2d033096ef9b112e7ecd54ad9c88677203b369bd"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("research/package-adjustment-v3-ktc-style/phase2_candidate_family.json")
              .read_text(encoding="utf-8")
          )

          assert p["decision"] == "PASS_V3_PHASE2_FAMILY_FROZEN_FOR_FRESH_CONFIRMATION"
          assert p["production_change_authorized"] is False
          assert p["fresh_confirmation_family_ids"] == [
              "power-g2.01",
              "power-g2.15",
              "power-g2.30",
          ]
          assert p["development_reference_candidate_id"] == "power-g2.01"
          assert p["governance"]["old_900_vote_dataset_read"] is False

          manifest = json.loads(
              Path("research/package-adjustment-v3-ktc-style/phase2_manifest.json")
              .read_text(encoding="utf-8")
          )
          assert manifest["candidate_family_fingerprint_sha256"] == \
              "c8610b7ac74631ed87cf52490f8368cfd3805034725cdb59fbed0d76a3b885ed"

          print("PASS: exact frozen Phase 2 family verified.")
          PY

      - name: Guard production and old evidence remain untouched
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            index.html \
            research/package-adjustment-production-candidate-v1/live_deployment.json \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md \
            research/package-adjustment-v1/prospective/trade_evidence.json \
            > "${RUNNER_TEMP}/protected_before.sha256"

          python3 - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(
              Path("research/package-adjustment-production-candidate-v1/live_deployment.json")
              .read_text(encoding="utf-8")
          )
          assert live["status"] == "controlled_live"
          assert live["production_revision"] == "v1.6-v5-size2-composition-overlay"
          assert live["production_formula_enabled"] is True

          closeout = Path(
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_closeout_v1.md"
          ).read_text(encoding="utf-8")
          assert "exact 900-vote dataset is spent development evidence" in closeout

          print("PASS: production V1.6 and spent 900-vote evidence remain protected.")
          PY

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Freeze Phase 3 fresh-confirmation contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".")
          D = ROOT / "research/package-adjustment-v3-ktc-style"

          CFG = D / "phase3_confirmation_preregistration.json"
          MD = D / "phase3_confirmation_preregistration.md"
          MAN = D / "phase3_confirmation_preregistration_manifest.json"

          for path in (CFG, MD, MAN):
              if path.exists():
                  raise SystemExit(f"Refusing to overwrite existing Phase 3 preregistration: {path}")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          topologies = ["1v2", "1v3", "2v2", "2v3", "3v3", "3v4"]
          asset_mix_groups = ["players_only", "includes_picks"]
          disagreement_bands = ["g201_vs_g215", "g215_vs_g230"]

          research_cells = [
              f"{topology}|{asset_mix}|{band}"
              for topology in topologies
              for asset_mix in asset_mix_groups
              for band in disagreement_bands
          ]
          assert len(research_cells) == 24

          candidates = [
              {"id": "power-g2.01", "gamma": 2.01},
              {"id": "power-g2.15", "gamma": 2.15},
              {"id": "power-g2.30", "gamma": 2.30},
          ]

          config = {
              "schema_version": 1,
              "study_id": "package-adjustment-v3-ktc-style",
              "phase": "3A",
              "status": "FROZEN_FRESH_CONFIRMATION_PREREGISTRATION",
              "frozen": True,
              "research_only": True,
              "production_change_authorized": False,
              "production_revision_must_remain": "v1.6-v5-size2-composition-overlay",
              "candidate_family_fingerprint_sha256":
                  "c8610b7ac74631ed87cf52490f8368cfd3805034725cdb59fbed0d76a3b885ed",
              "candidate_family": candidates,
              "development_reference_candidate_id": "power-g2.01",
              "evidence_governance": {
                  "old_900_vote_dataset": "spent_and_prohibited",
                  "old_package_vote_namespaces_may_be_reused": False,
                  "five_ktc_examples":
                      "development_only_and_not_confirmation_ballots",
                  "eight_historical_league_trades":
                      "topology_scope_anchors_not_fairness_labels",
                  "candidate_predictions_may_be_used_to_select_new_challenges": True,
                  "why_prediction_targeting_is_allowed":
                      "The three candidate formulas were frozen before the catalog. "
                      "Challenge targeting uses only frozen model disagreement and no human outcomes.",
                  "fresh_human_outcomes_must_not_be_read_before_maturity_freeze": True,
              },
              "catalog_design": {
                  "catalog_must_be_generated_after_this_preregistration_is_committed": True,
                  "catalog_status_before_activation":
                      "frozen_unreleased_fresh_confirmation_catalog",
                  "new_vote_namespace": "__pkgv3c1__",
                  "old_namespace_rows_count_for_this_study": False,
                  "topologies": topologies,
                  "asset_mix_groups": asset_mix_groups,
                  "disagreement_bands": disagreement_bands,
                  "research_cells": research_cells,
                  "research_cell_count": 24,
                  "challenges_per_cell": 10,
                  "challenge_count": 240,
                  "display_side_randomization_required": True,
                  "values_hidden_from_voter_ui": True,
                  "candidate_identity_hidden_from_voter_ui": True,
                  "candidate_predictions_hidden_from_voter_ui": True,
                  "asset_pool": {
                      "players":
                          "currently rostered valued QB/RB/WR/TE/DL/LB/DB only",
                      "picks":
                          "2027-2029 rounds 1-4, early/mid/late variants",
                      "kickers_excluded": True,
                  },
                  "players_only_definition":
                      "every asset in the challenge is a player",
                  "includes_picks_definition":
                      "at least one draft pick and at least one player appear across the trade",
                  "raw_side_total_ratio_allowed": [0.80, 1.25],
                  "duplicate_asset_within_trade_allowed": False,
                  "duplicate_challenge_allowed": False,
                  "known_five_ktc_examples_excluded_exactly": True,
                  "known_eight_historical_trades_excluded_exactly": True,
                  "selection_priority": [
                      "must_match_research_cell",
                      "must_have_frozen_candidate_direction_disagreement",
                      "maximize_disagreement_score_margin",
                      "minimize_raw_total_imbalance",
                      "minimize_asset_reuse",
                      "deterministic_id_tiebreak",
                  ],
                  "disagreement_band_rules": {
                      "g201_vs_g215":
                          "sign(gamma2.01) != sign(gamma2.15) and "
                          "sign(gamma2.15) == sign(gamma2.30)",
                      "g215_vs_g230":
                          "sign(gamma2.01) == sign(gamma2.15) and "
                          "sign(gamma2.15) != sign(gamma2.30)",
                  },
              },
              "collection_and_maturity": {
                  "outcome_blind_until_exact_checkpoint_freeze": True,
                  "daily_valid_vote_cap_per_voter": 20,
                  "effective_lifetime_vote_cap_per_voter": 30,
                  "ballot_weight_rule":
                      "min(1,30/valid_post_daily_cap_ballot_count_for_voter)",
                  "minimum_distinct_voters": 30,
                  "minimum_effective_votes_per_cell": 15,
                  "minimum_distinct_voters_per_cell": 10,
                  "required_cell_count": 24,
                  "exact_effective_vote_checkpoints": [600, 700, 800],
                  "first_checkpoint": 600,
                  "hard_cap": 800,
                  "stop_rule":
                      "Stop at the first exact checkpoint where all coverage gates pass. "
                      "If 800 is reached without all gates, stop unresolved.",
                  "effect_direction_may_change_stopping": False,
                  "significance_may_change_stopping": False,
                  "candidate_performance_may_change_stopping": False,
              },
              "evaluation_plan_after_freeze": {
                  "canonical_outcome":
                      "catalog Side A preferred after undoing randomized display orientation",
                  "score_definition":
                      "sum(asset_fv ** gamma) on each canonical side",
                  "raw_additive_control_gamma": 1.0,
                  "models_compared": [
                      "raw-additive-control-g1.00",
                      "power-g2.01",
                      "power-g2.15",
                      "power-g2.30",
                  ],
                  "probability_link":
                      "logistic(beta * normalized_score_delta + delta_left * I(canonical_A_displayed_left))",
                  "beta_constraint": "beta > 0 via beta=exp(log_beta)",
                  "left_bias_parameter": "delta_left",
                  "calibration_parameters_refit_inside_each_training_fold": True,
                  "cross_validation":
                      "5-fold grouped by voter identity; a voter may appear in only one fold",
                  "primary_metric": "held-out log loss",
                  "candidate_selection":
                      "lowest mean held-out log loss among the three frozen gamma candidates",
                  "deployment_eligibility_gates": {
                      "minimum_log_loss_improvement_vs_raw_additive_control": 0.005,
                      "challenge_cluster_bootstrap_favorable_fraction_vs_raw_control": 0.90,
                      "maximum_topology_x_asset_mix_log_loss_regression_vs_raw_control": 0.03,
                      "all_24_cells_must_have_frozen_coverage_gate_pass": True,
                  },
                  "runner_up_rule":
                      "If the best and runner-up gamma candidates differ by less than 0.002 "
                      "mean held-out log loss, treat the gamma choice as unresolved rather than "
                      "using the development KTC examples as a tiebreaker.",
                  "production_change_if_gates_fail": False,
              },
              "activation_policy": {
                  "catalog_generation_does_not_activate_voting": True,
                  "website_patch_requires_separate_post_catalog_workflow": True,
                  "activation_must_start_a_new_valid_after_utc_cutoff": True,
                  "old_ballots_before_new_cutoff_are_excluded": True,
              },
          }

          CFG.write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Package Adjustment V3 — Phase 3 Fresh Confirmation Preregistration",
              "",
              "**Status:** `FROZEN_FRESH_CONFIRMATION_PREREGISTRATION`",
              "",
              "**Production remains V1.6. No voting is activated by this workflow.**",
              "",
              "## Frozen candidate family",
              "",
              "- `power-g2.01`",
              "- `power-g2.15`",
              "- `power-g2.30`",
              "",
              "The five KTC screenshots were development anchors only. They cannot select the winner.",
              "",
              "## Fresh catalog",
              "",
              "- 24 research cells",
              "- 6 topologies: 1v2, 1v3, 2v2, 2v3, 3v3, 3v4",
              "- 2 asset mixes: players-only and includes-picks",
              "- 2 candidate-disagreement bands",
              "- 10 challenges per cell",
              "- 240 total challenges",
              "- Candidate predictions are intentionally used to find discriminating trades, "
              "but are never shown to voters.",
              "- Exact prior KTC examples and the eight known completed league trades are excluded.",
              "",
              "## Fresh-vote stopping rule",
              "",
              "- 20 valid ballots per voter per UTC day",
              "- 30 effective lifetime ballots per voter",
              "- At least 30 distinct voters overall",
              "- At least 15 effective votes per research cell",
              "- At least 10 distinct voters per research cell",
              "- Exact checkpoints: 600, 700, 800 effective votes",
              "- Stop at the first checkpoint that passes every coverage gate",
              "- 800 is the hard cap; if coverage still fails, stop unresolved",
              "",
              "No response direction, significance, or candidate performance may affect stopping.",
              "",
              "## Evaluation after the exact checkpoint is frozen",
              "",
              "The three frozen gamma models are compared against a raw-additive gamma=1 control "
              "using voter-grouped 5-fold held-out log loss. Calibration scale and randomized-left "
              "bias are refit inside each training fold.",
              "",
              "A production successor is eligible only if it improves held-out log loss over the "
              "raw-additive control by at least 0.005, clears a 0.90 challenge-cluster bootstrap "
              "favorable fraction, and has no topology × asset-mix regression worse than 0.03.",
              "",
              "If the top two gamma candidates are within 0.002 held-out log loss, gamma selection "
              "is unresolved rather than broken using the five KTC development examples.",
              "",
              "The old 900-vote dataset is not part of this study.",
              "",
          ]
          MD.write_text("\n".join(lines), encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "study_id": config["study_id"],
              "phase": config["phase"],
              "status": "FROZEN_FRESH_CONFIRMATION_PREREGISTRATION_MANIFEST",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "production_change_authorized": False,
              "catalog_generated": False,
              "voting_activated": False,
              "human_vote_outcomes_read": False,
              "old_900_vote_dataset_read": False,
              "candidate_family_fingerprint_sha256":
                  config["candidate_family_fingerprint_sha256"],
              "preregistration_sha256": sha256(CFG),
              "preregistration_md_sha256": sha256(MD),
              "source_git_blobs": {
                  "phase2_candidate_family.json":
                      subprocess.check_output(
                          ["git", "hash-object",
                           "research/package-adjustment-v3-ktc-style/phase2_candidate_family.json"],
                          text=True,
                      ).strip(),
                  "phase2_preregistration.json":
                      subprocess.check_output(
                          ["git", "hash-object",
                           "research/package-adjustment-v3-ktc-style/phase2_preregistration.json"],
                          text=True,
                      ).strip(),
              },
          }
          MAN.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: Phase 3 fresh-confirmation contract frozen before catalog generation.")
          print("PHASE3_RESEARCH_CELL_COUNT=24")
          print("PHASE3_CHALLENGE_TARGET=240")
          print("PHASE3_FIRST_CHECKPOINT=600")
          print("PHASE3_HARD_CAP=800")
          PY

      - name: Validate preregistration contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          cfg = json.loads((d / "phase3_confirmation_preregistration.json").read_text())
          man = json.loads((d / "phase3_confirmation_preregistration_manifest.json").read_text())

          assert cfg["status"] == "FROZEN_FRESH_CONFIRMATION_PREREGISTRATION"
          assert cfg["frozen"] is True
          assert cfg["production_change_authorized"] is False
          assert cfg["candidate_family_fingerprint_sha256"] == \
              "c8610b7ac74631ed87cf52490f8368cfd3805034725cdb59fbed0d76a3b885ed"

          assert [x["gamma"] for x in cfg["candidate_family"]] == [2.01, 2.15, 2.30]
          assert cfg["catalog_design"]["research_cell_count"] == 24
          assert cfg["catalog_design"]["challenges_per_cell"] == 10
          assert cfg["catalog_design"]["challenge_count"] == 240
          assert cfg["catalog_design"]["new_vote_namespace"] == "__pkgv3c1__"

          maturity = cfg["collection_and_maturity"]
          assert maturity["exact_effective_vote_checkpoints"] == [600, 700, 800]
          assert maturity["minimum_distinct_voters"] == 30
          assert maturity["minimum_effective_votes_per_cell"] == 15
          assert maturity["minimum_distinct_voters_per_cell"] == 10
          assert maturity["hard_cap"] == 800

          gates = cfg["evaluation_plan_after_freeze"]["deployment_eligibility_gates"]
          assert gates["minimum_log_loss_improvement_vs_raw_additive_control"] == 0.005
          assert gates["challenge_cluster_bootstrap_favorable_fraction_vs_raw_control"] == 0.90
          assert gates["maximum_topology_x_asset_mix_log_loss_regression_vs_raw_control"] == 0.03

          assert man["catalog_generated"] is False
          assert man["voting_activated"] is False
          assert man["human_vote_outcomes_read"] is False
          assert man["old_900_vote_dataset_read"] is False

          print("PASS: Phase 3 preregistration validates exactly.")
          PY

      - name: Prove protected production/evidence files unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/protected_before.sha256"

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Guard exact research-only scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.json",
              "research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.md",
              "research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected Phase 3A changed-file set. "
                  f"Expected={sorted(expected)} Actual={sorted(actual)}"
              )

          print("PASS: exact Phase 3A research-only scope.")
          PY

      - name: Commit frozen Phase 3A preregistration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.json \
            research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration.md \
            research/package-adjustment-v3-ktc-style/phase3_confirmation_preregistration_manifest.json

          git diff --cached --check
          git commit -m "research: preregister package adjustment v3 fresh confirmation"
          git push origin HEAD:main

      - name: Final proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: Phase 3A preregistration frozen; catalog not generated; voting not activated."
