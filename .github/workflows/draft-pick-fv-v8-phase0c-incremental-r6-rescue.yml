name: Draft Pick FV V8 - Phase 0C Incremental R6 Rescue

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0c-incremental-r6-rescue
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0A prep and Phase 0B closeout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prep/p0a" "${RUNNER_TEMP}/prep/p0b"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10894002488" --jq '.digest')" = \
            "sha256:bb24b4ea7378936ea1f8b9504e631f566218a3bdf20297d19d5fe7657de32d5d"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10925470604" --jq '.digest')" = \
            "sha256:189d986491c4dc5bfa78cc76fc738aba3b96b638004ff17baa6402218e9aaa7c"

          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-prep" \
            -D "${RUNNER_TEMP}/prep/p0a"

          gh run download 36268881894 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0b-qualified-depth-feasibility-closeout" \
            -D "${RUNNER_TEMP}/prep/p0b"

          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = \
            "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/identity_crosswalk.json" | awk '{print $1}')" = \
            "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

      - name: Freeze incremental rescue contract and exact reuse plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          p0a=root/"p0a"
          p0b=root/"p0b"

          summary=json.loads(
              (p0b/"v8_phase0b_qualified_depth_feasibility.json").read_text()
          )
          evidence=json.loads(
              (p0b/"v8_phase0b_qualified_depth_exact_evidence.json").read_text()
          )

          assert summary["decision"]=="STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES"
          assert summary["candidate_universe_total_n"]==6203
          assert summary["exact_candidate_coverage"] is True
          assert summary["year_cells_passing_all_gates"]==64
          assert len(summary["year_cell"])==108
          assert summary["historical_outcome_ingestion_authorized"] is False
          assert summary["holdout_2024_outcomes_read"] is False
          assert summary["production_change_authorized"] is False
          assert all(v is False for v in summary["firewalls"].values())

          assert len(evidence["candidate_dispositions"])==6203
          assert evidence["historical_player_outcomes_read"] is False
          assert evidence["holdout_2024_outcomes_read"] is False
          assert evidence["candidate_fit_performed"] is False
          assert evidence["production_change_authorized"] is False

          mem=defaultdict(list)
          occ=defaultdict(list)
          dispositions={}

          for x in evidence["candidate_dispositions"]:
              key=(int(x["draft_year"]),str(x["league_id"]))
              assert key not in dispositions
              dispositions[key]=x

          for x in evidence["cell_memberships"]:
              mem[(int(x["draft_year"]),x["cell"])].append(x)

          for x in evidence["occurrences"]:
              occ[
                  (
                      int(x["draft_year"]),
                      x["cell"],
                      str(x["league_id"]),
                  )
              ].append(x)

          all_cells=sorted(
              (
                  int(v["draft_year"]),
                  v["cell"],
              )
              for v in summary["year_cell"].values()
          )
          assert len(all_cells)==108

          baseline={}
          baseline_occurrences={}
          for y,cell in all_cells:
              qids={
                  str(x["league_id"])
                  for x in mem[(y,cell)]
                  if x["status"]=="qualified"
              }
              usable=[]
              for lid in sorted(qids):
                  rows=occ[(y,cell,lid)]
                  if (
                      len(rows)==4
                      and len({
                          int(r["overall_slot"])
                          for r in rows
                      })==4
                      and all(
                          bool(r["identity_resolved"])
                          and bool(r["outcome_ready_sleeper_id"])
                          for r in rows
                      )
                  ):
                      usable.append(lid)
                      baseline_occurrences[
                          f"{y}:{cell}:{lid}"
                      ]=rows
              baseline[f"{y}:{cell}"]=usable

          reusable_cells=[
              key
              for key,lids in baseline.items()
              if len(lids)>=12
          ]
          deficient={
              key:{
                  "draft_year":int(key.split(":")[0]),
                  "cell":key.split(":",1)[1],
                  "baseline_fully_usable_n":len(lids),
                  "shortfall":12-len(lids),
              }
              for key,lids in baseline.items()
              if len(lids)<12
          }

          # This is the outcome-blind fact discovered from Phase 0B source
          # evidence: 91 cells already satisfy a 4/4 usable-source rule and
          # only 17 cells need rescue; all 17 are R6.
          assert len(reusable_cells)==91, len(reusable_cells)
          assert len(deficient)==17, len(deficient)
          assert all(
              x["cell"] in {"r6_early","r6_mid","r6_late"}
              for x in deficient.values()
          )
          assert sum(
              x["shortfall"] for x in deficient.values()
          )==80

          expected_deficits={
              "2018:r6_early":7,
              "2018:r6_mid":6,
              "2018:r6_late":6,
              "2019:r6_mid":1,
              "2019:r6_late":1,
              "2020:r6_early":8,
              "2020:r6_mid":8,
              "2020:r6_late":10,
              "2021:r6_early":7,
              "2021:r6_mid":7,
              "2021:r6_late":8,
              "2022:r6_early":1,
              "2022:r6_mid":1,
              "2022:r6_late":1,
              "2023:r6_early":3,
              "2023:r6_mid":2,
              "2023:r6_late":3
          }
          assert {
              k:v["shortfall"] for k,v in deficient.items()
          }==expected_deficits

          # Known Phase 0B format rejects and obvious mocks can never become
          # valid local-cell sources, so the rescue scan excludes them without
          # any new network request. The remaining exact frozen candidates are
          # ordered by a preregistered stable hash, independent of outcomes.
          rescue_seed="draft-pick-fv-v8-phase0c-r6-rescue-20260927"
          candidate_order={}
          candidate_status_counts={}
          max_rescue_candidates_by_year={}

          for y in range(2018,2024):
              disc=json.loads(
                  (
                      p0a/"discoveries"/f"discovery_{y}.json"
                  ).read_text()
              )
              ids=[str(x) for x in disc["candidate_ids"]]
              assert hashlib.sha256(
                  "\n".join(ids).encode()
              ).hexdigest()==disc["candidate_ids_sha256"]

              counts=Counter()
              pool=[]
              for lid in ids:
                  d=dispositions[(y,lid)]
                  counts[d["status"]]+=1
                  if d["status"] in {
                      "qualifier_reject",
                      "obvious_mock_reject",
                  }:
                      continue
                  pool.append(lid)

              pool.sort(
                  key=lambda lid:(
                      hashlib.sha256(
                          f"{rescue_seed}|{y}|{lid}".encode()
                      ).hexdigest(),
                      lid,
                  )
              )
              candidate_order[str(y)]=pool
              candidate_status_counts[str(y)]=dict(
                  sorted(counts.items())
              )
              max_rescue_candidates_by_year[str(y)]=len(pool)

          assert sum(
              max_rescue_candidates_by_year.values()
          )==2208

          contract={
              "schema_version":1,
              "study_id":
                  "draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":
                  "phase0c_incremental_r6_rescue_preregistration",
              "status":
                  "FROZEN_PRE_PHASE0C_RESCUE_PRE_OUTCOME",
              "reason":{
                  "phase0b_decision":
                      summary["decision"],
                  "phase0b_original_passing_cells":64,
                  "phase0b_additional_cells_already_4of4_usable":27,
                  "cells_reused_without_refetch":91,
                  "cells_requiring_rescue":17,
                  "all_rescue_cells_round":"R6",
                  "total_additional_league_cell_shortfall":80
              },
              "reuse_rule":{
                  "baseline_source":
                      "exact Phase 0B memberships and occurrences",
                  "fully_usable_definition":
                      "qualified Phase 0B membership with exactly four distinct target slots and all four occurrences identity-resolved and Sleeper-ready",
                  "cells_with_at_least_12_fully_usable_are_frozen":True,
                  "baseline_evidence_recomputed":False,
                  "baseline_network_refetch":False
              },
              "rescue_rule":{
                  "target_cells":
                      deficient,
                  "target_minimum_fully_usable_leagues":12,
                  "only_deficient_cells_may_receive_rescue_additions":True,
                  "candidate_universe":
                      "same exact frozen Phase 0A 6203 candidate universe",
                  "known_phase0b_qualifier_rejects_skipped":True,
                  "known_phase0b_obvious_mocks_skipped":True,
                  "rescue_candidate_maximum_n":2208,
                  "rescue_order_seed":rescue_seed,
                  "rescue_order":
                      "SHA256(seed|year|league_id), then league_id",
                  "stop_rule":
                      "For each year, stop scanning immediately after every deficient R6 cell for that year reaches 12 fully usable leagues.",
                  "outcome_dependent_selection":False
              },
              "local_cell_rule":{
                  "r6_early_slots":[61,62,63,64],
                  "r6_mid_slots":[65,66,67,68],
                  "r6_late_slots":[69,70,71,72],
                  "earlier_round_completeness_required":False,
                  "all_four_slots_exactly_once":True,
                  "four_nonnull_distinct_mfl_player_ids":True,
                  "contamination_scope":"exact target four-pick cell",
                  "four_of_four_identity_required":True,
                  "four_of_four_sleeper_ready_required":True
              },
              "league_qualification":{
                  "evaluated_phase0b_candidate":
                      "reuse prior frozen Phase 0B format/mock qualification; no league refetch required",
                  "not_raw_depth_supported_r1_or_transport_candidate":
                      "fetch league only after a target R6 local window is structurally complete, then apply the frozen V7 qualifier and obvious-mock rule",
                  "manual_rescue_allowed":False
              },
              "transport":{
                  "mfl_endpoints_allowed":[
                      "draftResults","league","players"
                  ],
                  "leagueSearch_allowed":False,
                  "new_candidate_discovery_allowed":False,
                  "maximum_combined_unresolved_candidate_n":62,
                  "maximum_combined_unresolved_fraction_of_6203":
                      0.01,
                  "candidate_level_transport_isolation":True
              },
              "firewalls":{
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False
              },
              "pass_decision":
                  "PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
              "fail_decision":
                  "STOP_AND_PREREGISTER_V8_PHASE0D_TARGETED_SOURCE_EXPANSION_BEFORE_OUTCOMES"
          }

          plan={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":"phase0c_incremental_r6_rescue_plan",
              "reusable_cell_n":91,
              "deficient_cell_n":17,
              "total_shortfall":80,
              "baseline_fully_usable_league_ids":
                  baseline,
              "baseline_fully_usable_occurrences":
                  baseline_occurrences,
              "deficient_cells":
                  deficient,
              "rescue_candidate_order_by_year":
                  candidate_order,
              "phase0b_candidate_status_counts_by_year":
                  candidate_status_counts,
              "maximum_rescue_candidates_by_year":
                  max_rescue_candidates_by_year,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False
          }

          (root/"v8_phase0c_incremental_rescue_contract.json").write_text(
              json.dumps(contract,indent=2,sort_keys=True)+"\n"
          )
          (root/"v8_phase0c_incremental_rescue_plan.json").write_text(
              json.dumps(plan,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              "reusable_cells":91,
              "rescue_cells":17,
              "total_shortfall":80,
              "maximum_candidates_that_could_be_scanned":2208,
              "full_6203_rescan":False,
              "all_rescue_cells":"R6"
          },indent=2))
          PY

      - name: Write deterministic R6 rescue probe
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/prep/r6_incremental_rescue_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          from collections import Counter
          from pathlib import Path

          import requests

          WINDOWS={
              "r6_early":(61,62,63,64),
              "r6_mid":(65,66,67,68),
              "r6_late":(69,70,71,72),
          }

          def sha(path: Path):
              return hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          def load_engine(path: Path):
              spec=importlib.util.spec_from_file_location(
                  "v7_frozen_engine",path
              )
              if spec is None or spec.loader is None:
                  raise RuntimeError(
                      "cannot import frozen V7 engine"
                  )
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def parse_selected_unit(E,unit):
              raw=[
                  x for x in E.V.as_list(
                      unit.get("draftPick")
                  )
                  if isinstance(x,dict)
              ]
              by_slot={}
              for i,p in enumerate(raw):
                  r=E.V.safe_int(p.get("round"))
                  w=E.V.safe_int(p.get("pick"))
                  if (
                      r is None or w is None
                      or r<1 or r>6
                      or w<1 or w>12
                  ):
                      continue
                  s=(r-1)*12+w
                  by_slot.setdefault(s,[]).append({
                      "overall_slot":s,
                      "round":r,
                      "within_round_pick":w,
                      "mfl_player_id":
                          E.V.stable_id(
                              p.get("player")
                          ),
                      "franchise_id":
                          E.V.stable_id(
                              p.get("franchise")
                              or p.get("franchise_id")
                              or p.get("franchiseId")
                          ),
                      "raw_row_index":i,
                  })
              return by_slot

          def extract_window(by_slot,slots):
              rows=[]
              for s in slots:
                  xs=by_slot.get(s,[])
                  if len(xs)==0:
                      return None,"missing_slot"
                  if len(xs)!=1:
                      return None,"duplicate_slot"
                  rows.append(dict(xs[0]))
              pids=[
                  x.get("mfl_player_id")
                  for x in rows
              ]
              if any(not x for x in pids):
                  return None,"missing_player_id"
              if len(set(pids))!=4:
                  return None,"duplicate_player_id"
              return rows,"structurally_complete"

          def selftest():
              class V:
                  @staticmethod
                  def as_list(x):
                      if x is None:
                          return []
                      return x if isinstance(x,list) else [x]
                  @staticmethod
                  def safe_int(x):
                      try:
                          return int(x)
                      except Exception:
                          return None
                  @staticmethod
                  def stable_id(x):
                      if x is None:
                          return None
                      s=str(x).strip()
                      return s or None
              class E: pass
              E.V=V

              picks=[
                  {"round":2,"pick":1,"player":"X"},
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":3,"player":"603"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              by=parse_selected_unit(
                  E,{"draftPick":picks}
              )
              rows,status=extract_window(
                  by,WINDOWS["r6_early"]
              )
              assert status=="structurally_complete"
              assert [
                  x["mfl_player_id"] for x in rows
              ]==["601","602","603","604"]

              bad=[
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":3,"player":"601"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              by=parse_selected_unit(
                  E,{"draftPick":bad}
              )
              rows,status=extract_window(
                  by,WINDOWS["r6_early"]
              )
              assert rows is None
              assert status=="duplicate_player_id"
              print(
                  "PASS: incremental R6 rescue helper self-test"
              )

          def run(args):
              prep=Path(args.prep)
              out=Path(args.out)

              contract=json.loads(
                  (
                      prep/
                      "v8_phase0c_incremental_rescue_contract.json"
                  ).read_text()
              )
              plan=json.loads(
                  (
                      prep/
                      "v8_phase0c_incremental_rescue_plan.json"
                  ).read_text()
              )

              E=load_engine(
                  prep/"p0a"/"engine"/
                  "build_r1_r6_source_identity_v7.py"
              )
              frozen_fp=(
                  prep/"p0a"/"engine"/
                  "identity_crosswalk.json"
              )
              expected_fp=(
                  "697899f4d98adb2bd08a6774ea41355b"
                  "09fe6e442b256d5a9445ff132"
              )
              if sha(frozen_fp)!=expected_fp:
                  raise RuntimeError(
                      "frozen crosswalk hash mismatch"
                  )
              E.FP_XWALK=frozen_fp

              idx,asset=E.load_indexes(
                  prep/"p0a"/"engine"/"db_playerids.csv",
                  prep/"p0a"/"engine"/"nflverse_players.csv",
                  prep/"p0a"/"engine"/
                  "r1_r6_identity_asset_manifest_v7.json",
              )
              if (
                  asset[
                      "fantasypros_sleeper_crosswalk"
                  ]["sha256"]!=expected_fp
              ):
                  raise RuntimeError(
                      "identity manifest mismatch"
                  )

              year=str(args.year)
              target={
                  x["cell"]:int(x["shortfall"])
                  for x in plan[
                      "deficient_cells"
                  ].values()
                  if int(x["draft_year"])==args.year
              }
              if not target:
                  raise RuntimeError(
                      f"year {args.year} has no rescue target"
                  )

              baseline={
                  cell:set(
                      plan[
                          "baseline_fully_usable_league_ids"
                      ][f"{args.year}:{cell}"]
                  )
                  for cell in target
              }
              required={
                  cell:12 for cell in target
              }
              additions={
                  cell:[] for cell in target
              }
              rescue_occurrences=[]
              attempts=[]
              transport=[]
              counts=Counter()

              evidence=json.loads(
                  (
                      prep/"p0b"/
                      "v8_phase0b_qualified_depth_exact_evidence.json"
                  ).read_text()
              )
              dispositions={
                  str(x["league_id"]):x
                  for x in evidence[
                      "candidate_dispositions"
                  ]
                  if int(x["draft_year"])==args.year
              }

              order=plan[
                  "rescue_candidate_order_by_year"
              ][year]
              if len(order)!=len(set(order)):
                  raise RuntimeError(
                      "duplicate rescue candidate"
                  )

              ses=requests.Session()
              ses.headers["User-Agent"]=(
                  f"LOG-Draft-Pick-FV-V8-P0C-R6-"
                  f"{args.year}/1.0"
              )

              def complete():
                  return all(
                      len(baseline[cell])
                      + len(additions[cell])
                      >= required[cell]
                      for cell in target
                  )

              for scan_index,lid in enumerate(order,1):
                  if complete():
                      break

                  d=dispositions[lid]
                  if d["status"] in {
                      "qualifier_reject",
                      "obvious_mock_reject",
                  }:
                      raise RuntimeError(
                          "known reject leaked into rescue pool"
                      )

                  need=[
                      cell for cell in target
                      if (
                          len(baseline[cell])
                          + len(additions[cell])
                          < required[cell]
                          and lid not in baseline[cell]
                      )
                  ]
                  if not need:
                      continue

                  attempt={
                      "scan_index":scan_index,
                      "league_id":lid,
                      "phase0b_status":d["status"],
                      "needed_cells_at_start":
                          list(need),
                  }
                  stage="draftResults"

                  try:
                      units=E.V.extract_units(
                          E.V.get_json(
                              ses,
                              E.V.api_url(
                                  args.year,
                                  "draftResults",
                                  L=lid,
                              ),
                          )
                      )
                      chosen,reason,unit_summary=(
                          E.V.choose_unit(units)
                      )
                      attempt[
                          "unit_selection_reason"
                      ]=str(reason)

                      if chosen is None:
                          attempt["status"]="draft_unit_reject"
                          attempts.append(attempt)
                          counts["draft_unit_reject"]+=1
                          continue

                      by_slot=parse_selected_unit(
                          E,chosen
                      )
                      windows={}
                      for cell in need:
                          rows,status=extract_window(
                              by_slot,WINDOWS[cell]
                          )
                          attempt[
                              f"{cell}_structural_status"
                          ]=status
                          if rows is not None:
                              windows[cell]=rows

                      if not windows:
                          attempt[
                              "status"
                          ]="no_needed_structural_r6_window"
                          attempts.append(attempt)
                          counts[
                              "no_needed_structural_r6_window"
                          ]+=1
                          continue

                      # Reuse the prior frozen league-format decision for
                      # candidates Phase 0B already evaluated. Candidates
                      # that never reached qualification get one league
                      # request now, but only after an R6 window exists.
                      format_source=None
                      if d["status"]=="evaluated":
                          format_ok=True
                          format_source=(
                              "phase0b_frozen_evaluated"
                          )
                      else:
                          stage="league"
                          lg=E.V.league_obj(
                              E.V.get_json(
                                  ses,
                                  E.V.api_url(
                                      args.year,
                                      "league",
                                      L=lid,
                                  ),
                              )
                          )
                          if lg is None:
                              attempt[
                                  "status"
                              ]="league_missing"
                              attempts.append(attempt)
                              counts["league_missing"]+=1
                              continue
                          ok,q=E.V.qualifier(lg)
                          if not ok:
                              attempt[
                                  "status"
                              ]="qualifier_reject"
                              attempt["reason"]=str(q)
                              attempts.append(attempt)
                              counts[
                                  "qualifier_reject"
                              ]+=1
                              continue
                          if E.V.obvious_mock_name(
                              lg.get("name")
                          ):
                              attempt[
                                  "status"
                              ]="obvious_mock_reject"
                              attempts.append(attempt)
                              counts[
                                  "obvious_mock_reject"
                              ]+=1
                              continue
                          format_ok=True
                          format_source=(
                              "phase0c_refetched_league"
                          )

                      assert format_ok
                      pids=sorted({
                          str(x["mfl_player_id"])
                          for rows in windows.values()
                          for x in rows
                      })
                      stage="players"
                      meta=E.V.league_scoped_players(
                          ses,args.year,lid,pids
                      )

                      added=[]
                      for cell,rows in windows.items():
                          if (
                              len(baseline[cell])
                              + len(additions[cell])
                              >= required[cell]
                          ):
                              continue

                          cr=[
                              {
                                  "overall_slot":
                                      int(x["overall_slot"]),
                                  "mfl_player_id":
                                      str(x["mfl_player_id"]),
                              }
                              for x in rows
                          ]
                          contam=E.V.classify_contamination(
                              args.year,cr,meta,idx
                          )
                          if contam[
                              "positive_contamination"
                          ]:
                              counts[
                                  f"{cell}:contamination_reject"
                              ]+=1
                              continue

                          resolved=[]
                          for rec in rows:
                              pid=str(
                                  rec["mfl_player_id"]
                              )
                              ident=E.V.resolve_identity(
                                  args.year,
                                  pid,
                                  meta.get(pid),
                                  idx,
                              )
                              row={
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "overall_slot":
                                      int(rec["overall_slot"]),
                                  "round":int(rec["round"]),
                                  "within_round_pick":
                                      int(
                                          rec[
                                              "within_round_pick"
                                          ]
                                      ),
                                  "mfl_player_id":pid,
                                  "franchise_id":
                                      rec.get("franchise_id"),
                              }
                              row.update(ident)
                              row["stable_player_key"]=(
                                  E.V.stable_player_key(
                                      ident
                                  )
                              )
                              resolved.append(row)

                          if not all(
                              bool(x["identity_resolved"])
                              for x in resolved
                          ):
                              counts[
                                  f"{cell}:identity_reject"
                              ]+=1
                              continue

                          if not all(
                              bool(
                                  x[
                                      "outcome_ready_sleeper_id"
                                  ]
                              )
                              for x in resolved
                          ):
                              counts[
                                  f"{cell}:sleeper_reject"
                              ]+=1
                              continue

                          if lid in baseline[cell]:
                              raise RuntimeError(
                                  "attempted duplicate baseline source"
                              )
                          if lid in additions[cell]:
                              raise RuntimeError(
                                  "duplicate rescue addition"
                              )

                          additions[cell].append(lid)
                          rescue_occurrences.extend(
                              resolved
                          )
                          added.append(cell)
                          counts[
                              f"{cell}:rescued"
                          ]+=1

                      attempt["format_source"]=format_source
                      attempt["added_cells"]=added
                      attempt["status"]=(
                          "rescued"
                          if added else
                          "evaluated_no_rescue"
                      )
                      attempts.append(attempt)

                  except E.GateError as exc:
                      if not E._v4_transport_exhaustion(
                          exc
                      ):
                          raise
                      u={
                          "draft_year":args.year,
                          "league_id":lid,
                          "scan_index":scan_index,
                          "stage":stage,
                          "failure_class":
                              E._v4_transport_class(
                                  str(exc)
                              ),
                          "error_fingerprint_sha256":
                              hashlib.sha256(
                                  str(exc).encode()
                              ).hexdigest(),
                      }
                      transport.append(u)
                      attempt["status"]="transport_unresolved"
                      attempt["transport"]=u
                      attempts.append(attempt)
                      counts["transport_unresolved"]+=1

                  if (
                      scan_index%25==0
                      or complete()
                  ):
                      print(
                          json.dumps({
                              "year":args.year,
                              "scanned":scan_index,
                              "target_counts":{
                                  cell:
                                      len(baseline[cell])
                                      + len(additions[cell])
                                  for cell in target
                              },
                              "complete":complete(),
                          }),
                          flush=True,
                      )

              final_counts={
                  cell:
                      len(baseline[cell])
                      + len(additions[cell])
                  for cell in target
              }
              success=all(
                  n>=12
                  for n in final_counts.values()
              )

              payload={
                  "schema_version":1,
                  "study_id":contract["study_id"],
                  "stage":
                      "phase0c_incremental_r6_rescue_year",
                  "draft_year":args.year,
                  "target_cells":target,
                  "baseline_counts":{
                      cell:len(baseline[cell])
                      for cell in target
                  },
                  "required_final_n":12,
                  "rescue_additions":
                      additions,
                  "rescue_occurrences":
                      rescue_occurrences,
                  "final_counts":final_counts,
                  "success":success,
                  "candidate_order_n":len(order),
                  "candidate_attempt_n":len(attempts),
                  "last_scan_index":(
                      attempts[-1]["scan_index"]
                      if attempts else 0
                  ),
                  "stopped_early":(
                      success
                      and (
                          not attempts
                          or attempts[-1]["scan_index"]
                          < len(order)
                      )
                  ),
                  "attempt_status_counts":
                      dict(sorted(counts.items())),
                  "attempts":attempts,
                  "transport_unresolved":
                      transport,
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
              }

              out.parent.mkdir(
                  parents=True,exist_ok=True
              )
              out.write_text(
                  json.dumps(
                      payload,indent=2,sort_keys=True
                  )+"\n"
              )

              # A source shortfall is a scientific STOP result, not an
              # infrastructure failure. Always exit zero so assemble can
              # produce the preregistered closeout decision.
              print(json.dumps({
                  "year":args.year,
                  "success":success,
                  "final_counts":final_counts,
                  "candidate_attempt_n":
                      len(attempts),
                  "candidate_order_n":
                      len(order),
              },indent=2))

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument(
                  "--self-test",
                  action="store_true"
              )
              ap.add_argument("--year",type=int)
              ap.add_argument("--prep")
              ap.add_argument("--out")
              args=ap.parse_args()

              if args.self_test:
                  selftest()
                  return
              if (
                  args.year is None
                  or args.prep is None
                  or args.out is None
              ):
                  ap.error(
                      "probe mode requires year, prep, out"
                  )
              run(args)

          if __name__=="__main__":
              main()
          PY

          chmod +x "${RUNNER_TEMP}/prep/r6_incremental_rescue_v8.py"
          python3 "${RUNNER_TEMP}/prep/r6_incremental_rescue_v8.py" --self-test

      - name: Validate Phase 0C prep
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          c=json.loads(
              (root/"v8_phase0c_incremental_rescue_contract.json").read_text()
          )
          p=json.loads(
              (root/"v8_phase0c_incremental_rescue_plan.json").read_text()
          )

          assert c["status"]=="FROZEN_PRE_PHASE0C_RESCUE_PRE_OUTCOME"
          assert c["reason"]["cells_reused_without_refetch"]==91
          assert c["reason"]["cells_requiring_rescue"]==17
          assert c["reason"]["total_additional_league_cell_shortfall"]==80
          assert c["rescue_rule"]["rescue_candidate_maximum_n"]==2208
          assert c["rescue_rule"]["outcome_dependent_selection"] is False
          assert c["transport"]["leagueSearch_allowed"] is False
          assert c["transport"]["new_candidate_discovery_allowed"] is False
          assert all(v is False for v in c["firewalls"].values())

          assert p["reusable_cell_n"]==91
          assert p["deficient_cell_n"]==17
          assert p["total_shortfall"]==80
          assert len(p["deficient_cells"])==17
          assert all(
              x["cell"].startswith("r6_")
              for x in p["deficient_cells"].values()
          )
          print(
              "PASS: incremental rescue plan frozen; "
              "91 cells reused, 17 R6 cells targeted."
          )
          PY

      - name: Upload frozen Phase 0C prep
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-incremental-r6-rescue-prep
          path: ${{ runner.temp }}/prep/
          if-no-files-found: error
          retention-days: 30

  rescue:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {year: 2018, slot: 0}
          - {year: 2019, slot: 1}
          - {year: 2020, slot: 2}
          - {year: 2021, slot: 0}
          - {year: 2022, slot: 1}
          - {year: 2023, slot: 2}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      YEAR: ${{ matrix.year }}
      SLOT: ${{ matrix.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0C prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0c-incremental-r6-rescue-prep
          path: ${{ runner.temp }}/prep

      - name: Rescue only deficient R6 cells
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/diag"
          export MFL_TRANSPORT_DIAGNOSTIC_PATH="${RUNNER_TEMP}/diag/transport.jsonl"
          sleep "$(( SLOT * 10 ))"

          python3 "${RUNNER_TEMP}/prep/r6_incremental_rescue_v8.py" \
            --year "$YEAR" \
            --prep "${RUNNER_TEMP}/prep" \
            --out "${RUNNER_TEMP}/out/rescue_${YEAR}.json"

      - name: Upload yearly R6 rescue result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-r6-rescue-${{ matrix.year }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload rescue transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-r6-rescue-diag-${{ matrix.year }}
          path: ${{ runner.temp }}/diag/transport.jsonl
          if-no-files-found: ignore
          retention-days: 30

  assemble:
    needs: rescue
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Download frozen Phase 0C prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0c-incremental-r6-rescue-prep
          path: ${{ runner.temp }}/prep

      - name: Download all R6 rescue results
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p0c-r6-rescue-20*
          path: ${{ runner.temp }}/rescues
          merge-multiple: true

      - name: Assemble exact reused plus rescued source cohorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assembled"

          python3 - <<'PY'
          import json, os
          from collections import defaultdict
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          prep=root/"prep"
          rescues=root/"rescues"
          out=root/"assembled"

          contract=json.loads(
              (prep/"v8_phase0c_incremental_rescue_contract.json").read_text()
          )
          plan=json.loads(
              (prep/"v8_phase0c_incremental_rescue_plan.json").read_text()
          )
          p0b=json.loads(
              (
                  prep/"p0b"/
                  "v8_phase0b_qualified_depth_feasibility.json"
              ).read_text()
          )

          docs=[]
          for p in sorted(
              rescues.glob("rescue_*.json")
          ):
              d=json.loads(p.read_text())
              for k in (
                  "historical_player_outcomes_read",
                  "holdout_2024_outcomes_read",
                  "holdout_2024_search_performed",
                  "market_or_ktc_values_read",
                  "package_vote_data_read",
                  "candidate_fit_performed",
                  "candidate_scores_computed",
                  "candidate_selection_performed",
                  "production_change_authorized",
              ):
                  assert d[k] is False,(p.name,k)
              docs.append(d)

          assert len(docs)==6,len(docs)
          assert {
              int(x["draft_year"]) for x in docs
          }==set(range(2018,2024))

          by_year={
              int(x["draft_year"]):x
              for x in docs
          }

          final_memberships={}
          final_occurrences={}
          provenance={}
          rescue_attempt_n=0
          rescue_transport=[]
          failed_years=[]

          # Start with the exact fully-usable Phase 0B subsets.
          for key,lids in plan[
              "baseline_fully_usable_league_ids"
          ].items():
              final_memberships[key]=list(lids)
              provenance[key]={
                  lid:"phase0b_reused"
                  for lid in lids
              }
              for lid in lids:
                  occ_key=f"{key}:{lid}"
                  final_occurrences[occ_key]=plan[
                      "baseline_fully_usable_occurrences"
                  ][occ_key]

          # Add only the preregistered R6 rescues.
          for y,d in sorted(by_year.items()):
              rescue_attempt_n+=int(
                  d["candidate_attempt_n"]
              )
              rescue_transport.extend(
                  d["transport_unresolved"]
              )
              if not d["success"]:
                  failed_years.append(y)

              for cell,lids in d[
                  "rescue_additions"
              ].items():
                  key=f"{y}:{cell}"
                  for lid in lids:
                      assert lid not in final_memberships[key]
                      final_memberships[key].append(lid)
                      provenance[key][
                          lid
                      ]="phase0c_incremental_rescue"

              grouped=defaultdict(list)
              for row in d["rescue_occurrences"]:
                  grouped[
                      (
                          int(row["draft_year"]),
                          row["cell"],
                          str(row["league_id"]),
                      )
                  ].append(row)
              for (
                  yy,cell,lid
              ),rows in grouped.items():
                  key=f"{yy}:{cell}:{lid}"
                  assert key not in final_occurrences
                  assert len(rows)==4
                  assert all(
                      bool(x["identity_resolved"])
                      and bool(
                          x[
                              "outcome_ready_sleeper_id"
                          ]
                      )
                      for x in rows
                  )
                  final_occurrences[key]=rows

          cells={}
          deficient=[]
          for key,lids in sorted(
              final_memberships.items()
          ):
              y=int(key.split(":")[0])
              cell=key.split(":",1)[1]
              unique=sorted(set(lids))
              assert len(unique)==len(lids)

              # Every final source league must have exact 4/4
              # occurrence evidence.
              for lid in lids:
                  rows=final_occurrences[
                      f"{key}:{lid}"
                  ]
                  assert len(rows)==4
                  assert len({
                      int(x["overall_slot"])
                      for x in rows
                  })==4
                  assert all(
                      bool(x["identity_resolved"])
                      for x in rows
                  )
                  assert all(
                      bool(
                          x[
                              "outcome_ready_sleeper_id"
                          ]
                      )
                      for x in rows
                  )

              n=len(lids)
              passed=n>=12
              if not passed:
                  deficient.append({
                      "draft_year":y,
                      "cell":cell,
                      "fully_usable_league_n":n,
                      "shortfall":12-n,
                  })

              cells[key]={
                  "draft_year":y,
                  "cell":cell,
                  "fully_usable_league_n":n,
                  "minimum_required":12,
                  "source_gate_pass":passed,
                  "occurrence_n":n*4,
                  "occurrence_retention_fraction":1.0,
                  "represented_league_fraction":1.0,
                  "identity_coverage":1.0,
                  "sleeper_ready_coverage":1.0,
                  "phase0b_reused_league_n":sum(
                      1 for lid in lids
                      if provenance[key][lid]
                      =="phase0b_reused"
                  ),
                  "phase0c_rescue_league_n":sum(
                      1 for lid in lids
                      if provenance[key][lid]
                      =="phase0c_incremental_rescue"
                  ),
              }

          assert len(cells)==108,len(cells)

          original_transport={
              (
                  int(x["draft_year"]),
                  str(x["league_id"]),
              )
              for x in json.loads(
                  (
                      prep/"p0b"/
                      "v8_phase0b_qualified_depth_exact_evidence.json"
                  ).read_text()
              )["transport_unresolved"]
          }
          rescue_transport_keys={
              (
                  int(x["draft_year"]),
                  str(x["league_id"]),
              )
              for x in rescue_transport
          }
          combined_transport=(
              original_transport
              | rescue_transport_keys
          )
          transport_n=len(combined_transport)
          transport_gate=transport_n<=62

          passed_cells=sum(
              x["source_gate_pass"]
              for x in cells.values()
          )
          all_cells_pass=(
              passed_cells==108
              and not deficient
          )
          source_gate_pass=(
              all_cells_pass
              and transport_gate
              and not failed_years
          )

          decision=(
              contract["pass_decision"]
              if source_gate_pass
              else contract["fail_decision"]
          )

          summary={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":
                  "phase0c_incremental_r6_rescue_closeout",
              "decision":decision,
              "candidate_universe_total_n":6203,
              "phase0b_cells_reused_without_refetch":91,
              "phase0c_target_cell_n":17,
              "phase0c_target_round":"R6",
              "original_total_shortfall":80,
              "rescue_candidate_attempt_n":
                  rescue_attempt_n,
              "full_6203_rescan_performed":False,
              "year_cell_n":108,
              "year_cells_passing":passed_cells,
              "all_year_cells_pass":all_cells_pass,
              "deficient_year_cells":deficient,
              "failed_rescue_years":failed_years,
              "transport":{
                  "phase0b_unresolved_candidate_n":
                      len(original_transport),
                  "phase0c_rescue_unresolved_candidate_n":
                      len(rescue_transport_keys),
                  "combined_distinct_unresolved_candidate_n":
                      transport_n,
                  "maximum_allowed_candidate_n":62,
                  "gate_pass":transport_gate,
              },
              "year_cell":cells,
              "firewalls":contract["firewalls"],
              "historical_outcome_ingestion_authorized":False,
              "holdout_2024_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":(
                  "draft-pick-fv-v8-phase1-incremental-source-identity-freeze"
                  if source_gate_pass
                  else
                  "draft-pick-fv-v8-phase0d-targeted-source-expansion-preregistration"
              ),
          }

          exact={
              "schema_version":1,
              "study_id":contract["study_id"],
              "stage":
                  "phase0c_incremental_exact_source_identity_evidence",
              "decision":decision,
              "cell_membership_league_ids":
                  final_memberships,
              "cell_membership_provenance":
                  provenance,
              "occurrences":
                  final_occurrences,
              "rescue_attempts_by_year":{
                  str(y):by_year[y]["attempts"]
                  for y in sorted(by_year)
              },
              "rescue_transport_unresolved":
                  rescue_transport,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }

          (out/"v8_phase0c_incremental_r6_rescue.json").write_text(
              json.dumps(
                  summary,indent=2,sort_keys=True
              )+"\n"
          )
          (out/"v8_phase0c_incremental_exact_evidence.json").write_text(
              json.dumps(
                  exact,indent=2,sort_keys=True
              )+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0C Incremental R6 Rescue",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Exact frozen candidate universe: **6,203**",
              "- Phase 0B cells reused without refetch: **91 / 108**",
              "- Cells requiring new rescue work: **17 / 108**",
              "- Rescue scope: **R6 only**",
              "- Original additional league-cell shortfall: **80**",
              f"- Rescue candidates actually attempted: **{rescue_attempt_n}**",
              "- Full 6,203-candidate rescan: **NO**",
              f"- Year-cells passing final 4/4 usable-source gate: **{passed_cells} / 108**",
              f"- Combined unresolved transport candidates: **{transport_n} / 6203**; cap **62**",
              "",
              "## Final R6 fully usable league counts",
              "",
              "| Year | Early | Mid | Late |",
              "|---:|---:|---:|---:|",
          ]
          for y in range(2018,2024):
              vals=[
                  cells[
                      f"{y}:r6_{part}"
                  ]["fully_usable_league_n"]
                  for part in (
                      "early","mid","late"
                  )
              ]
              lines.append(
                  f"| {y} | {vals[0]} | {vals[1]} | {vals[2]} |"
              )

          if deficient:
              lines += [
                  "",
                  "## Remaining deficient cells",
                  "",
                  "| Year | Cell | Fully usable | Shortfall |",
                  "|---:|---|---:|---:|",
              ]
              for x in deficient:
                  lines.append(
                      f"| {x['draft_year']} | "
                      f"{x['cell']} | "
                      f"{x['fully_usable_league_n']} | "
                      f"{x['shortfall']} |"
                  )

          lines += [
              "",
              "All counted source leagues contribute exactly four retained, identity-resolved, Sleeper-ready occurrences.",
              "",
              "No historical NFL outcomes, 2024 outcomes, market/KTC values, package votes, candidate fits, candidate scores, or production values were read."
          ]
          (out/"v8_phase0c_incremental_r6_rescue.md").write_text(
              "\n".join(lines)+"\n"
          )

          print("\n".join(lines))
          PY

      - name: Validate incremental closeout firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"assembled"
          s=json.loads(
              (out/"v8_phase0c_incremental_r6_rescue.json").read_text()
          )
          e=json.loads(
              (out/"v8_phase0c_incremental_exact_evidence.json").read_text()
          )

          assert s["candidate_universe_total_n"]==6203
          assert s["phase0b_cells_reused_without_refetch"]==91
          assert s["phase0c_target_cell_n"]==17
          assert s["phase0c_target_round"]=="R6"
          assert s["original_total_shortfall"]==80
          assert s["full_6203_rescan_performed"] is False
          assert s["year_cell_n"]==108
          assert len(s["year_cell"])==108
          assert s["historical_outcome_ingestion_authorized"] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert all(v is False for v in s["firewalls"].values())

          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False

          allowed={
              "PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
