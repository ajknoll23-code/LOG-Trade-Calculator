# CAL26 V1R20 | Read-only QB driver attribution, pinned V1R19 evidence; NO FV release.
# Age scenarios are hypothetical diagnostics, not market-value-calibrated production candidates.
name: CAL26 V1R20 - QB Fundamental Value Driver Calibration 565 READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r20-qb-driver-read-only
  cancel-in-progress: false
jobs:
  qb_driver_diagnostic:
    name: Canonical 565 player parity and QB driver attribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce main branch and canonical evaluator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s index.html
          test -s scripts/validation/snapshot_values.py
          python3 scripts/validation/snapshot_values.py --selftest
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download exact green CAL26 V1R19 source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26_v1r19_pinned_source"
          gh run download 39824176677 \
            --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R19-565-Fitted-Historical-Age-Decision-Read-Only \
            --dir "$RUNNER_TEMP/cal26_v1r19_pinned_source"
          test -s "$RUNNER_TEMP/cal26_v1r19_pinned_source/CAL26_V1R19_Manifest.json"
          test -s "$RUNNER_TEMP/cal26_v1r19_pinned_source/CAL26_V1R19_All_565_Position_Age_K50_Shadow.csv"
          test -s "$RUNNER_TEMP/cal26_v1r19_pinned_source/CAL26_V1R19_14_QB_Directional_Review.csv"
      - name: Materialize and self-test QB diagnostic engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r20_engine.py" <<'PY_CAL26_V1R20'
          #!/usr/bin/env python3
          """CAL26 V1R20: reproduce production prices, attribute QB value drivers, and preview
          strictly hypothetical QB youth-age relief. No repo writes, no calibration fitted to owner feedback.
          """
          from __future__ import annotations
          import argparse,csv,hashlib,importlib.util,json,math,statistics
          from datetime import date
          from collections import Counter
          from pathlib import Path
          
          SOURCE_RUN=39824176677
          SOURCE_ARTIFACT='CAL26-V1R19-565-Fitted-Historical-Age-Decision-Read-Only'
          SOURCE_MANIFEST_SHA256='af262b5b466b327ffd1631c49f980a1914716429df55d98337493f877dea6deb'
          EXPECTED_INDEX_SHA256='6ff8fcef45c1bb7f688ae6be52ec1a0d620d33706b4acbc7ece1bc13874ac6e9'
          SOURCE_ROWS='CAL26_V1R19_All_565_Position_Age_K50_Shadow.csv'
          SOURCE_QB='CAL26_V1R19_14_QB_Directional_Review.csv'
          
          
          def check(ok,reason):
              if not ok:raise AssertionError(reason)
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def loadj(p):return json.loads(Path(p).read_text(encoding='utf-8'))
          def loadcsv(p):
              with Path(p).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def savecsv(p,rows,fields=None):
              check(bool(rows),'NO_CSV_ROWS_'+str(p))
              with Path(p).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fields or list(rows[0]),extrasaction='raise')
                  w.writeheader();w.writerows(rows)
          def rnd(x):
              check(math.isfinite(x) and x>=0,'NONFINITE_NONPOSITIVE_VALUE')
              return math.floor(x+.5)
          def b(s):return s is True or str(s)=='True'
          
          
          def preview_price(current,raw_before_anchor,age_mult,age,protected,relief=0.5,cap=1.15):
              """Age-only, <=25 QB experiment. No overrides in source files. Return original on holds."""
              if protected or age>25 or age_mult>=1 or age_mult<=0:return current,'HOLD'
              check(0<=relief<=1 and cap>=1,'INVALID_SCENARIO_SETTINGS')
              target_mult=min(1.0,age_mult+relief*(1-age_mult))
              shadow=rnd(raw_before_anchor*target_mult/age_mult)
              shadow=min(shadow,rnd(current*cap))
              return max(current,shadow),'AGE_25_RELIEF_HYPOTHETICAL'
          
          
          def direction(label,current,proposed):
              change=proposed-current
              if label=='Correct':return 'unchanged' if change==0 else 'moves_owner_correct_price'
              if change==0:return 'unchanged'
              return 'improves' if (change>0 and label=='Too Low') or (change<0 and label=='Too High') else 'worsens'
          
          
          def selftest():
              assert rnd(100.5)==101
              assert preview_price(5000,5000,.8,24,False)[0]==min(rnd(5000*1.125),rnd(5000*1.15))
              assert preview_price(5000,5000,.8,26,False)[0]==5000
              assert preview_price(5000,5000,.8,24,True)[0]==5000
              assert preview_price(5000,5000,1.,24,False)[0]==5000
              assert preview_price(5000,5000,.8,24,False,1.)[0]==5750
              assert direction('Too Low',5000,5500)=='improves'
              assert direction('Too High',5000,5500)=='worsens'
              assert direction('Correct',5000,5500)=='moves_owner_correct_price'
              print('PASS CAL26 V1R20 unit: JS rounding, age-only policy, protected holds, cap, owner direction')
          
          
          def process(rows,feedback,cfg,computed,snap,out,provenance):
              out=Path(out);out.mkdir(parents=True,exist_ok=True)
              check(len(rows)==565 and len({r['player'] for r in rows})==565,'PINNED_565_SCOPE_DRIFT')
              check(len(feedback)==14 and len({q['player'] for q in feedback})==14,'PINNED_14_FEEDBACK_DRIFT')
              check(len(computed)==565 and set(computed)=={r['player'] for r in rows},'LIVE_565_PLAYER_ID_PARITY_DRIFT')
              check(Counter(x['position'] for x in rows)['QB']==64,'SOURCE_QB_64_DRIFT')
              check(Counter(q['owner_rating_on_earlier_review'] for q in feedback)=={'Too Low':7,'Too High':5,'Correct':2},'OWNER_FEEDBACK_SCOPE_DRIFT')
              check(sum(b(r['is_approved_owner_anchor']) for r in rows)==15,'OWNER_15_LOCK_DRIFT')
              check(sum(b(r['is_accepted_control']) for r in rows)==18,'OWNER_18_LOCK_DRIFT')
              feedback_by={q['player']:q for q in feedback}
              allrows=[];qbrows=[];ratingrows=[]
              for r in rows:
                  name=r['player'];info=cfg['player_db'][name];calc=computed[name]
                  cur=int(r['current_fv'])
                  check(cur==int(calc['value']),'CANONICAL_PRICE_PARITY_DRIFT_'+name)
                  check(info['pos']==r['position'] and info['age']==int(r['age']) and info['role']==r['role'],'CANONICAL_PLAYER_PARITY_'+name)
                  protected=b(r['is_approved_owner_anchor']) or b(r['is_accepted_control'])
                  row={'player':name,'position':r['position'],'current_fv':cur,'computed_fv_parity':True,
                       'protected':protected,'unchanged_in_repository':True,'scenario_implemented_in_production':False}
                  allrows.append(row)
                  if r['position']!='QB':continue
                  role=info['role'];age=info['age']
                  production,raw=snap.production_multiplier(name,role,cfg['prod_mult'],cfg['no_real_history'],cfg['role_mult'],cfg.get('cal22_keys',set()))
                  check(math.isfinite(production) and production>=0,'BAD_PRODUCTION_'+name)
                  agefactor=snap.effective_age_multiplier('QB',age,role,name,production,raw,cfg)
                  weight=cfg['position_weight']['QB']
                  pre_age=100*weight*production*55
                  recomputed=rnd(pre_age*agefactor)
                  if not protected:check(recomputed==cur,'CALCULATED_QB_FV_COMPONENT_DRIFT_'+name)
                  no_age=rnd(pre_age)
                  if not protected:check(no_age==int(r['no_age_shadow_fv']),'CANONICAL_NO_AGE_PARITY_DRIFT_'+name)
                  else:check(int(r['no_age_shadow_fv'])==cur,'CONTROL_NO_AGE_MUST_HOLD_'+name)
                  role_prior=float(cfg['role_mult'].get(role,1.0))
                  prod_kind='REAL_PRODUCTION_DATA' if raw is not None and name not in cfg['no_real_history'] else ('PRODUCTION_WITH_NO_HISTORY_FALLBACK' if raw is not None else 'ROLE_ONLY_FALLBACK')
                  half,status=preview_price(cur,recomputed,agefactor,age,protected,.5,1.15)
                  full,_=preview_price(cur,recomputed,agefactor,age,protected,1.0,1.15)
                  check(half>=cur and full>=half and full<=rnd(cur*1.15),'SCENARIO_MONOTONICITY_'+name)
                  if protected:check(half==full==cur,'OWNER_PROTECTED_DELTA_'+name)
                  if age>25:check(half==full==cur,'OLDER_QB_CHANGED_'+name)
                  q={'player':name,'age':age,'role':role,'baseline_fv':cur,
                     'owner_feedback':feedback_by.get(name,{}).get('owner_rating_on_earlier_review','Unrated'),
                     'is_owner_protected':protected,'position_weight':round(weight,6),
                     'role_prior_mult':round(role_prior,6),'effective_production_mult':round(production,6),
                     'raw_production_mult':round(raw,6) if raw is not None else '',
                     'production_provenance':prod_kind,'age_multiplier':round(agefactor,6),
                     'pre_age_unrounded':round(pre_age,6),'canonical_raw_before_anchor_fv':recomputed,
                     'age_penalty_points_without_anchor':no_age-recomputed,
                     'owner_anchor_delta_vs_formula':cur-recomputed,
                     'original_age_free_fv':int(r['no_age_shadow_fv']),
                     'production_up_10pct_mechanism_only_fv':rnd(pre_age*1.1*agefactor),
                     'production_down_10pct_mechanism_only_fv':rnd(pre_age*.9*agefactor),
                     'age_25_half_discount_relief_preview_fv':half,
                     'age_25_full_discount_relief_capped_preview_fv':full,
                     'half_relief_delta':half-cur,'full_relief_delta':full-cur,
                     'scenario_status':status,'production_authorized':False}
                  qbrows.append(q)
              check(len(qbrows)==64,'QB_DETAIL_ROW_DRIFT')
              qmap={r['player']:r for r in qbrows}
              for q in feedback:
                  name=q['player'];r=qmap[name];kind=q['owner_rating_on_earlier_review'];base=int(q['current_fv'])
                  check(kind in ('Too High','Too Low','Correct'),'BAD_FEEDBACK_RATING')
                  check(base==r['baseline_fv'],'QB_FEEDBACK_PRICE_PARITY_'+name)
                  check(b(q['protected_owner_price'])==r['is_owner_protected'],'QB_FEEDBACK_PROTECTION_PARITY_'+name)
                  ratingrows.append({'player':name,'feedback':kind,'baseline_fv':base,'earlier_review_price_is_not_a_target':True,
                    'age':r['age'],'role':r['role'],'production_provenance':r['production_provenance'],
                    'effective_production_mult':r['effective_production_mult'],'age_multiplier':r['age_multiplier'],
                    'age_penalty_points':r['age_penalty_points_without_anchor'],
                    'half_youth_relief_fv':r['age_25_half_discount_relief_preview_fv'],
                    'half_youth_relief_direction':direction(kind,base,r['age_25_half_discount_relief_preview_fv']),
                    'full_capped_youth_relief_fv':r['age_25_full_discount_relief_capped_preview_fv'],
                    'full_capped_youth_relief_direction':direction(kind,base,r['age_25_full_discount_relief_capped_preview_fv']),
                    'protected':r['is_owner_protected']})
              check(len(ratingrows)==14,'FEEDBACK_OUTPUT_COUNT')
              stable=Counter(r['half_youth_relief_direction'] for r in ratingrows if r['feedback']!='Correct')
              check(stable['worsens']==0,'OWNER_REVIEW_WORSENED')
              check(all(r['half_youth_relief_direction']=='unchanged' for r in ratingrows if r['feedback']=='Correct'),'PROTECTED_CORRECT_QB_MOVED')
              savecsv(out/'CAL26_V1R20_All_565_Reproduced_Baseline_Zero_Write_Audit.csv',allrows)
              savecsv(out/'CAL26_V1R20_64_QB_Component_Attribution_and_Scenarios.csv',qbrows)
              savecsv(out/'CAL26_V1R20_14_Owner_QB_Feedback_Scenario_Review.csv',ratingrows)
              top=sorted(qbrows,key=lambda r:r['baseline_fv'],reverse=True)
              feedback_lines=['| Player | Owner | Age | FV | Age penalty | Half youth preview | Direction |', '|---|---|---:|---:|---:|---:|---|']
              for z in ratingrows:
                  feedback_lines.append(f"| {z['player']} | {z['feedback']} | {z['age']} | {z['baseline_fv']} | {z['age_penalty_points']} | {z['half_youth_relief_fv']} | {z['half_youth_relief_direction']} |")
              docs=['# CAL26 V1R20 — QB pricing-driver diagnostic (READ ONLY)','',
                    '**Decision: DIAGNOSTIC_ONLY. No production repricing authorized.**','',
                    f'- Pinned source: V1R19 successful run `{SOURCE_RUN}`, manifest `{SOURCE_MANIFEST_SHA256}`.',
                    '- Canonical FV formula reproduced using repository `scripts/validation/snapshot_values.py` against current `index.html`.',
                    '- All 565 player prices exactly reproduce pinned V1R19; no files in the repository are changed.',
                    '- 64 QB breakdowns: position weight x effective production x age multiplier x 5500, with separate owner anchor delta.',
                    '- Role prior, raw production, and data lineage are surfaced; note that role and observed production are **not** additive independent contributions.',
                    '- The +/-10% production sensitivity is diagnostic only, NOT a proposed uniform QB pricing change.',
                    '- Two **arbitrary sensitivity previews**, not calibrated policy: <=25 QB half age-discount relief and <=25 QB full age-discount relief; latter capped at +15% vs existing FV; protected anchors unchanged.',
                    '- Owner Too High/Too Low labels assess direction only. Old review FV is not an exact requested price target.',
                    '- Do not infer dynasty-market calibration from historical future-fantasy-points MAE; no dynasty-value backtest is claimed.',
                    '', '## Owner feedback', *feedback_lines,'',
                    '## 64-QB scenario count',
                    f"- Half youth preview changed: {sum(r['half_relief_delta']!=0 for r in qbrows)}; full capped changed: {sum(r['full_relief_delta']!=0 for r in qbrows)}.",
                    f"- Owner direction with half-relief: improves {stable['improves']}/12, worsens {stable['worsens']}/12, unchanged {stable['unchanged']}/12.",
                    '', '## High value QBs (baseline reference)',
                    '| Player | Age | Role | Production multiplier | Age multiplier | FV |',
                    '|---|---:|---|---:|---:|---:|']
              for x in top[:15]:
                  docs.append(f"| {x['player']} | {x['age']} | {x['role']} | {x['effective_production_mult']} | {x['age_multiplier']} | {x['baseline_fv']} |")
              docs+=['', '## Next owner decision',
                     'Keep age curve and current values unchanged. Review the 14 QB breakdowns and 64 QB peer ladder before selecting a single candidate for a separately authorized preview/release.',
                     '**Do not approve production from this diagnostic alone.**']
              (out/'CAL26_V1R20_Driver_Decision_Report.md').write_text('\n'.join(docs)+'\n',encoding='utf-8')
              files={p.name:sha(p) for p in out.iterdir() if p.is_file()}
              m={'status':'PASS_CAL26_V1R20_READ_ONLY_QB_DRIVER_DIAGNOSTIC',
                 'source_run':SOURCE_RUN,'source_manifest_sha256':SOURCE_MANIFEST_SHA256,
                 'canonical_index_sha256':provenance.get('index_sha256',''),
                 'players':565,'qbs':64,'owner_qb_feedback':14,'owner_anchors_protected':15,'accepted_controls_protected':18,
                 'baseline_price_parity_players':565,'production_change_authorized':False,'production_files_mutated':0,
                 'scenario_full_youth_cap':1.15,'scenario_age_relief_half':.5,'files':files}
              (out/'CAL26_V1R20_Manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps({'status':m['status'],'qbs':64,'half_changed':sum(r['half_relief_delta']!=0 for r in qbrows),
                                'owner_half_direction':dict(stable),'locked':33},sort_keys=True))
              print('\n'.join(docs[:27]))
          
          
          def main(repo,source,out):
              repo=Path(repo);source=Path(source);out=Path(out)
              p=source/'CAL26_V1R19_Manifest.json'
              check(p.is_file() and sha(p)==SOURCE_MANIFEST_SHA256,'PINNED_V1R19_MANIFEST_SHA_DRIFT')
              m=loadj(p)
              check(m['status']=='PASS_CAL26_V1R19_K50_AGE_POLICY_SHADOW_REVIEW_ONLY','BAD_SOURCE_STATUS')
              check((m['players'],m['quarterbacks'],m['approved_prices_locked'],m['protected_controls_locked'])==(565,64,15,18),'SOURCE_SCOPE_DRIFT')
              check(not m['production_authorized'] and m['production_files_mutated']==0,'SOURCE_NOT_READ_ONLY')
              for name,digest in m['files'].items():check(sha(source/name)==digest,'PINNED_ARTIFACT_MEMBER_SHA_DRIFT_'+name)
              check(sha(repo/'index.html')==EXPECTED_INDEX_SHA256,'CANONICAL_INDEX_CHANGED_SINCE_V1R18_PIN')
              script=repo/'scripts/validation/snapshot_values.py'
              check(script.is_file(),'CANONICAL_SNAPSHOT_SCRIPT_MISSING')
              spec=importlib.util.spec_from_file_location('cal26_snapshot_validation',script)
              snap=importlib.util.module_from_spec(spec);spec.loader.exec_module(snap)
              cfg=snap.load_from_html(repo/'index.html')
              # Snapshot parity must use the V1R18 evaluation date. RB fractional ages
              # otherwise drift as the calendar moves, although the frozen input has not changed.
              orig_age=snap.effective_age_multiplier
              def pinned_age(pos,age,role,key,real_production,raw_production,cfg):
                  return orig_age(pos,age,role,key,real_production,raw_production,cfg,as_of=date(2026,10,22))
              snap.effective_age_multiplier=pinned_age
              computed=snap.compute_all_values(cfg)
              process(loadcsv(source/SOURCE_ROWS),loadcsv(source/SOURCE_QB),cfg,computed,snap,out,{'index_sha256':EXPECTED_INDEX_SHA256})
          
          if __name__=='__main__':
              a=argparse.ArgumentParser();a.add_argument('--selftest',action='store_true');a.add_argument('--repo');a.add_argument('--source');a.add_argument('--out');x=a.parse_args()
              if x.selftest:selftest()
              else:
                  check(x.repo and x.source and x.out,'REPO_SOURCE_OUT_REQUIRED')
                  main(x.repo,x.source,x.out)
          PY_CAL26_V1R20
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r20_engine.py"
          python3 "$RUNNER_TEMP/cal26_v1r20_engine.py" --selftest
      - name: Diagnose 64 QBs and independently reproduce all 565 canonical prices
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r20_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --source "$RUNNER_TEMP/cal26_v1r19_pinned_source" \
            --out "$RUNNER_TEMP/CAL26_V1R20_Evidence"
      - name: Independently verify 565 scope QB feedback owner locks and file integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CAL26_VERIFY'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R20_Evidence'
          m=json.loads((p/'CAL26_V1R20_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R20_READ_ONLY_QB_DRIVER_DIAGNOSTIC'
          assert (m['players'],m['qbs'],m['owner_qb_feedback'])==(565,64,14)
          assert (m['owner_anchors_protected'],m['accepted_controls_protected'])==(15,18)
          assert m['baseline_price_parity_players']==565
          assert m['production_change_authorized'] is False and m['production_files_mutated']==0
          assert m['canonical_index_sha256']=='6ff8fcef45c1bb7f688ae6be52ec1a0d620d33706b4acbc7ece1bc13874ac6e9'
          for f,h in m['files'].items():
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==h,f
          def read(f):
              with (p/f).open(newline='',encoding='utf-8') as h:return list(csv.DictReader(h))
          allrows=read('CAL26_V1R20_All_565_Reproduced_Baseline_Zero_Write_Audit.csv')
          qb=read('CAL26_V1R20_64_QB_Component_Attribution_and_Scenarios.csv')
          labels=read('CAL26_V1R20_14_Owner_QB_Feedback_Scenario_Review.csv')
          assert len(allrows)==565 and len({r['player'] for r in allrows})==565
          assert sum(r['protected']=='True' for r in allrows)==33
          assert all(r['computed_fv_parity']=='True' and r['unchanged_in_repository']=='True' for r in allrows)
          assert len(qb)==64 and len(labels)==14 and len({r['player'] for r in qb})==64
          assert all(int(r['age'])<=25 or int(r['half_relief_delta'])==0 for r in qb)
          assert all(not (r['is_owner_protected']=='True') or int(r['half_relief_delta'])==0 for r in qb)
          assert all(r['half_youth_relief_direction']!='worsens' for r in labels if r['feedback']!='Correct')
          print('PASS V1R20: 565 canonical parity / 64 QB components / 33 locks / 14 feedback / no writes')
          PY_CAL26_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS zero production or repository writes'
      - name: Upload read-only QB diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R20-QB-FV-Drivers-565-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R20_Evidence
          if-no-files-found: error
          retention-days: 60
