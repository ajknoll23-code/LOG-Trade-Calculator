                      Path("research/idp-position-lineage-v1/phase3_production_confirmation.json")
                  ),
                  "index.html":sha(Path("index.html")),
                  "snapshot_values.py":sha(
                      Path("scripts/validation/snapshot_values.py")
                  ),
                  "production_v2_phase1_audit.json":sha(
                      Path("research/production-v2/production_v2_phase1_audit.json")
                  ),
                  "prod_mult_lineage_audit.json":sha(
                      Path("research/legacy-prod-mult/prod_mult_lineage_audit.json")
                  ),
                  "age_curve_v2_phase5_evaluation.json":sha(
                      Path("research/age-curve-v2/age_curve_v2_phase5_evaluation.json")
                  ),
                  "position_weight_v2_phase5_evaluation.json":sha(
                      Path("research/position-weight-v2/position_weight_v2_phase5_evaluation.json")
                  ),
              }
          }
          (D/"manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: B1 DB audit manifest frozen; kickers excluded.")
