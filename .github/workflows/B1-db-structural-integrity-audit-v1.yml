      - name: Prove exact B1 research-only scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          allowed={
              "research/db-structural-integrity-audit-v1/audit_protocol.json",
              "research/db-structural-integrity-audit-v1/audit_result.json",
              "research/db-structural-integrity-audit-v1/audit_report.md",
              "research/db-structural-integrity-audit-v1/manifest.json",
          }

          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}

          unexpected=touched-allowed
          missing=allowed-touched
          if unexpected:
              raise SystemExit(
                  "Unexpected B1 file changes: "
                  + ", ".join(sorted(unexpected))
              )
          if missing:
              raise SystemExit(
                  "Missing B1 research files: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: B1 touched exactly four DB research files.")
          PY

          git diff --check

      - name: Commit B1 DB audit freeze
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B1."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/db-structural-integrity-audit-v1/

          git diff --cached --check
          git commit -m "Freeze DB structural integrity audit V1"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: B1 DB structural integrity audit committed cleanly."
