          from pathlib import Path

          D=Path("research/db-structural-integrity-audit-v1")
          protocol=json.loads((D/"audit_protocol.json").read_text())
          result=json.loads((D/"audit_result.json").read_text())

          assert result["status"]=="AUDIT_COMPLETE"
