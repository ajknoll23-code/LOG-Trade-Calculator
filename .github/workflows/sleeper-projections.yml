name: Sleeper 2026 Projections

# Manual-trigger-only. Go to Actions tab, select "Sleeper 2026 Projections"
# in the left sidebar, click "Run workflow".
#
# Output: scripts/sleeper_2026_projections.json, committed back to the
# repo automatically. This is the Sleeper half of the section 6e
# 2026-projections blend (proj_2026 = 0.5 * sleeper + 0.5 * fantasypros).
# The FantasyPros half comes from extracting the roster screenshots
# separately, not from this workflow.
#
# Re-run this periodically as the season approaches / progresses --
# Sleeper's own projections update over time, unlike the one-time
# FantasyPros screenshot extraction.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sleeper-projections-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Sleeper projections pipeline
        run: python3 scripts/sleeper_projections_pipeline.py

      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sleeper_2026_projections.json
          git diff --staged --quiet || git commit -m "Update Sleeper 2026 projections"
          git push
