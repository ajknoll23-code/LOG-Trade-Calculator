name: B48 V1 - Player Role V2 Meaning, Identity and Full Pool FV Shadow Audit

# Research-only post-discovery assessment. Historic Week-5 results were already seen.
# This workflow cannot change production, frozen Role V2, or a deployment flag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b48-v1-readonly-player-role-shadow
  cancel-in-progress: false

jobs:
  research_audit:
    name: B48 - pinned model semantics, identity and full FV impact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout full durable history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact frozen input blobs and prove Week 5 source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          dir="$RUNNER_TEMP/b48-input"
          mkdir -p "$dir"
          printf "B48_INPUT_DIR=%s\n" "$dir" >> "$GITHUB_ENV"
          printf "B48_OUTPUT_DIR=%s\n" "$RUNNER_TEMP/b48-output" >> "$GITHUB_ENV"
          git cat-file blob bb6ebc51f71565a3735ed0d060dca94ec68dadef > "$dir/index.html"
          test "$(git hash-object "$dir/index.html")" = bb6ebc51f71565a3735ed0d060dca94ec68dadef
          git cat-file blob 248912dfa0fede2b74824ec67df50c613f542f57 > "$dir/role_snapshot.json"
          test "$(git hash-object "$dir/role_snapshot.json")" = 248912dfa0fede2b74824ec67df50c613f542f57
          git cat-file blob 62c13a75db9807d05d1923aae6db2477bf409091 > "$dir/dual_eligibility.json"
          test "$(git hash-object "$dir/dual_eligibility.json")" = 62c13a75db9807d05d1923aae6db2477bf409091
          git cat-file blob 9636e6b4f6bf3892192c9f31052483c54cc650e5 > "$dir/league_rosters.json"
          test "$(git hash-object "$dir/league_rosters.json")" = 9636e6b4f6bf3892192c9f31052483c54cc650e5
          git cat-file blob c1961f0006813b346f2a59838152206e064b39dc > "$dir/b41e.json"
          test "$(git hash-object "$dir/b41e.json")" = c1961f0006813b346f2a59838152206e064b39dc
          git cat-file blob 669eb6ed92c6309029979bbfdf336d74885e6919 > "$dir/b41c.json"
          test "$(git hash-object "$dir/b41c.json")" = 669eb6ed92c6309029979bbfdf336d74885e6919
      - name: Stage pinned read-only B48 Node evaluator
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/b48_shadow.js" <<'B48NODE'
          // B48 V1: descriptive post-discovery shadow audit, pinned 2026-10-13 UTC.
          // Does not authorize or change the production calculator or frozen Role V2.
          'use strict';
          const fs = require('fs'), vm = require('vm'), path = require('path'), crypto = require('crypto');
          const root = process.env.B48_INPUT_DIR;
          const out = process.env.B48_OUTPUT_DIR;
          if (!root || !out) throw Error('B48_FAIL_CLOSED_ENV_MISSING');
          const read = (name) => fs.readFileSync(path.join(root,name),'utf8');
          const parse = (name) => JSON.parse(read(name));
          const fail = (s) => { throw Error('B48_FAIL_CLOSED_'+s); };
          const check = (x,s) => { if(!x) fail(s); };
          const date = '2026-10-13T12:00:00Z';
          class StudyDate extends Date {
            constructor(...args) { super(...(args.length ? args : [date])); }
            static now(){return Date.parse(date);}
          }
          const bandLabels = [
           'Bottom Band','Low Band','Lower-Middle Band','Middle Band',
           'Upper-Middle Band','High Band','Top Band'
          ];
          const frozenOrder = ['Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite'];
          const bandByOld = Object.fromEntries(frozenOrder.map((x,i)=>[x,bandLabels[i]]));
          const eContract = parse('b41e.json');
          const devContract = parse('b41c.json');
          check(JSON.stringify(eContract.role_order)===JSON.stringify(frozenOrder),'B41E_FROZEN_TIER_ORDER_CHANGED');
          check(devContract.frozen_target.primary_target.includes('next four active games'),'B41C_TARGET_SEMANTICS_DRIFT');
          const html = read('index.html');
          const engineAnchors = [...html.matchAll(/<script>\s*\/\* ---------- Value engine ---------- \*\//g)];
          check(engineAnchors.length===1,'UNIQUE_LIVE_ENGINE_ANCHOR');
          const start=engineAnchors[0].index+ '<script>'.length;
          const end=html.indexOf('</script>',start);
          check(end>start,'LIVE_ENGINE_END_MISSING');
          let script=html.slice(start,end);
          const bottom="document.getElementById('resetBtn').addEventListener('click', clearCalculator);";
          check(script.split(bottom).length===2,'RENDER_BOOT_BOUNDARY_DRIFT');
          script=script.slice(0,script.indexOf(bottom));
          const context={ Date:StudyDate, console:{log:()=>{},warn:()=>{},error:()=>{}}, setTimeout:()=>fail('UNEXPECTED_TIMER') };
          vm.createContext(context);
          vm.runInContext(script+ '\n;globalThis.__B48_ENGINE={PLAYER_DB,playerValue,productionMultiplier,normalizeName,titleCase,PROD_MULT,NO_REAL_PRODUCTION_HISTORY};',context,{timeout:25000});
          const engine=context.__B48_ENGINE;
          check(engine&&typeof engine.playerValue==='function','PLAYER_VALUE_MISSING');
          const normalize = (x) => engine.normalizeName(x).trim();
          const withoutSuffix = x => normalize(x).replace(/ (jr|sr|ii|iii|iv|v)$/,'');
          const snapshot=parse('role_snapshot.json'), league=parse('league_rosters.json');
          const dual=parse('dual_eligibility.json');
          check(Array.isArray(snapshot.players)&&snapshot.players.length===1450,'SHADOW_ROW_COUNT_DRIFT');
          check(Array.isArray(league.rosters)&&Array.isArray(dual),'IDENTITY_SOURCE_SCHEMA_DRIFT');
          check(snapshot.eligible_rostered_players===495,'B47_ELIGIBLE_COHORT_DRIFT');
          const byName = new Map(), bySid = new Map();
          for(const p of snapshot.players){
            check(p&&typeof p.name==='string'&&typeof p.sleeper_id==='string','V2_ID_OR_NAME_INVALID');
            check(frozenOrder.includes(p.role_tier),'V2_UNKNOWN_FROZEN_TIER');
            check(['QB','RB','WR','TE','K','DL','LB','DB'].includes(p.position),'V2_POSITION_INVALID');
            check(!bySid.has(p.sleeper_id),'V2_DUPLICATE_SLEEPER_ID');
            bySid.set(p.sleeper_id,p);
            const k=normalize(p.name);
            if(!byName.has(k))byName.set(k,[]);
            byName.get(k).push(p);
          }
          const rosterById = new Map(), rosterConflictIds = new Set();
          for(const team of league.rosters){
            for(const v of Object.values(team)){
              if(!Array.isArray(v))continue;
              for(const p of v){
                if(!p||typeof p!=='object'||!p.player_id||!p.name)continue;
                const id=String(p.player_id), record={id,name:p.name,team:p.team||'',position:p.position||''};
                if(rosterById.has(id)){
                  const old=rosterById.get(id);
                  if(normalize(old.name)!==normalize(record.name)||old.team!==record.team){
                    rosterById.delete(id);
                    rosterConflictIds.add(id);
                  }
                }else if(!rosterConflictIds.has(id)) rosterById.set(id,record);
              }
            }
          }
          const dualById = new Map(dual.map(p=>[String(p.sleeper_id),p]));
          function identity(name,info){
            const k=normalize(name), exact=byName.get(k)||[];
            let pool=exact, method='EXACT_NAME';
            if(pool.length===0){
              pool=snapshot.players.filter(p=>withoutSuffix(p.name)===k);
              method='SUFFIX_ALIAS';
            }
            const matches=pool.filter(p=>{
              const r=rosterById.get(p.sleeper_id);
              return !!r && normalize(r.name)===k && (r.team||'')===(info.team||'');
            });
            let c=null, provenance='';
            if(pool.length===1){c=pool[0];provenance=method==='EXACT_NAME'?'UNIQUE_NAME':'ALIAS_CANDIDATE';}
            else if(pool.length>1 && matches.length===1){c=matches[0];provenance='ROSTER_ID_DISAMBIGUATED';}
            if(!c)return {status:pool.length>1?'HOLD_AMBIGUOUS_IDENTITY':'HOLD_NO_FROZEN_ROLE_EVIDENCE',candidate:pool.length===1?pool[0]:null,candidates:pool.map(p=>p.sleeper_id),method};
            if(method==='SUFFIX_ALIAS'){
              const r=rosterById.get(c.sleeper_id);
              if(!r||normalize(r.name)!==k||r.team!==(info.team||''))
                return {status:'HOLD_ALIAS_NOT_ROSTER_CORROBORATED',candidate:c,candidates:[c.sleeper_id],method};
              provenance='ROSTER_ID_ALIAS_CONFIRMED';
            }
            if(c.position===info.pos)return {status:'MATCH_SAME_VALUATION_POSITION',candidate:c,provenance,method};
            const d=dualById.get(c.sleeper_id);
            const approved=!!(d&&d.name_collision===false&&Array.isArray(d.eligible_buckets)&&d.eligible_buckets.includes(info.pos)&&d.eligible_buckets.includes(c.position)&&d.current_trade_desk_position===info.pos);
            return {status:approved?'HOLD_DUAL_ELIGIBLE_CROSS_POSITION':'HOLD_CROSS_POSITION_NOT_VERIFIED',candidate:c,provenance,method,dualEvidenced:approved};
          }
          function val(info,name,role){
            const v=engine.playerValue(info.pos,info.age,role,engine.titleCase(name));
            check(Number.isFinite(v)&&v>0&&Number.isInteger(v),'FV_NONFINITE_OR_NONPOSITIVE');
            return v;
          }
          const baseRecords=Object.entries(engine.PLAYER_DB);
          check(baseRecords.length===565,'PLAYER_DB_COUNT_DRIFT');
          const records=baseRecords.map(([key,info])=>{
            check(frozenOrder.includes(info.role),'LEGACY_ROLE_UNKNOWN');
            const original=val(info,key,info.role), id=identity(key,info), c=id.candidate||null;
            const safe=id.status==='MATCH_SAME_VALUATION_POSITION';
            const after=safe?val(info,key,c.role_tier):null;
            const delta=safe?after-original:null;
            return {player:engine.titleCase(key),name_key:key,valuation_position:info.pos,age:info.age,
              legacy_role:info.role,legacy_role_display_band:bandByOld[info.role],v2_role:c?c.role_tier:null,
              proposed_v2_production_band:c?bandByOld[c.role_tier]:null,
              model_position:c?c.position:null,sleeper_id:c?c.sleeper_id:null,
              current_fv:original,shadow_fv:after,delta_fv:delta,
              delta_pct:safe?100*delta/original:null,
              match_status:id.status,identity_method:id.method,identity_provenance:id.provenance||null,
              has_existing_production_data:Object.prototype.hasOwnProperty.call(engine.PROD_MULT,normalize(key)),
              fv_delta_pathway:!safe||delta===0?null:(engine.productionMultiplier(engine.titleCase(key),info.role)!==engine.productionMultiplier(engine.titleCase(key),c.role_tier)?(Object.prototype.hasOwnProperty.call(engine.PROD_MULT,normalize(key))?'PRODUCTION_MULTIPLIER_FLOOR_OR_ELITE_CLAMP':'NO_PRODUCTION_DATA_ROLE_ESTIMATE'):'AGE_PATH_ONLY'),
              role_changed:safe?info.role!==c.role_tier:null,
              identity_candidates:id.candidates||null
            };
          }).sort((a,b)=>b.current_fv-a.current_fv||a.name_key.localeCompare(b.name_key));
          records.forEach((r,i)=>r.current_rank=i+1);
          const eligible=records.filter(r=>r.match_status==='MATCH_SAME_VALUATION_POSITION');
          const currentOrder=[...eligible].sort((a,b)=>b.current_fv-a.current_fv||a.name_key.localeCompare(b.name_key));
          const shadowOrder=[...eligible].sort((a,b)=>b.shadow_fv-a.shadow_fv||a.name_key.localeCompare(b.name_key));
          currentOrder.forEach((r,i)=>r.matched_cohort_baseline_rank=i+1);
          shadowOrder.forEach((r,i)=>r.matched_cohort_shadow_rank=i+1);
          records.forEach(r=>r.matched_cohort_rank_change=r.matched_cohort_baseline_rank == null?null:r.matched_cohort_baseline_rank-r.matched_cohort_shadow_rank);
          const top=records.slice(0,100), prevStatuses={};top.forEach(r=>{prevStatuses[r.match_status]=(prevStatuses[r.match_status]||0)+1;});
          const reviewed=top.filter(r=>r.match_status!=='MATCH_SAME_VALUATION_POSITION');
          const rankMovers=eligible.filter(r=>r.matched_cohort_rank_change!==0).sort((a,b)=>Math.abs(b.matched_cohort_rank_change)-Math.abs(a.matched_cohort_rank_change));
          const roleMovers=eligible.filter(r=>r.delta_fv!==0).sort((a,b)=>Math.abs(b.delta_fv)-Math.abs(a.delta_fv));
          const labeledSemantics={
           model_target:'Mean custom-league fantasy points per active game over the next four active games, transformed to within-position origin-week percentile',
           current_role_name_is_potentially_misleading:true,
           proposed_axis:'Projected Production Band (within the frozen position-specific model; not starter status, snap share, or dynasty asset security)',
           tiers:frozenOrder.map((role,index)=>({index,model_role_unmodified:role,proposed_display_label:bandLabels[index]})),
           display_only:true,does_not_refit_or_rethreshold_model:true,
           release_approved:false,requires_separate_review:true,
           explanatory_example:'Justin Herbert frozen Role V2 Rotational => Middle Band, not a claim that he splits QB snaps.'
          };
          const summary={
           status:'B48_V1_DESCRIPTIVE_POST_DISCOVERY_SHADOW_ONLY',as_of_utc:'2026-10-13',
           total_static_valuation_players:records.length,total_frozen_v2_players:snapshot.players.length,
           safe_same_position_matches:eligible.length,top100_count:top.length,
           top100_safe_matches:top.length-reviewed.length,top100_review_required:reviewed.length,
           top100_role_changes:top.filter(r=>r.role_changed===true).length,
           top100_fv_changes:top.filter(r=>r.delta_fv!==null&&r.delta_fv!==0).length,
           top100_delta_absolute_total:top.reduce((s,r)=>s+(r.delta_fv||0),0),
           top100_match_status_counts:prevStatuses,
           full_pool_fv_changes:roleMovers.length,
           full_pool_top_15_absolute_fv_deltas:roleMovers.slice(0,15).map(r=>({name:r.player,delta_fv:r.delta_fv,delta_pct:r.delta_pct})),
           full_pool_top_15_matched_cohort_rank_movements:rankMovers.slice(0,15).map(r=>({name:r.player,rank_change:r.matched_cohort_rank_change})),
           unresolved_policy:'No cross-position tier substitution, guessed alias, or invented FV delta',
           confidence_not_calibrated:true,production_change_authorized:false,
           observed_impact_is_not_evidence_of_dynasty_calibration:true,
           methodological_caution:'Already inspected Week 5 outcomes: descriptive only, cannot claim prospective independent validation.'
          };
          fs.mkdirSync(out,{recursive:true});
          const csvQuote=x=>x==null?'':String(x).match(/[",\r\n]/)?'"'+String(x).replace(/"/g,'""')+'"':String(x);
          function writeCSV(name,rows,headers){
            const data=[headers.join(','),...rows.map(r=>headers.map(k=>csvQuote(r[k])).join(','))].join('\n')+'\n';
            fs.writeFileSync(path.join(out,name),data);
          }
          writeCSV('b48_top100_shadow_valuation.csv',top,['current_rank','player','valuation_position','legacy_role','v2_role','proposed_v2_production_band','current_fv','shadow_fv','delta_fv','delta_pct','match_status','model_position','sleeper_id','identity_provenance','fv_delta_pathway']);
          writeCSV('b48_full565_shadow_valuation.csv',records,['current_rank','player','valuation_position','legacy_role','v2_role','proposed_v2_production_band','current_fv','shadow_fv','delta_fv','delta_pct','match_status','model_position','sleeper_id','has_existing_production_data','fv_delta_pathway','matched_cohort_baseline_rank','matched_cohort_shadow_rank','matched_cohort_rank_change']);
          writeCSV('b48_top100_identity_review.csv',reviewed,['current_rank','player','valuation_position','model_position','sleeper_id','legacy_role','v2_role','current_fv','shadow_fv','delta_fv','match_status','identity_method','identity_provenance']);
          writeCSV('b48_matched_cohort_rank_movers.csv',rankMovers,['player','valuation_position','current_fv','shadow_fv','delta_fv','matched_cohort_baseline_rank','matched_cohort_shadow_rank','matched_cohort_rank_change']);
          fs.writeFileSync(path.join(out,'b48_evidence_summary.json'),JSON.stringify(summary,null,2)+'\n');
          fs.writeFileSync(path.join(out,'b48_tier_display_semantics.json'),JSON.stringify(labeledSemantics,null,2)+'\n');
          const pins={index_blob:'bb6ebc51f71565a3735ed0d060dca94ec68dadef',role_v2_blob:'248912dfa0fede2b74824ec67df50c613f542f57',dual_eligibility_blob:'62c13a75db9807d05d1923aae6db2477bf409091',league_rosters_blob:'9636e6b4f6bf3892192c9f31052483c54cc650e5',b41e_contract_blob:'c1961f0006813b346f2a59838152206e064b39dc',b41c_prereg_blob:'669eb6ed92c6309029979bbfdf336d74885e6919'};
          fs.writeFileSync(path.join(out,'b48_source_and_method_manifest.json'),JSON.stringify({pins,method:'Exact live index.html playerValue() with frozen Date, only same FV position and verified identity',no_production_writes:true,post_discovery:true,regression_confidence:'NOT_VALIDATED_AS_PRODUCTION_ADOPTION'},null,2)+'\n');
          check(records.length===565&&top.length===100,'REPORT_ROW_COUNT');
          check(top.filter(r=>r.match_status==='MATCH_SAME_VALUATION_POSITION').length===85&&eligible.length===457&&roleMovers.length===92,'UNEXPECTED_SAFE_MATCH_REGRESSION');
          check(top.find(r=>r.name_key==='justin herbert')?.proposed_v2_production_band==='Middle Band','HERBERT_MIDDLE_BAND_REGRESSION');
          console.log(JSON.stringify(summary,null,2));
          B48NODE
          node --check "$RUNNER_TEMP/b48_shadow.js"
      - name: Execute full static-player shadow and write scientific cautions
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/b48_shadow.js"
          python3 - <<'B48AUDIT'
          import csv, json, os
          from pathlib import Path
          p=Path(os.environ["B48_OUTPUT_DIR"])
          read=lambda n: list(csv.DictReader((p/n).open(newline="", encoding="utf-8")))
          top=read("b48_top100_shadow_valuation.csv")
          full=read("b48_full565_shadow_valuation.csv")
          review=read("b48_top100_identity_review.csv")
          summary=json.loads((p/"b48_evidence_summary.json").read_text())
          semantics=json.loads((p/"b48_tier_display_semantics.json").read_text())
          assert len(top)==100 and len(full)==565
          assert len(review)==summary["top100_review_required"]
          assert all(x["delta_fv"]=="" and x["shadow_fv"]=="" for x in review)
          assert all(x["shadow_fv"]!="" for x in top if x["match_status"]=="MATCH_SAME_VALUATION_POSITION")
          assert all(not x["match_status"].startswith("MATCH_") or x["valuation_position"]==x["model_position"] for x in top)
          assert semantics["tiers"][3]["proposed_display_label"]=="Middle Band"
          assert semantics["release_approved"] is False
          assert summary["production_change_authorized"] is False
          print("PASS: row counts, unresolved fail-closed, no cross-position FV injection, labels explicitly nonbinding")
          B48AUDIT
      - name: Upload reproducible B48 research only outputs
        uses: actions/upload-artifact@v4
        with:
          name: B48-V1-research-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/b48-output/
          if-no-files-found: error
          retention-days: 60
