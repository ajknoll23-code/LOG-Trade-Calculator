                  "adjudications_canonical_sha256":adjudications_sha,
                  "dry_run_adjudications_sha256_confirmed":supplied_dry_sha,
                  "overrides_targeted_at_B44W4_residual_after_result_known":True,
                  "positive_machine_DOB_conflicts_required_for_R5_path":True,
                  "authoritative_source_policy":{
                      "source_count_per_override":2,
                      "exactly_two_submitted_sources_both_must_pass":True,
                      "distinct_organizations_required":True,
                      "tier_A_or_tier_B_policy":"Path A: >=1 Tier A organization + 1 other distinct allowed organization; Path B: 2 distinct Tier B organizations",
                      "allowed_organizations":[{"organization":o,"tier":t} for o,t,_ in ORG_RULES],
                      "adjudicated_dob_must_equal_exactly_one_machine_dob":True,
                      "machine_dobs_strictly_normalized_before_comparison":True,
                      "player_binding_methods":["PLAYER_PAGE_VISIBLE_TEXT_PROXIMITY","JSON_LD_PERSON","STRUCTURED_ROSTER_ROW_CBS_ONLY"],
                      "arbitrary_raw_html_or_non_jsonld_script_matches_forbidden":True,
                      "competing_machine_dob_in_evidence_rejected":True,
                      "pdf_sources_rejected":True,
                      "https_only":True,
                      "credentials_in_url_forbidden":True,
                      "explicit_non_443_ports_forbidden":True,
                      "redirect_must_remain_same_organization":True,
                      "streamed_decompressed_download_cap_bytes":MAX_SOURCE_BYTES,
                      "commit_refetches_and_revalidates_content_claim":True,
                      "commit_exact_page_sha_pin_required":False,
                      "commit_records_page_sha_timestamp_final_url_org_tier_http_status_and_excerpt":True,
                      "R6_CBS_structured_roster_row_rule":"CBS_SPORTS only; target canonical name and adjudicated DOB must occur in the same HTML <tr>; competing machine DOB in that row rejects the source",
                      "source_transport_failure_is_per_source_fail_closed_not_whole_dry_run_crash":True,
