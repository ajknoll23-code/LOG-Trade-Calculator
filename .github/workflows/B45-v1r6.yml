              print("Accepted overrides: 3")
              print("Production authorized: false")

          if __name__=="__main__":
              selftest() if "--selftest" in sys.argv else run()
          PY

          python /tmp/b45_r6.py --selftest
          python -m py_compile /tmp/b45_r6.py
          python /tmp/b45_r6.py

          if [ "$MODE" = 'dry_run' ]; then
            test ! -e "$BASE/b45_identity_overrides.csv"
            test ! -e "$BASE/b45_evidence.json"
            test -z "$(git status --porcelain)"
            test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA_BEFORE"
            test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA_BEFORE"
