                             "fresh_sleeper_player_map_sha256":sha256_bytes(sleeper_bytes),
                             "nflverse_2026_weekly_stats_sha256":sha256_bytes(stats_bytes),
                             "stable_crosswalk_sha256":cross_sha,"B41I_snapshot_sha256":sha256_file(B41I)},
                  "override_csv_sha256":sha256_file(OUT_CSV),
