name: Build Package Adjustment Shadow V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write Shadow V2 builder
        shell: bash
        run: |
          python3 - <<'PY2'
          import base64
          from pathlib import Path
          p = Path("scripts/market/build_package_adjustment_shadow_v2.py")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_bytes(base64.b64decode(""))
          print("Wrote", p)
          PY2

      - name: Self-test and build Shadow V2
        run: |
          python3 -m py_compile scripts/market/build_package_adjustment_shadow_v2.py
          python3 scripts/market/build_package_adjustment_shadow_v2.py --selftest
          python3 scripts/market/build_package_adjustment_shadow_v2.py

      - name: Verify Shadow V2 contract
        shell: bash
        run: |
          python3 - <<'PY2'
          import json
          from pathlib import Path
          p = Path("research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json")
          doc = json.loads(p.read_text())
          assert doc["schema_version"] == 2
          assert doc["status"] == "research_only_shadow"
          assert doc["consumer_changed"] is False
          assert doc["fundamental_value_consumer_changed"] is False
          assert doc["market_value_consumer_changed"] is False
          assert doc["team_utility_consumer_changed"] is False
          assert doc["trade_verdict_consumer_changed"] is False
          assert doc["production_formula_enabled"] is False
          assert doc["production_promotion_allowed"] is False
          assert doc["preferred_candidate"] == "hybrid_v3_2p_target_sensitive_v4_3p_ratio_only"
          assert doc["torture_tests_all_passed"] is True
          assert 1.75 <= float(doc["size3"]["multiplier"]) <= 2.15
          assert float(doc["size3"]["raw_2_05_package_choice_pct"]) == 50.0
          assert float(doc["size3"]["bootstrap_within_tested_range_pct"]) >= 80.0
          print("Package Adjustment Shadow V2 contract verified.")
          print("3-player multiplier:", doc["size3"]["multiplier"])
          PY2

      - name: Commit Shadow V2
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/market/build_package_adjustment_shadow_v2.py
          git add research/package-adjustment-shadow-v2/
          if git diff --cached --quiet; then
            echo "No Shadow V2 changes."
            exit 0
          fi
          git commit -m "Build Package Adjustment Shadow V2"
          git pull --rebase origin main
          git push origin main
