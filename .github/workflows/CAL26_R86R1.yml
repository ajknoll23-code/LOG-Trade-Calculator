# R84-adjudicated R86 companion. This file is read-only and never deploys or edits FV.
name: CAL26 V1R86R1 - R84 Aware 2026 Mobile Utility Companion (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-r86r1-r84-aware-mobile-utility-preview
  cancel-in-progress: false
jobs:
  render-mobile-research-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen live calculator source read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download GitHub verified R84 methodological audit
        uses: actions/download-artifact@v4
        with:
          name: CAL26_R84_CLAUDE_REVIEW_TWO_ORIGIN_H2_ROBUSTNESS_FV_HOLD
          run-id: 40142419994
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-r86r1-input/R84
      - name: Download GitHub verified R85 joint lineup scenario
        uses: actions/download-artifact@v4
        with:
          name: CAL26_R85_2026_AND_SYNTHETIC_2027_JOINT_LINEUP_MARGINAL_UTILITY_NO_FV_RELEASE
          run-id: 40142071235
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-r86r1-input/R85
      - name: Verify pinned science and generate static 518 player mobile preview (NO FV)
        shell: bash
        run: |
          set -euo pipefail
          # Runtime source freeze: no code or pricing updates and no holds consumed.
          test "$(git hash-object index.html)" = "5630bb681dd8710f8e45bc5363488f358ce9ebe2"
          test "$(git hash-object research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json)" = "8e350fc927417d2f8afceb5b42545e48e3622fff"
          test -z "$(git status --porcelain --untracked-files=all)"
          cat > "$RUNNER_TEMP/CAL26_R86R1_engine.py" <<'PY_R86R1'
          #!/usr/bin/env python3
          """CAL26 R86R1: pinned R84-aware, R85-based static research preview. No FV edits."""
          import argparse, collections, csv, hashlib, html, json, pathlib, shutil
          P = pathlib.Path
          R84_MANIFEST = 'CAL26_R84_manifest.json'
          R85_MANIFEST = 'CAL26_R85_manifest.json'
          R84_H2 = 'CAL26_R84_TWO_ORIGIN_H2_BOOTSTRAP_SKILL_RESEARCH_ONLY.csv'
          R85_518 = 'CAL26_R85_518_PLAYER_POOLED_LINEUP_MARGINAL_UTILITY_NOT_FV.csv'
          PINS = {
           R84_H2:'aefbf7f24f47f40e5ff6f4ef184fddcd2a2e71c821559a253a74e01a823e2094',
           R85_518:'25643240e4b7489d67f01316672a3f9fec4d7109402019e688d5b832218e0b83',
          }
          FOCUS = ['drake maye','cj stroud','bryce young','malik nabers','puka nacua']
          SLOTS={'QB':1,'RB':2,'WR':2,'TE':1,'FLEX':1,'SUPER_FLEX':1,'K':1,'DL':2,'LB':2,'DB':2,'IDP_FLEX':2}
          POSITIONS = ('QB','RB','WR','TE','DL','LB','DB')
          
          def check(v,msg):
           if not v: raise AssertionError(msg)
          def sha(p):return hashlib.sha256(P(p).read_bytes()).hexdigest()
          def readcsv(p):
           with P(p).open(encoding='utf-8',newline='') as h:return list(csv.DictReader(h))
          def dumpcsv(p,rows):
           check(bool(rows),'EMPTY_EXPORT')
           with P(p).open('w',encoding='utf-8',newline='') as h:
            w=csv.DictWriter(h,fieldnames=list(rows[0]),lineterminator='\n');w.writeheader();w.writerows(rows)
          def fmt(n):return f'{n:,.1f}'
          def numeric(s):return float(s) if s not in ('',None) else 0.0
          
          def generate(args):
           r84=P(args.r84);r85=P(args.r85);out=P(args.out);out.mkdir(parents=True,exist_ok=True)
           for name in (R84_MANIFEST,R84_H2):check((r84/name).exists(),'MISSING_R84_'+name)
           for name in (R85_MANIFEST,R85_518):check((r85/name).exists(),'MISSING_R85_'+name)
           for fn,d in [(R84_H2,r84),(R85_518,r85)]:check(sha(d/fn)==PINS[fn],'PIN_MISMATCH_'+fn)
           m84=json.loads((r84/R84_MANIFEST).read_text());m85=json.loads((r85/R85_MANIFEST).read_text())
           check(m84['status']=='CLAUDE_REVIEW_CHECKED_TWO_ORIGIN_RETROSPECTIVE_H2_HOLD','WRONG_R84_STATE')
           check(m84['exploratory_positions_twofold_supported']==[],'R84_SCIENCE_CHANGED_REVIEW')
           check(not m84['absolute_FV_scale_identified'] and m84['production_changes']==0,'R84_PRICING_GATE')
           check(m84['retrospective_origin_split_not_true_point_in_time'] and m84['historical_missing_future_as_zero_is_assumption'],'R84_CAVEAT_MISSING')
           check(m85['decision']=='RESEARCH_ONLY_NO_FV_SCALE_OR_DEPLOY','WRONG_R85_STATE')
           check(m85['players']==518 and m85['eligible']==389 and m85['excluded_lowGP']==129,'R85_COHORT_DRIFT')
           check(m85['modeled_nonK_slots']==192 and m85['unmodeled_fixed_K_slots']==12,'SLOTS_DRIFT')
           check(m85['H1_is_synthetic_reconstruction'] and not m85['2027_raw_forecast_independently_frozen'],'WRONG_H1_STATUS')
           check(not m85['FV_scale_identified'] and not m85['team_by_team_lineups_optimized'] and not m85['multi_position_player_eligibility_verified'] and not m85['production_write_count'],'UNAUTHORIZED_MODEL_CLAIMS')
           snapshot=json.loads(P(args.snapshot).read_text())
           check(snapshot['league_id']=='1326679131051532288' and str(snapshot['season'])=='2026','WRONG_LEAGUE')
           check(dict(collections.Counter(k for k in snapshot['roster_positions'] if k!='BN'))==SLOTS,'SLOT_SPEC_CHANGED')
           rows=readcsv(r85/R85_518);hist=readcsv(r84/R84_H2)
           check(len(rows)==518 and len(hist)==14,'ROW_COUNT_DRIFT')
           check({(q['position'],q['test_origin_year']) for q in hist}=={(p,y) for p in POSITIONS for y in ('2022','2023')},'H2_ROW_INVALID')
           check(all(q['genuinely_point_in_time_validated']=='False' and q['forecast_transport_to_2026_Week6_validated']=='False' for q in hist),'H2_VALIDITY_DRIFT')
           assert len({(x['name'],x['position']) for x in rows})==len(rows),'DUPLICATE_PLAYER_POSITION'
           data=[]
           for r in rows:
            check(r['position'] in POSITIONS,'INVALID_POSITION')
            gp=int(r['GP_through_2026_Week6']);eligible=(r['H0_GP4plus_eligible']=='True');u=numeric(r['H0_lineup_removal_loss_points_NOT_FV']);h1=numeric(r['H1_synthetic_lineup_removal_loss_NOT_FV'])
            check(eligible==(gp>=4),'ELIGIBILITY_GP_MISMATCH');check(u>=0 and h1>=0,'NEGATIVE_UTILITY')
            check(r['production_writes_authorized']=='False' and r['new_FV']=='','PRICE_CHANGE_FOUND')
            if not eligible:
             check(u==0 and r['H0_optimized_slot']=='','EXCLUDED_HAS_LINEUP_SLOT')
             status='NOT_EVALUATED_LOW_GAMES';uh0='';slot=''
            elif u>1e-7: status='POSITIVE_2026_POOLED_UTILITY';uh0=round(u,3);slot=r['H0_optimized_slot'];check(slot!='','POSITIVE_NOT_SELECTED')
            else:status='ELIGIBLE_ZERO_POOLED_UTILITY';uh0=0;slot=r['H0_optimized_slot'];check(not slot,'ZERO_WAS_SELECTED')
            data.append({'name':r['name'],'position':r['position'],'2026_games_observed_through_Week6':gp,'review_status':status,'2026_pooled_optimized_slot':slot,
             '2026_pooled_lineup_removal_loss_points_NOT_FV':uh0,
             '2027_SYNTHETIC_removal_loss_points_UNVALIDATED_NOT_FV':round(h1,3) if eligible else '',
             'unchanged_live_FV_REFERENCE_ONLY':int(r['live_JS_FV_REFERENCE_ONLY']),
             'owner_price_anchor_protected':r['owner_anchor_protected'],
             'NOT_a_dynasty_player_valuation':True,'2027_H2_skill_robustly_validated':False,'price_release_authorized':False})
           counts=collections.Counter(x['review_status'] for x in data)
           check(counts=={'NOT_EVALUATED_LOW_GAMES':129,'POSITIVE_2026_POOLED_UTILITY':192,'ELIGIBLE_ZERO_POOLED_UTILITY':197},'EXPECTED_STATUS_COUNTS_CHANGED')
           check(sum(x['owner_price_anchor_protected']=='True' for x in data)==15,'OWNER_ANCHOR_COUNT_DRIFT')
           check(sum(bool(x['2026_pooled_optimized_slot']) for x in data)==192,'MODELED_SLOT_DRIFT')
           focus=[next(x for x in data if x['name']==name) for name in FOCUS]
           bypos=[]
           for p in POSITIONS:
            cc=[x for x in data if x['position']==p]
            bypos.append({'position':p,'all_in_R85_universe':len(cc),'positive_2026_utility':sum(x['review_status']=='POSITIVE_2026_POOLED_UTILITY' for x in cc),
             'eligible_zero_2026_utility':sum(x['review_status']=='ELIGIBLE_ZERO_POOLED_UTILITY' for x in cc),
             'not_evaluated_GP_under_4':sum(x['review_status']=='NOT_EVALUATED_LOW_GAMES' for x in cc),
             'robust_H2_both_origins':False})
           dumpcsv(out/'CAL26_R86R1_518_PLAYER_MOBILE_RESEARCH.csv',data)
           dumpcsv(out/'CAL26_R86R1_5_OWNER_FOCUS_PLAYERS.csv',focus)
           dumpcsv(out/'CAL26_R86R1_COVERAGE_BY_POSITION.csv',bypos)
          
           caution=('R84 two-origin retrospective H2 forecasts had ZERO of seven positions show statistically positive gains against both baselines in both origin splits. '
           'The origin tests are NOT point-in-time-valid; missing next-season player rows were treated as zero. '
           'The R85 2027 column is synthetic and NOT an independently validated projection.')
           def tr_row(x):
            status=x['review_status'];lab={'POSITIVE_2026_POOLED_UTILITY':'Positive','ELIGIBLE_ZERO_POOLED_UTILITY':'Zero pooled impact','NOT_EVALUATED_LOW_GAMES':'Not evaluated'}[status]
            util='—' if x['2026_pooled_lineup_removal_loss_points_NOT_FV']=='' else fmt(x['2026_pooled_lineup_removal_loss_points_NOT_FV'])
            cls='pos' if status.startswith('POSITIVE') else ('neutral' if status.startswith('ELIGIBLE') else 'unknown')
            return f'<tr data-position="{x["position"]}" data-status="{status}" data-search="{html.escape((x["name"]+" "+x["position"]).lower(),quote=True)}"><td class="player">{html.escape(x["name"].title())}<small>{x["position"]} · {x["2026_games_observed_through_Week6"]} games observed</small></td><td><span class="tag {cls}">{lab}</span></td><td class="num">{util}</td><td class="num fv">{x["unchanged_live_FV_REFERENCE_ONLY"]:,}</td></tr>'
           focus_html=''.join(f'<tr><td>{html.escape(x["name"].title())}</td><td class="num">{fmt(x["2026_pooled_lineup_removal_loss_points_NOT_FV"])}</td><td class="num">{fmt(x["2027_SYNTHETIC_removal_loss_points_UNVALIDATED_NOT_FV"])}</td></tr>' for x in focus)
           page=f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAL26 R86R1 — 2026 League Utility Companion | Research Only</title>
          <style>
          :root{{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--focus:#a5b4fc;--warn:#fbbf24}}
          *{{box-sizing:border-box}}body{{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}}
          main{{width:min(1100px,100%);margin:0 auto;padding:16px}}h1{{font-size:1.5rem;margin:8px 0}}h2{{font-size:1.12rem;margin:12px 0}}p{{margin:7px 0}}.eyebrow{{font-size:.85rem;color:var(--warn);letter-spacing:.02em;font-weight:700}}
          .note{{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin:14px 0}}.stats{{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}}.stat{{background:var(--panel);border-radius:10px;padding:12px}}.stat strong{{font-size:1.45rem;display:block}}.stat span{{font-size:.75rem;color:var(--muted)}}
          .controls{{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:12px 0}}input,select{{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:16px;min-width:0;width:100%}}
          .tablewrap{{overflow:auto;border:1px solid var(--line);border-radius:10px}}table{{width:100%;border-collapse:collapse;font-size:.91rem}}th{{text-align:left;background:#273449;color:#f8fafc;position:sticky;top:0;font-size:.8rem}}td,th{{padding:10px 9px;border-bottom:1px solid var(--line)}}tr:last-child td{{border-bottom:0}}small{{color:var(--muted);display:block}}.player{{font-weight:650}}.num{{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}}.fv{{color:var(--muted)}}.tag{{padding:4px 6px;border-radius:6px;font-size:.76rem;display:inline-block}}.tag.pos{{background:#164e63}}.tag.neutral{{background:#334155}}.tag.unknown{{background:#713f12}}details{{margin:10px 0}}summary{{cursor:pointer;padding:8px 0;color:var(--focus);font-weight:650}}a{{color:var(--focus)}}.count{{color:var(--muted);font-size:.85rem}}footer{{color:var(--muted);font-size:.82rem;margin:20px 0}}.hidden{{display:none}}
          @media(max-width:690px){{.stats{{grid-template-columns:repeat(2,minmax(0,1fr))}}.controls{{grid-template-columns:1fr 1fr}}.controls input{{grid-column:1/-1}}td,th{{padding:9px 6px}}.tag{{font-size:.69rem}}.num{{font-size:.86rem}}}}
          </style></head><body><main><div class="eyebrow">READ-ONLY · NO FV RELEASE · NO WEBSITE DEPLOYMENT</div><h1>2026 lineup-utility companion</h1>
          <p>This is a scenario comparing players' impact on the best possible <strong>pooled</strong> 12-team starting lineup under frozen 2026 rules. Units are projected fantasy points lost if a selected player is removed, <strong>not Fundamental Value</strong>.</p>
          <div class="stats"><div class="stat"><strong>518</strong><span>Frozen player rows</span></div><div class="stat"><strong>192</strong><span>Positive pooled utility</span></div><div class="stat"><strong>197</strong><span>Eligible; zero pooled impact</span></div><div class="stat"><strong>129</strong><span>Not evaluated: &lt;4 games</span></div></div>
          <div class="note"><strong>How to interpret the categories</strong><p><strong>Positive</strong>: included in modeled 2026 pooled optimal starters, with measured removal loss. <strong>Zero pooled impact</strong>: observed sufficiently but outside the ideal pooled starters; this is not zero dynasty value. <strong>Not evaluated</strong>: excluded under the four-game screen; utility is <em>unknown</em>, not zero.</p><p>The optimizer ignores actual team ownership and verified dual-position eligibility, and does not include kickers, bench/stash option value or independently modeled health availability.</p></div>
          <div class="note"><strong>R84 scientific caution</strong><p>{html.escape(caution)}</p><p>2026 full-season projections are also scenarios rather than verified season outcomes. The unchanged FV column is shown only as a reference; <strong>never infer a conversion rate</strong> between FV and these points.</p></div>
          <h2>All players</h2><div class="controls"><input id="search" type="search" aria-label="Search player" placeholder="Search player name" autocomplete="off"><select id="status" aria-label="Filter by status"><option value="">All statuses</option><option value="POSITIVE_2026_POOLED_UTILITY">Positive utility</option><option value="ELIGIBLE_ZERO_POOLED_UTILITY">Zero pooled impact</option><option value="NOT_EVALUATED_LOW_GAMES">Not evaluated</option></select><select id="position" aria-label="Filter by position"><option value="">All positions</option>{''.join(f'<option>{p}</option>' for p in POSITIONS)}</select></div>
          <p class="count" id="counter" aria-live="polite">Showing 518 players</p><div class="tablewrap"><table><thead><tr><th>Player</th><th>Status</th><th class="num">2026 removal loss<br>(points, not FV)</th><th class="num">Live FV<br>(unchanged)</th></tr></thead><tbody id="players">{''.join(tr_row(x) for x in data)}</tbody></table></div>
          <details><summary>Show experimental 2027 sensitivity for five focus players</summary><p>This scenario is not historically validated; it must not be interpreted as an actual 2027 forecast or added to 2026 with an arbitrary discount.</p><div class="tablewrap"><table><thead><tr><th>Player</th><th class="num">2026 removal loss</th><th class="num">Synthetic 2027 loss</th></tr></thead><tbody>{focus_html}</tbody></table></div></details>
          <div class="note"><h2>Data and guardrails</h2><p>Source: immutable R85 GitHub run 40142071235 and R84 run 40142419994, frozen through 2026 Week 6. 2026 lineup optimization was independently checked against Hungarian assignment, not actual 12-team manager rosters. The 15 owner price anchors and every live FV remain unchanged; Drake Maye 5,500 is provisional review only, Malik Nabers 5,500 remains HOLD. No price release is authorized.</p></div>
          <footer>CAL26 R86R1 · Private research artifact · No production changes</footer></main>
          <script>const q=document.getElementById('search'),s=document.getElementById('status'),p=document.getElementById('position'),trs=[...document.querySelectorAll('#players tr')],n=document.getElementById('counter');function filter(){{let shown=0;const str=q.value.trim().toLowerCase();for(const row of trs){{const good=row.dataset.search.includes(str)&&(!s.value||row.dataset.status===s.value)&&(!p.value||row.dataset.position===p.value);row.hidden=!good;if(good)shown++}}n.textContent=`Showing ${{shown}} of ${{trs.length}} players`}}for(const el of [q,s,p])el.addEventListener('input',filter);filter();</script></body></html>'''
           (out/'CAL26_R86R1_MOBILE_RESEARCH_PREVIEW.html').write_text(page,encoding='utf-8')
           report=f'''# CAL26 R86R1 — R84-aware utility companion decision
          
          **Research-only output. No price release or website deployment.**
          
          - Verified frozen R85 518 player source and R84 14-row, two-origin robustness file via exact SHA256.
          - 2026 **pooled** league starter removal-loss points are shown as the primary research measurement; optimizer fills 192 non-kicker slots using position buckets, not separate manager rosters.
          - 192 positive pooled removal loss; 197 eligible zero pooled loss; 129 excluded GP<4 recorded NOT_EVALUATED rather than zero.
          - 2027 is separately labeled synthetic/unvalidated, shown in a collapsed five-player details panel and CSV. No combined 2026/2027 total is marketed as an economic FV number.
          - R84 did not support robust H2 skill vs both baselines on both 2022/2023 origin splits for any position. Retrospective non-point-in-time origin split and censored missing historical future rows remain limitations.
          - 2026 projections are scenarios; 2027 synthetic projection, model availability and dual-eligibility limitations remain explicit.
          - All 15 owner-price anchors preserved as references. Drake Maye 5500 owner-provisional, Malik Nabers 5500 HOLD; all prices unchanged.
          - No 2026 Week7+ or Week8–12 protected holdout data, 2028 extension, market/FV conversion, or write to index.html.
          
          **Decision:** Research preview is safe to review as a separate artifact, not an approved live FV product. Release of anything on the live website requires separate owner authorization.
          '''
           (out/'CAL26_R86R1_decision.md').write_text(report,encoding='utf-8')
           artifactfiles=['CAL26_R86R1_518_PLAYER_MOBILE_RESEARCH.csv','CAL26_R86R1_5_OWNER_FOCUS_PLAYERS.csv','CAL26_R86R1_COVERAGE_BY_POSITION.csv','CAL26_R86R1_MOBILE_RESEARCH_PREVIEW.html','CAL26_R86R1_decision.md']
           manifest={'workflow':'CAL26_V1R86R1_R84_AWARE_MOBILE_PREVIEW','decision':'READ_ONLY_REVIEW_ARTIFACT_NOT_FV_RELEASE','upstream_R84_run':40142419994,'upstream_R85_run':40142071235,'total_players':518,'status_counts':dict(counts),'positions':len(POSITIONS),'2027_is_synthetic':True,'R84_two_origin_robust_positions':[],'2026_main_view':'pooled_removal_loss_NOT_FV','2027_main_view':False,'combined_years_composite_published':False,'owner_anchors_protected':15,'production_writes':0,'source_sha256':{R84_H2:PINS[R84_H2],R85_518:PINS[R85_518]},'files_sha256':{n:sha(out/n) for n in artifactfiles}}
           (out/'CAL26_R86R1_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
           print('CAL26_R86R1_GREEN',json.dumps({k:v for k,v in manifest.items() if k!='files_sha256'}))
          
          def selftest():
           check(sum(SLOTS.values())==17,'SLOT_SELFTEST')
           check(len(FOCUS)==5 and len(POSITIONS)==7,'POSITION_SELFTEST')
           print('CAL26_R86R1_SELFTEST_GREEN')
          
          if __name__=='__main__':
           a=argparse.ArgumentParser()
           for k in ('r84','r85','snapshot','out'):a.add_argument('--'+k)
           a.add_argument('--selftest',action='store_true');v=a.parse_args()
           if v.selftest:selftest()
           else:
            check(all(getattr(v,k) for k in ('r84','r85','snapshot','out')),'MISSING_ARGUMENT')
            generate(v)
          PY_R86R1
          python -m py_compile "$RUNNER_TEMP/CAL26_R86R1_engine.py"
          python "$RUNNER_TEMP/CAL26_R86R1_engine.py" --selftest
          python "$RUNNER_TEMP/CAL26_R86R1_engine.py" \
           --r84 "$RUNNER_TEMP/cal26-r86r1-input/R84" \
           --r85 "$RUNNER_TEMP/cal26-r86r1-input/R85" \
           --snapshot research/player-role-v2/player_role_v2_b41c_league_scoring_snapshot.json \
           --out "$RUNNER_TEMP/cal26-r86r1-out"
          python - "$RUNNER_TEMP/cal26-r86r1-out" <<'PY_GATE'
          import csv,json,hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R86R1_manifest.json').read_text())
          assert m['decision']=='READ_ONLY_REVIEW_ARTIFACT_NOT_FV_RELEASE'
          assert m['total_players']==518 and m['production_writes']==0
          assert not m['2027_main_view'] and not m['combined_years_composite_published']
          assert m['owner_anchors_protected']==15 and not m['R84_two_origin_robust_positions']
          assert m['status_counts']=={'POSITIVE_2026_POOLED_UTILITY':192,'ELIGIBLE_ZERO_POOLED_UTILITY':197,'NOT_EVALUATED_LOW_GAMES':129}
          for name,expected in m['files_sha256'].items():
           assert hashlib.sha256((p/name).read_bytes()).hexdigest()==expected,name
          with (p/'CAL26_R86R1_518_PLAYER_MOBILE_RESEARCH.csv').open() as f:r=list(csv.DictReader(f))
          assert len(r)==518 and all(z['price_release_authorized']=='False' for z in r)
          assert all(z['2026_pooled_lineup_removal_loss_points_NOT_FV']=='' for z in r if z['review_status']=='NOT_EVALUATED_LOW_GAMES')
          assert len({(z['name'],z['position']) for z in r})==518
          print('R86R1_FROZEN_UPSTREAM_AND_NO_FV_RELEASE_GREEN')
          PY_GATE
          test -z "$(git status --porcelain --untracked-files=all)"
          cat "$RUNNER_TEMP/cal26-r86r1-out/CAL26_R86R1_decision.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research-only preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAL26_R86R1_R84_AWARE_MOBILE_2026_UTILITY_REVIEW_NO_FV_RELEASE
          path: ${{ runner.temp }}/cal26-r86r1-out/
          retention-days: 60
          if-no-files-found: warn
