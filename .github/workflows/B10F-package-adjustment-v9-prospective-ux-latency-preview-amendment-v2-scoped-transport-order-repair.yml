name: B10F Package Adjustment V9 - Prospective UX Latency Preview Amendment V2 Scoped Transport Order Repair

'on':
  workflow_dispatch:
    inputs:
      operator_attestation:
        description: 'Confirm only UX latency feedback was used and no human vote choices were inspected'
        required: true
        type: choice
        options:
          - I_CONFIRM_ONLY_UX_LATENCY_FEEDBACK_USED_NO_HUMAN_CHOICES_READ

permissions:
  contents: write

concurrency:
  # Share B10E's group so URL issuance cannot race this one-time amendment.
  group: package-adjustment-v9-b10e-distribution-log
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPERATOR_ATTESTATION: ${{ inputs.operator_attestation }}
      WEB_APP_URL: https://script.google.com/macros/s/AKfycbynz6A8jNOQonJhHtZW7DEx36PYTBXi_klXnacKF7I4kACPbTJIA5YFjY5ILxqpwgm8aw/exec
      P6_CHECKLIST: research/package-adjustment-v9/b10d-p6-final-launch-checklist/b10d_p6_launch_checklist.json
      B9_MANIFEST: research/package-adjustment-v9/b9-voting-transport-launch-parity/b9_manifest.json
      B8_TRANSPORT: research/package-adjustment-v9/b8-human-catalog-assignment-freeze/b8_voting_transport_contract.json
      DISTRIBUTION_LOG: research/package-adjustment-v9/b10d-p6-final-launch-checklist/distribution_log.csv
      B10E_WORKFLOW: .github/workflows/B10E-package-adjustment-v9-voter-url-issuance-and-distribution-logger-v2-stdlib-squat-resilience-repair.yml
      OUT_DIR: research/package-adjustment-v9/b10f-ux-latency-preview-amendment-v1
      EXPECTED_B9_SHA: 9750dc02cdc3b65874a48211d3e7c86c5f6bd9b401855775254ef0c3cc0d5dca
      EXPECTED_B10E_SHA: 5879a810cd008eb710caf1ce5cb5f86c4924ecf6d0fc590ef6bbd7ac41e22cd4

    steps:
      - name: Checkout durable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify prospective amendment point without outcomes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, io, json, os, urllib.request

          if os.environ['OPERATOR_ATTESTATION'] != 'I_CONFIRM_ONLY_UX_LATENCY_FEEDBACK_USED_NO_HUMAN_CHOICES_READ':
              raise RuntimeError('B10F_ATTESTATION_MISSING')

          P6=Path(os.environ['P6_CHECKLIST']); B9=Path(os.environ['B9_MANIFEST'])
          B8=Path(os.environ['B8_TRANSPORT']); LOG=Path(os.environ['DISTRIBUTION_LOG'])
          B10E=Path(os.environ['B10E_WORKFLOW']); IDX=Path('index.html')
          for p in [P6,B9,B8,LOG,B10E,IDX]:
              if not p.exists(): raise RuntimeError(f'B10F_MISSING {p}')
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          if sha(P6) != '3afc023466e0a5e9fd7d52d09c352cbc24dcff922c122d06c0e48f9d1b914675':
              raise RuntimeError('B10F_P6_SHA_DRIFT')
          if sha(B10E) != os.environ['EXPECTED_B10E_SHA']:
              raise RuntimeError(f'B10F_B10E_SHA_DRIFT {sha(B10E)}')

          p6=json.loads(P6.read_text()); b9=json.loads(B9.read_text()); b8=json.loads(B8.read_text())
          assert p6['decision']=='PASS_B10D_P6_FINAL_LAUNCH_CHECKLIST_AUTHORIZE_40_VOTER_URL_DISTRIBUTION'
          assert p6['human_outcome_analysis_authorized'] is False
          assert p6['production_v9_activation_authorized'] is False
          assert p6['owner_no_peek_commitment'] is True
          assert b9['transport_block_sha256']==os.environ['EXPECTED_B9_SHA']
          assert b9['human_outcome_analysis_authorized'] is False
          assert b8['slot_url_shape']=='index.html?pkgv9slot=<1..40>#market-research'

          txt=IDX.read_text(); start='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START'; end='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_END */'
          if txt.count(start)!=1 or txt.count(end)!=1: raise RuntimeError('B10F_B9_MARKERS_INVALID')
          a=txt.index(start); b=txt.index(end,a)+len(end)
          block=txt[a:b]+'\n'; block_sha=hashlib.sha256(block.encode()).hexdigest()
          if block_sha!=os.environ['EXPECTED_B9_SHA']: raise RuntimeError(f'B10F_B9_SHA_DRIFT {block_sha}')

          # Validate the submission ordering inside the actual packageV9Submit()
          # function only. The frozen B9 block can legitimately contain the same
          # state-assignment strings elsewhere (for initialization/rendering), so
          # using block.index() across the whole block can create a false RED.
          submit_start='async function packageV9Submit(displaySide){'
          submit_end='function renderPackageVoteV9(){'
          if block.count(submit_start)!=1 or block.count(submit_end)!=1:
              raise RuntimeError('B10F_SUBMIT_FUNCTION_BOUNDARIES_INVALID')
          s0=block.index(submit_start)
          s1=block.index(submit_end,s0)
          submit_block=block[s0:s1]
          needles=['packageV9SubmitInFlight=true;','sessionStorage.setItem(pendingKey,id);','await fetch(KTC_SUBMIT_URL,{','packageV9Remember(slot,session,id);','sessionStorage.removeItem(pendingKey);','packageV9Current=null;','packageV9SubmitInFlight=false;']
          pos=[]
          for n in needles:
              if n not in submit_block: raise RuntimeError(f'B10F_TRANSPORT_SEMANTIC_DRIFT {n}')
              pos.append(submit_block.index(n))
          if pos!=sorted(pos): raise RuntimeError(f'B10F_TRANSPORT_ORDER_DRIFT_SCOPED {pos}')

          rows=list(csv.DictReader(io.StringIO(LOG.read_text())))
          if len(rows)!=1 or rows[0]['slot']!='1' or rows[0]['is_replacement']!='false':
              raise RuntimeError(f'B10F_EXPECTED_ONLY_INITIAL_SLOT1_ISSUED rows={len(rows)}')

          req=urllib.request.Request(os.environ['WEB_APP_URL']+'?mode=v9_structural_status',headers={'User-Agent':'LOG-Trade-Calculator-B10F/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              m=json.loads(r.read().decode())
          if m.get('ok') is not True or m.get('outcome_blind') is not True or m.get('study_id')!='package-adjustment-v9-discordant-human-validation':
              raise RuntimeError('B10F_MONITOR_NOT_HEALTHY_OUTCOME_BLIND')
          if m.get('all_40_slots_complete') is not False or m.get('unassigned_invalid_rows')!=0:
              raise RuntimeError('B10F_MONITOR_UNEXPECTED_STATE')
          slots=m.get('slots') or []
          if len(slots)!=40 or slots[0].get('slot')!=1 or slots[0].get('accepted_complete') is not True:
              raise RuntimeError('B10F_SLOT1_NOT_STRUCTURALLY_COMPLETE')

          pre={'index_sha256_before':sha(IDX),'b9_transport_block_sha256_before':block_sha,'b10e_sha256':sha(B10E),'slot1_candidate_sessions':slots[0].get('candidate_sessions'),'slot1_complete_sessions':slots[0].get('complete_sessions'),'human_choices_read':False}
          Path('/tmp/b10f_pre.json').write_text(json.dumps(pre,indent=2,sort_keys=True)+'\n')
          print('PASS: prospective amendment frozen after slot 1 using outcome-blind evidence only.')
          PY

      - name: Insert UI-only next-trade preview outside frozen B9 transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); txt=p.read_text()
          marker='PACKAGE_ADJUSTMENT_V9_B10F_UX_LATENCY_PREVIEW_V1'
          if marker in txt: raise RuntimeError('B10F_ALREADY_PRESENT')
          if txt.count('</body>')!=1: raise RuntimeError('B10F_BODY_CLOSE_NOT_UNIQUE')
          addon=r'''
          <!-- PACKAGE_ADJUSTMENT_V9_B10F_UX_LATENCY_PREVIEW_V1
               Prospective presentation-only amendment after slot 1. -->
          <style id="pkgv9-b10f-latency-preview-v1-styles">
          .pkgv9-b10f-saving{margin:0 0 10px;padding:9px 10px;border:1px solid rgba(232,184,75,.35);border-left:3px solid var(--amber);border-radius:8px;background:rgba(232,184,75,.06);color:var(--text-muted);font-size:12px;line-height:1.45}
          .pkgv9-b10f-saving strong{color:var(--amber)}
          .pkgv9-b10f-note{margin:0 0 10px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.4}
          .pkgv9-b10f-preview-btn[disabled]{opacity:.48;cursor:wait}
          </style>
          <script id="pkgv9-b10f-latency-preview-v1-runtime">
          /* PACKAGE_ADJUSTMENT_V9_B10F_UX_LATENCY_PREVIEW_V1_RUNTIME
             While the unchanged B9 POST is in flight, show the already-frozen
             next assigned trade for reading. Buttons remain disabled until the
             original B9 submission completes. */
          (function(){
            'use strict';
            function preview(){
              const el=document.getElementById('packageVoteWrap');
              if(!el || typeof packageV9QueryPresent!=='function' || !packageV9QueryPresent()) return;
              if(!packageV9SubmitInFlight){ delete el.dataset.pkgv9B10fPreview; return; }
              if(el.dataset.pkgv9B10fPreview==='1') return;
              if(PACKAGE_V9_STATUS!=='ready' || !packageV9Current || !PACKAGE_V9_SAFE || !PACKAGE_V9_SCHEDULE) return;
              const cur=packageV9Current, spec=PACKAGE_V9_SCHEDULE.slots[String(cur.slot)];
              if(!spec || !Array.isArray(spec.challenge_order)) return;
              const nextIndex=Number(cur.displayOrder)+1, nextId=spec.challenge_order[nextIndex];
              el.dataset.pkgv9B10fPreview='1';
              if(!nextId){
                el.innerHTML='<div class="pkgv9-b10f-saving"><strong>Saving final vote…</strong><br>Keep this page open until the completion message appears.</div>';
                return;
              }
              const c=PACKAGE_V9_SAFE.challenges.find(x=>String(x.id)===String(nextId));
              const left=spec.display_left_by_challenge[String(nextId)];
              if(!c || (left!=='A' && left!=='B')) return;
              const L=left==='A'?c.side_A:c.side_B, R=left==='A'?c.side_B:c.side_A;
              const lhtml=L.assets.map(packageV9AssetCard).join(''), rhtml=R.assets.map(packageV9AssetCard).join('');
              el.innerHTML=`
                <div class="pkgv9-b10f-saving" aria-live="polite"><strong>Saving previous vote…</strong><br>You can review trade ${nextIndex+1} of ${PACKAGE_V9_BALLOTS_PER_SLOT} now. Buttons unlock automatically when saving finishes.</div>
                <div class="pkgv9-b10f-note">PREVIEW ONLY · no selection is accepted until the prior vote finishes saving</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                  <div><div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:6px;text-align:center;">LEFT SIDE</div><div style="display:flex;flex-direction:column;gap:6px;">${lhtml}</div><button class="tab-btn pkgv9-b10f-preview-btn" style="width:100%;margin-top:8px;" disabled>Choose Left Side</button></div>
                  <div><div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:6px;text-align:center;">RIGHT SIDE</div><div style="display:flex;flex-direction:column;gap:6px;">${rhtml}</div><button class="tab-btn pkgv9-b10f-preview-btn" style="width:100%;margin-top:8px;" disabled>Choose Right Side</button></div>
                </div>`;
            }
            function install(){
              const el=document.getElementById('packageVoteWrap');
              if(!el || typeof MutationObserver==='undefined') return;
              new MutationObserver(preview).observe(el,{childList:true,subtree:true});
              preview();
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true}); else install();
          })();
          </script>
          '''
          p.write_text(txt.replace('</body>',addon+'\n</body>'))
          print('PASS: B10F UI-only preview inserted.')
          PY

      - name: Validate transport preservation and write amendment record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,textwrap
          txt=Path('index.html').read_text(); start='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START'; end='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_END */'
          a=txt.index(start); b=txt.index(end,a)+len(end); got=hashlib.sha256((txt[a:b]+'\n').encode()).hexdigest()
          if got!=os.environ['EXPECTED_B9_SHA']: raise RuntimeError(f'B10F_POSTPATCH_B9_SHA_DRIFT {got}')
          m=re.search(r'<script id="pkgv9-b10f-latency-preview-v1-runtime">(.*?)</script>',txt,re.S)
          if not m: raise RuntimeError('B10F_HELPER_MISSING')
          js=m.group(1)
          for n in ['fetch(','XMLHttpRequest','sendBeacon(','localStorage','sessionStorage','KTC_SUBMIT_URL','__pkgv9val__|','packageV9Submit(','packageV9Remember(']:
              if n in js: raise RuntimeError(f'B10F_FORBIDDEN_HELPER_CAPABILITY {n}')
          for n in ['MutationObserver','packageV9SubmitInFlight','PACKAGE_V9_SCHEDULE','PACKAGE_V9_SAFE','disabled>Choose Left Side','disabled>Choose Right Side']:
              if n not in js: raise RuntimeError(f'B10F_REQUIRED_HELPER_GUARD_MISSING {n}')
          Path('/tmp/b10f_helper.js').write_text(js)

          pre=json.loads(Path('/tmp/b10f_pre.json').read_text()); out=Path(os.environ['OUT_DIR']); out.mkdir(parents=True,exist_ok=False)
          record={
            'schema_version':1,'study_id':'package-adjustment-v9-discordant-human-validation','stage':'b10f_ux_latency_preview_amendment_v1','decision':'PASS_B10F_PROSPECTIVE_PRESENTATION_ONLY_LATENCY_AMENDMENT',
            'basis':{'trigger':'first-voter UX latency feedback only','reported_post_click_wait_seconds_range':[5,20],'human_choices_read':False,'human_outcome_analysis_performed':False},
            'timing':{'pre_amendment_issued_slots':[1],'pre_amendment_structurally_complete_slots':[1],'slot_1_completed_under_original_waiting_ui':True,'new_ui_applies_prospectively_after_this_commit':True},
            'change':{'type':'in_flight_next_trade_preview','speeds_server_post':False,'overlaps_next_trade_reading_with_existing_post_wait':True,'allows_second_vote_before_prior_post_resolves':False,'adds_network_requests':False,'writes_browser_storage':False,'changes_assignment':False,'changes_randomization':False,'changes_payload':False,'changes_timestamp':False,'changes_failure_policy':False},
            'frozen_transport':{'b9_transport_block_sha256_before':pre['b9_transport_block_sha256_before'],'b9_transport_block_sha256_after':got,'exactly_unchanged':pre['b9_transport_block_sha256_before']==got},
            'analysis_preregistration':{'primary_analysis_unchanged':True,'post_unlock_required_sensitivity':'Repeat the final frozen analysis excluding pre-amendment slot 1 and report whether any inferential conclusion changes.','thresholds_changed':False,'model_changed':False},
            'human_outcomes_read':False,'human_outcome_analysis_authorized':False,'production_v9_activation_authorized':False,'next_if_green':'Continue unchanged B10E V2 issuance with slot 2.'
          }
          if record['frozen_transport']['exactly_unchanged'] is not True: raise RuntimeError('B10F_TRANSPORT_NOT_EXACT')
          (out/'b10f_ux_latency_preview_amendment_v1.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          report = (
              '# Package Adjustment V9 — B10F UX Latency Preview Amendment V1\n\n'
              '## Decision\n\n'
              '**PASS_B10F_PROSPECTIVE_PRESENTATION_ONLY_LATENCY_AMENDMENT**\n\n'
              'The only feedback used was operational UX feedback after slot 1: post-click waiting was reported at roughly 5–20 seconds. No human A/B choices were inspected.\n\n'
              'Beginning prospectively after this commit, the browser shows the next already-frozen assigned trade while the unchanged B9 POST is still in flight. Both next-trade buttons remain disabled until the original submission resolves.\n\n'
              f'The exact B9 transport block remains byte-for-byte frozen at `{got}`. Assignments, left/right randomization, payloads, timestamps, pending-state logic, failure policy, and the primary analysis are unchanged.\n\n'
              'Slot 1 is the sole pre-amendment completed slot. Before outcomes are opened, this amendment preregisters one final robustness check: repeat the frozen analysis excluding slot 1 and report whether any inferential conclusion changes.\n'
          )
          (out/'b10f_ux_latency_preview_amendment_v1.md').write_text(report)
          print('PASS: amendment record written; B9 transport exact; no outcomes read.')
          PY
          node --check /tmp/b10f_helper.js

      - name: Prove exact change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
          expected=(
            index.html
            research/package-adjustment-v9/b10f-ux-latency-preview-amendment-v1/b10f_ux_latency_preview_amendment_v1.json
            research/package-adjustment-v9/b10f-ux-latency-preview-amendment-v1/b10f_ux_latency_preview_amendment_v1.md
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)

      - name: Commit prospective amendment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html research/package-adjustment-v9/b10f-ux-latency-preview-amendment-v1
          git commit \
            -m 'Record Package Adjustment V9 B10F prospective UX latency amendment' \
            -m 'Preview next frozen trade while prior B9 POST is in flight; selection remains disabled.' \
            -m 'No human choices read; B9 transport SHA preserved; slot-1 exclusion sensitivity preregistered.'
          git push origin HEAD:main

      - name: Reverify durable main and live Pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          txt=Path('index.html').read_text(); marker='PACKAGE_ADJUSTMENT_V9_B10F_UX_LATENCY_PREVIEW_V1'
          if marker not in txt: raise RuntimeError('B10F_DURABLE_MARKER_MISSING')
          s='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START'; e='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_END */'; a=txt.index(s); b=txt.index(e,a)+len(e)
          got=hashlib.sha256((txt[a:b]+'\n').encode()).hexdigest()
          if got!=os.environ['EXPECTED_B9_SHA']: raise RuntimeError('B10F_DURABLE_B9_SHA_DRIFT')
          print('PASS: durable main contains B10F and exact B9 transport.')
          PY

          live_ok=0
          for attempt in $(seq 1 18); do
            probe="/tmp/b10f_live_${attempt}.html"
            url="https://ajknoll23-code.github.io/LOG-Trade-Calculator/index.html?b10f_probe=$(date +%s%N)"
            if curl -fsSL -H 'Cache-Control: no-cache' "$url" -o "$probe" && grep -q 'PACKAGE_ADJUSTMENT_V9_B10F_UX_LATENCY_PREVIEW_V1' "$probe"; then
              python3 - "$probe" <<'PY'
          from pathlib import Path
          import hashlib,os,sys
          txt=Path(sys.argv[1]).read_text(); s='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START'; e='/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_END */'
          if txt.count(s)!=1 or txt.count(e)!=1: raise RuntimeError('B10F_LIVE_MARKERS_INVALID')
          a=txt.index(s); b=txt.index(e,a)+len(e); got=hashlib.sha256((txt[a:b]+'\n').encode()).hexdigest()
          if got!=os.environ['EXPECTED_B9_SHA']: raise RuntimeError(f'B10F_LIVE_B9_SHA_DRIFT {got}')
          print('PASS: live Pages serves B10F and exact frozen B9 transport.')
          PY
              live_ok=1
              break
            fi
            echo "Waiting for GitHub Pages deployment... ${attempt}/18"
            sleep 10
          done
          test "$live_ok" -eq 1 || { echo 'B10F_LIVE_DEPLOYMENT_NOT_OBSERVED_WITHIN_3_MINUTES'; exit 1; }

      - name: Summary
        shell: bash
        run: |
          {
            echo '## B10F Package Adjustment V9 — UX Latency Preview Amendment V1'
            echo
            echo '**GREEN means:**'
            echo '- Slot 1 is frozen as the sole pre-amendment completed slot.'
            echo '- No human vote choices were read.'
            echo '- The exact B9 transport block is unchanged.'
            echo '- While a vote saves, the next frozen trade is shown for reading with both buttons disabled.'
            echo '- The live GitHub Pages deployment was observed.'
            echo '- Continue with the unchanged B10E V2 workflow for slot 2.'
          } >> "$GITHUB_STEP_SUMMARY"
