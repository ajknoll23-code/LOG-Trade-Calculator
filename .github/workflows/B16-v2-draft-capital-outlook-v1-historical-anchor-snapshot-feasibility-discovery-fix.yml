name: B16 V2 Draft Capital Outlook V1 - Historical Anchor Snapshot Feasibility Discovery Fix

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  feasibility_fix:
    name: B16 V2 correct archive discovery and replay unchanged gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture B16 V2 base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact B16 V1 scientific stop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          m=json.loads((D/"b16_manifest.json").read_text())
          s=json.loads((D/"b16_historical_snapshot_feasibility_summary.json").read_text())
          p=json.loads((D/"b16_protocol_frozen.json").read_text())

          assert m["decision"]=="STOP_B16_HISTORICAL_ANCHOR_SERIES_INSUFFICIENT_FOR_CONFIRMATORY_PATH"
          assert m["technical_feasibility_pass"] is False
          assert m["feasible_class_n"]==6
          assert m["b17_parsing_and_target_feasibility_authorized"] is False
          assert m["c1_model_preregistration_authorized"] is False
          assert m["predictor_fit_performed"] is False
          assert m["2027_class_scored"] is False
          assert m["production_change_authorized"] is False

          assert s["feasible_class_years"]==[2018,2019,2020,2021,2022,2023]
          assert s["infeasible_class_years"]==[2014,2015,2016,2017,2024,2025,2026]
          assert s["minimum_feasible_classes_required"]==10

          # The scientific design remains immutable.
          assert p["class_years"]==list(range(2014,2027))
          assert p["formal_feasibility_gate"]["minimum_feasible_classes"]==10
          assert p["anchor_rule"]["window_start_month_day"]=="09-15"
          assert p["anchor_rule"]["window_end_month_day"]=="10-15"
          assert p["anchor_rule"]["target_date_month_day"]=="09-30"
          assert p["anchor_rule"]["selection_uses_outcomes"] is False
          assert p["anchor_rule"]["selection_uses_actual_nfl_draft_results"] is False

          # Guard the four core V1 files by the frozen manifest.
          for name in [
              "b16_protocol_frozen.json",
              "b16_historical_snapshot_feasibility_result.json",
              "b16_historical_snapshot_feasibility_summary.json",
              "b16_historical_snapshot_feasibility_report.md",
          ]:
              expected=m["output_hashes"][name]
              got=hashlib.sha256((D/name).read_bytes()).hexdigest()
              assert got==expected,(name,expected,got)

          print("PASS: B16 V1 scientific stop guarded; only implementation discovery may change.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Freeze B16 V2 implementation correction before network access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b16v2
          python3 - <<'PY'
          import json
          from pathlib import Path

          fix={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_v2_discovery_fix_preregistration",
              "frozen_before_network_access":True,

              "scientific_design_changed":False,
              "scientific_gate_changed":False,
              "population_changed":False,
              "anchor_window_changed":False,
              "source_family_changed":False,

              "unchanged_scientific_contract":{
                  "class_years":list(range(2014,2027)),
                  "anchor_calendar_year":"class_year_minus_1",
                  "window_start_month_day":"09-15",
                  "window_end_month_day":"10-15",
                  "target_date_month_day":"09-30",
                  "minimum_feasible_classes":10,
                  "total_candidate_classes":13,
                  "source_family":"WalterFootball Walt NFL Mock Draft Archive",
                  "selection_rule":"Among timestamp-verified archived mocks whose embedded publication/update date falls inside the anchor window, choose the one minimizing absolute calendar-day distance to Sep 30. Tie-break toward the earlier date, then lexicographic URL.",
                  "selection_uses_outcomes":False,
                  "selection_uses_actual_nfl_draft_results":False
              },

              "implementation_defects_being_corrected":[
                  {
                      "defect_id":"OLDER_FILENAME_UNDERSCORE_NOT_DISCOVERED",
                      "description":"B16 V1 only matched/probed draftYYYYarchiveMMDD.php. Older WalterFootball archives can use draftYYYYarchive_MMDD.php.",
                      "correction":"Accept and probe both filename conventions for every class."
                  },
                  {
                      "defect_id":"FALLBACK_TRIGGERED_ONLY_WHEN_ZERO_LINKS_DISCOVERED",
                      "description":"B16 V1 skipped deterministic date probing when an archive-index request redirected to a non-index page that exposed unrelated archive links but no valid in-window candidate.",
                      "correction":"Trigger deterministic anchor-window probing whenever index discovery produces zero valid in-window candidates, regardless of raw link count."
                  }
              ],

              "discovery_v2":{
                  "archive_index_url_template":"https://walterfootball.com/draft{class_year}archive.php",
                  "index_href_patterns":[
                      "draft{class_year}archiveMMDD.php",
                      "draft{class_year}archive_MMDD.php"
                  ],
                  "fallback_trigger":"NO_VALID_IN_WINDOW_CANDIDATE_AFTER_INDEX_DISCOVERY",
                  "fallback_dates":"Every calendar day from Sep 15 through Oct 15 in anchor year.",
                  "fallback_url_patterns":[
                      "https://walterfootball.com/draft{class_year}archiveMMDD.php",
                      "https://walterfootball.com/draft{class_year}archive_MMDD.php"
                  ],
                  "deduplicate_urls":True,
                  "must_verify_http_2xx":True,
                  "must_verify_minimum_raw_bytes":1000,
                  "must_verify_class_year_marker":True,
                  "must_verify_embedded_date_inside_anchor_window":True,
                  "filename_date_alone_not_sufficient":True
              },

              "gate":{
                  "pass_decision":"PASS_B16_V2_HISTORICAL_ANCHOR_SERIES_AUTHORIZE_B17_PARSING_AND_TARGET_FEASIBILITY_ONLY",
                  "fail_decision":"STOP_B16_V2_HISTORICAL_ANCHOR_SERIES_INSUFFICIENT_AFTER_DISCOVERY_FIX",
                  "minimum_feasible_classes":10,
                  "b17_authorized_on_pass":True,
                  "c1_model_preregistration_authorized":False,
                  "production_authorized":False
              },

              "authority":{
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False,
                  "c1_model_preregistration_authorized":False
              }
          }

          Path("/tmp/b16v2/b16_v2_discovery_fix_preregistration.json").write_text(
              json.dumps(fix,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: B16 V2 implementation-only correction frozen before network access.")
          PY

      - name: Replay historical feasibility with corrected discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib,json,re,time
          from datetime import date,datetime,timedelta,timezone
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          D=Path("research/draft-capital-outlook-v1")
          A=D/"archive/historical-anchor-feasibility-v2"
          IDX=A/"indexes"
          RAW=A/"selected"
          META=A/"metadata"
          for p in (IDX,RAW,META):
              p.mkdir(parents=True,exist_ok=True)

          fix=json.loads(Path("/tmp/b16v2/b16_v2_discovery_fix_preregistration.json").read_text())
          contract=fix["unchanged_scientific_contract"]
          discovery=fix["discovery_v2"]

          session=requests.Session()
          session.headers.update({
              "User-Agent":"LOG-Draft-Capital-Outlook-B16V2/1.0 (+archive discovery correction)",
              "Accept":"text/html,*/*;q=0.5",
              "Accept-Language":"en-US,en;q=0.9",
              "Accept-Encoding":"identity"
          })

          MONTHS={
              "jan":1,"january":1,"feb":2,"february":2,"mar":3,"march":3,
              "apr":4,"april":4,"may":5,"jun":6,"june":6,"jul":7,"july":7,
              "aug":8,"august":8,"sep":9,"sept":9,"september":9,"oct":10,
              "october":10,"nov":11,"november":11,"dec":12,"december":12
          }

          def get(url):
              attempts=[]
              resp=None
              err=None
              for i,delay in enumerate([0,2,6],start=1):
                  if delay: time.sleep(delay)
                  try:
                      t0=time.time()
                      resp=session.get(url,timeout=45,allow_redirects=True)
                      attempts.append({
                          "attempt":i,
                          "status_code":int(resp.status_code),
                          "elapsed_seconds":round(time.time()-t0,3),
                          "final_url":resp.url
                      })
                      if resp.status_code not in {429,500,502,503,504}:
                          break
                  except Exception as e:
                      err=f"{type(e).__name__}: {e}"
                      attempts.append({"attempt":i,"error":err})
              return resp,attempts,err

          def decode(resp):
              enc=resp.encoding or "utf-8"
              try:
                  return resp.content.decode(enc,errors="replace")
              except LookupError:
                  return resp.content.decode("utf-8",errors="replace")

          def visible(html):
              s=re.sub(r"(?is)<script.*?</script>|<style.*?</style>|<noscript.*?</noscript>"," ",html)
              s=re.sub(r"(?s)<[^>]+>"," ",s)
              return " ".join(unescape(s).split())

          def page_dates(text,anchor_year):
              found=set()
              rx=re.compile(
                  r"\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|"
                  r"Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)"
                  r"\.?\s+([0-3]?\d)(?:st|nd|rd|th)?(?:,\s*|\s+)(20\d{2})\b",
                  re.I
              )
              for m in rx.finditer(text):
                  key=m.group(1).lower().rstrip(".")
                  mon=MONTHS[key]
                  try: found.add(date(int(m.group(3)),mon,int(m.group(2))))
                  except ValueError: pass

              for m in re.finditer(r"\b(20\d{2})-(0[1-9]|1[0-2])-([0-3]\d)\b",text):
                  try: found.add(date(int(m.group(1)),int(m.group(2)),int(m.group(3))))
                  except ValueError: pass

              for m in re.finditer(r"\b(0?[1-9]|1[0-2])/([0-3]?\d)/(20\d{2}|\d{2})\b",text):
                  y=int(m.group(3))
                  if y<100:y+=2000
                  try: found.add(date(y,int(m.group(1)),int(m.group(2))))
                  except ValueError: pass

              return sorted(d for d in found if d.year==anchor_year)

          def evaluate(url,class_year,anchor_year,window_start,window_end,target):
              resp,attempts,error=get(url)
              rec={
                  "url":url,
                  "attempts":attempts,
                  "error":error,
                  "http_status":int(resp.status_code) if resp is not None else None,
                  "valid":False
              }
              if resp is None or not (200<=resp.status_code<300):
                  return rec,None
              raw=resp.content or b""
              rec["raw_bytes"]=len(raw)
              rec["final_url"]=resp.url
              if len(raw)<1000:
                  return rec,None

              txt=decode(resp)
              vis=visible(txt)
              dates=page_dates(vis,anchor_year)
              anchor_dates=[d for d in dates if window_start<=d<=window_end]
              marker=f"{class_year} NFL Mock Draft".lower() in vis.lower()
              rec["embedded_dates"]=[d.isoformat() for d in dates]
              rec["anchor_dates"]=[d.isoformat() for d in anchor_dates]
              rec["class_year_marker"]=marker
              if not anchor_dates or not marker:
                  return rec,None

              chosen=min(anchor_dates,key=lambda d:(abs((d-target).days),d))
              rec["valid"]=True
              rec["chosen_embedded_date"]=chosen.isoformat()
              rec["distance_days"]=abs((chosen-target).days)
              return rec,{
                  "url":url,
                  "final_url":resp.url,
                  "embedded_anchor_date":chosen,
                  "distance_days":abs((chosen-target).days),
                  "raw":raw,
                  "raw_bytes":len(raw)
              }

          results=[]
          started=datetime.now(timezone.utc).isoformat()

          for class_year in contract["class_years"]:
              anchor_year=class_year-1
              ws=date(anchor_year,9,15)
              we=date(anchor_year,10,15)
              target=date(anchor_year,9,30)
              index_url=discovery["archive_index_url_template"].format(class_year=class_year)

              index_resp,index_attempts,index_error=get(index_url)
              index_raw=index_resp.content if index_resp is not None else b""
              index_path=IDX/f"{class_year}_archive_index.html"
              if index_resp is not None:
                  index_path.write_bytes(index_raw)

              discovered=[]
              if index_resp is not None and 200<=index_resp.status_code<300:
                  html=decode(index_resp)
                  patterns=[
                      re.compile(rf'href=["\']([^"\']*draft{class_year}archive\d{{4}}\.php)["\']',re.I),
                      re.compile(rf'href=["\']([^"\']*draft{class_year}archive_\d{{4}}\.php)["\']',re.I)
                  ]
                  for pattern in patterns:
                      for href in pattern.findall(html):
                          u=urljoin(index_resp.url,href)
                          if u not in discovered:
                              discovered.append(u)

              probe_records=[]
              candidates=[]
              evaluated=set()

              # Evaluate index-discovered candidates first.
              for url in discovered:
                  if url in evaluated: continue
                  evaluated.add(url)
                  rec,cand=evaluate(url,class_year,anchor_year,ws,we,target)
                  rec["discovery_source"]="archive_index"
                  probe_records.append(rec)
                  if cand is not None:
                      candidates.append(cand)

              fallback_used=False
              # Corrected trigger: fallback when no VALID in-window candidate exists.
              if not candidates:
                  fallback_used=True
                  d=ws
                  fallback_urls=[]
                  while d<=we:
                      mmdd=d.strftime("%m%d")
                      fallback_urls.extend([
                          f"https://walterfootball.com/draft{class_year}archive{mmdd}.php",
                          f"https://walterfootball.com/draft{class_year}archive_{mmdd}.php"
                      ])
                      d+=timedelta(days=1)

                  for url in fallback_urls:
                      if url in evaluated: continue
                      evaluated.add(url)
                      rec,cand=evaluate(url,class_year,anchor_year,ws,we,target)
                      rec["discovery_source"]="deterministic_dual_pattern_fallback"
                      probe_records.append(rec)
                      if cand is not None:
                          candidates.append(cand)

              selected=min(
                  candidates,
                  key=lambda c:(c["distance_days"],c["embedded_anchor_date"],c["url"])
              ) if candidates else None

              selected_path=None
              selected_sha=None
              if selected is not None:
                  selected_path=RAW/f"{class_year}_{selected['embedded_anchor_date'].strftime('%Y%m%d')}.html"
                  selected_path.write_bytes(selected["raw"])
                  selected_sha=hashlib.sha256(selected["raw"]).hexdigest()

              meta={
                  "schema_version":2,
                  "class_year":class_year,
                  "anchor_year":anchor_year,
                  "anchor_window_start":ws.isoformat(),
                  "anchor_window_end":we.isoformat(),
                  "target_date":target.isoformat(),
                  "archive_index_url":index_url,
                  "archive_index_http_status":int(index_resp.status_code) if index_resp is not None else None,
                  "archive_index_final_url":index_resp.url if index_resp is not None else None,
                  "archive_index_attempts":index_attempts,
                  "archive_index_error":index_error,
                  "archive_index_raw_path":str(index_path) if index_resp is not None else None,
                  "archive_index_raw_sha256":hashlib.sha256(index_raw).hexdigest() if index_raw else None,
                  "index_discovered_url_n":len(discovered),
                  "fallback_used":fallback_used,
                  "evaluated_url_n":len(evaluated),
                  "valid_candidate_n":len(candidates),
                  "probe_records":probe_records,
                  "selected_url":selected["url"] if selected else None,
                  "selected_final_url":selected["final_url"] if selected else None,
                  "selected_embedded_anchor_date":selected["embedded_anchor_date"].isoformat() if selected else None,
                  "selected_distance_days":selected["distance_days"] if selected else None,
                  "selected_raw_bytes":selected["raw_bytes"] if selected else None,
                  "selected_raw_path":str(selected_path) if selected_path else None,
                  "selected_raw_sha256":selected_sha,
                  "feasible":selected is not None,
                  "predictor_fit_performed":False,
                  "2027_class_scored":False,
                  "production_change_authorized":False
              }
              (META/f"{class_year}.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
              results.append(meta)

          out={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_v2_historical_snapshot_feasibility_result",
              "network_started_utc":started,
              "network_finished_utc":datetime.now(timezone.utc).isoformat(),
              "implementation_fix_only":True,
              "class_years":contract["class_years"],
              "results":results,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          Path("/tmp/b16v2/b16_v2_result.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "feasible_n":sum(r["feasible"] for r in results),
              "feasible_years":[r["class_year"] for r in results if r["feasible"]]
          },indent=2))
          PY

      - name: Apply unchanged 10-of-13 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,statistics
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          fix=json.loads(Path("/tmp/b16v2/b16_v2_discovery_fix_preregistration.json").read_text())
          raw=json.loads(Path("/tmp/b16v2/b16_v2_result.json").read_text())

          feasible=[r for r in raw["results"] if r["feasible"]]
          n=len(feasible)
          required=fix["gate"]["minimum_feasible_classes"]
          passed=n>=required
          decision=fix["gate"]["pass_decision"] if passed else fix["gate"]["fail_decision"]
          distances=[r["selected_distance_days"] for r in feasible]

          summary={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_v2_historical_snapshot_feasibility_summary",
              "decision":decision,
              "implementation_fix_only":True,
              "scientific_gate_changed":False,
              "technical_feasibility_pass":passed,
              "candidate_class_n":13,
              "minimum_feasible_classes_required":10,
              "feasible_class_n":n,
              "feasible_fraction":n/13,
              "feasible_class_years":[r["class_year"] for r in feasible],
              "infeasible_class_years":[r["class_year"] for r in raw["results"] if not r["feasible"]],
              "selected_snapshots":{
                  str(r["class_year"]):{
                      "selected_url":r["selected_url"],
                      "embedded_anchor_date":r["selected_embedded_anchor_date"],
                      "distance_days":r["selected_distance_days"],
                      "raw_bytes":r["selected_raw_bytes"],
                      "fallback_used":r["fallback_used"],
                      "valid_candidate_n":r["valid_candidate_n"]
                  } for r in feasible
              },
              "distance_days_median":statistics.median(distances) if distances else None,
              "distance_days_max":max(distances) if distances else None,
              "b17_parsing_and_target_feasibility_authorized":passed,
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }

          (D/"b16_v2_discovery_fix_preregistration.json").write_bytes(
              Path("/tmp/b16v2/b16_v2_discovery_fix_preregistration.json").read_bytes()
          )
          (D/"b16_v2_historical_snapshot_feasibility_result.json").write_bytes(
              Path("/tmp/b16v2/b16_v2_result.json").read_bytes()
          )
          (D/"b16_v2_historical_snapshot_feasibility_summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps(summary,indent=2))
          PY

      - name: Validate B16 V2 scientific firewall and raw hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          F=json.loads((D/"b16_v2_discovery_fix_preregistration.json").read_text())
          R=json.loads((D/"b16_v2_historical_snapshot_feasibility_result.json").read_text())
          S=json.loads((D/"b16_v2_historical_snapshot_feasibility_summary.json").read_text())

          assert F["scientific_design_changed"] is False
          assert F["scientific_gate_changed"] is False
          assert F["population_changed"] is False
          assert F["anchor_window_changed"] is False
          assert F["source_family_changed"] is False
          assert F["unchanged_scientific_contract"]["minimum_feasible_classes"]==10
          assert F["unchanged_scientific_contract"]["class_years"]==list(range(2014,2027))
          assert F["unchanged_scientific_contract"]["selection_uses_outcomes"] is False
          assert F["unchanged_scientific_contract"]["selection_uses_actual_nfl_draft_results"] is False

          assert len(R["results"])==13
          assert len({r["class_year"] for r in R["results"]})==13
          for r in R["results"]:
              assert r["predictor_fit_performed"] is False
              assert r["2027_class_scored"] is False
              assert r["production_change_authorized"] is False
              if r["feasible"]:
                  p=Path(r["selected_raw_path"])
                  assert p.is_file()
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==r["selected_raw_sha256"]
                  assert r["selected_raw_bytes"]>=1000

          assert S["scientific_gate_changed"] is False
          assert S["c1_model_preregistration_authorized"] is False
          assert S["predictor_fit_performed"] is False
          assert S["2027_class_scored"] is False
          assert S["production_change_authorized"] is False

          if S["technical_feasibility_pass"]:
              assert S["feasible_class_n"]>=10
              assert S["decision"]=="PASS_B16_V2_HISTORICAL_ANCHOR_SERIES_AUTHORIZE_B17_PARSING_AND_TARGET_FEASIBILITY_ONLY"
              assert S["b17_parsing_and_target_feasibility_authorized"] is True
          else:
              assert S["feasible_class_n"]<10
              assert S["decision"]=="STOP_B16_V2_HISTORICAL_ANCHOR_SERIES_INSUFFICIENT_AFTER_DISCOVERY_FIX"
              assert S["b17_parsing_and_target_feasibility_authorized"] is False

          print("PASS: B16 V2 implementation fix preserved all scientific boundaries.")
          PY

      - name: Freeze B16 V2 report and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          S=json.loads((D/"b16_v2_historical_snapshot_feasibility_summary.json").read_text())

          report=[
              "# Draft Capital Outlook V1 — B16 V2 Historical Anchor Feasibility",
              "",
              "## Decision",
              "",
              S["decision"],
              "",
              "B16 V2 is an implementation-only discovery correction. The population, source family, anchor window, selection rule, and 10-of-13 gate are unchanged.",
              "",
              f'- Feasible classes: {S["feasible_class_n"]}/13',
              f'- Required: {S["minimum_feasible_classes_required"]}/13',
              f'- Feasible years: {S["feasible_class_years"]}',
              f'- Infeasible years: {S["infeasible_class_years"]}',
              f'- Median distance to Sep 30: {S["distance_days_median"]}',
              f'- Maximum distance to Sep 30: {S["distance_days_max"]}',
              "",
              "## Authority",
              "",
              f'- B17 parsing/target feasibility authorized: {S["b17_parsing_and_target_feasibility_authorized"]}',
              "- C1 model preregistration authorized: false",
              "- Predictor fitting performed: false",
              "- 2027 class scored: false",
              "- Production change authorized: false",
              ""
          ]
          (D/"b16_v2_historical_snapshot_feasibility_report.md").write_text("\n".join(report))

          core=[
              "b16_v2_discovery_fix_preregistration.json",
              "b16_v2_historical_snapshot_feasibility_result.json",
              "b16_v2_historical_snapshot_feasibility_summary.json",
              "b16_v2_historical_snapshot_feasibility_report.md",
          ]
          archive=sorted(
              p for p in (D/"archive/historical-anchor-feasibility-v2").rglob("*")
              if p.is_file()
          )
          hashes={n:hashlib.sha256((D/n).read_bytes()).hexdigest() for n in core}
          hashes.update({
              str(p.relative_to(D)):hashlib.sha256(p.read_bytes()).hexdigest()
              for p in archive
          })

          manifest={
              "schema_version":2,
              "study_id":"draft-capital-outlook-v1",
              "stage":"b16_v2_manifest",
              "decision":S["decision"],
              "implementation_fix_only":True,
              "scientific_gate_changed":False,
              "technical_feasibility_pass":S["technical_feasibility_pass"],
              "feasible_class_n":S["feasible_class_n"],
              "output_hashes":hashes,
              "b17_parsing_and_target_feasibility_authorized":S["b17_parsing_and_target_feasibility_authorized"],
              "c1_model_preregistration_authorized":False,
              "predictor_fit_performed":False,
              "2027_class_scored":False,
              "production_change_authorized":False
          }
          (D/"b16_v2_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("PASS: B16 V2 manifest frozen.")
          PY

      - name: Run post-B16 V2 repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove B16 V2 research-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          )
          touched=[line[3:] for line in raw.splitlines() if line.strip()]
          assert touched,touched
          assert all(
              p.startswith("research/draft-capital-outlook-v1/b16_v2_")
              or p.startswith("research/draft-capital-outlook-v1/archive/historical-anchor-feasibility-v2/")
              for p in touched
          ),touched
          assert not any(p.startswith(("model/","scripts/","data/")) for p in touched),touched
          assert "index.html" not in touched
          assert "free-agent-board.html" not in touched
          print("PASS: B16 V2 mutation scope is research-only.")
          PY

      - name: Commit B16 V2 corrected feasibility result
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B16 V2."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b16_v2_discovery_fix_preregistration.json \
            research/draft-capital-outlook-v1/b16_v2_historical_snapshot_feasibility_result.json \
            research/draft-capital-outlook-v1/b16_v2_historical_snapshot_feasibility_summary.json \
            research/draft-capital-outlook-v1/b16_v2_historical_snapshot_feasibility_report.md \
            research/draft-capital-outlook-v1/b16_v2_manifest.json \
            research/draft-capital-outlook-v1/archive/historical-anchor-feasibility-v2/

          git commit -m "Correct Draft Capital Outlook historical archive discovery"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B16 V2 corrected feasibility result committed."
