# QF10 V6: descriptive evidence only. NO production promotion or review-branch candidate.
# Outlier: Will Anderson +1413 market points; old source votes unavailable, so NO causal attribution.
name: QF10 V6 - Will Anderson Market Vote Sensitivity Forensic (Read Only)
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  forensic:
    name: Forensic rank exposure and single-ballot sensitivity; absolutely no production writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout pinned main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing repo HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin market model, existing artifacts and frozen policies
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP not main''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP wrong dispatch checkout''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP dirty checkout''; exit 1; }

        git merge-base --is-ancestor d8a2be0bf1edb8d19e94e2edc5157062f95096f3 HEAD || { echo ''STOP QF9 production
        ancestry''; exit 1; }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP frozen/source drift $1"; exit 1; }; }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        pin scripts/validation/evaluate_market_history.py 121fc506d5a5b3c949a1a3951cd92b3bcbb23a58

        pin research/package-adjustment-v6/production_review_v1.json e39bff1ce541e093b2a9140e12716c24fbaffb86

        pin research/no-history-v2/no_history_v2_phase3_evaluation.json b90cea102eb23147619318dbb009559a64a3d620

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo ''PASS QF10 V6 exact published market source, portfolio valuation and V6 science pins''

        '
    - name: Canonical market self-test
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/market/build_market_value.py --selftest

        python3 scripts/validation/snapshot_values.py --selftest

        '
    - name: Build current vote graph and test latest-ballot deletion in memory only
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf10-v6-forensic.py <<'QF10_V6_PY'\nfrom __future__ import annotations\n\
        import datetime as dt\nimport json\nimport math\nimport statistics\nimport sys\nfrom pathlib import Path\n\
        \nrepo=Path.cwd()\nassert (repo/'index.html').is_file() and (repo/'scripts/market/build_market_value.py').is_file(),\
        \ 'STOP wrong checkout root'\nsys.path.insert(0,str(repo))\nsys.path.insert(0,str(repo/'scripts/market'))\n\
        sys.path.insert(0,str(repo/'scripts/validation'))\nfrom scripts.market import build_market_value as mv\n\
        from scripts.market import ktc_pipeline as ktc\nfrom scripts.validation import snapshot_values as sv\nfrom\
        \ scripts.validation.evaluate_market_history import normalize_name\n\nsaved=json.loads((repo/'scripts/artifacts/generated/market_values.json').read_text())\n\
        nh=json.loads((repo/'research/no-history-v2/no_history_v2_phase3_evaluation.json').read_text())\npav6=json.loads((repo/'research/package-adjustment-v6/production_review_v1.json').read_text())\n\
        assert saved['method_version']==mv.METHOD_VERSION\nassert saved['policy_sha256']==mv.POLICY_SHA256, 'STOP\
        \ Market Value method/policy changed'\nassert saved['scale_semantics']==mv.SCALE_SEMANTICS\nassert nh['status']=='EARLY_DIAGNOSTIC_ONLY'\
        \ and nh['deployment_authorized'] is False\nscope=pav6['proposed_conservative_production_scope']\nassert\
        \ scope['trade_topology']=='exactly one target player versus exactly three package players'\nassert scope['outside_scope_behavior']=='fail_closed_no_V6_adjustment'\n\
        assert not pav6['production_change_authorized']\n\ncfg=sv.load_from_html(repo/'index.html')\nmodel=sv.compute_all_values(cfg)\n\
        assert len(model)==565\nold=saved['players']\nassert len(old)==504\n\ndef stat_date(s):\n    try: return\
        \ dt.datetime.fromisoformat(str(s).replace('Z','+00:00'))\n    except (ValueError,TypeError): return None\n\
        \ndef fit(rows):\n    weights=mv.build_voter_weights(rows)\n    pairs=mv.build_weighted_pairs(rows,weights)\n\
        \    rating=ktc.weighted_bradley_terry(pairs)\n    resolved,identity=mv.resolve_league_ratings(model,rating)\n\
        \    calibrated=mv.quantile_calibrate(model,resolved)\n    return calibrated, weights, identity, len(pairs)\n\
        \ntry:\n    rows, source=mv.load_vote_rows()\nexcept Exception as exc:\n    print('QF10_V6_SOURCE_UNAVAILABLE\
        \ '+json.dumps({'status':'LIVE_SOURCE_UNAVAILABLE_NO_CANDIDATE','error_type':type(exc).__name__,'no_publish':True},sort_keys=True))\n\
        \    print('QF10_V6_RESEARCH_GREEN market_preview_complete=False publication_authorized=False')\nelse:\n\
        \    assert len(rows)>=100,'STOP inadequate current vote count'\n    new,weights,identity,npairs=fit(rows)\n\
        \    assert len(new)>=100,'STOP inadequate resolved market coverage'\n    assert set(new)==set(old),'STOP\
        \ market-covered universe changed; new research required'\n    assert all(new[k]['fundamental_value']==model[k]['value']\
        \ for k in new),'STOP center is not current FV'\n    assert all(new[k]['market_value']>=0 for k in new),'STOP\
        \ invalid market value'\n    focus='will anderson'\n    assert focus in old and focus in new\n    ranked=[]\n\
        \    for key in new:\n        a=old[key];b=new[key]\n        ranked.append({'name':key,'position':b['pos'],'oldRank':a['market_rank'],'newRank':b['market_rank'],'rankMove':round(b['market_rank']-a['market_rank'],3),'oldMarket':a['market_value'],'newMarket':b['market_value'],'valueMove':int(b['market_value']-a['market_value']),'oldRating':a['market_rating'],'newRating':b['market_rating']})\n\
        \    movers=sorted(ranked,key=lambda x:(-abs(x['valueMove']),x['name']))\n    price_changes=[abs(x['valueMove'])\
        \ for x in ranked]\n    rank_changes=[abs(x['rankMove']) for x in ranked]\n    focusrow=next(x for x in\
        \ ranked if x['name']==focus)\n    print('QF10_V6_RANK_FORENSIC '+json.dumps({'sourceMode':source.get('mode'),'canonicalRows':len(rows),'pairwiseEdges':npairs,'marketPlayers':len(new),'directAssumption':False,'changesZero':sum(v==0\
        \ for v in price_changes),'maxAbsChange':max(price_changes),'maxAbsRankMove':max(rank_changes),'avgAbsRankMove':round(statistics.mean(rank_changes),3),'numberOfRankMovesAboveFive':sum(v>5\
        \ for v in rank_changes),'target':focusrow,'topMovers':movers[:12],'inference':'Candidate created from CURRENT\
        \ live votes; old underlying row set was not archived here. This is NOT a causal pre/post analysis.'},sort_keys=True))\n\
        \n    def is_focus(value):\n        s=normalize_name(str(value or ''))\n        return s in ('will anderson','will\
        \ anderson jr')\n    direct=[r for r in rows if any(is_focus(r.get(slot)) for slot in ('keep','trade','cut'))]\n\
        \    counts={field:sum(is_focus(r.get(field)) for r in direct) for field in ('keep','trade','cut')}\n  \
        \  directVoters=len({str(r.get('voter_roster_id') or 'unknown') for r in direct})\n    effectiveExposure=sum(weights[str(r.get('voter_roster_id')\
        \ or 'unknown')]['ballot_weight'] for r in direct)\n    oldTime=stat_date(saved['generated_at_utc'])\n \
        \   dated=[(i,stat_date(r.get('timestamp'))) for i,r in enumerate(rows)]\n    after=[i for i,date in dated\
        \ if date is not None and date.tzinfo is not None and date>oldTime]\n    print('QF10_V6_VOTE_EXPOSURE '+json.dumps({'directBallots':len(direct),'directVoters':directVoters,'directWeightedBallots':round(effectiveExposure,4),'roleCounts':counts,'capturedRowsTimestampedAfterSavedArtifact':len(after),'focusBallotsTimestampedAfterSavedArtifact':sum(any(is_focus(rows[i].get(slot))\
        \ for slot in ('keep','trade','cut')) for i in after),'effectiveVotes':round(sum(v['effective_votes'] for\
        \ v in weights.values()),4),'largestVoterSharePct':round(max(v['effective_share_pct'] for v in weights.values()),4),'caution':'Post-date\
        \ rows alone do not establish cause or identify all vote-set changes. No raw voter identities are published.'},sort_keys=True))\n\
        \n    valid=[(i,date) for i,date in dated if date is not None and date.tzinfo is not None]\n    if valid:\n\
        \        i,date=max(valid,key=lambda v:(v[1],v[0]))\n        minus=rows[:i]+rows[i+1:]\n        shadow,sweights,sidentity,spairs=fit(minus)\n\
        \        assert focus in shadow, 'STOP target lost in one-vote sensitivity'\n        newFocus=new[focus];\
        \ alt=shadow[focus]\n        print('QF10_V6_SINGLE_BALLOT_SENSITIVITY '+json.dumps({'latestEligibleBallotTimestamp':date.isoformat(),'wasDirectFocusBallot':any(is_focus(rows[i].get(slot))\
        \ for slot in ('keep','trade','cut')),'oldArtifactTargetRank':old[focus]['market_rank'],'fullCurrentRank':newFocus['market_rank'],'minusLatestRank':alt['market_rank'],'oldArtifactTargetMarket':old[focus]['market_value'],'fullCurrentMarket':newFocus['market_value'],'minusLatestMarket':alt['market_value'],'priceChangeWithoutLatestBallot':alt['market_value']-newFocus['market_value'],'rankChangeWithoutLatestBallot':round(alt['market_rank']-newFocus['market_rank'],3),'note':'A\
        \ one-ballot deletion tests stability of the current estimator. It does not reproduce the old October 7\
        \ vote snapshot.'},sort_keys=True))\n    else:\n        print('QF10_V6_SINGLE_BALLOT_SENSITIVITY '+json.dumps({'status':'SKIPPED_NO_VALID_BALLOT_TIMESTAMP','no_promotion':True},sort_keys=True))\n\
        \    print('QF10_V6_RESEARCH_GREEN market_preview_complete=True publication_authorized=False; no price or\
        \ artifact writes')\nQF10_V6_PY\npython3 -m py_compile /tmp/qf10-v6-forensic.py\npython3 /tmp/qf10-v6-forensic.py\n"
    - name: Run repo regressions without modifying model or data
      shell: bash
      run: 'set -euo pipefail

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''PASS QF10 V6 existing 14 regression groups and frozen parity''

        '
    - name: Confirm exactly zero repo writes
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP repository changed''; exit 1; }

        [[ "$(git hash-object index.html)" == ''c83e3f68d11853c072017e6bd83bb1ad085f4a3e'' ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == ''829445174a77ceb4bb19dfd97a725e371d18efe8''
        ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == ''24c9f63881cc768a18d412172f04e5a263a4abc2''
        ]] || exit 1

        echo ''QF10_V6_ZERO_WRITE_GREEN: forensics only; no branch, commit, push, published market changes, FV or
        package policy changes''

        '
