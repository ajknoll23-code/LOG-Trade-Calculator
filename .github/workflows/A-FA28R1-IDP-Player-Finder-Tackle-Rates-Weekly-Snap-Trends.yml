name: A-FA28R1 - IDP Player Finder (Tackle Rates & Weekly Snap Trends) (Preview / Apply)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first, then Apply only when Preview is green
        type: choice
        required: true
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  player-finder:
    name: Player Finder verification (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage checksum-pinned code and minimal board integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,zlib
          from pathlib import Path
          items=[
            ('assets/fa_player_finder_v1.js','5cee8a699a13863f1262ee87c66658fb7c204d3e49b5995f2c6d46002f69917e',''),
            ('assets/fa_player_finder_v1.css','3b32753e0637159b80de014acf762f6c497ae17fd4b9fdbb7c6b6c1298917292',''),
            ('/tmp/fa28_patch.py','2a6e1ec98f1d06df217082ef9482842865518bed55bbbb1a524e071123c6e5f7',''),
            ('/tmp/fa28_qa.py','b35e8966115a29b3ac63c425b9e4ebb549fc409c37651eb3412a68f0a0cda97c',''),
          ]
          for target,checksum,compressed in items:
              data=zlib.decompress(base64.b64decode(compressed))
              assert hashlib.sha256(data).hexdigest()==checksum, 'FA28 asset checksum mismatch: '+target
              p=Path(target);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('FA28 staged: source only; zero user CSV, private JSON, or licensed rows')
          PYCODE
          python3 /tmp/fa28_patch.py
      - name: Check module integrity privacy and restricted changes
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_player_finder_v1.js
          node --check assets/fa_role_intel_v1.js
          python3 -m py_compile /tmp/fa28_patch.py /tmp/fa28_qa.py
          python3 - <<'PYCODE'
          from pathlib import Path
          js=Path('assets/fa_player_finder_v1.js').read_text()
          css=Path('assets/fa_player_finder_v1.css').read_text()
          html=Path('free-agent-board.html').read_text()
          role=Path('assets/fa_role_intel_v1.js').read_text()
          assert html.count('FA28_PLAYER_FINDER_STYLE')==1 and html.count('FA28_PLAYER_FINDER_SCRIPT')==1
          assert 'body.free-agent-locked #fa28Launcher' in css
          assert 'window.LOG_IDP_ROLE27_READ' in js and 'lb_sample_snaps' in role
          assert 'strict3=last3.every(Boolean)' in js
          assert 'sourceInfo.currentPublicWeek' in js
          assert 'PUBLIC_SLEEPER_WEEKLY_IDP_EVIDENCE_NOT_PROJECTION_OR_BREAKOUT' in js
          assert 'PRIVATE_OWNER_WEEKLY_IDP_SNAP_CSV_LOCAL_ONLY' in js
          assert 'fetch(ROOT+path' in js
          assert 'XMLHttpRequest' not in js and "method:'POST'" not in js and 'sendBeacon(' not in js
          assert 'analysisWeek<11' in role, 'Pregame Week10 protection changed unexpectedly'
          assert 'Bryce Boettcher' not in js and 'M.J. Stewart' not in js and 'DeMarcco Hellams' not in js
          print('FA28 static QA PASS: weekly evidence, private storage, no lookahead into FA26, gated launcher')
          PYCODE
          git add -N -- assets/fa_player_finder_v1.js assets/fa_player_finder_v1.css assets/fa_role_intel_v1.js free-agent-board.html
          git diff --name-only > /tmp/fa28_changed.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          paths=set(Path('/tmp/fa28_changed.txt').read_text().splitlines())
          allowed={'assets/fa_player_finder_v1.js','assets/fa_player_finder_v1.css','assets/fa_role_intel_v1.js','free-agent-board.html'}
          assert paths.issubset(allowed) and all(not p.endswith(('.csv','.json','.yml')) for p in paths), 'Unexpected production file diff: '+repr(paths-allowed)
          print('FA28 expected restricted write-set:',', '.join(sorted(paths)))
          PYCODE
      - name: Set up Python for synthetic browser verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium synthetic QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Run synthetic mobile filter and private-import browser tests
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/fa28_qa.py
      - name: Preview complete - zero writes
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'PASS FA28 preview. Source and synthetic tests only. Main unchanged.'
      - name: Apply verified Player Finder
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/fa_player_finder_v1.js assets/fa_player_finder_v1.css assets/fa_role_intel_v1.js free-agent-board.html
          if git diff --cached --quiet; then
            echo 'FA28 already applied; no duplicate changes.'
          else
            git commit -m 'FA28: mobile IDP finder with tackle rate and true consecutive-week snap filters'
            git push origin HEAD:main
          fi
          echo 'FA28 deployed: generic browser code only, no paid input data.'
