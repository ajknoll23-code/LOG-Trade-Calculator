name: Player Suggestion Auto Add

# One-time UI behavior improvement:
# tapping an autocomplete result adds that player immediately.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  player-suggestion-auto-add:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install requests

      - name: Verify current production baseline
        run: |
          python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check
          python3 scripts/validation/check_package_adjustment_live.py

      - name: Install one-tap player selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          INDEX = Path("index.html")
          EXPECTED_GIT_BLOB = "6ecf9eaeb7b1a7efe28419a7cdf0fdb0d6186f7a"
          MARKER = "PLAYER_SUGGESTION_AUTO_ADD_V1"

          def git_blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()

          data = INDEX.read_bytes()
          text = data.decode("utf-8")

          if MARKER in text:
              print("Player suggestion auto-add is already installed; no patch needed.")
          else:
              actual = git_blob_sha(data)
              if actual != EXPECTED_GIT_BLOB:
                  raise RuntimeError(
                      f"index.html source drifted: expected git blob {EXPECTED_GIT_BLOB}, got {actual}"
                  )

              # The suggestion row currently only selects/autofills the player.
              old_suggestion = """return `<div class=\\"suggest-item\\" onmousedown=\\"applyMatch('${side}','${k}')\\">"""
              new_suggestion = """return `<div class=\\"suggest-item\\" onmousedown=\\"selectAndAddMatch('${side}','${k}')\\">"""

              if text.count(old_suggestion) != 1:
                  raise RuntimeError(
                      f"Expected exactly one player suggestion click binding; found {text.count(old_suggestion)}"
                  )

              text = text.replace(old_suggestion, new_suggestion, 1)

              # Keep applyMatch() as autofill-only because handleNameInput() also uses it
              # for exact typed matches. Only an explicit suggestion selection should add.
              anchor = """function handleNameInput(side){"""
              helper = """/* PLAYER_SUGGESTION_AUTO_ADD_V1
             Explicit autocomplete selection is a complete add action.
             applyMatch() intentionally remains autofill-only because exact typed names
             also call it from handleNameInput(). */
          function selectAndAddMatch(side, key){
            applyMatch(side, key);
            submitPlayer(side);
          }

          """

              if text.count(anchor) != 1:
                  raise RuntimeError(
                      f"Expected exactly one handleNameInput() anchor; found {text.count(anchor)}"
                  )

              text = text.replace(anchor, helper + anchor, 1)
              INDEX.write_text(text, encoding="utf-8")
              print("Installed one-tap player suggestion auto-add.")

          final = INDEX.read_text(encoding="utf-8")

          required = [
              "PLAYER_SUGGESTION_AUTO_ADD_V1",
              "function selectAndAddMatch(side, key){",
              "applyMatch(side, key);",
              "submitPlayer(side);",
              "selectAndAddMatch('${side}','${k}')",
              "if(PLAYER_DB[key]){",
              "applyMatch(side, key);",
              "function submitPlayer(side){",
              "addPlayerAsset(side, name, pos, age, role);",
              "TEAM_IMPACT_UI_RETIRED_V1",
              "TRADE_DESK_NAV_REORG_V1",
              "PACKAGE_ADJUSTMENT_V1_6_UI_REDESIGN",
          ]
          missing = [token for token in required if token not in final]
          if missing:
              raise RuntimeError(f"Post-patch required source missing: {missing}")

          old_binding = "onmousedown=\\\"applyMatch('${side}','${k}')\\\""
          if old_binding in final:
              raise RuntimeError("Suggestion row still uses the old two-step applyMatch binding.")

          # Critical behavior guard:
          # typing an exact player name must still only autofill; it must not auto-submit.
          exact_match_block = """if(PLAYER_DB[key]){
              applyMatch(side, key);
              return;
            }"""
          if exact_match_block not in final:
              raise RuntimeError("Exact typed-match autofill behavior drifted.")

          print("Suggestion tap -> selectAndAddMatch -> submitPlayer validation PASS.")
          print("Exact typed name remains autofill-only PASS.")
          print("Manual ADD PLAYER fallback remains available PASS.")
          PY

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = []
          for match in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, flags=re.S | re.I):
              attrs, body = match.group(1), match.group(2)
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              if body.strip():
                  scripts.append(body)

          if not scripts:
              raise RuntimeError('No inline scripts found')

          with tempfile.TemporaryDirectory(prefix='player-auto-add-js-') as td:
              for idx, script in enumerate(scripts):
                  path = Path(td) / f'inline-{idx}.js'
                  path.write_text(script, encoding='utf-8')
                  proc = subprocess.run(
                      ['node', '--check', str(path)],
                      capture_output=True,
                      text=True,
                  )
                  if proc.returncode != 0:
                      raise RuntimeError(
                          f'Inline script {idx} failed syntax check:\n{proc.stderr or proc.stdout}'
                      )

          print(f'JavaScript syntax PASS ({len(scripts)} inline scripts).')
          PY

      - name: Revalidate Package Adjustment and repository
        run: |
          python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Guard changed-file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {'index.html'}
          out = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          )
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise RuntimeError(f'Unexpected changed files: {unexpected}')

          print('Changed-file scope PASS:', sorted(changed))
          PY

          git diff --quiet -- .github/workflows || {
            echo "::error::A workflow file changed during the run."
            exit 1
          }

      - name: Ensure remote main did not move
        shell: bash
        run: |
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::origin/main moved during validation. Refusing to push."
            echo "Validated base: $local_sha"
            echo "Current origin/main: $remote_sha"
            exit 1
          fi

      - name: Commit one-tap player selection
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Player suggestion auto-add is already installed; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html

          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "index.html" ]; then
            echo "::error::Unexpected staged files: $staged"
            exit 1
          fi

          git commit -m "Auto-add player from search selection"
          git push origin HEAD:main
