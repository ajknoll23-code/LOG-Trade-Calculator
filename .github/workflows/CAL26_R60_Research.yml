name: CAL26 V1R60 - Same-Source Historical Multi-Position Future Surplus (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r60-frozen-historical-2021-25-multiposition
  cancel-in-progress: false
jobs:
  historical-nonQB-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout exact scorer and 2024-25 archive (read only)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download actual R59 518-player cross-position evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R59_518_PLAYER_CROSSPOS_SCALE_DECISION_NOT_FV
        run-id: 40054944157
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r60-inputs/R59
    - name: Download actual R53R1 frozen 2024-25 historical rank references
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R53R1_HISTORICAL_LOG_SEASONS_REPLACEMENT_SHARED_SURPLUS_READ_ONLY
        run-id: 40045370120
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r60-inputs/R53
    - name: Pinned historical 2021-25 player-id outcome continuity and outer holdouts
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R60_engine.py\" <<'PY_CAL26_V1R60_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 V1R60:\
        \ historical same-source player-specific LOG future trajectories.\nResearch only. 2021-23 Sleeper official historical weekly stats; pinned\
        \ 2024-25\nrepo archive + original scorer. Preseason 2026 merely a frozen sensitivity; it\nis NOT a prospectively validated production\
        \ FV or exact projection transfer.\n\"\"\"\nimport argparse,ast,collections,csv,hashlib,io,json,math,pathlib,statistics,subprocess,sys,time,urllib.request,urllib.error\n\
        \nP='CAL26_V1R60'\nPOS=('QB','RB','WR','TE','DL','LB','DB')\nMAP={'QB':'QB','RB':'RB','WR':'WR','TE':'TE','DE':'DL','DT':'DL','DL':'DL','OLB':'LB','ILB':'LB','LB':'LB','CB':'DB','S':'DB','SS':'DB','FS':'DB','DB':'DB'}\n\
        PIN59={'CAL26_V1R59_518_year0_crosspos_sensitivity_NOT_FV.csv':'4b7b82d3656d3634d648a61d99adbc8d80fe74c759d6b6f98e492fc73c91cdac', 'CAL26_V1R59_7_position_replacement_stress.csv':'55e8a32ed4c62dd8002211ded1b89e0d21d95ab819ef1f0d9ba3352fdcafc0ac','CAL26_V1R59_manifest.json':'dummypin'}\n\
        ARCHIVE='research/roster-economics/weekly_points_by_season.json'\nSCORER='research/roster-economics/historical_weekly_points_pipeline.py'\n\
        REPO_BLOBS={ARCHIVE:'ad8c2275042fba93cbbae20d6a0b8c27b4bcaf84',SCORER:'d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace'}\nBASE='https://api.sleeper.app/v1'\n\
        \ndef req(cond,label):\n if not cond:raise AssertionError(label)\ndef sha(data):return hashlib.sha256(data).hexdigest()\ndef num(s):\n\
        \ x=float(s);req(math.isfinite(x),'NONFINITE');return x\ndef load_csv(p):\n rows=list(csv.DictReader(io.StringIO(p.read_text(encoding='utf-8-sig'))));req(bool(rows),'CSV_EMPTY_'+p.name);return\
        \ rows\ndef write_csv(rows):\n req(bool(rows),'CSV_OUTPUT_EMPTY');s=io.StringIO(newline='');w=csv.DictWriter(s,fieldnames=list(rows[0]),lineterminator='\\\
        n');w.writeheader();w.writerows(rows);return s.getvalue()\ndef git_blob(path):return subprocess.check_output(['git','hash-object','--',path],text=True).strip()\n\
        def load_inputs(folder,fixture=False):\n mpath=folder/'CAL26_V1R59_manifest.json';req(mpath.is_file(),'MISSING_R59_MANIFEST')\n man=json.loads(mpath.read_text());req(man['semantic_status']=='518_PLAYER_SHARED_YEAR0_SCALE_SENSITIVITY__CARDINAL_FV_NOT_IDENTIFIED__HOLD','R59_RELEASE_STATUS_DRIFT')\n\
        \ req(man['n_2026_projected_players']==518 and man['n_positions']==7 and man['unscored_frozen_players']==31,'R59_ROWS_DRIFT')\n req(man['production_change_authorized']\
        \ is False and man['future_2026_weeks8_12_holdout_read'] is False,'R59_PROD_OR_FUTURE_DRIFT')\n inputs={}\n for f,expected in PIN59.items():\n\
        \  if f.endswith('manifest.json'):continue\n  p=folder/f;req(p.is_file(),'R59_INPUT_MISSING_'+f)\n  req(sha(p.read_bytes())==expected\
        \ and man['output_sha256'][f]==expected,'R59_PIN_DRIFT_'+f)\n  inputs[f]=load_csv(p)\n full=inputs['CAL26_V1R59_518_year0_crosspos_sensitivity_NOT_FV.csv'];stress=inputs['CAL26_V1R59_7_position_replacement_stress.csv']\n\
        \ req(len(full)==518 and len(stress)==7 and {x['position'] for x in stress}==set(POS),'R59_COHORT_DRIFT')\n req(len({x['name'] for x in\
        \ full})==518,'R59_NAME_COLLISION')\n req(all(x['production_change_authorized']=='False' for x in full),'R59_RELEASE_ROW_DRIFT')\n return\
        \ man,full,{r['position']:int(r['base_reference_rank']) for r in stress}\ndef fetch(url):\n req(url.startswith(BASE+'/'),'UNAPPROVED_SOURCE')\n\
        \ error=None\n for attempt in range(3):\n  try:\n   q=urllib.request.Request(url,headers={'User-Agent':'CAL26-V1R60-historical-pre2026-only','Accept':'application/json'})\n\
        \   with urllib.request.urlopen(q,timeout=55) as resp:\n    req(resp.status==200,'HISTORICAL_HTTP_'+str(resp.status))\n    raw=resp.read(40000000);req(len(raw)<40000000,'SOURCE_OVERSIZE');return\
        \ raw\n  except (OSError,urllib.error.URLError,TimeoutError) as e:\n   error=e;time.sleep(attempt+1)\n raise RuntimeError('HISTORICAL_SOURCE_DOWNLOAD_FAILED\
        \ '+url+': '+str(error))\ndef position_index(raw):\n data=json.loads(raw);req(isinstance(data,dict),'BAD_PLAYER_INDEX')\n idx={str(k):{'name':(v.get('full_name')\
        \ or ' '.join((v.get('first_name') or '',v.get('last_name') or '')).strip()),'pos':MAP.get(v.get('position'))} for k,v in data.items()\
        \ if isinstance(v,dict)}\n req(len(idx)>1000,'PLAYER_INDEX_TOO_SMALL');return idx\n\ndef repo_archive(repo,fixture,full):\n if fixture:\n\
        \  # Synthetic integrity and temporal split test: never an empirical source.\n  years={};by={p:[x for x in full if x['position']==p] for\
        \ p in POS}\n  for year in range(2021,2026):\n   rows={}\n   for p,group in by.items():\n    for i,r in enumerate(group):\n     pid='test-'+p+'-'+str(i);x=max(0,num(r['2026_projected_points'])*(0.75+0.05*((year+i)%5))\
        \ )\n     rows[pid]={'name':r['name'],'pos_bucket':p,'weekly_points':{'1':round(x/3,2),'2':round(x/3,2),'3':round(x/3,2)}}\n   years[str(year)]=rows\n\
        \  return years,{'fixture':True,'source_type':'SYNTHETIC_NO_EMPIRICAL_CLAIMS'},[]\n for p,dig in REPO_BLOBS.items():\n  req((repo/p).is_file(),'MISSING_FROZEN_REPO_'+p)\n\
        \  req(git_blob(repo/p)==dig,'GIT_BLOB_SOURCE_DRIFT_'+p)\n # Load the exact verified function body without importing its `requests` dependency.\n\
        \ # This scorer is already committed and pinned; do not alter or substitute scoring rules.\n source_ast=ast.parse((repo/SCORER).read_text())\n\
        \ scorer_nodes=[n for n in source_ast.body if isinstance(n,ast.FunctionDef) and n.name=='score_week']\n req(len(scorer_nodes)==1,'SOURCE_SCORER_FUNCTION_NOT_FOUND')\n\
        \ isolated=ast.fix_missing_locations(ast.Module(body=scorer_nodes,type_ignores=[]))\n scorer_ns={'__builtins__':{}};exec(compile(isolated,str(repo/SCORER),'exec'),scorer_ns)\n\
        \ score_week=scorer_ns['score_week']\n historical=json.loads((repo/ARCHIVE).read_text())\n req(set(historical['seasons'])=={'2024','2025'},'HISTORICAL_REPO_YEARS_DRIFT')\n\
        \ index_bytes=fetch(BASE+'/players/nfl');index=position_index(index_bytes)\n years={str(y):historical['seasons'][str(y)] for y in (2024,2025)}\n\
        \ trace=[{'year':'INDEX','week':'ALL','url':BASE+'/players/nfl','sha256':sha(index_bytes),'bytes':len(index_bytes),'scored_player_count':len(index)}]\n\
        \ for year in (2021,2022,2023):\n  season={};good=collections.Counter();zero_gp=0;seen_players=set()\n  for wk in range(1,19):\n   url=f'{BASE}/stats/nfl/regular/{year}/{wk}';blob=fetch(url);stats=json.loads(blob)\n\
        \   req(isinstance(stats,dict),'WEEK_STATS_BAD_FORMAT')\n   scored=0\n   for pid,entry in stats.items():\n    if not isinstance(entry,dict)\
        \ or num(entry.get('gp',0) or 0)<1:zero_gp+=1;continue\n    info=index.get(str(pid));pos=info.get('pos') if info else None\n    if pos\
        \ not in POS:continue\n    val=score_week(entry);req(math.isfinite(val) and abs(val)<1000,'HIST_SCORER_OUT_OF_RANGE')\n    obj=season.setdefault(str(pid),{'name':info['name'],'pos_bucket':pos,'weekly_points':{}})\n\
        \    req(str(wk) not in obj['weekly_points'],'DUPLICATE_SCORING_WEEK')\n    obj['weekly_points'][str(wk)]=round(val,2);scored+=1;good[pos]+=1;seen_players.add(pid)\n\
        \   trace.append({'year':year,'week':wk,'url':url,'sha256':sha(blob),'bytes':len(blob),'scored_player_count':scored})\n  req(len(season)>=100\
        \ and all(good[p]>=15 for p in POS),'HISTORICAL_SEASON_COVERAGE_INSUFFICIENT_'+str(year))\n  years[str(year)]=season\n for year in range(2021,2026):\n\
        \  req(len(years[str(year)])>60,'HISTORICAL_YEAR_MISSING_'+str(year))\n return years,{'fixture':False,'frozen_git_blobs':REPO_BLOBS,'archived_2024_25_sha256':sha((repo/ARCHIVE).read_bytes()),'player_index_sha256':sha(index_bytes),'2021_23_stats_endpoint_calls':54,'scorer_source':'repo_pinned_exact_Sleeper_LOG'},trace\n\
        \ndef summarize(years,ranks,fixture=False):\n # Player ID, not spelling, joins observed next-year outcomes. Missing next season -> 0.\n\
        \ annual={};reference=[];rows=[];totals={}\n for y in range(2021,2026):\n  bypos=collections.defaultdict(list)\n  for pid,v in years[str(y)].items():\n\
        \   pos=v['pos_bucket'];\n   if pos not in POS:continue\n   weeks=v.get('weekly_points',{});req(isinstance(weeks,dict),'MISSING_WEEKLY_POINTS')\n\
        \   total=0.0\n   for w,n in weeks.items():req(str(w).isdigit() and 1<=int(w)<=18,'INVALID_HIST_WEEK');total+=num(n)\n   req(-100<=total<=3000,'IMPLAUSIBLE_SEASON_TOTAL')\n\
        \   bypos[pos].append({'id':str(pid),'pos':pos,'name':v['name'],'points':round(total,3),'games':len(weeks)})\n  annual[y]={}\n  for pos\
        \ in POS:\n   ss=sorted(bypos[pos],key=lambda z:(-z['points'],z['id']));req(len(ss)>=ranks[pos]+3,f'HIST_POOL_TOO_SMALL_{y}_{pos}')\n\
        \   ref=ss[ranks[pos]-1]['points'];annual[y][pos]={'rank':ranks[pos],'ref':ref,'pool':len(ss)}\n   reference.append({'season':y,'position':pos,'reference_rank':ranks[pos],'actual_total_points_at_rank':round(ref,3),'n_players':len(ss),'qualifier':'observed_played>=1_not_waiver_replacement'})\n\
        \   for z in ss:\n    z['surplus']=round(max(0,z['points']-ref),4)\n    rows.append({'season':y,'Sleeper_id':z['id'],'name':z['name'],'position':pos,'actual_LOG_points':z['points'],'actual_LOG_surplus_points':z['surplus'],'observed_games':z['games'],'not_2026_data':True})\n\
        \ totals={(r['season'],r['Sleeper_id']):r for r in rows}\n if not fixture:\n  # Real published 2024/25 rank values frozen in R53 are cross-checked\
        \ by separate inputs when passed.\n  req(len(reference)==35,'HIST_REFERENCE_COUNT')\n return annual,reference,rows,totals\n\ndef fit_linear(train):\n\
        \ req(len(train)>=2,'TRAIN_INSUFFICIENT')\n mx=statistics.mean(x for x,y in train);my=statistics.mean(y for x,y in train)\n denom=sum((x-mx)**2\
        \ for x,y in train)\n slope=max(0.,min(1.5,sum((x-mx)*(y-my) for x,y in train)/denom)) if denom>1e-7 else 0.\n intercept=max(0.,my-slope*mx)\n\
        \ return slope,intercept\n\ndef evaluate(history,ranks):\n # Fixed origins separate chronological training and external test; no 2026\
        \ labels.\n _,_,allrows,totals=summarize(history,ranks)\n byyear=collections.defaultdict(list)\n for r in allrows:byyear[r['season']].append(r)\n\
        \ outcome={};model={};positions=[]\n for pos in POS:\n  for horizon in (1,2,3):\n   train=[];test=[];cohorts=collections.Counter();missing=collections.Counter()\n\
        \   for origin in (2021,2022,2023,2024):\n    if origin+horizon>2025:continue\n    for r in byyear[origin]:\n     if r['position']!=pos:continue\n\
        \     fut=totals.get((origin+horizon,r['Sleeper_id']))\n     same=(fut is not None and fut['position']==pos)\n     y=num(fut['actual_LOG_surplus_points'])\
        \ if same else 0.\n     x=num(r['actual_LOG_surplus_points'])\n     tup=(x,y)\n     if origin in (2021,2022):train.append(tup);cohorts['train_'+str(origin)]+=1\n\
        \     else:test.append(tup);cohorts['test_'+str(origin)]+=1\n     if not same:missing['absent_or_pos_changed_'+str(origin)]+=1\n   req(len(train)>=ranks[pos]+2,f'BELOW_TRAIN_SOURCE_MIN_{pos}_H{horizon}')\n\
        \   slope,intercept=fit_linear(train)\n   def mse(pairs,pred):return sum((y-pred(x))**2 for x,y in pairs)/len(pairs) if pairs else None\n\
        \   trainmean=statistics.mean(y for x,y in train)\n   m=mse(test,lambda x:slope*x+intercept)\n   sticky=mse(test,lambda x:x)\n   mean=mse(test,lambda\
        \ x:trainmean)\n   win=(m is not None and m<sticky and m<mean)\n   # H3 cannot be tested without post-2025 observations, do not suggest\
        \ release.\n   tag='HISTORICAL_TEST_WIN_RESEARCH_ONLY' if win else ('NO_OUTER_HOLDOUT' if not test else 'MODEL_DID_NOT_BEAT_BASELINES')\n\
        \   obj={'position':pos,'horizon_years':horizon,'train_origins':'2021,2022','test_origins':','.join(str(x) for x in (2023,2024) if cohorts['test_'+str(x)]>0),\n\
        \    'train_n':len(train),'outer_test_n':len(test),'slope':round(slope,7),'intercept_surplus':round(intercept,4),\n    'outer_model_mse':None\
        \ if m is None else round(m,4),'outer_sticky_mse':None if sticky is None else round(sticky,4),'outer_trainmean_mse':None if mean is None\
        \ else round(mean,4),\n    'test_model_beats_both_baselines':win,'withheld_future_projection_transport':True,'horizon_status':tag,\n \
        \   'no_price_or_production_authorization':True,'historical_absent_or_position_change_cases':sum(missing.values())}\n   positions.append(obj);model[(pos,horizon)]=obj\n\
        \ return positions,model,allrows\n\ndef main(a):\n man,full,ranks=load_inputs(a.inputs)\n years,source,trace=repo_archive(a.repo,a.fixture,full)\n\
        \ _,reference,hist_rows,totals=summarize(years,ranks,a.fixture)\n horizon,model,_=evaluate(years,ranks)\n # Exact frozen 2024/25 rank\
        \ anchors using R59 R53 evidence (not fiction).\n hist_r59=list(csv.DictReader((a.r53_history).open())) if a.r53_history and a.r53_history.is_file()\
        \ else []\n if not a.fixture:\n  req(len(hist_r59)==24,'R53_HISTORICAL_VALIDATION_INPUT_MISSING')\n  lookup={(int(x['season']),x['position'],int(x['rank'])):num(x['points_exact_LOG_weekly_scored'])\
        \ for x in hist_r59}\n  for r in reference:\n   if r['season'] in (2024,2025):\n    key=(r['season'],r['position'],r['reference_rank'])\n\
        \    req(key in lookup and abs(lookup[key]-r['actual_total_points_at_rank'])<.05,f'ARCHIVED_LOG_REFERENCE_PARITY_{key}')\n  req(sha(a.r53_history.read_bytes())=='b093956d3e929a2217ecd1a12c81bc5a990897c8e02e0fa3dc40e4bd26a24e89','R53_HISTORY_SHA_DRIFT')\n\
        \ outrows=[]\n for r in full:\n  pos=r['position'];x=num(r['year0_surplus_points']);v=model[(pos,1)];q=v['test_model_beats_both_baselines']\
        \ and v['outer_test_n']>=30\n  projected=round(v['slope']*x+v['intercept_surplus'],3) if q else ''\n  outrows.append({'name':r['name'],'position':pos,'frozen_FV_UNCHANGED':r['frozen_FV_UNCHANGED'],'2026_projected_year0_surplus_NOT_FV':r['year0_surplus_points'],\n\
        \   '2027_empirical_nextseason_SURPLUS_SENSITIVITY_NOT_FV':projected,'historical_H1_outer_n':v['outer_test_n'],\n   'h1_empirical_beats_sticky_and_mean':v['test_model_beats_both_baselines'],\n\
        \   '2026_preseason_projection_to_historical_model_transport_validated':False,'2026_forecast_exact_LOG_bonus_scored':False,\n   'future_year2_and_3_prices_calibrated':False,'production_change_authorized':False})\n\
        \ req(len(outrows)==518 and len(horizon)==21 and len(reference)==35,'OUTPUT_COUNTS')\n qa={'workflow':'CAL26 V1R60 - Historical Same-Source\
        \ Multi-Position Next-Season Outcome Bridge (Read Only)',\n  'semantic_status':'HISTORICAL_2021_25_SEVEN_POSITION_SURPLUS_HORIZONS__FV_HOLD',\n\
        \  'R59_run_id':40054944157,'R59_artifact_verified':True,'fixture':a.fixture,'sources':source,\n  'n_2026_frozen_candidates':518,'n_frozen_unprojected_preserved':31,'n_historical_players_season_rows':len(hist_rows),'n_position_horizons':len(horizon),\n\
        \  'H1_success_positions':[v['position'] for v in horizon if v['horizon_years']==1 and v['test_model_beats_both_baselines']],\n  'H2_outer_test_available_positions':[v['position']\
        \ for v in horizon if v['horizon_years']==2 and v['outer_test_n']>0],\n  'H3_outer_test_available_positions':[v['position'] for v in horizon\
        \ if v['horizon_years']==3 and v['outer_test_n']>0],\n  'no_2026_actuals_read':True,'future_2026_weeks8_12_read':False,'market_or_owner_price_targets_used':False,\n\
        \  'shared_cardinal_dynasty_price_identified':False,'production_change_authorized':False,'index_html_modified':False}\n report=['# CAL26\
        \ V1R60 — Same-source 2021–25 seven-position next-season surplus evidence',\n '**Status:** Research only; no FV or production changes.',\
        \ '',\n 'Historical 2021–23 official Sleeper weekly stats use the exact pinned LOG scorer; 2024–25 use the pinned pre-existing full-NFL\
        \ Sleeper LOG-scored archive. Historical data only. 2026 Weeks 7+ and sealed outcomes were not downloaded.', '',\n 'The same-player Sleeper\
        \ ID continuity records missing next-year observations as zero (nonparticipation or position changes), not as survivors. Historical yearly\
        \ replacement is a **league lineup rank assumption**; not waiver replacement.', '',\n '## Historical out-of-time results (test 2023→2024\
        \ and 2024→2025 for H1; 2023→2025 for H2)',\n '|Position|H1 test n|H1 model MSE|Sticky MSE|Train-mean MSE|H1 beats both|H2 test n|H3 test\
        \ n|',\n '|---|---:|---:|---:|---:|---|---:|---:|']\n for pos in POS:\n  x=model[(pos,1)];y=model[(pos,2)];z=model[(pos,3)]\n  report.append(f\"\
        |{pos}|{x['outer_test_n']}|{x['outer_model_mse']}|{x['outer_sticky_mse']}|{x['outer_trainmean_mse']}|{x['test_model_beats_both_baselines']}|{y['outer_test_n']}|{z['outer_test_n']}|\"\
        )\n report+=['','## Calibration limits and owner decision','These are historical **actual-season → future actual-season** transitions;\
        \ transporting the fitted relationship to *2026 preseason projections* remains untested. The R59 projected reference and historical realized\
        \ reference differ materially due to distinct measurement and forecast populations. Do NOT infer price-per-point from frozen FV.',\n 'H3\
        \ has no independent unseen-origin holdout within the 2021–25 archive. This study does not validate a coherent 4-year dynasty price or\
        \ an exact 2026 projection scoring reconciliation.',\n 'Current research work should only progress to a *small explicitly labeled review\
        \ candidate* once common horizon evidence and a disclosed owner-set (not data-identified) price scale are available. Preserve all 31 unmatched\
        \ frozen players and do not touch production.',\n '',f\"**Historical H1 wins:** {', '.join(qa['H1_success_positions']) or 'none'}\",'',f\"\
        **Historical source mode:** {'FIXTURE - NO EVIDENCE' if a.fixture else 'REAL PINNED REPOSITORY AND OFFICIAL HISTORICAL SOURCE'}\",'']\n\
        \ payload={P+'_2021_25_historical_id_playerseason_rows.csv':write_csv(hist_rows),P+'_35_season_pos_references.csv':write_csv(reference),\n\
        \   P+'_21_position_horizon_holdouts.csv':write_csv(horizon),P+'_518_nextseason_SURPLUS_NOT_FV.csv':write_csv(outrows),P+'_decision.md':'\\\
        n'.join(report)}\n if trace:payload[P+'_historical_source_digest_ledger.csv']=write_csv(trace)\n a.out.mkdir(parents=True,exist_ok=True)\n\
        \ for name,txt in payload.items():(a.out/name).write_text(txt)\n qa['output_sha256']={n:sha(s.encode()) for n,s in payload.items()}\n\
        \ (a.out/(P+'_manifest.json')).write_text(json.dumps(qa,indent=2,sort_keys=True)+'\\n')\n print(json.dumps({'status':qa['semantic_status'],'fixture':a.fixture,'h1_wins':qa['H1_success_positions'],'historical_playerseasons':len(hist_rows),'n_production_price_changes':0}))\n\
        \ndef selftest():\n req(abs(fit_linear([(0,0),(10,10),(20,20)])[0]-1)<1e-8,'LINEAR_FIT_TEST')\n req(fit_linear([(0,2),(10,1),(20,0)])[0]==0,'NEGATIVE_SLOPE_CLAMP_TEST')\n\
        \ req(num(3)==3 and set(MAP.values())==set(POS),'BASIC_SCORER_TEST')\n print('R60_SELFTEST_GREEN origin splits, transition regression,\
