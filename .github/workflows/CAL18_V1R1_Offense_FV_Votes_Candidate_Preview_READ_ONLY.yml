              orig_mv=readj(BASE/'scripts/artifacts/generated/market_values.json')
              mv_players=orig_mv.get('players',{})
              def mv_drift(vals):
                  return sum(k in mv_players and mv_players[k].get('fundamental_value') != vals[k]['value'] for k in vals)
              original_stale=mv_drift(now);core_stale=mv_drift(core_current);expanded_stale=mv_drift(exp_current)
              summary={'status':'PASS_PREPRODUCTION_PREVIEW_READ_ONLY',**meta,
                       'cal16_core_changed':len(screened),'cal17_provisional_changed':len(rescued),
                       'cal17_directory_leads':len(leads),'cal17_provisional_details':Counter(x['decision'] for x in lead_audit),
                       'vote_source':source,'vote_digest':digest,'votes_changed_since_cal15':digest!=quote.get('input_vote_sha256'),
                       'ballots':len(ballots),'voters':len(voter_list),'ballots_skipped':skipped,
                       'mv_stale_original_run_date':original_stale,'mv_stale_after_core':core_stale,'mv_stale_after_expanded':expanded_stale,
                       'new_mv_stale_due_to_core':core_stale-original_stale,
                       'repo_production_changed':False,'core_files_sha256':core_meta['file_sha256'],
                       'expanded_files_sha256':exp_meta['file_sha256']}
              dump(OUT/'cal18_run_manifest.json',summary)
              change=[r for r in table if r['core_fv_delta_vs_current']]
              change.sort(key=lambda r:-abs(r['core_fv_delta_vs_current']))
              lines=['# CAL18 V1R1 — FV + Votes preproduction candidate (READ ONLY)','',
                     '**Status:** PREVIEW only. Neither candidate is approved for production.','',
                     f'- CAL16 verified green 173-player offense shadow incorporated. Frozen {FREEZE_DATE} parity: 565/565.',
                     f'- Extra CAL17 directory-only identities simulated in separate **provisional** scenario: {len(rescued)} moved players. NOT canonical ID approvals.',
                     f'- Refit all 565 FV+Votes quotes twice, fixed lambda=8, {len(ballots)} ballots from {len(voter_list)} voters, leave-one-voter-out recomputed.',
                     f'- Votes differ from frozen CAL15: {digest!=quote.get("input_vote_sha256")}. This is not evidence of independent price accuracy.',
                     f'- Original stale Market Values on as-of date: {original_stale}; after 173 core: {core_stale}; provisional: {expanded_stale}. MV is not altered; separate release remains required.',
                     f'- Age/clock: {sum(now[k]["value"]!=baseline[k]["value"] for k in keys)} players drifted since frozen {FREEZE_DATE}; quote values stamped {RUN_DATE} and may become stale after runtime date advances.',
                     '- Full candidate index and Free Agent Board valuation core synchronized with no changes to FA-specific factors.',
                     '- Weight 25% of 55% production component is ASSUMED, not empirically calibrated; 8% FV cap. No trade-verdict code or market-value model changes.',
                     '', '## Largest screened FV changes at preview as-of', '',
                     '| Player | Old FV | Core FV | Change | New FV+Votes |',
                     '|---|---:|---:|---:|---:|',
                     *[f'| {r["player"]} | {r["cal18_run_date_baseline_fv"]:,} | {r["core_fv"]:,} | {r["core_fv_delta_vs_current"]:+,} | {r["new_core_vote_quote"]:,} |' for r in change[:20]],
                     '', '## Immediate production decision', '',
                     'Review candidate_core_173 first. Explicitly resolve MV display staleness and dynamic-date quote persistence before an APPLY workflow. Do not promote provisional identities or assume projection scenario equals validated dynasty economics.',
                     '', 'The preview does not write or change any repository production files.']
              (OUT/'summary.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
              print('CAL18 PASS:',len(screened),'core,',len(rescued),'provisional;',len(keys),'posteriors;',len(ballots),'ballots;',len(voter_list),'voters', 'stale MV',core_stale)


          def selftest():
              require(fmt_raw(0.22500000000001)==.225,'12-decimal serializer')
              require(norm('Jacory Croskey-Merritt')==norm('jacory croskeymerritt'),'Name normalization')
              require(len(set(EXPECTED_RUNS.values()))==3,'Pinned sources not unique')
              require(CORE_CAP==.08 and SHOCK==.25 and FORWARD==.55,'Model parameters unexpected')
              # Numeric sanity: exact capped raw multiplier must be serialized safely.
              from types import SimpleNamespace
              global sv,market,np,minimize,expit
              import numpy as np
              from scipy.optimize import minimize
              from scipy.special import expit
              sv=SimpleNamespace(
                  production_multiplier=lambda key,role,raw,history,roles: (raw[key],raw[key]),
                  effective_age_multiplier=lambda pos,age,role,key,prod,under,cfg: 1.0)
              cfg={'player_db':{'test player':{'pos':'WR','age':26,'role':'Starter'}},
                   'no_real_history':set(),'role_mult':{'Starter':1.},'position_weight':{'WR':1.}}
              raw,v,capped=bounded_raw(cfg,'test player',.4,.8,2200)
              require(capped and abs(v-2200)<=math.floor(2200*.08),'Synthetic cap exact FV parity')
              market=SimpleNamespace(ktc_pipeline=SimpleNamespace(is_league_voter=lambda who:True))
              voters=[('one','alpha','beta','gamma'),('two','alpha','gamma','beta')]
              vals={k:{'value':i} for k,i in [('alpha',3500),('beta',2800),('gamma',1800)]}
              quote=fitter(voters,sorted(vals))(vals)
              require(len(quote)==3 and all(x>0 for x in quote),'Synthetic λ=8 FV+Votes fit')
              sample="const PROD_MULT_DATA = {\n 'test player':0.4,\n};\nconst FV_VOTE_ESTIMATE_URL = 'fv_informed_estimate_cal15.json';"
              altered=candidate_html(cfg,sample,[{'player':'test player','to':raw}])
              require('fv_informed_estimate_cal18.json' in altered and "'test player':"+str(raw) in altered,
                      'Synthetic candidate index/URL serialization')
              print('CAL18 numeric+serialization selftest PASS')

          if __name__=='__main__':
              if '--selftest' in sys.argv:selftest()
              else:main()
          PY_CAL18_ENGINE
          python3 -m py_compile /tmp/cal18_engine.py
          python3 /tmp/cal18_engine.py --selftest
          python3 /tmp/cal18_engine.py

