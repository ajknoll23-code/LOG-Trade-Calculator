          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["ACTIVATION_COMMIT"]
          expected = {
              "index.html",
              "scripts/market/ktc_pipeline.py",
              "scripts/market/package_vote_nextgen_v2_pipeline.py",
              "research/package-adjustment-nextgen-v2/voting_activation.json",
              "research/package-adjustment-nextgen-v2/voting_activation.md",
          }
          changed = set(
