name: Package Adjustment NextGen V2 Activate Voting

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard exact reviewed pre-activation state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object index.html)" = "c08bdfbb90158be9c13d83b7b7c128183f2d9c08"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = "a531c7a89aee379cdf19c7360f356951a5d7f3d0"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = "62b3877e41922b22fb6358d493c4e202f496a1f9"
          test ! -e research/package-adjustment-nextgen-v2/voting_activation_manifest.json
          test ! -e research/package-adjustment-nextgen-v2/voting_activation.md
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PASS: exact reviewed browser/KTC/regression baseline confirmed."

      - name: Verify frozen NextGen prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          rdir = root / 'research/package-adjustment-nextgen-v2'
          cat_path = rdir / 'package_vote_challenges_nextgen_v2.json'
          freeze_path = rdir / 'catalog_freeze_manifest.json'
          maturity_path = rdir / 'evidence_maturity_plan.json'
          maturity_manifest_path = rdir / 'evidence_maturity_plan_manifest.json'
          fit_path = rdir / 'model_fit_preregistration.json'
          fit_manifest_path = rdir / 'model_fit_preregistration_manifest.json'
          fitter_path = rdir / 'fit_package_adjustment_nextgen_v2.py'

          def read(p):
              return json.loads(p.read_text(encoding='utf-8'))
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          def canonical(obj):
              raw = json.dumps(obj, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
              return hashlib.sha256(raw).hexdigest()

          catalog = read(cat_path)
          freeze = read(freeze_path)
          maturity = read(maturity_path)
          maturity_manifest = read(maturity_manifest_path)
          fit = read(fit_path)
          fit_manifest = read(fit_manifest_path)

          payload_sha = 'fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab'
          catalog_sha = '953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5'
          maturity_sha = '52a032e85f9b7989fd48fb2ae927b8af79e3a1a3cd221a3da08d0ac9381c519e'
          fit_config_sha = '4b8793c8de50d45c2d5ac6423013ee34d127982fc0492e933f5dc6a6ef6aaf98'
          fitter_sha = 'b9a74dded87189971703f8b2a63626b3778ceabd0ed6ea258855cc2e071a36f2'
          prod_sha = '9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7'

          assert catalog['status'] == 'frozen_package_adjustment_nextgen_v2'
          assert catalog['frozen'] is True
          assert catalog['production_formula_enabled'] is False
          assert catalog['automatic_production_change_allowed'] is False
          assert len(catalog['challenges']) == 129
          assert canonical(catalog['challenges']) == payload_sha
          assert sha(cat_path) == catalog_sha
          assert catalog['freeze']['canonical_challenge_payload_sha256'] == payload_sha
          assert catalog['freeze']['catalog_released_to_voters'] is False
          assert catalog['freeze']['voting_activated'] is False

          assert freeze['status'] == 'frozen_package_adjustment_nextgen_v2_catalog'
          assert freeze['frozen'] is True
          assert freeze['released_to_voters'] is False
          assert freeze['voting_activated'] is False
          assert freeze['production_change_authorized'] is False
          assert freeze['canonical_challenge_payload_sha256'] == payload_sha
          assert freeze['catalog']['sha256'] == catalog_sha

          assert maturity['status'] == 'preregistered_before_nextgen_voting'
          assert maturity['voting_activated'] is False
          assert maturity['production_change_authorized'] is False
          assert sha(maturity_path) == maturity_sha
          gate = maturity['primary_maturity_checkpoint']
          assert gate['minimum_distinct_voters'] == 40
          assert gate['minimum_distinct_voters_per_each_of_24_cells'] == 10
          assert gate['minimum_valid_effective_votes'] == 800
          assert gate['minimum_valid_effective_votes_per_each_of_24_cells'] == 15
          assert maturity['stopping_rule']['hard_collection_cap_valid_effective_votes'] == 1200
          assert maturity['voter_protections']['daily_valid_nextgen_vote_cap'] == 20
          assert maturity['voter_protections']['primary_evidence_effective_lifetime_cap'] == 20
          assert maturity_manifest['status'] == 'committed_evidence_maturity_plan'
          assert maturity_manifest['plan_json']['sha256'] == maturity_sha

          assert fit['status'] == 'frozen_model_fit_preregistration'
          assert fit['frozen'] is True
          assert fit['voting_activated'] is False
          assert fit['production_change_authorized'] is False
          assert sha(fit_path) == fit_config_sha
          assert sha(fitter_path) == fitter_sha
          assert fit['anchors']['canonical_challenge_payload_sha256'] == payload_sha
          assert fit['anchors']['frozen_catalog_sha256'] == catalog_sha
          assert fit['anchors']['maturity_plan_sha256'] == maturity_sha
          assert fit['anchors']['production_exact_live_formula_sha256'] == prod_sha
          assert fit_manifest['status'] == 'frozen_model_fit_preregistration_manifest'
          assert fit_manifest['frozen'] is True
          assert fit_manifest['next_required_step'] == 'separate_human_reviewed_nextgen_voting_activation'
          assert fit_manifest['artifacts']['config']['sha256'] == fit_config_sha
          assert fit_manifest['artifacts']['fitter']['sha256'] == fitter_sha

          # Exact experimental topology required by the frozen maturity plan.
          cells = {(c['family'], c['cell_id'], c['scale_label'], c['split']) for c in catalog['challenges']}
          assert len(cells) == 24
          assert sum(c[3] == 'train' for c in cells) == 13
          assert sum(c[3] == 'structural_scale_holdout' for c in cells) == 5
          assert sum(c[3] == 'structural_topology_holdout' for c in cells) == 6
          assert all(c.get('values_hidden_from_voter') is True for c in catalog['challenges'])

          print('PASS: catalog, maturity plan, and model-fit preregistration are frozen and mutually anchored.')
          print('Canonical challenge payload SHA256:', payload_sha)
          PY

      - name: Verify production before activation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Patch browser voting slot and KTC transport isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          ktc_path = Path('scripts/market/ktc_pipeline.py')
          reg_path = Path('scripts/validation/repo_regression_checks.py')

          # Construct the reserved namespace without embedding its complete
          # transport literals in this workflow source.
          vote_prefix = '__pkg' + 'nv2__|'
          meta_prefix = '__pkg' + 'nv2_meta__|'
          schema_marker = '__pkg' + 'nv2_schema__|1'
          payload_sha = 'fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab'

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, found {text.count(old)}')
              return text.replace(old, new, 1)

          text = index_path.read_text(encoding='utf-8')
          old_header = """/* Package Preference Voting V5: two-player composition expansion; shared transport only. */
          const PACKAGE_VOTE_CHALLENGES_URL = 'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/main/research/package-adjustment-v5/package_vote_challenges_v5.json';
          const PACKAGE_VOTE_DAILY_LIMIT = 20;
          const PACKAGE_VOTE_RECENT_MEMORY = 20;
          let PACKAGE_VOTE_CHALLENGES = null;
          let PACKAGE_VOTE_STATUS = 'idle';
          let packageVoteCurrent = null;
          """
          new_header = """/* Package Adjustment NextGen V2: frozen multi-v-multi research catalog.
          Research-only data collection. Production Package Adjustment is unchanged. */
          const PACKAGE_VOTE_CHALLENGES_URL = 'https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/main/research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json';
          const PACKAGE_VOTE_DAILY_LIMIT = 20;
          const PACKAGE_VOTE_RECENT_MEMORY = 20;
          const PACKAGE_VOTE_FAMILY_WEIGHTS = Object.freeze({
          core_concentration_2v2: 0.625,
          fragmentation_filler: 0.125,
          structural_topology_3v3: 0.25,
          });
          let PACKAGE_VOTE_CHALLENGES = null;
          let PACKAGE_VOTE_STATUS = 'idle';
          let packageVoteCurrent = null;
          """
          text = replace_once(text, old_header, new_header, 'package header')

          start = text.find('function packageVoteTodayKey(){')
          end = text.find('\nfunction render(){', start)
          if start < 0 or end < 0:
              raise RuntimeError('package voting function block anchors changed')

          block = r'''function packageVoteTodayKey(){
          return 'package_votes_nextgen_v2_' + new Date().toISOString().slice(0,10);
          }

          function packageVotesToday(){
          return parseInt(localStorage.getItem(packageVoteTodayKey()) || '0', 10);
          }

          function packageVoteRecent(){
          try { return JSON.parse(localStorage.getItem('package_vote_recent_nextgen_v2') || '[]'); }
          catch(e){ return []; }
          }

          function packageVoteRemember(id){
          const recent = packageVoteRecent().concat([id]).slice(-PACKAGE_VOTE_RECENT_MEMORY);
          localStorage.setItem('package_vote_recent_nextgen_v2', JSON.stringify(recent));
          }

          function packageVoteOwnPlayers(){
          if(!(state.teamConfirmed && MY_ROSTER_ID)) return new Set();
          const team = LEAGUE_ROSTERS[MY_ROSTER_ID];
          return new Set((team && team.players || []).map(p => p.key));
          }

          function packageVoteEligibleChallenges(){
          if(!PACKAGE_VOTE_CHALLENGES) return [];
          const own = packageVoteOwnPlayers();
          const recent = new Set(packageVoteRecent());
          return PACKAGE_VOTE_CHALLENGES.filter(c => {
          if(recent.has(c.id)) return false;
          const assets = (c.side_a && c.side_a.assets || []).concat(c.side_b && c.side_b.assets || []);
          const keys = assets.map(p => p.key);
          return keys.length > 0 && !keys.some(k => own.has(k));
          });
          }

          function packageVoteWeightedFamily(families){
          let total = 0;
          for(const family of families) total += Number(PACKAGE_VOTE_FAMILY_WEIGHTS[family] || 0);
          if(total <= 0) return null;
          let draw = Math.random() * total;
          for(const family of families){
          draw -= Number(PACKAGE_VOTE_FAMILY_WEIGHTS[family] || 0);
          if(draw <= 0) return family;
          }
          return families[families.length - 1] || null;
          }

          function packageVoteSelectChallenge(){
          let pool = packageVoteEligibleChallenges();
          if(!pool.length && PACKAGE_VOTE_CHALLENGES){
          localStorage.removeItem('package_vote_recent_nextgen_v2');
          pool = packageVoteEligibleChallenges();
          }
          if(!pool.length) return null;

          /* Frozen preregistered sampling order:
          family -> cell uniform within family -> challenge uniform within cell
          -> randomized displayed left side. Family weights make each of the 24
          experimental cells equiprobable when all cells are eligible. If the
          self-interest filter removes every challenge from a cell/family for a
          specific voter, weights are renormalized only across currently feasible
          families/cells; no vote outcome ever affects sampling. */
          const byFamily = new Map();
          for(const c of pool){
          if(!Object.prototype.hasOwnProperty.call(PACKAGE_VOTE_FAMILY_WEIGHTS, c.family)) continue;
          if(!byFamily.has(c.family)) byFamily.set(c.family, []);
          byFamily.get(c.family).push(c);
          }
          const families = Array.from(byFamily.keys());
          const family = packageVoteWeightedFamily(families);
          if(!family) return null;

          const familyPool = byFamily.get(family);
          const byCell = new Map();
          for(const c of familyPool){
          const cellKey = `${c.cell_id}|${c.scale_label}`;
          if(!byCell.has(cellKey)) byCell.set(cellKey, []);
          byCell.get(cellKey).push(c);
          }
          const cells = Array.from(byCell.keys());
          if(!cells.length) return null;
          const cellKey = cells[Math.floor(Math.random() * cells.length)];
          const cell = byCell.get(cellKey);
          const challenge = cell[Math.floor(Math.random() * cell.length)];
          return { challenge, left: Math.random() < 0.5 ? 'A' : 'B' };
          }

          function packageVoteEnsureLoaded(){
          if(PACKAGE_VOTE_STATUS === 'loading' || PACKAGE_VOTE_STATUS === 'ready') return;
          PACKAGE_VOTE_STATUS = 'loading';
          fetch(PACKAGE_VOTE_CHALLENGES_URL)
          .then(r => {
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
          })
          .then(doc => {
          if(
          doc.schema_version !== 1 ||
          doc.status !== 'frozen_package_adjustment_nextgen_v2' ||
          doc.frozen !== true ||
          doc.production_formula_enabled !== false ||
          !doc.freeze ||
          doc.freeze.canonical_challenge_payload_sha256 !== '%%PAYLOAD_SHA%%' ||
          doc.freeze.challenge_count !== 129 ||
          !Array.isArray(doc.challenges) ||
          doc.challenges.length !== 129 ||
          !doc.challenges.every(c => c.values_hidden_from_voter === true)
          ){
          throw new Error('unexpected NextGen V2 frozen challenge catalog');
          }
          PACKAGE_VOTE_CHALLENGES = doc.challenges;
          PACKAGE_VOTE_STATUS = 'ready';
          packageVoteCurrent = null;
          renderPackageVote();
          })
          .catch(err => {
          console.warn('Package Adjustment NextGen V2 load failed:', err);
          PACKAGE_VOTE_CHALLENGES = null;
          PACKAGE_VOTE_STATUS = 'failed';
          renderPackageVote();
          });
          }

          function packageVoteAssetCard(p){
          const age = (typeof p.age === 'number') ? ` &middot; ${p.age} y.o.` : '';
          const team = p.team ? ` &middot; ${ktcTeamLabel(p.team)}` : '';
          return `<div class="need-cell" style="text-align:left;padding:10px;">
          <div style="font-weight:600;font-size:14px;">${escapeHtml(p.name)}</div>
          <div style="color:var(--text-dim);font-size:11px;">${escapeHtml(p.pos)}${team}${age}</div>
          </div>`;
          }

          function packageVoteSubmit(displaySide){
          if(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;

          const left = packageVoteCurrent.left;
          const choice = displaySide === 'L' ? left : (left === 'A' ? 'B' : 'A');
          const id = packageVoteCurrent.challenge.id;
          const voter = ktcCurrentVoterId();
          if(!voter) return;

          fetch(KTC_SUBMIT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
          voterRosterId: voter,
          keep: `%%VOTE_PREFIX%%${id}|${choice}`,
          trade: `%%META_PREFIX%%${left}`,
          cut: '%%SCHEMA_MARKER%%',
          }),
          }).catch(() => {});

          localStorage.setItem(packageVoteTodayKey(), String(packageVotesToday() + 1));
          packageVoteRemember(id);
          packageVoteCurrent = packageVoteSelectChallenge();
          renderPackageVote();
          }

          function renderPackageVote(){
          const el = document.getElementById('packageVoteWrap');
          if(!el) return;

          if(!(state.teamConfirmed && MY_ROSTER_ID) && !ktcIsGuestMode()){
          el.innerHTML = `
          <div class="vote-access-card">
          <div class="vote-access-copy">
          <div class="vote-access-title">Ready to compare trades?</div>
          <div class="vote-access-sub">League members: choose your team above so challenges avoid your roster. Everyone else can vote as a guest.</div>
          </div>
          <button type="button" class="vote-guest-btn" onclick="ktcStartGuestMode()">Vote as a guest</button>
          </div>
          `;
          return;
          }

          if(packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          You've completed today's ${PACKAGE_VOTE_DAILY_LIMIT} package research votes. Thank you.
          </div>`;
          return;
          }

          if(PACKAGE_VOTE_STATUS === 'idle'){
          packageVoteEnsureLoaded();
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen package comparisons...</div>`;
          return;
          }
          if(PACKAGE_VOTE_STATUS === 'loading'){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen package comparisons...</div>`;
          return;
          }
          if(PACKAGE_VOTE_STATUS === 'failed'){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Package research is temporarily unavailable. Normal KTC voting is unaffected.</div>`;
          return;
          }

          if(!packageVoteCurrent) packageVoteCurrent = packageVoteSelectChallenge();
          if(!packageVoteCurrent){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">No eligible package comparison is available right now.</div>`;
          return;
          }

          const c = packageVoteCurrent.challenge;
          const sideAHTML = c.side_a.assets.map(packageVoteAssetCard).join('');
          const sideBHTML = c.side_b.assets.map(packageVoteAssetCard).join('');
          const leftIsA = packageVoteCurrent.left === 'A';
          const leftHTML = leftIsA ? sideAHTML : sideBHTML;
          const rightHTML = leftIsA ? sideBHTML : sideAHTML;

          el.innerHTML = `
          <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--text-dim);">
          <b style="color:var(--text);">Research question:</b> Which side would you rather have in a dynasty trade?
          Values are intentionally hidden. Vote on the assets themselves.
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;">
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);margin-bottom:5px;text-align:center;">SIDE A</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${leftHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('L')">Choose Side A</button>
          </div>
          <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--violet);margin-bottom:5px;text-align:center;">SIDE B</div>
          <div style="display:flex;flex-direction:column;gap:6px;">${rightHTML}</div>
          <button class="tab-btn" style="width:100%;margin-top:8px;" onclick="packageVoteSubmit('R')">Choose Side B</button>
          </div>
          </div>
          <div style="color:var(--text-dim);font-size:10px;margin-top:8px;text-align:center;">
          ${packageVotesToday()} / ${PACKAGE_VOTE_DAILY_LIMIT} package votes today &middot; display sides randomized
          </div>
          `;
          }
          '''
          block = (block
                   .replace('%%PAYLOAD_SHA%%', payload_sha)
                   .replace('%%VOTE_PREFIX%%', vote_prefix)
                   .replace('%%META_PREFIX%%', meta_prefix)
                   .replace('%%SCHEMA_MARKER%%', schema_marker))
          text = text[:start] + block + text[end:]
          index_path.write_text(text, encoding='utf-8')

          # Normal KTC aggregation must exclude the new reserved row family
          # before the first NextGen ballot can be written.
          ktc = ktc_path.read_text(encoding='utf-8')
          old_comment = '# Package Preference Voting V1/V2/V3/V4/V5 shares transport only. Remove all\n# reserved row families before normal KTC daily-cap and Bradley-Terry work.'
          new_comment = '# Package Preference Voting V1-V5 plus NextGen V2 share transport only. Remove all\n# reserved row families before normal KTC daily-cap and Bradley-Terry work.'
          ktc = replace_once(ktc, old_comment, new_comment, 'ktc isolation comment')
          old_tuple = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|", "__pkgv4__|", "__pkgv5__|")'
          new_tuple = old_tuple[:-1] + f', "{vote_prefix}")'
          ktc = replace_once(ktc, old_tuple, new_tuple, 'ktc reserved prefix tuple')
          ktc_path.write_text(ktc, encoding='utf-8')

          # Extend the permanent regression expectation at the same time.
          reg = reg_path.read_text(encoding='utf-8')
          old_expected = '''    expected_package_prefixes = (\n        "__pkgv1__|",\n        "__pkgv2__|",\n        "__pkgv3__|",\n        "__pkgv4__|",\n        "__pkgv5__|",\n    )'''
          new_expected = old_expected[:-5] + f'        "{vote_prefix}",\n    )'
          reg = replace_once(reg, old_expected, new_expected, 'permanent transport regression tuple')
          reg_path.write_text(reg, encoding='utf-8')

          print('PASS: browser NextGen slot, KTC isolation, and regression guard patched.')
          PY

      - name: Validate patched browser sampling and transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import re
          from collections import Counter
          from pathlib import Path

          vote_prefix = '__pkg' + 'nv2__|'
          meta_prefix = '__pkg' + 'nv2_meta__|'
          schema_marker = '__pkg' + 'nv2_schema__|1'
          payload_sha = 'fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab'

          index = Path('index.html').read_text(encoding='utf-8')
          catalog = json.loads(Path('research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json').read_text(encoding='utf-8'))

          assert 'package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json' in index
          assert "package_votes_nextgen_v2_" in index
          assert "package_vote_recent_nextgen_v2" in index
          assert vote_prefix + '${id}|${choice}' in index
          assert meta_prefix + '${left}' in index
          assert schema_marker in index
          assert payload_sha in index
          assert "left: Math.random() < 0.5 ? 'A' : 'B'" in index
          assert "c.side_a.assets.map(packageVoteAssetCard)" in index
          assert "c.side_b.assets.map(packageVoteAssetCard)" in index
          assert "core_concentration_2v2: 0.625" in index
          assert "fragmentation_filler: 0.125" in index
          assert "structural_topology_3v3: 0.25" in index

          # The active package block must no longer be wired to the V5 target/package schema.
          start = index.index('function packageVoteTodayKey(){')
          end = index.index('\nfunction render(){', start)
          active = index[start:end]
          assert 'c.target.key' not in active
          assert 'c.package.map' not in active
          assert "'T' : 'P'" not in active

          # Verify the frozen family/cell topology exactly matches the weight schedule.
          cells = Counter((c['family'], c['cell_id'], c['scale_label']) for c in catalog['challenges'])
          family_cells = Counter(f for f, _, _ in cells)
          assert family_cells == Counter({
              'core_concentration_2v2': 15,
              'fragmentation_filler': 3,
              'structural_topology_3v3': 6,
          })
          weights = {
              'core_concentration_2v2': 0.625,
              'fragmentation_filler': 0.125,
              'structural_topology_3v3': 0.25,
          }
          for family, n_cells in family_cells.items():
              assert abs(weights[family] / n_cells - (1 / 24)) < 1e-15

          # Confirm KTC's permanent filter and regression expectation contain the same tuple.
          def assigned_tuple(path, name):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == name:
                              return ast.literal_eval(node.value)
              raise RuntimeError(f'{name} not found in {path}')

