name: Package Adjustment NextGen V2 Activate Voting

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frozen research dependencies
        run: |
          python3 -m pip install \
            requests==2.34.2 \
            numpy==2.5.3 \
            scipy==1.18.1

      - name: Guard exact frozen preregistration boundary
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          test -z "$(git status --porcelain=v1)"

          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/challenge_catalog_design.md")" = "2ff9ab79043d9bf91f825575fe404c0ccc0ea11e"
          test "$(git hash-object "$D/generate_package_vote_challenges_nextgen_v2.py")" = "8d4746d00b57187a74b8add75ff7b72fc5a9342d"
          test "$(git hash-object "$D/package_adjustment_nextgen_v2_research_spec.md")" = "6dca31266a0e22a750f0a15f6aaf87a6648fb77a"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"

          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan.md")" = "c5450716854e26049efd89102fc9ac5e01b06aa7"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"

          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration.md")" = "5baf27297cf38f90cbf71b0bd26d7c17fd5a542a"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"

          test "$(sha256sum "$D/fit_package_adjustment_nextgen_v2.py" | awk '{print $1}')" = "b9a74dded87189971703f8b2a63626b3778ceabd0ed6ea258855cc2e071a36f2"
          test "$(sha256sum "$D/model_fit_preregistration.json" | awk '{print $1}')" = "4b8793c8de50d45c2d5ac6423013ee34d127982fc0492e933f5dc6a6ef6aaf98"
          test "$(sha256sum "$D/model_fit_preregistration.md" | awk '{print $1}')" = "158b4b8d42107e6ad00a3014c8303aef6b3696e751c2c3307fac6dd396e5be50"
          test "$(sha256sum "$D/model_fit_preregistration_manifest.json" | awk '{print $1}')" = "d6a296dccb04b37f78e8eb186f3ab610fb605ae85464176273e32b9cdcda4333"

          test "$(git hash-object index.html)" = "c08bdfbb90158be9c13d83b7b7c128183f2d9c08"
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = "a531c7a89aee379cdf19c7360f356951a5d7f3d0"

          test ! -e scripts/market/package_vote_nextgen_v2_pipeline.py
          test ! -e "$D/voting_activation.json"
          test ! -e "$D/voting_activation.md"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PASS: exact catalog + maturity + model-fit preregistration boundary confirmed."

      - name: Verify production before voting activation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Create NextGen transport pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          payload = """"""
          path = Path("scripts/market/package_vote_nextgen_v2_pipeline.py")
          path.write_bytes(base64.b64decode(payload))
          path.chmod(0o755)
          print("Wrote:", path)
          PY
          python3 -m py_compile scripts/market/package_vote_nextgen_v2_pipeline.py

      - name: Activate browser sampling and transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          index_path = Path("index.html")
          ktc_path = Path("scripts/market/ktc_pipeline.py")
          text = index_path.read_text(encoding="utf-8")

          prefix = "__" + "pkgnv2" + "__|"
          meta_prefix = "__" + "pkgnv2" + "_meta__|"
          schema_marker = "__" + "pkgnv2" + "_schema__|" + "1"

          old_url = (
              "https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/"
              "main/research/package-adjustment-v5/package_vote_challenges_v5.json"
          )
          new_url = (
              "https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/"
              "main/research/package-adjustment-nextgen-v2/"
              "package_vote_challenges_nextgen_v2.json"
          )
          assert text.count(old_url) == 1
          text = text.replace(old_url, new_url, 1)

          old_comment = "/* Package Preference Voting V5: two-player composition expansion; shared transport only. */"
          assert text.count(old_comment) == 1
          text = text.replace(
              old_comment,
              "/* Package Adjustment NextGen V2: frozen research catalog; production remains unchanged. */",
              1,
          )

          old_guard = textwrap.dedent("""\
                  doc.schema_version !== 5 ||
                  doc.status !== 'frozen_package_preference_v5' ||
                  doc.frozen !== true ||
                  !Array.isArray(doc.challenges) ||
                  doc.challenges.length < 250
          """).strip()
          new_guard = textwrap.dedent("""\
                  doc.status !== 'frozen_package_adjustment_nextgen_v2' ||
                  doc.frozen !== true ||
                  !Array.isArray(doc.challenges) ||
                  doc.challenges.length !== 129 ||
                  doc.challenges.some(c => c.values_hidden_from_voter !== true)
          """).strip()
          assert text.count(old_guard) == 1
          text = text.replace(old_guard, new_guard, 1)

          assert text.count("console.warn('Package Preference V5 load failed:', err);") == 1
          text = text.replace(
              "console.warn('Package Preference V5 load failed:', err);",
              "console.warn('Package Adjustment NextGen V2 load failed:', err);",
              1,
          )

          assert text.count("'package_votes_v5_'") == 1
          text = text.replace("'package_votes_v5_'", "'package_votes_nextgen_v2_'", 1)
          assert text.count("'package_vote_recent_v5'") >= 2
          text = text.replace("'package_vote_recent_v5'", "'package_vote_recent_nextgen_v2'")

          pattern = re.compile(
              r"function packageVoteOwnPlayers\(\)\{.*?\n\}\n\n"
              r"function packageVoteEligibleChallenges\(\)\{.*?\n\}\n\n"
              r"function packageVoteSelectChallenge\(\)\{.*?\n\}\n\n"
              r"(?=function packageVoteAssetCard)",
              re.S,
          )
          replacement = """/* PACKAGE_VOTE_NEXTGEN_V2_SAMPLING_V1
             Frozen schedule: family -> cell -> challenge -> 50/50 display side.
             No voter-roster eligibility filtering is permitted. */
          function packageVoteSelectChallenge(){
            if(!PACKAGE_VOTE_CHALLENGES || !PACKAGE_VOTE_CHALLENGES.length) return null;

            const familyDraw = Math.random();
            const family = familyDraw < 0.625
              ? 'core_concentration_2v2'
              : (familyDraw < 0.75 ? 'fragmentation_filler' : 'structural_topology_3v3');

            const familyPool = PACKAGE_VOTE_CHALLENGES.filter(c => c && c.family === family);
            if(!familyPool.length) return null;

            const byCell = new Map();
            for(const c of familyPool){
              const key = `${c.family}|${c.cell_id}|${c.scale_label}|${c.split}`;
              if(!byCell.has(key)) byCell.set(key, []);
              byCell.get(key).push(c);
            }

            const cellKeys = Array.from(byCell.keys()).sort();
            if(!cellKeys.length) return null;
            const selectedCell = cellKeys[Math.floor(Math.random() * cellKeys.length)];
            const cellPool = byCell.get(selectedCell);

            const recent = new Set(packageVoteRecent());
            let challengePool = cellPool.filter(c => !recent.has(c.id));
            if(!challengePool.length) challengePool = cellPool;

            const challenge = challengePool[Math.floor(Math.random() * challengePool.length)];
            return {
              challenge,
              left: Math.random() < 0.5 ? 'A' : 'B',
            };
          }

          """
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, "failed to replace V5 selection region"

          submit_pattern = re.compile(
              r"function packageVoteSubmit\(displaySide\)\{.*?\n\}\n\n"
              r"(?=function renderPackageVote\(\))",
              re.S,
          )
          submit = f"""function packageVoteSubmit(displaySide){{
            if(!packageVoteCurrent || packageVotesToday() >= PACKAGE_VOTE_DAILY_LIMIT) return;

            const left = packageVoteCurrent.left;
            const choice = displaySide === 'L' ? left : (left === 'A' ? 'B' : 'A');
            const id = packageVoteCurrent.challenge.id;
            const voter = ktcCurrentVoterId();
            if(!voter) return;

            fetch(KTC_SUBMIT_URL, {{
              method: 'POST',
              headers: {{ 'Content-Type': 'text/plain;charset=utf-8' }},
              body: JSON.stringify({{
                voterRosterId: voter,
                keep: `{prefix}${{id}}|${{choice}}`,
                trade: `{meta_prefix}${{left}}`,
                cut: '{schema_marker}',
              }}),
            }}).catch(() => {{}});

            localStorage.setItem(packageVoteTodayKey(), String(packageVotesToday() + 1));
            packageVoteRemember(id);
            packageVoteCurrent = packageVoteSelectChallenge();
            renderPackageVote();
          }}

          """
          text, count = submit_pattern.subn(submit, text, count=1)
          assert count == 1, "failed to replace V5 submit function"

          old_render = textwrap.dedent("""\
            const c = packageVoteCurrent.challenge;
            const targetHTML = packageVoteAssetCard(c.target);
            const packageHTML = c.package.map(packageVoteAssetCard).join('');
            const leftIsTarget = packageVoteCurrent.left === 'T';
            const leftHTML = leftIsTarget ? targetHTML : packageHTML;
            const rightHTML = leftIsTarget ? packageHTML : targetHTML;
          """).strip()
          new_render = textwrap.dedent("""\
            const c = packageVoteCurrent.challenge;
            const sideAHTML = c.side_a.assets.map(packageVoteAssetCard).join('');
            const sideBHTML = c.side_b.assets.map(packageVoteAssetCard).join('');
            const leftIsA = packageVoteCurrent.left === 'A';
            const leftHTML = leftIsA ? sideAHTML : sideBHTML;
            const rightHTML = leftIsA ? sideBHTML : sideAHTML;
          """).strip()
          assert text.count(old_render) == 1
          text = text.replace(old_render, new_render, 1)

          assert "PACKAGE_VOTE_NEXTGEN_V2_SAMPLING_V1" in text
          assert "function packageVoteOwnPlayers()" not in text
          assert "function packageVoteEligibleChallenges()" not in text
          assert "package_vote_recent_v5" not in text
          assert "package_votes_v5_" not in text
          assert old_url not in text
          assert prefix in text and meta_prefix in text and schema_marker in text

          index_path.write_text(text, encoding="utf-8")

          ktc = ktc_path.read_text(encoding="utf-8")
          old_fn = textwrap.dedent("""\
          def is_package_vote_row(row):
              keep = str(row.get("keep") or "")
              return any(keep.startswith(prefix) for prefix in PACKAGE_VOTE_PREFIXES)
          """)
          assert ktc.count(old_fn) == 1
          replacement_fn = f"""NEXTGEN_PACKAGE_VOTE_PREFIX = "{prefix}"

          def is_package_vote_row(row):
              keep = str(row.get("keep") or "")
              return (
                  any(keep.startswith(prefix) for prefix in PACKAGE_VOTE_PREFIXES)
                  or keep.startswith(NEXTGEN_PACKAGE_VOTE_PREFIX)
              )
          """
          replacement_fn = textwrap.dedent(replacement_fn)
          ktc = ktc.replace(old_fn, replacement_fn, 1)
          ktc_path.write_text(ktc, encoding="utf-8")

          print("PASS: browser slot switched to frozen NextGen V2.")
          print("PASS: family/cell sampling is independent of voter roster.")
          print("PASS: normal KTC transport isolation extended without changing historical V1-V5 tuple.")
          PY

      - name: Create immutable voting activation record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import textwrap
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          activation_json = d / "voting_activation.json"
          activation_md = d / "voting_activation.md"

          prefix = "__" + "pkgnv2" + "__|"
          meta_prefix = "__" + "pkgnv2" + "_meta__|"
          schema_marker = "__" + "pkgnv2" + "_schema__|" + "1"
          released = datetime.now(timezone.utc).isoformat()

          doc = {
              "schema_version": 1,
              "status": "active_research_nextgen_v2_voting",
              "release_id": "package-adjustment-nextgen-v2-voting-v1",
              "released_at_utc": released,
              "research_only": True,
              "voting_activated": True,
              "production_change_authorized": False,
              "automatic_production_change_allowed": False,
              "browser_research_slot": {
                  "previous_study": "package-adjustment-v5",
                  "active_study": "package-adjustment-nextgen-v2",
              },
              "anchors": {
                  "production_revision": "v1.6-v5-size2-composition-overlay",
                  "production_exact_live_formula_sha256": "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7",
                  "canonical_challenge_payload_sha256": "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab",
                  "frozen_catalog_sha256": "953d06fb4f7b870a981dedcb80d1bde0a609212cd03d506ce9746e9197d9f9b5",
                  "maturity_plan_sha256": "52a032e85f9b7989fd48fb2ae927b8af79e3a1a3cd221a3da08d0ac9381c519e",
                  "maturity_plan_manifest_sha256": "c63467e38d9d21b2ac0b2d7b99a2fde845840a451f1f0d7e5727e13aaefb971c",
                  "model_fit_fitter_sha256": "b9a74dded87189971703f8b2a63626b3778ceabd0ed6ea258855cc2e071a36f2",
                  "model_fit_config_sha256": "4b8793c8de50d45c2d5ac6423013ee34d127982fc0492e933f5dc6a6ef6aaf98",
                  "model_fit_methodology_sha256": "158b4b8d42107e6ad00a3014c8303aef6b3696e751c2c3307fac6dd396e5be50",
                  "model_fit_manifest_sha256": "d6a296dccb04b37f78e8eb186f3ab610fb605ae85464176273e32b9cdcda4333",
              },
              "sampling": {
                  "schedule_id": "equal_cell_via_family_weights_v1",
                  "family_probabilities": {
                      "core_concentration_2v2": 0.625,
                      "fragmentation_filler": 0.125,
                      "structural_topology_3v3": 0.25,
                  },
                  "cell_selection": "uniform_within_selected_family",
                  "challenge_selection": "uniform_within_selected_cell_with_recent_memory_only_as_within_cell_preference",
                  "display_side_probability": {"A_left": 0.5, "B_left": 0.5},
                  "voter_roster_filtering_allowed": False,
                  "fv_visible_to_voter": False,
              },
              "transport": {
                  "keep_prefix": prefix,
                  "trade_metadata_prefix": meta_prefix,
                  "schema_marker": schema_marker,
                  "choice_values": ["A", "B"],
                  "display_left_values": ["A", "B"],
                  "normal_ktc_pipeline_isolated": True,
              },
              "voter_protections": {
                  "client_soft_daily_limit": 20,
                  "analysis_daily_valid_cap": 20,
                  "analysis_effective_lifetime_cap": 20,
              },
              "runtime_dependencies_for_frozen_fitter": {
                  "python": "3.13",
                  "numpy": "2.5.3",
                  "scipy": "1.18.1",
              },
              "next_step": "install_and_run_separate_nextgen_v2_vote_aggregation_workflow",
          }
          activation_json.write_text(
              json.dumps(doc, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = f"""
          # Package Adjustment NextGen V2 — Voting Activation

          **Status: ACTIVE RESEARCH. PRODUCTION V1.6 IS UNCHANGED.**

          - Released: `{released}`
          - Frozen challenges: **129**
          - Experimental cells: **24**
          - Browser research slot now serves the frozen NextGen V2 catalog.
          - Family probabilities are fixed at 62.5% core, 12.5% fragmentation, and 25% topology.
          - Cell is sampled uniformly inside the selected family, giving every frozen cell probability **1/24**.
          - Challenge is sampled inside the already-selected cell.
          - Recent-history avoidance may choose among challenges only inside that cell; it may not change family or cell selection.
          - No voter-specific roster filtering is allowed.
          - Display side is randomized 50/50.
          - FV and research-cell metadata remain hidden from voters.
          - Daily valid analysis cap is **20** and primary effective lifetime cap is **20**.
          - Frozen catalog, maturity plan, and model-fit preregistration remain byte-identical.
          - M3 remains inactive and M4-M6 remain outside first-wave model selection.
          - No Fundamental Value, Market Value, Team Utility, draft-pick value, or live Package Adjustment formula is changed.
          - No automatic production promotion is allowed.
          """
          activation_md.write_text(
              textwrap.dedent(md).strip() + "\n",
              encoding="utf-8",
          )

          print("Activation release:", released)
          print("Activation JSON SHA-256:", hashlib.sha256(activation_json.read_bytes()).hexdigest())
          print("Activation Markdown SHA-256:", hashlib.sha256(activation_md.read_bytes()).hexdigest())
          PY

      - name: Validate activation and transport contract
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/market/package_vote_nextgen_v2_pipeline.py \
            --selftest

          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py \
            --selftest

          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          cat = json.loads((d / "package_vote_challenges_nextgen_v2.json").read_text())
          act = json.loads((d / "voting_activation.json").read_text())

          assert act["status"] == "active_research_nextgen_v2_voting"
          assert act["voting_activated"] is True
          assert act["production_change_authorized"] is False
          assert act["automatic_production_change_allowed"] is False
          assert act["anchors"]["canonical_challenge_payload_sha256"] == (
              "fa52f72f6f4bdeaf1a5a935bde0fb5d0ec0fc85cc2b0d58236c2101d47d4f5ab"
          )

          challenges = cat["challenges"]
          assert len(challenges) == 129
          assert all(c["values_hidden_from_voter"] is True for c in challenges)

          cells_by_family = {
              "core_concentration_2v2": set(),
              "fragmentation_filler": set(),
              "structural_topology_3v3": set(),
          }
          for c in challenges:
              key = (c["cell_id"], c["scale_label"], c["split"])
              cells_by_family[c["family"]].add(key)

          counts = {family: len(cells) for family, cells in cells_by_family.items()}
          assert counts == {
              "core_concentration_2v2": 15,
              "fragmentation_filler": 3,
              "structural_topology_3v3": 6,
          }

          probs = act["sampling"]["family_probabilities"]
          for family, n_cells in counts.items():
              assert abs(probs[family] / n_cells - 1.0 / 24.0) < 1e-15

          assert act["sampling"]["voter_roster_filtering_allowed"] is False
          assert act["sampling"]["fv_visible_to_voter"] is False

          tree = ast.parse(Path("scripts/market/ktc_pipeline.py").read_text())
          prefixes = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "PACKAGE_VOTE_PREFIXES":
                          prefixes = ast.literal_eval(node.value)
          assert prefixes == (
              "__pkgv1__|",
              "__pkgv2__|",
              "__pkgv3__|",
              "__pkgv4__|",
              "__pkgv5__|",
          )

          import sys
          sys.path.insert(0, "scripts/market")
          import ktc_pipeline
          next_prefix = "__" + "pkgnv2" + "__|"
          assert ktc_pipeline.is_package_vote_row({"keep": next_prefix + "abc|A"})
          assert ktc_pipeline.is_package_vote_row({"keep": "__pkgv5__|abc|P"})
          assert not ktc_pipeline.is_package_vote_row({"keep": "Josh Allen"})

          index = Path("index.html").read_text(encoding="utf-8")
          assert "PACKAGE_VOTE_NEXTGEN_V2_SAMPLING_V1" in index
          assert "package_vote_recent_nextgen_v2" in index
          assert "package_votes_nextgen_v2_" in index
          assert "package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json" in index
          assert "function packageVoteOwnPlayers()" not in index
          assert "function packageVoteEligibleChallenges()" not in index
          assert act["transport"]["keep_prefix"] in index
          assert act["transport"]["trade_metadata_prefix"] in index
          assert act["transport"]["schema_marker"] in index

          print("PASS: exact 1/24 cell schedule mathematically verified.")
          print("PASS: voter-specific roster filtering removed.")
          print("PASS: NextGen transport isolated from normal KTC while historical V1-V5 tuple remains unchanged.")
          PY

      - name: Verify exact activation change boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "scripts/market/ktc_pipeline.py",
              "scripts/market/package_vote_nextgen_v2_pipeline.py",
              "research/package-adjustment-nextgen-v2/voting_activation.json",
              "research/package-adjustment-nextgen-v2/voting_activation.md",
          }

          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).splitlines()
          paths = {row[3:] for row in rows if len(row) >= 4}
          assert paths == expected, (paths, expected)
          print("PASS: exactly five activation files changed.")
          PY

      - name: Protect historical research and frozen NextGen evidence
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-nextgen-v2"

          git diff --exit-code -- research/package-adjustment-v3
          git diff --exit-code -- research/package-adjustment-v4
          git diff --exit-code -- research/package-adjustment-v5
          git diff --exit-code -- research/package-adjustment-production-candidate-v1
          git diff --exit-code -- scripts/validation

          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/challenge_catalog_design.md")" = "2ff9ab79043d9bf91f825575fe404c0ccc0ea11e"
          test "$(git hash-object "$D/generate_package_vote_challenges_nextgen_v2.py")" = "8d4746d00b57187a74b8add75ff7b72fc5a9342d"
