# QF1 V2 TRADE DESK QUICK-FIX REVIEW BRANCH — self-contained one-file workflow.
# Upload THIS FILE to .github/workflows/QF1-v2.yml on the default branch.
# Actions > QF1 V2 - Trade Desk Quick Fix Review Branch > Run workflow (main).
# Reproduces 10 Claude-reviewed changes; all tests must PASS before a branch is pushed.
# This workflow NEVER pushes main, merges, deploys, triggers paid services or opens holdouts.
# Created in response to user request to use uploadable YAML workflows as usual.
name: QF1 V2 - Trade Desk Quick Fix Review Branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qf1-v2-review-branch-only
  cancel-in-progress: false

jobs:
  qf1-review-branch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_BRANCH: qf1-wave1-v2-review-2026-10-10
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out main (write token limited to this job)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python for repo regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js for deployed JS syntax
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install required regression dependency
        run: python3 -m pip install requests
      - name: Check branch and pinned deployed app source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo 'STOP: run QF1 only from main'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP: checkout not clean'; exit 1; }
          EXPECTED_INDEX_BLOB=4e42054d5d0c4845dc0b16d3fdf8cf642cbf19c8
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"
          [[ "${ACTUAL_INDEX_BLOB}" == "${EXPECTED_INDEX_BLOB}" ]] || {
            echo "STOP: index blob moved since QF1 review (${ACTUAL_INDEX_BLOB}). Re-review required."; exit 1;
          }
          if git ls-remote --exit-code --heads origin "${REVIEW_BRANCH}" >/dev/null; then
            echo "STOP: review branch ${REVIEW_BRANCH} already exists. Will not overwrite it."; exit 1;
          fi
          printf 'Safe preflight: commit %s, index blob %s, target %s\n' "$(git rev-parse HEAD)" "${ACTUAL_INDEX_BLOB}" "${REVIEW_BRANCH}"
      - name: Apply reviewed QF1 v2 source edits (Claude E1 retained)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, tempfile, hashlib

          EXPECTED_BLOB = "4e42054d5d0c4845dc0b16d3fdf8cf642cbf19c8"
          REPLACEMENTS = [{'name': 'QF1-01 incomplete trade: front-end verdict and meter',
            'old': '  const rawDisplayGrand = rawDisplayA + rawDisplayB;\n'
                   '  const pctA = rawDisplayGrand ? (rawDisplayA/rawDisplayGrand)*100 : 50;\n'
                   '  const pctB = rawDisplayGrand ? (rawDisplayB/rawDisplayGrand)*100 : 50;',
            'new': '  const rawDisplayGrand = rawDisplayA + rawDisplayB;\n'
                   '  const tradeComplete = state.A.length > 0 && state.B.length > 0;\n'
                   '  const pctA = tradeComplete && rawDisplayGrand ? (rawDisplayA/rawDisplayGrand)*100 : '
                   '0;\n'
                   '  const pctB = tradeComplete && rawDisplayGrand ? (rawDisplayB/rawDisplayGrand)*100 : '
                   '0;'},
           {'name': 'QF1-01 incomplete trade: verdict label',
            'old': "  if(grand === 0){\n    verdictEl.textContent = 'Add assets to both sides';",
            'new': '  if(!tradeComplete){\n'
                   "    verdictEl.textContent = 'Add at least one asset to each side';"},
           {'name': 'QF1-01 incomplete trade: mauling early exit',
            'old': '  const grand = totalA + totalB;\n'
                   "  if(grand === 0){ wrap.innerHTML = ''; return; }\n"
                   '\n'
                   '  const diff = totalA - totalB;',
            'new': '  const grand = totalA + totalB;\n'
                   "  if(!state.A.length || !state.B.length || grand === 0){ wrap.innerHTML = ''; return; }\n"
                   '\n'
                   '  const diff = totalA - totalB;'},
           {'name': 'QF1-01 incomplete trade: IDP sensitivity early exit',
            'old': 'function renderSensitivity(){\n'
                   "  const wrap = document.getElementById('sensitivityWrap');\n"
                   '  if(!wrap) return;\n'
                   "  const idpPositions = ['DL','LB','DB'];",
            'new': 'function renderSensitivity(){\n'
                   "  const wrap = document.getElementById('sensitivityWrap');\n"
                   '  if(!wrap) return;\n'
                   "  if(!state.A.length || !state.B.length){ wrap.innerHTML = ''; return; }\n"
                   "  const idpPositions = ['DL','LB','DB'];"},
           {'name': 'QF1-01 incomplete trade: robustness fail closed',
            'old': 'function tradeRobustnessAssessment(){\n  const centerTotals = tradeVerdictTotals();',
            'new': 'function tradeRobustnessAssessment(){\n'
                   '  if(!state.A.length || !state.B.length){\n'
                   "    return {status:'unavailable', reason:'incomplete_trade'};\n"
                   '  }\n'
                   '  const centerTotals = tradeVerdictTotals();'},
           {'name': 'QF1-02 unsupported package display specific reason',
            'old': '    const detail = packageUiEscape("This package is outside the model\'s validated '
                   'scope. The trade verdict below uses Raw FV only.");',
            'new': '    const detail = packageUiEscape(\n'
                   '      (assessment.message || "Package Adjustment is unsupported for this trade shape.") '
                   '+\n'
                   '      " The trade verdict below uses Raw FV only."\n'
                   '    );'},
           {'name': 'QF1-03 no invented Market evidence sample',
            'old': '  const pairs = Number(evidence.same_position_pairwise_observations || 0);\n'
                   '  const enough = Boolean(evidence.same_position_enough_data);\n'
                   '  const dominant = Number(evidence.dominant_voter_share_pct);\n'
                   '  const rank = Number(row.market_rank);',
            'new': '  const pairs = Number.isFinite(evidence.same_position_pairwise_observations)\n'
                   '    ? Number(evidence.same_position_pairwise_observations) : null;\n'
                   "  const enough = typeof evidence.same_position_enough_data === 'boolean'\n"
                   '    ? evidence.same_position_enough_data : null;\n'
                   '  const dominant = Number.isFinite(evidence.dominant_voter_share_pct)\n'
                   '    ? Number(evidence.dominant_voter_share_pct) : null;\n'
                   '  const rank = Number(row.market_rank);'},
           {'name': 'QF1-03 Market tooltip unknown is not 0',
            'old': "    `Direct ${row.pos || ''} pairwise observations: ${pairs}${enough ? ' (threshold "
                   "met)' : ' (below 30-pair threshold)'}`,\n"
                   "    `Dominant voter share: ${Number.isFinite(dominant) ? dominant.toFixed(1) + '%' : "
                   "'n/a'}`,",
            'new': "    `Direct ${row.pos || ''} pairwise observations: ${pairs === null ? 'not published' : "
                   "pairs}${enough === null ? ' (sufficiency not published)' : enough ? ' (threshold met)' : "
                   "' (below 30-pair threshold)'}`,\n"
                   "    `Dominant voter share: ${dominant === null ? 'not published' : dominant.toFixed(1) + "
                   "'%'}`,"},
           {'name': 'QF1-03 Market partial-quality evidence skip unknown sample',
            'old': '    if(!evidence.same_position_enough_data){\n'
                   "      const pos = row.pos || item.asset.pos || '?';\n"
                   '      lowSample[pos] = Number(evidence.same_position_pairwise_observations || 0);\n'
                   '    }',
            'new': '    if(evidence.same_position_enough_data === false &&\n'
                   '       Number.isFinite(evidence.same_position_pairwise_observations)){\n'
                   "      const pos = row.pos || item.asset.pos || '?';\n"
                   '      lowSample[pos] = Number(evidence.same_position_pairwise_observations);\n'
                   '    }'},
           {'name': 'QF1-04 rounded trade-side display matches pseudo asset',
            'old': '          <div class="side-total">${displayTotal.toLocaleString()}</div>',
            'new': '          <div class="side-total">${Math.round(displayTotal).toLocaleString()}</div>'}]
          path = Path("index.html")
          original = path.read_bytes()
          if b"\r\n" in original:
              raise SystemExit("STOP: unexpected CRLF input")
          actual_blob = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          if actual_blob != EXPECTED_BLOB:
              raise SystemExit(f"STOP: deployed index.html blob changed: {actual_blob} != {EXPECTED_BLOB}. No changes applied.")
          original_text = original.decode("utf-8")
          assert len(REPLACEMENTS) == 10
          new_text = original_text
          for i, entry in enumerate(REPLACEMENTS, start=1):
              old, new = entry["old"], entry["new"]
              count = new_text.count(old)
              if count != 1:
                  raise SystemExit(f"STOP QF1 replacement {i} ({entry['name']}): expected ONE exact old anchor, got {count}")
              new_text = new_text.replace(old, new, 1)
              print(f"  QF1 exact replacement {i}/10: {entry['name']}")
          assert "The trade verdict below uses Raw FV only." in new_text
          assert "const PICK_SEASONS = ['2027','2028']" in new_text
          assert "Math.round(displayTotal).toLocaleString()" in new_text
          assert "status:'unavailable', reason:'incomplete_trade'" in new_text
          assert "sufficiency not published" in new_text
          assert "function packageAdjustmentAssessment()" in new_text
          assert "function playerValue(" in new_text
          assert "function pickValue(" in new_text
          # Exact reverse patch must restore original bytes; important when same-substring anchors overlap.
          for entry in reversed(REPLACEMENTS):
              assert new_text.count(entry["new"]) == 1, f"New anchor is not unique: {entry['name']}"
              new_text = new_text.replace(entry["new"], entry["old"], 1)
          assert new_text.encode("utf-8") == original, "STOP: non-reversible patch; never write"
          # Replay audited modifications only after all preflight checks pass.
          new_text = original_text
          for entry in REPLACEMENTS:
              new_text = new_text.replace(entry["old"], entry["new"], 1)
          path.write_bytes(new_text.encode("utf-8"))
          changes = subprocess.check_output(["git", "diff", "--name-only"], text=True).strip().splitlines()
          assert changes == ["index.html"], f"STOP unexpected changed files: {changes}"
          assert new_text != original_text
          print("PASS: exactly 10 reversible source changes; index.html only; pinned original blob verified")
          PY
      - name: Self-contained source and JS smoke tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'The trade verdict below uses Raw FV only.' in s
          assert "if(!tradeComplete){\n    verdictEl.textContent = 'Add at least one asset to each side';" in s
          assert "if(!state.A.length || !state.B.length || grand === 0){ wrap.innerHTML = ''; return; }" in s
          assert "if(!state.A.length || !state.B.length){ wrap.innerHTML = ''; return; }" in s
          assert "return {status:'unavailable', reason:'incomplete_trade'}" in s
          assert "Math.round(displayTotal).toLocaleString()" in s
          assert "const PICK_SEASONS = ['2027','2028']" in s
          assert "`Direct ${row.pos || ''} pairwise observations: ${pairs === null ? 'not published'" in s
          assert "if(evidence.same_position_enough_data === false &&" in s
          assert "function playerValue(" in s and "function pickValue(" in s
          m=json.loads(Path('scripts/artifacts/generated/market_values.json').read_text())
          assert len(m['players']) >= 100
          assert 'josh allen' in m['players']
          assert isinstance(m['players']['josh allen']['market_value'], (int, float))
          assert isinstance(m['players']['josh allen']['fundamental_value'], (int, float))
          with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
              f.write('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)))
              temporary=f.name
          try:
              subprocess.run(['node','--check',temporary],check=True)
          finally:
              Path(temporary).unlink(missing_ok=True)
          print('PASS: QF1 UI guard smoke, current Market artifact integrity, deployed JS syntax')
          PY
      - name: Repository and IDP/FA regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          # Validation function only: the standalone script writes report artifacts, which is forbidden here.
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/validation')
          import validate_idp_v1_final_deployment as v
          result = v.validate_deployment()
          assert result['actual_changed_entry_count'] == 320
          print('PASS: IDP deployment, 320 approved changed entries (no files written)')
          PY
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
      - name: Stage review branch only after all gates are green
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only)" == "index.html" ]] || { echo 'STOP: unexpected changed files'; exit 1; }
          git diff --check
          # Do not silently build against an old main in the presence of a scheduled sync/another change.
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo 'STOP: main changed while this job ran. Re-run against the latest pinned source.'; exit 1;
          }
          if git ls-remote --exit-code --heads origin "${REVIEW_BRANCH}" >/dev/null; then
            echo 'STOP: review branch appeared during checks. Will not overwrite it.'; exit 1;
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${REVIEW_BRANCH}"
          git add -- index.html
          git diff --cached --check
          git diff --cached --name-only | grep -Fx 'index.html'
          git commit -m 'QF1 v2: reviewed low-risk UI clarity fixes (no model changes)'
          # Empty lease prohibits overwriting an already-existing remote review branch.
          git push --force-with-lease="refs/heads/${REVIEW_BRANCH}:" origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          echo "REVIEW BRANCH CREATED: ${REVIEW_BRANCH}"
          echo "REVIEW COMMIT: $(git rev-parse HEAD)"
          echo 'main was never the push target; no merge/deploy was requested.'
