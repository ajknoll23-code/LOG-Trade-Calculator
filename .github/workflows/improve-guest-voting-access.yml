name: Improve Guest Voting Access

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch guest voting UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_ktc_guest = '''      <div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Not in this league? <span style="color:var(--gold);cursor:pointer;text-decoration:underline;" onclick="ktcStartGuestMode()">Vote as a guest instead</span></div>'''

          new_ktc_guest = '''      <div style="color:var(--text-dim);font-size:13px;padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <span>Not in this league?</span>
        <button type="button" onclick="ktcStartGuestMode()" style="background:var(--panel-alt);border:1px solid var(--line-strong);color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.04em;padding:7px 10px;border-radius:6px;cursor:pointer;">Vote as a guest</button>
      </div>'''

          if text.count(old_ktc_guest) != 1:
              raise SystemExit(
                  f"Expected exactly one normal KTC guest link; found {text.count(old_ktc_guest)}"
              )
          text = text.replace(old_ktc_guest, new_ktc_guest, 1)

          old_package_gate = '''    el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
      Pick "Which team is yours?" above or enter guest mode in Keep / Trade / Cut first.
    </div>`;
    return;'''

          new_package_gate = '''    el.innerHTML = `
      <div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
        Pick "Which team is yours?" above to vote with your league identity.
      </div>
      <div style="color:var(--text-dim);font-size:13px;padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <span>Not in this league? Guest votes are welcome.</span>
        <button type="button" onclick="ktcStartGuestMode()" style="background:var(--panel-alt);border:1px solid var(--line-strong);color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.04em;padding:7px 10px;border-radius:6px;cursor:pointer;">Vote as a guest</button>
      </div>`;
    return;'''

          if text.count(old_package_gate) != 1:
              raise SystemExit(
                  f"Expected exactly one package guest gate; found {text.count(old_package_gate)}"
              )
          text = text.replace(old_package_gate, new_package_gate, 1)

          old_start = '''function ktcStartGuestMode(){
  localStorage.setItem('ktc_guest_mode', '1');
  ktcGuestId(); // ensure an ID exists right away
  renderKTC();
}'''

          new_start = '''function ktcStartGuestMode(){
  localStorage.setItem('ktc_guest_mode', '1');
  ktcGuestId(); // ensure an ID exists right away
  renderKTC();
  renderPackageVote();
}'''

          if text.count(old_start) != 1:
              raise SystemExit(
                  f"Expected exactly one ktcStartGuestMode function; found {text.count(old_start)}"
              )
          text = text.replace(old_start, new_start, 1)

          old_exit = '''function ktcExitGuestMode(){
  localStorage.removeItem('ktc_guest_mode');
  renderKTC();
}'''

          new_exit = '''function ktcExitGuestMode(){
  localStorage.removeItem('ktc_guest_mode');
  renderKTC();
  renderPackageVote();
}'''

          if text.count(old_exit) != 1:
              raise SystemExit(
                  f"Expected exactly one ktcExitGuestMode function; found {text.count(old_exit)}"
              )
          text = text.replace(old_exit, new_exit, 1)

          path.write_text(text, encoding="utf-8")
          print("Guest voting UI patched.")
          PY

      - name: Verify guest voting contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")

          assert text.count(">Vote as a guest</button>") == 2
          assert "Not in this league? Guest votes are welcome." in text
          assert 'localStorage.setItem(\'ktc_guest_mode\', \'1\')' in text
          assert "return (state.teamConfirmed && MY_ROSTER_ID) || (ktcIsGuestMode() ? ktcGuestId() : null);" in text

          start = text.index("function ktcStartGuestMode(){")
          start_chunk = text[start:start+260]
          assert "renderKTC();" in start_chunk
          assert "renderPackageVote();" in start_chunk

          exit_i = text.index("function ktcExitGuestMode(){")
          exit_chunk = text[exit_i:exit_i+220]
          assert "renderKTC();" in exit_chunk
          assert "renderPackageVote();" in exit_chunk

          # Package transport and research isolation must stay untouched.
          assert "__pkgv1__|${id}|${choice}" in text
          assert "const PACKAGE_VOTE_DAILY_LIMIT = 10;" in text

          print("Guest voting UI contract verified.")
          PY

      - name: Run repo regression checks
        shell: bash
        run: |
          pip install requests
          python3 scripts/validation/repo_regression_checks.py

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/improve-guest-voting-access.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "trade-desk-ui-bot"
          git config user.email "actions@users.noreply.github.com"

          git add index.html
          git add -u .github/workflows/improve-guest-voting-access.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Improve guest voting access"
          git push origin main
