name: Fix Package Adjustment Live Copy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update explanatory copy
        run: |
          echo '' | base64 --decode > /tmp/fix_package_copy.py
          python3 /tmp/fix_package_copy.py

      - name: Verify live logic remains enabled
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          text = Path("index.html").read_text()
          d = json.loads(
              Path("research/package-adjustment-production-candidate-v1/live_deployment.json").read_text()
          )

          assert "PACKAGE_ADJUSTMENT_PRODUCTION_V1" in text
          assert "const verdictTotals = tradeVerdictTotals();" in text
          assert "eligible consolidation trades apply the separate Package Adjustment to the verdict." in text
          assert "PRODUCTION INDEX.HTML IS UNCHANGED" not in text

          assert d["status"] == "controlled_live"
          assert d["production_formula_enabled"] is True
          assert d["trade_verdict_consumer_changed"] is True

          print("Live Package Adjustment logic unchanged; copy corrected.")
          PY

      - name: Commit copy correction
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No copy changes."
            exit 0
          fi

          git commit -m "Clarify live Package Adjustment copy"
          git pull --rebase origin main
          git push origin main
