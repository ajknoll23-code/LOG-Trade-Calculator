name: 4for4 IDP V1 - Phase 1 Harness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phase1-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests

      - name: Run 4for4 Phase 1 pipeline self-test
        run: |
          set -euo pipefail
          python3 scripts/projections/fourforfour_projection_pipeline.py --selftest

      - name: Run repository regression suite
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove validation made no repository changes
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo 'ERROR: Phase 1 harness modified tracked repository files.' >&2
            git diff -- .
            exit 1
          fi
          if ! git diff --cached --quiet -- .; then
            echo 'ERROR: Phase 1 harness staged repository changes.' >&2
            git diff --cached -- .
            exit 1
          fi
          echo 'PASS: research-only self-test/regressions left the repository unchanged.'
