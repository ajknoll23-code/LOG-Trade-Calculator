# PREFLIGHTED: POST_DRAFT_PICK_V8_1_FINAL_CLOSEOUT_WORKFLOW_CLEANUP_V9_PREP
name: Workflow Folder Cleanup

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  DP_V8_H2_ONE_SHOT_RUN_ID: '36493156773'
  DP_V8_1_FINAL_CLOSEOUT_RUN_ID: '36494381477'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.15

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Guard Draft Pick V8.1 closure and exact workflow inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          import requests
          import yaml

          workflow_dir = Path(".github/workflows")
          archive_dir = Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True, exist_ok=True)

          batch = "2026-09-28-post-draft-pick-v8-1-final-closeout-v9-prep"

          archive_targets = {
              "draft-pick-fv-v8-1-closeout-preregistration.yml":
                  "7cd469be9cd36ed835939a6dfdf56044a2ad308e",
              "draft-pick-fv-v8-1-final-research-closeout-v2.yml":
                  "eed0d44439f830e3e70e85f5b45033b3e04e00f5",
              "draft-pick-fv-v8-1-final-research-closeout.yml":
                  "eb253265d55aa11b92fe744560a84396b4950beb",
              "draft-pick-fv-v8-1-phase1-5.yml":
                  "0ed2f9488576fb45793658a3111715dc83842705",
              "draft-pick-fv-v8-1-phase1-6-holdout-rookie-only-scope-hardening-v2.yml":
                  "e3d135c1275ebeb7f1c96c38eaeba37970da3887",
              "draft-pick-fv-v8-1-phase1-6-holdout-rookie-only-scope-hardening.yml":
                  "35ee1a921cf0da9df7084deedbe914fba6d0dbd4",
              "draft-pick-fv-v8-1-phase1-sparse-tail-sensitivity.yml":
                  "45b159791222c01854bb11285a78fe1f15e70437",
              "draft-pick-fv-v8-1-phase2-2024-h2-independent-confirmation-ready.yml":
                  "1f4d2186440f16b829a1e1d4d9ff7f76bde3caad",
              "draft-pick-fv-v8-phase0b-qualified-depth-feasibility-PATCHED.yml":
                  "eb61e2482215dda704768800e5e6b487612740da",
              "draft-pick-fv-v8-phase0c-incremental-r6-rescue-v2.yml":
                  "1b2d4cd23c6efe3fc6d84356cdb0b39d4baf556f",
              "draft-pick-fv-v8-phase0c-incremental-r6-rescue-v3-sharded.yml":
                  "ceeb075bc22425a487ee7ac8cf91c7627e3fb75d",
              "draft-pick-fv-v8-phase0c-incremental-r6-rescue.yml":
                  "e3d7efb678587d163763712b15c4c1c501f838c0",
              "draft-pick-fv-v8-phase0c-local-cell-source-redesign.yml":
                  "b683ee134cb6189f5a78e604c8f50f0dc35e4eda",
              "draft-pick-fv-v8-phase0d-targeted-2018-r6-source-expansion.yml":
                  "1113db7badf63f11b131a41f328f375f60ce6fe2",
              "draft-pick-fv-v8-phase0e-sleeper-second-source-2018-r6-PATCHED.yml":
                  "8e225e06c15a546e611e02627a1cb640ff123535",
              "draft-pick-fv-v8-phase0e-sleeper-second-source-2018-r6.yml":
                  "74526b061b44762d00d397cd572e3733ed369640",
              "draft-pick-fv-v8-phase0f-sleeper-qualified-draft-metadata-audit.yml":
                  "ce683182dfee3b44f0f11a470c77c41f316c8e44",
              "draft-pick-fv-v8-phase0g-sleeper-bridge-upper-bound-closeout-RETRY.yml":
                  "2ff5b88fd3f662198e51ab32c2e4939c8bb16ea4",
              "draft-pick-fv-v8-phase0g-sleeper-bridge-upper-bound-closeout.yml":
                  "1c3f6d23316740754ef52243ba6313729de35560",
              "draft-pick-fv-v8-phase0h-fleaflicker-third-provider-preregistration-RETRY.yml":
                  "182c079d30b882db320a70e86b4f4a0137f756be",
              "draft-pick-fv-v8-phase0h1-fleaflicker-rules-schema-correction-RETRY.yml":
                  "b9142daf75c318d84c4e9ddcb59b6b1ca13d2265",
              "draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe-RETRY.yml":
                  "8330d64f58c6b9c8cbef6dc842825e140929b64a",
              "draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe.yml":
                  "f04c71f9e8b3f23e7f9429224027ed74d04a3895",
              "draft-pick-fv-v8-phase0j-source-availability-amendment.yml":
                  "6afe4bee49c64b384f1de40d9b49e818397f7823",
              "draft-pick-fv-v8-phase1-1-position-retention-hardening-RETRY.yml":
                  "835c87fd33d2f7100c6a25dbaefbcb5e4a1d38c7",
              "draft-pick-fv-v8-phase1-1-position-retention-hardening.yml":
                  "835c87fd33d2f7100c6a25dbaefbcb5e4a1d38c7",
              "draft-pick-fv-v8-phase1-incremental-source-identity-freeze.yml":
                  "7685841e5a458657e9777a017b3023ce02658e0f",
              "draft-pick-fv-v8-phase2-historical-outcome-harvest.yml":
                  "a46135a64aa755bdaaa29c3737194ef5ab03714f",
              "draft-pick-fv-v8-phase3-loyo-development-selection.yml":
                  "73700b7f096243126cb4419bba77206f914401ae",
          }

          protected = {
              "age-curve-v2-phase5.yml",
              "cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "free-agent-utility-v1-refresh.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "market-edge-v1-prospective-study.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "package-adjustment-v8-development-voting-activation-v1.yml",
              "package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml",
              "package-adjustment-v8-phase1c-development-catalog-and-audit-v1.yml",
              "package-adjustment-v8-phase1d-fixed50-protocol-amendment-v1.yml",
              "package-adjustment-v8-phase1e-evaluation-engine-freeze-v2.yml",
              "package-adjustment-v8-phase1f-pre-vote-operational-hardening-v2.yml",
              "package-adjustment-v8-phase1f-pre-vote-operational-hardening-v3.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "research-program-status-v1-current-state-audit.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "workflow-folder-cleanup-UPDATED-2026-09-26.yml",
          }

          def git_blob_sha(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def trigger_contract(path):
              doc = yaml.load(
                  Path(path).read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")

              raw = doc.get("on")
              if isinstance(raw, str):
                  return {raw}, [], set()
              if isinstance(raw, list):
                  return set(map(str, raw)), [], set()
              if not isinstance(raw, dict):
                  raise SystemExit(
                      f"Unrecognized workflow trigger syntax: {path}: {raw!r}"
                  )

              triggers = set(map(str, raw.keys()))
              push_paths = []
              push_keys = set()

              if "push" in raw:
                  push = raw["push"]
                  if push is None:
                      push = {}
                  if not isinstance(push, dict):
                      raise SystemExit(
                          f"Unexpected push trigger form in {path}: {push!r}"
                      )
                  push_keys = set(map(str, push.keys()))
                  paths = push.get("paths", [])
                  if isinstance(paths, str):
                      push_paths = [paths]
                  elif isinstance(paths, list):
                      push_paths = list(map(str, paths))
                  elif paths is None:
                      push_paths = []
                  else:
                      raise SystemExit(
                          f"Unexpected push.paths form in {path}: {paths!r}"
                      )

              return triggers, push_paths, push_keys

          def run_info(run_id):
              repo = os.environ["GH_REPOSITORY"]
              token = os.environ["GH_TOKEN"]
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              r = requests.get(
                  url,
                  timeout=30,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              r.raise_for_status()
              return r.json()

          expected_runs = {
              int(os.environ["DP_V8_H2_ONE_SHOT_RUN_ID"]): (
                  "Draft Pick FV V8.1 - Phase 2 2024 H2 One-Shot Confirmation",
                  "success",
              ),
              int(os.environ["DP_V8_1_FINAL_CLOSEOUT_RUN_ID"]): (
                  "Draft Pick FV V8.1 - Final Research Closeout",
                  "success",
              ),
          }

          run_evidence = []
          for run_id, (expected_name, expected_conclusion) in sorted(expected_runs.items()):
              info = run_info(run_id)
              actual = {
                  "id": int(info["id"]),
                  "name": info["name"],
                  "status": info["status"],
                  "conclusion": info["conclusion"],
                  "path": info["path"],
                  "head_sha": info["head_sha"],
              }
              if actual["status"] != "completed":
                  raise SystemExit(f"Authorization run not completed: {actual}")
              if actual["name"] != expected_name:
                  raise SystemExit(
                      f"Authorization run name drift for {run_id}: {actual['name']!r}"
                  )
              if actual["conclusion"] != expected_conclusion:
                  raise SystemExit(
                      f"Authorization run conclusion drift for {run_id}: "
                      f"expected={expected_conclusion} actual={actual['conclusion']}"
                  )
              run_evidence.append(actual)

          # Pin the final scientific closure rather than branch HEAD. Uploading this
          # cleanup workflow necessarily advances main, but must not change these blobs.
          closeout_path = Path(
              "research/draft-pick-fv-v8-1/v8_1_final_research_closeout.json"
          )
          closeout_manifest_path = Path(
              "research/draft-pick-fv-v8-1/v8_1_final_research_closeout_manifest.json"
          )
          h2_path = Path(
              "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json"
          )
          h2_close_path = Path(
              "research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_opening_closeout.json"
          )

          assert git_blob_sha(closeout_path) == "e7e49fba505b0dc11818ca51c83007ac4d712a16"
          assert git_blob_sha(closeout_manifest_path) == "590907efa3517b385f0ce05e8ad90fe5d1e8b208"
          assert git_blob_sha(h2_path) == "fca01dbea074a0ad83dc4caa149c1e8360ff5466"
          assert git_blob_sha(h2_close_path) == "64ce1654446f46d92f817ca353f52df983132051"

          closeout = json.loads(closeout_path.read_text(encoding="utf-8"))
          closeout_manifest = json.loads(
              closeout_manifest_path.read_text(encoding="utf-8")
          )
          h2 = json.loads(h2_path.read_text(encoding="utf-8"))
          h2_close = json.loads(h2_close_path.read_text(encoding="utf-8"))

          assert closeout["decision"] == "CLOSE_V8_1_H2_STOP_NO_H3_NO_PRODUCTION"
          assert closeout["status"] == "RESEARCH_CLOSED_H2_CONFIRMATION_STOP"
          assert closeout["scientific_conclusion"]["v8_1_candidate_eligible_for_future_h3_confirmation"] is False
          assert closeout["scientific_conclusion"]["v8_1_candidate_eligible_for_production"] is False
          assert closeout["scientific_conclusion"]["production_change_authorized"] is False
          assert closeout["frozen_next_action"]["future_research_must_be_new_study"] is True
          assert closeout["frozen_next_action"]["2024_h2_is_now_exposed_and_must_not_be_treated_as_fresh_holdout_again"] is True
          assert closeout["one_shot_state"]["normal_h2_rerun_allowed"] is False

          assert closeout_manifest["decision"] == closeout["decision"]
          assert closeout_manifest["h2_decision"] == "STOP_V8_1_2024_H2_CONFIRMATION"
          assert closeout_manifest["h3_authorized"] is False
          assert closeout_manifest["production_change_authorized"] is False
          assert closeout_manifest["normal_h2_rerun_allowed"] is False
          assert closeout_manifest["next_stage"] is None

          assert h2["decision"] == "STOP_V8_1_2024_H2_CONFIRMATION"
          assert h2["gate_pass"] is False
          assert h2["next_stage"] is None
          assert h2_close["normal_rerun_allowed"] is False
          assert h2_close["2024_h2_outcome_bytes_opened"] is True
          assert h2_close["2024_rookie_h2_scored"] is True
          assert h2_close["2024_h3_scored"] is False
          assert h2_close["2026_outcomes_read"] is False

          current = {
              p.name
              for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          expected_current = set(archive_targets) | protected

          if current != expected_current:
              raise SystemExit(
                  "Cleanup inventory drift. Refusing to guess.\n"
                  f"Missing expected: {sorted(expected_current-current)}\n"
                  f"Unexpected current: {sorted(current-expected_current)}"
              )
          if set(archive_targets) & protected:
              raise SystemExit("archive/protected overlap")

          rows = []
          for name, expected_sha in sorted(archive_targets.items()):
              src = workflow_dir / name
              dst = archive_dir / name
              if not src.exists():
                  raise SystemExit(f"Archive target missing: {src}")
              if dst.exists():
                  raise SystemExit(f"Archive destination already exists: {dst}")

              actual_sha = git_blob_sha(src)
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"SHA drift for {name}: expected={expected_sha} actual={actual_sha}"
                  )

              triggers, push_paths, push_keys = trigger_contract(src)

              # Completed Draft Pick workflows may be manual-only, or may also
              # contain a narrowly scoped push trigger that watches only workflow
              # files in this exact archive cohort. Once the entire cohort is
              # archived, those push triggers are intentionally retired too.
              allowed_trigger_sets = (
                  {"workflow_dispatch"},
                  {"workflow_dispatch", "push"},
              )
              if triggers not in allowed_trigger_sets:
                  raise SystemExit(
                      f"Refusing to archive workflow with unsupported triggers "
                      f"{name}: triggers={sorted(triggers)}"
                  )

              if "push" in triggers:
                  if push_keys != {"paths"}:
                      raise SystemExit(
                          f"Refusing push-trigger workflow with non-path push "
                          f"constraints {name}: push_keys={sorted(push_keys)}"
                      )
                  if not push_paths:
                      raise SystemExit(
                          f"Refusing unscoped push-trigger workflow {name}"
                      )
                  allowed_push_paths = {
                      f".github/workflows/{n}" for n in archive_targets
                  }
                  unexpected_push_paths = sorted(
                      set(push_paths) - allowed_push_paths
                  )
                  if unexpected_push_paths:
                      raise SystemExit(
                          f"Refusing push-trigger workflow {name}; paths escape "
                          f"archive cohort: {unexpected_push_paths}"
                      )

              family = (
                  "Draft Pick FV V8.1 completed/closed"
                  if name.startswith("draft-pick-fv-v8-1-")
                  else "Draft Pick FV V8 completed/superseded"
              )
              rows.append(
                  {
                      "original_path": str(src),
                      "archive_path": str(dst),
                      "git_blob_sha": actual_sha,
                      "sha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                      "triggers": sorted(triggers),
                      "push_paths": sorted(push_paths),
                      "cleanup_batch": batch,
                      "research_family": family,
                  }
              )

          assert len(current) == 55
          assert len(rows) == 29
          assert len(protected) == 26

          plan = {
              "schema_version": 9,
              "cleanup_batch": batch,
              "authorization_evidence": {
                  "run_evidence": run_evidence,
                  "v8_1_final_closeout_decision": closeout["decision"],
                  "v8_1_h2_decision": h2["decision"],
                  "v8_1_h3_authorized": False,
                  "v8_1_production_authorized": False,
                  "v9_required_for_future_draft_pick_research": True,
              },
              "active_before_n": len(current),
              "archive_now_n": len(rows),
              "active_after_n": len(protected),
              "protected_active_workflows": sorted(protected),
              "archive_entries": rows,
              "delete_entries": [],
          }

          Path(".github/workflow-archive/workflow-cleanup-plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: V8.1 final closeout authorizes Draft Pick workflow cleanup.")
          print("PASS: active workflows before cleanup: 55")
          print("PASS: Draft Pick V8/V8.1 workflows to archive: 29 (manual-only or cohort-scoped push)")
          print("PASS: active protected workflows after cleanup: 26")
          print("PASS: Package Adjustment V8 workflows remain active and untouched.")
          PY

      - name: Archive exact completed Draft Pick V8 and V8.1 workflows
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(
              Path(".github/workflow-archive/workflow-cleanup-plan.json").read_text(
                  encoding="utf-8"
              )
          )

          for row in plan["archive_entries"]:
              src = Path(row["original_path"])
              dst = Path(row["archive_path"])
              dst.parent.mkdir(parents=True, exist_ok=True)

              if not src.exists() or dst.exists():
                  raise SystemExit(
                      f"Unsafe move state: src={src.exists()} "
                      f"dst={dst.exists()} for {src.name}"
                  )

              src.rename(dst)
              actual = hashlib.sha256(dst.read_bytes()).hexdigest()
              if actual != row["sha256"]:
                  raise SystemExit(f"Post-move hash mismatch: {dst}")

          print(f"PASS: archived {len(plan['archive_entries'])} exact workflows.")
          PY

      - name: Update archive manifest and README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          archive_dir = Path(".github/workflow-archive/completed-research")
          plan_path = Path(".github/workflow-archive/workflow-cleanup-plan.json")
          manifest_path = archive_dir / "archive_manifest.json"
          readme_path = archive_dir / "README.md"

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          old = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert old["archive_workflow_n"] == 158
          assert old["last_cleanup_batch"] == (
              "2026-09-26-post-package-v8-phase1b-and-draft-pick-v8"
          )

          archive_by_original = {
              row["original_path"]: row
              for row in old.get("archive_entries", [])
          }

          for row in plan["archive_entries"]:
              prior = archive_by_original.get(row["original_path"])
              if prior and prior.get("sha256") != row["sha256"]:
                  raise SystemExit(
                      f"Archive manifest conflict: {row['original_path']}"
                  )
              archive_by_original[row["original_path"]] = row

          archive_entries = [
              archive_by_original[k]
              for k in sorted(archive_by_original)
          ]
          deleted_entries = list(old.get("deleted_obsolete_workflows", []))

          actual_yaml = sorted(
              p.name
              for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          )
          manifest_yaml = sorted(
              Path(row["archive_path"]).name
              for row in archive_entries
          )

          if actual_yaml != manifest_yaml:
              raise SystemExit("Archive inventory mismatch after workflow moves.")

          now = datetime.now(timezone.utc).isoformat()

          manifest = {
              "schema_version": 9,
              "last_cleanup_batch": plan["cleanup_batch"],
              "last_cleanup_at_utc": now,
              "last_cleanup_authorization_evidence":
                  plan["authorization_evidence"],
              "archive_workflow_n": len(archive_entries),
              "protected_active_workflow_n":
                  len(plan["protected_active_workflows"]),
              "protected_active_workflows":
                  plan["protected_active_workflows"],
              "archive_entries": archive_entries,
              "deleted_obsolete_workflows": deleted_entries,
          }

          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual-only research/deployment workflows are moved "
              "out of `.github/workflows` so they do not clutter the GitHub "
              "Actions workflow list.",
              "",
              "Archived YAML files are preserved byte-for-byte. Original "
              "paths, Git blob SHAs, SHA-256 hashes, and triggers are recorded "
              "in `archive_manifest.json`.",
              "",
              "Recurring production/data workflows and studies that are still "
              "active or intentionally rerunnable remain in `.github/workflows`.",
              "",
              f"Archive refreshed: {now}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              f"Active protected workflow count: "
              f"**{len(plan['protected_active_workflows'])}**",
              "",
              "## Active protected workflows",
              "",
          ]
          lines.extend(
              f"- {name}" for name in plan["protected_active_workflows"]
          )
          lines += ["", "## Archived workflows", ""]
          lines.extend(f"- {name}" for name in actual_yaml)

          if deleted_entries:
              lines += ["", "## Deleted exact obsolete duplicates", ""]
              for row in deleted_entries:
                  lines.append(f"- `{row['path']}` — {row['reason']}")

          lines.append("")
          readme_path.write_text("\n".join(lines), encoding="utf-8")
          plan_path.unlink()

          assert len(actual_yaml) == 187
          assert len(plan["protected_active_workflows"]) == 26

          print(
              f"PASS: archive manifest now tracks {len(archive_entries)} workflows."
          )
          PY

      - name: Validate remaining active workflow folder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )
          expected = set(manifest["protected_active_workflows"])

          workflow_dir = Path(".github/workflows")
          actual = {
              p.name
              for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }

          if actual != expected:
              raise SystemExit(
                  "Active workflow mismatch.\n"
                  f"Expected={sorted(expected)}\n"
                  f"Actual={sorted(actual)}"
              )

          names = {}
          for p in sorted(workflow_dir.iterdir()):
              if p.suffix not in {".yml", ".yaml"}:
                  continue
              doc = yaml.load(
                  p.read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc, dict):
                  raise SystemExit(f"Invalid YAML object: {p}")

              display = str(doc.get("name") or "")
              if not display:
                  raise SystemExit(f"Workflow has no name: {p}")
              if display in names:
                  raise SystemExit(
                      f"Duplicate workflow display name: {display}: "
                      f"{names[display]} and {p.name}"
                  )
              names[display] = p.name

              if "on" not in doc:
                  raise SystemExit(f"Workflow has no trigger: {p}")

          assert not any(
              name.startswith("draft-pick-fv-v8")
              for name in actual
          )
          assert not any(
              name.startswith("draft-pick-fv-v8-1")
              for name in actual
          )

          # Package Adjustment V8 remains active; this cleanup is Draft Pick-only.
          assert (
              "package-adjustment-v8-development-voting-activation-v1.yml"
              in actual
          )
          assert (
              "package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml"
              in actual
          )
          assert (
              "workflow-folder-cleanup-UPDATED-2026-09-26.yml"
              in actual
          )

          dispatcher = (
              workflow_dir / "package-adjustment-audit-step4-exact-live-oos.yml"
          )
          dispatcher_text = dispatcher.read_text(encoding="utf-8")
          assert "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1" in dispatcher_text
          assert "schedule:" in dispatcher_text

          assert len(actual) == 26

          print(
              "PASS: active Actions folder now contains exactly "
              "26 protected workflows."
          )
          print(
              "PASS: all Draft Pick V8/V8.1 workflows are archived."
          )
          print(
              "PASS: Package Adjustment V8 and recurring production workflows "
              "remain active."
          )
          PY

      - name: Run full repository regression
        shell: bash
        run: |
          set -euo pipefail

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          restore_tu() {
            git checkout -- "$TU_JSON" "$TU_MD"
          }
          trap restore_tu EXIT

          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          restore_tu
          trap - EXIT

          git diff --exit-code -- "$TU_JSON" "$TU_MD"

          echo "PASS: full repository regression suite green."

      - name: Prove cleanup scope
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              Path(
                  ".github/workflow-archive/completed-research/"
                  "archive_manifest.json"
              ).read_text(encoding="utf-8")
          )

          batch = "2026-09-28-post-draft-pick-v8-1-final-closeout-v9-prep"
          batch_rows = [
              row
              for row in manifest["archive_entries"]
              if row.get("cleanup_batch") == batch
          ]

          if len(batch_rows) != 29:
              raise SystemExit(
                  f"Expected 29 workflows in current cleanup batch, "
                  f"found {len(batch_rows)}"
              )

          allowed = {
              ".github/workflow-archive/completed-research/README.md",
              ".github/workflow-archive/completed-research/archive_manifest.json",
          }

          for row in batch_rows:
              allowed.add(row["original_path"])
              allowed.add(row["archive_path"])

          status = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "--untracked-files=all",
              ],
              text=True,
          )

          touched = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              raw = line[3:]
              if " -> " in raw:
                  left, right = raw.split(" -> ", 1)
                  touched.add(left)
                  touched.add(right)
              else:
                  touched.add(raw)

          unexpected = sorted(touched - allowed)
          if unexpected:
              raise SystemExit(
                  "Cleanup touched unexpected files: " + ", ".join(unexpected)
              )

          print(
              f"PASS: cleanup scope exact; touched {len(touched)} paths."
          )
          PY

      - name: Commit workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during cleanup; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .github

          if git diff --cached --name-only | grep -Fxq \
            ".github/workflows/workflow-folder-cleanup-UPDATED-2026-09-26.yml"
          then
            echo "ERROR: active cleanup workflow itself is staged; refusing push."
            exit 1
          fi

          git diff --cached --quiet && {
            echo "ERROR: nothing staged."
            exit 1
          }

          git commit -m "Archive closed Draft Pick V8 and V8.1 workflows"
          git push origin HEAD:main

          echo "PASS: Draft Pick V8/V8.1 workflow cleanup committed."
