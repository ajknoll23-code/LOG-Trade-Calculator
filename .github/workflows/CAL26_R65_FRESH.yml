name: CAL26 V1R65 - Frozen Week6 Exact Source Replay and IDP Scoring Exceptions (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r65-scoring-source-qa
  cancel-in-progress: false
jobs:
  week6-scorer-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Read-only checkout pinned repository scorer
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download verified R64 Week6 observational evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R64_2026_WEEK6_SEVEN_POSITION_LOG_OBSERVATIONS_FV_HOLD
        run-id: 40064881274
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r65-inputs/R64
    - name: Replay six pinned weekly stat sources, audit IDP aliases, reject data drift
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R65_engine.py\" <<'PY_CAL26_V1R65_ENGINE'\n#!/usr/bin/env\
        \ python3\n\"\"\"CAL26 V1R65: exact R64 source replay and conservative scoring-field exception audit.\nResearch\
        \ only. Any alias increment is POSSIBLE, not an authoritative score correction.\n2026 HTTP access is hard-coded\
        \ to Weeks 1..6. Future targets and FV are untouched.\n\"\"\"\nimport argparse,ast,collections,csv,hashlib,json,pathlib,sys,urllib.request\n\
        \nPOSITIONS=('QB','RB','WR','TE','DL','LB','DB')\nSOURCE_NAME='CAL26_V1R64_518_frozen_week6_2026_LOG_observations_NOT_FV.csv'\n\
        SCORER='research/roster-economics/historical_weekly_points_pipeline.py'\nSCORER_SHA='d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace'\n\
        R64_RUN=40064881274\nR64_ARTIFACT='CAL26_V1R64_2026_WEEK6_SEVEN_POSITION_LOG_OBSERVATIONS_FV_HOLD'\n\ndef require(cond,msg):\n\
        \ if not cond:raise AssertionError(msg)\ndef h(data):return hashlib.sha256(data).hexdigest()\ndef csvwrite(p,rows,cols):\n\
        \ with p.open('w',newline='') as f:\n  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(rows)\n\
        def parse_scorer(p,fixture=False):\n b=p.read_bytes()\n if not fixture:require(hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\\
        x00'+b).hexdigest()==SCORER_SHA,'PINNED_LOG_SCORER_SOURCE_CHANGED')\n funcs=[n for n in ast.parse(b).body if\
        \ isinstance(n,ast.FunctionDef) and n.name=='score_week']\n require(len(funcs)==1,'EXACT_SCORER_NOT_FOUND')\n\
        \ scope={};exec(compile(ast.Module(body=funcs,type_ignores=[]),'<pinned 2026 scorer>','exec'),scope)\n f=scope['score_week'];require(abs(f({'idp_tkl_solo':2,'idp_tkl_ast':2})-4.5)<1e-8,'SCORER_2026_IDP_MISMATCH')\n\
        \ require(abs(f({'pass_yd':300})-14)<1e-8,'SCORER_PASS_BONUS_MISMATCH')\n return f\n\ndef get_week(w,fixture):\n\
        \ require(w in (1,2,3,4,5,6),'STOP_WEEK7_PLUS')\n if fixture:\n  b=(fixture/f'week{w}.json').read_bytes()\n else:\n\
        \  url=f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{w}'\n  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'CAL26-V1R65-pinned-week6-replay'}),timeout=50)\
        \ as z:\n   require(z.status==200,'SLEEPER_HTTP_NON_200');b=z.read(35_000_000)\n j=json.loads(b);require(isinstance(j,dict)\
        \ and len(j)>=2,'SLEEPER_STATS_MISSING')\n return j,h(b)\n\ndef alias_candidate(s):\n # Deliberately NEVER claim\
        \ these are verified Sleeper point corrections.\n # Bonus applies only when the source's primary field is zero,\
        \ to avoid double counting.\n x=[]\n for alternate,primary,price in [('idp_def_td','idp_td',6),('idp_safe','idp_safety',3)]:\n\
        \  a=float(s.get(alternate,0) or 0);p=float(s.get(primary,0) or 0)\n  if a>0:\n   x.append((alternate,primary,a,p,(a*price\
        \ if p==0 else 0),'POTENTIAL_ALIAS_ONLY' if p==0 else 'BOTH_PRIMARY_AND_ALIAS_PRESENT_REVIEW'))\n return x\n\n\
        def main(args):\n a=pathlib.Path(args.r64);repo=pathlib.Path(args.repo);out=pathlib.Path(args.out);out.mkdir(parents=True,exist_ok=True)\n\
        \ fixture=pathlib.Path(args.fixtures) if args.fixtures else None\n m=json.loads((a/'CAL26_V1R64_manifest.json').read_text())\n\
        \ require(m['semantic_status']=='2026_SIX_WEEK_SAME_RULE_SCORING_OBSERVATIONS__RESEARCH_ONLY_FV_HOLD','R64_CONTRACT_CHANGED')\n\
        \ require(m['source_weeks']==[1,2,3,4,5,6] and not m['production_change_authorized'] and not m['2026_week7_or_later_fetched'],'R64_FUTURE_OR_PRODUCTION_VIOLATION')\n\
        \ require(m['fixture']==(fixture is not None),'FIXTURE_SOURCE_MIX')\n for name,digest in m['output_sha256'].items():require(h((a/name).read_bytes())==digest,'R64_ARTIFACT_SHA_DRIFT_'+name)\n\
        \ rows=list(csv.DictReader((a/SOURCE_NAME).open()));require(len(rows)==518,'NOT_518_PLAYERS')\n require(len({(r['name'],r['position'])\
        \ for r in rows})==518 and {r['position'] for r in rows}==set(POSITIONS),'PLAYER_ID_OR_POSITION_DRIFT')\n score=parse_scorer(repo/SCORER,bool(fixture))\n\
        \ weeks={}\n for w in range(1,7):\n  weeks[w],sha=get_week(w,fixture)\n  require(sha==m['source_week_sha256'][str(w)],'R64_SOURCE_BYTE_DRIFT_WEEK_'+str(w))\n\
        \ output=[];aliases=[];positions=collections.Counter();audit=collections.Counter();largest=[]\n for r in rows:\n\
        \  pos=r['position'];positions[pos]+=1;pid=r['sleeper_id'];status=r['identity_status']\n  # Never infer a stat\
        \ line for unresolved identities.\n  total=0.0;potential=0.0;found=0;played=0;events=0\n  if pid:\n   for w in\
        \ range(1,7):\n    s=weeks[w].get(pid,{})\n    require(isinstance(s,dict),'NONDICT_WEEK_PLAYER_'+pid)\n    if\
        \ s:\n     found+=1\n     active=float(s.get('gp') or 0)>=1\n     if active:played+=1;total+=float(score(s))\n\
        \     for key,primary,val,pval,added,condition in alias_candidate(s):\n      if not active: added=0;condition='NO_GAME_PLAYED__NO_POINTS_CLAIM'\n\
        \      potential+=added;events+=1\n      aliases.append({'name':r['name'],'position':pos,'sleeper_id':pid,'week':w,'source_field':key,'primary_field':primary,\n\
        \       'source_stat_count':val,'primary_stat_count':pval,'possible_missed_points_IF_ALIAS_CONFIRMED':round(added,5),'classification':condition})\n\
        \  require(found==int(r['stats_weeks_seen']) and played==int(r['played_weeks_gp']),'R64_SOURCE_GAME_COUNT_PARITY_'+r['name'])\n\
        \  raw=r['2026_week1_6_LOG_2026_rules_points']\n  if raw!='':require(abs(float(raw)-total)<0.0001,'R64_WEEKLY_SCORE_PARITY_'+r['name'])\n\
        \  else:require(pid=='' and status in ('UNMAPPED_ID','AMBIGUOUS_MULTIPLE_IDS'),'MISSING_SCORE_HAS_ID')\n  if\
        \ status=='OBSERVED_UNIQUE_ID':audit['observed']+=1\n  if events:audit['players_with_alias_events']+=1\n  if\
        \ potential:audit['players_with_potential_points']+=1\n  audit['alias_events']+=events\n  audit['possible_missed_points_sum']+=potential\n\
        \  audit['replayed_points_sum']+=total\n  if pos in ('DL','LB','DB') and pid and played>=3 and total<=(10 if\
        \ pos=='DL' else 8):\n   audit['low_IDP_signal_cases']+=1\n   largest.append((int(r['frozen_FV_UNCHANGED']),r['name'],pos,played,round(total,3)))\n\
        \  output.append({'name':r['name'],'position':pos,'sleeper_id':pid,'identity_status':status,'frozen_FV_REFERENCE_ONLY':r['frozen_FV_UNCHANGED'],\n\
        \    'R64_2026_week1_6_observed_scorer_points':raw,\n    'R65_replay_same_source_scorer_points':round(total,6)\
        \ if raw!='' else '',\n    'possible_added_alias_points_UNVERIFIED':round(potential,6) if raw!='' else '',\n\
        \    'possible_upper_bound_score_IF_ALIAS_CONFIRMED':round(total+potential,6) if raw!='' else '',\n    'observed_game_weeks_gp':played,'source_stats_weeks':found,'alias_occurrences':events,\n\
        \    '2026_exact_all_categories_CERTIFIED':False,'forecast_transfer_validated':False,'production_FV_reprice_authorized':False})\n\
        \ require(audit['observed']==m['n_2026_observed_unique_ids'],'OBSERVED_PLAYER_COUNT_DRIFT')\n if not fixture:\n\
        \  # Source-specific expected exceptions recorded in real R64. Do not manufacture a green if they vanish/mutate.\n\
        \  require(m['observed_unreconciled_stat_alias_counts'].get('idp_def_td_not_recognized_by_scorer',0)==5,'R64_KNOWN_EXCEPTION_COUNT_DRIFT')\n\
        \  require(sum(x['source_field']=='idp_def_td' and x['primary_stat_count']==0 for x in aliases)==5,'KNOWN_FIVE_ALIAS_EVENTS_NOT_REPRODUCED')\n\
        \ require(len(output)==518 and sum(positions.values())==518,'COVERAGE_DRIFT')\n csvwrite(out/'CAL26_V1R65_518_scoring_exception_and_verified_replay_NOT_FV.csv',output,list(output[0]))\n\
        \ aliascols=['name','position','sleeper_id','week','source_field','primary_field','source_stat_count','primary_stat_count','possible_missed_points_IF_ALIAS_CONFIRMED','classification']\n\
        \ csvwrite(out/'CAL26_V1R65_source_alias_events_REVIEW.csv',aliases,aliascols)\n flags=[{'name':n,'position':p,'played_weeks':g,'R64_points':v,'frozen_FV_reference':fv,'classification':'VERIFY_GAME_AND_STATS_NOT_AUTOMATIC_SCORE_BUG'}\
        \ for fv,n,p,g,v in sorted(largest,reverse=True)[:35]]\n csvwrite(out/'CAL26_V1R65_low_IDP_score_source_review.csv',flags,['name','position','played_weeks','R64_points','frozen_FV_reference','classification'])\n\
        \ md=['# CAL26 V1R65 \u2014 Frozen Week6 exact source replay / scoring exceptions','',\n 'Decision: **SOURCE_REPLAY_PASS_ALIAS_REVIEW_REQUIRED_FV_HOLD**.','',\n\
        \ 'R64 weekly source bytes were independently fetched and matched to the six exact Week1\u20136 SHA256 digests.\
        \ Zero Week7+ endpoints or outcomes were accessed. Original 2026-rule scoring replay is byte-contract and player-points\
        \ identical.',\n '',f'2026 frozen 518 players; {audit[\"observed\"]} with observed source IDs; {audit[\"alias_events\"\
        ]} flagged alias events across {audit[\"players_with_alias_events\"]} players.',\n f'Conservative possible scoring\
        \ delta (UNVERIFIED alias interpretation) = {audit[\"possible_missed_points_sum\"]:.3f} total points over six\
        \ weeks. **Not certified as actual missing points.**',\n f'Low-score IDP diagnostic flags = {audit[\"low_IDP_signal_cases\"\
        ]}; these are not proof of source errors (injuries and few snaps are possible).',\n '', '| Pos | Candidates |','|---|---:|']\n\
        \ for pos in POSITIONS:md.append(f'| {pos} | {positions[pos]} |')\n md += ['', '## Governance','- Source scorer:\
        \ pinned repository historical_weekly_points_pipeline.py scored with 2026 rule weights, not original 2024/25\
        \ settings.',\n '- Alias candidates: `idp_def_td` and `idp_safe` are reported as possible interpretations only,\
        \ no silent auto-fix or double-count.',\n '- No certification of every 2026 Sleeper scoring category; an independent\
        \ authoritative point tally is still required.',\n '- No 20x price multiplier, no 2027 production claims, no\
        \ market-to-FV labels, no production updates.','']\n (out/'CAL26_V1R65_decision.md').write_text('\\n'.join(md))\n\
        \ names=['CAL26_V1R65_518_scoring_exception_and_verified_replay_NOT_FV.csv','CAL26_V1R65_source_alias_events_REVIEW.csv','CAL26_V1R65_low_IDP_score_source_review.csv','CAL26_V1R65_decision.md']\n\
        \ man={'semantic_status':'SOURCE_REPLAY_IDENTICAL_ALIASES_UNVERIFIED__FV_HOLD','fixture':bool(fixture),'r64_run_id':R64_RUN,'r64_artifact':R64_ARTIFACT,\n\
        \ 'week_source_byte_SHA256_match':True,'source_weeks':[1,2,3,4,5,6],'weeks7_plus_fetched':False,'protected_future_targets_used':False,\n\
        \ 'r64_player_points_518_unchanged':True,'player_count':len(output),'observed_unique_ids':audit['observed'],'source_alias_events':audit['alias_events'],\n\
        \ 'potential_alias_points_UNVERIFIED':round(audit['possible_missed_points_sum'],6),'low_IDP_score_review_count':audit['low_IDP_signal_cases'],\n\
        \ 'all_category_scoring_verified':False,'preseason_projection_transfer_validated':False,'cardinal_FV_identified':False,\n\
        \ 'production_change_authorized':False,'source_SHA256':m['source_week_sha256'],\n 'outputs_sha256':{name:h((out/name).read_bytes())\
        \ for name in names}}\n (out/'CAL26_V1R65_manifest.json').write_text(json.dumps(man,indent=2,sort_keys=True)+'\\\
        n')\n print('R65_REPLAY_GREEN',json.dumps({k:man[k] for k in ('player_count','observed_unique_ids','source_alias_events','potential_alias_points_UNVERIFIED','low_IDP_score_review_count')},sort_keys=True))\n\
        \ndef selftest():\n assert alias_candidate({'idp_def_td':1,'idp_td':0})[0][-2]==6\n assert alias_candidate({'idp_def_td':1,'idp_td':1})[0][-2]==0\n\
        \ assert alias_candidate({'idp_safe':2,'idp_safety':0})[0][-2]==6\n assert alias_candidate({'idp_safe':2,'idp_safety':2})[0][-2]==0\n\
        \ try:get_week(7,None)\n except AssertionError as e:assert str(e)=='STOP_WEEK7_PLUS'\n else:raise AssertionError('PROTECTED_WEEK7_SHIELD_BROKEN')\n\
        \ print('R65_SELFTEST_GREEN alias-without-double-count; fail-closed-week7')\nif __name__=='__main__':\n p=argparse.ArgumentParser();p.add_argument('--r64');p.add_argument('--repo');p.add_argument('--out');p.add_argument('--fixtures');p.add_argument('--selftest',action='store_true')\n\
        \ x=p.parse_args()\n if x.selftest:selftest()\n else:main(x)\n\nPY_CAL26_V1R65_ENGINE\npython -m py_compile \"\
        $RUNNER_TEMP/CAL26_V1R65_engine.py\"\npython \"$RUNNER_TEMP/CAL26_V1R65_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_V1R65_engine.py\"\
        \ \\\n --r64 \"$RUNNER_TEMP/cal26-r65-inputs/R64\" \\\n --repo \"$GITHUB_WORKSPACE\" \\\n --out \"$RUNNER_TEMP/cal26-r65-results\"\
        \npython - \"$RUNNER_TEMP/cal26-r65-results\" <<'PY_CAL26_V1R65_VERIFY'\nimport csv,hashlib,json,pathlib,sys\n\
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R65_manifest.json').read_text())\nassert m['semantic_status']=='SOURCE_REPLAY_IDENTICAL_ALIASES_UNVERIFIED__FV_HOLD'\n\
        assert m['fixture'] is False and m['player_count']==518 and m['observed_unique_ids']==495\nassert m['r64_run_id']==40064881274\
        \ and m['week_source_byte_SHA256_match']\nassert m['source_weeks']==[1,2,3,4,5,6] and not m['weeks7_plus_fetched']\n\
        assert not m['protected_future_targets_used'] and not m['production_change_authorized']\nassert not m['all_category_scoring_verified']\
        \ and not m['cardinal_FV_identified']\nassert not m['preseason_projection_transfer_validated']\nfor filename,digest\
        \ in m['outputs_sha256'].items():\n assert hashlib.sha256((p/filename).read_bytes()).hexdigest()==digest,filename\n\
        with (p/'CAL26_V1R65_518_scoring_exception_and_verified_replay_NOT_FV.csv').open() as f:rows=list(csv.DictReader(f))\n\
        assert len(rows)==518 and len({(r['name'],r['position']) for r in rows})==518\nassert all(r['production_FV_reprice_authorized']=='False'\
        \ for r in rows)\nprint('R65_FROZEN_SOURCE_REPLAY__RESEARCH_ONLY_GREEN')\nPY_CAL26_V1R65_VERIFY\ntest -z \"$(git\
        \ status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r65-results/CAL26_V1R65_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: Upload audited scorer exceptions (no live FV changes)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: CAL26_V1R65_518_FROZEN_WEEK6_SCORING_EXCEPTION_AUDIT_FV_HOLD
        path: ${{ runner.temp }}/cal26-r65-results/
        retention-days: 60
        if-no-files-found: warn
