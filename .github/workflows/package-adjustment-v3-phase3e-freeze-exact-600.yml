name: Package Adjustment V3 - Phase 3E Freeze Exact 600

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install freeze dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard exact Phase 3E freezer and frozen inputs
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v3-ktc-style"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$D/package_adjustment_v3_phase3e_freeze.py")" = "867abbd137db3b91f38eff886828910cb85a48ab"
          test "$(git hash-object "$D/phase3_confirmation_preregistration.json")" = "19966121899d41bdbc754a6a260758cf175b12e2"
          test "$(git hash-object "$D/phase3_confirmation_catalog.json")" = "3d4615e590697341ee8c27785d8b22e16b82ac44"
          test "$(git hash-object "$D/phase3_confirmation_catalog_manifest.json")" = "6ecd25f01b758a5ea5bd69f513f775c55fc84d4c"
          test "$(git hash-object "$D/phase3_voting_release.json")" = "ae62546cbff5974d895cf43931819b15e7c3a222"
          test "$(git hash-object "$D/package_adjustment_v3_phase3b.py")" = "4356e8b5af591cbd9cf5ed7d2af3ca2077e2bf91"
          test "$(git hash-object "$D/package_adjustment_v3_phase3d_maturity.py")" = "22d1a76ad12c78affa92e2ca16cdd968a343e8b4"

          test ! -e "$D/phase3_exact_600_frozen.json"
          test ! -e "$D/phase3_exact_600_freeze_manifest.json"

      - name: Verify production remains V1.6 before freeze
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Self-test exact checkpoint freezer
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3e_freeze.py --selftest

      - name: Freeze exact 600-effective-vote checkpoint
        run: python3 research/package-adjustment-v3-ktc-style/package_adjustment_v3_phase3e_freeze.py

      - name: Verify frozen outputs and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          data_path = d / "phase3_exact_600_frozen.json"
          manifest_path = d / "phase3_exact_600_freeze_manifest.json"

          data = json.loads(data_path.read_text())
          manifest = json.loads(manifest_path.read_text())

          assert data["status"] == "FROZEN_EXACT_600_CONFIRMATION_EVIDENCE"
          assert data["frozen"] is True
          assert data["model_evaluation_performed"] is False
          assert data["checkpoint_selection_outcome_blind"] is True
          assert data["frozen_effective_votes"] == 600.0
          assert data["raw_checkpoint_ballot_count"] == 600
          assert data["distinct_voter_clusters"] == 30
          assert len(data["ballots"]) == 600

          assert manifest["status"] == "FROZEN_EXACT_600_CONFIRMATION_EVIDENCE_MANIFEST"
          assert manifest["production_change_authorized"] is False
          assert manifest["model_evaluation_performed"] is False
          assert manifest["checkpoint"]["effective_votes"] == 600.0
          assert manifest["checkpoint"]["distinct_voters"] == 30
          assert manifest["checkpoint"]["cells_passing_both_gates"] == 24
          assert manifest["checkpoint"]["minimum_cell_effective_votes"] == 17.0
          assert manifest["checkpoint"]["minimum_cell_distinct_voters"] == 13

          exc = manifest["pre_unblinding_provenance_exception"]
          assert exc["phase3b_generator_source_contains_typo"] is True
          assert exc["incorrect_generator_name"] == "mike washington"
          assert exc["intended_name"] == "parker washington"
          assert exc["corrected_five_ktc_exact_selected_matches"] == [0, 0, 0, 0, 0]
          assert exc["corrected_five_ktc_all_absent_from_frozen_catalog"] is True
          assert exc["catalog_regenerated_after_voting"] is False

          data_text = data_path.read_text()
          manifest_text = manifest_path.read_text()
          for banned in (
              '"voter_roster_id"',
              '"raw_voter_identifier"',
              '"candidate_prediction"',
              '"model_log_loss"',
              '"selected_candidate"',
          ):
              assert banned not in data_text
              assert banned not in manifest_text

          assert hashlib.sha256(data_path.read_bytes()).hexdigest() == os.environ["PHASE3E_DATA_SHA256"]
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == os.environ["PHASE3E_MANIFEST_SHA256"]

          print("PASS: exact-600 freeze, provenance audit, and privacy boundary verified.")
          PY

      - name: Guard exact two-file research change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v3-ktc-style/phase3_exact_600_frozen.json",
              "research/package-adjustment-v3-ktc-style/phase3_exact_600_freeze_manifest.json",
          }
          rows = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          changed = {row[3:] for row in rows if len(row) >= 4}
          if changed != expected:
              raise RuntimeError(f"Unexpected repository changes: {sorted(changed)}")
          print("PASS: exactly two intended Phase 3E research files changed.")
          PY

      - name: Run repository regressions after freeze
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Re-verify production remains V1.6
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Upload exact-600 freeze proof
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v3-phase3e-exact-600-freeze
          retention-days: 90
          if-no-files-found: error
          path: |
            research/package-adjustment-v3-ktc-style/phase3_exact_600_frozen.json
            research/package-adjustment-v3-ktc-style/phase3_exact_600_freeze_manifest.json
            /tmp/package-adjustment-v3-phase3e-freeze-report.md

      - name: Commit immutable exact-600 freeze
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v3-ktc-style"
          DATA="$D/phase3_exact_600_frozen.json"
          MANIFEST="$D/phase3_exact_600_freeze_manifest.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$DATA" "$MANIFEST"
          git diff --cached --check

          python3 - <<'PY'
          import subprocess
          expected = {
              "research/package-adjustment-v3-ktc-style/phase3_exact_600_frozen.json",
              "research/package-adjustment-v3-ktc-style/phase3_exact_600_freeze_manifest.json",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Unexpected staged files: {sorted(changed)}")
          print("PASS: exactly two Phase 3E freeze files staged.")
          PY

          git commit -m "Freeze Package Adjustment V3 exact 600 confirmation votes"
          git pull --rebase origin main

          test "$(git hash-object "$D/phase3_confirmation_preregistration.json")" = "19966121899d41bdbc754a6a260758cf175b12e2"
          test "$(git hash-object "$D/phase3_confirmation_catalog.json")" = "3d4615e590697341ee8c27785d8b22e16b82ac44"
          test "$(git hash-object "$D/phase3_confirmation_catalog_manifest.json")" = "6ecd25f01b758a5ea5bd69f513f775c55fc84d4c"
          test "$(git hash-object "$D/phase3_voting_release.json")" = "ae62546cbff5974d895cf43931819b15e7c3a222"
          test "$(git hash-object "$D/package_adjustment_v3_phase3b.py")" = "4356e8b5af591cbd9cf5ed7d2af3ca2077e2bf91"

          test "$(sha256sum "$DATA" | awk '{print $1}')" = "$PHASE3E_DATA_SHA256"
          test "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$PHASE3E_MANIFEST_SHA256"

          python3 - <<'PY'
          import subprocess
          expected = {
              "research/package-adjustment-v3-ktc-style/phase3_exact_600_frozen.json",
              "research/package-adjustment-v3-ktc-style/phase3_exact_600_freeze_manifest.json",
          }
          changed = set(subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Rebased commit touched unexpected files: {sorted(changed)}")
          print("PASS: rebased Phase 3E commit remains exact two-file scope.")
          PY

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main
          echo "PHASE3E_STATUS=FROZEN_EXACT_600_CONFIRMATION_EVIDENCE"
          git log --oneline -1
