name: Package Adjustment Audit Step 2 Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  analyze-v4-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyze frozen V4 composition envelope
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import statistics
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          V4 = ROOT / "research/package-adjustment-v4/package_vote_challenges_v4.json"
          V3 = ROOT / "research/package-adjustment-v3/package_vote_challenges_v3.json"
          INDEX = ROOT / "index.html"
          OUT_JSON = ROOT / "research/package-adjustment-production-candidate-v1/audit_step2_v4_composition_analysis.json"
          OUT_MD = ROOT / "research/package-adjustment-production-candidate-v1/audit_step2_v4_composition_analysis.md"

          MEANINGFUL_TARGET_SHARE = 0.06
          CURRENT_LIVE_MATERIAL_THIRD_PACKAGE_SHARE = 0.16
          NOMINAL_PACKAGE_SHARES = (0.45, 0.33, 0.22)

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          protected_before = {
              "index.html": sha256(INDEX),
              "v3_catalog": sha256(V3),
              "v4_catalog": sha256(V4),
          }

          doc = json.loads(V4.read_text(encoding="utf-8"))
          assert doc.get("schema_version") == 4
          assert doc.get("status") == "frozen_package_preference_v4"
          assert doc.get("frozen") is True
          assert doc.get("production_formula_enabled") is False

          challenges = doc.get("challenges") or []
          assert len(challenges) == 100, len(challenges)

          def q(values, p):
              xs = sorted(float(x) for x in values)
              if not xs:
                  return None
              if len(xs) == 1:
                  return xs[0]
              k = (len(xs) - 1) * p
              lo = math.floor(k)
              hi = math.ceil(k)
              if lo == hi:
                  return xs[lo]
              return xs[lo] + (xs[hi] - xs[lo]) * (k - lo)

          def stats(values):
              xs = [float(x) for x in values]
              return {
                  "n": len(xs),
                  "min": min(xs),
                  "p05": q(xs, 0.05),
                  "p25": q(xs, 0.25),
                  "median": statistics.median(xs),
                  "mean": statistics.fmean(xs),
                  "p75": q(xs, 0.75),
                  "p95": q(xs, 0.95),
                  "max": max(xs),
              }

          rows = []
          for c in challenges:
              assert int(c.get("package_size")) == 3
              target_fv = float(c["target_fv"])
              package = c.get("package") or []
              assert len(package) == 3
              raw_vals = [float(p["fv"]) for p in package]
              assert all(v < target_fv for v in raw_vals)

              meaningful = [v for v in raw_vals if v >= MEANINGFUL_TARGET_SHARE * target_fv]
              assert len(meaningful) == 3, (c["id"], target_fv, raw_vals)

              vals = sorted(meaningful, reverse=True)
              meaningful_total = sum(vals)
              pkg_shares = [v / meaningful_total for v in vals]
              tgt_shares = [v / target_fv for v in vals]

              # Catalog order should already correspond to 45/33/22, but sort independently
              # so the audit measures composition rather than trusting generator ordering.
              rows.append({
                  "id": c["id"],
                  "ratio_target": float(c["ratio_target"]),
                  "raw_package_to_target_ratio": float(c["raw_package_to_target_ratio"]),
                  "target_tier": str(c.get("target_tier") or "unknown"),
                  "target_position": str((c.get("target") or {}).get("pos") or "unknown"),
                  "target_fv": target_fv,
                  "largest_package_share": pkg_shares[0],
                  "middle_package_share": pkg_shares[1],
                  "smallest_package_share": pkg_shares[2],
                  "largest_to_target": tgt_shares[0],
                  "middle_to_target": tgt_shares[1],
                  "smallest_to_target": tgt_shares[2],
                  "largest_nominal_abs_error": abs(pkg_shares[0] - NOMINAL_PACKAGE_SHARES[0]),
                  "middle_nominal_abs_error": abs(pkg_shares[1] - NOMINAL_PACKAGE_SHARES[1]),
                  "smallest_nominal_abs_error": abs(pkg_shares[2] - NOMINAL_PACKAGE_SHARES[2]),
              })

          metrics = [
              "raw_package_to_target_ratio",
              "largest_package_share",
              "middle_package_share",
              "smallest_package_share",
              "largest_to_target",
              "middle_to_target",
              "smallest_to_target",
              "largest_nominal_abs_error",
              "middle_nominal_abs_error",
              "smallest_nominal_abs_error",
          ]

          def summarize(group_rows):
              return {m: stats([r[m] for r in group_rows]) for m in metrics}

          def grouped(field):
              buckets = defaultdict(list)
              for r in rows:
                  buckets[r[field]].append(r)
              return {
                  str(k): {
                      "count": len(v),
                      "metrics": summarize(v),
                  }
                  for k, v in sorted(buckets.items(), key=lambda kv: str(kv[0]))
              }

          overall = summarize(rows)
          smallest = [r["smallest_package_share"] for r in rows]
          largest = [r["largest_package_share"] for r in rows]
          middle = [r["middle_package_share"] for r in rows]

          empirical_envelope = {
              "package_share_rectangular_hull": {
                  "largest": [min(largest), max(largest)],
                  "middle": [min(middle), max(middle)],
                  "smallest": [min(smallest), max(smallest)],
              },
              "piece_to_target_rectangular_hull": {
                  "largest": [min(r["largest_to_target"] for r in rows), max(r["largest_to_target"] for r in rows)],
                  "middle": [min(r["middle_to_target"] for r in rows), max(r["middle_to_target"] for r in rows)],
                  "smallest": [min(r["smallest_to_target"] for r in rows), max(r["smallest_to_target"] for r in rows)],
              },
              "max_absolute_deviation_from_nominal_package_share": {
                  "largest": max(r["largest_nominal_abs_error"] for r in rows),
                  "middle": max(r["middle_nominal_abs_error"] for r in rows),
                  "smallest": max(r["smallest_nominal_abs_error"] for r in rows),
              },
          }

          live_16 = {
              "current_cutoff": CURRENT_LIVE_MATERIAL_THIRD_PACKAGE_SHARE,
              "frozen_v4_below_current_cutoff_count": sum(s < CURRENT_LIVE_MATERIAL_THIRD_PACKAGE_SHARE for s in smallest),
              "frozen_v4_at_or_above_current_cutoff_count": sum(s >= CURRENT_LIVE_MATERIAL_THIRD_PACKAGE_SHARE for s in smallest),
              "empirical_min_smallest_package_share": min(smallest),
              "empirical_median_smallest_package_share": statistics.median(smallest),
              "empirical_max_smallest_package_share": max(smallest),
              "gap_between_empirical_min_and_live_cutoff": min(smallest) - CURRENT_LIVE_MATERIAL_THIRD_PACKAGE_SHARE,
          }

          # Record exact boundary rows so later implementation tests can replay them.
          boundary_rows = {}
          for metric in (
              "largest_package_share", "middle_package_share", "smallest_package_share",
              "largest_to_target", "middle_to_target", "smallest_to_target",
          ):
              boundary_rows[metric] = {
                  "min": min(rows, key=lambda r: r[metric]),
                  "max": max(rows, key=lambda r: r[metric]),
              }

          payload = {
              "schema_version": 1,
              "status": "audit_step2_v4_composition_analysis",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": {
                  "v4_path": str(V4.relative_to(ROOT)),
                  "v4_sha256": protected_before["v4_catalog"],
                  "v3_sha256": protected_before["v3_catalog"],
                  "index_sha256": protected_before["index.html"],
                  "challenge_count": len(rows),
                  "frozen": True,
              },
              "important_interpretation": [
                  "V4 experimentally varied package/target ratio, not package composition.",
                  "The 45/33/22 composition was a fixed design target, so observed composition spread is construction noise around that target, not direct preference evidence for arbitrary 3-player shapes.",
                  "The empirical envelope below must not be described as validating composition outside the frozen catalog.",
                  "This analysis makes no production code changes.",
              ],
              "overall": overall,
              "empirical_envelope": empirical_envelope,
              "live_16_percent_comparison": live_16,
              "by_ratio_target": grouped("ratio_target"),
              "by_target_tier": grouped("target_tier"),
              "by_target_position": grouped("target_position"),
              "boundary_rows": boundary_rows,
              "rows": rows,
          }

          OUT_JSON.parent.mkdir(parents=True, exist_ok=True)
          OUT_JSON.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def pct(x):
              return f"{100.0 * float(x):.3f}%"

          def range_text(metric):
              s = overall[metric]
              return f"{pct(s['min'])} – {pct(s['max'])} (median {pct(s['median'])}, p05–p95 {pct(s['p05'])} – {pct(s['p95'])})"

          lines = [
              "# Package Adjustment Audit Step 2 — Frozen V4 Composition Analysis",
              "",
              f"Generated: {payload['generated_at_utc']}",
              "",
              "## Scope",
              "",
              "Read-only analysis of the 100 frozen V4 3-player challenges. No production formula, FV, MV, Team Utility, pick value, or UI code is changed by this workflow.",
              "",
              "## Experimental interpretation",
              "",
              "V4 varied the package/target ratio across 1.75, 1.85, 1.95, 2.05, and 2.15 while holding the intended package composition at approximately 45/33/22. Therefore, the observed composition spread is construction noise around a fixed design, not evidence that arbitrary 3-player compositions were tested.",
              "",
              "## Overall empirical composition",
              "",
              f"- Largest piece / meaningful package FV: **{range_text('largest_package_share')}**",
              f"- Middle piece / meaningful package FV: **{range_text('middle_package_share')}**",
              f"- Smallest piece / meaningful package FV: **{range_text('smallest_package_share')}**",
              f"- Largest piece / target FV: **{range_text('largest_to_target')}**",
              f"- Middle piece / target FV: **{range_text('middle_to_target')}**",
              f"- Smallest piece / target FV: **{range_text('smallest_to_target')}**",
              "",
              "## Current 16% production guardrail comparison",
              "",
              f"- Frozen V4 challenges below 16% smallest-piece package share: **{live_16['frozen_v4_below_current_cutoff_count']} / {len(rows)}**",
              f"- Empirical minimum smallest-piece package share: **{pct(live_16['empirical_min_smallest_package_share'])}**",
              f"- Empirical median smallest-piece package share: **{pct(live_16['empirical_median_smallest_package_share'])}**",
              f"- Empirical maximum smallest-piece package share: **{pct(live_16['empirical_max_smallest_package_share'])}**",
              f"- Gap from live 16% cutoff to empirical minimum: **{pct(live_16['gap_between_empirical_min_and_live_cutoff'])}**",
              "",
              "## Rectangular empirical hull",
              "",
              f"- Largest package share: **{pct(empirical_envelope['package_share_rectangular_hull']['largest'][0])} – {pct(empirical_envelope['package_share_rectangular_hull']['largest'][1])}**",
              f"- Middle package share: **{pct(empirical_envelope['package_share_rectangular_hull']['middle'][0])} – {pct(empirical_envelope['package_share_rectangular_hull']['middle'][1])}**",
              f"- Smallest package share: **{pct(empirical_envelope['package_share_rectangular_hull']['smallest'][0])} – {pct(empirical_envelope['package_share_rectangular_hull']['smallest'][1])}**",
              "",
              "## Grouped checks",
              "",
          ]

          for label, field in (("Ratio target", "by_ratio_target"), ("Target tier", "by_target_tier"), ("Target position", "by_target_position")):
              lines.append(f"### {label}")
              lines.append("")
              lines.append("| Group | N | Largest package share | Middle package share | Smallest package share | Smallest / target FV |")
              lines.append("|---|---:|---:|---:|---:|---:|")
              for key, block in payload[field].items():
                  m = block["metrics"]
                  lines.append(
                      f"| {key} | {block['count']} | {pct(m['largest_package_share']['mean'])} | "
                      f"{pct(m['middle_package_share']['mean'])} | {pct(m['smallest_package_share']['mean'])} | "
                      f"{pct(m['smallest_to_target']['mean'])} |"
                  )
              lines.append("")

          lines += [
              "## Audit conclusion from this gate",
              "",
              "This report intentionally does **not** select or deploy a new production policy. Its purpose is to establish the exact frozen V4 composition support before choosing between a conservative smooth bridge and a fail-closed composition envelope.",
              "",
              "The next audit action should inspect this artifact and choose the safest evidence-bounded policy. Production must not be patched until that review is complete.",
              "",
          ]

          OUT_MD.write_text("\n".join(lines), encoding="utf-8")

          protected_after = {
              "index.html": sha256(INDEX),
              "v3_catalog": sha256(V3),
              "v4_catalog": sha256(V4),
          }
          assert protected_after == protected_before, (protected_before, protected_after)

          print("Step 2 V4 composition analysis complete")
          print("V4 challenges:", len(rows))
          print("Smallest package-share range:", min(smallest), max(smallest))
          print("Largest package-share range:", min(largest), max(largest))
          print("Middle package-share range:", min(middle), max(middle))
          print("Frozen V4 below live 16%:", live_16["frozen_v4_below_current_cutoff_count"])
          print("Wrote:", OUT_JSON.relative_to(ROOT))
          print("Wrote:", OUT_MD.relative_to(ROOT))
          PY

      - name: Verify production and frozen evidence were not changed
        run: |
          git diff --exit-code -- index.html \
            research/package-adjustment-v3/package_vote_challenges_v3.json \
            research/package-adjustment-v4/package_vote_challenges_v4.json

      - name: Commit Step 2 analysis artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/package-adjustment-production-candidate-v1/audit_step2_v4_composition_analysis.json \
            research/package-adjustment-production-candidate-v1/audit_step2_v4_composition_analysis.md

          if git diff --cached --quiet; then
            echo "No analysis artifact changes to commit."
            exit 0
          fi

          git commit -m "Analyze frozen V4 package composition"
          git pull --rebase origin main
          git push origin HEAD:main
