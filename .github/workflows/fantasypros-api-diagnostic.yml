name: FantasyPros API Diagnostic

# Small, deliberately boring first step for the FantasyPros API pivot --
# per the project's own stated philosophy, this makes ONE careful
# authenticated request to answer real questions (does the key work,
# which base URL is correct, what's the real schema, does IDP work,
# are milestone-bonus fields present) BEFORE any production pipeline
# gets built around assumptions.
#
# SECURITY: the API key is injected only as an environment variable from
# a GitHub Actions secret -- never logged, never committed, never
# hardcoded. The script itself has a tested redaction safety property as
# defense in depth. Do not add a step that echoes $FANTASYPROS_API_KEY.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasypros-api-diagnostic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: TEMPORARY -- check key length only (never prints the value)
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python3 -c "
          import os
          key = os.environ.get('FANTASYPROS_API_KEY')
          if key is None:
              print('DIAGNOSIS: the env var is completely unset (None) -- the secret is not reaching this step at all.')
          elif key == '':
              print('DIAGNOSIS: the env var is set but EMPTY (zero characters) -- the secret likely has no real value saved.')
          elif key.strip() != key:
              print(f'DIAGNOSIS: the key has leading/trailing whitespace -- real length {len(key)}, trimmed length {len(key.strip())}.')
          else:
              print(f'DIAGNOSIS: the key looks present and clean -- length {len(key)} characters. If the real script still fails, the problem is elsewhere, not the secret itself.')
          "

      - name: Self-test before trusting real output (including the key-redaction safety property)
        run: python3 scripts/fantasypros_api_diagnostic.py --selftest

      - name: Run the diagnostic
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python3 scripts/fantasypros_api_diagnostic.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fantasypros_api_diagnostic_output.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run FantasyPros API diagnostic"
          git push
