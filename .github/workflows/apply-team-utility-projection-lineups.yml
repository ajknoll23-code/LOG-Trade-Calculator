name: Apply Team Utility Projection Lineups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python3 -m pip install requests

      - name: Verify current Team Utility projection artifact
        run: python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Self-test production patch
        run: python3 scripts/maintenance/apply_team_utility_projection_lineups.py --selftest

      - name: Apply projection-selected Team Utility lineups
        run: python3 scripts/maintenance/apply_team_utility_projection_lineups.py --apply

      - name: Run full repository regression checks
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Show production diff
        run: |
          git status --short
          git diff --stat
          git diff --check

      - name: Commit Team Utility starter-objective deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            .github/workflows/scheduled-data-refresh.yml \
            scripts/validation/repo_regression_checks.py

          if git diff --cached --quiet; then
            echo "No Team Utility production changes to commit."
            exit 0
          fi

          git commit -m "Use projections for Team Utility starter selection"
          git push
