name: CAL26 V1R45 - QB Empirical Surplus Numerical Shadow Reference Bridge (Read Only)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r45-empirical-qb-reference-shadow-readonly
  cancel-in-progress: false

jobs:
  qb-numerical-reference-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen source reference without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify R42 R43 R44 real data and compute 54 QB numerical shadow reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r45_engine.py" <<'PY_CAL26_V1R45_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R45: audited, position-conserving QB shadow point reallocation.
          FUTURE-OUTCOME HOLDOUTS NEVER READ; LIVE FV NEVER CHANGED.
          Inputs: verified immutable published R42, R43, R44 GitHub Actions artifacts; frozen P2.
          """
          from __future__ import annotations
          import argparse,csv,hashlib,io,json,math,os,re,statistics,sys,urllib.request,zipfile
          from collections import Counter
          from pathlib import Path

          PREFIX='CAL26_V1R45'
          FROZEN='research/production-v2/production_v2_phase2_preseason_baseline.json'
          FROZEN_BLOB='ed5025134ca5992b460fa8b850033f82d7ea450f'
          # Real GitHub archives and published uploaded-archive checksums, reviewed 2026-10-23.
          SRC={
          42:dict(run=40021246762,artifact=12529839028,zip_sha='614efa8b5624c8014aed546d3030c54357b69319bcb1e03d9284ae0b98e8a948',manifest='CAL26_V1R42_manifest.json',name='CAL26_V1R42_HISTORICAL_QB_RESEARCH_ONLY'),
          43:dict(run=40023582418,artifact=12530893863,zip_sha='fa2c4804ce78a34ac842be998d558d66551b3ff3f4e73d9e6639dcfdd102e0a4',manifest='CAL26_V1R43_decision_manifest.json',name='CAL26_V1R43_HISTORICAL_QB_VALIDATION_ADJUDICATION_READ_ONLY'),
          44:dict(run=40025328094,artifact=12531599900,zip_sha='5cc4eb8b424826cc8eecc39c7cc868e5ffeccad789c5215b472c1328b232cf7a',manifest='CAL26_V1R44_manifest.json',name='CAL26_V1R44_QB_SCORING_TIER_TRANSFER_RESEARCH_ONLY'),
          }
          TIERS=('below_090','near_090_110','above_110'); HORIZONS=(1,2,3); PARTIAL=12
          FOCUS=('bryce young','jayden daniels','cj stroud','caleb williams','drake maye')


          def check(condition,message):
              if not condition:raise AssertionError(message)

          def sha(bs):return hashlib.sha256(bs).hexdigest()

          def csvread(bs):
              a=list(csv.DictReader(io.StringIO(bs.decode('utf-8-sig'))));check(bool(a),'EMPTY_CSV');return a

          def csvtext(rows,fields):
              out=io.StringIO(newline='');w=csv.DictWriter(out,fieldnames=fields,lineterminator='\n',extrasaction='ignore');w.writeheader();w.writerows([{k:row.get(k,'') for k in fields} for row in rows]);return out.getvalue()

          def download_zip(repo,source,token):
              check(re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo or '') is not None,'REPO_INVALID')
              check(bool(token),'GH_TOKEN_REQUIRED')
              url=f'https://api.github.com/repos/{repo}/actions/artifacts/{source["artifact"]}/zip'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'CAL26-V1R45-ReadOnly'})
              with urllib.request.urlopen(req,timeout=60) as response:blob=response.read(3_000_000)
              check(0<len(blob)<3_000_000,'ARCHIVE_BYTE_LIMIT')
              return blob

          def safezip(blob):
              check(blob[:4]==b'PK\x03\x04','NOT_ZIP_ARCHIVE')
              files={}
              with zipfile.ZipFile(io.BytesIO(blob)) as z:
                  check(len(z.infolist())<=15,'ZIP_ENTRY_COUNT')
                  for info in z.infolist():
                      fn=info.filename
                      check(not fn.startswith('/') and '/' not in fn and '\\' not in fn and '..' not in fn,'ZIP_UNSAFE_ENTRY')
                      check(fn not in files,'ZIP_DUPLICATE_ENTRY')
                      check(info.file_size<350_000,'ZIP_ENTRY_TOO_LARGE')
                      if not info.is_dir():files[fn]=z.read(info)
              return files

          def load_artifacts(local_dir=None,repo='',token=''):
              loaded={};meta={}
              for i,s in SRC.items():
                  if local_dir:
                      filename={42:'CAL26_V1R42_Real_Results.zip',43:'CAL26_V1R43_Real_Results.zip',44:'CAL26_V1R44_actual.zip'}[i]
                      blob=(Path(local_dir)/filename).read_bytes()
                  else:blob=download_zip(repo,s,token)
                  check(sha(blob)==s['zip_sha'],f'R{i}_ORIGINAL_ARCHIVE_SHA_MISMATCH')
                  files=safezip(blob)
                  check(s['manifest'] in files,f'R{i}_MANIFEST_MISSING')
                  m=json.loads(files[s['manifest']])
                  hashes=m.get('output_sha256') or m.get('outputs_sha256')
                  check(bool(hashes),f'R{i}_OUTPUT_SHA_MISSING')
                  check(set(files)==set(hashes)|{s['manifest']},f'R{i}_ARCHIVE_MEMBERS_DRIFT')
                  for fn,h in hashes.items():check(sha(files[fn])==h,f'R{i}_FILE_TAMPERED_{fn}')
                  loaded[i]=(files,m)
                  meta[i]={'run_id':s['run'],'artifact_id':s['artifact'],'archive_sha256':s['zip_sha'],'artifact_name':s['name']}
              return loaded,meta

          def tier(x):return TIERS[0] if x<.9 else TIERS[1] if x<1.1 else TIERS[2]

          def age_band(x):return '<=24' if x<=24 else '25-28' if x<=28 else '29-32' if x<=32 else '33-36' if x<=36 else '37+'

          def invert_conditional_pools(cells,field,h):
              """Invert R42's 12+12 partial pooling to recover its tier-only estimates.
              R42 publishes rounded age×tier means and local/tier sample sizes but no raw cases.
              This reconstruction is within rounding error (<~5e-6), not raw-row access.
              """
              rows=[x for x in cells if int(x['horizon'])==h]
              check(len(rows)==15,f'H{h}_AGE_TIER_GRID_SIZE')
              by={t:[x for x in rows if x['baseline_tier']==t] for t in TIERS}
              n={t:int(by[t][0]['tier_n']) for t in TIERS}
              B={}
              for t in TIERS:
                  rr=by[t];check(len(rr)==5 and len({x['age_band'] for x in rr})==5,'AGE_BAND_GRID_DRIFT')
                  check(len({int(x['tier_n']) for x in rr})==1,'INCONSISTENT_TIER_N')
                  check(sum(int(x['local_n']) for x in rr)==n[t],'LOCAL_N_SUM_MISMATCH')
                  B[t]=sum((int(x['local_n'])+PARTIAL)*float(x[field]) for x in rr)
              N=sum(n.values());den=N+len(TIERS)*PARTIAL-sum(PARTIAL*(n[t]+PARTIAL)/(n[t]+PARTIAL*(5+1)) for t in TIERS)
              numer=sum((n[t]+PARTIAL)*B[t]/(n[t]+PARTIAL*(5+1)) for t in TIERS)
              check(den>1,'PARTIAL_POOL_INVERSION_DENOMINATOR')
              global_mu=numer/den
              out={t:(B[t]+PARTIAL*global_mu)/(n[t]+PARTIAL*(5+1)) for t in TIERS}
              check(all(math.isfinite(v) and 0<=v<3 for v in out.values()),'INVERSION_VALUE_INVALID')
              # Reconstruct implied unrounded local outcome totals and check feasible positivity.
              for t,rr in by.items():
                  for x in rr:
                      nn=int(x['local_n']);mean=float(x[field]);ys=(nn+PARTIAL)*mean-PARTIAL*out[t]
                      check(ys>=-0.00008,f'IMPLIED_NEGATIVE_OUTCOME_H{h}_{t}_{field}')
                      if field!='future_ratio_surplus':check(ys<=nn+0.00008,f'IMPLIED_OUTCOME_GT_N_H{h}_{t}_{field}')
              return out,global_mu,n

          def validate_manifest_sources(loaded):
              (a,am),(b,bm),(c,cm)=(loaded[i] for i in (42,43,44))
              check(am['semantic_status']=='HISTORICAL_EMPIRICAL_RESEARCH_ONLY_PRICE_CALIBRATION_HOLD','R42_STATUS_DRIFT')
              check(am['validated_horizons']==[1,2,3] and am['unvalidated_horizons']==[4],'R42_VALIDATED_HORIZON_DRIFT')
              check(am['n_historical_QB_seasons']==988 and am['n_2026_frozen_forward_QBs']==54,'R42_COHORT_DRIFT')
              check(am['frozen_preseason_git_blob_pin']==FROZEN_BLOB,'R42_PRESEASON_PIN_DRIFT')
              check(bm['R42_artifact_zip_sha256']==SRC[42]['zip_sha'],'R43_R42_CHAIN_BROKEN')
              check(bm['semantic_status']=='HISTORICAL_HOLDOUT_REVIEW_COMPLETE_FV_PRICE_CALIBRATION_HOLD','R43_STATUS_DRIFT')
              check(bm['model_best_of_three_row_counts']=={'age_tier':3,'tier_only':6},'R43_VERDICTS_DRIFT')
              check(cm['semantic_status']=='SCORING_SENSITIVITY_RESEARCH_ONLY_TRANSFER_AND_FV_PRICE_HOLD','R44_STATUS_DRIFT')
              check(cm['frozen_P2_git_blob_sha']==FROZEN_BLOB,'R44_PRESEASON_SHA_DRIFT')
              for k in ['2026_weeks_8_to_12_holdout_read','2026_weeks_13_to_18_holdout_read','LOG_complete_QB_scoring_config_verified']:
                  check(cm[k] is False,'R44_GUARD_DRIFT_'+k)
              val=csvread(b['CAL26_V1R43_validation_comparisons.csv']);check(len(val)==9,'R43_VALIDATION_ROW_DRIFT')
              check(all(float(x['tier_loss'])<float(x['global_loss']) for x in val),'R43_TIER_LOST_TO_GLOBAL')
              score=csvread(c['CAL26_V1R44_historical_validation_scoring_scenarios.csv']);check(len(score)==36,'R44_SCENARIO_GRID_DRIFT')
              check(all(x['tier_better_than_global']=='True' for x in score),'R44_TIER_GLOBAL_COMPARISON_DRIFT')
              migrations=csvread(c['CAL26_V1R44_tier_migration_summary.csv']);check(len(migrations)==4,'R44_MIGRATION_GRID_DRIFT')
              check(max(float(x['tier_changed_pct']) for x in migrations)<=4,'R44_SCORING_SENSITIVITY_DRIFT')
              transfers=csvread(c['CAL26_V1R44_2025_history_2026_preseason_tier_diagnostic.csv'])
              check(len(transfers)==31 and sum(int(x['tier_changed']) for x in transfers)==16,'R44_PRESEASON_TRANSFER_DRIFT')
              return {x['name'] for x in transfers},val,score,migrations

          def load_frozen_reference(repo,rows,allow_fixture):
              if allow_fixture:
                  return {r['name']:{'pos':'QB','age':int(r['age_2026_frozen']), 'canonical_forward_2026_points':float(r['frozen_2026_forward']), 'current_fundamental_value':int(r['frozen_FV_reference_only'])} for r in rows}
              import subprocess
              p=Path(repo)/FROZEN;check(p.is_file(),'FROZEN_P2_MISSING')
              blob=subprocess.check_output(['git','hash-object','--',str(p)],cwd=repo,text=True).strip()
              check(blob==FROZEN_BLOB,'FROZEN_P2_GIT_BLOB_DRIFT')
              obj=json.loads(p.read_text())
              check(obj['status']=='FROZEN_PRESEASON_BASELINE_RESEARCH_ONLY' and obj['production_mutation_authorized'] is False,'FROZEN_P2_STATUS_DRIFT')
              q={n:x for n,x in obj['frozen_players'].items() if x.get('pos')=='QB'}
              check(len(q)==64,'FROZEN_QB_COVERAGE_DRIFT')
              return q

          def make_analyses(loaded,repo,fixture):
              strict,validation,scoring,migrations=validate_manifest_sources(loaded)
              r42=loaded[42][0];cells=csvread(r42['CAL26_V1R42_60_conditional_horizon_cells.csv']);rows=csvread(r42['CAL26_V1R42_54_QB_empirical_shadow.csv']);check(len(cells)==60 and len(rows)==54,'R42_AGGREGATE_ROW_COUNT_DRIFT')
              frozen=load_frozen_reference(repo,rows,fixture)
              # H4 excluded, even from scenario pricing. Only R43 validated H1-H3 survive.
              recovered=[];means={};raw_age={}
              for h in HORIZONS:
                  for outcome in ('future_ratio_surplus','p_QB24','p_150_attempts'):
                      means[(h,outcome)],g,n=invert_conditional_pools(cells,outcome,h)
                      for t in TIERS:recovered.append({'horizon':h,'outcome':outcome,'tier':t,'n_tier':n[t], 'reconstructed_tier_only_mean':round(means[(h,outcome)][t],8), 'global_mean':round(g,8),'source':'inverted_R42_published_rounded_12plus12_pooling'})
              for x in cells:raw_age[(int(x['horizon']),x['baseline_tier'],x['age_band'])]=x
              # Frozen QB inventory: preserve exact multiset of 54 existing values.
              q24=270.855;ob=[]
              for x in rows:
                  n=x['name'];f=frozen.get(n);check(f is not None,f'R42_QB_NOT_IN_P2_{n}')
                  p=float(x['frozen_2026_forward']);fv=int(x['frozen_FV_reference_only']);age=int(x['age_2026_frozen']);rr=p/q24
                  check(f['pos']=='QB' and f['age']==age and abs(f['canonical_forward_2026_points']-p)<.001 and f['current_fundamental_value']==fv,'P2_R42_PLAYER_PARITY_'+n)
                  check(abs(float(x['QB24_2026_frozen'])-q24)<1e-7 and x['baseline_tier']==tier(rr),'FROZEN_QB24_OR_TIER_DRIFT_'+n)
                  r={'name':n,'age':age,'preseason_2026_projected_points':p,'proj_over_QB24':round(rr,6),'tier':tier(rr),'frozen_FV':fv,'strict_31_data_cohort':n in strict}
                  r['year0_ratio_surplus']=max(0,rr-1)
                  for h in HORIZONS:
                      r[f'h{h}_tier_surplus']=means[(h,'future_ratio_surplus')][r['tier']]
                      r[f'h{h}_tier_prob_above_QB24']=means[(h,'p_QB24')][r['tier']]
                      r[f'h{h}_tier_prob_pass_150']=means[(h,'p_150_attempts')][r['tier']]
                      r[f'h{h}_age_tier_surplus']=float(raw_age[h,r['tier'],age_band(age)]['future_ratio_surplus'])
                  ob.append(r)
              check(len(ob)==54 and len({x['name'] for x in ob})==54 and sum(x['strict_31_data_cohort'] for x in ob)==31,'SHADOW_POPULATION_DRIFT')
              check(all(name in {x['name'] for x in ob} for name in FOCUS),'FOCUS_QB_DRIFT')
              # Rank-transplant pricing: applies ranked preexisting 54-FV distribution.
              # No learned FV/$ conversion, no owner desired values, no cross-position revaluation.
              original_fv=sorted([r['frozen_FV'] for r in ob],reverse=True)
              frozen_order=sorted(ob,key=lambda r:(-r['frozen_FV'],r['name']))
              old_rank={r['name']:i+1 for i,r in enumerate(frozen_order)}
              cases=[('base_equal_year_weights',1.0,False),('discount_15pct_yearly',.85,False),('age_tier_h3_equal_weights',1.0,True),('age_tier_h3_discount15',.85,True)]
              case_results=[];case_stats=[]
              for case,d,age_h3 in cases:
                  order=[]
                  for x in ob:
                      u=x['year0_ratio_surplus']
                      for h in HORIZONS:
                          ev=x[f'h{h}_age_tier_surplus'] if h==3 and age_h3 else x[f'h{h}_tier_surplus']
                          u+=(d**h)*ev
                      order.append((x['name'],u))
                  # A tier-only model cannot distinguish equal-utility players. NEVER break
                  # those ties alphabetically; retain prior frozen FV ordering and flag them.
                  frozen_lookup={x['name']:x['frozen_FV'] for x in ob}
                  ties=Counter(u for nm,u in order)
                  order.sort(key=lambda x:(-x[1],-frozen_lookup[x[0]],x[0]))
                  ranks={nm:(i+1,u,original_fv[i],ties[u]) for i,(nm,u) in enumerate(order)}
                  check(sum(t[2] for t in ranks.values())==sum(original_fv),'NON_CONSERVATION_OF_TOTAL_QB_POINTS')
                  for x in ob:
                      nr,u,points,tiesize=ranks[x['name']];case_results.append({'scenario':case,'name':x['name'],'age':x['age'],'strict_31_data_cohort':x['strict_31_data_cohort'],
                          'projection':round(x['preseason_2026_projected_points'],3),'tier':x['tier'],
                          'frozen_FV':x['frozen_FV'],'frozen_rank':old_rank[x['name']],
                          'surplus_2026_to_2029_index':round(u,6),'shadow_rank':nr,'quantile_reallocated_FV_reference_points':points,
                          'points_delta_NOT_APPROVED':points-x['frozen_FV'],'rank_change':old_rank[x['name']]-nr,
                          'indistinguishable_tier_only_tie_size':tiesize,'tie_break_keeps_prior_frozen_fv':tiesize>1,
                          'numeric_FV_price_calibrated':False,'live_price_mutation_authorized':False})
                  ref=[r for r in case_results if r['scenario']==case]
                  case_stats.append({'scenario':case,'n_players':len(ref),'strict_cohort_n':sum(r['strict_31_data_cohort'] for r in ref),
                      'points_multiset_preserved':sorted(r['quantile_reallocated_FV_reference_points'] for r in ref)==sorted(original_fv),
                      'count_abs_price_change_gt_1000':sum(abs(r['points_delta_NOT_APPROVED'])>1000 for r in ref),
                      'median_abs_rank_displacement':statistics.median(abs(r['rank_change']) for r in ref),
                      'max_abs_rank_displacement':max(abs(r['rank_change']) for r in ref),
                      'largest_undifferentiated_tie_group':max(r['indistinguishable_tier_only_tie_size'] for r in ref),
                      'n_players_in_ties':sum(r['indistinguishable_tier_only_tie_size']>1 for r in ref)})
              base={x['name']:x for x in case_results if x['scenario']=='base_equal_year_weights'}
              scenario_variability=[]
              for n in sorted(base):
                  batch=[x for x in case_results if x['name']==n]
                  low=min(x['quantile_reallocated_FV_reference_points'] for x in batch)
                  high=max(x['quantile_reallocated_FV_reference_points'] for x in batch)
                  scenario_variability.append({'name':n,'frozen_FV':base[n]['frozen_FV'], 'base_reference_points':base[n]['quantile_reallocated_FV_reference_points'],
                      'min_reallocated_points_across_four_scenarios':low,'max_reallocated_points_across_four_scenarios':high,'scenario_spread_points':high-low,
                      'strict_cohort':base[n]['strict_31_data_cohort']})
              return ob,case_results,case_stats,recovered,scenario_variability,validation,migrations

          def build_report(obs,res,stats,pools,vol,validation,migrations):
              base=[r for r in res if r['scenario']=='base_equal_year_weights'];base.sort(key=lambda x:x['shadow_rank']);by={r['name']:r for r in base}
              h3=next(r for r in validation if int(r['horizon'])==3 and r['outcome']=='future_surplus')
              def focusrow(n):
                  x=by[n];v=next(q for q in vol if q['name']==n)
                  return f"| {n.title()} | {x['frozen_FV']:,} | {x['quantile_reallocated_FV_reference_points']:,} | {x['points_delta_NOT_APPROVED']:+,} | {x['frozen_rank']} → {x['shadow_rank']} | {v['min_reallocated_points_across_four_scenarios']:,}–{v['max_reallocated_points_across_four_scenarios']:,} |"
              top_up=sorted(base,key=lambda x:-x['points_delta_NOT_APPROVED'])[:5]
              top_dn=sorted(base,key=lambda x:x['points_delta_NOT_APPROVED'])[:5]
              report=['# CAL26 V1R45 — First numerical QB FV reference reallocation (NOT independently priced)', '',
                '**Status: SHADOW_NUMERIC_QB_FV_REFERENCE_ONLY — PRODUCTION HOLD.**', '',
                '## Verified R44 outcome',
                'R44 scored 988 historical QB seasons. Tier-only beaten global comparator 9/9 tests across all four investigated scoring scenarios. Scoring tier changes were at most 3.92% (among 510 historical qualified QB-seasons); 2025 shrunk-history versus 2026 preseason tier disagreement was 16/31 (51.6%). The latter is not a dated independent preseason backtest.',
                '', '## Numerical shadow methodology',
                '1. Source: SHA-verified original R42, R43 and R44 GitHub artifacts; frozen P2 2026 preseason board (Git blob pin). No new external data or 2026 actual-week holdouts.',
                '2. Reconstruct **tier-only** R42 expected future QB24-normalized surplus for 2027, 2028 and 2029 directly from R42 published age×tier partial-pooled cells. Source rounded to six decimals; recovered means are approximately reconstructed, not raw individual outcomes.',
                '3. Use 2026 preseason projected points divided by frozen 2026 QB24 (270.855) for the year-zero normalized surplus. For h=1–3, add historical tier-conditional expected ratio surplus. This is a **transport assumption** because history used prior realized seasons. No 2030 H4 forecast is used.',
                '4. Central scenario assigns equal weights to 2026–2029 annual QB24-relative surplus. Compare an assumed 15% annual discount and alternatives using age×tier only at H3 (R43 found a small H3 age+ tier advantage). These weights are scenario choices **not validated discount rates**.',
                '5. Sort all 54 QBs by index and redistribute the **existing 54 frozen quarterback FV numbers** in descending order. Thus total QB FV reference points and the exact numeric multiset are unchanged; **these are quantile-reallocated reference points, not independently calibrated FV, market quotes or recommended live changes**.',
                '6. Any QBs with **identical** model surplus remain internally ordered by existing frozen FV, never alphabetically. Their relative prices are **not identifiable** from this evidence; this is not evidence for changed relative values inside tied groups.',
                '7. The 31-QB dual-source real-history subset is flagged separately; 23 others lack the same evidence coverage. Cross-position scarcity, dynasty option value, team roles, 2026 forecast calibration, injuries and exact league QB scoring remain unresolved.',
                '', '## Focus players — reference-only numerical shadow',
                '| QB | Frozen Sept FV | Equal-weight rank-reallocation points | Delta NOT APPROVED | Rank old→new | Four-scenario point interval |',
                '|---|---:|---:|---:|---|---:|']
              for n in FOCUS:report.append(focusrow(n))
              report+=['', '## Largest reference point changes (diagnostic)', '',
                '| Direction | QB | Frozen FV | Reallocated points | Delta | Age |','|---|---|---:|---:|---:|---:|']
              for direction,items in [('Increase',top_up),('Decrease',top_dn)]:
                for x in items:report.append(f"| {direction} | {x['name']} | {x['frozen_FV']:,} | {x['quantile_reallocated_FV_reference_points']:,} | {x['points_delta_NOT_APPROVED']:+,} | {x['age']} |")
              report+=['', '## Scenario stability', '| Scenario | n | Median absolute rank movement | >1000-point relocations | Max identical-utility tie | Preserve all 54 original point values |', '|---|---:|---:|---:|---:|---|' ]
              for s in stats:report.append(f"| {s['scenario']} | {s['n_players']} | {s['median_abs_rank_displacement']:.1f} | {s['count_abs_price_change_gt_1000']} | {s['largest_undifferentiated_tie_group']} | {s['points_multiset_preserved']} |")
              report+=['','## Predictive context / limitations',
                f"R43 year-3 future-surplus loss: age+tier {float(h3['age_tier_loss']):.6f} vs tier-only {float(h3['tier_loss']):.6f}. The age gain is small and only 39 validation cases were available at H3. Using age-by-tier at H3 is an exploratory alternative, not an approved age curve.",
                'The default equal-weight scenario places many below-replacement preseason QBs into a large exact-value tie. Such players cannot be reliably ranked against one another by the available historical tier-only model; frozen FV is used solely as the deterministic tie-break. This is a structural model limitation, not a calibrated result.',
                'Because a 54-player rank-reallocation retains the existing value distribution, it cannot establish a new cross-position FV scale. In particular a nominal +1,000-point player movement **does not prove** the player is 1,000 points underpriced.',
                'The model may overpromote veterans with high one-year forecasts because it largely ignores career-duration uncertainty. It may undervalue developing or injured young quarterbacks because they have below-replacement current projections. These are flags for further investigation, not reasons to hand-adjust player values.',
                'The 15 conditional live `index.html` overrides can differ from frozen P2 reference values. No live overlay was changed or treated as a target; compare against live prices separately before any proposed deployment.',
                'Do not equate historical achieved-production tiers with dated preseason projection cohorts. Do not claim a statistically validated 2026 preseason model. No owner price bands, DLF/MV targets or 2026 realized-week data used to fit or rank.',
                '## Next action',
                'Owner can review 54-player shadow rankings and flag clear mistakes. A production-ready numerical FV requires a historical dated preseason-forecast backtest or other independent prospective evidence, league-scoring reconciliation and an independently justified cross-position conversion. No production authorization is granted by workflow green.', '',
                '**No `index.html` write. No `PLAYER_DB`, age curve, owner anchors, or live FV changes.**']
              return '\n'.join(report)+'\n'

          def write_outputs(out,inputs,fixture=False):
              obs,res,stats,pools,vol,validation,migrations=inputs
              out.mkdir(exist_ok=True,parents=True)
              outputs={
              PREFIX+'_54_QB_reference_reallocation.csv':csvtext(res,list(res[0])),
              PREFIX+'_scenario_stability.csv':csvtext(stats,list(stats[0])),
              PREFIX+'_tier_only_reconstruction.csv':csvtext(pools,list(pools[0])),
              PREFIX+'_54_QB_scenario_sensitivity.csv':csvtext(vol,list(vol[0])),
              PREFIX+'_findings.md':build_report(obs,res,stats,pools,vol,validation,migrations),
              }
              for name,content in outputs.items():(out/name).write_text(content,encoding='utf-8')
              manifest={'workflow':'CAL26 V1R45 - QB Empirical Surplus Numerical Shadow Reference Bridge (Read Only)',
                  'semantic_status':'NUMERIC_POSITION_CONSERVING_QB_SHADOW_REFERENCE_ONLY_NOT_CALIBRATED',
                  'production_mutation_authorized':False,'numeric_fv_prices_calibrated':False,'index_html_changed':False,
                  'owner_target_ranges_used_as_fit_targets':False,'DLF_market_values_used_as_fit_targets':False,
                  '2026_realized_outcome_data_read':False,'future_2026_holdout_read':False,
                  'preseason_to_realized_transfer_validated':False,'league_scoring_full_QB_rules_verified':False,
                  'QB_position_reference_point_multiset_preserved':all(x['points_multiset_preserved'] for x in stats),
                  'frozen_P2_git_blob_pin':FROZEN_BLOB,'raw_historical_seasons_loaded':False,
                  'validated_future_horizons_used':[1,2,3],'unvalidated_future_horizons_excluded':[4],
                  'number_of_QBs':54,'strict_2025_real_history_dual_source_subset':31,'scenarios':len(stats),'quantile_reference_rows':len(res),
                  'reference_scale_only_no_cross_position_fv_truth':True,
                  'input_artifact_provenance':{str(i):{k:v for k,v in s.items() if k!='name'} for i,s in SRC.items()},
                  'output_sha256':{n:sha(x.encode()) for n,x in outputs.items()},'fixture_mode':fixture}
              (out/(PREFIX+'_manifest.json')).write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              return manifest

          def selftest():
              # Derive analytical inversion for a nontrivial 3-tier x 5-age grid, including zero-n cells.
              ages=['<=24','25-28','29-32','33-36','37+']; tiers=TIERS;datas=[];targets={'below_090':0.10,'near_090_110':0.25,'above_110':0.50};ns=[0,4,7,11,15];glob=(.10+.25+.50)/3
              # Solve tier recursion self-consistently with training data mean.
              vals={t:[min(1.0,targets[t]+.02*i) for i in range(5)] for t in tiers}
              obs={t:sum(ns[i]*vals[t][i] for i in range(5)) for t in tiers};N=sum(ns)*3;glob=sum(obs.values())/N
              for t in tiers:
                  nt=sum(ns);tier_mu=(obs[t]+12*glob)/(nt+12)
                  for i,age in enumerate(ages):
                      est=(ns[i]*vals[t][i]+12*tier_mu)/(ns[i]+12)
                      datas.append({'horizon':'1','baseline_tier':t,'age_band':age,'tier_n':nt,'local_n':ns[i],'p_QB24':f'{est:.6f}','p_150_attempts':f'{est:.6f}','future_ratio_surplus':f'{est:.6f}'})
              recovered,g,n=invert_conditional_pools(datas,'future_ratio_surplus',1)
              for t in tiers:
                  expected=(obs[t]+12*glob)/(sum(ns)+12)
                  check(abs(expected-recovered[t])<.000003,'INVERSION_EQUATION_SELFTEST')
              check(tier(.89999)=='below_090' and tier(.9)=='near_090_110' and tier(1.10)=='above_110','TIER_CUTS')
              print('SELFTEST_GREEN algebraically inverted 12+12 partial pools, score tier cuts')

          def main():
              parser=argparse.ArgumentParser();parser.add_argument('--selftest',action='store_true');parser.add_argument('--fixture-dir',type=Path);parser.add_argument('--repo',default=os.getenv('GITHUB_REPOSITORY',''))
              parser.add_argument('--repo-dir',type=Path,default=Path('.'));parser.add_argument('--out',type=Path,default=Path('CAL26_V1R45_ACTUAL'))
              a=parser.parse_args()
              if a.selftest:selftest();return
              loaded,meta=load_artifacts(a.fixture_dir,a.repo,os.getenv('GH_TOKEN',''))
              vals=make_analyses(loaded,a.repo_dir,bool(a.fixture_dir))
              manifest=write_outputs(a.out,vals,bool(a.fixture_dir))
              print(json.dumps({'semantic_status':manifest['semantic_status'],'QB':manifest['number_of_QBs'],'scenario_rows':manifest['quantile_reference_rows'],
                'preserved_FV_point_multiset':manifest['QB_position_reference_point_multiset_preserved'],'fixture':manifest['fixture_mode']},sort_keys=True))

          if __name__=='__main__':main()
          PY_CAL26_V1R45_ENGINE
          python -m py_compile "$RUNNER_TEMP/cal26_v1r45_engine.py"
          python "$RUNNER_TEMP/cal26_v1r45_engine.py" --selftest
          python "$RUNNER_TEMP/cal26_v1r45_engine.py" --repo "$GITHUB_REPOSITORY" --repo-dir "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/cal26-v1r45-artifacts"
          python - "$RUNNER_TEMP/cal26-v1r45-artifacts" <<'PY_CAL26_V1R45_ASSERT'
          import csv, hashlib, json, pathlib, sys
          folder=pathlib.Path(sys.argv[1]); m=json.loads((folder/'CAL26_V1R45_manifest.json').read_text())
          assert m['semantic_status']=='NUMERIC_POSITION_CONSERVING_QB_SHADOW_REFERENCE_ONLY_NOT_CALIBRATED'
          assert m['number_of_QBs']==54 and m['strict_2025_real_history_dual_source_subset']==31
          assert m['scenarios']==4 and m['quantile_reference_rows']==216
          assert m['QB_position_reference_point_multiset_preserved'] is True
          assert m['numeric_fv_prices_calibrated'] is False and m['production_mutation_authorized'] is False
          assert m['future_2026_holdout_read'] is False and m['2026_realized_outcome_data_read'] is False
          assert m['DLF_market_values_used_as_fit_targets'] is False
          assert m['owner_target_ranges_used_as_fit_targets'] is False
          assert m['preseason_to_realized_transfer_validated'] is False
          assert m['reference_scale_only_no_cross_position_fv_truth'] is True
          assert m['validated_future_horizons_used']==[1,2,3] and m['unvalidated_future_horizons_excluded']==[4]
          assert m['fixture_mode'] is False
          for filename,digest in m['output_sha256'].items():
              p=folder/filename
              assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          with (folder/'CAL26_V1R45_54_QB_reference_reallocation.csv').open() as f:
              data=list(csv.DictReader(f))
          assert len(data)==216
          assert len({x['name'] for x in data})==54
          assert len({x['scenario'] for x in data})==4
          print('R45_GREEN numerical reference, frozen supply conservation, R42/R43/R44 source SHAs, R42 holdouts excluded; still NOT FV calibrated')
          PY_CAL26_V1R45_ASSERT
          test -z "$(git status --porcelain)"
          echo '## CAL26 V1R45 — numerical QB reference reallocation, research-only' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cal26-v1r45-artifacts/CAL26_V1R45_findings.md" >> "$GITHUB_STEP_SUMMARY"

