name: CAL26 V1R59 - Cross-Position Surplus and Cardinal Scale Decision (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r59-crosspos-supply-and-cardinal-scale-research
  cancel-in-progress: false
jobs:
  crossposition-cardinal-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout research inputs (read only)
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download exact successful R53R1 cross-position inputs
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R53R1_HISTORICAL_LOG_SEASONS_REPLACEMENT_SHARED_SURPLUS_READ_ONLY
        run-id: 40045370120
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r59-inputs/R53
    - name: Download exact successful R55 empirical multiyear QB inputs
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R55_EMPIRICAL_LOG_MULTISEASON_QB_SHADOW_RESEARCH_ONLY
        run-id: 40048264245
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r59-inputs/R55
    - name: Download exact successful R58R1 frozen Week6 LOG parity
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R58R1_R47_TEAM_GAME_PARITY_AND_LOG_QB_WEEK6_FEATURES_RESEARCH_ONLY
        run-id: 40053443808
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-v1r59-inputs/R58
    - name: Cross-position 518 projection sensitivity and scale-identifiability report
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R59_engine.py\" <<'PY_CAL26_V1R59_ENGINE'\n#!/usr/bin/env python3\n\"\"\"\
        CAL26 V1R59 cross-position YEAR-ZERO surplus stress / pricing-scale decision.\nResearch ONLY. Never fit existing FV or owner/market\
        \ prices to determine coefficients.\nInputs exactly pinned from R53R1 R55 R58R1 and historical rank snapshots.\n\"\"\"\nimport\
        \ argparse,csv,hashlib,io,json,math,pathlib,statistics,collections,sys\n\nROOT='CAL26_V1R59'\nPINS={'R53': {'CAL26_V1R53_2024_2025_historical_LOG_replacement_ranks.csv':\
        \ 'b093956d3e929a2217ecd1a12c81bc5a990897c8e02e0fa3dc40e4bd26a24e89',\n         'CAL26_V1R53_2026_position_reference_sensitivity.csv':\
        \ '3cc7919550fadcbf0bbb713aa8209c83db161a68c6856de5123995bf0c492be9',\n         'CAL26_V1R53_full_pool_year0_shared_surplus_units.csv':\
        \ '62cdba0623e616e2e0dffef490c2ba294950e3c2c21811c081e12e10aed30527',\n         'CAL26_V1R53_manifest.json': '8d2227cee818345e048dfc689ea54ebe60a299419e6e0faa133c98d4913af5ed'},\n\
        \ 'R55': {'CAL26_V1R55_54_QB_LOG_calibrated_num_SHADOW_not_FV.csv': '86b12e2a29b33737a8d308378f8aab5052a4b75c69a59443fbd1f8fabf7d590a',\n\
        \         'CAL26_V1R55_manifest.json': '3c970e52c25759e6b8e1e4de62eda12e31f0aab6b079179dd82b145fc6c5cf2e'},\n 'R58': {'CAL26_V1R58_54_QB_team_game_LOG_feature_bridge_NOT_FV.csv':\
        \ 'b5cfc49fcb7905a52236dcfb2ff9d9c9d1c4b9075cec71af5679e329b677ade2',\n         'CAL26_V1R58_manifest.json': 'd8368dd4362728a6e983c156c3b1fbdabfafcb44597e4a522ebbca663f080b6d'}}\n\
        POS=('QB','RB','WR','TE','DL','LB','DB')\n\ndef req(x,msg):\n if not x:raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\n\
        def num(s):\n x=float(s);req(math.isfinite(x),'NONFINITE_INPUT');return x\ndef isfalse(x):return str(x).lower()=='false'\ndef\
        \ read_pinned(folder,n,expected):\n p=folder/n;req(p.is_file(),f'REQUIRED_{n}');blob=p.read_bytes();req(sha(blob)==expected,f'INPUT_HASH_DRIFT_{n}');return\
        \ blob\ndef csvload(blob):\n t=io.StringIO(blob.decode('utf-8-sig'));dr=csv.DictReader(t);r=list(dr);req(len(r)>0,'EMPTY_CSV');return\
        \ r\ndef writecsv(rows):\n req(rows,'EMPTY_ROWS');s=io.StringIO(newline='');w=csv.DictWriter(s,fieldnames=list(rows[0]),lineterminator='\\\
        n');w.writeheader();w.writerows(rows);return s.getvalue()\ndef pct(xs,q):\n a=sorted(xs);p=(len(a)-1)*q;lo=int(p);hi=min(lo+1,len(a)-1);return\
        \ a[lo]+(a[hi]-a[lo])*(p-lo)\ndef cleanint(x):return int(round(num(x)))\ndef rankstable(old,new):\n # pairwise rank distance,\
        \ transparent and independent of price units\n old_rank={x:i for i,x in enumerate(old)};return sum(abs(i-old_rank[x]) for i,x\
        \ in enumerate(new))/len(old)\ndef main(src,out):\n raw={k:{} for k in PINS}\n for group,keys in PINS.items():\n  for fname,dig\
        \ in keys.items():raw[group][fname]=read_pinned(src/group,fname,dig)\n for group in ('R53','R55','R58'):\n  mans=[(fname,json.loads(blob))\
        \ for fname,blob in raw[group].items() if fname.endswith('manifest.json')]\n  req(len(mans)==1,f'MANIFEST_COUNT_{group}');m=mans[0][1]\n\
        \  req(m.get('production_change_authorized') is False,f'UPSTREAM_FV_HOLD_{group}')\n  for f,d in m.get('output_sha256',{}).items():\n\
        \   if f in raw[group]:req(sha(raw[group][f])==d,f'UPSTREAM_MANIFEST_HASH_{group}_{f}')\n  if group=='R53':\n   req(m['n_projected_rows']==518\
        \ and m['n_frozen_players']==549 and m['n_R51_54_qbs']==54,'R53_COVERAGE_CONTRACT')\n   req(m['2026_projection_contains_unmodeled_weekly_threshold_bonuses']\
        \ is True,'R53_PROJECTION_BONUS_RISK_NOT_DISCLOSED')\n  if group=='R55':req(m['n_54_QB_candidates']==54 and m['2026_realized_read']\
        \ is False,'R55_COHORT_CONTRACT')\n  if group=='R58':\n   req(m['eligible_QBs']==31 and m['reconciled_standard_feature_parity_count']==31\
        \ and m['qualifying_prior_std_parity_count']==28,'R58_PARITY_CONTRACT')\n   req(m['retrieved_source_shas']==m['frozen_source_shas'],'R58_SOURCE_PIN_CONTRACT')\n\
        \   req(m['2026_week7_or_later_player_stats_read'] is False and m['2026_weeks8_12_target_outcomes_read'] is False,'HOLDOUT_LEAK')\n\
        \ # Read exact contract-shaped inputs.\n full=csvload(raw['R53']['CAL26_V1R53_full_pool_year0_shared_surplus_units.csv'])\n\
        \ references=csvload(raw['R53']['CAL26_V1R53_2026_position_reference_sensitivity.csv'])\n historical=csvload(raw['R53']['CAL26_V1R53_2024_2025_historical_LOG_replacement_ranks.csv'])\n\
        \ qbs=csvload(raw['R55']['CAL26_V1R55_54_QB_LOG_calibrated_num_SHADOW_not_FV.csv'])\n bridge=csvload(raw['R58']['CAL26_V1R58_54_QB_team_game_LOG_feature_bridge_NOT_FV.csv'])\n\
        \ req(len(full)==518 and len(qbs)==len(bridge)==54 and len(references)==7 and len(historical)==24,'FROZEN_ROW_COUNTS')\n fullnames=[r['name']\
        \ for r in full]\n req(len(set(fullnames))==518,'FULL_NAME_COLLISION')\n pmap=collections.defaultdict(list)\n for x in full:\n\
        \  req(x['position'] in POS,'UNKNOWN_POSITION');req(isfalse(x['production_change_authorized']),'R53_RELEASE_DRIFT')\n  pmap[x['position']].append(x)\n\
        \ req(set(pmap)==set(POS),'POSITION_MISSING')\n maps={}\n for group,rs in [('R55',qbs),('R58',bridge)]:\n  d={r['name']:r for\
        \ r in rs};req(len(d)==54,f'{group}_DUPLICATE')\n  req(set(d)=={r['name'] for r in pmap['QB']},f'{group}_QB_COHORT_DRIFT')\n\
        \  maps[group]=d\n for n in maps['R55']:\n  req(cleanint(maps['R55'][n]['frozen_FV_UNCHANGED'])==cleanint(maps['R58'][n]['frozen_FV_UNCHANGED']),f'QB_FV_DRIFT_{n}')\n\
        \  req(isfalse(maps['R58'][n]['production_change_authorized']),'R58_RELEASE_DRIFT')\n eligible=[r for r in bridge if r['frozen_Week6_R47_eligible']=='True']\n\
        \ req(len(eligible)==31 and all(r['R58_same_team_game_parity_pass']=='True' for r in eligible),'R58_PLAYER_PARITY_DRIFT')\n\
        \ refmap={r['position']:r for r in references};req(set(refmap)==set(POS),'REFERENCE_MISSING')\n histmap={(int(r['season']),r['position'],int(r['rank'])):num(r['points_exact_LOG_weekly_scored'])\
        \ for r in historical}\n req(len(histmap)==24,'HISTORICAL_RANK_DUPLICATE')\n # Predefined rank ±3 is a transparent assumption\
        \ stress test, not a fitted hyperparameter.\n stress=[];base=[];ranks_by_pos={}\n for pos in POS:\n  pool=pmap[pos];rr=refmap[pos];rank=int(rr['rank_ceil']);req(rank>=4\
        \ and len(pool)>rank+3,'STRESS_RANK_OUTSIDE_POOL')\n  order=sorted(pool,key=lambda r:(-num(r['2026_projected_points']),r['name']))\n\
        \  center=num(order[rank-1]['2026_projected_points']);candidate=num(rr['projection_at_rank'])\n  req(abs(center-candidate)<=0.001,f'R53_REFERENCE_PROJECTION_DRIFT_{pos}')\n\
        \  lower_reference=num(order[rank-4]['2026_projected_points'])  # stronger replacement: rank-3\n  upper_reference=num(order[rank+2]['2026_projected_points'])\
        \  # weaker replacement: rank+3\n  req(lower_reference>=center>=upper_reference,f'STRESS_MONOTONICITY_{pos}')\n  hist24=[histmap.get((y,pos,rank))\
        \ for y in (2024,2025)]\n  req(all(x is not None for x in hist24),f'HISTORICAL_ANCHOR_MISSING_{pos}')\n  projected_surplus=[];frozen_fv=[];changes=[]\n\
        \  for x in pool:\n   name=x['name']; pts=num(x['2026_projected_points']);sv=max(0.0,pts-center);lo=max(0.,pts-lower_reference);hi=max(0.,pts-upper_reference)\n\
        \   inp=num(x['one_season_same_unit_surplus_points']);req(abs(sv-inp)<.0011,f'R53_SURPLUS_DRIFT_{name}')\n   req(lo-1e-9<=sv<=hi+1e-9,f'REPLACEMENT_STRESS_ORDER_{name}')\n\
        \   fv=cleanint(x['frozen_FV_UNCHANGED']);req(fv>=0,'FV_NEGATIVE')\n   projected_surplus.append(sv);frozen_fv.append(fv)\n \
        \  changes.append((sv,lo,hi))\n   base.append({'name':name,'position':pos,'frozen_FV_UNCHANGED':fv,'2026_projected_points':round(pts,4),\n\
        \    'league_starter_rank_assumption':rank,'base_replacement_points':round(center,4),\n    'year0_surplus_points':round(sv,4),'rank_minus_3_stronger_replacement_surplus':round(lo,4),'rank_plus_3_weaker_replacement_surplus':round(hi,4),\n\
        \    'year0_15_units_ILLUSTRATIVE_NOT_FV':round(15*sv), 'year0_20_units_ILLUSTRATIVE_NOT_FV':round(20*sv),\n    'year0_25_units_ILLUSTRATIVE_NOT_FV':round(25*sv),\n\
        \    'future_position_horizons_validated_for_dynasty_FV':False,'price_calibration_status':'NOT_IDENTIFIED_DO_NOT_RELEASE','production_change_authorized':False})\n\
        \  stress.append({'position':pos,'n_projected_players':len(pool),'lineup_demand':num(rr['effective_lineup_demand']),'base_reference_rank':rank,\n\
        \   'projected_rank_minus_3_points':round(lower_reference,4),'projected_rank_base_points':round(center,4),'projected_rank_plus_3_points':round(upper_reference,4),\n\
        \   'historical_LOG_2024_reference_points':round(hist24[0],4),'historical_LOG_2025_reference_points':round(hist24[1],4),\n \
        \  '2026_vs_2024_reference_pts_delta':round(center-hist24[0],4),'2026_vs_2025_reference_pts_delta':round(center-hist24[1],4),\n\
        \   'positive_year0_surplus_players':sum(s>0 for s in projected_surplus),'projected_year0_surplus_sum':round(sum(projected_surplus),3),\n\
        \   'projected_year0_surplus_p50':round(pct(projected_surplus,.5),3),'projected_year0_surplus_p90':round(pct(projected_surplus,.9),3),\n\
        \   'base_surplus_zero_pct':round(100*sum(s==0 for s in projected_surplus)/len(pool),2),\n   'historical_rank_is_not_waiver_replacement':True,'production_change_authorized':False})\n\
        \  ranks_by_pos[pos]=sorted(pool,key=lambda r:(-num(r['one_season_same_unit_surplus_points']),r['name']))\n req(len(base)==518\
        \ and len(stress)==7,'OUTPUT_COUNT_DRIFT')\n # side-by-side comparison: QBs only have 2027-29 horizon research, other positions\
        \ do NOT.\n bases={r['name']:r for r in base}; qbrows=[]\n for name in sorted(maps['R55']):\n  old=maps['R55'][name];cur=maps['R58'][name];ref=bases[name]\n\
        \  req(ref['position']=='QB','QB_POSITION_DRIFT')\n  projected=num(old['projected_LOG_core_pts']);req(abs(projected-ref['2026_projected_points'])<.0011,f'QB_PROJECTED_POINTS_DRIFT_{name}')\n\
        \  fv=cleanint(old['frozen_FV_UNCHANGED']);req(fv==ref['frozen_FV_UNCHANGED'],f'QB_FV_MATCH_{name}')\n  four=num(old['R55_paired_adjusted_four_year_PROXY_points']);yr0=num(old['year0_projected_LOG_surplus_points'])\n\
        \  req(math.isfinite(four),'QB_PROXY_NOT_NUMERIC')\n  qbrows.append({'name':name,'frozen_FV_UNCHANGED':fv,'2026_one_year_shared_QB28_surplus_points':ref['year0_surplus_points'],\n\
        \   '2026_QB24_threshold_surplus_R55_points':round(yr0,4),'R55_year0_plus_years1_3_PROXY_points':round(four,4),\n   'R55_20x_four_year_ILLUSTRATIVE_NOT_FV':cleanint(old['R55_paired_20units_ILLUSTRATIVE_NOT_FV']),\n\
        \   'R58_frozen_Week6_eligible':cur['frozen_Week6_R47_eligible'],\n   '2026_LOG_core_YTD_ppg_team_games':cur['LOG_core_YTD_ppg_per_TEAM_game'],\n\
        \   '2026_LOG_core_recent3_ppg_team_games':cur['LOG_core_recent3_ppg_per_TEAM_game'],\n   '2025_LOG_core_prior_ppg_team_games':cur['LOG_core_2025_prior_ppg_per_TEAM_game'],\n\
        \   'recency_component_in_R55_four_year_price':False,'QB28_vs_QB24_reference_incompatible':True,\n   'R55_future_conversion_and_age_not_certified':True,'four_year_non_QB_comparable':False,'production_change_authorized':False})\n\
        \ req(len(qbrows)==54,'QB_SHADOW_COUNT_DRIFT')\n # Independent untouched-FV comparison serves mismatch review, never learns\
        \ multipliers from FV.\n extreme=sorted(base,key=lambda r:(-r['year0_surplus_points'],r['name']))[:10]\n bypos={r['position']:r\
        \ for r in stress}\n qa={\n  'workflow':'CAL26 V1R59 - Cross-Position Year0 Replacement Sensitivity and Cardinal FV Scale Decision\
        \ (Read Only)',\n  'semantic_status':'518_PLAYER_SHARED_YEAR0_SCALE_SENSITIVITY__CARDINAL_FV_NOT_IDENTIFIED__HOLD',\n  'source_artifact_runs':{'R53':40045370120,'R55':40048264245,'R58':40053443808},\n\
        \  'source_sha256':{g:{n:sha(b) for n,b in vals.items()} for g,vals in raw.items()},\n  'n_2026_projected_players':len(base),'n_2026_frozen_players_in_upstream':549,'unscored_frozen_players':31,\n\
        \  'n_positions':7,'n_QB_multiyear_research_only':54,'QB_week6_parity_pass':31,'QB_prior_parity_pass':28,\n  'replacement_rank_stress_range':'rank_minus_three,base,rank_plus_three',\n\
        \  'QB24_vs_QB28_surplus_non_identical':True,'non_QB_h1_3_horizons_are_not_supplied':True,\n  '2026_projection_contains_unmodeled_weekly_threshold_bonuses':True,\n\
        \  '2024_25_actual_vs_2026_projection_source_and_scoring_coverage_differ':True,\n  'fixed_15_20_25_multipliers_are_not_empirically_calibrated':True,\n\
        \  '2026_future_week7_later_actuals_read':False,'future_2026_weeks8_12_holdout_read':False,\n  'owner_targets_used':False,'market_values_as_price_targets_used':False,\n\
        \  'frozen_FV_used_only_as_unmodified_reference':True,'R55_age_risk_and_preseason_transfer_not_verified':True,\n  'production_change_authorized':False,'live_index_html_modified':False,\n\
        \ }\n report=['# CAL26 V1R59 — Across-position shared year-zero surplus and dynasty price-scale decision',\n  '**Status: Research\
        \ only. No production FV changes.**', '',\n  f'Validated exactly **{len(base)}** projected 2026 players across **7 positions**,\
        \ with **31** upstream frozen players lacking a projected row. All **54** QB future research shadows joined without repricing.\
        \ Actual R58R1 established **31/31** frozen Week6 and **28/28** qualified prior feature parity.', '',\n  '**Current production\
        \ readiness:** Historical LOG scoring snapshots and current-year lineup-demand sensitivity are reproducible, but the **0–10,000\
        \ multi-year cardinal FV scale is not identified**. This is an evidence inventory and sensitivity, not a candidate release.',\
        \ '',\n  '## Position-by-position empirical checks','|Position|Projected pool|Rank base|2026 projected reference|2024 actual\
        \ LOG rank|2025 actual LOG rank|Projected positive surplus|','|---|---:|---:|---:|---:|---:|---:|']\n for r in stress:\n  report.append(f\"\
        |{r['position']}|{r['n_projected_players']}|{r['base_reference_rank']}|{r['projected_rank_base_points']:.2f}|{r['historical_LOG_2024_reference_points']:.2f}|{r['historical_LOG_2025_reference_points']:.2f}|{r['positive_year0_surplus_players']}|\"\
        )\n report+=['','## Prespecified replacement sensitivity (rank ±3, no outcome peeking)',\n 'All 518 rows report a stronger (rank-3),\
        \ base and weaker (rank+3) replacement. This tests lineup-demand uncertainty, not waiver availability. The 15/20/25 points-to-units\
        \ scenarios are deliberately arbitrary sensitivities and **not** prices; no FV or market data were fitted.',\n 'The 2026 projected\
        \ points omit some weekly threshold bonuses, while historical 2024–25 scorer totals contain them; comparing season rank values\
        \ is descriptive only, **not** a certified apples-to-apples forecast calibration.', '',\n '## QB future year comparison and\
        \ known incompatibility',\n 'R55 future QB research uses an **QB24** projected tier threshold; R53 year-zero common-unit surplus\
        \ uses an **QB28** lineup-demand assumption. They must not be added, spliced, or labeled a coherent four-year dynasty value.\
        \ The R55 2027–2029 proxy also lacks verified preseason-projection transport and complete age modeling. R58 LOG Week6 feature\
        \ parity does not certify recency pricing.', '',\n '## Largest 2026 year-zero projected surpluses (not dynasty FV)','|Name|Pos|Projected\
        \ points|Year-zero surplus|Frozen FV|','|---|---|---:|---:|---:|']\n for x in extreme:report.append(f\"|{x['name']}|{x['position']}|{x['2026_projected_points']:.1f}|{x['year0_surplus_points']:.1f}|{x['frozen_FV_UNCHANGED']}|\"\
        )\n report+=['','## Exact decision to move toward production',\n '1. **Accept** the frozen positional year-zero surplus as a\
        \ transparent lineup-demand **scenario**, not a demonstrated waiver replacement or dynasty price. It now covers all 7 positions\
        \ and reports assumption stress.',\n '2. **Do not** choose a fixed price-per-point multiplier just to match the frozen FV or\
        \ owner expected QB values. No transaction economics or prospective choice evidence identifies such a unit in these sources.',\n\
        \ '3. **Next narrow step:** source validated non-QB future-season LOG surplus paths (historical QB paths cannot be copied to\
        \ RB/WR/TE/IDP), then propose an explicit shared price cardinal unit and display a 518-player release candidate for owner approval.\
        \ Keep unmatched 31 frozen players unchanged.',\n '4. Avoid new large statistical gates. A small reviewed, reversible owner-approved\
        \ pricing wave can be used once the comparable future paths and shared scale exist.',\n '', 'No 2026 Weeks 7+ results, sealed\
        \ Weeks 8–12, owner targets, market-price fitting, or production file edits were performed.']\n payload={f'{ROOT}_518_year0_crosspos_sensitivity_NOT_FV.csv':writecsv(base),\n\
        \          f'{ROOT}_54_QB_future_horizon_incompatibility_NOT_FV.csv':writecsv(qbrows),\n          f'{ROOT}_7_position_replacement_stress.csv':writecsv(stress),\n\
        \          f'{ROOT}_decision.md':'\\n'.join(report)+'\\n'}\n out.mkdir(parents=True,exist_ok=True)\n for k,v in payload.items():(out/k).write_text(v,encoding='utf-8')\n\
        \ qa['output_sha256']={k:sha(v.encode()) for k,v in payload.items()}\n (out/f'{ROOT}_manifest.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\\\
        n')\n print(json.dumps({'status':qa['semantic_status'],'n':len(base),'positions':len(stress),'qbs':len(qbrows),'week6_parity':qa['QB_week6_parity_pass'],'release':False}))\n\
        \ndef selftest():\n req(abs(pct([1,3,5,7],.5)-4)<1e-9,'QUANTILE_TEST')\n req(max(0,20-10)==10 and max(0,20-22)==0,'SURPLUS_TEST')\n\
        \ req(15*20<20*20<25*20,'MULTIPLIER_ORDER_TEST')\n req(isfalse('False') and not isfalse('True'),'BOOL_TEST')\n print('R59_SELFTEST_GREEN\
        \ monotonic replacement, no FV calibration, quantitative stress')\nif __name__=='__main__':\n ap=argparse.ArgumentParser();ap.add_argument('--inputs',type=pathlib.Path);ap.add_argument('--out',type=pathlib.Path);ap.add_argument('--selftest',action='store_true');a=ap.parse_args()\n\
        \ if a.selftest:selftest()\n else:req(a.inputs is not None and a.out is not None,'MISSING_PATHS');main(a.inputs,a.out)\nPY_CAL26_V1R59_ENGINE\n\
        python -m py_compile \"$RUNNER_TEMP/CAL26_V1R59_engine.py\"\npython \"$RUNNER_TEMP/CAL26_V1R59_engine.py\" --selftest\npython\
        \ \"$RUNNER_TEMP/CAL26_V1R59_engine.py\" --inputs \"$RUNNER_TEMP/cal26-v1r59-inputs\" --out \"$RUNNER_TEMP/cal26-v1r59-results\"\
        \npython - \"$RUNNER_TEMP/cal26-v1r59-results\" <<'PY_CAL26_V1R59_VERIFY'\nimport csv,hashlib,json,pathlib,sys\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R59_manifest.json').read_text())\n\
        assert m['semantic_status']=='518_PLAYER_SHARED_YEAR0_SCALE_SENSITIVITY__CARDINAL_FV_NOT_IDENTIFIED__HOLD'\nassert m['n_2026_projected_players']==518\
        \ and m['n_2026_frozen_players_in_upstream']==549 and m['unscored_frozen_players']==31\nassert m['n_positions']==7 and m['n_QB_multiyear_research_only']==54\n\
