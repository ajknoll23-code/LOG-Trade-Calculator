          def _polish(f, selected, kind, largest_margin):
              """Keep NL25 angle selection; replace formulaic final copy with justified implications.

              No injury, roster-substitution, odds, or historical superlatives are inferred.
              """
              s = dict(selected)
              g = f['game']; a,b = g['name_a'],g['name_b']
              s['structure'] = {
                  'record versus form':'contrast','underdog path':'numbers',
                  'recent reversal':'narrative','title race':'stakes',
                  'consistency versus volatility':'numbers','leader under challenge':'stakes',
                  'strong score in defeat':'contrast','win without median':'stakes',
                  'pregame-baseline reversal':'narrative','form upset':'contrast',
                  'standings shock':'stakes','large-weekly-margin':'numbers',
                  'starter contribution':'narrative','fine margins':'numbers',
                  'surging form':'narrative','measured comparison':'contrast',
                  'measured outcome':'narrative','median divide':'contrast',
                  'verified player contribution':'narrative'
              }.get(s['angle'], 'narrative')
              s['takeaway'] = None
              s['player_note'] = None
              angle = s['angle']
              if kind == 'war':
                  w = f['window']; avga,avgb=f['ave_a'],f['ave_b']
                  leader = a if avga>=avgb else b
                  lagger = b if leader==a else a
                  if angle == 'record versus form':
                      gap=f['gap']; top=leader
                      s['headline'] = ('Unequal Records, Nearly Equal Scores' if gap < 5 else 'Records and Recent Form Point Different Ways')
                      s['lead'] = (f'{a} is {g["record_a"]}; {b} is {g["record_b"]}. '
                                   f'Yet in {w}, their weekly averages are {avga:.2f} and {avgb:.2f}.')
                      s['why'] = (f'{top} holds a {gap:.2f}-point observed edge. '
                                  + ('That is near-parity, not a meaningful separation from three games.' if gap < 5
                                     else 'The recent scoring order differs from the combined H2H-and-median record order; neither measure predicts this matchup on its own.'))
                      s['takeaway'] = ('The contrast is in the standings, not a decisive recent scoring gap.' if gap<5
                                        else 'The winner will supply a new data point in a small, conflicting sample.')
                  elif angle == 'underdog path':
                      high_low=f['high_b'] if leader==a else f['high_a']
                      lead_floor=f['low_a'] if leader==a else f['low_b']
                      overlap=high_low-lead_floor
                      s['headline'] = 'An Underdog Route Measured in Points'
                      s['lead'] = (f'{lagger} trails {leader} by {f["gap"]:.2f} points per week over {w}. '
                                   f'The three-game averages are {min(avga,avgb):.2f} and {max(avga,avgb):.2f}.')
                      if overlap>=0:
                          s['why'] = (f'The underdog’s best score was {high_low:.2f}; the other side’s low was {lead_floor:.2f}. '
                                      f'Those observed endpoints overlap by just {overlap:.2f} points.')
                          s['takeaway'] = 'There is a narrow route within the observed scores, but three games are not a win probability.'
                      else:
                          s['why'] = (f'The underdog’s best was {high_low:.2f}, still {abs(overlap):.2f} below '
                                      f'the opponent’s worst at {lead_floor:.2f}.')
                          s['takeaway'] = 'An upset would require a result outside one of these recent scoring bands.'
                  elif angle == 'recent reversal':
                      changes=[(a,f['latest_change_a'],f['latest_a']),(b,f['latest_change_b'],f['latest_b'])]
                      who,delta,score_ = max((x for x in changes if x[1] is not None),key=lambda x:abs(x[1]))
                      baseline=score_-delta
                      s['headline']='A One-Week Drop Changes the Picture' if delta<0 else 'A One-Week Jump Changes the Picture'
                      s['lead']=(f'{who} scored {score_:.2f} in Week {len(g["scores_a"])}. '
                                  f'That was {abs(delta):.2f} points {"below" if delta<0 else "above"} its prior three-week average of {baseline:.2f}.')
                      s['why']=(f'Its matchup with {b if who==a else a} now follows a pronounced single-week swing. '
                                 f'The clubs’ {w} averages differ by {f["gap"]:.2f}; that is a separate measure from the one-week change.')
                      s['takeaway']='The score is real; the cause of the swing is not established by these team totals.'
                  elif angle == 'title race':
                      top=leader; other=lagger; gap=f['gap']; topave=max(avga,avgb); otherave=min(avga,avgb)
                      s['headline']=f'No. {min(g["rank_a"],g["rank_b"])} Meets No. {max(g["rank_a"],g["rank_b"])}'
                      s['lead']=(f'{a} (provisional No. {g["rank_a"]}, {g["record_a"]}) meets '
                                 f'{b} (No. {g["rank_b"]}, {g["record_b"]}). '
                                 f'Both sit near the top of the reconstructed league table.')
                      s['why']=(f'{top} averaged {topave:.2f} across {w}, {gap:.2f} ahead of {other} at {otherave:.2f}. '
                                'The direct result adds a head-to-head win or loss; each club also faces a separate weekly median result.')
                      s['takeaway']='This is a standings confrontation with a measurable form gap, not a projected point spread.'
                  elif angle == 'consistency versus volatility':
                      steady=a if f['range_a']<f['range_b'] else b
                      wider=b if steady==a else a
                      small=min(f['range_a'],f['range_b']);large=max(f['range_a'],f['range_b'])
                      s['headline']='A Wide Scoring Band Meets a Narrower One'
                      s['lead']=(f'Over {w}, {steady} ranged {small:.2f} points from its high to its low. '
                                 f'{wider} covered {large:.2f} points across the same three games.')
                      s['why']=(f'{leader} still holds the {f["gap"]:.2f}-point weekly average advantage. '
                                'A wider observed range leaves more room for an unusually low week, but it also includes the higher ceiling.')
                      s['takeaway']='These are three-game high–low ranges, not statistical volatility estimates or forecasts.'
                  elif angle == 'leader under challenge':
                      top = a if g['rank_a']==1 else b
                      challenger=b if top==a else a
                      ta=avga if top==a else avgb;ca=avgb if top==a else avga
                      cr=g['record_a'] if top==a else g['record_b']
                      challenger_high=f['high_b'] if top==a else f['high_a']
                      s['headline']='The League Leader Gets a Scoring Test'
                      s['lead']=(f'{top} holds provisional No. 1 at {cr} and has averaged {ta:.2f} over {w}. '
                                 f'{challenger} averaged {ca:.2f}, a {abs(ta-ca):.2f}-point gap.')
                      s['why']=(f'{challenger} has reached {challenger_high:.2f} in a recent week, '
                                f'but that is still only a single observed high. The league leader’s record and scoring both provide context, not certainty.')
                      s['takeaway']='To challenge No. 1, the lower-scoring side needs a result above its recent typical output or a quieter week from the leader.'
                  else:
                      # Keep evidence-backed NL25 fallback, but remove its boilerplate question.
                      s['takeaway']='The available scores justify a comparison, not a confident forecast.'
              else:
                  sa,sb=f['score_a'],f['score_b'];w=f['week'];med=f['median'];margin=f['margin']
                  winner=a if sa>sb else b if sb>sa else None
                  loser=b if winner==a else a
                  ws=max(sa,sb);ls=min(sa,sb)
                  if angle == 'strong score in defeat':
                      s['headline']=f'{ls:.2f} Points, and Still a Loss'
                      s['lead']=(f'{loser} scored {ls:.2f}, exceeding the Week {w} league median of {med:.2f}, '
                                 f'yet lost {ws:.2f}–{ls:.2f} to {winner}.')
                      s['why']=(f'Both managers earned median wins; only {winner} gained the head-to-head win. '
                                'In a league that scores both results, a productive losing week is not a total loss.')
                      s['takeaway']='The schedule decided the head-to-head result; the median still rewarded the losing total.'
                  elif angle == 'win without median':
                      s['headline']='A Victory With Only Half the Reward'
                      s['lead']=(f'{winner} won {ws:.2f}–{ls:.2f}, but {ws:.2f} was '
                                 f'{med-ws:.2f} below the Week {w} league median.')
                      s['why']='A head-to-head win plus a median loss produces a 1–1 week, not the 2–0 outcome a higher score might have earned.'
                      s['takeaway']='The scoreboard says win; the combined-results standings record a split.'
                  elif angle == 'pregame-baseline reversal':
                      deviations=[(a,f['dev_a'],f['prior_a'],sa),(b,f['dev_b'],f['prior_b'],sb)]
                      who,delta,prior,actual=max(deviations,key=lambda x:abs(x[1]))
                      s['headline']='An Improved Score Was Not Enough' if delta>0 and who!=winner else 'The Recent Scoring Baseline Broke'
                      s['lead']=(f'{who} averaged {prior:.2f} in {f["source_pre"]}; Week {w} brought {actual:.2f}, '
                                 f'a {abs(delta):.2f}-point {"increase" if delta>0 else "decrease"}.')
                      s['why']=(f'The final was {winner} {ws:.2f}, {loser} {ls:.2f}. '
                                f'{"The improved output still left the team short." if delta>0 and who==loser else "The final diverged from the earlier three-game level."}')
                      s['takeaway']='A change in team total is verified; the player-level cause is not established.'
                  elif angle == 'form upset':
                      form_leader=a if f['prior_a']>=f['prior_b'] else b
                      s['headline']='The Recent-Form Leader Lost on the Field'
                      s['lead']=(f'{form_leader} entered Week {w} with the stronger {f["source_pre"]} scoring average: '
                                 f'{max(f["prior_a"],f["prior_b"]):.2f} to {min(f["prior_a"],f["prior_b"]):.2f}.')
                      s['why']=(f'{winner} won {ws:.2f}–{ls:.2f}, reversing that observed ordering by {margin:.2f} points. '
                                'This is a comparison to available pregame scores, not a claimed archived newsletter pick.')
                      s['takeaway']='The current result defeats the prior scoring pattern; one game does not establish a new trend.'
                  elif angle == 'standings shock':
                      mover=a if abs(g['rank_delta_a'])>=abs(g['rank_delta_b']) else b
                      delta=g['rank_delta_a'] if mover==a else g['rank_delta_b']
                      start=g['prior_rank_a'] if mover==a else g['prior_rank_b']
                      end=g['rank_a'] if mover==a else g['rank_b']
                      mover_points=sa if mover==a else sb
                      ht='loss' if mover!=winner else 'win' if winner else 'tie'
                      median_result=g['median_a'] if mover==a else g['median_b']
                      s['headline']=f'{mover} Moves {abs(delta)} Provisional Places'
                      s['lead']=(f'{mover} went from reconstructed No. {start} to No. {end} after Week {w}. '
                                 f'The {abs(delta)}-place change followed a {ht} to {winner if mover!=winner else loser}.')
                      s['why']=(f'{mover} scored {mover_points:.2f}, {"below" if mover_points<med else "above" if mover_points>med else "at"} '
                                f'the {med:.2f} league median; its median result was {median_result}. '
                                'Combined head-to-head and median results underpin the reconstructed movement.')
                      s['takeaway']='The ranking is provisional: official Sleeper tie-break order has not been verified.'
                  elif angle == 'large-weekly-margin':
                      s['headline']=(f'Week {w}’s Largest Margin' if abs(margin-largest_margin)<0.005
                                      else 'A Wide Week-Over-Week Margin')
                      s['lead']=(f'{winner} scored {ws:.2f}; {loser} had {ls:.2f}. '
                                 f'The {margin:.2f}-point margin was {"the largest of Week "+str(w)+"’s six games" if abs(margin-largest_margin)<0.005 else "a decisive Week "+str(w)+" result"}.')
                      s['why']=(f'{winner} finished {ws-med:.2f} above the {med:.2f} median, '
                                f'while {loser} finished {med-ls:.2f} below. Both ends of the distribution widened the result.')
                      s['takeaway']='This is a comparison within the six verified games, not a claim about all-time league history.'
                  else:
                      s['takeaway']='The observed outcome stands; stronger claims would require more evidence.'
              s['question'] = s['takeaway']
              s['keys'] = list(dict.fromkeys(list(s['keys']) + ['nl26_evidence_checked']))
              return s


          def _material_player(f, s, kind, retrieval):
              """Only add a starter when their scoring contribution connects to the selected story."""
              g=f['game']; a,b=g['name_a'],g['name_b']
              if kind=='war':
                  # Recent scoring contributions matter most for a concrete scoring-gap/leader discussion.
                  if s['angle'] not in ('leader under challenge','title race','starter contribution','surging form'):
                      return None
                  candidates=[]
                  for team,p,average in ((a,f.get('p_a'),f['ave_a']),(b,f.get('p_b'),f['ave_b'])):
                      if not p or not p.get('starts') or p['starts']<2:continue
                      total=float(p['total']); sample_total=average*3
                      if sample_total<=0:continue
                      share=total/sample_total
                      if total>=55 and share>=0.125:
                          candidates.append((team,p,share))
                  if not candidates:return None
                  # Prefer team central to the angle (leader or higher-scoring contender).
                  leader=a if f['ave_a']>=f['ave_b'] else b
                  team,p,share=max(candidates,key=lambda x:(x[0]==leader,x[2],float(x[1]['total'])))
                  return {'name':p['name'],'team':team,'points':f'{float(p["total"]):.2f}',
                    'period':f['window'],'contribution_share_pct':round(share*100,1),
                    'text':f'{p["name"]} scored {float(p["total"]):.2f} across {p["starts"]} verified starts for {team} ({share*100:.1f}% of its three-week points). This is completed production, not a projection.',
                    'source':f'Sleeper completed {f["window"]} starters + players_points'}
              if s['angle'] not in ('strong score in defeat','win without median','form upset','large-weekly-margin','verified player contribution'):
                  return None
              winner = a if f['score_a']>f['score_b'] else b if f['score_b']>f['score_a'] else None
              if winner is None:return None
              p = f['p_a'] if winner==a else f['p_b']
              total=f['score_a'] if winner==a else f['score_b']
              if not p or total<=0:return None
              pts=float(p['points']);share=pts/total
              # Do not add modest, tangential starter scores to force a player section.
              if pts<25 or share<0.115:return None
              return {'name':p['name'],'team':winner,'points':f'{pts:.2f}',
                'period':f'Week {f["week"]}','contribution_share_pct':round(share*100,1),
                'text':f'{p["name"]} supplied {pts:.2f} of {winner}’s {total:.2f} points ({share*100:.1f}%) as a verified Week {f["week"]} starter.',
                'source':f'Sleeper matchups/{f["week"]} starters + players_points'}


          def join_stories(facts,kind,players,retrieval=None):
              assert len(facts)==6
              candidate_groups=[pre_candidates(f) if kind=='war' else after_candidates(f) for f in facts]
              selected=allocate(candidate_groups)
              counts=Counter(x['angle'] for x in selected)
              if len(counts)<4 or max(counts.values())>2:
                  raise RuntimeError(f'NL26 editorial angle coverage failed: {dict(counts)}')
              maxmargin=max((f['margin'] for f in facts),default=0) if kind=='after' else 0
              stories=[]
              for f,c,options in zip(facts,selected,candidate_groups):
                  s=_polish(f,c,kind,maxmargin)
                  g=f['game'];s['name_a']=g['name_a'];s['name_b']=g['name_b']
                  s['stats']=make_stats(f,kind)
                  s['source']=(f'Sleeper matchup scores, {f["window"]}; reconstructed provisional rankings'
                               if kind=='war' else f'Sleeper matchups/{f["week"]} final + median; prior Weeks {f["week"]-3}–{f["week"]-1}')
                  s['player_note']=_material_player(f,s,kind,retrieval or 'not recorded')
                  s['all_candidates']=[{'angle':x['angle'],'priority':x['priority'],'keys':x['keys']} for x in options]
                  stories.append(s)
              return stories


          def render_html(heading,issue_sub,stories,logo,stamp,kind):
              cover_items=''.join(f'<div class="index-item"><b>{i:02d}</b><div><strong>{esc(s["name_a"])} / {esc(s["name_b"])}</strong><small>{esc(s["headline"])}</small></div></div>' for i,s in enumerate(stories,1))
