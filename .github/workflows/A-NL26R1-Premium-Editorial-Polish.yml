                  else:
                      body=f'<p class="lead">{esc(s["lead"])}</p><p>{esc(s["why"])}</p><div class="closing-line">{esc(s["takeaway"])}</div>'
                  pages.append(f'''<section class="game-page"><div class="folio"><span>{i:02d} / SIX</span><span>{"WAR ROOM" if kind=="war" else "AFTERMATH"} · WEEK {issue_sub.split("Week ")[-1].split(" ·")[0]}</span></div><div class="tag">{esc(s['angle'])}</div><h2>{esc(s['headline'])}</h2><div class="teams">{esc(s['name_a'])}<span>VS.</span>{esc(s['name_b'])}</div><div class="stats">{stats}</div><div class="body {esc(s['structure'])}">{body}</div>{player}<div class="source"><b>SOURCE</b> {esc(s['source'])}; retrieved {esc(stamp)} UTC.{(' · Player: '+esc(p['source'])) if p else ''}</div></section>''')
              return '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
