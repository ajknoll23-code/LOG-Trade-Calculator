              </style></head><body>''' + cover + ''.join(pages) + '</body></html>'


          def editorial_md(title,week,stories,snapshot,kind):
              rows=[f'# {title} — Week {week} · A-NL26R1','',
                    'Status: READ-ONLY SHADOW · NOT PUBLISHED · NO ARCHIVED PREDICTIONS',
                    'Source retrieval UTC: '+snapshot['generated_at_utc'],
                    'Provisional combined H2H-and-median rankings; no verified official tie-break parity.',
                    'No player-level projections or injury/lineup counterfactuals are asserted.','']
              for i,s in enumerate(stories,1):
                  rows += [f'## {i:02d} — {s["name_a"]} vs {s["name_b"]}',
                           f'**Angle:** {s["angle"]} · **Structure:** {s["structure"]}',
                           f'### {s["headline"]}',s['lead'],'',s['why'],'',
                           f'**Editorial takeaway:** {s["takeaway"]}','']
                  p=s.get('player_note')
                  if p: rows += [f'**Verified starter:** {p["text"]}',f'**Player source:** {p["source"]}','']
                  rows += [f'**Source:** {s["source"]}; retrieved {snapshot["generated_at_utc"]} UTC.','']
              return '\n'.join(rows)


          def _norm(s):
              return ' '.join(unicodedata.normalize('NFKC',str(s)).replace('\xad','').replace('’',"'").split()).casefold()


          def _packed(s):
              return ''.join(ch for ch in unicodedata.normalize('NFKC',str(s)).casefold() if ch.isalnum())


          class _BodyText(HTMLParser):
              def __init__(self):super().__init__();self.parts=[];self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('style','script'):self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('style','script') and self.skip:self.skip-=1
              def handle_data(self,data):
                  if not self.skip:self.parts.append(data)


          def verify_pdf(path,stories,html,kind):
              import fitz
              doc=fitz.open(str(path))
              if len(doc)!=7:raise RuntimeError(f'NL26 PDF must be 7 pages: {path.name} rendered {len(doc)}')
              parsed=_BodyText();parsed.feed(html)
              page_report=[]
              pdf_all=_norm(' '.join(page.get_text(sort=True) for page in doc))
              for expected in (x['headline'] for x in stories):
                  if _packed(expected) not in _packed(pdf_all):raise RuntimeError(f'PDF lost headline: {expected}')
              for idx,page in enumerate(doc):
                  words=page.get_text('words');text=page.get_text(sort=True);norm=_norm(text)
                  if page.rect.width<300 or page.rect.width>313 or not 510<=page.rect.height<=530:
                      raise RuntimeError(f'Unexpected phone page geometry {page.rect}')
                  if len(norm)<(380 if idx==0 else 320):
                      raise RuntimeError(f'Near-empty PDF page {idx+1}: {len(norm)} characters')
                  bbox=[];minfont=100.0
                  for block in page.get_text('dict')['blocks']:
                      if 'lines' not in block:continue
                      for line in block['lines']:
                          for span in line['spans']:
                              if not span.get('text','').strip():continue
                              minfont=min(minfont,span['size'])
                              b=span['bbox'];bbox.append(b)
                              if b[0]<-0.7 or b[2]>page.rect.width+0.7 or b[1]<-0.7 or b[3]>page.rect.height+0.7:
                                  raise RuntimeError(f'Text outside PDF page {idx+1}: {span["text"][:60]!r} at {b}')
                              if span['size']<7.15:raise RuntimeError(f'Unacceptably small PDF font {span["size"]}pt on page {idx+1}')
                  if idx:
                      s=stories[idx-1]
                      required=[s['headline'],s['name_a'],s['name_b'],s['lead'],s['why'],s['takeaway'],s['source'],'SOURCE']
                      p=s.get('player_note')
                      if p:required += [p['name'],p['text'],p['source']]
                      for item in required:
                          if _packed(item) not in _packed(norm):
                              raise RuntimeError(f'Page {idx+1} missing story data {item[:88]!r}')
                      for other in stories:
                          if other is not s and _packed(other['headline']) in _packed(norm):
                              raise RuntimeError(f'Page {idx+1} contains a second matchup headline')
                  else:
                      for s in stories:
                          for item in (s['name_a'],s['name_b'],s['headline']):
                              if _packed(item) not in _packed(norm):
                                  raise RuntimeError(f'Cover missing index text {item[:50]}')
                  page_report.append({'page':idx+1,'role':'cover' if idx==0 else f'matchup_{idx:02d}',
                                      'characters':len(norm),'minimum_visible_font_pt':round(minfont,2),
                                      'text_spans':len(bbox),'verified_one_story_per_page':bool(idx)})
              for token in ('H2H_PLUS_MEDIAN_REPLAY_MATCHES_LIVE_RECORDS','historic-scale rout','all-time record',
                            'what to watch','what it means next','&lt;','&#x27;'):
                  if token.casefold() in pdf_all:raise RuntimeError(f'Leaked code or invalid rhetoric: {token}')
              if _norm(parsed.parts[0] if parsed.parts else '') == '':
                  raise RuntimeError('Empty HTML content')
              return {'pages':len(doc),'page_geometry':page_report,'html_pdf_verified':True,
                      'editorial_acceptance':'HUMAN_REVIEW_REQUIRED'}


          def quality_report(stories,kind):
              angles=dict(Counter(s['angle'] for s in stories))
              structures=dict(Counter(s['structure'] for s in stories))
              headlines=[_norm(s['headline']) for s in stories]
              if len(set(headlines))!=6 or len(angles)<4 or max(angles.values())>2:
                  raise RuntimeError('Editorial headline/angle diversity gate failed')
              if len(structures)<3:raise RuntimeError(f'Need >=3 rhetorical structures, found {structures}')
              first=[_norm(s['lead'])[:38] for s in stories]
              ending=[_norm(s['takeaway']) for s in stories]
              if len(set(first))<5 or len(set(ending))<6:
                  raise RuntimeError('Repeated editorial leads or takeaways')
              for s in stories:
                  if not s['lead'] or not s['why'] or not s['takeaway']:
                      raise RuntimeError('Missing substantive story component')
                  if '?' in s['takeaway']:
                      raise RuntimeError('Generic closing questions are not editorial takeaways')
                  if len(s['lead'].split())>76 or len(s['why'].split())>81 or len(s['takeaway'].split())>45:
                      raise RuntimeError('Story too long for one phone page without shrinking typography')
                  if s['player_note'] and not s['player_note']['source']:
                      raise RuntimeError('Ungrounded player contribution')
              return {'unique_angles':len(angles),'angle_counts':angles,'rhetorical_structures':structures,
                      'headlines_unique':True,'lead_and_ending_duplicate_guard':True,
                      'player_notes_printed':sum(bool(s['player_note']) for s in stories),
                      'editorial_acceptance':'HUMAN_REVIEW_REQUIRED'}


          def execute(out,root,war_week,after_week,fixture=None):
              if war_week!=after_week+1 or not 4<=after_week<=17:
                  raise RuntimeError('Require adjacent weeks, at least three completed games, at most week 18')
              out.mkdir(parents=True,exist_ok=True)
              data=fixture_load(fixture) if fixture else snapshot(war_week,after_week)
              if data['war_week']!=war_week or data['aftermath_week']!=after_week:
                  raise RuntimeError('Week labels do not match sources')
              ids={i for g in data['war_games'] for i in (g['id_a'],g['id_b'])}
              if len(ids)!=12 or len({i for g in data['after_games'] for i in (g['id_a'],g['id_b'])})!=12:
                  raise RuntimeError('Not twelve unique teams in each edition')
              if fixture:
                  players=data.get('_verified_players_fixture') or {'recent':{},'final':{},'data_status':'No current player evidence in offline fixture'}
              else:
                  players=player_lenses(root,after_week,ids)
              warfacts=[war_facts(g,war_week,players) for g in data['war_games']]
              hist={str(g['id_a']):g['scores_a'] for g in data['war_games']}
              hist.update({str(g['id_b']):g['scores_b'] for g in data['war_games']})
              aftfacts=[after_facts(g,data,hist,players) for g in data['after_games']]
              war=join_stories(warfacts,'war',players,data['generated_at_utc'])
              aft=join_stories(aftfacts,'after',players,data['generated_at_utc'])
              logo,logohash=logo_source(root)
              from weasyprint import HTML
              checks={}
              for name,title,week,stories,kind in (('WarRoom','The Weekly War Room',war_week,war,'war'),
                                                    ('Aftermath','The Aftermath',after_week,aft,'after')):
                  qa=quality_report(stories,kind)
                  stem=f'LOG-NL26R1-{name}-W{week:02d}-Editorial-Shadow'
                  html=render_html(title,f'2026 · Week {week} · premium content review',stories,logo,data['generated_at_utc'],kind)
                  md=editorial_md(title,week,stories,data,kind)
                  (out/(stem+'.html')).write_text(html,encoding='utf-8')
                  (out/(stem+'.md')).write_text(md,encoding='utf-8')
                  pdf=out/(stem+'.pdf');HTML(string=html,base_url=str(root)).write_pdf(str(pdf))
                  checks[name]={**qa,**verify_pdf(pdf,stories,html,kind)}
                  # Small PNG page previews help the human reviewer inspect all 14 pages.
                  import fitz
                  doc=fitz.open(str(pdf))
                  for ix,p in enumerate(doc):
                      preview=out/f'{name}-page-{ix+1:02}.png'
                      p.get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False).save(preview)
                  doc.close()
                  for forbidden in ('unrostered players to investigate','free agent watch','best free agents'):
                      if forbidden in html.casefold() or forbidden in md.casefold():
                          raise RuntimeError('Private scouting/availability content appeared in reader edition')
              ledger={'model':'A-NL26R1','season':SEASON,'war_week':war_week,'aftermath_week':after_week,
                  'source':'Public Sleeper league matchups and verified starter points; identity-only roster-name cache',
                  'retrieved_utc':data['generated_at_utc'],
                  'snapshot_sha256':hashlib.sha256(json.dumps(data,sort_keys=True).encode()).hexdigest(),
                  'logo_sha256':logohash,'player_evidence_status':players['data_status'],
                  'fixture_test_not_live_evidence':bool(fixture),
                  'publication_authorized':False,'picks_archived':False,'editorial_approval':'HUMAN_REVIEW_REQUIRED',
                  'quality':checks,
                  'war':[{'teams':[s['name_a'],s['name_b']],'angle':s['angle'],'headline':s['headline'],
                          'structure':s['structure'],'source_keys':s['keys'],'starter_evidence':s['player_note'],
                          'candidates':s['all_candidates']} for s in war],
                  'after':[{'teams':[s['name_a'],s['name_b']],'angle':s['angle'],'headline':s['headline'],
                          'structure':s['structure'],'source_keys':s['keys'],'starter_evidence':s['player_note'],
                          'candidates':s['all_candidates']} for s in aft]}
              (out/'NL26R1-Editorial-Evidence-and-Decision-Ledger.json').write_text(json.dumps(ledger,indent=2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
              brief=['# A-NL26R1 — Editorial/PDF Acceptance Report','',
                  '**Green does not authorize publication. Human editorial approval remains required.**','',
                  f'- War Room: {checks["WarRoom"]["pages"]} pages, cover + six complete matchups.',
                  f'- Aftermath: {checks["Aftermath"]["pages"]} pages, cover + six complete matchups.',
                  '- All original matchups, median labels and team scores sourced from public Sleeper; standings reconstructed, provisional.',
                  '- Exactly one matchup per page. All rendered player and source notes remain on that matchup page.',
                  '- Three or more distinct prose structures and no duplicate headline or ending.',
                  '- Player callouts omitted if they fail materiality; no invented injury, lineup or retrospective pick claims.',
                  '- Original LOG logo preserved; no production actions, repository writes, email, or pick archiving.','',
                  '## Independent editorial review remains required','',
                  'Inspect every PDF page and compare these new storylines with the league’s preferred published style. '
                  'The automated gates establish sourcing and page completeness, not editorial taste.','']
              (out/'NL26R1-EDITORIAL-QA.md').write_text('\n'.join(brief),encoding='utf-8')
              (out/'ACCEPTANCE.txt').write_text('PASS: 12 grounded stories; 7 pages per issue; all text and sources per page; 3+ prose structures; privacy/read-only safeguards. HUMAN EDITORIAL APPROVAL REQUIRED.\n',encoding='utf-8')
              print('PASS: NL26R1 — 7 pages per issue, 12 story audits, no source-only overflow, read-only editorial shadow')


          def selftest():
              assert f2(Decimal('668.53')-Decimal('439.58'))=='228.95'
              assert esc('<respectable team name>')=='&lt;respectable team name&gt;'
              c=[entry(f'angle{i}',100+i,'H','lead','why','old question',['scores']) for i in range(6)]
              assert len(allocate([c for _ in range(6)]))==6
              print('PASS: NL26R1 arithmetic, one-pass HTML escaping, allocation and safety selftest')

          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--out',type=Path)
              p.add_argument('--root',type=Path,default=Path.cwd())
              p.add_argument('--war-week',type=int,default=9)
              p.add_argument('--aftermath-week',type=int,default=8)
              p.add_argument('--fixture',type=Path)
              p.add_argument('--selftest',action='store_true')
              args=p.parse_args()
              if args.selftest:selftest()
              else:execute(args.out,args.root,args.war_week,args.aftermath_week,args.fixture)
          PY
          python3 -m py_compile "$RUNNER_TEMP/log_nl26_editorial.py"
          python3 "$RUNNER_TEMP/log_nl26_editorial.py" --selftest
      - name: Create both evidence-led editorial shadow issues
