name: Cross-Position Apex Calibration V1 Phase 2 Cross-Study Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  cross-study-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard inputs and clean repository
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html
            scripts/validation/snapshot_values.py
            scripts/validation/repo_regression_checks.py
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase1.json
            research/position-weight-v2/position_weight_v2_phase5_frozen_candidates.json
            research/position-weight-v2/position_weight_v2_phase5_evaluation.json
            research/replacement-level-v2/replacement_level_v2_phase5_frozen_candidates.json
            research/replacement-level-v2/replacement_level_v2_phase5_evaluation.json
            research/production-v2/production_v2_phase9_preseason_candidates.json
            research/production-v2/production_v2_phase9_evaluation.json
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required input: $f"; exit 1; }
          done

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"

          outputs=(
            research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.json
            research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.md
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.py
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.json
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.md
            research/cross-position-apex-calibration-v1/phase2_reconciliation_manifest.json
          )
          for f in "${outputs[@]}"; do
            test ! -e "$f" || {
              echo "Refusing to overwrite existing Cross-Position Apex Calibration V1 Phase 2 artifact: $f"
              exit 1
            }
          done

          git rev-parse HEAD | tee "${RUNNER_TEMP}/starting_sha.txt"
          sha256sum index.html > "${RUNNER_TEMP}/production-baseline.sha256"

      - name: Preflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Freeze Phase 2 reconciliation preregistration
        shell: bash
        run: |
          set -euo pipefail

          cat > research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.json <<'JSON'
          {
            "study_id": "cross-position-apex-calibration-v1",
            "phase": 2,
            "status": "FROZEN_PRE_RECONCILIATION",
            "scope": "RESEARCH_ONLY_CROSS_STUDY_RECONCILIATION_NO_FITTING_NO_DEPLOYMENT",
            "primary_question": "Do the already-frozen Position Weight V2, Replacement Level V2, and Production V2 studies explain the current cross-position apex concern through distinct evidence, or do their effects overlap enough that stacking them would risk double counting and overcorrection?",
            "frozen_comparison_players": ["brian burns", "josh allen"],
            "rules": [
              "do not fit or optimize any coefficient",
              "do not select a Production V2 arm because of Week 1 results",
              "preserve every upstream frozen candidate artifact byte-for-byte",
              "use Position Weight V2 bridge_50 only because it was the sole preseason-frozen noncontrol arm",
              "use Replacement Level V2 stable_positions_only as the pre-frozen stability-restricted structural sensitivity arm while still reporting all four replacement families",
              "for Production V2, report the frozen history-weight 0.25, 0.45, and 0.65 sensitivity arms at fixed fp=0.50, evidence_hybrid ranks, and floor=0.15; do not label any one of them a winner",
              "never treat Week 1 collection-only evidence as deployment-grade evidence",
              "never force Brian Burns below Josh Allen as an objective"
            ],
            "current_board_sensitivities": {
              "position_weight_bridge_50": "exact current-board coefficient substitution with every non-position-weight factor held fixed",
              "replacement_stable_positions_only": "current-board structural sensitivity using the frozen legacy-to-stable replacement-baseline ratio and the unchanged affine PM transform; exact only when the live raw PM is not clamp-censored",
              "production_history_weight_band": "diagnostic transport of preseason-frozen value deltas from the 45% history reference to the 25% and 65% history arms; not an exact current production candidate"
            },
            "double_count_diagnostics": [
              "pairwise correlation and sign agreement of per-player FV deltas where comparable",
              "top absolute-mover overlap",
              "Position Weight bridge_50 plus Replacement stable_positions_only naive stacking stress test",
              "Burns/Allen ratio under each individually identified sensitivity",
              "source-state drift between preseason freezes and the current live board"
            ],
            "hard_gates": [
              "Phase 1 current apex diagnostic passed",
              "all three upstream prospective studies remain deployment-unauthorized",
              "all three prospective studies still preserve their frozen candidate identities",
              "Position Weight V2 and Replacement Level V2 have not reached calibration-review readiness before eight completed weeks",
              "Production V2 has not reached calibration-review readiness before eight completed weeks",
              "production index.html remains byte-for-byte unchanged"
            ],
            "decision_while_all_studies_are_pre_review": "HOLD_DEPLOYMENT_CONTINUE_FROZEN_COLLECTION",
            "decision_if_source_integrity_fails": "STOP_CROSS_STUDY_RECONCILIATION_SOURCE_INTEGRITY_FAILURE",
            "production_change_authorized": false
          }
          JSON

          cat > research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.md <<'MD'
          # Cross-Position Apex Calibration V1 — Phase 2 Reconciliation Preregistration

          **Status:** `FROZEN_PRE_RECONCILIATION`

          Phase 2 does not create a fourth calibration model. It reconciles the
          three preseason-frozen studies already capable of explaining the
          Burns/Allen apex concern:

          - Position Weight V2
          - Replacement Level V2
          - Production V2

          No coefficient is fit, selected, or deployed here. Week 1 evidence is
          collection-only and cannot be used to choose a Production V2 winner.

          The audit distinguishes exact current-board coefficient sensitivities
          from transported diagnostic sensitivities, quantifies source-state drift
          since the preseason freezes, and measures whether stacking structurally
          related changes would double count the same positional-economics signal.

          Passing this phase means the reconciliation is internally consistent and
          can be carried forward until the preregistered calibration-review window.
          It does not authorize any production change.
          MD

      - name: Write frozen Phase 2 reconciliation evaluator
        shell: bash
        run: |
          set -euo pipefail
          cat > research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.py <<'PY'
          #!/usr/bin/env python3
          """Cross-Position Apex Calibration V1 Phase 2 cross-study reconciliation."""

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import math
          from pathlib import Path
          import statistics
          import subprocess
          import sys
          from typing import Any

          SCRIPT = Path(__file__).resolve()
          ROOT = SCRIPT.parents[2]
          RESEARCH = ROOT / "research" / "cross-position-apex-calibration-v1"

          INDEX = ROOT / "index.html"
          SNAPSHOT_VALUES = ROOT / "scripts" / "validation" / "snapshot_values.py"

          PHASE1 = RESEARCH / "cross_position_apex_calibration_v1_phase1.json"

          PW_FROZEN = ROOT / "research" / "position-weight-v2" / "position_weight_v2_phase5_frozen_candidates.json"
          PW_EVAL = ROOT / "research" / "position-weight-v2" / "position_weight_v2_phase5_evaluation.json"

          RL_FROZEN = ROOT / "research" / "replacement-level-v2" / "replacement_level_v2_phase5_frozen_candidates.json"
          RL_EVAL = ROOT / "research" / "replacement-level-v2" / "replacement_level_v2_phase5_evaluation.json"

          PROD_FROZEN = ROOT / "research" / "production-v2" / "production_v2_phase9_preseason_candidates.json"
          PROD_EVAL = ROOT / "research" / "production-v2" / "production_v2_phase9_evaluation.json"

          PREREG_JSON = RESEARCH / "phase2_reconciliation_preregistration.json"
          PREREG_MD = RESEARCH / "phase2_reconciliation_preregistration.md"
          OUT_JSON = RESEARCH / "cross_position_apex_calibration_v1_phase2_reconciliation.json"
          OUT_MD = RESEARCH / "cross_position_apex_calibration_v1_phase2_reconciliation.md"
          MANIFEST = RESEARCH / "phase2_reconciliation_manifest.json"

          POSITIONS = ("QB", "RB", "WR", "TE", "DL", "LB", "DB")
          BURNS = "brian burns"
          ALLEN = "josh allen"

          PW_CONTROL = "deployed_control"
          PW_ARM = "bridge_50"

          RL_CONTROL = "legacy_control"
          RL_ARM = "stable_positions_only"

          PROD_REF = "fp_0.50__history_0.45__evidence_hybrid__floor_0.15"
          PROD_H25 = "fp_0.50__history_0.25__evidence_hybrid__floor_0.15"
          PROD_H65 = "fp_0.50__history_0.65__evidence_hybrid__floor_0.15"

          PM_INTERCEPT = -0.10
          PM_SLOPE = 0.75
          PM_FLOOR = 0.15
          PM_CEILING = 1.55
          GLOBAL_SCALE = 55.0
          CLAMP_EPS = 1e-9
          TOP_N = 20

          def read_json(path: Path) -> Any:
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def finite(value):
              if isinstance(value, bool):
                  return None
              try:
                  x = float(value)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None

          def js_round_positive(x: float) -> int:
              return math.floor(float(x) + 0.5)

          def clamp(x: float, lo: float, hi: float) -> float:
              return max(lo, min(hi, x))

          def pct(new, old):
              if old in (None, 0) or new is None:
                  return None
              return float(new) / float(old) - 1.0

          def load_snapshot_module():
              if str(ROOT / "scripts" / "validation") not in sys.path:
                  sys.path.insert(0, str(ROOT / "scripts" / "validation"))
              import snapshot_values
              return snapshot_values

          def current_board(snapshot_values):
              cfg = snapshot_values.load_from_html(INDEX)
              values = snapshot_values.compute_all_values(cfg)
              return cfg, values

          def rank_order(board):
              return sorted(
                  board,
                  key=lambda key: (-int(board[key]["value"]), key),
              )

          def top_rows(board, n=TOP_N):
              order = rank_order(board)[:n]
              return [
                  {
                      "rank": i + 1,
                      "key": key,
                      "pos": board[key]["pos"],
                      "fv": int(board[key]["value"]),
                      "prod_mult": finite(board[key].get("prod_mult")),
                      "age_mult": finite(board[key].get("age_mult")),
                  }
                  for i, key in enumerate(order)
              ]

          def build_pw_board(cfg, current, pw_frozen):
              weights = pw_frozen["variants"][PW_ARM]["position_weights"]
              out = {}
              for key, rec in current.items():
                  pos = rec["pos"]
                  new_pw = float(weights.get(pos, cfg["position_weight"].get(pos, 1.0)))
                  value = js_round_positive(
                      100.0
                      * new_pw
                      * float(rec["age_mult"])
                      * float(rec["prod_mult"])
                      * GLOBAL_SCALE
                  )
                  out[key] = {
                      **rec,
                      "value": value,
                      "position_weight": new_pw,
                  }
              return out

          def replacement_ratio_scales(rl_frozen):
              variants = rl_frozen["variants"]
              control = variants[RL_CONTROL]["baselines"]
              arm = variants[RL_ARM]["baselines"]
              out = {}
              for pos in POSITIONS:
                  old = float(control[pos]["combined_points"])
                  new = float(arm[pos]["combined_points"])
                  out[pos] = {
                      "legacy_rank": int(control[pos]["rank"]),
                      "arm_rank": int(arm[pos]["rank"]),
                      "legacy_baseline_points": old,
                      "arm_baseline_points": new,
                      "ratio_scale": old / new,
                  }
              return out

          def candidate_from_effective_pm(
              snapshot_values,
              cfg,
              key,
              pos,
              role,
              age,
              new_raw,
              position_weight,
          ):
              effective_pm, raw_returned = snapshot_values.production_multiplier(
                  key,
                  role,
                  {key: float(new_raw)},
                  cfg["no_real_history"],
                  cfg["role_mult"],
              )
              age_mult = snapshot_values.effective_age_multiplier(
                  pos,
                  age,
                  role,
                  key,
                  effective_pm,
                  raw_returned,
                  cfg,
              )
              value = js_round_positive(
                  100.0
                  * float(position_weight)
                  * float(age_mult)
                  * float(effective_pm)
                  * GLOBAL_SCALE
              )
              return {
                  "value": value,
                  "prod_mult": float(effective_pm),
                  "raw_prod_mult": finite(raw_returned),
                  "age_mult": float(age_mult),
              }

          def build_replacement_sensitivity(snapshot_values, cfg, current, scales, pw_weights=None):
              rows = {}
              identified = 0
              censored = 0

              for key, rec in current.items():
                  pos = rec["pos"]
                  raw = finite(cfg["prod_mult"].get(key))
                  role = rec["role"]
                  age = rec["age"]
                  current_pw = float(cfg["position_weight"].get(pos, 1.0))
                  target_pw = (
                      float(pw_weights[pos])
                      if pw_weights is not None and pos in pw_weights
                      else current_pw
                  )

                  row = {
                      "identified": False,
                      "reason": None,
                      "value": None,
                      "lower_value": None,
                      "upper_value": None,
                      "raw_prod_mult": None,
                      "effective_prod_mult": None,
                      "age_mult": None,
                      "position_weight": target_pw,
                  }

                  if pos not in scales or raw is None:
                      row["reason"] = "missing_position_or_raw_pm"
                      rows[key] = row
                      censored += 1
                      continue

                  scale = float(scales[pos]["ratio_scale"])

                  # If the raw deployed PM is not at a clamp boundary, invert the
                  # unchanged affine transform exactly, rescale the production ratio
                  # by the frozen baseline shift, and transform it back.
                  if raw > PM_FLOOR + CLAMP_EPS and raw < PM_CEILING - CLAMP_EPS:
                      live_ratio = (raw - PM_INTERCEPT) / PM_SLOPE
                      candidate_ratio = live_ratio * scale
                      new_raw = clamp(
                          PM_INTERCEPT + PM_SLOPE * candidate_ratio,
                          PM_FLOOR,
                          PM_CEILING,
                      )
                      cand = candidate_from_effective_pm(
                          snapshot_values,
                          cfg,
                          key,
                          pos,
                          role,
                          age,
                          new_raw,
                          target_pw,
                      )
                      row.update({
                          "identified": True,
                          "reason": "exact_affine_inverse_and_frozen_baseline_rescale",
                          "value": int(cand["value"]),
                          "raw_prod_mult": cand["raw_prod_mult"],
                          "effective_prod_mult": cand["prod_mult"],
                          "age_mult": cand["age_mult"],
                      })
                      identified += 1
                      rows[key] = row
                      continue

                  # Clamp-censored values do not identify the latent production
                  # ratio. Give a bounded value range where possible rather than
                  # inventing a point estimate.
                  row["reason"] = "live_raw_pm_clamp_censored"
                  censored += 1

                  if raw >= PM_CEILING - CLAMP_EPS and scale <= 1.0 + 1e-12:
                      latent_min = (PM_CEILING - PM_INTERCEPT) / PM_SLOPE
                      min_ratio = latent_min * scale
                      min_raw = clamp(
                          PM_INTERCEPT + PM_SLOPE * min_ratio,
                          PM_FLOOR,
                          PM_CEILING,
                      )
                      lo = candidate_from_effective_pm(
                          snapshot_values, cfg, key, pos, role, age, min_raw, target_pw
                      )["value"]
                      hi = candidate_from_effective_pm(
                          snapshot_values, cfg, key, pos, role, age, PM_CEILING, target_pw
                      )["value"]
                      row["lower_value"] = int(min(lo, hi))
                      row["upper_value"] = int(max(lo, hi))
                  elif raw <= PM_FLOOR + CLAMP_EPS and scale >= 1.0 - 1e-12:
                      latent_max = (PM_FLOOR - PM_INTERCEPT) / PM_SLOPE
                      max_ratio = latent_max * scale
                      max_raw = clamp(
                          PM_INTERCEPT + PM_SLOPE * max_ratio,
                          PM_FLOOR,
                          PM_CEILING,
                      )
                      lo = candidate_from_effective_pm(
                          snapshot_values, cfg, key, pos, role, age, PM_FLOOR, target_pw
                      )["value"]
                      hi = candidate_from_effective_pm(
                          snapshot_values, cfg, key, pos, role, age, max_raw, target_pw
                      )["value"]
                      row["lower_value"] = int(min(lo, hi))
                      row["upper_value"] = int(max(lo, hi))

                  rows[key] = row

              return rows, {"identified": identified, "clamp_or_missing": censored}

          def production_vectors(prod_frozen):
              normal = prod_frozen["normal_players"]
              keys = [row["key"] for row in normal]
              variants = prod_frozen["variants"]
              for required in (PROD_REF, PROD_H25, PROD_H65):
                  if required not in variants:
                      raise RuntimeError(f"required frozen Production V2 sensitivity arm missing: {required}")

              def vector(name):
                  vals = variants[name]["value_vector"]
                  if len(vals) != len(keys):
                      raise RuntimeError(f"{name}: frozen value vector length mismatch")
                  return dict(zip(keys, map(int, vals)))

              return keys, vector(PROD_REF), vector(PROD_H25), vector(PROD_H65)

          def production_transport(current, ref, arm):
              rows = {}
              for key, ref_value in ref.items():
                  if key not in current or ref_value <= 0:
                      continue
                  arm_value = arm[key]
                  ratio = float(arm_value) / float(ref_value)
                  rows[key] = {
                      "frozen_reference_value": int(ref_value),
                      "frozen_arm_value": int(arm_value),
                      "frozen_value_ratio": ratio,
                      "transported_current_value": js_round_positive(
                          float(current[key]["value"]) * ratio
                      ),
                  }
              return rows

          def frozen_control_drift(current, pw_frozen, prod_frozen):
              pw_rows = []
              for key, frozen in pw_frozen.get("players", {}).items():
                  if key not in current:
                      continue
                  now = float(current[key]["prod_mult"])
                  old = float(frozen["effective_prod_mult"])
                  delta = now - old
                  if abs(delta) > 1e-12 or current[key]["pos"] != frozen["pos"]:
                      pw_rows.append({
                          "key": key,
                          "frozen_pos": frozen["pos"],
                          "current_pos": current[key]["pos"],
                          "frozen_effective_prod_mult": old,
                          "current_effective_prod_mult": now,
                          "prod_mult_delta": delta,
                          "prod_mult_change_pct": pct(now, old),
                      })

              prod_keys = [row["key"] for row in prod_frozen["normal_players"]]
              frozen_values = prod_frozen["deployed_control"]["value_vector"]
              prod_rows = []
              for key, old_value in zip(prod_keys, frozen_values):
                  if key not in current or int(old_value) <= 0:
                      continue
                  now = int(current[key]["value"])
                  old = int(old_value)
                  if now != old:
                      prod_rows.append({
                          "key": key,
                          "frozen_value": old,
                          "current_value": now,
                          "value_delta": now - old,
                          "value_change_pct": pct(now, old),
                      })

              pw_rows.sort(key=lambda r: (-abs(r["prod_mult_delta"]), r["key"]))
              prod_rows.sort(key=lambda r: (-abs(r["value_change_pct"]), r["key"]))
              return {
                  "position_weight_freeze_vs_current": {
                      "changed_player_count": len(pw_rows),
                      "largest_changes": pw_rows[:20],
                  },
                  "production_freeze_vs_current": {
                      "changed_player_count": len(prod_rows),
                      "largest_changes": prod_rows[:20],
                  },
              }

          def pearson(xs, ys):
              if len(xs) != len(ys) or len(xs) < 3:
                  return None
              mx = statistics.fmean(xs)
              my = statistics.fmean(ys)
              dx = [x - mx for x in xs]
              dy = [y - my for y in ys]
              denom = math.sqrt(sum(x*x for x in dx) * sum(y*y for y in dy))
              if denom <= 0:
                  return None
              return sum(x*y for x, y in zip(dx, dy)) / denom

          def delta_map(current, scenario):
              out = {}
              for key, rec in current.items():
                  if key not in scenario:
                      continue
                  new = scenario[key]
                  if isinstance(new, dict):
                      value = new.get("value")
                      if value is None:
                          value = new.get("transported_current_value")
                  else:
                      value = None
                  if value is None or rec["value"] == 0:
                      continue
                  out[key] = float(value) / float(rec["value"]) - 1.0
              return out

          def overlap_metrics(a, b):
              keys = sorted(set(a) & set(b))
              if len(keys) < 3:
                  return {"n": len(keys)}

              ax = [a[k] for k in keys]
              bx = [b[k] for k in keys]
              sign_agree = sum(
                  1 for x, y in zip(ax, bx)
                  if (x == 0 and y == 0) or (x > 0 and y > 0) or (x < 0 and y < 0)
              ) / len(keys)

              top_n = min(50, len(keys))
              atop = {
                  k for k in sorted(keys, key=lambda k: (-abs(a[k]), k))[:top_n]
              }
              btop = {
                  k for k in sorted(keys, key=lambda k: (-abs(b[k]), k))[:top_n]
              }

              return {
                  "n": len(keys),
                  "pearson_delta_correlation": pearson(ax, bx),
                  "same_direction_share": sign_agree,
                  "top50_absolute_mover_overlap": (
                      len(atop & btop) / top_n if top_n else None
                  ),
              }

          def study_readiness(pw_eval, rl_eval, prod_eval):
              pw_weeks = int(pw_eval.get("completed_consecutive_week_count") or 0)
              rl_weeks = int(rl_eval.get("completed_consecutive_week_count") or 0)
              prod_weeks = int(prod_eval.get("completed_prefix_count") or 0)

              return {
                  "position_weight_v2": {
                      "completed_consecutive_weeks": pw_weeks,
                      "status": "collection_only" if pw_weeks <= 3 else (
                          "early_diagnostic_only" if pw_weeks <= 7 else "calibration_review_eligible"
                      ),
                      "bridge_50_vs_control": pw_eval.get("bridge_50_vs_control"),
                  },
                  "replacement_level_v2": {
                      "completed_consecutive_weeks": rl_weeks,
                      "status": "collection_only" if rl_weeks <= 3 else (
                          "early_diagnostic_only" if rl_weeks <= 7 else "calibration_review_eligible"
                      ),
                      "primary_variants": {
                          name: {
                              "position_balanced_mean_mae": (
                                  (
                                      rl_eval.get("primary_active_game_ppg_relative_production", {})
                                      .get("variants", {})
                                      .get(name, {})
                                      .get("position_balanced_mean_mae")
                                  )
                              )
                          }
                          for name in (
                              "legacy_control",
                              "prior_limited_evidence",
                              "stable_positions_only",
                              "full_phase2_leaders",
                          )
                      },
                  },
                  "production_v2": {
                      "completed_consecutive_weeks": prod_weeks,
                      "status": "collection_only" if prod_weeks <= 3 else (
                          "early_diagnostic_only" if prod_weeks <= 7 else "calibration_review_eligible"
                      ),
                      "deployed_control_rank_among_121": (
                          next(iter(prod_eval.get("windows", {}).values()), {})
                          .get("deployed_control_rank_among_121")
                      ),
                      "history_weight_profiles": (
                          next(iter(prod_eval.get("windows", {}).values()), {})
                          .get("parameter_profiles", {})
                          .get("history_weight")
                      ),
                  },
              }

          def comparison_row(key, current, pw_board, rl_rows, rl_pw_rows, h25, h65):
              cur = current.get(key)
              if cur is None:
                  return None
              r = rl_rows.get(key) or {}
              rp = rl_pw_rows.get(key) or {}
              return {
                  "key": key,
                  "position": cur["pos"],
                  "control_fv": int(cur["value"]),
                  "control_effective_prod_mult": finite(cur.get("prod_mult")),
                  "control_raw_prod_mult": None,
                  "position_weight_bridge_50_fv": int(pw_board[key]["value"]),
                  "replacement_stable_fv": r.get("value"),
                  "replacement_stable_lower_fv": r.get("lower_value"),
                  "replacement_stable_upper_fv": r.get("upper_value"),
                  "replacement_stable_identified": bool(r.get("identified")),
                  "production_history25_transport_fv": (
                      h25.get(key, {}).get("transported_current_value")
                  ),
                  "production_history65_transport_fv": (
                      h65.get(key, {}).get("transported_current_value")
                  ),
                  "pw_plus_replacement_stress_fv": rp.get("value"),
                  "pw_plus_replacement_stress_identified": bool(rp.get("identified")),
              }

          def apex_tracking(current, pw_board, rl_rows, rl_pw_rows, h25, h65):
              rows = []
              for rank, key in enumerate(rank_order(current)[:TOP_N], 1):
                  rec = comparison_row(
                      key, current, pw_board, rl_rows, rl_pw_rows, h25, h65
                  )
                  rec["control_rank"] = rank
                  rows.append(rec)
              return rows

          def ratio_from_rows(a, b, field):
              av = a.get(field) if a else None
              bv = b.get(field) if b else None
              if av is None or bv in (None, 0):
                  return None
              return float(av) / float(bv)

          def build_result():
              phase1 = read_json(PHASE1)
              pw_frozen = read_json(PW_FROZEN)
              pw_eval = read_json(PW_EVAL)
              rl_frozen = read_json(RL_FROZEN)
              rl_eval = read_json(RL_EVAL)
              prod_frozen = read_json(PROD_FROZEN)
              prod_eval = read_json(PROD_EVAL)

              snapshot_values = load_snapshot_module()
              cfg, current = current_board(snapshot_values)

              # Source integrity / frozen identity.
              source_checks = {
                  "phase1_passed": (
                      phase1.get("decision")
                      == "PASS_CROSS_POSITION_APEX_CALIBRATION_V1_PHASE1_REVIEW_REQUIRED"
                  ),
                  "pw_deployment_unauthorized": pw_eval.get("deployment_authorized") is False,
                  "rl_deployment_unauthorized": rl_eval.get("deployment_authorized") is False,
                  "prod_deployment_unauthorized": prod_eval.get("deployment_authorized") is False,
                  "pw_frozen_arm_identity": (
                      pw_frozen.get("variant_manifest") == [PW_CONTROL, PW_ARM]
                  ),
                  "rl_frozen_arm_identity": (
                      set(rl_frozen.get("variant_manifest", []))
                      == {
                          "legacy_control",
                          "prior_limited_evidence",
                          "stable_positions_only",
                          "full_phase2_leaders",
                      }
                  ),
                  "prod_frozen_sensitivity_arms_present": all(
                      name in prod_frozen.get("variants", {})
                      for name in (PROD_REF, PROD_H25, PROD_H65)
                  ),
              }

              pw_board = build_pw_board(cfg, current, pw_frozen)

              rl_scales = replacement_ratio_scales(rl_frozen)
              rl_rows, rl_coverage = build_replacement_sensitivity(
                  snapshot_values, cfg, current, rl_scales
              )
              pw_weights = pw_frozen["variants"][PW_ARM]["position_weights"]
              rl_pw_rows, rl_pw_coverage = build_replacement_sensitivity(
                  snapshot_values, cfg, current, rl_scales, pw_weights=pw_weights
              )

              _, prod_ref, prod_h25, prod_h65 = production_vectors(prod_frozen)
              h25 = production_transport(current, prod_ref, prod_h25)
              h65 = production_transport(current, prod_ref, prod_h65)

              drift = frozen_control_drift(current, pw_frozen, prod_frozen)
              readiness = study_readiness(pw_eval, rl_eval, prod_eval)

              pw_delta = delta_map(current, pw_board)
              rl_delta = delta_map(current, rl_rows)
              h25_delta = delta_map(current, h25)
              h65_delta = delta_map(current, h65)

              overlap = {
                  "position_weight_vs_replacement": overlap_metrics(pw_delta, rl_delta),
                  "position_weight_vs_production_history25": overlap_metrics(pw_delta, h25_delta),
                  "position_weight_vs_production_history65": overlap_metrics(pw_delta, h65_delta),
                  "replacement_vs_production_history25": overlap_metrics(rl_delta, h25_delta),
                  "replacement_vs_production_history65": overlap_metrics(rl_delta, h65_delta),
              }

              burns = comparison_row(
                  BURNS, current, pw_board, rl_rows, rl_pw_rows, h25, h65
              )
              allen = comparison_row(
                  ALLEN, current, pw_board, rl_rows, rl_pw_rows, h25, h65
              )

              ratio_fields = {
                  "control": "control_fv",
                  "position_weight_bridge_50": "position_weight_bridge_50_fv",
                  "replacement_stable": "replacement_stable_fv",
                  "production_history25_transport": "production_history25_transport_fv",
                  "production_history65_transport": "production_history65_transport_fv",
                  "pw_plus_replacement_stress": "pw_plus_replacement_stress_fv",
              }
              burns_allen_ratios = {
                  name: ratio_from_rows(burns, allen, field)
                  for name, field in ratio_fields.items()
              }

              # No study may be treated as calibration-ready before eight completed
              # consecutive weeks. This phase intentionally freezes a HOLD while all
              # three are still pre-review.
              all_pre_review = all(
                  readiness[name]["completed_consecutive_weeks"] < 8
                  for name in readiness
              )

              source_integrity_pass = all(source_checks.values())
              decision = (
                  "HOLD_DEPLOYMENT_CONTINUE_FROZEN_COLLECTION"
                  if source_integrity_pass and all_pre_review
                  else (
                      "STOP_CROSS_STUDY_RECONCILIATION_SOURCE_INTEGRITY_FAILURE"
                      if not source_integrity_pass
                      else "REVIEW_WINDOW_REACHED_RECONCILIATION_MUST_BE_RERUN"
                  )
              )

              result = {
                  "schema_version": 1,
                  "study_id": "cross-position-apex-calibration-v1",
                  "phase": 2,
                  "status": "CROSS_STUDY_RECONCILIATION_COMPLETE",
                  "decision": decision,
                  "research_only": True,
                  "deployment_authorized": False,
                  "production_change_authorized": False,
                  "coefficient_fitting_performed": False,
                  "week1_arm_selection_performed": False,
                  "repo_commit_sha_evaluated": subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], text=True
                  ).strip(),
                  "source_integrity": source_checks,
                  "study_readiness": readiness,
                  "current_board": {
                      "player_count": len(current),
                      "top20": top_rows(current),
                  },
                  "frozen_arm_context": {
                      "position_weight": {
                          "control": pw_frozen["variants"][PW_CONTROL]["position_weights"],
                          "bridge_50": pw_frozen["variants"][PW_ARM]["position_weights"],
                      },
                      "replacement": {
                          name: rl_frozen["variants"][name]["replacement_ranks"]
                          for name in rl_frozen["variant_manifest"]
                      },
                      "replacement_stable_baseline_rescale": rl_scales,
                      "production_history_sensitivity": {
                          "reference": PROD_REF,
                          "history25": PROD_H25,
                          "history65": PROD_H65,
                          "selection_policy": "report_band_only_no_winner",
                      },
                  },
                  "current_state_drift_since_preseason_freezes": drift,
                  "replacement_current_board_identifiability": {
                      "replacement_only": rl_coverage,
                      "pw_plus_replacement": rl_pw_coverage,
                      "note": (
                          "Clamp-censored live raw PMs do not identify their latent "
                          "production ratio. They are reported as bounds where the "
                          "direction permits; no point estimate is invented."
                      ),
                  },
                  "double_count_diagnostics": overlap,
                  "brian_burns": burns,
                  "josh_allen": allen,
                  "burns_to_allen_ratio_by_sensitivity": burns_allen_ratios,
                  "current_top20_cross_study_tracking": apex_tracking(
                      current, pw_board, rl_rows, rl_pw_rows, h25, h65
                  ),
                  "naive_stacking_guardrail": {
                      "position_weight_plus_replacement_is_stress_test_only": True,
                      "production_transport_is_never_stacked_into_a_candidate": True,
                      "reason": (
                          "Position weight and replacement rank both alter cross-position "
                          "scale. Production history transports are additionally post-freeze "
                          "state transports. Stacking them as a candidate before the review "
                          "window would risk double counting and outcome-contaminated tuning."
                      ),
                  },
                  "interpretation": (
                      "This artifact reconciles already-frozen evidence only. It does not "
                      "pick a winning model, does not use Brian Burns versus Josh Allen as "
                      "a target, and does not authorize deployment. Rerun after the frozen "
                      "studies reach their preregistered calibration-review window."
                  ),
                  "input_sha256": {
                      str(path.relative_to(ROOT)): sha256(path)
                      for path in (
                          INDEX,
                          PHASE1,
                          PW_FROZEN,
                          PW_EVAL,
                          RL_FROZEN,
                          RL_EVAL,
                          PROD_FROZEN,
                          PROD_EVAL,
                      )
                  },
              }
              return result

          def fmt_num(x, digits=4):
              return "—" if x is None else f"{float(x):.{digits}f}"

          def fmt_int(x):
              return "—" if x is None else str(int(x))

          def markdown(r):
              lines = [
                  "# Cross-Position Apex Calibration V1 — Phase 2 Cross-Study Reconciliation",
                  "",
                  f"**Decision:** `{r['decision']}`",
                  "",
                  "**Research only. No production change is authorized.**",
                  "",
                  "## Readiness",
                  "",
                  "| Study | Completed weeks | Current stage |",
                  "|---|---:|---|",
              ]
              for name, row in r["study_readiness"].items():
                  lines.append(
                      f"| `{name}` | {row['completed_consecutive_weeks']} | `{row['status']}` |"
                  )

              lines += [
                  "",
                  "## Frozen structural arms",
                  "",
                  "Position Weight V2: `deployed_control` vs `bridge_50`.",
                  "",
                  "Replacement Level V2: all four frozen rank families are preserved;",
                  "`stable_positions_only` is used only as the pre-frozen stability-restricted",
                  "current-board structural sensitivity arm.",
                  "",
                  "Production V2: history 25% / 45% / 65% are reported as a frozen",
                  "sensitivity band at fixed FP=0.50, evidence-hybrid ranks, floor=0.15.",
                  "No Week-1 winner is selected.",
                  "",
                  "## Brian Burns vs Josh Allen",
                  "",
                  "| Sensitivity | Burns FV | Allen FV | Burns/Allen |",
                  "|---|---:|---:|---:|",
              ]

              b = r["brian_burns"]
              a = r["josh_allen"]
              fields = [
                  ("Current control", "control_fv", "control"),
                  ("Position Weight bridge_50", "position_weight_bridge_50_fv", "position_weight_bridge_50"),
                  ("Replacement stable", "replacement_stable_fv", "replacement_stable"),
                  ("Production history 25% transport", "production_history25_transport_fv", "production_history25_transport"),
                  ("Production history 65% transport", "production_history65_transport_fv", "production_history65_transport"),
                  ("PW + replacement naive stress", "pw_plus_replacement_stress_fv", "pw_plus_replacement_stress"),
              ]
              for label, field, ratio_key in fields:
                  lines.append(
                      f"| {label} | {fmt_int(b.get(field))} | {fmt_int(a.get(field))} | "
                      f"{fmt_num(r['burns_to_allen_ratio_by_sensitivity'].get(ratio_key), 4)} |"
                  )

              if not b.get("replacement_stable_identified"):
                  lines += [
                      "",
                      "Burns replacement sensitivity is clamp-censored; the JSON preserves",
                      "any defensible lower/upper FV bounds instead of inventing a point estimate.",
                  ]

              lines += [
                  "",
                  "## Double-count diagnostics",
                  "",
                  "| Pair | N | Delta correlation | Same-direction share | Top-50 mover overlap |",
                  "|---|---:|---:|---:|---:|",
              ]
              for name, row in r["double_count_diagnostics"].items():
                  lines.append(
                      f"| `{name}` | {row.get('n', 0)} | "
                      f"{fmt_num(row.get('pearson_delta_correlation'), 4)} | "
                      f"{fmt_num(row.get('same_direction_share'), 4)} | "
                      f"{fmt_num(row.get('top50_absolute_mover_overlap'), 4)} |"
                  )

              lines += [
                  "",
                  "## Current top-20 tracking",
                  "",
                  "| # | Player | Pos | Control | PW bridge | Repl stable | Hist25 transport | Hist65 transport | PW+Repl stress |",
                  "|---:|---|---|---:|---:|---:|---:|---:|---:|",
              ]
              for row in r["current_top20_cross_study_tracking"]:
                  lines.append(
                      f"| {row['control_rank']} | {row['key']} | {row['position']} | "
                      f"{fmt_int(row.get('control_fv'))} | "
                      f"{fmt_int(row.get('position_weight_bridge_50_fv'))} | "
                      f"{fmt_int(row.get('replacement_stable_fv'))} | "
                      f"{fmt_int(row.get('production_history25_transport_fv'))} | "
                      f"{fmt_int(row.get('production_history65_transport_fv'))} | "
                      f"{fmt_int(row.get('pw_plus_replacement_stress_fv'))} |"
                  )

              lines += [
                  "",
                  "## Provenance / drift guardrail",
                  "",
                  f"- Position Weight freeze players with current PM/position drift: "
                  f"**{r['current_state_drift_since_preseason_freezes']['position_weight_freeze_vs_current']['changed_player_count']}**",
                  f"- Production freeze players with current FV drift: "
                  f"**{r['current_state_drift_since_preseason_freezes']['production_freeze_vs_current']['changed_player_count']}**",
                  "",
                  "Those differences are expected to include legitimate post-freeze releases.",
                  "They are why Production V2 history-weight results are shown as transported",
                  "sensitivities rather than falsely presented as exact current-board candidates.",
                  "",
                  "## Decision semantics",
                  "",
                  "While all three studies remain before the eight-week calibration-review",
                  "window, this audit holds deployment and preserves the frozen collection.",
                  "No coefficient fitting or Week-1 arm selection occurs here.",
                  "",
              ]
              return "\n".join(lines)

          def write_outputs():
              result = build_result()
              OUT_JSON.write_text(
                  json.dumps(result, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              OUT_MD.write_text(markdown(result).rstrip() + "\n", encoding="utf-8")

              manifest = {
                  "study_id": result["study_id"],
                  "phase": 2,
                  "decision": result["decision"],
                  "deployment_authorized": False,
                  "production_change_authorized": False,
                  "coefficient_fitting_performed": False,
                  "week1_arm_selection_performed": False,
                  "repo_commit_sha_evaluated": result["repo_commit_sha_evaluated"],
                  "preregistration_sha256": sha256(PREREG_JSON),
                  "output_sha256": {
                      str(PREREG_JSON.relative_to(ROOT)): sha256(PREREG_JSON),
                      str(PREREG_MD.relative_to(ROOT)): sha256(PREREG_MD),
                      str(SCRIPT.relative_to(ROOT)): sha256(SCRIPT),
                      str(OUT_JSON.relative_to(ROOT)): sha256(OUT_JSON),
                      str(OUT_MD.relative_to(ROOT)): sha256(OUT_MD),
                  },
              }
              MANIFEST.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              print(json.dumps({
                  "decision": result["decision"],
                  "study_readiness": result["study_readiness"],
                  "burns_to_allen_ratio_by_sensitivity": result[
                      "burns_to_allen_ratio_by_sensitivity"
                  ],
                  "replacement_identifiability": result[
                      "replacement_current_board_identifiability"
                  ],
                  "double_count_diagnostics": result["double_count_diagnostics"],
              }, indent=2))

          def selftest():
              assert js_round_positive(10.49) == 10
              assert js_round_positive(10.50) == 11
              assert abs(((1.4449 - PM_INTERCEPT) / PM_SLOPE) - 2.0598666666666665) < 1e-9
              assert clamp(2.0, PM_FLOOR, PM_CEILING) == PM_CEILING
              assert PROD_H25 != PROD_REF != PROD_H65
              print("Cross-Position Apex Calibration V1 Phase 2 reconciliation self-test PASS")

          def main():
              ap = argparse.ArgumentParser()
              mode = ap.add_mutually_exclusive_group(required=True)
              mode.add_argument("--selftest", action="store_true")
              mode.add_argument("--write", action="store_true")
              args = ap.parse_args()

              if args.selftest:
                  selftest()
                  return
              write_outputs()

          if __name__ == "__main__":
              main()
          PY

      - name: Run evaluator self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.py --selftest

      - name: Run frozen Phase 2 cross-study reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.py --write
          cat research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.md

      - name: Enforce reconciliation integrity gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "research/cross-position-apex-calibration-v1/"
              "cross_position_apex_calibration_v1_phase2_reconciliation.json"
          )
          result = json.loads(path.read_text())

          if not all(result["source_integrity"].values()):
              failed = [
                  k for k, v in result["source_integrity"].items() if not v
              ]
              raise SystemExit("Source-integrity failure: " + ", ".join(failed))

          if result["coefficient_fitting_performed"]:
              raise SystemExit("Phase 2 illegally fit coefficients")
          if result["week1_arm_selection_performed"]:
              raise SystemExit("Phase 2 illegally selected an arm from Week 1")
          if result["deployment_authorized"] or result["production_change_authorized"]:
              raise SystemExit("Phase 2 illegally authorized deployment")

          expected = "HOLD_DEPLOYMENT_CONTINUE_FROZEN_COLLECTION"
          if result["decision"] != expected:
              raise SystemExit(
                  f"Unexpected Phase 2 decision before review window: {result['decision']}"
              )

          print("PASS: cross-study reconciliation gates hold.")
          PY

      - name: Postflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove production unchanged and only frozen research artifacts changed
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c "${RUNNER_TEMP}/production-baseline.sha256"

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.json",
              "research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.md",
              "research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.py",
              "research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.json",
              "research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.md",
              "research/cross-position-apex-calibration-v1/phase2_reconciliation_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          if actual != expected:
              raise SystemExit(
                  "Unexpected changed-file set.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(actual)}"
              )
          print("PASS: exactly six frozen Phase 2 reconciliation artifacts changed.")
          PY

      - name: Commit frozen Phase 2 reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.json \
            research/cross-position-apex-calibration-v1/phase2_reconciliation_preregistration.md \
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.py \
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.json \
            research/cross-position-apex-calibration-v1/cross_position_apex_calibration_v1_phase2_reconciliation.md \
            research/cross-position-apex-calibration-v1/phase2_reconciliation_manifest.json

          git diff --cached --check
          git commit -m "research: freeze cross-position apex calibration v1 phase 2 reconciliation"
          git push origin main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "PASS: Phase 2 reconciliation committed; production remained unchanged."
