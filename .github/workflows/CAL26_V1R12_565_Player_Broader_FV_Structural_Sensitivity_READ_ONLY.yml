name: CAL26 V1R12 - Broader 565 Player FV Structural Mechanism Sensitivity READ ONLY

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r12-broader-fv-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  broader_fv_structural_sensitivity:
    name: Audit post-V1R11 565 prices, 12 deferred owner anchors and 116 model hypotheses (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout post-release calculator without push authorization
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up pinned Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download actual green V1R9 565-player owner review evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r12-green-source"
          gh run download 39660339898 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R9-565-Owner-Anchored-Pricing-Shadow-READ-ONLY \
            --dir "$RUNNER_TEMP/cal26-v1r12-green-source"
          test -s "$RUNNER_TEMP/cal26-v1r12-green-source/CAL26_V1R9_565_Player_Owner_Anchor_Pricing_Shadow.csv"
          test -s "$RUNNER_TEMP/cal26-v1r12-green-source/CAL26_V1R9_Manifest.json"

      - name: Materialize exact structural experiment engine outside repository
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r12_structural_experiment.py" <<'PY_CAL26_V1R12'
          #!/usr/bin/env python3
          """CAL26 V1R12: exploratory, immutable-owner-controls, 565-player FV model mechanism audit.
          
          This is NOT a release engine. Prior owner feedback is selected, nonrandom and ordinal.
          Does not edit any repository file. It varies hypothetical structural multipliers,
          using the same positive-number rounding as the live JavaScript calculator.
          """
          from __future__ import annotations
          import argparse
          import csv
          import hashlib
          import json
          import math
          import sys
          from collections import Counter
          from pathlib import Path
          
          ROOT_RELEASE='model/releases/cal26-v1r11-owner-selected-fv-2026-10-21-v1/release.json'
          SOURCE_NAME='CAL26_V1R9_565_Player_Owner_Anchor_Pricing_Shadow.csv'
          SOURCE_MANIFEST='CAL26_V1R9_Manifest.json'
          FROZEN_RUN=39660339898
          FAMILIES={
              'QB_ELITE_PRIME':lambda p:(p['pos']=='QB' and p['role']=='Elite' and p['age']<=33),
              'QB_ELITE_ALL':lambda p:(p['pos']=='QB' and p['role']=='Elite'),
              'QB_ELITE_OR_EVERYDOWN_PRIME':lambda p:(p['pos']=='QB' and p['role'] in ('Elite','Every-Down') and p['age']<=33),
              'QB_ALL':lambda p:(p['pos']=='QB'),
              'QB_YOUNG_NO_HISTORY':lambda p:(p['pos']=='QB' and p['age']<=25 and p['no_real_production_history'] and p['role'] in ('Speculative','Depth','Understudy')),
              'WR_YOUNG_NO_HISTORY':lambda p:(p['pos']=='WR' and p['age']<=25 and p['no_real_production_history'] and p['role'] in ('Speculative','Depth','Understudy','Rotational')),
              'WR_ELITE':lambda p:(p['pos']=='WR' and p['role']=='Elite'),
              'TE_ELITE':lambda p:(p['pos']=='TE' and p['role']=='Elite'),
              'DL_ELITE':lambda p:(p['pos']=='DL' and p['role']=='Elite'),
              'LB_ELITE':lambda p:(p['pos']=='LB' and p['role']=='Elite'),
              'DB_ELITE':lambda p:(p['pos']=='DB' and p['role']=='Elite'),
              'RB_ELITE':lambda p:(p['pos']=='RB' and p['role']=='Elite'),
          }
          RATES=(5,8,10,12,15,16,17,18,20,25,35,50)
          
          def check(ok,msg):
              if not ok:raise AssertionError('CAL26_V1R12_'+str(msg))
          
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          
          def read_csv(p):
              with Path(p).open(encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          
          def write_csv(p,rows,cols):
              with Path(p).open('w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(rows)
          
          def opt_float(v):
              if v is None or str(v).strip() in ('','nan','None'):return None
              return float(v)
          
          def positive_round(n):return math.floor(n+0.5)
          
          def scenario(config,base,sv,predicate,pct,anchors):
              after={}
              for name,item in base.items():
                  if name in anchors or not predicate(item):
                      after[name]=item['value'];continue
                  rm,raw=sv.production_multiplier(name,item['role'],config['prod_mult'],config['no_real_history'],config['role_mult'],config.get('cal22_keys',set()))
                  am=sv.effective_age_multiplier(item['pos'],item['age'],item['role'],name,rm,raw,config)
                  f=100*config['position_weight'].get(item['pos'],1.0)*am*rm*55
                  check(positive_round(f)==item['value'], 'UNADJUSTED_MODEL_PRICE_DRIFT_'+name)
                  after[name]=positive_round(f*(1+pct/100))
              check(len(after)==565,'AFTER_NOT_565')
              return after
          
          def evaluate(base,after,rows,accepted,anchors):
              zero=all(after[p]==base[p]['value'] for p in accepted|anchors)
              correct_changed=sum(after[r['player']]!=base[r['player']]['value'] for r in rows if r['pilot_action']=='OWNER_ACCEPTED_CAL26_PROPOSAL_PROTECTED')
              anchored_changed=sum(after[k]!=base[k]['value'] for k in anchors)
              high_rated_changed=sum(after[r['player']]>base[r['player']]['value'] for r in rows if r['pilot_action']=='HIGH_RATED_PROPOSAL_NEGATIVE_CONTROL')
              changed=[p for p in base if base[p]['value']!=after[p]]
              unreviewed=set(r['player'] for r in rows if r['cal26_owner_rating']=='NOT_REVIEWED')
              lower_gained=0;lower_lost=0; lower_gap_reduction=0; upper_new_violations=0
              direction_improved=0; direction_worsened=0
              numeric_anchor_closer=0;numeric_anchor_further=0
              for r in rows:
                  k=r['player']; before=base[k]['value'];current=after[k]
                  lo=opt_float(r['owner_lower_strict_gt']);hi=opt_float(r['owner_upper_strict_lt']); exact=opt_float(r['owner_anchor_value'])
                  if lo is not None:
                      b=before>lo;a=current>lo
                      if a and not b:lower_gained+=1
                      if b and not a:lower_lost+=1
                      lower_gap_reduction+=max(0,int(lo)+1-before)-max(0,int(lo)+1-current)
                  if hi is not None and before<hi and current>=hi:upper_new_violations+=1
                  if r['cal26_owner_rating']=='Low':
                      if current>before:direction_improved+=1
                      elif current<before:direction_worsened+=1
                  if exact is not None and r['pilot_action']=='LARGER_OWNER_CORROBORATED_MOVE_REVIEW':
                      if abs(current-exact)<abs(before-exact):numeric_anchor_closer+=1
                      elif abs(current-exact)>abs(before-exact):numeric_anchor_further+=1
              return {
                  'affected_players':len(changed),'affected_unreviewed_players':len(set(changed)&unreviewed),
                  'affected_reviewed_players':len(changed)-len(set(changed)&unreviewed),
                  'owner_accepted_18_changed':correct_changed,'approved_13_changed':anchored_changed,
                  'higher_price_for_two_high_rated_proposals':high_rated_changed,
                  'all_owner_control_prices_preserved':zero,
                  'low_rated_players_increased':direction_improved,'low_rated_players_decreased':direction_worsened,
                  'newly_satisfying_owner_lower_bound':lower_gained,'newly_violating_owner_lower_bound':lower_lost,
                  'lower_bound_shortfall_reduction_points':lower_gap_reduction,
                  'new_upper_bound_violations':upper_new_violations,
                  'deferred_correct_companion_quote_closer':numeric_anchor_closer,
                  'deferred_correct_companion_quote_further':numeric_anchor_further,
                  'total_fv_delta':sum(after[p]-base[p]['value'] for p in base),
              }
          
          def run(repo,source,out,fixture=False):
              repo=Path(repo);source=Path(source);out=Path(out);out.mkdir(parents=True,exist_ok=True)
              release=json.loads((repo/ROOT_RELEASE).read_text())
              check(release['owner_selected_player_count']==13 and release['accepted_price_controls_protected']==18,'WRONG_V1R11_RELEASE')
              expected_anchors={k:int(v) for k,v in release['owner_selected_exact_fv'].items()}
              check(len(expected_anchors)==13,'EXPECTED_13_UNIQUE')
              p=source/SOURCE_NAME;m=source/SOURCE_MANIFEST
              manifest=json.loads(m.read_text());check(manifest['status']=='PASS_CAL26_V1R9_565_PLAYER_OWNER_ANCHORED_FV_SHADOW','BAD_V1R9_SOURCE')
              check(manifest['owner_feedback_count']==80 and manifest['owner_cal26_correct_protected']==18 and manifest['pilot_count']==13,'BAD_SOURCE_COUNTS')
              check(sha(p)==manifest['artifact_sha256'][SOURCE_NAME],'V1R9_SOURCE_SHA_MISMATCH')
              rows=read_csv(p);check(len(rows)==565 and len(set(r['player'] for r in rows))==565,'565_UNIQUE_SOURCE_REQUIRED')
              sys.path.insert(0,str(repo/'scripts'/'validation'))
              import snapshot_values as sv
              index=repo/'index.html';cfg=sv.load_from_html(index);base=sv.compute_all_values(cfg)
              check(len(base)==565 and set(base)==set(r['player'] for r in rows),'LIVE_POPULATION_MISMATCH')
              live_anchors={k:int(v) for k,v in cfg['cal26_fv_owner_anchors'].items()}
              check(live_anchors==expected_anchors,'EXACT_13_PRODUCTION_PRICE_ANCHORS_DRIFT')
              accepted={r['player'] for r in rows if r['pilot_action']=='OWNER_ACCEPTED_CAL26_PROPOSAL_PROTECTED'}
              check(len(accepted)==18 and not (accepted & live_anchors.keys()),'ACCEPTED_CONTROL_COUNT_OR_OVERLAP')
              for r in rows:
                  before=int(r['live_fv']);k=r['player'];expected=expected_anchors.get(k,before)
                  check(base[k]['value']==expected,'POST_V1R11_PRICE_DRIFT_'+k)
                  check(base[k]['role'] in ('Speculative','Depth','Understudy','Rotational','Starter','Every-Down','Elite'),'ROLE_NOT_FROZEN_ENUM_'+k)
              held=[r for r in rows if r['pilot_action']=='LARGER_OWNER_CORROBORATED_MOVE_REVIEW']
              check(len(held)==12 and all(opt_float(r['owner_anchor_value']) for r in held),'DEFERRED_12_SOURCE_DRIFT')
              check(sum(r['cal26_owner_rating']=='Low' for r in rows)==60,'60_LOW_COUNT_DRIFT')
              check(sum(r['cal26_owner_rating']=='High' for r in rows)==2,'2_HIGH_COUNT_DRIFT')
              deferred=[]
              for r in held:
                  n=r['player'];now=base[n]['value'];quote=int(float(r['owner_anchor_value']));low=opt_float(r['owner_lower_strict_gt']);high=opt_float(r['owner_upper_strict_lt'])
                  deferred.append({'player':n,'position':r['position'],'current_role':base[n]['role'],'current_fv':now,
                                   'owner_rated_correct_companion_fv':quote,'companion_source':r['owner_anchor_source'],
                                   'gap_to_companion':quote-now,'gap_percent':round(100*(quote-now)/now,1),
                                   'lowest_acceptable_direction_from_owner_low':int(low) if low is not None else '',
                                   'upper_direction_limit_from_owner_high':int(high) if high is not None else '',
                                   'price_approval_status':'HELD_EXPLORATORY_NO_RELEASE'})
              write_csv(out/'CAL26_V1R12_12_Deferred_Owner_Correct_Quotes.csv',deferred,list(deferred[0]))
              tests=[]
              for family,predicate in FAMILIES.items():
                  for pct in RATES:
                      if family.endswith('NO_HISTORY') and pct<15:continue
                      if family not in ('QB_YOUNG_NO_HISTORY','WR_YOUNG_NO_HISTORY') and pct>25:continue
                      after=scenario(cfg,base,sv,predicate,pct,set(live_anchors))
                      scores=evaluate(base,after,rows,accepted,set(live_anchors))
                      tests.append({'family':family,'hypothetical_extra_fv_percent':pct,**scores,
                                    'production_change_authorized':False})
              check(len(tests)>=90,'NOT_ENOUGH_MODEL_SCENARIOS')
              write_csv(out/'CAL26_V1R12_Structural_Model_Sensitivity_Grid.csv',tests,list(tests[0]))
              # Preselected, interpretable read-only focus—not optimized on a hidden holdout.
              focus_pct=17;focus_family='QB_ELITE_PRIME'
              focus=scenario(cfg,base,sv,FAMILIES[focus_family],focus_pct,set(live_anchors))
              focus_metrics=evaluate(base,focus,rows,accepted,set(live_anchors))
              focus_rows=[]
              byname={r['player']:r for r in rows}
              for k in sorted(base):
                  b=base[k];r=byname[k];now=focus[k]
                  focus_rows.append({'player':k,'position':b['pos'],'age':b['age'],'role':b['role'],
                                     'live_fv_after_v1r11':b['value'],'research_shadow_fv':now,
                                     'research_delta':now-b['value'],'owner_rating_of_old_CAL26_proposal':r['cal26_owner_rating'],
                                     'owner_strictly_greater_than':r['owner_lower_strict_gt'],
                                     'owner_strictly_less_than':r['owner_upper_strict_lt'],
                                     'accepted_correct_proposal_protected':k in accepted,
                                     'v1r11_approved_price_protected':k in live_anchors})
              write_csv(out/'CAL26_V1R12_565_QB_Elite_Prime_17pct_Shadow.csv',focus_rows,list(focus_rows[0]))
              candidates=[x for x in focus_rows if x['research_delta']]
              # Negative test: should reject post-production FV drift even if only one player altered in CSV.
              testrow=dict(rows[0]);testrow['live_fv']=str(int(testrow['live_fv'])+1)
              check(base[testrow['player']]['value']!=int(testrow['live_fv']), 'DRIFT_NEGATIVE_TEST_NOT_EFFECTIVE')
              checks={
                  'status':'PASS_CAL26_V1R12_EXPLORATORY_STRUCTURAL_FV_SENSITIVITY_READ_ONLY',
                  'live_v1r11_release':'cal26-v1r11-owner-selected-fv-2026-10-21-v1',
                  'source_v1r9_run':FROZEN_RUN,
                  'owner_labels_are_nonrandom_and_rate_OLD_CAL26_PROPOSALS':True,
                  'source_565_sha256':sha(p),'source_manifest_sha256':sha(m),
                  'production_index_sha256':sha(index),
                  'production_snapshot_values_sha256':sha(repo/'scripts/validation/snapshot_values.py'),
                  'live_player_count':565,'previously_approved_fv_anchors':13,
                  'owner_accepted_CAL26_proposals_protected':18,
                  'deferred_owner_correct_companion_quotes':12,
                  'deferred_gap_total_to_correct_companion':sum(int(x['gap_to_companion']) for x in deferred),
                  'hypotheses_evaluated':len(tests),
                  'focus_model_hypothesis':focus_family,'focus_sensitivity_percent':focus_pct,
                  'focus_metrics':focus_metrics,
                  'source_98_role_updates_preserved':True,
                  'production_files_modified':0,'pricing_model_retrained':False,
                  'release_authorized':False,'owner_price_authorization':False,
                  'limitations':['Owner ratings evaluate older proposed FV, not new modeled prices.',
                                 'Correct quotes are acceptable comparators, not exact fair value targets.',
                                 '80-player selection is not representative of 565 players.',
                                 'Multiplier scenarios are exploratory and not cross-validated on an independent holdout.',
                                 'The 17% scenario is a sensitivity probe, not a recommended production coefficient.']}
              (out/'CAL26_V1R12_Manifest.json').write_text(json.dumps(checks,indent=2,sort_keys=True)+'\n')
              # Position impacts by studied hypothesis
              pos_summary=[]
              for pos in sorted(set(x['pos'] for x in base.values())):
                  studied=[x for x in base.values() if x['pos']==pos]
                  affected=[x for x in candidates if x['position']==pos]
                  pos_summary.append({'position':pos,'players_total':len(studied),
                                      'focus_players_affected':len(affected),'focus_delta_total':sum(int(x['research_delta']) for x in affected),
                                      'owner_low_proposals_in_group':sum(r['position']==pos and r['cal26_owner_rating']=='Low' for r in rows),
                                      'owner_accepted_correct_proposals_in_group':sum(r['position']==pos and r['player'] in accepted for r in rows)})
              write_csv(out/'CAL26_V1R12_Position_Exposure.csv',pos_summary,list(pos_summary[0]))
              ranked=sorted(tests,key=lambda x:(x['owner_accepted_18_changed']+x['approved_13_changed']+x['higher_price_for_two_high_rated_proposals']+x['new_upper_bound_violations'],
                                                 -x['newly_satisfying_owner_lower_bound'],x['affected_unreviewed_players']))
              focus_peers=[x for x in focus_rows if x['research_delta']]
              report=['# CAL26 V1R12 — Broader FV Model Mechanism Sensitivity','',
                      '**Status: Research-only. No player price or model code has been deployed.**','',
                      'The current baseline is the actual 565-player, post-V1R11 production calculator, including all 13 owner-approved FV anchors. The original 18 CAL26 Correct-rated **proposals** are protected as control players. The 80 ratings concern the older CAL26 proposed prices, not the current release or a random holdout.','',
                      '## Deferred 12 correct-companion value comparisons','',
                      '| Player | Position | Current FV | Owner-rated Correct companion | Gap |',
                      '|---|---|---:|---:|---:|']
              for x in sorted(deferred,key=lambda d:-d['gap_to_companion']):
                  report.append(f"| {x['player'].title()} | {x['position']} | {x['current_fv']:,} | {x['owner_rated_correct_companion_fv']:,} | +{x['gap_to_companion']:,} |")
              report+=['',f"**Combined comparison gap: {sum(int(x['gap_to_companion']) for x in deferred):,} FV.** This is not a release recommendation or an exact owner target.",'',
                       '## Interpretable structural test','',
                       'Focus experiment: **+17% effective FV weighting for Elite QBs age 33 or younger**, with 13 existing owner-approved FV overrides preserved. This uses the existing age/role distinctions; it does not directly modify production multipliers or classify prospects as established QBs.','',
                       f"- Price-moved players in focus shadow: **{focus_metrics['affected_players']}**; unreviewed: **{focus_metrics['affected_unreviewed_players']}**.",
                       f"- Existing approved-price changes: **{focus_metrics['approved_13_changed']}**; accepted-control changes: **{focus_metrics['owner_accepted_18_changed']}**; High-rated negative control increases: **{focus_metrics['higher_price_for_two_high_rated_proposals']}**.",
                       f"- Newly satisfied strict owner Low bounds: **{focus_metrics['newly_satisfying_owner_lower_bound']}**; newly violated strict High bounds: **{focus_metrics['new_upper_bound_violations']}**.",
                       '', '| Studied quarterback | Current FV | 17% sensitivity | Delta |','|---|---:|---:|---:|']
              for x in sorted(focus_peers,key=lambda d:-d['research_delta']):
                  report.append(f"| {x['player'].title()} | {x['live_fv_after_v1r11']:,} | {x['research_shadow_fv']:,} | +{x['research_delta']:,} |")
              report+=['','## Structural sensitivity grid (illustrative comparisons)','',
                       '| Family | Hypothesis | Moved | Unreviewed moved | Low bounds crossed | Accepted-control changes |',
                       '|---|---:|---:|---:|---:|---:|']
              for fam,pct in [('QB_ELITE_PRIME',10),('QB_ELITE_PRIME',17),('QB_ELITE_ALL',17),('QB_ALL',17),('WR_ELITE',10),('TE_ELITE',10),('DL_ELITE',10),('DB_ELITE',10),('QB_YOUNG_NO_HISTORY',35)]:
                  row=next(x for x in tests if x['family']==fam and x['hypothetical_extra_fv_percent']==pct)
                  report.append(f"| {fam} | +{pct}% | {row['affected_players']} | {row['affected_unreviewed_players']} | {row['newly_satisfying_owner_lower_bound']} | {row['owner_accepted_18_changed']} |")
              report+=['','## Interpretation and next action','',
                       'The Elite QB prime-age hypothesis is a defensible starting point for independent valuation benchmarking because it includes multiple owner Low-reviewed Elite QBs while sparing the accepted-price QB controls, which are Starter or Rotational. It is **not validated** as a 17% production coefficient. A systematic price increase for other positions risks moving Correct-rated players and the 485 unreviewed players without supporting price targets.','',
                       'Young rookie QB anomalies (including Ty Simpson) should be investigated separately through draft capital, opportunity, production-history and valuation lineage—not closed by a blanket QB or generic rookie multiplier.','',
                       'Keep the 12 deferred exact companion prices on hold pending separate review; compare external dynasty/superflex values, position peers, and independent results before approving model-level coefficients. No production release in V1R12.','']
              (out/'CAL26_V1R12_Review.md').write_text('\n'.join(report))
              # Reject unsafe models on controls: global QB increases both accepted correct QB controls.
              global_qb=next(x for x in tests if x['family']=='QB_ALL' and x['hypothetical_extra_fv_percent']==17)
              check(global_qb['owner_accepted_18_changed']>=2,'NEGATIVE_CONTROL_GLOBAL_QB_MUST_HIT_ACCEPTED_QBS')
              check(focus_metrics['approved_13_changed']==focus_metrics['owner_accepted_18_changed']==0,'FOCUS_CONTROL_PARITY')
              check(focus_metrics['affected_players']>=3,'FOCUS_NO_EFFECT')
              print(json.dumps({'status':checks['status'],'deferred':len(deferred),'comparison_gap':checks['deferred_gap_total_to_correct_companion'],
                                'scenarios':len(tests),'focus':focus_metrics},indent=2,sort_keys=True))
          
          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--repo',required=True);p.add_argument('--source',required=True);p.add_argument('--out',required=True)
              a=p.parse_args();run(a.repo,a.source,a.out)
          PY_CAL26_V1R12
          python -m py_compile "$RUNNER_TEMP/cal26_v1r12_structural_experiment.py"

      - name: Run frozen-source and current-production 565-player hypothesis comparison
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/cal26_v1r12_structural_experiment.py" \
            --repo . \
            --source "$RUNNER_TEMP/cal26-v1r12-green-source" \
            --out "$RUNNER_TEMP/cal26-v1r12-output"

      - name: Independently verify all 565 rows, 18+13 controls and no production writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_CAL26_V1R12_VERIFY'
          import csv,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cal26-v1r12-output'
          def readcsv(name):
              with (root/name).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          man=json.loads((root/'CAL26_V1R12_Manifest.json').read_text())
          assert man['status']=='PASS_CAL26_V1R12_EXPLORATORY_STRUCTURAL_FV_SENSITIVITY_READ_ONLY'
          assert man['live_player_count']==565 and man['owner_accepted_CAL26_proposals_protected']==18
          assert man['previously_approved_fv_anchors']==13 and man['deferred_owner_correct_companion_quotes']==12
          assert man['deferred_gap_total_to_correct_companion']==19948
          assert man['hypotheses_evaluated']==116
          assert man['production_files_modified']==0 and man['release_authorized'] is False
          full=readcsv('CAL26_V1R12_565_QB_Elite_Prime_17pct_Shadow.csv')
          held=readcsv('CAL26_V1R12_12_Deferred_Owner_Correct_Quotes.csv')
          sensitivities=readcsv('CAL26_V1R12_Structural_Model_Sensitivity_Grid.csv')
          exposure=readcsv('CAL26_V1R12_Position_Exposure.csv')
          assert len(full)==565 and len({r['player'] for r in full})==565
          assert len(held)==12 and len(sensitivities)==116 and len(exposure)==8
          assert sum(int(r['research_delta'])!=0 for r in full)==12
          assert all(int(r['research_delta'])==0 for r in full if r['accepted_correct_proposal_protected']=='True' or r['v1r11_approved_price_protected']=='True')
          assert sum(int(r['gap_to_companion']) for r in held)==19948
          assert sum(int(r['research_delta']) for r in full)==10784
          assert man['focus_metrics']['newly_satisfying_owner_lower_bound']==5
          assert man['focus_metrics']['owner_accepted_18_changed']==0
          assert man['focus_metrics']['approved_13_changed']==0
          print('PASS CAL26 V1R12: 565 players, 116 transparent scenarios, 12 held, no production modifications')
          PY_CAL26_V1R12_VERIFY
