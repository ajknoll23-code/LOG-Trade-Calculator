# QF11 V38: SAFETY AUDIT ONLY. No real Google calls, no votes, no trigger installation.
# A GREEN run certifies synthetic tests, NOT production privacy readiness.
# Existing Apps Script project must remain disabled; nothing is deployed or modified.
name: QF11 V38 - KTC V2 Privacy Retention Deletion Synthetic Audit (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: qf11-v38-ktc-v2-privacy-retention-synthetic-audit
  cancel-in-progress: false
jobs:
  retention_audit:
    name: Synthetic privacy retention and deletion; cannot approve live pilot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact workflow run commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing regression dependency only
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir requests
      - name: Pin KTC V2 privacy source and frozen valuation model
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_RUN_SHA_DRIFT; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo STOP_WORKTREE_DIRTY; exit 1; }
          check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_SOURCE_DRIFT_$1"; exit 1; }; }
          check index.html aaf6e92386e472d71c9fdc85c9961d935372eb28
          check research/ktc-v2-isolated/collector.gs b4ce85ea8bf72ef5399d5ffc898b3b571fbcad89
          check research/ktc-v2-isolated/collector.test.js e29418c8eb0dc1ddcb1f7790533771d5fb3b425a
          check research/ktc-v2-isolated/frame-host.gs 36c9805cee98098e51bc3bf7a45e76559d62b46d
          check research/ktc-v2-isolated/pilot-frame.html 7786cd96fcdd39b7cc53cb75399b24ebfd2d07a7
          check research/ktc-v2-isolated/frame-host.test.js 3aa221eacff6b0f11133e94eabf2618e64f2b860
          check research/ktc-v2-isolated/client-bridge.js a7dd731fd013c0ce7e547eb05ae8c825e85ccd9b
          check research/ktc-v2-isolated/client-bridge.test.js 33c729698da476a085bf44c574973635b48b7167
          check research/ktc-v2-isolated/README.md 8dce132bfd2fa9584636b072fff4fde4cecf9436
          check .github/workflows/ktc-vote-aggregation.yml a6d08df00abc1760866c98757fd057b644a22264
          check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8
          check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f
          check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f
          check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8
          check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79
          check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3
          check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d
          check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5
          check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa
          check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633
          [[ -f data/players_cache.json ]] || { echo STOP_PRODUCTION_CACHE_MISSING; exit 1; }
          echo QF11_V38_FROZEN_INPUTS_GREEN
      - name: Create isolated synthetic privacy and retention harness
        run: |
          set -euo pipefail
          mkdir -p /tmp/qf11-v38
          cat > /tmp/qf11-v38/retention_audit.js <<'JSV38'
          'use strict';
          // QF11 V38 -- only the checked-out isolated collector source is evaluated.
          // All SpreadsheetApp, LockService and PropertiesService behavior is synthetic.
          const fs=require('fs'),vm=require('vm'),crypto=require('crypto'),assert=require('assert');
          const path=process.argv[2] || 'research/ktc-v2-isolated/collector.gs';
          const source=fs.readFileSync(path,'utf8');
          const HEADERS=['received_utc','delete_due_utc','schema','slot','display_order','token_hmac','keep','trade','cut','q1','q2','q3','review_status'];
          const SCHEMA='QF11_KTC_V2_PILOT_RESPONSE_V1';
          const secret='V38_SYNTHETIC_ONLY_SECRET_123456789012345678901234567890';
          const token=i=>'QF11_V38_SYNTHETIC_TOKEN_'+String(i).padStart(8,'0');
          const hmac=s=>crypto.createHmac('sha256',secret).update(s).digest('base64url');
          const assignments=Object.fromEntries(Array.from({length:12},(_,i)=>[hmac(token(i+1)),{slot:i+1,display_order:i%6}]));
          const GATES=['QF11_V2_ENABLED','QF11_V2_IFRAME_TRANSPORT_VERIFIED','QF11_V2_OWNER_PILOT_AUTHORIZED','QF11_V2_INDEPENDENT_WORDING_QC','QF11_V2_PRIVACY_DELETION_VERIFIED','QF11_V2_MODERATOR_SOP_VERIFIED','QF11_V2_COLLECTOR_ISOLATION_VERIFIED'];
          const NOW=Date.parse('2026-10-12T17:00:00.000Z'); // fixture time, not production clock
          const SyntheticDate=class extends Date {static now(){return NOW;}};
          let passed=0;const labels=[];
          function check(label,test){test();passed++;labels.push(label);console.log('PASS '+label)}
          function fixture(authorized=false){
            const rows=[HEADERS.slice()];
            let locked=false;
            const conf={QF11_V2_ENABLED:'false',QF11_V2_HALTED:'false',QF11_V2_CLOSED:'false',QF11_V2_SHEET_ID:'SYNTHETIC_V2_ONLY',QF11_V1_SHEET_ID:'SYNTHETIC_V1_ONLY',QF11_V2_SEPARATE_SHEET_VERIFIED:'YES',QF11_V2_HMAC_SECRET:secret,QF11_V2_INVITES_JSON:JSON.stringify(assignments),QF11_V2_PLAYER_KEYS_JSON:JSON.stringify(['sample_a','sample_b','sample_c'])};
            if(authorized) GATES.forEach(k=>conf[k]='true');
            const props={getProperty:k=>Object.prototype.hasOwnProperty.call(conf,k)?conf[k]:null,setProperty:(k,v)=>{conf[k]=String(v)}};
            const sheet={
              getRange:(r,c,n)=>({getValues:()=>rows.slice(r-1,r-1+n).map(a=>a.slice(c-1,c+HEADERS.length-1))}),
              getDataRange:()=>({getValues:()=>rows.map(a=>a.slice())}),
              appendRow:r=>rows.push(r.slice()),deleteRow:r=>rows.splice(r-1,1)
            };
            const env={
              PropertiesService:{getScriptProperties:()=>props},
              SpreadsheetApp:{openById:id=>{assert.strictEqual(id,'SYNTHETIC_V2_ONLY');return {getSheetByName:n=>n==='Responses'?sheet:null}}},
              LockService:{getScriptLock:()=>({tryLock:()=>{if(locked)return false;locked=true;return true},releaseLock:()=>{locked=false}})},
              ContentService:{MimeType:{JSON:'application/json'},createTextOutput:s=>({s,setMimeType(){return this},getContent(){return this.s}})},
              Utilities:{computeHmacSha256Signature:(s,k)=>Array.from(crypto.createHmac('sha256',k).update(s).digest()),base64EncodeWebSafe:v=>Buffer.from(v).toString('base64url')},
              Date:SyntheticDate,JSON,Object,Array,String,Number,Set,Error,Math
            };
            vm.createContext(env);vm.runInContext(source,env,{timeout:3000});
            const payload=(i=1,extra={})=>Object.assign({schema:SCHEMA,participant_token:token(i),display_order:(i-1)%6,consent:true,adult:true,sf_idp_experience:true,keep:'sample_a',trade:'sample_b',cut:'sample_c',mc:[1,1,0]},extra);
            const post=p=>JSON.parse(env.doPost({postData:{contents:JSON.stringify(p)}}).getContent()).status;
            return {conf,rows,env,payload,post,forceLock:()=>{locked=true},unlock:()=>{locked=false}};
          }
          check('disabled source denies all submission',()=>{const e=fixture();assert.strictEqual(e.post(e.payload()),'DISABLED');assert.strictEqual(e.rows.length,1)});
          check('enabled switch alone cannot authorize intake',()=>{const e=fixture();e.conf.QF11_V2_ENABLED='true';assert.strictEqual(e.post(e.payload()),'DISABLED');assert.strictEqual(e.rows.length,1)});
          check('every one of seven approval flags independently blocks intake',()=>{for(const gate of GATES){const e=fixture(true);e.conf[gate]='false';assert.strictEqual(e.post(e.payload()),'DISABLED',gate);assert.strictEqual(e.rows.length,1)}});
          check('accepted synthetic row has exact 30 day due time and no raw token',()=>{const e=fixture(true);assert.strictEqual(e.post(e.payload()),'PENDING_HUMAN_Q4_REVIEW');const row=e.rows[1];assert.strictEqual(Date.parse(row[0]),NOW);assert.strictEqual(Date.parse(row[1])-Date.parse(row[0]),30*24*3600*1000);assert.strictEqual(row[5],hmac(token(1)));assert(!JSON.stringify(e.rows).includes(token(1)));assert.strictEqual(row.length,13)});
          check('unexpired fixture preserved without setting halt',()=>{const e=fixture(true);e.post(e.payload());assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),0);assert.strictEqual(e.rows.length,2);assert.strictEqual(e.conf.QF11_V2_HALTED,'false')});
          check('exact deadline qualifies for deletion and halts',()=>{const e=fixture(true);e.post(e.payload());e.rows[1][1]=new Date(NOW).toISOString();assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),1);assert.strictEqual(e.rows.length,1);assert.strictEqual(e.conf.QF11_V2_HALTED,'true')});
          check('one millisecond before deadline stays intact',()=>{const e=fixture(true);e.post(e.payload());e.rows[1][1]=new Date(NOW+1).toISOString();assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),0);assert.strictEqual(e.rows.length,2)});
          check('mixed expired malformed future deadlines delete bottom up',()=>{const e=fixture(true);for(let i=1;i<=4;i++)assert.strictEqual(e.post(e.payload(i)),'PENDING_HUMAN_Q4_REVIEW');e.rows[1][1]='2000-01-01T00:00:00Z';e.rows[2][1]='bad timestamp';e.rows[3][1]=new Date(NOW+10000).toISOString();e.rows[4][1]='2001-01-01T00:00:00Z';assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),3);assert.strictEqual(e.rows.length,2);assert.strictEqual(e.rows[1][3],3);assert.strictEqual(e.conf.QF11_V2_HALTED,'true')});
          check('empty response sheet purge leaves it unhalted',()=>{const e=fixture();assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),0);assert.strictEqual(e.rows.length,1);assert.strictEqual(e.conf.QF11_V2_HALTED,'false')});
          check('purge never reopens an already halted study',()=>{const e=fixture(true);e.conf.QF11_V2_HALTED='true';assert.strictEqual(e.env.purgeExpiredQF11V2Rows(),0);assert.strictEqual(e.conf.QF11_V2_HALTED,'true')});
          check('purge failure with V1 equal to V2 cannot delete rows',()=>{const e=fixture(true);e.post(e.payload());e.conf.QF11_V1_SHEET_ID='SYNTHETIC_V2_ONLY';assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/SAME_AS_PRODUCTION_KTC_V1_SHEET/);assert.strictEqual(e.rows.length,2)});
          check('incorrect response header rejects purge without deletion',()=>{const e=fixture(true);e.post(e.payload());e.rows[0][0]='bad_header';assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/SHEET_SCHEMA_MISMATCH/);assert.strictEqual(e.rows.length,2)});
          check('locked purge stops without deleting synthetic rows',()=>{const e=fixture(true);e.post(e.payload());e.rows[1][1]='2001-01-01T00:00:00Z';e.forceLock();assert.throws(()=>e.env.purgeExpiredQF11V2Rows(),/LOCK_UNAVAILABLE/);assert.strictEqual(e.rows.length,2);e.unlock()});
          check('post-expiry halt blocks reused token and new slots',()=>{const e=fixture(true);e.post(e.payload(1));e.rows[1][1]='2001-01-01T00:00:00Z';e.env.purgeExpiredQF11V2Rows();assert.strictEqual(e.post(e.payload(1)),'HALTED');assert.strictEqual(e.post(e.payload(2)),'HALTED');assert.strictEqual(e.rows.length,1)});
          check('no freeform Q4 or extra PII is accepted',()=>{const e=fixture(true);assert.strictEqual(e.post(e.payload(1,{q4:'synthetic freeform'})),'REJECTED_EXTRA_FIELDS');assert.strictEqual(e.rows.length,1)});
          check('duplicate assigned slot cannot cause a second response',()=>{const e=fixture(true);e.post(e.payload(1));assert.strictEqual(e.post(e.payload(1)),'DUPLICATE_OR_SLOT_USED');assert.strictEqual(e.rows.length,2)});
          check('wrong comprehension forces halt',()=>{const e=fixture(true);assert.strictEqual(e.post(e.payload(1,{mc:[0,1,0]})),'CRITICAL_STOP_QUARANTINED');assert.strictEqual(e.conf.QF11_V2_HALTED,'true');assert.strictEqual(e.post(e.payload(2)),'HALTED')});
          assert.strictEqual(passed,17);
          fs.mkdirSync('/tmp/qf11-v38',{recursive:true});
          const status={
            schema:'QF11_V38_PRIVACY_RETENTION_SYNTHETIC_AUDIT_V1',
            decision:'PASS_SYNTHETIC_REVIEW_REQUIRED_NO_ACTIVATION',
            synthetic_checks_passed:passed,checks:labels,
            real_google_calls:0,real_participants:0,real_votes_written:0,
            deletion_code_behavior_synthetic_verified:true,
            actual_deletion_trigger_installed_verified:false,
            actual_deletion_trigger_execution_verified:false,
            actual_google_htmlservice_referrer_verified:false,
            actual_google_rpc_acknowledgment_verified:false,
            actual_30_day_maximum_retention_verified:false,
            moderator_q4_and_export_cleanup_verified:false,
            human_consent_wording_sop_approved:false,
            owner_pilot_activation_approved:false,
            google_project_or_spreadsheet_modified:false,
            production_model_modified:false,
            blockers:[
              'Verify installed trigger and real nonparticipant-fixture cleanup in EXISTING Google project',
              'Prove retention window including trigger delay, exports, logs and separate Q4 notes',
              'Review ALLOWALL frame behavior, parent origin and live Google RPC acknowledgment',
              'Independent ballot wording, privacy/consent and moderator SOP review',
              'Explicit owner authorization required before real study or votes'
            ]
          };
          fs.writeFileSync('/tmp/qf11-v38/retention-report.json',JSON.stringify(status,null,2)+'\n');
          console.log('QF11_V38_SYNTHETIC_PRIVACY_RETENTION_GREEN '+JSON.stringify({checks:passed,decision:status.decision,real_google_calls:0,real_votes_written:0}));
          JSV38
          node --check /tmp/qf11-v38/retention_audit.js
      - name: Exercise 17 synthetic retention deletion and stop-condition checks
        run: |
          set -euo pipefail
          node /tmp/qf11-v38/retention_audit.js research/ktc-v2-isolated/collector.gs
      - name: Rerun 75 historical synthetic checks and frozen production regressions
        run: |
          set -euo pipefail
          node research/ktc-v2-isolated/collector.test.js
          node research/ktc-v2-isolated/client-bridge.test.js
          node research/ktc-v2-isolated/frame-host.test.js
          python3 scripts/validation/snapshot_values.py --selftest
          python3 scripts/market/build_market_value.py --selftest
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          echo QF11_V38_75_PRIOR_SYNTHETIC_AND_PRODUCTION_REGRESSIONS_GREEN
      - name: Verify no repository writes and explicit unverified human blockers
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]] || { echo STOP_REPO_CHANGED; git status --short; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_COMMIT_CHANGED; exit 1; }
          python3 - <<'PYV38FIN'
          import json
          from pathlib import Path
          p=Path('/tmp/qf11-v38/retention-report.json')
          r=json.loads(p.read_text())
          assert r['synthetic_checks_passed']==17
          assert r['decision']=='PASS_SYNTHETIC_REVIEW_REQUIRED_NO_ACTIVATION'
          assert r['real_google_calls']==r['real_votes_written']==0
          for k in ('actual_deletion_trigger_installed_verified','actual_deletion_trigger_execution_verified','actual_30_day_maximum_retention_verified','owner_pilot_activation_approved'):
              assert r[k] is False, 'STOP_UNJUSTIFIED_READINESS_CLAIM_'+k
          s=Path('research/ktc-v2-isolated/collector.gs').read_text()
          assert 'function purgeExpiredQF11V2Rows()' in s
          assert '30*24*3600*1000' in s
          assert 'function qf11v2IntakeAuthorized_' in s
          assert 'function doPost(' in s
          assert 'ScriptApp.newTrigger(' not in s, 'STOP_UNREVIEWED_TRIGGER_AUTOMATION_DRIFT'
          print('QF11_V38_GREEN_SYNTHETIC_ONLY__REAL_DELETION_TRIGGER_AND_PRIVACY_SOP_UNVERIFIED')
          PYV38FIN
      - name: Upload privacy and retention evidence report
        uses: actions/upload-artifact@v4
        with:
          name: QF11-v38-synthetic-privacy-retention-readiness-blockers
          path: /tmp/qf11-v38/retention-report.json
          retention-days: 14
          if-no-files-found: error
