name: Validate Package Adjustment Production Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install production validator
        run: |
          echo '' | base64 --decode > scripts/validation/validate_package_adjustment_v2_production.py

      - name: Compile and self-test
        run: |
          python3 -m py_compile scripts/validation/validate_package_adjustment_v2_production.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

      - name: Run 20k-shape production regression
        run: |
          python3 scripts/validation/validate_package_adjustment_v2_production.py --write
          python3 scripts/validation/validate_package_adjustment_v2_production.py --check

      - name: Verify no live consumer changed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(
              Path("research/package-adjustment-production-candidate-v1/production_validation.json").read_text()
          )
          assert d["launch_gates"]["all_passed"] is True
          assert d["recommendation"]["controlled_launch_recommended"] is True
          assert d["recommendation"]["automatic_launch_performed"] is False
          assert d["fundamental_value_consumer_changed"] is False
          assert d["market_value_consumer_changed"] is False
          assert d["team_utility_consumer_changed"] is False
          assert d["trade_verdict_consumer_changed"] is False
          assert d["production_formula_enabled"] is False

          shadow=json.loads(
              Path("research/package-adjustment-shadow-v2/package_adjustment_shadow_v2.json").read_text()
          )
          assert shadow["production_formula_enabled"] is False

          print("Controlled-launch validation contract verified.")
          print("Synthetic shapes:",d["synthetic_regression"]["shape_count"])
          print("Material-third share floor:",d["candidate"]["material_third_min_package_share"])
          PY

      - name: Commit validation results
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add scripts/validation/validate_package_adjustment_v2_production.py
          git add research/package-adjustment-production-candidate-v1/

          if git diff --cached --quiet; then
            echo "No production-validation changes."
            exit 0
          fi

          git commit -m "Validate Package Adjustment production candidate"
          git pull --rebase origin main
          git push origin main
