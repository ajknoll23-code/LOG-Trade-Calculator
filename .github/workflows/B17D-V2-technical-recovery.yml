# PREFLIGHTED: B17D_V2_TECHNICAL_RECOVERY_FROM_FAILED_RUN_36719207757
name: B17D V2 Draft Capital Outlook V1 - Technical Commit Recovery

"on":
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B17D_FAILED_RUN_ID: "36719207757"
  B17D_FAILED_HEAD_SHA: "10b9922d6d36f5f315af3bb604a8125c766d9a99"
  B17D_SOURCE_WORKFLOW: ".github/workflows/B17D-source-only-expansion-regime-firewall.yml"

jobs:
  recover_b17d:
    name: Reuse frozen B17D artifacts and repair commit-only failure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main and guard scientific inputs
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git cat-file -e "${B17D_FAILED_HEAD_SHA}^{commit}"

          # The recovery workflow itself may have been added after the failed run.
          # Refuse recovery if any scientific-input/reducer-validation path changed.
          git diff --quiet "${B17D_FAILED_HEAD_SHA}" HEAD -- \
            research/draft-capital-outlook-v1 \
            scripts/validation/repo_regression_checks.py || {
              echo "ERROR: scientific inputs changed after failed B17D run; do not replay old artifacts."
              git diff --name-only "${B17D_FAILED_HEAD_SHA}" HEAD -- \
                research/draft-capital-outlook-v1 \
                scripts/validation/repo_regression_checks.py
              exit 1
            }

          echo "PASS: scientific inputs are unchanged from failed B17D run ${B17D_FAILED_RUN_ID}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install exact reducer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2" \
            "beautifulsoup4==4.14.2" \
            "PyYAML==6.0.3"

      - name: Download exact seven source-only artifacts from failed run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36719207757
          pattern: b17d-year-*
          path: /tmp/b17d-results
          merge-multiple: true

      - name: Verify frozen artifact set and internal source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('/tmp/b17d-results')
          years=[2008,2009,2010,2011,2012,2013,2026]
          assert sorted(int(p.name) for p in root.iterdir() if p.is_dir()) == years

          protocol_hashes=set()
          for year in years:
              d=root/str(year)
              p=d/'protocol.json'
              r=d/'result.json'
              assert p.is_file() and r.is_file(), year
              protocol_hashes.add(hashlib.sha256(p.read_bytes()).hexdigest())
              result=json.loads(r.read_text())
              assert result['class_year']==year
              assert result['actual_draft_source_accessed'] is False
              assert result['fantasy_position_counts_computed'] is False
              assert result['capital_values_computed'] is False
              assert result['predictor_target_association_opened'] is False
              for role,meta in result.get('selected_files',{}).items():
                  raw=d/'raw'/f'{role}.html'
                  assert raw.is_file(), raw
                  assert hashlib.sha256(raw.read_bytes()).hexdigest()==meta['sha256'], (year,role)
                  assert raw.stat().st_size==meta['bytes'], (year,role)

          assert len(protocol_hashes)==1, protocol_hashes
          print('PASS: exact seven B17D artifacts and embedded raw-source hashes verified.')
          PY

      - name: Extract original successful reducer scripts without editing science
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow=Path('.github/workflows/B17D-source-only-expansion-regime-firewall.yml')
          doc=yaml.safe_load(workflow.read_text())
          steps=doc['jobs']['reduce_audit_and_capture']['steps']

          wanted=[
              'Guard B17 V2 pass and unopened association',
              'Run repository regression before source-only reduction',
              'Reduce source-only expansion and source-regime audit',
              'Write firewall and selection-index ledger',
              'Capture exact current 2027 Walt family without scoring',
              'Freeze B17D summary and manifest',
              'Post-B17D repository regression',
              'Prove B17D research-only mutation scope',
          ]

          by_name={s.get('name'):s for s in steps}
          assert all(name in by_name for name in wanted), [n for n in wanted if n not in by_name]
          out=Path('/tmp/b17d-replay-scripts')
          out.mkdir(parents=True,exist_ok=True)
          for i,name in enumerate(wanted,1):
              step=by_name[name]
              assert step.get('shell','bash')=='bash'
              script=step.get('run')
              assert isinstance(script,str) and script.strip()
              p=out/f'{i:02d}.sh'
              p.write_text(script.rstrip()+'\n')
              print(f'{i:02d}: {name}')
          PY

      - name: Replay original reducer and guards only
        shell: bash
        run: |
          set -euo pipefail
          for script in /tmp/b17d-replay-scripts/*.sh; do
            echo "===== replaying $(basename "$script") ====="
            bash "$script"
          done

      - name: Verify replayed raw-source bytes before staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          D=Path('research/draft-capital-outlook-v1')
          exp=D/'b17d/source-expansion'
          years=[2008,2009,2010,2011,2012,2013,2026]
          for year in years:
              d=exp/str(year)
              result=json.loads((d/'result.json').read_text())
              for role,meta in result.get('selected_files',{}).items():
                  raw=d/'raw'/f'{role}.html'
                  assert raw.is_file(), raw
                  assert hashlib.sha256(raw.read_bytes()).hexdigest()==meta['sha256'], (year,role)
                  assert raw.stat().st_size==meta['bytes'], (year,role)

          captures=sorted((D/'archive/b17d-2027-anchor-captures').glob('*/capture_manifest.json'))
          assert captures, 'No B17D 2027 capture manifest found.'
          latest=captures[-1]
          capture=json.loads(latest.read_text())
          for role,meta in capture['pages'].items():
              raw=latest.parent/f'{role}.html'
              assert raw.is_file(), raw
              assert hashlib.sha256(raw.read_bytes()).hexdigest()==meta['sha256'], role
              assert raw.stat().st_size==meta['bytes'], role

          print('PASS: replayed archived HTML remains byte-identical to recorded source hashes.')
          PY

      - name: Commit B17D with raw-HTML-aware whitespace validation
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during B17D V2 recovery."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-capital-outlook-v1/b17d/ \
            research/draft-capital-outlook-v1/archive/b17d-2027-anchor-captures/

          # git diff --check is appropriate for generated text, but archived source HTML
          # must remain byte-for-byte source-faithful and may legitimately contain
          # upstream trailing whitespace. Validate every staged non-HTML file only.
          mapfile -d '' staged < <(git diff --cached --name-only -z)
          test "${#staged[@]}" -gt 0

          text_paths=()
          for p in "${staged[@]}"; do
            case "$p" in
              *.html|*.htm) ;;
              *) text_paths+=("$p") ;;
            esac
          done

          if [ "${#text_paths[@]}" -gt 0 ]; then
            git diff --cached --check -- "${text_paths[@]}"
          fi

          # Final staged scope remains research-only.
          for p in "${staged[@]}"; do
            case "$p" in
              research/draft-capital-outlook-v1/b17d/*|research/draft-capital-outlook-v1/archive/b17d-2027-anchor-captures/*) ;;
              *) echo "ERROR: unexpected staged path: $p"; exit 1 ;;
            esac
          done

          git commit -m "Recover B17D source-only audit after commit-validator failure"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B17D V2 technical recovery committed without changing scientific logic."
