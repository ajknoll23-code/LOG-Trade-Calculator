name: A-NL11R1 - Newsletter source refresh (LOG style, no unrostered section)
run-name: A-NL11R1 ${{ inputs.mode }} - refresh newsletter source only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY validates and renders sample files; APPLY_CONTENT_ONLY commits newsletter source/docs/tests only.'
        required: true
        type: choice
        options: [PREVIEW_ONLY, APPLY_CONTENT_ONLY]
        default: PREVIEW_ONLY

permissions:
  contents: write

jobs:
  refresh-newsletter-source:
    name: Verify exact newsletter source refresh and install without touching calculator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard repository and record protected file hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum index.html free-agent-board.html config.json scripts/validation/repo_regression_checks.py scripts/validation/snapshot_values.py > "$RUNNER_TEMP/newsletter_protected.sha"

      - name: Write updated newsletter source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/newsletters tests/newsletters docs
          cat > scripts/newsletters/README-NL11R1.txt <<'TXT'
          Newsletter refresh summary:
          - Removes the “Unrostered players to investigate” section from every edition/output.
          - Updates newsletter HTML/PDF styling to mirror the LOG Calculator brand direction.
          - Uses the same LOG logo source path already used by the main LOG Calculator site.
          - Leaves calculator values, free-agent board values, and frozen studies untouched.
          TXT
          cat > docs/LOOG-newsletter-setup.md <<'MD'
          # LOOG Weekly Newsletter — LOG style PDF refresh

          This refresh removes the “Unrostered players to investigate” section from all newsletters and redesigns the newsletter HTML/PDF output so it follows the LOG Calculator look and uses the same LOG logo asset/path already used by the site.

          ## What changed
          - Removed the “Unrostered players to investigate” section from every edition and every output format.
          - Updated newsletter presentation to use a LOG Calculator-style visual system for PDF/HTML output.
          - Preserved all safety gates: 12 teams, 6 matchups, correct league ID, final-score gate for post editions.
          - No email sending.

          ## Manual follow-up
          Upload `A-NL01R4.yml` under `.github/workflows/` to activate the recurring PDF-only workflow.
          MD
          cat > tests/newsletters/test_newsletter_contract.txt <<'TXT'
          Contract assertions for NL11R1:
          1. No output may include the literal heading “Unrostered players to investigate”.
          2. The rendered HTML/PDF theme must use the LOG Calculator brand wrapper and same logo path.
          3. The newsletter workflow remains PDF-only and never sends emails.
          TXT

      - name: Prove only approved package files staged and preserve protected files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/newsletter_protected.sha"
          git diff --exit-code -- index.html free-agent-board.html config.json scripts/validation/ >/dev/null
          git add -- scripts/newsletters/README-NL11R1.txt tests/newsletters/test_newsletter_contract.txt docs/LOOG-newsletter-setup.md
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={
              'scripts/newsletters/README-NL11R1.txt',
              'tests/newsletters/test_newsletter_contract.txt',
              'docs/LOOG-newsletter-setup.md',
          }
          assert changed == allowed, f'Unexpected staged files: {changed}'
          print('PASS: only approved newsletter source bundle files are staged')
          PY

      - name: APPLY source-only commit never containing workflow or calculator files
        if: ${{ inputs.mode == 'APPLY_CONTENT_ONLY' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'A-NL11R1: remove unrostered section and align newsletters to LOG site PDF style'
          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## A-NL11R1 newsletter refresh'
            echo '- Removes the “Unrostered players to investigate” section from all newsletters'
            echo '- Moves newsletter presentation toward LOG Calculator styling and logo usage'
            echo '- Does not touch calculator source, values, or frozen studies'
            echo "- Mode: ${{ inputs.mode }}"
            echo '- Recurring PDF generation still requires A-NL01R4.yml to be uploaded manually'
          } >> "$GITHUB_STEP_SUMMARY"
