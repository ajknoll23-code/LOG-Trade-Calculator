name: B33 Schedule Utility V1 - Ordinal Prospective Shadow Preregistration
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: b33-schedule-utility-v1-ordinal-prospective-shadow-preregistration
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  B33_SCRIPT_SHA256: cdc39d677b1e4e563ca52703a36777511b52703d3cc20ecaf2e36b635bf8af89
jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Verify B32 and B32C authorize B33
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        root=Path("research/schedule-utility-v1")
        assert not (root/"schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.json").exists()
        b32=json.loads((root/"schedule_utility_v1_phase2_disposition.json").read_text())
        b32c=json.loads((root/"schedule_utility_v1_historical_ordinal_development_diagnostic.json").read_text())
        assert b32["status"]=="QUANTITATIVE_V1_STOP_ORDINAL_V1_SHADOW_PATH_PRESERVED"
        assert b32["ordinal_v1_disposition"]["status"]=="AUTHORIZED_FOR_PROSPECTIVE_SHADOW_ONLY"
        assert b32["production"]["ordinal_display_authorized_now"] is False
        assert b32c["status"]=="DEVELOPMENT_ORDINAL_SIGNAL_POSITIVE_CONTINUE_TO_B33"
        assert b32c["governance"]["confirmatory_evidence"] is False
        p=b32c["pooled_equal_position"]
        assert p["mean_week_cell_spearman"]>0
        assert p["mean_easy_minus_hard_quartile_residual_points"]>0
        print("PASS: B32/B32C authorize B33 preregistration only")
        PY
    - name: Enforce Week 5 no-backfill timing firewall
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'PY'
        from datetime import datetime, timezone
        deadline=datetime.fromisoformat("2026-10-09T00:15:00+00:00")
        now=datetime.now(timezone.utc)
        print("Current UTC:",now.isoformat())
        print("Week 5 first kickoff UTC:",deadline.isoformat())
        if not now < deadline:
            raise SystemExit("Missed Week 5 timing firewall. Never backfill Week 5.")
        print("PASS: freezing before Week 5 first kickoff")
        PY
    - name: Snapshot production surfaces
      shell: bash
      run: |
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Freeze B33 preregistration implementation
      shell: bash
      run: |
        set -euo pipefail
        cat > /tmp/b33.py <<'PYFILE'
        #!/usr/bin/env python3
        import json
        from pathlib import Path

        root = Path("research/schedule-utility-v1")
        out = root / "schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.json"
        md = root / "schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.md"

        r = {
          "schema_version": 1,
          "study_id": "schedule-utility-v1",
          "phase": "B33-ordinal-prospective-shadow-preregistration",
          "status": "PREREGISTERED_ORDINAL_PROSPECTIVE_SHADOW",
          "governance": {
            "quantitative_v1_unit_weight_stop_remains_binding": True,
            "ordinal_v1_status": "PROSPECTIVE_SHADOW_ONLY",
            "user_facing_production_authorized": False,
            "point_adjustment_authorized": False,
            "projection_change_authorized": False,
            "fv_change_authorized": False,
            "package_adjustment_change_authorized": False,
            "team_utility_change_authorized": False,
            "trade_verdict_change_authorized": False,
            "raw_log_sapa_numeric_display_authorized": False,
            "2015_2025_role": "CONSUMED_DEVELOPMENT_ONLY",
            "2015_2025_may_confirm_this_preregistration": False,
            "post_outcome_retuning_authorized": False
          },
          "frozen_inputs": {
            "log_sapa_metric": "LOG-SAPA-V1",
            "log_sapa_sha256": "9ab4ec5b21ef9ef57e476e861a7293dbc886b9bc9d7cc5f0bd5cc982cc729ee6",
            "scoring_mode": "HALF_PPR_ONLY",
            "positions": ["QB","RB","WR","TE"],
            "position_pooling": "EQUAL_WEIGHT_ACROSS_QB_RB_WR_TE",
            "ppr_duplicate_rank_cells_excluded": True,
            "lookback_weeks": 10,
            "minimum_offense_baseline_games": 2,
            "minimum_defense_adjusted_games": 3,
            "minimum_opponent_comparison_games": 2,
            "same_season_only": True,
            "week_18_supported": False
          },
          "prospective_origin_contract": {
            "season": 2026,
            "first_candidate_origin_week": 5,
            "last_candidate_origin_week": 17,
            "primary_origin_count_required": 10,
            "primary_origins_selection_rule": "first 10 chronologically eligible origin weeks whose snapshot is frozen before that week's first actual NFL kickoff",
            "if_fewer_than_10_eligible_2026_origins": "continue into 2027 under unchanged rules; never lower the 10-origin minimum",
            "2026_week_4": "INELIGIBLE_NO_BACKFILL",
            "2026_week_5_first_kickoff_utc": "2026-10-09T00:15:00Z",
            "missed_origin_rule": "a snapshot not committed before first actual kickoff is permanently ineligible and cannot be reconstructed or backfilled",
            "snapshot_hash_required": True,
            "weekly_snapshot_visibility": "NON_USER_VISIBLE"
          },
          "information_cutoff": {
            "origin_week_definition": "NFL schedule-labeled regular-season week W",
            "origin_cutoff": "earliest actual kickoff timestamp among regular-season games schedule-labeled Week W",
            "history_candidate_rule": "scheduled week in [max(1,W-10),W-1] AND actual kickoff strictly earlier than origin cutoff",
            "target_or_post_cutoff_rows_in_predictor": False,
            "postponed_prior_week_after_cutoff": "EXCLUDE"
          },
          "origin_snapshot_construction": {
            "offense_baseline": "unweighted mean team-position Half-PPR points over eligible pre-origin history; minimum 2 games",
            "defense_effect": "frozen LOG-SAPA-V1 defense effect from the same eligible pre-origin history",
            "future_game_predictor": "target opponent defense_effect frozen at origin; never recompute after origin cutoff",
            "future_game_baseline": "offense baseline frozen at origin; never update for prospective target residual",
            "direction": "larger defense_effect means easier matchup"
          },
          "future_target_mapping": {
            "eligible_target_games": "played regular-season games strictly after origin cutoff and schedule-labeled no later than Week 17",
            "team_future_game_order": "order by actual kickoff then game_id",
            "horizon_index": "h=1 next played game; h=2 second; h=3 third; h>=4 fourth or later",
            "bye_handling": "byes create no target row; horizon counts played games",
            "target": "actual target-game team-position Half-PPR points minus offense baseline frozen at origin",
            "week_18_targets": "EXCLUDED"
          },
          "ordinal_analysis": {
            "group_unit": "origin_week x position x exact_horizon_index",
            "rank_variable": "origin-frozen defense_effect",
            "rank_direction": "larger is easier",
            "tie_break": "defense team code, offense team code, target game_id",
            "display_tiers": ["Hard","Neutral","Easy"],
            "tier_rule": "within each group sort hard-to-easy and split deterministically into three count-balanced contiguous tiers; remainder rows allocated Hard then Neutral then Easy"
          },
          "primary_statistic": {
            "group_statistic": "Spearman(origin-frozen defense_effect, realized offense residual)",
            "pooling": "mean group Spearman within position, then equal-weight mean across QB/RB/WR/TE",
            "directional_alternative": "pooled Spearman > 0",
            "permutation_null": "within each analysis group independently permute frozen defense_effect assignments across target rows",
            "permutation_repetitions": 10000,
            "permutation_seed": 20261002,
            "one_sided_p_definition": "(1 + count(permuted pooled statistic >= observed)) / 10001",
            "alpha": 0.05
          },
          "tier_co_requirement": {
            "calculation": "calculate Hard/Neutral/Easy mean residual within group; average groups within position, then equal-weight positions",
            "required_order": "Easy > Neutral > Hard",
            "required_for_every_authorized_horizon_gate": True
          },
          "coverage": {
            "schedule_anchored_expected_rows": True,
            "missing_target": "UNCOVERED_NOT_ZERO",
            "missing_origin_baseline": "UNCOVERED",
            "missing_origin_defense_effect": "UNCOVERED",
            "minimum_h1_coverage_fraction_each_position": 0.95,
            "later_horizon_missingness": "report all expected and covered rows by position and exact h; never silently drop"
          },
          "sequential_gatekeeping": {
            "order": ["H1_SINGLE_GAME","H2_3_NEXT_THREE","H_GE_4_LONG_HORIZON"],
            "familywise_alpha": 0.05,
            "H1_SINGLE_GAME": {
              "rows": "h=1 only",
              "requirements_all": ["10 primary eligible origin weeks","coverage >=0.95 for QB/RB/WR/TE","pooled one-sided permutation p <=0.05","pooled tiers Easy > Neutral > Hard"],
              "if_fail": "STOP ordinal production path; later horizon gates not tested for authorization",
              "if_pass_authorizes": "single-matchup ordinal display consideration only; not automatic deployment"
            },
            "H2_3_NEXT_THREE": {
              "may_test_only_if": "H1_SINGLE_GAME passes",
              "rows": "exact h=2 and h=3 groups",
              "requirements_all": ["pooled one-sided permutation p <=0.05","pooled tiers Easy > Neutral > Hard"],
              "if_fail": "Next-3, ROS, Playoff remain unauthorized; H_GE_4 not tested for authorization",
              "if_pass_authorizes": "Next-3 ordinal display consideration only"
            },
            "H_GE_4_LONG_HORIZON": {
              "may_test_only_if": "H2_3_NEXT_THREE passes",
              "rows": "all exact horizon groups h>=4 through Week 17",
              "requirements_all": ["pooled one-sided permutation p <=0.05","pooled tiers Easy > Neutral > Hard"],
              "if_fail": "ROS and Playoff remain unauthorized",
              "if_pass_authorizes": "ROS and Fantasy Playoff ordinal display consideration only"
            }
          },
          "per_position_display_rule": {
            "applies_only_after_H1_pooled_gate_passes": True,
            "position_eligible_only_if": "that position's mean h=1 within-origin-week Spearman point estimate is strictly >0",
            "nonpositive_position": "HIDDEN_FROM_ALL_ORDINAL_V1_USER_FACING_VIEWS",
            "position_specific_p_value_gate": False
          },
          "product_authorization_map": {
            "after_H1_pass": ["Easy/Neutral/Hard single-matchup tier","coarse single-matchup ordinal indicator","coarse league-relative matchup band"],
            "after_H2_3_pass": ["Next-3 ordinal schedule view"],
            "after_H_GE_4_pass": ["Rest-of-Season ordinal schedule view through Week 17","Fantasy Playoff ordinal schedule view for Weeks 15-17"],
            "never_authorized_by_this_study": ["raw LOG-SAPA point-scale display","expected point adjustment","projection modification","dynasty FV modification","Package Adjustment modification","Team Utility modification","Trade Verdict modification","Week 18 playoff view"]
          },
          "fantasy_playoff_scope": {"nfl_weeks": [15,16,17], "week_18": "EXCLUDED_UNSUPPORTED"},
          "claim_boundary_if_authorized": {
            "allowed": "Schedule ratings rank upcoming defensive matchups from relatively easier to relatively harder using LOG-SAPA ordinal information.",
            "required_disclaimer": "They are contextual rankings only; they are not point projections and do not change player value.",
            "prohibited": ["Expected +X fantasy points","projection boost","improves expected scoring","X% value boost","schedule makes player worth more","validated predictive edge beyond tested ordinal claim","guaranteed favorable matchup","4for4 methodology representation"]
          },
          "failure_rules": {
            "no_threshold_loosen_after_data": True,
            "no_tier_redefinition_after_data": True,
            "no_position_dropping_to_rescue_pooled_gate": True,
            "redesign_requires_new_version_and_unopened_data": True
          },
          "next_stage": {
            "name": "B34 weekly prospective snapshot freezer",
            "production": False,
            "first_eligible_origin": "2026 Week 5 if snapshot frozen before cutoff",
            "no_outcome_evaluation_before_minimum_sample": True
          }
        }

        out.write_text(json.dumps(r, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        md.write_text("# Schedule Utility V1 — B33 Ordinal Prospective Shadow Preregistration\n\n"
                      "**Status:** `PREREGISTERED_ORDINAL_PROSPECTIVE_SHADOW`\n\n"
                      "- Quantitative V1 STOP remains binding.\n"
                      "- Ordinal V1 remains non-user-visible until prospective gates pass.\n"
                      "- Half-PPR only; QB/RB/WR/TE equal position weight.\n"
                      "- First 10 eligible origin weeks; no backfill.\n"
                      "- Fixed-sequence gates: h=1 -> h=2-3 -> h>=4.\n"
                      "- Each gate requires one-sided permutation p <= 0.05 and Easy > Neutral > Hard.\n"
                      "- h=1 additionally requires >=95% coverage for every position.\n"
                      "- A position can display only if its h=1 mean Spearman is >0 after pooled H1 passes.\n"
                      "- Fantasy Playoff scope: NFL Weeks 15-17 only; Week 18 excluded.\n"
                      "- Passing authorizes ordinal display consideration only, never point/FV/trade changes.\n",
                      encoding="utf-8")
        print("PASS: B33 preregistration written")
        PYFILE
        python3 -m py_compile /tmp/b33.py
        test "$(sha256sum /tmp/b33.py | awk '{print $1}')" = "$B33_SCRIPT_SHA256"
        python3 /tmp/b33.py
    - name: Validate frozen B33 contract
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path
        r=json.loads(Path("research/schedule-utility-v1/schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.json").read_text())
        assert r["status"]=="PREREGISTERED_ORDINAL_PROSPECTIVE_SHADOW"
        assert r["governance"]["user_facing_production_authorized"] is False
        assert r["frozen_inputs"]["scoring_mode"]=="HALF_PPR_ONLY"
        assert r["prospective_origin_contract"]["primary_origin_count_required"]==10
        assert r["prospective_origin_contract"]["2026_week_4"]=="INELIGIBLE_NO_BACKFILL"
        assert r["primary_statistic"]["permutation_repetitions"]==10000
        assert r["primary_statistic"]["alpha"]==0.05
        assert r["tier_co_requirement"]["required_order"]=="Easy > Neutral > Hard"
        assert r["coverage"]["minimum_h1_coverage_fraction_each_position"]==0.95
        assert r["sequential_gatekeeping"]["order"]==["H1_SINGLE_GAME","H2_3_NEXT_THREE","H_GE_4_LONG_HORIZON"]
        assert r["sequential_gatekeeping"]["H2_3_NEXT_THREE"]["may_test_only_if"]=="H1_SINGLE_GAME passes"
        assert r["sequential_gatekeeping"]["H_GE_4_LONG_HORIZON"]["may_test_only_if"]=="H2_3_NEXT_THREE passes"
        assert r["fantasy_playoff_scope"]["nfl_weeks"]==[15,16,17]
        assert r["fantasy_playoff_scope"]["week_18"]=="EXCLUDED_UNSUPPORTED"
        assert r["next_stage"]["name"]=="B34 weekly prospective snapshot freezer"
        print("PASS: B33 contract validated")
        PY
        test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
        test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
        test -z "$(git diff --name-only -- index.html free-agent-board.html)"
    - name: Commit frozen B33 preregistration
      shell: bash
      run: |
        set -euo pipefail
        git add research/schedule-utility-v1/schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.json research/schedule-utility-v1/schedule_utility_v1_b33_ordinal_prospective_shadow_prereg.md
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Freeze Schedule Utility V1 B33 ordinal prospective shadow preregistration"
        git push origin HEAD:main
    - name: Closeout
      shell: bash
      run: |
        set -euo pipefail
        echo "B33 frozen: ordinal prospective shadow preregistered"
        echo "First eligible origin: Week 5"
        echo "Production authorized: NO"
        echo "Next workflow: B34 weekly prospective snapshot freezer"
