      - name: Download exact B41A-pinned development sources only
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          SRC="/tmp/player-role-v2-b41b"
          mkdir -p "$SRC"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import requests

          base = Path("research/player-role-v2")
          feas = json.loads(
              (base / "player_role_v2_b41a_source_feasibility.json")
              .read_text(encoding="utf-8")
          )
          out = Path("/tmp/player-role-v2-b41b")
          ua = {"User-Agent": "LOG-Trade-Calculator-player-role-v2-b41b"}

          def download_and_pin(url, path, expected_sha):
              r = requests.get(url, timeout=180, headers=ua)
              r.raise_for_status()
              actual = hashlib.sha256(r.content).hexdigest()
              if actual != expected_sha:
                  raise RuntimeError(
                      f"source drift for {path.name}: expected={expected_sha} actual={actual}"
                  )
              path.write_bytes(r.content)
              print(path.name, actual)

          for season in range(2019, 2025):
              sm = feas["sources"]["nflverse_weekly_player_stats"]["seasons"][str(season)]
              download_and_pin(
                  sm["url"],
                  out / f"stats_player_week_{season}.csv",
                  sm["sha256"],
              )

              sn = feas["sources"]["nflverse_snap_counts"]["seasons"][str(season)]
              download_and_pin(
                  sn["url"],
                  out / f"snap_counts_{season}.csv",
                  sn["sha256"],
              )

          # Identity-only crosswalk. Current corrections to player IDs are allowed:
          # this file is used only to join GSIS and PFR identifiers, never as a
          # performance or target feature.
          players_url = (
              "https://github.com/nflverse/nflverse-data/releases/download/"
              "players/players.csv"
          )
          r = requests.get(players_url, timeout=180, headers=ua)
          r.raise_for_status()
          (out / "players.csv").write_bytes(r.content)
          print(
              "players.csv",
              hashlib.sha256(r.content).hexdigest(),
              "identity-only crosswalk",
          )
          PY

          # Explicitly prove no 2025 development files were downloaded.
          test ! -e "$SRC/stats_player_week_2025.csv"
          test ! -e "$SRC/snap_counts_2025.csv"

      - name: Construct development cohort and run leakage audit
        shell: bash
        run: |
          set -euo pipefail
          BASE="research/player-role-v2"
          SRC="/tmp/player-role-v2-b41b"

          python3 "$BASE/player_role_v2_b41b_cohort_builder.py" \
            --source-dir "$SRC" \
            --players "$SRC/players.csv" \
            --out-cohort "$SRC/player_role_v2_development_cohort.csv.gz" \
            --out-audit "$SRC/player_role_v2_b41b_cohort_audit.json" \
            --out-manifest "$SRC/player_role_v2_b41b_cohort_manifest.json"

          python3 - <<'PY'
          import csv
          import gzip
          import json
          from pathlib import Path

          src = Path("/tmp/player-role-v2-b41b")
          audit = json.loads(
              (src / "player_role_v2_b41b_cohort_audit.json")
              .read_text(encoding="utf-8")
          )
          manifest = json.loads(
              (src / "player_role_v2_b41b_cohort_manifest.json")
              .read_text(encoding="utf-8")
          )

          assert audit["development_seasons"] == [2019, 2020, 2021, 2022, 2023, 2024]
          assert audit["untouched_holdout_season"] == 2025
          assert audit["holdout_rows_read"] == 0
          assert audit["historical_projection_features_used"] is False
          assert audit["model_fit_performed"] is False
          assert audit["predictor_target_association_computed"] is False
          assert audit["role_weights_derived"] is False
          assert audit["role_thresholds_derived"] is False
          assert audit["production_change_authorized"] is False
          assert all(audit["leakage_checks"].values())
          assert audit["target_status"]["future_league_scored_target_computed"] is False

          assert manifest["holdout_opened"] is False
          assert manifest["model_fit_performed"] is False
          assert manifest["production_change_authorized"] is False
          assert manifest["cohort_row_count"] == audit["cohort_row_count"]

          with gzip.open(
              src / "player_role_v2_development_cohort.csv.gz",
              "rt",
              encoding="utf-8",
              newline="",
          ) as f:
              reader = csv.DictReader(f)
              forbidden = {
                  "owner_id", "roster_id", "dynasty_team", "username",
                  "projection", "fantasypros",
              }
              headers = [h.lower() for h in (reader.fieldnames or [])]
              assert not any(
                  token in h
                  for h in headers
                  for token in forbidden
              )
              checked = 0
              for row in reader:
                  assert int(row["season"]) <= 2024
                  assert int(row["feature_max_week"]) <= int(row["origin_week"])
                  assert int(row["target_min_week"]) > int(row["origin_week"])
                  checked += 1
                  if checked >= 5000:
                      break
              assert checked > 0

          print("PASS: row-level leakage audit sampled 5,000 development rows.")
          print("PASS: 2025 holdout remains unopened.")
          print("PASS: no projections, owners, model fit, weights or tier thresholds.")
          PY

