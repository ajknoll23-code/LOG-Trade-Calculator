name: Durability V2 Phase 3 Shadow Audit

# Research-only current-player durability shadow.
# Changes no deployed value or production file.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 3 self-test
        run: python3 research/durability-v2/durability_v2_phase3_shadow_audit.py --selftest

      - name: Build Durability V2 Phase 3 shadow
        run: python3 research/durability-v2/durability_v2_phase3_shadow_audit.py --write

      - name: Verify Phase 3 outputs
        run: python3 research/durability-v2/durability_v2_phase3_shadow_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/durability-v2/durability_v2_phase3_shadow_audit.json
          git add research/durability-v2/durability_v2_phase3_shadow_audit.md
          git diff --staged --quiet || git commit -m "Add Durability V2 Phase 3 shadow audit"
          git push
