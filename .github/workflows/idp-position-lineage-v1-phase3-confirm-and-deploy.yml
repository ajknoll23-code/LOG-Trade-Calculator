name: IDP Position Lineage V1 Phase 3 Confirm and Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  confirm-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"
          python3 - <<'PY'
          import requests
          print("requests import PASS:", requests.__version__)
          PY

      - name: Guard frozen research and clean repository
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html
            data/league_rosters.json
            scripts/artifacts/generated/player_positions.json
            scripts/validation/snapshot_values.py
            scripts/validation/repo_regression_checks.py
            research/team-utility/team_utility_starter_objective_audit.py
            research/idp-position-lineage-v1/phase1b_current_core_cohort.json
            research/idp-position-lineage-v1/idp_position_lineage_v1_phase1b.json
            research/idp-position-lineage-v1/phase1b_manifest.json
            research/idp-position-lineage-v1/idp_position_lineage_v1_phase2.json
            research/idp-position-lineage-v1/phase2_manifest.json
            research/idp-position-lineage-v1/idp_position_lineage_v1_phase2b.json
            research/idp-position-lineage-v1/phase2b_manifest.json
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required input: $f"; exit 1; }
          done

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"

          outputs=(
            model/releases/idp-position-lineage-v1/release.json
            scripts/model/apply_idp_position_lineage_v1_release.py
            research/idp-position-lineage-v1/phase3_production_confirmation.json
            research/idp-position-lineage-v1/phase3_production_confirmation.md
            research/idp-position-lineage-v1/phase3_manifest.json
          )
          for f in "${outputs[@]}"; do
            test ! -e "$f" || {
              echo "Refusing to overwrite existing Position Lineage V1 deployment artifact: $f"
              exit 1
            }
          done

          git rev-parse HEAD | tee "${RUNNER_TEMP}/starting_sha.txt"

          sha256sum \
            data/league_rosters.json \
            scripts/artifacts/generated/player_positions.json \
            > "${RUNNER_TEMP}/phase3-live-inputs.sha256"

      - name: Preflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Verify frozen Phase 1B, Phase 2, and Phase 2B evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          r = root / "research" / "idp-position-lineage-v1"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p1b = json.loads((r / "idp_position_lineage_v1_phase1b.json").read_text())
          m1b = json.loads((r / "phase1b_manifest.json").read_text())
          p2 = json.loads((r / "idp_position_lineage_v1_phase2.json").read_text())
          m2 = json.loads((r / "phase2_manifest.json").read_text())
          p2b = json.loads((r / "idp_position_lineage_v1_phase2b.json").read_text())
          m2b = json.loads((r / "phase2b_manifest.json").read_text())

          assert p1b["decision"] == "PASS_IDP_POSITION_LINEAGE_V1_PHASE1B_CURRENT_CORE_FREEZE"
          assert p2["decision"] == "STOP_IDP_POSITION_LINEAGE_V1_PHASE2_SHADOW_SANITY"
          assert p2b["decision"] == "PASS_IDP_POSITION_LINEAGE_V1_PHASE2B_AGE_FEEDBACK_SHADOW"
          assert p1b["production_change_authorized"] is False
          assert p2["production_change_authorized"] is False
          assert p2b["production_change_authorized"] is False

          for manifest in (m1b, m2, m2b):
              for rel, expected in manifest["output_sha256"].items():
                  path = root / rel
                  assert path.exists(), rel
                  actual = sha(path)
                  assert actual == expected, (
                      f"Frozen evidence drift: {rel}: {actual} != {expected}"
                  )

          assert p1b["counts"]["current_core_cohort"] == 27
          assert p1b["counts"]["candidate_rows"] == 24
          assert p1b["counts"]["held_rows"] == 3
          assert p2b["counts"]["candidate_rows"] == 24
          assert p2b["counts"]["held_rows"] == 3

          print("PASS: frozen Position Lineage V1 evidence is intact.")
          PY

      - name: Write approved production release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model/releases/idp-position-lineage-v1

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          r = root / "research" / "idp-position-lineage-v1"
          out = root / "model" / "releases" / "idp-position-lineage-v1" / "release.json"

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          p1b = json.loads((r / "idp_position_lineage_v1_phase1b.json").read_text())
          p2b = json.loads((r / "idp_position_lineage_v1_phase2b.json").read_text())
          cohort = json.loads((r / "phase1b_current_core_cohort.json").read_text())

          p1b_by_key = {row["key"]: row for row in p1b["rows"]}
          p2b_by_key = {row["key"]: row for row in p2b["rows"]}

          candidates = []
          holds = []

          for row in cohort["rows"]:
              key = row["key"]
              frozen = p1b_by_key[key]
              shadow = p2b_by_key[key]

              base = {
                  "key": key,
                  "sleeper_id": row.get("sleeper_id"),
                  "legacy_model_position": row["legacy_model_position"],
                  "current_position": row["current_position"],
                  "deployed_raw_prod_mult": float(
                      frozen["deployed_raw_prod_mult"]
                  ),
                  "phase2b_current_fv": int(shadow["current_fv"]),
                  "phase2b_shadow_fv": int(shadow["shadow_fv"]),
              }

              if frozen["status"] == "candidate":
                  candidates.append({
                      **base,
                      "candidate_raw_prod_mult": float(
                          frozen["candidate_raw_prod_mult"]
                      ),
                  })
              else:
                  holds.append(base)

          candidates.sort(key=lambda row: row["key"])
          holds.sort(key=lambda row: row["key"])

          assert len(candidates) == 24
          assert len(holds) == 3

          release = {
              "release_id": "idp-position-lineage-v1",
              "status": "APPROVED_BY_PHASE2B_PENDING_PHASE3_DEPLOYMENT",
              "method": (
                  "exact Phase1B raw PROD_MULT candidate, validated by "
                  "Phase2B age-feedback shadow"
              ),
              "candidate_count": len(candidates),
              "held_count": len(holds),
              "candidate_overrides": candidates,
              "held_rows": holds,
              "scope": "core PROD_MULT_DATA only",
              "deployment_policy": {
                  "only_candidate_raw_prod_mult_changes": True,
                  "held_rows_unchanged": True,
                  "noncohort_prod_mult_unchanged": True,
                  "offense_unchanged": True,
                  "position_age_role_formula_unchanged": True
              },
              "phase1b_manifest_sha256": sha(r / "phase1b_manifest.json"),
              "phase2_manifest_sha256": sha(r / "phase2_manifest.json"),
              "phase2b_manifest_sha256": sha(r / "phase2b_manifest.json")
          }

          out.write_text(json.dumps(release, indent=2, sort_keys=True) + "\n")
          print("Wrote", out, "with", len(candidates), "candidates and", len(holds), "holds.")
          PY

      - name: Upgrade IDP V1 validator for approved successor layering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validation/validate_idp_v1_final_deployment.py")
          text = path.read_text(encoding="utf-8")

          if "POSITION_LINEAGE_RELEASE =" in text:
              raise RuntimeError(
                  "Validator is already successor-aware; refusing ambiguous re-patch"
              )

          const_anchor = (
              'PATCH = REPO_ROOT / "model" / "releases" / "idp-v1" '
              '/ "idp_v1_prod_mult_patch.json"\n'
          )
          if const_anchor not in text:
              raise RuntimeError("Could not locate IDP V1 PATCH constant")
          text = text.replace(
              const_anchor,
              const_anchor
              + 'POSITION_LINEAGE_RELEASE = REPO_ROOT / "model" / "releases" '
                '/ "idp-position-lineage-v1" / "release.json"\n',
              1,
          )

          start_marker = "    # Exact deployed-table integrity.\n"
          end_marker = (
              "    # Reconstruct the exact old live valuation by swapping only "
              "PROD_MULT back\n"
          )
          block_start = text.find(start_marker)
          block_end = text.find(end_marker, block_start)
          if block_start < 0 or block_end < 0:
              raise RuntimeError("Could not locate legacy deployed-table integrity block")

          layered_integrity = r'''    # Layer-aware deployed-table integrity.
              #
              # The immutable IDP V1 release remains the historical base release. A later
              # approved position-lineage release may intentionally replace a narrow set
              # of those deployed raw multipliers. Validate V1 against its own immutable
              # baseline/candidate first, then validate any successor overlay on top.
              if set(current) != set(baseline):
                  missing = sorted(set(baseline) - set(current))
                  extra = sorted(set(current) - set(baseline))
                  raise AssertionError(
                      "PROD_MULT key set changed across deployed IDP stack; "
                      f"missing={missing[:10]} extra={extra[:10]}"
                  )

              patch_by_key = {e["key"]: e for e in patch["entries"]}
              expected_changed = set(patch_by_key)

              v1_expected = dict(baseline)
              for key, e in patch_by_key.items():
                  if abs(float(e["old"]) - baseline[key]) > 1e-12:
                      raise AssertionError(
                          f"patch old value no longer matches immutable baseline: {key}"
                      )
                  v1_expected[key] = fmt_value(e["new"])

              v1_changed = {
                  k for k in baseline
                  if abs(v1_expected[k] - baseline[k]) > 1e-12
              }
              if v1_changed != expected_changed:
                  missing = sorted(expected_changed - v1_changed)
                  unexpected = sorted(v1_changed - expected_changed)
                  raise AssertionError(
                      "reconstructed V1 changed-key set != approved patch; "
                      f"missing={missing[:10]} unexpected={unexpected[:10]}"
                  )

              for key, row in candidate["players"].items():
                  if key not in v1_expected:
                      raise AssertionError(
                          f"candidate key missing from reconstructed V1 PROD_MULT: {key}"
                      )
                  expected = fmt_value(row["candidate_prod_mult"])
                  if abs(v1_expected[key] - expected) > 1e-12:
                      raise AssertionError(
                          f"reconstructed V1 candidate mismatch {key}: "
                          f"expected {expected}, got {v1_expected[key]}"
                      )

              for key, e in patch_by_key.items():
                  if abs(fmt_value(e["new"]) - v1_expected[key]) > 1e-12:
                      raise AssertionError(
                          f"patch new value no longer matches reconstructed V1 value: {key}"
                      )

              lineage_release = None
              lineage_candidates = {}
              lineage_holds = {}
              expected_current = dict(v1_expected)

              if POSITION_LINEAGE_RELEASE.exists():
                  lineage_release = json.load(
                      open(POSITION_LINEAGE_RELEASE, encoding="utf-8")
                  )
                  if lineage_release.get("release_id") != "idp-position-lineage-v1":
                      raise AssertionError(
                          "unexpected Position Lineage release_id: "
                          f"{lineage_release.get('release_id')}"
                      )

                  candidate_rows = lineage_release.get("candidate_overrides") or []
                  hold_rows = lineage_release.get("held_rows") or []
                  if len(candidate_rows) != 24 or len(hold_rows) != 3:
                      raise AssertionError(
                          "Position Lineage release count mismatch: "
                          f"candidates={len(candidate_rows)} holds={len(hold_rows)}"
                      )

                  lineage_candidates = {row["key"]: row for row in candidate_rows}
                  lineage_holds = {row["key"]: row for row in hold_rows}
                  if len(lineage_candidates) != len(candidate_rows):
                      raise AssertionError("duplicate Position Lineage candidate key")
                  if len(lineage_holds) != len(hold_rows):
                      raise AssertionError("duplicate Position Lineage hold key")
                  if set(lineage_candidates) & set(lineage_holds):
                      raise AssertionError("Position Lineage candidate/hold key sets overlap")

                  for key, row in lineage_candidates.items():
                      if key not in v1_expected:
                          raise AssertionError(
                              f"Position Lineage candidate missing from V1 table: {key}"
                          )
                      base = float(row["deployed_raw_prod_mult"])
                      if abs(v1_expected[key] - base) > 1e-12:
                          raise AssertionError(
                              f"Position Lineage base mismatch {key}: "
                              f"release={base}, reconstructed_v1={v1_expected[key]}"
                          )
                      expected_current[key] = fmt_value(row["candidate_raw_prod_mult"])

                  for key, row in lineage_holds.items():
                      if key not in v1_expected:
                          raise AssertionError(
                              f"Position Lineage hold missing from V1 table: {key}"
                          )
                      base = float(row["deployed_raw_prod_mult"])
                      if abs(v1_expected[key] - base) > 1e-12:
                          raise AssertionError(
                              f"Position Lineage hold base mismatch {key}: "
                              f"release={base}, reconstructed_v1={v1_expected[key]}"
                          )

              current_mismatches = []
              for key in baseline:
                  if abs(current[key] - expected_current[key]) > 1e-12:
                      current_mismatches.append((key, expected_current[key], current[key]))
              if current_mismatches:
                  raise AssertionError(
                      "live PROD_MULT does not match V1 + approved successor stack: "
                      f"{current_mismatches[:10]}"
                  )

              lineage_changed = {
                  key for key in v1_expected
                  if abs(expected_current[key] - v1_expected[key]) > 1e-12
              }
              if lineage_release is not None and lineage_changed != set(lineage_candidates):
                  missing = sorted(set(lineage_candidates) - lineage_changed)
                  unexpected = sorted(lineage_changed - set(lineage_candidates))
                  raise AssertionError(
                      "Position Lineage changed-key set mismatch: "
                      f"missing={missing[:10]} unexpected={unexpected[:10]}"
                  )

              actual_changed = v1_changed
              current_stack_changed = {
                  k for k in baseline
                  if abs(current[k] - baseline[k]) > 1e-12
              }

          '''

          text = text[:block_start] + layered_integrity + text[block_end:]

          old_reconstruct = '''    # Reconstruct the exact old live valuation by swapping only PROD_MULT back
              # to the immutable baseline; every other current valuation constant remains
              # identical, which is exactly the release attribution we want.
              old_cfg = dict(cfg)
              old_cfg["prod_mult"] = dict(current)
              old_cfg["prod_mult"].update(baseline)
              old_values = snapshot_values.compute_all_values(old_cfg)
              new_values = snapshot_values.compute_all_values(cfg)
              old_ranks, new_ranks = rank_map(old_values), rank_map(new_values)
          '''
          new_reconstruct = '''    # Preserve historical V1 movement independently of successor layers.
              old_cfg = dict(cfg)
              old_cfg["prod_mult"] = dict(baseline)
              v1_cfg = dict(cfg)
              v1_cfg["prod_mult"] = dict(v1_expected)

              old_values = snapshot_values.compute_all_values(old_cfg)
              new_values = snapshot_values.compute_all_values(v1_cfg)
              current_values = snapshot_values.compute_all_values(cfg)
              old_ranks, new_ranks = rank_map(old_values), rank_map(new_values)
          '''
          if old_reconstruct not in text:
              raise RuntimeError("Could not locate legacy V1 reconstruction block")
          text = text.replace(old_reconstruct, new_reconstruct, 1)

          old_non_idp = '''        if old["pos"] not in IDP_POSITIONS and new_values[key]["value"] != old["value"]:
                      non_idp_diffs.append((key, old["value"], new_values[key]["value"]))
          '''
          new_non_idp = '''        if (
                      old["pos"] not in IDP_POSITIONS
                      and current_values[key]["value"] != old["value"]
                  ):
                      non_idp_diffs.append(
                          (key, old["value"], current_values[key]["value"])
                      )
          '''
          if old_non_idp not in text:
              raise RuntimeError("Could not locate non-IDP invariant")
          text = text.replace(old_non_idp, new_non_idp, 1)

          if '        raw_new = current.get(key)\n' not in text:
              raise RuntimeError("Could not locate historical raw_new line")
          text = text.replace(
              '        raw_new = current.get(key)\n',
              '        raw_new = v1_expected.get(key)\n',
              1,
          )

          cohort_old = '        old_raw, new_raw = baseline[key], current[key]\n'
          if cohort_old not in text:
              raise RuntimeError("Could not locate source-cohort raw metrics")
          text = text.replace(
              cohort_old,
              '        old_raw, new_raw = baseline[key], v1_expected[key]\n',
              1,
          )

          floor_old = (
              'sum(1 for k in candidate["players"] '
              'if abs(current[k] - 0.15) < 1e-12)'
          )
          ceil_old = (
              'sum(1 for k in candidate["players"] '
              'if abs(current[k] - 1.55) < 1e-12)'
          )
          if floor_old not in text or ceil_old not in text:
              raise RuntimeError("Could not locate historical clamp metrics")
          text = text.replace(
              floor_old,
              'sum(1 for k in candidate["players"] '
              'if abs(v1_expected[k] - 0.15) < 1e-12)',
              1,
          )
          text = text.replace(
              ceil_old,
              'sum(1 for k in candidate["players"] '
              'if abs(v1_expected[k] - 1.55) < 1e-12)',
              1,
          )

          anchor_old = '''            "new_raw_prod_mult": current.get(key),
                      "raw_prod_mult_pct_change": ((current[key] / baseline[key] - 1) * 100) if baseline.get(key) else None,
          '''
          anchor_new = '''            "new_raw_prod_mult": v1_expected.get(key),
                      "raw_prod_mult_pct_change": (
                          (v1_expected[key] / baseline[key] - 1) * 100
                      ) if baseline.get(key) else None,
          '''
          if anchor_old not in text:
              raise RuntimeError("Could not locate anchor raw metrics")
          text = text.replace(anchor_old, anchor_new, 1)

          result_anchor = '        "actual_changed_entry_count": len(actual_changed),\n'
          if result_anchor not in text:
              raise RuntimeError("Could not locate result count anchor")
          text = text.replace(
              result_anchor,
              '''        "actual_changed_entry_count": len(actual_changed),
                  "current_stack_changed_entry_count": len(current_stack_changed),
                  "position_lineage_overlay_active": lineage_release is not None,
                  "position_lineage_overlay_candidate_count": len(lineage_candidates),
                  "position_lineage_overlay_hold_count": len(lineage_holds),
                  "position_lineage_overlay_changed_entry_count": len(lineage_changed),
          ''',
              1,
          )

          report_anchor = '''        f"- Legacy/current position mismatches intentionally isolated: **{result['position_lineage_mismatch_count']}**",
          '''
          if report_anchor not in text:
              raise RuntimeError("Could not locate report summary anchor")
          text = text.replace(
              report_anchor,
              '''        f"- Frozen V1 legacy/current position mismatches: **{result['position_lineage_mismatch_count']}**",
                  f"- Position Lineage V1 successor active: **{result['position_lineage_overlay_active']}**",
                  f"- Position Lineage V1 approved overrides: **{result['position_lineage_overlay_candidate_count']}**",
                  f"- Position Lineage V1 explicit holds: **{result['position_lineage_overlay_hold_count']}**",
                  f"- Current stacked changed PROD_MULT entries vs pre-V1: **{result['current_stack_changed_entry_count']}**",
          ''',
              1,
          )

          path.write_text(text, encoding="utf-8")
          print(
              "Upgraded validate_idp_v1_final_deployment.py for "
              "V1 + Position Lineage layered validation."
          )
          PY

          python3 -m py_compile scripts/validation/validate_idp_v1_final_deployment.py

      - name: Write deterministic PROD_MULT applicator
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/model/apply_idp_position_lineage_v1_release.py <<'PY'
          #!/usr/bin/env python3
          """Apply/check the approved IDP Position Lineage V1 PROD_MULT release."""

          from __future__ import annotations

          import argparse
          import json
          from pathlib import Path
          import re
          import sys

          SCRIPT = Path(__file__).resolve()
          ROOT = SCRIPT.parents[2]
          INDEX = ROOT / "index.html"
          RELEASE = (
              ROOT / "model" / "releases" / "idp-position-lineage-v1" / "release.json"
          )

          sys.path.insert(0, str(ROOT / "scripts" / "validation"))
          import snapshot_values

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def locate_prod_object(text):
              marker = "PROD_MULT_DATA"
              idx = text.find(marker)
              if idx < 0:
                  raise RuntimeError("PROD_MULT_DATA marker not found")
              brace = text.find("{", idx)
              if brace < 0:
                  raise RuntimeError("PROD_MULT_DATA opening brace not found")

              depth = 0
              quote = None
              escape = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return brace, i + 1
              raise RuntimeError("Unclosed PROD_MULT_DATA object")

          def parse_prod(text):
              cfg = snapshot_values.load_from_html(INDEX)
              return dict(cfg["prod_mult"])

          def render(text, release):
              start, end = locate_prod_object(text)
              body = text[start:end]

              before_cfg = snapshot_values.load_from_html(INDEX)
              before_prod = dict(before_cfg["prod_mult"])

              for row in release["candidate_overrides"]:
                  key = row["key"]
                  expected_old = float(row["deployed_raw_prod_mult"])
                  candidate = float(row["candidate_raw_prod_mult"])

                  actual_old = before_prod.get(key)
                  if actual_old is None or abs(actual_old - expected_old) > 1e-9:
                      raise RuntimeError(
                          f"Current deployed raw mismatch for {key}: "
                          f"{actual_old} != {expected_old}"
                      )

                  pattern = re.compile(
                      r"('" + re.escape(key) + r"'\s*:\s*)(-?(?:\d+(?:\.\d*)?|\.\d+))"
                  )
                  matches = list(pattern.finditer(body))
                  if len(matches) != 1:
                      raise RuntimeError(
                          f"Expected exactly one PROD_MULT_DATA literal for {key}; "
                          f"found {len(matches)}"
                      )

                  body = pattern.sub(
                      lambda m: m.group(1) + format(candidate, ".4f").rstrip("0").rstrip("."),
                      body,
                      count=1,
                  )

              return text[:start] + body + text[end:]

          def validate_exact(before_text, after_text, release):
              tmp_before = INDEX.read_text(encoding="utf-8")
              try:
                  INDEX.write_text(before_text, encoding="utf-8")
                  before = snapshot_values.load_from_html(INDEX)["prod_mult"]
                  INDEX.write_text(after_text, encoding="utf-8")
                  after = snapshot_values.load_from_html(INDEX)["prod_mult"]
              finally:
                  INDEX.write_text(tmp_before, encoding="utf-8")

              expected_keys = {
                  row["key"] for row in release["candidate_overrides"]
              }
              actual_changed = {
                  key
                  for key in before
                  if float(before[key]) != float(after[key])
              }

              if actual_changed != expected_keys:
                  raise RuntimeError(
                      f"Changed PROD_MULT keys mismatch. "
                      f"Expected {sorted(expected_keys)}; actual {sorted(actual_changed)}"
                  )

              for row in release["held_rows"]:
                  key = row["key"]
                  if float(before[key]) != float(after[key]):
                      raise RuntimeError(f"Held row changed: {key}")

              if set(before) != set(after):
                  raise RuntimeError("PROD_MULT_DATA key set changed")

          def main():
              ap = argparse.ArgumentParser()
              group = ap.add_mutually_exclusive_group(required=True)
              group.add_argument("--write", action="store_true")
              group.add_argument("--check", action="store_true")
              group.add_argument("--selftest", action="store_true")
              args = ap.parse_args()

              if args.selftest:
                  sample = "const PROD_MULT_DATA = {'alpha':0.5,'beta':0.7};"
                  release = {
                      "candidate_overrides": [{
                          "key": "alpha",
                          "deployed_raw_prod_mult": 0.5,
                          "candidate_raw_prod_mult": 0.8
                      }],
                      "held_rows": []
                  }
                  # Pure substitution smoke test.
                  start, end = locate_prod_object(sample)
                  assert start < end
                  pat = re.compile(r"('alpha'\s*:\s*)(-?(?:\d+(?:\.\d*)?|\.\d+))")
                  changed = sample[:start] + pat.sub(r"\g<1>0.8", sample[start:end], count=1) + sample[end:]
                  assert "'alpha':0.8" in changed
                  print("IDP Position Lineage V1 applicator self-test PASS")
                  return

              release = read_json(RELEASE)
              before = INDEX.read_text(encoding="utf-8")

              if args.check:
                  cfg = snapshot_values.load_from_html(INDEX)
                  prod = cfg["prod_mult"]
                  for row in release["candidate_overrides"]:
                      actual = float(prod[row["key"]])
                      expected = float(row["candidate_raw_prod_mult"])
                      if abs(actual - expected) > 1e-9:
                          raise SystemExit(
                              f"Stale deployment for {row['key']}: "
                              f"{actual} != {expected}"
                          )
                  print("PASS: IDP Position Lineage V1 release is deployed")
                  return

              after = render(before, release)
              validate_exact(before, after, release)
              INDEX.write_text(after, encoding="utf-8")
              print(
                  "Wrote index.html with",
                  len(release["candidate_overrides"]),
                  "approved Position Lineage V1 PROD_MULT changes.",
              )

          if __name__ == "__main__":
              main()
          PY
          chmod +x scripts/model/apply_idp_position_lineage_v1_release.py

