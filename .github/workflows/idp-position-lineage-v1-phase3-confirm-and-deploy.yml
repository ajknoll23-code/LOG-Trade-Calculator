          sha256sum -c "${RUNNER_TEMP}/phase3-live-inputs.sha256"

          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "model/releases/idp-position-lineage-v1/release.json",
              "scripts/model/apply_idp_position_lineage_v1_release.py",
              "scripts/validation/validate_idp_v1_final_deployment.py",
