name: A-FA08R1 - IDP Weekly Trend Radar (Public Evidence Only)

# Installs an isolated public Sleeper weekly usage module inside Early Opportunity Watch.
# No paid/subscriber reports, private research files, scoring/FV/MV/TU edits, or automated predictions.
# Distinct from historical FA08R1.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates; Apply commits only public radar UI and its installer"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  idp-weekly-radar:
    name: IDP Weekly Radar (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify clean checkout and prior deployed IDP modules
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -s data/idp_weekly_2026_public.json
          test -s data/free_agents.json
          test -s data/league_rosters.json
          test -s assets/idp_early_v1.js
          test -s assets/idp_early_v1.css
          test -s scripts/utilities/install_idp_dashboard_v1.py
          test -s free-agent-board.html
