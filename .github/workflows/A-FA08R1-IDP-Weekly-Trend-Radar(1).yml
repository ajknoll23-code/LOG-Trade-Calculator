      - name: Validate public source and install isolated dashboard addition
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/idp_weekly_radar_v1.js
          python3 - <<'PYCODE'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/utilities/install_idp_weekly_radar_v1.py').read_text())
          print('PASS Python installer parse')
          PYCODE
          python3 scripts/utilities/install_idp_weekly_radar_v1.py
          git diff --check
      - name: Enforce no private or valuation file writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import subprocess
          allowed={
              'free-agent-board.html',
              'assets/idp_weekly_radar_v1.js',
              'assets/idp_weekly_radar_v1.css',
              'scripts/utilities/install_idp_weekly_radar_v1.py',
          }
          rows=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          changed={line[3:] for line in rows}
          assert changed <= allowed, 'Unexpected changed paths: '+str(changed-allowed)
          assert not changed or {'free-agent-board.html','assets/idp_weekly_radar_v1.js','assets/idp_weekly_radar_v1.css','scripts/utilities/install_idp_weekly_radar_v1.py'} <= changed, 'Partial install / missing module source'
          b=open('free-agent-board.html',encoding='utf-8').read()
          assert b.count('IDP_WEEKLY_PUBLIC_V1_PANEL_START')==1 and b.count('idptPanel')>=1
          assert b.count('id="idpeFile"')==1 and b.count('id="idpeProjectionFile"')==1
          assert b.count('id="idpoPanel"')==1 and b.count('id="idpiPanel"')==1
          print('PASS exactly allowed files changed:',sorted(changed))
          PYCODE
      - name: Apply public UI only (no subscriber data, no scoring changes)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- free-agent-board.html assets/idp_weekly_radar_v1.js assets/idp_weekly_radar_v1.css scripts/utilities/install_idp_weekly_radar_v1.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No public UI changes needed"
          else
            git commit -m "A-FA08R1 Add isolated public weekly IDP trend radar"
            git push origin HEAD:main
          fi
