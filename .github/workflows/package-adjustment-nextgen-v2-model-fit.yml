name: Package Adjustment NextGen V2 Model Fit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact frozen numeric environment
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            "numpy==2.5.3" \
            "scipy==1.18.1" \
            "requests"

      - name: Guard frozen research boundary
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-nextgen-v2"
          test -z "$(git status --porcelain=v1)"

          # Frozen Git object identities.
          test "$(git hash-object "$D/catalog_freeze_manifest.json")" = "9f3076edcff3d4f326474da7890f85c6b2113792"
          test "$(git hash-object "$D/package_vote_challenges_nextgen_v2.json")" = "d93fee6230c0d5a984aa868ddf658cad7742261d"
          test "$(git hash-object "$D/evidence_maturity_plan.json")" = "e850bcd880f9930a5e7c8e3b4092deecf2afd7e2"
          test "$(git hash-object "$D/evidence_maturity_plan_manifest.json")" = "59b198decae348c9821e67eb42911adad0e87e77"
          test "$(git hash-object "$D/fit_package_adjustment_nextgen_v2.py")" = "1bb4912cf94621bb216a9330caaf6ae00204144a"
          test "$(git hash-object "$D/model_fit_preregistration.json")" = "11839895bc255721365c7133792a4b806d825d45"
          test "$(git hash-object "$D/model_fit_preregistration_manifest.json")" = "67f1ca3d56555cabe21ed4d12e5b81cbd5d1e23d"
          test "$(git hash-object "$D/voting_sampling_correction_manifest.json")" = "8c181ec2dbcfb4b259de7e839247780e67539b09"

          # Corrected sampling activation must remain in ancestry.
          git merge-base --is-ancestor 8edba8a6f4e612fa20995a8c62c4be619907abe1 HEAD

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          cfg = json.loads((d / "model_fit_preregistration.json").read_text())
          manifest = json.loads((d / "model_fit_preregistration_manifest.json").read_text())
          maturity = json.loads((d / "evidence_maturity_plan.json").read_text())
          correction = json.loads((d / "voting_sampling_correction_manifest.json").read_text())
          catalog = json.loads((d / "package_vote_challenges_nextgen_v2.json").read_text())

          assert cfg["status"] == "frozen_model_fit_preregistration"
          assert cfg["frozen"] is True
          assert cfg["research_only"] is True
          assert cfg["production_change_authorized"] is False
          assert cfg["automatic_production_change_allowed"] is False

          assert manifest["status"] == "frozen_model_fit_preregistration_manifest"
          assert manifest["frozen"] is True
          assert manifest["artifacts"]["fitter"]["sha256"] == sha(d / "fit_package_adjustment_nextgen_v2.py")
          assert manifest["artifacts"]["config"]["sha256"] == sha(d / "model_fit_preregistration.json")

          assert correction["valid_ballot_start_utc"] == "2026-09-11T15:22:18.334044+00:00"
          assert correction["outcome_blind_audit"]["pre_correction_transport_rows_observed_at_patch_time"] == 0
          assert correction["sampling"]["voter_roster_filtering_allowed"] is False
          assert abs(correction["sampling"]["cell_probability"] - 1/24) < 1e-15

          gate = cfg["maturity_gate"]
          assert gate["minimum_valid_effective_votes"] == 800.0
          assert gate["minimum_distinct_voters"] == 40
          assert gate["minimum_valid_effective_votes_per_cell"] == 15.0
          assert gate["minimum_distinct_voters_per_cell"] == 10
          assert gate["required_cell_count"] == 24

          assert cfg["bootstrap"]["valid_draws"] == 500
          assert cfg["bootstrap"]["seed"] == 20260911
          assert cfg["model_selection"]["minimum_absolute_combined_holdout_log_loss_improvement"] == 0.005
          assert cfg["model_selection"]["maximum_absolute_regression_per_structural_holdout_split"] == 0.005
          assert cfg["model_selection"]["minimum_bootstrap_favorable_fraction"] == 0.8

          assert maturity["status"] == "preregistered_before_nextgen_voting"
          assert catalog["status"] == "frozen_package_adjustment_nextgen_v2"
          assert catalog["frozen"] is True
          assert len(catalog["challenges"]) == 129

          print("PASS: frozen NextGen V2 model-fit boundary confirmed.")
          PY

      - name: Verify production remains unchanged before fit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Run frozen fitter self-test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py \
            --selftest

      - name: Build exact 800-vote frozen ballot payload
        shell: bash
        run: |
          set -euo pipefail

          OUT="/tmp/pkgnv2-model-fit"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          ROOT = Path.cwd()
          D = ROOT / "research/package-adjustment-nextgen-v2"
          OUT = Path("/tmp/pkgnv2-model-fit")

          SOURCE_URL = (
              "https://docs.google.com/spreadsheets/d/e/"
              "2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/"
              "pub?gid=458294959&single=true&output=csv"
          )

          VOTE_PREFIX = "__" + "pkg" + "nv2__|"
          META_PREFIX = "__" + "pkg" + "nv2_meta__|"
          SCHEMA_MARKER = "__" + "pkg" + "nv2_schema__|" + "1"

          EXPECTED_CANONICAL_BALLOT_SHA256 = (
              "6377c7e800c713df4e1445bd2fd0dbb45430b9855a9935df16f3d9e2d9b5fa72"
          )
          EXPECTED_RAW_PREFIX_ROWS = 800
          EXPECTED_VALID_BALLOTS = 800
          EXPECTED_DISTINCT_VOTERS = 40

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def parse_utc(value):
              s = str(value or "").strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
              except ValueError:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)

          correction = read_json(D / "voting_sampling_correction_manifest.json")
          cfg = read_json(D / "model_fit_preregistration.json")
          catalog_doc = read_json(D / "package_vote_challenges_nextgen_v2.json")

          cutoff = parse_utc(correction["valid_ballot_start_utc"])
          assert cutoff is not None
          catalog = {c["id"]: c for c in catalog_doc["challenges"]}
          assert len(catalog) == 129

          daily_cap = int(cfg["voter_protections"]["daily_valid_nextgen_vote_cap"])
          lifetime_cap = float(
              cfg["voter_protections"]["primary_evidence_effective_lifetime_cap"]
          )
          assert daily_cap == 20
          assert lifetime_cap == 20.0

          response = requests.get(SOURCE_URL, timeout=30)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text)))

          candidates = []
          excluded = Counter()
          raw_prefix_rows = 0
          now = datetime.now(timezone.utc)

          for source_index, row in enumerate(rows):
              keep = str(row.get("keep") or "")
              if not keep.startswith(VOTE_PREFIX):
                  continue

              raw_prefix_rows += 1

              ts = parse_utc(row.get("timestamp"))
              if ts is None:
                  excluded["invalid_timestamp"] += 1
                  continue
              if ts <= cutoff:
                  excluded["at_or_before_corrected_cutoff"] += 1
                  continue
              if ts > now:
                  excluded["future_timestamp"] += 1
                  continue

              parts = keep.split("|")
              if len(parts) != 3 or parts[0] != VOTE_PREFIX[:-1]:
                  excluded["malformed_keep_transport"] += 1
                  continue

              challenge_id = parts[1].strip()
              choice_side = parts[2].strip().upper()
              if choice_side not in {"A", "B"}:
                  excluded["invalid_choice_token"] += 1
                  continue

              meta = str(row.get("trade") or "")
              if not meta.startswith(META_PREFIX):
                  excluded["missing_or_invalid_meta_prefix"] += 1
                  continue

              displayed_left = meta[len(META_PREFIX):].strip().upper()
              if displayed_left not in {"A", "B"}:
                  excluded["invalid_display_side"] += 1
                  continue

              if str(row.get("cut") or "") != SCHEMA_MARKER:
                  excluded["invalid_schema_marker"] += 1
                  continue

              voter_id = str(row.get("voter_roster_id") or "").strip()
              if not voter_id:
                  excluded["missing_voter_id"] += 1
                  continue

              if challenge_id not in catalog:
                  excluded["unknown_challenge_id"] += 1
                  continue

              candidates.append(
                  {
                      "timestamp": ts,
                      "timestamp_iso": ts.isoformat(),
                      "voter_id": voter_id,
                      "challenge_id": challenge_id,
                      "choice_side": choice_side,
                      "displayed_left_side": displayed_left,
                      "source_index": source_index,
                  }
              )

          candidates.sort(
              key=lambda r: (
                  r["timestamp"],
                  r["voter_id"],
                  r["challenge_id"],
                  r["choice_side"],
                  r["displayed_left_side"],
                  r["source_index"],
              )
          )

          daily_counts = Counter()
          valid = []
          for r in candidates:
              key = (r["voter_id"], r["timestamp"].date().isoformat())
              if daily_counts[key] >= daily_cap:
                  excluded["daily_cap_dropped"] += 1
                  continue
              daily_counts[key] += 1
              valid.append(r)

          # Reproduce the exact outcome-blind monitor fingerprint.
          canonical_rows = [
              {
                  "timestamp": r["timestamp_iso"],
                  "voter_id": r["voter_id"],
                  "challenge_id": r["challenge_id"],
                  "choice_side": r["choice_side"],
                  "displayed_left_side": r["displayed_left_side"],
              }
              for r in valid
          ]
          canonical_payload = json.dumps(
              canonical_rows,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          canonical_sha = hashlib.sha256(canonical_payload).hexdigest()

          # Lock fitting to the exact preregistered 800-vote checkpoint.
          if raw_prefix_rows != EXPECTED_RAW_PREFIX_ROWS:
              raise RuntimeError(
                  f"REFUSE FIT: expected exactly {EXPECTED_RAW_PREFIX_ROWS} NextGen rows, "
                  f"found {raw_prefix_rows}. Evidence changed after the frozen checkpoint."
              )
          if len(valid) != EXPECTED_VALID_BALLOTS:
              raise RuntimeError(
                  f"REFUSE FIT: expected exactly {EXPECTED_VALID_BALLOTS} valid ballots, "
                  f"found {len(valid)}."
              )
          if len({r['voter_id'] for r in valid}) != EXPECTED_DISTINCT_VOTERS:
              raise RuntimeError(
                  f"REFUSE FIT: expected exactly {EXPECTED_DISTINCT_VOTERS} voters."
              )
          if excluded:
              raise RuntimeError(
                  f"REFUSE FIT: unexpected ballot exclusions at frozen checkpoint: "
                  f"{dict(sorted(excluded.items()))}"
              )
          if canonical_sha != EXPECTED_CANONICAL_BALLOT_SHA256:
              raise RuntimeError(
                  "REFUSE FIT: canonical ballot fingerprint differs from the green "
                  f"800-vote monitor snapshot: {canonical_sha}"
              )

          # The fitter re-applies the frozen daily/lifetime weighting rules.
          # Keep raw validated ballots here; never persist/upload this private payload.
          ballot_payload = {
              "schema_version": 1,
              "released_at_utc": correction["valid_ballot_start_utc"],
              "catalog_payload_sha256": cfg["anchors"][
                  "canonical_challenge_payload_sha256"
              ],
              "maturity_plan_sha256": cfg["anchors"]["maturity_plan_sha256"],
              "ballots": canonical_rows,
          }

          private_path = OUT / "private-ballots.json"
          private_path.write_text(
              json.dumps(ballot_payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          checkpoint = {
              "schema_version": 1,
              "status": "exact_800_vote_checkpoint_locked",
              "raw_nextgen_prefix_rows": raw_prefix_rows,
              "valid_ballots": len(valid),
              "distinct_voters": len({r["voter_id"] for r in valid}),
              "canonical_ballot_sha256": canonical_sha,
              "private_ballot_payload_persisted": False,
              "production_change_authorized": False,
          }
          (OUT / "checkpoint-lock.json").write_text(
              json.dumps(checkpoint, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              "PASS: exact 800-vote / 40-voter checkpoint locked to "
              + canonical_sha
          )
          PY

      - name: Execute frozen research-only model fit
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 \
            python3 research/package-adjustment-nextgen-v2/fit_package_adjustment_nextgen_v2.py \
            --ballots /tmp/pkgnv2-model-fit/private-ballots.json \
            --output /tmp/pkgnv2-model-fit/model-fit-results.json

      - name: Validate model-fit result and build public summary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          out = Path("/tmp/pkgnv2-model-fit")
          result = json.loads((out / "model-fit-results.json").read_text())
          lock = json.loads((out / "checkpoint-lock.json").read_text())

          assert result["research_only"] is True
          assert result["production_change_authorized"] is False
          assert result["automatic_production_change_allowed"] is False
          assert result["maturity"]["mature"] is True
          assert result["maturity"]["valid_effective_votes"] == 800.0
          assert result["maturity"]["distinct_voters"] == 40
          assert all(result["maturity"]["conditions"].values())
          assert result["fit_performed"] is True
          assert result["status"] in {
              "fit_complete_research_only",
              "model_fit_unresolved",
          }

          # No raw ballots or voter IDs may be present in public results.
          forbidden = {
              "voter_id",
              "voter_roster_id",
              "ballots",
              "choice_side",
              "displayed_left_side",
          }

          def walk(value):
              if isinstance(value, dict):
                  for k, v in value.items():
                      if k in forbidden:
                          raise AssertionError(f"private field leaked to public result: {k}")
                      walk(v)
              elif isinstance(value, list):
                  for x in value:
                      walk(x)

          walk(result)

          lines = [
              "# Package Adjustment NextGen V2 — Frozen Model Fit",
              "",
              f"**Status:** `{result['status']}`",
              "",
              "## Frozen evidence checkpoint",
              "",
              f"- Effective votes: **{result['maturity']['valid_effective_votes']:.0f}**",
              f"- Distinct voters: **{result['maturity']['distinct_voters']}**",
              f"- Canonical ballot SHA-256: `{lock['canonical_ballot_sha256']}`",
              "- Exact checkpoint locked: **800 votes / 40 voters**",
              "",
              "## Research safety",
              "",
              "- Research only: **true**",
              "- Production change authorized: **false**",
              "- Automatic production promotion: **false**",
              "- Raw ballots/voter IDs persisted: **false**",
              "",
          ]

          if result["status"] == "fit_complete_research_only":
              point = result["point_estimates"]
              boot = result["bootstrap"]
              sel = result["selection"]

              lines += [
                  "## Point estimates",
                  "",
                  "| Model | Combined holdout log loss | Scale holdout | Topology holdout | Eligible |",
                  "|---|---:|---:|---:|:---:|",
              ]
              for model in ("M0", "M1", "M2a", "M2b"):
                  row = point[model]
                  lines.append(
                      f"| {model} | {row['combined_holdout_log_loss']:.6f} | "
                      f"{row['scale_holdout_log_loss']:.6f} | "
                      f"{row['topology_holdout_log_loss']:.6f} | "
                      f"{'yes' if row['eligible'] else 'no'} |"
                  )

              lines += [
                  "",
                  "## Preregistered bootstrap",
                  "",
                  f"- Status: `{boot['status']}`",
                  f"- Valid voter-cluster draws: **{boot.get('valid_draws', 0)} / {boot.get('target_valid_draws', 500)}**",
              ]

              if boot.get("status") == "complete":
                  ff = boot["favorable_fraction"]
                  lines += [
                      f"- M2a favorable vs M0: **{ff['M2a_vs_M0']:.3f}**",
                      f"- M2b favorable vs M0: **{ff['M2b_vs_M0']:.3f}**",
                      f"- M2b favorable vs M2a: **{ff['M2b_vs_M2a']:.3f}**",
                  ]

              lines += [
                  "",
                  "## Frozen selection rule",
                  "",
                  f"- Selection status: `{sel['status']}`",
                  f"- Research candidate: **{sel.get('selected_model')}**",
                  "- Production promotion authorized: **false**",
                  "",
              ]

              m2a_fit = point["M2a"]["fit"]
              if m2a_fit.get("success"):
                  lines += [
                      "## M2a fitted parameter",
                      "",
                      f"- p: **{m2a_fit['x'][0]:.8f}**",
                      "",
                  ]

              cv = result["M2b_cross_validation"]
              if cv.get("success"):
                  lines += [
                      "## M2b regularization",
                      "",
                      f"- Selected lambda: **{cv['selected_lambda']}**",
                      "",
                  ]

          else:
              lines += [
                  "## Resolution",
                  "",
                  "The frozen fitter ran, but the preregistered analysis returned "
                  "`model_fit_unresolved`. No model is selected and no production "
                  "change is authorized.",
                  "",
              ]

          (out / "model-fit-summary.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("PASS: public model-fit result validated.")
          PY

      - name: Run full repository regressions after fit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains unchanged after fit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove workflow wrote nothing to repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo "PASS: model-fit workflow wrote nothing to repository."

      - name: Remove private ballot payload before artifact upload
        if: always()
        shell: bash
        run: |
          rm -f /tmp/pkgnv2-model-fit/private-ballots.json

      - name: Upload research-only model-fit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-nextgen-v2-model-fit
          path: |
            /tmp/pkgnv2-model-fit/checkpoint-lock.json
            /tmp/pkgnv2-model-fit/model-fit-results.json
            /tmp/pkgnv2-model-fit/model-fit-summary.md
          if-no-files-found: error
          retention-days: 30
