# PREFLIGHTED: B23_2027_SOURCE_COMPARABILITY_FEASIBILITY_EXECUTION
name: B23 Draft Capital Outlook V1 - 2027 Source Comparability Feasibility Execution

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  b23_2027_source_comparability_feasibility:
    name: Execute frozen 2027 source comparability feasibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install repository regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Guard exact B21 PASS and B22 frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          B21=D/"b21"
          B22=D/"b22"
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          p21=B21/"b21_historical_calibration.json"
          m21=B21/"b21_manifest.json"
          p22=B22/"b22_2027_source_comparability_preregistration.json"
          m22=B22/"b22_manifest.json"
          for p in (p21,m21,p22,m22):
              assert p.is_file(), p

          assert sha(p21)=="97e9b0615e27e0bfdfccbab8b2c58e98bc214523b5e4ad04252d881c5e291dbf"
          assert sha(p22)=="1e3713482550ab1e6213f7eac9e7fe56f36c7433735be0ff88dde85bd45bc000"

          a=json.loads(p21.read_text())
          am=json.loads(m21.read_text())
          b=json.loads(p22.read_text())
          bm=json.loads(m22.read_text())

          assert a["decision"]=="PASS_LAYER_D_HISTORICAL_CALIBRATION_AUTHORIZE_SEPARATE_2027_SHADOW_SOURCE_AND_SCORING_PREREGISTRATION_ONLY"
          assert a["joint_pass"] is True
          assert a["2027_class_scored"] is False
          assert a["2027_source_content_read"] is False
          assert a["production_change_authorized"] is False
          assert am["b21_executed"] is True
          assert am["b21_execution_count_committed"]==1

          assert b["decision"]=="PREREGISTER_2027_SOURCE_COMPARABILITY_AUTHORIZE_B23_FEASIBILITY_ONLY_NO_SCORING"
          assert b["candidate_pool"]["candidate_count"]==3
          assert b["candidate_pool"]["big_boards_excluded_from_primary_2027_predictor"] is True
          assert b["candidate_pool"]["new_network_retrieval_allowed"] is False
          assert b["candidate_pool"]["post_b15_source_addition_allowed"] is False
          assert b["b23_parser_and_feasibility_rules"]["2027_capital_scalar_may_be_computed"] is False
          assert b["b23_parser_and_feasibility_rules"]["2027_shadow_multiplier_may_be_computed"] is False
          assert b["historical_predictor_contract"]["minimum_unique_slots_through_60"]==58
          assert b["historical_predictor_contract"]["must_reach_slot_60"] is True
          assert bm["b23_source_comparability_feasibility_authorized"] is True
          assert bm["2027_class_scored"] is False
          assert bm["production_change_authorized"] is False

          assert not (D/"b23").exists(), "B23 already committed; frozen feasibility execution is one-shot"
          print("PASS: B21 authority and B22 frozen source-comparability protocol verified.")
          PY

      - name: Guard exact B15 archived candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          P=json.loads((D/"b22/b22_2027_source_comparability_preregistration.json").read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected_ids=[
            "ultimate_mock_consensus_2027",
            "cbs_mock_hub_2027",
            "si_mock_2_0_2027",
          ]
          got=[]
          for c in P["candidate_pool"]["candidates"]:
              got.append(c["source_id"])
              raw=Path(c["raw_path"])
              parsed=Path(c["b15_parsed_path"])
              assert raw.is_file(), raw
              assert parsed.is_file(), parsed
              assert sha(raw)==c["raw_sha256"], (c["source_id"],"raw")
              assert sha(parsed)==c["b15_parsed_sha256"], (c["source_id"],"parsed")
          assert got==expected_ids, got
          print("PASS: exact three frozen B15 candidate raw/parsed artifacts verified.")
          PY

      - name: Run repository regression baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute frozen B23 source feasibility only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/draft-capital-outlook-v1/b23
          python3 - <<'PY'
          import hashlib,html,json,re
          from html.parser import HTMLParser
          from pathlib import Path

          D=Path("research/draft-capital-outlook-v1")
          O=D/"b23"
          P=json.loads((D/"b22/b22_2027_source_comparability_preregistration.json").read_text())
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          POSITION_CANON={
            "QB":"QB","RB":"RB","FB":"FB","WR":"WR","TE":"TE",
            "OT":"OT","T":"OT","OG":"OG","G":"OG","C":"C","IOL":"IOL",
            "EDGE":"EDGE","DE":"DE","DT":"DT","DL":"DL","LB":"LB",
            "CB":"CB","S":"S","DB":"DB","K":"K","P":"P",
          }
          BLOCK_TAGS={"p","div","li","article","section","h1","h2","h3","h4","tr","td","th","br","a"}

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts=[]
                  self.hidden=0
              def handle_starttag(self,tag,attrs):
                  if tag in {"script","style","noscript"}: self.hidden+=1
                  elif self.hidden==0 and tag in BLOCK_TAGS: self.parts.append("\n")
              def handle_endtag(self,tag):
                  if tag in {"script","style","noscript"} and self.hidden:
                      self.hidden-=1
                  elif self.hidden==0 and tag in BLOCK_TAGS: self.parts.append("\n")
              def handle_data(self,data):
                  if self.hidden==0: self.parts.append(data)
              def text(self):
                  s="".join(self.parts).replace("\xa0"," ")
                  s=re.sub(r"[ \t\r\f\v]+"," ",s)
                  s=re.sub(r"\n{2,}","\n",s)
                  return s

          def clean_name(s):
              s=html.unescape(re.sub(r"<[^>]+>"," ",s))
              return re.sub(r"\s+"," ",s).strip(" -–—:|\t\n")

          def add(rows,pick,name,pos,origin):
              try: pick=int(str(pick).lstrip("0") or "0")
              except Exception: return
              pos=str(pos).strip().upper().replace("DEFENSIVE LINE","DL")
              pos=POSITION_CANON.get(pos,pos)
              name=clean_name(str(name))
              if not (1<=pick<=60 and name and re.fullmatch(r"[A-Z]{1,5}",pos or "")):
                  return
              rows.append({"pick":pick,"player":name,"position":pos,"origin":origin})

          def parse_ultimate(raw):
              rows=[]
              blocks=re.findall(r'<a\s+class="[^"]*consensus-row[^"]*".*?</a>',raw,re.I|re.S)
              for b in blocks:
                  pm=re.search(r'class="pick-number".*?<b>\s*(\d{1,2})\s*</b>',b,re.I|re.S)
                  xm=re.search(r'data-position="([A-Za-z]{1,8})"',b,re.I)
                  nm=re.search(r'class="player-cell".*?<strong>(.*?)</strong>',b,re.I|re.S)
                  if pm and xm and nm: add(rows,pm.group(1),nm.group(1),xm.group(1),"ultimate_consensus_row")
              return rows

          def parse_visible_numbered(raw,source_id):
              p=VisibleText(); p.feed(raw); text=p.text()
              rows=[]
              # Canonical article form: 1. Team (...): Player, POS, School
              pat1=re.compile(r'(?m)(?:^|\n)\s*(\d{1,2})\.\s+[^:\n]{1,180}:\s*([^,\n]{2,100}),\s*([A-Z]{1,5})(?:\s*,|\s+·|\b)')
              for m in pat1.finditer(text): add(rows,*m.groups(),f"{source_id}:visible_colon")
              # Common mock table form: 1 Team Player POS School, requiring line-bounded explicit number and POS.
              pat2=re.compile(r'(?m)(?:^|\n)\s*(\d{1,2})\s+(?:[A-Z][A-Za-z.&\'’ -]{1,60}\s+){0,2}([A-Z][A-Za-z.\'’ -]{2,70})\s+(QB|RB|FB|WR|TE|OT|OG|IOL|EDGE|DE|DT|DL|LB|CB|S)\b')
              for m in pat2.finditer(text): add(rows,*m.groups(),f"{source_id}:visible_table")
              return rows

          def json_scripts(raw):
              for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',raw,re.I|re.S):
                  if re.search(r'type=["\']application/(?:ld\+json|json)["\']',attrs,re.I):
                      body=html.unescape(body).strip()
                      if not body: continue
                      try: yield json.loads(body)
                      except Exception: continue

          PICK_KEYS=("pick","picknumber","pick_number","overallpick","overall_pick","overall","selection","selectionnumber","selection_number")
          NAME_KEYS=("playername","player_name","player","prospectname","prospect_name","name")
          POS_KEYS=("position","pos","playerposition","player_position")

          def first_key(d,keys):
              norm={re.sub(r"[^a-z0-9_]","",str(k).lower()):v for k,v in d.items()}
              for k in keys:
                  if k in norm:return norm[k]
              return None

          def parse_structured(raw,source_id):
              rows=[]
              def walk(x):
                  if isinstance(x,dict):
                      pk=first_key(x,PICK_KEYS); nm=first_key(x,NAME_KEYS); ps=first_key(x,POS_KEYS)
                      if isinstance(nm,dict): nm=first_key(nm,NAME_KEYS)
                      if isinstance(ps,dict): ps=first_key(ps,POS_KEYS)
                      if pk is not None and nm is not None and ps is not None:
                          add(rows,pk,nm,ps,f"{source_id}:embedded_json")
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              for obj in json_scripts(raw): walk(obj)
              return rows

          def dedupe_and_audit(rows):
              by_pick={}
              duplicate_conflicts=[]
              for r in rows:
                  p=r["pick"]
                  sig=(r["player"].casefold(),r["position"])
                  if p not in by_pick:
                      by_pick[p]=r
                  else:
                      old=by_pick[p]
                      oldsig=(old["player"].casefold(),old["position"])
                      if sig!=oldsig:
                          duplicate_conflicts.append({"pick":p,"first":old,"second":r})
              ordered=[by_pick[p] for p in sorted(by_pick)]
              return ordered,duplicate_conflicts

          candidate_results=[]
          for c in P["candidate_pool"]["candidates"]:
              sid=c["source_id"]
              rp=Path(c["raw_path"])
              raw=rp.read_text(errors="replace")
              assert sha(rp)==c["raw_sha256"]
              extracted=[]
              if sid=="ultimate_mock_consensus_2027":
                  extracted.extend(parse_ultimate(raw))
              extracted.extend(parse_visible_numbered(raw,sid))
              extracted.extend(parse_structured(raw,sid))
              rows,conflicts=dedupe_and_audit(extracted)
              slots=[r["pick"] for r in rows]
              unique_slots=len(slots)
              has_60=60 in slots
              duplicate_pick_fatal=bool(conflicts)
              fantasy_ambiguous=[]
              # Extracted rows must carry explicit position; non-fantasy rows are retained with zero future weight.
              for r in rows:
                  if not r["position"]:
                      fantasy_ambiguous.append(r)
              feasible=(not duplicate_pick_fatal and not fantasy_ambiguous and unique_slots>=58 and has_60)
              candidate_results.append({
                "source_id":sid,
                "source_name":c["source_name"],
                "source_kind":c["source_kind"],
                "publication_anchor_date":c["publication_anchor_date"],
                "distance_from_september_30_days":c["distance_from_september_30_days"],
                "raw_path":c["raw_path"],
                "raw_sha256":c["raw_sha256"],
                "explicit_rows":rows,
                "explicit_unique_slot_count_1_60":unique_slots,
                "minimum_required":58,
                "maximum_explicit_slot":max(slots) if slots else None,
                "explicit_slot_60_present":has_60,
                "duplicate_pick_conflicts":conflicts,
                "duplicate_pick_number_fatal":duplicate_pick_fatal,
                "ambiguous_position_rows":fantasy_ambiguous,
                "feasible":feasible,
              })

          feasible=[r for r in candidate_results if r["feasible"]]
          selected=None
          if feasible:
              def key(r):
                  kind_rank=0 if r["source_kind"]=="single_mock_draft" else 1
                  return (kind_rank,r["distance_from_september_30_days"],r["source_id"])
              selected=sorted(feasible,key=key)[0]

          decision=(
            P["b23_decisions"]["one_or_more_feasible"] if selected
            else P["b23_decisions"]["none_feasible"]
          )
          result={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b23_2027_source_comparability_feasibility_execution",
            "decision":decision,
            "candidate_count":3,
            "feasible_source_count":len(feasible),
            "selected_source_id":selected["source_id"] if selected else None,
            "candidate_results":candidate_results,
            "selection_rule_applied_exactly":True,
            "2027_capital_scalar_computed":False,
            "2027_shadow_multiplier_computed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "new_network_retrieval_performed":False,
            "big_board_rank_used_as_mock_pick":False,
            "missing_pick_numbers_inferred":False,
            "missing_slots_filled":False,
          }
          (O/"b23_source_feasibility.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          report=[
            "# Draft Capital Outlook V1 — B23 2027 Source Comparability Feasibility",
            "",
            f"Decision: **{decision}**",
            "",
          ]
          for r in candidate_results:
              report.append(f"- {r['source_id']}: {r['explicit_unique_slot_count_1_60']} explicit unique slots through 60; slot 60={'YES' if r['explicit_slot_60_present'] else 'NO'}; feasible={'YES' if r['feasible'] else 'NO'}")
          report += [
            "",
            f"Selected comparable source: **{result['selected_source_id'] or 'NONE'}**",
            "",
            "2027 capital scalar computed: **NO**",
            "2027 shadow multiplier computed: **NO**",
            "2027 class scored: **NO**",
            "Production change authorized: **NO**",
            "",
            "A no-feasible-source result is a valid scientific stop and leaves Draft Capital Outlook neutral at 1.00. A feasible-source result authorizes only the separately preregistered B24 one-shot shadow-scoring protocol.",
          ]
          (O/"b23_report.md").write_text("\n".join(report)+"\n")
          print(json.dumps({
            "decision":decision,
            "feasible_source_count":len(feasible),
            "selected_source_id":result["selected_source_id"],
            "candidate_slots":{r["source_id"]:r["explicit_unique_slot_count_1_60"] for r in candidate_results},
          },indent=2))
          PY

      - name: Audit B23 result against frozen B22 rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          D=Path("research/draft-capital-outlook-v1")
          P=json.loads((D/"b22/b22_2027_source_comparability_preregistration.json").read_text())
          R=json.loads((D/"b23/b23_source_feasibility.json").read_text())
          assert R["candidate_count"]==3
          assert len(R["candidate_results"])==3
          assert R["2027_capital_scalar_computed"] is False
          assert R["2027_shadow_multiplier_computed"] is False
          assert R["2027_class_scored"] is False
          assert R["production_change_authorized"] is False
          assert R["new_network_retrieval_performed"] is False
          assert R["big_board_rank_used_as_mock_pick"] is False
          assert R["missing_pick_numbers_inferred"] is False
          assert R["missing_slots_filled"] is False

          for r in R["candidate_results"]:
              slots=[x["pick"] for x in r["explicit_rows"]]
              assert slots==sorted(set(slots))
              assert all(1<=x<=60 for x in slots)
              expected=(
                not r["duplicate_pick_number_fatal"] and
                not r["ambiguous_position_rows"] and
                len(slots)>=58 and
                60 in slots
              )
              assert r["feasible"] is expected
              assert r["explicit_unique_slot_count_1_60"]==len(slots)
              assert r["explicit_slot_60_present"] is (60 in slots)

          feasible=[r for r in R["candidate_results"] if r["feasible"]]
          if feasible:
              def key(r): return (0 if r["source_kind"]=="single_mock_draft" else 1,r["distance_from_september_30_days"],r["source_id"])
              chosen=sorted(feasible,key=key)[0]["source_id"]
              assert R["selected_source_id"]==chosen
              assert R["decision"]==P["b23_decisions"]["one_or_more_feasible"]
          else:
              assert R["selected_source_id"] is None
              assert R["decision"]==P["b23_decisions"]["none_feasible"]
          print("PASS: B23 feasibility result reproduces the frozen B22 decision rule exactly.")
          PY

      - name: Write B23 manifest and immutable hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          D=Path("research/draft-capital-outlook-v1")
          O=D/"b23"
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          r=json.loads((O/"b23_source_feasibility.json").read_text())
          hashes={p.name:sha(p) for p in sorted(O.iterdir()) if p.is_file()}
          manifest={
            "schema_version":1,
            "study_id":"draft-capital-outlook-v1",
            "stage":"b23_manifest",
            "decision":r["decision"],
            "b23_executed":True,
            "b23_execution_count_committed":1,
            "feasible_source_count":r["feasible_source_count"],
            "selected_source_id":r["selected_source_id"],
            "2027_capital_scalar_computed":False,
            "2027_shadow_multiplier_computed":False,
            "2027_class_scored":False,
            "production_change_authorized":False,
            "b24_preregistration_authorized":r["selected_source_id"] is not None,
            "output_hashes":hashes,
          }
          (O/"b23_manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          for p in sorted(O.iterdir()):
              if p.is_file() and p.name!="b23_hashes.sha256":
                  pass
          lines=[]
          for p in sorted(O.iterdir()):
              if p.is_file() and p.name!="b23_hashes.sha256": lines.append(f"{sha(p)}  {p.name}")
          (O/"b23_hashes.sha256").write_text("\n".join(lines)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Guard scientific firewall and repository scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          D=Path("research/draft-capital-outlook-v1")
          R=json.loads((D/"b23/b23_source_feasibility.json").read_text())
          M=json.loads((D/"b23/b23_manifest.json").read_text())
          assert R["2027_capital_scalar_computed"] is False
          assert R["2027_shadow_multiplier_computed"] is False
          assert R["2027_class_scored"] is False
          assert R["production_change_authorized"] is False
          assert M["2027_capital_scalar_computed"] is False
          assert M["2027_shadow_multiplier_computed"] is False
          assert M["2027_class_scored"] is False
          assert M["production_change_authorized"] is False
          status=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True).splitlines()
          for line in status:
              path=line[3:]
              assert path.startswith("research/draft-capital-outlook-v1/b23/"), line
          print("PASS: only B23 research artifacts changed; no scoring or production mutation occurred.")
          PY

      - name: Run repository regression after B23 artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find research/draft-capital-outlook-v1/b23 -maxdepth 1 -type f -print -quit)"
          git stash push --include-untracked -m b23-regression-guard >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/validation/repo_regression_checks.py
          git reset --hard HEAD
          git clean -fd
          git stash pop >/dev/null
          test -n "$(find research/draft-capital-outlook-v1/b23 -maxdepth 1 -type f -print -quit)"
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^?? research/draft-capital-outlook-v1/b23/' || true)"

      - name: Commit B23 frozen feasibility result
        shell: bash
        env:
          START_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$START_SHA" || {
            echo "main moved during B23; refusing to commit stale one-shot result"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/draft-capital-outlook-v1/b23
          git commit -m "B23: execute frozen 2027 source comparability feasibility"
          git push origin HEAD:main

      - name: Final B23 summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/draft-capital-outlook-v1/b23/b23_manifest.json")
          m=json.loads(p.read_text())
          print("B23 COMMITTED")
          print("decision:",m["decision"])
          print("feasible_source_count:",m["feasible_source_count"])
          print("selected_source_id:",m["selected_source_id"])
          print("b24_preregistration_authorized:",m["b24_preregistration_authorized"])
          print("2027_class_scored:",m["2027_class_scored"])
          print("production_change_authorized:",m["production_change_authorized"])
          PY
