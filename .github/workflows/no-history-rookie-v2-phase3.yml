name: No-History Rookie V2 Phase 3 Prospective

# Research-only prospective evaluation of the frozen rookie/prospect-prior family.
# The first successful run freezes the preseason 0/15/30/45% variants.
# Later runs grade those exact frozen predictions against completed 2026 weeks.
#
# This workflow never changes index.html, Market Value, Production V2,
# PROD_MULT_DATA, or any deployed player value.
on:
  workflow_dispatch:
  schedule:
    # Run after the Tuesday 15:00 UTC Scheduled Data Refresh, which refreshes
    # research/model-history/outcomes/2026.json.
    - cron: '30 16 * * 2'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 3 self-test
        run: python3 research/no-history-v2/no_history_v2_phase3_prospective_evaluator.py --selftest

      - name: Freeze preseason candidates if needed and evaluate
        run: python3 research/no-history-v2/no_history_v2_phase3_prospective_evaluator.py --freeze --write

      - name: Verify frozen candidates and prospective outputs
        run: python3 research/no-history-v2/no_history_v2_phase3_prospective_evaluator.py --check

      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/no-history-v2/no_history_v2_phase3_frozen_candidates.json
          git add research/no-history-v2/no_history_v2_phase3_evaluation.json
          git add research/no-history-v2/no_history_v2_phase3_evaluation.md
          git diff --staged --quiet || git commit -m "Update No-History Rookie V2 Phase 3 prospective research"
          git push
