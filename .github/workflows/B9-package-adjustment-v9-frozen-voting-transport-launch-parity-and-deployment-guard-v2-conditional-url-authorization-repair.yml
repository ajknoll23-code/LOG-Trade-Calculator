            /tmp/package-adjustment-v9-b9/b9_output_hashes.json
          retention-days: 90

      - name: Commit exact B9 transport deployment and durable launch freeze
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/package-adjustment-v9/b9-voting-transport-launch-parity"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp /tmp/package-adjustment-v9-b9/b9_deployed_transport_block.js "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_index_patch.diff "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_ktc_reserved_row_isolation_patch.diff "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_preregistered_protocol.json "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_transport_parity_audit.json "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_manifest.json "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_report.md "$DEST/"
          cp /tmp/package-adjustment-v9-b9/b9_output_hashes.json "$DEST/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/market/ktc_pipeline.py "$DEST"
          git diff --cached --quiet && { echo "ERROR: no B9 changes staged"; exit 1; }
          git commit -m "Deploy Package Adjustment V9 frozen B9 voting transport"

          # Fail closed on concurrent main drift. Do not rebase a launch patch onto
          # changed production bytes because the reverse-diff audit is bound to the
          # exact pre-B9 index source.
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || {
            echo "ERROR: main changed during B9; refusing to transplant audited launch patch. Re-run prospectively against new main."
            exit 1
          }
          git push origin HEAD:main

