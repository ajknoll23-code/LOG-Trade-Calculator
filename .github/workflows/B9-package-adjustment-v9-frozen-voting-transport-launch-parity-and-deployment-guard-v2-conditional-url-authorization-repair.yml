        with:
          name: package-adjustment-v9-b9-frozen-voting-transport-launch-parity-v2
          if-no-files-found: warn
          path: |
            /tmp/package-adjustment-v9-b9/b9_deployed_transport_block.js
            /tmp/package-adjustment-v9-b9/b9_index_patch.diff
            /tmp/package-adjustment-v9-b9/b9_ktc_reserved_row_isolation_patch.diff
