name: B9 Package Adjustment V9 - Frozen Voting Transport Launch Parity and Deployment Guard V2 Conditional URL Authorization Repair

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-adjustment-v9-b9-voting-transport-launch
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  B9_ANALYSIS_VERSION: "package-adjustment-v9-b9-frozen-voting-transport-launch-parity-deployment-guard-v2-conditional-url-authorization-repair"
  B8_FREEZE_COMMIT: "2ff1ca2a6ea440f2e1a4c390ae974a9666e9912a"

jobs:
  launch-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Guard exact B8 freeze, production source, and one-shot status
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          DEST="research/package-adjustment-v9/b9-voting-transport-launch-parity"
          test ! -e "$DEST" || {
            echo "ERROR: B9 durable output directory already exists; launch parity is one-shot."
            exit 1
          }

          test "$(git hash-object index.html)" = "f7d10863e27ba7f427c140de9d4faf14a879e5cc" || {
            echo "ERROR: index.html drifted after B8 source freeze."
            exit 1
          }
          test "$(git hash-object scripts/market/ktc_pipeline.py)" = "e6407c76dcea8072f08dbeaf0744ddcc5d7bf1ca" || {
            echo "ERROR: normal KTC pipeline drifted before B9 reserved-row isolation patch."
            exit 1
          }

          python3 - <<'PY1'
          import hashlib,json
          from pathlib import Path

          B8=Path('research/package-adjustment-v9/b8-human-catalog-assignment-freeze')
          expected={
            'b8_catalog_assignment_audit.json':'9d6070feee96730a8619e723f3717975cdb8698c32f7698bb3d2df317e5cb35c',
            'b8_frozen_human_outcome_evaluator.json':'0ae8a1e576631e32af4e7ebfb3b31845ec4cc928d13022118f2c4447245c90a9',
            'b8_human_catalog_full_evaluator.json':'69d7f01e4670e92c2b029e8d2fb7e1e76fb6a33cb5b670d651e9758e5b12bd2e',
            'b8_manifest.json':'1f87c6555480d8345cf6b3238adc892e8e78d35e5ff5f5017380f0b7945ef4ed',
            'b8_output_hashes.json':'c6efd4a025db5d15b1c782463ad6634fcaa9db52bee8d32e3ec72e4b68544895',
            'b8_preregistered_protocol.json':'2f59d39a2b32cf25b9b2ca86d52d40cdeb667e432af972ee1542f37920871a69',
            'b8_report.md':'6818ee1588e7cff3474108d359ba2893f645ff5a3199eab94527335d009d76eb',
            'b8_voter_assignment_schedule.json':'9626fd524d721289fd5494c140d026a085b70dd44ec753c9a24f4838ea59737d',
            'b8_voter_safe_challenges.json':'b00b61840bd4b497258624595760c5c6298a05a0b3f36865b9db87200b1c366d',
            'b8_voting_transport_contract.json':'6f8ae9e91efdbebe1cfe991134f3ea3afe05953e02b73ba64603ad72728d6b17',
          }
          for name,sha in expected.items():
            p=B8/name
            assert p.exists(),name
            got=hashlib.sha256(p.read_bytes()).hexdigest()
            assert got==sha,(name,sha,got)

          m=json.loads((B8/'b8_manifest.json').read_text())
          a=json.loads((B8/'b8_catalog_assignment_audit.json').read_text())
          c=json.loads((B8/'b8_voting_transport_contract.json').read_text())
          s=json.loads((B8/'b8_voter_assignment_schedule.json').read_text())
          v=json.loads((B8/'b8_voter_safe_challenges.json').read_text())

          assert m['status']=='PASS_B8_HUMAN_CATALOG_AND_ASSIGNMENT_FREEZE_COMPLETE'
          assert m['decision']=='PASS_B8_CATALOG_AND_ASSIGNMENT_FREEZE_AUTHORIZE_HUMAN_VOTING_TRANSPORT_DEPLOYMENT'
          assert m['b7_binding_match'] is True
          assert m['human_voting_authorized'] is True
          assert m['voting_transport_activated'] is False
          assert m['production_change_authorized'] is False
          assert m['human_outcomes_exist_or_were_read'] is False
          assert m['catalog_signature_set_sha256']=='dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62'
          assert m['challenge_count']==960 and m['voter_slots']==40 and m['ballots_per_voter']==24

          assert a['status']=='PASS_B8_CATALOG_AND_ASSIGNMENT_AUDIT'
          assert a['binding_match'] is True
          assert a['all_challenges_assigned_once'] is True
          assert a['all_slots_complete_design'] is True
          assert a['position_balance_exact'] is True
          assert a['exact_v8_development_trade_overlap_count']==0
          assert a['joe_mixon_occurrences']==0
          assert a['human_outcomes_read'] is False

          assert c['status']=='FROZEN_B8_VOTING_TRANSPORT_CONTRACT_NOT_YET_DEPLOYED'
          assert c['slot_query_parameter']=='pkgv9slot'
          assert c['slot_url_shape']=='index.html?pkgv9slot=<1..40>#market-research'
          assert c['canonical_side_labels_visible_to_voter'] is False
          assert c['normal_ktc_ratings_consume_v9_rows'] is False
          assert c['session_id_rule'].startswith('random >=128-bit')
          assert c['vote_prefix']=='__pkgv9val__|'
          assert c['meta_prefix']=='__pkgv9val_meta__|'
          assert c['schema_marker']=='__pkgv9val_schema__|1'
          assert c['accepted_complete_voters_exactly']==40 and c['accepted_ballots_exactly']==960

          assert s['status']=='FROZEN_B8_VOTER_ASSIGNMENT_SCHEDULE'
          assert s['seed']==2026100508 and s['accepted_voter_slots']==40 and s['challenges_per_slot']==24
          assert s['total_unique_challenges']==960 and s['votes_per_challenge']==1
          assert len(s['slots'])==40
          assert v['status']=='FROZEN_B8_VOTER_SAFE_CATALOG'
          assert v['challenge_count']==960 and len(v['challenges'])==960
          assert v['fv_visible_to_voter'] is False and v['model_identity_visible_to_voter'] is False

          print('PASS: exact durable B8 freeze, authorization, no-outcome firewall, and source index guarded for B9.')
          PY1

          # Verify the immutable B8 commit itself contains the same three browser-consumed
          # artifacts as the guarded working tree. This makes a wrong commit fail here,
          # rather than waiting for every voter browser to fail closed later.
          for n in b8_voter_safe_challenges.json b8_voter_assignment_schedule.json b8_voting_transport_contract.json; do
            a="$(git show "$B8_FREEZE_COMMIT:research/package-adjustment-v9/b8-human-catalog-assignment-freeze/$n" | sha256sum | cut -d' ' -f1)"
            b="$(sha256sum "research/package-adjustment-v9/b8-human-catalog-assignment-freeze/$n" | cut -d' ' -f1)"
            test "$a" = "$b" || { echo "ERROR: pinned B8 commit content mismatch for $n"; exit 1; }
          done

      - name: Build frozen V9 transport patch and prospective B9 protocol
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/package-adjustment-v9-b9
          mkdir -p /tmp/package-adjustment-v9-b9
          cp index.html /tmp/package-adjustment-v9-b9/index.before.html
          cp scripts/market/ktc_pipeline.py /tmp/package-adjustment-v9-b9/ktc_pipeline.before.py

          cat > /tmp/package-adjustment-v9-b9/build_b9.py <<'PY2'
          from __future__ import annotations
          import hashlib,json,os
          from pathlib import Path

          ROOT=Path('.')
          OUT=Path('/tmp/package-adjustment-v9-b9')
          B8=ROOT/'research/package-adjustment-v9/b8-human-catalog-assignment-freeze'
          VERSION=os.environ['B9_ANALYSIS_VERSION']
          B8_COMMIT=os.environ['B8_FREEZE_COMMIT']

          SAFE_SHA='b00b61840bd4b497258624595760c5c6298a05a0b3f36865b9db87200b1c366d'
          SCHEDULE_SHA='9626fd524d721289fd5494c140d026a085b70dd44ec753c9a24f4838ea59737d'
          CONTRACT_SHA='6f8ae9e91efdbebe1cfe991134f3ea3afe05953e02b73ba64603ad72728d6b17'
          B8_CATALOG_SHA='dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62'

          index=Path('index.html')
          original=index.read_text()
          original_blob=os.popen('git hash-object index.html').read().strip()
          assert original_blob=='f7d10863e27ba7f427c140de9d4faf14a879e5cc',original_blob
          assert 'PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START' not in original

          marker='function renderPackageVote(){\nconst el=document.getElementById(\'packageVoteWrap\');'
          assert original.count(marker)==1,original.count(marker)

          js=r'''/* PACKAGE_ADJUSTMENT_V9_B9_TRANSPORT_START
             B8-frozen V9 human-validation transport. This block is activated ONLY
             when ?pkgv9slot= is present. It loads voter-safe B8 artifacts pinned
             to the durable B8 freeze commit and never loads the hidden evaluator. */
          const PACKAGE_V9_B8_COMMIT = '__B8_COMMIT__';
          const PACKAGE_V9_STUDY_ID = 'package-adjustment-v9-discordant-human-validation';
          const PACKAGE_V9_SAFE_URL = `https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/${PACKAGE_V9_B8_COMMIT}/research/package-adjustment-v9/b8-human-catalog-assignment-freeze/b8_voter_safe_challenges.json`;
          const PACKAGE_V9_SCHEDULE_URL = `https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/${PACKAGE_V9_B8_COMMIT}/research/package-adjustment-v9/b8-human-catalog-assignment-freeze/b8_voter_assignment_schedule.json`;
          const PACKAGE_V9_CONTRACT_URL = `https://raw.githubusercontent.com/ajknoll23-code/LOG-Trade-Calculator/${PACKAGE_V9_B8_COMMIT}/research/package-adjustment-v9/b8-human-catalog-assignment-freeze/b8_voting_transport_contract.json`;
          const PACKAGE_V9_SAFE_SHA256 = '__SAFE_SHA__';
          const PACKAGE_V9_SCHEDULE_SHA256 = '__SCHEDULE_SHA__';
          const PACKAGE_V9_CONTRACT_SHA256 = '__CONTRACT_SHA__';
          const PACKAGE_V9_TOTAL_SLOTS = 40;
          const PACKAGE_V9_BALLOTS_PER_SLOT = 24;
          let PACKAGE_V9_SAFE = null;
          let PACKAGE_V9_SCHEDULE = null;
          let PACKAGE_V9_CONTRACT = null;
          let PACKAGE_V9_STATUS = 'idle';
          let packageV9Current = null;
          let packageV9SubmitInFlight = false;
          let packageV9SubmitError = '';

          function packageV9QueryPresent(){
            return new URLSearchParams(window.location.search).has('pkgv9slot');
          }

          function packageV9AssignedSlot(){
            const raw=new URLSearchParams(window.location.search).get('pkgv9slot');
            if(raw===null || !/^[0-9]+$/.test(raw)) return null;
            const n=Number(raw);
            return Number.isInteger(n) && n>=1 && n<=PACKAGE_V9_TOTAL_SLOTS ? n : null;
          }

          function packageV9SessionKey(slot){ return `pkgv9val_session_${slot}`; }
          function packageV9AttestKey(slot){ return `pkgv9val_attested_${slot}`; }
          function packageV9CompletedKey(slot,session){ return `pkgv9val_completed_${slot}_${session}`; }
          function packageV9PendingKey(slot,session){ return `pkgv9val_pending_${slot}_${session}`; }
          function packageV9AbortedKey(slot,session){ return `pkgv9val_aborted_${slot}_${session}`; }

          function packageV9RandomSessionId(){
            if(!window.crypto || !window.crypto.getRandomValues) throw new Error('secure random unavailable');
            const bytes=new Uint8Array(24); // 192 bits, exceeding frozen >=128-bit requirement.
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
          }

          function packageV9SessionId(slot,create){
            const key=packageV9SessionKey(slot);
            let id=sessionStorage.getItem(key);
            if(!id && create){
              id=packageV9RandomSessionId();
              sessionStorage.setItem(key,id);
            }
            return id || null;
          }

          function packageV9Completed(slot,session){
            try{
              const rows=JSON.parse(sessionStorage.getItem(packageV9CompletedKey(slot,session)) || '[]');
              return Array.isArray(rows) ? Array.from(new Set(rows.map(String))).slice(0,PACKAGE_V9_BALLOTS_PER_SLOT) : [];
            }catch(e){ return []; }
          }

          function packageV9Remember(slot,session,id){
            const rows=packageV9Completed(slot,session);
            if(!rows.includes(String(id))) rows.push(String(id));
            sessionStorage.setItem(packageV9CompletedKey(slot,session),JSON.stringify(rows.slice(0,PACKAGE_V9_BALLOTS_PER_SLOT)));
          }

          async function packageV9Sha256(text){
            if(!window.crypto || !window.crypto.subtle) throw new Error('Web Crypto digest unavailable');
            const buf=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
          }

          function packageV9ForbiddenSafeKeys(obj){
            const forbidden=new Set(['fv','raw_fv','v9_score','v9_favored_side','v1_7_favored_side','trade_signature','candidate_score']);
            const hits=[];
            function walk(x){
              if(Array.isArray(x)){ x.forEach(walk); return; }
              if(!x || typeof x!=='object') return;
              for(const [k,v] of Object.entries(x)){
                if(forbidden.has(String(k))) hits.push(String(k));
                walk(v);
              }
            }
            walk(obj);
            return hits;
          }

          async function packageV9EnsureLoaded(){
            if(PACKAGE_V9_STATUS==='loading' || PACKAGE_V9_STATUS==='ready') return;
            PACKAGE_V9_STATUS='loading';
            try{
              const urls=[PACKAGE_V9_SAFE_URL,PACKAGE_V9_SCHEDULE_URL,PACKAGE_V9_CONTRACT_URL];
              const responses=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));
              responses.forEach(r=>{ if(!r.ok) throw new Error(`frozen B8 artifact HTTP ${r.status}`); });
              const texts=await Promise.all(responses.map(r=>r.text()));
              const hashes=await Promise.all(texts.map(packageV9Sha256));
              if(hashes[0]!==PACKAGE_V9_SAFE_SHA256 || hashes[1]!==PACKAGE_V9_SCHEDULE_SHA256 || hashes[2]!==PACKAGE_V9_CONTRACT_SHA256){
                throw new Error('frozen B8 artifact hash mismatch');
              }
              const safe=JSON.parse(texts[0]);
              const sched=JSON.parse(texts[1]);
              const contract=JSON.parse(texts[2]);
              if(safe.schema_version!==1 || safe.study_id!==PACKAGE_V9_STUDY_ID || safe.status!=='FROZEN_B8_VOTER_SAFE_CATALOG' || safe.challenge_count!==960 || !Array.isArray(safe.challenges) || safe.challenges.length!==960) throw new Error('invalid B8 voter-safe catalog');
              if(safe.fv_visible_to_voter!==false || safe.model_identity_visible_to_voter!==false || packageV9ForbiddenSafeKeys(safe).length) throw new Error('voter-safe leakage guard failed');
              if(sched.schema_version!==1 || sched.study_id!==PACKAGE_V9_STUDY_ID || sched.status!=='FROZEN_B8_VOTER_ASSIGNMENT_SCHEDULE' || sched.seed!==2026100508 || sched.accepted_voter_slots!==40 || sched.challenges_per_slot!==24 || sched.total_unique_challenges!==960) throw new Error('invalid B8 schedule');
              if(contract.schema_version!==1 || contract.study_id!==PACKAGE_V9_STUDY_ID || contract.status!=='FROZEN_B8_VOTING_TRANSPORT_CONTRACT_NOT_YET_DEPLOYED' || contract.slot_query_parameter!=='pkgv9slot' || contract.canonical_side_labels_visible_to_voter!==false || contract.normal_ktc_ratings_consume_v9_rows!==false || contract.vote_prefix!=='__pkgv9val__|' || contract.meta_prefix!=='__pkgv9val_meta__|' || contract.schema_marker!=='__pkgv9val_schema__|1') throw new Error('invalid B8 transport contract');
              const ids=new Set(safe.challenges.map(c=>String(c.id)));
              if(ids.size!==960) throw new Error('duplicate B8 challenge id');
              for(let slot=1;slot<=40;slot++){
                const spec=sched.slots && sched.slots[String(slot)];
                if(!spec || Number(spec.accepted_voter_slot)!==slot || !Array.isArray(spec.challenge_order) || spec.challenge_order.length!==24 || new Set(spec.challenge_order.map(String)).size!==24 || !spec.challenge_order.every(cid=>ids.has(String(cid))) || !spec.display_left_by_challenge) throw new Error(`invalid B8 schedule slot ${slot}`);
                for(const cid of spec.challenge_order){
                  const left=spec.display_left_by_challenge[String(cid)];
                  if(left!=='A' && left!=='B') throw new Error(`invalid B8 display side ${slot}/${cid}`);
                }
              }
              PACKAGE_V9_SAFE=safe;
              PACKAGE_V9_SCHEDULE=sched;
              PACKAGE_V9_CONTRACT=contract;
              PACKAGE_V9_STATUS='ready';
              packageV9Current=null;
            }catch(err){
              console.warn('Package Adjustment V9 validation transport load failed:',err);
              PACKAGE_V9_SAFE=null;
              PACKAGE_V9_SCHEDULE=null;
              PACKAGE_V9_CONTRACT=null;
              PACKAGE_V9_STATUS='failed';
            }
            renderPackageVoteV9();
          }

          function packageV9BeginSession(){
            const slot=packageV9AssignedSlot();
            if(!slot) return;
            try{
              sessionStorage.setItem(packageV9AttestKey(slot),'1');
              const session=packageV9SessionId(slot,true);
              sessionStorage.removeItem(packageV9AbortedKey(slot,session));
              renderPackageVoteV9();
            }catch(e){
              packageV9SubmitError='This browser cannot create a secure research session.';
              renderPackageVoteV9();
            }
          }

          function packageV9SelectChallenge(){
            const slot=packageV9AssignedSlot();
            const session=slot ? packageV9SessionId(slot,false) : null;
            if(!slot || !session || !PACKAGE_V9_SAFE || !PACKAGE_V9_SCHEDULE) return null;
            const spec=PACKAGE_V9_SCHEDULE.slots[String(slot)];
            const completed=new Set(packageV9Completed(slot,session));
            const id=spec.challenge_order.find(cid=>!completed.has(String(cid)));
            if(!id) return null;
            const challenge=PACKAGE_V9_SAFE.challenges.find(c=>String(c.id)===String(id));
            const left=spec.display_left_by_challenge[String(id)];
            const displayOrder=spec.challenge_order.indexOf(String(id));
            if(!challenge || (left!=='A' && left!=='B') || displayOrder<0 || displayOrder>=24) return null;
            return {challenge,left,slot,session,displayOrder};
          }

          function packageV9AssetCard(p){
            const team=p.team ? ` &middot; ${ktcTeamLabel(p.team)}` : '';
            return `<div class="need-cell" style="text-align:left;padding:10px;">
              <div style="font-weight:600;font-size:14px;">${escapeHtml(p.name)}</div>
              <div style="color:var(--text-dim);font-size:11px;">${escapeHtml(p.pos)}${team}</div>
            </div>`;
          }

          function packageV9MarkUnsafeSession(message){
            const slot=packageV9AssignedSlot();
            const session=slot ? packageV9SessionId(slot,false) : null;
            if(slot && session) sessionStorage.setItem(packageV9AbortedKey(slot,session),'1');
            packageV9SubmitError=message;
          }

          async function packageV9Submit(displaySide){
            if(displaySide!=='L' && displaySide!=='R') return;
            if(!packageV9Current || packageV9SubmitInFlight) return;
            const {challenge,left,slot,session,displayOrder}=packageV9Current;
            if(sessionStorage.getItem(packageV9AbortedKey(slot,session))==='1') return;
            const id=String(challenge.id);
            const choice=displaySide==='L' ? left : (left==='A' ? 'B' : 'A');
            const timestamp=new Date().toISOString();
            const vote=`__pkgv9val__|${id}|${choice}|${displaySide}|${session}|${timestamp}`;
            const meta=`__pkgv9val_meta__|${id}|${left}|${slot}|${displayOrder}|${session}`;
            const schema='__pkgv9val_schema__|1';
            const voterRosterId=`__pkgv9val_session__|${slot}|${session}`;
            const pendingKey=packageV9PendingKey(slot,session);
            if(sessionStorage.getItem(pendingKey)){
              packageV9MarkUnsafeSession('This session has an unresolved prior submission and cannot be safely continued. Please assign this same slot to a replacement voter using a fresh browser session.');
              renderPackageVoteV9();
              return;
            }
            packageV9SubmitInFlight=true;
            packageV9SubmitError='';
            sessionStorage.setItem(pendingKey,id);
            renderPackageVoteV9();
            try{
              await fetch(KTC_SUBMIT_URL,{
                method:'POST',
                mode:'no-cors',
                headers:{'Content-Type':'text/plain;charset=utf-8'},
                body:JSON.stringify({voterRosterId,keep:vote,trade:meta,cut:schema})
              });
              packageV9Remember(slot,session,id);
              sessionStorage.removeItem(pendingKey);
              packageV9Current=null;
            }catch(err){
              packageV9MarkUnsafeSession('Vote submission status is uncertain. Do not retry this session. Please assign this same slot to a replacement voter using a fresh browser session.');
            }finally{
              packageV9SubmitInFlight=false;
              renderPackageVoteV9();
            }
          }

          function renderPackageVoteV9(){
            const el=document.getElementById('packageVoteWrap');
            if(!el) return;
            const help=document.querySelector('.vote-help-card.package');
            if(help) help.style.display='none';
            const slot=packageV9AssignedSlot();
            if(!slot){
              el.innerHTML='<div class="vote-access-card"><b style="color:var(--red);">Invalid V9 research link.</b><br>Use a voter-specific URL containing ?pkgv9slot=1 through ?pkgv9slot=40.</div>';
              return;
            }
            const session=packageV9SessionId(slot,false);
            const attested=session && sessionStorage.getItem(packageV9AttestKey(slot))==='1';
            if(!attested){
              el.innerHTML=`<div class="vote-access-card" style="text-align:left;">
                <b style="color:var(--gold);">Package Adjustment V9 Validation</b><br><br>
                This link is assigned to one eligible voter only. Before receiving this voter link, you must not have seen V9 research artifacts, model verdicts, or this study design. Confirm that this was true, that you have not completed any other V9 research slot, and that you will judge every trade on your own dynasty valuation without consulting a trade calculator or value chart.<br><br>
                <button class="tab-btn" style="width:100%;" onclick="packageV9BeginSession()">I Confirm — Begin 24 Trades</button>
              </div>`;
              return;
            }
            if(sessionStorage.getItem(packageV9AbortedKey(slot,session))==='1'){
              el.innerHTML=`<div style="border:1px solid var(--red);border-radius:8px;padding:10px;color:var(--text-muted);font-size:13px;"><b style="color:var(--red);">Session closed for transport safety.</b><br>${escapeHtml(packageV9SubmitError || 'Do not retry this session. Assign the identical slot URL to a replacement voter using a fresh browser session.')}</div>`;
              return;
            }
            const completed=packageV9Completed(slot,session);
            if(completed.length>=24){
              el.innerHTML=`<div style="color:var(--green);font-size:13px;padding:8px 0;">You've completed all 24 research trades for slot ${slot}. Thank you.</div>`;
              return;
            }
            if(PACKAGE_V9_STATUS==='idle'){
              packageV9EnsureLoaded();
              el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen V9 research schedule for slot ${slot}...</div>`;
              return;
            }
            if(PACKAGE_V9_STATUS==='loading'){
              el.innerHTML=`<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Loading frozen V9 research schedule for slot ${slot}...</div>`;
              return;
            }
