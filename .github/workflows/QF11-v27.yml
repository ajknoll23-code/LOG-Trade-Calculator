name: QF11 V27 - Isolated Offline Pilot Development Preview and Owner Architecture Gate (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}
  QF11_V27_V25: /tmp/qf11-v27-input/v25
  QF11_V27_V26: /tmp/qf11-v27-input/v26
  QF11_V27_OUTPUT: /tmp/qf11-v27-output
jobs:
  offline_prototype_review:
    name: Pin V25 and V26 archives; build zero-transport offline review prototype with no participant activation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir requests

        '
    - name: Pin all frozen valuation sources and existing live KTC aggregation path
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo STOP_NON_MAIN; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo STOP_CHECKOUT_SHA; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_DIRTY_CHECKOUT; exit 1; }

        check(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP_PROTECTED_SOURCE_DRIFT: $1"; exit 1; }; }

        check index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        check scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        check scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        check scripts/validation/repo_regression_checks.py 5191e1160c966ed14401b70c86c6f63808e1265d

        check scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        check free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        check model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        # Sleeper cache refreshes independently; record identity source, never auto-clear identity holds.

        [[ -f data/players_cache.json ]] || { echo STOP_CACHE_MISSING; exit 1; }

        printf ''QF11_V27_MUTABLE_CACHE_OBSERVED %s\n'' "$(git hash-object data/players_cache.json)"

        echo QF11_V27_PROTECTED_SOURCE_PINS_GREEN


        [[ "$(git hash-object .github/workflows/ktc-vote-aggregation.yml)" == "a6d08df00abc1760866c98757fd057b644a22264" ]] || { echo STOP_LIVE_KTC_AGGREGATOR_DRIFT; exit 1; }

        echo QF11_V27_LIVE_KTC_AGGREGATOR_PIN_GREEN

        '
    - name: Download exact V25 Green proposed semantic instrument
      uses: actions/download-artifact@v4
      with:
        name: QF11-v25-RESEARCH-ONLY-offline-wording-instrument
        run-id: 38327139981
        github-token: ${{ github.token }}
        path: /tmp/qf11-v27-input/v25
    - name: Download exact V26 Green live transport risk review
      uses: actions/download-artifact@v4
      with:
        name: QF11-v26-RESEARCH-ONLY-transport-isolation-semantic-gate
        run-id: 38328489635
        github-token: ${{ github.token }}
        path: /tmp/qf11-v27-input/v26
    - name: Verify exact V25 V26 archives and build offline-only interactive developer prototype
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/qf11-v27-output\ncat > /tmp/qf11-v27-builder.py <<'QF11_V27_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V27 research-only offline separation\
        \ preview. No participant collection.\"\"\"\nfrom pathlib import Path\nimport os,json,hashlib,html,itertools,re\nV25=Path(os.environ.get('QF11_V27_V25','/mnt/data/qf11-v27-fixture/v25'))\n\
        V26=Path(os.environ.get('QF11_V27_V26','/mnt/data/qf11-v27-fixture/v26'))\nOUT=Path(os.environ.get('QF11_V27_OUTPUT','/mnt/data/qf11-v27-fixture/output'))\nPIN25={'RESEARCH_ONLY_v25_wording_instrument_DRAFT.json':'c62b2b52d73532fdd9b18e73403a4019d78da86c9c62567b9aed3d10647ba996','RESEARCH_ONLY_v25_offline_preview.html':'8df75c9b47f2b80121fbea53da215d1f90635e8d069faaf73dfe105ade7ae8d8'}\n\
        PIN26={'RESEARCH_ONLY_v26_isolation_semantic_gate.json':'aaf27453e64dc40a3ee7d15f3554a4b5aa0c33dc119bbbe4f582659e8a052b7e','RESEARCH_ONLY_v26_owner_transport_decisions.md':'bf795e05e4910b004bbb5f3bbf338499bf5b7746e1ce15718297bcce6a9d0ff1','RESEARCH_ONLY_v26_synthetic_question_checks.json':'0fe8082a6e01a43cff30c2fb580493466f2f844ffefa21231702c5243df8624b'}\n\
        for root, pins in ((V25,PIN25),(V26,PIN26)):\n for name,digest in pins.items():\n  f=root/name\n  assert f.is_file(), f'STOP_ARCHIVE_MISSING_{name}'\n  assert hashlib.sha256(f.read_bytes()).hexdigest()==digest,f'STOP_ARCHIVE_DRIFT_{name}'\n\
        p=json.loads((V25/'RESEARCH_ONLY_v25_wording_instrument_DRAFT.json').read_text())\ng=json.loads((V26/'RESEARCH_ONLY_v26_isolation_semantic_gate.json').read_text())\nassert p['owner_new_wording_approval']\
        \ is False and p['owner_pilot_activation_approved'] is False\nassert g['live_platform_observations']['pilot_safe_transport_proven'] is False\nassert g['live_platform_observations']['normal_ktc_vote_aggregator_rebuilds_market_values']\
        \ is True\nassert g['proposed_semantic_questionnaire']['new_wording_owner_approved'] is False\nassert g['release_controls']['participants_contacted']==0 and g['release_controls']['voter_links_issued']==0\n\
        names=p['candidate_scope']['pilot_trio'];orders=p['six_display_orders'];questions=p['comprehension_questionnaire_draft']\nassert names==['Brock Bowers','Tyler Warren','TreVeyon\
        \ Henderson']\nassert set(map(tuple,orders))==set(itertools.permutations(names))\nassert len(questions)==4 and [q['expected_option_index'] for q in questions[:3]]==[1,1,0]\n\
        # Develop a browser-only review prototype. Not a real survey or actual randomized recruitment.\npayload=json.dumps({'orders':orders,'questions':questions,'instructions':p['same_horizon_wording_draft']},ensure_ascii=True).replace('<','\\\
        \\u003c')\nscript=r'''\"use strict\";\nconst REVIEW_DATA = __PAYLOAD__;\nconst EXPECTED = REVIEW_DATA.questions.slice(0,3).map(q=>q.expected_option_index);\nfunction gradeCritical(answers)\
        \ {\n  if (!Array.isArray(answers) || answers.length !== 3 || answers.some(a=>!Number.isInteger(a))) return 'INCOMPLETE';\n  return answers.some((answer,i)=>answer!==EXPECTED[i])\
        \ ? 'CRITICAL_STOP' : 'MC_PASS_HUMAN_Q4_REVIEW_REQUIRED';\n}\nfunction validateRoles(assignments) {\n  const keys = Object.keys(assignments || {});\n  return keys.length===3\
        \ && keys.every(k=>REVIEW_DATA.orders[0].includes(k)) &&\n    ['KEEP','TRADE','CUT'].every(role=>Object.values(assignments).filter(v=>v===role).length===1);\n}\nconst reviewState\
        \ = {order:0, roles:{}};\nfunction el(id){return document.getElementById(id);}\nfunction escapeText(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"\
        ':'&quot;',\"'\":'&#39;'}[c]));}\nfunction render(){\n  const people=REVIEW_DATA.orders[reviewState.order];\n  el('orderNumber').textContent = String(reviewState.order+1)+' /\
        \ 6';\n  el('intro').textContent = REVIEW_DATA.instructions;\n  el('cards').innerHTML = people.map(name => `<div class=\"player\"><strong>${escapeText(name)}</strong><div class=\"\
        positions\">${['KEEP','TRADE','CUT'].map(role=>`<button type=\"button\" data-person=\"${escapeText(name)}\" data-role=\"${role}\" class=\"${reviewState.roles[name]===role?'chosen':''}\"\
        >${role}</button>`).join('')}</div></div>`).join('');\n  el('cards').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{\n    const target=b.dataset.person,role=b.dataset.role;\n\
        \    Object.keys(reviewState.roles).forEach(n=>{if (reviewState.roles[n]===role) delete reviewState.roles[n]});\n    reviewState.roles[target]=role; render();\n  }));\n  el('questions').innerHTML\
        \ = REVIEW_DATA.questions.map((q,i)=>`<fieldset><legend>${escapeText(q.question)}</legend>${q.options ? `<select id=\"question${i}\"><option value=\"\">Choose an answer</option>${q.options.map((o,k)=>`<option\
        \ value=\"${k}\">${escapeText(o)}</option>`).join('')}</select>`:`<textarea id=\"openComment\" rows=\"2\" aria-label=\"Draft free-response review\"></textarea>`}</fieldset>`).join('');\n\
        \  el('result').textContent='Development preview. Nothing is transmitted, saved, or counted.';\n}\nfunction checkLocal(){\n if(!validateRoles(reviewState.roles)){el('result').textContent='INCOMPLETE:\
        \ assign KEEP, TRADE and CUT once each.';return;}\n const answers=[];\n for(let i=0;i<3;i++){const v=el('question'+i).value;answers.push(v===''?null:Number(v));}\n const status=gradeCritical(answers);\n\
        \ el('result').textContent=status==='CRITICAL_STOP'?'STOP: critical misunderstanding (local simulation only).':status==='INCOMPLETE'?'INCOMPLETE: answer all three questions.':'MC\
        \ checks passed locally. Question 4 needs independent human adjudication. NOT approval to recruit or submit.';\n}\nif (typeof document!=='undefined') {\n document.addEventListener('DOMContentLoaded',()=>{\n\
        \  el('order').addEventListener('change',e=>{reviewState.order=Number(e.target.value);reviewState.roles={};render()});\n  el('check').addEventListener('click',checkLocal);\n\
        \  el('clear').addEventListener('click',()=>{reviewState.roles={};render()});\n  render();\n });\n}\n'''.replace('__PAYLOAD__',payload)\n# Guard code, not textual explanatory\
        \ HTML, for non-use of network/storage in the prototype.\nfor banned in ('fetch(', 'XMLHttpRequest', 'sendBeacon', 'WebSocket', 'localStorage', 'sessionStorage', 'document.cookie',\
        \ 'navigator.clipboard', 'postMessage(', 'indexedDB'):\n assert banned not in script, f'STOP_NETWORK_OR_STORAGE_API_{banned}'\nhtmlpage='''<!doctype html><html lang=\"en\"><head><meta\
        \ charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>QF11 V27 — Isolated developer preview</title><style>\n:root{color-scheme:dark}body{background:#101827;color:#e5e7eb;font:15px\
        \ system-ui,Arial,sans-serif;line-height:1.45;max-width:860px;margin:30px auto;padding:20px}h1{margin:0 0 8px;font-size:24px}.warn{padding:14px;border:2px solid #d97706;background:#3e2a17;border-radius:8px;font-weight:700}.muted{color:#a7b4c5}.player{padding:16px;border:1px\
        \ solid #526079;border-radius:9px;margin:10px 0}.positions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button,select,textarea{font:inherit;background:#253550;color:#e5e7eb;border:1px\
        \ solid #8293a7;border-radius:5px;padding:8px}button{cursor:pointer}.chosen{background:#295943;border-color:#78dda5}fieldset{border:1px solid #526079;border-radius:6px;margin:10px\
        \ 0;padding:12px}select{width:100%;margin-top:9px}textarea{width:95%;margin-top:9px}#result{padding:12px;background:#1f2937;min-height:22px}label{font-weight:bold}</style></head><body>\n\
        <h1>QF11 — Development-only isolated ballot prototype</h1><div class=\"warn\">NOT A LIVE STUDY. DO NOT SEND THIS LINK TO PARTICIPANTS. NO CONSENT, RECRUITMENT, OR RESPONSE COLLECTION\
        \ IS AUTHORIZED.</div>\n<p class=\"muted\">Source: archived V25 draft questionnaire and V26 collector-isolation review. The revised questionnaire is NOT approved. This page has\
        \ no network, storage, or submission code, and it does not assign real participants or export answers.</p>\n<p><label for=\"order\">Review display order:</label> <select id=\"\
        order\"><option value=\"0\">Order 1</option><option value=\"1\">Order 2</option><option value=\"2\">Order 3</option><option value=\"3\">Order 4</option><option value=\"4\">Order\
        \ 5</option><option value=\"5\">Order 6</option></select> <span id=\"orderNumber\"></span></p>\n<p id=\"intro\"></p><div id=\"cards\"></div><h2>Draft comprehension checks (local\
        \ test)</h2><div id=\"questions\"></div>\n<p><button type=\"button\" id=\"check\">Run local simulation</button> <button type=\"button\" id=\"clear\">Clear local preview</button></p><p\
        \ id=\"result\" aria-live=\"polite\"></p><p class=\"muted\">Human reviewer must independently validate Q4 and overall wording. This page is not a retention, consent, identity,\
        \ randomization, deduplication or shutdown service. Production KTC vote collector remains untouched.</p>\n<script id=\"preview-js\">'''+script+'''</script></body></html>'''\n\
        # no remote resource references, no forms, no links at all.\nassert '<form' not in htmlpage and '<iframe' not in htmlpage and '<link' not in htmlpage\nassert 'https://' not in\
        \ htmlpage and 'http://' not in htmlpage\nOUT.mkdir(parents=True,exist_ok=True)\n(OUT/'RESEARCH_ONLY_v27_offline_interactive_development_preview.html').write_text(htmlpage)\n\
        (OUT/'RESEARCH_ONLY_v27_sandbox_core.js').write_text(script)\nreport={\n 'schema':'QF11_V27_ISOLATED_DEV_PREVIEW_AND_REAL_PILOT_ARCHITECTURE',\n 'research_only':True,'v25_source_run':38327139981,'v26_source_run':38328489635,\n\
        \ 'offline_preview_no_network_and_no_persistence':True,'preview_local_simulation_only':True,\n 'approved_pilot_questionnaire':False,'independent_human_wording_qc_complete':False,\n\
        \ 'participant_contact_approved':False,'real_pilot_activated':False,'production_ktc_or_package_collector_used':False,\n 'live_random_assignment_implemented':False,'real_deduplication_implemented':False,\n\
        \ 'informed_consent_implemented':False,'retention_30_day_deletion_implemented':False,\n 'real_incident_stop_and_quarantine_implemented':False,'actual_respondents':0,'actual_votes':0,'production_changes':0,\n\
        \ 'catalog_review_candidates':22,'optional_uncertified':9,'identity_holds':7,\n 'owner_choice_required':{\n  'questionnaire':'Prospectively approve/reject the four-item V25 draft\
        \ for preregistration only, subject to independent human QC',\n  'architecture_options':[{\n   'rank':1,'name':'Supervised offline pilot with separate manual results register',\n\
        \   'advantages':'No server-to-market collector transport, low infrastructure cost',\n   'open_controls':'Reviewer independence, restricted consented record, allocation/dedup,\
        \ event stop and verified 30-day deletion',\n   'status':'PROPOSED_NOT_APPROVED'\n  },{\n   'rank':2,'name':'Separate secured response endpoint completely outside trade calculator',\n\
        \   'advantages':'Automated prospective consent, assignment, dedup and retention possible',\n   'open_controls':'Endpoint, storage, access control, deletion, operational shutdown\
        \ and Market ingestion isolation must be built and reviewed',\n   'status':'PROPOSED_NOT_APPROVED'\n  },{'rank':3,'name':'Existing KTC or Package V9 collector',\n    'status':'REJECT_FOR_PILOT_NO_ISOLATION_PROVEN'}]\n\
        \ },\n 'release_status':'BLOCKED_PENDING_OWNER_APPROVAL_HUMAN_QC_AND_REAL_IMPLEMENTATION'\n}\n(OUT/'RESEARCH_ONLY_v27_architecture_decisions.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\\\
        n')\nreadme='''# QF11 V27 — isolated development preview / pilot architecture decision\n\n**Status: DEVELOPMENT ONLY.** V26 has independently confirmed the live KTC submission\
        \ route and Market Value aggregation. No participant, response, or Market Value data has been generated or used here.\n\n## Executable preview\n\n- Open `RESEARCH_ONLY_v27_offline_interactive_development_preview.html`\
        \ **locally for the owner/developer only**.\n- It displays each of six approved-to-design-only presentation orders, allows a *local* KEEP/TRADE/CUT assignment, and simulates\
        \ the three objective proposed comprehension checks. Wrong answers trigger local `CRITICAL_STOP`; Q4 can never be automatically cleared.\n- No `fetch`, XHR, external assets,\
        \ storage, votes, data export or collector calls. This is a developer mockup, **not proof of deployment-grade isolation**.\n\n## Recommended next owner decisions, separate from\
        \ pilot launch\n\n1. Prospectively approve (or revise) the V25 *wording amendment for preregistration only*; preserve V23 critical-stop precedence. Human semantic review remains\
        \ necessary.\n2. Select **offline-supervised** as preferred development architecture if minimizing cost and avoiding production collector transport; **separately** design moderated\
        \ consent, dedup, pseudonymous data custody, deletion verification and reliable stop/quarantine before any participants.\n3. Or select a dedicated and independent backend only\
        \ after architecture/privacy review; **never** reuse KTC or Package V9 research collectors.\n\nThe GitHub Green result validates source integrity and mockup behavior only. 22\
        \ research catalog choices, 9 optional uncertified, 7 held identities, 6 excluded slots and audit 13/20 remain unchanged. No respondent recruitment, pilot activation, vote issuance\
        \ or production promotion is authorized.\n'''\n(OUT/'RESEARCH_ONLY_v27_owner_architecture_review.md').write_text(readme)\nprint('QF11_V27_OFFLINE_PREVIEW_RESEARCH_GREEN '+json.dumps({'orders':len(orders),'questions':len(questions),'held_identities':7,'live_collector_used':False,'participant_contact':False,'production_changes':0},sort_keys=True))\n\
        \nQF11_V27_PY\npython3 /tmp/qf11-v27-builder.py\nnode --check $QF11_V27_OUTPUT/RESEARCH_ONLY_v27_sandbox_core.js\nnode <<'QF11_V27_NODE'\nconst fs=require('fs'),vm=require('vm');\n\
        const code=fs.readFileSync(process.env.QF11_V27_OUTPUT+'/RESEARCH_ONLY_v27_sandbox_core.js','utf8');\nconst context={};vm.createContext(context);\nvm.runInContext(code,context,{timeout:2000});\n\
        const grade=context.gradeCritical,roles=context.validateRoles;\nif(grade([1,1,0])!=='MC_PASS_HUMAN_Q4_REVIEW_REQUIRED')throw Error('QF11_V27_CORRECT_CASE_FAIL');\nfor(let i=0;i<3;i++){let\
        \ a=[1,1,0];a[i]=(a[i]+1)%3;if(grade(a)!=='CRITICAL_STOP')throw Error('QF11_V27_CRITICAL_STOP_FAIL_'+i)}\nif(grade([1,null,0])!=='INCOMPLETE'||grade([])!=='INCOMPLETE')throw\
        \ Error('QF11_V27_INCOMPLETE_FAIL');\nif(!roles({'Brock Bowers':'KEEP','Tyler Warren':'TRADE','TreVeyon Henderson':'CUT'}))throw Error('QF11_V27_ROLE_ASSIGNMENT_FAIL');\nif(roles({'Brock\
        \ Bowers':'KEEP','Tyler Warren':'KEEP','TreVeyon Henderson':'CUT'}))throw Error('QF11_V27_DUP_ROLE_FAIL');\nif(roles({'Brock Bowers':'KEEP','Tyler Warren':'TRADE'}))throw Error('QF11_V27_MISSING_ROLE_FAIL');\n\
        for(let i=0;i<6;i++)if(context.REVIEW_DATA)throw Error('QF11_V27_UNEXPECTED_GLOBAL_DATA');\nconsole.log('QF11_V27_SYNTHETIC_ROLE_AND_CRITICAL_STOP_QC_GREEN');\nQF11_V27_NODE\n"
    - name: Run fourteen frozen repo regression groups and FA PA release selftests
