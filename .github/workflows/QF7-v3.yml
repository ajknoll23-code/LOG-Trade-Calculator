# QF7 A5-F03 — independently recheck EXACT V2-reviewed index.html, then owner-only promotion.
# Default preflight has read-only permissions; only separately confirmed promote can write main.
# QF7 Phase 0 Green 38147699139; QF7 V2 review Green 38149687619.
name: QF7 V3 - Taxi IR Active Roster Production Preflight and Explicit Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight runs all guards without writing; promote requires separate manual dispatch'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'For promote only: type PROMOTE_QF7_A5F03_ONE_FILE_TO_MAIN'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF7_TMP: '/tmp/log-qf7-v3'
  QF7_REVIEW_BRANCH: 'qf7-a5f03-v2-active-roster-review-2026-10-11'
  QF7_REVIEW_SHA: '0b6cb3879aca9c2a63548e638be6edb746ee5f0b'
  QF7_REVIEW_PARENT: '96a028d039246b424fc259c8a674aa2c30b14310'
  QF7_ORIGINAL_INDEX: '0fe2670c67cbea8d057c3c8ec5a6b2dfcce61b8e'
  QF7_REVIEWED_INDEX: 'f406c5dac446909384d1619f185d7bdf7de99368'
  QF7_MODE: ${{ inputs.mode }}
  QF7_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  preflight:
    name: Independently validate reviewed one-file change and regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout triggering main exactly, without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression and browser test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Independently pin main, immutable candidate, and one-file scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QF7_MODE" == 'preflight' || "$QF7_MODE" == 'promote' ]] || { echo 'STOP unsupported mode'; exit 1; }
          if [[ "$QF7_MODE" == 'promote' ]]; then
            [[ "$QF7_CONFIRMATION" == 'PROMOTE_QF7_A5F03_ONE_FILE_TO_MAIN' ]] || { echo 'STOP missing explicit promotion confirmation'; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP changed checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${QF7_REVIEW_BRANCH}:refs/remotes/origin/${QF7_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved'; exit 1; }
          [[ "$(git rev-parse origin/${QF7_REVIEW_BRANCH})" == "$QF7_REVIEW_SHA" ]] || { echo 'STOP review branch moved'; exit 1; }
          [[ "$(git show -s --format=%P "$QF7_REVIEW_SHA")" == "$QF7_REVIEW_PARENT" ]] || { echo 'STOP candidate has wrong parent'; exit 1; }
          git merge-base --is-ancestor "$QF7_REVIEW_PARENT" "$GITHUB_SHA" || { echo 'STOP main lacks reviewed parent ancestry'; exit 1; }
          [[ "$(git rev-parse "$QF7_REVIEW_SHA:index.html")" == "$QF7_REVIEWED_INDEX" ]] || { echo 'STOP candidate blob mismatch'; exit 1; }
          [[ "$(git hash-object index.html)" == "$QF7_ORIGINAL_INDEX" ]] || { echo 'STOP deployed index changed since QF6'; exit 1; }
          [[ "$(git diff --name-only "$QF7_REVIEW_PARENT" "$QF7_REVIEW_SHA")" == 'index.html' ]] || { echo 'STOP reviewed diff not one index.html file'; exit 1; }
          [[ "$(git diff --numstat "$QF7_REVIEW_PARENT" "$QF7_REVIEW_SHA")" == $'88\t27\tindex.html' ]] || { echo 'STOP reviewed change size drift'; exit 1; }
          guard_blob(){ local actual; actual="$(git hash-object "$1")"; [[ "$actual" == "$2" ]] || { echo "STOP protected $1 drift actual=$actual"; exit 1; }; }
          guard_blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
          guard_blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
          guard_blob free-agent-board.html '975efe51091a2315475678a9db0842b05c4fc3aa'
          guard_blob scripts/validation/validate_free_agent_valuation_parity.py 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
          guard_blob data/free_agent_utility_v1.json '557b8010082a87113ecf9d5574af108f3044a1e7'
          guard_blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
          guard_blob .github/workflows/QF7-v2.yml '1c465fc72a666db4d87207a153b860c4becd323e'
          echo 'PASS QF7 V3 exact approved review ancestry, source/allowlist and protected blob pins'
      - name: Stage exact reviewed index.html in disposable checkout, never main
        shell: bash
        run: |
          set -euo pipefail
          git show "${QF7_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "$QF7_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP staged unexpected file'; exit 1; }
          git diff --check
          echo 'PASS exact reviewed index.html staged locally only'
      - name: Prepare independent source+browser regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$QF7_TMP"
          cat > "$QF7_TMP/qa.js" <<'QF7_V3_QA_JS'
          'use strict';
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const vm=require('node:vm');
          const src=fs.readFileSync('index.html','utf8');
          const my=JSON.parse(fs.readFileSync('data/my_roster.json','utf8'));
          const league=JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
          function section(a,b){
            let i=src.indexOf(a);assert(i>=0,'missing anchor '+a);
            assert.equal(src.indexOf(a,i+1),-1,'repeated anchor '+a);
            const j=src.indexOf(b,i+a.length);assert(j>i,'missing end '+b);
            return src.slice(i,j);
          }
          const program=[
            section('function qf7VerifiedPersonalActiveKeys(data){','/* Known name-alias pairs'),
            section('const TU_DEDICATED_SLOTS = [','/* Greedy lineup fill:'),
            section('function tuOptimizeLineup(players){','/* Trade-level wrapper:'),
            section('function renderTradeImpact(){','/* ---------- IDP Weight Sensitivity ----------')
          ].join('\n');
          const C=vm.createContext({console,MYDATA:my,LEAGUEDATA:league});
          const bootstrap=`
          let MY_ROSTER=[],MY_ROSTER_ID=null,OWN_ROSTER_ID=null,
              MY_ROSTER_ACTIVE_KEYS=null,MY_ROSTER_ACTIVE_ID=null,LEAGUE_ROSTERS={},PLAYER_DB={};
          const state={teamConfirmed:true,myTeamSide:'A',A:[],B:[]};
          const warning={removed:false,remove(){this.removed=true;}};
          const wrap={innerHTML:''};
          const document={getElementById(k){return k==='tradeImpactWrap'?wrap:(k==='qf6LineupWarning'?warning:null);}};
          function normalizeName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();}
          function resolveExistingKey(k){return k;}
          function pickBestPosition(fp,pos){return (fp&&fp[0])||pos||null;}
          function resolveSyncedTeam(p){return p.team||null;}
          function playerValueByKey(k){return (PLAYER_DB[k]&&PLAYER_DB[k].value)||100;}
          function computeRosterNeeds(keys){return Object.fromEntries(['QB','RB','WR','TE','DL','LB','DB'].map(p=>[p,{count:0,tier:'Thin',target:1}]));}
          function packageMarketValueSummary(){return {};}
          function marketPackageLineHTML(){return '';}
          function valueUncertaintyForPlayer(){return null;}
          function escapeHtml(x){return String(x);}
          function titleCase(x){return String(x);}
          const TIER_COLOR={Thin:'red',Surplus:'green',Balanced:'yellow'};
          let qf6calls=0;
          function qf6ShowLineupWarning(){qf6calls++;}
          `;
          vm.runInContext(bootstrap+'\n'+program,C,{timeout:5000});
          function run(code){return vm.runInContext(code,C,{timeout:5000});}
          function list(expr){const x=run(expr);return x===null?null:Array.from(x);}
          const own=league.rosters.find(r=>String(r.roster_id)===String(my.roster_id));
                    assert(own,'own roster missing from league-wide payload');
                    for(const slot of ['starters','bench','taxi','reserve_ir']){
                      assert(Array.isArray(my[slot]) && Array.isArray(own[slot]),'missing slot '+slot);
                      assert.deepEqual(my[slot].map(p=>String(p.player_id)).sort(),own[slot].map(p=>String(p.player_id)).sort(),'source mismatch '+slot);
                    }
                    console.log('PASS personal/league source identity parity across active, taxi and IR slots');
                    const ID=p=>String(p.player_id);
          const ownKeys={};
          for(const slot of ['starters','bench','taxi','reserve_ir'])ownKeys[slot]=my[slot].map(p=>p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim());
          assert(my.starters.length+my.bench.length > 0);
          assert(my.taxi.length > 0);
          assert(Array.isArray(my.reserve_ir));
          // Cold-start fallback must never invent active members from an old, unlabeled list.
          run("MY_ROSTER=['a','b','taxi_candidate']; MY_ROSTER_ID=99; LEAGUE_ROSTERS={}; state.teamConfirmed=false;");
          assert.equal(list('tuActiveRosterKeys()'),null);
          run("state.A=[{type:'player',name:'A',value:200}];state.B=[{type:'player',name:'B',value:240}];renderTradeImpact();");
          assert.match(run('wrap.innerHTML'),/Team Utility unavailable/);
          assert.doesNotMatch(run('wrap.innerHTML'),/Team Utility:.*[+-]0/);
          console.log('PASS unverified cold start fails closed, never prints numeric TU or projected cuts');
          // Real personal sync is accepted, excluding all 5 taxi and IR even before league-wide sync.
          run('state.teamConfirmed=true; mergeLiveRoster(MYDATA);');
          let personal=list('tuActiveRosterKeys()');
          assert.deepEqual(personal,[...ownKeys.starters,...ownKeys.bench]);
          assert(personal.every(k=>!ownKeys.taxi.includes(k)&&!ownKeys.reserve_ir.includes(k)));
          assert.equal(run('MY_ROSTER_ACTIVE_ID'),String(my.roster_id));
          run('renderTradeImpact();');
          assert.match(run('wrap.innerHTML'),/Team Utility:/);
          assert.doesNotMatch(run('wrap.innerHTML'),/Team Utility unavailable/);
          console.log('PASS personal source active='+personal.length+', taxi/IR excluded, live render numeric only on verified data');
          // Authoritative, independent all-team sync always beats the personal cache.
          C.AUTH={};
          for(const roster of league.rosters){
           C.AUTH[roster.roster_id]={players:['starters','bench','taxi','reserve_ir'].flatMap(slot=>roster[slot].map(p=>({key:p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim(),slot})))};
          }
          run('LEAGUE_ROSTERS=AUTH;');
          const official=list('tuActiveRosterKeys()');
          assert.deepEqual(official,personal);
          C.AUTH[my.roster_id].players=[...C.AUTH[my.roster_id].players].reverse();
          const reversed=list('tuActiveRosterKeys()');
          assert.deepEqual(reversed,personal.slice().reverse());
          console.log('PASS authoritative roster takes precedence over personal cache');
          // Empty/corrupt authoritative metadata falls back to verified personal only for own team.
          C.AUTH[my.roster_id].players=[];
          assert.deepEqual(list('tuActiveRosterKeys()'),personal);
          C.AUTH[my.roster_id].players=[{key:'fake',slot:'wrong'}];
          assert.deepEqual(list('tuActiveRosterKeys()'),personal);
          console.log('PASS empty/broken league metadata uses proven personal active-only cache');
          // Selecting someone else must never read personal active keys. No synthetic zero utility.
          run('MY_ROSTER_ID=LEAGUEDATA.rosters[0].roster_id;');
          let other=list('tuActiveRosterKeys()');
          const r0=league.rosters[0];
          assert.deepEqual(other,[...r0.starters,...r0.bench].map(p=>p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()));
          run('LEAGUE_ROSTERS[MY_ROSTER_ID]={players:[]};');
          assert.equal(list('tuActiveRosterKeys()'),null);
          run('renderTradeImpact();');
          assert.match(run('wrap.innerHTML'),/Team Utility unavailable/);
          assert(run('warning.removed'));
          console.log('PASS other-team missing source returns unknown; stale warning removed');
          // Personal sync arrives AFTER user selected other team: preserve manual selection.
          run('LEAGUE_ROSTERS=AUTH; MY_ROSTER=["selected_roster_marker"];state.teamConfirmed=true;');
          const selected=run('MY_ROSTER_ID');
          run('mergeLiveRoster(MYDATA);');
          assert.equal(run('MY_ROSTER_ID'),selected);
          assert.deepEqual(list('MY_ROSTER'),['selected_roster_marker']);
          assert.equal(run('OWN_ROSTER_ID'),my.roster_id);
          console.log('PASS delayed own sync does not replace confirmed other-team selection');
          // Failed or incomplete personal source must revoke fallback eligibility.
          run('MY_ROSTER_ID=MYDATA.roster_id; LEAGUE_ROSTERS={};');
          let malformed=JSON.parse(JSON.stringify(my)); malformed.reserve_ir=null;
          C.MALFORMED=malformed;run('mergeLiveRoster(MALFORMED);');
          assert.equal(list('tuActiveRosterKeys()'),null);
          malformed=JSON.parse(JSON.stringify(my));malformed.taxi=[malformed.starters[0],...malformed.taxi];
          C.MALFORMED=malformed;run('mergeLiveRoster(MALFORMED);');
          assert.equal(list('tuActiveRosterKeys()'),null);
          malformed=JSON.parse(JSON.stringify(my));malformed.synced_at=null;
          C.MALFORMED=malformed;run('mergeLiveRoster(MALFORMED);');
          assert.equal(list('tuActiveRosterKeys()'),null);
          console.log('PASS incomplete, duplicate and timestampless source all fail closed');
          // Re-sync restores good personal source.
          run('mergeLiveRoster(MYDATA);');
          assert.deepEqual(list('tuActiveRosterKeys()'),personal);
          // 17 starters and 41-roster cap unchanged: exact retained production optimizer.
          const positions={QB:3,RB:6,WR:6,TE:3,K:2,DL:8,LB:7,DB:6};
          const synthetic={};let n=0;
          for(const [pos,count] of Object.entries(positions))for(let j=0;j<count;j++)synthetic['active_'+(n++)]={pos,value:5000-n*15};
          assert.equal(n,41);
          for(let j=0;j<3;j++)synthetic['arrival_'+j]={pos:'RB',value:2500+j};
          C.SYNTHETIC=synthetic;
          C.BEFORE=Object.keys(synthetic).filter(x=>x.startsWith('active_'));
          C.AFTER=[...C.BEFORE.slice(1),'arrival_0','arrival_1','arrival_2'];
          run('PLAYER_DB=SYNTHETIC;');
          const before=run('tuOptimizeLegalRoster(tuPlayersFromKeys(BEFORE))');
          const after=run('tuOptimizeLegalRoster(tuPlayersFromKeys(AFTER))');
          assert.equal(before.starters.length,17);
          assert.equal(after.starters.length,17);
          assert.equal(before.bench.length,24);
          assert.equal(after.bench.length,24);
          assert.equal(before.cuts.length,0);
          assert.equal(after.cuts.length,2);
          assert.equal(after.rosterSize,41);
          assert(Number.isFinite(run('calculateTeamUtility(BEFORE,AFTER).teamUtility')));
          assert.equal(run('TU_BENCH_WEIGHT'),.15);
          console.log('PASS 17 starters, 41 cap, 2 projected cuts and unchanged 0.85/0.15 formula');
          // Check exact production separation/freeze markers, not just code under test.
          assert(src.includes('QF6_A5F04_VISIBLE_STARTER_WARNING_V1_END'));
          assert(src.includes("impactShell.hidden = true;"));
          assert(src.includes("impactShell.setAttribute('aria-hidden', 'true');"));
          assert(!src.includes('MY_ROSTER.slice(0, Math.min(TU_ACTIVE_ROSTER_LIMIT, MY_ROSTER.length))'));
          assert.equal((src.match(/QF7_A5F03_PERSONAL_ACTIVE_PROVENANCE_V1/g)||[]).length,1);
          console.log('QF7_V2_REVIEW_QA_PASS');
          QF7_V3_QA_JS
          cat > "$QF7_TMP/browser.py" <<'QF7_V3_BROWSER_PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import json, threading
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          my=json.loads(Path('data/my_roster.json').read_text())
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(QuietHandler,directory=str(Path.cwd())))
          th=threading.Thread(target=server.serve_forever,daemon=True)
          th.start()
          opts=Options()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1365,960']:
              opts.add_argument(a)
          try:
              with webdriver.Chrome(options=opts) as d:
                  d.set_page_load_timeout(45)
                  d.get(f'http://127.0.0.1:{server.server_port}/index.html')
                  WebDriverWait(d,25).until(lambda driver: driver.execute_script('''return typeof qf7VerifiedPersonalActiveKeys === 'function' && typeof tuActiveRosterKeys === 'function' && !!document.querySelector('.td-retired-team-impact')'''))
                  result=d.execute_script('''
                    const my=arguments[0];
                    const targetKeys=arr=>arr.map(p=>resolveExistingKey(normalizeName(p.name)));
                    const active=targetKeys(my.starters.concat(my.bench));
                    const special=targetKeys(my.taxi.concat(my.reserve_ir));
                    LEAGUE_ROSTERS={};state.teamConfirmed=true;
                    mergeLiveRoster(my);
                    const actual=tuActiveRosterKeys();
                    if(!Array.isArray(actual)||actual.length!==active.length||actual.some(k=>special.includes(k)))throw new Error('personal active exclusion failed');
                    const good=actual.every((k,i)=>k===active[i]);
                    MY_ROSTER_ACTIVE_KEYS=null;MY_ROSTER_ACTIVE_ID=null;
                    const cold=tuActiveRosterKeys();
                    const hidden=document.querySelector('.td-retired-team-impact');
                    return {size:actual.length, good, failClosed:cold===null,hidden:!!hidden.hidden};
                  ''',my)
                  assert result['size']==len(my['starters'])+len(my['bench']) and result['good'] and result['failClosed'] and result['hidden'],result
