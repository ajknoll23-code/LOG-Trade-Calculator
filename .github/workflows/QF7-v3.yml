  promote:
    name: Explicit owner-only promotion of reviewed index.html to main
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote' && inputs.confirmation == 'PROMOTE_QF7_A5F03_ONE_FILE_TO_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout the SAME dispatch HEAD with write permission
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Recheck reviewed SHA, deployed index, main lease, and exact file scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QF7_MODE" == 'promote' && "$QF7_CONFIRMATION" == 'PROMOTE_QF7_A5F03_ONE_FILE_TO_MAIN' ]] || exit 1
