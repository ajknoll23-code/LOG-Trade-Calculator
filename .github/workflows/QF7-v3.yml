      - name: Commit only reviewed index.html and non-force push to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo 'STOP staged files'; exit 1; }
          [[ "$(git hash-object index.html)" == "$QF7_REVIEWED_INDEX" ]] || exit 1
          git diff --cached --check
          git commit -m 'QF7 A5-F03: exclude taxi/IR from active roster fallback'
          [[ "$(git rev-parse HEAD:index.html)" == "$QF7_REVIEWED_INDEX" ]] || exit 1
          # This NON-FORCE push rejects a competing main update; no force or model mutation.
          git push origin HEAD:refs/heads/main
          echo "QF7_V3_PROMOTION_GREEN main=$(git rev-parse HEAD) index=${QF7_REVIEWED_INDEX}"
          echo 'Verify Pages separately; workflow success does not certify scientific accuracy.'
