          [[ "$(git diff --numstat "$QF7_REVIEW_PARENT" "$QF7_REVIEW_SHA")" == $'88\t27\tindex.html' ]] || exit 1
          git merge-base --is-ancestor "$QF7_REVIEW_PARENT" HEAD || { echo 'STOP parent ancestor drift'; exit 1; }
