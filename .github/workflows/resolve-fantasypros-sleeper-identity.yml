name: Resolve FantasyPros-Sleeper Identity

# Deterministic identity crosswalk between FantasyPros' fpid and
# Sleeper's sleeper_id, replacing the name-only matching used earlier in
# this investigation -- confirmed unsafe by real data (38 colliding
# names across 77 Sleeper rows, including two different real active
# players sharing a name). Pure local processing of two already-
# committed files, no network access needed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasypros-sleeper-identity
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test before trusting real output
        run: python3 scripts/resolve_fantasypros_sleeper_identity.py --selftest

      - name: Run the resolver
        run: python3 scripts/resolve_fantasypros_sleeper_identity.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/identity_crosswalk.json scripts/identity_collision_report.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run FantasyPros-Sleeper identity resolver"
          git push
