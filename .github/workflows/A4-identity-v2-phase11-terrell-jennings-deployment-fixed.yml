name: A4 Identity V2 Phase 11 Terrell Jennings Exact-Scope Deployment

# PATCH_VERSION: TRAILING_BLANK_LINE_FIX_V2

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  identity-v2-phase11:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard exact A3 deployment anchor
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          declare -A EXPECTED=(
            ["scripts/identity_crosswalk.json"]="c513054640c413de48e073a2f69fb56a3333e903"
            ["scripts/projections/resolve_fantasypros_sleeper_identity.py"]="fa4b0fd9b201d79173125f55f7c1eeee916b2506"
            ["research/identity-v2/identity_v2_phase10_direct_candidate_crosswalk.json"]="6f7f8540e451cfeaaa4ad997416fca77e0aa4fd3"
            ["research/identity-v2/identity_v2_phase10_production_candidate_shadow.json"]="ee1e927868f213f86cf21e26080fef4a328d88b1"
            ["research/identity-v2/identity_v2_phase10_manifest.json"]="4493f855ac0a40eaa25cea5899a36c9bfa98bf2a"
            ["scripts/artifacts/generated/team_utility_lineup_projections.json"]="7907192e769d24d453d8012567993f94e7f7003e"
            ["scripts/artifacts/reports/team_utility_lineup_projection_report.md"]="9ae6458892a2b371e7cb762cf6fc4e104b6d7794"
            ["scripts/artifacts/reports/identity_collision_report.md"]="02f406bcb4826b890363e4f2a6c81cb485ebb873"
          )
          for p in "${!EXPECTED[@]}"; do
            actual="$(git hash-object "$p")"
            test "$actual" = "${EXPECTED[$p]}" || {
              echo "ERROR: A4 deployment anchor drift: $p expected=${EXPECTED[$p]} actual=$actual"
              exit 1
            }
          done

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          D=Path("research/identity-v2")
          result_path=D/"identity_v2_phase10_production_candidate_shadow.json"
          manifest_path=D/"identity_v2_phase10_manifest.json"
          candidate_path=D/"identity_v2_phase10_direct_candidate_crosswalk.json"

          r=json.loads(result_path.read_text())
          m=json.loads(manifest_path.read_text())

          assert r["decision"]==(
              "PASS_IDENTITY_V2_PHASE10_ONE_PLAYER_PRODUCTION_CANDIDATE_SHADOW_"
              "AUTHORIZE_PHASE11_EXACT_SCOPE_DEPLOYMENT"
          )
          assert r["phase11_exact_scope_deployment_authorized"] is True
          assert r["direct_shadow"]["changed_fpids"]==["26964"]
          assert r["successor_resolver_shadow"]["seeded_vs_control_changed_fpids"]==["26964"]
          assert r["direct_shadow"]["all_hard_gates_pass"] is True
          assert r["successor_resolver_shadow"]["all_hard_gates_pass"] is True
          assert r["production_change_authorized"] is False
          assert r["deployment_authorized"] is False

          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert sha(result_path)==m["files"]["identity_v2_phase10_production_candidate_shadow.json"]
          assert sha(candidate_path)==m["files"]["identity_v2_phase10_direct_candidate_crosswalk.json"]
          assert m["phase11_exact_scope_deployment_authorized"] is True
          assert m["production_changed"] is False

          print("PASS: exact A3 Phase-10 deployment anchor verified.")
          PY

          cp scripts/identity_crosswalk.json \
            "${RUNNER_TEMP}/identity_crosswalk.predeploy.json"

          sha256sum \
            index.html \
            scripts/projections/resolve_fantasypros_sleeper_identity.py \
            research/identity-v2/identity_v2_phase10_direct_candidate_crosswalk.json \
            research/identity-v2/identity_v2_phase10_production_candidate_shadow.json \
            research/identity-v2/identity_v2_phase10_manifest.json \
            > "${RUNNER_TEMP}/immutable.sha256"

          if test -f free-agent-board.html; then
            sha256sum free-agent-board.html >> "${RUNNER_TEMP}/immutable.sha256"
          fi

      - name: Preflight full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Apply exact one-player production candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,shutil
          from collections import defaultdict
          from pathlib import Path

          current_path=Path("scripts/identity_crosswalk.json")
          candidate_path=Path(
              "research/identity-v2/"
              "identity_v2_phase10_direct_candidate_crosswalk.json"
          )
          current=json.loads(current_path.read_text())
          candidate=json.loads(candidate_path.read_text())

          def index(rows,label):
              out={}
              for row in rows:
                  fpid=row.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  if fpid in out:
                      raise SystemExit(f"{label}: duplicate FPID {fpid}")
                  out[fpid]=row
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          a=index(current,"current")
          b=index(candidate,"candidate")
          if set(a)!=set(b):
              raise SystemExit("candidate/current FPID universe differs")

          changed=sorted(
              fpid for fpid in a
              if canon(a[fpid])!=canon(b[fpid])
          )
          if changed!=["26964"]:
              raise SystemExit(
                  f"A4 candidate scope is not exactly FPID 26964: {changed}"
              )

          before=a["26964"]
          after=b["26964"]
          if before.get("requires_manual_review") is not True:
              raise SystemExit("Terrell Jennings is not held in production baseline")
          if before.get("sleeper_id") not in (None,""):
              raise SystemExit("Terrell Jennings unexpectedly already authoritative")
          if str(before.get("candidate_sleeper_id") or "")!="12412":
              raise SystemExit("Terrell Jennings baseline candidate SID drifted")

          expected={
              "name":"Terrell Jennings",
              "sleeper_id":"12412",
              "candidate_sleeper_id":"12412",
              "requires_manual_review":False,
              "match_confidence":"high",
              "match_method":"phase10_independent_stable_id_corroboration"
          }
          for k,v in expected.items():
              actual=after.get(k)
              if actual!=v:
                  raise SystemExit(
                      f"Terrell Jennings candidate field mismatch {k}: {actual!r} != {v!r}"
                  )

          protected={
              "26157":None,
              "26313":"11760",
              "27959":"13457",
              "28290":"13482"
          }
          for fpid,sid in protected.items():
              if canon(a[fpid])!=canon(b[fpid]):
                  raise SystemExit(f"protected identity row changed: {fpid}")
              if sid is not None and str(b[fpid].get("sleeper_id"))!=sid:
                  raise SystemExit(f"protected deployed mapping lost: {fpid}->{sid}")

          before_manual=sum(
              bool(r.get("requires_manual_review")) for r in current
          )
          after_manual=sum(
              bool(r.get("requires_manual_review")) for r in candidate
          )
          if (before_manual,after_manual)!=(15,14):
              raise SystemExit(
                  f"manual-review count mismatch: {before_manual}->{after_manual}"
              )

          by_sid=defaultdict(list)
          for row in candidate:
              sid=row.get("sleeper_id")
              fpid=row.get("fantasypros_id")
              if sid in (None,"") or fpid in (None,""):
                  continue
              if row.get("requires_manual_review"):
                  continue
              by_sid[str(sid)].append(str(fpid))
          collisions={
              sid:fpids for sid,fpids in by_sid.items()
              if len(fpids)>1
          }
          if collisions:
              raise SystemExit(
                  f"authoritative Sleeper-ID collision(s): {collisions}"
              )

          shutil.copyfile(candidate_path,current_path)
          print("PASS: installed exact Terrell Jennings 26964 -> 12412 candidate.")
          PY

      - name: Regenerate identity-dependent artifacts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path

          root=Path(".")
          resolver_path=root/"scripts/projections/resolve_fantasypros_sleeper_identity.py"
          spec=importlib.util.spec_from_file_location(
              "identity_prod_resolver",resolver_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load production identity resolver")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          rows=json.loads(
              (root/"scripts/identity_crosswalk.json").read_text()
          )
          report=mod.build_production_report(rows)
          report_path=root/"scripts/artifacts/reports/identity_collision_report.md"
          report_path.write_text(report)
          print("PASS: regenerated identity collision/report artifact.")
          PY

          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/projections/build_team_utility_lineup_projections.py --check

      - name: Prove successor resolver preserves exactly Jennings mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util,json,os
          from collections import defaultdict
          from pathlib import Path

          root=Path(".")
          resolver_path=root/"scripts/projections/resolve_fantasypros_sleeper_identity.py"
          spec=importlib.util.spec_from_file_location(
              "identity_prod_resolver",resolver_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load production identity resolver")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          baseline=json.loads(
              (Path(os.environ["RUNNER_TEMP"])/"identity_crosswalk.predeploy.json").read_text()
          )
          deployed=json.loads(
              (root/"scripts/identity_crosswalk.json").read_text()
          )

          fp_doc=mod.read_json(mod.FP_PATH)
          totals=mod.read_json(mod.SLEEPER_TOTAL_PATH)
          raw=mod.read_json(mod.SLEEPER_RAW_PATH)
          teams=mod.read_json(mod.TEAM_REFRESH_PATH)

          control=mod.build_production_crosswalk(
              fp_doc,totals,raw,teams,baseline
          )
          seeded=mod.build_production_crosswalk(
              fp_doc,totals,raw,teams,deployed
          )

          def index(rows,label):
              out={}
              for row in rows:
                  fpid=row.get("fantasypros_id")
                  if fpid in (None,""):
                      continue
                  fpid=str(fpid)
                  if fpid in out:
                      raise SystemExit(f"{label}: duplicate FPID {fpid}")
                  out[fpid]=row
              return out

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          c=index(control,"control")
          s=index(seeded,"seeded")
          if set(c)!=set(s):
              raise SystemExit("successor universes differ")

          changed=sorted(
              fpid for fpid in c
              if canon(c[fpid])!=canon(s[fpid])
          )
          if changed!=["26964"]:
              raise SystemExit(
                  f"successor seeded-vs-control scope mismatch: {changed}"
              )

          row=s["26964"]
          if str(row.get("sleeper_id") or "")!="12412":
              raise SystemExit("successor lost Terrell Jennings stable pair")
          if row.get("requires_manual_review") is not False:
              raise SystemExit("successor returned Terrell Jennings to manual review")

          if canon(c["26157"])!=canon(s["26157"]):
              raise SystemExit("Jonah Elliss changed in successor resolver")
          if s["26157"].get("requires_manual_review") is not True:
              raise SystemExit("Jonah Elliss no longer held")

          phase6={"26313":"11760","27959":"13457","28290":"13482"}
          for fpid,sid in phase6.items():
              if canon(c[fpid])!=canon(s[fpid]):
                  raise SystemExit(f"Phase-6 row changed between arms: {fpid}")
              if str(s[fpid].get("sleeper_id") or "")!=sid:
                  raise SystemExit(f"Phase-6 mapping lost: {fpid}")

          by_sid=defaultdict(list)
          for r in seeded:
              sid=r.get("sleeper_id")
              fpid=r.get("fantasypros_id")
              if sid in (None,"") or fpid in (None,"") or r.get("requires_manual_review"):
                  continue
              by_sid[str(sid)].append(str(fpid))
          collisions={
              sid:fpids for sid,fpids in by_sid.items()
              if len(fpids)>1
          }
          if collisions:
              raise SystemExit(
                  f"successor authoritative SID collision(s): {collisions}"
              )

          print("PASS: successor resolver preserves exactly Jennings 26964 -> 12412.")
          PY

      - name: Full post-deployment repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Write Phase 11 deployment confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path

          root=Path(".")
          D=root/"research/identity-v2"
          pre_path=Path(os.environ["RUNNER_TEMP"])/"identity_crosswalk.predeploy.json"
          post_path=root/"scripts/identity_crosswalk.json"

          pre=json.loads(pre_path.read_text())
          post=json.loads(post_path.read_text())

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          def index(rows):
              return {
                  str(r["fantasypros_id"]):r
                  for r in rows
                  if r.get("fantasypros_id") not in (None,"")
              }

          def canon(row):
              return json.dumps(row,sort_keys=True,separators=(",",":"))

          a=index(pre); b=index(post)
          changed=sorted(
              fpid for fpid in a
              if canon(a[fpid])!=canon(b[fpid])
          )
          if changed!=["26964"]:
              raise SystemExit(
                  f"deployment confirmation scope mismatch: {changed}"
              )

          if sum(bool(r.get("requires_manual_review")) for r in pre)!=15:
              raise SystemExit("predeploy manual-review count is not 15")
          if sum(bool(r.get("requires_manual_review")) for r in post)!=14:
              raise SystemExit("postdeploy manual-review count is not 14")

          expected={
              "26964":{
                  "name":"Terrell Jennings",
                  "sleeper_id":"12412"
              }
          }

          result={
              "schema_version":1,
              "study_id":"identity-v2-phase11-terrell-jennings-exact-scope-deployment",
              "status":"DEPLOYED_VALIDATED",
              "decision":"PASS_IDENTITY_V2_PHASE11_TERRELL_JENNINGS_DEPLOYED",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "repo_commit_sha_before_deployment":subprocess.check_output(
                  ["git","rev-parse","HEAD"],text=True
              ).strip(),
              "production_change_applied":True,
              "deployed_mapping_count":1,
              "deployed_mappings":expected,
              "changed_fpids":changed,
              "manual_review_count_before":15,
              "manual_review_count_after":14,
              "jonah_elliss_remains_held":True,
              "phase6_mappings_preserved":True,
              "production_resolver_source_changed":False,
              "predeploy_crosswalk_sha256":sha(pre_path),
              "postdeploy_crosswalk_sha256":sha(post_path),
              "identity_report_sha256":sha(
                  root/"scripts/artifacts/reports/identity_collision_report.md"
              ),
              "team_utility_projection_sha256":sha(
                  root/"scripts/artifacts/generated/team_utility_lineup_projections.json"
              ),
              "team_utility_report_sha256":sha(
                  root/"scripts/artifacts/reports/team_utility_lineup_projection_report.md"
              ),
              "phase10_manifest_sha256":sha(
                  D/"identity_v2_phase10_manifest.json"
              ),
              "full_repo_regression_passed":True,
              "successor_resolver_exact_scope_passed":True
          }

          out_json=D/"identity_v2_phase11_deployment_confirmation.json"
          out_md=D/"identity_v2_phase11_deployment_confirmation.md"
          man=D/"identity_v2_phase11_manifest.json"

          out_json.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Identity V2 Phase 11 — Terrell Jennings Deployment Confirmation",
              "",
              f"**Decision:** `{result['decision']}`",
              "",
              "- Deployed mapping: **Terrell Jennings FPID 26964 → Sleeper SID 12412**",
              "- Exact production crosswalk diff: **1 FPID**",
              "- Manual-review count: **15 → 14**",
              "- Jonah Elliss remains held: **Yes**",
              "- Existing Phase-6 mappings preserved: **Yes**",
              "- Successor resolver exact-scope check: **PASS**",
              "- Identity-dependent Team Utility artifacts regenerated: **PASS**",
              "- Full repository regression suite: **PASS**",
              ""
          ]
          out_md.write_text("\n".join(lines).rstrip()+"\n")

          manifest={
              "schema_version":1,
              "study_id":result["study_id"],
              "decision":result["decision"],
              "production_change_applied":True,
              "deployed_mapping_count":1,
              "predeploy_crosswalk_sha256":result["predeploy_crosswalk_sha256"],
              "postdeploy_crosswalk_sha256":result["postdeploy_crosswalk_sha256"],
              "phase10_manifest_sha256":result["phase10_manifest_sha256"],
              "deployment_confirmation_json_sha256":sha(out_json),
              "deployment_confirmation_md_sha256":sha(out_md),
              "identity_report_sha256":result["identity_report_sha256"],
              "team_utility_projection_sha256":result["team_utility_projection_sha256"],
              "team_utility_report_sha256":result["team_utility_report_sha256"]
          }
          man.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          print(json.dumps({
              "decision":result["decision"],
              "changed_fpids":changed,
              "manual_review_count_after":14
          },indent=2))
          PY

      - name: Prove exact deployment file scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${RUNNER_TEMP}/immutable.sha256"

          python3 - <<'PY'
          import subprocess

          allowed={
              "scripts/identity_crosswalk.json",
              "scripts/artifacts/reports/identity_collision_report.md",
              "scripts/artifacts/generated/team_utility_lineup_projections.json",
              "scripts/artifacts/reports/team_utility_lineup_projection_report.md",
              "research/identity-v2/identity_v2_phase11_deployment_confirmation.json",
              "research/identity-v2/identity_v2_phase11_deployment_confirmation.md",
              "research/identity-v2/identity_v2_phase11_manifest.json"
          }
          s=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True
          )
          touched={line[3:] for line in s.splitlines() if line.strip()}
          unexpected=touched-allowed
          if unexpected:
              raise SystemExit(
                  "Unexpected deployment file changes: "
                  + ", ".join(sorted(unexpected))
              )

          required={
              "scripts/identity_crosswalk.json",
              "research/identity-v2/identity_v2_phase11_deployment_confirmation.json",
              "research/identity-v2/identity_v2_phase11_deployment_confirmation.md",
              "research/identity-v2/identity_v2_phase11_manifest.json"
          }
          missing=required-touched
          if missing:
              raise SystemExit(
                  "Required deployment files did not change: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: A4 changed only approved production/derived/release files.")
          PY

          git diff --check

      - name: Final regression proof before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit A4 exact-scope deployment
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during A4."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/identity_crosswalk.json \
            scripts/artifacts/reports/identity_collision_report.md \
            scripts/artifacts/generated/team_utility_lineup_projections.json \
            scripts/artifacts/reports/team_utility_lineup_projection_report.md \
            research/identity-v2/identity_v2_phase11_deployment_confirmation.json \
            research/identity-v2/identity_v2_phase11_deployment_confirmation.md \
            research/identity-v2/identity_v2_phase11_manifest.json

          git diff --cached --check
          git commit -m "Deploy Identity V2 Terrell Jennings exact mapping"
          git push origin HEAD:main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "PASS: A4 exact-scope deployment committed cleanly."
