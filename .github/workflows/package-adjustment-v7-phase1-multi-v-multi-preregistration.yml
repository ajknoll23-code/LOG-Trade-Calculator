        \  \"same_voters_may_participate\": True,\n            \"separate_activation_cutoff_required\": True,\n          \
        \  \"confirmation_sample_size_frozen_by_pre-vote_power_analysis\": True,\n            \"human_approval_required_even_if_confirmation_passes\"\
        : True,\n        },\n        \"mixed_asset_extension\": {\n            \"status\": \"BLOCKED_PENDING_INDEPENDENT_PICK_PLAYER_BRIDGE\"\
        ,\n            \"phase0_direction\": p0[\"primary_summary\"][\"direction\"],\n            \"phase0_overall_material\"\
        : p0[\"primary_summary\"][\"overall_material\"],\n            \"required_before_pick_voting\": [\n               \
        \ \"freeze new Draft Pick FV calibration/bridge\",\n                \"define player-equivalent treatment for picks\
        \ without using package votes\",\n                \"preregister mixed-asset challenge geometry\",\n              \
        \  \"generate fresh mixed-asset catalog after those freezes\",\n            ],\n            \"motivating_case_to_revisit_after_bridge\"\
        : MOTIVATING_CASE[\"case_id\"],\n        },\n        \"lineage\": {\n            \"phase0_sha256\": sha(PHASE0),\n\
        \            \"phase0_manifest_sha256\": sha(PHASE0_MAN),\n            \"v6_production_candidate_sha256\": sha(V6_PROD),\n\
        \            \"v6_development_preregistration_sha256\": sha(V6_DEV_PRE),\n            \"v6_prospective_preregistration_sha256\"\
        : sha(V6_PROS_PRE),\n            \"live_deployment_sha256\": sha(LIVE),\n            \"v6_q\": v6[\"frozen_c2\"][\"\
        q\"],\n            \"production_revision\": load(LIVE)[\"production_revision\"],\n        },\n        \"forbidden\"\
        : [\n            \"collecting V7 multi-v-multi votes before power checkpoint and catalog are frozen\",\n         \
        \   \"using candidate predictions to choose development challenges\",\n            \"showing LOG FV or candidate scores\
        \ to voters\",\n            \"using the motivating Sherwood trade as an answer label\",\n            \"tuning a candidate\
        \ until the motivating trade changes verdict\",\n            \"using draft picks in the primary player-only development\
        \ vote\",\n            \"using package votes to calibrate the pick/player bridge\",\n            \"changing existing\
        \ V1.7 one-vs-package production behavior during Phase 1\",\n            \"automatic production promotion\",\n   \
        \     ],\n        \"next_stage\": \"package-adjustment-v7-phase1a-power-and-catalog-freeze\",\n    }\n    return result\n\
        \ndef render_md(d):\n    c = d[\"motivation\"][\"mixed_asset_real_trade_fixture\"]\n    lines = [\n        \"# Package\
        \ Adjustment V7 \u2014 Phase 1 Multi-v-Multi Preregistration\",\n        \"\",\n        f\"**Decision:** `{d['decision']}`\"\
        ,\n        \"\",\n        \"**Research only. No V7 vote has been collected or read, no candidate has been fit, and\
        \ production is unchanged.**\",\n        \"\",\n        \"## Why this study exists\",\n        \"\",\n        \"Production\
        \ V1.7 deliberately fails closed on multi-v-multi and draft-pick trades. \"\n        \"Those trades therefore fall\
        \ back to raw FV addition even when one side is materially more concentrated.\",\n        \"\",\n        \"The motivating\
        \ real trade is retained only as a structural regression fixture:\",\n        f\"- Side A raw FV: **{c['raw_total_A']:,}**\"\
        ,\n        f\"- Side B raw FV: **{c['raw_total_B']:,}**\",\n        f\"- Raw gap: **{c['raw_gap_A_minus_B']:,}** toward\
        \ Side A\",\n        f\"- Highest-FV player: **{c['highest_player_fv_name']} ({c['highest_player_fv']:,})** on Side\
        \ B\",\n        \"- It is **not** labeled Side A or Side B for model fitting.\",\n        \"- Because it contains\
        \ a pick, it remains outside the primary player-only voting study.\",\n        \"\",\n        \"## Candidate architectures\"\
        ,\n        \"\",\n        \"- `C0_RAW_SUM`: current multi-v-multi fallback.\",\n        f\"- `C1_V6_Q_TRANSFER`: symmetric\
        \ V6 power score with fixed `q={Q_V6}`.\",\n        \"- `C2_GLOBAL_Q`: same power score with one globally fitted q.\"\
        ,\n        \"- `C3_APEX_REMAINDER`: max asset + fitted fraction of remainder.\",\n        \"\",\n        \"All candidates\
        \ are symmetric between trade sides, scale-homogeneous, player-order invariant, \"\n        \"and use no position-specific\
        \ or named-player parameters.\",\n        \"\",\n        \"## Mock-trade voting\",\n        \"\",\n        \"**Yes\
        \ \u2014 V7 will require new mock-trade votes.** Phase 1 itself does not collect them.\",\n        \"\",\n       \
        \ \"- 40 player-only multi-v-multi challenges per voter.\",\n        \"- Every voter can complete all 40 in one session.\"\
        ,\n        \"- Topologies: 2v2, 2v3, 2v4, 3v3, 3v4, 4v4.\",\n        \"- FV/model scores hidden.\",\n        \"- Side\
        \ and challenge order randomized.\",\n        \"- Candidate checkpoint must be frozen at 30, 40, or 50 distinct voters\
        \ before activation.\",\n        \"- Stopping cannot depend on vote direction or model performance.\",\n        \"\
        \",\n        \"## Pick firewall\",\n        \"\",\n        \"The Phase 0 audit found a material pick/player scale\
        \ displacement. Draft picks therefore cannot \"\n        \"enter the primary multi-v-multi voting experiment. Mixed-asset\
        \ voting comes only after an \"\n        \"independent pick\u2192player FV bridge is frozen.\",\n        \"\",\n \
        \       \"## Next stage\",\n        \"\",\n        \"`package-adjustment-v7-phase1a-power-and-catalog-freeze`\",\n\
        \        \"\",\n    ]\n    return \"\\n\".join(lines)\n\ndef write():\n    for p in (OUT, OUT_MD, OUT_MAN):\n    \
        \    if p.exists():\n            raise RuntimeError(f\"output already exists: {p}\")\n    obj = build()\n    OUT.write_text(json.dumps(obj,\
        \ indent=2, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n    OUT_MD.write_text(render_md(obj), encoding=\"utf-8\"\
        )\n    man = {\n        \"schema_version\": 1,\n        \"study_id\": STUDY_ID,\n        \"stage\": obj[\"stage\"\
        ],\n        \"status\": obj[\"status\"],\n        \"generated_at_utc\": obj[\"generated_at_utc\"],\n        \"decision\"\
        : obj[\"decision\"],\n        \"research_only\": True,\n        \"new_mock_trade_votes_exist_or_were_read\": False,\n\
        \        \"candidate_fit_performed\": False,\n        \"production_change_authorized\": False,\n        \"preregistration_sha256\"\
        : sha(OUT),\n        \"preregistration_markdown_sha256\": sha(OUT_MD),\n        \"canonical_preregistration_sha256\"\
        : canon(obj),\n        \"lineage\": obj[\"lineage\"],\n        \"next_stage\": obj[\"next_stage\"],\n    }\n    OUT_MAN.write_text(json.dumps(man,\
        \ indent=2, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n    print(json.dumps({\n        \"decision\": obj[\"decision\"\
        ],\n        \"challenge_count\": obj[\"development_catalog_preregistration\"][\"challenge_count\"],\n        \"topologies\"\
        : obj[\"scope\"][\"topologies\"],\n        \"candidate_models\": list(obj[\"candidate_family\"]),\n        \"mock_trade_voting_required\"\
        : obj[\"mock_vote_transport\"][\"mock_trade_voting_required\"],\n        \"distinct_voter_hard_cap\": obj[\"mock_vote_transport\"\
        ][\"distinct_voter_hard_cap\"],\n        \"new_votes_read\": False,\n        \"candidate_fit_performed\": False,\n\
        \        \"production_change_authorized\": False,\n        \"next_stage\": obj[\"next_stage\"],\n    }, indent=2))\n\
        \ndef check():\n    obj = load(OUT)\n    man = load(OUT_MAN)\n    assert obj[\"decision\"] == DECISION\n    assert\
        \ obj[\"status\"] == \"FROZEN_PRE_VOTE_PRE_CATALOG_PRE_FIT\"\n    assert obj[\"new_mock_trade_votes_exist_or_were_read\"\
        ] is False\n    assert obj[\"candidate_fit_performed\"] is False\n    assert obj[\"production_change_authorized\"\
        ] is False\n    assert obj[\"development_catalog_preregistration\"][\"challenge_count\"] == 40\n    assert sum(obj[\"\
        development_catalog_preregistration\"][\"topology_counts\"].values()) == 40\n    assert obj[\"mock_vote_transport\"\
        ][\"distinct_voter_hard_cap\"] == 50\n    assert obj[\"scope\"][\"draft_picks_in_primary_development\"] is False\n\
        \    assert obj[\"mixed_asset_extension\"][\"status\"] == \"BLOCKED_PENDING_INDEPENDENT_PICK_PLAYER_BRIDGE\"\n   \
        \ assert obj[\"motivation\"][\"mixed_asset_real_trade_fixture\"][\"human_outcome_label\"] is None\n    assert set(obj[\"\
        candidate_family\"]) == {\n        \"C0_RAW_SUM\", \"C1_V6_Q_TRANSFER\", \"C2_GLOBAL_Q\", \"C3_APEX_REMAINDER\"\n\
        \    }\n    assert man[\"preregistration_sha256\"] == sha(OUT)\n    assert man[\"preregistration_markdown_sha256\"\
        ] == sha(OUT_MD)\n    assert man[\"canonical_preregistration_sha256\"] == canon(obj)\n    validate_predecessors()\n\
        \    validate_candidate_math()\n    print(\"PASS: Package Adjustment V7 Phase 1 preregistration revalidated.\")\n\n\
        if __name__ == \"__main__\":\n    import argparse\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--write\"\
        , action=\"store_true\")\n    ap.add_argument(\"--check\", action=\"store_true\")\n    a = ap.parse_args()\n    if\
        \ a.write == a.check:\n        raise SystemExit(\"choose exactly one of --write or --check\")\n    write() if a.write\
        \ else check()\nPY\npython3 -m py_compile \"${RUNNER_TEMP}/build_pkgv7_phase1.py\"\n"
    - name: Freeze multi-v-multi architecture
      shell: bash
      run: |
        set -euo pipefail
        python3 "${RUNNER_TEMP}/build_pkgv7_phase1.py" --write
        python3 "${RUNNER_TEMP}/build_pkgv7_phase1.py" --check
    - name: Prove exact research-only mutation scope
      shell: bash
      run: |-
        set -euo pipefail
        mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort)
        expected=(
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_manifest_v1.json
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.md
        )
        diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
        echo 'PASS: exact research-only mutation scope.'
    - name: Run production and repository regressions
      shell: bash
      run: |-
        set -euo pipefail
        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
        restore_tu(){ git checkout -- "$TU_JSON" "$TU_MD"; }
        trap restore_tu EXIT
        python3 scripts/projections/build_team_utility_lineup_projections.py --write
        python3 scripts/validation/check_package_adjustment_live.py
        python3 scripts/validation/repo_regression_checks.py
        restore_tu
        trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"
        echo 'PASS: existing production package adjustment and full repo regression remain green.'
    - name: Commit Phase 1 preregistration
      shell: bash
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      run: |-
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.md \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_manifest_v1.json
        git diff --cached --quiet && { echo 'ERROR: no Phase 1 artifacts staged'; exit 1; }
        git commit -m "Freeze Package Adjustment V7 multi-v-multi Phase 1"

        git fetch origin main

        critical=(
          research/package-adjustment-v7/phase0_pick_player_scale_bridge_v1.json
          research/package-adjustment-v7/phase0_pick_player_scale_bridge_manifest_v1.json
          research/package-adjustment-v6/production_candidate_v1.json
          research/package-adjustment-v6/development_preregistration_v1.json
          research/package-adjustment-v6/prospective_preregistration_v1.json
          research/package-adjustment-production-candidate-v1/live_deployment.json
          scripts/validation/check_package_adjustment_live.py
        )
        for p in "${critical[@]}"; do
          test "$(git rev-parse "$BASE_SHA:$p")" = "$(git rev-parse "origin/main:$p")" || {
            echo "ERROR: package scientific predecessor changed during Phase 1 freeze: $p"
            exit 1
          }
        done

        for p in \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.md \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_manifest_v1.json
        do
          if git cat-file -e "origin/main:$p" 2>/dev/null; then
            echo "ERROR: Phase 1 output appeared on main during this run: $p"
            exit 1
          fi
        done

        git rebase origin/main
        python3 "${RUNNER_TEMP}/build_pkgv7_phase1.py" --check
        python3 scripts/validation/check_package_adjustment_live.py
        git push origin HEAD:main
        echo 'PASS: Package Adjustment V7 Phase 1 preregistration committed; voting remains inactive.'
