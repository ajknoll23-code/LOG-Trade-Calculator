# PREFLIGHTED: PACKAGE_ADJUSTMENT_V7_PHASE1_MULTI_V_MULTI_PREREGISTRATION_V1
name: Package Adjustment V7 - Phase 1 Multi-v-Multi Preregistration
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture Phase 1 base
      id: base
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install regression dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard V6/V7 lineage and controlled-live package behavior
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        declare -A EXPECTED=(
          ["research/package-adjustment-v7/phase0_pick_player_scale_bridge_v1.json"]="58f8cf0373d0978567808aec05bcf3fe3f8c57fc"
          ["research/package-adjustment-v7/phase0_pick_player_scale_bridge_manifest_v1.json"]="1efe7360ec4e84a7a260224f27176271292c1d1e"
          ["research/package-adjustment-v6/production_candidate_v1.json"]="9abaf2c01890da3abb0d13ae4d57cb37b91a08e2"
          ["research/package-adjustment-v6/development_preregistration_v1.json"]="81f20cb8afd78f624153c3337377f56ebf8115ae"
          ["research/package-adjustment-v6/prospective_preregistration_v1.json"]="d0000c9f42c7be11a8d49d0029993a28fabebc73"
          ["research/package-adjustment-production-candidate-v1/live_deployment.json"]="fb192d6d52ca302f9694adc3ae39c7f1047f6140"
          ["scripts/validation/check_package_adjustment_live.py"]="3c924d762f93fd93b9943afe090deda6a2b7d8a0"
        )
        for p in "${!EXPECTED[@]}"; do
          a="$(git hash-object "$p")"
          test "$a" = "${EXPECTED[$p]}" || { echo "ERROR: frozen package predecessor drift $p expected=${EXPECTED[$p]} actual=$a"; exit 1; }
        done
        for p in \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.md \
          research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_manifest_v1.json
        do
          test ! -e "$p" || { echo "ERROR: Phase 1 output already exists: $p"; exit 1; }
        done
        python3 scripts/validation/check_package_adjustment_live.py
        echo 'PASS: frozen V6/V7 package lineage and current controlled-live behavior verified.'
    - name: Write Phase 1 preregistration builder
      shell: bash
      run: "set -euo pipefail\ncat > \"${RUNNER_TEMP}/build_pkgv7_phase1.py\" <<'PY'\n#!/usr/bin/env python3\nfrom __future__\
        \ import annotations\n\nimport hashlib\nimport json\nimport math\nfrom datetime import datetime, timezone\nfrom pathlib\
        \ import Path\n\nROOT = Path.cwd()\nV7 = ROOT / \"research\" / \"package-adjustment-v7\"\nV6 = ROOT / \"research\"\
        \ / \"package-adjustment-v6\"\nLIVE = ROOT / \"research\" / \"package-adjustment-production-candidate-v1\" / \"live_deployment.json\"\
        \nINDEX = ROOT / \"index.html\"\n\nPHASE0 = V7 / \"phase0_pick_player_scale_bridge_v1.json\"\nPHASE0_MAN = V7 / \"\
        phase0_pick_player_scale_bridge_manifest_v1.json\"\nV6_PROD = V6 / \"production_candidate_v1.json\"\nV6_DEV_PRE =\
        \ V6 / \"development_preregistration_v1.json\"\nV6_PROS_PRE = V6 / \"prospective_preregistration_v1.json\"\n\nOUT\
        \ = V7 / \"phase1_multi_vs_multi_preregistration_v1.json\"\nOUT_MD = V7 / \"phase1_multi_vs_multi_preregistration_v1.md\"\
        \nOUT_MAN = V7 / \"phase1_multi_vs_multi_preregistration_manifest_v1.json\"\n\nSTUDY_ID = \"package-adjustment-v7-multi-v-multi\"\
        \nDECISION = \"FREEZE_V7_MULTI_V_MULTI_PHASE1_ARCHITECTURE_POWER_AND_CATALOG_NEXT\"\nQ_V6 = 2.9897594788655337\n\n\
        MOTIVATING_CASE = {\n    \"case_id\": \"user_real_trade_2026_09_sherwood_mixed_asset\",\n    \"source\": \"user-provided\
        \ calculator screenshot; structural fixture only\",\n    \"side_A\": [\n        {\"type\": \"player\", \"name\": \"\
        Jacob Rodriguez\", \"position\": \"LB\", \"fv\": 2057},\n        {\"type\": \"player\", \"name\": \"Abdul Carter\"\
        , \"position\": \"DL\", \"fv\": 4231},\n        {\"type\": \"pick\", \"name\": \"2027 Rd 2 (mid)\", \"fv\": 3624},\n\
        \        {\"type\": \"player\", \"name\": \"Sam Darnold\", \"position\": \"QB\", \"fv\": 4434},\n    ],\n    \"side_B\"\
        : [\n        {\"type\": \"player\", \"name\": \"Kyler Murray\", \"position\": \"QB\", \"fv\": 3966},\n        {\"\
        type\": \"player\", \"name\": \"Jamien Sherwood\", \"position\": \"LB\", \"fv\": 4801},\n        {\"type\": \"player\"\
        , \"name\": \"Marvin Harrison\", \"position\": \"WR\", \"fv\": 3599},\n    ],\n    \"raw_total_A\": 14346,\n    \"\
        raw_total_B\": 12366,\n    \"raw_gap_A_minus_B\": 1980,\n    \"highest_player_fv_name\": \"Jamien Sherwood\",\n  \
        \  \"highest_player_fv\": 4801,\n    \"observed_live_verdict\": \"SLIGHTLY FAVORS SIDE A\",\n    \"human_outcome_label\"\
        : None,\n    \"may_be_used_to_fit_or_select_model\": False,\n    \"may_be_used_as_production_acceptance_target\":\
        \ False,\n    \"purpose\": (\n        \"Expose the unsupported mixed-asset multi-v-multi topology. \"\n        \"\
        The study must not be tuned to force either side to win.\"\n    ),\n}\n\nTOPOLOGY_COUNTS = {\n    \"2v2\": 6,\n  \
        \  \"2v3\": 8,\n    \"2v4\": 6,\n    \"3v3\": 6,\n    \"3v4\": 8,\n    \"4v4\": 6,\n}\n\ndef sha(path: Path) -> str:\n\
        \    return hashlib.sha256(path.read_bytes()).hexdigest()\n\ndef canon(obj) -> str:\n    return hashlib.sha256(\n\
        \        json.dumps(obj, sort_keys=True, separators=(\",\", \":\"), ensure_ascii=False).encode()\n    ).hexdigest()\n\
        \ndef load(path: Path):\n    return json.loads(path.read_text(encoding=\"utf-8\"))\n\ndef power_score(vals, q):\n\
        \    assert vals and q > 1\n    return sum(float(v) ** q for v in vals) ** (1.0 / q)\n\ndef apex_remainder_score(vals,\
        \ lam):\n    vals = [float(v) for v in vals]\n    m = max(vals)\n    return m + lam * (sum(vals) - m)\n\ndef validate_predecessors():\n\
        \    p0 = load(PHASE0)\n    p0m = load(PHASE0_MAN)\n    v6 = load(V6_PROD)\n    dev = load(V6_DEV_PRE)\n    pros =\
        \ load(V6_PROS_PRE)\n    live = load(LIVE)\n    idx = INDEX.read_text(encoding=\"utf-8\")\n\n    assert p0[\"decision\"\
        ] == \"INVESTIGATE_DRAFT_PICK_TO_PLAYER_FV_BRIDGE_BEFORE_V7_PHASE1\"\n    assert p0[\"package_adjustment_changed\"\
        ] is False\n    assert p0[\"draft_pick_values_changed\"] is False\n    assert p0[\"production_change_authorized\"\
