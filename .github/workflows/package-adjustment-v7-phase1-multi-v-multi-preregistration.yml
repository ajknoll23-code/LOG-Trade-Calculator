        \    assert sum([3000, 2000]) == 5000\n    # Apex-remainder endpoints: lambda=1 is raw sum, lambda=0 is max.\n   \
        \ vals = [3000, 1400, 600]\n    assert apex_remainder_score(vals, 1.0) == sum(vals)\n    assert apex_remainder_score(vals,\
        \ 0.0) == max(vals)\n\ndef build():\n    validate_predecessors()\n    validate_candidate_math()\n\n    p0 = load(PHASE0)\n\
        \    v6 = load(V6_PROD)\n    dev = load(V6_DEV_PRE)\n    pros = load(V6_PROS_PRE)\n    generated = datetime.now(timezone.utc).isoformat()\n\
        \n    result = {\n        \"schema_version\": 1,\n        \"study_id\": STUDY_ID,\n        \"stage\": \"phase1_multi_vs_multi_structural_preregistration\"\
        ,\n        \"status\": \"FROZEN_PRE_VOTE_PRE_CATALOG_PRE_FIT\",\n        \"generated_at_utc\": generated,\n      \
        \  \"decision\": DECISION,\n        \"research_only\": True,\n        \"production_change_authorized\": False,\n \
        \       \"automatic_production_promotion_allowed\": False,\n        \"new_mock_trade_votes_exist_or_were_read\": False,\n\
        \        \"candidate_fit_performed\": False,\n        \"candidate_scores_used_to_select_challenges\": False,\n   \
        \     \"live_package_adjustment_changed\": False,\n        \"fundamental_value_changed\": False,\n        \"market_value_changed\"\
        : False,\n        \"draft_pick_value_changed\": False,\n        \"team_utility_changed\": False,\n        \"research_question\"\
        : (\n            \"For player-only trades where both sides contain multiple meaningful assets, \"\n            \"\
        does a symmetric concentration-aware side score predict human dynasty trade \"\n            \"preference better than\
        \ raw FV addition while preserving scale, side-swap \"\n            \"symmetry, monotonicity, and the already-validated\
        \ one-vs-package production path?\"\n        ),\n        \"motivation\": {\n            \"current_live_gap\": (\n\
        \                \"Production V1.7 fails closed on multi-v-multi trades and on any trade \"\n                \"containing\
        \ a draft pick, so supported verdict totals fall back to raw FV.\"\n            ),\n            \"mixed_asset_real_trade_fixture\"\
        : MOTIVATING_CASE,\n            \"fixture_is_not_answer_key\": True,\n        },\n        \"scope\": {\n         \
        \   \"primary_development_scope\": \"player-only multi-v-multi\",\n            \"supported_player_positions\": [\"\
        QB\", \"RB\", \"WR\", \"TE\", \"DL\", \"LB\", \"DB\"],\n            \"side_asset_count_min\": 2,\n            \"side_asset_count_max\"\
        : 4,\n            \"topologies\": list(TOPOLOGY_COUNTS),\n            \"legacy_one_vs_package_path_must_remain_byte_behavior_equivalent\"\
        : True,\n            \"one_vs_one_behavior_unchanged\": True,\n            \"draft_picks_in_primary_development\"\
        : False,\n            \"why_picks_are_blocked\": (\n                \"V7 Phase 0 found a material pick/player FV scale\
