        \        \"candidate_family\": {\n            \"C0_RAW_SUM\": {\n                \"role\": \"production-style multi-v-multi\
        \ fallback baseline\",\n                \"score\": \"sum(v_i)\",\n                \"free_score_parameters\": 0,\n\
        \                \"eligible_for_selection\": False,\n            },\n            \"C1_V6_Q_TRANSFER\": {\n       \
        \         \"role\": \"zero-new-score-parameter transfer of validated V6 concentration geometry\",\n              \
        \  \"score\": \"(sum(v_i**q_v6))**(1/q_v6)\",\n                \"q_v6\": Q_V6,\n                \"free_score_parameters\"\
        : 0,\n                \"eligible_for_selection\": True,\n                \"interpretation\": (\n                 \
        \   \"Exact symmetric extension of the frozen V6 C2 package score to both \"\n                    \"multi-asset sides.\
        \ This does not assume it will transfer successfully.\"\n                ),\n            },\n            \"C2_GLOBAL_Q\"\
        : {\n                \"role\": \"one-parameter multi-v-multi power-norm candidate\",\n                \"score\": \"\
        (sum(v_i**q))**(1/q)\",\n                \"q_bounds\": [1.05, 6.0],\n                \"free_score_parameters\": 1,\n\
        \                \"eligible_for_selection\": True,\n            },\n            \"C3_APEX_REMAINDER\": {\n       \
        \         \"role\": \"one-parameter alternative architecture\",\n                \"score\": \"max(v_i) + lambda*(sum(v_i)-max(v_i))\"\
        ,\n                \"lambda_bounds\": [0.0, 1.0],\n                \"free_score_parameters\": 1,\n               \
        \ \"eligible_for_selection\": True,\n                \"interpretation\": (\n                    \"Separates apex value\
        \ from remainder value without assuming a power norm.\"\n                ),\n            },\n        },\n        \"\
        shared_vote_probability_layer\": {\n            \"form\": \"logit(P(left)) = beta * log(score_left/score_right) +\
        \ delta_left\",\n            \"beta_bounds\": [0.05, 25.0],\n            \"delta_left_bounds\": [-0.75, 0.75],\n \
        \           \"beta_and_delta_are_nuisance_parameters\": True,\n            \"same_probability_layer_required_for_all_candidates\"\
        : True,\n            \"display_side_randomization_required\": True,\n            \"side_swap_identity\": \"P(left=A,B)\
        \ + P(left=B,A) = 1 when delta_left=0\",\n        },\n        \"mathematical_invariants\": {\n            \"strict_positive_score_for_positive_assets\"\
        : True,\n            \"positive_homogeneity_degree_1\": True,\n            \"monotone_non_decreasing_in_each_asset\"\
        : True,\n            \"single_asset_identity_if_used_for_diagnostic\": \"score([v]) == v\",\n            \"permutation_invariant_within_side\"\
        : True,\n            \"side_label_symmetric\": True,\n            \"no_player_position_specific_score_parameters\"\
        : True,\n            \"no_named_player_parameters\": True,\n            \"no_roster_specific_parameters\": True,\n\
        \            \"no_market_value_inputs\": True,\n            \"no_team_utility_inputs\": True,\n        },\n      \
        \  \"development_catalog_preregistration\": {\n            \"challenge_count\": 40,\n            \"all_40_presented_to_each_participating_voter\"\
        : True,\n            \"partial_completion_may_be_retained\": True,\n            \"topology_counts\": TOPOLOGY_COUNTS,\n\
        \            \"topology_counts_sum_to_40\": sum(TOPOLOGY_COUNTS.values()) == 40,\n            \"candidate_blind_generation\"\
        : True,\n            \"candidate_predictions_may_not_select_or_reject_challenges\": True,\n            \"fv_values_visible_to_voter\"\
        : False,\n            \"vote_prompt\": \"Which side would you rather have in this dynasty league?\",\n           \
        \ \"canonical_choices\": [\"A\", \"B\"],\n            \"tie_choice_allowed\": False,\n            \"display_side_randomized_per_voter_and_challenge\"\
        : True,\n            \"challenge_order_randomized_per_voter\": True,\n            \"raw_sum_ratio_design\": {\n  \
        \              \"definition\": \"min(raw_sum_A,raw_sum_B)/max(raw_sum_A,raw_sum_B)\",\n                \"minimum\"\
        : 0.92,\n                \"maximum\": 1.0,\n                \"purpose\": (\n                    \"Keep choices near\
        \ enough to parity to reveal concentration preference \"\n                    \"without constructing challenges from\
        \ candidate predictions.\"\n                ),\n            },\n            \"concentration_design_is_candidate_blind\"\
        : {\n                \"metrics\": [\"top_asset_share\", \"HHI\"],\n                \"required_contrast_bands\": [\"\
        low\", \"moderate\", \"high\"],\n                \"both_directions_required\": True,\n            },\n           \
        \ \"player_selection\": {\n                \"source\": \"frozen LOG player FV snapshot generated after this preregistration\"\
        ,\n                \"programmatic_only\": True,\n                \"no_manual_cherry_picking_after_catalog_generation\"\
        : True,\n                \"no_same_player_on_both_sides_of_one_challenge\": True,\n                \"maximum_appearances_per_named_player\"\
