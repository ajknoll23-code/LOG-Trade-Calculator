        display_side_randomization_required\"] is True\n    assert dev[\"development_cross_validation\"][\"fold_count\"] ==\
        \ 5\n    assert dev[\"uncertainty_and_robustness\"][\"required_uncertainty_method\"].startswith(\n        \"crossed/two-way\
        \ voter-and-challenge cluster\"\n    )\n    assert pros[\"prospective_transport_and_sampling_contract\"][\"fv_visible_to_voter\"\
        ] is False\n\n    assert live[\"production_revision\"] == \"v1.7-v6-size3-c2-overlay\"\n    assert live[\"production_formula_enabled\"\
        ] is True\n\n    # Behavioral/semantic guards on current production without pinning the entire\n    # generated index\
        \ file, which normal maintenance may legitimately refresh.\n    assert \"size3V6Q: 2.9897594788655337\" in idx\n \
        \   assert \"reason:'multi_vs_multi'\" in idx\n    assert \"Package Adjustment is calibrated only for one player versus\
        \ a consolidation package.\" in idx\n    assert \"reason:'player_only_scope'\" in idx\n    assert \"if(allAssets.some(a\
        \ => a.type !== 'player'))\" in idx\n\ndef validate_candidate_math():\n    test_vectors = [\n        [5000],\n   \
        \     [3000, 2000],\n        [2500, 1600, 900],\n        [2200, 1500, 900, 400],\n    ]\n    for vals in test_vectors:\n\
        \        assert math.isclose(power_score([vals[0]], Q_V6), vals[0], rel_tol=0, abs_tol=1e-9)\n        for q in (1.05,\
        \ 1.5, Q_V6, 6.0):\n            s = power_score(vals, q)\n            assert s > 0\n            for i in range(len(vals)):\n\
        \                bumped = vals[:]\n                bumped[i] += 1\n                assert power_score(bumped, q) >\
        \ s\n            c = 3.7\n            assert math.isclose(\n                power_score([c*x for x in vals], q),\n\
        \                c*s,\n                rel_tol=1e-12,\n                abs_tol=1e-9,\n            )\n        for lam\
        \ in (0.0, 0.25, 0.5, 1.0):\n            s = apex_remainder_score(vals, lam)\n            for i in range(len(vals)):\n\
        \                bumped = vals[:]\n                bumped[i] += 1\n                assert apex_remainder_score(bumped,\
        \ lam) >= s\n            c = 4.1\n            assert math.isclose(\n                apex_remainder_score([c*x for\
        \ x in vals], lam),\n                c*s,\n                rel_tol=1e-12,\n                abs_tol=1e-9,\n       \
        \     )\n    # Fragmentation at equal raw sum must be discounted by q>1.\n    assert power_score([5000], Q_V6) > power_score([2500,\
