name: B10D Package Adjustment V9 - P6 Final Launch Checklist V2 Pre-Distribution Eligibility Freeze Repair

'on':
  workflow_dispatch:
    inputs:
      web_app_deployment_version:
        description: 'Confirm the active existing web-app deployment version shown in Apps Script Manage deployments'
        required: true
        default: '3'
        type: string
      exact_v4_no_edits:
        description: 'Confirm Code.gs was the exact frozen V4 source with no manual edits'
        required: true
        default: 'EXACT_V4_NO_EDITS'
        type: choice
        options:
          - EXACT_V4_NO_EDITS
      private_sheet_not_shared:
        description: 'Confirm the V9 private validation spreadsheet remains private/not published'
        required: true
        default: 'PRIVATE_NOT_SHARED_OR_PUBLISHED'
        type: choice
        options:
          - PRIVATE_NOT_SHARED_OR_PUBLISHED
      owner_no_peek_commitment:
        description: 'Commit not to open the private V9 sheet or inspect choice-bearing execution payloads until the outcome-blind monitor reaches 40/40'
        required: true
        default: 'I_AGREE_NO_PEEK_UNTIL_40_OF_40'
        type: choice
        options:
          - I_AGREE_NO_PEEK_UNTIL_40_OF_40

permissions:
  contents: write

concurrency:
  group: b10d-package-adjustment-v9-p6-final-launch-checklist
  cancel-in-progress: false

jobs:
  verify-and-record-p6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify operator P6 attestations
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.web_app_deployment_version }}
          INPUT_SOURCE: ${{ inputs.exact_v4_no_edits }}
          INPUT_PRIVACY: ${{ inputs.private_sheet_not_shared }}
          INPUT_NO_PEEK: ${{ inputs.owner_no_peek_commitment }}
        run: |
          set -euo pipefail
          test "$INPUT_VERSION" = '3' || { echo "Expected web-app deployment version 3, got $INPUT_VERSION"; exit 1; }
          test "$INPUT_SOURCE" = 'EXACT_V4_NO_EDITS'
          test "$INPUT_PRIVACY" = 'PRIVATE_NOT_SHARED_OR_PUBLISHED'
          test "$INPUT_NO_PEEK" = 'I_AGREE_NO_PEEK_UNTIL_40_OF_40'
          echo 'PASS: operator P6 attestations captured.'

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet requests

      - name: Verify P1-P5 durable lineage and frozen source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          repo = Path('.')
          b9_path = repo / 'research/package-adjustment-v9/b9-voting-transport-launch-parity/b9_manifest.json'
          b8_transport_path = repo / 'research/package-adjustment-v9/b8-human-catalog-assignment-freeze/b8_voting_transport_contract.json'
          b10b_path = repo / 'research/package-adjustment-v9/b10b-private-collector-launch-preconditions-p1-p4-v5/b10b_probe_result.json'
          b10c_path = repo / 'research/package-adjustment-v9/b10c-p5-outcome-blind-monitoring-freeze/b10c_p5_result.json'
          source_path = repo / 'research/package-adjustment-v9/b10c-p5-outcome-blind-monitoring-freeze/b10r_full_merged_private_collector_v4_p5_monitor.gs'
          index_path = repo / 'index.html'
          pipeline_path = repo / 'scripts/market/ktc_pipeline.py'

          for p in [b9_path, b8_transport_path, b10b_path, b10c_path, source_path, index_path, pipeline_path]:
              if not p.exists():
                  raise RuntimeError(f'B10D_MISSING_REQUIRED_FILE {p}')

          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          b9 = json.loads(b9_path.read_text())
          b8_transport = json.loads(b8_transport_path.read_text())
          b10b = json.loads(b10b_path.read_text())
          b10c = json.loads(b10c_path.read_text())

          assert b9['decision'] == 'PASS_B9_LAUNCH_PARITY_DEPLOY_TRANSPORT_URL_DISTRIBUTION_CONDITIONAL_ON_P1_TO_P6'
          assert b9['b8_freeze_commit'] == '2ff1ca2a6ea440f2e1a4c390ae974a9666e9912a'
          assert b9['b8_catalog_signature_set_sha256'] == 'dd6391691c91e0ee8172fb3a89b0b53417432e8aaf991f2ab048048a715cac62'
          assert b9['transport_block_sha256'] == '9750dc02cdc3b65874a48211d3e7c86c5f6bd9b401855775254ef0c3cc0d5dca'
          assert b9['human_outcome_analysis_authorized'] is False
          assert sha(b8_transport_path) == '6f8ae9e91efdbebe1cfe991134f3ea3afe05953e02b73ba64603ad72728d6b17'
          assert b8_transport['slot_url_shape'] == 'index.html?pkgv9slot=<1..40>#market-research'
          assert b8_transport['slot_query_parameter'] == 'pkgv9slot'
          assert b8_transport['response_eligibility']['voter_eligibility'].startswith('one person per slot;')
          assert 'earliest final-vote timestamp' in b8_transport['response_eligibility']['accepted_session_per_slot']
          assert b9['production_v9_activation_authorized'] is False
          assert b9['voter_slots'] == 40 and b9['ballots_per_slot'] == 24

          assert b10b['decision'] == 'PASS_B10B_P1_TO_P4_PRIVATE_COLLECTOR_VERIFIED'
          assert b10b['all_p1_to_p4_passed'] is True
          assert b10b['p1_live_browser_hash_verified'] is True
          assert b10b['p1_live_html_exact_sha256_match'] is True
          assert b10b['p2_private_collector_acceptance'] is True
          assert b10b['p3_ktc_isolation'] is True
          assert b10b['p3_split_before_daily_cap'] is True
          assert b10b['p4_no_public_outcome_exposure'] is True
          assert b10b['human_outcomes_read'] is False

          assert b10c['decision'] == 'PASS_B10C_P5_OUTCOME_BLIND_STRUCTURAL_MONITORING_FREEZE_AUTHORIZE_EXACT_MONITOR_SOURCE_DEPLOYMENT'
          assert b10c['exact_monitor_source_deployment_authorized'] is True
          assert b10c['p5_outcome_blind_monitoring_frozen'] is True
          assert b10c['human_outcomes_read'] is False
          assert b10c['human_outcome_analysis_authorized'] is False
          assert b10c['human_voting_url_distribution_authorized'] is False
          assert b10c['production_v9_activation_authorized'] is False
          assert b10c['intended_collector_source_sha256'] == '731c96c69d705ffbee21c4bb0715618ad98df0233aa3feb9ff93abe96aca35ad'
          assert sha(source_path) == '731c96c69d705ffbee21c4bb0715618ad98df0233aa3feb9ff93abe96aca35ad'

          # Final drift guards on the two production files B9 froze.
          assert sha(index_path) == b9['patched_index_sha256'], (sha(index_path), b9['patched_index_sha256'])
          assert sha(pipeline_path) == b9['patched_ktc_pipeline_sha256'], (sha(pipeline_path), b9['patched_ktc_pipeline_sha256'])

          print('PASS: P1-P5 lineage, exact B8 transport contract, exact V4 source, index.html and KTC isolation pipeline are frozen and intact.')
          PY

      - name: Verify live deployment, outcome-blind monitor, privacy, and public smoke vote
        shell: bash
        env:
          WEB_APP_URL: https://script.google.com/macros/s/AKfycbynz6A8jNOQonJhHtZW7DEx36PYTBXi_klXnacKF7I4kACPbTJIA5YFjY5ILxqpwgm8aw/exec
          PUBLIC_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTuKORGumlKJmUmBdeNWPstkj8VRjPoVkylbqHv1KqwoyziJYOUlkZUKRsSxzB3qHXmyjjLpGpH6W03/pub?gid=458294959&single=true&output=csv
          PRIVATE_EXPORT_URL: https://docs.google.com/spreadsheets/d/1F9FVasO1nSRJO4IBMwA9sq1OCPxoVMfW_DRD3fNhr7c/export?format=csv&gid=529225599
          PRIVATE_GVIZ_URL: https://docs.google.com/spreadsheets/d/1F9FVasO1nSRJO4IBMwA9sq1OCPxoVMfW_DRD3fNhr7c/gviz/tq?tqx=out:csv&gid=529225599
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io, json, os, time
          import requests

          WEB_APP_URL = os.environ['WEB_APP_URL']
          PUBLIC_CSV_URL = os.environ['PUBLIC_CSV_URL']
          PRIVATE_EXPORT_URL = os.environ['PRIVATE_EXPORT_URL']
          PRIVATE_GVIZ_URL = os.environ['PRIVATE_GVIZ_URL']

          expected_smoke = {
              'timestamp': '2026-10-06T12:58:49.983Z',
              'voter_roster_id': 'ext_57ktzcmy',
              'keep': 'jihaad campbell',
              'trade': 'evan williams',
              'cut': 'lukas van ness',
          }

          s = requests.Session()
          s.headers.update({'User-Agent': 'LOG-Trade-Calculator-B10D-P6/2.0'})

          def get(url, tries=6, timeout=60):
              last = None
              for i in range(tries):
                  try:
                      r = s.get(url, timeout=timeout, allow_redirects=True)
                      return r
                  except Exception as exc:
                      last = exc
                      if i + 1 < tries:
                          time.sleep(2 * (i + 1))
              raise RuntimeError(f'GET failed after retries: {url}: {last}')

          # Live P5 structural endpoint. Exact public shape only; no human outcomes.
          r = get(WEB_APP_URL + '?mode=v9_structural_status')
          if r.status_code != 200:
              raise RuntimeError(f'B10D_MONITOR_HTTP_{r.status_code}')
          monitor_http_status = r.status_code
          try:
              m = r.json()
          except Exception as exc:
              raise RuntimeError(f'B10D_MONITOR_NOT_JSON {exc}')

          expected_top = {'ok','monitor_schema','study_id','outcome_blind','all_40_slots_complete','unassigned_invalid_rows','slots'}
          if set(m.keys()) != expected_top:
              raise RuntimeError(f'B10D_MONITOR_TOP_KEYS_MISMATCH {sorted(m.keys())}')
          if m['ok'] is not True or m['monitor_schema'] != 1 or m['outcome_blind'] is not True:
              raise RuntimeError('B10D_MONITOR_NOT_HEALTHY_OUTCOME_BLIND')
          if m['study_id'] != 'package-adjustment-v9-discordant-human-validation':
              raise RuntimeError('B10D_MONITOR_STUDY_ID_MISMATCH')
          if m['all_40_slots_complete'] is not False:
              raise RuntimeError('B10D_UNEXPECTED_PRELAUNCH_MATURITY')
          if m['unassigned_invalid_rows'] != 0:
              raise RuntimeError(f'B10D_PRELAUNCH_UNASSIGNED_INVALID_ROWS_{m["unassigned_invalid_rows"]}')
          slots = m['slots']
          if not isinstance(slots, list) or len(slots) != 40:
              raise RuntimeError('B10D_MONITOR_SLOT_COUNT_MISMATCH')
          expected_slot_keys = {'slot','candidate_sessions','valid_sessions','complete_sessions','invalid_sessions','accepted_complete'}
          for i, row in enumerate(slots, 1):
              if set(row.keys()) != expected_slot_keys:
                  raise RuntimeError(f'B10D_SLOT_KEYS_MISMATCH slot={i}')
              if row['slot'] != i:
                  raise RuntimeError(f'B10D_SLOT_ORDER_MISMATCH expected={i} actual={row["slot"]}')
              if any(row[k] != 0 for k in ['candidate_sessions','valid_sessions','complete_sessions','invalid_sessions']):
                  raise RuntimeError(f'B10D_REAL_VOTER_ACTIVITY_BEFORE_AUTHORIZATION slot={i}')
              if row['accepted_complete'] is not False:
                  raise RuntimeError(f'B10D_ACCEPTED_SESSION_BEFORE_AUTHORIZATION slot={i}')

          # Cheap live fingerprints for the preserved B10R V2 doGet paths.
          r2 = get(WEB_APP_URL + '?mode=v9_launchtest_status&session=zz')
          if r2.status_code != 200 or r2.json() != {'ok': False, 'error': 'invalid_session'}:
              raise RuntimeError('B10D_LAUNCHTEST_HANDLER_FINGERPRINT_MISMATCH')
          r3 = get(WEB_APP_URL + '?mode=b10d_unknown_mode')
          if r3.status_code != 200 or r3.json() != {'ok': False, 'error': 'unsupported_mode'}:
              raise RuntimeError('B10D_DOGET_FALLBACK_FINGERPRINT_MISMATCH')

          # Ordinary post-deployment KTC smoke vote must exist in the public CSV.
          r = get(PUBLIC_CSV_URL)
          if r.status_code != 200:
              raise RuntimeError(f'B10D_PUBLIC_CSV_HTTP_{r.status_code}')
          rows = list(csv.DictReader(io.StringIO(r.text)))

          # Google publish-to-web can render a timestamp either as the original ISO
          # string or as a spreadsheet-local formatted value. Require the other four
          # smoke fields exactly and accept only the same instant (allowing display
          # formats that drop milliseconds/seconds) interpreted as UTC or Phoenix time.
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          expected_dt = datetime.fromisoformat(expected_smoke['timestamp'].replace('Z', '+00:00')).astimezone(timezone.utc)

          def ts_ok(value):
              v = str(value or '').strip()
              if v == expected_smoke['timestamp']:
                  return True
              parsed = []
              try:
                  d = datetime.fromisoformat(v.replace('Z', '+00:00'))
                  parsed.append((d, 'iso'))
              except ValueError:
                  pass
              for fmt in ('%m/%d/%Y %H:%M:%S', '%Y-%m-%d %H:%M:%S', '%m/%d/%Y %H:%M'):
                  try:
                      parsed.append((datetime.strptime(v, fmt), fmt))
                  except ValueError:
                      pass
              for d, fmt in parsed:
                  precision_seconds = 60.0 if fmt == '%m/%d/%Y %H:%M' else 1.1
                  if d.tzinfo is not None:
                      candidates = [d.astimezone(timezone.utc)]
                  else:
                      candidates = [
                          d.replace(tzinfo=timezone.utc),
                          d.replace(tzinfo=ZoneInfo('America/Phoenix')).astimezone(timezone.utc),
                      ]
                  if any(abs((c - expected_dt).total_seconds()) <= precision_seconds for c in candidates):
                      return True
              return False

          def smoke_row_matches(row):
              if not ts_ok(row.get('timestamp')):
                  return False
              return all(str(row.get(k, '')) == v for k, v in expected_smoke.items() if k != 'timestamp')

          smoke_found = any(smoke_row_matches(row) for row in rows)
          if not smoke_found:
              raise RuntimeError('B10D_POST_DEPLOYMENT_ORDINARY_KTC_SMOKE_ROW_NOT_FOUND')

          # P3/P4 still fail closed: no V9 or launch-test rows may be publicly visible.
          public_text = r.text
          if '__pkgv9val__|' in public_text or 'pkgv9val_LAUNCHTEST' in public_text:
              raise RuntimeError('B10D_V9_ROW_EXPOSED_IN_PUBLIC_CSV')

          # Private destination must remain anonymously unreadable.
          privacy = {}
          for label, url in [('export', PRIVATE_EXPORT_URL), ('gviz', PRIVATE_GVIZ_URL)]:
              pr = get(url)
              body = pr.text[:4096].lower()
              readable = pr.status_code == 200 and 'timestamp' in body and 'voter_roster_id' in body and 'keep' in body
              privacy[label] = {'status': pr.status_code, 'readable': readable}
              if readable:
                  raise RuntimeError(f'B10D_PRIVATE_DESTINATION_PUBLICLY_READABLE_{label.upper()}')

          result = {
              'monitor_http_status': monitor_http_status,
              'monitor_ok': True,
              'monitor_outcome_blind': True,
              'monitor_all_40_slots_complete': False,
              'monitor_prelaunch_all_slots_zero': True,
              'monitor_unassigned_invalid_rows': 0,
              'launchtest_handler_fingerprint_ok': True,
              'do_get_fallback_fingerprint_ok': True,
              'ordinary_ktc_smoke_found': True,
              'ordinary_ktc_smoke': expected_smoke,
              'public_v9_rows_found': False,
              'private_anonymous_checks': privacy,
          }
          open('/tmp/b10d_live_checks.json', 'w').write(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Materialize and validate final P6 launch checklist
        shell: bash
        run: |
          set -euo pipefail
          OUT='research/package-adjustment-v9/b10d-p6-final-launch-checklist'
          test ! -e "$OUT" || { echo 'B10D record already exists; one-shot checklist will not overwrite it.'; exit 1; }
          mkdir -p "$OUT"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          out = Path('research/package-adjustment-v9/b10d-p6-final-launch-checklist')
          live = json.loads(Path('/tmp/b10d_live_checks.json').read_text())

          checklist = {
              'schema_version': 2,
              'study_id': 'package-adjustment-v9-discordant-human-validation',
              'phase': 'B10D-P6-final-launch-checklist-v2-pre-distribution-eligibility-freeze-repair',
              'decision': 'PASS_B10D_P6_FINAL_LAUNCH_CHECKLIST_AUTHORIZE_40_VOTER_URL_DISTRIBUTION',
              'p1_to_p4_pass_commit': 'c3fd860107a3db00058bd718ffcd92989c46de02',
              'p5_pass_commit': 'ad232ab6bd7581dcb1fc6cb8aa86ba628d1c7602',
              'b9_deploy_commit': '5cbd7b3dae663dfbeb9f9766dc3f972303af9de1',
              'b8_freeze_commit': '2ff1ca2a6ea440f2e1a4c390ae974a9666e9912a',
              'p1_to_p5_all_passed': True,
              'deployment': {
                  'deployment_id': 'AKfycbynz6A8jNOQonJhHtZW7DEx36PYTBXi_klXnacKF7I4kACPbTJIA5YFjY5ILxqpwgm8aw',
                  'web_app_url': 'https://script.google.com/macros/s/AKfycbynz6A8jNOQonJhHtZW7DEx36PYTBXi_klXnacKF7I4kACPbTJIA5YFjY5ILxqpwgm8aw/exec',
                  'web_app_deployment_version': 3,
                  'expected_deployed_source_sha256': '731c96c69d705ffbee21c4bb0715618ad98df0233aa3feb9ff93abe96aca35ad',
                  'source_exactness_operator_attestation': 'EXACT_V4_NO_EDITS',
                  'source_exactness_attestation_received': True,
                  'source_exactness_basis': 'GitHub workflow-dispatch operator attestation linking frozen V4 bytes to web-app version 3, corroborated by exact frozen source SHA and live structural behavior; Apps Script source is not machine-readable back from the deployment',
              },
              'post_deployment_checks': live,
              'frozen_b8_slot_url_shape': 'index.html?pkgv9slot=<1..40>#market-research',
              'distribution_url_template': 'https://ajknoll23-code.github.io/LOG-Trade-Calculator/index.html?pkgv9slot=<1..40>#market-research',
              'eligibility_clarifications_frozen_before_distribution': {
                  'basis': 'Prospective, outcome-blind clarification of the frozen B8 voter-eligibility rule, frozen before any real V9 vote exists.',
                  'server_timestamp_authority': 'Distribution-window rules use the doPost server timestamp (private sheet column A), never the client vote timestamp. The B8 accepted-session ordering rule is unchanged among sessions that remain eligible after these prospective exclusions.',
                  'pre_distribution_exclusion': 'A V9 session is ineligible if its earliest server timestamp precedes the recorded distribution time of its slot (or of the replacement issuance governing that session). Ineligible sessions are excluded and recorded before the frozen B8 accepted-session rule is applied.',
                  'distribution_log': 'research/package-adjustment-v9/b10d-p6-final-launch-checklist/distribution_log.csv with columns slot,utc_sent,recipient_pseudonym_sha256,is_replacement; every initial send and replacement issuance is logged at the time of sending, and the log is committed on main before any outcome analysis.',
                  'distribution_log_header': 'slot,utc_sent,recipient_pseudonym_sha256,is_replacement',
                  'recipient_pseudonym_rule': 'recipient_pseudonym_sha256 = SHA256(UTF-8(lowercase(trim(stable recipient handle)) + newline + private offline study salt)); use the same private salt for all recipients and never commit the salt or raw handles.',
                  'one_slot_per_person': 'A recipient pseudonym hash may appear for only one slot; if it appears for more than one, sessions in the later-issued slot are excluded and the event is recorded as a protocol deviation.',
                  'launchtest_named_exclusions': 'All rows with challenge id pkgv9val_LAUNCHTEST and/or session envelope slot 0 are excluded, including every B10A/B10B sentinel session.',
                  'b8_accepted_session_rule_unchanged': 'After prospective eligibility exclusions, choose the complete valid session with the earliest frozen B8 final-vote timestamp; exact ties use lexicographically smallest session_id.',
                  'monitor_maturity_caveat': 'The P5 monitor is structural only and does not read the distribution log. A structural 40/40 signal does not by itself unlock outcomes if any pre-distribution or duplicate-recipient exclusion applies; the locked analysis stage must reconcile the distribution log outcome-blind before computing or exposing choices.',
              },
              'private_destination': {
                  'spreadsheet_title': 'KTC_V9_Private_Validation',
                  'spreadsheet_shared': False,
                  'sharing_state_operator_reported_before_p6': True,
                  'operator_privacy_attestation': 'PRIVATE_NOT_SHARED_OR_PUBLISHED',
                  'anonymous_export_readable': False,
                  'anonymous_gviz_readable': False,
              },
              'launchtest_rows_excluded': True,
              'monitoring_is_outcome_blind': True,
              'owner_no_peek_commitment': True,
              'owner_no_peek_dispatch_attestation': 'I_AGREE_NO_PEEK_UNTIL_40_OF_40',
              'owner_no_peek_commitment_text': 'Do not open the private V9 validation sheet or inspect choice-bearing Apps Script execution payloads during collection; use only the frozen outcome-blind structural monitor. A structural 40/40 signal does not itself authorize outcome inspection; first complete the frozen outcome-blind distribution-log eligibility reconciliation and confirm 40 eligible accepted complete sessions / 960 accepted ballots.',
              'human_outcomes_read': False,
              'human_outcome_analysis_authorized': False,
              'human_voting_url_distribution_authorized': True,
              'authorized_distribution_scope': 'exactly one frozen pkgv9slot URL to each eligible voter slot 1..40',
              'analysis_unlock_condition': '40 eligible accepted complete sessions / 960 accepted ballots after outcome-blind reconciliation of the frozen distribution log and prospective exclusions, then the unchanged frozen B8 accepted-session rule',
              'production_v9_activation_authorized': False,
              'production_change_authorized': False,
              'collection_transport_preservation_rule': 'Any index.html deploy during collection must preserve the exact B9 transport block SHA256 9750dc02cdc3b65874a48211d3e7c86c5f6bd9b401855775254ef0c3cc0d5dca.',
              'next_if_pass': 'Distribute only the frozen slot URL template. Maintain the committed per-slot distribution log for every initial/replacement issuance and enforce one person per slot. Monitor only via the frozen v9_structural_status endpoint. Do not inspect human choices or run outcome analysis until an outcome-blind distribution-log reconciliation confirms 40 eligible accepted complete sessions / 960 accepted ballots.',
          }

          # Internal consistency gates before the authorization record is allowed to exist.
          assert checklist['p1_to_p5_all_passed'] is True
          assert checklist['deployment']['source_exactness_attestation_received'] is True
          assert checklist['post_deployment_checks']['monitor_ok'] is True
          assert checklist['post_deployment_checks']['monitor_outcome_blind'] is True
          assert checklist['post_deployment_checks']['monitor_prelaunch_all_slots_zero'] is True
          assert checklist['post_deployment_checks']['launchtest_handler_fingerprint_ok'] is True
          assert checklist['post_deployment_checks']['do_get_fallback_fingerprint_ok'] is True
          assert checklist['post_deployment_checks']['ordinary_ktc_smoke_found'] is True
          assert checklist['post_deployment_checks']['public_v9_rows_found'] is False
          assert checklist['frozen_b8_slot_url_shape'] == 'index.html?pkgv9slot=<1..40>#market-research'
          assert checklist['distribution_url_template'] == 'https://ajknoll23-code.github.io/LOG-Trade-Calculator/' + checklist['frozen_b8_slot_url_shape']
          ec = checklist['eligibility_clarifications_frozen_before_distribution']
          for k in ('server_timestamp_authority','pre_distribution_exclusion','distribution_log','distribution_log_header','recipient_pseudonym_rule','one_slot_per_person','launchtest_named_exclusions','b8_accepted_session_rule_unchanged','monitor_maturity_caveat'):
              assert ec.get(k), k
          assert checklist['distribution_url_template'].endswith('?pkgv9slot=<1..40>#market-research')
          assert checklist['owner_no_peek_commitment'] is True
          assert checklist['human_outcomes_read'] is False
          assert checklist['human_outcome_analysis_authorized'] is False
          assert checklist['production_v9_activation_authorized'] is False
          assert checklist['human_voting_url_distribution_authorized'] is True

          distribution_log = out / 'distribution_log.csv'
          distribution_log.write_text('slot,utc_sent,recipient_pseudonym_sha256,is_replacement\n')
          assert distribution_log.read_text() == checklist['eligibility_clarifications_frozen_before_distribution']['distribution_log_header'] + '\n'

          path = out / 'b10d_p6_launch_checklist.json'
          path.write_text(json.dumps(checklist, indent=2, sort_keys=True) + '\n')

          report = f'''# Package Adjustment V9 — B10D P6 Final Launch Checklist\n\n**Decision:** `{checklist['decision']}`\n\n- P1–P5: PASS\n- Existing web-app deployment preserved: **Yes**\n- Web-app deployment version: **3**\n- Frozen/deployed V4 source SHA256: `{checklist['deployment']['expected_deployed_source_sha256']}`\n- Exact V4/no-edits operator attestation: **Yes**\n- Outcome-blind monitor live: **Yes**\n- Prelaunch real voter activity: **0 / 40 slots**\n- Ordinary KTC post-deployment smoke vote: **PASS**\n- Public V9 outcome exposure: **None detected**\n- Private destination anonymously readable: **No**\n- Owner no-peek commitment: **Frozen**\n- Exact B8 slot URL template: **Frozen**\n- Pre-distribution exclusion + distribution log + one-slot-per-person: **Frozen**\n- Launch-test/slot-0 named exclusions: **Frozen**\n- Structural 40/40 requires distribution-log eligibility reconciliation before outcome analysis: **Frozen**\n- Human voter URL distribution authorized: **Yes — slots 1..40 only**\n- Human outcome analysis authorized: **No**\n- Production V9 activation authorized: **No**\n\nIf this checklist is durably committed on `main`, B9 P6 is satisfied and the 40 frozen voter URLs may be distributed under the prospectively frozen distribution-log eligibility rules. During collection use only the frozen structural monitor. Human choices remain unopened until an outcome-blind distribution-log reconciliation confirms 40 eligible accepted complete sessions / 960 accepted ballots. Any index.html deploy during collection must preserve the exact B9 transport block SHA.\n'''
          (out / 'b10d_report.md').write_text(report)

          hashes = {}
          for name in ['b10d_p6_launch_checklist.json','b10d_report.md','distribution_log.csv']:
              hashes[name] = hashlib.sha256((out / name).read_bytes()).hexdigest()
          (out / 'b10d_output_hashes.json').write_text(json.dumps({'sha256': hashes}, indent=2, sort_keys=True) + '\n')
          PY

