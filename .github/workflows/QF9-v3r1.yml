# QF9 V3R1: exact V2-reviewed UI, with live generated-data validation instead of stale hash pins.
# Default preflight has read-only permissions; only separately confirmed promote can write main.
# QF9 Phase 0 Green 38155667049; V2 review Green 38158245636; V3 promotion Red 38168926409 after permitted refresh.
name: QF9 V3R1 - Source Provenance Promotion Refresh-Resilient Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight runs all guards without writing; promote requires separate manual dispatch'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'For promote only: type PROMOTE_QF9_A6A7_PROVENANCE_ONE_FILE_TO_MAIN'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF9_TMP: '/tmp/log-qf9-v3'
  QF9_REVIEW_BRANCH: 'qf9-a6a7-provenance-v2-review-2026-10-11'
  QF9_REVIEW_SHA: 'ca3faa5e0ec217982a05e2ec49fd4ffe0210c971'
  QF9_REVIEW_PARENT: 'b09d44b09e483551fa5e4ff3b6dcd231fb3a996d'
  QF9_ORIGINAL_INDEX: '93684a734efb0bbc47b6c29cb5b4e859adcd3d1d'
  QF9_REVIEWED_INDEX: 'c83e3f68d11853c072017e6bd83bb1ad085f4a3e'
  QF9_MODE: ${{ inputs.mode }}
  QF9_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  preflight:
    name: Independently validate reviewed one-file change and regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout triggering main exactly, without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression and browser test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Independently pin main, immutable candidate, and one-file scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QF9_MODE" == 'preflight' || "$QF9_MODE" == 'promote' ]] || { echo 'STOP unsupported mode'; exit 1; }
          if [[ "$QF9_MODE" == 'promote' ]]; then
            [[ "$QF9_CONFIRMATION" == 'PROMOTE_QF9_A6A7_PROVENANCE_ONE_FILE_TO_MAIN' ]] || { echo 'STOP missing explicit promotion confirmation'; exit 1; }
          fi
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP changed checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${QF9_REVIEW_BRANCH}:refs/remotes/origin/${QF9_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved'; exit 1; }
          [[ "$(git rev-parse origin/${QF9_REVIEW_BRANCH})" == "$QF9_REVIEW_SHA" ]] || { echo 'STOP review branch moved'; exit 1; }
          [[ "$(git show -s --format=%P "$QF9_REVIEW_SHA")" == "$QF9_REVIEW_PARENT" ]] || { echo 'STOP candidate has wrong parent'; exit 1; }
          git merge-base --is-ancestor "$QF9_REVIEW_PARENT" "$GITHUB_SHA" || { echo 'STOP main lacks reviewed parent ancestry'; exit 1; }
          [[ "$(git rev-parse "$QF9_REVIEW_SHA:index.html")" == "$QF9_REVIEWED_INDEX" ]] || { echo 'STOP candidate blob mismatch'; exit 1; }
          [[ "$(git hash-object index.html)" == "$QF9_ORIGINAL_INDEX" ]] || { echo 'STOP deployed index changed since QF6'; exit 1; }
          [[ "$(git diff --name-only "$QF9_REVIEW_PARENT" "$QF9_REVIEW_SHA")" == 'index.html' ]] || { echo 'STOP reviewed diff not one index.html file'; exit 1; }
          [[ "$(git diff --numstat "$QF9_REVIEW_PARENT" "$QF9_REVIEW_SHA")" == $'33\t3\tindex.html' ]] || { echo 'STOP reviewed change size drift'; exit 1; }
          guard_blob(){ local actual; actual="$(git hash-object "$1")"; [[ "$actual" == "$2" ]] || { echo "STOP protected $1 drift actual=$actual"; exit 1; }; }
          guard_blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
          guard_blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
          guard_blob free-agent-board.html '975efe51091a2315475678a9db0842b05c4fc3aa'
          guard_blob scripts/validation/validate_free_agent_valuation_parity.py 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
          guard_blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
          guard_blob .github/workflows/QF9-v2.yml 'd7d60248ce3b46daa846ab2f0a21e3a3c617b1b7'
          guard_blob .github/workflows/QF9-v1.yml '30e28026bd7a51394270a60cd963d1df8761f087'
          guard_blob scripts/artifacts/generated/market_values.json '829445174a77ceb4bb19dfd97a725e371d18efe8'
          guard_blob scripts/sync/sync_sleeper.py '702ef3ecb4daa18bfc8d37ebdef11b927f90e206'
          echo 'PASS QF9 V3R1 exact reviewed provenance disclosure, source/allowlist and protected blob pins'
      - name: Validate current synchronized roster and Free Agent Utility artifacts without obsolete SHA pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'QF9_LIVE_PROVENANCE_PY'
          import json
          from pathlib import Path
          root=Path('.')
          own=json.loads((root/'data/my_roster.json').read_text())
          league=json.loads((root/'data/league_rosters.json').read_text())
          utility=json.loads((root/'data/free_agent_utility_v1.json').read_text())
          slots=('starters','bench','taxi','reserve_ir')
          rosters=league.get('rosters')
          assert isinstance(rosters,list) and len(rosters)==12,'STOP incomplete league-roster source'
          ids=[str(t.get('roster_id')) for t in rosters]
          assert len(set(ids))==12,'STOP repeated league roster IDs'
          own_id=str(own.get('roster_id'))
          matches=[r for r in rosters if str(r.get('roster_id'))==own_id]
          assert len(matches)==1,'STOP personal/league roster identity mismatch'
          roster=matches[0]
          for slot in slots:
              person=own.get(slot)
              overall=roster.get(slot)
              assert isinstance(person,list) and isinstance(overall,list),'STOP incomplete slot '+slot
              a=[str(p.get('player_id')) for p in person]
              b=[str(p.get('player_id')) for p in overall]
              assert len(a)==len(set(a)) and set(a)==set(b) and len(b)==len(set(b)),'STOP personal/league slot mismatch: '+slot
          population=[]
          for r in rosters:
              for slot in slots:
                  assert isinstance(r.get(slot),list),'STOP malformed league source slot'
                  population.extend(r[slot])
          assert len(population)>400,'STOP suspiciously small synchronized league source'
          if 'synced_at' in own and 'synced_at' in league:
              assert isinstance(own['synced_at'],(int,float)) and isinstance(league['synced_at'],(int,float)),'STOP malformed synchronized timestamps'
              assert abs(own['synced_at']-league['synced_at']) < 60,'STOP personal/league sync timestamps diverged'
          u=utility.get('players')
          assert isinstance(u,list) and len(u)>100,'STOP unusable regenerated Free Agent Utility source'
          assert all(isinstance(p,dict) and str(p.get('player_id') or '') for p in u),'STOP incomplete free-agent utility player IDs'
          target=[p for p in population if str(p.get('player_id'))=='2227']
          assert len(target)==1 and target[0].get('name')=='Aaron Donald' and target[0].get('status')=='Active' and target[0].get('team')=='LAR','STOP QF9 source-conflict evidence changed'
          print('PASS QF9 V3R1 current sync: 12 rosters, personal/league ID and slot parity, '+str(len(population))+' players, '+str(len(u))+' Free Agent Utility rows')
          QF9_LIVE_PROVENANCE_PY
          for p in data/free_agent_utility_v1.json data/my_roster.json data/league_rosters.json; do
            echo "VALIDATED current-main artifact $p $(git hash-object "$p")"
          done
      - name: Stage exact QF9-reviewed index.html in disposable checkout, never main
        shell: bash
        run: |
          set -euo pipefail
          git show "${QF9_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "$QF9_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP staged unexpected file'; exit 1; }
          git diff --check
          echo 'PASS exact reviewed index.html staged locally only'
      - name: Prepare independent source+browser regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$QF9_TMP"
          cat > "$QF9_TMP/qa.js" <<'QF9_V3_QA_JS'
          'use strict';
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const market=JSON.parse(fs.readFileSync('scripts/artifacts/generated/market_values.json','utf8'));
          const league=JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
          function section(a,b){const i=html.indexOf(a);assert(i>=0,`missing ${a}`);assert.equal(html.indexOf(a,i+1),-1,`ambiguous ${a}`);const j=html.indexOf(b,i+a.length);assert(j>i,`missing ending ${b}`);return html.slice(i,j);}
          const source=[section('/* QF9_A6A7_SOURCE_PROVENANCE_V1\n','function mergeLeagueRosters(data){'),section('function marketValueForPlayer(name, fundamentalValue){','function packageMarketValueSummary(')].join('\n');
          const ctx=vm.createContext({console});
          vm.runInContext(`const PROD_MULT={'aaron donald':0.15};let MARKET_VALUE=null;function normalizeName(x){return String(x).toLowerCase().trim();}function escapeHtml(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}\n`+source,ctx,{timeout:7000});
          const run=code=>vm.runInContext(code,ctx,{timeout:7000});
          const sample=league.rosters.flatMap(team=>['starters','bench','taxi','reserve_ir'].flatMap(slot=>team[slot]||[])).find(p=>p.player_id==='2227');
          assert(sample && sample.status==='Active' && sample.team==='LAR' && sample.name==='Aaron Donald','PINNED real source changed');
          const oldProfile={role:'Speculative',team:'FA'};
          const note=run(`qf9StatusConflictFlag(${JSON.stringify(sample)},${JSON.stringify(oldProfile)},'aaron donald')`);
          assert(note && note.includes('Fundamental Value is unchanged') && note.includes('Active/LAR'));
          for(const alteration of [{player_id:'2226'},{status:'Inactive'},{team:'NYJ'},{name:'Other Donald'}]){
           const f={...sample,...alteration};
           assert.equal(run(`qf9StatusConflictFlag(${JSON.stringify(f)},${JSON.stringify(oldProfile)},'aaron donald')`),null,'false conflict evidence');
          }
          assert.equal(run(`qf9StatusConflictFlag(${JSON.stringify(sample)},{role:'Starter'},'aaron donald')`),null);
          console.log('PASS QF9 A7 actual stable Sleeper 2227 conflict; false ID, name, status or role fails closed');
          assert(market.counts.resolved_market_players===504);
          const rows=Object.values(market.players);
          assert.equal(rows.length,504);
          const fields=['same_position_pairwise_observations','same_position_enough_data','dominant_voter_share_pct'];
          for(const f of fields){ assert.equal(rows.filter(r=>Object.prototype.hasOwnProperty.call(r.evidence||{},f)).length,0,`unexpected evidence coverage for ${f}`); }
          const meta=run(`qf9MarketProvenance(${JSON.stringify(market.players['aaron donald'])},${JSON.stringify({market_quality:market.market_quality})})`);
          assert(meta.allMissing && meta.missing.length===3 && meta.globalShare===market.market_quality.largest_effective_voter_share_pct);
          assert(meta.globalShare>0 && meta.globalShare<100);
          console.log('PASS QF9 A6 504 row-level missing fields; global effective-voter share correctly distinguished from missing pairwise counts');
          run(`MARKET_VALUE=${JSON.stringify(market)}`);
          const htmlRow=run(`marketValueHTML('aaron donald',${market.players['aaron donald'].fundamental_value})`);
          assert(htmlRow.includes('vote detail unpublished')&&htmlRow.includes('ALL market votes')&&htmlRow.includes('not published'));
          assert(!htmlRow.includes('pairwise observations: 0'));
          assert.equal(run(`marketValueHTML('aaron donald',${market.players['aaron donald'].fundamental_value+1})`),'');
          const fresh=run(`qf9MarketProvenance({evidence:{same_position_pairwise_observations:42,same_position_enough_data:true,dominant_voter_share_pct:3.1}},${JSON.stringify({market_quality:market.market_quality})})`);
          assert(!fresh.allMissing && fresh.missing.length===0,'future per-player metadata must not get false missing label');
          assert(html.includes('qf9Flagged.has(r.key)') && html.includes('qf9StatusConflictFlag(p,existing,key)') && html.includes('Source/model discrepancy; FV unchanged'));
          assert(html.includes('const TU_BENCH_WEIGHT = 0.15;')&&html.includes('const TU_ACTIVE_ROSTER_LIMIT = 41;'));
          console.log('PASS QF9 read-only display strings and narrow conditions; no made-up market votes; future evidence supported');
          console.log('QF9_V2_QA_GREEN: presentation-only reviewed candidate; scientific/valuation findings remain open');
          // QF9 V3: independent stage-only invariants; no science inference from a UI patch.
          assert(html.includes('function playerValue(pos, age, role, name){'), 'FV model source absent');
          assert(html.includes('const TU_BENCH_WEIGHT = 0.15;') && html.includes('const TU_ACTIVE_ROSTER_LIMIT = 41;'), 'roster invariants drifted');
          const gaps=['same_position_pairwise_observations','same_position_enough_data','dominant_voter_share_pct'];
          assert.deepEqual(gaps.filter(k=>Object.prototype.hasOwnProperty.call(market.players['aaron donald'].evidence||{},k)),[], 'vote evidence unexpectedly added');
          assert.equal((html.match(/QF9_A6A7_SOURCE_PROVENANCE_V1/g)||[]).length,2,'provenance source markers drifted');
          console.log('QF9_V3_QA_GREEN: fixed 504-player missing metadata handling; status conflict conditional; 0 valuation changes');
          
          QF9_V3_QA_JS
          cat > "$QF9_TMP/browser.py" <<'QF9_V3_BROWSER_PY'
          """QF9 V2 real browser render test: provenance only; no data-model changes."""
          import json,threading
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          class Quiet(SimpleHTTPRequestHandler):
           def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(Path.cwd())))
          thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
          options=Options()
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,900']:options.add_argument(x)
          market=json.loads(Path('scripts/artifacts/generated/market_values.json').read_text())
          try:
           with webdriver.Chrome(options=options) as driver:
            driver.set_page_load_timeout(45)
            driver.get(f'http://127.0.0.1:{server.server_port}/index.html')
            WebDriverWait(driver,25).until(lambda d:d.execute_script("return typeof qf9StatusConflictFlag==='function'&&typeof marketValueHTML==='function'&&typeof renderFullRoster==='function'&&!!document.getElementById('fullRosterWrap')"))
            payload={'players':{'aaron donald':market['players']['aaron donald']},'market_quality':market['market_quality'],'scale_semantics':market['scale_semantics']}
            result=driver.execute_script('''
             MARKET_VALUE=arguments[0];
             const player={name:'Aaron Donald',player_id:'2227',status:'Active',team:'LAR'};
             const notice=qf9StatusConflictFlag(player,{role:'Speculative',team:'FA'},'aaron donald');
             if(!notice) throw Error('real source conflict not detected');
             LEAGUE_ROSTERS={'qf9_fixture':{players:[{key:'aaron donald',slot:'bench',qf9Conflict:notice}]}};
             MY_ROSTER_ID='qf9_fixture';state.teamConfirmed=true;
             renderFullRoster();
             const flag=document.querySelector('#fullRosterWrap .qf9-source-conflict');
             const value=marketValueHTML('aaron donald',arguments[1]);
             const hidden=document.querySelector('.td-retired-team-impact');
             return {flag:flag?.textContent,flagTitle:flag?.title,
                rendered:!!(flag&&flag.textContent.includes('Source/model discrepancy')),
                noValueChange:flag?.textContent.includes('FV unchanged'),
                evidence:value.includes('vote detail unpublished')&&value.includes('ALL market votes'),
                hidden:!!(hidden&&hidden.hidden),
                noFalseFlag:qf9StatusConflictFlag({...player,player_id:'other'},{role:'Speculative'},'aaron donald')===null};
            ''',payload,market['players']['aaron donald']['fundamental_value'])
            assert result['rendered'] and result['noValueChange'] and result['evidence'] and result['noFalseFlag'] and result['hidden'],result
            print('PASS QF9 real Chrome: rendered conditional status discrepancy; provenance-only market detail; legacy impact hidden')
          finally:
           server.shutdown();server.server_close()
          QF9_V3_BROWSER_PY
          node --check "$QF9_TMP/qa.js"
          python3 - <<'PY_CHECK'
          import ast,os
          from pathlib import Path
          ast.parse((Path(os.environ['QF9_TMP'])/'browser.py').read_text())
          print('PASS independent QF9 V3 QA program syntax')
          PY_CHECK
      - name: Validate staged source-provenance behavior and unchanged FV gates
        shell: bash
        run: |
          set -euo pipefail
          node "$QF9_TMP/qa.js"
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/projections/build_team_utility_lineup_projections.py --check
      - name: Verify rendered Chrome missing vote provenance, source discrepancy, and hidden legacy panel
        shell: bash
        run: |
          set -euo pipefail
          python3 "$QF9_TMP/browser.py"
      - name: Run all 14 repo regression groups plus frozen parity and package guards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY_IDP'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as guard
          result=guard.validate_deployment()
          assert result['actual_changed_entry_count']==320,'STOP frozen IDP 320 changes drift'
          print('PASS frozen IDP 320 changed / 84 held')
          PY_IDP
      - name: End with exact reviewed one-file tree and fresh main lease
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object index.html)" == "$QF9_REVIEWED_INDEX" ]] || { echo 'STOP local candidate mutated'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP tests mutated another source'; exit 1; }
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo 'STOP tests generated untracked source'; exit 1; }
          git diff --check
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved during tests'; exit 1; }
          echo 'QF9_V3R1_PREFLIGHT_GREEN: exact reviewed index.html; no repository changes or pushes'

  promote:
    name: Explicit owner-only promotion of reviewed index.html to main
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote' && inputs.confirmation == 'PROMOTE_QF9_A6A7_PROVENANCE_ONE_FILE_TO_MAIN'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout the SAME dispatch HEAD with write permission
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Recheck reviewed SHA, deployed index, main lease, and exact file scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QF9_MODE" == 'promote' && "$QF9_CONFIRMATION" == 'PROMOTE_QF9_A6A7_PROVENANCE_ONE_FILE_TO_MAIN' ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP checkout changed'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP checkout dirty'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/${QF9_REVIEW_BRANCH}:refs/remotes/origin/${QF9_REVIEW_BRANCH}"
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved since preflight'; exit 1; }
          [[ "$(git rev-parse origin/${QF9_REVIEW_BRANCH})" == "$QF9_REVIEW_SHA" ]] || { echo 'STOP review branch moved'; exit 1; }
          [[ "$(git rev-parse "$QF9_REVIEW_SHA:index.html")" == "$QF9_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git hash-object index.html)" == "$QF9_ORIGINAL_INDEX" ]] || { echo 'STOP main index changed'; exit 1; }
          [[ "$(git show -s --format=%P "$QF9_REVIEW_SHA")" == "$QF9_REVIEW_PARENT" ]] || exit 1
          [[ "$(git diff --name-only "$QF9_REVIEW_PARENT" "$QF9_REVIEW_SHA")" == 'index.html' ]] || exit 1
          [[ "$(git diff --numstat "$QF9_REVIEW_PARENT" "$QF9_REVIEW_SHA")" == $'33\t3\tindex.html' ]] || exit 1
          git merge-base --is-ancestor "$QF9_REVIEW_PARENT" HEAD || { echo 'STOP parent ancestor drift'; exit 1; }
          [[ "$(git hash-object .github/workflows/QF9-v2.yml)" == 'd7d60248ce3b46daa846ab2f0a21e3a3c617b1b7' ]] || { echo 'STOP reviewed harness drift'; exit 1; }
          [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || { echo 'STOP frozen market artifact changed'; exit 1; }
          for guard in \
            'scripts/team_utility_projection_runtime.js:1620edf05e56a56b4a874c71b32777a443422de5' \
            'free-agent-board.html:975efe51091a2315475678a9db0842b05c4fc3aa' \
            'model/releases/free-agent-production-v2/release.json:75c9665c0493d8ac4900479b6802c807aaa45633'; do
            path="${guard%%:*}"; sha="${guard#*:}"
            [[ "$(git hash-object "$path")" == "$sha" ]] || { echo "STOP protected drift $path"; exit 1; }
          done
          git show "${QF9_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "$QF9_REVIEWED_INDEX" ]] || exit 1
          [[ "$(git diff --name-only)" == 'index.html' ]] || exit 1
          git diff --check
      - name: Commit only reviewed index.html and non-force push to main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo 'STOP staged files'; exit 1; }
          [[ "$(git hash-object index.html)" == "$QF9_REVIEWED_INDEX" ]] || exit 1
          git diff --cached --check
          git commit -m 'QF9 A6/A7: disclose market voter provenance and Sleeper model status discrepancy'
          [[ "$(git rev-parse HEAD:index.html)" == "$QF9_REVIEWED_INDEX" ]] || exit 1
          # This NON-FORCE push rejects a competing main update; no force or model mutation.
          git push origin HEAD:refs/heads/main
          echo "QF9_V3R1_PROMOTION_GREEN main=$(git rev-parse HEAD) index=${QF9_REVIEWED_INDEX}"
          echo 'Verify Pages separately; workflow success does not certify scientific accuracy.'
