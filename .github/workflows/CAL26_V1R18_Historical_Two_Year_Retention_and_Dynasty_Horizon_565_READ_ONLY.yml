# CAL26 V1R18 | Scientific research only; never updates player valuations.
name: CAL26 V1R18 - Historical Two Year Retention and Dynasty Horizon 565 READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cal26-v1r18-historical-shadow-read-only
  cancel-in-progress: false
jobs:
  historical_retention_shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out main without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm canonical baseline evaluator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/validation/snapshot_values.py --selftest
          test -f research/age-curve-v2/age_curve_v2_phase1_retention_audit.json
          test -f research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.json
      - name: Materialize and self-test frozen CAL26 V1R18 research engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r18_engine.py" <<'PY_CAL26_V1R18'
          #!/usr/bin/env python3
          """CAL26 V1R18: frozen empirical Year+1/Year+2 retention; scenario-only six-year shadow.
          
          No new fitted predictive model; no deployment, AGE_CURVE edit, or release mutation.
          """
          from __future__ import annotations
          import argparse, csv, hashlib, json, math, statistics, sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          
          APPROVED_15 = {
           'breece hall':5336,'brian branch':3436,'derrick henry':4112,'fred warner':5071,
           'jahmyr gibbs':9497,'jaxson dart':5091,'jeremiyah love':5015,'jonathan taylor':6025,
           'marvin harrison':4207,'nik bonitto':4919,'patrick mahomes':5756,'roquan smith':5188,
           'tetairoa mcmillan':5252,'trevor lawrence':6509,'trey mcbride':5823}
          PROTECTED_18 = set('''daniel jones|devin lloyd|dj giddens|george karlaftis|jack campbell|jake ferguson|jamien sherwood|kenny gainwell|luther burden|malik davis|malik willis|puka nacua|quay walker|quentin lake|tj watt|trevon moehrig|tuli tuipulotu|zack baun'''.split('|'))
          QB_FEEDBACK = {
           'caleb williams':('Too Low',6153),'drake maye':('Too Low',6371),
           'cj stroud':('Too Low',4750),'jayden daniels':('Too Low',5378),
           'josh allen':('Too Low',7697),'lamar jackson':('Too Low',6131),
           'brock purdy':('Too Low',5736),'jaxson dart':('Correct',5091),
           'trevor lawrence':('Correct',6509),'bo nix':('Too High',6249),
           'dak prescott':('Too High',6422),'jalen hurts':('Too High',6596),
           'jared goff':('Too High',5932),'justin herbert':('Too High',6197)}
          REFERENCE_AGES = {'QB':28,'RB':24,'WR':26,'TE':27,'DL':27,'LB':27,'DB':26}
          DISCOUNT=0.90
          SMOOTHING_PSEUDO_N=40
          MIN_CELL_N=25
          FACTOR_CLAMP=(0.45,1.50)  # Scenario visualization only; NOT production policy.
          
          
          def ensure(ok, code):
              if not ok: raise AssertionError(code)
          def digest(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def rnd(x):return int(math.floor(x+.5))
          def savecsv(p, rows):
              ensure(bool(rows),'EMPTY_CSV_'+str(p))
              with open(p,'w',newline='',encoding='utf8') as f:
                  w=csv.DictWriter(f,fieldnames=list(rows[0]),extrasaction='ignore');w.writeheader();w.writerows(rows)
          
          def cohort(stats,pos,age):
              group=stats['by_position_age'][pos]
              pool=group['all_ages']
              exact=group['by_age'].get(str(int(math.floor(float(age)))))
              if not exact:
                  return {'sample_n':0,'supported':False,'y1':pool['year1_any_stats_share'],
                          'y2':pool['year2_any_stats_share'],'data_source':'POSITION_POOL_FALLBACK_NOT_ESTIMATED_AT_AGE'}
              n=int(exact['n'])
              shrink=n/(n+SMOOTHING_PSEUDO_N)
              y1=shrink*float(exact['year1_any_stats_share'])+(1-shrink)*float(pool['year1_any_stats_share'])
              y2=shrink*float(exact['year2_any_stats_share'])+(1-shrink)*float(pool['year2_any_stats_share'])
              return {'sample_n':n,'supported':n>=MIN_CELL_N,'y1':y1,'y2':y2,
                      'data_source':'HISTORICAL_2_YEAR_SMOOTHED' if n>=MIN_CELL_N else 'SMALL_SAMPLE_HOLD'}
          
          def weighted_horizon(c, years):
              # Only t=1,2 are observed empirically. t=3..5 is explicit, unvalidated extrapolation.
              y1=max(0,min(1,c['y1']));y2=max(0,min(1,c['y2']))
              conditional=max(.20,min(1., y2/max(y1,1e-8)))
              total=0.
              for t in range(years):
                  survival=1. if t==0 else y1 if t==1 else y2 if t==2 else y2*conditional**(t-2)
                  total+=DISCOUNT**t*survival
              return total
          
          def factor(stats,pos,age,years):
              here=cohort(stats,pos,age)
              reference=cohort(stats,pos,REFERENCE_AGES[pos])
              denom=weighted_horizon(reference,years)
              ensure(denom>0,'REFERENCE_RETENTION_ZERO_'+pos)
              raw=weighted_horizon(here,years)/denom
              return max(FACTOR_CLAMP[0],min(FACTOR_CLAMP[1],raw)),here
          
          def selftest():
              a={'by_position_age':{'QB':{'all_ages':{'year1_any_stats_share':.8,'year2_any_stats_share':.6},
                'by_age':{'28':{'n':40,'year1_any_stats_share':.9,'year2_any_stats_share':.7}}}}}
              v,c=factor(a,'QB',28,3)
              ensure(abs(v-1)<1e-12 and c['supported'],'REFERENCE_SHOULD_BE_1')
              ensure(weighted_horizon(c,6)>=weighted_horizon(c,3),'HORIZON_ORDER')
              ensure(not cohort(a,'QB',99)['supported'],'UNOBSERVED_AGE_UNSUPPORTED')
              ensure(len(APPROVED_15)==15 and len(PROTECTED_18)==18 and not(APPROVED_15.keys()&PROTECTED_18),'OWNER_LOCK_COUNTS')
              ensure(Counter(x[0] for x in QB_FEEDBACK.values())=={'Too Low':7,'Correct':2,'Too High':5},'FEEDBACK_COUNTS')
              print('PASS V1R18 selftest: historical smoothing, scenarios, 15+18 controls, 14 QB ratings')
          
          def main():
              ap=argparse.ArgumentParser();ap.add_argument('--repo',default='.');ap.add_argument('--out');ap.add_argument('--selftest',action='store_true')
              args=ap.parse_args()
              if args.selftest:return selftest()
              ensure(bool(args.out),'OUTPUT_REQUIRED')
              repo=Path(args.repo).resolve();out=Path(args.out).resolve();out.mkdir(parents=True,exist_ok=True)
              h1=repo/'research/age-curve-v2/age_curve_v2_phase1_retention_audit.json'
              h2=repo/'research/age-curve-v2/age_curve_v2_phase2_candidate_evaluation.json'
              ensure(h1.is_file() and h2.is_file(),'HISTORICAL_FROZEN_FILES_MISSING')
              stats=json.loads(h1.read_text());evaluation=json.loads(h2.read_text())
              assert stats['historical_window']['retention_row_count']==14102,'HISTORICAL_ROW_DRIFT'
              assert evaluation['historical_sample']['retention_rows']==14102,'PHASE2_COUNT_DRIFT'
              assert stats['deployment_authorized'] is False and evaluation['deployment_authorized'] is False,'HISTORY_AUTHORIZATION_DRIFT'
              assert sorted(stats['by_position_age'])==sorted(REFERENCE_AGES),'HISTORICAL_POSITIONS_DRIFT'
              assert sum(int(q['all_ages']['n']) for q in stats['by_position_age'].values())==14102,'POSITION_COUNTS_DO_NOT_SUM'
              assert stats['historical_window']['base_years_with_two_future_seasons']==list(range(2015,2024)),'HISTORICAL_PERIOD_DRIFT'
              index=repo/'index.html';ensure(index.is_file(),'PRODUCTION_INDEX_MISSING')
              sys.path.insert(0,str(repo/'scripts/validation'))
              import snapshot_values as sv
              cfg=sv.load_from_html(index); live=sv.compute_all_values(cfg)
              ensure(len(live)==565 and len(set(live))==565,'LIVE_565_DRIFT')
              ensure(Counter(z['pos'] for z in live.values())['QB']==64,'LIVE_64_QB_DRIFT')
              ensure(cfg['cal26_fv_owner_anchors']==APPROVED_15,'OWNER_ANCHORS_DRIFT')
              for name,v in APPROVED_15.items():
                  ensure(name in live and live[name]['value']==v,'OWNER_LOCK_DRIFT_'+name)
              # A live consistency test from V1R17, without writing to calculator or board.
              if (repo/'scripts/sync/sync_free_agent_valuation.py').exists():
                  sys.path.insert(0,str(repo/'scripts/sync'))
                  import sync_free_agent_valuation as sync
                  ib=index.read_text();bb=(repo/'free-agent-board.html').read_text()
                  ensure(all(sync.parity_regions(ib,bb).values()) and sync.render_synced(ib,bb)==bb,'BOARD_PARITY_DRIFT')
              rows=[];feedback=[];mat=[]
              for pos in sorted(REFERENCE_AGES):
                  for age_s,bucket in sorted(stats['by_position_age'][pos]['by_age'].items(),key=lambda z:int(z[0])):
                      cc=cohort(stats,pos,int(age_s))
                      mat.append({'position':pos,'age':int(age_s),'historical_n':cc['sample_n'],
                          'year1_any_stat_share_raw':round(float(bucket['year1_any_stats_share']),6),
                          'year2_any_stat_share_raw':round(float(bucket['year2_any_stats_share']),6),
                          'year1_any_stat_share_smoothed':round(cc['y1'],6),
                          'year2_any_stat_share_smoothed':round(cc['y2'],6),
                          'source_status':cc['data_source'],'reference_age':REFERENCE_AGES[pos]})
              for key,v in sorted(live.items()):
                  info=cfg['player_db'][key];pos=info['pos'];age=info['age'];role=info['role'];fv=int(v['value'])
                  rm,raw=sv.production_multiplier(key,role,cfg['prod_mult'],cfg['no_real_history'],cfg['role_mult'],cfg.get('cal22_keys',set()))
                  pw=cfg['position_weight'][pos]
                  am=sv.effective_age_multiplier(pos,age,role,key,rm,raw,cfg)
                  base=100*pw*rm*55
                  implied=rnd(base*am)
                  ensure(key in APPROVED_15 or fv==implied,'CANONICAL_EVALUATOR_PARITY_'+key)
                  control=key in APPROVED_15 or key in PROTECTED_18
                  no_age=fv if control or pos=='K' else rnd(base)
                  if pos=='K':
                      f2=f6=1.0;c={'sample_n':0,'supported':False,'data_source':'KICKER_CONSTANT_EXCLUDED','y1':0,'y2':0}
                  else:
                      f2,c=factor(stats,pos,age,3) # Current season + observed Year+1 / Year+2.
                      f6,_=factor(stats,pos,age,6) # Further three seasons: unvalidated extension.
                  unsupported=(pos!='K' and not c['supported'])
                  # No thin/unobserved cell extrapolation to values; leave frozen for review.
                  yr2=fv if control or pos=='K' or unsupported else rnd(base*f2)
                  yr6=fv if control or pos=='K' or unsupported else rnd(base*f6)
                  row={'player':key,'position':pos,'age':age,'role':role,'current_fv':fv,
                       'is_approved_owner_anchor':control and key in APPROVED_15,
                       'is_accepted_control':key in PROTECTED_18,'historical_cell_n':c['sample_n'],
                       'historical_support':c['supported'],'historical_cell_status':c['data_source'],
                       'y1_any_stat_survival':round(c['y1'],5),'y2_any_stat_survival':round(c['y2'],5),
                       'no_age_shadow_fv':no_age,'empirical_y1_y2_shadow_fv':yr2,
                       'scenario_six_year_shadow_fv':yr6,
                       'empirical_y1_y2_delta':yr2-fv,'scenario_six_year_delta':yr6-fv,
                       'y1_y2_factor':round(f2,5),'scenario_six_year_factor':round(f6,5)}
                  if control:ensure(yr2==yr6==fv,'CONTROL_MOVED_'+key)
                  rows.append(row)
                  if key in QB_FEEDBACK:
                      rating,rated_price=QB_FEEDBACK[key]
                      feedback.append({'player':key,'owner_rating':rating,'review_comparison_fv':rated_price,
                                       'current_fv':fv,'empirical_y1_y2_shadow_fv':yr2,'six_year_shadow_fv':yr6,
                                       'y1_y2_delta':yr2-fv,'six_year_delta':yr6-fv,
                                       'owner_approved':key in APPROVED_15,'not_a_release':True})
              ensure(len(rows)==565 and len(feedback)==14,'CURRENT_SCOPE_COUNT_DRIFT')
              assert all(r['empirical_y1_y2_delta']==0 and r['scenario_six_year_delta']==0 for r in rows if r['is_approved_owner_anchor'] or r['is_accepted_control'])
              pos_summary=[]
              for pos in ['QB','RB','WR','TE','DL','LB','DB','K']:
                  subset=[r for r in rows if r['position']==pos]
                  if not subset: continue
                  pos_summary.append({'position':pos,'n':len(subset),
                     'historically_unsupported_holds':sum(not x['historical_support'] for x in subset),
                     'year1_year2_changed':sum(x['empirical_y1_y2_delta']!=0 for x in subset),
                     'six_year_changed':sum(x['scenario_six_year_delta']!=0 for x in subset),
                     'year1_year2_total_delta':sum(x['empirical_y1_y2_delta'] for x in subset),
                     'six_year_total_delta':sum(x['scenario_six_year_delta'] for x in subset),
                     'median_year1_year2_delta':statistics.median(x['empirical_y1_y2_delta'] for x in subset),
                     'median_six_year_delta':statistics.median(x['scenario_six_year_delta'] for x in subset)})
              exports={'CAL26_V1R18_All_565_Two_Year_and_Six_Year_Shadow.csv':rows,
                       'CAL26_V1R18_Historical_Position_Age_Retention.csv':mat,
                       'CAL26_V1R18_Position_Impact.csv':pos_summary,
                       'CAL26_V1R18_14_QB_Owner_Review.csv':feedback}
              for filename,records in exports.items():savecsv(out/filename,records)
              report='''# CAL26 V1R18 Historical Two-Year Retention and Dynasty Horizon\n\n**Status: RESEARCH ONLY — zero production writes.**\n\n- Historical source: Age Curve V2 Phase 1; 14,102 player-seasons, base years 2015–2023 with observed Year+1 and Year+2 targets.\n- Observed retention uses any-stat future-season survival (non-appearance is zero), smoothed toward position-wide survival using a 40-player pseudo-cohort.\n- Age cells with fewer than 25 historical player-seasons are HOLD/unchanged instead of receiving an unsupported price projection.\n- The six-year horizon is an **explicit mechanical scenario**, not a six-year fitted outcome or established valuation policy. Only the first two forward seasons are observed; later seasons use a hypothetical conditional-retention extension.\n- Scenario factors are normalized at reference ages and bounded to 0.45–1.50 **for research only**. These bounds are not production multipliers.\n- No AGE_CURVE constants, production quotes, role assignments, or free-agent board are altered.\n- All 15 owner-approved prices and 18 protected comparison players are fixed; QB feedback is reported without automatically changing prices.\n\n**Decision:** Review the tables before any separate production design, validation, or approval.\n'''
              (out/'CAL26_V1R18_Readme_and_Scientific_Limitations.md').write_text(report)
              manifest={'status':'PASS_CAL26_V1R18_HISTORICAL_2_YEAR_AND_SIX_YEAR_SHADOW','run_utc':datetime.now(timezone.utc).isoformat(),
                        'production_authorized':False,'production_files_mutated':0,'players':565,'quarterbacks':64,
                        'approved_owner_15_unchanged':True,'protected_owner_18_unchanged':True,
                        'qb_feedback_count':14,'historical_player_seasons':14102,
                        'observed_forward_years':[1,2],'scenario_horizon_seasons':6,
                        'six_year_validation':'NOT_EMPIRICALLY_VALIDATED_HYPOTHETICAL_EXTENSION',
                        'reference_ages':REFERENCE_AGES,'discount_per_season':DISCOUNT,
                        'smoothing_pseudo_n':SMOOTHING_PSEUDO_N,'min_observed_cell_n':MIN_CELL_N,
                        'factor_clamp_scenario_only':FACTOR_CLAMP,
                        'canonical_index_sha256':digest(index),'historical_phase1_sha256':digest(h1),'historical_phase2_sha256':digest(h2),
                        'files':{p:digest(out/p) for p in list(exports)+['CAL26_V1R18_Readme_and_Scientific_Limitations.md']}}
              (out/'CAL26_V1R18_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
              print(json.dumps({'status':manifest['status'],'historical_n':14102,'player_n':565,
                                'held_unsupported':sum(not x['historical_support'] for x in rows),
                                'changed_y1_y2':sum(x['empirical_y1_y2_delta']!=0 for x in rows),
                                'changed_six_year':sum(x['scenario_six_year_delta']!=0 for x in rows)}))
          
          if __name__=='__main__':main()
          PY_CAL26_V1R18
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r18_engine.py"
          python3 "$RUNNER_TEMP/cal26_v1r18_engine.py" --selftest
      - name: Produce all 565-player empirical two-year and scenario-only six-year evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r18_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/CAL26_V1R18_Evidence"
      - name: Independently verify manifest, 565 players, controls, and repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import csv,hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R18_Evidence'
          m=json.loads((out/'CAL26_V1R18_Manifest.json').read_text())
          assert m['players']==565 and m['quarterbacks']==64 and m['historical_player_seasons']==14102
          assert m['approved_owner_15_unchanged'] and m['protected_owner_18_unchanged']
          assert m['production_authorized'] is False and m['production_files_mutated']==0
          assert m['observed_forward_years']==[1,2]
          assert m['six_year_validation']=='NOT_EMPIRICALLY_VALIDATED_HYPOTHETICAL_EXTENSION'
          for f,h in m['files'].items():
              assert hashlib.sha256((out/f).read_bytes()).hexdigest()==h,(f,'DIGEST')
          rows=list(csv.DictReader((out/'CAL26_V1R18_All_565_Two_Year_and_Six_Year_Shadow.csv').open()))
          assert len(rows)==565 and len({r['player'] for r in rows})==565
          assert sum(r['position']=='QB' for r in rows)==64
          assert sum(r['is_approved_owner_anchor']=='True' for r in rows)==15
          assert sum(r['is_accepted_control']=='True' for r in rows)==18
          for r in rows:
              if r['is_approved_owner_anchor']=='True' or r['is_accepted_control']=='True':
                  assert r['current_fv']==r['empirical_y1_y2_shadow_fv']==r['scenario_six_year_shadow_fv']
          print('PASS independent verification: 565 players / 64 QBs / 33 controls / two empirical years / research only')
          PY_VERIFY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS repository remained clean'
      - name: Upload research evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R18-565-Historical-Retention-Research-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R18_Evidence
          if-no-files-found: warn
          retention-days: 60
