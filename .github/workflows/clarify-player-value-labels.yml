name: Clarify Player Value Labels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked live Trade Desk
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_INDEX_BLOB="241d93440ba046046498ff9c0bf4e61825a3d54d"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"
          echo "Expected index.html blob: $EXPECTED_INDEX_BLOB"
          echo "Actual index.html blob:   $ACTUAL_INDEX_BLOB"
          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-pre-value-label-clarity-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Add plain-language value labels
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "PLAYER_VALUE_LABEL_CLARITY_V1"
          if marker in text:
              raise SystemExit(f"{marker} already present; refusing to double-apply.")

          required = [
              'class="asset-range',
              'class="asset-market"',
              'id="sidesWrap"',
              "MARKET_VALUE_UI_V1",
              "VALUE_UNCERTAINTY_UI_V1",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise RuntimeError("Expected value UI hooks missing: " + ", ".join(missing))

          original_scripts = re.findall(
              r"<script(?:\s[^>]*)?>.*?</script>",
              text,
              flags=re.S | re.I,
          )

          css = r'''
          <style id="player-value-label-clarity-styles">
          /* PLAYER_VALUE_LABEL_CLARITY_V1
             Presentation only. No player values, ranges, market values,
             trade totals, verdicts or Team Utility calculations change. */

          .value-label-guide{
            display:none;
            margin:0 0 10px;
            border:1px solid var(--line);
            border-radius:9px;
            background:rgba(22,50,79,.72);
            overflow:hidden;
          }

          .value-label-guide > summary{
            position:relative;
            min-height:38px;
            display:flex;
            align-items:center;
            padding:8px 38px 8px 11px;
            list-style:none;
            cursor:pointer;
            color:var(--text-muted);
            font-family:'IBM Plex Mono',monospace;
            font-size:8.5px;
            font-weight:600;
            letter-spacing:.055em;
            text-transform:uppercase;
            user-select:none;
          }

          .value-label-guide > summary::-webkit-details-marker{display:none;}

          .value-label-guide > summary::after{
            content:'+';
            position:absolute;
            right:13px;
            top:50%;
            transform:translateY(-50%);
            color:var(--text-dim);
            font-size:16px;
          }

          .value-label-guide[open] > summary::after{
            content:'−';
            color:var(--gold);
          }

          .value-label-guide[open] > summary{
            border-bottom:1px solid var(--line);
          }

          .value-label-guide-body{
            display:grid;
            gap:8px;
            padding:10px 11px 11px;
            color:var(--text-muted);
            font-size:10px;
            line-height:1.45;
          }

          .value-label-guide-row strong{color:var(--text);}

          .value-label-guide-note{
            color:var(--text-dim);
            font-family:'IBM Plex Mono',monospace;
            font-size:8.5px;
          }

          .asset-range,
          .asset-market{
            white-space:normal!important;
            line-height:1.28!important;
          }

          @media(max-width:720px){
            .value-label-guide{margin-bottom:8px;}
            .value-label-guide > summary{
              min-height:36px;
              font-size:8px;
            }
            .asset-range,
            .asset-market{
              font-size:8.3px!important;
            }
          }
          </style>
          '''

          js = r'''
          <script id="player-value-label-clarity-runtime">
          /* PLAYER_VALUE_LABEL_CLARITY_V1 — presentation only. */
          (function () {
            'use strict';

            function titleCase(text) {
              return String(text || '')
                .trim()
                .toLowerCase()
                .replace(/\b\w/g, ch => ch.toUpperCase());
            }

            function init() {
              if (document.documentElement.dataset.playerValueLabelClarity === '1') return;
              document.documentElement.dataset.playerValueLabelClarity = '1';

              const sides = document.getElementById('sidesWrap');
              if (!sides) {
                console.error('Value label clarity: #sidesWrap missing.');
                return;
              }

              const kicker = document.querySelector('.ui2-workspace-kicker');
              const workspace = document.querySelector('.ui2-trade-workspace');

              const guide = document.createElement('details');
              guide.className = 'value-label-guide';
              guide.innerHTML =
                '<summary>ⓘ What do these values mean?</summary>' +
                '<div class="value-label-guide-body">' +
                  '<div class="value-label-guide-row"><strong>Model value</strong> — the calculator’s official player value. This is what trade totals and the verdict use.</div>' +
                  '<div class="value-label-guide-row"><strong>Model range</strong> — how far the model value can move when uncertain inputs are stressed. It is not a probability or prediction interval.</div>' +
                  '<div class="value-label-guide-row"><strong>Uncertainty</strong> — how sensitive that player’s value is. “Very High” means more uncertainty, not more confidence.</div>' +
                  '<div class="value-label-guide-row"><strong>League market</strong> — what current league votes imply. The +/- number shows how far that is above or below the model value.</div>' +
                  '<div class="value-label-guide-note">League market is display-only and does not change the model value, Team Utility or trade verdict.</div>' +
                '</div>';

              if (workspace && workspace.parentNode) {
                workspace.parentNode.insertBefore(guide, workspace);
              } else if (kicker && kicker.parentNode) {
                kicker.insertAdjacentElement('afterend', guide);
              }

              function clarifyRow(row) {
                const mainValue = row.querySelector('.asset-value');
                if (mainValue && /^Fund\.\s+/i.test(mainValue.textContent || '')) {
                  mainValue.textContent = (mainValue.textContent || '')
                    .replace(/^Fund\.\s+/i, 'Model ');
                }

                const range = row.querySelector('.asset-range');
                if (range) {
                  const raw = (range.textContent || '').trim();
                  const match = raw.match(/^Fund\.\s*range\s+(.+?)\s+·\s+(.+)$/i);
                  if (match) {
                    range.textContent =
                      'Model range ' + match[1].trim() +
                      ' · Uncertainty: ' + titleCase(match[2]);
                    range.title =
                      'Sensitivity range around the official model value. ' +
                      'This is not a probability interval. Higher uncertainty ' +
                      'means the player value is more sensitive to assumptions.';
                  }
                }

                const market = row.querySelector('.asset-market');
                if (market) {
                  const raw = (market.textContent || '').trim();
                  const match = raw.match(/^Market\s+([\d,]+)\s+·\s+([+\-−]?[\d,]+)$/i);
                  if (match) {
                    const delta = match[2].trim();
                    market.textContent =
                      'League market ' + match[1] +
                      ' · ' + delta + ' vs model';
                    market.title =
                      'What current league votes imply for this player. ' +
                      delta + ' is the difference versus the official model ' +
                      'value. League market is display-only and is not blended ' +
                      'into the trade verdict.';
                  }
                }
              }

              function clarifySideLabels() {
                sides.querySelectorAll('.side-total-label').forEach(label => {
                  if (/^Fundamental$/i.test((label.textContent || '').trim())) {
                    label.textContent = 'Model total';
                  }
                });
              }

              function refresh() {
                sides.querySelectorAll('.asset-row').forEach(clarifyRow);
                clarifySideLabels();
                guide.style.display = sides.querySelector('.asset-range, .asset-market')
                  ? 'block'
                  : 'none';
              }

              let scheduled = false;
              function scheduleRefresh() {
                if (scheduled) return;
                scheduled = true;
                requestAnimationFrame(() => {
                  scheduled = false;
                  refresh();
                });
              }

              if (typeof MutationObserver !== 'undefined') {
                new MutationObserver(scheduleRefresh).observe(sides, {
                  childList:true,
                  subtree:true
                });
              }

              refresh();
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init, { once:true });
            } else {
              init();
            }
          })();
          </script>
          '''

          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          if "</head>" not in text or "</body>" not in text:
              raise RuntimeError("index.html missing closing head/body tags")

          text = text.replace("</head>", css + "\n</head>", 1)
          text = text.replace("</body>", js + "\n</body>", 1)

          missing_scripts = [i for i, block in enumerate(original_scripts) if block not in text]
          if missing_scripts:
              raise RuntimeError("Existing production script blocks changed: " + str(missing_scripts))

          if text.count(marker) != 2:
              raise RuntimeError(f"Unexpected {marker} count: {text.count(marker)}")

          path.write_text(text, encoding="utf-8")

          print(f"PASS preserved {len(original_scripts)} existing production script blocks byte-for-byte")
          print("PASS plain-language player value labels appended")
          PY

      - name: Validate value-label JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          js = re.search(
              r'<script id="player-value-label-clarity-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )
          css = re.search(
              r'<style id="player-value-label-clarity-styles">(.*?)</style>',
              html,
              flags=re.S,
          )

          if not js or not css:
              raise SystemExit("Value-label clarity UI blocks missing")

          required = [
              "Model value",
              "Model range",
              "Uncertainty",
              "League market",
              "vs model",
              "Model total",
          ]
          missing = [token for token in required if token not in js.group(1)]
          if missing:
              raise SystemExit(f"Value-label wording missing: {missing}")

          for label, block in [("CSS", css.group(1)), ("JS", js.group(1))]:
              bad = [
                  i for i, line in enumerate(block.splitlines(), 1)
                  if line != line.rstrip()
              ]
              if bad:
                  raise SystemExit(
                      f"{label} trailing whitespace at lines {bad[:10]}"
                  )
              print(f"PASS {label} whitespace")

          out = Path("/tmp/player-value-label-clarity.js")
          out.write_text(js.group(1), encoding="utf-8")
          print(out)
          PY

          node --check /tmp/player-value-label-clarity.js

      - name: Validate existing runtime self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Commit value-label clarity
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "index.html"

          if git diff --cached --quiet; then
            echo "No value-label UI changes to commit."
            exit 0
          fi

          git commit -m "Clarify player value labels"
          git push origin HEAD:main
