name: "CAL26 V1R61 - Historical Two-Horizon Owner Review Scale Scenarios (Read Only)"
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r61-readonly-owner-scale-review
  cancel-in-progress: false
jobs:
  two-horizon-owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without write permissions
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact successful R59 cross-position scenario
        uses: actions/download-artifact@v4
        with:
          name: CAL26_V1R59_518_PLAYER_CROSSPOS_SCALE_DECISION_NOT_FV
          run-id: 40054944157
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-r61/R59
      - name: Download exact successful R60 historical future-horizon research
        uses: actions/download-artifact@v4
        with:
          name: CAL26_V1R60_2021_25_SEVEN_POSITION_FUTURE_SURPLUS_RESEARCH_ONLY
          run-id: 40057944765
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cal26-r61/R60
      - name: Generate pinned 518-player and small owner review scenarios (read only)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/CAL26_V1R61_engine.py" <<'CAL26_V1R61_EMBEDDED_CODE'
          #!/usr/bin/env python3
          """CAL26 V1R61: predeclared owner-review-only 2026-28 surplus scaling scenarios.
          
          NO production reprice. No market or owner prices are used for fitting. Historical
          actual->actual signal is not prospective preseason projection validation.
          """
          import argparse
          import csv
          import hashlib
          import io
          import json
          import math
          import pathlib
          from collections import Counter
          
          ROOT='CAL26_V1R61'
          POS=('QB','RB','WR','TE','DL','LB','DB')
          HORIZON_DISCOUNT=0.85
          SCALES=(15,20,25)  # deliberately uncalibrated R59 assumption scenarios
          PIN={
           'R59':{
            'CAL26_V1R59_manifest.json':'89cfb2c39e750dedb30500679efb7e2dc56ff42fa11e6b8454e23180db662bbb',
            'CAL26_V1R59_518_year0_crosspos_sensitivity_NOT_FV.csv':'4b7b82d3656d3634d648a61d99adbc8d80fe74c759d6b6f98e492fc73c91cdac'},
           'R60':{
            'CAL26_V1R60_manifest.json':'cc904df07daa334b5a16c2595f0499750716d1d6841287117bd6ee691e0dde1b',
            'CAL26_V1R60_21_position_horizon_holdouts.csv':'9d5f07824a7e899bd2c6eab4ba7075a5ecc560c19c70ec2d23f0f74fe83bf395',
            'CAL26_V1R60_518_nextseason_SURPLUS_NOT_FV.csv':'885860bc2db5b7eb1d8f3055030e9e172166a115bac58e4427df768963059b93'}}
          ANCHORS=('bryce young','jayden daniels','cj stroud','caleb williams','drake maye')
          
          def check(x,msg):
           if not x:raise AssertionError(msg)
          
          def sha(x):return hashlib.sha256(x).hexdigest()
          
          def read_verified(folder,group):
           out={}
           for filename,expected in PIN[group].items():
            content=(folder/filename).read_bytes()
            check(sha(content)==expected,'PIN_DRIFT_'+group+'_'+filename)
            out[filename]=content
           return out
          
          def read_csv(b):return list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))
          
          def csv_output(rows,cols):
           f=io.StringIO(newline='');w=csv.DictWriter(f,fieldnames=cols,lineterminator='\n',extrasaction='ignore');w.writeheader()
           for r in rows:w.writerow({k:r.get(k,'') for k in cols})
           return f.getvalue()
          
          def fnum(s):
           v=float(s)
           check(math.isfinite(v),'NONFINITE_NUMERIC_INPUT')
           return v
          
          def yes(s):return str(s).strip().lower()=='true'
          
          def predict(x,m):
           check(m is not None,'MISSING_MODEL')
           return max(0.,fnum(m['slope'])*x+fnum(m['intercept_surplus']))
          
          def subtotal(y0,h1,h2):
           check(all(math.isfinite(z) and z>=0 for z in (y0,h1,h2)),'BAD_SURPLUS')
           return y0+HORIZON_DISCOUNT*h1+HORIZON_DISCOUNT**2*h2
          
          def models_from(rows):
           check(len(rows)==21,'HORIZON_COUNT_DRIFT')
           check({(r['position'],int(r['horizon_years'])) for r in rows}=={(p,h) for p in POS for h in (1,2,3)},'POSITION_HORIZON_GRID_DRIFT')
           models={(r['position'],int(r['horizon_years'])):r for r in rows}
           for p in POS:
            for h in (1,2):
             m=models[p,h];check(int(m['outer_test_n'])>0,'MISSING_OUTER_HOLDOUT_'+p)
             check(yes(m['withheld_future_projection_transport']),'PRESEASON_TRANSPORT_STATUS_DRIFT')
            check(int(models[p,3]['outer_test_n'])==0 and models[p,3]['horizon_status']=='NO_OUTER_HOLDOUT','H3_VALIDATION_DRIFT')
           return models
          
          def rate(y0,m1,m2,scale):return round(scale*subtotal(y0,predict(y0,m1),predict(y0,m2)))
          
          def main(r59,r60,out):
           a=read_verified(r59,'R59');b=read_verified(r60,'R60')
           m59=json.loads(a['CAL26_V1R59_manifest.json']);m60=json.loads(b['CAL26_V1R60_manifest.json'])
           check(m59['semantic_status']=='518_PLAYER_SHARED_YEAR0_SCALE_SENSITIVITY__CARDINAL_FV_NOT_IDENTIFIED__HOLD','UPSTREAM_R59_SEMANTIC_DRIFT')
           check(m60['semantic_status']=='HISTORICAL_2021_25_SEVEN_POSITION_SURPLUS_HORIZONS__FV_HOLD','UPSTREAM_R60_SEMANTIC_DRIFT')
           check(m59['n_2026_projected_players']==m60['n_2026_frozen_candidates']==518 and m60['n_frozen_unprojected_preserved']==31,'FROZEN_COVERAGE_DRIFT')
           check(not m59['owner_targets_used'] and not m59['market_values_as_price_targets_used'],'R59_TARGET_LABEL_DRIFT')
           check(not m60['market_or_owner_price_targets_used'] and m60['no_2026_actuals_read'],'R60_TARGET_LABEL_OR_ACTUAL_DRIFT')
           check(not m59['production_change_authorized'] and not m60['production_change_authorized'],'PRODUCTION_LOCK_DRIFT')
           check(not m59['2026_future_week7_later_actuals_read'] and not m60['future_2026_weeks8_12_read'],'FUTURE_2026_LEAK')
           check(m59['2026_projection_contains_unmodeled_weekly_threshold_bonuses'] and not m60['shared_cardinal_dynasty_price_identified'],'SCALE_SOURCE_STATUS_DRIFT')
           ra=read_csv(a['CAL26_V1R59_518_year0_crosspos_sensitivity_NOT_FV.csv'])
           rb=read_csv(b['CAL26_V1R60_518_nextseason_SURPLUS_NOT_FV.csv'])
           check(len(ra)==len(rb)==518,'518_ROW_INTEGRITY')
           def ix(rows):
            out={(r['name'],r['position']):r for r in rows};check(len(out)==len(rows),'DUPLICATE_IDENTITY');return out
           da,db=ix(ra),ix(rb)
           check(set(da)==set(db),'IDENTITY_JOIN_DRIFT')
           models=models_from(read_csv(b['CAL26_V1R60_21_position_horizon_holdouts.csv']))
           check(tuple(p for p in POS if all(yes(models[p,h]['test_model_beats_both_baselines']) for h in (1,2)))==('QB','WR','TE','DL','DB'),'H1_H2_HOLDOUT_POLICY_DRIFT')
           outrows=[]
           for key in sorted(da,key=lambda k:(POS.index(k[1]),-fnum(da[k]['year0_surplus_points']),k[0])):
            ar,br=da[key],db[key];name,pos=key
            check(ar['frozen_FV_UNCHANGED']==br['frozen_FV_UNCHANGED'],'FROZEN_FV_JOIN_DRIFT_'+name)
            check(ar['production_change_authorized']=='False' and br['production_change_authorized']=='False','UPSTREAM_FV_AUTH_DRIFT')
            y=fnum(ar['year0_surplus_points']);check(abs(y-fnum(br['2026_projected_year0_surplus_NOT_FV']))<.002,'SURPLUS_JOIN_DRIFT_'+name)
            lo=fnum(ar['rank_minus_3_stronger_replacement_surplus']);hi=fnum(ar['rank_plus_3_weaker_replacement_surplus'])
            check(lo<=y+.002 and hi>=y-.002,'REPLACEMENT_MONOTONIC_DRIFT_'+name)
            mh1=models[pos,1];mh2=models[pos,2]
            h1wins=yes(mh1['test_model_beats_both_baselines']);h2wins=yes(mh2['test_model_beats_both_baselines'])
            status=('BLOCK_H1_AND_H2_UNVALIDATED' if not h1wins else ('BLOCK_H2_UNVALIDATED' if not h2wins else ('BLOCK_NO_POSITIVE_YEAR0_SURPLUS' if y<=0 else 'RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV')))
            eligible=(status=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV')
            p1=predict(y,mh1) if h1wins else None
            p2=predict(y,mh2) if h2wins else None
            # 2027 model provided in R60 is an empirical sensitivity, not a validated transport
            if p1 is not None and br['2027_empirical_nextseason_SURPLUS_SENSITIVITY_NOT_FV']:
             check(abs(p1-fnum(br['2027_empirical_nextseason_SURPLUS_SENSITIVITY_NOT_FV']))<.011,'H1_MODEL_PARITY_DRIFT_'+name)
            o={'name':name,'position':pos,'frozen_FV_REFERENCE_ONLY':ar['frozen_FV_UNCHANGED'],
               'projected_2026_points_NOT_EXACT_LOG':ar['2026_projected_points'],
               'lineup_reference_rank':ar['league_starter_rank_assumption'],
               '2026_year0_surplus':round(y,3),
               '2026_replacement_minus3_surplus':round(lo,3),'2026_replacement_plus3_surplus':round(hi,3),
               'H1_2027_holdout_n':mh1['outer_test_n'],'H1_test_beats_both':h1wins,
               'H2_2028_holdout_n':mh2['outer_test_n'],'H2_test_beats_both':h2wins,
               'H3_2029_outer_test_n':0,
               '2027_model_surplus_proxy':round(p1,3) if p1 is not None else '',
               '2028_model_surplus_proxy':round(p2,3) if p2 is not None else '',
               'three_season_surplus_2026_2028_proxy':round(subtotal(y,p1,p2),3) if eligible else '',
               'scenario_15_UNCALIBRATED_NOT_FV':rate(y,mh1,mh2,15) if eligible else '',
               'scenario_20_UNCALIBRATED_NOT_FV':rate(y,mh1,mh2,20) if eligible else '',
               'scenario_25_UNCALIBRATED_NOT_FV':rate(y,mh1,mh2,25) if eligible else '',
               'scenario_20_stronger_replacement_NOT_FV':rate(lo,mh1,mh2,20) if eligible else '',
               'scenario_20_weaker_replacement_NOT_FV':rate(hi,mh1,mh2,20) if eligible else '',
               'scenario_status':status,
               '2026_preseason_to_historical_transport_verified':False,
               'price_per_surplus_unit_calibrated':False,
               'three_year_future_holdout_validated':False,
               '2026_projected_weekly_bonus_complete':False,
               'owner_prices_used_as_labels':False,
               'production_change_authorized':False}
            if eligible:check(o['scenario_20_stronger_replacement_NOT_FV']<=o['scenario_20_UNCALIBRATED_NOT_FV']<=o['scenario_20_weaker_replacement_NOT_FV'],'SCENARIO_RANK_STRESS_NONMONOTONE')
            outrows.append(o)
           check(len(outrows)==518 and Counter(x['position'] for x in outrows)==Counter(x['position'] for x in rb),'OUTPUT_COVERAGE_DRIFT')
           eligible=[x for x in outrows if x['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV']
           check(len(eligible)>60,'INSUFFICIENT_REVIEW_CANDIDATES')
           check(all(x['position'] in ('QB','WR','TE','DL','DB') for x in eligible),'INELIGIBLE_POSITION_NUMERIC')
           check(all(not x['scenario_20_UNCALIBRATED_NOT_FV'] for x in outrows if x not in eligible),'UNVALIDATED_POSITION_NUMERIC_LEAK')
           # Predeclared 34-ish comparative examples; not random or selected for agreement with target prices.
           bypos={p:[x for x in outrows if x['position']==p] for p in POS}
           review=[];seen=set()
           def add(x,label):
            if x is None:return
            k=(x['name'],x['position'])
            if k not in seen:
             v=dict(x);v['review_selection_basis']=label;v['owner_rating_blank']='';v['owner_comment_blank']='';v['owner_approval_blank']='';review.append(v);seen.add(k)
           qb=bypos['QB']
           for name in ANCHORS:add(next((x for x in qb if x['name']==name),None),'PRESPECIFIED_OWNER_QB_DIAGNOSTIC')
           for x in qb[:3]:add(x,'TOP_YEAR0_SURPLUS')
           for x in (qb[len(qb)//2],next((x for x in qb if x['2026_year0_surplus']==0),None)):add(x,'MID_AND_REPLACEMENT_BOUNDARY')
           for p in POS[1:]:
            z=bypos[p];positive=[x for x in z if x['2026_year0_surplus']>0]
            for x in z[:2]:add(x,'TOP_2_YEAR0_SURPLUS')
            if positive:add(positive[len(positive)//2],'MID_POSITIVE_YEAR0_SURPLUS')
            add(next((x for x in z if x['2026_year0_surplus']==0),None),'REPLACEMENT_BOUNDARY')
           check(all(any(r['position']==p for r in review) for p in POS),'REVIEW_POSITION_COVERAGE')
           check(all(any(r['name']==n and r['position']=='QB' for r in review) for n in ANCHORS),'DIAGNOSTIC_QB_MISSING')
           check(25<=len(review)<=38,'UNEXPECTED_REVIEW_CARD_COUNT')
           stats=[]
           for p in POS:
            arr=bypos[p]
            stats.append({'position':p,'projected_candidates':len(arr),'year0_positive':sum(x['2026_year0_surplus']>0 for x in arr),
               'H1_outer_test_n':models[p,1]['outer_test_n'], 'H1_beats_both':yes(models[p,1]['test_model_beats_both_baselines']),
               'H2_outer_test_n':models[p,2]['outer_test_n'], 'H2_beats_both':yes(models[p,2]['test_model_beats_both_baselines']),
               'H3_outer_test_n':0,'three_season_uncalibrated_sensitivity_rows':sum(x['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV' for x in arr),
               'price_released':False})
           top=sorted(eligible,key=lambda x:-x['scenario_20_UNCALIBRATED_NOT_FV'])[:10]
           md=['# CAL26 V1R61 — Small owner review of historical two-horizon surplus scenarios',
               '**Decision:** READ ONLY. No genuine dynasty FV is authorized. All 549 frozen players remain unchanged, including 31 with no projected row.', '',
               '## What is empirically supported',
               'R60 H1 and H2 historical same-player LOG-scored actual-to-future tests beat both predeclared historical baselines for QB, WR, TE, DL and DB. RB failed H1 and H2; LB failed H2. Consequently RB/LB have **WITHHELD** three-season pricing scenarios (not zero-valued players). H3 has zero independent outer-test cases for all positions.',
               '', '## Transparent scenarios (NOT price calibration)',
               'For selected positive 2026 projected year-zero surplus players on the five eligible positions, the three-season proxy is 2026 surplus + 0.85 × predicted 2027 surplus + 0.85² × predicted 2028 surplus. The H1/H2 historical regressions take the same initial surplus as input (they are NOT iteratively chained).',
               'The values at 15, 20 and 25 units per surplus-point are explicitly **arbitrary R59 owner-choice sensitivities**. They are not learned from transactions, current FV, owner targets or market quotes. The 2026 projected LOG points lack some weekly milestone bonuses; transferring actual→actual models to these preseason projections was **not validated**. The comparable cardinal dynasty FV scale is therefore still missing.',
               '', '## Position decision table',
               '|Position|518 row share|H1 winner|H2 winner|Eligible positive year0 research scenarios|','|---|---:|---|---|---:|']
           for s in stats:md.append(f"|{s['position']}|{s['projected_candidates']}|{s['H1_beats_both']}|{s['H2_beats_both']}|{s['three_season_uncalibrated_sensitivity_rows']}|")
           md+=['','## Illustrative top-scoring 20x scenario (NOT FV)','|Player|Pos|Current frozen FV (reference)|2026–28 20x scenario, uncalibrated|', '|---|---|---:|---:|']
           for r in top:md.append(f"|{r['name']}|{r['position']}|{r['frozen_FV_REFERENCE_ONLY']}|{r['scenario_20_UNCALIBRATED_NOT_FV']}|")
           md+=['',f"**Reviewer shortlist:** {len(review)} deterministic cards, including five prespecified QB diagnostics, top/mid/replacement boundary positions. Missing historical future model coverage is displayed as WITHHELD rather than 0.",
              '', '**Before any production release:** obtain explicit owner choice of scale and horizon, reconcile projection-to-LOG scoring and historical projection transport, agree on position-specific risk and career duration, and authorize an exact, small, reversible player set. Do not turn these uncalibrated scenarios into production FV by default.',
              '', '**No 2026 Weeks 7+ outcomes, sealed Weeks 8–12 targets, live FV mutations, DLF/MV price-fitting, or age model invention.**','']
           out.mkdir(parents=True,exist_ok=True)
           outputs={ROOT+'_518_player_scale_scenarios_NOT_FV.csv':csv_output(outrows,list(outrows[0])),
                    ROOT+'_owner_review_cards_NOT_FV.csv':csv_output(review,list(review[0])),
                    ROOT+'_7_position_decision.csv':csv_output(stats,list(stats[0])),
                    ROOT+'_decision.md':'\n'.join(md)}
           for n,content in outputs.items():(out/n).write_text(content,encoding='utf-8')
           manifest={'workflow':'CAL26 V1R61 - Historical Two-Horizon Owner Review Scale Scenarios (Read Only)',
            'semantic_status':'TWO_HORIZON_OWNER_REVIEW_SCENARIO_NOT_FV__PRODUCTION_HOLD',
            'R59_run_id':40054944157,'R60_run_id':40057944765,
            'exact_input_sha256':PIN,
            'n_full_projected_players':518,'n_unprojected_frozen_players_unchanged':31,'n_frozen_player_FV_untouched':549,
            'review_cards':len(review),'research_scenario_eligible':len(eligible),
            'eligible_positions':['QB','WR','TE','DL','DB'],'H1_and_H2_failed_positions':['RB','LB'],
            'H3_independent_holdout_n':0,'year0_2026_projection_exact_LOG':False,
            '2026_preseason_projection_transfer_certified':False,'owner_defined_price_per_point':False,
            'scale_values':list(SCALES),'discount_H1_H2':HORIZON_DISCOUNT,'scenario_scale_empirically_calibrated':False,
            'owner_target_pricing_used':False,'market_prices_as_training_labels_used':False,
            '2026_week7_or_later_read':False,'sealed_2026_weeks8_12_read':False,
            'production_change_authorized':False,'live_index_html_modified':False,
            'output_sha256':{n:sha(content.encode()) for n,content in outputs.items()}}
           (out/(ROOT+'_manifest.json')).write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
           print(json.dumps({'status':manifest['semantic_status'],'n_all':len(outrows),'eligible_not_prices':len(eligible),'shortlist':len(review),'H1H2_positions':manifest['eligible_positions'],'no_price_release':True}))
           return manifest
          
          def selftest():
           check(abs(subtotal(100,60,30)-(100+.85*60+.85**2*30))<1e-9,'DISCOUNT_MATH')
           m={'slope':'0.6','intercept_surplus':'3'};check(abs(predict(100,m)-63)<1e-9,'HOLDOUT_FORMULA')
           check(rate(100,m,m,15)<rate(100,m,m,25),'SCENARIO_MONOTONE')
           check(rate(0,m,m,20)>0,'MUST_WITHHOLD_ZERO_BASELINE_CASE')
           print('CAL26_V1R61_SELFTEST_GREEN discount, scale order, model formula, zero-year0 withholding')
          
          if __name__=='__main__':
           a=argparse.ArgumentParser();a.add_argument('--r59',type=pathlib.Path);a.add_argument('--r60',type=pathlib.Path);a.add_argument('--out',type=pathlib.Path);a.add_argument('--selftest',action='store_true');arg=a.parse_args()
           if arg.selftest:selftest()
           else:
            check(arg.r59 and arg.r60 and arg.out,'REQUIRED_INPUTS')
            main(arg.r59,arg.r60,arg.out)
          CAL26_V1R61_EMBEDDED_CODE
          python -m py_compile "$RUNNER_TEMP/CAL26_V1R61_engine.py"
          python "$RUNNER_TEMP/CAL26_V1R61_engine.py" --selftest
          python "$RUNNER_TEMP/CAL26_V1R61_engine.py" \
            --r59 "$RUNNER_TEMP/cal26-r61/R59" \
            --r60 "$RUNNER_TEMP/cal26-r61/R60" \
            --out "$RUNNER_TEMP/cal26-r61-results"
          python - "$RUNNER_TEMP/cal26-r61-results" <<'CAL26_V1R61_VERIFY'
          import csv,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);m=json.loads((root/'CAL26_V1R61_manifest.json').read_text())
          assert m['semantic_status']=='TWO_HORIZON_OWNER_REVIEW_SCENARIO_NOT_FV__PRODUCTION_HOLD'
          assert m['n_full_projected_players']==518 and m['n_frozen_player_FV_untouched']==549
          assert m['n_unprojected_frozen_players_unchanged']==31 and m['H3_independent_holdout_n']==0
          assert m['eligible_positions']==['QB','WR','TE','DL','DB']
          assert m['H1_and_H2_failed_positions']==['RB','LB']
          assert not m['production_change_authorized'] and not m['live_index_html_modified']
          assert not m['2026_week7_or_later_read'] and not m['sealed_2026_weeks8_12_read']
          assert not m['scenario_scale_empirically_calibrated'] and not m['2026_preseason_projection_transfer_certified']
          assert not m['market_prices_as_training_labels_used'] and not m['owner_target_pricing_used']
          for name,digest in m['output_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          with (root/'CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv').open() as f:r=list(csv.DictReader(f))
          with (root/'CAL26_V1R61_owner_review_cards_NOT_FV.csv').open() as f:cards=list(csv.DictReader(f))
          assert len(r)==518 and len(cards)==m['review_cards']
          assert sum(z['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV' for z in r)==m['research_scenario_eligible']
          assert all(z['production_change_authorized']=='False' for z in r)
          assert all(not z['scenario_20_UNCALIBRATED_NOT_FV'] for z in r if z['position'] in ('RB','LB'))
          print('R61_VERIFIED_OWNER_REVIEW_RESEARCH_ONLY_FV_HOLD')
          CAL26_V1R61_VERIFY
          test -z "$(git status --porcelain)"
          cat "$RUNNER_TEMP/cal26-r61-results/CAL26_V1R61_decision.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified owner review and 518 full scenarios (read only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAL26_V1R61_OWNER_REVIEW_518_SCALE_SCENARIOS_NOT_FV
          path: ${{ runner.temp }}/cal26-r61-results/
          retention-days: 60
          if-no-files-found: warn
