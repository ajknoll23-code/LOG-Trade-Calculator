name: Activate Package Adjustment Controlled Live

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify production validation is green
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/package-adjustment-production-candidate-v1/production_validation.json").read_text())
          assert d["launch_gates"]["all_passed"] is True
          assert d["recommendation"]["controlled_launch_recommended"] is True
          assert d["synthetic_regression"]["shape_count"] == 20000
          assert d["frozen_experiment_replay"]["v3_preserved_pct"] == 100.0
          assert d["frozen_experiment_replay"]["v4_preserved_pct"] == 100.0
          assert d["candidate"]["material_third_min_package_share"] == 0.16
          print("Production validation green.")
          PY

      - name: Activate controlled-live Package Adjustment
        run: |
          echo '' | base64 --decode > /tmp/activate_package_adjustment.py
          python3 /tmp/activate_package_adjustment.py

      - name: Run live JavaScript contract tests
        run: |
          echo '' | base64 --decode > /tmp/test_package_adjustment_live.js
          node /tmp/test_package_adjustment_live.js

      - name: Verify live static contract
        run: |
          echo '' | base64 --decode > /tmp/verify_package_adjustment_live.py
          python3 /tmp/verify_package_adjustment_live.py

      - name: Commit controlled live activation
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git add research/package-adjustment-production-candidate-v1/live_deployment.json

          if git diff --cached --quiet; then
            echo "No controlled-live Package Adjustment changes."
            exit 0
          fi

          git commit -m "Activate Package Adjustment controlled live"
          git pull --rebase origin main
          git push origin main
