name: A-NL00R1 - Install and Live-Preview LOOG Newsletter
run-name: A-NL00R1 ${{ inputs.mode }} - live Sleeper preview, install safe newsletter

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'PREVIEW_ONLY checks live Sleeper and publishes HTML/TXT artifacts; APPLY installs schedule'
        required: true
        type: choice
        default: PREVIEW_ONLY
        options:
          - PREVIEW_ONLY
          - APPLY

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  newsletter_install:
    name: Live matchups + recap preview, no emails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout immutable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot protected production and frozen files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > "$RUNNER_TEMP/nl00_base_sha.txt"
          sha256sum index.html free-agent-board.html config.json \
            scripts/validation/repo_regression_checks.py \
            scripts/validation/snapshot_values.py \
            research/model-history/identity/2026-w06-sleeper-registry.json \
            data/league_rosters.json data/free_agents.json data/free_agent_utility_v1.json \
            > "$RUNNER_TEMP/nl00_protected.sha"
          echo 'PASS: protected V1, FV, FV+, MV, frozen studies and live inputs fingerprinted.'

      - name: Stage exact newsletter release files in runner only
        shell: bash
