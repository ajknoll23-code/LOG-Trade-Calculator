name: Package Adjustment V8 - Phase 1F Pre-Vote Operational Hardening V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-v8-research-writes
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard frozen pre-vote inputs
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-v8"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$D/development_catalog_v1.json")" = \
            "6ec00393baf7b8a7e99df98709a66e35ffdb1d88"
          test "$(git hash-object "$D/development_catalog_manifest_v1.json")" = \
            "970d52eb39d093c27f6086ba018f62bd6d53217a"
          test "$(git hash-object "$D/development_catalog_audit_v1.json")" = \
            "9c9d6303ed27f26ab36b273fa99942be2a75e7c0"
          test "$(git hash-object "$D/catalog_selection_certificate_v1.json")" = \
            "15f361b655042e281ba8454df75f9d0217c636f5"
          test "$(git hash-object "$D/fixed50_protocol_amendment_v1.json")" = \
            "d2b931dc03acee62b10091f064737b125467b705"

          test "$(git hash-object "$D/evaluate_development_v1.py")" = \
            "bef73c81bdff771f51b4f18bea011b30a71e9935"
          test "$(git hash-object "$D/evaluation_protocol_v1.json")" = \
            "263db22eb41be6b458479d7fb76ad61f55b0bcd8"
          test "$(git hash-object "$D/evaluation_fold_assignment_v1.json")" = \
            "c9551211d4369d8234321e98223111cabee28d82"
          test "$(git hash-object "$D/evaluation_harness_selftest_v1.json")" = \
            "ff8d6791a7cbb911bb73f55ce5f41e96d82e8162"
          test "$(git hash-object "$D/evaluation_engine_manifest_v1.json")" = \
            "6d49b1a1be4c3dd108820de9db7c370b0185a10b"
          test "$(git hash-object "$D/evaluation_engine_freeze_v1.md")" = \
            "0c741c9184fa61e365a00b333d26e65b0af571bf"
          test -f data/league_rosters.json

          for p in \
            "$D/player_status_audit_v1.json" \
            "$D/v8_production_shadow_v1.py" \
            "$D/production_shadow_selftest_v1.json" \
            "$D/voting_randomization_schedule_v1.json" \
            "$D/voting_integrity_contract_v1.json" \
            "$D/validate_voting_dataset_v1.py" \
            "$D/voting_integrity_selftest_v1.json" \
            "$D/pre_vote_operational_hardening_manifest_v1.json"
          do test ! -e "$p"; done

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path("research/package-adjustment-v8")
          cat=json.loads((d/"development_catalog_v1.json").read_text())
          man=json.loads((d/"development_catalog_manifest_v1.json").read_text())
          audit=json.loads((d/"development_catalog_audit_v1.json").read_text())
          cert=json.loads((d/"catalog_selection_certificate_v1.json").read_text())
          amend=json.loads((d/"fixed50_protocol_amendment_v1.json").read_text())
          ep=json.loads((d/"evaluation_protocol_v1.json").read_text())
          ef=json.loads((d/"evaluation_fold_assignment_v1.json").read_text())
          es=json.loads((d/"evaluation_harness_selftest_v1.json").read_text())
          em=json.loads((d/"evaluation_engine_manifest_v1.json").read_text())

          assert cat["status"]=="FROZEN_REVIEW_REQUIRED_NOT_ACTIVATED"
          assert cat["voting_activated"] is False
          assert man["challenge_signature_sha256"]=="86961c3397c542d4a3871a358274df336ed5978abf416e6fcc99664efa8c7868"
          assert man["reproduction_contract"]=="CERTIFICATE_REPLAY_NO_SECOND_OPTIMIZER_INVOCATION"
          assert man["v8_votes_read"] is False
          assert audit["all_hard_gates_pass"] is True
          assert audit["freshness"]["unique_side_package_count"]==80
          assert audit["freshness"]["repeated_exact_side_package_count"]==0
          assert audit["selection"]["global_minimum_asset_fv_threshold"]==2579
          assert cert["challenge_signature_sha256"]==man["challenge_signature_sha256"]
          assert cert["global_minimum_asset_fv_threshold"]==2579
          assert cert["v8_votes_read"] is False

          assert amend["amended_development_maturity"]["required_accepted_complete_voters"]==50
          assert amend["amended_development_maturity"]["required_accepted_ballots"]==2000

          assert ep["status"]=="FROZEN_PRE_VOTE_EVALUATOR"
          assert ep["catalog_challenge_signature_sha256"]==man["challenge_signature_sha256"]
          assert ep["catalog_global_minimum_asset_fv_threshold"]==2579
          assert ep["catalog_unique_side_package_count"]==80
          assert ep["catalog_repeated_exact_side_package_count"]==0
          assert ep["evaluator_sha256"]=="d14b3fd4dad626cd0c1509288cb31787ad5d1a0a372c03c6fcce1eb53b9979ae"
          assert ep["v8_votes_read"] is False

          assert ef["status"]=="FROZEN_PRE_VOTE"
          assert ef["fold_count"]==5
          assert len(ef["challenge_to_fold"])==40
          assert es["status"]=="PASS"
          assert es["math_invariants"] is True
          assert es["synthetic_dataset_validation"]=={"ballots":2000,"challenges":40,"voters":50}

          assert em["status"]=="PASS"
          assert em["evaluator_sha256"]==ep["evaluator_sha256"]
          assert em["protocol_sha256"]=="f15642576cbfd34958c294607ae2891f3522e5fae5108a13a9249a3b4168efb3"
          assert em["fold_assignment_sha256"]=="f8cde22eb8776b121f31dc576ee28202014f25e771d320d329c9996f9cfbd2f5"
          assert em["selftest_sha256"]=="1b57f1fb71d56db5814f044fa948df7b44267bbb6d3fcdb1b79a38c01397c255"
          assert em["v8_votes_read"] is False
          assert em["production_change_authorized"] is False

          print("PASS: exact Phase 1C V6 catalog and Phase 1E V2 evaluator are frozen before voting.")
          PY

      - name: Audit selected player current roster status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,time
          from collections import defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          cat=json.loads((d/"development_catalog_v1.json").read_text())
          rosters=json.loads(Path("data/league_rosters.json").read_text())

          def norm(s):
              return re.sub(r"[^a-z0-9]+"," ",str(s).lower()).strip()

          sync=float(rosters["synced_at"])
          age_hours=(time.time()-sync)/3600
          if age_hours<-.1 or age_hours>24:
              raise SystemExit(f"league_rosters.json freshness gate failed: {age_hours:.2f} hours")

          records=[]
          def walk(x):
              if isinstance(x,dict):
                  if "name" in x and "player_id" in x and "team" in x:
                      records.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(rosters["rosters"])

          by_name=defaultdict(dict)
          for r in records:
              pid=str(r.get("player_id") or "")
              by_name[norm(r["name"])][pid]=r

          selected={}
          for c in cat["challenges"]:
              for side in ("side_A","side_B"):
                  for p in c[side]["assets"]:
                      selected[p["key"]]=p

          missing=[]; ambiguous=[]; invalid=[]; team_drift=[]; rows=[]
          invalid_statuses={"retired","suspended - retired"}
          injury_inactive=[]; overrides={}

          for key,p in sorted(selected.items()):
              candidates=list(by_name.get(norm(p["name"]),{}).values())
              if not candidates:
                  missing.append(key); continue
              compatible=[
                  r for r in candidates
                  if p["pos"] in (r.get("fantasy_positions") or [])
                     or p["pos"]==r.get("position")
              ]
              if compatible: candidates=compatible
              if len(candidates)!=1:
                  ambiguous.append({"key":key,"matches":[str(r.get("player_id")) for r in candidates]})
                  continue
              r=candidates[0]
              status=str(r.get("status") or "").strip()
              injury_status=str(r.get("injury_status") or "").strip()
              team=r.get("team")

              # Sleeper marks players on IR as status="Inactive".
              # Injury status is explicitly display/research context only and
              # is not a catalog exclusion rule. Preserve a fail-closed gate
              # for retirement, missing NFL team, or unexplained inactivity.
              unexplained_inactive=(
                  status.lower()=="inactive"
                  and injury_status==""
              )
              if (
                  team in (None,"")
                  or status.lower() in invalid_statuses
                  or unexplained_inactive
              ):
                  invalid.append({
                      "key":key,
                      "name":p["name"],
                      "status":status,
                      "injury_status":injury_status or None,
                      "team":team,
                      "reason":(
                          "missing_team"
                          if team in (None,"")
                          else (
                              "retired_status"
                              if status.lower() in invalid_statuses
                              else "inactive_without_injury_designation"
                          )
                      ),
                  })
              elif status.lower()=="inactive":
                  injury_inactive.append({
                      "key":key,
                      "name":p["name"],
                      "status":status,
                      "injury_status":injury_status,
                      "team":team,
                  })

              if team!=p.get("team"):
                  team_drift.append({"key":key,"name":p["name"],"frozen_team":p.get("team"),"current_team":team})
                  overrides[key]=team
              rows.append({
                  "key":key,"name":p["name"],"pos":p["pos"],
                  "frozen_team":p.get("team"),"current_team":team,
                  "status":status,"injury_status":r.get("injury_status"),
                  "depth_chart_order":r.get("depth_chart_order"),
                  "player_id":str(r.get("player_id"))
              })

          if missing or ambiguous or invalid:
              raise SystemExit(json.dumps({"missing":missing,"ambiguous":ambiguous,"invalid":invalid},indent=2))

          audit={
              "schema_version":1,
              "study_id":cat["study_id"],
              "stage":"phase1f_player_status_audit",
              "status":"PASS_CURRENT_ROSTER_STATUS",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "league_rosters_synced_at_epoch":sync,
              "league_rosters_age_hours":age_hours,
              "selected_unique_players":len(selected),
              "resolved_players":len(rows),
              "missing_players":missing,
              "ambiguous_players":ambiguous,
              "invalid_current_status_players":invalid,
              "injury_inactive_player_count":len(injury_inactive),
              "injury_inactive_players":injury_inactive,
              "inactive_with_explicit_injury_is_allowed":True,
              "inactive_without_injury_designation_is_rejected":True,
              "team_drift_count":len(team_drift),
              "team_drift":team_drift,
              "voter_display_team_overrides":overrides,
              "injury_status_is_not_an_exclusion_rule":True,
              "fundamental_values_changed":False,
              "challenge_selection_changed":False,
              "v8_votes_read":False,
              "production_change_authorized":False,
              "players":rows
          }
          (d/"player_status_audit_v1.json").write_text(json.dumps(audit,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "status":audit["status"],
              "players":len(rows),
              "injury_inactive_players":len(injury_inactive),
              "team_drift":len(team_drift),
              "roster_age_hours":age_hours,
          },indent=2))
          PY

      - name: Freeze research-only V8 production shadow
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-v8"
          cat > "$D/v8_production_shadow_v1.py" <<'PY'
          #!/usr/bin/env python3
          import math

          Q_V6=2.9897594788655337
          SUPPORTED_TOPOLOGIES={"2v2","2v3","2v4","3v3","3v4","4v4"}

          def score_side(values,topology):
              vals=[float(v) for v in values]
              if topology not in SUPPORTED_TOPOLOGIES: raise ValueError("unsupported topology")
              a,b=map(int,topology.split("v"))
              if len(vals) not in {a,b}: raise ValueError("side cardinality does not match topology")
              if any(v<=0 for v in vals): raise ValueError("FV must be positive")
              if topology=="2v2": return sum(vals)
              return sum(v**Q_V6 for v in vals)**(1.0/Q_V6)

          def score_trade(side_a,side_b,topology):
              a,b=map(int,topology.split("v"))
              if len(side_a)!=a or len(side_b)!=b: raise ValueError("trade cardinality mismatch")
              sa=score_side(side_a,topology); sb=score_side(side_b,topology)
              return {"score_A":sa,"score_B":sb,"ratio_A_over_B":sa/sb,
                      "favored":"A" if sa>sb else ("B" if sb>sa else "TIE")}

          def selftest():
              for topology in sorted(SUPPORTED_TOPOLOGIES):
                  a,b=map(int,topology.split("v"))
                  A=[5000-250*i for i in range(a)]
                  B=[4800-225*i for i in range(b)]
                  r=score_trade(A,B,topology)
                  assert r["score_A"]>0 and r["score_B"]>0
                  for vals in (A,B):
                      s=score_side(vals,topology)
                      sr=score_side(list(reversed(vals)),topology)
                      assert abs(s-sr)<1e-9*max(1,s)
                      k=3.5
                      assert abs(score_side([k*x for x in vals],topology)-k*s)<1e-8*max(1,k*s)
                  if topology=="2v2":
                      assert abs(score_side(A,topology)-sum(A))<1e-9
              # One-point throw-in increases score but less than raw additive increase for non-2v2.
              x=[5000,3000]
              base=score_side(x,"2v3")
              grown=score_side(x+[1],"2v3")
              assert grown>base and (grown-base)<1.0
              return {"status":"PASS","topologies":sorted(SUPPORTED_TOPOLOGIES),"q":Q_V6}
          PY
          chmod +x "$D/v8_production_shadow_v1.py"
          python3 -m py_compile "$D/v8_production_shadow_v1.py"

          PYTHONPATH="$D" python3 - <<'PY' > "$D/production_shadow_selftest_v1.json"
          import json
          import v8_production_shadow_v1 as S
          print(json.dumps(S.selftest(),indent=2,sort_keys=True))
          PY

          python3 scripts/validation/check_package_adjustment_live.py

          PYTHONPATH="scripts/validation" python3 - <<'PY'
          import json,subprocess
          import check_package_adjustment_live as L

          text=L.INDEX.read_text(encoding="utf-8")
          parts=[
              L._extract_config(text),
              L._extract_function(text,"packageAdjustmentSize2Multiplier"),
              L._extract_function(text,"packageAdjustmentSize2CompositionFactor"),
              L._extract_function(text,"packageAdjustmentSize3V6Assessment"),
              L._extract_function(text,"packageAdjustmentAssessment"),
              L._extract_function(text,"packageAdjustmentForTrade"),
          ]
          harness=r"""
          let state={A:[],B:[]};
          function player(v){return {type:'player',pos:'WR',value:v,name:'P'};}
          function assess(a,b){state={A:a.map(player),B:b.map(player)};return packageAdjustmentAssessment();}
          const cases=[
            [[5000,4500],[4800,4700]],
            [[5000,4500],[4000,3000,2500]],
            [[5000,4500],[3500,3000,2600,2500]],
            [[5000,4000,3000],[4700,4300,3000]],
            [[5000,4000,3000],[4500,3500,3000,2500]],
            [[5000,4000,3000,2500],[4700,4300,3200,2600]]
          ];
          for(const [a,b] of cases){
            const r=assess(a,b);
            if(r.status!=='unsupported') throw new Error(`production multi-v-multi must fail closed: ${a.length}v${b.length} ${r.status}`);
          }
          process.stdout.write(JSON.stringify({status:'PASS',cases:cases.length}));
          """
          script="\n".join(parts)+"\n"+harness
          proc=subprocess.run(["node","-e",script],
                              cwd=L.ROOT,text=True,capture_output=True)
          if proc.returncode: raise SystemExit(proc.stderr)
          out=json.loads(proc.stdout)
          assert out=={"status":"PASS","cases":6}
          print("PASS: current V1.7 production remains fail-closed for all six V8 multi-v-multi topologies.")
          PY

      - name: Freeze balanced 50-voter randomization and integrity validator
        shell: bash
        run: |
          set -euo pipefail
          D="research/package-adjustment-v8"
          python3 - <<'PY'
          import hashlib,json
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          cat=json.loads((d/"development_catalog_v1.json").read_text())
          ids=sorted(c["id"] for c in cat["challenges"])
          assert len(ids)==40

          seed="package-adjustment-v8|balanced-randomization|20260926"
          base=sorted(ids,key=lambda cid:hashlib.sha256(f"{seed}|base|{cid}".encode()).hexdigest())
          slots={}
          left_counts=Counter()
          order_positions={cid:Counter() for cid in ids}

          for slot in range(50):
              offset=(slot*17)%40
              order=base[offset:]+base[:offset]
              orientations={}
              for cid in ids:
                  perm=sorted(range(50),key=lambda s:hashlib.sha256(f"{seed}|left|{cid}|{s}".encode()).hexdigest())
                  leftA=set(perm[:25])
                  orientations[cid]="A" if slot in leftA else "B"
                  left_counts[(cid,orientations[cid])]+=1
              for pos,cid in enumerate(order):
                  order_positions[cid][pos]+=1
              slots[str(slot+1)]={"accepted_voter_slot":slot+1,"challenge_order":order,"display_left_by_challenge":orientations}

          for cid in ids:
              assert left_counts[(cid,"A")]==25
              assert left_counts[(cid,"B")]==25
              vals=list(order_positions[cid].values())
              assert min(vals)>=1 and max(vals)<=2

          schedule={
              "schema_version":1,"study_id":cat["study_id"],
              "stage":"phase1f_balanced_randomization_schedule",
              "status":"FROZEN_PRE_VOTE",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "seed_contract":seed,
              "accepted_voter_slots":50,
              "challenges":40,
              "left_right_balance_per_challenge":{"A_left":25,"B_left":25},
              "order_exposure_contract":"Across 50 slots each challenge appears in every order position at least once and at most twice.",
              "slots":slots,
              "v8_votes_read":False,
              "production_change_authorized":False
          }
          (d/"voting_randomization_schedule_v1.json").write_text(json.dumps(schedule,indent=2,sort_keys=True)+"\n")
          PY

          cat > "$D/validate_voting_dataset_v1.py" <<'PY'
          #!/usr/bin/env python3
          import argparse,json
          from collections import Counter,defaultdict
          from pathlib import Path

          def maturity_summary(ballots,challenge_ids):
              # OUTCOME-BLIND BY CONSTRUCTION: intentionally never reads human_choice_left.
              accepted=[b for b in ballots if b.get("accepted_session") is True]
              pairs={(str(b["voter_cluster"]),str(b["challenge_id"])) for b in accepted}
              voters=Counter(v for v,_ in pairs)
              challenges=Counter(c for _,c in pairs)
              complete=sum(1 for n in voters.values() if n==40)
              return {"accepted_pair_count":len(pairs),"distinct_voters":len(voters),
                      "distinct_challenges":len(challenges),"complete_voters":complete,
                      "minimum_challenge_coverage":min(challenges.values()) if challenges else 0,
                      "mature":len(voters)==50 and complete==50 and len(pairs)==2000
                               and set(challenges)==set(challenge_ids) and set(challenges.values())=={50}}

          def validate(ballots,schedule,challenge_ids):
              accepted=[b for b in ballots if b.get("accepted_session") is True]
              if len(accepted)!=2000: raise ValueError("accepted dataset must contain exactly 2000 ballots")
              seen=set(); voters=defaultdict(list)
              for b in accepted:
                  required=("voter_cluster","challenge_id","accepted_voter_slot","display_left",
                            "display_order","human_choice_left","accepted_session")
                  for k in required:
                      if k not in b: raise ValueError(f"missing {k}")
                  if not isinstance(b["human_choice_left"],bool): raise ValueError("human_choice_left must be bool")
                  voter=str(b["voter_cluster"]); cid=str(b["challenge_id"])
                  pair=(voter,cid)
                  if pair in seen: raise ValueError(f"duplicate voter/challenge {pair}")
                  seen.add(pair); voters[voter].append(b)
              if len(voters)!=50: raise ValueError("must contain exactly 50 accepted voters")
              used_slots=set()
              for voter,rows in voters.items():
                  if len(rows)!=40: raise ValueError(f"{voter} incomplete")
                  slots={int(r["accepted_voter_slot"]) for r in rows}
                  if len(slots)!=1: raise ValueError(f"{voter} has multiple voter slots")
                  slot=slots.pop()
                  if slot in used_slots: raise ValueError(f"duplicate accepted voter slot {slot}")
                  used_slots.add(slot)
                  spec=schedule["slots"][str(slot)]
                  if {r["challenge_id"] for r in rows}!=set(challenge_ids): raise ValueError(f"{voter} challenge set mismatch")
                  for r in rows:
                      cid=r["challenge_id"]
                      if r["display_left"]!=spec["display_left_by_challenge"][cid]:
                          raise ValueError(f"{voter}/{cid} side randomization mismatch")
                      expected_order=spec["challenge_order"].index(cid)
                      if int(r["display_order"])!=expected_order:
                          raise ValueError(f"{voter}/{cid} order mismatch")
              if used_slots!=set(range(1,51)): raise ValueError("accepted voter slots must be exactly 1..50")
              m=maturity_summary(accepted,challenge_ids)
              if not m["mature"]: raise ValueError(f"dataset not mature: {m}")
              return {"status":"PASS","voters":50,"ballots":2000,"challenges":40,
                      "randomization_schedule_verified":True,"maturity":m}

          def main():
              ap=argparse.ArgumentParser();ap.add_argument("--data",required=True);ap.add_argument("--schedule",required=True)
              ap.add_argument("--catalog",required=True);args=ap.parse_args()
              data=json.loads(Path(args.data).read_text()); schedule=json.loads(Path(args.schedule).read_text())
              catalog=json.loads(Path(args.catalog).read_text()); ids=[c["id"] for c in catalog["challenges"]]
              print(json.dumps(validate(data["ballots"],schedule,ids),indent=2,sort_keys=True))
          if __name__=="__main__":main()
          PY
          chmod +x "$D/validate_voting_dataset_v1.py"
          python3 -m py_compile "$D/validate_voting_dataset_v1.py"

          python3 - <<'PY'
          import ast,json
          from datetime import datetime,timezone
          from pathlib import Path
          d=Path("research/package-adjustment-v8")
          schedule=json.loads((d/"voting_randomization_schedule_v1.json").read_text())
          cat=json.loads((d/"development_catalog_v1.json").read_text())
          ids=[c["id"] for c in cat["challenges"]]
          ballots=[]
          for slot_s,spec in schedule["slots"].items():
              slot=int(slot_s)
              voter=f"synthetic_{slot:02d}"
              for order,cid in enumerate(spec["challenge_order"]):
                  ballots.append({"voter_cluster":voter,"challenge_id":cid,"accepted_voter_slot":slot,
                                  "display_left":spec["display_left_by_challenge"][cid],"display_order":order,
                                  "human_choice_left":bool((slot+order)%2),"accepted_session":True})
          fixture=d/"_voting_integrity_fixture.tmp.json"
          fixture.write_text(json.dumps({"ballots":ballots}))
          import subprocess
          proc=subprocess.run(["python3",str(d/"validate_voting_dataset_v1.py"),
                               "--data",str(fixture),"--schedule",str(d/"voting_randomization_schedule_v1.json"),
                               "--catalog",str(d/"development_catalog_v1.json")],
                              text=True,capture_output=True,check=True)
          selftest=json.loads(proc.stdout)
          fixture.unlink()
          (d/"voting_integrity_selftest_v1.json").write_text(json.dumps(selftest,indent=2,sort_keys=True)+"\n")

          tree=ast.parse((d/"validate_voting_dataset_v1.py").read_text())
          maturity=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="maturity_summary"][0]
          attrs={n.id for n in ast.walk(maturity) if isinstance(n,ast.Name)}
          # More importantly, literal key usage must exclude outcome fields.
          literals={n.value for n in ast.walk(maturity) if isinstance(n,ast.Constant) and isinstance(n.value,str)}
          assert "human_choice_left" not in literals
          assert "display_left" not in literals

          contract={
              "schema_version":1,"study_id":cat["study_id"],
              "stage":"phase1f_voting_integrity_contract","status":"FROZEN_PRE_VOTE",
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "accepted_voters":50,"challenges_per_voter":40,"accepted_ballots":2000,
              "complete_session_required":True,"one_response_per_voter_challenge":True,
              "accepted_voter_slots_exactly_1_to_50":True,
              "left_right_balance_each_challenge":"25/25",
              "challenge_order_schedule_required":True,
              "maturity_monitor_outcome_blind":True,
              "incomplete_sessions_count_toward_maturity":False,
              "duplicate_ballots_allowed":False,
              "early_stop_before_50":False,
              "v8_votes_read":False,"production_change_authorized":False
          }
          (d/"voting_integrity_contract_v1.json").write_text(json.dumps(contract,indent=2,sort_keys=True)+"\n")
          print("PASS: balanced randomization schedule and 50x40 integrity validator frozen.")
          PY

