      - name: Prove exact research-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort
          )
          expected=(
            research/package-adjustment-v8/player_status_audit_v1.json
            research/package-adjustment-v8/pre_vote_operational_hardening_manifest_v1.json
            research/package-adjustment-v8/pre_vote_operational_hardening_v1.md
