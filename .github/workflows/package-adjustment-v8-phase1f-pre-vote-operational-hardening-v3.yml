            research/package-adjustment-v8/voting_integrity_selftest_v1.json
            research/package-adjustment-v8/voting_randomization_schedule_v1.json
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
                  <(printf '%s\n' "${changed[@]}" | sort)

