name: A-QA01 - Full Player Valuation Integrity Audit (Read Only)
run-name: A-QA01 read-only audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: a-qa01-player-valuation-audit-read-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA01_OUT: /tmp/a-qa01-results
    steps:
      - name: Checkout exact requested commit without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression dependencies
        run: python3 -m pip install requests
      - name: Materialize reviewed read-only audit engine and verify syntax
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa01_audit.py" <<'PY_QA01_AUDIT'
          #!/usr/bin/env python3
          """A-QA01: read-only, source-bound, full-league valuation-integrity audit.
          No network, no repo writes, no numerical pricing/production changes.
          """
          from __future__ import annotations
          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(ROOT))
          # repo_regression_checks imports snapshot_values as a script-level module.
          # Add its actual directory, since this audit imports the suite as a package.
          sys.path.insert(0, str(ROOT / 'scripts' / 'validation'))
          OUT = Path(os.environ.get('QA01_OUT', '/tmp/a-qa01-results'))
          UI_FILES = ('index.html', 'trade-desk-preview.html')
          REQUIRED = (
            'data/league_rosters.json', 'data/my_roster.json',
            'scripts/artifacts/generated/market_values.json',
            'scripts/artifacts/generated/fv_informed_estimate_cal15.json',
            'scripts/validation/snapshot_values.py',
            'scripts/validation/repo_regression_checks.py',
          )
          EXPECTED_IDENTITY = {
            '8151':('kenneth walker iii','kenneth walker','RB'),
            '7672':('ernest jones iv','ernest jones','LB'),
            '11628':('marvin harrison jr','marvin harrison','WR'),
            '10892':('will anderson jr','will anderson','DL'),
            '12585':('james pearce jr','james pearce','DL'),
            '13353':('chris brazzell ii','chris brazzell','WR'),
          }
          MUST_HAVE = {'index.html':3, 'trade-desk-preview.html':2}  # known exact-ID sync call paths

          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def norm(name):return re.sub(r'\s+',' ',re.sub(r"[.'’\-]",'',str(name or '').strip().lower())).strip()
          def sh(*cmd):
            p=subprocess.run(list(cmd),text=True,capture_output=True)
            if p.returncode:raise RuntimeError(f'Command failed: {cmd[0]} ({p.returncode}): {p.stderr[-1200:]}')
            return p.stdout.strip()
          def clean_note(v):return re.sub(r'[\r\n|]',' ',str(v or ''))[:500]
          def jload(path):return json.loads(Path(path).read_text(encoding='utf-8'))
          def display_num(v):return f'{v:,}' if isinstance(v,int) else '—'

          def check_source_contract(path):
            s=Path(path).read_text(encoding='utf8')
            if s.count('function playerValue(')!=1:raise RuntimeError('Unexpected single playerValue contract: '+path)
            if s.count('function resolveExistingKey(')!=1:raise RuntimeError('Missing exact-ID resolver: '+path)
            needle='resolveExistingKey(normalizeName(p.name),p.player_id)'
            count=s.count(needle)
            if count != MUST_HAVE[path]:
              raise RuntimeError(f'{path}: expected {MUST_HAVE[path]} exact-ID ingestion call sites, found {count}')
            if 'const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze({' not in s:
              raise RuntimeError(f'{path}: verified stable ID map absent')
            return {'exact_id_call_sites':count, 'sha256':sha(path)}

          def extract_engine_parts(src, label):
            # Reuse the live regression suite's proven balanced JS extraction logic.
            from scripts.validation import repo_regression_checks as reg
            cs=[
              reg._extract_const_object(src,'POSITION_WEIGHT'),
              reg._extract_const_object(src,'AGE_CURVE'),
              reg._extract_scalar_const(src,'QB_POST_PEAK_FLOOR'),
              reg._extract_scalar_const(src,'LB_POST_PEAK_DECAY_POWER'),
              reg._extract_const_object(src,'ROLE_MULT'),
              reg._extract_const_object(src,'PROD_MULT_DATA'),
              'const PROD_MULT = PROD_MULT_DATA;',
              reg._extract_const_object(src,'NO_REAL_PRODUCTION_HISTORY'),
              (reg._extract_const_object(src,'CAL22_LEGACY_MONOTONE_KEYS') if 'const CAL22_LEGACY_MONOTONE_KEYS =' in src else 'const CAL22_LEGACY_MONOTONE_KEYS = {};'),
              reg._extract_const_object(src,'PLAYER_DB'),
              reg._extract_const_object(src,'RB_BIRTH_DATE_DATA'),
            ]
            if label=='index.html':
              cs.append(reg._extract_const_object(src,'CAL26_FV_OWNER_ANCHORS'))
            else:
              cs.append('const CAL26_FV_OWNER_ANCHORS = {};')
            cs.append(reg._extract_const_object(src,'ALIASES'))
            cs.append('const ALIASES_REVERSE = Object.fromEntries(Object.entries(ALIASES).map(([a,c])=>[c,a]));')
            start=src.find('const A_ID02_VERIFIED_SLEEPER_IDENTITIES = Object.freeze({')
            end=src.find('\n});',start)
            if start<0 or end<0:raise RuntimeError(f'Verified identity block absent: {label}')
            cs.append(src[start:end+4])
            namere=re.search(r'function normalizeName\(s\)\{.*?\n\}',src,re.S)
            if not namere:raise RuntimeError(f'Live normalizeName function absent: {label}')
            cs.append(namere.group(0))
            for fn in ('productionMultiplier','ageMultiplier','fractionalAgeFromBirthDate','rbMonotoneAgeAnchor','rbContinuousAgeMultiplier','effectiveAgeMultiplier','playerValue','resolveExistingKey'):
              cs.append(reg._extract_function(src,fn))
            return '\n\n'.join(cs)

          JS_DRIVER = r'''
          const fs = require('fs');
          const league = JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
          const slots = ['starters','bench','taxi','reserve_ir'];
          const defaults = {starters:'Starter',bench:'Rotational',taxi:'Speculative',reserve_ir:'Depth'};
          const positionMap={DE:'DL',DT:'DL',DL:'DL',OLB:'LB',ILB:'LB',LB:'LB',CB:'DB',S:'DB',SS:'DB',FS:'DB',DB:'DB',QB:'QB',RB:'RB',WR:'WR',TE:'TE',K:'K'};
          function normalizePos(v){return positionMap[v] || null;}
          function pickBestPosition(fp,p){
            if (Array.isArray(fp) && fp.length) {
              for(const v of fp){const key=normalizePos(v);if(key)return key;}
            }
            return normalizePos(p);
          }
          function valueFor(key){
            const info=PLAYER_DB[key];
            if(!info)return null;
            try {
              const val=playerValue(info.pos,info.age,info.role,key);
              return Number.isFinite(val)?val:null;
            }catch(e){return null;}
          }
          const before={};
          for(const [key,info] of Object.entries(PLAYER_DB)){
            before[key]={value:valueFor(key),pos:info.pos,role:info.role,age:info.age};
          }
          const all=[];
          let sourceOrder=0;
          for(const roster of league.rosters || []){
            for(const slot of slots){
              for(const p of roster[slot]||[]){
                const raw=normalizeName(p.name||'');
                const canonical=resolveExistingKey(raw,p.player_id);
                const initial=PLAYER_DB[canonical]||null;
                const selected=pickBestPosition(p.fantasy_positions,p.position);
                const effectivePos=(initial && initial.pos)?initial.pos:selected;
                const effectiveAge=typeof p.age==='number'?p.age:(initial?initial.age:24);
                const role=initial?initial.role:defaults[slot];
                const oldUnresolved=PLAYER_DB[raw] ? valueFor(raw) : null;
                // Shadow of pre-A-ID02 suffix merge, done before actual merge and isolated.
                let unfixedValue=null;
                if(raw!==canonical && !PLAYER_DB[raw]){
                  const temporary={pos:selected,age:effectiveAge,role:defaults[slot],birth_date:p.birth_date||null};
                  PLAYER_DB[raw]=temporary;
                  unfixedValue=valueFor(raw);
                  delete PLAYER_DB[raw];
                }
                PLAYER_DB[canonical]={
                  pos:effectivePos,age:effectiveAge,
                  birth_date:(typeof p.birth_date==='string' && p.birth_date)?p.birth_date:(initial?initial.birth_date||null:null),
                  role,injury:p.injury_status||null,
                  team:p.team || (initial?initial.team:null),
                  ...(initial && initial.pts2025!==undefined?{pts2025:initial.pts2025}:{}),
                  ...(initial && initial.proj2026!==undefined?{proj2026:initial.proj2026}:{}),
                  currentlyRostered:true,
                };
                all.push({roster_id:roster.roster_id,slot,name:p.name,sleeper_id:String(p.player_id||''),raw_key:raw,
                  canonical_key:canonical,source_pos:p.position,source_fantasy_positions:p.fantasy_positions||[],
                  effective_pos:effectivePos,role,age:effectiveAge,injury:p.injury_status||null,
                  pre_static_value:before[canonical]?before[canonical].value:null,
                  before_fix_estimate:unfixedValue, initial_curated:Boolean(initial),
                  source_order:sourceOrder++});
              }
            }
          }
          for(const row of all){row.computed_fv=valueFor(row.canonical_key);}
          const alias={};
          for(const [id,obj] of Object.entries(A_ID02_VERIFIED_SLEEPER_IDENTITIES))alias[id]=obj;
          process.stdout.write(JSON.stringify({ui:process.env.QA01_UI,static_keys:Object.keys(before).length,static_values:before,observations:all,verified_aliases:alias,owner_anchor_keys:Object.keys(CAL26_FV_OWNER_ANCHORS)}));
          '''

          def evaluate_ui(path):
            src=Path(path).read_text(encoding='utf8')
            script=extract_engine_parts(src,path)+'\n'+JS_DRIVER
            with tempfile.NamedTemporaryFile('w',suffix='.cjs',delete=False,encoding='utf8') as f:
              f.write(script); temp=f.name
            try:
              env={**os.environ,'QA01_UI':path}
              p=subprocess.run(['node',temp],text=True,capture_output=True,env=env,timeout=55)
              if p.returncode:
                raise RuntimeError(f'Node executed {path} evaluation failed: {p.stderr[-1900:]}')
              return json.loads(p.stdout)
            finally:
              Path(temp).unlink(missing_ok=True)

          def all_roster_rows(data):
            rows=[]
            for r in data['rosters']:
              for slot in ('starters','bench','taxi','reserve_ir'):
                for p in r.get(slot,[]):rows.append((r,slot,p))
            return rows

          def audit():
            assert all(Path(p).is_file() for p in (*UI_FILES,*REQUIRED)), 'Required repo source missing'
            OUT.mkdir(parents=True,exist_ok=True)
            githead=sh('git','rev-parse','HEAD')
            tracked_before=sh('git','status','--porcelain')
            if tracked_before:raise RuntimeError('Workspace modified before read-only audit')
            league=jload('data/league_rosters.json')
            my=jload('data/my_roster.json')
            market=jload('scripts/artifacts/generated/market_values.json')
            fv_votes=jload('scripts/artifacts/generated/fv_informed_estimate_cal15.json')
            cross=jload('scripts/identity_crosswalk.json')
            source={p:check_source_contract(p) for p in UI_FILES}
            # The existing live-JS/Python regression validates 565+ curated values,
            # owner-anchors, and age/role math. It is not replaced by a weaker comparison.
            original_parity='PASS'
            try:
              from scripts.validation import repo_regression_checks as regression
              regression.check_snapshot_parity()
            except Exception as exc:
              original_parity='FAILED: '+str(exc)[:700]
            main=evaluate_ui('index.html')
            preview=evaluate_ui('trade-desk-preview.html')
            live_rows=all_roster_rows(league)
            results=[];flags=[]
            def flag(code,severity,row,details):
              flags.append({'severity':severity,'code':code,'player':row.get('name',''),
                'sleeper_id':row.get('sleeper_id',''),'roster_id':row.get('roster_id',''),
                'main_fv':row.get('main_fv'),'preview_fv':row.get('preview_fv'),
                'details':clean_note(details)})
            if original_parity!='PASS':flag('CURATED_JS_PY_PARITY','critical',{},original_parity)
            if len(main['observations'])!=len(live_rows) or len(preview['observations'])!=len(live_rows):
              raise RuntimeError('Missing rows in dynamic evaluation')
            if len(league.get('rosters',[]))!=12:flag('LEAGUE_SIZE_CHANGED','review',{},f"Expected configured 12 teams; observed {len(league.get('rosters',[]))}")
            if not len(live_rows):raise RuntimeError('No synchronized league players')
            if len(main['verified_aliases'])!=len(preview['verified_aliases']):
              flag('ALIAS_MAP_DRIFT','critical',{},'Main vs preview verified-ID mapping count differs')
            highconfidence={}
            for c in cross:
              sid=str(c.get('sleeper_id') or '')
              if sid and c.get('match_confidence')=='high' and c.get('requires_manual_review') is False:
                highconfidence.setdefault(sid,[]).append(c)
            byid=defaultdict(list);rawnames=defaultdict(set);keyids=defaultdict(set)
            market_players=market.get('players',{})
            vote_players=fv_votes.get('players',{})
            for idx,(r,slot,p) in enumerate(live_rows):
              i=main['observations'][idx];j=preview['observations'][idx]
              sid=str(p.get('player_id',''))
              if i['sleeper_id']!=sid or j['sleeper_id']!=sid or i['name']!=p.get('name') or j['name']!=p.get('name'):
                raise RuntimeError('UI row ordering/source mismatch during analysis')
              row={'roster_id':r['roster_id'],'team_name':r.get('team_name',''),'slot':slot,
                'name':p.get('name',''),'sleeper_id':sid,'raw_key':i['raw_key'],
                'canonical_key':i['canonical_key'],'preview_key':j['canonical_key'],
                'source_position':p.get('position',''),'fantasy_positions':','.join(p.get('fantasy_positions',[])),
                'effective_position':i['effective_pos'],'preview_position':j['effective_pos'],
                'role_main':i['role'],'role_preview':j['role'],'age':i['age'],
                'injury':p.get('injury_status') or '',
                'main_fv':i['computed_fv'],'preview_fv':j['computed_fv'],
                'main_static_before_merge':i['pre_static_value'],
                'old_suffix_fallback_estimate':i['before_fix_estimate'],
                'curated_found':i['initial_curated'],
                'identity_status':'id_verified' if i['raw_key']!=i['canonical_key'] else ('direct_curated' if i['initial_curated'] else 'new_or_unmatched'),
                'crosswalk_high_confidence':False,
                'fv_vote_estimate':None,'market_value':None,
                'display_market_eligible':False,'display_votes_eligible':False,
                'main_position_rank':None,
              }
              byid[sid].append(row)
              rawnames[i['raw_key']].add(sid);keyids[i['canonical_key']].add(sid)
              crossmatches=[x for x in highconfidence.get(sid,[]) if norm(x.get('name'))==i['raw_key']]
              row['crosswalk_high_confidence']=bool(crossmatches)
              if i['canonical_key']!=j['canonical_key']:
                flag('MAIN_PREVIEW_IDENTITY_DRIFT','critical',row,f"{i['canonical_key']} vs {j['canonical_key']}")
              if i['initial_curated'] is False:
                flag('UNCURATED_ROSTER_PLAYER','review',row,'No exact curated PLAYER_DB identity; generic role/production fallback may be legitimate for new players')
              if i['effective_pos'] not in {'QB','RB','WR','TE','DL','LB','DB','K'}:
                flag('UNRESOLVED_POSITION','critical',row,f"Effective position {i['effective_pos']}")
              allowed={pos_map.get(q) for q in p.get('fantasy_positions',[]) if pos_map.get(q)}
              if allowed and i['effective_pos'] not in allowed:
                flag('POSITION_INELIGIBLE','critical',row,f"Curated {i['effective_pos']} not in eligible {sorted(allowed)}")
              elif len(allowed)>1 and i['effective_pos'] != pos_map.get(p['fantasy_positions'][0]):
                flag('DUAL_POSITION_CURATED_DIFFERENCE','review',row,'Curated position differs from first Sleeper eligibility bucket; still eligible; verify intentionally curated')
              for ui,value in [('main',row['main_fv']),('preview',row['preview_fv'])]:
                if not isinstance(value,int) or value<0 or value>200000:
                  flag('FV_NOT_FINITE_OR_RANGE','critical',row,f'{ui} FV={value}')
              if isinstance(row['main_fv'],int) and isinstance(row['preview_fv'],int):
                if row['main_fv']!=row['preview_fv']:
                  diff=abs(row['main_fv']-row['preview_fv'])/max(1,row['main_fv'])
                  same_inputs=(i['effective_pos'],i['role'],i['age'])==(j['effective_pos'],j['role'],j['age'])
                  # Main owner anchors deliberately absent in preview; report it separately.
                  main_owner_anchor=i['canonical_key'] in set(main.get('owner_anchor_keys',[]))
                  severity='review'
                  code='MAIN_PREVIEW_FV_DISAGREEMENT'
                  if diff>=0.25 and same_inputs:code='SAME_METADATA_FV_DRIFT'
                  flag(code,severity,row,f"Main {row['main_fv']:,} / preview {row['preview_fv']:,} ({diff:.1%}); same pos/age/role={same_inputs}. Compare independent preview pricing engine and owner anchors")
              if i['before_fix_estimate'] is not None and isinstance(row['main_fv'],int):
                ratio=(row['main_fv']+1)/(i['before_fix_estimate']+1)
                if ratio>1.75 or ratio<0.57:
                  flag('REPAIRED_SUFFIX_IMPACT','information',row,f"Pre-fix generic-role shadow {i['before_fix_estimate']:,} vs resolved {row['main_fv']:,} ({ratio:.2f}x)")
              mr=market_players.get(i['canonical_key'])
              vr=vote_players.get(i['canonical_key'])
              if isinstance(mr,dict):
                row['market_value']=mr.get('market_value')
                row['display_market_eligible']= (mr.get('fundamental_value')==row['main_fv'] and mr.get('scale_semantics', market.get('scale_semantics'))=='league_rank_quantile_mapped_to_trade_desk_points_v1')
              if isinstance(vr,dict):
                row['fv_vote_estimate']=vr.get('fv_informed_estimate')
                row['display_votes_eligible']= (vr.get('fundamental_value')==row['main_fv'] and fv_votes.get('display_only') is True)
              # Do not label stale artifact pre/post identity changes as mathematical failure.
              if isinstance(mr,dict) and not row['display_market_eligible']:
                flag('MARKET_FV_PROVENANCE_STALE','information',row,f"Market artifact source FV={mr.get('fundamental_value')} vs live FV={row['main_fv']}; UI should suppress rather than show stale MV")
              results.append(row)
            for sid,ls in byid.items():
              if len(ls)>1:flag('DUPLICATE_SLEEPER_ID','critical',ls[0],f'Sleeper ID appears {len(ls)} times in the league')
            for key,ids in keyids.items():
              if len(ids)>1:
                first=next(x for x in results if x['canonical_key']==key)
                flag('CANONICAL_NAME_COLLISION','critical',first,f'{len(ids)} distinct IDs would overwrite the same PLAYER_DB key: {sorted(ids)}')
            for sid,(name,canon,pos) in EXPECTED_IDENTITY.items():
              matches=byid.get(sid,[])
              if len(matches)!=1 or matches[0]['raw_key']!=name or matches[0]['canonical_key']!=canon or matches[0]['effective_position']!=pos:
                flag('PINNED_IDENTITY_DRIFT','critical',matches[0] if matches else {'sleeper_id':sid,'name':name},f'Expected {name} → {canon} ({pos}); observed {[(x.get("raw_key"),x.get("canonical_key"),x.get("effective_position")) for x in matches]}')
            # Position percentiles are descriptive relative ranks, not price targets.
            bypos=defaultdict(list)
            for x in results:
              if isinstance(x['main_fv'],int):bypos[x['effective_position']].append(x)
            for pos,ls in bypos.items():
              ls.sort(key=lambda z:(-z['main_fv'],z['name']))
              for k,row in enumerate(ls,1):row['main_position_rank']=k
            # Supplemental peer-value outliers: purely descriptive, no price suggestions.
            peer_groups=defaultdict(list)
            for row in results:
              if isinstance(row['main_fv'],int) and row['main_fv']>0:
                peer_groups[(row['effective_position'],row['role_main'])].append(row)
            for (position,role), group in peer_groups.items():
              if len(group)<7: continue
              vals=sorted(r['main_fv'] for r in group)
              mid=len(vals)//2
              median=(vals[mid] if len(vals)%2 else (vals[mid-1]+vals[mid])/2)
              if median<=0:continue
              for row in group:
                v=row['main_fv']
                if v>3.25*median or v<median/3.25:
                  flag('POSITION_ROLE_VALUE_OUTLIER','review',row,f'{position}/{role}: FV={v:,}, group median={median:,.0f} (n={len(group)}). Descriptive anomaly, not a recommended price')
            # Non-invasive ranking flags: very different reference numbers warrant review,
            # not automatic price bumps; avoid treating MV as a true valuation oracle.
            for row in results:
              if not row['display_market_eligible'] and row['market_value'] is not None:continue
              a,b=row['main_fv'],row['market_value']
              if isinstance(a,int) and isinstance(b,int) and a>0 and b>0 and max(a,b)/min(a,b)>=2.5:
                flag('LARGE_FV_MV_DISAGREEMENT','review',row,f'FV={a:,}, MV={b:,}; ratio={max(a,b)/min(a,b):.2f}x; disagreement is evidence to review, not automatic repricing')
            counts=Counter(x['severity'] for x in flags)
            check_expected=len(results)==len(live_rows)
            assert check_expected
            metadata={
             'schema_version':1,'audit':'A-QA01 Full Player Valuation Integrity Audit',
             'status':'AUDIT_COMPLETE_WITH_FINDINGS' if flags else 'AUDIT_COMPLETE_CLEAR',
             'source_commit':githead,'source_utc':datetime.now(timezone.utc).isoformat(),
             'read_only':True,'files_changed':[],
             'source':source,'league_teams':len(league.get('rosters',[])),
             'rostered_players':len(live_rows),'main_curated_player_count':main['static_keys'],
             'preview_curated_player_count':preview['static_keys'],
             'verified_id_count_main':len(main['verified_aliases']),
             'verified_id_count_preview':len(preview['verified_aliases']),
             'owner_selected_identity_oracles':EXPECTED_IDENTITY,
             'js_python_static_parity':original_parity,
             'flag_counts':dict(counts),'flag_types':dict(Counter(x['code'] for x in flags)),
             'market_generated_at':market.get('generated_at_utc'),
             'synced_at':league.get('synced_at'),
             'scope':'Identity IDs, position eligibility, actual live JS FV after mirrored Sleeper merge, main/preview disagreements, market display gating. Does not fetch live browser/UI, adjust model or modify repository.',
             'limitations':['Node evaluates live productionMultiplier/ageMultiplier/playerValue/resolveExistingKey; roster merge preserves pricing-relevant fields using a mirrored documented merge, not a browser DOM trace',
                            'A green run means the audit finished, not that all findings passed',
                            'Market/value-vote artifacts are not independent ground truth; stale artifact values are suppressed by the UI',
                            'Current static team depth and future player outcomes are not verified by this audit'],
            }
            def writecsv(path,fields,rows):
              with open(OUT/path,'w',encoding='utf-8',newline='') as f:
                w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore');w.writeheader();w.writerows(rows)
            csvfields=['roster_id','team_name','slot','name','sleeper_id','raw_key','canonical_key','preview_key','source_position','fantasy_positions','effective_position','preview_position','role_main','role_preview','age','injury','main_fv','preview_fv','main_static_before_merge','old_suffix_fallback_estimate','market_value','fv_vote_estimate','display_market_eligible','display_votes_eligible','main_position_rank','identity_status','crosswalk_high_confidence']
            writecsv('QA01_All_Players.csv',csvfields,results)
            severities={'critical':0,'review':1,'information':2}
            flags.sort(key=lambda x:(severities.get(x['severity'],8),x['code'],x['player']))
            writecsv('QA01_Flags.csv',['severity','code','player','sleeper_id','roster_id','main_fv','preview_fv','details'],flags)
            (OUT/'QA01_Integrity.json').write_text(json.dumps({**metadata,'flags':flags,'players':results},indent=2,ensure_ascii=False,default=str)+'\n',encoding='utf8')
            def tablerow(row):
              return f"| {row['name']} | {row['effective_position']} | {display_num(row['main_fv'])} | {display_num(row['preview_fv'])} | {display_num(row['old_suffix_fallback_estimate'])} |"
            exemplars=[next((x for x in results if x['sleeper_id']==i),None) for i in ['10892','8151','11628','7672','2617','12585','13353']]
            lines=[
              '# A-QA01 — Full Player Valuation Integrity Audit','',
              f'**Status:** {metadata["status"]}  ',
              f'**Reviewed commit:** `{githead}`  ',
              '**Read-only:** YES — no repository or production price edits','',
              '## Quick summary','',
              f'- Teams: **{metadata["league_teams"]}**',
              f'- League players audited: **{metadata["rostered_players"]}**',
              f'- Curated player rows: **{main["static_keys"]} main / {preview["static_keys"]} preview**',
              f'- Exact-ID aliases: **{len(main["verified_aliases"])} main / {len(preview["verified_aliases"])} preview**',
              f'- Python/actual JS static price parity: **{original_parity}**',
              f'- Flags: **{counts.get("critical",0)} critical / {counts.get("review",0)} review / {counts.get("information",0)} informational**',
              '',
              '> A green GitHub Actions run means this audit executed successfully, **not** that all valuation findings passed. Only red critical findings are release blockers until explained. Review flags may represent legitimate static metadata or owner-price differences.',
              '', '## Target-player spot check','',
              '| Player | Position | Main live FV | Preview live FV | Pre-fix generic shadow FV |',
              '|---|---|---:|---:|---:|',
              *(tablerow(row) for row in exemplars if row),
              '', '## Issues requiring attention', '',
              '| Issue | Count |', '|---|---:|',
              *(f'| `{name}` | {count} |' for name,count in Counter(x['code'] for x in flags).most_common()),
              '', '## Top 35 actionable flags','',
              '| Severity | Player | Finding | Main FV | Preview FV |',
              '|---|---|---|---:|---:|',
              *(f'| {x["severity"]} | {x["player"] or "(repository)"} | {x["code"]} | {display_num(x["main_fv"])} | {display_num(x["preview_fv"])} |' for x in [x for x in flags if x['severity']!='information'][:35]),
            ]
            lines += ['', '## Interpretation and next step', '',
              '1. Address **critical** identity, duplicate ID, ineligible-position or nonfinite FV findings first.',
              '2. Review discrepancies between index and preview; owner anchors and stale preview roles may legitimately differ, but must be explicit.',
              '3. Investigate valuation disagreements using production/ROS projections and DLF/FP evidence; do **not** automatically apply a value increase.',
              '4. Review CSV for all 12 rosters and JSON for exact evidence. No fixes or prices were deployed.',
              '', '## Source provenance', '',
              f'- Main: `{source["index.html"]["sha256"]}`',
              f'- Preview: `{source["trade-desk-preview.html"]["sha256"]}`',
              f'- Sleeper roster sync timestamp: `{league.get("synced_at")}`',
              f'- Market artifact: `{market.get("generated_at_utc")}`',
              '', '## Caveats', '', *('- '+q for q in metadata['limitations'])]
            (OUT/'QA01_Report.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
            post_status=sh('git','status','--porcelain')
            if post_status:raise RuntimeError('Read-only guarantee violated: git status not clean after audit: '+post_status[:300])
            print(json.dumps({'status':metadata['status'],'rostered_players':len(results),'teams':metadata['league_teams'],'exact_id_aliases':len(main['verified_aliases']),'critical':counts.get('critical',0),'review':counts.get('review',0),'informational':counts.get('information',0),'production_changes':0,'source_commit':githead},sort_keys=True))

          pos_map={'DE':'DL','DT':'DL','DL':'DL','OLB':'LB','ILB':'LB','LB':'LB','CB':'DB','S':'DB','SS':'DB','FS':'DB','DB':'DB','QB':'QB','RB':'RB','WR':'WR','TE':'TE','K':'K'}

          if __name__=='__main__':audit()
          PY_QA01_AUDIT
          python3 -m py_compile "$RUNNER_TEMP/qa01_audit.py"
      - name: Audit full 12-team roster and actual valuation functions without writing files
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qa01_audit.py"
      - name: Upload player-level audit and prioritized findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA01-Valuation-Integrity-Audit
          path: /tmp/a-qa01-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish mobile-friendly audit summary
        if: always()
        shell: bash
        run: |
          if test -f "$QA01_OUT/QA01_Report.md"; then
            cat "$QA01_OUT/QA01_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit did not complete; inspect job logs. No repo files were modified.' >> "$GITHUB_STEP_SUMMARY"
          fi
