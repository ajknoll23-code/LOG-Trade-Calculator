name: A-NL36R1 — 75/15/10 Roast-First, Punchline-Last (Shadow Only)
run-name: A-NL36R1 W${{ inputs.war_week }}/W${{ inputs.aftermath_week }} - Roast-first punchline-last editorial shadow
'on':
  workflow_dispatch:
    inputs:
      war_week:
        description: War Room week; one week after completed Aftermath week
        required: true
        type: string
        default: '9'
      aftermath_week:
        description: Completed NFL Aftermath week
        required: true
        type: string
        default: '8'
permissions:
  contents: read
concurrency:
  group: log-nl36r1-editorial-shadow-readonly
  cancel-in-progress: false
jobs:
  nl36r1-editorial-shadow:
    name: 'NL36R1 shadow newsroom: source integrity, punchlines, and blind review'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout main without persisted credentials
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned PDF renderer and inspector
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir ''weasyprint==68.0'' ''pymupdf==1.26.5''

        '
    - name: Stage NL36R1 engine and run inherited plus punchline-last regression tests
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/log_nl36r1_editorial.py\" <<'NL30_ENGINE'\n#!/usr/bin/env python3\n\"\"\
        \"A-NL29R1: editorial polish with strict read-only PDF acceptance.\"\"\"\nfrom __future__ import annotations\nimport\
        \ argparse\nimport base64\nfrom collections import defaultdict\nfrom datetime import datetime, timezone\nfrom decimal\
        \ import Decimal, ROUND_HALF_UP\nfrom html import escape\nimport hashlib\nimport json\nfrom pathlib import Path\n\
        import re\nimport statistics\nimport time\nfrom urllib.request import Request, urlopen\n\nLEAGUE_ID = '1326679131051532288'\n\
        SEASON = '2026'\nAPI = 'https://api.sleeper.app/v1/'\n\n\ndef money(n):\n    return str(Decimal(str(n)).quantize(Decimal('.01'),\
        \ rounding=ROUND_HALF_UP))\n\n\ndef get(path):\n    for attempt in range(3):\n        try:\n            req = Request(API\
        \ + path, headers={'User-Agent': 'LOG-NL24R1-Shadow/1.0'})\n            with urlopen(req, timeout=25) as response:\n\
        \                return json.load(response)\n        except Exception:\n            if attempt == 2:\n           \
        \     raise\n            time.sleep(attempt + 1)\n\n\ndef matchups(rows, team_ids, scored):\n    if not isinstance(rows,\
        \ list) or len(rows) != 12:\n        raise RuntimeError('Required: twelve Sleeper matchup records')\n    groups =\
        \ defaultdict(list)\n    for row in rows:\n        if row.get('matchup_id') is None:\n            raise RuntimeError('Missing\
        \ matchup id')\n        groups[str(row['matchup_id'])].append(row)\n    if len(groups) != 6 or any(len(v) != 2 for\
        \ v in groups.values()):\n        raise RuntimeError('Required: six complete head-to-head matchups')\n    all_ids\
        \ = [int(r['roster_id']) for group in groups.values() for r in group]\n    if len(set(all_ids)) != 12 or set(all_ids)\
        \ != set(team_ids):\n        raise RuntimeError('Duplicate or unexpected team IDs')\n    games = []\n    for group\
        \ in groups.values():\n        a, b = sorted(group, key=lambda r: int(r['roster_id']))\n        if scored:\n     \
        \       for row in (a, b):\n                raw = row.get('custom_points')\n                if raw is None:\n    \
        \                raw = row.get('points')\n                if raw is None or not isinstance(raw, (int, float)) or raw\
        \ < 0:\n                    raise RuntimeError('Incomplete or invalid scored matchup')\n        games.append((a, b))\n\
        \    return sorted(games, key=lambda pair: int(pair[0]['matchup_id']))\n\n\ndef resolve_names(rosters, users):\n \
        \   owners = {str(u.get('user_id')):u for u in users}\n    names = {}\n    for roster in rosters:\n        u = owners.get(str(roster.get('owner_id')),\
        \ {})\n        name = ((u.get('metadata') or {}).get('team_name') or u.get('display_name')\n                or 'Team\
        \ ' + str(roster.get('roster_id')))\n        names[int(roster['roster_id'])] = str(name).strip()\n    if len(names)\
        \ != 12 or len(set(names.values())) != 12:\n        raise RuntimeError('Required: twelve uniquely named teams')\n\
        \    return names\n\n\ndef score(row):\n    val = row.get('custom_points')\n    if val is None:\n        val = row.get('points')\n\
        \    return Decimal(str(val))\n\n\ndef snapshot(pre_week, post_week):\n    if pre_week != post_week + 1:\n       \
        \ raise RuntimeError('Comparison must use adjoining War Room and Aftermath weeks')\n    state, league = get('state/nfl'),\
        \ get('league/' + LEAGUE_ID)\n    if str(state.get('season')) != SEASON or str(league.get('season')) != SEASON:\n\
        \        raise RuntimeError('2026 Sleeper season/league mismatch')\n    if pre_week > int(state.get('week') or 0):\n\
        \        raise RuntimeError('Pregame week not available in current Sleeper season')\n    names = resolve_names(get(f'league/{LEAGUE_ID}/rosters'),\
        \ get(f'league/{LEAGUE_ID}/users'))\n    hist = {rid: [] for rid in names}\n    results = []\n    standings_at = {}\n\
        \    for week in range(1, pre_week+1):\n        raw = get(f'league/{LEAGUE_ID}/matchups/{week}')\n        games =\
        \ matchups(raw, names, scored=week<pre_week)\n        if week < pre_week:\n            weekly = {}\n            for\
        \ a,b in games:\n                ia,ib = int(a['roster_id']),int(b['roster_id'])\n                pa,pb = score(a),\
        \ score(b)\n                hist[ia].append(pa); hist[ib].append(pb)\n                weekly[ia] = pa;weekly[ib] =\
        \ pb\n            median = statistics.median(weekly.values())\n            results.append({'week':week, 'median':median,\
        \ 'scores':weekly,\n                'pairs':[(int(a['roster_id']),int(b['roster_id'])) for a,b in games]})\n     \
        \   else:\n            current_pairs = [(int(a['roster_id']),int(b['roster_id'])) for a,b in games]\n    def standings(until):\n\
        \        rec = {i:{'wins':Decimal(0),'losses':Decimal(0),'ties':Decimal(0),'pf':Decimal(0)} for i in names}\n    \
        \    for item in results[:until]:\n            pts,med = item['scores'],item['median']\n            for a,b in item['pairs']:\n\
        \                for x,y in ((a,b),(b,a)):\n                    if pts[x]>pts[y]:rec[x]['wins']+=1\n             \
        \       elif pts[x]<pts[y]:rec[x]['losses']+=1\n                    else:rec[x]['ties']+=1\n            for rid,n\
        \ in pts.items():\n                rec[rid]['pf']+=n\n                if n>med:rec[rid]['wins']+=1\n             \
        \   elif n<med:rec[rid]['losses']+=1\n                else:rec[rid]['ties']+=1\n        order=sorted(rec,key=lambda\
        \ i:(-rec[i]['wins'],-rec[i]['pf'],i))\n        return rec,{rid:k+1 for k,rid in enumerate(order)}\n    before,rankbefore\
        \ = standings(max(0,post_week-1))\n    after,rankafter = standings(post_week)\n    rows = []\n    for ia,ib in current_pairs:\n\
        \        if len(hist[ia])!=post_week or len(hist[ib])!=post_week:\n            raise RuntimeError('Pregame features\
        \ incomplete')\n        rows.append({'id_a':ia,'id_b':ib,'name_a':names[ia],'name_b':names[ib],\n          'scores_a':[float(x)\
        \ for x in hist[ia]],'scores_b':[float(x) for x in hist[ib]],\n          'record_a':f\"{int(after[ia]['wins'])}-{int(after[ia]['losses'])}-{int(after[ia]['ties'])}\"\
        ,\n          'record_b':f\"{int(after[ib]['wins'])}-{int(after[ib]['losses'])}-{int(after[ib]['ties'])}\",\n     \
        \     'rank_a':rankafter[ia],'rank_b':rankafter[ib]})\n    last = results[post_week-1]\n    recap = []\n    for ia,ib\
        \ in last['pairs']:\n        pa,pb = last['scores'][ia], last['scores'][ib]\n        recap.append({'id_a':ia,'id_b':ib,'name_a':names[ia],'name_b':names[ib],\n\
        \            'score_a':money(pa),'score_b':money(pb),\n            'median_a':'W' if pa>last['median'] else 'L' if\
        \ pa<last['median'] else 'T',\n            'median_b':'W' if pb>last['median'] else 'L' if pb<last['median'] else\
        \ 'T',\n            'rank_delta_a':rankbefore[ia]-rankafter[ia],\n            'rank_delta_b':rankbefore[ib]-rankafter[ib],\n\
        \            'prior_rank_a':rankbefore[ia], 'prior_rank_b':rankbefore[ib],\n            'rank_a':rankafter[ia], 'rank_b':rankafter[ib]})\n\
        \    stamp = datetime.now(timezone.utc).isoformat(timespec='seconds')\n    return {'generated_at_utc':stamp,'season':SEASON,'league_id':LEAGUE_ID,\n\
        \      'league':str(league.get('name') or 'League of Ordinary Gentlemen'),\n      'war_week':pre_week,'aftermath_week':post_week,\n\
        \      'war_games':rows,'after_games':recap,'median':money(last['median']),\n      'standings_label':'Provisional\
        \ reconstruction: combined H2H + median wins, then PF; official tie-break parity unconfirmed',\n      'source':'Sleeper\
        \ public league matchups, rosters and users; historical scored weeks 1-'+str(post_week),\n      'snapshot_sha256':'will_be_computed_at_serialization'}\n\
        \n\ndef recent(a):\n    return statistics.mean(a[-3:])\n\n\n\n# Editorial engine: public Sleeper snapshots, verifiable\
        \ starter points and robust story selection.\nimport argparse\nimport math\nimport os\nimport sys\nfrom collections\
        \ import Counter\nfrom itertools import product\n\n\ndef logo_source(root):\n    \"\"\"Use the existing embedded LOG\
        \ logo; never generate or substitute a new one.\"\"\"\n    path = root / 'index.html'\n    if not path.is_file():\n\
        \        raise RuntimeError('Original LOG site logo source missing: index.html')\n    m = re.search(r'<img\\s+src=\"\
        (data:image/png;base64,[^\"]+)\"[^>]*class=\"league-logo\"', path.read_text(encoding='utf-8'), re.I)\n    if not m:\n\
        \        raise RuntimeError('Original embedded LOG logo not found; refusing to replace')\n    uri = m.group(1)\n \
        \   raw = base64.b64decode(uri.split(',', 1)[1], validate=True)\n    if not raw.startswith(b'\\x89PNG\\r\\n\\x1a\\\
        n'):\n        raise RuntimeError('Invalid LOG logo bytes')\n    return uri, hashlib.sha256(raw).hexdigest()\n\n\n\
        def rostered_identity(root):\n    \"\"\"Identity-only data from actual league rosters, never the private scouting/FA\
        \ board.\"\"\"\n    path = root / 'data' / 'league_rosters.json'\n    if not path.is_file():\n        return {}\n\
        \    raw = json.loads(path.read_text(encoding='utf-8'))\n    if isinstance(raw, dict) and raw.get('league_id') and\
        \ str(raw['league_id']) != LEAGUE_ID:\n        return {}\n    identities = {}\n    for roster in raw.get('rosters',\
        \ []) if isinstance(raw, dict) else []:\n        for key in ('starters', 'bench', 'taxi', 'reserve_ir'):\n       \
        \     for p in roster.get(key) or []:\n                if isinstance(p, dict) and p.get('player_id') and p.get('name'):\n\
        \                    identities[str(p['player_id'])] = {'name':str(p['name']), 'position':str(p.get('position') or\
        \ '')}\n    return identities\n\n\ndef player_lenses(root, after_week, team_ids, fetcher=get):\n    \"\"\"Completed\
        \ Sleeper starter points only. Unknown player identities are suppressed.\"\"\"\n    identities = rostered_identity(root)\n\
        \    starts = defaultdict(lambda: defaultdict(list))\n    last = defaultdict(list)\n    if not identities:\n     \
        \   return {'recent': {}, 'final': {}, 'data_status':'No verified league-roster identity cache; all player claims\
        \ withheld'}\n    for week in range(max(1, after_week-2), after_week+1):\n        rows = fetcher(f'league/{LEAGUE_ID}/matchups/{week}')\n\
        \        games = matchups(rows, team_ids, scored=True)\n        for pair in games:\n            for row in pair:\n\
        \                rid = int(row['roster_id'])\n                scores = row.get('players_points') or {}\n         \
        \       if not isinstance(scores, dict):\n                    continue\n                for pid in row.get('starters')\
        \ or []:\n                    pid = str(pid)\n                    if pid not in identities:\n                    \
        \    continue\n                    val = scores.get(pid)\n                    if isinstance(val, (int,float)) and\
        \ math.isfinite(val):\n                        entry = {'player_id':pid,'name':identities[pid]['name'],\n        \
        \                         'position':identities[pid]['position'], 'week':week,\n                                 'points':round(float(val),2)}\n\
        \                        starts[rid][pid].append(entry)\n                        if week == after_week:\n        \
        \                    last[rid].append(entry)\n    recent,final = {},{}\n    for rid in team_ids:\n        options\
        \ = []\n        for pid, entries in starts[rid].items():\n            if len(entries) >= 2:\n                options.append({'name':entries[0]['name'],'position':entries[0]['position'],\n\
        \                    'starts':len(entries),'total':round(sum(x['points'] for x in entries),2),\n                 \
        \   'weeks':[x['week'] for x in entries]})\n        options.sort(key=lambda x:(-x['total'],-x['starts'],x['name']))\n\
        \        if options:\n            recent[str(rid)] = options[0]\n        if last[rid]:\n            final[str(rid)]\
        \ = sorted(last[rid],key=lambda x:(-x['points'],x['name']))[0]\n    return {'recent':recent, 'final':final,\n    \
        \        'data_status':f'Verified only against {len(identities)} known rostered player identities and Sleeper completed-week\
        \ starter points'}\n\n\ndef mean(a):\n    return sum(a)/len(a) if a else 0.0\n\n\ndef f2(x):\n    return money(x)\n\
        \n\ndef records_parts(value):\n    a=value.split('-')\n    return int(a[0]),int(a[1]),int(a[2]) if len(a)>2 else 0\n\
        \n\ndef war_facts(g, week, players):\n    a,b = g['scores_a'],g['scores_b']\n    assert len(a)==len(b)==week-1 and\
        \ len(a)>=3\n    n = 3\n    ra, rb = mean(a[-n:]),mean(b[-n:])\n    prior_a,prior_b = mean(a[-6:-3]) if len(a)>=6\
        \ else None, mean(b[-6:-3]) if len(b)>=6 else None\n    return {'game':g,'window':f'Weeks {week-3}–{week-1}', 'season_window':f'Weeks\
        \ 1–{week-1}',\n        'ave_a':ra,'ave_b':rb,'gap':abs(ra-rb), 'range_a':max(a[-3:])-min(a[-3:]),\n        'range_b':max(b[-3:])-min(b[-3:]),'high_a':max(a[-3:]),'high_b':max(b[-3:]),\n\
        \        'low_a':min(a[-3:]),'low_b':min(b[-3:]),\n        'season_a':mean(a),'season_b':mean(b),'latest_a':a[-1],'latest_b':b[-1],\n\
        \        'latest_change_a':a[-1]-mean(a[-4:-1]) if len(a)>=4 else None,\n        'latest_change_b':b[-1]-mean(b[-4:-1])\
        \ if len(b)>=4 else None,\n        'prior_a':prior_a,'prior_b':prior_b,\n        'trend_a':ra-prior_a if prior_a is\
        \ not None else None,\n        'trend_b':rb-prior_b if prior_b is not None else None,\n        'p_a':players['recent'].get(str(g['id_a'])),\n\
        \        'p_b':players['recent'].get(str(g['id_b'])),\n        'record_a':records_parts(g['record_a']), 'record_b':records_parts(g['record_b'])}\n\
        \n\ndef entry(angle,score,headline,lead,why,question,keys):\n    return {'angle':angle,'priority':round(score,3),'headline':headline,'lead':lead,\n\
        \            'why':why,'question':question,'keys':keys}\n\n\ndef pre_candidates(f):\n    g=f['game'];a,b=g['name_a'],g['name_b'];avea,aveb=f['ave_a'],f['ave_b'];gap=f['gap']\n\
        \    top=a if avea>=aveb else b;other=b if top==a else a\n    topave=max(avea,aveb);otherave=min(avea,aveb)\n    rank_a,rank_b=g['rank_a'],g['rank_b']\n\
        \    wa,la,_=f['record_a'];wb,lb,_=f['record_b']\n    window=f['window'];options=[]\n    if (rank_a == 1 or rank_b\
        \ == 1) and max(rank_a,rank_b) >= 4:\n        leader = a if rank_a == 1 else b\n        challenger = b if leader ==\
        \ a else a\n        leader_record = g['record_a'] if leader == a else g['record_b']\n        leader_average = avea\
        \ if leader == a else aveb\n        other_average = aveb if leader == a else avea\n        under_last = f['latest_b']\
        \ if leader == a else f['latest_a']\n        options.append(entry('leader under challenge',183+min(gap,70)/5,\n  \
        \          'The No. 1 Team Meets an Unsettled Challenger',\n            f'{leader} holds provisional first place at\
        \ {leader_record} and has averaged {leader_average:.2f} over {window}. {challenger} enters after scoring {under_last:.2f}\
        \ last week.',\n            f'The league leader’s advantage is {abs(leader_average-other_average):.2f} points per\
        \ week in recent form. But the challenger has already posted weekly scores of its own; the real question is whether\
        \ last week was a low point or a new baseline, not whether the top seed carries the better record.',\n           \
        \ f'Can {challenger} approach its {other_average:.2f}-point recent average and make No. 1 defend that position?',\n\
        \            ['provisional_rank','combined_record','recent_means','latest_score']))\n    if rank_a<=3 and rank_b<=3:\n\
        \        options.append(entry('title race',190+gap/5,'The Leaders Are About to Test Each Other',\n            f'This\
        \ is a meeting of provisional No. {rank_a} {a} and No. {rank_b} {b}, carrying {g[\"record_a\"]} and {g[\"record_b\"\
        ]} combined H2H-and-median records.',\n            f'The standings make both contenders; {window} scoring gives {top}\
        \ a {gap:.2f}-point weekly advantage ({topave:.2f} to {otherave:.2f}). The difference matters because the head-to-head\
        \ result affects the two clubs competing near the top, regardless of which posts the larger weekly total.',\n    \
        \        f'Watch whether {other} can exceed its recent {otherave:.2f}-point average; this is an observed baseline,\
        \ not a point spread.',\n            ['rank_a','rank_b','record_a','record_b','ave_a','ave_b']))\n    record_leader=a\
        \ if wa>wb else b if wb>wa else None\n    if record_leader and ((record_leader==a and aveb>=avea) or (record_leader==b\
        \ and avea>=aveb)):\n        options.append(entry('record versus form',175+(15 if gap<=8 else 0), 'Records and Recent\
        \ Form Disagree',\n            f'{record_leader} owns the better {g[\"record_a\"] if record_leader==a else g[\"record_b\"\
        ]} record, yet {top} has outscored its opponent on a weekly-average basis over {window}.',\n            f'The advantage\
        \ is just {gap:.2f} points per game ({avea:.2f} for {a}; {aveb:.2f} for {b}). That puts the standings argument in\
        \ tension with recent production without establishing a decisive favorite.',\n            'Which signal holds up this\
        \ week: the longer-term record or the three-week scoring sample?',\n            ['records','ave_a','ave_b','window']))\n\
        \    late=[(a,f['latest_change_a'],f['latest_a']),(b,f['latest_change_b'],f['latest_b'])]\n    late=[x for x in late\
        \ if x[1] is not None and x[1]<-22]\n    if late:\n        falling,change,last=max(late,key=lambda x:abs(x[1]))\n\
        \        options.append(entry('recent reversal',155+min(abs(change),80)/4,f'{falling} Has a One-Week Question to Answer',\n\
        \            f'{falling} managed {last:.2f} last week, {abs(change):.2f} below its three preceding completed games.',\n\
        \            f'That deviation is more striking than the overall {gap:.2f}-point gap between the clubs’ latest three-week\
        \ averages. It identifies a recent scoring swing, not a confirmed roster or health cause.',\n            f'Was the\
        \ dip an outlier, or does {falling} stay below its prior three-game scoring level?',\n            ['latest','previous_three_mean','recent_means']))\n\
        \    for label,other_name,trend,ave,prev in [(a,b,f['trend_a'],avea,f['prior_a']),(b,a,f['trend_b'],aveb,f['prior_b'])]:\n\
        \        if trend is not None and trend>=20:\n            options.append(entry('surging form',137+min(trend,60)/3,f'{label}\
        \ Is Playing Above Its Earlier Pace',\n                f'{label} has raised its scoring average by {trend:.2f} points\
        \ a game: {prev:.2f} across the previous three-week block versus {ave:.2f} in {window}.',\n                f'That\
        \ improvement sharpens the test against {other_name}, whose latest three-week average is {mean(g[\"scores_b\"][-3:])\
        \ if label==a else mean(g[\"scores_a\"][-3:]):.2f}. A sustained change would matter more than any single spike.',\n\
        \                f'Can {label} maintain that newer scoring level for a fourth consecutive sample week?',\n       \
        \         ['recent_three','previous_three']))\n    diffrange=abs(f['range_a']-f['range_b'])\n    if diffrange>=30:\n\
        \        steady=a if f['range_a']<f['range_b'] else b\n        variable=b if steady==a else a\n        variable_average\
        \ = avea if variable==a else aveb\n        steady_average = aveb if variable==a else avea\n        range_interpretation\
        \ = (\n            f'{variable} also holds the {gap:.2f}-point weekly scoring edge, so {steady} would benefit most\
        \ if the higher-scoring team landed at the low end of its range.'\n            if variable==top else\n           \
        \ f'{steady} has the {gap:.2f}-point weekly scoring advantage, while {variable} has needed much larger week-to-week\
        \ swings to keep pace.')\n        options.append(entry('consistency versus volatility',135+min(diffrange,80)/4,'The\
        \ Range of Outcomes Is the Real Story',\n            f'{steady} has stayed in a tighter three-week scoring band: {min(f[\"\
        range_a\"],f[\"range_b\"]):.2f} points from high to low, compared with {max(f[\"range_a\"],f[\"range_b\"]):.2f} for\
        \ {variable}.',\n            f'{range_interpretation} These are completed-week observations ({window}), not forecasts.',\n\
        \            f'Will {variable} resemble its {f[\"high_a\"] if variable==a else f[\"high_b\"]:.2f}-point recent high\
        \ or its {f[\"low_a\"] if variable==a else f[\"low_b\"]:.2f}-point low?',\n            ['three_week_range_a','three_week_range_b','recent_averages']))\n\
        \    if gap>=28:\n        lowmax=f['high_b'] if top==a else f['high_a']\n        highmin=f['low_a'] if top==a else\
        \ f['low_b']\n        overlapping=lowmax>=highmin\n        options.append(entry('underdog path',132+min(gap,80)/3,'The\
        \ Upset Has a Measurable Hurdle',\n            f'{other} trails {top} by {gap:.2f} points per game across {window},\
        \ a sizable gap in recent scoring.',\n            f'{other}’s best score in that stretch was {lowmax:.2f}; {top}’s\
        \ worst was {highmin:.2f}. The observed three-week bands {\"overlap\" if overlapping else \"do not overlap\"}, making\
        \ the upset route {\"plausible within the recorded range\" if overlapping else \"outside the ranges seen in those\
        \ three games\"}.',\n            f'The decisive unknown is whether {other} can surpass its own recent peak or {top}\
        \ drops below its recent floor.',\n            ['recent_means','three_week_highs','three_week_lows']))\n    if gap<=10:\n\
        \        options.append(entry('fine margins',133-gap/2,'Not Much Separates These Two on Form',\n            f'Only\
        \ {gap:.2f} points per week separate {a} ({avea:.2f}) and {b} ({aveb:.2f}) over {window}.',\n            f'That small\
