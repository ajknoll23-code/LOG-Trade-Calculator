        \ form {i}')\n        if s['takeaway'].strip().endswith(('.00 points.','scoring gap.','team total.')):\n         \
        \   raise RuntimeError(f'NL36 dry numerical recap closing {kind} {i}')\n    q['nl36_punch_last_verified']=True\n \
        \   q['nl36_no_automated_editorial_score']=True\n    return q\n\n\ndef nl32_cross_edition_gate(war,after):\n    _NL36_PREVIOUS_CROSS(war,after)\n\
        \    return nl34_duplicate_guard(war,after)\n\n\ndef nl36_selftest():\n    assert NL35_VOICE=={'roasting_trash_talk_attitude':75,'bold_matchup_opinions':15,'verified_statistics':10}\n\
        \    # Every source-supported editorial angle needs its own distinct final punch;\n    # two different angles must\
        \ NEVER share the generic fallback closer.\n    required_war={'record versus form','recent reversal','surging form',\n\
        \                  'consistency versus volatility','underdog path',\n                  'fine margins','starter contribution','measured\
        \ comparison',\n                  'title race','leader under challenge'}\n    required_after={'strong score in defeat','win\
        \ without median',\n                    'standings shock','large-weekly-margin',\n                    'pregame-baseline\
        \ reversal','form upset',\n                    'verified player contribution','median divide','measured outcome'}\n\
        \    assert set(_NL36_WAR_PUNCH)==required_war, 'NL36 missing or unexpected War Room closing angle'\n    assert set(_NL36_AFT_PUNCH)==required_after,\
        \ 'NL36 missing or unexpected Aftermath closing angle'\n    for table in (_NL36_WAR_PUNCH,_NL36_AFT_PUNCH):\n    \
        \    assert len(set(table.values()))==len(table), 'NL36 duplicate editorial closing text'\n        assert all(not\
        \ nl31_numeric_literals(quip) for quip in table.values()), 'NL36 punch includes numbers'\n        sample={'name_a':'TEAM\
        \ ONE','name_b':'TEAM TWO',\n                'nl30_facts':[{'name':'TEST PLAYER','team':'TEAM ONE'}]}\n        masked={nl34_sentence_fingerprint(quip,sample)\
        \ for quip in table.values()}\n        assert len(masked)==len(table), 'NL36 repeated masked closing shapes'\n   \
        \ fake={'name_a':'TEAM ONE','name_b':'TEAM TWO','nl30_facts':[{'name':'TEST PLAYER','team':'TEAM ONE'}]}\n    for\
        \ kind,templates in (('after',_NL36_AUTOPSY_AFTER),('war',_NL36_AUTOPSY_WAR),\n                           ('after',_NL36_RANK_AFTER),('war',_NL36_RANK_WAR)):\n\
        \        forms=[nl34_sentence_fingerprint(t.format(team='TEAM ONE',delta='34.55'),fake) for t in templates]\n    \
        \    assert len(forms)==6 and len(set(forms))==6, 'NL36 duplicate masked Autopsy paragraph shapes'\n    for i in range(6):\n\
        \        assert 'My pick:' not in _NL36_AFT_DUPLICATE_PUNCH[i]\n        assert not nl31_numeric_literals(_NL36_AFT_DUPLICATE_PUNCH[i])\n\
        \        assert not nl31_numeric_literals(_NL36_WAR_DUPLICATE_PUNCH[i])\n    print('PASS NL36R1: factual decline moves\
        \ before final punch; unchanged duplicate, starter, and privacy gates')\n\n\ndef selftest():\n    _NL36_PREVIOUS_SELFTEST()\n\
        \    nl36_selftest()\n\n\nif __name__=='__main__':\n    p=argparse.ArgumentParser()\n    p.add_argument('--out',type=Path)\n\
        \    p.add_argument('--root',type=Path,default=Path.cwd())\n    p.add_argument('--war-week',type=int,default=9)\n\
        \    p.add_argument('--aftermath-week',type=int,default=8)\n    p.add_argument('--fixture',type=Path)\n    p.add_argument('--selftest',action='store_true')\n\
        \    args=p.parse_args()\n    if args.selftest:selftest()\n    else:nl30_execute(args.out,args.root,args.war_week,args.aftermath_week,args.fixture)\n\
        NL30_ENGINE\npython3 -m py_compile \"$RUNNER_TEMP/log_nl36r1_editorial.py\"\npython3 \"$RUNNER_TEMP/log_nl36r1_editorial.py\"\
        \ --selftest\n"
    - name: Build NL29 immutable control and NL36R1 BRASH challenger from one live weekly snapshot
      shell: bash
      env:
        WAR_WEEK: ${{ inputs.war_week }}
        AFTERMATH_WEEK: ${{ inputs.aftermath_week }}
      run: "set -euo pipefail\npython3 \"$RUNNER_TEMP/log_nl36r1_editorial.py\" \\\n  --root \"$GITHUB_WORKSPACE\" \\\n  --out\
        \ \"$RUNNER_TEMP/log-nl30-editorial\" \\\n  --war-week \"$WAR_WEEK\" \\\n  --aftermath-week \"$AFTERMATH_WEEK\"\n"
    - name: Independently verify verified facts, punchline-last, PDFs and blinded ZIP
      shell: bash
      run: "set -euo pipefail\npython3 - <<'NL30_INDEPENDENT_QA'\nimport json,os,pathlib,re,zipfile\nimport fitz\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'log-nl30-editorial'\n\
        x=json.loads((root/'NL36R1-Player-Provenance-and-Selection-Ledger.json').read_text(encoding='utf-8'))\nassert x['model']=='A-NL36R1'\n\
        assert len(x['nl36_editorial_evidence'])==12\nassert all(v['voice_mix_percent']=={'roasting_trash_talk_attitude':75,'bold_matchup_opinions':15,'verified_statistics':10}\
        \ for v in x['nl36_editorial_evidence'])\nassert all(v['verified_autopsy_delta_in_paragraph_two'] for v in x['nl36_editorial_evidence'])\n\
        assert all(not v['punchline_has_numeric_restatement'] for v in x['nl36_editorial_evidence'])\nassert x['fixture_test_not_live_evidence']\
        \ is False, 'Synthetic output cannot pass live acceptance'\nassert x['publication_authorized'] is False and x['picks_archived']\
        \ is False\nassert x['private_free_agents_read'] is False and x['automatic_85_point_gate'] is False\nassert x['human_editorial_review']=='PENDING'\n\
        assert x['unqualified_roasts']==0\nassert len(x['featured_stories'])==12\nassert sum(len(r['featured_starters']) for\
        \ r in x['featured_stories'])>=12\nassert x['nl32_starter_anchor_verified'] is True\nassert x['nl32_featured_anchor_week']==x['aftermath_week']\n\
        assert len(x['nl32_editorial_evidence'])==12\nassert len(x['nl33_editorial_evidence'])==12\nassert len(x['nl34_editorial_evidence'])==12,\
        \ 'missing NL35 audit of 12 feature choices'\nassert x['nl35_voice_mix_percent']=={'roasting_trash_talk_attitude':75,'bold_matchup_opinions':15,'verified_statistics':10}\n\
        assert len(x['nl35_editorial_evidence'])==12 and all(z['human_approval']=='PENDING' for z in x['nl35_editorial_evidence'])\n\
        assert all(z['source_backed_contrasts'] for z in x['nl35_editorial_evidence'])\nassert all(x['quality'][k]['nl35_75_15_10_voice']==x['nl35_voice_mix_percent']\
        \ for k in ('WarRoom','Aftermath'))\nassert all(d['paragraph_two_added_values'] for d in x['nl34_editorial_evidence'])\n\
        assert all(d['selection_audits'] and all(a['highest_eligible_player_id']==a['chosen_player_id']\n  and a['candidate_count']>=1\
        \ for a in d['selection_audits']) for d in x['nl34_editorial_evidence'])\nassert all(d['human_review_pending'] for\
        \ d in x['nl34_editorial_evidence'])\nassert all(x['quality'][k]['nl34_unique_story_arguments']==6 and\n         \
        \  x['quality'][k]['nl34_explanatory_selections_audited']==6 for k in ('WarRoom','Aftermath'))\nassert all(e['paragraph_two_adds']\
        \ for e in x['nl33_editorial_evidence'])\nassert all(e['same_source_NL29_control_untouched'] is True for e in x['nl33_editorial_evidence'])\n\
        assert all(e['human_review_pending'] is True for e in x['nl33_editorial_evidence'])\nassert all(x['quality'][k]['nl33_distinct_p2_and_closers']==6\
        \ for k in ('WarRoom','Aftermath'))\nassert x['nl32_excluded_player_ids']==['13557']\nfor r in x['featured_stories']:\n\
        \    players=r['featured_starters']\n    assert all(p.get('nl32_current_week_started') is True and p.get('nl32_anchor_week')==x['aftermath_week']\
        \ for p in players)\n    assert all(p['player_id'] not in x['nl32_excluded_player_ids'] for p in players)\n    assert\
        \ all(p['nl32_current_week_source'].endswith('/matchups/'+str(x['aftermath_week'])) for p in players)\n    assert\
        \ 1<=len(players)<=2\n    if r['internal_structure']=='Heavyweight':\n        assert len(players)==2 and len({p['team']\
        \ for p in players})==2\n    assert r['opening_shape']\n    if r['voice']=='Full League Roast':assert r['roast_thresholds_met']\n\
        \    text=' '.join(r['narrative_paragraphs'])\n    assert 'athan kaliakmanis' not in text.casefold()\n    for p in\
        \ players:\n        assert p['name'] in text and f\"{p['points']:.2f}\" in text\n        assert p['source_endpoint'].startswith('league/')\
        \ and p['source_verified']\n        assert p['selection_reason'] and 'higher_scorers_passed_over' in p\n        if\
        \ r['edition']=='WarRoom':assert max(p['weeks'])<x['war_week']\nfor kind,w in [('WarRoom',x['war_week']),('Aftermath',x['aftermath_week'])]:\n\
        \    q=x['quality'][kind]\n    assert q['hard_gate_result']=='PASS' and q['openings_unique']\n    assert q['mandatory_facts']==6\
        \ and q['pages']==7 and q['html_pdf_verified']\n    assert len(q['page_geometry'])==7\n    assert min(p['minimum_visible_font_pt']\
        \ for p in q['page_geometry'])>=7.15\n    path=root/f'LOG-NL36R1-{kind}-W{w:02d}-Editorial-Shadow.pdf'\n    md=(root/f'LOG-NL36R1-{kind}-W{w:02d}-Editorial-Shadow.md').read_text(encoding='utf-8')\n\
        \    if kind=='WarRoom':\n        assert md.count('My pick:')==6, 'each preview must publicly take a side'\n    parts=re.split(r'(?m)^##\
        \ \\d\\d\\. ',md)  # keep parsing independent of Python dictionaries\n    assert len(parts)==7, 'six reader-facing\
        \ articles are mandatory'\n    for article in parts[1:]:\n        text_section=article.split('*Source:*')[0].strip()\n\
        \        paragraphs=[v.strip() for v in text_section.split('\\n\\n') if v.strip()]\n        assert len(paragraphs)>=4,\
        \ 'headline, teams, body and closer must all survive PDF build'\n        closer=paragraphs[-1]\n        assert not\
        \ re.search(r'\\d+\\.\\d+',closer), 'a dry statistic followed the editorial punchline'\n        if kind=='WarRoom':\
        \ assert closer.startswith('My pick:'), 'last paragraph must declare a named opinion'\n    assert 'EDITORIAL SHADOW'\
        \ in md and 'NOT PUBLISHED' in md\n    base=root/'BASELINE-NL29R1'/f'LOG-NL29R1-{kind}-W{w:02d}-Editorial-Shadow.pdf'\n\
        \    for pdf in (path,base):\n        assert pdf.is_file()\n        with fitz.open(pdf) as d:\n            assert\
        \ len(d)==7, (pdf,len(d))\n            assert all(len(p.get_text())>320 for p in d)\n    assert len([r for r in x['featured_stories']\
        \ if r['edition']==kind])==6\nreviewer=root/'SEND-TO-GROK-BLIND-COMPARISON.zip'\nassert reviewer.exists() and reviewer.stat().st_size>100000\n\
        with zipfile.ZipFile(reviewer) as z:\n    names=z.namelist()\n    assert len([n for n in names if n.endswith('.pdf')])==4\n\
        \    assert len([n for n in names if n.endswith('.json')])==2\n    assert not any('NL29' in n or 'NL30' in n or 'UNBLIND'\
        \ in n for n in names)\n    assert 'GROK-BLIND-REVIEW-INSTRUCTIONS.md' in names\nassert (root/'EDITOR-ONLY-UNBLIND-KEY.json').is_file()\n\
        print('PASS: NL30 live 12/12 player-led stories; 2x7 verified pages; same-source NL29 baseline; anonymized blind package;\
        \ no publication')\nNL30_INDEPENDENT_QA\n"
    - name: Prove no repository files were modified
      if: always()
      shell: bash
      run: 'set -euo pipefail

        git diff --exit-code

        test -z "$(git status --porcelain --untracked-files=all)"

        echo ''PASS: read-only; no publishing, pick archiving, mail, production or free-agent changes''

        '
    - name: Upload both source-comparable PDF editions, evidence and blind review ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: LOG-NL36R1-Final-Editorial-Shadow-${{ github.run_id }}
        path: ${{ runner.temp }}/log-nl30-editorial/
        if-no-files-found: warn
        retention-days: 90
    - name: NL36R1 editorial shadow summary
      if: always()
      shell: bash
      run: 'set -euo pipefail

        cat >> "$GITHUB_STEP_SUMMARY" <<''NL36R1_SUMMARY''

        ## NL36R1 — BRASH SHADOW ONLY: 75% roast, 15% bold opinion, 10% statistics

        - NL29 control unchanged; NL35 challenger is roast-first and source-backed.

        - 12 completed-week verified starter facts; 7 pages each; no fabricated injuries or lineup claims.

        - Every War Room preview declares a named editorial pick, not a model forecast.

        - No dry stat after My pick / final punch; inherited duplicate-closer regression fixed; inherited editorial repetition
        gates stay active.

        - NL35 75/15/10 is an editorial priority, not an automated percentage score gate.

        - NL29 vs NL35 four-PDF blind Grok ZIP, no unblinding key in reviewer package.

        - No private free-agent board, saved picks, production changes, email, or publication.

        - Human approval required; previous Grok benchmarks are not machine thresholds.

