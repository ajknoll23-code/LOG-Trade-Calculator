      - name: Prove only intended V6 research outputs changed
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-v6")
          results = json.loads((d / "development_evaluation_v1.json").read_text())

          expected = {
              "research/package-adjustment-v6/development_evaluation_v1.json",
              "research/package-adjustment-v6/development_evaluation_v1.md",
              "research/package-adjustment-v6/development_evaluation_manifest_v1.json",
          }
          if results["candidate_written"]:
              expected |= {
                  "research/package-adjustment-v6/development_candidate_v1.json",
                  "research/package-adjustment-v6/development_candidate_v1.md",
              }

          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          actual = {line[3:] for line in lines if line.strip()}

          if actual != expected:
              raise SystemExit(
                  "unexpected repository change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )
          print("PASS: only intended V6 development evaluation outputs changed.")
          PY

