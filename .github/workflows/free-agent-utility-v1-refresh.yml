name: Free Agent Utility V1 - Refresh

on:
  workflow_run:
    workflows:
      - Sleeper Maintenance
      - Scheduled Data Refresh
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Pin production code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/projections/build_free_agent_utility_v1.py)" = "c1fb62c1c04b4b539fa74bff4ee038ec1a4cccc1"
          test "$(git hash-object scripts/validation/validate_free_agent_utility_v1.py)" = "bc30ff0bec940e06e8a358f7dc797434463b4684"
          test "$(git hash-object research/free-agent-utility-v1/free_agent_utility_v1_phase1.py)" = "1bb87f685c00e51a488a0c21510ccdca452e6b72"
          grep -Fq 'TRANSPORT_STRENGTH = 0.15' scripts/projections/build_free_agent_utility_v1.py
          grep -Fq 'SHIFT_CAP = 0.04' scripts/projections/build_free_agent_utility_v1.py
          grep -Fq 'PHASE2_QUALIFICATION_COVERAGE_REFERENCE = 0.50' scripts/projections/build_free_agent_utility_v1.py
          grep -Fq 'MIN_PROVIDER_ROW_FRACTION = 0.50' scripts/projections/build_free_agent_utility_v1.py
          grep -Fq 'EXPECTED_PHASE4_FREE_AGENTS_BLOB = "2a007c0b2febd47cb29543fbe191959c8234f0dd"' scripts/projections/build_free_agent_utility_v1.py

      - name: Self-test
        run: |
          python3 scripts/projections/build_free_agent_utility_v1.py --selftest
          python3 scripts/validation/validate_free_agent_utility_v1.py --selftest

      - name: Decode private 4for4 inputs
        shell: bash
        env:
          FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}
          FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
          FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
          FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}
        run: |
          set -euo pipefail
          for var in FOURFORFOUR_OFFENSE_GZ_B64_PART1 FOURFORFOUR_OFFENSE_GZ_B64_PART2 FOURFORFOUR_OFFENSE_GZ_B64_PART3 FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            test -n "${!var:-}" || { echo "Missing $var" >&2; exit 1; }
          done
          install -d -m 700 /tmp/log-fa-utility-v1/input
          printf '%s%s%s' \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART1" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART2" \
            "$FOURFORFOUR_OFFENSE_GZ_B64_PART3" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/offense.csv
          printf '%s' "$FOURFORFOUR_DL_GZ_B64" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/dl.csv
          printf '%s' "$FOURFORFOUR_LB_GZ_B64" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/lb.csv
          printf '%s' "$FOURFORFOUR_DB_GZ_B64" \
            | base64 --decode | gzip -dc \
            > /tmp/log-fa-utility-v1/input/db.csv
          chmod 600 /tmp/log-fa-utility-v1/input/*.csv

      - name: Refresh derived ranks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/build_free_agent_utility_v1.py \
            --offense /tmp/log-fa-utility-v1/input/offense.csv \
            --dl /tmp/log-fa-utility-v1/input/dl.csv \
            --lb /tmp/log-fa-utility-v1/input/lb.csv \
            --db /tmp/log-fa-utility-v1/input/db.csv \
            --write-artifact

      - name: Validate refreshed utility
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/projections/build_free_agent_utility_v1.py --check
          python3 scripts/validation/validate_free_agent_utility_v1.py
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit refreshed artifact if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "free-agent-utility-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/free_agent_utility_v1.json
          if git diff --cached --quiet; then
            echo "Free Agent Utility V1 already current."
          else
            git pull --rebase --autostash origin main
            git add data/free_agent_utility_v1.json
            git commit -m "Refresh Free Agent Utility V1"
            test "$(git diff --name-only HEAD~1 HEAD)" = "data/free_agent_utility_v1.json"
            git push origin HEAD:main
          fi

      - name: Destroy private inputs
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/log-fa-utility-v1
