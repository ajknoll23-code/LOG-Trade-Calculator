      - name: Validate snapshot and write immutable manifest
        if: env.ALREADY_FROZEN != 'true' && env.SEASON_COMPLETE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          target = int(os.environ["TARGET_WEEK"])
          snap_path = Path(os.environ["SNAP_PATH"])
          manifest_path = Path(os.environ["MANIFEST_PATH"])
          cutoff_expected = os.environ["ORIGIN_CUTOFF_UTC"]
          workflow_path = Path(".github/workflows/B51-v1-schedule-utility-v1-reusable-weekly-prospective-snapshot-freezer.yml")
          builder_path = Path(os.environ["RUNNER_TEMP"]) / "schedule-utility-v1/b51_reusable_builder.py"

          snap = json.loads(snap_path.read_text(encoding="utf-8"))

          assert snap["schema_version"] == 2
          assert snap["study_id"] == "schedule-utility-v1"
          assert snap["phase"] == "B51-reusable-weekly-prospective-origin-snapshot"
          assert snap["status"] == "FROZEN_PROSPECTIVE_ORIGIN_SNAPSHOT"
          assert snap["season"] == 2026
          assert snap["origin_week"] == target
          assert snap["origin_cutoff_utc"] == cutoff_expected
          assert snap["scoring_mode"] == "HALF_PPR"
          assert snap["visibility"] == "NON_USER_VISIBLE"
          assert snap["outcome_evaluation_performed"] is False
          assert snap["production_authorized"] is False
          assert snap["quantitative_v1_stop_remains_binding"] is True

          expected_history = list(range(max(1, target - 10), target))
          assert snap["history_weeks"] == expected_history

          ready = snap["readiness"]
          assert ready["origin_week"] == target
          assert ready["history_incomplete_games"] == 0
          assert ready["origin_week_completed_games_at_freeze"] == 0
          assert ready["origin_cutoff_utc"] == cutoff_expected

          hist = snap["history_aggregation_audit"]
          assert hist["source_completeness_failures"] == 0
          assert hist["history_week_start"] == min(expected_history)
          assert hist["history_week_end"] == max(expected_history)
          assert hist["history_games"] > 0

          gov = snap["governance"]
          assert gov["snapshot_created_before_origin_cutoff"] is True
          assert gov["eligible_history_complete_before_snapshot"] is True
          assert gov["origin_week_outcomes_present_at_snapshot"] is False
          assert gov["no_backfill"] is True
          assert gov["may_recompute_predictor_after_outcomes"] is False
          assert gov["user_facing_display_authorized"] is False
          assert gov["fv_or_trade_integration_authorized"] is False

          future = snap["future_schedule_at_origin"]
          assert future
          assert all(target <= int(r["scheduled_week_at_origin"]) <= 17 for r in future)
          assert all(int(r["planned_h_at_origin"]) >= 1 for r in future)

          for pos, payload in snap["planned_h1_predictor_availability"].items():
              assert pos in {"QB", "RB", "WR", "TE"}
              assert payload["expected_directional_rows"] > 0
              assert 0 <= payload["predictor_available_rows"] <= payload["expected_directional_rows"]
              frac = payload["availability_fraction"]
              assert frac is None or 0 <= frac <= 1

          h = hashlib.sha256(snap_path.read_bytes()).hexdigest()
          workflow_sha = hashlib.sha256(workflow_path.read_bytes()).hexdigest()
          builder_sha = hashlib.sha256(builder_path.read_bytes()).hexdigest()

          manifest = {
              "schema_version": 2,
              "study_id": "schedule-utility-v1",
              "season": 2026,
              "origin_week": target,
              "snapshot_path": str(snap_path),
