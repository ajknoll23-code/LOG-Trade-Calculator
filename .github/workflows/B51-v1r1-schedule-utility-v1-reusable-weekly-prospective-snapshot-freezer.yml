              "builder_sha256": builder_sha,
              "b34_reference_builder_sha256": os.environ["B34_REFERENCE_BUILDER_SHA256"],
              "b33_prereg_sha256": os.environ["B33_PREREG_SHA256"],
              "log_sapa_sha256": os.environ["LOG_SAPA_SHA256"],
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
