# WFC05R3: Repairs failed WFC05R2 self-identification using GITHUB_WORKFLOW_REF, and excludes only pinned earlier allowlist authors.
# Based on WFC01 and WFC02 audit data. Frozen-study controls, active weekly pipelines, and production releases excluded.
# Default preview leaves GitHub unchanged. Apply requires SHA/digest pins and existing LOG_WORKFLOW_WRITE_TOKEN.
name: '01 | DATA & REFRESH | WFC05R3 Historical Research Archive Path Repair (Preview / Apply)'
run-name: 'WFC05R3 ${{ inputs.mode }} - 50 historical research workflows'
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run preview first; apply only after reviewing the exact report and pins.'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
      approved_commit_sha:
        description: 'Apply only: exact git HEAD from green preview'
        type: string
        required: false
      approved_manifest_sha256:
        description: 'Apply only: SHA256 digest from green preview'
        type: string
        required: false
      approval_phrase:
        description: 'Apply only: ARCHIVE REVIEWED RESEARCH BATCH'
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  bulk_archive:
    name: 'Preview 50 or archive only verified reviewed files'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require workflow-scoped PAT if applying
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.LOG_WORKFLOW_WRITE_TOKEN }}
        run: |
          test -n "$WRITE_TOKEN" || { echo '::error::Missing secret LOG_WORKFLOW_WRITE_TOKEN'; exit 1; }
      - name: Check out main with approved credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ inputs.mode == 'apply' && secrets.LOG_WORKFLOW_WRITE_TOKEN || github.token }}
      - name: Install pinned YAML reader
        run: python3 -m pip install --quiet PyYAML==6.0.2
      - name: Materialize fixed-roster archive engine
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/wfc05_engine.py" <<'PY_WFC05_R1'
          #!/usr/bin/env python3
          """WFC05R3 historical read-only research archive preview/apply; fixed candidate list.
          Only byte-identical, read-only, manually triggered historical research workflows with no tracked live references can move.
          No data or history deletion. Requires pinned SHA, manifest SHA and scoped workflow PAT on apply.
          """
          from __future__ import annotations
          import csv, datetime as dt, hashlib, json, os, re, subprocess
          from pathlib import Path
          import yaml
          
          REPO = 'ajknoll23-code/LOG-Trade-Calculator'
          ROOT = Path('.github/workflows')
          ARCHIVE = Path('.github/workflow-archive/cleanup-workflows/WFC05-research-wave2-2026-11-14')
          RECEIPT = Path('.github/workflow-archive/cleanup-manifests/WFC05-research-wave2-2026-11-14-receipt.json')
          # The authoritative runtime workflow filename is GITHUB_WORKFLOW_REF; it is
          # unaffected by user renames, upload suffixes such as (1), or filename changes.
          EXPECTED_SELF_DISPLAY_NAME = '01 | DATA & REFRESH | WFC05R3 Historical Research Archive Path Repair (Preview / Apply)'
          # These are known earlier, self-contained fixed-allowlist *authoring* workflows.
          # Exclude only after verifying their exact git blob SHA1 against inspected repo sources.
          PREVIOUS_ALLOWLIST_AUTHORS = {
              '.github/workflows/A-WFC05R1-Historical-Research-Archive-Preview-Apply(1).yml': '0af40ddad9a49c24aafb3d5f71d8c71848f7d3ed',
              '.github/workflows/LOG-WFC05R2-Fixed-Bulk-Archive-v2.yml': '6f255780ed919b6cfce0bdbbda06e5b919b9e94d',
          }
          def is_exact_filename_reference(raw, basename):
              pattern=rb'(?<![A-Za-z0-9_.-])'+re.escape(basename)+rb'(?![A-Za-z0-9_.-])'
              return re.search(pattern,raw) is not None

          APPROVAL = 'ARCHIVE REVIEWED RESEARCH BATCH'
          MODE = os.getenv('WFC05_MODE','preview').strip().lower()
          OUT = Path(os.getenv('WFC05_OUTPUT','/tmp/wfc05-research-results'))
          # source filename: (group, exact byte SHA256 from WFC01's green 280-file audit)
          TARGETS = {
              'A-QA02.yml': (3, '99c689bf575920ad387de0d70da6e979fc90339e2dd829ee1a0f0c19ac6ecb2c'),
              'A-QA07-Shadow-Review-R1.yml': (3, 'eec545be387b22d74dd12b4b3ad481eea11c2178d037dfffd6666e12ed978151'),
              'A-QA16-Paired-QB-Calibration-Review.yml': (3, 'a270442a4366ad05f6c2dfadaa70585314a1b406ede38c82afefa4e7f7fef00d'),
              'A_FA02R1_Free_Agent_Opportunity_Data_Feasibility_Read_Only.yml': (4, '3710eabeaf54474eda8fd51c2a0947ef6efa32d9df68ab8c9de6955cda46cd68'),
              'A_FA02R2_2025W07_Historical_Usage_Bridge_Read_Only.yml': (4, 'a9c20607b22fede0a872056dd20d190c6f6b924dc2c816a25705f273b08ff773'),
              'CAL26_R60_Research.yml': (3, 'ba52c2e00c154843f3e1b6586c28c6def09957a62354845cdc7846aba505a127'),
              'CAL26_R63_REDOWNLOAD.yml': (3, '8b238208a837597b9882c45e1b70022f45f801cab94f6a700a7e13f36fb92bfa'),
              'CAL26_R64_FRESH.yml': (3, 'd7d34fe744c3cf8cf8fcd74a968aa9e110552aa141b63b9dad701bbc78808e13'),
              'CAL26_R65_FRESH.yml': (3, '509749ce3b3ad5adce74d09b574c90338d1a1b38be7cb8621a8674afd4fbdae4'),
              'CAL26_R66_FRESH.yml': (3, 'af577419705911965ae9431d5fadbdf204e1d56101754d8a843547a21916daf9'),
              'CAL26_R67.yml': (3, 'ec9ab1baeb31a6e8bb3af6788f4ee942c7bb6a7d9510710f7b73bd3d2cc732fd'),
              'CAL26_R68.yml': (3, '4a3ba0c30395093315f32f1864262bc2a442810782b6d6906bc6729e65c495c3'),
              'CAL26_R69.yml': (3, 'c5be130567bc87567f5ce16a2708c9d1d489444a133df1bb7942967802c09432'),
              'CAL26_R70_FRESH.yml': (3, 'e8e0692c2ba507efaa5689721c1b927732eecf959a91d12e64cd8e0733312f5c'),
              'CAL26_R71_FRESH.yml': (3, 'df2cb2f772419fc23c3fadbd977662a30569a54ce3145e7f44e07c0d6b4f429d'),
              'CAL26_R72_FRESH.yml': (3, 'f7a29513ea129acf6a85f8efef46c4c991ca0a37caf26ed04e3b3f4865674d5b'),
              'CAL26_R73.yml': (3, 'd13b73182c981eeadae39b86f2f067070f9eeb3b94cf8613c294b295bd5fe571'),
              'CAL26_R74_FRESH.yml': (3, '358078d7e741c89a07f70a4f397ea3b5a54182bca9d871eed49019b739b39473'),
              'CAL26_R75_FRESH.yml': (3, '39f58050c9e791482861f2ff997e9a28ee64c14082de62fdb6942f5ead991fcf'),
              'CAL26_R76_FRESH.yml': (3, 'c3aebbca0ee742898373b8f4176358a911d37f602f7455885b103b9442e9823b'),
              'CAL26_R77.yml': (3, 'f479f80c919369aeacf9fe5fd74d8385916fc53b0aa1b04cc83cbb6987f0d858'),
              'CAL26_R78R1.yml': (3, '0222fc2e97e0cb15f4adddec4236de6324c35398fc65642c5820d1233f4308e4'),
              'CAL26_R78_FRESH.yml': (3, '5b6459d43dfe8b85963011de3a29e79acd6bb978eb24158f7a34907cb431b170'),
              'CAL26_R79.yml': (3, '6a4ad3a8cd799abd4f886dabd197d7db0c926fe44845838465359729d464817c'),
              'CAL26_R80.yml': (3, '3656b9d288d191cc021d913dbb94c5bfc4279c5241fda5ad99a9e8ed3caea2a9'),
              'CAL26_R82.yml': (3, '5c8c452ba01483c200a9b7d08c5f430cbe26bcb373a42d2e868723208274e23a'),
              'CAL26_R83.yml': (3, 'da5d68d7e95c2645a88609f04641188a537e018e32f7873ee640ddc1db96e325'),
              'CAL26_V1R42_Historical_QB_Career_Continuation_and_Surplus_Read_Only.yml': (3, 'b98918486e4a83080e68c2004e51d0044fcc83c4fb9262136c7c01fb00e52e8c'),
              'CAL26_V1R46_QB_Recency_and_Breakout_Historical_Backtest_Read_Only.yml': (3, 'b6696f61c8086e8110651ca6dc8715bc423e6ac8b40990d843daafd3c4d59f08'),
              'CAL26_V1R47R1_QB_Two_Track_Artifact_Input_Contract_Repair_Read_Only.yml': (3, '5808c4956e6c02dc3e147b9eb1a303b05433100acdc00cfaec7383d37416de55'),
              'CAL26_V1R47_QB_Recency_Two_Track_Evidence_Bridge_Read_Only.yml': (3, 'a878cbbfbcacdd58a9e4d5f95063c47706fae76082427681112064b50502670e'),
              'CAL26_V1R48_FRESH_WORKFLOW.yml': (3, '32f35cf2dc869ff865929f103dc3f8ac8ce1bbe2e75eb2d565fb8adba16f14d7'),
              'CAL26_V1R49_QB_Empirical_Age_Survival_and_Recency_Continuity_Read_Only.yml': (3, '124c271244ddaf9203bea983f37bfc1ea627853c7cc4500ad58af54c4493acb3'),
              'CAL26_V1R50R1_QB_Week6_Recency_Source_SHA256_Pin_Repair_Read_Only.yml': (3, '77e23a8456e1cf627c1ba407dfe5315671f4dbd4d9aebf843cb2bb465478a2a3'),
              'CAL26_V1R50_QB_Week6_Recency_to_Next_Season_Chronological_Backtest_Read_Only.yml': (3, '7ea7d24ea4b880dbb348fe40e11e2006650280b27dfbd8d230af09debea9f401'),
              'CAL26_V1R51R1_QB_Roster_Economics_Git_Blob_Pin_Repair_Read_Only.yml': (3, 'b22ee05414830179db2f9ebd8cdc6f9f603d55ec12c85180f03724a8c2684c9f'),
              'CAL26_V1R52_LOG_Scoring_and_QB_Surplus_FV_Release_Bridge_Read_Only.yml': (3, '9dc56e852061e8de92b92ee6d0d056e2e099e2d80a14e0ff96baec70c6d02ece'),
              'CAL26_V1R53R1_FRESH_DOWNLOAD.yml': (3, '26569401ac2d5fb1bafd631756df4e69299ea4225b339d65a266acd524d46c0f'),
              'CAL26_V1R54_QB_Numerical_Surplus_FV_Shadow_and_Scoring_Transfer_Sensitivity_Read_Only.yml': (3, 'b05ca22c708456a15d4549dcb303ac65979e775c72b09393beb77852f50e3041'),
              'CAL26_V1R55_QB_Empirical_LOG_Conversion_and_Multi_Year_Surplus_Shadow_Read_Only.yml': (3, '8417790815c26329908a3e73b6ca19a16daa15859b9042c6c16502955ab548a5'),
              'CAL26_V1R56_FRESH_DOWNLOAD.yml': (3, '27786478b7084cb65484b7fdfc935201b34e2c0a50dad409aa476fb83deb8977'),
              'CAL26_V1R58.yml': (3, 'c0bf3f9d0ab154b1a7cffec0804e2a197236827f362f72d27896ea2f5b15dbd0'),
              'CAL26_V1R58R1.yml': (3, 'd993ed8deea519ae77877a33b725b0d9e6a6702d2affb998df066bc7fa790b4b'),
              'CAL26_V1R59_resend.yml': (3, 'a2f1109fe5e43fd202579caa47195366edfdbaf60e69da4623a6e9d6c12e724a'),
              'CAL26_V1R61.yml': (3, 'f9dc2b66cca40a7c3abe433dd7e20a6d4e3f9684e7609a747336acaf2e6f012d'),
              'CAL26_V1R62_fresh.yml': (3, '243a9210724e50eed04362c5f3e760297292410d69e7a5ee30eb945f771a839e'),
              'FA04R1.yml': (4, '62e8bda6836238fa664c6b98250327157579428f1d1f5c2d1b40de5ed1f8a941'),
              'FA04R2.yml': (4, '415d312358ee0516c5268a8c6794e5901f01774fd27603b671d355d5e9e40968'),
              'FA05R1.yml': (4, '7a53b363d4bf0f1464363659bd9665862591d7b1f9f78bc01a1e9ce9986ea175'),
              'FA06R1.yml': (4, '84912bcfe01b51af340f881cff9c9d373201412cf4d29026655e92dbc17d4470'),
          }
          LABELS = {3:'03-valuation-market',4:'04-team-free-agent'}
          
          
          def cmd(*parts):
              result = subprocess.run(parts, capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError(f'Git command failed: {parts!r}: {(result.stderr or result.stdout)[:1200]}')
              return result.stdout.strip()
          
          
          def sha(blob):
              return hashlib.sha256(blob).hexdigest()
          
          
          def jbytes(obj):
              return (json.dumps(obj, sort_keys=True, separators=(',',':'))+'\n').encode()
          
          
          def events(blob):
              doc=yaml.safe_load(blob.decode('utf-8-sig'))
              if not isinstance(doc,dict): return []
              value=doc.get('on',doc.get(True))  # PyYAML treats unquoted `on` as true
              if isinstance(value,dict): return sorted(map(str,value.keys()))
              if isinstance(value,list): return sorted(map(str,value))
              return []
          
          
          def main():
              assert MODE in ('preview','apply'), 'Unknown execution mode'
              assert os.getenv('GITHUB_REPOSITORY',REPO)==REPO, 'Wrong repository'
              assert ROOT.is_dir(), 'Not inside a GitHub workflow checkout'
              assert cmd('git','branch','--show-current')=='main', 'Must check out main'
              assert not cmd('git','status','--porcelain'), 'Initial checkout is dirty'
              assert len(TARGETS)==50, 'Candidate roster modified; refuse to run'
              assert all('Frozen_' not in n for n in TARGETS), 'Frozen workflow unexpectedly in candidate list'
              assert all(not n.startswith(('B','QF')) for n in TARGETS), 'Frozen B/QF study unexpectedly in candidate list'
              must_retain = ('CAL26_WR01_Weekly_Frozen_Role_V2_FV_Neutral_Auto_Update.yml',
                             'B51-v1r1-schedule-utility-v1-reusable-weekly-prospective-snapshot-freezer.yml',
                             'A-V2F01R1-Legacy-V1-Freeze-ReadOnly.yml',
                             'free-agent-utility-v1-refresh.yml',
                             'market-edge-v1-prospective-study.yml')
              assert all((ROOT / n).is_file() and n not in TARGETS for n in must_retain), 'Protected active study or weekly job missing'
              assert all(g in LABELS for g,_ in TARGETS.values()), 'Unexpected group'
              head=cmd('git','rev-parse','HEAD')
              assert not RECEIPT.exists(), 'This wave already has a receipt; do not repeat'
              records=[]
              for filename,(group,pinned_sha) in sorted(TARGETS.items()):
                  src=str(ROOT/filename)
                  dest=str(ARCHIVE/LABELS[group]/filename)
                  holds=[]
                  data=b''
                  if not (ROOT/filename).is_file(): holds.append('SOURCE_MISSING')
                  elif Path(dest).exists(): holds.append('DESTINATION_ALREADY_EXISTS')
                  else:
                      data=Path(src).read_bytes()
                      if sha(data)!=pinned_sha: holds.append('SOURCE_SHA_CHANGED_SINCE_WFC01')
                      try: ev=events(data)
                      except Exception as exc: ev=[];holds.append('YAML_NOT_PARSEABLE_'+type(exc).__name__)
                      if ev!=['workflow_dispatch']: holds.append('NOT_MANUAL_ONLY')
                      if b'contents: write' in data.lower() or b'permissions: write-all' in data.lower():
                          holds.append('WORKFLOW_HAS_WRITE_PERMISSION')
                  display_name = None
                  if data:
                      try:
                          parsed=yaml.safe_load(data.decode('utf-8-sig'))
                          display_name=parsed.get('name') if isinstance(parsed,dict) else None
                      except Exception:
                          pass
                  records.append({'file':filename,'source':src,'destination':dest,'group':group,
                                  'sha256':pinned_sha,'events':events(data) if data else [],
                                  'display_name':display_name,'holds':holds})
              # Identify THIS exact runner from GitHub's trusted default workflow ref,
              # not from guesses about uploaded filenames. Fail closed on any mismatch.
              tracked=[x for x in cmd('git','ls-files','-z').split('\0') if x]
              github_ref=os.environ.get('GITHUB_WORKFLOW_REF','')
              prefix=REPO+'/'
              assert github_ref.startswith(prefix) and '@' in github_ref[len(prefix):], 'GitHub workflow ref unavailable or wrong repository'
              self_path, self_git_ref=github_ref[len(prefix):].rsplit('@',1)
              assert self_git_ref=='refs/heads/main', 'Ref must be main'
              assert self_path.startswith('.github/workflows/') and self_path.endswith(('.yml','.yaml')), 'Workflow path outside active directory'
              assert self_path in tracked and Path(self_path).is_file(), 'GitHub workflow path not tracked on main'
              self_yaml=yaml.safe_load(Path(self_path).read_text(encoding='utf-8-sig'))
              assert isinstance(self_yaml,dict) and self_yaml.get('name')==EXPECTED_SELF_DISPLAY_NAME, 'Ref does not resolve to WFC05R3'
              assert 'WFC05R3' in str(self_yaml.get('run-name','')), 'Runner release identity does not match WFC05R3'
              # Exclude the previous fixed allowlist writers only after exact hash checks.
              # Any other file referencing a target remains a hold, including dynamic dispatchers.
              verified_prior=[]
              for path, expected_blob in PREVIOUS_ALLOWLIST_AUTHORS.items():
                  assert path in tracked and Path(path).is_file(), 'Prior audited workflow missing; stop'
                  assert cmd('git','hash-object','--',path)==expected_blob, 'Prior audited workflow altered; stop'
                  prior_yaml=yaml.safe_load(Path(path).read_text(encoding='utf-8-sig'))
                  assert isinstance(prior_yaml,dict) and events(Path(path).read_bytes())==['workflow_dispatch'], 'Prior allowlist workflow not manual-only'
                  verified_prior.append(path)
              excluded={r['source'] for r in records}|{self_path}|set(verified_prior)
              assert not is_exact_filename_reference(b"'A-FA04R1.yml'",b'FA04R1.yml'), 'False-positive boundary test failed'
              assert is_exact_filename_reference(b"'FA04R1.yml'",b'FA04R1.yml'), 'Actual reference boundary test failed' 
              scanned=0
              keys=[(r,r['source'].encode(),r['file'].encode()) for r in records]
              for path in tracked:
                  if path in excluded or path.startswith('.github/workflow-archive/'):
                      continue
                  try: raw=Path(path).read_bytes()
                  except OSError as exc:
                      raise AssertionError(f'Incomplete reference scan. Source {path}: {exc}')
                  scanned+=1
                  for r,full,base in keys:
                      if full in raw or is_exact_filename_reference(raw,base):
                          r['holds'].append('TRACKED_REFERENCE_FROM:'+path)
                      if (path.startswith('.github/workflows/')
                              and re.search(rb'(?m)^\s*workflow_run\s*:',raw)
                              and r['display_name']
                              and str(r['display_name']).encode() in raw):
                          r['holds'].append('WORKFLOW_RUN_NAME_REFERENCE_FROM:'+path)
              for r in records:
                  r['holds']=sorted(set(r['holds']))
                  r['status']='READY_FOR_OWNER_APPROVAL' if not r['holds'] else 'HOLD_UNTOUCHED'
              ready=[r for r in records if not r['holds']]
              held=[r for r in records if r['holds']]
              counts={label:sum(r['group']==n and not r['holds'] for r in records) for n,label in LABELS.items()}
              manifest={'schema':1,'tool':'WFC05R3','repo':REPO,'commit':head,
                        'candidate_roster_size':50,'ready_count':len(ready),'held_count':len(held),
                        'tracked_reference_sources_scanned':scanned,
                        'target_records':records,
                        'archive_root':str(ARCHIVE),'receipt':str(RECEIPT)}
              digest=sha(jbytes(manifest))
              OUT.mkdir(parents=True,exist_ok=True)
              (OUT/'WFC05R3-research-manifest.json').write_bytes(jbytes(manifest))
              report=[
                  '# WFC05R3 — Historical research workflow archival',
                  '',
                  '**Preview is read-only; no source workflow has been archived yet.**' if MODE=='preview' else '**Apply requested: approved ready targets only.**',
                  '',
                  f'- Mode: **{MODE}**',f'- Head commit: `{head}`',
                  f'- Approval manifest SHA256: `{digest}`',
                  f'- Explicit candidates: **{len(records)}**',
                  f'- Eligible for approval: **{len(ready)}**',
                  f'- Held, not moved: **{len(held)}**',
                  f'- Other tracked repo files searched for references: **{scanned}**',
                  '', '## Eligible by group', '',
              ]
              report += [f'- {LABELS[g]}: **{counts[LABELS[g]]}**' for g in [3,4]]
              report += ['', '## Target disposition', '',
                         '| Workflow | Group | Status | Hold reason |', '|---|---|---|---|']
              for r in records:
                  report.append(f"| `{r['file']}` | {r['group']:02d} | {r['status']} | {', '.join(r['holds']) or 'manual only, WFC01 SHA pinned, no tracked references'} |")
              report += ['', '## Safeguards', '',
                         '- Exact 50-name allowlist, SHA256 pinned to green WFC01 audit',
                         '- No schedules, workflow_run triggers, or automated events; manual dispatch only',
                         '- Exact filename references and workflow_run display-name dependencies trigger holds; misleading suffix matches excluded',
                         '- Current runner located by GitHub workflow ref; prior audit allowlist authors excluded only after exact blob hash checks',
                         '- Dynamic external callers cannot be proven absent',
                         '- Current CAL26 weekly refresh, A03 Stage S/freeze control, QF/B studies, active production releases and current waiver jobs are OUT OF SCOPE',
                         '- All archived source bytes are preserved via git mv in the repository, with receipts',
                         '- Apply needs approval of the exact preview SHA and digest plus the existing scoped PAT',
                         '- A modified file or changed repo commit prevents stale approval reuse',
                         '']
              (OUT/'WFC05R3-research-preview-report.md').write_text('\n'.join(report),encoding='utf8')
              with (OUT/'WFC05R3-research-review.csv').open('w',newline='',encoding='utf8') as f:
                  writer=csv.DictWriter(f,fieldnames=['file','group','status','holds','sha256','source','destination'])
                  writer.writeheader()
                  writer.writerows({k:(';'.join(v) if isinstance(v,list) else v) for k,v in r.items() if k in writer.fieldnames} for r in records)
              summary=os.getenv('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary,'a') as f: f.write('\n'.join(report[:20])+'\n\nSee artifact for full 50-file review roster.\n')
              print('\n'.join(report[:20]))
              if MODE=='preview':
                  print('PREVIEW GREEN — no workflow file touched')
                  return
              assert os.getenv('WFC05_APPROVAL','')==APPROVAL, 'Approval phrase missing/mismatched'
              assert os.getenv('WFC05_APPROVED_SHA','')==head, 'Main SHA differs from reviewed preview; rerun preview'
              assert os.getenv('WFC05_APPROVED_DIGEST','')==digest, 'Candidate manifest digest differs; rerun preview'
              assert os.getenv('WFC05_TOKEN_PRESENT','false')=='true', 'Workflow-writing secret missing'
              assert len(ready)>=25, f'Only {len(ready)} passed safety checks; abort bulk apply'
              for r in ready:
                  dest=Path(r['destination']);dest.parent.mkdir(parents=True,exist_ok=True)
                  cmd('git','mv','--',r['source'],r['destination'])
                  assert not Path(r['source']).exists(), 'Original workflow still exists after git mv'
                  assert sha(dest.read_bytes())==r['sha256'], 'Archived content unexpectedly changed'
              RECEIPT.parent.mkdir(parents=True,exist_ok=True)
              receipt={'schema':1,'operation':'GIT_MOVE_BYTE_IDENTICAL_NO_DELETE',
                       'head_before':head,'manifest_sha256':digest,
                       'archived_files':ready,'held_files':held,
                       'archived_at_utc':dt.datetime.now(dt.timezone.utc).isoformat()}
              RECEIPT.write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf8')
              cmd('git','add','--',str(RECEIPT))
              actual=set(cmd('git','diff','--cached','--name-only','--no-renames').splitlines())
              expected={str(RECEIPT)} | {r['source'] for r in ready}|{r['destination'] for r in ready}
              assert actual==expected, f'Unexpected staged paths: {sorted(actual.symmetric_difference(expected))}'
              cmd('git','diff','--cached','--check')
              cmd('git','config','user.name','github-actions[bot]')
              cmd('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              cmd('git','commit','-m',f'chore: archive {len(ready)} reviewed, superseded manual workflows')
              cmd('git','push','origin','HEAD:main')
              print(f'APPLY PASS — {len(ready)} byte-identical workflow files archived; {len(held)} held; production files untouched')
          
          
          if __name__=='__main__': main()

          PY_WFC05_R1
      - name: Preview / apply approved historical research archival plan
        shell: bash
        env:
          WFC05_MODE: ${{ inputs.mode }}
          WFC05_APPROVED_SHA: ${{ inputs.approved_commit_sha }}
          WFC05_APPROVED_DIGEST: ${{ inputs.approved_manifest_sha256 }}
          WFC05_APPROVAL: ${{ inputs.approval_phrase }}
          WFC05_TOKEN_PRESENT: ${{ inputs.mode == 'apply' && secrets.LOG_WORKFLOW_WRITE_TOKEN != '' }}
          WFC05_OUTPUT: ${{ runner.temp }}/wfc05-results
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wfc05_engine.py"
      - name: Publish review manifest and archive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-WFC05R3-Research-Archive-Preview-Apply
          path: ${{ runner.temp }}/wfc05-results/
          if-no-files-found: warn
          retention-days: 60
