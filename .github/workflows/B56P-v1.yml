name: B56P Exact Rookie Slot V2 - Read-Only Contract Preview V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b56p-read-only-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with historical freeze commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build full outcome-blind V2 protocol preview
        shell: bash
        env:
          B56P_OUTPUT: b56p-output
        run: |
          set -euo pipefail
          python3 - <<'PY_B56P'
          #!/usr/bin/env python3
          """Read-only B56 V2 full protocol preview. B52/B53 and B55 metadata only.
          Never loads the historical occurrence archive, outcomes, votes, market or analytics.
          """
          import copy
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          
          B52 = Path('research/exact-rookie-slot-curve-v1/phase0_preregistration.json')
          B53 = Path('research/exact-rookie-slot-curve-v1/phase0a_precision_contract.json')
          B55 = Path('research/exact-rookie-slot-curve-v1/preopening_governance_closeout_manifest_v1.json')
          B55_JSON = Path('research/exact-rookie-slot-curve-v1/preopening_governance_closeout_v1.json')
          B52_SHA = '0f2d49eeac7c59027073924a03095eca349f2737eb8229202e52d8a06953fc15'
          B53_SHA = '61314b546bee65daae03ac4d09a6c0deb1d7b29eebbf440402d2548b199cd9bc'
          B52_BLOB = 'dd1eae5007115a35c9a19bf5669b2ba5809f45b7'
          B53_BLOB = 'fd5f1e92ce404b864e00d4279b49d942dcc9c822'
          B55_CLOSEOUT_COMMIT = 'a3aa6e3ade98fbb83f13645259fc568f362166b9'
          B53_COMMIT = 'b72b5265e7f2129b28152effac512876e69a0d29'
          B52_COMMIT = '4b58551b4f4813b59ef558a27c8fa1452a0bb43c'
          B55_WORKFLOW_SHA = '20aeee5d9ccc084065c1c5c809be8e70d78c9fa6ed11c168f598ec74ca17fe34'
          V7_PATH = Path('research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json')
          V7_BLOB = '42e4fa45d3a0715be281dd3cdf90ba13d1b418ff'
          
          
          def need(ok, code):
              if not ok:
                  raise RuntimeError(code)
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def git(*args):
              return subprocess.check_output(('git', *args), text=True, stderr=subprocess.DEVNULL).strip()
          
          
          def lineage_check():
              need(git('status', '--porcelain') == '', 'WORKTREE_NOT_CLEAN')
              head = git('rev-parse', 'HEAD')
              for c in (B52_COMMIT, B53_COMMIT, B55_CLOSEOUT_COMMIT):
                  need(subprocess.run(('git', 'merge-base', '--is-ancestor', c, head), stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0, 'LINEAGE_NOT_ANCESTOR')
              for path, blob in ((B52, B52_BLOB), (B53, B53_BLOB), (V7_PATH, V7_BLOB)):
                  need(git('rev-parse', f'HEAD:{path.as_posix()}') == blob, 'FROZEN_BLOB_DRIFT')
              for path, digest in ((B52, B52_SHA), (B53, B53_SHA)):
                  need(sha(path.read_bytes()) == digest, 'FROZEN_SHA_DRIFT')
              man = json.loads(B55.read_text())
              rul = json.loads(B55_JSON.read_text())
              need(man['decision'] == 'STOP_EXACT_SLOT_V1_RETAIN_V10_OR_PREREGISTER_SEPARATE_LOWER_RESOLUTION_STUDY', 'B55_DECISION_DRIFT')
              need(man['workflow_sha256'] == B55_WORKFLOW_SHA, 'B55_WORKFLOW_DRIFT')
              need(sha(B55_JSON.read_bytes()) == man['closeout_json_sha256'], 'B55_RECORD_DRIFT')
              need(rul['subdecision'] == 'SCIENTIFIC_STOP_BEFORE_OCCURRENCE_READ', 'B55_SUBDECISION_DRIFT')
              for flag in ('occurrence_rows_read', 'h3_o2_read', 'market_read', 'holdout_2024_read', 'production_change_authorized'):
                  need(man[flag] is False, 'B55_MANIFEST_FIREWALL_DRIFT')
              need(rul['phase0a_occurrence_rows_read'] is False and rul['production_change_authorized'] is False, 'B55_CLOSURE_FIREWALL_DRIFT')
              v7 = json.loads(V7_PATH.read_text())
              need(v7['source_population']['provider'] == 'MyFantasyLeague', 'V7_PROVIDER_DRIFT')
              need(v7['source_population']['format'] == '12-team Superflex/2QB dynasty rookie drafts', 'V7_FORMAT_DRIFT')
              return head
          
          
          def build(b52, b53):
              original_gates = copy.deepcopy(b52['phase0_source_support_gates'])
              cap = original_gates['concentration'].pop('provider_or_format_cluster_share_max')
              exception = original_gates['concentration'].pop('provider_or_format_exception')
              need(cap == 0.6 and 'already-frozen source-weighting contract' in exception, 'B52_CAP_DRIFT')
              original_gates['concentration']['v2_provider_format_scope_replacement'] = {
                  'type': 'EXPLICIT_COHORT_SCOPE_NOT_EXCEPTION_NOT_B52_PASS',
                  'platform': 'MyFantasyLeague',
                  'league_size': 12,
                  'draft_type': '12-team Superflex/2QB dynasty rookie drafts',
                  'provider_share_by_design': 1.0,
                  'cohort_declared_format_not_per_row_observed': True,
                  'provider_and_format_descriptive_only': True,
                  'replaces_only_b52_provider_or_format_cap_and_exception': True
              }
              # Structural proof: removing the marked replacement recovers B52 identically
              base_check = copy.deepcopy(original_gates)
              del base_check['concentration']['v2_provider_format_scope_replacement']
              base_check['concentration']['provider_or_format_cluster_share_max'] = cap
              base_check['concentration']['provider_or_format_exception'] = exception
              need(base_check == b52['phase0_source_support_gates'], 'SOURCE_GATES_DEEP_EQUAL_FAIL')
          
              # B52 source definitions are copied as objects, not rewritten or approximated.
              exact_fields = [
                  'scope', 'axis_and_estimand', 'primary_architecture', 'fallback_policy',
                  'phase0a_mandatory_diagnostics', 'phase0a_go_stop',
                  'phase1_estimation_and_validation', 'r4_r5_boundary', 'forward_holdout',
                  'market_firewall', 'phase_sequence', 'forbidden',
              ]
              v1_exact = {k:copy.deepcopy(b52[k]) for k in exact_fields}
              need(all(v1_exact[k] == b52[k] for k in exact_fields), 'B52_VERBATIM_COPY_DRIFT')
          
              return {
                  'schema_version': 1,
                  'study_id':'exact-rookie-slot-curve-v2',
                  'stage':'phase0_design_preview_not_frozen',
                  'status':'UNFROZEN_REQUIRES_CLAUDE_CHATGPT_APPROVAL',
                  'is_a_new_study_not_a_B52_amendment':True,
                  'scientific_design_change_authorized_after_freeze':False,
                  'production_change_authorized':False,
                  'source_archive_download_authorized':False,
                  'source_archive_open_authorized':False,
                  'historical_outcomes_market_voting_2024_holdout_read_authorized':False,
                  'b55_v1_closeout':'SCIENTIFIC_STOP_BEFORE_OCCURRENCE_READ',
                  'source_lineage':{
                      'b52_prereg_sha256':B52_SHA,'b53_precision_sha256':B53_SHA,
                      'b55_closeout_commit':B55_CLOSEOUT_COMMIT,
                      'producer_artifact_id':10990665019,
                      'producer_artifact_name':'v8-p1-1-position-retention-hardening',
                      'producer_archive_github_digest_unrecomputed':'sha256:6d480ea3fbb5db254e3271b9c400d62e136bb34877aff6b181ca5ed7252247b0',
                      'archive_expires_utc':'2026-10-28T18:42:26Z',
                      'source_producer_2018_2023_rows_R1_R6':24970,
                  },
                  'information_state_at_freeze':{
                      'status':'AGGREGATES_KNOWN_BEFORE_PREVIEW_TO_PRESERVE_IN_FREEZE',
                      'known_pre_outcome_aggregate_rows_before_position_retention':24988,
                      'known_pre_outcome_aggregate_rows_after_retention_R1_R6':24970,
                      'known_frozen_year_cell_league_groups':6247,
                      'known_cells_in_original_source_R1_R6':18,
                      '2018_2023_development_years':list(range(2018,2024)),
                      'per_exact_slot_counts_observed_by_this_study':False,
                      'source_archive_or_any_occurrence_rows_opened':False,
                      'outcomes_2024_ktc_market_votes_analytics_opened':False,
                      'league_cap_may_bind':'Reviewer used prior producer aggregate (6247 groups) as non-row heuristic; source concentration never computed; original numeric 0.02/0.10 caps unchanged.',
                      'threshold_provenance':'Numeric source/precision thresholds retained from B52/B53; new scope/definitions and product rules selected from pre-outcome architecture information, after aggregate provenance counts were known; no diagnostic tuning.',
                  },
                  'source_cohort_and_runtime_scope':{
                      'historical_population':'MyFantasyLeague 12-team Superflex/2QB dynasty rookie drafts, 2018-2023',
                      'external_validity':'NO_GENERALIZATION_TO_SLEEPER_FLEAFLICKER_OTHER_FORMATS_OR_LEAGUE_SIZES',
                      'league_size_known_required':True,'platform_matches_source_cohort_required':True,
                      'verified_scoring_and_TEP_compatibility_required':'TO_BE_DEFINED_FROM_FROZEN_SOURCE_CONTRACT_BEFORE_DEPLOYMENT',
                      'known_exact_overall_slot_1_to_48_required':True,
                      'round_dot_slot_translation':'ONLY_WITH_ACTUAL_KNOWN_DRAFT_SIZE_AND_ORDER_NEVER_ASSUME_12_TEAMS',
                      'out_of_cohort':'V10_GENERIC_BUCKETS',
                  },
                  'phase0_source_support_gates':original_gates,
                  'b52_verbatim_scientific_definitions':v1_exact,
                  'b53_verbatim_precision_contract':{
                      'precision_model':copy.deepcopy(b53['precision_model']),
                      'precision_pass_gates':copy.deepcopy(b53['precision_pass_gates']),
                      'support_summary_contract':copy.deepcopy(b53['support_summary_contract']),
                      'axis':copy.deepcopy(b53['axis']),
                      'interpretation':copy.deepcopy(b53['interpretation']),
                      'v10_reference_uncertainty':copy.deepcopy(b53['v10_reference_uncertainty'])
                  },
                  'v2_interpretations_ex_ante':{
                      'phase0_resolution_policy':'NO_SUBSET_FALLBACK_43_OF_48_DIRECT_TIER',
                      'phase0_if_any_mandatory_source_or_precision_gate_fails':'SCIENTIFIC_STOP_RETAIN_V10',
                      'later_R1_only_research':'REQUIRES_INDEPENDENT_NEW_PREREGISTRATION_BEFORE_ANY_OUTCOME_OPENING; CANNOT_CHANGE_V2_AFTER_SOURCE_DIAGNOSTICS',
                      'phase1_round_reversions':'ONLY_B52_LITERAL_PHASE1_PARTIAL_ADOPTION_RULE_AFTER_COMPLETE_PHASE0_GO',
                      'weights':'w_i=development_fit_weight_v8; W(y,c)=sum of w_i in retained year/cell',
                      'estimand_rookie_mass':'m(s,y,k)=(1/6)*sum_{i in slot s, year y, rookie k}(w_i/W(y,c))',
                      'kish_primary':'N_i(s)=(sum_(y,k) m)^2/sum_(y,k) m^2',
                      'equal_class_mass':'m2(s,y,k)=(1/6)*sum_(i in s,y,k)w_i / sum_(i in s,y)w_i',
                      'kish_secondary':'N_ii(s)=(sum_(y,k) m2)^2/sum_(y,k) m2^2',
                      'kish_support_floor':'min(N_i,N_ii)>=10, except slots 1-4 >=6; no positive independence credit',
                      'per_year_kish':'n_y(s)=(sum_k rookie_mass_(s,y,k))^2/sum_k rookie_mass_(s,y,k)^2',
                      'literal_0_35_class_share':'n_y(s)/sum_{y in 2018..2023}n_y(s) <=0.35 for all six classes and all 48 slots',
                      'inverse_variance_share':'DIAGNOSTIC_ONLY',
                      'empty_slot_year':'GLOBAL_SOURCE_STOP_AND_ZERO_NEFF_NOT_A_DIVISION_ERROR',
                      'invalid_weight':'OPERATIONAL_BLOCK',
                      'b53_per_year_kish':'YEAR_SCALE_INVARIANT_ORIGINAL_ROOKIE_CLUSTER_MASSES_NO_REIMPLEMENTATION',
                      'persistent_league_identity':'(source_provider, raw league_id); do not key on source_league_key because producer embeds draft_year into it',
                      'league_share_test':'max(unweighted_count_share, V10_estimand_weight_mass_share) <=0.02 all slots',
                      'top_five_league_share':'max(unweighted_top5_share, weighted_top5_share) <=0.10 all slots',
                      'league_year_source_league_key':'DIAGNOSTIC_ONLY_NOT_GATING',
                      'source_format':'DECLARED_COHORT_NOT_PER_ROW_OBSERVED',
                  },
                  'phase0a_outcome_blind_source_projection_contract':{
                      'artifact_format':'JSONL_NOT_CSV',
                      'total_retained_rows_R1_R6_must_equal':24970,
                      'R1_R4_count':'RECORDED_AT_FIRST_AUTHORIZED_READ_NOT_PRE_FROZEN',
                      'year_must_be_one_of':[2018,2019,2020,2021,2022,2023],
                      'source_schema_gate':'REQUIRE_EXACT_HASH_FROZEN_PRODUCER_DERIVED_KEY_SET_BEFORE_ANY_ROW_OPENING',
                      'jsonl_parsing':'PARSER_MUST_READ_EACH_WHOLE_JSON_OBJECT_THEN_VERIFY_EXACT_KEYSET_THEN_PROJECT_ONLY_SAFE_FIELDS; NO_ROW_VALUES_LOGGED',
                      'row_value_forbidden_fields':'NO_OUTCOME_H3_O2_MARKET_VOTES_KTC_2024_OR_RAW_PII_TO_OUTPUT',
                      'safe_projection_fields':['draft_year','round','overall_slot','cell','stable_player_key','source_provider','league_id','development_fit_weight_v8'],
                      'source_league_key_status':'READ_ONLY_AS_PRODUCER_LINEAGE_IF_PRESENT; EMBEDS_YEAR_AND_UNSUITABLE_FOR_PERSISTENT_LEAGUE_CONCENTRATION',
                      'source_year_outside_2018_2023':'OPERATIONAL_BLOCK',
                      'inscope_if':'round in 1..4 OR overall_slot in 1..48',
                      'conflict_union_scope':'round5-6 with in-scope slot and round1-4 with out-of-scope slot are included as mapping conflicts',
                      'bad_year_valid_but_invalid_round_slot':'COUNT_IN_OVERALL_AND_YEAR_BAD_MAPPING_DENOMINATORS_NOT_OPERATIONAL_BLOCK',
                      'unscopable_year_valid_but_invalid_round_slot':'COUNT_AS_UNMAPPABLE_IN_OVERALL_AND_YEAR_MAPPING_BAD_DENOMINATORS',
                      'per_round_mapping_denominators':'VALID_IDENTIFIABLE_IN_SCOPE_ROUNDS_ONLY; INVALID_ROUND_COUNTS_IN_OVERALL_AND_CLASS',
                      'out_of_scope_R5_R6_clean_rows':'COUNT_SEPARATELY_NEVER_TREAT_AS_MISSING_R1_R4',
                      'deduplication_check':'SAME_(SOURCE_PROVIDER,RAW_LEAGUE_ID,DRAFT_YEAR,OVERALL_SLOT)_MULTIPLE_ROWS_A_MAPPING_CONFLICT',
                      'independent_mapping_checks':['round_vs_overall_slot','stored_cell_vs_slot_implied_cell','duplicate_slot_same_league_and_class'],
                      'derived_within_round_pick':'NOT_INDEPENDENT_CHECK_AND_NEVER_REPORTED_AS_SUCH',
                      'required_future_ancestor_freezes':['PRODUCER_DERIVED_SAFE_FIELD_PROJECTOR_AND_FULL_SOURCE_KEY_SET','2024_HOLDOUT_SOURCE_AND_WEIGHT_CONTRACT','SOURCE_ARTIFACT_CUSTODY_IF_REQUESTED'],
                      'B56_cannot_download_or_parse_source':True,
                  },
                  'forward_holdout_v2':{
                      'purpose':'GROSS_HARM_GUARD_AND_DIRECTION_CHECK_NOT_CONFIRMATORY_VALIDATION',
                      'b52_verbatim_holdout_H1_still_necessary':'weighted MSE(V2) < weighted MSE(V10) on same eligible 2024 R1-R4 source and frozen weights; tie FAIL',
                      'h2_added_guard':'one-sided 90% upper confidence bound for (MSE_V2-MSE_V10)/MSE_V10 <0.02',
                      'gross_harm_margin_relative_to_V10_MSE':0.02,
                      'uncertainty_method':'BCa rookie-cluster bootstrap; resample stable 2024 rookie identity clusters with all linked occurrences and frozen weights',
                      'bootstrap_replicates':10000,
                      'bootstrap_seed':20261009,
                      'minimum_nondegenerate_bootstrap_replicates':9900,
                      'zero_denominator_or_nonfinite':'INCONCLUSIVE_RETAIN_V10',
                      'min_distinct_rookie_clusters':80,
                      'min_rookie_cluster_kish_neff':60,
                      'floor_basis':'Conservative non-outcome planning floor pending a separately verified non-outcome sensitivity analysis; cannot claim meaningful power solely from this floor.',
                      'source_2024_preoutcome_contract':'MUST_BE_SEPARATELY_FROZEN_BEFORE_ANY_H3_OUTCOME_OPENING',
                      'read_guard':'2027-01-12T00:00:00Z plus completed 2026 Week18 and source maturity',
                      'aggregate_primary_metric':'occurrence-weighted paired MSE over 2024 R1-R4; dominated by premium early slots',
                      'round_stratified_results':'REPORT_ONLY_NOT_SELECTION_OR_GATE',
                      'fail_if':'H1_OR_H2_FAIL_WITH_INFORMATION_FLOORS_MET',
                      'inconclusive_if':'FLOORS_NOT_MET_OR_INTERVAL_UNSTABLE',
                      'only_one_look':'NO_SEPARATE_2025_RETRY_OR_POOLED_SECOND_LOOK_AFTER_2024_RESULTS',
                      'holdout_may_not_rescue_phase0_or_development_failure':True,
                      'claim_limit':'Positive direction and absence of gross harm under this cohort/single class, not evidence of superiority or transport',
                  },
                  'product_materiality':'SEPARATE_RULE_NOT_IN_SCIENTIFIC_PREREG',
                  'product_priority_rule_to_commit_before_analytics':'B56_product_priority_rule_v1.md',
                  'custody_outside_B56':{
                      'decision_due_utc':'2026-10-20T23:59:59Z','artifact_expires_utc':'2026-10-28T18:42:26Z',
                      'byte_copy_requires_separate_review':True,'no_archive_read_or_copy_now':True,
                      'storage':'WRITE_ONCE_ACCESS_CONTROLLED_OUTSIDE_TRACKED_REPO_AND_OUTSIDE_EXPIRING_ACTIONS_ARTIFACT_IF_LONG_TERM',
                      'byte_hash_verification':'GITHUB_DIGEST_EQUALS_SHA256SUM_EQUALS_PYTHON_HASHLIB',
                      'prohibited':['unzip','unzip -l','zip -T','JSONL parse','raw record print','tracked repo byte commit'],
                  },
                  'development_not_independent_of_v10':'Both candidates use 2018-2023 historical development classes; even nested LOYO refits are not a prospective independently sourced study.',
                  'unresolved_before_B56_freeze':['REVIEW_HOLDOUT_INFORMATION_FLOORS_AND_POWER_STRESS_SIMULATION','REVIEW_FULL_SOURCE_FIELD_SET_AND_2024_SOURCE_CONTRACT_STAGING','REVIEW_PRODUCT_RULE_SEPARATELY','CLAUDE_AND_CHATGPT_APPROVAL_OF_FINAL_FULL_RENDERED_JSON'],
              }
          
          
          def main():
              head = lineage_check()
              b52 = json.loads(B52.read_text())
              b53 = json.loads(B53.read_text())
              out = Path(os.environ.get('B56P_OUTPUT', 'b56p-output'))
              out.mkdir(parents=True, exist_ok=True)
              prereg = build(b52,b53)
              # Assert every unchanged inherited contract block really is deep-equal.
              for k,v in prereg['b52_verbatim_scientific_definitions'].items():
                  need(v == b52[k], 'B52_LITERAL_CONTRACT_COPY_FAIL')
              for k,v in prereg['b53_verbatim_precision_contract'].items():
                  need(v == b53[k], 'B53_LITERAL_CONTRACT_COPY_FAIL')
              data = (json.dumps(prereg,indent=2,sort_keys=True,ensure_ascii=True)+'\n').encode()
              (out/'B56_V2_full_scientific_preregistration_UNFROZEN.json').write_bytes(data)
              man={'schema_version':1, 'stage':'B56P_READ_ONLY_PREVIEW', 'repository_head':head,
                  'prereg_sha256':sha(data), 'b52_sha256_verified':B52_SHA,
                  'b53_sha256_verified':B53_SHA,'b55_closeout_ancestor':B55_CLOSEOUT_COMMIT,
                  'source_archive_downloaded':False,'occurrence_rows_read':False,
                  'outcomes_or_holdout_read':False,'market_or_product_analytics_read':False,
                  'production_change_authorized':False,'B56_freeze_authorized':False}
              (out/'B56P_preview_manifest.json').write_text(json.dumps(man,indent=2,sort_keys=True)+'\n')
              (out/'B56P_summary.md').write_text('# B56P — Unfrozen protocol preview\n\n'
                  'Verified B52/B53 scientific definitions were copied by deep equality.\n\n'
                  f'- HEAD: `{head}`\n- Full preview SHA-256: `{sha(data)}`\n'
                  '- Status: **REVIEW_REQUIRED / NOT FROZEN**\n'
                  '- No historical source artifact, outcomes, market, 2024 holdout, or product analytics opened.\n'
                  '- B56 freeze not authorized by this read-only preview.\n')
              print('B56P_PREVIEW_GENERATED_VERIFIED_NO_DATA_READ',sha(data))
          
          
          if __name__ == '__main__':
              main()
          PY_B56P
      - name: Publish read-only review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B56P-v1-unfrozen-protocol-preview
          path: b56p-output/
          if-no-files-found: error
          retention-days: 7
