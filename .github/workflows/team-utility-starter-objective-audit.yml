name: Team Utility Starter Objective Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Self-test audit
        run: python3 research/team-utility/team_utility_starter_objective_audit.py --selftest

      - name: Run starter-objective audit
        run: python3 research/team-utility/team_utility_starter_objective_audit.py

      - name: Show report
        run: cat research/team-utility/team_utility_starter_objective_audit.md

      - name: Commit audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/team-utility/team_utility_starter_objective_audit.json \
            research/team-utility/team_utility_starter_objective_audit.md

          if git diff --cached --quiet; then
            echo "No audit-result changes to commit."
            exit 0
          fi

          git commit -m "Audit Team Utility starter objective"
          git push
