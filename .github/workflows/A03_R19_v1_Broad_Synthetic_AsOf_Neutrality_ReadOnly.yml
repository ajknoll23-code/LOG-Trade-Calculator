name: A03 R19 - Stage S Broad Synthetic As Of Neutrality Read Only

# Research only. Green means a pinned synthetic shadow matrix, NOT a production fix.
# Production valuation-date provenance, stale trade state and deployed integration remain HOLD.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a03-r19-broad-read-only
  cancel-in-progress: false

jobs:
  synthetic-asof-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout frozen R16/R18 pinned engine without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: 8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6
          persist-credentials: false
          fetch-depth: 1

      - name: Guard exact engine SHA and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6'
          printf '%s  %s\n' 'af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78' index.html | sha256sum --check --status
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Stage embedded verifier into ephemeral runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a03_r19_broad_asof.js" <<'A03R19SCRIPT'
          #!/usr/bin/env node
          'use strict';
          /* A03 R19 v1 — strictly read-only broad synthetic age-clock matrix.
           * Actual checkout index.html is pinned. Two in-memory call-site rewrites only.
           * No real-player FV computations, network, pricing authorization, or production as-of selection.
           * Acceptance means synthetic functional design only; deployed integration remains HOLD.
           */
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const ENGINE_SHA='af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78';
          const COMMIT='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6';
          const argv=process.argv.slice(2);
          if(argv.length!==2||argv[0]!=='--engine')throw Error('USAGE: --engine index.html');
          const html=fs.readFileSync(argv[1],'utf8');
          if(sha(html)!==ENGINE_SHA)throw Error('HOLD_PINNED_ENGINE_SHA_DRIFT');
          const head='<script>\n/* ---------- Value engine ---------- */';
          const tail="document.getElementById('resetBtn').addEventListener('click', clearCalculator);";
          const a=html.indexOf(head),b=html.indexOf(tail,a);
          if(a<0||b<=a||html.indexOf(head,a+1)!==-1)throw Error('HOLD_VALUE_ENGINE_BOUNDARY');
          const source=html.slice(a+'<script>\n'.length,b);
          const callsites=[
           ['const fractionalAge = fractionalAgeFromBirthDate(birthDate, age);',
            'const fractionalAge = fractionalAgeFromBirthDate(birthDate, age, A03R19_ASOF);'],
           ['const precise = fractionalAgeFromBirthDate(dob, age);',
            'const precise = fractionalAgeFromBirthDate(dob, age, A03R19_ASOF);']
          ];
          let shadow=source;
          for(const [before,after] of callsites){
           const i=shadow.indexOf(before);
           if(i<0||shadow.indexOf(before,i+1)!==-1)throw Error('HOLD_NONUNIQUE_REWRITE_ANCHOR');
           shadow=shadow.slice(0,i)+after+shadow.slice(i+before.length);
          }
          for(const [before,after] of callsites)if(shadow.includes(before)||!shadow.includes(after))throw Error('HOLD_REWRITE_INVALID');
          for(const fn of ['fractionalAgeFromBirthDate','effectiveAgeMultiplier','playerValue','playerValueByKey','addPlayerAsset','displayPlayerAge'])
           if(!source.includes('function '+fn+'('))throw Error('HOLD_FUNCTION_NOT_FOUND:'+fn);
          function validAsOf(v){
           if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))throw Error('HOLD_ASOF_REQUIRED');
           const d=new Date(v+'T00:00:00Z');
           if(!Number.isFinite(d.getTime())||d.toISOString().slice(0,10)!==v)throw Error('HOLD_ASOF_REQUIRED');
           return v;
          }
          function frozenDate(v){const ms=Date.parse(v);if(!Number.isFinite(ms))throw Error('HOLD_BAD_CLOCK');
           return class FrozenDate extends Date{constructor(...x){super(...(x.length?x:[ms]));}static now(){return ms}};
          }
          const net={fetch:0,xhr:0};
          function rejectFetch(){net.fetch++;throw Error('HOLD_FETCH_ATTEMPT');}
          class RejectXHR{constructor(){net.xhr++;throw Error('HOLD_XHR_ATTEMPT');}}
          const silent={log(){},warn(){},error(){}};
          function evaluate(clock,asOf=null){
           if(asOf!==null)validAsOf(asOf);
           const body=(asOf!==null?'const A03R19_ASOF='+JSON.stringify(asOf)+';\n':'')+
             (asOf!==null?shadow:source)+
             '\nrender = function R19_NO_DOM(){};\n'+
             'return {playerValue,playerValueByKey,addPlayerAsset,displayPlayerAge,normalizeName,PLAYER_DB,RB_BIRTH_DATE_DATA,PROD_MULT,state};';
           return new Function('Date','console','fetch','XMLHttpRequest','document','window','localStorage',body)(
            frozenDate(clock),silent,rejectFetch,RejectXHR,undefined,undefined,undefined);
          }
          const clocks=['2026-10-14T19:00:00Z','2026-12-14T19:00:00Z','2028-03-01T19:00:00Z','2031-06-01T19:00:00Z'];
          const asOfs=['2026-10-14','2026-12-14','2028-03-01'];
          // All generated identities are fake; no real player data is looked up for valuation.
          const name='a03 r19 totally synthetic never player 9981224';
          const wr='a03 r19 totally synthetic wr 9981224';
          const undated='a03 r19 totally synthetic undated rb 9981224';
          const DOBs=['1988-02-28','1992-02-29','1995-07-25','1999-12-31','2000-03-01','2001-10-14','2002-07-14','2004-11-30','2006-01-01'];
          const roles=['Elite','Every-Down','Starter','Depth','Speculative'];
          const production=[0.15,0.151,0.3,0.65,0.7,1.4];
          const fixtures=DOBs.flatMap(dob=>roles.flatMap(role=>production.map(P=>({dob,role,P}))));
          const fixtureCount=fixtures.length;
          const guards=[];
          function guard(id,x){guards.push({id,pass:!!x});if(!x)throw Error('HOLD_R19_GUARD:'+id);}
          function initialAge(dob){const yr=Number(dob.slice(0,4));return 2026-yr-(dob.slice(5)>'10-14'?1:0);}
          function matrix(clock,asOf){
           const X=evaluate(clock,asOf),key=X.normalizeName(name),kw=X.normalizeName(wr),ku=X.normalizeName(undated);
           if([key,kw,ku].some(k=>Object.prototype.hasOwnProperty.call(X.PLAYER_DB,k)||
             Object.prototype.hasOwnProperty.call(X.PROD_MULT,k)||Object.prototype.hasOwnProperty.call(X.RB_BIRTH_DATE_DATA,k)))throw Error('HOLD_SYNTHETIC_ID_COLLISION');
           const out=[];
           for(const item of fixtures){
            const age=initialAge(item.dob);
            X.PLAYER_DB[key]={pos:'RB',age,role:item.role,birth_date:item.dob,team:'SYNTHETIC'};
            X.RB_BIRTH_DATE_DATA[key]=item.dob;
            X.PROD_MULT[key]=item.P;
            const fv=X.playerValue('RB',age,item.role,name);
            const lookup=X.playerValueByKey(key);
            const display=X.displayPlayerAge('RB',age,name);
            if(!Number.isFinite(fv)||fv<0||lookup!==fv||!/^[0-9]+\.[0-9]$/.test(display))throw Error('HOLD_R19_INVALID_ROW');
            out.push([item.dob,item.role,item.P,fv,display]);
           }
           X.PROD_MULT[kw]=0.7;X.PROD_MULT[ku]=0.7;
           const wrValue=X.playerValue('WR',26,'Starter',wr),undatedValue=X.playerValue('RB',26,'Starter',undated);
           return {as_of:asOf||null,clock,hash:sha(JSON.stringify(out)),rows:out,
            wr_control:wrValue,undated_rb_control:undatedValue};
          }
          const reference={},comparisons=[],original={};
          for(const asOf of asOfs){
           const matched=clocks.find(x=>x.slice(0,10)===asOf);
           if(!matched)throw Error('HOLD_MATCHED_CLOCK_NOT_DEFINED');
           const legacy=matrix(matched,null),corrected=matrix(matched,asOf);
           guard('matched_clock_full_matrix_neutral_'+asOf,legacy.hash===corrected.hash);
           reference[asOf]=corrected;
           original[asOf]=legacy;
           const sibling=[];
           for(const clock of clocks){
            const x=clock===matched?corrected:matrix(clock,asOf);
            sibling.push(x);
           }
           guard('host_clock_invariant_full_matrix_'+asOf,sibling.every(x=>x.hash===corrected.hash));
           guard('controls_invariant_full_matrix_'+asOf,sibling.every(x=>x.wr_control===corrected.wr_control&&x.undated_rb_control===corrected.undated_rb_control));
           comparisons.push({as_of:asOf,canonical_digest:corrected.hash,comparisons:sibling.length,
            across_clock_mismatches:sibling.filter(x=>x.hash!==corrected.hash).length,
            matched_legacy_digest:legacy.hash,full_grid_neutral_at_matched_clock:legacy.hash===corrected.hash});
          }
          // Sensitivity of the existing path to host-clock movement is a measured negative control.
          const oldDates=[matrix(clocks[0],null),matrix(clocks[1],null),matrix(clocks[3],null)];
          let originalSensitive=0;
          for(let i=0;i<fixtureCount;i++)if(new Set(oldDates.map(x=>JSON.stringify(x.rows[i].slice(3)))).size>1)originalSensitive++;
          guard('baseline_clock_dependency_detected_on_many_cases',originalSensitive>=50);
          const changedAsOf=[];
          for(let i=0;i<fixtureCount;i++)if(new Set(asOfs.map(k=>JSON.stringify(reference[k].rows[i].slice(3)))).size>1)changedAsOf.push(i);
          guard('explicit_date_allows_aging',changedAsOf.length>0);
          // Trade state risk: a trade asset is stored at add time. A later as-of publication
          // cannot be mixed silently with a newly-valued trade asset.
          const selected=fixtures.findIndex(x=>x.dob==='2000-03-01'&&x.role==='Starter'&&x.P===0.7);
          if(selected<0)throw Error('HOLD_MISSING_CANARY');
          const early=evaluate(clocks[0],asOfs[0]);const late=evaluate(clocks[0],asOfs[1]);
          for(const X of [early,late]){
           const k=X.normalizeName(name);X.PLAYER_DB[k]={pos:'RB',age:26,role:'Starter',birth_date:'2000-03-01',team:'SYNTHETIC'};
           X.RB_BIRTH_DATE_DATA[k]='2000-03-01';X.PROD_MULT[k]=0.7;
          }
          const added=early.addPlayerAsset('A',name,'RB',26,'Starter');
          const stored=early.state.A[0]?.value, updated=late.playerValue('RB',26,'Starter',name);
          guard('trade_add_live_function_success',added===true&&Number.isFinite(stored));
          guard('stored_trade_value_can_be_stale_after_asof_change',stored!==updated&&stored===reference[asOfs[0]].rows[selected][3]&&updated===reference[asOfs[1]].rows[selected][3]);
          let missing=false,timestamp=false,invalid=false;
          try{validAsOf(null)}catch(e){missing=e.message==='HOLD_ASOF_REQUIRED'}
          try{validAsOf('2026-10-14T19:00:00Z')}catch(e){timestamp=e.message==='HOLD_ASOF_REQUIRED'}
          try{validAsOf('2026-02-30')}catch(e){invalid=e.message==='HOLD_ASOF_REQUIRED'}
          guard('missing_asof_fails_closed',missing);
          guard('timestamp_rejected_as_date',timestamp);
          guard('invalid_calendar_date_rejected',invalid);
          guard('no_network_attempts',net.fetch===0&&net.xhr===0);
          guard('only_two_shadow_sites',callsites.length===2&&shadow!==source);
          const report={study:'A03_R19_V1',result:'PASS_SYNTHETIC_SHADOW_MATRIX__PROVENANCE_AND_DEPLOYMENT_HOLD',
           mode:'PINNED_ENGINE_SYNTHETIC_MATRIX_READ_ONLY',
           engine:{commit:COMMIT,sha256:ENGINE_SHA,real_pinned_functions:true},
           scope:{synthetic_only:true,fixture_count:fixtureCount,asof_count:asOfs.length,clock_count:clocks.length,
           comparisons_count:fixtureCount*asOfs.length*clocks.length,research_only:true,real_roster_priced:false,
           production_asof_source_selected:false,production_files_modified:false},
           comparisons,negative_control_original_clock_sensitive:originalSensitive,
           explicit_asof_changes_valid_aging_count:changedAsOf.length,
           stored_trade_risk:{status:'HOLD_STALE_STORED_ASSET_ON_SNAPSHOT_TRANSITION',prior_value:stored,new_value:updated,
           requires_versioned_reprice_or_invalidation:true},
           source_provenance:{status:'HOLD_UNRESOLVED',roster_sync_is_not_valuation_date:true,
           accepted_production_asof:null},
           guards,passed:guards.length,failed:0,network_attempts:net,
           full_deployed_UI_tested:false,new_FV_coefficient_authorized:false,new_player_price_authorized:false,
           E2_access:false,B2_admission:false,roleV2_pricing_authorized:false};
          console.log(JSON.stringify(report,null,2));
          A03R19SCRIPT
          printf '%s  %s\n' '8527fe5d8fd5c2f4b5ca847aaf47d974388937d22fbb4148c56908fb5b728fc4' "$RUNNER_TEMP/a03_r19_broad_asof.js" | sha256sum --check --status
          node --check "$RUNNER_TEMP/a03_r19_broad_asof.js"

      - name: Run pinned engine broad synthetic clock and trade state discovery
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/a03_r19_broad_asof.js" --engine index.html | tee "$RUNNER_TEMP/a03-r19-synthetic-asof-evidence.json"
          node - "$RUNNER_TEMP/a03-r19-synthetic-asof-evidence.json" <<'A03R19ASSERT'
          const fs=require('node:fs');
          const file=process.argv[2]; if(!file)throw Error('HOLD_MISSING_REPORT');
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          function ck(ok,msg){if(!ok)throw Error('HOLD_R19_ASSERT_'+msg)}
          ck(j.study==='A03_R19_V1','STUDY');
          ck(j.result==='PASS_SYNTHETIC_SHADOW_MATRIX__PROVENANCE_AND_DEPLOYMENT_HOLD','DISPOSITION');
          ck(j.mode==='PINNED_ENGINE_SYNTHETIC_MATRIX_READ_ONLY','MODE');
          ck(j.engine?.commit==='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6','COMMIT');
          ck(j.engine?.sha256==='af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78','ENGINE');
          ck(j.engine?.real_pinned_functions===true,'PINNED_FUNCTIONS');
          const s=j.scope||{};
          ck(s.synthetic_only===true&&s.fixture_count===270&&s.asof_count===3&&s.clock_count===4&&s.comparisons_count===3240,'GRID');
          ck(s.research_only===true&&s.real_roster_priced===false&&s.production_asof_source_selected===false&&s.production_files_modified===false,'READ_ONLY_SCOPE');
          ck(Array.isArray(j.guards)&&j.guards.length===18&&j.guards.every(g=>g.pass===true)&&j.passed===18&&j.failed===0,'GUARDS');
          ck(Array.isArray(j.comparisons)&&j.comparisons.length===3&&j.comparisons.every(x=>x.comparisons===4&&x.across_clock_mismatches===0&&x.full_grid_neutral_at_matched_clock===true&&x.canonical_digest===x.matched_legacy_digest),'PARITY');
          ck(new Set(j.comparisons.map(x=>x.as_of)).size===3,'ASOF_COVERAGE');
          ck(Number.isInteger(j.negative_control_original_clock_sensitive)&&j.negative_control_original_clock_sensitive>=50,'NEG_CONTROL');
          ck(Number.isInteger(j.explicit_asof_changes_valid_aging_count)&&j.explicit_asof_changes_valid_aging_count>=1,'AGE_PROGRESSION');
          ck(j.stored_trade_risk?.status==='HOLD_STALE_STORED_ASSET_ON_SNAPSHOT_TRANSITION'&&j.stored_trade_risk?.requires_versioned_reprice_or_invalidation===true&&j.stored_trade_risk?.prior_value!==j.stored_trade_risk?.new_value,'STORED_ASSET_HOLD');
          ck(j.source_provenance?.status==='HOLD_UNRESOLVED'&&j.source_provenance?.roster_sync_is_not_valuation_date===true&&j.source_provenance?.accepted_production_asof===null,'PROVENANCE_HOLD');
          ck(j.network_attempts?.fetch===0&&j.network_attempts?.xhr===0,'NETWORK');
          ck(j.full_deployed_UI_tested===false&&j.new_FV_coefficient_authorized===false&&j.new_player_price_authorized===false&&j.E2_access===false&&j.B2_admission===false&&j.roleV2_pricing_authorized===false,'OTHER_HOLDS');
          console.log('A03 R19 read-only synthetic broad-matrix assertions PASS; as-of custody and live integration HOLD.');
          A03R19ASSERT

      - name: Upload broad synthetic research evidence only
        uses: actions/upload-artifact@v4
        with:
          name: A03-R19-Broad-Synthetic-AsOf-ReadOnly-Evidence
          path: ${{ runner.temp }}/a03-r19-synthetic-asof-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert no repository mutations
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
