name: Draft Pick FV V8 - Phase 0C Incremental R6 Rescue V3 Sharded

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: draft-pick-fv-v8-phase0c-incremental-r6-rescue-v3-sharded
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0A prep and Phase 0B closeout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/prep/p0a" "${RUNNER_TEMP}/prep/p0b"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10894002488" --jq '.digest')" = \
            "sha256:bb24b4ea7378936ea1f8b9504e631f566218a3bdf20297d19d5fe7657de32d5d"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10925470604" --jq '.digest')" = \
            "sha256:189d986491c4dc5bfa78cc76fc738aba3b96b638004ff17baa6402218e9aaa7c"

          gh run download 36207166693 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0a-raw-depth-prep" \
            -D "${RUNNER_TEMP}/prep/p0a"

          gh run download 36268881894 --repo "$GITHUB_REPOSITORY" \
            -n "v8-p0b-qualified-depth-feasibility-closeout" \
            -D "${RUNNER_TEMP}/prep/p0b"

          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = \
            "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
          test "$(sha256sum "${RUNNER_TEMP}/prep/p0a/engine/identity_crosswalk.json" | awk '{print $1}')" = \
            "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"

      - name: Freeze incremental rescue contract and exact reuse plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          p0a=root/"p0a"
          p0b=root/"p0b"

          summary=json.loads(
              (p0b/"v8_phase0b_qualified_depth_feasibility.json").read_text()
          )
          evidence=json.loads(
              (p0b/"v8_phase0b_qualified_depth_exact_evidence.json").read_text()
          )

          assert summary["decision"]=="STOP_AND_REDESIGN_V8_SOURCE_ARCHITECTURE_BEFORE_OUTCOMES"
          assert summary["candidate_universe_total_n"]==6203
          assert summary["exact_candidate_coverage"] is True
          assert summary["year_cells_passing_all_gates"]==64
          assert len(summary["year_cell"])==108
          assert summary["historical_outcome_ingestion_authorized"] is False
          assert summary["holdout_2024_outcomes_read"] is False
          assert summary["production_change_authorized"] is False
          assert all(v is False for v in summary["firewalls"].values())

          assert len(evidence["candidate_dispositions"])==6203
          assert evidence["historical_player_outcomes_read"] is False
          assert evidence["holdout_2024_outcomes_read"] is False
          assert evidence["candidate_fit_performed"] is False
          assert evidence["production_change_authorized"] is False

          mem=defaultdict(list)
          occ=defaultdict(list)
          dispositions={}

          for x in evidence["candidate_dispositions"]:
              key=(int(x["draft_year"]),str(x["league_id"]))
              assert key not in dispositions
              dispositions[key]=x

          for x in evidence["cell_memberships"]:
              mem[(int(x["draft_year"]),x["cell"])].append(x)

          for x in evidence["occurrences"]:
              occ[(int(x["draft_year"]),x["cell"],str(x["league_id"]))].append(x)

          all_cells=sorted(
              (int(v["draft_year"]),v["cell"])
              for v in summary["year_cell"].values()
          )
          assert len(all_cells)==108

          baseline={}
          baseline_occurrences={}
          for y,cell in all_cells:
              qids={
                  str(x["league_id"])
                  for x in mem[(y,cell)]
                  if x["status"]=="qualified"
              }
              usable=[]
              for lid in sorted(qids):
                  rows=occ[(y,cell,lid)]
                  if (
                      len(rows)==4
                      and len({int(r["overall_slot"]) for r in rows})==4
                      and all(
                          bool(r["identity_resolved"])
                          and bool(r["outcome_ready_sleeper_id"])
                          for r in rows
                      )
                  ):
                      usable.append(lid)
                      baseline_occurrences[f"{y}:{cell}:{lid}"]=rows
              baseline[f"{y}:{cell}"]=usable

          reusable_cells=[key for key,lids in baseline.items() if len(lids)>=12]
          deficient={
              key:{
                  "draft_year":int(key.split(":")[0]),
                  "cell":key.split(":",1)[1],
                  "baseline_fully_usable_n":len(lids),
                  "shortfall":12-len(lids),
              }
              for key,lids in baseline.items()
              if len(lids)<12
          }

          assert len(reusable_cells)==91, len(reusable_cells)
          assert len(deficient)==17, len(deficient)
          assert all(
              x["cell"] in {"r6_early","r6_mid","r6_late"}
              for x in deficient.values()
          )
          assert sum(x["shortfall"] for x in deficient.values())==80

          expected_deficits={
              "2018:r6_early":7,
              "2018:r6_mid":6,
              "2018:r6_late":6,
              "2019:r6_mid":1,
              "2019:r6_late":1,
              "2020:r6_early":8,
              "2020:r6_mid":8,
              "2020:r6_late":10,
              "2021:r6_early":7,
              "2021:r6_mid":7,
              "2021:r6_late":8,
              "2022:r6_early":1,
              "2022:r6_mid":1,
              "2022:r6_late":1,
              "2023:r6_early":3,
              "2023:r6_mid":2,
              "2023:r6_late":3
          }
          assert {k:v["shortfall"] for k,v in deficient.items()}==expected_deficits

          rescue_seed="draft-pick-fv-v8-phase0c-r6-rescue-20260927"
          candidate_order={}
          candidate_status_counts={}
          max_rescue_candidates_by_year={}

          for y in range(2018,2024):
              disc=json.loads((p0a/"discoveries"/f"discovery_{y}.json").read_text())
              ids=[str(x) for x in disc["candidate_ids"]]
              assert hashlib.sha256("\n".join(ids).encode()).hexdigest()==disc["candidate_ids_sha256"]

              counts=Counter()
              pool=[]
              for lid in ids:
                  d=dispositions[(y,lid)]
                  counts[d["status"]]+=1
                  if d["status"] in {"qualifier_reject","obvious_mock_reject"}:
                      continue
                  pool.append(lid)

              pool.sort(
                  key=lambda lid:(
                      hashlib.sha256(f"{rescue_seed}|{y}|{lid}".encode()).hexdigest(),
                      lid,
                  )
              )
              candidate_order[str(y)]=pool
              candidate_status_counts[str(y)]=dict(sorted(counts.items()))
              max_rescue_candidates_by_year[str(y)]=len(pool)

          assert max_rescue_candidates_by_year=={
              "2018":306,"2019":350,"2020":357,
              "2021":376,"2022":406,"2023":413,
          }
          assert sum(max_rescue_candidates_by_year.values())==2208

          contract={
              "schema_version":2,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase0c_incremental_r6_rescue_preregistration",
              "status":"FROZEN_PRE_PHASE0C_RESCUE_PRE_OUTCOME",
              "reason":{
                  "phase0b_decision":summary["decision"],
                  "phase0b_original_passing_cells":64,
                  "phase0b_additional_cells_already_4of4_usable":27,
                  "cells_reused_without_refetch":91,
                  "cells_requiring_rescue":17,
                  "all_rescue_cells_round":"R6",
                  "total_additional_league_cell_shortfall":80
              },
              "reuse_rule":{
                  "baseline_source":"exact Phase 0B memberships and occurrences",
                  "fully_usable_definition":"qualified Phase 0B membership with exactly four distinct target slots and all four occurrences identity-resolved and Sleeper-ready",
                  "cells_with_at_least_12_fully_usable_are_frozen":True,
                  "baseline_evidence_recomputed":False,
                  "baseline_network_refetch":False
              },
              "rescue_rule":{
                  "target_cells":deficient,
                  "target_minimum_fully_usable_leagues":12,
                  "only_deficient_cells_may_receive_rescue_additions":True,
                  "candidate_universe":"same exact frozen Phase 0A 6203 candidate universe",
                  "known_phase0b_qualifier_rejects_skipped":True,
                  "known_phase0b_obvious_mocks_skipped":True,
                  "rescue_candidate_maximum_n":2208,
                  "rescue_order_seed":rescue_seed,
                  "rescue_order":"SHA256(seed|year|league_id), then league_id",
                  "selection_stop_rule":"For each year, the ordered reducer stops immediately after every deficient R6 cell for that year reaches 12 fully usable leagues.",
                  "outcome_dependent_selection":False
              },
              "execution_rule":{
                  "mode":"deterministic_parallel_candidate_shards_then_ordered_reducer",
                  "shard_size":16,
                  "max_parallel":12,
                  "shards_collect_evidence_only":True,
                  "shards_may_not_select_rescue_leagues":True,
                  "reducer_replays_exact_frozen_order":True,
                  "completion_order_may_not_affect_selection":True,
                  "prefetched_candidates_after_ordered_stop_are_excluded_from_selection":True,
                  "prefetched_transport_after_ordered_stop_is_excluded_from_scientific_transport_gate":True,
                  "scientific_selection_rule_changed":False
              },
              "local_cell_rule":{
                  "r6_early_slots":[61,62,63,64],
                  "r6_mid_slots":[65,66,67,68],
                  "r6_late_slots":[69,70,71,72],
                  "earlier_round_completeness_required":False,
                  "all_four_slots_exactly_once":True,
                  "four_nonnull_distinct_mfl_player_ids":True,
                  "contamination_scope":"exact target four-pick cell",
                  "four_of_four_identity_required":True,
                  "four_of_four_sleeper_ready_required":True
              },
              "league_qualification":{
                  "evaluated_phase0b_candidate":"reuse prior frozen Phase 0B format/mock qualification; no league refetch required",
                  "not_raw_depth_supported_r1_or_transport_candidate":"fetch league only after at least one target R6 local window is structurally complete, then apply the frozen V7 qualifier and obvious-mock rule",
                  "manual_rescue_allowed":False
              },
              "transport":{
                  "mfl_endpoints_allowed":["draftResults","league","players"],
                  "leagueSearch_allowed":False,
                  "new_candidate_discovery_allowed":False,
                  "maximum_combined_unresolved_candidate_n":62,
                  "maximum_combined_unresolved_fraction_of_6203":0.01,
                  "candidate_level_transport_isolation":True
              },
              "firewalls":{
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False
              },
              "pass_decision":"PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
              "fail_decision":"STOP_AND_PREREGISTER_V8_PHASE0D_TARGETED_SOURCE_EXPANSION_BEFORE_OUTCOMES"
          }

          plan={
              "schema_version":2,
              "study_id":contract["study_id"],
              "stage":"phase0c_incremental_r6_rescue_plan",
              "reusable_cell_n":91,
              "deficient_cell_n":17,
              "total_shortfall":80,
              "baseline_fully_usable_league_ids":baseline,
              "baseline_fully_usable_occurrences":baseline_occurrences,
              "deficient_cells":deficient,
              "rescue_candidate_order_by_year":candidate_order,
              "phase0b_candidate_status_counts_by_year":candidate_status_counts,
              "maximum_rescue_candidates_by_year":max_rescue_candidates_by_year,
              "shard_size":16,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False
          }

          (root/"v8_phase0c_incremental_rescue_contract.json").write_text(
              json.dumps(contract,indent=2,sort_keys=True)+"\n"
          )
          (root/"v8_phase0c_incremental_rescue_plan.json").write_text(
              json.dumps(plan,indent=2,sort_keys=True)+"\n"
          )

          print(json.dumps({
              "reusable_cells":91,
              "rescue_cells":17,
              "total_shortfall":80,
              "maximum_candidates_that_could_be_prefetched":2208,
              "candidate_counts_by_year":max_rescue_candidates_by_year,
              "shard_size":16,
              "full_6203_rescan":False,
              "all_rescue_cells":"R6"
          },indent=2))
          PY

      - name: Write deterministic shard evidence probe
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/prep/r6_shard_probe_v8.py" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          import requests

          WINDOWS={
              "r6_early":(61,62,63,64),
              "r6_mid":(65,66,67,68),
              "r6_late":(69,70,71,72),
          }

          def sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def load_engine(path: Path):
              spec=importlib.util.spec_from_file_location("v7_frozen_engine",path)
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot import frozen V7 engine")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def parse_selected_unit(E,unit):
              raw=[x for x in E.V.as_list(unit.get("draftPick")) if isinstance(x,dict)]
              by_slot={}
              for i,p in enumerate(raw):
                  r=E.V.safe_int(p.get("round"))
                  w=E.V.safe_int(p.get("pick"))
                  if r is None or w is None or r<1 or r>6 or w<1 or w>12:
                      continue
                  s=(r-1)*12+w
                  by_slot.setdefault(s,[]).append({
                      "overall_slot":s,
                      "round":r,
                      "within_round_pick":w,
                      "mfl_player_id":E.V.stable_id(p.get("player")),
                      "franchise_id":E.V.stable_id(
                          p.get("franchise") or p.get("franchise_id") or p.get("franchiseId")
                      ),
                      "raw_row_index":i,
                  })
              return by_slot

          def extract_window(by_slot,slots):
              rows=[]
              for s in slots:
                  xs=by_slot.get(s,[])
                  if len(xs)==0:
                      return None,"missing_slot"
                  if len(xs)!=1:
                      return None,"duplicate_slot"
                  rows.append(dict(xs[0]))
              pids=[x.get("mfl_player_id") for x in rows]
              if any(not x for x in pids):
                  return None,"missing_player_id"
              if len(set(pids))!=4:
                  return None,"duplicate_player_id"
              return rows,"structurally_complete"

          def selftest():
              class V:
                  @staticmethod
                  def as_list(x):
                      if x is None:
                          return []
                      return x if isinstance(x,list) else [x]
                  @staticmethod
                  def safe_int(x):
                      try:
                          return int(x)
                      except Exception:
                          return None
                  @staticmethod
                  def stable_id(x):
                      if x is None:
                          return None
                      s=str(x).strip()
                      return s or None
              class E: pass
              E.V=V
              picks=[
                  {"round":6,"pick":1,"player":"601"},
                  {"round":6,"pick":2,"player":"602"},
                  {"round":6,"pick":3,"player":"603"},
                  {"round":6,"pick":4,"player":"604"},
              ]
              by=parse_selected_unit(E,{"draftPick":picks})
              rows,status=extract_window(by,WINDOWS["r6_early"])
              assert status=="structurally_complete"
              assert [x["mfl_player_id"] for x in rows]==["601","602","603","604"]
              print("PASS: sharded R6 evidence helper self-test")

          def run(args):
              prep=Path(args.prep)
              out=Path(args.out)
              contract=json.loads((prep/"v8_phase0c_incremental_rescue_contract.json").read_text())
              plan=json.loads((prep/"v8_phase0c_incremental_rescue_plan.json").read_text())

              E=load_engine(prep/"p0a"/"engine"/"build_r1_r6_source_identity_v7.py")
              frozen_fp=prep/"p0a"/"engine"/"identity_crosswalk.json"
              expected_fp="697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
              if sha(frozen_fp)!=expected_fp:
                  raise RuntimeError("frozen crosswalk hash mismatch")
              E.FP_XWALK=frozen_fp

              idx,asset=E.load_indexes(
                  prep/"p0a"/"engine"/"db_playerids.csv",
                  prep/"p0a"/"engine"/"nflverse_players.csv",
                  prep/"p0a"/"engine"/"r1_r6_identity_asset_manifest_v7.json",
              )
              if asset["fantasypros_sleeper_crosswalk"]["sha256"]!=expected_fp:
                  raise RuntimeError("identity manifest mismatch")

              year=str(args.year)
              target=sorted(
                  x["cell"]
                  for x in plan["deficient_cells"].values()
                  if int(x["draft_year"])==args.year
              )
              if not target:
                  raise RuntimeError(f"year {args.year} has no rescue target")

              evidence=json.loads(
                  (prep/"p0b"/"v8_phase0b_qualified_depth_exact_evidence.json").read_text()
              )
              dispositions={
                  str(x["league_id"]):x
                  for x in evidence["candidate_dispositions"]
                  if int(x["draft_year"])==args.year
              }

              order=plan["rescue_candidate_order_by_year"][year]
              if len(order)!=len(set(order)):
                  raise RuntimeError("duplicate rescue candidate")
              if not (1<=args.start_index<=args.end_index<=len(order)):
                  raise RuntimeError("invalid shard bounds")

              ses=requests.Session()
              ses.headers["User-Agent"]=(
                  f"LOG-Draft-Pick-FV-V8-P0C-Shard-{args.year}-{args.shard_id}/1.0"
              )

              records=[]
              for scan_index in range(args.start_index,args.end_index+1):
                  lid=order[scan_index-1]
                  d=dispositions[lid]
                  if d["status"] in {"qualifier_reject","obvious_mock_reject"}:
                      raise RuntimeError("known reject leaked into rescue pool")

                  rec={
                      "scan_index":scan_index,
                      "league_id":lid,
                      "phase0b_status":d["status"],
                      "target_cells":target,
                      "cell_results":{},
                  }
                  stage="draftResults"

                  try:
                      units=E.V.extract_units(
                          E.V.get_json(ses,E.V.api_url(args.year,"draftResults",L=lid))
                      )
                      chosen,reason,unit_summary=E.V.choose_unit(units)
                      rec["unit_selection_reason"]=str(reason)
                      if chosen is None:
                          rec["status"]="draft_unit_reject"
                          records.append(rec)
                          continue

                      by_slot=parse_selected_unit(E,chosen)
                      windows={}
                      for cell in target:
                          rows,status=extract_window(by_slot,WINDOWS[cell])
                          rec["cell_results"][cell]={"structural_status":status}
                          if rows is not None:
                              windows[cell]=rows

                      if not windows:
                          rec["status"]="no_target_structural_r6_window"
                          records.append(rec)
                          continue

                      if d["status"]=="evaluated":
                          rec["qualification_status"]="qualified"
                          rec["format_source"]="phase0b_frozen_evaluated"
                      else:
                          stage="league"
                          lg=E.V.league_obj(
                              E.V.get_json(ses,E.V.api_url(args.year,"league",L=lid))
                          )
                          if lg is None:
                              rec["qualification_status"]="league_missing"
                              rec["status"]="league_missing"
                              records.append(rec)
                              continue
                          ok,q=E.V.qualifier(lg)
                          if not ok:
                              rec["qualification_status"]="qualifier_reject"
                              rec["qualification_reason"]=str(q)
                              rec["status"]="qualifier_reject"
                              records.append(rec)
                              continue
                          if E.V.obvious_mock_name(lg.get("name")):
                              rec["qualification_status"]="obvious_mock_reject"
                              rec["status"]="obvious_mock_reject"
                              records.append(rec)
                              continue
                          rec["qualification_status"]="qualified"
                          rec["format_source"]="phase0c_refetched_league"

                      pids=sorted({
                          str(x["mfl_player_id"])
                          for rows in windows.values()
                          for x in rows
                      })
                      stage="players"
                      meta=E.V.league_scoped_players(ses,args.year,lid,pids)

                      usable_n=0
                      for cell,rows in windows.items():
                          cr=[
                              {
                                  "overall_slot":int(x["overall_slot"]),
                                  "mfl_player_id":str(x["mfl_player_id"]),
                              }
                              for x in rows
                          ]
                          contam=E.V.classify_contamination(args.year,cr,meta,idx)
                          if contam["positive_contamination"]:
                              rec["cell_results"][cell].update({
                                  "status":"contamination_reject"
                              })
                              continue

                          resolved=[]
                          for row0 in rows:
                              pid=str(row0["mfl_player_id"])
                              ident=E.V.resolve_identity(args.year,pid,meta.get(pid),idx)
                              row={
                                  "draft_year":args.year,
                                  "league_id":lid,
                                  "cell":cell,
                                  "overall_slot":int(row0["overall_slot"]),
                                  "round":int(row0["round"]),
                                  "within_round_pick":int(row0["within_round_pick"]),
                                  "mfl_player_id":pid,
                                  "franchise_id":row0.get("franchise_id"),
                              }
                              row.update(ident)
                              row["stable_player_key"]=E.V.stable_player_key(ident)
                              resolved.append(row)

                          if not all(bool(x["identity_resolved"]) for x in resolved):
                              rec["cell_results"][cell].update({"status":"identity_reject"})
                              continue
                          if not all(bool(x["outcome_ready_sleeper_id"]) for x in resolved):
                              rec["cell_results"][cell].update({"status":"sleeper_reject"})
                              continue

                          rec["cell_results"][cell].update({
                              "status":"usable",
                              "occurrences":resolved,
                          })
                          usable_n+=1

                      rec["status"]="evaluated"
                      rec["usable_target_cell_n"]=usable_n
                      records.append(rec)

                  except E.GateError as exc:
                      if not E._v4_transport_exhaustion(exc):
                          raise
                      u={
                          "draft_year":args.year,
                          "league_id":lid,
                          "scan_index":scan_index,
                          "stage":stage,
                          "failure_class":E._v4_transport_class(str(exc)),
                          "error_fingerprint_sha256":hashlib.sha256(str(exc).encode()).hexdigest(),
                      }
                      rec["status"]="transport_unresolved"
                      rec["transport"]=u
                      records.append(rec)

                  if scan_index%8==0 or scan_index==args.end_index:
                      print(json.dumps({
                          "year":args.year,
                          "shard_id":args.shard_id,
                          "through_scan_index":scan_index,
                          "end_index":args.end_index,
                      }),flush=True)

              assert len(records)==args.end_index-args.start_index+1
              assert [x["scan_index"] for x in records]==list(range(args.start_index,args.end_index+1))
              assert [x["league_id"] for x in records]==order[args.start_index-1:args.end_index]

              payload={
                  "schema_version":1,
                  "study_id":contract["study_id"],
                  "stage":"phase0c_r6_shard_evidence_collection",
                  "draft_year":args.year,
                  "shard_id":str(args.shard_id),
                  "start_index":args.start_index,
                  "end_index":args.end_index,
                  "candidate_n":len(records),
                  "records":records,
                  "selection_performed":False,
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
              }
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--self-test",action="store_true")
              ap.add_argument("--year",type=int)
              ap.add_argument("--start-index",type=int)
              ap.add_argument("--end-index",type=int)
              ap.add_argument("--shard-id")
              ap.add_argument("--prep")
              ap.add_argument("--out")
              args=ap.parse_args()
              if args.self_test:
                  selftest()
                  return
              required=[args.year,args.start_index,args.end_index,args.shard_id,args.prep,args.out]
              if any(x is None for x in required):
                  ap.error("probe mode requires year, bounds, shard-id, prep, out")
              run(args)

          if __name__=="__main__":
              main()
          PY

          chmod +x "${RUNNER_TEMP}/prep/r6_shard_probe_v8.py"
          python3 "${RUNNER_TEMP}/prep/r6_shard_probe_v8.py" --self-test

      - name: Build deterministic shard matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          plan=json.loads((root/"v8_phase0c_incremental_rescue_plan.json").read_text())
          shard_size=int(plan["shard_size"])
          include=[]
          job_index=0
          for year in range(2018,2024):
              n=len(plan["rescue_candidate_order_by_year"][str(year)])
              for start in range(1,n+1,shard_size):
                  end=min(n,start+shard_size-1)
                  include.append({
                      "year":year,
                      "shard":f"{(start-1)//shard_size:03d}",
                      "start":start,
                      "end":end,
                      "slot":job_index%12,
                  })
                  job_index+=1
          expected=sum(
              math.ceil(len(plan["rescue_candidate_order_by_year"][str(y)])/shard_size)
              for y in range(2018,2024)
          )
          assert len(include)==expected==141,(len(include),expected)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("matrix="+json.dumps({"include":include},separators=(",",":"))+"\n")
              f.write("shard_count="+str(len(include))+"\n")
          print(json.dumps({
              "shard_size":shard_size,
              "shard_count":len(include),
              "max_parallel":12,
          },indent=2))
          PY

      - name: Validate Phase 0C V3 prep
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"prep"
          c=json.loads((root/"v8_phase0c_incremental_rescue_contract.json").read_text())
          p=json.loads((root/"v8_phase0c_incremental_rescue_plan.json").read_text())
          assert c["status"]=="FROZEN_PRE_PHASE0C_RESCUE_PRE_OUTCOME"
          assert c["reason"]["cells_reused_without_refetch"]==91
          assert c["reason"]["cells_requiring_rescue"]==17
          assert c["reason"]["total_additional_league_cell_shortfall"]==80
          assert c["rescue_rule"]["rescue_candidate_maximum_n"]==2208
          assert c["rescue_rule"]["outcome_dependent_selection"] is False
          assert c["execution_rule"]["shards_collect_evidence_only"] is True
          assert c["execution_rule"]["reducer_replays_exact_frozen_order"] is True
          assert c["execution_rule"]["scientific_selection_rule_changed"] is False
          assert c["transport"]["leagueSearch_allowed"] is False
          assert c["transport"]["new_candidate_discovery_allowed"] is False
          assert all(v is False for v in c["firewalls"].values())
          assert p["reusable_cell_n"]==91
          assert p["deficient_cell_n"]==17
          assert p["total_shortfall"]==80
          assert p["shard_size"]==16
          assert len(p["deficient_cells"])==17
          assert all(x["cell"].startswith("r6_") for x in p["deficient_cells"].values())
          assert sum(p["maximum_rescue_candidates_by_year"].values())==2208
          print("PASS: V3 prep frozen; deterministic sharding is execution-only.")
          PY

      - name: Upload frozen Phase 0C V3 prep
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-r6-v3-prep
          path: ${{ runner.temp }}/prep/
          if-no-files-found: error
          retention-days: 30

  rescue_shards:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      YEAR: ${{ matrix.year }}
      SHARD: ${{ matrix.shard }}
      START_INDEX: ${{ matrix.start }}
      END_INDEX: ${{ matrix.end }}
      SLOT: ${{ matrix.slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download frozen Phase 0C V3 prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0c-r6-v3-prep
          path: ${{ runner.temp }}/prep

      - name: Collect outcome-blind shard evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out" "${RUNNER_TEMP}/diag"
          export MFL_TRANSPORT_DIAGNOSTIC_PATH="${RUNNER_TEMP}/diag/transport_${YEAR}_${SHARD}.jsonl"

          # Deterministic startup spreading only. It cannot affect selection.
          sleep "$(( SLOT * 3 ))"

          python3 "${RUNNER_TEMP}/prep/r6_shard_probe_v8.py" \
            --year "$YEAR" \
            --start-index "$START_INDEX" \
            --end-index "$END_INDEX" \
            --shard-id "$SHARD" \
            --prep "${RUNNER_TEMP}/prep" \
            --out "${RUNNER_TEMP}/out/shard_${YEAR}_${SHARD}.json"

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-r6-shard-${{ matrix.year }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload shard transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-r6-shard-diag-${{ matrix.year }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/diag/
          if-no-files-found: ignore
          retention-days: 30

  reduce:
    needs: [prepare, rescue_shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
    steps:
      - name: Download frozen Phase 0C V3 prep
        uses: actions/download-artifact@v4
        with:
          name: v8-p0c-r6-v3-prep
          path: ${{ runner.temp }}/prep

      - name: Download all shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p0c-r6-shard-20*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Deterministically replay frozen order and assemble exact cohorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assembled"

          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])
          prep=root/"prep"
          shards=root/"shards"
          out=root/"assembled"

          contract=json.loads((prep/"v8_phase0c_incremental_rescue_contract.json").read_text())
          plan=json.loads((prep/"v8_phase0c_incremental_rescue_plan.json").read_text())
          p0b_evidence=json.loads(
              (prep/"p0b"/"v8_phase0b_qualified_depth_exact_evidence.json").read_text()
          )

          docs=[]
          for p in sorted(shards.glob("shard_*.json")):
              d=json.loads(p.read_text())
              for k in (
                  "historical_player_outcomes_read",
                  "holdout_2024_outcomes_read",
                  "holdout_2024_search_performed",
                  "market_or_ktc_values_read",
                  "package_vote_data_read",
                  "candidate_fit_performed",
                  "candidate_scores_computed",
                  "candidate_selection_performed",
                  "production_change_authorized",
              ):
                  assert d[k] is False,(p.name,k)
              assert d["selection_performed"] is False
              docs.append(d)

          expected_shards=int(os.environ["EXPECTED_SHARD_COUNT"])
          assert len(docs)==expected_shards==141,(len(docs),expected_shards)

          records_by_year=defaultdict(list)
          observed_bounds=set()
          prefetch_transport=[]
          for d in docs:
              y=int(d["draft_year"])
              key=(y,str(d["shard_id"]),int(d["start_index"]),int(d["end_index"]))
              assert key not in observed_bounds,key
              observed_bounds.add(key)
              assert d["candidate_n"]==d["end_index"]-d["start_index"]+1
              for rec in d["records"]:
                  records_by_year[y].append(rec)
                  if rec["status"]=="transport_unresolved":
                      prefetch_transport.append(rec["transport"])

          for y in range(2018,2024):
              order=plan["rescue_candidate_order_by_year"][str(y)]
              recs=records_by_year[y]
              assert len(recs)==len(order),(y,len(recs),len(order))
              by_index={}
              for rec in recs:
                  i=int(rec["scan_index"])
                  assert i not in by_index,(y,i)
                  by_index[i]=rec
              assert set(by_index)==set(range(1,len(order)+1)),y
              for i,lid in enumerate(order,1):
                  assert str(by_index[i]["league_id"])==str(lid),(y,i,lid,by_index[i]["league_id"])

          def replay_year(year, unordered_records):
              order=plan["rescue_candidate_order_by_year"][str(year)]
              by_index={int(x["scan_index"]):x for x in unordered_records}
              target={
                  x["cell"]:int(x["shortfall"])
                  for x in plan["deficient_cells"].values()
                  if int(x["draft_year"])==year
              }
              baseline={
                  cell:set(plan["baseline_fully_usable_league_ids"][f"{year}:{cell}"])
                  for cell in target
              }
              additions={cell:[] for cell in target}
              rescue_occurrences=[]
              attempts=[]
              transport=[]
              counts=Counter()

              def complete():
                  return all(len(baseline[c])+len(additions[c])>=12 for c in target)

              for scan_index,lid in enumerate(order,1):
                  if complete():
                      break
                  rec=by_index[scan_index]
                  assert str(rec["league_id"])==str(lid)

                  need=[
                      cell for cell in target
                      if len(baseline[cell])+len(additions[cell])<12
                      and str(lid) not in baseline[cell]
                  ]
                  if not need:
                      continue

                  attempt={
                      "scan_index":scan_index,
                      "league_id":str(lid),
                      "phase0b_status":rec["phase0b_status"],
                      "needed_cells_at_start":list(need),
                      "evidence_source":"parallel_shard_prefetch",
                  }

                  if rec["status"]=="transport_unresolved":
                      u=dict(rec["transport"])
                      transport.append(u)
                      attempt["status"]="transport_unresolved"
                      attempt["transport"]=u
                      attempts.append(attempt)
                      counts["transport_unresolved"]+=1
                      continue

                  if rec["status"]=="draft_unit_reject":
                      attempt["unit_selection_reason"]=rec.get("unit_selection_reason")
                      attempt["status"]="draft_unit_reject"
                      attempts.append(attempt)
                      counts["draft_unit_reject"]+=1
                      continue

                  structural=[]
                  for cell in need:
                      c=rec.get("cell_results",{}).get(cell,{})
                      attempt[f"{cell}_structural_status"]=c.get("structural_status","missing")
                      if c.get("structural_status")=="structurally_complete":
                          structural.append(cell)

                  if not structural:
                      attempt["status"]="no_needed_structural_r6_window"
                      attempts.append(attempt)
                      counts["no_needed_structural_r6_window"]+=1
                      continue

                  q=rec.get("qualification_status")
                  if q=="league_missing":
                      attempt["status"]="league_missing"
                      attempts.append(attempt)
                      counts["league_missing"]+=1
                      continue
                  if q=="qualifier_reject":
                      attempt["status"]="qualifier_reject"
                      attempt["reason"]=rec.get("qualification_reason")
                      attempts.append(attempt)
                      counts["qualifier_reject"]+=1
                      continue
                  if q=="obvious_mock_reject":
                      attempt["status"]="obvious_mock_reject"
                      attempts.append(attempt)
                      counts["obvious_mock_reject"]+=1
                      continue
                  assert q=="qualified",(year,scan_index,q,rec["status"])

                  added=[]
                  for cell in structural:
                      c=rec["cell_results"][cell]
                      status=c.get("status")
                      if status=="contamination_reject":
                          counts[f"{cell}:contamination_reject"]+=1
                          continue
                      if status=="identity_reject":
                          counts[f"{cell}:identity_reject"]+=1
                          continue
                      if status=="sleeper_reject":
                          counts[f"{cell}:sleeper_reject"]+=1
                          continue
                      assert status=="usable",(year,scan_index,cell,status)

                      if len(baseline[cell])+len(additions[cell])>=12:
                          continue
                      assert str(lid) not in baseline[cell]
                      assert str(lid) not in additions[cell]
                      rows=c["occurrences"]
                      assert len(rows)==4
                      assert len({int(x["overall_slot"]) for x in rows})==4
                      assert all(bool(x["identity_resolved"]) for x in rows)
                      assert all(bool(x["outcome_ready_sleeper_id"]) for x in rows)
                      additions[cell].append(str(lid))
                      rescue_occurrences.extend(rows)
                      added.append(cell)
                      counts[f"{cell}:rescued"]+=1

                  attempt["format_source"]=rec.get("format_source")
                  attempt["added_cells"]=added
                  attempt["status"]="rescued" if added else "evaluated_no_rescue"
                  attempts.append(attempt)

              final_counts={
                  cell:len(baseline[cell])+len(additions[cell])
                  for cell in target
              }
              success=all(n>=12 for n in final_counts.values())
              result={
                  "schema_version":2,
                  "study_id":contract["study_id"],
                  "stage":"phase0c_incremental_r6_rescue_year_replayed",
                  "draft_year":year,
                  "target_cells":target,
                  "baseline_counts":{cell:len(baseline[cell]) for cell in target},
                  "required_final_n":12,
                  "rescue_additions":additions,
                  "rescue_occurrences":rescue_occurrences,
                  "final_counts":final_counts,
                  "success":success,
                  "candidate_order_n":len(order),
                  "candidate_attempt_n":len(attempts),
                  "last_scan_index":attempts[-1]["scan_index"] if attempts else 0,
                  "stopped_early":success and (not attempts or attempts[-1]["scan_index"]<len(order)),
                  "attempt_status_counts":dict(sorted(counts.items())),
                  "attempts":attempts,
                  "transport_unresolved":transport,
                  "ordered_reducer":True,
                  "historical_player_outcomes_read":False,
                  "holdout_2024_outcomes_read":False,
                  "holdout_2024_search_performed":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
              }
              return result

          by_year={}
          for y in range(2018,2024):
              recs=records_by_year[y]
              canonical=replay_year(y,recs)
              reversed_result=replay_year(y,list(reversed(recs)))
              assert canonical==reversed_result,(
                  "completion-order invariance failed",y
              )
              by_year[y]=canonical
              (out/f"v8_phase0c_replayed_{y}.json").write_text(
                  json.dumps(canonical,indent=2,sort_keys=True)+"\n"
              )

          final_memberships={}
          final_occurrences={}
          provenance={}
          rescue_attempt_n=0
          rescue_transport=[]
          failed_years=[]

          for key,lids in plan["baseline_fully_usable_league_ids"].items():
              final_memberships[key]=list(lids)
              provenance[key]={lid:"phase0b_reused" for lid in lids}
              for lid in lids:
                  occ_key=f"{key}:{lid}"
                  final_occurrences[occ_key]=plan["baseline_fully_usable_occurrences"][occ_key]

          for y,d in sorted(by_year.items()):
              rescue_attempt_n+=int(d["candidate_attempt_n"])
              rescue_transport.extend(d["transport_unresolved"])
              if not d["success"]:
                  failed_years.append(y)
              for cell,lids in d["rescue_additions"].items():
                  key=f"{y}:{cell}"
                  for lid in lids:
                      assert lid not in final_memberships[key]
                      final_memberships[key].append(lid)
                      provenance[key][lid]="phase0c_incremental_rescue"
              grouped=defaultdict(list)
              for row in d["rescue_occurrences"]:
                  grouped[(int(row["draft_year"]),row["cell"],str(row["league_id"]))].append(row)
              for (yy,cell,lid),rows in grouped.items():
                  key=f"{yy}:{cell}:{lid}"
                  assert key not in final_occurrences
                  assert len(rows)==4
                  assert all(
                      bool(x["identity_resolved"])
                      and bool(x["outcome_ready_sleeper_id"])
                      for x in rows
                  )
                  final_occurrences[key]=rows

          cells={}
          deficient=[]
          for key,lids in sorted(final_memberships.items()):
              y=int(key.split(":")[0])
              cell=key.split(":",1)[1]
              assert len(set(lids))==len(lids)
              for lid in lids:
                  rows=final_occurrences[f"{key}:{lid}"]
                  assert len(rows)==4
                  assert len({int(x["overall_slot"]) for x in rows})==4
                  assert all(bool(x["identity_resolved"]) for x in rows)
                  assert all(bool(x["outcome_ready_sleeper_id"]) for x in rows)
              n=len(lids)
              passed=n>=12
              if not passed:
                  deficient.append({
                      "draft_year":y,
                      "cell":cell,
                      "fully_usable_league_n":n,
                      "shortfall":12-n,
                  })
              cells[key]={
                  "draft_year":y,
                  "cell":cell,
                  "fully_usable_league_n":n,
                  "minimum_required":12,
                  "source_gate_pass":passed,
                  "occurrence_n":n*4,
                  "occurrence_retention_fraction":1.0,
                  "represented_league_fraction":1.0,
                  "identity_coverage":1.0,
                  "sleeper_ready_coverage":1.0,
                  "phase0b_reused_league_n":sum(
                      1 for lid in lids if provenance[key][lid]=="phase0b_reused"
                  ),
                  "phase0c_rescue_league_n":sum(
                      1 for lid in lids if provenance[key][lid]=="phase0c_incremental_rescue"
                  ),
              }

          assert len(cells)==108,len(cells)

          original_transport={
              (int(x["draft_year"]),str(x["league_id"]))
              for x in p0b_evidence["transport_unresolved"]
          }
          replayed_transport_keys={
              (int(x["draft_year"]),str(x["league_id"]))
              for x in rescue_transport
          }
          prefetched_transport_keys={
              (int(x["draft_year"]),str(x["league_id"]))
              for x in prefetch_transport
          }
          combined_transport=original_transport|replayed_transport_keys
          transport_n=len(combined_transport)
          transport_gate=transport_n<=62

          passed_cells=sum(x["source_gate_pass"] for x in cells.values())
          all_cells_pass=passed_cells==108 and not deficient
          source_gate_pass=all_cells_pass and transport_gate and not failed_years
          decision=contract["pass_decision"] if source_gate_pass else contract["fail_decision"]

          summary={
              "schema_version":2,
              "study_id":contract["study_id"],
              "stage":"phase0c_incremental_r6_rescue_closeout",
              "decision":decision,
              "execution_mode":"deterministic_parallel_candidate_shards_then_ordered_reducer",
              "candidate_universe_total_n":6203,
              "phase0b_cells_reused_without_refetch":91,
              "phase0c_target_cell_n":17,
              "phase0c_target_round":"R6",
              "original_total_shortfall":80,
              "shard_size":plan["shard_size"],
              "shard_n":len(docs),
              "candidate_evidence_prefetched_n":sum(len(x["records"]) for x in docs),
              "rescue_candidate_attempt_n":rescue_attempt_n,
              "full_6203_rescan_performed":False,
              "ordered_reducer_completion_order_invariance_pass":True,
              "year_cell_n":108,
              "year_cells_passing":passed_cells,
              "all_year_cells_pass":all_cells_pass,
              "deficient_year_cells":deficient,
              "failed_rescue_years":failed_years,
              "transport":{
                  "phase0b_unresolved_candidate_n":len(original_transport),
                  "phase0c_prefetched_unresolved_candidate_n":len(prefetched_transport_keys),
                  "phase0c_replayed_prefix_unresolved_candidate_n":len(replayed_transport_keys),
                  "combined_distinct_unresolved_candidate_n":transport_n,
                  "maximum_allowed_candidate_n":62,
                  "prefetched_after_stop_excluded_from_gate":True,
                  "gate_pass":transport_gate,
              },
              "year_cell":cells,
              "firewalls":contract["firewalls"],
              "historical_outcome_ingestion_authorized":False,
              "holdout_2024_outcomes_read":False,
              "production_change_authorized":False,
              "next_stage":(
                  "draft-pick-fv-v8-phase1-incremental-source-identity-freeze"
                  if source_gate_pass
                  else "draft-pick-fv-v8-phase0d-targeted-source-expansion-preregistration"
              ),
          }

          exact={
              "schema_version":2,
              "study_id":contract["study_id"],
              "stage":"phase0c_incremental_exact_source_identity_evidence",
              "decision":decision,
              "cell_membership_league_ids":final_memberships,
              "cell_membership_provenance":provenance,
              "occurrences":final_occurrences,
              "rescue_attempts_by_year":{
                  str(y):by_year[y]["attempts"] for y in sorted(by_year)
              },
              "rescue_transport_unresolved":rescue_transport,
              "prefetch_transport_unresolved":prefetch_transport,
              "ordered_reducer_completion_order_invariance_pass":True,
              "historical_player_outcomes_read":False,
              "holdout_2024_outcomes_read":False,
              "candidate_fit_performed":False,
              "production_change_authorized":False,
          }

          (out/"v8_phase0c_incremental_r6_rescue.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          (out/"v8_phase0c_incremental_exact_evidence.json").write_text(
              json.dumps(exact,indent=2,sort_keys=True)+"\n"
          )

          lines=[
              "# Draft Pick FV V8 — Phase 0C Incremental R6 Rescue V3 Sharded",
              "",
              f"**Decision:** `{decision}`",
              "",
              "- Exact frozen candidate universe: **6,203**",
              "- Phase 0B cells reused without refetch: **91 / 108**",
              "- Cells requiring new rescue work: **17 / 108**",
              "- Rescue scope: **R6 only**",
              "- Original additional league-cell shortfall: **80**",
              f"- Deterministic candidate shards: **{len(docs)}** at up to **{plan['shard_size']} candidates/shard**",
              f"- Outcome-blind candidate evidence prefetched: **{sum(len(x['records']) for x in docs)} / 2,208**",
              f"- Ordered-replay rescue candidates actually attempted: **{rescue_attempt_n}**",
              "- Completion-order invariance check: **PASS**",
              "- Full 6,203-candidate rescan: **NO**",
              f"- Year-cells passing final 4/4 usable-source gate: **{passed_cells} / 108**",
              f"- Replayed-prefix combined unresolved transport candidates: **{transport_n} / 6203**; cap **62**",
              "",
              "## Final R6 fully usable league counts",
              "",
              "| Year | Early | Mid | Late |",
              "|---:|---:|---:|---:|",
          ]
          for y in range(2018,2024):
              vals=[cells[f"{y}:r6_{part}"]["fully_usable_league_n"] for part in ("early","mid","late")]
              lines.append(f"| {y} | {vals[0]} | {vals[1]} | {vals[2]} |")

          if deficient:
              lines += [
                  "",
                  "## Remaining deficient cells",
                  "",
                  "| Year | Cell | Fully usable | Shortfall |",
                  "|---:|---|---:|---:|",
              ]
              for x in deficient:
                  lines.append(
                      f"| {x['draft_year']} | {x['cell']} | "
                      f"{x['fully_usable_league_n']} | {x['shortfall']} |"
                  )

          lines += [
              "",
              "All counted source leagues contribute exactly four retained, identity-resolved, Sleeper-ready occurrences.",
              "",
              "Shard completion order cannot affect selected rescue leagues: the reducer reconstructs and replays the exact frozen candidate order.",
              "",
              "No historical NFL outcomes, 2024 outcomes, market/KTC values, package votes, candidate fits, candidate scores, or production values were read."
          ]
          (out/"v8_phase0c_incremental_r6_rescue.md").write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY

      - name: Validate V3 deterministic closeout and firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"assembled"
          s=json.loads((out/"v8_phase0c_incremental_r6_rescue.json").read_text())
          e=json.loads((out/"v8_phase0c_incremental_exact_evidence.json").read_text())

          assert s["candidate_universe_total_n"]==6203
          assert s["phase0b_cells_reused_without_refetch"]==91
          assert s["phase0c_target_cell_n"]==17
          assert s["phase0c_target_round"]=="R6"
          assert s["original_total_shortfall"]==80
          assert s["shard_size"]==16
          assert s["shard_n"]==141
          assert s["candidate_evidence_prefetched_n"]==2208
          assert s["full_6203_rescan_performed"] is False
          assert s["ordered_reducer_completion_order_invariance_pass"] is True
          assert s["year_cell_n"]==108
          assert len(s["year_cell"])==108
          assert s["historical_outcome_ingestion_authorized"] is False
          assert s["holdout_2024_outcomes_read"] is False
          assert s["production_change_authorized"] is False
          assert all(v is False for v in s["firewalls"].values())
          assert s["transport"]["prefetched_after_stop_excluded_from_gate"] is True

          assert e["ordered_reducer_completion_order_invariance_pass"] is True
          assert e["historical_player_outcomes_read"] is False
          assert e["holdout_2024_outcomes_read"] is False
          assert e["candidate_fit_performed"] is False
          assert e["production_change_authorized"] is False

          allowed={
              "PROCEED_TO_V8_PHASE1_INCREMENTAL_SOURCE_IDENTITY_FREEZE",
              "STOP_AND_PREREGISTER_V8_PHASE0D_TARGETED_SOURCE_EXPANSION_BEFORE_OUTCOMES",
          }
          assert s["decision"] in allowed
          print(
              "PASS: V3 sharded Phase 0C closeout is outcome-sealed, "
              "complete-order invariant, and selection-equivalent to the frozen ordered scan."
          )
          PY

      - name: Upload Phase 0C V3 incremental closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p0c-incremental-r6-rescue-v3-closeout
          path: ${{ runner.temp }}/assembled/
          if-no-files-found: error
          retention-days: 30
