# QF11 V6 research only: no voter link, no active ballots, no production or Market Value writes.
name: QF11 V6R1 - Archived KTC Catalog Final Guard Repair (Read Only)
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF11_V6_INPUT: /tmp/qf11-v6-input
  QF11_V6_OUTPUT: /tmp/qf11-v6-output
jobs:
  research:
    name: Design 28 vote opportunities from two verified matching-cohort research archives, no activation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout pinned main with read-only credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install unchanged regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin all published market, current FV, uncertainty and frozen science sources
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP non-main dispatch''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP checkout SHA mismatch''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP dirty checkout''; exit 1; }

        git merge-base --is-ancestor 590afe6046aabe3937a4c360c9c1e93a9cf1e08d HEAD || { echo ''STOP QF10 deployed
        uncertainty lineage missing''; exit 1; }

        git merge-base --is-ancestor f31f267c6b766aeb3679b255355d8d681d963058 HEAD || { echo ''STOP QF11 V3 lineage
        missing''; exit 1; }

        git merge-base --is-ancestor b368974c6c814ec4c816595d090d7e740b96361b HEAD || { echo ''STOP QF11 V5 lineage
        missing''; exit 1; }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP source pin changed $1"; exit 1; }; }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        pin scripts/validation/evaluate_market_history.py 121fc506d5a5b3c949a1a3951cd92b3bcbb23a58

        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo ''QF11_V6_GOVERNED_SOURCE_PINS_GREEN''

        '
    - name: Retrieve immutable V3 source-aligned market/provenance research artifact
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v6-input/v3
    - name: Retrieve immutable V5 full-voter leave-one-out research artifact
      uses: actions/download-artifact@v4
      with:
        name: QF11-v5-RESEARCH-ONLY-full-voter-LOO
        run-id: 38207614774
        github-token: ${{ github.token }}
        path: /tmp/qf11-v6-input/v5
    - name: Cross-check archived source hashes, model FV, and construct bounded research-only KTC catalog
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/qf11-v6-research.py <<'QF11_V6_PY'\n#!/usr/bin/env python3\n\"\"\"Research-only\
        \ source-aligned KTC-style 3-player catalog design (NOT activated).\nUses two immutable aggregate GitHub\
        \ Actions artifacts produced from the same ballot cohort.\nDoes not ingest or retain votes or voter IDs;\
        \ does not set market publication thresholds.\n\"\"\"\nfrom __future__ import annotations\nimport collections,hashlib,json,math,os,statistics,sys,zipfile\n\
        from pathlib import Path\n\nroot=Path.cwd()\nbase=Path(os.getenv('QF11_V6_INPUT','/tmp/qf11-v6-input'))\n\
        output=Path(os.getenv('QF11_V6_OUTPUT','/tmp/qf11-v6-output'))\noutput.mkdir(parents=True,exist_ok=True)\n\
        \ndef read_exact(folder,name,expected):\n    p=base/folder/name\n    raw=p.read_bytes()\n    digest=hashlib.sha256(raw).hexdigest()\n\
        \    assert digest==expected,f'STOP archived file digest mismatch {name} {digest}'\n    return json.loads(raw)\n\
        \ncohort=read_exact('v3','PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json','19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc')\n\
        summary3=read_exact('v3','PROSPECTIVE_NOT_FOR_PUBLICATION_summary.json','dd4a06f08a679145469fbb92c5e663d6bd80ab764575eb0fd9e1a0cb2412e0aa')\n\
        full=read_exact('v5','RESEARCH_ONLY_per_player_anonymous_influence.json','a2e6b6117be069983ba0dbd448ed4f5087cc09f6df1b876b0d34d214e1aa7c9e')\n\
        summary5=read_exact('v5','RESEARCH_ONLY_full_voter_LOO_summary.json','5afadb8652cffc024ba883bdc93cb39061231ad14e6361f7cdeee1d7eb36188c')\n\
        assert summary3['source_after_daily_cap_sha256']==full['source_after_daily_cap_sha256']==summary5['source_after_daily_cap_sha256']=='a0ed9f867883d9013cbee69a0136586a22223571f5f57d4f0627d5d77fd6d2b2',\
        \ 'STOP ballot source drift'\nassert summary3['covered_players']==summary5['prospective_covered_players']==504\n\
        assert summary3['eligible_rows']==summary5['eligible_ballots']==972\nassert summary5['distinct_voters']==35\
        \ and summary5['voters_evaluated']==35\nassert summary5['publication_authorized'] is False and summary5['threshold_selected']\
        \ is False\nassert cohort['research_only'] and cohort['deployment_authorized'] is False\nmarket=cohort['players'];\
        \ influences=full['players']\nassert len(market)==len(influences)==504 and set(market)==set(influences)\n\
        assert summary5['market_rank_cohorts']['top25']['players_any_fixed_universe_abs_500_or_more']==21\nassert\
        \ sum((r.get('worst_abs_point_movement_same_universe_only') or 0)>=500 for r in influences.values())==196\n\
        for key,rec in market.items():\n    ix=influences[key]\n    assert rec['market_value']==ix['prospective_market_value']\n\
        \    assert rec['market_rank']==ix['prospective_market_rank']\n    assert rec['fundamental_value']==ix['prospective_fv_center']\n\
        \    assert rec['pos']==ix['position']\n    assert ix['scenario_count_player_retained']+ix['voters_removed_in_which_player_disappears']==35\n\
        \    assert rec['evidence']['direct_distinct_voters']==ix['direct_distinct_voters']\n\n# The candidate must\
        \ be tied to current FV without using old published market centers.\nif (root/'index.html').is_file():\n\
        \    sys.path.insert(0,str(root))\n    from scripts.validation import snapshot_values\n    actual=snapshot_values.compute_all_values(snapshot_values.load_from_html(root/'index.html'))\n\
        \    assert len(actual)==565\n    assert all(actual[k]['value']==r['fundamental_value'] and actual[k]['pos']==r['pos']\
        \ for k,r in market.items()), 'STOP current FV mismatch'\n    old=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())\n\
        \    assert set(market)==set(old['players'])\n    stale=[k for k in market if old['players'][k]['fundamental_value']!=actual[k]['value']]\n\
        \    assert len(stale)==52 and all(market[k]['pos']=='RB' for k in stale), 'STOP expected historic stale-market\
        \ cohort changed'\n\nordered=sorted(market,key=lambda k:(market[k]['market_rank'],k))\nmarket_order={k:i+1\
        \ for i,k in enumerate(ordered)}\npositions=('QB','RB','WR','TE','DL','LB','DB')\ncounts=collections.Counter();\
        \ used_triplet_keys=set();triplets=[]\n# Stable, descriptive priority for allocating FUTURE EVIDENCE requests;\
        \ NOT a valuation cutoff.\n# Local vulnerability scores are capped to avoid a single extreme outlier monopolizing\
        \ slots.\ndef priority(k):\n    rec=market[k];e=rec['evidence'];i=influences[k]\n    rank=market_order[k]\n\
        \    fixed=i['worst_abs_point_movement_same_universe_only'] or 0\n    same=e['same_position_pairwise_observations']\n\
        \    return (\n        (7 if rank<=25 else 4 if rank<=100 else 0)\n        +min(8, int(fixed//250))\n  \
        \      + (3 if same==0 else 2 if same<=2 else 0)\n        + (2 if i['direct_distinct_voters']<=2 else 1\
        \ if i['direct_distinct_voters']<=4 else 0)\n    )\ndef ratio(a,b):\n    return max(a,b)/max(1,min(a,b))\n\
        def fv(k):return market[k]['fundamental_value']\n# Exclude known review-exception candidates; all other\
        \ player eligibility still requires human review.\nEXCLUDE={'aaron donald','joe mixon'}\ndef eligible(k):return\
        \ k not in EXCLUDE and fv(k)>0 and counts[k]<2\n\n# Each proposed three-way Keep/Trade/Cut task places two\
        \ SAME-position players\n# and one CROSS-position player, balanced across seven positions. No votes sent.\n\
        for n in range(4):\n    for pos in positions:\n        cohort_keys=[k for k in ordered if market[k]['pos']==pos\
        \ and eligible(k)]\n        cohort_keys.sort(key=lambda k:(-priority(k),market_order[k],k))\n        found=None\n\
        \        for a in cohort_keys:\n            for b in sorted((x for x in cohort_keys if x!=a and eligible(x)),key=lambda\
        \ x:(ratio(fv(a),fv(x)),-priority(x),market_order[x],x)):\n                if ratio(fv(a),fv(b))>2.25:continue\n\
        \                desired=(fv(a)+fv(b))/2\n                third=[k for k in ordered if market[k]['pos']!=pos\
        \ and k not in (a,b) and eligible(k)]\n                third.sort(key=lambda k:(ratio(desired,fv(k)),-priority(k),market_order[k],k))\n\
        \                if not third:continue\n                for c in third:\n                    if ratio(desired,fv(c))>2.5:break\n\
        \                    if tuple(sorted((a,b,c))) in used_triplet_keys:continue\n                    found=(a,b,c);break\n\
        \                if found:break\n            if found:break\n        assert found is not None,f'STOP no\
        \ feasible research ballot in round {n+1} position {pos}'\n        a,b,c=found\n        assert a!=b!=c and\
        \ a!=c\n        used_triplet_keys.add(tuple(sorted(found)))\n        for k in found:counts[k]+=1\n     \
        \   assert max(counts.values())<=2\n        vals=[fv(k) for k in found]\n        tid=len(triplets)+1\n \
        \       triplets.append({'slot':tid,'audit_pair_position':pos,'player_keys':list(found),\n             \
        \            'fv_spread_ratio':round(max(vals)/min(vals),3),\n                         'number_prior_same_position_observations':sum(market[k]['evidence']['same_position_pairwise_observations']\
        \ for k in found),\n                         'minimum_distinct_direct_voters':min(influences[k]['direct_distinct_voters']\
        \ for k in found),\n                         'research_only':True})\nassert len(triplets)==28 and sum(counts.values())==84\n\
        assert len({tuple(sorted(t['player_keys'])) for t in triplets})==28\nassert all(sum(market[k]['pos']==t['audit_pair_position']\
        \ for k in t['player_keys'])==2 for t in triplets)\nassert all(max(counts.values(),default=0)<=2 for _ in\
        \ (0,))\nassert set(t['audit_pair_position'] for t in triplets)==set(positions)\nassert all(t['fv_spread_ratio']<=2.5\
        \ for t in triplets)\n\n# A scenario forecast of collected voting WOULD be unjustified; report exposure\
        \ opportunities only.\ntargets=sorted(counts)\ncoverage={\n 'catalog_triplets':len(triplets),\n 'distinct_players':len(targets),\n\
        \ 'player_placements':sum(counts.values()),\n 'max_appearances_per_player':max(counts.values()),\n 'two_same_position_plus_one_cross_position_each':True,\n\
        \ 'same_position_pair_opportunities':len(triplets),\n 'cross_position_pair_opportunities':2*len(triplets),\n\
        \ 'positions_as_same_pair':dict(sorted(collections.Counter(t['audit_pair_position'] for t in triplets).items())),\n\
        \ 'top25_players_included':sum(k in ordered[:25] for k in targets),\n 'top100_players_included':sum(k in\
        \ ordered[:100] for k in targets),\n 'players_with_zero_prior_same_position_pairs':sum(market[k]['evidence']['same_position_pairwise_observations']==0\
        \ for k in targets),\n 'players_with_one_or_two_direct_voters':sum(influences[k]['direct_distinct_voters']<=2\
        \ for k in targets),\n 'players_with_fixed_universe_move_500plus':sum((influences[k]['worst_abs_point_movement_same_universe_only']\
        \ or 0)>=500 for k in targets),\n 'median_ballot_fv_spread_ratio':round(statistics.median(t['fv_spread_ratio']\
        \ for t in triplets),3),\n 'max_ballot_fv_spread_ratio':max(t['fv_spread_ratio'] for t in triplets),\n}\n\
        output_catalog={'status':'PROPOSED_NOT_APPROVED_NOT_LAUNCHED','kind':'KTC_STYLE_KEEP_TRADE_CUT_NOT_PACKAGE_ADJUSTMENT_MOCK_TRADES',\n\
        \    'source_after_daily_cap_sha256':summary3['source_after_daily_cap_sha256'],\n    'provenance':'exact\
        \ archived V3 prospective market plus V5 exhaustive LOO using same ballot SHA',\n    'catalog_version':'QF11_V6_PROPOSED_VOTE_COVERAGE_V1','ordered_players_are_not_ranked_sides':True,\n\
        \    'eligibility_review_required':True,'owner_approval_required':True,'no_ballots_created_or_votes_collected':True,\n\
        \    'allocation_priority_is_not_evidence_sufficiency_threshold':True,\n    'catalog':triplets,'coverage':coverage}\n\
        summary={'status':'RESEARCH_ONLY_VOTE_ACQUISITION_DESIGN','source_hash':summary3['source_after_daily_cap_sha256'],\n\
        \         'archived_ballots':972,'distinct_voters_prior':35,'market_players':504,\n         'loo_players_500point_any':315,'loo_players_500point_fixed_universe':196,\n\
        \         'loo_top25_500point_fixed_universe':21,\n         'historical_published_market_reconstruction':False,\n\
        \         'new_ballot_evidence_observed':False,\n         'future_stability_improvement_demonstrated':False,\n\
        \         'new_vote_exposure_opportunities_are_not_independent_voters':True,\n         'vote_catalog_only_after_human_eligibility_review_and_owner_approval':True,\n\
        \         'market_publication_authorized':False,'threshold_selected':False,'coverage':coverage}\nmethodology='''#\
        \ QF11 V6 — Source-aligned KTC-style voting catalog (research only)\n\nThis is **not** mock-trade voting,\
        \ is **not** an active public ballot link, and is **not** an authorization to publish market prices.\n\n\
        Both anonymous source artifacts share the exact eligible-ballot SHA256. V3 market evidence and V5 35-voter\
        \ leave-one-out sensitivity refer to the same 972 counted KTC-style Keep/Trade/Cut ballots. Neither reproduces\
        \ the archived October 7 published Market Value raw vote snapshot.\n\nCatalog design: 28 proposed three-player\
        \ ballots; four anchored same-position pairs from each of QB/RB/WR/TE/DL/LB/DB. Each ballot includes two\
        \ players of that position and one cross-position player. At most two catalog appearances per player. Pair\
        \ similarity based on unchanged live Fundamental Value; risk triage based on retrospective prospective-market\
        \ ranking, same-position observations, distinct direct voters and fixed-universe leave-one-out movement.\
        \ Priority formula is a *descriptive research allocation* — NOT a minimum-votes release gate. Pair FV ratios\
        \ are constrained by 2.25 for the same-position pair and 2.5 for the cross-position comparator. No candidate\
        \ market price is visible to voters and no voting UI is deployed.\n\n**Important:** one triplet creates\
        \ only one same-position *pairing opportunity*. Without distinct additional human voters, it cannot be assumed\
        \ to increase independent evidence or reduce voting-model volatility. Plans based on observed sensitivity\
        \ can overfit this cohort. Prior to using any ballots, verify current player eligibility, status, position,\
        \ realistic pairing, and user/owner approval. Aaron Donald and Joe Mixon are excluded as known review exceptions.\
        \ Do not reuse a fixed ordering as implicit preference; presentation position should be randomized after\
        \ approval.\n\nNo voter IDs or ballot strings are read, stored, or published. This artifact contains only\
        \ player names and aggregate prospective statistics. The proposed catalog is NOT released to public voting\
        \ and no vote-weight policy, model price, Fundamental Value, Package Adjustment, Team Utility or production\
        \ file changes.\n'''\nfor fn,obj in [('RESEARCH_ONLY_proposed_28_triplets_NOT_FOR_VOTERS.json',output_catalog),('RESEARCH_ONLY_catalog_summary.json',summary)]:\n\
        \    (output/fn).write_text(json.dumps(obj,indent=2,sort_keys=True)+'\\n')\n(output/'RESEARCH_ONLY_design_notes.md').write_text(methodology)\n\
        for p in output.iterdir():\n    s=p.read_text()\n    assert not any(x in s for x in ('voter_roster_id','raw_ballots','guest_identifier','sheet_url','ballot_weight','voter_id')),f'STOP\
        \ private field {p}'\nprint('QF11_V6_SOURCE_ALIGNED_GREEN '+json.dumps({'ballot_source_sha256':summary3['source_after_daily_cap_sha256'],'covered_players':len(market),'voters':35,'archived_ballots':972,'two_artifacts_exact_cohort':True,'publication_authorized':False},sort_keys=True))\n\
        print('QF11_V6_DESCRIPTIVE_CATALOG '+json.dumps(coverage,sort_keys=True))\nprint('QF11_V6_REVIEW_HOLD owner_approval=False\
        \ voting_activated=False future_voter_count_unknown=True no_market_promotion=True')\nprint('QF11_V6_OUTPUT_SHA256\
        \ '+json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in output.iterdir()},sort_keys=True))\n\
        \nQF11_V6_PY\npython3 -m py_compile /tmp/qf11-v6-research.py\npython3 /tmp/qf11-v6-research.py\n"
    - name: Run frozen live valuation and package, FA, IDP, Team Utility regression guards
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''QF11_V6_14_REGRESSION_GROUPS_GREEN''

        '
    - name: Ensure no repository writes or protected source drift
      shell: bash
      run: 'set -euo pipefail

        # Every GitHub Actions run: command step gets a fresh shell. Re-declare pin here.

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP protected source drift $1"; exit 1; }; }

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo ''STOP repository write''; exit 1; }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        pin scripts/validation/evaluate_market_history.py 121fc506d5a5b3c949a1a3951cd92b3bcbb23a58

        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP branch changed''; exit 1; }

        [[ "$(find /tmp/qf11-v6-output -maxdepth 1 -type f | wc -l)" -eq 3 ]] || { echo ''STOP output shape drift'';
        exit 1; }

        # Byte-for-byte outputs from the successfully computed and independently pinned V3/V5 cohort.

        check_output(){ [[ "$(sha256sum "$1" | cut -d" " -f1)" == "$2" ]] || { echo "STOP catalog output integrity $1"; exit 1; }; }

        check_output /tmp/qf11-v6-output/RESEARCH_ONLY_catalog_summary.json 93c3c83d8c2717df289761ac03ce043f877ead076439cd1b20fa65e0f57c7207

        check_output /tmp/qf11-v6-output/RESEARCH_ONLY_design_notes.md 0c667c5ea5b420b9456a4bf699dc1ca492ba703e5f14cd44ab46c66cd135ed58

        check_output /tmp/qf11-v6-output/RESEARCH_ONLY_proposed_28_triplets_NOT_FOR_VOTERS.json 627a6774170cccfef94be80ce8c892734de47c1b195e2298ca69fe85cb6154ec

        echo ''QF11_V6R1_ZERO_WRITE_GREEN repository unchanged, archived catalog SHA256 verified, no voting activated''

        '
    - name: Archive proposed catalog for owner/eligibility review, seven-day expiration
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v6-RESEARCH-ONLY-unactivated-vote-catalog
        path: /tmp/qf11-v6-output/
        retention-days: 7
        if-no-files-found: error
