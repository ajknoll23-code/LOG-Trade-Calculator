# QF6 / A5-F04 — isolated review candidate for a VISIBLE incomplete starter warning.
# REVIEW BRANCH ONLY: no main commit, no Pages write, no frozen valuation edits.
# QF6 Phase 0 proof: run 38138318925. Requires 17 starters (including K).
name: QF6 V2R1 - Visible Missing Starter Warning Review Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf6-review-only:
    name: One-file presentation-only warning with real UI and frozen regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QF6_BASE: '84b6a3f9e3f2e247a8863bcb8bf702038eff2e5e'
      QF6_REVIEW_BRANCH: 'qf6-a5f04-v2r1-visible-warning-review-2026-10-11'
      QF6_TMP: '/tmp/log-qf6-v2r1'
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned-repo checks and Chrome driver harness dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Fail closed on main, approved production hashes and unused review branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP checkout changed'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main moved'; exit 1; }
          git merge-base --is-ancestor "${QF6_BASE}" HEAD || { echo 'STOP QF5 lineage missing'; exit 1; }
          check_blob(){ local got; got="$(git hash-object "$1")"; [[ "$got" == "$2" ]] || { echo "STOP pinned protected blob changed: $1 $got"; exit 1; }; }
          check_blob index.html '2666f7f8b167e48b7d1571ab527450b521d32c75'
          check_blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
          check_blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
          check_blob free-agent-board.html '975efe51091a2315475678a9db0842b05c4fc3aa'
          check_blob scripts/validation/validate_free_agent_valuation_parity.py 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
          check_blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
          if git ls-remote --exit-code --heads origin "${QF6_REVIEW_BRANCH}" >/dev/null; then echo 'STOP review branch exists'; exit 1; fi
          echo 'PASS QF6 exact code pins and unclaimed review branch'
      - name: Write isolated patch and exact-source acceptance scripts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${QF6_TMP}"
          cat > "${QF6_TMP}/patch.py" <<'QF6_PATCH_PY'
          #!/usr/bin/env python3
          """QF6 A5-F04: append diagnostic-only warning in live Build Trade; no valuation edits."""
          from pathlib import Path
          import sys
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='function renderTradeImpact(){\n  const wrap = document.getElementById(\'tradeImpactWrap\');'
          helper=r'''/* QF6_A5F04_VISIBLE_STARTER_WARNING_V1
             Presentation-only diagnostic. Same declared slots and eligible positions as
             the existing inline Team Utility optimizer; never changes starter choices,
             valuation, bench weights, projected cuts, or hidden Trade Impact behavior. */
          function qf6LineupCompleteness(keys){
            const players = tuPlayersFromKeys(keys);
            const remaining = players.slice().sort((a,b) => b.value - a.value);
            const missing = [];
            for(const slot of TU_DEDICATED_SLOTS){
              for(let i=0;i<slot.count;i++){
                const at = remaining.findIndex(p => p.pos === slot.pos);
                if(at < 0) missing.push(slot.pos);
                else remaining.splice(at,1);
              }
            }
            const flex = TU_FLEX_SLOTS.map(s => ({...s}));
            let capacity = flex.reduce((n,s)=>n+s.count,0);
            while(capacity > 0){
              let at=-1, chosen=null;
              for(let i=0;i<remaining.length;i++){
                const slot=flex.find(s => s.count>0 && s.eligible.includes(remaining[i].pos));
                if(slot){at=i;chosen=slot;break;}
              }
              if(at<0) break;
              remaining.splice(at,1);
              chosen.count--;
              capacity--;
            }
            for(const slot of flex) for(let i=0;i<slot.count;i++) missing.push(slot.name);
            const required = TU_DEDICATED_SLOTS.reduce((n,s)=>n+s.count,0) +
              TU_FLEX_SLOTS.reduce((n,s)=>n+s.count,0);
            const filled = tuOptimizeLineup(players).starters.length;
            /* Guard any future eligibility drift: show numeric count but never invent a slot label. */
            return {filled,required,missing:missing.length===required-filled?missing:[]};
          }
          function qf6ShowLineupWarning(preKeys,postKeys){
            const sides=document.getElementById('sidesWrap');
            if(!sides) return;
            const existing=document.getElementById('qf6LineupWarning');
            if(existing) existing.remove();
            /* No assertion on an unresolved team or fallback roster with taxi/IR leakage.
               A5-F03 handles fallback-active-roster behavior separately. */
            const team=LEAGUE_ROSTERS && LEAGUE_ROSTERS[MY_ROSTER_ID];
            if(!state.teamConfirmed || !team || !Array.isArray(team.players) ||
               !team.players.some(p=>p.slot==='starters'||p.slot==='bench')) return;
            const before=qf6LineupCompleteness(preKeys);
            const after=qf6LineupCompleteness(postKeys);
            if(before.filled===before.required && after.filled===after.required) return;
            const describe = d => d.filled+'/'+d.required+
              (d.missing.length ? ' (missing '+d.missing.join(', ')+')' : ' (unfilled slots)');
            const warning=document.createElement('div');
            warning.id='qf6LineupWarning';
            warning.setAttribute('role','status');
            warning.setAttribute('aria-live','polite');
            warning.style.cssText='grid-column:1/-1;padding:11px 14px;border:1px solid var(--amber);border-radius:8px;background:var(--panel-alt);color:var(--text);font-size:13px;line-height:1.5;';
            warning.textContent='⚠ Incomplete starting lineup — Before: '+describe(before)+
              ' → After: '+describe(after)+'. Team Utility is calculated with unfilled starter slots; this warning does not change trade value.';
            /* Inside #sidesWrap, so B56 moves it with the Build Trade workspace rather
               than leaving it stranded inside the intentionally retired Trade Impact. */
            sides.appendChild(warning);
          }
          /* QF6_A5F04_VISIBLE_STARTER_WARNING_V1_END */

          function renderTradeImpact(){
            const wrap = document.getElementById('tradeImpactWrap');'''
          assert s.count(old)==1,("missing render anchor",s.count(old))
          s=s.replace(old,helper,1)
          old2='  const teamUtil = calculateTeamUtility(tuBeforeRoster, tuAfterPool);\n  const tuColor = teamUtil.teamUtility >= 0 ? \'var(--green)\' : \'var(--red)\';'
          new2='  const teamUtil = calculateTeamUtility(tuBeforeRoster, tuAfterPool);\n  qf6ShowLineupWarning(tuBeforeRoster, tuAfterPool);\n  const tuColor = teamUtil.teamUtility >= 0 ? \'var(--green)\' : \'var(--red)\';'
          assert s.count(old2)==1,("missing utility anchor",s.count(old2))
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('PASS QF6 scoped presentational change index.html only')
          QF6_PATCH_PY
          cat > "${QF6_TMP}/qa.js" <<'QF6_QA_JS'
          'use strict';
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const index=fs.readFileSync('index.html','utf8');
          const start='const TU_DEDICATED_SLOTS = [';
          const end='function findBuriedTalent(';
          assert.equal(index.split(start).length,2);
          assert.equal(index.split(end).length,2);
          const chunk=index.slice(index.indexOf(start),index.indexOf(end));
          const qf6Start='/* QF6_A5F04_VISIBLE_STARTER_WARNING_V1\n';
          const qf6End='function renderTradeImpact(){';
          assert.equal(index.split(qf6Start).length,2);
          assert.equal(index.split(qf6End).length,2);
          const funcs=index.slice(index.indexOf(qf6Start),index.indexOf(qf6End));
          const full=[];let serial=0;
          for(const [pos,count] of [['QB',2],['RB',3],['WR',3],['TE',2],['K',1],['DL',4],['LB',4],['DB',4]]){
            for(let i=0;i<count;i++){serial++;full.push({key:`f_${pos}_${i}`,pos,value:3000-serial});}
          }
          const players=Object.fromEntries(full.map(x=>[x.key,{pos:x.pos}]));
          const fv=Object.fromEntries(full.map(x=>[x.key,x.value]));
          const context={PLAYER_DB:players,playerValueByKey:key=>fv[key],console};
          vm.createContext(context);
          vm.runInContext(chunk+funcs,context,{filename:'index.html:qf6-real-source'});
          assert.equal(typeof context.qf6LineupCompleteness,'function');
          const cases=[
           ['complete',full,17,[]],
           ['missing_k',full.filter(x=>x.pos!=='K'),16,['K']],
           ['missing_lb',full.filter(x=>x.pos!=='LB'||x.key.endsWith('_0')),16,['LB']],
           ['valid_superflex',full.filter(x=>x.key!=='f_QB_1'),17,[]],
           ['valid_idp_flex',full.filter(x=>x.pos!=='DL'||Number(x.key.split('_').at(-1))<2),17,[]],
           ['no_players',[],0,[]],
          ];
          for(const [name,subset,expected,slots] of cases){
           const data=context.qf6LineupCompleteness(subset.map(p=>p.key));
           assert.equal(data.filled,expected,`${name} filled`);
           if(name!=='no_players') assert.deepEqual(Array.from(data.missing),slots,`${name} missing`);
           assert.equal(data.required,17,`${name} required`);
           assert.equal(context.tuOptimizeLineup(subset).starters.length,expected,`${name} engine count`);
           console.log(`PASS ${name}: ${data.filled}/17 missing=${data.missing.join(',')||'none'}`);
          }
          assert.ok(!funcs.includes('TU_BENCH_WEIGHT ='));
          console.log('PASS QF6 mapping exact 17-slot taxonomy, no changes to core valuation function');
          QF6_QA_JS
          cat > "${QF6_TMP}/browser.py" <<'QF6_BROWSER_PY'
          """Real browser QF6 A5-F04 visible warning tests on staged review candidate."""
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from pathlib import Path
          import threading
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass

          server=ThreadingHTTPServer(('127.0.0.1',0),partial(QuietHandler,directory=str(Path.cwd())))
          th=threading.Thread(target=server.serve_forever,daemon=True)
          th.start()
          options=Options()
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1365,960']:
              options.add_argument(x)
          try:
              with webdriver.Chrome(options=options) as driver:
                  driver.set_page_load_timeout(45)
                  driver.get(f'http://127.0.0.1:{server.server_port}/index.html')
                  WebDriverWait(driver,25).until(lambda d:d.execute_script('''return typeof qf6ShowLineupWarning === 'function' && !!document.querySelector('.td-tab-pane[data-tab="build"]') && !!document.querySelector('.td-retired-team-impact')'''))
                  data=driver.execute_script('''
                    const target={QB:2,RB:3,WR:3,TE:2,K:1,DL:4,LB:4,DB:4};
                    const entries=Object.entries(PLAYER_DB);
                    const sample=[];
                    for(const [pos,count] of Object.entries(target)){
                      const pool=entries.filter(([key,info])=>info.pos===pos && Number(playerValueByKey(key))>0);
                      if(pool.length<count)throw new Error('QF6 missing real fixture at '+pos);
                      sample.push(...pool.slice(0,count).map(([key])=>key));
                    }
                    const withoutK=sample.filter(key=>PLAYER_DB[key].pos!=='K');
                    const withoutLB=sample.filter(key=>PLAYER_DB[key].pos!=='LB'||key===sample.find(k=>PLAYER_DB[k].pos==='LB'));
                    const before=qf6LineupCompleteness(sample);
                    const afterK=qf6LineupCompleteness(withoutK);
                    const afterLB=qf6LineupCompleteness(withoutLB);
                    if(before.filled!==17 || afterK.filled!==16 || afterLB.filled!==16)throw new Error('QF6 fixture unsupported '+JSON.stringify({before,afterK,afterLB}));
                    LEAGUE_ROSTERS={qf6_fixture:{players:sample.map(key=>({key,slot:'bench'}))}};
                    MY_ROSTER_ID='qf6_fixture';
                    MY_ROSTER=sample.slice();
                    state.teamConfirmed=true;
                    qf6ShowLineupWarning(sample,withoutK);
                    const banner=document.getElementById('qf6LineupWarning');
                    const pane=document.querySelector('.td-tab-pane[data-tab="build"]');
                    const hidden=document.querySelector('.td-retired-team-impact');
                    return {bannerExists:!!banner,bannerText:banner&&banner.textContent,
                      bannerWithinBuild:!!(pane&&banner&&pane.contains(banner)),
                      bannerWithinSides:!!(banner&&document.getElementById('sidesWrap').contains(banner)),
                      bannerVisible:!!(banner&&banner.getBoundingClientRect().height>0&&!banner.closest('[hidden]')),
                      hiddenLegacyImpact:!!(hidden&&hidden.hidden),
                      dataBefore:before,dataAfter:afterK};
                  ''')
                  assert data['bannerExists'] and data['bannerVisible'] and data['bannerWithinBuild'] and data['bannerWithinSides'],data
                  assert data['hiddenLegacyImpact'],data
                  assert 'Before: 17/17' in data['bannerText'] and 'After: 16/17 (missing K)' in data['bannerText'],data
                  print('PASS QF6 visible Build Trade warning for missing K; retired Team Impact still hidden')
                  lb=driver.execute_script('''
                    const sample=MY_ROSTER.slice();
                    const withoutLB=sample.filter(key=>PLAYER_DB[key].pos!=='LB'||key===sample.find(k=>PLAYER_DB[k].pos==='LB'));
                    qf6ShowLineupWarning(sample,withoutLB);
                    return document.getElementById('qf6LineupWarning')?.textContent;
                  ''')
                  assert lb and 'After: 16/17 (missing LB)' in lb,lb
                  print('PASS QF6 warning identifies missing mandatory LB')
                  completed=driver.execute_script('''
                    qf6ShowLineupWarning(MY_ROSTER,MY_ROSTER);
                    return document.getElementById('qf6LineupWarning')===null;
                  ''')
                  assert completed
                  print('PASS QF6 no false banner for 17/17 lineup')
                  noRoster=driver.execute_script('''
                    qf6ShowLineupWarning(MY_ROSTER,MY_ROSTER.filter(x=>PLAYER_DB[x].pos!=='K'));
                    state.teamConfirmed=false;
                    qf6ShowLineupWarning(MY_ROSTER,MY_ROSTER.filter(x=>PLAYER_DB[x].pos!=='K'));
                    return document.getElementById('qf6LineupWarning')===null;
                  ''')
                  assert noRoster
                  print('PASS QF6 unresolved team fails closed')
                  tab=driver.execute_script('''
                    state.teamConfirmed=true;
                    qf6ShowLineupWarning(MY_ROSTER,MY_ROSTER.filter(x=>PLAYER_DB[x].pos!=='K'));
                    document.querySelector('[data-td-tab="team"]').click();
                    const warning=document.getElementById('qf6LineupWarning');
                    const hidden=document.querySelector('.td-retired-team-impact');
                    return {teamOpen:!document.querySelector('.td-tab-pane[data-tab="team"]').hidden,
                      warningNotVisible:!!(warning&&warning.closest('[hidden]')),
                      impactStillHidden:!!(hidden&&hidden.hidden)};
                  ''')
                  assert tab['teamOpen'] and tab['warningNotVisible'] and tab['impactStillHidden'],tab
                  print('PASS QF6 tab scoping: warning in Build Trade only; retired Team Impact remains hidden')
          finally:
              server.shutdown()
              server.server_close()
          QF6_BROWSER_PY
          python3 - <<'PY'
          import ast,os
          from pathlib import Path
          p=Path(os.environ['QF6_TMP'])
          for name in ('patch.py','browser.py'): ast.parse((p/name).read_text(encoding='utf-8'))
          print('PASS compiled isolated QF6 patch/browser scripts')
          PY
          node --check "${QF6_TMP}/qa.js"
      - name: Apply narrowly scoped presentation-only candidate to disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 "${QF6_TMP}/patch.py"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed==['index.html'],f'QF6 STOP modified beyond UI-only file: {changed}'
          s=Path('index.html').read_text()
          assert s.count('QF6_A5F04_VISIBLE_STARTER_WARNING_V1')==2
          assert s.count('qf6ShowLineupWarning(tuBeforeRoster, tuAfterPool);')==1
          assert s.count("impactShell.hidden = true;")==1
          assert s.count("impactShell.setAttribute('aria-hidden', 'true');")==1
          assert "const TU_BENCH_WEIGHT = 0.15;" in s
          print('PASS only index.html changed; retired B56 impact remains hidden and 85/15 weighting intact')
          PY
          git diff --check
      - name: Test actual legacy optimizer, incomplete slot diagnostics and protected logic
        shell: bash
        run: |
          set -euo pipefail
          node "${QF6_TMP}/qa.js"
          node scripts/team_utility_projection_runtime.js --selftest
          python3 scripts/projections/build_team_utility_lineup_projections.py --check
      - name: Run real headless Chrome for visible Build Trade 17/17 to 16/17 warning
        shell: bash
        run: |
          set -euo pipefail
          python3 "${QF6_TMP}/browser.py"
      - name: Run 14 full repo regression groups and frozen guard controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/sync/sync_free_agent_valuation.py --check
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as guard
          result=guard.validate_deployment()
          assert result['actual_changed_entry_count']==320,'STOP frozen IDP count drift'
          print('PASS frozen IDP V1 320 changes / 84 holds')
          PY
      - name: Final exact diff, no branch overwrite and publish review-only commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert changed==['index.html'],f'QF6 STOP changed-file allowlist: {changed}'
          protected={
           'scripts/team_utility_projection_runtime.js':'1620edf05e56a56b4a874c71b32777a443422de5',
           'free-agent-board.html':'975efe51091a2315475678a9db0842b05c4fc3aa',
           'scripts/validation/validate_free_agent_valuation_parity.py':'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc',
          }
          for path,sha in protected.items():
           assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,f'STOP modified protected {path}'
          print('PASS single-file UI review candidate; all frozen files exact')
          PY
          git diff --check
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main advanced during review'; exit 1; }
          if git ls-remote --exit-code --heads origin "${QF6_REVIEW_BRANCH}" >/dev/null; then echo 'STOP review branch exists'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${QF6_REVIEW_BRANCH}"
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || { echo 'STOP staged file changed'; exit 1; }
          git diff --cached --check
          git commit -m 'QF6 A5-F04: visible missing-starter warning only (review)'
          git push --force-with-lease="refs/heads/${QF6_REVIEW_BRANCH}:" origin "HEAD:refs/heads/${QF6_REVIEW_BRANCH}"
          echo "QF6 V2R1 REVIEW GREEN branch=${QF6_REVIEW_BRANCH} commit=$(git rev-parse HEAD)"
          echo "QF6 source baseline=${GITHUB_SHA}; no main write. Review Green is not production authorization."
      - name: Clean up temporary test scripts
        if: always()
        shell: bash
        run: rm -rf /tmp/log-qf6-v2r1
