name: B35 Weekly Floor Ceiling Volatility V1 - Phase 0 Preregistration and Source Contract
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SELF_WORKFLOW: B35-weekly-floor-ceiling-volatility-v1-phase0-preregistration-source-contract.yml
jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Capture base SHA and guard unopened study
      id: base
      shell: bash
      run: |
        set -euo pipefail
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        test ! -e research/weekly-floor-ceiling-volatility-v1 || {
          echo "ERROR: weekly-floor-ceiling-volatility-v1 already exists; refusing to overwrite preregistration."
          exit 1
        }
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Snapshot production surfaces
      shell: bash
      run: |
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Write frozen Phase 0 preregistration
      env:
        BASE_SHA: ${{ steps.base.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        from __future__ import annotations

        import json
        import os
        from datetime import datetime, timezone
        from pathlib import Path

        ROOT = Path(".")
        OUT = ROOT / "research/weekly-floor-ceiling-volatility-v1"
        OUT.mkdir(parents=True, exist_ok=True)

        now = datetime.now(timezone.utc).isoformat()
        base_sha = os.environ["BASE_SHA"]

        doc = {
            "schema_version": 1,
            "study_id": "weekly-floor-ceiling-volatility-v1",
            "phase": 0,
            "status": "PREREGISTERED_SOURCE_CONTRACT_ONLY",
            "created_at_utc": now,
            "repo_base_sha": base_sha,
            "research_only": True,
            "production_change_authorized": False,
            "outcome_association_opened": False,
            "source_contract": {
                "primary_provider_candidate": "4for4",
                "required_input_type": "explicit player-level weekly floor and ceiling fields",
                "central_projection_optional": True,
                "synthetic_floor_or_ceiling_from_mean_projection_allowed": False,
                "synthetic_distribution_from_historical_variance_allowed": False,
                "raw_licensed_provider_rows_may_be_committed": False,
                "row_level_provider_output_may_be_committed": False,
                "aggregate_validation_metadata_may_be_committed": True,
                "source_hashes_may_be_committed": True,
                "private_local_ingestion_required": True,
                "fail_closed_if_floor_ceiling_semantics_undocumented": True,
                "fail_closed_if_fields_are_not_explicitly_week_specific": True,
            },
            "scope": {
                "positions_v1": ["QB", "RB", "WR", "TE"],
                "scoring_lens": "HALF_PPR_ONLY",
                "idp_included": False,
                "kicker_included": False,
                "weekly_only": True,
                "ros_or_playoff_aggregation_in_v1": False,
                "player_identity_unit": "player x NFL week x source snapshot",
                "bye_weeks": "unavailable_not_neutral",
                "missing_source_row": "unavailable_not_neutral",
            },
            "frozen_display_constructs": {
                "floor_strength": {
                    "definition": "within-position weekly percentile of provider floor",
                    "direction": "higher is stronger",
                    "raw_point_display_authorized_now": False,
                },
                "ceiling_strength": {
                    "definition": "within-position weekly percentile of provider ceiling",
                    "direction": "higher is stronger",
                    "raw_point_display_authorized_now": False,
                },
                "volatility_width": {
                    "definition": "provider ceiling minus provider floor",
                    "normalization": "within-position weekly percentile of positive width",
                    "direction": "higher means wider provider outcome band",
                    "interpretation": "dispersion context only; never synonymous with risk, quality, or expected points",
                    "raw_point_display_authorized_now": False,
                },
                "overall_score": {
                    "authorized": False,
                    "reason": "V1 keeps floor, ceiling, and width conceptually separate.",
                },
            },
            "prohibited_transformations_before_source_semantics_freeze": [
                "weight floor versus ceiling",
                "combine floor strength and ceiling strength into one score",
                "convert width into a penalty or bonus",
                "infer quantile probabilities not explicitly documented by the provider",
                "derive floor/ceiling from current FV, market value, ADP, or projection residuals",
                "choose position-specific thresholds after viewing outcomes",
            ],
            "identity_contract": {
                "fuzzy_name_only_production_join_allowed": False,
                "must_use_existing_reviewed_identity_layer_before_any_player-facing display": True,
                "ambiguous_identity": "unavailable",
                "unresolved_identity": "unavailable",
            },
            "governance": {
                "fundamental_value_effect_authorized": False,
                "package_adjustment_effect_authorized": False,
                "team_utility_effect_authorized": False,
                "trade_value_effect_authorized": False,
                "trade_verdict_effect_authorized": False,
                "market_value_effect_authorized": False,
                "projection_adjustment_authorized": False,
                "schedule_utility_effect_authorized": False,
                "user_facing_display_authorized": False,
                "raw_numeric_floor_ceiling_display_authorized": False,
            },
            "phase_plan": [
                {
                    "phase": "1A",
                    "name": "private source/schema feasibility",
                    "outcomes_open": False,
                    "purpose": "verify explicit weekly floor/ceiling fields, coverage, scoring lens, source timestamp, and non-public licensing path",
                },
                {
                    "phase": "1B",
                    "name": "source semantics and validation preregistration",
                    "outcomes_open": False,
                    "purpose": "freeze provider field meanings, documented probability/quantile semantics if any, and exact Phase 2 validation gates before outcomes",
                },
                {
                    "phase": 2,
                    "name": "retrospective validation",
                    "outcomes_open": True,
                    "purpose": "test only the validation metrics frozen in Phase 1B",
                },
                {
                    "phase": 3,
                    "name": "prospective shadow",
                    "outcomes_open": True,
                    "purpose": "collect untouched future weekly snapshots before kickoff under frozen rules",
                },
                {
                    "phase": 4,
                    "name": "display-only production consideration",
                    "outcomes_open": True,
                    "purpose": "consider non-FV display only for constructs that independently pass required gates",
                },
            ],
            "phase1a_pass_requirements": {
                "provider_is_4for4_or_explicitly_reapproved_before_ingestion": True,
                "explicit_floor_field_present": True,
                "explicit_ceiling_field_present": True,
                "week_specific_rows_or_columns_present": True,
                "source_capture_timestamp_available": True,
                "scoring_lens_identifiable": True,
                "positions_qb_rb_wr_te_identifiable": True,
                "raw_licensed_rows_remain_private": True,
                "no_outcome_data_read": True,
            },
            "phase1a_decisions": [
                "PASS_PRIVATE_SOURCE_FEASIBILITY_ADVANCE_TO_1B",
                "STOP_SOURCE_PATH_AND_REDESIGN_BEFORE_OUTCOMES",
            ],
            "scientific_notes": [
                "A provider band can be useful display context even if its literal nominal coverage is undocumented; however, no coverage claim may be made until semantics are frozen.",
                "Volatility width is a descriptive provider-band property, not an independently validated player-risk construct.",
                "Any later raw point display requires stronger validation than percentile/band display.",
                "Failure of one construct does not automatically invalidate the other two; production consideration is construct-specific.",
            ],
        }

        json_path = OUT / "weekly_floor_ceiling_volatility_v1_phase0_prereg.json"
        json_path.write_text(json.dumps(doc, indent=2, sort_keys=True) + "\n", encoding="utf-8")

        md = f"""# Weekly Floor/Ceiling Volatility V1 — Phase 0

        **Status:** `PREREGISTERED_SOURCE_CONTRACT_ONLY`

        This study is display/research only. It may not change Fundamental Value,
        Package Adjustment, Team Utility, Trade Value, Market Value, trade verdicts,
        or player projections.

        ## V1 source concept

        The primary source candidate is **4for4**, but Phase 1A must prove that the
        private source actually contains explicit, week-specific player floor and
        ceiling fields. V1 will not manufacture a floor or ceiling from a mean
        projection, historical variance, FV, ADP, or market value.

        Raw licensed provider rows remain private. Public artifacts may contain only
        source hashes and aggregate validation metadata.

        ## Frozen constructs

        - **Floor Strength:** within-position weekly percentile of the explicit provider floor.
        - **Ceiling Strength:** within-position weekly percentile of the explicit provider ceiling.
        - **Volatility Width:** `ceiling - floor`, normalized within position/week.
        - **Overall score:** prohibited in V1.

        Higher volatility width means only that the provider's displayed band is wider.
        It is not automatically "riskier," worse, or better.

        ## Scope

        QB/RB/WR/TE only. Half-PPR only. Weekly only. Bye or missing rows are
        unavailable, never neutral.

        ## Governance

        Outcomes remain sealed in Phase 1A and Phase 1B. Phase 1B must freeze the
        provider semantics and exact retrospective validation gates before Phase 2 may
        read realized fantasy outcomes.

        No user-facing production display is authorized by Phase 0.
        """
        (OUT / "weekly_floor_ceiling_volatility_v1_phase0_prereg.md").write_text(
            md, encoding="utf-8"
        )

        print(json.dumps({
            "status": doc["status"],
            "study_id": doc["study_id"],
            "production_change_authorized": doc["production_change_authorized"],
            "outcome_association_opened": doc["outcome_association_opened"],
            "next_phase": "1A private source/schema feasibility",
        }, indent=2))
        PY
    - name: Validate scientific firewall
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        from pathlib import Path

        p = Path(
            "research/weekly-floor-ceiling-volatility-v1/"
            "weekly_floor_ceiling_volatility_v1_phase0_prereg.json"
        )
        d = json.loads(p.read_text(encoding="utf-8"))

        assert d["study_id"] == "weekly-floor-ceiling-volatility-v1"
        assert d["phase"] == 0
        assert d["status"] == "PREREGISTERED_SOURCE_CONTRACT_ONLY"
        assert d["research_only"] is True
        assert d["production_change_authorized"] is False
        assert d["outcome_association_opened"] is False

        s = d["source_contract"]
        assert s["primary_provider_candidate"] == "4for4"
        assert s["required_input_type"] == "explicit player-level weekly floor and ceiling fields"
        assert s["synthetic_floor_or_ceiling_from_mean_projection_allowed"] is False
        assert s["synthetic_distribution_from_historical_variance_allowed"] is False
        assert s["raw_licensed_provider_rows_may_be_committed"] is False
        assert s["row_level_provider_output_may_be_committed"] is False

        scope = d["scope"]
        assert scope["positions_v1"] == ["QB", "RB", "WR", "TE"]
        assert scope["scoring_lens"] == "HALF_PPR_ONLY"
        assert scope["weekly_only"] is True
        assert scope["ros_or_playoff_aggregation_in_v1"] is False

        c = d["frozen_display_constructs"]
        assert c["floor_strength"]["definition"].startswith("within-position weekly percentile")
        assert c["ceiling_strength"]["definition"].startswith("within-position weekly percentile")
        assert c["volatility_width"]["definition"] == "provider ceiling minus provider floor"
        assert c["overall_score"]["authorized"] is False

        g = d["governance"]
        for key, value in g.items():
            assert value is False, (key, value)

        assert [x["phase"] for x in d["phase_plan"]] == ["1A", "1B", 2, 3, 4]
        assert d["phase_plan"][0]["outcomes_open"] is False
        assert d["phase_plan"][1]["outcomes_open"] is False

        print("PASS: Phase 0 scientific firewall validated.")
        PY

        test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA"
        test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA"
        test -z "$(git diff --name-only -- index.html free-agent-board.html)"
    - name: Run repository regression checks
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"
        python3 scripts/validation/repo_regression_checks.py
    - name: Commit frozen Phase 0
      shell: bash
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add research/weekly-floor-ceiling-volatility-v1
        git diff --cached --check
        git commit -m "Preregister Weekly Floor Ceiling Volatility V1 Phase 0"
        git pull --rebase origin main
        git push origin main
    - name: Self-archive completed one-shot workflow
      shell: bash
      run: |
        set -euo pipefail

        SRC=".github/workflows/$SELF_WORKFLOW"
        DST=".github/workflow-archive/completed-research/$SELF_WORKFLOW"

        test -f "$SRC"
        mkdir -p "$(dirname "$DST")"

        if test -e "$DST"; then
          test "$(sha256sum "$SRC" | awk '{print $1}')" = \
               "$(sha256sum "$DST" | awk '{print $1}')"
          rm "$SRC"
        else
          mv "$SRC" "$DST"
        fi

        git add "$SRC" "$DST"
        git diff --cached --check
        git commit -m "Archive B35 Phase 0 workflow"
        git pull --rebase origin main
        git push origin main
    - name: Closeout
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        from pathlib import Path

        p = Path(
            "research/weekly-floor-ceiling-volatility-v1/"
            "weekly_floor_ceiling_volatility_v1_phase0_prereg.json"
        )
        d = json.loads(p.read_text(encoding="utf-8"))

        print("=== B35 COMPLETE ===")
        print("Status:", d["status"])
        print("Source candidate:", d["source_contract"]["primary_provider_candidate"])
        print("Outcomes opened: NO")
        print("Production authorized: NO")
        print("Next: Phase 1A private source/schema feasibility")
        PY
