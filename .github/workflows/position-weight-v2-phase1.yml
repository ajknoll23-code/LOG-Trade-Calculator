name: Position Weight V2 Phase 1 Architecture Audit

# Research-only cross-position economics audit.
# No POSITION_WEIGHT, replacement rank, Production V2 input, transform,
# global scale, or frozen prospective experiment is changed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  architecture-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 1 self-test
        run: python3 research/position-weight-v2/position_weight_v2_phase1_architecture_audit.py --selftest

      - name: Build Position Weight V2 Phase 1 audit
        run: python3 research/position-weight-v2/position_weight_v2_phase1_architecture_audit.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/position-weight-v2/position_weight_v2_phase1_architecture_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/position-weight-v2/position_weight_v2_phase1_architecture_audit.json
          git add research/position-weight-v2/position_weight_v2_phase1_architecture_audit.md
          git diff --staged --quiet || git commit -m "Add Position Weight V2 Phase 1 architecture audit"
          git push
