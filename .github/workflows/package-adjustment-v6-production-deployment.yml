name: Package Adjustment V6 Production Deployment

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install "requests==2.34.2"

      - name: Guard clean tree and V1.7-ready permanent OOS workflow
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          grep -F "PACKAGE_ADJUSTMENT_OOS_DISPATCHER_V1"             .github/workflows/package-adjustment-audit-step4-exact-live-oos.yml
          grep -F "v1.7-v6-size3-c2-overlay"             .github/workflows/package-adjustment-audit-step4-exact-live-oos.yml

      - name: Stage prevalidated V1.7 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          files = {
              "/tmp/package_adjustment_exact_live_oos_v1_7.py": "",
              "/tmp/check_package_adjustment_live_v1_7.py": "",
              "/tmp/deploy_v6_patch.py": "",
          }
          for path, payload in files.items():
              Path(path).write_bytes(base64.b64decode(payload))

          print("PASS: staged prevalidated V1.7 deployment sources.")
          PY

      - name: Revalidate staged deployment sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in [
              "/tmp/package_adjustment_exact_live_oos_v1_7.py",
              "/tmp/check_package_adjustment_live_v1_7.py",
              "/tmp/deploy_v6_patch.py",
          ]:
              source = Path(path).read_text(encoding="ascii")
              compile(source, path, "exec")
              print("PASS syntax:", path)
          PY

      - name: Apply approved V6 controlled-live patch
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 /tmp/deploy_v6_patch.py

      - name: Check generated Python and index JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          for path in [
              "scripts/validation/package_adjustment_exact_live_oos_v1_7.py",
              "scripts/validation/check_package_adjustment_live.py",
              "scripts/validation/package_adjustment_exact_live_oos.py",
          ]:
              source = Path(path).read_text(encoding="utf-8")
              compile(source, path, "exec")

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", text, re.S | re.I)
          with tempfile.NamedTemporaryFile(
              "w", suffix=".js", delete=False, encoding="utf-8"
          ) as f:
              f.write("\n".join(scripts))
              path = f.name
          try:
              subprocess.run(
                  ["node", "--check", path],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          finally:
              os.unlink(path)

          print("PASS: V1.7 generated Python and inline JavaScript syntax.")
          PY

      - name: Verify revision-aware dispatcher resolves V1.7
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/validation/package_adjustment_exact_live_oos.py --resolve-only

      - name: Run initial V1.7 exact-live OOS alignment
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/validation/package_adjustment_exact_live_oos_v1_7.py

      - name: Run permanent V1.7 Package Adjustment validator
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/validation/check_package_adjustment_live.py

      - name: Run full repository regression suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Verify V6 deployment invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(
              Path(
                  "research/package-adjustment-production-candidate-v1/"
                  "live_deployment.json"
              ).read_text()
          )
          deploy = json.loads(
              Path(
                  "research/package-adjustment-v6/"
                  "production_deployment_v1.json"
              ).read_text()
          )
          result = json.loads(
              Path(
                  "research/package-adjustment-production-candidate-v1/"
                  "prospective/exact_live_oos_validation.json"
              ).read_text()
          )

          assert live["production_revision"] == "v1.7-v6-size3-c2-overlay"
          assert live["production_formula_enabled"] is True
          assert live["trade_verdict_consumer_changed"] is True
          assert live["fundamental_value_consumer_changed"] is False
          assert live["market_value_consumer_changed"] is False
          assert live["draft_pick_value_consumer_changed"] is False
          assert live["team_utility_consumer_changed"] is False

          assert deploy["status"] == "v6_controlled_live_deployed"
          assert deploy["human_approval_confirmed"] is True
          assert deploy["production_changed"] is True

          scope = deploy["scope"]
          assert scope["trade_topology"] == (
              "exactly one target player versus exactly three package players"
          )
          assert scope["player_only"] is True
          assert scope["draft_picks_allowed"] is False
          assert scope["multi_vs_multi_allowed"] is False
          assert scope["size2_behavior"] == "retain_existing_V3_V5_unchanged"

          assert result["release"]["production_revision_at_release"] == (
              "v1.7-v6-size3-c2-overlay"
          )
          assert result["automatic_production_change_allowed"] is False

          print("PASS: V6 controlled-live deployment invariants verified.")
          PY

      - name: Prove deployment change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "scripts/validation/check_package_adjustment_live.py",
              "scripts/validation/package_adjustment_exact_live_oos.py",
              "scripts/validation/package_adjustment_exact_live_oos_v1_7.py",
              "research/package-adjustment-v6/production_candidate_v1.json",
              "research/package-adjustment-v6/production_deployment_v1.json",
              "research/package-adjustment-production-candidate-v1/live_deployment.json",
              "research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_7.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json",
              "research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.md",
          }

          lines = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          ).splitlines()
          actual = {line[3:] for line in lines if line.strip()}

          if actual != expected:
              raise SystemExit(
                  "unexpected V6 deployment change surface: "
                  f"expected={sorted(expected)} actual={sorted(actual)}"
              )

          print("PASS: exactly the intended V6 production files changed.")
          PY

      - name: Upload V6 deployment proof
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v6-production-deployment-proof
          path: |
            research/package-adjustment-v6/production_candidate_v1.json
            research/package-adjustment-v6/production_deployment_v1.json
            research/package-adjustment-production-candidate-v1/live_deployment.json
            research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_7.json
            research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json
            research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit V6 controlled-live deployment
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add             index.html             scripts/validation/check_package_adjustment_live.py             scripts/validation/package_adjustment_exact_live_oos.py             scripts/validation/package_adjustment_exact_live_oos_v1_7.py             research/package-adjustment-v6/production_candidate_v1.json             research/package-adjustment-v6/production_deployment_v1.json             research/package-adjustment-production-candidate-v1/live_deployment.json             research/package-adjustment-production-candidate-v1/prospective/release_manifest_v1_7.json             research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.json             research/package-adjustment-production-candidate-v1/prospective/exact_live_oos_validation.md

          git commit -m "Deploy Package Adjustment V6 C2 size3 overlay"
          git pull --rebase origin main

          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          git push origin main

          echo "PASS: Package Adjustment V6 is controlled-live in production."
