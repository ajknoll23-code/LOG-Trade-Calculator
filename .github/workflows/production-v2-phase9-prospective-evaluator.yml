name: Production V2 Phase 9 Prospective Evaluator

# Install now; rerun after Tuesday outcome refreshes as 2026 evidence accumulates.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-v2-phase9-prospective-evaluator
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test Phase 9 evaluator
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --selftest

      - name: Freeze immutable preseason candidate matrix
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --freeze

      - name: Evaluate available completed 2026 outcomes
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --write

      - name: Verify semantic reproducibility
        run: python3 research/production-v2/production_v2_phase9_prospective_evaluator.py --check

      - name: Print Phase 9 report
        run: cat research/production-v2/production_v2_phase9_evaluation.md

      - name: Research-only mutation safety check
        shell: bash
        run: |
          allowed="$(printf '%s\n' \
            research/production-v2/production_v2_phase9_preseason_candidates.json \
            research/production-v2/production_v2_phase9_evaluation.json \
            research/production-v2/production_v2_phase9_evaluation.md)"

          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sed '/^$/d' | sort -u)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sort -u))"

          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by Phase 9:"
            echo "$unexpected"
            exit 1
          fi

          git add \
            research/production-v2/production_v2_phase9_preseason_candidates.json \
            research/production-v2/production_v2_phase9_evaluation.json \
            research/production-v2/production_v2_phase9_evaluation.md

          git diff --cached --check

          staged="$(git diff --cached --name-only | sort -u)"
          unexpected_staged="$(comm -23 <(printf '%s\n' "$staged") <(printf '%s\n' "$allowed" | sort -u))"
          if [ -n "$unexpected_staged" ]; then
            echo "Unexpected files staged:"
            echo "$unexpected_staged"
            exit 1
          fi

      - name: Commit Phase 9 state
        shell: bash
        run: |
          git config user.name "production-v2-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No Phase-9 state changes to commit."
          else
            git commit -m "Prepare Production V2 prospective calibration"
            git push origin main
          fi
