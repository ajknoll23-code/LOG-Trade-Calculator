name: Apply Value Uncertainty UI

# One-time/replayable UI release step for Value Uncertainty V1.
# The maintenance script is idempotent: rerunning after deployment makes no
# index.html change. It modifies presentation only; calculator center values,
# side totals, verdicts, Team Utility, and production coefficients are untouched.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integration self-test
        run: python3 scripts/maintenance/apply_value_uncertainty_ui.py --selftest

      - name: Apply uncertainty UI
        run: python3 scripts/maintenance/apply_value_uncertainty_ui.py --write

      - name: Verify uncertainty UI
        run: python3 scripts/maintenance/apply_value_uncertainty_ui.py --check

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          start = text.rfind("<script>")
          end = text.rfind("</script>")
          if start < 0 or end <= start:
              raise SystemExit("Could not locate inline script in index.html")
          Path("/tmp/trade-desk-inline.js").write_text(
              text[start + len("<script>"):end],
              encoding="utf-8",
          )
          PY
          node --check /tmp/trade-desk-inline.js

      - name: Diff safety check
        run: |
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "index.html" ]; then
            echo "Unexpected files changed:"
            echo "$changed"
            exit 1
          fi

      - name: Commit UI release
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Value uncertainty UI already applied; nothing to commit."
            exit 0
          fi
          git config user.name "trade-desk-ui-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add value uncertainty ranges to Trade Desk UI"
          git push
