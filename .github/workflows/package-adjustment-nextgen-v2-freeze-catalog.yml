name: Package Adjustment NextGen V2 Freeze Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-adjustment-nextgen-v2-freeze-catalog
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependency
        run: python3 -m pip install requests

      - name: Guard exact approved pre-freeze state
        shell: bash
        run: |
          set -euo pipefail

          GEN="research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py"
          SPEC="research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md"
          CAT="research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          DESIGN="research/package-adjustment-nextgen-v2/challenge_catalog_design.md"

          test -z "$(git status --porcelain=v1)"

          # Exact post-guardrail, human-reviewed state.
          test "$(git hash-object "$GEN")" = "fe09ac9b26d77bbc3659e3708684372e2ff1ff56"
          test "$(git hash-object "$SPEC")" = "3fa634476828f27f435d30914f8f237466550ae5"
          test "$(git hash-object "$CAT")" = "201a0f721e518d397ea9efe8b74a5b290a62fe8e"
          test "$(git hash-object "$DESIGN")" = "ecb2f7c28d015291e81df7e9edcc1181c2502335"

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cat_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "package_vote_challenges_nextgen_v2.json"
          )
          cat = json.loads(cat_path.read_text(encoding="utf-8"))

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["research_only"] is True
          assert cat["frozen"] is False
          assert cat["production_formula_enabled"] is False
          assert cat["automatic_production_change_allowed"] is False
          assert cat["production_revision_at_generation"] == (
              "v1.6-v5-size2-composition-overlay"
          )
          assert cat["exact_live_formula_sha256_at_generation"] == (
              "9a1a52f3393a701fe8463fcf2179d1342debb925da1109ce73276b8b2b8cbbc7"
          )

          diag = cat["catalog_diagnostics"]
          assert diag["challenge_count"] == 129
          assert diag["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert diag["split_counts"] == {
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
              "train": 75,
          }
          assert diag["scale_counts"] == {"high": 43, "low": 43, "mid": 43}
          assert diag["skipped_or_underfilled_cells"] == []
          assert diag["diversity"]["unique_assets_used"] == 238
          assert diag["diversity"]["max_asset_appearance_count"] == 11

          integ = diag["scale_reuse_integrity"]
          reuse = integ["exact_side_reuse"]
          assert integ["all_selected_goals_inside_declared_scale_band"] is True
          assert reuse == {
              "core_cross_cell_nonflat_signature_count": 0,
              "cross_cell_same_family_signature_count": 31,
              "cross_family_signature_count": 0,
              "cross_scale_same_cell_signature_count": 0,
              "max_global_signature_occurrences": 4,
              "repeated_signature_count_global": 31,
              "same_cell_same_scale_signature_count": 0,
          }

          assert [x["label"] for x in cat["design"]["fragmentation_comparisons"]] == [
              "80_20_vs_80_10_10"
          ]
          assert [
              x["label"] for x in cat["design"]["deferred_fragmentation_comparisons"]
          ] == ["80_20_vs_80_05x4"]

          canonical = json.dumps(
              cat["challenges"],
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          payload_sha = hashlib.sha256(canonical).hexdigest()

          Path("/tmp/pkgnv2-approved-challenges.json").write_text(
              json.dumps(cat["challenges"], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/pkgnv2-approved-payload-sha.txt").write_text(
              payload_sha + "\n",
              encoding="utf-8",
          )

          print("PASS: exact approved pre-freeze catalog confirmed.")
          print("Approved challenge payload SHA-256:", payload_sha)
          PY

      - name: Verify production before freeze
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Install permanent frozen-catalog overwrite lock
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          gen_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "generate_package_vote_challenges_nextgen_v2.py"
          )
          spec_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "package_adjustment_nextgen_v2_research_spec.md"
          )

          gen = gen_path.read_text(encoding="utf-8")
          spec = spec_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one source match, found {n}"
                  )
              return text.replace(old, new, 1)

          old_boundary = '''def snapshot_protected_files():
          '''
          new_boundary = '''def assert_catalog_document_mutable(document):
              if document.get("frozen") is True:
                  raise RuntimeError(
                      "refusing to regenerate frozen NextGen V2 challenge catalog"
                  )


          def assert_catalog_not_frozen_for_generation():
              if OUT.is_file():
                  assert_catalog_document_mutable(read_json(OUT))


          def snapshot_protected_files():
          '''
          gen = replace_once(
              gen,
              old_boundary,
              new_boundary,
              "insert frozen-catalog overwrite lock",
          )

          old_run = '''def run_generation(force=False, dry_run=False):
              assert_required_files(ROOT)
              assert_production_baseline()
          '''
          new_run = '''def run_generation(force=False, dry_run=False):
              assert_required_files(ROOT)
              if not dry_run:
                  assert_catalog_not_frozen_for_generation()
              assert_production_baseline()
          '''
          gen = replace_once(
              gen,
              old_run,
              new_run,
              "enforce frozen-catalog overwrite lock",
          )

          old_selftest_tail = '''    print("Package Adjustment NextGen V2 generator self-test passed.")
          '''
          new_selftest_tail = '''    assert_catalog_document_mutable({"frozen": False})
              try:
                  assert_catalog_document_mutable({"frozen": True})
              except RuntimeError as exc:
                  assert "refusing to regenerate frozen" in str(exc)
              else:
                  raise AssertionError("frozen-catalog overwrite lock did not fail closed")

              print("Package Adjustment NextGen V2 generator self-test passed.")
          '''
          gen = replace_once(
              gen,
              old_selftest_tail,
              new_selftest_tail,
              "selftest frozen-catalog overwrite lock",
          )

          old_status = (
              "**Status: DRAFT FOR HUMAN REVIEW — RESEARCH ONLY. "
              "NO PRODUCTION FORMULA CHANGE IS AUTHORIZED BY THIS DOCUMENT.**"
          )
          new_status = (
              "**Status: CHALLENGE CATALOG FROZEN / UNRELEASED — RESEARCH ONLY. "
              "VOTING IS NOT ACTIVATED AND NO PRODUCTION FORMULA CHANGE IS AUTHORIZED "
              "BY THIS DOCUMENT.**"
          )
          spec = replace_once(
              spec,
              old_status,
              new_status,
              "research-spec frozen status",
          )

          marker = "# 24. Evidence freezing\n"
          section = '''## 23.1 Challenge-catalog freeze declaration

          The reviewed first-wave NextGen V2 challenge catalog is frozen before voting.

          Freeze scope:

          - the exact 129 challenge records are immutable research evidence;
          - the canonical challenge-array SHA-256 is recorded in the catalog freeze manifest;
          - future generator mutation attempts must fail closed when the on-disk catalog is marked
            `frozen: true`;
          - the catalog remains unreleased until the preregistered power / precision and maturity
            plan is committed;
          - browser voting is not activated by the freeze;
          - the reserved voting transport remains inactive;
          - production V1.6 remains unchanged; and
          - no model fit or voter outcome is used to define this freeze.

          Any future challenge-catalog revision requires a new explicit preregistered revision and
          may not silently replace this frozen evidence.

          ---

          '''
          if section in spec:
              raise SystemExit("freeze declaration unexpectedly already present")
          if spec.count(marker) != 1:
              raise SystemExit(
                  f"evidence-freezing section marker expected once, found {spec.count(marker)}"
              )
          spec = spec.replace(marker, section + marker, 1)

          gen_path.write_text(gen, encoding="utf-8")
          spec_path.write_text(spec, encoding="utf-8")

          print("PASS: generator freeze lock + spec freeze declaration patched.")
          PY

          python3 -m py_compile \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py

      - name: Verify pre-freeze patch boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          assert changed == expected, (changed, expected)
          print("PASS: only generator + spec changed before freeze-lock commit.")
          PY

      - name: Run generator self-test with freeze lock
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --selftest

      - name: Commit freeze lock and specification
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md

          git commit -m "Lock NextGen V2 generator before catalog freeze"
          echo "FREEZE_LOCK_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Regenerate one final unreleased copy under frozen specification
        shell: bash
        run: |
          set -euo pipefail

          # Catalog is still unfrozen at this exact point, so one final regeneration
          # refreshes generator/spec provenance. The approved challenge array must not move.
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --force

      - name: Prove final regeneration preserved approved challenges
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          cat_path = Path(
              "research/package-adjustment-nextgen-v2/"
              "package_vote_challenges_nextgen_v2.json"
          )
          cat = json.loads(cat_path.read_text(encoding="utf-8"))
          approved = json.loads(
              Path("/tmp/pkgnv2-approved-challenges.json").read_text(encoding="utf-8")
          )
          approved_sha = Path(
              "/tmp/pkgnv2-approved-payload-sha.txt"
          ).read_text(encoding="utf-8").strip()

          assert cat["challenges"] == approved
          canonical = json.dumps(
              cat["challenges"],
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == approved_sha

          assert cat["status"] == "generated_research_catalog_unreleased"
          assert cat["frozen"] is False
          assert cat["generator_commit_sha"] == os.environ["FREEZE_LOCK_COMMIT"]
          assert cat["catalog_diagnostics"]["challenge_count"] == 129

          reuse = cat["catalog_diagnostics"]["scale_reuse_integrity"]["exact_side_reuse"]
          assert reuse["same_cell_same_scale_signature_count"] == 0
          assert reuse["cross_scale_same_cell_signature_count"] == 0
          assert reuse["cross_family_signature_count"] == 0
          assert reuse["cross_cell_same_family_signature_count"] == 31
          assert reuse["core_cross_cell_nonflat_signature_count"] == 0

          print("PASS: final provenance regeneration preserved exact approved payload.")
          PY

      - name: Freeze exact catalog and write manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          research = root / "research" / "package-adjustment-nextgen-v2"
          cat_path = research / "package_vote_challenges_nextgen_v2.json"
          design_path = research / "challenge_catalog_design.md"
          gen_path = research / "generate_package_vote_challenges_nextgen_v2.py"
          spec_path = research / "package_adjustment_nextgen_v2_research_spec.md"
          manifest_path = research / "catalog_freeze_manifest.json"

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cat = json.loads(cat_path.read_text(encoding="utf-8"))
          approved = json.loads(
              Path("/tmp/pkgnv2-approved-challenges.json").read_text(encoding="utf-8")
          )
          payload_sha = Path(
              "/tmp/pkgnv2-approved-payload-sha.txt"
          ).read_text(encoding="utf-8").strip()

          assert cat["challenges"] == approved
          assert cat["frozen"] is False
          assert cat["status"] == "generated_research_catalog_unreleased"

          freeze_time = datetime.now(timezone.utc).replace(microsecond=0).isoformat()

          cat["status"] = "frozen_package_adjustment_nextgen_v2"
          cat["frozen"] = True
          cat["freeze"] = {
              "scope": "exact_challenge_catalog_only",
              "frozen_at_utc": freeze_time,
              "challenge_count": 129,
              "canonical_challenge_payload_sha256": payload_sha,
              "voting_activated": False,
              "catalog_released_to_voters": False,
              "production_change_authorized": False,
              "production_formula_changed": False,
              "approved_unfrozen_catalog_commit_sha": (
                  "f08a032876d8966a34b31702a532f7e6928f70b2"
              ),
              "freeze_lock_commit_sha": os.environ["FREEZE_LOCK_COMMIT"],
              "freeze_readiness_audit": {
                  "workflow_run_id": 34549647345,
                  "artifact_sha256": (
                      "7bf020b1441e39277d8442b06f3e33b7a8a5a3e2e1c226dfcf9a7a3553242670"
                  ),
              },
              "permanent_guardrails_validation": {
                  "workflow_run_id": 34552208894,
                  "guardrail_commit_sha": (
                      "ff3bb6c7289d203c58d11e2fa0e843fa96d8eb5b"
                  ),
                  "catalog_commit_sha": (
                      "f08a032876d8966a34b31702a532f7e6928f70b2"
                  ),
              },
              "next_required_step_before_voting": (
                  "historical participation plus realized-cell power/precision "
                  "simulation and committed maturity plan"
              ),
          }

          canonical = json.dumps(
              cat["challenges"],
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == payload_sha

          cat_path.write_text(
              json.dumps(cat, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          design = design_path.read_text(encoding="utf-8")
          old_status = (
              "**Status: GENERATED / UNRELEASED — RESEARCH ONLY. "
              "Production V1.6 is unchanged.**"
          )
          new_status = (
              "**Status: FROZEN / UNRELEASED — RESEARCH ONLY. "
              "Voting is not activated. Production V1.6 is unchanged.**"
          )
          if design.count(old_status) != 1:
              raise SystemExit(
                  f"design status expected once, found {design.count(old_status)}"
              )
          design = design.replace(old_status, new_status, 1)

          anchor = "## Isolation\n"
          freeze_block = f'''## Freeze

          - Frozen challenge count: `129`
          - Canonical challenge-payload SHA-256: `{payload_sha}`
          - Freeze-lock generator commit: `{os.environ["FREEZE_LOCK_COMMIT"]}`
          - Freeze manifest: `research/package-adjustment-nextgen-v2/catalog_freeze_manifest.json`
          - Voting activated: `False`
          - Production change authorized: `False`
          - The next preregistered prerequisite is the power / precision and evidence-maturity plan.

          '''
          if design.count(anchor) != 1:
              raise SystemExit(
                  f"design Isolation marker expected once, found {design.count(anchor)}"
              )
          design = design.replace(anchor, freeze_block + anchor, 1)
          design_path.write_text(design, encoding="utf-8")

          final_catalog_sha = sha256(cat_path)
          final_design_sha = sha256(design_path)
          generator_sha = sha256(gen_path)
          spec_sha = sha256(spec_path)

          diag = cat["catalog_diagnostics"]
          integrity = diag["scale_reuse_integrity"]
          reuse = integrity["exact_side_reuse"]

          manifest = {
              "schema_version": 1,
              "status": "frozen_package_adjustment_nextgen_v2_catalog",
              "frozen": True,
              "research_only": True,
              "released_to_voters": False,
              "voting_activated": False,
              "production_change_authorized": False,
              "production_formula_enabled": False,
              "frozen_at_utc": freeze_time,
              "challenge_count": 129,
              "canonical_challenge_payload_sha256": payload_sha,
              "catalog": {
                  "path": cat_path.relative_to(root).as_posix(),
                  "sha256": final_catalog_sha,
              },
              "design": {
                  "path": design_path.relative_to(root).as_posix(),
                  "sha256": final_design_sha,
              },
              "generator": {
                  "path": gen_path.relative_to(root).as_posix(),
                  "sha256": generator_sha,
                  "freeze_lock_commit_sha": os.environ["FREEZE_LOCK_COMMIT"],
              },
              "research_spec": {
                  "path": spec_path.relative_to(root).as_posix(),
                  "sha256": spec_sha,
              },
              "inputs": {
                  "player_fv_sha256": cat["inputs"]["player_fv"]["sha256"],
                  "league_rosters_sha256": cat["inputs"]["league_rosters"]["sha256"],
                  "controlled_live_formula_sha256": (
                      cat["exact_live_formula_sha256_at_generation"]
                  ),
              },
              "catalog_shape": {
                  "family_counts": diag["family_counts"],
                  "split_counts": diag["split_counts"],
                  "scale_counts": diag["scale_counts"],
                  "unique_assets_used": diag["diversity"]["unique_assets_used"],
                  "max_asset_appearance_count": (
                      diag["diversity"]["max_asset_appearance_count"]
                  ),
              },
              "integrity": {
                  "all_selected_goals_inside_declared_scale_band": (
                      integrity["all_selected_goals_inside_declared_scale_band"]
                  ),
                  "max_goal_to_anchor_drift_pct": (
                      integrity["max_goal_to_anchor_drift_pct"]
                  ),
                  "exact_side_reuse": reuse,
                  "unsupported_fragmentation_deferred": "80_20_vs_80_05x4",
              },
              "review_provenance": {
                  "approved_unfrozen_catalog_commit_sha": (
                      "f08a032876d8966a34b31702a532f7e6928f70b2"
                  ),
                  "freeze_readiness_workflow_run_id": 34549647345,
                  "freeze_readiness_artifact_sha256": (
                      "7bf020b1441e39277d8442b06f3e33b7a8a5a3e2e1c226dfcf9a7a3553242670"
                  ),
                  "permanent_guardrails_workflow_run_id": 34552208894,
                  "permanent_guardrail_commit_sha": (
                      "ff3bb6c7289d203c58d11e2fa0e843fa96d8eb5b"
                  ),
                  "permanent_guardrail_catalog_commit_sha": (
                      "f08a032876d8966a34b31702a532f7e6928f70b2"
                  ),
              },
              "activation": {
                  "authorized": False,
                  "maturity_plan_committed": False,
                  "required_before_activation": [
                      "historical package-voting participation analysis",
                      "power / precision simulation using realized frozen cells",
                      "evidence maturity gates",
                      "committed maturity-plan SHA-256",
                  ],
              },
          }

          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: exact 129-row catalog marked frozen.")
          print("Canonical challenge payload SHA-256:", payload_sha)
          print("Frozen catalog SHA-256:", final_catalog_sha)
          print("Freeze manifest:", manifest_path)
          PY

      - name: Validate frozen catalog and manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          research = root / "research" / "package-adjustment-nextgen-v2"
          cat_path = research / "package_vote_challenges_nextgen_v2.json"
          design_path = research / "challenge_catalog_design.md"
          gen_path = research / "generate_package_vote_challenges_nextgen_v2.py"
          spec_path = research / "package_adjustment_nextgen_v2_research_spec.md"
          manifest_path = research / "catalog_freeze_manifest.json"

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          cat = json.loads(cat_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          approved = json.loads(
              Path("/tmp/pkgnv2-approved-challenges.json").read_text(encoding="utf-8")
          )
          payload_sha = Path(
              "/tmp/pkgnv2-approved-payload-sha.txt"
          ).read_text(encoding="utf-8").strip()

          assert cat["challenges"] == approved
          assert cat["status"] == "frozen_package_adjustment_nextgen_v2"
          assert cat["frozen"] is True
          assert cat["research_only"] is True
          assert cat["production_formula_enabled"] is False
          assert cat["automatic_production_change_allowed"] is False
          assert cat["freeze"]["canonical_challenge_payload_sha256"] == payload_sha
          assert cat["freeze"]["voting_activated"] is False
          assert cat["freeze"]["production_change_authorized"] is False
          assert cat["freeze"]["freeze_lock_commit_sha"] == os.environ[
              "FREEZE_LOCK_COMMIT"
          ]

          assert manifest["status"] == (
              "frozen_package_adjustment_nextgen_v2_catalog"
          )
          assert manifest["frozen"] is True
          assert manifest["released_to_voters"] is False
          assert manifest["voting_activated"] is False
          assert manifest["production_change_authorized"] is False
          assert manifest["activation"]["authorized"] is False
          assert manifest["activation"]["maturity_plan_committed"] is False
          assert manifest["canonical_challenge_payload_sha256"] == payload_sha

          assert manifest["catalog"]["sha256"] == sha256(cat_path)
          assert manifest["design"]["sha256"] == sha256(design_path)
          assert manifest["generator"]["sha256"] == sha256(gen_path)
          assert manifest["research_spec"]["sha256"] == sha256(spec_path)

          assert manifest["catalog_shape"]["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert manifest["integrity"]["exact_side_reuse"][
              "cross_scale_same_cell_signature_count"
          ] == 0
          assert manifest["integrity"]["exact_side_reuse"][
              "core_cross_cell_nonflat_signature_count"
          ] == 0
          assert manifest["integrity"]["exact_side_reuse"][
              "cross_cell_same_family_signature_count"
          ] == 31

          canonical = json.dumps(
              cat["challenges"],
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")
          assert hashlib.sha256(canonical).hexdigest() == payload_sha

          print("PASS: frozen catalog + manifest are internally consistent.")
          PY

      - name: Run repository regression suite before freeze commit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/repo_regression_checks.py

      - name: Revalidate production before freeze commit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Verify freeze-stage change boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/catalog_freeze_manifest.json",
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "status", "--porcelain=v1"], text=True
              ).splitlines()
          )
          # Normalize porcelain entries to file paths.
          paths = {row[3:] for row in changed if len(row) >= 4}
          assert paths == expected, (paths, expected)
          print("PASS: only catalog/design/manifest await freeze commit.")
          PY

      - name: Commit frozen catalog
        shell: bash
        run: |
          set -euo pipefail

          git add \
            research/package-adjustment-nextgen-v2/catalog_freeze_manifest.json \
            research/package-adjustment-nextgen-v2/challenge_catalog_design.md \
            research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json

          git commit -m "Freeze NextGen V2 research challenge catalog"
          echo "FREEZE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove generator refuses frozen overwrite
        shell: bash
        run: |
          set -euo pipefail

          CAT="research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json"
          DESIGN="research/package-adjustment-nextgen-v2/challenge_catalog_design.md"
          MANIFEST="research/package-adjustment-nextgen-v2/catalog_freeze_manifest.json"

          CAT_SHA_BEFORE="$(sha256sum "$CAT" | awk '{print $1}')"
          DESIGN_SHA_BEFORE="$(sha256sum "$DESIGN" | awk '{print $1}')"
          MANIFEST_SHA_BEFORE="$(sha256sum "$MANIFEST" | awk '{print $1}')"

          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --force > /tmp/pkgnv2-frozen-overwrite.stdout 2> /tmp/pkgnv2-frozen-overwrite.stderr
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            echo "ERROR: frozen catalog overwrite unexpectedly succeeded."
            cat /tmp/pkgnv2-frozen-overwrite.stdout
            cat /tmp/pkgnv2-frozen-overwrite.stderr
            exit 1
          fi

          grep -Fq \
            "refusing to regenerate frozen NextGen V2 challenge catalog" \
            /tmp/pkgnv2-frozen-overwrite.stderr

          test "$CAT_SHA_BEFORE" = "$(sha256sum "$CAT" | awk '{print $1}')"
          test "$DESIGN_SHA_BEFORE" = "$(sha256sum "$DESIGN" | awk '{print $1}')"
          test "$MANIFEST_SHA_BEFORE" = "$(sha256sum "$MANIFEST" | awk '{print $1}')"
          test -z "$(git status --porcelain=v1)"

          echo "PASS: --force fails closed after freeze and writes nothing."

      - name: Prove frozen dry run remains reproducible
        shell: bash
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 python3 \
            research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py \
            --dry-run > /tmp/pkgnv2-frozen-dry-run.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("/tmp/pkgnv2-frozen-dry-run.json").read_text(encoding="utf-8")
          )
          assert d["status"] == "dry_run_passed"
          assert d["challenge_count"] == 129
          assert d["family_counts"] == {
              "core_concentration_2v2": 90,
              "fragmentation_filler": 15,
              "structural_topology_3v3": 24,
          }
          assert d["split_counts"] == {
              "structural_scale_holdout": 30,
              "structural_topology_holdout": 24,
              "train": 75,
          }
          assert d["skipped_or_underfilled_cells"] == 0
          print("PASS: frozen catalog remains reproducible in read-only dry-run mode.")
          PY

          test -z "$(git status --porcelain=v1)"

      - name: Prove complete research change boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import subprocess

          expected = {
              "research/package-adjustment-nextgen-v2/catalog_freeze_manifest.json",
              "research/package-adjustment-nextgen-v2/challenge_catalog_design.md",
              "research/package-adjustment-nextgen-v2/generate_package_vote_challenges_nextgen_v2.py",
              "research/package-adjustment-nextgen-v2/package_adjustment_nextgen_v2_research_spec.md",
              "research/package-adjustment-nextgen-v2/package_vote_challenges_nextgen_v2.json",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed == expected, (changed, expected)
          assert (
              subprocess.check_output(
                  ["git", "status", "--porcelain=v1"], text=True
              ).strip()
              == ""
          )
          print("PASS: exactly five intended NextGen research files changed.")
          PY

      - name: Final production guard
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/validation/check_package_adjustment_live.py

      - name: Push frozen research catalog
        shell: bash
        run: |
          set -euo pipefail

          git push origin main

          echo "Freeze-lock commit: $FREEZE_LOCK_COMMIT"
          echo "Frozen-catalog commit: $FREEZE_COMMIT"
          echo "Pushed:"
          git log --oneline -2
