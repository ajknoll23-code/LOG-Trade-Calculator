name: Sync Sleeper League Data

on:
  schedule:
    # 13:00 UTC daily = 9am ET / 8am CT / 6am PT.
    # Sleeper only needs the full player pool refreshed ~once/day; this
    # cadence respects that. Bump to a few times/day in-season if you want
    # fresher roster snapshots (waiver adds, etc.) — rosters/users/picks are
    # cheap to call more often even if the player pool cache stays put.
    - cron: '0 13 * * *'
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run roster sync script
        run: python scripts/sync_sleeper.py

      - name: Refresh generated player-position compatibility map
        run: python scripts/generate_player_positions.py

      - name: Run trade history sync script
        run: python scripts/sync_trade_history.py

      - name: Commit and push if data changed
        run: |
          git config user.name "sleeper-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ scripts/player_positions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Sleeper data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
