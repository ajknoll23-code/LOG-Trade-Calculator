name: Sync Sleeper League Data

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync script
        run: python scripts/sync_sleeper.py

      - name: Commit and push if data changed
        run: |
          git config user.name "sleeper-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Sleeper data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
