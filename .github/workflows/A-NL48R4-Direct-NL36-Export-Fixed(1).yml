name: A-NL48R4 - Export Validated NL36 Editorial Fix
run-name: A-NL48R4 - Export repaired NL36 workflow for manual upload
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: log-nl48r4-editorial-export
  cancel-in-progress: false
jobs:
  repair:
    name: Keep editorial integrity gate, disambiguate factual closing lines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Apply guarded source-level repair in runner
        env:
          MODE: Export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          import difflib
          import os
          from pathlib import Path
          import yaml

          path=Path('.github/workflows/A-NL36R1.yml')
          before=path.read_text(encoding='utf-8')
          section_start=before.find('def nl29_integrate(')
          section_end=before.find('def nl29_editorial_gate(',section_start)
          if section_start<0 or section_end<0:
              raise SystemExit('REFUSE: NL29 integration/quality gate anchors missing')
          section=before[section_start:section_end]
          anchor_a='highest_used=False'
          anchor_b="s['takeaway']=replacements.get(s['takeaway'],s['takeaway'])"
          fix_marker='nl36_seen_closers'
          if fix_marker in section:
              print('ALREADY APPLIED: NL36 closer uniqueness repair is present')
              after=before
          else:
              if section.count(anchor_a)!=1 or section.count(anchor_b)!=1:
                  raise SystemExit('REFUSE: upstream NL36 source drift; repair anchors not unique')
              # Keep the existing rejection of duplicate closers. Repair collisions at
              # their source, using verified matchup identities and numeric evidence.
              # The closing punch stays LAST; no invented player or injury claims.
              # The source workflow stores the Python engine inside a YAML
              # double-quoted scalar. Avoid unescaped double quotes, braces,
              # and raw line breaks in this replacement text.
              repair_b=(
                  "s['takeaway']=replacements.get(s['takeaway'],s['takeaway']);"
                  "s['takeaway']=(s['takeaway'] if s['takeaway'].casefold() not in nl36_seen_closers "
                  "else (('%s and %s finished %.2f points apart. The scoreboard is not taking appeals.' "
                  "%(f['game']['name_a'],f['game']['name_b'],float(f['margin']))) "
                  "if kind=='after' else "
                  "('%s versus %s carries a %.2f-point recent scoring gap. The next game still has to be played.' "
                  "%(f['game']['name_a'],f['game']['name_b'],float(f['gap'])))));"
                  "nl36_seen_closers.add(s['takeaway'].casefold())"
              )
              # A raw edit is safe only if the embedded YAML string stays
              # correctly escaped. Enforce that invariant before modifying.
              if any(ch in repair_b for ch in ('"', '\n', '\r', '{', '}')):
                  raise SystemExit('REFUSE: unsafe YAML quoted-scalar injection')
              patched=section.replace(anchor_a,'highest_used=False;nl36_seen_closers=set()').replace(anchor_b,repair_b)
              after=before[:section_start]+patched+before[section_end:]
              if after==before or after[after.find('def nl29_editorial_gate('):]!=before[section_end:]:
                  raise SystemExit('REFUSE: unexpected scope change in workflow')
              if "NL29 HARD FAIL: repeated" not in after:
                  raise SystemExit('REFUSE: existing quality gate must be retained')
              if after.count('nl36_seen_closers')!=3:
                  raise SystemExit('REFUSE: expected unique closer tracking definition, read, and write')

          # Parse the full workflow, then syntax-check the actual embedded NL36 engine.
          doc=yaml.safe_load(after)
          steps=doc['jobs']['nl36r1-editorial-shadow']['steps']
          stage=next(s['run'] for s in steps if s.get('name','').startswith('Stage NL36R1 engine'))
          marker="<<'NL30_ENGINE'\n"
          if stage.count(marker)!=1 or '\nNL30_ENGINE' not in stage:
              raise SystemExit('REFUSE: embedded editorial engine markers changed')
          engine=stage.split(marker,1)[1].split('\nNL30_ENGINE',1)[0]
          ast.parse(engine,filename='log_nl36r1_editorial.py')
          if 'nl36_seen_closers' not in engine or 'NL29 HARD FAIL: repeated closers' not in engine:
              raise SystemExit('REFUSE: source uniqueness repair or hard gate missing from parsed engine')
          print('PASS: full workflow YAML and embedded Python compile cleanly')
          print('PASS: original editorial quality gate retained')
          print('PASS: only NL29 closer-collision source code touched')
          if before!=after:
              diff=list(difflib.unified_diff(before.splitlines(),after.splitlines(),fromfile='NL36-before',tofile='NL36-after',lineterm=''))
              # The YAML renderer wraps one long source line across several physical lines.
              print('\n'.join(diff[:45]))
              path.write_text(after,encoding='utf-8')
          else:
              print('NO CHANGE: repeat-safe')
          print('MODE:',os.environ['MODE'])
          PY
      - name: Check patch scope and readiness for manual install
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = ".github/workflows/A-NL36R1.yml"
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('.github/workflows/A-NL36R1.yml')
          x=p.read_text(encoding='utf8')
          assert 'nl36_seen_closers' in x
          assert 'NL29 HARD FAIL: repeated' in x
          assert yaml.safe_load(x)['jobs']['nl36r1-editorial-shadow']
          print('PASS: exact NL36 workflow replacement is validated; quality gates remain intact.')
          PY
          mkdir -p nl48_export
          cp .github/workflows/A-NL36R1.yml nl48_export/A-NL36R1.yml
          test -s nl48_export/A-NL36R1.yml
      - name: Upload repaired NL36 workflow as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: NL48R4-REPAIRED-A-NL36R1-${{ github.run_id }}
          path: nl48_export/A-NL36R1.yml
          retention-days: 30
          if-no-files-found: error
      - name: Explain manual install
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'END'
          ## NL48R4 — manual workflow replacement, not an auto-deployment
          - The validated replacement is inside the artifact named `NL48R4-REPAIRED-A-NL36R1-...`.
          - An Actions token cannot push edits to `.github/workflows` without `workflows` permission.
          - Download the artifact and upload its `A-NL36R1.yml` into the same `.github/workflows` folder from your signed-in GitHub account; overwrite the existing file.
          - Alternatively provide the successful run number to ChatGPT and request the exact updated YAML file.
          - Then rerun NL47: `war_week=10`, `refresh_sources=true`.
          - No repository changes are attempted by this workflow.
          END
