      - name: Real headless Chrome browser utility and identity UI smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > "${QF5_TMP}/browser.py" <<'QF5BROWSER'
          #!/usr/bin/env python3
          """QF5 A7-F02 browser acceptance test; uses only public committed JSON fixtures."""
          import json, threading, time, http.server, os
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          root=Path.cwd()
          fa=json.loads((root/'data/free_agents.json').read_text())
          ut=json.loads((root/'data/free_agent_utility_v1.json').read_text())
          baseline=json.loads((Path(os.environ['QF5_TMP'])/'before.json').read_text())
          expected_total=baseline['meta']['rendered']
          expected_backed=baseline['meta']['data_backed']-1
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Quiet)
          thread=threading.Thread(target=server.serve_forever,daemon=True)
          thread.start()
          options=Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1280,900')
          options.add_argument('--disable-background-networking')
          driver=None
          try:
              driver=webdriver.Chrome(options=options)
              inject=f'''(() => {{
                const fa={json.dumps(fa,separators=(',',':'))};
                const utility={json.dumps(ut,separators=(',',':'))};
                window.fetch=async function(url) {{
                  const u=String(url);
                  if(u.includes('free_agent_utility_v1.json')) {{
                    const copy=JSON.parse(JSON.stringify(utility));
                    if(window.__qf5ForceStale)copy.source.free_agents_synced_at=-1;
                    return {{ok:true,status:200,json:async()=>copy}};
                  }}
                  if(u.includes('free_agents.json'))return {{ok:true,status:200,json:async()=>fa}};
                  return {{ok:false,status:404,json:async()=>null}};
                }};
              }})();'''
              driver.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument',{'source':inject})
              driver.get(f'http://127.0.0.1:{server.server_address[1]}/free-agent-board.html')
              WebDriverWait(driver,22).until(lambda d:d.execute_script('return document.getElementById("syncStatus").classList.contains("ok")'))
              data=driver.execute_script('''
                document.body.classList.remove('free-agent-locked');
                document.getElementById('freeAgentPasswordGate')?.remove();
                const initial={active:FREE_AGENT_UTILITY_ACTIVE,count:FREE_AGENTS.filter(x=>x.hasRealData).length, status:document.getElementById('syncStatus').textContent};
                setDataOnly(false);
                const row=id=>document.querySelector('#boardWrap .row[data-player-id="'+id+'"]');
                const result={...initial,allCount:document.querySelectorAll('#boardWrap details:first-child .row').length,
                  jaylon11052:row('11052')?.innerText,jaylon8702:row('8702')?.innerText,
                  fv11052:FREE_AGENTS.find(x=>x.playerId==='11052')?.val,
                  fv8702:FREE_AGENTS.find(x=>x.playerId==='8702')?.val,
                  held:FREE_AGENTS.filter(x=>x.identityHeld).map(x=>x.playerId),
                  tag11052:row('11052')?.querySelector('.tag-data')!==null,
                  tag8702:row('8702')?.querySelector('.tag-est')!==null};
                return result;
              ''')
              assert data['active'] is True,data
              assert data['count']==expected_backed and data['allCount']==expected_total,data
              assert data['held']==['8702'],data
              assert data['tag11052'] and data['tag8702'],data
              assert '1 identity-held estimates' in data['status'],data
              assert data['fv11052']==1636 and isinstance(data['fv8702'],int) and 0<data['fv8702']<data['fv11052'],data
              assert f"{data['fv8702']:,}" in data['jaylon8702'] and f"{data['fv11052']:,}" in data['jaylon11052'],data
              refreshed=driver.execute_async_script("const done=arguments[arguments.length-1];window.__qf5ForceStale=true;loadFreeAgents().then(()=>done(true)).catch(e=>done(String(e)));")
              assert refreshed is True,refreshed
              stale=driver.execute_script('''return {active:FREE_AGENT_UTILITY_ACTIVE,hasRows:document.querySelectorAll('#boardWrap .row').length>0};''')
              assert stale=={'active':False,'hasRows':True},stale
              print(f'PASS QF5 real headless browser: {expected_backed} utility data rows, {expected_total} rendered; SID 8702 est FV {data["fv8702"]}, SID 11052 data FV {data["fv11052"]}; stale fallback')
          finally:
              if driver:driver.quit()
              server.shutdown()
          QF5BROWSER
          python3 "${QF5_TMP}/browser.py"
