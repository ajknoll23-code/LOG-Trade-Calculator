# QF5 V2R1 (A7-F02): R1b identity hold; preregistered E1/E2 corrections.
# Review-only. This file never writes to main or Pages. Secret CSVs never leave runner /tmp.
# A review branch is created only if 3-file atomic candidate passes ALL gates.
name: QF5 V2R1 - Free Agent Identity R1b Three File Review Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf5-review-candidate:
    name: R1b reviewed three-file candidate, frozen lineage and secret-backed rebuild
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QF5_REVIEW_BRANCH: 'qf5-a7f02-v2r1-r1b-review-2026-10-11'
      QF5_BASE: '0621d68292fe088f5b948849eea2027c537534e2'
      QF5_TMP: /tmp/log-qf5-r1b
    steps:
      - name: Checkout pinned triggering main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing validation and headless browser dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Pinned source verification, model invariants and unused review branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP checkout wrong SHA'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP main advanced'; exit 1; }
          python3 - <<'PY'
          import subprocess
          expected={
           'index.html':'2666f7f8b167e48b7d1571ab527450b521d32c75',
           'free-agent-board.html':'700c52db74c05b1122b4f0a48cf082243d98b0a7',
           'scripts/validation/validate_free_agent_valuation_parity.py':'bf03ccc46a6219e5d3d7e465faac9e1665dd94c6',
           'scripts/projections/build_free_agent_utility_v1.py':'c1fb62c1c04b4b539fa74bff4ee038ec1a4cccc1',
           'scripts/validation/validate_free_agent_utility_v1.py':'bc30ff0bec940e06e8a358f7dc797434463b4684',
           'research/free-agent-utility-v1/free_agent_utility_v1_phase1.py':'1bb87f685c00e51a488a0c21510ccdca452e6b72',
           'scripts/identity_crosswalk.json':'3489c01c923474931f4db81e3dd338f437bfdf5f',
           'model/releases/free-agent-production-v2/release.json':'75c9665c0493d8ac4900479b6802c807aaa45633'
          }
          for path,blob in expected.items():
           got=subprocess.check_output(['git','hash-object',path],text=True).strip()
           assert got==blob,f'STOP pinned source drift: {path}: got {got}'
          changed=subprocess.check_output(['git','diff','--name-only','0621d68292fe088f5b948849eea2027c537534e2','HEAD'],text=True).splitlines()
          # E2: code and frozen science are hash-pinned above. Do not pin daily Sleeper
          # snapshots or forbid normal data refreshes since QF4 deployment.
          assert not set(changed).intersection(expected),f'STOP protected source changed since QF4: {sorted(set(changed).intersection(expected))}'
          assert '0621d68292fe088f5b948849eea2027c537534e2' in subprocess.check_output(['git','rev-list','HEAD'],text=True),'STOP QF4 production lineage not ancestor'
          print('PASS QF5 pinned science/code blobs; normal data-refresh commits allowed')
          PY
          if git ls-remote --exit-code --heads origin "${QF5_REVIEW_BRANCH}" >/dev/null; then
            echo 'STOP existing QF5 review branch; no overwrite'; exit 1
          fi
      - name: Install baseline/candidate acceptance harness only in runner temporary directory
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${QF5_TMP}"
          cat > "${QF5_TMP}/acceptance.py" <<'QF5TEST'
          #!/usr/bin/env python3
          """QF5 R1b acceptance checks (baseline, candidate, artifact, mutation)."""
          import json, re, sys, subprocess, tempfile, os
          from pathlib import Path
          from collections import Counter

          ROOT=Path.cwd()
          sys.path.insert(0,str(ROOT/'scripts/validation'))
          import validate_free_agent_valuation_parity as val

          BOARD=ROOT/'free-agent-board.html'
          ART=ROOT/'data/free_agent_utility_v1.json'
          SOURCE=ROOT/'data/free_agents.json'
          SNAP=Path(os.environ.get('QF5_TMP','/tmp/log-qf5-r1b'))/'before.json'
          DOC=json.loads(SOURCE.read_text())

          def runtime():
              return val._board_runtime_rows(BOARD.read_text(),DOC)

          def index_rows(d):
              r=d['rows']
              by={str(x['playerId']):x for x in r}
              assert len(by)==len(r) and len(r)>0,f'Unexpected rendered/unique SID count: {len(by)}/{len(r)}'
              return by

          mode=sys.argv[1]
          if mode=='baseline':
              baseline=runtime()
              by=index_rows(baseline)
              # E2 immutable premise: both real Jaylon DB SIDs are free agents and
              # presently inherit the same canonical record. If a future sync
              # changes the premise, STOP; never infer a replacement target.
              assert {'11052','8702'} <= set(by), 'STOP Jaylon identity premise changed: expected both SIDs in FA snapshot'
              for sid in ('11052','8702'):
                  row=by[sid]
                  assert row['key']=='jaylon jones' and row['pos']=='DB' and row['val']==1636 and row['hasRealData'],f'STOP Jaylon baseline identity/FV premise changed: {sid} {row}'
              backed=sum(bool(x['hasRealData']) for x in by.values())
              art=json.loads(ART.read_text())
              assert len(art['players'])==backed,f'STOP stale baseline utility artifact: {len(art["players"])} != {backed}'
              assert {str(r['player_id']) for r in art['players']} == {sid for sid,r in by.items() if r['hasRealData']},'STOP baseline artifact/data-backed population mismatch'
              # Stores only public board outputs in runner /tmp, never private provider data.
              SNAP.write_text(json.dumps({'rows':by,'sources':baseline['production_source_by_id'],'meta':{'rendered':len(by),'data_backed':backed}},sort_keys=True))
              print(f'PASS QF5 original baseline: {len(by)} rows, {backed} data-backed; both Jaylon DB SIDs have canonical FV 1636')
          elif mode=='candidate':
              snapshot=json.loads(SNAP.read_text())
              before=snapshot['rows']
              after=index_rows(runtime())
              assert set(before)==set(after),'Free Agent SID set changed'
              fields=('key','name','pos','age','role','val','hasRealData','team','injuryStatus','utilityRank')
              changed=[sid for sid in before if any(before[sid].get(k)!=after[sid].get(k) for k in fields)]
              assert set(changed)=={'8702'} and len(changed)==1,f'QF5 STOP unintended visible mapping drift: {changed[:18]} (n={len(changed)})'
              b,a=before['8702'],after['8702']
              assert (b['age'],b['role'],b['val'],b['hasRealData'])==(24,'Depth',1636,True)
              raw_8702=next(x for x in DOC['free_agents'] if str(x['player_id'])=='8702')
              assert a['age']==(raw_8702.get('age') or 24) and a['pos']=='DB' and a['role']=='Speculative' and not a['hasRealData'],a
              assert isinstance(a['val'],int) and 0<a['val']<b['val'],f'STOP identity-held estimate not below inherited production FV: {a}'
              assert a.get('identityHeld') is True
              assert not after['11052'].get('identityHeld')
              assert sum(bool(x['hasRealData']) for x in after.values())==snapshot['meta']['data_backed']-1
              assert sum(bool(x.get('identityHeld')) for x in after.values())==1
              assert '1 identity-held estimates' in runtime()['status']
              print(f'PASS QF5 candidate: exactly SID 8702 held, FV {b["val"]} -> {a["val"]}, data-backed {snapshot["meta"]["data_backed"]} -> {snapshot["meta"]["data_backed"]-1}; 11052 preserved')

              # Simulate actual board mapping, rather than independently reimplementing it.
              jaylon=[x for x in DOC['free_agents'] if str(x.get('player_id')) in ('11052','8702')]
              def test(rows,desc):
                  fake={'free_agents':rows,'synced_at':DOC['synced_at'],'league_id':DOC['league_id'],'count':len(rows)}
                  d=val._board_runtime_rows(BOARD.read_text(),fake)
                  return {str(x['playerId']):x for x in d['rows']}
              third=test(jaylon+[{'player_id':'99001','name':'Jaylon Jones','pos':'DB','age':24,'team':'ZZ'}],'third')
              assert third['11052']['hasRealData'] and not third['11052'].get('identityHeld')
              assert all(third[x]['identityHeld'] and third[x]['role']=='Speculative' and not third[x]['hasRealData'] for x in ('8702','99001'))
              assert third['8702']['val']==a['val']
              assert test([jaylon[0]],'only-11052')['11052']['hasRealData']
              single=test([jaylon[1]],'only-8702')['8702']
              assert single['identityHeld'] and single['val']==a['val']
              new=[{'player_id':'9911','name':'Zonovan Knight','pos':'RB','age':24,'team':'Z1'},
                   {'player_id':'9912','name':'Zonovan Knight','pos':'RB','age':25,'team':'Z2'}]
              future=test(new,'future')
              assert all(future[s]['identityHeld'] for s in ('9911','9912'))
              same=test([jaylon[1],jaylon[1]],'duplicate-sid')
              assert same['8702']['identityHeld'] # known hold is permanent even singleton
              identical=test([new[0],new[0]],'same-sid-unknown')
              assert not identical['9911'].get('identityHeld') # a repeated row is not a distinct SID collision
              empty=test([{'player_id':'','name':'Jaylon Jones','pos':'DB','age':25,'team':'ZZ'}],'empty-sid')
              assert empty['']['identityHeld'] and not empty['']['hasRealData']
              controls=test([
                {'player_id':'nrb','name':'Devin Neal','pos':'RB','age':23,'team':'Z1'},
                {'player_id':'ndb','name':'Devin Neal','pos':'DB','age':23,'team':'Z2'},
                {'player_id':'jlb','name':'Justin Jefferson','pos':'LB','age':23,'team':'CLE'},
                {'player_id':'bw','name':'Byron Young','pos':'WR','age':25,'team':'PHI'},
                {'player_id':'bdl','name':'Byron Young','pos':'DL','age':25,'team':'PHI'},
                {'player_id':'dwr','name':'Devonta Smith','pos':'WR','age':27,'team':'PHI'},
                {'player_id':'ddb','name':'Devonta Smith','pos':'DB','age':23,'team':'CAR'}
              ],'controls')
              assert not controls['nrb'].get('identityHeld') and not controls['ndb'].get('identityHeld')
              assert controls['jlb']['age']==23 and controls['jlb']['role']=='Speculative'
              assert 'bdl' not in controls and 'ddb' not in controls
              assert 'bw' in controls and 'dwr' in controls
              print('PASS QF5 hostile identity fixtures: third/only/unknown/same-SID/empty-SID, cross-position and exclusion controls')

              # Direct group block test for alias asymmetry, independent of the full board data.
              src=BOARD.read_text()
              p=src.index('    const QF5_TRUSTED_SID =')
              q=src.index('    /* QF5_A7F02_R1B_IDENTITY_HOLD_END */',p)
              helper=src[p:q]
              js='''const assert=require('node:assert/strict');
              const ALIASES={'michael penix jr':'michael penix'};
              const ALIASES_REVERSE={};
              const normalizeName=s=>String(s||'').toLowerCase().trim();
              const filteredRaw=[{name:'Michael Penix',pos:'QB',player_id:'p1'},
                {name:'Michael Penix Jr',pos:'QB',player_id:'p2'}];
              '''+helper+'''
              assert(qf5IdentityHeld(filteredRaw[0],'michael penix','michael penix'));
              assert(qf5IdentityHeld(filteredRaw[1],'michael penix jr','michael penix'));
              console.log('PASS alias-derived cross-key collision');'''
              result=subprocess.run(['node','-e',js],capture_output=True,text=True)
              assert result.returncode==0,(result.stderr or result.stdout)[:900]
              print(result.stdout.strip())

          elif mode=='artifact':
              old=json.loads(subprocess.check_output(['git','show','HEAD:data/free_agent_utility_v1.json'],text=True))
              new=json.loads(ART.read_text())
              # E1 preregistered before any real private-source rebuild:
              # exact SID set, no non-DB drift, bounded DB percentile reorder.
              assert old['source']==new['source'],'STOP utility source contract drift'
              for k in ('schema_version','policy_id','scope','all_section_policy','position_section_policy'):
                  assert old[k]==new[k],f'STOP utility scalar drift: {k}'
              a={str(x['player_id']):x for x in old['players']}
              b={str(x['player_id']):x for x in new['players']}
              assert len(a)==len(old['players']) and len(b)==len(new['players']),'STOP duplicate utility SID'
              assert len(b)==len(a)-1,'STOP unexpected utility cohort count change'
              assert set(a)-set(b)=={'8702'} and not (set(b)-set(a)),'QF5 STOP artifact population drift'
              removed=a['8702']; assert removed['pos']=='DB'
              for sid,row in b.items():
                  assert set(row)=={'player_id','pos','priority_rank'} and row['pos']==a[sid]['pos'],f'STOP utility row schema/position drift: {sid}'
                  if row['pos']!='DB':
                      assert row==a[sid],f'QF5 STOP non-DB utility artifact drift {sid}'
              for pos in {x['pos'] for x in b.values()}:
                  ranks=sorted(x['priority_rank'] for x in b.values() if x['pos']==pos)
                  assert ranks==list(range(1,len(ranks)+1)),f'STOP noncontiguous utility ranks: {pos}'
              deviations=[]
              for sid,row in b.items():
                  if row['pos']=='DB':
                      expected=a[sid]['priority_rank']-(1 if a[sid]['priority_rank']>removed['priority_rank'] else 0)
                      if row['priority_rank']!=expected: deviations.append((sid,expected,row['priority_rank']))
              print('QF5 preregistered DB rank deviations (SID, expected pure shift, actual):',deviations)
              assert len(deviations)<=14 and all(abs(actual-expected)<=2 for _,expected,actual in deviations),'QF5 STOP DB rank-deviation budget exceeded'
              print(f'PASS QF5 artifact: {len(a)} -> {len(b)}; only SID 8702 removed; non-DB exact; {len(deviations)} bounded DB re-orderings')
          elif mode=='mutation':
              # Independent source harness must reject reverting the board to legacy
              # name/position join, even when the validator is deployed. Restore always.
              saved=BOARD.read_bytes()
              try:
                  legacy=subprocess.check_output(['git','show','HEAD:free-agent-board.html'])
                  BOARD.write_bytes(legacy)
                  p=subprocess.run(['python3','scripts/validation/validate_free_agent_valuation_parity.py'],capture_output=True,text=True)
                  assert p.returncode!=0,'QF5 STOP validator failed to detect removed identity hold'
                  assert 'real-data badge/source mismatch for 8702' in p.stdout+p.stderr,(p.stdout+p.stderr)[-1400:]
              finally:
                  BOARD.write_bytes(saved)
              print('PASS negative mutation: validator fails when identity hold is reverted')
          else:
              raise SystemExit('usage: baseline|candidate|artifact|mutation')
          QF5TEST
          python3 -m py_compile "${QF5_TMP}/acceptance.py"
          python3 "${QF5_TMP}/acceptance.py" baseline
      - name: Apply exact-scoped R1b board and independent validator changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'QF5PATCH'
          #!/usr/bin/env python3
          """QF5 R1b review-only source patch, executed in Actions from its YAML."""
          from pathlib import Path
          import subprocess

          board_path=Path('free-agent-board.html')
          parity_path=Path('scripts/validation/validate_free_agent_valuation_parity.py')
          board=board_path.read_text(encoding='utf-8')
          parity=parity_path.read_text(encoding='utf-8')

          # Mutation budgets: exactly these source anchors and no fuzzy replacements.
          def replace(source, old, new, n=1):
              found=source.count(old)
              if found!=n:
                  raise RuntimeError(f'QF5 STOP source anchor missing/drifted: expected {n}, got {found}: {old[:90]!r}')
              return source.replace(old,new)

          block=r'''    /* QF5_A7F02_R1B_IDENTITY_HOLD_START
                 Resolve known same-name/position identity by independently audited Sleeper ID.
                 Unknown collisions fail closed. This changes only the Free Agent Board
                 source routing, never canonical valuations or frozen production tables. */
              const QF5_TRUSTED_SID = Object.freeze({'jaylon jones|DB':'11052'});
              const qf5RawGroups = new Map();
              const qf5ResolvedGroups = new Map();
              for(const entry of filteredRaw){
                const rawName = normalizeName(entry.name);
                const resolvedName = ALIASES[rawName] || ALIASES_REVERSE[rawName] || rawName;
                const sid = String(entry.player_id || '');
                for(const [groups, group] of [
                  [qf5RawGroups, rawName + '|' + entry.pos],
                  [qf5ResolvedGroups, resolvedName + '|' + entry.pos],
                ]){
                  if(!groups.has(group)) groups.set(group, new Set());
                  groups.get(group).add(sid);
                }
              }
              function qf5IdentityHeld(fa, rawName, resolvedName){
                const rawGroup = rawName + '|' + fa.pos;
                const resolvedGroup = resolvedName + '|' + fa.pos;
                const sid = String(fa.player_id || '');
                if(Object.prototype.hasOwnProperty.call(QF5_TRUSTED_SID, resolvedGroup)){
                  return sid !== QF5_TRUSTED_SID[resolvedGroup];
                }
                return (qf5RawGroups.get(rawGroup)?.size || 0) > 1 ||
                       (qf5ResolvedGroups.get(resolvedGroup)?.size || 0) > 1;
              }
              /* QF5_A7F02_R1B_IDENTITY_HOLD_END */

          '''
          board=replace(board,'    FREE_AGENTS = filteredRaw.map(fa => {',block+'    FREE_AGENTS = filteredRaw.map(fa => {')
          board=replace(board,
          '''      const candidateCurated = PLAYER_DB[key];''',
          '''      const identityHeld = qf5IdentityHeld(fa, rawKey, key);
                const candidateCurated = PLAYER_DB[key];''')
          board=replace(board,
          '''      const curated = (candidateCurated && candidateCurated.pos === fa.pos) ? candidateCurated : null;''',
          '''      const curated = (!identityHeld && candidateCurated && candidateCurated.pos === fa.pos) ? candidateCurated : null;''')
          board=replace(board,
          '''      const faProdMatch = (faProdEntry && faProdEntry.pos === fa.pos) ? faProdEntry : null;''',
          '''      const faProdMatch = (!identityHeld && faProdEntry && faProdEntry.pos === fa.pos) ? faProdEntry : null;''')
          board=replace(board,
          '''        key, playerId, name: fa.name, pos, age, role, val, hasRealData,
                  utilityRank, team: fa.team, injuryStatus: fa.injury_status,''',
          '''        key, playerId, name: fa.name, pos, age, role, val, hasRealData,
                  ...(identityHeld ? {identityHeld: true} : {}), utilityRank, team: fa.team, injuryStatus: fa.injury_status,''')
          board=replace(board,
          '''    statusEl.textContent = `Loaded ${FREE_AGENTS.length} free agents (${dataCount} with real production data) · synced ${new Date(data.synced_at * 1000).toLocaleDateString()}`;''',
          '''    const identityHeldCount = FREE_AGENTS.filter(fa => fa.identityHeld).length;
              statusEl.textContent = `Loaded ${FREE_AGENTS.length} free agents (${dataCount} with real production data) · ${identityHeldCount} identity-held estimates · synced ${new Date(data.synced_at * 1000).toLocaleDateString()}`;''')

          # The validator is independent of board-reported identityHeld, and therefore
          # must detect a reverted board hold (negative-mutation acceptance gate).
          parity=replace(parity,
          '''  canonical_role_only: 0
          }};''',
          '''  canonical_role_only: 0,
            identity_held: 0
          }};''')
          parity_block=r'''const __qf5RawGroups = new Map();
          const __qf5ResolvedGroups = new Map();
          const __qf5Included = (__data.free_agents || []).filter(fa => {{
            const raw = normalizeName(fa.name);
            return ![['byron young','DL'],['devonta smith','DB']].some(([n,p]) => n === raw && p === fa.pos);
          }});
          for(const fa of __qf5Included) {{
            const raw = normalizeName(fa.name);
            const resolved = ALIASES[raw] || ALIASES_REVERSE[raw] || raw;
            const sid = String(fa.player_id || '');
            for(const [groups, group] of [
              [__qf5RawGroups, raw + '|' + fa.pos],
              [__qf5ResolvedGroups, resolved + '|' + fa.pos]
            ]) {{
              if(!groups.has(group)) groups.set(group, new Set());
              groups.get(group).add(sid);
            }}
          }}
          const __qf5ResolvedSID = {{'jaylon jones|DB':'11052'}};
          '''
          parity=replace(parity,
          '''const __sourceById = {{}};
          for (const fa of (__data.free_agents || [])) {{''',
          '''const __sourceById = {{}};
          '''+parity_block+'''for (const fa of (__data.free_agents || [])) {{''')
          parity=replace(parity,
          '''  const candidateCurated = PLAYER_DB[key];
            const curated = (candidateCurated && candidateCurated.pos === fa.pos) ? candidateCurated : null;''',
          '''  const __rawGroup = rawKey + '|' + fa.pos;
            const __resolvedGroup = key + '|' + fa.pos;
            const __sid = String(fa.player_id || '');
            const __held = Object.prototype.hasOwnProperty.call(__qf5ResolvedSID, __resolvedGroup)
              ? __sid !== __qf5ResolvedSID[__resolvedGroup]
              : ((__qf5RawGroups.get(__rawGroup)?.size || 0) > 1 ||
                 (__qf5ResolvedGroups.get(__resolvedGroup)?.size || 0) > 1);
            const candidateCurated = PLAYER_DB[key];
            const curated = (!__held && candidateCurated && candidateCurated.pos === fa.pos) ? candidateCurated : null;''')
          parity=replace(parity,
          '''  const faProdMatch = (faProdEntry && faProdEntry.pos === fa.pos) ? faProdEntry : null;''',
          '''  const faProdMatch = (!__held && faProdEntry && faProdEntry.pos === fa.pos) ? faProdEntry : null;''')
          parity=replace(parity,
          '''  if (curated && Object.prototype.hasOwnProperty.call(PROD_MULT, key)) source = 'canonical_prod';''',
          '''  if (__held) source = 'identity_held';
            else if (curated && Object.prototype.hasOwnProperty.call(PROD_MULT, key)) source = 'canonical_prod';''')

          assert board.count('QF5_A7F02_R1B_IDENTITY_HOLD_START')==1
          assert parity.count('__qf5ResolvedSID')==3 # declaration, hasOwnProperty, lookup
          board_path.write_text(board,encoding='utf-8')
          parity_path.write_text(parity,encoding='utf-8')
          print('PASS QF5 R1b candidate source: board identity hold and independent validator classification patched')
          QF5PATCH
          python3 "${QF5_TMP}/acceptance.py" candidate
          python3 scripts/sync/sync_free_agent_valuation.py --check
      - name: Regenerate utility ranks with pinned existing private-source builder
        shell: bash
        env:
          FOURFORFOUR_OFFENSE_GZ_B64_PART1: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART1 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART2: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART2 }}
          FOURFORFOUR_OFFENSE_GZ_B64_PART3: ${{ secrets.FOURFORFOUR_OFFENSE_GZ_B64_PART3 }}
          FOURFORFOUR_DL_GZ_B64: ${{ secrets.FOURFORFOUR_DL_GZ_B64 }}
          FOURFORFOUR_LB_GZ_B64: ${{ secrets.FOURFORFOUR_LB_GZ_B64 }}
          FOURFORFOUR_DB_GZ_B64: ${{ secrets.FOURFORFOUR_DB_GZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "${QF5_TMP}/input"
          for v in FOURFORFOUR_OFFENSE_GZ_B64_PART1 FOURFORFOUR_OFFENSE_GZ_B64_PART2 FOURFORFOUR_OFFENSE_GZ_B64_PART3 FOURFORFOUR_DL_GZ_B64 FOURFORFOUR_LB_GZ_B64 FOURFORFOUR_DB_GZ_B64; do
            [[ -n "${!v:-}" ]] || { echo "STOP missing expected existing secret: $v"; exit 1; }
          done
