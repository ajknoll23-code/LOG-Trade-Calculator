          set -euo pipefail
          [[ "$(git hash-object index.html)" == '2666f7f8b167e48b7d1571ab527450b521d32c75' ]] || { echo 'STOP canonical index modified'; exit 1; }
          python3 - <<'PY'
          import subprocess
          expected={'free-agent-board.html','scripts/validation/validate_free_agent_valuation_parity.py','data/free_agent_utility_v1.json'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,f'STOP changed files outside atomic QF5 package: {sorted(actual)}'
          print('PASS candidate exactly three files, excludes index.html')
