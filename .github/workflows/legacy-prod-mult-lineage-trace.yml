name: Legacy PROD_MULT Lineage Trace

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: legacy-prod-mult-lineage-trace
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Trace historical lineage and replay generator
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import shutil
          import statistics
          import subprocess
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(".").resolve()
          RELEASE = ROOT / "model" / "releases" / "idp-v1"
          MANIFEST = json.loads((RELEASE / "idp_v1_release_manifest.json").read_text())
          BASELINE_DOC = json.loads((RELEASE / "prod_mult_pre_v1_baseline.json").read_text())
          BASELINE = BASELINE_DOC["values"]
          BASELINE_INDEX_SHA256 = BASELINE_DOC["source_sha256"]

          REPORT_DIR = ROOT / "research" / "legacy-prod-mult"
          REPORT_JSON = REPORT_DIR / "historical_lineage_trace.json"
          REPORT_MD = REPORT_DIR / "historical_lineage_trace.md"

          SOURCE_EXPECTED = MANIFEST.get("release_source_snapshot_sha256", {})
          CODE_EXPECTED = MANIFEST.get("release_lineage_code_snapshot_sha256", {})
          EXPECTED = {**SOURCE_EXPECTED, **CODE_EXPECTED}

          FORMULA_INPUTS = (
              "scripts/ppg_results.json",
              "scripts/durability_results.json",
              "scripts/fantasypros_2026_projections.json",
              "scripts/sleeper_2026_projections.json",
          )

          def git(*args, check=True, text=False):
              p = subprocess.run(
                  ["git", *args],
                  cwd=ROOT,
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=text,
              )
              return p.stdout

          def blob_bytes(blob_sha):
              return git("cat-file", "blob", blob_sha)

          blob_sha256_cache = {}

          def sha256_blob(blob_sha):
              if blob_sha not in blob_sha256_cache:
                  blob_sha256_cache[blob_sha] = hashlib.sha256(blob_bytes(blob_sha)).hexdigest()
              return blob_sha256_cache[blob_sha]

          def tree_map(commit):
              raw = git("ls-tree", "-r", "-z", commit)
              out = {}
              for item in raw.split(b"\0"):
                  if not item:
                      continue
                  meta, path = item.split(b"\t", 1)
                  parts = meta.split()
                  if len(parts) >= 3 and parts[1] == b"blob":
                      out[path.decode()] = parts[2].decode()
              return out

          def commit_meta(commit):
              raw = git("show", "-s", "--format=%H%x00%cI%x00%s", commit, text=True).strip()
              sha, date, subject = raw.split("\x00", 2)
              return {"sha": sha, "date": date, "subject": subject}

          commits = git("rev-list", "--all", "--topo-order", text=True).splitlines()

          wanted_paths = set(EXPECTED) | {"index.html", "scripts/prod_mult_pipeline.py"}
          match_commits_by_path = {path: [] for path in EXPECTED}
          index_match_commits = []
          formula_input_full_commits = []
          full_source_commits = []
          full_code_commits = []
          full_lineage_commits = []
          ranked = []

          for commit in commits:
              tree = tree_map(commit)

              source_matches = 0
              code_matches = 0
              total_matches = 0
              formula_matches = 0

              for path, expected in EXPECTED.items():
                  blob = tree.get(path)
                  matched = bool(blob and sha256_blob(blob) == expected)
                  if matched:
                      match_commits_by_path[path].append(commit)
                      total_matches += 1
                      if path in SOURCE_EXPECTED:
                          source_matches += 1
                      if path in CODE_EXPECTED:
                          code_matches += 1
                      if path in FORMULA_INPUTS:
                          formula_matches += 1

              index_blob = tree.get("index.html")
              index_match = bool(
                  index_blob
                  and sha256_blob(index_blob) == BASELINE_INDEX_SHA256
              )
              if index_match:
                  index_match_commits.append(commit)

              if source_matches == len(SOURCE_EXPECTED):
                  full_source_commits.append(commit)
              if code_matches == len(CODE_EXPECTED):
                  full_code_commits.append(commit)
              if total_matches == len(EXPECTED):
                  full_lineage_commits.append(commit)
              if formula_matches == len(FORMULA_INPUTS):
                  formula_input_full_commits.append(commit)

              if total_matches or index_match:
                  ranked.append({
                      "sha": commit,
                      "source_matches": source_matches,
                      "source_total": len(SOURCE_EXPECTED),
                      "code_matches": code_matches,
                      "code_total": len(CODE_EXPECTED),
                      "total_matches": total_matches,
                      "total_expected": len(EXPECTED),
                      "formula_input_matches": formula_matches,
                      "formula_input_total": len(FORMULA_INPUTS),
                      "baseline_index_match": index_match,
                  })

          meta_cache = {}
          def meta(commit):
              if commit not in meta_cache:
                  meta_cache[commit] = commit_meta(commit)
              return meta_cache[commit]

          def ts(commit):
              return datetime.fromisoformat(meta(commit)["date"].replace("Z", "+00:00")).timestamp()

          index_anchor = index_match_commits[0] if index_match_commits else None

          def closest(candidates):
              if not candidates:
                  return None
              if not index_anchor:
                  return candidates[0]
              anchor_ts = ts(index_anchor)
              return min(candidates, key=lambda c: abs(ts(c) - anchor_ts))

          replay_commit = (
              closest(full_lineage_commits)
              or closest(formula_input_full_commits)
              or closest(full_source_commits)
              or index_anchor
          )

          def percentile(vals, q):
              if not vals:
                  return None
              vals = sorted(vals)
              x = (len(vals) - 1) * q
              lo, hi = math.floor(x), math.ceil(x)
              if lo == hi:
                  return vals[lo]
              return vals[lo] + (vals[hi] - vals[lo]) * (x - lo)

          def compare_generated(output_path):
              doc = json.loads(output_path.read_text())
              players = doc["players"]
              overlap = sorted(set(BASELINE) & set(players))
              rows = []
              exact = 0
              for key in overlap:
                  gen = players[key].get("prod_mult_reconstructed")
                  if gen is None:
                      continue
                  live = float(BASELINE[key])
                  diff = float(gen) - live
                  ad = abs(diff)
                  if ad < 1e-12:
                      exact += 1
                  rows.append({
                      "key": key,
                      "pos": players[key].get("pos"),
                      "live": live,
                      "generated": float(gen),
                      "signed_diff": diff,
                      "abs_diff": ad,
                      "proj_source": players[key].get("proj_source"),
                  })
              abs_diffs = [r["abs_diff"] for r in rows]
              top = sorted(rows, key=lambda r: r["abs_diff"], reverse=True)[:25]
              return {
                  "generated_players": len(players),
                  "overlap_keys": len(overlap),
                  "compared_rows": len(rows),
                  "exact_matches": exact,
                  "median_abs_diff": statistics.median(abs_diffs) if abs_diffs else None,
                  "p90_abs_diff": percentile(abs_diffs, 0.90),
                  "p95_abs_diff": percentile(abs_diffs, 0.95),
                  "max_abs_diff": max(abs_diffs) if abs_diffs else None,
                  "top_drift": top,
              }

          def git_file(commit, path):
              return git("show", f"{commit}:{path}")

          def prepare_replay(temp_dir: Path, historical_commit: str | None):
              archived_pipeline = ROOT / "research" / "legacy-prod-mult" / "prod_mult_pipeline.py"
              canonical_history = ROOT / "scripts" / "model" / "production_history_component.py"
              canonical_ppg = ROOT / "scripts" / "model" / "ppg_pipeline.py"

              # Prefer the actual historical pipeline/code when they existed at
              # the replay commit; otherwise use the archived reconstruction.
              tree = tree_map(historical_commit) if historical_commit else {}

              if historical_commit and "scripts/prod_mult_pipeline.py" in tree:
                  (temp_dir / "prod_mult_pipeline.py").write_bytes(
                      git_file(historical_commit, "scripts/prod_mult_pipeline.py")
                  )
                  pipeline_source = "historical_commit"
              else:
                  shutil.copy2(archived_pipeline, temp_dir / "prod_mult_pipeline.py")
                  pipeline_source = "current_archived_reconstruction"

              if historical_commit and "scripts/production_history_component.py" in tree:
                  (temp_dir / "production_history_component.py").write_bytes(
                      git_file(historical_commit, "scripts/production_history_component.py")
                  )
                  history_source = "historical_commit"
              else:
                  shutil.copy2(canonical_history, temp_dir / "production_history_component.py")
                  history_source = "current_canonical"

              if historical_commit and "scripts/ppg_pipeline.py" in tree:
                  (temp_dir / "ppg_pipeline.py").write_bytes(
                      git_file(historical_commit, "scripts/ppg_pipeline.py")
                  )
                  ppg_source = "historical_commit"
              else:
                  shutil.copy2(canonical_ppg, temp_dir / "ppg_pipeline.py")
                  ppg_source = "current_canonical"

              for path in FORMULA_INPUTS:
                  name = Path(path).name
                  if historical_commit:
                      (temp_dir / name).write_bytes(git_file(historical_commit, path))
                  else:
                      shutil.copy2(ROOT / path, temp_dir / name)

              return {
                  "pipeline_source": pipeline_source,
                  "history_code_source": history_source,
                  "ppg_code_source": ppg_source,
              }

          def run_replay(historical_commit=None):
              with tempfile.TemporaryDirectory() as td:
                  td = Path(td)
                  sources = prepare_replay(td, historical_commit)
                  proc = subprocess.run(
                      ["python3", "prod_mult_pipeline.py"],
                      cwd=td,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  result = {
                      "status": "PASS" if proc.returncode == 0 else "ERROR",
                      "returncode": proc.returncode,
                      "sources": sources,
                      "stdout_tail": "\n".join(proc.stdout.splitlines()[-40:]),
                  }
                  out = td / "prod_mult_pipeline_output.json"
                  if proc.returncode == 0 and out.exists():
                      result["comparison"] = compare_generated(out)
                  return result

          current_replay = run_replay(None)
          historical_replay = run_replay(replay_commit) if replay_commit else {
              "status": "SKIPPED",
              "reason": "No historical candidate commit found",
          }

          ranked.sort(
              key=lambda r: (
                  r["baseline_index_match"],
                  r["total_matches"],
                  r["formula_input_matches"],
              ),
              reverse=True,
          )

          result = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "baseline": {
                  "entry_count": len(BASELINE),
                  "source_index_sha256": BASELINE_INDEX_SHA256,
                  "matching_index_commits": [meta(c) for c in index_match_commits[:20]],
              },
              "manifest": {
                  "release_id": MANIFEST.get("release_id"),
                  "source_snapshot_count": len(SOURCE_EXPECTED),
                  "code_snapshot_count": len(CODE_EXPECTED),
                  "full_source_commits": [meta(c) for c in full_source_commits[:20]],
                  "full_code_commits": [meta(c) for c in full_code_commits[:20]],
                  "full_lineage_commits": [meta(c) for c in full_lineage_commits[:20]],
                  "formula_input_full_commits": [meta(c) for c in formula_input_full_commits[:20]],
                  "per_path_match_counts": {
                      path: len(commits_) for path, commits_ in match_commits_by_path.items()
                  },
              },
              "replay_commit": meta(replay_commit) if replay_commit else None,
              "current_source_replay": current_replay,
              "historical_source_replay": historical_replay,
              "best_matching_commits": [
                  {**r, **meta(r["sha"])} for r in ranked[:20]
              ],
          }

          REPORT_JSON.write_text(json.dumps(result, indent=2) + "\n")

          def fnum(x):
              return "n/a" if x is None else f"{x:.4f}"

          def replay_lines(title, replay):
              lines = [f"## {title}", ""]
              lines.append(f"- Status: **{replay.get('status')}**")
              if replay.get("sources"):
                  s = replay["sources"]
                  lines += [
                      f"- Pipeline code: `{s['pipeline_source']}`",
                      f"- History code: `{s['history_code_source']}`",
                      f"- PPG/aliases code: `{s['ppg_code_source']}`",
                  ]
              c = replay.get("comparison")
              if c:
                  lines += [
                      f"- Generated players: **{c['generated_players']}**",
                      f"- Compared overlap rows: **{c['compared_rows']}**",
                      f"- Exact matches to frozen baseline: **{c['exact_matches']}**",
                      f"- Median absolute drift: **{fnum(c['median_abs_diff'])}**",
                      f"- P90 absolute drift: **{fnum(c['p90_abs_diff'])}**",
                      f"- P95 absolute drift: **{fnum(c['p95_abs_diff'])}**",
                      f"- Maximum absolute drift: **{fnum(c['max_abs_diff'])}**",
                      "",
                      "Largest drifts:",
                      "",
                      "| Player | Pos | Frozen | Replayed | Diff | Projection source |",
                      "|---|---|---:|---:|---:|---|",
                  ]
                  for r in c["top_drift"][:15]:
                      lines.append(
                          f"| {r['key']} | {r['pos']} | {r['live']:.4f} | "
                          f"{r['generated']:.4f} | {r['signed_diff']:+.4f} | "
                          f"{r.get('proj_source') or ''} |"
                      )
              else:
                  if replay.get("reason"):
                      lines.append(f"- Reason: {replay['reason']}")
                  if replay.get("stdout_tail"):
                      lines += ["", "```text", replay["stdout_tail"], "```"]
              lines.append("")
              return lines

          cur_cmp = current_replay.get("comparison")
          hist_cmp = historical_replay.get("comparison")

          if cur_cmp and hist_cmp:
              median_improvement = cur_cmp["median_abs_diff"] - hist_cmp["median_abs_diff"]
              exact_gain = hist_cmp["exact_matches"] - cur_cmp["exact_matches"]
              if hist_cmp["median_abs_diff"] < 0.005 and hist_cmp["exact_matches"] > hist_cmp["compared_rows"] * 0.8:
                  verdict = (
                      "Historical source drift explains most of the apparent lineage problem. "
                      "The reconstructed generator becomes close to the frozen table when replayed "
                      "against release-era inputs."
                  )
              elif median_improvement > 0.01 or exact_gain > 100:
                  verdict = (
                      "Historical input drift explains a meaningful share of the mismatch, but the "
                      "legacy generator still does not reproduce the frozen table. Both source drift "
                      "and formula/implementation lineage need to be separated."
                  )
              else:
                  verdict = (
                      "Input drift is not the main explanation. Even against release-era source "
                      "snapshots, the legacy generator remains materially different from the frozen "
                      "production table. The next step should focus on recovering the actual historical "
                      "formula/manual transformation that produced PROD_MULT_DATA."
                  )
          else:
              verdict = (
                  "The Git-history trace completed, but one replay could not be executed. Use the "
                  "snapshot-match evidence below to determine the next forensic step."
              )

          lines = [
              "# Historical PROD_MULT Lineage Trace",
              "",
              "## Verdict",
              "",
              verdict,
              "",
              "## Frozen baseline origin",
              "",
              f"- Frozen entries: **{len(BASELINE)}**",
              f"- Recorded `index.html` SHA256: `{BASELINE_INDEX_SHA256}`",
              f"- Git commits whose `index.html` exactly matches that SHA256: **{len(index_match_commits)}**",
          ]
          for c in index_match_commits[:5]:
              m = meta(c)
              lines.append(f"  - `{m['sha'][:12]}` — {m['date']} — {m['subject']}")

          lines += [
              "",
              "## Release-manifest snapshot recovery",
              "",
              f"- Source snapshots recorded: **{len(SOURCE_EXPECTED)}**",
              f"- Code snapshots recorded: **{len(CODE_EXPECTED)}**",
              f"- Commits matching every source snapshot simultaneously: **{len(full_source_commits)}**",
              f"- Commits matching every code snapshot simultaneously: **{len(full_code_commits)}**",
              f"- Commits matching the full source + code lineage simultaneously: **{len(full_lineage_commits)}**",
              f"- Commits matching all four inputs used by the legacy PROD_MULT formula: **{len(formula_input_full_commits)}**",
              "",
          ]

          if replay_commit:
              m = meta(replay_commit)
              lines += [
                  "## Historical replay anchor",
                  "",
                  f"- Commit: `{m['sha']}`",
                  f"- Date: {m['date']}",
                  f"- Subject: {m['subject']}",
                  "",
              ]

          lines += replay_lines("Replay using current committed inputs", current_replay)
          lines += replay_lines("Replay using recovered release-era inputs", historical_replay)

          lines += [
              "## Best Git-history lineage matches",
              "",
              "| Commit | Date | Index exact | Sources | Code | Formula inputs | Subject |",
              "|---|---|---:|---:|---:|---:|---|",
          ]
          for r in ranked[:15]:
              lines.append(
                  f"| `{r['sha'][:12]}` | {r['date']} | "
                  f"{'yes' if r['baseline_index_match'] else 'no'} | "
                  f"{r['source_matches']}/{r['source_total']} | "
                  f"{r['code_matches']}/{r['code_total']} | "
                  f"{r['formula_input_matches']}/{r['formula_input_total']} | "
                  f"{r['subject']} |"
              )

          lines += [
              "",
              "## Interpretation rule",
              "",
              "- If the historical-input replay becomes nearly exact, the old audit overstated formula drift because mutable inputs had changed.",
              "- If the historical-input replay remains materially different, the baked table came from a different formula, manual transformation, baseline choice, position mapping, or other unrecorded step.",
              "- This audit does **not** change `index.html`, the frozen IDP V1 release, or any player value.",
              "",
          ]

          REPORT_MD.write_text("\n".join(lines) + "\n")
          print(REPORT_MD.read_text())
          PY

      - name: Commit forensic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add research/legacy-prod-mult/historical_lineage_trace.json
          git add research/legacy-prod-mult/historical_lineage_trace.md

          if git diff --staged --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Trace historical PROD_MULT lineage"
          git push
