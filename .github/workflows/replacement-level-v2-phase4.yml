name: Replacement Level V2 Phase 4 Combined + Identifiability Audit

# Research-only combined-board / identifiability audit.
# No deployed values, frozen prospective experiment, POSITION_WEIGHT,
# transform coefficient, floor, ceiling, or global scale is modified.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  combined-identifiability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Phase 4 self-test
        run: python3 research/replacement-level-v2/replacement_level_v2_phase4_combined_identifiability_audit.py --selftest

      - name: Build Phase 4 combined-board audit
        run: python3 research/replacement-level-v2/replacement_level_v2_phase4_combined_identifiability_audit.py --write

      - name: Verify deterministic outputs and guardrails
        run: python3 research/replacement-level-v2/replacement_level_v2_phase4_combined_identifiability_audit.py --check

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/replacement-level-v2/replacement_level_v2_phase4_combined_identifiability_audit.json
          git add research/replacement-level-v2/replacement_level_v2_phase4_combined_identifiability_audit.md
          git diff --staged --quiet || git commit -m "Add Replacement Level V2 Phase 4 combined audit"
          git push
