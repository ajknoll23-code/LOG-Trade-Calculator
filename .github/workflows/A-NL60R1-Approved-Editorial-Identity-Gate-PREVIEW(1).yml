      - name: Rebuild both old drafts only in ephemeral runner temp and enforce block
        shell: bash
        run: |
          set -euo pipefail
          python3 nl60_work/nl60_release_gate.py \
            --ledger nl60_input/nl59/NL59R1-FINGERPRINT-LEDGER.json \
            --nl58-report nl60_input/nl58/NL58R1-FULL-DRY-RUN.json \
            --candidate-yaml nl60_input/nl58/A-NL47R1-NL58-VERIFIED-CANDIDATE-DO-NOT-DEPLOY.yml \
            --inputs nl60_input/source \
            --work nl60_work/ephemeral \
            --out nl60_report
          test -s nl60_report/NL60R1-RELEASE-GATE-PREVIEW.json
          test -s nl60_report/NL60R1-RELEASE-GATE-PREVIEW.md
      - name: Upload QA only - NO PDFs or editorial text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOG-NL60R1-OWNER-APPROVED-RELEASE-GATE-PREVIEW-${{ github.run_id }}
          path: nl60_report/
          retention-days: 90
          if-no-files-found: warn
      - name: Summarize why automatic release remains blocked
        if: always()
        shell: bash
        run: |
          if test -s nl60_report/NL60R1-RELEASE-GATE-PREVIEW.md; then
            cat nl60_report/NL60R1-RELEASE-GATE-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NL60 guard verification FAILED; no publication is permitted.' >> "$GITHUB_STEP_SUMMARY"
          fi
