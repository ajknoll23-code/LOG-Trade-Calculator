name: A-NL60R1 - Approved Editorial Identity and Historical Release Gate Preview
run-name: A-NL60R1 - Reject old NL47 articles against approved W9 Aftermath and W10 War Room
'on':
  workflow_dispatch:
    inputs:
      nl59_run_id:
        description: Exact successful NL59 hash-only archive run
        type: string
        required: true
        default: '43117576037'
      nl58_run_id:
        description: Exact successful NL58 repaired builder dry-run
        type: string
        required: true
        default: '43114130329'
      nl39_run_id:
        description: Exact successful NL39 W10/W9 source
        type: string
        required: true
        default: '42837666274'
      nl44_run_id:
        description: Exact successful NL44 W10 V7 release
        type: string
        required: true
        default: '42837956712'
      nl45_run_id:
        description: Exact successful NL45 through Week 9 scoring
        type: string
        required: true
        default: '42838026515'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl60r1-readonly-release-gate
  cancel-in-progress: false
jobs:
  approved-editorial-gate:
    name: Regenerate old NL47 draft in temporary directory and compare to approved fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify all source workflow runs completed successfully on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NL59_RUN: ${{ inputs.nl59_run_id }}
          NL58_RUN: ${{ inputs.nl58_run_id }}
          NL39_RUN: ${{ inputs.nl39_run_id }}
          NL44_RUN: ${{ inputs.nl44_run_id }}
          NL45_RUN: ${{ inputs.nl45_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'NL60_VERIFY_RUNS'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          specs={'NL59_RUN':('A-NL59R1-Approved-Editorial-Fingerprint-Archive-PREVIEW.yml',),
                 'NL58_RUN':('A-NL58R1-NL47-Full-Assembly-Dry-Run-PREVIEW.yml','A-NL58R1-NL47-Full-Assembly-Dry-Run-PREVIEW(1).yml'),
                 'NL39_RUN':('A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml',),
                 'NL44_RUN':('A-NL44R1-V7-WarRoom-Release-Renamed-v2.yml',),
                 'NL45_RUN':('A-NL45R1-Offense-IDP-Leaderboard-ReadOnly.yml',)}
          for env,filenames in specs.items():
              rid=os.environ[env]
              if not rid.isdecimal():raise SystemExit('Non-numeric source run ID '+env)
              url=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'LOG-NL60-SourceIntegrity'})
              with urllib.request.urlopen(req,timeout=15) as r:run=json.load(r)
              if run.get('status')!='completed' or run.get('conclusion')!='success' or run.get('head_branch')!='main' or run.get('event')!='workflow_dispatch' or run.get('path','').split('/')[-1] not in filenames:
                  raise SystemExit(f'Unapproved source run for {env}: {rid}: {run.get("path")} {run.get("conclusion")}')
              print('PASS source run',env,rid,run['path'])
          NL60_VERIFY_RUNS
      - name: Download hashed owner-approved editions from NL59
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL59R1-EDITORIAL-FINGERPRINTS-${{ inputs.nl59_run_id }}
          run-id: ${{ inputs.nl59_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl60_input/nl59
      - name: Download pinned NL58 full dry-run candidate (not production)
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL58R1-FULL-DRY-RUN-PREVIEW-${{ inputs.nl58_run_id }}
          run-id: ${{ inputs.nl58_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl60_input/nl58
      - name: Download exact NL39 two-edition source
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL39R1-Weekly-Newsroom-Shadow-${{ inputs.nl39_run_id }}
          run-id: ${{ inputs.nl39_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl60_input/source/nl39
      - name: Download exact NL44 War Room V7 evidence
        uses: actions/download-artifact@v4
        with:
          name: LOG-W10-V7-WarRoom-RELEASE-${{ inputs.nl44_run_id }}
          run-id: ${{ inputs.nl44_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl60_input/source/nl44
      - name: Download exact NL45 offense and IDP evidence
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL45R1-Offense-IDP-Scoring-Through-W9-${{ inputs.nl45_run_id }}
          run-id: ${{ inputs.nl45_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl60_input/source/nl45
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF extraction library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pymupdf==1.26.5'
      - name: Restore audited fingerprint and release gate scripts from pinned source
