          retention-days: 90

      - name: Commit M3 development result
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-nextgen-v2/m3_development_fit_results_v1.json \
            research/package-adjustment-nextgen-v2/m3_development_fit_summary_v1.md \
            research/package-adjustment-nextgen-v2/m3_development_fit_manifest_v1.json

          if [ -e research/package-adjustment-nextgen-v2/research_candidate_m3_v1.json ]; then
            git add \
              research/package-adjustment-nextgen-v2/research_candidate_m3_v1.json \
              research/package-adjustment-nextgen-v2/research_candidate_m3_v1.md
          fi

          git commit -m "Fit NextGen V2 M3 development candidates"

      - name: Rebase safely and verify committed boundary
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main

          test "$(git hash-object research/package-adjustment-nextgen-v2/m3_development_preregistration_v1.json)" = \
            "ff29e53ff05e1a96e47d9f91e535585d438f788f"
          test "$(git hash-object research/package-adjustment-nextgen-v2/m3_development_preregistration_v1_manifest.json)" = \
            "afda67beb00a94011f0dae2bfe2549a9ba8c3cfa"

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          d = Path("research/package-adjustment-nextgen-v2")
          result = json.loads((d / "m3_development_fit_results_v1.json").read_text())

          expected = {
              str(d / "m3_development_fit_results_v1.json"),
              str(d / "m3_development_fit_summary_v1.md"),
              str(d / "m3_development_fit_manifest_v1.json"),
          }
          if result["candidate_written"]:
              expected |= {
                  str(d / "research_candidate_m3_v1.json"),
                  str(d / "research_candidate_m3_v1.md"),
              }

          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only", parent, head], text=True).splitlines()
          )
          if changed != expected:
              raise RuntimeError(f"rebased commit changed unexpected paths: {sorted(changed)}")
          if subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).strip():
              raise RuntimeError("working tree not clean after rebase")

          print("PASS: rebased M3 development commit contains exactly intended outputs.")
          PY

      - name: Push M3 development result to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin main
          git log --oneline -1
