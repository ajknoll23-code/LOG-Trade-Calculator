name: Activate Package Voting V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  activate-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: pip install requests numpy

      - name: Write Package Voting V3 research code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          files = {
              "research/package-adjustment-v3/generate_package_vote_challenges_v3.py": "",
              "scripts/market/package_vote_v3_pipeline.py": "",
              "scripts/market/package_vote_v3_fit_diagnostics.py": "",
          }

          for path, encoded in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))
              print("Wrote", p)
          PY

      - name: Compile and self-test V3 code
        run: |
          python3 -m py_compile research/package-adjustment-v3/generate_package_vote_challenges_v3.py
          python3 -m py_compile scripts/market/package_vote_v3_pipeline.py
          python3 -m py_compile scripts/market/package_vote_v3_fit_diagnostics.py
          python3 research/package-adjustment-v3/generate_package_vote_challenges_v3.py --selftest
          python3 scripts/market/package_vote_v3_pipeline.py --selftest
          python3 scripts/market/package_vote_v3_fit_diagnostics.py --selftest

      - name: Freeze V3 indifference challenge catalog
        run: python3 research/package-adjustment-v3/generate_package_vote_challenges_v3.py

      - name: Switch browser voting from V2 to V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "/* Package Preference Voting V2: matched-pair research; shared transport only. */",
                  "/* Package Preference Voting V3: indifference calibration; shared transport only. */",
                  1,
              ),
              (
                  "research/package-adjustment-v2/package_vote_challenges_v2.json",
                  "research/package-adjustment-v3/package_vote_challenges_v3.json",
                  1,
              ),
              ("'package_votes_v2_'", "'package_votes_v3_'", 1),
              ("'package_vote_recent_v2'", "'package_vote_recent_v3'", 3),
              (
                  "doc.status !== 'frozen_package_preference_v2'",
                  "doc.status !== 'frozen_package_preference_v3'",
                  1,
              ),
              ("doc.challenges.length < 120", "doc.challenges.length < 140", 1),
              (
                  "keep: `__pkgv2__|${id}|${choice}`",
                  "keep: `__pkgv3__|${id}|${choice}`",
                  1,
              ),
              (
                  "trade: `__pkgv2_meta__|${left}`",
                  "trade: `__pkgv3_meta__|${left}`",
                  1,
              ),
              ("cut: '__pkgv2_schema__|2'", "cut: '__pkgv3_schema__|3'", 1),
          ]

          for old, new, expected_count in replacements:
              count = text.count(old)
              if count != expected_count:
                  raise RuntimeError(
                      f"index patch expected {expected_count} occurrence(s) of {old!r}, found {count}"
                  )
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          print("Switched Trade Package Voting UI to V3.")
          PY

      - name: Isolate V3 rows from normal KTC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/market/ktc_pipeline.py")
          text = path.read_text(encoding="utf-8")

          old = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|")'
          new = 'PACKAGE_VOTE_PREFIXES = ("__pkgv1__|", "__pkgv2__|", "__pkgv3__|")'
          if text.count(old) != 1:
              raise RuntimeError("unexpected PACKAGE_VOTE_PREFIXES declaration")
          text = text.replace(old, new, 1)

          old_comment = "# Package Preference Voting V1/V2 shares transport only. Remove both"
          if old_comment in text:
              text = text.replace(
                  old_comment,
                  "# Package Preference Voting V1/V2/V3 shares transport only. Remove all",
                  1,
              )

          old_test = '    assert is_package_vote_row({"keep": "__pkgv1__|challenge|P"})'
          if old_test in text:
              text = text.replace(
                  old_test,
                  old_test
                  + '\n    assert is_package_vote_row({"keep": "__pkgv2__|challenge|P"})'
                  + '\n    assert is_package_vote_row({"keep": "__pkgv3__|challenge|P"})',
                  1,
              )

          old_print = 'Package Preference V1 row(s) before normal KTC processing'
          if old_print in text:
              text = text.replace(
                  old_print,
                  'Package Preference reserved row(s) before normal KTC processing',
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("Added V3 KTC transport isolation.")
          PY

      - name: Verify KTC isolation self-test
        run: python3 scripts/market/ktc_pipeline.py --selftest

      - name: Initialize V3 aggregation outputs
        run: python3 scripts/market/package_vote_v3_pipeline.py

      - name: Verify V3 activation contract
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          catalog = json.loads(
              Path("research/package-adjustment-v3/package_vote_challenges_v3.json").read_text()
          )
          assert catalog["status"] == "frozen_package_preference_v3"
          assert catalog["frozen"] is True
          assert catalog["consumer_changed"] is False
          assert catalog["production_formula_enabled"] is False
          assert len(catalog["challenges"]) >= 140
          assert catalog["catalog_diagnostics"]["target_count"] >= 14
          assert set(map(float, catalog["design"]["ratio_targets"])) == {1.10, 1.25, 1.40, 1.60, 1.85}
          assert set(map(int, catalog["design"]["package_sizes"])) == {2, 3}
          assert catalog["source_sha256"]["value_uncertainty"] == sha256(
              "scripts/artifacts/generated/value_uncertainty.json"
          )

          by_target = {}
          for c in catalog["challenges"]:
              by_target.setdefault(c["target"]["key"], []).append(c)
              assert all(float(p["fv"]) < float(c["target_fv"]) for p in c["package"])
          for target, rows in by_target.items():
              assert len(rows) == 10, (target, len(rows))

          result = json.loads(
              Path("research/package-adjustment-v3/package_vote_v3_results.json").read_text()
          )
          assert result["status"] == "research_only"
          assert result["consumer_changed"] is False
          assert result["market_value_consumer_changed"] is False
          assert result["fundamental_value_consumer_changed"] is False
          assert result["team_utility_consumer_changed"] is False
          assert result["production_formula_enabled"] is False

          index = Path("index.html").read_text()
          assert "package-adjustment-v3/package_vote_challenges_v3.json" in index
          assert "__pkgv3__|${id}|${choice}" in index
          assert "__pkgv3_meta__|${left}" in index
          assert "__pkgv3_schema__|3" in index
          assert "package_votes_v3_" in index
          assert "package_vote_recent_v3" in index

          ktc = Path("scripts/market/ktc_pipeline.py").read_text()
          assert '"__pkgv1__|"' in ktc
          assert '"__pkgv2__|"' in ktc
          assert '"__pkgv3__|"' in ktc
          assert "PACKAGE_VOTE_PREFIXES" in ktc

          print("Package Voting V3 activation contract verified.")
          print("Challenges:", len(catalog["challenges"]))
          print("Targets:", catalog["catalog_diagnostics"]["target_count"])
          print("Ratio counts:", catalog["catalog_diagnostics"]["ratio_counts"])
          PY

      - name: Commit V3 activation
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add research/package-adjustment-v3/
          git add scripts/market/package_vote_v3_pipeline.py
          git add scripts/market/package_vote_v3_fit_diagnostics.py
          git add scripts/market/ktc_pipeline.py
          git add index.html

          if git diff --cached --quiet; then
            echo "No V3 activation changes."
            exit 0
          fi

          git commit -m "Activate Package Voting V3 indifference calibration"
          git pull --rebase origin main
          git push origin main
