name: A - FA07R1 Exact LOG Point Production for Rising Usage Watch (Read Only)

# Factual scored Weeks 5-7 diagnostic only; NOT a prediction or backtest.
# No live board, player valuations, model release, or data writes.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a-fa07r1-fixed-watch-production-check-readonly
  cancel-in-progress: false

jobs:
  scoring-crosscheck:
    name: Check FA06R1's fixed 42 candidates against exact LOG weekly fantasy points
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (no write credentials)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical LOG scorer and frozen Week 9 roster snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -s scripts/model/ppg_pipeline.py
          test "$(git hash-object research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json)" = "75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5"

      - name: Download exact original FA06R1 watch artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/a-fa07r1
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          gh run download 40560433637 --repo "$GITHUB_REPOSITORY" --name A_FA06R1_FIXED_SOURCE_WEEK7_RISING_USAGE_WATCH --dir "$REPORT_DIR"
          test -s "$REPORT_DIR/A_FA06R1_rising_usage_watch.csv"
          test -s "$REPORT_DIR/A_FA06R1_report.json"

      - name: Reconstruct exact LOG 2026 W5 W6 W7 scored outcomes
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa07r1
        run: |
          set -euo pipefail
          cat > "$REPORT_DIR/a_fa07r1_engine.py" <<'FA07R1_PYTHON'
          #!/usr/bin/env python3
          """FA07R1: retrospective exact-LOG scoring, for FA06R1's fixed 42-player W7 watch only.
          No claim of prediction, no model valuation or production write.
          """
          import argparse
          import ast
          import collections
          import csv
          from datetime import datetime, timezone
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import time
          from urllib.request import Request, urlopen

          OUT=Path(os.environ.get('REPORT_DIR','/tmp/a-fa07r1'))
          WATCH_SHA='61c9ff3cd95f04e2b71bacb51b0ea5acb9b12104a1a9779893c7b7ac9bea23c0'
          REPORT_SHA='d27620715e96ebfc080f690e93fb3e3c1e83ac23895d87c081b0473ad612e862'
          SNAPSHOT='research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json'
          SNAPSHOT_GIT_BLOB='75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5'
          RUN_FA06=40560433637
          SCORE_FILE='scripts/model/ppg_pipeline.py'
          POS=('QB','RB','WR','TE','DL','LB','DB')
          WEEKS=(5,6,7)


          def sha(data):return hashlib.sha256(data).hexdigest()

          def num(x):
              if isinstance(x,bool):return None
              if not isinstance(x,(float,int)):return None
              if not (-1e12<float(x)<1e12):return None
              return float(x)


          def load_score_func():
              """Compile the actual LOG league scorer, not copied formula weights."""
              tree=ast.parse(Path(SCORE_FILE).read_text(encoding='utf-8'))
              functions=[node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name=='score_week']
              if len(functions)!=1:raise RuntimeError('Canonical score_week not uniquely present')
              fn=functions[0]
              fn.decorator_list=[]
              block=ast.fix_missing_locations(ast.Module(body=[fn],type_ignores=[]))
              ns={}
              exec(compile(block,SCORE_FILE,'exec'),ns)
              scorer=ns['score_week']
              # Established official league-scoring fixtures, unchanged from historical audit.
              checks=[({},0),({'pass_yd':300,'pass_td':2}, 300*.04+8+2),
                      ({'rush_att':10,'rush_yd':100},2+10+2),
                      ({'rec':4,'rec_yd':50},2+5),
                      ({'idp_tkl_solo':4,'idp_tkl_ast':2},6+1.5),
                      ({'idp_sack':2,'idp_qb_hit':1},6+2+2)]
              for s,expected in checks:
                  actual=scorer(s)
                  if abs(actual-expected)>1e-9:raise RuntimeError(f'Canonical scorer fixture differs: {s}, {actual}, {expected}')
              return scorer,sha(Path(SCORE_FILE).read_bytes())


          def parse_roster_and_watch():
              p=OUT/'A_FA06R1_rising_usage_watch.csv'
              q=OUT/'A_FA06R1_report.json'
              if sha(p.read_bytes())!=WATCH_SHA or sha(q.read_bytes())!=REPORT_SHA:
                  raise RuntimeError('Fixed FA06R1 source content hash mismatch')
              src=json.loads(q.read_text())
              if src.get('source_workflow_run')!=40555331141 or src.get('selected_rows')!=42 or src.get('source_free_agent_frozen_git_blob')!=SNAPSHOT_GIT_BLOB:
                  raise RuntimeError('FA06R1 provenance/size changed')
              if src.get('predictive_edge_established') is not False or src.get('production_changes_authorized') is not False:
                  raise RuntimeError('Source research guard changed')
              with p.open(newline='',encoding='utf-8') as f:watch=list(csv.DictReader(f))
              if len(watch)!=42 or len({r['player_id'] for r in watch})!=42:
                  raise RuntimeError('Expected 42 unique FA06R1 watch rows')
              frozen=json.loads(Path(SNAPSHOT).read_text())
              players={str(p['player_id']):p for p in frozen['players']}
              if len(players)!=1607 or not all(pid in players for pid in (r['player_id'] for r in watch)):
                  raise RuntimeError('Not exactly the frozen availability pool')
              for r in watch:
                  f=players[r['player_id']]
                  if r['name']!=f['name'] or r['pos']!=f['pos'] or r['watch_category']=='INSUFFICIENT_THREE_WEEK_SNAP_EVIDENCE':
                      raise RuntimeError('FA06 player/position/evidence mutated')
              return watch,frozen


          def fetch_week(week):
              url=f'https://api.sleeper.app/v1/stats/nfl/regular/2026/{week}'
              error=None
              for attempt in range(3):
                  try:
                      req=Request(url,headers={'User-Agent':'LOG-FA07R1-Research/1.0','Accept':'application/json'})
                      with urlopen(req,timeout=75) as resp:body=resp.read(18_000_000)
                      data=json.loads(body)
                      if not isinstance(data,dict) or len(data)<100:
                          raise RuntimeError(f'unexpected weekly stats shape/length {len(data) if hasattr(data,"__len__") else "unknown"}')
                      return data,{'week':week,'source':url,'sha256':sha(body),'player_rows':len(data),'retrieved_utc':datetime.now(timezone.utc).isoformat()}
                  except Exception as e:
                      error=e;time.sleep(attempt+1)
              raise RuntimeError(f'Week {week} Sleeper source unavailable: {error}')


          def safe_played_points(player_week,score):
              # Sleeper stats can contain placeholder rows for players who never entered the game.
              if not isinstance(player_week,dict):return None,'NO_STAT_ROW'
              gp=num(player_week.get('gp'))
              if gp is None:return None,'GP_UNREPORTED'
              if gp<1:return None,'NOT_CONFIRMED_PLAYED'
              # Sparse Sleeper per-week counting fields omit zero-value stats for real participants.
              # An explicitly present null or nonnumeric field is NOT silently equated to zero.
              for key,value in player_week.items():
                  if key in ('gp','team','opponent','season','week','position','player_id'):
                      continue
                  if value is None:continue  # non-scoring metadata may be null
                  if key in ('pass_yd','pass_td','pass_2pt','pass_int','rush_yd','rush_att','rush_td',
                             'rush_2pt','rec_yd','rec','rec_td','rec_2pt','fum_lost','fum_rec_td',
                             'idp_tkl_solo','idp_tkl_ast','idp_tkl_loss','idp_sack','sack',
                             'idp_qb_hit','idp_int','int','idp_fum_rec','idp_ff','idp_safety',
                             'blk_kick','idp_td','idp_pass_def','st_td','st_ff','st_fum_rec') and num(value) is None:
                      return None,'SCORING_INPUT_NONNUMERIC'
              try:
                  v=float(score(player_week))
                  if not (-1e9<v<1e9):raise ValueError('points unreasonable')
              except (TypeError,ValueError,ZeroDivisionError):return None,'SCORER_REJECTED_STAT_ROW'
              return round(v,3),'SCORED_CONFIRMED_GP'


          def compute(watch,sources,scorer):
              rows=[]
              for r in watch:
                  pid=r['player_id'];raw_by_week={w:sources[w].get(pid) for w in WEEKS}
                  points={};status={};
                  for w in WEEKS:
                      points[w],status[w]=safe_played_points(raw_by_week[w],scorer)
                  full=all(points[w] is not None for w in WEEKS)
                  pre=round((points[5]+points[6])/2,3) if full else None
                  delta=round(points[7]-pre,3) if full else None
                  changed=(delta>=5) if delta is not None else None
                  res={
                      'player_id':pid,'name':r['name'],'pos':r['pos'],
                      'team_at_week9_freeze_NOT_historical':r['team_at_freeze'],
                      'age_at_week9_freeze':r['age_at_freeze'],
                      'watch_category':r['watch_category'],
                      'young_age_experience_screen':r['young_screen_age26_exp3'],
                      'prior_week_snap_avg':r['pre_week7_mean_snap_count'],
                      'week7_snaps':r['week7_snap_count'],
                      'week7_snap_delta':r['week7_minus_w5w6_mean_snaps'],
                      'week7_supporting_fields':r['week7_supporting_stat_fields'],
                      'week5_LOG_pts':points[5], 'week6_LOG_pts':points[6], 'week7_LOG_pts':points[7],
                      'week5_status':status[5], 'week6_status':status[6], 'week7_status':status[7],
                      'full_scored_w5_w7':full,
                      'prior_two_week_avg_LOG_pts':pre,
                      'week7_minus_prior_avg_LOG_pts':delta,
                      'week7_points_up_at_least_5_illustrative':changed,
                      'research_only_not_waiver_prediction':True,
                  }
                  rows.append(res)
              rows.sort(key=lambda x:(POS.index(x['pos']), x['week7_LOG_pts'] is None,
                                       -(x['week7_LOG_pts'] or 0),x['name'],x['player_id']))
              return rows


          def selftest():
              def score(s):return (s.get('rec',0)*.5+s.get('rec_yd',0)*.1+s.get('idp_tkl_solo',0)*1.5)
              assert safe_played_points({'gp':1,'rec':4,'rec_yd':80},score)==(10.0,'SCORED_CONFIRMED_GP')
              assert safe_played_points({'gp':0,'rec':3},score)==(None,'NOT_CONFIRMED_PLAYED')
              assert safe_played_points(None,score)==(None,'NO_STAT_ROW')
              assert safe_played_points({'gp':1,'rec':'four'},score)==(None,'SCORING_INPUT_NONNUMERIC')
              assert safe_played_points({'gp':1,'idp_tkl_solo':4},score)==(6.0,'SCORED_CONFIRMED_GP')
              rows=compute([{'player_id':'1','name':'Test','pos':'WR','team_at_freeze':'NYG','age_at_freeze':'23','watch_category':'YOUNG_RISING_WITH_WEEK7_VOLUME','young_screen_age26_exp3':'True','pre_week7_mean_snap_count':'20','week7_snap_count':'35','week7_minus_w5w6_mean_snaps':'15','week7_supporting_stat_fields':'targets=6'}],{5:{'1':{'gp':1,'rec':2}},6:{'1':{'gp':1,'rec':4}},7:{'1':{'gp':1,'rec':6}}},score)
              assert rows[0]['week7_LOG_pts']==3 and rows[0]['week7_minus_prior_avg_LOG_pts']==1.5
              print('PASS FA07R1 literal player IDs, missing/gp guards, scorer inputs, no future-week queries')


          def main():
              parser=argparse.ArgumentParser();parser.add_argument('--selftest',action='store_true');args=parser.parse_args()
              if args.selftest:return selftest()
              OUT.mkdir(parents=True,exist_ok=True)
              scorer,score_sha=load_score_func()
              watch,frozen=parse_roster_and_watch()
              sources={};origins=[]
              for week in WEEKS:
                  sources[week],entry=fetch_week(week)
                  origins.append(entry)
              rows=compute(watch,sources,scorer)
              valid=[r for r in rows if r['full_scored_w5_w7']]
              young=[r for r in valid if r['young_age_experience_screen']=='True']
              young_support=[r for r in young if r['watch_category']=='YOUNG_RISING_WITH_WEEK7_VOLUME']
              bypos={p:{'watched':sum(x['pos']==p for x in rows),
                        'fully_scored':sum(x['pos']==p and x['full_scored_w5_w7'] for x in rows),
                        'w7_ge_5pts':sum(x['pos']==p and x['week7_LOG_pts'] is not None and x['week7_LOG_pts']>=5 for x in rows),
                        'gain_ge_5pts':sum(x['pos']==p and x['week7_points_up_at_least_5_illustrative'] is True for x in rows)} for p in POS}
              report={
                  'study':'A-FA07R1 Fixed Watch W5-W7 Exact LOG Fantasy Points Research Check',
                  'classification':'RETROSPECTIVE_IN_WINDOW_SCORING_CROSSCHECK_NOT_PREDICTION',
                  'status':'W5_W7_LEAGUE_POINTS_CROSSCHECK_PASS',
                  'reproduced_F06_player_count':len(rows),
                  'fully_scored_3_week_candidates':len(valid),
                  'young_with_three_week_scores':len(young),
                  'young_supported_w7_with_three_week_scores':len(young_support),
                  'week7_pts_ge_5':sum(x['week7_LOG_pts'] is not None and x['week7_LOG_pts']>=5 for x in rows),
                  'week7_vs_baseline_gain_ge_5':sum(x['week7_points_up_at_least_5_illustrative'] is True for x in rows),
                  'by_position':bypos,
                  'source_FA06_run_id':RUN_FA06,
                  'source_watch_csv_sha256':WATCH_SHA,
                  'source_report_sha256':REPORT_SHA,
                  'canonical_LOG_scorer_path':SCORE_FILE,
                  'canonical_LOG_scorer_sha256':score_sha,
                  'Sleeper_raw_weekly_source_manifest':origins,
                  'frozen_pool_path':SNAPSHOT,
                  'frozen_week9_league_id':frozen['league_id'],
                  'research_no_week8_or_week9_sources_used':True,
                  'generated_at_utc':datetime.now(timezone.utc).isoformat(),
                  'limitations':[
                      'This is an after-Week-7 look-back of players selected using Week-7 usage; not a W7 prediction or backtest.',
                      'Today\'s API response for historical weeks is not an independently frozen contemporaneous source.',
                      'Week9 frozen current waiver status cannot prove availability before Week7 games.',
                      'Sleeper scoring source provides sparse stats; a confirmed played-week row with missing stat fields follows the canonical LOG zero-for-absent scoring convention.',
                      'No played-game evidence means no score rather than assuming fantasy zero.',
                      'The minimum +5 fantasy point change is only a descriptive screen, not a trained threshold.',
                      'Snap counts can reflect overall team play volume; normalized team participation still needed.',
                      'Week8 and future CAL26 protected model holdouts were not opened.',
                      'Week7 production cannot establish future breakout odds or dynasty value gain.',
                      'No production/free-agent board/player FV/MV/model changes authorized.'
                  ],
                  'production_change_authorized':False,
                  'predicted_breakout_proven':False,
              }
              OUT.joinpath('A_FA07R1_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              fields=list(rows[0]);
              with (OUT/'A_FA07R1_42_watch_players_scored.csv').open('w',newline='',encoding='utf-8') as f:
                  writer=csv.DictWriter(f,fieldnames=fields);writer.writeheader();writer.writerows(rows)
              lines=['# A - FA07R1: Exact LOG Fantasy Scoring for Rising-Usage Free Agents','',
                  '**Scope:** 2026 Weeks 5-7, retrospective league-scoring crosscheck; NOT predictions.','',
                  f'- FA06R1 candidates: **{len(rows)}**.',
                  f'- With confirmed full three-week LOG scoring: **{len(valid)}**.',
                  f'- Young candidates with full scoring: **{len(young)}**.',
                  f'- Week 7 production >=5 LOG points: **{report["week7_pts_ge_5"]}**.',
                  f'- Week 7 improved >=5 LOG points vs Week5-6 mean: **{report["week7_vs_baseline_gain_ge_5"]}**.','',
                  '| Pos | Watch candidates | 3-week scored | W7 ≥5 LOG pts | W7 increase ≥5 LOG pts |',
                  '|---|---:|---:|---:|---:|']
              for p,x in bypos.items():
                  lines.append(f'| {p} | {x["watched"]} | {x["fully_scored"]} | {x["w7_ge_5pts"]} | {x["gain_ge_5pts"]} |')
              lines.extend(['','## Young players with W7 supporting opportunity stats and confirmed W5-W7 LOG points','',
                 '| Player | Pos | W5 points | W6 points | W7 points | W7 vs prior mean | W7 snaps | W7 support |',
                 '|---|---|---:|---:|---:|---:|---:|---|'])
              for r in sorted(young_support,key=lambda x:-(x['week7_minus_prior_avg_LOG_pts'] or 0)):
                  lines.append(f'| {r["name"]} | {r["pos"]} | {r["week5_LOG_pts"]:.1f} | {r["week6_LOG_pts"]:.1f} | {r["week7_LOG_pts"]:.1f} | {r["week7_minus_prior_avg_LOG_pts"]:+.1f} | {r["week7_snaps"]} | {r["week7_supporting_fields"]} |')
              if not young_support:lines.append('| None with full scoring | — | — | — | — | — | — | — |')
              lines.extend(['','## Limitations','']+['- '+s for s in report['limitations']])
              lines.extend(['','**Next decision:** separate short-term fantasy utility from development stashes; register Week9 onward as-of outcomes only after future weeks complete.',''])
              OUT.joinpath('A_FA07R1_report.md').write_text('\n'.join(lines))
              print(f'{report["status"]}: {len(rows)} watched, {len(valid)} fully scored, {report["week7_vs_baseline_gain_ge_5"]} point gain>=5')
              if not valid:raise RuntimeError('No actually-scored watch candidates; report captured but data not ready')

          if __name__=='__main__':main()
          FA07R1_PYTHON
          python3 "$REPORT_DIR/a_fa07r1_engine.py" --selftest
          python3 "$REPORT_DIR/a_fa07r1_engine.py"
          test -z "$(git status --porcelain)"

      - name: Upload research-only scoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA07R1_FIXED_FA06_WATCH_EXACT_LOG_POINTS
          path: |
            ${{ runner.temp }}/a-fa07r1/A_FA07R1_report.md
            ${{ runner.temp }}/a-fa07r1/A_FA07R1_report.json
            ${{ runner.temp }}/a-fa07r1/A_FA07R1_42_watch_players_scored.csv
          retention-days: 90
          if-no-files-found: warn
