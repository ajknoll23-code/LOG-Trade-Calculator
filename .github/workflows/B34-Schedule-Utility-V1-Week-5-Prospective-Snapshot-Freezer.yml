          --out research/schedule-utility-v1/prospective-snapshots/2026-W05.json
    - name: Validate snapshot and write immutable hash manifest
      shell: bash
      run: |-
        set -euo pipefail

        python3 - <<'PY'
        import hashlib
        import json
        from pathlib import Path

        root = Path("research/schedule-utility-v1")
        snap_path = root / "prospective-snapshots/2026-W05.json"
        manifest_path = root / "prospective-snapshots/2026-W05.manifest.json"

        snap = json.loads(snap_path.read_text(encoding="utf-8"))

        assert snap["status"] == "FROZEN_PROSPECTIVE_ORIGIN_SNAPSHOT"
        assert snap["season"] == 2026
        assert snap["origin_week"] == 5
        assert snap["origin_cutoff_utc"] == "2026-10-09T00:15:00+00:00"
        assert snap["scoring_mode"] == "HALF_PPR"
        assert snap["visibility"] == "NON_USER_VISIBLE"
        assert snap["outcome_evaluation_performed"] is False
        assert snap["production_authorized"] is False
        assert snap["quantitative_v1_stop_remains_binding"] is True

        ready = snap["readiness"]
        assert ready["week4_scheduled_games"] == ready["week4_completed_games"]
        assert ready["week5_completed_games_at_freeze"] == 0

        hist = snap["history_aggregation_audit"]
        assert hist["source_completeness_failures"] == 0
        assert hist["history_games_weeks_1_4"] >= 60

        gov = snap["governance"]
        assert gov["snapshot_created_before_origin_cutoff"] is True
        assert gov["week4_complete_before_snapshot"] is True
        assert gov["week5_outcomes_present_at_snapshot"] is False
        assert gov["no_backfill"] is True
        assert gov["may_recompute_predictor_after_outcomes"] is False
        assert gov["user_facing_display_authorized"] is False
        assert gov["fv_or_trade_integration_authorized"] is False

        # There should be one H1 directional row per active team in Week 5.
        for pos, payload in snap["planned_h1_predictor_availability"].items():
            assert pos in {"QB", "RB", "WR", "TE"}
            assert payload["expected_directional_rows"] > 0
            assert 0 <= payload["predictor_available_rows"] <= payload["expected_directional_rows"]
            frac = payload["availability_fraction"]
            assert frac is None or 0 <= frac <= 1

        h = hashlib.sha256(snap_path.read_bytes()).hexdigest()
        manifest = {
            "schema_version": 1,
            "study_id": "schedule-utility-v1",
            "season": 2026,
            "origin_week": 5,
            "snapshot_path": str(snap_path),
            "snapshot_sha256": h,
            "origin_cutoff_utc": snap["origin_cutoff_utc"],
            "freeze_runtime_utc": ready["freeze_runtime_utc"],
            "source_snapshot": snap["source_snapshot"],
            "outcome_evaluation_performed": False,
            "production_authorized": False,
            "may_overwrite_snapshot": False,
        }
        manifest_path.write_text(
            json.dumps(manifest, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )

        print("PASS: Week 5 prospective snapshot validated.")
        print("Snapshot SHA256:", h)
        print(
            "H1 availability:",
            {
                p: x["availability_fraction"]
                for p, x in snap["planned_h1_predictor_availability"].items()
            },
        )
        PY
