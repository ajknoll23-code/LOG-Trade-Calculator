name: Package Adjustment V1.6 UI Redesign

# One-time, manually-triggered installer for the approved V1.6 UI redesign.
# This workflow never creates or edits workflow files. It may commit index.html only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install requests

      - name: Verify clean V1.6 production baseline
        run: |
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --print-headshot-stats

      - name: Run UI redesign self-test
        run: python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --self-test

      - name: Apply UI-only redesign
        run: python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --apply

      - name: Validate redesigned index
        run: python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check

      - name: Run permanent Package Adjustment regression
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run full repository regression
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Recheck V1.6 formula and redesigned UI
        run: python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check

      - name: Guard changed-file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {"index.html"}
          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )

          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise RuntimeError(
                  f"UI redesign changed unexpected files: {unexpected}"
              )

          print("UI redesign change scope PASS.")
          print("Changed files:", sorted(changed))
          PY

          git diff --quiet -- .github/workflows || {
            echo "::error::A workflow file changed during the UI redesign run."
            exit 1
          }

      - name: Ensure remote main did not move during validation
        shell: bash
        run: |
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::origin/main moved during validation. Refusing to commit an unvalidated rebase."
            echo "Validated base: $local_sha"
            echo "Current origin/main: $remote_sha"
            exit 1
          fi

      - name: Commit approved UI change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "UI redesign is already installed; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "index.html" ]; then
            echo "::error::Unexpected staged files: $staged"
            exit 1
          fi

          git commit -m "Redesign Package Adjustment V1.6 UI"
          git push origin HEAD:main
