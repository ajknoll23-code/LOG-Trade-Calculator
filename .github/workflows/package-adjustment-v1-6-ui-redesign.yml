name: Package Adjustment V1.6 UI Total Tweak

# One-time UI-only follow-up. Keeps player FV unchanged while making the
# concentrated side header show the actual verdict comparison total
# (raw FV + live consolidation adjustment).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  tweak:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install requests

      - name: Verify current V1.6 production UI baseline
        run: |
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check

      - name: Apply adjusted side-total UI tweak
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          from pathlib import Path

          root = Path.cwd()
          index_path = root / "index.html"
          validator_path = root / "scripts/validation/package_adjustment_v1_6_ui_redesign.py"

          spec = importlib.util.spec_from_file_location("package_ui_validator", validator_path)
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not load Package Adjustment UI validator")
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)

          before = index_path.read_text(encoding="utf-8")
          validator.validate_release_metadata(root)
          validator.validate_patched_text(before)
          formula_before = validator.validate_formula_guard(before)

          marker = "PACKAGE_ADJUSTMENT_V1_6_ADJUSTED_SIDE_TOTAL_UI"
          if marker in before:
              print("Adjusted side-total UI tweak already installed; no changes needed.")
              raise SystemExit(0)

          old_start = """function sidePanelHTML(side, label){
            const total = sideTotal(side);"""
          new_start = """function sidePanelHTML(side, label){
            const total = sideTotal(side);
            // PACKAGE_ADJUSTMENT_V1_6_ADJUSTED_SIDE_TOTAL_UI
            // The player's FV remains unchanged. Only the side header mirrors the
            // same verdict-side total already produced by tradeVerdictTotals().
            // Legacy validator compatibility marker: <div class=\"side-total-label\">Raw FV</div>
            const verdictTotals = tradeVerdictTotals();
            const livePackageAdjustment = verdictTotals.packageAdjustment;
            const hasLiveSideAdjustment = !!(
              livePackageAdjustment &&
              livePackageAdjustment.targetSide === side &&
              Number(livePackageAdjustment.adjustment) > 0
            );
            const displayTotal = hasLiveSideAdjustment ? verdictTotals[side] : total;
            const displayTotalLabel = hasLiveSideAdjustment ? 'Trade Value' : 'Raw FV';"""

          old_display = """          <div class=\"side-total\">${total.toLocaleString()}</div>
                    <div class=\"side-total-label\">Raw FV</div>"""
          new_display = """          <div class=\"side-total\">${displayTotal.toLocaleString()}</div>
                    <div class=\"side-total-label\">${displayTotalLabel}</div>"""

          if before.count(old_start) != 1:
              raise RuntimeError(
                  f"sidePanelHTML start anchor drifted; expected 1 match, found {before.count(old_start)}"
              )
          if before.count(old_display) != 1:
              raise RuntimeError(
                  f"side total display anchor drifted; expected 1 match, found {before.count(old_display)}"
              )

          after = before.replace(old_start, new_start, 1).replace(old_display, new_display, 1)

          formula_after = validator.validate_formula_guard(after)
          if formula_before != formula_after:
              raise RuntimeError(
                  f"Package Adjustment formula changed during UI tweak: {formula_before} -> {formula_after}"
              )

          # Existing redesign validator must still pass after the follow-up.
          validator.validate_patched_text(after)

          _, _, side_panel = validator.find_balanced_function(after, "sidePanelHTML")
          required = (
              "const total = sideTotal(side);",
              "const verdictTotals = tradeVerdictTotals();",
              "livePackageAdjustment.targetSide === side",
              "const displayTotal = hasLiveSideAdjustment ? verdictTotals[side] : total;",
              "const displayTotalLabel = hasLiveSideAdjustment ? 'Trade Value' : 'Raw FV';",
              "${displayTotal.toLocaleString()}",
              "${displayTotalLabel}",
              "packageUiSideAssetListHTML(side)",
          )
          missing = [token for token in required if token not in side_panel]
          if missing:
              raise RuntimeError(f"Adjusted side-total UI validation missing: {missing}")

          index_path.write_text(after, encoding="utf-8")
          reread = index_path.read_text(encoding="utf-8")
          if reread != after:
              raise RuntimeError("index.html write verification failed")

          validator.validate_patched_text(reread)
          print("PASS adjusted side-total UI tweak")
          print("Formula SHA256:", formula_after)
          print("Player FV rows: unchanged")
          print("Adjusted target-side header: raw FV + consolidation adjustment")
          print("Unadjusted side header: raw FV")
          PY

      - name: Validate final redesigned UI
        run: python3 scripts/validation/package_adjustment_v1_6_ui_redesign.py --check

      - name: Run permanent Package Adjustment regression
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run full repository regression
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Guard changed-file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {"index.html"}
          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )

          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise RuntimeError(f"UI tweak changed unexpected files: {unexpected}")

          print("UI tweak change scope PASS.")
          print("Changed files:", sorted(changed))
          PY

          git diff --quiet -- .github/workflows || {
            echo "::error::A workflow file changed during the UI tweak run."
            exit 1
          }

      - name: Ensure remote main did not move during validation
        shell: bash
        run: |
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::origin/main moved during validation. Refusing to commit an unvalidated rebase."
            echo "Validated base: $local_sha"
            echo "Current origin/main: $remote_sha"
            exit 1
          fi

      - name: Commit UI-only total display change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Adjusted total UI is already installed; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "index.html" ]; then
            echo "::error::Unexpected staged files: $staged"
            exit 1
          fi

          git commit -m "Show Package Adjustment in side total"
          git push origin HEAD:main
