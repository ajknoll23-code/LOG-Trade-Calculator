name: B32C Schedule Utility V1 - Historical Ordinal Development Diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: b32c-schedule-utility-v1-historical-ordinal-development-diagnostic
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  B29_FREEZE_COMMIT: 46e0da275b797e4d7140cc33c2a452c2906d4408
  B30_FREEZE_COMMIT: 875ff12e7bf3622b95276bc8996489cccbbcec9e
  B31A_FREEZE_COMMIT: 1ba4c067c414b849854d0a299352ca9c54e2eec0
  B31_EVALUATION_COMMIT: e7ea182495214a1e29adf8da01b62be4893922c9
  B32A_AUDIT_COMMIT: dc09ff08c2f6977714762c32e506ff5986952518
  B32A_AUDIT_SCRIPT_GIT_BLOB_SHA1: 8dd0b643a939aa6b41a4bb3ee402547107aa8986
  DIAGNOSTIC_SCRIPT_SHA256: e10aa328c49d7160c2efe7689795f258a5b9a53e50f1dfe83389a2af7cd08a8b
jobs:
  historical_ordinal_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Verify revised disposition and one-shot guard
      shell: bash
      run: |-
        set -euo pipefail

        git merge-base --is-ancestor "$B31_EVALUATION_COMMIT" HEAD
        git merge-base --is-ancestor "$B32A_AUDIT_COMMIT" HEAD

        python3 - <<'PY'
        import json
        from pathlib import Path

        root = Path("research/schedule-utility-v1")
        out = root / "schedule_utility_v1_historical_ordinal_development_diagnostic.json"
        assert not out.exists()

        d = json.loads(
            (root / "schedule_utility_v1_phase2_disposition.json").read_text(
                encoding="utf-8"
            )
        )
        assert d["status"] == (
            "QUANTITATIVE_V1_STOP_ORDINAL_V1_SHADOW_PATH_PRESERVED"
        )
        assert d["ordinal_v1_disposition"]["status"] == (
            "AUTHORIZED_FOR_PROSPECTIVE_SHADOW_ONLY"
        )
        assert d["historical_data_governance"][
            "2015_2025_confirmatory_status"
        ] == "CONSUMED"
        assert d["historical_data_governance"][
            "may_be_used_for_development_only"
        ] is True
        assert d["production"]["ordinal_display_authorized_now"] is False

        print("PASS: B32 disposition authorizes development-only B32C.")
        PY
    - name: Snapshot production
      shell: bash
      run: |-
        set -euo pipefail
        echo "INDEX_SHA=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
        echo "FA_SHA=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"
    - name: Materialize exact frozen Phase 2 modules
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/schedule-utility-v1/frozen

        git show "$B30_FREEZE_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2b_preflight.py" \
          > /tmp/schedule-utility-v1/frozen/b30_preflight.py
        git show "$B31_EVALUATION_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2b_evaluation.py" \
          > /tmp/schedule-utility-v1/frozen/b31_evaluation.py
        git show "$B29_FREEZE_COMMIT:research/schedule-utility-v1/log_sapa_v1.py" \
          > /tmp/schedule-utility-v1/frozen/log_sapa_v1.py
        git show "$B29_FREEZE_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2a_analysis_v2.py" \
          > /tmp/schedule-utility-v1/frozen/phase2a_analysis_v2.py

        git show "$B30_FREEZE_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2b_preflight.json" \
          > /tmp/schedule-utility-v1/frozen/preflight.json
        git show "$B31A_FREEZE_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2b_source_drift_audit.json" \
          > /tmp/schedule-utility-v1/frozen/drift_audit.json
        git show "$B29_FREEZE_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2a_amendment_1.json" \
          > /tmp/schedule-utility-v1/frozen/amendment.json
        git show "$B31_EVALUATION_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2b_evaluation.json" \
          > /tmp/schedule-utility-v1/frozen/b31_result.json

        test "$(git hash-object /tmp/schedule-utility-v1/frozen/b30_preflight.py)" \
          = "fce5750002a8dc5a0a40b511cfee80cb50e3028a"
        test "$(git hash-object /tmp/schedule-utility-v1/frozen/b31_evaluation.py)" \
          = "8b82e02d1af1ce93bf143a30b4d171682b8b0e96"

        python3 -m py_compile /tmp/schedule-utility-v1/frozen/b30_preflight.py
        python3 -m py_compile /tmp/schedule-utility-v1/frozen/b31_evaluation.py
        python3 /tmp/schedule-utility-v1/frozen/phase2a_analysis_v2.py


        git show "$B32A_AUDIT_COMMIT:research/schedule-utility-v1/schedule_utility_v1_phase2b_zero_fill_validity_audit.py" \
          > /tmp/schedule-utility-v1/frozen/b32a_audit.py

        test "$(git hash-object /tmp/schedule-utility-v1/frozen/b32a_audit.py)" \
          = "$B32A_AUDIT_SCRIPT_GIT_BLOB_SHA1"
    - name: Instrument frozen B32A replay to capture evaluation rows in temp only
      shell: bash
      run: |-
        set -euo pipefail

        python3 - <<'PY'
        from pathlib import Path

        src = Path(
            "/tmp/schedule-utility-v1/frozen/b32a_audit.py"
        ).read_text(encoding="utf-8")

        needle = "    # Every zero-fill must satisfy every frozen AMD-4 check.\n"
        assert needle in src

        inject = """    # B32C development-only instrumentation. Raw rows stay in /tmp.
            Path("/tmp/schedule-utility-v1/b32c-eval-rows.json").write_text(
                json.dumps(eval_rows, indent=2, sort_keys=True) + "\\n",
                encoding="utf-8",
            )

        """

        patched = src.replace(needle, inject + needle, 1)
        Path("/tmp/schedule-utility-v1/b32c_instrumented_b32a.py").write_text(
            patched, encoding="utf-8"
        )
        PY

        python3 -m py_compile /tmp/schedule-utility-v1/b32c_instrumented_b32a.py
    - name: Download current nflverse historical source bytes
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/schedule-utility-v1/stats

        curl --fail --location --retry 3 --retry-delay 2 \
          --output /tmp/schedule-utility-v1/games.csv \
          https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv

        for season in $(seq 2015 2025); do
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "/tmp/schedule-utility-v1/stats/stats_player_week_${season}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${season}.csv"
          test -s "/tmp/schedule-utility-v1/stats/stats_player_week_${season}.csv"
        done

        test -s /tmp/schedule-utility-v1/games.csv
    - name: Semantically reauthorize current mutable schedule bytes
      shell: bash
      run: |
        set -euo pipefail

        python3 /tmp/schedule-utility-v1/frozen/b30_preflight.py \
          --schedule /tmp/schedule-utility-v1/games.csv \
          --stats-dir /tmp/schedule-utility-v1/stats \
          --frozen /tmp/schedule-utility-v1/frozen/log_sapa_v1.py \
          --out /tmp/schedule-utility-v1/current-preflight.json

        python3 - <<'PY'
        import csv
        import hashlib
        import json
        from pathlib import Path

        def sha(path):
            h = hashlib.sha256()
            with Path(path).open("rb") as f:
                for chunk in iter(lambda: f.read(1024 * 1024), b""):
                    h.update(chunk)
            return h.hexdigest()

        frozen = json.loads(
            Path("/tmp/schedule-utility-v1/frozen/preflight.json")
            .read_text(encoding="utf-8")
        )
        current = json.loads(
            Path("/tmp/schedule-utility-v1/current-preflight.json")
            .read_text(encoding="utf-8")
        )

        frozen_hashes = frozen["source_snapshot_sha256"]
        mismatched_stat_seasons = []
        for season in range(2015, 2026):
            path = (
                f"/tmp/schedule-utility-v1/stats/"
                f"stats_player_week_{season}.csv"
            )
            if sha(path) != frozen_hashes["stats_player_week"][str(season)]:
                mismatched_stat_seasons.append(season)

        semantic_fields = [
            "status",
            "metric_id",
            "seasons",
            "target_weeks",
            "schedule_audit",
            "player_stat_ingestion_audit",
            "aggregate_completeness_audit",
            "predictor_availability",
            "predictor_availability_failures",
            "timestamp_firewall",
            "structural_centering_diagnostic",
            "next_phase",
        ]
        semantic_mismatches = [
            field for field in semantic_fields
            if current.get(field) != frozen.get(field)
        ]

        aliases = {
            "ARZ":"ARI","BLT":"BAL","CLV":"CLE","HST":"HOU","JAC":"JAX",
            "LA":"LAR","LAR":"LAR","OAK":"LV","SD":"LAC","STL":"LAR",
            "WSH":"WAS",
        }
        def canon(x):
            s = str(x or "").strip().upper()
            return aliases.get(s, s)

        games = {}
        with open(
            "/tmp/schedule-utility-v1/games.csv",
            encoding="utf-8-sig",
            newline="",
        ) as f:
            for row in csv.DictReader(f):
                try:
                    season = int(row["season"])
                    week = int(row["week"])
                except (TypeError, ValueError):
                    continue
                if not (2015 <= season <= 2025):
                    continue
                if str(row.get("game_type", "")).upper() != "REG":
                    continue
                gid = str(row.get("game_id", "")).strip()
                if gid:
                    games[gid] = {
                        "season": season,
                        "week": week,
                        "away": canon(row.get("away_team")),
                        "home": canon(row.get("home_team")),
                    }

        reconciliation = {
            "checked_rows": 0,
            "game_id_missing": 0,
            "season_week_mismatch": 0,
            "team_membership_mismatch": 0,
            "opponent_mismatch": 0,
        }
        for season in range(2015, 2026):
            path = (
                f"/tmp/schedule-utility-v1/stats/"
                f"stats_player_week_{season}.csv"
            )
            with open(path, encoding="utf-8-sig", newline="") as f:
                for row in csv.DictReader(f):
                    try:
                        s = int(row["season"])
                        w = int(row["week"])
                    except (TypeError, ValueError):
                        continue
                    if s != season:
                        continue
                    if str(row.get("season_type", "")).upper() not in {
                        "REG", "REGULAR"
                    }:
                        continue

                    reconciliation["checked_rows"] += 1
                    gid = str(row.get("game_id", "")).strip()
                    g = games.get(gid)
                    if g is None:
                        reconciliation["game_id_missing"] += 1
                        continue
                    if g["season"] != s or g["week"] != w:
                        reconciliation["season_week_mismatch"] += 1

                    team = canon(row.get("recent_team") or row.get("team"))
                    if team not in {g["away"], g["home"]}:
                        reconciliation["team_membership_mismatch"] += 1
                        continue

                    opp = row.get("opponent_team")
                    if opp not in (None, ""):
                        expected = (
                            g["home"] if team == g["away"] else g["away"]
                        )
                        if canon(opp) != expected:
                            reconciliation["opponent_mismatch"] += 1

        reconciliation_failures = sum(
            reconciliation[k]
            for k in (
                "game_id_missing",
                "season_week_mismatch",
                "team_membership_mismatch",
                "opponent_mismatch",
            )
        )

        current_games_sha = sha("/tmp/schedule-utility-v1/games.csv")
        passed = (
            not mismatched_stat_seasons
            and not semantic_mismatches
            and reconciliation_failures == 0
            and current["status"] ==
                "PASS_PREDICTOR_ONLY_PREFLIGHT_READY_TO_UNSEAL_PHASE2_TARGETS"
        )

        result = {
            "status": (
                "PASS_CURRENT_SCHEDULE_SEMANTIC_REAUTHORIZATION"
                if passed
                else "STOP_CURRENT_SCHEDULE_SEMANTIC_REAUTHORIZATION"
            ),
            "current_games_sha256": current_games_sha,
            "previous_b31a_games_sha256":
                "d5cd27ca83bdd58cff08e0e03637d726c3b3ca3741708e81727dcaa7194d86ef",
            "games_bytes_changed_again":
                current_games_sha !=
                "d5cd27ca83bdd58cff08e0e03637d726c3b3ca3741708e81727dcaa7194d86ef",
            "all_11_player_stat_files_match_b30":
                not mismatched_stat_seasons,
            "player_stat_mismatch_seasons":
                mismatched_stat_seasons,
            "semantic_mismatches": semantic_mismatches,
            "schedule_stat_reconciliation": reconciliation,
        }

        Path("/tmp/schedule-utility-v1/source-reauth.json").write_text(
            json.dumps(result, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        print(json.dumps(result, indent=2))

        if not passed:
            raise SystemExit(
                "Current nflverse schedule bytes are not semantically "
                "equivalent to the frozen B30/B31 evaluation inputs."
            )
        PY
    - name: Replay exact B31 row construction and capture rows
      shell: bash
      run: |-
        set -euo pipefail

        python3 \
          /tmp/schedule-utility-v1/b32c_instrumented_b32a.py \
          --schedule /tmp/schedule-utility-v1/games.csv \
          --stats-dir /tmp/schedule-utility-v1/stats \
          --b30-module /tmp/schedule-utility-v1/frozen/b30_preflight.py \
          --b31-module /tmp/schedule-utility-v1/frozen/b31_evaluation.py \
          --log-sapa /tmp/schedule-utility-v1/frozen/log_sapa_v1.py \
          --analysis /tmp/schedule-utility-v1/frozen/phase2a_analysis_v2.py \
          --preflight-json /tmp/schedule-utility-v1/frozen/preflight.json \
          --drift-audit-json /tmp/schedule-utility-v1/frozen/drift_audit.json \
          --source-reauth-json /tmp/schedule-utility-v1/source-reauth.json \
          --b31-result-json /tmp/schedule-utility-v1/frozen/b31_result.json \
          --amendment-json /tmp/schedule-utility-v1/frozen/amendment.json \
          --out /tmp/schedule-utility-v1/b32c-replay-audit.json

        test -s /tmp/schedule-utility-v1/b32c-eval-rows.json

        python3 - <<'PY'
        import json
        from pathlib import Path

        audit = json.loads(
            Path("/tmp/schedule-utility-v1/b32c-replay-audit.json").read_text(
                encoding="utf-8"
            )
        )
        assert audit["source_replay"]["replay_matches_frozen_b31"] is True
        assert audit["conclusion"]["original_b31_stop_remains_binding"] is True
        print("PASS: exact B31 replay matched before ordinal diagnostics.")
        PY
    - name: Freeze historical ordinal development diagnostic implementation
      shell: bash
      run: |
        set -euo pipefail

        cat > research/schedule-utility-v1/schedule_utility_v1_historical_ordinal_development_diagnostic.py <<'PYFILE'
        #!/usr/bin/env python3
        from __future__ import annotations

        import argparse
        from collections import defaultdict
        import json
        import math
        from pathlib import Path
        import statistics

        HALF_CELLS = ("QB_HALF", "RB_HALF", "WR_HALF", "TE_HALF")


        def avg_ranks(values):
            order = sorted(range(len(values)), key=lambda i: (values[i], i))
            ranks = [0.0] * len(values)
            j = 0
            while j < len(order):
                k = j + 1
                v = values[order[j]]
                while k < len(order) and values[order[k]] == v:
                    k += 1
                rank = ((j + 1) + k) / 2.0
                for t in range(j, k):
                    ranks[order[t]] = rank
                j = k
            return ranks


        def pearson(x, y):
            if len(x) != len(y) or len(x) < 2:
                return None
            mx = statistics.fmean(x)
            my = statistics.fmean(y)
            dx = [v - mx for v in x]
            dy = [v - my for v in y]
            sx = sum(v * v for v in dx)
            sy = sum(v * v for v in dy)
            if sx <= 0 or sy <= 0:
                return None
            return sum(a * b for a, b in zip(dx, dy)) / math.sqrt(sx * sy)


        def spearman(x, y):
            return pearson(avg_ranks(x), avg_ranks(y))


        def group_diagnostics(rows):
            effects = [float(r["defense_effect"]) for r in rows]
            residuals = [
                float(r["actual"]) - float(r["baseline_forecast"])
                for r in rows
            ]
            rho = spearman(effects, residuals)

            ordered = sorted(
                zip(effects, residuals, rows),
                key=lambda z: (
                    z[0],
                    str(z[2]["defense_team"]),
                    str(z[2]["offense_team"]),
                    str(z[2]["game_id"]),
                ),
            )

            q = max(1, len(ordered) // 4)
            hard_q = [x[1] for x in ordered[:q]]
            easy_q = [x[1] for x in ordered[-q:]]
            spread = statistics.fmean(easy_q) - statistics.fmean(hard_q)

            t = max(1, len(ordered) // 3)
            hard_t = [x[1] for x in ordered[:t]]
            easy_t = [x[1] for x in ordered[-t:]]
            neutral_t = [x[1] for x in ordered[t:len(ordered) - t]]
            if not neutral_t:
                neutral_t = residuals

            return {
                "n": len(rows),
                "spearman_defense_effect_vs_realized_residual": rho,
                "easy_minus_hard_quartile_residual_points": spread,
                "tier_mean_residual_points": {
                    "Hard": statistics.fmean(hard_t),
                    "Neutral": statistics.fmean(neutral_t),
                    "Easy": statistics.fmean(easy_t),
                },
            }


        def main():
            ap = argparse.ArgumentParser()
            ap.add_argument("--rows", required=True)
            ap.add_argument("--out", required=True)
            args = ap.parse_args()

            all_rows = json.loads(Path(args.rows).read_text(encoding="utf-8"))
            rows = [r for r in all_rows if r["cell"] in HALF_CELLS]
            if not rows:
                raise RuntimeError("no Half-PPR B31 rows found")

            groups = defaultdict(list)
            for r in rows:
                groups[(int(r["season"]), int(r["week"]), r["cell"])].append(r)

            group_results = {}
            per_cell = defaultdict(
                lambda: {"rho": [], "spread": [], "tiers": defaultdict(list)}
            )
            excluded_constant_groups = []

            for key in sorted(groups):
                season, week, cell = key
                g = group_diagnostics(groups[key])
                group_results[f"{season}_W{week}_{cell}"] = g

                rho = g["spearman_defense_effect_vs_realized_residual"]
                if rho is None:
                    excluded_constant_groups.append(f"{season}_W{week}_{cell}")
                else:
                    per_cell[cell]["rho"].append(rho)

                per_cell[cell]["spread"].append(
                    g["easy_minus_hard_quartile_residual_points"]
                )
                for tier, value in g["tier_mean_residual_points"].items():
                    per_cell[cell]["tiers"][tier].append(value)

            cell_summary = {}
            for cell in HALF_CELLS:
                d = per_cell[cell]
                if not d["rho"] or not d["spread"]:
                    raise RuntimeError(f"insufficient ordinal diagnostics for {cell}")
                cell_summary[cell] = {
                    "eligible_week_cells_for_spearman": len(d["rho"]),
                    "mean_week_cell_spearman": statistics.fmean(d["rho"]),
                    "median_week_cell_spearman": statistics.median(d["rho"]),
                    "positive_spearman_fraction": (
                        sum(x > 0 for x in d["rho"]) / len(d["rho"])
                    ),
                    "mean_easy_minus_hard_quartile_residual_points": (
                        statistics.fmean(d["spread"])
                    ),
                    "positive_quartile_spread_fraction": (
                        sum(x > 0 for x in d["spread"]) / len(d["spread"])
                    ),
                    "mean_tier_residual_points": {
                        tier: statistics.fmean(d["tiers"][tier])
                        for tier in ("Hard", "Neutral", "Easy")
                    },
                }

            pooled_rho = statistics.fmean(
                cell_summary[cell]["mean_week_cell_spearman"]
                for cell in HALF_CELLS
            )
            pooled_spread = statistics.fmean(
                cell_summary[cell][
                    "mean_easy_minus_hard_quartile_residual_points"
                ]
                for cell in HALF_CELLS
            )
            pooled_tiers = {
                tier: statistics.fmean(
                    cell_summary[cell]["mean_tier_residual_points"][tier]
                    for cell in HALF_CELLS
                )
                for tier in ("Hard", "Neutral", "Easy")
            }

            development_positive = pooled_rho > 0 and pooled_spread > 0
            tier_ordered = (
                pooled_tiers["Easy"]
                > pooled_tiers["Neutral"]
                > pooled_tiers["Hard"]
            )

            result = {
                "schema_version": 1,
                "study_id": "schedule-utility-v1",
                "phase": "historical-ordinal-development-diagnostic",
                "status": (
                    "DEVELOPMENT_ORDINAL_SIGNAL_POSITIVE_CONTINUE_TO_B33"
                    if development_positive
                    else (
                        "RECONSIDER_BEFORE_B33_"
                        "NONPOSITIVE_HISTORICAL_ORDINAL_SIGNAL"
                    )
                ),
                "governance": {
                    "2015_2025_are_consumed": True,
                    "confirmatory_evidence": False,
                    "production_authorization": False,
                    "may_change_b31_stop": False,
                    "purpose": (
                        "development-only directional check before spending "
                        "prospective 2026 weeks"
                    ),
                },
                "population": {
                    "seasons": [2015, 2025],
                    "target_weeks": [4, 17],
                    "scoring_mode": "HALF_PPR_ONLY",
                    "cells_equal_weight": list(HALF_CELLS),
                    "row_count": len(rows),
                    "group_unit": "season-week-cell",
                },
                "definitions": {
                    "realized_residual": (
                        "actual team-position fantasy points minus frozen "
                        "trailing offense baseline"
                    ),
                    "ordinal_predictor": (
                        "frozen LOG-SAPA defense_effect; larger means easier matchup"
                    ),
                    "spearman": (
                        "within season-week-cell Spearman(defense_effect, "
                        "realized_residual)"
                    ),
                    "quartile_spread": (
                        "mean realized residual in easiest defense-effect quartile "
                        "minus hardest quartile"
                    ),
                    "historical_signal_continue_rule": (
                        "pooled equal-position mean Spearman > 0 AND pooled "
                        "equal-position mean easy-minus-hard quartile spread > 0"
                    ),
                    "tier_ordering": (
                        "descriptive only; not part of the continue rule"
                    ),
                },
                "pooled_equal_position": {
                    "mean_week_cell_spearman": pooled_rho,
                    "mean_easy_minus_hard_quartile_residual_points": pooled_spread,
                    "mean_tier_residual_points": pooled_tiers,
                    "tier_means_ordered_easy_gt_neutral_gt_hard": tier_ordered,
                },
                "per_cell": cell_summary,
                "excluded_constant_spearman_groups": excluded_constant_groups,
                "group_diagnostics": group_results,
                "next": {
                    "b33_may_be_frozen_if_status_positive": development_positive,
                    "if_nonpositive": (
                        "reconsider ordinal shadow design before consuming "
                        "prospective weeks"
                    ),
                },
            }

            Path(args.out).write_text(
