name: CAL26 V1R62 - Empirical Production Rank and Trade Price Anchor Audit (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r62-empirical-pricing-audit
  cancel-in-progress: false
jobs:
  evidence-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Read-only checkout of pinned league trade and market evidence
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Use Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Download frozen 518-player R61 evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R61_OWNER_REVIEW_518_SCALE_SCENARIOS_NOT_FV
        run-id: 40059837648
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r62-inputs/R61
    - name: Download exact real R58R1 QB LOG Week6 evidence
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R58R1_R47_TEAM_GAME_PARITY_AND_LOG_QB_WEEK6_FEATURES_RESEARCH_ONLY
        run-id: 40053443808
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r62-inputs/R58
    - name: Download exact real R56 historical recency holdout
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R56_LOG_WEEK6_NEXT_SEASON_SHADOW_SENSITIVITY_RESEARCH_ONLY
        run-id: 40049447205
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r62-inputs/R56
    - name: 'No arbitrary point multiplier: score intrinsic ranks and trade-market evidence'
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/CAL26_V1R62_engine.py\" <<'PY_CAL26_V1R62_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 V1R62: Non-arbitrary evidence bridge / no price release.\n\nInputs: SHA-pinned GitHub R61/R58R1/R56 artifacts, and git-blob-pinned\nleague votes, market snapshots, and historical trades.\n\nThe workflow DOES NOT create 20x FV, silently fit current FV/owner targets,\nor treat market-percentile matching as an independent cardinal FV calibration.\n\"\"\"\nfrom __future__ import annotations\nimport argparse, collections, csv, hashlib, io, json, math, pathlib, statistics, subprocess\n\nPOS=('QB','RB','WR','TE','DL','LB','DB')\nFILES={\n 'R61':['CAL26_V1R61_manifest.json','CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv'],\n 'R58':['CAL26_V1R58_manifest.json','CAL26_V1R58_54_QB_team_game_LOG_feature_bridge_NOT_FV.csv'],\n 'R56':['CAL26_V1R56_manifest.json','CAL26_V1R56_cohort_LOG_next_season_holdout.csv'],\n}\n# SHA-256 is populated from actual successful Github Actions artifacts, NOT from our tests.\nARTIFACT_PINS={'R61': {'CAL26_V1R61_manifest.json': '5632c5d440882bfeedd411aa020ef289c3d2be15cfbbc22f26c83cb8db191923', 'CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv': 'deb362dbc4718f4ecf4837a34d17a349b29f9fc04d2657cbd1543b9d864e2ae2'}, 'R58': {'CAL26_V1R58_manifest.json': 'd8368dd4362728a6e983c156c3b1fbdabfafcb44597e4a522ebbca663f080b6d', 'CAL26_V1R58_54_QB_team_game_LOG_feature_bridge_NOT_FV.csv': 'b5cfc49fcb7905a52236dcfb2ff9d9c9d1c4b9075cec71af5679e329b677ade2'}, 'R56': {'CAL26_V1R56_manifest.json': '0f76e1ce51981592a023c5817bd50ce6f16e332e2bf31d50bbdb815897841fe1', 'CAL26_V1R56_cohort_LOG_next_season_holdout.csv': 'b982b565b3be7c5687a35913044e9b7024c0bb5d1360cccbeea86f542c3c1b93'}}\nGIT_PINS={\n 'data/trade_history.json':'aa0ff2f2e839d3fc6aec67cfc6615c4130844ef3',\n 'research/market-value-v2/market_value_v2_phase3_candidate_market_values.json':'b36a959ae356f14b1e36aadfae4ad56e7ad60d38',\n 'research/market-value-v2/market_value_v2_phase2_vote_snapshot.json':'e094822d2b268901e4ac60c909da2c2e0676caa6',\n}\nFOCUS=('bryce young','jayden daniels','cj stroud','caleb williams','drake maye','puka nacua','myles garrett')\n\ndef need(x,msg):\n if not x:raise AssertionError(msg)\ndef sha(b):return hashlib.sha256(b).hexdigest()\ndef num(x):\n v=float(x);need(math.isfinite(v),'NONFINITE_INPUT');return v\ndef yes(x):return str(x).lower()=='true'\ndef cs(b):return list(csv.DictReader(io.StringIO(b.decode('utf-8-sig'))))\ndef csvstr(rows,fields):\n out=io.StringIO(newline='');w=csv.DictWriter(out,fieldnames=fields,lineterminator='\\n',extrasaction='ignore');w.writeheader()\n for row in rows:w.writerow({k:row.get(k,'') for k in fields})\n return out.getvalue()\ndef norm(x):\n import unicodedata,re\n s=unicodedata.normalize('NFKD',str(x or '')).encode('ascii','ignore').decode().lower()\n s=re.sub(r'[^a-z0-9 ]','',s)\n return ' '.join(s.split())\ndef quantile(vals,rank_frac):\n v=sorted(vals);need(v,'NO_MARKET_VALUES')\n pos=rank_frac*(len(v)-1);i=int(pos);j=min(i+1,len(v)-1)\n return (1-(pos-i))*v[i]+(pos-i)*v[j]\ndef ranked_fraction(target, allvals):\n # explicit empirical percentile; tied values use average rank. No arbitrary price multiplier.\n v=sorted(allvals);lo=sum(x<target for x in v);same=sum(x==target for x in v)\n return (lo+(same-1)/2)/max(1,len(v)-1)\ndef load_art(root):\n records={};m={}\n for group,files in FILES.items():\n  records[group]={}\n  for f in files:\n   b=(root/group/f).read_bytes();need(sha(b)==ARTIFACT_PINS[group][f],f'PIN_DRIFT_{group}_{f}');records[group][f]=b\n  m[group]=json.loads(records[group][files[0]])\n need(m['R61']['n_full_projected_players']==518 and m['R61']['research_scenario_eligible']==149,'R61_COHORT_DRIFT')\n need(m['R58']['eligible_QBs']==31 and m['R58']['reconciled_standard_feature_parity_count']==31,'R58_PARITY_DRIFT')\n need(m['R56']['2026_eligible_QBs']==31 and m['R56']['54_QB_joined']==54,'R56_COHORT_DRIFT')\n need(all(not x.get('production_change_authorized',False) for x in m.values()),'UPSTREAM_PRODUCTION_DRIFT')\n return records,m\n\ndef load_repo(repo,fixture):\n res={}\n for path,pin in GIT_PINS.items():\n  location=repo/path\n  if not fixture:\n   observed=subprocess.check_output(['git','hash-object','--',path],cwd=repo,text=True).strip()\n   need(observed==pin,'GIT_BLOB_DRIFT_'+path)\n  data=location.read_bytes();res[path]=json.loads(data)\n return res\n\ndef evaluate(votes,model,market):\n # Existing KTC keep/trade/cut rankings are descriptive, NOT an independent\n # chronological market-model test because Market V2 used these same votes.\n metrics={key:collections.defaultdict(lambda:[0,0]) for key in ('year0','three_year','frozen_FV','market_V2')}\n seen_voters=set();matched=0;unique_3way=0;pairrows=[]\n for ballot in votes:\n  names=[norm(ballot.get(k)) for k in ('keep','trade','cut')]\n  if not all(names) or len(set(names))!=3:continue\n  voter=str(ballot.get('voter_roster_id') or 'UNATTRIBUTED')\n  seen_voters.add(voter)\n  if all(n in model for n in names):unique_3way+=1\n  for i,j in ((0,1),(1,2),(0,2)):\n   good,bad=names[i],names[j]\n   if good not in model or bad not in model:continue\n   matched+=1\n   row={'better':good,'worse':bad,'voter':voter,'year0_better':model[good]['2026_year0_surplus'],'year0_worse':model[bad]['2026_year0_surplus']}\n   for k in metrics:\n    if k=='market_V2':\n     a=market.get(good,{}).get('market_value');b=market.get(bad,{}).get('market_value')\n    else:\n     a=model[good].get({'year0':'2026_year0_surplus','three_year':'three_season_surplus_2026_2028_proxy','frozen_FV':'frozen_FV_REFERENCE_ONLY'}[k]);b=model[bad].get({'year0':'2026_year0_surplus','three_year':'three_season_surplus_2026_2028_proxy','frozen_FV':'frozen_FV_REFERENCE_ONLY'}[k])\n    if a in ('',None) or b in ('',None):continue\n    if k=='three_year' and (model[good]['scenario_status']!='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV' or model[bad]['scenario_status']!='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV'):continue\n    va,vb=num(a),num(b)\n    metrics[k][voter][0]+= 1 if va>vb else (0.5 if va==vb else 0)\n    metrics[k][voter][1]+=1\n   pairrows.append(row)\n results=[]\n for k,by in metrics.items():\n  total=sum(v[1] for v in by.values());wins=sum(v[0] for v in by.values())\n  voter_rates=[v[0]/v[1] for v in by.values() if v[1]]\n  results.append({'comparison':k,'matched_pairs':total,'voters':len(voter_rates),\n   'pairwise_correct_pct':round(100*wins/total,2) if total else '',\n   'equal_voter_accuracy_pct':round(100*statistics.mean(voter_rates),2) if voter_rates else '',\n   'provenance':'DESCRIPTIVE_ONLY__MV2_BUILT_FROM_SAME_VOTE_SNAPSHOT' if k=='market_V2' else 'RESEARCH__2026_VOTE_TIMING_NOT_FUTURE_HOLDOUT',\n   'independent_cardinal_FV_scale_identified':False})\n return results,{'ballots':len(votes),'matched_pair_instances':matched,'full_triples_in_R61':unique_3way,'unique_voter_ids':len(seen_voters)}\n\ndef preference_calibration(votes,model):\n \"\"\"Train/test entirely separate voter IDs; retrospective, not prospective over time.\n\n Calibrates probabilistic *preference* sensitivity (relative ordering), NOT FV\n dollars. The independent 0.00 slope is a no-preference-information baseline.\n \"\"\"\n keys=('year0','three_year','frozen_FV')\n cols={'year0':'2026_year0_surplus','three_year':'three_season_surplus_2026_2028_proxy','frozen_FV':'frozen_FV_REFERENCE_ONLY'}\n population={}\n for k in keys:\n  data=[num(r[cols[k]]) for r in model.values() if r.get(cols[k]) not in ('',None) and (k!='three_year' or r['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV')]\n  population[k]=statistics.pstdev(data)\n  need(population[k]>1e-6,'DEGENERATE_CALIBRATION_SCORE_'+k)\n voterlist=sorted({str(r.get('voter_roster_id','')) for r in votes if r.get('voter_roster_id') not in ('',None)})\n # deterministic hash ranking, with a fixed 20% group holdout\n ordered=sorted(voterlist,key=lambda v:hashlib.sha256(('R62-HOLDOUT-V1:'+v).encode()).hexdigest())\n ntest=max(1,round(len(ordered)*0.2));heldout=set(ordered[:ntest]);train=set(ordered[ntest:])\n need(len(heldout)>=4 and len(train)>=8,'VOTER_SPLIT_INSUFFICIENT')\n result=[];grid=(0.,.25,.5,1.,2.,4.,8.)\n for k in keys:\n  by={'train':collections.defaultdict(list),'test':collections.defaultdict(list)}\n  for ballot in votes:\n   voter=str(ballot.get('voter_roster_id') or ''); group='test' if voter in heldout else 'train'\n   if voter not in heldout and voter not in train:continue\n   names=[norm(ballot.get(t)) for t in ('keep','trade','cut')]\n   if not all(names) or len(set(names))!=3:continue\n   for a,b in ((0,1),(1,2),(0,2)):\n    if names[a] not in model or names[b] not in model:continue\n    A=model[names[a]];B=model[names[b]]\n    if k=='three_year' and (A['scenario_status']!='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV' or B['scenario_status']!='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV'):continue\n    d=(num(A[cols[k]])-num(B[cols[k]]))/population[k]\n    # both orientations prevent class-imbalance bugs: true preference 1 for winner\n    by[group][voter].extend(((d,1),(-d,0)))\n  def loss(rows,slope):\n   if not rows:return None\n   rates=[]\n   for item in rows.values():\n    scores=[]\n    for x,label in item:\n     z=max(-30,min(30,slope*x));p=1/(1+math.exp(-z));p=max(1e-9,min(1-1e-9,p))\n     scores.append(-math.log(p if label==1 else (1-p)))\n    rates.append(statistics.mean(scores))\n   return statistics.mean(rates) if rates else None\n  nt=sum(len(x) for x in by['train'].values())//2;nh=sum(len(x) for x in by['test'].values())//2\n  qualified=(nh>=30 and len(by['test'])>=4 and nt>=100 and len(by['train'])>=8)\n  if qualified:\n   selected=min(grid,key=lambda g:(loss(by['train'],g),g));ts=loss(by['test'],selected); baseline=loss(by['test'],0.)\n  else:selected=None;ts=baseline=None\n  result.append({'model':k,'train_voters':len(by['train']),'test_voters':len(by['test']),\n    'train_pairs':nt,'test_pairs':nh,'fixed_predeclared_slope_grid':'0;0.25;0.5;1;2;4;8',\n    'inner_selected_logistic_slope_standardized_surplus_NOT_FV':selected if qualified else '',\n    'heldout_voter_equal_weight_logloss':round(ts,6) if qualified else '',\n    'heldout_voter_logloss_no_information':round(baseline,6) if qualified else '',\n    'heldout_improves_on_random_preference':ts<baseline if qualified else False,\n    'status':'RETROSPECTIVE_VOTER_SPLIT_RESEARCH_ONLY_NOT_TEMPORAL' if qualified else 'INSUFFICIENT_COVERAGE_WITHHELD',\n    'cardinal_FV_price_estimated':False})\n return result\n\ndef audit_trades(history):\n a=history.get('trades_with_picks',[]);need(len(a)>=1,'NO_TRADES')\n out=collections.Counter();byyear=collections.Counter();simple=0\n for t in a:\n  byyear[str(t['league_season'])]+=1\n  sides=t.get('sides',[])\n  need(len(sides)==2,'NON_TWO_SIDED_TRADE_UNSUPPORTED')\n  shapes=[(len(s.get('received_players',[])),len(s.get('received_picks',[]))) for s in sides]\n  if shapes==[(1,0),(1,0)]:simple+=1\n  if sum(z[1] for z in shapes)>0:out['trades_involving_picks']+=1\n  if all(z[0]==0 for z in shapes):out['picks_only']+=1\n  if any(z[0]>0 for z in shapes):out['includes_players']+=1\n return {'total_trades':len(a),'trades_by_season':dict(byyear),'one_player_for_one_player_no_picks':simple,\n  'trades_involving_picks':out['trades_involving_picks'],'picks_only':out['picks_only'],\n  'includes_players':out['includes_players'],\n  'historical_at_trade_FV_or_market_quotes_present':False,\n  'observed_absolute_FV_per_surplus_point_identified':False}\n\ndef run(args):\n blobs,manifest=load_art(args.inputs)\n records=load_repo(args.repo,args.fixture)\n marketobj=records['research/market-value-v2/market_value_v2_phase3_candidate_market_values.json']\n voteobj=records['research/market-value-v2/market_value_v2_phase2_vote_snapshot.json']\n market={norm(n):v for n,v in marketobj['players'].items()}\n ballot=voteobj['rows']; history=records['data/trade_history.json']\n need(len(market)>=400 and len(ballot)>=500,'REFERENCE_DATA_INCOMPLETE')\n rows=cs(blobs['R61']['CAL26_V1R61_518_player_scale_scenarios_NOT_FV.csv'])\n log=cs(blobs['R58']['CAL26_V1R58_54_QB_team_game_LOG_feature_bridge_NOT_FV.csv'])\n hold=cs(blobs['R56']['CAL26_V1R56_cohort_LOG_next_season_holdout.csv'])\n need(len(rows)==518 and len(log)==54 and len(hold)==2,'INPUT_COUNTS_DRIFT')\n model={r['name']:r for r in rows};need(len(model)==518,'DUPLICATE_R61_NAMES')\n logmap={r['name']:r for r in log};need(len(logmap)==54,'DUPLICATE_QB_NAMES')\n need({r['position'] for r in rows}==set(POS),'MISSING_POSITION')\n need(set(logmap).issubset(model),'R58_PLAYER_CROSSWALK_MISMATCH')\n need(sum(r['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV' for r in rows)==149,'149_SCENARIO_GATE_DRIFT')\n need(any(r['cohort']=='has_prior' and yes(r['numerical_recency_sensitivity_enabled']) for r in hold),'HISTORICAL_RECENCY_GATE_DRIFT')\n need(all(r['production_change_authorized']=='False' for r in rows),'PRODUCTION_UNCHANGED_GATE')\n tradeaudit=audit_trades(history)\n # Only observable league-market quantiles define market-unit reference display.\n # This is NOT an empirically identified cardinal Fundamental Value mapping.\n pop=[num(r['market_value']) for r in market.values()]\n y0=[num(r['2026_year0_surplus']) for r in rows]\n out=[]\n for r in rows:\n  name=r['name']; raw=num(r['2026_year0_surplus']);percent=ranked_fraction(raw,y0)\n  marketrow=market.get(name);logrow=logmap.get(name)\n  obj={'name':name,'position':r['position'],'frozen_FV_REFERENCE_ONLY':r['frozen_FV_REFERENCE_ONLY'],\n   '2026_production_forecast_source':'R59_FROZEN_PRESEASON_NOT_FULL_LOG',\n   'year0_surplus_points_NOT_FV':r['2026_year0_surplus'],\n   'year0_surplus_percentile':round(100*percent,2),\n   'historical_H1_H2_eligible':r['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV',\n   'three_season_discounted_surplus_points_NOT_FV':r['three_season_surplus_2026_2028_proxy'] if r['scenario_status']=='RESEARCH_SCALE_SCENARIO_ELIGIBLE_NOT_FV' else '',\n   'market_shape_percentile_equivalent_UNCALIBRATED_NOT_FV':round(quantile(pop,percent)),\n   'independently_observed_market_V2_reference':marketrow['market_value'] if marketrow else '',\n   'market_V2_snapshot':'2026-09-17; historical reference not live 2026-10-23',\n   'market_shape_uses_individual_market_price_for_fit':False,\n   'not_a_calibrated_FV_price':True,\n   'QB_Week6_LOG_native_selected_feature_ppg_NOT_FORECAST':'',\n   'QB_Week6_LOG_native_YTD_ppg':'',\n   'QB_historical_week6_feature_gate':'NO_QB_FEATURE',\n   '2026_Week6_only':True,'production_change_authorized':False}\n  if logrow is not None and yes(logrow['frozen_Week6_R47_eligible']):\n   obj['QB_Week6_LOG_native_YTD_ppg']=logrow['LOG_core_YTD_ppg_per_TEAM_game']\n   if yes(logrow['R47_qualified_previous_season']) and logrow['LOG_core_2025_prior_ppg_per_TEAM_game']!='':\n    vals=[num(logrow[c]) for c in ('LOG_core_YTD_ppg_per_TEAM_game','LOG_core_recent3_ppg_per_TEAM_game','LOG_core_2025_prior_ppg_per_TEAM_game')]\n    obj['QB_Week6_LOG_native_selected_feature_ppg_NOT_FORECAST']=round(sum(vals)/3,4)\n    obj['QB_historical_week6_feature_gate']='R56_PRIOR_COHORT_SELECTED_SIGNAL_SUPPORTED_HOLDOUT__NOT_PRESEASON_REPRICE'\n   else:obj['QB_historical_week6_feature_gate']='R56_NO_PRIOR_SMALL_HOLDOUT__NUMERICAL_EFFECT_WITHHELD'\n  out.append(obj)\n need(sum(x['QB_historical_week6_feature_gate'].startswith('R56_PRIOR') for x in out)==28,'QB_28_QUALIFIED_PRIOR_GATE')\n result,voteinfo=evaluate(ballot,model,market)\n voterfit=preference_calibration(ballot,model)\n # Entire ballot sample is a descriptive test, never a time-disjoint market test.\n manifestout={'semantic_status':'EMPIRICAL_RANKING_AND_MARKET_SHAPE_BRIDGE__CARDINAL_FV_NOT_IDENTIFIED__HOLD',\n  'source_run_ids':{'R61':40059837648,'R58R1':40053443808,'R56':40049447205},\n  'fixture':args.fixture,'n_players':len(out),'n_horizon_eligible':149,'n_QB_priors_scored':28,\n  'market_rows':len(market),'voter_rows':len(ballot),'trade_audit':tradeaudit,'vote_coverage':voteinfo,\n  'market_snapshot_timestamp':marketobj.get('generated_at_utc'),\n  'repo_git_blob_pins_verified':not args.fixture,'artifact_sha256_pins_verified':True,\n  'retrospective_market_votes_not_independent_from_mv2':True,\n  'retrospective_voter_disjoint_calibration_not_prospective_time_disjoint':True,\n  'voter_split_calibration':voterfit,\n  'model_ranks_production_based_not_market_labels':True,\n  'market_quantile_shape_is_convention_not_observed_FV_cardinal_utility':True,\n  'preseason_to_historical_future_model_transport_verified':False,\n  'no_2026_week7_plus_read':True,'no_protected_2026_weeks8_12_read':True,\n  'arbitrary_15x_20x_25x_pricing_not_used':True,\n  'owner_price_targets_not_used':True,'existing_FV_not_used_as_fit_target':True,\n  'exact_Sleeper_2026_projection_bonus_reconciliation_complete':False,\n  'production_change_authorized':False,'index_html_modified':False,'frozen_values_preserved':549,\n  'calibrated_cardinal_FV_scale_identified':False}\n args.out.mkdir(parents=True,exist_ok=True)\n prose=['# CAL26 V1R62 — Evidence-based valuation readiness without arbitrary 20×',\n  '**Decision: CARDINAL_FV_NOT_IDENTIFIED.** No production quote changes. No 15×/20×/25× multipliers.',\n  '', '## Source-backed results',\n  f\"- R61 {len(out)} player frozen 2026 surplus estimates; {149} historically two-horizon eligible. Preseason→actual model transport remains unvalidated.\",\n  f\"- R58R1: 31 frozen LOG-core Week6 eligible QBs, with 28 usable prior-year histories. R56 cohort's equal-all-three signal won the 50-case historical holdout. These are LOG PPG features, NOT 2027 point predictions.\",\n  f\"- Market V2 is a {len(market)}-player league-vote value *snapshot* from {marketobj.get('generated_at_utc')}; it is not the league's exact fundamental truth. Percentile-equivalent columns use its aggregate distribution ONLY, never individual market price as the player's model fit label.\",\n  f\"- League transaction archive: {tradeaudit['total_trades']} trades, {tradeaudit['one_player_for_one_player_no_picks']} clean 1-player vs 1-player no-pick trades. Multiasset bundles without at-trade player/pick quotes cannot identify an absolute price-per-surplus-point multiplier.\",\n  '', '## Descriptive vote rank checks (NOT independent market validation)',\n  '| Ranking signal | Comparable pair observations | Distinct voters | Pair accuracy | Equal-voter accuracy |',\n  '|---|---:|---:|---:|---:|']\n for x in result:prose.append(f\"| {x['comparison']} | {x['matched_pairs']} | {x['voters']} | {x['pairwise_correct_pct']}% | {x['equal_voter_accuracy_pct']}% |\")\n prose+=['','Market V2 was trained from the same 2026 September vote snapshot; its in-sample comparison is descriptive and must NOT be used as a winner against independent models. Voting samples may overrepresent specific owners and player tiers.',\n  '', '## Voter-disjoint preference sensitivity (never an FV price)',\n  '|Intrinsic score|Training voters|Test voters|Held-out preference pairs|Fitted standardized logistic slope|Holdout log loss|No-signal log loss|',\n  '|---|---:|---:|---:|---:|---:|---:|']\n for x in voterfit:prose.append(f\"| {x['model']} | {x['train_voters']} | {x['test_voters']} | {x['test_pairs']} | {x['inner_selected_logistic_slope_standardized_surplus_NOT_FV'] or 'WITHHELD'} | {x['heldout_voter_equal_weight_logloss'] or '—'} | {x['heldout_voter_logloss_no_information'] or '—'} |\")\n prose+=['These voters are disjoint between fitting and testing, but 2026 Week6 performance postdates the historical ballots. This is **not a chronological/prospective valuation backtest** and cannot independently identify an FV scale.',\n  '', '## Prespecified player diagnostics',\n  '|Player|Frozen FV (reference)|Year0 surplus points|Model surplus pctile|Market-shape units (NOT FV)|LOG Week6 equal-three PPG|',\n  '|---|---:|---:|---:|---:|---:|']\n ix={r['name']:r for r in out}\n for name in FOCUS:\n  row=ix[name];prose.append(f\"| {name} | {row['frozen_FV_REFERENCE_ONLY']} | {row['year0_surplus_points_NOT_FV']} | {row['year0_surplus_percentile']} | {row['market_shape_percentile_equivalent_UNCALIBRATED_NOT_FV']} | {row['QB_Week6_LOG_native_selected_feature_ppg_NOT_FORECAST'] or '—'} |\")\n prose+=['','## Concrete decision and next production step',\n  '1. Reject 20× and avoid treating price-distribution matching as FV truth. A scale inferred from already deployed FV would be circular; market percentile-matching defines a display convention, not cardinal economic equivalence.',\n  '2. Build a prospective scoring-compatible 2026 forecast (including LOG bonuses, role/ROS and future-season durability) before any numerical FV comparison. Retain stronger RB/LB baselines.',\n  '3. Obtain independent price anchors: timestamped balanced trades (with pick valuations and at-trade context) or a deliberately chosen market-denominated FV convention validated by future league preferences. Without those, an independent absolute FV scale is **not identified**.',\n  '4. Once anchored, present a small reversible FV preview against current values for explicit owner authorization. Preserve Market Value separately from Fundamental Value.',\n  '', '**No live writes, 2026 Week7+ use, protected outcomes, owner-price target fitting, or 20× price substitution.**','']\n artifacts={'CAL26_V1R62_518_evidence_rank_market_shape_NOT_FV.csv':csvstr(out,list(out[0])),\n 'CAL26_V1R62_vote_descriptive_rank_checks.csv':csvstr(result,list(result[0])),\n 'CAL26_V1R62_voter_disjoint_preference_sensitivity_NOT_FV.csv':csvstr(voterfit,list(voterfit[0])),\n 'CAL26_V1R62_decision.md':'\\n'.join(prose)}\n for f,s in artifacts.items():(args.out/f).write_text(s,encoding='utf8')\n manifestout['output_sha256']={f:sha(s.encode()) for f,s in artifacts.items()}\n (args.out/'CAL26_V1R62_manifest.json').write_text(json.dumps(manifestout,sort_keys=True,indent=2)+'\\n')\n print(json.dumps({'status':manifestout['semantic_status'],'n_players':len(out),'eligible':149,'QB_priors':28,'trade_audit':tradeaudit,'votes':voteinfo,'production_change_authorized':False}))\n\ndef selftest():\n need(quantile([10,20,30],0.5)==20,'QUANTILE_MEDIAN')\n need(ranked_fraction(2,[1,2,3])==.5,'RANK')\n need(norm('Ja’Marr Chase')=='jamarr chase','NORMALIZATION')\n need(not yes('False') and yes('True'),'YES_NO')\n print('R62_SELFTEST_GREEN')\n\nif __name__=='__main__':\n ap=argparse.ArgumentParser();ap.add_argument('--inputs',type=pathlib.Path);ap.add_argument('--repo',type=pathlib.Path);ap.add_argument('--out',type=pathlib.Path);ap.add_argument('--fixture',action='store_true');ap.add_argument('--selftest',action='store_true');a=ap.parse_args()\n if a.selftest:selftest()\n else:\n  need(a.inputs and a.repo and a.out,'REQUIRED_ARG_MISSING');run(a)\nPY_CAL26_V1R62_ENGINE\npython -m py_compile \"$RUNNER_TEMP/CAL26_V1R62_engine.py\"\npython \"$RUNNER_TEMP/CAL26_V1R62_engine.py\" --selftest\npython \"$RUNNER_TEMP/CAL26_V1R62_engine.py\" \\\n --inputs \"$RUNNER_TEMP/cal26-r62-inputs\" \\\n --repo \"$GITHUB_WORKSPACE\" \\\n --out \"$RUNNER_TEMP/cal26-r62-output\"\npython - \"$RUNNER_TEMP/cal26-r62-output\" <<'PY_CAL26_V1R62_VERIFY'\nimport csv,hashlib,json,pathlib,sys\np=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_V1R62_manifest.json').read_text())\nassert m['semantic_status']=='EMPIRICAL_RANKING_AND_MARKET_SHAPE_BRIDGE__CARDINAL_FV_NOT_IDENTIFIED__HOLD'\nassert m['n_players']==518 and m['n_horizon_eligible']==149 and m['n_QB_priors_scored']==28\nassert m['repo_git_blob_pins_verified'] and m['artifact_sha256_pins_verified']\nassert m['arbitrary_15x_20x_25x_pricing_not_used'] and not m['calibrated_cardinal_FV_scale_identified']\nassert not m['production_change_authorized'] and not m['index_html_modified'] and m['frozen_values_preserved']==549\nassert m['no_2026_week7_plus_read'] and m['no_protected_2026_weeks8_12_read']\nfor name,h in m['output_sha256'].items():assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h,name\nr=list(csv.DictReader((p/'CAL26_V1R62_518_evidence_rank_market_shape_NOT_FV.csv').open()))\nassert len(r)==518 and sum(x['QB_historical_week6_feature_gate'].startswith('R56_PRIOR') for x in r)==28\nassert all(x['production_change_authorized']=='False' for x in r)\nprint('CAL26_V1R62_RESEARCH_EVIDENCE_PASS__FV_HOLD')\nPY_CAL26_V1R62_VERIFY\ntest -z \"$(git status --porcelain)\"\ncat \"$RUNNER_TEMP/cal26-r62-output/CAL26_V1R62_decision.md\" >> \"$GITHUB_STEP_SUMMARY\"\n"
