name: A-FA22R1 - Private 4for4 Weekly IDP Waiver Finder

# Add one browser-local CSV importer to Targets; no subscriber data in source control.
# PREVIEW creates a temporary checkout, runs browser QA, and never pushes.
# APPLY repeats every test, then commits only HTML + two new public code assets.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first; apply only after successful preview'
        required: true
        type: choice
        default: preview
        options: [preview, apply]

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  fa22-private-weekly:
    name: Private 4for4 weekly waiver finder (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install SHA-pinned FA22 code in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64,hashlib,zlib
          modules = {'assets/fa_4for4_waiver_v1.js': {'sha256': '35edef1c4ec226027a887658c2f625259b3c4ee55135cfc36d367fc97768784d', 'zlib_b64': ''}, 'assets/fa_4for4_waiver_v1.css': {'sha256': '66b4c2fd463d20ebcb8d89018895bee29421d4a585ab457cfab9603afd18fa24', 'zlib_b64': ''}}
          page=Path('free-agent-board.html')
          assert page.is_file(),'Free Agent Board entry point missing'
          h=page.read_text('utf-8')
          for token in ['FA_WORKSPACE_V1_SCRIPT','FA_EXPERIENCE_V3_SCRIPT','FA_EXPERIENCE_V3_STYLE']:
              assert h.count(token)==1, f'Missing/duplicate existing workspace integration: {token}'
          assert '<div id="fa-ws-idp-panel"' not in h or 'FA_WORKSPACE_V1_SCRIPT' in h
          style_line='<!-- FA22_4FOR4_PRIVATE_STYLE --><link rel="stylesheet" href="assets/fa_4for4_waiver_v1.css?v=1">'
          script_line='<!-- FA22_4FOR4_PRIVATE_SCRIPT --><script src="assets/fa_4for4_waiver_v1.js?v=1" defer></script>'
          assert h.count('FA22_4FOR4_PRIVATE_STYLE')<=1 and h.count('FA22_4FOR4_PRIVATE_SCRIPT')<=1,'Conflicting FA22 loader'
          for path,rec in modules.items():
              dest=Path(path)
              contents=zlib.decompress(base64.b64decode(rec['zlib_b64']))
              assert hashlib.sha256(contents).hexdigest()==rec['sha256'],f'Embedded asset corrupt: {path}'
              if dest.exists():
                  assert dest.read_bytes()==contents,f'Existing FA22 asset differs: {path}. Review required.'
              else:
                  dest.parent.mkdir(exist_ok=True,parents=True)
                  dest.write_bytes(contents)
                  print('Added',path)
          if 'FA22_4FOR4_PRIVATE_STYLE' not in h:
              assert h.count('</head>')==1,'Cannot locate head insertion point'
              h=h.replace('</head>',style_line+'\n</head>',1)
          if 'FA22_4FOR4_PRIVATE_SCRIPT' not in h:
              assert h.count('</body>')==1,'Cannot locate script insertion point'
              h=h.replace('</body>',script_line+'\n</body>',1)
          assert h.count('FA22_4FOR4_PRIVATE_STYLE')==1 and h.count('FA22_4FOR4_PRIVATE_SCRIPT')==1
          page.write_text(h,'utf-8')
          print('PASS: FA22 installed without modifying original ranking or data modules')
          PYCODE

      - name: Validate JS, restricted diff and privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_4for4_waiver_v1.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          js=Path('assets/fa_4for4_waiver_v1.js').read_text('utf-8')
          h=Path('free-agent-board.html').read_text('utf-8')
          for forbidden in ['localStorage','indexedDB','XMLHttpRequest','sendBeacon','api.4for4.com']:
              assert forbidden not in js, f'Unexpected private storage/network operation: {forbidden}'
          assert js.count('fetch(')==2, 'Unexpected remote request in private importer'
          assert 'data/free_agents.json' in js and 'data/idp_ros_2026_w09.json' in js
          assert 'file.text()' in js, 'No browser-local input parser'
          assert 'FA22_4FOR4_PRIVATE_SCRIPT' in h and 'FA22_4FOR4_PRIVATE_STYLE' in h
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'free-agent-board.html','assets/fa_4for4_waiver_v1.js','assets/fa_4for4_waiver_v1.css'}
          assert (changed|untracked).issubset(allowed),f'Forbidden changes: {(changed|untracked)-allowed}'
          assert not any(p.startswith('data/') for p in changed|untracked)
          assert subprocess.run(['git','diff','--quiet','--','index.html','data/','assets/fa_start_sit_v1.js','assets/idp_intel_v1.js']).returncode==0
          print('PASS: restricted presentation change, private CSV not published')
          PYCODE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium browser QA dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Test real board with synthetic IDP projections
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fa22_browser_qa.py <<'PYCODE'
          """A-FA22R1 browser checks. Only synthetic projections; no subscriber data in CI."""
          import json, os, traceback
          from pathlib import Path
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright

          ROOT=Path.cwd().resolve()
          OUT=ROOT/'fa22-qa-artifacts'
          OUT.mkdir(exist_ok=True)
          FA={'synced_at':1794604100.0,'league_id':'test-synthetic','count':3,'free_agents':[
              {'player_id':'FA22_TEST_1','name':'QA Synthetic Linebacker','team':'TEN','pos':'LB','raw_position':'LB','age':24,'status':'Active'},
              {'player_id':'FA22_TEST_2','name':'QA Synthetic Pass Rusher','team':'HOU','pos':'DL','raw_position':'DE','age':27,'status':'Active'},
              {'player_id':'FA22_TEST_3','name':'QA Synthetic Safety','team':'ARI','pos':'DB','raw_position':'S','age':23,'status':'Active'}]}
          ROS={'schema_version':1,'rank_policy':'FROZEN_SCREENSHOT_DISPLAY_ONLY','records':[
              {'sleeper_id':'FA22_TEST_1','group':'LB','team':'TEN','rank':23}]}
          CSV=('Player,Team,Opp,Position,FF Pts,Snap %,Tackles,Assists,Sacks\n'
              'QA Synthetic Linebacker,TEN,NE,LB,13.8,98,6.1,3.2,0.1\n'
              'QA Synthetic Pass Rusher,HOU,JAX,EDGE,11.5,88,3.1,0.2,1.3\n'
              'QA Synthetic Safety,ARI,SEA,S,9.2,95,4.2,1.2,0\n')
          class Handler(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Handler,directory=str(ROOT)))
          Thread(target=server.serve_forever,daemon=True).start()
          URL=f'http://127.0.0.1:{server.server_port}/free-agent-board.html'

          def remote(route):
              url=route.request.url
              if 'data/free_agents.json' in url:
                  body=json.dumps(FA)
              elif 'data/idp_ros_2026_w09.json' in url:
                  body=json.dumps(ROS)
              elif 'raw.githubusercontent.com' in url:
                  route.fulfill(status=404,body='{}',headers={'access-control-allow-origin':'*','content-type':'application/json'});return
              else:
                  route.abort();return
              route.fulfill(status=200,body=body,headers={'access-control-allow-origin':'*','content-type':'application/json'})

          results=[]
          try:
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width in (320,360,390,430,768,1280):
                context=browser.new_context(viewport={'width':width,'height':900})
                page=context.new_page()
                page.route('https://**/*',remote)
                requests=[]
                page.on('request',lambda req: requests.append((req.method,req.url)) if req.method not in ('GET','HEAD') else None)
                page.goto(URL,wait_until='domcontentloaded',timeout=45000)
                page.locator('#fa22WaiverLab').wait_for(state='attached',timeout=20000)
                assert page.locator('#fa-ws-idp-panel').count()==1
                assert page.locator('#faWorkspaceNav').count()==1
                assert page.locator('[data-fa-workspace]').count()==5
                assert page.locator('.fa22-player').count()==0
                assert page.locator('input#fa22Files').get_attribute('type')=='file'
                # The website has an intentional password gate. Only the test harness hides it.
                page.evaluate("""() => {document.body.classList.remove('free-agent-locked');
                  document.getElementById('freeAgentPasswordGate').style.display='none';
                  document.getElementById('fa-ws-idp-tab').click();}""")
                assert page.locator('#fa-ws-idp-panel').is_visible()
                host=page.locator('#fa22WaiverLab')
                assert page.evaluate("""() => {const el=document.getElementById('fa22WaiverLab');
                  return el.getBoundingClientRect().right <= window.innerWidth + 1 && el.scrollWidth <= el.clientWidth + 2;}"""),f'FA22 card overflows at {width}px'
                page.locator('#fa22Week').fill('11')
                page.locator('#fa22Scoring').select_option('log')
                page.locator('#fa22Files').set_input_files({'name':'qa_weekly_11.csv','mimeType':'text/csv','buffer':CSV.encode()})
                page.locator('#fa22Import').click()
                page.wait_for_function("document.getElementById('fa22Status').textContent.includes('3 matched')",timeout=18000)
                assert page.locator('.fa22-player').count()==3
                assert 'LB #23' in page.locator('#fa22List').inner_text()
                assert '13.8' in page.locator('#fa22List').inner_text()
                page.locator('#fa22Group').select_option('DB')
                assert page.locator('.fa22-player').count()==1
                page.locator('#fa22Group').select_option('ALL')
                page.locator('#fa22Focus').select_option('young')
                assert page.locator('.fa22-player').count()==2
                page.locator('#fa22Focus').select_option('week')
                page.locator('#fa22Week').fill('12')
                page.locator('#fa22Week').dispatch_event('change')
                assert page.locator('.fa22-player').count()==0,'Stale source remained visible after week edit'
                assert page.locator('#fa22Results').is_hidden()
                # Fail-closed: a season table with a Bye column is not a valid weekly projection.
                bad='Player,Team,Bye,Position,FF Pts,Opp\nQA Synthetic Linebacker,TEN,11,LB,200.0,NE\n'
                page.locator('#fa22Files').set_input_files({'name':'season.csv','mimeType':'text/csv','buffer':bad.encode()})
                page.locator('#fa22Import').click()
                page.wait_for_function("document.getElementById('fa22Status').textContent.includes('Import not completed')")
                assert page.locator('#fa22Results').is_hidden()
                assert not requests, f'Unexpected outbound request: {requests}'
                if width in (360,1280):page.screenshot(path=str(OUT/f'FA22-synthetic-{width}px.png'),full_page=False)
                results.append({'viewport':width,'status':'PASS','synthetic_matched':3,'non_get_requests':len(requests)})
                context.close()
              browser.close()
          finally:
            server.shutdown()
          (OUT/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          print('FA22 browser QA passed: '+json.dumps(results))
          PYCODE
          python /tmp/fa22_browser_qa.py

      - name: Upload synthetic QA screenshots (no subscriber data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA22R1-Synthetic-Browser-QA
          path: fa22-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preview mode confirmation
        if: inputs.mode == 'preview'
        run: |
          echo 'PASS: Preview only. No code committed or deployed.'
          git status --short

      - name: Apply source-only changes after all QA gates
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html assets/fa_4for4_waiver_v1.js assets/fa_4for4_waiver_v1.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'FA22 already installed; nothing to commit.'
          else
            git commit -m 'FA22: add local 4for4 weekly IDP waiver finder'
            git push origin HEAD:main
          fi
