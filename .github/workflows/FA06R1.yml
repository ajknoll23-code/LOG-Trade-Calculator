name: A - FA06R1 Fixed Sleeper-ID Early Rising Usage Watch (Read Only)

# Reproducible W5-7 research only. Downloads and hash-verifies FA05R1's saved
# GitHub artifact, instead of fetching mutable Sleeper weekly data a second time.
# No model, board, FV, MV or league write. No breakout probabilities.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a-fa06r1-fixed-evidence-readonly
  cancel-in-progress: false

jobs:
  evidence-watch:
    name: Build factual player watchlist from immutable FA05R1 research artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main (no write credentials)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen availability input and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git hash-object research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json)" = "75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5"

      - name: Download FA05R1 fixed research artifact (same evidence, no new stats)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/a-fa06r1
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          gh run download 40555331141 --repo "$GITHUB_REPOSITORY" --name A_FA05R1_STABLE_SLEEPER_WEEKLY_COVERAGE --dir "$REPORT_DIR"
          test -s "$REPORT_DIR/A_FA05R1_2026W09_direct_sleeper_coverage.csv"
          test -s "$REPORT_DIR/A_FA05R1_report.json"
          echo 'PASS fixed FA05R1 artifact downloaded'

      - name: Make factual age, position and usage evidence watchlists
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/a-fa06r1
          FA05_SOURCE_DIR: ${{ runner.temp }}/a-fa06r1
        run: |
          set -euo pipefail
          cat > "$REPORT_DIR/A_FA06R1_engine.py" <<'PYCODE'
          #!/usr/bin/env python3
          """FA06R1: reproducible descriptive Sleeper-ID, 2026 W5-7 FA evidence screen.
          No prediction, ranking release or dynasty value changes. Does not use future outcomes.
          """
          import csv
          import hashlib
          import json
          import os
          import sys
          from collections import Counter,defaultdict
          from datetime import datetime,timezone
          from pathlib import Path

          FROZEN_PATH=Path('research/free-agent-opportunity/prospective-snapshots/2026-10-27T16-07-46Z_2026W09.json')
          FROZEN_GIT_SHA='75e4b907de655b1d47ff9c3721cbc2b8e69bd0b5'
          FA05_CSV_SHA='34be5855924f7f6a11ab4f00ebe8766499a1b037816a268c25938a8adcb22fd9'
          FA05_REPORT_SHA='75e7b9e60232b4add5d371c1073771e9e94b23d9ab1bf10813c654761734911f'
          EXPECTED_RUN=40555331141
          POS=('QB','RB','WR','TE','DL','LB','DB')


          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def as_num(value):
              if value in ('',None,'None'): return None
              try:
                  x=float(value)
                  if not (-1e12 < x < 1e12):return None
                  return x
              except (TypeError,ValueError):return None

          def positive(record,field,minval):
              x=as_num(record.get('w7_'+field))
              return x is not None and x >= minval

          def evidence(record):
              pos=record['pos']
              metrics=[]
              if pos=='QB': spec=[('pass_attempts',10)]
              elif pos=='RB':spec=[('carries',4),('targets',3)]
              elif pos in ('WR','TE'):spec=[('targets',3)]
              elif pos=='DL':spec=[('solo_tackles',2),('quarterback_hits',1),('sacks',1)]
              elif pos=='LB':spec=[('solo_tackles',3),('quarterback_hits',1),('sacks',1)]
              else:spec=[('solo_tackles',3),('pass_defenses',1)]
              for field,threshold in spec:
                  if positive(record,field,threshold):
                      metrics.append(f'{field}={as_num(record["w7_"+field]):g}')
              return metrics

          def calculate(data,frozen,source):
              assert isinstance(data,list) and len(data)==1607,'FA05R1 row count changed'
              assert isinstance(frozen['players'],list) and len(frozen['players'])==1607
              assert source['completed_data_weeks']==[5,6,7], 'Unexpected source weeks'
              assert source['waiver_freeze_git_blob']==FROZEN_GIT_SHA,'Source from wrong frozen pool'
              assert source['classification']=='RESEARCH_COVERAGE_ONLY_NOT_BREAKOUT_PREDICTION'
              assert source['predictive_edge_established'] is False
              assert source['with_any_weekly_stat_row']==1409
              assert source['with_all_three_weekly_stat_rows']==837
              ids=[str(x['player_id']) for x in data]
              assert len(ids)==len(set(ids))
              frozen_ids={str(x['player_id']):x for x in frozen['players']}
              assert set(ids)==set(frozen_ids),'FA05R1 CSV differs from FA03 frozen pool'
              by_position=defaultdict(Counter)
              output=[]
              for r in data:
                  sid=str(r['player_id']);f=frozen_ids[sid];p=r['pos']
                  assert p in POS and p==f['pos']
                  assert r['name']==f['name'],f'Frozen ID identity changed: {sid}'
                  family='defensive_snaps' if p in ('DL','LB','DB') else 'offensive_snaps'
                  w={k:as_num(r.get(f'w{k}_{family}')) for k in (5,6,7)}
                  played={k:as_num(r.get(f'w{k}_gp_reported')) for k in (5,6,7)}
                  eligible=all(w[k] is not None and played[k] is not None and played[k]>=1 for k in (5,6,7))
                  delta=round(w[7]-(w[5]+w[6])/2,2) if eligible else None
                  rise=eligible and delta>=10 and w[7]>=15
                  young=r['young_factual_screen']=='True'
                  support=evidence(r) if eligible else []
                  if rise:
                      tier=('YOUNG_RISING_WITH_WEEK7_VOLUME' if young else 'VETERAN_RISING_WITH_WEEK7_VOLUME') if support else ('YOUNG_RISING_SNAP_COUNT_ONLY' if young else 'VETERAN_RISING_SNAP_COUNT_ONLY')
                  elif not eligible: tier='INSUFFICIENT_THREE_WEEK_SNAP_EVIDENCE'
                  else: tier='NO_QUALIFYING_SNAP_COUNT_RISE'
                  row={'player_id':sid,'name':r['name'],'pos':p,'team_at_freeze':r['team_at_freeze'],
                       'age_at_freeze':r['age_at_freeze'],'years_exp_at_freeze':r['years_exp_at_freeze'],
                       'v1_rank_within_position':r['v1_rank_within_position'],
                       'frozen_dynasty_stash_factual_flag':r['factual_stash_flag'],
                       'young_screen_age26_exp3':young,'completed_w5_w7_snaps_and_gp':eligible,
                       'week5_snap_count':w[5],'week6_snap_count':w[6],'week7_snap_count':w[7],
                       'pre_week7_mean_snap_count':round((w[5]+w[6])/2,2) if eligible else None,
                       'week7_minus_w5w6_mean_snaps':delta,
                       'week7_supporting_stat_fields':';'.join(support),
                       'supporting_volume_observed':len(support)>0,'watch_category':tier,
                       'classification':'DESCRIPTIVE_W5_W7_ONLY_NOT_A_PREDICTIVE_RANK_OR_ADD_RECOMMENDATION'}
                  output.append(row)
                  c=by_position[p];c['available']+=1;c['three_week_played_snap_coverage']+=int(eligible)
                  c['snap_count_rises']+=int(rise);c['young_rises']+=int(rise and young)
                  c['young_rises_with_support']+=int(rise and young and bool(support))
              assert sum(v['available'] for v in by_position.values())==1607
              assert sum(v['three_week_played_snap_coverage'] for v in by_position.values())>0
              assert all(not x['completed_w5_w7_snaps_and_gp'] or x['week7_minus_w5w6_mean_snaps'] is not None for x in output)
              selections=[x for x in output if 'RISING' in x['watch_category']]
              def sort(x):
                  return (x['pos'], not x['young_screen_age26_exp3'],not x['supporting_volume_observed'],
                          -(x['week7_minus_w5w6_mean_snaps'] or 0),x['name'],x['player_id'])
              return output,sorted(selections,key=sort),dict(by_position)

          def selftest():
              fake={'pos':'WR','w5_targets':'2','w6_targets':'','w7_targets':'7','w5_offensive_snaps':'33','w6_offensive_snaps':'28','w7_offensive_snaps':'56','w5_gp_reported':'1.0','w6_gp_reported':'1','w7_gp_reported':'1'}
              assert evidence(fake)==['targets=7']
              assert as_num('') is None and as_num('0.0')==0 and as_num('x') is None
              assert not positive(fake,'carries',0), 'Missing metric must NOT be an observed zero'
              assert float(fake['w7_offensive_snaps'])-(float(fake['w5_offensive_snaps'])+float(fake['w6_offensive_snaps']))/2==25.5
              print('PASS FA06R1 synthetic exact raw-count delta, missing-vs-zero and supporting-stat guards')

          def main():
              if '--selftest' in sys.argv:return selftest()
              p=Path(os.environ['REPORT_DIR']);p.mkdir(exist_ok=True,parents=True)
              fpath=Path(os.environ.get('FA05_SOURCE_DIR',str(p)))
              fcsv=fpath/'A_FA05R1_2026W09_direct_sleeper_coverage.csv'
              fj=fpath/'A_FA05R1_report.json'
              assert sha(fcsv)==FA05_CSV_SHA,'FA05 CSV hash changed; fail closed'
              assert sha(fj)==FA05_REPORT_SHA,'FA05 report hash changed; fail closed'
              # The Git blob check is performed separately using git hash-object; don't use hashlib for it.
              frozen=json.loads(FROZEN_PATH.read_text(encoding='utf-8'))
              assert frozen['classification']=='PROSPECTIVE_CURRENT_AVAILABILITY_CAPTURE_NOT_PREDICTION'
              source=json.loads(fj.read_text())
              with fcsv.open(newline='',encoding='utf-8') as fl: data=list(csv.DictReader(fl))
              rows,selected,summary=calculate(data,frozen,source)
              cats=Counter(x['watch_category'] for x in rows)
              report={'study':'A-FA06R1 Fixed FA05R1 stable-ID 2026 Week5-7 descriptive usage watch',
                  'status':'FIXED_SOURCE_DESCRIPTIVE_WATCH_PASS',
                  'classification':'DESCRIPTIVE_SNAP_COUNT_EVIDENCE_NOT_BREAKOUT_PREDICTION',
                  'source_workflow_run':EXPECTED_RUN,
                  'source_csv_sha256':FA05_CSV_SHA,'source_report_sha256':FA05_REPORT_SHA,
                  'source_free_agent_frozen_git_blob':FROZEN_GIT_SHA,
                  'generated_at_utc':datetime.now(timezone.utc).isoformat(),
                  'feature_weeks':[5,6,7], 'future_week8_or_week9_used':False,
                  'thresholds_are_illustrative_not_validated':{'week7_snap_increase_over_w5_w6_avg_min_count':10,'week7_min_snap_count':15,'full_three_week_played_and_snap_count_required':True},
                  'by_position':summary,'category_counts':dict(cats),
                  'selected_rows':len(selected),
                  'snapshot_coverage_stable':len(rows)==1607,
                  'warning':'Snap counts, not snap shares: week-to-week team play totals are not normalized. Requires team denominator to compute opportunity %.',
                  'other_limits':['The Week 7 volume supporting flag checks only listed reported statistical categories; missing keys remain unknown, not zero.',
                      'A 2026 week7 observation was assembled after games, not frozen before Week 7.',
                      'Active NFL-team injury/news and current waiver statuses may differ from Week 9 frozen cache.',
                      'The 2026 Week 9 prospective waiver cache does not establish pre-Week 7 availability.',
                      'Some positions in the Sleeper RB bucket may be fullbacks or special teams contributors; verify roles before pickups.',
                      'Does not establish predictive accuracy, fantasy outcome gain or increase in dynasty value.',
                      'No scoring FV, MV, Team Utility, release, production board or live roster changes authorized.'],
                  'production_changes_authorized':False,'predictive_edge_established':False}
              (p/'A_FA06R1_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              keys=list(rows[0])
              for fname,coll in [('A_FA06R1_all_waivers.csv',rows),('A_FA06R1_rising_usage_watch.csv',selected)]:
                  with (p/fname).open('w',newline='',encoding='utf-8') as fh:
                      w=csv.DictWriter(fh,fieldnames=keys);w.writeheader();w.writerows(coll)
              lines=['# A - FA06R1: Fixed-source Sleeper-ID Rising Usage Watch', '',
                '**Result:** source-pinned **descriptive observations only**, not breakout probabilities or add recommendations.', '',
                f"FA05R1 GitHub source run: {EXPECTED_RUN}. Frozen 2026 Week 9 waiver snapshot: {len(rows)} players.",
                'W5-W6 mean compared with W7. Counts are **actual reported offensive/defensive snaps**, not percent shares.',
                'Missing stats remain unknown; all three weeks require `gp>=1` and numeric relevant snap counts.',
                '', '| Pos | FA pool | Three-week real snaps | Rises | Young rises | Young + W7 supporting stats |',
                '|---|---:|---:|---:|---:|---:|']
              for pos in POS:
                  c=summary[pos]
                  lines.append(f"| {pos} | {c['available']} | {c['three_week_played_snap_coverage']} | {c['snap_count_rises']} | {c['young_rises']} | {c['young_rises_with_support']} |")
              for pos in POS:
                  matches=[x for x in selected if x['pos']==pos]
                  if not matches:continue
                  lines += ['',f'## {pos}: rises from three observed played weeks','', '| Player | Age | W5 | W6 | W7 | W7 change vs W5–6 mean | W7 supporting volume |', '|---|---:|---:|---:|---:|---:|---|']
                  for x in matches[:15]:
                      lines.append(f"| {x['name']} | {x['age_at_freeze'] or '?'} | {x['week5_snap_count']:g} | {x['week6_snap_count']:g} | {x['week7_snap_count']:g} | +{x['week7_minus_w5w6_mean_snaps']:g} | {x['week7_supporting_stat_fields'] or 'not confirmed'} |")
              lines+=['','## Limitations','']+['- '+s for s in [report['warning']]+report['other_limits']]
              lines+=['','**Next test:** Recalculate with fresh W8 data once available, then preserve as-of signals for future 1/2/4-week fantasy outcomes and availability.', '']
              (p/'A_FA06R1_report.md').write_text('\n'.join(lines),encoding='utf-8')
              print(f"FA06R1 DESCRIPTIVE WATCH PASS: {len(rows)} waivers; {sum(v['three_week_played_snap_coverage'] for v in summary.values())} 3-week confirmed snap players; {len(selected)} rises; {sum(v['young_rises_with_support'] for v in summary.values())} young rises with W7 volume support")

          if __name__=='__main__':main()
          PYCODE
          python3 "$REPORT_DIR/A_FA06R1_engine.py" --selftest
          python3 "$REPORT_DIR/A_FA06R1_engine.py"
          test -z "$(git status --porcelain)"
          python3 -m json.tool "$REPORT_DIR/A_FA06R1_report.json" >/dev/null

      - name: Upload watchlist and full audit (read-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_FA06R1_FIXED_SOURCE_WEEK7_RISING_USAGE_WATCH
          path: |
            ${{ runner.temp }}/a-fa06r1/A_FA06R1_report.md
            ${{ runner.temp }}/a-fa06r1/A_FA06R1_report.json
            ${{ runner.temp }}/a-fa06r1/A_FA06R1_rising_usage_watch.csv
            ${{ runner.temp }}/a-fa06r1/A_FA06R1_all_waivers.csv
          if-no-files-found: warn
          retention-days: 90
