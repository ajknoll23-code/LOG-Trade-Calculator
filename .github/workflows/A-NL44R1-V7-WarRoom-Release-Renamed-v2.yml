          echo "8e1dbe762d597e27ee382c8365953ed7ebd96d458167e7565a10a34ef4d38b9e  data/newsletters/v7_frozen_week8.json" | sha256sum -c -
          echo "3afdfd5680e1da864073b5fc19a9d2c096f9c15e5d3abe94f325f65e1f340228  data/newsletters/power_model_policy.json" | sha256sum -c -
