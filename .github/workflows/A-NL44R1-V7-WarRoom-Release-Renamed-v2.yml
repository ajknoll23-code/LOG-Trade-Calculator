      - name: Resolve or build exact-week approved NL39 source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_nl39_run_id }}
          WAR_WEEK: ${{ inputs.war_week }}
        run: |
          set -euo pipefail
          python3 - <<'NL44_SOURCE'
          from __future__ import annotations
          import json,os,re,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          week=int(os.environ['WAR_WEEK'])
          supplied=os.environ['SOURCE_RUN'].strip()
          if week not in range(9,19):raise RuntimeError('V7 production edition supports War Room Weeks 9–18')
          if supplied and not supplied.isdecimal():raise RuntimeError('Source NL39 run ID must be numeric')
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'LOG-NL44R1-V7-Release'}
          api='https://api.github.com/repos/'+repo
          path='.github/workflows/A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml'
          def github(method,endpoint,payload=None):
              raw=json.dumps(payload).encode() if payload is not None else None
              hs=dict(headers)
              if raw is not None: hs['Content-Type']='application/json'
              req=urllib.request.Request(api+endpoint,method=method,data=raw,headers=hs)
              with urllib.request.urlopen(req,timeout=30) as res:
                  body=res.read();return json.loads(body) if body else None
          def matches(row):
              title=str(row.get('display_title') or row.get('name') or '')
              return (row.get('path')==path and row.get('head_branch')=='main' and
                      row.get('event')=='workflow_dispatch' and
                      bool(re.search(r'\bW0?'+str(week)+r'\b',title,re.I)))
          def ready(row):return matches(row) and row.get('status')=='completed' and row.get('conclusion')=='success'
          if supplied:
              source=github('GET','/actions/runs/'+str(int(supplied)))
              if not ready(source):raise RuntimeError('Selected NL39 run failed exact-week approval checks')
          else:
              path_q='/actions/workflows/A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml/runs?event=workflow_dispatch&branch=main&per_page=70'
              listed=github('GET',path_q)
              successes=[r for r in listed.get('workflow_runs',[]) if ready(r)]
              source=max(successes,key=lambda r:int(r['id'])) if successes else None
              if source is None:
                  in_progress=[r for r in listed.get('workflow_runs',[]) if matches(r) and r.get('status')!='completed']
                  if in_progress:
                      raise RuntimeError('Matching NL39 source already running; run NL44 again when NL39 is green')
                  if week==9:
                      raise RuntimeError('No successful archived Week 9 NL39 source; refuse to regenerate Week 9 with hindsight')
                  req=urllib.request.Request('https://api.sleeper.app/v1/state/nfl',headers={'User-Agent':'LOG-NL44R1-V7'})
                  with urllib.request.urlopen(req,timeout=25) as res:state=json.load(res)
                  if str(state.get('season'))!='2026' or int(state.get('week') or 0)<week:
                      raise RuntimeError(f'Sleeper has not advanced to Week {week}: {state}')
                  before={int(r['id']) for r in listed.get('workflow_runs',[])}
                  print(f'Dispatching existing approved NL39 for Week {week}; immutable V7 remains locked',flush=True)
                  github('POST','/actions/workflows/A-NL39R1-Weekly-Newsletter-Integration-Shadow.yml/dispatches',
                         {'ref':'main','inputs':{'war_week':str(week),'reuse_nl36_run_id':''}})
                  start=time.monotonic();source=None
                  while time.monotonic()-start<18*60:
                      newer=github('GET',path_q)
                      candidates=[r for r in newer.get('workflow_runs',[]) if matches(r) and int(r['id']) not in before]
                      if len(candidates)>1:raise RuntimeError('Ambiguous matching NL39 runs, refusing to select one')
                      if candidates:
                          candidate=candidates[0]
                          if candidate.get('status')=='completed':
                              if candidate.get('conclusion')!='success':raise RuntimeError('NL39 failed; cannot make production V7 release')
                              source=candidate;break
                      time.sleep(8)
                  if source is None:raise RuntimeError('NL39 generation not complete by conservative deadline')
          rid=int(source['id'])
          artifact_list=github('GET',f'/actions/runs/{rid}/artifacts?per_page=100')
          expected=f'LOG-NL39R1-Weekly-Newsroom-Shadow-{rid}'
          found=[a for a in artifact_list.get('artifacts',[]) if a.get('name')==expected and not a.get('expired')]
          if len(found)!=1:raise RuntimeError('Missing unique exact source NL39 artifact')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:out.write(f'source_run_id={rid}\n')
          print(f'PASS: approved source NL39 run {rid}; artifact {found[0]["id"]}',flush=True)
          NL44_SOURCE
      - name: Download exact-week source newsletter PDF
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL39R1-Weekly-Newsroom-Shadow-${{ steps.source.outputs.source_run_id }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: nl39_source
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF runtime
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5'
      - name: Verify permanent V7 approval and immutable Week 8 foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'NL44_APPROVAL'
          from pathlib import Path
          import hashlib,json,math
          policy=json.loads(Path('data/newsletters/power_model_policy.json').read_text())
          w={'season_scoring':.35,'all_play':.20,'recent_scoring':.10,'scoring_floor':.25,'h2h':.10}
          assert policy['production_power_formula']=='V7' and policy['policy']=='OWNER_APPROVED_PRODUCTION'
          assert policy['weights']==w and math.isclose(sum(w.values()),1.,abs_tol=1e-12)
          expected='8e1dbe762d597e27ee382c8365953ed7ebd96d458167e7565a10a34ef4d38b9e'
          actual=hashlib.sha256(Path('data/newsletters/v7_frozen_week8.json').read_bytes()).hexdigest()
          if actual!=expected:raise RuntimeError('V7 Week 1-8 reference changed; abort release')
          print('PASS: frozen production V7 weights and 2026 through-Week-8 evidence')
          NL44_APPROVAL
      - name: Render and verify one share-ready War Room V7 newsletter
        shell: bash
        env:
          WAR_WEEK: ${{ inputs.war_week }}
        run: |
          set -euo pipefail
          W2=$(printf '%02d' "$WAR_WEEK")
          INPUT="nl39_source/LOG-NL39R1-WarRoom-W${W2}-Weekly-Integration-Shadow.pdf"
          test -s "$INPUT"
          mkdir -p "$RUNNER_TEMP/log-v7-release"
          args=()
          if [ "$WAR_WEEK" -gt 9 ]; then args+=(--fetch-live); fi
          python3 scripts/newsletters/v7_newsletter_release.py \
            --history data/newsletters/v7_frozen_week8.json \
            --original "$INPUT" \
            --output "$RUNNER_TEMP/log-v7-release/LOG-W${W2}-War-Room-V7-Final.pdf" \
            --evidence "$RUNNER_TEMP/log-v7-release/LOG-W${W2}-V7-Evidence.json" \
            --war-week "$WAR_WEEK" "${args[@]}"
          cp data/newsletters/power_model_policy.json "$RUNNER_TEMP/log-v7-release/V7-PRODUCTION-FORMULA.json"
          echo "PASS: V7 production PDF available for group-chat sharing"
      - name: Upload only production newsletter and reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: LOG-W${{ inputs.war_week }}-V7-WarRoom-RELEASE-${{ github.run_id }}
          path: ${{ runner.temp }}/log-v7-release/
          retention-days: 90
          if-no-files-found: error
      - name: Production release summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NL44_SUMMARY'
          ## V7 War Room — production edition
          - V7 high scoring floor = 35% season scoring, 20% all-play, 10% recent scoring, 25% scoring floor, 10% H2H.
          - Separately reports actual H2H, median, combined records, points scored, and weekly V7 rank movement.
          - Preserves the six approved NL39 matchup articles and removes shadow-only production metadata.
          - This output is a share-ready PDF artifact only. No email, release publication, or picks archive.
          - Current editorial source remains unchanged; calculator valuations and private free agent board untouched.
          - V7 remains research-exploratory in predictive-evidence terms, though now owner-approved for newsletter display.
          NL44_SUMMARY
