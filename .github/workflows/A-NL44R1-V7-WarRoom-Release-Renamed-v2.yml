      war_week:
        description: War Room week; Week 9 reissue uses completed Weeks 1-8
        required: true
        type: string
        default: '9'
      source_nl39_run_id:
        description: Optional completed NL39 run ID for exactly this week; blank auto-selects or generates
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: write
concurrency:
  group: log-nl44r1-v7-production-${{ inputs.war_week }}
  cancel-in-progress: false
