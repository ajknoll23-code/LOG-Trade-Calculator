name: Team Field Refresh

# Fetches live Sleeper player data (same endpoint, same 20-hour cache
# convention as sync_sleeper.py) and generates a fresh team lookup, per
# item #6 on the four-AI-review priority list. Output is a JSON file to
# upload back for baking into index.html as a new PLAYER_TEAM constant --
# matches this project's established pattern of Claude performing the
# actual index.html edit in-session rather than a script doing it
# autonomously.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test before trusting real output
        run: python3 scripts/team_field_refresh_pipeline.py --selftest

      - name: Run the refresh (fetches live Sleeper data or reuses a fresh cache)
        run: python3 scripts/team_field_refresh_pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/player_team_refresh.json data/players_cache.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Refresh player team data from live Sleeper pool"
          git push
