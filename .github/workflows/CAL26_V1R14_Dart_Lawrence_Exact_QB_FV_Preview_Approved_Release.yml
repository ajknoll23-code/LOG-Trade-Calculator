name: CAL26 V1R14 - Two Correct Rated QB Prices Preview or Approved Production Release
'on':
  workflow_dispatch:
    inputs:
      release_mode:
        description: Preview defaults to no writes; exact 2-QB production requires fresh explicit owner selection
        type: choice
        required: true
        default: PREVIEW_ONLY
        options:
        - PREVIEW_ONLY
        - I_APPROVE_DART_5091_AND_LAWRENCE_6509_IN_PRODUCTION
permissions:
  contents: write
  actions: read
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_MODE: ${{ inputs.release_mode }}
  RELEASE_PATH: model/releases/cal26-v1r14-two-owner-rated-qb-fv-2026-10-21-v1/release.json
jobs:
  exact_two_qb_fv_release:
    name: Guarded 2-QB FV price selection; 565 exact values and 31 established controls
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Validate canonical main and manual preview or production choice
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF\" = refs/heads/main\ncase \"$RELEASE_MODE\" in\n  PREVIEW_ONLY|'I_APPROVE_DART_5091_AND_LAWRENCE_6509_IN_PRODUCTION') ;;\n  *) echo '::error::Mode unsupported'; exit 1 ;;\nesac"
    - name: Check out current main for read-only preview or guarded approved commit
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
        persist-credentials: true
    - name: Configure canonical Python evaluator runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Materialize exact 2-QB FV candidate engine outside repository
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/cal26_v1r14_builder.py\" <<'PY_CAL26_V1R14_ENGINE'\n#!/usr/bin/env python3\n\"\"\"CAL26 V1R14: exact 2 QB prices considered Correct by owner in V1R13 review.\n\nNever re-fits coefficients, chooses extrapolated targets or assumes production approval.\nSafe to run repeatedly in preview mode. Production requires explicit workflow input.\n\"\"\"\nfrom __future__ import annotations\nimport argparse\nimport csv\nimport hashlib\nimport json\nimport re\nimport sys\nfrom pathlib import Path\nfrom collections import Counter\n\nAPPROVED_MODE='I_APPROVE_DART_5091_AND_LAWRENCE_6509_IN_PRODUCTION'\nPREVIEW_MODE='PREVIEW_ONLY'\nTARGETS={'jaxson dart': 5091, 'trevor lawrence': 6509}\nEXPECTED_BASE={'jaxson dart': 4351, 'trevor lawrence': 5563}\nLOCKED={\n    'breece hall':5336,'brian branch':3436,'derrick henry':4112,\n    'fred warner':5071,'jahmyr gibbs':9497,'jeremiyah love':5015,\n    'jonathan taylor':6025,'marvin harrison':4207,'nik bonitto':4919,\n    'patrick mahomes':5756,'roquan smith':5188,'tetairoa mcmillan':5252,\n    'trey mcbride':5823,\n}\nACCEPTED_CONTROLS={\n    'daniel jones','devin lloyd','dj giddens','george karlaftis',\n    'jack campbell','jake ferguson','jamien sherwood','kenny gainwell',\n    'luther burden','malik davis','malik willis','puka nacua',\n    'quay walker','quentin lake','tj watt','trevon moehrig',\n    'tuli tuipulotu','zack baun',\n}\nFEEDBACK = [\n    ('brock purdy',4902,5736,'Too Low'),\n    ('caleb williams',5021,5875,'Too Low'),\n    ('drake maye',4933,5771,'Too Low'),\n    ('josh allen',6578,7697,'Too Low'),\n    ('lamar jackson',5240,6131,'Too Low'),\n    ('jaxson dart',4351,5091,'Correct'),\n    ('trevor lawrence',5563,6509,'Correct'),\n    ('bo nix',5341,6249,'Too High'),\n    ('dak prescott',5489,6422,'Too High'),\n    ('jalen hurts',5637,6596,'Too High'),\n    ('jared goff',5071,5932,'Too High'),\n    ('justin herbert',5296,6197,'Too High'),\n]\nRELEASE='model/releases/cal26-v1r14-two-owner-rated-qb-fv-2026-10-21-v1/release.json'\nPRIOR='model/releases/cal26-v1r11-owner-selected-fv-2026-10-21-v1/release.json'\nANCHOR_RE = re.compile(r'(const CAL26_FV_OWNER_ANCHORS = \\{\\n)(.*?)(\\n\\};)',re.S)\nROW_RE = re.compile(r\"\\s*'([^']+)':([0-9]+),\\s*\")\n\ndef ck(ok,msg):\n    if not ok:raise AssertionError('CAL26_V1R14_'+msg)\n\ndef sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()\n\ndef read_overlay(text):\n    matches=list(ANCHOR_RE.finditer(text))\n    ck(len(matches)==1,'ANCHOR_TABLE_MUST_BE_UNIQUE')\n    lines=matches[0].group(2).splitlines()\n    rows={}\n    for line in lines:\n        if not line.strip():continue\n        match=ROW_RE.fullmatch(line)\n        ck(match is not None,'UNKNOWN_ANCHOR_FORMAT_'+line[:45])\n        key,val=match.group(1),int(match.group(2))\n        ck(key not in rows,'DUPLICATE_ANCHOR_'+key)\n        rows[key]=val\n    return rows\n\ndef update_overlay(text,new):\n    m=ANCHOR_RE.search(text)\n    ck(m is not None and len(ANCHOR_RE.findall(text))==1,'OVERLAY_REGION_NOT_UNIQUE')\n    rows=read_overlay(text)\n    ck(not (set(rows)&set(new)),'TARGET_ALREADY_ANCHORED')\n    rows.update(new)\n    content='\\n'+'\\n'.join(\"  '\"+k+\"':\"+str(v)+\",\" for k,v in sorted(rows.items()))\n    result=text[:m.start(2)]+content+text[m.end(2):]\n    ck(read_overlay(result)==rows,'AFTER_PATCH_MISMATCH')\n    ck(result!=text,'NO_PATCH_CREATED')\n    return result\n\ndef csvwrite(p,rows,keys):\n    with p.open('w',newline='',encoding='utf-8') as f:\n        w=csv.DictWriter(f,fieldnames=keys);w.writeheader();w.writerows(rows)\n\ndef validate_feedback(live):\n    ck(len(FEEDBACK)==12,'FEEDBACK_COUNT_CHANGED')\n    ratings=Counter(x[3] for x in FEEDBACK)\n    ck(dict(ratings)=={'Too Low':5,'Correct':2,'Too High':5},'FEEDBACK_DISTRIBUTION_CHANGED')\n    ck(len({x[0] for x in FEEDBACK})==12,'DUPLICATE_FEEDBACK_NAME')\n    correctly_priced={n:test for n,baseline,test,label in FEEDBACK if label=='Correct'}\n    ck(correctly_priced==TARGETS,'CORRECT_PRICE_TARGETS_NOT_MATCHING_OWNER_FEEDBACK')\n    for name,baseline,test,label in FEEDBACK:\n        ck(name in live and live[name]['pos']=='QB','INVALID_QB_'+name)\n        ck(live[name]['value']==baseline,'LIVE_QB_PRICE_DRIFT_'+name)\n        ck(test>baseline,'TEST_PRICE_NOT_AN_INCREASE_'+name)\n    ck(sum(test-base for name,base,test,label in FEEDBACK)==10784,\n       'SCREENSHOT_TEST_TOTAL_CHANGED')\n\ndef stage(repo,out,mode,local_test=False):\n    repo,out=Path(repo),Path(out);out.mkdir(parents=True,exist_ok=True)\n    ck(mode in (PREVIEW_MODE,APPROVED_MODE),'INVALID_MODE')\n    ck(not (repo/RELEASE).exists(),'RELEASE_ALREADY_EXISTS')\n    prior=json.loads((repo/PRIOR).read_text())\n    ck(prior['owner_selected_player_count']==13,'PRIOR_RELEASE_NOT_13')\n    ck(prior['price_changes_count']==13 and prior['price_delta_total']==6772,'PRIOR_RELEASE_SCOPE_DRIFT')\n    ck(prior['owner_approval_selected_in_run'] is True,'V1R11_NOT_APPROVED')\n    ck(prior['owner_selected_exact_fv']==LOCKED,'PROTECTED_13_PRICE_LIST_DRIFT')\n    ck(len(ACCEPTED_CONTROLS)==18 and not(set(TARGETS)&ACCEPTED_CONTROLS),\n       'ACCEPTED_PRICE_CONTROL_MUST_NOT_BE_TARGET')\n    ix,bd=repo/'index.html',repo/'free-agent-board.html'\n    index,board=ix.read_text(encoding='utf-8'),bd.read_text(encoding='utf-8')\n    ck(read_overlay(index)==LOCKED,'LIVE_OWNER_ANCHORS_NOT_EXACTLY_13')\n    ck(read_overlay(board)==LOCKED,'LIVE_FA_OWNER_ANCHORS_NOT_EXACTLY_13')\n    sys.path.insert(0,str(repo/'scripts'/'validation'))\n    import snapshot_values as sv\n    config=sv.load_from_html(ix)\n    before=sv.compute_all_values(config)\n    ck(len(before)==565 and len(set(before))==565,'LIVE_NOT_565')\n    ck({k:before[k]['value'] for k in LOCKED}==LOCKED,'APPROVED_PRIOR_13_PRICES_MOVED')\n    ck({k:before[k]['value'] for k in TARGETS}==EXPECTED_BASE,'TWO_QB_BASELINE_CHANGED')\n    ck(all(k in before for k in ACCEPTED_CONTROLS),'MISSING_ONE_OF_18_CONTROLS')\n    validate_feedback(before)\n    # Production uses canonical free-agent synchronization, not homegrown copies.\n    candidate_index=update_overlay(index,TARGETS)\n    if local_test:\n        candidate_board=update_overlay(board,TARGETS)\n    else:\n        sys.path.insert(0,str(repo/'scripts'/'sync'))\n        import sync_free_agent_valuation as sync\n        ck(sync.render_synced(index,board)==board,'EXISTING_FREE_AGENT_BOARD_STALE')\n        ck(all(sync.parity_regions(index,board).values()),'EXISTING_FREE_AGENT_SYNC_DRIFT')\n        candidate_board=sync.render_synced(candidate_index,board)\n        ck(sync.render_synced(candidate_index,candidate_board)==candidate_board,'FA_SYNC_NOT_IDEMPOTENT')\n        ck(all(sync.parity_regions(candidate_index,candidate_board).values()),'CANDIDATE_FA_SYNC_DRIFT')\n        ck(sync._extract_const_object(board,'FA_PROD_MULT_DATA')[2] ==\n           sync._extract_const_object(candidate_board,'FA_PROD_MULT_DATA')[2],\n           'INDEPENDENT_FA_PRODUCTION_MODIFIED')\n    ck(read_overlay(candidate_board)=={**LOCKED,**TARGETS},'BOARD_TARGET_OVERRIDE_DRIFT')\n    new_ix=out/'index.html';new_bd=out/'free-agent-board.html'\n    new_ix.write_text(candidate_index,encoding='utf-8')\n    new_bd.write_text(candidate_board,encoding='utf-8')\n    cfg2=sv.load_from_html(new_ix);after=sv.compute_all_values(cfg2)\n    ck(len(after)==len(before)==565 and set(after)==set(before),'RESULT_UNIVERSE_CHANGED')\n    ck(cfg2['cal26_fv_owner_anchors']=={**LOCKED,**TARGETS},'EVALUATOR_DID_NOT_READ_ALL_15_ANCHORS')\n    for k in before:\n        expected=TARGETS.get(k,before[k]['value'])\n        ck(after[k]['value']==expected,'FV_DRIFT_'+k)\n        ck((before[k]['pos'],before[k]['role'],before[k]['age'],before[k]['prod_mult'])==\n           (after[k]['pos'],after[k]['role'],after[k]['age'],after[k]['prod_mult']),\n           'ROLE_AGE_PRODUCTION_CHANGED_'+k)\n    moved={k for k in before if before[k]['value']!=after[k]['value']}\n    ck(moved==set(TARGETS),'NOT_EXACTLY_TWO_CHANGES')\n    ck(sum(after[k]['value']-before[k]['value'] for k in moved)==1686,'DELTA_NOT_1686')\n    ck(all(after[k]['value']==before[k]['value'] for k in ACCEPTED_CONTROLS),\n       'ACCEPTED_18_CONTROLS_CHANGED')\n    ck(all(after[k]['value']==v for k,v in LOCKED.items()),'EXISTING_13_OVERRIDES_CHANGED')\n    # Ensure prior production model inputs are unaltered. All edits in main HTML\n    # are confined to the explicit exact-price anchor object.\n    ck(candidate_index.replace(ANCHOR_RE.search(candidate_index).group(0),\n         ANCHOR_RE.search(index).group(0),1)==index,\n       'NONANCHOR_HTML_CHANGED')\n    qb_roles=Counter(x[3] for x in FEEDBACK)\n    allrows=[]\n    for k in sorted(before):\n        allrows.append({'player':k,'position':before[k]['pos'],'old_fv':before[k]['value'],\n                        'candidate_fv':after[k]['value'],'delta':after[k]['value']-before[k]['value'],\n                        'owner_approved_13':k in LOCKED,'cal26_accepted_price_control':k in ACCEPTED_CONTROLS,\n                        'v1r13_correct_test_price':k in TARGETS})\n    keys=list(allrows[0])\n    csvwrite(out/'CAL26_V1R14_All_565_Exact_FV_Shadow.csv',allrows,keys)\n    csvwrite(out/'CAL26_V1R14_Two_Owner_Rated_Correct_Candidates.csv',\n             [x for x in allrows if x['v1r13_correct_test_price']],keys)\n    qrows=[{'player':n,'live_fv':base,'test_17pct_fv':test,'rating':rating,\n            'next_step':('EXACT_FV_CANDIDATE_REQUIRES_NEW_OWNER_RELEASE_APPROVAL'\n                        if rating=='Correct' else\n                        'DIRECTIONAL_LOW_BOUND_NO_EXACT_PRICE' if rating=='Too Low' else\n                        'TEST_TOO_HIGH_NO_CUT_OF_LIVE_FV_AUTHORIZED')}\n           for n,base,test,rating in FEEDBACK]\n    csvwrite(out/'CAL26_V1R14_QB_Feedback_All_12.csv',qrows,list(qrows[0]))\n    receipt={\n        'stage':'CAL26_V1R14_TWO_QB_EXACT_PRICE_PREVIEW_OR_OWNER_APPROVED_RELEASE',\n        'status':'PASS_EXACT_TWO_QB_PRICE_CANDIDATE',\n        'source':'V1R13 owner screenshot 2026-10-21; V1R12 green full 565 sensitivity run 39679248029',\n        'approval_note':'Owner rated hypothetical prices Correct, but has not approved this release by rating alone',\n        'mode':mode,'production_authorized':mode==APPROVED_MODE,\n        'source_v1r11_release':PRIOR,'source_v1r11_release_sha256':sha(repo/PRIOR),\n        'live_index_sha256':sha(ix),'live_board_sha256':sha(bd),\n        'candidate_index_sha256':sha(new_ix),'candidate_board_sha256':sha(new_bd),\n        'canonical_fv_evaluator_sha256':sha(repo/'scripts'/'validation'/'snapshot_values.py'),\n        'live_player_count':565,'changed_players':2,'untouched_players':563,'total_delta':1686,\n        'previous_owner_approved_prices_preserved':13,'previous_accepted_cal26_price_controls_preserved':18,\n        'owner_v1r13_feedback_counts':dict(qb_roles),\n        'new_exact_prices':TARGETS,'other_qb_price_changes':0,'model_fitted':False,\n        'production_multipliers_changed':False,'role_changes':0,\n    }\n    (out/'release.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\\n',encoding='utf-8')\n    md=['# CAL26 V1R14 \u2014 Two owner-rated Correct quarterback prices','','**Status:** '\n        + ('Approved release path selected; guarded commit required.' if mode==APPROVED_MODE\n           else 'PREVIEW ONLY \u2014 no production changes.'),'',\n        '| Player | Current FV | Candidate FV | Increase |',\n        '|---|---:|---:|---:|',\n        '| Jaxson Dart | 4,351 | 5,091 | +740 |',\n        '| Trevor Lawrence | 5,563 | 6,509 | +946 |','',\n        '**Total increase:** +1,686 FV, with remaining 563 players unchanged.',\n        'All 13 earlier owner-selected prices and 18 accepted controls remain intact.','',\n        '## Why not apply a uniform QB adjustment?',\n        'In V1R13, 5 quarterbacks were Too Low, 2 Correct, and 5 Too High at the +17% test price.',\n        'These two precise prices are the only Correct-rated numerical test outcomes.',\n        'None of the 10 other QB feedback ratings constitute an exact FV target or approval for deployment.',\n        'No coefficient or position weight is modified in this workflow.']\n    (out/'CAL26_V1R14_Review.md').write_text('\\n'.join(md)+'\\n',encoding='utf-8')\n    print(json.dumps({'status':receipt['status'],'mode':mode,'changed':2,'delta':1686,\n                      'unchanged':563,'previous_controls':31},sort_keys=True))\n\ndef selftest():\n    test='const CAL26_FV_OWNER_ANCHORS = {\\n  \\'one\\':11,\\n};'\n    assert read_overlay(test)=={'one':11}\n    test2=update_overlay(test,{'two':22})\n    assert read_overlay(test2)=={'one':11,'two':22}\n    for altered in (\"const CAL26_FV_OWNER_ANCHORS = {\\n  'one':11,\\n  'one':12,\\n};\",\n                    \"const CAL26_FV_OWNER_ANCHORS = {\\n  'one':notnumber,\\n};\"):\n        try:read_overlay(altered)\n        except AssertionError:pass\n        else:raise AssertionError('BAD_INPUT_NOT_REJECTED')\n    try:update_overlay(test,{'one':12})\n    except AssertionError:pass\n    else:raise AssertionError('DUPLICATE_TARGET_NOT_REJECTED')\n    assert len(LOCKED)==13 and len(ACCEPTED_CONTROLS)==18\n    assert sum(TARGETS[k]-EXPECTED_BASE[k] for k in TARGETS)==1686\n    print('CAL26 V1R14 selftest PASS')\n\nif __name__=='__main__':\n    ap=argparse.ArgumentParser()\n    ap.add_argument('--repo',default='.')\n    ap.add_argument('--out',default='v1r14-output')\n    ap.add_argument('--mode',default=PREVIEW_MODE)\n    ap.add_argument('--local-test',action='store_true')\n    ap.add_argument('--selftest',action='store_true')\n    a=ap.parse_args()\n    if a.selftest:selftest()\n    else:stage(a.repo,a.out,a.mode,a.local_test)\nPY_CAL26_V1R14_ENGINE\npython3 -m py_compile \"$RUNNER_TEMP/cal26_v1r14_builder.py\"\n"
    - name: Run input and tamper regressions before touching production
      shell: bash
      run: 'set -euo pipefail

        python3 "$RUNNER_TEMP/cal26_v1r14_builder.py" --selftest

        python3 scripts/sync/sync_free_agent_valuation.py --check

        test -z "$(git status --porcelain --untracked-files=all)"'
    - name: Stage exact Dart and Lawrence owner-rated prices with 565 FV parity
      shell: bash
      run: "set -euo pipefail\npython3 \"$RUNNER_TEMP/cal26_v1r14_builder.py\" \\\n  --repo . --out \"$RUNNER_TEMP/cal26-v1r14-output\" \\\n  --mode \"$RELEASE_MODE\"\ntest -z \"$(git status --porcelain --untracked-files=all)\""
    - name: Independently assert two and only two FV changes, exact outputs and 31 controls
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_VERIFY'\nfrom pathlib import Path\nimport csv, hashlib, json, os\np=Path(os.environ['RUNNER_TEMP'])/'cal26-v1r14-output'\nm=json.loads((p/'release.json').read_text())\nassert m['status']=='PASS_EXACT_TWO_QB_PRICE_CANDIDATE'\nassert m['live_player_count']==565 and m['changed_players']==2 and m['untouched_players']==563\nassert m['total_delta']==1686 and m['previous_owner_approved_prices_preserved']==13\nassert m['previous_accepted_cal26_price_controls_preserved']==18\nassert m['new_exact_prices']=={'jaxson dart':5091,'trevor lawrence':6509}\nassert m['owner_v1r13_feedback_counts']=={'Correct':2,'Too High':5,'Too Low':5}\nfor name,key in [('index.html','candidate_index_sha256'),('free-agent-board.html','candidate_board_sha256')]:\n    assert hashlib.sha256((p/name).read_bytes()).hexdigest()==m[key]\nwith (p/'CAL26_V1R14_All_565_Exact_FV_Shadow.csv').open(newline='') as f:\n    full=list(csv.DictReader(f))\nwith (p/'CAL26_V1R14_Two_Owner_Rated_Correct_Candidates.csv').open(newline='') as f:\n    selected=list(csv.DictReader(f))\nassert len(full)==565 and len({x['player'] for x in full})==565\nassert len(selected)==2 and {x['player']:int(x['candidate_fv']) for x in selected}==m['new_exact_prices']\nassert sum(int(x['delta']) for x in full)==1686\nassert sum(int(x['delta'])!=0 for x in full)==2\nassert sum(x['owner_approved_13']=='True' for x in full)==13\nassert sum(x['cal26_accepted_price_control']=='True' for x in full)==18\nassert all(int(x['delta'])==0 for x in full if x['owner_approved_13']=='True' or x['cal26_accepted_price_control']=='True')\nassert m['mode']==os.environ['RELEASE_MODE']\nprint('PASS: exact two candidate QBs, 563 unchanged, all 13+18 previous controls')\nPY_VERIFY\ncat \"$RUNNER_TEMP/cal26-v1r14-output/CAL26_V1R14_Review.md\" >> \"$GITHUB_STEP_SUMMARY\"\nif [[ \"$RELEASE_MODE\" == 'PREVIEW_ONLY' ]]; then\n  echo '**PREVIEW ONLY: no production change authorized or performed.**' >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Commit two owner-approved QB FV prices only with fresh explicit production mode
      if: ${{ env.RELEASE_MODE == 'I_APPROVE_DART_5091_AND_LAWRENCE_6509_IN_PRODUCTION' }}
      shell: bash
      run: "set -euo pipefail\n test \"$GITHUB_REF\" = 'refs/heads/main'\n test \"$RELEASE_MODE\" = 'I_APPROVE_DART_5091_AND_LAWRENCE_6509_IN_PRODUCTION'\n test ! -e \"$RELEASE_PATH\"\ncp \"$RUNNER_TEMP/cal26-v1r14-output/index.html\" index.html\ncp \"$RUNNER_TEMP/cal26-v1r14-output/free-agent-board.html\" free-agent-board.html\nmkdir -p \"$(dirname \"$RELEASE_PATH\")\"\ncp \"$RUNNER_TEMP/cal26-v1r14-output/release.json\" \"$RELEASE_PATH\"\npython3 scripts/sync/sync_free_agent_valuation.py --check\ngit diff --check\ngit add -- index.html free-agent-board.html \"$RELEASE_PATH\"\ngit diff --cached --check\npython3 - <<'PY_STAGE'\nimport os,subprocess\nfound=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())\nexpected={'index.html','free-agent-board.html',os.environ['RELEASE_PATH']}\nassert found==expected,(found,expected)\nprint('PASS: exactly two calculator HTML files and one immutable FV release receipt')\nPY_STAGE\ngit -c user.name='github-actions[bot]' \\\n    -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \\\n    commit -m 'CAL26 V1R14: owner approved Dart and Lawrence exact FV prices'\ngit push origin HEAD:main\necho '**DEPLOYED: 2 owner-approved QBs; +1,686 FV; 563 unchanged.**' >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload 565 player price shadow and owner feedback with exact release receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: CAL26-V1R14-Two-Correct-Rated-QB-FV-Preview-or-Release
        path: ${{ runner.temp }}/cal26-v1r14-output/
        if-no-files-found: warn
        retention-days: 30
