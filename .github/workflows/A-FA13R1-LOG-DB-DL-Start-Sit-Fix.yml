name: A-FA13R1 - LOG Start Sit DB DL Lineup Slot Fix

# Browser-only presentation change. Public workflow contains no subscriber
# ranking rows and does not modify Dynasty FV, market values, league data,
# ROS evidence, weekly research snapshots, or private browser activation.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates; Apply commits the tested Start/Sit JavaScript"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  start-sit-db-dl:
    name: Start Sit LOG DB-DL eligibility (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard exact deployed Start Sit and protected UI
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = 'refs/heads/main'
          test -z "$(git status --porcelain)"
          test -s assets/fa_start_sit_v1.js
          test -s assets/fa_workspace_v1.js
          test -s assets/fa_mobile_polish_v1.js
          test -s data/league_rosters.json
          test -s data/free_agents.json
          test "$(git hash-object assets/fa_start_sit_v1.js)" = '44fb237c65ca3dba6258d6602a65ba59fc76caf8'
          echo 'PASS exact A-FA12R1 baseline and immutable repo scope'

