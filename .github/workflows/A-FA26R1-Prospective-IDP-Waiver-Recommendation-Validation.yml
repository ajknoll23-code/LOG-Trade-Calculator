name: A-FA26R1 - Prospective IDP Waiver Recommendation Validation (Preview / Apply)
# Deploys only browser-local validation UI. No public projection, ranking or scoring data is published.
# Paid sources remain in the owner's private browser stores. No model, FV or MV changes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview first. Apply only after preview green.'
        required: true
        type: choice
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  fa26-prospective-validation:
    name: Private read-only research validation (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage source-pinned FA26 validation UI and read-only FA25 snapshot bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,zlib
          from pathlib import Path
          packages = {'assets/fa_multisource_targets_v1.js': {'old_sha256': 'dddb66d6c1ba82d00699b6e65e78d5bd81dc7e3100b6c27f6c692645aecb0cb1', 'sha256': '1e28fba13be90386db2146b609b04c1f8692a505497c0ba7956bc941e675b50b', 'zlib_b64': ''}, 'assets/fa_validation_v1.js': {'old_sha256': None, 'sha256': 'ab5679def689b5ac12f96a2347d1b1912747fbde3e9a54d9a3e8fa3b4a06e91b', 'zlib_b64': ''}, 'assets/fa_validation_v1.css': {'old_sha256': None, 'sha256': '8fe2109b6caaf70ff2234494e9ec1effb238b644b128f783c44733d2e4f9ab25', 'zlib_b64': ''}}
          for path,data in packages.items():
              raw=zlib.decompress(base64.b64decode(data['zlib_b64']))
              assert hashlib.sha256(raw).hexdigest()==data['sha256'],f'Corrupt FA26 payload: {path}'
              dest=Path(path)
              if dest.exists():
                  oldhash=hashlib.sha256(dest.read_bytes()).hexdigest()
                  permitted={data['sha256']}
                  if data['old_sha256']:permitted.add(data['old_sha256'])
                  assert oldhash in permitted, f'Source drift; manual review required: {path} / {oldhash}'
              else:
                  assert not data['old_sha256'],f'Missing pinned source: {path}'
                  dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
              print('Verified',path)
          page=Path('free-agent-board.html')
          assert page.is_file(),'Missing Free Agent Board HTML'
          html=page.read_text('utf-8')
          assert html.count('FA24_MULTI_SOURCE_SCRIPT')==1 and html.count('FA24_MULTI_SOURCE_STYLE')==1,'FA25 source not integrated'
          old='assets/fa_multisource_targets_v1.js?v=1'
          new='assets/fa_multisource_targets_v1.js?v=2'
          if old in html:
              assert html.count(old)==1,'Unexpected FA25 loader count'
              html=html.replace(old,new,1)
          else:
              assert html.count(new)==1,'Unknown FA25 loader version'
          css='<!-- FA26_PROSPECTIVE_STYLE --><link rel="stylesheet" href="assets/fa_validation_v1.css?v=1">'
          script='<!-- FA26_PROSPECTIVE_SCRIPT --><script src="assets/fa_validation_v1.js?v=1" defer></script>'
          if 'FA26_PROSPECTIVE_STYLE' not in html:
              assert html.count('</head>')==1,'Missing style loader insertion anchor'
              html=html.replace('</head>',css+'\n</head>',1)
          if 'FA26_PROSPECTIVE_SCRIPT' not in html:
              assert html.count('</body>')==1,'Missing script loader insertion anchor'
              html=html.replace('</body>',script+'\n</body>',1)
          assert html.count('FA26_PROSPECTIVE_STYLE')==1 and html.count('FA26_PROSPECTIVE_SCRIPT')==1
          assert html.count(new)==1
          page.write_text(html,'utf-8')
          print('FA26 staged as source-only validation; no model, data or scoring writes')
          PYCODE
      - name: Verify JS, restricted file changes and no private data transmission
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_multisource_targets_v1.js
          node --check assets/fa_validation_v1.js
          git diff --check
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          js=Path('assets/fa_validation_v1.js').read_text('utf-8')
          old=Path('assets/fa_multisource_targets_v1.js').read_text('utf-8')
          html=Path('free-agent-board.html').read_text('utf-8')
          assert js.count('fetch(')==1,'Validation module gained an unexpected network request'
          assert "data/idp_weekly_2026_public.json" in js,'Public actual snap source missing'
          assert 'XMLHttpRequest' not in js and 'sendBeacon' not in js and 'fetch(url,{cache' in js
          assert 'window.LOG_FA26_READ' in old,'Full candidate pool read-only bridge missing'
          assert 'FA26_PROSPECTIVE_SCRIPT' in html and 'FA26_PROSPECTIVE_STYLE' in html
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'assets/fa_multisource_targets_v1.js','assets/fa_validation_v1.js','assets/fa_validation_v1.css','free-agent-board.html'}
          assert (changed|untracked).issubset(allowed),f'Unexpected files changed: {(changed|untracked)-allowed}'
          assert not any(path.startswith('data/') for path in changed|untracked)
          assert subprocess.run(['git','diff','--quiet','--','data/','config.json','assets/fa_start_sit_v1.js','assets/fa_matchup_private_v1.js','assets/fa_4for4_waiver_v1.js']).returncode==0
          print('PASS: privacy boundary and model/source immutability')
          PYCODE
      - name: Setup Python for Chromium QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify prospective freeze + subsequent outcomes on the real board (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,hashlib,zlib
          from pathlib import Path
          p={'sha256': 'f1f4faf9d2233b8dde6b6cc879dccdff9a1a58241bed85eedd34d7e39c32455e', 'zlib_b64': ''}
          raw=zlib.decompress(base64.b64decode(p['zlib_b64']))
          assert hashlib.sha256(raw).hexdigest()==p['sha256'],'Corrupt synthetic QA source'
          Path('/tmp/fa26_ci_qa.py').write_bytes(raw)
          PYCODE
          python /tmp/fa26_ci_qa.py
      - name: Attach synthetic-only Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FA26R1-Synthetic-Prospective-Validation-QA
          path: fa26-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preview results (zero writes)
        if: ${{ inputs.mode == 'preview' }}
        shell: bash
        run: |
          echo 'FA26 PREVIEW GREEN: candidate freeze, exact-week scoring, snap outcomes, missing-data safeguards passed.'
          echo 'Only source code in the temporary runner was staged. Production is untouched.'
      - name: Apply validated browser-only research module
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- free-agent-board.html assets/fa_multisource_targets_v1.js assets/fa_validation_v1.js assets/fa_validation_v1.css
          if git diff --cached --quiet; then
            echo 'FA26 already deployed; no changes required.'
          else
            git commit -m 'FA26: browser-local prospective IDP waiver validation (data read-only)'
            git push origin HEAD:main
          fi
          echo 'PASS: private snapshots never posted to repository or workflow artifacts.'
