name: CAL26 V1R10 - 13 Owner Anchored FV Exact Integration Candidate READ ONLY

'on':
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: cal26-v1r10-exact-13-fv-pricing-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  stage_exact_13_candidate_prices:
    name: Stage exact candidate prices for 13 of 565 players; owner approval required before release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current production source read only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact successful V1R9 owner-anchored 565 pricing evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26-v1r10-source"
          gh run download 39660339898 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R9-565-Owner-Anchored-Pricing-Shadow-READ-ONLY \
            --dir "$RUNNER_TEMP/cal26-v1r10-source"
          test -s "$RUNNER_TEMP/cal26-v1r10-source/CAL26_V1R9_Manifest.json"
          test -s "$RUNNER_TEMP/cal26-v1r10-source/CAL26_V1R9_13_Pilot_Owner_Corroborated_FV_Candidates.csv"
          test -s "$RUNNER_TEMP/cal26-v1r10-source/CAL26_V1R9_565_Player_Owner_Anchor_Pricing_Shadow.csv"

      - name: Materialize pinned exact-price integration candidate builder
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r10_builder.py" <<'PY_CAL26_V1R10_ENGINE'
          #!/usr/bin/env python3
          """CAL26 V1R10: stage the exact 13 owner-corroborated FV prices, read-only.
          
          Do not confuse historical companion quote rated Correct with explicit approval
          of this new package. No deployment, writes to production files, or authorization.
          """
          from __future__ import annotations
          import argparse,csv,hashlib,json,re,sys,shutil,datetime
          from pathlib import Path
          from collections import Counter
          
          RUN=39660339898
          ARTIFACT='CAL26-V1R9-565-Owner-Anchored-Pricing-Shadow-READ-ONLY'
          INDEX_SHA='ba004cfd250d9def3e1a83ea596b2aa411dc9b6fc50fa742836542ee832b986d'
          BOARD_SHA='768343bbaeba1fc8099016ed8d4bbe2ef8faad5504a8cf2d26497c6a11488c44'
          STATUS='PASS_CAL26_V1R9_565_PLAYER_OWNER_ANCHORED_FV_SHADOW'
          CORE_NAME='CAL26_FV_OWNER_ANCHORS'
          M='/* CAL26_V1R10_EXPLICIT_OWNER_PRICE_ANCHOR_SHADOW_NOT_PRODUCTION */'
          
          
          def check(ok,msg):
              if not ok:raise AssertionError('CAL26_V1R10_'+str(msg))
          def sha(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def loadcsv(p):
              with Path(p).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def writecsv(p,rs,cols):
              with Path(p).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=cols,extrasaction='ignore');w.writeheader();w.writerows(rs)
          def truth(v):return str(v).strip().lower() in ('true','1')
          
          def add_fv_anchors(index,targets):
              check(M not in index,'ALREADY_OVERRIDDEN')
              needle='function playerValue(pos, age, role, name){'
              check(index.count(needle)==1,'CANNOT_LOCATE_CANONICAL_PLAYER_VALUE')
              lines=[M, 'const '+CORE_NAME+' = {']
              for key,value in sorted(targets.items()):
                  check(bool(re.fullmatch('[a-z0-9 ]+',key)),'NONCANONICAL_PLAYER_KEY_'+key)
                  lines.append("  '"+key+"':"+str(value)+",")
              lines+=['};','']
              guard='''function playerValue(pos, age, role, name){
            // CAL26 V1R10: research-only exact-price overlay. Never replace projection
            // multipliers or alter hypothetical players with edited role or age inputs.
            const cal26AnchorKey = normalizeName(name || '');
            if(Object.prototype.hasOwnProperty.call(CAL26_FV_OWNER_ANCHORS, cal26AnchorKey)){
              const canonical = PLAYER_DB[cal26AnchorKey];
              if(canonical && canonical.pos === pos && canonical.age === age && canonical.role === role)
                return CAL26_FV_OWNER_ANCHORS[cal26AnchorKey];
            }
          '''
              return index.replace(needle,'\n'.join(lines)+guard,1)
          
          
          def patch_snapshot(src):
              # Candidate-only shadow Python parity port; preserve original live source.
              marker='    return {\n        "player_db": player_db,'
              check(src.count(marker)==1,'SNAPSHOT_RETURN_MARKER_DRIFT')
              src=src.replace(marker,'''    cal26_overrides = (
                  parse_simple_numeric_object(extract_object_body(content, "CAL26_FV_OWNER_ANCHORS"))
                  if "const CAL26_FV_OWNER_ANCHORS = {" in content else {}
              )
              return {
                  "cal26_fv_owner_anchors": cal26_overrides,
                  "player_db": player_db,''',1)
              marker='        results[key] = {\n            "pos": pos,'
              check(src.count(marker)==1,'SNAPSHOT_RESULT_MARKER_DRIFT')
              src=src.replace(marker,'''        anchor = cfg.get("cal26_fv_owner_anchors", {}).get(key)
                  if anchor is not None:
                      if int(anchor) != anchor or anchor <= 0:
                          raise AssertionError("INVALID_OWNER_FV_ANCHOR_" + key)
                      value = int(anchor)
                  results[key] = {
                      "pos": pos,''',1)
              compile(src,'cal26_v1r10_candidate_snapshot.py','exec')
              return src
          
          
          def analyze(repo,source,out,fixture=False):
              repo,source,out=map(Path,(repo,source,out));out.mkdir(parents=True,exist_ok=True)
              mpath=source/'CAL26_V1R9_Manifest.json'
              allpath=source/'CAL26_V1R9_565_Player_Owner_Anchor_Pricing_Shadow.csv'
              pilotpath=source/'CAL26_V1R9_13_Pilot_Owner_Corroborated_FV_Candidates.csv'
              m=json.loads(mpath.read_text(encoding='utf-8'))
              check(m['status']==STATUS and m['pilot_count']==13 and m['owner_cal26_correct_protected']==18,'GREEN_V1R9_STATUS_OR_COUNTS_DRIFT')
              check(m['production_changed'] is False and m['production_price_released'] is False,'NOT_SHADOW_SOURCE')
              for file in (allpath,pilotpath):check(sha(file)==m['artifact_sha256'][file.name],'PINNED_GREEN_EVIDENCE_TAMPER_'+file.name)
              rows=loadcsv(allpath);pilot=loadcsv(pilotpath)
              check(len(rows)==565 and len(pilot)==13,'CANDIDATE_AND_LIVE_UNIVERSE_DRIFT')
              check(len({r['player'] for r in rows})==565 and len({r['player'] for r in pilot})==13,'DUPLICATE_PLAYER_IDENTITY')
              check(sum(r['pilot_action']=='PILOT_OWNER_CORROBORATED_REVIEW_REQUIRED' for r in rows)==13,'WRONG_PILOT_CATEGORY')
              check(sum(r['cal26_owner_rating']=='Correct' for r in rows)==18,'18_ACCEPTED_CONTROLS_CHANGED')
              check(sum(r['cal26_owner_rating']=='High' for r in rows)==2,'HIGH_OWNER_CONTROLS_CHANGED')
              check(sum(r['cal26_owner_rating']=='Low' for r in rows)==60,'LOW_OWNER_COUNTS_CHANGED')
              check(sum(r['pilot_action']=='NO_OWNER_FEEDBACK_PRICE_UNCHANGED' for r in rows)==485,'NO_OWNER_FEEDBACK_POPULATION_CHANGED')
              byname={r['player']:r for r in rows};targets={}
              for r in pilot:
                  key=r['player'];parent=byname[key];target=int(r['pilot_candidate_fv']);old=int(r['live_fv'])
                  check(parent['pilot_action']=='PILOT_OWNER_CORROBORATED_REVIEW_REQUIRED' and int(parent['pilot_candidate_fv'])==target,'PILOT_NOT_FROM_GREEN_565')
                  check(r['cal26_owner_rating']=='Low' and r['owner_anchor_source'] in ('FV+Votes','Market Value'),'NOT_EXPLICIT_OWNER_CORRECT_COMPANION')
                  check(int(r['owner_anchor_value'])==target and target>old,'TARGET_NOT_EXACT_CORRECT_ANCHOR')
                  check(not truth(r['accepted_proposal_price_protected']) and not truth(r['role_price_impact_hold']),'OWNER_PRICE_CONTROL_OR_ROLE_HOLD')
                  check(target-old<=1000 and (target-old)/old<=.200001,'PILOT_TIER_LIMIT')
                  check(target-old==int(r['pilot_delta']),'DELTA_SOURCE_DRIFT')
                  targets[key]=target
              check(sum(targets[k]-int(byname[k]['live_fv']) for k in targets)==6772,'CALIBRATION_TOTAL_DRIFT')
              indexpath=repo/'index.html';boardpath=repo/'free-agent-board.html'
              if not fixture:
                  check(sha(indexpath)==INDEX_SHA and sha(boardpath)==BOARD_SHA,'LIVE_HTML_SHA_DRIFT_AFTER_WR01')
                  releasepath=repo/'model/releases/cal26-v1r8-role-v2-98-week6-fv-neutral-2026-10-21-v1/release.json'
                  rel=json.loads(releasepath.read_text(encoding='utf-8'))
                  check(rel['affected_role_count']==98 and rel['live_fv_change_count']==0,'MISSING_PRIOR_RELEASE')
              sys.path.insert(0,str(repo/'scripts/validation'))
              sys.path.insert(0,str(repo/'scripts/sync'))
              import sync_free_agent_valuation as sync
              idx=indexpath.read_text(encoding='utf-8');board=boardpath.read_text(encoding='utf-8')
              if fixture:
                  check(len(re.findall(r"^ '[^']+':\{pos:'[A-Z]+'",idx,re.M))==565,'FIXTURE_INDEX_NOT_565')
                  before={}
                  matches=re.findall(r"^ '([^']+)':\{pos:'([A-Z]+)',age:(\d+),role:'([^']+)'",idx,re.M)
                  check(len(matches)==565,'FIXTURE_ROLE_PARSE')
                  for key,pos,age,role in matches:
                      p=byname[key]
                      before[key]={'pos':pos,'role':role,'age':int(age),'value':int(p['live_fv'])}
              else:
                  import snapshot_values as sv
                  before=sv.compute_all_values(sv.load_from_html(indexpath))
              check(len(before)==565 and len(set(before))==565,'UNEXPECTED_LIVE_PLAYER_COUNT')
              check(sync.render_synced(idx,board)==board and all(sync.parity_regions(idx,board).values()),'EXISTING_FREE_AGENT_SYNC_DRIFT')
              for key,r in byname.items():
                  b=before.get(key)
                  check(b is not None and b['pos']==r['position'],'LIVE_IDENTITY_OR_POSITION_DRIFT_'+key)
                  check(b['value']==int(r['live_fv']),'LIVE_PRICE_SOURCE_DRIFT_'+key)
                  check(b['role']==r['live_role'],'LIVE_ROLE_SOURCE_DRIFT_'+key)
              staged_index=add_fv_anchors(idx,targets)
              staged_board=sync.render_synced(staged_index,board)
              check(sync.render_synced(staged_index,staged_board)==staged_board,'CANDIDATE_BOARD_NOT_SYNC_IDEMPOTENT')
              check(all(sync.parity_regions(staged_index,staged_board).values()),'CANDIDATE_BOARD_REGIONS_MISMATCH')
              check(sync._extract_const_object(board,'FA_PROD_MULT_DATA')[2]==sync._extract_const_object(staged_board,'FA_PROD_MULT_DATA')[2],'FA_PROD_MULT_CHANGED')
              # Reversibility: removing our explicit injection reconstructs exact original index bytes.
              check(staged_index.count(M)==1 and staged_index.count('  const pw = POSITION_WEIGHT[pos] ?? 1.0;')==1,'OVERLAY_INSERTION_NOT_UNIQUE')
              prefix,rest=staged_index.split(M,1)
              check('  const pw = POSITION_WEIGHT[pos] ?? 1.0;' in rest,'ORIGINAL_JS_FORMULA_MISSING')
              reconstructed=(prefix+'function playerValue(pos, age, role, name){\n'
                             +'  const pw = POSITION_WEIGHT[pos] ?? 1.0;'
                             +rest.split('  const pw = POSITION_WEIGHT[pos] ?? 1.0;',1)[1])
              check(reconstructed==idx,'CANONICAL_JS_ENGINE_OVERWRITTEN')
              (out/'index.html').write_text(staged_index,encoding='utf-8')
              (out/'free-agent-board.html').write_text(staged_board,encoding='utf-8')
              source_snapshot=(repo/'scripts/validation/snapshot_values.py').read_text(encoding='utf-8')
              if fixture:
                  # Local fixture uses the real pinned CSV price baseline, plus parsed JS overlay.
                  # Only live CI uses the exact production snapshot_values.py for strict parity.
                  (out/'snapshot_values.py').write_text('FIXTURE_ONLY_NOT_PRODUCTION\n',encoding='utf-8')
                  anchor_expr=re.search(r'const CAL26_FV_OWNER_ANCHORS = \{(.*?)\};',staged_index,re.S)
                  check(anchor_expr is not None,'MISSING_JS_OVERRIDE_TABLE')
                  parsed={key:int(v) for key,v in re.findall(r"'([^']+)':(\d+)",anchor_expr.group(1))}
                  check(parsed==targets,'JS_OVERLAY_VALUES_DRIFT')
                  staged_cfg={'cal26_fv_owner_anchors':parsed}
                  after={key:dict(b,value=parsed.get(key,b['value'])) for key,b in before.items()}
              else:
                  staged_snapshot=patch_snapshot(source_snapshot)
                  (out/'snapshot_values.py').write_text(staged_snapshot,encoding='utf-8')
                  candidate_module={'__name__':'cal26_candidate_snapshot','__file__':str(out/'snapshot_values.py')}
                  exec(compile(staged_snapshot,'staged_snapshot_values.py','exec'),candidate_module)
                  staged_cfg=candidate_module['load_from_html'](out/'index.html')
                  after=candidate_module['compute_all_values'](staged_cfg)
              check(len(staged_cfg['cal26_fv_owner_anchors'])==13,'OVERRIDE_TABLE_NOT_13')
              assert len(after)==565
              changed=[];audit=[];controls=[]
              for key in before:
                  b=before[key];a=after[key];p=byname[key]
                  check(a['pos']==b['pos'] and a['role']==b['role'] and a['age']==b['age'],'PLAYER_METADATA_DRIFT_'+key)
                  expected=targets.get(key,b['value'])
                  check(a['value']==expected,'SHADOW_PRICE_MISMATCH_'+key)
                  if a['value']!=b['value']:changed.append(key)
                  if p['cal26_owner_rating']=='Correct':
                      check(a['value']==b['value'],'18_ACCEPTED_PRICE_MOVED_'+key);controls.append(key)
                  audit.append(dict(player=key,position=a['pos'],live_role=a['role'],before_fv=b['value'],shadow_fv=a['value'],delta=a['value']-b['value'],release_eligible_approved='NO',source='OWNER_RATED_CORRECT_COMPANION' if key in targets else 'NO_CHANGE'))
              check(set(changed)==set(targets) and len(changed)==13 and len(controls)==18,'CHANGED_SCOPE_OR_PRICE_CONTROL_ERROR')
              check(sum(x['delta'] for x in audit)==6772,'TOTAL_FV_DELTA_WRONG')
              cols=['player','position','live_role','before_fv','shadow_fv','delta','release_eligible_approved','source']
              writecsv(out/'CAL26_V1R10_565_Exact_FV_Shadow.csv',audit,cols)
              writecsv(out/'CAL26_V1R10_13_Candidate_Exact_FV_Deltas.csv',[x for x in audit if x['delta']!=0],cols)
              checks={
                  'status':'PASS_CAL26_V1R10_13_EXACT_PRICE_INTEGRATION_CANDIDATE_READ_ONLY',
                  'source_green_v1r9_run':RUN,'source_v1r9_artifact':ARTIFACT,
                  'source_v1r9_manifest_sha256':sha(mpath),'source_565_sha256':sha(allpath),'source_13_sha256':sha(pilotpath),
                  'source_release_index_sha256':sha(indexpath),'source_release_board_sha256':sha(boardpath),
                  'candidate_index_sha256':sha(out/'index.html'),'candidate_board_sha256':sha(out/'free-agent-board.html'),
                  'candidate_snapshot_values_sha256':sha(out/'snapshot_values.py'),
                  'live_player_count':565,'proposed_price_changes':13,'proposed_price_delta_total':6772,
                  'accepted_owner_controls':18,'accepted_price_changes':0,'unreviewed_players_preserved':485,
                  'prior_98_role_labels_preserved':True,'existing_prod_multiplier_values_unchanged':True,
                  'board_canonical_sync':True,'board_specific_fa_prod_preserved':True,
                  'historical_owner_correct_companion_is_not_new_release_approval':True,
                  'production_files_changed':False,'owner_price_release_approved':False,'production_price_release_authorized':False,
                  'release_scope':'PREVIEW_ONLY_NO_PRODUCTION_WRITES',
              }
              (out/'CAL26_V1R10_Manifest.json').write_text(json.dumps(checks,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              lines=['# CAL26 V1R10 — 13 exact FV candidate integration', '',
                     '**READ-ONLY PREVIEW: NOT APPROVED FOR PRICE DEPLOYMENT.**','',
                     'The 13 explicit numerical values are from companion FV+Votes or Market Value amounts the owner previously rated Correct when comparing CAL26 draft proposals. They are *not* an approval of the new 13-price release.','',
                     'No production multipliers are artificially changed. Pricing adjustment is represented by a named, auditable override table, with a matching staged Python pricing evaluator. All unrelated 552 players and the 18 accepted-price controls retain their current FV.','',
                     '| Player | Pos | Current FV | Proposed FV | Change |','|---|---|---:|---:|---:|']
              for key in sorted(changed):
                  a=next(x for x in audit if x['player']==key)
                  lines.append(f"| {key.title()} | {a['position']} | {a['before_fv']:,} | {a['shadow_fv']:,} | +{a['delta']:,} |")
              lines += ['', '**Release gate:** owner must explicitly approve selected target prices before any deployment. Existing historical model frozen studies and prior exact-release hashes remain unchanged, so a separate successor regression check is required before a production update.', '',
                        '**Role and production guard:** canonical Role V2 tier labels, production multiplier factors, player metadata, and all free-agent-specific production factors stay unchanged in the candidate.','']
              (out/'CAL26_V1R10_Review.md').write_text('\n'.join(lines),encoding='utf-8')
              print(json.dumps(checks,indent=2,sort_keys=True))
              return checks
          
          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('--source',required=True);p.add_argument('--repo',default='.');p.add_argument('--out',required=True);p.add_argument('--fixture',action='store_true')
              a=p.parse_args();analyze(a.repo,a.source,a.out,a.fixture)
          PY_CAL26_V1R10_ENGINE
          python3 - <<'PY_SYNTAX'
          import ast,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'cal26_v1r10_builder.py'
          ast.parse(p.read_text(encoding='utf-8'))
          print('PASS: exact 13 candidate pricing engine Python syntax')
          PY_SYNTAX

      - name: Build read only 13 quote integration from canonical current FV and sync free agent board
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          python3 "$RUNNER_TEMP/cal26_v1r10_builder.py" \
            --source "$RUNNER_TEMP/cal26-v1r10-source" \
            --repo . \
            --out "$RUNNER_TEMP/cal26-v1r10-output"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo '::error::Production file changed during candidate build'; exit 1; }

      - name: Independently verify all 565 shadow prices 13 proposals and 18 accepted owner controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import csv,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cal26-v1r10-output'
          manifest=json.loads((root/'CAL26_V1R10_Manifest.json').read_text())
          assert manifest['status']=='PASS_CAL26_V1R10_13_EXACT_PRICE_INTEGRATION_CANDIDATE_READ_ONLY'
          assert manifest['source_green_v1r9_run']==39660339898
          assert manifest['live_player_count']==565
          assert manifest['proposed_price_changes']==13
          assert manifest['proposed_price_delta_total']==6772
          assert manifest['accepted_owner_controls']==18 and manifest['accepted_price_changes']==0
          assert manifest['unreviewed_players_preserved']==485
          assert manifest['existing_prod_multiplier_values_unchanged'] is True
          assert manifest['board_canonical_sync'] is True and manifest['board_specific_fa_prod_preserved'] is True
          assert manifest['owner_price_release_approved'] is False
          assert manifest['production_files_changed'] is False and manifest['production_price_release_authorized'] is False
          def readcsv(name):
              with (root/name).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          full=readcsv('CAL26_V1R10_565_Exact_FV_Shadow.csv')
          delta=readcsv('CAL26_V1R10_13_Candidate_Exact_FV_Deltas.csv')
          assert len(full)==565 and len(delta)==13
          assert len({r['player'] for r in full})==565 and len({r['player'] for r in delta})==13
          assert sum(int(r['delta'])!=0 for r in full)==13
          assert sum(int(r['delta']) for r in delta)==6772
          assert all(r['release_eligible_approved']=='NO' for r in full)
          for filename,field in [('index.html','candidate_index_sha256'),
                                 ('free-agent-board.html','candidate_board_sha256'),
                                 ('snapshot_values.py','candidate_snapshot_values_sha256')]:
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==manifest[field]
          print('PASS: exact 13 FV shadow, 552 other prices and 18 accepted protected, no production changes')
          PY_VERIFY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cat "$RUNNER_TEMP/cal26-v1r10-output/CAL26_V1R10_Review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review candidate for explicit owner decision (not a production deployment)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R10-13-Exact-FV-Integration-Candidate-READ-ONLY
          path: ${{ runner.temp }}/cal26-v1r10-output/
          if-no-files-found: warn
          retention-days: 30
