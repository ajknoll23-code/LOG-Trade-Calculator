name: Package Adjustment V8 - Topology Split Preregistration V1 REALISM REVISED

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard closed V7 evidence and frozen player snapshot
        shell: bash
        run: |
          set -euo pipefail
          V7="research/package-adjustment-v7"
          V8="research/package-adjustment-v8"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$V7/development_evaluation_v1.json")" = \
            "a3be8c22ca24b84f10526a98359a20a282af4e41"
          test "$(git hash-object "$V7/development_first_qualification_frozen_v1.json")" = \
            "86162cdf1a34e20b35066c2da545cc925743f1d8"
          test "$(git hash-object "$V7/phase1_multi_vs_multi_preregistration_v1.json")" = \
            "07063ddc8842ec01f876efe5dcab548f9c223a60"
          test "$(git hash-object "$V7/phase1a_player_fv_snapshot_v1.json")" = \
            "945bfb8f504bf62cba46464e1940126fd7a528e8"
          test "$(git hash-object "$V7/generate_multi_vs_multi_catalog_v1.py")" = \
            "8348b54f114e484d2858f1aa7a67189d0f921d28"

          test ! -e "$V8/topology_split_preregistration_v1.json"
          test ! -e "$V8/topology_split_preregistration_manifest_v1.json"
          test ! -e "$V8/topology_split_preregistration_v1.md"
          test ! -e "$V8/topology_split_power_analysis_v1.json"
          test ! -e "$V8/development_catalog_v1.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d=Path("research/package-adjustment-v7")
          e=json.loads((d/"development_evaluation_v1.json").read_text())
          snap=json.loads((d/"phase1a_player_fv_snapshot_v1.json").read_text())
          players=snap["players"]

          assert e["decision"]=="STOP_V7_MULTI_V_MULTI_NO_DEVELOPMENT_SIGNAL"
          assert e["selected_candidate"] is None
          assert e["eligible_candidates"]==[]
          assert e["confirmation_catalog_generated"] is False
          assert e["production_change_authorized"] is False

          # Feasibility of the new hard realism floor on the same frozen player universe.
          eligible=[
              p for p in players
              if int(p["fv"]) >= 2500
              and p.get("team") not in (None,"")
              and str(p["key"]).lower() != "joe mixon"
          ]
          by_pos={}
          for p in eligible:
              by_pos[p["pos"]]=by_pos.get(p["pos"],0)+1

          assert len(eligible) >= 250, len(eligible)
          for pos,min_n in {
              "QB":20,"RB":30,"WR":40,"TE":12,"DL":35,"LB":35,"DB":30
          }.items():
              assert by_pos.get(pos,0) >= min_n, (pos,by_pos.get(pos,0))

          premium=[p for p in eligible if int(p["fv"]) >= 4000]
          assert len(premium) >= 80, len(premium)

          twovtwo=[
              p for p in eligible
              if int(p["fv"]) >= 3000
          ]
          assert len(twovtwo) >= 180, len(twovtwo)

          print({
              "eligible_2500_plus":len(eligible),
              "premium_4000_plus":len(premium),
              "two_v_two_3000_plus":len(twovtwo),
              "by_position":by_pos,
          })
          print("PASS: revised trade-realism floors are feasible on the frozen player universe.")
          PY

      - name: Freeze realism-first V8 preregistration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/package-adjustment-v8

          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path.cwd()
          V7=ROOT/"research"/"package-adjustment-v7"
          V8=ROOT/"research"/"package-adjustment-v8"

          OUT=V8/"topology_split_preregistration_v1.json"
          MAN=V8/"topology_split_preregistration_manifest_v1.json"
          MD=V8/"topology_split_preregistration_v1.md"

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()

          e=json.loads((V7/"development_evaluation_v1.json").read_text())
          snap=json.loads((V7/"phase1a_player_fv_snapshot_v1.json").read_text())
          c1=e["candidates"]["C1_V6_Q_TRANSFER"]
          generated=datetime.now(timezone.utc).isoformat()

          players=snap["players"]
          realism_eligible=[
              p for p in players
              if int(p["fv"]) >= 2500
              and p.get("team") not in (None,"")
              and str(p["key"]).lower() != "joe mixon"
          ]

          prereg={
            "schema_version":1,
            "study_id":"package-adjustment-v8-topology-split-multi-v-multi",
            "stage":"phase1_preregistration",
            "status":"FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE",
            "generated_at_utc":generated,

            "relationship_to_v7":{
              "v7_study_closed":True,
              "v7_stop_decision":"STOP_V7_MULTI_V_MULTI_NO_DEVELOPMENT_SIGNAL",
              "role":"hypothesis_generation_only",
              "v7_data_may_be_used_for_v8_fit":False,
              "v7_data_may_be_used_for_v8_selection":False,
              "v7_data_may_be_used_for_v8_stopping":False,
              "v7_challenge_overlap_allowed":False,
              "v7_ballot_reuse_allowed":False,
              "diagnostic":{
                "c1_overall_cv_improvement_vs_raw_sum":c1["improvement_vs_c0"],
                "c1_bootstrap_one_sided_95_ucb":c1["bootstrap"]["one_sided_95_ucb"],
                "c1_lopo_minimum_improvement":c1["leave_one_player_out"]["minimum_improvement_vs_c0"],
                "c1_topology_candidate_minus_c0":c1["topology_candidate_minus_c0"],
                "interpretation":
                    "V7 C1 improved five topologies but materially regressed 2v2. V8 tests a fresh zero-parameter topology split on higher-value, trade-realistic players only."
              }
            },

            "scope":{
              "assets":"players only",
              "draft_picks_allowed":False,
              "mixed_player_pick_trades_allowed":False,
              "topologies":["2v2","2v3","2v4","3v3","3v4","4v4"]
            },

            "candidate_family":{
              "C0_RAW_SUM":{
                "eligible_for_selection":False,
                "free_score_parameters":0,
                "score":"sum(v_i) on both sides for every topology"
              },
              "C1_TOPOLOGY_SPLIT_V6_TRANSFER":{
                "eligible_for_selection":True,
                "free_score_parameters":0,
                "q_v6":2.9897594788655337,
                "score":{
                  "2v2":"sum(v_i) on both sides exactly",
                  "all_other_topologies":"(sum(v_i**q_v6))**(1/q_v6) on both sides"
                }
              }
            },

            "trade_realism_contract":{
              "purpose":
                  "Prevent mathematically convenient but behaviorally unrealistic fringe-player trades from entering the fresh V8 experiment.",
              "player_eligibility":{
                "minimum_fv_all_assets":2500,
                "team_must_be_non_null":True,
                "manual_exclusions":["joe mixon"],
                "manual_exclusion_reason":
                    "Known retired/ineligible project asset; no stale player may be used merely because historical roster metadata still contains a team.",
                "player_must_exist_in_frozen_snapshot":True
              },
              "side_quality":{
                "minimum_one_asset_fv_per_side":4000,
                "minimum_side_raw_fv":{
                  "2_player_side":7000,
                  "3_player_side":9000,
                  "4_player_side":11500
                },
                "minimum_asset_share_of_own_side_raw_sum":0.10
              },
              "two_v_two_specific":{
                "minimum_fv_each_of_four_assets":3000,
                "minimum_one_asset_fv_per_side":4000,
                "reason":
                    "2v2 is the topology that failed V7 and must be studied using genuinely tradable assets, not fringe pieces."
              },
              "catalog_quality":{
                "maximum_player_appearances":2,
                "no_duplicate_trade_signature":True,
                "no_player_on_both_sides":True,
                "no_team_null_assets":True,
                "raw_sum_ratio_minimum":0.92,
                "preferred_raw_sum_ratio_target":0.97
              },
              "selection_priority_order":[
                "hard trade-realism eligibility gates",
                "required topology / direction / concentration-band cell",
                "maximize minimum asset FV across both sides",
                "minimize count of assets below 3000 FV",
                "maximize lower of the two side apex FVs",
                "minimize player reuse",
                "position-coverage deficit tie-break only",
                "distance from target concentration contrast",
                "distance from preferred raw-sum ratio",
                "deterministic signature tie-break"
              ],
              "position_coverage_is_secondary_to_realism":True,
              "minimum_catalog_position_challenges":{
                "QB":4,"RB":4,"WR":4,"TE":4,"DL":4,"LB":4,"DB":4
              },
              "frozen_snapshot_diagnostics":{
                "snapshot_total_players":len(players),
                "eligible_players_after_2500_team_and_manual_filters":len(realism_eligible)
              }
            },

            "development_catalog_preregistration":{
              "challenge_count":40,
              "topology_counts":{
                "2v2":10,
                "2v3":6,
                "2v4":6,
                "3v3":6,
                "3v4":6,
                "4v4":6
              },
              "fresh_challenges_required":True,
              "candidate_prediction_used_for_selection":False,
              "fv_visible_to_voter":False,
              "raw_sum_ratio_minimum":0.92,
              "contrast_bands":{
                "low":[0.012,0.06],
                "moderate":[0.05,0.12],
                "high":[0.10,0.30]
              },
              "direction_balance_required":True,
              "all_40_presented_to_each_participating_voter":True,
              "display_side_randomization_required":True,
              "challenge_order_randomization_required":True
            },

            "catalog_generation_firewalls":{
              "generator_must_validate_every_asset_against_trade_realism_contract":True,
              "generator_must_emit_rejection_counts_by_reason":True,
              "generator_must_emit_catalog_value_distribution":True,
              "generator_must_emit_each_trade_min_asset_fv":True,
              "generator_must_emit_each_side_apex_fv":True,
              "generator_must_emit_team_null_count":True,
              "team_null_count_must_equal_zero":True,
              "minimum_catalog_asset_fv_must_be_at_least":2500,
              "minimum_2v2_asset_fv_must_be_at_least":3000,
              "minimum_each_side_apex_fv_must_be_at_least":4000,
              "no_votes_may_be_collected_before_catalog_audit_passes":True
            },

            "power_and_maturity":{
              "power_analysis_must_be_frozen_before_catalog":True,
              "power_target":0.80,
              "maximum_unique_voters":50,
              "vote_direction_may_not_be_read_for_maturity_stopping":True,
              "candidate_performance_may_not_be_read_for_maturity_stopping":True,
              "same_human_voters_as_v7_may_participate":True,
              "fresh_challenges_are_the_independence_boundary":True
            },

            "development_evaluation":{
              "primary_metric":
                  "equal-topology macro mean log loss from 5-fold deterministic stratified grouped challenge OOF predictions",
              "fold_count":5,
              "grouping_unit":"challenge_id",
              "all_votes_for_a_challenge_stay_in_one_fold":True,
              "parameters_fit_on_training_challenges_only":True,
              "nuisance_parameters":{
                "beta_bounds":[0.05,25.0],
                "delta_left_bounds":[-0.75,0.75],
                "score_parameters":0
              },
              "weighting":
                  "equal weight to each of six topologies; within topology equal challenge weight; within challenge equal voter weight",
              "eligibility_gates":{
                "combined_cv_improvement_vs_c0_min":0.005,
                "folds_improved_min":4,
                "topologies_improve_or_within_0_002_min":6,
                "worst_topology_regression_max":0.010,
                "crossed_bootstrap_one_sided_95_ucb_candidate_minus_c0_lt":0.0,
                "delta_left_zero_ranking_must_be_unchanged":True,
                "leave_one_player_out_improvement_must_be_positive_for_every_player":True,
                "mathematical_invariants_must_pass":True
              },
              "uncertainty":{
                "method":"crossed/two-way voter-and-challenge cluster bootstrap",
                "draws":10000,
                "seed":20260926,
                "one_sided_confidence":0.95
              },
              "if_candidate_fails_any_gate":
                  "STOP_V8_TOPOLOGY_SPLIT_NO_DEVELOPMENT_CONFIRMATION",
              "if_candidate_passes_all_gates":
                  "FREEZE_V8_TOPOLOGY_SPLIT_DEVELOPMENT_CANDIDATE_AND_BUILD_FRESH_CONFIRMATION_POWER",
              "no_posthoc_rescue_model":True
            },

            "confirmation_if_development_passes":{
              "fresh_nonoverlapping_challenge_catalog_required":True,
              "candidate_frozen_before_confirmation_catalog":True,
              "confirmation_sample_size_frozen_by_pre_vote_power_analysis":True,
              "same_voters_may_participate":True,
              "human_production_approval_required":True,
              "automatic_production_promotion_allowed":False
            },

            "production_firewall":{
              "current_package_adjustment_v1_7_unchanged":True,
              "multi_v_multi_remains_fail_closed":True,
              "legacy_1v2_1v3_behavior_must_remain_unchanged":True,
              "automatic_production_change_authorized":False
            },

            "next_if_green":
                "Run Phase 1A pre-vote power analysis. Then build a fresh realism-constrained catalog and audit it before any voting activation."
          }

          OUT.write_text(json.dumps(prereg,indent=2,sort_keys=True)+"\n")

          manifest={
            "schema_version":1,
            "study_id":prereg["study_id"],
            "stage":"phase1_preregistration_manifest",
            "status":prereg["status"],
            "generated_at_utc":generated,
            "inputs":{
              "v7_development_evaluation_sha256":
                  sha(V7/"development_evaluation_v1.json"),
              "v7_frozen_development_data_sha256":
                  sha(V7/"development_first_qualification_frozen_v1.json"),
              "v7_preregistration_sha256":
                  sha(V7/"phase1_multi_vs_multi_preregistration_v1.json"),
              "v7_player_snapshot_sha256":
                  sha(V7/"phase1a_player_fv_snapshot_v1.json"),
              "v7_catalog_generator_sha256":
                  sha(V7/"generate_multi_vs_multi_catalog_v1.py")
            },
            "output_sha256":sha(OUT),
            "trade_realism_contract_frozen":True,
            "power_analysis_performed":False,
            "development_catalog_generated":False,
            "v8_votes_read":False,
            "candidate_fit_performed":False,
            "candidate_selection_performed":False,
            "production_change_authorized":False
          }
          MAN.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")

          lines=[
            "# Package Adjustment V8 — Topology Split + Trade Realism Preregistration","",
            "**Status:** `FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE`","",
            "V7 is scientifically closed. V8 uses V7 only to motivate a fresh topology-split hypothesis.","",
            "## Model hypothesis","",
            "- 2v2: exact raw sum.",
            "- 2v3 / 2v4 / 3v3 / 3v4 / 4v4: exact V6 power-norm transfer.",
            "- New score parameters: **0**.","",
            "## Hard trade-realism rules","",
            "- Every player: **FV >= 2500**.",
            "- Every player must have a non-null current team in the frozen snapshot.",
            "- Joe Mixon is explicitly excluded.",
            "- Every side must contain at least one **FV >= 4000** asset.",
            "- 2v2: **all four players FV >= 3000**.",
            "- Minimum side raw FV: 2-player=7000; 3-player=9000; 4-player=11500.",
            "- Position coverage is secondary; it may not force fringe-player inclusion.","",
            "## Fresh study","",
            "- 40 new trades: 10×2v2 and 6× each other topology.",
            "- V7 challenge/ballot reuse forbidden.",
            "- Power analysis must freeze before catalog generation.",
            "- Catalog must pass a dedicated realism audit before voting can activate.",
            "- Production remains unchanged."
          ]
          MD.write_text("\n".join(lines)+"\n")

          print(json.dumps({
            "decision":"FREEZE_V8_REALISM_FIRST_PREREGISTRATION",
            "candidate":"C1_TOPOLOGY_SPLIT_V6_TRANSFER",
            "minimum_asset_fv":2500,
            "minimum_2v2_asset_fv":3000,
            "minimum_side_apex_fv":4000,
            "eligible_snapshot_players":len(realism_eligible),
            "development_challenges":40,
            "production_change_authorized":False
          },indent=2))
          PY

      - name: Validate realism-first preregistration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          d=Path("research/package-adjustment-v8")
          p=json.loads((d/"topology_split_preregistration_v1.json").read_text())
          m=json.loads((d/"topology_split_preregistration_manifest_v1.json").read_text())

          assert p["status"]=="FROZEN_PRE_POWER_PRE_CATALOG_PRE_VOTE"
          assert p["relationship_to_v7"]["v7_study_closed"] is True
          assert p["relationship_to_v7"]["v7_data_may_be_used_for_v8_fit"] is False

          r=p["trade_realism_contract"]
          assert r["player_eligibility"]["minimum_fv_all_assets"]==2500
          assert r["player_eligibility"]["team_must_be_non_null"] is True
          assert "joe mixon" in r["player_eligibility"]["manual_exclusions"]
          assert r["side_quality"]["minimum_one_asset_fv_per_side"]==4000
          assert r["two_v_two_specific"]["minimum_fv_each_of_four_assets"]==3000
          assert r["position_coverage_is_secondary_to_realism"] is True

          g=p["catalog_generation_firewalls"]
          assert g["minimum_catalog_asset_fv_must_be_at_least"]==2500
          assert g["minimum_2v2_asset_fv_must_be_at_least"]==3000
          assert g["minimum_each_side_apex_fv_must_be_at_least"]==4000
          assert g["team_null_count_must_equal_zero"] is True
          assert g["no_votes_may_be_collected_before_catalog_audit_passes"] is True

          dc=p["development_catalog_preregistration"]
          assert dc["challenge_count"]==40
          assert dc["topology_counts"]=={
              "2v2":10,"2v3":6,"2v4":6,"3v3":6,"3v4":6,"4v4":6
          }
          assert sum(dc["topology_counts"].values())==40

          assert p["development_evaluation"]["no_posthoc_rescue_model"] is True
          assert p["production_firewall"]["current_package_adjustment_v1_7_unchanged"] is True
          assert p["production_firewall"]["automatic_production_change_authorized"] is False

          digest=hashlib.sha256(
              (d/"topology_split_preregistration_v1.json").read_bytes()
          ).hexdigest()
          assert m["output_sha256"]==digest
          assert m["trade_realism_contract_frozen"] is True
          assert m["power_analysis_performed"] is False
          assert m["development_catalog_generated"] is False
          assert m["v8_votes_read"] is False
          assert m["candidate_fit_performed"] is False
          assert m["production_change_authorized"] is False

          print("PASS: realism-first V8 preregistration and firewalls verified.")
          PY

          python3 scripts/validation/check_package_adjustment_live.py

      - name: Prove exact change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' |
            sort
          )
          expected=(
            research/package-adjustment-v8/topology_split_preregistration_manifest_v1.json
            research/package-adjustment-v8/topology_split_preregistration_v1.json
            research/package-adjustment-v8/topology_split_preregistration_v1.md
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(printf '%s\n' "${changed[@]}" | sort)

      - name: Commit frozen preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/package-adjustment-v8/topology_split_preregistration_v1.json \
            research/package-adjustment-v8/topology_split_preregistration_manifest_v1.json \
            research/package-adjustment-v8/topology_split_preregistration_v1.md

          git diff --cached --quiet && {
            echo "ERROR: no preregistration changes staged"
            exit 1
          }

          git commit -m "Preregister realism-first Package Adjustment V8"

          git fetch origin main
          critical=(
            research/package-adjustment-v7/development_evaluation_v1.json
            research/package-adjustment-v7/development_first_qualification_frozen_v1.json
            research/package-adjustment-v7/phase1_multi_vs_multi_preregistration_v1.json
            research/package-adjustment-v7/phase1a_player_fv_snapshot_v1.json
            research/package-adjustment-v7/generate_multi_vs_multi_catalog_v1.py
            scripts/validation/check_package_adjustment_live.py
          )
          for p in "${critical[@]}"; do
            test "$(git rev-parse "$BASE_SHA:$p")" = \
                 "$(git rev-parse "origin/main:$p")" || {
              echo "ERROR: frozen source changed during preregistration: $p"
              exit 1
            }
          done

          git rebase origin/main
          python3 scripts/validation/check_package_adjustment_live.py
          git push origin HEAD:main
