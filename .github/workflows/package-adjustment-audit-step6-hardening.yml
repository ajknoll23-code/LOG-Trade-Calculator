name: Package Adjustment Audit Step 6 Hardening

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harden live scope and unsupported-shape UI
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          ROOT = Path(".")
          INDEX = ROOT / "index.html"
          LIVE = ROOT / "research/package-adjustment-production-candidate-v1/live_deployment.json"
          PLAN = ROOT / "research/package-adjustment-production-candidate-v1/audit_clean_plan.md"
          ANALYSIS = ROOT / "research/package-adjustment-production-candidate-v1/audit_step6_scope_ui_idp_analysis.json"
          RELEASE = ROOT / "research/package-adjustment-production-candidate-v1/prospective/release_manifest.json"
          FREEZE = ROOT / "research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze/manifest.json"
          V3 = ROOT / "research/package-adjustment-v3/package_vote_challenges_v3.json"
          V4 = ROOT / "research/package-adjustment-v4/package_vote_challenges_v4.json"

          OUT_JSON = ROOT / "research/package-adjustment-production-candidate-v1/audit_step6_policy_hardening.json"
          OUT_MD = ROOT / "research/package-adjustment-production-candidate-v1/audit_step6_policy_hardening.md"

          EXPECTED_POSITIONS = ["QB", "RB", "WR", "TE", "DL", "LB", "DB"]

          for p in (INDEX, LIVE, PLAN, ANALYSIS, RELEASE, FREEZE, V3, V4):
              if not p.exists():
                  raise RuntimeError(f"Required file missing: {p}")

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def function_span(text, name):
              marker = f"function {name}("
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f"Function not found: {name}")
              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError(f"Opening brace not found: {name}")
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ("'", '"', "`"):
                          quote = ch
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1
              raise RuntimeError(f"Unclosed function: {name}")

          live = read_json(LIVE)
          analysis = read_json(ANALYSIS)

          if live.get("status") != "controlled_live":
              raise RuntimeError("Package Adjustment is not controlled_live")
          if live.get("production_formula_enabled") is not True:
              raise RuntimeError("Package Adjustment production formula is not enabled")
          if analysis.get("production_changed") is not False:
              raise RuntimeError("Step 6 analysis unexpectedly changed production")
          if analysis.get("current_position_guard_present") is not False:
              raise RuntimeError("Corrected Step 6 analysis must show no current position guard")
          if analysis.get("kicker_scope", {}).get("scope_leak") is not True:
              raise RuntimeError("Corrected Step 6 analysis must show the K scope leak")

          evidence_positions = analysis.get("frozen_evidence_positions", {}).get(
              "supported_on_both_target_and_package_sides"
          )
          if sorted(evidence_positions or []) != sorted(EXPECTED_POSITIONS):
              raise RuntimeError(f"Unexpected evidence-supported position set: {evidence_positions}")

          if analysis.get("idp_consistency", {}).get(
              "all_idp_positions_supported_by_frozen_evidence"
          ) is not True:
              raise RuntimeError("Frozen evidence does not support all IDP positions")
          if analysis.get("idp_consistency", {}).get(
              "separate_idp_multiplier_supported_by_evidence"
          ) is not False:
              raise RuntimeError("Unexpected evidence for a separate IDP multiplier")

          protected_before = {
              "release_manifest": sha256(RELEASE),
              "vote_freeze_manifest": sha256(FREEZE),
              "v3_catalog": sha256(V3),
              "v4_catalog": sha256(V4),
          }

          text = INDEX.read_text(encoding="utf-8")

          config_marker = "  meaningfulPieceMinTargetShare: 0.06,\n"
          config_insert = (
              config_marker
              + "  supportedPlayerPositions: Object.freeze("
              + json.dumps(EXPECTED_POSITIONS, separators=(",", ":"))
              + "),\n"
          )
          if "supportedPlayerPositions:" in text:
              raise RuntimeError("Step 6 supported-position config already exists")
          if config_marker not in text:
              raise RuntimeError("Package Adjustment config marker not found")
          text = text.replace(config_marker, config_insert, 1)

          old_start, old_end = function_span(text, "packageAdjustmentForTrade")

          assessment_code = r'''function packageAdjustmentAssessment(){
            if(!PACKAGE_ADJUSTMENT_PRODUCTION_V1.enabled){
              return {status:'not_applicable', reason:'disabled'};
            }

            const aAssets = state.A || [];
            const bAssets = state.B || [];

            if(!aAssets.length || !bAssets.length){
              return {status:'not_applicable', reason:'incomplete_trade'};
            }

            const allAssets = [...aAssets, ...bAssets];

            if(allAssets.some(a => a.type !== 'player')){
              return {
                status:'unsupported',
                reason:'player_only_scope',
                message:'Package Adjustment is calibrated only for player-only consolidation trades.',
              };
            }

            const supportedPositions = PACKAGE_ADJUSTMENT_PRODUCTION_V1.supportedPlayerPositions;
            const unsupportedPositions = [...new Set(
              allAssets
                .map(a => String((a && a.pos) || '').toUpperCase())
                .filter(pos => !supportedPositions.includes(pos))
            )];

            if(unsupportedPositions.length){
              return {
                status:'unsupported',
                reason:'unsupported_position',
                unsupportedPositions,
                message:
                  `Package Adjustment is not calibrated for ${unsupportedPositions.join(', ')}. ` +
                  `Supported positions are ${supportedPositions.join(', ')}.`,
              };
            }

            let targetSide = null, packageSide = null;

            if(aAssets.length === 1 && bAssets.length >= 2){
              targetSide = 'A';
              packageSide = 'B';
            } else if(bAssets.length === 1 && aAssets.length >= 2){
              targetSide = 'B';
              packageSide = 'A';
            } else if(aAssets.length === 1 && bAssets.length === 1){
              return {status:'not_applicable', reason:'one_for_one'};
            } else {
              return {
                status:'unsupported',
                reason:'multi_vs_multi',
                message:'Package Adjustment is calibrated only for one player versus a consolidation package.',
              };
            }

            const targetAsset = state[targetSide][0];
            const packageAssets = state[packageSide];
            const targetFv = Number(targetAsset && targetAsset.value);
            const packageValues = packageAssets.map(a => Number(a.value));

            if(!(targetFv > 0) || packageValues.some(v => !Number.isFinite(v) || v <= 0)){
              return {
                status:'unsupported',
                reason:'invalid_player_value',
                message:'Package Adjustment could not evaluate this package because a player value is unavailable.',
              };
            }

            if(packageValues.some(v => v >= targetFv)){
              return {
                status:'unsupported',
                reason:'package_piece_at_or_above_target',
                message:'Package Adjustment is calibrated only when every package player is individually below the target player.',
              };
            }

            const meaningfulCutoff =
              targetFv * PACKAGE_ADJUSTMENT_PRODUCTION_V1.meaningfulPieceMinTargetShare;
            const meaningful = packageValues.filter(v => v >= meaningfulCutoff);

            if(meaningful.length < 2){
              return {
                status:'not_applicable',
                reason:'effective_one_for_one_after_tiny_filter',
              };
            }

            if(meaningful.length > 3){
              return {
                status:'unsupported',
                reason:'more_than_three_meaningful_players',
                meaningfulCount: meaningful.length,
                message:'Package Adjustment is calibrated only for packages with two or three meaningful players.',
              };
            }

            const rawPackageFv = packageValues.reduce((s,v) => s + v, 0);
            const meaningfulPackageFv = meaningful.reduce((s,v) => s + v, 0);
            const tinyPackageFv = rawPackageFv - meaningfulPackageFv;
            const size2Multiplier = packageAdjustmentSize2Multiplier(targetFv);

            if(!(size2Multiplier >= 1)){
              return {
                status:'unsupported',
                reason:'size2_multiplier_unavailable',
                message:'Package Adjustment could not resolve the live two-player target curve.',
              };
            }

            let multiplier = size2Multiplier;
            let premiumTier = '2-player';
            let materialThird = false;
            let compositionSupported = null;
            let largestMeaningfulPackageShare = null;
            let middleMeaningfulPackageShare = null;
            let smallestMeaningfulPackageShare = null;

            if(meaningful.length === 2){
              const orderedMeaningful = [...meaningful].sort((a,b) => b - a);
              largestMeaningfulPackageShare = orderedMeaningful[0] / meaningfulPackageFv;
              smallestMeaningfulPackageShare = orderedMeaningful[1] / meaningfulPackageFv;

              const envelope = PACKAGE_ADJUSTMENT_PRODUCTION_V1.size2CompositionEnvelope;
              const compositionEpsilon = 1e-12;
              compositionSupported =
                largestMeaningfulPackageShare >= envelope.largestMin - compositionEpsilon &&
                largestMeaningfulPackageShare <= envelope.largestMax + compositionEpsilon &&
                smallestMeaningfulPackageShare >= envelope.smallestMin - compositionEpsilon &&
                smallestMeaningfulPackageShare <= envelope.smallestMax + compositionEpsilon;

              if(!compositionSupported){
                return {
                  status:'unsupported',
                  reason:'size2_composition_outside_frozen_v3_envelope',
                  meaningfulCount: 2,
                  largestMeaningfulPackageShare,
                  smallestMeaningfulPackageShare,
                  message:'This two-player package is outside the frozen V3 51/49 composition envelope.',
                };
              }
            }

            if(meaningful.length === 3){
              const orderedMeaningful = [...meaningful].sort((a,b) => b - a);
              largestMeaningfulPackageShare = orderedMeaningful[0] / meaningfulPackageFv;
              middleMeaningfulPackageShare = orderedMeaningful[1] / meaningfulPackageFv;
              smallestMeaningfulPackageShare = orderedMeaningful[2] / meaningfulPackageFv;

              const envelope = PACKAGE_ADJUSTMENT_PRODUCTION_V1.size3CompositionEnvelope;
              const compositionEpsilon = 1e-12;
              compositionSupported =
                largestMeaningfulPackageShare >= envelope.largestMin - compositionEpsilon &&
                largestMeaningfulPackageShare <= envelope.largestMax + compositionEpsilon &&
                middleMeaningfulPackageShare >= envelope.middleMin - compositionEpsilon &&
                middleMeaningfulPackageShare <= envelope.middleMax + compositionEpsilon &&
                smallestMeaningfulPackageShare >= envelope.smallestMin - compositionEpsilon &&
                smallestMeaningfulPackageShare <= envelope.smallestMax + compositionEpsilon;

              materialThird = compositionSupported;

              if(!compositionSupported){
                return {
                  status:'unsupported',
                  reason:'size3_composition_outside_frozen_v4_envelope',
                  meaningfulCount: 3,
                  largestMeaningfulPackageShare,
                  middleMeaningfulPackageShare,
                  smallestMeaningfulPackageShare,
                  message:'This three-player package is outside the frozen V4 45/33/22 composition envelope.',
                };
              }

              multiplier = PACKAGE_ADJUSTMENT_PRODUCTION_V1.size3Multiplier;
              premiumTier = '3-player';
            }

            const tradeEquivalentTargetFv = targetFv * multiplier;
            const adjustment = Math.max(0, tradeEquivalentTargetFv - targetFv);

            const packageAdjustment = {
              targetSide, packageSide, targetAsset, targetFv, rawPackageFv,
              meaningfulPackageFv, tinyPackageFv,
              meaningfulCount: meaningful.length, multiplier, premiumTier,
              materialThird, compositionSupported,
              largestMeaningfulPackageShare, middleMeaningfulPackageShare,
              smallestMeaningfulPackageShare,
              adjustment, tradeEquivalentTargetFv,
            };

            return {
              status:'applied',
              reason:null,
              packageAdjustment,
            };
          }

          function packageAdjustmentForTrade(){
            const assessment = packageAdjustmentAssessment();
            return assessment.status === 'applied'
              ? assessment.packageAdjustment
              : null;
          }'''

          text = text[:old_start] + assessment_code + text[old_end:]

          render_start, render_end = function_span(text, "renderPackageAdjustment")
          render_fn = text[render_start:render_end]

          old_render_gate = '''  const pkg = packageAdjustmentForTrade();
            if(!pkg){ wrap.innerHTML = ''; return; }
          '''
          new_render_gate = '''  const assessment = packageAdjustmentAssessment();

            if(assessment.status === 'not_applicable'){
              wrap.innerHTML = '';
              return;
            }

            if(assessment.status === 'unsupported'){
              const detail = escapeHtml(
                assessment.message || 'This trade shape is outside the calibrated Package Adjustment scope.'
              );
              wrap.innerHTML = `
                <div class="trade-impact" style="margin-top:10px;border-color:var(--line-strong);">
                  <div class="trade-impact-title">Package Adjustment · Not Applied</div>
                  <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">
                    ${detail}
                  </div>
                  <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);margin-top:6px;">
                    Raw Fundamental Value and the normal trade verdict still apply. No unsupported consolidation premium was added.
                  </div>
                </div>
              `;
              return;
            }

            const pkg = assessment.packageAdjustment;
          '''
          if old_render_gate not in render_fn:
              raise RuntimeError("Expected renderPackageAdjustment null gate not found")
          render_fn = render_fn.replace(old_render_gate, new_render_gate, 1)
          text = text[:render_start] + render_fn + text[render_end:]

          INDEX.write_text(text, encoding="utf-8")

          now = datetime.now(timezone.utc).isoformat()

          formula = live.setdefault("formula", {})
          formula["supported_player_positions"] = EXPECTED_POSITIONS
          formula["position_scope_policy"] = (
              "frozen_v3_v4_target_and_package_position_intersection_fail_closed"
          )

          live["production_revision"] = "v1.5-audit-step6-scope-ui-idp"
          live["last_audit_hardening_at_utc"] = now

          hardening = live.setdefault("audit_hardening", {})
          hardening["evidence_bounded_position_scope_guard"] = True
          hardening["kicker_package_adjustment_excluded"] = True
          hardening["idp_uses_same_package_adjustment_rules_as_offense"] = True
          hardening["unsupported_scope_ui_reason"] = True
          hardening["one_for_one_remains_quiet_not_applicable"] = True
          hardening["step6_live_hardening_complete"] = True
          hardening["step6_monitor_realign_required"] = True
          hardening["exact_live_monitor_revision_aligned"] = False

          live["exact_live_prospective_monitoring"] = False
          live["postlaunch_monitoring_required"] = True

          for key in (
              "fundamental_value_consumer_changed",
              "market_value_consumer_changed",
              "draft_pick_value_consumer_changed",
              "team_utility_consumer_changed",
          ):
              if live.get(key) is not False:
                  raise RuntimeError(f"Unexpected consumer flag before Step 6: {key}")
          if live.get("trade_verdict_consumer_changed") is not True:
              raise RuntimeError("Trade verdict consumer flag unexpectedly false")

          LIVE.write_text(
              json.dumps(live, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          plan = PLAN.read_text(encoding="utf-8")
          old_plan = "- [ ] Step 6 — Unsupported-shape UI + scope guards + IDP consistency"
          new_plan = "\n".join([
              "- [ ] Step 6 — Unsupported-shape UI + scope guards + IDP consistency",
              "  - Live scope/UI hardening installed: unsupported shapes now explain why Package Adjustment was not applied.",
              "  - Package Adjustment is explicitly limited to QB/RB/WR/TE/DL/LB/DB, the frozen V3/V4 evidence-supported positions.",
              "  - K is fail-closed; DL/LB/DB use the same evidence-bounded Package Adjustment rules as offense.",
              "  - Pending before this gate closes: re-freeze/re-align the exact-live Step 4 OOS monitor to production revision V1.5.",
          ])
          if old_plan not in plan:
              raise RuntimeError("Expected unchecked Step 6 plan entry not found")
          plan = plan.replace(old_plan, new_plan, 1)
          PLAN.write_text(plan, encoding="utf-8")

          protected_after = {
              "release_manifest": sha256(RELEASE),
              "vote_freeze_manifest": sha256(FREEZE),
              "v3_catalog": sha256(V3),
              "v4_catalog": sha256(V4),
          }
          if protected_after != protected_before:
              raise RuntimeError("Frozen Step 4/5/V3/V4 evidence changed during Step 6 hardening")

          result = {
              "schema_version": 1,
              "status": "package_adjustment_audit_step6_live_hardening",
              "generated_at_utc": now,
              "production_revision": live["production_revision"],
              "supported_player_positions": EXPECTED_POSITIONS,
              "position_scope_policy": formula["position_scope_policy"],
              "kicker_excluded": True,
              "idp_positions": ["DL", "LB", "DB"],
              "idp_same_rules_as_offense": True,
              "unsupported_scope_ui_enabled": True,
              "one_for_one_ui_remains_quiet": True,
              "fundamental_value_changed": False,
              "market_value_changed": False,
              "draft_pick_values_changed": False,
              "team_utility_changed": False,
              "trade_verdict_scope_guard_changed": True,
              "frozen_evidence_changed": False,
              "step4_release_manifest_changed": False,
              "step6_gate_complete": False,
              "pending_requirement": (
                  "Re-align exact-live prospective/OOS monitoring to V1.5 "
                  "supported-position scope before checking Step 6."
              ),
              "protected_sha256": protected_after,
          }
          OUT_JSON.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = [
              "# Package Adjustment Step 6 — Live Scope/UI Hardening",
              "",
              f"Generated: {now}",
              "",
              "## Installed",
              "",
              "- Explicit supported-position scope: **QB, RB, WR, TE, DL, LB, DB**.",
              "- **K fails closed** because it is absent from frozen V3/V4 evidence.",
              "- **DL/LB/DB remain fully eligible** under the same Package Adjustment rules as offense.",
              "- Unsupported shapes now show a compact `Package Adjustment · Not Applied` explanation.",
              "- The explanation explicitly states that raw Fundamental Value and the normal verdict still apply.",
              "- Ordinary 1-for-1 trades remain quiet/not-applicable.",
              "",
              "## Unchanged",
              "",
              "- V3 size2 multiplier curve.",
              "- V3 size2 composition envelope.",
              "- V4 size3 multiplier.",
              "- V4 size3 composition envelope.",
              "- 6% meaningful-piece threshold and tiny-padding behavior.",
              "- Fundamental Value, Market Value, draft-pick values, and Team Utility.",
              "",
              "## Remaining Step 6 requirement",
              "",
              "The Step 4 exact-live OOS monitor predates this supported-position scope.",
              "It is intentionally marked **not revision-aligned** until it is re-frozen",
              "against production revision V1.5. Step 6 stays unchecked until that is done.",
              "",
          ]
          OUT_MD.write_text("\n".join(md), encoding="utf-8")

          print("Step 6 live scope/UI hardening installed.")
          print("Supported positions:", EXPECTED_POSITIONS)
          print("K excluded: True")
          print("IDP same rules as offense: True")
          print("Step 6 gate complete: False — exact-live monitor realignment still required")
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          if not blocks:
              raise RuntimeError("No inline script blocks found")

          for block in blocks:
              with tempfile.NamedTemporaryFile(
                  mode="w", suffix=".js", encoding="utf-8", delete=False
              ) as fh:
                  fh.write(block)
                  name = fh.name
              subprocess.run(["node", "--check", name], check=True)

          print(f"node --check passed for {len(blocks)} inline script block(s)")
          PY

      - name: Self-test exact live Package Adjustment scope
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          start = html.find("const PACKAGE_ADJUSTMENT_PRODUCTION_V1 = Object.freeze({")
          end = html.find("function tradeVerdictTotals(){", start)
          if start < 0 or end < 0:
              raise RuntimeError("Could not isolate Package Adjustment runtime")

          snippet = html[start:end]
          harness = r'''
          let state = {A:[], B:[]};

          function player(pos, value, name='P'){
            return {type:'player', pos, value, name};
          }
          function pick(value=1000){
            return {type:'pick', value, name:'Pick'};
          }
          function assess(a, b){
            state = {A:a, B:b};
            return packageAdjustmentAssessment();
          }
          function check(cond, msg){
            if(!cond) throw new Error(msg);
          }

          let r;

          r = assess(
            [player('QB', 5000, 'Target')],
            [player('RB', 2550), player('WR', 2450)]
          );
          check(r.status === 'applied', 'supported 51/49 size2 should apply');

          r = assess(
            [player('DL', 5000, 'IDP Target')],
            [player('LB', 2550), player('DB', 2450)]
          );
          check(r.status === 'applied', 'DL/LB/DB should use same rules as offense');

          r = assess(
            [player('QB', 5000, 'Target')],
            [player('RB', 2250), player('LB', 1650), player('DB', 1100)]
          );
          check(r.status === 'applied', 'supported 45/33/22 size3 should apply');

          r = assess(
            [player('K', 5000, 'K Target')],
            [player('RB', 2550), player('WR', 2450)]
          );
          check(r.status === 'unsupported', 'K target must fail closed');
          check(r.reason === 'unsupported_position', 'K target reason');

          r = assess(
            [player('QB', 5000, 'Target')],
            [player('K', 2550), player('WR', 2450)]
          );
          check(r.status === 'unsupported', 'K package player must fail closed');
          check(r.reason === 'unsupported_position', 'K package reason');

          r = assess(
            [player('QB', 5000, 'Target')],
            [player('RB', 3000), player('WR', 2000)]
          );
          check(r.status === 'unsupported', '60/40 size2 must fail closed');
          check(
            r.reason === 'size2_composition_outside_frozen_v3_envelope',
            '60/40 reason'
          );

          r = assess(
            [player('QB', 5000, 'Target')],
            [player('RB', 1300), player('WR', 1250), player('TE', 1250), player('LB', 1200)]
          );
          check(r.status === 'unsupported', 'four meaningful players must fail closed');
          check(r.reason === 'more_than_three_meaningful_players', 'four meaningful reason');

          r = assess(
            [player('QB', 5000, 'Target')],
            [player('RB', 2550), player('WR', 2450), player('DB', 200)]
          );
          check(r.status === 'applied', 'tiny padding must not break size2 eligibility');
          check(r.packageAdjustment.meaningfulCount === 2, 'tiny padding meaningful count');
          check(r.packageAdjustment.rawPackageFv === 5200, 'tiny padding raw FV retained');
          check(r.packageAdjustment.tinyPackageFv === 200, 'tiny padding FV tracked');

          r = assess([player('QB', 5000)], [player('RB', 2500)]);
          check(r.status === 'not_applicable', '1-for-1 must stay quiet/not applicable');

          r = assess(
            [player('QB', 5000)],
            [player('RB', 2550), pick(2450)]
          );
          check(r.status === 'unsupported', 'pick-containing package must be unsupported');
          check(r.reason === 'player_only_scope', 'pick scope reason');

          r = assess(
            [player('QB', 2500), player('RB', 2400)],
            [player('WR', 2500), player('TE', 2400)]
          );
          check(r.status === 'unsupported', 'multi-v-multi must be unsupported');
          check(r.reason === 'multi_vs_multi', 'multi-v-multi reason');

          r = assess(
            [player('QB', 5000)],
            [player('RB', 5000), player('WR', 1000)]
          );
          check(r.status === 'unsupported', 'package piece at target must fail closed');
          check(r.reason === 'package_piece_at_or_above_target', 'target-equal reason');

          console.log('Package Adjustment Step 6 scope self-test passed.');
          '''

          Path("/tmp/package-adjustment-step6-selftest.js").write_text(
              snippet + "\n" + harness,
              encoding="utf-8",
          )
          PY
          node /tmp/package-adjustment-step6-selftest.js

      - name: Validate JSON artifacts
        run: |
          python -m json.tool \
            research/package-adjustment-production-candidate-v1/live_deployment.json \
            >/dev/null
          python -m json.tool \
            research/package-adjustment-production-candidate-v1/audit_step6_policy_hardening.json \
            >/dev/null

      - name: Install regression-check dependency
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Run repository regression checks
        run: |
          python scripts/validation/repo_regression_checks.py

      - name: Protect frozen evidence and release manifests
        run: |
          git diff --exit-code -- \
            research/package-adjustment-production-candidate-v1/prospective/release_manifest.json \
            research/package-adjustment-production-candidate-v1/prelaunch-vote-freeze/manifest.json \
            research/package-adjustment-v3/package_vote_challenges_v3.json \
            research/package-adjustment-v4/package_vote_challenges_v4.json

      - name: Show Step 6 hardening status
        run: |
          cat research/package-adjustment-production-candidate-v1/audit_step6_policy_hardening.md
          echo
          git diff --check
          git status --short

      - name: Commit Step 6 live hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            research/package-adjustment-production-candidate-v1/live_deployment.json \
            research/package-adjustment-production-candidate-v1/audit_clean_plan.md \
            research/package-adjustment-production-candidate-v1/audit_step6_policy_hardening.json \
            research/package-adjustment-production-candidate-v1/audit_step6_policy_hardening.md

          if git diff --cached --quiet; then
            echo "No Step 6 hardening changes to commit."
            exit 0
          fi

          git commit -m "Harden Package Adjustment scope and unsupported UI"
          git pull --rebase origin main
          git push origin HEAD:main
