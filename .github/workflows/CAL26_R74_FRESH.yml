name: CAL26 V1R74 - Chronological Next Season Dynasty Continuation Shadow (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r74-next-season-h1
  cancel-in-progress: false
jobs:
  chronological-next-season-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout pinned live FV reference read only
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Fetch frozen R63 evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_V1R63_SEVEN_POSITION_CHRONOLOGICAL_WEEK6_FV_HOLD
        run-id: 40064045458
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r74-in/R63
    - name: Fetch frozen R69 evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R69_WEEK6_ROS_EMPIRICAL_HOLDOUT_RESEARCH_FV_HOLD
        run-id: 40098428241
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r74-in/R69
    - name: Fetch frozen R70 evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R70_SINGLE_SOURCE_YEAR0_SURPLUS_AND_SCALE_HOLD
        run-id: 40099257160
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r74-in/R70
    - name: Fetch frozen R72 evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R72_518_NATIVE_FV_FORMULA_REPLAY_AND_SENSITIVITY_FV_HOLD
        run-id: 40102341863
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r74-in/R72
    - name: Fetch frozen R73 evidence artifact
      uses: actions/download-artifact@v4
      with:
        name: CAL26_R73_EXACT_LIVE_FV_EMPIRICAL_PEER_SHADOW_NO_PRICE_RELEASE
        run-id: 40105290857
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: ${{ runner.temp }}/cal26-r74-in/R73
    - name: 2024 to 2025 chronological next-season evidence; 2026 to 2027 shadow only
      shell: bash
      run: |-
        set -euo pipefail
        # Exact live JS baseline underpinning R72/R73 must still be the deployed code.
        test "$(git hash-object index.html)" = "5630bb681dd8710f8e45bc5363488f358ce9ebe2"
        cat > "$RUNNER_TEMP/CAL26_R74_engine.py" <<'PY_R74_ENGINE'
        #!/usr/bin/env python3
        """CAL26 R74: source-pinned, out-of-time YEAR+1 LOG-surplus continuity diagnostic.
        Not a model FV price, no live edits. Frozen 2024 Week6 predictors -> actual 2025 outcomes
        and replay of frozen 2021-trained YTD control -> 2026 Week6 predictors for 2027.
        """
        import argparse,csv,pathlib,hashlib,json,collections,statistics,math,re,sys
        P=pathlib.Path
        INPUTS={
         'R63':{'CAL26_V1R63_2024_Week6_outer_player_diagnostics_NOT_FV.csv':'954798f3d4a27b14fe47a2b58b14e750ee942172b2896e27f84f7d5e877aab5d','CAL26_V1R63_7position_Week6_chronological_holdout.csv':'1d5c5cafa85d2a449c27e9bc96cbc90c3bcfd25004626518588f94781c802345'},
         'R69':{'CAL26_V1R69_518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv':'f97ed14bc1ee9eb393860520beb9c8cd0ed861d5e6c69e193f712c3a166f18c9'},
         'R70':{'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv':'7ae5ffdd2fa9603df74cb6fe768af7889f8c96f22abb297c50013622ed964699'},
         'R72':{'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv':'2ebce111316cdb578d0bd240e1858a4ac87e1b61543dff01fffc3b60e943d2b2'},
         'R73':{'CAL26_R73_518_live_vs_empirical_peer_FV_SHADOW_NOT_PRODUCTION.csv':'1d9f103a1e1831e4478f350f28909f103badf8efa970b0106877965dc1ce2f51'}}
        POS=('QB','RB','WR','TE','DL','LB','DB')
        PRIMARY=['bryce young','caleb williams','drake maye','jayden daniels','cj stroud','puka nacua','myles garrett','brian burns','maxx crosby','jameis winston','josh allen','jahmyr gibbs','will anderson','trevor lawrence','jeremiyah love','breece hall','nik bonitto','patrick mahomes']
        def need(ok,msg):
         if not ok: raise AssertionError(msg)
        def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
        def norm(s):return re.sub(r'\s+',' ',re.sub(r"[.'’\-]",'',s.strip().lower()))
        def key(r):return (norm(r['name']),r['position'])
        def read(p):
         with p.open(newline='') as f:return list(csv.DictReader(f))
        def ix(rows):
         d={}
         for r in rows:
          k=key(r);need(k not in d,'DUPLICATE_PLAYER_KEY '+str(k));d[k]=r
         return d
        def val(s):
         try:return float(s)
         except (TypeError,ValueError):return None
        def quant(a,q):
         b=sorted(a);need(bool(b),'NO_QUANTILES'); t=(len(b)-1)*q;lo=int(t);hi=min(len(b)-1,lo+1);return b[lo]*(hi-t)+b[hi]*(t-lo)
        def interpolate_pairs(points,x):
         # Exact replay of frozen 2021-trained YTD baseline predictions on 2024 origin,
         # using only inputs and baseline model predictions, never true outcomes for fitting.
         a=sorted(points)
         need(len(a)>=30,'INSUFFICIENT_CONTROL_SUPPORT')
         if x<=a[0][0]:p=a[0:2]
         elif x>=a[-1][0]:p=a[-2:]
         else:
          import bisect
          j=bisect.bisect_left(a,(x,-math.inf));p=a[j-1:j+1]
         x0,y0=p[0];x1,y1=p[1]
         if x1==x0:
          close=[y for xx,y in a if xx==x0];return sum(close)/len(close)
         return max(0,y0+(y1-y0)*(x-x0)/(x1-x0))
        def historical_ready(rows):
         d=collections.defaultdict(list)
         for r in rows:
          need(r['origin']=='2024' and r['trained_using_only_prior_completed_outcomes']=='True' and r['no_market_or_FV_price_used']=='True','HISTORICAL_TIME_OR_LABEL_LEAK')
          p=r['position'];need(p in POS,'BAD_HISTORICAL_POSITION')
          x=val(r['week6_calendar_ppg']);y=val(r['actual_2025_surplus']);ctrl=val(r['ytd_pred_surplus'])
          need(x is not None and y is not None and ctrl is not None and all(math.isfinite(a) for a in (x,y,ctrl)),'NONFINITE_HISTORICAL')
          need(y>=-0.001 and ctrl>=-0.001,'NEGATIVE_CLIPPED_SURPLUS')
          d[p].append((x,y,ctrl))
         need(set(d)==set(POS),'HISTORICAL_POSITION_COVERAGE')
         for p,rr in d.items():need(len(rr)>=70,'HISTORICAL_N_LOW_'+p)
         return d
        def replay_from_historical(d):
         # Error quantified OUT OF TIME: 2024 Week6 origin and realized 2025 H1.
         # Return 2024 control residual uncertainty; NOT an independent 2026->2027 test.
         rows={}
         for p,allr in d.items():
          base=[(x,c) for x,y,c in allr]; errors=[y-c for x,y,c in allr]
          n=len(allr)
          # Research-only LoO peer comparison, NEVER used to select the primary 2027 control.
          peer_errors=[];baseline_errors=[]
          for i,(x,y,control) in enumerate(allr):
           peers=sorted((abs(px-x),j,py) for j,(px,py,pc) in enumerate(allr) if j!=i)[:25]
           peer_est=sum(t[2] for t in peers)/len(peers)
           peer_errors.append((y-peer_est)**2)
           baseline_errors.append((y-control)**2)
          control_mse=statistics.mean(baseline_errors); peer_mse=statistics.mean(peer_errors)
          rows[p]={'n':n,'pairs':base,'outcome':allr,'residual10':quant(errors,.10),'residual90':quant(errors,.90),'residual_median':quant(errors,.50),
           'control_MSE':control_mse,'LOO_peer_MSE':peer_mse,'LOO_peer_gain_vs_frozen_2021_trained_control_pct':100*(1-peer_mse/control_mse),
           'control_MAE':statistics.mean(abs(z) for z in errors),'coverage80_in_sample_residual':sum(quant(errors,.10)<=e<=quant(errors,.90) for e in errors)/n}
         return rows
        def build(args):
         out=P(args.out);out.mkdir(parents=True,exist_ok=True)
         roots={'R63':P(args.r63),'R69':P(args.r69),'R70':P(args.r70),'R72':P(args.r72),'R73':P(args.r73)}
         files={};shas={}
         for k,needs in INPUTS.items():
          for name,digest in needs.items():
           p=roots[k]/name;need(p.is_file(),'MISSING_PINNED_FILE '+k+'/'+name);found=sha(p)
           need(found==digest,'PINNED_INPUT_DRIFT '+k+'/'+name+' '+found);files[k+'/'+name]=p;shas[k+'/'+name]=found
         hist=historical_ready(read(roots['R63']/'CAL26_V1R63_2024_Week6_outer_player_diagnostics_NOT_FV.csv'))
         stat=ix(read(roots['R69']/'CAL26_V1R69_518_week6_2026_ROS_forecast_RESEARCH_NOT_FV.csv'))
         y0=ix(read(roots['R70']/'CAL26_R70_518_single_source_2026_surplus_NO_FV.csv'))
         live=ix(read(roots['R72']/'CAL26_R72_518_exact_JS_FV_replay_and_multiplier_sensitivity_NO_RELEASE.csv'))
         peer=ix(read(roots['R73']/'CAL26_R73_518_live_vs_empirical_peer_FV_SHADOW_NOT_PRODUCTION.csv'))
         need(len(stat)==len(y0)==len(live)==len(peer)==518,'SOURCE_PLAYER_CARDINALITY')
         need(set(stat)==set(y0)==set(live)==set(peer),'SOURCE_PLAYER_IDENTITY_DRIFT')
         position_data=read(roots['R63']/'CAL26_V1R63_7position_Week6_chronological_holdout.csv')
         need(len(position_data)==7 and set(x['position'] for x in position_data)==set(POS),'BAD_POSITION_DECISIONS')
         for rr in position_data:
          need(rr['2026_FV_or_pricing_approved']=='False' and rr['H1_only_not_three_year']=='True','HISTORICAL_H1_GATE_DRIFT')
         mapping=replay_from_historical(hist)
         rows=[]
         for kk in sorted(live,key=lambda x:(POS.index(x[1]),x[0])):
          a=stat[kk];b=y0[kk];c=live[kk];d=peer[kk];name,position=kk
          need(a['2026_H1_or_H2_multi_year_FV_calibrated']=='False' and c['price_change_authorized']=='False' and d['FV_production_change_authorized']=='False','PRICE_RELEASE_STATE_DRIFT')
          need(int(c['exact_production_JS_replayed_FV'])==int(d['live_JS_FV_BASELINE']),'LIVE_FV_PARITY_DRIFT')
          if val(a['2026_fullseason_corrected_actual_plus_research_ROS_POINTS']) is not None or val(b['2026_fullseason_single_source_research_points']) is not None:
           need(val(a['2026_fullseason_corrected_actual_plus_research_ROS_POINTS']) is not None and val(b['2026_fullseason_single_source_research_points']) is not None and abs(val(a['2026_fullseason_corrected_actual_plus_research_ROS_POINTS'])-val(b['2026_fullseason_single_source_research_points']))<=0.01,'2026_FORECAST_DRIFT')
          if val(a['2026_week1_6_corrected_LOG_points']) is not None or val(b['2026_week1_6_2026rule_scored_points']) is not None:
           need(val(a['2026_week1_6_corrected_LOG_points']) is not None and val(b['2026_week1_6_2026rule_scored_points']) is not None and abs(val(a['2026_week1_6_corrected_LOG_points'])-val(b['2026_week1_6_2026rule_scored_points']))<=0.01,'2026_POINTS_DRIFT')
          h=mapping[position];gp=int(float(d['games_played_6weeks'])); x=val(a['2026_week1_6_calendar_ppg']);
          if gp>=1 and x is not None and math.isfinite(x):
           estimate=interpolate_pairs(h['pairs'],x)
           # External historical 2024 -> actual2025 control residual envelope; research uncertainty only.
           lower=max(0,estimate+h['residual10']);upper=max(0,estimate+h['residual90'])
           neighbors=sorted(h['outcome'],key=lambda t:abs(t[0]-x))[:25]
           neighbor_positive=sum(t[1]>0 for t in neighbors)
           near_med=quant([t[1] for t in neighbors],.50)
          else:estimate=lower=upper=near_med=None;neighbor_positive=None
          prod_class='UNOBSERVED_2026' if gp<1 else 'LOW_SAMPLE_GP_LT4' if gp<4 else 'CURRENT_SAMPLE_GP_GE4'
          gap = val(d['FV_shadow_minus_live_RESEARCH_NOT_APPROVED'])
          anchor=d['owner_anchor_protected']=='True'
          rec={'name':a['name'],'position':position,'age':c['age'],'role':c['role'],'games_played_through_2026_week6':gp,
          'live_JS_FV_UNCHANGED':int(c['exact_production_JS_replayed_FV']), 'owner_price_anchor_protected':anchor,
          '2026_fullseason_LOG_points_RESEARCH':round(val(a['2026_fullseason_corrected_actual_plus_research_ROS_POINTS']),3) if val(a['2026_fullseason_corrected_actual_plus_research_ROS_POINTS']) is not None else '',
          '2026_year0_replacement_surplus_RESEARCH':b['research_year0_surplus_above_2026_position_reference'],
          '2026_week6_calendar_ppg':round(x,4) if x is not None else '',
          'historical_2024_to_2025_H1_control_test_n':h['n'],
          '2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH':round(estimate,3) if estimate is not None else '',
          '2027_H1_residual_p10_lower_RESEARCH_NOT_PROBABILISTIC':round(lower,3) if lower is not None else '',
          '2027_H1_residual_p90_upper_RESEARCH_NOT_PROBABILISTIC':round(upper,3) if upper is not None else '',
          '2024_nearest25_peers_realized_2025_surplus_median_DIAGNOSTIC':round(near_med,3) if near_med is not None else '',
          '2024_nearest25_peers_realized_2025_positive_n_DIAGNOSTIC':neighbor_positive if neighbor_positive is not None else '',
          'R73_rejected_year0_peer_FV_shadow_gap_NOT_CANDIDATE':int(gap) if gap is not None else '',
          '2026_availability_reliability':prod_class,
          'H1_is_next_season_surplus_not_FV':True,
          '2028_H2_independent_future_outcome_certified':False,
          '2027_actual_future_outcome_known':False,
          'historical_retrospective_scoring_has_2026_official_alias_parity':False,
          'independent_dynasty_market_calibration':False,
          'proposed_FV': '', 'FV_production_change_authorized':False}
          rows.append(rec)
         need(len(rows)==518,'ROW_COUNT_FAILURE')
         assert sum(z['owner_price_anchor_protected'] for z in rows)==15
         pos_rows=[]
         for p in POS:
          h=mapping[p];zs=[z for z in rows if z['position']==p]
          pos_rows.append({'position':p,'historical_2024_to_2025_H1_n':h['n'],'historical_2024_to_2025_2021trained_YTD_MSE':round(h['control_MSE'],3),
          'historical_2024_LOO_same_cohort_25peer_MSE_DIAGNOSTIC':round(h['LOO_peer_MSE'],3),
          'LOO_peer_gain_vs_chronological_control_pct_DIAGNOSTIC_ONLY':round(h['LOO_peer_gain_vs_frozen_2021_trained_control_pct'],2),
          'historical_absolute_error_mean':round(h['control_MAE'],3),'2025_outcome_residual_p10':round(h['residual10'],3),'2025_outcome_residual_p90':round(h['residual90'],3),
          '2026_players':len(zs),'2026_current_GP_GE4':sum(z['games_played_through_2026_week6']>=4 for z in zs),
          '2027_model_research_status':'2021_TRAINED_YTD_CONTROL_WITH_2024_OUTER_RESIDUALS',
          '2028_price_calibrated':False,'FV_release_authorized':False})
         pri={k:i for i,k in enumerate(PRIMARY)}
         named=[z for z in rows if norm(z['name']) in pri]; named.sort(key=lambda z:pri[norm(z['name'])]);
         # + selection of large rejected numerical shadows, no approval
         outlier=sorted([z for z in rows if z not in named],key=lambda z:-abs(z['R73_rejected_year0_peer_FV_shadow_gap_NOT_CANDIDATE'] or 0))
         cards=(named+outlier)[:24]
         for z in cards:need(z['proposed_FV']=='' and z['FV_production_change_authorized'] is False,'ACCIDENTAL_QUOTE')
         def output_csv(name,items):
          path=out/name;need(items,'EMPTY_OUTPUT '+name)
          with path.open('w',newline='') as f:
           w=csv.DictWriter(f,fieldnames=list(items[0]));w.writeheader();w.writerows(items)
          return path
         output_csv('CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv',rows)
         output_csv('CAL26_R74_7position_chronological_transition_risk.csv',pos_rows)
         output_csv('CAL26_R74_24_owner_multi_year_cards_NO_APPROVED_FV.csv',cards)
         lines=['# CAL26 V1R74 — future-season continuation, no price release','',
         '**Verdict: 2027 next-season surplus RESEARCH ONLY; production changes held.**','',
         'R73 peer-implied price swings were rejected. R74 carries forward the real 2021-trained 2024-origin Week6 YTD control (`R63`) that predicted next-season 2025 surplus, then applies its predictor shape to frozen 2026 Week6 LOG-scored observations. The 2024→2025 residual distribution quantifies uncertainty, rather than inventing an FV-per-point coefficient.','',
         '**This is NOT a 2027 outcome backtest** (2027 has not happened). The 2024→2025 results come from historical retrospective 2026-rule scoring and lack the 2026 official overlapping-players field parity certification. Model transfer to 2027, market prices, and 2028 performance remain unproven.','',
         f'- Matched live player records: {len(rows)}; existing anchored quotes protected: 15; historical 2024→2025 tested cohort total: {sum(x["n"] for x in mapping.values())}.',
         f'- Research-only 2027 surplus estimates: {sum(isinstance(z["2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH"],(int,float)) for z in rows)}.',
         '- Replacement surplus uses its historical origin/year reference, not a single permanent exchange rate. Do **not** add to 2026 year0 surplus as if cross-year baseline were guaranteed identical.',
         '- Calendar-week PPG is not per-game PPG; 2026 low-GP players must not be automatically downgraded.',
         '- Peer model LOO performance on 2024 is **diagnostic only** and must not be promoted as an untouched holdout.',
         '', '| Pos | 2024→2025 outcomes | historical YTD-control MSE | retrospective LOO 25-peer MSE | 2026 4+GP |','|---|---:|---:|---:|---:|']
         for p in pos_rows:lines.append(f'| {p["position"]} | {p["historical_2024_to_2025_H1_n"]} | {p["historical_2024_to_2025_2021trained_YTD_MSE"]:.1f} | {p["historical_2024_LOO_same_cohort_25peer_MSE_DIAGNOSTIC"]:.1f} | {p["2026_current_GP_GE4"]} |')
         lines+=['','## Owner diagnostic examples: FV unchanged','', '| Player | Pos | Live FV | 2026 GP | 2026 projected pts | 2027 research H1 surplus | R73 rejected gap |','|---|---|---:|---:|---:|---:|---:|']
         for z in cards[:18]:lines.append(f'| {z["name"]} | {z["position"]} | {z["live_JS_FV_UNCHANGED"]} | {z["games_played_through_2026_week6"]} | {z["2026_fullseason_LOG_points_RESEARCH"]} | {z["2027_H1_predicted_surplus_2021trained_YTD_CONTROL_RESEARCH"]} | {z["R73_rejected_year0_peer_FV_shadow_gap_NOT_CANDIDATE"]} |')
         lines+=['','**No invented FV conversion or player-price changes.** A real release requires independent dynasty-market pricing labels and 2027/2028 continuation evidence, or an explicitly owner-approved, bounded provisional update clearly distinguished from model validation.','']
         (out/'CAL26_R74_decision.md').write_text('\n'.join(lines))
         names=['CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv','CAL26_R74_7position_chronological_transition_risk.csv','CAL26_R74_24_owner_multi_year_cards_NO_APPROVED_FV.csv','CAL26_R74_decision.md']
         m={'run':'CAL26_V1R74','status':'H1_CHRONOLOGICAL_CONTROL_RESEARCH_NO_FV_PRICE_RELEASE',
           'player_count':518,'position_count':7,'anchor_count':15,'owner_card_count':len(cards),
           'historical_outcome_count':sum(x['n'] for x in mapping.values()),
           'pinned_input_sha256':shas,'output_sha256':{n:sha(out/n) for n in names},
           '2026_stops_at_week6':True,'historical_outcome_realized_2025':True,
           'H1_model_origin_2021_controls_tested_on_2024':True,
           'H1_predictive_transfer_to_2027_validated':False,'H2_2028_transfer_validated':False,
           'independent_cardinal_dynasty_price_calibrated':False,
           'R73_year0_peer_price_shortcut_rejected':True,
           'existing_live_FV_baseline_preserved':True,'production_change_authorized':False}
         (out/'CAL26_R74_manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
         print('R74_CONTINUATION_SHADOW_GREEN',json.dumps({k:v for k,v in m.items() if k not in ('pinned_input_sha256','output_sha256')}))
        def selftest():
         a=[(0,2),(4,6),(9,11)]+[(i+10,i+11) for i in range(30)]
         need(abs(interpolate_pairs(a,4)-6)<1e-9,'INTERP_EXACT')
         need(interpolate_pairs(a,-5)>=0,'INTERP_CLIP')
         need(quant([1,2,3,4,5],.1)==1.4,'QUANTILE')
         print('R74_SELFTEST_GREEN')
        if __name__=='__main__':
         ap=argparse.ArgumentParser();ap.add_argument('--r63');ap.add_argument('--r69');ap.add_argument('--r70');ap.add_argument('--r72');ap.add_argument('--r73');ap.add_argument('--out');ap.add_argument('--selftest',action='store_true');a=ap.parse_args()
         if a.selftest:selftest()
         else:build(a)
        PY_R74_ENGINE
        python -m py_compile "$RUNNER_TEMP/CAL26_R74_engine.py"
        python "$RUNNER_TEMP/CAL26_R74_engine.py" --selftest
        python "$RUNNER_TEMP/CAL26_R74_engine.py" \
          --r63 "$RUNNER_TEMP/cal26-r74-in/R63" \
          --r69 "$RUNNER_TEMP/cal26-r74-in/R69" \
          --r70 "$RUNNER_TEMP/cal26-r74-in/R70" \
          --r72 "$RUNNER_TEMP/cal26-r74-in/R72" \
          --r73 "$RUNNER_TEMP/cal26-r74-in/R73" \
          --out "$RUNNER_TEMP/cal26-r74-results"
        python - "$RUNNER_TEMP/cal26-r74-results" <<'PY_R74_VERIFY'
        import json,csv,pathlib,hashlib,sys,collections
        p=pathlib.Path(sys.argv[1]);m=json.loads((p/'CAL26_R74_manifest.json').read_text())
        assert m['status']=='H1_CHRONOLOGICAL_CONTROL_RESEARCH_NO_FV_PRICE_RELEASE'
        assert m['player_count']==518 and m['position_count']==7 and m['anchor_count']==15
        assert m['historical_outcome_count']>=1600 and m['owner_card_count']==24
        assert m['2026_stops_at_week6'] and m['historical_outcome_realized_2025']
        assert m['R73_year0_peer_price_shortcut_rejected'] and m['existing_live_FV_baseline_preserved']
        assert not m['production_change_authorized']
        assert not m['H1_predictive_transfer_to_2027_validated']
        assert not m['H2_2028_transfer_validated']
        assert not m['independent_cardinal_dynasty_price_calibrated']
        for name,digest in m['output_sha256'].items():
         assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest, name
        with (p/'CAL26_R74_518_next_season_2027_surplus_evidence_NOT_FV.csv').open() as f:rows=list(csv.DictReader(f))
        assert len(rows)==518 and len({(z['name'].lower(),z['position']) for z in rows})==518
        assert sum(z['owner_price_anchor_protected']=='True' for z in rows)==15
        assert all(z['proposed_FV']=='' and z['FV_production_change_authorized']=='False' for z in rows)
        assert all(z['2027_actual_future_outcome_known']=='False' and z['2028_H2_independent_future_outcome_certified']=='False' for z in rows)
        assert set(z['position'] for z in rows)=={'QB','RB','WR','TE','DL','LB','DB'}
        print('R74_ACTUAL_SOURCE_PIN_CHRONOLOGICAL_H1_NO_FV_GREEN')
        PY_R74_VERIFY
        test -z "$(git status --porcelain)"
        cat "$RUNNER_TEMP/cal26-r74-results/CAL26_R74_decision.md" >> "$GITHUB_STEP_SUMMARY"
