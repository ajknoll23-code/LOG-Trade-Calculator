name: A-QA06 - Fallback Role and Price Mechanism Diagnostic (Read Only)
run-name: A-QA06 fallback role pricing diagnostic READ ONLY

'on':
  workflow_dispatch:
    inputs:
      qa05_run_id:
        description: Green A-QA05 run ID
        required: true
        default: '41054400674'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: a-qa06-fallback-role-shadow
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA05_RUN_ID: ${{ inputs.qa05_run_id }}
      QA05_INPUT: /tmp/a-qa06-qa05
      QA06_OUTPUT: /tmp/a-qa06-out
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify successful QA05 read-only source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$QA05_RUN_ID" =~ ^[0-9]{7,15}$ ]] || { echo 'Invalid QA05 run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA05_RUN_ID" > "$RUNNER_TEMP/qa05_run.json"
          python3 - <<'PY_VERIFY'
          import json,os,pathlib,re
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'qa05_run.json').read_text())
          expected={'conclusion':'success','event':'workflow_dispatch',
            'path':'.github/workflows/A-QA05.yml',
            'display_title':'A-QA05 read-only valuation screening',
            'head_branch':'main'}
          for k,v in expected.items():
              assert r.get(k)==v,f'QA05 run provenance mismatch: {k}'
          assert r.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch('[a-f0-9]{40}',r.get('head_sha',''))
          print('Verified QA05 run:',r['id'])
          PY_VERIFY

      - name: Download exact QA05 review artifact
        uses: actions/download-artifact@v4
        with:
          name: A-QA05-Valuation-Review-Read-Only
          run-id: ${{ inputs.qa05_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/a-qa06-qa05

      - name: Return to exact QA04 source revision used by QA05
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PIN'
          from pathlib import Path
          import json,os,re
          m=json.loads((Path(os.environ['QA05_INPUT'])/'QA05_Manifest.json').read_text())
          sha=m.get('source_qa04_head_sha','')
          assert re.fullmatch('[a-f0-9]{40}',sha),'QA05 manifest lacks valid source SHA'
          assert m.get('source_qa04_run_id')=='41005846747','Unexpected QA04R1 lineage'
          (Path(os.environ['RUNNER_TEMP'])/'qa06_source_sha').write_text(sha)
          print('Pinned source revision:',sha)
          PY_PIN
          git fetch --depth=1 origin "$(cat "$RUNNER_TEMP/qa06_source_sha")"
          git checkout --detach "$(cat "$RUNNER_TEMP/qa06_source_sha")"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/qa06_source_sha")"

      - name: Generate role source lineage and intervention diagnosis
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/qa06_engine.py" <<'PY_QA06_ENGINE'
          #!/usr/bin/env python3
          """Shadow-only structural fallback-risk diagnostic; never produces replacement FV."""
          import collections
          import csv
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          base=Path(os.environ.get('QA05_INPUT','/tmp/qa06-qa05'))
          out=Path(os.environ.get('QA06_OUTPUT','/tmp/qa06-report'))
          out.mkdir(parents=True,exist_ok=True)
          def stop(message):
              raise RuntimeError('A-QA06 FAIL CLOSED: '+message)
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_path=base/'QA05_Manifest.json'
          csv_path=base/'QA05_All72_Review.csv'
          if not manifest_path.is_file() or not csv_path.is_file(): stop('Required QA05 files absent')
          source=json.loads(manifest_path.read_text())
          expected={'status':'QA05_EVIDENCE_SCREEN_COMPLETE_READ_ONLY','source_qa04_run_id':'41005846747',
                    'source_qa03_run_id':'41003655991','cohort':72,'fv_changes':0,'fv_plus_changes':0,
                    'mv_changes':0,'repo_mutations':0,'proposed_new_fv_count':0,
                    'peer_median_is_calibrated_dynasty_fv':False,'independent_dynasty_evidence_present':False,
                    'owner_price_approval':False}
          for key,val in expected.items():
              if source.get(key)!=val: stop(f'QA05 manifest unexpected {key}: {source.get(key)}')
          with csv_path.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          if len(rows)!=72 or len({x['sleeper_id'] for x in rows})!=72:stop('Wrong QA05 stable-ID count')
          cols_required={'priority','name','sleeper_id','position','source_roster_slot',
          'weak_roster_derived_role','current_production_fv_UNCHANGED','illustrative_peer_median_NOT_PROPOSED_FV',
          'gap_direction','gap_severity','review_disposition','2025_games','2026_projection_source',
          'fantasypros_crosswalk','proposed_new_fv','final_pricing_decision','production_changes'}
          if not cols_required.issubset(rows[0]):stop('QA05 schema changed')
          if any(x['proposed_new_fv'] or x['production_changes']!='NONE' or
              not x['final_pricing_decision'].startswith('HOLD_') for x in rows):
              stop('QA05 contains an unauthorized price proposal')
          if collections.Counter(x['gap_direction'] for x in rows)!= {
          'CURRENT_ABOVE_PEERS':27,'CURRENT_BELOW_PEERS':21,'NO_MATERIAL_PEER_GAP':19,'NO_PROJECTION_HOLD':5}:
              stop('QA05 gap direction count drift')
          roles={'starters':'Starter','bench':'Rotational','reserve_ir':'Depth','taxi':'Speculative'}
          for x in rows:
              if x['source_roster_slot'] not in roles:stop('Unexpected roster slot: '+x['source_roster_slot'])
              if x['weak_roster_derived_role']!=roles[x['source_roster_slot']]:stop('Role-to-slot mapping drift: '+x['sleeper_id'])

          repeats=collections.defaultdict(list)
          for x in rows:
              repeats[(x['position'],x['weak_roster_derived_role'],x['current_production_fv_UNCHANGED'])].append(x['name'])

          result=[]
          for x in rows:
              evidence=[]
              if x['source_roster_slot']=='starters':evidence.append('slot_based_starter_role')
              if x['gap_direction']=='CURRENT_ABOVE_PEERS':evidence.append('above_uncalibrated_peer_median')
              elif x['gap_direction']=='CURRENT_BELOW_PEERS':evidence.append('below_uncalibrated_peer_median')
              if x['gap_severity']=='EXTREME':evidence.append('extreme_uncalibrated_peer_gap')
              if len(repeats[(x['position'],x['weak_roster_derived_role'],x['current_production_fv_UNCHANGED'])])>1:
                  evidence.append('exact_repeated_position_role_fv')
              if x['2025_games'] in ('','0'):evidence.append('no_2025_games_in_QA05')
              if x['fantasypros_crosswalk']!='high_confidence':evidence.append('identity_evidence_not_high_confidence')
              if x['review_disposition'].startswith('PROSPECT_HOLD'):route='PRESERVE_PROSPECT_UPSIDE_HOLD'
              elif x['review_disposition']=='HOLD_MISSING_PROJECTION':route='MISSING_PROJECTION_HOLD'
              elif x['review_disposition'].startswith('HOLD_'):route='NO_RECENT_GAMES_HOLD'
              elif x['gap_direction']=='CURRENT_ABOVE_PEERS':route='DIAGNOSE_POSSIBLE_OVERVALUATION'
              elif x['gap_direction']=='CURRENT_BELOW_PEERS':route='DIAGNOSE_POSSIBLE_UNDERVALUATION'
              else:route='MONITOR_COMPARATORS_NOT_PRICE'
              result.append({
                  'priority':x['priority'],'sleeper_id':x['sleeper_id'],'player':x['name'],'position':x['position'],
                  'current_fv_UNCHANGED':x['current_production_fv_UNCHANGED'],
                  'fantasy_roster_slot':x['source_roster_slot'],
                  'role_in_QA05_from_slot':x['weak_roster_derived_role'],
                  'role_evidence_type':'ROSTER_PLACEMENT_NOT_PROVEN_NFL_ROLE',
                  '2025_games':x['2025_games'],'2026_projection_source':x['2026_projection_source'],
                  'peer_gap_direction_NOT_PRICING':x['gap_direction'],
                  'peer_median_NOT_PRICING':x['illustrative_peer_median_NOT_PROPOSED_FV'],
                  'repeat_same_position_role_fv':str(len(repeats[(x['position'],x['weak_roster_derived_role'],x['current_production_fv_UNCHANGED'])])),
                  'repeat_player_names':'; '.join(repeats[(x['position'],x['weak_roster_derived_role'],x['current_production_fv_UNCHANGED'])]),
                  'risk_flags':';'.join(evidence),'disposition':route,
                  'causal_role_pricing_link_PROVEN':'NO',
                  'replacement_fv':'','production_change':'NONE',
              })

          with (out/'QA06_Casebook.csv').open('w',newline='',encoding='utf8') as f:
              w=csv.DictWriter(f,fieldnames=list(result[0]));w.writeheader();w.writerows(result)

          # Static code candidate trace only: snippets highlight likely places for manual code review;
          # never claim the occurrence of a token proves that the role influences FV.
          index_path=Path('index.html')
          if not index_path.is_file():stop('Expected index.html source missing')
          raw=index_path.read_text(encoding='utf-8')
          pattern=re.compile(r'fallback|uncurated|\bStarter\b|\bRotational\b|\bSpeculative\b|\brole_main\b|\broleMain\b',re.I)
          code_matches=[]
          for line_no,line in enumerate(raw.splitlines(),1):
              for m in pattern.finditer(line):
                  if len(code_matches)>=150:break
                  left=max(0,m.start()-125);right=min(len(line),m.end()+145)
                  excerpt=line[left:right].replace('\t',' ').strip()
                  code_matches.append({'file':'index.html','line':line_no,'term':m.group(0),
                                       'source_excerpt':excerpt,'causal_link_proven':'NO'})
              if len(code_matches)>=150:break
          with (out/'QA06_Source_Trace.csv').open('w',newline='',encoding='utf8') as f:
              w=csv.DictWriter(f,fieldnames=['file','line','term','source_excerpt','causal_link_proven'])
              w.writeheader();w.writerows(code_matches)

          counts=collections.Counter(x['disposition'] for x in result)
          roster_counts=collections.Counter(x['fantasy_roster_slot'] for x in result)
          shared=[(key,players) for key,players in repeats.items() if len(players)>1]
          shared.sort(key=lambda z:-len(z[1]))
          priorities=sorted(result,key=lambda x:({'HIGH':0,'MEDIUM':1,'LOW':2}[x['priority']],
              0 if x['peer_gap_direction_NOT_PRICING']=='CURRENT_ABOVE_PEERS' else 1,-int(x['current_fv_UNCHANGED'])))
          lines=['# A-QA06 — Fallback Role/Price Mechanism Diagnostic (Read Only)','',
          '**Outcome: diagnostic complete; NO FV, FV+, or MV changes.**','',
          '## Structural observation', '',
          '- QA05 labeled all 72 roles by fantasy-roster slot: starters→Starter, bench→Rotational, reserve_ir→Depth, taxi→Speculative.',
          '- This establishes a role-label lineage, **NOT** causal proof that a roster slot determined actual FV.',
          '- One-season projections are tagged Team Utility sources, not validated dynasty FV targets.',
          '- Shared exact prices and same-position peer gaps are investigative signals, not adjustment instructions.','',
          '## Observed cohort','',
          '| Roster slot | Players |','|---|---:|']
          for slot,cnt in sorted(roster_counts.items(),key=lambda x:-x[1]):lines.append(f'| {slot} | {cnt} |')
          lines+=['','## Repeat exact price + position + role clusters','',
                 '| Position | Role | Current FV | Players |','|---|---|---:|---|']
          for (pos,role,fv),people in shared[:22]:
              lines.append(f'| {pos} | {role} | {int(fv):,} | {", ".join(people).replace("|", "/")} |')
          if not shared:lines.append('| No repeated clusters | — | — | — |')
          lines+=['','## Leading diagnostic cases (no price target)','',
          '| Player | FV | Slot role | 2025 games | Peer direction | Investigate |',
          '|---|---:|---|---:|---|---|']
          for x in priorities[:18]:
              lines.append('| '+ ' | '.join([x['player'].replace('|','/'),f"{int(x['current_fv_UNCHANGED']):,}",
                  x['role_in_QA05_from_slot'],x['2025_games'],x['peer_gap_direction_NOT_PRICING'],x['disposition']])+ ' |')
          lines+=['','## Outcome / next intervention design','',
          '1. **Diagnose live calculation:** inspect source matches and replay original fallback valuation with stable ID.',
          '   Verify whether (and where) fantasy-roster slot enters the actual FV computation.',
          '2. **If confirmed:** separate fantasy-lineup slot from an independently evidenced NFL role.',
          '   Ensure missing role evidence is neutral/uncertain rather than implicitly Starter.',
          '3. **Shadow only:** for the original 72 IDs, compare baseline with a controlled slot-neutral',
          '   alternative while keeping all other inputs identical. Quantify downstream FV/FV+/MV differences.',
          '4. **Protect upside:** prospect and 0-game holds must not be cut purely for poor one-season projections.',
          '5. **External anchors:** attach current vetted dynasty rankings/trade evidence and multiyear context',
          '   before proposing replacement values. League KTC-style vote values are NOT an independent anchor.',
          '6. **Separate owner authorization** is required before any PREVIEW-to-APPLY price release.',
          '', '## Unresolved', '',
          '- Is fallback FV causally driven by roster slot? **Not established in this study.**',
          '- Are repeated FV clusters materially erroneous? **Not established.**',
          '- Can we propose precise replacement FV? **Not yet; no independent dynasty pricing anchors here.**',
          '- `QA06_Source_Trace.csv` is a static search shortlist, not proof of causal linkage.',
          '', '## Artifacts', '',
          '- `QA06_Casebook.csv`: all 72 stable IDs with safety disposition and role lineage.',
          '- `QA06_Source_Trace.csv`: candidate source anchors for manual code tracing.',
          '- `QA06_Manifest.json`: exact source and integrity metadata.',
          '',f'Generated: {datetime.now(timezone.utc).isoformat()}','']
          (out/'QA06_Report.md').write_text('\n'.join(lines),encoding='utf8')
          manifest={
           'status':'QA06_SOURCE_ROLE_DIAGNOSTIC_COMPLETE_READ_ONLY',
           'input_qa05_run':os.getenv('QA05_RUN_ID'),'qa05_manifest_sha256':sha(manifest_path),
           'qa05_all72_sha256':sha(csv_path),'source_qa04_run':source['source_qa04_run_id'],
           'source_qa04_sha':source['source_qa04_head_sha'], 'source_index_sha256':sha(index_path),
           'cohort':len(result),'role_slot_counts':dict(roster_counts),
           'diagnostic_dispositions':dict(counts),'duplicate_fv_role_position_clusters':len(shared),
           'source_trace_hits':len(code_matches),'roster_slot_is_proven_causal_fv_input':False,
           'new_fv_candidates_count':0,'fv_changes':0,'fv_plus_changes':0,'mv_changes':0,
           'repo_mutations':0,'generated_utc':datetime.now(timezone.utc).isoformat()}
          (out/'QA06_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf8')
          print(json.dumps({'status':manifest['status'],'count':72,'groups':dict(roster_counts),
                             'duplicate_clusters':len(shared),'code_trace_hits':len(code_matches)},sort_keys=True))
          PY_QA06_ENGINE
          python3 -m py_compile "$RUNNER_TEMP/qa06_engine.py"
          python3 "$RUNNER_TEMP/qa06_engine.py"

      - name: Confirm repository stays completely unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo 'QA06 did not satisfy read-only contract'; exit 1;
          }

      - name: Upload diagnostic evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-QA06-Fallback-Mechanism-Diagnostic
          path: /tmp/a-qa06-out/
          retention-days: 30
          if-no-files-found: error

      - name: Publish findings
        if: always()
        shell: bash
        run: |
          if test -f "$QA06_OUTPUT/QA06_Report.md"; then
            cat "$QA06_OUTPUT/QA06_Report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA06 did not complete; inspect preceding step. No production pricing changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
