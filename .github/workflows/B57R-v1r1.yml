# B57R V1R1 SYNTHETIC ATTESTATION REHEARSAL -- DRAFT ONLY.
# NOT APPROVED FOR UPLOAD OR EXECUTION. Requires independent dual pre-run review.
# Creates only synthetic run-id/attempt content. No study data, custody, historical source,
# H3/O2, outcomes, 2024, analytics, market, votes, or production access.
# Its signatures are REHEARSAL EVIDENCE, never a B57 freeze or scientific attestation.
name: B57R Exact Rookie Slot V2 - Synthetic Attestation Run Identity Rehearsal V1R1

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: b57r-synthetic-attestation-rehearsal
  cancel-in-progress: false

jobs:
  identity_attestation_probe:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout ONLY this synthetic workflow with B57-matching checkout settings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/exact-rookie-slot-curve-v2/b57r-nonexistent-synthetic-only/
            .github/workflows/B57R-v1r1.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Confirm actual GitHub workflow identity and write synthetic-only subject
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_B57R'
          import datetime,hashlib,json,os,pathlib,re,subprocess
          def require(ok,code):
              if not ok: raise RuntimeError(code)
          def git(*args):
              return subprocess.check_output(['git',*args],stderr=subprocess.DEVNULL).decode('ascii').strip()
          repo='ajknoll23-code/LOG-Trade-Calculator'
          origin='https://github.com/'+repo
          ref=repo+'/.github/workflows/B57R-v1r1.yml@refs/heads/main'
          require(os.getenv('GITHUB_REPOSITORY')==repo,'WRONG_REPOSITORY')
          require(os.getenv('GITHUB_REPOSITORY_ID')=='1332656701','WRONG_REPO_NUMERIC_ID')
          require(os.getenv('GITHUB_REPOSITORY_OWNER_ID')=='302637022','WRONG_OWNER_NUMERIC_ID')
          require(os.getenv('GITHUB_WORKFLOW_REF')==ref,'WRONG_WORKFLOW_REF')
          require(os.getenv('GITHUB_REF')=='refs/heads/main','WRONG_REF')
          require(os.getenv('GITHUB_EVENT_NAME')=='workflow_dispatch','WRONG_EVENT')
          require(re.fullmatch('[0-9a-f]{40}',os.getenv('GITHUB_SHA','')) is not None,'BAD_SHA')
          require(os.getenv('GITHUB_WORKFLOW_SHA')==os.environ['GITHUB_SHA'],'WORKFLOW_SHA_MISMATCH')
          require(git('rev-parse','HEAD')==os.environ['GITHUB_SHA'],'HEAD_DRIFT')
          require(git('remote','get-url','origin')==origin,'ORIGIN_DRIFT')
          require(git('status','--porcelain','--untracked-files=all')=='','DIRTY_SPARSE_CHECKOUT')
          tip=subprocess.check_output(['git','ls-remote',origin,'refs/heads/main'],stderr=subprocess.DEVNULL,timeout=25).decode('ascii').strip().split()
          require(tip==[os.environ['GITHUB_SHA'],'refs/heads/main'],'STALE_MAIN_OR_BAD_REMOTE')
          require(re.fullmatch('[1-9][0-9]*',os.getenv('GITHUB_RUN_ID','')) is not None,'BAD_RUN_ID')
          require(os.getenv('GITHUB_RUN_ATTEMPT') in ('1','2'),'ONLY_ATTEMPTS_ONE_TWO')
          # Explicitly observe identity values, public and nonsecret. These are runner claims,
          # not cryptographic evidence. After signing, compare to OFFLINE VERIFIED certificate.
          print('DATA_FREE_IDENTITY_PROBE')
          for name in ('GITHUB_REPOSITORY','GITHUB_REPOSITORY_ID','GITHUB_REPOSITORY_OWNER_ID','GITHUB_WORKFLOW_REF','GITHUB_WORKFLOW_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_SHA'):
              print(name+'='+os.environ[name])
          print('CHECKOUT_ORIGIN='+git('remote','get-url','origin'))
          print('SPARSE_PATTERNS='+str(subprocess.check_output(['git','sparse-checkout','list'],text=True).strip().splitlines()))
          print('CHECKOUT_FILE_COUNT='+str(len(git('ls-files').splitlines())))
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'b57r-synthetic-only'
          output.mkdir(exist_ok=False)
          subject=output/'b57r_subject.json'
          contents={
              'synthetic_only':True,'is_b57_dictionary_freeze':False,
              'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_ref':ref,'source_commit':os.environ['GITHUB_SHA'],
              'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
              'forbidden_study_data_read':False,'production_change_authorized':False
          }
          subject.write_bytes((json.dumps(contents,sort_keys=True,indent=2)+'\n').encode('utf8'))
          sha=hashlib.sha256(subject.read_bytes()).hexdigest()
          (output/'subject_sha256.txt').write_text(sha+'  '+subject.name+'\n',encoding='ascii')
          print('SYNTHETIC_SUBJECT_SHA256='+sha)
          PY_B57R

      - name: Attest synthetic-only subject using EXACT B57 action pin
        id: signed
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/b57r-synthetic-only/b57r_subject.json

      # GENUINE evidence must survive a failed non-authoritative shape probe.
      # Neither capture nor the shape probe establishes cryptographic validity.
      - name: Preserve signed bundle bytes BEFORE optional inspection
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.signed.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python3 - <<'PY_B57R_CAPTURE'
          import hashlib,os,pathlib,shutil
          def require(ok,code):
              if not ok: raise RuntimeError(code)
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'b57r-synthetic-only'
          subject=output/'b57r_subject.json'
          digest_line=(output/'subject_sha256.txt').read_text('ascii').strip()
          expected,name=digest_line.split('  ',1)
          require(name==subject.name,'SUBJECT_NAME_MISMATCH')
          require(hashlib.sha256(subject.read_bytes()).hexdigest()==expected,'SUBJECT_CHANGED_AFTER_SIGNING')
          supplied=os.environ.get('ATTESTATION_BUNDLE_PATH','')
          require(bool(supplied),'BUNDLE_PATH_EMPTY')
          source=pathlib.Path(supplied)
          require(source.is_file() and not source.is_symlink() and source.stat().st_size>100,'SIGNED_BUNDLE_NOT_FOUND')
          dest=output/'b57r_signed_attestation_bundle.json'
          require(not dest.exists(),'BUNDLE_ALREADY_PRESENT')
          shutil.copyfile(source,dest)
          require(dest.read_bytes()==source.read_bytes(),'BUNDLE_COPY_CHANGED')
          (output/'bundle_sha256.txt').write_text(hashlib.sha256(dest.read_bytes()).hexdigest()+'  '+dest.name+'\n',encoding='ascii')
          (output/'NOT_A_B57_FREEZE.txt').write_text(
              'Rehearsal signing output only; no independent cryptographic verification. '
              'Public transparency log entries can be permanent. NOT a B57 or scientific freeze.\n',encoding='utf8')
          print('B57R_BUNDLE_CAPTURED_NOT_CRYPTO_VERIFIED_NOT_FROZEN')
          PY_B57R_CAPTURE

      - name: Probe signed bundle using B57 identical strict parser (non-authoritative)
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_B57R_SHAPE'
          import base64, binascii, hashlib, json, math, os, pathlib
          def require(ok, code):
              if not ok:
                  raise RuntimeError(code)

          def strict_json(raw, label):
              require(not raw.startswith(b'\xef\xbb\xbf') and b'\r' not in raw, label + '_BOM_OR_CR')
              text = raw.decode('utf-8', errors='strict')
              def unique(pairs):
                  obj={}
                  for k,v in pairs:
                      require(k not in obj, label + '_DUPLICATE_KEY')
                      obj[k]=v
                  return obj
              def reject_constant(_):
                  raise ValueError(label + '_NONFINITE_CONSTANT')
              def finite_float(s):
                  f=float(s)
                  require(math.isfinite(f), label + '_NONFINITE_FLOAT')
                  return f
              obj=json.loads(text, object_pairs_hook=unique,
                             parse_constant=reject_constant, parse_float=finite_float)
              def reject_surrogate(x):
                  if isinstance(x,str):
                      require(not any(0xd800 <= ord(c) <= 0xdfff for c in x), label + '_SURROGATE')
                  elif isinstance(x,list):
                      for v in x: reject_surrogate(v)
                  elif isinstance(x,dict):
                      for k,v in x.items():
                          reject_surrogate(k)
                          reject_surrogate(v)
              reject_surrogate(obj)
              require(type(obj) is dict, label + '_NOT_OBJECT')
              return obj

          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'b57r-synthetic-only'
          subject=output/'b57r_subject.json'
          status=output/'bundle_shape_probe_status.json'
          try:
              expected,name=(output/'subject_sha256.txt').read_text('ascii').strip().split('  ',1)
              require(name==subject.name,'SUBJECT_NAME_MISMATCH')
              require(hashlib.sha256(subject.read_bytes()).hexdigest()==expected,'SUBJECT_CHANGED_AFTER_SIGNING')
              bundle=output/'b57r_signed_attestation_bundle.json'
              require(bundle.is_file() and not bundle.is_symlink() and bundle.stat().st_size>100,'SIGNED_BUNDLE_MISSING')
              # B57's exact strict_json and subject/name/digest logic; no signature authority.
              raw=strict_json(bundle.read_bytes(), 'BUNDLE')
              envelope=raw.get('dsseEnvelope')
              require(type(envelope) is dict and type(envelope.get('payload')) is str, 'BUNDLE_DSSE_MISSING')
              try:
                  payload=base64.b64decode(envelope['payload'],validate=True)
                  statement=strict_json(payload, 'BUNDLE_DSSE_PAYLOAD')
              except (ValueError,UnicodeDecodeError,binascii.Error) as exc:
                  raise RuntimeError('BUNDLE_DSSE_BAD_PAYLOAD') from exc
              subjects=statement.get('subject')
              require(type(subjects) is list and len(subjects)==1, 'BUNDLE_SUBJECT_COUNT_MISMATCH')
              entry=subjects[0]
              require(type(entry) is dict and entry.get('name')==subject.name, 'BUNDLE_SUBJECT_NAME_MISMATCH')
              digests=entry.get('digest')
              require(type(digests) is dict and set(digests)=={'sha256'} and
                      type(digests['sha256']) is str and digests['sha256']==expected,
                      'BUNDLE_SUBJECT_SHA256_MISMATCH')
              status.write_text(json.dumps({'status':'PASS_SANITY_ONLY_NOT_VERIFIED','error_code':None},sort_keys=True)+'\n')
              print('B57R_STRICT_BUNDLE_SHAPE_PASS_NOT_CRYPTO_VERIFIED')
          except Exception as exc:
              # Do not leak the bundle: preserve a code only and fail this advisory step.
              err=str(exc) if isinstance(exc,RuntimeError) else type(exc).__name__
              status.write_text(json.dumps({'status':'FAIL_SANITY_ONLY_EVIDENCE_PRESERVED','error_code':err},sort_keys=True)+'\n')
              print('B57R_STRICT_BUNDLE_SHAPE_FAILED_EVIDENCE_PRESERVED')
              raise
          PY_B57R_SHAPE

      - name: Upload preserved attempt-specific proof regardless of shape probe outcome
        id: transport
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b57r-synthetic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b57r-synthetic-only/
          if-no-files-found: error
          retention-days: 30

      - name: Mark malformed bundle red AFTER evidence upload
        if: ${{ !cancelled() && steps.signed.outcome == 'success' }}
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.transport.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY_B57R_FINAL'
          import json,os,pathlib
          status=pathlib.Path(os.environ['RUNNER_TEMP'])/'b57r-synthetic-only/bundle_shape_probe_status.json'
          if os.environ.get('UPLOAD_OUTCOME') != 'success':
              raise RuntimeError('B57R_EVIDENCE_UPLOAD_FAILED')
          if not status.is_file():
              raise RuntimeError('BUNDLE_SHAPE_PROBE_MISSING')
          if json.loads(status.read_text('utf-8')) != {'status':'PASS_SANITY_ONLY_NOT_VERIFIED','error_code':None}:
              raise RuntimeError('BUNDLE_SHAPE_FAILED_EVIDENCE_WAS_UPLOADED')
          print('B57R_REHEARSAL_ARTIFACT_CAPTURED_BUT_NOT_CRYPTO_VERIFIED')
          PY_B57R_FINAL
