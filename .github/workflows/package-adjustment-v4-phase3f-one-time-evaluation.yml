name: Package Adjustment V4 - Phase 3F One-Time Evaluation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  evaluate-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen evaluation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "scipy==1.16.2" "requests==2.34.2"

      - name: Guard immutable V4 confirmation state
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object "$V4/package_adjustment_v4_phase3f_evaluate.py")" = "d1541caa59344f3acb841ed5975a560dc27b0b09"

          test "$(git hash-object "$V4/phase1_structural_preregistration.json")" = "ac8e35c0104d95ea080897a460506cafa4a33203"
          test "$(git hash-object "$V4/frozen_candidate.json")" = "6b56cff2e0abd5eeee8189ca97e8bde7cb787c84"
          test "$(git hash-object "$V4/phase3b_confirmation_catalog.json")" = "0c974cd5d6a66c410f91775ba34fa068cc79f408"
          test "$(git hash-object "$V4/phase3_exact_600_frozen.json")" = "91d5d563aaf22382c7b740ca2d1caa4be9037f36"
          test "$(git hash-object "$V4/phase3_exact_600_freeze_manifest.json")" = "204bb2e8523ef1f388b740f8c942bc5d54bc76c4"
          test "$(git hash-object "$V4/phase3f_interpretation_contract.json")" = "c1b90709b9ca53f520c69b3b272fa74507029a09"

          test "$(git hash-object index.html)" = "f1240480f5b573304a43aed1b349dc220027d241"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = "5767022658e4f61721d9044f1ff6731c24e00bf1"

          test ! -e "$V4/phase3_confirmation_evaluation.json"
          test ! -e "$V4/phase3_confirmation_evaluation_manifest.json"
          test ! -e "$V4/phase3_confirmation_evaluation.md"

          grep -Fq "const PACKAGE_VOTE_V4C1_RESEARCH_CLOSED = true;" index.html
          test ! -e .github/workflows/package-adjustment-v4-phase3d-maturity-monitor.yml
          test ! -e .github/workflows/package-adjustment-v4-phase3e-exact-600-freeze.yml

      - name: Evaluator synthetic self-test
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3f_evaluate.py --selftest

      - name: Independent calculation audit
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3f_evaluate.py --audit-calculations

      - name: Outcome-unread frozen-contract and catalog-score preflight
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3f_evaluate.py --preflight

      - name: Run regressions before one-time unblinding
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify V1.6 before one-time unblinding
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Run one-time V4 confirmation evaluation
        run: python3 research/package-adjustment-v4-elite-fragmentation/package_adjustment_v4_phase3f_evaluate.py --evaluate

      - name: Snapshot first evaluation immediately
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"
          SNAP="/tmp/package-adjustment-v4-phase3f-first-evaluation"
          mkdir -p "$SNAP"
          cp "$V4/phase3_confirmation_evaluation.json" "$SNAP/"
          cp "$V4/phase3_confirmation_evaluation_manifest.json" "$SNAP/"
          cp "$V4/phase3_confirmation_evaluation.md" "$SNAP/"
          sha256sum "$SNAP"/* > "$SNAP/SHA256SUMS.txt"
          echo "PASS: first scientific evaluation snapshotted before any downstream step."

      - name: Preserve first scientific evaluation artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: package-adjustment-v4-phase3f-first-evaluation-${{ github.run_id }}
          path: /tmp/package-adjustment-v4-phase3f-first-evaluation/
          if-no-files-found: error
          retention-days: 90

      - name: Verify one-time result semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v4-elite-fragmentation")
          result = json.loads((d / "phase3_confirmation_evaluation.json").read_text())
          manifest = json.loads((d / "phase3_confirmation_evaluation_manifest.json").read_text())

          allowed = {
              "CONFIRMATION_PASSED_PRODUCTION_CANDIDATE_ELIGIBLE",
              "CONFIRMATION_FAILED_RESEARCH_ONLY",
              "CONFIRMATION_FAMILY_VALIDATED_CANDIDATE_SELECTION_UNRESOLVED",
              "CONFIRMATION_UNRESOLVED_AND_NO_CANDIDATE_PASSES_RESEARCH_ONLY",
          }
          assert result["status"] in allowed
          assert manifest["evaluation_status"] == result["status"]
          assert manifest["one_time_evaluation_consumed"] is True

          assert result["source_evidence"]["raw_ballots"] == 600
          assert result["source_evidence"]["effective_votes"] == 600.0
          assert result["source_evidence"]["voter_clusters"] == 31
          assert result["source_evidence"]["distinct_challenges"] == 231
          assert result["source_evidence"]["required_cells"] == 24
          assert result["source_evidence"]["freeze_dataset_sha256"] == "0027bd94719f4716d1c80b6578a9b5b0c9f779e762ef3e33f3861992158c706b"

          assert result["candidate_selection"]["runner_up_resolution_threshold"] == 0.002
          assert set(result["candidate_results"]) == {
              "elite-frag-s75-p210-p330",
              "elite-frag-s50-p210-p330",
          }
          assert result["interpretation"]["no_post_hoc_runner_up_substitution"] is True
          assert result["implementation"]["candidate_parameter_tuning_performed"] is False
          assert result["implementation"]["development_ktc_examples_used_as_tiebreaker"] is False
          assert result["implementation"]["row_predictions_persisted"] is False
          assert result["production_change_authorized"] is False
          assert manifest["production_change_authorized"] is False

          for cid, row in result["candidate_results"].items():
              gates = row["deployment_gates"]
              assert gates["minimum_required_improvement"] == 0.005
              assert gates["minimum_required_bootstrap_favorable_fraction"] == 0.9
              assert gates["maximum_allowed_group_regression"] == 0.03
              assert len(gates["topology_x_asset_mix"]) == 12

          if result["status"] == "CONFIRMATION_FAMILY_VALIDATED_CANDIDATE_SELECTION_UNRESOLVED":
              assert result["candidate_selection"]["selection_resolved"] is False
              assert result["family_confirmation_supported"] is True
              assert result["production_candidate_eligible"] is False
              assert result["interpretation"]["candidates_passing_all_deployment_gates"]

          if result["status"] == "CONFIRMATION_PASSED_PRODUCTION_CANDIDATE_ELIGIBLE":
              assert result["candidate_selection"]["selection_resolved"] is True
              assert result["production_candidate_eligible"] is True

          print("PASS: Phase 3F result obeys frozen candidate-selection and interpretation contracts.")
          print("V4_PHASE3F_STATUS=" + result["status"])
          PY

      - name: Run repository regressions after one-time evaluation
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production remains V1.6 after evaluation
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Remove completed one-time evaluation workflow
        run: git rm .github/workflows/package-adjustment-v4-phase3f-one-time-evaluation.yml

      - name: Stage exact Phase 3F scope
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          git add \
            "$V4/phase3_confirmation_evaluation.json" \
            "$V4/phase3_confirmation_evaluation_manifest.json" \
            "$V4/phase3_confirmation_evaluation.md"

          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/package-adjustment-v4-elite-fragmentation/phase3_confirmation_evaluation.json",
              "research/package-adjustment-v4-elite-fragmentation/phase3_confirmation_evaluation_manifest.json",
              "research/package-adjustment-v4-elite-fragmentation/phase3_confirmation_evaluation.md",
              ".github/workflows/package-adjustment-v4-phase3f-one-time-evaluation.yml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if changed != expected:
              raise RuntimeError(f"Unexpected V4 Phase 3F scope: {sorted(changed)}")
          print("PASS: exact four-file V4 Phase 3F evaluation/cleanup scope staged.")
          PY

      - name: Commit immutable one-time V4 evaluation
        shell: bash
        run: |
          set -euo pipefail
          V4="research/package-adjustment-v4-elite-fragmentation"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Evaluate Package Adjustment V4 exact 600 confirmation"
          git pull --rebase origin main

          test "$(git hash-object "$V4/phase3_exact_600_frozen.json")" = "91d5d563aaf22382c7b740ca2d1caa4be9037f36"
          test "$(git hash-object "$V4/phase3f_interpretation_contract.json")" = "c1b90709b9ca53f520c69b3b272fa74507029a09"
          test ! -e .github/workflows/package-adjustment-v4-phase3f-one-time-evaluation.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          python3 - <<'PY'
          import json
          from pathlib import Path
          d = Path("research/package-adjustment-v4-elite-fragmentation")
          result = json.loads((d / "phase3_confirmation_evaluation.json").read_text())
          print("V4_PHASE3F_STATUS=" + result["status"])
          print("V4_SELECTED=" + result["candidate_selection"]["selected_candidate_id"])
          print("V4_SELECTION_RESOLVED=" + str(result["candidate_selection"]["selection_resolved"]).lower())
          print("V4_FAMILY_SUPPORTED=" + str(result["family_confirmation_supported"]).lower())
          print("V4_PRODUCTION_CANDIDATE_ELIGIBLE=" + str(result["production_candidate_eligible"]).lower())
          PY

          git log --oneline -1
