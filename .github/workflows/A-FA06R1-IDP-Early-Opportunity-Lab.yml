      - name: Install in isolation and validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/utilities/install_idp_early_v1.py
          python3 scripts/utilities/install_idp_early_v1.py --check
          node --check assets/idp_early_v1.js
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts/utilities')
          import install_idp_early_v1 as installer
          board=Path('free-agent-board.html').read_text(encoding='utf-8')
          baseline=subprocess.check_output(['git','show','HEAD:free-agent-board.html']).decode('utf-8')
          restored=board.replace(installer.PANEL,'',1).replace(installer.STYLE,'',1).replace(installer.SCRIPT,'',1)
          if installer.PANEL_START in baseline:
              if board!=baseline:raise RuntimeError('Installed dashboard drifted from committed baseline')
          elif restored!=baseline:
              raise RuntimeError('Existing free-agent board changed beyond the strictly additive section')
          for marker in installer.MARKERS:
              if board.count(marker)!=1:raise RuntimeError('Missing/duplicate feature marker: '+marker)
          if board.count('id="idpoPanel"')!=1 or board.count('id="idpiPanel"')!=1 or board.count('id="idpePanel"')!=1:
              raise RuntimeError('IDP panel collision or missing original dashboard')
          snap=json.loads(Path('data/idp_usage_2026_season.json').read_text())
          if snap.get('counts',{}).get('players')!=436 or snap.get('policy')!='READ_ONLY_RESEARCH_NOT_FV_OR_PROJECTION':
              raise RuntimeError('Invalid A-FA04 source prerequisite')
          league=json.loads(Path('config.json').read_text())
          if league.get('league_id')!='1326679131051532288':
              raise RuntimeError('Wrong LOG league; refusing UI injection')
          paths=set()
          for raw in subprocess.check_output(['git','status','--porcelain','-z','--untracked-files=all']).decode().split('\0'):
              if not raw:continue
              if len(raw)<4:raise RuntimeError('Unexpected git status format')
              paths.add(raw[3:])
          allowed={'free-agent-board.html','assets/idp_early_v1.js','assets/idp_early_v1.css','scripts/utilities/install_idp_early_v1.py'}
          if not paths.issubset(allowed):raise RuntimeError('Unintended changed paths: '+str(paths-allowed))
          for path in ['assets/idp_early_v1.js','assets/idp_early_v1.css','scripts/utilities/install_idp_early_v1.py']:
              code=Path(path).read_text()
              if any(s in code for s in ('LOG-W10-IDP-Projections-PRIVATE','Week 10 IDP Projections.xlsx','2026-W10-Woellert-Private-Projections')):
                  raise RuntimeError('Possible protected subscriber artifact found in public asset')
          compile(Path('scripts/utilities/install_idp_early_v1.py').read_text(),'install_idp_early_v1.py','exec')
          print('PASS allowed paths:',sorted(paths))
          print('PASS strict prior HTML parity and independent UI install')
          print('PASS no FV, model, scoring, newsletter, data source or private artifacts modified')
          PYCODE
          git diff --check -- free-agent-board.html
      - name: Preview intended changes (no writes to GitHub)
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat -- free-agent-board.html
          git diff --numstat -- free-agent-board.html
          echo 'PREVIEW ONLY: source stats, projections, ranking snapshots and production valuations are unchanged.'
      - name: Apply - commit only additive early opportunity UI
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'log-idp-opportunity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- free-agent-board.html assets/idp_early_v1.js assets/idp_early_v1.css scripts/utilities/install_idp_early_v1.py
          git diff --cached --check -- free-agent-board.html assets/idp_early_v1.js assets/idp_early_v1.css scripts/utilities/install_idp_early_v1.py
          if git diff --cached --quiet; then
            echo 'Already installed identically; nothing to commit.'
          else
            git commit -m 'Add isolated private-import IDP early opportunity lab (read only)'
            git push origin HEAD:main
          fi
