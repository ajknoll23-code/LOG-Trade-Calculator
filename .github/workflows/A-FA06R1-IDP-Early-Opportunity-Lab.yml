name: A-FA06R1 - IDP Early Opportunity Lab (Private Imports)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates changes only; Apply installs public UI code, never private watchlists or paid projections"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

