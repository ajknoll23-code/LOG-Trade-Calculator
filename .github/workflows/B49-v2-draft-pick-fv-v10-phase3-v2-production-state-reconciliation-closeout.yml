name: B49 V2 Draft Pick FV V10 - Phase 3 V2 Production State Reconciliation and Closeout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  closeout:
    name: Verify deployed V10 release and close Phase 3 V2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin frozen V10 evidence and deployed release
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object research/draft-pick-fv-v10/v10_phase2_5_frozen_production_candidate.json)" = \
            "e28940df100e233d9cb1793244d57f65700a51e6"

          test "$(git hash-object research/draft-pick-fv-v10/v10_phase2_5_enhancement_result.json)" = \
            "1fc8a85ad69b3a180df6b9c7645f6041b9b0ee7d"

          test "$(git hash-object model/releases/draft-pick-fv-v10/manifest.json)" = \
            "8b614c8728e61456ec119cc95f6e2976ae881672"

          test "$(git hash-object model/releases/draft-pick-fv-v10/release.json)" = \
            "0b22d5dcd7f224db3c806ab5b0adf2ccda9ea81e"

          test "$(git hash-object model/releases/draft-pick-fv-v10/rollback.json)" = \
            "6fe558a19021159226a2ddca85591249e3339f6c"

          test "$(git hash-object research/draft-pick-fv-v10/v10_todo.json)" = \
            "d7b1af72ce904c0f5690d248803e1abc5dd0465e"

          deploy_commit="5d70c9c9027ac64eec12764d3bb657e50dd74e48"
          git merge-base --is-ancestor "$deploy_commit" HEAD

          test "$(git show -s --format=%s "$deploy_commit")" = \
            "Deploy Draft Pick FV V10 final production model"

          actual_files="$(git diff-tree --no-commit-id --name-only -r "$deploy_commit" | sort)"
          expected_files="$(printf '%s\n' \
            'free-agent-board.html' \
            'index.html' \
            'model/releases/draft-pick-fv-v10/README.md' \
            'model/releases/draft-pick-fv-v10/manifest.json' \
            'model/releases/draft-pick-fv-v10/release.json' \
            'model/releases/draft-pick-fv-v10/rollback.json' | sort)"
          test "$actual_files" = "$expected_files"

          echo "PASS: frozen V10 evidence, release, rollback, TODO, and exact deployment commit lineage are intact."

      - name: Verify Phase 2.5 decision and production release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          candidate = json.loads(
              Path("research/draft-pick-fv-v10/v10_phase2_5_frozen_production_candidate.json")
              .read_text(encoding="utf-8")
          )
          result = json.loads(
              Path("research/draft-pick-fv-v10/v10_phase2_5_enhancement_result.json")
              .read_text(encoding="utf-8")
          )
          release = json.loads(
              Path("model/releases/draft-pick-fv-v10/release.json")
              .read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path("model/releases/draft-pick-fv-v10/manifest.json")
              .read_text(encoding="utf-8")
          )
          todo = json.loads(
              Path("research/draft-pick-fv-v10/v10_todo.json")
              .read_text(encoding="utf-8")
          )

          assert result["decision"] == \
              "PASS_V10_PHASE2_5_AUTHORIZE_UPDATED_PHASE3_ENGINEERING_DEPLOYMENT"
          assert result["next_stage"] == \
              "Draft Pick FV V10 - Phase 3 Production Deployment V2"

          assert candidate["candidate_id"] == "V10_C1_PLUS_M1_PLUS_MT2_PLUS_YD2"
          assert candidate["tail_v2_promoted"] is True
          assert candidate["production_change_authorized"] is False

          assert release["release_id"] == "draft-pick-fv-v10-production-release-v2"
          assert release["candidate_id"] == candidate["candidate_id"]
          assert release["production_change_authorized"] is True
          assert release["pick_base_values"] == candidate["pick_base_values"]
          assert release["year_discount"] == candidate["year_discount"]
          assert release["fallback_discount"] == candidate["fallback_discount"] == 0.6

          assert manifest["release_id"] == release["release_id"]
          assert manifest["production_change_authorized"] is True
          assert manifest["runtime_pick_outputs_checked"] == 72
          assert manifest["runtime_pick_parity_pass"] is True
          assert manifest["package_adjustment_regression_pass"] is True
          assert manifest["free_agent_valuation_parity_pass"] is True
          assert manifest["full_repository_regression_pass"] is True
          assert manifest["rollback_artifact_present"] is True

          assert len(todo["items"]) == 1
          assert todo["items"][0]["id"] == "exact-rookie-slot-curve-v1"
          assert todo["items"][0]["status"] == "TODO_POST_V10"

          print("PASS: Phase 2.5 authorized Phase 3 V2 and the production release records that deployment.")
          print("PASS: post-V10 exact-rookie-slot follow-up remains separate and untouched.")
          PY

      - name: Verify current production surfaces still implement exact V10 release
        id: surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import re
          from pathlib import Path

          release = json.loads(
              Path("model/releases/draft-pick-fv-v10/release.json")
              .read_text(encoding="utf-8")
          )

          expected_base = {}
          for rnd in range(1, 7):
              expected_base[rnd] = {
                  slot: float(release["pick_base_values"][f"r{rnd}_{slot}"])
                  for slot in ("early", "mid", "late")
              }
          expected_discount = {
              str(k): float(v) for k, v in release["year_discount"].items()
          }

          def extract(path):
              text = Path(path).read_text(encoding="utf-8")
              assert text.count("const PICK_BASE = {") == 1, path
              assert text.count("const YEAR_DISCOUNT = {") == 1, path
              assert text.count("function pickValue(round, slot, year)") == 1, path
              assert "Draft Pick FV V10 production curve" in text, path
              assert "V10 YEAR_DISCOUNT V2" in text, path

              block = re.search(
                  r"const PICK_BASE = \{\n(?P<body>.*?)\n\};",
                  text,
                  flags=re.S,
              )
              assert block, path

              base = {}
              for m in re.finditer(
                  r"^\s*(\d+): \{early:([0-9.]+), mid:([0-9.]+), late:([0-9.]+)\},?$",
                  block.group("body"),
                  flags=re.M,
              ):
                  base[int(m.group(1))] = {
                      "early": float(m.group(2)),
                      "mid": float(m.group(3)),
                      "late": float(m.group(4)),
                  }
              assert set(base) == set(range(1, 7)), (path, base)

              yd = re.search(
                  r"const YEAR_DISCOUNT = \{ '2027':([0-9.]+), '2028':([0-9.]+), '2029':([0-9.]+) \};",
                  text,
              )
              assert yd, path
              discounts = {
                  "2027": float(yd.group(1)),
                  "2028": float(yd.group(2)),
                  "2029": float(yd.group(3)),
              }

              exact_fn = (
                  "function pickValue(round, slot, year){\n"
                  "  const base = (PICK_BASE[round] || PICK_BASE[6])[slot] ?? PICK_BASE[6].late;\n"
                  "  const disc = YEAR_DISCOUNT[year] ?? 0.6;\n"
                  "  return Math.round(base * disc);\n"
                  "}"
              )
              assert exact_fn in text, path
              return base, discounts

          index_surface = extract("index.html")
          fa_surface = extract("free-agent-board.html")
          assert index_surface == fa_surface

          prod_base, prod_discount = index_surface
          for rnd in range(1, 7):
              for slot in ("early", "mid", "late"):
                  actual = prod_base[rnd][slot]
                  expected = expected_base[rnd][slot]
                  assert abs(actual - expected) <= 5e-10, (
                      rnd, slot, actual, expected
                  )

          for year in ("2027", "2028", "2029"):
              assert abs(prod_discount[year] - expected_discount[year]) <= 5e-10, (
                  year, prod_discount[year], expected_discount[year]
              )

          deviations = []
          for rnd in range(1, 7):
              for slot in ("early", "mid", "late"):
                  deviations.append(
                      abs(prod_base[rnd][slot] - expected_base[rnd][slot])
                  )
          for year in ("2027", "2028", "2029"):
              deviations.append(
                  abs(prod_discount[year] - expected_discount[year])
              )
          max_abs_constant_deviation = max(deviations)
          assert max_abs_constant_deviation <= 5e-10, max_abs_constant_deviation

          def js_round_positive(x):
              return math.floor(x + 0.5)

          fallback = float(release["fallback_discount"])
          assert fallback == 0.6
          rel_disc = {
              year: float(release["year_discount"].get(year, fallback))
              for year in ("2026", "2027", "2028", "2029")
          }

          outputs, expected_outputs = {}, {}
          for year in ("2026", "2027", "2028", "2029"):
              disc = prod_discount.get(year, 0.6)
              for rnd in range(1, 7):
                  for slot in ("early", "mid", "late"):
                      key = f"{year}-r{rnd}-{slot}"
                      outputs[key] = js_round_positive(
                          prod_base[rnd][slot] * disc
                      )
                      expected_outputs[key] = js_round_positive(
                          expected_base[rnd][slot] * rel_disc[year]
                      )

          assert len(outputs) == 72
          assert outputs == expected_outputs, {
              key: (outputs[key], expected_outputs[key])
              for key in outputs
              if outputs[key] != expected_outputs[key]
          }
          assert all(v > 0 for v in outputs.values())

          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(
                  f"max_abs_constant_deviation={max_abs_constant_deviation:.17g}\n"
              )

          print("PASS: index.html and free-agent-board.html have identical V10 constants and pickValue logic.")
          print("PASS: current production constants match the frozen release within serialization precision.")
          print("PASS: all 72 production-runtime outputs exactly match full-precision frozen-release outputs.")
          print(f"PASS: maximum absolute serialized-constant deviation = {max_abs_constant_deviation:.17g}.")
          PY

      - name: Run current repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          echo "PASS: current repository regression suite is green with V10 deployed."

      - name: Write research closeout artifacts only
        shell: bash
        env:
          MAX_ABS_CONSTANT_DEVIATION: ${{ steps.surface.outputs.max_abs_constant_deviation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import textwrap
          from datetime import datetime, timezone
          from pathlib import Path

          release = json.loads(
              Path("model/releases/draft-pick-fv-v10/release.json")
              .read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path("model/releases/draft-pick-fv-v10/manifest.json")
              .read_text(encoding="utf-8")
          )

          out_json = Path(
              "research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.json"
          )
          out_md = Path(
              "research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.md"
          )

          if out_json.exists() or out_md.exists():
              raise SystemExit(
                  "Phase 3 V2 closeout artifact already exists; refusing overwrite."
              )

          doc = {
              "schema_version": 1,
              "study_id": "draft-pick-fv-v10-ex-ante-expected-value",
              "stage": "phase3_v2_production_state_reconciliation_and_closeout",
              "decision": (
                  "PASS_V10_PHASE3_V2_ALREADY_DEPLOYED_VALIDATED_CURRENT_"
                  "CLOSE_PRODUCTION_RELEASE"
              ),
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "deployment_commit": "5d70c9c9027ac64eec12764d3bb657e50dd74e48",
              "release_id": release["release_id"],
              "candidate_id": release["candidate_id"],
              "production_release_status": "DEPLOYED_VALIDATED_CURRENT",
              "closeout_state": "DEPLOYED / VALIDATED / CURRENT / CLOSED",
              "max_abs_serialized_constant_deviation": float(
                  os.environ["MAX_ABS_CONSTANT_DEVIATION"]
              ),
              "production_change_authorized_by_existing_release": True,
              "production_mutation_performed_by_closeout": False,
              "current_surfaces_verified": ["index.html", "free-agent-board.html"],
              "runtime_pick_outputs_recomputed": 72,
              "runtime_surface_parity_pass": True,
              "current_repository_regression_pass": True,
              "pick_value_runtime_logic_changed_by_closeout": False,
              "player_valuation_changed_by_closeout": False,
              "package_adjustment_changed_by_closeout": False,
              "team_utility_changed_by_closeout": False,
              "trade_desk_preview_changed_by_closeout": False,
              "fallback_discount": release["fallback_discount"],
              "pick_base_values": release["pick_base_values"],
              "year_discount": release["year_discount"],
              "rollback_artifact_present": manifest["rollback_artifact_present"],
              "next_research_item": {
                  "id": "exact-rookie-slot-curve-v1",
                  "status": "TODO_POST_V10",
                  "production_authorized": False,
                  "relationship": (
                      "separate post-V10 successor research; "
                      "not required to keep V10 deployed"
                  ),
              },
          }

          out_json.write_text(
              json.dumps(doc, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = textwrap.dedent(f"""\
          # Draft Pick FV V10 — Phase 3 Production Deployment V2 Closeout

          **Decision:** `{doc["decision"]}`

          The exact Phase 3 V2 production release was already deployed in commit
          `{doc["deployment_commit"]}` and remains current on both production surfaces.

          - Release: `{doc["release_id"]}`
          - Candidate: `{doc["candidate_id"]}`
          - Production state: **DEPLOYED / VALIDATED / CURRENT / CLOSED**
          - Current production mutation by this closeout: **No**
          - Runtime pick outputs recomputed: **72**
          - index ↔ free-agent-board parity: **PASS**
          - Current repository regression suite: **PASS**
          - PICK_BASE / YEAR_DISCOUNT: **match frozen V10 release**
          - pickValue runtime logic: **unchanged**
          - player valuation: **unchanged**
          - Package Adjustment: **unchanged**
          - Team Utility: **unchanged**
          - rollback artifact: **present**

          ## Scientific disposition

          V10 production deployment is complete. Do not redeploy or refit V10 from
          the Phase 2.5 `next_stage` marker; that marker predates the committed
          Phase 3 V2 release.

          The only recorded post-V10 research item is `exact-rookie-slot-curve-v1`.
          It is a separate successor study and has no authority to modify the
          deployed V10 release without its own preregistration, validation and
          production gate.
          """)
          out_md.write_text(md, encoding="utf-8")

          print(f"PASS: wrote {out_json}")
          print(f"PASS: wrote {out_md}")
          PY

      - name: Re-run regression suite with closeout artifacts present
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          echo "PASS: repository regression suite remains green with closeout artifacts present."

      - name: Prove closeout-only mutation scope
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code -- index.html free-agent-board.html model/releases/draft-pick-fv-v10
          git diff --check

          python3 - <<'PY'
          import subprocess

          allowed = {
              "research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.json",
              "research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.md",
          }
          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = {line[3:] for line in raw.splitlines() if line.strip()}
          assert touched == allowed, (touched, allowed)
          print("PASS: only the two V10 closeout artifacts changed.")
          PY

      - name: Commit V10 Phase 3 V2 closeout
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.json \
            research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.md

          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check

          git fetch origin main
          test "$(git rev-parse origin/main)" = "${BASE_SHA}" || {
            echo "ERROR: origin/main moved during B49 V2; refusing stale closeout." >&2
            exit 1
          }

          git add \
            research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.json \
            research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.md

          staged="$(git diff --cached --name-only)"
          expected="$(printf '%s\n%s' \
            'research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.json' \
            'research/draft-pick-fv-v10/v10_phase3_v2_production_closeout.md')"
          test "$staged" = "$expected"

          git commit -m "Close Draft Pick FV V10 Phase 3 V2 production release (B49 V2)"
          git push origin HEAD:main

          echo "PASS: V10 Phase 3 V2 production state reconciled and closed by B49 V2."

      - name: Closeout
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DRAFT PICK FV V10 PHASE 3 V2 CLOSEOUT COMPLETE ==="
          echo "Production deployment commit: 5d70c9c9027ac64eec12764d3bb657e50dd74e48"
          echo "Production mutation in this workflow: NONE"
          echo "V10 state: DEPLOYED / VALIDATED / CURRENT / CLOSED"
          echo "Next separate research item: exact-rookie-slot-curve-v1"
