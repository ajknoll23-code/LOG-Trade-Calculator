          C.AFTER=[...C.BEFORE.slice(1),'arrival_0','arrival_1','arrival_2'];
          run('PLAYER_DB=SYNTHETIC;');
          const before=run('tuOptimizeLegalRoster(tuPlayersFromKeys(BEFORE))');
          const after=run('tuOptimizeLegalRoster(tuPlayersFromKeys(AFTER))');
          assert.equal(before.starters.length,17);
          assert.equal(after.starters.length,17);
