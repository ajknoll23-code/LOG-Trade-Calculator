# LOG / QF7 A5-F03 — safe active-roster provenance review candidate.
# Owner uploads this file to .github/workflows/QF7-v2.yml and manually dispatches.
# REVIEW ONLY: No main/deployed/Pages changes, no model refitting, no frozen releases.
# Phase 0 independent Green: Actions run 38147699139, source QF6 blob 0fe267...
name: QF7 V2 - Active Roster Taxi IR Safe Fallback Review Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  qf7-v2-review-only:
    name: Review one-file starter/bench fallback repair and full regressions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QF7_TMP: /tmp/log-qf7-v2
      QF7_REVIEW_BRANCH: 'qf7-a5f03-v2-active-roster-review-2026-10-11'
      QF7_PHASE0_COMMIT: '1a979b086772f63c0666e36c87b92eca8ad88641'
      QF7_INDEX_BASE: '0fe2670c67cbea8d057c3c8ec5a6b2dfcce61b8e'
    steps:
      - name: Checkout exact owner-dispatched main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing regression and Chrome harness dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
      - name: Exact QF6 baseline, QF7 Phase 0 lineage, and protected blobs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'STOP not main'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo 'STOP bad checkout'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP dirty checkout'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved'; exit 1; }
          git merge-base --is-ancestor "$QF7_PHASE0_COMMIT" HEAD || { echo 'STOP QF7 Phase 0 Green lineage missing'; exit 1; }
          check_blob(){ local got; got="$(git hash-object "$1")"; [[ "$got" == "$2" ]] || { echo "STOP protected blob drift: $1 actual=$got"; exit 1; }; }
          check_blob index.html "$QF7_INDEX_BASE"
          check_blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
          check_blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
          check_blob free-agent-board.html '975efe51091a2315475678a9db0842b05c4fc3aa'
          check_blob scripts/validation/validate_free_agent_valuation_parity.py 'a103ce70a66b3bb1a48fbbd26479b2c7013f9acc'
          check_blob data/free_agent_utility_v1.json '557b8010082a87113ecf9d5574af108f3044a1e7'
          check_blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
          if git ls-remote --exit-code --heads origin "$QF7_REVIEW_BRANCH" >/dev/null; then echo 'STOP review branch exists'; exit 1; fi
          echo 'PASS QF7 Phase 0 ancestry and protected QF6 baseline; review branch is unused'
      - name: Prepare scoped patch, exact JavaScript QA, and real Chrome fixture
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$QF7_TMP"
          cat > "$QF7_TMP/patch.py" <<'QF7_PATCH_PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def replace_exact(old,new,tag):
           global s
           n=s.count(old)
           if n!=1:raise AssertionError(f'QF7 STOP {tag}: expected 1 original anchor, found {n}')
           s=s.replace(old,new,1)

          replace_exact('let MY_ROSTER = MY_ROSTER_FALLBACK.slice();\nlet MY_ROSTER_ID = null;', '''let MY_ROSTER = MY_ROSTER_FALLBACK.slice();
          /* QF7 A5-F03: verified personal-sync active keys, NEVER the unlabelled 41-key slice. */
          let MY_ROSTER_ACTIVE_KEYS = null;
          let MY_ROSTER_ACTIVE_ID = null;
          let MY_ROSTER_ID = null;''','cache declaration')

          replace_exact('function mergeLiveRoster(data){\n  const keys = [];', '''/* QF7_A5F03_PERSONAL_ACTIVE_PROVENANCE_V1
             Construct an active-only cache strictly from complete, ID-bearing personal
             Sleeper slot metadata. Every saved active key must be disjoint from taxi/IR.
             Missing, duplicate or malformed slot metadata returns null (unknown). */
          function qf7VerifiedPersonalActiveKeys(data){
            if(!data || data.roster_id === undefined || data.roster_id === null ||
               !Number.isFinite(data.synced_at) || data.synced_at <= 0) return null;
            const slots=['starters','bench','taxi','reserve_ir'];
            if(!slots.every(slot=>Array.isArray(data[slot]))) return null;
            const seenIds=new Set(), seenKeys=new Set(), active=[];
            for(const slot of slots){
              for(const p of data[slot]){
                if(!p || typeof p.player_id !== 'string' || !p.player_id ||
                   typeof p.name !== 'string' || !p.name.trim()) return null;
                const key=resolveExistingKey(normalizeName(p.name));
                const id=String(p.player_id);
                if(!key || seenIds.has(id) || seenKeys.has(key)) return null;
                seenIds.add(id); seenKeys.add(key);
                if(slot==='starters' || slot==='bench') active.push(key);
              }
            }
            if(!active.length) return null; // legal-roster optimizer owns any >41 cuts
            return active;
          }

          function mergeLiveRoster(data){
            const verifiedActive = qf7VerifiedPersonalActiveKeys(data);
            const keys = [];''','personal cache helper')

          replace_exact('''  MY_ROSTER = keys;
            if(typeof data.roster_id !== 'undefined'){
              MY_ROSTER_ID = data.roster_id;
              OWN_ROSTER_ID = data.roster_id; // only set here — the personal sync is the one true "this is really you" signal
            }
          }''','''  // Refresh personal provenance whether or not the viewer switched teams.
            MY_ROSTER_ACTIVE_KEYS = verifiedActive ? verifiedActive.slice() : null;
            MY_ROSTER_ACTIVE_ID = verifiedActive ? String(data.roster_id) : null;
            // A late personal-sync response may identify the owner, but must not
            // silently overwrite a previously confirmed selection of another team.
            const selectedOther = state.teamConfirmed && MY_ROSTER_ID !== null &&
              String(MY_ROSTER_ID) !== String(data.roster_id) &&
              LEAGUE_ROSTERS && LEAGUE_ROSTERS[MY_ROSTER_ID];
            if(!selectedOther){
              MY_ROSTER = keys;
              if(typeof data.roster_id !== 'undefined') MY_ROSTER_ID = data.roster_id;
            }
            if(typeof data.roster_id !== 'undefined'){
              OWN_ROSTER_ID = data.roster_id; // only set here — personal Sleeper sync verifies own identity
            }
          }''','merge tail with selected-team race')

          start=s.index('function tuActiveRosterKeys(){')
          end=s.index('/* Greedy lineup fill:',start)
          old=s[start:end]
          assert old.count('MY_ROSTER.slice')==1
          new='''function tuActiveRosterKeys(){
            const team = LEAGUE_ROSTERS && LEAGUE_ROSTERS[MY_ROSTER_ID];
            if(team && Array.isArray(team.players) && team.players.length){
              const validSlots=new Set(['starters','bench','taxi','reserve_ir']);
              const valid=team.players.every(p=>p && typeof p.key==='string' && !!p.key &&
                validSlots.has(p.slot));
              const distinct=new Set(team.players.map(p=>p && p.key)).size === team.players.length;
              if(valid && distinct){
                const active=team.players
                  .filter(p=>p.slot==='starters'||p.slot==='bench')
                  .map(p=>p.key);
                if(active.length) return active; // legal-roster optimizer applies the 41 cap
              }
            }
            // Personal fallback only when a successful complete personal sync
            // matches the CURRENTLY selected team. Never borrow another team's
            // roster, and never guess 41 from an unlabelled starter/bench/taxi list.
            if(Array.isArray(MY_ROSTER_ACTIVE_KEYS) && MY_ROSTER_ACTIVE_KEYS.length &&
               MY_ROSTER_ACTIVE_ID !== null &&
               String(MY_ROSTER_ID) === MY_ROSTER_ACTIVE_ID){
              return MY_ROSTER_ACTIVE_KEYS.slice();
            }
            return null; // unknown active-roster provenance; caller must suppress TU
          }

          '''
          s=s[:start]+new+s[end:]

          start=s.index('  const tuBeforeRoster = tuActiveRosterKeys();')
          end=s.index('  const marketSummary = packageMarketValueSummary(outgoing, incoming);',start)
          old=s[start:end]
          assert old.count('calculateTeamUtility')==1
          new='''  const tuBeforeRoster = tuActiveRosterKeys();
            const tuReady = Array.isArray(tuBeforeRoster);
            const tuOutKeys = tuReady ? outgoing
              .map(a => normalizeName(a.name))
              .filter(k => tuBeforeRoster.includes(k)) : [];
            const tuIncomingKeys = incoming.map(a => normalizeName(a.name));
            const tuAfterPool = tuReady ? tuBeforeRoster
              .filter(k => !tuOutKeys.includes(k))
              .concat(tuIncomingKeys) : null;
            const teamUtil = tuReady ? calculateTeamUtility(tuBeforeRoster, tuAfterPool) : null;
            if(tuReady){
              qf6ShowLineupWarning(tuBeforeRoster, tuAfterPool);
            } else {
              // Clear a prior QF6 banner if the active-roster source becomes unknown.
              const staleWarning=document.getElementById('qf6LineupWarning');
              if(staleWarning) staleWarning.remove();
            }
            const tuLine = teamUtil ? `
                <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:8px;">
                  Team Utility: <span style="color:${teamUtil.teamUtility >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600;">${teamUtil.teamUtility >= 0 ? '+' : ''}${teamUtil.teamUtility.toLocaleString()}</span>
                  <span style="color:var(--text-dim);"> — does this actually help your lineup</span>
                </div>` : `
                <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:8px;color:var(--amber);">
                  Team Utility unavailable — verified active starter/bench roster not loaded. No taxi/IR players assumed active.
                </div>`;

          '''
          s=s[:start]+new+s[end:]

          replace_exact('''      const projectedCuts = (teamUtil.postCuts || []).map(titleCase);
                const extraSlots = getting - giving;
                if(projectedCuts.length){''','''      const projectedCuts = teamUtil ? (teamUtil.postCuts || []).map(titleCase) : [];
                const extraSlots = getting - giving;
                if(!teamUtil){
                  packageNote = `<div style="color:var(--text-dim);margin-top:4px;">Expansion: receiving ${getting} players for ${giving}. Projected active-roster cuts unavailable until verified starter/bench data loads.</div>`;
                } else if(projectedCuts.length){''','no fabricated projected cuts')

          replace_exact('''      <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:8px;">
                  Team Utility: <span style="color:${tuColor};font-weight:600;">${tuSign}${teamUtil.teamUtility.toLocaleString()}</span>
                  <span style="color:var(--text-dim);"> — does this actually help your lineup</span>
                </div>
                ${[...outgoing, ...incoming].some(a => valueUncertaintyForPlayer(a.name, a.value)) ? `''','''      ${tuLine}
                ${[...outgoing, ...incoming].some(a => valueUncertaintyForPlayer(a.name, a.value)) ? `''','render TU safe unavailable')

          assert 'MY_ROSTER.slice(0, Math.min(TU_ACTIVE_ROSTER_LIMIT, MY_ROSTER.length))' not in s
          assert s.count('/* QF7_A5F03_PERSONAL_ACTIVE_PROVENANCE_V1') == 1
          assert s.count('const TU_BENCH_WEIGHT = 0.15;') == 1
          p.write_text(s,encoding='utf-8')
          print('PASS QF7 A5-F03 one-file patch installed in review checkout')
          QF7_PATCH_PY
          cat > "$QF7_TMP/qa.js" <<'QF7_QA_JS'
          'use strict';
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const vm=require('node:vm');
          const src=fs.readFileSync('index.html','utf8');
          const my=JSON.parse(fs.readFileSync('data/my_roster.json','utf8'));
          const league=JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
          function section(a,b){
            let i=src.indexOf(a);assert(i>=0,'missing anchor '+a);
            assert.equal(src.indexOf(a,i+1),-1,'repeated anchor '+a);
            const j=src.indexOf(b,i+a.length);assert(j>i,'missing end '+b);
            return src.slice(i,j);
          }
          const program=[
            section('function qf7VerifiedPersonalActiveKeys(data){','/* Known name-alias pairs'),
            section('const TU_DEDICATED_SLOTS = [','/* Greedy lineup fill:'),
            section('function tuOptimizeLineup(players){','/* Trade-level wrapper:'),
            section('function renderTradeImpact(){','/* ---------- IDP Weight Sensitivity ----------')
          ].join('\n');
          const C=vm.createContext({console,MYDATA:my,LEAGUEDATA:league});
          const bootstrap=`
          let MY_ROSTER=[],MY_ROSTER_ID=null,OWN_ROSTER_ID=null,
              MY_ROSTER_ACTIVE_KEYS=null,MY_ROSTER_ACTIVE_ID=null,LEAGUE_ROSTERS={},PLAYER_DB={};
          const state={teamConfirmed:true,myTeamSide:'A',A:[],B:[]};
          const warning={removed:false,remove(){this.removed=true;}};
          const wrap={innerHTML:''};
          const document={getElementById(k){return k==='tradeImpactWrap'?wrap:(k==='qf6LineupWarning'?warning:null);}};
          function normalizeName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();}
          function resolveExistingKey(k){return k;}
          function pickBestPosition(fp,pos){return (fp&&fp[0])||pos||null;}
          function resolveSyncedTeam(p){return p.team||null;}
          function playerValueByKey(k){return (PLAYER_DB[k]&&PLAYER_DB[k].value)||100;}
          function computeRosterNeeds(keys){return Object.fromEntries(['QB','RB','WR','TE','DL','LB','DB'].map(p=>[p,{count:0,tier:'Thin',target:1}]));}
          function packageMarketValueSummary(){return {};}
          function marketPackageLineHTML(){return '';}
          function valueUncertaintyForPlayer(){return null;}
          function escapeHtml(x){return String(x);}
          function titleCase(x){return String(x);}
          const TIER_COLOR={Thin:'red',Surplus:'green',Balanced:'yellow'};
          let qf6calls=0;
          function qf6ShowLineupWarning(){qf6calls++;}
          `;
          vm.runInContext(bootstrap+'\n'+program,C,{timeout:5000});
          function run(code){return vm.runInContext(code,C,{timeout:5000});}
          function list(expr){const x=run(expr);return x===null?null:Array.from(x);}
          const ID=p=>String(p.player_id);
          const ownKeys={};
          for(const slot of ['starters','bench','taxi','reserve_ir'])ownKeys[slot]=my[slot].map(p=>p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim());
          assert.equal(my.starters.length+my.bench.length,37);
          assert.equal(my.taxi.length,5);
          assert.equal(my.reserve_ir.length,1);
          // Cold-start fallback must never invent active members from an old, unlabeled list.
          run("MY_ROSTER=['a','b','taxi_candidate']; MY_ROSTER_ID=99; LEAGUE_ROSTERS={}; state.teamConfirmed=false;");
          assert.equal(list('tuActiveRosterKeys()'),null);
          run("state.A=[{type:'player',name:'A',value:200}];state.B=[{type:'player',name:'B',value:240}];renderTradeImpact();");
          assert.match(run('wrap.innerHTML'),/Team Utility unavailable/);
          assert.doesNotMatch(run('wrap.innerHTML'),/Team Utility:.*[+-]0/);
          console.log('PASS unverified cold start fails closed, never prints numeric TU or projected cuts');
          // Real personal sync is accepted, excluding all 5 taxi and IR even before league-wide sync.
          run('state.teamConfirmed=true; mergeLiveRoster(MYDATA);');
          let personal=list('tuActiveRosterKeys()');
          assert.deepEqual(personal,[...ownKeys.starters,...ownKeys.bench]);
          assert(personal.every(k=>!ownKeys.taxi.includes(k)&&!ownKeys.reserve_ir.includes(k)));
          assert.equal(run('MY_ROSTER_ACTIVE_ID'),String(my.roster_id));
          run('renderTradeImpact();');
          assert.match(run('wrap.innerHTML'),/Team Utility:/);
          assert.doesNotMatch(run('wrap.innerHTML'),/Team Utility unavailable/);
          console.log('PASS personal source active=37, taxi=0, IR=0, live render numeric only on verified data');
          // Authoritative, independent all-team sync always beats the personal cache.
          C.AUTH={};
          for(const roster of league.rosters){
           C.AUTH[roster.roster_id]={players:['starters','bench','taxi','reserve_ir'].flatMap(slot=>roster[slot].map(p=>({key:p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim(),slot})))};
          }
          run('LEAGUE_ROSTERS=AUTH;');
          const official=list('tuActiveRosterKeys()');
          assert.deepEqual(official,personal);
          C.AUTH[my.roster_id].players=[...C.AUTH[my.roster_id].players].reverse();
          const reversed=list('tuActiveRosterKeys()');
          assert.deepEqual(reversed,personal.slice().reverse());
          console.log('PASS authoritative roster takes precedence over personal cache');
          // Empty/corrupt authoritative metadata falls back to verified personal only for own team.
          C.AUTH[my.roster_id].players=[];
          assert.deepEqual(list('tuActiveRosterKeys()'),personal);
          C.AUTH[my.roster_id].players=[{key:'fake',slot:'wrong'}];
          assert.deepEqual(list('tuActiveRosterKeys()'),personal);
          console.log('PASS empty/broken league metadata uses proven personal active-only cache');
          // Selecting someone else must never read personal active keys. No synthetic zero utility.
          run('MY_ROSTER_ID=LEAGUEDATA.rosters[0].roster_id;');
          let other=list('tuActiveRosterKeys()');
          const r0=league.rosters[0];
          assert.deepEqual(other,[...r0.starters,...r0.bench].map(p=>p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()));
          run('LEAGUE_ROSTERS[MY_ROSTER_ID]={players:[]};');
          assert.equal(list('tuActiveRosterKeys()'),null);
          run('renderTradeImpact();');
          assert.match(run('wrap.innerHTML'),/Team Utility unavailable/);
          assert(run('warning.removed'));
          console.log('PASS other-team missing source returns unknown; stale warning removed');
          // Personal sync arrives AFTER user selected other team: preserve manual selection.
          run('LEAGUE_ROSTERS=AUTH; MY_ROSTER=["selected_roster_marker"];state.teamConfirmed=true;');
          const selected=run('MY_ROSTER_ID');
          run('mergeLiveRoster(MYDATA);');
          assert.equal(run('MY_ROSTER_ID'),selected);
          assert.deepEqual(list('MY_ROSTER'),['selected_roster_marker']);
          assert.equal(run('OWN_ROSTER_ID'),my.roster_id);
          console.log('PASS delayed own sync does not replace confirmed other-team selection');
          // Failed or incomplete personal source must revoke fallback eligibility.
          run('MY_ROSTER_ID=MYDATA.roster_id; LEAGUE_ROSTERS={};');
          let malformed=JSON.parse(JSON.stringify(my)); malformed.reserve_ir=null;
          C.MALFORMED=malformed;run('mergeLiveRoster(MALFORMED);');
          assert.equal(list('tuActiveRosterKeys()'),null);
          malformed=JSON.parse(JSON.stringify(my));malformed.taxi=[malformed.starters[0],...malformed.taxi];
          C.MALFORMED=malformed;run('mergeLiveRoster(MALFORMED);');
          assert.equal(list('tuActiveRosterKeys()'),null);
