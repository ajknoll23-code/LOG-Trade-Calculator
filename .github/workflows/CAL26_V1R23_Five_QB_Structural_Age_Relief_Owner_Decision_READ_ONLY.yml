# CAL26 V1R23 — Owner-decision preview ONLY. No production write permissions.
# Compares a young-established-QB age-relief hypothesis against all 64 frozen QB ratings.
# User ratings do not select eligible players and never set the relief coefficient.
name: CAL26 V1R23 - Five QB Structural Age Relief Owner Decision READ ONLY
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: cal26-v1r23-five-qb-age-relief-read-only
  cancel-in-progress: false
jobs:
  owner_decision_preview:
    name: Reproduce 565 prices and preview five QB age-relief candidates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main read only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm intended branch and pristine repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s index.html
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Download exact frozen CAL26 V1R20 and V1R22 evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cal26_v1r23_source20" "$RUNNER_TEMP/cal26_v1r23_source22"
          gh run download 39828172108 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R20-QB-FV-Drivers-565-Read-Only \
            --dir "$RUNNER_TEMP/cal26_v1r23_source20"
          gh run download 39844927734 --repo "$GITHUB_REPOSITORY" \
            --name CAL26-V1R22-All-64-QB-Owner-Driver-Review-Read-Only \
            --dir "$RUNNER_TEMP/cal26_v1r23_source22"
          test -s "$RUNNER_TEMP/cal26_v1r23_source20/CAL26_V1R20_Manifest.json"
          test -s "$RUNNER_TEMP/cal26_v1r23_source22/CAL26_V1R22_Manifest.json"
      - name: Materialize and compile isolated research engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cal26_v1r23_engine.py" <<'PY_CAL26_V1R23'
          #!/usr/bin/env python3
          """CAL26 V1R23 read-only, frozen-cohort QB age-relief micro-pilot.
          This previews a plausible structural rule; feedback is used ONLY for evaluation,
          not as a selector or numeric fit target. Never authorizes production mutation.
          """
          import argparse,csv,hashlib,json,math,re
          from collections import Counter
          from pathlib import Path
          
          INDEX='6ff8fcef45c1bb7f688ae6be52ec1a0d620d33706b4acbc7ece1bc13874ac6e9'
          RUN20=39828172108
          RUN22=39844927734
          A20='CAL26_V1R20_64_QB_Component_Attribution_and_Scenarios.csv'
          B20='CAL26_V1R20_All_565_Reproduced_Baseline_Zero_Write_Audit.csv'
          A22='CAL26_V1R22_64_QB_Full_Feedback_Independent_Driver_Audit_READ_ONLY.csv'
          SCENARIOS=(0.0,0.25,0.5,0.75,1.0)
          SOURCE_STATUS=('PASS_CAL26_V1R20_READ_ONLY_QB_DRIVER_DIAGNOSTIC','PASS_CAL26_V1R22_READ_ONLY_64_QB_EVIDENCE')
          
          def require(condition,code):
              if not condition:raise AssertionError(code)
          def sha(b):return hashlib.sha256(b).hexdigest()
          def norm(t):return re.sub(r'[^a-z0-9]', '',str(t).lower())
          def read_csv(p):
              with p.open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          def write_csv(p,rows):
              require(bool(rows),'EMPTY_CSV_'+p.name)
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=list(rows[0]),extrasaction='ignore');w.writeheader();w.writerows(rows)
          def unique_map(rows,key):
              d={}
              for x in rows:
                  k=norm(x[key]);require(k not in d,'DUPLICATE_NAME_'+k);d[k]=x
              return d
          
          def main(repo,src20,src22,out,selftest=False):
              m20=json.loads((src20/'CAL26_V1R20_Manifest.json').read_text())
              m22=json.loads((src22/'CAL26_V1R22_Manifest.json').read_text())
              require((m20['status'],m22['status'])==SOURCE_STATUS,'WRONG_UPSTREAM_STATUS')
              require(m20['canonical_index_sha256']==INDEX and m22['source_index_sha256']==INDEX,'PINNED_INDEX_MISMATCH')
              require(m22['source_v1r20_run']==RUN20 and m22['feedback_n']==64,'WRONG_UPSTREAM_LINEAGE')
              for manifest,root in ((m20,src20),(m22,src22)):
                  for f,digest in manifest['files'].items():require(sha((root/f).read_bytes())==digest,'UPSTREAM_DIGEST_'+f)
              live_index_sha=(sha((repo/'index.html').read_bytes()) if (repo/'index.html').is_file() and not selftest else None)
              current_checkout_matches_pinned=(live_index_sha==INDEX) if live_index_sha else None
              base=read_csv(src20/B20);component=read_csv(src20/A20);feedback=read_csv(src22/A22)
              require(len(base)==565 and len(component)==len(feedback)==64,'WRONG_PLAYER_COUNTS')
              require(Counter(x['feedback'] for x in feedback)=={'Too low':22,'Too high':18,'Correct':24},'FEEDBACK_DISTRIBUTION')
              require(sum(x['protected']=='True' for x in base)==33,'LOCK_COUNT_DRIFT')
              require(all(x['computed_fv_parity']=='True' and x['unchanged_in_repository']=='True' for x in base),'V1R20_BASELINE_PARITY')
              mbase=unique_map(base,'player');mc=unique_map(component,'player');mf=unique_map(feedback,'player')
              require(set(mc)==set(mf),'FEEDBACK_IDENTITY_MISMATCH')
              qbs={}; reviewed=[]; changed={p:set() for p in SCENARIOS}
              for k,c in mc.items():
                  f=mf[k];b=mbase[k]
                  require(b['position']=='QB','COMPONENT_NOT_QB_'+k)
                  fv=int(b['current_fv']);am=float(c['age_multiplier']);age=int(c['age'])
                  require(fv==int(c['baseline_fv'])==int(f['current_fv_frozen']),'FV_PARITY_'+k)
                  require(c['role']==f['role'] and age==int(f['age']),'ROLE_AGE_PARITY_'+k)
                  require((b['protected']=='True')==(c['is_owner_protected']=='True')==(f['is_protected']=='True'),'OWNER_LOCK_PARITY_'+k)
                  require(abs(am-float(f['age_multiplier']))<=1e-5,'AGE_PARITY_'+k)
                  require(0<am<=1.5,'INVALID_AGE_FACTOR_'+k)
                  free=float(c['pre_age_unrounded']);raw=math.floor(free*am+.5)
                  require(raw==int(c['canonical_raw_before_anchor_fv']),'RAW_FORMULA_PARITY_'+k)
                  age_penalty=int(c['age_penalty_points_without_anchor'])
                  require(age_penalty>=0 and math.floor(free+.5)-raw==age_penalty,'AGE_PENALTY_PARITY_'+k)
                  protected=b['protected']=='True'
                  # Hypothesis from economics: younger established starters with real evidence
                  # may be discounted too aggressively. OWNER RATINGS ARE NOT USED IN ELIGIBILITY.
                  eligible=(age<=25 and c['role'] in ('Elite','Starter','Every-Down') and
                      c['production_provenance']=='REAL_PRODUCTION_DATA' and not protected and am<1)
                  variants={}
                  for q in SCENARIOS:
                      if not eligible or q==0.0:price=fv
                      elif q==0.5:
                          # Exact frozen V1R20 half-relief candidate, not recomputed from truncated factors.
                          price=int(c['age_25_half_discount_relief_preview_fv'])
                      else:
                          alt_age=am+(1-am)*q
                          price=math.floor(free*alt_age+.5)
                      require(price>=fv,'RELIEF_CANNOT_LOWER_VALUE_'+k)
                      variants[q]=price
                      if price!=fv:changed[q].add(k)
                  if eligible:
                      require(variants[0.5]==int(c['age_25_half_discount_relief_preview_fv']),'FROZEN_HALF_RELIEF_PARITY_'+k)
                      require(variants[1.0]==int(c['original_age_free_fv']),'FROZEN_FULL_RELIEF_PARITY_'+k)
                  qbs[k]={'fv':fv,'prices':variants,'eligible':eligible,'protected':protected,'feedback':f['feedback'],'role':c['role'],'age':age,'age_factor':am,'production_source':c['production_provenance'],'games':f['games_with_2026_points_weeks1_6']}
                  row={'player':f['player'],'feedback':f['feedback'],'current_fv':fv,'age':age,'role':c['role'],
                       'production_source':c['production_provenance'],'protected':protected,
                       'structurally_eligible':eligible,'age_multiplier':format(am,'.6f'),'games_weeks1_6':f['games_with_2026_points_weeks1_6']}
                  for q in SCENARIOS:
                      name=f'fv_relief_{int(q*100)}pct';row[name]=variants[q]
                  row['delta_50pct']=variants[0.5]-fv
                  row['owner_direction_at_50pct']=('improves_direction_only' if variants[0.5]>fv and f['feedback']=='Too low'
                       else 'worsens_direction_only' if variants[0.5]>fv and f['feedback'] in ('Too high','Correct') else 'unchanged')
                  reviewed.append(row)
              require(len(qbs)==64,'QB_COVERAGE')
              identified={k for k,x in qbs.items() if x['eligible']}
              require(len(identified)==5,'STRUCTURAL_ELIGIBILITY_DRIFT_'+str(sorted(identified)))
              require(all(qbs[k]['feedback']=='Too low' for k in identified),'OWNER_DIRECTION_CONFLICT')
              require(len(changed[0.5])==5 and changed[0.5]==identified,'RELIEF_CANDIDATE_COUNT_DRIFT')
              require(all(qbs[k]['prices'][0.5]==qbs[k]['fv'] for k in qbs if qbs[k]['protected'] or qbs[k]['feedback']=='Correct'),'CONTROLS_CHANGED')
              full=[]
              for b in base:
                  k=norm(b['player']);fv=int(b['current_fv']);q=qbs.get(k)
                  alt=q['prices'][0.5] if q else fv
                  if b['protected']=='True':require(alt==fv,'GLOBAL_PROTECTED_CHANGED_'+k)
                  full.append({'player':b['player'],'position':b['position'],'baseline_fv':fv,'scenario_50pct_fv':alt,
                      'scenario_delta':alt-fv,'protected':b['protected'],'structurally_eligible':bool(q and q['eligible']),
                      'feedback':q['feedback'] if q else 'not_in_qb_feedback','production_authorized':False})
              require(len(full)==565 and sum(x['scenario_delta']!=0 for x in full)==5,'565_SCOPE_IMPACT')
              candidates=[x for x in reviewed if x['structurally_eligible']]
              candidates.sort(key=lambda x:-x['current_fv'])
              reviewed.sort(key=lambda x:-x['current_fv'])
              full.sort(key=lambda x:(x['position'], -x['baseline_fv'],x['player']))
              out.mkdir(parents=True,exist_ok=True)
              outputs={
                'CAL26_V1R23_5_QB_Structural_Age_Relief_Owner_Review.csv':candidates,
                'CAL26_V1R23_All_64_QB_Candidate_And_Feedback.csv':reviewed,
                'CAL26_V1R23_All_565_Shadow_Impact_Zero_Write.csv':full
              }
              for n,rows in outputs.items():write_csv(out/n,rows)
              names=', '.join(x['player'] for x in candidates)
              lines=['# CAL26 V1R23 — Five-QB structural age-relief preview','','**READ-ONLY / OWNER DECISION ONLY. No release is authorized.**','',
                '## Candidate definition','',
                'Young (age <=25) QB; established production-backed role (Elite, Every-Down, or Starter);',
                'production provenance = REAL_PRODUCTION_DATA; age factor below 1; not one of the 33 protected valuations.',
                'Owner feedback was **not** part of eligibility or coefficient selection. This is a post-hoc proposal on the same rated cohort, not independent validation.','',
                f'- Eligible QBs: **{len(candidates)}** — {names}',
                f'- 50% age-penalty relief: **{len(changed[0.5])}** prices increase; **560** unchanged.',
                '- All 33 owner-protected prices and all 24 Correct-rated QB controls unchanged in the 50% scenario.',
                '- No-price-change control (0%), mild 25%, half 50%, strong 75%, and full 100% relief shown for sensitivity, not optimized to owner ratings.',
                '- Broader 64-QB and full 565-player CSVs provided for any owner decision.', '',
                '## Specific limitations','',
                '- This preview is *not* a proven dynasty valuation model; the relief amount has not been calibrated against independent dynasty outcomes.',
                '- The same 64 owner ratings informed identification of the general problem and are therefore not an independent success metric.',
                '- Changing a general live rule can affect newly eligible QBs as weekly roles, ages, and production inputs refresh. A real release must guard the future dynamic scope.',
                '- Current price locks must remain authoritative, including protected Daniel Jones despite a Too-high rating.',
                '- Do not blend research-only production/opportunity/no-history coefficients into this age-only candidate.',
                '- No GitHub files, prices, or approved production constants are modified.', '',
                '## Decision','',
                'A bounded **five-player research preview** is available for owner review. Do not deploy automatically.',
                'If the owner approves a specific direction and range, the next step is a controlled preview of the exact production diff, including regression guards and future eligibility checks.']
              report='\n'.join(lines)+'\n'
              (out/'CAL26_V1R23_Owner_Decision_Report.md').write_text(report,encoding='utf-8')
              files={n:sha((out/n).read_bytes()) for n in [*outputs,'CAL26_V1R23_Owner_Decision_Report.md']}
              manifest={'status':'PASS_CAL26_V1R23_FIVE_QB_READ_ONLY_CANDIDATE',
                'version':'CAL26_V1R23','source_v1r20_run':RUN20,'source_v1r22_run':RUN22,
                'pinned_index_sha256':INDEX,'current_checkout_index_sha256':live_index_sha,
                'current_checkout_matches_pinned':current_checkout_matches_pinned,'source_v1r20_manifest_sha256':sha((src20/'CAL26_V1R20_Manifest.json').read_bytes()),
                'source_v1r22_manifest_sha256':sha((src22/'CAL26_V1R22_Manifest.json').read_bytes()),
                'players':565,'qbs':64,'feedback_counts':dict(Counter(x['feedback'] for x in feedback)),
                'protected_global_prices':33,'correct_qb_controls':24,
                'eligible_qbs':[x['player'] for x in candidates],
                'eligible_count':len(candidates),'delta_50pct_count':len(changed[0.5]),
                'production_change_authorized':False,'production_files_mutated':0,
                'owner_feedback_independent_validation':False,'relief_coefficient_empirically_calibrated':False,
                'files':files}
              (out/'CAL26_V1R23_Manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps({'status':manifest['status'],'eligible':manifest['eligible_qbs'],'changed_50pct':manifest['delta_50pct_count'],'protected':33,'read_only':True}))
              return manifest
          
          if __name__=='__main__':
           p=argparse.ArgumentParser();p.add_argument('--repo',type=Path,required=True);p.add_argument('--src20',type=Path,required=True);p.add_argument('--src22',type=Path,required=True);p.add_argument('--out',type=Path,required=True);p.add_argument('--selftest',action='store_true');a=p.parse_args()
           main(a.repo,a.src20,a.src22,a.out,a.selftest)
          PY_CAL26_V1R23
          python3 -m py_compile "$RUNNER_TEMP/cal26_v1r23_engine.py"
      - name: Build 565 player and 64 QB owner decision evidence read only
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/cal26_v1r23_engine.py" \
            --repo "$GITHUB_WORKSPACE" \
            --src20 "$RUNNER_TEMP/cal26_v1r23_source20" \
            --src22 "$RUNNER_TEMP/cal26_v1r23_source22" \
            --out "$RUNNER_TEMP/CAL26_V1R23_Evidence"
      - name: Independently verify exact protected values and complete output digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_V1R23_CHECK'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'CAL26_V1R23_Evidence'
          m=json.loads((p/'CAL26_V1R23_Manifest.json').read_text())
          assert m['status']=='PASS_CAL26_V1R23_FIVE_QB_READ_ONLY_CANDIDATE'
          assert (m['players'],m['qbs'],m['protected_global_prices'],m['correct_qb_controls'])==(565,64,33,24)
          assert m['eligible_count']==m['delta_50pct_count']==5
          assert m['feedback_counts']=={'Too low':22,'Too high':18,'Correct':24}
          assert m['production_change_authorized'] is False and m['production_files_mutated']==0
          assert m['owner_feedback_independent_validation'] is False
          assert m['relief_coefficient_empirically_calibrated'] is False
          assert m['source_v1r20_run']==39828172108 and m['source_v1r22_run']==39844927734
          for name,digest in m['files'].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest,name
          def records(name):
              with (p/name).open(newline='',encoding='utf-8') as f:return list(csv.DictReader(f))
          players=records('CAL26_V1R23_All_565_Shadow_Impact_Zero_Write.csv')
          qbs=records('CAL26_V1R23_All_64_QB_Candidate_And_Feedback.csv')
          candidates=records('CAL26_V1R23_5_QB_Structural_Age_Relief_Owner_Review.csv')
          assert len(players)==565 and len(qbs)==64 and len(candidates)==5
          assert len({r['player'] for r in players})==565
          assert len({r['player'] for r in qbs})==64
          assert sum(int(r['scenario_delta'])!=0 for r in players)==5
          assert sum(r['protected']=='True' for r in players)==33
          assert all(int(r['scenario_delta'])==0 for r in players if r['protected']=='True')
          assert all(int(r['delta_50pct'])==0 for r in qbs if r['feedback']=='Correct')
          assert all(r['feedback']=='Too low' and int(r['delta_50pct'])>0 for r in candidates)
          assert all(r['production_authorized']=='False' for r in players)
          print('PASS independent V1R23: 565 source parity / 64 QB / 5 candidate / 24 Correct controls / 33 protected')
          PY_V1R23_CHECK
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'PASS read-only repository, no production changes'
      - name: Upload review results for owner decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CAL26-V1R23-Five-QB-Structural-Age-Relief-Owner-Decision-Read-Only
          path: ${{ runner.temp }}/CAL26_V1R23_Evidence
          if-no-files-found: error
          retention-days: 60
