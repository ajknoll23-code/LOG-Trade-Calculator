name: Package Adjustment V3 - Research Closeout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard completed V3 evidence and current live surfaces
        shell: bash
        run: |
          set -euo pipefail

          D="research/package-adjustment-v3-ktc-style"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git hash-object "$D/phase3_confirmation_preregistration.json")" = "19966121899d41bdbc754a6a260758cf175b12e2"
          test "$(git hash-object "$D/phase3_confirmation_catalog.json")" = "3d4615e590697341ee8c27785d8b22e16b82ac44"
          test "$(git hash-object "$D/phase3_exact_600_frozen.json")" = "bf4779cadbfefdb694c1d028d876b2bad819ee88"
          test "$(git hash-object "$D/phase3_exact_600_freeze_manifest.json")" = "99e6cfcde0cfd28e0c7f486eba00b22bc24edef6"
          test "$(git hash-object "$D/phase3_confirmation_evaluation.json")" = "0f3eba0172c3765009ea5e266ef3f84994a7caa6"
          test "$(git hash-object "$D/phase3_confirmation_evaluation_manifest.json")" = "7bf4a96758fa08fa293b08e1b578f661b120fcf6"

          test "$(git hash-object index.html)" = "3cd4086c56708014aa60db270942d923703483f0"
          test "$(git hash-object scripts/validation/repo_regression_checks.py)" = "50bd4f8c8fd06798ab7e516d5ffb28d5b45cad95"

          # Completed V3 workflow inventory. These are no longer needed by V4
          # and will be deleted by this closeout after all research evidence is
          # frozen. Git history preserves their exact prior contents.
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase1-ktc-style-architecture.yml)" = "bbc8a72ccea8cf5c0ffe6f86b942fd3af9005553"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase2-candidate-family.yml)" = "5c33c7892cf99a30409f2949f249a2503ead7a4c"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase3a-confirmation-prereg.yml)" = "35273a131a45c23c8690c52e58459c9be48717b3"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase3b-confirmation-catalog.yml)" = "e452f24fcac6162dd30e028f991e0a38be45594a"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase3c-voting-activation.yml)" = "1ac4d4503b80c5e9146e4f42122ad05b85e96f19"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase3d-maturity-monitor.yml)" = "dbdcf8baf74ede094f1a768711e513590819ab6c"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase3e-freeze-exact-600.yml)" = "bff383eaf537dab6b93d8630d66669017e7e0acc"
          test "$(git hash-object .github/workflows/package-adjustment-v3-phase3f-one-time-evaluation.yml)" = "8a39cd4a403cbb1d975239101c8963d8e2466378"
          test -f .github/workflows/package-adjustment-v3-research-closeout.yml

          # These remain active because they are not V3-specific:
          # - package-adjustment-audit-step4-exact-live-oos.yml
          # - prospective-trade-evidence-capture.yml
          test -f .github/workflows/package-adjustment-audit-step4-exact-live-oos.yml
          test -f .github/workflows/prospective-trade-evidence-capture.yml

          test ! -e "$D/package_adjustment_v3_research_closeout.json"
          test ! -e "$D/package_adjustment_v3_research_closeout.md"
          test ! -e "$D/package_adjustment_v3_research_closeout_manifest.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          result = json.loads((d / "phase3_confirmation_evaluation.json").read_text())
          manifest = json.loads((d / "phase3_confirmation_evaluation_manifest.json").read_text())
          freeze = json.loads((d / "phase3_exact_600_freeze_manifest.json").read_text())

          assert result["status"] == "CONFIRMATION_UNRESOLVED_GAMMA_SELECTION_RESEARCH_ONLY"
          assert result["production_candidate_eligible"] is False
          assert result["production_change_authorized"] is False
          assert result["production_revision_unchanged"] == "v1.6-v5-size2-composition-overlay"

          assert result["candidate_selection"]["selected_candidate_id"] == "power-g2.15"
          assert result["candidate_selection"]["runner_up_candidate_id"] == "power-g2.01"
          assert result["candidate_selection"]["gamma_selection_resolved"] is False
          assert result["candidate_selection"]["best_vs_runner_up_log_loss_gap"] == 0.000229994661

          gates = result["deployment_gates"]
          assert gates["improvement_gate_pass"] is False
          assert gates["bootstrap_gate_pass"] is True
          assert gates["group_safety_gate_pass"] is True
          assert gates["all_24_frozen_cells_coverage_gate_pass"] is True
          assert gates["all_deployment_gates_pass"] is False
          assert gates["improvement_raw_minus_candidate"] == 0.000260423094
          assert gates["minimum_required_improvement"] == 0.005

          assert manifest["one_time_evaluation_consumed"] is True
          assert manifest["production_candidate_eligible"] is False

          assert freeze["checkpoint"]["effective_votes"] == 600.0
          assert freeze["checkpoint"]["distinct_voters"] == 30
          assert freeze["checkpoint"]["cells_passing_both_gates"] == 24

          print("PASS: immutable V3 evidence requires research closeout with no successor candidate.")
          PY

      - name: Verify V1.6 before closeout
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Disable V3C1 voting UI without changing package formula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          old_constants = """let PACKAGE_VOTE_CHALLENGES = null;
          let PACKAGE_VOTE_STATUS = 'idle';
          let packageVoteCurrent = null;
          """
          new_constants = """let PACKAGE_VOTE_CHALLENGES = null;
          let PACKAGE_VOTE_STATUS = 'idle';
          let packageVoteCurrent = null;
          const PACKAGE_VOTE_V3C1_RESEARCH_CLOSED = true;
          """
          if text.count(old_constants) != 1:
              raise RuntimeError("Expected exactly one V3C1 package-vote constant block")
          text = text.replace(old_constants, new_constants, 1)

          old_submit = """function packageVoteSubmit(displaySide){
          if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)) return;
          """
          new_submit = """function packageVoteSubmit(displaySide){
          if(PACKAGE_VOTE_V3C1_RESEARCH_CLOSED) return;
          if(Date.now() < Date.parse(PACKAGE_VOTE_VALID_AFTER_UTC)) return;
          """
          if text.count(old_submit) != 1:
              raise RuntimeError("Expected exactly one V3C1 packageVoteSubmit boundary")
          text = text.replace(old_submit, new_submit, 1)

          old_render = """function renderPackageVote(){
          const el = document.getElementById('packageVoteWrap');
          if(!el) return;

          """
          new_render = """function renderPackageVote(){
          const el = document.getElementById('packageVoteWrap');
          if(!el) return;

          /* PACKAGE_VOTE_V3C1_RESEARCH_CLOSED_V1
             Exact-600 confirmation is frozen and the one-time evaluation is spent.
             Preserve the frozen sampler below for provenance, but do not load or
             submit any additional V3C1 ballots. Production Package Adjustment
             remains V1.6. */
          if(PACKAGE_VOTE_V3C1_RESEARCH_CLOSED){
          el.innerHTML = `<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">
          Package Adjustment V3 research is closed. Thank you for contributing.
          </div>`;
          return;
          }

          """
          if text.count(old_render) != 1:
              raise RuntimeError("Expected exactly one V3C1 renderPackageVote boundary")
          text = text.replace(old_render, new_render, 1)

          index.write_text(text, encoding="utf-8")
          print("PASS: V3C1 vote UI closed; frozen sampler retained as provenance.")
          PY

      - name: Update regression contract for closed V3 research
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/validation/repo_regression_checks.py")
          text = path.read_text(encoding="utf-8")

          old = """    block = text[start:end]

              assert "PACKAGE_VOTE_V3C1_EXACT_CELL_SAMPLING_V1" in block
          """
          new = """    block = text[start:end]

              assert "const PACKAGE_VOTE_V3C1_RESEARCH_CLOSED = true;" in text
              assert "PACKAGE_VOTE_V3C1_RESEARCH_CLOSED_V1" in block
              assert "if(PACKAGE_VOTE_V3C1_RESEARCH_CLOSED) return;" in block
              assert "Package Adjustment V3 research is closed." in block
              assert "PACKAGE_VOTE_V3C1_EXACT_CELL_SAMPLING_V1" in block
          """
          if text.count(old) != 1:
              raise RuntimeError("Expected V3C1 regression contract insertion point not found")
          text = text.replace(old, new, 1)

          old_print = """    print(
                  "PASS V3C1 exact 24-cell fresh-confirmation sampling contract: "
                  "10 challenges/cell; recent-memory post-cell only; display randomized"
              )
          """
          new_print = """    print(
                  "PASS V3C1 closed research contract: voting disabled; frozen "
                  "24-cell sampler retained for provenance"
              )
          """
          if text.count(old_print) != 1:
              raise RuntimeError("Expected V3C1 regression success message not found")
          text = text.replace(old_print, new_print, 1)

          path.write_text(text, encoding="utf-8")
          print("PASS: regression contract now requires V3C1 voting closed.")
          PY

      - name: Write immutable V3 research closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path("research/package-adjustment-v3-ktc-style")
          eval_path = d / "phase3_confirmation_evaluation.json"
          eval_manifest_path = d / "phase3_confirmation_evaluation_manifest.json"
          freeze_path = d / "phase3_exact_600_frozen.json"
          freeze_manifest_path = d / "phase3_exact_600_freeze_manifest.json"
          prereg_path = d / "phase3_confirmation_preregistration.json"

          out_json = d / "package_adjustment_v3_research_closeout.json"
          out_md = d / "package_adjustment_v3_research_closeout.md"
          out_manifest = d / "package_adjustment_v3_research_closeout_manifest.json"

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          result = json.loads(eval_path.read_text())
          freeze_manifest = json.loads(freeze_manifest_path.read_text())
          closed_at = datetime.now(timezone.utc).isoformat()

          closeout = {
              "schema_version": 1,
              "study_id": "package-adjustment-v3-ktc-style",
              "status": "research_closed_no_successor_candidate",
              "closed": True,
              "closed_at_utc": closed_at,
              "research_only": True,
              "production_change_authorized": False,
              "production_revision_retained": "v1.6-v5-size2-composition-overlay",
              "successor_candidate_exists": False,
              "fresh_v3_voting_authorized": False,
              "v3c1_vote_ui_closed": True,
              "one_time_confirmation_evaluation_consumed": True,
              "workflow_cleanup": {
                  "completed_v3_workflows_deleted_from_active_actions": [
                      ".github/workflows/package-adjustment-v3-phase1-ktc-style-architecture.yml",
                      ".github/workflows/package-adjustment-v3-phase2-candidate-family.yml",
                      ".github/workflows/package-adjustment-v3-phase3a-confirmation-prereg.yml",
                      ".github/workflows/package-adjustment-v3-phase3b-confirmation-catalog.yml",
                      ".github/workflows/package-adjustment-v3-phase3c-voting-activation.yml",
                      ".github/workflows/package-adjustment-v3-phase3d-maturity-monitor.yml",
                      ".github/workflows/package-adjustment-v3-phase3e-freeze-exact-600.yml",
                      ".github/workflows/package-adjustment-v3-phase3f-one-time-evaluation.yml",
                      ".github/workflows/package-adjustment-v3-research-closeout.yml",
                  ],
                  "retained_for_current_production_or_future_research": [
                      ".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml",
                      ".github/workflows/prospective-trade-evidence-capture.yml",
                  ],
                  "deleted_workflows_remain_recoverable_from_git_history": True,
                  "v4_requires_new_workflows": True,
              },
              "confirmation_evidence": {
                  "effective_votes": 600.0,
                  "voter_clusters": 30,
                  "distinct_challenges": 218,
                  "cells_passing_both_gates": 24,
                  "spent_development_evidence_for_future_cycles": True,
                  "may_not_be_reused_as_fresh_confirmation": True,
              },
              "final_model_results": {
                  model["id"]: {
                      "gamma": model["gamma"],
                      "mean_held_out_log_loss": model["mean_held_out_log_loss"],
                  }
                  for model in result["models"]
              },
              "candidate_selection": result["candidate_selection"],
              "deployment_gates": {
                  "improvement_raw_minus_candidate": result["deployment_gates"]["improvement_raw_minus_candidate"],
                  "minimum_required_improvement": result["deployment_gates"]["minimum_required_improvement"],
                  "improvement_gate_pass": result["deployment_gates"]["improvement_gate_pass"],
                  "bootstrap_favorable_fraction": result["deployment_gates"]["challenge_cluster_bootstrap"]["favorable_fraction"],
                  "minimum_required_bootstrap_favorable_fraction": result["deployment_gates"]["minimum_required_bootstrap_favorable_fraction"],
                  "bootstrap_gate_pass": result["deployment_gates"]["bootstrap_gate_pass"],
                  "maximum_observed_group_regression": result["deployment_gates"]["maximum_observed_group_regression"],
                  "maximum_allowed_group_regression": result["deployment_gates"]["maximum_allowed_group_regression"],
                  "group_safety_gate_pass": result["deployment_gates"]["group_safety_gate_pass"],
                  "coverage_gate_pass": result["deployment_gates"]["all_24_frozen_cells_coverage_gate_pass"],
                  "all_deployment_gates_pass": False,
              },
              "scientific_conclusion": (
                  "The frozen global power-scarcity family did not earn production eligibility. "
                  "The best candidate, power-g2.15, improved held-out log loss over raw addition "
                  "by only 0.000260423094 versus the preregistered 0.005 minimum, and its gap "
                  "over power-g2.01 was only 0.000229994661 versus the 0.002 resolution threshold."
              ),
              "governance": {
                  "do_not_tune_gamma_on_the_same_600_votes": True,
                  "do_not_reuse_the_600_votes_as_fresh_confirmation": True,
                  "do_not_use_ktc_development_examples_as_posthoc_tiebreaker": True,
                  "future_package_adjustment_research_must_be_new_cycle": True,
                  "future_cycle_requires_new_structural_hypothesis": True,
                  "future_cycle_requires_new_preregistration_before_development_analysis": True,
                  "future_cycle_requires_fresh_confirmation_after_candidate_freeze": True,
                  "phase3b_parker_washington_provenance_exception_retained": (
                      freeze_manifest["pre_unblinding_provenance_exception"]
                  ),
              },
              "future_research_direction": {
                  "allowed": True,
                  "not_a_continuation_of_v3": True,
                  "working_hypothesis": (
                      "Test explicit elite-asset concentration and fragmentation/piece-count "
                      "effects rather than another global power exponent."
                  ),
                  "v3_600_vote_role": "spent development evidence only",
              },
              "next_action": (
                  "Begin a new Package Adjustment V4 research cycle with a preregistered "
                  "structural hypothesis. Production remains V1.6 until a new fresh-confirmation "
                  "cycle independently earns deployment eligibility."
              ),
          }

          out_json.write_text(
              json.dumps(closeout, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          md = f"""# Package Adjustment V3 Research Closeout

          **Status:** `research_closed_no_successor_candidate`

          Package Adjustment V3 is complete.

          ## Final production decision

          **No production change.** Production remains:

          `v1.6-v5-size2-composition-overlay`

          ## Exact fresh-confirmation result

          - Frozen effective votes: **600**
          - Distinct voter clusters: **30**
          - Distinct challenges: **218**
          - Coverage: **24 / 24 cells passed**
          - Raw additive control held-out log loss: **0.690887**
          - `power-g2.01`: **0.690857**
          - `power-g2.15`: **0.690627**
          - `power-g2.30`: **0.691671**
          - Best candidate: **`power-g2.15`**
          - Best vs runner-up gap: **0.000230** (required >= 0.002000)
          - Improvement vs raw: **0.000260** (required >= 0.005000)
          - Bootstrap favorable fraction: **0.9664** (PASS)
          - Maximum topology × asset-mix regression: **0.000394** (PASS)

          The global power-scarcity family therefore did not earn production eligibility.

          ## Governance closeout

          The exact 600-vote confirmation dataset is now **spent development evidence**.
          It may be used to understand why V3 failed and to develop a genuinely new future
          architecture, but it may **not** be reused as fresh confirmation evidence.

          Do not rescue V3 by trying nearby gamma values on the same results. Do not use the
          five KTC development screenshots as a post-hoc tiebreaker.

          V3C1 package voting is closed in the calculator. The frozen sampler remains in the
          source only as provenance.

          All V3-specific GitHub Actions workflows are removed from the active workflow folder
          by this closeout, including this closeout workflow itself after execution. Their prior
          contents remain recoverable from Git history. The live V1.6 exact-OOS audit and
          prospective real-trade evidence capture remain active because they are useful beyond V3.

          ## Next research cycle

          Package Adjustment V4 must begin with a new preregistered structural hypothesis.
          The initial direction is explicit **elite-asset concentration plus fragmentation /
          piece-count effects**, rather than another global power exponent.

          Any V4 candidate selected using the spent V3 evidence will still require a new,
          fresh confirmation dataset before production eligibility can be considered.
          """
          out_md.write_text(
              "\n".join(line.strip() for line in md.splitlines()).strip() + "\n",
              encoding="utf-8",
          )

          manifest = {
              "schema_version": 1,
              "status": "package_adjustment_v3_research_closeout_manifest",
              "closed": True,
              "closed_at_utc": closed_at,
              "production_change_authorized": False,
              "production_revision_retained": "v1.6-v5-size2-composition-overlay",
              "successor_candidate_exists": False,
              "fresh_v3_voting_authorized": False,
              "source_artifacts": {
                  "preregistration": {
                      "path": str(prereg_path),
                      "git_blob_sha": "19966121899d41bdbc754a6a260758cf175b12e2",
                      "sha256": sha256(prereg_path),
                  },
                  "frozen_exact_600": {
                      "path": str(freeze_path),
                      "git_blob_sha": "bf4779cadbfefdb694c1d028d876b2bad819ee88",
                      "sha256": sha256(freeze_path),
                  },
                  "freeze_manifest": {
                      "path": str(freeze_manifest_path),
                      "git_blob_sha": "99e6cfcde0cfd28e0c7f486eba00b22bc24edef6",
                      "sha256": sha256(freeze_manifest_path),
                  },
                  "evaluation": {
                      "path": str(eval_path),
                      "git_blob_sha": "0f3eba0172c3765009ea5e266ef3f84994a7caa6",
                      "sha256": sha256(eval_path),
                  },
                  "evaluation_manifest": {
                      "path": str(eval_manifest_path),
                      "git_blob_sha": "7bf4a96758fa08fa293b08e1b578f661b120fcf6",
                      "sha256": sha256(eval_manifest_path),
                  },
              },
              "outputs": {
                  "closeout": {
                      "path": str(out_json),
                      "sha256": sha256(out_json),
                  },
                  "summary": {
                      "path": str(out_md),
                      "sha256": sha256(out_md),
                  },
              },
              "v3c1_voting_ui_closed": True,
              "active_v3_workflows_deleted": [
                  ".github/workflows/package-adjustment-v3-phase1-ktc-style-architecture.yml",
                  ".github/workflows/package-adjustment-v3-phase2-candidate-family.yml",
                  ".github/workflows/package-adjustment-v3-phase3a-confirmation-prereg.yml",
                  ".github/workflows/package-adjustment-v3-phase3b-confirmation-catalog.yml",
                  ".github/workflows/package-adjustment-v3-phase3c-voting-activation.yml",
                  ".github/workflows/package-adjustment-v3-phase3d-maturity-monitor.yml",
                  ".github/workflows/package-adjustment-v3-phase3e-freeze-exact-600.yml",
                  ".github/workflows/package-adjustment-v3-phase3f-one-time-evaluation.yml",
                  ".github/workflows/package-adjustment-v3-research-closeout.yml",
              ],
              "active_package_workflows_retained": [
                  ".github/workflows/package-adjustment-audit-step4-exact-live-oos.yml",
                  ".github/workflows/prospective-trade-evidence-capture.yml",
              ],
              "next_action": (
                  "Start independent Package Adjustment V4 preregistration; "
                  "production remains V1.6."
              ),
          }
          out_manifest.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: immutable V3 closeout written.")
          PY

      - name: Delete completed V3 workflows from active Actions
        shell: bash
        run: |
          set -euo pipefail

          # V3 is closed. None of these workflows are reusable as active V4
          # automation because V4 must begin as a new preregistered research cycle.
          git rm             .github/workflows/package-adjustment-v3-phase1-ktc-style-architecture.yml             .github/workflows/package-adjustment-v3-phase2-candidate-family.yml             .github/workflows/package-adjustment-v3-phase3a-confirmation-prereg.yml             .github/workflows/package-adjustment-v3-phase3b-confirmation-catalog.yml             .github/workflows/package-adjustment-v3-phase3c-voting-activation.yml             .github/workflows/package-adjustment-v3-phase3d-maturity-monitor.yml             .github/workflows/package-adjustment-v3-phase3e-freeze-exact-600.yml             .github/workflows/package-adjustment-v3-phase3f-one-time-evaluation.yml             .github/workflows/package-adjustment-v3-research-closeout.yml

          # Explicitly prove the two non-V3 package workflows we still need remain.
          test -f .github/workflows/package-adjustment-audit-step4-exact-live-oos.yml
          test -f .github/workflows/prospective-trade-evidence-capture.yml

          echo "PASS: removed all nine V3-specific workflows from active Actions."
          echo "PASS: retained live V1.6 OOS audit and prospective real-trade capture."

      - name: Stage and verify exact closeout scope
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          expected = {
              "index.html",
              "scripts/validation/repo_regression_checks.py",
              "research/package-adjustment-v3-ktc-style/package_adjustment_v3_research_closeout.json",
              "research/package-adjustment-v3-ktc-style/package_adjustment_v3_research_closeout.md",
              "research/package-adjustment-v3-ktc-style/package_adjustment_v3_research_closeout_manifest.json",
              ".github/workflows/package-adjustment-v3-phase1-ktc-style-architecture.yml",
              ".github/workflows/package-adjustment-v3-phase2-candidate-family.yml",
              ".github/workflows/package-adjustment-v3-phase3a-confirmation-prereg.yml",
              ".github/workflows/package-adjustment-v3-phase3b-confirmation-catalog.yml",
              ".github/workflows/package-adjustment-v3-phase3c-voting-activation.yml",
              ".github/workflows/package-adjustment-v3-phase3d-maturity-monitor.yml",
              ".github/workflows/package-adjustment-v3-phase3e-freeze-exact-600.yml",
              ".github/workflows/package-adjustment-v3-phase3f-one-time-evaluation.yml",
              ".github/workflows/package-adjustment-v3-research-closeout.yml",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise RuntimeError(f"Unexpected closeout scope: {sorted(changed)}")
          print("PASS: exact 14-file V3 closeout/cleanup scope staged.")
          PY

      - name: Run full regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Verify production formula remains V1.6 after UI close
        run: python3 scripts/validation/check_package_adjustment_live.py

      - name: Commit V3 research closeout
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Close Package Adjustment V3 research"

          git pull --rebase origin main

          D="research/package-adjustment-v3-ktc-style"

          test "$(git hash-object "$D/phase3_confirmation_evaluation.json")" = "0f3eba0172c3765009ea5e266ef3f84994a7caa6"
          test "$(git hash-object "$D/phase3_confirmation_evaluation_manifest.json")" = "7bf4a96758fa08fa293b08e1b578f661b120fcf6"

          grep -Fq "const PACKAGE_VOTE_V3C1_RESEARCH_CLOSED = true;" index.html
          grep -Fq "PACKAGE_VOTE_V3C1_RESEARCH_CLOSED_V1" index.html
          grep -Fq "research_closed_no_successor_candidate" "$D/package_adjustment_v3_research_closeout.json"

          # Rebase must not resurrect any completed V3 workflow.
          for f in             package-adjustment-v3-phase1-ktc-style-architecture.yml             package-adjustment-v3-phase2-candidate-family.yml             package-adjustment-v3-phase3a-confirmation-prereg.yml             package-adjustment-v3-phase3b-confirmation-catalog.yml             package-adjustment-v3-phase3c-voting-activation.yml             package-adjustment-v3-phase3d-maturity-monitor.yml             package-adjustment-v3-phase3e-freeze-exact-600.yml             package-adjustment-v3-phase3f-one-time-evaluation.yml             package-adjustment-v3-research-closeout.yml
          do
            test ! -e ".github/workflows/$f"
          done

          test -f .github/workflows/package-adjustment-audit-step4-exact-live-oos.yml
          test -f .github/workflows/prospective-trade-evidence-capture.yml

          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/check_package_adjustment_live.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git push origin main

          echo "PACKAGE_ADJUSTMENT_V3_STATUS=research_closed_no_successor_candidate"
          echo "PRODUCTION_REVISION=v1.6-v5-size2-composition-overlay"
          git log --oneline -1
