name: Prod Mult Pipeline

# Runs prod_mult_pipeline.py -- the pipeline behind the live PROD_MULT_DATA
# table, the single most consequential number in this tool. OUTPUT-ONLY
# by design: does NOT touch index.html. Every other change to index.html
# this project has gone through a manual review step, and this workflow
# preserves that gate deliberately (confirmed directly, not assumed) --
# send the committed output + diff summary back for PROD_MULT_DATA to be
# regenerated and reviewed before it's baked into the live tool.
#
# Structural validation and a diff-vs-previous-run summary run BEFORE the
# commit, per external review: a successful Python exit code doesn't
# guarantee valid output, and a reviewer shouldn't have to visually diff
# a 1000+-player JSON file by eye. See validate_prod_mult_output.py for
# what's actually checked.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prod-mult-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the canonical branch, regardless of which
                       # branch workflow_dispatch happened to be launched
                       # from -- this generates canonical data, not a
                       # feature-branch experiment.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight -- confirm required inputs exist
        run: |
          missing=0
          for f in scripts/prod_mult_pipeline.py scripts/ppg_pipeline.py \
                   scripts/ppg_results.json scripts/sleeper_2026_projections.json \
                   scripts/fantasypros_2026_projections.json scripts/durability_results.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required input not found: $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more required inputs are missing -- see errors above. Aborting before running the pipeline."
            exit 1
          fi
          echo "All required inputs present."

      - name: Preserve previous output for diff comparison
        run: |
          if [ -f scripts/prod_mult_pipeline_output.json ]; then
            cp scripts/prod_mult_pipeline_output.json scripts/prod_mult_pipeline_output.previous.json
            echo "Previous output preserved for comparison."
          else
            echo "No previous output found (first run) -- diff comparison will be skipped, structural checks still apply."
          fi

      - name: Run the pipeline
        run: python3 scripts/prod_mult_pipeline.py

      - name: Self-test the validator before trusting its verdict
        run: python3 scripts/validate_prod_mult_output.py --selftest --selftest-only

      - name: Validate output and build diff summary
        run: python3 scripts/validate_prod_mult_output.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f scripts/prod_mult_pipeline_output.previous.json
          git add scripts/prod_mult_pipeline_output.json scripts/prod_mult_diff_summary.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run prod_mult_pipeline.py"
          git push
