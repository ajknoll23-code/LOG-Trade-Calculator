name: Install Prospective Trade Evidence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install prospective trade evidence capture
        shell: bash
        run: |
          mkdir -p research/package-adjustment-v1/prospective/snapshots
          mkdir -p scripts/validation

          cat > scripts/validation/capture_prospective_trade_evidence.py <<'PY'
          #!/usr/bin/env python3
          """
          Prospective trade-evidence capture for Package Adjustment research.

          RESEARCH ONLY. This does not change Fundamental Value, Market Value,
          Team Utility, Package Adjustment V0, or the live trade verdict.

          Each run:
          1) captures a compact current evidence snapshot;
          2) pulls every completed trade in the current Sleeper league;
          3) binds each trade only to the newest snapshot captured strictly
             BEFORE the transaction timestamp.

          A trade with no pre-trade snapshot is logged but never numerically
          evaluated with current/post-trade values.

          Pick treatment:
          - use captured early/mid/late draft-slot projection when that artifact
            explicitly applies to the pick season;
          - otherwise use mid, matching the project's future-pick convention.
          """

          from __future__ import annotations

          import argparse
          import json
          import math
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          CONFIG = ROOT / "config.json"
          INDEX = ROOT / "index.html"
          PLAYERS_CACHE = ROOT / "data" / "players_cache.json"
          FV_PATH = ROOT / "scripts" / "artifacts" / "generated" / "value_uncertainty.json"
          MV_PATH = ROOT / "scripts" / "artifacts" / "generated" / "market_values.json"
          SLOT_PATH = ROOT / "scripts" / "draft_slot_projection.json"
          V0_PATH = ROOT / "research" / "package-adjustment-v0" / "package_adjustment_v0.json"

          BASE_DIR = ROOT / "research" / "package-adjustment-v1" / "prospective"
          SNAPSHOT_DIR = BASE_DIR / "snapshots"
          EVIDENCE_PATH = BASE_DIR / "trade_evidence.json"
          REPORT_PATH = BASE_DIR / "trade_evidence.md"

          API = "https://api.sleeper.app/v1"
          MAX_WEEK = 18

          POS_MAP = {
              "QB":"QB","RB":"RB","WR":"WR","TE":"TE","K":"K",
              "DL":"DL","DE":"DL","DT":"DL",
              "LB":"LB","OLB":"LB","ILB":"LB",
              "DB":"DB","CB":"DB","S":"DB","SS":"DB","FS":"DB",
          }


          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8"))


          def normalize_name(value) -> str:
              s = str(value or "").strip().lower()
              s = re.sub(r"[.'’\-]", "", s)
              return re.sub(r"\s+", " ", s).strip()


          def finite(value):
              try:
                  x = float(value)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None


          def utc_now():
              return datetime.now(timezone.utc)


          def iso_z(dt):
              return dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")


          def parse_epoch_ms(value):
              try:
                  x = int(value)
              except (TypeError, ValueError):
                  return None
              return datetime.fromtimestamp(x / 1000.0, tz=timezone.utc)


          def fetch_json(url, retries=3):
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "trade-desk-prospective-evidence/1.0"},
                      )
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError) as exc:
                      last = exc
                      if attempt < retries - 1:
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Failed to fetch {url}: {last}")


          def player_cache():
              doc = read_json(PLAYERS_CACHE)
              rows = doc.get("players") if isinstance(doc, dict) else None
              return rows if isinstance(rows, dict) else {}


          def resolve_player(pid, cache):
              row = cache.get(str(pid)) or {}
              name = (
                  row.get("full_name")
                  or f"{row.get('first_name','')} {row.get('last_name','')}".strip()
                  or f"Unknown ({pid})"
              )
              pos = None
              for p in row.get("fantasy_positions") or []:
                  pos = POS_MAP.get(str(p).upper())
                  if pos:
                      break
              pos = pos or POS_MAP.get(str(row.get("position") or "").upper())
              return {
                  "player_id": str(pid),
                  "name": name,
                  "key": normalize_name(name),
                  "pos": pos,
                  "team": row.get("team"),
              }


          def load_fv():
              doc = read_json(FV_PATH)
              rows = doc.get("players") or {}
              out = {}
              for name, row in rows.items():
                  value = finite(row.get("center_value"))
                  if value is None or value <= 0:
                      continue
                  out[normalize_name(name)] = {
                      "fv": value,
                      "pos": row.get("pos"),
                      "uncertainty_tier": row.get("uncertainty_tier"),
                  }
              if len(out) < 500:
                  raise RuntimeError("Fundamental Value universe unexpectedly small")
              return out


          def load_mv():
              if not MV_PATH.exists():
                  return {}
              doc = read_json(MV_PATH)
              rows = doc.get("players") or {}
              out = {}
              for name, row in rows.items():
                  value = finite(row.get("market_value"))
                  if value is None:
                      continue
                  out[normalize_name(name)] = {
                      "mv": value,
                      "market_rank": row.get("market_rank"),
                      "market_percentile": row.get("market_percentile"),
                  }
              return out


          def parse_pick_policy():
              text = INDEX.read_text(encoding="utf-8")

              pick_match = re.search(
                  r"const\s+PICK_BASE\s*=\s*\{(.*?)\n\};",
                  text,
                  flags=re.S,
              )
              if not pick_match:
                  raise RuntimeError("Could not parse PICK_BASE from index.html")

              pick_base = {}
              row_re = re.compile(
                  r"(\d+)\s*:\s*\{\s*early\s*:\s*([0-9.]+)\s*,\s*"
                  r"mid\s*:\s*([0-9.]+)\s*,\s*late\s*:\s*([0-9.]+)"
              )
              for round_s, early, mid, late in row_re.findall(pick_match.group(1)):
                  pick_base[int(round_s)] = {
                      "early": float(early),
                      "mid": float(mid),
                      "late": float(late),
                  }
              if len(pick_base) < 6:
                  raise RuntimeError(f"PICK_BASE parse incomplete: {len(pick_base)} rounds")

              year_match = re.search(
                  r"const\s+YEAR_DISCOUNT\s*=\s*\{(.*?)\};",
                  text,
                  flags=re.S,
              )
              if not year_match:
                  raise RuntimeError("Could not parse YEAR_DISCOUNT from index.html")

              year_discount = {
                  year: float(value)
                  for year, value in re.findall(
                      r"['\"](\d{4})['\"]\s*:\s*([0-9.]+)",
                      year_match.group(1),
                  )
              }
              if not year_discount:
                  raise RuntimeError("YEAR_DISCOUNT parse returned no years")

              return {
                  "pick_base": pick_base,
                  "year_discount": year_discount,
                  "unknown_year_discount": 0.6,
              }


          def load_slot_projection():
              if not SLOT_PATH.exists():
                  return None
              doc = read_json(SLOT_PATH)
              if not isinstance(doc, dict):
                  return None
              return {
                  "generated_at": doc.get("generated_at"),
                  "applies_to_season": str(doc.get("applies_to_season") or ""),
                  "tiers": {
                      str(k): str(v)
                      for k, v in (doc.get("tiers") or {}).items()
                      if str(v) in {"early", "mid", "late"}
                  },
                  "tiebreak_verified": doc.get("tiebreak_verified"),
              }


          def pick_tier(pick, slot_projection):
              season = str(pick.get("season") or "")
              original_roster = str(pick.get("roster_id") or "")
              if (
                  slot_projection
                  and season == slot_projection.get("applies_to_season")
                  and original_roster in slot_projection.get("tiers", {})
              ):
                  return slot_projection["tiers"][original_roster], "captured_slot_projection"
              return "mid", "future_pick_default_mid"


          def pick_value(round_num, season, tier, policy):
              try:
                  r = int(round_num)
              except (TypeError, ValueError):
                  return None
              base_round = r if r in policy["pick_base"] else max(policy["pick_base"])
              base = policy["pick_base"][base_round][tier]
              disc = policy["year_discount"].get(
                  str(season),
                  policy["unknown_year_discount"],
              )
              return round(base * disc)


          def capture_rosters(league_id, cache):
              users = fetch_json(f"{API}/league/{league_id}/users")
              rosters = fetch_json(f"{API}/league/{league_id}/rosters")
              user_by_id = {str(u.get("user_id")): u for u in users}

              result = {}
              for roster in rosters:
                  rid = str(roster.get("roster_id"))
                  user = user_by_id.get(str(roster.get("owner_id")), {})
                  result[rid] = {
                      "owner_username": user.get("display_name"),
                      "team_name": (
                          (user.get("metadata") or {}).get("team_name")
                          or user.get("display_name")
                      ),
                      "players": [
                          resolve_player(pid, cache)
                          for pid in (roster.get("players") or [])
                      ],
                      "taxi": [
                          resolve_player(pid, cache)
                          for pid in (roster.get("taxi") or [])
                      ],
                      "reserve": [
                          resolve_player(pid, cache)
                          for pid in (roster.get("reserve") or [])
                      ],
                  }
              return result


          def snapshot_payload():
              cfg = read_json(CONFIG)
              league_id = str(cfg["league_id"])
              cache = player_cache()
              fv = load_fv()
              mv = load_mv()
              policy = parse_pick_policy()
              slots = load_slot_projection()
              rosters = capture_rosters(league_id, cache)

              v0 = read_json(V0_PATH)
              formula = {
                  "method": v0.get("method"),
                  "formula": v0.get("formula"),
                  "value_lens": v0.get("value_lens"),
                  "production_formula_enabled": v0.get("production_formula_enabled"),
              }

              now = utc_now()
              return {
                  "schema_version": 1,
                  "status": "prospective_pretrade_evidence_snapshot",
                  "captured_at_utc": iso_z(now),
                  "captured_epoch_ms": int(now.timestamp() * 1000),
                  "league_id": league_id,
                  "fundamental_values": fv,
                  "market_values": mv,
                  "pick_policy": policy,
                  "draft_slot_projection": slots,
                  "rosters": rosters,
                  "package_adjustment_v0": formula,
              }


          def write_snapshot(payload):
              SNAPSHOT_DIR.mkdir(parents=True, exist_ok=True)
              ts = payload["captured_at_utc"].replace("-", "").replace(":", "")
              filename = f"{ts}_trade-evidence.json"
              path = SNAPSHOT_DIR / filename
              path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              return path


          def load_snapshot_index():
              items = []
              for path in sorted(SNAPSHOT_DIR.glob("*_trade-evidence.json")):
                  try:
                      doc = read_json(path)
                  except Exception:
                      continue
                  ms = doc.get("captured_epoch_ms")
                  if isinstance(ms, int):
                      items.append((ms, path, doc))
              items.sort(key=lambda x: x[0])
              return items


          def latest_pretrade_snapshot(transaction_ms, snapshots):
              eligible = [item for item in snapshots if item[0] < transaction_ms]
              return eligible[-1] if eligible else None


          def all_current_trades(league_id):
              trades = []
              seen = set()
              for week in range(1, MAX_WEEK + 1):
                  rows = fetch_json(f"{API}/league/{league_id}/transactions/{week}")
                  for t in rows or []:
                      if t.get("type") != "trade" or t.get("status") != "complete":
                          continue
                      tid = str(t.get("transaction_id") or "")
                      if not tid or tid in seen:
                          continue
                      seen.add(tid)
                      trades.append(t)
              trades.sort(key=lambda t: int(t.get("created") or 0))
              return trades


          def geometry(values, other_values):
              vals = [float(v) for v in values if v is not None and float(v) > 0]
              other = [float(v) for v in other_values if v is not None and float(v) > 0]
              if not vals:
                  return {
                      "raw_fv": 0.0,
                      "hhi": None,
                      "fragmentation": None,
                      "top_asset_fv": None,
                      "best_asset_gap": None,
                      "fg": None,
                  }

              total = sum(vals)
              hhi = sum((v / total) ** 2 for v in vals)
              frag = 1.0 - hhi
              top = max(vals)
              other_top = max(other) if other else None
              gap = max(0.0, 1.0 - top / other_top) if other_top and other_top > 0 else 0.0

              return {
                  "raw_fv": round(total, 3),
                  "hhi": round(hhi, 8),
                  "fragmentation": round(frag, 8),
                  "top_asset_fv": round(top, 3),
                  "best_asset_gap": round(gap, 8),
                  "fg": round(frag * gap, 8),
              }


          def side_assets(t, rid, snapshot, cache):
              assets = []
              unresolved = []

              for pid, receiving_rid in (t.get("adds") or {}).items():
                  if str(receiving_rid) != str(rid):
                      continue
                  p = resolve_player(pid, cache)
                  fvrow = snapshot["fundamental_values"].get(p["key"])
                  mvrow = snapshot["market_values"].get(p["key"])
                  fv = finite((fvrow or {}).get("fv"))
                  if fv is None:
                      unresolved.append({
                          "type": "player",
                          "player_id": p["player_id"],
                          "name": p["name"],
                          "reason": "fundamental_value_unresolved",
                      })
                  assets.append({
                      "type": "player",
                      **p,
                      "fv": fv,
                      "mv": finite((mvrow or {}).get("mv")),
                  })

              slot_projection = snapshot.get("draft_slot_projection")
              policy = snapshot["pick_policy"]
              for pick in t.get("draft_picks") or []:
                  if str(pick.get("owner_id")) != str(rid):
                      continue
                  tier, tier_source = pick_tier(pick, slot_projection)
                  fv = pick_value(
                      pick.get("round"),
                      pick.get("season"),
                      tier,
                      policy,
                  )
                  if fv is None:
                      unresolved.append({
                          "type": "pick",
                          "season": pick.get("season"),
                          "round": pick.get("round"),
                          "reason": "pick_value_unresolved",
                      })
                  assets.append({
                      "type": "pick",
                      "season": str(pick.get("season")),
                      "round": pick.get("round"),
                      "original_roster_id": str(pick.get("roster_id")),
                      "tier": tier,
                      "tier_source": tier_source,
                      "fv": fv,
                      "mv": None,
                  })

              return assets, unresolved


          def evaluate_trade(t, snapshot_item, cache):
              transaction_ms = int(t.get("created") or 0)
              transaction_dt = parse_epoch_ms(transaction_ms)
              rid_list = [str(x) for x in (t.get("roster_ids") or [])]

              base = {
                  "transaction_id": str(t.get("transaction_id")),
                  "created_epoch_ms": transaction_ms,
                  "created_at_utc": iso_z(transaction_dt) if transaction_dt else None,
                  "roster_ids": rid_list,
                  "status": "prospective_logged",
                  "eligible_for_numeric_package_research": False,
              }

              if snapshot_item is None:
                  base["exclusion_reason"] = "no_snapshot_captured_before_trade"
                  return base

              snapshot_ms, snapshot_path, snapshot = snapshot_item
              age_hours = (transaction_ms - snapshot_ms) / 3_600_000.0
              base["pretrade_snapshot"] = {
                  "file": str(snapshot_path.relative_to(ROOT)),
                  "captured_at_utc": snapshot.get("captured_at_utc"),
                  "age_hours_at_trade": round(age_hours, 3),
              }

              sides = []
              all_resolved = True
              for rid in rid_list:
                  assets, unresolved = side_assets(t, rid, snapshot, cache)
                  all_resolved = all_resolved and not unresolved and bool(assets)
                  roster_meta = (snapshot.get("rosters") or {}).get(rid, {})
                  sides.append({
                      "roster_id": rid,
                      "team_name": roster_meta.get("team_name"),
                      "received_assets": assets,
                      "unresolved_assets": unresolved,
                  })

              if len(sides) != 2:
                  base["sides"] = sides
                  base["exclusion_reason"] = "non_two_sided_trade"
                  return base

              values_a = [a.get("fv") for a in sides[0]["received_assets"]]
              values_b = [a.get("fv") for a in sides[1]["received_assets"]]
              sides[0]["package_geometry"] = geometry(values_a, values_b)
              sides[1]["package_geometry"] = geometry(values_b, values_a)
              base["sides"] = sides

              if not all_resolved:
                  base["exclusion_reason"] = "one_or_more_assets_unresolved"
                  return base

              base["eligible_for_numeric_package_research"] = True
              base["exclusion_reason"] = None
              return base


          def build_evidence(snapshot_path):
              cfg = read_json(CONFIG)
              league_id = str(cfg["league_id"])
              cache = player_cache()
              snapshots = load_snapshot_index()
              trades = all_current_trades(league_id)

              existing = {}
              if EVIDENCE_PATH.exists():
                  old = read_json(EVIDENCE_PATH)
                  existing = old.get("trades") or {}

              for t in trades:
                  tid = str(t.get("transaction_id") or "")
                  if not tid:
                      continue

                  previous = existing.get(tid)
                  if previous and previous.get("eligible_for_numeric_package_research"):
                      continue

                  created = int(t.get("created") or 0)
                  prior = latest_pretrade_snapshot(created, snapshots)
                  existing[tid] = evaluate_trade(t, prior, cache)

              eligible = [
                  row for row in existing.values()
                  if row.get("eligible_for_numeric_package_research")
              ]
              excluded = [
                  row for row in existing.values()
                  if not row.get("eligible_for_numeric_package_research")
              ]

              return {
                  "schema_version": 1,
                  "status": "research_only_prospective_trade_evidence",
                  "consumer_changed": False,
                  "generated_at_utc": iso_z(utc_now()),
                  "current_league_id": league_id,
                  "latest_snapshot": str(snapshot_path.relative_to(ROOT)),
                  "methodology": {
                      "all_completed_current_league_trades": True,
                      "player_only_trades_included": True,
                      "requires_snapshot_strictly_before_trade": True,
                      "post_trade_values_never_substituted": True,
                      "future_pick_default_tier_without_signal": "mid",
                      "package_geometry": "FV-only HHI fragmentation x relative best-asset gap",
                      "team_utility_not_used_as_package_adjustment_label": True,
                  },
                  "counts": {
                      "trade_count": len(existing),
                      "eligible_numeric_trade_count": len(eligible),
                      "excluded_trade_count": len(excluded),
                      "snapshot_count": len(snapshots),
                  },
                  "trades": dict(sorted(
                      existing.items(),
                      key=lambda kv: kv[1].get("created_epoch_ms") or 0,
                  )),
              }


          def write_report(doc):
              counts = doc["counts"]
              reasons = {}
              eligible_ages = []

              for trade in doc["trades"].values():
                  if trade.get("eligible_for_numeric_package_research"):
                      age = finite((trade.get("pretrade_snapshot") or {}).get("age_hours_at_trade"))
                      if age is not None:
                          eligible_ages.append(age)
                  else:
                      reason = trade.get("exclusion_reason") or "unknown"
                      reasons[reason] = reasons.get(reason, 0) + 1

              lines = [
                  "# Prospective Package-Trade Evidence",
                  "",
                  "**Status: RESEARCH ONLY — no production consumer changed.**",
                  "",
                  f"- Captured evidence snapshots: `{counts['snapshot_count']}`",
                  f"- Current-league completed trades logged: `{counts['trade_count']}`",
                  f"- Numerically eligible trades: `{counts['eligible_numeric_trade_count']}`",
                  f"- Excluded trades: `{counts['excluded_trade_count']}`",
                  "",
                  "A trade is numerically eligible only when a stored evidence "
                  "snapshot predates the Sleeper transaction timestamp. Current "
                  "or post-trade values are never substituted.",
                  "",
                  "## Exclusions",
                  "",
              ]

              if reasons:
                  for reason, count in sorted(reasons.items()):
                      lines.append(f"- `{reason}`: {count}")
              else:
                  lines.append("- None")

              if eligible_ages:
                  ordered = sorted(eligible_ages)
                  lines += [
                      "",
                      "## Pre-trade snapshot age",
                      "",
                      f"- Minimum hours: `{min(ordered):.2f}`",
                      f"- Median hours: `{ordered[len(ordered)//2]:.2f}`",
                      f"- Maximum hours: `{max(ordered):.2f}`",
                  ]

              lines += [
                  "",
                  "## Scope",
                  "",
                  "- Includes player-only and pick-involving completed trades.",
                  "- Uses Fundamental Value only for package geometry.",
                  "- Market Value is captured as a separate evidence lens.",
                  "- Team Utility is not treated as the package-premium target.",
                  "- No lambda is fit here; Package Preference Voting remains the primary V1 calibration source.",
                  "",
              ]
              REPORT_PATH.write_text("\n".join(lines), encoding="utf-8")


          def selftest():
              policy = {
                  "pick_base": {
                      1: {"early": 7500, "mid": 5854, "late": 5244},
                      6: {"early": 1000, "mid": 900, "late": 800},
                  },
                  "year_discount": {"2027": 1.0, "2028": 0.85},
                  "unknown_year_discount": 0.6,
              }
              assert pick_value(1, "2027", "mid", policy) == 5854
              assert pick_value(1, "2028", "mid", policy) == round(5854 * 0.85)
              assert pick_value(9, "2027", "mid", policy) == 900

              slot = {
                  "applies_to_season": "2027",
                  "tiers": {"4": "early"},
              }
              assert pick_tier(
                  {"season": "2027", "roster_id": 4}, slot
              ) == ("early", "captured_slot_projection")
              assert pick_tier(
                  {"season": "2028", "roster_id": 4}, slot
              ) == ("mid", "future_pick_default_mid")

              g = geometry([4000, 2500, 1500], [8000])
              assert g["fragmentation"] > 0
              assert g["best_asset_gap"] > 0
              assert g["fg"] > 0

              fake = [
                  (1000, Path("a"), {}),
                  (2000, Path("b"), {}),
                  (3000, Path("c"), {}),
              ]
              assert latest_pretrade_snapshot(2000, fake)[0] == 1000
              assert latest_pretrade_snapshot(1000, fake) is None

              print("Prospective trade evidence self-test passed.")


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--selftest", action="store_true")
              parser.add_argument("--write", action="store_true")
              args = parser.parse_args()

              if args.selftest:
                  selftest()
                  return

              payload = snapshot_payload()

              if not args.write:
                  print(json.dumps(payload, indent=2, sort_keys=True))
                  return

              SNAPSHOT_DIR.mkdir(parents=True, exist_ok=True)
              snapshot_path = write_snapshot(payload)
              evidence = build_evidence(snapshot_path)
              EVIDENCE_PATH.write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              write_report(evidence)

              print(f"Wrote {snapshot_path.relative_to(ROOT)}")
              print(f"Wrote {EVIDENCE_PATH.relative_to(ROOT)}")
              print(f"Wrote {REPORT_PATH.relative_to(ROOT)}")


          if __name__ == "__main__":
              main()
          PY

          chmod +x scripts/validation/capture_prospective_trade_evidence.py

      - name: Run self-test
        shell: bash
        run: python3 scripts/validation/capture_prospective_trade_evidence.py --selftest

      - name: Capture initial pre-trade baseline
        shell: bash
        run: python3 scripts/validation/capture_prospective_trade_evidence.py --write

      - name: Verify research-only anti-hindsight contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path(
                  "research/package-adjustment-v1/prospective/trade_evidence.json"
              ).read_text()
          )

          assert evidence["status"] == "research_only_prospective_trade_evidence"
          assert evidence["consumer_changed"] is False

          method = evidence["methodology"]
          assert method["player_only_trades_included"] is True
          assert method["requires_snapshot_strictly_before_trade"] is True
          assert method["post_trade_values_never_substituted"] is True
          assert method["future_pick_default_tier_without_signal"] == "mid"

          snapshots = sorted(
              Path(
                  "research/package-adjustment-v1/prospective/snapshots"
              ).glob("*_trade-evidence.json")
          )
          assert snapshots

          first_snapshot = json.loads(snapshots[0].read_text())
          first_ms = first_snapshot["captured_epoch_ms"]

          # Pre-existing transactions must not become prospectively eligible
          # from the first post-hoc snapshot.
          for trade in evidence["trades"].values():
              if trade["created_epoch_ms"] < first_ms:
                  assert not trade["eligible_for_numeric_package_research"]

          v0 = json.loads(
              Path(
                  "research/package-adjustment-v0/package_adjustment_v0.json"
              ).read_text()
          )
          assert v0["production_formula_enabled"] is False

          print("Prospective anti-hindsight contract verified.")
          PY

      - name: Run repo regression checks
        shell: bash
        run: |
          pip install requests
          python3 scripts/validation/repo_regression_checks.py

      - name: Remove one-time installer
        shell: bash
        run: rm -f .github/workflows/install-prospective-trade-evidence.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "trade-desk-research-bot"
          git config user.email "actions@users.noreply.github.com"

          git add scripts/validation/capture_prospective_trade_evidence.py
          git add research/package-adjustment-v1/prospective/
          git add -u .github/workflows/install-prospective-trade-evidence.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add prospective package trade evidence capture"
          git push origin main
