name: A-FA29R1 - Week-Aware Private IDP Rankings (Preview / Apply)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run preview before apply
        type: choice
        required: true
        default: preview
        options: [preview, apply]
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  weekly-rankings:
    name: Private Week 10 and Week 11 ranking storage (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Stage week-specific private rankings cache fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/fa_start_sit_v1.js)" = '59ff73cc0626a09d28e1466cf42127672b71c368' || { echo 'Source changed; review before patching'; exit 1; }
          test "$(git hash-object free-agent-board.html)" = '93e80ead0a7c6ab7ace6f845eb7dfbbec8b2a7f0' || { echo 'Board changed; review before patching'; exit 1; }
          cat > /tmp/fa29_patch.py <<'PYCODE'
          from pathlib import Path
          import subprocess

          p=Path('assets/fa_start_sit_v1.js')
          htmlp=Path('free-agent-board.html')
          s=p.read_text('utf-8'); html=htmlp.read_text('utf-8')

          def one(old,new,label):
              global s
              n=s.count(old)
              assert n==1,f'{label} anchor expected once, got {n}'
              s=s.replace(old,new,1)

          # The same Week 10 cache key is preserved, so no migration or deletion is needed.
          one("const KEY='2026-W10-two-expert';", "const KEY=week=>`2026-W${week}-two-expert`;\n  let selectedWeek=11;",'Week-key function')
          one("const ui={file:$('faSsFile'),status:", "const ui={week:$('faSsWeek'),file:$('faSsFile'),status:",'Week dropdown wiring')
          one('    <section id="faSsApp" class="fa-ss" aria-label="Week 10 start sit comparison">', '    <section id="faSsApp" class="fa-ss" aria-label="Weekly start sit ranking comparison">','Start/Sit section heading')
          one('Loading LOG players and checking for your privately saved Week 10 rankings…', 'Loading LOG players and checking for privately saved rankings…','Loaded status')
          selector='''<label>Analysis week <select id="faSsWeek" aria-label="Weekly expert ranking snapshot">'''+''.join(f'<option value="{w}"'+(' selected' if w==11 else '')+f'>Week {w}</option>' for w in range(10,19))+'''</select></label>'''
          one('      <div class="fa-ss-import">', '      <div class="fa-ss-import">\n        '+selector,'Week selector insertion')
          one('t.objectStore(STORE).get(KEY)', 't.objectStore(STORE).get(KEY(selectedWeek))','Read selected-week data')
          one('t.objectStore(STORE).put(data,KEY)', 't.objectStore(STORE).put(data,KEY(data.week))','Write matching-week data')
          one('t.objectStore(STORE).delete(KEY)', 't.objectStore(STORE).delete(KEY(selectedWeek))','Delete selected-week data')
          one('    ranks=candidate;rankNames=new Map();', '    selectedWeek=doc.week;ui.week.value=String(doc.week);ranks=candidate;rankNames=new Map();','Set active week after validated import')
          one('private consensus ${from}', 'private expert rankings ${from}','One-source status truthfulness')
          one('ui.status.textContent=`Activate your private Week 10 consensus once using the personal activation page; it will load automatically on subsequent visits on this device. You can also use the optional JSON fallback.`;',
            'ui.status.textContent=`No Week ${selectedWeek} rankings installed on this device. Import the private weekly JSON file below. Previously saved weeks stay available through the selector.`;', 'No-snapshot status')
          one(":'No Week 10 rank in supplied screenshots';", ":`No Week ${selectedWeek} rank in private rankings`;",'No-rank text')
          one("if(!window.confirm('Remove privately cached Week 10 rankings from this browser?'))return;", "if(!window.confirm(`Remove privately cached Week ${selectedWeek} rankings from this browser? Other weeks stay saved.`))return;",'Forget only selected week')
          one('  ui.search.addEventListener(\'input\',showMatches);', '''  ui.week.addEventListener('change',async()=>{
              const w=Number(ui.week.value);
              if(!Number.isInteger(w)||w<10||w>18)return;
              selectedWeek=w; ranks.clear();rankNames.clear();capturedWeek=null;sourceMeta=null;loaded=false; selected=[];
              ui.forget.hidden=true;ui.results.replaceChildren();ui.status.classList.remove('fa-ss-error');
              try{
                const saved=await privateGet();
                if(saved){fail(saved.week===w,'Saved week does not match selection');acceptRanks(saved,'restored for selected week');}
                else ui.status.textContent=`No Week ${w} rankings installed. Import that week's private JSON file below; other weeks remain saved.`;
              }catch(e){ui.status.classList.add('fa-ss-error');ui.status.textContent=`Could not read Week ${w} rankings: `+String(e.message||e);}
              refresh();
            });
            ui.search.addEventListener('input',showMatches);''','Week dropdown change handler')
          # Do not alter ranking algorithms, valuations, privacy protocols or any CSV / JSON files.
          p.write_text(s,'utf-8')
          html_key='<!-- FA_START_SIT_V1_SCRIPT --><script src="assets/fa_start_sit_v1.js?v=2" defer></script>'
          assert html.count(html_key)==1,'Cached JS script marker drift'
          html=html.replace(html_key,html_key.replace('?v=2','?v=3'),1)
          htmlp.write_text(html,'utf-8')
          print('FA29 staged weekly-safe importer. Legacy W10 key preserved; each week saved under matching W10–18 key.')
          PYCODE
          python3 /tmp/fa29_patch.py
      - name: Validate JavaScript, privacy, and minimal write set
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/fa_start_sit_v1.js
          python3 -m py_compile /tmp/fa29_patch.py
          python3 - <<'PYCODE'
          from pathlib import Path
          s=Path('assets/fa_start_sit_v1.js').read_text()
          h=Path('free-agent-board.html').read_text()
          assert 'const KEY=week=>`2026-W${week}-two-expert`' in s
          assert 'selectedWeek=11' in s and 'id="faSsWeek"' in s
          assert 'get(KEY(selectedWeek))' in s and 'put(data,KEY(data.week))' in s and 'delete(KEY(selectedWeek))' in s
          assert h.count('assets/fa_start_sit_v1.js?v=3')==1
          assert 'PRIVATE_OWNER_SUPPLIED_WEEKLY_IDP_START_SIT_NOT_FOR_PUBLIC_REPO' in s
          assert 'WEEKLY_ONLY_NOT_ROS' in s
          assert '2026-W10-two-expert' not in s, 'Old literal key should be represented only by dynamic W10 key'
          assert not any(secret in s for secret in ['Blake Cashman','Budda Baker','TJ Watt'])
          print('FA29 privacy and week-key safeguards PASS')
          PYCODE
          git add -N -- assets/fa_start_sit_v1.js free-agent-board.html
          git diff --name-only > /tmp/fa29_changed.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          paths=set(Path('/tmp/fa29_changed.txt').read_text().splitlines())
          expected={'assets/fa_start_sit_v1.js','free-agent-board.html'}
          assert paths==expected, 'Unexpected write set: '+repr(paths)
          assert not any(p.endswith(('.json','.csv')) for p in paths)
          print('FA29 only two generic browser source files; no subscription imports')
          PYCODE
      - name: Set up synthetic Chromium browser tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test Week 10 preservation and Week 11 import using synthetic data
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fa29_qa.py <<'PYCODE'
          """FA29 synthetic-only privacy and multiweek Start/Sit browser test. No subscriber records."""
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from functools import partial
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright
          import json

          root=Path.cwd()
          fixture='<!doctype html><html><head><meta charset="utf-8"></head><body><div id="fa-ws-startsit-panel"></div><script src="/assets/fa_start_sit_v1.js"></script></body></html>'
          league='synthetic-fa29-test'
          rosters=[{'roster_id':i,'owner_id':f'owner-{i}','starters':[],'bench':[],'taxi':[],'reserve_ir':[]} for i in range(1,13)]
          rosters[0]['starters']=[{'player_id':'1001','name':'Synthetic Tackle One','team':'AAA','pos':'LB','raw_position':'LB'}]
          rosters[0]['bench']=[{'player_id':'1002','name':'Synthetic Tackle Two','team':'BBB','pos':'LB','raw_position':'LB'}]
          frees=[{'player_id':str(2000+i),'name':f'Synthetic Available {i}','team':'CCC','pos':'LB','raw_position':'LB'} for i in range(260)]
          contents={
           'free_agents.json':{'league_id':league,'count':len(frees),'synced_at':1790000000,'free_agents':frees},
           'league_rosters.json':{'league_id':league,'rosters':rosters},
           'my_roster.json':{'league_id':league,**rosters[0]},
           'config.json':{'league_id':league},
          }

          def doc(week,base):
           return {'schema_version':1,'classification':'PRIVATE_OWNER_SUPPLIED_WEEKLY_IDP_START_SIT_NOT_FOR_PUBLIC_REPO',
               'season':2026,'week':week,'source_scope':'WEEKLY_ONLY_NOT_ROS',
               'source_coverage':{'label':'synthetic FA29 QA only'},'records':[
                 {'name':'Synthetic Tackle One','group':'LB','rankings':{'idp_show':None,'woellert':base},'projection':None},
                 {'name':'Synthetic Tackle Two','group':'LB','rankings':{'idp_show':None,'woellert':base+1},'projection':None}
               ]}

          class Handler(SimpleHTTPRequestHandler):
           def __init__(self,*args,**kwargs):super().__init__(*args,directory=str(root),**kwargs)
           def do_GET(self):
            if self.path=='/fa29-fixture.html':
             data=fixture.encode();self.send_response(200);self.send_header('Content-Type','text/html');self.send_header('Content-Length',str(len(data)));self.end_headers();self.wfile.write(data)
            else:super().do_GET()
           def log_message(self,*a):pass

          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          thread=Thread(target=server.serve_forever,daemon=True);thread.start()
          url=f'http://127.0.0.1:{server.server_port}/fa29-fixture.html'
          try:
           with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True)
            for width in (360,900):
             context=browser.new_context(viewport={'width':width,'height':900})
             page=context.new_page()
             errors=[]
             page.on('pageerror', lambda e: errors.append(str(e)))
             def route_api(route):
              src=route.request.url.split('?')[0]
              key=src.rsplit('/',1)[-1]
              if key not in contents:route.abort();return
              route.fulfill(status=200,content_type='application/json',body=json.dumps(contents[key]))
             page.route('https://raw.githubusercontent.com/**',route_api)
             page.goto(url)
             page.wait_for_selector('#faSsWeek')
             page.wait_for_function("document.querySelector('#faSsSuggestions')?.children.length>0")
             assert page.locator('#faSsWeek').input_value()=='11'
             page.locator('#faSsFile').set_input_files({'name':'week10-synthetic.json','mimeType':'application/json','buffer':json.dumps(doc(10,4)).encode()})
             page.wait_for_function("document.querySelector('#faSsStatus')?.textContent.includes('Week 10 private expert rankings')")
             assert page.locator('#faSsWeek').input_value()=='10'
             page.select_option('#faSsWeek','11')
             page.wait_for_function("document.querySelector('#faSsStatus')?.textContent.includes('No Week 11 rankings installed')")
             page.locator('#faSsFile').set_input_files({'name':'week11-synthetic.json','mimeType':'application/json','buffer':json.dumps(doc(11,12)).encode()})
             page.wait_for_function("document.querySelector('#faSsStatus')?.textContent.includes('Week 11 private expert rankings')")
             assert page.locator('#faSsWeek').input_value()=='11'
             page.select_option('#faSsWeek','10')
             page.wait_for_function("document.querySelector('#faSsStatus')?.textContent.includes('Week 10 private expert rankings')")
             page.select_option('#faSsWeek','11')
             page.wait_for_function("document.querySelector('#faSsStatus')?.textContent.includes('Week 11 private expert rankings')")
             db_keys=page.evaluate("""async()=>{
              const db=await new Promise((resolve,reject)=>{const q=indexedDB.open('LOG_Private_StartSit_Weekly_2026_v1');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
              const keys=await new Promise((resolve,reject)=>{const tx=db.transaction('snapshots','readonly');const q=tx.objectStore('snapshots').getAllKeys();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});db.close();return keys;
             }""")
             assert '2026-W10-two-expert' in db_keys and '2026-W11-two-expert' in db_keys,db_keys
             assert not errors,errors
             print('FA29 browser PASS',width,'multiweek non-overwrite, restore, private indexedDB',db_keys)
             context.close()
            browser.close()
          finally:server.shutdown();server.server_close()
          PYCODE
          python /tmp/fa29_qa.py
      - name: Preview successful - no writes
        if: ${{ inputs.mode == 'preview' }}
        run: echo 'FA29 preview passed. Live data untouched; Woellert CSV/JSON remain private.'
      - name: Apply verified week-specific private cache and importer
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/fa_start_sit_v1.js free-agent-board.html
          if git diff --cached --quiet; then
            echo 'FA29 already applied.'
          else
            git commit -m 'FA29: preserve independent Week 10–18 owner-local IDP expert rank snapshots'
            git push origin HEAD:main
          fi
          echo 'Only generic browser code deployed. No licensed data committed.'
