      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tempfile

          for filename in ("index.html", "free-agent-board.html"):
              text = pathlib.Path(filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, re.S | re.I)
              js = "\n".join(scripts)
              fd, path = tempfile.mkstemp(suffix=".js")
              os.close(fd)
              try:
                  pathlib.Path(path).write_text(js, encoding="utf-8")
                  subprocess.run(["node", "--check", path], check=True)
              finally:
                  pathlib.Path(path).unlink(missing_ok=True)
              print(f"PASS {filename} inline JavaScript syntax")
          PY

      - name: Verify protected files are byte-identical
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          before = json.loads(
              Path("/tmp/v5_shadow_protected.json").read_text(encoding="utf-8")
          )

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          changed = []
          for path, expected in before.items():
              p = Path(path)
              if not p.exists():
                  changed.append((path, expected, "MISSING"))
                  continue
              actual = sha(path)
              if actual != expected:
                  changed.append((path, expected, actual))

          if changed:
              raise RuntimeError(f"Protected files changed during shadow hardening: {changed}")

          print("All protected production/evidence files remain byte-identical.")
          PY

      - name: Guard repository change set
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              "scripts/validation/package_adjustment_v5_shadow_regression.py",
              "research/package-adjustment-v5/shadow_regression_hardening.json",
              "research/package-adjustment-v5/shadow_regression_hardening.md",
          }

          out = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          )
          paths = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)

          unexpected = sorted(paths - allowed)
          if unexpected:
              raise RuntimeError(
                  f"Unexpected files changed by V5 shadow hardening: {unexpected}"
              )

          missing = sorted(p for p in allowed if not Path(p).exists())
          if missing:
              raise RuntimeError(f"Expected shadow hardening outputs missing: {missing}")

          print("V5 shadow-hardening change set verified.")
          print("Changed files:", sorted(paths))
          PY

