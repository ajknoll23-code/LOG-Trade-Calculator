# QF11 V4 — Analyze exact archived V3 prospective Market cohort, not a new live sheet pull.
# Strict read-only research; never patch old published market or invent eligibility thresholds.
name: QF11 V4 - Archived Market Vote Evidence Reliability Audit (Read Only)
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  research:
    name: Read archived source-aligned cohort, measure evidence concentration and frozen publication boundary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout dispatched main without write credentials
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install unchanged repository HTTP regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin QF11 V3 science and QF10 protected model lineage
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP: non-main dispatch''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP: checkout changed''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP: repository dirty''; exit 1; }

        git merge-base --is-ancestor f31f267c6b766aeb3679b255355d8d681d963058 HEAD || { echo ''STOP: QF11 V3 lineage
        missing''; exit 1; }

        git merge-base --is-ancestor 590afe6046aabe3937a4c360c9c1e93a9cf1e08d HEAD || { echo ''STOP: uncertainty
        production deployment missing''; exit 1; }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP: protected source changed: $1"; exit 1; };
        }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/market/ktc_pipeline.py b9612c73a91223397a4f49b384d8d86719ee8d79

        pin scripts/validation/evaluate_market_history.py 121fc506d5a5b3c949a1a3951cd92b3bcbb23a58

        pin scripts/validation/snapshot_values.py 1efca4c35e910a95974c1bec0b06a106196618b3

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        echo ''QF11_V4_PINNED_MODEL_GREEN: immutable market/valuation sources and V3 lineage confirmed''

        '
    - name: Download exact QF11 V3 research artifact; no live ballots queried
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        path: /tmp/qf11-v4-input
    - name: Independently validate archived V3 source-aligned cohort and diagnose evidence concentration
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/qf11-v4-audit.py <<'QF11_V4_PY'\n#!/usr/bin/env python3\n\"\"\"QF11 V4:\
        \ frozen-derived single-cohort evidence reliability audit.\nNo vote-source network calls. No price changes,\
        \ model policy, or voter IDs.\n\"\"\"\nfrom __future__ import annotations\nimport hashlib\nimport json\n\
        import math\nimport sys\nfrom collections import Counter, defaultdict\nfrom pathlib import Path\n\nroot=Path.cwd()\n\
        folder=Path('/tmp/qf11-v4-input')\nexpected={\n 'PROSPECTIVE_NOT_FOR_PUBLICATION_README.md':'302e915371603756c7bee9d7f86616b33e1b445b26af761abb6d5d3ea87c9c07',\n\
        \ 'PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json':'19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc',\n\
        \ 'PROSPECTIVE_NOT_FOR_PUBLICATION_summary.json':'dd4a06f08a679145469fbb92c5e663d6bd80ab764575eb0fd9e1a0cb2412e0aa'\n\
        }\nassert folder.is_dir(),'STOP V3 artifact missing'\nassert {x.name for x in folder.iterdir()} == set(expected),'STOP\
        \ V3 artifact file manifest mismatch'\nfor name,want in expected.items():\n    data=(folder/name).read_bytes()\n\
        \    assert hashlib.sha256(data).hexdigest()==want, f'STOP archived V3 byte drift: {name}'\n    assert 0<len(data)<30_000_000,'STOP\
        \ implausible artifact size'\nraw=(folder/'PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json').read_text()\n\
        assert all(term not in raw for term in ('voter_roster_id','ballot_weight','sheet_url','raw_ballots')), 'STOP\
        \ potential privacy leak'\ncohort=json.loads(raw)\nsummary=json.loads((folder/'PROSPECTIVE_NOT_FOR_PUBLICATION_summary.json').read_text())\n\
        published=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())\nsys.path.insert(0,str(root/'scripts/validation'))\n\
        import snapshot_values\ncurrent=snapshot_values.compute_all_values(snapshot_values.load_from_html(root/'index.html'))\n\
        assert len(current)==565\nassert cohort['research_only'] is True and cohort['deployment_authorized'] is\
        \ False\nassert summary['reprice_or_deploy_authorized'] is False\nassert summary['same_position_enough_data_approved']\
        \ is False\nassert summary['published_snapshot_matched'] is False\nassert summary['status']=='RESEARCH_ONLY_SOURCE_ALIGNED_CANDIDATE'\n\
        assert cohort['published_reference']['source_not_equivalent'] is True\nassert cohort['source']['mode']=='one_live_sheet_fetch'\n\
        assert cohort['source']['source_after_daily_cap_sha256']==summary['source_after_daily_cap_sha256']=='a0ed9f867883d9013cbee69a0136586a22223571f5f57d4f0627d5d77fd6d2b2'\n\
        assert cohort['source']['eligible_rows']==summary['eligible_rows']==972\nassert cohort['source']['raw_sheet_rows']==summary['raw_sheet_rows']==11919\n\
        assert cohort['source']['distinct_voters']==35\nassert summary['voter_privacy'].startswith('No voter IDs')\n\
        assert cohort['policy_sha256']==published['policy_sha256']\nassert cohort['method_version']==published['method_version']\n\
        assert cohort['scale_semantics']==published['scale_semantics']\nassert set(cohort['players'])==set(published['players'])\
        \ and len(cohort['players'])==504\nassert summary['covered_players']==504\nassert summary['pairs']=={'cross':2326,'same':451,'unresolved_or_duplicate':139}\n\
        assert summary['counts']=={'zero':146,'1-2':216,'3-9':141,'10+':1}\nassert sum(summary['pairs'].values())==972*3\n\
        counts=Counter();by_position=defaultdict(Counter)\nquality=Counter();risk=[];abs_deltas=[]\nfor key,row\
        \ in cohort['players'].items():\n    e=row['evidence'];old=published['players'][key]\n    assert row['fundamental_value']==old['fundamental_value']==current[key]['value'],\
        \ f'STOP model center {key}'\n    assert row['pos']==old['pos']==current[key]['pos'],f'STOP model position\
        \ {key}'\n    assert e['same_position_enough_data'] is None, f'STOP unapproved eligibility decision {key}'\n\
        \    assert e['same_position_pairwise_observations']>=0 and e['cross_position_pairwise_observations']>=0\n\
        \    assert e['direct_ballots']>=0 and 0<=e['direct_distinct_voters']<=e['direct_ballots']\n    assert e['same_position_distinct_voters']<=e['direct_distinct_voters']\n\
        \    for fld in ('same_position_effective_pairwise_weight','cross_position_effective_pairwise_weight'):\n\
        \        assert math.isfinite(e[fld]) and e[fld]>=0\n    assert (e['same_position_pairwise_observations']==0)==(e['same_position_dominant_voter_share_pct']\
        \ is None)\n    assert e['same_position_pairwise_observations']==0 or e['same_position_distinct_voters']>=1\n\
        \    for fld in ('same_position_dominant_voter_share_pct','all_pairwise_dominant_voter_share_pct'):\n  \
        \      value=e[fld]\n        assert value is None or (isinstance(value,(int,float)) and 0<=value<=100)\n\
        \    assert e['evidence_status']==('NO_SAME_POSITION_PAIRS' if e['same_position_pairwise_observations']==0\
        \ else 'OBSERVED_NO_POLICY_CUTOFF')\n    same=e['same_position_pairwise_observations'];cross=e['cross_position_pairwise_observations']\n\
        \    bucket='zero' if same==0 else ('1-2' if same<3 else ('3-9' if same<10 else '10+'))\n    counts[bucket]+=1;by_position[row['pos']]['players']+=1;by_position[row['pos']][bucket]+=1\n\
        \    if same==0 and cross>0:by_position[row['pos']]['cross_only']+=1\n    if same>0 and e['same_position_dominant_voter_share_pct']>=50:by_position[row['pos']]['same_voter_share_ge_50']+=1\n\
        \    if same==0 and cross>0:quality['cross_only']+=1\n    if same==0 and cross==0:quality['no_resolved_pairwise']+=1\n\
        \    if same>0 and e['same_position_distinct_voters']==1:quality['same_position_one_voter']+=1\n    if same>0\
        \ and e['same_position_dominant_voter_share_pct']>=50:quality['same_position_majority_single_voter']+=1\n\
        \    if e['all_pairwise_dominant_voter_share_pct'] is not None and e['all_pairwise_dominant_voter_share_pct']>=50:quality['all_pairwise_majority_single_voter']+=1\n\
        \    if same+cross>0:quality['any_pairwise']+=1\n    delta=round(row['market_value']-old['market_value'])\n\
        \    abs_deltas.append(abs(delta))\n    if abs(delta)>=100: risk.append({'player':key,'pos':row['pos'],'marketChange':delta,'currentMarket':row['market_value'],'publishedMarket':old['market_value'],'samePairs':same,'crossPairs':cross,'sameVoters':e['same_position_distinct_voters'],'directVoters':e['direct_distinct_voters'],'sameDominantPct':e['same_position_dominant_voter_share_pct'],'allDominantPct':e['all_pairwise_dominant_voter_share_pct']})\n\
        assert dict(counts)==summary['counts'],'STOP aggregate counts differ'\nassert {k:dict(v) for k,v in by_position.items()}==summary['by_position'],'STOP\
        \ position counts differ'\nassert sum(x>0 for x in abs_deltas)==summary['market_drift_any']==131,'STOP published\
        \ candidate drift count mismatch'\nassert max(abs_deltas)==summary['market_drift_max_abs']==1413,'STOP candidate\
        \ churn mismatch'\nassert sorted(int(x['market_value']) for x in cohort['players'].values())==sorted(int(x['fundamental_value'])\
        \ for x in cohort['players'].values()),'STOP quantile distribution mismatch'\nassert sum(e['same_position_pairwise_observations']\
        \ for e in (x['evidence'] for x in cohort['players'].values()))<=2*summary['pairs']['same']\nassert sum(e['cross_position_pairwise_observations']\
        \ for e in (x['evidence'] for x in cohort['players'].values()))<=2*summary['pairs']['cross']\nassert cohort['players']['will\
        \ anderson']['evidence']['same_position_pairwise_observations']==1\nassert cohort['players']['will anderson']['evidence']['cross_position_pairwise_observations']==11\n\
        assert cohort['players']['will anderson']['evidence']['direct_ballots']==6\n\nordered=sorted(cohort['players'].items(),key=lambda\
        \ v:(-v[1]['market_value'],v[0]))\ncohorts={}\nfor n in (10,25,50,100,504):\n    selection=[x[1]['evidence']\
        \ for x in ordered[:n]]\n    cohorts['top'+str(n)]={\n      'players':n,\n      'zero_same_position':sum(e['same_position_pairwise_observations']==0\
        \ for e in selection),\n      'same_position_one_voter':sum(e['same_position_pairwise_observations']>0 and\
        \ e['same_position_distinct_voters']==1 for e in selection),\n      'all_pairwise_dominant_ge_50pct':sum((e['all_pairwise_dominant_voter_share_pct']\
        \ or 0)>=50 for e in selection),\n      'no_resolved_pairs':sum(e['same_position_pairwise_observations']+e['cross_position_pairwise_observations']==0\
        \ for e in selection),\n      'median_same_pairs':sorted(e['same_position_pairwise_observations'] for e\
        \ in selection)[len(selection)//2],\n      'median_cross_pairs':sorted(e['cross_position_pairwise_observations']\
        \ for e in selection)[len(selection)//2],\n    }\n\nrisk.sort(key=lambda x:(-abs(x['marketChange']),x['player']))\n\
        report={\n 'status':'READ_ONLY_ARCHIVED_COHORT_INTEGRITY_AND_RELIABILITY_COMPLETE',\n 'publication_decision':'HOLD_NO_SOURCE_MATCHED_PUBLISHED_MARKET_AND_NO_VALIDATED_ENOUGH_DATA_RULE',\n\
        \ 'input_run_id':38204817099,\n 'source_after_daily_cap_sha256':summary['source_after_daily_cap_sha256'],\n\
        \ 'archived_candidate_sha256':expected['PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json'],\n\
        \ 'players':len(cohort['players']),\n 'direct_same_position_observation_counts':dict(counts),\n 'pair_counts':summary['pairs'],\n\
        \ 'descriptive_all_player_evidence':dict(quality),\n 'prospective_market_rank_cohorts':cohorts,\n 'largest_candidate_vs_published_changes':risk[:15],\n\
        \ 'market_values_changed':sum(d>0 for d in abs_deltas),\n 'max_abs_market_change':max(abs_deltas),\n 'missing_approved_sufficiency_rule':True,\n\
        \ 'not_same_published_snapshot':True,\n 'no_raw_ballots_or_voter_ids':True,\n 'no_fv_market_package_team_utility_policy_changes':True,\n\
        }\nout=Path('/tmp/qf11-v4-output');out.mkdir(parents=True,exist_ok=True)\n(out/'RESEARCH_ONLY_vote_reliability_audit.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\\\
        n')\nlines=['# QF11 V4 \u2014 Archived Market vote reliability audit','',\n'**RESEARCH ONLY. NOT A PRODUCTION\
        \ OR MARKET VALUE PROMOTION AUTHORIZATION.**','',\n'Input: QF11 V3 artifact from workflow run 38204817099.\
        \ Same counted ballot cohort and candidate; no new voting-sheet request.','',\n'## What was validated','',\n\
        '- Candidate players: **504**','- Counted KTC-style Keep/Trade/Cut ballots: **972**',\n'- Same-position\
        \ resolved pairs: **451**; cross-position resolved pairs: **2,326**',\n'- Source and per-player evidence\
        \ hashes verified against QF11 V3 run.',\n'- All Fundamental Value centers unchanged; prospective Market\
        \ Values differ from published for 131 players.',\n'','## Evidence caveats','',\n'- Same-position and cross-position\
        \ comparisons are different evidence and must never be conflated.',\n'- Votes and weights measure sample\
        \ exposure, not automatic reliability or calibrated confidence.',\n'- Current source-aligned prospective\
        \ ballot cohort is NOT the saved published Market Value cohort.',\n'- No evidence sufficiency threshold\
        \ or player eligibility decision was selected.',\n'- No individual voter identifiers, ballots or personal\
        \ data are included.',\n'','## Descriptive results','']\nfor k,v in cohorts.items():lines.append(f'- {k}:\
        \ {v}')\nlines+=['','## Largest Market candidate differences (NOT approved)','']\nfor r in risk[:10]:lines.append(f'-\
        \ {r[\"player\"]} ({r[\"pos\"]}): {r[\"marketChange\"]:+d} vs published; {r[\"samePairs\"]} same-position\
        \ and {r[\"crossPairs\"]} cross-position observations')\n(out/'RESEARCH_ONLY_vote_reliability_audit.md').write_text('\\\
        n'.join(lines)+'\\n')\nfor p in out.iterdir():\n    t=p.read_text()\n    assert all(x not in t for x in\
        \ ('voter_roster_id','ballot_weight','sheet_url','raw_ballots')),'STOP privacy exposure'\nprint('QF11_V4_ARCHIVED_COHORT_INTEGRITY_GREEN\
        \ '+json.dumps({'source_hash_verified':True,'covered_players':len(cohort['players']),'same_pairs':summary['pairs']['same'],'cross_pairs':summary['pairs']['cross'],'fundamental_value_drift':0,'market_promotion_authorized':False},sort_keys=True))\n\
        print('QF11_V4_DESCRIPTIVE_EVIDENCE '+json.dumps({'quality':dict(quality),'market_rank_cohorts':cohorts,'top_market_movers':risk[:10]},sort_keys=True))\n\
        print('QF11_V4_POLICY_HOLD publication_authorized=False same_position_enough_data_threshold=None historical_published_snapshot_mismatch=True')\n\
        QF11_V4_PY\npython3 -m py_compile /tmp/qf11-v4-audit.py\npython3 /tmp/qf11-v4-audit.py\n"
    - name: Run all 14 frozen repository regressions and free agent/package parity
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''QF11_V4_14_REGRESSION_GROUPS_GREEN: frozen FV, market, PA, IDP, FA and Team Utility preserved''

        '
    - name: Prove read-only output and exact original production hashes
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo ''STOP repo changed''; exit 1; }

        [[ "$(git hash-object index.html)" == c83e3f68d11853c072017e6bd83bb1ad085f4a3e ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == 829445174a77ceb4bb19dfd97a725e371d18efe8
        ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == 9d007a7f053e15dcdc0f694563ca17bc47568e5f
        ]] || exit 1

        echo ''QF11_V4_ZERO_WRITE_GREEN: research files only in /tmp, no pushes, model, artifacts or trade values
        changed''

        '
    - name: Archive aggregate research only (seven-day retention)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v4-RESEARCH-ONLY-market-reliability
        path: /tmp/qf11-v4-output/
        retention-days: 7
        if-no-files-found: error
