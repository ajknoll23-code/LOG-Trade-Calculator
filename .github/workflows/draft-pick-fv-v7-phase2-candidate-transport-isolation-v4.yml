        python3 scripts/validation/repo_regression_checks.py
        restore; trap - EXIT
        git diff --exit-code -- "$TU_JSON" "$TU_MD"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo "PASS: full repository regression suite after V4 amendment freeze."
    - name: Upload V4 candidate-isolation engine
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-candidate-isolation-engine
        path: ${{ runner.temp }}/engine/
