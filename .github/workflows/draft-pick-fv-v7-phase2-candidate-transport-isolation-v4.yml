# PREFLIGHTED: DRAFT_PICK_FV_V7_PHASE2_CANDIDATE_TRANSPORT_ISOLATION_V4
name: Draft Pick FV V7 - Phase 2 Candidate Transport Isolation V4
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: draft-pick-fv-v7-phase2-candidate-transport-isolation-v4
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      study_sha: ${{ steps.freeze.outputs.sha }}
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install transport and regression dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Guard frozen V7 lineage through V3
      shell: bash
      run: |
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        declare -A EXPECTED=(
          ["research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json"]="42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"
          ["research/draft-pick-fv-v7/r1_r6_phase2_source_implementation_contract_v7.json"]="80a28c10ca3fb416631ec7352a3dc6d466f5c66d"
          ["research/draft-pick-fv-v7/r1_r6_phase2_transport_recovery_v7.json"]="4da07647e4e6bc8e1e662cac76be366600d6f0d2"
          ["research/draft-pick-fv-v7/r1_r6_phase2_probe_repartition_recovery_v7.json"]="0b85dde3cc086bee0540aed6e1b15aee35349e5e"
          ["research/draft-pick-fv-v7/r1_r6_phase2_accelerated_probe_resume_v7.json"]="a51043e009c7d10c37f13ee02e11d63504480213"
          ["research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_v7.json"]="1d5e432316e257af0f201cd47aec99a7fb934655"
          ["research/draft-pick-fv-v7/r1_r6_phase2_targeted_recovery_manifest_v7.json"]="d6073beea76f9a2d979f59e7910742468faa37b2"
          ["research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.json"]="8a56e82127c5517f22aeee7c64b65b0f8b4ff999"
          ["research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_v7.md"]="5a421c39c948bf4b6d2df16936e0f732fb944527"
          ["research/draft-pick-fv-v7/r1_r6_phase2_residual_router_recovery_manifest_v7.json"]="4555c0b2a67e6df9dcdbd8db41293fd87d11cff0"
        )
        for p in "${!EXPECTED[@]}"; do
          actual="$(git hash-object "$p")"
          test "$actual" = "${EXPECTED[$p]}" || { echo "ERROR: protected V7 lineage drift: $p"; exit 1; }
        done
        for p in research/draft-pick-fv-v7/r1_r6_source_identity_summary_v7.json research/draft-pick-fv-v7/r1_r6_source_identity_manifest_v7.json research/draft-pick-fv-v7/r1_r6_development_pick_identity_v7.jsonl research/draft-pick-fv-v7/r1_r6_holdout_2024_pick_identity_v7.jsonl; do
          test ! -e "$p" || { echo "ERROR: final Phase 2 output already exists: $p"; exit 1; }
        done
        echo "PASS: protected V7 lineage through V3 is unchanged."
    - name: Download exact V3 residual-router engine
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-engine
        path: ${{ runner.temp }}/engine
        repository: ${{ github.repository }}
        run-id: '36173274943'
        github-token: ${{ github.token }}
    - name: Download exact frozen discoveries from V3
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-residual-router-discoveries
        path: ${{ runner.temp }}/discoveries
        repository: ${{ github.repository }}
        run-id: '36173274943'
        github-token: ${{ github.token }}
    - name: Download V3 audit and transport diagnostics
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/v3-audit" "${RUNNER_TEMP}/v3-diag"
        gh run download 36173274943 --repo "$GITHUB_REPOSITORY" -n "v7-p2-residual-router-audit" -D "${RUNNER_TEMP}/v3-audit"
        gh run download 36173274943 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-residual-router-diag-*' -D "${RUNNER_TEMP}/v3-diag"
        test "$(find "${RUNNER_TEMP}/v3-diag" -name transport.jsonl | wc -l)" -eq 22
    - name: Verify exact V3 engine and frozen identity bundle
      shell: bash
      run: |
        set -euo pipefail
        sha(){ sha256sum "$1" | awk '{print $1}'; }
        test "$(sha "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py")" = "acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6"
        test "$(sha "${RUNNER_TEMP}/engine/db_playerids.csv")" = "0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
        test "$(sha "${RUNNER_TEMP}/engine/nflverse_players.csv")" = "4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
        test "$(sha "${RUNNER_TEMP}/engine/r1_r6_identity_asset_manifest_v7.json")" = "e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e"
        test "$(sha "${RUNNER_TEMP}/engine/identity_crosswalk.json")" = "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
        python3 -m py_compile "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py"
        echo "PASS: exact V3 engine and frozen identity bundle verified."
    - name: Reproduce V3 failures and build deterministic V4 amendment
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib,json,os,re
        from pathlib import Path
        from urllib.parse import urlparse,parse_qsl

        root=Path(os.environ['RUNNER_TEMP'])
        diagroot=root/'v3-diag'
        auditroot=root/'v3-audit'
        out=root/'amendment'
        out.mkdir(parents=True,exist_ok=True)

        expected_batches={2018:[0,3,5,13,24,31,33,35,36,39,41],2019:[0,15,24,25,29,37],2020:[12,34,39],2021:[28,34],2022:[],2023:[]}
        expected_known={
         (2018,0):('72532','draftResults',25,'redirect_loop','3b22c23eac89d81f051c62ed62c63cc2efa243b86f320b4a0f4fc6e58af03a96'),
         (2018,3):('12698','league',13,'non_json_http_200','623c09972b3e12569825c874481aad63de4f66b8ce43c6cf01a9f8ee2be0a612'),
         (2018,5):('45733','draftResults',25,'redirect_loop','e3a0e033dc762a6989fbc25e1439d5346138cabb914fcd32f37002d26622f9e4'),
         (2018,13):('24852','draftResults',19,'connect_timeout','1dd450b22bb81bb793fc3c6222a6f17ec802f77fd1381ea1299f9bbf74de248d'),
         (2018,24):('11669','draftResults',22,'connect_timeout','1ef147be11e0ebc439ecf28bddda3e82a163a34ef218ffbf7354f22deb3bd36b'),
         (2018,31):('37391','draftResults',20,'redirect_loop','a3bf251bf096a5c222db65e4d61170403d629458623a2f8aab28136888287788'),
         (2018,33):('37596','draftResults',21,'connect_timeout','cde1f07d1d3e2c4a2d5ac5d0a1d5c77dc12499f752b8014edd955b8e65b22506'),
         (2018,35):('71169','draftResults',15,'http_503','2fe5e84f9a13d4355c93b4a62f36b9e7f4579080a27c57526233c1956e911d77'),
         (2018,36):('17617','draftResults',19,'connect_timeout','185da95028bcea812726782e78c8d0f8cdbba70039d2bd7a5e0ac14264849ff6'),
         (2018,39):('20378','draftResults',22,'redirect_loop','9f94b1e24c0ed7a5d7a752c44a5f2b3d9d50b97a56294a61de8cb88845b1d7f2'),
         (2018,41):('23944','draftResults',2,'connect_timeout','38e0ad8d95c9b259fd08f31933c2cb73e5de41d554179a6fa44efcbe38deea32'),
         (2019,0):('16927','draftResults',4,'connect_timeout','1ebcba8fa44417eb18ecf9a9918b265761a5580435f88deab378e55903fae2ee'),
         (2019,15):('11753','draftResults',8,'dns_resolution_failure','140044f5da0c6e9856ec00912de81dab6d8035d4bebfb5f7d15ab55298e41acf'),
         (2019,24):('35517','draftResults',18,'redirect_loop','5e83a0a45e4838bb615cfdf3643040f367c547074e7f0241366b878e804f6d0f'),
         (2019,25):('61305','draftResults',12,'dns_resolution_failure','d07d95e41d0718cc4695ef3b53db6ef4c8f32d6d65657c2e86a3f613cd7974a2'),
         (2019,29):('53181','draftResults',2,'dns_resolution_failure','772f81c1d284856a15835e9c54a2cad7abe4a26676d77b9d797509d5bbc92bc6'),
         (2019,37):('40988','draftResults',3,'dns_resolution_failure','15ba5a9f762aded919da532c8c5640d733bbeeaf7222a8dbb6c2e444f498f383'),
         (2020,12):('64262','draftResults',14,'connect_timeout','8e5ed576eb40daf4bb5a999f16babd434a0605ac5734f95d1f16d99edad6936c'),
         (2020,34):('52755','draftResults',4,'dns_resolution_failure','5eafc003cae11e5f81469c7502fcac5ed34ce5c82f5930e7b94f55bf33fe5ae6'),
         (2020,39):('71967','draftResults',3,'connect_timeout','3534f10d9e6949362ab1987ce8cab6e99817839e0c1570ab1a58449e9dcc091f'),
         (2021,28):('20874','draftResults',16,'redirect_loop','6883f2d574c667bc45accfe70eac3c7d07525aac9ea29746592a00d5e5770f5f'),
         (2021,34):('64709','draftResults',23,'dns_resolution_failure','2185a86de1b70c697b2a74509e0f4d831b743bc025b140312b2064baad3cbc80'),
        }
        assert len(expected_known)==22

        audits=list(auditroot.rglob('residual_router_recovery_audit.json'))
        assert len(audits)==1,audits
        audit=json.loads(audits[0].read_text())
        assert audit['expected_residual_batch_n']==22
        assert audit['recovered_valid_artifact_n']==0
        assert audit['missing_residual_batch_n']==22
        assert audit['complete'] is False
        assert audit['missing_batches_by_year']=={str(y):expected_batches[y] for y in sorted(expected_batches)}

        # Derive and verify the terminal request in every V3 diagnostic artifact.
        def logical(u):
            if not u: return None
            q=dict(parse_qsl(urlparse(u).query,keep_blank_values=True))
            if q.get('L') and q.get('TYPE'): return q['TYPE'],q['L']
            return None

        def classify(rows,typ,lid):
            rr=[]
            for r in rows:
                if any(logical(u)==(typ,lid) for u in (r.get('url'),r.get('next')) if u): rr.append(r)
            ev=[r.get('event') for r in rr]
            errs=' | '.join(r.get('error','') for r in rr if r.get('error'))
            if 'json_decode_error' in ev: return 'non_json_http_200'
            if 'http_5xx' in ev:
                codes=sorted({int(r['status_code']) for r in rr if r.get('event')=='http_5xx'})
                return 'http_'+str(codes[-1]) if len(codes)==1 else 'http_5xx'
            if 'NameResolutionError' in errs: return 'dns_resolution_failure'
            if 'ConnectTimeout' in errs: return 'connect_timeout'
            if 'SSLError' in errs: return 'tls_ssl_failure'
            if set(ev)<= {'redirect_discovered'}: return 'redirect_loop'
            raise AssertionError((typ,lid,ev,errs[-400:]))

        found=[]
        for d in sorted(diagroot.glob('v7-p2-residual-router-diag-*')):
            m=re.fullmatch(r'v7-p2-residual-router-diag-(20\d\d)-(\d+)',d.name)
            assert m,d
            y,b=int(m.group(1)),int(m.group(2))
            p=d/'transport.jsonl'; assert p.exists(),p
            raw=p.read_bytes(); gotsha=hashlib.sha256(raw).hexdigest()
            rows=[json.loads(x) for x in raw.decode().splitlines() if x.strip()]
            req=[logical(r.get('url') or r.get('next')) for r in rows]
            req=[x for x in req if x]
            assert req,(y,b)
            typ,lid=req[-1]
            exp_lid,exp_stage,exp_pos,exp_class,exp_sha=expected_known[(y,b)]
            assert (lid,typ,gotsha)==(exp_lid,exp_stage,exp_sha),(y,b,lid,typ,gotsha)
            fc=classify(rows,typ,lid)
            assert fc==exp_class,(y,b,fc,exp_class)
            found.append({'draft_year':y,'batch_index':b,'league_id':lid,'candidate_position_in_batch':exp_pos,'endpoint_stage':typ,'failure_class':fc,'v3_transport_jsonl_sha256':gotsha})
        assert len(found)==22
        found.sort(key=lambda x:(x['draft_year'],x['batch_index']))

        contract={
         'schema_version':1,'study_id':'draft-pick-fv-v7-r1-r6-full-scale-tail-continuity',
         'stage':'phase2_candidate_transport_isolation_amendment',
         'status':'FROZEN_AFTER_V3_EXHAUSTION_BEFORE_V4_EXECUTION',
         'decision':'FREEZE_V7_PHASE2_CANDIDATE_TRANSPORT_ISOLATION_AUTHORIZED',
         'prior_residual_router_run_id':36173274943,
         'prior_residual_router_head_sha':'fb8baaacfc7bcf5dab6fdb142fa90bf1b5a5f12e',
         'prior_residual_router_audit':{'artifact_name':'v7-p2-residual-router-audit','artifact_zip_sha256':'2a0bae67785e0aa6bb96d9761a3e8d91d4930c7f0abeef242dbc8ff35603dcc8','expected_residual_batch_n':22,'recovered_valid_artifact_n':0,'missing_residual_batch_n':22,'complete':False},
         'candidate_universe_total_n':6203,'r25_batch_total_n':251,'validated_pre_residual_batch_n':229,
         'residual_batch_n':22,'residual_candidate_n':550,
         'known_transport_unresolved_n':22,'known_transport_unresolved_fraction_of_candidate_universe':22/6203,
         'known_transport_unresolved':found,
         'amendment':{
          'scientific_contract_changed':True,'change_scope':'transport_failure_censoring_only',
          'source_selection_contract_changed':False,'candidate_membership_changed':False,'candidate_order_changed':False,
          'identity_snapshot_changed':False,'outcome_firewall_changed':False,'holdout_2024_policy_changed':False,
          'new_league_search_allowed':False,'replacement_candidate_allowed':False,'source_substitution_allowed':False,
          'known_v3_exhausted_candidate_rerequest_required':False,
          'known_v3_exhausted_candidate_may_be_censored_from_v3_evidence':True,
          'new_transport_failure_must_exhaust_frozen_residual_router_before_censoring':True,
          'transport_unresolved_is_not_clean':True,'transport_unresolved_is_not_ineligible':True,'transport_unresolved_is_not_a_source_rejection':True,
          'candidate_level_continuation_after_transport_exhaustion':True,
          'candidate_disposition_exact_once_required':True,
          'maximum_transport_unresolved_fraction_of_candidate_universe':0.01,
          'assembly_requires_transport_censoring_gate_pass':True
         },
         'firewalls':{'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,'market_or_ktc_values_read':False,'package_vote_data_read':False,'candidate_fit_performed':False,'candidate_scores_computed':False,'candidate_selection_performed':False,'production_change_authorized':False},
         'next_if_green':'assemble exact 251/251 checkpoints with explicit candidate dispositions and transport-censoring ledger, then run a separate revised Phase 2 final source/identity freeze'
        }
        cp=out/'r1_r6_phase2_candidate_transport_isolation_v7.json'
        cp.write_text(json.dumps(contract,indent=2,sort_keys=True)+'\n')
        md=out/'r1_r6_phase2_candidate_transport_isolation_v7.md'
        md.write_text("""# Draft Pick FV V7 — Phase 2 Candidate Transport Isolation Amendment\n\nV3 exhausted the frozen residual router for all 22 residual R25 batches and recovered 0 complete batch checkpoints. The observed failures are legacy MFL transport failures, not identity or outcome errors.\n\nV4 changes only transport-failure handling. A candidate with previously proven V3 transport exhaustion is recorded as `transport_unresolved` and is not requested again. Any newly encountered transport failure must exhaust the same frozen residual router before receiving that status. The workflow then continues to the next frozen candidate in the same batch.\n\nTransport-unresolved candidates remain members of the frozen candidate universe. They are not clean leagues, ineligible leagues, source rejections, replacement candidates, or zero-valued observations. No new league search, replacement candidate, source substitution, candidate reordering, identity change, outcome read, fit, or production change is authorized.\n\nThe amendment is explicitly methodological and therefore records `scientific_contract_changed: true`, limited to transport-failure censoring. Assembly is permitted only if every frozen candidate receives exactly one disposition and total transport censoring remains at or below 1% of the 6,203-candidate universe.\n""")
        sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
        manifest={'schema_version':1,'study_id':contract['study_id'],'stage':'phase2_candidate_transport_isolation_amendment_manifest','decision':contract['decision'],'contract_sha256':sha(cp),'markdown_sha256':sha(md),'prior_v3_run_id':36173274943,'prior_v3_audit_artifact_zip_sha256':'2a0bae67785e0aa6bb96d9761a3e8d91d4930c7f0abeef242dbc8ff35603dcc8','original_engine_sha256':'264cf774aa064521921fdab827dfa3b11c778e9612049a20177491faca2274d0','v3_residual_router_engine_sha256':'acbb24303b98d8b89f00c4f9757a70d6a72246746d85934643d39a204fd5ffd6','v4_candidate_isolation_engine_sha256':'cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7','identity_asset_manifest_sha256':'e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e','fantasypros_sleeper_crosswalk_sha256':'697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132','known_transport_unresolved_n':22,'maximum_transport_unresolved_fraction_of_candidate_universe':0.01,'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,'candidate_fit_performed':False,'production_change_authorized':False}
        mp=out/'r1_r6_phase2_candidate_transport_isolation_manifest_v7.json'
        mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
        assert sha(cp)=='d2999d40312316919fa7c15ad66a4988bf788db394375a78ca2fba20f37ce126'
        assert sha(md)=='12262d2c3868338b9b5a283b4b85295d23243ec246073b055f2a30a38cfbf8f9'
        assert sha(mp)=='1b3d89fa7311083d06026601101bc6342c678ff7e180130964c9013accec92a2'
        print('PASS: V3 evidence independently reproduced exact 22-candidate transport ledger and deterministic V4 amendment.')
        PY
    - name: Freeze candidate transport-isolation amendment to main
      id: freeze
      shell: bash
      run: |
        set -euo pipefail
        R="research/draft-pick-fv-v7"
        A="${RUNNER_TEMP}/amendment"
        files=(r1_r6_phase2_candidate_transport_isolation_v7.json r1_r6_phase2_candidate_transport_isolation_v7.md r1_r6_phase2_candidate_transport_isolation_manifest_v7.json)
        git fetch origin main
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
          echo "ERROR: main advanced after workflow checkout; rerun V4 from current main."
          exit 1
        fi
        existing=0
        for f in "${files[@]}"; do [ -e "$R/$f" ] && existing=$((existing+1)); done
        if [ "$existing" -eq 0 ]; then
          for f in "${files[@]}"; do cp "$A/$f" "$R/$f"; done
          git add "${files[@]/#/$R/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Draft Pick FV V7 candidate transport isolation amendment"
          git push origin HEAD:main
        elif [ "$existing" -eq 3 ]; then
          for f in "${files[@]}"; do cmp -s "$A/$f" "$R/$f" || { echo "ERROR: existing V4 amendment drift: $f"; exit 1; }; done
          echo "PASS: exact V4 amendment was already frozen; reusing it."
        else
          echo "ERROR: partial V4 amendment exists ($existing/3 files)."
          exit 1
        fi
        test "$(sha256sum "$R/r1_r6_phase2_candidate_transport_isolation_v7.json" | awk '{print $1}')" = "d2999d40312316919fa7c15ad66a4988bf788db394375a78ca2fba20f37ce126"
        test "$(sha256sum "$R/r1_r6_phase2_candidate_transport_isolation_v7.md" | awk '{print $1}')" = "12262d2c3868338b9b5a283b4b85295d23243ec246073b055f2a30a38cfbf8f9"
        test "$(sha256sum "$R/r1_r6_phase2_candidate_transport_isolation_manifest_v7.json" | awk '{print $1}')" = "1b3d89fa7311083d06026601101bc6342c678ff7e180130964c9013accec92a2"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "PASS: V4 transport-censoring amendment frozen before V4 candidate execution."
    - name: Patch exact V3 engine for candidate-level transport isolation
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import json, hashlib, os
        p=Path(os.environ['RUNNER_TEMP'])/'engine'/'build_r1_r6_source_identity_v7.py'
        text=p.read_text()
        start=text.index('def probe_batch(year,discovery_path,batch_index,out,dp,nv,asset):')
        end=text.index('\ndef aggregate_year(year,discovery_path,batch_dir,out):', start)
        contract=json.loads(Path('research/draft-pick-fv-v7/r1_r6_phase2_candidate_transport_isolation_v7.json').read_text())
        known={}
        for r in contract['known_transport_unresolved']:
            key=f"{r['draft_year']}:{r['batch_index']}:{r['league_id']}"
            known[key]={
              'draft_year':r['draft_year'],'batch_index':r['batch_index'],'league_id':r['league_id'],
              'candidate_position_in_batch':r['candidate_position_in_batch'],'stage':r['endpoint_stage'],
              'failure_class':r['failure_class'],
              'v3_transport_jsonl_sha256':r['v3_transport_jsonl_sha256'],
              'v3_run_id':int(contract['prior_residual_router_run_id']),
            }
        known_literal=json.dumps(known,sort_keys=True,separators=(',',':'))
        replacement=f'''V4_KNOWN_TRANSPORT_UNRESOLVED=json.loads({known_literal!r})
        V4_TRANSPORT_AMENDMENT_ID='draft-pick-fv-v7-phase2-candidate-transport-isolation-v1'

        def _v4_transport_exhaustion(exc):
            return isinstance(exc,GateError) and 'residual router transport failure after' in str(exc)

        def _v4_transport_class(message):
            s=str(message)
            if 'NameResolutionError' in s: return 'dns_resolution_failure'
            if 'ConnectTimeout' in s: return 'connect_timeout'
            if 'HTTP 503' in s: return 'http_503'
            if 'HTTP 5' in s: return 'http_5xx'
            if 'JSONDecodeError' in s: return 'non_json_response'
            if 'SSLError' in s: return 'tls_ssl_failure'
            if 'NoneType: None' in s: return 'redirect_loop_or_no_terminal_error'
            return 'transport_exhaustion_other'

        def probe_batch(year,discovery_path,batch_index,out,dp,nv,asset):
            _,src=guard()
            disc_payload=load(discovery_path)
            if int(disc_payload['draft_year'])!=year: raise GateError('discovery year mismatch')
            ids=list(disc_payload['candidate_ids'])
            if hashlib.sha256('\\n'.join(ids).encode()).hexdigest()!=disc_payload['candidate_ids_sha256']:
                raise GateError('candidate-id checkpoint hash mismatch')
            batch_count=(len(ids)+BATCH_SIZE-1)//BATCH_SIZE
            if batch_index<0 or batch_index>=batch_count: raise GateError(f'invalid batch {{batch_index}}/{{batch_count}}')
            lo=batch_index*BATCH_SIZE; hi=min(len(ids),lo+BATCH_SIZE); batch_ids=ids[lo:hi]
            seeds={{str(x['league_id']):x for x in src['development']['leagues'] if int(x['draft_year'])==year}}
            idx,a=load_indexes(dp,nv,asset)
            ses=requests.Session(); ses.headers['User-Agent']=f'LOG-Draft-Pick-FV-V7-P2-V4-{{year}}-B{{batch_index:03d}}/4.0'
            clean=[]; occ=[]; rej=[]; unresolved=[]; dispositions=[]; cnt=Counter()

            def disposition(lid,status,**extra):
                row={{'league_id':str(lid),'status':status,**extra}}
                dispositions.append(row)
                return row

            for j,lid in enumerate(batch_ids,1):
                lid=str(lid)
                known_key=f'{{year}}:{{batch_index}}:{{lid}}'
                prior=V4_KNOWN_TRANSPORT_UNRESOLVED.get(known_key)
                if prior is not None:
                    if int(prior['candidate_position_in_batch'])!=j:
                        raise GateError(f'known transport-censored candidate moved: {{known_key}} expected_pos={{prior["candidate_position_in_batch"]}} got={{j}}')
                    u={{
                      'draft_year':year,'batch_index':batch_index,'league_id':lid,
                      'candidate_position_in_batch':j,'stage':prior['stage'],
                      'failure_class':prior['failure_class'],'evidence_source':'v3_exhausted_transport_reused',
                      'v3_run_id':int(prior['v3_run_id']),
                      'v3_transport_jsonl_sha256':prior['v3_transport_jsonl_sha256'],
                    }}
                    unresolved.append(u); cnt['transport_unresolved']+=1
                    disposition(lid,'transport_unresolved',stage=u['stage'],failure_class=u['failure_class'],evidence_source=u['evidence_source'])
                    continue

                stage='draftResults'
                try:
                    units=V.extract_units(V.get_json(ses,V.api_url(year,'draftResults',L=lid)))
                    chosen,reason,us=V.choose_unit(units)
                    if chosen is None:
                        cnt[f'draft_unit_reject:{{reason}}']+=1
                        disposition(lid,'draft_unit_reject',reason=str(reason))
                        continue
                    can=canonical72(chosen)
                    if not can['complete_unique_slot_grid']:
                        cnt['incomplete_or_duplicate_slot_grid_reject']+=1
                        disposition(lid,'incomplete_or_duplicate_slot_grid_reject')
                        continue
                    stage='league'
                    lg=V.league_obj(V.get_json(ses,V.api_url(year,'league',L=lid)))
                    if lg is None:
                        cnt['league_missing']+=1
                        disposition(lid,'league_missing')
                        continue
                    ok,q=V.qualifier(lg)
                    if not ok:
                        cnt[f'qualifier_reject:{{q}}']+=1
                        disposition(lid,'qualifier_reject',reason=str(q))
                        continue
                    if V.obvious_mock_name(lg.get('name')):
                        cnt['obvious_mock_reject']+=1
                        disposition(lid,'obvious_mock_reject')
                        continue
                    pids=[x['mfl_player_id'] for x in can['slots'].values() if x.get('mfl_player_id')]
                    stage='players'
                    meta=V.league_scoped_players(ses,year,lid,pids)
                    cr=[{{'overall_slot':s,'mfl_player_id':x['mfl_player_id']}} for s,x in sorted(can['slots'].items()) if x.get('mfl_player_id')]
                    contam=V.classify_contamination(year,cr,meta,idx)
                    if contam['positive_contamination']:
                        cnt['positive_contamination_reject']+=1
                        rej.append({{'draft_year':year,'league_id':lid,'league_name':lg.get('name'),
                                    'seed_member':lid in seeds,'positive_evidence_n':contam['positive_evidence_n'],
                                    'positive_evidence':contam['positive_evidence']}})
                        disposition(lid,'positive_contamination_reject')
                        continue
                    origin='v6_clean_seed_requalified_full72' if lid in seeds else 'v7_historical_bounded_discovery_clean'
                    rec={{'draft_year':year,'league_id':lid,'league_name':lg.get('name'),'idp':V.is_idp(lg),
                         'source_origin':origin,'v6_seed_member':lid in seeds,'qualifier_kind':q,
                         'keeper_state':V.keeper_state(lg),'qb_limit':V.qb_limit(lg),
                         'draft_player_pool':lg.get('draftPlayerPool'),'positive_contamination':False,
                         'diagnostic_unknown_n':contam['diagnostic_unknown_n'],
                         'diagnostic_unknown':contam['diagnostic_unknown'],'draft_unit_n':len(units),
                         'unit_selection_reason':reason,'unit_summary':us,
                         'source_missing_slots_1_72':can['source_missing_slots'],
                         'invalid_occurrence_slots_1_72':can['invalid_occurrence_slots'],
                         'duplicate_slots_1_72':can['duplicate_slots'],
                         'duplicate_players_1_72':can['duplicate_players'],
                         'invalid_grid_1_72':can['invalid_grid']}}
                    clean.append(rec)
                    occ.extend(rows_for(year,lid,lg.get('name'),V.is_idp(lg),origin,can,meta,idx,'development'))
                    cnt['clean_full72']+=1; cnt['clean_full72_seed' if lid in seeds else 'clean_full72_new']+=1
                    disposition(lid,'clean_full72')
                except GateError as exc:
                    if not _v4_transport_exhaustion(exc):
                        raise
                    fc=_v4_transport_class(str(exc))
                    u={{
                      'draft_year':year,'batch_index':batch_index,'league_id':lid,
                      'candidate_position_in_batch':j,'stage':stage,'failure_class':fc,
                      'evidence_source':'v4_exhausted_transport',
                      'error_fingerprint_sha256':hashlib.sha256(str(exc).encode()).hexdigest(),
                    }}
                    unresolved.append(u); cnt['transport_unresolved']+=1
                    disposition(lid,'transport_unresolved',stage=stage,failure_class=fc,evidence_source='v4_exhausted_transport')
                    continue
                if j%10==0 or j==len(batch_ids):
                    print(f'{{year}} batch {{batch_index+1}}/{{batch_count}}: {{j}}/{{len(batch_ids)}} candidates clean={{cnt["clean_full72"]}} transport_unresolved={{cnt["transport_unresolved"]}}',flush=True)

            if [x['league_id'] for x in dispositions] != [str(x) for x in batch_ids]:
                raise GateError('candidate disposition order/coverage mismatch')
            if len(dispositions)!=len(batch_ids) or len({{x['league_id'] for x in dispositions}})!=len(batch_ids):
                raise GateError('candidate disposition exact-once violation')
            clean.sort(key=lambda x:int(x['league_id']))
            occ.sort(key=lambda x:(int(x['league_id']),int(x['overall_slot'])))
            unresolved.sort(key=lambda x:int(x['candidate_position_in_batch']))
            payload={{
                'schema_version':2,'study_id':STUDY,'stage':'phase2_historical_probe_batch',
                'draft_year':year,'batch_index':batch_index,'batch_count':batch_count,
                'batch_size':BATCH_SIZE,'candidate_start_index':lo,'candidate_end_index_exclusive':hi,
                'candidate_ids':batch_ids,
                'candidate_ids_sha256':hashlib.sha256('\\n'.join(batch_ids).encode()).hexdigest(),
                'generated_at_utc':now(),'research_only':True,'historical_source_search_performed':False,
                'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,
                'market_or_ktc_values_read':False,'package_vote_data_read':False,
                'candidate_fit_performed':False,'candidate_scores_computed':False,
                'candidate_selection_performed':False,'production_change_authorized':False,
                'transport_recovery_applied':True,'checkpoint_recovery_applied':True,
                'candidate_transport_isolation_applied':True,
                'candidate_transport_isolation_amendment_id':V4_TRANSPORT_AMENDMENT_ID,
                'transport_unresolved_n':len(unresolved),'transport_unresolved':unresolved,
                'candidate_dispositions':dispositions,
                'probe_counts':dict(cnt),'clean_leagues':clean,
                'positive_contamination_rejections':rej,'occurrences':occ,
                'identity_sources':{{'dynastyprocess_sha256':a['dynastyprocess']['sha256'],
                    'nflverse_players_sha256':a['nflverse_players']['sha256'],
                    'fantasypros_sleeper_crosswalk_sha256':a['fantasypros_sleeper_crosswalk']['sha256'],
                    'identity_asset_manifest_sha256':sha(asset)}},
            }}
            writej(out,payload)
        '''
        patched=text[:start]+replacement+text[end:]
        out=p
        out.write_text(patched)
        compile(patched,str(out),'exec')
        print(hashlib.sha256(out.read_bytes()).hexdigest())
        print('known_n',len(known))
        PY
        python3 -m py_compile "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py"
        test "$(sha256sum "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
        cp "${RUNNER_TEMP}/engine/identity_crosswalk.json" scripts/identity_crosswalk.json
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --selftest
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" --guard
        git checkout -- scripts/identity_crosswalk.json
        python3 - <<'PY'
        import importlib.util,os
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])/'engine'/'build_r1_r6_source_identity_v7.py'
        spec=importlib.util.spec_from_file_location('v4iso',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
        assert len(m.V4_KNOWN_TRANSPORT_UNRESOLVED)==22
        assert m.V4_KNOWN_TRANSPORT_UNRESOLVED['2018:0:72532']['failure_class']=='redirect_loop'
        assert m.V4_KNOWN_TRANSPORT_UNRESOLVED['2018:3:12698']['stage']=='league'
        assert m._v4_transport_exhaustion(m.GateError('residual router transport failure after 4 rounds / 14 same-request routes: NoneType: None'))
        assert m._v4_transport_class('x NameResolutionError y')=='dns_resolution_failure'
        assert m._v4_transport_class('x ConnectTimeout y')=='connect_timeout'
        assert m._v4_transport_class('x HTTP 503 y')=='http_503'
        print('PASS: V4 candidate isolation helper contract self-test.')
        PY
    - name: Build exact 22-batch V4 matrix
      id: matrix
      shell: bash
      run: |
        python3 - <<'PY'
        import json,os
        expected={2018:[0,3,5,13,24,31,33,35,36,39,41],2019:[0,15,24,25,29,37],2020:[12,34,39],2021:[28,34],2022:[],2023:[]}
        m={'include':[]}; i=0
        for y in sorted(expected):
          for b in expected[y]: m['include'].append({'year':y,'batch':b,'slot':i%3}); i+=1
        assert len(m['include'])==22
        with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+json.dumps(m,separators=(',',':'))+'\n')
        print('PASS: exact 22 residual batches scheduled for V4 candidate-level continuation.')
        PY
    - name: Run full repository regression after amendment freeze
      shell: bash
      run: |
        set -euo pipefail
        TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
        TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"
