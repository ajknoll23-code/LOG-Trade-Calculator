  recover:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
    - name: Check out exact V4 amendment commit
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install transport dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download exact V4 engine and discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-candidate-isolation-engine
        path: ${{ runner.temp }}/engine
    - name: Download exact V4 discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-candidate-isolation-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Restore exact frozen identity crosswalk
      shell: bash
      run: |
        set -euo pipefail
        test "$(sha256sum "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" = "cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7"
        test "$(sha256sum "${RUNNER_TEMP}/engine/identity_crosswalk.json" | awk '{print $1}')" = "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
        cp "${RUNNER_TEMP}/engine/identity_crosswalk.json" scripts/identity_crosswalk.json
        test "$(sha256sum scripts/identity_crosswalk.json | awk '{print $1}')" = "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
        test "$(sha256sum research/draft-pick-fv-v7/r1_r6_phase2_candidate_transport_isolation_v7.json | awk '{print $1}')" = "d2999d40312316919fa7c15ad66a4988bf788db394375a78ca2fba20f37ce126"
    - name: Verify exact frozen residual batch
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
      run: |
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path
        y=int(os.environ['YEAR']); b=int(os.environ['BATCH']); root=Path(os.environ['RUNNER_TEMP'])
        c=json.loads(Path('research/draft-pick-fv-v7/r1_r6_phase2_candidate_transport_isolation_v7.json').read_text())
        d=json.loads((root/'discoveries'/f'discovery_{y}.json').read_text()); ids=list(d['candidate_ids']); n=math.ceil(len(ids)/25)
        assert 0<=b<n; exp=ids[b*25:min(len(ids),(b+1)*25)]; assert exp
        known=[x for x in c['known_transport_unresolved'] if int(x['draft_year'])==y and int(x['batch_index'])==b]
        assert len(known)==1 and known[0]['league_id'] in exp
        assert int(known[0]['candidate_position_in_batch'])==exp.index(known[0]['league_id'])+1
        print(f"PASS: V4 batch {y}/{b} exact frozen slice; known V3 dead candidate {known[0]['league_id']} at {known[0]['candidate_position_in_batch']}/25")
        PY
    - name: Run candidate-level isolated residual batch
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
        SLOT: ${{ matrix.slot }}
        MFL_TRANSPORT_DIAGNOSTIC_PATH: ${{ runner.temp }}/diag/transport.jsonl
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/probe" "${RUNNER_TEMP}/diag"
        sleep "$(( SLOT * 10 ))"
        PAD="$(printf '%03d' "$BATCH")"
        python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py"   --probe-year "$YEAR"   --batch-index "$BATCH"   --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$YEAR.json"   --dp "${RUNNER_TEMP}/engine/db_playerids.csv"   --nflverse "${RUNNER_TEMP}/engine/nflverse_players.csv"   --asset-manifest "${RUNNER_TEMP}/engine/r1_r6_identity_asset_manifest_v7.json"   --out "${RUNNER_TEMP}/probe/batch_$PAD.json"
    - name: Validate complete V4 candidate disposition checkpoint
      shell: bash
      env:
        YEAR: ${{ matrix.year }}
        BATCH: ${{ matrix.batch }}
      run: |
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path
        y=int(os.environ['YEAR']); b=int(os.environ['BATCH']); root=Path(os.environ['RUNNER_TEMP'])
        contract=json.loads(Path('research/draft-pick-fv-v7/r1_r6_phase2_candidate_transport_isolation_v7.json').read_text())
        frozen=json.loads((root/'discoveries'/f'discovery_{y}.json').read_text()); ids=list(frozen['candidate_ids']); n=math.ceil(len(ids)/25)
        p=root/'probe'/f'batch_{b:03d}.json'; d=json.loads(p.read_text()); exp=ids[b*25:min(len(ids),(b+1)*25)]
        assert d['schema_version']==2 and d['draft_year']==y and d['batch_index']==b and d['batch_count']==n and d['batch_size']==25
        assert d['candidate_ids']==exp and hashlib.sha256('\n'.join(exp).encode()).hexdigest()==d['candidate_ids_sha256']
        assert d['candidate_transport_isolation_applied'] is True
        assert d['candidate_transport_isolation_amendment_id']=='draft-pick-fv-v7-phase2-candidate-transport-isolation-v1'
        assert [x['league_id'] for x in d['candidate_dispositions']]==[str(x) for x in exp]
        assert len(d['candidate_dispositions'])==len(exp)==len({x['league_id'] for x in d['candidate_dispositions']})
        known=[x for x in contract['known_transport_unresolved'] if int(x['draft_year'])==y and int(x['batch_index'])==b]; assert len(known)==1
        ku=[x for x in d['transport_unresolved'] if x['evidence_source']=='v3_exhausted_transport_reused']; assert len(ku)==1
        assert ku[0]['league_id']==known[0]['league_id'] and ku[0]['v3_transport_jsonl_sha256']==known[0]['v3_transport_jsonl_sha256']
        for u in d['transport_unresolved']:
          assert u['league_id'] in [str(x) for x in exp]
          assert u['evidence_source'] in ('v3_exhausted_transport_reused','v4_exhausted_transport')
        for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'): assert d[k] is False
        print(f"PASS: V4 checkpoint {y}/{b}: 25/25 exact dispositions, transport_unresolved={d['transport_unresolved_n']}")
        PY
    - name: Upload V4 residual checkpoint
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-candidate-isolation-${{ matrix.year }}-${{ matrix.batch }}
        path: ${{ runner.temp }}/probe/batch_*.json
        if-no-files-found: error
        retention-days: 30
    - name: Upload V4 transport diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-candidate-isolation-diag-${{ matrix.year }}-${{ matrix.batch }}
        path: ${{ runner.temp }}/diag/transport.jsonl
        if-no-files-found: ignore
        retention-days: 30

  audit_v4:
    needs: [prepare, recover]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      complete: ${{ steps.audit.outputs.complete }}
      censor_gate: ${{ steps.audit.outputs.censor_gate }}
    steps:
    - name: Check out exact V4 amendment commit
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Download exact discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-candidate-isolation-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Download any V4 checkpoints
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/v4-current"
        gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-candidate-isolation-20*' -D "${RUNNER_TEMP}/v4-current" || true
    - name: Audit V4 completion and transport-censoring gate
      id: audit
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib,json,math,os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        rec=root/'v4-current'; disc=root/'discoveries'; out=root/'v4-audit'; out.mkdir(parents=True,exist_ok=True)
        contract=json.loads(Path('research/draft-pick-fv-v7/r1_r6_phase2_candidate_transport_isolation_v7.json').read_text())
        expected={2018:[0,3,5,13,24,31,33,35,36,39,41],2019:[0,15,24,25,29,37],2020:[12,34,39],2021:[28,34],2022:[],2023:[]}
        known={(int(x['draft_year']),int(x['batch_index']),str(x['league_id'])) for x in contract['known_transport_unresolved']}
        found={y:{} for y in expected}; unresolved=[]
        if rec.exists():
          for p in sorted(rec.rglob('batch_*.json')):
            d=json.loads(p.read_text()); y=int(d['draft_year']); b=int(d['batch_index'])
            assert b in expected[y],(y,b)
            ids=list(json.loads((disc/f'discovery_{y}.json').read_text())['candidate_ids'])
            exp=ids[b*25:min(len(ids),(b+1)*25)]
            assert d['candidate_ids']==exp
            assert [x['league_id'] for x in d['candidate_dispositions']]==[str(x) for x in exp]
            assert len(d['candidate_dispositions'])==len(exp)==len({x['league_id'] for x in d['candidate_dispositions']})
            for u in d['transport_unresolved']:
              assert str(u['league_id']) in [str(x) for x in exp]
              unresolved.append(u)
            h=hashlib.sha256(p.read_bytes()).hexdigest()
            if b in found[y]: assert found[y][b]==h
            found[y][b]=h
        missing={y:[b for b in expected[y] if b not in found[y]] for y in expected}
        complete=sum(len(x) for x in missing.values())==0
        if complete:
          got_known={(int(x['draft_year']),int(x['batch_index']),str(x['league_id'])) for x in unresolved if x['evidence_source']=='v3_exhausted_transport_reused'}
          assert got_known==known,(sorted(known-got_known),sorted(got_known-known))
          keys=[(int(x['draft_year']),int(x['batch_index']),str(x['league_id'])) for x in unresolved]
          assert len(keys)==len(set(keys))
        total_unresolved=len(unresolved) if complete else None
        frac=(total_unresolved/6203) if complete else None
        censor_gate=bool(complete and frac<=float(contract['amendment']['maximum_transport_unresolved_fraction_of_candidate_universe']))
        obj={'schema_version':1,'study_id':contract['study_id'],'stage':'phase2_candidate_transport_isolation_audit','expected_residual_batch_n':22,'recovered_valid_artifact_n':sum(len(x) for x in found.values()),'missing_residual_batch_n':sum(len(x) for x in missing.values()),'missing_batches_by_year':{str(y):missing[y] for y in sorted(missing)},'complete':complete,'known_v3_transport_unresolved_n':22,'transport_unresolved_n':total_unresolved,'new_v4_transport_unresolved_n':(total_unresolved-22 if complete else None),'transport_unresolved_fraction_of_candidate_universe':frac,'maximum_transport_unresolved_fraction_of_candidate_universe':contract['amendment']['maximum_transport_unresolved_fraction_of_candidate_universe'],'transport_censoring_gate_pass':censor_gate,'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,'candidate_fit_performed':False,'production_change_authorized':False}
        (out/'candidate_transport_isolation_audit.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
        print(json.dumps(obj,indent=2))
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
          f.write('complete='+('true' if complete else 'false')+'\n')
          f.write('censor_gate='+('true' if censor_gate else 'false')+'\n')
        PY
    - name: Upload V4 audit
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-candidate-isolation-audit
        path: ${{ runner.temp }}/v4-audit/candidate_transport_isolation_audit.json
        if-no-files-found: error
        retention-days: 30

  assemble_six_years:
    needs: [prepare, audit_v4]
    if: ${{ needs.audit_v4.outputs.complete == 'true' && needs.audit_v4.outputs.censor_gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Check out exact V4 amendment commit
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare.outputs.study_sha }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.15
    - name: Install engine dependency
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"
    - name: Download V4 engine and discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-candidate-isolation-engine
        path: ${{ runner.temp }}/engine
    - name: Download V4 discoveries
      uses: actions/download-artifact@v4
      with:
        name: v7-p2-candidate-isolation-discoveries
        path: ${{ runner.temp }}/discoveries
    - name: Restore exact frozen identity crosswalk
      shell: bash
      run: |
        set -euo pipefail
        cp "${RUNNER_TEMP}/engine/identity_crosswalk.json" scripts/identity_crosswalk.json
        test "$(sha256sum scripts/identity_crosswalk.json | awk '{print $1}')" = "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
    - name: Download prior 199, targeted 30, and V4 22 checkpoints
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/prior-all/A" "${RUNNER_TEMP}/prior-all/B" "${RUNNER_TEMP}/prior-all/C" "${RUNNER_TEMP}/prior-all/slow" "${RUNNER_TEMP}/targeted-success" "${RUNNER_TEMP}/v4-current"
        gh run download 36060826299 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-A-probe-*' -D "${RUNNER_TEMP}/prior-all/A"
        gh run download 36061005645 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-B-probe-*' -D "${RUNNER_TEMP}/prior-all/B"
        gh run download 36060855053 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-shard-C-probe-*' -D "${RUNNER_TEMP}/prior-all/C"
        for N in 1 2 4; do mkdir -p "${RUNNER_TEMP}/prior-all/slow/$N"; gh run download 36052205794 --repo "$GITHUB_REPOSITORY" -n "v7-p2-r25-probe-2018-$N" -D "${RUNNER_TEMP}/prior-all/slow/$N"; done
        gh run download 36120014342 --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-targeted-recovery-20*' -D "${RUNNER_TEMP}/targeted-success"
        gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'v7-p2-candidate-isolation-20*' -D "${RUNNER_TEMP}/v4-current"
    - name: Prove exact 251-checkpoint / 6203-candidate coverage
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib,json,math,os,shutil
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP']); discroot=root/'discoveries'
        sources=[root/'prior-all',root/'targeted-success',root/'v4-current']
        out=root/'assembled'; out.mkdir(parents=True,exist_ok=True)
        expected_counts={2018:43,2019:41,2020:41,2021:42,2022:42,2023:42}
        grand_batch_n=0; grand_candidate_n=0; unresolved=[]
        for y,n in expected_counts.items():
          disc=json.loads((discroot/f'discovery_{y}.json').read_text()); ids=list(disc['candidate_ids'])
          assert math.ceil(len(ids)/25)==n
          seen={}
          for base in sources:
            if not base.exists(): continue
            for p in base.rglob('batch_*.json'):
              d=json.loads(p.read_text()); yy=int(d['draft_year']); b=int(d['batch_index'])
              if yy!=y: continue
              exp=ids[b*25:min(len(ids),(b+1)*25)]
              assert d['candidate_ids']==exp and d['batch_size']==25
              assert hashlib.sha256('\n'.join(exp).encode()).hexdigest()==d['candidate_ids_sha256']
              for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'):
                assert d[k] is False,(p,k)
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if b in seen: assert seen[b][0]==h,(y,b,'non-identical duplicate')
              else: seen[b]=(h,p)
          assert not (set(range(n))-set(seen)) and not (set(seen)-set(range(n)))
          yd=out/str(y); yd.mkdir(exist_ok=True); flat=[]
          for b in range(n):
            p=seen[b][1]; d=json.loads(p.read_text()); shutil.copy2(p,yd/f'batch_{b:03d}.json'); flat.extend(d['candidate_ids'])
            if d.get('candidate_transport_isolation_applied'):
              assert [x['league_id'] for x in d['candidate_dispositions']]==[str(x) for x in d['candidate_ids']]
              unresolved.extend(d['transport_unresolved'])
          assert flat==ids and len(flat)==len(set(flat))
          grand_batch_n+=n; grand_candidate_n+=len(ids)
          print(f'PASS: {y} exact-once {len(ids)} candidates / {n} R25 batches')
        assert grand_batch_n==251 and grand_candidate_n==6203
        keys=[(int(x['draft_year']),int(x['batch_index']),str(x['league_id'])) for x in unresolved]
        assert len(keys)==len(set(keys))
        frac=len(unresolved)/6203
        assert frac<=0.01,(len(unresolved),frac)
        (root/'assembled'/'transport_unresolved_ledger.json').write_text(json.dumps(sorted(unresolved,key=lambda x:(int(x['draft_year']),int(x['batch_index']),int(x['candidate_position_in_batch']))),indent=2,sort_keys=True)+'\n')
        print(f'PASS: exact 251/251 checkpoints, 6203/6203 frozen candidates, transport_unresolved={len(unresolved)} ({frac:.6%}).')
        PY
    - name: Aggregate six historical years
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/years"
        for Y in 2018 2019 2020 2021 2022 2023; do
          python3 "${RUNNER_TEMP}/engine/build_r1_r6_source_identity_v7.py"     --aggregate-year "$Y"     --discovery-path "${RUNNER_TEMP}/discoveries/discovery_$Y.json"     --batch-dir "${RUNNER_TEMP}/assembled/$Y"     --out "${RUNNER_TEMP}/years/year_$Y.json"
        done
    - name: Attach explicit transport-censoring ledger to year outputs
      shell: bash
      run: |
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP']); years=root/'years'; assembled=root/'assembled'
        ledger=json.loads((assembled/'transport_unresolved_ledger.json').read_text())
        for y in range(2018,2024):
          p=years/f'year_{y}.json'; d=json.loads(p.read_text())
          u=[x for x in ledger if int(x['draft_year'])==y]
          cand=int(d['discovery']['bounded_unique_union_including_seed_n'])
          d['candidate_transport_isolation_applied']=True
          d['transport_censoring']={'candidate_universe_year_n':cand,'transport_unresolved_n':len(u),'fully_retrieved_candidate_n':cand-len(u),'transport_unresolved_fraction':(len(u)/cand if cand else 0.0),'transport_unresolved':u,'replacement_candidate_n':0,'source_substitution_n':0,'exact_candidate_disposition_coverage':True}
          d['discovery']['all_bounded_union_candidates_probed']=True
          d['discovery']['all_bounded_union_candidates_attempted_or_v3_censored']=True
          d['discovery']['all_bounded_union_candidates_fully_retrieved']=(len(u)==0)
          d['discovery']['transport_unresolved_candidate_n']=len(u)
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
        PY
    - name: Validate six-year V4 assembly and write manifest
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib,json,os
        from datetime import datetime,timezone
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP']); years=root/'years'; eng=root/'engine'; assembled=root/'assembled'
        sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
        contract=Path('research/draft-pick-fv-v7/r1_r6_phase2_candidate_transport_isolation_v7.json')
        contract_obj=json.loads(contract.read_text()); ledger=json.loads((assembled/'transport_unresolved_ledger.json').read_text())
        assert sha(eng/'build_r1_r6_source_identity_v7.py')=='cc7d06a78f97742ffb9aa978464a96fd2f3ff984e4802fc7f0edc48c9c60fae7'
        assert sha(eng/'identity_crosswalk.json')=='697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132'
        for y in range(2018,2024):
          d=json.loads((years/f'year_{y}.json').read_text())
          assert d['draft_year']==y and d['discovery']['all_bounded_union_candidates_probed'] is True
          assert d['discovery']['early_stopping_used'] is False and d['discovery']['search_errors']=={}
          assert d['source_count_gate_pass'] is True and d['source_identity_gate_pass'] is True
          assert d['transport_censoring']['replacement_candidate_n']==0 and d['transport_censoring']['source_substitution_n']==0
          for k in ('historical_player_outcomes_read','holdout_2024_outcomes_read','candidate_fit_performed','candidate_scores_computed','candidate_selection_performed','production_change_authorized'): assert d[k] is False
        frac=len(ledger)/6203
        assert frac<=float(contract_obj['amendment']['maximum_transport_unresolved_fraction_of_candidate_universe'])
        man={'schema_version':1,'study_id':contract_obj['study_id'],'stage':'phase2_candidate_transport_isolation_six_year_assembly','generated_at_utc':datetime.now(timezone.utc).isoformat(),'candidate_universe_total_n':6203,'r25_batch_total_n':251,'exact_once_checkpoint_coverage':True,'exact_candidate_disposition_coverage':True,'transport_unresolved_n':len(ledger),'transport_unresolved_fraction_of_candidate_universe':frac,'transport_censoring_gate_pass':True,'replacement_candidate_n':0,'source_substitution_n':0,'candidate_transport_isolation_contract_sha256':sha(contract),'v4_candidate_isolation_engine_sha256':sha(eng/'build_r1_r6_source_identity_v7.py'),'identity_asset_manifest_sha256':sha(eng/'r1_r6_identity_asset_manifest_v7.json'),'year_output_sha256':{str(y):sha(years/f'year_{y}.json') for y in range(2018,2024)},'historical_player_outcomes_read':False,'holdout_2024_outcomes_read':False,'candidate_fit_performed':False,'production_change_authorized':False}
        (years/'candidate_transport_isolation_six_years_manifest.json').write_text(json.dumps(man,indent=2,sort_keys=True)+'\n')
        (years/'transport_unresolved_ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
        print(json.dumps(man,indent=2))
        PY
    - name: Upload complete V4 six-year assembly
      uses: actions/upload-artifact@v4
      with:
        name: v7-p2-candidate-transport-isolation-six-years
        path: ${{ runner.temp }}/years/
        if-no-files-found: error
        retention-days: 30
