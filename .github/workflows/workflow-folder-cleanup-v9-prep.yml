# PREFLIGHTED: CLEAN_REBUILD_POST_DRAFT_PICK_V8_1_CLOSEOUT_FOR_V9
name: Workflow Folder Cleanup - V9 Prep

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install cleanup dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "PyYAML==6.0.2" \
            "requests==2.34.2"

      - name: Guard exact V8.1 closeout and clean cleanup-workflow state
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          workflow_dir=Path(".github/workflows")
          new_cleanup="workflow-folder-cleanup-v9-prep.yml"
          forbidden_old={
              "workflow-folder-cleanup-UPDATED-2026-09-26.yml",
              "workflow-folder-cleanup-UPDATED-2026-09-26-v2.yml",
          }

          current={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }

          assert new_cleanup in current, "new V9-prep cleanup workflow missing"
          stale=sorted(forbidden_old & current)
          if stale:
              raise SystemExit(
                  "Delete the two old cleanup workflows before running this one: "
                  + ", ".join(stale)
              )

          def blob(path):
              return subprocess.check_output(
                  ["git","hash-object",str(path)],text=True
              ).strip()

          d=Path("research/draft-pick-fv-v8-1")
          close=d/"v8_1_final_research_closeout.json"
          close_m=d/"v8_1_final_research_closeout_manifest.json"
          h2=d/"v8_1_phase2_2024_h2_confirmation.json"
          h2_close=d/"v8_1_phase2_2024_h2_opening_closeout.json"

          assert blob(close)=="e7e49fba505b0dc11818ca51c83007ac4d712a16"
          assert blob(close_m)=="590907efa3517b385f0ce05e8ad90fe5d1e8b208"
          assert blob(h2)=="fca01dbea074a0ad83dc4caa149c1e8360ff5466"
          assert blob(h2_close)=="64ce1654446f46d92f817ca353f52df983132051"

          c=json.loads(close.read_text())
          cm=json.loads(close_m.read_text())
          r=json.loads(h2.read_text())
          hc=json.loads(h2_close.read_text())

          assert c["decision"]=="CLOSE_V8_1_H2_STOP_NO_H3_NO_PRODUCTION"
          assert c["status"]=="RESEARCH_CLOSED_H2_CONFIRMATION_STOP"
          assert c["scientific_conclusion"]["v8_1_candidate_eligible_for_future_h3_confirmation"] is False
          assert c["scientific_conclusion"]["v8_1_candidate_eligible_for_production"] is False
          assert c["scientific_conclusion"]["production_change_authorized"] is False
          assert c["frozen_next_action"]["future_research_must_be_new_study"] is True
          assert c["frozen_next_action"]["2024_h2_is_now_exposed_and_must_not_be_treated_as_fresh_holdout_again"] is True
          assert c["one_shot_state"]["normal_h2_rerun_allowed"] is False

          assert cm["decision"]==c["decision"]
          assert cm["h2_decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert cm["h3_authorized"] is False
          assert cm["production_change_authorized"] is False
          assert cm["normal_h2_rerun_allowed"] is False
          assert cm["next_stage"] is None

          assert r["decision"]=="STOP_V8_1_2024_H2_CONFIRMATION"
          assert r["gate_pass"] is False
          assert r["next_stage"] is None

          assert hc["normal_rerun_allowed"] is False
          assert hc["2024_h2_outcome_bytes_opened"] is True
          assert hc["2024_rookie_h2_scored"] is True
          assert hc["2024_h3_scored"] is False
          assert hc["2026_outcomes_read"] is False

          print("PASS: old cleanup workflows absent.")
          print("PASS: new V9-prep cleanup is the only cleanup workflow.")
          print("PASS: exact V8.1 scientific closeout is frozen.")
          PY

      - name: Build exact archive plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          import yaml

          workflow_dir=Path(".github/workflows")
          archive_dir=Path(".github/workflow-archive/completed-research")
          archive_dir.mkdir(parents=True,exist_ok=True)

          batch="2026-09-28-post-draft-pick-v8-1-closeout-v9-prep"

          archive_targets={
              "draft-pick-fv-v8-1-closeout-preregistration.yml":
                  "7cd469be9cd36ed835939a6dfdf56044a2ad308e",
              "draft-pick-fv-v8-1-final-research-closeout-v2.yml":
                  "eed0d44439f830e3e70e85f5b45033b3e04e00f5",
              "draft-pick-fv-v8-1-final-research-closeout.yml":
                  "eb253265d55aa11b92fe744560a84396b4950beb",
              "draft-pick-fv-v8-1-phase1-5.yml":
                  "0ed2f9488576fb45793658a3111715dc83842705",
              "draft-pick-fv-v8-1-phase1-6-holdout-rookie-only-scope-hardening-v2.yml":
                  "e3d135c1275ebeb7f1c96c38eaeba37970da3887",
              "draft-pick-fv-v8-1-phase1-6-holdout-rookie-only-scope-hardening.yml":
                  "35ee1a921cf0da9df7084deedbe914fba6d0dbd4",
              "draft-pick-fv-v8-1-phase1-sparse-tail-sensitivity.yml":
                  "45b159791222c01854bb11285a78fe1f15e70437",
              "draft-pick-fv-v8-1-phase2-2024-h2-independent-confirmation-ready.yml":
                  "1f4d2186440f16b829a1e1d4d9ff7f76bde3caad",
              "draft-pick-fv-v8-phase0b-qualified-depth-feasibility-PATCHED.yml":
                  "eb61e2482215dda704768800e5e6b487612740da",
              "draft-pick-fv-v8-phase0c-incremental-r6-rescue-v2.yml":
                  "1b2d4cd23c6efe3fc6d84356cdb0b39d4baf556f",
              "draft-pick-fv-v8-phase0c-incremental-r6-rescue-v3-sharded.yml":
                  "ceeb075bc22425a487ee7ac8cf91c7627e3fb75d",
              "draft-pick-fv-v8-phase0c-incremental-r6-rescue.yml":
                  "e3d7efb678587d163763712b15c4c1c501f838c0",
              "draft-pick-fv-v8-phase0c-local-cell-source-redesign.yml":
                  "b683ee134cb6189f5a78e604c8f50f0dc35e4eda",
              "draft-pick-fv-v8-phase0d-targeted-2018-r6-source-expansion.yml":
                  "1113db7badf63f11b131a41f328f375f60ce6fe2",
              "draft-pick-fv-v8-phase0e-sleeper-second-source-2018-r6-PATCHED.yml":
                  "8e225e06c15a546e611e02627a1cb640ff123535",
              "draft-pick-fv-v8-phase0e-sleeper-second-source-2018-r6.yml":
                  "74526b061b44762d00d397cd572e3733ed369640",
              "draft-pick-fv-v8-phase0f-sleeper-qualified-draft-metadata-audit.yml":
                  "ce683182dfee3b44f0f11a470c77c41f316c8e44",
              "draft-pick-fv-v8-phase0g-sleeper-bridge-upper-bound-closeout-RETRY.yml":
                  "2ff5b88fd3f662198e51ab32c2e4939c8bb16ea4",
              "draft-pick-fv-v8-phase0g-sleeper-bridge-upper-bound-closeout.yml":
                  "1c3f6d23316740754ef52243ba6313729de35560",
              "draft-pick-fv-v8-phase0h-fleaflicker-third-provider-preregistration-RETRY.yml":
                  "182c079d30b882db320a70e86b4f4a0137f756be",
              "draft-pick-fv-v8-phase0h1-fleaflicker-rules-schema-correction-RETRY.yml":
                  "b9142daf75c318d84c4e9ddcb59b6b1ca13d2265",
              "draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe-RETRY.yml":
                  "8330d64f58c6b9c8cbef6dc842825e140929b64a",
              "draft-pick-fv-v8-phase0i-fleaflicker-draft-scope-r6-probe.yml":
                  "f04c71f9e8b3f23e7f9429224027ed74d04a3895",
              "draft-pick-fv-v8-phase0j-source-availability-amendment.yml":
                  "6afe4bee49c64b384f1de40d9b49e818397f7823",
              "draft-pick-fv-v8-phase1-1-position-retention-hardening-RETRY.yml":
                  "835c87fd33d2f7100c6a25dbaefbcb5e4a1d38c7",
              "draft-pick-fv-v8-phase1-1-position-retention-hardening.yml":
                  "835c87fd33d2f7100c6a25dbaefbcb5e4a1d38c7",
              "draft-pick-fv-v8-phase1-incremental-source-identity-freeze.yml":
                  "7685841e5a458657e9777a017b3023ce02658e0f",
              "draft-pick-fv-v8-phase2-historical-outcome-harvest.yml":
                  "a46135a64aa755bdaaa29c3737194ef5ab03714f",
              "draft-pick-fv-v8-phase3-loyo-development-selection.yml":
                  "73700b7f096243126cb4419bba77206f914401ae",
          }

          protected={
              "age-curve-v2-phase5.yml",
              "cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml",
              "durability-v2-phase5.yml",
              "fantasypros-api-pipeline.yml",
              "free-agent-utility-v1-refresh.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "market-edge-v1-prospective-study.yml",
              "no-history-rookie-v2-phase3.yml",
              "opportunity-v2-phase5.yml",
              "package-adjustment-audit-step4-exact-live-oos.yml",
              "package-adjustment-v8-development-voting-activation-v1.yml",
              "package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml",
              "package-adjustment-v8-phase1c-development-catalog-and-audit-v1.yml",
              "package-adjustment-v8-phase1d-fixed50-protocol-amendment-v1.yml",
              "package-adjustment-v8-phase1e-evaluation-engine-freeze-v2.yml",
              "package-adjustment-v8-phase1f-pre-vote-operational-hardening-v2.yml",
              "package-adjustment-v8-phase1f-pre-vote-operational-hardening-v3.yml",
              "position-weight-v2-phase5.yml",
              "prospective-trade-evidence-capture.yml",
              "replacement-level-v2-phase5.yml",
              "repo-regression-checks.yml",
              "research-program-status-v1-current-state-audit.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
              "workflow-folder-cleanup-v9-prep.yml",
          }

          assert len(archive_targets)==29
          assert len(protected)==26
          assert not (set(archive_targets) & protected)

          current={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }
          expected=set(archive_targets)|protected
          if current != expected:
              raise SystemExit(
                  "Active workflow inventory differs from the frozen V9-prep plan.\n"
                  f"Missing: {sorted(expected-current)}\n"
                  f"Unexpected: {sorted(current-expected)}"
              )

          def blob(path):
              return subprocess.check_output(
                  ["git","hash-object",str(path)],text=True
              ).strip()

          def trigger_contract(path):
              doc=yaml.load(
                  Path(path).read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc,dict):
                  raise SystemExit(f"Invalid workflow YAML object: {path}")

              raw=doc.get("on")
              if isinstance(raw,str):
                  return {raw},[],set()
              if isinstance(raw,list):
                  return set(map(str,raw)),[],set()
              if not isinstance(raw,dict):
                  raise SystemExit(
                      f"Unrecognized workflow trigger syntax: {path}: {raw!r}"
                  )

              triggers=set(map(str,raw.keys()))
              push_paths=[]
              push_keys=set()
              if "push" in raw:
                  push=raw["push"]
                  if push is None:
                      push={}
                  if not isinstance(push,dict):
                      raise SystemExit(
                          f"Unexpected push trigger form in {path}: {push!r}"
                      )
                  push_keys=set(map(str,push.keys()))
                  paths=push.get("paths",[])
                  if isinstance(paths,str):
                      push_paths=[paths]
                  elif isinstance(paths,list):
                      push_paths=list(map(str,paths))
                  elif paths is None:
                      push_paths=[]
                  else:
                      raise SystemExit(
                          f"Unexpected push.paths form in {path}: {paths!r}"
                      )
              return triggers,push_paths,push_keys

          allowed_push_paths={
              f".github/workflows/{name}" for name in archive_targets
          }
          rows=[]

          for name,expected_blob in sorted(archive_targets.items()):
              src=workflow_dir/name
              dst=archive_dir/name

              if not src.exists():
                  raise SystemExit(f"Archive target missing: {src}")
              if dst.exists():
                  raise SystemExit(f"Archive destination already exists: {dst}")

              actual_blob=blob(src)
              if actual_blob != expected_blob:
                  raise SystemExit(
                      f"Blob drift for {name}: "
                      f"expected={expected_blob} actual={actual_blob}"
                  )

              triggers,push_paths,push_keys=trigger_contract(src)
              if triggers not in (
                  {"workflow_dispatch"},
                  {"workflow_dispatch","push"},
              ):
                  raise SystemExit(
                      f"Unsupported triggers on archive target {name}: "
                      f"{sorted(triggers)}"
                  )

              if "push" in triggers:
                  if push_keys != {"paths"}:
                      raise SystemExit(
                          f"Push trigger for {name} has unsupported keys: "
                          f"{sorted(push_keys)}"
                      )
                  if not push_paths:
                      raise SystemExit(f"Unscoped push trigger on {name}")
                  escaped=sorted(set(push_paths)-allowed_push_paths)
                  if escaped:
                      raise SystemExit(
                          f"Push paths for {name} escape archive cohort: {escaped}"
                      )

              rows.append({
                  "original_path":str(src),
                  "archive_path":str(dst),
                  "git_blob_sha":actual_blob,
                  "sha256":hashlib.sha256(src.read_bytes()).hexdigest(),
                  "triggers":sorted(triggers),
                  "push_paths":sorted(push_paths),
                  "cleanup_batch":batch,
                  "research_family":(
                      "Draft Pick FV V8.1 completed/closed"
                      if name.startswith("draft-pick-fv-v8-1-")
                      else "Draft Pick FV V8 completed/superseded"
                  ),
              })

          plan={
              "schema_version":9,
              "cleanup_batch":batch,
              "authorization_evidence":{
                  "v8_1_final_closeout_decision":
                      "CLOSE_V8_1_H2_STOP_NO_H3_NO_PRODUCTION",
                  "v8_1_h2_decision":
                      "STOP_V8_1_2024_H2_CONFIRMATION",
                  "v8_1_h3_authorized":False,
                  "v8_1_production_authorized":False,
                  "v9_required_for_future_draft_pick_research":True,
              },
              "active_before_n":len(current),
              "archive_now_n":len(rows),
              "active_after_n":len(protected),
              "protected_active_workflows":sorted(protected),
              "archive_entries":rows,
              "delete_entries":[],
          }

          assert plan["active_before_n"]==55
          assert plan["archive_now_n"]==29
          assert plan["active_after_n"]==26

          Path(".github/workflow-archive/workflow-cleanup-plan.json").write_text(
              json.dumps(plan,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )

          print("PASS: exact active workflow inventory = 55.")
          print("PASS: 29 closed Draft Pick V8/V8.1 workflows authorized for archive.")
          print("PASS: 26 active workflows protected.")
          PY

      - name: Archive exact closed Draft Pick workflows
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan_path=Path(".github/workflow-archive/workflow-cleanup-plan.json")
          plan=json.loads(plan_path.read_text(encoding="utf-8"))

          for row in plan["archive_entries"]:
              src=Path(row["original_path"])
              dst=Path(row["archive_path"])
              dst.parent.mkdir(parents=True,exist_ok=True)

              if not src.exists() or dst.exists():
                  raise SystemExit(
                      f"Unsafe archive move state: "
                      f"src={src.exists()} dst={dst.exists()} {src.name}"
                  )

              src.rename(dst)

              if hashlib.sha256(dst.read_bytes()).hexdigest()!=row["sha256"]:
                  raise SystemExit(f"Post-move hash mismatch: {dst}")

          print(f"PASS: archived {len(plan['archive_entries'])} exact workflows.")
          PY

      - name: Update archive manifest and README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path

          archive_dir=Path(".github/workflow-archive/completed-research")
          plan_path=Path(".github/workflow-archive/workflow-cleanup-plan.json")
          manifest_path=archive_dir/"archive_manifest.json"
          readme_path=archive_dir/"README.md"

          plan=json.loads(plan_path.read_text(encoding="utf-8"))
          old=json.loads(manifest_path.read_text(encoding="utf-8"))

          assert old["archive_workflow_n"]==158
          assert old["last_cleanup_batch"]==(
              "2026-09-26-post-package-v8-phase1b-and-draft-pick-v8"
          )

          by_original={
              row["original_path"]:row
              for row in old.get("archive_entries",[])
          }

          for row in plan["archive_entries"]:
              prior=by_original.get(row["original_path"])
              if prior and prior.get("sha256")!=row["sha256"]:
                  raise SystemExit(
                      f"Archive manifest conflict for {row['original_path']}"
                  )
              by_original[row["original_path"]]=row

          entries=[by_original[k] for k in sorted(by_original)]
          deleted=list(old.get("deleted_obsolete_workflows",[]))

          actual_yaml=sorted(
              p.name for p in archive_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          )
          manifest_yaml=sorted(
              Path(row["archive_path"]).name for row in entries
          )

          if actual_yaml != manifest_yaml:
              raise SystemExit("Archive inventory mismatch after moves.")

          assert len(entries)==187
          assert len(actual_yaml)==187

          now=datetime.now(timezone.utc).isoformat()
          manifest={
              "schema_version":9,
              "last_cleanup_batch":plan["cleanup_batch"],
              "last_cleanup_at_utc":now,
              "last_cleanup_authorization_evidence":
                  plan["authorization_evidence"],
              "archive_workflow_n":len(entries),
              "protected_active_workflow_n":
                  len(plan["protected_active_workflows"]),
              "protected_active_workflows":
                  plan["protected_active_workflows"],
              "archive_entries":entries,
              "deleted_obsolete_workflows":deleted,
          }
          manifest_path.write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",
          )

          lines=[
              "# Completed GitHub Actions Research Workflows",
              "",
              "Completed manual/research workflows are moved out of "
              "`.github/workflows` so the Actions list stays organized.",
              "",
              "Archived YAML files are preserved byte-for-byte. Original paths, "
              "Git blob SHAs, SHA-256 hashes, triggers, and any scoped push paths "
              "are recorded in `archive_manifest.json`.",
              "",
              "Recurring production/data workflows and active research remain "
              "in `.github/workflows`.",
              "",
              f"Archive refreshed: {now}",
              "",
              f"Archived workflow count: **{len(actual_yaml)}**",
              f"Active protected workflow count: "
              f"**{len(plan['protected_active_workflows'])}**",
              "",
              "## Active protected workflows",
              "",
          ]
          lines.extend(
              f"- {name}" for name in plan["protected_active_workflows"]
          )
          lines += ["","## Archived workflows",""]
          lines.extend(f"- {name}" for name in actual_yaml)

          if deleted:
              lines += ["","## Deleted exact obsolete duplicates",""]
              for row in deleted:
                  lines.append(f"- `{row['path']}` — {row['reason']}")

          lines.append("")
          readme_path.write_text("\n".join(lines),encoding="utf-8")
          plan_path.unlink()

          print("PASS: archive manifest updated from 158 to 187 workflows.")
          PY

      - name: Validate final active workflow folder
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          archive_dir=Path(".github/workflow-archive/completed-research")
          manifest=json.loads(
              (archive_dir/"archive_manifest.json").read_text(encoding="utf-8")
          )

          expected=set(manifest["protected_active_workflows"])
          workflow_dir=Path(".github/workflows")
          actual={
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml",".yaml"}
          }

          if actual != expected:
              raise SystemExit(
                  "Final active workflow inventory mismatch.\n"
                  f"Missing={sorted(expected-actual)}\n"
                  f"Unexpected={sorted(actual-expected)}"
              )

          assert len(actual)==26
          assert "workflow-folder-cleanup-v9-prep.yml" in actual
          assert "workflow-folder-cleanup-UPDATED-2026-09-26.yml" not in actual
          assert "workflow-folder-cleanup-UPDATED-2026-09-26-v2.yml" not in actual

          assert not any(name.startswith("draft-pick-fv-v8") for name in actual)
          assert not any(name.startswith("draft-pick-fv-v8-1") for name in actual)

          # Package Adjustment V8 stays live.
          for required in (
              "package-adjustment-v8-development-voting-activation-v1.yml",
              "package-adjustment-v8-outcome-blind-maturity-monitor-v1.yml",
              "package-adjustment-v8-phase1c-development-catalog-and-audit-v1.yml",
              "package-adjustment-v8-phase1d-fixed50-protocol-amendment-v1.yml",
              "package-adjustment-v8-phase1e-evaluation-engine-freeze-v2.yml",
              "package-adjustment-v8-phase1f-pre-vote-operational-hardening-v2.yml",
              "package-adjustment-v8-phase1f-pre-vote-operational-hardening-v3.yml",
          ):
              assert required in actual

          # Every remaining workflow still parses and has a trigger.
          for name in sorted(actual):
              p=workflow_dir/name
              doc=yaml.load(
                  p.read_text(encoding="utf-8"),
                  Loader=yaml.BaseLoader,
              )
              if not isinstance(doc,dict) or not doc.get("name") or "on" not in doc:
                  raise SystemExit(f"Invalid protected workflow: {name}")

          print("PASS: exactly 26 protected workflows remain active.")
          print("PASS: no Draft Pick V8/V8.1 workflow remains active.")
          print("PASS: Package Adjustment V8 remains active.")
          PY

      - name: Run repository regressions
        shell: bash
        run: |
          set -euo pipefail

          TU_JSON="scripts/artifacts/generated/team_utility_lineup_projections.json"
          TU_MD="scripts/artifacts/reports/team_utility_lineup_projection_report.md"

          restore_tu() {
            git checkout -- "$TU_JSON" "$TU_MD"
          }
          trap restore_tu EXIT

          python3 scripts/projections/build_team_utility_lineup_projections.py --write
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          restore_tu
          trap - EXIT

          git diff --exit-code -- "$TU_JSON" "$TU_MD"
          echo "PASS: repository regressions green."

      - name: Prove exact cleanup mutation scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflow-archive/workflow-cleanup-plan.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest=json.loads(
              Path(
                  ".github/workflow-archive/completed-research/archive_manifest.json"
              ).read_text(encoding="utf-8")
          )
          batch="2026-09-28-post-draft-pick-v8-1-closeout-v9-prep"
          rows=[
              row for row in manifest["archive_entries"]
              if row.get("cleanup_batch")==batch
          ]
          assert len(rows)==29

          allowed={
              ".github/workflow-archive/completed-research/README.md",
              ".github/workflow-archive/completed-research/archive_manifest.json",
          }
          for row in rows:
              allowed.add(row["original_path"])
              allowed.add(row["archive_path"])

          status=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],
              text=True,
          )

          touched=set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              raw=line[3:]
              if " -> " in raw:
                  left,right=raw.split(" -> ",1)
                  touched.add(left)
                  touched.add(right)
              else:
                  touched.add(raw)

          unexpected=sorted(touched-allowed)
          if unexpected:
              raise SystemExit(
                  "Cleanup touched unexpected files: "+", ".join(unexpected)
              )

          print(f"PASS: cleanup mutation scope exact ({len(touched)} paths).")
          PY

      - name: Commit V9-prep workflow cleanup
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during cleanup; refusing stale commit."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- .github

          if git diff --cached --name-only | grep -Fxq \
            ".github/workflows/workflow-folder-cleanup-v9-prep.yml"
          then
            echo "ERROR: cleanup workflow modified itself; refusing push."
            exit 1
          fi

          git diff --cached --quiet && {
            echo "ERROR: cleanup produced no staged changes."
            exit 1
          }

          git commit -m "Archive closed Draft Pick V8 and V8.1 workflows for V9"
          git push origin HEAD:main

          echo "PASS: workflow folder organized for Draft Pick V9."
