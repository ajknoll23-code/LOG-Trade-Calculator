name: DLF Prospect FV V1 - Phase 1A2 Deterministic Source Freeze
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v1-phase1a2-deterministic-source-freeze
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  DLF_WORKBOOK_URL: https://docs.google.com/spreadsheets/d/1fwDTd1WnlvPEPGVW8N3Z4zuA0Bft8whkMZTRbMvGDmM/export?format=xlsx
  PHASE1A_RUN_ID: '36077769395'
  PHASE1A_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1a-audit
  PHASE1A_AUDIT_JSON_SHA256: 566f5662b2962786f3a45b7afd5a4b04def610a675b95751dd1dab515bc74169
jobs:
  deterministic-source-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install audit dependencies
      shell: bash
      run: |-
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-cache-dir 'openpyxl==3.1.5' 'requests==2.34.2'
    - name: Guard frozen Phase 1A and No-History lineage
      shell: bash
      run: |-
        set -euo pipefail

        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: frozen lineage drift for $path" >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi
          echo "PASS lineage $path $actual"
        }

        check_blob 25cfd357fb29f006bf1ddaeaa4d0dec09fa27edf \
          .github/workflows/dlf-prospect-fv-v1-phase1a-source-feasibility.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        check_blob a46607b42ad954d00e89b4eb08d9b7bb91c6be0a \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.md
        check_blob 5452d9bcd1d4b23a2f2953601344cae882860bd6 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.json

        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: repository lineage is exact and clean.'
    - name: Download exact green Phase 1A audit artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1A_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1a-audit
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1A_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Reproduce and freeze DLF semantic source
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport\
        \ math\nimport os\nimport time\nfrom collections import Counter\nfrom datetime import date, datetime, time as dtime,\
        \ timezone\nfrom pathlib import Path\nfrom typing import Any\n\nimport openpyxl\nimport requests\nfrom openpyxl import\
        \ Workbook\nfrom openpyxl.styles import Font, PatternFill\n\nroot = Path(os.environ[\"RUNNER_TEMP\"])\naudit_dir =\
        \ root / \"phase1a-audit\"\nout_dir = root / \"dlf-phase1a2\"\nout_dir.mkdir(parents=True, exist_ok=True)\n\nPHASE1A_JSON\
        \ = audit_dir / \"dlf_prospect_fv_v1_phase1a_audit.json\"\nEXPECTED_AUDIT_SHA = os.environ[\"PHASE1A_AUDIT_JSON_SHA256\"\
        ]\nDLF_URL = os.environ[\"DLF_WORKBOOK_URL\"]\n\ndef sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\
        \ndef canonical_json_bytes(obj: Any) -> bytes:\n    return json.dumps(\n        obj,\n        sort_keys=True,\n  \
        \      separators=(\",\", \":\"),\n        ensure_ascii=False,\n    ).encode(\"utf-8\")\n\ndef clean(v: Any) -> str:\n\
        \    return \"\" if v is None else str(v).strip()\n\ndef numeric_int(v: Any):\n    if v is None or v == \"\" or isinstance(v,\
        \ bool):\n        return None\n    try:\n        x = float(v)\n    except (TypeError, ValueError):\n        return\
        \ None\n    if not math.isfinite(x):\n        return None\n    n = int(round(x))\n    return n if abs(x - n) < 1e-9\
        \ else None\n\ndef stable_scalar(v: Any):\n    if v is None:\n        return None\n    if isinstance(v, bool):\n \
        \       return {\"t\": \"bool\", \"v\": v}\n    if isinstance(v, int):\n        return {\"t\": \"int\", \"v\": str(v)}\n\
        \    if isinstance(v, float):\n        if not math.isfinite(v):\n            raise RuntimeError(f\"non-finite workbook\
        \ numeric value: {v!r}\")\n        if v == 0:\n            v = 0.0\n        return {\"t\": \"num\", \"v\": format(v,\
        \ \".15g\")}\n    if isinstance(v, (datetime, date, dtime)):\n        return {\"t\": \"date\", \"v\": v.isoformat()}\n\
        \    s = str(v).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n    return {\"t\": \"str\", \"v\"\
        : s}\n\ndef inspect_workbook(path: Path) -> dict[str, Any]:\n    raw = path.read_bytes()\n    if not raw.startswith(b\"\
        PK\"):\n        raise RuntimeError(\"workbook payload is not XLSX/ZIP\")\n\n    wb = openpyxl.load_workbook(path,\
        \ read_only=True, data_only=True)\n\n    semantic_sheets = []\n    sheet_reports = []\n    all_positions = Counter()\n\
        \    all_years = Counter()\n    total_rows = 0\n\n    for ws in wb.worksheets:\n        preview = []\n        for\
        \ row in ws.iter_rows(\n            min_row=1,\n            max_row=min(ws.max_row or 15, 15),\n            values_only=True,\n\
        \        ):\n            preview.append(list(row))\n\n        header_row = None\n        raw_headers = None\n    \
        \    for i, row in enumerate(preview, 1):\n            texts = [clean(v) for v in row]\n            if {\"Year\",\
        \ \"Position\", \"Player\"}.issubset(set(texts)):\n                header_row = i\n                raw_headers = texts\n\
        \                break\n\n        if header_row is None or raw_headers is None:\n            sheet_reports.append({\n\
        \                \"sheet\": ws.title,\n                \"relevant\": False,\n                \"reason\": \"no Year/Position/Player\
        \ header in first 15 rows\",\n            })\n            continue\n\n        last_named = max(i for i, h in enumerate(raw_headers)\
        \ if h)\n        headers = raw_headers[: last_named + 1]\n        named = [h for h in headers if h]\n\n        if\
        \ len(named) != len(set(named)):\n            raise RuntimeError(f\"{ws.title}: duplicate named headers detected\"\
        )\n\n        index = {h: i for i, h in enumerate(headers) if h}\n        for required in (\"Year\", \"Position\",\
        \ \"Player\"):\n            if required not in index:\n                raise RuntimeError(f\"{ws.title}: missing required\
        \ header {required}\")\n\n        semantic_rows = []\n        pos_counts = Counter()\n        year_counts = Counter()\n\
        \n        for values in ws.iter_rows(min_row=header_row + 1, values_only=True):\n            vals = list(values[:\
        \ len(headers)])\n            if len(vals) < len(headers):\n                vals += [None] * (len(headers) - len(vals))\n\
        \n            year = numeric_int(vals[index[\"Year\"]])\n            player = clean(vals[index[\"Player\"]])\n   \
        \         position = clean(vals[index[\"Position\"]]).upper()\n\n            if year is None or not player:\n    \
        \            continue\n\n            semantic_rows.append([stable_scalar(v) for v in vals])\n            pos_counts[position]\
        \ += 1\n            year_counts[year] += 1\n\n        if not semantic_rows:\n            raise RuntimeError(f\"{ws.title}:\
        \ prospect header found but zero rows\")\n\n        semantic_sheets.append({\n            \"sheet\": ws.title,\n \
        \           \"header_row\": header_row,\n            \"headers\": headers,\n            \"rows\": semantic_rows,\n\
        \        })\n\n        sheet_reports.append({\n            \"sheet\": ws.title,\n            \"relevant\": True,\n\
        \            \"header_row\": header_row,\n            \"row_count\": len(semantic_rows),\n            \"year_min\"\
        : min(year_counts),\n            \"year_max\": max(year_counts),\n            \"year_counts\": dict(sorted(year_counts.items())),\n\
        \            \"position_counts\": dict(sorted(pos_counts.items())),\n            \"column_count\": len(named),\n \
        \           \"columns\": named,\n        })\n\n        total_rows += len(semantic_rows)\n        all_positions.update(pos_counts)\n\
        \        all_years.update(year_counts)\n\n    if not semantic_sheets:\n        raise RuntimeError(\"no relevant prospect\
        \ worksheets found\")\n\n    semantic_payload = {\n        \"format_version\": 1,\n        \"relevant_sheets_in_workbook_order\"\
        : semantic_sheets,\n    }\n\n    semantic_sha = sha256_bytes(canonical_json_bytes(semantic_payload))\n\n    structure\
        \ = {\n        \"worksheet_names\": wb.sheetnames,\n        \"relevant_sheet_count\": len(semantic_sheets),\n    \
        \    \"prospect_row_count_across_relevant_sheets\": total_rows,\n        \"position_counts_across_relevant_sheets\"\
        : dict(sorted(all_positions.items())),\n        \"year_min\": min(all_years),\n        \"year_max\": max(all_years),\n\
        \        \"sheets\": sheet_reports,\n    }\n\n    return {\n        \"raw_sha256\": sha256_bytes(raw),\n        \"\
        semantic_sha256\": semantic_sha,\n        \"semantic_format_version\": 1,\n        \"structure\": structure,\n   \
        \ }\n\ndef assert_phase1a_structure_matches(phase1a: dict[str, Any], current: dict[str, Any]) -> None:\n    old =\
        \ phase1a[\"workbook\"]\n\n    top_checks = (\n        \"worksheet_names\",\n        \"relevant_sheet_count\",\n \
        \       \"prospect_row_count_across_relevant_sheets\",\n        \"position_counts_across_relevant_sheets\",\n    \
        \    \"year_min\",\n        \"year_max\",\n    )\n    for field in top_checks:\n        if old[field] != current[field]:\n\
        \            raise RuntimeError(\n                f\"Phase 1A structural drift for {field}: \"\n                f\"\
        expected={old[field]!r} actual={current[field]!r}\"\n            )\n\n    old_sheets = {\n        s[\"sheet\"]: s\
        \ for s in phase1a[\"sheets\"] if s.get(\"relevant\")\n    }\n    new_sheets = {\n        s[\"sheet\"]: s for s in\
        \ current[\"sheets\"] if s.get(\"relevant\")\n    }\n\n    if set(old_sheets) != set(new_sheets):\n        raise RuntimeError(\n\
        \            f\"Phase 1A relevant-sheet drift: \"\n            f\"expected={sorted(old_sheets)} actual={sorted(new_sheets)}\"\
        \n        )\n\n    for sheet in sorted(old_sheets):\n        for field in (\n            \"header_row\",\n       \
        \     \"row_count\",\n            \"year_min\",\n            \"year_max\",\n            \"position_counts\",\n   \
        \         \"column_count\",\n            \"columns\",\n        ):\n            if old_sheets[sheet][field] != new_sheets[sheet][field]:\n\
        \                raise RuntimeError(\n                    f\"Phase 1A sheet drift {sheet}.{field}: \"\n          \
        \          f\"expected={old_sheets[sheet][field]!r} \"\n                    f\"actual={new_sheets[sheet][field]!r}\"\
        \n                )\n\ndef make_synthetic(\n    path: Path,\n    *,\n    metadata_variant: int,\n    style_variant:\
        \ bool,\n    changed: bool = False,\n    reversed_rows: bool = False,\n):\n    wb = Workbook()\n    ws = wb.active\n\
        \    ws.title = \"QB\"\n    ws.append([\"Year\", \"Position\", \"Player\", \"Overall\", \"Metric\"])\n    rows = [\n\
        \        [2024, \"QB\", \"Alpha Player\", 1, 0.125],\n        [2024, \"QB\", \"Beta Player\", 12, 42],\n    ]\n  \
        \  if reversed_rows:\n        rows.reverse()\n    if changed:\n        rows[0][-1] = 0.126\n    for row in rows:\n\
        \        ws.append(row)\n\n    notes = wb.create_sheet(\"Notes\")\n    notes[\"A1\"] = \"irrelevant formatting-only\
        \ sheet\"\n\n    wb.properties.creator = f\"creator-{metadata_variant}\"\n    wb.properties.created = datetime(2020\
        \ + metadata_variant, 1, 1)\n\n    if style_variant:\n        ws[\"A1\"].font = Font(bold=True, italic=True)\n   \
        \     ws[\"B2\"].fill = PatternFill(\"solid\", fgColor=\"FFFF00\")\n\n    wb.save(path)\n\n# 1) Revalidate exact green\
        \ Phase 1A audit evidence.\naudit_bytes = PHASE1A_JSON.read_bytes()\nactual_audit_sha = sha256_bytes(audit_bytes)\n\
        if actual_audit_sha != EXPECTED_AUDIT_SHA:\n    raise RuntimeError(\n        f\"Phase 1A audit artifact SHA mismatch:\
        \ \"\n        f\"expected={EXPECTED_AUDIT_SHA} actual={actual_audit_sha}\"\n    )\n\nphase1a = json.loads(audit_bytes)\n\
        assert phase1a[\"decision\"] == \"PASS_SOURCE_FEASIBILITY_ONLY_NO_FV_CHANGE\"\nassert phase1a[\"workbook\"][\"worksheet_names\"\
        ] == [\"QB\", \"RB\", \"WR\", \"TE\"]\nassert phase1a[\"workbook\"][\"relevant_sheet_count\"] == 4\nassert phase1a[\"\
        workbook\"][\"prospect_row_count_across_relevant_sheets\"] == 2687\nassert phase1a[\"workbook\"][\"position_counts_across_relevant_sheets\"\
        ] == {\n    \"QB\": 401,\n    \"RB\": 722,\n    \"TE\": 559,\n    \"WR\": 1005,\n}\nassert phase1a[\"workbook\"][\"\
        year_min\"] == 2001\nassert phase1a[\"workbook\"][\"year_max\"] == 2026\nassert phase1a[\"firewalls\"][\"outcomes_read\"\
        ] is False\nassert phase1a[\"firewalls\"][\"model_fit_performed\"] is False\nassert phase1a[\"firewalls\"][\"fundamental_value_changed\"\
        ] is False\nprint(\"PASS: exact green Phase 1A audit artifact revalidated.\")\n\n# 2) Self-test semantic fingerprint\
        \ behavior BEFORE touching live source.\nsynthetic = [root / f\"semantic_selftest_{x}.xlsx\" for x in \"abcd\"]\n\
        make_synthetic(synthetic[0], metadata_variant=1, style_variant=False)\nmake_synthetic(synthetic[1], metadata_variant=2,\
        \ style_variant=True)\nmake_synthetic(synthetic[2], metadata_variant=3, style_variant=True, changed=True)\nmake_synthetic(synthetic[3],\
        \ metadata_variant=4, style_variant=True, reversed_rows=True)\n\nfa, fb, fc, fd = [inspect_workbook(p) for p in synthetic]\n\
        if fa[\"raw_sha256\"] == fb[\"raw_sha256\"]:\n    raise RuntimeError(\"self-test invalid: raw XLSX bytes unexpectedly\
        \ identical\")\nif fa[\"semantic_sha256\"] != fb[\"semantic_sha256\"]:\n    raise RuntimeError(\"semantic hash changed\
        \ from metadata/style-only differences\")\nif fa[\"semantic_sha256\"] == fc[\"semantic_sha256\"]:\n    raise RuntimeError(\"\
        semantic hash failed to detect one-cell data change\")\nif fa[\"semantic_sha256\"] == fd[\"semantic_sha256\"]:\n \
        \   raise RuntimeError(\"semantic hash failed to detect source row-order change\")\nif fa[\"structure\"] != fb[\"\
        structure\"]:\n    raise RuntimeError(\"structure changed from metadata/style-only differences\")\nprint(\"PASS: semantic\
        \ fingerprint self-tests passed.\")\n\nfor p in synthetic:\n    p.unlink(missing_ok=True)\n\n# 3) Download three independent\
        \ live exports.\nsession = requests.Session()\nsession.headers.update({\n    \"User-Agent\": \"LOG-Trade-Calculator\
        \ research audit/1.0\",\n    \"Accept\": \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*\"\
        ,\n    \"Cache-Control\": \"no-cache\",\n    \"Pragma\": \"no-cache\",\n})\n\nlive_paths = []\nfor copy in range(1,\
        \ 4):\n    out = root / f\"dlf_live_copy_{copy}.xlsx\"\n    last = None\n\n    for attempt in range(1, 7):\n     \
        \   try:\n            response = session.get(DLF_URL, timeout=(20, 120), allow_redirects=True)\n            response.raise_for_status()\n\
        \            data = response.content\n            if len(data) < 10_000:\n                raise RuntimeError(f\"DLF\
        \ export unexpectedly small: {len(data)} bytes\")\n            if not data.startswith(b\"PK\"):\n                raise\
        \ RuntimeError(\n                    f\"DLF export is not XLSX/ZIP; \"\n                    f\"content-type={response.headers.get('content-type')!r}\"\
        \n                )\n            out.write_bytes(data)\n            print(\n                f\"PASS: live copy {copy}\
        \ bytes={len(data)} \"\n                f\"raw_sha256={sha256_bytes(data)}\"\n            )\n            break\n \
        \       except Exception as exc:\n            last = exc\n            if attempt == 6:\n                raise\n  \
        \          wait = min(30, 5 * attempt)\n            print(\n                f\"live copy {copy} attempt {attempt}/6\
        \ failed: \"\n                f\"{type(exc).__name__}: {exc}; sleeping {wait}s\"\n            )\n            time.sleep(wait)\n\
        \n    live_paths.append(out)\n    if copy < 3:\n        time.sleep(2)\n\nfps = [inspect_workbook(p) for p in live_paths]\n\
        semantic_hashes = [x[\"semantic_sha256\"] for x in fps]\nraw_hashes = [x[\"raw_sha256\"] for x in fps]\nstructures\
        \ = [x[\"structure\"] for x in fps]\n\nif len(set(semantic_hashes)) != 1:\n    raise RuntimeError(\n        \"DLF\
        \ semantic content changed across three immediate independent downloads: \"\n        + repr(semantic_hashes)\n   \
        \ )\n\nif not (structures[0] == structures[1] == structures[2]):\n    raise RuntimeError(\"DLF workbook structure\
        \ changed across independent downloads\")\n\n# 4) Require exact structural continuity with green Phase 1A.\nassert_phase1a_structure_matches(phase1a,\
        \ structures[0])\n\nsemantic_sha = semantic_hashes[0]\nstructure_sha = sha256_bytes(canonical_json_bytes(structures[0]))\n\
        \nfreeze = {\n    \"schema_version\": 1,\n    \"study_id\": \"dlf-prospect-fv-v1\",\n    \"phase\": \"1A2_deterministic_source_freeze\"\
        ,\n    \"decision\": \"FREEZE_SEMANTIC_SOURCE_CONTENT_NO_FV_CHANGE\",\n    \"generated_at_utc\": datetime.now(timezone.utc).isoformat(),\n\
        \    \"source\": {\n        \"provider\": \"Dynasty League Football\",\n        \"workbook_url\": DLF_URL,\n     \
        \   \"semantic_format_version\": 1,\n        \"semantic_sha256\": semantic_sha,\n        \"structure_sha256\": structure_sha,\n\
        \        \"three_independent_raw_sha256\": raw_hashes,\n        \"raw_xlsx_sha_is_scientific_freeze_key\": False,\n\
        \        \"semantic_sha_is_scientific_freeze_key\": True,\n    },\n    \"phase1a_lineage\": {\n        \"run_id\"\
        : int(os.environ[\"PHASE1A_RUN_ID\"]),\n        \"artifact_name\": os.environ[\"PHASE1A_ARTIFACT_NAME\"],\n      \
        \  \"audit_json_sha256\": EXPECTED_AUDIT_SHA,\n        \"phase1a_raw_xlsx_sha256\": phase1a[\"source\"][\"workbook_sha256\"\
        ],\n        \"phase1a_structure_exactly_reproduced\": True,\n        \"cell_content_identity_to_phase1a_proven\":\
        \ False,\n        \"reason_cell_identity_not_proven\": (\n            \"Phase 1A stored only a raw XLSX container\
        \ SHA, which proved unstable \"\n            \"across Google Sheets exports. Therefore Phase 1A remains the feasibility\
        \ \"\n            \"audit and Phase 1A2 establishes the first deterministic cell-content freeze.\"\n        ),\n \
        \   },\n    \"reproducibility\": {\n        \"independent_live_downloads\": 3,\n        \"semantic_hashes\": semantic_hashes,\n\
        \        \"semantic_hashes_all_equal\": True,\n        \"structures_all_equal\": True,\n        \"semantic_selftest_same_cells_metadata_style_invariant\"\
        : True,\n        \"semantic_selftest_cell_change_detected\": True,\n        \"semantic_selftest_row_order_change_detected\"\
        : True,\n    },\n    \"workbook_structure\": structures[0],\n    \"firewalls\": {\n        \"nfl_outcomes_read\":\
        \ False,\n        \"current_fv_read_for_selection\": False,\n        \"ktc_read\": False,\n        \"dlf_adp_read\"\
        : False,\n        \"dlf_rankings_read\": False,\n        \"dlf_trade_values_read\": False,\n        \"model_fit_performed\"\
        : False,\n        \"feature_selection_performed\": False,\n        \"production_change_authorized\": False,\n    },\n\
        \    \"next_phase_contract\": {\n        \"phase\": \"1B_identity_and_preregistration\",\n        \"required_source_semantic_sha256\"\
        : semantic_sha,\n        \"required_source_structure_sha256\": structure_sha,\n        \"raw_xlsx_sha_must_not_be_used_as_freeze_key\"\
        : True,\n    },\n}\n\njson_path = out_dir / \"dlf_prospect_fv_v1_phase1a2_source_freeze.json\"\nmd_path = out_dir\
        \ / \"dlf_prospect_fv_v1_phase1a2_source_freeze.md\"\n\njson_path.write_text(json.dumps(freeze, indent=2, sort_keys=True)\
        \ + \"\\n\")\n\nmd_lines = [\n    \"# DLF Prospect FV V1 \u2014 Phase 1A2 Deterministic Source Freeze\",\n    \"\"\
        ,\n    \"**Decision:** `FREEZE_SEMANTIC_SOURCE_CONTENT_NO_FV_CHANGE`\",\n    \"\",\n    f\"- Semantic workbook SHA-256:\
        \ `{semantic_sha}`\",\n    f\"- Structural SHA-256: `{structure_sha}`\",\n    \"- Independent live downloads: **3**\"\
        ,\n    \"- Semantic hashes identical across all 3: **yes**\",\n    \"- Green Phase 1A structure reproduced exactly:\
        \ **yes**\",\n    f\"- Prospect rows: **{structures[0]['prospect_row_count_across_relevant_sheets']}**\",\n    f\"\
        - Positions: **{structures[0]['position_counts_across_relevant_sheets']}**\",\n    f\"- Year span: **{structures[0]['year_min']}\u2013\
        {structures[0]['year_max']}**\",\n    \"\",\n    \"## Scientific correction\",\n    \"\",\n    \"Phase 1A remains\
        \ the source-feasibility audit. Its raw XLSX SHA is not used \"\n    \"as the scientific freeze key because Google\
        \ Sheets can regenerate XLSX \"\n    \"container bytes independently of spreadsheet cell content.\",\n    \"\",\n\
        \    \"Phase 1A did not preserve a semantic cell-content hash, so exact cell-content \"\n    \"identity between the\
        \ Phase 1A instant and Phase 1A2 cannot be claimed. \"\n    \"Phase 1A2 therefore establishes the first deterministic\
        \ source-content freeze \"\n    \"before any outcome data, feature selection, or model fitting.\",\n    \"\",\n  \
        \  \"## Reproducibility tests\",\n    \"\",\n    \"- Metadata/style-only XLSX changes preserve the semantic hash.\"\
        ,\n    \"- One changed cell changes the semantic hash.\",\n    \"- Changed source row order changes the semantic hash.\"\
        ,\n    \"- Three independent live downloads reproduced the same semantic hash.\",\n    \"\",\n    \"## Firewall\"\
        ,\n    \"\",\n    \"No NFL outcomes, current FV selection signal, KTC, DLF ADP, DLF rankings, \"\n    \"DLF trade\
        \ values, feature selection, or model fitting were used. \"\n    \"No production change is authorized.\",\n    \"\"\
        ,\n    \"## Next gate\",\n    \"\",\n    f\"Phase 1B must reproduce semantic SHA `{semantic_sha}` and structural SHA\
        \ \"\n    f\"`{structure_sha}` before identity or feature-preregistration work proceeds.\",\n    \"\",\n]\nmd_path.write_text(\"\
        \\n\".join(md_lines))\n\nfor p in live_paths:\n    p.unlink(missing_ok=True)\n\nprint(json.dumps({\n    \"decision\"\
        : freeze[\"decision\"],\n    \"semantic_sha256\": semantic_sha,\n    \"structure_sha256\": structure_sha,\n    \"\
        raw_sha256_copies\": raw_hashes,\n    \"raw_hashes_distinct_n\": len(set(raw_hashes)),\n    \"semantic_reproductions\"\
        : 3,\n    \"prospect_rows\": structures[0][\"prospect_row_count_across_relevant_sheets\"],\n    \"position_counts\"\
        : structures[0][\"position_counts_across_relevant_sheets\"],\n    \"year_min\": structures[0][\"year_min\"],\n   \
        \ \"year_max\": structures[0][\"year_max\"],\n    \"outcomes_read\": False,\n    \"model_fit_performed\": False,\n\
        }, indent=2))\nPY"
    - name: Prove source freeze made no repository changes
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: deterministic source freeze is research-only and repo-clean.'
    - name: Destroy temporary raw source copies
      if: always()
      shell: bash
      run: |-
        rm -f \
          "${RUNNER_TEMP}/dlf_live_copy_1.xlsx" \
          "${RUNNER_TEMP}/dlf_live_copy_2.xlsx" \
          "${RUNNER_TEMP}/dlf_live_copy_3.xlsx" \
          "${RUNNER_TEMP}/semantic_selftest_a.xlsx" \
          "${RUNNER_TEMP}/semantic_selftest_b.xlsx" \
          "${RUNNER_TEMP}/semantic_selftest_c.xlsx" \
          "${RUNNER_TEMP}/semantic_selftest_d.xlsx"
    - name: Upload deterministic source-freeze evidence only
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v1-phase1a2-source-freeze
        path: |-
          ${{ runner.temp }}/dlf-phase1a2/dlf_prospect_fv_v1_phase1a2_source_freeze.json
          ${{ runner.temp }}/dlf-phase1a2/dlf_prospect_fv_v1_phase1a2_source_freeze.md
        if-no-files-found: error
        retention-days: 14
