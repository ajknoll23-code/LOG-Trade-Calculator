name: B48 V2 Workflow Folder Cleanup - Post B47 and FA Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SELF_WORKFLOW: B48-v2-workflow-folder-cleanup-post-b47.yml
  ARCHIVE_TARGETS_JSON: '["A-B44-player-role-engine-v2-v1r1-dob-position-adoption-acceptance-reaudit-v1r1-source-currency-freeze-repair-candidate.yml","A-B44-v1r1.yml","A-B44W4-v1.yml","A-B44W4-v1r1.yml","B10F-package-adjustment-v9-prospective-ux-latency-preview-amendment-v2-scoped-transport-order-repair.yml","B10G-package-adjustment-v9-prospective-pseudonym-salt-continuity-amendment-v1.yml","B2C-package-adjustment-v8-outcome-blind-maturity-monitor-v5-slot44-reset.yml","B45-v1r1.yml","B45-v1r2.yml","B45-v1r3.yml","B45-v1r5.yml","B45-v1r6.yml","B46W4-v1r1.yml","B46W4-v2.yml","B46W4-v2r1.yml","B47-v3-free-agent-utility-v1-weekly-4for4-source-refresh-repair.yml","B47-v4r1-free-agent-utility-v1-weekly-4for4-source-refresh-repair.yml","B47-v4r2-free-agent-utility-v1-weekly-4for4-source-refresh-repair.yml","free-agent-utility-v1-regression-guard-repair.yml","B48-v2-workflow-folder-cleanup-post-b47.yml"]'
  PROTECTED_FINAL_JSON: '["B10E-package-adjustment-v9-voter-url-issuance-and-distribution-logger-v2-stdlib-squat-resilience-repair.yml","B34D-package-trade-evidence-future-structural-maturity-monitor.yml","B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml","B46-v1r1.yml","age-curve-v2-phase5.yml","cross-position-apex-calibration-v1-phase2-cross-study-reconciliation.yml","durability-v2-phase5.yml","fantasypros-api-pipeline.yml","free-agent-utility-v1-refresh.yml","idp-dl-lb-phase2.yml","ktc-vote-aggregation.yml","ktc_voter_balance_prospective.yml","market-edge-v1-prospective-study.yml","no-history-rookie-v2-phase3.yml","opportunity-v2-phase5.yml","package-adjustment-audit-step4-exact-live-oos.yml","position-weight-v2-phase5.yml","prospective-trade-evidence-capture.yml","replacement-level-v2-phase5.yml","repo-regression-checks.yml","research-program-status-v1-current-state-audit.yml","scheduled-data-refresh.yml","sync-sleeper.yml"]'
  TARGET_BLOB_SHAS_JSON: '{"A-B44-player-role-engine-v2-v1r1-dob-position-adoption-acceptance-reaudit-v1r1-source-currency-freeze-repair-candidate.yml":"a4a566fd5d907e8a66786a7cbb5001914a748753","A-B44-v1r1.yml":"a4a566fd5d907e8a66786a7cbb5001914a748753","A-B44W4-v1.yml":"948b7e45f6b58d6ca770376f03c32f26b8a09dba","A-B44W4-v1r1.yml":"c31737b4c3bd8c96a36dd1616a18d97240df4010","B10F-package-adjustment-v9-prospective-ux-latency-preview-amendment-v2-scoped-transport-order-repair.yml":"6db93f68056106e5c7fbf80456105b41b36ee61b","B10G-package-adjustment-v9-prospective-pseudonym-salt-continuity-amendment-v1.yml":"83a337186ee85bc5e11be439ce19d5b3131bb08a","B2C-package-adjustment-v8-outcome-blind-maturity-monitor-v5-slot44-reset.yml":"42ea19ada6a4ef209485ebc2f4cdf5c8f3fe81a2","B45-v1r1.yml":"6d3a9a584f0318dac8ac65aabebf91c5b291378f","B45-v1r2.yml":"3edb4e7055d782b61794d89b73d5ac6e870e31b8","B45-v1r3.yml":"0f6a285a93a35a0fa7faa47b683f6853e3f077b0","B45-v1r5.yml":"a2ceb0a9f6fec626bfd7c9b62ecc6cf469b068d8","B45-v1r6.yml":"e2c84601ce18288ad974cdaffd92418c171a995b","B46W4-v1r1.yml":"129ce6fa2f8e6653a2072bd7ca64ecabd563f25e","B46W4-v2.yml":"a2dc60709576aa2ed6ffee357386e0f58e56e1e0","B46W4-v2r1.yml":"e0455b84a8bb3e9a7df4ed93c8ab2e2505c8ca2c","B47-v3-free-agent-utility-v1-weekly-4for4-source-refresh-repair.yml":"dd9e421321c2d0029657ee6cd0daa332ae8e4525","B47-v4r1-free-agent-utility-v1-weekly-4for4-source-refresh-repair.yml":"89926c5a846ef8d37b2eeb694b30631453beddc2","B47-v4r2-free-agent-utility-v1-weekly-4for4-source-refresh-repair.yml":"6b76c7ab1bf7320e86b98b6006f39cbb02586985","free-agent-utility-v1-regression-guard-repair.yml":"8c4e74fcefb1ef9bb6cc7f9f84db4eaba15d476d"}'
  OLD_FA_REFRESH: free-agent-utility-v1-refresh.yml
  NEW_FA_REFRESH: free-agent-utility-v1-refresh-final.yml
  OLD_FA_ARCHIVE_NAME: free-agent-utility-v1-refresh-pre-b47-source-pin.yml

jobs:
  cleanup:
    name: Archive completed workflows and canonicalize FA refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require workflow push token
        shell: bash
        env:
          WORKFLOW_PUSH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${WORKFLOW_PUSH_TOKEN:-}" || {
            echo "ERROR: WORKFLOW_PUSH_TOKEN secret is missing." >&2
            exit 1
          }
          echo "PASS: workflow push token secret is present."

      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN }}

      - name: Capture starting main
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cleanup dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "PyYAML==6.0.2"

      - name: Guard exact pre-cleanup workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          W = Path(".github/workflows")
          archive_targets = set(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
          protected = set(json.loads(os.environ["PROTECTED_FINAL_JSON"]))

          current = {
              p.name for p in W.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }

          # Before cleanup, both the old canonical FA refresh and the newly
          # approved "-final" copy exist. The old canonical path is already
          # represented in protected because that is the final path we want.
          expected = archive_targets | protected | {os.environ["NEW_FA_REFRESH"]}

          if current != expected:
              raise SystemExit(
                  "Workflow inventory changed from frozen B48 cleanup plan.\n"
                  f"Missing: {sorted(expected-current)}\n"
                  f"Unexpected: {sorted(current-expected)}"
              )

          assert len(current) == 44, len(current)
          assert len(archive_targets) == 20, len(archive_targets)
          assert len(protected) == 23, len(protected)
          assert os.environ["SELF_WORKFLOW"] in archive_targets

          # The two FA refresh files must be exactly the versions reviewed.
          def blob(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          old = W / os.environ["OLD_FA_REFRESH"]
          new = W / os.environ["NEW_FA_REFRESH"]
          assert blob(old) == "a0f94cd15fc7e5e5cf17119c8dc792aff16d415f", blob(old)
          assert blob(new) == "7c2cc4e231438dc71e3afae5bc86fb1911ab31ba", blob(new)

          print("PASS: exact pre-cleanup inventory = 44 workflows including B48 V2.")
          print("PASS: old and approved-final FA refresh files are exact.")
          PY

      - name: Guard archive targets are exact completed manual workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import yaml

          W = Path(".github/workflows")
          targets = list(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
          shas = dict(json.loads(os.environ["TARGET_BLOB_SHAS_JSON"]))
          self_name = os.environ["SELF_WORKFLOW"]

          def blob(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def triggers(path):
              doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              value = doc.get("on")
              if isinstance(value, str):
                  return {value}
              if isinstance(value, list):
                  return set(value)
              if isinstance(value, dict):
                  return set(value)
              raise SystemExit(f"Unknown trigger structure in {path}: {value!r}")

          for name in targets:
              path = W / name
              assert path.is_file(), name
              if name != self_name:
                  expected = shas[name]
                  actual = blob(path)
                  assert actual == expected, (name, expected, actual)
              assert triggers(path) == {"workflow_dispatch"}, (name, sorted(triggers(path)))

          assert set(shas) == set(targets) - {self_name}
          print("PASS: 19 existing completed/superseded targets are exact.")
          print("PASS: B48 V2 and every archive target are manual-only.")
          PY

      - name: Guard protected active workflow surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          W = Path(".github/workflows")
          protected = set(json.loads(os.environ["PROTECTED_FINAL_JSON"]))

          required = {
              "B10E-package-adjustment-v9-voter-url-issuance-and-distribution-logger-v2-stdlib-squat-resilience-repair.yml",
              "B34D-package-trade-evidence-future-structural-maturity-monitor.yml",
              "B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml",
              "B46-v1r1.yml",
              "free-agent-utility-v1-refresh.yml",
              "idp-dl-lb-phase2.yml",
              "ktc-vote-aggregation.yml",
              "ktc_voter_balance_prospective.yml",
              "market-edge-v1-prospective-study.yml",
              "prospective-trade-evidence-capture.yml",
              "repo-regression-checks.yml",
              "scheduled-data-refresh.yml",
              "sync-sleeper.yml",
          }
          assert required <= protected

          for name in sorted(protected):
              path = W / name
              assert path.is_file(), name
              doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(doc, dict), name
              assert isinstance(doc.get("jobs"), dict) and doc["jobs"], name

          print("PASS: 23 final active workflows are explicitly protected.")
          print("PASS: Week 5 role acceptance, weekly studies, Package V9 URL issuance, and production maintenance remain active.")
          PY

      - name: Pre-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Canonicalize permanent Free Agent Utility refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path

          W = Path(".github/workflows")
          A = Path(".github/workflow-archive/completed-research")
          A.mkdir(parents=True, exist_ok=True)

          old = W / os.environ["OLD_FA_REFRESH"]
          new = W / os.environ["NEW_FA_REFRESH"]
          archived_old = A / os.environ["OLD_FA_ARCHIVE_NAME"]

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def blob(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          assert blob(old) == "a0f94cd15fc7e5e5cf17119c8dc792aff16d415f"
          assert blob(new) == "7c2cc4e231438dc71e3afae5bc86fb1911ab31ba"

          old_sha256 = sha256(old)
          new_sha256 = sha256(new)

          if archived_old.exists():
              assert sha256(archived_old) == old_sha256, (
                  "archive collision for old FA refresh",
                  sha256(archived_old),
                  old_sha256,
              )
              old.unlink()
          else:
              shutil.move(str(old), str(archived_old))
              assert sha256(archived_old) == old_sha256

          shutil.move(str(new), str(old))
          assert sha256(old) == new_sha256
          assert blob(old) == "7c2cc4e231438dc71e3afae5bc86fb1911ab31ba"
          assert not new.exists()

          text = old.read_text(encoding="utf-8")
          required = [
              'c1fb62c1c04b4b539fa74bff4ee038ec1a4cccc1',
              'bc30ff0bec940e06e8a358f7dc797434463b4684',
              '1bb87f685c00e51a488a0c21510ccdca452e6b72',
              'PHASE2_QUALIFICATION_COVERAGE_REFERENCE = 0.50',
              'test "$(git diff --name-only HEAD~1 HEAD)" = "data/free_agent_utility_v1.json"',
          ]
          for marker in required:
              assert marker in text, marker

          meta = {
              "old_canonical_path": str(archived_old),
              "old_canonical_blob": "a0f94cd15fc7e5e5cf17119c8dc792aff16d415f",
              "old_canonical_sha256": old_sha256,
              "new_canonical_path": str(old),
              "approved_final_blob": "7c2cc4e231438dc71e3afae5bc86fb1911ab31ba",
              "approved_final_sha256": new_sha256,
          }
          Path("$RUNNER_TEMP")
          (Path(os.environ["RUNNER_TEMP"]) / "b48_fa_canonicalization.json").write_text(
              json.dumps(meta, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS: approved permanent FA refresh canonicalized to free-agent-utility-v1-refresh.yml.")
          print("PASS: old pre-B47 source-pinned refresh preserved in archive.")
          PY

      - name: Archive completed and superseded workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          W = Path(".github/workflows")
          A = Path(".github/workflow-archive/completed-research")
          A.mkdir(parents=True, exist_ok=True)
          targets = sorted(json.loads(os.environ["ARCHIVE_TARGETS_JSON"]))
          protected = sorted(json.loads(os.environ["PROTECTED_FINAL_JSON"]))
          moved = []

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def blob(path):
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          for name in targets:
              src = W / name
              dst = A / name
              assert src.is_file(), f"Archive target missing: {src}"

              before_sha256 = sha256(src)
              before_blob = blob(src)

              if dst.exists():
                  existing_sha256 = sha256(dst)
                  if existing_sha256 != before_sha256:
                      raise SystemExit(
                          f"Archive collision with different bytes: {dst}\n"
                          f"source_sha256={before_sha256}\n"
                          f"archive_sha256={existing_sha256}"
                      )
                  src.unlink()
                  action = "source_removed_existing_identical_archive"
              else:
                  shutil.move(str(src), str(dst))
                  assert sha256(dst) == before_sha256
                  action = "moved_to_archive"

              moved.append({
                  "filename": name,
                  "git_blob_sha": before_blob,
                  "sha256": before_sha256,
                  "action": action,
                  "archive_path": str(dst),
              })

          fa_meta = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "b48_fa_canonicalization.json")
              .read_text(encoding="utf-8")
          )

          batch = {
              "schema_version": 1,
              "batch_id": "2026-10-07-b48-post-b47-fa-refresh-cleanup",
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "pre_cleanup_active_count_including_b48": 44,
              "archived_completed_or_superseded_count": len(moved),
              "archived_old_fa_refresh_count": 1,
              "post_cleanup_active_count": len(protected),
              "self_archived": os.environ["SELF_WORKFLOW"],
              "protected_active_workflows": protected,
              "fa_refresh_canonicalization": fa_meta,
              "reason": (
                  "Archive completed/superseded Player Role B44/B45/Week4 paths, "
                  "closed Package V8 monitor, completed Package V9 amendments, "
                  "B47 repair scaffolding, and obsolete FA repair workflow; "
                  "preserve all active recurring/prospective/Week5 workflows and "
                  "canonicalize the Claude-approved permanent FA refresh."
              ),
              "entries": moved,
          }

          manifest = A / "cleanup_batch_2026-10-07_b48.json"
          manifest.write_text(
              json.dumps(batch, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          assert len(moved) == 20
          print("PASS: archived 20 completed/superseded workflows, including B48 V2 itself.")
          print("PASS: one obsolete pre-B47 FA refresh separately preserved.")
          print(f"PASS: cleanup batch manifest written: {manifest}")
          PY

      - name: Validate final active workflow surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import yaml

          W = Path(".github/workflows")
          A = Path(".github/workflow-archive/completed-research")
          protected = set(json.loads(os.environ["PROTECTED_FINAL_JSON"]))

          active = {
              p.name for p in W.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          assert active == protected, (
              f"Unexpected active: {sorted(active-protected)}",
              f"Missing protected: {sorted(protected-active)}",
          )
          assert len(active) == 23, len(active)

          for name in sorted(active):
              doc = yaml.safe_load((W / name).read_text(encoding="utf-8"))
              assert isinstance(doc, dict), name
              assert isinstance(doc.get("jobs"), dict) and doc["jobs"], name

          assert not (W / os.environ["SELF_WORKFLOW"]).exists()
          assert (A / os.environ["SELF_WORKFLOW"]).is_file()
          assert not (W / os.environ["NEW_FA_REFRESH"]).exists()
          assert (W / os.environ["OLD_FA_REFRESH"]).is_file()
          assert (A / os.environ["OLD_FA_ARCHIVE_NAME"]).is_file()

          # Prove the permanent FA workflow now occupies the canonical path.
          actual = subprocess.check_output(
              ["git", "hash-object", str(W / os.environ["OLD_FA_REFRESH"])],
              text=True,
          ).strip()
          assert actual == "7c2cc4e231438dc71e3afae5bc86fb1911ab31ba", actual

          print("PASS: final active workflow inventory = 23.")
          print("PASS: cleanup workflow archived itself.")
          print("PASS: approved FA refresh is now the sole canonical active refresh workflow.")
          print("PASS: all remaining active YAML files parse and contain jobs.")
          PY

      - name: Post-cleanup repository regression proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Prove cleanup-only mutation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          touched = [line[3:] for line in raw.splitlines() if line.strip()]
          assert touched, touched

          assert all(
              p.startswith(".github/workflows/")
              or p.startswith(".github/workflow-archive/completed-research/")
              for p in touched
          ), touched

          forbidden = (
              "index.html",
              "free-agent-board.html",
          )
          assert not any(
              p in forbidden
              or p.startswith(("data/", "model/", "scripts/", "research/"))
              for p in touched
          ), touched

          print("PASS: mutation scope is workflow/archive only.")
          PY

      - name: Commit workflow cleanup atomically
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during cleanup; refusing non-atomic push."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows .github/workflow-archive/completed-research
          git diff --cached --check

          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          if echo "$staged" | grep -Ev '^\.github/(workflows|workflow-archive/completed-research)/' | grep -q .; then
            echo "ERROR: cleanup staged a non-workflow/archive path." >&2
            echo "$staged" >&2
            exit 1
          fi

          git commit -m "B48 V2 archive completed workflows after B47 repair"
          git push origin HEAD:main

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          echo "PASS: B48 workflow cleanup committed atomically."

      - name: Closeout
        shell: bash
        run: |
          set -euo pipefail
          echo "=== B48 V2 WORKFLOW CLEANUP COMPLETE ==="
          echo "Active workflows before B48 upload: 43"
          echo "B48 V2 added for cleanup run: 1"
          echo "Completed/superseded workflows archived in target batch: 20"
          echo "Old pre-B47 FA refresh additionally archived: 1"
          echo "Approved FA refresh canonicalized: 1"
          echo "Active workflows remaining: 23"
          echo "Completed workflow history preserved under .github/workflow-archive/completed-research/"
