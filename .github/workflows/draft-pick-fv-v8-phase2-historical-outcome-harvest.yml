name: Draft Pick FV V8 - Phase 2 Historical Outcome Harvest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/draft-pick-fv-v8-phase2-historical-outcome-harvest.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: draft-pick-fv-v8-phase2-historical-outcome-harvest
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Check out exact study base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Verify frozen repository contracts
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD:research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json)" = \
            "42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"

          test "$(git rev-parse HEAD:research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json)" = \
            "b52aca0a7a0313c35065850273f80e9df684fe2d"

          test "$(git rev-parse HEAD:research/roster-economics/historical_weekly_points_pipeline.py)" = \
            "d6d6c6b4c2725eca3aae46f6c32dcc6ae8633ace"

          test "$(git rev-parse HEAD:scripts/validation/snapshot_values.py)" = \
            "1efca4c35e910a95974c1bec0b06a106196618b3"

          python3 - <<'PY'
          import json
          from pathlib import Path

          v7=json.loads(Path("research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json").read_text())
          v5=json.loads(Path("research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json").read_text())

          assert v7["status"]=="FROZEN_PRE_V7_SOURCE_EXPANSION_PRE_OUTCOME"
          assert v7["decision"]=="FREEZE_V7_R1_R6_FULL_SCALE_PREREGISTRATION_SOURCE_FREEZE_NEXT"
          assert v7["cell_definition"]["production_cell_n"]==18
          assert v7["cell_definition"]["required_pick_slots"]=="overall slots 1-72 inclusive"
          assert v7["fit_weighting"]=={
              "cell_weight":"18 R1-R6 production cells receive equal macro weight",
              "draft_class_weight":"each 2018-2023 development class contributes equal total weight",
              "league_weight":"within class and cell, frozen eligible leagues receive equal total weight",
              "occurrence_weight":"retained occurrences divide their league-cell weight equally",
              "player_independence":"repeated selections of the same rookie are not independent; inferential resampling clusters by stable player identity within draft class",
          }

          src=v7["source_and_identity_contract"]
          assert src["invalid_occurrence_rule"]=="Omit and flag invalid/nonplayer occurrences; do not requalify source membership after outcomes are seen."
          assert src["minimum_occurrence_retention"]==0.95
          assert src["minimum_year_cell_retention"]==0.95
          assert src["target_position_rule"]=="Prefer frozen draft-era source position; current Sleeper position must not redefine historical rookie position."
          assert src["replacement_pool_position_rule"]=="Use season-appropriate nflverse roster position by stable player identity; never current-position snapshots."
          assert src["manual_post_outcome_identity_adjudication_allowed"] is False

          h=v7["historical_outcome_contract"]
          assert h["provider"]=="Sleeper historical weekly NFL stats"
          assert h["weeks"]==list(range(1,19))
          assert h["O2_scale"]["base_scale"]==5500
          assert h["O2_scale"]["role"]=="Starter"
          assert h["frozen_replacement_ranks"]=={
              "QB":29,"RB":25,"WR":28,"TE":11,"DL":16,"LB":28,"DB":22,
          }
          assert h["frozen_position_weights"]=={
              "QB":1.3,"RB":0.89,"WR":1,"TE":0.82,"DL":0.93,"LB":1.12,"DB":0.87,
          }
          assert h["scheduled_games"]=={
              "through_2020":16,
              "2021_and_later":17,
          }

          assert v5["status"]=="FROZEN_PRE_OUTCOME"
          b=v5["frozen_scale_bridge"]
          assert float(b["base_scale"])==5500.0
          assert b["position_weight"]==h["frozen_position_weights"]
          assert v5["frozen_replacement_ranks"]==h["frozen_replacement_ranks"]

          print("PASS: V7 R1-R6 outcome/weighting contract and V5 scale constants verified.")
          PY

      - name: Download and verify exact Phase 1.1 corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p1_1" "${RUNNER_TEMP}/lineage" "${RUNNER_TEMP}/engine"

          RUN_ID="36467064097"
          ARTIFACT_ID="10990665019"
          EXPECTED_DIGEST="sha256:6d480ea3fbb5db254e3271b9c400d62e136bb34877aff6b181ca5ed7252247b0"

          ACTUAL_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest // ""')"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p1-1-position-retention-hardening" \
            -D "${RUNNER_TEMP}/p1_1"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          p=Path(os.environ["RUNNER_TEMP"])/"p1_1"
          s=json.loads((p/"v8_phase1_1_position_retention_hardening.json").read_text())
          m=json.loads((p/"v8_phase1_1_position_retention_hardening_manifest.json").read_text())
          rows=p/"v8_phase1_1_position_retention_occurrences.jsonl"

          assert s["decision"]=="PROCEED_TO_V8_PHASE2_HISTORICAL_OUTCOME_HARVEST"
          assert s["status"]=="FROZEN_PRE_HISTORICAL_OUTCOME_ACCESS"
          assert s["retention"]["retained_occurrence_n"]==24970
          assert s["retention"]["retained_unique_target_n"]==929
          assert s["retention"]["source_membership_group_n"]==6247
          assert s["retention"]["all_108_year_cells_pass"] is True
          assert s["identity"]["retained_identity_coverage"]==1.0
          assert s["identity"]["retained_sleeper_ready_coverage"]==1.0
          assert s["identity"]["all_retained_positions_supported"] is True
          assert s["sparse_2018_r6_occurrence_n"]==72
          assert s["historical_player_outcomes_read"] is False
          assert s["historical_outcome_ingestion_authorized"] is True
          assert s["holdout_2024_outcomes_read"] is False
          assert s["candidate_fit_performed"] is False
          assert s["production_change_authorized"] is False

          assert m["decision"]==s["decision"]
          assert m["retained_occurrence_n"]==24970
          assert m["retained_unique_target_n"]==929
          assert m["source_membership_group_n"]==6247
          assert m["historical_player_outcomes_read"] is False
          assert m["historical_outcome_ingestion_authorized"] is True
          assert m["holdout_2024_outcomes_read"] is False
          assert m["candidate_fit_performed"] is False
          assert m["production_change_authorized"] is False

          digest=hashlib.sha256(rows.read_bytes()).hexdigest()
          assert digest==m["retained_occurrences_sha256"],(digest,m["retained_occurrences_sha256"])
          assert sum(1 for line in rows.open() if line.strip())==24970

          print("PASS: exact Phase 1.1 24,970-occurrence corpus verified.")
          PY

      - name: Pin nflverse player and historical season-roster lineage
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${RUNNER_TEMP}/lineage"
          PLAYERS_URL="https://github.com/nflverse/nflverse-data/releases/download/players/players.csv"
          PLAYERS_SHA="4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
          DP_URL="https://raw.githubusercontent.com/dynastyprocess/data/692c23d639542d6e9e94ba3898ed978a0b772724/files/db_playerids.csv"
          DP_SHA="0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"

          curl -fL --retry 6 --retry-all-errors --retry-delay 5 "$PLAYERS_URL" -o "$ROOT/players.csv"
          curl -fL --retry 6 --retry-all-errors --retry-delay 5 "$DP_URL" -o "$ROOT/db_playerids.csv"

          test "$(sha256sum "$ROOT/players.csv" | awk '{print $1}')" = "$PLAYERS_SHA"
          test "$(sha256sum "$ROOT/db_playerids.csv" | awk '{print $1}')" = "$DP_SHA"
          test "$(stat -c%s "$ROOT/players.csv")" = "7234131"

          for year in 2018 2019 2020 2021 2022 2023 2024 2025; do
            curl -fL --retry 6 --retry-all-errors --retry-delay 5 \
              "https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_${year}.csv" \
              -o "$ROOT/roster_${year}.csv"
          done

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"lineage"

          contract={
              2018: {"id":125773963,"size":997735,"updated_at":"2023-09-13T00:54:20Z"},
              2019: {"id":125774522,"size":1001234,"updated_at":"2023-09-13T00:59:44Z"},
              2020: {"id":125775504,"size":988000,"updated_at":"2023-09-13T01:04:58Z"},
              2021: {"id":125776019,"size":953822,"updated_at":"2023-09-13T01:10:36Z"},
              2022: {"id":125776585,"size":980115,"updated_at":"2023-09-13T01:16:11Z"},
              2023: {"id":156614734,"size":967354,"updated_at":"2024-03-14T07:18:12Z"},
              2024: {"id":237398176,"size":1005701,"updated_at":"2025-03-14T07:16:10Z"},
              2025: {
                  "id":373640814,
                  "size":1010039,
                  "updated_at":"2026-03-14T07:33:08Z",
                  "digest":"sha256:531ee5de386037bb17de3e3d50f7b4ed08789526bbaae9876fdd3dfb4d04ad",
              },
          }

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          players=root/"players.csv"
          dp=root/"db_playerids.csv"
          assert sha(players)=="4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
          assert sha(dp)=="0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"

          with players.open(newline="",encoding="utf-8-sig") as f:
              h=set(next(csv.reader(f)))
          assert {"gsis_id","display_name","position","birth_date"} <= h

          with dp.open(newline="",encoding="utf-8-sig") as f:
              h=set(next(csv.reader(f)))
          assert {"gsis_id","sleeper_id"} <= h

          rosters={}
          for year,meta in contract.items():
              p=root/f"roster_{year}.csv"
              assert p.stat().st_size==meta["size"],(year,p.stat().st_size)
              with p.open(newline="",encoding="utf-8-sig") as f:
                  h=set(next(csv.reader(f)))
              assert {"season","position","full_name","birth_date","gsis_id","sleeper_id"} <= h,year
              digest=sha(p)
              if "digest" in meta:
                  assert "sha256:"+digest==meta["digest"]
              rosters[str(year)]={
                  **meta,
                  "name":p.name,
                  "sha256":digest,
                  "url":"https://github.com/nflverse/nflverse-data/releases/download/rosters/"+p.name,
              }

          manifest={
              "schema_version":1,
              "frozen_at_phase":"v8_phase2_pre_outcome_worker",
              "players":{
                  "name":"players.csv",
                  "size":players.stat().st_size,
                  "sha256":sha(players),
                  "url":"https://github.com/nflverse/nflverse-data/releases/download/players/players.csv",
                  "role":"GSIS-keyed stable metadata and DOB only",
              },
              "dynastyprocess":{
                  "name":"db_playerids.csv",
                  "commit":"692c23d639542d6e9e94ba3898ed978a0b772724",
                  "sha256":sha(dp),
                  "url":"https://raw.githubusercontent.com/dynastyprocess/data/692c23d639542d6e9e94ba3898ed978a0b772724/files/db_playerids.csv",
                  "role":"GSIS-to-Sleeper fallback for historical roster lineage only",
              },
              "rosters":rosters,
              "firewalls":{
                  "current_sleeper_position_used":False,
                  "holdout_2024_pick_identity_file_read":False,
                  "candidate_fit_performed":False,
              },
          }
          (root/"lineage_assets_manifest.json").write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n"
          )
          print("PASS: exact historical lineage assets pinned for 2018-2025.")
          PY

      - name: Build V8 Phase 2 outcome engine
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/engine/v8_phase2_outcomes.py" <<'PY'
          from __future__ import annotations

          import argparse
          import csv
          import hashlib
          import importlib.util
          import json
          import math
          import re
          import time
          from collections import Counter, defaultdict
          from datetime import date, datetime, timezone
          from pathlib import Path
          from typing import Any

          import requests

          BASE="https://api.sleeper.app/v1"
          SLEEPER_PLAYERS_URL="https://api.sleeper.app/v1/players/nfl"
          YEARS=tuple(range(2018,2024))
          SEASONS=tuple(range(2018,2026))
          WEEKS=tuple(range(1,19))
          POSITIONS=("QB","RB","WR","TE","DL","LB","DB")
          CELLS=tuple(
              f"r{rnd}_{tier}"
              for rnd in range(1,7)
              for tier in ("early","mid","late")
          )
          MIN_READY=0.95

          POS_MAP={
              "QB":"QB","RB":"RB","FB":"RB","WR":"WR","TE":"TE",
              "DE":"DL","DT":"DL","NT":"DL","DL":"DL","EDGE":"DL",
              "OLB":"LB","ILB":"LB","MLB":"LB","LB":"LB",
              "CB":"DB","S":"DB","SS":"DB","FS":"DB","DB":"DB",
          }

          class GateError(RuntimeError):
              pass

          def now():
              return datetime.now(timezone.utc).isoformat()

          def sha(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def bsha(data: bytes):
              return hashlib.sha256(data).hexdigest()

          def load(path: Path):
              return json.loads(path.read_text())

          def read_jsonl(path: Path):
              rows=[]
              with path.open() as f:
                  for n,line in enumerate(f,1):
                      if not line.strip():
                          continue
                      try:
                          obj=json.loads(line)
                      except json.JSONDecodeError as exc:
                          raise GateError(f"{path}:{n}: invalid JSONL") from exc
                      if not isinstance(obj,dict):
                          raise GateError(f"{path}:{n}: row not object")
                      rows.append(obj)
              return rows

          def write_json(path: Path,obj):
              path.write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")

          def write_jsonl(path: Path,rows):
              with path.open("w") as f:
                  for row in rows:
                      f.write(json.dumps(row,sort_keys=True,separators=(",",":"))+"\n")

          def import_file(path: Path,name: str):
              spec=importlib.util.spec_from_file_location(name,path)
              if spec is None or spec.loader is None:
                  raise GateError(f"cannot import {path}")
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          def stable(v: Any):
              s=str(v or "").strip()
              if not s or s.upper() in {"NA","N/A","NULL","NONE","NAN","0","0000"}:
                  return None
              if re.fullmatch(r"\d+\.0",s):
                  s=s[:-2]
              return s

          def safe_int(v: Any):
              try:
                  s=str(v or "").strip()
              except Exception:
                  return None
              if not re.fullmatch(r"[+-]?\d+",s):
                  return None
              try:
                  return int(s)
              except ValueError:
                  return None

          def norm_pos(v: Any):
              return POS_MAP.get(str(v or "").strip().upper())

          def valid_dob(v: Any):
              s=str(v or "").strip()
              if not s:
                  return None
              try:
                  d=date.fromisoformat(s[:10])
              except ValueError:
                  return None
              return d.isoformat() if 1940<=d.year<=2010 else None

          def age_sep1(birth: str,season: int):
              d=date.fromisoformat(birth)
              a=date(season,9,1)
              age=a.year-d.year-((a.month,a.day)<(d.month,d.day))
              if not 18<=age<=50:
                  raise GateError(f"implausible age {age}: {birth} {season}")
              return age

          def sched_games(season: int):
              return 17 if season>=2021 else 16

          def required_weeks(season: int):
              return set(range(1,19 if season>=2021 else 18))

          def clamp(v,lo,hi):
              return max(lo,min(hi,v))

          def request_json(session,url,allow_old_week18=False):
              waits=(2,4,8,15,30,45,60,90)
              last=None
              for i,w in enumerate(waits):
                  try:
                      r=session.get(url,timeout=60)
                      if allow_old_week18 and r.status_code==404:
                          raw=b"{}"
                          return {},{
                              "url":url,"status":404,"sha256":bsha(raw),
                              "bytes":len(raw),"top_level_n":0,
                          }
                      if r.status_code==429:
                          try:
                              ra=float(r.headers.get("Retry-After") or 0)
                          except ValueError:
                              ra=0.0
                          last=GateError(f"HTTP 429 cooldown {max(ra,float(w))}s")
                          if i+1<len(waits):
                              time.sleep(max(ra,float(w)))
                              continue
                      r.raise_for_status()
                      raw=r.content
                      obj=json.loads(raw.decode())
                      if not isinstance(obj,dict):
                          raise GateError("non-object JSON")
                      return obj,{
                          "url":url,"status":r.status_code,"sha256":bsha(raw),
                          "bytes":len(raw),"top_level_n":len(obj),
                      }
                  except (requests.RequestException,UnicodeDecodeError,json.JSONDecodeError,GateError) as exc:
                      last=exc
                      if i+1<len(waits):
                          time.sleep(w)
              raise GateError(f"transport failure {url}: {type(last).__name__}: {last}")

          def load_players_master(path):
              by_gsis={}
              with path.open(newline="",encoding="utf-8-sig") as f:
                  reader=csv.DictReader(f)
                  required={"gsis_id","display_name","position","birth_date"}
                  if not required.issubset(reader.fieldnames or []):
                      raise GateError("players.csv schema drift")
                  for row in reader:
                      gsis=stable(row.get("gsis_id"))
                      if not gsis:
                          continue
                      by_gsis[gsis]={
                          "gsis_id":gsis,
                          "name":stable(row.get("display_name")),
                          "position":norm_pos(row.get("position")),
                          "birth_date":valid_dob(row.get("birth_date")),
                      }
              if not by_gsis:
                  raise GateError("empty master")
              return by_gsis

          def load_dp(path):
              cand=defaultdict(set)
              with path.open(newline="",encoding="utf-8-sig") as f:
                  reader=csv.DictReader(f)
                  required={"gsis_id","sleeper_id"}
                  if not required.issubset(reader.fieldnames or []):
                      raise GateError("DynastyProcess schema drift")
                  for row in reader:
                      g=stable(row.get("gsis_id"))
                      s=stable(row.get("sleeper_id"))
                      if g and s:
                          cand[g].add(s)
              return {g:next(iter(v)) for g,v in cand.items() if len(v)==1}

          def load_roster(path,season,master,dp):
              cand=defaultdict(list)
              with path.open(newline="",encoding="utf-8-sig") as f:
                  reader=csv.DictReader(f)
                  required={"season","position","full_name","birth_date","gsis_id","sleeper_id"}
                  if not required.issubset(reader.fieldnames or []):
                      raise GateError(f"{path.name} schema drift")
                  for row in reader:
                      if safe_int(row.get("season"))!=season:
                          continue
                      pos=norm_pos(row.get("position"))
                      if pos not in POSITIONS:
                          continue
                      gsis=stable(row.get("gsis_id"))
                      sid=stable(row.get("sleeper_id")) or (dp.get(gsis) if gsis else None)
                      if not sid:
                          continue
                      cand[sid].append({
                          "season":season,
                          "sleeper_id":sid,
                          "gsis_id":gsis,
                          "position":pos,
                          "name":stable(row.get("full_name")),
                          "birth_date":valid_dob(row.get("birth_date")),
                      })
              selected={}
              conflict=0
              for sid,rows in cand.items():
                  counts=Counter(r["position"] for r in rows)
                  ranking=counts.most_common()
                  if not ranking:
                      continue
                  if len(ranking)>1 and ranking[0][1]==ranking[1][1]:
                      conflict+=1
                      continue
                  pos=ranking[0][0]
                  same=[r for r in rows if r["position"]==pos]
                  gs={r["gsis_id"] for r in same if r["gsis_id"]}
                  dobs={r["birth_date"] for r in same if r["birth_date"]}
                  names=[r["name"] for r in same if r["name"]]
                  selected[sid]={
                      "season":season,
                      "sleeper_id":sid,
                      "gsis_id":next(iter(gs)) if len(gs)==1 else None,
                      "position":pos,
                      "name":names[0] if names else None,
                      "birth_date":next(iter(dobs)) if len(dobs)==1 else None,
                      "source":f"nflverse_roster_{season}",
                  }
              return selected,{"candidate_sleeper_id_n":len(cand),"selected_sleeper_id_n":len(selected),"unresolved_position_tie_n":conflict}

          def score_season(args):
              season=args.season
              lineage=Path(args.lineage_dir)
              repo=Path(args.repo)
              out=Path(args.out)

              assets=load(lineage/"lineage_assets_manifest.json")
              players_path=lineage/"players.csv"
              dp_path=lineage/"db_playerids.csv"
              roster_path=lineage/f"roster_{season}.csv"

              if sha(players_path)!=assets["players"]["sha256"]:
                  raise GateError("players lineage hash drift")
              if sha(dp_path)!=assets["dynastyprocess"]["sha256"]:
                  raise GateError("DP lineage hash drift")
              if sha(roster_path)!=assets["rosters"][str(season)]["sha256"]:
                  raise GateError(f"roster {season} lineage hash drift")

              master=load_players_master(players_path)
              dp=load_dp(dp_path)
              roster_map,diag=load_roster(roster_path,season,master,dp)
              scoring=import_file(
                  repo/"research/roster-economics/historical_weekly_points_pipeline.py",
                  f"v8_scoring_{season}",
              )

              ses=requests.Session()
              ses.headers["User-Agent"]=f"LOG-Draft-Pick-FV-V8-Phase2-{season}/1.0"

              totals={}
              endpoint_meta=[]
              nonempty=set()
              for week in WEEKS:
                  obj,meta=request_json(
                      ses,
                      f"{BASE}/stats/nfl/regular/{season}/{week}",
                      allow_old_week18=(season<=2020 and week==18),
                  )
                  if obj:
                      nonempty.add(week)
                  active_n=0
                  mapped_n=0
                  for pid,stats in obj.items():
                      if not isinstance(stats,dict):
                          continue
                      try:
                          active=float(stats.get("gp") or 0)>=1
                      except (TypeError,ValueError):
                          active=False
                      if not active:
                          continue
                      sid=str(pid)
                      pts=float(scoring.score_week(stats))
                      rec=totals.setdefault(sid,{"games":0,"season_total":0.0})
                      rec["games"]+=1
                      rec["season_total"]+=pts
                      active_n+=1
                      if sid in roster_map:
                          mapped_n+=1
                  meta.update({
                      "season":season,
                      "week":week,
                      "nonempty":bool(obj),
                      "active_player_n":active_n,
                      "season_position_mapped_active_n":mapped_n,
                  })
                  endpoint_meta.append(meta)
                  print(f"{season} week {week}: raw={len(obj)} active={active_n} mapped={mapped_n}",flush=True)
                  time.sleep(.10)

              players={}
              for sid,stat in totals.items():
                  lin=roster_map.get(sid)
                  gsis=lin.get("gsis_id") if lin else None
                  mr=master.get(gsis,{}) if gsis else {}
                  players[sid]={
                      "games":int(stat["games"]),
                      "season_total":round(float(stat["season_total"]),8),
                      "season_position":lin.get("position") if lin else None,
                      "season_position_source":lin.get("source") if lin else None,
                      "gsis_id":gsis or mr.get("gsis_id"),
                      "name":lin.get("name") if lin else mr.get("name"),
                      "birth_date":mr.get("birth_date") or (lin.get("birth_date") if lin else None),
                  }

              missing=sorted(required_weeks(season)-nonempty)
              payload={
                  "schema_version":1,
                  "stage":"v8_phase2_calendar_season_score",
                  "season":season,
                  "generated_at_utc":now(),
                  "research_only":True,
                  "historical_player_outcomes_read":True,
                  "calendar_season_stats_read":True,
                  "holdout_2024_pick_identity_file_read":False,
                  "holdout_2024_rookie_outcomes_scored":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "production_change_authorized":False,
                  "required_week_n":len(required_weeks(season)),
                  "nonempty_required_week_n":len(required_weeks(season)&nonempty),
                  "missing_required_weeks":missing,
                  "availability_pass":not missing and bool(players),
                  "active_player_n":len(players),
                  "season_position_mapped_active_n":sum(
                      1 for sid in players if sid in roster_map
                  ),
                  "players":players,
                  "lineage_diagnostics":diag,
                  "weekly_endpoints":endpoint_meta,
              }
              write_json(out,payload)

          def replacement_baselines(arts,ranks):
              baselines={}
              universe=[]
              for season in SEASONS:
                  bypos=defaultdict(list)
                  for sid,rec in arts[season]["players"].items():
                      pos=rec.get("season_position")
                      games=int(rec["games"])
                      total=float(rec["season_total"])
                      if pos not in POSITIONS:
                          continue
                      ppg=total/games if games else 0.0
                      row={
                          "season":season,"sleeper_id":sid,
                          "gsis_id":rec.get("gsis_id"),
                          "name":rec.get("name"),
                          "position":pos,"games":games,
                          "season_total":round(total,8),
                          "ppg":round(ppg,8),
                          "position_source":rec.get("season_position_source"),
                      }
                      universe.append(row)
                      if games>=3:
                          bypos[pos].append(row)
                  baselines[season]={}
                  for pos in POSITIONS:
                      eligible=sorted(bypos[pos],key=lambda x:(-x["ppg"],x["sleeper_id"]))
                      rank=int(ranks[pos])
                      if len(eligible)<rank:
                          raise GateError(f"{season} {pos}: insufficient replacement pool")
                      anchor=eligible[rank-1]
                      baselines[season][pos]={
                          "rank":rank,
                          "replacement_ppg":float(anchor["ppg"]),
                          "anchor_sleeper_id":anchor["sleeper_id"],
                          "anchor_gsis_id":anchor.get("gsis_id"),
                          "anchor_name":anchor.get("name"),
                          "eligible_player_n":len(eligible),
                          "position_lineage":f"nflverse season roster {season}",
                      }
              universe.sort(key=lambda x:(x["season"],x["position"],-x["ppg"],x["sleeper_id"]))
              return baselines,universe

          def fetch_sleeper_players():
              ses=requests.Session()
              ses.headers["User-Agent"]="LOG-Draft-Pick-FV-V8-Phase2-DOB/1.0"
              waits=(2,4,8,15,30,45,60)
              last=None
              for i,w in enumerate(waits):
                  try:
                      r=ses.get(SLEEPER_PLAYERS_URL,timeout=90)
                      if r.status_code==429:
                          last=GateError("429")
                          if i+1<len(waits):
                              time.sleep(w)
                              continue
                      r.raise_for_status()
                      raw=r.content
                      obj=json.loads(raw.decode())
                      if not isinstance(obj,dict):
                          raise GateError("player index not object")
                      return obj,{
                          "url":SLEEPER_PLAYERS_URL,
                          "status":r.status_code,
                          "bytes":len(raw),
                          "sha256":bsha(raw),
                          "top_level_player_n":len(obj),
                          "fetched_at_utc":now(),
                      }
                  except (requests.RequestException,UnicodeDecodeError,json.JSONDecodeError,GateError) as exc:
                      last=exc
                      if i+1<len(waits):
                          time.sleep(w)
              raise GateError(f"Sleeper player-index transport failed: {last}")

          def target_meta(rows,master,arts,sleeper_players):
              targets={}
              existing_dob_conflicts=Counter()
              supplement_resolved=set()
              supplement_unresolved=set()

              for row in rows:
                  sid=stable(row.get("sleeper_id"))
                  if not sid:
                      raise GateError("Phase 1.1 row missing sleeper_id")
                  y=int(row["draft_year"])
                  key=(y,sid)
                  pos=norm_pos(row.get("outcome_position_v8"))
                  if pos not in POSITIONS:
                      raise GateError(f"unsupported hardened position {key}: {row.get('outcome_position_v8')}")

                  gsis=stable(row.get("gsis_id"))
                  mr=master.get(gsis,{}) if gsis else {}
                  birth=mr.get("birth_date")
                  dob_source="pinned_nflverse_players" if birth else None

                  if not birth:
                      for season in SEASONS:
                          rec=arts[season]["players"].get(sid,{})
                          if rec.get("birth_date"):
                              birth=rec["birth_date"]
                              dob_source=f"nflverse_roster_{season}"
                              break

                  candidate={
                      "sleeper_id":sid,
                      "gsis_id":gsis or mr.get("gsis_id"),
                      "name":row.get("name") or mr.get("name"),
                      "position":pos,
                      "position_source":"phase1_1_outcome_position_v8",
                      "birth_date":birth,
                      "birth_date_source":dob_source,
                  }

                  if key not in targets:
                      targets[key]=candidate
                  else:
                      prev=targets[key]
                      for field in ("position","gsis_id","birth_date"):
                          a,b=prev.get(field),candidate.get(field)
                          if a and b and a!=b:
                              raise GateError(f"target metadata conflict {key} {field}")
                          if not a and b:
                              prev[field]=b
                      for field in ("name","position_source","birth_date_source"):
                          if not prev.get(field) and candidate.get(field):
                              prev[field]=candidate[field]

              # Global exact-ID DOB supplement, frozen rule applied to every
              # missing-DOB target, never cell-targeted and never using names/positions.
              for key,meta in sorted(targets.items()):
                  sid=key[1]
                  rec=sleeper_players.get(sid)
                  raw=None
                  if isinstance(rec,dict):
                      raw=rec.get("birth_date") or rec.get("birthdate")
                  sb=valid_dob(raw)
                  if meta.get("birth_date"):
                      if sb:
                          if sb==meta["birth_date"]:
                              existing_dob_conflicts["same_valid_dob"]+=1
                          else:
                              existing_dob_conflicts["valid_dob_conflict_diagnostic_only"]+=1
                      continue
                  if sb:
                      for season in range(key[0],min(key[0]+4,2026)):
                          age_sep1(sb,season)
                      meta["birth_date"]=sb
                      meta["birth_date_source"]="sleeper_exact_id_global_phase2_supplement"
                      supplement_resolved.add(key)
                  else:
                      supplement_unresolved.add(key)

              return targets,{
                  "supplement_scope":"all missing-DOB unique targets in complete 2018-2023 V8 corpus",
                  "join_key":"exact frozen sleeper_id only",
                  "manual_matching_used":False,
                  "name_matching_used":False,
                  "sleeper_position_used":False,
                  "existing_dob_overwritten":False,
                  "failed_cell_specific_targeting_used":False,
                  "resolved_unique_target_n":len(supplement_resolved),
                  "unresolved_unique_target_n":len(supplement_unresolved),
                  "existing_dob_crosscheck_diagnostic":dict(existing_dob_conflicts),
              }

          def score_targets(targets,arts,baselines,hist,v5,repo):
              age_mod=import_file(repo/"scripts/validation/snapshot_values.py","v8_age")
              bridge=v5["frozen_scale_bridge"]
              age_cfg={
                  "age_curve":bridge["age_curve"],
                  "qb_post_peak_floor":float(bridge["qb_post_peak_floor"]),
                  "lb_post_peak_decay_power":float(bridge["lb_post_peak_decay_power"]),
              }
              pw={k:float(v) for k,v in hist["frozen_position_weights"].items()}
              prod=bridge["production_transform"]
              expected={"zero_games_override","intercept","slope","floor","ceiling"}
              if not expected.issubset(prod):
                  raise GateError("production transform contract incomplete")

              out={}
              for (draft_year,sid),meta in sorted(targets.items()):
                  pos=meta["position"]
                  birth=meta.get("birth_date")
                  flags=[]
                  if not birth:
                      flags.append("missing_birth_date")

                  annual=[]
                  for season in range(draft_year,min(draft_year+4,2026)):
                      rec=arts[season]["players"].get(sid)
                      games=int(rec["games"]) if rec else 0
                      total=float(rec["season_total"]) if rec else 0.0
                      repl=baselines[season][pos]
                      denom=float(repl["replacement_ppg"])*sched_games(season)
                      if denom<=0:
                          raise GateError(f"{season} {pos}: nonpositive replacement denominator")
                      realized=(
                          float(prod["zero_games_override"])
                          if games==0
                          else clamp(
                              float(prod["intercept"])+float(prod["slope"])*(total/denom),
                              float(prod["floor"]),
                              float(prod["ceiling"]),
                          )
                      )
                      age=age_mult=annual_fv=None
                      if birth:
                          age=age_sep1(birth,season)
                          age_mult=float(age_mod.age_multiplier(
                              pos,age,"Starter",realized,realized,age_cfg
                          ))
                          annual_fv=(
                              float(hist["O2_scale"]["base_scale"])
                              * pw[pos] * age_mult * realized
                          )
                      annual.append({
                          "season":season,
                          "games":games,
                          "season_total":round(total,8),
                          "replacement_rank":repl["rank"],
                          "replacement_ppg":round(float(repl["replacement_ppg"]),8),
                          "scheduled_games":sched_games(season),
                          "annual_surplus_o1":round(max(0.0,total-denom),8),
                          "realized_prod_mult":round(realized,10),
                          "age_on_sep1":age,
                          "age_multiplier":round(age_mult,10) if age_mult is not None else None,
                          "annual_player_equivalent_fv":round(annual_fv,8) if annual_fv is not None else None,
                      })

                  def horizon(n):
                      req=list(range(draft_year,draft_year+n))
                      xs=[x for x in annual if x["season"] in req]
                      mature=all(s in SEASONS for s in req)
                      if not mature or len(xs)!=n:
                          return {"horizon_years":n,"required_seasons":req,"mature":False,"O1":None,"O2":None}
                      o1=sum(x["annual_surplus_o1"] for x in xs)
                      vals=[x["annual_player_equivalent_fv"] for x in xs]
                      return {
                          "horizon_years":n,
                          "required_seasons":req,
                          "mature":True,
                          "O1":round(o1,8),
                          "O2":round(sum(vals)/n,8) if all(v is not None for v in vals) else None,
                      }

                  h2,h3,h4=horizon(2),horizon(3),horizon(4)
                  out[(draft_year,sid)]={
                      **meta,
                      "draft_year":draft_year,
                      "status_flags":flags,
                      "annual":annual,
                      "H2":h2,"H3":h3,"H4":h4,
                      "primary_o1_ready":h3["mature"] and h3["O1"] is not None,
                      "primary_o2_ready":h3["mature"] and not flags and h3["O2"] is not None,
                  }
              return out

          def aggregate(args):
              repo=Path(args.repo)
              lineage=Path(args.lineage_dir)
              season_dir=Path(args.season_dir)
              p1=Path(args.p1_dir)
              out=Path(args.out_dir)
              out.mkdir(parents=True,exist_ok=True)

              rows=read_jsonl(p1/"v8_phase1_1_position_retention_occurrences.jsonl")
              if len(rows)!=24970:
                  raise GateError(f"Phase 1.1 denominator drift: {len(rows)}")

              v7=load(repo/"research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json")
              v5=load(repo/"research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json")
              hist=v7["historical_outcome_contract"]

              arts={}
              for season in SEASONS:
                  p=season_dir/f"season_{season}.json"
                  if not p.exists():
                      raise GateError(f"missing season artifact {p}")
                  art=load(p)
                  if art["season"]!=season or art["availability_pass"] is not True:
                      raise GateError(f"season {season} failed availability")
                  if art["holdout_2024_pick_identity_file_read"] is not False:
                      raise GateError("2024 holdout pick identity firewall violated")
                  if art["holdout_2024_rookie_outcomes_scored"] is not False:
                      raise GateError("2024 holdout rookie outcome firewall violated")
                  if art["candidate_fit_performed"] is not False:
                      raise GateError("candidate fit occurred in season worker")
                  arts[season]=art

              assets=load(lineage/"lineage_assets_manifest.json")
              master=load_players_master(lineage/"players.csv")
              ranks={k:int(v) for k,v in hist["frozen_replacement_ranks"].items()}
              baselines,universe=replacement_baselines(arts,ranks)

              sleeper_players,sleeper_meta=fetch_sleeper_players()
              targets,repair_diag=target_meta(rows,master,arts,sleeper_players)
              if len(targets)!=929:
                  raise GateError(f"unique target drift: {len(targets)}")
              outcomes=score_targets(targets,arts,baselines,hist,v5,repo)

              scored=[]
              by_cell=defaultdict(lambda:{"n":0,"o1":0,"o2":0})
              by_year=defaultdict(lambda:{"n":0,"o1":0,"o2":0})
              unique_ready={}

              for row in rows:
                  y=int(row["draft_year"])
                  sid=str(row["sleeper_id"])
                  key=(y,sid)
                  o=outcomes[key]
                  rec={
                      **row,
                      "position":o["position"],
                      "position_source":o["position_source"],
                      "birth_date":o.get("birth_date"),
                      "birth_date_source":o.get("birth_date_source"),
                      "status_flags":o["status_flags"],
                      "annual":o["annual"],
                      "H2":o["H2"],
                      "H3":o["H3"],
                      "H4":o["H4"],
                      "primary_o1_ready":o["primary_o1_ready"],
                      "primary_o2_ready":o["primary_o2_ready"],
                      "historical_player_outcomes_read":True,
                  }
                  scored.append(rec)
                  d=by_cell[(y,row["cell"])]
                  d["n"]+=1
                  d["o1"]+=int(bool(o["primary_o1_ready"]))
                  d["o2"]+=int(bool(o["primary_o2_ready"]))
                  yy=by_year[y]
                  yy["n"]+=1
                  yy["o1"]+=int(bool(o["primary_o1_ready"]))
                  yy["o2"]+=int(bool(o["primary_o2_ready"]))
                  unique_ready[key]=bool(o["primary_o2_ready"])

              if len(scored)!=24970:
                  raise GateError("scored occurrence denominator drift")

              readiness_cells={}
              all_pass=True
              for y in YEARS:
                  for cell in CELLS:
                      d=by_cell[(y,cell)]
                      if d["n"]<=0:
                          raise GateError(f"empty cell {y}:{cell}")
                      cov=d["o2"]/d["n"]
                      passed=cov>=MIN_READY
                      all_pass&=passed
                      readiness_cells[f"{y}:{cell}"]={
                          "retained_occurrence_n":d["n"],
                          "primary_o1_ready_n":d["o1"],
                          "primary_o2_ready_n":d["o2"],
                          "primary_o2_ready_coverage":cov,
                          "minimum_required":MIN_READY,
                          "pass":passed,
                      }

              class_availability={}
              for y in YEARS:
                  req=[y,y+1,y+2]
                  passed=all(
                      s in arts and arts[s]["availability_pass"] is True
                      for s in req
                  )
                  class_availability[str(y)]={
                      "required_H3_seasons":req,
                      "pass":passed,
                  }
                  all_pass&=passed

              overall_ready=sum(int(x) for x in unique_ready.values())/len(unique_ready)
              occurrence_ready=sum(int(r["primary_o2_ready"]) for r in scored)/len(scored)
              all_pass&=occurrence_ready>=MIN_READY

              decision=(
                  "PROCEED_TO_V8_PHASE3_LOYO_DEVELOPMENT_SELECTION"
                  if all_pass else
                  "STOP_V8_PHASE2_OUTCOME_AVAILABILITY_OR_COMPLETENESS_GATE"
              )

              out_scored=out/"v8_phase2_development_outcomes.jsonl"
              out_universe=out/"v8_phase2_historical_scored_universe.jsonl"
              out_baselines=out/"v8_phase2_replacement_baselines.json"
              write_jsonl(out_scored,scored)
              write_jsonl(out_universe,universe)
              write_json(out_baselines,baselines)

              summary={
                  "schema_version":1,
                  "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
                  "stage":"phase2_historical_outcome_harvest",
                  "status":"HISTORICAL_OUTCOME_HARVEST_PASS" if all_pass else "HISTORICAL_OUTCOME_HARVEST_STOP",
                  "decision":decision,
                  "research_only":True,
                  "retained_pick_occurrence_n":24970,
                  "development_outcome_occurrence_n":len(scored),
                  "unique_outcome_identity_n":len(targets),
                  "provider":"Sleeper historical weekly NFL stats",
                  "calendar_seasons_read":list(SEASONS),
                  "development_draft_classes":list(YEARS),
                  "class_availability":class_availability,
                  "outcome_readiness_gate":{
                      "minimum_primary_o2_occurrence_coverage":MIN_READY,
                      "overall_primary_o2_ready_coverage":occurrence_ready,
                      "unique_target_primary_o2_ready_coverage":overall_ready,
                      "by_year_cell":readiness_cells,
                      "pass":bool(all_pass),
                  },
                  "dob_supplement":{
                      **repair_diag,
                      "sleeper_player_index_response":sleeper_meta,
                  },
                  "position_lineage_hardening":{
                      "target_position_source":"Phase 1.1 outcome_position_v8",
                      "replacement_pool_position_source":"season-specific nflverse roster position",
                      "current_sleeper_position_used_for_replacement_pool":False,
                      "current_sleeper_position_used_for_target":False,
                  },
                  "weighting_contract_preserved":{
                      "development_fit_weight_carried_from_phase1_1":True,
                      "source_membership_changed":False,
                      "source_search_performed":False,
                  },
                  "sparse_cell_controls":{
                      "2018_r6_remains_source_sparse":True,
                      "preproduction_sensitivity_still_required":True,
                  },
                  "historical_player_outcomes_read":True,
                  "holdout_2024_pick_identity_file_read":False,
                  "holdout_2024_rookie_outcomes_scored":False,
                  "holdout_2024_pick_outcomes_remain_sealed":True,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
                  "outputs":{
                      out_scored.name:{"sha256":sha(out_scored),"row_n":len(scored)},
                      out_universe.name:{"sha256":sha(out_universe),"row_n":len(universe)},
                      out_baselines.name:{"sha256":sha(out_baselines)},
                  },
                  "next_stage":"draft-pick-fv-v8-phase3-loyo-development-selection" if all_pass else None,
              }

              manifest={
                  "schema_version":1,
                  "study_id":summary["study_id"],
                  "stage":"phase2_historical_outcome_harvest_manifest",
                  "status":summary["status"],
                  "decision":decision,
                  "retained_pick_occurrence_n":24970,
                  "unique_outcome_identity_n":929,
                  "outcome_readiness_gate_pass":bool(all_pass),
                  "historical_player_outcomes_read":True,
                  "holdout_2024_pick_identity_file_read":False,
                  "holdout_2024_rookie_outcomes_scored":False,
                  "holdout_2024_pick_outcomes_remain_sealed":True,
                  "candidate_fit_performed":False,
                  "candidate_scores_computed":False,
                  "candidate_selection_performed":False,
                  "production_change_authorized":False,
                  "output_hashes":{k:v["sha256"] for k,v in summary["outputs"].items()},
                  "next_stage":summary["next_stage"],
              }

              write_json(out/"v8_phase2_historical_outcome_summary.json",summary)
              write_json(out/"v8_phase2_historical_outcome_manifest.json",manifest)

              failing=[k for k,v in readiness_cells.items() if not v["pass"]]
              lines=[
                  "# Draft Pick FV V8 — Phase 2 Historical Outcome Harvest",
                  "",
                  f"**Decision:** `{decision}`",
                  "",
                  f"- Development occurrences scored: **{len(scored):,} / 24,970**",
                  f"- Unique player-year targets scored: **{len(targets)}**",
                  f"- Overall H3 O2 occurrence readiness: **{occurrence_ready:.2%}**",
                  f"- Unique-target H3 O2 readiness: **{overall_ready:.2%}**",
                  f"- 108-cell readiness failures: **{len(failing)}**",
                  f"- Failing cells: **{', '.join(failing) if failing else 'None'}**",
                  f"- Global exact-ID DOB supplements resolved: **{repair_diag['resolved_unique_target_n']}**",
                  f"- DOB targets still unresolved: **{repair_diag['unresolved_unique_target_n']}**",
                  "",
                  "Calendar-season 2024/2025 league-wide stats are used only for the frozen H3/H4 development horizons of the 2022/2023 draft classes.",
                  "The 2024 rookie holdout pick corpus remains unopened and unscored.",
                  "",
                  "No KTC/market data, package votes, candidate fitting, candidate selection, or production values were read.",
              ]
              (out/"v8_phase2_historical_outcome_summary.md").write_text("\n".join(lines)+"\n")
              print("\n".join(lines))

          def selftest():
              assert norm_pos("DE")=="DL"
              assert norm_pos("CB")=="DB"
              assert norm_pos("FB")=="RB"
              assert norm_pos("K") is None
              assert sched_games(2020)==16
              assert sched_games(2021)==17
              assert required_weeks(2020)==set(range(1,18))
              assert required_weeks(2021)==set(range(1,19))
              assert valid_dob("2000-02-29")=="2000-02-29"
              assert age_sep1("2000-09-02",2024)==23
              assert clamp(2.0,.15,1.55)==1.55
              print("PASS: V8 Phase 2 historical-outcome engine self-test")

          def main():
              ap=argparse.ArgumentParser()
              ap.add_argument("--selftest",action="store_true")
              ap.add_argument("--season",type=int)
              ap.add_argument("--lineage-dir")
              ap.add_argument("--repo")
              ap.add_argument("--out")
              ap.add_argument("--aggregate",action="store_true")
              ap.add_argument("--season-dir")
              ap.add_argument("--p1-dir")
              ap.add_argument("--out-dir")
              a=ap.parse_args()
              if a.selftest:
                  selftest()
              elif a.season is not None:
                  score_season(a)
              elif a.aggregate:
                  aggregate(a)
              else:
                  raise SystemExit("choose --selftest, --season, or --aggregate")

          if __name__=="__main__":
              main()
          PY

          python3 "${RUNNER_TEMP}/engine/v8_phase2_outcomes.py" --selftest

      - name: Upload Phase 2 engine
        uses: actions/upload-artifact@v4
        with:
          name: v8-p2-engine
          path: ${{ runner.temp }}/engine/v8_phase2_outcomes.py
          if-no-files-found: error
          retention-days: 7

      - name: Upload Phase 2 lineage
        uses: actions/upload-artifact@v4
        with:
          name: v8-p2-lineage
          path: ${{ runner.temp }}/lineage/
          if-no-files-found: error
          retention-days: 7

  season:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        season: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

    steps:
      - name: Check out exact study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download Phase 2 engine
        uses: actions/download-artifact@v4
        with:
          name: v8-p2-engine
          path: ${{ runner.temp }}/engine

      - name: Download pinned lineage
        uses: actions/download-artifact@v4
        with:
          name: v8-p2-lineage
          path: ${{ runner.temp }}/lineage

      - name: Harvest calendar-season weekly stats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/season-${{ matrix.season }}"
          python3 "${RUNNER_TEMP}/engine/v8_phase2_outcomes.py" \
            --season "${{ matrix.season }}" \
            --lineage-dir "${RUNNER_TEMP}/lineage" \
            --repo "$GITHUB_WORKSPACE" \
            --out "${RUNNER_TEMP}/season-${{ matrix.season }}/season_${{ matrix.season }}.json"

      - name: Validate season checkpoint
        shell: bash
        env:
          SEASON: ${{ matrix.season }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          season=int(os.environ["SEASON"])
          p=Path(os.environ["RUNNER_TEMP"])/f"season-{season}"/f"season_{season}.json"
          d=json.loads(p.read_text())
          assert d["season"]==season
          assert d["availability_pass"] is True
          assert d["historical_player_outcomes_read"] is True
          assert d["holdout_2024_pick_identity_file_read"] is False
          assert d["holdout_2024_rookie_outcomes_scored"] is False
          assert d["candidate_fit_performed"] is False
          assert d["candidate_scores_computed"] is False
          assert d["production_change_authorized"] is False
          print(f"PASS: season {season}; players={d['active_player_n']} mapped={d['season_position_mapped_active_n']}")
          PY

      - name: Upload season checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v8-p2-season-${{ matrix.season }}
          path: ${{ runner.temp }}/season-${{ matrix.season }}/season_${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, season]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Download exact Phase 1.1 corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p1_1" "${RUNNER_TEMP}/out"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10990665019" --jq '.digest // ""')" = \
            "sha256:6d480ea3fbb5db254e3271b9c400d62e136bb34877aff6b181ca5ed7252247b0"
          gh run download 36467064097 \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p1-1-position-retention-hardening" \
            -D "${RUNNER_TEMP}/p1_1"

      - name: Download Phase 2 engine
        uses: actions/download-artifact@v4
        with:
          name: v8-p2-engine
          path: ${{ runner.temp }}/engine

      - name: Download pinned lineage
        uses: actions/download-artifact@v4
        with:
          name: v8-p2-lineage
          path: ${{ runner.temp }}/lineage

      - name: Download all season checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: v8-p2-season-*
          path: ${{ runner.temp }}/seasons
          merge-multiple: true

      - name: Aggregate frozen historical outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/engine/v8_phase2_outcomes.py" \
            --aggregate \
            --repo "$GITHUB_WORKSPACE" \
            --lineage-dir "${RUNNER_TEMP}/lineage" \
            --season-dir "${RUNNER_TEMP}/seasons" \
            --p1-dir "${RUNNER_TEMP}/p1_1" \
            --out-dir "${RUNNER_TEMP}/out"

      - name: Validate Phase 2 closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out=Path(os.environ["RUNNER_TEMP"])/"out"
          s=json.loads((out/"v8_phase2_historical_outcome_summary.json").read_text())
          m=json.loads((out/"v8_phase2_historical_outcome_manifest.json").read_text())

          assert s["decision"] in {
              "PROCEED_TO_V8_PHASE3_LOYO_DEVELOPMENT_SELECTION",
              "STOP_V8_PHASE2_OUTCOME_AVAILABILITY_OR_COMPLETENESS_GATE",
          }
          assert s["retained_pick_occurrence_n"]==24970
          assert s["development_outcome_occurrence_n"]==24970
          assert s["unique_outcome_identity_n"]==929
          assert s["provider"]=="Sleeper historical weekly NFL stats"
          assert s["calendar_seasons_read"]==list(range(2018,2026))
          assert s["development_draft_classes"]==list(range(2018,2024))
          assert all(v["pass"] for v in s["class_availability"].values())

          gate=s["outcome_readiness_gate"]
          assert len(gate["by_year_cell"])==108
          assert gate["minimum_primary_o2_occurrence_coverage"]==0.95

          dob=s["dob_supplement"]
          assert dob["supplement_scope"]=="all missing-DOB unique targets in complete 2018-2023 V8 corpus"
          assert dob["join_key"]=="exact frozen sleeper_id only"
          assert dob["manual_matching_used"] is False
          assert dob["name_matching_used"] is False
          assert dob["sleeper_position_used"] is False
          assert dob["existing_dob_overwritten"] is False
          assert dob["failed_cell_specific_targeting_used"] is False

          assert s["position_lineage_hardening"]["current_sleeper_position_used_for_replacement_pool"] is False
          assert s["position_lineage_hardening"]["current_sleeper_position_used_for_target"] is False
          assert s["weighting_contract_preserved"]["development_fit_weight_carried_from_phase1_1"] is True
          assert s["weighting_contract_preserved"]["source_membership_changed"] is False
          assert s["weighting_contract_preserved"]["source_search_performed"] is False
          assert s["sparse_cell_controls"]["2018_r6_remains_source_sparse"] is True
          assert s["sparse_cell_controls"]["preproduction_sensitivity_still_required"] is True

          assert s["historical_player_outcomes_read"] is True
          assert s["holdout_2024_pick_identity_file_read"] is False
          assert s["holdout_2024_rookie_outcomes_scored"] is False
          assert s["holdout_2024_pick_outcomes_remain_sealed"] is True
          assert s["market_or_ktc_values_read"] is False
          assert s["package_vote_data_read"] is False
          assert s["candidate_fit_performed"] is False
          assert s["candidate_scores_computed"] is False
          assert s["candidate_selection_performed"] is False
          assert s["production_change_authorized"] is False

          assert m["decision"]==s["decision"]
          assert m["retained_pick_occurrence_n"]==24970
          assert m["unique_outcome_identity_n"]==929
          assert m["historical_player_outcomes_read"] is True
          assert m["holdout_2024_pick_identity_file_read"] is False
          assert m["holdout_2024_rookie_outcomes_scored"] is False
          assert m["holdout_2024_pick_outcomes_remain_sealed"] is True
          assert m["candidate_fit_performed"] is False
          assert m["candidate_scores_computed"] is False
          assert m["candidate_selection_performed"] is False
          assert m["production_change_authorized"] is False

          scored=out/"v8_phase2_development_outcomes.jsonl"
          assert sum(1 for line in scored.open() if line.strip())==24970

          if s["decision"]=="PROCEED_TO_V8_PHASE3_LOYO_DEVELOPMENT_SELECTION":
              assert gate["pass"] is True
              assert all(v["pass"] for v in gate["by_year_cell"].values())
              assert gate["overall_primary_o2_ready_coverage"]>=0.95
              assert s["next_stage"]=="draft-pick-fv-v8-phase3-loyo-development-selection"
          else:
              assert gate["pass"] is False
              assert s["next_stage"] is None

          print(
              "PASS: Phase 2 closeout validated; 2024 rookie holdout, "
              "candidate fit/selection, and production remain sealed."
          )
          PY

      - name: Upload Phase 2 closeout
        uses: actions/upload-artifact@v4
        with:
          name: v8-p2-historical-outcome-harvest-closeout
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
