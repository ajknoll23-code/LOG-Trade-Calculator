name: Workflow repair verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/workflow-repair-verification.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: workflow-repair-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refresh dependencies and verify affected workflows on current main
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for workflow in scheduled-data-refresh.yml position-weight-v2-phase5.yml replacement-level-v2-phase5.yml age-curve-v2-phase5.yml opportunity-v2-phase5.yml no-history-rookie-v2-phase3.yml durability-v2-phase5.yml B39-weekly-floor-ceiling-volatility-v1-reusable-prospective-weekly-capture.yml B51-v1r1-schedule-utility-v1-reusable-weekly-prospective-snapshot-freezer.yml B50-v3-weekly-research-readiness-prekickoff-audit.yml; do
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            case "$workflow" in
              B39-*) gh workflow run "$workflow" --ref main -f origin_week=12 ;;
              B51-*) gh workflow run "$workflow" --ref main -f target_week=12 ;;
              *) gh workflow run "$workflow" --ref main ;;
            esac
            run_id=""
            for attempt in {1..20}; do
              run_id="$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$started\")][0].databaseId // empty")"
              test -n "$run_id" && break
              sleep 3
            done
            test -n "$run_id" || { echo "Could not find dispatched $workflow"; exit 1; }
            if gh run watch "$run_id" --exit-status --interval 10; then
              echo "$workflow: PASS ($run_id)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$workflow: FAILED ($run_id)" | tee -a "$GITHUB_STEP_SUMMARY"
              gh run view "$run_id" --log-failed
              failures=$((failures+1))
            fi
          done
          test "$failures" -eq 0
