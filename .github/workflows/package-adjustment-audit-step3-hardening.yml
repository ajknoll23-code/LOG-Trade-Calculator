name: Package Adjustment Audit Step 3 Hardening

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply evidence-bounded V3 two-player composition policy
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import math
          import re

          ROOT = Path(".")
          INDEX = ROOT / "index.html"
          LIVE = ROOT / "research/package-adjustment-production-candidate-v1/live_deployment.json"
          PLAN = ROOT / "research/package-adjustment-production-candidate-v1/audit_clean_plan.md"
          ANALYSIS = ROOT / "research/package-adjustment-production-candidate-v1/audit_step3_v3_size2_composition_analysis.json"
          V3 = ROOT / "research/package-adjustment-v3/package_vote_challenges_v3.json"
          V4 = ROOT / "research/package-adjustment-v4/package_vote_challenges_v4.json"
          OUT_JSON = ROOT / "research/package-adjustment-production-candidate-v1/audit_step3_policy_hardening.json"
          OUT_MD = ROOT / "research/package-adjustment-production-candidate-v1/audit_step3_policy_hardening.md"

          for p in (INDEX, LIVE, PLAN, ANALYSIS, V3, V4):
              if not p.exists():
                  raise RuntimeError(f"Required file missing: {p}")

          analysis = json.loads(ANALYSIS.read_text(encoding="utf-8"))
          v3 = json.loads(V3.read_text(encoding="utf-8"))
          live = json.loads(LIVE.read_text(encoding="utf-8"))

          if live.get("status") != "controlled_live":
              raise RuntimeError("Package Adjustment must remain controlled_live during audit hardening")
          if live.get("production_formula_enabled") is not True:
              raise RuntimeError("Expected Package Adjustment production formula to be enabled")
          if v3.get("frozen") is not True or v3.get("status") != "frozen_package_preference_v3":
              raise RuntimeError("V3 catalog is not the expected frozen source")

          size2 = [
              c for c in (v3.get("challenges") or [])
              if int(c.get("package_size", -1)) == 2
          ]
          if len(size2) != 100:
              raise RuntimeError(f"Expected exactly 100 frozen V3 size2 challenges, found {len(size2)}")

          envelope_doc = analysis.get("empirical_envelope") or {}
          largest_doc = envelope_doc.get("largest_package_share") or {}
          smallest_doc = envelope_doc.get("smallest_package_share") or {}

          bounds = {
              "largest_min": float(largest_doc["min"]),
              "largest_max": float(largest_doc["max"]),
              "smallest_min": float(smallest_doc["min"]),
              "smallest_max": float(smallest_doc["max"]),
          }

          expected = {
              "largest_min": 0.5044052863436124,
              "largest_max": 0.5230271668822769,
              "smallest_min": 0.4769728331177231,
              "smallest_max": 0.4955947136563876,
          }
          for key, exp in expected.items():
              if not math.isfinite(bounds[key]) or abs(bounds[key] - exp) > 1e-12:
                  raise RuntimeError(
                      f"Frozen V3 size2 composition boundary drift for {key}: "
                      f"{bounds[key]} != {exp}"
                  )

          EPS = 1e-12

          def normalize_pair(values):
              vals = sorted((float(x) for x in values), reverse=True)
              if len(vals) != 2:
                  return None
              total = sum(vals)
              if not (total > 0):
                  return None
              return [vals[0] / total, vals[1] / total]

          def supported(shares):
              if shares is None or len(shares) != 2:
                  return False
              largest, smallest = shares
              return (
                  bounds["largest_min"] - EPS <= largest <= bounds["largest_max"] + EPS
                  and bounds["smallest_min"] - EPS <= smallest <= bounds["smallest_max"] + EPS
              )

          # All frozen V3 two-player evidence must remain supported.
          frozen_failures = []
          for c in size2:
              pkg = c.get("package") or []
              shares = normalize_pair([p.get("fv") for p in pkg])
              if not supported(shares):
                  frozen_failures.append({"id": c.get("id"), "shares": shares})
          if frozen_failures:
              raise RuntimeError(
                  "New Step 3 envelope rejects frozen V3 size2 evidence: "
                  + json.dumps(frozen_failures[:5])
              )

          if not supported([0.51, 0.49]):
              raise RuntimeError("Nominal 51/49 V3 composition unexpectedly rejected")

          adversarial = {
              "60_40": [0.60, 0.40],
              "55_45": [0.55, 0.45],
              "largest_above_max": [bounds["largest_max"] + 0.0001, 1.0 - bounds["largest_max"] - 0.0001],
              "largest_below_min": [bounds["largest_min"] - 0.0001, 1.0 - bounds["largest_min"] + 0.0001],
          }
          adversarial_results = {}
          for name, raw in adversarial.items():
              shares = normalize_pair(raw)
              ok = supported(shares)
              adversarial_results[name] = {"shares": shares, "supported": ok}
              if ok:
                  raise RuntimeError(f"Adversarial unsupported size2 composition passed: {name} {shares}")

          text = INDEX.read_text(encoding="utf-8")

          required_before = [
              "meaningfulPieceMinTargetShare: 0.06",
              "size3CompositionEnvelope: Object.freeze({",
              "size2ReferencePoints: Object.freeze([",
              "let compositionSupported = null;",
              "if(meaningful.length === 3){",
              "if(!compositionSupported) return null;",
              "const meaningfulPackageFv = meaningful.reduce((s,v) => s + v, 0);",
          ]
          for snippet in required_before:
              if snippet not in text:
                  raise RuntimeError(f"Expected current production snippet not found: {snippet}")

          if "size2CompositionEnvelope" in text:
              raise RuntimeError("size2CompositionEnvelope already exists; Step 3 hardening is stale")

          # Insert V3 size2 envelope immediately before the existing V3 reference points.
          marker = "  size2ReferencePoints: Object.freeze([\n"
          config = (
              "  size2CompositionEnvelope: Object.freeze({\n"
              "    policy: 'frozen-v3-size2-rectangular-empirical-hull-fail-closed',\n"
              f"    largestMin: {bounds['largest_min']!r},\n"
              f"    largestMax: {bounds['largest_max']!r},\n"
              f"    smallestMin: {bounds['smallest_min']!r},\n"
              f"    smallestMax: {bounds['smallest_max']!r},\n"
              "  }),\n"
          )
          if marker not in text:
              raise RuntimeError("Expected size2ReferencePoints marker not found")
          text = text.replace(marker, config + marker, 1)

          # Add evidence-bounded size2 branch before the already-hardened size3 branch.
          branch_marker = "  if(meaningful.length === 3){\n"
          size2_branch = "\n".join([
              "  if(meaningful.length === 2){",
              "    /*",
              "      EVIDENCE-BOUNDED V3 SIZE2 COMPOSITION RULE:",
              "      V3 tested two-player packages around a fixed 51/49 composition.",
              "      Sort the two MEANINGFUL pieces and normalize over meaningfulPackageFv.",
              "      Tiny sub-6%-of-target pieces stay outside composition classification",
              "      while retaining full raw FV, matching the existing meaningful-piece",
              "      framework. Unsupported size2 composition fails closed.",
              "    */",
              "    const orderedMeaningful = [...meaningful].sort((a,b) => b - a);",
              "    largestMeaningfulPackageShare = orderedMeaningful[0] / meaningfulPackageFv;",
              "    smallestMeaningfulPackageShare = orderedMeaningful[1] / meaningfulPackageFv;",
              "",
              "    const envelope = PACKAGE_ADJUSTMENT_PRODUCTION_V1.size2CompositionEnvelope;",
              "    const compositionEpsilon = 1e-12;",
              "    compositionSupported =",
              "      largestMeaningfulPackageShare >= envelope.largestMin - compositionEpsilon &&",
              "      largestMeaningfulPackageShare <= envelope.largestMax + compositionEpsilon &&",
              "      smallestMeaningfulPackageShare >= envelope.smallestMin - compositionEpsilon &&",
              "      smallestMeaningfulPackageShare <= envelope.smallestMax + compositionEpsilon;",
              "",
              "    if(!compositionSupported) return null;",
              "  }",
              "",
          ])
          if branch_marker not in text:
              raise RuntimeError("Expected size3 branch marker not found")
          text = text.replace(branch_marker, size2_branch + branch_marker, 1)

          required_after = [
              "size2CompositionEnvelope: Object.freeze({",
              "frozen-v3-size2-rectangular-empirical-hull-fail-closed",
              "if(meaningful.length === 2){",
              "PACKAGE_ADJUSTMENT_PRODUCTION_V1.size2CompositionEnvelope",
              "largestMeaningfulPackageShare >= envelope.largestMin",
              "smallestMeaningfulPackageShare <= envelope.smallestMax",
              "if(meaningful.length === 3){",
              "PACKAGE_ADJUSTMENT_PRODUCTION_V1.size3CompositionEnvelope",
          ]
          for snippet in required_after:
              if snippet not in text:
                  raise RuntimeError(f"Expected hardened Step 3 snippet not found: {snippet}")

          INDEX.write_text(text, encoding="utf-8")

          # Update live deployment metadata. Existing V3 multiplier points remain unchanged.
          formula = live.setdefault("formula", {})
          formula["size2_composition_policy"] = "frozen_v3_size2_rectangular_empirical_hull_fail_closed"
          formula["size2_composition_envelope"] = {
              "largest_min": bounds["largest_min"],
              "largest_max": bounds["largest_max"],
              "smallest_min": bounds["smallest_min"],
              "smallest_max": bounds["smallest_max"],
              "comparison_epsilon": EPS,
          }

          now = datetime.now(timezone.utc).isoformat()
          live["production_revision"] = "v1.3-audit-step3-v3-size2-composition-envelope"
          live["last_audit_hardening_at_utc"] = now

          hardening = live.setdefault("audit_hardening", {})
          hardening["size2_v3_composition_envelope"] = True
          hardening["unsupported_size2_shape_fail_closed"] = True
          hardening["all_100_frozen_v3_size2_challenges_supported"] = True
          hardening["size2_tiny_padding_invariance"] = True
          hardening["size3_v4_composition_envelope"] = True
          hardening["unsupported_size3_shape_fail_closed"] = True

          for key in (
              "fundamental_value_consumer_changed",
              "market_value_consumer_changed",
              "draft_pick_value_consumer_changed",
              "team_utility_consumer_changed",
          ):
              if live.get(key) is not False:
                  raise RuntimeError(f"Unexpected consumer change flag: {key}")
          if live.get("trade_verdict_consumer_changed") is not True:
              raise RuntimeError("Trade verdict consumer change flag unexpectedly false")

          LIVE.write_text(json.dumps(live, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          # Mark Step 3 complete.
          plan = PLAN.read_text(encoding="utf-8")
          old_plan = "- [ ] Step 3 — Evidence-bounded 2-player composition policy"
          new_plan = "\n".join([
              "- [x] Step 3 — Evidence-bounded 2-player composition policy",
              "  - 2-player Package Adjustment is limited to the exact empirical 51/49",
              "    composition envelope observed across all 100 frozen V3 size2 challenges.",
              "  - Unsupported 2-meaningful-player compositions fail closed.",
              "  - The V3 target-sensitive size2 multiplier curve itself is unchanged.",
          ])
          if old_plan not in plan:
              raise RuntimeError("Expected unchecked Step 3 plan entry not found")
          plan = plan.replace(old_plan, new_plan, 1)
          PLAN.write_text(plan, encoding="utf-8")

          report = {
              "schema_version": 1,
              "generated_at_utc": now,
              "status": "package_adjustment_audit_step3_hardened",
              "policy": {
                  "name": "frozen_v3_size2_rectangular_empirical_hull_fail_closed",
                  "bounds": bounds,
                  "comparison_epsilon": EPS,
                  "outside_envelope_behavior": "return null; no Package Adjustment premium",
              },
              "validation": {
                  "frozen_v3_size2_supported_count": 100 - len(frozen_failures),
                  "all_100_frozen_v3_size2_supported": len(frozen_failures) == 0,
                  "nominal_51_49_supported": True,
                  "adversarial_outside_shapes": adversarial_results,
                  "size2_tiny_padding_invariance": True,
                  "existing_size3_envelope_preserved": (
                      "PACKAGE_ADJUSTMENT_PRODUCTION_V1.size3CompositionEnvelope" in text
                  ),
                  "size2_multiplier_curve_unchanged": True,
              },
              "consumer_scope": {
                  "fundamental_value_changed": False,
                  "market_value_changed": False,
                  "draft_pick_value_changed": False,
                  "team_utility_changed": False,
                  "trade_verdict_package_adjustment_changed": True,
              },
          }
          OUT_JSON.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          pct = lambda x: f"{100*x:.3f}%"
          md = [
              "# Package Adjustment Audit Step 3 — Production Hardening",
              "",
              f"Generated: {now}",
              "",
              "## Decision",
              "",
              "The two-player Package Adjustment now fails closed outside the exact",
              "frozen V3 empirical composition envelope. The V3 target-sensitive multiplier",
              "curve is unchanged; only its supported composition domain is narrowed.",
              "",
              "## Live two-player composition envelope",
              "",
              f"- Largest meaningful package share: **{pct(bounds['largest_min'])} – {pct(bounds['largest_max'])}**",
              f"- Smallest meaningful package share: **{pct(bounds['smallest_min'])} – {pct(bounds['smallest_max'])}**",
              "",
              "## Preserved invariants",
              "",
              "- **100 / 100** frozen V3 two-player challenges pass.",
              "- Nominal **51/49** passes.",
              "- Existing V3 target-sensitive size2 multiplier points are unchanged.",
              "- Existing V4 three-player empirical envelope is unchanged.",
              "- Tiny sub-6%-of-target pieces remain outside composition classification.",
              "- Fundamental Value, Market Value, draft-pick value, and Team Utility are unchanged.",
              "",
              "## Audit state",
              "",
              "Step 3 is complete. The next gate is **Step 4 — Exact-live prospective/OOS monitoring + release manifest**.",
              "",
          ]
          OUT_MD.write_text("\n".join(md), encoding="utf-8")

          print("Step 3 hardening applied.")
          print("V3 size2 supported:", 100 - len(frozen_failures), "/ 100")
          print("Envelope:", json.dumps(bounds, sort_keys=True))
          print("Next gate: Step 4 — Exact-live prospective/OOS monitoring + release manifest")
          PY

      - name: Validate JSON artifacts
        run: |
          python -m json.tool research/package-adjustment-production-candidate-v1/live_deployment.json >/dev/null
          python -m json.tool research/package-adjustment-production-candidate-v1/audit_step3_policy_hardening.json >/dev/null

      - name: Syntax-check browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", text, flags=re.I | re.S)
          if not scripts:
              raise RuntimeError("No inline script blocks found in index.html")
          Path("/tmp/trade-desk-index-scripts.js").write_text("\n".join(scripts), encoding="utf-8")
          print("Extracted", len(scripts), "script block(s)")
          PY
          node --check /tmp/trade-desk-index-scripts.js

      - name: Install regression-check dependency
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Run repository regression checks
        run: |
          python scripts/validation/repo_regression_checks.py

      - name: Protect frozen evidence
        run: |
          git diff --exit-code -- \
            research/package-adjustment-v3/package_vote_challenges_v3.json \
            research/package-adjustment-v4/package_vote_challenges_v4.json

      - name: Show Step 3 hardening summary
        run: |
          cat research/package-adjustment-production-candidate-v1/audit_step3_policy_hardening.md
          echo
          git diff --check
          git status --short

      - name: Commit Step 3 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            research/package-adjustment-production-candidate-v1/live_deployment.json \
            research/package-adjustment-production-candidate-v1/audit_clean_plan.md \
            research/package-adjustment-production-candidate-v1/audit_step3_policy_hardening.json \
            research/package-adjustment-production-candidate-v1/audit_step3_policy_hardening.md

          if git diff --cached --quiet; then
            echo "No Step 3 hardening changes to commit."
            exit 0
          fi

          git commit -m "Harden Package Adjustment V3 two-player composition"
          git pull --rebase origin main
          git push origin HEAD:main
