name: Trade Robustness V1 Phase 4 Pick UI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  phase4-pick-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3"

      - name: Guard Phase 3 PASS and fingerprint protected logic
        shell: bash
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          phase3 = json.loads(
              Path(
                  "research/trade-robustness-v1/"
                  "trade_robustness_v1_phase3_pick_sensitivity_shadow.json"
              ).read_text(encoding="utf-8")
          )
          assert phase3["decision"] == "PASS_TRADE_ROBUSTNESS_V1_PHASE3_PICK_SLOT_SENSITIVITY_SHADOW"
          assert phase3["production_change_authorized"] is False
          assert phase3["promotion_scope"]["eligible_rounds"] == [1,2,3,4]
          assert phase3["promotion_scope"]["ineligible_rounds"] == [5,6]

          text = Path("index.html").read_text(encoding="utf-8")

          def block(marker):
              start = text.find(marker)
              assert start >= 0, marker
              open_idx = text.find("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_idx
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i+1 < len(text) else ""
                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      i += 1
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise AssertionError(marker)

          protected = {
              "pickValue": block("function pickValue("),
              "valueUncertaintyForPlayer":
                  block("function valueUncertaintyForPlayer("),
              "packageAdjustmentAssessment":
                  block("function packageAdjustmentAssessment("),
              "tradeVerdictTotals":
                  block("function tradeVerdictTotals("),
              "tradeRobustnessVerdictClass":
                  block("function tradeRobustnessVerdictClass("),
          }

          hashes = {
              key: hashlib.sha256(value.encode()).hexdigest()
              for key, value in protected.items()
          }
          Path(
              os.environ["RUNNER_TEMP"],
              "phase4-protected.json",
          ).write_text(
              json.dumps(hashes, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("PASS: Phase 3 promotion boundary and protected production logic anchored.")
          PY

          sha256sum             scripts/artifacts/generated/value_uncertainty.json             research/trade-robustness-v1/trade_robustness_v1_phase3_pick_sensitivity_shadow.json             research/trade-robustness-v1/trade_robustness_v1_phase3_manifest.json             > "${RUNNER_TEMP}/phase4-immutable.sha256"

      - name: Preflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Extend Trade Robustness UI to supported picks
        shell: bash
        env:
          ASSESSMENT_B64: ""
          RENDER_B64: ""
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          assessment = base64.b64decode(
              os.environ["ASSESSMENT_B64"]
          ).decode("utf-8")
          render = base64.b64decode(
              os.environ["RENDER_B64"]
          ).decode("utf-8")

          def function_end(source, marker):
              start = source.find(marker)
              if start < 0:
                  raise RuntimeError(f"Missing function marker: {marker}")
              open_idx = source.find("{", start)
              if open_idx < 0:
                  raise RuntimeError(f"Missing function body: {marker}")

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_idx

              while i < len(source):
                  ch = source[i]
                  nxt = source[i+1] if i+1 < len(source) else ""

                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
                  i += 1

              raise RuntimeError(f"Unbalanced function: {marker}")

          # Replace the old assessment with the helper + new assessment.
          if "function tradeRobustnessPickEnvelope(" in text:
              h0, h1 = function_end(
                  text,
                  "function tradeRobustnessPickEnvelope(",
              )
              a0, a1 = function_end(
                  text,
                  "function tradeRobustnessAssessment(",
              )
              start = min(h0, a0)
              end = max(h1, a1)
          else:
              start, end = function_end(
                  text,
                  "function tradeRobustnessAssessment(",
              )

          text = text[:start] + assessment + "\n\n" + text[end:]

          r0, r1 = function_end(
              text,
              "function renderTradeRobustness(",
          )
          text = text[:r0] + render + "\n" + text[r1:]

          path.write_text(text, encoding="utf-8")
          print("PASS: Trade Robustness UI extended to eligible Round 1-4 picks.")
          PY

      - name: Write Phase 4 validator
        shell: bash
        env:
          VALIDATOR_B64: ""
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          out = Path(
              "research/trade-robustness-v1/"
              "trade_robustness_v1_phase4_pick_ui_validator.py"
          )
          out.write_bytes(
              base64.b64decode(os.environ["VALIDATOR_B64"])
          )
          compile(
              out.read_text(encoding="utf-8"),
              str(out),
              "exec",
          )
          print(f"Wrote {out}")
          PY

      - name: Verify protected production logic unchanged
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")

          def block(marker):
              start = text.find(marker)
              assert start >= 0, marker
              open_idx = text.find("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = open_idx
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i+1 < len(text) else ""
                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == "/" and nxt == "/":
                      line_comment = True
                      i += 2
                      continue
                  if ch == "/" and nxt == "*":
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', "`"):
                      quote = ch
                      i += 1
                      continue
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:i+1]
                  i += 1
              raise AssertionError(marker)

          actual = {
              "pickValue": block("function pickValue("),
              "valueUncertaintyForPlayer":
                  block("function valueUncertaintyForPlayer("),
              "packageAdjustmentAssessment":
                  block("function packageAdjustmentAssessment("),
              "tradeVerdictTotals":
                  block("function tradeVerdictTotals("),
              "tradeRobustnessVerdictClass":
                  block("function tradeRobustnessVerdictClass("),
          }
          actual = {
              key: hashlib.sha256(value.encode()).hexdigest()
              for key, value in actual.items()
          }

          expected = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "phase4-protected.json",
              ).read_text(encoding="utf-8")
          )

          assert actual == expected, (
              "A protected valuation/verdict function changed"
          )
          print("PASS: pick values, player uncertainty, package adjustment, and verdict math remain byte-identical.")
          PY

          sha256sum -c "${RUNNER_TEMP}/phase4-immutable.sha256"

      - name: Run Phase 4 validator and behavior tests
        run: >-
          python3
          research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_validator.py

      - name: Normalize generated Markdown whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "research/trade-robustness-v1/"
              "trade_robustness_v1_phase4_pick_ui_confirmation.md"
          )
          lines = path.read_text(encoding="utf-8").splitlines()
          path.write_text(
              "\n".join(line.rstrip() for line in lines).rstrip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify exact Phase 4 scope
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess

          allowed = {
              "index.html",
              "research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_validator.py",
              "research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_confirmation.json",
              "research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_confirmation.md",
              "research/trade-robustness-v1/trade_robustness_v1_phase4_manifest.json",
          }

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line.strip()
          }

          unexpected = actual - allowed
          assert not unexpected, f"Unexpected Phase 4 changes: {sorted(unexpected)}"
          assert "index.html" in actual
          print("PASS: exact display-only Phase 4 scope.")
          PY

          git diff --check

      - name: Postflight repository regression suite
        run: python3 scripts/validation/repo_regression_checks.py

      - name: Commit Phase 4 pick UI extension
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             index.html             research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_validator.py             research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_confirmation.json             research/trade-robustness-v1/trade_robustness_v1_phase4_pick_ui_confirmation.md             research/trade-robustness-v1/trade_robustness_v1_phase4_manifest.json

          git diff --cached --check
          git commit -m "Extend Trade Robustness to supported draft picks"
          git pull --rebase origin main
          git push origin main

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PASS: Trade Robustness V1 Phase 4 pick UI deployed cleanly."
