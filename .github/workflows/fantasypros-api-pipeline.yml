name: FantasyPros API Pipeline

# The real, full production pipeline for FantasyPros data (HOF-tier API
# access confirmed to return complete player populations, closing the
# earlier truncation/full-response question). Fetches real raw stats for
# QB/RB/WR/TE and the confirmed-working IDP labels (LB/DL/DB), scores
# them under this league's own exact validated formula, and writes
# separate raw/normalized outputs for auditability.
#
# OUTPUT-ONLY, same as every other pipeline in this project: does NOT
# touch index.html or live prod_mult values automatically.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasypros-api-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test before trusting real output
        run: python3 scripts/fantasypros_api_pipeline.py --selftest

      - name: Run the pipeline
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python3 scripts/fantasypros_api_pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fantasypros_api_raw_2026.json scripts/fantasypros_api_normalized_2026.json scripts/fantasypros_api_pipeline_report.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Run FantasyPros API pipeline"
          git push
