name: Rename L.O.G. Dynasty Trade Calculator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked brand sources
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_RUNTIME_BLOB="c683d93347f23b6ee64c4bd6e7cde52faefd84cb"
          EXPECTED_FA_BLOB="881871899ad697ec35ae6a8bd5ab52c880004161"

          ACTUAL_RUNTIME_BLOB="$(git hash-object scripts/team_utility_projection_runtime.js)"
          ACTUAL_FA_BLOB="$(git hash-object free-agent-board.html)"

          echo "Expected runtime: $EXPECTED_RUNTIME_BLOB"
          echo "Actual runtime:   $ACTUAL_RUNTIME_BLOB"
          echo "Expected FA board: $EXPECTED_FA_BLOB"
          echo "Actual FA board:   $ACTUAL_FA_BLOB"

          test "$ACTUAL_RUNTIME_BLOB" = "$EXPECTED_RUNTIME_BLOB"
          test "$ACTUAL_FA_BLOB" = "$EXPECTED_FA_BLOB"

      - name: Preserve rollback tag
        shell: bash
        env:
          BACKUP_TAG: pre-log-calculator-brand-rename-v1
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Rename calculator brand
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          old = "Claude Dynasty Trade Calculator"
          new = "L.O.G. DYNASTY TRADE CALCULATOR"

          files = [
              Path("scripts/team_utility_projection_runtime.js"),
              Path("free-agent-board.html"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one old brand string, found {count}"
                  )

              text = text.replace(old, new, 1)

              if old in text:
                  raise RuntimeError(f"{path}: old brand string still present")

              if text.count(new) != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one new brand string"
                  )

              path.write_text(text, encoding="utf-8")
              print(f"PASS {path}: {old} -> {new}")
          PY

      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Validate Free Agent Board valuation parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync/sync_free_agent_valuation.py --check

      - name: Validate brand consistency
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          new = "L.O.G. DYNASTY TRADE CALCULATOR"
          old = "Claude Dynasty Trade Calculator"

          for filename in [
              "scripts/team_utility_projection_runtime.js",
              "free-agent-board.html",
          ]:
              text = Path(filename).read_text(encoding="utf-8")

              if new not in text:
                  raise SystemExit(f"{filename}: new brand missing")

              if old in text:
                  raise SystemExit(f"{filename}: old brand still present")

              print(f"PASS {filename}: brand consistent")
          PY

          git diff --check
          git status --short

      - name: Commit brand rename
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/team_utility_projection_runtime.js \
            free-agent-board.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          EXPECTED="$(printf '%s\n' \
            'free-agent-board.html' \
            'scripts/team_utility_projection_runtime.js')"

          test "$CHANGED" = "$EXPECTED"

          git commit -m "Rename calculator to L.O.G. Dynasty Trade Calculator"
          git push origin HEAD:main
