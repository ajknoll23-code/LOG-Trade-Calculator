name: Opportunity V2 Phase 5 Prospective

# Research-only prospective evaluation of the frozen opportunity bridge family.
# The first successful run freezes the preseason candidate values.
# Later runs grade those exact values against completed 2026 weeks.
#
# This workflow never changes index.html, ROLE_MULT, Production V2,
# Market Value, or any deployed player value.
on:
  workflow_dispatch:
  schedule:
    # After Tuesday full refresh (15:00), No-History (16:30), and Age Curve (17:00).
    - cron: '30 17 * * 2'

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

jobs:
  prospective-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Phase 5 self-test
        run: python3 research/opportunity-v2/opportunity_v2_phase5_prospective_evaluator.py --selftest

      - name: Freeze preseason opportunity candidates if needed and evaluate
        run: python3 research/opportunity-v2/opportunity_v2_phase5_prospective_evaluator.py --freeze --write

      - name: Verify frozen candidates and prospective outputs
        run: python3 research/opportunity-v2/opportunity_v2_phase5_prospective_evaluator.py --check

      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/opportunity-v2/opportunity_v2_phase5_frozen_candidates.json
          git add research/opportunity-v2/opportunity_v2_phase5_evaluation.json
          git add research/opportunity-v2/opportunity_v2_phase5_evaluation.md
          git diff --staged --quiet || git commit -m "Update Opportunity V2 Phase 5 prospective research"
          git push
