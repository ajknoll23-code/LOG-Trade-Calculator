name: Draft Pick FV V8.1 - Phase 2 2024 H2 Independent Confirmation

"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: draft-pick-fv-v8-1-phase2-2024-h2-independent-confirmation
  cancel-in-progress: false

jobs:
  prepare_holdout_source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact study base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install frozen transport dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Guard V8.1 authorization and one-time H2 state
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.json)" =             "8c787d2330ffd1d92fa0173479d7cb361133e796"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration_manifest.json)" =             "008d48f1f6f4547958a0a8c66577bf9dd3eb0180"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase1_sparse_tail_sensitivity.json)" =             "c846f0a690c13ae9eff4dc0502e20bf24e056772"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v8-1/v8_1_phase1_sparse_tail_sensitivity_manifest.json)" =             "22fe7f5869893395eae4832269be0c16395a6b45"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json)" =             "42e4fa45d3a0715be281dd3cdf90ba13d1b418ff"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v5/r1_r2_bridge_preregistration_v5.json)" =             "b52aca0a7a0313c35065850273f80e9df684fe2d"
          test "$(git rev-parse HEAD:scripts/validation/snapshot_values.py)" =             "1efca4c35e910a95974c1bec0b06a106196618b3"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v6/r1_r4_holdout_2024_pick_identity_v6_1.jsonl)" =             "6032ad3104e7a19f2ff35e10bb06ed30413f1ddb"
          test "$(git rev-parse HEAD:research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json)" =             "e15e6d776f12784fa74c603f016e8ff7dd805311"

          test "$(sha256sum research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.json | awk '{print $1}')" =             "6b5bd4c70f6e781ff322a2ca6d6672d8b114ec5b4a464e7143f12a4c98d4cb0f"
          test "$(sha256sum research/draft-pick-fv-v8-1/v8_1_phase1_sparse_tail_sensitivity.json | awk '{print $1}')" =             "c2b80bdc38dbe4b9280eb9da4e8addde6c7101b8d63832cb14f3f5d7df9dc38a"
          test "$(sha256sum research/draft-pick-fv-v6/r1_r4_holdout_2024_pick_identity_v6_1.jsonl | awk '{print $1}')" =             "f59e61ee2361c084dd1d59297830493ab9b17337890f82a44990a6ec33d83124"
          test "$(sha256sum research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json | awk '{print $1}')" =             "904f64e1fc5d71fc62dbdc56f3d286cabddb59e10ea9cfd5541d07b08b77d064"

          for p in             research/draft-pick-fv-v8-1/v8_1_phase2_2024_holdout_source_identity.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.py
          do
            test ! -e "$p" || {
              echo "ERROR: V8.1 H2 has already been opened/frozen: $p"
              exit 1
            }
          done

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10996305170" --jq '.digest // ""')" =             "sha256:93aed54893b854e11a895b350c2e8021f71ebc08ac97f8260e324dffea870e6a"

          python3 - <<'PY2'
          import hashlib
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")
          p=json.loads((d/"v8_1_carryforward_preregistration.json").read_text())
          pm=json.loads((d/"v8_1_carryforward_preregistration_manifest.json").read_text())
          s=json.loads((d/"v8_1_phase1_sparse_tail_sensitivity.json").read_text())
          sm=json.loads((d/"v8_1_phase1_sparse_tail_sensitivity_manifest.json").read_text())

          assert p["decision"]=="FREEZE_V8_1_C1_CARRYFORWARD_SPARSE_SENSITIVITY_NEXT"
          assert p["frozen_primary_candidate"]["k"]==0.3557942893
          assert p["frozen_primary_candidate"]["primary_candidate_refit_after_this_freeze_allowed"] is False
          assert p["phase2_2024_h2_independent_confirmation"]["open_exactly_once"] is True
          assert p["phase2_2024_h2_independent_confirmation"]["candidate_refit_allowed"] is False
          assert p["phase2_2024_h2_independent_confirmation"]["can_authorize_production"] is False

          assert s["decision"]=="PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE"
          assert s["status"]=="SPARSE_TAIL_SENSITIVITY_PASS"
          assert s["sparse_sensitivity_gate_pass"] is True
          assert s["2024_H2_outcome_open_authorized_next_stage"] is True
          assert s["2024_holdout_rookie_outcomes_read"] is False
          assert s["2024_holdout_outcomes_remain_sealed"] is True
          assert s["primary_candidate_refit_or_changed"] is False
          assert s["variant_n"]==7 and all(v["pass"] for v in s["variants"])

          assert sm["result_sha256"]==hashlib.sha256(
              (d/"v8_1_phase1_sparse_tail_sensitivity.json").read_bytes()
          ).hexdigest()
          assert sm["next_stage"]=="draft-pick-fv-v8-1-phase2-2024-h2-independent-confirmation"
          assert sm["2024_H2_outcome_open_authorized_next_stage"] is True
          assert pm["2024_holdout_outcomes_read"] is False
          assert pm["production_change_authorized"] is False

          print("PASS: official Phase 1 authorizes the one-time independent 2024 H2 opening.")
          PY2

      - name: Download exact pre-outcome V7 R1-R6 identity engine assets
        shell: bash
        run: |
          set -euo pipefail
          A="${RUNNER_TEMP}/v7assets"
          mkdir -p "$A"

          RUN_ID="36030009148"
          ARTIFACT_ID="10821375528"
          EXPECTED_DIGEST="sha256:adac4d23b2e945e2f95ce5d56ea31ec66eb1d4824d77c03f7b927ea85a9c371f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest // ""')" = "$EXPECTED_DIGEST"

          gh run download "$RUN_ID"             --repo "$GITHUB_REPOSITORY"             -n "v7-phase2-engine-assets"             -D "$A"

          test "$(sha256sum "$A/build_r1_r6_source_identity_v7.py" | awk '{print $1}')" =             "0231b81424e7e04dfc77bb37888290cb55d506cedcc1b44b8737eb1ca903cc79"
          test "$(sha256sum "$A/db_playerids.csv" | awk '{print $1}')" =             "0174ea890e71d33fa0afc1b846ce1c92273542278a287b6bd52c3a4aa5edce73"
          test "$(sha256sum "$A/nflverse_players.csv" | awk '{print $1}')" =             "4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"
          test "$(sha256sum "$A/r1_r6_identity_asset_manifest_v7.json" | awk '{print $1}')" =             "e53d59cc65c37f5b36acba17fb6a83d2d7c8344eec5aebadbbee39a516aedb9e"

      - name: Rehydrate exact pre-outcome source workspace
        shell: bash
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/source-workspace"
          rm -rf "$W"
          mkdir -p "$W"
          git archive HEAD | tar -x -C "$W"

          # The live repository crosswalk has legitimately evolved since the
          # pre-outcome V7 identity freeze. Rehydrate the exact frozen blob in
          # an isolated workspace; do not mutate the checkout or current production data.
          git cat-file -e ed34038ee0c711861616ed01219e458520c11867^{blob}
          git cat-file blob ed34038ee0c711861616ed01219e458520c11867             > "$W/scripts/identity_crosswalk.json"

          test "$(sha256sum "$W/scripts/identity_crosswalk.json" | awk '{print $1}')" =             "697899f4d98adb2bd08a6774ea41355b09fe2dbc1956e442b256d5a9445ff132"
          test "$(sha256sum "$W/research/draft-pick-fv-v6/build_r1_r4_source_identity_v6_1.py" | awk '{print $1}')" =             "1a0cb15c06d8b26ea33f8cebef0579746555a38a52bc17355a4cca0351e2cf8c"
          test "$(sha256sum "$W/research/draft-pick-fv-v6/r1_r4_source_catalog_v6_1.json" | awk '{print $1}')" =             "904f64e1fc5d71fc62dbdc56f3d286cabddb59e10ea9cfd5541d07b08b77d064"
          test "$(sha256sum "$W/research/draft-pick-fv-v7/r1_r6_full_scale_preregistration_v7.json" | awk '{print $1}')" =             "585e1f64c717edb1d60dd27bef88f08b99887d2e730a626ee3dfee0a5bc6b70b"

      - name: Rebuild only the exact ten frozen 2024 full-72 leagues
        shell: bash
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/source-workspace"
          A="${RUNNER_TEMP}/v7assets"
          H="${RUNNER_TEMP}/holdout"
          mkdir -p "$H"

          cd "$W"
          python3 "$A/build_r1_r6_source_identity_v7.py" --guard
          python3 "$A/build_r1_r6_source_identity_v7.py"             --holdout-2024             --dp "$A/db_playerids.csv"             --nflverse "$A/nflverse_players.csv"             --asset-manifest "$A/r1_r6_identity_asset_manifest_v7.json"             --out "$H/holdout_2024.json"

      - name: Independently validate pre-outcome 2024 source replay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import json
          import math
          import os
          from collections import defaultdict
          from pathlib import Path

          expected=("10302","21269","23907","48514","64635","65168","65200","68399","70523","74598")
          h=json.loads((Path(os.environ["RUNNER_TEMP"])/"holdout/holdout_2024.json").read_text())

          assert h["stage"]=="phase2_holdout_2024_r1_r6_source_identity"
          assert h["draft_year"]==2024
          assert h["holdout_2024_search_performed"] is False
          assert h["holdout_2024_replacement_or_substitution_used"] is False
          assert h["holdout_2024_contamination_reclassification_used"] is False
          assert h["frozen_V6_clean_league_n"]==41
          assert h["frozen_V6_full72_league_n"]==10
          assert h["clean_full72_league_n"]==10
          assert h["minimum_clean_full72_leagues"]==8
          assert h["source_count_gate_pass"] is True
          assert h["source_identity_gate_pass"] is True
          assert tuple(sorted((str(x["league_id"]) for x in h["clean_leagues"]),key=int))==expected

          for k in (
              "historical_player_outcomes_read","holdout_2024_outcomes_read",
              "market_or_ktc_values_read","package_vote_data_read",
              "candidate_fit_performed","candidate_scores_computed",
              "candidate_selection_performed","production_change_authorized",
          ):
              assert h[k] is False,k

          d=h["diagnostics"]
          assert d["retention_gate_pass"] is True
          assert d["identity_gate_pass"] is True
          assert d["sleeper_gate_pass"] is True
          assert d["overall_identity_coverage"]>=.95
          assert d["overall_sleeper_ready_coverage"]>=.95
          assert d["weight_normalization_proved"] is True
          assert len(d["cell_year"])==18

          cw=defaultdict(float); sw=0.0
          rebuilt={}
          for r in h["occurrences"]:
              lid=str(r["league_id"]); slot=int(r["overall_slot"])
              assert lid in expected and 1<=slot<=72
              cw[r["cell"]]+=float(r["cell_weight_v7"])
              sw+=float(r["source_weight_r1_r6_v7"])
              if slot<=48: rebuilt[(lid,slot)]=r
          assert len(cw)==18
          assert all(math.isclose(v,1.0,abs_tol=1e-10) for v in cw.values())
          assert math.isclose(sw,1.0,abs_tol=1e-10)

          frozen={}
          p=Path("research/draft-pick-fv-v6/r1_r4_holdout_2024_pick_identity_v6_1.jsonl")
          for line in p.open():
              if not line.strip(): continue
              r=json.loads(line); lid=str(r["league_id"]); slot=int(r["overall_slot"])
              if lid in expected and slot<=48: frozen[(lid,slot)]=r
          assert set(frozen)==set(rebuilt)
          fields=("mfl_player_id","franchise_id","round","within_round_pick")
          for key in frozen:
              for field in fields:
                  assert str(frozen[key].get(field) or "")==str(rebuilt[key].get(field) or ""),(key,field)

          print(f"PASS: exact ten frozen leagues reconstructed; retained={len(h['occurrences'])}/720; first48={len(frozen)} exact.")
          print("2024_OUTCOMES_READ=false")
          print("NEW_2024_SEARCH=false")
          PY2

      - name: Upload sealed 2024 source reconstruction
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-p2-2024-holdout-source
          path: ${{ runner.temp }}/holdout/holdout_2024.json
          if-no-files-found: error
          retention-days: 30

  h2_confirmation:
    needs: prepare_holdout_source
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact H2 study base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_holdout_source.outputs.base_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install frozen runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir "requests==2.34.2"

      - name: Recheck one-time H2 opening authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare_holdout_source.outputs.base_sha }}"
          for p in             research/draft-pick-fv-v8-1/v8_1_phase2_2024_holdout_source_identity.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.py
          do
            test ! -e "$p" || { echo "ERROR: H2 already frozen: $p"; exit 1; }
          done
          python3 - <<'PY2'
          import json
          from pathlib import Path
          s=json.loads(Path("research/draft-pick-fv-v8-1/v8_1_phase1_sparse_tail_sensitivity.json").read_text())
          assert s["decision"]=="PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE"
          assert s["2024_H2_outcome_open_authorized_next_stage"] is True
          assert s["2024_holdout_outcomes_remain_sealed"] is True
          print("PASS: H2 opening remains authorized and has not been frozen previously.")
          PY2

      - name: Download same-run frozen 2024 source reconstruction
        uses: actions/download-artifact@v4
        with:
          name: v8-1-p2-2024-holdout-source
          path: ${{ runner.temp }}/holdout

      - name: Download exact pre-H2 frozen outcome assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p             "${RUNNER_TEMP}/p2"             "${RUNNER_TEMP}/p2engine"             "${RUNNER_TEMP}/s24"             "${RUNNER_TEMP}/s25"             "${RUNNER_TEMP}/v7assets"

          check_artifact() {
            local id="$1" expected="$2"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" --jq '.digest // ""')" = "$expected"
          }

          check_artifact 10991550072 "sha256:850b20bef3eea86fcc5a06f75642433b15220ee8da7a6a0acab2d26b71795021"
          check_artifact 10991043339 "sha256:5970fc12d0ba86e0db3299c77d4814bb767de26d22e90ce74c00ffa3b8bf43a7"
          check_artifact 10990914288 "sha256:ab726925b38e5658c31efcb280c74ed8611e0d62304ed341d0578136d565048f"
          check_artifact 10990974268 "sha256:8e8b9046f756235c119c78255a6077df14b0964e93c4a248449020e59dbe6dc7"
          check_artifact 10821375528 "sha256:adac4d23b2e945e2f95ce5d56ea31ec66eb1d4824d77c03f7b927ea85a9c371f"

          gh run download 36469782185 --repo "$GITHUB_REPOSITORY"             -n "v8-p2-historical-outcome-harvest-closeout" -D "${RUNNER_TEMP}/p2"
          gh run download 36469782185 --repo "$GITHUB_REPOSITORY"             -n "v8-p2-engine" -D "${RUNNER_TEMP}/p2engine"
          gh run download 36469782185 --repo "$GITHUB_REPOSITORY"             -n "v8-p2-season-2024" -D "${RUNNER_TEMP}/s24"
          gh run download 36469782185 --repo "$GITHUB_REPOSITORY"             -n "v8-p2-season-2025" -D "${RUNNER_TEMP}/s25"
          gh run download 36030009148 --repo "$GITHUB_REPOSITORY"             -n "v7-phase2-engine-assets" -D "${RUNNER_TEMP}/v7assets"

          test "$(sha256sum "${RUNNER_TEMP}/p2/v8_phase2_historical_outcome_summary.json" | awk '{print $1}')" =             "24c4d5b3d3681ab5774e27b8da18417bf7d786972c765240862533abfde1557c"
          test "$(sha256sum "${RUNNER_TEMP}/p2/v8_phase2_historical_outcome_manifest.json" | awk '{print $1}')" =             "c54238258e60412b9e8879b5bd6df4928615d260ec72080e2c4d631b011b7758"
          test "$(sha256sum "${RUNNER_TEMP}/p2/v8_phase2_replacement_baselines.json" | awk '{print $1}')" =             "a849ecf4d438e06be3cf0526e2ba38b12e6149b80919007342414524d2b1849a"
          test "$(sha256sum "${RUNNER_TEMP}/p2engine/v8_phase2_outcomes.py" | awk '{print $1}')" =             "647a41bb46fa3391e512f079bf0ed0c7afa32fd0a14d733bc78e3cd2d40285db"
          test "$(sha256sum "${RUNNER_TEMP}/s24/season_2024.json" | awk '{print $1}')" =             "8488cbc3174e51a28759ec01b8734269e7e7426d38e8db2c8045972c37350e2d"
          test "$(sha256sum "${RUNNER_TEMP}/s25/season_2025.json" | awk '{print $1}')" =             "f592f625653d9e20b720665e11de43f28a0975b0c3c35a8069eb33e719385d0a"
          test "$(sha256sum "${RUNNER_TEMP}/v7assets/nflverse_players.csv" | awk '{print $1}')" =             "4dd70f328f31b0bb7cbf043412298d5a325863e27b8f2eeea22c9e925c808dee"

          python3 - <<'PY2'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          for season in (2024,2025):
              p=root/("s24" if season==2024 else "s25")/f"season_{season}.json"
              d=json.loads(p.read_text())
              assert d["season"]==season
              assert d["availability_pass"] is True
              assert d["historical_player_outcomes_read"] is True
              assert d["holdout_2024_pick_identity_file_read"] is False
              assert d["holdout_2024_rookie_outcomes_scored"] is False
              assert d["candidate_fit_performed"] is False
              assert d["production_change_authorized"] is False
          print("PASS: exact 2024/2025 outcome bytes were frozen before the rookie holdout was opened.")
          PY2

      - name: Build frozen V8.1 H2 confirmation engine
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/v8_1_phase2_2024_h2_confirmation.py" <<'PY2'
          from __future__ import annotations
          
          import argparse
          import hashlib
          import importlib.util
          import json
          import math
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any
          
          CELLS = tuple(f"r{r}_{t}" for r in range(1, 7) for t in ("early", "mid", "late"))
          TIERS = ("early", "mid", "late")
          ROUNDS = tuple(range(1, 7))
          EXPECTED_HOLDOUT_LEAGUES = (
              "10302", "21269", "23907", "48514", "64635",
              "65168", "65200", "68399", "70523", "74598",
          )
          EPS = 1e-12
          
          
          class GateError(RuntimeError):
              pass
          
          
          def now() -> str:
              return datetime.now(timezone.utc).isoformat()
          
          
          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def load(path: Path) -> Any:
              return json.loads(path.read_text())
          
          
          def read_jsonl(path: Path) -> list[dict[str, Any]]:
              out: list[dict[str, Any]] = []
              with path.open() as f:
                  for n, line in enumerate(f, 1):
                      if not line.strip():
                          continue
                      try:
                          x = json.loads(line)
                      except json.JSONDecodeError as exc:
                          raise GateError(f"{path}:{n}: invalid JSONL") from exc
                      if not isinstance(x, dict):
                          raise GateError(f"{path}:{n}: row is not object")
                      out.append(x)
              return out
          
          
          def write_json(path: Path, obj: Any) -> None:
              path.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n")
          
          
          def write_jsonl(path: Path, rows: list[dict[str, Any]]) -> None:
              with path.open("w") as f:
                  for row in rows:
                      f.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")
          
          
          def import_file(path: Path, name: str):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise GateError(f"cannot import {path}")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod
          
          
          def finite(v: Any) -> bool:
              try:
                  return math.isfinite(float(v))
              except (TypeError, ValueError):
                  return False
          
          
          def rel(new: float, base: float) -> float:
              if base <= 0:
                  if abs(new - base) <= 1e-12:
                      return 0.0
                  raise GateError("relative comparison has nonpositive baseline")
              return (new - base) / base
          
          
          def baseline_cells(prereg: dict[str, Any]) -> dict[str, float]:
              d = prereg["frozen_primary_candidate"]["deployed_pick_base_2027"]
              return {
                  f"r{r}_{t}": float(d[str(r)][t])
                  for r in ROUNDS
                  for t in TIERS
              }
          
          
          def candidate_cells(prereg: dict[str, Any]) -> dict[str, float]:
              d = prereg["frozen_primary_candidate"]["frozen_candidate_pick_base_2027"]
              return {
                  f"r{r}_{t}": float(d[str(r)][t])
                  for r in ROUNDS
                  for t in TIERS
              }
          
          
          def validate_contracts(prereg: dict[str, Any], phase1: dict[str, Any]) -> None:
              assert prereg["decision"] == "FREEZE_V8_1_C1_CARRYFORWARD_SPARSE_SENSITIVITY_NEXT"
