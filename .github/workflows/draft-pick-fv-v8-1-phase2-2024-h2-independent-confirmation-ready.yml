            git checkout -- "$TU_JSON" "$TU_MD" 2>/dev/null || true
          }
          trap restore_tu EXIT

          if test -f scripts/projections/build_team_utility_lineup_projections.py; then
            python3 scripts/projections/build_team_utility_lineup_projections.py --write
          fi
          python3 scripts/validation/check_package_adjustment_live.py
          python3 scripts/validation/repo_regression_checks.py

          restore_tu
          trap - EXIT

      - name: Re-prove deployed Draft Pick contract unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          text=Path("index.html").read_text()
          expected=[
              "  1: {early:7500, mid:5854, late:5244},",
              "  2: {early:3906, mid:3624, late:3291},",
              "  3: {early:2692, mid:2682, late:2319},",
              "  4: {early:1972, mid:1831, late:1689},",
              "  5: {early:1414, mid:1250, late:1118},",
              "  6: {early:1014, mid:853,  late:740},",
              "const YEAR_DISCOUNT = { '2027':1.0, '2028':0.85, '2029':0.72 };",
          ]
          for needle in expected:
              assert needle in text,needle
          print("PASS: production PICK_BASE and YEAR_DISCOUNT remain unchanged.")
          PY2

      - name: Upload frozen H2 confirmation artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-1-p2-2024-h2-independent-confirmation
          path: |
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_holdout_source_identity.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json
            research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.py
          if-no-files-found: error
          retention-days: 30

      - name: Commit frozen H2 result
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare_holdout_source.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during the one-time H2 confirmation."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             research/draft-pick-fv-v8-1/v8_1_phase2_2024_holdout_source_identity.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_scored_occurrences.jsonl             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.md             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation_manifest.json             research/draft-pick-fv-v8-1/v8_1_phase2_2024_h2_confirmation.py

          git diff --cached --quiet && { echo "ERROR: no H2 artifacts staged."; exit 1; }
          git commit -m "Freeze Draft Pick FV V8.1 2024 H2 independent confirmation"
          git push origin HEAD:main
          echo "PASS: V8.1 2024 H2 independent confirmation frozen to main."
