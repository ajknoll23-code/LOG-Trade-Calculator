# QF4 V2: A4-F02 safe HTML output production gate.
# Upload ONLY this YAML to .github/workflows/QF4-v2.yml on main.
# DEFAULT preflight: read-only. Separate owner-approved mode=promote required
# for the ONLY job which can write reviewed index.html to main.
# Pinned QF4 V1R1 review run 38110061492 and one-file review commit 2b19f230.
name: QF4 V2 - Safe HTML Production Preflight and Explicit Promotion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight is READ-ONLY; promote updates live main index.html'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - promote
      confirmation:
        description: 'For promote ONLY: type PROMOTE_QF4_V1R1_TO_MAIN (blank for preflight)'
        required: false
        type: string
        default: ''

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  QF4_BASE: '9a39457f8f0a61519d01bbcbfd0172b26608f977'
  QF4_REVIEW_BRANCH: 'qf4-a4f02-v1r1-review-2026-10-10'
  QF4_REVIEW_SHA: '2b19f2309fdc7bcacfde32d4f2bbc863d98816f8'
  QF4_ORIGINAL_INDEX_BLOB: 'd831dd65efa1e68d2e69899a9736fce3a37c1db6'
  QF4_PATCHED_INDEX_BLOB: '2666f7f8b167e48b7d1571ab527450b521d32c75'
  EXPECTED_MAIN_CHANGE: '.github/workflows/QF4-v2.yml'

jobs:
  qf4-production-preflight:
    name: Validate exact approved HTML in disposable runner; do not deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact triggering main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing repository regression dependency
        run: python3 -m pip install requests
      - name: Fail closed if source, candidate, refs or owner authorization drift
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || { echo 'STOP: main only'; exit 1; }
          [[ "${RELEASE_MODE}" == preflight || "${RELEASE_MODE}" == promote ]] || { echo 'STOP: unknown mode'; exit 1; }
          if [[ "${RELEASE_MODE}" == promote ]]; then
            [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF4_V1R1_TO_MAIN' ]] || {
              echo 'STOP: owner promotion confirmation was not supplied exactly'; exit 1;
            }
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF4_REVIEW_BRANCH}:refs/remotes/origin/${QF4_REVIEW_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'STOP: wrong checkout'; exit 1; }
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP: main moved'; exit 1; }
          [[ "$(git rev-parse origin/${QF4_REVIEW_BRANCH})" == "${QF4_REVIEW_SHA}" ]] || { echo 'STOP: reviewed branch moved'; exit 1; }
          [[ "$(git rev-parse "${QF4_REVIEW_SHA}^")" == "${QF4_BASE}" ]] || { echo 'STOP: unreviewed branch ancestry'; exit 1; }
          [[ "$(git hash-object index.html)" == "${QF4_ORIGINAL_INDEX_BLOB}" ]] || { echo 'STOP: production HTML drift'; exit 1; }
          [[ "$(git rev-parse "${QF4_REVIEW_SHA}:index.html")" == "${QF4_PATCHED_INDEX_BLOB}" ]] || { echo 'STOP: approved HTML blob changed'; exit 1; }
          [[ "$(git diff --name-only "${QF4_BASE}" "${QF4_REVIEW_SHA}")" == index.html ]] || { echo 'STOP: review changed other tracked files'; exit 1; }
          [[ "$(git diff --name-only "${QF4_BASE}" HEAD)" == "${EXPECTED_MAIN_CHANGE}" ]] || { echo 'STOP: main changed beyond this uploaded workflow'; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'STOP: dirty runner'; git status --short; exit 1; }
          echo "PASS pinned QF4 main, reviewed branch, immutable blobs; mode=${RELEASE_MODE}"
      - name: Stage exact reviewed HTML locally only (never push during preflight)
        shell: bash
        run: |
          set -euo pipefail
          git show "${QF4_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "${QF4_PATCHED_INDEX_BLOB}" ]] || { echo 'STOP: staged bytes differ'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP: unapproved tracked file modified'; exit 1; }
          git diff --check
          echo 'PASS exact reviewed HTML loaded into disposable working tree; main untouched'
      - name: Rerun identical passed V1R1 hostile-input security fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          # The original QF4 V1R1 reviewed workflow is immutable under the
          # commit/changed-files gates, so reuse the EXACT successful security
          # test body rather than silently weakening the reviewed fixture.
          workflow = Path('.github/workflows/QF4-v1r1.yml').read_text(encoding='utf-8')
          heading = '      - name: Run hostile input behavior fixtures and protected-source checks\n'
          next_heading = '      - name: Run full repository IDP FA and package regressions\n'
          assert workflow.count(heading) == 1 and workflow.count(next_heading) == 1
          block = workflow.split(heading,1)[1].split(next_heading,1)[0]
          assert block.startswith('        shell: bash\n        run: |\n')
          body = block.split('        run: |\n',1)[1]
          lines = body.splitlines()
          assert lines and all(not line.strip() or line.startswith('          ') for line in lines)
          script = '\n'.join(line[10:] if line.strip() else '' for line in lines) + '\n'
          assert "python3 - <<'PY'" in script
          assert 'hostile input output encoding' in script
          assert 'HTMLParser' in script
          with tempfile.NamedTemporaryFile('w',suffix='.sh',delete=False,encoding='utf-8') as f:
            f.write(script)
            path=f.name
          try:
            subprocess.run(['bash',path],check=True)
          finally:
            Path(path).unlink(missing_ok=True)
          print('PASS exactly reused QF4 V1R1 hostile-input security test')
          PY
      - name: Run full existing repository and protected science regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_free_agent_valuation_parity.py
          python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts/validation')
          import validate_idp_v1_final_deployment as v
          r=v.validate_deployment()
          assert r['actual_changed_entry_count']==320, 'STOP: frozen IDP changed-count drift'
          print('PASS frozen IDP 320 approved changes')
          PY
      - name: Final fail-closed byte and tracked-file verification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object index.html)" == "${QF4_PATCHED_INDEX_BLOB}" ]] || { echo 'STOP: regression mutated candidate'; exit 1; }
          [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP: regressions modified extra files'; git status --short; exit 1; }
          git diff --check
          echo 'QF4 PREFLIGHT GREEN: exact candidate and hostile fixture passed; main NOT updated.'

  qf4-explicit-production-promotion:
    name: Deploy exact candidate only after separate confirmed promote run
    needs: qf4-production-preflight
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout same original main SHA preflight validated
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Revalidate explicit owner confirmation, exact source and moving refs
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || exit 1
          [[ "${RELEASE_CONFIRMATION}" == 'PROMOTE_QF4_V1R1_TO_MAIN' ]] || { echo 'STOP: no exact owner promotion approval'; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "+refs/heads/${QF4_REVIEW_BRANCH}:refs/remotes/origin/${QF4_REVIEW_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || exit 1
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo 'STOP: main advanced after preflight'; exit 1; }
          [[ "$(git rev-parse origin/${QF4_REVIEW_BRANCH})" == "${QF4_REVIEW_SHA}" ]] || exit 1
          [[ "$(git rev-parse "${QF4_REVIEW_SHA}^")" == "${QF4_BASE}" ]] || exit 1
          [[ "$(git hash-object index.html)" == "${QF4_ORIGINAL_INDEX_BLOB}" ]] || exit 1
          [[ "$(git rev-parse "${QF4_REVIEW_SHA}:index.html")" == "${QF4_PATCHED_INDEX_BLOB}" ]] || exit 1
          [[ "$(git diff --name-only "${QF4_BASE}" "${QF4_REVIEW_SHA}")" == 'index.html' ]] || exit 1
          [[ "$(git diff --name-only "${QF4_BASE}" HEAD)" == "${EXPECTED_MAIN_CHANGE}" ]] || exit 1
          [[ -z "$(git status --porcelain)" ]] || exit 1
          git show "${QF4_REVIEW_SHA}:index.html" > index.html
          [[ "$(git hash-object index.html)" == "${QF4_PATCHED_INDEX_BLOB}" ]] || exit 1
          [[ "$(git diff --name-only)" == 'index.html' ]] || exit 1
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          [[ "$(git diff --cached --name-only)" == 'index.html' ]] || exit 1
          git diff --cached --check
          git commit -m 'QF4 A4-F02: promote reviewed safe HTML output encoding'
          git push origin HEAD:refs/heads/main
          echo "QF4 PROMOTED TO MAIN: $(git rev-parse HEAD)"
          echo "REVIEWED INDEX BLOB: ${QF4_PATCHED_INDEX_BLOB}"
          echo "ROLLBACK SOURCE INDEX BLOB: ${QF4_ORIGINAL_INDEX_BLOB}"
