name: B41C3 Player Role Engine V2 - Untouched Week 4 Scorer Confirmation

'on':
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  untouched_week4_confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'requests>=2.32,<3'

      - name: Verify frozen B41C3 contract before any Week 4 read
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path('research/player-role-v2')
          prereg_path = base / 'player_role_v2_b41c2_scorer_recovery_preregistration.json'
          decision_path = base / 'player_role_v2_b41c2_scientific_decision.json'
          scorer_path = base / 'player_role_v2_b41c2_target_scorer.py'
          amendment_path = base / 'player_role_v2_b41d_development_gate_amendment.json'
          b41f_path = base / 'player_role_v2_b41f_final_model_snapshot.json'
          scoring_path = base / 'player_role_v2_b41c_league_scoring_snapshot.json'

          for path in [prereg_path, decision_path, scorer_path, amendment_path, b41f_path, scoring_path]:
              if not path.exists():
                  raise RuntimeError(f'B41C3_REQUIRED_FILE_MISSING {path}')

          prereg = json.loads(prereg_path.read_text(encoding='utf-8'))
          decision = json.loads(decision_path.read_text(encoding='utf-8'))
          amendment = json.loads(amendment_path.read_text(encoding='utf-8'))
          b41f = json.loads(b41f_path.read_text(encoding='utf-8'))
          scoring = json.loads(scoring_path.read_text(encoding='utf-8'))

          # B41C3 itself is frozen against the exact committed pre-Week-4 evidence.
          expected_git_blobs = {
              prereg_path: 'db8a30e1d056f8a3000d5164f53f7ea5016e5194',
              decision_path: '0000317c67f966f4ceaccd81b6343b6b475f1283',
              scorer_path: '9b5ba8edd4430bd62b713be71e03fda3d39cab96',
              amendment_path: '9878ec4d9620c05880329533d0f6ee4b4dcb1919',
              b41f_path: 'd1ac822c29bfe31e9e1a9418b443ef1124b42413',
              scoring_path: '8e350fc927417d2f8afceb5b42545e48e3622fff',
          }
          for path, expected_blob in expected_git_blobs.items():
              payload = path.read_bytes()
              actual_blob = hashlib.sha1(
                  f'blob {len(payload)}\0'.encode() + payload
              ).hexdigest()
              if actual_blob != expected_blob:
                  raise RuntimeError(
                      f'B41C3_PREVALIDATION_GIT_BLOB_DRIFT {path} '
                      f'expected={expected_blob} actual={actual_blob}'
                  )

          for existing in [
              base / 'player_role_v2_b41c3_week4_scorer_validation.json',
              base / 'player_role_v2_b41c3_scientific_decision.json',
              base / 'player_role_v2_b41c3_report.md',
          ]:
              if existing.exists():
                  raise RuntimeError(
                      f'B41C3_ALREADY_OPENED_REFUSING_SECOND_CONFIRMATORY_EVALUATION {existing}'
                  )

          scorer_sha = hashlib.sha256(scorer_path.read_bytes()).hexdigest()
          expected_sha = 'cbc8548eb0dac7d6f8a95717925487e746605627f674c0a04637771c21e54e6b'

          assert prereg['frozen_b41c2_scorer_sha256'] == expected_sha
          assert decision['b41c2_scorer_sha256'] == expected_sha
          assert scorer_sha == expected_sha

          gate = prereg['week4_confirmatory_gate_preregistered_now']
          assert gate == {
              'absolute_tolerance_points': 0.011,
              'if_fail': 'scientific STOP; new versioned scorer recovery required',
              'if_pass': 'B41D development model fitting may become eligible',
              'required_compared_player_weeks': 150,
              'required_fraction_within_tolerance': 0.995,
              'required_max_absolute_error': 0.051,
              'scorer_may_be_modified_after_week4_open': False,
              'validation_season': 2026,
              'validation_week': 4,
          }

          assert decision['result'] == 'CALIBRATION_PASS_AWAITING_UNTOUCHED_WEEK4_VALIDATION'
          assert decision['calibration_pass'] is True
          assert decision['week4_read'] is False
          assert decision['week4_reserved_for_untouched_validation'] is True
          assert decision['2025_holdout_opened'] is False

          assert amendment['development_authorization']['B41D_may_open_2025'] is False
          assert amendment['development_authorization']['B41D_may_open_2026_week4'] is False
          assert amendment['information_available_at_amendment']['week4_2026_opened'] is False
          assert amendment['information_available_at_amendment']['holdout_2025_opened'] is False
          assert 'B41C3 untouched Week 4 scorer confirmation' in amendment['production_gates_still_required']

          assert b41f['status'] == 'FINAL_2019_2024_MODEL_WEIGHTS_FROZEN_BEFORE_WEEK4_AND_2025_HOLDOUT'
          assert b41f['B41C3_completed'] is False
          assert b41f['2025_holdout_opened'] is False
          assert b41f['week4_2026_opened'] is False
          assert b41f['production_model_fitted'] is True
          assert b41f['production_model_deployed'] is False
          assert b41f['production_change_authorized'] is False

          assert str(scoring['season']) == '2026'
          assert str(scoring['league_id']) == '1326679131051532288'

          print('PASS: B41C3 preregistered gate is unchanged.')
          print('PASS: B41C2 scorer SHA256 is frozen and exact.')
          print('PASS: Week 4 and 2025 remain unopened in committed study state.')
          print('PASS: B41F model is frozen but not deployed.')
          PY

          echo "INDEX_SHA_BEFORE=$(sha256sum index.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "FA_SHA_BEFORE=$(sha256sum free-agent-board.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Readiness gate without opening Week 4 validation data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import requests

          url = 'https://api.sleeper.app/v1/state/nfl'
          r = requests.get(
              url,
              timeout=90,
              headers={'User-Agent': 'LOG-Trade-Calculator-player-role-v2-b41c3-readiness'},
          )
          r.raise_for_status()
          state = r.json()

          season = str(state.get('season') or '')
          season_type = str(state.get('season_type') or '').lower()
          week = state.get('week')
          leg = state.get('leg')

          try:
              progress = max(int(week or 0), int(leg or 0))
          except (TypeError, ValueError):
              progress = 0

          print(json.dumps({
              'season': season,
              'season_type': season_type,
              'week': week,
              'leg': leg,
              'derived_progress_week': progress,
          }, indent=2, sort_keys=True))

          if season != '2026':
              raise RuntimeError(f'B41C3_WRONG_SLEEPER_SEASON {season!r}')
          if season_type and season_type != 'regular':
              raise RuntimeError(f'B41C3_NOT_REGULAR_SEASON {season_type!r}')
          if progress < 5:
              raise RuntimeError(
                  'B41C3_NOT_READY_WEEK4_REMAINS_SEALED: Sleeper has not advanced '
                  'to Week 5. Do not read Week 4 validation data yet.'
              )

          print('PASS: Sleeper has advanced beyond Week 4; B41C3 may open Week 4 once.')
          PY

      - name: Validate frozen scorer once on untouched 2026 Week 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/player-role-v2-b41c3

          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import requests

          base = Path('research/player-role-v2')
          out = Path('/tmp/player-role-v2-b41c3')

          prereg = json.loads(
              (base / 'player_role_v2_b41c2_scorer_recovery_preregistration.json')
              .read_text(encoding='utf-8')
          )
          b41c2 = json.loads(
              (base / 'player_role_v2_b41c2_scientific_decision.json')
              .read_text(encoding='utf-8')
          )
          scoring = json.loads(
              (base / 'player_role_v2_b41c_league_scoring_snapshot.json')
              .read_text(encoding='utf-8')
          )
          scorer_path = base / 'player_role_v2_b41c2_target_scorer.py'

          actual_sha = hashlib.sha256(scorer_path.read_bytes()).hexdigest()
          assert actual_sha == prereg['frozen_b41c2_scorer_sha256']
          assert actual_sha == b41c2['b41c2_scorer_sha256']
          assert b41c2['week4_read'] is False
          assert b41c2['2025_holdout_opened'] is False

          gate = prereg['week4_confirmatory_gate_preregistered_now']
          assert int(gate['validation_season']) == 2026
          assert int(gate['validation_week']) == 4
          assert gate['scorer_may_be_modified_after_week4_open'] is False

          spec = importlib.util.spec_from_file_location('b41c2_scorer_frozen', scorer_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          league_id = str(scoring['league_id'])
          settings = scoring['scoring_settings']

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'LOG-Trade-Calculator-player-role-v2-b41c3'
          })

          def get_json(url):
              r = session.get(url, timeout=90)
              r.raise_for_status()
              return r.json()

          # FIRST AND ONLY validation-data opening in this workflow.
          matchups = get_json(
              f'https://api.sleeper.app/v1/league/{league_id}/matchups/4'
          )
          stats = get_json(
              'https://api.sleeper.app/v1/stats/nfl/regular/2026/4'
          )

          truth = {}
          for matchup in matchups:
              for pid, points in (matchup.get('players_points') or {}).items():
                  try:
                      truth[str(pid)] = float(points)
                  except (TypeError, ValueError):
                      pass

          rows = []
          for pid, actual in sorted(truth.items()):
              # Preserve B41C2's individual-player-only rule; team defenses use alpha IDs.
              if not pid.isdigit():
                  continue

              raw = stats.get(pid) or {}
              predicted = float(mod.score_week(raw, settings))
              error = predicted - actual
              rows.append({
                  'week': 4,
                  'player_id': pid,
                  'actual': actual,
                  'predicted': predicted,
                  'error': round(error, 6),
                  'abs_error': round(abs(error), 6),
                  'raw_stats_present': bool(raw),
                  'nonzero_scoring_raw_keys': sorted(
                      key for key, weight in settings.items()
                      if key in raw
                      and float(raw.get(key) or 0) != 0
                      and float(weight or 0) != 0
                  ),
              })

          tolerance = float(gate['absolute_tolerance_points'])
          n = len(rows)
          within = sum(row['abs_error'] <= tolerance for row in rows)
          fraction = within / n if n else 0.0
          mae = sum(row['abs_error'] for row in rows) / n if n else 999.0
          max_abs = max((row['abs_error'] for row in rows), default=999.0)
          mismatches = sorted(
              [row for row in rows if row['abs_error'] > tolerance],
              key=lambda row: (-row['abs_error'], row['player_id']),
          )

          passed = (
              n >= int(gate['required_compared_player_weeks'])
              and fraction >= float(gate['required_fraction_within_tolerance'])
              and max_abs <= float(gate['required_max_absolute_error'])
          )

          evidence = {
              'schema_version': 1,
              'study_id': 'player-role-v2',
              'phase': 'B41C3-untouched-week4-scorer-confirmation',
              'validation_season': 2026,
              'validation_week': 4,
              'week4_data_opened': True,
              'week4_prior_status': 'UNTOUCHED_CONFIRMATORY_VALIDATION',
              'scorer_sha256': actual_sha,
              'scorer_version': getattr(mod, 'SCORER_VERSION', None),
              'gate': gate,
              'compared_player_weeks': n,
              'within_tolerance_count': within,
              'within_tolerance_fraction': fraction,
              'mean_absolute_error': mae,
              'max_absolute_error': max_abs,
              'mismatch_count': len(mismatches),
              'largest_mismatches': mismatches[:100],
              'pass': passed,
              '2025_holdout_opened': False,
              'model_or_tier_retuning_performed': False,
              'scorer_modified_after_week4_open': False,
              'production_change_authorized': False,
          }

          (out / 'player_role_v2_b41c3_week4_scorer_validation.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'compared_player_weeks': n,
              'within_tolerance_fraction': fraction,
              'mean_absolute_error': mae,
              'max_absolute_error': max_abs,
              'mismatch_count': len(mismatches),
              'week4_confirmation_pass': passed,
              '2025_holdout_opened': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Record immutable B41C3 decision
        shell: bash
        run: |
          set -euo pipefail

          BASE='research/player-role-v2'
          OUT='/tmp/player-role-v2-b41c3'

          git fetch origin main
          git rebase origin/main

          # Re-verify that no study file changed the frozen scorer between validation and commit.
          test "$(sha256sum "$BASE/player_role_v2_b41c2_target_scorer.py" | awk '{print $1}')" = \
            'cbc8548eb0dac7d6f8a95717925487e746605627f674c0a04637771c21e54e6b'

          cp "$OUT/player_role_v2_b41c3_week4_scorer_validation.json" \
            "$BASE/player_role_v2_b41c3_week4_scorer_validation.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path('research/player-role-v2')
          v = json.loads(
              (base / 'player_role_v2_b41c3_week4_scorer_validation.json')
              .read_text(encoding='utf-8')
          )
          b41f = json.loads(
              (base / 'player_role_v2_b41f_final_model_snapshot.json')
              .read_text(encoding='utf-8')
          )

          assert v['week4_data_opened'] is True
          assert v['2025_holdout_opened'] is False
          assert v['model_or_tier_retuning_performed'] is False
          assert v['scorer_modified_after_week4_open'] is False
          assert b41f['2025_holdout_opened'] is False
          assert b41f['production_model_deployed'] is False
          assert b41f['production_change_authorized'] is False

          if v['pass']:
              result = 'PASS_UNTOUCHED_WEEK4_SCORER_CONFIRMATION'
              next_stage = (
                  'Open untouched 2025 exactly once to evaluate the frozen B41F model '
                  'and unchanged B41E seven-tier system; no retuning is permitted.'
              )
              eligible_for_2025_holdout = True
          else:
              result = 'SCIENTIFIC_STOP_WEEK4_SCORER_CONFIRMATION_FAILED'
              next_stage = (
                  'Do not open 2025. Preserve B41F and B41E unchanged; any scorer recovery '
                  'requires a new explicitly versioned study path.'
              )
              eligible_for_2025_holdout = False

          decision = {
              'schema_version': 1,
              'study_id': 'player-role-v2',
              'phase': 'B41C3-scientific-decision',
              'result': result,
              'week4_confirmation_pass': bool(v['pass']),
              'week4_opened': True,
              'week4_was_untouched_before_b41c3': True,
              'frozen_scorer_sha256': v['scorer_sha256'],
              'compared_player_weeks': v['compared_player_weeks'],
              'within_tolerance_fraction': v['within_tolerance_fraction'],
              'mean_absolute_error': v['mean_absolute_error'],
              'max_absolute_error': v['max_absolute_error'],
              'mismatch_count': v['mismatch_count'],
              'B41F_model_frozen': True,
              'B41E_thresholds_frozen': True,
              'model_or_tier_retuning_performed': False,
              '2025_holdout_opened': False,
              'eligible_for_2025_holdout_evaluation': eligible_for_2025_holdout,
              'production_model_deployed': False,
              'production_change_authorized': False,
              'B42_owner_blind_role_parity_audit_still_required': True,
              'next_stage': next_stage,
          }

          (base / 'player_role_v2_b41c3_scientific_decision.json').write_text(
              json.dumps(decision, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          report = [
              '# Player Role V2 — B41C3 Untouched Week 4 Scorer Confirmation',
              '',
              f"- Result: **{result}**",
              '- Validation set: **2026 Week 4 only, previously untouched**',
              f"- Compared player-weeks: **{v['compared_player_weeks']:,}**",
              f"- Within 0.011 points: **{v['within_tolerance_fraction']:.4%}**",
              f"- Mean absolute error: **{v['mean_absolute_error']:.6f}**",
              f"- Maximum absolute error: **{v['max_absolute_error']:.6f}**",
              f"- Mismatch count: **{v['mismatch_count']}**",
              '- Frozen B41C2 scorer changed: **No**',
              '- Frozen B41F model changed: **No**',
              '- Frozen B41E tier thresholds changed: **No**',
              '- 2025 holdout opened: **No**',
              '- Production deployed: **No**',
              '- Production change authorized: **No**',
              '',
              f'Next stage: {next_stage}',
              '',
          ]

          if v['largest_mismatches']:
              report += ['## Largest Week 4 mismatches', '']
              for row in v['largest_mismatches'][:20]:
                  report.append(
                      f"- Player {row['player_id']}: Sleeper={row['actual']:.3f}, "
                      f"B41C2={row['predicted']:.3f}, abs error={row['abs_error']:.3f}; "
                      f"raw scoring keys={row['nonzero_scoring_raw_keys']}"
                  )
              report.append('')

          (base / 'player_role_v2_b41c3_report.md').write_text(
              '\n'.join(report),
              encoding='utf-8',
          )

          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

          test "$(sha256sum index.html | awk '{print $1}')" = "$INDEX_SHA_BEFORE"
          test "$(sha256sum free-agent-board.html | awk '{print $1}')" = "$FA_SHA_BEFORE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            "$BASE/player_role_v2_b41c3_week4_scorer_validation.json" \
            "$BASE/player_role_v2_b41c3_scientific_decision.json" \
            "$BASE/player_role_v2_b41c3_report.md"

          git diff --cached --check

          if git diff --cached --quiet; then
            echo 'B41C3 evidence already committed identically.'
          else
            git commit -m 'Record Player Role V2 B41C3 untouched Week 4 scorer confirmation'
            git push origin HEAD:main
          fi

      - name: B41C3 closeout
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path('research/player-role-v2/player_role_v2_b41c3_scientific_decision.json')
              .read_text(encoding='utf-8')
          )

          assert d['week4_opened'] is True
          assert d['week4_was_untouched_before_b41c3'] is True
          assert d['model_or_tier_retuning_performed'] is False
          assert d['2025_holdout_opened'] is False
          assert d['production_model_deployed'] is False
          assert d['production_change_authorized'] is False

          print('B41C3 CLOSEOUT:', d['result'])
          print('WEEK 4 CONFIRMATION PASS:', str(d['week4_confirmation_pass']).lower())
          print('COMPARED PLAYER-WEEKS:', d['compared_player_weeks'])
          print('WITHIN TOLERANCE FRACTION:', d['within_tolerance_fraction'])
          print('MAX ABSOLUTE ERROR:', d['max_absolute_error'])
          print('2025 HOLDOUT OPENED: false')
          print('MODEL/TIER RETUNING: false')
          print('PRODUCTION DEPLOYED: false')
          print('PRODUCTION CHANGE AUTHORIZED: false')
          print('ELIGIBLE FOR 2025 HOLDOUT:', str(d['eligible_for_2025_holdout_evaluation']).lower())
          print('B42 OWNER-BLIND ROLE PARITY AUDIT STILL REQUIRED: true')

          if not d['week4_confirmation_pass']:
              raise RuntimeError(
                  'B41C3_SCIENTIFIC_STOP_WEEK4_SCORER_CONFIRMATION_FAILED'
              )
          PY
