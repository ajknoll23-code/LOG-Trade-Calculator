name: Draft Pick FV V8.1 - V8 Closeout and Carryforward Preregistration

"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: draft-pick-fv-v8-1-closeout-preregistration
  cancel-in-progress: false

jobs:
  closeout_and_preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install regression dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            "requests==2.34.2"

      - name: Verify and download exact official V8 Phase 3 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v8p3"

          RUN_ID="36475989493"
          ARTIFACT_ID="10993696694"
          EXPECTED_DIGEST="sha256:afa01f1951ff440410f15cfc6f082ffbd2a720e788cf504aae65c280892bc97d"

          ACTUAL_DIGEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest // ""')"
          test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n "v8-p3-loyo-development-selection" \
            -D "${RUNNER_TEMP}/v8p3"

          test -f "${RUNNER_TEMP}/v8p3/p3/v8_phase3_loyo_development_selection.json"
          test -f "${RUNNER_TEMP}/v8p3/p3/v8_phase3_loyo_development_selection_manifest.json"

      - name: Verify exact V8 scientific stop and preserved holdout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          p=Path(os.environ["RUNNER_TEMP"])/"v8p3"/"p3"
          r=json.loads((p/"v8_phase3_loyo_development_selection.json").read_text())
          m=json.loads((p/"v8_phase3_loyo_development_selection_manifest.json").read_text())

          assert r["decision"]=="STOP_NO_V8_R1_R6_DEVELOPMENT_CANDIDATE"
          assert r["status"]=="LOYO_DEVELOPMENT_NO_ELIGIBLE_CANDIDATE"
          assert r["selected_candidate"] is None
          assert r["eligible_candidates"]==[]
          assert r["final_candidate_frozen"] is False
          assert r["2024_H2_outcome_open_authorized_next_stage"] is False
          assert r["next_stage"]=="draft-pick-fv-v8-phase3-closeout-no-development-candidate"

          assert r["holdout_2024_pick_identity_file_read"] is False
          assert r["holdout_2024_rookie_outcomes_read"] is False
          assert r["holdout_2024_outcomes_remain_sealed"] is True
          assert r["market_or_ktc_values_read"] is False
          assert r["package_vote_data_read"] is False
          assert r["production_change_authorized"] is False
          assert r["automatic_production_promotion_allowed"] is False
          assert r["year_discount_fit_or_changed"] is False

          assert m["decision"]==r["decision"]
          assert m["final_candidate_frozen"] is False
          assert m["2024_H2_outcome_open_authorized_next_stage"] is False
          assert m["holdout_2024_outcomes_read"] is False
          assert m["production_change_authorized"] is False

          c1=r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]
          c2=r["eligibility_gate_results"]["C2_ROUNDWISE_RESCALE_R1_R6"]
          c3=r["eligibility_gate_results"]["C3_SMOOTH_ADDITIVE_R1_R6"]
          c4=r["eligibility_gate_results"]["C4_SHRUNK_MONOTONE_SLOT_CURVE_R1_R6"]

          assert c1["eligible"] is False
          assert [k for k,v in c1["gates"].items() if not v] == [
              "no_individual_round_h3_o2_regression_worse_than_5pct"
          ]
          assert math.isclose(c1["loyo_h3_o2_improvement_vs_C0"],0.5855525789,abs_tol=1e-10)
          assert c1["improved_heldout_class_n"]==6
          assert math.isclose(c1["worst_heldout_class_relative_regression"],-0.543909073,abs_tol=1e-10)
          assert math.isclose(c1["o1_shape_relative_regression_vs_C0"],0.0,abs_tol=1e-12)
          assert math.isclose(c1["h2_o2_relative_regression_vs_C0"],-0.6197573333,abs_tol=1e-10)
          assert math.isclose(c1["mature_h4_o2_relative_regression_vs_C0"],-0.578217523,abs_tol=1e-10)
          assert math.isclose(c1["combined_r5_r6_h3_o2_relative_regression_vs_C0"],-0.0914449022,abs_tol=1e-10)
          assert math.isclose(c1["round_h3_o2_relative_regression_vs_C0"]["6"],0.2257493235,abs_tol=1e-10)
          assert math.isclose(c1["bootstrap"]["one_sided_upper_95"],-916.1354629728,abs_tol=1e-8)

          assert set(k for k,v in c2["gates"].items() if not v)=={
              "h3_o1_shape_regression_vs_C0_le_2pct",
              "no_individual_round_h3_o2_regression_worse_than_5pct",
          }
          assert set(k for k,v in c3["gates"].items() if not v)=={
              "h3_o1_shape_regression_vs_C0_le_2pct",
              "no_hard_numeric_bound_saturation",
          }
          assert set(k for k,v in c4["gates"].items() if not v)=={
              "c4_selected_alpha_not_grid_edge",
              "h3_o1_shape_regression_vs_C0_le_2pct",
              "no_hard_numeric_bound_saturation",
          }
          assert r["c4_alpha_selection"]["selected_alpha"]==1536

          c1diag=r["full_data_boundary_diagnostics"]["C1_GLOBAL_SCALE_R1_R6"]
          assert c1diag["pass"] is True
          assert math.isclose(
              c1diag["parameter_checks"]["k"]["value"],
              0.3557942893,
              rel_tol=0.0,
              abs_tol=1e-10,
          )
          assert c1diag["parameter_checks"]["k"]["at_hard_bound"] is False

          print("PASS: official V8 Phase 3 stop reproduced exactly; 2024 rookie holdout is still untouched.")
          PY

      - name: Freeze V8 closeout and V8.1 preregistration
        shell: bash
        run: |
          set -euo pipefail
          D="research/draft-pick-fv-v8-1"
          mkdir -p "$D"

          for p in \
            "$D/v8_phase3_closeout.json" \
            "$D/v8_phase3_closeout.md" \
            "$D/v8_phase3_closeout_manifest.json" \
            "$D/v8_1_carryforward_preregistration.json" \
            "$D/v8_1_carryforward_preregistration.md" \
            "$D/v8_1_carryforward_preregistration_manifest.json"
          do
            test ! -e "$p" || {
              echo "ERROR: V8.1 preregistration output already exists: $p"
              exit 1
            }
          done

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path("research/draft-pick-fv-v8-1")
          p3=Path(os.environ["RUNNER_TEMP"])/"v8p3"/"p3"
          src=p3/"v8_phase3_loyo_development_selection.json"
          man=p3/"v8_phase3_loyo_development_selection_manifest.json"
          r=json.loads(src.read_text())
          m=json.loads(man.read_text())

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def write_json(path,obj):
              path.write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")

          generated=datetime.now(timezone.utc).isoformat()

          closeout_decision="CLOSE_V8_NO_ELIGIBLE_CANDIDATE_PRESERVE_2024_HOLDOUT"
          closeout={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-depth-specific-source-cohorts",
              "stage":"phase3_closeout_no_development_candidate",
              "status":"CLOSED_NO_ELIGIBLE_DEVELOPMENT_CANDIDATE",
              "generated_at_utc":generated,
              "decision":closeout_decision,
              "official_phase3":{
                  "run_id":36475989493,
                  "artifact_id":10993696694,
                  "artifact_digest":"sha256:afa01f1951ff440410f15cfc6f082ffbd2a720e788cf504aae65c280892bc97d",
                  "result_sha256":sha(src),
                  "manifest_sha256":sha(man),
                  "decision":r["decision"],
              },
              "candidate_disposition":{
                  cid:{
                      "eligible":g["eligible"],
                      "failed_gates":[k for k,v in g["gates"].items() if not v],
                      "loyo_h3_o2_improvement_vs_C0":g["loyo_h3_o2_improvement_vs_C0"],
                      "h3_o1_shape_relative_regression_vs_C0":g["o1_shape_relative_regression_vs_C0"],
                      "round_h3_o2_relative_regression_vs_C0":g["round_h3_o2_relative_regression_vs_C0"],
                      "combined_r5_r6_h3_o2_relative_regression_vs_C0":g["combined_r5_r6_h3_o2_relative_regression_vs_C0"],
                  }
                  for cid,g in r["eligibility_gate_results"].items()
              },
              "c1_exposed_development_evidence":{
                  "candidate_id":"C1_GLOBAL_SCALE_R1_R6",
                  "passed_gate_n":sum(bool(v) for v in r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["gates"].values()),
                  "total_gate_n":len(r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["gates"]),
                  "only_failed_gate":"no_individual_round_h3_o2_regression_worse_than_5pct",
                  "loyo_h3_o2_improvement_vs_C0":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["loyo_h3_o2_improvement_vs_C0"],
                  "improved_heldout_class_n":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["improved_heldout_class_n"],
                  "worst_heldout_class_relative_regression":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["worst_heldout_class_relative_regression"],
                  "o1_shape_relative_regression_vs_C0":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["o1_shape_relative_regression_vs_C0"],
                  "h2_o2_relative_regression_vs_C0":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["h2_o2_relative_regression_vs_C0"],
                  "mature_h4_o2_relative_regression_vs_C0":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["mature_h4_o2_relative_regression_vs_C0"],
                  "combined_r5_r6_h3_o2_relative_regression_vs_C0":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["combined_r5_r6_h3_o2_relative_regression_vs_C0"],
                  "r6_h3_o2_relative_regression_vs_C0":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["round_h3_o2_relative_regression_vs_C0"]["6"],
                  "bootstrap_one_sided_upper_95":r["eligibility_gate_results"]["C1_GLOBAL_SCALE_R1_R6"]["bootstrap"]["one_sided_upper_95"],
                  "all_development_fit_k":r["full_data_boundary_diagnostics"]["C1_GLOBAL_SCALE_R1_R6"]["parameter_checks"]["k"]["value"],
              },
              "firewalls":{
                  "v8_retroactively_reopened":False,
                  "v8_gate_changed_after_results":False,
                  "2024_holdout_outcomes_read":False,
                  "2024_holdout_open_authorized_by_v8":False,
                  "production_change_authorized":False,
              },
              "next_stage":"draft-pick-fv-v8-1-postdevelopment-carryforward-preregistration",
          }

          close_json=root/"v8_phase3_closeout.json"
          write_json(close_json,closeout)
          close_md=root/"v8_phase3_closeout.md"
          close_md.write_text(
              "# Draft Pick FV V8 — Phase 3 Closeout\n\n"
              f"**Decision:** `{closeout_decision}`\n\n"
              "- V8 is closed exactly as preregistered: no eligible R1-R6 development candidate.\n"
              "- C1 passed 18 of 19 frozen gates and failed only the individual-round H3 O2 gate because R6 regressed 22.57% vs C0.\n"
              "- The 2024 rookie holdout remains sealed and was not authorized by V8.\n"
              "- V8 is not retroactively repaired. Any continuation is a new post-development study.\n"
          )
          close_man={
              "schema_version":1,
              "stage":"v8_phase3_closeout_manifest",
              "status":closeout["status"],
              "decision":closeout_decision,
              "official_phase3_run_id":36475989493,
              "official_phase3_artifact_id":10993696694,
              "official_phase3_artifact_digest":"sha256:afa01f1951ff440410f15cfc6f082ffbd2a720e788cf504aae65c280892bc97d",
              "closeout_sha256":sha(close_json),
              "closeout_markdown_sha256":sha(close_md),
              "2024_holdout_outcomes_read":False,
              "production_change_authorized":False,
          }
          close_man_path=root/"v8_phase3_closeout_manifest.json"
          write_json(close_man_path,close_man)

          base={
              "1":{"early":7500.0,"mid":5854.0,"late":5244.0},
              "2":{"early":3906.0,"mid":3624.0,"late":3291.0},
              "3":{"early":2692.0,"mid":2682.0,"late":2319.0},
              "4":{"early":1972.0,"mid":1831.0,"late":1689.0},
              "5":{"early":1414.0,"mid":1250.0,"late":1118.0},
              "6":{"early":1014.0,"mid":853.0,"late":740.0},
          }
          k=0.3557942893
          frozen_values={
              rr:{tier:round(v*k,10) for tier,v in tiers.items()}
              for rr,tiers in base.items()
          }
          seq=[
              frozen_values[str(r)][t]
              for r in range(1,7)
              for t in ("early","mid","late")
          ]
          assert all(seq[i]>=seq[i+1]-1e-10 for i in range(len(seq)-1))
          assert all(v>0 for v in seq)

          prereg_decision="FREEZE_V8_1_C1_CARRYFORWARD_SPARSE_SENSITIVITY_NEXT"
          prereg={
              "schema_version":1,
              "study_id":"draft-pick-fv-v8-1-global-scale-sparse-tail-holdout-confirmation",
              "stage":"phase0_postdevelopment_carryforward_preregistration",
              "status":"FROZEN_AFTER_V8_DEVELOPMENT_BEFORE_V8_1_SPARSE_SENSITIVITY_OR_2024_HOLDOUT",
              "generated_at_utc":generated,
              "decision":prereg_decision,
              "research_only":True,
              "evidence_status":{
                  "2018_2023_development_outcomes_exposed":True,
                  "v8_candidate_results_exposed":True,
                  "v8_1_is_not_fresh_development_validation":True,
                  "v8_1_sparse_sensitivity_run_yet":False,
                  "2024_rookie_holdout_outcomes_read":False,
                  "2024_rookie_holdout_remains_independent":True,
                  "independent_evidentiary_weight_begins_at_2024_holdout":True,
              },
              "rationale":{
                  "v8_closed_without_eligible_candidate":True,
                  "reason_for_new_study":"The preregistered V8 individual-round gate was vetoed only by R6 for C1 while the pre-outcome V8 source-availability amendment had already identified 2018 R6 as source-sparse and required separate sparse-tail sensitivity before production.",
                  "postdevelopment_design_acknowledgement":"V8.1 is intentionally informed by exposed V8 development evidence. It does not reinterpret V8 as a pass and does not claim the carryforward choice is unbiased development validation.",
                  "why_c1":"C1 is the one-parameter family, preserves the deployed 18-cell shape exactly under global scaling, passed 18/19 V8 gates, improved all six held-out classes, and did not saturate its preregistered hard bound.",
                  "why_not_c2":"C2 failed both the individual-round gate and the frozen O1 shape-preservation gate.",
                  "why_not_c3":"C3 passed the round gate but failed the frozen O1 shape-preservation and hard-bound gates.",
                  "why_not_c4":"C4 failed O1 shape preservation, hard-bound diagnostics, and selected the preregistered alpha grid edge.",
              },
              "frozen_primary_candidate":{
                  "candidate_id":"C1_GLOBAL_SCALE_R1_R6_CARRYFORWARD",
                  "family":"global scalar times exact deployed R1-R6 PICK_BASE",
                  "effective_parameter_n":1,
                  "k":k,
                  "k_source":"official V8 all-development diagnostic fit; frozen here without refit",
                  "k_hard_bounds_from_v8":[0.1,1.25],
                  "k_at_hard_bound":False,
                  "deployed_pick_base_2027":base,
                  "frozen_candidate_pick_base_2027":frozen_values,
                  "all_18_positive":True,
                  "all_18_monotone_nonincreasing":True,
                  "normalized_shape_exactly_equal_to_C0":True,
                  "primary_candidate_refit_after_this_freeze_allowed":False,
                  "YEAR_DISCOUNT_fit_or_change_allowed":False,
              },
              "exposed_v8_development_summary":{
                  "loyo_h3_o2_improvement_vs_C0":0.5855525789,
                  "improved_heldout_class_n":6,
                  "worst_heldout_class_relative_regression":-0.543909073,
                  "paired_cluster_bootstrap_one_sided_upper_95":-916.1354629728,
                  "h3_o1_shape_relative_regression_vs_C0":0.0,
                  "h2_o2_relative_regression_vs_C0":-0.6197573333,
                  "mature_h4_o2_relative_regression_vs_C0":-0.578217523,
                  "round_h3_o2_relative_regression_vs_C0":{
                      "1":-0.7083862605,
                      "2":-0.6275932979,
                      "3":-0.6001496018,
                      "4":-0.6077778131,
                      "5":-0.3176524925,
                      "6":0.2257493235,
                  },
                  "combined_r5_r6_h3_o2_relative_regression_vs_C0":-0.0914449022,
                  "interpretation":"Development evidence is descriptive and motivated this carryforward design; it is not a V8.1 validation result.",
              },
              "phase1_sparse_tail_sensitivity":{
                  "must_run_before_2024_holdout":True,
                  "selection_or_tuning_allowed_from_sensitivity":False,
                  "primary_candidate_remains_fixed":True,
                  "required_runs":[
                      "reproduce fixed primary candidate on full frozen V8 development corpus",
                      "diagnostic refit of same one-parameter C1 family after excluding all 2018 R6 occurrences",
                      "six diagnostic refits of the same C1 family, each leaving one frozen source-membership index out of all three 2018 R6 cells",
                  ],
                  "variant_weighting":{
                      "primary":"exact inherited V8 equal-class/equal-cell/equal-league/equal-occurrence contract",
                      "exclude_all_2018_r6":"retain equal total weight for each draft class; within 2018 distribute that class weight equally across its 15 remaining cells; all other classes retain 18 equal cells; within cell preserve equal-league then equal-occurrence weighting",
                      "leave_one_source_index_out":"retain equal class and equal 18-cell weights; within each affected 2018 R6 cell renormalize equally across the five remaining frozen source leagues and their retained occurrences",
                  },
                  "diagnostic_refit_role":"parameter-stability diagnostic only; diagnostic k values can never replace the frozen primary k",
                  "gates":[
                      "all 7 diagnostic C1 refit k values must be within +/-10% relative of frozen primary k",
                      "all 7 sensitivity datasets must retain >=5% H3 O2 macro-MAE improvement for their fixed/refit C1 evaluation vs C0 under the variant's frozen weighting",
                      "all 7 sensitivity datasets must retain >=5% combined available R5-R6 H3 O2 macro-MAE improvement vs C0",
                      "no diagnostic refit may hit the inherited C1 k hard bounds",
                      "all generated C1 curves remain strictly positive and monotone non-increasing",
                  ],
                  "failure_decision":"STOP_V8_1_SPARSE_TAIL_SENSITIVITY",
                  "pass_decision":"PASS_V8_1_SPARSE_TAIL_SENSITIVITY_AUTHORIZE_2024_H2_ONCE",
              },
              "phase2_2024_h2_independent_confirmation":{
                  "outcomes_sealed_until_phase1_pass":True,
                  "open_exactly_once":True,
                  "candidate_refit_allowed":False,
                  "candidate_parameter_must_equal":k,
                  "comparison_baseline":"exact deployed C0 R1-R6 PICK_BASE",
                  "primary_gates":[
                      "2024 H2 O2 equal-cell macro MAE improvement vs C0 >=5%",
                      "no individual round 2024 H2 O2 macro MAE regression vs C0 worse than 5%",
                      "combined R5-R6 2024 H2 O2 macro MAE relative regression vs C0 <=5%",
                      "2024 H2 O1 normalized 18-cell shape-error regression vs C0 <=2%",
                      "all frozen source/identity/retention gates remain satisfied",
                      "candidate parameter and 18-cell values unchanged since V8.1 Phase 0 freeze",
                  ],
                  "pass_decision":"PASS_V8_1_2024_H2_CONTINUE_TO_FUTURE_H3",
                  "failure_decision":"STOP_V8_1_2024_H2_CONFIRMATION",
                  "can_authorize_production":False,
              },
              "future_2024_h3_primary_confirmation":{
                  "scoring_not_before":"2026 NFL regular season is complete and Week 18 statistics are published",
                  "partial_2026_data_allowed":False,
                  "candidate_refit_allowed":False,
                  "primary_gates":[
                      "2024 H3 O2 equal-cell macro MAE improvement vs C0 >=5%",
                      "no individual round 2024 H3 O2 macro MAE regression vs C0 worse than 5%",
                      "combined R5-R6 2024 H3 O2 macro MAE relative regression vs C0 <=5%",
                      "2024 H3 O1 normalized 18-cell shape-error regression vs C0 <=2%",
                      "V8.1 Phase 1 sparse-tail sensitivity passed",
                      "V8.1 2024 H2 confirmation passed",
                      "candidate parameter and 18-cell values unchanged since V8.1 Phase 0 freeze",
                  ],
                  "failure_decision":"STOP_V8_1_2024_H3_CONFIRMATION",
                  "pass_decision":"PASS_V8_1_2024_H3_EXTERNAL_REPLAY_HUMAN_PRODUCTION_REVIEW_NEXT",
                  "automatic_production_deployment_allowed":False,
              },
              "forbidden":[
                  "changing or retroactively passing V8",
                  "treating 2018-2023 V8 evidence as fresh V8.1 validation",
                  "changing candidate family after this preregistration",
                  "changing frozen primary k after this preregistration",
                  "using sparse sensitivity variants to select a different parameter",
                  "opening 2024 rookie holdout outcomes before Phase 1 sparse-tail sensitivity passes",
                  "candidate refit after any 2024 holdout outcome is opened",
                  "new 2024 league search or holdout cohort additions",
                  "partial-2026 H3 scoring",
                  "YEAR_DISCOUNT fitting or changes",
                  "KTC/current market values as fit or validation targets",
                  "package-vote data as fit or validation targets",
                  "automatic production deployment",
              ],
              "source_lineage":{
                  "v8_closeout_sha256":sha(close_json),
                  "official_v8_phase3_result_sha256":sha(src),
                  "official_v8_phase3_manifest_sha256":sha(man),
                  "official_v8_phase3_run_id":36475989493,
                  "official_v8_phase3_artifact_id":10993696694,
                  "official_v8_phase3_artifact_digest":"sha256:afa01f1951ff440410f15cfc6f082ffbd2a720e788cf504aae65c280892bc97d",
              },
              "firewalls":{
                  "2024_holdout_outcomes_read":False,
                  "sparse_sensitivity_run":False,
                  "candidate_fit_performed_in_v8_1":False,
                  "candidate_parameter_changed_from_exposed_v8_diagnostic":False,
                  "market_or_ktc_values_read":False,
                  "package_vote_data_read":False,
                  "production_change_authorized":False,
              },
              "next_stage":"draft-pick-fv-v8-1-phase1-sparse-tail-sensitivity",
          }

          prereg_json=root/"v8_1_carryforward_preregistration.json"
          write_json(prereg_json,prereg)

          prereg_md=root/"v8_1_carryforward_preregistration.md"
          prereg_md.write_text(
              "# Draft Pick FV V8.1 — Carryforward Preregistration\n\n"
              f"**Decision:** `{prereg_decision}`\n\n"
              "V8.1 is a new post-development study. V8 remains a scientific stop.\n\n"
              "The only V8.1 primary candidate is the one-parameter C1 global-scale curve, "
              f"frozen at **k = {k:.10f}** from the official exposed V8 all-development diagnostic. "
              "The candidate cannot be refit after this freeze.\n\n"
              "Before the untouched 2024 rookie holdout can be opened, V8.1 must run the pre-specified "
              "2018 R6 sparse-source sensitivity suite. Those diagnostic refits can stop the study but "
              "cannot change the primary candidate.\n\n"
              "If sensitivity passes, the unchanged candidate receives one independent 2024 H2 test. "
              "H2 can only authorize continuation; production still requires the unchanged future H3 "
              "confirmation after the 2026 regular season is complete.\n"
          )

          prereg_man={
              "schema_version":1,
              "study_id":prereg["study_id"],
              "stage":"phase0_postdevelopment_carryforward_preregistration_manifest",
              "status":prereg["status"],
              "decision":prereg_decision,
              "primary_candidate_id":prereg["frozen_primary_candidate"]["candidate_id"],
              "primary_candidate_k":k,
              "primary_candidate_frozen":True,
              "sparse_sensitivity_run":False,
              "2024_holdout_outcomes_read":False,
              "production_change_authorized":False,
              "v8_closeout_sha256":sha(close_json),
              "v8_closeout_manifest_sha256":sha(close_man_path),
              "preregistration_sha256":sha(prereg_json),
              "preregistration_markdown_sha256":sha(prereg_md),
              "next_stage":prereg["next_stage"],
          }
          prereg_man_path=root/"v8_1_carryforward_preregistration_manifest.json"
          write_json(prereg_man_path,prereg_man)

          print("PASS: V8 closed without alteration and V8.1 C1 carryforward contract frozen before sparse sensitivity or 2024 holdout access.")
          print("V8.1 PRIMARY k =",k)
          print("NEXT =",prereg["next_stage"])
          PY

      - name: Validate frozen V8.1 preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          d=Path("research/draft-pick-fv-v8-1")
          c=json.loads((d/"v8_phase3_closeout.json").read_text())
          cm=json.loads((d/"v8_phase3_closeout_manifest.json").read_text())
          p=json.loads((d/"v8_1_carryforward_preregistration.json").read_text())
          pm=json.loads((d/"v8_1_carryforward_preregistration_manifest.json").read_text())

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert c["decision"]=="CLOSE_V8_NO_ELIGIBLE_CANDIDATE_PRESERVE_2024_HOLDOUT"
          assert c["firewalls"]["v8_retroactively_reopened"] is False
          assert c["firewalls"]["v8_gate_changed_after_results"] is False
          assert c["firewalls"]["2024_holdout_outcomes_read"] is False
          assert cm["closeout_sha256"]==sha(d/"v8_phase3_closeout.json")

          assert p["decision"]=="FREEZE_V8_1_C1_CARRYFORWARD_SPARSE_SENSITIVITY_NEXT"
          assert p["evidence_status"]["v8_1_is_not_fresh_development_validation"] is True
          assert p["evidence_status"]["2024_rookie_holdout_outcomes_read"] is False
          assert p["evidence_status"]["2024_rookie_holdout_remains_independent"] is True

          cand=p["frozen_primary_candidate"]
          assert cand["candidate_id"]=="C1_GLOBAL_SCALE_R1_R6_CARRYFORWARD"
          assert cand["k"]==0.3557942893
          assert cand["effective_parameter_n"]==1
          assert cand["normalized_shape_exactly_equal_to_C0"] is True
          assert cand["primary_candidate_refit_after_this_freeze_allowed"] is False
          assert cand["YEAR_DISCOUNT_fit_or_change_allowed"] is False
          assert cand["all_18_positive"] is True
          assert cand["all_18_monotone_nonincreasing"] is True

          sens=p["phase1_sparse_tail_sensitivity"]
          assert sens["must_run_before_2024_holdout"] is True
          assert sens["selection_or_tuning_allowed_from_sensitivity"] is False
          assert len(sens["gates"])==5

          h2=p["phase2_2024_h2_independent_confirmation"]
          assert h2["outcomes_sealed_until_phase1_pass"] is True
          assert h2["open_exactly_once"] is True
          assert h2["candidate_refit_allowed"] is False
          assert h2["can_authorize_production"] is False

          h3=p["future_2024_h3_primary_confirmation"]
          assert h3["partial_2026_data_allowed"] is False
          assert h3["candidate_refit_allowed"] is False
          assert h3["automatic_production_deployment_allowed"] is False

          assert p["firewalls"]["sparse_sensitivity_run"] is False
          assert p["firewalls"]["2024_holdout_outcomes_read"] is False
          assert p["firewalls"]["candidate_fit_performed_in_v8_1"] is False
          assert p["firewalls"]["production_change_authorized"] is False

          assert pm["preregistration_sha256"]==sha(d/"v8_1_carryforward_preregistration.json")
          assert pm["primary_candidate_k"]==0.3557942893
          assert pm["primary_candidate_frozen"] is True
          assert pm["2024_holdout_outcomes_read"] is False

          print("PASS: V8.1 preregistration validates and the untouched 2024 holdout remains sealed.")
          PY

      - name: Prove exact research-only change scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git status --porcelain=v1 --untracked-files=all |
            sed -E 's/^.. //' | sort
          )
          expected=(
            "research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.json"
            "research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration.md"
            "research/draft-pick-fv-v8-1/v8_1_carryforward_preregistration_manifest.json"
            "research/draft-pick-fv-v8-1/v8_phase3_closeout.json"
            "research/draft-pick-fv-v8-1/v8_phase3_closeout.md"
            "research/draft-pick-fv-v8-1/v8_phase3_closeout_manifest.json"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          echo "PASS: exactly six V8 closeout / V8.1 preregistration files changed."

      - name: Run repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/repo_regression_checks.py

      - name: Commit V8 closeout and V8.1 preregistration
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "ERROR: origin/main moved during V8.1 preregistration."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/draft-pick-fv-v8-1
          git diff --cached --quiet && {
            echo "ERROR: no V8.1 preregistration artifacts staged."
            exit 1
          }

          git commit -m "Close Draft Pick FV V8 and freeze V8.1 carryforward preregistration"
          git push origin HEAD:main

          echo "PASS: V8 closeout and V8.1 preregistration committed to main."
