# QF10 V5: read-only market churn and FV-center exact parity review.
# Does NOT write price artifacts, authorize V6 four-player extension or change age valuations.
name: QF10 V5 - Market Refresh Churn and Center Parity Decision Audit (Read Only)
'on':
  workflow_dispatch: null
env:
  PYTHONDONTWRITEBYTECODE: '1'
permissions:
  contents: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
jobs:
  triage:
    name: Quantify full player market churn and exact-FV refresh eligibility with frozen governance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout exact dispatched main, read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing repo HTTP dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Verify exact code and protected artifacts
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == ''refs/heads/main'' ]] || { echo ''STOP non-main''; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo ''STOP checkout drift''; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP dirty worktree''; exit 1; }

        git merge-base --is-ancestor d8a2be0bf1edb8d19e94e2edc5157062f95096f3 HEAD || { echo ''STOP QF9
        baseline not ancestor''; exit 1; }

        pin(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP source drift $1"; exit 1; }; }

        pin index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        pin scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        pin scripts/artifacts/generated/value_uncertainty.json 24c9f63881cc768a18d412172f04e5a263a4abc2

        pin scripts/market/build_market_value.py a015d54785ce5fcb3b9f26bae0120b82693a6bd8

        pin scripts/validation/build_value_uncertainty.py c70db15470704182c8790ebd24cc25c8fca6bd61

        pin research/package-adjustment-v6/production_review_v1.json e39bff1ce541e093b2a9140e12716c24fbaffb86

        pin research/no-history-v2/no_history_v2_phase3_evaluation.json b90cea102eb23147619318dbb009559a64a3d620

        pin scripts/team_utility_projection_runtime.js 1620edf05e56a56b4a874c71b32777a443422de5

        pin free-agent-board.html 975efe51091a2315475678a9db0842b05c4fc3aa

        pin model/releases/free-agent-production-v2/release.json 75c9665c0493d8ac4900479b6802c807aaa45633

        printf ''%s\n'' ''PASS QF10 V4 pinned production, both display builders, and strict research governance''

        '
    - name: Run no-write canonical market and uncertainty selftests
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/market/build_market_value.py --selftest

        python3 scripts/validation/build_value_uncertainty.py --selftest

        '
    - name: Build canonical artifacts in memory and quantify Market Value churn and center parity
      shell: bash
      run: "set -euo pipefail\ncat > /tmp/log-qf10-v4.py <<'QF10_PY'\nfrom __future__ import annotations\n\
        import datetime as dt\nimport json\nimport sys\nfrom pathlib import Path\n\nroot=Path.cwd()\n\
        assert (root/'index.html').is_file() and (root/'scripts'/'market'/'build_market_value.py').is_file(),\
        \ 'STOP unexpected repository root'\nsys.path.insert(0,str(root))  # QF10 V4R1: /tmp script needs\
        \ repository root for scripts namespace imports\nsys.path.insert(0,str(root/'scripts'/'validation'))\n\
        sys.path.insert(0,str(root/'scripts'/'market'))\nfrom scripts.market import build_market_value\
        \ as market_builder\nfrom scripts.validation import build_value_uncertainty as uncertainty_builder\n\
        from scripts.validation import snapshot_values\n\nmarket_saved=json.loads((root/'scripts/artifacts/generated/market_values.json').read_text())\n\
        uncertainty_saved=json.loads((root/'scripts/artifacts/generated/value_uncertainty.json').read_text())\n\
        nohist=json.loads((root/'research/no-history-v2/no_history_v2_phase3_evaluation.json').read_text())\n\
        v6_review=json.loads((root/'research/package-adjustment-v6/production_review_v1.json').read_text())\n\
        current=snapshot_values.compute_all_values(snapshot_values.load_from_html(root/'index.html'))\n\
        assert len(current)==565, f'STOP unexpected canonical population {len(current)}'\nassert market_saved['scale_semantics']=='league_rank_quantile_mapped_to_trade_desk_points_v1'\n\
        assert uncertainty_saved['range_semantics']=='sensitivity_envelope_v1_not_probability_interval'\n\
        \n# A1 and A3: explicit existing research constraints: no model change and no accidental extrapolation.\n\
        assert nohist['status']=='EARLY_DIAGNOSTIC_ONLY' and nohist['deployment_authorized'] is False\n\
        assert nohist['completed_consecutive_week_count']<8, 'STOP research readiness changed; re-review\
        \ policy'\nscope=v6_review['proposed_conservative_production_scope']\nassert scope['trade_topology']=='exactly\
        \ one target player versus exactly three package players'\nassert scope['outside_scope_behavior']=='fail_closed_no_V6_adjustment'\n\
        assert 'packageAssets.length === 3 && packageValues.length === 3' in (root/'index.html').read_text()\n\
        print('QF10_V4_A1_GOVERNANCE '+json.dumps({'status':nohist['status'],'completed_weeks':nohist['completed_consecutive_week_count'],'eligible_weeks_required_for_review':8,'model_change_authorized':False},sort_keys=True))\n\
        print('QF10_V4_A3_GOVERNANCE '+json.dumps({'frozen_v6_scope':scope['trade_topology'],'outside_scope':scope['outside_scope_behavior'],'four_player_extension_authorized':False,'model_change_authorized':False},sort_keys=True))\n\
        \n# Compute current model (authoritative FV) and both existing artifacts' as-deployed visibility.\n\
        def coverage(m,u):\n    all_rb=[key for key,v in current.items() if v.get('pos')=='RB']\n    rows={}\n\
        \    for key in all_rb:\n        fv=current[key]['value']\n        mr=(m.get('players') or {}).get(key)\n\
        \        ur=(u.get('players') or {}).get(key)\n        mp=bool(mr is not None and mr.get('fundamental_value')==fv\
        \ and isinstance(mr.get('market_value'),int | float) and mr['market_value']>=0)\n        up=bool(ur\
        \ is not None and ur.get('center_value')==fv and ur.get('range_low',1e99)<=fv<=ur.get('range_high',-1e99))\n\
        \        rows[key]=(mp,up)\n    return {'rb':len(all_rb),'both':sum(a and b for a,b in rows.values()),'market_only':sum(a\
        \ and not b for a,b in rows.values()),'uncertainty_only':sum(b and not a for a,b in rows.values()),'neither':sum(not\
        \ a and not b for a,b in rows.values())}\n\nbefore=coverage(market_saved,uncertainty_saved)\n\
        assert before['rb']==97, f'STOP unanticipated RB population {before}'\nprint('QF10_V4_LIVE_BEFORE\
        \ '+json.dumps({'saved_market_utc':market_saved['generated_at_utc'],'saved_uncertainty_utc':uncertainty_saved['generated_at_utc'],'coverage':before},sort_keys=True))\n\
        \n# Recreate uncertainty IN MEMORY; neither --write nor a tracked filesystem mutation.\nunc_rebuild=uncertainty_builder.build_payload()\n\
        assert unc_rebuild['range_semantics']==uncertainty_saved['range_semantics']\nassert len(unc_rebuild['players'])==len(uncertainty_saved['players'])==565\n\
        uc=coverage(market_saved,unc_rebuild)\nprint('QF10_V4_UNCERTAINTY_SHADOW '+json.dumps({'status':'REBUILT_IN_MEMORY_ONLY','covered':len(unc_rebuild['players']),'coverage_with_dated_market':uc,'saved_source_was':uncertainty_saved['generated_at_utc']},sort_keys=True))\n\
        \n# The Market rebuild uses the CURRENT live public vote sheet. If the external\n# source is unavailable,\
        \ report NOT_READY rather than inventing a market result.\ntry:\n    market_shadow=market_builder.build_payload(None)\n\
        except Exception as exc:\n    print('QF10_V4_MARKET_SHADOW '+json.dumps({'status':'NOT_READY_LIVE_SOURCE_UNAVAILABLE','error_type':type(exc).__name__,'reason':str(exc)[:300],'note':'No\
        \ refresh promoted; source availability must be repaired or retried'},sort_keys=True))\nelse:\n\
        \    assert market_shadow['method_version']==market_saved['method_version'],'STOP market method\
        \ drift'\n    assert market_shadow['policy_sha256']==market_saved['policy_sha256'],'STOP market\
        \ weighting policy drift'\n    assert market_shadow['scale_semantics']==market_saved['scale_semantics'],'STOP\
        \ market scale drift'\n    assert market_shadow['source']['mode']=='live_sheet','STOP not current\
        \ live source'\n    assert len(market_shadow['players'])>=100,'STOP insufficient live voting coverage'\n\
        \    after=coverage(market_shadow,unc_rebuild)\n    old=coverage(market_saved,uncertainty_saved)\n\
        \    sample_keys=set(market_shadow['players']) & set(market_saved['players'])\n    value_deltas=[abs(market_shadow['players'][k]['market_value']-market_saved['players'][k]['market_value'])\
        \ for k in sample_keys]\n    print('QF10_V4_MARKET_SHADOW '+json.dumps({'status':'PREVIEW_ONLY_NOT_PROMOTED','source_raw_rows':market_shadow['source'].get('raw_sheet_row_count'),'market_players':len(market_shadow['players']),'vote_quality':market_shadow['market_quality'],'common_players':len(sample_keys),'max_abs_market_value_change':max(value_deltas,default=0),'old_live_coverage':old,'candidate_coverage_with_uncertainty':after,'fully_restored_rbs':after['both']-old['both'],'no_model_change_authorized':True},sort_keys=True))\n\
        \n\n    # Independent QF10 V5: evaluate the new market's current-FV center parity,\n    # the\
        \ weight/rank distribution, and meaningful value changes across positions.\n    # These are DESCRIPTIVE\
        \ measurements only. No arbitrary approval threshold.\n    from collections import Counter\n \
        \   from statistics import median\n    market_old=market_saved['players']\n    market_new=market_shadow['players']\n\
        \    keys_old=set(market_old)\n    keys_new=set(market_new)\n    old_only=sorted(keys_old-keys_new)\n\
        \    new_only=sorted(keys_new-keys_old)\n    assert not (old_only or new_only), f'STOP Market\
        \ player coverage changed without separate review: removed={old_only[:8]} added={new_only[:8]}'\n\
        \    assert len(keys_new)>=100, 'STOP insufficient Market coverage'\n    assert set(unc_rebuild['players'])==set(current),\
        \ 'STOP uncertainty rebuild changed population'\n    bad_market_centers=[k for k,row in market_new.items()\
        \ if k not in current or row['fundamental_value']!=current[k]['value']]\n    bad_uncertainty_centers=[k\
        \ for k,row in unc_rebuild['players'].items() if row['center_value']!=current[k]['value']]\n \
        \   assert not bad_market_centers, f'STOP rebuilt Market centers != deployed FV: {bad_market_centers[:5]}'\n\
        \    assert not bad_uncertainty_centers, f'STOP rebuilt uncertainty centers != deployed FV: {bad_uncertainty_centers[:5]}'\n\
        \    churn=[]\n    for key in sorted(keys_new):\n        a=market_old[key]\n        b=market_new[key]\n\
        \        before_market=float(a['market_value'])\n        after_market=float(b['market_value'])\n\
        \        assert before_market>=0 and after_market>=0 and all(map(__import__('math').isfinite,[before_market,after_market])),\
        \ f'STOP invalid market for {key}'\n        change=after_market-before_market\n        churn.append({\n\
        \            'name':key,'position':b['pos'],\n            'oldMarket':round(before_market,2),'newMarket':round(after_market,2),\n\
        \            'deltaPoints':round(change,2),'absChange':abs(change),\n            'pctOldMarket':round(change/max(1,before_market)*100,2),\n\
        \            'pctCurrentFV':round(change/max(1,current[key]['value'])*100,2),\n            'currentFV':current[key]['value'],\n\
        \        })\n    churn.sort(key=lambda x:x['absChange'], reverse=True)\n    abs_values=sorted(x['absChange']\
        \ for x in churn)\n    def pct(q):\n        return round(abs_values[min(len(abs_values)-1,max(0,int(__import__('math').ceil(q*len(abs_values)))-1))],2)\n\
        \    old_top=set(sorted(keys_new,key=lambda k:-market_old[k]['market_value'])[:25])\n    new_top=set(sorted(keys_new,key=lambda\
        \ k:-market_new[k]['market_value'])[:25])\n    bins={'0':0,'1-99':0,'100-249':0,'250-499':0,'500-999':0,'1000+':0}\n\
        \    for row in churn:\n        amount=row['absChange']\n        cat='0' if amount==0 else '1-99'\
        \ if amount<100 else '100-249' if amount<250 else '250-499' if amount<500 else '500-999' if amount<1000\
        \ else '1000+'\n        bins[cat]+=1\n    pos_stats={}\n    for pos in sorted({x['position'] for\
        \ x in churn}):\n        vals=[x for x in churn if x['position']==pos]\n        pos_stats[pos]={\n\
        \            'players':len(vals),\n            'maxAbsPointChange':round(max(x['absChange'] for\
        \ x in vals),2),\n            'medianAbsPointChange':round(median(x['absChange'] for x in vals),2),\n\
        \            'countDelta500plus':sum(x['absChange']>=500 for x in vals),\n        }\n    # A refresh\
        \ of these artifacts must NEVER modify FV or Team Utility.\n    before_quality=market_saved.get('market_quality',{})\n\
        \    after_quality=market_shadow['market_quality']\n    print('QF10_V5_MARKET_CHURN '+json.dumps({\n\
        \        'decision':'SCIENTIFIC_AND_OWNER_REVIEW_REQUIRED_BEFORE_PUBLICATION',\n        'oldGeneratedAt':market_saved['generated_at_utc'],\n\
        \        'newGeneratedAt':market_shadow['generated_at_utc'],\n        'votersOldEffective':before_quality.get('total_effective_votes'),\n\
        \        'votersNewEffective':after_quality.get('total_effective_votes'),\n        'newRawVotes':after_quality.get('raw_votes'),\n\
        \        'newLargestEffectiveVoterSharePct':after_quality.get('largest_effective_voter_share_pct'),\n\
        \        'coveredPlayers':len(keys_new),'allCentersExactToCurrentFV':True,\n        'maxAbsoluteChange':pct(1.0),'p90AbsChange':pct(0.90),'p95AbsChange':pct(0.95),\n\
        \        'medianAbsChange':round(median(abs_values),2),\n        'bins':bins,'top25MarketOverlap':len(old_top&new_top),\n\
        \        'positionStats':pos_stats,'largestMovers':churn[:16],\n        'marketOnlyArtifact':'NO_FV_FORMULA_CHANGE_AUTHORIZED',\n\
        \    },sort_keys=True))\n    print('QF10_V5_FRESHNESS_PARITY '+json.dumps({\n        'exact565UncertaintyCenters':len(unc_rebuild['players']),\n\
        \        'exactMarketCenters':len(market_new),\n        'rbsFullyRestored':after['both']-old['both'],\n\
        \        'oldMarketUncertaintyBoth':old['both'],\n        'newMarketUncertaintyBoth':after['both'],\n\
        \        'marketAbsentRB':after['uncertainty_only'],\n        'noArtifactWrites':True,\n    },sort_keys=True))\n\
        \nprint('QF10_V5_READ_ONLY_GREEN all_descriptive_no_promotion=True no_model_or_artifact_writes=True')\n\
        QF10_PY\npython3 -m py_compile /tmp/log-qf10-v4.py\npython3 /tmp/log-qf10-v4.py"
    - name: Run existing repo regressions, no policy change
      shell: bash
      run: 'set -euo pipefail

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        '
    - name: Prove zero writes and retain original exact-scientific-source pins
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { echo ''STOP repo changed''; exit 1; }

        [[ "$(git hash-object index.html)" == ''c83e3f68d11853c072017e6bd83bb1ad085f4a3e'' ]] || exit
        1

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == ''829445174a77ceb4bb19dfd97a725e371d18efe8''
        ]] || exit 1

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == ''24c9f63881cc768a18d412172f04e5a263a4abc2''
        ]] || exit 1

        echo ''QF10_V5_ZERO_WRITE_GREEN: no model or artifact writes, no commit, no branch and no promotion''

        '
