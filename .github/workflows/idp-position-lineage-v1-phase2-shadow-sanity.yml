      - name: Prove production firewall and exact research diff
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          sha256sum -c "${RUNNER_TEMP}/phase2-production-baseline.sha256"

          python3 - <<'PY'
          import subprocess

          expected = {
              "research/idp-position-lineage-v1/phase2_preregistration.json",
              "research/idp-position-lineage-v1/phase2_preregistration.md",
              "research/idp-position-lineage-v1/idp_position_lineage_v1_phase2.py",
              "research/idp-position-lineage-v1/idp_position_lineage_v1_phase2.json",
              "research/idp-position-lineage-v1/idp_position_lineage_v1_phase2.md",
              "research/idp-position-lineage-v1/phase2_manifest.json",
          }

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              text=True,
          )
          actual = set()
          for line in raw.splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              actual.add(path)

          if actual != expected:
              raise SystemExit(
                  "Phase 2 research diff mismatch.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(actual)}"
              )
          print("PASS: exactly six Phase 2 research artifacts changed.")
          PY

