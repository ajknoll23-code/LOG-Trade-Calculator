name: A03 R18 - Stage S Shared As Of Shadow Repair Design Read Only

# DESIGN-ONLY: confirms two explicit-date call-site concepts with pinned live functions.
# No production snapshot authority chosen, no real prices, no browser UI acceptance.
# It must not be interpreted as permission to patch index.html.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a03-r18-read-only-asof-shadow-design
  cancel-in-progress: false

jobs:
  isolated-shadow-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact frozen tested commit, credentials disabled
        uses: actions/checkout@v4
        with:
          ref: 8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6
          persist-credentials: false
          fetch-depth: 1

      - name: Guard pinned index and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6'
          printf '%s  %s\n' 'af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78' index.html | sha256sum --check --status
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Stage ephemeral synthetic-only JS outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a03_r18_shadow.js" <<'A03R18SCRIPT'
          #!/usr/bin/env node
          'use strict';
          /* A03 R18 v1 — read-only SHADOW experiment for deployed live-call-path clock fix.
           * Run only against a fixed pinned index.html; produces synthetic evidence only.
           * Two exact in-memory call-site rewrites, NO repository/file change.
           * Deliberately DOES NOT select a trusted production as-of-date source.
           * Approval from this experiment is DESIGN_ONLY, not deployment authorization.
           */
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const ENGINE_SHA='af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78';
          const COMMIT='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6';
          const args=process.argv.slice(2);
          if(args.length!==2||args[0]!=='--engine')throw Error('USAGE: --engine index.html');
          const html=fs.readFileSync(args[1],'utf8');
          if(sha(html)!==ENGINE_SHA)throw Error('HOLD_ENGINE_SHA_CHANGED');
          const begin='<script>\n/* ---------- Value engine ---------- */';
          const endMarker="document.getElementById('resetBtn').addEventListener('click', clearCalculator);";
          const a=html.indexOf(begin),b=html.indexOf(endMarker,a);
          if(a<0||b<=a||html.indexOf(begin,a+1)!==-1)throw Error('HOLD_SCRIPT_BOUNDARY');
          const source=html.slice(a+'<script>\n'.length,b);
          for(const needle of ['function fractionalAgeFromBirthDate(', 'function effectiveAgeMultiplier(',
           'function playerValue(', 'function displayPlayerAge(', 'function playerValueByKey(',
           'function addPlayerAsset('])if(!source.includes(needle))throw Error('HOLD_MISSING_FUNCTION:'+needle);
          // Only two call-site rewrites. The helper, age curves, production, weights and values are unchanged.
          const patches=[
           ['const fractionalAge = fractionalAgeFromBirthDate(birthDate, age);',
            'const fractionalAge = fractionalAgeFromBirthDate(birthDate, age, A03R18_ASOF);'],
           ['const precise = fractionalAgeFromBirthDate(dob, age);',
            'const precise = fractionalAgeFromBirthDate(dob, age, A03R18_ASOF);']
          ];
          function replaceOnce(haystack,before,after){
           const first=haystack.indexOf(before);
           if(first<0||haystack.indexOf(before,first+1)>=0)throw Error('HOLD_CALLSITE_UNIQUE_MATCH_FAILED');
           return haystack.slice(0,first)+after+haystack.slice(first+before.length);
          }
          let candidateSource=source;
          for(const [before,after] of patches)candidateSource=replaceOnce(candidateSource,before,after);
          if(candidateSource===source||patches.some(([before,after])=>candidateSource.includes(before)||!candidateSource.includes(after)))
           throw Error('HOLD_SHADOW_REWRITE_NOT_APPLIED');
          function explicitDate(raw){
           if(typeof raw!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(raw))throw Error('HOLD_ASOF_MISSING_OR_INVALID');
           const date=new Date(raw+'T00:00:00Z');
           if(!Number.isFinite(date.getTime())||date.toISOString().slice(0,10)!==raw)throw Error('HOLD_ASOF_MISSING_OR_INVALID');
           return raw;
          }
          function frozenDate(iso){
           const n=Date.parse(iso);if(!Number.isFinite(n))throw Error('BAD_SIMULATED_CLOCK');
           return class FrozenDate extends Date{constructor(...xs){super(...(xs.length?xs:[n]));}static now(){return n;}};
          }
          const networkSpy={fetchCalls:0,xhrCalls:0};
          function forbiddenFetch(){networkSpy.fetchCalls++;throw Error('HOLD_NETWORK_FETCH_CALLED');}
          class ForbiddenXHR{constructor(){networkSpy.xhrCalls++;throw Error('HOLD_NETWORK_XHR_CALLED');}}
          const silent=Object.freeze({log(){},warn(){},error(){}});
          function makeEngine(clock,asOf=null){
           const shadow=asOf!==null;
           if(shadow)explicitDate(asOf);
           // No DOM, fetch, XHR or localStorage used by this strictly isolated function path.
           // Live source is loaded as top-level definitions; render() is stubbed after evaluation.
           const body=(shadow?'const A03R18_ASOF='+JSON.stringify(asOf)+';\n':'')+
             (shadow?candidateSource:source)+
             '\nrender = function A03R18_NO_DOM_RENDER(){};\n'+
             'return {playerValue,playerValueByKey,addPlayerAsset,displayPlayerAge,'+
             'fractionalAgeFromBirthDate,normalizeName,PLAYER_DB,RB_BIRTH_DATE_DATA,PROD_MULT,state};';
           return (new Function('Date','console','fetch','XMLHttpRequest','document','window','localStorage',body))(
            frozenDate(clock),silent,forbiddenFetch,ForbiddenXHR,undefined,undefined,undefined);
          }
          const guards=[];
          function chk(name,condition){guards.push({name,pass:!!condition});if(!condition)throw Error('HOLD_R18_GUARD:'+name);}
          const rb='a03 r18 synthetic rb 599777',wr='a03 r18 synthetic wr 599777',undated='a03 r18 undated rb 599777';
          const dob='2000-03-01',P=0.7;
          const clocks=['2026-10-14T19:00:00Z','2026-12-14T19:00:00Z','2031-06-01T19:00:00Z'];
          const asOfs=['2026-10-14','2026-12-14'];
          function probe(clock,asOf){
           const X=makeEngine(clock,asOf);
           const key=X.normalizeName(rb),wrKey=X.normalizeName(wr),noKey=X.normalizeName(undated);
           if([key,wrKey,noKey].some(k=>Object.prototype.hasOwnProperty.call(X.PLAYER_DB,k)||
             Object.prototype.hasOwnProperty.call(X.PROD_MULT,k)||
             Object.prototype.hasOwnProperty.call(X.RB_BIRTH_DATE_DATA,k)))throw Error('HOLD_SYNTHETIC_ID_COLLISION');
           // No real player rows used; injected data remains confined to the ephemeral evaluator.
           X.PLAYER_DB[key]={pos:'RB',age:26,role:'Starter',birth_date:dob,team:'SYNTHETIC'};
           X.RB_BIRTH_DATE_DATA[key]=dob;
           X.PROD_MULT[key]=P;X.PROD_MULT[wrKey]=P;X.PROD_MULT[noKey]=P;
           const fv=X.playerValue('RB',26,'Starter',rb);
           const lookup=X.playerValueByKey(key);
           const displayed=X.displayPlayerAge('RB',26,rb);
           const result=X.addPlayerAsset('A',rb,'RB',26,'Starter');
           const stateVal=X.state.A[0]?.value;
           const wrFV=X.playerValue('WR',26,'Starter',wr);
           const undatedFV=X.playerValue('RB',26,'Starter',undated);
           const explicitAge=X.fractionalAgeFromBirthDate(dob,26,asOf||clock.slice(0,10));
           return {simulated_utc_clock:clock,as_of_date:asOf||null,rb_fv:fv,rb_lookup_fv:lookup,
            rb_display_age:displayed,rb_explicit_age:explicitAge,trade_add_success:result===true,
            trade_state_value:stateVal,wr_control_fv:wrFV,rb_no_dob_control_fv:undatedFV};
          }
          const baseline=clocks.map(c=>probe(c,null));
          const grid=asOfs.flatMap(asOf=>clocks.map(c=>probe(c,asOf)));
          const uniq=xs=>new Set(xs).size;
          chk('original_rb_clock_sensitive',uniq(baseline.map(x=>x.rb_fv))>1);
          chk('original_display_clock_sensitive',uniq(baseline.map(x=>x.rb_display_age))>1);
          chk('original_wr_and_undated_controls_stable',uniq(baseline.map(x=>x.wr_control_fv))===1&&uniq(baseline.map(x=>x.rb_no_dob_control_fv))===1);
          for(const asOf of asOfs){
           const rows=grid.filter(x=>x.as_of_date===asOf);
           chk('shadow_rb_fv_clock_invariant_'+asOf,rows.length===3&&uniq(rows.map(x=>x.rb_fv))===1);
           chk('shadow_rb_display_clock_invariant_'+asOf,uniq(rows.map(x=>x.rb_display_age))===1);
           chk('shadow_lookup_and_trade_state_consistent_'+asOf,rows.every(x=>x.trade_add_success&&x.rb_fv===x.rb_lookup_fv&&x.rb_fv===x.trade_state_value));
           chk('shadow_explicit_age_stable_'+asOf,uniq(rows.map(x=>x.rb_explicit_age))===1&&Math.abs(rows[0].rb_explicit_age-X_fallbackAge(asOf))<1e-10);
           chk('shadow_wr_and_undated_stable_'+asOf,uniq(rows.map(x=>x.wr_control_fv))===1&&uniq(rows.map(x=>x.rb_no_dob_control_fv))===1);
          }
          function X_fallbackAge(asOf){ // Pure calculation mirrors the pinned 365/366-day birthday span for this fixture.
           const current=new Date(asOf+'T00:00:00Z'),yr=current.getUTCFullYear();
           const last=Date.UTC(yr,2,1),next=Date.UTC(yr+1,2,1);
           return yr-2000+(current.getTime()-last)/(next-last);
          }
          chk('matched_clock_is_price_neutral_at_first_asof',grid.find(x=>x.as_of_date===asOfs[0]&&x.simulated_utc_clock===clocks[0]).rb_fv===baseline[0].rb_fv);
          chk('matched_clock_is_price_neutral_at_second_asof',grid.find(x=>x.as_of_date===asOfs[1]&&x.simulated_utc_clock===clocks[1]).rb_fv===baseline[1].rb_fv);
          chk('different_explicit_dates_allow_intentional_age_progression',grid.find(x=>x.as_of_date===asOfs[0]).rb_fv!==grid.find(x=>x.as_of_date===asOfs[1]).rb_fv);
          let noDateRejected=false,malformedRejected=false,impossibleRejected=false;
          try{explicitDate(null)}catch(e){noDateRejected=e.message==='HOLD_ASOF_MISSING_OR_INVALID'}
          try{explicitDate('2026-10-14T19:00:00Z')}catch(e){malformedRejected=e.message==='HOLD_ASOF_MISSING_OR_INVALID'}
          try{explicitDate('2026-02-30')}catch(e){impossibleRejected=e.message==='HOLD_ASOF_MISSING_OR_INVALID'}
          chk('shadow_api_missing_asof_rejected',noDateRejected);
          chk('shadow_api_timestamp_instead_of_date_rejected',malformedRejected);
          chk('shadow_api_impossible_date_rejected',impossibleRejected);
          chk('no_network_attempted',networkSpy.fetchCalls===0&&networkSpy.xhrCalls===0);
          chk('only_two_in_memory_callsites_rewritten',patches.length===2&&source!==candidateSource);
          const payload={study:'A03_R18_V1',result:'PASS_READ_ONLY_SHADOW_DESIGN__ASOF_PROVENANCE_AND_DEPLOYED_INTEGRATION_HOLD',
           disposition:'DESIGN_ONLY_NO_PRICE_PROMOTION',engine:{repo:'ajknoll23-code/LOG-Trade-Calculator',commit:COMMIT,
           index_html_sha256:ENGINE_SHA,real_pinned_functions_executed:true,browser_DOM_executed:false},
           source_edit:{on_disk_files_modified:false,shadow_in_memory_only:true,exact_call_sites:patches.length,
           changed_call_sites:['effectiveAgeMultiplier: fractionAge DOB argument','displayPlayerAge: fractionAge DOB argument'],
           production_asof_source_selected:false},
           research_fixture:{dob,production_index:P,role:'Starter',synthetic_only:true},
           original_baseline:baseline,shadow_grid:grid,guards,passed:guards.length,failed:0,
           measured_network:{fetch:networkSpy.fetchCalls,xhr:networkSpy.xhrCalls},
           production_asof_provenance:'HOLD_NOT_ESTABLISHED',full_browser_acceptance:false,
           real_player_rows_read:false,actual_historical_rows_read:false,production_change_authorized:false,
           B2_approved:false,E2_access:false,roleV2_pricing_authorized:false,
           new_A_prices_authorized:false,new_FV_coefficients_authorized:false};
          console.log(JSON.stringify(payload,null,2));
          A03R18SCRIPT
          node --check "$RUNNER_TEMP/a03_r18_shadow.js"
          printf '%s  %s\n' '2f3c3a38781b294765cb9809950e139f7fbee7c427ee1e0eefa13271ba8e5241' "$RUNNER_TEMP/a03_r18_shadow.js" | sha256sum --check --status

      - name: Test in-memory date-threaded shadow design with real pinned functions
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/a03_r18_shadow.js" --engine index.html > "$RUNNER_TEMP/a03-r18-shadow-design.json"
          node - "$RUNNER_TEMP/a03-r18-shadow-design.json" <<'A03R18ASSERT'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          function ok(b,s){if(!b)throw Error('HOLD_A03_R18_JSON:'+s)}
          ok(x.study==='A03_R18_V1','study');
          ok(x.result==='PASS_READ_ONLY_SHADOW_DESIGN__ASOF_PROVENANCE_AND_DEPLOYED_INTEGRATION_HOLD','result');
          ok(x.disposition==='DESIGN_ONLY_NO_PRICE_PROMOTION','disposition');
          ok(x.engine?.commit==='8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6','commit');
          ok(x.engine?.index_html_sha256==='af0a59e24748c3c4610d2496d14bc34f434836780c2e0144f43f500f7a2c9a78','engine_sha');
          ok(x.engine?.real_pinned_functions_executed===true&&x.engine?.browser_DOM_executed===false,'engine_scope');
          ok(x.source_edit?.on_disk_files_modified===false&&x.source_edit?.shadow_in_memory_only===true,'no_disk_change');
          ok(x.source_edit?.exact_call_sites===2&&x.source_edit?.production_asof_source_selected===false,'two_calls_no_source_selected');
          ok(Array.isArray(x.guards)&&x.guards.length===21&&x.passed===21&&x.failed===0&&x.guards.every(g=>g.pass===true),'guards');
          ok(Array.isArray(x.original_baseline)&&x.original_baseline.length===3,'original_clocks');
          ok(Array.isArray(x.shadow_grid)&&x.shadow_grid.length===6,'shadow_3_by_2');
          const uniq=a=>new Set(a).size;
          ok(uniq(x.original_baseline.map(r=>r.rb_fv))>1,'original_clock_drift');
          ok(uniq(x.original_baseline.map(r=>r.rb_display_age))>1,'original_display_drift');
          for(const date of ['2026-10-14','2026-12-14']){
           const rows=x.shadow_grid.filter(r=>r.as_of_date===date);
           ok(rows.length===3&&uniq(rows.map(r=>r.rb_fv))===1,'fixed_value_'+date);
           ok(uniq(rows.map(r=>r.rb_display_age))===1,'fixed_display_'+date);
           ok(rows.every(r=>r.rb_fv===r.rb_lookup_fv&&r.rb_fv===r.trade_state_value&&r.trade_add_success===true),'trade_chain_'+date);
           ok(uniq(rows.map(r=>r.wr_control_fv))===1&&uniq(rows.map(r=>r.rb_no_dob_control_fv))===1,'controls_'+date);
          }
          ok(x.shadow_grid.find(r=>r.as_of_date==='2026-10-14').rb_fv!==x.shadow_grid.find(r=>r.as_of_date==='2026-12-14').rb_fv,'intentional_date_progression');
          ok(x.measured_network?.fetch===0&&x.measured_network?.xhr===0,'network');
          ok(x.production_asof_provenance==='HOLD_NOT_ESTABLISHED','source_gate');
          for(const flag of ['full_browser_acceptance','real_player_rows_read','actual_historical_rows_read','production_change_authorized','B2_approved','E2_access','roleV2_pricing_authorized','new_A_prices_authorized','new_FV_coefficients_authorized'])ok(x[flag]===false,flag);
          console.log('R18_SHADOW_DESIGN_PASS_DEPLOYED_INTEGRATION_STILL_HOLD');
          A03R18ASSERT

      - name: Upload design-only synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: A03-R18-ReadOnly-AsOf-Shadow-Design-Evidence
          path: ${{ runner.temp }}/a03-r18-shadow-design.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert repository unchanged by design experiment
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = '8fe16f7b7e47c4779f3a3bcdf01314aefd160fb6'
