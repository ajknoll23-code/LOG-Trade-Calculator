name: Consolidate IDP V1 Release

# One-time repository reorganization workflow.
# Makes model/releases/idp-v1/ the single canonical home for the frozen IDP V1
# release, updates live validators, proves the migration, removes duplicate
# legacy copies, proves it again, then commits the result.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: consolidate-idp-v1-release
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install requests

      - name: Consolidate release paths
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          canonical = root / "model" / "releases" / "idp-v1"
          legacy_release = root / "scripts" / "artifacts" / "releases" / "idp_v1"
          regression = root / "scripts" / "validation" / "repo_regression_checks.py"
          validator = root / "scripts" / "validation" / "validate_idp_v1_final_deployment.py"
          manifest_path = canonical / "idp_v1_release_manifest.json"

          required = {
              "production_history_components.json": "bdefbe66535437d0848d19d310d727a4ef103025427e14a7a040728aa433c54c",
              "prod_mult_pre_v1_baseline.json": "20645436ff3c35ba0318e1b5de3148b53566bbb4c006c9ee7e5d1ac1cdd8380e",
              "idp_v1_model_delta_transport_candidate.json": "a920471c9c8cd4f7c7360850099ed016e3dc508f3022aca05e219459d8e4435f",
              "idp_v1_prod_mult_patch.json": "e2107eca1294975115fe43c4f75c6d91516fe7ad72cd773fb11bbef215bf59db",
          }

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          # Guard 1: canonical release package must already contain the exact
          # frozen bytes before any path is changed.
          for name, expected in required.items():
              path = canonical / name
              assert path.exists(), f"Missing canonical release artifact: {path}"
              actual = sha256(path)
              assert actual == expected, (
                  f"Canonical release artifact hash mismatch: {path}: "
                  f"{actual} != {expected}"
              )

          # Guard 2: duplicate legacy copies must still be exact duplicates
          # before we remove them.
          duplicate_pairs = [
              (
                  legacy_release / "production_history_components.json",
                  canonical / "production_history_components.json",
              ),
              (
                  legacy_release / "idp_v1_model_delta_transport_candidate.json",
                  canonical / "idp_v1_model_delta_transport_candidate.json",
              ),
              (
                  legacy_release / "idp_v1_prod_mult_patch.json",
                  canonical / "idp_v1_prod_mult_patch.json",
              ),
              (
                  root / "scripts" / "prod_mult_pre_v1_baseline.json",
                  canonical / "prod_mult_pre_v1_baseline.json",
              ),
          ]
          for legacy, source in duplicate_pairs:
              assert legacy.exists(), f"Expected legacy copy is missing: {legacy}"
              assert legacy.read_bytes() == source.read_bytes(), (
                  f"Legacy copy is not byte-identical to canonical source: {legacy}"
              )

          # Make the permanent model release package self-contained and
          # hash-protect those canonical paths.
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["immutable_release_artifacts"] = {
              "model/releases/idp-v1/production_history_components.json":
                  required["production_history_components.json"],
              "model/releases/idp-v1/prod_mult_pre_v1_baseline.json":
                  required["prod_mult_pre_v1_baseline.json"],
              "model/releases/idp-v1/idp_v1_model_delta_transport_candidate.json":
                  required["idp_v1_model_delta_transport_candidate.json"],
              "model/releases/idp-v1/idp_v1_prod_mult_patch.json":
                  required["idp_v1_prod_mult_patch.json"],
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          # Point the regression suite at the canonical release package.
          text = regression.read_text(encoding="utf-8")
          old_manifest = (
              'IDP_V1_RELEASE_MANIFEST = SCRIPT_DIR.parent / "artifacts" / '
              '"releases" / "idp_v1" / "idp_v1_release_manifest.json"'
          )
          new_manifest = (
              'IDP_V1_RELEASE_DIR = REPO_ROOT / "model" / "releases" / "idp-v1"\n'
              'IDP_V1_RELEASE_MANIFEST = IDP_V1_RELEASE_DIR / "idp_v1_release_manifest.json"'
          )
          assert old_manifest in text, "Regression manifest path signature changed"
          text = text.replace(old_manifest, new_manifest, 1)

          replacements = {
              'SCRIPT_DIR.parent / "prod_mult_pre_v1_baseline.json"':
                  'IDP_V1_RELEASE_DIR / "prod_mult_pre_v1_baseline.json"',
              'SCRIPT_DIR.parent / "artifacts" / "releases" / "idp_v1" / "production_history_components.json"':
                  'IDP_V1_RELEASE_DIR / "production_history_components.json"',
              'SCRIPT_DIR.parent / "artifacts" / "releases" / "idp_v1" / "idp_v1_model_delta_transport_candidate.json"':
                  'IDP_V1_RELEASE_DIR / "idp_v1_model_delta_transport_candidate.json"',
              'SCRIPT_DIR.parent / "artifacts" / "releases" / "idp_v1" / "idp_v1_prod_mult_patch.json"':
                  'IDP_V1_RELEASE_DIR / "idp_v1_prod_mult_patch.json"',
          }
          for old, new in replacements.items():
              assert old in text, f"Regression path signature changed: {old}"
              text = text.replace(old, new)
          regression.write_text(text, encoding="utf-8")

          # Point the standalone deployment validator at the same canonical
          # release package.
          text = validator.read_text(encoding="utf-8")
          old_block = "\n".join([
              'INDEX = REPO_ROOT / "index.html"',
              'BASELINE = SCRIPT_DIR.parent / "prod_mult_pre_v1_baseline.json"',
              'CANDIDATE = SCRIPT_DIR.parent / "artifacts" / "releases" / "idp_v1" / "idp_v1_model_delta_transport_candidate.json"',
              'PATCH = SCRIPT_DIR.parent / "artifacts" / "releases" / "idp_v1" / "idp_v1_prod_mult_patch.json"',
          ])
          new_block = "\n".join([
              'INDEX = REPO_ROOT / "index.html"',
              'IDP_V1_RELEASE_DIR = REPO_ROOT / "model" / "releases" / "idp-v1"',
              'BASELINE = IDP_V1_RELEASE_DIR / "prod_mult_pre_v1_baseline.json"',
              'CANDIDATE = IDP_V1_RELEASE_DIR / "idp_v1_model_delta_transport_candidate.json"',
              'PATCH = IDP_V1_RELEASE_DIR / "idp_v1_prod_mult_patch.json"',
          ])
          assert old_block in text, "Deployment validator path signature changed"
          text = text.replace(old_block, new_block, 1)
          validator.write_text(text, encoding="utf-8")

          print("Canonical path migration prepared.")
          PY

      - name: Validate canonical paths before deleting duplicates
        run: |
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_idp_v1_final_deployment.py

      - name: Remove duplicate legacy release copies
        run: |
          rm -f scripts/artifacts/releases/idp_v1/production_history_components.json
          rm -f scripts/artifacts/releases/idp_v1/idp_v1_model_delta_transport_candidate.json
          rm -f scripts/artifacts/releases/idp_v1/idp_v1_prod_mult_patch.json
          rm -f scripts/artifacts/releases/idp_v1/idp_v1_release_manifest.json
          rm -f scripts/prod_mult_pre_v1_baseline.json

          # The deployment validator writes disposable reports when executed.
          # Do not commit those runner-only outputs.
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md

      - name: Validate again after duplicate removal
        run: |
          python3 scripts/validation/repo_regression_checks.py
          python3 scripts/validation/validate_idp_v1_final_deployment.py

      - name: Commit consolidation
        run: |
          rm -f scripts/validation/idp_v1_final_deployment_validation.json
          rm -f scripts/validation/idp_v1_final_deployment_validation.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git status --short

          if git diff --staged --quiet; then
            echo "No consolidation changes to commit."
            exit 0
          fi

          git commit -m "Consolidate IDP V1 release artifacts"
          git push
