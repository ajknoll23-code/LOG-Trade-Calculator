        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/nl57_repair.py" \
            --source .github/workflows/A-NL47R1-Weekly-Approved-V7-Newsletters.yml \
            --output nl57_preview \
            --nl39 nl57_sources/nl39 \
            --nl44 nl57_sources/nl44
          python3 - <<'NL57_YAML'
          from pathlib import Path
          import yaml
          p=Path('nl57_preview/A-NL47R1-REPAIRED-CANDIDATE-DO-NOT-DEPLOY.yml')
          y=yaml.safe_load(p.read_text())
          assert y['name']=='A-NL47R1 - LOG Approved Weekly Newsletters (One Run)'
          assert y['permissions']=={'contents':'read','actions':'write'}
          assert 'approved-newsletters' in y['jobs']
          print('PASS: NL47 candidate YAML syntax, exact workflow identity and permissions')
          NL57_YAML
      - name: Upload UNPUBLISHED NL47 repair candidate and QA report
