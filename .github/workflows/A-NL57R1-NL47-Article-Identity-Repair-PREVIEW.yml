name: A-NL57R1 - NL47 Strict Article Identity Repair Preview
run-name: A-NL57R1 - Preview corrected NL47 renderer without deployment
'on':
  workflow_dispatch:
    inputs:
      nl39_run_id:
        description: Successful W10/W9 NL39 editorial source run (do not use an unreviewed run)
        required: true
        type: string
        default: '42837666274'
      nl44_run_id:
        description: Successful W10 NL44 V7 War Room source run
        required: true
        type: string
        default: '42837956712'
permissions:
  contents: read
  actions: read
concurrency:
  group: log-nl57r1-release-identity-repair-preview
  cancel-in-progress: false
jobs:
  candidate-repair:
    name: Pin NL47 engine, patch guard only, compare 6 real source articles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable production source read-only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact original NL39 matchup PDFs for read-only test
        uses: actions/download-artifact@v4
        with:
          name: LOG-NL39R1-Weekly-Newsroom-Shadow-${{ inputs.nl39_run_id }}
          run-id: ${{ inputs.nl39_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl57_sources/nl39
      - name: Download approved NL44 V7 War Room for read-only test
        uses: actions/download-artifact@v4
        with:
          name: LOG-W10-V7-WarRoom-RELEASE-${{ inputs.nl44_run_id }}
          run-id: ${{ inputs.nl44_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: nl57_sources/nl44
      - name: Install pinned PDF inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pymupdf==1.26.5' 'PyYAML==6.0.2'
      - name: Restore hash-pinned NL57 preview builder
