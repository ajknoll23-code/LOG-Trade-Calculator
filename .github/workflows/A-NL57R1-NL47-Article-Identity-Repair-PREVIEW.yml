        with:
          name: LOG-NL57R1-NL47-REPAIR-PREVIEW-${{ github.run_id }}
          path: nl57_preview/
          retention-days: 90
          if-no-files-found: error
      - name: Summarize safety boundary and next step
        shell: bash
        run: |
          cat nl57_preview/NL57R1-REPAIR-PREVIEW.md >> "$GITHUB_STEP_SUMMARY"
          echo 'NL57 is a read-only preview. DO NOT DEPLOY the NL47 candidate until 4-edition historical originality and human approval are integrated.' >> "$GITHUB_STEP_SUMMARY"
