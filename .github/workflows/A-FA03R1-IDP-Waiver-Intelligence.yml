          PYTHON
      - name: Preview or apply additive board integration
        run: python3 _idp_payload/idp_intel_deploy.py --mode "${{ inputs.mode }}"
      - name: Confirm canonical valuation parity unchanged on Apply
        if: inputs.mode == 'apply'
        run: python3 scripts/sync/sync_free_agent_valuation.py --check
      - name: Check staged JS parses on Apply
        if: inputs.mode == 'apply'
        run: |
          node --check assets/idp_intel_v1.js
          python3 -m json.tool data/idp_ros_2026_w09.json > /dev/null
      - name: Commit only new IDP feature files on Apply
        if: inputs.mode == 'apply'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- free-agent-board.html data/idp_ros_2026_w09.json assets/idp_intel_v1.js assets/idp_intel_v1.css
          if git diff --cached --quiet; then
            echo "Already deployed; no changes needed."
          else
            git commit -m "Add isolated IDP ROS waiver intelligence overlay"
            git push origin HEAD:main
          fi
      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo '## A-FA03R1 IDP Waiver Intelligence' >> "$GITHUB_STEP_SUMMARY"
          echo '- Uses 300 ordinal expert ROS ranks supplied by league owner' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live availability comes from data/free_agents.json' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live owner roster comes from data/league_rosters.json' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ranked IDP list, waiver targets, team roster, add/drop context' >> "$GITHUB_STEP_SUMMARY"
          echo '- No Fundamental Value, FV+, lineup optimizer, or other model changes' >> "$GITHUB_STEP_SUMMARY"
