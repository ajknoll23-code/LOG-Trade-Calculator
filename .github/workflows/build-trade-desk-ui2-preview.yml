name: Build Trade Desk UI2 Preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify locked production source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_INDEX_BLOB="0f587dcb9740d0986acc705b305cdaa6217c0ae9"
          ACTUAL_INDEX_BLOB="$(git hash-object index.html)"
          echo "Expected index.html blob: $EXPECTED_INDEX_BLOB"
          echo "Actual index.html blob:   $ACTUAL_INDEX_BLOB"
          test "$ACTUAL_INDEX_BLOB" = "$EXPECTED_INDEX_BLOB"

      - name: Preserve pre-UI2 preview rollback tag
        shell: bash
        env:
          BACKUP_TAG: trade-desk-preview-pre-ui2-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${BACKUP_TAG}" >/dev/null 2>&1; then
            echo "Rollback tag ${BACKUP_TAG} already exists."
          else
            git tag "${BACKUP_TAG}" HEAD
            git push origin "refs/tags/${BACKUP_TAG}"
            echo "Created rollback tag ${BACKUP_TAG} -> $(git rev-parse HEAD)"
          fi

      - name: Build full-copy UI2 preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import hashlib

          prod_path = Path("index.html")
          preview_path = Path("trade-desk-preview.html")

          prod = prod_path.read_text(encoding="utf-8")

          required = [
              'id="sidesWrap"',
              'meter-wrap',
              'id="labelA"',
              'id="labelB"',
              'id="verdictText"',
              'team_utility_projection_runtime.js',
          ]
          missing = [token for token in required if token not in prod]
          if missing:
              raise RuntimeError(f"Production structure changed; missing selectors: {missing}")

          marker = "TRADE_DESK_UI2_FULL_COPY_PREVIEW_V1"
          if marker in prod:
              raise RuntimeError("UI2 preview marker unexpectedly exists in production index.html")

          # Start from the exact production file every run.
          preview = prod

          preview = preview.replace(
              "<title>Trade Desk — League of Ordinary Gentlemen</title>",
              "<title>Trade Desk UI2 Preview — League of Ordinary Gentlemen</title>",
              1,
          )

          css = r'''
          <style id="trade-desk-ui2-preview-styles">
          /* TRADE_DESK_UI2_FULL_COPY_PREVIEW_V1
             Presentation only. Production index.html is copied verbatim first,
             then this style layer is appended to the preview copy. */

          :root{
            --ui2-deep:#091B2C;
            --ui2-card:#173754;
            --ui2-card-hover:#1D4265;
            --ui2-shadow:0 14px 38px rgba(2,10,18,.20);
            --ui2-soft-shadow:0 8px 22px rgba(2,10,18,.14);
          }

          body{
            background:
              radial-gradient(circle at 50% -8%,rgba(235,98,97,.075),transparent 34rem),
              var(--bg)!important;
          }

          .wrap{
            max-width:1180px!important;
            padding-left:20px!important;
            padding-right:20px!important;
            padding-bottom:92px!important;
          }

          .ui2-preview-notice{
            width:min(1180px,calc(100% - 32px));
            margin:10px auto 0;
            padding:8px 12px;
            border:1px solid rgba(232,184,75,.26);
            border-radius:9px;
            background:rgba(232,184,75,.075);
            color:var(--amber);
            text-align:center;
            font-family:'IBM Plex Mono',monospace;
            font-size:8.5px;
            font-weight:600;
            letter-spacing:.09em;
            text-transform:uppercase;
          }

          .log-page-header{
            padding-top:16px!important;
            padding-bottom:15px!important;
            margin-bottom:14px!important;
          }

          .log-page-header>h1{
            font-size:29px!important;
            margin-bottom:5px!important;
          }

          .log-page-header>p{
            font-size:12px!important;
          }

          .section-label{
            margin-top:18px!important;
            margin-bottom:10px!important;
          }

          .ui2-workspace-kicker{
            display:flex;
            align-items:end;
            justify-content:space-between;
            gap:14px;
            margin:6px 0 11px;
          }

          .ui2-workspace-kicker-main{
            min-width:0;
          }

          .ui2-workspace-eyebrow{
            margin-bottom:3px;
            color:var(--text-dim);
            font-family:'IBM Plex Mono',monospace;
            font-size:8.5px;
            font-weight:600;
            letter-spacing:.12em;
            text-transform:uppercase;
          }

          .ui2-workspace-title{
            color:var(--text);
            font-family:'Inter',sans-serif;
            font-size:16px;
            font-weight:800;
            letter-spacing:-.01em;
          }

          .ui2-workspace-help{
            max-width:420px;
            color:var(--text-dim);
            text-align:right;
            font-family:'IBM Plex Mono',monospace;
            font-size:8.5px;
            line-height:1.4;
          }

          .ui2-trade-workspace{
            display:grid;
            grid-template-columns:minmax(0,1fr) 286px minmax(0,1fr);
            gap:14px;
            align-items:start;
            margin-top:2px;
          }

          .ui2-trade-workspace>#sidesWrap{
            display:contents!important;
          }

          .ui2-trade-workspace>#sidesWrap>.side-a{
            grid-column:1;
            grid-row:1;
          }

          .ui2-trade-workspace>#sidesWrap>.side-b{
            grid-column:3;
            grid-row:1;
          }

          .ui2-trade-workspace>.meter-wrap{
            grid-column:2;
            grid-row:1;
            position:sticky;
            top:126px;
            margin:0!important;
          }

          .side{
            overflow:hidden!important;
            border:1px solid var(--line)!important;
            border-radius:14px!important;
            background:
              linear-gradient(180deg,rgba(255,255,255,.025),transparent 110px),
              var(--panel)!important;
            box-shadow:var(--ui2-shadow)!important;
          }

          .side::before,
          .side::after{
            display:none!important;
          }

          .side-head{
            min-height:64px!important;
            padding:13px 14px 11px!important;
            border-bottom:1px solid var(--line)!important;
            background:rgba(9,27,44,.14)!important;
            align-items:center!important;
          }

          .side-name{
            font-family:'Inter',sans-serif!important;
            font-size:13.5px!important;
            font-weight:800!important;
            letter-spacing:.015em!important;
          }

          .side-total{
            font-size:21px!important;
            line-height:1!important;
          }

          .side-total-label{
            margin-top:3px!important;
            font-size:7.5px!important;
            letter-spacing:.11em!important;
          }

          .asset-list{
            gap:7px!important;
            padding:10px!important;
          }

          .asset-row{
            position:relative!important;
            display:grid!important;
            grid-template-columns:36px minmax(0,1fr) auto!important;
            align-items:center!important;
            gap:9px!important;
            min-height:57px!important;
            padding:9px 9px!important;
            border:1px solid var(--line)!important;
            border-radius:10px!important;
            background:
              linear-gradient(180deg,rgba(255,255,255,.018),transparent),
              var(--panel-alt)!important;
            transition:
              transform .15s ease,
              border-color .15s ease,
              background .15s ease,
              box-shadow .15s ease!important;
          }

          .asset-row:hover{
            transform:translateY(-1px);
            border-color:rgba(201,206,210,.28)!important;
            background:var(--ui2-card-hover)!important;
            box-shadow:var(--ui2-soft-shadow)!important;
          }

          .ui2-pos-pill{
            width:36px;
            height:36px;
            display:grid;
            place-items:center;
            border:1px solid rgba(255,255,255,.10);
            border-radius:9px;
            background:rgba(9,27,44,.28);
            color:var(--text-muted);
            font-family:'IBM Plex Mono',monospace;
            font-size:9px;
            font-weight:700;
            letter-spacing:.02em;
          }

          .ui2-pos-pill.qb{color:#69B5FF}
          .ui2-pos-pill.rb{color:#77E0A0}
          .ui2-pos-pill.wr{color:#C79AFF}
          .ui2-pos-pill.te{color:#F0C56A}
          .ui2-pos-pill.dl{color:#FFAA7E}
          .ui2-pos-pill.lb{color:#70E8E2}
          .ui2-pos-pill.db{color:#F78FA8}
          .ui2-pos-pill.k{color:#C9CED2}
          .ui2-pos-pill.pick{color:var(--amber)}
          .ui2-pos-pill.cash{color:var(--green)}

          .asset-title{
            font-size:12.5px!important;
            font-weight:800!important;
            line-height:1.25!important;
          }

          .asset-meta{
            margin-top:3px!important;
            color:var(--text-muted)!important;
            font-size:9px!important;
            line-height:1.3!important;
          }

          .asset-right{
            gap:6px!important;
          }

          .asset-value{
            font-size:14px!important;
            font-weight:700!important;
            font-variant-numeric:tabular-nums;
          }

          .asset-range,
          .asset-market{
            padding:2px 4px!important;
            border-radius:4px!important;
            background:rgba(255,255,255,.04)!important;
            font-size:8px!important;
          }

          .remove-btn{
            transition:.15s ease!important;
          }

          .remove-btn:hover{
            border-color:rgba(255,138,76,.34)!important;
            background:rgba(255,138,76,.11)!important;
            color:var(--red)!important;
          }

          .add-controls{
            padding:10px 10px 12px!important;
            border-top:1px solid var(--line)!important;
            background:rgba(4,14,24,.11)!important;
          }

          .tab-btn{
            min-height:31px!important;
            border-radius:7px!important;
            font-family:'Inter',sans-serif!important;
            font-size:9.5px!important;
            font-weight:700!important;
          }

          .add-btn{
            min-height:35px!important;
            border-radius:8px!important;
            font-family:'Inter',sans-serif!important;
            font-size:11px!important;
            font-weight:800!important;
            transition:.15s ease!important;
          }

          .add-btn:hover{
            transform:translateY(-1px);
            filter:brightness(1.06);
          }

          .chip{
            transition:.15s ease!important;
          }

          .chip:hover{
            border-style:solid!important;
            border-color:var(--text-muted)!important;
            background:rgba(255,255,255,.035)!important;
            color:var(--text)!important;
          }

          .suggest-item:hover{
            background:rgba(9,27,44,.42)!important;
          }

          .meter-wrap{
            padding:16px 15px!important;
            border:1px solid var(--line)!important;
            border-radius:14px!important;
            background:
              linear-gradient(180deg,rgba(255,255,255,.025),transparent),
              var(--panel)!important;
            box-shadow:var(--ui2-shadow)!important;
            text-align:center!important;
          }

          .meter-wrap::before{
            content:'TRADE ANALYSIS';
            display:block;
            margin-bottom:6px;
            color:var(--text-dim);
            font-family:'IBM Plex Mono',monospace;
            font-size:8px;
            font-weight:600;
            letter-spacing:.13em;
          }

          .meter-verdict{
            margin-bottom:6px!important;
            font-size:27px!important;
            line-height:1!important;
          }

          .meter-sub{
            margin-bottom:13px!important;
            font-size:9.5px!important;
            line-height:1.4!important;
          }

          .meter{
            height:21px!important;
            border-radius:999px!important;
            background:var(--ui2-deep)!important;
          }

          .meter-labels{
            margin-top:8px!important;
            font-size:9px!important;
          }

          .paired-action-btn{
            min-height:32px!important;
            padding:7px 11px!important;
            border-radius:8px!important;
            font-family:'Inter',sans-serif!important;
            font-size:9.5px!important;
            font-weight:700!important;
          }

          .needs-grid{
            gap:7px!important;
          }

          .need-cell{
            padding:9px 6px!important;
            border-radius:9px!important;
            background:var(--panel-alt)!important;
          }

          .roster-row{
            border-radius:9px!important;
            transition:.15s ease!important;
          }

          .roster-row:hover{
            transform:translateY(-1px);
            border-color:rgba(201,206,210,.28)!important;
            background:#224568!important;
          }

          .trade-impact,
          details{
            border-radius:12px!important;
          }

          .ui2-mobile-summary{
            display:none;
            position:fixed;
            left:10px;
            right:10px;
            bottom:10px;
            z-index:1200;
            grid-template-columns:1fr auto 1fr;
            align-items:center;
            gap:8px;
            padding:9px 11px;
            border:1px solid rgba(255,255,255,.15);
            border-radius:12px;
            background:rgba(9,27,44,.95);
            box-shadow:0 14px 36px rgba(0,0,0,.36);
            -webkit-backdrop-filter:blur(12px);
            backdrop-filter:blur(12px);
          }

          .ui2-mobile-summary>div:first-child{
            text-align:left;
            color:var(--gold);
          }

          .ui2-mobile-summary>div:last-child{
            text-align:right;
            color:var(--violet);
          }

          .ui2-mobile-summary strong{
            display:block;
            font-family:'IBM Plex Mono',monospace;
            font-size:11px;
          }

          .ui2-mobile-summary small{
            display:block;
            margin-top:2px;
            color:var(--text-dim);
            font-size:7px;
            letter-spacing:.06em;
            text-transform:uppercase;
          }

          .ui2-mobile-verdict{
            max-width:110px;
            overflow:hidden;
            color:var(--green)!important;
            text-align:center!important;
            text-overflow:ellipsis;
            white-space:nowrap;
            font-family:'Anton',sans-serif;
            font-size:13px;
            text-transform:uppercase;
          }

          @media(max-width:980px){
            .ui2-trade-workspace{
              grid-template-columns:minmax(0,1fr) minmax(0,1fr);
            }

            .ui2-trade-workspace>#sidesWrap>.side-a{
              grid-column:1;
              grid-row:1;
            }

            .ui2-trade-workspace>#sidesWrap>.side-b{
              grid-column:2;
              grid-row:1;
            }

            .ui2-trade-workspace>.meter-wrap{
              grid-column:1/-1;
              grid-row:2;
              position:relative;
              top:auto;
            }
          }

          @media(max-width:720px){
            .wrap{
              padding-left:11px!important;
              padding-right:11px!important;
              padding-bottom:90px!important;
            }

            .ui2-preview-notice{
              width:calc(100% - 22px);
              margin-top:7px;
              padding:7px 8px;
              font-size:7.5px;
            }

            .ui2-workspace-kicker{
              align-items:start;
              flex-direction:column;
              gap:4px;
            }

            .ui2-workspace-help{
              max-width:none;
              text-align:left;
            }

            .ui2-trade-workspace{
              display:flex;
              flex-direction:column;
              gap:11px;
            }

            .ui2-trade-workspace>#sidesWrap{
              order:2;
              display:grid!important;
              grid-template-columns:1fr!important;
              gap:11px!important;
              width:100%;
            }

            .ui2-trade-workspace>#sidesWrap>.side-a,
            .ui2-trade-workspace>#sidesWrap>.side-b{
              grid-column:1!important;
              grid-row:auto!important;
              width:100%;
            }

            .ui2-trade-workspace>.meter-wrap{
              order:1;
              width:100%;
            }

            .side-head{
              min-height:58px!important;
            }

            .asset-row{
              grid-template-columns:34px minmax(0,1fr) auto!important;
              min-height:54px!important;
            }

            .ui2-pos-pill{
              width:34px;
              height:34px;
            }

            .ui2-mobile-summary{
              display:grid;
            }
          }
          </style>
          '''

          js = r'''
          <script id="trade-desk-ui2-preview-runtime">
          /* TRADE_DESK_UI2_FULL_COPY_PREVIEW_V1 — presentation only. */
          (function () {
            'use strict';

            const POS = ['QB','RB','WR','TE','DL','LB','DB','K'];
            const POS_CLASS = {
              QB:'qb', RB:'rb', WR:'wr', TE:'te',
              DL:'dl', LB:'lb', DB:'db', K:'k'
            };

            function init() {
              if (document.documentElement.dataset.tradeDeskUi2Preview === '1') return;
              document.documentElement.dataset.tradeDeskUi2Preview = '1';

              const wrap = document.querySelector('.wrap');
              const sides = document.getElementById('sidesWrap');
              const meter = document.querySelector('.meter-wrap');

              if (!wrap || !sides || !meter) {
                console.error('UI2 preview: required Trade Desk nodes were not found.');
                return;
              }

              const notice = document.createElement('div');
              notice.className = 'ui2-preview-notice';
              notice.textContent =
                'UI #2 PREVIEW · PRODUCTION INDEX.HTML IS UNCHANGED · TRADE LOGIC IS LIVE';

              const appShell = document.querySelector('.log-app-shell');
              if (appShell && appShell.parentNode) {
                appShell.insertAdjacentElement('afterend', notice);
              } else {
                document.body.insertBefore(notice, document.body.firstChild);
              }

              const kicker = document.createElement('div');
              kicker.className = 'ui2-workspace-kicker';
              kicker.innerHTML =
                '<div class="ui2-workspace-kicker-main">' +
                  '<div class="ui2-workspace-eyebrow">Trade Workspace</div>' +
                  '<div class="ui2-workspace-title">Build and compare both sides</div>' +
                '</div>' +
                '<div class="ui2-workspace-help">' +
                  'Add players, picks or salary to either side. ' +
                  'The center card updates with the live model.' +
                '</div>';

              sides.parentNode.insertBefore(kicker, sides);

              const workspace = document.createElement('div');
              workspace.className = 'ui2-trade-workspace';
              sides.parentNode.insertBefore(workspace, sides);
              workspace.appendChild(sides);
              workspace.appendChild(meter);

              const mobile = document.createElement('div');
              mobile.className = 'ui2-mobile-summary';
              mobile.innerHTML =
                '<div><strong id="ui2MobileA">0</strong><small>Side A</small></div>' +
                '<div class="ui2-mobile-verdict" id="ui2MobileVerdict">Build Trade</div>' +
                '<div><strong id="ui2MobileB">0</strong><small>Side B</small></div>';
              document.body.appendChild(mobile);

              function decorateAssets() {
                sides.querySelectorAll('.asset-row').forEach(row => {
                  if (row.querySelector('.ui2-pos-pill')) return;

                  const meta = (row.querySelector('.asset-meta')?.textContent || '').toUpperCase();
                  const title = (row.querySelector('.asset-title')?.textContent || '').toUpperCase();

                  const pos = POS.find(p => new RegExp('\\b' + p + '\\b').test(meta));
                  let label = pos || '';
                  let cls = pos ? POS_CLASS[pos] : '';

                  if (!label && (
                    title.includes('PICK') ||
                    title.includes('ROUND') ||
                    /\b20\d{2}\b/.test(title)
                  )) {
                    label = 'PICK';
                    cls = 'pick';
                  }

                  if (!label && (
                    title.includes('SALARY') ||
                    title.includes('CASH') ||
                    meta.includes('SALARY')
                  )) {
                    label = '$';
                    cls = 'cash';
                  }

                  if (!label) label = 'ASSET';

                  const pill = document.createElement('span');
                  pill.className = 'ui2-pos-pill ' + cls;
                  pill.textContent = label;
                  row.insertBefore(pill, row.firstChild);
                });
              }

              function setText(node, value) {
                if (node && node.textContent !== value) node.textContent = value;
              }

              function syncMobile() {
                const labelA = document.getElementById('labelA')?.textContent || 'SIDE A — 0';
                const labelB = document.getElementById('labelB')?.textContent || 'SIDE B — 0';
                const verdict = document.getElementById('verdictText')?.textContent || 'Build Trade';

                setText(
                  document.getElementById('ui2MobileA'),
                  labelA.replace(/^SIDE A\s*[—-]?\s*/i,'') || '0'
                );
                setText(
                  document.getElementById('ui2MobileB'),
                  labelB.replace(/^SIDE B\s*[—-]?\s*/i,'') || '0'
                );
                setText(document.getElementById('ui2MobileVerdict'), verdict);
              }

              let scheduled = false;
              let assetsDirty = false;

              function scheduleRefresh(includeAssets) {
                if (includeAssets) assetsDirty = true;
                if (scheduled) return;

                scheduled = true;
                requestAnimationFrame(() => {
                  scheduled = false;
                  if (assetsDirty) {
                    assetsDirty = false;
                    decorateAssets();
                  }
                  syncMobile();
                });
              }

              decorateAssets();
              syncMobile();

              // Narrow observer only: no document-wide observation and no
              // observation of the preview's own mobile summary.
              const assetObserver = new MutationObserver(() => scheduleRefresh(true));
              assetObserver.observe(sides, { subtree:true, childList:true });

              ['labelA','labelB','verdictText'].forEach(id => {
                const node = document.getElementById(id);
                if (!node) return;

                const observer = new MutationObserver(() => scheduleRefresh(false));
                observer.observe(node, {
                  subtree:true,
                  childList:true,
                  characterData:true
                });
              });
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init, { once:true });
            } else {
              init();
            }
          })();
          </script>
          '''

          if "</head>" not in preview or "</body>" not in preview:
              raise RuntimeError("Production HTML is missing closing head/body tags")

          # Keep git diff --check clean without touching the copied production
          # source. Only normalize trailing whitespace inside the two UI2
          # snippets we are adding.
          css = "\n".join(line.rstrip() for line in css.splitlines())
          js = "\n".join(line.rstrip() for line in js.splitlines())

          preview = preview.replace("</head>", css + "\n</head>", 1)
          preview = preview.replace("</body>", js + "\n</body>", 1)

          # Safety proof: every production script block remains byte-for-byte
          # present in the full-copy preview. We add one new presentation script
          # but do not rewrite any existing model/runtime script.
          prod_scripts = re.findall(
              r"<script(?:\s[^>]*)?>.*?</script>",
              prod,
              flags=re.S | re.I,
          )
          if not prod_scripts:
              raise RuntimeError("No production script blocks found")

          missing_scripts = [i for i, block in enumerate(prod_scripts) if block not in preview]
          if missing_scripts:
              raise RuntimeError(
                  f"Production script blocks changed in preview: {missing_scripts}"
              )

          if marker not in preview:
              raise RuntimeError("UI2 marker missing after build")

          preview_path.write_text(preview, encoding="utf-8")

          print("PASS full-copy preview built from exact production source")
          print(f"PASS {len(prod_scripts)} production script blocks preserved byte-for-byte")
          print(f"Production SHA256: {hashlib.sha256(prod.encode()).hexdigest()}")
          print(f"Preview SHA256:    {hashlib.sha256(preview.encode()).hexdigest()}")
          print(f"Wrote {preview_path}: {len(preview):,} characters")
          PY

      - name: Validate UI2 preview JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("trade-desk-preview.html").read_text(encoding="utf-8")
          match = re.search(
              r'<script id="trade-desk-ui2-preview-runtime">(.*?)</script>',
              html,
              flags=re.S,
          )
          if not match:
              raise SystemExit("UI2 preview runtime script not found")

          out = Path("/tmp/trade-desk-ui2-preview-runtime.js")
          out.write_text(match.group(1), encoding="utf-8")
          print(out)
          PY
          node --check /tmp/trade-desk-ui2-preview-runtime.js

      - name: Validate existing runtime self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/team_utility_projection_runtime.js
          node scripts/team_utility_projection_runtime.js --selftest

      - name: Verify production remains untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0f587dcb9740d0986acc705b305cdaa6217c0ae9"
          git diff --exit-code -- index.html
          git diff --check

      - name: Commit UI2 preview only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trade-desk-preview.html

          CHANGED="$(git diff --cached --name-only)"
          echo "Staged:"
          printf '%s\n' "$CHANGED"

          test "$CHANGED" = "trade-desk-preview.html"

          if git diff --cached --quiet; then
            echo "No UI2 preview changes to commit."
            exit 0
          fi

          git commit -m "Build Trade Desk UI2 full-copy preview"
          git push origin HEAD:main
