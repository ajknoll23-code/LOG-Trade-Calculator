name: B41D Player Role Engine V2 - Owner-Blind Historical Development Model Fitting
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out current main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Freeze B41D governance amendment and exact implementation before modeling
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\nmkdir -p \"$BASE\"\n\npython3 - <<'PY'\nfrom datetime import datetime, timezone\nimport base64\nimport json\nfrom pathlib import Path\n\nbase = Path(\"research/player-role-v2\")\nd = json.loads((base / \"player_role_v2_b41c2_scientific_decision.json\").read_text())\nc = json.loads((base / \"player_role_v2_b41c2_scorer_calibration.json\").read_text())\np = json.loads((base / \"player_role_v2_b41c_model_development_preregistration.json\").read_text())\n\nassert d[\"result\"] == \"CALIBRATION_PASS_AWAITING_UNTOUCHED_WEEK4_VALIDATION\"\nassert c[\"compared_player_weeks\"] == 1584\nassert c[\"within_tolerance_fraction\"] == 1.0\nassert c[\"mean_absolute_error\"] == 0.0\nassert c[\"max_absolute_error\"] == 0.0\nassert c[\"mismatch_count\"] == 0\nassert c[\"week4_read\"] is False\nassert c[\"2025_holdout_opened\"] is False\n\namendment = {\n    \"schema_version\": 1,\n    \"study_id\": \"player-role-v2\",\n    \"phase\": \"B41D-development-gate-amendment\"\
        ,\n    \"status\": \"POST_B41C2_GOVERNANCE_AMENDMENT_BEFORE_ANY_B41D_TARGET_ASSOCIATION\",\n    \"created_at_utc\": datetime.now(timezone.utc).isoformat(),\n    \"information_available_at_amendment\": {\n        \"b41c2_calibration_player_weeks\": 1584,\n        \"b41c2_within_tolerance_fraction\": 1.0,\n        \"b41c2_mean_absolute_error\": 0.0,\n        \"b41c2_max_absolute_error\": 0.0,\n        \"b41c2_mismatch_count\": 0,\n        \"week4_2026_opened\": False,\n        \"holdout_2025_opened\": False,\n        \"b41d_predictor_target_association_seen\": False,\n        \"b41d_model_fit_seen\": False\n    },\n    \"governance_change\": {\n        \"old_rule\": \"B41C3 Week 4 scorer confirmation required before B41D development fitting.\",\n        \"new_rule\": (\n            \"B41D development fitting on 2019-2024 may proceed now. \"\n            \"B41C3 is a mandatory pre-production scorer confirmation gate.\"\n        ),\n        \"reason\": (\n            \"The corrected\
        \ scorer is a deterministic exact-key translation of the \"\n            \"frozen Sleeper league scoring contract and reproduced all 1,584 seen \"\n            \"calibration player-weeks with exactly zero error. Week 4 confirmation \"\n            \"remains mandatory before any deployment.\"\n        ),\n        \"post_hoc_nature_disclosed\": True\n    },\n    \"unchanged_science\": {\n        \"development_seasons\": [2019, 2020, 2021, 2022, 2023, 2024],\n        \"untouched_model_holdout_season\": 2025,\n        \"historical_projection_features_used\": False,\n        \"target_definition_changed\": False,\n        \"feature_families_changed\": False,\n        \"model_candidate_families_changed\": False,\n        \"outer_cv_changed\": False,\n        \"primary_metric_changed\": False,\n        \"one_standard_error_rule_changed\": False,\n        \"tier_derivation_rule_changed\": False,\n        \"frozen_b41c2_scorer_changed\": False\n    },\n    \"development_authorization\": {\n\
        \        \"B41D_2019_2024_model_fitting_authorized\": True,\n        \"B41D_may_open_2025\": False,\n        \"B41D_may_open_2026_week4\": False,\n        \"production_role_change_authorized\": False,\n        \"fundamental_value_change_authorized\": False,\n        \"league_asset_ranking_change_authorized\": False\n    },\n    \"production_gates_still_required\": [\n        \"B41C3 untouched Week 4 scorer confirmation\",\n        \"frozen Role V2 model and tier thresholds\",\n        \"untouched 2025 Role V2 model holdout validation\",\n        \"B42 12-team owner-blind role parity audit\"\n    ]\n}\n(base / \"player_role_v2_b41d_development_gate_amendment.json\").write_text(\n    json.dumps(amendment, indent=2, sort_keys=True) + \"\\n\"\n)\n\nfeature_map = {'QB': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3', 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean',\
        \ 'league_points__last3_minus_prior3', 'attempts__last3_active_mean', 'attempts__season_to_date_active_mean', 'attempts__last3_minus_prior3', 'carries__last3_active_mean', 'carries__season_to_date_active_mean', 'carries__last3_minus_prior3'], 'RB': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3', 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean', 'league_points__last3_minus_prior3', 'carries__last3_active_mean', 'carries__season_to_date_active_mean', 'carries__last3_minus_prior3', 'targets__last3_active_mean', 'targets__season_to_date_active_mean', 'targets__last3_minus_prior3', 'target_share__last3_active_mean', 'target_share__season_to_date_active_mean', 'target_share__last3_minus_prior3'], 'WR': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3',\
        \ 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean', 'league_points__last3_minus_prior3', 'targets__last3_active_mean', 'targets__season_to_date_active_mean', 'targets__last3_minus_prior3', 'target_share__last3_active_mean', 'target_share__season_to_date_active_mean', 'target_share__last3_minus_prior3', 'air_yards_share__last3_active_mean', 'air_yards_share__season_to_date_active_mean', 'air_yards_share__last3_minus_prior3', 'receiving_air_yards__last3_active_mean', 'receiving_air_yards__season_to_date_active_mean', 'receiving_air_yards__last3_minus_prior3'], 'TE': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3', 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean', 'league_points__last3_minus_prior3', 'targets__last3_active_mean', 'targets__season_to_date_active_mean', 'targets__last3_minus_prior3',\
        \ 'target_share__last3_active_mean', 'target_share__season_to_date_active_mean', 'target_share__last3_minus_prior3', 'air_yards_share__last3_active_mean', 'air_yards_share__season_to_date_active_mean', 'air_yards_share__last3_minus_prior3', 'receiving_air_yards__last3_active_mean', 'receiving_air_yards__season_to_date_active_mean', 'receiving_air_yards__last3_minus_prior3'], 'K': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3', 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean', 'league_points__last3_minus_prior3', 'fg_att__last3_active_mean', 'fg_att__season_to_date_active_mean', 'fg_att__last3_minus_prior3', 'pat_att__last3_active_mean', 'pat_att__season_to_date_active_mean', 'pat_att__last3_minus_prior3'], 'DL': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3',\
        \ 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean', 'league_points__last3_minus_prior3', 'def_tackles_solo__last3_active_mean', 'def_tackles_solo__season_to_date_active_mean', 'def_tackles_solo__last3_minus_prior3', 'def_tackle_assists__last3_active_mean', 'def_tackle_assists__season_to_date_active_mean', 'def_tackle_assists__last3_minus_prior3', 'def_tackles_for_loss__last3_active_mean', 'def_tackles_for_loss__season_to_date_active_mean', 'def_tackles_for_loss__last3_minus_prior3', 'def_sacks__last3_active_mean', 'def_sacks__season_to_date_active_mean', 'def_sacks__last3_minus_prior3', 'def_qb_hits__last3_active_mean', 'def_qb_hits__season_to_date_active_mean', 'def_qb_hits__last3_minus_prior3'], 'LB': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3', 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean',\
        \ 'league_points__last3_minus_prior3', 'def_tackles_solo__last3_active_mean', 'def_tackles_solo__season_to_date_active_mean', 'def_tackles_solo__last3_minus_prior3', 'def_tackle_assists__last3_active_mean', 'def_tackle_assists__season_to_date_active_mean', 'def_tackle_assists__last3_minus_prior3', 'def_tackles_for_loss__last3_active_mean', 'def_tackles_for_loss__season_to_date_active_mean', 'def_tackles_for_loss__last3_minus_prior3', 'def_sacks__last3_active_mean', 'def_sacks__season_to_date_active_mean', 'def_sacks__last3_minus_prior3', 'def_qb_hits__last3_active_mean', 'def_qb_hits__season_to_date_active_mean', 'def_qb_hits__last3_minus_prior3'], 'DB': ['snap_share__latest_active', 'snap_share__last3_active_mean', 'snap_share__season_to_date_active_mean', 'snap_share__last3_minus_prior3', 'league_points__latest_active', 'league_points__last3_active_mean', 'league_points__season_to_date_active_mean', 'league_points__last3_minus_prior3', 'def_tackles_solo__last3_active_mean', 'def_tackles_solo__season_to_date_active_mean',\
        \ 'def_tackles_solo__last3_minus_prior3', 'def_tackle_assists__last3_active_mean', 'def_tackle_assists__season_to_date_active_mean', 'def_tackle_assists__last3_minus_prior3', 'def_interceptions__last3_active_mean', 'def_interceptions__season_to_date_active_mean', 'def_interceptions__last3_minus_prior3', 'def_pass_defended__last3_active_mean', 'def_pass_defended__season_to_date_active_mean', 'def_pass_defended__last3_minus_prior3']}\ncontract = {\n    \"schema_version\": 1,\n    \"study_id\": \"player-role-v2\",\n    \"phase\": \"B41D-exact-development-implementation-contract\",\n    \"status\": \"FROZEN_BEFORE_ANY_B41D_PREDICTOR_TARGET_ASSOCIATION\",\n    \"development_seasons\": [2019, 2020, 2021, 2022, 2023, 2024],\n    \"holdout_2025_opened\": False,\n    \"week4_2026_opened\": False,\n    \"historical_projection_features_used\": False,\n    \"stable_identity_bridge\": {\n        \"source\": \"DynastyProcess db_playerids.csv\",\n        \"keys\": [\"gsis_id\", \"sleeper_id\"],\n\
        \        \"fuzzy_name_join_allowed\": False,\n        \"required_overall_row_coverage\": 0.98,\n        \"required_each_season_position_row_coverage\": 0.95,\n        \"gate_purpose\": \"data-integrity attrition control, not model-performance selection\"\n    },\n    \"target\": p[\"frozen_target\"],\n    \"feature_normalization\": p[\"development_feature_policy\"][\"continuous_feature_normalization\"],\n    \"position_feature_columns\": feature_map,\n    \"missing_feature_handling\": (\n        \"Within each training fold only, remove all-missing/constant columns; \"\n        \"median-impute remaining missing predictors from the training fold and \"\n        \"apply those same medians to validation rows.\"\n    ),\n    \"candidate_families\": p[\"model_family_preregistration\"],\n    \"selection\": p[\"model_selection\"],\n    \"implementation_tie_breaks\": {\n        \"baseline\": \"lowest nested-CV MAE then lexicographic feature name\",\n        \"ridge\": \"lowest nested-CV MAE\
        \ then larger alpha\",\n        \"monotonic_hgb\": (\n            \"lowest nested-CV MAE then fewer leaf nodes, larger min_samples_leaf, \"\n            \"larger L2, lower learning rate\"\n        ),\n        \"family\": (\n            \"one-standard-error rule using best family's six outer-season MAEs; \"\n            \"choose first eligible family in frozen simplicity order\"\n        )\n    },\n    \"tier_thresholds_derived_in_B41D\": False,\n    \"production_change_authorized\": False\n}\n(base / \"player_role_v2_b41d_development_contract.json\").write_text(\n    json.dumps(contract, indent=2, sort_keys=True) + \"\\n\"\n)\n\n(base / \"player_role_v2_b41d_prepare_modeling_data.py\").write_bytes(\n    base64.b64decode(\"\"\
        )\n)\n(base / \"player_role_v2_b41d_model_fitter.py\").write_bytes(\n    base64.b64decode(\"\"\
        )\n)\n\nprint(\"PASS: B41D amendment, contract, preparation code, and fitter frozen.\")\nPY\n\npython3 -m py_compile   \"$BASE/player_role_v2_b41d_prepare_modeling_data.py\"   \"$BASE/player_role_v2_b41d_model_fitter.py\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add   \"$BASE/player_role_v2_b41d_development_gate_amendment.json\"   \"$BASE/player_role_v2_b41d_development_contract.json\"   \"$BASE/player_role_v2_b41d_prepare_modeling_data.py\"   \"$BASE/player_role_v2_b41d_model_fitter.py\"\ngit diff --cached --check\n\nif git diff --cached --quiet; then\n  echo \"B41D development contract already frozen.\"\nelse\n  git commit -m \"Freeze Player Role V2 B41D development contract\"\n  git push origin HEAD:main\nfi\n"
  prepare:
    needs: freeze_contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out latest main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install preparation dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir "requests>=2.32,<3" "numpy>=2,<3" "pandas>=2.2,<3"

        '
    - name: Reconstruct frozen cohort and build exact historical modeling data
      shell: bash
      run: 'set -euo pipefail

        mkdir -p /tmp/b41d-prep


        python3 research/player-role-v2/player_role_v2_b41d_prepare_modeling_data.py   --repo .   --out-dir /tmp/b41d-prep


        python3 - <<''PY''

        import json

        from pathlib import Path

        out = Path("/tmp/b41d-prep")

        identity = json.loads((out / "player_role_v2_b41d_identity_audit.json").read_text())

        audit = json.loads((out / "player_role_v2_b41d_modeling_data_audit.json").read_text())

        assert identity["pass"] is True

        assert identity["fuzzy_name_join_used"] is False

        assert audit["cohort_reproduced_exactly"] is True

        assert audit["development_seasons"] == [2019, 2020, 2021, 2022, 2023, 2024]

        assert audit["holdout_2025_opened"] is False

        assert audit["week4_2026_opened"] is False

        assert audit["historical_projection_features_used"] is False

        assert audit["predictor_target_association_computed"] is False

        assert audit["model_fit_performed"] is False

        assert audit["production_change_authorized"] is False

        print("PASS: B41D preparation firewall.")

        print("Stable-ID coverage:", identity["overall_mapping_coverage"])

        print("Modeling rows:", audit["modeling_rows"])

        PY

        '
    - name: Commit identity and modeling-data audit before model fitting
      shell: bash
      run: "set -euo pipefail\nBASE=\"research/player-role-v2\"\ngit fetch origin main\ngit rebase origin/main\n\ncp /tmp/b41d-prep/player_role_v2_b41d_identity_audit.json   \"$BASE/player_role_v2_b41d_identity_audit.json\"\ncp /tmp/b41d-prep/player_role_v2_b41d_modeling_data_audit.json   \"$BASE/player_role_v2_b41d_modeling_data_audit.json\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add   \"$BASE/player_role_v2_b41d_identity_audit.json\"   \"$BASE/player_role_v2_b41d_modeling_data_audit.json\"\ngit diff --cached --check\n\nif git diff --cached --quiet; then\n  echo \"B41D prep audit already committed.\"\nelse\n  git commit -m \"Record Player Role V2 B41D modeling data audit\"\n  git push origin HEAD:main\nfi\n"
    - name: Upload frozen B41D modeling dataset
      uses: actions/upload-artifact@v4
      with:
        name: b41d-modeling-data
        path: /tmp/b41d-prep/player_role_v2_b41d_modeling_data.csv.gz
        if-no-files-found: error
        retention-days: 7
  fit:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        position:
        - QB
        - RB
        - WR
        - TE
        - K
        - DL
        - LB
        - DB
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Check out latest frozen implementation
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install model dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir "numpy>=2,<3" "pandas>=2.2,<3" "scipy>=1.14,<2" "scikit-learn>=1.6,<2"

        '
    - name: Download frozen modeling data
      uses: actions/download-artifact@v4
      with:
        name: b41d-modeling-data
        path: /tmp/b41d-data
    - name: Fit ${{ matrix.position }} with frozen nested season CV
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "/tmp/b41d-fit-${{ matrix.position }}"


        python3 research/player-role-v2/player_role_v2_b41d_model_fitter.py   --data /tmp/b41d-data/player_role_v2_b41d_modeling_data.csv.gz   --contract research/player-role-v2/player_role_v2_b41d_development_contract.json   --position "${{ matrix.position }}"   --out-dir "/tmp/b41d-fit-${{ matrix.position }}"

        '
    - name: Upload ${{ matrix.position }} development results
      uses: actions/upload-artifact@v4
      with:
        name: b41d-fit-${{ matrix.position }}
        path: /tmp/b41d-fit-${{ matrix.position }}
        if-no-files-found: error
        retention-days: 7
  finalize:
    needs: fit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out latest main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install finalization dependencies
      shell: bash
      run: 'set -euo pipefail

        python3 -m pip install --disable-pip-version-check --no-cache-dir "numpy>=2,<3" "pandas>=2.2,<3"

        '
    - name: Download all position results
      uses: actions/download-artifact@v4
      with:
        pattern: b41d-fit-*
        path: /tmp/b41d-results
        merge-multiple: true
    - name: Consolidate scientific development result
      shell: bash
      run: "set -euo pipefail\nmkdir -p /tmp/b41d-final\n\npython3 - <<'PY'\nimport hashlib\nimport json\nfrom pathlib import Path\nimport pandas as pd\n\nsrc = Path(\"/tmp/b41d-results\")\nout = Path(\"/tmp/b41d-final\")\npositions = [\"QB\", \"RB\", \"WR\", \"TE\", \"K\", \"DL\", \"LB\", \"DB\"]\n\nresults = {}\noofs = []\nfor pos in positions:\n    rp = src / f\"player_role_v2_b41d_{pos}_result.json\"\n    op = src / f\"player_role_v2_b41d_{pos}_oof.csv.gz\"\n    if not rp.exists() or not op.exists():\n        raise RuntimeError(f\"B41D_MISSING_POSITION_RESULT {pos}\")\n    result = json.loads(rp.read_text())\n    assert result[\"position\"] == pos\n    assert result[\"2025_holdout_opened\"] is False\n    assert result[\"week4_2026_opened\"] is False\n    assert result[\"production_change_authorized\"] is False\n    results[pos] = result\n    oofs.append(pd.read_csv(op, compression=\"gzip\"))\n\ncombined = pd.concat(oofs, ignore_index=True)\nif combined[\"row_id\"].duplicated().any():\n\
        \    raise RuntimeError(\"B41D_DUPLICATE_OOF_ROW_ID\")\nif combined[\"selected_oof_prediction\"].isna().any():\n    raise RuntimeError(\"B41D_SELECTED_OOF_PREDICTION_NAN\")\n\ncombined_path = out / \"player_role_v2_b41d_oof_predictions.csv.gz\"\ncombined.to_csv(combined_path, index=False, compression=\"gzip\")\n\ndef sha(path):\n    return hashlib.sha256(path.read_bytes()).hexdigest()\n\ndecision = {\n    \"schema_version\": 1,\n    \"study_id\": \"player-role-v2\",\n    \"phase\": \"B41D-development-model-selection\",\n    \"status\": \"DEVELOPMENT_MODEL_FAMILIES_SELECTED_BEFORE_TIER_DERIVATION\",\n    \"development_seasons\": [2019, 2020, 2021, 2022, 2023, 2024],\n    \"position_results\": results,\n    \"selected_family_by_position\": {\n        p: results[p][\"selected_family_by_one_se_rule\"] for p in positions\n    },\n    \"oof_row_count\": int(len(combined)),\n    \"oof_predictions_sha256\": sha(combined_path),\n    \"week4_2026_opened\": False,\n    \"B41C3_required_before_production\"\
        : True,\n    \"2025_holdout_opened\": False,\n    \"2025_holdout_required_before_production\": True,\n    \"role_tier_thresholds_derived\": False,\n    \"production_model_fitted\": False,\n    \"production_change_authorized\": False,\n    \"next_stage\": (\n        \"B41E derive seven ordered role tiers from development OOF predictions \"\n        \"only, freeze model/tier architecture, then validate the complete frozen \"\n        \"Role V2 system on untouched 2025.\"\n    )\n}\n(out / \"player_role_v2_b41d_scientific_decision.json\").write_text(\n    json.dumps(decision, indent=2, sort_keys=True) + \"\\n\"\n)\n\nreport = [\n    \"# Player Role V2 \u2014 B41D Development Model Selection\",\n    \"\",\n    \"- Development seasons: **2019\u20132024 only**\",\n    \"- 2026 Week 4 opened: **No**\",\n    \"- 2025 holdout opened: **No**\",\n    \"- Historical projection features: **Excluded**\",\n    \"- Owner/team identity used: **No**\",\n    \"- Role tier thresholds derived: **No**\"\
        ,\n    \"- Production change authorized: **No**\",\n    \"\",\n    \"## Position model selection\",\n    \"\",\n    \"| Position | Selected family | OOF MAE | OOF Spearman |\",\n    \"|---|---|---:|---:|\",\n]\nfor pos in positions:\n    r = results[pos]\n    report.append(\n        f\"| {pos} | {r['selected_family_by_one_se_rule']} | \"\n        f\"{r['selected_family_oof_mae']:.4f} | \"\n        f\"{r['selected_family_oof_spearman']:.4f} |\"\n    )\nreport += [\n    \"\",\n    \"B41C3 remains mandatory before production deployment.\",\n    \"The untouched 2025 Role V2 holdout remains mandatory before production deployment.\",\n    \"\",\n]\n(out / \"player_role_v2_b41d_report.md\").write_text(\"\\n\".join(report))\n\nprint(json.dumps({\n    \"selected_family_by_position\": decision[\"selected_family_by_position\"],\n    \"oof_rows\": len(combined),\n    \"2025_holdout_opened\": False,\n    \"week4_2026_opened\": False,\n    \"production_authorized\": False,\n}, indent=2))\nPY\n"
    - name: Commit B41D development results
      shell: bash
      run: 'set -euo pipefail

        BASE="research/player-role-v2"

        git fetch origin main

