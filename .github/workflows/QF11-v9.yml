# QF11 V9: research-only owner decision board. NOT permission to activate voting or publish Market Value.
name: QF11 V9 - Frozen KTC Catalog Source-Screened Decision Matrix (Read Only)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: trade-desk-read-only-audit
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  research:
    name: Independently screen actual 28 ballot catalog for source holds; do not activate voting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout dispatched main read-only
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing regression dependency
      run: python3 -m pip install --disable-pip-version-check --no-cache-dir requests
    - name: Pin production and source identity files before archived review
      shell: bash
      run: 'set -euo pipefail

        [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "STOP requires main"; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        [[ "$(git hash-object index.html)" == "c83e3f68d11853c072017e6bd83bb1ad085f4a3e" ]] || { echo "STOP pinned source
        drift index.html"; exit 1; }

        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == "829445174a77ceb4bb19dfd97a725e371d18efe8"
        ]] || { echo "STOP pinned source drift scripts/artifacts/generated/market_values.json"; exit 1; }

        [[ "$(git hash-object scripts/artifacts/generated/value_uncertainty.json)" == "9d007a7f053e15dcdc0f694563ca17bc47568e5f"
        ]] || { echo "STOP pinned source drift scripts/artifacts/generated/value_uncertainty.json"; exit 1; }

        [[ "$(git hash-object scripts/market/build_market_value.py)" == "a015d54785ce5fcb3b9f26bae0120b82693a6bd8" ]] || {
        echo "STOP pinned source drift scripts/market/build_market_value.py"; exit 1; }

        [[ "$(git hash-object scripts/market/ktc_pipeline.py)" == "b9612c73a91223397a4f49b384d8d86719ee8d79" ]] || { echo
        "STOP pinned source drift scripts/market/ktc_pipeline.py"; exit 1; }

        [[ "$(git hash-object scripts/validation/snapshot_values.py)" == "1efca4c35e910a95974c1bec0b06a106196618b3" ]] ||
        { echo "STOP pinned source drift scripts/validation/snapshot_values.py"; exit 1; }

        [[ "$(git hash-object scripts/validation/repo_regression_checks.py)" == "5191e1160c966ed14401b70c86c6f63808e1265d"
        ]] || { echo "STOP pinned source drift scripts/validation/repo_regression_checks.py"; exit 1; }

        [[ "$(git hash-object scripts/identity_crosswalk.json)" == "3489c01c923474931f4db81e3dd338f437bfdf5f" ]] || { echo
        "STOP pinned source drift scripts/identity_crosswalk.json"; exit 1; }

        [[ "$(git hash-object data/players_cache.json)" == "216242d9f87a81c4d1532cca2468c90a52918c3d" ]] || { echo "STOP pinned
        source drift data/players_cache.json"; exit 1; }

        [[ -z "$(git status --porcelain)" ]] || exit 1

        echo "QF11_V9_FROZEN_SOURCES_GREEN"'
    - name: Download exact frozen V8 candidate
      uses: actions/download-artifact@v4
      with:
        name: QF11-v8-RESEARCH-ONLY-replacement-feasibility
        run-id: 38263152317
        github-token: ${{ github.token }}
        path: /tmp/qf11-v9-sources/v8
    - name: Download exact V7 original source flags
      uses: actions/download-artifact@v4
      with:
        name: QF11-v7-RESEARCH-ONLY-eligibility-review
        run-id: 38258198738
        github-token: ${{ github.token }}
        path: /tmp/qf11-v9-sources/v7
    - name: Download exact V3 source-aligned FV market universe
      uses: actions/download-artifact@v4
      with:
        name: QF11-v3-PROSPECTIVE-DO-NOT-PUBLISH
        run-id: 38204817099
        github-token: ${{ github.token }}
        path: /tmp/qf11-v9-sources/v3
    - name: Independently source-screen 28 archived ballots, emit hold matrix and alternative feasibility
      shell: bash
      run: "set -euo pipefail\ncat >/tmp/qf11-v9-study.py <<'QF11_V9_PY'\nfrom __future__ import annotations\nimport json,\
        \ hashlib, collections, re, sys\nfrom pathlib import Path\nFIXTURE = '--fixture' in sys.argv\nROOT=Path.cwd()\nIN=Path('/mnt/data/qf11_v9_fixture_sources')\
        \ if FIXTURE else Path('/tmp/qf11-v9-sources')\nOUT=Path('/mnt/data/qf11_v9_fixture_output') if FIXTURE else Path('/tmp/qf11-v9-output')\n\
        OUT.mkdir(parents=True,exist_ok=True)\nPINS={\n 'v8':('RESEARCH_ONLY_28_slot_candidate_NOT_APPROVED.json','0b73cde68054c41bc4dc129357f2271f21db4a79857ad88670cf461f70e78a86'),\n\
        \ 'v8summary':('RESEARCH_ONLY_replacement_feasibility_summary.json','a6764f061616695bcf64c0d6d6da7c73735582e9542a97d4f9a752cac153e38a'),\n\
        \ 'v7':('RESEARCH_ONLY_28_slot_eligibility_review.json','b920fe5396fd363ed45a99e8cd2bf7695de54e6b7cb86e41e2ba7996da84f2a5'),\n\
        \ 'v3':('PROSPECTIVE_NOT_FOR_PUBLICATION_market_with_provenance.json','19458c3b0c890b7868a06ab5a134b80f61dd4568fbb8ecaada1c0295d9019edc'),\n\
        }\nsource={}\nfor tag,(name,sha) in PINS.items():\n folder='v8' if tag=='v8summary' else tag\n p=IN/folder/name\n\
        \ assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,f'STOP source hash drift {tag}'\n source[tag]=json.loads(p.read_text())\n\
        v8,summ,v7,v3=[source[t] for t in ('v8','v8summary','v7','v3')]\nassert len(v8['catalog'])==len(v7['ballots'])==28\
        \ and len(v3['players'])==504\nassert v8['voting_activated'] is False and summ['owner_approval'] is False\nassert\
        \ v7['approval_authorized'] is False and v7['catalog_activated'] is False\nassert v3['research_only'] is True and\
        \ v3['deployment_authorized'] is False\nCOHORT='a0ed9f867883d9013cbee69a0136586a22223571f5f57d4f0627d5d77fd6d2b2'\n\
        assert v8['source_after_daily_cap_sha256']==summ['source_after_daily_cap_sha256']==v7['source_after_daily_cap_sha256']==v3['source']['source_after_daily_cap_sha256']==COHORT\n\
        assert summ['candidate_distinct_players']==67 and summ['suggested_replacements']==11\nassert summ['original_flagged_players']==18\
        \ and summ['unresolved_repeated_pair_slots']==1\nif not FIXTURE:\n sys.path.insert(0,str(ROOT))\n from scripts.validation\
        \ import snapshot_values\n cfg=snapshot_values.load_from_html(ROOT/'index.html')\n raw=snapshot_values.compute_all_values(cfg)\n\
        \ model={k:{'pos':v['pos'],'value':int(raw[k]['value'])} for k,v in cfg['player_db'].items()}\n teams=dict(re.findall(r\"\
        '([^']+)':\\{pos:'[A-Z]+',age:\\d+,role:'[^']+',team:'([^']*)'\",(ROOT/'index.html').read_text()))\n crosswalk=json.loads((ROOT/'scripts/identity_crosswalk.json').read_text())\n\
        \ cache=json.loads((ROOT/'data/players_cache.json').read_text())\n if isinstance(cache,dict):cache=cache.get('players')\
        \ or cache.get('data') or cache\n cache_rows=list(cache.values()) if isinstance(cache,dict) else cache\nelse:\n model={k:{'pos':v['pos'],'value':int(v['fundamental_value'])}\
        \ for k,v in v3['players'].items()}\n teams={k:'ZZ' for k in model}\n crosswalk=[{'name':k,'sleeper_id':str(i+1),'fp_position':p['pos'],'sleeper_pos':p['pos'],'fp_team':'ZZ','sleeper_team':'ZZ'}\
        \ for i,(k,p) in enumerate(v3['players'].items())]\n cache_rows=[{'player_id':str(i+1),'team':'ZZ','position':p['pos'],'status':'Active'}\
        \ for i,(k,p) in enumerate(v3['players'].items())]\n\ndef canonical(s):return re.sub('[^a-z0-9]','',str(s or '').lower())\n\
        def normpos(s):return {'DE':'DL','DT':'DL','NT':'DL','EDGE':'DL','OLB':'LB','ILB':'LB','MLB':'LB','CB':'DB','SS':'DB','FS':'DB','S':'DB','SAF':'DB'}.get(str(s\
        \ or '').upper(),str(s or '').upper())\ndef team(s):return {'JAX':'JAC','JAC':'JAC'}.get(str(s or '').upper(),str(s\
        \ or '').upper())\nbyname=collections.defaultdict(list)\nfor row in crosswalk:\n if isinstance(row,dict):byname[canonical(row.get('name'))].append(row)\n\
        byid={str(r.get('player_id') or r.get('id')):r for r in cache_rows if isinstance(r,dict) and (r.get('player_id') or\
        \ r.get('id'))}\ndef verified(k):\n if k not in model or k not in teams or k in ('joe mixon','aaron donald'):return\
        \ False\n xs=byname.get(canonical(k),[])\n ids={str(x.get('sleeper_id')) for x in xs if x.get('sleeper_id') is not\
        \ None}\n if len(ids)!=1 or not xs:return False\n c=byid.get(next(iter(ids)))\n if not c or str(c.get('status') or\
        \ '').lower()!='active':return False\n if normpos(c.get('position'))!=model[k]['pos'] or team(c.get('team'))!=team(teams[k]):return\
        \ False\n return all(normpos(x.get('fp_position'))==model[k]['pos'] and normpos(x.get('sleeper_pos'))==model[k]['pos']\
        \ and team(x.get('fp_team'))==team(teams[k]) and team(x.get('sleeper_team'))==team(teams[k]) for x in xs)\n\nflagged={}\n\
        for b in v7['ballots']:\n for p in b['players']:\n  if p['review_flags']:\n   flagged[p['name']]=list(p['review_flags'])\n\
        assert len(flagged)==18\nproven_replacements={x['replacement_key'] for x in summ['suggested_replacements_per_slot']}\n\
        assert len(proven_replacements)==11\nif not FIXTURE:\n for k in proven_replacements:assert verified(k),f'STOP prior\
        \ replacement lost strict identity evidence {k}'\nfor b in v8['catalog']:\n assert len(b['player_keys'])==len(set(b['player_keys']))==3\n\
        \ assert all(k in model and k in v3['players'] for k in b['player_keys'])\n for k in b['player_keys']:\n  assert model[k]['value']==v3['players'][k]['fundamental_value']\
        \ and model[k]['pos']==v3['players'][k]['pos'],f'STOP FV or position drift {k}'\n assert model[b['player_keys'][0]]['pos']==model[b['player_keys'][1]]['pos']==b['audit_pair_position']\n\
        \ assert model[b['player_keys'][2]]['pos']!=b['audit_pair_position']\n fvs=[model[k]['value'] for k in b['player_keys']]\n\
        \ assert min(fvs)>0 and max(fvs)/min(fvs)<=1.30\ncurrent_counts=collections.Counter(k for b in v8['catalog'] for k\
        \ in b['player_keys'])\nassert len(current_counts)==67 and max(current_counts.values())<=2\npair_first={};slots=[];holds=0;clean=0;replacement_count=0\n\
        verified_pool=set(k for k in v3['players'] if k not in current_counts and verified(k)) if not FIXTURE else set(v3['players'])-set(current_counts)-set(flagged)\n\
        for b in v8['catalog']:\n slot=b['slot'];keys=b['player_keys']; pair=tuple(sorted(keys[:2]));repeat=pair in pair_first\n\
        \ if not repeat:pair_first[pair]=slot\n problems=[]\n if repeat:problems.append('REPEATED_PAIR_REQUIRES_OWNER_DESIGN')\n\
        \ for k in keys:\n  if k in flagged and not (k=='trevor lawrence' and verified(k) and all('team' in f for f in flagged[k])):\n\
        \   problems.append('UNRESOLVED_SOURCE:'+k)\n  if not FIXTURE and not verified(k):problems.append('NOT_STRICTLY_SOURCE_VERIFIED:'+k)\n\
        \ status='SOURCE_SCREENED_REVIEW_ONLY' if not problems else 'HOLD_MANUAL_ELIGIBILITY_OR_REPEAT'\n if not problems:clean+=1\n\
        \ else:holds+=1\n alternatives=[]\n for k in keys:\n  if k not in flagged:continue\n  index=keys.index(k);others=keys[:index]+keys[index+1:]\n\
        \  eligible=[]\n  for candidate in verified_pool:\n   if model[candidate]['pos']!=model[k]['pos']:continue\n   vals=[model[candidate]['value']]+[model[t]['value']\
        \ for t in others]\n   spread=max(vals)/min(vals) if min(vals)>0 else float('inf')\n   if spread>1.30:continue\n \
        \  newkeys=keys.copy();newkeys[index]=candidate\n   newpair=tuple(sorted(newkeys[:2]))\n   if index<2 and newpair\
        \ in pair_first and pair_first[newpair]!=slot:continue\n   eligible.append((round(spread,6),candidate))\n  eligible.sort()\n\
        \  alternatives.append({'flagged_player':k,'position':model[k]['pos'],'possible_substitutes':[{'player':x,'fv_spread_ratio':r}\
        \ for r,x in eligible[:2]],'may_remove_targeted_research_player':True})\n slots.append({'slot':slot,'status':status,'same_position_pair':list(pair),'third_player':keys[2],'original_flagged_players':[k\
        \ for k in keys if k in flagged],'hold_reasons':sorted(set(problems)),'replacement_from_v8':bool(b['replacement_suggested']),'alternative_ideas_research_only':alternatives,'first_pair_occurrence_slot':pair_first[pair]})\n\
        assert len(slots)==28 and clean+holds==28\nassert len(pair_first)==27 and holds>=1\n# A feasible single-slot alternative\
        \ does not mean the options can be jointly applied. No catalog is rewritten.\nsummary={'status':'RESEARCH_ONLY_SOURCE_SCREENED_BALLOT_DECISION_MATRIX','research_only':True,'voting_activated':False,'market_promotion_authorized':False,'owner_approval':False,'source_after_daily_cap_sha256':COHORT,'source_artifact_sha256':{k:v[1]\
        \ for k,v in PINS.items()},'slots':28,'unique_same_position_pairs':len(pair_first),'prior_replacements_verified':11,'original_source_flagged_players':18,'source_screened_review_only_slots':clean,'held_slots':holds,'eligible_alternative_player_pool':len(verified_pool),'provenance_not_publishable':True,'no_sufficiency_threshold_selected':True,'alternative_choices_global_coherence_not_guaranteed':True}\n\
        (OUT/'RESEARCH_ONLY_source_screen_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\\n')\n(OUT/'RESEARCH_ONLY_28_slot_decision_matrix.json').write_text(json.dumps({'summary':summary,'decision_matrix':slots},indent=2,sort_keys=True)+'\\\
        n')\nlines=['# QF11 V9 \u2014 Source-screened Keep/Trade/Cut ballot decision review','', '**NOT VOTER-READY. NO VOTING\
        \ ACTIVATED.**','',f'- Review-only source-screened slots: {clean} / 28',f'- Held slots: {holds} / 28',f'- Retained\
        \ unique same-position pairs: {len(pair_first)} / 28',f'- Existing source-review-flagged players: 18 (historical flags\
        \ are not silently dismissed)',f'- Strictly checked new alternatives from V8: 11', '- Optional replacements are independent\
        \ per-slot proposals; never combine them without an additional global-uniqueness and realism audit.', '- Source-signature\
        \ matches are identity evidence only. They are not permission to reclassify player position or team in the frozen\
        \ valuation model.', '', '## Per-slot decision matrix','', '| Slot | Status | Pair | Third player | Hold reason |',\
        \ '|---:|---|---|---|---|']\nfor x in slots:\n lines.append(f'| {x[\"slot\"]:02d} | {\"SOURCE-SCREENED\" if not x[\"\
        hold_reasons\"] else \"HOLD\"} | {\" / \".join(x[\"same_position_pair\"])} | {x[\"third_player\"]} | {\"; \".join(x[\"\
        hold_reasons\"]) or \"none\"} |')\nlines+=['','## Scope and owner gate','','No voter URLs, no survey activation, no\
        \ published market changes, and no evidence-sufficiency threshold selection. An independent future global catalog\
        \ and human review are required.']\n(OUT/'RESEARCH_ONLY_owner_review.md').write_text('\\n'.join(lines)+'\\n')\nassert\
        \ len(list(OUT.iterdir()))==3\nfor p in OUT.iterdir():\n t=p.read_text()\n assert all(s not in t for s in ('voter_roster_id','sheet_url','raw_ballots'))\n\
        print('QF11_V9_SOURCE_REVIEW_DECISION_GREEN '+json.dumps({'source_screened_review_only':clean,'held':holds,'unique_pairs':len(pair_first),'v8_replacements':11,'historical_flagged':18,'eligible_alternative_pool':len(verified_pool)},sort_keys=True))\n\
        print('QF11_V9_NO_ACTIVATION_HOLD market frozen, no owner approval, no poll issuance')\nQF11_V9_PY\npython3 -m py_compile\
        \ /tmp/qf11-v9-study.py\npython3 /tmp/qf11-v9-study.py"
    - name: Run all 14 unchanged regressions and frozen valuation/market production guards
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/validation/snapshot_values.py --selftest

        python3 scripts/market/build_market_value.py --selftest

        node scripts/team_utility_projection_runtime.js --selftest

        python3 scripts/validation/repo_regression_checks.py

        python3 scripts/validation/validate_free_agent_valuation_parity.py

        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest

        echo ''QF11_V9_14_REPO_REGRESSIONS_GREEN'''
    - name: Ensure no source edits and research-only status
      shell: bash
      run: 'set -euo pipefail

        [[ -z "$(git status --porcelain)" ]] || { git status --short; echo STOP_UNAPPROVED_WRITE; exit 1; }

        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1

        check_blob(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP pinned blob drift $1"; exit 1; }; }

        check_blob index.html c83e3f68d11853c072017e6bd83bb1ad085f4a3e

        check_blob scripts/artifacts/generated/market_values.json 829445174a77ceb4bb19dfd97a725e371d18efe8

        check_blob scripts/artifacts/generated/value_uncertainty.json 9d007a7f053e15dcdc0f694563ca17bc47568e5f

        check_blob scripts/identity_crosswalk.json 3489c01c923474931f4db81e3dd338f437bfdf5f

        check_blob data/players_cache.json 216242d9f87a81c4d1532cca2468c90a52918c3d

        python3 - <<''QF11_V9_HOLD''

        import json

        from pathlib import Path

        r=Path(''/tmp/qf11-v9-output'');names={p.name for p in r.iterdir()}

        assert names=={''RESEARCH_ONLY_source_screen_summary.json'',''RESEARCH_ONLY_28_slot_decision_matrix.json'',''RESEARCH_ONLY_owner_review.md''}

        s=json.loads((r/''RESEARCH_ONLY_source_screen_summary.json'').read_text())

        assert s[''owner_approval''] is False and s[''market_promotion_authorized''] is False and s[''voting_activated'']
        is False

        assert s[''source_screened_review_only_slots'']+s[''held_slots'']==28

        assert s[''held_slots'']>=1 and s[''unique_same_position_pairs'']==27

        print(''QF11_V9_ZERO_WRITE_HOLD_GREEN source and model pinned, no voting, no market updates'')

        QF11_V9_HOLD

        '
    - name: Archive only research decision matrix for owner review (seven-day retention)
      uses: actions/upload-artifact@v4
      with:
        name: QF11-v9-RESEARCH-ONLY-ballot-decision-matrix
        path: /tmp/qf11-v9-output/
        retention-days: 7
        if-no-files-found: error
