name: QF9 V2 - Source Provenance Display Review Candidate
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: trade-desk-data-writes
  cancel-in-progress: false
jobs:
  qf9-v2-review:
    name: Source-only disclosure, no model change, review branch only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QF9_TMP: /tmp/log-qf9-v2
      QF9_REVIEW_BRANCH: qf9-a6a7-provenance-v2-review-2026-10-11
    steps:
    - name: Checkout exact owner-dispatched main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: true
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install existing Chrome regression harness dependency
      shell: bash
      run: |-
        python3 -m pip install --disable-pip-version-check --no-cache-dir requests selenium
    - name: Pin QF8 production, QF9 Green triage, market, and frozen source blobs
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
        [[ -z "$(git status --porcelain)" ]] || exit 1
        git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved'; exit 1; }
        git merge-base --is-ancestor '76cdb5ac64be80fa221697cc2d3975f8de8a9b25' HEAD || { echo 'STOP QF8 lineage missing'; exit 1; }
        blob(){ [[ "$(git hash-object "$1")" == "$2" ]] || { echo "STOP source drift $1"; exit 1; }; }
        blob index.html '93684a734efb0bbc47b6c29cb5b4e859adcd3d1d'
        blob scripts/artifacts/generated/market_values.json '829445174a77ceb4bb19dfd97a725e371d18efe8'
        blob data/league_rosters.json '703ef1f651fc3debad9154001554264cd28086dd'
        blob data/my_roster.json '4b67e08f6c304d9d1e8cda494785875768753532'
        blob .github/workflows/QF9-v1.yml '30e28026bd7a51394270a60cd963d1df8761f087'
        blob scripts/team_utility_projection_runtime.js '1620edf05e56a56b4a874c71b32777a443422de5'
        blob scripts/validation/repo_regression_checks.py '5191e1160c966ed14401b70c86c6f63808e1265d'
        blob free-agent-board.html '975efe51091a2315475678a9db0842b05c4fc3aa'
        blob data/free_agent_utility_v1.json '557b8010082a87113ecf9d5574af108f3044a1e7'
        blob model/releases/free-agent-production-v2/release.json '75c9665c0493d8ac4900479b6802c807aaa45633'
        if git ls-remote --exit-code --heads origin "$QF9_REVIEW_BRANCH" >/dev/null; then echo 'STOP review branch already exists'; exit 1; fi
        echo 'PASS exact QF8 production and QF9 diagnostic source pins; review branch unclaimed'
    - name: Write surgical patch and independent actual-source acceptance programs
      shell: bash
      run: |
        set -euo pipefail
        install -d -m 700 "$QF9_TMP"
        cat > "$QF9_TMP/patch.py" <<'QF9_PATCH_PY'
        #!/usr/bin/env python3
        """QF9 V2: presentation-only source provenance warnings; NO FV/market math changes."""
        from pathlib import Path
        p=Path('index.html'); s=p.read_text(encoding='utf8')
        def once(old,new,label):
         global s
         n=s.count(old)
         assert n==1,(label,'expected one unique anchor, saw',n)
         s=s.replace(old,new,1)

        helper='''/* QF9_A6A7_SOURCE_PROVENANCE_V1
           UI-only provenance. This never changes PLAYER_DB roles/positions, PROD_MULT,
           Fundamental Value, Market Value, vote weights or Team Utility. */
        function qf9StatusConflictFlag(p, existing, key){
          // The single audited stable Sleeper ID 2227 is source-linked; no inference
          // for other people sharing this name or when current source evidence differs.
          if(!p || String(p.player_id)!=='2227' || normalizeName(p.name||'')!=='aaron donald' ||
             p.status!=='Active' || p.team!=='LAR' || !existing ||
             existing.role!=='Speculative' || PROD_MULT[key]!==0.15) return null;
          return 'Sleeper lists Active/LAR; model role remains Speculative with a 0.15 historical production multiplier. Fundamental Value is unchanged pending separate review.';
        }
        function qf9MarketProvenance(row, marketArtifact){
          const e=row && row.evidence && typeof row.evidence==='object' ? row.evidence : {};
          const fields=['same_position_pairwise_observations','same_position_enough_data','dominant_voter_share_pct'];
          const missing=fields.filter(k=>!Object.prototype.hasOwnProperty.call(e,k));
          const quality=marketArtifact && marketArtifact.market_quality;
          const globalShare=quality && quality.largest_effective_voter_share_pct;
          return {
            missing,
            globalShare:Number.isFinite(globalShare)?globalShare:null,
            allMissing:missing.length===fields.length,
          };
        }
        /* QF9_A6A7_SOURCE_PROVENANCE_V1_END */

        '''
        once('function mergeLeagueRosters(data){\n',helper+'function mergeLeagueRosters(data){\n','source helper')
        once('        players.push({ key, slot });\n', '''        const qf9Conflict=qf9StatusConflictFlag(p,existing,key);
                players.push(qf9Conflict ? {key,slot,qf9Conflict} : {key,slot});
        ''','capture stable-ID conflict')
        once('  const bySlot = {};\n  for(const slot of SLOT_ORDER) bySlot[slot] = [];', '''  const qf9Flagged = new Map(team.players.filter(p=>p.qf9Conflict).map(p=>[p.key,p.qf9Conflict]));
          const bySlot = {};
          for(const slot of SLOT_ORDER) bySlot[slot] = [];''','full-roster local flagged registry')
        needle='${injuryBadge(r.info.injury)}${dataQualityFlag(r.key, r.info.pos)}</div>'
        insert='${injuryBadge(r.info.injury)}${dataQualityFlag(r.key, r.info.pos)}${qf9Flagged.has(r.key) ? `<span class="qf9-source-conflict" title="${escapeHtml(qf9Flagged.get(r.key))}"> · Source/model discrepancy; FV unchanged</span>` : \'\'}</div>'
        start=s.index('function renderFullRoster(){')
        end=s.index('/* QF6_A5F04_VISIBLE_STARTER_WARNING_V1',start)
        segment=s[start:end]
        assert segment.count(needle)==1,('full-roster scoped anchor',segment.count(needle))
        s=s[:start]+segment.replace(needle,insert,1)+s[end:]
        once('  const rank = Number(row.market_rank);\n\n  const tooltip = [', '''  const rank = Number(row.market_rank);
          const qf9Provenance=qf9MarketProvenance(row,MARKET_VALUE);

          const tooltip = [''','market provenance')
        once("    'Not blended into Fundamental Value or Team Utility',\n  ].join('\\n');", '''    `Per-player vote-evidence fields not published: ${qf9Provenance.missing.length ? qf9Provenance.missing.join(', ') : 'none'}`,
            `Largest effective-voter share across ALL market votes (not player-specific): ${qf9Provenance.globalShare === null ? 'not published' : qf9Provenance.globalShare.toFixed(4)+'%'}`,
            'Not blended into Fundamental Value or Team Utility',
          ].join('\\n');''','market provenance tooltip')
        once('  return `<div class="asset-market" title="${escapeHtml(tooltip)}">Market ${market.toLocaleString()} · <span style="color:${deltaColor}">${deltaSign}${delta.toLocaleString()}</span></div>`;', '''  return `<div class="asset-market" title="${escapeHtml(tooltip)}">Market ${market.toLocaleString()} · <span style="color:${deltaColor}">${deltaSign}${delta.toLocaleString()}</span>${qf9Provenance.allMissing ? ' · vote detail unpublished' : ''}</div>`;''','visible evidence caveat')
        p.write_text(s,encoding='utf8')
        assert s.count('QF9_A6A7_SOURCE_PROVENANCE_V1')==2
        assert 'function playerValue(pos, age, role, name){' in s
        assert 'const TU_BENCH_WEIGHT = 0.15;' in s
        print('PASS QF9 V2 scoped UI/provenance only patch; one index.html')
        QF9_PATCH_PY
        cat > "$QF9_TMP/qa.js" <<'QF9_QA_JS'
        'use strict';
        const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
        const html=fs.readFileSync('index.html','utf8');
        const market=JSON.parse(fs.readFileSync('scripts/artifacts/generated/market_values.json','utf8'));
        const league=JSON.parse(fs.readFileSync('data/league_rosters.json','utf8'));
        function section(a,b){const i=html.indexOf(a);assert(i>=0,`missing ${a}`);assert.equal(html.indexOf(a,i+1),-1,`ambiguous ${a}`);const j=html.indexOf(b,i+a.length);assert(j>i,`missing ending ${b}`);return html.slice(i,j);}
        const source=[section('/* QF9_A6A7_SOURCE_PROVENANCE_V1\n','function mergeLeagueRosters(data){'),section('function marketValueForPlayer(name, fundamentalValue){','function packageMarketValueSummary(')].join('\n');
        const ctx=vm.createContext({console});
        vm.runInContext(`const PROD_MULT={'aaron donald':0.15};let MARKET_VALUE=null;function normalizeName(x){return String(x).toLowerCase().trim();}function escapeHtml(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}\n`+source,ctx,{timeout:7000});
        const run=code=>vm.runInContext(code,ctx,{timeout:7000});
        const sample=league.rosters.flatMap(team=>['starters','bench','taxi','reserve_ir'].flatMap(slot=>team[slot]||[])).find(p=>p.player_id==='2227');
        assert(sample && sample.status==='Active' && sample.team==='LAR' && sample.name==='Aaron Donald','PINNED real source changed');
        const oldProfile={role:'Speculative',team:'FA'};
        const note=run(`qf9StatusConflictFlag(${JSON.stringify(sample)},${JSON.stringify(oldProfile)},'aaron donald')`);
        assert(note && note.includes('Fundamental Value is unchanged') && note.includes('Active/LAR'));
        for(const alteration of [{player_id:'2226'},{status:'Inactive'},{team:'NYJ'},{name:'Other Donald'}]){
         const f={...sample,...alteration};
         assert.equal(run(`qf9StatusConflictFlag(${JSON.stringify(f)},${JSON.stringify(oldProfile)},'aaron donald')`),null,'false conflict evidence');
        }
        assert.equal(run(`qf9StatusConflictFlag(${JSON.stringify(sample)},{role:'Starter'},'aaron donald')`),null);
        console.log('PASS QF9 A7 actual stable Sleeper 2227 conflict; false ID, name, status or role fails closed');
        assert(market.counts.resolved_market_players===504);
        const rows=Object.values(market.players);
        assert.equal(rows.length,504);
        const fields=['same_position_pairwise_observations','same_position_enough_data','dominant_voter_share_pct'];
        for(const f of fields){ assert.equal(rows.filter(r=>Object.prototype.hasOwnProperty.call(r.evidence||{},f)).length,0,`unexpected evidence coverage for ${f}`); }
        const meta=run(`qf9MarketProvenance(${JSON.stringify(market.players['aaron donald'])},${JSON.stringify({market_quality:market.market_quality})})`);
        assert(meta.allMissing && meta.missing.length===3 && meta.globalShare===market.market_quality.largest_effective_voter_share_pct);
        assert(meta.globalShare>0 && meta.globalShare<100);
        console.log('PASS QF9 A6 504 row-level missing fields; global effective-voter share correctly distinguished from missing pairwise counts');
        run(`MARKET_VALUE=${JSON.stringify(market)}`);
        const htmlRow=run(`marketValueHTML('aaron donald',${market.players['aaron donald'].fundamental_value})`);
        assert(htmlRow.includes('vote detail unpublished')&&htmlRow.includes('ALL market votes')&&htmlRow.includes('not published'));
        assert(!htmlRow.includes('pairwise observations: 0'));
        assert.equal(run(`marketValueHTML('aaron donald',${market.players['aaron donald'].fundamental_value+1})`),'');
        const fresh=run(`qf9MarketProvenance({evidence:{same_position_pairwise_observations:42,same_position_enough_data:true,dominant_voter_share_pct:3.1}},${JSON.stringify({market_quality:market.market_quality})})`);
        assert(!fresh.allMissing && fresh.missing.length===0,'future per-player metadata must not get false missing label');
        assert(html.includes('qf9Flagged.has(r.key)') && html.includes('qf9StatusConflictFlag(p,existing,key)') && html.includes('Source/model discrepancy; FV unchanged'));
        assert(html.includes('const TU_BENCH_WEIGHT = 0.15;')&&html.includes('const TU_ACTIVE_ROSTER_LIMIT = 41;'));
        console.log('PASS QF9 read-only display strings and narrow conditions; no made-up market votes; future evidence supported');
        console.log('QF9_V2_QA_GREEN: presentation-only reviewed candidate; scientific/valuation findings remain open');
        QF9_QA_JS
        cat > "$QF9_TMP/browser.py" <<'QF9_BROWSER_PY'
        """QF9 V2 real browser render test: provenance only; no data-model changes."""
        import json,threading
        from functools import partial
        from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
        from pathlib import Path
        from selenium import webdriver
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.support.ui import WebDriverWait
        class Quiet(SimpleHTTPRequestHandler):
         def log_message(self,*args):pass
        server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory=str(Path.cwd())))
        thread=threading.Thread(target=server.serve_forever,daemon=True);thread.start()
        options=Options()
        for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,900']:options.add_argument(x)
        market=json.loads(Path('scripts/artifacts/generated/market_values.json').read_text())
        try:
         with webdriver.Chrome(options=options) as driver:
          driver.set_page_load_timeout(45)
          driver.get(f'http://127.0.0.1:{server.server_port}/index.html')
          WebDriverWait(driver,25).until(lambda d:d.execute_script("return typeof qf9StatusConflictFlag==='function'&&typeof marketValueHTML==='function'&&typeof renderFullRoster==='function'&&!!document.getElementById('fullRosterWrap')"))
          payload={'players':{'aaron donald':market['players']['aaron donald']},'market_quality':market['market_quality'],'scale_semantics':market['scale_semantics']}
          result=driver.execute_script('''
           MARKET_VALUE=arguments[0];
           const player={name:'Aaron Donald',player_id:'2227',status:'Active',team:'LAR'};
           const notice=qf9StatusConflictFlag(player,{role:'Speculative',team:'FA'},'aaron donald');
           if(!notice) throw Error('real source conflict not detected');
           LEAGUE_ROSTERS={'qf9_fixture':{players:[{key:'aaron donald',slot:'bench',qf9Conflict:notice}]}};
           MY_ROSTER_ID='qf9_fixture';state.teamConfirmed=true;
           renderFullRoster();
           const flag=document.querySelector('#fullRosterWrap .qf9-source-conflict');
           const value=marketValueHTML('aaron donald',arguments[1]);
           const hidden=document.querySelector('.td-retired-team-impact');
           return {flag:flag?.textContent,flagTitle:flag?.title,
              rendered:!!(flag&&flag.textContent.includes('Source/model discrepancy')),
              noValueChange:flag?.textContent.includes('FV unchanged'),
              evidence:value.includes('vote detail unpublished')&&value.includes('ALL market votes'),
              hidden:!!(hidden&&hidden.hidden),
              noFalseFlag:qf9StatusConflictFlag({...player,player_id:'other'},{role:'Speculative'},'aaron donald')===null};
          ''',payload,market['players']['aaron donald']['fundamental_value'])
          assert result['rendered'] and result['noValueChange'] and result['evidence'] and result['noFalseFlag'] and result['hidden'],result
          print('PASS QF9 real Chrome: rendered conditional status discrepancy; provenance-only market detail; legacy impact hidden')
        finally:
         server.shutdown();server.server_close()
        QF9_BROWSER_PY
        python3 - <<'PY_CHECK'
        from pathlib import Path
        import ast,os
        r=Path(os.environ['QF9_TMP'])
        for name in ('patch.py','browser.py'):
         ast.parse((r/name).read_text())
        print('PASS compiled QF9 isolated patch and Chrome scripts')
        PY_CHECK
        node --check "$QF9_TMP/qa.js"
    - name: Apply one-file presentation-only candidate to disposable checkout
      shell: bash
      run: |
        set -euo pipefail
        python3 "$QF9_TMP/patch.py"
        [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP changed beyond index.html'; exit 1; }
        git diff --check
        python3 - <<'PY_CHECK'
        from pathlib import Path
        s=Path('index.html').read_text()
        assert s.count('QF9_A6A7_SOURCE_PROVENANCE_V1')==2
        assert s.count('const TU_BENCH_WEIGHT = 0.15;')==1
        assert s.count('function playerValue(pos, age, role, name){')==1
        assert s.count('function qf9StatusConflictFlag(')==1
        assert s.count('qf9StatusConflictFlag(p,existing,key)')==1
        assert s.count('qf9MarketProvenance(row,MARKET_VALUE)')==1
        print('PASS QF9 one-file provenance-only markup and existing model anchors unchanged')
        PY_CHECK
    - name: 'Test real source: stable player ID, missing vote fields, and FV gating'
      shell: bash
      run: |
        set -euo pipefail
        node "$QF9_TMP/qa.js"
        node scripts/team_utility_projection_runtime.js --selftest
        python3 scripts/projections/build_team_utility_lineup_projections.py --check
    - name: Real Chrome source discrepancy and market evidence rendering
      shell: bash
      run: |
        set -euo pipefail
        python3 "$QF9_TMP/browser.py"
    - name: Run all fourteen repo regression groups and frozen parity controls
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/validation/repo_regression_checks.py
        python3 scripts/validation/validate_free_agent_valuation_parity.py
        python3 scripts/sync/sync_free_agent_valuation.py --check
        python3 scripts/validation/validate_package_adjustment_v2_production.py --selftest
        python3 - <<'PY_IDP'
        import sys
        sys.path.insert(0,'scripts/validation')
        import validate_idp_v1_final_deployment as guard
        r=guard.validate_deployment()
        assert r['actual_changed_entry_count']==320,'STOP IDP 320 immutable changes drift'
        print('PASS frozen IDP 320 changed / 84 held')
        PY_IDP
    - name: Exact diff check and push review-only branch; NEVER main
      shell: bash
      run: |
        set -euo pipefail
        [[ "$(git diff --name-only)" == 'index.html' ]] || { echo 'STOP unexpected changed file'; exit 1; }
        [[ -z "$(git ls-files --others --exclude-standard)" ]] || { echo 'STOP unexpected new source'; exit 1; }
        [[ "$(git hash-object scripts/artifacts/generated/market_values.json)" == '829445174a77ceb4bb19dfd97a725e371d18efe8' ]] || exit 1
        [[ "$(git hash-object scripts/team_utility_projection_runtime.js)" == '1620edf05e56a56b4a874c71b32777a443422de5' ]] || exit 1
        [[ "$(git hash-object free-agent-board.html)" == '975efe51091a2315475678a9db0842b05c4fc3aa' ]] || exit 1
        [[ "$(git hash-object model/releases/free-agent-production-v2/release.json)" == '75c9665c0493d8ac4900479b6802c807aaa45633' ]] || exit 1
        git diff --check
        git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
        [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo 'STOP main moved while testing'; exit 1; }
        if git ls-remote --exit-code --heads origin "$QF9_REVIEW_BRANCH" >/dev/null; then echo 'STOP review branch exists'; exit 1; fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$QF9_REVIEW_BRANCH"
        git add -- index.html
        [[ "$(git diff --cached --name-only)" == 'index.html' ]] || exit 1
        git diff --cached --check
        git commit -m 'QF9: disclose missing market vote provenance and Sleeper status discrepancy (review)'
        git push origin "HEAD:refs/heads/${QF9_REVIEW_BRANCH}"
        echo "QF9_V2_REVIEW_GREEN branch=${QF9_REVIEW_BRANCH} sha=$(git rev-parse HEAD) index=$(git rev-parse HEAD:index.html)"
        echo 'This is a REVIEW branch only. A1, A6-F02 and A7-F03 remain open; NO FV/model change or production promotion authorized.'
    - name: Clean ephemeral scripts
      shell: bash
      run: |-
        rm -rf /tmp/log-qf9-v2
      if: always()
