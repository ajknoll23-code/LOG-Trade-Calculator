name: DLF Prospect FV V2 - Phase 1A Advanced Fundamentals Preregistration
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dlf-prospect-fv-v2-phase1a-advanced-preregistration
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PHASE1B_RUN_ID: '36086444581'
  PHASE1B_ARTIFACT_ID: '10844305566'
  PHASE1B_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1b-v2-identity-preregistration
  PHASE1B_JSON_SHA256: 931a4f894e2c4f1d78b5b1e1be89461862e6ddaf1bc12a21b6eac2c034473f70
  PHASE1D_RUN_ID: '36089222915'
  PHASE1D_ARTIFACT_ID: '10844689777'
  PHASE1D_ARTIFACT_NAME: dlf-prospect-fv-v1-phase1d-closeout
  PHASE1D_JSON_SHA256: e6c4dd2f95ecfe58dd0e68942ef35317485f9613e97703ffef09cbe174d3cd01
  IDENTITY_SHA256: e8d79738530a73f15de0c52990e8f7fbf1e8d4f699448add0f5add11eaa093fb
  DLF_SEMANTIC_SHA256: 4dd07ea9180c11f7f3c80657dfe7274245a683fbb3b3eca2edb92c903c562414
  DLF_STRUCTURE_SHA256: 01e780ede9a21806e7f838ad735ee1c73f2f970766651b276aed9f6215769c10
jobs:
  freeze-v2-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out exact research base
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1
    - name: Guard V1 closeout and canonical rookie baseline lineage
      shell: bash
      run: |
        set -euo pipefail
        check_blob() {
          expected="$1"
          path="$2"
          actual="$(git hash-object "$path")"
          test "$actual" = "$expected" || {
            echo "ERROR lineage drift $path expected=$expected actual=$actual" >&2
            exit 1
          }
          echo "PASS lineage $path $actual"
        }
        check_blob 0edc10f854b9ee5bba0ed74cece7414293acc742 \
          .github/workflows/DLF-Prospect-FV-V1-Phase-1D-Closeout.yml
        check_blob a00ee6f09cb99abf78d79ffb96efa2001083d361 \
          research/no-history-v2/no_history_v2_phase2_prospect_prior.py
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download pre-outcome Phase 1B feature freeze
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1B_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1b
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1B_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Download exact V1 closeout
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PHASE1D_ARTIFACT_NAME }}
        path: ${{ runner.temp }}/phase1d
        repository: ${{ github.repository }}
        run-id: ${{ env.PHASE1D_RUN_ID }}
        github-token: ${{ github.token }}
    - name: Freeze V2 advanced-fundamentals contract
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"${RUNNER_TEMP}/dlf-v2-phase1a\"\npython3 - <<'PY'\nfrom __future__ import annotations\n\
        \nimport hashlib\nimport json\nimport os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nroot\
        \ = Path(os.environ[\"RUNNER_TEMP\"])\np1b_path = root / \"phase1b\" / \"dlf_prospect_fv_v1_phase1b_identity_preregistration.json\"\
        \np1d_path = root / \"phase1d\" / \"dlf_prospect_fv_v1_phase1d_closeout.json\"\nout_dir = root / \"dlf-v2-phase1a\"\
        \nout_dir.mkdir(parents=True, exist_ok=True)\n\nP1B_SHA = os.environ[\"PHASE1B_JSON_SHA256\"]\nP1D_SHA = os.environ[\"\
        PHASE1D_JSON_SHA256\"]\nIDENTITY_SHA = os.environ[\"IDENTITY_SHA256\"]\nDLF_SEMANTIC_SHA = os.environ[\"DLF_SEMANTIC_SHA256\"\
        ]\nDLF_STRUCTURE_SHA = os.environ[\"DLF_STRUCTURE_SHA256\"]\n\nEXPECTED_ADVANCED = {\n    \"QB\": [\n        \"Career.Acc%\"\
        ,\n        \"Career.BTT%\",\n        \"Career.TWP%\",\n        \"Career.Sack%\",\n        \"Best.Acc%\",\n       \
        \ \"Best.BTT%\",\n        \"Best.TWP%\",\n        \"Best.Sack%\",\n    ],\n    \"RB\": [],\n    \"WR\": [\n      \
        \  \"Career.YPRR.Zone\",\n        \"Career.YPRR.Man\",\n        \"Career.Slot Rate\",\n        \"High.Slot Rate\"\
        ,\n    ],\n    \"TE\": [\n        \"Career.Slot Rate\",\n        \"High.Slot Rate\",\n    ],\n}\n\nBASELINE_BY_POSITION\
        \ = {\n    \"QB\": \"position_ols_log_pick\",\n    \"WR\": \"position_ols_log_pick_plus_draft_age\",\n    \"TE\":\
        \ \"position_ols_log_pick\",\n}\n\nELIGIBLE_POSITIONS = (\"QB\", \"WR\", \"TE\")\nEXCLUDED_POSITIONS = (\"RB\",)\n\
        \ndef sha256_bytes(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\ndef canonical_json_bytes(obj)\
        \ -> bytes:\n    return json.dumps(\n        obj,\n        sort_keys=True,\n        separators=(\",\", \":\"),\n \
        \       ensure_ascii=False,\n    ).encode(\"utf-8\")\n\ndef load_exact(path: Path, expected_sha: str) -> dict:\n \
        \   raw = path.read_bytes()\n    actual = sha256_bytes(raw)\n    if actual != expected_sha:\n        raise RuntimeError(\n\
        \            f\"artifact SHA mismatch for {path.name}: expected={expected_sha} actual={actual}\"\n        )\n    return\
        \ json.loads(raw)\n\np1b = load_exact(p1b_path, P1B_SHA)\np1d = load_exact(p1d_path, P1D_SHA)\n\n# Prove the advanced\
        \ feature lists were frozen before any NFL outcomes were used.\nassert p1b[\"decision\"] == \"PASS_IDENTITY_AND_PREREGISTRATION_NO_OUTCOMES_READ\"\
        \nassert p1b[\"identity\"][\"mapped_identity_sha256\"] == IDENTITY_SHA\nassert p1b[\"lineage\"][\"dlf_semantic_sha256\"\
        ] == DLF_SEMANTIC_SHA\nassert p1b[\"lineage\"][\"dlf_structure_sha256\"] == DLF_STRUCTURE_SHA\nassert p1b[\"firewalls\"\
        ][\"weekly_nfl_outcomes_read\"] is False\nassert p1b[\"firewalls\"][\"model_fit_performed\"] is False\nassert p1b[\"\
        firewalls\"][\"feature_selection_used_outcomes\"] is False\nassert p1b[\"firewalls\"][\"current_fv_read_for_selection\"\
        ] is False\nassert p1b[\"firewalls\"][\"ktc_read\"] is False\nassert p1b[\"firewalls\"][\"dlf_adp_read\"] is False\n\
        assert p1b[\"firewalls\"][\"dlf_rankings_read\"] is False\nassert p1b[\"firewalls\"][\"dlf_trade_values_read\"] is\
        \ False\n\nactual_advanced = {\n    pos: list(p1b[\"feature_contract\"][pos][\"advanced_secondary\"][\"eligible_features\"\
        ])\n    for pos in (\"QB\", \"RB\", \"WR\", \"TE\")\n}\nif actual_advanced != EXPECTED_ADVANCED:\n    raise RuntimeError(\n\
        \        \"pre-outcome advanced-secondary feature set changed: \"\n        f\"expected={EXPECTED_ADVANCED} actual={actual_advanced}\"\
        \n    )\n\n# Prove V1 is closed and the temporal holdout remains pristine.\nassert p1d[\"decision\"] == \"CLOSE_DLF_PROSPECT_FV_V1_NO_INCREMENTAL_SIGNAL\"\
        \nassert p1d[\"lineage\"][\"mapped_identity_sha256\"] == IDENTITY_SHA\nassert p1d[\"firewalls\"][\"2024_temporal_confirmation_opened\"\
        ] is False\nassert p1d[\"firewalls\"][\"nfl_2025_outcomes_read\"] is False\nassert p1d[\"firewalls\"][\"production_change_authorized\"\
        ] is False\nassert p1d[\"interpretation\"][\"future_study_rule\"].startswith(\"Any DLF V2\")\n\nv2_features = {\n\
        \    pos: EXPECTED_ADVANCED[pos]\n    for pos in ELIGIBLE_POSITIONS\n}\nv2_feature_sha = sha256_bytes(canonical_json_bytes(v2_features))\n\
        \nresult = {\n    \"schema_version\": 1,\n    \"study_id\": \"dlf-prospect-fv-v2-advanced-fundamentals\",\n    \"\
        phase\": \"1A_preregistration_freeze\",\n    \"decision\": \"FREEZE_DLF_V2_ADVANCED_FUNDAMENTALS_BEFORE_ADVANCED_OUTCOME_TEST\"\
        ,\n    \"generated_at_utc\": datetime.now(timezone.utc).isoformat(),\n    \"scientific_status\": (\n        \"New\
        \ post-V1 hypothesis. 2018-2023 is development only because V1 outcomes \"\n        \"are already known. The untouched\
        \ 2024 draft cohort is the only temporal \"\n        \"confirmation set for V2.\"\n    ),\n    \"lineage\": {\n  \
        \      \"phase1b_preoutcome_run_id\": int(os.environ[\"PHASE1B_RUN_ID\"]),\n        \"phase1b_preoutcome_artifact_id\"\
        : int(os.environ[\"PHASE1B_ARTIFACT_ID\"]),\n        \"phase1b_preoutcome_json_sha256\": P1B_SHA,\n        \"phase1d_closeout_run_id\"\
        : int(os.environ[\"PHASE1D_RUN_ID\"]),\n        \"phase1d_closeout_artifact_id\": int(os.environ[\"PHASE1D_ARTIFACT_ID\"\
        ]),\n        \"phase1d_closeout_json_sha256\": P1D_SHA,\n        \"dlf_semantic_sha256\": DLF_SEMANTIC_SHA,\n    \
        \    \"dlf_structure_sha256\": DLF_STRUCTURE_SHA,\n        \"mapped_identity_sha256\": IDENTITY_SHA,\n    },\n   \
        \ \"position_scope\": {\n        \"eligible_positions\": list(ELIGIBLE_POSITIONS),\n        \"excluded_positions\"\
        : {\n            \"RB\": (\n                \"No pre-outcome advanced_secondary DLF feature passed the frozen \"\n\
        \                \"coverage gate. RB may not be rescued by promoting V1 features after \"\n                \"V1 outcomes\
        \ were observed.\"\n            ),\n        },\n    },\n    \"frozen_advanced_features\": {\n        \"by_position\"\
        : v2_features,\n        \"sha256\": v2_feature_sha,\n        \"feature_counts\": {p: len(v2_features[p]) for p in\
        \ ELIGIBLE_POSITIONS},\n        \"source_rule\": (\n            \"Only Phase 1B features already classified as advanced_secondary\
        \ and \"\n            \"coverage-eligible before NFL outcomes were read are permitted.\"\n        ),\n        \"no_feature_addition_or_removal_after_freeze\"\
        : True,\n    },\n    \"explicit_exclusions\": [\n        \"all V1 basic-production features\",\n        \"all V1 raw\
        \ athletic/combine features\",\n        \"all DLF composite grades\",\n        \"all DLF fantasy-point/PPG fields\"\
        ,\n        \"all .F4 fields\",\n        \"all breakout BOY/BOA fields\",\n        \"WaSS\",\n        \"Burst Score\"\
        ,\n        \"DLF ADP\",\n        \"DLF rankings\",\n        \"DLF trade values\",\n        \"DLF Trade Analyzer or\
        \ Trade Finder outputs\",\n        \"KTC or other dynasty-market values\",\n        \"nonlinear interactions or archetypes\
        \ in V2 primary\",\n    ],\n    \"preregistration\": {\n        \"development_draft_years\": [2018, 2019, 2020, 2021,\
        \ 2022, 2023],\n        \"development_outer_validation\": \"leave one entire draft year out; 6 folds\",\n        \"\
        sealed_temporal_confirmation\": {\n            \"draft_year\": 2024,\n            \"required_stat_seasons\": [2024,\
        \ 2025],\n            \"unlock_rule\": (\n                \"2025 weekly outcomes may not be downloaded or opened unless\
        \ every \"\n                \"V2 development gate passes.\"\n            ),\n            \"confirmation_gate\": (\n\
        \                \"On the frozen 2024 cohort across QB/WR/TE, candidate pooled MAE \"\n                \"must be strictly\
        \ lower than baseline pooled MAE.\"\n            ),\n        },\n        \"prospective_classes_not_evaluated_in_v2\"\
        : [2025, 2026],\n        \"primary_target\": (\n            \"custom-scored first-two-NFL-season points / scheduled\
        \ team games; \"\n            \"exact canonical No-History/Rookie V2 target\"\n        ),\n        \"baseline_by_position\"\
        : BASELINE_BY_POSITION,\n        \"candidate_implementation\": {\n            \"framework\": (\n                \"\
        Fit the exact frozen No-History/Rookie V2 baseline by position. \"\n                \"DLF advanced features may only\
        \ predict residual error left by the \"\n                \"baseline and may not replace, reweight, or recalibrate\
        \ the baseline.\"\n            ),\n            \"residual_target\": \"actual points_per_team_game minus baseline_prediction\"\
        ,\n            \"ridge\": {\n                \"alpha\": 10.0,\n                \"fit_intercept\": False,\n       \
        \         \"alpha_selection\": \"fixed before advanced-outcome testing; no tuning\",\n                \"candidate_prediction\"\
        : (\n                    \"max(0, baseline_prediction + advanced_dlf_residual_correction)\"\n                ),\n\
        \            },\n            \"preprocessing_inside_training_fold_only\": [\n                \"numeric median imputation\
        \ for each frozen advanced feature\",\n                \"one missingness indicator per frozen advanced feature\",\n\
        \                \"z-score imputed feature values using training-fold mean/std\",\n                \"z-score missingness\
        \ indicators using training-fold mean/std\",\n                \"drop transformed columns only for zero training-fold\
        \ variance\",\n                \"held-out draft year contributes no preprocessing statistics\",\n            ],\n\
        \        },\n        \"metrics\": {\n            \"primary\": \"MAE\",\n            \"secondary\": [\"RMSE\", \"Spearman\"\
        ],\n        },\n        \"paired_uncertainty\": {\n            \"method\": (\n                \"paired player-level\
        \ bootstrap of absolute-error difference \"\n                \"(candidate minus baseline)\"\n            ),\n    \
        \        \"replicates\": 10000,\n            \"seed\": 20260925,\n            \"confidence_interval\": \"95% percentile\"\
        ,\n        },\n        \"development_success_gate_all_required\": [\n            \"pooled QB/WR/TE MAE relative improvement\
        \ >= 2.0%\",\n            \"95% paired-bootstrap CI upper bound for candidate-minus-baseline absolute error < 0\"\
        ,\n            \"candidate MAE lower than baseline in at least 4 of 6 held-out draft-year folds\",\n            \"\
        no eligible position MAE worsens by more than 5.0% relative\",\n            \"at least 2 of 3 eligible positions improve\
        \ MAE\",\n        ],\n        \"secondary_metrics_cannot_rescue_primary_failure\": True,\n        \"rb_behavior\"\
        : \"RB remains exact baseline-only and is not part of V2 success scoring\",\n        \"deployment_rule\": (\n    \
        \        \"Even development + 2024 confirmation success would establish historical \"\n            \"incremental signal\
        \ only. No FV production weight or deployment is \"\n            \"authorized without a separate prospective/deployment\
        \ study.\"\n        ),\n    },\n    \"future_scope_if_v2_fails\": (\n        \"Transparent archetype or nonlinear-interaction\
        \ research would be a separate \"\n        \"V3 hypothesis and may not reuse the 2024 holdout if V2 opens it.\"\n\
        \    ),\n    \"firewalls\": {\n        \"nfl_outcomes_read_in_this_phase\": False,\n        \"advanced_metrics_fit_to_outcomes_in_this_phase\"\
        : False,\n        \"2024_temporal_holdout_opened\": False,\n        \"nfl_2025_outcomes_read\": False,\n        \"\
        market_data_can_enter_fv\": False,\n        \"production_change_authorized\": False,\n    },\n}\n\nout_json = out_dir\
        \ / \"dlf_prospect_fv_v2_phase1a_preregistration.json\"\nout_md = out_dir / \"dlf_prospect_fv_v2_phase1a_preregistration.md\"\
        \nout_json.write_text(json.dumps(result, indent=2, sort_keys=True) + \"\\n\")\n\nmd = [\n    \"# DLF Prospect FV V2\
        \ \u2014 Phase 1A Advanced Fundamentals Preregistration\",\n    \"\",\n    \"**Decision:** `FREEZE_DLF_V2_ADVANCED_FUNDAMENTALS_BEFORE_ADVANCED_OUTCOME_TEST`\"\
        ,\n    \"\",\n    \"V2 is a new post-V1 hypothesis. The feature family itself was frozen before \"\n    \"V1 outcomes:\
        \ only the old `advanced_secondary` variables are eligible.\",\n    \"\",\n    \"## Position scope\",\n    \"\",\n\
        \    \"- QB: **8** frozen advanced features\",\n    \"- WR: **4** frozen advanced features\",\n    \"- TE: **2** frozen\
        \ advanced features\",\n    \"- RB: **excluded** \u2014 zero pre-outcome advanced-secondary variables passed coverage\"\
        ,\n    \"\",\n    \"## Frozen features\",\n    \"\",\n]\nfor pos in ELIGIBLE_POSITIONS:\n    md.append(f\"### {pos}\"\
        )\n    for feature in v2_features[pos]:\n        md.append(f\"- `{feature}`\")\n    md.append(\"\")\n\nmd.extend([\n\
        \    f\"V2 advanced feature SHA-256: `{v2_feature_sha}`\",\n    \"\",\n    \"## Study design\",\n    \"\",\n    \"\
        - Development: **2018\u20132023**, six leave-one-draft-year-out folds\",\n    \"- Temporal confirmation: **2024**\"\
        ,\n    \"- 2025 weekly outcomes stay sealed unless all development gates pass\",\n    \"- Ridge alpha: **10**, fixed\"\
        ,\n    \"- DLF can only model residual error from the existing baseline\",\n    \"- No feature selection, tuning,\
        \ composites, basic production, combine metrics, \"\n    \"market values, or nonlinear interactions\",\n    \"\",\n\
        \    \"## Development gates\",\n    \"\",\n])\nfor gate in result[\"preregistration\"][\"development_success_gate_all_required\"\
        ]:\n    md.append(f\"- {gate}\")\n\nmd.extend([\n    \"\",\n    \"Passing V2 would still not authorize production\
        \ deployment or a blend weight.\",\n    \"\",\n    \"No NFL outcome data was opened in this preregistration phase.\"\
        ,\n])\n\nout_md.write_text(\"\\n\".join(md) + \"\\n\")\n\nprint(json.dumps({\n    \"decision\": result[\"decision\"\
        ],\n    \"eligible_positions\": list(ELIGIBLE_POSITIONS),\n    \"excluded_positions\": list(EXCLUDED_POSITIONS),\n\
        \    \"feature_counts\": result[\"frozen_advanced_features\"][\"feature_counts\"],\n    \"v2_feature_sha256\": v2_feature_sha,\n\
        \    \"development_years\": result[\"preregistration\"][\"development_draft_years\"],\n    \"sealed_confirmation_year\"\
        : 2024,\n    \"outcomes_read\": False,\n    \"nfl_2025_outcomes_read\": False,\n}, indent=2))\nPY"
    - name: Prove V2 preregistration made no repository changes
      shell: bash
      run: |-
        set -euo pipefail
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        echo 'PASS: DLF V2 preregistration is outcome-blind and repo-clean.'
    - name: Upload V2 preregistration freeze
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dlf-prospect-fv-v2-phase1a-preregistration
        path: ${{ runner.temp }}/dlf-v2-phase1a/
        if-no-files-found: error
        retention-days: 30
